  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: ru
  text: Если ты сделаешь это[a] и Бог повелит тебе так поступить, ты сможешь выдержать[b], и весь этот народ тоже разойдётся по своим местам с миром[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделаешь это дело»; возможно также: «осуществишь этот замысел».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сможешь стоять»; по смыслу — выдержать нагрузку, устоять.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и весь этот народ также придёт на своё место с миром». Единственное число употреблено при собирательном слове «народ»; смысл может быть распределительным: каждый придёт на своё место. «С миром» может также означать «благополучно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶת־הַדָּבָר הַזֶּה תַּעֲשֶׂה
  choice: Если ты сделаешь это
  rationale: Начальное אִם вводит условие, а דָּבָר здесь обозначает предложенное Иофором дело или порядок действий. Краткое «это» естественно отсылает к предшествующему совету; варианты значения отмечены в сноске.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: и Бог повелит тебе так поступить
  rationale: צוה передано обычным значением «повелеть». Добавление «так поступить» по-русски ясно связывает Божье повеление с предложенным действием, не представляя совет Иофора независимым от Божьей воли.
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: ты сможешь выдержать
  rationale: יכל с инфинитивом выражает способность, а עמד буквально значит «стоять». В данном контексте речь идёт о способности Моисея выдержать нагрузку и продолжать служение; буквальный образ сохранён в сноске.
- source_word: כָּל־הָעָם הַזֶּה
  choice: весь этот народ
  rationale: Сохранены собирательное единственное число עָם и указательное значение «этот».
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: вернётся на своё место
  rationale: בוא может означать движение «приходить/идти» в зависимости от точки отсчёта. В контексте люди уходят от Моисея туда, где им надлежит быть, поэтому «вернётся» естественно передаёт смысл, а единственное «своё место» согласовано с собирательным «народ» и сохраняет форму оригинала.
- source_word: בְשָׁלוֹם
  choice: с миром
  rationale: Широкое значение שָׁלוֹם включает мир, благополучие и безопасность. Устойчивое русское выражение «с миром» сохраняет эту смысловую ёмкость.
theological_decisions:
- issue: Отношение совета Иофора к Божьему повелению
  choice: 'Обе части поняты как единое условие: Моисей сможет выдержать нагрузку, если последует совету и Бог повелит ему так поступить.'
  alternative: 'Фразу можно понять менее строго условно: «и Бог повелит тебе» как последующее действие или пожелание о Божьем повелении.'
  rationale: Начальное אִם естественно распространяется на две соединённые части. Такое прочтение сохраняет зависимость совета Иофора от Божьего повеления, не утверждая, что Иофор сам наделяет план окончательной властью.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского повествования звучанием. Синтаксис сохраняет условную структуру еврейского текста, но избегает неестественных для русского буквальных оборотов. «С миром» оставлено как ёмкое и привычное выражение, а буквальные образы и возможные альтернативы вынесены в сноски.
