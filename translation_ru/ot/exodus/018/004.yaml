  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: ru
  text: А другого звали Елиезер[a], потому что Бог моего отца был моей помощью и избавил меня от меча фараона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Елиезер» означает «Бог мой — помощь».
    reason: Поясняет словесную связь между именем и приведённой далее причиной его выбора.
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: А другого звали
  rationale: В контексте после имени первого сына הָאֶחָד обозначает другого из двух. Русская конструкция «другого звали» естественно передаёт формулу именования, сохраняя присоединительное וְ словом «А».
- source_word: אֱלִיעֶזֶר
  choice: Елиезер
  rationale: Использована закрепившаяся русская форма библейского имени; его значение связано с последующим объяснением о Божьей помощи.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание, по которому ребёнку было дано это имя.
- source_word: אֱלֹהֵי אָבִי
  choice: Бог моего отца
  rationale: Точно и естественно передаёт конструкцию принадлежности, не добавляя уточнений о личности отца или заветных отношениях.
- source_word: בְּעֶזְרִי
  choice: был мне помощником
  rationale: Сохраняет именную образность слова עֵזֶר («помощь, помощник») и её созвучие со значением имени Елиезер; прошедшее время соответствует последующему рассказу об избавлении.
- source_word: וַיַּצִּלֵנִי
  choice: и избавил меня
  rationale: Передаёт совершённое спасение от смертельной угрозы; «избавил» уместно в современном литературном и библейском регистре.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: от меча фараона
  rationale: Сохраняет образ меча как выражение смертельной власти или угрозы фараона, не сводя его к буквальному оружию.
theological_decisions:
- issue: Отсутствие явного глагола речи в объяснении имени
  choice: Не добавлять «он сказал» и передать объяснение непосредственно после «потому что»
  alternative: Добавить «он сказал», представив последующие слова как прямую речь Моисея
  rationale: В еврейском тексте нет глагола речи. Прямое причинное присоединение сохраняет неоднозначность между формулой именования и авторским пояснением и не вводит отсутствующую в источнике прямую речь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка проста для обычного читателя; синтаксис еврейского оригинала передан естественно, без добавления глагола речи.
