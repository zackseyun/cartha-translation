  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: ru
  text: И отпустил Моисей своего тестя[a], и тот отправился в свою землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отослал своего тестя».'
    reason: 'Лексическая альтернатива: שׁלח в пиэле может передавать как отпускание, так и отсылку человека.'
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: отпустил
  rationale: В породе пиэль с личным дополнением глагол означает «отослать, отпустить». «Отпустил» естественно передаёт разрешённое или оформленное отправление в путь, не добавляя идеи изгнания.
- source_word: חֹתְנוֹ
  choice: своего тестя
  rationale: В данном контексте речь идёт об Иофоре, отце жены Моисея; современное русское «тесть» точно выражает это родство.
- source_word: וַיֵּלֶךְ לוֹ
  choice: и тот отправился
  rationale: Местоименное לוֹ здесь входит в идиоматическое обозначение ухода и не требует отдельного перевода. «Тот» ясно указывает на тестя как подлежащее, а «отправился» естественно передаёт начало обратного пути.
- source_word: אֶל אַרְצוֹ
  choice: в свою землю
  rationale: «Земля» сохраняет широкий смысл אֶרֶץ и не привносит современного понятия государства; возвратное «свою» однозначно соотносит владение с тестем.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Союз «и» сохраняет последовательность древнееврейского рассказа; «тот» устраняет возможную неясность относительно того, кто отправился.
