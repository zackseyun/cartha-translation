source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: ru
  text: Затем Иофор, тесть Моисея, принёс всесожжение и жертвы Богу. Аарон и все старейшины Израиля пришли разделить трапезу[a] с тестем Моисея пред Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть хлеб»; это выражение может означать совместную трапезу.'
    reason: Сохранить для читателя конкретную еврейскую формулировку, тогда как основной текст передаёт её идиоматический смысл.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: принёс
  rationale: Основное значение לקח — «взял», но при названиях жертв буквальное «взял всесожжение» по-русски неестественно. «Принёс» ясно передаёт действие в жертвенном контексте, не утверждая сверх текста, кто именно совершил обряд.
- source_word: חֹתֵן מֹשֶׁה
  choice: тесть Моисея
  rationale: В данном повествовательном контексте חֹתֵן обозначает отца жены Моисея; современное русское «тесть» точно и естественно.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Это установившееся русское обозначение жертвы, сжигаемой целиком; оно точно передаёт специальный культовый термин.
- source_word: זְבָחִים
  choice: жертвы
  rationale: Общий термин во множественном числе сохранён отдельно от конкретного вида жертвы — всесожжения.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: Дательный падеж естественно передаёт посвящение жертв Богу и соответствует предлогу ל в данном контексте.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: Аарон и все старейшины Израиля пришли
  rationale: Хотя еврейский глагол формально стоит в единственном числе перед составным подлежащим, русское согласование требует множественного числа.
- source_word: לֶאֱכָל לֶחֶם
  choice: разделить трапезу
  rationale: Буквально «есть хлеб»; это еврейская идиома совместной еды. «Разделить трапезу» естественно передаёт и приём пищи, и совместный характер действия.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: с тестем Моисея
  rationale: Сохранено повторное родственное обозначение, как в еврейском тексте, вместо замены его именем Иофора.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: пред Богом
  rationale: «Пред Богом» кратко и торжественно передаёт значение «перед лицом / в присутствии Бога», не уточняя характер присутствия.
theological_decisions:
- issue: Характер совместной еды после жертвоприношения
  choice: Текст изображает совместную трапезу в присутствии Бога, связанную с принесёнными жертвами, но не называет её прямо заветной трапезой.
  alternative: Понять выражение лишь как сообщение о том, что они ели обычный хлеб.
  rationale: Жертвенный контекст и слова «пред Богом» указывают на сакральное измерение трапезы, однако перевод не вводит отсутствующий в стихе технический термин.
- issue: Референт אֱלֹהִים
  choice: Бог
  alternative: боги
  rationale: Контекст повествования об Иофоре и Боге Израиля требует единственного личного референта; форма с артиклем в заключительной фразе также поддерживает определённое «Бог».
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Пред Богом» и «всесожжение» сохраняют сакральную окраску; синтаксис остаётся ясным для обычного читателя.
