lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: На следующий день
  rationale: Еврейская повествовательная формула вводит очередное событие, произошедшее на следующий день. В современном русском отдельная передача וַיְהִי была бы тяжеловесной и избыточной, поэтому последовательность естественно выражена временным оборотом.
- source_word: וַיֵּשֶׁב
  choice: сел
  rationale: Глагол ישב сохраняет конкретный образ Моисея, занявшего место для исполнения судебной обязанности.
- source_word: לִשְׁפֹּט
  choice: судить
  rationale: Инфинитив שפט здесь обозначает разбирательство дел и вынесение решений; «судить» прямо передаёт этот смысл, не сужая его до одной административной функции.
- source_word: הָעָם
  choice: народ
  rationale: עם обозначает израильское сообщество как единое целое; «народ» — точное и естественное соответствие.
- source_word: וַיַּעֲמֹד
  choice: стоял
  rationale: Единственное число согласуется с собирательным существительным «народ» и сохраняет буквальный образ длительного ожидания стоя.
- source_word: עַל מֹשֶׁה
  choice: перед Моисеем
  rationale: Предлог עַל буквально имеет значения «на, над, при», но в сочетании с עמד в данном контексте описывает людей, стоящих перед Моисеем в ожидании суда. В сноске сохранена возможная более пространственная передача.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: с утра до вечера
  rationale: Устойчивый современный русский оборот точно передаёт полный временной промежуток.
