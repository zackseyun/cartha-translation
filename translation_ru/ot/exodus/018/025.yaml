base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: ru
  text: 'Моисей выбрал из всего Израиля способных людей и поставил их начальниками над народом: начальниками над тысячами, начальниками над сотнями, начальниками над пятьюдесятью и начальниками над десятками.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: выбрал
  rationale: Глагол בחר прямо означает выбор или отбор; «выбрал» естественно передаёт последовательное повествовательное действие.
- source_word: אַנְשֵׁי חַיִל
  choice: способных людей
  rationale: В данном судебно-административном контексте выражение указывает прежде всего на пригодность, компетентность и испытанные качества, а не на воинскую доблесть.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: из всего Израиля
  rationale: Фраза означает, что отбор производился из среды всего народа Израиля.
- source_word: וַיִּתֵּן אֹתָם רָאשִׁים
  choice: поставил их во главе
  rationale: נתן здесь выражает назначение, а רָאשִׁים метафорически обозначает руководителей; русская конструкция сохраняет образ «главы» и звучит естественно.
- source_word: עַל הָעָם
  choice: народа
  rationale: В сочетании «во главе народа» значение власти над народом передаётся естественной русской конструкцией без буквального воспроизведения предлога.
- source_word: שָׂרֵי
  choice: начальниками над
  rationale: שַׂר обозначает наделённого властью руководителя или должностное лицо. «Начальники» подходит для многоуровневой административной структуры и не придаёт ей исключительно военного характера.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: тысячами, сотнями, пятьюдесятью и десятками
  rationale: Прямое числовое обозначение сохраняет описанную в еврейском тексте иерархию групп.
