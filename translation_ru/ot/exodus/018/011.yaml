base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: ru
  text: Теперь я знаю, что Яхве превыше всех богов[a], ибо в том деле, в котором они надменно поступали против них, Он оказался выше их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза в еврейском тексте сжата и трудна. Возможен также перевод: «ибо именно в том, в чём они надменно поступали против них». Вероятно, речь идёт о надменном обращении египтян с израильтянами, однако в самом еврейском тексте эти участники прямо не названы.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: Теперь я знаю
  rationale: Передаёт нынешний вывод Иофора, к которому он пришёл на основании недавних событий; совершенная форма выражает достигнутое знание.
- source_word: גָדוֹל יְהוָה מִכָּל הָאֱלֹהִים
  choice: Яхве превыше всех богов
  rationale: Конструкция с מִן имеет сравнительное значение. «Превыше» естественно и достойно выражает превосходство, а личное имя יהוה передано как «Яхве».
- source_word: בַדָּבָר אֲשֶׁר
  choice: именно в том, в чём
  rationale: בַדָּבָר может обозначать дело, обстоятельство или сферу действия; усиление «именно» передаёт вероятный смысл воздаяния в той же области, где проявилась надменность.
- source_word: זָדוּ
  choice: надменно поступали
  rationale: Глагол от זיד/זוד обозначает гордое, дерзкое или самонадеянное действие.
- source_word: עֲלֵיהֶם
  choice: с израильтянами
  rationale: Предлог עַל при данном глаголе естественно понимается как направленность враждебного, надменного действия против людей; контекст указывает на угнетаемый Израиль, хотя местоименный референт в сжатой еврейской фразе прямо не назван.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Смысл трудной заключительной фразы
  choice: это открылось именно в том, в чём египтяне надменно поступали с израильтянами
  alternative: ибо в том деле, в котором они надменно поступали против них, Он был превыше их
  rationale: 'Еврейская фраза эллиптична и допускает несколько синтаксических разборов. Основной текст передаёт наиболее вероятную контекстуальную мысль: превосходство Яхве обнаружилось в Его ответе на надменное обращение египтян с Израилем, не вводя в текст отсутствующее явное сказуемое «Он был превыше их».'
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Эллипсис оригинала раскрыт ровно настолько, чтобы фраза была понятна; неоднозначность отмечена в сноске.
