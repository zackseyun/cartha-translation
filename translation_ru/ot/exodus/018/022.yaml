base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: ru
  text: Пусть они судят народ во всякое время. Всякое важное дело пусть передают тебе, а всякое малое дело пусть решают сами. Так облегчи себе ношу[a], и они будут нести её вместе с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «облегчи [то, что лежит] на тебе, и они будут нести с тобой»; «ноша» и её подразумеваемое несение относятся к бремени разбора дел народа.'
    reason: Существительное «ноша» прямо не выражено в еврейском тексте; оно подразумевается контекстом и глаголами «облегчи» и «нести».
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Пусть они судят народ
  rationale: Глагол שׁפט здесь означает разбирать споры и выносить решения; форма в контексте наставления передана естественной русской побудительной конструкцией.
- source_word: בְּכָל־עֵת
  choice: во всякое время
  rationale: 'Сохранено прямое временное значение: эти судьи должны быть постоянно доступны для разбора дел.'
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: всякое важное дело
  rationale: דבר в данном судебном контексте — «дело», а буквальное «большое» естественно передаётся как «важное», без чрезмерно узкого юридического уточнения.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: пусть передают тебе
  rationale: Речь идёт о передаче Моисею дела для решения; «передают» по-русски естественнее буквального «приносят» и сохраняет административно-судебный смысл.
- source_word: כָּל־הַדָּבָר הַקָּטֹן
  choice: всякое малое дело
  rationale: Сохранена антитеза «важное/малое»; «малое дело» понятно в контексте и не сужает значение до формального судебного производства.
- source_word: יִשְׁפְּטוּ הֵם
  choice: пусть решают сами
  rationale: Местоимение הֵם подчёркивает, что малые дела должны решать именно назначенные судьи; «сами» передаёт это ударение.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: Так облегчи себе ношу
  rationale: הָקֵל — повелительная форма Hiphil «облегчи». Существительное «ноша» подразумевается образом снятия тяжести «с тебя» и делает русскую фразу естественной.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: и они будут нести её вместе с тобой
  rationale: נשׂא означает «нести»; местоимение «её» отсылает к явно названной в переводе ноше, тогда как в еврейском объект подразумевается.
