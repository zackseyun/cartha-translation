lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Вав-последовательный продвигает повествование; в современном русском повторяющийся союз «и» здесь можно естественно опустить.
- source_word: חֹתֵן מֹשֶׁה
  choice: тесть Моисея
  rationale: Конструктивная цепь обозначает родственника Моисея по браку; по контексту естественный и точный русский эквивалент — «тесть Моисея».
- source_word: אֵלָיו
  choice: ему
  rationale: Местоимение относится к Моисею; «ему» прямо передаёт еврейскую форму без ненужного повторения имени.
- source_word: לֹא טוֹב
  choice: нехорошо
  rationale: Сохраняется широкая оценочная сила טוֹב без сужения значения до «неправильно» или «неполезно».
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: то, что ты делаешь
  rationale: Естественная русская передача буквального «дело, которое ты делаешь»; причастие עֹשֶׂה указывает на продолжающееся действие.
