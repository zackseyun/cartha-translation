- from: А ты высмотри среди всего народа способных мужчин[a], боящихся Бога, людей правдивых[b], ненавидящих неправедную наживу[c], и поставь их над народом начальниками тысяч, начальниками сотен, начальниками пятидесятков и начальниками десятков.
  to: А ты выбери из всего народа способных мужчин, боящихся Бога, честных и надёжных людей, ненавидящих неправедную наживу, и поставь их над народом начальниками тысяч, начальниками сотен, начальниками пятидесятков и начальниками десятков.
