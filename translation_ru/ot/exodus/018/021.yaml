review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: речь об отборе мужчин из народа по нравственным и практическим качествам и о назначении их руководителями подразделений различной численности. Однако «высмотри» в современном литературном русском звучит разговорно и не вполне уместно в наставлении; нейтральное «выбери» точнее передаёт контекстуальное значение תֶחֱזֶה. «Правдивых» преимущественно означает не склонных лгать и несколько сужает אֱמֶת, включающее также честность, верность и надёжность.'
  naturalness: Предлагаемая редакция сохраняет умеренно возвышенный библейский регистр, но избегает стилистически маркированного «высмотри». Сочетание «честных и надёжных людей» естественно по-русски и передаёт широкий смысл еврейского выражения; буквальный образ отмечен в сноске.
  terminology: «Боящихся Бога», «неправедную наживу» и «начальниками тысяч/сотен/пятидесятков/десятков» можно сохранить. «Способных мужчин» уместно передаёт אַנְשֵׁי חַיִל в данном административно-судебном контексте и сохраняет мужской род источника.
  issues:
  - severity: medium
    issue: «Высмотри»
    rationale: Слово может означать «присмотреть, отыскать», но в современном литературном русском имеет разговорный или бытовой оттенок и хуже выражает предписанный отбор. В контексте תֶחֱזֶה естественно передать как «выбери».
  - severity: medium
    issue: «Людей правдивых» для אַנְשֵׁי אֱמֶת
    rationale: «Правдивый» главным образом характеризует правдивость речи, тогда как אֱמֶת охватывает честность, верность и надёжность. Более широкий смысл следует отразить в тексте, сохранив буквальный вариант в примечании.
  revised_text: А ты выбери из всего народа способных мужчин, боящихся Бога, честных и надёжных людей, ненавидящих неправедную наживу, и поставь их над народом начальниками тысяч, начальниками сотен, начальниками пятидесятков и начальниками десятков.
