  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: ru
  text: А ты выбери из всего народа способных мужчин, боящихся Бога, честных и надёжных людей, ненавидящих неправедную наживу, и поставь их над народом начальниками тысяч, начальниками сотен, начальниками пятидесятков и начальниками десятков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: высмотри
  rationale: Глагол буквально связан со зрением, но здесь означает внимательное распознавание и отбор подходящих людей; «высмотри» сохраняет образ исходного слова и естественно выражает поиск с последующим выбором.
- source_word: מִכָּל־הָעָם
  choice: среди всего народа
  rationale: 'Передаёт партитивный смысл: кандидатов следует отобрать из всего народа.'
- source_word: אַנְשֵׁי חַיִל
  choice: способных мужчин
  rationale: В данном судебно-административном контексте חַיִל указывает прежде всего на силу характера, состоятельность и компетентность, а не только на воинскую доблесть; мужской род исходного выражения сохранён.
- source_word: יִרְאֵי אֱלֹהִים
  choice: боящихся Бога
  rationale: Передаёт благоговейный страх перед Богом как нравственное качество избираемых людей.
- source_word: אַנְשֵׁי אֱמֶת
  choice: людей правдивых
  rationale: Сохраняет связь с буквальным значением «истина/правда», оставаясь естественным по-русски; возможный оттенок надёжности отмечен в сноске.
- source_word: שֹׂנְאֵי בָצַע
  choice: ненавидящих неправедную наживу
  rationale: בֶּצַע обозначает корыстную или несправедливо приобретённую прибыль; «неправедная нажива» передаёт коррупционный оттенок, не сужая его только до взяток.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: поставь их над народом
  rationale: Ясно раскрывает местоименный референт исходного текста и избегает неестественного русского повтора «их над ними».
- source_word: שָׂרֵי
  choice: начальниками
  rationale: Нейтрально передаёт административное руководство без излишне военного оттенка.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: тысяч ... сотен ... пятидесятков ... десятков
  rationale: Сохраняет краткую ступенчатую структуру еврейского текста и обозначение групп соответствующей численности.
theological_decisions:
- issue: Мужской род обозначений избираемых руководителей
  choice: способных мужчин
  alternative: способных людей
  rationale: Еврейское אַנְשֵׁי имеет мужскую форму. Перевод сохраняет её как характеристику участников описываемого события, не выводя из этого более широкого доктринального положения.
- issue: Значение выражения «боящиеся Бога»
  choice: боящихся Бога
  alternative: богобоязненных
  rationale: Развёрнутая формулировка непосредственно передаёт исходное выражение и сохраняет библейское напряжение между страхом и благоговением, не сводя его лишь к общему благочестию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Императивы «высмотри» и «поставь» соответствуют форме еврейского наставления. Повтор «начальниками» поддерживает ритм и параллелизм оригинала.
