  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И поместил он их на наплечники эфода как памятные камни для сынов Израиля[a][b], как повелел Яхве Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камни напоминания».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Израиля»; это устойчивое выражение обозначает народ Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: И поместил он их
  rationale: שׂים означает «класть, помещать, устанавливать»; «поместил» естественно передаёт конкретное действие. Местоимение «их» отсылает к двум камням из предыдущего стиха.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: на наплечники эфода
  rationale: כָּתֵף буквально означает «плечо», но здесь обозначает плечевые части священнического облачения; «наплечники» точно и естественно передаёт конструкцию одежды.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: как памятные камни
  rationale: Сочетание буквально означает «камни памяти/напоминания». «Памятные камни» сохраняет назначение предметов и звучит естественно по-русски.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохранено формальное выражение בְּנֵי יִשְׂרָאֵל — «сыны Израиля». Предлог «для» непосредственно передаёт לְ, не уточняя сверх текста, кому именно эти камни должны служить напоминанием.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: כַּאֲשֶׁר выражает соответствие ранее данному повелению. Простое прошедшее время естественно для русского повествования, а имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное covenantное имя יהוה; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному консультационному решению.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Сохранена грамматически мужская форма устойчивого древнееврейского выражения, а сноска поясняет, что речь идёт о народе Израиля в целом.
- issue: Связь выражения לִבְנֵי יִשְׂרָאֵל с «камнями памяти»
  choice: памятные камни для сынов Израиля
  alternative: камни в память о сынах Израиля
  rationale: Предлог לְ допускает оттенки назначения и отношения. Основной текст сохраняет более широкую формулировку и не навязывает однозначно смысл «в память о».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Термины «эфод» и «наплечники» сохранены как точные названия предмета и его частей; синтаксис остаётся близким к древнееврейскому, но не выглядит неестественным по-русски.
