  text: וְ/הַ/טּ֖וּר הַ/שְּׁלִישִׁ֑י לֶ֥שֶׁם שְׁב֖וֹ וְ/אַחְלָֽמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/012.yaml
  text: 'and the third row: jacinth[a], agate[b], and amethyst.'
translation:
  language: ru
  text: и третий ряд — гиацинт[a], агат[b] и аметист.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное соответствие некоторых древних названий драгоценных камней на нагруднике первосвященника неизвестно; возможны также переводы «янтарь» или, по старой традиции, «лигур».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оникс».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: и ... ряд
  rationale: В перечне камней нагрудника טוּר обозначает ряд камней; начальный союз וְ передан как «и», поскольку стих продолжает перечисление.
- source_word: הַשְּׁלִישִׁי
  choice: третий
  rationale: Порядковое числительное прямо указывает на третий ряд.
- source_word: לֶשֶׁם
  choice: гиацинт
  rationale: Точный вид древнего камня неизвестен. «Гиацинт» — понятное современному читателю традиционное соответствие; неопределённость и другие варианты отмечены в сноске.
- source_word: שְׁבוֹ
  choice: агат
  rationale: «Агат» — распространённое соответствие в данном перечне, однако точное отождествление не установлено; вариант «оникс» приведён в сноске.
- source_word: וְאַחְלָמָה
  choice: и аметист
  rationale: אַחְלָמָה обычно отождествляют с аметистом; союз וְ естественно передан как «и».
theological_decisions: []
