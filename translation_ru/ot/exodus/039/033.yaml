base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: ru
  text: 'И принесли скинию к Моисею: шатёр и все его принадлежности — застёжки, рамы[a], перекладины, столбы и основания[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брусья» (традиционно также «доски»). Еврейское слово обозначает вертикальные конструктивные элементы скинии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гнёзда». Имеются в виду опорные детали, в которые вставлялись элементы конструкции.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: И принесли
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» естественно передаёт связь с предыдущим действием, а каузативная порода Hiphil глагола בוא здесь означает «принесли».
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: В Исходе מִשְׁכָּן обозначает священное переносное жилище. «Скиния» — устоявшийся и узнаваемый русский библейский термин, сохраняющий отличие от следующего слова «шатёр».
- source_word: אֶל מֹשֶׁה
  choice: к Моисею
  rationale: Предлог אֶל выражает направление к лицу; «к Моисею» прямо передаёт его значение.
- source_word: הָאֹהֶל
  choice: шатёр
  rationale: אֹהֶל обычно означает «шатёр». Здесь слово уточняет или называет составную часть скинии; перевод не сужает его до одного лишь покрытия.
- source_word: כָּל כֵּלָיו
  choice: все его принадлежности
  rationale: כֵּלִים — широкое обозначение предметов, приспособлений и элементов оснащения. «Принадлежности» охватывает перечисленные далее конструктивные части и звучит естественно по-русски.
- source_word: קְרָסָיו
  choice: застёжки
  rationale: קְרָסִים — соединительные детали, скреплявшие полотнища. «Застёжки» передаёт их функцию яснее, чем более общее «крючки».
- source_word: קְרָשָׁיו
  choice: рамы
  rationale: Термин обозначает вертикальные несущие элементы скинии. «Рамы» передаёт их конструктивную функцию, не навязывая спорную точную форму отдельных деталей.
- source_word: בריחו
  choice: перекладины
  rationale: בְּרִיחַ обозначает горизонтальные брусья, соединявшие и удерживавшие рамы. «Перекладины» ясно выражает их положение и функцию.
- source_word: עַמֻּדָיו
  choice: столбы
  rationale: עַמּוּד обозначает вертикальные опоры. «Столбы» — точный и естественный русский строительный термин в данном контексте.
- source_word: אֲדָנָיו
  choice: основания
  rationale: В описании скинии אֶדֶן — опорная деталь с гнездом, в которую вставлялся вертикальный элемент. «Основания» понятно передаёт общую функцию; техническая альтернатива вынесена в сноску.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской терминологией. Слово «скиния» сохранено как устоявшееся название священного жилища, тогда как остальные конструктивные термины переданы общеупотребительными и понятными словами. Двоеточие и тире делают структуру перечня прозрачной, не изменяя отношений между еврейскими словосочетаниями.
