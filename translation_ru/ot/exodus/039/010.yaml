  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: ru
  text: И вставили в него четыре ряда камней. В первом ряду — рубин[a], топаз и изумруд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Точно определить эти драгоценные камни невозможно. Названия «рубин», «топаз» и «изумруд» следуют распространённой традиции перевода. Возможные варианты: «сердолик» вместо рубина, «хризолит» вместо топаза и иной ярко-зелёный или сверкающий камень вместо изумруда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ בּוֹ
  choice: вставили в него
  rationale: Глагол буквально связан с наполнением, но в контексте нагрудника означает размещение камней в предназначенных для них гнёздах; «вставили в него» естественно передаёт и действие, и предлог בְּ.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: четыре ряда камней
  rationale: טוּרֵי означает «ряды», а אָבֶן употреблено собирательно; это точное и естественное русское выражение.
- source_word: הַטּוּר הָאֶחָד
  choice: в первом ряду
  rationale: Буквально «один ряд», но в последовательном перечислении четырёх рядов выражение обозначает первый ряд. Именная конструкция передана естественно для русского перечня.
- source_word: אֹדֶם
  choice: рубин
  rationale: Точное определение минерала неясно. Выбрано традиционное и узнаваемое соответствие; неопределённость сохранена в сноске.
- source_word: פִּטְדָה
  choice: топаз
  rationale: Традиционное соответствие, хотя древний минерал невозможно определить с уверенностью; возможный вариант указан в сноске.
- source_word: בָרֶקֶת
  choice: изумруд
  rationale: Традиционное соответствие. Слово, вероятно, обозначает ярко сверкающий камень, но его точная минералогическая идентификация неизвестна.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая инвентарная формулировка сохраняет характер исходного описания. «Вставили» конкретизирует действие лишь настолько, насколько требует контекст ювелирной работы, не добавляя сведений о способе крепления.
