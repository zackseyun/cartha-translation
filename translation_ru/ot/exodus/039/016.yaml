  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ מִשְׁבְּצֹ֣ת זָהָ֔ב וּ/שְׁתֵּ֖י טַבְּעֹ֣ת זָהָ֑ב וַֽ/יִּתְּנ֗וּ אֶת שְׁתֵּי֙ הַ/טַּבָּעֹ֔ת עַל שְׁנֵ֖י קְצ֥וֹת הַ/חֹֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/016.yaml
  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: ru
  text: Они сделали две золотые оправы[a] и два золотых кольца и поместили эти два кольца на двух концах нагрудника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепления»; возможно также: «филигранные оправы».'
    reason: Еврейское מִשְׁבְּצֹת обозначает вид золотой оправы или крепёжной детали, но точная форма и техника изготовления не вполне ясны.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Они сделали
  rationale: Форма Qal wayyiqtol от עשה продолжает последовательность действий; в русском союз «и» в начале стиха можно опустить ради естественного повествования.
- source_word: מִשְׁבְּצֹת
  choice: оправы
  rationale: Слово обозначает золотые детали, служащие обрамлением или креплением; «оправы» естественно для ювелирно-ремесленного контекста и не уточняет спорную технику изготовления.
- source_word: זָהָב
  choice: золотые
  rationale: Прилагательное естественно передаёт материал в современном русском; определение сохранено при обоих названиях предметов, как и в еврейском тексте.
- source_word: טַבְּעֹת
  choice: кольца
  rationale: Обычное обозначение колец, используемых как точки крепления в устройстве священнического облачения.
- source_word: וַיִּתְּנוּ
  choice: прикрепили
  rationale: נתן буквально означает «поместили», но в данном ремесленном контексте кольца устанавливаются на краях нагрудника; «прикрепили» естественно выражает действие без уточнения способа крепления.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: к двум краям
  rationale: עַל в сочетании с краями предмета допускает пространственное «на» или «у»; русское «к двум краям» ясно передаёт расположение и функцию крепёжных колец.
- source_word: הַחֹשֶׁן
  choice: нагрудника
  rationale: В контексте облачения первосвященника חֹשֶׁן обозначает особый нагрудный предмет; «нагрудник» — ясный и традиционно узнаваемый русский эквивалент.
theological_decisions: []
