    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Они сделали
  rationale: Обычная повествовательная форма глагола עשה продолжает последовательность действий; «сделали» естественно и точно.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: колокольчики из чистого золота
  rationale: פעמון означает колокольчик; сочетание ясно указывает на материал и его чистоту.
- source_word: וַיִּתְּנוּ
  choice: и поместили
  rationale: Глагол נתן здесь означает размещение предметов в определённом месте; «поместили» подходит dignified modern Russian.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: среди гранатов
  rationale: Буквально «посреди гранатов»; «среди» естественно передаёт расположение колокольчиков относительно украшений, не сводя его однозначно к чередованию.
- source_word: הָרִמֹּנִים
  choice: гранатов
  rationale: В контексте речь идёт об украшениях в форме плодов граната, однако основной текст сохраняет краткое обозначение оригинала.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: по всему подолу мантии
  rationale: שׁוּלֵי обозначает нижний край или подол одежды; מְעִיל — священническую мантию. Предлог עַל передан естественно в сочетании с указанием кругового расположения.
- source_word: סָבִיב
  choice: по всему
  rationale: В данном контексте слово указывает, что украшения окружали весь подол; русское «по всему подолу» выражает это естественно.
- source_word: בְּתוֹךְ הָרִמֹּנִים (повтор)
  choice: среди гранатов
  rationale: Повтор сохранён, поскольку он присутствует в еврейском тексте и подчёркивает схему размещения.
