  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: ru
  text: Они сделали колокольчики из чистого золота и поместили колокольчики среди гранатов[a] на подоле верхнего одеяния, вокруг него, среди гранатов.
  philosophy: optimal-equivalence
