  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: ru
  text: Так была завершена вся работа над скинией — шатром встречи. Израильтяне[b] сделали всё так, как Яхве[a] повелел Моисею; именно так они и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (ЙХВХ); традиционно: «Господь».'
    reason: Указывает исходную форму Божьего имени и распространённую традиционную передачу.
  - marker: b
    text: 'Букв.: «сыны Израиля».'
    reason: Показывает буквальную форму корпоративного обозначения народа.
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: была завершена
  rationale: Глагол כלה обозначает полное окончание работы; пассивная конструкция сохраняет смысл и не вводит не названного в тексте деятеля.
- source_word: כָּל עֲבֹדַת
  choice: вся работа
  rationale: Передаёт собирательный смысл עֲבֹדָה и полноту, выраженную כָּל.
- source_word: מִשְׁכַּן
  choice: скиния
  rationale: Устоявшееся русское название переносного святилища; оно точно обозначает предмет в контексте Исхода.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прямо передаёт составное наименование и звучит естественно по-русски; тире показывает, что оно поясняет слово «скиния».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: В данном контексте выражение является общенародным обозначением и относится ко всему народу; буквальная форма приведена в сноске.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: всё так, как … повелел
  rationale: Естественная русская конструкция, сохраняющая значение полного соответствия повелению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: כֵּן עָשׂוּ
  choice: именно так они и сделали
  rationale: Сохраняет заключительное повторение и его эмфатическое указание на точное послушание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом, а традиционная замена указана в сноске.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: израильтяне
  alternative: сыны Израиля
  rationale: Здесь это устойчивое обозначение народа в целом. Идиоматический русский вариант не сужает референцию до мужчин, а буквальная форма доступна в сноске.
- issue: Повторение וַיַּעֲשׂוּ … כֵּן עָשׂוּ
  choice: сохранить заключительное повторение
  alternative: опустить повтор как стилистически избыточный
  rationale: Повторение подчёркивает полное соответствие Божьему повелению и потому богословски и риторически значимо.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Скиния» сохранена как общеупотребительный термин, а «шатёр встречи» даёт прозрачное поясняющее наименование. Пунктуация разделяет сообщение о завершении работы и итоговую оценку послушания; заключительный повтор намеренно сохранён.
