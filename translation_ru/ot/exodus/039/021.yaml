base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И соединили кольца нагрудника с кольцами эфода синим шнуром, чтобы нагрудник находился над искусно вытканным поясом эфода и не сдвигался с эфода, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: прикрепили
  rationale: Глагол обозначает надёжное соединение деталей; «прикрепили» естественно звучит по-русски и не сужает способ крепления до простого завязывания.
- source_word: הַחֹשֶׁן
  choice: нагрудник
  rationale: В данном контексте это украшенная принадлежность первосвященнического облачения, а не защитная часть доспеха; «нагрудник» точнее, чем «нагрудная броня».
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: его кольцами к кольцам эфода
  rationale: Передаёт соединение посредством колец нагрудника с кольцами эфода и естественно воспроизводит направленность конструкции.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: синим шнуром
  rationale: פְתִיל — шнур или нить для крепления, а תְּכֵלֶת обозначает синий краситель или окрашенный им материал; в русском атрибутивная конструкция наиболее естественна.
- source_word: לִהְיוֹת עַל חֵשֶׁב הָאֵפֹד
  choice: чтобы он находился над искусно вытканным поясом эфода
  rationale: חֵשֶׁב здесь обозначает художественно вытканную полосу-пояс, связанную с эфодом. «Над» сохраняет пространственное значение עַל, не отождествляя нагрудник с поясом.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  choice: и не сдвигался с эфода
  rationale: Форма глагола выражает смещение или отделение от надлежащего положения; «не сдвигался с» естественно передаёт и действие, и пространственный оттенок מֵעַל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте, не заменяя имя титулом.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как собственное имя. Форма «Яхве» представляет его распространённую научно обоснованную русскую передачу и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для описания богослужебного облачения. Сохранены технические термины «нагрудник» и «эфод»; синтаксис сделан ясным без устранения пространственных оттенков еврейского текста.
