  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: медный жертвенник
  rationale: מִזְבַּח означает «жертвенник», а נְחֹשֶׁת — медь или бронзу. В русской библейской речи для этой принадлежности скинии устойчиво и понятно сочетание «медный жертвенник».
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: медную решётку
  rationale: מִכְבָּר обозначает решётчатую или сетчатую часть жертвенника. «Решётка» конкретно и естественно передаёт предмет.
- source_word: אֲשֶׁר לוֹ
  choice: при нём
  rationale: Буквально относительное выражение указывает, что решётка принадлежала жертвеннику или была предназначена для него, не уточняя её точного положения. «При нём» сохраняет эту связь без лишней конкретизации.
- source_word: בַּדָּיו
  choice: шесты для него
  rationale: בַּדִּים — шесты, которыми переносили принадлежности святилища. Добавление «для него» естественно обозначает их связь с жертвенником.
- source_word: כָּל־כֵּלָיו
  choice: все его принадлежности
  rationale: כֵּלִים — широкое обозначение предметов, орудий или утвари. «Принадлежности» здесь охватывает весь набор предметов жертвенника и звучит естественно.
- source_word: הַכִּיֹּר
  choice: умывальник
  rationale: כִּיּוֹר обозначает сосуд для ритуального омовения. «Умывальник» — понятный и укоренённый русский эквивалент в контексте скинии.
- source_word: כַּנּוֹ
  choice: его подставку
  rationale: כֵּן обозначает основание или опору сосуда. «Подставка» ясно выражает функцию и соответствует контексту.
