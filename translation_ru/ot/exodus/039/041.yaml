  text: служебные одежды для служения во святилище[a], священные одежды для Аарона, священника, и одежды его сыновей для священнического служения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежды искусной тканой работы». Значение еврейского выражения не вполне ясно; оно может обозначать специально изготовленные ткани или одежды, употреблявшиеся при служении во святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: одежды
  rationale: Бֶּגֶד обозначает одежду; нейтральное «одежды» естественно по-русски и не привносит поздней церковной терминологии.
- source_word: הַשְּׂרָד
  choice: тканой работы
  rationale: В контексте скинии слово, вероятно, обозначает особую текстильную работу. Выражение «одежды тканой работы» передаёт ремесленно-материальный оттенок, не отождествляя эту фразу со следующими «священными одеждами».
- source_word: לְשָׁרֵת
  choice: для служения
  rationale: שׁרת здесь означает официальное богослужебное служение; русское «для служения» сохраняет целевое значение конструкции.
- source_word: בַּקֹּדֶשׁ
  choice: во святилище
  rationale: В данном контексте קֹדֶשׁ обозначает священное пространство скинии, поэтому «во святилище» яснее, чем отвлечённое «в святости».
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: священные одежды
  rationale: Близко передаёт устойчивое обозначение одежд, отделённых для священного употребления.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: для священника Аарона
  rationale: Передаёт адресата одежд и титул Аарона естественным русским порядком слов.
- source_word: בִּגְדֵי בָנָיו
  choice: одежды его сынов
  rationale: Сохраняет структуру и однозначно указывает, что одежды предназначены сыновьям Аарона.
- source_word: לְכַהֵן
  choice: для священнического служения
  rationale: Знаменательный глагол, образованный от כֹּהֵן, означает исполнять обязанности священника; выбранная формулировка передаёт именно функцию, а не только общее служение.
theological_decisions:
- issue: Соотношение בִּגְדֵי הַשְּׂרָד и בִּגְדֵי הַקֹּדֶשׁ
  choice: Первая фраза передана как отдельное обозначение одежд особой тканой работы, а затем отдельно названы священные одежды Аарона и его сынов.
  alternative: Понимать обе фразы как близкие по смыслу и перевести первую как «одежды для служения» или «служебные одежды».
  rationale: Повтор слова בִּגְדֵי и различие определений сохранены без чрезмерного уточнения функции предметов; при этом лексическая неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранена перечислительная структура исходного стиха; термины понятны без конфессионально специфической лексики.
