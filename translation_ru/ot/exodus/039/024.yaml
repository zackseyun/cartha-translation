lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: они сделали
  rationale: Стандартная повествовательная форма глагола עשה; «сделали» прямо и естественно передаёт действие.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: по подолу ризы
  rationale: שׁוּלֵי обозначает нижний край одежды; предлог עַל здесь указывает место расположения украшений. «Риза» сохраняет связь с особым священническим облачением.
- source_word: רִמּוֹנֵי
  choice: гранаты
  rationale: Еврейский текст прямо называет эти украшения «гранатами», то есть по их форме; конкретизация вынесена в примечание.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: из голубой, пурпурной и алой ... пряжи
  rationale: Названия красителей или окрашенного текстильного материала переданы традиционными и понятными цветовыми обозначениями; «пряжи» добавлено для ясности по контексту изготовления.
- source_word: מָשְׁזָר
  choice: кручёной
  rationale: Форма описывает скрученный или свитый текстильный материал; «кручёной» естественно сочетается со словом «пряжа».
