  yaml_path: translation/ot/exodus/039/037.yaml
  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: ru
  text: чистый светильник, его лампады — лампады, расставленные по порядку[a], — все его принадлежности и масло для освещения;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лампады расположения (расстановки)»; еврейское выражение подчёркивает их упорядоченную, предписанную расстановку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: светильник
  rationale: В данном контексте מְנוֹרָה обозначает храмовый светильник-подставку с отдельными лампадами; традиционное русское «светильник» естественно и не смешивает весь предмет с одной лампадой.
- source_word: הַטְּהֹרָה
  choice: чистый
  rationale: Прилагательное טָהוֹר передано прямо, без добавления отсутствующего в этом стихе слова «золотой»; оно может указывать на чистоту материала или культовую чистоту предмета.
- source_word: נֵרֹתֶיהָ
  choice: его лампады
  rationale: נֵרֹת здесь — отдельные ёмкости для масла, принадлежавшие светильнику; «лампады» точнее русского «лампы» в контексте скинии.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: лампады, расставленные по порядку
  rationale: מַעֲרָכָה выражает упорядоченное расположение или расстановку. Такая формулировка естественна по-русски и сохраняет акцент на установленном порядке.
- source_word: כָּל כֵּלֶיהָ
  choice: все его принадлежности
  rationale: Широкое значение כְּלִי охватывает связанные со светильником сосуды и орудия; «принадлежности» не вводит лишней конкретизации.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: масло для освещения
  rationale: Сочетание обозначает масло, предназначенное для света; перевод краток, ясен и соответствует инвентарному стилю отрывка.
theological_decisions:
- issue: Значение определения הַטְּהֹרָה применительно к светильнику
  choice: чистый
  alternative: из чистого золота
  rationale: Исходный текст этого стиха говорит лишь «чистый» и не называет золото; более развёрнутый вариант богословски и контекстуально возможен, но добавлял бы явно не выраженное слово.
translation_notes:
  register: Современный литературный русский с сохранением торжественного инвентарного строя. Повтор «лампады — лампады…» удерживает пояснительную структуру еврейского текста; конечная точка с запятой показывает продолжение перечня.
