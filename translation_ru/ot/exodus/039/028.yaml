lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: кидар
  rationale: Обозначает особый головной убор первосвященника; «кидар» — устоявшийся в русском библейском языке точный термин, хотя менее общеупотребительный, чем «тюрбан».
- source_word: שֵׁשׁ
  choice: тонкий лён
  rationale: Слово обозначает высококачественный тонкий лён; перевод сохраняет указание на качество материала.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: нарядные головные уборы
  rationale: Сочетание указывает на великолепные или украшенные священнические головные уборы. Такой перевод естественнее буквального «украшения шапок» и не представляет их отдельными украшениями.
- source_word: מִכְנְסֵי הַבָּד
  choice: нижнее бельё из льна
  rationale: Речь идёт о священнической одежде, закрывающей нижнюю часть тела. «Нижнее бельё» понятно современному читателю и не использует архаичное «нижние одежды» или «исподнее».
- source_word: מָשְׁזָר
  choice: кручёный
  rationale: Передаёт способ изготовления материала из скрученных нитей; определение согласовано с заключительным «тонким льном».
