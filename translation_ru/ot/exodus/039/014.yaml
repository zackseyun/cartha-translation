review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: двенадцать камней соотнесены с именами сыновей Израиля и с двенадцатью коленами. Однако «как на печати» может означать местоположение надписи, тогда как פִּתּוּחֵי חֹתָם описывает способ резьбы — резьбу, подобную резьбе на печати. Формулировка «имя одного из двенадцати колен» несколько перераспределяет заключительное «для двенадцати колен» и ослабляет повторяющееся соответствие именам.'
  naturalness: Исходный русский текст в целом литературен. Уточнение «как вырезают на печати» естественно и точнее выражает сравнительный характер оборота. «По одному имени для каждого из двенадцати колен» ясно передаёт распределительное אִישׁ и заключительную связь с коленами.
  terminology: «Сыновья Израиля» и «колена» уместны для современного литературного библейского регистра. «Камни» сохраняет лексику оригинала без неоправданного уточнения «драгоценные».
  issues:
  - severity: medium
    issue: Сравнительный оборот о печати недостаточно точен
    rationale: «На каждом было вырезано, как на печати, имя» допускает понимание «имя было вырезано на печати». В еврейском פִּתּוּחֵי חֹתָם речь о манере гравировки, подобной резьбе на печати.
  - severity: low
    issue: Заключительная распределительная связь передана не вполне прозрачно
    rationale: «Имя одного из двенадцати колен» неявно заменяет конструкцию «каждое по своему имени — для двенадцати колен». Явное «по одному имени для каждого» лучше сохраняет распределительный смысл.
  revised_text: 'А камни соответствовали именам сыновей Израиля: их было двенадцать, по их именам; на каждом было вырезано, как вырезают на печати, по одному имени для каждого из двенадцати колен.'
  revised_footnotes:
