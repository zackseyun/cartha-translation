  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: ru
  text: 'А камни соответствовали именам сыновей Израиля: их было двенадцать, по их именам; на каждом было вырезано, как вырезают на печати, по одному имени для каждого из двенадцати колен.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: А камни
  rationale: Сохраняет простое значение определённого существительного и связь с предшествующим описанием; «драгоценные камни» возможно по контексту, но лексически не обязательно.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: соответствовали именам сыновей Израиля
  rationale: Предлог עַל здесь выражает соответствие или тесную соотнесённость, а не обычное пространственное значение «на».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновей Израиля
  rationale: Формально и точно передаёт традиционное заветное обозначение потомков Израиля, не заменяя его более общим этнонимом.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: их было двенадцать, по числу их имён
  rationale: Передаёт явно выраженное число и соответствие двенадцати камней двенадцати именам естественным современным русским языком.
- source_word: פִּתּוּחֵי חֹתָם
  choice: было вырезано, как на печати
  rationale: Фраза описывает резьбу в манере надписи, вырезаемой на печати; сравнительная конструкция ясна современному читателю.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: на каждом ... имя одного
  rationale: אִישׁ употреблено распределительно. Формулировка ясно соотносит каждый камень с отдельным именем и избегает неестественного буквального «каждый по имени своему».
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: из двенадцати колен
  rationale: В сочетании с «имя одного» естественно передаёт отношение каждого имени к одному из двенадцати колен; число и представительная функция сохранены.
