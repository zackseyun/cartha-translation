translation:
  language: ru
  text: И прикрепили два золотых шнура к двум кольцам на концах нагрудника[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «две золотые цепочки». Еврейское слово может обозначать витые шнуры или похожие на них цепочки; здесь они сделаны из золота и прикреплены к нагруднику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: И прикрепили
  rationale: Глагол נתן означает «положить, поместить»; в данном описании сборки предмета естественное русское «прикрепили» ясно передаёт помещение шнуров на кольца, не добавляя способа крепления.
- source_word: שְׁתֵּי הָעֲבֹתֹת
  choice: два … шнура
  rationale: עֲבֹתֹת обозначает витые шнуры, верёвки либо похожие на них цепочки. «Шнуры» сохраняет основной образ, а возможное значение «цепочки» приведено в сноске. В русском числительное согласовано с мужским родом слова «шнур».
- source_word: הַזָּהָב
  choice: золотых
  rationale: Прилагательное естественно и точно указывает материал предметов.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: к двум кольцам
  rationale: В контексте прикрепления русский предлог «к» звучит естественнее буквального «на» и передаёт связь шнуров с кольцами.
- source_word: עַל קְצוֹת הַחֹשֶׁן
  choice: на концах нагрудника
  rationale: Фраза указывает местоположение двух колец у крайних частей нагрудника; «на концах» сохраняет множественное число и пространственный смысл.
- source_word: הַחֹשֶׁן
  choice: нагрудника
  rationale: «Нагрудник» — ясное современное обозначение данной части первосвященнического облачения без неоправданного расширения значения.
