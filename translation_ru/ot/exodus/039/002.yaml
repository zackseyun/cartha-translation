  yaml_path: translation/ot/exodus/039/002.yaml
  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: ru
  text: Он сделал эфод из золота, голубой, пурпурной и алой пряжи и тонкого кручёного льна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה продолжает последовательное повествование; простое прошедшее время естественно передаёт её функцию по-русски.
- source_word: הָאֵפֹד
  choice: эфод
  rationale: Устоявшееся наименование особого священнического облачения; транслитерация точнее, чем пояснительный пересказ.
- source_word: זָהָב
  choice: из золота
  rationale: В стихе прямо назван материал. Хотя следующий стих поясняет, что золото превращали в нити, здесь это уточнение не добавляется.
- source_word: תְּכֵלֶת
  choice: голубой пряжи
  rationale: Термин обозначает дорогой окрашенный текстиль сине-голубого оттенка; слово «пряжа» делает понятным текстильный контекст и одновременно относится к последующему перечню цветов.
- source_word: וְאַרְגָּמָן
  choice: пурпурной пряжи
  rationale: Пурпур — обычное значение этого термина в описаниях священных тканей; общее слово «пряжа» не повторяется ради естественности русского перечисления.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: алой пряжи
  rationale: Сочетание обозначает материал, окрашенный в ярко-красный, алый цвет. «Алая пряжа» ясно передаёт значение в данном текстильном контексте.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: и тонкого кручёного льна
  rationale: שֵׁשׁ обозначает тонкий лён, а מָשְׁזָר — скрученный или свитый материал; перевод сохраняет оба признака и звучит современно.
