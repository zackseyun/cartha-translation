  terminology: «Эфод» — оправданный традиционный термин для названия священнического предмета. «Пурпурная», «алая пряжа» и «тонкий кручёный лён» точны по смыслу и выдержаны в нейтральном литературном регистре. «Голубой» является допустимым современным соответствием תכלת без излишней конкретизации оттенка.
