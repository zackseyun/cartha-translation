  source_fidelity: '«Обработали» допустимо в ремесленном контексте עשה и не создаёт неестественного впечатления, будто изготовляли сам минерал. Переданы золотые оправы и нанесение имён на камни. Однако «как на печати» двусмысленно: по-русски оно может относиться к месту нанесения, тогда как еврейское выражение характеризует способ гравировки — как резьбу на печати (печатке).'
  naturalness: Текст в целом современный и плавный. Замена «вырезав на них, как на печати» на «выгравировав на них имена … как на печатях» яснее выражает сравнение и естественнее для описания надписей на камнях.
  terminology: «Ониксовые камни» естественнее, чем «камни оникса». Неопределённость שֹׁהַם надлежащим образом сохранена в сноске; слово «драгоценного» в ней лучше не употреблять, поскольку точная идентификация и категория камня не установлены. «Сынов Израиля» сохраняет форму и референт исходного выражения.
