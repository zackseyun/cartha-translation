base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: ru
  text: Они обработали ониксовые камни[a], закрепив их в золотых оправах и выгравировав на них имена сынов Израиля, как на печатях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камни шохама»; точный вид камня неизвестен, хотя традиционно его считают ониксом.'
    reason: Лексическая неопределённость названия минерала שֹׁהַם.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Они обработали
  rationale: В контексте работы с уже существующими драгоценными камнями עשה обозначает их изготовление или обработку. «Обработали» естественнее по-русски, чем буквальное «сделали камни», и согласуется с последующим описанием оправы и резьбы.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: камни оникса[a]
  rationale: «Оникс» — традиционное и понятное соответствие, однако точный вид минерала שֹׁהַם не установлен; неопределённость сохранена в сноске.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: закрепив их в золотых оправах
  rationale: Фраза описывает камни, окружённые или удерживаемые золотыми ювелирными оправами. Такой перевод передаёт и способ крепления, и материал, не уточняя сверх текста технику золотой работы.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: вырезав на них, как на печати
  rationale: Однокоренная конструкция подчёркивает резьбу по образцу печати. Русская формулировка естественно передаёт эту сравнительную характеристику, избегая тяжеловесного повтора «вырезаны резьбой».
- source_word: עַל שְׁמוֹת
  choice: имена
  rationale: В данном контексте עַל связывает резьбу с именами; по-русски это естественно выражается прямым дополнением при «вырезав на них», без искусственного «согласно именам».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Перевод сохраняет явно мужскую форму и устойчивое родоплеменное обозначение оригинала.
theological_decisions:
- issue: Родоплеменное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян / детей Израиля
  rationale: Мужская форма исходного выражения здесь относится к названным патриархам и потому сохранена без гендерной нейтрализации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Причастная структура еврейского текста передана деепричастиями ради ясности последовательных ремесленных действий; техническая деталь оправы сохранена без чрезмерной конкретизации.
