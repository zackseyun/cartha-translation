  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: ru
  text: Они сделали два золотых кольца и прикрепили их к двум наплечникам эфода — снизу, с его лицевой стороны, напротив места соединения[a], над искусно вытканным поясом эфода[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напротив его соединения»; еврейское слово обозначает место, где части эфода соединялись или скреплялись.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «над тканой поясной полосой эфода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: кольца
  rationale: Обычное обозначение металлических колец; в данном контексте они служат для крепления частей священнического облачения.
- source_word: כִתְפֹת
  choice: наплечники
  rationale: Речь идёт о плечевых деталях эфода, а не просто о плечах человека; «наплечники» ясно и естественно называет часть облачения.
- source_word: מִלְמַטָּה
  choice: снизу
  rationale: Передаёт расположение колец в нижней части наплечников и сохраняет краткость еврейского выражения.
- source_word: מִמּוּל פָּנָיו
  choice: с его лицевой стороны
  rationale: Буквально выражение связано с «лицом» предмета; применительно к эфоду естественно обозначает его переднюю, лицевую сторону.
- source_word: לְעֻמַּת
  choice: напротив
  rationale: Сохраняет пространственное значение соответствия или расположения одного элемента против другого, не уточняя геометрию сверх текста.
- source_word: מֶחְבַּרְתּוֹ
  choice: место соединения
  rationale: Называет участок, где части эфода соединяются, и не сужает значение до конкретного шва или способа крепления.
- source_word: חֵשֶׁב
  choice: искусно вытканный пояс
  rationale: В описании эфода это вытканная вместе с ним поясная крепёжная полоса; выбранная формулировка передаёт её назначение и качество изготовления.
- source_word: אֵפֹד
  choice: эфод
  rationale: Устойчивый транслитерированный термин для особого священнического облачения; точного общеупотребительного русского эквивалента нет.
- source_word: וַיִּתְּנֻם
  choice: прикрепили их
  rationale: В контексте колец на облачении глагол נתן обозначает их установку в предназначенном месте; «прикрепили» звучит естественнее буквального «положили», не определяя способ крепления.
