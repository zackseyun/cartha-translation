base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Из голубой, пурпурной и алой пряжи они изготовили служебные одежды[a] для служения во святилище, а также священные одежды для Аарона, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искусно вытканные одежды». Значение еврейского выражения не вполне ясно: оно может подчёркивать либо назначение одежд для служения, либо искусность их изготовления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: из голубой, пурпурной и алой пряжи
  rationale: Цветовые обозначения переданы традиционными и понятными русскими терминами; слово «пряжа» явно выражает подразумеваемый текстильный материал, не уточняя сверх текста точные оттенки древних красителей.
- source_word: בִגְדֵי שְׂרָד
  choice: служебные одежды[a]
  rationale: Специализированное выражение, вероятно, обозначает одежды, предназначенные для богослужебной службы. Такой перевод согласуется с древним контекстом и не устраняет возможный оттенок искусной тканой работы, отмеченный в сноске.
- source_word: לְשָׁרֵת
  choice: для служения
  rationale: Передаёт целевое значение инфинитива и официальный культовый характер действия без тяжеловесного уточнения.
- source_word: בַּקֹּדֶשׁ
  choice: во святилище
  rationale: В данном контексте слово обозначает священную сферу скинии; «святилище» естественно по-русски и не сужает значение до отдельного помещения.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: священные одежды
  rationale: Прямо передаёт особый сакральный статус одежд Аарона и сохраняет отличие от предшествующего выражения בִגְדֵי שְׂרָד.
- source_word: לְאַהֲרֹן
  choice: для Аарона
  rationale: Предлог указывает на предназначение одежд; эта формулировка наиболее естественна в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Кратко и естественно передаёт формулу соответствия ранее данному повелению.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксический повтор «изготовили они и» сохраняет параллелизм еврейского текста, оставаясь естественным по-русски; терминология понятна широкому читателю и не привносит конфессиональных уточнений.
