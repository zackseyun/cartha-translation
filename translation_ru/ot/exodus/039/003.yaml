translation_notes:
  register: Современный литературный русский язык с ясной ремесленной терминологией и умеренно торжественным библейским звучанием. Повторяющееся בְּתוֹךְ передано одним естественным русским оборотом; эллиптические названия цветов раскрыты словом «пряжа». Маркеры сносок расположены непосредственно после соответствующих выражений.
