base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: ru
  text: Они выковали из золота тонкие листы[a] и разрезали их на нити[b], чтобы вплести их в голубую, пурпурную и алую пряжу и в тонкий лён при изготовлении искусной узорчатой работы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тонкие золотые пластины». Еврейское выражение обозначает тонкие куски металла, выкованные ударами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на узкие полоски». Речь идёт о тонких золотых нитях или полосках, подготовленных для вплетения в ткань.'
    reason: lexical_alternative
  - marker: c
    text: '«Искусная узорчатая работа» передаёт техническое выражение, обозначающее умело задуманную художественную работу; возможны переводы: «работа искусного ремесленника» или «художественная работа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ
  choice: расплющили
  rationale: Глагол רקע в контексте обработки металла обозначает расплющивание ударами до получения тонких листов; этот русский глагол естественно передаёт и действие, и его результат.
- source_word: פַּחֵי הַזָּהָב
  choice: золото в тонкие листы
  rationale: פַּחִים — тонкие металлические пластины или листы. Конструкция с «в» по-русски ясно связывает результат с предшествующим глаголом.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: и разрезали его на нити
  rationale: Фраза описывает разрезание расплющенного золота на узкие волокна для включения в ткань. Местоимение «его» относится к золоту; множественное сказуемое согласовано с окружающим повествованием, несмотря на масоретскую форму единственного числа וְקִצֵּץ.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: чтобы вплести их в
  rationale: Буквально выражение шире («чтобы сделать внутри»), но в ремесленном контексте означает включение золотых нитей в текстиль; «вплести» естественно и точно передаёт практическое действие.
- source_word: הַתְּכֵלֶת
  choice: голубую пряжу
  rationale: תְּכֵלֶת обозначает окрашенный голубой материал. Добавление «пряжу» делает текстильный смысл явным и служит общим определяемым словом для ряда цветов.
- source_word: הָאַרְגָּמָן
  choice: пурпурную пряжу
  rationale: אַרְגָּמָן — пурпурно окрашенный материал; «пурпурную» сохраняет традиционное и точное цветовое обозначение.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: алую пряжу
  rationale: Устойчивое выражение обозначает ярко-красный, алый окрашенный материал; этимология красителя не выносится в основной текст.
- source_word: הַשֵּׁשׁ
  choice: тонкий лён
  rationale: שֵׁשׁ в описаниях скинии означает высококачественную тонкую льняную ткань или материал. «Тонкий лён» сохраняет указание на качество без излишнего уточнения формы материала.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: искусную работу мастера
  rationale: Техническое выражение обозначает умелую, художественно задуманную работу. Формулировка сохраняет ремесленный смысл, не сужая роль мастера исключительно до ткача или проектировщика.
