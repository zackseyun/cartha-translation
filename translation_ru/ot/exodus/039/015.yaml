lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: И сделали
  rationale: Обычное повествовательное употребление עשה; «сделали» прямо и естественно передаёт действие.
- source_word: עַל הַחֹשֶׁן
  choice: на нагруднике
  rationale: Предлог עַל здесь указывает на размещение или прикрепление цепочек к предмету; «на нагруднике» сохраняет пространственный смысл.
- source_word: הַחֹשֶׁן
  choice: нагрудник
  rationale: В священническом контексте это особая принадлежность первосвященнического облачения. Краткое «нагрудник» соответствует данному стиху, где уточнение «суда» отсутствует.
- source_word: שַׁרְשְׁרֹת
  choice: цепочки
  rationale: Существительное обозначает цепи; уменьшительная форма естественна для тонких золотых элементов нагрудника.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: в виде плетёных шнуров
  rationale: Сочетание описывает конструкцию цепочек как плетёную, витую или шнурообразную работу. Формулировка передаёт и способ изготовления, и сходство со шнурами, не утверждая точную технику сверх данных еврейского текста.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Естественная русская формула для указания материала, точно передающая значение словосочетания.
