lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: стол
  rationale: Существительное שֻׁלְחָן прямо обозначает стол; контекст перечисления принадлежностей скинии делает дополнительное пояснение ненужным.
- source_word: כָּל כֵּלָיו
  choice: все его принадлежности
  rationale: כְּלִי — широкое обозначение предмета, сосуда или орудия. «Принадлежности» естественно охватывает все предметы, относящиеся к столу, не сужая значение до одних сосудов.
- source_word: לֶחֶם הַפָּנִים
  choice: хлеб Присутствия
  rationale: Сочетание буквально связано с «лицом/присутствием». «Хлеб Присутствия» сохраняет образ и сакральный смысл еврейского выражения, не добавляя прямо не названного референта.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: отдельно не переводится
  rationale: Показатели прямого дополнения оформляют однородные члены перечня; в русском их функция передаётся синтаксисом и союзом.
