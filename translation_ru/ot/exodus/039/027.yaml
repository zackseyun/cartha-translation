translation:
  language: ru
  text: Они сделали хитоны из тонкого льна, работы ткача, для Аарона и его сыновей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хитоны из тонкого льна, ткацкой работы». Еврейское выражение характеризует их как изделие, выполненное ткачом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Они сделали
  rationale: Форма Qal wayyiqtol от עשה продолжает последовательность действий. В современном русском повествовании союз ו естественно не передавать отдельным «и».
- source_word: הַכָּתְנֹת
  choice: хитоны
  rationale: כָּתְנֹת обозначает нательные одежды типа длинной рубахи; «хитоны» точно и уместно для древнего священнического облачения.
- source_word: שֵׁשׁ
  choice: из тонкого льна
  rationale: В контексте скинии и священнических одежд שֵׁשׁ означает высококачественный тонкий лён; эта формулировка передаёт материал и его качество.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: вытканные ткачом
  rationale: Оборот обозначает изделие ткацкой работы. Причастная конструкция естественна по-русски и сохраняет указание как на способ изготовления, так и на ремесленника.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: для Аарона и его сыновей
  rationale: Повтор предлога לְ перед второй группой не требует буквального повторения в русском; единый предлог ясно выражает назначение одежд.
