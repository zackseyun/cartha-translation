    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: покрытие
  rationale: Прямой и естественный эквивалент существительного со значением того, что покрывает; не уточняет без основания конструкцию или расположение покрытия.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: бараньи кожи, окрашенные в красный цвет
  rationale: Передаёт и вид кожи, и значение причастия «сделанные красными», то есть окрашенные, а не обязательно имевшие естественный красный цвет.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: кожи тахашей[a]
  rationale: Референт תְּחָשׁ остаётся неустановленным. Транслитерация не выдаёт спорное отождествление животного или характеристику материала за достоверный смысл; пояснение дано в сноске.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: завесу, служившую преградой
  rationale: פָּרֹכֶת обозначает внутреннюю завесу, а מָסָךְ — закрывающую преграду или ширму. Формулировка естественно передаёт определительное сочетание и функцию завесы, не создавая впечатления двух отдельных предметов.
