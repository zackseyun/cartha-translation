translation:
  language: ru
  text: Два конца двух плетёных цепочек поместили на две оправы и поместили их на наплечники эфода с передней его стороны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: конца
  rationale: Слово обозначает крайние, конечные части предмета; «конца» естественно передаёт его здесь.
- source_word: הָעֲבֹתֹת
  choice: плетёных цепочек
  rationale: В контексте изготовления священного облачения речь идёт о витых или плетёных ювелирных цепочках, а не об обычных верёвках.
- source_word: הַמִּשְׁבְּצֹת
  choice: оправам
  rationale: Термин обозначает золотые ювелирные оправы или крепления; «оправы» сохраняет ремесленный смысл и естественно звучит по-русски.
- source_word: וַיִּתְּנֻם / נָתְנוּ
  choice: прикрепили / поместили
  rationale: נתן буквально означает «положить, поместить». В первой позиции «прикрепили» ясно передаёт конструктивное соединение, а во второй «поместили» не добавляет лишней технической конкретики.
- source_word: כִתְפֹת
  choice: наплечниках
  rationale: В данном контексте это плечевые части эфода, поэтому предметное «наплечники» точнее, чем анатомическое «плечи».
- source_word: אֶל מוּל פָּנָיו
  choice: с его передней стороны
  rationale: Пространственное выражение указывает на переднюю, обращённую вперёд сторону эфода; местоимение соотнесено с эфодом.
