    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: а четвёртый ряд
  rationale: Союз ו естественно передан как «а» при продолжении перечня; טוּר в описании нагрудника обозначает ряд камней.
- source_word: תַּרְשִׁישׁ
  choice: хризолит
  rationale: Точная идентификация минерала неизвестна. «Хризолит» — распространённый традиционный эквивалент, уместный в перечне драгоценных камней; неопределённость отмечена в сноске.
- source_word: שֹׁהַם
  choice: оникс
  rationale: Традиционный и понятный русский эквивалент в контексте священнических одежд, хотя точное соответствие древнего названия современному минералу остаётся спорным.
- source_word: וְיָשְׁפֵה
  choice: и яшма
  rationale: «Яшма» — общепринятый русский эквивалент; союз ו передан явно.
- source_word: מֽוּסַבֹּת
  choice: они были вставлены
  rationale: Пассивная форма описывает закрепление камней в металлическом обрамлении. Такое выражение естественно по-русски и сохраняет пассивный смысл.
- source_word: מִשְׁבְּצֹת זָהָב
  choice: в золотые оправы
  rationale: מִשְׁבְּצֹת обозначает оправы или гнёзда ювелирной работы; «золотые оправы» ясно передаёт материал и назначение.
- source_word: בְּמִלֻּאֹתָם
  choice: в предназначенные для них гнёзда
  rationale: Техническое выражение относится к местам, которые камни заполняли при установке. Перевод передаёт назначенность соответствующих гнёзд, не выдавая спорную точную механику крепления за несомненную.
