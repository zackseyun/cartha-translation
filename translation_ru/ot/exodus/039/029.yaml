  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: ru
  text: и пояс из тонкого кручёного льна, голубой, пурпурной и алой пряжи — работы вышивальщика, как повелел Яхве Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: пояс
  rationale: Обозначает тканый пояс священнического облачения; «пояс» естественно и точно передаёт предмет одежды в данном контексте.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкий кручёный лён
  rationale: שֵׁשׁ обозначает тонкий лён, а מָשְׁזָר — скрученный или ссученный материал; перевод сохраняет и материал, и способ его обработки.
- source_word: תְכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: голубой, пурпурной и алой пряжи
  rationale: Три выражения обозначают окрашенные текстильные материалы. Слово «пряжа» один раз эксплицирует подразумеваемый материал и естественно согласуется со всем перечислением.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: вышитой работы
  rationale: Фраза указывает на искусную многоцветную текстильную работу; это компактный и традиционно понятный русский эквивалент без излишнего уточнения техники.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Сохраняет повторяющуюся в Исходе формулу точного исполнения Божьего повеления; в русском завершённость действия ясна из контекста.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством культового контекста. Синтаксис сохраняет зависимость от продолжающегося перечня предыдущих стихов; начальное «и» соответствует еврейскому וְ. Цветовые определения согласованы со словом «пряжа», чтобы избежать неестественного перечисления субстантивированных цветов.
