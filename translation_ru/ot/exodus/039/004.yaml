  text: Для него сделали наплечники, присоединённые к нему; на обоих его концах он был соединён.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: наплечники
  rationale: Существительное связано со словом «плечо» и в описании эфода обозначает его части, лежавшие на плечах и соединявшие части одежды. «Наплечники» передаёт конкретную деталь облачения, не уточняя без достаточных оснований, что это были именно ремни.
- source_word: עָשׂוּ
  choice: сделали
  rationale: Обычное значение глагола עשה; прямой и естественный вариант в последовательном описании изготовления облачения.
- source_word: לֹו
  choice: для него
  rationale: Местоименный суффикс мужского рода относится к эфоду, который в русском языке также мужского рода; поэтому сохраняется буквальная и естественная форма.
- source_word: חֹבְרֹת
  choice: соединённые
  rationale: Причастная форма от חבר описывает наплечники как соединённые или соединяющие части. «Соединённые» сохраняет форму и повтор корня с последующим חֻבָּר.
- source_word: עַל שְׁנֵי קצוותו
  choice: на обоих концах
  rationale: Фраза указывает на два края или конца эфода; «на обоих концах» естественно звучит по-русски и не добавляет отсутствующих в тексте конструктивных подробностей.
- source_word: חֻבָּר
  choice: он был соединён
  rationale: Пуаль, перфект, 3-е лицо мужского рода единственного числа. Пассивная конструкция сохраняет грамматическое число исходного текста и повторяет мотив соединения.
