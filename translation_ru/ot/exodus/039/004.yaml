  verdict: revise
  source_fidelity: 'Основной смысл передан верно: речь об эфоде, его наплечных частях и соединении у двух концов. Однако «соединённые наплечники» не выражает достаточно ясно, что חֹבְרֹת описывает их как присоединённые к эфоду; оно может быть понято как соединение наплечников друг с другом.'
