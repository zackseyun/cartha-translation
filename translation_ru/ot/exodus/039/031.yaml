  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: И прикрепили к ней голубой шнур[a], чтобы закрепить её сверху на тюрбане — как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «шнур из голубой нити» или «сине-пурпурный шнур». Еврейское תְּכֵלֶת обозначает характерный окрашенный материал, использовавшийся при скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: прикрепили к ней
  rationale: Глагол נתן буквально означает «дать, положить», но в сочетании с עַל и в данном контексте описывает прикрепление шнура к золотой пластине; местоимение относится к пластине из предыдущего стиха.
- source_word: פְּתִיל
  choice: шнур
  rationale: Слово обозначает скрученную нить или шнур; «шнур» естественно передаёт его функцию крепления.
- source_word: תְּכֵלֶת
  choice: голубая пряжа
  rationale: Термин обозначает характерный окрашенный в сине-голубой или сине-пурпурный цвет материал, использовавшийся при скинии; перевод сохраняет и цвет, и вещественное значение.
- source_word: לָתֵת
  choice: чтобы поместить
  rationale: 'Инфинитив выражает цель: шнур прикрепили для размещения пластины на тюрбане.'
- source_word: הַמִּצְנֶפֶת
  choice: тюрбан
  rationale: Речь идёт об особом головном уборе первосвященника; «тюрбан» — ясный и устоявшийся русский эквивалент.
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: Наречие указывает на верхнее положение; перевод не уточняет «спереди», поскольку этого нет в самом выражении.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Сохранена повторяющаяся формула точного исполнения Божьего повеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» передаёт его распространённую научную реконструкцию и не подменяет имя титулом.
- issue: Референт местоимения в לָתֵת
  choice: поместить её — золотую пластину
  alternative: поместить его — шнур
  rationale: По контексту шнур служит для закрепления на тюрбане священной золотой пластины из предыдущего стиха. В русском местоимение делает эту синтаксическую связь яснее, не добавляя нового предмета.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского; сохранены связь с предыдущим стихом, целевое значение инфинитива и неконкретизированное указание на верхнее положение пластины.
