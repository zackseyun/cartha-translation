base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: ru
  text: 'И увидел Моисей всю работу: вот, они сделали её — как повелел Яхве, так они и сделали. И благословил их Моисей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Передаёт основное значение ראה и не усиливает его до «осмотрел» или «проверил»; оценка результата выражена последующим предложением.
- source_word: כָּל הַמְּלָאכָה
  choice: всю работу
  rationale: מְלָאכָה здесь обозначает всю выполненную работу по устройству святилища; это точное и естественное соответствие.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию הִנֵּה и естественно звучит в возвышенном русском повествовании.
- source_word: עָשׂוּ אֹתָהּ
  choice: они сделали её
  rationale: Сохраняет широкий смысл עשה и местоименную отсылку к «работе», не сужая значение до изготовления отдельных предметов.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: как повелел Яхве
  rationale: Передаёт точное соответствие повелению; «повелел» уместно для צוה, а личное имя יהוה транслитерировано как «Яхве».
- source_word: כֵּן עָשׂוּ
  choice: так они и сделали
  rationale: Сохраняет намеренный повтор глагола עשה и подчёркивает полное соответствие исполненного повелению.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: И благословил их Моисей
  rationale: Прямо и естественно передаёт значение piel глагола ברך; порядок слов сохраняет возвышенный повествовательный ритм.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Форма «Яхве» передаёт его как имя, не заменяя титулом, и соответствует наиболее распространённой научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Повтор «сделали» сохранён как значимый элемент еврейского текста; двоеточие и тире помогают ясно передать переход от осмотра к выводу о точном исполнении.
