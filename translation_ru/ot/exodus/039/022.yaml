lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И сделал он
  rationale: Форма продолжает последовательное повествование; «сделал» прямо и естественно передаёт עשה.
- source_word: מְעִיל הָאֵפֹד
  choice: ризу для эфода
  rationale: מְעִיל обозначает верхнее одеяние; в контексте священнического облачения «риза» уместна как специальное одеяние. Связь с эфодом передана через «для», поскольку это риза, носимая вместе с эфодом, а не изготовленная из него.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: тканую
  rationale: Краткое русское определение естественно передаёт буквальное «работа ткача», то есть изделие ткацкой работы, без добавления не выраженной в тексте оценки мастерства.
- source_word: כְּלִיל
  choice: всю
  rationale: 'Передаёт полноту: всё одеяние целиком было выполнено из указанного материала.'
- source_word: תְּכֵלֶת
  choice: из голубой пряжи
  rationale: Термин обозначает ценное окрашенное в синий/голубой цвет текстильное сырьё; «голубая пряжа» естественно передаёт материальный, а не только цветовой смысл в данном контексте.
