  source_fidelity: В целом смысл передан верно, однако «для эфода» несколько уточняет отношение, которое еврейский генитив оставляет как «риза эфода». «Тканую» заметно сокращает מַעֲשֵׂה אֹרֵג («работа ткача»), не передавая прямо указание на ткацкое изготовление. תְּכֵלֶת обозначает окрашенный текстильный материал; «голубой ткани» передаёт это без излишнего сужения до пряжи.
