revisions:
- from: 'И искусно вытканный пояс его эфода[a], находившийся на нём, составлял с ним одно целое и был выполнен так же, как и он: из золота, голубой, пурпурной и алой пряжи и тонкого кручёного льна, — как повелел Яхве Моисею.'
  to: 'И искусно вытканный пояс его эфода[a], который был на нём, составлял с ним одно целое и был той же работы, что и сам эфод: из золотых нитей, голубой, пурпурной и алой пряжи и тонкого кручёного льна, — как повелел Яхве Моисею.'
