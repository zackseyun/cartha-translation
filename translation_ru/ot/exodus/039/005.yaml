base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: ru
  text: 'И искусно вытканный пояс его эфода[a], который был на нём, составлял с ним одно целое и был той же работы, что и сам эфод: из золотых нитей, голубой, пурпурной и алой пряжи и тонкого кручёного льна, — как повелел Яхве Моисею.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узорчатый пояс его эфода… был из него, той же работы». Еврейский текст подчёркивает, что пояс составлял с эфодом одно целое и соответствовал ему по выработке.'
    reason: Лексическая и синтаксическая альтернатива для חֵשֶׁב, מִמֶּנּוּ הוּא и כְּמַעֲשֵׂהוּ.
lexical_decisions:
- source_word: חֵשֶׁב
  choice: искусно вытканный пояс
  rationale: В контексте священнических одежд слово обозначает тканый пояс эфода; перевод передаёт и предмет, и искусность изготовления.
- source_word: אֲפֻדָּתוֹ
  choice: его эфода
  rationale: Сохранена принадлежность, выраженная местоименным суффиксом третьего лица мужского рода.
- source_word: אֲשֶׁר עָלָיו
  choice: находившийся на нём
  rationale: Прямо передаёт положение пояса на эфоде, не добавляя более определённого смысла «прикреплённый».
- source_word: מִמֶּנּוּ הוּא
  choice: составлял с ним одно целое
  rationale: Естественно по-русски выражает структурную цельность пояса и эфода, подразумеваемую еврейской формулировкой «он был из него».
- source_word: כְּמַעֲשֵׂהוּ
  choice: был выполнен так же, как и он
  rationale: Передаёт соответствие пояса эфоду по способу и качеству работы, сохраняя некоторую обобщённость исходного выражения.
- source_word: זָהָב
  choice: золото
  rationale: Обычное обозначение материала в перечне компонентов эфода.
- source_word: תְּכֵלֶת
  choice: голубая пряжа
  rationale: Традиционный и понятный перевод названия окрашенного текстильного материала; слово «пряжа» эксплицировано по контексту перечня.
- source_word: אַרְגָּמָן
  choice: пурпурная пряжа
  rationale: Передаёт цвет и текстильный характер материала естественным современным русским языком.
- source_word: תוֹלַעַת שָׁנִי
  choice: алая пряжа
  rationale: Передаёт устойчивое обозначение ярко-красного окрашенного материала без ненужного уточнения происхождения красителя.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: тонкий кручёный лён
  rationale: Сохраняет указания на качество материала и способ подготовки льняной нити.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Формула исполнения передана кратко и торжественно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Степень определённости связи пояса с эфодом
  choice: составлял с ним одно целое
  alternative: был из него
  rationale: Контекст описания одежды указывает на цельность конструкции, но буквальная и более неоднозначная формулировка приведена в сноске, чтобы не скрывать особенность еврейского выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому перечню материалов, но перестроен для ясности; подлинная неоднозначность описания пояса отмечена сноской.
