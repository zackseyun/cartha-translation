  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: ru
  text: Так, как Яхве повелел Моисею, сыны Израиля[a] выполнили всю работу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «дети Израиля» или «израильтяне». Буквально: «сыны Израиля» — устойчивое заветное обозначение народа Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... כֵּן
  choice: в полном соответствии со всем, что
  rationale: Соотносительная конструкция выражает полное соответствие выполненной работы данному повелению. Русская формулировка передаёт оба элемента естественно и без ослабления всеохватности כֹּל.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол означает властное предписание. «Повелел» уместно в современном литературном библейском регистре; предшествование повеления ясно из контекста и не требует отдельной видовой формы наподобие английского past perfect.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶת מֹשֶׁה
  choice: Моисею
  rationale: При русском глаголе «повелеть» лицо, получающее повеление, естественно ставится в дательном падеже.
- source_word: עָשׂוּ
  choice: выполнили
  rationale: В сочетании с «работой» глагол передаёт осуществление всего предписанного, не сужая смысл исключительно до изготовления предметов.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняется буквальная форма устойчивого заветного обозначения народа; примечание поясняет его собирательное значение.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: всю работу
  rationale: В контексте изготовления скинии עֲבֹדָה обозначает весь объём порученной работы; этот вариант ясен и сохраняет כָּל.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Выражение буквально имеет форму мужского множественного числа, но в данном контексте является устойчивым собирательным названием народа. Буквальная форма сохранена, а широта обозначения разъяснена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов выстроен естественно для русского; формула «в полном соответствии со всем» сохраняет полноту и соотносительность еврейской конструкции.
