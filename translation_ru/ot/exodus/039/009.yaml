  rationale: Слово обозначает четырёхугольную фигуру с равными длиной и шириной; «квадратным» — точный и естественный современный эквивалент.
- source_word: הָיָה
  choice: был
  rationale: Глагол выступает связкой в описании формы нагрудника.
- source_word: כָּפוּל
  choice: сложенным вдвое
  rationale: Передаёт конструкцию из двух слоёв или предмет, сложенный пополам, не уточняя сверх текста, каким именно способом это было сделано.
- source_word: עָשׂוּ
  choice: сделали
  rationale: Прямой современный эквивалент обычного глагола «делать».
- source_word: הַחֹשֶׁן
  choice: нагрудник
  rationale: В контексте священнического облачения слово обозначает нагрудник первосвященника; этот вариант ясен и не добавляет отсутствующего здесь определения.
- source_word: זֶרֶת
  choice: пядь
  rationale: Сохранена древняя единица длины без приблизительного пересчёта в современные меры.
- source_word: אָרְכּוֹ
  choice: в длину
  rationale: Естественно передаёт размер нагрудника по длине.
- source_word: רָחְבּוֹ
  choice: в ширину
  rationale: Естественно передаёт размер нагрудника по ширине.
