lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: золотой жертвенник
  rationale: Естественно передаёт сочетание «жертвенник [из] золота»; в данном перечне речь идёт о золотом жертвеннике.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: елей для помазания
  rationale: Сохраняет ритуальное значение выражения и звучит ясно в современном литературном русском; «елей» уместен как устойчивое библейское обозначение масла.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: благовонное курение
  rationale: קְטֹרֶת обозначает курение, а הַסַּמִּים — ароматические вещества; выбранное выражение естественно передаёт их совокупный смысл.
- source_word: מָסַךְ
  choice: завеса
  rationale: В контексте святилища это тканевая завеса у входа. Русское «завеса» естественно и не предполагает твёрдой перегородки.
- source_word: פֶּתַח הָאֹהֶל
  choice: для входа в шатёр
  rationale: Передаёт назначение завесы и буквально сохраняет обозначение אֹהֶל как шатра.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: перечень с союзом «и» перед последним элементом
  rationale: Повторяющийся еврейский показатель прямого дополнения с союзом оформляет перечень; русская синтаксическая норма допускает его плавную передачу без повторения союза при каждом элементе.
