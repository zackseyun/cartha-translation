  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: ru
  text: Колокольчик и гранат, колокольчик и гранат — по подолу верхней одежды, вокруг всего подола, для служения[a], как повелел Яхве Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы служить» или «для совершения служения». Еврейский инфинитив указывает на назначение верхней одежды в священническом служении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: колокольчик
  rationale: Существительное обозначает колокольчик; золото прямо упомянуто в предшествующем контексте, но не в этом стихе.
- source_word: רִמֹּן
  choice: гранат
  rationale: Буквально слово означает плод граната; здесь речь идёт об украшении такой формы, однако краткое «гранат» сохраняет конкретный образ исходного текста.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: по всему подолу ризы
  rationale: שׁוּלֵי указывает на нижний край одежды, а סָבִיב — на размещение по всей окружности. «Риза» передаёт особый вид священнической верхней одежды в dignified, но понятной форме.
- source_word: לְשָׁרֵת
  choice: для служения
  rationale: Инфинитив с לְ выражает назначение одежды для священнического служения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: как повелел Яхве Моисею
  rationale: Формула естественно передаёт соответствие выполненной работы ранее данному повелению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога; форма «Яхве» прямо передаёт это имя и не подменяет его титулом.
- issue: Значение לְשָׁרֵת
  choice: для служения
  alternative: чтобы служить; для совершения служения
  rationale: Формулировка сохраняет целевое значение инфинитива и связь одежды со священническим служением, не уточняя сверх текста, кто именно является подразумеваемым субъектом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. Повтор «колокольчик и гранат» сохранён как значимая последовательность элементов; тире помогает естественно присоединить указание места.
