lexical_decisions:
- source_word: אֲרֹן
  choice: ковчег
  rationale: Устоявшееся русское обозначение священного ларя в рассказе о скинии; сохраняет узнаваемость предмета и высокий, но понятный регистр.
- source_word: הָעֵדֻת
  choice: свидетельства
  rationale: Прямо передаёт значение עֵדוּת — «свидетельство» и указывает на хранившиеся в ковчеге скрижали; вариант «завета» был бы более толковательным.
- source_word: בַּדָּיו
  choice: его шесты
  rationale: В контексте скинии בַּד обозначает шесты, с помощью которых переносили священные предметы. «Шесты» естественно и точно звучит по-русски.
- source_word: הַכַּפֹּרֶת
  choice: крышку искупления
  rationale: Сочетание называет золотую крышку ковчега и сохраняет заложенную в термине связь с обрядом искупления. Оно понятнее современному читателю, чем традиционное, но неоднозначное «очистилище».
theological_decisions:
- issue: Передача культового термина כַּפֹּרֶת
  choice: крышка искупления
  alternative: очистительная крышка; крышка; очистилище
  rationale: Перевод одновременно обозначает сам предмет как крышку ковчега и сохраняет его искупительное культовое значение, не уточняя механизм искупления и не привнося позднейших богословских построений.
translation_notes:
  register: 'Современный литературный русский язык с умеренно традиционной библейской лексикой. Сохранена синтаксическая форма фрагмента перечня: все предметы стоят в винительном падеже.'
