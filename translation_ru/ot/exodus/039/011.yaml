  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: ru
  text: 'и второй ряд: бирюза[a], сапфир и алмаз.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное соответствие некоторых древних названий драгоценных камней неизвестно. נֹפֶךְ можно также перевести как «изумруд» или «карбункул», а יָהֲלֹם — как «гиацинт» или «яшма».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: и ... ряд
  rationale: В контексте нагрудника טוּר обозначает ряд камней; союз וְ передан словом «и».
- source_word: הַ/שֵּׁנִי
  choice: второй
  rationale: Порядковое числительное со значением «второй»; вместе с существительным естественно образует сочетание «второй ряд».
- source_word: נֹפֶךְ
  choice: бирюза
  rationale: Точное соответствие древнего названия камня неизвестно. «Бирюза» — вероятный современный эквивалент; другие традиционные варианты приведены в сноске.
- source_word: סַפִּיר
  choice: сапфир
  rationale: Устоявшийся русский эквивалент, хотя древний камень мог не вполне соответствовать сапфиру в современном минералогическом смысле.
- source_word: וְ/יָהֲלֹם
  choice: и алмаз
  rationale: «Алмаз» — распространённый традиционный эквивалент неопределённого древнего названия; возможные альтернативы сохранены в сноске.
