  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: ru
  text: И сделали два золотых кольца и поместили их на двух концах нагрудника, на его краю, обращённом к эфоду с внутренней стороны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутрь» (дословно: «по направлению к дому»). Выражение указывает на сторону нагрудника, обращённую к эфоду; возможен также перевод: «край, находившийся напротив эфода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: золотых кольца
  rationale: טַבַּעַת обозначает кольцо, здесь служащее для крепления частей священнического облачения; сочетание «золотые кольца» естественно передаёт материал.
- source_word: הַחֹשֶׁן
  choice: нагрудника
  rationale: В данном контексте חֹשֶׁן — особая украшенная часть облачения первосвященника. «Нагрудник» точнее современного «наперсник» и не создаёт ассоциации с доспехом, как «нагрудная пластина».
- source_word: שְׂפָתוֹ
  choice: его краю
  rationale: שָׂפָה буквально означает «губа», а применительно к изготовленному предмету — край или кромка; «край» здесь ясно и естественно.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: который был обращён к эфоду
  rationale: Оборот указывает на пространственное отношение края нагрудника к эфоду; «обращён к» сохраняет возможный смысл направленности, не утверждая точнее, чем оригинал, непосредственное прилегание.
- source_word: בָּיְתָה
  choice: с внутренней стороны
  rationale: Направительная форма от בַּיִת буквально означает «внутрь, по направлению внутрь»; в описании расположения деталей естественно передаётся как «с внутренней стороны».
- source_word: וַיָּשִׂימוּ עַל
  choice: и прикрепили их к
  rationale: שׂוּם עַל буквально значит «поместили на»; в контексте установки крепёжных колец русское «прикрепили к» ясно передаёт практическое действие без изменения его результата.
- source_word: שְׁנֵי קְצוֹת
  choice: к двум концам
  rationale: קָצֶה означает конец или крайнюю часть; «два конца» не уточняет форму предмета как углы и сохраняет формулировку источника.
