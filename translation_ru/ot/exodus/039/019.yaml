translation_notes:
  register: Современный литературный русский язык с сохранением ремесленной конкретности текста. Термин «эфод» оставлен как традиционное название части священнического облачения. Дефис перед уточняющим оборотом помогает ясно связать кольца именно с краем нагрудника.
