translation:
  language: ru
  text: завесы двора, его столбы и основания, завесу для входа во двор, верёвки завесы[a] и колья двора, а также все принадлежности для служения при скинии — шатре встречи;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растяжки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: завесы
  rationale: В описании двора это тканые полотнища, образующие ограду; «завесы» естественно и точно передаёт их функцию.
- source_word: חָצֵר
  choice: двор
  rationale: Речь идёт об ограждённом священном пространстве вокруг скинии; «двор» — ясный и устойчивый русский эквивалент.
- source_word: עַמֻּדֶיהָ
  choice: его столбы
  rationale: Это вертикальные опоры ограды двора; «столбы» точнее по конструкции, чем более монументальное «колонны».
- source_word: אֲדָנֶיהָ
  choice: основания
  rationale: Так названы нижние опорные детали, в которые устанавливались столбы; «основания» понятно современному читателю без излишней технической узости.
- source_word: הַמָּסָךְ
  choice: завесу
  rationale: Это тканая завеса у входа; контекст отличает её от полотнищ ограды, хотя по-русски для обоих предметов естественно слово «завеса».
- source_word: לְשַׁעַר הֶחָצֵר
  choice: для входа во двор
  rationale: שַׁעַר может обозначать ворота или вход; поскольку проход закрывался тканой завесой, «вход» не создаёт ложного образа жёстких ворот.
- source_word: מֵיתָרָיו
  choice: его верёвки
  rationale: Это растяжки, которыми закрепляли конструкцию; «верёвки» — непосредственный современный эквивалент, а местоимение по нормам русского языка согласовано со словом «двор».
- source_word: וִיתֵדֹתֶיהָ
  choice: колья
  rationale: Колья забивали в землю для закрепления растяжек; краткое наименование подходит к инвентарному перечню.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: все принадлежности для служения
  rationale: כְּלֵי имеет широкое значение предметов и орудий, поэтому «принадлежности» не сужает его до сосудов; עֲבֹדָה в данном контексте означает священное служение.
- source_word: הַמִּשְׁכָּן
  choice: скинии
  rationale: «Скиния» — укоренившееся русское обозначение переносного святилища и сохраняет культовую специфику термина.
- source_word: לְאֹהֶל מוֹעֵד
  choice: шатре встречи
  rationale: 'Переданы оба компонента названия: אֹהֶל — «шатёр», מוֹעֵד — назначенная встреча; приложение после тире естественно связывает название с предшествующей «скинией».'
theological_decisions:
- issue: Соотношение выражений הַמִּשְׁכָּן и אֹהֶל מוֹעֵד
  choice: «при скинии — шатре встречи»
  alternative: «для скинии, для шатра встречи»
  rationale: В данном перечне оба выражения относятся к одному святилищу. Приложение делает русский текст понятным, не вводя богословского различия между двумя сооружениями.
translation_notes:
  register: Современный литературный русский с достоинством инвентарного библейского перечня. Сохранена синтаксическая незавершённость стиха как продолжения перечня из предыдущего контекста; избегнуты архаизмы «запоны» и «вереи».
