  text: וּ/פִֽי הַ/מְּעִ֥יל בְּ/תוֹכ֖/וֹ כְּ/פִ֣י תַחְרָ֑א שָׂפָ֥ה לְ/פִ֛י/ו סָבִ֖יב לֹ֥א יִקָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: ru
  text: Посередине верхнего одеяния было отверстие, подобное отверстию панциря[a]; по всему краю отверстия шла обшивка, чтобы оно не разрывалось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доспеха», «кольчуги». Еврейское слово תַּחְרָא встречается редко и обозначает защитное воинское одеяние, точный вид которого неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: отверстие верхнего одеяния
  rationale: В контексте одежды פֶּה означает не буквальные «уста», а отверстие; מְעִיל — верхнее одеяние, здесь часть священнического облачения.
- source_word: בְּתוֹכוֹ
  choice: посередине
  rationale: Передаёт центральное расположение отверстия в самом одеянии естественным современным русским языком.
- source_word: כְּפִי תַחְרָא
  choice: подобное отверстию панциря
  rationale: Редкое תַּחְרָא обозначает защитное воинское одеяние, но его точный вид неясен; «панцирь» кратко и понятно передаёт сравнение, а неопределённость отмечена в сноске.
- source_word: שָׂפָה לְפִיו סָבִיב
  choice: по всему краю отверстия шла обшивка
  rationale: Буквальное «край/губа» в швейном контексте обозначает укреплённую окантовку; סָבִיב указывает, что она окружала всё отверстие.
- source_word: לֹא יִקָּרֵעַ
  choice: чтобы оно не разрывалось
  rationale: Нифаль передаёт разрывание, а конструкция в данном описании естественно выражает назначение укреплённого края.
