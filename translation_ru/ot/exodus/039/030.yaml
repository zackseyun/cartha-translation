base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: ru
  text: 'Они сделали из чистого золота пластину — священный венец — и нанесли на неё надпись, как резьбу на печати: «Святыня Яхве»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посвящено Яхве».'
    reason: 'Еврейская формула קֹדֶשׁ לַיהוָה допускает как именную передачу «Святыня Яхве», так и смысл посвящения: «Посвящено Яхве».'
lexical_decisions:
- source_word: צִיץ
  choice: пластина
  rationale: В контексте облачения первосвященника слово обозначает золотую пластину на головном уборе, а не цветок или розетку.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: священный венец
  rationale: Сочетание сохранено как приложение к слову «пластина»; נֵזֶר означает венец или диадему, связанные с посвящением.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Естественно передаёт материал и качество изделия.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: начертали на ней
  rationale: Глагол буквально означает «написали», но в сочетании с последующим указанием на резьбу печати «начертали» естественно описывает нанесение надписи на золото.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: как вырезают на печати
  rationale: Передаёт способ исполнения надписи и сравнение с резьбой печати без тяжеловесной буквальности.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Святыня Яхве
  rationale: Сохраняет краткость формульной надписи и именную форму קֹדֶשׁ; возможный смысл посвящения отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя.
- issue: Смысл посвятительной надписи קֹדֶשׁ לַיהוָה
  choice: Святыня Яхве
  alternative: Посвящено Яхве
  rationale: Еврейское קֹדֶשׁ является существительным и допускает буквальную формулу «Святыня Яхве», тогда как конструкция с לַ может выражать принадлежность или посвящение. Альтернативный смысл сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Пунктуация подчёркивает приложение «священный венец» и отделяет формульную надпись.
