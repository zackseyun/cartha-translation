  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: ru
  text: И если они не поверят тебе и не прислушаются к голосу первого знамения, то поверят голосу следующего знамения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «последнего знамения». Еврейское слово может означать как следующее, последующее, так и последнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И если
  rationale: В условной конструкции формула וְהָיָה אִם естественно передаётся по-русски как «И если»; буквальное «И будет, если» здесь звучало бы тяжеловесно.
- source_word: יַאֲמִינוּ לָךְ
  choice: не поверят тебе
  rationale: Глагол אמן в породе хифиль с ל обозначает доверие словам человека; «поверят тебе» естественно передаёт смысл без добавления значения «веровать в».
- source_word: יִשְׁמְעוּ
  choice: не послушаются
  rationale: שׁמע с לְקוֹל означает не просто физически услышать, а прислушаться, внять. «Послушаются голоса» сохраняет образ оригинала и передаёт отклик на свидетельство знамения.
- source_word: לְקוֹל
  choice: голоса
  rationale: 'Буквальное «голоса» сохраняет олицетворяющий образ: знамение как бы говорит и свидетельствует.'
- source_word: הָאֹת
  choice: знамения
  rationale: «Знамение» — традиционное и понятное русское обозначение данного Богом чудесного свидетельства; оно не требует добавлять отсутствующее в тексте определение «чудесное».
- source_word: הָרִאשׁוֹן
  choice: первого
  rationale: Прямой эквивалент רִאשׁוֹן, образующий ясное противопоставление следующему знамению.
- source_word: וְהֶאֱמִינוּ
  choice: то поверят
  rationale: «То» естественно обозначает следствие в русском условном предложении, передавая функцию результирующей части конструкции.
- source_word: הָאַחֲרוֹן
  choice: следующего
  rationale: אַחֲרוֹן допускает значения «последующий» и «последний». В данном контексте «следующее» ясно противопоставлено первому, но не создаёт ложного впечатления, будто после него не может быть ещё одного знамения.
