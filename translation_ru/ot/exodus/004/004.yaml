  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Протяни руку и схвати её за хвост». Он протянул руку и схватил её, и она стала посохом у него в руке.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и отличает имя Бога от титула «Господь».
- source_word: שְׁלַח יָדְךָ
  choice: Протяни руку
  rationale: Глагол שׁלח в сочетании с «рукой» обозначает направленное движение руки; эта формулировка естественна и сохраняет конкретность повеления.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: и схвати её за хвост
  rationale: אָחַז означает ухватить или крепко взять; конструкция с ב естественно передаётся по-русски как «схватить за хвост». Местоимение женского рода отсылает к змее из предыдущего стиха.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: и схватил её
  rationale: В этой конструкции חזק описывает крепкое овладение предметом. Повтор «схватил» сохраняет связь исполнения с повелением, не создавая ненужного различия в русском тексте.
- source_word: וַיְהִי לְמַטֶּה
  choice: и она стала посохом
  rationale: В контексте превращения היה передаётся как «стала», а מַטֶּה — как «посох», наиболее естественное обозначение носимого в руке жезла или палки.
- source_word: בְּכַפּוֹ
  choice: у него в руке
  rationale: כַּף буквально может обозначать ладонь, но в данном контексте русское «в руке» идиоматично и точно передаёт положение посоха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» сохраняет личное имя, тогда как «Господь» заменяет его титулом; «Иегова» представляет более позднюю традиционную форму.
translation_notes:
  register: Современный литературный русский язык; повествование простое и ясное, с сохранением достоинства библейского стиля. Местоимение «она» явно связывает действия со змеёй из Исх. 4:3. Поскольку существенных для читателя вариантов передачи в этом стихе нет, сноски не добавлены.
