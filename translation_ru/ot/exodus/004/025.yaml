base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: ru
  text: 'Тогда Сепфора взяла кремень, обрезала крайнюю плоть своего сына и коснулась его ног[a]. Она сказала: «Поистине, ты для меня жених крови».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его ног». В еврейском языке «ноги» могут служить эвфемизмом для половых органов; местоимение может относиться либо к Моисею, либо к её сыну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: кремень
  rationale: Существительное обозначает кремень или кремнёвый камень, использованный как режущий инструмент; «кремень» кратко и естественно передаёт предмет в контексте обрезания.
- source_word: עָרְלַת בְּנָהּ
  choice: крайнюю плоть своего сына
  rationale: Прямой и анатомически точный перевод конструкции, естественный для современного русского языка.
- source_word: וַתַּגַּע
  choice: коснулась
  rationale: Глагол נגע обычно означает «касаться»; этот вариант сохраняет простоту исходного выражения и не уточняет способ соприкосновения.
- source_word: לְרַגְלָיו
  choice: его ног
  rationale: Передаёт прямое лексическое значение «его ноги», сохраняя неясность того, к кому относится местоимение; возможный эвфемистический смысл вынесен в сноску.
- source_word: כִּי
  choice: Поистине
  rationale: В данном восклицании כִּי имеет усилительное значение; «поистине» естественно передаёт его торжественно-эмфатическую силу.
- source_word: חֲתַן דָּמִים
  choice: жених крови
  rationale: Необычный буквальный образ сохраняет трудность и многозначность еврейского выражения, не подменяя его толкованием.
- source_word: לִי
  choice: для меня
  rationale: Предлог обозначает личное отношение; «для меня» естественно сочетается в русском с именной формулой «жених крови».
theological_decisions:
- issue: Следует ли понимать «его ноги» как эвфемизм и прямо указать, относятся ли они к Моисею или к сыну
  choice: Сохранить буквальное «его ног», не уточняя референт местоимения
  alternative: «его половых органов»; «ног/половых органов Моисея»; «ног/половых органов сына»
  rationale: Еврейский текст намеренно или фактически остаётся неоднозначным. Основной перевод не разрешает эту известную интерпретационную трудность, а основные возможности отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным, но необычное выражение «жених крови» и неясность местоимения сохранены.
