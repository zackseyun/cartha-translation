  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: ru
  text: 'И сказал Он: «Брось его на землю». Моисей бросил его на землю, и он превратился в змею, и Моисей убежал от неё.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал Он
  rationale: Последовательная форма повествования передана обычным русским «и сказал»; подразумеваемый субъект — Господь из ближайшего контекста.
- source_word: הַשְׁלִיכֵהוּ
  choice: Брось его
  rationale: Императив с местоименным суффиксом мужского рода относится к посоху из предыдущего стиха; это естественная современная формулировка.
- source_word: אַרְצָה
  choice: на землю
  rationale: Направительный суффикс выражает движение к земле; по-русски действие естественно описывается сочетанием «бросить на землю».
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: Моисей бросил его
  rationale: Имя субъекта добавлено из следующей части того же стиха для ясности по-русски, без изменения референции.
- source_word: וַיְהִי לְנָחָשׁ
  choice: и тот превратился в змею
  rationale: Конструкция היה ל־ обозначает превращение; указательное местоимение ясно отсылает к посоху и избегает тяжёлого повтора «он».
- source_word: וַיָּנָס
  choice: а Моисей убежал
  rationale: Глагол נוס выражает бегство прочь; «убежал» естественно и точно передаёт действие в современном русском.
- source_word: מִפָּנָיו
  choice: от неё
  rationale: Буквально «от лица его/неё» — пространственная идиома. Суффикс мужского рода в еврейском согласуется с נָחָשׁ, но в русском референт «змея» женского рода, поэтому требуется «неё».
theological_decisions:
- issue: Субъект וַיֹּאמֶר не назван в самом стихе
  choice: «Он» с прописной буквы
  alternative: «Господь» или «Бог»
  rationale: Прописная буква указывает на Господа как субъекта из контекста, но не вставляет в текст отсутствующее здесь божественное имя.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Синтаксис сохраняет последовательность действий, но избегает неестественной буквальности еврейского оборота מִפָּנָיו.
