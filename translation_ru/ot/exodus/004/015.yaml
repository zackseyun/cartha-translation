  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: ru
  text: Ты будешь говорить ему и вложишь слова в его уста. Я буду с твоими устами и с его устами и научу вас, что вам делать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Слова «вас» и «вам» стоят во множественном числе и относятся к Моисею и Аарону вместе.
    reason: Уточняет значимый переход оригинала от обращения к одному Моисею к обращению к обоим братьям.
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Ты будешь говорить с ним
  rationale: Соединённая с союзом форма перфекта в данном ряду наставлений передаёт предписание. «Говорить с ним» естественно передаёт конструкцию דבר + אל и не усиливает её до категорического «ты должен».
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: и вложишь слова в его уста
  rationale: Глагол שׂים означает «класть, помещать». Русское выражение «вложить слова в уста» сохраняет конкретный образ еврейского текста и в данном контексте означает сообщить Аарону, что говорить.
- source_word: הַדְּבָרִים
  choice: слова
  rationale: Передано существительным во множественном числе, а не обобщающим «весть» или «послание», чтобы сохранить лексику оригинала. Определённость в русском естественно ясна из контекста.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: Я буду с тобой, когда ты говоришь, и с ним, когда говорит он
  rationale: Это естественная современная русская передача буквального образа «буду с твоими устами и с его устами». Сохранены личное присутствие Бога и параллелизм, а буквальная форма приведена в примечании.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: и научу вас
  rationale: Hiphil глагола ירה здесь означает «учить, наставлять». Местоимение «вас» точно выражает множественное число и относит наставление к Моисею и Аарону.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: что вам делать
  rationale: Русская конструкция естественно передаёт «то, что вы будете/должны делать», не навязывая излишне сильной модальности. Форма «вам» согласуется с ясно выраженным множественным числом оригинала.
theological_decisions:
- issue: Антропоморфный образ Божьего содействия речи
  choice: 'Передать выражение естественно: «Я буду с тобой, когда ты говоришь, и с ним, когда говорит он», указав буквальную форму в примечании.'
  alternative: «Я буду с твоими устами и с его устами».
  rationale: Оригинал говорит не просто о безличной помощи, а о Божьем присутствии при речи Моисея и Аарона. Выбранная формулировка сохраняет это содержание, не вводя в современный русский неестественное сочетание «быть с устами».
- issue: Множественное число в заключительной части стиха
  choice: «научу вас, что вам делать»
  alternative: «научу тебя, что делать».
  rationale: Формы אֶתְכֶם и תַּעֲשׂוּן имеют множественное число и включают Моисея и Аарона; перевод явно сохраняет этот переход от единственного числа к множественному.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Выражение «вложишь слова в его уста» сохранено как понятный устойчивый образ; более трудное «быть с устами» раскрыто в основном тексте и буквально отражено в примечании.
