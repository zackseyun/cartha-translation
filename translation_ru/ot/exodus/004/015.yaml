    rationale: Конструкция דבר אל передаёт направленность речи к Аарону. Русское «говорить с ним» может подразумевать разговор как взаимный обмен репликами, чего еврейская формулировка не выражает.
  - severity: medium
    issue: Перефразирование образа «с твоими устами и с его устами» в основном тексте
    rationale: Фраза «с тобой, когда ты говоришь, и с ним, когда говорит он» истолковывает метафору и не воспроизводит конкретную лексику и симметрию еврейского текста. В оптимально-эквивалентном переводе безопаснее сохранить образ в основном тексте.
  revised_text: Ты будешь говорить ему и вложишь слова в его уста. Я буду с твоими устами и с его устами и научу вас, что вам делать[b].
