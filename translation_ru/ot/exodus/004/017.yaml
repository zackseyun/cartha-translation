  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: ru
  text: И возьми этот посох в руку свою[a], которым ты будешь совершать знамения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезл». Еврейское מַטֶּה может обозначать как посох, так и жезл; «посох» лучше соответствует пастушескому контексту Моисея.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чудесные знамения». В еврейском тексте сказано просто «знамения»; их чудесный характер следует из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: И
  rationale: Союз וְ связывает повеление с предыдущими словами; показатель прямого дополнения אֶת отдельно не переводится.
- source_word: הַמַּטֶּה הַזֶּה
  choice: этот посох
  rationale: מַטֶּה может означать посох или жезл; «посох» естественно соответствует пастушескому контексту Моисея, а указательное הַזֶּה обозначает уже упомянутый предмет.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: возьми в руку
  rationale: Имперфект Qal здесь имеет силу повеления. Русская конструкция «возьми в руку» точно и естественно передаёт указание.
- source_word: אֲשֶׁר ... בּוֹ
  choice: им
  rationale: Относительная конструкция указывает на посох как орудие совершения знамений. Двоеточие и местоимение «им» передают эту связь без тяжеловесного «которым».
- source_word: תַּעֲשֶׂה
  choice: будешь совершать
  rationale: Глагол עָשָׂה буквально означает «делать», но в сочетании со знамениями по-русски естественно «совершать»; будущее время сохраняет форму и смысл еврейского имперфекта.
- source_word: הָאֹתֹת
  choice: знамения
  rationale: אוֹת обозначает знак, служащий подтверждением или свидетельством; «знамения» уместно в данном повествовательном контексте и не добавляет отсутствующего в тексте определения «чудесные».
theological_decisions:
- issue: Характер знамений
  choice: Оставлено простое «знамения» без определения «чудесные».
  alternative: «чудесные знамения»
  rationale: Хотя контекст показывает сверхъестественный характер действий, еврейский текст говорит лишь הָאֹתֹת — «знамения»; основной текст не должен делать подразумеваемое явным без необходимости.
- issue: Роль посоха
  choice: 'Посох представлен как орудие: «им ты будешь совершать».'
  alternative: «с его помощью»
  rationale: Предлог בְּ в בּוֹ имеет инструментальный смысл. Формулировка не приписывает посоху самостоятельной силе и одновременно сохраняет прямое указание на его роль.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; двоеточие естественно вводит пояснение о назначении посоха. Архаизмы и конфессионально окрашенные добавления исключены.
