  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: ru
  text: Аарон сказал все слова, которые Яхве сказал Моисею, и совершил знамения на глазах у народа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед народом».'
    reason: Лексический вариант передачи еврейской идиомы לְעֵינֵי הָעָם.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: передал
  rationale: В данном контексте דבר обозначает устное сообщение народу. «Передал» естественно по-русски выражает эту функцию, не добавляя нового содержания.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: все слова
  rationale: Сохраняет конкретную формулировку еврейского текста, не сводя её к более общему «всё».
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: которые Яхве сказал Моисею
  rationale: Естественно передаёт предшествующее речевое действие; в русском языке простое прошедшее время не требует искусственного уточнения давнопрошедшего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיַּעַשׂ
  choice: совершил
  rationale: В сочетании со «знамениями» глагол означает исполнение или совершение данных Богом знамений; «совершил» звучит естественно и не вводит дополнительного толкования.
- source_word: הָאֹתֹת
  choice: знамения
  rationale: Традиционное и понятное обозначение удостоверяющих сверхъестественных знаков; само слово не расширено прилагательным «чудесные».
- source_word: לְעֵינֵי הָעָם
  choice: на глазах у народа
  rationale: Сохраняет зрительный образ еврейской идиомы и при этом естественно звучит на современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено собственное имя Бога. Форма «Яхве» передаёт наиболее распространённую научную реконструкцию произношения, не заменяя имя титулом.
- issue: Субъект глагола וַיַּעַשׂ
  choice: Сохранить естественную грамматическую связь с Аароном
  alternative: Явно назвать Моисея исполнителем знамений
  rationale: В самом стихе новый субъект не указан, поэтому перевод не должен вводить имя Моисея. Как и в еврейском повествовании, ближайшим явно названным субъектом остаётся Аарон.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохраняет компактность повествования, а выражение «на глазах у народа» — наглядность оригинала.
