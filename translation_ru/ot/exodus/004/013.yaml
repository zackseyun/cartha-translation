  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: ru
  text: 'Но он сказал[a]: «Прошу Тебя, Владыка мой, пошли через того, кого Ты пошлёшь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, передавая смысл более явно: «Прошу Тебя, Владыка мой, пошли кого-нибудь другого».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но он сказал
  rationale: 'Последовательный вав обычно продолжает повествование, однако здесь контекст придаёт фразе противительный оттенок: Моисей продолжает возражать после Божьих ответов.'
- source_word: בִּי
  choice: Прошу Тебя
  rationale: В сочетании с почтительным обращением это частица вежливой мольбы, а не буквальное «во мне». Русское «прошу Тебя» естественно передаёт уважительный тон.
- source_word: אֲדֹנָי
  choice: Владыка мой
  rationale: Это почтительное обращение к Богу с суффиксом первого лица, а не имя יהוה. «Владыка мой» сохраняет личный характер обращения и отличает его от передачи Божьего имени.
- source_word: שְׁלַח נָא
  choice: пошли
  rationale: Повелительная форма שלח смягчена частицей просьбы נָא. По-русски оттенок просьбы уже ясно выражен начальным «Прошу Тебя», поэтому второе «пожалуйста» было бы тяжеловесным.
- source_word: בְּיַד
  choice: через того
  rationale: Буквально «рукой [того]» обозначает посредника или исполнителя. Русское «через того» естественно передаёт значение агентивности без неестественного оборота «рукой того».
- source_word: תִּשְׁלָח
  choice: кого пошлёшь
  rationale: Форма имперфекта сохранена в неопределённой конструкции. Такой перевод не добавляет прямо отсутствующее в еврейском тексте слово «другого» и удерживает уклончивость просьбы Моисея.
theological_decisions:
- issue: Толкование уклончивой просьбы Моисея
  choice: 'Сохранить двусмысленность: «пошли через того, кого пошлёшь».'
  alternative: «Прошу Тебя, Владыка мой, пошли кого-нибудь другого».
  rationale: По контексту Моисей явно не желает идти сам, однако в еврейском тексте слово «другого» прямо не выражено. Основной текст сохраняет исходную недосказанность, а смысловой вариант приводится в сноске.
translation_notes:
  register: Современный литературный русский язык с уважительным, но понятным обращением. Синтаксис сохраняет намеренно уклончивую формулировку еврейского текста; прописная буква в «Тебя» соответствует принятому благоговейному регистру прямого обращения к Богу.
