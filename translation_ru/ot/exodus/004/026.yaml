base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: ru
  text: 'И он отступил от него.[a] Тогда она сказала: «Жених крови»[b] — из-за обрезания.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте участники здесь прямо не названы. По ближайшему контексту, вероятнее всего, Господь перестал нападать на Моисея.
    reason: referential_ambiguity
  - marker: b
    text: «Жених крови» — буквальная передача трудного еврейского выражения; возможно, это возглас или обрядовое обозначение, связанное с обрезанием.
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское слово имеет форму множественного числа: буквально «из-за обрезаний» или «в связи с обрядами обрезания».'
    reason: grammatical_number
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: И он отступил от него
  rationale: Глагол רפה здесь передаёт прекращение враждебного действия. «Отступил от него» естественно звучит по-русски, сохраняет значение предлога מן и не вводит в основной текст имена, отсутствующие в еврейской фразе.
- source_word: אָז אָמְרָה
  choice: Тогда она сказала
  rationale: Простая повествовательная формула; женский род указывает на Сепфору из ближайшего контекста.
- source_word: חֲתַן דָּמִים
  choice: Жених крови
  rationale: Дословно сохранено краткое и культурно неясное еврейское выражение, чтобы не сводить его без достаточных оснований к отвращению, обвинению или особому обрядовому титулу.
- source_word: לַמּוּלֹת
  choice: из-за обрезания
  rationale: Редкая форма связана с обрезанием и объясняет предшествующее высказывание Сепфоры. В основном тексте употреблено естественное русское единственное число, а грамматическое множественное число отмечено в сноске.
theological_decisions:
- issue: К кому относятся местоимения в словах «он отступил от него»
  choice: 'Не называть участников прямо в основном тексте; в сноске указать наиболее вероятное контекстуальное понимание: Господь отступил от Моисея.'
  alternative: 'Прямо перевести: «Господь оставил Моисея».'
  rationale: Предыдущий контекст делает это толкование наиболее вероятным, однако сам стих использует только местоименные формы. Их сохранение не устраняет остаточную референциальную неоднозначность.
- issue: Смысл слов Сепфоры «жених крови»
  choice: Сохранить буквальную идиому без окончательного истолкования.
  alternative: Передать её как возглас отвращения, обвинение либо обрядовое наименование.
  rationale: Точное культурное и эмоциональное значение выражения неясно; поясняющий пересказ внёс бы в текст больше, чем позволяет источник.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым повествовательным ритмом. Сохранены непрозрачность идиомы и местоименная неоднозначность; архаизмы и конфессионально окрашенные толкования не вводились.
