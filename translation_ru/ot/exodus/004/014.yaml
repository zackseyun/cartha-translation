  to: 'Тогда гнев Яхве воспылал на Моисея, и Он сказал: «Разве у тебя нет брата Аарона, левита? Я знаю, что он умеет хорошо говорить.[a] И вот, он выходит тебе навстречу; увидев тебя, он обрадуется в сердце своём».'
  rationale: 'Минимально уточнены два выражения: «выходит» точнее передаёт יֹצֵא, а «в сердце своём» сохраняет образ внутренней радости из בְּלִבּוֹ. Остальные решения, включая передачу имени «Яхве» и контекстуальную формулировку «умеет хорошо говорить» со сноской, можно сохранить.'
