  - severity: low
    issue: «обрадуется от всего сердца»
    rationale: Это русское выражение может означать «искренне, всецело», тогда как древнееврейское «в его сердце» указывает на внутреннюю радость. Более близкая формулировка избегает этой смысловой подмены.
