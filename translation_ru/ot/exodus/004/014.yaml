  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: ru
  text: 'Тогда гнев Яхве воспылал на Моисея, и Он сказал: «Разве у тебя нет брата Аарона, левита? Я знаю, что он умеет хорошо говорить.[a] И вот, он выходит тебе навстречу; увидев тебя, он обрадуется в сердце своём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я знаю, что он говорит свободно»; букв.: «говорить он будет говорить».'
    reason: Сохраняет лексическую альтернативу и усилительную древнееврейскую конструкцию, которую невозможно буквально воспроизвести без неестественного повторения.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: гнев Яхве воспылал
  rationale: Сохраняет древнееврейскую метафору разгорающегося гнева и при этом естественно звучит в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: הֲלֹא אַהֲרֹן אָחִיךָ
  choice: Разве у тебя нет брата Аарона
  rationale: Естественно передаёт риторический вопрос, предполагающий утвердительный ответ; принадлежность выражена русской конструкцией «у тебя нет брата».
- source_word: הַלֵּוִי
  choice: левита
  rationale: Обозначает принадлежность Аарона к колену Левия, не приписывая ему здесь ещё не установленную культовую должность.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Я знаю, что он умеет хорошо говорить
  rationale: В контексте возражений Моисея усиленная конструкция с инфинитивом абсолютным указывает на несомненную способность Аарона говорить; сноска сохраняет буквальную форму и возможный оттенок беглости.
- source_word: וְגַם הִנֵּה
  choice: И вот
  rationale: Кратко и естественно передаёт добавочное усиление и указательную функцию הִנֵּה без архаичного «се».
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: он уже идёт тебе навстречу
  rationale: Причастие выражает происходящее или близкое действие; «уже» естественно подчёркивает, что встреча готовится.
- source_word: וְרָאֲךָ
  choice: увидев тебя
  rationale: Деепричастная конструкция естественно передаёт временное отношение к последующему проявлению радости.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: он обрадуется от всего сердца
  rationale: Передаёт искреннюю внутреннюю радость, выраженную древнееврейским упоминанием сердца, естественной русской идиомой.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; форма «Яхве» сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение הַלֵּוִי применительно к Аарону
  choice: левит как представитель колена Левия
  alternative: левит как обладатель позднее установленной культовой должности
  rationale: На данном этапе повествования слово надёжно указывает на родовую принадлежность; перевод не должен преждевременно вносить более позднее должностное различение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена метафора воспылавшего гнева; архаизмы вроде «се» и тяжёлое буквальное повторение устранены. Прямая речь звучит естественно, а подлинная неоднозначность усиленной конструкции о способности Аарона говорить отмечена в сноске.
