  text: וְ/עַתָּ֖ה לֵ֑ךְ וְ/אָנֹכִי֙ אֶֽהְיֶ֣ה עִם פִּ֔י/ךָ וְ/הוֹרֵיתִ֖י/ךָ אֲשֶׁ֥ר תְּדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: ru
  text: А теперь иди. Я буду с твоими устами[a] и научу тебя, что тебе говорить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть: «Я буду с тобой, когда ты будешь говорить».'
    reason: Разъяснение буквального еврейского выражения «с твоими устами» без устранения его образности из основного текста.
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сочетание передаёт и связь с предыдущей речью, и переход к прямому повелению; оно естественно для современного русского языка.
- source_word: לֵךְ
  choice: иди
  rationale: Прямой императив без смыслового расширения соответствует простой повелительной форме еврейского глагола.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: Я буду
  rationale: Будущее значение אֶהְיֶה передано прямо. Отдельное местоимение אָנֹכִי придаёт субъекту выразительность, которую в русском здесь достаточно передают явное «Я» и построение отдельного предложения.
- source_word: עִם־פִּיךָ
  choice: с твоими устами
  rationale: Сохранён конкретный образ исходного текста — Божье присутствие именно с устами Моисея, то есть при его речи. «Уста» звучит достойно и несколько возвышенно, но остаётся понятным современному читателю.
- source_word: וְהוֹרֵיתִיךָ
  choice: и научу тебя
  rationale: Каузативная форма ירה в данном контексте означает наставление; «научу» ясно и естественно связывается с последующим указанием содержания речи.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: что тебе говорить
  rationale: Эта конструкция естественно передаёт содержание будущего наставления и оттенок предназначения или обязанности, не сводя его только к простому предсказанию.
theological_decisions:
- issue: Формула Божьего присутствия при призвании Моисея
  choice: Я буду с твоими устами
  alternative: Я буду с тобой, когда ты будешь говорить
  rationale: 'Основной текст сохраняет конкретный и богословски значимый образ: Бог не просто обещает Моисею способность говорить, но обещает Своё присутствие с его устами. Более разъясняющий вариант дан в примечании, а не подменяет образ оригинала.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Уста» выбрано вместо более разговорного «рот», поскольку оно сохраняет образ исходного текста и достойно звучит в прямой речи Бога; примечание обеспечивает ясность.
