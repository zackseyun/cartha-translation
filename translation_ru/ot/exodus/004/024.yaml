base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: ru
  text: И случилось, что в пути, на месте ночлега[b], Яхве встретил его и хотел убить его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте не уточняется, к кому относится «его»: возможно, к Моисею или, согласно некоторым толкованиям, к его сыну.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «на ночной стоянке». Еврейское слово означает место ночлега, не обязательно постоялый двор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось
  rationale: Передаёт повествовательное введение нового эпизода без архаичного оборота «и было».
- source_word: בַדֶּרֶךְ
  choice: в пути
  rationale: Естественный русский локативный оборот, точно передающий значение еврейского выражения.
- source_word: בַמָּלוֹן
  choice: на месте ночлега
  rationale: מָלוֹן обозначает место, где останавливаются на ночь, не обязательно постоялый двор; перевод избегает анахронизма.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: встретил его
  rationale: Сохраняет основное значение פגע и не вносит в сам глагол враждебность, которая становится ясна из следующей части фразы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיְבַקֵּשׁ
  choice: намеревался
  rationale: В данном сочетании בקש с инфинитивом выражает стремление или намерение совершить действие; вариант звучит естественно и сохраняет напряжённость повествования.
- source_word: הֲמִיתוֹ
  choice: предать его смерти
  rationale: Передаёт каузативную форму глагола מות и сохраняет торжественно-серьёзный регистр исходного высказывания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: К кому относится местоименное «его»
  choice: Сохранить неоднозначность в основном тексте
  alternative: Моисей; сын Моисея
  rationale: В еврейском стихе антецедент местоименных суффиксов прямо не назван. Его отождествление было бы толкованием, поэтому неоднозначность сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет краткость и внезапность исходного повествования; неоднозначный референт местоимения не конкретизирован.
