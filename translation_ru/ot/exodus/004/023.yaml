  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: ru
  text: 'Я сказал тебе: «Отпусти Моего сына, чтобы он служил Мне», но ты отказался отпустить его. Вот, Я убью твоего сына, твоего первенца.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: «отпусти»
  rationale: 'В контексте требования к фараону естественное русское «отпусти» точно передаёт каузативное значение глагола: позволить Израилю уйти.'
- source_word: וְיַעַבְדֵנִי
  choice: «чтобы он служил Мне»
  rationale: Передаёт целевое значение конструкции и широкий смысл עבד — служить, в данном контексте также поклоняться Богу.
- source_word: הִנֵּה
  choice: «вот»
  rationale: Сохраняет вводный указательно-эмфатический сигнал и подчёркивает грядущее возмездие.
- source_word: אָנֹכִי הֹרֵג
  choice: «Я убью»
  rationale: Причастие в прямой угрозе выражает близкое и решительное будущее; русское простое будущее звучит естественно и сохраняет силу высказывания.
- source_word: בְּכֹרֶךָ
  choice: «твоего первенца»
  rationale: Точно передаёт приложение к «твоего сына» и поддерживает противопоставление Израилю как Божьему сыну-первенцу в предыдущем стихе.
theological_decisions:
- issue: Значение «служить» в требовании Бога
  choice: «служил Мне»
  alternative: «поклонялся Мне»
  rationale: Еврейский עבד допускает культовый оттенок, но более широкое «служить» сохраняет лексическую связь и не сужает смысл.
- issue: Определённость угрозы смерти первенца
  choice: «Я убью»
  alternative: «Я намерен убить» / «Я убиваю»
  rationale: Форма הֹרֵג после הִנֵּה представляет действие как предстоящее и неизбежное; будущее время по-русски передаёт это без лишнего толкования.
translation_notes:
  register: Современный литературный русский язык; речь прямая, строгая и торжественная без архаизмов. Прописные местоимения в прямой Божьей речи применены как издательская норма уважительного регистра.
