  terminology: '«Яхве», «Моисей», «фараон», «чудеса», «ожесточу его сердце» и «отпустит народ» уместны. Сноски по содержанию соответствуют еврейским словам, но в английском аудиторском следе ошибочно привязаны маркеры: примечание о Моисее стоит при имени, хотя относится к ожесточению, а примечание о чудесах стоит при «сердце». Русские сноски привязаны правильно и могут быть сохранены.'
