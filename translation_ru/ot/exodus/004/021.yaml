base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Когда пойдёшь обратно в Египет, смотри, чтобы ты совершил перед фараоном все чудеса[a], которые Я вложил в твою руку. Но Я ожесточу его сердце[b], и он не отпустит народ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знамения» или «дивные дела». Еврейское слово обозначает необычайные деяния, которые являют Божью силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «укреплю его сердце» или «сделаю его сердце твёрдым». Еврейский глагол может означать укрепление или придание твёрдости; здесь речь идёт о том, что фараон утвердится в своём упорном отказе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его титулом.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Когда пойдёшь обратно в Египет
  rationale: Естественно передаёт временную конструкцию, идею возвращения и направительный суффикс.
- source_word: רְאֵה
  choice: смотри
  rationale: Сохраняет форму повеления и оттенок настойчивого поручения; в русском сочетание «смотри, соверши» понятно как требование непременно сделать сказанное.
- source_word: הַמֹּפְתִים
  choice: чудеса
  rationale: Обозначает необычайные деяния, являющие Божью силу; возможные значения «знамения» и «дивные дела» отмечены в сноске.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: Я вложил в твою руку
  rationale: Сохраняет конкретный еврейский образ порученного Моисею и данного ему во власть.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: соверши перед фараоном
  rationale: «Совершить чудеса» звучит естественно и передаёт действие в присутствии фараона.
- source_word: וַאֲנִי
  choice: Но Я
  rationale: Русский противительный союз ясно обозначает переход от поручения Моисею к действию Бога.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: Я ожесточу его сердце
  rationale: В контексте рассказа передаёт утверждение фараона в упорном отказе, сохраняя напряжённое утверждение о Божьем действии; более буквальные варианты вынесены в сноску.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: и он не отпустит народ
  rationale: Естественно передаёт отказ фараона позволить народу уйти.
theological_decisions:
- issue: Божественное воздействие на сердце фараона
  choice: Я ожесточу его сердце
  alternative: Я укреплю его сердце; Я сделаю его сердце твёрдым
  rationale: Каузативная форма חזק буквально допускает значения укрепления и придания твёрдости, но в данном повествовательном контексте означает утверждение фараона в непреклонном отказе. Выбранная формулировка не смягчает и не разрешает напряжение между Божьим действием и ответственностью фараона.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены образ «вложил в твою руку», личное имя «Яхве» и богословская напряжённость формулы об ожесточении сердца; избегнуты архаизмы и конфессиональные уточнения.
