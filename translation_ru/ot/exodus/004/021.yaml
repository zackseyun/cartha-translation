  source_fidelity: 'Основной смысл передан точно: временное условие возвращения в Египет, поручение Моисею совершить все данные ему чудеса перед фараоном, Божье ожесточение сердца фараона и последующий отказ отпустить народ сохранены. Однако русское «смотри, соверши» в данном месте звучит неестественно и создаёт впечатление двух раздельных повелений; רְאֵה здесь вводит настоятельное поручение («смотри, чтобы...»).'
