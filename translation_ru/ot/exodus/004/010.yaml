base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: ru
  text: 'Моисей же сказал Яхве: «Молю тебя, Владыка! Я не силён в речах[a] — ни вчера, ни позавчера, ни с тех пор, как Ты говорил со Своим слугой, — ведь у меня тяжёлые уста и тяжёлый язык[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я не человек слов»; образное выражение, относящееся к способности говорить.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «я тяжёл устами и тяжёл языком». Этот образ указывает на трудность речи, но не уточняет, идёт ли речь о нехватке красноречия или об особенности речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בִּי אֲדֹנָי
  choice: Молю тебя, Владыка!
  rationale: בִּי выражает почтительную просьбу, а אֲדֹנָי здесь является обращением-титулом; «Владыка» отличает его от имени Яхве.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: Я не силён в речах
  rationale: Естественно передаёт еврейское «я не человек слов», не сводя смысл исключительно к красноречию или физическому нарушению речи.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: ни вчера, ни позавчера
  rationale: Сохраняет конкретную временную последовательность еврейского выражения и звучит естественно по-русски.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: ни с тех пор, как ты заговорил с твоим слугой
  rationale: Передаёт временное значение מֵאָז и подчёркивает, что Божье обращение к Моисею не изменило его самооценки.
- source_word: עַבְדֶּךָ
  choice: твоим слугой
  rationale: В контексте это почтительное самообозначение Моисея, а не акцент на юридическом положении раба.
- source_word: כִּי
  choice: ведь
  rationale: Естественно вводит основание, которым Моисей объясняет своё возражение.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: у меня тяжёлые уста и тяжёлый язык
  rationale: Сохраняет образность и параллелизм оригинала, не определяя точную природу речевой трудности Моисея.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога; транслитерация сохраняет различие между יְהוָה и обращением אֲדֹנָי.
- issue: Характер речевой трудности Моисея
  choice: Сохранить метафору «тяжёлые уста и тяжёлый язык»
  alternative: «медленно и невнятно говорю»; «косноязычен»; «не красноречив»
  rationale: Оригинал не уточняет, идёт ли речь о недостатке красноречия, неуверенности или физическом нарушении речи, поэтому перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Необычная телесная метафора сохранена ради образности и неоднозначности оригинала; архаизмы вроде «третьего дня» и диагностически окрашенное «косноязычен» не использованы.
