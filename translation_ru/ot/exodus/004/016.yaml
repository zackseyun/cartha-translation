  - marker: b
    text: 'Дословно: «ты будешь ему Богом». Речь идёт о роли Моисея: он передаёт Аарону Божьи слова и обладает данным Богом авторитетом.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: Он будет говорить за тебя народу
  rationale: 'Глагол דבּר в пиэле означает «говорить», а לְךָ в данном контексте указывает на представительство: Аарон будет обращаться к народу от имени Моисея. Русское «за тебя» естественно передаёт эту функцию, не добавляя идеи простого разговора с Моисеем.'
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: и будет тебе устами
  rationale: Сохранена буквальная метафора פֶּה («уста, рот»), обозначающая Аарона как того, кто говорит от имени Моисея. Форма «устами» литературна, понятна и поддерживает параллель со следующим оборотом.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: а ты будешь ему как Бог
  rationale: 'Оборот передаёт роль Моисея по отношению к Аарону: Моисей получает Божьи слова и сообщает их ему. «Как Бог» сохраняет силу сравнения, но не создаёт впечатления, будто Моисей становится Богом по природе.'
theological_decisions:
- issue: Может ли выражение לֵאלֹהִים означать, что Моисей буквально является Богом для Аарона?
  choice: как Бог
  alternative: Богом
  rationale: В контексте речь идёт о данном Богом представительном авторитете и передаче Божьих слов через Моисея Аарону. Основной текст выражает функциональное уподобление, а не утверждение о божественной природе Моисея; более буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением образной параллели «устами — как Бог». «Уста» выбраны вместо разговорного «рот», поскольку в метафорическом употреблении это естественно и достойно по стилю; синтаксис остаётся простым и доступным.
