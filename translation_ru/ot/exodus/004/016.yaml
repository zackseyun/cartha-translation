  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: ru
  text: Он будет говорить народу от твоего имени и будет тебе устами[a], а ты будешь ему как Бог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет твоими устами». Образ «уст» означает, что Аарон будет говорить от имени Моисея.'
