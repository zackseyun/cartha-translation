  variant: modern literary Russian
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: ru
  text: чтобы они поверили, что тебе явился Яхве[a], Бог их отцов[b], Бог Авраама, Бог Исаака и Бог Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно переводится как «ГОСПОДЬ». Возможные варианты передачи имени: «Яхве» и «Иегова».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Бог их предков». Буквально по-еврейски: «Бог их отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно вводит придаточное цели и сохраняет целевую направленность еврейского выражения.
- source_word: יַאֲמִינוּ
  choice: они поверили
  rationale: В данном контексте речь идёт о том, чтобы израильтяне приняли как истинное свидетельство Моисея, подтверждённое знамением.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, во что должны поверить, а не причину.
- source_word: נִרְאָה אֵלֶיךָ
  choice: тебе явился
  rationale: Нифаль глагола ראה здесь означает «явиться»; русский порядок слов естественен и сохраняет обращение к одному мужчине — Моисею.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: Бог их отцов
  rationale: Сохраняет мужской род и традиционную библейскую формулу; вариант «предков» возможен, но менее буквально передаёт אבות.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Бог Авраама, Бог Исаака и Бог Иакова
  rationale: Повтор слова «Бог» перед именем каждого патриарха сохраняет торжественный ритм и эмфазу оригинала.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Передача אֲבֹתָם
  choice: их отцов
  alternative: их предков
  rationale: Форма оригинала — мужское множественное число; буквальная передача сохраняет патриархальную заветную формулу, тогда как «предков» шире по значению.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского ритма. Порядок «тебе явился Яхве» звучит естественно и не создаёт ненужной архаичности; повтор «Бог» перед каждым именем намеренно сохранён.
