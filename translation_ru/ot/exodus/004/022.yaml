  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: ru
  text: 'И скажи фараону: «Так говорит Яхве: Израиль — Мой первородный сын[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально, с сохранением порядка слов в еврейском тексте: «Израиль — Мой сын, Мой первенец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И скажи
  rationale: Перфект qal, 2-е лицо мужского рода единственного числа, с союзом וְ в последовательности наставлений имеет предписывающее значение. Русское «и скажи» естественно продолжает повеление и сохраняет связность контекста.
- source_word: אֶל־פַּרְעֹה
  choice: фараону
  rationale: Русский дательный падеж естественно передаёт адресата, вводимого предлогом אֶל; титул פַּרְעֹה передан общепринятым словом «фараон».
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая вестническая формула передана в торжественном, но понятном современном русском виде.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּנִי בְכֹרִי
  choice: Мой первородный сын
  rationale: Естественная русская формулировка объединяет два приложения и сохраняет как образ сыновства, так и статус первенца; более буквальный порядок приведён в сноске.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма имени; в бессвязочной именной конструкции Израиль отождествляется с Божьим сыном и первенцем.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Образ сыновства и первородства Израиля
  choice: Израиль — Мой первородный сын
  alternative: Израиль — Мой сын, Мой первенец
  rationale: Основной вариант звучит естественно по-русски и сохраняет оба элемента образа, не уточняя сверх текста, относится ли первородство прежде всего ко времени, праву или почётному положению. Более формальное членение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием в формуле Божьей речи. Заглавная буква в «Мой» употреблена по принятой русской издательской традиции для местоимения, относящегося к Богу; тире естественно передаёт бессвязочную именную конструкцию.
