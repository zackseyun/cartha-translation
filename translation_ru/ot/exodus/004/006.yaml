base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: ru
  text: 'И снова сказал ему Яхве: «Положи, пожалуйста, руку за пазуху». Он положил руку за пазуху, и, когда вынул её, вот, его рука была поражена проказой[a], белая как снег.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает состояние, называемое в Ветхом Завете צָרַעַת (цараат); оно не обязательно соответствует современной проказе — болезни Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: עוֹד
  choice: снова
  rationale: В последовательности знамений указывает на ещё одно обращение и естественно передаётся словом «снова».
- source_word: הָבֵא נָא
  choice: вложи, пожалуйста
  rationale: «Вложи» естественно сочетается с рукой и пазухой, а «пожалуйста» передаёт смягчающую оттенок повеления частицу נָא.
- source_word: חֵיק
  choice: пазуха
  rationale: Речь идёт о пространстве у груди под складкой одежды; русское «за пазуху» точно и идиоматично передаёт этот образ.
- source_word: וַיּוֹצִאָהּ
  choice: когда вынул её
  rationale: Местоимение относится к руке; временная связь делает последовательность действий естественной по-русски.
- source_word: וְהִנֵּה
  choice: то увидел
  rationale: Передаёт внезапное обнаружение поразительного результата, выраженное частицей הִנֵּה, без архаичного «вот» в составе громоздкой конструкции.
- source_word: מְצֹרַעַת
  choice: поражена проказой
  rationale: Сохраняет традиционное краткое обозначение состояния, тогда как примечание предупреждает, что библейский термин не обязательно соответствует современной болезни Хансена.
- source_word: כַּשָּׁלֶג
  choice: словно снег
  rationale: Сохраняет лаконичное сравнение исходного текста и не добавляет прямо отсутствующее определение «белая».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо употреблено четырёхбуквенное личное имя Бога; «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер поражения руки
  choice: поражена проказой с пояснением в сноске
  alternative: поражена кожной болезнью
  rationale: Традиционный термин сохраняет связь с ветхозаветной категорией צָרַעַת, а сноска не позволяет без основания отождествить её с современной болезнью Хансена.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «за пазуху» выбран как естественный и культурно понятный эквивалент древнееврейского образа складки одежды у груди; сравнение «словно снег» сохранено без поясняющего добавления «белая».
