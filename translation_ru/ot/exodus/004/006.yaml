  source_fidelity: 'В черновике верно переданы «снова», вежливая частица נָא, действие помещения руки за пазуху, имя Яхве и библейская категория צָרַעַת. Однако «то увидел» вводит отсутствующее в еврейском тексте действие восприятия вместо указательной частицы וְהִנֵּה («вот»). Кроме того, «поражена проказой, словно снег» синтаксически неясно: сравнение может относиться к проказе, а не к виду руки; в контексте оно выражает характерную белизну поражённой руки.'
