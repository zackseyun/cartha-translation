source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею в Мадиаме: «Ступай, возвратись в Египет, потому что умерли все мужчины, искавшие твоей смерти».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная форма глагола אמר естественно передаётся как «И сказал».
- source_word: בְּמִדְיָן
  choice: в Мадиаме
  rationale: Предлог בְּ обозначает место; «в Мадиаме» прямо передаёт локативное значение.
- source_word: לֵךְ שֻׁב
  choice: Ступай, возвратись
  rationale: 'Сохранены оба повелительных глагола: первый выражает движение и побуждение, второй — возвращение; формулировка звучит естественно и достойно по-русски.'
- source_word: מִצְרָיִם
  choice: в Египет
  rationale: Русское управление при глаголе «возвратиться» требует предлога «в».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного повеления.
- source_word: מֵתוּ
  choice: умерли
  rationale: Завершённое действие передано прошедшим совершенным видом; его результат очевиден из контекста.
- source_word: כָּל הָאֲנָשִׁים
  choice: все, кто
  rationale: В контексте речь идёт обо всех людях, покушавшихся на Моисея; русская конструкция избегает тяжеловесного «все мужчины, которые» без утраты смысла.
- source_word: הַמְבַקְשִׁים
  choice: кто искал
  rationale: Причастие обозначает продолжавшееся намерение или действие в прошлом.
- source_word: אֶת נַפְשֶׁךָ
  choice: твоей смерти
  rationale: Идиома буквально говорит об искании жизни/души человека, то есть о стремлении лишить его жизни; «искал твоей смерти» ясно и естественно выражает это по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение אֶת נַפְשֶׁךָ
  choice: твоей смерти
  alternative: твоей жизни; тебя
  rationale: Контекстуальная идиома означает намерение убить Моисея. Выбранная формулировка передаёт смысл, не привнося антропологического толкования слова נֶפֶשׁ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским повествовательным звучанием. Два еврейских императива сохранены как «Ступай, возвратись»; двоеточие естественно вводит прямую речь.
