  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: ru
  text: Народ поверил. Услышав, что Яхве позаботился[a] о сынах Израиля[b] и увидел их бедствие[c], он склонился и поклонился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посетил»; также возможно: «обратил внимание на». Еврейский глагол может подразумевать внимание, переходящее в действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «детях Израиля», «израильтянах». Буквально: «сынах Израиля».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «страдание», «угнетение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: поверил
  rationale: Хифиль глагола אמן означает, что народ поверил переданной вести и подтверждавшим её знамениям. Объект в еврейском тексте не назван, поэтому в переводе он не добавлен.
- source_word: הָעָם
  choice: народ
  rationale: Еврейское собирательное существительное в единственном числе естественно передаётся русским словом «народ».
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: услышав, что
  rationale: Оборот вводит содержание услышанного и связывает его с последовавшим поклонением; деепричастная конструкция естественно передаёт эту временно-причинную связь.
- source_word: פָקַד יְהוָה
  choice: Яхве позаботился
  rationale: Глагол פקד здесь указывает не только на замеченное положение народа, но и на деятельное Божье внимание к нему. «Позаботился» естественно звучит по-русски, а буквальный образ «посетил» сохранён в примечании.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынах Израиля
  rationale: Сохранено буквальное родственное обозначение потомков Израиля, понятное в библейском контексте.
- source_word: רָאָה אֶת עָנְיָם
  choice: увидел их бедствие
  rationale: Сохранён конкретный глагол «увидел», подразумевающий внимательное отношение в данном контексте; «бедствие» передаёт тяжёлое угнетённое положение, выраженное словом עֳנִי.
- source_word: וַיִּקְּדוּ
  choice: склонились
  rationale: Глагол קדד обозначает телесное склонение или поклон; выбранное слово ясно отличает это движение от следующего действия.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонились
  rationale: Глагол обозначает простирание ниц в почтении или поклонении. В контексте реакция направлена к Богу, однако явное дополнение «Ему» не добавлено, поскольку в еврейском тексте его нет.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога — тетраграмматон יהוה. Форма «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Смысл פקד применительно к Божьему действию
  choice: позаботился
  alternative: посетил; обратил внимание на
  rationale: Контекст допускает как оттенок внимательного отношения, так и начало действенного вмешательства. Основной текст передаёт оба аспекта естественным русским выражением, а буквальная идиома отмечена в сноске.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: дети Израиля; израильтяне
  rationale: Сохранена родственная метафора исходного текста без сведения её к одному лишь этнониму.
- issue: Характер последнего действия וַיִּשְׁתַּחֲווּ
  choice: поклонились
  alternative: пали ниц; поклонились Богу
  rationale: «Поклонились» сохраняет возможное совмещение телесного жеста и богопочитания. Дополнение «Богу» контекстуально понятно, но прямо в тексте не выражено.
