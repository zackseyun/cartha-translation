base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: ru
  text: 'И сказал Яхве Аарону: «Ступай в пустыню навстречу Моисею». Он пошёл, встретил Моисея у горы Божьей и поцеловал его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לֵךְ
  choice: Ступай
  rationale: Естественный и достойный русский императив движения в прямой речи.
- source_word: לִקְרַאת מֹשֶׁה
  choice: навстречу Моисею
  rationale: 'Точно и идиоматично передаёт цель движения: пойти, чтобы встретить Моисея.'
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительный суффикс -ה выражает движение к пустыне; русский винительный падеж сохраняет эту направленность.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: встретил Моисея
  rationale: Глагол פגשׁ в данном повествовании означает встречу; повтор имени устраняет возможную для русского местоимения неясность.
- source_word: בְּהַר הָאֱלֹהִים
  choice: у горы Божьей
  rationale: Предлог «у» естественно обозначает место встречи возле горы, не утверждая более узко, что встреча произошла на её склоне.
- source_word: וַיִּשַּׁק לוֹ
  choice: и поцеловал его
  rationale: Прямо передаёт действие без добавленного толкования о его характере.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в еврейском тексте, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным и естественным; союзная последовательность еврейского повествования передана без избыточного многократного «и».
