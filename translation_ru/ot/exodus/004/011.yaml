  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: ru
  text: 'И сказал ему ГОСПОДЬ: «Кто дал человеку уста? Или кто делает его немым, глухим, зрячим или слепым? Не Я ли, ГОСПОДЬ?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: дал человеку уста
  rationale: Буквально «положил/поместил уста человеку»; по-русски естественно и по смыслу точно передаётся как «дал человеку уста».
- source_word: אִלֵּם
  choice: немым
  rationale: Прямое соответствие обозначению человека, лишённого способности говорить.
- source_word: חֵרֵשׁ
  choice: глухим
  rationale: Основное значение слова в данном противопоставительном ряду физических способностей.
- source_word: פִּקֵּחַ
  choice: зрячим
  rationale: В паре с «слепым» слово означает обладающего зрением; «зрячий» точнее сохраняет эту симметрию, чем более широкое «видящий».
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская библейская передача тетраграмматона; прописное написание отличает Божье имя от титула.
theological_decisions:
- issue: Божественная причастность к человеческим способностям и ограничениям
  choice: «Кто делает его немым, или глухим, или зрячим, или слепым? Не Я ли, ГОСПОДЬ?»
  alternative: Смягчить причинность формулировками «кто допускает» или «кто позволяет быть».
  rationale: Еврейский текст употребляет прямое יָשׂוּם («делает/назначает») и риторически приписывает это Яхве. Перевод сохраняет напряжение текста и не вводит отсутствующего в оригинале смягчения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис слегка упрощён для ясности, но риторическая последовательность и параллелизм оригинала сохранены.
