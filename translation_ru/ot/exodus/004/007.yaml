base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: ru
  text: 'И сказал: «Снова положи руку за пазуху».[a] Он снова положил руку за пазуху, а когда вынул её оттуда — вот, она снова стала такой же, как его плоть.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «верни руку в свою пазуху». Пазуха — пространство у груди под одеждой или в её складке.'
    reason: cultural_note
  - marker: b
    text: То есть рука вновь стала такой же, как нормальная плоть на остальном теле.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: снова положи
  rationale: Побудительная форма глагола שׁוב означает вернуть руку в прежнее место. «Снова положи» естественно передаёт повторное действие.
- source_word: חֵיק
  choice: за пазуху
  rationale: В данном контексте חֵיק обозначает пространство у груди под одеждой или в её складке. Русское «за пазуху» точно и естественно описывает это действие.
- source_word: וַיָּשֶׁב
  choice: снова положил
  rationale: Форма повествовательного прошедшего времени повторяет действие повеления; одинаковая формулировка сохраняет эту связь.
- source_word: וַיּוֹצִאָהּ
  choice: вынул её оттуда
  rationale: Каузативная форма יצא буквально означает «вывел/извлёк». Применительно к руке по-русски естественно сказать «вынул»; «оттуда» передаёт מֵחֵיקוֹ без тяжеловесного повторения.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к неожиданному результату. «Вот» сохраняет повествовательную выразительность и подходит современному литературному русскому.
- source_word: שָׁבָה
  choice: стала
  rationale: Буквально глагол означает «вернулась», то есть вновь обрела прежний вид. В сочетании со сравнением כִּבְשָׂרוֹ русское «стала такой же» естественно выражает результат, не добавляя причины или механизма исцеления.
- source_word: כִּבְשָׂרוֹ
  choice: такой же, как всё его тело
  rationale: Предлог כְּ выражает сравнение, а בָּשָׂר — плоть или тело. Добавление «всё» ясно передаёт подразумеваемое сравнение руки с остальной нормальной кожей тела, не вводя отдельного богословского толкования.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским повествовательным тоном. «За пазуху» выбрано вместо архаичного «в лоно»; частица «вот» сохраняет выразительность וְהִנֵּה без архаизации.
