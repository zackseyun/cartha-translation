lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: сказал ... ответил
  rationale: Оба раза употреблён глагол אמר («сказать»), однако второй вводит прямой ответ на вопрос; «ответил» естественно передаёт его функцию в современном русском языке без изменения смысла.
- source_word: אֵלָיו
  choice: ему
  rationale: 'Прямое и естественное соответствие еврейскому предлогу с местоименным суффиксом: «к нему / ему».'
- source_word: מַה־זֶּה / מִזֶּה
  choice: Что это
  rationale: Вопросительное слово с указательным элементом требует назвать находящийся в руке предмет. Русское «Что это у тебя в руке?» естественно и не вводит лишней дистанции, которую могло бы подразумевать «то».
- source_word: בְּיָדֶךָ
  choice: у тебя в руке
  rationale: Сохраняет буквальный образ руки и одновременно звучит идиоматично по-русски.
- source_word: מַטֶּה
  choice: посох
  rationale: В данном контексте это наиболее естественное обозначение носимого Моисеем длинного предмета; еврейское слово также может означать жезл или палку.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Транслитерация сохраняет личное имя, представленное в еврейском тексте, не заменяя его титулом и не привнося конфессионально обусловленного толкования.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным тоном. Формулировка вопроса разговорно естественна, но не снижена; «посох» сохраняет привычный библейский образ без архаизации.
