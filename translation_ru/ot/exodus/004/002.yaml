  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: ru
  text: 'Яхве сказал ему: «Что это у тебя в руке?» Он сказал: «Посох[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезл»; еврейское слово может обозначать посох, жезл или палку — в зависимости от контекста.'
