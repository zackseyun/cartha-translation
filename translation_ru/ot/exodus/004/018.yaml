  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: ru
  text: 'Тогда Моисей пошёл и вернулся к Иетеру, своему тестю, и сказал ему: «Позволь мне пойти и вернуться к моим братьям, которые в Египте, чтобы увидеть, живы ли они ещё». И Иофор[a] сказал Моисею: «Иди с миром».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В начале стиха еврейский текст называет его Иетером, а здесь — Иофором; речь идёт об одном и том же человеке.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: Тогда Моисей пошёл и вернулся
  rationale: Последовательные формы wayyiqtol продвигают повествование; «тогда» естественно передаёт переход к следующему действию, а «вернулся» сохраняет обычное значение שׁוב.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Иефер / Иофор
  rationale: В еврейском тексте действительно употреблены две формы имени одного и того же человека. Основной текст сохраняет это различие, а сноска поясняет его, не прибегая к молчаливой гармонизации.
- source_word: חֹתְנוֹ
  choice: своему тестю
  rationale: По контексту речь об отце жены Моисея; современное русское «тесть» точно и естественно передаёт это родство.
- source_word: אֵלֲכָה נָּא
  choice: Позволь мне пойти
  rationale: Когортатив с נָא выражает вежливую просьбу; такая формулировка естественно передаёт почтительное обращение Моисея.
- source_word: וְאָשׁוּבָה
  choice: и вернуться
  rationale: Сохраняется значение שׁוב и связь с тем же корнем в начале стиха.
- source_word: אַחַי
  choice: моим братьям
  rationale: Это буквальное значение формы; более широкое контекстуальное значение «сородичи» возможно, но не требуется для ясности русского текста.
- source_word: וְאֶרְאֶה הַעוֹדָם חַיִּים
  choice: чтобы увидеть, живы ли они ещё
  rationale: Формулировка естественно передаёт цель возвращения и сохраняет выраженную в вопросительной конструкции неопределённость.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Иди с миром
  rationale: Устойчивое, понятное и стилистически достойное русское соответствие еврейской формуле мирного отпущения и благословения.
