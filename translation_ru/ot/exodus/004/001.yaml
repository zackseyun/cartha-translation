base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: ru
  text: 'Тогда Моисей ответил: «Но вот, они не поверят мне и не станут слушать меня[a], потому что скажут: „Яхве не явился тебе“[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будут слушать моего голоса»; выражение может также означать «не внемлют мне» или «не прислушаются ко мне».'
    reason: lexical_alternative
  - marker: b
    text: 'В традиционных переводах имя «Яхве» часто передаётся как «Господь»: «Господь не явился тебе».'
    reason: translation_tradition
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Тогда Моисей ответил
  rationale: Сочетание двух глаголов речи вводит ответ Моисея; по-русски «ответил» естественно передаёт диалогическую функцию без тяжеловесного удвоения «ответил и сказал».
- source_word: וְהֵן
  choice: Но вот
  rationale: Частица вводит возражение Моисея и привлекает внимание; «но вот» сохраняет как противительный оттенок, так и указательную силу.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: они не поверят мне
  rationale: Форма от אמן с дополнением указывает на неверие словам или заявлению Моисея; это прямо и естественно выражается по-русски.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: и не послушаются моего голоса
  rationale: Сохранён еврейский образ «голоса», а глагол «послушаются» передаёт возможный оттенок не только слышания, но и принятия сказанного; примечание отмечает более нейтральную альтернативу.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание опасения Моисея.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: не являлся тебе
  rationale: Нифаль глагола ראה здесь означает «являться»; несовершенно-видовая форма по-русски естественно передаёт отрицание предполагаемого факта богоявления без излишнего уточнения его однократности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, не заменяя её титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет это различие, тогда как «Господь» отражает традицию чтения имени как титула.
- issue: Оттенок выражения שׁמע בקול
  choice: не послушаются моего голоса
  alternative: не станут слушать меня
  rationale: Выражение допускает значения «слушать», «внимать» и «повиноваться». Основной текст сохраняет образ голоса и оттенок действенного отклика, а примечание оставляет открытым более нейтральное понимание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксическая избыточность формулы «ответил и сказал» устранена ради естественности, но ход реплики и образ «голоса» сохранены.
