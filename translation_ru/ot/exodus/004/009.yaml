source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: ru
  text: И если они не поверят даже этим двум знамениям и не послушают твоего голоса[a], то возьми воды из Нила и вылей её на сушу. Вода, которую ты возьмёшь из Нила, станет кровью[b] на суше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не внемлют тебе». Буквально: «не послушают твоего голоса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «превратится в кровь»; буквально: «будет кровью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: И если
  rationale: Сочетание вводит условную ситуацию; «И если» естественно продолжает повествование и не воспроизводит буквально служебное «и будет».
- source_word: יַאֲמִינוּ
  choice: не поверят
  rationale: В данном контексте форма от אמן означает признать убедительность данных знамений, поверить им.
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: даже этим двум знамениям
  rationale: '«Даже» передаёт усилительное גַּם и нарастание условия: речь идёт о двух ранее данных знамениях.'
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: не послушают твоего голоса
  rationale: Перевод сохраняет еврейский оборот «слушать голос», который здесь также подразумевает внимание и повиновение; возможный смысл отмечен в сноске.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: воды из Нила
  rationale: 'Родительный единственного числа после «возьми» естественно передаёт партитивный смысл: взять некоторое количество воды. יְאֹר в повествовании Исхода обозначает Нил.'
- source_word: וְשָׁפַכְתָּ הַיַּבָּשָׁה
  choice: вылей её на сушу
  rationale: «Вылей» естественно передаёт שפך, а местоимение «её» явно указывает на воду. «Суша» сохраняет противопоставление воде и повтор ключевого обозначения.
- source_word: וְהָיוּ ... לְדָם
  choice: станет кровью
  rationale: Конструкция היה + ל обозначает переход в новое состояние или результат; «станет кровью» прямо выражает превращение, не ослабляя утверждение текста.
- source_word: דָם
  choice: кровь
  rationale: Существительное прямо означает кровь; контекст не даёт оснований заменять его выражениями «красная» или «похожая на кровь».
theological_decisions:
- issue: Характер знамения с водой из Нила
  choice: 'Прямое превращение: «станет кровью»'
  alternative: «станет красной, как кровь» или «будет выглядеть как кровь»
  rationale: Еврейский текст без оговорок говорит, что вода станет кровью. Перевод не должен вводить отсутствующее в оригинале натуралистическое объяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены повтор «из Нила» и образ «суши»; синтаксис разделён на два предложения для ясности без изменения логики стиха.
