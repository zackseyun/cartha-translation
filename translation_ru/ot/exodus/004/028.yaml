base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: ru
  text: Моисей рассказал Аарону обо всех словах Яхве, пославшего его[a], и обо всех знамениях, которые Он повелел ему совершить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обо всех словах Яхве, с которыми Он послал его». Еврейское относительное придаточное можно теснее связать со словом «слова»; в любом случае речь идёт о том, что Яхве послал Моисея.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: пересказал
  rationale: Порода hифиль глагола נגד означает «сообщить, рассказать». «Пересказал» естественно передаёт сообщение Аарону ранее полученных слов.
- source_word: דִּבְרֵי יְהוָה
  choice: все слова Яхве
  rationale: Сохраняется формальное значение множественного דְּבָרִים и связь с данным Моисею устным поручением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: пославшего его
  rationale: Относительное придаточное понято как относящееся к Яхве; причастный оборот позволяет естественно сохранить неоднозначность местоимения в русском контексте.
- source_word: הָאֹתֹת
  choice: знамениях
  rationale: «Знамение» — точный и уместный в библейском повествовании эквивалент אוֹת, не добавляющий прямо не выраженного определения «чудесный».
- source_word: אֲשֶׁר צִוָּהוּ
  choice: которые Он повелел ему совершить
  rationale: По-русски знамения обычно «совершают» или «показывают»; добавленный инфинитив выражает подразумеваемое действие при צוה и устраняет неестественное «повелел знамения».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие без замены именем-титулом.
- issue: Связь אֲשֶׁר שְׁלָחוֹ с предшествующим выражением
  choice: «пославшего его» относится к Яхве
  alternative: «слова Яхве, с которыми Он послал его»
  rationale: Наиболее непосредственным референтом мужского единственного числа может быть Яхве, но еврейский синтаксис допускает тесную связь относительной конструкции со «словами»; альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Союз «и» перед «обо всех знамениях» сочетается с управлением глагола «пересказал» в значении подробного сообщения; прописное «Он» помогает прояснить смену референта, не вводя дополнительного толкования.
