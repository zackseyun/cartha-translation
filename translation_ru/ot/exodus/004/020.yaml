base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: ru
  text: Тогда Моисей взял жену и сыновей, посадил их на осла и вернулся в землю Египта. Моисей взял посох Божий в свою руку.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Тогда Моисей взял
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт последовательность событий, а «взял» — основное значение לקח.
- source_word: אִשְׁתּוֹ
  choice: жену
  rationale: Контекст ясно указывает на жену Моисея; притяжательное отношение естественно выражено конструкцией при названном подлежащем.
- source_word: בָּנָיו
  choice: сыновей
  rationale: Еврейское слово стоит во множественном числе мужского рода и означает именно «его сыновей», а не обобщённо «детей».
- source_word: וַיַּרְכִּבֵם
  choice: посадил их
  rationale: Порода hифиль глагола רכב выражает побуждение или содействие езде; «посадил их на осла» естественно и точно передаёт каузативный смысл.
- source_word: הַחֲמֹר
  choice: на осла
  rationale: Существительное определённое, однако в русском после «посадил» форма «на осла» естественно обозначает конкретное животное без обязательной передачи артикля отдельным словом.
- source_word: וַיָּשָׁב
  choice: отправился обратно
  rationale: Глагол שוב обозначает возвращение. Поскольку Моисей ранее лично не жил в Египте после бегства вместе с этой семьёй и конструкция далее задаёт направление, «отправился обратно» сохраняет значение возвращения и звучит естественно.
- source_word: אַרְצָה מִצְרָיִם
  choice: в землю Египетскую
  rationale: Направительный суффикс при אֶרֶץ выражает движение к месту; традиционно-достоинная, но понятная русская конструкция сохраняет слово «земля».
- source_word: מַטֵּה הָאֱלֹהִים
  choice: Посох Божий
  rationale: מַטֶּה может означать посох или жезл; «посох» — современное и конкретное обозначение предмета, который Моисей несёт и которым совершает знамения. Родительное отношение передано прилагательным «Божий».
- source_word: בְּיָדוֹ
  choice: в руку
  rationale: При глаголе «взял» русский язык естественно требует направительную конструкцию «в руку», которая функционально передаёт еврейское «в его руке».
theological_decisions:
- issue: Значение הָאֱלֹהִים в сочетании מַטֵּה הָאֱלֹהִים
  choice: Божий
  alternative: божественный
  rationale: В контексте призвания Моисея и данных ему знамений речь идёт о конкретном Боге, а не просто о сверхъестественном качестве посоха.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской торжественностью. Инверсия «Посох Божий Моисей взял в руку» сохраняет выделение посоха в еврейском тексте и повтор имени Моисея, не делая фразу архаичной. Сноски не добавлены: английские маркеры не соответствуют собственным примечаниям (примечание [a] относится не к «сыновьям», а к глаголу посадки; [b] — не к Египту, а к посоху), а варианты не требуют публикационного пояснения.'
