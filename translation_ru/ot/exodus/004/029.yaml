  text: וַ/יֵּ֥לֶךְ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן וַ/יַּ֣אַסְפ֔וּ אֶת כָּל זִקְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/029.yaml
  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: ru
  text: И пошли Моисей и Аарон и собрали всех старейшин сынов Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; традиционно также: «детей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошли
  rationale: Форма wayyiqtol продвигает повествование и здесь естественно передаётся глаголом «пошли». Хотя еврейский глагол стоит в единственном числе перед двумя однородными подлежащими, по-русски требуется множественное число.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма личного имени.
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Устоявшаяся русская форма личного имени.
- source_word: וַיַּאַסְפוּ
  choice: собрали
  rationale: В данном контексте אסף означает собрать людей вместе; «собрали» точно и естественно передаёт значение переходного глагола.
- source_word: אֵת
  choice: '[отдельно не переводится]'
  rationale: Показатель определённого прямого дополнения, не имеющий самостоятельного соответствия в русском языке.
- source_word: כָּל
  choice: всех
  rationale: Передаёт значение полноты и согласуется с одушевлённым прямым дополнением во множественном числе.
- source_word: זִקְנֵי
  choice: старейшин
  rationale: Здесь זקנים обозначает признанных руководителей общины; «старейшины» сохраняет связь с возрастом и общественную функцию.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет явный родственный образ еврейского выражения и его значение происхождения от Израиля (Иакова), не сводя его к одному этнониму.
theological_decisions:
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Выбранный вариант сохраняет форму родства и идею происхождения от Израиля. Вариант «израильтян» естественнее как этноним, но устраняет этот образ; «детей Израиля» шире по грамматическому роду и имеет традиционные параллели, однако менее точно передаёт мужское множественное число בנים.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор союза «и» сохраняет последовательный, координированный строй еврейской фразы, оставаясь понятным по-русски.
