  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: ru
  text: Пусть они не живут на твоей земле, чтобы они не склонили тебя ко греху против Меня[a]. Ведь если ты станешь служить их богам[b], это станет для тебя ловушкой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они не заставили тебя согрешить против Меня»; также возможно: «чтобы они не ввели тебя в грех против Меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ведь ты станешь служить их богам». Еврейский союз можно понимать как пояснительный, а эту фразу — как указание на вероятный исход, а не как простое условие.'
    reason: alternative_reading
  - marker: c
    text: '«Ловушка» передаёт еврейское слово מוֹקֵשׁ (мокеш): буквально это западня, а в переносном смысле — то, что ведёт к отпадению или гибели.'
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: живут
  rationale: Глагол ישׁב здесь обозначает длительное проживание на данной территории. «Живут» естественно звучит по-русски и не уточняет сверх текста, идёт ли речь о формальном поселении или просто о пребывании.
- source_word: בְּאַרְצְךָ
  choice: в твоей земле
  rationale: «Земля» сохраняет территориальный и заветный оттенок אֶרֶץ в контексте Исхода; местоимение передаёт форму второго лица единственного числа.
- source_word: פֶּן
  choice: чтобы не
  rationale: פֶּן вводит нежелательное последствие, которого призван запретить предшествующий приказ. Оборот «чтобы не» передаёт эту предупредительно-предотвратительную силу современным русским языком.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: склонить тебя ко греху против Меня
  rationale: Каузативная порода глагола חטא означает побудить или привести другого ко греху. «Склонить ко греху» естественно передаёт причинный смысл, а «против Меня» выражает этическое значение לִי.
- source_word: כִּי תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: ведь если ты станешь служить их богам
  rationale: עבד при наименовании богов означает культовое служение и верность им. Условная формулировка естественно связывает идолопоклонство с последующей угрозой, а неоднозначность כִּי отмечена в сноске.
- source_word: אֱלֹהֵיהֶם
  choice: их богам
  rationale: Прямое и понятное соответствие множественному אֱלֹהִים в полемическом контексте запрета служения чужим богам.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: это станет для тебя ловушкой
  rationale: מוֹקֵשׁ — западня или ловушка; здесь слово метафорически обозначает то, что ведёт к отпадению и гибели. «Станет» ясно передаёт будущий результат, не добавляя отсутствующего в еврейском тексте отдельного усилителя.
theological_decisions:
- issue: Характер греха, о котором дано предупреждение
  choice: Предупреждение относится прежде всего к заветной неверности, выраженной в служении чужим богам.
  alternative: Общее предупреждение о нравственном разложении под влиянием иноплеменных соседей.
  rationale: Непосредственно следующая фраза о служении «их богам» определяет грех как идолопоклонство. Перевод не превращает это предупреждение в общее утверждение об этническом или культурном отделении.
- issue: Логическая связь фразы כִּי תַעֲבֹד
  choice: 'Основной текст передаёт её как условие: «если ты станешь служить».'
  alternative: 'Её можно понимать как объяснение или ожидаемый исход: «ведь ты станешь служить их богам».'
  rationale: Союз כִּי допускает объяснительное прочтение, однако в данном контексте условная передача ясно выражает связь между служением богам и ловушкой. Альтернатива сохранена в сноске, чтобы не устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Сохранено обращение на «ты» как грамматическое единственное число еврейского текста. Выбрано общеупотребительное «ловушка» вместо более архаичного «западня»; причинный смысл каузатива передан естественным оборотом «склонить ко греху».
