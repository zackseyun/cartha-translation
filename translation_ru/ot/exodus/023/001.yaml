  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: ru
  text: Не распространяй ложный слух. Не вступай в сговор со злодеем, чтобы стать злонамеренным свидетелем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не клади руки своей с нечестивым, чтобы быть свидетелем насилия». Оборот «класть руку с кем-либо» обозначает содействие или соучастие; слово חָמָס может означать насилие, злодеяние или вопиющую несправедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: распространяй
  rationale: נשא буквально означает «поднимать, нести», но в сочетании со שֵׁמַע передаёт распространение услышанного сообщения или слуха.
- source_word: שֵׁמַע שָׁוְא
  choice: ложного слуха
  rationale: שֵׁמַע — услышанное сообщение или слух, а שָׁוְא — ложь, пустота, тщета; в данном правовом контексте речь идёт о ложном сообщении, которое нельзя передавать дальше.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: соглашайся со
  rationale: Буквально «клади свою руку с»; это образ совместного участия или содействия. «Соглашайся со» естественно передаёт соучастие в неправом свидетельстве.
- source_word: רָשָׁע
  choice: злодеем
  rationale: Слово обозначает нечестивого, виновного или преступного человека. «Злодей» сохраняет сильную нравственно-правовую оценку и мужской род единственного числа.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: быть свидетелем неправды
  rationale: חָמָס может означать насилие, злодеяние или вопиющую несправедливость. В судебном контексте «свидетель неправды» сохраняет более широкую идею неправого, губительного для правосудия свидетельства, не сводя выражение лишь к фактической лжи.
- source_word: לֹא / אַל
  choice: не распространяй / не соглашайся
  rationale: Обе части выражают прямой запрет; современный русский повелительный оборот с «не» звучит ясно и сохраняет юридическую силу.
theological_decisions:
- issue: Смысл выражения עֵד חָמָס
  choice: свидетель неправды
  alternative: лжесвидетель; злонамеренный свидетель; свидетель насилия
  rationale: חָמָס шире простой лжи и включает насилие и тяжкую несправедливость. Выбранный вариант сохраняет правовой контекст и смысл неправедного свидетельства, не устраняя лексическую напряжённость.
- issue: Мужской род единственного числа в правовом наставлении
  choice: сохранить единственное число и мужской род в слове «злодей»
  alternative: нейтральное «нечестивый человек» или множественное число
  rationale: Еврейский текст обращён к одному лицу и называет соучастника формой мужского рода единственного числа; русский вариант сохраняет эту форму без утверждения, что запрет относится только к мужчинам.
translation_notes:
  register: Современный литературный русский язык с кратким, строгим звучанием правовой заповеди. «Слух» естественно выражает услышанное и распространяемое сообщение; «свидетель неправды» сохраняет судебный контекст и смысловую широту חָמָס.
