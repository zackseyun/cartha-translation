  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: ru
  text: Три раза в году все мужчины среди тебя должны предстать перед Господом Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Три раза в году
  rationale: Прямо и естественно передаёт частотность в пределах годового цикла, сохраняя форму еврейского выражения.
- source_word: יֵרָאֶה
  choice: должен являться
  rationale: Нифаль глагола ראה в данном контексте идиоматически означает являться перед высшим лицом или Богом; буквальное «быть увиденным» по-русски затемнило бы смысл.
- source_word: כָּל זְכוּרְךָ
  choice: каждый мужчина у тебя
  rationale: Сохраняет обращение во втором лице единственного числа и прямое указание на лиц мужского пола; звучит естественнее буквального «всякий твой мужчина».
- source_word: אֶל פְּנֵי
  choice: пред
  rationale: Кратко и в уместном возвышенном регистре передаёт значение появления в чьём-либо присутствии.
- source_word: הָאָדֹן
  choice: Владыкой
  rationale: Отличает божественный титул אָדוֹן от следующего за ним личного имени и избегает неестественного сочетания «Господом Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
theological_decisions:
- issue: Передача сочетания הָאָדֹן יְהוָה
  choice: Владыкой Яхве
  alternative: Господом Яхве; Владыкой, Господом
  rationale: Еврейский текст сочетает титул הָאָדֹן с личным именем יְהוָה. «Владыка Яхве» сохраняет оба элемента и не превращает имя в другой титул.
- issue: Значение יֵרָאֶה
  choice: должен являться
  alternative: будет увиден; должен предстать
  rationale: Форма допускает буквальное понимание «будет увиден», однако в формуле паломничества обычно имеет идиоматический смысл «являться». Модальность обязанности обусловлена законодательным контекстом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Форма «пред» соответствует сцене официального предстояния, а «Владыка» позволяет ясно сохранить различие между титулом и именем Яхве.
