lexical_decisions:
- source_word: כִּי תִרְאֶה
  choice: Если увидишь
  rationale: כִּי вводит условный случай в правовом наставлении, а ראה буквально означает «видеть»; сочетание естественно передаёт условие.
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: осёл ненавидящего тебя
  rationale: Причастие שֹׂנֵא обозначает именно того, кто ненавидит адресата; перевод не расширяет значение до более общего «враг».
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: лежит под своей ношей
  rationale: Сохраняется образ животного, лежащего под грузом, без добавления отсутствующего в тексте уточнения о падении или изнеможении.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: и захочешь оставить его без помощи
  rationale: Трудная конструкция передаёт возможное уклонение от содействия. Такая формулировка сохраняет игру между обычным значением עזב «оставлять» и контекстуальным значением «помогать».
- source_word: עָזֹב תַּעֲזֹב
  choice: непременно помоги
  rationale: Инфинитив абсолютный с личной формой усиливает повеление; в данном контексте עזב означает оказание помощи с ношей.
- source_word: עִמּוֹ
  choice: ему вместе с хозяином
  rationale: Буквально «с ним». Основной текст относит местоимение к владельцу и выражает совместное действие; добавление «с хозяином» по-русски устраняет неясность синтаксической связи, тогда как возможное отнесение к ослу отмечено в сноске.
theological_decisions:
- issue: К кому относится עִמּוֹ («с ним»)
  choice: 'к хозяину осла: «вместе с хозяином»'
  alternative: 'к ослу: помочь ему с ношей'
  rationale: Мужской род единственного числа грамматически допускает оба референта. Основной вариант подчёркивает помощь человеку, который ненавидит адресата, но подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой правовой формулировкой. Сохранены конкретный образ осла, характеристика владельца как «ненавидящего тебя», усиленное повеление и отмеченная сноской неоднозначность местоимения.
