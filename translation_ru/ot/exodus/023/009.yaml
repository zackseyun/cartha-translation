  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: ru
  text: 'Не притесняй пришельца[a]: вы сами знаете, что у пришельца на душе[b], потому что и вы были пришельцами в Египте.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземца», «переселенца», «иноземца». Еврейское гер обозначает человека, живущего не на своей родине среди другого народа и нередко находящегося в социально уязвимом положении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вы знаете душу пришельца» — то есть по собственному опыту знаете его внутреннее состояние и жизненные тяготы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: пришелец
  rationale: Слово обозначает не коренного жителя, поселившегося среди другого народа и потому нередко находящегося в уязвимом положении. «Пришелец» сохраняет социально-правовую категорию текста лучше, чем более широкое «чужеземец».
- source_word: תִלְחָץ
  choice: не притесняй
  rationale: В данном правовом контексте глагол выражает угнетающее давление, эксплуатацию или злоупотребление уязвимым положением человека.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: вы сами знаете
  rationale: Отдельно выраженное местоимение אַתֶּם придаёт фразе эмфатический оттенок, а форма глагола указывает на знание, приобретённое собственным опытом.
- source_word: אֶת נֶפֶשׁ הַגֵּר
  choice: что у пришельца на душе
  rationale: Русская идиома естественно передаёт знание внутреннего состояния и пережитого опыта пришельца, сохраняя образ נֶפֶשׁ без неестественной фразы «знать душу».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание заповеди — собственный опыт Израиля в Египте.
- source_word: גֵרִים הֱיִיתֶם
  choice: и вы были пришельцами
  rationale: Повтор слова «пришельцы» сохраняет лексическую связь с началом стиха; частица «и» подчёркивает сопоставление с нынешними пришельцами.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египте
  rationale: Так естественно по-русски передаётся еврейское географическое выражение «в земле Египта» без утраты смысла.
theological_decisions:
- issue: Передача גֵר в законодательном контексте завета
  choice: пришелец
  alternative: чужеземец; переселенец; временный поселенец
  rationale: Заповедь опирается на опыт Израиля как некоренного и зависимого населения в Египте. Выбор не сводит понятие только к этнической чуждости и сохраняет повтор одного термина в обеих половинах стиха.
- issue: Смысл выражения נֶפֶשׁ הַגֵּר
  choice: что у пришельца на душе
  alternative: душу пришельца; каково быть пришельцем; переживания пришельца
  rationale: Выбранная формулировка сохраняет образ «души» и одновременно передаёт эмпатическое знание внутреннего состояния, не утверждая узкого антропологического определения נֶפֶשׁ.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Единственное число в повелении сохранено по еврейскому тексту; во второй части множественное число обращено ко всему народу. «Что у пришельца на душе» — естественная русская идиома, пояснённая буквальным вариантом в сноске.
