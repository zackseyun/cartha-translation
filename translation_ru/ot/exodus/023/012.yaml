source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: ru
  text: Шесть дней делай свою работу, а в седьмой день прекрати работать[a], чтобы отдохнули твой вол и твой осёл, а сын твоей рабыни[b] и переселенец[c] восстановили силы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перестань»; еврейский глагол прежде всего означает прекращение, остановку деятельности.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово можно также перевести как «сын твоей служанки».
    reason: lexical_alternative
  - marker: c
    text: «Переселенец» — чужеземец, постоянно живущий среди израильтян и находящийся в рамках их общественного и правового порядка.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: Шесть дней делай свою работу
  rationale: Временное выражение обозначает продолжительность, а сочетание глагола עשה с מַעֲשֶׂיךָ — обычную работу или занятия человека. Формулировка естественна для современного русского языка и сохраняет силу предписания.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי תִּשְׁבֹּת
  choice: а в седьмой день прекрати работать
  rationale: Глагол שׁבת прежде всего означает прекращение деятельности. Русское «прекрати работать» ясно выражает противопоставление шести рабочим дням и не сводит смысл лишь к личному отдыху.
- source_word: לְמַעַן יָנוּחַ שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: чтобы отдохнули твой вол и твой осёл
  rationale: לְמַעַן вводит цель, а נוח обозначает покой и отдых. «Вол» передаёт рабочее животное в земледельческом контексте, «осёл» является современным нейтральным соответствием.
- source_word: וְיִנָּפֵשׁ
  choice: восстановили силы
  rationale: Форма от נפשׁ передаёт возвращение дыхания, бодрости и сил после труда. «Восстановили силы» естественно выражает этот результат по-русски.
- source_word: בֶּן אֲמָתְךָ
  choice: сын твоей рабыни
  rationale: Буквально — «сын твоей рабыни/служанки». Выбор сохраняет указанную в тексте зависимость женщины и не заменяет конкретное родственное обозначение более общим словом «слуга».
- source_word: וְהַגֵּר
  choice: и переселенец
  rationale: גֵּר обозначает живущего среди израильтян чужеземца, включённого в их общественно-правовой порядок. «Переселенец» лучше, чем расплывчатое «чужой» или предполагающее краткое пребывание «странник», передаёт устойчивое проживание среди народа.
theological_decisions:
- issue: Смысл глагола שׁבת в постановлении о седьмом дне
  choice: прекрати работать
  alternative: отдыхай
  rationale: Сохранён основной смысл прекращения деятельности; последующие части стиха отдельно описывают отдых животных и восстановление сил зависимых людей.
- issue: Передача общественно-правового термина גֵּר
  choice: переселенец
  alternative: пришелец; живущий среди вас чужеземец
  rationale: Выбранное слово обозначает не просто незнакомца, а чужеземца, постоянно живущего среди Израиля. Пояснение в сноске сохраняет особый статус этой группы, не привнося конфессионального толкования.
- issue: Статус אמה
  choice: рабыня
  alternative: служанка
  rationale: Слово обозначает зависимую женщину, рабыню или служанку. «Рабыня» прямо передаёт социальную уязвимость, существенную для гуманного назначения заповеди, а лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной формой прямого предписания. Синтаксис сохраняет контраст между шестью днями труда и седьмым днём прекращения работы, а также различие между отдыхом животных и восстановлением сил зависимых людей. Архаизмы «пришелец» и «почить» не используются.
