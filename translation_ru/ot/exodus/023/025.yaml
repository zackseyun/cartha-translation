base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: ru
  text: Служите Яхве, вашему Богу, и Он благословит ваш хлеб[a] и вашу воду, и Я удалю болезнь[b] из вашей среды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «хлеб» может здесь обозначать пищу или пропитание вообще.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «недуг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Служите
  rationale: Глагол עבד в контексте завета означает служение Богу, включающее поклонение. «Служите» сохраняет более широкий смысл и передаёт повелительную силу формы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое обозначение Бога в еврейском тексте, не заменяя его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашему Богу
  rationale: При Яхве как референте אֱלֹהִים имеет единственное значение «Бог», а местоименное значение выражает отношения завета.
- source_word: וּבֵרַךְ
  choice: и Он благословит
  rationale: Перфект с ו здесь естественно выражает обещанное следствие служения; подразумеваемый субъект — Яхве.
- source_word: לַחְמְךָ
  choice: ваш хлеб
  rationale: Сохранено конкретное значение «хлеб»; возможный более широкий метонимический смысл «пища, пропитание» отмечен в сноске.
- source_word: מֵימֶיךָ
  choice: вашу воду
  rationale: Хотя еврейское слово имеет форму множественного числа, по-русски собирательное значение естественно передаётся единственным числом «вода».
- source_word: וַהֲסִרֹתִי
  choice: а Я удалю
  rationale: Каузативная форма выражает устранение или удаление. Первое лицо оригинала сохранено, как и заметная смена третьего лица на первое.
- source_word: מַחֲלָה
  choice: болезнь
  rationale: Общее современное слово передаёт диапазон значений «болезнь, недуг», не придавая выражению излишне медицинского оттенка.
- source_word: מִקִּרְבֶּךָ
  choice: из вашей среды
  rationale: 'Формулировка сохраняет коллективный смысл: болезнь удаляется из среды народа, а не только из тела отдельного человека.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Смена грамматического лица говорящего
  choice: «Он благословит… а Я удалю»
  alternative: Унифицировать как «Он благословит… и удалит» либо «Я благословлю… и удалю»
  rationale: Еврейский текст переходит от третьего лица וּבֵרַךְ к первому лицу וַהֲסִרֹתִי. Перевод сохраняет этот напряжённый переход и не сглаживает его.
- issue: Переход от множественного обращения к формам с суффиксом единственного числа
  choice: 'Естественное коллективное обращение: «Служите… ваш хлеб… вашу воду… из вашей среды»'
  alternative: Явно обозначить смену числа пояснительной сноской
  rationale: Еврейский стих начинает с глагола во множественном числе, затем обращается к Израилю как к единому целому посредством суффиксов единственного числа. В русском притяжательное «ваш» при обращении к группе естественно передаёт коллективность без искусственного уточнения.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным звучанием. Сохранены конкретные образы «хлеб» и «вода», коллективный характер обращения и смена лица «Он… Я». Все маркеры сносок стоят непосредственно при соответствующих словах.
