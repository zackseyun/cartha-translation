  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: ru
  text: Сторонись ложного дела[a]. Не убивай невиновного и правого, потому что Я не оправдаю виновного[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от ложного обвинения», «от ложного слова» или «от лжи». Еврейское слово имеет широкое значение и может относиться к ложному свидетельству, обвинению или обманному судебному делу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не признаю правым нечестивого» или «не оправдаю нечестивого». Еврейские слова имеют одновременно судебный и нравственный оттенок: глагол означает «признать правым, оправдать», а существительное — «виновный, неправый, нечестивый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: от ложного дела
  rationale: דָּבָר может означать «слово», «дело», «обстоятельство» или «судебное дело». В юридическом контексте «ложное дело» сохраняет широту выражения, не сводя его только к ложному обвинению или свидетельству.
- source_word: תִּרְחָק
  choice: держись подальше
  rationale: Форма выражает предписание активно сторониться чего-либо; современное русское выражение передаёт как повелительную силу, так и образ удаления.
- source_word: וְנָקִי
  choice: невиновного
  rationale: נָקִי обозначает человека, свободного от вины; в судебном контексте «невиновный» является ясным и точным соответствием.
- source_word: וְצַדִּיק
  choice: правого
  rationale: 'צַדִּיק здесь имеет судебный оттенок: тот, кто прав, чья правота установлена. «Правого» сохраняет этот смысл и связь с глаголом «оправдаю» в следующей части стиха.'
- source_word: אַל תַּהֲרֹג
  choice: не убивай
  rationale: הרג — общий глагол со значением «убивать». Перевод не сужает значение до умышленного убийства и не вводит явно отсутствующее в форме глагола указание на казнь.
- source_word: לֹא אַצְדִּיק
  choice: Я не оправдаю
  rationale: Hiphil от צדק имеет судебное значение «признать правым, оправдать». «Оправдаю» естественно звучит по-русски и сохраняет лексическую связь с צַדִּיק.
- source_word: רָשָׁע
  choice: виновного
  rationale: В судебном контексте רָשָׁע обозначает виновного, неправого участника дела. «Виновного» ясно передаёт противопоставление невиновному и правому, тогда как более широкий нравственный оттенок отмечен в сноске.
theological_decisions:
- issue: Судебный смысл Божьего утверждения
  choice: потому что Я не оправдаю виновного
  alternative: потому что Я не признаю правым нечестивого / не оставлю виновного без наказания
  rationale: Текст связывает запрет осуждать невиновного с Божьим собственным судом. Формулировка «не оправдаю виновного» сохраняет судебный характер глагола и связь корня צדק со словом «правого», не добавляя прямо не выраженной идеи наказания.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Держись подальше» понятно передаёт образ удаления, а «невиновного и правого» и «оправдаю виновного» удерживают судебный контекст и корневую связь צדק.
