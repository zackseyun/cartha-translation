  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: ru
  text: Не бери взятки, потому что взятка ослепляет зрячих[a] и искажает слова правых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проницательных». Еврейское слово сохраняет образ зрения и одновременно подразумевает способность здраво судить.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слова праведных». В судебном контексте выражение может также означать «показания» или «дело тех, кто прав».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: взятка
  rationale: Обозначает подкуп, влияющий на судебное решение; «взятка» — ясный и нормативный современный русский эквивалент.
- source_word: לֹא תִקָּח
  choice: не бери
  rationale: Форма 2-го лица мужского рода единственного числа в правовом контексте выражает запрет; краткая формулировка сохраняет прямоту еврейского текста.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание запрета и естественно передаёт причинную связь в современном русском.
- source_word: יְעַוֵּר
  choice: ослепляет
  rationale: Сохраняет зрительный образ каузативного глагола и его переносный смысл — утрату верного суждения.
- source_word: פִּקְחִים
  choice: зрячих
  rationale: Сохраняет буквальный образ открытых глаз; в контексте подразумеваются люди, способные ясно видеть и здраво судить.
- source_word: וִיסַלֵּף
  choice: искажает
  rationale: Передаёт значение искривления или извращения речи без ненужной стилистической резкости.
- source_word: דִּבְרֵי
  choice: слова
  rationale: Сохраняет широту דבר; в судебном контексте возможны также значения «показания» или «дело».
- source_word: צַדִּיקִים
  choice: правых
  rationale: В данном судебно-правовом контексте слово естественно обозначает тех, на чьей стороне правда или закон, при этом не исключая нравственного оттенка.
theological_decisions:
- issue: Значение צַדִּיקִים в судебном контексте
  choice: правых
  alternative: праведных
  rationale: «Правых» естественно передаёт вероятный юридический смысл — тех, кто прав в тяжбе; сноска сохраняет более широкий нравственный вариант.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой правового наставления. Зрительная метафора оригинала сохранена; юридическая многозначность заключительной фразы отмечена в сноске.
