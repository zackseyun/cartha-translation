id: EXO.23.11
reference: Exodus 23:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/שְּׁבִיעִ֞ת תִּשְׁמְטֶ֣/נָּה וּ/נְטַשְׁתָּ֗/הּ וְ/אָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔/ךָ וְ/יִתְרָ֕/ם תֹּאכַ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה כֵּֽן תַּעֲשֶׂ֥ה לְ/כַרְמְ/ךָ֖ לְ/זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: ru
  text: А в седьмой год оставь её без обработки и не трогай[a], чтобы питались бедные из твоего народа, а то, что они оставят, пусть съедают полевые звери[b]. Так же поступай с твоим виноградником и твоими оливковыми деревьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпусти её и оставь»; еврейские глаголы подчёркивают прекращение обычной обработки и оставление земли невозделанной в седьмой год.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «зверь поля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: А в седьмой год
  rationale: Союз и порядковое числительное образуют временное противопоставление предшествующим шести годам; русское «А в» естественно передаёт переход и контраст.
- source_word: תִּשְׁמְטֶנָּה
  choice: оставь её без обработки
  rationale: Глагол שׁמט здесь означает прекращение обычной обработки земли; женское местоимение отсылает к земле из предыдущего стиха.
- source_word: וּנְטַשְׁתָּהּ
  choice: и не трогай
  rationale: נטשׁ означает оставить, покинуть; в сельскохозяйственном предписании выражение передаёт требование не использовать землю обычным образом, не создавая впечатления, будто её следует навсегда бросить.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: бедные из твоего народа
  rationale: אביון обозначает бедного или нуждающегося; формулировка сохраняет социальную направленность закона и отношение принадлежности к народу адресата.
- source_word: וְיִתְרָם
  choice: то, что они оставят
  rationale: Форма с суффиксом третьего лица множественного числа указывает на остаток после того, как поедят бедные.
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: пусть съедают полевые звери
  rationale: חַיַּת הַשָּׂדֶה буквально означает «зверь поля» и собирательно обозначает диких животных; «пусть» естественно передаёт допускающе-предписывающий оттенок контекста.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Так же поступай
  rationale: Краткая современная формулировка сохраняет директивную силу еврейского выражения.
- source_word: לְכַרְמְךָ
  choice: с твоим виноградником
  rationale: Предлог по-русски естественно передаётся конструкцией после «так же поступай».
- source_word: לְזֵיתֶךָ
  choice: с твоими оливковыми деревьями
  rationale: זית стоит в единственном числе, но может иметь собирательное значение; «оливковые деревья» лексически прозрачно и не требует предполагать оформленную рощу.
