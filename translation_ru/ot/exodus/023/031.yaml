  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: ru
  text: Я установлю твою границу от Красного моря[a] до моря филистимлян и от пустыни до Реки[b], ибо Я отдам жителей земли в ваши руки, и ты изгонишь их от себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «море тростника» (евр. Ям-Суф).'
    reason: lexical_alternative
  - marker: b
    text: То есть Евфрата.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: Я установлю
  rationale: В контексте Божьего обещания форма имеет будущее значение. «Установлю» естественно сочетается с обозначением границы и передаёт смысл глагола שׂים.
- source_word: גְּבֻלְךָ
  choice: твою границу
  rationale: Сохранены единственное число существительного и обращение во втором лице единственного числа.
- source_word: מִיַּם סוּף
  choice: от Красного моря[a]
  rationale: Традиционное и узнаваемое географическое название оставлено в основном тексте; более буквальное соответствие еврейскому названию дано в сноске.
- source_word: יָם פְּלִשְׁתִּים
  choice: Филистимского моря
  rationale: Передаёт данное в тексте этногеографическое название, не заменяя его толкованием «Средиземное море».
- source_word: וּמִמִּדְבָּר
  choice: и от пустыни
  rationale: «Пустыня» — естественный современный русский эквивалент מִדְבָּר в данном географическом контексте.
- source_word: הַנָּהָר
  choice: Реки[b]
  rationale: Сохранено определённое именование «Река»; предполагаемый географический референт уточнён в сноске.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующего обещания; «ибо» сохраняет причинную связь и соответствует достойному литературному регистру.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: Я отдам ... в ваши руки
  rationale: Сохранён конкретный еврейский образ передачи в чью-либо власть, а также множественное число местоименного суффикса.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жителей этой земли
  rationale: Естественно передаёт субстантивированное причастие «живущие в земле»; указательное «этой» по-русски ясно обозначает уже названную землю.
- source_word: וְגֵרַשְׁתָּמוֹ מִפָּנֶיךָ
  choice: и ты изгонишь их от себя
  rationale: «Изгонишь» точно передаёт גרשׁ, а «от себя» естественно выражает идиому מִפָּנֶיךָ. Сохранён переход от множественного «в ваши руки» к единственному «ты».
theological_decisions:
- issue: Географическое обозначение יַם סוּף
  choice: Красное море
  alternative: море Тростника
  rationale: Это лексико-географический, а не конфессиональный выбор. Традиционное название обеспечивает узнаваемость, а буквальная форма сохранена в сноске.
- issue: Смена числа во втором лице
  choice: «твою» — «ваши» — «ты»
  alternative: унифицировать всё обращение в единственном или множественном числе
  rationale: В еврейском тексте действительно происходит переход от единственного числа к множественному и обратно; он сохранён, чтобы не устранять особенность обращения к Израилю как к единому целому и как к народу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным; сохранены географические формулы исходного текста и значимая смена числа местоимений.
