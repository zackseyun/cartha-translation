base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: ru
  text: Если встретишь быка своего врага или его заблудившегося осла[a], непременно верни его ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…его осла, бродящего».'
    reason: 'Лексическая альтернатива: תֹּעֶה может означать «заблудившийся», «бродящий», «сбившийся с пути».'
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном казуистическом законе вводит условие; «если» естественно передаёт структуру нормы, хотя возможно и временное «когда».
- source_word: תִפְגַּע
  choice: встретишь
  rationale: Глагол פגע здесь означает случайно встретить или наткнуться; «встретишь» кратко и естественно в русском законодательном контексте.
- source_word: שׁוֹר
  choice: быка
  rationale: שׁוֹר обозначает животное крупного рогатого скота; «бык» — понятное современное соответствие без добавления отсутствующего в тексте указания на кастрацию рабочего животного.
- source_word: אֹיִבְךָ
  choice: своего врага
  rationale: Прямо сохраняет אֹיֵב «враг» и нравственную остроту повеления помогать противнику.
- source_word: חֲמֹרוֹ
  choice: его осла
  rationale: חֲמוֹר — обычное обозначение осла; местоимение отсылает к врагу-владельцу.
- source_word: תֹּעֶה
  choice: заблудившегося
  rationale: Причастие от תעה описывает животное, которое сбилось с пути или бродит не там, где должно; «заблудившегося» естественно согласуется с обоими животными.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: непременно верни его
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает обязательность действия; «непременно» передаёт эмфазу.
- source_word: לוֹ
  choice: ему
  rationale: Сохраняет прямое местоименное указание на врага, не подменяя его пояснительным «владельцу».
theological_decisions:
- issue: Нравственное требование по отношению к врагу
  choice: Сохранено прямое обозначение «своего врага» и обязанность вернуть ему животное.
  alternative: Смягчить отношение до «ближнего» либо передать как «того, кто тебя ненавидит».
  rationale: В еврейском тексте прямо стоит אֹיֵב, «враг». Перевод не снимает напряжения между враждой и требованием справедливого, милосердного поступка.
translation_notes:
  register: Современный литературный русский язык с лаконичной юридической формой. Инверсия устранена ради естественности; эмфаза еврейской конструкции сохранена словом «непременно». Маркер сноски поставлен после всей однородной группы, поскольку причастие единственного числа в еврейском синтаксисе непосредственно следует за «ослом», но по смыслу ситуация охватывает встреченное животное любого из двух видов.
