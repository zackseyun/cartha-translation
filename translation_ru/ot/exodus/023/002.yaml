  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: ru
  text: Не следуй за большинством, чтобы делать зло, и не давай показаний в судебном споре, следуя за большинством, чтобы исказить правосудие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отвечай по делу, чтобы, следуя за большинством, извратить суд».'
    reason: Слово תַעֲנֶה может означать как дачу свидетельских показаний, так и более общее выступление с ответом; заключительный глагол в судебном контексте может относиться к искажению суда или судебного решения.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: следуй за большинством
  rationale: Сочетание היה с אַחֲרֵי идиоматически выражает следование за кем-либо; רַבִּים здесь обозначает множество людей или большинство. Формулировка передаёт давление большинства без добавления смысла «толпа».
- source_word: לְרָעֹת
  choice: чтобы делать зло
  rationale: Инфинитив с לְ выражает цель или результат, а רָעֹת имеет здесь нравственный смысл. «Делать зло» сохраняет силу запрета.
- source_word: תַעֲנֶה
  choice: давай показаний
  rationale: В судебном контексте ענה означает выступать с ответом или свидетельством. «Давать показания» естественно передаёт юридическую функцию слова.
- source_word: עַל רִיב
  choice: в тяжбе
  rationale: רִיב обозначает спор, судебное дело или тяжбу. «В тяжбе» кратко и ясно сохраняет судебный оттенок.
- source_word: לִנְטֹת
  choice: уклоняясь
  rationale: נטה означает склоняться, отклоняться или сворачивать в сторону. Деепричастная форма естественно связывает действие свидетеля со следованием за большинством, не устраняя метафору отклонения от правого решения.
- source_word: אַחֲרֵי רַבִּים
  choice: вслед за большинством
  rationale: Повтор формулировки сохраняет повтор исходного текста и подчёркивает опасность подчинения мнению большинства.
- source_word: לְהַטֹּת
  choice: чтобы исказить правосудие
  rationale: Каузативная форма נטה в судебном контексте означает склонить или извратить решение. «Правосудие» является подразумеваемым объектом, восстановленным для ясности по ближайшему контексту.
theological_decisions:
- issue: Судебно-этический смысл заключительного оборота
  choice: Явно передать подразумеваемый объект как «правосудие» в выражении «чтобы исказить правосудие»
  alternative: «чтобы отклонить решение»; «чтобы искривить суд»; оставить объект невыраженным
  rationale: Еврейский оборот предельно краток, но упоминание показаний и тяжбы указывает на искажение судебного решения или правосудия. Добавление объекта проясняет синтаксис по контексту и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формы «тяжба» и «правосудие» поддерживают судебный контекст, оставаясь понятными современному читателю. Повтор «большинством» отражает риторическую структуру еврейского текста.
