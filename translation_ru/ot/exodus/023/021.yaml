base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: ru
  text: Берегись его и внимай его голосу. Не восставай против него, потому что он не простит вашего преступления, ибо Моё имя в нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «Моё имя — в нём», «Моё имя — на нём» или, более истолковательно, «он носит Моё имя». Эти слова указывают на его власть, данную Богом, но сам стих точно не определяет природу этого посланника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Будь осторожен перед ним
  rationale: Возвратная форма повеления передаёт настоятельное предостережение. «Перед ним» сохраняет пространственно-реляционный образ выражения מִפָּנָיו, не сводя его лишь к страху перед посланником.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: и слушайся его голоса
  rationale: Оборот שׁמע בְּקוֹל означает не только слышать, но и внимать с послушанием. Русское «слушайся» естественно передаёт этот смысл, а дополнение «его голоса» сохраняет образность оригинала.
- source_word: אַל תַּמֵּר בּוֹ
  choice: Не восставай против него
  rationale: Глагол מרה обозначает неповиновение, противление или мятеж. «Восставай против» сохраняет серьёзность сознательного бунта против данной Богом власти.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: он не простит вашего преступления
  rationale: נשא в сочетании с обозначением греха идиоматически означает простить или снять вину. «Не простит» ясно и естественно передаёт смысл; единственное число «преступления» следует собирательному единственному числу оригинала.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: Моё имя — в нём
  rationale: Краткая формулировка близко передаёт буквальное «Моё имя в его внутренности/среди него», сохраняя богословскую насыщенность и не уточняя сверх текста характер связи посланника с Божьим именем.
theological_decisions:
- issue: Природа посланника и значение слов «Моё имя — в нём»
  choice: Сохранить сильное, но не разъяснённое самим стихом утверждение о пребывании Божьего имени в посланнике.
  alternative: 'Передать более истолковательно: «он носит Моё имя» или определить посланника как сотворённого представителя Бога либо как непосредственное явление Божьего присутствия.'
  rationale: Стих подчёркивает Божью власть, связанную с посланником, однако не даёт точного онтологического определения его природы. Перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Единственное число в повелениях обращено к Израилю как к народу; множественное «вашего» отражает переход оригинала к обращению ко всему сообществу.
