  text: וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְרַ֣ע אֶת אַרְצֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/010.yaml
  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: ru
  text: Шесть лет засевай свою землю и собирай её урожай[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её плоды».'
    reason: Лексема תְּבוּאָה допускает передачу как «урожай» или более буквально и широко как «плоды» земли.
lexical_decisions:
- source_word: וְשֵׁשׁ שָׁנִים
  choice: Шесть лет
  rationale: Начальный союз вместе с обозначением времени вводит период действия; в современном русском естественно передать его без отдельного «и».
- source_word: תִּזְרַע
  choice: засевай
  rationale: Имперфект второго лица единственного числа в законодательном контексте выражает предписание. Русский императив несовершенного вида естественно передаёт повторяющееся действие на протяжении шести лет.
- source_word: אַרְצֶךָ
  choice: свою землю
  rationale: Здесь אֶרֶץ обозначает принадлежащую адресату возделываемую землю, а не землю как мир или почву вообще. Возвратное «свою» естественно при подлежащем второго лица.
- source_word: וְאָסַפְתָּ
  choice: и собирай
  rationale: Глагол אָסַף имеет общее значение собирания. Выбор не сужает смысл до конкретного способа жатвы и сохраняет координацию двух предписанных действий.
- source_word: תְּבוּאָתָהּ
  choice: её урожай
  rationale: תְּבוּאָה означает сельскохозяйственный урожай, плоды или продукцию земли. «Урожай» — естественный и достаточно широкий русский эквивалент; местоимение «её» передаёт суффикс женского рода, отсылающий к земле.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая законодательная формулировка. Императивы несовершенного вида передают длительное и повторяющееся предписание без архаичного оборота «будешь…».
