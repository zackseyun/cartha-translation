review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: названы два земледельческих праздника, первые плоды, окончание года и сбор с поля. Однако «того, что ты посеешь» неоправданно придаёт еврейскому имперфекту исключительно будущее значение; в данном контексте естественнее и ближе «того, что ты сеешь». Формулировка «первых плодов твоих трудов, того…» также синтаксически тяжеловесна и неясно связывает «труды» с посевом.'
  naturalness: «Праздник жатвы» и «праздник сбора урожая» понятны и соответствуют современному литературному регистру. «На исходе года» допустимо, но несколько книжно; «в конце года» проще и точнее передаёт временное значение. Повтор «труды / плоды своих трудов» в исходном варианте звучит менее естественно, чем «труд / плоды своего труда».
  terminology: «Праздник», «жатва», «первые плоды» и «сбор урожая» удачны. Сноска к חַג с вариантом «торжество» приемлема, хотя «празднество» было бы более прямой стилистической альтернативой; исправление не обязательно. Культурная сноска к «сбору урожая» уместна.
  issues:
  - severity: medium
    issue: Необоснованное будущее время в «того, что ты посеешь».
    rationale: אֲשֶׁר תִּזְרַע — имперфект; контекст допускает обобщённое настоящее. Будущее «посеешь» сужает значение без необходимости.
  - severity: medium
    issue: Неясная и тяжеловесная связь в обороте «первых плодов твоих трудов, того, что…».
    rationale: Еврейское «первые плоды твоих трудов, которые ты сеешь в поле» требует более ясного русского оформления; тире делает пояснительную связь прозрачнее.
  - severity: low
    issue: «На исходе года» несколько архаизирует фразу.
    rationale: Это не ошибка, но «в конце года» является нейтральным современным эквивалентом בְּצֵאת הַשָּׁנָה, а буквальный образ сохранён в сноске.
  revised_text: и праздник жатвы[a] — первых плодов твоего труда, того, что ты сеешь в поле; и праздник сбора урожая[b] в конце года[c], когда ты собираешь с поля плоды своего труда.
