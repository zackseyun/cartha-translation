  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: ru
  text: и праздник жатвы[a] — первых плодов твоего труда, того, что ты сеешь в поле; и праздник сбора урожая[b] в конце года[c], когда ты собираешь с поля плоды своего труда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חַג в обоих случаях можно также перевести как «торжество».
    reason: lexical_alternative
  - marker: b
    text: Праздник сбора урожая отмечал завершение сбора плодов с поля.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «при выходе года».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: праздник
  rationale: Передаёт установленное торжественное празднование и звучит естественно в современном русском языке; относится к обоим употреблениям в стихе.
- source_word: הַקָּצִיר
  choice: жатва
  rationale: Точно передаёт уборку созревшего хлеба и естественно образует название земледельческого праздника.
- source_word: בִּכּוּרֵי
  choice: первые плоды
  rationale: Сохраняет смысл начальной части урожая, приносимой Богу, и остаётся понятным современному читателю.
- source_word: מַעֲשֶׂיךָ
  choice: труды / плоды своих трудов
  rationale: Буквально слово означает дела или труды; в земледельческом контексте во втором употреблении речь идёт о результатах труда, которые собирают с поля.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: того, что ты посеешь в поле
  rationale: Сохраняет относительную конструкцию, прямое обращение во втором лице и значение последующего сева.
- source_word: הָאָסִף
  choice: сбор урожая
  rationale: Передаёт собирание полевых плодов в конце сельскохозяйственного цикла и образует естественное русское название праздника.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: на исходе года
  rationale: Близко сохраняет образ буквального «выхода года» и при этом ясно обозначает его завершение.
- source_word: בְּאָסְפְּךָ
  choice: когда соберёшь
  rationale: Естественно передаёт временное значение инфинитивной конструкции и сохраняет обращение во втором лице.
- source_word: מִן הַשָּׂדֶה
  choice: с поля
  rationale: Краткий и естественный русский эквивалент пространственного значения исходной точки.
