lexical_decisions:
- source_word: דָל
  choice: бедняку
  rationale: דָל обозначает бедного, малоимущего или социально слабого человека. Дательный падеж естественно обусловлен русским выражением «оказывать предпочтение» и сохраняет конкретность формы единственного числа.
- source_word: תֶהְדַּר
  choice: не оказывай предпочтения
  rationale: Глагол הדר может буквально передавать идею почтения, однако в данном судебном контексте речь идёт о пристрастном благоволении одной из сторон. Выражение «оказывать предпочтение» ясно передаёт запрет судебной предвзятости.
- source_word: בְּרִיבוֹ
  choice: в его тяжбе
  rationale: רִיב означает спор, тяжбу или судебное дело; притяжательный суффикс 3-го лица мужского рода передан словом «его». «Тяжба» сохраняет юридическую окраску, не сужая значение до формально начатого судебного процесса.
- source_word: וְ
  choice: И
  rationale: Союз связывает этот запрет с окружающими правовыми предписаниями без необходимости добавлять явно не выраженное противопоставление.
- source_word: לֹא
  choice: не оказывай
  rationale: Отрицание с имперфектом выражает запрет; современная русская форма повелительного наклонения естественно передаёт нормативную силу предписания.
theological_decisions:
- issue: Забота о бедном и беспристрастность суда
  choice: Стих запрещает отдавать бедному предпочтение при разбирательстве его дела.
  alternative: Стих предписывает вообще не оказывать бедному почтения.
  rationale: 'Ближайший правовой контекст и выражение «в его тяжбе» указывают на судебную беспристрастность. Перевод сохраняет напряжение текста: бедность не должна становиться основанием для пристрастного решения, но стих сам по себе не отрицает заботы о бедных.'
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой правового предписания. Слово «бедняк» понятно широкому читателю, а «тяжба» сохраняет судебный оттенок контекста.
