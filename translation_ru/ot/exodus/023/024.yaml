  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: ru
  text: Не поклоняйся их богам, не служи им и не поступай так, как поступают они; напротив, непременно разрушь их и непременно сокруши их священные столбы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их культовые камни»; буквально речь идёт об установленных вертикально камнях или столбах, связанных с поклонением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: поклоняйся
  rationale: Глагол обозначает преклонение или простирание в знак почтения. «Поклоняйся» естественно передаёт конкретное действие и в данном контексте сохраняет его религиозный смысл.
- source_word: לֵאלֹהֵיהֶם
  choice: их богам
  rationale: Предлог ל после глагола поклонения естественно передаётся русским дательным падежом; строчная буква указывает на божества народов.
- source_word: תָעָבְדֵם
  choice: служи им
  rationale: עבד может обозначать культовое служение. «Служи им» сохраняет отличие этого глагола от предшествующего «поклоняйся» и не сводит оба действия к одному понятию.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: не поступай так, как поступают они
  rationale: Это естественная современная передача буквального «не делай по их делам», относящегося в контексте к подражанию их культовым обычаям.
- source_word: כִּי
  choice: напротив
  rationale: Здесь частица вводит резкое противопоставление запрещённым действиям; «напротив» ясно выражает этот переход.
- source_word: הָרֵס תְּהָרְסֵם
  choice: непременно разрушь их
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает повеление. Повтор местоимения «их» сохраняет формальную неоднозначность объекта разрушения.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: и непременно сокруши
  rationale: Повторная усилительная конструкция передана словом «непременно»; «сокруши» соответствует насильственному разрушению каменных культовых памятников.
- source_word: מַצֵּבֹתֵיהֶם
  choice: их священные столбы
  rationale: מַצֵּבָה — установленный вертикально камень или столб, нередко культового назначения. Прилагательное «священные» делает подразумеваемую здесь культовую функцию понятной современному читателю; более буквальные варианты приведены в сноске.
theological_decisions:
- issue: Характер запрещённых действий по отношению к чужим богам
  choice: 'Сохранены два разных действия: «поклоняться» и «служить».'
  alternative: Объединить оба глагола общей лексикой поклонения.
  rationale: 'В еврейском тексте употреблены два глагола: один обозначает акт почтительного преклонения, другой — служение, в том числе культовое. Их различение сохраняет полноту запрета.'
- issue: Объект повеления «разрушь их»
  choice: Местоименный объект сохранён без явного уточнения; ближайшим грамматическим предшественником остаются «боги», тогда как продолжение указывает на материальные культовые предметы.
  alternative: Прямо написать «разрушь их святилища/идолов», устранив неоднозначность.
  rationale: Еврейский суффикс допускает сильную полемическую отсылку к богам либо метонимическую отсылку к связанным с ними изображениям и культовым объектам. Уточнение в основном тексте неоправданно разрешило бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясной повелительной формой единственного числа. Повтор «непременно» намеренно передаёт две отдельные усилительные конструкции еврейского текста. Сноска поставлена при словах «священные столбы», к которым она относится.
