  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: ru
  text: Соблюдай праздник Пресных хлебов. Семь дней ешь пресный хлеб, как Я повелел тебе, в назначенное время месяца авива, потому что в этом месяце ты вышел из Египта. Никто не должен являться предо Мной с пустыми руками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И они не должны являться предо Мной с пустыми руками». В еврейском тексте здесь обращение во втором лице единственного числа сменяется глаголом в третьем лице множественного числа.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: праздник Пресных хлебов
  rationale: חַג обозначает праздник, нередко паломнический; מַצּוֹת — пресный хлеб. Традиционное русское наименование ясно и сохраняет культовый характер установления.
- source_word: תִּשְׁמֹר
  choice: соблюдай
  rationale: В правовом и культовом контексте שׁמר означает соблюдать установленное предписание; императивная форма естественно передаёт древнееврейский имперфект с предписывающей силой.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Семь дней ешь пресный хлеб
  rationale: Сохраняются длительность и обращение во втором лице единственного числа; собирательное «пресный хлеб» естественно по-русски.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: как Я повелел тебе
  rationale: Передаёт сравнительное значение כַּאֲשֶׁר и прямую речь Бога без добавлений.
- source_word: לְמוֹעֵד חֹדֶשׁ הָאָבִיב
  choice: в назначенное время месяца авива
  rationale: מוֹעֵד здесь указывает на установленный срок, а אָבִיב сохранено как древнееврейское календарное обозначение; строчная буква соответствует восприятию названия месяца в современном русском тексте.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: потому что в этом месяце ты вышел из Египта
  rationale: Местоимение בוֹ явно соотнесено с только что названным месяцем, поэтому референт выражен для ясности; יָצָאתָ передано прямым «ты вышел».
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: И пусть никто не является предо Мной с пустыми руками
  rationale: Нифаль ראה в этой формуле означает «являться перед кем-либо»; неопределённое «никто» естественно передаёт обобщённый смысл формы третьего лица множественного числа, а רֵיקָם — отсутствие принесённого дара.
theological_decisions:
- issue: Божественное выражение פָנַי, буквально «Моё лицо»
  choice: предо Мной
  alternative: пред лицом Моим
  rationale: Это устойчивое древнееврейское выражение означает явиться в Божье присутствие. «Предо Мной» сохраняет личное божественное обращение и звучит достойно, не превращая идиому в неестественный буквализм.
- issue: Смена грамматического лица в заключительной части
  choice: пусть никто не является
  alternative: пусть они не являются
  rationale: После обращения к Израилю во втором лице единственного числа еврейский текст использует глагол третьего лица множественного числа. Обобщённое «никто» естественно выражает запрет для каждого, но грамматическая смена отмечена в сноске, чтобы не скрывать форму источника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формы «повелел» и «предо Мной» сохраняют достоинство речи, оставаясь понятными. Заглавные буквы в местоимениях прямой божественной речи применены по принятой русской библейской норме.
