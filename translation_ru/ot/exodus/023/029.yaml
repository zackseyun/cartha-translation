base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: ru
  text: Я не изгоню их от тебя за один год[a], чтобы земля не опустела и дикие звери не размножились тебе во вред[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за один-единственный год». Еврейский объектный суффикс имеет форму единственного числа, но, вероятно, собирательно указывает на народы или жителей земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и звери поля не умножились против тебя».'
    reason: literal_rendering
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: Я не изгоню их
  rationale: Глагол גרש означает «изгонять, прогонять». Объектный суффикс формально стоит в единственном числе, но в контексте собирательно обозначает народы или жителей земли; русское множественное число ясно передаёт этот смысл.
- source_word: מִפָּנֶיךָ
  choice: от тебя
  rationale: Еврейское выражение буквально означает «от твоего лица / от тебя». Краткое «от тебя» естественно по-русски и сохраняет пространственный смысл удаления противников.
- source_word: בְּשָׁנָה אֶחָת
  choice: за один год
  rationale: В данном контексте речь идёт не о событии, которое случится когда-либо в течение года, а о завершении изгнания в пределах одного года; «за один год» передаёт это естественно и точно.
- source_word: פֶּן
  choice: чтобы ... не
  rationale: Частица вводит нежелательное возможное последствие. Русская конструкция «чтобы не» ясна и сохраняет предупредительно-целевой оттенок.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: земля не опустела
  rationale: שְׁמָמָה обозначает запустение или безлюдность. Глагольное «опустела» естественно передаёт становление земли пустынной и заброшенной.
- source_word: וְרַבָּה
  choice: не размножились
  rationale: רבה значит «становиться многочисленным, умножаться». Применительно к животным «размножились» звучит естественно; отрицание зависит от конструкции с פֶּן.
- source_word: עָלֶיךָ
  choice: тебе во вред
  rationale: Буквально «на тебя / против тебя». В контексте чрезмерного увеличения числа зверей выражение указывает на угрозу Израилю; «тебе во вред» ясно передаёт неблагоприятный смысл, не уточняя вид опасности.
- source_word: חַיַּת הַשָּׂדֶה
  choice: полевые звери
  rationale: Устойчивое библейское выражение обозначает диких наземных животных. «Полевые звери» сохраняет образ исходного текста и остаётся понятным в современном литературном русском.
