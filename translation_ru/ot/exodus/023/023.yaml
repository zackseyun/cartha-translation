  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: ru
  text: Ведь Мой ангел[a] пойдёт перед тобой и приведёт тебя к аморреям, хеттам, ферезеям, хананеям, евеям и иевусеям, и Я истреблю их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой посланник». Еврейское מַלְאָךְ может обозначать как человеческого посланника, так и небесного вестника; здесь контекст Божьего водительства позволяет перевести «ангел».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-еврейски: «истреблю его». Суффикс единственного числа имеет собирательное значение и относится ко всем перечисленным народам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для предшествующего повеления и обещания. «Ведь» естественно передаёт пояснительно-причинную связь, не делая её чрезмерно жёсткой.
- source_word: יֵלֵךְ
  choice: пойдёт
  rationale: Имперфект имеет здесь будущее значение в контексте Божьего обещания.
- source_word: מַלְאָכִי
  choice: Мой ангел
  rationale: מַלְאָךְ может обозначать посланника вообще или небесного вестника. В контексте сверхъестественного Божьего водительства уместно «ангел», однако возможное значение «посланник» сохранено в сноске.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Точно и естественно передаёт образ того, кто идёт впереди, ведя за собой.
- source_word: וֶהֱבִיאֲךָ
  choice: и приведёт тебя
  rationale: Каузативная форма глагола בוא означает «привести, доставить». В данном контексте «приведёт» естественно выражает движение к названным народам.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: к аморреям, хеттам, ферезеям, хананеям, евеям и иевусеям
  rationale: Еврейские названия народов стоят в форме единственного числа с собирательным значением; в русском языке естественно употреблены традиционные названия во множественном числе.
- source_word: וְהִכְחַדְתִּיו
  choice: и Я истреблю их
  rationale: Порода хифиль от כחד выражает устранение или уничтожение. «Истреблю» передаёт силу глагола; местоимение множественного числа естественно соотносится со всем перечнем народов, хотя еврейский суффикс формально единственного числа.
theological_decisions:
- issue: Кем является מַלְאָכִי
  choice: «Мой ангел» без дальнейшего отождествления
  alternative: «Мой посланник»; теофаническое явление Господа; предвоплощённый Сын
  rationale: Сам стих называет эту фигуру лишь Божьим ангелом/посланником. Перевод не должен разрешать богословские толкования, выходящие за пределы текста.
- issue: Число дополнения в וְהִכְחַדְתִּיו
  choice: 'Собирательное значение передано русским множественным числом: «их»'
  alternative: 'Формально единственное число: «его» или «это» как обозначение совокупного врага'
  rationale: Еврейский суффикс единственного числа относится к перечисленным народам как к единому целому. По-русски множественное «их» ясно и естественно передаёт смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены пояснительная функция начального כִּי, неопределённость слова מַלְאָךְ и собирательность названий народов; избегнуты конфессиональные уточнения.
