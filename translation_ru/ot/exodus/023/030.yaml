base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: ru
  text: Мало-помалу Я буду изгонять их от тебя[a], пока ты не станешь многочисленным и не овладеешь землёй[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его»; форма единственного числа, вероятно, собирательно обозначает жителей или народы этой земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «унаследуешь землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: Мало-помалу
  rationale: Повтор מְעַט выражает постепенность действия. «Мало-помалу» естественно передаёт и повторную форму, и смысл постепенного вытеснения.
- source_word: אֲגָרְשֶׁנּוּ
  choice: Я буду изгонять их
  rationale: Глагол גרשׁ означает «изгонять, выдворять». Местоименный суффикс имеет форму 3-го лица мужского рода единственного числа, но собирательно указывает на жителей или народы земли; русское множественное число делает подразумеваемый смысл ясным, а примечание сохраняет грамматическую особенность оригинала.
- source_word: מִפָּנֶיךָ
  choice: от тебя
  rationale: Буквально оборот означает «от твоего лица», то есть прочь из твоего присутствия. «От тебя» естественно передаёт этот пространственный смысл по-русски.
- source_word: עַד אֲשֶׁר
  choice: пока не
  rationale: Сочетание указывает на предел, до которого будет продолжаться постепенное изгнание; русская конструкция «пока не» передаёт это естественно.
- source_word: תִּפְרֶה
  choice: умножишься числом
  rationale: Глагол פרה буквально связан с плодородием и размножением, а здесь означает рост численности Израиля до возможности заселить землю. Выражение «умножишься числом» ясно передаёт контекстуальный смысл и сохраняет библейскую образность лучше, чем нейтральное «станешь многочисленным».
- source_word: וְנָחַלְתָּ
  choice: и не овладеешь
  rationale: Глагол נחל может означать получение в наследие и вступление во владение. В контексте постепенного заселения земли «овладеешь» передаёт конкретный результат, тогда как значение наследования отмечено в сноске.
- source_word: אֶת הָאָרֶץ
  choice: этой землёй
  rationale: Артикль указывает на уже известную из контекста обещанную землю. Указательное «этой» естественно выражает такую определённость в русском контексте.
theological_decisions:
- issue: Собирательное единственное число у объекта изгнания
  choice: Передать по смыслу множественным числом «их», снабдив текст примечанием о форме оригинала.
  alternative: 'Формально передать единственное число: «его».'
  rationale: Еврейский суффикс стоит в единственном числе, однако контекст говорит о жителях или народах земли как о собирательном целом. Русское «его» могло бы ошибочно создать впечатление об одном человеке; сноска сохраняет прозрачность оригинала без устранения его грамматической особенности.
- issue: Значение נחל применительно к земле
  choice: Передать как «овладеешь этой землёй».
  alternative: «Унаследуешь эту землю».
  rationale: Глагол объединяет представления о получении удела и вступлении во владение. Контекст подчёркивает фактическое заселение земли, поэтому основной текст использует «овладеешь», а возможное наследственное значение сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Мало-помалу» сохраняет ритм и повтор оригинала; «умножишься числом» понятно современному читателю и передаёт идею роста народа. Заглавное «Я» обозначает речь Бога в соответствии с русской библейской издательской традицией.
