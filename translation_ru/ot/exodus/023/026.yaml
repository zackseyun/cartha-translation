base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: ru
  text: На твоей земле не будет ни той, что теряет плод[a], ни бесплодной; Я доведу число твоих дней до полноты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни лишившейся детей». Еврейское слово может шире обозначать потерю потомства; рядом со словом «бесплодной» оно, вероятнее всего, говорит о выкидыше или потере ребёнка при родах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я наполню число твоих дней», то есть дам прожить весь отведённый срок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: та, что теряет плод
  rationale: Причастная форма от שׁכל обозначает утрату потомства. В сочетании с «бесплодной» и в контексте благословения плодородия выражение, вероятнее всего, указывает на выкидыш или потерю ребёнка при родах; выбранная формулировка сохраняет более широкий оттенок исходного слова и не звучит по-русски неестественно.
- source_word: עֲקָרָה
  choice: бесплодная
  rationale: Точный и общеупотребительный русский эквивалент для женщины или самки, неспособной производить потомство; женский род соответствует форме еврейского слова.
- source_word: בְּאַרְצֶךָ
  choice: в твоей земле
  rationale: Здесь אֶרֶץ означает землю, данную Израилю для обитания; «в твоей земле» сохраняет заветный контекст и обращение во втором лице единственного числа.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: число твоих дней
  rationale: Прямо передаёт еврейскую идиому, обозначающую отведённую человеку продолжительность жизни.
- source_word: אֲמַלֵּא
  choice: доведу … до полноты
  rationale: Глагол מלא значит «наполнять, делать полным». Русская формулировка сохраняет образ полноты и естественно выражает обещание дать прожить весь отведённый срок.
- source_word: לֹא תִהְיֶה
  choice: не будет
  rationale: Естественно передаёт еврейскую конструкцию существования в обещании о будущем.
theological_decisions:
- issue: Объём обещания о плодородии и долголетии
  choice: Передать обещание как заветное благословение Израилю в его земле, не превращая его в явно универсальную гарантию для каждого верующего во все времена.
  alternative: Истолковать стих как безусловное вневременное обещание, что у каждого верующего не будет выкидышей, бесплодия или преждевременной смерти.
  rationale: Ближайший контекст говорит о заветных благословениях Израилю при жизни в земле. Перевод следует формулировке исходного текста и не расширяет область её применения.
- issue: Кого обозначают формы женского рода
  choice: Сохранить женский род и не добавлять прямо слово «женщина», оставляя возможным отнесение обещания как к людям, так и, в контексте общего плодородия земли, к животным.
  alternative: 'Уточнить: «ни у одной женщины не будет выкидыша».'
  rationale: Еврейский текст употребляет формы женского рода, но не называет существительное; добавление «женщина» необоснованно сузило бы референцию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «ни той, что теряет плод, ни бесплодной» избегает неестественного субстантивированного причастия «выкидывающей» и не добавляет отсутствующее в оригинале слово «женщина». Обращение к Богу передано с прописной буквы в местоимении «Я» согласно распространённой русской библейской издательской традиции.
