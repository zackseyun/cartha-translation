- source_word: שָׁלֹשׁ רְגָלִים
  choice: три раза
  rationale: Буквально сочетание связано со словом «ноги», но здесь это еврейская идиома, обозначающая три ежегодных случая праздничного паломничества. «Три раза» естественно передаёт частотное значение, а буквальный образ поясняется в сноске.
- source_word: תָּחֹג
  choice: совершай праздник
  rationale: Глагол חגג означает отмечать или справлять праздник, в данном контексте — предписанный религиозный праздник. Формулировка сохраняет празднично-культовый смысл и повелительный характер закона.
- source_word: לִי
  choice: в Мою честь
  rationale: Предлог указывает, что празднование обращено к Богу и совершается ради Него. «В Мою честь» естественно по-русски передаёт эту направленность, не добавляя конфессиональной конкретизации.
- source_word: בַּשָּׁנָה
  choice: в году
  rationale: Близко к буквальному «в [течение] года» и естественно сочетается по-русски с выражением «три раза».
