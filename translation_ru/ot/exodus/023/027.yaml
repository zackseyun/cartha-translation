base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: ru
  text: Я пошлю перед тобой Мой ужас[a], приведу в смятение весь народ, в чью среду ты войдёшь[b], и заставлю всех твоих врагов повернуться к тебе спиной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой страх» или «Мой трепет».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение допускает также перевод: «к которому ты придёшь»; буквально: «народ, среди которого ты придёшь».'
    reason: source_idiom
  - marker: c
    text: 'Еврейская идиома буквально говорит о том, что Бог «даст» врагов Израилю «спиной (или затылком)»; смысл: они повернутся и побегут.'
    reason: source_idiom
lexical_decisions:
- source_word: אֵימָתִי
  choice: Мой ужас
  rationale: Существительное אֵימָה обозначает ужас, трепет или страх, вызывающий оцепенение и панику. «Мой ужас» сохраняет притяжательное местоимение и силу еврейского выражения.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: Я пошлю перед тобой
  rationale: Сочетание שׁלח с לִפְנֵי говорит о том, что нечто посылается впереди человека. «Перед тобой» естественно передаёт как пространственный, так и предваряющий смысл.
- source_word: וְהַמֹּתִי
  choice: приведу в смятение
  rationale: Каузативная форма от המם означает повергнуть в смятение, вызвать панику или замешательство, особенно в боевой обстановке. Выбранный вариант сохраняет причинное действие, не добавляя прямо не выраженного значения полного разгрома.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Единственное число עָם имеет собирательное значение и указывает на население, с которым встретится Израиль. Формально и естественно передано единственным числом.
- source_word: אֲשֶׁר תָּבֹא בָהֶם
  choice: в чью среду ты войдёшь
  rationale: Предлог ב с местоименным суффиксом естественно выражает вхождение внутрь или в среду людей. Такой перевод не превращает выражение в более узкое «против которого выступишь».
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: обращу к тебе спиной всех твоих врагов
  rationale: Буквальный образ — дать врагов по отношению к Израилю «затылком/спиной»; это идиома бегства и отступления. Перевод сохраняет телесный образ и остаётся понятным по-русски.
theological_decisions:
- issue: Прямое Божье действие, вызывающее страх и смятение в военном контексте
  choice: 'Сохранены формы первого лица с Богом как непосредственным деятелем: «Я пошлю», «приведу», «обращу».'
  alternative: Смягчить причинность, представив происходящее как косвенное следствие Божьей помощи.
  rationale: В еврейском тексте Бог прямо выступает подлежащим глаголов первого лица. Перевод не ослабляет и не усиливает утверждение текста о Его непосредственном действии.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; сохранены прямое Божье действие, образ обращённой спины и неоднозначность предлога ב. Архаизмы и конфессионально окрашенные формулировки не используются.
