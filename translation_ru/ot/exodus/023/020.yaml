base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: ru
  text: Вот, Я посылаю перед тобой ангела[a], чтобы охранять тебя в пути и привести тебя в то место, которое Я приготовил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланника». Еврейское מַלְאָךְ может означать как человеческого посланника, так и ангельского вестника; здесь контекст лучше всего соответствует значению «ангел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательную и привлекающую внимание функцию частицы в торжественной прямой речи, оставаясь естественным для современного русского языка.
- source_word: אָנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение выражает подлежащее и некоторое смысловое ударение; написание с прописной буквы соответствует русской библейской традиции при речи Бога, не усиливая значение до «Я Сам».
- source_word: שֹׁלֵחַ
  choice: посылаю
  rationale: Причастная форма с אָנֹכִי обозначает совершаемое или предстоящее действие; настоящее время «посылаю» естественно передаёт эту аспектуальную окраску.
- source_word: מַלְאָךְ
  choice: ангела
  rationale: Слово может обозначать посланника вообще или ангельского вестника; защитная и направляющая роль Божьего посланца в данном контексте делает «ангела» наиболее вероятным значением, а лексическая неоднозначность отмечена в сноске.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Буквально и естественно передаёт пространственную идиому со значением движения впереди адресата.
- source_word: לִשְׁמָרְךָ
  choice: чтобы хранить тебя
  rationale: Глагол שׁמר здесь выражает защиту в дороге; «хранить» сохраняет широкий смысл заботливой охраны и уместен в современной литературной речи.
- source_word: בַּדָּרֶךְ
  choice: в пути
  rationale: Передаёт дорогу как путешествие и звучит естественнее по-русски, чем буквальное «на пути» в данном сочетании.
- source_word: וְלַהֲבִיאֲךָ
  choice: и привести тебя
  rationale: Каузативная форма בוא означает «сделать так, чтобы пришёл», то есть «привести»; этот выбор точен и естественен в контексте сопровождения к месту назначения.
- source_word: הַמָּקוֹם
  choice: то место
  rationale: Указательное «то» естественно соотносит определённое место с последующим придаточным и передаёт определённость еврейского существительного.
- source_word: אֲשֶׁר הֲכִנֹתִי
  choice: которое Я приготовил
  rationale: Форма породы hifil от כון может означать «приготовить, устроить, утвердить»; применительно к месту назначения «приготовил» сохраняет наиболее прямой и контекстуально вероятный смысл.
theological_decisions:
- issue: Личность מַלְאָךְ в данном контексте
  choice: Передать как «ангел», не уточняя, является ли он сотворённым ангельским существом или особым явлением Господа.
  alternative: «посланник»; либо уточняющее толкование «Ангел Господень» как уникальный божественный Посланник.
  rationale: Сам стих называет эту фигуру только מַלְאָךְ. Последующий контекст вызывает богословские вопросы о её статусе, поэтому перевод не должен преждевременно разрешать сохраняющуюся в тексте напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном божественной речи. Синтаксис простой и ясный; «Вот» сохраняет торжественный призыв к вниманию, а «хранить тебя в пути» поддерживает библейскую выразительность без архаизации.
