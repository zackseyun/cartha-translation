  terminology: «Яхве» последовательно передаёт יהוה. «Козлёнок» — естественное и точное соответствие גְּדִי в данном контексте. «В молоке его матери» буквально и ясно передаёт בַּחֲלֵב אִמּוֹ. Сноска сохраняет допустимый более общий вариант, не навязывая толкование.
