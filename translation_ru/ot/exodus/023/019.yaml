  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: ru
  text: Первую часть первых плодов твоей земли приноси в дом Яхве, твоего Бога.[a] Не вари козлёнка в молоке его матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первые плоды твоей земли».'
    reason: Лексическое сочетание רֵאשִׁית בִּכּוּרֵי может передаваться более кратко общим выражением «первые плоды»; основной текст сохраняет указание на первую часть этих плодов.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: первое из первинок
  rationale: Сохраняет сочетание «первое/начало» и культового термина «первинки», не подменяя его возможным толкованием «лучшее».
- source_word: אַדְמָתְךָ
  choice: своей земли
  rationale: В контексте земледелия обозначает возделываемую землю и её урожай; «земля» звучит естественнее русского «почва» в данной заповеди.
- source_word: תָּבִיא
  choice: приноси
  rationale: Настоящее время повелительного значения естественно передаёт повторяющееся предписание закона.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: в дом Яхве, твоего Бога
  rationale: «Дом» сохраняет широкое обозначение святилища и не вводит более позднее представление о храмовом здании; имя יהוה передано как «Яхве».
- source_word: לֹא תְבַשֵּׁל
  choice: не вари
  rationale: Глагол בשל здесь конкретно обозначает варку, поэтому более широкое «не готовь» не требуется.
- source_word: גְּדִי
  choice: козлёнка
  rationale: Обычное значение слова — детёныш козы; русское «козлёнок» ясно и естественно.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: в молоке его матери
  rationale: Прямо передаёт образ и синтаксическое отношение исходного текста без дополнительных объяснений.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Смысл запрета варить козлёнка в молоке матери
  choice: Сохранить буквальную формулировку без объяснения причины запрета
  alternative: Связать запрет в переводе с языческим обрядом, жестокостью или правилами разделения пищи
  rationale: Сам стих не объясняет основания запрета, поэтому перевод не должен закреплять одно из последующих толкований.
translation_notes:
  register: Современный литературный русский с лаконичной, достойной формой законодательного предписания. Слово «первинки» сохранено как понятный библейско-культовый термин; более привычный вариант дан в сноске.
