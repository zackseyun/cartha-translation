  source_fidelity: 'Смысл передан верно: רֵאשִׁית בִּכּוּרֵי обозначает первую часть/начатки первых плодов; заповедь о принесении в дом Яхве и запрет варить козлёнка в молоке его матери сохранены без истолковывающих добавлений. Однако формула «Первое из первинок» в русском звучит неестественно и может восприниматься как просто «первый предмет среди первинок».'
