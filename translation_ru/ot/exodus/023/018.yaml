base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: ru
  text: Не приноси в жертву кровь Моей жертвы вместе с чем-либо квасным[a], и жир Моего праздника[b] не должен оставаться до утра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на квасном»; возможно также: «с закваской». В контексте речь идёт о том, что жертву нельзя приносить в связи с чем-либо квасным.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «священного торжества». Еврейское слово обозначает религиозный праздник, нередко связанный с паломничеством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְבַּח
  choice: не приноси в жертву
  rationale: Сочетание отрицания с формой 2-го лица выражает запрет. Русское «не приноси в жертву» естественно передаёт культовое значение глагола זבח.
- source_word: עַל חָמֵץ
  choice: вместе с чем-либо квасным
  rationale: Предлог עַל буквально означает «на, над», но здесь указывает на запрещённое сочетание жертвоприношения с квасным. Формулировка передаёт эту связь, не сводя חָמֵץ только к закваске как ингредиенту.
- source_word: דַּם זִבְחִי
  choice: кровь Моей жертвы
  rationale: Сохранены явное упоминание крови, конструкция принадлежности и суффикс первого лица; пояснительное «жертвы Мне» в основной текст не внесено.
- source_word: יָלִין
  choice: не остаётся
  rationale: Глагол לין означает оставаться или проводить ночь. В сочетании с «до утра» русское «не остаётся» точно и без избыточного повторения передаёт временной запрет.
- source_word: חֵלֶב
  choice: жир
  rationale: Перевод сохраняет конкретное культовое значение слова; более пояснительное «жирные части» возможно по контексту, но уже сужает формулировку.
- source_word: חַגִּי
  choice: Моего праздника
  rationale: חַג обозначает священный праздник, часто паломнический. «Праздник» — естественный современный эквивалент, сохраняющий суффикс первого лица.
- source_word: עַד בֹּקֶר
  choice: до утра
  rationale: Обычное и точное русское соответствие временной формуле.
theological_decisions:
- issue: К кому относятся суффиксы первого лица в выражениях «Моей жертвы» и «Моего праздника»
  choice: Сохранить прямую божественную речь и формы «Моей», «Моего».
  alternative: 'Передать пояснительно: «жертвы Мне» и «праздника Господу».'
  rationale: Суффиксы первого лица прямо присутствуют в еврейском тексте. Пояснительная передача могла бы устранить присущую исходной формулировке сжатость и добавить толкование.
- issue: Что именно названо «жиром Моего праздника»
  choice: Сохранить сжатое выражение без добавления слова «жертва».
  alternative: «Жир праздничной жертвы Мне» или «жир жертвы Моего праздника».
  rationale: Контекст, вероятно, подразумевает жертвенный жир, однако существительное «жертва» во второй части стиха прямо не повторено; основной текст не должен молча устранять эту сжатость.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и богослужебного контекста. Императив делает запрет естественным для русского читателя; синтаксическая сжатость выражений «кровь Моей жертвы» и «жир Моего праздника» намеренно сохранена. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской издательской традицией.
