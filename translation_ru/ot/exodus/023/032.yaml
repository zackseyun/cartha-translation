lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Обычное отрицание; вместе с конструкцией «ни… ни…» ясно выражает запрет в современном русском языке.
- source_word: תִכְרֹת
  choice: заключай
  rationale: Глагол כרת в сочетании с בְּרִית образует устойчивое древнееврейское выражение со значением «заключать завет»; буквальное «рубить» по-русски здесь неестественно.
- source_word: לָהֶם
  choice: с ними
  rationale: При заключении завета предлог ל обозначает сторону, с которой вступают в завет; по-русски это естественно передаётся предлогом «с».
- source_word: וְלֵאלֹהֵיהֶם
  choice: ни с их богами
  rationale: Буквально союз ו имеет значение «и», однако в сфере действия отрицательного запрета русская парная конструкция «ни… ни…» точно и естественно передаёт запрет заключать завет с обеими названными сторонами.
- source_word: בְּרִית
  choice: завета
  rationale: «Завет» сохраняет религиозный и союзный смысл בְּרִית, особенно важный при упоминании чужих богов; родительный падеж естественен после отрицания.
theological_decisions:
- issue: Передача идиомы כרת ברית
  choice: заключай завета
  alternative: 'буквально: «руби завет»'
  rationale: Выбрано нормативное русское выражение, сохраняющее юридическую и религиозную силу запрета без неясной буквальности.
- issue: Значение ו перед «их богами» в отрицательной конструкции
  choice: ни с ними, ни с их богами
  alternative: с ними и с их богами
  rationale: «Ни… ни…» естественно показывает, что запрет отдельно распространяется и на народы, и на их богов, не меняя объёма древнееврейского высказывания.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного библейского термина «завет». Единственное число повелительной формы соответствует обращению к Израилю как к единому народу; конструкция «ни… ни…» делает двойной запрет ясным и естественным.
