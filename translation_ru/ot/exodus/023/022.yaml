source:
  edition: WLC
  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: ru
  text: Но если ты будешь неуклонно слушаться его голоса[a] и исполнять всё, что Я говорю[b], то Я буду врагом твоих врагов и противником твоих противников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если ты действительно будешь слушать его голос». В еврейском тексте глагольная конструкция придаёт призыву особую настойчивость; слушание здесь подразумевает послушание.'
    reason: lexical_alternative
  - marker: b
    text: Текст переходит от слов «его голоса» к словам «Я говорю», сохраняя тесную связь между посланником и Господом в данном контексте.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Но если
  rationale: Передаёт усиленное условное противопоставление предшествующему предостережению и естественно звучит по-русски.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: будешь неуклонно слушаться
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает действие; глагол שׁמע с «голосом» здесь подразумевает не только слышание, но и послушание.
- source_word: בְּקֹלוֹ
  choice: его голоса
  rationale: Сохраняет личную отсылку к посланнику из ближайшего контекста и естественно сочетается с русским «слушаться».
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: и исполнять всё, что Я говорю
  rationale: Сохраняет переход от третьего лица («его») к речи Господа от первого лица («Я») и передаёт практическое выполнение сказанного.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: Я буду врагом твоих врагов
  rationale: Сохраняет лексический повтор и взаимное соответствие глагола איב и существительного אויב.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: и противником твоих противников
  rationale: Передаёт параллелизм и однокоренную словесную игру צרר / צרר, не сливая эту строку с предыдущей.
theological_decisions:
- issue: Переход от «его голоса» к «Я говорю»
  choice: Сохранить смену лица без гармонизации.
  alternative: Отнести обе части только к посланнику либо сгладить их как прямую речь одного лишь Господа.
  rationale: Еврейский текст тесно связывает голос посланника с речью Господа, но не объясняет эту связь; перевод сохраняет исходное богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм «врагом твоих врагов / противником твоих противников» сохранён ради структуры и словесной игры оригинала.
