  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: ru
  text: Не искажай правосудия, причитающегося бедняку, в его тяжбе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не лишай бедняка справедливого суда в его деле».'
    reason: 'Лексико-синтаксическая альтернатива: מִשְׁפָּט может подчёркивать причитающееся человеку справедливое судебное решение, а רִיב — его судебное дело.'
lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Обычное отрицание, которое в сочетании с формой глагола выражает запрет.
- source_word: תַטֶּה
  choice: искажай
  rationale: Порода хифиль глагола נטה здесь означает «отклонять, извращать» в судебном смысле; «искажать правосудие» естественно передаёт юридическую направленность запрета.
- source_word: מִשְׁפַּט
  choice: правосудия
  rationale: В данном юридическом контексте слово обозначает справедливое судебное решение или законное право; «правосудие» сохраняет и судебный, и нравственный аспекты.
- source_word: אֶבְיֹנְךָ
  choice: бедняка из твоего народа
  rationale: אֶבְיוֹן — бедный, нуждающийся человек; суффикс 2-го лица ед. числа буквально даёт «твой бедняк». Оборот «из твоего народа» естественно передаёт принадлежность к общине, не подразумевая личного владения.
- source_word: בְּרִיבוֹ
  choice: в тяжбе
  rationale: רִיב может означать спор, судебную тяжбу или дело; «в тяжбе» ясно сохраняет судебный контекст и связь с делом бедняка.
theological_decisions:
- issue: Запрещает ли стих пристрастие против бедного, а не пристрастие в его пользу
  choice: Запрет искажать правосудие в судебной тяжбе бедняка, то есть лишать его справедливого решения.
  alternative: 'Обобщённое: «не отказывай бедному в справедливости».'
  rationale: Синтаксис называет מִשְׁפַּט объектом искажения, а בְּרִיבוֹ задаёт судебную ситуацию. Перевод сохраняет конкретный юридический смысл и не превращает стих в отвлечённый социальный лозунг.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. «Тяжба» несколько книжное, но понятное юридическое слово; оно кратко передаёт רִיב. Мужской род «бедняка» соответствует форме еврейского существительного и имеет здесь обобщающее значение.
