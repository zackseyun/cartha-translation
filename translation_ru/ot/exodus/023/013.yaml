base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: ru
  text: Во всём, что Я сказал вам, будьте внимательны; имени других богов не упоминайте[a], и пусть оно не звучит на твоих устах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более узком смысле: «не призывайте других богов по имени».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть оно не будет слышно на твоих устах». В еврейском тексте здесь обращение переходит от множественного числа к единственному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: Во всём, что Я сказал вам
  rationale: Предлог בְּ с כֹּל задаёт всеобъемлющую сферу повеления, а перфект אָמַרְתִּי естественно отсылает к уже данным предписаниям.
- source_word: תִּשָּׁמֵרוּ
  choice: будьте осмотрительны
  rationale: Нифаль от שׁמר здесь призывает хранить себя, проявляя внимание к сказанному. Такой перевод передаёт рефлексивно-предостерегающий оттенок и звучит естественно в современном русском языке.
- source_word: וְשֵׁם אֱלֹהִים אֲחֵרִים
  choice: имён других богов
  rationale: Хотя שֵׁם стоит в единственном числе, русский язык естественно согласует распределительное понятие имени с множественным «других богов». Союз передан пунктуационной связью после точки с запятой.
- source_word: לֹא תַזְכִּירוּ
  choice: не упоминайте
  rationale: Хифиль от זכר допускает значения «упоминать» и, в более узком контексте, «призывать». Основной текст сохраняет более широкое значение, не ограничивая запрет культовым призыванием.
- source_word: לֹא יִשָּׁמַע
  choice: да не прозвучат они
  rationale: Нифаль выражает запрет на то, чтобы эти имена были слышны. Русская конструкция с «да не» сохраняет юридически-торжественную силу, оставаясь понятной.
- source_word: עַל פִּיךָ
  choice: у вас на устах
  rationale: Буквально выражение означает «на твоих устах/при твоих устах». «На устах» сохраняет образ речи, а множественное «у вас» отражает коллективного адресата предыдущей формы множественного числа, несмотря на переход к единственному числу в масоретском тексте.
theological_decisions:
- issue: Характер запрета на употребление имён других богов
  choice: Передать общий запрет «не упоминайте», не расширяя его до утверждения об онтологическом статусе этих богов.
  alternative: «Не призывайте имён других богов», понимая речь прежде всего как запрет культового обращения.
  rationale: תַזְכִּירוּ само по себе допускает как общее упоминание, так и более специальное призывание. Стих не уточняет окончательно границы запрета, поэтому более узкий вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным правовым звучанием. Местоимение говорящего Бога написано с прописной буквы по принятой русской библейской традиции. Формула «да не прозвучат» передаёт силу запрета без архаичной тяжеловесности.
