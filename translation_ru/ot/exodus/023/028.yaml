  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: ru
  text: Я пошлю перед тобой шершней[a], и они прогонят от тебя хиввеев, хананеев и хеттеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, это образное обозначение ужаса, паники или иного воздействия, которое Бог посылает впереди Израиля; еврейское слово обычно означает «шершень».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Я пошлю
  rationale: Форма перфекта 1-го лица ед. числа с союзом в данном контексте выражает будущее обещание; перевод сохраняет личное действие Бога.
- source_word: הַצִּרְעָה
  choice: шершней
  rationale: Существительное обычно обозначает шершня или другое жалящее насекомое. В еврейском употреблено единственное число с артиклем, допускающее собирательное значение; в естественном русском это передано множественным числом.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Буквально «перед твоим лицом»; здесь означает, что посланное Богом средство пойдёт впереди Израиля.
- source_word: וְגֵרְשָׁה
  choice: и они прогонят
  rationale: Глагол означает «прогонять, изгонять». Множественное местоимение согласовано с естественным русским собирательным переводом «шершней».
- source_word: הַחִוִּי
  choice: хиввеев
  rationale: Принятая русская форма этнонима; множественное число естественно обозначает народ.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Принятая русская форма этнонима; множественное число естественно обозначает народ.
- source_word: הַחִתִּי
  choice: хеттеев
  rationale: Принятая русская форма этнонима; множественное число естественно обозначает народ.
- source_word: מִלְּפָנֶיךָ
  choice: от тебя
  rationale: Выражение буквально значит «от твоего лица, прочь от тебя»; краткий русский оборот ясно передаёт удаление народов с пути и из присутствия Израиля.
theological_decisions:
- issue: Следует ли понимать הַצִּרְעָה буквально или образно
  choice: В основном тексте сохранено обычное лексическое значение «шершни»
  alternative: «ужас», паника или иное средство Божьего воздействия
  rationale: Обычное значение еврейского слова — шершень или жалящее насекомое. Образное понимание возможно, но не обязательно следует из формы слова, поэтому оно отмечено в сноске, а не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Собирательное еврейское единственное число передано естественным русским множественным «шершней»; перечисление этнонимов также дано во множественном числе.
