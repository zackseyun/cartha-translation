  text: וְ/אֶ֨ת הָ/אַ֔יִל תְּנַתֵּ֖חַ לִ/נְתָחָ֑י/ו וְ/רָחַצְתָּ֤ קִרְבּ/וֹ֙ וּ/כְרָעָ֔י/ו וְ/נָתַתָּ֥ עַל נְתָחָ֖י/ו וְ/עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: ru
  text: Барана разрежь на части, вымой его внутренности[a] и голени и положи их на его части и на голову[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать внутреннюю часть вообще; здесь, вероятно, имеются в виду внутренние органы животного.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «положи их вместе с его частями и головой». Предлог буквально означает «на», но здесь может указывать на совместное размещение частей для жертвоприношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: барана
  rationale: В контексте жертвоприношения אַיִל обозначает взрослого самца овцы; «баран» — точный и естественный русский эквивалент.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: разрежь на части
  rationale: Форма пиэль глагола נתח описывает разделку жертвенного животного на отдельные куски; русский оборот передаёт и действие, и его результат.
- source_word: קִרְבּוֹ
  choice: его внутренности
  rationale: קֶרֶב может обозначать внутреннюю часть вообще, но в жертвенном предписании, где требуется омовение, речь идёт о внутренностях животного.
- source_word: כְרָעָיו
  choice: голени
  rationale: כְּרָעַיִם обозначает ноги животного, особенно их нижнюю часть; «голени» точнее общего слова «ноги» и естественно для описания разделки туши.
- source_word: וְנָתַתָּ עַל
  choice: и положи их на
  rationale: Основное пространственное значение עַל — «на». Оно сохранено в основном тексте, хотя в данном ритуальном контексте возможно понимание совместного размещения частей.
- source_word: רֹאשׁוֹ
  choice: голову
  rationale: Прямое и естественное соответствие анатомическому термину רֹאשׁ.
- source_word: וְ
  choice: и
  rationale: Союзы связывают последовательные предписания; русский синтаксис ясно передаёт порядок действий без добавления отсутствующего в еврейском наречия «затем».
theological_decisions:
- issue: Пространственное отношение, выраженное עַל
  choice: «положи их на его части и на голову»
  alternative: «положи их вместе с его частями и головой»
  rationale: Основной текст сохраняет буквальное значение предлога «на», а возможное контекстуальное понимание совместного размещения отмечено в сноске; богословского уточнения сверх исходного текста не вносится.
translation_notes:
  register: Современный литературный русский язык с ясной ритуально-процедурной формулировкой. Использовано обращение во втором лице единственного числа, соответствующее еврейским глагольным формам. Слово «голени» сохраняет анатомическую точность без излишне специальной терминологии.
