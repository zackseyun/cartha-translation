base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: ru
  text: 'Священные одежды Аарона после него перейдут к его сыновьям: в них их будут помазывать и посвящать на служение[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнять их руку». Это древнееврейское выражение означает посвящение, то есть введение, в священническое служение.'
    reason: Сохраняет исходную культовую идиому и поясняет её значение современному читателю.
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: священные одежды
  rationale: Сочетание обозначает одежды, отделённые для священного служения. «Священные одежды» естественно звучит по-русски и сохраняет значение посвящённости святыне.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: одежды Аарона
  rationale: Предлог לְ выражает принадлежность или предназначение. Русская родительная конструкция кратко и естественно передаёт эту связь.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: после него перейдут к его сыновьям
  rationale: 'Фраза указывает на преемство: после Аарона одежды должны использовать его сыновья. Глагол «перейдут» ясно выражает передачу без добавления идеи частной наследственной собственности.'
- source_word: לְמָשְׁחָה בָהֶם
  choice: в них их будут помазывать
  rationale: בָהֶם указывает, что помазание совершается, когда сыновья облачены в эти одежды, а не посредством самих одежд. Перестройка фразы нужна для естественного русского синтаксиса.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: и посвящать на служение
  rationale: Выражение «наполнить руку» — древнееврейская культовая идиома введения в священническое служение. Смысл передан в основном тексте, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Передача священнической идиомы מִלֵּא אֶת־יָד
  choice: посвящать на служение
  alternative: наполнять их руку
  rationale: Буквальная калька в современном русском непонятна и может создать ложный смысл. «Посвящать на служение» передаёт функцию обряда, не привязывая её к терминологии какой-либо поздней церковной традиции; исходный образ указан в сноске.
- issue: Значение בָהֶם при помазании и посвящении
  choice: в них
  alternative: ими
  rationale: 'Предлог בְ здесь естественнее понимать обстоятельственно: обряд совершается на людях, облачённых в эти одежды. Перевод «ими» мог бы ошибочно представить одежды орудием помазания или посвящения.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка перестроен ради естественности; параллельные действия помазания и посвящения сохранены. Двоеточие подчёркивает назначение одежд.
