  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ru
  text: Затем возьми второго барана, и Аарон и его сыновья возложат руки на голову барана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Затем возьми
  rationale: Перфект qal с союзом в последовательности предписаний передаёт повеление, обращённое к Моисею. «Затем» естественно обозначает следующий этап обряда.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: второго барана
  rationale: אַיִל означает «баран», а определённое порядковое הַשֵּׁנִי — «второй» и указывает на второго барана в последовательности посвящения.
- source_word: וְסָמַךְ
  choice: возложат
  rationale: В контексте жертвоприношения סמך обозначает ритуальное возложение или опирание рук на животное. «Возложат руки» — ясное и принятое в русском библейском стиле выражение без добавочного истолкования.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Аарон и его сыновья
  rationale: בָּנִים здесь обозначает сыновей Аарона, участвующих в посвящении в священники.
- source_word: אֶת יְדֵיהֶם
  choice: руки
  rationale: Еврейский текст употребляет множественное число «их руки». В русском принадлежность однозначно определяется составным подлежащим, поэтому отдельное «свои» не требуется.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: на голову барана
  rationale: Прямо передаёт пространственное выражение; единственное число «голову» соответствует единственному числу в еврейском тексте.
theological_decisions:
- issue: Передача обряда возложения рук без привнесения позднейшего богословского объяснения
  choice: возложат руки на голову барана
  alternative: положат руки на голову барана; обопрутся руками о голову барана
  rationale: Текст описывает само ритуальное действие, но не объясняет его символику. Перевод не добавляет идей перенесения вины, отождествления или рукоположения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повелительное «возьми» естественно передаёт адресованное Моисею предписание; «возложат руки» сохраняет ритуальный характер действия.
