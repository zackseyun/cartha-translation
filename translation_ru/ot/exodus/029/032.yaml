  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: ru
  text: Аарон и его сыновья должны есть у входа в шатёр встречи мясо барана и хлеб из корзины.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכַל
  choice: пусть едят
  rationale: В контексте обрядовых предписаний форма обозначает предписанное действие. Русская конструкция «пусть едят» естественно передаёт директивную силу, не превращая её в повествовательное прошедшее время.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Аарон и его сыновья
  rationale: בנים здесь обозначает сыновей Аарона, участвующих в посвящении в священники; конкретное мужское обозначение сохранено.
- source_word: בְּשַׂר הָאַיִל
  choice: мясо барана
  rationale: Хотя בשר буквально может означать «плоть», применительно к пище от жертвенного животного современное русское «мясо» точно и естественно.
- source_word: הַלֶּחֶם אֲשֶׁר בַּסָּל
  choice: хлеб, который в корзине
  rationale: לֶחֶם передано собирательным «хлеб»; относительная конструкция сохраняет указание на его нахождение в обрядовой корзине.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: у входа в шатёр встречи
  rationale: פֶּתַח обозначает вход или проём, а אֹהֶל מוֹעֵד — особый шатёр, где Бог встречается со Своим народом; буквальное и понятное «шатёр встречи» сохраняет образ и функцию названия.
theological_decisions:
- issue: Директивная сила обрядового предписания
  choice: пусть едят
  alternative: будут есть; должны есть
  rationale: Выбранная форма передаёт предписание в данном законодательном контексте, не усиливая его до явно выраженной обязанности сверх грамматики и не принимая его за простое будущее.
- issue: Обозначение священнических участников мужского пола
  choice: его сыновья
  alternative: его дети
  rationale: Речь идёт именно о сыновьях Аарона, посвящаемых в священники; обобщающее «дети» расширило бы референт исходного текста.
- issue: Передача названия אֹהֶל מוֹעֵד
  choice: шатёр встречи
  alternative: скиния собрания
  rationale: «Шатёр встречи» непосредственно передаёт состав еврейского выражения и не решает без необходимости возможный смысл מוֹעֵד как назначенной встречи или собрания.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно буквальным изложением. «Шатёр» предпочтён архаичному «скиния», а «мясо» — менее естественной в данном пищевом контексте «плоти».
