  source_fidelity: 'Конечное обстоятельство פֶּתַח אֹהֶל מוֹעֵד относится к действию вкушения: есть следует у входа в шатёр, а не просто уточнять местонахождение хлеба или корзины. В исходной формулировке эта связь синтаксически неясна. Директивный оттенок וְאָכַל в обрядовом предписании надёжнее передан словом «должны», чем «пусть едят», которое по-русски может звучать как разрешение или пожелание.'
