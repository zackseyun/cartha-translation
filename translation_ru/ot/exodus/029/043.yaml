  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: ru
  text: Там Я буду встречаться с сынами Израиля[a], и оно будет освящено Моей славой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть с израильтянами. Буквально: «с сынами Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте подлежащее не названо: буквально «и будет освящён Моей славой». Оно может относиться к священному месту в целом, в частности к шатру встречи или жертвеннику.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: Я буду встречаться
  rationale: Нифаль глагола יעד в контексте святилища обозначает назначенную встречу Бога с людьми. «Буду встречаться» естественно передаёт повторяющееся действие, ожидаемое в данном месте.
- source_word: שָׁמָּה
  choice: там
  rationale: Наречие места отсылает к месту святилища, описанному в предыдущем контексте.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: с сынами Израиля
  rationale: Предлог ל при יעד передаёт участников встречи; буквальное выражение «сыны Израиля» сохраняет форму принятого в еврейском тексте обозначения народа.
- source_word: וְנִקְדַּשׁ
  choice: это место будет освящено
  rationale: Нифаль глагола קדש выражает становление святым или освящение. Мужской род еврейской формы не позволяет по-русски употребить нейтральное «оно» без названного референта, поэтому «это место» указывает на область святилища, не уточняя, идёт ли речь о шатре или жертвеннике.
- source_word: בִּכְבֹדִי
  choice: Моей славой
  rationale: 'Предлог ב здесь естественно понимать инструментально: Божья слава выступает силой, освящающей место.'
theological_decisions:
- issue: Неявное подлежащее при וְנִקְדַּשׁ
  choice: «это место будет освящено» — общее указание на место святилища
  alternative: «шатёр будет освящён»; «жертвенник будет освящён»; «он будет освящён» применительно к Аарону
  rationale: В еврейском предложении стоит глагол 3-го лица мужского рода единственного числа без выраженного подлежащего. Контекст указывает на священное место, однако не даёт оснований безоговорочно выбрать шатёр или жертвенник. Русское «это место» делает фразу грамматически ясной, а примечание сохраняет исходную неоднозначность.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формально прозрачный вариант сохраняет стандартное заветное наименование народа и не ограничивает его одними мужчинами, что поясняется в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Написание местоимений Бога с прописной буквы соответствует принятой русской библейской традиции. Формула «сыны Израиля» сохранена ради прозрачности исходного выражения и снабжена пояснением.
