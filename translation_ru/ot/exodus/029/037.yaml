base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: ru
  text: В течение семи дней совершай обряд очищения жертвенника и освящай его. Жертвенник станет святейшей святыней. Всё, что прикоснётся к жертвеннику, станет святым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Всё, что прикоснётся к жертвеннику, будет святым». Древнееврейский текст можно понимать либо как передачу святости через прикосновение, либо как указание, что прикасаться к жертвеннику может только святое.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר עַל הַמִּזְבֵּחַ
  choice: совершай обряд очищения жертвенника
  rationale: В священническом обрядовом контексте כפר обозначает действие, устраняющее ритуальную нечистоту или вину; עַל указывает на объект этого действия. Формулировка «обряд очищения жертвенника» естественна по-русски и не создаёт ошибочного впечатления, будто сам жертвенник необходимо «искупить» в смысле выкупа.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: и освящай его
  rationale: Глагол קדש здесь означает отделить жертвенник для священного служения, сделать его святым. «Освящай» точно передаёт обрядовый смысл и сохраняет параллелизм действий, совершаемых в течение семи дней.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: величайшей святыней
  rationale: Сочетание существительных выражает превосходную степень святости. «Величайшая святыня» звучит естественно в современном литературном русском и подходит для предмета, не смешивая его с названием внутреннего помещения святилища — «Святое святых».
- source_word: כָּל הַנֹּגֵעַ
  choice: Всё, что прикоснётся
  rationale: Конструкция с כָּל и причастием не ограничена явно только людьми и может охватывать любого человека или любой предмет. Нейтральное «всё, что» сохраняет эту широту.
- source_word: יִקְדָּשׁ
  choice: станет святым
  rationale: 'Форма допускает результирующее понимание: соприкосновение с жертвенником приводит к состоянию святости. «Станет святым» ясно выражает этот основной смысл, не скрывая альтернативного толкования, вынесенного в примечание.'
theological_decisions:
- issue: Передаётся ли святость через прикосновение к жертвеннику или к нему может прикасаться лишь уже освящённый человек
  choice: В основном тексте прикосновение приводит к тому, что прикоснувшееся становится святым.
  alternative: Каждый, кто прикасается к жертвеннику, должен быть свят.
  rationale: 'Последовательность כָּל הַנֹּגֵעַ ... יִקְדָּשׁ естественно допускает значение результата: «всё прикоснувшееся станет святым». Вместе с тем контекст священнических предписаний позволяет понимать выражение как требование святости для того, кто касается жертвенника; эта богословски значимая неоднозначность сохранена в примечании.'
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным обрядовым словарём. Синтаксис разделён на три предложения ради ясности; «Тогда» естественно передаёт переход к результату освящения. Архаизмы и узкоконфессиональная терминология не используются.
