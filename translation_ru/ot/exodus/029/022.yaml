source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ מִן הָ֠/אַיִל הַ/חֵ֨לֶב וְ/הָֽ/אַלְיָ֜ה וְ/אֶת הַ/חֵ֣לֶב הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֗רֶב וְ/אֵ֨ת יֹתֶ֤רֶת הַ/כָּבֵד֙ וְ/אֵ֣ת שְׁתֵּ֣י הַ/כְּלָיֹ֗ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן וְ/אֵ֖ת שׁ֣וֹק הַ/יָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: ru
  text: И возьми от барана жир, курдюк, жир, покрывающий внутренности, отросток печени[a], обе почки и жир на них, а также правое бедро, потому что это баран посвящения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придаток печени»; точное обозначение этой части печени остаётся неясным.'
    reason: Сохраняется реальная анатомическая неоднозначность еврейского выражения יֹתֶרֶת הַכָּבֵד.
  - marker: b
    text: 'Или: «баран поставления» или «баран введения в служение». Так назван баран, используемый в обряде посвящения священников и введения их в служение.'
    reason: Еврейское обрядовое выражение אֵיל מִלֻּאִים допускает несколько близких по смыслу передач.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: И возьми
  rationale: В последовательности обрядовых предписаний форма с союзом выражает продолжение повеления; русский императив естественно передаёт эту функцию.
- source_word: חֵלֶב
  choice: жир
  rationale: В жертвенном контексте слово обозначает предназначенные для принесения жировые части животного; прямой русский эквивалент сохраняет конкретность.
- source_word: אַלְיָה
  choice: курдюк
  rationale: Речь идёт о богатом жиром хвосте овцы, а не о хвосте вообще; «курдюк» точно и кратко называет эту часть туши.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: покрывающий внутренности
  rationale: Оборот описывает жир вокруг внутренних органов; формулировка точна и понятна современному читателю.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: отросток печени
  rationale: Точная анатомическая идентификация спорна; «отросток» передаёт значение выступающей или придаточной части, не создавая ложной точности.
- source_word: כְּלָיֹת
  choice: почки
  rationale: Прямое анатомическое значение слова соответствует обрядовому контексту.
- source_word: שׁוֹק הַיָּמִין
  choice: правое бедро
  rationale: שׁוֹק обозначает крупную часть ноги животного; «бедро» ясно называет отделяемую жертвенную часть и соответствует контексту разделки.
- source_word: אֵיל מִלֻּאִים
  choice: баран посвящения
  rationale: Устойчивое обрядовое выражение относится к барану, используемому при введении священников в служение; «посвящение» передаёт сакрально-служебный смысл без привнесения поздней церковной терминологии.
theological_decisions:
- issue: Передача אֵיל מִלֻּאִים — обозначения обряда введения священников в служение
  choice: баран посвящения
  alternative: баран поставления; баран введения в служение
  rationale: Контекст говорит о посвящении Аарона и его сыновей и их введении в священническое служение. Выражение «баран посвящения» естественно по-русски и не отождествляет древнеизраильский обряд с какой-либо поздней конфессиональной практикой; допустимые смысловые варианты указаны в примечании.
translation_notes:
  register: Современный литературный русский язык с ясной обрядовой лексикой. Синтаксис сохраняет последовательность исходного предписания, но избегает тяжеловесного многократного повторения союза. Термин «курдюк» обеспечивает анатомическую точность, а примечания сохраняют две существенные лексические неоднозначности.
