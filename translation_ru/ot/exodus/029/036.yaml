  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: ru
  text: И каждый день приноси быка как жертву за грех для искупления[a]. Очищай жертвенник, совершая над ним обряд искупления, и помажь его, чтобы освятить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быка как очистительную жертву». Еврейское слово חַטָּאת может означать как «грех», так и, в контексте жертвоприношений, жертву для очищения от греха или ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: быка
  rationale: פַר обозначает быка; само слово здесь не требует уточнения возраста.
- source_word: חַטָּאת
  choice: жертву за грех
  rationale: В жертвенном контексте חַטָּאת обозначает приношение, связанное с устранением греха или ритуальной нечистоты. Традиционное и понятное русское соответствие сохраняет эту связь; возможный оттенок очищения отмечен в сноске.
- source_word: לַיּוֹם
  choice: каждый день
  rationale: В контексте повторяющегося обряда выражение имеет распределительное значение и естественно передаётся по-русски как «каждый день».
- source_word: עַל הַכִּפֻּרִים
  choice: для искупления
  rationale: Форма множественного числа указывает на искупительные обряды; русское отвлечённое существительное в единственном числе передаёт смысл естественно и без ненужной тяжеловесности.
- source_word: וְחִטֵּאתָ
  choice: очищай
  rationale: Пиэль глагола חטא в культовом контексте означает ритуально очищать. Такой перевод не создаёт ложного впечатления, будто жертвенник сам совершил нравственный грех.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшееся русское обозначение алтаря для жертвоприношений в контексте скинии.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: совершая над ним обряд искупления
  rationale: Предлог ב при инфинитиве может иметь временное или инструментальное значение. Деепричастная конструкция сохраняет эту близость значений, а «над ним» естественно относит местоимение к жертвеннику и отражает культовое употребление על.
- source_word: וּמָשַׁחְתָּ
  choice: помажь
  rationale: משׁח — обычный глагол для ритуального помазания освящающим маслом.
- source_word: לְקַדְּשׁוֹ
  choice: чтобы освятить
  rationale: В данном контексте קדשׁ означает отделить жертвенник как святыню для священного употребления; «освятить» точно и естественно передаёт это значение.
theological_decisions:
- issue: Передача культовых понятий очищения и искупления без привнесения более поздних вероучительных категорий
  choice: «жертва за грех», «очищай» и «совершая над ним обряд искупления» в ритуальном смысле
  alternative: «очистительная жертва»; «очисти от греха»; «соверши искупление за него»
  rationale: Стих описывает освящение жертвенника посредством жертвенного обряда. Выбранные формулировки сохраняют культовые категории еврейского текста и показывают, что жертвенник ритуально очищается и освящается, а не получает нравственное прощение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского предписания. Повелительные формы передают предписывающую силу еврейских форм с וְקטל; терминология понятна широкому читателю и не перегружена архаизмами.
