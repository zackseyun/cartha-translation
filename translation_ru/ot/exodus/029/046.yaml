  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: ru
  text: И узнают они, что Я — Яхве, их Бог, Который вывел их из земли Египта, чтобы обитать среди них[a]. Я — Яхве, их Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посреди них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: И узнают они
  rationale: Форма передаёт будущий результат предшествующих обетований. Постпозиция местоимения сохраняет торжественный тон, не делая фразу архаичной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵיהֶם
  choice: их Бог
  rationale: Несмотря на морфологическую форму существительного, сочетание с именем Яхве и контекст требуют единственного числа.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: Который вывел их из земли Египта
  rationale: Передаёт обычную для Исхода формулу и сохраняет относительную конструкцию с אֲשֶׁר.
- source_word: לְשָׁכְנִי
  choice: чтобы обитать
  rationale: Инфинитив с לְ здесь выражает цель исхода; целевая конструкция естественна по-русски.
- source_word: בְתוֹכָם
  choice: среди них
  rationale: Естественный современный русский эквивалент еврейского выражения «в их среде, посреди них».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение цели в לְשָׁכְנִי
  choice: чтобы обитать среди них
  alternative: для обитания среди них; обитать среди них
  rationale: 'Предлог לְ при инфинитиве наиболее естественно обозначает здесь цель: Бог вывел Израиль из Египта ради Своего присутствия среди народа.'
- issue: Связь относительного оборота אֲשֶׁר הוֹצֵאתִי
  choice: Который вывел их
  alternative: Я вывел их
  rationale: Сохранён относительный оборот исходного текста, связывающий самооткровение Яхве с исходом, без превращения его в отдельное независимое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Синтаксис и повтор заключительной формулы сохранены; архаизмы вроде «из земли Египетской» не использованы.
