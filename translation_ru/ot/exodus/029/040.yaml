  text: וְ/עִשָּׂרֹ֨ן סֹ֜לֶת בָּל֨וּל בְּ/שֶׁ֤מֶן כָּתִית֙ רֶ֣בַע הַ/הִ֔ין וְ/נֵ֕סֶךְ רְבִעִ֥ית הַ/הִ֖ין יָ֑יִן לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: ru
  text: и одну десятую эфы муки тонкого помола[a], смешанной с четвертью гина масла из толчёных оливок[b], и четверть гина вина для возлияния — для одного ягнёнка[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одну десятую». В предписаниях о приношениях подразумевается одна десятая эфы.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть масла, полученного из раздробленных или истолчённых оливок; возможный перевод: «прессованного масла».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для первого ягнёнка». Судя по контексту, речь, вероятно, идёт о первом из двух ягнят, ежедневно приносившихся в жертву.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹן
  choice: и одну десятую эфы
  rationale: עִשָּׂרוֹן обозначает стандартную жертвенную меру — одну десятую эфы. Единица измерения подразумевается еврейским термином и для ясности выражена в основном тексте.
- source_word: סֹלֶת
  choice: муки тонкого помола
  rationale: Слово обозначает тщательно смолотую муку, предназначенную, в частности, для приношений. Такой перевод точен и понятен современному читателю.
- source_word: בָּלוּל בְּשֶׁמֶן
  choice: смешанной с … маслом
  rationale: Страдательное причастие и предлог описывают муку, приготовленную путём смешивания с маслом.
- source_word: כָּתִית
  choice: из толчёных оливок
  rationale: Прилагательное указывает на масло, полученное из оливок путём дробления или толчения. Развёрнутая формулировка естественнее по-русски, чем буквальное «толчёное масло».
- source_word: רֶבַע הַהִין / רְבִעִית הַהִין
  choice: четвертью гина / четверть гина
  rationale: Обе формы обозначают одну четвертую древней меры жидкостей — гина; единообразный перевод сохраняет точные количества.
- source_word: וְנֵסֶךְ
  choice: и … вина для возлияния
  rationale: נֶסֶךְ — техническое обозначение жидкого приношения, которое выливали перед Богом. Конструкция «вино для возлияния» передаёт назначение ясно и без излишне специального слова «либация».
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: для одного ягнёнка
  rationale: Перевод сохраняет сочетание определённого артикля с числительным, не заменяя его контекстуальным, но более толковательным вариантом «для первого ягнёнка».
theological_decisions:
- issue: Отнесение приношения к одному из двух ежедневных ягнят
  choice: для одного ягнёнка
  alternative: для первого ягнёнка
  rationale: Сам стих буквально говорит «для одного ягнёнка»; окружающий контекст позволяет понимать его как первого из двух, однако основной текст не должен без необходимости устранять эту особенность выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Древние меры «эфа» и «гин» сохранены без пересчёта; синтаксис сделан естественным для русского перечисления. Все поясняющие сноски отмечены в основном тексте.
