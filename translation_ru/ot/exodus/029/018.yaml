  source_fidelity: 'Перевод верно передаёт повеление сжечь барана целиком, жертвенник, всесожжение, формулу «приятное благоухание» и двукратное упоминание Яхве. Однако «всесожжение Яхве» может читаться как принадлежащее Яхве, тогда как לְ здесь естественнее передать как посвящение: «для Яхве». «Огненная жертва» допустима, но несколько менее точна и ясна, чем развёрнутое обозначение жертвы, приносимой огнём.'
