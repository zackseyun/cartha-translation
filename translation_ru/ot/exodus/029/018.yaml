  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ru
  text: И сожги всего барана на жертвеннике. Это — всесожжение для Яхве, приятное благоухание; это жертва, приносимая огнём, для Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: И сожги
  rationale: В породе хифиль глагол קטר в жертвенном контексте означает предать жертву огню, чтобы она поднялась дымом. «Сожги» естественно по-русски и вместе с упоминанием жертвенника сохраняет культовый смысл.
- source_word: כָּל הָאַיִל
  choice: всего барана
  rationale: כָּל подчёркивает, что на жертвеннике сжигают животное целиком, а אַיִל обозначает именно барана.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс указывает на движение к жертвеннику, однако в данном контексте по-русски естественно обозначить место сожжения предлогом «на».
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин точно передаёт жертву, целиком сжигаемую на жертвеннике, и соответствует акценту данного стиха на всём баране.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает посвящение и направленность жертвы; форма «Яхве» сохраняет личное заветное имя יהוה.
- source_word: רֵיחַ נִיחוֹחַ
  choice: приятное благоухание
  rationale: Это устойчивое жертвенное выражение обозначает благоухание принятой, угодной Богу жертвы. Формулировка сохраняет образ исходного текста, не сводя его только к абстрактной «угодности».
- source_word: אִשֶּׁה
  choice: огненная жертва
  rationale: Точное значение термина обсуждается, однако его связь с огнём наиболее прозрачна в данном контексте и хорошо согласуется со сжиганием жертвы на жертвеннике.
- source_word: הוּא
  choice: это
  rationale: Местоимение дважды выполняет связочно-указательную функцию, отождествляя сожжённого барана со всесожжением и огненной жертвой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет Тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и отличает его от титула «Господь».
- issue: Смысл формулы רֵיחַ נִיחוֹחַ
  choice: приятное благоухание
  alternative: успокоительное благоухание; благоухание, угодное Яхве
  rationale: Сохранён конкретный жертвенный образ и идея принятия жертвы, но перевод не усиливает возможный оттенок «успокоения» Бога, который современный читатель мог бы истолковать чрезмерно буквально.
- issue: Значение אִשֶּׁה
  choice: огненная жертва
  alternative: пищевой дар; жертва, приносимая в огне
  rationale: Этимология и точный категориальный смысл слова остаются предметом обсуждения. Основной текст сохраняет явную связь с огнём, а сноска отмечает возможное понимание как дара-пищи.
translation_notes:
  register: Современный литературный русский язык с сохранением принятой библейской жертвенной терминологии. Синтаксический повтор «это» передаёт два употребления הוּא и придаёт формуле торжественную ясность; точка с запятой позволяет сохранить единство жертвенного описания.
