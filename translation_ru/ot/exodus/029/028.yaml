base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: ru
  text: Это будет принадлежать Аарону и его сыновьям как вечная установленная доля от израильтян, ибо это — приношение. Это будет приношением от израильтян, из их мирных жертв[a], — их приношением ГОСПОДУ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертв общения» или «жертв благополучия». Еврейское слово связано со значениями мира, целостности и благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Это будет принадлежать
  rationale: Буквально «и будет», но в данном правовом контексте глагол обозначает закрепление названной доли за Аароном и его сыновьями.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Аарону и его сыновьям
  rationale: Предлог לְ выражает здесь принадлежность или предназначение в пользу получателей.
- source_word: לְחָק עוֹלָם
  choice: как вечное установление
  rationale: חָק означает предписанное установление или положенную долю, а עוֹלָם — непреходящую обязательность в культово-правовом контексте; традиционное «вечное установление» естественно и торжественно звучит по-русски.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: от сынов Израиля
  rationale: Сохраняет образное и заветное обозначение народа, оставаясь понятным в современном русском.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение основания для предписания.
- source_word: תְרוּמָה
  choice: священное приношение
  rationale: Термин обозначает долю, отделённую и представленную Богу; добавление «священное» отличает её от обычного дара, не навязывая спорный способ ритуального возношения.
- source_word: וּתְרוּמָה יִהְיֶה
  choice: Это будет священным приношением
  rationale: Сохранён намеренный повтор ключевого культового термина, характерный для еврейского правового текста.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: взятым из их мирных жертв
  rationale: Передаёт исходную конструкцию «из жертв их шламим» естественным русским оборотом; «мирные жертвы» — устоявшийся термин, а более широкий смысл отмечен в сноске.
- source_word: תְּרוּמָתָם
  choice: их священным приношением
  rationale: Местоименный суффикс указывает, что это приношение сынов Израиля; повтор сохраняет лексическую связь с תְרוּמָה.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Передаёт личное имя יהוה принятой reverential формой «ГОСПОДЬ» и сохраняет направленность приношения Богу.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДУ
  alternative: Яхве
  rationale: Форма «ГОСПОДЬ» продолжает древнюю традицию благоговейного чтения имени и привычна русскому библейскому языку; прописное написание показывает, что в источнике стоит тетраграмматон.
- issue: Значение культового термина שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Устоявшийся русский термин сохраняет связь корня с миром и целостностью, но не исчерпывает всей семантики; поэтому допустимые оттенки приведены в сноске.
- issue: Значение תְרוּמָה
  choice: священное приношение
  alternative: возношение; отделённая доля
  rationale: Термин может обозначать как отделённый дар, так и представляемую Богу долю. Выбранная формулировка не утверждает однозначно конкретный жест поднятия и сохраняет культовый характер дара.
translation_notes:
  register: Современный литературный русский с достоинством правового и культового текста. Намеренный повтор «священное приношение» сохранён; синтаксис слегка упорядочен для ясности, а тире перед заключительной фразой передаёт её пояснительно-итоговый характер.
