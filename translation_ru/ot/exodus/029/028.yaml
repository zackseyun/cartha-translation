  naturalness: «Сыны Израиля» возможно в высоком библейском регистре, но в данном юридико-культовом изложении «израильтяне» естественнее и яснее. «Вечная установленная доля ... от израильтян» ясно передаёт חָק עוֹלָם и зависимость מֵאֵת בְּנֵי יִשְׂרָאֵל.
