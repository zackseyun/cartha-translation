base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ru
  text: И второго ягнёнка принеси в сумерках[a]. Вместе с ним принеси такое же хлебное приношение и такое же возлияние, как утром, — в приятное благоухание, огненную жертву[b] для Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между вечерами» — еврейское выражение, обозначающее позднее послеполуденное время или сумерки.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пищевое приношение»; традиционно: «жертва, приносимая огнём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: второго ягнёнка
  rationale: כֶּבֶשׂ обозначает молодую овцу, предназначенную для жертвоприношения; порядковое числительное связывает эту жертву с первым ежедневным приношением.
- source_word: תַּעֲשֶׂה
  choice: принеси
  rationale: Буквально глагол означает «делать», но в данном жертвенном контексте естественное русское соответствие — «принести (в жертву)».
- source_word: בֵּין הָעַרְבָּיִם
  choice: в сумерках
  rationale: Буквально идиома означает «между вечерами» и указывает на поздний дневной или сумеречный период; буквальная форма сохранена в примечании.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: такое же хлебное приношение, как утром
  rationale: מִנְחָה в жертвенном законодательстве обозначает приношение из зерна или муки; «хлебное приношение» — понятный и традиционно уместный русский термин.
- source_word: וּכְנִסְכָּהּ
  choice: такое же возлияние
  rationale: נֶסֶךְ — жидкость, которую ритуально выливали как сопровождающее жертвенное приношение; «возлияние» точно и лаконично передаёт этот смысл.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: в приятное благоухание
  rationale: Сохранена жертвенная метафора приятного, угодного благоухания без добавления явно не названного в этой фразе воспринимающего лица.
- source_word: אִשֶּׁה
  choice: огненную жертву
  rationale: Термин обозначает жертву, приносимую посредством огня. Перевод сохраняет культовое значение и не вводит спорное толкование «пища».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет непосредственное употребление Божьего имени в еврейском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон как собственное имя; транслитерация «Яхве» отличает его от титула אֲדֹנָי и не скрывает имя за титулом.
- issue: Значение אִשֶּׁה
  choice: огненная жертва
  alternative: пищевое приношение
  rationale: Связь термина с огнём лучше отражает непосредственную культовую форму слова и не разрешает молча спор о возможной пищевой образности жертвоприношения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией. Синтаксис упрощён для ясности, но повтор повелительной формулы и последовательность жертвенных элементов сохранены.
