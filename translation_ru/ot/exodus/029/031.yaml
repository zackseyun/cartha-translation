  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: ru
  text: И возьми барана посвящения[a] и свари его мясо в святом месте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «барана поставления в священники». Еврейское слово обозначает обряд введения священников в служение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Святом месте»; однако буквально по-еврейски — «в святом месте».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: баран
  rationale: Обычное и точное обозначение взрослого самца овцы в контексте жертвоприношения.
- source_word: הַמִּלֻּאִים
  choice: посвящения
  rationale: В данном священническом контексте термин обозначает обряд поставления и посвящения священников. «Посвящение» естественно звучит по-русски и сохраняет сакральный аспект обряда.
- source_word: תִּקָּח
  choice: возьми
  rationale: Форма второго лица единственного числа в ряду предписаний естественно передаётся русским повелительным наклонением.
- source_word: וּבִשַּׁלְתָּ
  choice: и свари
  rationale: Глагол בשׁל здесь указывает на приготовление посредством варки; «свари» точнее общего «приготовь».
- source_word: בְּשָׂרוֹ
  choice: его мясо
  rationale: В отношении жертвенного животного современное русское «мясо» естественнее, чем буквальное, но стилистически менее подходящее «плоть».
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: на святом месте
  rationale: Неопределённая еврейская конструкция буквально обозначает святое место и сама по себе не требует понимания как технического названия внутреннего помещения святилища.
theological_decisions:
- issue: Значение технического культового термина הַמִּלֻּאִים
  choice: баран посвящения
  alternative: баран поставления в священники
  rationale: Термин относится к обряду введения священников в служение. Основной вариант краток и передаёт освящающий характер обряда; сноска уточняет его должностной аспект, не сводя значение лишь к одному из них.
- issue: Следует ли понимать בְּמָקוֹם קָדֹשׁ как общее указание или как название помещения «Святое место»
  choice: на святом месте
  alternative: в Святом месте
  rationale: Отсутствие артикля в еврейском выражении не требует отождествлять это место с конкретным отделением скинии. Общая формулировка сохраняет неопределённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Сохранена последовательность предписаний посредством начального «И» и второго союза; избегнуты архаизмы и неоправданно узкая локализация.
