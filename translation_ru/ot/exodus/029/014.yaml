base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: ru
  text: А мясо быка, его шкуру и его помёт сожги в огне за пределами стана. Это жертва за грех.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистительная жертва». Еврейское חַטָּאת может означать как «грех», так и жертву, приносимую в связи с грехом. В жертвенных предписаниях его часто переводят как «жертва за грех», а вариант «очистительная жертва» подчёркивает очищающую функцию обряда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: мясо быка
  rationale: «Мясо» естественно передаёт конкретное значение בָּשָׂר применительно к туше жертвенного животного; «бык» — ясный современный эквивалент פַּר.
- source_word: עֹרוֹ
  choice: его шкуру
  rationale: В контексте туши животного «шкура» точнее и естественнее общего слова «кожа».
- source_word: פִּרְשׁוֹ
  choice: его помёт
  rationale: פֶּרֶשׁ обозначает испражнения; перевод не смягчён до «нечистоты» или «отбросов» и не смешан с внутренностями.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: сожги
  rationale: Форма второго лица единственного числа выражает прямое предписание; русский глагол «сожги» естественно включает действие огнём, поэтому отдельное «в огне» избыточно.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: за пределами стана
  rationale: Передаёт местонахождение вне границ израильского лагеря и сохраняет традиционно-библейское, но понятное современному читателю слово «стан».
- source_word: חַטָּאת
  choice: жертва за грех
  rationale: В данном жертвенном контексте слово обозначает жертвоприношение, связанное с грехом. Формулировка узнаваема и не сводит значение к абстрактному «греху».
- source_word: הוּא
  choice: Это
  rationale: Указательное «Это» естественно соотносит определение с предписанным жертвоприношением в целом.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: А ... , ... и ...
  rationale: Русское перечисление передаёт все три объекта, не создавая тяжеловесного повторения союза перед каждым членом.
theological_decisions:
- issue: Передача חַטָּאת в жертвенном законодательстве
  choice: жертва за грех
  alternative: очистительная жертва; грех
  rationale: Непосредственный культовый контекст требует понимать термин как название жертвы. В основном тексте сохранён традиционный и понятный вариант, а «очистительная жертва», подчёркивающая очищающую функцию обряда, приведена в сноске, чтобы не устранять реальную смысловую напряжённость термина.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Императив единственного числа соответствует обращению к Моисею. Синтаксис сделан естественным для русского языка при сохранении последовательности перечисленных частей туши.
