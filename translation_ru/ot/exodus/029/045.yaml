lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: И Я буду обитать
  rationale: Глагол שׁכן обозначает пребывание или поселение в каком-либо месте. «Обитать» естественно и достойно передаёт постоянное Божье присутствие, не добавляя более узкого образа скинии.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: В сочетании с обозначением народа בְּתוֹךְ выражает присутствие внутри сообщества; «среди» звучит естественнее, чем пространственно акцентированное «посреди».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Так сохраняется буквальный семейно-родовой образ еврейского выражения. В современном русском библейском регистре эта формулировка понятна и не требует замены на более обобщённое «израильтян».
- source_word: וְהָיִיתִי
  choice: и буду
  rationale: Здесь היה обозначает устойчивое отношение в формуле завета, а не становление или изменение состояния.
- source_word: לָהֶם לֵאלֹהִים
  choice: их Богом
  rationale: Русская конструкция «быть их Богом» естественно передаёт еврейское «быть им Богом» и сохраняет его relational/covenantal force.
theological_decisions:
- issue: Передача формулы завета וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: буду их Богом
  alternative: буду им Богом
  rationale: Основной вариант естественен для современного русского языка и ясно выражает принадлежность и отношения завета. Более буквальная конструкция сохраняется в примечании, поскольку возможен иной синтаксический акцент.
- issue: Передача гендерно маркированного выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: В основном тексте сохранено прямо выраженное мужское множественное число и семейно-родовой образ оригинала без нейтрализации.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавная буква в местоимении «Я» отмечает речь Бога согласно устойчивой русской издательской традиции; синтаксис остаётся простым и доступным.
