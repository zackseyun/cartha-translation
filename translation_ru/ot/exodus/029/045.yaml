  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: ru
  text: И Я буду обитать среди сынов Израиля[a] и буду их Богом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди сынов Израиля».'
