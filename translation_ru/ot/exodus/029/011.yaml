  text: וְ/שָׁחַטְתָּ֥ אֶת הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: ru
  text: И заколи быка перед Яхве[a] у входа в шатёр встречи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно переводится «ГОСПОДЬ». Другие варианты передачи имени — «Яхве» и «Иегова».'
    reason: Указывает исходную форму Божьего имени и основные традиции его передачи.
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: И заколи
  rationale: Форма с союзом продолжает последовательность предписаний; русский совершенный императив точно и естественно передаёт ритуальное повеление. «Заколи» конкретнее общего «убей» в контексте жертвоприношения.
- source_word: הַפָּר
  choice: быка
  rationale: פַּר обычно обозначает быка, особенно в жертвенном контексте; сам стих не требует уточнения «молодого».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי буквально выражает положение «перед» или присутствие перед кем-либо; краткая формулировка сохраняет пространственный и сакральный оттенки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: פֶּתַח
  choice: у входа
  rationale: Так естественно по-русски обозначается место совершения действия возле входа или проёма.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт обычное в данном контексте значение священного шатра как места встречи, оставаясь понятным современному читателю и не подменяя исходный образ традиционным термином «скиния».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя, тогда как «ГОСПОДЬ» отражает традицию замены при чтении, а «Иегова» представляет позднюю смешанную форму.
- issue: Значение אֹהֶל מוֹעֵד
  choice: шатёр встречи
  alternative: шатёр собрания; скиния собрания
  rationale: Сочетание может ассоциироваться как со встречей, так и с назначенным собранием. «Шатёр встречи» естественно передаёт место встречи Бога с Израилем, не устраняя полностью смысловую связь корня מועד с назначенной встречей.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой ритуального предписания. Императив «заколи» понятен и уместен в жертвенном контексте; «шатёр» сохраняет конкретный образ переносного святилища.
