base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: ru
  text: и одну круглую буханку хлеба, одну лепёшку с маслом и одну тонкую лепёшку — из корзины с пресными хлебами, стоящей перед Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ); традиционно передаётся как «Господь», также передаётся как «Иегова».
    reason: Указывает форму Божьего имени в оригинале и основные варианты его передачи по-русски.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: один круглый хлеб
  rationale: כִּכָּר обозначает круглый хлеб или хлебное изделие округлой формы. Перевод сохраняет указание на форму и отличает этот предмет от следующей חַלָּה.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: одну хлебную лепёшку с маслом
  rationale: חַלָּה здесь означает отдельное хлебное изделие, а שֶׁמֶן указывает на масло. Формулировка «с маслом» сохраняет лексическую сдержанность оригинала и не уточняет без достаточного основания, было ли масло замешано внутрь или нанесено иным способом.
- source_word: רָקִיק
  choice: одну тонкую лепёшку
  rationale: רָקִיק — тонкое хлебное изделие; «тонкая лепёшка» ясно передаёт его характер и звучит естественно по-русски.
- source_word: מִסַּל הַמַּצּוֹת
  choice: из корзины с пресным хлебом
  rationale: מִן указывает на источник, סַל означает корзину, а מַצּוֹת — пресный хлеб или пресные хлебные изделия. Собирательное «пресный хлеб» естественно в современном русском языке.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: которая находится перед Яхве
  rationale: לִפְנֵי буквально передаёт пространственное или культовое положение «перед, в присутствии». Относительное местоимение соотнесено с ближайшим словом «корзина», без добавления идеи посвящения или подношения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, записанное тетраграмматоном יהוה, передано распространённой научной транслитерацией «Яхве», а традиционная замена титулом отмечена в сноске.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал содержит собственное имя יהוה, а не титул אֲדֹנָי. Основной текст сохраняет имя в форме «Яхве»; традиционная русская замена «Господь» и вариант «Иегова» не внесены в основной текст, чтобы не подменять имя титулом и не утверждать менее вероятную вокализацию.
- issue: Способ употребления масла в חַלַּת לֶחֶם שֶׁמֶן
  choice: лепёшка с маслом
  alternative: лепёшка, замешанная на масле
  rationale: В данной именной конструкции масло обозначено, но способ приготовления прямо не выражен. Более общий перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно формальным, богослужебно уместным звучанием. Повтор числительного сохранён ради ритуальной точности. Начальное «и» оставлено, поскольку стих синтаксически продолжает предыдущее предписание.
