lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: И возложи
  rationale: Глагол שׂים означает «класть, помещать». В контексте торжественного обряда «возложи» естественно передаёт действие и сохраняет достоинство стиля; форма второго лица соответствует обращённому к Моисею предписанию.
- source_word: הַמִּצְנֶפֶת
  choice: тюрбан
  rationale: מִצְנֶפֶת обозначает обёрнутый вокруг головы священнический головной убор. «Тюрбан» понятнее современному читателю и предметно точнее, чем традиционное, но конфессионально окрашенное «митра».
- source_word: עַל רֹאשׁוֹ
  choice: ему на голову
  rationale: Так естественно по-русски передаётся буквальное «на его голову» без изменения пространственного смысла.
- source_word: וְנָתַתָּ
  choice: а … помести
  rationale: נתן здесь имеет пространственное значение «положить, поместить». Союз «а» ясно связывает два последовательных действия и позволяет избежать тяжёлого повторения «и».
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: священный венец
  rationale: נֵזֶר может обозначать венец или диадему как знак посвящения. «Священный венец» сохраняет культовый смысл определяющего הַקֹּדֶשׁ и не создаёт впечатления обычной царской короны.
- source_word: עַל הַמִּצְנָפֶת
  choice: на тюрбан
  rationale: 'Повтор предлога עַל сохранён: венец помещается непосредственно на священнический головной убор.'
