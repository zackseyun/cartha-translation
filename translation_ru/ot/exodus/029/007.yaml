lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Затем возьми
  rationale: Перфект с союзом в последовательности обрядовых предписаний передаёт следующий шаг; «затем» естественно выражает последовательность, а повелительное наклонение соответствует нормам современного русского языка.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: масло для помазания
  rationale: Сопряжённая конструкция буквально обозначает масло, предназначенное для помазания. Этот вариант естественен по-русски и ясно сохраняет обрядовую функцию масла.
- source_word: וְיָצַקְתָּ
  choice: вылей
  rationale: Глагол יצק означает «лить, выливать». Совершенный вид уместен в последовательной обрядовой инструкции.
- source_word: עַל רֹאשׁוֹ
  choice: ему на голову
  rationale: Естественный современный русский порядок слов для значения «на его голову»; местоимение однозначно относится к помазываемому лицу из контекста.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: и помажь его
  rationale: משׁח — обычный глагол со значением «помазывать». Сохранён сам обрядовый термин, а не истолковывающий пересказ вроде «посвяти».
theological_decisions:
- issue: Соотношение выливания масла и помазания
  choice: 'Сохранить оба действия раздельно: «вылей его ему на голову и помажь его».'
  alternative: 'Объединить действия: «помажь его, вылив масло ему на голову».'
  rationale: В еврейском тексте стоят два сочинённых глагола. Раздельная передача сохраняет и физическое действие выливания, и обрядовое действие помазания, не сводя одно к пояснению другого.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная обрядовая формулировка без архаизмов. Форма единственного числа «возьми… вылей… помажь» сохраняет обращение к Моисею.
