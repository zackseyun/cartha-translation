base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: ru
  text: Положи всё это на ладони Аарона и на ладони его сыновей[a] и соверши над ними обряд потрясания[b] перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на ладони Аарона и на ладони его сыновей»; еврейское слово означает именно ладонь, хотя иногда его передают более общим словом «рука».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст употребляет однокоренные глагол и существительное: буквально «потряси их потрясанием». Имеется в виду ритуальное движение жертвенных частей при их представлении Богу.'
    reason: ritual_term
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Положи
  rationale: Форма с союзом продолжает последовательность предписаний и по-русски естественно передаётся повелительным наклонением.
- source_word: הַכֹּל
  choice: всё это
  rationale: Выражение отсылает ко всем частям жертвы, перечисленным в предыдущем контексте.
- source_word: עַל כַּפֵּי
  choice: на ладони
  rationale: כַּף обозначает прежде всего ладонь; конкретный образ ритуального действия сохранён без расширения до общего «руки».
- source_word: אַהֲרֹן
  choice: Аарона
  rationale: Устоявшаяся русская форма имени.
- source_word: בָנָיו
  choice: его сыновей
  rationale: В данном контексте речь именно о сыновьях Аарона, участвующих в посвящении в священники.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: и соверши этими частями обряд потрясания
  rationale: Глагол и однокоренное существительное обозначают ритуальное движение жертвенных частей при представлении Богу. Формулировка сохраняет особый характер действия и избегает неясного для современного читателя буквального повтора «потряси потрясанием».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי передано обычным пространственно-ритуальным «перед», а тетраграмматон — транслитерацией личного имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено личное имя Бога; «Яхве» передаёт наиболее вероятное произношение и не заменяет имя титулом.
- issue: Характер действия נוף / תְּנוּפָה
  choice: обряд потрясания
  alternative: приношение возношения; представление
  rationale: Выбранная передача сохраняет телесно-ритуальный образ текста, не сводя его ни только к поднятию, ни к абстрактному представлению приношения.
translation_notes:
  register: Современный литературный русский язык с достоинством ритуального предписания. Повелительная форма звучит естественно; специальный культовый термин пояснён в сноске. Повтор «на ладони» сохранён вслед за еврейским текстом.
