  text: אֶת הַ/כֶּ֥בֶשׂ הָ/אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: ru
  text: Одного ягнёнка приноси утром, а второго ягнёнка приноси между вечерами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «между вечерами» традиционно понимают как «в сумерках» или как время между поздним послеобеденным часом и заходом солнца.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: ягнёнок
  rationale: В контексте жертвоприношений слово обозначает молодую овцу; «ягнёнок» — естественный и достаточно точный русский эквивалент.
- source_word: הָאֶחָד
  choice: одного
  rationale: Сохраняет буквальное значение «один», не заменяя его словом «первый»; в сочетании со «второго» последовательность остаётся ясной.
- source_word: תַּעֲשֶׂה
  choice: приноси
  rationale: В предписаниях о жертвах глагол עשה означает совершать жертвенное действие, то есть приносить жертву. Форма несовершенного вида естественно передаёт регулярное ежедневное действие.
- source_word: בַבֹּקֶר
  choice: утром
  rationale: Краткая и естественная передача временного выражения.
- source_word: הַשֵּׁנִי
  choice: второго
  rationale: Прямая передача порядкового числительного, сохраняющая последовательность двух ежедневных приношений.
- source_word: בֵּין הָעַרְבָּיִם
  choice: между вечерами
  rationale: Формальная передача традиционного древнееврейского выражения сохраняет его подлинную неоднозначность; более привычные толкования указаны в сноске.
