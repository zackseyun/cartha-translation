- from: И поступи с Аароном и его сыновьями так, во всём следуя Моим повелениям тебе. Семь дней посвящай их на служение[a].
  to: И сделай для Аарона и его сыновей всё так, как Я повелел тебе. Семь дней посвящай их в священники[a].
  rationale: Исправлены направленность действия для Аарона и его сыновей, более прямое соответствие формуле «как Я повелел тебе» и термин для жреческой идиомы. Сохраняются повелительный характер, длительность в семь дней и поясняющая сноска к буквальному образу.
