base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: ru
  text: И сделай для Аарона и его сыновей всё так, как Я повелел тебе. Семь дней посвящай их в священники[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполняй им руки» — древнееврейское выражение, означающее посвящение и введение в священническое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: И поступи
  rationale: В цепи обрядовых предписаний форма выражает повеление; русский императив естественно передаёт директивную силу.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: с Аароном и его сыновьями
  rationale: Предлог ל обозначает лиц, над которыми совершаются предписанные действия; по-русски в данном контексте естественно «поступить с».
- source_word: כָּכָה
  choice: так
  rationale: Указательное наречие отсылает к описанному ранее порядку обряда.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: во всём следуя Моим повелениям тебе
  rationale: Передаёт как соответствие предписаниям, так и охват всего повеленного; формулировка естественна для современного русского языка.
- source_word: שִׁבְעַת יָמִים
  choice: Семь дней
  rationale: Винительный длительности обозначает продолжительность обряда и сохраняет исходный порядок слов.
- source_word: תְּמַלֵּא יָדָם
  choice: посвящай их на служение
  rationale: Священническая идиома буквально означает «наполнять руку» и обозначает введение в священническое служение. «Посвящай их на служение» ясно передаёт обрядовый процесс, не привнося поздней конфессиональной терминологии.
theological_decisions:
- issue: Передача священнической идиомы מלא יד
  choice: посвящай их на служение
  alternative: наполни их руки; введи их в священническое служение
  rationale: Идиома обозначает обрядовое поставление Аарона и его сыновей на священническое служение. Выбранный вариант сохраняет смысл посвящения и длительность семидневного действия, а буквальный образ вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным регистром. Императивы передают предписывающий характер контекста; буквальная, но непрозрачная идиома разъяснена в сноске.
