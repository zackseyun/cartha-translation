  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ru
  text: Затем возьми одного барана[a], и Аарон и его сыновья возложат руки на голову барана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одного барана»; эти слова отличают его от другого барана в обряде посвящения. Возможный перевод: «первого барана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Затем
  rationale: Связка с показателем прямого дополнения вводит очередной этап предписания; «затем» естественно передаёт последовательность действий.
- source_word: הָ/אַיִל
  choice: барана
  rationale: אַיִל означает взрослого самца овцы; «баран» — точный и обычный русский эквивалент в жертвенном контексте.
- source_word: הָ/אֶחָד
  choice: одного
  rationale: Буквально «одного барана»; форма выделяет его среди двух баранов обряда, не обязательно превращая числительное в порядковое «первого».
- source_word: תִּקָּח
  choice: возьми
  rationale: Императивно употреблённый имперфект 2-го лица мужского рода единственного числа естественно передаётся русским повелительным наклонением в прямом обращении к Моисею.
- source_word: וְ/סָמְכוּ
  choice: возложат
  rationale: В жертвенном обряде סמך обозначает ритуальное наложение рук, возможно с нажимом; «возложат руки» — ясное и устойчивое русское выражение.
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: Аарон и его сыновья
  rationale: בנים здесь обозначает сыновей Аарона, посвящаемых вместе с ним на священническое служение.
- source_word: אֶת יְדֵי/הֶם
  choice: руки
  rationale: Сохранено множественное число еврейского יְדֵיהֶם; принадлежность ясно выражена составным подлежащим и не требует тяжеловесного «свои руки».
- source_word: עַל רֹאשׁ
  choice: на голову
  rationale: Прямое и естественное русское выражение пространственного отношения.
- source_word: הָ/אָיִל
  choice: барана
  rationale: Повтор существительного сохранён для ясности и соответствия исходному тексту.
theological_decisions:
- issue: Терминология ритуального наложения рук при посвящении
  choice: возложат руки на голову барана
  alternative: обопрутся руками о голову барана; положат руки на голову барана
  rationale: Глагол סמך может подразумевать опору или нажим, однако в жертвенном законодательстве обозначает установленное ритуальное действие. Перевод не добавляет отсутствующего в стихе объяснения его богословского смысла.
- issue: Значение הָאֶחָד при двух баранах
  choice: одного барана
  alternative: первого барана
  rationale: Сохранено количественно-выделительное значение «одного», тогда как «первого» яснее выражает последовательность, но является контекстуальным истолкованием.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и предписывающим тоном. Повелительное «возьми» естественно передаёт обращённое к Моисею указание; «возложат руки» сохраняет традиционно узнаваемую ритуальную лексику без архаической тяжеловесности.
