base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: ru
  text: Возьми немного крови быка и пальцем нанеси её на роги жертвенника[b], а всю кровь вылей к основанию жертвенника[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вылей у основания жертвенника».'
    reason: lexical_alternative
  - marker: b
    text: Роги — рогообразные выступы по углам жертвенника.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Возьми
  rationale: Перфект с союзом в последовательности предписаний передаёт повеление; русский императив естественно выражает процедурный характер текста.
- source_word: מִדַּם הַפָּר
  choice: немного крови быка
  rationale: 'Предлог מִן имеет здесь партитивное значение: для нанесения берётся часть крови. «Кровь быка» сохраняет исходное определительное отношение и звучит естественно по-русски.'
- source_word: וְנָתַתָּה
  choice: нанеси её
  rationale: נתן буквально значит «дать, положить», но применительно к крови на поверхности жертвенника естественное русское «нанеси» ясно передаёт действие без излишней технической окраски.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: на роги жертвенника
  rationale: Сохранён конкретный культовый термин «роги», обозначающий рогообразные выступы по углам жертвенника.
- source_word: בְּאֶצְבָּעֶךָ
  choice: пальцем
  rationale: Предлог בְּ имеет инструментальное значение; русский творительный падеж точно и естественно передаёт указанное средство действия.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: а всю остальную кровь вылей
  rationale: שׁפך в жертвенном контексте означает «выливать». «Остальную» эксплицирует подразумеваемое противопоставление между взятой частью и всей кровью, которая после этого остаётся.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: к основанию жертвенника
  rationale: אֶל сохраняет направленность («к»), а יְסוֹד обозначает основание или нижнюю опорную часть жертвенника.
theological_decisions:
- issue: Конкретность устройства жертвенника
  choice: Сохранить термины «роги» и «основание»
  alternative: «углы» и «подножие» жертвенника
  rationale: Текст описывает точный обряд посвящения. Конкретные названия частей жертвенника сохраняют ритуальную образность и не подменяют её обобщающим толкованием.
- issue: Соотношение части крови и всей крови
  choice: «немного крови… всю остальную кровь»
  alternative: 'Буквально: «из крови… всю кровь»'
  rationale: Партитивное מִן указывает на взятую часть; «остальную» делает логическую последовательность ясной и не предполагает, что уже нанесённую кровь нужно затем вылить.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным повелительным стилем. Сохранена конкретная культовая терминология; синтаксис сделан естественным для последовательности обрядовых предписаний.
