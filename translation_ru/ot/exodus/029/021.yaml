  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: ru
  text: Возьми часть крови, которая на жертвеннике, и часть масла для помазания и окропи ими Аарона, его одежды, его сыновей и одежды их вместе с ним. Он, его одежды, его сыновья и одежды их вместе с ним будут святы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут освящены». Буквально по-еврейски: «будут святы»; речь идёт о священном статусе, возникшем в результате обряда.'
    reason: Лексическая альтернатива для וְקָדַשׁ и пояснение буквального выражения.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Возьми
  rationale: Перфект qal с союзом в последовательности обрядовых предписаний имеет повелительную силу. Русский императив естественно передаёт прямое указание.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: часть крови, которая на жертвеннике
  rationale: Предлог מִן указывает на взятие некоторого количества из имеющегося; «часть крови» ясно передаёт партитивное значение, а относительное предложение сохраняет структуру еврейского текста.
- source_word: וּמִשֶּׁמֶן הַמִּשְׁחָה
  choice: и часть масла для помазания
  rationale: Повторённый מִן сохраняет партитивный смысл. Выражение «масло для помазания» естественно и точно обозначает назначение масла, не вводя поздней терминологии.
- source_word: וְהִזֵּיתָ
  choice: и окропи ими
  rationale: Hiphil глагола נזה в культовом контексте означает ритуальное кропление. Местоимение множественного числа относится к крови и маслу и устраняет возможную неясность русского единственного числа.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: его одежды / одежды его сынов
  rationale: בגד — общее обозначение одежды. Такой перевод сохраняет предметный смысл и не привносит более узкий поздний термин «облачения».
- source_word: בָּנָיו
  choice: его сынов / его сыны
  rationale: Еврейское слово имеет мужской род и во множественном числе в данном контексте обозначает сыновей Аарона, участвующих в священническом посвящении.
- source_word: אִתּוֹ
  choice: вместе с ним
  rationale: Прямо передаёт связь сыновей и их одежд с Аароном и сохраняет повтор исходного текста.
- source_word: וְקָדַשׁ
  choice: будут святы
  rationale: Глагол קדשׁ описывает итоговый священный статус после окропления. В русском требуется множественное число из-за составного подлежащего; «будут святы» сохраняет ключевую категорию святости, не заменяя её толкованием.
theological_decisions:
- issue: Передача результата обрядового освящения
  choice: будут святы
  alternative: будут освящены / станут посвящёнными
  rationale: Еврейский текст выражает результат через корень קדשׁ и тем самым говорит именно о статусе святости. Формулировка «будут святы» сохраняет категорию самого текста и не сужает её до технического смысла посвящения.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной обрядовой лексикой. Синтаксический параллелизм и повтор «вместе с ним» сохранены, но формы согласованы по нормам русского языка.
