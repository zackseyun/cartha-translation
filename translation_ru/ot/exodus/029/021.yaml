  naturalness: Текст в основном литературный и ясный. Перестановка заключительного перечисления делает связь «с ним» с Аароном более естественной, а повтор «одежды его сыновей» заменён естественным русским «одежды их» без утраты референта.
  terminology: «Жертвенник», «масло для помазания», «окропи» и «святы» соответствуют культовому регистру и не привносят конфессионально специфической терминологии. Сноска уместно сохраняет альтернативу «освящены».
