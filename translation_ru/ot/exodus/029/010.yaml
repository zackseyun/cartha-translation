base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: ru
  text: И приведи быка перед шатром встречи[a]. Аарон и его сыновья пусть возложат руки на голову быка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представь быка перед шатром встречи»; также: «подведи быка к шатру встречи».'
    reason: Лексическая альтернатива для וְהִקְרַבְתָּ; основной текст сохраняет пространственное «перед» для לִפְנֵי.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: И приведи
  rationale: Порода hифиль от קרב означает «приблизить, подвести, представить»; в данном ритуальном контексте естественное русское «приведи» сохраняет конкретное действие и оттенок представления животного.
- source_word: הַפָּר
  choice: быка
  rationale: פַּר обозначает быка, часто молодого быка для жертвоприношения; нейтральное «бык» точно и естественно.
- source_word: לִפְנֵי
  choice: ко входу в
  rationale: Буквально «перед, пред лицом». В сочетании с шатром встречи и глаголом движения речь идёт о приведении животного к месту перед шатром; «ко входу в» ясно передаёт предполагаемое пространственное положение, а буквальный вариант отмечен в сноске.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Устойчивое обозначение святилища; «шатёр» соответствует переносному сооружению, а «встречи» сохраняет связь מועד с назначенной встречей.
- source_word: וְסָמַךְ
  choice: пусть возложат
  rationale: סמך в конструкции с руками и головой жертвенного животного обозначает ритуальное возложение рук. Русское «возложат» естественно для данного регистра и не объясняет символику сверх текста.
- source_word: יְדֵיהֶם
  choice: руки
  rationale: Сохранено множественное число еврейского текста, относящееся к Аарону и его сыновьям.
- source_word: עַל רֹאשׁ הַפָּר
  choice: на голову быка
  rationale: Прямо и естественно передаёт конкретное физическое действие.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Аарон и его сыновья
  rationale: В контексте посвящения в священники בנים означает именно сыновей Аарона.
theological_decisions:
- issue: Смысл возложения рук на жертвенное животное
  choice: пусть возложат руки на голову быка
  alternative: пусть положат руки на голову быка
  rationale: Перевод передаёт сам ритуальный жест, не добавляя отсутствующего в стихе объяснения о переносе вины, отождествлении или ином богословском значении.
translation_notes:
  register: Современный литературный русский с умеренно торжественной ритуальной лексикой. Повелительное «приведи» отражает обращение к Моисею; конструкция «пусть возложат» естественно передаёт последующее предписание в третьем лице. Маркер [a] включён в основной текст.
