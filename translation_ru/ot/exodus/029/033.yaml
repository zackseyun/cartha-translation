  edition: WLC
  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: ru
  text: Пусть они едят то, посредством чего было совершено искупление, чтобы посвятить их на священническое служение[a] и освятить их. Посторонний же не должен есть этого[b], потому что это святыня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнить их руку» — древнееврейское выражение, означающее посвящение или введение в священническое служение.'
    reason: lexical_alternative
  - marker: b
    text: «Посторонний» здесь — тот, кто не допущен к участию в священническом обряде, а не обязательно иноплеменник.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: Пусть они едят то
  rationale: Форма глагола в последовательности ритуальных предписаний выражает повеление; местоимение отсылает к жертвенным частям из предыдущего контекста.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: посредством чего было совершено искупление
  rationale: Предлог ב при пассивной форме כפר обозначает средство совершения искупления. В еврейском тексте этой фразы получатели искупления прямо не названы, поэтому «за них» не добавлено.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: чтобы посвятить их на священническое служение
  rationale: Буквально «наполнить их руку» — устойчивое древнееврейское выражение введения в священническое служение; функциональный перевод передаёт его смысл без привнесения поздней конфессиональной терминологии.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: и освятить их
  rationale: В данном ритуальном контексте קדשׁ означает отделить для святого служения; «освятить» сохраняет сакральный регистр.
- source_word: וְזָר
  choice: Посторонний же
  rationale: זר здесь обозначает человека, не принадлежащего к допущенным участникам священнического обряда, а не обязательно иноплеменника.
- source_word: לֹא יֹאכַל
  choice: не должен есть этого
  rationale: Передан прямой юридико-ритуальный запрет; объект восполнен по контексту.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: потому что это святыня
  rationale: Собирательное русское «это святыня» естественно относится к упомянутой священной пище и сохраняет основание запрета.
theological_decisions:
- issue: Значение כפר в жертвенном контексте
  choice: было совершено искупление
  alternative: было совершено очищение / умилостивление
  rationale: «Искупление» остаётся понятным и ёмким соответствием, не сужая многозначность культового термина до одной богословской модели.
- issue: Передача священнической идиомы מִלֵּא יָד
  choice: посвятить их на священническое служение
  alternative: наполнить их руку / поставить их на служение
  rationale: Перевод раскрывает технический смысл идиомы в непосредственном контексте учреждения священства и не связывает её с устройством какой-либо поздней традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством ритуально-правового текста. Синтаксис сделан ясным для широкого читателя; сакральные термины «искупление», «освятить» и «святыня» сохранены. Подлинная инструментальная неоднозначность אֲשֶׁר כֻּפַּר בָּהֶם передана без добавления отсутствующего в масоретском тексте «за них».
