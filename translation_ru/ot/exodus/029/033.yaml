  verdict: approve
  source_fidelity: Перевод точно передаёт предписывающий характер וְאָכְלוּ, инструментальное значение בָּהֶם в «посредством чего было совершено искупление» и не добавляет отсутствующее в еврейском тексте «за них». Техническая идиома לְמַלֵּא אֶת־יָדָם верно истолкована в контексте поставления священников; запрет для זָר и мотив святости переданы без утраты смысла.
  naturalness: Текст звучит естественно на современном литературном русском, сохраняя подобающий ритуально-правовой регистр. «Пусть они едят», «Посторонний же не должен есть этого» и «потому что это святыня» ясны и связны в контексте жертвенных частей.
  terminology: «Искупление», «освятить» и «святыня» удачно сохраняют сакральную лексику. «Посторонний» не этнизирует культовый термин זָר, а примечание корректно уточняет его значение. Примечание к «посвятить ... на священническое служение» адекватно фиксирует буквальную идиому и её функцию.
