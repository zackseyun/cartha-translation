  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: ru
  text: 'Вот что ты должен сделать для них, чтобы посвятить их на священническое служение Мне: возьми одного быка из стада[a] и двух баранов без изъяна[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одного молодого быка». Буквально по-еврейски: «одного быка, сына крупного скота» — это устойчивое обозначение животного из стада крупного скота.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «без порока».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: вот что
  rationale: В данном контексте דָּבָר вводит последующее предписание. Русское «вот что» естественно и точно передаёт указание на конкретный порядок действий.
- source_word: תַּעֲשֶׂה
  choice: ты должен сделать
  rationale: Имперфект имеет предписывающее значение; эта формулировка ясно выражает обязательность указания и звучит естественно по-русски.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: посвятить их
  rationale: В священническом контексте קדשׁ означает отделение людей для священного служения; «посвятить» передаёт ритуально-служебный смысл без лишней конфессиональной нагрузки.
- source_word: לְכַהֵן לִי
  choice: на священническое служение Мне
  rationale: Глагол כהן обозначает исполнение обязанностей священника. Выбранная формулировка сохраняет и функцию, и направленность служения Богу.
- source_word: לְקַח
  choice: возьми
  rationale: Форма вводит прямое предписание взять требуемых животных; русский императив передаёт её кратко и ясно.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: одного быка из стада
  rationale: Буквально выражение содержит «один бык, сын крупного скота» и идиоматически обозначает быка из стада; возрастной оттенок возможен, но не обязателен, поэтому вынесен в примечание.
- source_word: אֵילִם שְׁנַיִם
  choice: двух баранов
  rationale: Прямой и естественный эквивалент существительного с явным числительным.
- source_word: תְּמִימִם
  choice: без изъяна
  rationale: В контексте жертвенных животных слово указывает на отсутствие физического недостатка; «без изъяна» точно и понятно передаёт культовое требование.
theological_decisions:
- issue: Обозначение священнической функции
  choice: посвятить их на священническое служение Мне
  alternative: освятить их, чтобы они служили Мне как священники
  rationale: Основной вариант естественно выражает назначение на священническое служение и сохраняет его направленность Богу, не добавляя более поздних церковных представлений.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным тоном ритуального предписания. Местоимение «Мне» написано с прописной буквы согласно распространённой русской библейской традиции; синтаксис упрощён без утраты последовательности и смысла еврейского текста.
