lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: Вот что
  rationale: Естественно вводит следующее предписание, передавая указательное значение זֶה и относительную конструкцию אֲשֶׁר без добавления временного «теперь».
- source_word: תַּעֲשֶׂה
  choice: тебе следует приносить
  rationale: Глагол עשה буквально имеет широкое значение «делать», но в контексте жертвенника и названных животных обозначает совершение жертвоприношения; «приносить» естественно передаёт это значение.
- source_word: עַל הַמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Прямое и принятое в русском языке обозначение места принесения жертвы.
- source_word: כְּבָשִׂים
  choice: ягнят
  rationale: כֶּבֶשׂ обозначает ягнёнка или молодого барана; возрастное уточнение поддерживает перевод «ягнята».
- source_word: בְּנֵי שָׁנָה
  choice: годовалых
  rationale: Идиоматический русский эквивалент буквального древнееврейского выражения «сыновья года».
- source_word: שְׁנַיִם
  choice: двух
  rationale: Прямая передача числительного с требуемым русским падежом.
- source_word: לַיּוֹם
  choice: каждый день
  rationale: 'Передаёт распределительное значение: установленное число животных на каждый день.'
- source_word: תָּמִיד
  choice: постоянно
  rationale: В культовом контексте слово обозначает непрерывную регулярность обряда, а не обязательно действие без перерыва.
theological_decisions:
- issue: Характер действия, выраженного תַּעֲשֶׂה
  choice: «приносить» как совершать жертвоприношение
  alternative: «делать на жертвеннике»
  rationale: Контекст ясно относится к жертвоприношению, однако широкое буквальное значение глагола сохранено в примечании, чтобы не скрывать лексическую неоднозначность.
- issue: Значение תָּמִיד
  choice: постоянное регулярное ежедневное приношение
  alternative: непрерывно, без всякого перерыва
  rationale: Сочетание с «каждый день» указывает на постоянно соблюдаемый ежедневный порядок; перевод не должен создавать впечатление непрерывного действия в каждый момент времени.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным регистром. Единственное число «тебе» соответствует древнееврейской форме второго лица. Формулировка сохраняет различие между ежедневной частотой и постоянством установленного обряда.
