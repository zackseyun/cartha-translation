base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: ru
  text: Затем заколи барана, возьми немного его крови и помажь ею мочку[a] правого уха Аарона, мочки правых ушей его сыновей, большие пальцы их правых рук и большие пальцы их правых ног; затем брызни кровью на жертвенник со всех сторон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оконечность (край) правого уха Аарона ... оконечность правых ушей его сыновей». Еврейское слово может обозначать оконечность уха в более широком смысле, хотя в этом ритуальном контексте наиболее вероятно значение «мочка».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «окропи кровью жертвенник со всех сторон». Еврейский глагол подразумевает энергичное ритуальное нанесение крови, а не лёгкое кропление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: заколи
  rationale: В контексте жертвоприношения глагол означает ритуальное заклание; «заколи» точно и естественно передаёт это действие.
- source_word: אַיִל
  choice: баран
  rationale: Обычное и точное русское название указанного жертвенного животного.
- source_word: מִדָּמוֹ
  choice: немного его крови
  rationale: Предлог מִן здесь указывает на часть крови, которую берут для нанесения.
- source_word: תְּנוּךְ אֹזֶן
  choice: мочка уха
  rationale: В данном ритуальном контексте наиболее вероятно имеется в виду мочка уха, хотя еврейское слово может обозначать край или оконечность уха шире.
- source_word: הַיְמָנִית
  choice: правый / правая / правое
  rationale: Прилагательное обозначает правую сторону соответствующей части тела; согласование передано по нормам русского языка.
- source_word: בֹּהֶן יָד
  choice: большой палец руки
  rationale: Для руки בֹּהֶן обозначает большой палец.
- source_word: בֹּהֶן רֶגֶל
  choice: большой палец ноги
  rationale: Для ноги בֹּהֶן обозначает большой палец.
- source_word: זָרַק
  choice: выплесни ... на
  rationale: Глагол обозначает энергичное ритуальное нанесение крови на жертвенник, а не лёгкое окропление; «выплесни» сохраняет силу действия и звучит естественно по-русски.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт распределение крови вокруг жертвенника яснее, чем буквальное «вокруг».
- source_word: וְ
  choice: затем / и / после этого
  rationale: Последовательность форм с waw продвигает ход обряда; русские связки передают процедурную последовательность без тяжеловесного повторения «и».
