  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: ru
  text: Возьми весь жир, покрывающий внутренности, придаток при печени[a], обе почки и жир на них и сожги всё это на жертвеннике.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долю печени». Еврейское слово обозначает особую часть, связанную с печенью, но её точное анатомическое соответствие неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: возьми
  rationale: Перфект Qal с союзом в последовательности предписаний имеет повелительное значение; русская форма повелительного наклонения естественно передаёт прямое ритуальное указание.
- source_word: כָּל הַחֵלֶב
  choice: весь жир
  rationale: חֵלֶב обозначает предназначенные для сожжения жировые части жертвенного животного; «жир» — ясный и общепонятный русский эквивалент.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: покрывающий внутренности
  rationale: קֶרֶב здесь относится к внутренним органам или внутренней полости животного; «внутренности» точно и естественно звучит в данном контексте.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: придаток при печени[a]
  rationale: יוֹתֶרֶת — трудный анатомический термин, обозначающий часть, связанную с печенью. «Придаток» не навязывает слишком точного современного анатомического отождествления, а «при печени» естественно передаёт עַל в этом сочетании.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: обе почки
  rationale: Прямое анатомическое обозначение; «обе» по-русски естественнее, чем «две», поскольку речь идёт о парном органе.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: жир на них
  rationale: Буквально и ясно передаёт жир, находящийся на почках.
- source_word: וְהִקְטַרְתָּ
  choice: и сожги всё это
  rationale: Hiphil глагола קטר в жертвенном контексте означает сжечь на жертвеннике как приношение. «Всё это» ясно указывает на совокупность перечисленных частей.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс указывает на помещение перечисленных частей на жертвенник; русский предложный оборот естественно передаёт это значение.
