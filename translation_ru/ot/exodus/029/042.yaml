source:
  edition: WLC
  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: ru
  text: Это будет постоянное всесожжение[a] из поколения в поколение у входа в шатёр встречи, перед Яхве, где Я буду встречаться с вами, чтобы говорить там с тобой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непрестанное всесожжение»; речь идёт о всесожжении, которое надлежало приносить регулярно.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте сначала стоит множественное число («с вами»), а затем единственное («с тобой»), вероятно, отличающее более широкую группу от Моисея, к которому Бог обращается непосредственно.
    reason: source_ambiguity
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: постоянное всесожжение
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; תָּמִיד указывает на её неизменно регулярное совершение. «Постоянное» сохраняет идею предписанной непрерывности, не подразумевая, что действие буквально не прекращается ни на миг.
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Естественная современная русская идиома, передающая действие установления на протяжении последовательных поколений.
- source_word: פֶּתַח
  choice: у входа
  rationale: Передаёт пространственное значение «у входа, у отверстия» и естественно сочетается с обозначением шатра.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт и предметное значение אֹהֶל («шатёр»), и функцию назначенной встречи, выраженную מוֹעֵד, без архаизации.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי в данном культовом и пространственном контексте означает «перед, в присутствии», а личное имя יהוה передано как «Яхве».
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: где Я буду встречаться с вами
  rationale: Нифаль глагола יעד выражает встречу в назначенном месте. «Где» естественно включает пространственное значение שָׁמָּה, а множественное לָכֶם сохранено формой «с вами».
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: чтобы говорить там с тобой
  rationale: Инфинитив передаёт цель встречи. Единственное число אֵלֶיךָ сохранено в «с тобой», а שָׁם явно передано словом «там».
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Смена числа местоимения внутри стиха
  choice: сохранить множественное «с вами» и единственное «с тобой»
  alternative: согласовать обе формы либо во множественном, либо в единственном числе
  rationale: В источнике לָכֶם имеет множественное число, тогда как אֵלֶיךָ — единственное. Перевод сохраняет эту грамматическую и смысловую смену, не устраняя возможное различие между более широкой группой и Моисеем как непосредственным адресатом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Избегаются архаичные формы «скиния собрания» и «в роды ваши»; при этом сохранены культовый термин «всесожжение», личное имя «Яхве» и значимая смена числа местоимений.
