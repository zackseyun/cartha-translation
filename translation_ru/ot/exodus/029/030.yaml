base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: ru
  text: Семь дней их будет носить священник из числа его сыновей, который займёт его место и будет входить в шатёр встречи, чтобы служить в святом месте[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет надевать их». Еврейский глагол может означать как надевание одежды, так и её ношение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «священник на его месте из его сыновей», то есть тот из сыновей, кто станет его преемником.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в святилище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Семь дней
  rationale: Винительный длительности естественно передаётся по-русски без предлога и обозначает весь период ношения одежд.
- source_word: יִלְבָּשָׁם
  choice: их будет носить
  rationale: Глагол לבש допускает значения «надевать» и «носить». При указании длительности «семь дней» значение «носить» наиболее естественно; местоимение относится к священным одеждам из предыдущего контекста.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  choice: тот священник из его сыновей, который займёт его место
  rationale: Оборот תַּחְתָּיו буквально указывает на пребывание «вместо него / на его месте», а контекст говорит о преемстве священника из числа его сыновей.
- source_word: אֲשֶׁר יָבֹא
  choice: когда войдёт
  rationale: Формально относительный оборот в данном контексте естественно выражает обстоятельство, при котором преемник носит одежды для служения.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт название переносного святилища ясно и близко к составным значениям еврейского выражения.
- source_word: לְשָׁרֵת
  choice: чтобы служить
  rationale: Глагол обозначает исполнение установленного священнического служения; простое «служить» звучит по-русски естественно и сохраняет культовый контекст.
- source_word: בַּקֹּדֶשׁ
  choice: в святом месте
  rationale: Сохраняет конкретную пространственную отсылку к священной области шатра, не исключая более общего понимания как святилища.
theological_decisions:
- issue: Язык священнического преемства
  choice: тот священник из его сыновей, который займёт его место
  alternative: священник вместо него из его сыновей
  rationale: Формулировка ясно передаёт преемство внутри рода, не добавляя позднейших представлений о порядке передачи должности.
- issue: Значение культового места בַּקֹּדֶשׁ
  choice: в святом месте
  alternative: в святилище
  rationale: Основной текст сохраняет буквальный образ святого места; допустимый более цельный культовый термин вынесен в примечание, поскольку еврейское слово допускает оба способа понимания.
translation_notes:
  register: Современный литературный русский язык с ясной, умеренно торжественной библейской интонацией. Выражение «шатёр встречи» предпочтено архаичному «скиния собрания»; структура стиха сделана естественной для русского синтаксиса без устранения смысловых вариантов оригинала.
