- source_word: וְזָרַקְתָּ
  choice: окропи
  rationale: В контексте жертвоприношения זרק означает нанесение крови на жертвенник броском или разбрызгиванием; русское «окропи» естественно передаёт ритуальное действие, не подразумевая простого выливания.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: жертвенник со всех сторон
  rationale: 'Сохраняет пространственный смысл: кровь наносится вокруг жертвенника, на все его стороны.'
