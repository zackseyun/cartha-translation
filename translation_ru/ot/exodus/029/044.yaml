  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: ru
  text: И Я освящу Шатёр встречи и жертвенник[a], и освящу Аарона и его сыновей, чтобы они служили Мне как священники[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящу»; также возможно: «сделаю святыми». То же слово употреблено далее об Аароне и его сыновьях.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для священнического служения Мне»; или: «чтобы они были священниками Мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: освящу
  rationale: В породе пиэль глагол קדשׁ означает отделить как святое, посвятить для священного употребления. «Освящу» естественно передаёт культовый смысл и сохраняет повтор глагола в обеих частях стиха.
- source_word: אֹהֶל מוֹעֵד
  choice: Шатёр встречи
  rationale: Передаёт шатёр как место назначенной встречи Бога с народом; формулировка понятна современному русскому читателю и не сводит מוֹעֵד только к собранию людей.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычное и точное русское обозначение культового сооружения для принесения жертв.
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Традиционная русская форма личного имени.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Еврейский текст прямо говорит о сыновьях Аарона; родовое значение не обобщается до «детей».
- source_word: לְכַהֵן לִי
  choice: чтобы они служили Мне священниками
  rationale: Глагол כהן обозначает исполнение священнического служения, а לִי указывает, кому оно совершается. Русская формулировка естественна и сохраняет оба смысловых компонента.
theological_decisions:
- issue: Передача культовой святости
  choice: освящу
  alternative: посвящу; сделаю святыми
  rationale: Контекст говорит об отделении священного пространства, предмета и людей для служения Богу. «Освящу» сохраняет язык святости, не уточняя способ освящения сверх сказанного в тексте.
- issue: Обозначение священнической линии
  choice: его сыновей
  alternative: его детей
  rationale: Мужской род выражен в исходном тексте и существенен для непосредственного контекста учреждения священства.
- issue: Отношение священнического служения к Богу
  choice: служили Мне священниками
  alternative: священнодействовали для Меня; были Моими священниками
  rationale: Выбранный вариант сохраняет как деятельный смысл כהן, так и личную направленность לִי, не превращая служение лишь в обозначение статуса.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «освящу» сохранён в соответствии с еврейским текстом. Прописные буквы в «Шатёр встречи» отмечают устойчивое название святилища; «Мне» оформлено по принятой русской благоговейной традиции.
