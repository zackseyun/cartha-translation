    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: пресный хлеб
  rationale: Естественное русское обозначение хлеба без закваски, сохраняющее ритуальную специфику текста.
- source_word: חַלֹּת מַצֹּת
  choice: пресные лепёшки
  rationale: חַלָּה обозначает хлебное изделие, часто круглое; «лепёшки» естественно по-русски и отличает их от общего «хлеба», хотя возможен перевод «пресные хлебы».
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: замешанные на масле
  rationale: В кулинарном контексте передаёт смешивание теста с маслом естественнее буквального «смешанные с маслом».
- source_word: רְקִיקֵי מַצּוֹת
  choice: пресные тонкие лепёшки
  rationale: רָקִיק — тонкое хлебное изделие; перевод сохраняет отличие от более плотных חַלּוֹת и избегает современного кондитерского оттенка слова «вафли».
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: помазанные маслом
  rationale: Сохраняет обычное значение глагола משׁח и его лексическую связь с помазанием; в данном контексте речь идёт о нанесении масла на лепёшки.
- source_word: סֹלֶת חִטִּים
  choice: пшеничная мука тонкого помола
  rationale: Передаёт и вид зерна, и качество тщательно размолотой муки ясным современным русским выражением.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: сделай их
  rationale: Императивная передача наставительного имперфекта естественна в русском законодательном контексте и согласуется с обращением к одному адресату.
