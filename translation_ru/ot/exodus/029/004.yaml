base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: ru
  text: Подведи[a] Аарона и его сыновей ко входу в шатёр встречи и омой их водой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представь». Еврейский глагол может иметь формально-обрядовый смысл: представить кого-либо для совершения священного действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: подведи
  rationale: Каузативная форма глагола קרב означает «приблизить, подвести», а в обрядовом контексте может означать также «представить». «Подведи» естественно передаёт движение к назначенному месту и сохраняет оттенок приближения, не устраняя возможного культового смысла.
- source_word: אֶל
  choice: ко
  rationale: Предлог обозначает движение к месту назначения; перед словом «вход» форма «ко» естественна в современном русском языке.
- source_word: פֶּתַח
  choice: вход
  rationale: Слово обозначает отверстие или вход и не обязательно предполагает наличие двери.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт назначение священного шатра как установленного места встречи и остаётся понятным современному читателю; традиционное «скиния собрания» менее прозрачно и может создавать иной смысловой оттенок.
- source_word: וְרָחַצְתָּ
  choice: и омой
  rationale: В последовательности обрядовых предписаний форма передаёт прямое указание. «Омой» звучит естественно и достойно в контексте ритуального омовения.
- source_word: בַּמָּיִם
  choice: водой
  rationale: Предлог ב здесь естественно понимать как указание на средство омовения; русский творительный падеж ясно передаёт этот смысл.
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Общепринятая русская форма библейского имени.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Слово обозначает сыновей мужского пола, что существенно в контексте посвящения Аарона и его сыновей в священники.
theological_decisions:
- issue: Культовый оттенок глагола קרב при посвящении священников
  choice: подведи Аарона и его сыновей
  alternative: представь Аарона и его сыновей
  rationale: Основной текст сохраняет образ приближения ко входу в священный шатёр, а примечание отмечает возможный формально-обрядовый смысл «представить», не делая его единственным толкованием.
translation_notes:
  register: Современный литературный русский язык с ясной повелительной формой, соответствующей последовательности обрядовых указаний. Выражение «шатёр встречи» выбрано вместо менее понятного современному читателю традиционного термина «скиния собрания».
