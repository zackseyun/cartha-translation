base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: ru
  text: Затем возьми одежды и облачи Аарона в хитон, верхнюю одежду эфода, эфод и нагрудник[a]. Закрепи на нём эфод искусно вытканным поясом эфода[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает особое нагрудное изделие, связанное с эфодом; традиционный перевод — «наперсник». Речь не идёт о защитном доспехе.
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол встречается редко и может означать закрепить эфод на Аароне или препоясать его эфодом.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הַבְּגָדִים
  choice: священные одежды
  rationale: В данном контексте общее слово «одежды» обозначает уже описанное священническое облачение; добавление «священные» естественно уточняет контекст, не прибегая к поздней церковной терминологии.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: облачи Аарона
  rationale: Каузативная форма глагола לבש означает «надеть на кого-либо, облечь». «Облачи» сохраняет торжественный характер наставления и ясно выражает действие над Аароном.
- source_word: הַכֻּתֹּנֶת
  choice: хитон
  rationale: כֻּתֹּנֶת — основная длинная одежда, носившаяся ближе к телу; «хитон» является точным и узнаваемым русским термином в древнебиблейском контексте.
- source_word: מְעִיל הָאֵפֹד
  choice: верхняя одежда эфода
  rationale: Конструктивное сочетание буквально называет верхнюю одежду, связанную с эфодом. Такой перевод понятнее современному читателю, чем традиционное «риза», и не уточняет сверх текста способ её ношения.
- source_word: הָאֵפֹד
  choice: эфод
  rationale: Это специальное название священнического облачения, не имеющее точного русского соответствия; сохранена традиционная транслитерация.
- source_word: הַחֹשֶׁן
  choice: нагрудник
  rationale: חֹשֶׁן обозначает особое изделие, носимое на груди и прикреплённое к эфоду. «Нагрудник» передаёт место и функцию предмета, не создавая ошибочной ассоциации с воинскими доспехами.
- source_word: וְאָפַדְתָּ לוֹ
  choice: закрепи на нём эфод
  rationale: Редкий глагол אפד связан с надеванием, препоясыванием или закреплением эфода. В русском явно назван подразумеваемый предмет «эфод», чтобы избежать двусмысленного местоимения.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: его искусно вытканным поясом
  rationale: חֵשֶׁב здесь обозначает искусно изготовленную тканую перевязь или пояс, составляющий часть эфода. Местоимение «его» естественно показывает принадлежность поясу к эфоду.
