base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: ru
  text: И возьми их из их рук и сожги на жертвеннике поверх всесожжения — в приятное благоухание перед Яхве. Это жертва, приносимая огнём, для Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огненная жертва Яхве»; также: «жертва, совершаемая огнём для Яхве».'
    reason: Лексическая альтернатива для אִשֶּׁה — специального жертвенного термина, традиционно связываемого с принесением посредством огня.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: И возьми
  rationale: Перфект с союзом в последовательности предписаний передаёт очередное повеление; русская форма повелительного наклонения естественна и сохраняет процедурную связь.
- source_word: אֹתָם מִיָּדָם
  choice: это из их рук
  rationale: Местоимение множественного числа относится к ранее названным частям жертвы; в русском собирательное «это» естественнее, чем неоднозначное «их», при сохранении конкретного выражения «из их рук».
- source_word: וְהִקְטַרְתָּ
  choice: сожги
  rationale: Hiphil от קטר в жертвенном контексте означает сжечь на жертвеннике, вознося дым; «сожги» ясно передаёт ритуальное действие без излишне технической формулировки.
- source_word: הַמִּזְבֵּחָה
  choice: на жертвеннике
  rationale: Направительный суффикс при данном глаголе указывает на помещение жертвы на жертвенник; по-русски требуется предложная конструкция.
- source_word: עַל הָעֹלָה
  choice: поверх всесожжения
  rationale: עַל обозначает расположение сверху, а עֹלָה — жертву, целиком сжигаемую на жертвеннике; традиционный и точный термин «всесожжение» уместен в литературном библейском регистре.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: как благоухание, приятное
  rationale: Устойчивое жертвенное выражение говорит не только о запахе, но и о благоприятном принятии; формулировка сохраняет образ и его оценочный оттенок.
- source_word: לִפְנֵי יְהוָה
  choice: Яхве
  rationale: Предлог буквально означает «перед, в присутствии»; в русской фразе «приятное Яхве» естественно выражает того, кому благоухание угодно, не меняя смысла. Имя יהוה передано как «Яхве».
- source_word: אִשֶּׁה הוּא לַיהוָה
  choice: Это огненная жертва Яхве
  rationale: אִשֶּׁה — специальный жертвенный термин, связанный с принесением посредством огня. «Огненная жертва» кратко сохраняет эту связь; дательный «Яхве» передаёт посвящение и направленность.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение жертвенного термина אִשֶּׁה
  choice: огненная жертва
  alternative: пища Яхве / жертва, приносимая в огне
  rationale: Этимология и точный оттенок термина обсуждаются. Контекст явно включает сожжение на жертвеннике, поэтому «огненная жертва» сохраняет наиболее очевидную связь с огнём, не вводя прямо пищевую метафору, отсутствующую в этой строке.
- issue: Передача לִפְנֵי в формуле благоухания
  choice: приятное Яхве
  alternative: перед Яхве
  rationale: Буквальное «перед Яхве» возможно, однако по-русски при словах «приятное благоухание» дательный естественно передаёт адресата Божьего благоволения. Пространственно-реляционный оттенок не является здесь самостоятельным богословским утверждением.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. «Всесожжение» сохранено как точный и широко узнаваемый библейский термин; синтаксис сделан ясным и повелительным, без архаизмов вроде «возьми оное» или «воскури».
