  text: И подведи его сыновей, и одень их в хитоны[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представь его сыновей». Еврейский глагол может означать выведение человека вперёд для ритуального представления.'
