lexical_decisions:
- source_word: וְאֶת
  choice: И
  rationale: Союз вводит следующую согласованную по форме заповедь; показатель прямого дополнения отдельно не переводится.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Существительное обозначает именно сыновей Аарона, а не детей вообще.
- source_word: תַּקְרִיב
  choice: подведи
  rationale: Порода hифиль глагола קרב означает «приблизить, подвести, представить». «Подведи» естественно по-русски передаёт движение вперёд, сохраняя возможный ритуальный оттенок; вариант «представь» указан в сноске.
- source_word: וְהִלְבַּשְׁתָּם
  choice: и одень их
  rationale: Форма означает «одеть их»; выбран современный и ясный русский глагол, уместный для ритуального облачения.
- source_word: כֻּתֳּנֹת
  choice: в хитоны
  rationale: כֻּתֹּנֶת — нательная одежда типа длинной рубахи. Традиционный термин «хитон» здесь точнее, чем «риза» или «верхняя одежда», и сохраняет различие между предметами священнического облачения.
theological_decisions:
- issue: Ритуальный смысл תַּקְרִיב
  choice: В основном тексте передано как «подведи», без уточнения места или адресата приближения.
  alternative: «представь»
  rationale: Контекст посвящения священников допускает ритуальное представление, однако сам стих не называет того, перед кем или к чему их подводят. Перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с кратким, торжественным повелительным строем. «Хитоны» — понятный библейский термин, передающий конкретный вид одежды без искусственного уточнения материала, которого в данном стихе нет.
