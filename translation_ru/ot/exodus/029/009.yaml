base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: ru
  text: И опояшь их поясами — Аарона и его сыновей — и повяжешь им головные уборы. Священство будет принадлежать им как вечное установление. Так посвятишь Аарона и его сыновей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнишь руку Аарона и руку его сыновей» — древнееврейский оборот, означающий посвящение и введение в священническое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: опояшь их поясами
  rationale: Глагол חגר с существительным אַבְנֵט обозначает надевание и закрепление священнического пояса. «Опояшь их поясами» естественно для возвышенного современного русского языка и сохраняет конкретный образ действия.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Аарона и его сыновей
  rationale: Приложение уточняет, к кому относится местоимение «их»; тире ясно передают это уточнение по-русски.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: повяжешь им головные уборы
  rationale: חבש указывает на повязывание или закрепление на голове, а מִגְבָּעוֹת — на головные уборы рядовых священников, отличные от головного убора первосвященника. Нейтральное «головные уборы» не вносит неподтверждённой конкретизации формы.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: Священство будет принадлежать им
  rationale: Передаёт конструкцию принадлежности с היה и לָהֶם ясно и без добавочного толкования.
- source_word: לְחֻקַּת עוֹלָם
  choice: по вечному установлению
  rationale: חֻקָּה означает обязательное установление, а עוֹלָם — неограниченную, постоянную длительность в рамках данного установления. Традиционно понятное «вечное установление» сохраняет силу исходной формулы, не разъясняя её богословские пределы внутри текста.
- source_word: וּמִלֵּאתָ יַד
  choice: посвятишь
  rationale: Буквально «наполнишь руку» — устойчивый древнееврейский оборот введения в священническое служение. «Посвятишь» понятно современному читателю, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Длительность в формуле לְחֻקַּת עוֹלָם
  choice: по вечному установлению
  alternative: по постоянному установлению
  rationale: Перевод сохраняет сильное временное значение עוֹלָם и юридико-культовый характер חֻקָּה, не решая в самом тексте вопрос о богословских границах действия установления.
- issue: Священнический идиоматический оборот וּמִלֵּאתָ יַד
  choice: посвятишь Аарона и его сыновей
  alternative: наполнишь руку Аарона и руку его сыновей
  rationale: Функциональный перевод делает смысл обряда понятным, тогда как сноска сохраняет буквальную форму значимого культового оборота.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность предписаний; архаизмы ограничены формами будущего времени «опояшь», «повяжешь», которые остаются понятными и уместными. Маркер сноски поставлен непосредственно после переводного эквивалента идиомы.
