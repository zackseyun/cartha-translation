  terminology: «Пояса», «головные уборы», «священство» и «посвятишь» уместны. «Вечное установление» сохраняет юридико-культовую формулу חֻקַּת עוֹלָם, не навязывая конфессионального истолкования её временного объёма. Сноска корректно сохраняет образ «наполнить руку» и его технический смысл.
