  source_fidelity: В целом перевод точно передаёт последовательность предписаний, уточняющее приложение «Аарона и его сыновей», головные уборы и культовый идиоматический глагол וּמִלֵּאתָ יַד. «Посвятишь» — допустимый функциональный перевод идиомы при наличии буквальной сноски. Формулу לְחֻקַּת עוֹלָם лучше передать так, чтобы «вечное установление» характеризовало само положение о священстве, а не звучало как основание, по которому оно принадлежит им.
