  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: ru
  text: Освяти грудную часть приношения потрясания и бедро приношения возношения[a], которые были потрясены и подняты, — части барана посвящения[b] из того, что предназначено Аарону, и из того, что предназначено его сыновьям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедро священного дара»; буквально — «бедро возношения».'
    reason: Лексическая альтернатива для תְּרוּמָה, которое может обозначать отделённый дар и связано здесь с действием вознесения.
  - marker: b
    text: 'Буквально: «баран наполнения»; это выражение обозначает барана, использовавшегося при посвящении священников.'
    reason: Культурно-языковое пояснение еврейской идиомы אֵיל הַמִּלֻּאִים.
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: освяти
  rationale: Порода piel глагола קדשׁ означает отделить как святыню. «Освяти» естественно передаёт предписывающее значение формы с вау и сохраняет культовый смысл.
- source_word: חֲזֵה
  choice: грудина
  rationale: В жертвенном законодательстве обозначает грудную часть туши; «грудина» точнее анатомического «грудь».
- source_word: תְּנוּפָה
  choice: приношение потрясания
  rationale: Передаёт техническое название обряда и сохраняет связь с однокоренным глаголом הוּנַף — «были потрясены».
- source_word: שׁוֹק
  choice: бедро
  rationale: Обозначает часть задней ноги животного; «бедро» точнее более общего «нога».
- source_word: תְּרוּמָה
  choice: приношение возношения
  rationale: Передаёт отделённый и вознесённый дар как культовое приношение, сохраняя связь с глаголом הוּרָם и избегая архаичного либо неясного термина.
- source_word: הוּנַף וַאֲשֶׁר הוּרָם
  choice: были потрясены и вознесены
  rationale: Пассивные формы сохранены; два различных ритуальных действия переданы раздельно и в соответствии с техническими существительными.
- source_word: אֵיל הַמִּלֻּאִים
  choice: баран посвящения
  rationale: Устойчивое выражение обозначает барана, используемого при посвящении священников; буквальный образ поясняется в сноске.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: из того, что предназначено Аарону, и из того, что предназначено его сыновьям
  rationale: Сохраняет повтор относительной конструкции и различение долей Аарона и его сыновей, не усиливая значение до абсолютной собственности.
theological_decisions:
- issue: Передача технических терминов жертвенного обряда
  choice: Сохранены конкретные выражения «приношение потрясания», «приношение возношения», «были потрясены» и «вознесены».
  alternative: Обобщить как «представляемое приношение», «священный дар» или «посвящённые части».
  rationale: В еврейском тексте намеренно соотнесены названия приношений и ритуальные действия. Их сохранение делает перевод прозрачным и не подменяет предписание позднейшим богословским толкованием.
- issue: Значение выражения אֵיל הַמִּלֻּאִים
  choice: «баран посвящения» с буквальным пояснением в сноске
  alternative: «баран наполнения» или «баран поставления»
  rationale: Идиома относится к введению священников в служение. Основной текст передаёт функцию обряда, а сноска сохраняет доступ к буквальному образу.
translation_notes:
  register: Современный литературный русский с достойным, понятным регистром. Сохранена терминологическая симметрия культового предписания; повтор «из того, что предназначено» отражает еврейскую конструкцию. Тире помогает связать уточнение с обеими названными частями барана.
