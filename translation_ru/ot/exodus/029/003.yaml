  text: וְ/נָתַתָּ֤ אוֹתָ/ם֙ עַל סַ֣ל אֶחָ֔ד וְ/הִקְרַבְתָּ֥ אֹתָ֖/ם בַּ/סָּ֑ל וְ/אֶ֨ת הַ/פָּ֔ר וְ/אֵ֖ת שְׁנֵ֥י הָ/אֵילִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: ru
  text: Положи их в одну корзину[a] и принеси их в корзине[b] вместе с быком и двумя баранами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на одну корзину»; в данном контексте речь идёт о помещении изделий в корзину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «представь их». Еврейский глагол — обычный обрядовый термин со значением «приблизить, принести, представить как приношение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Положи
  rationale: Глагол נתן означает «дать, положить, поместить»; в данной обрядовой инструкции естественно повелительное «положи».
- source_word: אוֹתָם
  choice: их
  rationale: Местоимение указывает на хлебные приношения, перечисленные в предыдущем стихе.
- source_word: עַל סַל אֶחָד
  choice: в одну корзину
  rationale: Хотя עַל буквально часто означает «на», при помещении предметов в ёмкость русский язык требует естественного «в»; אֶחָד передано как «одну».
- source_word: וְהִקְרַבְתָּ
  choice: и принеси
  rationale: В породе hifil глагол קרב буквально выражает приближение и в культовом контексте может означать «принести, представить, поднести как приношение». «Принеси» сохраняет здесь действие без преждевременного уточнения способа жертвоприношения.
- source_word: בַּסָּל
  choice: в корзине
  rationale: Предлог ב указывает, что перечисленные хлебные изделия следует принести, не вынимая из корзины.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: вместе с быком и двумя баранами
  rationale: Повторённые показатели прямого дополнения вводят дополнительные объекты того же действия; «вместе с» ясно и естественно передаёт их координацию по-русски.
- source_word: הַפָּר
  choice: быком
  rationale: פַּר обозначает быка; определённость в русском контексте передаётся формой существительного без артикля.
- source_word: שְׁנֵי הָאֵילִם
  choice: двумя баранами
  rationale: Сочетание числительного в сопряжённой форме с определённым существительным означает «два барана»; творительный падеж обусловлен конструкцией «вместе с».
theological_decisions:
- issue: Культовое значение וְהִקְרַבְתָּ
  choice: принеси
  alternative: подведи; представь; принеси в жертву
  rationale: Выбрано слово, сохраняющее культовый оттенок «приблизить/представить перед Богом», но не утверждающее, что хлеб и животные уже на этом этапе непосредственно приносятся в жертву.
translation_notes:
  register: Современный литературный русский язык; краткая форма повеления соответствует стилю обрядовых предписаний. Сохранены последовательность действий и отличие между нахождением хлебных изделий в корзине и совместным приведением животных.
