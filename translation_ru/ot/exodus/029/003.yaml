  source_fidelity: 'Текст точно передаёт последовательность еврейского предписания: хлебные изделия помещаются в одну корзину, затем они приносятся в корзине вместе с быком и двумя баранами. «В одну корзину» — оправданная идиоматическая передача עַל־סַל אֶחָד в данном контексте; «в корзине» верно отражает בַּסָּל. «Принеси» уместно передаёт וְהִקְרַבְתָּ, не утверждая преждевременно совершение жертвы.'
