  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: ru
  text: Если же от мяса жертвы посвящения[a] или от хлеба что-нибудь останется до утра, то сожги оставшееся в огне. Его нельзя есть, потому что оно свято.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы поставления на священство». Еврейское слово обозначает обряд введения священников в служение.'
    reason: Лексическая альтернатива для специального культового термина הַמִּלֻּאִים.
lexical_decisions:
- source_word: יִוָּתֵר
  choice: останется
  rationale: Нифаль глагола יתר обозначает то, что остаётся или оказывается оставшимся; «останется» естественно передаёт условную конструкцию.
- source_word: בְּשַׂר
  choice: мясо
  rationale: В жертвенном контексте современное русское «мясо» точно и естественно передаёт конкретное значение еврейского слова; «плоть» здесь звучала бы менее обычно.
- source_word: הַמִּלֻּאִים
  choice: жертва посвящения
  rationale: В Исходе 29 термин относится к обряду поставления священников. Слово «жертва» восполняется из контекста, поскольку речь идёт о мясе, использованном при этом обряде.
- source_word: לֶּחֶם
  choice: хлеб
  rationale: Прямое и естественное соответствие.
- source_word: עַד הַבֹּקֶר
  choice: до утра
  rationale: Сохраняет временную границу, выраженную предлогом עַד.
- source_word: וְשָׂרַפְתָּ
  choice: то сожги
  rationale: Форма продолжает условно-следственную конструкцию; «то» ясно обозначает следствие, а повелительное «сожги» передаёт обращение во втором лице единственного числа.
- source_word: הַנּוֹתָר
  choice: оставшееся
  rationale: Субстантивированное причастие от того же корня יתר лаконично обозначает всё, что осталось.
- source_word: בָּאֵשׁ
  choice: в огне
  rationale: Естественное русское выражение для уничтожения остатков посредством огня.
- source_word: לֹא יֵאָכֵל
  choice: его нельзя есть
  rationale: Безличная конструкция естественно передаёт пассивный запрет и сохраняет нормативную силу текста.
- source_word: קֹדֶשׁ
  choice: свято
  rationale: Стандартно передаёт культовую отделённость и священный статус оставшегося.
theological_decisions:
- issue: Передача культового термина הַמִּלֻּאִים в контексте поставления священников
  choice: жертва посвящения
  alternative: жертва поставления на священство
  rationale: Термин обозначает обряд введения Аарона и его сыновей в священническое служение. Основной вариант краток и понятен, а сноска сохраняет более конкретное значение поставления на должность.
translation_notes:
  register: Современный литературный русский язык с ясным нормативным звучанием. Единственное число в повелении сохранено; специальный культовый термин разъяснён в сноске без привнесения конфессиональной терминологии.
