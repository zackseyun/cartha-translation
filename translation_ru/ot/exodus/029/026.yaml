base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: ru
  text: И возьми грудь барана посвящения[a], который предназначен для Аарона, и соверши над ней обряд потрясания[b] перед Яхве; она будет твоей долей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «барана поставления». Еврейский технический термин обозначает барана, использованного в обряде введения священника в служение.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение обозначает ритуальное движение приношения перед Яхве; традиционно его также передают как «обряд возношения». Точная траектория движения из самого термина не вполне ясна.
    reason: ritual_term_clarification
lexical_decisions:
- source_word: הֶחָזֶה
  choice: грудь
  rationale: В контексте жертвоприношения обозначает определённую грудную часть туши, выделяемую по священническому установлению.
- source_word: אֵיל הַמִּלֻּאִים
  choice: баран посвящения
  rationale: אַיִל — баран; הַמִּלֻּאִים — технический термин обряда введения в священническое служение. «Посвящение» естественно и понятно по-русски, не привнося более поздних церковных институтов.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: который предназначен для Аарона
  rationale: Передаёт связь барана с Аароном, не истолковывая конструкцию как право собственности.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: соверши ею обряд возношения
  rationale: Глагол и однокоренное существительное образуют устойчивое ритуальное выражение. Формулировка сохраняет культовый характер действия и избегает неестественного русского повтора.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי в культовом контексте естественно передаётся как «перед», а личное имя יהוה — как «Яхве».
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: она будет твоей долей
  rationale: מָנָה означает назначенную долю или часть; русский вариант краток и точно соответствует контексту распределения жертвы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Значение הַמִּלֻּאִים в обряде введения Аарона в служение
  choice: посвящение
  alternative: поставление; рукоположение; букв. наполнения
  rationale: «Посвящение» передаёт ритуальное введение в священническое служение, оставаясь понятным и не связывая текст с более поздней конфессиональной практикой.
- issue: Характер действия תנופה
  choice: обряд возношения
  alternative: обряд потрясания; приношение, которым размахивают
  rationale: Еврейское выражение обозначает особое представительное движение жертвенной части перед Яхве, но точная траектория движения из самого термина не вполне ясна; поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Сохранена последовательность предписаний; культовые термины переданы понятно, а их существенные альтернативы и неоднозначность вынесены в сноски.
