  yaml_path: translation/ot/exodus/006/021.yaml
  text: 'And the sons of Izhar: Korah, Nepheg, and Zichri.'
translation:
  language: ru
  text: 'Сыновья Ицгара: Корей, Нефег и Зихри.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Сыновья
  rationale: בְּנֵי — сопряжённая форма множественного числа слова «сын»; здесь далее названы трое непосредственных сыновей. Начальный ו продолжает генеалогический перечень, но в русском отдельном стихе естественно не требует обязательного «и».
- source_word: יִצְהָר
  choice: Ицгар
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей еврейскому יִצְהָר.
- source_word: קֹרַח
  choice: Корей
  rationale: Личное имя передано в традиционной и узнаваемой русской библейской форме.
- source_word: וָ/נֶפֶג
  choice: Нефег
  rationale: Личное имя транслитерировано близко к еврейскому звучанию; союз выражен русским завершающим «и» перед последним элементом перечисления.
- source_word: וְ/זִכְרִי
  choice: и Зихри
  rationale: Личное имя передано как «Зихри», близко к еврейскому זִכְרִי; союз сохраняет структуру перечисления.
