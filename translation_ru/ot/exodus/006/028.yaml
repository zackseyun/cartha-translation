lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма וַיְהִי служит повествовательным переходом. «И было» сохраняет присоединительную силу וַ־ и не добавляет отсутствующего в еврейском тексте наречия «теперь».
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Сочетание буквально означает «в день»; указательное «тот» и союз «когда» естественно связывают его с последующим придаточным в русском языке.
- source_word: דִּבֶּר ... אֶל מֹשֶׁה
  choice: говорил Моисею
  rationale: דבר с אֶל обозначает речь, обращённую к кому-либо. Выбор сохраняет обычное значение глагола и направление речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египетской земле
  rationale: Перевод сохраняет явно присутствующее אֶרֶץ «земля», не сокращая выражение до «в Египте».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя YHWH. «Яхве» передаёт его как имя и не подменяет титулом; примечание сообщает читателю традиционную замену.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Тире в конце сохранено, поскольку фраза синтаксически продолжается в следующем стихе; оно также отражает незавершённость данного стихового фрагмента.
