  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: ru
  text: Аарон взял себе в жёны Елишеву, дочь Аминадава, сестру Нахшона. Она родила ему Надава, Авиу, Элеазара и Итамара.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял себе в жёны
  rationale: Глагол לקח буквально означает «взял», а в сочетании с לְאִשָּׁה обозначает вступление в брак. Русское выражение сохраняет образ исходного текста и ясно передаёт брачный смысл.
- source_word: אֱלִישֶׁבַע
  choice: Елисавету
  rationale: Использована укоренившаяся в русской библейской традиции форма имени; падеж обусловлен синтаксисом предложения.
- source_word: בַּת עַמִּינָדָב
  choice: дочь Аминадава
  rationale: Точно и естественно передаёт конструкцию прямого родства.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: сестру Наасона
  rationale: Прямо передаёт указанное родство и сохраняет приложение к имени Елисаветы.
- source_word: וַתֵּלֶד לוֹ
  choice: Она родила ему
  rationale: Глагол ילד с косвенным дополнением естественно передаётся по-русски как «родила ему».
- source_word: נָדָב
  choice: Надава
  rationale: Традиционная русская библейская передача имени в форме винительного падежа.
- source_word: אֲבִיהוּא
  choice: Авиуда
  rationale: Традиционная русская библейская передача имени в форме винительного падежа.
- source_word: אֶלְעָזָר
  choice: Елеазара
  rationale: Традиционная русская библейская передача имени в форме винительного падежа.
- source_word: אִיתָמָר
  choice: Ифамара
  rationale: Традиционная русская библейская передача имени в форме винительного падежа.
