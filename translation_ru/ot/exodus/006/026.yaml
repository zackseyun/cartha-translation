base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: ru
  text: 'Это Аарон и Моисей, которым Яхве сказал: «Выведите сынов Израиля из земли Египта по их отрядам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по их ополчениям»; еврейское слово может обозначать организованные группы и также иметь военный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: Это Аарон и Моисей
  rationale: Единственное указательное местоимение вводит подчёркнутое отождествление ранее названных лиц. Русская формула «Это Аарон и Моисей» естественна и сохраняет необычное согласование исходной конструкции.
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: которым Яхве сказал
  rationale: Относительная частица вместе с לָהֶם указывает на адресатов речи; «которым» точно и естественно передаёт эту связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: הוֹצִיאוּ
  choice: Выведите
  rationale: Каузативный императив множественного числа от יצא означает «заставьте выйти, выведите»; русское «выведите» сохраняет и повеление, и обращение к двум лицам.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально прозрачная передача родового выражения; она сохраняет образ происхождения от Израиля, не сводя его к одному лишь этнониму.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняется явное упоминание земли и исходное значение удаления из неё; форма «земля Египетская» dignified и понятна в русском библейском регистре.
- source_word: עַל צִבְאֹתָם
  choice: по их ополчениям
  rationale: צְבָאוֹת обозначает организованные соединения, способные иметь военный оттенок. «По их ополчениям» сохраняет одновременно упорядоченность групп и напряжённый военный образ, не утверждая, что Израиль уже является регулярной армией.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Объём выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Буквальная родовая формула включает народ как потомков Израиля; этноним был бы естественнее, но устранил бы этот образ.
- issue: Военно-организационный оттенок עַל צִבְאֹתָם
  choice: по их ополчениям
  alternative: по их отрядам
  rationale: Выбор сохраняет реальную неоднозначность между организованными группами и воинскими формированиями. Более нейтральное «отрядам» возможно, но слабее передаёт устойчивый оттенок צבא.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным; «Это Аарон и Моисей» сохраняет эмфатическое отождествление, а «ополчения» — организационно-военную неоднозначность оригинала.
