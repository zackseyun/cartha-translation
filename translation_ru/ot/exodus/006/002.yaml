  text: 'Бог обратился к Моисею и сказал ему: «Я — Яхве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: ЙХВХ (יהוה); традиционно передаётся «Господь». Произношение «Яхве» является общепринятой реконструкцией.'
    reason: Уточнение письменной формы божественного имени, традиционной передачи и неопределённости его древнего произношения.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Стандартная повествовательная формула введения речи; несовершенный вид естественно звучит по-русски в сочетании с последующим «сказал» и сохраняет оба еврейских глагола речи.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: При сказуемом в единственном числе слово обозначает Бога Израиля; нормативный русский эквивалент — «Бог».
- source_word: אֶל־מֹשֶׁה
  choice: с Моисеем
  rationale: При русском глаголе «говорить» конструкция «говорил с Моисеем» естественна и передаёт направленность речи к адресату.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: и сказал ему
  rationale: Прямо передаёт второй глагол речи и местоименную отсылку к Моисею, не устраняя характерный для еврейского повествования повтор.
- source_word: אֲנִי
  choice: Я —
  rationale: В именном предложении настоящее «есть» подразумевается; тире естественно выражает по-русски подчёркнутое самоотождествление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон. «Яхве» сохраняет личное имя и наиболее вероятное научное восстановление произношения; примечание указывает еврейскую письменную форму, не представляя реконструкцию как бесспорную.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён повтор двух глаголов речи. Имя «Яхве» оставлено в основном тексте, а подлинная неопределённость произношения тетраграмматона отражена в примечании.
