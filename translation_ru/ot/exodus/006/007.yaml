  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: ru
  text: И Я возьму вас Себе в народ, и буду вашим Богом. И вы узнаете, что Я — Яхве, ваш Бог, выводящий вас из-под египетского гнёта.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который вывел вас из-под египетских повинностей». Еврейское причастие может представлять это действие как совершаемое или характерное для Яхве либо как совершённое избавление, определяющее, кто Он; слово «гнёт» может также означать тяжёлые работы или повинности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: И Я возьму вас Себе в народ
  rationale: Будущее значение формы в последовательности обещаний сохранено; «Себе в народ» передаёт оба ל и заветную принадлежность без лишней систематизации.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: и буду вашим Богом
  rationale: Естественная русская передача устойчивой заветной формулы, сохраняющая её взаимно-реляционный смысл.
- source_word: וִידַעְתֶּם
  choice: вы узнаете
  rationale: «Узнаете» здесь естественно выражает будущее опытное распознание того, кем является Яхве, не исключая познавательного смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: הַמּוֹצִיא
  choice: выводящий
  rationale: Субстантивированное причастие сохранено русским причастием; оно допускает характеристику Яхве как Избавителя и действие, определяющее Его в данном контексте.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: из-под египетского гнёта
  rationale: «Из-под» сохраняет пространственный образ подчинения, а «гнёт» естественно охватывает тяжёлые повинности и бремя, налагавшееся Египтом.
theological_decisions:
- issue: Заветная формула
  choice: «возьму вас Себе в народ, и буду вашим Богом»
  alternative: «возьму вас как Мой народ и буду для вас Богом»
  rationale: Выбранная формулировка сохраняет принадлежность и взаимное заветное отношение, не внося позднейших богословских уточнений.
- issue: Передача имени יהוה
  choice: «Яхве»
  alternative: «Господь»
  rationale: Исходный текст употребляет собственное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Временная отнесённость הַמּוֹצִיא
  choice: «выводящий»
  alternative: «который вывел»
  rationale: Еврейское причастие само по себе не требует сведения к простому прошедшему времени; русское причастие сохраняет подлинную неоднозначность между разворачивающимся действием и постоянной характеристикой Яхве как Избавителя.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Заглавные местоимения при речи Бога поддерживают принятую русскую библейскую традицию. Пунктуация разделяет длинную цепь еврейских союзных предложений ради ясности, не меняя логики текста.
