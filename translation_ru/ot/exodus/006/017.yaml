  text: 'Сыновья Гирсона: Ливни и Шимей — по их родам[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по их семействам». Еврейское слово может обозначать как большие семейные объединения, так и роды внутри племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого состояния множественного числа от בֵּן вводит перечень непосредственных сыновей; «сыновья» точно и естественно передаёт генеалогическую формулу.
- source_word: גֵרְשׁוֹן
  choice: Гирсон
  rationale: Традиционная и узнаваемая русская передача личного имени, соответствующая данному библейскому контексту.
- source_word: לִבְנִי
  choice: Ливни
  rationale: Традиционная русская передача личного имени.
- source_word: וְשִׁמְעִי
  choice: и Шимей
  rationale: Союз וְ передан как «и», личное имя — в принятой русской форме.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В племенном и генеалогическом контексте מִשְׁפָּחָה обозначает родовую группу шире отдельной семьи; «по их родам» сохраняет распределительное значение предлога לְ и естественно звучит по-русски.
