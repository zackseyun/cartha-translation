  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: ru
  text: 'Но Моисей сказал пред ГОСПОДОМ: «Вот, я необрезан устами; как же фараон послушает меня?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: пред ГОСПОДОМ
  rationale: Сохраняет буквальный образ пребывания и речи перед лицом Бога; тетраграмматон передан традиционным титулом «ГОСПОДЬ» с графическим выделением.
- source_word: הֵן
  choice: вот
  rationale: Передаёт вводное указание, которым Моисей привлекает внимание к своему затруднению.
- source_word: עֲרַל שְׂפָתַיִם
  choice: необрезан устами
  rationale: Сохраняет намеренно резкую метафору оригинала и её связь с языком завета, не сводя её толкованием лишь к косноязычию или неумению говорить.
- source_word: יִשְׁמַע אֵלַי
  choice: послушает меня
  rationale: Русское «послушает» естественно сохраняет возможные оттенки как внимания к словам, так и повиновения.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Выбрана укоренённая русская библейская передача, при этом прописное написание показывает, что в источнике стоит личное имя Бога.
- issue: Образ «необрезанных уст»
  choice: метафора сохранена буквально
  alternative: «я не умею говорить» или «я косноязычен»
  rationale: Толковательные варианты устраняют образ и могут чрезмерно сузить смысл; исходная формулировка выражает непригодность или неспособность Моисея говорить, не уточняя её природу.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Порядок слов в вопросе слегка адаптирован для естественности, а необычная метафора оригинала сохранена.
