  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: вводное «но», речь Моисея перед יהוה, усилительное הֵן («вот»), намеренно образное עֲרַל שְׂפָתַיִם и вопрос о том, послушает ли его фараон. «Послушает меня» удачно сохраняет заложенную в יִשְׁמַע возможность как выслушать, так и внять.'
