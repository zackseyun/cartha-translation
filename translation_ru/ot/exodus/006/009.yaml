  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֤א שָֽׁמְעוּ֙ אֶל מֹשֶׁ֔ה מִ/קֹּ֣צֶר ר֔וּחַ וּ/מֵ/עֲבֹדָ֖ה קָשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: ru
  text: Моисей сказал это сынам Израиля, но они не послушали Моисея из-за подавленности духа[a] и тяжёлого труда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за краткости духа»; то есть из-за внутренней подавленности, упадка духа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жестокого рабского труда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В данном повествовательном контексте דבר естественно передаётся современным русским «сказал»; более буквальное «говорил» здесь звучало бы менее естественно.
- source_word: כֵּן
  choice: это
  rationale: Слово указывает на содержание предшествующего Божьего повеления. «Это» ясно и естественно отсылает к только что переданным словам.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняется образ и форма древнееврейского выражения, при этом традиционное русское сочетание остаётся понятным и обозначает народ Израиля.
- source_word: שָׁמְעוּ אֶל
  choice: не послушали
  rationale: Сочетание означает не просто физически услышать, а принять слова и откликнуться на них; «не послушали» сохраняет этот смысл без чрезмерного уточнения.
- source_word: מִקֹּצֶר רוּחַ
  choice: из-за подавленности духа
  rationale: Буквально выражение означает «от краткости духа» и передаёт внутреннюю стеснённость, упадок сил и отчаяние. «Подавленность духа» естественно выражает этот смысл, не сводя его лишь к нетерпению.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: и тяжёлого труда
  rationale: Так передаётся прямое значение עֲבֹדָה קָשָׁה. Контекст рабства сохраняется в повествовании, а возможное более явное прочтение отмечено в сноске.
theological_decisions:
- issue: Характер труда Израиля в Египте
  choice: тяжёлый труд
  alternative: жестокий рабский труд
  rationale: Существительное עֲבֹדָה может обозначать работу, службу или подневольный труд. Основной текст сохраняет его лексическую широту, тогда как сноска поясняет явно присутствующий в контексте рабский характер труда.
- issue: Причина, по которой народ не послушал Моисея
  choice: подавленность духа
  alternative: малодушие; нетерпение; букв. краткость духа
  rationale: Фраза описывает состояние людей, сломленных угнетением, но её точный оттенок допускает некоторую неоднозначность. Перевод не представляет их реакцию просто как нравственный порок и сохраняет связь с тяжёлым трудом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Выражение «сынам Израиля» сохраняет форму исходного текста; остальной синтаксис сделан простым и естественным для современного читателя.
