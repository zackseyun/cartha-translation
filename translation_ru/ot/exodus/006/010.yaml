lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Форма с последовательным וַ продвигает повествование. В русской формуле введения прямой речи «сказал» звучит естественнее буквального «говорил», сохраняя значение речевого акта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: אֶל
  choice: Моисею
  rationale: Направленность речи, выраженная предлогом אֶל, естественно передаётся русским дательным падежом при глаголе «сказал».
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма личного имени; в контексте употреблён дательный падеж «Моисею».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив «говоря», вводящий последующую прямую речь, в современном русском естественно передаётся двоеточием, без тяжеловесной кальки.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст прямо содержит тетраграмматон. Форма «Яхве» сохраняет личное имя; вариант «Иегова» отмечен в сноске, а замена именем-титулом «Господь» не отражала бы форму исходного текста столь непосредственно.
translation_notes:
  register: Современный литературный русский язык. Краткая повествовательная формула передана естественно и достойно; двоеточие функционально выражает לֵאמֹר и вводит речь следующего стиха.
