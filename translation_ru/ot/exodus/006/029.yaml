  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: ru
  text: 'И Яхве сказал Моисею: «Я — Яхве. Скажи фараону, царю Египта, всё, что Я говорю тебе[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что Я сейчас говорю тебе».'
    reason: Причастие דֹּבֵר может подчёркивать продолжающееся в данный момент действие.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И … сказал
  rationale: Ваййиктоль продвигает повествование; «и сказал» естественно продолжает русский рассказ и точно передаёт דבר в формуле введения речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет прямое самоименование Бога, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: не передано отдельно
  rationale: В сочетании וידבר … לאמר русское «сказал:» естественно вводит прямую речь; отдельное «говоря» было бы избыточным и тяжеловесным.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Именное предложение передано с нулевой связкой и тире, что естественно для современного русского языка и сохраняет выразительность самоидентификации.
- source_word: דַּבֵּר
  choice: Передай
  rationale: В данном контексте повеление требует сообщить фараону содержание Божьих слов. «Передай» звучит естественно по-русски, не меняя коммуникативного смысла דבר.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: фараону, царю Египта
  rationale: Приложение выделено запятыми согласно нормам русского языка и сохраняет еврейскую характеристику адресата.
- source_word: אֵת כָּל אֲשֶׁר
  choice: всё, что
  rationale: Точно и естественно выражает полноту передаваемого содержания.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: Я говорю тебе
  rationale: Причастная форма допускает настоящее или актуально-продолженное значение. Простое настоящее сохраняет эту открытость без чрезмерного уточнения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» передаёт тетраграмматон транслитерационно и не заменяет его титулом.
- issue: Временной оттенок דֹּבֵר
  choice: говорю тебе
  alternative: сейчас говорю тебе; буду говорить тебе
  rationale: Еврейское причастие может обозначать текущую или продолжающуюся речь. Нейтральное настоящее время не разрешает эту неоднозначность искусственно.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Имя «Яхве» сохранено; синтаксис прямой речи сделан естественным для русского читателя.
