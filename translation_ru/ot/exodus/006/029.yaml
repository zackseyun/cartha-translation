  source_fidelity: Начальная формула «И Яхве сказал Моисею:» точно передаёт וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵאמֹר; отдельное соответствие לֵאמֹר в русском не требуется. Самоидентификация «Я — Яхве» верна. Однако «Передай» несколько сужает דַּבֵּר («говори/скажи»), добавляя оттенок передачи уже готового сообщения и ослабляя повтор корня דבר. «Скажи» точнее передаёт повеление без смысловой добавки. Причастие דֹּבֵר корректно передано настоящим временем; примечание уместно отмечает возможный актуально-продолженный оттенок.
