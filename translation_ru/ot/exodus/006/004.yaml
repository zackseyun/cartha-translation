  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: ru
  text: Я также утвердил с ними Мой завет, чтобы дать им землю Ханаанскую — землю, где они жили как пришельцы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «землю их временного пребывания, в которой они пребывали как пришельцы».'
    reason: Лексическая альтернатива, сохраняющая повтор однокоренных מְגֻרֵיהֶם и גָּרוּ.
lexical_decisions:
- source_word: וְגַם
  choice: Я также
  rationale: Передаёт добавочное значение сочетания וְ с גַם и естественно связывает фразу с предыдущими словами Бога.
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי אִתָּם
  choice: утвердил с ними Мой завет
  rationale: Глагол קום в породе hifil с בְּרִית выражает установление или утверждение завета. «Утвердил» сохраняет заветную формулу и не создаёт впечатления, будто здесь непременно описывается первое заключение завета.
- source_word: לָתֵת לָהֶם
  choice: чтобы дать им
  rationale: Передаёт целевое значение инфинитива и косвенный объект естественным русским оборотом.
- source_word: אֶרֶץ כְּנָעַן
  choice: землю Ханаанскую
  rationale: Традиционная и литературно естественная русская форма сохраняет как понятие земли, так и название Ханаан.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: землю, где они жили как пришельцы
  rationale: מָגוּר и גור обозначают проживание не на правах коренного или постоянного жителя. Формулировка передаёт этот социальный оттенок и остаётся понятной современному читателю; более буквальная конструкция вынесена в сноску.
theological_decisions:
- issue: Заветный оборот קום + ברית
  choice: утвердил с ними Мой завет
  alternative: заключил с ними Мой завет
  rationale: «Утвердил» точнее сохраняет значение данной глагольной конструкции и не решает сверх текста вопрос о том, идёт ли речь о первоначальном заключении или о подтверждении уже данного завета.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Слово «пришельцы» употреблено в его понятном контекстуальном значении — люди, живущие в чужой земле без постоянного владения ею.
