  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: ru
  text: И Я введу вас в землю, о которой Я поклялся[a], что отдам её Аврааму, Исааку и Иакову; Я отдам её вам во владение. Я — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о которой Я поднял Свою руку, чтобы отдать её». Поднятие руки — жест принесения клятвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: И Я введу вас
  rationale: Хифиль глагола בוא означает «привести, ввести». В данном контексте «введу вас в землю» естественно по-русски и сохраняет каузативный смысл.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Здесь אֶרֶץ обозначает конкретную землю обетования, а не землю или мир вообще.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: о которой Я поклялся[a]
  rationale: Буквально «о которой Я поднял Свою руку» — древнееврейская формула принесения клятвы. В основном тексте передан смысл идиомы, а её образ сохранён в примечании.
- source_word: לָתֵת אֹתָהּ
  choice: что отдам её
  rationale: Инфинитив נתן имеет прямое значение «дать». Конструкция после клятвенной формулы естественно передаётся по-русски придаточным предложением.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Имена переданы в укоренившейся русской библейской форме; повтор предлога/показателя дательного падежа выражен русскими падежными окончаниями.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: Я отдам её вам
  rationale: Форма продолжает цепь божественных обещаний; будущее совершенного вида передаёт обещанное завершённое действие.
- source_word: מוֹרָשָׁה
  choice: во владение
  rationale: Слово обозначает владение, закреплённое за получателем, нередко наследственное. «Во владение» естественно и не сводит смысл исключительно к наследованию после смерти.
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Тетраграмматон передан личным именем «Яхве»; тире естественно оформляет торжественное именное самоотождествление в русском языке.
theological_decisions:
- issue: Передача клятвенной идиомы נָשָׂאתִי אֶת יָדִי
  choice: о которой Я поклялся
  alternative: о которой Я поднял руку, чтобы отдать её
  rationale: Русское буквальное выражение «поднять руку» само по себе обычно не означает принесения клятвы и может быть понято неверно. Смысл идиомы вынесен в основной текст, а буквальный образ указан в примечании.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное заветное имя Бога; транслитерация сохраняет его как имя и соответствует предоставленному актуальному решению.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Заглавное «Я» относится к говорящему Богу. Точка с запятой разделяет клятвенное обещание предкам и обещание передать землю Израилю.
