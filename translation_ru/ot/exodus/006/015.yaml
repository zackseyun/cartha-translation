- source_word: וְאֹהַד
  choice: Охад
  rationale: Прямая и традиционно узнаваемая русская передача имени.
- source_word: וְיָכִין
  choice: Иахин
  rationale: Устоявшаяся русская библейская форма имени יָכִין.
- source_word: וְצֹחַר
  choice: Цохар
  rationale: Передаёт еврейскую форму имени и соответствует принятой русской библейской традиции.
- source_word: וְשָׁאוּל
  choice: и Шаул[a]
  rationale: Форма «Шаул» ближе непосредственно к еврейскому שָׁאוּל; знакомая традиционная форма «Саул» сохранена в примечании. Союз перед последним элементом списка соответствует естественной русской норме.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: сын ханаанеянки
  rationale: Форма הַכְּנַעֲנִית женского рода прямо указывает на женщину-ханаанеянку; русское существительное ясно и кратко сохраняет этот смысл.
- source_word: אֵלֶּה מִשְׁפְּחֹת
  choice: Это роды
  rationale: Связка, подразумеваемая в еврейском именном предложении, выражена по-русски. «Роды» естественно обозначает родовые группы внутри племени и лучше подходит к генеалогическому контексту, чем современное бытовое «семьи».
