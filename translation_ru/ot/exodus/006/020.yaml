base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: ru
  text: Амрам взял себе в жёны Иохаведу, свою тётю[a], и она родила ему Аарона и Моисея. Амрам прожил сто тридцать семь лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более узкий перевод: «сестру его отца».'
    reason: Лексический вариант; еврейский термин «тётя» в этом стихе не уточняет линию родства.
lexical_decisions:
- source_word: וַיִּקַּח ... לוֹ לְאִשָּׁה
  choice: взял себе в жёны
  rationale: Сохраняет брачную идиому еврейского текста и при этом естественно звучит по-русски.
- source_word: דֹּדָתוֹ
  choice: свою тётю
  rationale: Женская форма термина родства обозначает тётю; сам стих не уточняет линию родства, поэтому более узкое «сестру своего отца» вынесено в примечание.
- source_word: וַתֵּלֶד לוֹ
  choice: и она родила ему
  rationale: Передаёт глагол ילד и косвенное дополнение לוֹ без добавления отсутствующих в тексте слов.
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: Амрам прожил ... лет
  rationale: Естественная современная русская формула продолжительности жизни, точно передающая смысл еврейского оборота.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: сто тридцать семь лет
  rationale: Точно передаёт числовое значение 137 в принятой русской словесной записи.
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: Амрам / Иохаведа / Аарон / Моисей
  rationale: Использованы устоявшиеся русские библейские формы личных имён.
theological_decisions:
- issue: Близкое родство супругов, которое позднее запрещается законом Торы
  choice: свою тётю
  alternative: сестру своего отца
  rationale: Перевод сообщает генеалогический факт без нравственной оценки и не делает термин родства конкретнее, чем он выражен в данном стихе. Более точная идентификация по родословной отмечена в сноске, сохраняя напряжение текста.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное, с сохранением краткого генеалогического характера стиха.
