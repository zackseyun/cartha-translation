base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: ru
  text: 'Но Моисей сказал Яхве: «Вот, сыны Израиля не послушали меня; как же послушает меня фараон, если у меня необрезанные уста[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «необрезанные уста» — образная идиома, которая может указывать на затруднённую или недостаточную речь; ср. Исх. 4:10.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Но Моисей сказал
  rationale: Последовательный вав продолжает повествование, а «но» естественно передаёт контраст между повелением Яхве и возражением Моисея.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» сохраняет пространственно-реляционную идиому לִפְנֵי, а «Яхве» передаёт личное имя יהוה.
- source_word: הֵן
  choice: Вот
  rationale: Современная и вместе с тем достойная частица, привлекающая внимание к доводу Моисея.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет семейно-корпоративный образ исходного выражения, не заменяя его более общим этнонимом.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: не послушали меня
  rationale: Передаёт как слушание, так и оттенок непринятия сказанного, не усиливая смысл до прямого «не повиновались».
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: как же послушает меня фараон
  rationale: «Как же» естественно выражает вывод и риторический вопрос; повтор «послушает» сохраняет связь с предыдущим употреблением שׁמע.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: если у меня необрезанные уста
  rationale: «Если» передаёт обстоятельство, на котором основано возражение Моисея; буквальный образ «необрезанных уст» сохранён, а его смысл пояснён в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это, не заменяя имя титулом.
- issue: Толкование עֲרַל שְׂפָתָיִם
  choice: необрезанные уста
  alternative: косноязычен; неумел в речи
  rationale: Сохранён намеренно резкий еврейский образ, который может указывать на затруднённость, неспособность или непригодность речи, без сведения его к определённому диагнозу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Форма «пред Яхве» и выражение «сыны Израиля» сохраняют структуру и образность еврейского текста; архаические глагольные формы не используются.
