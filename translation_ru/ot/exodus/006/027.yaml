  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: ru
  text: Это те, кто говорил фараону, царю Египта, чтобы вывести сынов Израиля из Египта, — Моисей и Аарон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Они — те, кто говорит с фараоном». В еврейском тексте употреблено причастие, характеризующее Моисея и Аарона как тех, кто обращался к фараону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם הַמְדַבְּרִים
  choice: Они говорили
  rationale: Самостоятельное местоимение вместе с субстантивированным причастием вновь указывает на ранее названных Моисея и Аарона и характеризует их по действию. В русском прошедшее время естественно передаёт это в контексте повествовательного резюме; оттенок причастной характеристики отмечен в сноске.
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: с фараоном, царём Египта
  rationale: При глаголе דבר предлог אֶל обозначает адресата речи; по-русски нормативно и естественно «говорить с кем-либо». Приложение «царём Египта» обособлено.
- source_word: לְהוֹצִיא
  choice: чтобы вывести
  rationale: Инфинитив породы hифиль от יצא выражает каузативное действие — сделать так, чтобы кто-либо вышел. Целевая конструкция «чтобы вывести» естественно передаёт לְ и сохраняет целевое значение.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально точная передача мужского множественного конструкта, сохраняющая родословную формулу исходного текста без замены на этноним.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: Предлог מִן указывает на исходную точку; с «вывести» русское «из Египта» передаёт смысл точно и естественно.
- source_word: הוּא מֹשֶׁה וְאַהֲרֹן
  choice: Это Моисей и Аарон
  rationale: Единственное הוּא вводит итоговое отождествление двух ранее названных лиц. Русское неизменяемое указательное «это» естественно сочетается с составным именованием.
theological_decisions:
- issue: Участие Моисея и Аарона в исходе
  choice: Сохранена целевая формулировка «чтобы вывести», относящаяся к их речи перед фараоном.
  alternative: «которые вывели» или формулировка, прямо приписывающая им совершение исхода
  rationale: Еврейский инфинитив לְהוֹצִיא выражает цель их обращения к фараону, а не даёт самостоятельного богословского утверждения о том, кто в конечном счёте совершил избавление.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; повтор «Египта» сохранён вслед за еврейским текстом, а формула «сыны Израиля» передана как «сынов Израиля».
