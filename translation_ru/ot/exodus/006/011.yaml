base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: ru
  text: Пойди, скажи фараону, царю Египта, чтобы он отпустил сынов Израиля[a] из своей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтян» или «детей Израиля». Буквально по-еврейски: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Пойди
  rationale: Императив глагола בוא буквально может означать «иди» или «приди»; в данном контексте Моисею велено отправиться к фараону, поэтому по-русски естественно «пойди».
- source_word: דַבֵּר אֶל
  choice: скажи
  rationale: Сочетание глагола речи с предлогом, обозначающим адресата. В русском контексте повеления обратиться к фараону «скажи» звучит естественнее буквального «говори к» и сохраняет прямой характер поручения.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: фараону, царю Египта
  rationale: Приложение передано с нормативным русским обособлением; «царь Египта» точно выражает титул и владение.
- source_word: וִישַׁלַּח
  choice: чтобы он отпустил
  rationale: Префиксальная форма после повеления выражает требуемый результат или содержание обращения к фараону. «Отпустил» передаёт каузативный смысл שלח в контексте освобождения Израиля, не превращая фразу в простое предсказание.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохранён буквальный родовой образ «сыны Израиля» в современной падежной форме после глагола; этноним «израильтяне» также возможен по смыслу.
- source_word: מֵאַרְצוֹ
  choice: из своей земли
  rationale: אֶרֶץ обозначает землю, находящуюся под властью фараона. Возвратное «своей» однозначно соотносит её с субъектом «он» и естественно передаёт местоименный суффикс.
theological_decisions:
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; детей Израиля
  rationale: Основной текст сохраняет родовое и грамматически мужское выражение оригинала, тогда как сноска сообщает естественные контекстуальные варианты без привнесения богословского толкования.
- issue: Модальность וִישַׁלַּח после повеления
  choice: чтобы он отпустил
  alternative: и пусть он отпустит; и он отпустит
  rationale: Выбран целевой/результативный смысл, наиболее подходящий контексту поручения Моисею. Вариант с будущим временем возможен формально, но мог бы ошибочно прозвучать как безусловное предсказание.
