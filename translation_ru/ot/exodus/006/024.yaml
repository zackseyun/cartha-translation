  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: אֲבִיאָסָף
  choice: Авиасаф
  rationale: Личное имя передано в принятой русской библейской форме; начальная согласная отражена как «в» согласно русской традиции передачи этого имени.
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В племенном и генеалогическом контексте слово обозначает крупные родственные группы, а не только отдельные домашние семьи. «Роды» кратко и естественно передаёт этот смысл; возможное «семейства» указано в примечании.
- source_word: הַקָּרְחִי
  choice: кореевцев
  rationale: Субстантивированное обозначение принадлежащих к линии Корея; форма «кореевцы» естественна для русского библейского родословного контекста.
