- source_word: וּבְנֵי קֹרַח
  choice: Сыновья Корея
  rationale: בְּנֵי — форма сопряжённого состояния множественного числа от «сын»; перечисление трёх лиц указывает на непосредственных сыновей. Начальный союз וּ естественно не воспроизводить в самостоятельной русской генеалогической строке.
- source_word: אַסִּיר
  choice: Ассир
  rationale: В данном генеалогическом контексте это личное имя, переданное в традиционной русской форме.
- source_word: אֶלְקָנָה
