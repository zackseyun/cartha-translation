- from: И сказал Яхве Моисею и Аарону, и повелел им относительно сынов Израиля и относительно фараона, царя Египта,[a] вывести сынов Израиля из земли Египетской.[b]
  to: 'И сказал Яхве Моисею и Аарону и дал им повеление[a] относительно сынов Израиля и фараона, царя Египта: вывести сынов Израиля[b] из земли Египта.'
  rationale: 'Правка делает фразу естественной для современного литературного русского, не меняя её синтаксической осторожности: спорная роль אֶל сохранена через «относительно» и объяснена в сноске. Двоеточие ясно оформляет инфинитив «вывести» как содержание поручения. Сноски перенесены к словам, которых они действительно касаются.'
