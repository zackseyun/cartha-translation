source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: ru
  text: 'И сказал Яхве Моисею и Аарону и дал им повеление[a] относительно сынов Израиля и фараона, царя Египта: вывести сынов Израиля[b] из земли Египта.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и повелел им обратиться к сынам Израиля и к фараону, царю Египта». Еврейский предлог может указывать на адресатов поручения; однако в данном контексте, вероятнее всего, поручение, данное Моисею и Аарону, касается как Израиля, так и фараона.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сынов Израиля»; также можно передать: «израильтян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Нарративная форма wayyiqtol продолжает последовательность повествования; традиционное и естественное русское «И сказал» сохраняет эту связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: Моисею и Аарону
  rationale: Предлог אֶל при глаголе речи обозначает адресатов; русский дательный передаёт это естественно.
- source_word: וַיְצַוֵּם
  choice: и повелел им
  rationale: Глагол צוה выражает властное повеление; местоименный суффикс относится к Моисею и Аарону.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה
  choice: относительно сынов Израиля и относительно фараона
  rationale: После צוה сочетание с אֶל допускает значение предмета или сферы поручения. Контекст указывает, что повеление дано Моисею и Аарону и касается Израиля и фараона; буквальная адресатная трактовка сохранена в примечании.
- source_word: לְהוֹצִיא
  choice: вывести
  rationale: Каузативная форма Hiphil от יצא означает «сделать так, чтобы вышли»; «вывести» кратко и естественно передаёт это значение.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено родственно-национальное выражение оригинала, хорошо укоренённое в русском библейском стиле.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Существительное אֶרֶץ передано явно; форма «земля Египетская» литературна и сохраняет конкретное географическое выражение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте, не подменяя его титулом.
- issue: Синтаксическая роль אֶל после וַיְצַוֵּם
  choice: повеление относительно Израиля и фараона
  alternative: повеление, непосредственно обращённое к Израилю и фараону
  rationale: Местоимение «им» прямо называет Моисея и Аарона получателями повеления, а цель «вывести» естественно описывает поручение, касающееся Израиля и фараона. Однако грамматическая двусмысленность отражена в примечании.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранена образность исходного национально-родового обозначения без сведения его к обозначению только мужчин.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохранён близким к еврейскому, но остаётся ясным; «повелел» и «земля Египетская» поддерживают достоинство регистра без чрезмерной архаизации.
