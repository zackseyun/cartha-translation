  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: ru
  text: Елеазар, сын Аарона, взял себе в жёны одну из дочерей Путиэла[a], и она родила ему Финееса. Это главы родовых домов левитов, по их родам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из дочерей Путиэла». Еврейский оборот указывает, что жена происходила из семьи Путиэла, но не называет её имени.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «главы отцов». Это родовое обозначение руководителей главных семейных домов среди левитских родов.'
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: взял себе в жёны
  rationale: Сохранена образность еврейского брачного оборота, но фраза передана естественно для современного русского языка.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: одну из дочерей Путиэла
  rationale: Предлог מִן с формой множественного числа указывает на принадлежность к группе; по контексту речь идёт о женщине, ставшей женой Елеазара.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: и она родила ему Финееса
  rationale: Женский род глагола сохранён явным местоимением; дательный компонент לוֹ передан словом «ему».
- source_word: אֵלֶּה
  choice: вот
  rationale: Так естественно передаётся заключительное указание, подводящее итог генеалогическому перечню.
- source_word: רָאשֵׁי אֲבוֹת
  choice: главы отеческих домов
  rationale: 'Передан технический родовой смысл выражения: речь идёт о руководителях крупных семейно-родовых объединений, а не просто об отцах.'
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Употреблено принятое русское обозначение потомков Левия.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: В генеалогическом контексте מִשְׁפָּחָה обозначает родовое или клановое подразделение; «по их родам» звучит естественно и сохраняет структуру текста.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: Елеазар / Аарон / Путиэл / Финеес
  rationale: Использованы укоренившиеся русские библейские формы для Елеазара, Аарона и Финееса; имя Путиэл передано непосредственно с еврейского.
