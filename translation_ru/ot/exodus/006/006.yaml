  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: ru
  text: 'Поэтому скажи сынам Израиля[a]: «Я — Яхве[b]. Я выведу вас из-под египетского гнёта, избавлю вас от рабства у египтян[c] и искуплю вас простёртой рукой и великими судами[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам», «детям Израиля». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Евр. יהוה (ЙХВХ) — личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Или: «от их подневольного труда». Еврейское слово может означать работу или служение, но здесь речь идёт о принудительном рабстве у египтян.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «великие акты суда». Имеются в виду могущественные действия, которыми Бог судит Египет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и переход от предшествующей речи Бога.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет буквальный семейно-родовой оборот еврейского текста; более естественная альтернатива — «израильтянам».
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Передаёт прямое самоименование Бога и сохраняет личное заветное имя, представленное тетраграмматоном.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: из-под египетского гнёта
  rationale: Сочетание обозначает тяжёлые ноши и принудительные работы, возложенные Египтом; «гнёт» естественно передаёт образ пребывания под этой тяжестью.
- source_word: וְהִצַּלְתִּי אֶתְכֶם מֵעֲבֹדָתָם
  choice: избавлю вас от рабства у египтян
  rationale: В данном контексте עֲבֹדָה означает не нейтральный труд или служение, а принудительную зависимость; местоименный суффикс соотнесён с египтянами.
- source_word: וְגָאַלְתִּי
  choice: искуплю
  rationale: Сохраняет юридическую и родственную окраску действия избавителя, который возвращает себе находящегося в зависимости.
- source_word: בִּזְרוֹעַ נְטוּיָה
  choice: простёртой рукой
  rationale: Сохраняет устойчивый антропоморфный образ могущественного вмешательства Бога.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: совершив великие суды
  rationale: Передаёт שְׁפָטִים как конкретные акты суда, а не только судебные решения; деепричастная конструкция естественна по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация делает это явным и не смешивает имя с титулом.
- issue: Степень буквальности выражения לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам / детям Израиля
  rationale: Основной текст сохраняет родовой образ оригинала, а сноска предлагает естественные русские соответствия без изменения референта.
- issue: Значение עֲבֹדָה
  choice: рабство
  alternative: служение / тяжёлый труд
  rationale: Контекст принудительного труда и египетского господства требует значения угнетённой зависимости, но сноска отмечает более широкий лексический диапазон.
- issue: Характер שְׁפָטִים
  choice: великие суды как акты Божьего суда
  alternative: великие наказания
  rationale: Формулировка сохраняет судебную категорию и не сужает заранее её проявления только до наказаний или казней.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллельная цепь глаголов будущего времени сохранена. Конкретное «ноши Египта» передано естественным выражением «египетский гнёт», а двусмысленность ключевых терминов отражена в сносках.
