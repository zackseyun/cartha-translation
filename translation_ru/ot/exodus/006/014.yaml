  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: ru
  text: 'Вот главы их отеческих домов: сыновья Рувима, первенца Израиля, — Ханох, Паллу, Хецрон и Карми. Это роды Рувима.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי בֵית אֲבֹתָם
  choice: Вот главы их отеческих домов
  rationale: Сохраняется генеалогическая формула и конкретный образ «глав»; «отеческие дома» передаёт родовые объединения по отцовской линии, не смешивая их с последующим מִשְׁפְּחֹת.
- source_word: בְּנֵי רְאוּבֵן
  choice: сыновья Рувима
  rationale: Названы непосредственные сыновья Рувима, поэтому более широкое «потомки» здесь не требуется.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: первенца Израиля
  rationale: Приложение отнесено к Рувиму и сохранено без дополнительного истолкования.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: Ханох, Паллу, Хецрон и Карми
  rationale: Имена переданы прямой современной транслитерацией с еврейского, а союзный ряд естественно оформлен по-русски.
- source_word: מִשְׁפְּחֹת רְאוּבֵן
  choice: роды Рувима
  rationale: מִשְׁפְּחֹת обозначает родовые подразделения внутри колена; «роды» в данном генеалогическом контексте точнее современного бытового «семьи».
