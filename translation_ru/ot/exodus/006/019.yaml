  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: ru
  text: 'Сыновья Мерари: Махли и Муши. Это роды Левия[a] по их поколениям.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «левита». Единственное число, вероятно, имеет здесь собирательное значение и обозначает родовую линию левитов; возможно также: «роды левита» или «роды левитов».'
    reason: лексическая альтернатива и сохранение собирательного единственного числа в еврейском тексте
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: Сыновья Мерари
  rationale: Конструктивная форма множественного числа בְּנֵי в родословном перечне естественно передаётся как «сыновья»; начальный союз не выражен отдельно, поскольку по-русски внутри непрерывного списка он не обязателен.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: Махли и Муши
  rationale: Личные имена переданы принятой русской библейской транслитерацией; союз сохранён.
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: В племенном и родословном контексте слово обозначает родственные подразделения племени; «роды» точнее, чем бытовое «семьи».
- source_word: הַ/לֵּוִי
  choice: Левия[a]
  rationale: Еврейская форма буквально означает «левита» в единственном числе и, вероятно, употреблена собирательно. В основном тексте «Левия» ясно и естественно обозначает родовую линию, а сноска сохраняет морфологическую особенность и возможное альтернативное понимание.
- source_word: לְ/תֹלְדֹתָם
  choice: по их поколениям
  rationale: Сохранена формула родословия, указывающая на поколения или линии происхождения, без сведения её к позднейшему понятию письменных записей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с кратким, dignified родословным построением. Термин «роды» сохраняет племенной смысл, а выражение «по их поколениям» — формальность исходной генеалогической формулы.
