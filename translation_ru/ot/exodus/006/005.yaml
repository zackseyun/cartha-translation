  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: ru
  text: И Я также услышал стон сынов Израиля[a], которых египтяне держат в рабстве, и вспомнил Мой завет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтян» или «народа Израиля». Буквально с еврейского: «сынов Израиля»; выражение обозначает народ в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь «вспомнил» — язык завета: это не означает, что Бог забыл, но указывает на Его обращение к завету ради действия.'
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: И Я также
  rationale: Сохраняет присоединительное значение וְגַם и подчёркнутое самостоятельное местоимение אֲנִי, оставаясь естественным по-русски.
- source_word: שָׁמַעְתִּי
  choice: услышал
  rationale: Русское прошедшее время естественно передаёт совершённое действие с сохраняющимся результатом в контексте Божьей речи.
- source_word: נַאֲקַת
  choice: стон
  rationale: Передаёт мучительный звук и страдание угнетаемого народа; единственное число соответствует собирательному характеру еврейского существительного.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Близко воспроизводит еврейское выражение и сохраняет его заветно-родовой оттенок; в примечании разъясняется собирательное значение.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: которых египтяне держат в рабстве
  rationale: Форма מַעֲבִדִים от עבד в породе hифиль обозначает принуждение к служению; выражение «держат в рабстве» ясно передаёт продолжающееся угнетение. Название страны по смыслу обозначает египтян как действующих лиц.
- source_word: וָאֶזְכֹּר
  choice: и вспомнил
  rationale: Сохраняет библейскую формулировку, не подменяя её толкованием; в данном контексте это память, обращённая к действию.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» — точный и устоявшийся русский эквивалент בְּרִית в контексте обязательства Бога перед праотцами.
theological_decisions:
- issue: Собирательное значение выражения בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народа Израиля
  rationale: Основной текст сохраняет буквальный родовой образ, но примечание поясняет, что речь идёт обо всём народе, а не только о мужчинах.
- issue: Смысл Божьего «воспоминания»
  choice: вспомнил Мой завет
  alternative: обратился к Своему завету, чтобы исполнить его
  rationale: Сохранена подлинная библейская идиома и её богословское напряжение. Примечание поясняет, что речь не о забывчивости Бога, а о переходе к действию согласно завету.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Порядок слов сохраняет акцент на Божьем «Я», а формулировка остаётся понятной без архаизмов.
