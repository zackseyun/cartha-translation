source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: ru
  text: 'Тогда Яхве сказал Моисею: «Теперь ты увидишь, что Я сделаю с фараоном: под властью сильной руки[a] он отпустит их и под властью сильной руки прогонит их из своей земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по принуждению». Дважды повторённые слова «под властью сильной руки» могут означать, что фараон отпустит их и прогонит израильтян под давлением непреодолимой силы — в конечном счёте силы Бога.'
    reason: Лексическая альтернатива и сохранение неоднозначности выражения בְּיָד חֲזָקָה.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: עַתָּה תִרְאֶה
  choice: Теперь ты увидишь
  rationale: Сохраняет временное ударение עַתָּה и прямое будущее значение глагола.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: что Я сделаю с фараоном
  rationale: Русское «сделать с кем-либо» естественно передаёт действие в отношении фараона, не усиливая предлог до явно враждебного «против».
- source_word: כִּי
  choice: двоеточие
  rationale: В русском двоеточие естественно вводит пояснение того, что именно совершит Бог; причинно-пояснительная связь сохраняется.
- source_word: בְיָד חֲזָקָה
  choice: под действием сильной руки
  rationale: Сохраняет образ руки и одновременно позволяет услышать значение принуждающей силы, не называя её носителя прямо.
- source_word: יְשַׁלְּחֵם
  choice: он отпустит их
  rationale: В контексте исхода речь идёт об освобождении Израиля фараоном.
- source_word: יְגָרְשֵׁם
  choice: прогонит их
  rationale: Передаёт более сильное действие по сравнению с простым освобождением и сохраняет развитие мысли.
- source_word: מֵאַרְצוֹ
  choice: из своей земли
  rationale: Возвратное местоимение естественно соотносит землю с подлежащим «он», а «земля» сохраняет широкое значение אֶרֶץ.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Чья сила обозначена выражением בְיָד חֲזָקָה
  choice: Сохранить образ без прямого указания носителя силы
  alternative: «по принуждению»; «из-за могучей руки Бога»; «сильной рукой он отпустит»
  rationale: Контекст указывает на непреодолимое Божье воздействие, однако синтаксис допускает образное выражение при действиях фараона. Основной текст не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор ключевого выражения сохранён ради еврейского параллелизма и усиления; местоимение «Я» написано с прописной буквы как реплика Бога.
