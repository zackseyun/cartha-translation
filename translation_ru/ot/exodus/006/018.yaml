  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: ru
  text: 'Сыновья Каафа: Амрам, Ицгар, Хеврон и Узиил. Кааф прожил сто тридцать три года.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: Сыновья Каафа
  rationale: בְּנֵי — форма сопряжённого состояния множественного числа от «сын»; здесь перечислены непосредственные сыновья Каафа. Начальный союз ו не передан отдельно, поскольку по-русски продолжение родословия естественно оформляется как новая фраза-заголовок.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Амрам, Ицгар, Хеврон и Уззиил
  rationale: Имена переданы традиционными русскими библейскими формами; повторяющийся союз ו естественно выражен запятыми и союзом «и» перед последним именем.
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: Кааф прожил
  rationale: 'Буквально: «и годы жизни Каафа». Русская конструкция «Кааф прожил…» точно и естественно передаёт указание на продолжительность его жизни без тяжеловесной кальки.'
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: сто тридцать три года
  rationale: Порядок компонентов числительного приведён к нормальному русскому; единственное число שָׁנָה после составного числительного передано требуемой русской формой «года».
