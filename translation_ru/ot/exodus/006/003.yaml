  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: ru
  text: Я являлся Аврааму, Исааку и Иакову как Бог Всемогущий[a], но под Моим именем Яхве[b] Я не был им известен[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Эль-Шаддай; традиционный перевод — «Бог Всемогущий».
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога, переданное четырьмя еврейскими согласными יהוה (ЙХВХ).
    reason: name_explanation
  - marker: c
    text: 'Или: «Я не открылся им под Моим именем Яхве». Эти слова могут означать не то, что патриархи вовсе не знали этого имени, а то, что им ещё не было во всей полноте открыто его заветное значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: Я являлся
  rationale: Нифаль глагола ראה здесь прямо обозначает явление Бога патриархам; несовершенный вид по-русски естественно передаёт неоднократные явления в прошлом.
- source_word: אֶל אַבְרָהָם אֶל יִצְחָק וְאֶל יַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Русский дательный падеж естественно передаёт повторённый еврейский предлог אֶל; механическое повторение предлога в русском не требуется.
- source_word: בְּאֵל שַׁדָּי
  choice: как Бог Всемогущий
  rationale: Предлог בְּ имеет здесь значение роли или имени — «как»; традиционный и понятный перевод титула שַׁדָּי сохраняется в основном тексте.
- source_word: וּשְׁמִי יְהוָה
  choice: но под Моим именем Яхве
  rationale: «Под именем» естественно передаёт инструментально-относительную конструкцию, а личное имя יהוה транслитерируется как «Яхве», не заменяясь титулом.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: Я не был им известен
  rationale: Формально прозрачный перевод нифаля ידע сохраняет неоднозначность между состоянием «не был известен» и рефлексивным смыслом «не открыл Себя».
theological_decisions:
- issue: Как понимать неизвестность имени Яхве патриархам
  choice: Сохранить буквальную и неоднозначную формулировку «Я не был им известен».
  alternative: «Я не открылся им под Моим именем Яхве».
  rationale: Еврейская форма допускает как пассивно-стативное, так и рефлексивное понимание. Основной текст не решает, шла ли речь о незнании самого имени или о неполном познании его заветного значения; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сохраняет контраст и напряжение еврейского текста, не перегружая фразу архаизмами.
