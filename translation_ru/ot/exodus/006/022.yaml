  text: 'Сыновья Уззиила: Мисаил, Елцафан и Ситри.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Сыновья
  rationale: 'Сочетание בְנֵי — обычная конструкция родословного перечня «сыновья (кого-либо)». Начальный союз ו в русском перечислении естественно не выражать: двоеточие сохраняет структуру и связь с контекстом без тяжеловесного «И».'
- source_word: עֻזִּיאֵל
  choice: Уззиил
  rationale: Личное имя передано транслитерацией с сохранением удвоенного согласного, отражённого дагешем в זּ.
- source_word: מִישָׁאֵל
  choice: Мисаил
  rationale: Личное имя передано в принятой русской библейской форме, близкой к еврейскому звучанию.
- source_word: וְ/אֶלְצָפָן
  choice: Елцафан
  rationale: Личное имя с соединительным союзом; выбрана узнаваемая русская библейская форма. Союз ו передан как «и» перед последним членом перечня, а не повторён после двоеточия.
- source_word: וְ/סִתְרִי
  choice: и Ситри
  rationale: Личное имя передано близко к масоретской форме; начальный союз выражен русским «и», естественно завершающим перечень.
