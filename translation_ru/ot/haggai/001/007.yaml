  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/007.yaml
  text: 'Thus says Yahweh of hosts: Consider your ways.'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Задумайтесь о своих путях[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Направьте своё сердце на свои пути».'
    reason: Сноска сохраняет образную форму древнееврейской идиомы שִׂימוּ לְבַבְכֶם עַל, тогда как основной текст передаёт её естественным современным русским выражением.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая пророческая формула; настоящее время естественно передаёт функцию древнееврейского перфекта в формуле речи посланника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в древнееврейском тексте, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет широту традиционного библейского титула, не ограничивая его значение только земными или только небесными войсками.
- source_word: שִׂימוּ לְבַבְכֶם עַל
  choice: Задумайтесь о
  rationale: Естественно передаёт идиому «положить/направить сердце на», то есть внимательно и серьёзно обдумать; буквальный образ сохранён в сноске.
- source_word: דַּרְכֵיכֶם
  choice: своих путях
  rationale: Сохраняет метафору путей и её контекстуальный смысл — образ жизни, поступки и их последствия.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Смысл титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф / Яхве небесных воинств
  rationale: «Воинств» сохраняет намеренную широту צְבָאוֹת и не вносит отсутствующего в стихе уточнения «небесных».
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой формулой. Повеление обращено ко множеству людей; возвратное «своих» естественно согласуется с подразумеваемым «вы». Кавычки ясно отделяют прямую речь Яхве от вводной формулы.
