lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: в двадцать четвёртый день
  rationale: В еврейской формуле даты предлог בְּ имеет временное значение, а количественное числительное передаётся естественным для русского обозначения даты порядковым числительным.
- source_word: לַחֹדֶשׁ בַּשִּׁשִּׁי
  choice: шестого месяца
  rationale: Предлог לְ вводит указание месяца; сочетание естественно передаётся родительным падежом, а בַּשִּׁשִּׁי уточняет, что это шестой месяц.
- source_word: בִּשְׁנַת שְׁתַּיִם
  choice: во второй год
  rationale: Стандартная формула года правления в современном русском языке требует порядкового числительного.
- source_word: לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: царя Дария
  rationale: Предлог לְ указывает, чьё правление датирует событие; русская формула «во второй год царя Дария» естественна и сохраняет царский титул.
