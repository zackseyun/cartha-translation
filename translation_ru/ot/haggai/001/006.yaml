base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/006.yaml
  text: You have sown much[a], but brought in little. You eat, but there is not enough to be satisfied; you drink, but there is not enough to be filled; you clothe yourselves, but no one is warm[c][b]; and the one who earns wages earns them for a bag with holes.
translation:
  language: ru
  text: Вы много сеете, а собираете мало[a]. Едите, но не насыщаетесь; пьёте, но не хмелеете[b]; одеваетесь, но никому не тепло[c]; а тот, кто зарабатывает плату, зарабатывает для дырявого кошелька.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а приносите мало» — то есть собираете скудный урожай.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но не напиваетесь допьяна». Еврейское выражение говорит именно об опьянении, а не просто об утолении жажды.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «но ему не тепло». Единственное число употреблено здесь в обобщающем смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרַעְתֶּם הַרְבֵּה וְהָבֵא מְעָט
  choice: Вы много сеяли, а собрали мало
  rationale: Формы обращены ко множеству слушателей. «Собрали» естественно передаёт земледельческую идиому «принесли [урожая] мало», а сноска сохраняет буквальный образ.
- source_word: אָכוֹל וְאֵין לְשָׂבְעָה
  choice: Едите, но не насыщаетесь
  rationale: Краткая русская формулировка сохраняет параллелизм и обозначает еду без достижения сытости.
- source_word: שָׁתוֹ וְאֵין לְשָׁכְרָה
  choice: пьёте, но не хмелеете
  rationale: Корень שׁכר конкретно связан с опьянением; «не хмелеете» точно и естественно сохраняет этот смысл, не заменяя его утолением жажды.
- source_word: לָבוֹשׁ וְאֵין לְחֹם לוֹ
  choice: одеваетесь, но никому не тепло
  rationale: Единственное местоимение имеет обобщающий смысл; «никому» естественно передаёт его по-русски.
- source_word: וְהַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר
  choice: а тот, кто зарабатывает плату
  rationale: Передаёт наёмного работника и повтор корня через сочетание «зарабатывает плату», не утяжеляя фразу неестественным дословным повтором.
- source_word: אֶל צְרוֹר נָקוּב
  choice: складывает её в дырявый кошель
  rationale: «Кошель» обозначает мешочек для денег и ясно сохраняет образ продырявленного вместилища, из которого исчезает заработок.
theological_decisions:
- issue: Значение לְשָׁכְרָה
  choice: не хмелеете
  alternative: не напиваетесь досыта / не утоляете жажды
  rationale: Еврейское слово указывает именно на опьянение. Перевод сохраняет неудобную, но подлинную конкретность текста и не смягчает её до общего насыщения питьём.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом и параллельными конструкциями. Формулировки понятны широкому читателю; образ «дырявого кошеля» сохраняет достоинство и предметность оригинала.
