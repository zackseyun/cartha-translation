base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
translation:
  language: ru
  text: 'Так говорит Яхве Воинств: «Этот народ говорит[a]: „Ещё не пришло время — время, чтобы дом Яхве был отстроен[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этот народ — они сказали». В еврейском тексте собирательное слово «народ» стоит в единственном числе, а глагол — во множественном; выражение «этот народ» может также передавать оттенок дистанции или укора.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «быть построенным». Сам еврейский инфинитив прямо не выражает повторности строительства, но контекст периода после возвращения из плена указывает на восстановление храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка торжественная формула пророческой речи; перфект אָמַר в формуле передачи вести передан настоящим временем.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Яхве и ёмкость титула צְבָאוֹת, который может охватывать небесные и земные воинства, не сужая его до одного значения.
- source_word: הָעָם הַזֶּה
  choice: Этот народ
  rationale: Близко передаёт единственное число и указательное местоимение; сочетание способно выражать дистанцирование или укор.
- source_word: אָמְרוּ
  choice: говорит
  rationale: В еврейском сказуемое стоит во множественном числе при собирательном существительном; в нормативном русском согласование с «народ» требует единственного числа.
- source_word: לֹא עֶת בֹּא עֶת
  choice: Ещё не пришло время — время
  rationale: Сохраняет повтор עֶת и его риторическое ударение. «Ещё не» естественно выражает мысль о том, что срок, по словам народа, пока не наступил.
- source_word: בֵּית יְהוָה
  choice: дому Яхве
  rationale: Сохраняет исходный образ «дома», не заменяя его толковательным словом «храм».
- source_word: לְהִבָּנוֹת
  choice: быть отстроенным
  rationale: Передаёт пассивное значение нифаля и в послепленном контексте указывает на восстановление прежде существовавшего храма; сноска сохраняет более буквальную возможность «быть построенным».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Оттенок הָעָם הַזֶּה
  choice: Этот народ
  alternative: Этот народ здесь; эти люди
  rationale: «Этот народ» сохраняет коллективное обозначение и допускает заложенный в контексте оттенок дистанции или укора, не усиливая его добавочными словами.
- issue: Исторический смысл לְהִבָּנוֹת
  choice: быть отстроенным
  alternative: быть построенным
  rationale: Контекст после возвращения из плена подразумевает восстановление храма, однако приставочное значение отсутствует в самом инфинитиве; поэтому формальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаическим звучанием. Повтор «время — время» намеренно сохраняет резкость и эмфазу еврейской конструкции; «дом Яхве» удерживает библейский образ исходного текста.
