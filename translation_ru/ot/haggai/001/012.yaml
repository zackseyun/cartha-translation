base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/012.yaml
  text: Then Zerubbabel son of Shealtiel[a], and Joshua son of Jehozadak, the high priest, and all the remnant of the people, listened to the voice of Yahweh their God and to the words of Haggai the prophet, as Yahweh their God had sent him[d][c][b]; and the people feared before Yahweh.
translation:
  language: ru
  text: Тогда Зоровавель, сын Салафииля, Иисус, сын Иоседека, первосвященник, и весь остаток[b] народа вняли[a] голосу Яхве, их Бога, и словам пророка Аггея, как послал его Яхве, их Бог[c]. И народ испытывал страх перед Яхве[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышали» или «послушались»; еврейский глагол может обозначать слушание, сопровождаемое вниманием и откликом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все остальные из народа»; слово «остаток» сохраняет характерный для пророков оттенок уцелевшей общины.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поскольку Яхве, их Бог, послал его». Еврейский оборот может выражать как соответствие, так и причину.'
    reason: alternative_reading
  - marker: d
    text: 'Или: «благоговел перед Яхве» или «трепетал перед Яхве»; еврейское слово может выражать и страх, и благоговейный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: вняли
  rationale: Глагол שׁמע может обозначать слышание, внимательное слушание и послушный отклик. «Вняли» сохраняет сочетание восприятия и готовности откликнуться, не утверждая однозначно уже совершившееся послушание.
- source_word: שְׁאֵרִית הָעָם
  choice: остаток народа
  rationale: «Остаток» передаёт не только значение «остальные», но и характерный для пророческой речи смысл уцелевшей общины.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Это естественное и общепринятое русское обозначение главного священника; буквальное «великий священник» здесь неидиоматично.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיהֶם
  choice: голосу Яхве, своего Бога
  rationale: Сочетание שׁמע בְּקוֹל означает внимать чьему-либо голосу. Возвратное «своего» естественно связывает Бога с составным подлежащим.
- source_word: דִּבְרֵי חַגַּי הַנָּבִיא
  choice: словам пророка Аггея
  rationale: «Слова» сохраняют конкретность множественного דִּבְרֵי и параллель с «голосом», не сводя выражение к абстрактному «посланию».
- source_word: כַּאֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם
  choice: поскольку Яхве, их Бог, послал его
  rationale: В контексте оборот естественно указывает на основание принятия слов Аггея — его посланничество от Бога. Синтаксически возможный оттенок соответствия сохраняется в примечании.
- source_word: וַיִּירְאוּ הָעָם מִפְּנֵי יְהוָה
  choice: народ боялся Яхве
  rationale: Простое «боялся» сохраняет диапазон ירא — от страха до благоговейного трепета — и не снимает смыслового напряжения в пользу одного оттенка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не заменой титулом, сохраняет различие между יהוה и אֱלֹהִים.
theological_decisions:
- issue: Значение שְׁאֵרִית в пророческом контексте
  choice: остаток народа
  alternative: остальные из народа
  rationale: «Остаток» сохраняет пророческий и историко-богословский оттенок уцелевшей общины, не исключая обычного значения оставшейся части народа.
- issue: Характер отклика, выраженного וַיִּשְׁמַע
  choice: вняли
  alternative: послушались; услышали
  rationale: «Послушались» сильнее утверждает исполнение, а «услышали» может означать лишь слуховое восприятие. «Вняли» удерживает обе стороны значения.
- issue: Отношение придаточного כַּאֲשֶׁר שְׁלָחוֹ к предшествующим словам
  choice: поскольку Яхве, их Бог, послал его
  alternative: как и послал его Яхве, их Бог
  rationale: Причинное понимание хорошо объясняет, почему народ принял слова пророка, но еврейский оборот допускает и значение соответствия; поэтому альтернатива указана в примечании.
- issue: Характер страха перед Яхве
  choice: боялся Яхве
  alternative: благоговел перед Яхве; трепетал перед Яхве
  rationale: Нейтральное «боялся» не сводит ירא исключительно ни к ужасу, ни к благоговению.
translation_notes:
  register: 'Современный литературный русский с умеренно высоким библейским регистром. Имена переданы в привычных русских библейских формах: Зоровавель, Салафииль, Иисус, Иоседек, Аггей. «Вняли» выбрано как достоинственное, но понятное слово, позволяющее передать и слушание, и отзывчивость; архаические синтаксические конструкции избегаются.'
