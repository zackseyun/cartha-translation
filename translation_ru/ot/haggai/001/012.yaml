  naturalness: «Вняли» уместно в умеренно высоком библейском регистре и не является непонятным архаизмом. Исправленное «голосу Яхве, их Бога» грамматически корректно. «Народ испытывал страх перед Яхве» — современная литературная конструкция, сохраняющая сдержанный библейский тон.
