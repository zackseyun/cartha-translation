  text: הַ/עֵ֤ת לָ/כֶם֙ אַתֶּ֔ם לָ/שֶׁ֖בֶת בְּ/בָתֵּי/כֶ֣ם סְפוּנִ֑ים וְ/הַ/בַּ֥יִת הַ/זֶּ֖ה חָרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/004.yaml
  text: Is it a time for you yourselves to live in your paneled houses while this house lies in ruins?[a]
translation:
  language: ru
  text: Время ли вам самим жить в своих домах, обшитых деревом, тогда как этот дом лежит в развалинах?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в домах, обшитых панелями»; возможен также смысл: «в домах с отделанными потолками».'
    reason: 'Лексическая альтернатива: סְפוּנִים обозначает покрытые или обшитые поверхности, в том числе деревянную обшивку; в некоторых толкованиях — отделанный потолок.'
lexical_decisions:
- source_word: הַעֵת
  choice: Время ли
  rationale: Вопросительная конструкция перекликается со словами народа о том, что время ещё не пришло (ст. 2), и сохраняет существительное עֵת — «время, срок».
- source_word: לָכֶם אַתֶּם
  choice: вам самим
  rationale: Самостоятельное местоимение אַתֶּם усиливает уже выраженное местоименное значение в לָכֶם; «вам самим» передаёт этот риторический акцент.
- source_word: לָשֶׁבֶת
  choice: жить
  rationale: В сочетании с обозначением дома глагол ישׁב означает проживание; «жить» естественно звучит по-русски.
- source_word: בְּבָתֵּיכֶם
  choice: в своих ... домах
  rationale: Слово «домах» сохраняет явное противопоставление личных домов «этому дому»; возвратное «своих» естественно передаёт принадлежность при русском подлежащем.
- source_word: סְפוּנִים
  choice: отделанных
  rationale: Причастие обозначает дома, покрытые или обшитые, вероятно панелями. «Отделанных» естественно и достаточно широко сохраняет образ завершённого, благоустроенного жилья; более конкретные варианты указаны в примечании.
- source_word: וְהַבַּיִת הַזֶּה
  choice: тогда как этот дом
  rationale: Союз וְ в данном риторическом сопоставлении имеет контрастную силу; «тогда как» ясно передаёт противопоставление, не заменяя «этот дом» словом «храм».
- source_word: חָרֵב
  choice: лежит в развалинах
  rationale: Прилагательное указывает на разорённое, опустошённое состояние. Русское выражение передаёт как разрушение, так и продолжающееся запустение.
theological_decisions:
- issue: К чему относится выражение «этот дом»
  choice: Сохранено «этот дом»; из контекста это храм Господа.
  alternative: Прямо сказать в тексте «этот храм».
  rationale: В ближайшем контексте (Агг. 1:2, 8–9) речь явно идёт о храме, однако сохранение буквального выражения «этот дом» не вносит пояснение непосредственно в основной текст.
translation_notes:
  register: Современный литературный русский язык с краткой пророческой риторикой. Инверсия «Время ли» сохраняет торжественный вопрос, оставаясь понятной современному читателю; противопоставление личного благоустройства и запустения храма выражено без конфессиональных добавлений.
