  text: וַ/יָּ֣עַר יְהוָ֡ה אֶת רוּחַ֩ זְרֻבָּבֶ֨ל בֶּן שַׁלְתִּיאֵ֜ל פַּחַ֣ת יְהוּדָ֗ה וְ/אֶת ר֨וּחַ֙ יְהוֹשֻׁ֤עַ בֶּן יְהוֹצָדָק֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְֽ/אֶת ר֔וּחַ כֹּ֖ל שְׁאֵרִ֣ית הָ/עָ֑ם וַ/יָּבֹ֨אוּ֙ וַ/יַּעֲשׂ֣וּ מְלָאכָ֔ה בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/014.yaml
  text: And Yahweh stirred up the spirit of Zerubbabel son of Shealtiel[a], governor of Judah, and the spirit of Joshua son of Jehozadak, the high priest, and the spirit of all the remnant of the people; and they came and did work on the house of Yahweh of Armies, their God.
translation:
  language: ru
  text: И Яхве пробудил дух Зоровавеля, сына Шеалтиила, правителя Иудеи, и дух Иисуса, сына Иехоцадака, первосвященника, и дух всего остатка народа. Они пришли и трудились над домом Яхве Воинств[a], их Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционной передаче: «Господа Саваофа».'
    reason: Лексическая и традиционная альтернатива для יְהוָה צְבָאוֹת.
lexical_decisions:
- source_word: וַיָּעַר
  choice: пробудил
  rationale: Глагол обозначает побуждение или пробуждение к действию; «пробудил дух» естественно передаёт образ исходного текста, не уточняя сверх меры способ Божьего воздействия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: רוּחַ
  choice: дух
  rationale: 'Сохраняет многозначность еврейского слова: здесь речь может идти о внутреннем расположении и побуждении, однако перевод не сводит его лишь к психологическому настрою.'
- source_word: פַּחַת יְהוּדָה
  choice: правителя Иудеи
  rationale: «Правитель» понятно передаёт административную должность персидского периода и естественно звучит по-русски.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященника
  rationale: Устоявшийся русский эквивалент данного священнического титула.
- source_word: כֹּל שְׁאֵרִית הָעָם
  choice: всего остатка народа
  rationale: «Остаток» сохраняет характерное для пророческих книг богословское звучание, тогда как «остальные» могло бы его сгладить.
- source_word: וַיָּבֹאוּ
  choice: они пришли
  rationale: Прямо передаёт повествовательную форму глагола без добавочного истолкования.
- source_word: וַיַּעֲשׂוּ מְלָאכָה
  choice: трудились
  rationale: Естественно по-русски передаёт выражение «делали работу», не вводя явно отсутствующего в форме глагола указания «начали».
- source_word: בְּבֵית
  choice: над Домом
  rationale: Контекст восстановления храма требует значения работы над зданием, а не только деятельности внутри него.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя и передаёт צְבָאוֹת понятным словом «Воинства», оставляя традиционный вариант в сноске.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: Возвратное притяжательное местоимение естественно соотносит Бога с подлежащим «они» и передаёт еврейский суффикс третьего лица множественного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение שְׁאֵרִית
  choice: остаток
  alternative: остальные
  rationale: «Остаток» сохраняет возможный заветный и пророческий оттенок слова, не превращая его исключительно в нейтральное обозначение оставшихся людей.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф
  rationale: Основной текст делает смысл צְבָאוֹת доступнее современному читателю и сохраняет имя Яхве; традиционная церковная форма приведена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён до двух предложений ради ясности; повтор «дух» сохранён, поскольку он структурно и богословски значим. Слово «Дом» написано с прописной буквы как контекстуальное обозначение храма.
