    rationale: «Салафиилова» и «Иоседекова» звучат по-церковнославянски и не соответствуют современному литературному регистру; приложение «сын Шеалтиила / сын Иехоцадака» ясно и современно.
  - severity: low
    issue: «Своего Бога» излишне возвратно.
    rationale: אֱלֹהֵיהֶם означает «их Бога». Русское «своего» может быть принято, но «их» точнее сохраняет форму исходного текста и яснее после нескольких групп в первом предложении.
