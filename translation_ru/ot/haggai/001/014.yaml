  verdict: revise
  source_fidelity: 'В целом переданы все основные элементы стиха: побуждение Яхве, троекратный «дух», должности, «остаток», приход и работа при Доме. Однако формы «Салафиилова» и «Иоседекова» следуют традиционным греко-славянским соответствиям, а не непосредственно еврейским שַׁלְתִּיאֵל и יְהוֹצָדָק; для перевода, проверяемого по WLC, предпочтительны «Шеалтиил» и «Иехоцадак». «Своего Бога» допустимо, но несколько меняет простой суффикс 3-го лица множественного числа в сторону возвратного значения; «их Бога» точнее.'
  naturalness: Двухфразное членение естественно для современного литературного русского. Но генитивные формы фамильного типа «Салафиилова», «Иоседекова» архаичны и не соответствуют заявленному регистру. Фраза «Домом Яхве Воинств, своего Бога» читается менее ясно, чем вариант с «их Бога».
  terminology: «Яхве», «дух», «правитель Иудеи», «первосвященник» и «остаток народа» уместны. «Яхве Воинств» последовательно передаёт выбранный смысл титула יְהוָה צְבָאוֹת; традиционный вариант в сноске сохранён. «Дом» с прописной буквы возможен как обозначение храма, но строчная буква нейтральнее и не добавляет редакционного оформления.
  issues:
  - severity: medium
    issue: Имена «Салафиил» и «Иоседек» не отражают непосредственно формы WLC.
    rationale: Еврейский текст имеет שַׁלְתִּיאֵל (Шеалтиил) и יְהוֹצָדָק (Иехоцадак). Традиционные русские формы могут быть известны читателю, но опираются на иной передаточный путь и не являются оптимально-эквивалентными по отношению к указанному источнику.
  - severity: low
