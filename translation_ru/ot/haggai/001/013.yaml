base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/013.yaml
  text: Then Haggai[a], the messenger of Yahweh, spoke to the people with Yahweh’s message, saying[b], “I am with you,” declares Yahweh.
translation:
  language: ru
  text: 'Тогда Аггей, посланник Яхве[a], сказал народу по поручению Яхве[b]: «Я с вами», — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать как «посланник», так и «ангел». Здесь оно относится к пророку Аггею как к посланнику Яхве, а не к ангельскому существу.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение можно также перевести: «с вестью Яхве» или «в качестве посланника Яхве». Оно указывает на поручение, посланническую роль или весть, с которой говорил Аггей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: обратился
  rationale: Обычный глагол «сказать» здесь вводит обращённую к народу пророческую речь; «обратился к народу» естественно передаёт речевой акт по-русски.
- source_word: מַלְאַךְ יְהוָה
  choice: посланник Яхве
  rationale: Имя Аггея и контекст указывают на человека, уполномоченного Богом, а не на ангельское существо.
- source_word: בְּמַלְאֲכוּת יְהוָה
  choice: исполняя поручение Яхве
  rationale: Редкое существительное может обозначать посланническое служение, поручение или передаваемую весть. Выбранная формулировка ясно выражает полномочие, в силу которого говорил Аггей, не сводя выражение только к содержанию речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: לָעָם
  choice: к народу
  rationale: Речь обращена к собравшемуся народу завета; это естественный и точный русский эквивалент.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Целевой инфинитив служит формальным введением цитаты; в современном русском его функцию естественно выполняет пунктуационное оформление прямой речи.
- source_word: אֲנִי אִתְּכֶם
  choice: Я с вами
  rationale: Сохранена краткость и значимая для отношений завета формула присутствия и поддержки; множественное число адресата ясно из обращения к народу.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Устойчивая пророческая формула передана современно и торжественно, с сохранением божественного авторитета высказывания.
theological_decisions:
- issue: Значение מַלְאַךְ применительно к Аггею
  choice: человеческий «посланник»
  alternative: «ангел Яхве»
  rationale: Аггей прямо назван носителем этой роли; контекст описывает пророка как уполномоченного вестника и не вводит отдельное небесное существо.
- issue: Смысл בְּמַלְאֲכוּת יְהוָה
  choice: исполняя поручение Яхве
  alternative: «с вестью Яхве» или «в качестве посланника Яхве»
  rationale: Еврейское выражение допускает оттенки поручения, посланнической функции и вести. Основной текст передаёт полномочие, а примечание сохраняет реальную лексическую неоднозначность.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: «Господь» или «Иегова»
  rationale: Личное имя сохраняется как имя, без замены титулом; форма «Яхве» соответствует принятой научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой формулой. Синтаксис сделан естественным для публичного чтения; лексическая неоднозначность редкого выражения вынесена в примечание.
