  text: בִּ/שְׁנַ֤ת שְׁתַּ֨יִם֙ לְ/דָרְיָ֣וֶשׁ הַ/מֶּ֔לֶךְ בַּ/חֹ֨דֶשׁ֙ הַ/שִּׁשִּׁ֔י בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָ֨ה דְבַר יְהוָ֜ה בְּ/יַד חַגַּ֣י הַ/נָּבִ֗יא אֶל זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֧עַ בֶּן יְהוֹצָדָ֛ק הַ/כֹּהֵ֥ן הַ/גָּד֖וֹל לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/001.yaml
  text: 'In the second year of King Darius[a], in the sixth month, on the first day of the month, the word of Yahweh came by the hand of Haggai the prophet to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Jehozadak, the high priest, saying:'
translation:
  language: ru
  text: 'Во второй год царя Дария, в шестой месяц, в первый день месяца, слово Яхве пришло через пророка Аггея[a] к Зоровавелю, сыну Салафииля, правителю Иудеи, и к Иисусу, сыну Иоседека, первосвященнику, с такими словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой пророка Аггея».'
    reason: Сноска сохраняет буквальный образ еврейской идиомы בְּיַד, тогда как основной текст передаёт её значение естественным русским выражением.
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: Во второй год царя Дария
  rationale: Царская датировочная формула передана естественным русским оборотом; количественное «два» в данном контексте имеет порядковое значение.
- source_word: בַּחֹדֶשׁ הַשִּׁשִּׁי בְּיוֹם אֶחָד לַחֹדֶשׁ
  choice: в шестой месяц, в первый день месяца
  rationale: Сохранена числовая датировка без подстановки позднейшего названия месяца; אֶחָד в календарной формуле передано порядковым числительным.
- source_word: הָיָה דְבַר יְהוָה
  choice: слово Яхве пришло
  rationale: Устойчивая пророческая формула передана ясным русским выражением, обозначающим получение откровения, без добавления отсутствующего в тексте содержания.
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: через пророка Аггея
  rationale: Еврейская идиома «рукой Аггея» выражает посредничество; естественный русский эквивалент вынесен в текст, а буквальный образ отмечен в сноске.
- source_word: פַּחַת יְהוּדָה
  choice: правителю Иудеи
  rationale: פֶּחָה обозначает областного правителя персидского периода; «правитель» понятно современному читателю и не навязывает более узкий административный титул.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященнику
  rationale: Принятый и точный русский эквивалент выражения «великий священник».
- source_word: לֵאמֹר
  choice: 'с такими словами:'
  rationale: Формула введения прямой речи передана естественно по-русски и подготовляет последующую цитату.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; передача личным именем сохраняет различие между именем Бога и титулом.
- issue: Посредническая формула בְּיַד
  choice: через пророка Аггея
  alternative: рукой пророка Аггея
  rationale: Выбрана естественная русская передача значения посредничества; буквальная форма сохранена в сноске, чтобы не утратить образность исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством пророческого повествования. Сохранены повтор слова «месяц», официальные титулы и последовательность адресатов; чрезмерно архаические формы устранены.
