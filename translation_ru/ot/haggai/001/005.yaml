source:
  edition: WLC
  text: וְ/עַתָּ֕ה כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/005.yaml
  text: 'Now therefore[a], thus says Yahweh of hosts: Set your heart on your ways.'
translation:
  language: ru
  text: 'Итак, так говорит Яхве Воинств: задумайтесь о своих путях.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обратите своё сердце к своим путям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Сочетание союза с наречием времени здесь подводит вывод из предшествующего обличения и вводит призыв; «итак» естественно передаёт эту смысловую связь.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Обычная пророческая формула вестника; настоящее время естественно звучит по-русски и сохраняет авторитетность провозглашения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе титула сохраняет традиционный широкий образ Яхве как Владыки небесных и земных сил, не ограничивая значение только одним видом войска.
- source_word: שִׂימוּ לְבַבְכֶם
  choice: задумайтесь
  rationale: Буквально выражение означает «положите/обратите своё сердце»; в данном контексте это идиоматический призыв к серьёзному размышлению и самооценке. Русское «задумайтесь» передаёт смысл естественно, а буквальный образ отмечен в сноске.
- source_word: עַל דַּרְכֵיכֶם
  choice: о своих путях
  rationale: «Пути» сохраняют еврейскую метафору образа жизни и поступков; предлог «о» обусловлен естественным русским управлением глагола «задуматься».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл призыва שִׂימוּ לְבַבְכֶם עַל דַּרְכֵיכֶם
  choice: задумайтесь о своих путях
  alternative: обратите своё сердце к своим путям
  rationale: Выражение призывает народ внимательно оценить свой образ жизни. Основной текст передаёт идиоматический смысл, не уточняя заранее нравственный итог этой оценки; буквальная сердечная метафора сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формула «так говорит» и титул «Яхве Воинств» сохраняют библейскую торжественность; основной призыв сформулирован понятно и естественно. Маркер сноски помещён непосредственно после соответствующей фразы.
