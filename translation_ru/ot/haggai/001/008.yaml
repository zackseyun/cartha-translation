  text: עֲל֥וּ הָ/הָ֛ר וַ/הֲבֵאתֶ֥ם עֵ֖ץ וּ/בְנ֣וּ הַ/בָּ֑יִת וְ/אֶרְצֶה בּ֥/וֹ ו/אכבד אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/008.yaml
  text: Go up into the hills[a], bring wood, and build the house, so that I may take pleasure in it and be glorified[c][b], says Yahweh.
translation:
  language: ru
  text: Поднимитесь в горы[a], принесите древесину и постройте дом[b], чтобы Я был доволен им и прославлен[c], — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на гору» или «в горную местность». Еврейское הָהָר может обозначать гору, холм либо гористую местность.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть храм; буквально: «дом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и был почитаем». Еврейский глагол может означать «быть прославленным» или «быть почитаемым».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲלוּ
  choice: Поднимитесь
  rationale: Форма повелительного наклонения множественного числа от עלה выражает прямое повеление двигаться вверх; «поднимитесь» естественно передаёт это в современном русском языке.
- source_word: הָהָר
  choice: в горы
  rationale: Слово הַר может обозначать гору, холм или гористую местность. По контексту заготовки древесины множественное «в горы» естественно указывает на горную местность, не исключая буквального понимания как конкретной горы.
- source_word: וַהֲבֵאתֶם עֵץ
  choice: принесите древесину
  rationale: עֵץ здесь выступает как собирательное обозначение строительного материала. «Древесина» точнее, чем «дерево», передаёт назначение материала в данном контексте.
- source_word: וּבְנוּ
  choice: и постройте
  rationale: Повелительная форма от בנה означает «строить, построить». В перевод не добавлено «восстановите», хотя исторически речь идёт о восстановлении храма.
- source_word: הַבָּיִת
  choice: дом
  rationale: Буквальное значение בַּיִת — «дом»; в контексте Аггея это храм Яхве. Основной текст сохраняет исходный образ, а значение поясняется в сноске.
- source_word: וְאֶרְצֶה בּוֹ
  choice: чтобы Я благоволил к нему
  rationale: Глагол רצה может означать благоволение, удовольствие или благосклонное принятие. Конструкция с «чтобы» передаёт целевую связь между повелениями и ожидаемым Божьим откликом.
- source_word: וְאֶכָּבֵד
  choice: и был прославлен
  rationale: Форма от כבד допускает пассивное значение «быть прославленным» или «быть почитаемым». «Был прославлен» сохраняет залог и богословскую весомость выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом.
- issue: Передача הַבָּיִת в храмовом контексте
  choice: дом
  alternative: храм
  rationale: Речь несомненно идёт о храме, однако еврейский текст употребляет слово «дом». Его сохранение не устраняет ясность контекста и позволяет удержать исходную образность.
- issue: Значение וְאֶכָּבֵד
  choice: был прославлен
  alternative: был почитаем; явил Свою славу
  rationale: Пассивная формулировка сохраняет грамматическую и смысловую неоднозначность между прославлением и почитанием; активное «явил Свою славу» сильнее истолковывает форму и потому не выбрано.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Повеления переданы ясно и прямо; буквальный образ «дома» сохранён без конфессионального уточнения. Местоимение «Я» написано с прописной буквы как принятое в русском религиозном регистре.
