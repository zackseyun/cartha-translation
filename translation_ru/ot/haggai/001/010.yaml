lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим обличением естественно и ясно.
- source_word: עֲלֵיכֶם
  choice: над вами
  rationale: При слове «небеса» пространственное значение предлога наиболее естественно.
- source_word: כָּלְאוּ / כָּלְאָה
  choice: не дают / не даёт
  rationale: Глагол כלא означает удерживать или не допускать. В русском сочетания «небеса не дают росы» и «земля не даёт урожая» естественно передают единый повторяющийся образ.
- source_word: שָמַיִם
  choice: небеса
  rationale: Сохраняет библейскую возвышенность и поэтическую пару «небеса — земля», оставаясь понятным современному читателю.
- source_word: מִטָּל
  choice: росы
  rationale: После כלא предлог מן указывает на то, что удерживается; русская конструкция «не дают росы» передаёт смысл без неестественной буквальности.
- source_word: וְהָאָרֶץ
  choice: и земля
  rationale: «Земля» сохраняет как смысл почвы или земли, так и поэтическое противопоставление небесам.
- source_word: יְבוּלָהּ
  choice: своего урожая
  rationale: יְבוּל обозначает произведённый землёй урожай или плод; «урожай» ясно выражает земледельческий контекст.
