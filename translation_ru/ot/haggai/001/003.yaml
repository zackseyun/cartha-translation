  text: 'Тогда слово Яхве пришло через пророка Аггея[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой пророка Аггея» — еврейская идиома, означающая передачу слова через посредника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Формула продолжает повествование и вводит новое событие; «И было» естественно сочетается с устойчивой пророческой формулой «слово Яхве». Формально возможное «И случилось» здесь по-русски звучало бы тяжеловесно.
- source_word: דְּבַר
  choice: слово
  rationale: В пророческой формуле обозначает переданное Богом слово или весть; «слово» сохраняет библейскую формулу и связь с откровением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет употреблённое в еврейском тексте имя Бога, не заменяя его титулом.
- source_word: בְּיַד
  choice: через
  rationale: Буквально «рукой»; в данной формуле это идиома посредничества. Русское «через» ясно и естественно передаёт роль Аггея как посредника, тогда как «рукой Аггея» могло бы быть ошибочно понято буквально.
- source_word: חַגַּי
  choice: Аггея
  rationale: Использована закрепившаяся в русской библейской традиции форма имени Аггей, поставленная в родительном падеже после предлога «через».
- source_word: הַנָּבִיא
  choice: пророка
  rationale: Определение при имени указывает на служение Аггея; порядок «через пророка Аггея» естественен для современного русского языка.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно выполняет двоеточие; буквальное «говоря» здесь было бы синтаксически неуклюжим.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» передаёт его как имя, не подменяя титулом; форма «Иегова» основана на более позднем смешанном чтении.
- issue: Посредничество пророка в выражении בְּיַד
  choice: через пророка Аггея
  alternative: рукой пророка Аггея
  rationale: Выражение указывает на посредническую роль пророка, но не уточняет механизм вдохновения. Идиоматический перевод сохраняет эту роль, не создавая в русском ложного буквального образа.
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой формулы. Краткая конструкция подготавливает прямую речь следующего стиха; двоеточие естественно передаёт функцию לֵאמֹר. Маркер сноски поставлен непосредственно после имени.
