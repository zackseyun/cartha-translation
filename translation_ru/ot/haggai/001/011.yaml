  text: וָ/אֶקְרָ֨א חֹ֜רֶב עַל הָ/אָ֣רֶץ וְ/עַל הֶ/הָרִ֗ים וְ/עַל הַ/דָּגָן֙ וְ/עַל הַ/תִּיר֣וֹשׁ וְ/עַל הַ/יִּצְהָ֔ר וְ/עַ֛ל אֲשֶׁ֥ר תּוֹצִ֖יא הָ/אֲדָמָ֑ה וְ/עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַ֖ל כָּל יְגִ֥יעַ כַּפָּֽיִם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
translation:
  language: ru
  text: И Я призвал засуху на землю и на горы, на зерно, на молодое вино, на оливковое масло[a], на всё, что производит почва, на человека[b] и на скот, и на всякий труд рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально речь идёт о свежем масле как продукте урожая; обычно имеется в виду оливковое масло.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «людей». Еврейское слово אָדָם здесь употреблено в единственном числе в общем значении — обо всех людях.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: И Я призвал
  rationale: Глагол קרא здесь означает призвать, вызвать наступление бедствия. «Призвал засуху» сохраняет образ намеренно вызванного Божьего суда и звучит естественно в пророческой речи.
- source_word: חֹרֶב
  choice: засуху
  rationale: В сельскохозяйственном контексте слово обозначает иссушающую засуху, поражающую землю, урожай, людей и животных.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Речь идёт о земле страны и её сельскохозяйственных угодьях, а не обо всей планете.
- source_word: הֶהָרִים
  choice: горы
  rationale: Прямой и естественный эквивалент, сохраняющий пророческую образность.
- source_word: הַדָּגָן
  choice: зерно
  rationale: Общее обозначение зерновых культур и их урожая.
- source_word: הַתִּירוֹשׁ
  choice: молодое вино
  rationale: תִּירוֹשׁ обозначает свежее вино или виноградный продукт нового урожая; «молодое вино» передаёт это значение без чрезмерного уточнения стадии брожения.
- source_word: הַיִּצְהָר
  choice: оливковое масло
  rationale: Слово обозначает свежее растительное масло как сельскохозяйственный продукт, обычно оливковое. Уточнение устраняет возможное в современном русском понимание слова «масло» как сливочного.
- source_word: אֲשֶׁר תּוֹצִיא הָאֲדָמָה
  choice: всё, что производит почва
  rationale: Сохраняется широкое значение всех плодов земли и конкретный сельскохозяйственный образ почвы, приносящей урожай.
- source_word: הָאָדָם
  choice: человека
  rationale: Единственное число в еврейском тексте имеет собирательное значение и образует риторическую пару со скотом; русский язык допускает такое родовое употребление.
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: В данном аграрном контексте слово прежде всего указывает на домашних животных; «скот» естественно сочетается с перечислением последствий засухи.
- source_word: כָּל יְגִיעַ כַּפָּיִם
  choice: весь труд рук
  rationale: Передаёт как тяжёлый человеческий труд, так и его плоды, сохраняя образ рук из исходного текста.
theological_decisions:
- issue: Родовое значение הָאָדָם
  choice: человека
  alternative: людей / человечество
  rationale: Форма единственного числа сохранена ради параллели «человек — скот», но её собирательное, а не исключительно мужское значение пояснено в сноске.
- issue: Характер Божьего действия в וָאֶקְרָא חֹרֶב
  choice: Я призвал засуху
  alternative: Я навёл засуху
  rationale: Выбранный вариант сохраняет метафору призывания из исходного текста и ясно выражает Божью инициативу, не сводя её к безличному природному процессу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор предлога «на» сохранён, чтобы передать нарастающий ритм еврейского перечисления. Местоимение «Я» написано с прописной буквы как прямая речь Бога.
