source:
  edition: WLC
  text: פָּנֹ֤ה אֶל הַרְבֵּה֙ וְ/הִנֵּ֣ה לִ/מְעָ֔ט וַ/הֲבֵאתֶ֥ם הַ/בַּ֖יִת וְ/נָפַ֣חְתִּי ב֑/וֹ יַ֣עַן מֶ֗ה נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת יַ֗עַן בֵּיתִ/י֙ אֲשֶׁר ה֣וּא חָרֵ֔ב וְ/אַתֶּ֥ם רָצִ֖ים אִ֥ישׁ לְ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/009.yaml
  text: You looked for much[a], but behold, it was little; and when you brought it home, I blew it away. Why? declares Yahweh of Armies. Because of my house, which lies in ruins[b], while each of you runs to his own house.
translation:
  language: ru
  text: Вы ожидали многого, но вот — оказалось мало; а когда принесли это домой, Я дунул на это[a]. Почему? — возвещает Яхве Воинств[b]. — Потому что Мой дом лежит в развалинах, тогда как каждый из вас спешит к своему дому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я дунул на это». Еврейский глагол означает «дуть, дунуть»; в данном контексте он, вероятно, подразумевает, что собранное было утрачено или рассеяно вследствие Божьего суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционная передача титула: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנֹה אֶל הַרְבֵּה
  choice: Вы ожидали многого
  rationale: Оборот с פנה אל в контексте скудного урожая выражает направленное ожидание изобилия; «ожидали многого» естественно передаёт смысл, не превращая его в свободный пересказ.
- source_word: וְהִנֵּה לִמְעָט
  choice: но вот — получили мало
  rationale: הִנֵּה привлекает внимание к неожиданному итогу, а לִמְעָט указывает на малое количество. Глагол «получили» восполняет подразумеваемый результат по контексту.
- source_word: וַהֲבֵאתֶם הַבַּיִת
  choice: а когда принесли это домой
  rationale: Направительный הַבַּיִת означает «домой»; местоимение «это» относится к собранному урожаю и необходимо для ясного русского синтаксиса.
- source_word: וְנָפַחְתִּי בוֹ
  choice: Я развеял его дуновением
  rationale: נפח буквально значит «дуть»; формулировка сохраняет образ Божьего дуновения и одновременно передаёт его губительное действие, не сводя фразу лишь к результату.
- source_word: יַעַן מֶה
  choice: За что?
  rationale: Буквально причинный вопрос «из-за чего?» здесь спрашивает об основании Божьего суда. «За что?» естественно по-русски связывается с последующим повтором יַעַן «за то, что / из-за».
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: נְאֻם — торжественная пророческая формула; «возвещает» сохраняет её особый регистр. Имя יהוה передано как «Яхве», а צבאות — смысловым «Воинств».
- source_word: יַעַן בֵּיתִי אֲשֶׁר הוּא חָרֵב
  choice: За Мой дом, который лежит в развалинах
  rationale: חָרֵב обозначает разорённое, опустошённое состояние. Русское «лежит в развалинах» наглядно описывает запущенный храм; причинная связь поддержана ответом «За Мой дом».
- source_word: וְאַתֶּם רָצִים אִישׁ לְבֵיתוֹ
  choice: тогда как каждый из вас спешит к своему дому
  rationale: רָצִים буквально означает «бежите», но здесь подчёркивает рвение и поспешность; «спешит» звучит естественно и сохраняет контраст приоритетов. אִישׁ לְבֵיתוֹ передано распределительно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; транслитерация «Яхве» отличает личное заветное имя от титула и соответствует исходным данным задания.
- issue: Передача титула צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; небесных воинств
  rationale: «Воинств» прозрачно передаёт множественное צְבָאוֹת и сохраняет широту титула без добавления отсутствующего в стихе определения «небесных».
- issue: Причина суда в יַעַן בֵּיתִי
  choice: За Мой дом
  alternative: Потому что Мой дом лежит в развалинах
  rationale: 'Выбранная конструкция сохраняет риторическую пару «За что? — За Мой дом» и напряжение исходного текста: наказание связано с пренебрежением Божьим домом, уточнённым последующим относительным предложением.'
- issue: Распределительное אִישׁ לְבֵיתוֹ
  choice: каждый из вас ... к своему дому
  alternative: каждый мужчина ... к своему дому
  rationale: В данном обращении אִישׁ выполняет распределительную функцию. «Каждый из вас» точно передаёт индивидуальную ответственность, не вводя в русский текст ненужного ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Риторический вопрос и ответ оформлены как прямая божественная речь. Заглавные местоимения при обращении Бога к Себе («Я», «Мой») следуют распространённой русской библейской издательской традиции; при этом синтаксис остаётся современным и понятным.
