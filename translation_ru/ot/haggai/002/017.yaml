  source_fidelity: 'В еврейском тексте стоит совершенная форма: «Я поразил», а не длительное/повторяющееся «Я поражал». Кроме того, אֵת כָּל מַעֲשֵׂה יְדֵיכֶם является ещё одним прямым дополнением к глаголу «поразил», а не пояснительным приложением к граду. Исправленный текст ясно передаёт, что бедствия поразили и народ, и весь результат его труда. Эллиптическое וְאֵין אֶתְכֶם אֵלַי обоснованно передано как отсутствие обращения к Богу, с сохранением буквальной неопределённости в сноске.'
