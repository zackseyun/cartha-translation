  text: הִכֵּ֨יתִי אֶתְ/כֶ֜ם בַּ/שִּׁדָּפ֤וֹן וּ/בַ/יֵּֽרָקוֹן֙ וּ/בַ/בָּרָ֔ד אֵ֖ת כָּל מַעֲשֵׂ֣ה יְדֵי/כֶ֑ם וְ/אֵין אֶתְ/כֶ֥ם אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/017.yaml
  text: I struck you with blight and mildew and hail[a], all the work of your hands; yet you did not turn to me, declares Yahweh.
translation:
  language: ru
  text: Я поразил вас иссушением, пожелтением и градом; поразил и весь труд ваших рук. Но вы не обратились ко Мне, возвещает Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и нет вас ко Мне»; еврейская фраза эллиптична. В данном контексте она означает, что вы не обратились и не вернулись к Яхве.'
    reason: Сноска отмечает необычную, не содержащую выраженного глагола конструкцию וְאֵין אֶתְכֶם אֵלַי и отличает её буквальную форму от контекстуального перевода в основном тексте.
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: Я поражал
  rationale: Глагол נכה обозначает нанесение удара или поражение. Несовершенный вид естественно передаёт повторявшиеся бедствия, подразумеваемые контекстом.
- source_word: בַּשִּׁדָּפוֹן
  choice: иссушением
  rationale: שִׁדָּפוֹן обозначает губительное иссушение или выжигание посевов; выбранное слово понятно в земледельческом контексте и не сводит явление непременно к современной категории болезни.
- source_word: וּבַיֵּרָקוֹן
  choice: пожелтением
  rationale: יֵרָקוֹן связано с бледностью или пожелтением растений. Такой перевод сохраняет конкретный образ повреждённых посевов, не отождествляя его без достаточных оснований с определённой грибковой болезнью.
- source_word: וּבַבָּרָד
  choice: и градом
  rationale: בָּרָד прямо означает град.
- source_word: אֵת כָּל מַעֲשֵׂה יְדֵיכֶם
  choice: все плоды труда ваших рук
  rationale: Буквально выражение означает «всё дело ваших рук», но здесь речь идёт о результате земледельческого труда. «Плоды труда ваших рук» сохраняет образ и ясно связывает бедствия с урожаем и хозяйством народа.
- source_word: וְאֵין אֶתְכֶם אֵלַי
  choice: но вы так и не обратились ко Мне
  rationale: 'Еврейская фраза эллиптична: буквально в ней нет выраженного глагола обращения. В контексте наказания она указывает на отсутствие движения или возвращения к Богу; «так и не» передаёт противопоставление ожидаемому отклику.'
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — торжественная пророческая формула. «Возвещает» сохраняет её весомость и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем יהוה и титулом «Господь».
theological_decisions:
- issue: Смысл эллиптической фразы וְאֵין אֶתְכֶם אֵלַי
  choice: Отсутствие обращения народа к Богу после постигшего его наказания
  alternative: «но вас не было со Мной» или «но никто из вас не направился ко Мне»
  rationale: Контекст заветного взыскания поддерживает значение возвращения или обращения к Богу, однако исходная конструкция остаётся необычной и не содержит явного глагола. Поэтому смысл передан в тексте, а буквальная неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Сельскохозяйственные термины переданы ясно, но без чрезмерной научной конкретизации; синтаксис сохраняет последовательность бедствий, ущерба труду народа и отсутствия покаянного отклика.
