  yaml_path: translation/ot/haggai/002/003.yaml
  text: Who among you is left who saw this house in its former glory? And how do you see it now? Is it not as nothing in your eyes?[a][b]
translation:
  language: ru
  text: Кто из вас ещё остался, кто видел этот дом[a] в его прежней славе[b]? И каким вы видите его теперь? Разве в ваших глазах он не ничто?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот храм». Буквально в еврейском тексте — «этот дом»; «дом» часто служит обозначением храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в его первой славе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם הַנִּשְׁאָר
  choice: Кто из вас остался из тех
  rationale: Формулировка передаёт смысл тех, кто сохранился от прежнего поколения, но не уточняет без необходимости «остался в живых».
- source_word: אֲשֶׁר רָאָה
  choice: кто видел
  rationale: Совершённое прошедшее действие естественно передаётся русским глаголом совершенного вида в прошедшем времени.
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: Сохранено буквальное «дом»; в данном контексте это обычное обозначение храма.
- source_word: בִּכְבוֹדוֹ הָרִאשׁוֹן
  choice: в его прежней славе
  rationale: «Прежней» естественно выражает временное противопоставление нынешнему состоянию, а «слава» сохраняет широкий смысл כבוד, включающий величие и великолепие.
- source_word: וּמָה אַתֶּם רֹאִים אֹתוֹ עַתָּה
  choice: И каким вы видите его теперь?
  rationale: Вопрос касается не только зрительного восприятия, но и оценки нынешнего вида дома; творительное «каким» ясно передаёт эту функцию.
- source_word: הֲלוֹא
  choice: Разве ... не
  rationale: Русская конструкция естественно оформляет риторический вопрос, предполагающий утвердительный ответ.
- source_word: כָמֹהוּ כְּאַיִן
  choice: он — не ничто
  rationale: Краткая именная конструкция сохраняет резкую сравнительную оценку как полной незначительности, не ослабляя её пояснением.
- source_word: בְּעֵינֵיכֶם
  choice: в ваших глазах
  rationale: Сохранён понятный по-русски образ, обозначающий восприятие и оценку слушателей.
