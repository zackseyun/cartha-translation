base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/010.yaml
  text: On the twenty-fourth day of the ninth month, in the second year of Darius, the word of Yahweh came to Haggai the prophet, saying,
translation:
  language: ru
  text: 'В двадцать четвёртый день девятого месяца, во второй год Дария, слово Яхве пришло к пророку Аггею:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עֶשְׂרִים וְ/אַרְבָּעָה
  choice: в двадцать четвёртый день
  rationale: В еврейской формуле даты буквально стоит «в двадцать и четыре»; добавление слова «день» и порядковое числительное соответствуют нормам современного русского языка.
- source_word: לַ/תְּשִׁיעִי
  choice: девятого месяца
  rationale: Порядковое числительное в контексте даты обозначает девятый месяц; слово «месяц» восполнено для ясности по-русски.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/דָרְיָוֶשׁ
  choice: во второй год Дария
  rationale: Так естественно передаётся древнееврейская формула датировки по году царствования.
- source_word: הָיָה דְּבַר יְהוָה
  choice: слово Яхве было обращено
  rationale: Это естественная русская передача устойчивой пророческой формулы; она выражает направленность Божьего слова к пророку, не превращая его в отвлечённое «событие».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом «Господь».
- source_word: אֶל חַגַּי הַ/נָּבִיא
  choice: к пророку Аггею
  rationale: Предлог אֶל обозначает адресата, а «Аггей» — устоявшаяся русская форма имени חַגַּי.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь; в современном русском эту функцию естественно и полно выполняет двоеточие после формулы «слово было обращено».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Синтаксис сохраняет последовательность датировки и формулы получения откровения, оставаясь естественным для обычного читателя.
