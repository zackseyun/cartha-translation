  text: אֶֽת הַ/דָּבָ֞ר אֲשֶׁר כָּרַ֤תִּי אִתְּ/כֶם֙ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרַ֔יִם וְ/רוּחִ֖/י עֹמֶ֣דֶת בְּ/תוֹכְ/כֶ֑ם אַל תִּירָֽאוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/005.yaml
  text: As for the promise that I made with you when you came out of Egypt[a], and my Spirit is standing in your midst[b]; do not fear.
translation:
  language: ru
  text: Что же до обещания, которое Я дал вам, когда вы вышли из Египта[a], — Дух Мой пребывает среди вас[b]. Не бойтесь!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слово, которое Я отсёк с вами»; это заветный оборот, ср. выражение «заключить (букв. отсечь) завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Дух Мой стоит посреди вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַדָּבָר
  choice: Что же до обещания
  rationale: דָּבָר буквально означает «слово» или «дело», но в сочетании с כָּרַתִּי и в контексте исхода имеет оттенок обязательства, данного Богом. Оборот «что же до» естественно передаёт эллиптическое начало еврейской фразы и сохраняет её связь с предыдущим стихом.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: которое Я дал вам
  rationale: Глагол כּרת («резать») употреблён в формуле заключения завета. По-русски «дать обещание» звучит естественно, тогда как буквальное «отсечь слово с вами» непонятно; заветный образ отмечен в сноске.
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: когда вы вышли из Египта
  rationale: Инфинитив с בְּ выражает время действия; перевод прямо и естественно передаёт указание на исход.
- source_word: וְרוּחִי
  choice: Дух Мой
  rationale: В контексте Божьего присутствия среди народа רוּחַ обозначает Божий Дух, а не просто ветер или дыхание. Прописная буква указывает на божественную принадлежность, не добавляя позднейшей догматической конкретизации.
- source_word: עֹמֶדֶת
  choice: пребывает
  rationale: Причастие выражает продолжающееся присутствие. «Пребывает» естественно для современного литературного русского и сохраняет длительный характер действия; более буквальный образ «стоит» дан в сноске.
- source_word: בְּתוֹכְכֶם
  choice: среди вас
  rationale: Передаёт присутствие внутри общины как целого и не создаёт излишнего впечатления индивидуального внутреннего пребывания.
- source_word: אַל תִּירָאוּ
  choice: Не бойтесь
  rationale: Краткий и торжественный русский эквивалент отрицательного повеления во множественном числе.
theological_decisions:
- issue: Значение רוּחִי в контексте Божьего присутствия
  choice: Дух Мой
  alternative: дыхание Моё
  rationale: Контекст завета и исхода указывает на деятельное присутствие Бога среди народа. Перевод «Дух» лучше всего передаёт это значение, не устраняя более широкий семантический диапазон еврейского слова.
- issue: Степень явного выражения заветной лексики в דָּבָר ... כָּרַתִּי
  choice: обещание, которое Я дал вам
  alternative: завет, который Я заключил с вами
  rationale: В оригинале стоит דָּבָר («слово, дело»), а не существительное «завет». «Обещание» передаёт обязательство и заветный контекст, не подменяя исходное слово более техническим термином.
- issue: Передача образа עֹמֶדֶת
  choice: пребывает
  alternative: стоит
  rationale: Буквальное «стоит» сохраняет образ, но по-русски может ошибочно восприниматься как пространственная поза. «Пребывает» выражает продолжающееся присутствие, а буквальный вариант сохранён в примечании.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Инверсия «Дух Мой» поддерживает достоинство речи. Тире обозначает переход от эллиптически вынесенного обещания к утверждению о продолжающемся Божьем присутствии.
