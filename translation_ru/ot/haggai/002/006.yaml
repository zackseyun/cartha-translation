base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/006.yaml
  text: 'For this is what Yahweh of Armies says: Yet once more[a], in a little while[b], I will shake the heavens and the earth and the sea and the dry land.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве Воинств[a]: «Ещё раз — ещё немного времени, и Я потрясу небеса и землю, море и сушу».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционная передача: «Господь Саваоф»; буквально титул означает «Яхве Воинств».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза сжата: буквально «ещё один [раз] — мало [времени] это». Она содержит и указание на ещё одно действие, и на краткость оставшегося времени; возможна также передача: «Ещё раз, через малое время…».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет конкретный смысл слова и силу божественного титула; в сочетании «Яхве Воинств» передаёт Владыку небесных сил без добавления отсутствующего в тексте слова «Повелитель».
- source_word: כִּי כֹה אָמַר
  choice: Ведь так говорит
  rationale: Естественно передаёт вводную пророческую формулу и связь כִּי с предшествующим контекстом.
- source_word: עוֹד אַחַת מְעַט הִיא
  choice: Ещё раз, совсем скоро
  rationale: 'Передаёт оба элемента сжатой еврейской фразы: ещё одно действие и малый остающийся срок, не навязывая ей более точной синтаксической связи, чем позволяет оригинал.'
- source_word: מַרְעִישׁ
  choice: Я потрясу
  rationale: Каузативное причастие в пророческом высказывании имеет здесь предстоящее значение; будущее время естественно передаёт обещанное действие Бога.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Сохраняет форму множественного числа и космический масштаб перечисления.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В паре с небесами и в перечне частей мироздания означает землю в космическом, а не только местном смысле.
- source_word: הַיָּם
  choice: море
  rationale: Прямое соответствие в перечне областей мироздания.
- source_word: הֶחָרָבָה
  choice: сушу
  rationale: В противопоставлении морю означает сухую землю; «суша» кратко и естественно сохраняет этот контраст.
theological_decisions:
- issue: Передача божественного имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь воинств
  rationale: Оригинал прямо употребляет личное имя Яхве. Перевод «Воинств» раскрывает значение титула, тогда как традиционное «Саваоф» транслитерирует еврейское слово и менее понятно современному читателю.
- issue: Временная фраза עוֹד אַחַת מְעַט הִיא
  choice: Ещё раз, совсем скоро
  alternative: Ещё один раз — недолго осталось; ещё раз, через малое время
  rationale: Еврейская конструкция предельно сжата и допускает различную синтаксическую расстановку акцентов. Выбранный вариант сохраняет повторность и близость события, не привнося позднейшего толкования из Евр 12.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксис краткий и ритмичный; традиционно-библейские слова сохранены там, где они остаются понятными современному читателю.
