  text: 'And now[a], please set your heart on this from today onward: before one stone was placed upon another in the temple of Yahweh,'
translation:
  language: ru
  text: А теперь, начиная с нынешнего дня и впредь, обратите, пожалуйста, внимание на то, что было прежде, чем в храме Яхве положили камень на камень,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и союзную связь, и переход к непосредственному призыву.
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: примите, пожалуйста, близко к сердцу
  rationale: Естественная русская идиома сохраняет образ сердца и передаёт настойчивую просьбу, выраженную частицей נָא.
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: от нынешнего дня и далее
  rationale: Передаёт временной отсчёт от указанного дня; формулировка оставляет контексту возможность уточнить направление осмысления.
- source_word: מִטֶּרֶם
  choice: прежде чем
  rationale: Естественно вводит предшествующий строительству период.
- source_word: שׂוּם אֶבֶן אֶל אֶבֶן
  choice: стали класть камень на камень
  rationale: Сохраняет строительный образ и безличность еврейской инфинитивной конструкции.
- source_word: בְּהֵיכַל
  choice: в храме
  rationale: В контексте Аггея הֵיכָל обозначает храм Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; «Яхве» является современной научно обоснованной русской передачей тетраграмматона.
- issue: Временная направленность מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: от нынешнего дня и далее
  alternative: начиная с нынешнего дня; от нынешнего дня назад
  rationale: Само выражение допускает контекстуальное уточнение, а следующий оборот обращает внимание на предшествующий период. Перевод сохраняет эту напряжённость, не добавляя явно «вперёд» или «назад».
translation_notes:
  register: Современный литературный русский с сохранением библейского образа сердца. «Примите близко к сердцу» звучит естественнее буквального «положите на сердце», а сноска раскрывает форму оригинала. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
