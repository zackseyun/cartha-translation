  verdict: revise
  source_fidelity: Черновик в целом верно передаёт храм Яхве, строительный образ и незавершённый синтаксис стиха. Однако «то, что будет от нынешнего дня и далее» превращает временной оборот מִן־הַיּוֹם הַזֶּה וָמָעְלָה в содержание будущего события, которого в еврейском тексте нет. В исправлении временной оборот относится к призыву обратить внимание, а предшествование строительству передано прямо.
  naturalness: «Примите близко к сердцу» в современном русском прежде всего означает эмоционально пережить что-либо; здесь еврейская идиома призывает вдумчиво рассмотреть обстоятельства. «Обратите внимание» естественно и точно передаёт прагматический смысл. Фраза сохраняет запятую в конце, поскольку предложение продолжается в следующем стихе.
  terminology: «Храм Яхве» соответствует בְּהֵיכַל יְהוָה и принятой передаче тетраграмматона. «Камень на камень» сохраняет строительный образ שׂוּם אֶבֶן אֶל־אֶבֶן. Сноска отмечает буквальный образ «сердца», не выдавая толкование за иной текст.
  issues:
