source:
  edition: WLC
  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/022.yaml
  text: I will overturn the throne of kingdoms[a], and I will destroy the strength of the kingdoms of the nations. I will overturn the chariot and its rider, and horses and their riders will go down[b], each by the sword of his brother.
translation:
  language: ru
  text: Я опрокину престол царств[a] и уничтожу мощь царств народов. Я опрокину колесницу и её всадников[b]; кони и их всадники падут — каждый от меча своего брата[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «низвергну престол царств».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте «колесница» стоит в единственном числе, а «её всадники» — во множественном.
    reason: textual_clarification
  - marker: c
    text: Выражение «каждый от меча своего брата» означает, что противники станут поражать друг друга.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: Я опрокину
  rationale: Глагол הפך здесь означает опрокидывание или ниспровержение. «Опрокину» сохраняет конкретный образ и естественно сочетается и с престолом, и с колесницей.
- source_word: כִּסֵּא מַמְלָכוֹת
  choice: престол царств
  rationale: Сохраняется единственное число כִּסֵּא; престол может символически обозначать общую царскую власть множества царств.
- source_word: וְהִשְׁמַדְתִּי
  choice: сокрушу
  rationale: Порода хифиль глагола שׁמד выражает решительное уничтожение. «Сокрушу» передаёт силу суда и хорошо сочетается с абстрактным существительным «сила».
- source_word: חֹזֶק
  choice: силу
  rationale: Прямое и естественное соответствие со значением «сила, мощь».
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: царств народов
  rationale: גּוֹיִם в данном геополитическом контексте означает народы; перевод не вводит конфессионально нагруженное «язычники».
- source_word: מֶרְכָּבָה וְרֹכְבֶיהָ
  choice: колесницу и тех, кто на ней
  rationale: מֶרְכָּבָה стоит в единственном числе, а רֹכְבֶיהָ морфологически означает «тех, кто едет на ней» во множественном числе. Формулировка сохраняет оба числа без неестественного согласования.
- source_word: וְיָרְדוּ
  choice: падут
  rationale: Буквально ירד означает «сойти, спуститься», но в военном контексте обозначает падение в поражении. Русское «падут» ясно передаёт смысл, сохраняя образ нисхождения.
- source_word: סוּסִים וְרֹכְבֵיהֶם
  choice: кони и всадники их
  rationale: «Кони» соответствует возвышенному пророческому регистру, а «всадники» точно и естественно передаёт участников конного боя.
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  choice: каждый от меча своего брата
  rationale: Близко передаёт распределительную конструкцию и сохраняет мужскую форму исходного текста; выражение указывает на взаимное поражение среди сражающихся.
theological_decisions:
- issue: Единственное число в выражении כִּסֵּא מַמְלָכוֹת
  choice: престол царств
  alternative: престолы царств
  rationale: Единственное число сохранено как коллективный или символический образ верховной царской власти, без догматического уточнения его референта.
- issue: Число в מֶרְכָּבָה וְרֹכְבֶיהָ
  choice: колесницу и тех, кто на ней
  alternative: колесницу и её всадника
  rationale: Еврейский текст сочетает единственное число «колесница» с множественным «едущие на ней». Перевод сохраняет эту особенность, не сводя множество к одному всаднику.
- issue: Мужская образность в אִישׁ ... אָחִיו
  choice: каждый от меча своего брата
  alternative: каждый от меча другого
  rationale: Мужская форма уместна для названных в контексте воинов и сохраняет образ братоубийственной взаимной резни, не превращая его в гендерно нейтральную абстракцию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Конкретные военные образы исходного текста сохранены; синтаксис сделан ясным для обычного читателя.
