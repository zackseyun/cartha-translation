  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  choice: И было слово Яхве
  rationale: Сохранена традиционная пророческая формула и лексическое значение דָּבָר; по-русски конструкция «было слово…» звучит достойно и узнаваемо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, без замены титулом «Господь».
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Точно передаёт порядковое значение наречия, а не только более общее «снова».
- source_word: אֶל חַגַּי
  choice: к Аггею
  rationale: Предлог אֶל при формуле откровения естественно передаётся русским «к».
- source_word: בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ
  choice: в двадцать четвёртый день месяца
  rationale: Ясная современная русская передача еврейской формулы даты; слово «день» подразумевается исходной конструкцией.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русском двоеточие естественно вводит прямую речь следующего стиха и передаёт функцию לֵאמֹר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное божественное имя. «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной и узнаваемой пророческой формулы. Двоеточие обеспечивает естественную связь с прямой речью в следующем стихе.
