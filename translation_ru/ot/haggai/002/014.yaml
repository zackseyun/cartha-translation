  text: וַ/יַּ֨עַן חַגַּ֜י וַ/יֹּ֗אמֶר כֵּ֣ן הָֽ/עָם הַ֠/זֶּה וְ/כֵן הַ/גּ֨וֹי הַ/זֶּ֤ה לְ/פָנַ/י֙ נְאֻם יְהוָ֔ה וְ/כֵ֖ן כָּל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וַ/אֲשֶׁ֥ר יַקְרִ֛יבוּ שָׁ֖ם טָמֵ֥א הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
translation:
  language: ru
  text: 'Тогда Аггей ответил: «Таковы[a] эти люди[b], таков и этот народ предо Мной, — возвещает Яхве, — таково и всякое дело их рук; и то, что они приносят там, нечисто».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так обстоит дело с этими людьми… и с этим народом».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «этот народ»; в еврейском это выражение может звучать отстранённо или укоризненно.'
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: таковы / таков / таково
  rationale: Повтор одного русского указательно-сравнительного слова с согласованием по роду и числу передаёт трёхкратное כֵּן и связывает приговор с предшествующим священническим примером.
- source_word: הָעָם הַזֶּה
  choice: эти люди
  rationale: В данном параллелизме естественное русское выражение «эти люди» сохраняет оттенок отстранения и позволяет отличить עָם от следующего גּוֹי; буквальное собирательное выражение отмечено в сноске.
- source_word: הַגּוֹי הַזֶּה
  choice: этот народ
  rationale: גּוֹי обозначает здесь вернувшуюся общину Иудеи как единое целое, а не язычников; «народ» естественнее и менее анахронично, чем «нация».
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Сохраняет образ пребывания перед Богом и торжественный судебно-заветный оттенок, оставаясь понятным в современном литературном русском.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт торжественную пророческую формулу и непосредственно воспроизводит личное имя יְהוָה как «Яхве».
- source_word: כָּל מַעֲשֵׂה יְדֵיהֶם
  choice: всякое дело их рук
  rationale: Сохраняет еврейский образ и распределительное значение כָּל, не сводя выражение только к физическому труду.
- source_word: וַאֲשֶׁר יַקְרִיבוּ
  choice: и то, что они приносят
  rationale: В жертвенном контексте каузативная форма קרב означает принесение или представление дара; формулировка остаётся краткой и не добавляет отсутствующего в тексте слова «жертва».
- source_word: שָׁם
  choice: там
  rationale: Сохраняет пространственное указание оригинала, не уточняя прямо храм или жертвенник.
- source_word: טָמֵא הוּא
  choice: нечисто
  rationale: Передаёт ритуальный статус, обсуждаемый в предыдущих стихах, и согласуется с местоименным оборотом «то, что».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Кого обозначает «этот народ»
  choice: Иуду, то есть вернувшуюся заветную общину, рассматриваемую как единое целое
  alternative: окружающие языческие народы
  rationale: Контекст речи Аггея применяет священническое рассуждение о нечистоте к самой послепленной общине и к приносимому ею, а не к соседним народам.
- issue: Характер нечистоты
  choice: ритуальная нечистота народа, его дел и приношений в рамках приведённой аналогии
  alternative: только нравственная испорченность или только физическое загрязнение
  rationale: טָמֵא продолжает терминологию вопросов священникам в стихах 11–13; перевод не устраняет возможную связь ритуального образа с более широким Божьим осуждением.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Повтор «таковы / таков / таково» намеренно сохраняет риторическую структуру еврейского текста; архаизация ограничена устойчивым оборотом «предо Мной».
