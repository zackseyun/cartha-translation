base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/018.yaml
  text: Set your heart on this from this day onward[a], from the twenty-fourth day of the ninth month, from the day when the temple of Yahweh was founded; consider it.
translation:
  language: ru
  text: 'Обратите же внимание: с этого дня и впредь — с двадцать четвёртого дня девятого месяца, со дня, когда был заложен храм Яхве[a]. Обратите на это внимание.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со дня, когда было положено основание храма Яхве».'
    reason: 'Лексическая альтернатива: יסד может конкретно указывать на закладку фундамента.'
lexical_decisions:
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: Положите же это на сердце
  rationale: Русский оборот «положить на сердце» сохраняет еврейский образ сердца и передаёт призыв внимательно осмыслить сказанное. Частица «же» ненавязчиво отражает увещевательное נָא, не превращая его в отсутствующее в источнике временное «теперь».
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: с этого дня и впредь
  rationale: Естественный русский временной оборот, передающий исходную точку и направленность вперёд.
- source_word: מִיּוֹם עֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי
  choice: с двадцать четвёртого дня девятого месяца
  rationale: Дата выражена полно и ясно; слово «месяца» добавлено по нормам русского языка на основании эллиптического еврейского обозначения девятого месяца.
- source_word: לְמִן הַיּוֹם
  choice: со дня
  rationale: Сохраняет повторное уточнение исходной временной точки и связь с предшествующей датой.
- source_word: אֲשֶׁר יֻסַּד
  choice: когда был заложен
  rationale: Пассив глагола יסד может обозначать основание здания или закладку его фундамента. Основной текст передаёт это естественным русским выражением, а более конкретное прочтение вынесено в сноску.
- source_word: הֵיכַל יְהוָה
  choice: храм Яхве
  rationale: הֵיכַל здесь обозначает храмовое здание; тетраграмматон передан личным именем «Яхве».
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Положите это на сердце
  rationale: Финальный повтор сохранён ради заложенного в еврейском тексте эмфатического обрамления; подразумеваемое дополнение «это» делает фразу естественной по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; передача «Яхве» сохраняет личное имя Бога и не подменяет его титулом.
- issue: Что именно было «заложено»
  choice: был заложен храм
  alternative: было положено основание храма
  rationale: Еврейский пассив יסד допускает как общее указание на основание храма, так и конкретное указание на закладку фундамента. Основной текст сохраняет более широкую формулировку, а конкретизация дана в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Повтор образного оборота «положить на сердце» намеренно сохранён; синтаксис разбит двоеточием и тире для ясного восприятия длинной временной цепочки.
