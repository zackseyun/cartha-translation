base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/019.yaml
  text: Is the seed still in the storehouse? Even the vine[a], the fig tree, the pomegranate, and the olive tree have not borne fruit. From this day on I will bless you.
translation:
  language: ru
  text: Есть ли ещё семя в хранилище? И даже виноградная лоза, смоковница, гранатовое и оливковое деревья не принесли плода. С этого дня Я буду благословлять вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я буду благословлять»; объект в еврейском тексте не назван, но подразумевается из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַע֤וֹד הַזֶּ֨רַע֙ בַּמְּגוּרָ֔ה
  choice: Есть ли ещё семя в хранилище?
  rationale: В вопросе עוֹד обозначает продолжающееся до настоящего момента состояние; «ещё» естественно передаёт этот оттенок. מְגוּרָה — место хранения зерна; «хранилище» сохраняет широту значения без излишнего уточнения.
- source_word: וְעַד
  choice: Ни … ни
  rationale: В данном контексте עַד расширяет перечисление от семени к плодовым культурам. Русская отрицательная конструкция «ни … ни» естественно связывает список с последующим לֹא נָשָׂא, хотя формальный оттенок «вплоть до» при этом передаётся не буквально.
- source_word: הַגֶּפֶן וְהַתְּאֵנָה וְהָרִמּוֹן וְעֵץ הַזַּיִת
  choice: виноградная лоза, смоковница, гранатовое и оливковое дерево
  rationale: Названия растений переданы обычными литературными русскими соответствиями; «виноградная лоза» устраняет возможную неопределённость слова «лоза», а «дерево» явно выражено при последних наименованиях в согласии с контекстом.
- source_word: לֹא נָשָׂא
  choice: ещё не принесли плода
  rationale: Глагол נָשָׂא буквально означает «нести», но применительно к плодовым растениям по-русски естественно «приносить плод». Единственное число еврейского сказуемого после перечня в русском естественно передаётся множественным числом.
- source_word: מִן הַיּוֹם הַזֶּה
  choice: С этого дня
  rationale: Фраза обозначает начальную точку обещанного изменения; русское «с этого дня» ясно передаёт перспективное значение.
- source_word: אֲבָרֵךְ
  choice: Я буду благословлять вас
  rationale: Пиэль, имперфект 1-го лица единственного числа, в контексте выражает обещание на будущее. Объект в еврейском тексте не назван, но адресаты подразумеваются контекстом; в русском он добавлен для ясности и отмечен сноской.
theological_decisions:
- issue: Неявный объект обещания אֲבָרֵךְ
  choice: «Я буду благословлять вас» с пояснительной сноской
  alternative: «Я буду благословлять» без названного объекта
  rationale: Еврейский текст оставляет объект грамматически невыраженным. Контекст подразумевает обращённый к народу Божий ответ, однако добавление «вас» следует обозначить, чтобы не скрывать формальную неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранён риторический вопрос и резкий переход от прежнего бесплодия к будущему благословению; архаизмы сведены к общеупотребительному библейскому термину «смоковница».
