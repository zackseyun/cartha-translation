  text: גָּד֣וֹל יִֽהְיֶ֡ה כְּבוֹד֩ הַ/בַּ֨יִת הַ/זֶּ֤ה הָ/אַֽחֲרוֹן֙ מִן הָ֣/רִאשׁ֔וֹן אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וּ/בַ/מָּק֤וֹם הַ/זֶּה֙ אֶתֵּ֣ן שָׁל֔וֹם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/009.yaml
  text: The latter glory of this house will be greater than the former[a], says Yahweh of Armies; and in this place I will give peace[b], declares Yahweh of Armies.
translation:
  language: ru
  text: Будущая слава этого дома будет больше прежней[a], — говорит Яхве Воинств, — и в этом месте Я дам мир[b], — возвещает Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Последующая слава этого дома будет больше прежней».'
    reason: Еврейское «последняя» противопоставлено «прежней»; русские «будущая» и «последующая» по-разному передают этот временной оттенок, не уточняя исторический или эсхатологический референт.
  - marker: b
    text: Еврейское слово «шалом» может также означать благополучие и целостность.
    reason: Лексическая альтернатива передаёт более широкий смысловой диапазон שָׁלוֹם.
lexical_decisions:
- source_word: גָּדוֹל יִהְיֶה
  choice: будет больше
  rationale: Предикативное прилагательное с היה и последующее сравнение с מן требуют в русском естественной сравнительной конструкции.
- source_word: כְּבוֹד
  choice: величие
  rationale: В храмовом контексте слово охватывает славу, честь и великолепие. «Величие» естественно сочетается с «будет больше» и не сводит смысл лишь к внешней пышности.
- source_word: הַבַּיִת הַזֶּה
  choice: этого дома
  rationale: «Дом» сохраняет буквальный образ и библейское обозначение храма, не устраняя его заветные ассоциации.
- source_word: הָאַחֲרוֹן ... מִן הָרִאשׁוֹן
  choice: впоследствии ... чем прежде
  rationale: Прилагательные употреблены субстантивированно по отношению к величию дома. Наречная передача ясно выражает сравнение позднейшего состояния с прежним, не утверждая, что речь непременно о двух разных зданиях.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Передаёт личное имя Яхве и сохраняет множественную, военную образность צְבָאוֹת в понятной современной форме.
- source_word: וּבַמָּקוֹם הַזֶּה
  choice: И на этом месте
  rationale: Естественная русская передача пространственного выражения с сохранением указательного акцента.
- source_word: אֶתֵּן
  choice: Я дарую
  rationale: В сочетании с обещанием мира «дарую» звучит естественно и достойно, сохраняя прямое значение Божьего дара.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Основное и традиционно узнаваемое значение; более широкий смысл благополучия и целостности отмечен в сноске.
- source_word: אָמַר ... נְאֻם
  choice: говорит ... возвещает
  rationale: Различение двух формул отражает разные еврейские слова; «возвещает» передаёт торжественный характер пророческого изречения.
theological_decisions:
- issue: Значение «этого дома» и его последующего величия
  choice: Сохранить обещание о большем будущем величии этого же дома без уточнения конкретной исторической или эсхатологической схемы.
  alternative: Понимать слова как прямое сравнение второго храма с храмом Соломона либо исключительно как мессианско-эсхатологическое пророчество.
  rationale: Еврейский текст утверждает сравнение, но сам по себе не определяет, идёт ли речь о разных храмах, состояниях одного храмового места или окончательном исполнении.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Смысл כְּבוֹד
  choice: величие
  alternative: слава; великолепие
  rationale: Выбор сохраняет широкое значение почёта и великолепия, не уточняя, является ли обещанная слава материальной, культовой или эсхатологической.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием без архаизмов. Параллельные формулы речи сохранены, но лексически различены. Формулировка «впоследствии ... прежде» поддерживает естественность и не снимает неоднозначность исторического референта.
