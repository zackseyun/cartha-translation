  terminology: «Слава» сохраняет устойчивую библейскую терминологию для כָּבוֹד. «Яхве Воинств» последовательно передаёт выбранные в проекте имя и צְבָאוֹת. «Мир» для שָׁלוֹם оставлен в тексте, а его расширенный смысл разъяснён в сноске.
