  source_fidelity: 'Еврейское כְּבוֹד означает «слава», «великолепие», «почёт»; в данном храмовом и пророческом контексте «слава» точнее сохраняет его культовый и богословский регистр, чем «величие». הָאַחֲרוֹן относится к «славе», а не выражено просто обстоятельством времени: текст говорит о последующей/будущей славе этого дома, которая превзойдёт прежнюю. «В этом месте» ближе к בַּמָּקוֹם, чем «на этом месте».'
