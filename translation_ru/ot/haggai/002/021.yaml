base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/021.yaml
  text: 'Speak to Zerubbabel[a], governor of Judah, saying: I am shaking the heavens and the earth.'
translation:
  language: ru
  text: 'Скажи Зоровавелю, правителю Иудеи: «Я сотрясаю небо и землю»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я потрясу небо и землю». Еврейское причастие может обозначать как происходящее, так и предстоящее действие.'
    reason: лексическая и временная альтернатива
lexical_decisions:
- source_word: אֱמֹר
  choice: Скажи
  rationale: Повелительная форма глагола אמר естественно передаётся современным русским «скажи» и сохраняет силу пророческого повеления.
- source_word: זְרֻבָּבֶל
  choice: Зоровавель
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени.
- source_word: פַּחַת יְהוּדָה
  choice: правителю Иудеи
  rationale: פֶּחָה обозначает областного правителя в системе имперского управления; «правитель» понятно современному читателю и не привносит более узкого административного титула.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная еврейская формула введения речи естественно выражается в русском языке синтаксически, без тяжеловесного «говоря».
- source_word: אֲנִי
  choice: Я
  rationale: Личное местоимение сохранено, поскольку в еврейском тексте оно выражено явно и придаёт заявлению акцент.
- source_word: מַרְעִישׁ
  choice: сотрясаю
  rationale: Причастная форма породы hифиль от רעשׁ передана настоящим временем, сохраняющим живой, разворачивающийся характер действия; возможное будущее значение отмечено в сноске.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небо и землю
  rationale: Русская парная формула «небо и земля» естественно передаёт всеохватный космический меризм; единственное «небо» здесь идиоматичнее буквального «небеса».
theological_decisions:
- issue: Масштаб образа сотрясения
  choice: Сохранён космический образ, охватывающий небо и землю
  alternative: Сузить смысл до политических потрясений среди народов
  rationale: Сам стих говорит о небе и земле; последующий контекст связывает образ с историко-политическими событиями, но перевод не должен преждевременно сужать его широкий смысл.
- issue: Временное значение מַרְעִישׁ
  choice: «сотрясаю» с указанием будущего варианта в сноске
  alternative: «потрясу» или «собираюсь потрясти» в основном тексте
  rationale: Еврейское причастие допускает актуальное или близкое/простое будущее значение. Настоящее время формально ближе форме источника, а сноска сохраняет реальную временную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной пророческой интонацией. Формула לֵאמֹר передана русским оформлением прямой речи, чтобы избежать неестественного канцелярского «говоря».
