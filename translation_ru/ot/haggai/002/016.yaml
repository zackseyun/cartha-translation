base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/016.yaml
  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
translation:
  language: ru
  text: Когда кто-нибудь подходил к куче в двадцать мер, в ней оказывалось лишь десять; когда подходил к винному чану, чтобы начерпать пятьдесят мер[a], оказывалось лишь двадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «пятьдесят пура»; точный объём этой меры жидкости или мерного сосуда неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהְיוֹתָם בָּא
  choice: когда кто-нибудь подходил
  rationale: Оборот продолжает временную перспективу предыдущего стиха и вводит обычную, повторявшуюся ситуацию. Не добавлен отсутствующий в данной фразе вопрос.
- source_word: עֲרֵמַת עֶשְׂרִים
  choice: к куче, рассчитывая набрать двадцать мер
  rationale: עֲרֵמָה означает кучу или груду урожая; единица после числительного не названа. Формулировка естественно передаёт ожидаемое количество, не уточняя вид продукта сверх исходного текста.
- source_word: וְהָיְתָה עֲשָׂרָה
  choice: оказывалось лишь десять
  rationale: Передаёт фактическое количество и подразумеваемую нехватку.
- source_word: הַיֶּקֶב
  choice: винному чану
  rationale: יֶקֶב здесь обозначает чан, связанный с изготовлением и хранением выжатого виноградного сока.
- source_word: לַחְשֹׂף
  choice: начерпать
  rationale: Глагол описывает извлечение жидкости из чана; «начерпать» естественно звучит по-русски в данном контексте.
- source_word: חֲמִשִּׁים פּוּרָה
  choice: пятьдесят мер[a]
  rationale: פּוּרָה — не вполне ясное обозначение меры жидкости или мерного сосуда. В основном тексте использовано понятное обобщение, а неопределённость отмечена в сноске.
- source_word: וְהָיְתָה עֶשְׂרִים
  choice: оказывалось лишь двадцать
  rationale: Сохраняет параллелизм с первой половиной стиха и подчёркивает недостаточный выход.
