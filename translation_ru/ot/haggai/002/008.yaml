  text: לִ֥/י הַ/כֶּ֖סֶף וְ/לִ֣/י הַ/זָּהָ֑ב נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/008.yaml
  text: The silver is mine[a], and the gold is mine[b], declares Yahweh of Armies.
translation:
  language: ru
  text: «Мне принадлежит серебро, и Мне принадлежит золото», — возвещает Яхве Воинств.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в традиционном переводе: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: Моё
  rationale: Предлог לְ с суффиксом первого лица единственного числа выражает принадлежность. Именная конструкция «Моё серебро» естественно передаёт русский эквивалент без добавления связки и сохраняет вынесенное вперёд притяжательное слово.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: В паре с золотом существительное обозначает драгоценный металл, а не деньги.
- source_word: וְלִי
  choice: и Моё
  rationale: Повтор притяжательной формы сохранён, чтобы передать симметрию и усиленное утверждение принадлежности обоих металлов.
- source_word: הַזָּהָב
  choice: золото
  rationale: Прямое обозначение драгоценного металла сохраняет параллелизм с серебром.
- source_word: נְאֻם
  choice: возвещает
  rationale: В пророческой формуле слово вводит торжественное божественное изречение; «возвещает» звучит весомо, но понятно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Форма передаёт множественное число и смысл войск или небесных сил; сочетание «Яхве Воинств» сохраняет традиционную библейскую весомость, не используя менее понятное современному читателю «Саваоф».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя; транслитерация сохраняет его и не заменяет титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств
  rationale: Выбранный вариант передаёт семантику צְבָאוֹת и функцию цельного божественного титула; прописная буква помогает читателю распознать титульное употребление, не уточняя без основания, земные это войска или небесные.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Краткая параллельная структура оригинала сохранена; повтор «Моё» передаёт эмфазу еврейского לִי ... וְלִי.
