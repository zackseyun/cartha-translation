    text: 'Буквально: «нечистый [от] нефеш»; в этом контексте выражение означает ритуальную нечистоту вследствие соприкосновения с мёртвым телом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר חַגַּי
  choice: Тогда Аггей спросил
  rationale: Последовательный וַ передаёт развитие повествования; вопросительное содержание прямой речи позволяет естественно перевести אָמַר как «спросил».
- source_word: טְמֵא נֶפֶשׁ
  choice: тот, кто нечист из-за прикосновения к умершему
  rationale: Это устойчивое выражение о ритуальной нечистоте, связанной с умершим; функциональный перевод устраняет ошибочное понимание слова נֶפֶשׁ как «душа» в отвлечённом смысле.
- source_word: יִגַּע
  choice: коснётся
  rationale: Глагол обозначает физическое прикосновение или соприкосновение и здесь употреблён в контексте передачи ритуальной нечистоты.
- source_word: בְּכָל אֵלֶּה
  choice: чего-либо из этого
  rationale: Фраза отсылает к перечисленному в предыдущем стихе; по-русски такая формулировка естественно передаёт распределительный смысл условия.
- source_word: הֲיִטְמָא
  choice: станет ли оно нечистым?
  rationale: Передаёт вопрос о переходе предмета в состояние ритуальной нечистоты.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ
  choice: Священники ответили
  rationale: Русское «ответили» естественно охватывает еврейскую формулу «ответили и сказали», не меняя её смысла.
- source_word: יִטְמָא
  choice: Станет нечистым
  rationale: Ответ повторяет ключевую формулировку вопроса и выражает постановление священников о передаче нечистоты.
theological_decisions:
- issue: Характер нечистоты
  choice: Ритуальная нечистота вследствие соприкосновения с умершим
  alternative: Буквальное «нечист душой/человеком» либо нравственная нечистота
  rationale: Вопрос Аггея опирается на священнические предписания Торы; טְמֵא נֶפֶשׁ обозначает нечистоту, связанную с умершим, а не внутреннюю нравственную испорченность.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно-д dignified, с сохранением терминологии ритуальной чистоты. Избыточная еврейская формула «ответили и сказали» передана естественным русским «ответили».
