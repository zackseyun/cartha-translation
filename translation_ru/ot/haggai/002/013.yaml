  text: Then Haggai said[a], “If one who is unclean by contact with a dead body touches any of these, does it become unclean?” And the priests answered and said, “It becomes unclean.”
translation:
  language: ru
  text: 'Тогда Аггей спросил: «Если тот, кто нечист вследствие прикосновения к мёртвому телу[a], коснётся чего-либо из этого, станет ли оно нечистым?» Священники ответили: «Станет нечистым».'
  philosophy: optimal-equivalence
  footnotes:
