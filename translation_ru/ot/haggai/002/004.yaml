base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/004.yaml
  text: But now[a], be strong, Zerubbabel, declares Yahweh, and be strong, Joshua son of Jehozadak, the high priest, and be strong, all the people of the land, declares Yahweh, and work, for I am with you, declares Yahweh of Armies.
translation:
  language: ru
  text: Но теперь крепись, Зоровавель, — говорит Яхве. Крепись, Иисус, сын Иоседека, первосвященник, — говорит Яхве. Крепись, весь народ этой земли, — говорит Яхве, — и трудитесь, потому что Я с вами, — говорит Яхве Воинств[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь Саваоф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: В контексте выражение обозначает переход от прежнего уныния к нынешнему призыву; «но» естественно передаёт контрастную силу связки.
- source_word: חֲזַק / וַחֲזַק / וַחֲזַק
  choice: крепись
  rationale: Краткий повелительный глагол передаёт призыв обрести силу и мужество; троекратное повторение сохранено.
- source_word: נְאֻם יְהוָה
  choice: говорит Яхве
  rationale: Естественная для современного русского языка, но сохраняющая пророческую торжественность передача устойчивой формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано транслитерацией, а не заменено титулом.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Устоявшееся и точное русское название данной священнической должности.
- source_word: כָּל עַם הָאָרֶץ
  choice: весь народ этой земли
  rationale: В послепленном контексте הָאָרֶץ означает местную землю и её общину, а не всю землю как мир; указательное «этой» делает референцию ясной без сужения до одной социальной группы.
- source_word: וַעֲשׂוּ
  choice: и трудитесь
  rationale: Форма повелевает действовать; в непосредственном контексте речь идёт о работе по восстановлению храма. «Трудитесь» естественно выражает это, не добавляя разговорной окраски.
- source_word: כִּי אֲנִי אִתְּכֶם
  choice: потому что Я с вами
  rationale: Союз вводит основание для призыва к труду, а местоименная конструкция сохраняет выразительное божественное заверение.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Имя транслитерировано, а титул צְבָאוֹת переведён по смыслу как «Воинств»; традиционная форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя. Его транслитерация сохраняет различие между именем и титулом, не привнося конфессионального истолкования.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств
  rationale: Перевод раскрывает значение צְבָאוֹת как множества воинств и сохраняет имя Яхве. Написание «Воинств» подчёркивает, что это составной божественный титул, не уточняя без основания, небесные это воинства или земные.
translation_notes:
  register: Современный литературный русский с торжественным пророческим ритмом. Краткое «крепись» повторено трижды вслед за еврейским текстом; пунктуация разграничивает обращения и повторяющуюся формулу речи Яхве.
