  text: בַּ/יּ֣וֹם הַ/ה֣וּא נְאֻם יְהוָ֣ה צְבָא֡וֹת אֶ֠קָּחֲ/ךָ זְרֻבָּבֶ֨ל בֶּן שְׁאַלְתִּיאֵ֤ל עַבְדִּ/י֙ נְאֻם יְהוָ֔ה וְ/שַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם כִּֽי בְ/ךָ֣ בָחַ֔רְתִּי נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/023.yaml
  text: On that day[a], declares Yahweh of Armies, I will take you, Zerubbabel son of Shealtiel, my servant, declares Yahweh, and I will make you like a signet ring, for I have chosen you[b], declares Yahweh of Armies.
translation:
  language: ru
  text: «В тот день, — возвещает Яхве воинств, — Я возьму тебя, Зоровавель, сын Шеалтииля, мой слуга, — возвещает Яхве, — и сделаю тебя словно перстень-печать, потому что Я избрал тебя, — возвещает Яхве воинств».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь Саваоф». Образ перстня-печати указывает на ценность, принадлежность, полномочия и удостоверение; ср. Иер. 22:24.'
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Сохранена пророческая временная формула; этот оборот естественен для современного литературного русского языка.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: возвещает Яхве Воинств
  rationale: נְאֻם передано торжественной формулой пророческого провозглашения, а צְבָאוֹת — прозрачным обозначением воинств, находящихся под властью Яхве.
- source_word: אֶקָּחֲךָ
  choice: Я возьму тебя
  rationale: Сохранено основное значение לקח без преждевременной замены на «изберу», поскольку избрание прямо названо далее.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Зоровавель, сын Салафииля
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; родственная связь передана прямо.
- source_word: עַבְדִּי
  choice: раб Мой
  rationale: В контексте царско-пророческого обращения обозначает принадлежащего Богу и исполняющего Его поручение служителя; «раб Мой» сохраняет традиционную библейскую весомость выражения.
- source_word: וְשַׂמְתִּיךָ כַּחוֹתָם
  choice: и сделаю тебя подобным перстню-печати
  rationale: Сохранены действие שׂים и сравнение с חוֹתָם; «перстень-печать» ясно передаёт предмет, служивший знаком власти, принадлежности и удостоверения.
- source_word: כִּי בְךָ בָחַרְתִּי
  choice: потому что Я избрал тебя
  rationale: כִּי передано причинно, а завершённость божественного избрания выражена русским прошедшим временем.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Повтор формулы сохранён, поскольку он придаёт каждому элементу обещания торжественную пророческую авторитетность.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, непосредственно присутствующее в еврейском тексте, без замены титулом.
- issue: Передача צְבָאוֹת
  choice: Воинств
  alternative: Саваоф; Небесных Воинств
  rationale: «Воинств» сохраняет широкий образ земных и небесных сил и не сужает его добавлением отсутствующего в тексте определения «небесных».
- issue: Царско-мессианский смысл образа печати
  choice: Сохранить образ без истолковывающего расширения в основном тексте
  alternative: Мой царский перстень-печать
  rationale: Контекст Зоровавеля и параллель с Иеремией 22:24 допускают царско-династическое прочтение, однако определения «царский» и «Мой» при חוֹתָם в тексте отсутствуют.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Повтор формулы «возвещает Яхве» сохранён. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый русский библейский регистр; синтаксис и лексика при этом не архаизированы.
