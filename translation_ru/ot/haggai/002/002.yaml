base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/002.yaml
  text: Speak now to Zerubbabel son of Shealtiel[a], governor of Judah, and to Joshua son of Jehozadak, the high priest, and to the remnant of the people, saying[b],
translation:
  language: ru
  text: 'Скажи теперь Зоровавелю, сыну Шеалтиила, правителю Иудеи, и Иисусу, сыну Иегоцадака, первосвященнику, и остатку народа[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставшимся из народа». Еврейское слово может обозначать тех, кто остался, и вместе с тем иметь характерный для пророческих книг оттенок понятия «остаток».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Скажи же
  rationale: Императив передаёт повеление обратиться к названным людям; частица נָא здесь усиливает настоятельность, естественно выраженную русским «же», без оттенка вежливой просьбы.
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: Зоровавелю, сыну Салафииля
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, остающиеся узнаваемыми и соответствующие еврейским именам.
- source_word: פַּחַת יְהוּדָה
  choice: правителю Иудеи
  rationale: פֶּחָה обозначает областного правителя персидского периода; «правитель» ясно передаёт должность и естественно звучит по-русски.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Иисусу, сыну Иоседека
  rationale: Выбраны традиционные русские библейские формы имён; еврейский текст здесь содержит полную форму יְהוֹשֻׁעַ.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященнику
  rationale: Общепринятое и точное русское обозначение верховной священнической должности в Израиле.
- source_word: שְׁאֵרִית הָעָם
  choice: остатку народа
  rationale: «Остаток» сохраняет как прямой смысл оставшейся части общины, так и возможный пророческий богословский оттенок термина שְׁאֵרִית.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит содержание речи в следующем стихе; в современном русском эту функцию естественнее и яснее передаёт двоеточие, чем буквальное «говоря».
theological_decisions:
- issue: Возможный пророческий смысл שְׁאֵרִית («остаток»)
  choice: остатку народа
  alternative: остальным из народа
  rationale: «Остаток» не ограничивает выражение лишь количественным значением и сохраняет присущую пророческой лексике смысловую напряжённость, не навязывая ей отдельного догматического толкования.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Традиционные русские формы библейских имён сохранены ради узнаваемости; громоздкое буквальное «говоря» заменено нормативным двоеточием.
