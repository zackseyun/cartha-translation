source:
  edition: WLC
  text: הֵ֣ן יִשָּׂא אִ֨ישׁ בְּשַׂר קֹ֜דֶשׁ בִּ/כְנַ֣ף בִּגְד֗/וֹ וְ/נָגַ֣ע בִּ֠/כְנָפ/וֹ אֶל הַ/לֶּ֨חֶם וְ/אֶל הַ/נָּזִ֜יד וְ/אֶל הַ/יַּ֧יִן וְ/אֶל שֶׁ֛מֶן וְ/אֶל כָּל מַאֲכָ֖ל הֲ/יִקְדָּ֑שׁ וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ לֹֽא׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/012.yaml
  text: Suppose a man carries holy meat in the fold of his garment[a], and with his fold touches bread, stew, wine, oil, or any food—does it become holy? And the priests answered and said[b], “No.”
translation:
  language: ru
  text: 'Допустим, человек несёт священное мясо[a] в складке своей одежды[b] и этой складкой коснётся хлеба, похлёбки, вина, масла или какой-либо пищи. Станет ли оно священным? Священники ответили: «Нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плоть святыни»; то есть посвящённое Богу мясо жертвы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в краю (углу, поле) своей одежды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Допустим
  rationale: Вводит гипотетический случай, предложенный священникам для правового решения; «допустим» естественно передаёт эту функцию в современном русском языке.
- source_word: יִשָּׂא אִישׁ
  choice: человек несёт
  rationale: Передаёт обобщённый характер примера и обычное в данном контексте значение נשׂא — «нести».
- source_word: בְּשַׂר קֹדֶשׁ
  choice: священное мясо
  rationale: Речь идёт о мясе жертвы, обладающем обрядовым статусом святыни; формулировка близка к еврейскому тексту и понятна без излишнего истолкования.
- source_word: בִּכְנַף בִּגְדוֹ
  choice: в поле своей одежды
  rationale: כָּנָף обозначает край, полу или угол одежды; здесь эта часть одежды служит для переноски мяса. «Пола» сохраняет конкретный образ и позволяет ясно описать последующее соприкосновение.
- source_word: וְנָגַע בִּכְנָפוֹ
  choice: и этой полой касается
  rationale: Контакт происходит посредством полы одежды, в которой несут священное мясо; указательное слово делает связь с предшествующей фразой ясной.
- source_word: נָזִיד
  choice: похлёбка
  rationale: Обозначает варёное блюдо или густую жидкую пищу; «похлёбка» — естественный и достаточно широкий русский эквивалент.
- source_word: שֶׁמֶן
  choice: масло
  rationale: Еврейское слово само по себе означает масло; вероятное оливковое происхождение не добавлено в основной текст.
- source_word: כָּל מַאֲכָל
  choice: какая-либо другая пища
  rationale: В контексте перечня выражение расширяет вопрос на любой иной вид пищи; «другая» естественно связывает обобщение с названными продуктами.
- source_word: הֲיִקְדָּשׁ
  choice: Станет ли эта пища священной?
  rationale: Передаёт вопрос о приобретении обрядовой святости вследствие контакта, не подменяя его нравственным или внутренним освящением.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ לֹא
  choice: 'Священники ответили: «Нет».'
  rationale: Естественно передаёт еврейскую формулу с двумя глаголами одним русским глаголом речи без потери содержания.
theological_decisions:
- issue: Передаётся ли обрядовая святость через опосредованный контакт
  choice: Вопрос представлен как случай, когда прочей пищи касается пола одежды, в которой находится священное мясо; ответ священников отрицательный.
  alternative: Понять соприкосновение как непосредственный контакт прочей пищи со священным мясом.
  rationale: Еврейский текст повторяет כָּנָף и тем самым указывает на контакт посредством полы одежды. Перевод сохраняет юридико-обрядовый смысл вопроса и не переносит его в область нравственного или внутреннего освящения.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным изложением. Термин «священное» последовательно обозначает обрядовый статус. «Пола одежды» сохраняет предметную конкретность древнего правового примера; синтаксис слегка разгружен разделением вопроса на два предложения.
