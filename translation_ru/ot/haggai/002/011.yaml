  text: 'Так говорит Яхве Воинств: «Спроси священников о наставлении[a], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о законе»; возможен также смысл: «попросить у них решения». Здесь еврейское слово тора, вероятно, означает священническое наставление или решение по вопросу закона, а не обязательно Тору как книгу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного литературного русского языка пророческая формула, сохраняющая торжественный регистр и настоящее время формулы посланника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Традиционно и достаточно широко передаёт титул, не ограничивая его смысл только земными армиями.
- source_word: שְׁאַל נָא
  choice: Спросите
  rationale: Императив передан прямо; частица נָא смягчает побуждение, но отдельное «пожалуйста» здесь звучало бы неестественно в речи Бога через пророка.
- source_word: אֶת הַכֹּהֲנִים
  choice: священников
  rationale: Прямое обозначение священников как компетентных истолкователей ритуально-правового вопроса.
- source_word: תּוֹרָה
  choice: о наставлении
  rationale: Сохраняет основное значение «наставление» и не сводит слово ни к книге Торы, ни исключительно к обязательному судебному постановлению; контекст указывает на священническое разъяснение закона.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Вводит содержание вопроса, которое следует в следующем стихе; причастная форма сохраняет незавершённость данного стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие без замены титулом.
- issue: Значение תּוֹרָה в священническом контексте
  choice: о наставлении
  alternative: о законе; попросите решения
  rationale: Формулировка сохраняет смысловую широту слова и одновременно позволяет контексту следующих стихов показать, что речь идёт о священническом ритуально-правовом разъяснении.
translation_notes:
  register: Современный литературный русский язык с торжественностью пророческой формулы. Двоеточие и открывающая кавычка показывают начало прямой речи, продолжающейся в следующем стихе; конечная формула «сказав» намеренно сохраняет синтаксическую незавершённость оригинала.
