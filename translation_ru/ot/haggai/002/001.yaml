  yaml_path: translation/ot/haggai/002/001.yaml
  text: On the twenty-first day of the seventh month[a], the word of Yahweh came by the hand of Haggai the prophet, saying,
translation:
  language: ru
  text: 'В двадцать первый день седьмого месяца слово Яхве пришло через пророка Аггея:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשְּׁבִיעִי בְּעֶשְׂרִים וְאֶחָד לַחֹדֶשׁ
  choice: В двадцать первый день седьмого месяца
  rationale: Еврейская календарная формула обозначает двадцать первый день седьмого месяца; слово «день» подразумевается и естественно восполняется по-русски.
- source_word: הָיָה דְּבַר יְהוָה
  choice: было слово Яхве
  rationale: Сохранена обычная пророческая формула, в которой היה представляет явление или наступление Божьего слова; по-русски «было слово» звучит естественно и несколько ближе к форме оригинала, чем «пришло слово».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом «Господь».
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: через пророка Аггея
  rationale: Буквально «рукою пророка Аггея»; предлог בְּ в этом обороте выражает посредничество. Русское «через» ясно и естественно передаёт смысл идиомы.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит следующую прямую речь. В современном русском эту функцию естественно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Посредничество пророка в выражении בְּיַד
  choice: через пророка Аггея
  alternative: рукою пророка Аггея
  rationale: Оборот обозначает, что слово дано при посредстве Аггея. Перевод «через» сохраняет эту мысль, не превращая еврейскую идиому в неестественную русскую формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Календарная формула передана ясно; еврейская идиома בְּיַד раскрыта естественным русским оборотом. Двоеточие подготавливает последующую прямую речь.
