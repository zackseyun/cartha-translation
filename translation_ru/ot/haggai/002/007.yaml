  text: וְ/הִרְעַשְׁתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וּ/בָ֖אוּ חֶמְדַּ֣ת כָּל הַ/גּוֹיִ֑ם וּ/מִלֵּאתִ֞י אֶת הַ/בַּ֤יִת הַ/זֶּה֙ כָּב֔וֹד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/007.yaml
  text: And I will shake all the nations[a], and the treasures of all the nations will come, and I will fill this house with glory, says Yahweh of Armies.
translation:
  language: ru
  text: И Я потрясу все народы, и придут сокровища всех народов[a], и Я наполню этот дом славой, — говорит Яхве Воинств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному переводу: «и придёт Желаемый всеми народами». Еврейское выражение может также означать «драгоценности» или «желанные вещи» народов; глагол во множественном числе скорее указывает на собирательное значение.'
    reason: Альтернативное прочтение и сохранение исторически значимой богословской неоднозначности.
lexical_decisions:
- source_word: וְהִרְעַשְׁתִּי
  choice: И Я потрясу
  rationale: Порода hифиль глагола רעשׁ выражает причинение сотрясения или трепета. «Потрясу» естественно передаёт активное действие Бога без неоправданного усиления.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: גּוֹיִם здесь обозначает народы вообще, а не особую богословскую категорию «язычников».
- source_word: וּבָאוּ
  choice: и придут
  rationale: Форма продолжает пророческую последовательность и естественно передаётся будущим временем. Множественное число важно для понимания следующего словосочетания.
- source_word: חֶמְדַּת כָּל הַגּוֹיִם
  choice: сокровища всех народов
  rationale: חֶמְדַּת имеет форму единственного числа, но может употребляться собирательно в значении желанных, драгоценных вещей. Согласование с глаголом множественного числа וּבָאוּ поддерживает собирательно-вещественное понимание.
- source_word: וּמִלֵּאתִי
  choice: и Я наполню
  rationale: Порода пиэль глагола מלא означает «наполнять»; конструкция с дополнением и славой как содержанием прямо передана по-русски.
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: בַּיִת буквально означает «дом». В контексте речь идёт о храме, однако «этот дом» сохраняет образ и формулировку исходного текста.
- source_word: כָּבוֹד
  choice: славой
  rationale: В контексте храма и Божьего присутствия כָּבוֹד лучше всего передаётся словом «слава», сохраняющим значения величия и явленного великолепия.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя יהוה передано как «Яхве», а צְבָאוֹת — прозрачным современным эквивалентом «Воинств», сохраняющим военный и небесно-космический оттенок титула.
theological_decisions:
- issue: Значение חֶמְדַּת כָּל הַגּוֹיִם
  choice: 'Собирательно-вещественное: «сокровища всех народов»'
  alternative: 'Личное/мессианское: «Желаемый всеми народами»; либо вещественное: «всё драгоценное у всех народов»'
  rationale: Существительное допускает значение желанных или драгоценных вещей, а глагол множественного числа וּבָאוּ весомо указывает на собирательный смысл. Основной текст не вносит однозначное мессианское толкование туда, где еврейская грамматика его не требует; традиционное прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Синтаксический параллелизм исходного стиха сохранён; архаизм «Саваоф» не использован.
