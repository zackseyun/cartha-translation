base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/021.yaml
  text: Deliverers will go up on Mount Zion to judge the hill country of Esau[c][b][a], and the kingdom will belong to Yahweh.
translation:
  language: ru
  text: И взойдут избавители[a] на гору Сион, чтобы судить горную область Исава[b], и царство[c] будет принадлежать Господу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасители». Здесь еврейское слово обозначает тех, через кого приходит избавление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гору Исава»; вероятно, имеется в виду горная область Эдома.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «царская власть»; также возможно: «владычество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלוּ
  choice: И взойдут
  rationale: Форма совершенного вида с союзом в пророческой последовательности передаёт будущее действие. Глагол сохраняет конкретный образ восхождения на Сион.
- source_word: מוֹשִׁעִים
  choice: избавители
  rationale: Причастие во множественном числе обозначает людей, приносящих избавление. «Избавители» ясно передаёт их роль, не смешивая её с исключительным титулом Бога как Спасителя.
- source_word: בְּהַר צִיּוֹן
  choice: на гору Сион
  rationale: Предлог при глаголе восхождения естественно передаётся направлением «на гору»; сохраняются топографический образ и имя Сион.
- source_word: לִשְׁפֹּט
  choice: чтобы судить
  rationale: Инфинитив прямо выражает цель, а שפט прежде всего означает «судить», хотя в данном контексте может также подразумевать управление.
- source_word: אֶת הַר עֵשָׂו
  choice: горную землю Исава
  rationale: הַר может обозначать не только отдельную гору, но и горную область. Здесь Исав представляет Эдом, поэтому выражение передаёт территориальный смысл, не устраняя буквальную альтернативу.
- source_word: וְהָיְתָה לַיהוָה
  choice: будет принадлежать Господу
  rationale: Конструкция היה с ל естественно выражает принадлежность. Тетраграмматон передан традиционным русским «Господь».
- source_word: הַמְּלוּכָה
  choice: царство
  rationale: Слово охватывает значения царства, царской власти и владычества. «Царство» естественно и торжественно звучит в основном тексте, а смысловой диапазон отмечен в сноске.
theological_decisions:
- issue: Множественное число מוֹשִׁעִים при утверждении Божьего царствования
  choice: избавители
  alternative: спасители
  rationale: Текст говорит о нескольких действующих лицах, через которых приходит избавление, но завершает стих утверждением о принадлежности царства Господу. Выбор сохраняет человеческую посредническую роль, не превращая её в соперничество с Божьей властью.
- issue: Значение הַמְּלוּכָה в заключительной фразе
  choice: царство будет принадлежать Господу
  alternative: царская власть / владычество будет принадлежать Господу
  rationale: Еврейское существительное может обозначать как царство, так и саму царскую власть. Основной текст сохраняет естественное «царство», а сноска не позволяет чрезмерно сузить значение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Синтаксис близок к еврейскому, но естественен по-русски; неоднозначность ключевых слов вынесена в сноски.
