source:
  edition: WLC
  text: כִּ֗י כַּֽ/אֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔/י יִשְׁתּ֥וּ כָֽל הַ/גּוֹיִ֖ם תָּמִ֑יד וְ/שָׁת֣וּ וְ/לָע֔וּ וְ/הָי֖וּ כְּ/ל֥וֹא הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/016.yaml
  text: For just as you drank on my holy mountain[a], all the nations will drink continually; they will drink and swallow[b], and they will be as though they had never been.
translation:
  language: ru
  text: Ибо, как вы пили на Моей святой горе, так все народы будут пить непрестанно[a]; будут пить и глотать[b] — и будут как будто их никогда не было.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ питья в пророческой речи, вероятно, указывает на переживание Божьего суда.
    reason: cross_reference
  - marker: b
    text: Еврейский глагол может означать «проглатывать», возможно подчёркивая, что выпитое поглощается полностью.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит основание или пояснение к предшествующему провозглашению суда и сохраняет торжественный пророческий строй.
- source_word: כַּאֲשֶׁר
  choice: как… так
  rationale: Ясно передаёт сопоставление между прежним поступком адресатов и грядущей участью народов.
- source_word: שְׁתִיתֶם
  choice: вы пили
  rationale: Форма второго лица множественного числа обращена к Едому; прошедшее время естественно передаёт завершённое действие в контексте падения Иерусалима.
- source_word: עַל הַר קָדְשִׁי
  choice: на Моей святой горе
  rationale: Сохраняет конкретный образ святой горы Господа, то есть Сиона/Иерусалима, без поясняющей вставки в основной текст.
- source_word: יִשְׁתּוּ כָל הַגּוֹיִם תָּמִיד
  choice: все народы будут пить непрестанно
  rationale: Передаёт будущее следствие, всеобщий охват и усилительное значение תָּמִיד как продолжающегося, неослабевающего действия.
- source_word: וְשָׁתוּ
  choice: будут пить
  rationale: Повтор глагола сохранён ради риторического усиления оригинала.
- source_word: וְלָעוּ
  choice: глотать
  rationale: Передаёт вероятное значение полного поглощения питья; неоднозначность отмечена в сноске без замены образа толкованием.
- source_word: וְהָיוּ כְּלֹא הָיוּ
  choice: и станут словно их никогда не было
  rationale: Естественно по-русски сохраняет сравнение и его предельную силу, не превращая его в более прямое утверждение об уничтожении.
theological_decisions:
- issue: Смысл образа питья
  choice: Сохранить в основном тексте буквальный образ питья, который в контексте, вероятно, обозначает переживание Божьего суда.
  alternative: Прямо перевести как «испытать Божий суд» либо понимать речь только о буквальном пиршестве и опьянении.
  rationale: Пророческий контекст поддерживает образ чаши суда, однако сам еврейский текст говорит о питье; перевод не должен устранять образность и её напряжение.
- issue: К кому относится «вы»
  choice: Оставить местоименное обращение без добавления имени; по контексту оно относится к Едому.
  alternative: Вставить в основной текст «вы, эдомитяне» или отнести обращение ко всем народам либо к Иудее.
  rationale: Ближайший контекст обращён к Едому, но имя отсутствует в самом стихе, поэтому его не следует вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Повтор «пить» сохранён как значимый риторический приём; синтаксис сделан ясным посредством конструкции «как… так». Прописная буква в «Моей» обозначает речь Бога согласно русской библейской издательской традиции.
