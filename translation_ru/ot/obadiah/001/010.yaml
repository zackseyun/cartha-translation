  text: מֵ/חֲמַ֛ס אָחִ֥י/ךָ יַעֲקֹ֖ב תְּכַסְּ/ךָ֣ בוּשָׁ֑ה וְ/נִכְרַ֖תָּ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/010.yaml
  text: Because of the violence done to your brother Jacob[a], shame will cover you, and you will be cut off forever.
translation:
  language: ru
  text: За насилие над твоим братом Иаковом[a] тебя покроет позор, и ты будешь отсечён навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из-за насилия против твоего брата Иакова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/חֲמַס
  choice: За насилие над
  rationale: חָמָס обозначает насилие, жестокость или несправедливое злодеяние; предлог מִן здесь имеет причинное значение. Оборот «за насилие над» естественно передаёт основание суда и направленность действия против Иакова.
- source_word: אָחִי/ךָ
  choice: твоим братом
  rationale: Буквальное значение אָח — «брат». Оно сохраняет родственную связь между Эдомом и Иаковом и нравственную тяжесть обвинения.
- source_word: יַעֲקֹב
  choice: Иаковом
  rationale: Сохранено прямо названное в еврейском тексте имя Иаков, которое в контексте также представляет происходящий от него народ.
- source_word: תְּכַסְּ/ךָ
  choice: тебя покроет
  rationale: כסה значит «покрывать». При подлежащем «позор» буквальный образ ясен и естественен по-русски.
- source_word: בוּשָׁה
  choice: позор
  rationale: בּוּשָׁה означает стыд или позор. «Позор» здесь хорошо выражает публичное бесчестие как следствие суда.
- source_word: וְ/נִכְרַ֖תָּ
  choice: и ты будешь истреблён
  rationale: Нифаль глагола כרת буквально передаёт отсечение, а в пророческом приговоре означает устранение или уничтожение. «Будешь истреблён» звучит естественнее современного русского «будешь отсечён» и передаёт силу контекста.
- source_word: לְ/עוֹלָם
  choice: навеки
  rationale: עוֹלָם указывает здесь на непреходящую длительность приговора; «навеки» — краткое и достойное русское соответствие.
theological_decisions:
- issue: Референт имени «Иаков» и значение братства
  choice: 'Сохранено выражение «твой брат Иаков»: имя обозначает как патриарха, так и происшедший от него народ.'
  alternative: Заменить имя на «Израиль» ради немедленной ясности национального референта.
  rationale: Еврейский текст прямо говорит «твой брат Иаков». Такое чтение сохраняет семейную основу обвинения против Эдома и не подменяет исходную формулировку толкованием.
- issue: Сила выражения וְנִכְרַתָּ
  choice: «и ты будешь истреблён»
  alternative: «и ты будешь отсечён»
  rationale: Буквальный образ допускает «отсечение», но в данном приговоре речь идёт об окончательном устранении Эдома. Выбранная формулировка передаёт контекстуальную силу, не уточняя способ исполнения суда.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный пророческий регистр. Сохранены имя Иаков, родственная лексика и образ покрывающего позора; неестественный для русского буквальный оборот «быть отсечённым» передан контекстуально.
