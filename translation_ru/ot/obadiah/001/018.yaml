source:
  edition: WLC
  text: וְ/הָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּ/בֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּ/בֵ֤ית עֵשָׂו֙ לְ/קַ֔שׁ וְ/דָלְק֥וּ בָ/הֶ֖ם וַ/אֲכָל֑וּ/ם וְ/לֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְ/בֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/018.yaml
  text: The house of Jacob will be a fire[a], and the house of Joseph a flame, and the house of Esau stubble. They will burn them and consume them, and there will be no survivor for the house of Esau[b], for Yahweh has spoken.
translation:
  language: ru
  text: Дом Иакова станет огнём, дом Иосифа — пламенем, а дом Исава — соломой. Они разгорятся среди них[a] и пожрут их, и из дома Исава не останется ни одного уцелевшего[b], ибо Яхве сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение кратко и допускает разные передачи: «разгорятся среди них (или против них)»; возможно также: «подожгут их».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет остатка». Еврейское שָׂרִיד означает уцелевшего человека или остаток переживших бедствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יַעֲקֹב
  choice: дом Иакова
  rationale: Сохраняет пророческий корпоративный образ рода и народа, не сводя его к домашнему хозяйству.
- source_word: אֵשׁ
  choice: огонь
  rationale: Естественно передаёт предикативную метафору разрушительной силы.
- source_word: בֵית יוֹסֵף
  choice: дом Иосифа
  rationale: Сохраняет параллелизм и коллективное обозначение связанных с Иосифом израильских племён.
- source_word: לֶהָבָה
  choice: пламя
  rationale: Образно и естественно сочетается с «огнём», сохраняя поэтическое усиление.
- source_word: בֵית עֵשָׂו
  choice: дом Исава
  rationale: Передаёт коллективное обозначение потомков Исава, то есть Эдома, и сохраняет повтор исходной формулы.
- source_word: לְקַשׁ
  choice: солома
  rationale: Русское «солома» ясно передаёт сухой, легко воспламеняющийся растительный остаток; «жнивьё» возможно, но менее обычно для широкого читателя.
- source_word: וְדָלְקוּ בָהֶם
  choice: они подожгут их
  rationale: В контексте последовательной метафоры огня естественно передаёт враждебное действие против дома Исава; компактная еврейская конструкция допускает и менее каузативное понимание.
- source_word: וַאֲכָלוּם
  choice: и пожрут
  rationale: Сохраняет сильный глагол «есть, пожирать» и одновременно естественно продолжает образ огня.
- source_word: שָׂרִיד
  choice: не останется никого
  rationale: Контекстуально передаёт отсутствие уцелевших, не добавляя положительных богословских ассоциаций слова «остаток».
- source_word: כִּי יְהוָה דִּבֵּר
  choice: потому что Яхве сказал это
  rationale: Передаёт основание и непреложность пророчества, сохраняя личное имя Бога согласно проектному решению.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя и соответствует предоставленному проектному решению.
- issue: Значение «дома Иакова» и «дома Иосифа»
  choice: Коллективные родо-национальные обозначения Израиля
  alternative: Только буквальные семьи или династии
  rationale: Параллелизм и контекст пророчества указывают на народы и племенные объединения; буквальный образ «дома» оставлен без догматического уточнения.
- issue: Значение שָׂרִיד
  choice: никого не останется, то есть не будет уцелевшего
  alternative: не будет остатка
  rationale: Формулировка сохраняет силу объявления полного суда и избегает навязывания положительного смысла богословского «остатка».
- issue: Синтаксис וְדָלְקוּ בָהֶם
  choice: они подожгут их
  alternative: они загорятся среди них; они запылают против них
  rationale: Контекст огня и последующее «пожрут» поддерживают направленное разрушительное действие, однако неоднозначность компактной конструкции отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого параллелизма. Эллипсис «дом Иосифа — пламенем» поддерживает ритм. «Пожрут» намеренно сильнее нейтрального «уничтожат» и продолжает библейский образ пожирающего огня.
