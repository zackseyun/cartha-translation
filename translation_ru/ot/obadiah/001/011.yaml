source:
  edition: WLC
  text: בְּ/יוֹם֙ עֲמָֽדְ/ךָ֣ מִ/נֶּ֔גֶד בְּ/י֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑/וֹ וְ/נָכְרִ֞ים בָּ֣אוּ שער/ו וְ/עַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּ/אַחַ֥ד מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/011.yaml
  text: On the day when you stood aloof[a], on the day strangers carried off his wealth, and foreigners entered his gates and cast lots over Jerusalem[c][b], you too were like one of them.
translation:
  language: ru
  text: В тот день, когда ты стоял в стороне[a], когда чужеземцы уносили его богатство[b], иноплеменники входили в его ворота[c] и бросали жребий о Иерусалиме, — и ты был как один из них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стоял поодаль»; еврейский оборот буквально говорит о стоянии напротив или на расстоянии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его войско» или «его силу». Еврейское слово חֵיל может означать войско, силу, имущество или богатство.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «его ворота» — вероятно, ворота олицетворённого Иерусалима или Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָדְךָ מִנֶּגֶד
  choice: ты стоял в стороне
  rationale: Оборот буквально указывает на стояние напротив или поодаль, а в контексте передаёт отстранённое невмешательство. «Стоял в стороне» естественно выражает и пространственный, и нравственный оттенок.
- source_word: שְׁבוֹת
  choice: уносили
  rationale: Глагол часто означает захват пленных, но при объекте חֵילוֹ указывает на захват и унос имущества или ресурсов.
- source_word: זָרִים
  choice: чужеземцы
  rationale: Передаёт значение посторонних, чужих народу людей и сохраняет различие со следующим נָכְרִים.
- source_word: חֵילוֹ
  choice: его богатство
  rationale: חֵיל может означать силу, войско или состояние и богатство. Контекст разграбления города делает «богатство» наиболее вероятным, при сохранении альтернатив в примечании.
- source_word: נָכְרִים
  choice: иноплеменники
  rationale: Обозначает людей, признаваемых чужими или иностранными; отдельный русский эквивалент сохраняет вариативность еврейского параллелизма.
- source_word: בָּאוּ שערו
  choice: входили в его ворота
  rationale: Масоретская форма указывает на «его ворота»; местоименный суффикс соотносится с олицетворённым Иерусалимом или Иудой.
- source_word: יַדּוּ גוֹרָל
  choice: бросали жребий
  rationale: Устойчивый оборот о распределении добычи или решении участи посредством жребия.
- source_word: גַּם אַתָּה כְּאַחַד מֵהֶם
  choice: и ты был как один из них
  rationale: Сохраняет сравнительную конструкцию и подчёркивает причисление Эдома к виновным, не усиливая её до прямого тождества.
theological_decisions:
- issue: Смысл позиции Эдома в עמד מנגד
  choice: Виновное невмешательство, нравственно сближающее Эдом с нападавшими
  alternative: Лишь описание физического нахождения поодаль
  rationale: Заключение «и ты был как один из них» показывает, что отстранённость оценивается как соучастие, однако перевод сохраняет образ стояния в стороне, не подменяя его толкованием.
- issue: Референт местоимений в חֵילוֹ и שערו
  choice: Олицетворённый Иерусалим или Иуда, переданный местоимением «его»
  alternative: Явно назвать Иерусалим или Иуду в тексте
  rationale: Еврейский текст оставляет референт грамматически невыраженным; местоимение сохраняет эту особенность и связанную с ней неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «в тот день… когда» слегка упорядочен ради естественного русского синтаксиса; тире выделяет итоговое обвинение. Лексические и референтные неоднозначности сохранены в тексте и примечаниях.
