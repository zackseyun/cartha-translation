source:
  edition: WLC
  text: חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לֶ/אֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵ/אֵ֤ת יְהוָה֙ וְ/צִיר֙ בַּ/גּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְ/נָק֥וּמָה עָלֶי/הָ לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/001.yaml
  text: 'The vision of Obadiah[a]. Thus says the Lord GOD concerning Edom: We have heard a report from Yahweh, and a messenger has been sent among the nations: “Rise up[c][b], and let us rise against her for battle.”'
translation:
  language: ru
  text: 'Видение Авдия. Так говорит Владыка Яхве об Эдоме:


    Мы услышали весть от Яхве,

    и среди народов послан вестник[a]:


    «Поднимайтесь! Поднимемся[c] против него[b] на войну!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланец», «посол».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «против неё» — Эдом представлен как страна; по-русски название «Эдом» мужского рода.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст не уточняет, кто подразумевается под «мы» в словах «мы услышали» и «поднимемся»; эти формы допускают разные толкования.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: видение
  rationale: Существительное обозначает пророческое видение или откровение; «видение» прямо передаёт значение и естественно звучит в заглавной формуле.
- source_word: עֹבַדְיָה
  choice: Авдий
  rationale: Использована устоявшаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохранена стандартная пророческая формула в настоящем времени.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי, а «Яхве» — личное имя יהוה; сочетание сохраняет оба элемента исходного титула и избегает неясного повтора «Господь ГОСПОДЬ».
- source_word: לֶאֱדוֹם
  choice: об Эдоме
  rationale: Предлог вводит тему пророчества, а не обязательно прямого адресата; «об Эдоме» естественно передаёт эту функцию.
- source_word: שְׁמוּעָה
  choice: весть
  rationale: Слово означает услышанное известие или сообщение; «весть» уместна в возвышенной, но современной пророческой речи.
- source_word: שָׁמַעְנוּ
  choice: мы услышали
  rationale: Форма совершенного вида передана без уточнения личности говорящих; русский совершенный вид естественно выражает состоявшееся получение вести.
- source_word: וְצִיר
  choice: и ... вестник
  rationale: צִיר может означать вестника, посланца или полномочного посла. «Вестник» согласуется с полученной вестью и не добавляет излишне дипломатического оттенка.
- source_word: בַּגּוֹיִם
  choice: к народам
  rationale: В сочетании с глаголом посылания выражение указывает на распространение призыва среди народов; русский оборот «послан к народам» естественен.
- source_word: שֻׁלָּח
  choice: послан
  rationale: Сохранён страдательный залог еврейской формы без названного действующего лица.
- source_word: קוּמוּ וְנָקוּמָה
  choice: Поднимайтесь! Поднимемся
  rationale: Сохранены множественное повеление и следующее за ним побуждение от первого лица множественного числа, а также повтор корня קום; русский призыв звучит энергично и естественно.
- source_word: עָלֶיהָ
  choice: против него
  rationale: Местоимение относится к Эдому. В русском согласование с мужским названием «Эдом» требует формы «него»; женский род еврейского местоимения отмечен в сноске.
- source_word: לַמִּלְחָמָה
  choice: на войну
  rationale: Прямо передан военный смысл выражения без смягчения до общего «сражения».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя «Яхве», тогда как אֲדֹנָי отдельно передано словом «Владыка».
- issue: Кто говорит «мы услышали» и «поднимемся»
  choice: сохранить формы первого лица множественного числа без определения говорящих
  alternative: уточнить, что говорят пророки, небесный совет или народы
  rationale: Еврейский текст не называет говорящих и не устанавливает однозначно, относится ли «мы» в двух фразах к одной группе; перевод не устраняет эту неоднозначность.
- issue: Род местоимения, относящегося к Эдому
  choice: согласовать с русским мужским названием «Эдом» и пояснить форму оригинала в сноске
  alternative: буквально поставить «против неё», подразумевая страну или народ
  rationale: Форма «против него» грамматически ясна по-русски, а сноска сохраняет образ Эдома как страны, выраженный женским местоимением в еврейском.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Поэтическая разбивка подчёркивает переход от заглавной формулы к вести и военному призыву. Избегаются архаизмы «се», «восстаньте» и конфессионально маркированная передача имени יהוה.
