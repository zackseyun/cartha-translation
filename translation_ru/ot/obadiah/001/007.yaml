base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/007.yaml
  text: All the men of your covenant have sent you to the border[a]; the men at peace with you have deceived you and prevailed against you[c][b]. Those who eat your bread have set a trap under you—there is no understanding in him.
translation:
  language: ru
  text: Все, кто состоял с тобой в договоре, отослали тебя до границы[a]. Те, кто был с тобой в мире, обманули тебя и одолели. Те, кто ел твой хлеб, поставили под тобой ловушку[b] — нет в нём понимания[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдворили тебя к границе»; возможно также: «сопроводили тебя до границы». Еврейский глагол здесь может иметь как нейтральный, так и враждебный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поставили под тобой западню». Значение редкого еврейского слова, переведённого как «ловушка», не вполне определённо.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «нет у него проницательности». Местоимение «в нём» может относиться к Эдому или к тому, к кому обращены эти слова; из-за краткости еврейской фразы возможны и другие толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד הַגְּבוּל שִׁלְּחוּךָ
  choice: проводили тебя до границы
  rationale: Глагол שׁלח в пиэле допускает нейтральный смысл «отослать/проводить» и враждебный «выдворить». В основном тексте сохранена сдержанная формулировка, а возможный враждебный оттенок отмечен в сноске.
- source_word: כֹּל אַנְשֵׁי בְרִיתֶךָ
  choice: все, кто был связан с тобой договором
  rationale: Передаёт буквальное «все люди твоего завета/договора» естественным современным русским языком и сохраняет политико-договорный характер отношений.
- source_word: הִשִּׁיאוּךָ
  choice: обманули тебя
  rationale: Хифиль от נשׁא здесь означает ввести в заблуждение или обмануть; «обманули» ясно соответствует контексту предательства.
- source_word: יָכְלוּ לְךָ
  choice: одолели
  rationale: Идиома означает «оказаться сильнее, взять верх над кем-либо»; «одолели» кратко и точно передаёт этот противительный смысл.
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: те, кто жил с тобой в мире
  rationale: Сохраняет значение отношений мира, не сводя выражение ни к личной дружбе, ни только к формальному союзу.
- source_word: לַחְמְךָ
  choice: те, кто ел твой хлеб
  rationale: Глагол «ел» подразумевается конструкцией и необходим в русском; образ хлеба сохранён как знак совместной трапезы и доверия.
- source_word: יָשִׂימוּ מָזוֹר תַּחְתֶּיךָ
  choice: расставили под тобой ловушку
  rationale: Редкое מָזוֹר по контексту обозначает ловушку или западню. Необычный пространственный образ «под тобой» сохранён.
- source_word: אֵין תְּבוּנָה בּוֹ
  choice: нет в нём разумения
  rationale: Мужской суффикс буквально означает «в нём», однако его референт не назван однозначно. Формулировка сохраняет эту неопределённость.
theological_decisions:
- issue: Референт местоименного суффикса в אֵין תְּבוּנָה בּוֹ
  choice: нет в нём разумения
  alternative: у него нет разумения / в этом нет смысла
  rationale: Еврейский мужской суффикс естественно передаётся «в нём», но может относиться к Эдому или к подразумеваемому адресату; перевод не закрепляет спорное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Параллелизм исходного стиха сохранён через три повторяющиеся конструкции; договорная лексика передана понятно без конфессионально нагруженного слова «завет». Необычная финальная фраза и неопределённость её референта намеренно не сглажены.
