  source_fidelity: 'Основной смысл передан верно: две параллельные условно-уступительные части, образ орла, гнезда среди звёзд, «оттуда» и действие Яхве сохранены. Однако «хотя бы ты поднялся ... и хотя бы устроил» в данной форме звучит по-русски неестественно и создаёт нежелательное смешение условно-сослагательного оттенка с будущим «низведу». «Даже если» ясно и естественно передаёт допустимый уступительный смысл אִם, не исключая условного понимания в сноске.'
  naturalness: «Даже если ты поднимешься высоко ... и даже если устроишь...» — современная литературная и ритмически прозрачная конструкция. «Говорит Яхве» естественно передаёт пророческую формулу נְאֻם יהוה; «низведу» оправдано умеренно торжественным регистром пророческого текста.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Орёл», «гнездо», «среди звёзд» и «низведу» сохраняют ключевые образы и направленность еврейского текста. Сноска перенесена к концу условно-уступительного комплекса, поскольку она относится к частицам אִם, а не специально к слову «орёл».
