base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/004.yaml
  text: Though you soar high like the eagle[a], and though you set your nest among the stars, from there I will bring you down, declares Yahweh.
translation:
  language: ru
  text: Даже если ты поднимешься высоко, как орёл, и даже если устроишь своё гнездо среди звёзд[a], оттуда Я низведу тебя, — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если ты поднимешься высоко, как орёл, и если устроишь своё гнездо среди звёзд». Еврейская частица может означать «если», но в этом контексте также допускает уступительный смысл: даже с величайшей высоты Яхве низведёт Эдом.'
    reason: Лексически возможное условное прочтение еврейских частиц אִם; примечание поставлено после всего комплекса, к которому относится.
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: Хотя бы ... и хотя бы
  rationale: 'Условная частица אִם допускает буквальное «если», однако в данном пророческом контексте обе параллельные части имеют уступительный смысл: даже предельная высота не спасёт Эдом.'
- source_word: תַּגְבִּיהַּ
  choice: ты поднялся высоко
  rationale: Порода hифиль от גבה выражает поднятие на высоту. Возвратная по смыслу русская конструкция естественно передаёт пространственный образ рядом со сравнением с орлом, не сводя его только к гордости.
- source_word: כַּנֶּשֶׁר
  choice: как орёл
  rationale: Префикс כְּ передаёт сравнение; определённая форма существительного здесь представляет орла как типичный образ высоты.
- source_word: בֵּין כּוֹכָבִים
  choice: среди звёзд
  rationale: בֵּין с множественным собирательным обозначением естественно переводится «среди» и описывает немыслимо высокое убежище.
- source_word: שִׂים קִנֶּךָ
  choice: устроил своё гнездо
  rationale: שׂים буквально означает «поместить, установить». «Устроил гнездо» звучит естественно по-русски и сохраняет образ безопасного жилища.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: 'Буквальное наречие подчёркивает: Яхве достанет Эдом даже из воображаемого высочайшего убежища.'
- source_word: אוֹרִידְךָ
  choice: Я низведу тебя
  rationale: Hифиль от ירד имеет каузативный смысл «заставить спуститься, свести вниз». «Низведу» сохраняет направленность и торжественный пророческий регистр, не добавляя образа броска.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Стандартная пророческая формула передана современно и торжественно; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное заветное имя Бога. Транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Условный или уступительный смысл אִם
  choice: уступительное «хотя бы»
  alternative: условное «если»
  rationale: 'Главная строка передаёт риторический смысл угрозы: какой бы недосягаемой ни казалась высота Эдома, Бог низведёт его. Буквально возможное условное прочтение сохранено в сноске.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Образ высоты, орла, гнезда и звёзд сохранён; синтаксический параллелизм двух уступительных частей воспроизведён.
