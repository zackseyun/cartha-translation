base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/013.yaml
  text: Do not enter the gate of my people in the day of their disaster[a]; do not look on his calamity, even you, in the day of his disaster[b]; and do not lay hands on his wealth in the day of his disaster.
translation:
  language: ru
  text: Не входи в ворота Моего народа в день их бедствия; не смотри и ты на его несчастье в день его бедствия; и не протягивай руки к его достоянию[a] в день его бедствия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к его богатству», «к его войску», «к его силе» или «к его имуществу». Еврейское слово может иметь все эти значения; в данном контексте вероятна речь о добыче и разграблении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא בְשַׁעַר עַמִּי
  choice: входи в ворота Моего народа
  rationale: Сохраняется конкретный образ городских ворот как места входа в город; глагол с предлогом естественно передан русским «входить в».
- source_word: בְּיוֹם אֵידָם / בְּיוֹם אֵידוֹ
  choice: в день их бедствия / в день его бедствия
  rationale: אֵיד означает бедствие, несчастье или гибель. «Бедствие» естественно для современного литературного русского и позволяет сохранить повторяющийся рефрен, а также переход от множественного суффикса к единственному.
- source_word: תֵּרֶא
  choice: не смотри
  rationale: Буквальное значение ראה — «видеть, смотреть». Контекст может подразумевать злорадное созерцание, но перевод не делает этот оттенок явным, сохраняя лексическую и нравственную напряжённость оригинала.
- source_word: גַם אַתָּה
  choice: и ты
  rationale: Передаёт подчёркнутый укор, обращённый к Эдому, естественнее для русского синтаксиса, чем буквальное «даже ты».
- source_word: בְרָעָתוֹ
  choice: на его несчастье
  rationale: רָעָה здесь обозначает постигшее бедствие, а не нравственное зло. «Несчастье» избегает неуместного значения морального зла и не дублирует אֵיד одним и тем же словом.
- source_word: וְאַל תִּשְׁלַחְנָה בְחֵילוֹ
  choice: не протягивай руки к его достоянию
  rationale: 'Хотя слово «рука» подразумевается идиомой שׁלח ב и не выражено отдельно, русское «протягивать руку к» естественно передаёт посягательство. חַיִל многозначно: сила, войско, богатство или имущество; «достояние» уместно в контексте разграбления, а неоднозначность отмечена в сноске.'
theological_decisions:
- issue: Переход от множественного числа к единственному в местоименных суффиксах
  choice: Сохранить «их бедствия» в первой части и «его несчастье / его бедствия / его достояние» далее
  alternative: Согласовать все местоимения либо во множественном, либо в единственном числе
  rationale: Еврейский текст переходит от народа как множества к народу или Иакову как единому, персонифицированному целому. Сохранение перехода не устраняет подлинную риторическую особенность текста.
- issue: Оттенок злорадства в תֵּרֶא
  choice: 'Перевести нейтральнее: «не смотри»'
  alternative: «не злорадствуй, глядя» или «не торжествуй над»
  rationale: Враждебный контекст допускает оттенок злорадного созерцания, однако сам глагол буквально означает «видеть, смотреть». Более формальная передача не превращает контекстуальный вывод в явное значение слова.
translation_notes:
  register: Современный литературный русский с достоинством пророческого запрета. Повтор «в день… бедствия» сохранён как риторический рефрен. Прописная буква в «Моего» отражает прямую речь Бога по русской издательской традиции, не добавляя отдельного богословского толкования.
