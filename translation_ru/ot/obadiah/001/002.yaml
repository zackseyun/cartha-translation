  text: הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֥וּי אַתָּ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/002.yaml
  text: Look[a], I have made you small among the nations[b]; you are greatly despised.
translation:
  language: ru
  text: Вот, Я сделал тебя малым среди народов[a][b]; тебя глубоко презирают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «незначительным среди народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-еврейски: «Я дал (поставил) тебя малым среди народов»; по смыслу: «Я сделал тебя малым среди народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-привлекающую внимание силу частицы естественным и достойным современным русским языком.
- source_word: קָטֹן
  choice: малым
  rationale: Сохраняет прямой образ малости и низкого положения; значение «незначительным» дано как допустимое контекстуальное уточнение в сноске.
- source_word: נְתַתִּיךָ
  choice: Я сделал тебя
  rationale: 'Буквально глагол означает «Я дал/поставил тебя», но с предикативным прилагательным выражает результат: Бог сделал адресата малым.'
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Здесь גּוֹיִם обозначает народы вообще, без более позднего специального противопоставления иудеев и язычников.
- source_word: בָּזוּי
  choice: тебя презирают
  rationale: Естественная русская конструкция передаёт состояние адресата как презираемого, выраженное еврейским страдательным причастием.
- source_word: מְאֹד
  choice: глубоко
  rationale: В сочетании с глаголом «презирать» естественно передаёт высокую степень, выраженную наречием מְאֹד.
theological_decisions:
- issue: Профетический перфект и временно-аспектное значение Божьего приговора
  choice: «Я сделал тебя»
  alternative: «Я сделаю тебя»; «Я делаю тебя»
  rationale: Еврейский перфект представляет действие как совершившееся или твёрдо постановленное и имеющее наличный результат. Прошедшее совершенного вида сохраняет эту определённость, не превращая высказывание без необходимости в простое предсказание будущего.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. «Вот» сохраняет риторическое усиление без архаизации; активная неопределённо-личная конструкция «тебя глубоко презирают» естественно передаёт еврейское страдательное причастие.
