  source_fidelity: 'Текст точно передаёт еврейский оригинал: הִנֵּה отражено риторическим «Вот», קָטֹן — «малым», נְתַתִּיךָ — естественным по-русски результативным «Я сделал тебя», а בַּגּוֹיִם — «среди народов». Прошедшее совершенного вида обоснованно сохраняет совершённо-декретивную силу перфекта, не навязывая будущего времени. «Тебя глубоко презирают» адекватно передаёт пассивное בָּזוּי и усиление מְאֹד.'
