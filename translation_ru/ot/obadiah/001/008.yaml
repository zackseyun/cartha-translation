base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/008.yaml
  text: Will I not[a], on that day, declares Yahweh, destroy the wise men from Edom, and understanding from the mountain of Esau?
translation:
  language: ru
  text: Разве не уничтожу Я в тот день, — возвещает Яхве, — мудрецов из Эдома и разумение с горы Исава[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с горы Исава» можно понимать как «из горной страны Исава»; буквально: «с горы Исава».'
    reason: Отмечает возможное региональное значение слова «гора», сохраняя буквальную передачу еврейского выражения в основном тексте.
lexical_decisions:
- source_word: הֲלֹוא
  choice: Разве не
  rationale: Сохраняет форму риторического вопроса, предполагающего утвердительный ответ, не превращая его в простое заверение.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивого временного выражения.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт весомую пророческую формулу как заявление Бога; глагол настоящего времени естественно вводит прямое божественное изречение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняет личное имя Бога, переданное тетраграмматоном, а не заменяет его титулом.
- source_word: וְהַאֲבַדְתִּי
  choice: уничтожу Я
  rationale: Каузативная форма выражает активное устранение со стороны Яхве; «уничтожу» сохраняет силу образа суда. Местоимение добавлено для ясности русского синтаксиса и подчёркивает, что действующим лицом остаётся Яхве.
- source_word: חֲכָמִים
  choice: мудрецов
  rationale: Передаёт обозначение мудрых людей и вероятного признанного круга советников в Эдоме; русское слово естественно и не требует искусственного уточнения пола.
- source_word: מֵאֱדוֹם
  choice: в Эдоме
  rationale: При русском глаголе «уничтожить» буквальное «из Эдома» звучало бы как указание на происхождение. Локативная передача ясно выражает устранение мудрецов из среды Эдома.
- source_word: וּתְבוּנָה
  choice: и разумение
  rationale: Сохраняет отвлечённое существительное и параллелизм между носителями мудрости и самой способностью понимать.
- source_word: מֵהַר עֵשָׂו
  choice: на горе Исава
  rationale: В основном тексте естественно по-русски обозначено место, лишаемое разумения; буквальное значение предлога и возможное региональное понимание сохранены в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Риторический характер вопроса
  choice: Разве не… уничтожу Я…?
  alternative: В тот день Я непременно уничтожу…
  rationale: Вопросительная частица присутствует в исходном тексте. Перевод сохраняет одновременно вопросительную форму и ожидаемый утвердительный смысл.
- issue: Соотношение Эдома и горы Исава
  choice: сохранены оба наименования
  alternative: свести оба обозначения к Эдому
  rationale: Параллельные наименования относятся к одному народу и краю, но исходный текст намеренно варьирует их; перевод не устраняет эту поэтическую и богословскую связь.
translation_notes:
  register: Современный литературный русский язык с достойной пророческой интонацией. Порядок слов и вставная формула сохраняют риторическую силу стиха, оставаясь понятными обычному читателю.
