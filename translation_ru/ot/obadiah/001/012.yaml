source:
  edition: WLC
  text: וְ/אַל תֵּ֤רֶא בְ/יוֹם אָחִ֨י/ךָ֙ בְּ/י֣וֹם נָכְר֔/וֹ וְ/אַל תִּשְׂמַ֥ח לִ/בְנֵֽי יְהוּדָ֖ה בְּ/י֣וֹם אָבְדָ֑/ם וְ/אַל תַּגְדֵּ֥ל פִּ֖י/ךָ בְּ/י֥וֹם צָרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/012.yaml
  text: Do not look on your brother in the day of his misfortune[a], and do not rejoice over the sons of Judah in the day of their destruction[c][b]; and do not make your mouth great in the day of distress.
translation:
  language: ru
  text: Не смотри со злорадством на твоего брата в день его бедствия[a], не радуйся гибели сынов Иуды в день их гибели и не говори высокомерно[b] в день скорби.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день его отчуждения»; возможно также: «в день, когда он стал чужим».'
    reason: Лексема נָכְרוֹ допускает значение бедствия в данном контексте, но этимологически и лексически связана также с чуждостью или отчуждением.
  - marker: b
    text: 'Букв.: «не делай великими уста твои», то есть не говори надменно и хвастливо.'
    reason: Основной текст передаёт смысл еврейской идиомы, а сноска сохраняет её буквальный образ.
lexical_decisions:
- source_word: תֵּרֶא
  choice: смотри со злорадством
  rationale: Глагол буквально означает «видеть, смотреть», но параллелизм с запретом радоваться и высокомерно говорить указывает здесь на злорадное наблюдение. Перевод сохраняет образ смотрения и передаёт его контекстуальный оттенок.
- source_word: אָחִיךָ
  choice: брата твоего
  rationale: Буквальное родственное обозначение сохраняет обличительную силу обращения к Эдому по отношению к братскому народу Иуды.
- source_word: נָכְרוֹ
  choice: его бедствия
  rationale: Форма допускает связь со значениями чуждости и отчуждения, однако в параллели с гибелью и скорбью обозначает постигшее брата несчастье. Неоднозначность отмечена в сноске.
- source_word: תִּשְׂמַח
  choice: не радуйся
  rationale: Прямой и естественный русский эквивалент, соответствующий торжественному пророческому регистру.
- source_word: לִבְנֵי יְהוּדָה
  choice: о сынах Иуды
  rationale: Сохранено явное родовое и национальное выражение «сыны Иуды», а предлог ל в контексте передан естественной русской конструкцией «радоваться о».
- source_word: אָבְדָם
  choice: их гибели
  rationale: Передаёт результат действия אבד — погибнуть, пропасть — и естественно описывает национальную катастрофу.
- source_word: תַּגְדֵּל פִּיךָ
  choice: не говори высокомерно
  rationale: Еврейская идиома буквально означает «не делай великими уста свои» и обозначает надменную, хвастливую речь; функциональный смысл вынесен в основной текст, буквальный образ — в сноску.
- source_word: צָרָה
  choice: скорби
  rationale: В данном контексте слово обозначает тяжёлое бедствие и стеснение; «скорбь» сохраняет краткость и возвышенный пророческий тон.
theological_decisions:
- issue: Родственная связь Эдома и Иуды
  choice: брата твоего
  alternative: сородича твоего
  rationale: «Брат» буквально передаёт אָח и сохраняет нравственную тяжесть предательства родственного народа.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Синтаксический параллелизм трёх запретов сохранён; архаизмы сведены к минимуму, но выражения «брат твой» и «сыны Иуды» удерживают библейскую образность.
