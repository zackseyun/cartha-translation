lexical_decisions:
- source_word: אֵיךְ
  choice: Как
  rationale: Вводит не вопрос, а восклицание, выражающее изумление полнотой разорения.
- source_word: נֶחְפְּשׂוּ
  choice: обыскан
  rationale: Передаёт тщательный поиск и его результат; единственное число естественно согласуется в русском с собирательно употреблённым именем «Исав».
- source_word: עֵשָׂו
  choice: Исав
  rationale: Сохраняет личное имя еврейского текста, которое здесь метонимически обозначает потомков Исава и Едом.
- source_word: נִבְעוּ
  choice: обнаружены
  rationale: Передаёт разыскание и раскрытие прежде скрытого, при этом не повторяет дословно предшествующий глагол.
- source_word: מַצְפֻּנָיו
  choice: его тайники
  rationale: Обозначает скрытые или припрятанные вещи; «тайники» естественно выражает и сокрытость, и контекст разграбления, не уточняя без необходимости, были ли это сокровища или хранилища.
theological_decisions:
- issue: Кого обозначает имя «Исав»
  choice: В основном тексте сохранено имя «Исав», а его собирательное значение пояснено в сноске.
  alternative: Заменить имя словом «Едом».
  rationale: Так сохраняется образность и формулировка еврейского текста без утраты исторической отсылки.
translation_notes:
  register: Современный литературный русский язык; краткий пророческий параллелизм и восклицательная интонация сохранены. Формулировка намеренно не уточняет, являются ли «тайники» скрытыми ценностями или местами их хранения.
