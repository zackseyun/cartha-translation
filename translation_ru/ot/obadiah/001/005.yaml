base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/005.yaml
  text: If thieves came to you[a], if robbers by night—how you have been destroyed!—would they not steal only enough for themselves? If grape gatherers came to you[b], would they not leave gleanings?
translation:
  language: ru
  text: 'Если бы к тебе пришли воры,

    если бы ночью нагрянули грабители —

    как бы ты был разорён![a] —

    разве они не украли бы лишь столько, сколько им нужно?[b]


    Если бы к тебе пришли сборщики винограда,

    разве они не оставили бы оставшихся гроздьев?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «как бы ты был уничтожен!» или «как бы ты был отсечён!». Еврейский глагол допускает несколько близких по смыслу вариантов в данном контексте опустошения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «разве они не украли бы сколько им достаточно?» — то есть только столько, сколько им нужно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּנָּבִים
  choice: воры
  rationale: Обычное современное русское обозначение тех, кто крадёт.
- source_word: שֹׁדְדֵי לַיְלָה
  choice: ночью нагрянули грабители
  rationale: «Грабители» передаёт насильственный характер разорения, а наречная конструкция естественно выражает указание на ночь; глагол «нагрянули» восполняет подразумеваемое сказуемое и передаёт внезапность прихода.
- source_word: אֵיךְ נִדְמֵיתָה
  choice: как же ты разорён
  rationale: Сохраняет восклицательный, скорбный характер оборота и соответствует контексту опустошения Эдома, не ограничивая смысл физическим уничтожением.
- source_word: הֲלוֹא יִגְנְבוּ דַּיָּם
  choice: разве они не украли бы лишь столько, сколько им нужно?
  rationale: Ясно передаёт идиому с דַּי, означающую достаточное для них количество, и подчёркивает контраст с полным разграблением.
- source_word: בֹּצְרִים
  choice: сборщики винограда
  rationale: Точно обозначает работников, собирающих виноград, а не собирателей урожая вообще.
- source_word: יַשְׁאִירוּ עֹלֵלוֹת
  choice: разве они не оставили бы немного ягод?
  rationale: Естественно по-русски передаёт оставшиеся после сбора виноградные ягоды и сохраняет образ неполного опустошения.
- source_word: לְךָ / לָךְ
  choice: к тебе
  rationale: Нейтрально передаёт направление движения; враждебный характер прихода уже очевиден из слов «воры» и «грабители».
