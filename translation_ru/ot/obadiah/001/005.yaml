  to: 'Если бы к тебе пришли воры,

    если бы ночью нагрянули грабители —

    как бы ты был разорён![a] —

    разве они не украли бы лишь столько, сколько им нужно?[b]


    Если бы к тебе пришли сборщики винограда,

    разве они не оставили бы оставшихся гроздьев?'
  rationale: Исправлено согласование условного периода, чтобы риторическое восклицание не превращало гипотетическое сравнение в отдельную констатацию. «Немного ягод» заменено на «оставшиеся гроздья», что точнее выражает עֹלֵלוֹת как остаток после сбора винограда. Сноска a согласована с условной формой основного текста; смысл и позиции обоих якорей сохранены.
