review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: два сравнения показывают, что обычные грабители и сборщики винограда оставляют хотя бы часть, в отличие от полного разорения адресата. Однако נִדְמֵיתָה — совершенная форма («ты разорён/погублен»), тогда как условные придаточные с «если бы пришли» естественнее требуют восклицания в условном плане: «как бы ты был разорён!» В исходном черновике происходит неудачный переход к изъявительному «как же ты разорён!» внутри нереального условия. עֹלֵלוֹת — не просто неопределённое «немного ягод», а оставшиеся после сбора гроздья/ягоды, то есть подбираемый остаток; это различие следует сохранить.'
  naturalness: «Если бы к тебе пришли воры, если бы ночью нагрянули грабители» звучит естественно, но согласование условного периода с «как бы ты был разорён!» делает синтаксис и риторический ход прозрачнее. «Сборщики винограда» — литературно и ясно. «Оставшиеся гроздья» естественно передаёт сельскохозяйственный образ без специального, потенциально неясного слова «подбор».
  terminology: '«Воры», «грабители», «разорён» и «сборщики винограда» соответствуют исходному тексту и современному литературному регистру. Для עֹלֵלוֹת предпочтительно «оставшиеся гроздья», а не «немного ягод»: последнее ослабляет значение остатка после сбора и меняет образ с гроздей на отдельные ягоды. Сноска b корректно объясняет דַּיָּם, но должна соответствовать условной форме перевода.'
