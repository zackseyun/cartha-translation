source:
  edition: WLC
  text: וְ/יָרְשׁ֨וּ הַ/נֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְ/הַ/שְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְ/יָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְ/אֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּ/בִנְיָמִ֖ן אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/019.yaml
  text: Those of the Negev will possess the hill country of Esau[a], and those of the Shephelah the land of the Philistines; they will also possess the territory of Ephraim and the territory of Samaria[b], and Benjamin will possess Gilead.
translation:
  language: ru
  text: Жители Негева овладеют[b] горной областью Исава, а жители Шефелы — землёй филистимлян[a]. Они также овладеют областью Ефрема и областью Самарии, а Вениамин — Галаадом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «филистимлян»; по смыслу речь идёт об их земле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «получат в наследие»; употреблённый здесь еврейский глагол может означать как наследование, так и вступление во владение землёй.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: овладеют
  rationale: Глагол ירשׁ может означать получение земли в наследие или вступление во владение ею, в том числе путём завоевания. «Овладеют» естественно передаёт территориальный контекст, не сводя смысл только к наследованию.
- source_word: הַנֶּגֶב
  choice: жители Негева
  rationale: Название южной области метонимически обозначает здесь её жителей, выступающих субъектом глагола. Географическое имя «Негев» сохранено.
- source_word: הַר עֵשָׂו
  choice: горная область Исава
  rationale: В территориальном выражении הַר обозначает не одиночную гору, а гористую область Эдома, связанную с Исавом.
- source_word: הַשְּׁפֵלָה
  choice: жители Шефелы
  rationale: Географическое название метонимически обозначает население этой области; уточнение «жители» делает синтаксическую роль явной.
- source_word: פְּלִשְׁתִּים
  choice: земля филистимлян
  rationale: В еврейском тексте стоит этноним «филистимляне», но объектом овладения в данном перечислении является их территория. «Земля филистимлян» ясно выражает подразумеваемый территориальный смысл.
- source_word: שְׂדֵה אֶפְרַיִם
  choice: область Ефрема
  rationale: שָׂדֶה буквально значит «поле», но здесь в территориальной формуле обозначает местность или область, а не отдельный участок.
- source_word: שְׂדֵה שֹׁמְרוֹן
  choice: область Самарии
  rationale: Как и в предыдущей параллельной фразе, שָׂדֶה имеет расширенное значение территории или области.
- source_word: בִנְיָמִן
  choice: Вениамин
  rationale: Имя родоначальника метонимически обозначает колено Вениамина; краткая форма естественна и сохраняет способ выражения оригинала.
- source_word: הַגִּלְעָד
  choice: Галаад
  rationale: Передано традиционным русским названием региона; еврейский определённый артикль при топониме отдельно не воспроизводится.
