  text: וּ/בְ/הַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְ/הָ֣יָה קֹ֑דֶשׁ וְ/יָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁי/הֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/017.yaml
  text: But on Mount Zion there will be deliverance[a], and it will be holy[c][b], and the house of Jacob will possess their possessions.
translation:
  language: ru
  text: Но на горе Сион будет избавление[a], и она будет свята, и дом Иакова овладеет своими владениями[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «там будут уцелевшие»; еврейское существительное может обозначать как избавление или спасение, так и тех, кто спасся.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «получит в наследие своё наследие».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «дом Иакова лишит владений тех, кто лишил его владений», если последнее слово понимать как обозначение действующих лиц.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְהַר צִיּוֹן
  choice: Но на горе Сион
  rationale: Союз ו в контексте противопоставляет спасение на Сионе суду над Эдомом в предыдущем стихе; «но» естественно передаёт этот смысловой поворот.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: будет избавление
  rationale: פְלֵיטָה может обозначать избавление, спасение, бегство либо спасшихся. «Избавление» сохраняет широту образа и не сводит его только к группе уцелевших; возможное конкретное значение отмечено в сноске.
- source_word: וְהָיָה קֹדֶשׁ
  choice: и она будет святыней
  rationale: Мужская форма еврейского глагола естественно соотносится с הַר («гора»), тогда как в русском требуется женское согласование с «горой». «Святыней» передаёт предикативное существительное קֹדֶשׁ и освящённый статус Сиона.
- source_word: וְיָרְשׁוּ
  choice: овладеет
  rationale: ירשׁ может значить «владеть», «получить в наследие» или «лишить владения». Здесь форма единственного числа русского сказуемого согласована с собирательным выражением «дом Иакова» и передаёт возвращение принадлежащего ему.
- source_word: בֵּית יַעֲקֹב
  choice: дом Иакова
  rationale: Традиционное и понятное обозначение потомков Иакова, сохраняющее пророческий регистр.
- source_word: אֵת מוֹרָשֵׁיהֶם
  choice: своими владениями
  rationale: מוֹרָשָׁה обычно означает владение или наследственное достояние. Возвратное «своими» ясно относит суффикс к дому Иакова; иное, агентивное понимание отражено в сноске.
theological_decisions:
- issue: Характер обещанного восстановления Сиона
  choice: Стих говорит об избавлении и восстановлении, сосредоточенных на горе Сион, не ограничивая обещание только спасшимися людьми или только священным статусом места.
  alternative: Главный акцент может быть либо на уцелевшем остатке, либо на Сионе как освящённом убежище.
  rationale: Сочетание פְלֵיטָה и קֹדֶשׁ допускает взаимосвязанные смыслы избавления, уцелевших и святости; перевод не устраняет эту богословскую многозначность.
- issue: Смысл возвращения достояния дому Иакова
  choice: Дом Иакова вновь овладевает принадлежащими ему владениями.
  alternative: Дом Иакова лишает владения тех, кто прежде лишил владения его.
  rationale: Номинальное понимание מוֹרָשֵׁיהֶם морфологически и контекстуально наиболее естественно, но агентивное прочтение возможно и сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сохранён близким к еврейскому параллелизму, но согласование и выбор лексики сделаны естественными для русского читателя. Все альтернативы, существенно влияющие на смысл, вынесены в сноски.
