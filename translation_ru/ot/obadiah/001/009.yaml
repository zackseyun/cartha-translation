base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
translation:
  language: ru
  text: Твои воины, Феман,[b] будут сокрушены[a], чтобы каждый мужчина с горы Исава был истреблён в резне.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придут в смятение», «будут объяты ужасом». Еврейский глагол может подчёркивать как панику, так и сокрушительный крах.'
    reason: lexical_alternative
  - marker: b
    text: Феман — область или город в Эдоме; это название связано со словом «юг».
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «так что каждый мужчина с горы Исава будет истреблён резнёй». Заключительные слова допускают несколько близких синтаксических толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחַתּוּ
  choice: и будут сокрушены
  rationale: Форма от חתת описывает крушение, которое может включать страх и смятение. «Будут сокрушены» естественно передаёт военный крах, а сноска сохраняет эмоциональные оттенки глагола.
- source_word: גִבּוֹרֶיךָ
  choice: твои воины
  rationale: גִּבּוֹר обозначает сильного человека и в данном военном контексте — доблестного бойца; современное «воины» яснее, чем буквальное «сильные мужи».
- source_word: תֵּימָן
  choice: Феман
  rationale: Здесь это собственное имя эдомской области или города, употреблённое как обращение, а не нарицательное «юг».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз сохраняет целевую или целево-результативную связь с последующим имперфектом, не сводя её только к простому предсказанию.
- source_word: יִכָּרֶת
  choice: был истреблён
  rationale: Нифаль глагола כרת означает «быть отсечённым, устранённым, истреблённым». В контексте резни «истреблён» звучит естественно и сохраняет силу образа.
- source_word: אִישׁ
  choice: каждый мужчина
  rationale: Единственное число имеет распределительное значение; «каждый мужчина» сохраняет грамматический род и вероятный акцент на полном уничтожении мужчин Эдома.
- source_word: מֵהַר עֵשָׂו
  choice: с горы Исава
  rationale: Передаёт единственное число הַר и территориальное обозначение Эдома без превращения сочетания в не засвидетельствованное здесь слитное географическое имя.
- source_word: מִקָּטֶל
  choice: в резне
  rationale: Предлог מִן допускает значение средства, причины или сопутствующего обстоятельства. «В резне» естественно передаёт гибель при массовом убийстве, а сноска отмечает синтаксическую неоднозначность.
theological_decisions:
- issue: Целевая или результативная сила לְמַעַן с имперфектом
  choice: чтобы каждый мужчина ... был истреблён
  alternative: так что каждый мужчина ... будет истреблён
  rationale: Конструкция допускает целевой и целево-результативный оттенок. «Чтобы» ближе к явной синтаксической зависимости и не превращает её без необходимости в чисто результативное утверждение.
- issue: Распределительное אִישׁ в пророчестве о суде
  choice: каждый мужчина
  alternative: каждый человек
  rationale: Мужской род исходного существительного может быть риторически значим в контексте разгрома воинов Эдома; перевод не нейтрализует его.
- issue: Статус תֵּימָן
  choice: Феман
  alternative: юг
  rationale: В контексте пророчества об Эдоме слово обозначает известную эдомскую местность и одновременно адресата обращения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся близким к еврейскому, но не выглядит архаичным; сохранены обращение к Феману, мужской род אִישׁ и неоднозначность целево-результативной конструкции.
