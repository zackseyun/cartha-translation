source:
  edition: WLC
  text: וְ/גָלֻ֣ת הַֽ/חֵל הַ֠/זֶּה לִ/בְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְ/גָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/סְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/020.yaml
  text: And the exiles of this host of the sons of Israel, who are among the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad, will possess the cities of the Negev.
translation:
  language: ru
  text: А изгнанники этого множества сынов Израиля, находящиеся среди хананеев вплоть до Сарепты, и изгнанники Иерусалима, находящиеся в Сефараде, овладеют городами Негева.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָלֻת
  choice: изгнанники
  rationale: Собирательное существительное обозначает общину уведённых в изгнание; личное обозначение естественно согласуется с глаголом «овладеют».
- source_word: הַחֵל הַזֶּה
  choice: это войско
  rationale: חֵל здесь, вероятно, вариант написания חַיִל со значением «войско, рать»; перевод сохраняет указательное «это» и не конкретизирует сверх источника.
- source_word: כְּנַעֲנִים
  choice: среди хананеев
  rationale: Форма трудна и допускает понимание как этнонима; по синтаксису передано местонахождение изгнанников, без попытки исправить источник.
- source_word: צָרְפַת
  choice: Сарепта
  rationale: Устоявшееся русское библейское название финикийского города Zarephath.
- source_word: סְפָרַד
  choice: Сефарад
  rationale: Топоним транслитерирован, поскольку его историческая локализация остаётся спорной.
- source_word: יִרְשׁוּ
  choice: овладеют
  rationale: Глагол ירשׁ выражает вступление во владение; «овладеют» уместно в контексте территориального восстановления.
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: Передано как собственное географическое название южной области, а не обобщённо как «юг».
theological_decisions:
- issue: Кто именно овладеет городами Негева
  choice: Сохранены обе группы изгнанников как составное подлежащее
  alternative: Связать города Негева только с ближайшей группой изгнанников Иерусалима
  rationale: Множественное יִרְשׁוּ после двух сочинённых групп естественно относится к обеим; при этом перевод не добавляет богословской идентификации этих групп.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксическая протяжённость еврейского стиха сохранена, но причастные обороты оформлены естественно для русского языка. Неясные топонимы и трудная фраза о хананеях не истолкованы сверх текста.
