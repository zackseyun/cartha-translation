revisions:
- from: А изгнанники из этого войска сынов Израиля, находящиеся среди хананеев вплоть до Сарепты, и изгнанники Иерусалима, находящиеся в Сефараде, овладеют городами Негева.
  to: А изгнанники этого множества сынов Израиля, находящиеся среди хананеев вплоть до Сарепты, и изгнанники Иерусалима, находящиеся в Сефараде, овладеют городами Негева.
  rationale: Исправлена только русская синтаксико-семантическая двусмысленность, из-за которой изгнанники могли быть поняты как изгнанные из войска. «Множество» — нейтральная передача трудного חֵל и не утверждает конкретного военного значения. Прочие спорные элементы сохранены без дополнительной интерпретации.
