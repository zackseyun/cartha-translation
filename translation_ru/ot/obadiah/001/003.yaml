  text: זְד֤וֹן לִבְּ/ךָ֙ הִשִּׁיאֶ֔/ךָ שֹׁכְנִ֥י בְ/חַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑/וֹ אֹמֵ֣ר בְּ/לִבּ֔/וֹ מִ֥י יוֹרִדֵ֖/נִי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/003.yaml
  text: The pride of your heart has deceived you[a], you who dwell in the clefts of the rock, whose dwelling is on high, who say in your heart[c][b], “Who will bring me down to the ground?”
translation:
  language: ru
  text: 'Гордыня твоего сердца обманула тебя[a], живущего в расселинах скалы[b], чьё жилище находится высоко, говорящего в своём сердце: «Кто низведёт меня на землю[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надменность»; также возможно: «самонадеянность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в расщелинах скалы». Эти слова вызывают образ укреплённых и труднодоступных жилищ среди скал.'
    reason: cultural_note
  - marker: c
    text: Еврейское слово может означать землю, почву или страну; здесь оно противопоставлено жилищу на высоте.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְדוֹן
  choice: гордыня
  rationale: Слово обозначает надменную, самонадеянную гордость. «Гордыня» естественно передаёт нравственное обвинение пророка и внутреннее самообольщение Эдома.
- source_word: לִבְּךָ
  choice: твоего сердца
  rationale: Сохранён древнееврейский образ сердца как средоточия внутреннего человека, его мыслей и воли.
- source_word: הִשִּׁיאֶךָ
  choice: обманула тебя
  rationale: Порода хифиль здесь выражает введение в заблуждение; «обманула тебя» ясно и естественно передаёт результат действия.
- source_word: שֹׁכְנִי
  choice: тебя, живущего
  rationale: Причастие понято как приложение к адресату. Повторение «тебя» делает синтаксическую связь прозрачной по-русски и сохраняет прямое обращение.
- source_word: בְחַגְוֵי סֶּלַע
  choice: в расселинах скалы
  rationale: חגוי обозначает расщелины, углубления или укрытия в скале; перевод сохраняет образ естественно защищённых скальных жилищ.
- source_word: מְרוֹם שִׁבְתּוֹ
  choice: чьё жилище — на высоте
  rationale: Передан высокий и кажущийся недоступным характер места обитания. Относительная конструкция естественна в русском контексте.
- source_word: אֹמֵר בְּלִבּוֹ
  choice: говорящего в своём сердце
  rationale: Сохранена древнееврейская идиома внутренней речи. Причастная форма продолжает характеристику адресата.
- source_word: מִי יוֹרִדֵנִי
  choice: Кто низведёт меня
  rationale: «Низведёт» точно передаёт каузативное значение ירד и подчёркивает вертикальный контраст с жилищем на высоте, оставаясь понятным в литературном русском.
- source_word: אָרֶץ
  choice: на землю
  rationale: В контексте слово противопоставлено высоте и означает землю внизу; русский перевод сохраняет как пространственный образ, так и более широкую лексическую возможность.
theological_decisions:
- issue: Переход от обращения во втором лице к формам третьего лица в описательных частях стиха
  choice: 'Описательные обороты согласованы с прямым обращением к Эдому: «тебя, живущего… чьё жилище… говорящего в своём сердце»'
  alternative: 'Буквально сохранить третье лицо: «живущий… его жилище… говорящий в своём сердце»'
  rationale: Начало стиха прямо обращено к Эдому во втором лице. Формы третьего лица естественно понимать как описательное приложение к собирательному адресату; согласование обращения сохраняет пророческую непосредственность, не изменяя смысла.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Сохранены образ сердца, скального убежища и резкий контраст между высотой и землёй; синтаксис слегка выровнен ради ясности, но переходы исходного текста не используются для внесения богословских уточнений.
