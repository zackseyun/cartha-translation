base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/014.yaml
  text: Do not stand at the crossroads to cut off his fugitives[c][b][a], and do not hand over his survivors in the day of distress.
translation:
  language: ru
  text: Не стой на перепутье[a], чтобы истреблять[b] его беглецов, и не выдавай[c] его уцелевших в день бедствия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на развилке дорог» или «у горного прохода». Еврейское слово обозначает место, где можно было перехватить беглецов.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «чтобы отсечь его беглецов» или «чтобы уничтожить его беглецов».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не запирай»; здесь — «не отдавай во власть врага». Возможно также: «не предавай».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲמֹד
  choice: стой
  rationale: Сохраняет конкретный образ того, кто занял место на пути бегущих, чтобы их перехватить.
- source_word: הַפֶּרֶק
  choice: перепутье
  rationale: Передаёт место разветвления или пересечения путей, где можно было перехватить беглецов; слово естественно для возвышенного, но понятного русского текста.
- source_word: לְהַכְרִית
  choice: чтобы истреблять
  rationale: В данном контексте כרת означает устранение или уничтожение людей. «Истреблять» ясно передаёт смертоносный смысл, тогда как буквальное «отсекать» по-русски могло бы быть понято лишь как преграждение пути.
- source_word: פְּלִיטָיו
  choice: его беглецов
  rationale: Обозначает людей, которые спаслись бегством; «беглецы» кратко и естественно передаёт ситуацию преследуемых людей.
- source_word: תַּסְגֵּר
  choice: не выдавай
  rationale: Буквальное значение глагола связано с закрыванием, но здесь он означает передачу людей во власть врага. «Выдавай» точно и естественно выражает этот смысл.
- source_word: שְׂרִידָיו
  choice: его уцелевших
  rationale: Передаёт тех, кто остался жив после бедствия, не привнося без необходимости специальный богословский оттенок слова «остаток».
- source_word: בְּיוֹם צָרָה
  choice: в день бедствия
  rationale: Сохраняет временную формулу и тяжесть значения צָרָה; выражение понятно и соответствует пророческому регистру.
theological_decisions:
- issue: Возможный богословский оттенок שְׂרִידָיו
  choice: его уцелевших
  alternative: его остаток
  rationale: «Остаток» лексически возможен и способен вызывать тему сохранённого Богом остатка, однако непосредственный контекст говорит о людях, переживших нападение. Выбранный вариант не навязывает тексту специального богословского смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого увещевания. Параллелизм двух запретов сохранён; лексика понятна обычному читателю без упрощения сурового смысла стиха.
