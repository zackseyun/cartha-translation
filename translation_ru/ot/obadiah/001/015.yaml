  text: כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַ/גּוֹיִ֑ם כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔/ךְ גְּמֻלְ/ךָ֖ יָשׁ֥וּב בְּ/רֹאשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/015.yaml
  text: For the day of Yahweh is near upon all the nations[a]. As you have done, it will be done to you[b]; your recompense will return on your own head.
translation:
  language: ru
  text: Ибо день Яхве близок и придёт на все народы[a]. Как ты поступал, так поступят с тобой; твоё воздаяние[b] вернётся на твою же голову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против всех народов». Предлог может обозначать суд, направленный против народов.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный смысл: «отплата тебе» или «то, как ты обходился с другими». Еврейское слово обозначает то, что возвращается человеку в ответ на его поступки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего предостережения; «ибо» сохраняет причинно-пояснительную связь и соответствует достоинству пророческой речи.
- source_word: קָרוֹב
  choice: близок
  rationale: Предикативное прилагательное выражает близость и неотвратимость дня суда без добавления отсутствующего в тексте глагола движения.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Сохранено устойчивое пророческое выражение, а тетраграмматон передан личным именем «Яхве», а не замещён титулом.
- source_word: עַל כָּל הַגּוֹיִם
  choice: над всеми народами
  rationale: Предлог עַל может указывать на направленность грядущего суда на народы. «Над» сохраняет пространственно-направительный образ и допускает судебный оттенок, не сводя значение исключительно к враждебному «против».
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: Как ты поступал
  rationale: Передаёт сравнительную формулу возмездия. Русское «поступал» естественно описывает совершённые действия Едома и сохраняет обращение во втором лице единственного числа.
- source_word: יֵעָשֶׂה לָּךְ
  choice: так поступят и с тобой
  rationale: Естественная русская передача страдательной формы с сохранением симметрии между поступками Едома и ответным воздаянием; деятель намеренно не назван, как и в еврейском тексте.
- source_word: גְּמֻלְךָ
  choice: твоё воздаяние
  rationale: Слово обозначает то, что возвращается человеку в ответ на его дела; «воздаяние» сохраняет нравственно-судебный оттенок контекста.
- source_word: יָשׁוּב
  choice: вернётся
  rationale: Прямо передаёт образ возвращения последствий совершённых поступков.
- source_word: בְּרֹאשֶׁךָ
  choice: на твою же голову
  rationale: Русский идиом естественно выражает падение последствий на самого виновника; частица «же» подчёркивает возвратность без избыточного пояснения.
theological_decisions:
- issue: Охват и направленность «дня Яхве»
  choice: Грядущий суд относится ко всем народам, при сохранении непосредственного обращения к Едому.
  alternative: Понимать высказывание как относящееся только к Едому.
  rationale: Фраза «над всеми народами» явно расширяет горизонт пророчества, тогда как формы второго лица во второй половине стиха продолжают прямое обращение к Едому. Перевод сохраняет оба уровня.
- issue: Характер воздаяния
  choice: Сохранена формула ответного, судебного воздаяния в контексте дня Яхве.
  alternative: Понять возвращение последствий как безличный закон или судьбу.
  rationale: Упоминание дня Яхве задаёт контекст Божьего суда, однако страдательная конструкция не называет деятеля прямо; перевод не добавляет его и тем самым сохраняет форму и богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксический параллелизм и прямое обращение к Едому сохранены; архаизмы и конфессионально специфическая терминология не используются.
