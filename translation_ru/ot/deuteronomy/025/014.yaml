  language: ru
  text: 'У тебя в доме не должно быть двух еф: одной большой, другой малой.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ефа — древнееврейская мера объёма для сыпучих продуктов.
