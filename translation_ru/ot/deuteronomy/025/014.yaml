lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Пусть не будет у тебя
  rationale: Отрицательная форма глагола היה с дательным оборотом буквально означает «да не будет у тебя» и выражает запрет на обладание; выбранная формулировка сохраняет юридическую силу и естественно звучит по-русски.
- source_word: בְּבֵיתְךָ
  choice: в доме
  rationale: בַּיִת здесь обозначает дом как место хранения мер, а не семью или домочадцев.
- source_word: אֵיפָה וְאֵיפָה
  choice: двух разных еф
  rationale: Повтор существительного обозначает две неодинаковые меры одного номинала и перекликается с выражением о двух разных гирях в предыдущем стихе. Название древнееврейской меры сохранено, а слово «разных» делает смысл повтора ясным в современном русском.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: большой и малой
  rationale: Прилагательные согласованы с существительным «ефа» и кратко передают противопоставление двух мер различной вместимости.
