revisions:
- from: Если братья живут вместе и один из них умрёт, не имея сына[a], то жена умершего не должна выходить замуж за постороннего, вне семьи[b]. Брат её мужа пусть войдёт к ней[c], возьмёт её себе в жёны и исполнит по отношению к ней долг брата мужа[d].
