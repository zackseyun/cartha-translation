base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: ru
  text: Если братья живут вместе и один из них умрёт, не имея сына[a], то жена умершего не должна выходить замуж вне семьи — за постороннего мужчину[b]. Брат её мужа пусть войдёт к ней[c], возьмёт её себе в жёны и исполнит по отношению к ней свой долг как брат её мужа[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и сына нет у него». В еврейском тексте сказано именно «сын», хотя это условие иногда понимают шире — как отсутствие ребёнка.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не будет вовне за посторонним мужчиной»; речь идёт о браке вне семьи, на которую возложена эта обязанность.'
    reason: lexical_alternative
  - marker: c
    text: «Войти к ней» — еврейский эвфемизм, обозначающий супружескую близость.
    reason: lexical_alternative
  - marker: d
    text: Имеется в виду обязанность брата умершего вступить в брак с его вдовой; позднее такой брак стали называть левиратным.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: братья живут вместе
  rationale: אַחִים — обычное обозначение братьев мужского пола, а יַחְדָּו указывает на совместное проживание, не уточняя его устройство.
- source_word: וּבֵן אֵין לוֹ
  choice: не имея сына
  rationale: В еврейском тексте прямо сказано «сын»; более общее «ребёнок» было бы истолковательным расширением.
- source_word: אֵשֶׁת הַמֵּת
  choice: жена умершего
  rationale: Передаёт еврейскую конструкцию буквально и естественно; слово «вдова» верно по смыслу, но не соответствует форме оригинала.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: выходить замуж за постороннего, вне семьи
  rationale: «Посторонний» здесь означает мужчину вне родственной обязанности, а не обязательно иноплеменника; «вне семьи» ясно передаёт направительное הַחוּצָה в данном правовом контексте.
- source_word: יְבָמָהּ
  choice: брат её мужа
  rationale: Специальное существительное обозначает брата умершего мужа; такая передача точнее неоднозначного русского «деверь» для широкого читателя.
- source_word: יָבֹא עָלֶיהָ
  choice: войдёт к ней
  rationale: Сохранён традиционный еврейский эвфемизм супружеского соединения; его смысл пояснён в сноске.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: возьмёт её себе в жёны
  rationale: 'Естественно передаёт все существенные элементы выражения: «возьмёт её себе как жену».'
- source_word: וְיִבְּמָהּ
  choice: исполнит по отношению к ней долг брата мужа
  rationale: Специализированный глагол обозначает исполнение обязанности левиратного брака; описательная передача сохраняет юридический смысл без технического термина в основном тексте.
theological_decisions:
- issue: Объём условия וּבֵן אֵין לוֹ
  choice: Сохранить конкретное «не имея сына» в основном тексте.
  alternative: 'Передать шире: «не имея ребёнка».'
  rationale: Оригинал употребляет בֵּן, «сын». Перевод не должен самостоятельно разрешать вопрос о более широком юридическом применении нормы.
- issue: Передача института левиратного брака
  choice: Использовать в основном тексте понятные родственные и правовые выражения.
  alternative: Употребить технические термины «левир» и «левиратный брак».
  rationale: Описательная передача понятна современному читателю и сохраняет правовой характер предписания; специальный термин уместен в пояснении.
- issue: Смысл לְאִישׁ זָר
  choice: Передать как «за постороннего», то есть мужчину вне данной семейной обязанности.
  alternative: «За чужеземца» или «за неродственного мужчину».
  rationale: זָר здесь противопоставлен брату умершего в рамках семейно-правовой нормы и не обязательно обозначает человека иной народности.
translation_notes:
  register: Современный литературный русский язык с достоинством правового предписания. Синтаксис ясный и естественный; специализированная левиратная терминология раскрыта описательно. Эвфемизм оригинала сохранён, а его значение пояснено в сноске.
