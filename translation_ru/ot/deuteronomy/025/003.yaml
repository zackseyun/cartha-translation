base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: ru
  text: Ему можно нанести до сорока ударов[a], но не больше, чтобы, нанеся сверх этого ещё много ударов, не подвергли его чрезмерному избиению и не унизили твоего брата у тебя на глазах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сорок [раз] ударит его». Еврейский текст указывает число ударов, но не называет ни орудия, ни точного способа их нанесения.'
    reason: lexical_alternative
  - marker: b
    text: «Твой брат» — член той же общины завета. Даже подвергаясь наказанию, он не должен быть превращён в презренного человека.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Сорок ударов можно нанести ему
  rationale: Числительное задаёт предельное число ударов; безличная модальная конструкция естественно передаёт юридически дозволенное действие, не уточняя не названное в еврейском тексте орудие наказания.
- source_word: לֹא יֹסִיף
  choice: но не больше
  rationale: Кратко и ясно передаёт запрет прибавлять удары сверх установленного предела.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ עַל אֵלֶּה
  choice: чтобы наказание не продолжили сверх этого
  rationale: Передаёт предостережение פן и конструкцию יסף с инфинитивом как продолжение избиения за пределами установленного числа.
- source_word: מַכָּה רַבָּה
  choice: нанеся ему множество ударов
  rationale: Еврейское выражение буквально допускает понимание «сильное/чрезмерное избиение»; в контексте счёта ударов коллективное значение естественно передаётся как множество ударов.
- source_word: וְנִקְלָה
  choice: не был унижен
  rationale: Nifal от קלל/קלה здесь обозначает утрату достоинства, превращение человека в презренного в глазах других; «унижен» звучит естественно и не сводит смысл лишь к внутреннему чувству стыда.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: 'Сохраняет буквальный родственный образ и его этическую силу: наказанный остаётся членом общины завета.'
- source_word: לְעֵינֶיךָ
  choice: у тебя на глазах
  rationale: Современное русское идиоматическое выражение, сохраняющее образ открытого унижения перед глазами адресата.
theological_decisions:
- issue: Заветное обозначение наказанного как брата
  choice: твой брат
  alternative: твой соплеменник / другой израильтянин
  rationale: Буквальное «брат» подчёркивает, что признанный виновным не лишается человеческого достоинства и принадлежности к общине; более пояснительные варианты ослабили бы родственный образ.
- issue: Характер предела в сорок ударов
  choice: максимально допустимое число, а не обязательное назначение сорока ударов
  alternative: ему следует нанести ровно сорок ударов
  rationale: Контекст непосредственно ограничивает наказание словами «не больше»; модальная передача не превращает верхний предел в обязательную норму для каждого дела.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис сделан ясным для обычного читателя; сохранены предел наказания, предостерегающая логика и родственный термин «брат».
