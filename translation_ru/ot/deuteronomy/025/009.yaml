  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: ru
  text: 'Тогда вдова его брата подойдёт к нему в присутствии старейшин, снимет с его ноги сандалию, плюнет ему в лицо[a] и скажет: «Так поступают с человеком, который не станет созидать дом своего брата»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плюнет перед ним». Еврейское выражение допускает понимание, согласно которому она плюёт перед мужчиной, а не прямо ему в лицо.'
    reason: lexical_alternative
  - marker: b
    text: «Созидать дом своего брата» означает посредством левиратного брака продолжить род и сохранить семейный дом умершего брата.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: вдова его брата
  rationale: В контексте закона о левиратном браке речь идёт именно о вдове умершего брата, а не о любой родственнице, которую можно назвать невесткой.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: на глазах у старейшин
  rationale: Передаёт буквальный образ и подчёркивает публичный характер действия, совершаемого при свидетелях.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: снимет с его ноги сандалию
  rationale: Сохраняет конкретное ритуальное действие и единственное число существительного נַעַל.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: плюнет ему в лицо
  rationale: Это наиболее прямое понимание еврейского выражения; возможное значение «перед ним» отмечено в сноске, чтобы не устранять подлинную лексическую неоднозначность.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: и скажет в ответ
  rationale: Естественно по-русски передаёт оба глагола устойчивой еврейской формулы, не создавая впечатления, будто далее обязательно следует ответ на прямо заданный вопрос.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Так поступают
  rationale: Естественная русская формула, сохраняющая обобщённо-нормативный смысл страдательной еврейской конструкции.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: не хочет созидать дом своего брата
  rationale: Сохраняет метафору «созидания дома», а волевое «не хочет» соответствует контексту отказа исполнить обязанность; значение метафоры разъясняется в сноске.
theological_decisions:
- issue: Следует ли смягчать выражение בְּפָנָיו
  choice: плюнет ему в лицо
  alternative: плюнет перед ним
  rationale: Основной текст следует наиболее прямому значению еврейского выражения, а реально возможное альтернативное прочтение сохраняется в сноске; решение является лексико-контекстуальным, а не конфессиональным.
- issue: Следует ли раскрывать метафору «созидать дом» непосредственно в тексте
  choice: сохранить метафору и пояснить её в сноске
  alternative: перевести как «продолжить род своего брата»
  rationale: Сохранение метафоры ближе к форме и богословско-социальной образности исходного текста, тогда как сноска обеспечивает понятность современному читателю без сужения значения только до биологического продолжения рода.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного повествования. Синтаксис сделан естественным для русского читателя, но конкретные детали обряда и метафора «созидать дом» сохранены.
