    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: то отсеки
  rationale: Форма от קצץ выражает прямое предписание отсечь. «Отсеки» естественно и точно передаёт конкретность и суровость правовой нормы; союз в контексте следствия передан словом «то».
- source_word: אֶת
  choice: '[показатель прямого дополнения, не переводится]'
  rationale: У еврейского показателя определённого прямого дополнения нет отдельного соответствия в русском языке.
- source_word: כַּפָּהּ
  choice: ей кисть
  rationale: כַּף может означать ладонь или кисть руки. При глаголе «отсечь» русское «кисть» сохраняет анатомическую конкретность, не расширяя значение до всей руки; местоименное значение суффикса естественно передано дательным «ей».
- source_word: לֹא
  choice: не
  rationale: Обычное отрицание.
- source_word: תָחוֹס
  choice: не жалеет
  rationale: חוס означает жалеть, щадить, проявлять сострадание. В сочетании с «глазом» формула «пусть твой глаз не жалеет» сохраняет образность еврейского правового оборота.
- source_word: עֵינֶךָ
  choice: твой глаз
  rationale: Буквальный образ «твой глаз» сохранён, а не сглажен до «ты», поскольку это характерная и значимая формула Второзакония.
theological_decisions:
- issue: Буквальность формулы наказания
  choice: Сохранить конкретное предписание «отсеки ей кисть» и образное выражение «пусть твой глаз не жалеет её».
  alternative: 'Передать динамически: «отсеки ей руку и не щади её».'
  rationale: Прямота гражданско-правового предписания и напряжённая суровость текста не смягчаются. Одновременно «кисть» точнее отражает диапазон כַּף, чем более широкое русское «рука».
translation_notes:
  register: Современный литературный русский язык; краткая, строгая формулировка соответствует правовому контексту. Повелительная конструкция с «пусть» естественно передаёт еврейский запрет в форме 3-го лица и сохраняет идиому «твой глаз».
