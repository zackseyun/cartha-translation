lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: Не надевай намордника
  rationale: Отрицание с формой несовершенного вида выражает запрет. Глагол חסם означает закрывать животному рот, надевать намордник; такая формулировка естественна и точна по-русски.
- source_word: שׁוֹר
  choice: вола
  rationale: שׁוֹר обозначает крупный рогатый скот, а в данном сельскохозяйственном контексте — рабочего вола.
- source_word: בְּדִישׁוֹ
  choice: когда он молотит
  rationale: Сочетание предлога בְּ с формой от דישׁ и суффиксом 3-го лица буквально означает «при его молотьбе». В русском условие запрета естественно передаётся придаточным времени; местоимение относится к волу.
