source:
  edition: WLC
  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: ru
  text: У тебя должна быть полновесная и верная гиря[a]; у тебя должна быть полная и верная ефа[b], чтобы дни твои были долгими на земле, которую Яхве, твой Бог, даёт тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «камень»; то есть каменная гиря, использовавшаяся в торговле.'
    reason: Сохраняет конкретный смысл еврейского слова אֶבֶן, тогда как основной текст передаёт его функцию.
  - marker: b
    text: Ефа — древняя мера объёма для сыпучих продуктов.
    reason: Поясняет незнакомое современному читателю название древней единицы измерения.
lexical_decisions:
- source_word: אֶבֶן
  choice: гиря
  rationale: Буквально «камень»; в контексте торговли имеется в виду каменная гиря, служившая мерой веса. «Гиря» ясно передаёт функцию предмета, а конкретный образ отмечен в сноске.
- source_word: שְׁלֵמָה וָצֶדֶק
  choice: полновесная и верная / полная и верная
  rationale: שְׁלֵמָה обозначает полноту, отсутствие недостачи, а צֶדֶק — соответствие справедливой норме. Для гири естественно «полновесная», для меры объёма — «полная»; «верная» сохраняет как практическую точность, так и нравственный оттенок честности.
- source_word: יִהְיֶה לָּךְ
  choice: пусть у тебя будут
  rationale: Буквально «да будет у тебя»; эта формулировка естественно передаёт предписывающую силу еврейской конструкции и согласована с двумя однородными предметами в русском предложении.
- source_word: אֵיפָה
  choice: ефа
  rationale: Название конкретной древней меры объёма для сыпучих продуктов; транслитерация сохраняет историческую единицу, которая кратко поясняется в сноске.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевую и результативную связь между соблюдением предписания и обещанным долголетием.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: чтобы продлились твои дни
  rationale: Сохраняет еврейский образ буквального «удлинения дней», не сводя его просто к пересказу «чтобы ты долго жил».
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: В контексте Второзакония אֲדָמָה указывает на землю, даруемую Израилю; предлог «на» близко и естественно передаёт עַל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Настоящее время естественно передаёт причастную форму и изображает дарование земли как совершающееся и определённое действие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Связь послушания с долголетием
  choice: «чтобы продлились твои дни» без дополнительного объяснения характера этой связи
  alternative: Явно истолковать долголетие как награду или безусловную гарантию
  rationale: לְמַעַן допускает целевой и результативный оттенки. Перевод сохраняет сформулированную в тексте заветную связь, не превращая её в более узкое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формула «пусть у тебя будут» звучит как ясное предписание; параллелизм двух требований и образ «продлились твои дни» сохранены. Формы единственного числа передают обращение еврейского текста к отдельному члену заветного народа.
