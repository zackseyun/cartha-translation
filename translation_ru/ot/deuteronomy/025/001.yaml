base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: ru
  text: 'Если между мужчинами возникнет спор и они придут на суд[a], судьи рассудят их: оправдают правого, а виновного осудят[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к суду» или «к судебному решению»; речь идёт о судебном разбирательстве.'
    reason: lexical_alternative
  - marker: b
    text: '«Оправдают» и «осудят» здесь — судебные термины: правого признают правым, а виновного — виновным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה רִיב
  choice: Если … возникнет спор
  rationale: כִּי вводит условие казуистического закона, а сочетание היה с ריב естественно передаётся как возникновение спора.
- source_word: בֵּין אֲנָשִׁים
  choice: между мужчинами
  rationale: Существительное אֲנָשִׁים имеет форму мужского рода и здесь обозначает участников судебного спора; перевод сохраняет эту конкретность.
- source_word: וְנִגְּשׁוּ אֶל הַמִּשְׁפָּט
  choice: и они придут на суд
  rationale: Фраза означает, что спорящие предстают для судебного разбирательства; «придут на суд» понятно и близко к образу исходного текста.
- source_word: וּשְׁפָטוּם
  choice: судьи пусть рассудят их
  rationale: 'Буквально: «и они будут судить их». Подлежащее определяется судебным контекстом; «рассудят» передаёт вынесение решения между сторонами, а «пусть» — нормативную силу предписания.'
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: правого оправдают
  rationale: В судебном контексте hiphil от צדק означает признать сторону правой, то есть оправдать, а הַצַּדִּיק — того, кто прав в данном деле.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: виновного осудят
  rationale: Hiphil от רשע означает вынести обвинительный приговор, а הָרָשָׁע в данном контексте — виновную сторону. Формулировка сохраняет параллель с «правого оправдают».
theological_decisions:
- issue: Судебный или нравственный смысл צדק и רשע
  choice: 'Судебное признание: «правого оправдают, а виновного осудят»'
  alternative: 'Нравственная характеристика: «праведника» и «нечестивого»'
  rationale: Контекст прямо описывает судебное разбирательство, поэтому слова обозначают стороны, правую и виновную в конкретном деле. Это не исключает нравственного оттенка, но не превращает судебный вердикт в утверждение об общем духовном состоянии человека.
translation_notes:
  register: Современный литературный русский язык с ясной юридической лексикой. Сохранены условная форма закона, мужской род участников и смысловой контраст между правой и виновной сторонами; избегнуты архаизмы «оправдают праведного» и «обвинят нечестивого».
