base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/002.yaml
  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: ru
  text: то, если виновный подлежит побоям, судья велит уложить его и подвергнуть побоям в своём присутствии, соразмерно его вине, в установленном числе ударов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по счёту», то есть с отсчитанным числом ударов, соразмерным проступку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: заслуживает побоев
  rationale: Еврейская идиома буквально означает «сын побоев» и в данном правовом контексте указывает на человека, подлежащего телесному наказанию; выбран естественный и точный русский эквивалент.
- source_word: הָרָשָׁע
  choice: виновный
  rationale: В судебном контексте субстантивированное прилагательное обозначает признанную виновной сторону. «Виновный» сохраняет правовой смысл, не исключая нравственной окраски исходного слова.
- source_word: וְהִפִּילוֹ
  choice: велит положить его
  rationale: Каузативная форма глагола נפל означает, что судья распоряжается положить осуждённого для наказания; формулировка естественна для русского юридического повествования.
- source_word: הַשֹּׁפֵט
  choice: судья
  rationale: Прямой и общепринятый эквивалент названия судебного должностного лица.
- source_word: וְהִכָּהוּ
  choice: бить
  rationale: Глагол обозначает нанесение ударов. В сочетании с «велит» русский синтаксис ясно передаёт, что наказание производится по распоряжению судьи, не утверждая, что он наносит удары лично.
- source_word: לְפָנָיו
  choice: перед собой
  rationale: Буквально передаёт совершение наказания перед судьёй, то есть в его присутствии и под его надзором.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: соразмерно его вине
  rationale: Оборот выражает соответствие меры наказания тяжести виновности или проступка. «Соразмерно его вине» естественно передаёт правовой смысл и заложенную пропорциональность.
- source_word: בְּמִסְפָּר
  choice: счётом
  rationale: Краткая еврейская формула указывает на установленное, отсчитываемое число ударов. Необычная краткость основного текста сохранена, а значение пояснено в сноске.
theological_decisions:
- issue: Нравственное или судебное значение הָרָשָׁע
  choice: виновный
  alternative: нечестивый; виновный человек
  rationale: 'Контекст непосредственно судебный: речь идёт о стороне, признанной виновной и подлежащей наказанию. Выбор не отрицает нравственного оттенка слова, но не превращает юридическое постановление в характеристику всей личности.'
- issue: Кто непосредственно наносит удары
  choice: судья велит ... бить
  alternative: судья ... побьёт его
  rationale: Еврейская форма грамматически может представить судью субъектом действия, однако процедура допускает исполнение наказания по его приказу и перед ним. Русская формулировка сохраняет судебную ответственность и надзор, не настаивая на личном нанесении ударов судьёй.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Сохранена связь с предыдущим стихом начальным «то». Слово «побои» передаёт телесное наказание без архаического оборота, а краткое «счётом» сохраняет сжатость оригинала и получает пояснение в сноске.
