  text: וְ/אִם לֹ֤א יַחְפֹּץ֙ הָ/אִ֔ישׁ לָ/קַ֖חַת אֶת יְבִמְתּ֑/וֹ וְ/עָלְתָה֩ יְבִמְתּ֨/וֹ הַ/שַּׁ֜עְרָ/ה אֶל הַ/זְּקֵנִ֗ים וְ/אָֽמְרָה֙ מֵאֵ֨ין יְבָמִ֜/י לְ/הָקִ֨ים לְ/אָחִ֥י/ו שֵׁם֙ בְּ/יִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: ru
  text: 'Но если мужчина не захочет взять в жёны вдову своего брата, то вдова его брата пусть пойдёт к городским воротам, к старейшинам, и скажет: «Мой деверь отказывается сохранить имя своего брата в Израиле; он не желает исполнить по отношению ко мне долг деверя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поступить со мной как деверь». Это специальное выражение об обязанности деверя — брата умершего — взять его вдову в жёны, чтобы сохранить имя и род умершего.'
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: не захочет
  rationale: Передаёт волевой смысл חפץ естественным для современного русского юридического контекста выражением.
- source_word: לָקַחַת
  choice: взять
  rationale: Сохраняет буквальное значение глагола; в данном контексте речь идёт о взятии вдовы в жёны, что разъясняется примечанием.
- source_word: יְבִמְתּוֹ
  choice: вдову своего брата
  rationale: Точно обозначает женщину в контексте левиратного брака и яснее, чем более широкое «невестку».
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: пусть пойдёт к воротам
  rationale: Русское «пойдёт к воротам» естественно передаёт предписанное движение к месту суда; буквальное «поднимется» здесь могло бы ошибочно указывать на рельеф.
- source_word: הַזְּקֵנִים
  choice: старейшинам
  rationale: Стандартное обозначение признанных местных властей, заседавших у городских ворот.
- source_word: מֵאֵין
  choice: отказывается
  rationale: Передаёт решительный отказ в формальной жалобе.
- source_word: לְהָקִים ... שֵׁם
  choice: сохранить имя
  rationale: Передаёт смысл идиомы — продолжить род и общественное имя умершего брата — без неестественного русского оборота «воздвигнуть имя».
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Прямое и естественное соответствие еврейскому выражению.
- source_word: לֹא אָבָה
  choice: не желает
  rationale: Сохраняет отдельное выражение нежелания и не сливает его с предшествующим «отказывается».
- source_word: יַבְּמִי
  choice: исполнить по отношению ко мне долг деверя
  rationale: Раскрывает технический глагол יבם, обозначающий исполнение обязанности брата умершего по отношению к вдове.
theological_decisions:
- issue: Передача терминологии левиратного брака
  choice: 'Использовать ясные родственные и юридические выражения: «вдова брата» и «исполнить долг деверя»'
  alternative: Употребить специальный термин «вступить в левиратный брак» либо буквально и непрозрачно передать глагол יבם
  rationale: Так сохраняется юридический смысл установления без внесения конфессионального толкования; техническая особенность еврейского глагола отмечена в сноске.
- issue: Значение идиомы לְהָקִים ... שֵׁם
  choice: «сохранить имя своего брата»
  alternative: «восставить имя своему брату» или «продолжить род своего брата»
  rationale: Выбор сохраняет образ имени, но передаёт его функцию на естественном современном русском; более конкретное значение продолжения рода не подменяет саму идиому.
translation_notes:
  register: Современный литературный русский язык с достоинством юридической речи. Синтаксис сохраняет последовательность еврейского текста, но избегает неестественных кальк. Маркер сноски помещён непосредственно после относящейся к нему реплики.
