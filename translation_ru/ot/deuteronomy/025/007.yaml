    issue: Не вполне явный брачный смысл «взять вдову своего брата».
    rationale: В русском «взять вдову» может быть воспринято не как вступление в брак. В данном юридическом контексте לָקַחַת означает взять в жёны; добавление «в жёны» не меняет смысла, а делает его ясным.
  - severity: low
    issue: «Этот человек» вносит лишний указательный оттенок.
    rationale: הָאִישׁ — «этот/тот мужчина» лишь как определённое, контекстуально известное лицо; по-русски естественнее «этот мужчина» не требуется, достаточно «мужчина».
  - severity: medium
