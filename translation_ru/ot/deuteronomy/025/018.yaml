base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: ru
  text: как он встретил тебя на пути и напал на всех отставших позади тебя, когда ты был изнурён и обессилен; он не боялся Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: встретил тебя
  rationale: Глагол допускает оттенки «встретил» и «случился/напал»; нейтральное «встретил» сохраняет отличие от следующего описания нападения и соответствует ближайшему контексту.
- source_word: וַיְזַנֵּב בְּךָ
  choice: напал сзади
  rationale: Редкий глагол связан с образом хвоста и здесь означает нападение на тыл, на замыкающих колонну; перевод передаёт и действие, и пространственный образ без чрезмерно узкого «истребил».
- source_word: הַנֶּחֱשָׁלִים
  choice: отставших
  rationale: Форма обозначает ослабевших или отставших людей позади основной группы; «отставшие» естественно выражает их положение в походной колонне.
- source_word: עָיֵף וְיָגֵעַ
  choice: изнурён и обессилен
  rationale: Парные прилагательные описывают сильную усталость и истощение; русская пара сохраняет усиление без тавтологии.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: он не боялся Бога
  rationale: Синтаксически наиболее естественный субъект — Амалик из предыдущего контекста; «бояться Бога» сохраняет библейское выражение нравственно-религиозного благоговения.
theological_decisions:
- issue: Субъект слов «не боялся Бога»
  choice: 'Амалик: «он не боялся Бога»'
  alternative: 'Израиль: «ты не боялся Бога»'
  rationale: Хотя древнееврейская форма יָרֵא сама по себе не маркирует здесь лицо однозначно, последовательность глаголов и традиционное синтаксическое прочтение связывают фразу с Амаликом. Местоимение «он» делает это чтение ясным, не добавляя конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достоинственный. Сохранена структура зависимого предложения, поскольку стих продолжает повеление помнить Амалика из предыдущего стиха. Единственное число «ты был» передаёт обращение к Израилю как к народу.
