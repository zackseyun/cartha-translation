base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: ru
  text: И первенец, которого она родит, станет продолжателем имени своего умершего брата[a], чтобы имя умершего не изгладилось из Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «встанет на имя своего умершего брата». Этот правовой оборот говорит о сохранении имени и родовой линии умершего, а не обязательно о том, что ребёнку дадут его личное имя.'
    reason: Лексическая альтернатива поясняет необычный еврейский правовой оборот, сохраняя его буквальный образ и не устраняя возможную неоднозначность относительно личного имени.
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: первенец
  rationale: Сохраняет юридическое и семейно-родовое значение первого рождённого сына в контексте левиратного брака.
- source_word: תֵּלֵד
  choice: которого она родит
  rationale: Женский род глагола указывает на вдову; формулировка естественна по-русски и сохраняет её как субъект действия.
- source_word: יָקוּם עַל שֵׁם
  choice: продолжит имя
  rationale: В данном правовом контексте оборот означает продолжение имени, рода и положения умершего, а не обязательно наречение ребёнка тем же личным именем. Русское выражение ясно передаёт эту функцию, не перегружая основной текст буквальной калькой.
- source_word: אָחִיו הַמֵּת
  choice: его умершего брата
  rationale: Прямой и естественный перевод сочетания; «умершего» звучит в современном русском dignified и уместнее, чем «мёртвого» применительно к родственнику.
- source_word: יִמָּחֶה
  choice: не изгладилось
  rationale: Передаёт пассивное значение Niphal от מחה — быть стёртым, изглаженным — и сохраняет библейский образ исчезновения имени и памяти.
- source_word: מִיִּשְׂרָאֵל
  choice: из Израиля
  rationale: Предлог מן обозначает удаление из народа или общины; «из Израиля» прямо и естественно передаёт этот смысл.
theological_decisions:
- issue: Значение левиратной формулы יָקוּם עַל שֵׁם אָחִיו הַמֵּת
  choice: Ребёнок продолжает имя и родовую линию умершего брата.
  alternative: Ребёнку буквально дают личное имя умершего брата.
  rationale: В юридическом контексте Второзакония формула относится к сохранению положения, наследственной линии и памяти умершего в Израиле. Перевод не сводит её к буквальному совпадению личных имён, но сноска сохраняет форму и неоднозначность еврейского оборота.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «И» сохраняет связь со следующим предписанием контекста; «изгладилось» удерживает образность оригинала без архаической перегрузки.
