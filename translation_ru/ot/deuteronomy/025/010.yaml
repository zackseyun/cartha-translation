  rationale: Еврейская пассивная формула буквально означает «и будет названо его имя», но в современном русском естественнее передать публичное именование семьи как «назовут его дом»; это также подготавливает последующий титул בֵּית.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог обозначает общественную среду, в которой будет употребляться это позорящее название.
- source_word: בֵּית
  choice: Дом
  rationale: Слово обозначает не только жилище, но и семью или род; «Дом» сохраняет краткую формулу родового наименования.
- source_word: חֲלוּץ הַנָּעַל
  choice: того, с кого сняли сандалию
  rationale: Сжатое еврейское сочетание связано с описанным выше обрядом снятия сандалии. Русская формулировка ясно выражает действие и не добавляет отсутствующее в тексте слово «человек».
