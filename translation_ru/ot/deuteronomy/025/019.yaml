reference: Deuteronomy 25:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: ru
  text: И когда Яхве, твой Бог, даст тебе покой от всех врагов, окружающих тебя, в земле, которую Яхве, твой Бог, даёт тебе в наследие, чтобы ты овладел ею, сотри память[a] об Амалике из-под небес. Не забудь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «упоминание».'
    reason: Существительное זֵכֶר может обозначать как память, так и сохраняющееся упоминание.
lexical_decisions:
- source_word: וְהָיָה
  choice: И когда
  rationale: Оборот вводит будущее обстоятельство, после наступления которого должно быть исполнено повеление; по-русски естественно передать его временным союзом.
- source_word: בְּהָנִיחַ
  choice: даст тебе покой
  rationale: Каузативная форма глагола נוח означает, что Бог дарует покой; настоящее совершенного вида естественно выражает будущее действие в придаточном времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: от всех врагов, окружающих тебя
  rationale: Сохраняет значение всеохватности и пространственный смысл выражения מִסָּבִיב в естественном русском синтаксисе.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: даёт тебе в наследие
  rationale: Причастие נֹתֵן передано как продолжающееся и направленное в будущее действие, а נַחֲלָה — традиционным для земли завета словом «наследие».
- source_word: לְרִשְׁתָּהּ
  choice: чтобы ты овладел ею
  rationale: Передаёт цель дарования земли и явное местоименное дополнение женского рода, относящееся к земле.
- source_word: תִּמְחֶה
  choice: сотри
  rationale: Глагол מחה означает стирать или изглаживать; форма повелительного значения передана прямым повелением без ослабления.
- source_word: זֵכֶר
  choice: память
  rationale: Слово обозначает сохраняющуюся память или упоминание; «память об Амалике» кратко и естественно передаёт основной смысл, а альтернативный оттенок отмечен в сноске.
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: из-под небес
  rationale: Сохранён образный древнееврейский оборот и его всеобщий пространственный охват без сведения к более плоскому «с земли».
- source_word: לֹא תִּשְׁכָּח
  choice: Не забудь
  rationale: Краткое отдельное запрещение сохраняет резкий заключительный акцент оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Объём выражения זֵכֶר עֲמָלֵק
  choice: память об Амалике
  alternative: упоминание об Амалике
  rationale: Основной текст не уточняет, идёт ли речь преимущественно о памяти, имени или сохраняющемся упоминании; возможный лексический оттенок оставлен в сноске, не превращаясь в догматическое толкование.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены повтор имени Яхве, единственное число обращения, образ «из-под небес» и краткий заключительный запрет.
