  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: ru
  text: Если мужчина и его брат[a] дерутся друг с другом и жена одного из них подойдёт, чтобы спасти своего мужа от руки того, кто его бьёт, протянет руку и схватит того, кто бьёт её мужа, за половые органы[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «брат» здесь может означать соплеменника или другого человека из своего народа, а не обязательно родного брата.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «за его срамные места» — эвфемистическое обозначение мужских половых органов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: Если двое мужчин дерутся между собой
  rationale: כִּי вводит казуистическое условие, поэтому «если» естественно для русского языка закона. Нифаль יִנָּצוּ обозначает физическую схватку, а יַחְדָּו здесь передаёт взаимность действия. Число «двое» ясно из последующего אִישׁ וְאָחִיו.
- source_word: אִישׁ וְאָחִיו
  choice: мужчина и его брат
  rationale: Сохранено буквальное «мужчина и его брат», чтобы не устранять социально-общинный оттенок; примечание поясняет, что אָח может обозначать не только родного брата.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: и жена одного из них подойдёт
  rationale: «Одного из них» по-русски естественно и недвусмысленно указывает на одного из двух дерущихся мужчин.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: чтобы спасти своего мужа
  rationale: В брачном контексте אִישָׁהּ означает «её муж»; возвратное «своего» естественно связывает его с подлежащим «жена».
- source_word: מִיַּד מַכֵּהוּ
  choice: от руки того, кто его бьёт
  rationale: Сохранён конкретный древнееврейский образ «от руки», а причастие מַכֵּהוּ передано без более общего истолкования «нападающий».
- source_word: וְשָׁלְחָה יָדָהּ וְהֶחֱזִיקָה
  choice: протянет руку и схватит
  rationale: Последовательные формы в условном законодательном случае естественно переданы русским будущим временем; «схватит» выражает решительное удержание.
- source_word: בִּמְבֻשָׁיו
  choice: за половые органы
  rationale: Редкое множественное существительное обозначает мужские интимные части тела и само является эвфемистическим обозначением; современное выражение «половые органы» точно, понятно и не вульгарно.
