  source_fidelity: 'Смысловой состав передан точно: условный случай физической драки двух мужчин, вмешательство жены одного из них ради спасения мужа и захват половых органов нападающего. Незавершённость условного предложения оправданна, поскольку норма продолжается в следующем стихе. Однако местоимение «того» в финале недостаточно ясно соотнесено с мужчиной, который наносит удары; в русском оно может на мгновение восприниматься как отсылка к мужу женщины.'
