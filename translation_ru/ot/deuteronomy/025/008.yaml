base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: ru
  text: 'Тогда старейшины его города призовут его и обратятся к нему. Если же он будет стоять на своём и скажет: «Я не желаю взять её в жёны»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָרְאוּ לוֹ
  choice: призовут его
  rationale: В предписании последовательная форма передаёт обязательное процедурное действие; «призовут» естественно обозначает официальный вызов к старейшинам.
- source_word: זִקְנֵי עִירוֹ
  choice: старейшины его города
  rationale: Сочетание обозначает признанных руководителей местной общины; «города» буквально и естественно передаёт עִיר.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: и поговорят с ним
  rationale: Предлог אֶל указывает на обращённую к нему речь; русский глагол «поговорят» сохраняет возможный оттенок увещевания, не добавляя его прямо.
- source_word: וְעָמַד
  choice: если же он будет настаивать
  rationale: Буквально «и он встанет/будет стоять», но в данном юридическом контексте речь, вероятно, о твёрдости и продолжении отказа после разговора со старейшинами. Условная конструкция делает ход предписания ясным.
- source_word: לֹא חָפַצְתִּי
  choice: Я не хочу
  rationale: חפץ выражает желание или готовность. «Не хочу» современно и точно передаёт прямой отказ без излишне книжного оттенка.
- source_word: לְקַחְתָּהּ
  choice: взять её в жёны
  rationale: לקח применительно к женщине в этом контексте является обычным обозначением вступления в брак. Эксплицитная русская идиома предотвращает ошибочное понимание буквального «взять её».
theological_decisions:
- issue: Смысл וְעָמַד после обращения старейшин
  choice: «если же он будет настаивать»
  alternative: «если же он встанет» / «и он будет стоять»
  rationale: Буквальная пространственная формулировка по-русски не передаёт понятного юридического действия. Контекст поддерживает значение твёрдого продолжения отказа, однако перевод не уточняет мотив или нравственную оценку мужчины.
- issue: Брачное значение לְקַחְתָּהּ
  choice: «взять её в жёны»
  alternative: «взять её»
  rationale: Контекст закона о девере однозначно указывает на брак; выбранная формулировка раскрывает устойчивую древнееврейскую идиому, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-повествовательного контекста. Будущее время передаёт последовательность нормативных действий. Прямая речь звучит просто и решительно; архаизмы и канцелярская тяжеловесность исключены.
