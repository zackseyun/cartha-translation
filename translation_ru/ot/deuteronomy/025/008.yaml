revisions:
- from: 'Тогда старейшины его города призовут его и поговорят с ним. Если же он будет настаивать и скажет: «Я не хочу взять её в жёны»,'
  to: 'Тогда старейшины его города призовут его и обратятся к нему. Если же он будет стоять на своём и скажет: «Я не желаю взять её в жёны»,'
  rationale: 'Перевод уточнён минимально: официально направленная речь передана как «обратятся к нему», а спорно-идиоматическое וְעָמַד — как «будет стоять на своём», без сведения его смысла только к «настаивать». Брачный смысл לְקַחְתָּהּ сохранён в естественной русской идиоме «взять её в жёны».'
