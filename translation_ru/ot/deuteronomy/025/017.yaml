  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: ru
  text: Помни, что сделал с тобой Амалик по пути, когда вы выходили из Египта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: Помни
  rationale: Форма Qal, повелительное наклонение, единственное число; прямое и естественное повеление, сохраняющее силу призыва к памяти.
- source_word: אֵת אֲשֶׁר
  choice: что
  rationale: Показатель прямого дополнения с относительной частицей вводит содержание того, что следует помнить; «что» естественно для современного русского языка.
- source_word: עָשָׂה לְךָ
  choice: сделал тебе
  rationale: Глагол עשה с ל обозначает действие, направленное на Израиль. Контекст раскрывает его враждебный характер, поэтому нейтральное «сделал тебе» сохраняет формулировку источника, не добавляя толкования.
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Традиционная и узнаваемая русская передача имени.
- source_word: בַּדֶּרֶךְ
  choice: на пути
  rationale: Передаёт обстоятельство пути или путешествия кратко, естественно и в соответствии с контекстом.
- source_word: בְּצֵאתְכֶם
  choice: когда вы вышли
  rationale: Инфинитивная конструкция с ב имеет временное значение. Множественное «вы» сохраняет переход от обращения к Израилю как к единому целому к множественному обозначению вышедших.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог מן обозначает исходную точку; «вышли из Египта» — нормативное и естественное русское сочетание.
theological_decisions:
- issue: Число местоимений при обращении к Израилю
  choice: «тебе» в единственном числе и «вы вышли» во множественном
  alternative: Унифицировать как «вам… вы» или «тебе… ты»
  rationale: Еврейский текст намеренно или стилистически сочетает единственное לְךָ с множественным בְּצֵאתְכֶם. Перевод сохраняет этот переход и не устраняет возможное напряжение между Израилем как единым народом и множеством его членов.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Сохранена синтаксическая простота оригинала и смена числа в обращении; двоеточие английского консультационного текста не воспроизведено, поскольку в данном отдельном стихе еврейская пунктуация не требует его.
