  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: ru
  text: Ведь всякий, кто делает это, всякий, кто творит неправду, — мерзость для Яхве, твоего Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего запрета; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: תוֹעֲבַת
  choice: отвратителен для
  rationale: Еврейское существительное обозначает то, что вызывает сильное отвращение у Бога. Предикативная конструкция «отвратителен для» передаёт смысл естественно и сохраняет сильную нравственную оценку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохранено обращение во втором лице единственного числа и формула отношений завета.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: всякий, кто поступает так
  rationale: Причастная конструкция обозначает любого человека данного рода; «поступает так» естественно отсылает к описанным выше нечестным мерам и весам.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: всякий, кто творит неправду
  rationale: Повтор «всякий, кто» сохраняет параллелизм; «творит неправду» передаёт עָוֶל как неправду и несправедливость, особенно в нечестной торговле.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер Божьей оценки
  choice: отвратителен для Яхве
  alternative: мерзость перед Яхве
  rationale: Выбран естественный современный русский оборот, сохраняющий сильную морально-богословскую оценку, без сведения תוֹעֵבָה лишь к ритуальной нечистоте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранены повтор «всякий, кто» и широкое нравственное значение עָוֶל; архаическое «мерзость пред» не использовано.
