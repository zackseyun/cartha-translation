lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И скажешь ты
  rationale: Форма Qal perfect 2 м. ед. с союзом в контексте предостережения имеет будущее или условно-возможное значение; будущее время естественно передаёт развитие мысли.
- source_word: בִּלְבָבֶךָ
  choice: в своём сердце
  rationale: Сохранён древнееврейский образ внутренней мысли и разговора с самим собой; выражение понятно в современном литературном русском.
- source_word: כֹּחִי
  choice: моя сила
  rationale: כֹּחַ обозначает силу, способность или мощь; «сила» ясно передаёт приписываемую себе способность добиться успеха.
- source_word: וְעֹצֶם יָדִי
  choice: и мощь моей руки
  rationale: Сохранён конкретный образ руки как орудия человеческой деятельности; «мощь» передаёт עֹצֶם и избегает буквального повтора слова «сила».
- source_word: עָשָׂה לִי
  choice: приобрели мне
  rationale: Хотя עשה буквально значит «сделал», в сочетании с לִי и חַיִל здесь речь идёт о достижении или приобретении богатства. Русское множественное число согласовано с составным подлежащим.
- source_word: הַחַיִל הַזֶּה
  choice: это богатство
  rationale: В контексте Второзакония 8 слово חַיִל относится прежде всего к материальному достатку и ресурсам; указательное местоимение передано в единственном числе.
theological_decisions:
- issue: Значение חַיִל в предостережении о благополучии
  choice: богатство
  alternative: благосостояние; достаток; сила
  rationale: Ближайший контекст говорит о материальном изобилии Израиля. «Богатство» сохраняет направленность предостережения против самодостаточности, не сводя חַיִל к военной силе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок слов «скажешь ты» и образ «в своём сердце» сохраняют достоинство и конкретность оригинала, оставаясь понятными современному читателю.
