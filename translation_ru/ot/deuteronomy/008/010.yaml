  text: Когда ты поешь и насытишься, благослови[a] Яхве, твоего Бога, за добрую землю, которую Он дал тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поблагодари» или «восхвали» Яхве, твоего Бога. В еврейском тексте: «благослови»; это сохраняет библейскую идиому благодарного прославления Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: будешь есть
  rationale: Перфект 2-го лица мужского рода единственного числа с союзом в данной последовательности выражает ожидаемое следствие; форма будущего времени естественна по-русски и сохраняет наставительный тон.
- source_word: וְשָׂבָעְתָּ
  choice: насыщаться
  rationale: Глагол обозначает достижение сытости, достатка в пище. «Насыщаться» точно передаёт значение и поддерживает параллельную конструкцию с «будешь есть».
- source_word: וּבֵרַכְתָּ
  choice: благословишь
  rationale: 'Прямой эквивалент сохраняет библейскую идиому: когда объектом является Бог, речь идёт о благодарном прославлении и добром слове о Нём, а не о даровании Ему блага.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: Бога твоего
  rationale: Суффикс 2-го лица единственного числа передаёт личное и заветное отношение; порядок слов соответствует возвышенному, но понятному русскому библейскому стилю.
- source_word: עַל
  choice: за
  rationale: При глаголе «благословить» предлог вводит основание благодарного прославления; русское «за» естественно выражает эту причинную связь.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: добрую землю
  rationale: Прямой перевод сохраняет мотив дарованной земли и не сужает значение прилагательного до плодородия или приятности.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: которую Он дал тебе
  rationale: Относительное предложение указывает на совершившийся дар Бога; местоимение «Он» делает подразумеваемое подлежащее ясным по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» передаёт тетраграмматон как имя и не заменяет его титулом.
- issue: Значение ברך по отношению к Богу
  choice: благословишь
  alternative: поблагодаришь; восхвалишь
  rationale: Сохранена подлинная библейская идиома и её более широкий смысл; благодарение и хвала входят в него, но ни одно из этих слов по отдельности не исчерпывает его.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Последовательность будущих форм отражает еврейскую цепочку действий. Инверсия «Бога твоего» сохраняет достоинство стиля и остаётся понятной современному читателю.
