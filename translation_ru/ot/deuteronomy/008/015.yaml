base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: ru
  text: который вёл тебя через великую и страшную пустыню, где были огненные змеи[a], скорпионы и безводная иссушенная земля[b], и который вывел для тебя воду из кремнистой скалы,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ядовитые змеи». Еврейское выражение, традиционно переводимое как «огненные змеи», может обозначать змей, укус которых вызывал жжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «засуха» или «жажда». Еврейское слово может обозначать жажду либо иссушенную безводную местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: который вёл тебя
  rationale: Причастие породы hiphil с суффиксом 2-го лица ед. числа в контексте обозначает действие Господа и естественно передаётся относительным придаточным.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: через ту великую и страшную пустыню
  rationale: «Через» передаёт движение по пустыне; «великая и страшная» сохраняет парные определения и возвышенный, понятный регистр.
- source_word: נָחָשׁ שָׂרָף
  choice: огненные змеи
  rationale: Сохраняется традиционный и буквально обоснованный образ; выражение, вероятно, указывает на жгучее действие укуса, что отмечено в сноске.
- source_word: וְעַקְרָב
  choice: и скорпионы
  rationale: Прямое соответствие; множественное число естественно для перечисления опасностей.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: где была иссушенная земля без воды
  rationale: צִמָּאוֹן может обозначать жажду или иссушенную безводную местность; конкретная формулировка естественно связывается с последующим אֲשֶׁר אֵין מָיִם.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: который извёл для тебя воду
  rationale: Причастие hiphil передаёт причинение выхода воды; «извёл» сохраняет конкретный образ и соответствует достоинству библейского повествования.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: из кремнистой скалы
  rationale: צּוּר — скала/камень, а חַלָּמִישׁ указывает на кремень или особую твёрдость; сочетание передано естественным русским определением.
theological_decisions:
- issue: Характер перечисленных опасностей пустыни
  choice: Передать их как конкретные опасности исторического странствия Израиля.
  alternative: Истолковать огненных змей метафорически или обобщить перечень до «опасностей и засухи».
  rationale: Еврейский текст даёт предметный перечень и не требует аллегоризации; перевод сохраняет историческую конкретность и образность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет связь с более широким предложением, поэтому стих начинается со строчной буквы и оканчивается запятой. Оба маркера сносок присутствуют в основном тексте.
