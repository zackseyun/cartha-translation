base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: ru
  text: Итак[a], соблюдай заповеди Яхве, твоего Бога, ходя Его путями и боясь Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И соблюдай». Еврейский союз может обозначать простое продолжение речи, хотя здесь он, вероятно, выражает вывод из предшествующего.'
    reason: lexical_alternative
  - marker: b
    text: 'Страх перед Богом здесь подразумевает благоговейный страх; возможный перевод: «благоговея перед Ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Итак, соблюдай
  rationale: Глагол שׁמר в контексте завета означает соблюдение заповедей. Русское повелительное «соблюдай» естественно передаёт обращённое к Израилю наставление во 2-м лице единственного числа; союз וְ в данном контексте понят как вывод из предшествующего.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: Слово обозначает данные Богом обязательные предписания; «заповеди» сохраняет правовой и заветный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Форма с суффиксом 2-го лица мужского рода единственного числа имеет прямое притяжательное значение.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: ходя Его путями
  rationale: Сохранён библейский образ хождения путями Бога; деепричастный оборот естественно выражает образ осуществления послушания.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: и боясь Его
  rationale: Глагол ירא сохраняет значение страха, которое в отношении Бога включает благоговение; перевод не ослабляет его до одного лишь почтения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Значение страха перед Богом
  choice: боясь Его
  alternative: почитая Его; благоговея перед Ним
  rationale: Основной текст сохраняет сильное и богословски значимое понятие страха, тогда как примечание поясняет его благоговейный оттенок.
- issue: Связь инфинитивов с соблюдением заповедей
  choice: ходя Его путями и боясь Его
  alternative: чтобы ходить Его путями и бояться Его
  rationale: Контекст допускает оттенок цели или результата, однако здесь инфинитивы естественнее поняты как раскрытие того, как проявляется соблюдение заповедей; двусмысленность не превращена в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Сохранены традиционные и понятные образы «заповеди» и «ходить путями»; местоимение при имени Бога написано с прописной буквы как редакционный знак почтительности.
