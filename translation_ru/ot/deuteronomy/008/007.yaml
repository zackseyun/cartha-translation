base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: ru
  text: Ведь Яхве, твой Бог, вводит тебя в добрую землю — землю водных потоков[a], источников и глубин[b], выходящих в долинах и в горах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «землю водотоков»; еврейское слово может обозначать потоки, бурные сезонные реки или вади.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «глубоких вод»; речь может идти о подземных водах или водных глубинах.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в долине и на горе»; эти формы, вероятно, имеют собирательное значение. Возможен также перевод: «на равнине и в горах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим наставлением естественным для современного русского языка союзом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Точно передаёт форму со второличным суффиксом мужского рода единственного числа.
- source_word: מְבִיאֲךָ
  choice: вводит тебя
  rationale: Причастная форма изображает действие как происходящее или близкое; «вводит» передаёт направленное движение внутрь земли.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: в хорошую землю
  rationale: Прямо сохраняет качественную характеристику טוֹבָה без конфессионально окрашенного расширения.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: землю водных потоков
  rationale: Сохраняет образ земли, богатой текущей водой; נַחַל может обозначать поток, русло сезонной реки или вади.
- source_word: עֲיָנֹת
  choice: источников
  rationale: Естественное современное обозначение природных выходов воды.
- source_word: וּתְהֹמֹת
  choice: и глубинных вод
  rationale: Передаёт представление о глубоких, возможно подземных, водах, не сводя значение исключительно к одному гидрологическому объяснению.
- source_word: יֹצְאִים
  choice: выходящих
  rationale: Сохраняет образ вод, выходящих наружу; форма множественного числа позволяет отнести определение к источникам и глубинным водам.
- source_word: בַּבִּקְעָה וּבָהָר
  choice: в долинах и на горах
  rationale: Передаёт контраст низменной и горной местности; русское множественное число естественно выражает собирательное топографическое значение еврейских форм.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Объём определения יֹצְאִים («выходящих»)
  choice: Отнесено к «источникам и глубинным водам»
  alternative: Отнести только к «глубинным водам» либо ко всему перечню вод
  rationale: Мужское множественное число допускает согласование по смыслу с ближайшей парой водных источников; синтаксис не требует догматически сужать образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Конструкция «землю водных потоков» намеренно сохраняет поэтическую плотность оригинала; формы «в долинах и на горах» звучат естественно и передают собирательную топографию.
