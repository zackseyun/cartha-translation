  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: ru
  text: то вознесётся сердце твоё, и ты забудешь Яхве, Бога твоего, который вывел тебя из земли Египетской, из дома рабов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из дома рабства»; буквально: «из дома рабов».'
    reason: 'Лексическая альтернатива: еврейское выражение конкретно говорит о «доме рабов», тогда как по-русски его часто передают как «дом рабства».'
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: то вознесётся сердце твоё
  rationale: Сохраняет еврейскую метафору возвышенного сердца, подразумевающую гордость, и естественно продолжает условно-следственную последовательность контекста.
- source_word: וְשָׁכַחְתָּ
  choice: и ты забудешь
  rationale: Перфектная форма в контекстуальной последовательности выражает предостерегаемое следствие; русское будущее время передаёт это естественно.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, Бога твоего
  rationale: Передаёт тетраграмматон как личное имя «Яхве», а אֱלֹהֶיךָ — как «Бога твоего», сохраняя торжественный библейский порядок слов.
- source_word: הַמּוֹצִיאֲךָ
  choice: который вывел тебя
  rationale: Субстантивированное причастие обозначает Яхве через совершённое избавление; относительное предложение естественно по-русски.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет полный образ исхода из страны Египта и соответствует достоинству библейского регистра.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабов
  rationale: Буквально и конкретно передаёт множественное עֲבָדִים «рабы», не заменяя его абстрактным понятием «рабство».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно транслитерируется, а не заменяется титулом.
- issue: Смысл מִבֵּית עֲבָדִים
  choice: из дома рабов
  alternative: из дома рабства; из рабства
  rationale: Выбран конкретный образ, соответствующий множественному существительному «рабы»; более привычное абстрактное прочтение отмечено в сноске.
- issue: Метафора возвышенного сердца
  choice: вознесётся сердце твоё
  alternative: ты возгордишься
  rationale: Сохранена подлинная метафора оригинала, а подразумеваемое значение гордости не превращено в единственный явный смысл.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Инверсия «сердце твоё», «Бога твоего» сохранена как понятная и dignified; архаизмы избегаются.
