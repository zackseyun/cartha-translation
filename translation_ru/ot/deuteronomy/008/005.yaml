lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: И знай
  rationale: Форма qal perfect 2 м. ед. с союзом в данном контексте имеет итогово-побудительную силу. «И знай» естественно продолжает предшествующую мысль и передаёт призыв к осознанию, не превращая его в простое сообщение о прошлом.
- source_word: עִם לְבָבֶךָ
  choice: в своём сердце
  rationale: Еврейское выражение обозначает внутреннее осознание и убеждение; по-русски это естественно передаётся как «в своём сердце».
- source_word: כִּי
  choice: ':'
  rationale: כִּי вводит содержание того, что Израиль должен знать. В русском двоеточие ясно и естественно вводит последующее пояснение без добавления лишнего союза.
- source_word: כַּאֲשֶׁר
  choice: как … так
  rationale: Парная конструкция «как … так» отчётливо передаёт сопоставление человеческого воспитательного воздействия с действием Яхве.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: вразумляет
  rationale: Корень יסר охватывает исправление, наказание и воспитывающее наставление. «Вразумляет» сохраняет одновременно исправительный и воспитательный оттенки; повтор одного русского глагола отражает повтор в еврейском тексте.
- source_word: אִישׁ
  choice: человек
  rationale: В источнике прямо употреблено «человек», а не «отец»; родительское отношение выражено словами «своего сына».
- source_word: בְּנוֹ
  choice: своего сына
  rationale: Существительное означает именно «сын», а возвратное местоимение естественно передаёт принадлежность при русском подлежащем «человек».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Точно передаёт заветное обращение во втором лице единственного числа.
theological_decisions:
- issue: Характер Божьего воздействия
  choice: вразумляет
  alternative: наказывает; исправляет; наставляет
  rationale: Выбранное слово не сводит действие Бога ни только к карательной мере, ни только к мягкому обучению, сохраняя заложенное в יסר сочетание исправления и воспитания.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; форма «Яхве» передаёт его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет лаконизм, прямое обращение в единственном числе и повтор ключевого глагола.
