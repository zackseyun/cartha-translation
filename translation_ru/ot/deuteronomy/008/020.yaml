base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: ru
  text: Подобно народам, которых Яхве истребляет перед вами, погибнете и вы за то, что не слушаетесь голоса Яхве, вашего Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повинуетесь Яхве, вашему Богу». Еврейский оборот буквально говорит о слушании голоса и обычно подразумевает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Как народы
  rationale: Предлог כְּ вводит сравнение, а גּוֹיִם обозначает народы земли; формула «как… так и…» естественно передаёт еврейское соответствие כַּ… כֵּן.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: מַאֲבִיד
  choice: истребляет
  rationale: Причастие породы hифиль от אבד выражает продолжающееся причинение гибели; «истребляет» ясно и естественно передаёт действие в данном контексте.
- source_word: מִפְּנֵיכֶם
  choice: перед вами
  rationale: Сохраняет пространственный образ удаления народов с пути Израиля без неестественного буквального «от лица вашего».
- source_word: תֹאבֵדוּן
  choice: вы погибнете
  rationale: Форма qal обозначает гибель самого Израиля и сохраняет смысловую связь с тем же корнем אבד в предыдущей части стиха.
- source_word: עֵקֶב
  choice: за то, что
  rationale: Передаёт причинно-следственную связь между непослушанием и предстоящей гибелью естественным русским оборотом.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: не слушаетесь голоса
  rationale: Сохраняет явный образ слушания голоса и одновременно передаёт присущий идиоме смысл послушания. Настоящее время соответствует незавершённому виду еврейской формы и характеру продолжающегося предупреждения.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Сочетание с именем Яхве однозначно относится к единому Богу Израиля; местоименная форма во множественном числе обращена ко всему народу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет личное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Передача идиомы שׁמע בקול
  choice: слушаться голоса
  alternative: повиноваться
  rationale: Выбранный оборот сохраняет одновременно буквальный образ слышания голоса и подразумеваемое послушание, не сводя многозначную заветную формулу только к повиновению.
- issue: Временное значение לֹא תִשְׁמְעוּן
  choice: не слушаетесь
  alternative: не слушались; не будете слушаться
  rationale: Еврейский имперфект сам по себе допускает контекстуальные оттенки продолжающегося, обычного или будущего действия. В контексте предупреждения настоящее время естественно выражает устойчивое непослушание, не превращая фразу исключительно в утверждение о прошлом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Парная конструкция «как… так и…» воспроизводит структуру оригинала; оборот «слушаетесь голоса» намеренно сохраняет заветный образ, хотя звучит несколько возвышенно.
