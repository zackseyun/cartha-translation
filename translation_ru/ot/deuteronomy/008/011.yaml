  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: ru
  text: Берегись, чтобы тебе не забыть Яхве, твоего Бога, не соблюдая Его заповедей, установлений и постановлений, которые я заповедую тебе сегодня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Возвратная предупредительная формула передаёт значение нифального императива и звучит естественно и торжественно по-русски.
- source_word: פֶּן תִּשְׁכַּח
  choice: чтобы тебе не забыть
  rationale: Сохраняет отрицательное предостережение, вводимое פֶּן, не превращая опасность в утверждение.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твоего Бога
  rationale: Тетраграмматон передан личным именем «Яхве», а приложение сохраняет обращённость к одному адресату мужского рода.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: не соблюдая
  rationale: Деепричастный оборот естественно выражает способ или практическое проявление забвения; причинно-смысловая связь остаётся слегка открытой, как в еврейском тексте.
- source_word: מִצְוֺתָיו
  choice: Его заповедей
  rationale: Устоявшийся и точный эквивалент заветно-правового термина מִצְוָה.
- source_word: מִשְׁפָּטָיו
  choice: установлений
  rationale: В данном перечислении «установления» передаёт нормативно-правовой смысл מִשְׁפָּט и избегает возможного понимания «судов» как судебных процессов.
- source_word: חֻקֹּתָיו
  choice: постановлений
  rationale: Передаёт обязательные предписания חֻקָּה и сохраняет различие между тремя правовыми терминами.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я заповедую тебе сегодня
  rationale: Настоящее время сохраняет актуальность причастной формы מְצַוֶּה и характерную для Второзакония срочность слова «сегодня».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Связь забвения Бога с несоблюдением заповедей
  choice: не соблюдая
  alternative: так что не будешь соблюдать; отказавшись соблюдать
  rationale: Еврейское לְבִלְתִּי שְׁמֹר допускает оттенок способа или проявления забвения. Русское деепричастие сохраняет эту связь без излишне жёсткого причинного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет форму личного предостережения и трёхчленное перечисление правовых терминов; местоимение «Его» написано с прописной буквы как традиционная русская издательская норма, не добавляющая отдельного толкования.
