  text: и умножится у тебя крупный и мелкий скот, станет больше серебра и золота, и умножится всё, что у тебя есть,—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: и крупный скот
  rationale: בקר обозначает крупный рогатый скот как совокупность; «крупный скот» точно передаёт отличие от צאן и естественно сочетается с «мелким скотом».
- source_word: וְצֹאנְךָ
  choice: и мелкий скот
  rationale: צאן — собирательное обозначение овец и коз; «мелкий скот» сохраняет обобщённость и противопоставление בקר.
- source_word: יִרְבְּיוּן
  choice: умножится
  rationale: Форма от רבה выражает численное увеличение поголовья; единственное число по-русски согласовано с составным сочетанием «крупный и мелкий скот», где «скот» употреблён собирательно.
- source_word: וְכֶסֶף וְזָהָב יִרְבֶּה לָּךְ
  choice: станет больше серебра и золота
  rationale: Конструкция естественно передаёт увеличение количества серебра и золота и значение לָךְ — наличие у адресата, не добавляя к самим существительным отсутствующее в еврейском тексте притяжательное местоимение.
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: и всё, что у тебя есть
  rationale: Прямой и современный способ передать совокупность всего принадлежащего адресату.
- source_word: יִרְבֶּה
  choice: умножится
  rationale: Повтор глагола от רבה сохранён в заключительном обобщении; «умножится» уместно для совокупности имущества и поддерживает риторический строй стиха.
