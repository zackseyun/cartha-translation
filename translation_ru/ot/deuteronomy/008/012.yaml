  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: ru
  text: чтобы, когда ты поешь и насытишься[a], построишь добротные дома и поселишься в них,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь сыт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: чтобы
  rationale: Союз вводит предостерегающую конструкцию, начатую в предыдущем стихе и достигающую отрицательного сказуемого далее; русский союз «чтобы» сохраняет эту синтаксическую зависимость без искусственного завершения мысли внутри стиха 12.
- source_word: תֹּאכַל
  choice: когда ты будешь есть
  rationale: Имперфект 2-го лица мужского рода единственного числа описывает будущее обстоятельство в последовательности предостережения; конструкция с «когда» естественна по-русски.
- source_word: וְשָׂבָעְתָּ
  choice: и насыщаться
  rationale: Глагол שׂבע означает достижение сытости или полного удовлетворения пищей. «Насыщаться» сохраняет эту смысловую широту и согласуется с будущей длительно-повторяющейся ситуацией.
- source_word: וּבָתִּים טוֹבִים
  choice: добротные дома
  rationale: В контексте благополучия טוֹבִים указывает на хорошее качество домов. «Добротные» передаёт это естественнее, чем общее «хорошие», не усиливая значение до роскоши.
- source_word: תִּבְנֶה
  choice: строить
  rationale: Имперфект продолжает описание будущей жизни в достатке. Инфинитив после «будешь» позволяет естественно координировать действия в русском предложении.
- source_word: וְיָשָׁבְתָּ
  choice: и жить в них
  rationale: ישׁב здесь означает проживание в построенных домах. Местоименное «в них» прямо восстанавливает понятную из контекста связь и необходимо для естественного русского выражения.
theological_decisions:
- issue: Незавершённая предостерегающая конструкция
  choice: Сохранить зависимость стиха от окружающего предложения с начальным «чтобы» и конечной запятой
  alternative: Превратить стих в самостоятельное утверждение или добавить отсутствующее здесь «не забудь»
  rationale: Еврейский פֶּן вводит предупреждение, синтаксическое завершение которого находится далее. Самостоятельное завершение стиха внесло бы в него слова или логическую структуру, отсутствующие в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейского текста строем. Фрагментарность стиха сохранена, поскольку он является частью предложения, продолжающегося через соседние стихи.
