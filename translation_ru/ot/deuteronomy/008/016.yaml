  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: ru
  text: Который кормил тебя в пустыне манной, которой не знали твои отцы[a], чтобы смирить тебя и испытать тебя, чтобы впоследствии сделать тебе добро[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои предки». Буквально: «твои отцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в конечном итоге»; буквально: «в твоём конце». Возможное значение: «в твоём будущем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: Который кормил тебя
  rationale: Причастие породы hифиль продолжает описание Бога из предыдущего контекста; относительное придаточное естественно передаёт эту связь и каузативное значение глагола.
- source_word: מָן
  choice: манной
  rationale: «Манна» — прочно установившаяся русская передача названия пищи в пустыне.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Русское «пустыня» естественно обозначает безлюдную пустынную местность и соответствует контексту странствования Израиля.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: которой не знали твои отцы
  rationale: Относительное местоимение относится к манне; «не знали» передаёт её неизвестность прежним поколениям.
- source_word: אֲבֹתֶיךָ
  choice: твои отцы
  rationale: Сохраняется прямое значение мужского множественного числа; более обобщённое «предки» указано в примечании.
- source_word: לְמַעַן עַנֹּתְךָ וּלְמַעַן נַסֹּתֶךָ
  choice: чтобы смирить тебя и испытать тебя
  rationale: Повтор לְמַעַן выражает цель. «Смирить» соответствует педагогическому смыслу ענה в контексте главы, не устраняя оттенка тяготы; נסה прямо передано как «испытать».
- source_word: לְהֵיטִבְךָ
  choice: ради твоего же блага
  rationale: Идиоматическая русская формулировка передаёт направленное на адресата значение «сделать тебе добро, облагодетельствовать» и связывает конечную цель с предшествующими испытаниями.
- source_word: בְּאַחֲרִיתֶךָ
  choice: впоследствии
  rationale: אַחֲרִית с суффиксом допускает значения последующего времени, конечного исхода или будущего состояния. «Впоследствии» естественно по-русски и не навязывает значение смерти или эсхатологического конца.
theological_decisions:
- issue: Цель трудностей в пустыне
  choice: Смирение и испытание представлены как намеренные действия Бога, в конечном счёте направленные на благо Израиля.
  alternative: Понимать смирение и испытание только как карательное наказание.
  rationale: Две целевые конструкции завершаются выражением לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ, которое указывает на благую цель, при этом перевод сохраняет суровость слов «смирить» и «испытать».
- issue: Значение בְּאַחֲרִיתֶךָ
  choice: впоследствии
  alternative: в конце твоём / в конечном итоге
  rationale: Еврейское выражение допускает временное и итоговое понимание. Основной текст использует естественную временную передачу, а примечание сохраняет альтернативу конечного исхода.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Единственное число «тебя» сохраняет обращение к Израилю как к единому народу. Тире перед заключительной целью облегчает синтаксис и показывает, что благо является итоговой целью смирения и испытания.
