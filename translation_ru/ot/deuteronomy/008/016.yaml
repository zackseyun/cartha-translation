    rationale: Предлог בְּ обычно передаётся здесь «в», а אַחֲרִיתֶךָ имеет диапазон «твоё будущее / конечный исход / конец твой». Формула «при твоём конце» не является точной русской передачей и может дезориентировать читателя.
