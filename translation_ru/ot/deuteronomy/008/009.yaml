  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: ru
  text: земля, где ты будешь есть хлеб, не зная нужды[a], где ни в чём не будешь испытывать недостатка; земля, камни которой — железо и из гор которой ты будешь добывать медь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в бедности», «в лишениях».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать «медь» или «бронза»; здесь предпочтено «медь», поскольку речь идёт о материале, добываемом из гор.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: в нужде
  rationale: Существительное обозначает бедность, нужду или лишения. Оборот «не в нужде» естественно передаёт отсутствие стеснённых условий и не дублирует полностью следующую фразу.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохранено основное конкретное значение слова; более широкий смысл пищи понятен из контекста.
- source_word: תֶחְסַר כֹּל
  choice: ни в чём не будешь испытывать недостатка
  rationale: Русский идиоматический оборот передаёт полную обеспеченность и обобщающую силу כֹּל.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: камни которой — железо
  rationale: Сохранён краткий и яркий именной образ еврейского текста, вероятно указывающий на железосодержащую породу.
- source_word: תַּחְצֹב
  choice: будешь добывать
  rationale: В контексте извлечения металла из гор «добывать» звучит естественно и охватывает значение высекания или разработки породы.
- source_word: נְחֹשֶׁת
  choice: медь
  rationale: Слово может обозначать медь или бронзу, но здесь речь идёт о природном материале, добываемом из гор, поэтому предпочтительна «медь».
