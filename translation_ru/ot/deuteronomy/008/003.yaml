  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: ru
  text: 'Он смирял тебя, заставлял тебя голодать и кормил тебя манной, которой не знали ни ты, ни твои отцы, чтобы дать тебе понять: не одним хлебом живёт человек[a], но всем, что исходит из уст Яхве[b], живёт человек.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Человек» здесь означает человека вообще, всё человечество, а не только мужчин.
    reason: cultural_note
  - marker: b
    text: Еврейское выражение шире, чем только «каждым словом», хотя Божье слово или повеление подразумевается контекстом.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Он смирял тебя
  rationale: Пиэль глагола ענה допускает значения «смирять» и «причинять страдание». В контексте испытания и наставления «смирял» передаёт целенаправленное уничижение, не сводя смысл только к физическому страданию.
- source_word: וַיַּרְעִבֶךָ
  choice: заставлял тебя голодать
  rationale: 'Каузативная форма прямо выражает действие Бога: Он приводил народ к состоянию голода. Несовершенный вид естественно вписывается в рассказ о продолжительном странствии.'
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: а потом кормил тебя манной
  rationale: «Кормил» естественно передаёт каузатив от אכל. «А потом» ясно обозначает последовательность голода и обеспечения, подразумеваемую контекстом; манна оформлена творительным падежом по нормам русского языка.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: которой не знал ни ты, ни твои отцы
  rationale: ידע здесь означает не просто интеллектуальное знание, а знакомство по опыту. Конструкция «ни… ни…» кратко и точно объединяет обе отрицательные части.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: Так Он давал тебе понять
  rationale: Передаёт целевое и педагогическое значение каузатива ידע естественным современным русским языком, сохраняя процесс наставления.
- source_word: הָאָדָם
  choice: человек
  rationale: Русское «человек» естественно имеет родовое значение и обозначает человечество вообще, не ограничиваясь мужчинами.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: не одним хлебом
  rationale: Устоявшееся и точное русское выражение сохраняет контраст исходного текста.
- source_word: כָּל מוֹצָא פִי יְהוָה
  choice: всем, что исходит из уст Яхве
  rationale: מוֹצָא буквально обозначает всё выходящее или исходящее. Эта формулировка сохраняет широту еврейского выражения и не сужает его без необходимости до «слова».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: живёт человек … живёт человек
  rationale: Повтор сказуемого и подлежащего сохранён ради риторического равновесия еврейской фразы.
theological_decisions:
- issue: Родовое значение הָאָדָם
  choice: человек
  alternative: люди; человечество
  rationale: «Человек» в русском языке естественно выражает представителя человеческого рода, сохраняет единственное число оригинала и межтекстовое звучание стиха без мужского ограничения.
- issue: Значение מוֹצָא פִי יְהוָה
  choice: всем, что исходит из уст Яхве
  alternative: каждым словом, исходящим из уст Яхве
  rationale: Еврейское מוֹצָא шире существительного «слово» и буквально означает то, что выходит или исходит. Более широкая передача сохраняет подлинную лексическую неоднозначность и одновременно допускает в контексте Божье повеление или изречение.
- issue: Божественное действие в голоде и обеспечении
  choice: заставлял тебя голодать, а потом кормил
  alternative: допускал, чтобы ты голодал, и питал
  rationale: Каузативная форма прямо приписывает Богу приведение Израиля к голоду; смягчение до простого допущения ослабило бы напряжение исходного текста. При этом последующее кормление показывает педагогическую цель происходящего.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены обращение к Израилю в единственном числе, родовое «человек», повтор заключительной конструкции и личное имя «Яхве». Видовая форма прошедшего времени передаёт протяжённость Божьего наставления в пустыне.
