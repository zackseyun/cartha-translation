  naturalness: Текст в целом современный и пригоден для публичного чтения. «Умножались числом» понятно, но несколько тяжеловесно; простое «умножились» естественно и точно в данном контексте. «Обещал вашим отцам под клятвой» передаёт формулу клятвенного обещания по-русски без неестественной эллиптической конструкции.
  terminology: «Яхве», «заповеди», «земля» и «вашим отцам» уместны. Следует сохранить мужской термин «отцам» и пояснить его референт в сноске. Сноска о собирательном единственном числе нужна и корректна.
