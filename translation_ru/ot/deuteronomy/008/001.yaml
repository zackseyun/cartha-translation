  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: ru
  text: Тщательно исполняйте все заповеди, которые я повелеваю вам сегодня,[a] чтобы вы жили, умножились, вошли и овладели землёй, которую Яхве обещал вашим отцам под клятвой.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всю заповедь». В еврейском употреблено собирательное единственное число.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «унаследовали». Еврейский глагол может означать как получение в наследие, так и вступление во владение.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское: «вашим отцам»; то есть праотцам Израиля.'
    reason: lexical_clarification
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: все заповеди
  rationale: Единственное число в еврейском представляет собирательное целое; естественное русское множественное число передаёт совокупность предписаний. Буквальная альтернатива отмечена в сноске.
- source_word: מְצַוְּךָ
  choice: которые я даю вам
  rationale: В контексте заповедей русское «даю» естественно передаёт действие повеления; местоимение «вам» сохраняет обращение к Израилю, хотя еврейская форма здесь формально единственного числа.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: тщательно исполняйте
  rationale: Сочетание «хранить, чтобы делать» обозначает внимательное соблюдение на деле. «Тщательно исполняйте» передаёт обе составляющие без неестественного буквализма.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Ясно и естественно обозначает цель или предполагаемый результат.
- source_word: תִּחְיוּן
  choice: вы жили
  rationale: Прямо передаёт значение жизни и сохранения жизни в контексте завета.
- source_word: וּרְבִיתֶם
  choice: умножались числом
  rationale: Добавление «числом» устраняет возможное впечатление математического действия и ясно передаёт увеличение народа.
- source_word: וּבָאתֶם
  choice: вошли
  rationale: Естественно описывает вступление в обещанную землю.
- source_word: וִירִשְׁתֶּם
  choice: овладели
  rationale: Глагол ירשׁ допускает значения наследования и вступления во владение; здесь «овладели» передаёт фактическое обладание землёй, а альтернативный оттенок сохранён в сноске.
- source_word: הָאָרֶץ
  choice: землёй
  rationale: Сохраняет характерное для Второзакония обозначение обещанной земли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: נִשְׁבַּע
  choice: поклялся отдать
  rationale: «Поклялся» сохраняет силу клятвы; «отдать» эксплицирует подразумеваемое содержание клятвы и делает русскую конструкцию естественной.
- source_word: לַאֲבֹתֵיכֶם
  choice: вашим отцам
  rationale: Сохраняет мужской термин исходного текста и его заветное обозначение праотцов Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Собирательное единственное число הַמִּצְוָה
  choice: все заповеди
  alternative: всю заповедь
  rationale: Множественное число естественно по-русски выражает совокупность повелений, тогда как сноска сохраняет формальную особенность и возможное понимание заповеди как единого целого.
- issue: Значение ירשׁ применительно к земле
  choice: овладели
  alternative: унаследовали
  rationale: Контекст допускает как получение обещанного наследия, так и фактическое вступление во владение; основной текст выбирает естественное контекстуальное значение, не устраняя альтернативу.
- issue: Референт אֲבֹתֵיכֶם
  choice: вашим отцам
  alternative: вашим предкам; вашим праотцам
  rationale: Сохраняется конкретный мужской термин исходного текста; сноска поясняет, что речь идёт о праотцах Израиля.
translation_notes:
  register: Современный литературный русский язык, понятный при публичном чтении. Тон наставительный и торжественный без архаизмов. Повелительное «исполняйте» естественно передаёт модально-повелительную силу еврейской формы; последовательность целей сохранена.
