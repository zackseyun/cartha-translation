reference: Deuteronomy 8:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: ru
  text: 'И помни весь путь, которым Яхве, твой Бог, вёл тебя по пустыне все эти сорок лет, чтобы смирить тебя, испытать тебя и узнать[a], что у тебя в сердце: будешь ли ты соблюдать Его заповеди или нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы обнаружить, что у тебя в сердце». Буквально: «чтобы узнать, что у тебя в сердце».'
    reason: Лексическая альтернатива поясняет возможное контекстуальное понимание, сохраняя в основном тексте буквальную формулировку.
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: И помни
  rationale: В наставительном контексте форма имеет побудительное значение. Русское «помни» естественно передаёт обращённое к Израилю повеление.
- source_word: כָּל הַדֶּרֶךְ
  choice: весь путь
  rationale: Сохраняет образ пути и одновременно охватывает весь пережитый Израилем путь по пустыне.
- source_word: הֹלִיכֲךָ
  choice: вёл тебя
  rationale: Естественно передаёт каузативную форму глагола הלך и выражает Божье водительство.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет обращение во втором лице и язык заветных отношений.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: все эти сорок лет
  rationale: Естественная русская конструкция для обозначения продолжительности всего названного периода.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: В сочетании с «вёл» русский язык естественно употребляет «по пустыне»; речь идёт о пустынной, необжитой местности странствий Израиля.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Ясно и естественно вводит цель последующих действий.
- source_word: עַנֹּתְךָ
  choice: смирить тебя
  rationale: В данном контексте означает привести к смирению посредством лишений и согласуется с ближайшим контекстом Втор 8:3.
- source_word: לְנַסֹּתְךָ
  choice: испытать тебя
  rationale: Передаёт проверку внутренней верности и готовности к послушанию.
- source_word: לָדַעַת
  choice: узнать
  rationale: Прямо передаёт ידע и не снимает антропоморфное богословское напряжение исходного текста.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: что у тебя в сердце
  rationale: Сохраняет библейский образ сердца как средоточия намерений, воли и мысли.
- source_word: הֲתִשְׁמֹר מצותיו אִם־לֹא
  choice: будешь ли ты соблюдать Его заповеди или нет
  rationale: Передаёт косвенный вопрос и практический смысл глагола שמר — верно исполнять и соблюдать заповеди.
theological_decisions:
- issue: Антропоморфное выражение «чтобы узнать, что у тебя в сердце»
  choice: Сохранить прямое «узнать»
  alternative: «чтобы обнаружить / показать, что у тебя в сердце»
  rationale: Еврейский текст буквально говорит «узнать». Перевод не должен незаметно устранять напряжение между этим выражением и учением о Божьем знании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис сделан естественным для обычного читателя, при этом сохранены образ пути, личное имя Яхве, повтор целей («смирить», «испытать», «узнать») и богословская неоднозначность глагола «узнать».
