base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: ru
  text: 'И если ты в самом деле забудешь[a] Яхве, твоего Бога, и пойдёшь за другими богами, будешь служить им и поклонишься им, то Я сегодня свидетельствую против вас: вы непременно погибнете.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «забывая, забудешь»; в еврейском это усилительная конструкция, выражающая несомненность действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: И если
  rationale: Естественно вводит условное предостережение и сохраняет связь с предыдущей речью без тяжеловесного буквального «и будет, если».
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: ты и вправду забудешь
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие; «и вправду» передаёт эмфазу, не уточняя её как полноту или окончательность забвения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное заветное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: своего Бога
  rationale: Возвратное притяжательное местоимение естественно по-русски передаёт форму второго лица единственного числа и сохраняет заветное отношение.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: и пойдёшь за
  rationale: Сохраняет образ следования и одновременно естественно выражает приверженность другим богам.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другими богами
  rationale: Прямо передаёт значение «другие», не добавляя толкования «чужеземные».
- source_word: וַעֲבַדְתָּם
  choice: станешь служить им
  rationale: Сохраняет основное значение עבד «служить» и отличает его от следующего действия поклонения.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: и поклоняться им
  rationale: Естественно передаёт почтительное или культовое простирание перед божествами, не повторяя глагол «служить».
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: сегодня я свидетельствую против вас
  rationale: Передаёт юридически окрашенное свидетельство-предостережение и враждебную направленность בכם; множественное «вас» сохраняет смену числа в еврейском тексте.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: вы непременно погибнете
  rationale: «Непременно» передаёт усиление конструкцией абсолютного инфинитива с личной формой; «погибнете» сохраняет результативно-непереходный смысл и множественное число оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Смена единственного числа на множественное в обращении
  choice: «ты… своего… пойдёшь…» с последующим «против вас… вы…»
  alternative: Унифицировать всё обращение в единственном или множественном числе
  rationale: Еврейский текст обращается к Израилю сначала как к одному лицу, а в заключительной угрозе переходит к множественному числу. Сохранение смены не устраняет риторическое напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Синтаксис сохраняет длинное условное предостережение оригинала; двоеточие ясно вводит содержание свидетельства. Намеренная смена обращения с единственного числа на множественное сохранена.
