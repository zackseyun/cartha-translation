  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: ru
  text: Одежда твоя не износилась на тебе[a], и нога твоя не распухла[b] за эти сорок лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одеяние твоё не износилось на тебе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нога твоя не опухла»; некоторые понимают этот глагол более конкретно — как указание на появление волдырей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: одежда твоя
  rationale: Существительное שִׂמְלָה обозначает одежду или отдельное, обычно верхнее, одеяние. Собирательное «одежда» естественно по-русски и сохраняет возможность понимать форму как общее обозначение одежды.
- source_word: בָלְתָה
  choice: не износилась
  rationale: Глагол בלה означает изнашиваться, ветшать. «Не износилась» точно и идиоматично передаёт смысл применительно к одежде.
- source_word: מֵעָלֶיךָ
  choice: на тебе
  rationale: Буквально выражение связано с положением «на/поверх тебя». Русское «на тебе» естественно указывает, что одежда не износилась во время ношения, не превращая предлог в идею снятия одежды.
- source_word: וְרַגְלְךָ
  choice: и нога твоя
  rationale: В еврейском тексте употреблено единственное число. Оно естественно и понятно по-русски, поэтому сохранено.
- source_word: בָצֵקָה
  choice: не распухла
  rationale: Редкий глагол в данном контексте традиционно понимается как опухание или распухание. «Не распухла» передаёт это значение без излишней медицинской конкретизации; возможное понимание как появления волдырей вынесено в примечание.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: за эти сорок лет
  rationale: Еврейское указательное זֶה входит в выражение длительности. «За эти сорок лет» сохраняет указательный оттенок и звучит естественно в современном русском языке.
