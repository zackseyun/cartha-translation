  text: וְ/זָֽכַרְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ כִּ֣י ה֗וּא הַ/נֹּתֵ֥ן לְ/ךָ֛ כֹּ֖חַ לַ/עֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת בְּרִית֛/וֹ אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: ru
  text: Но помни Яхве, твоего Бога, ведь именно он даёт тебе силу приобретать богатство[a], чтобы утвердить свой завет, который он клятвенно обещал твоим отцам[b], как это видно сегодня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «создавать богатство»; шире: «добиваться успеха».'
    reason: lexical_alternative
  - marker: b
    text: То есть праотцам, с которыми были связаны обещания завета.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «как в этот день» — устойчивый оборот со значением «как это очевидно теперь» или «как обстоит дело сегодня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Но помни
  rationale: Форма с союзом в наставительном контексте передаёт повеление; «но» отражает противопоставление самоуверенности, описанной в предыдущем стихе.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твоего Бога
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а форма с суффиксом — как «твоего Бога», с сохранением языка отношений завета.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: ведь именно он даёт тебе
  rationale: «Ведь» вводит основание повеления, а «именно он» сохраняет эмфатическое местоимение הוּא; причастие передано как постоянное, характерное действие.
- source_word: כֹּחַ לַעֲשׂוֹת חָיִל
  choice: силу приобретать богатство
  rationale: כֹּחַ обозначает силу или способность, а идиома לַעֲשׂוֹת חָיִל в контексте стиха 17 говорит прежде всего о приобретении материального достатка, хотя допускает более широкое значение успеха.
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: чтобы утвердить свой завет
  rationale: לְמַעַן выражает цель, а הָקִים применительно к завету означает утвердить, осуществить или подтвердить его в истории; «утвердить» не предполагает, что завет прежде не существовал.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: который он клятвенно обещал твоим отцам
  rationale: Естественная русская формулировка передаёт клятвенное обязательство Бога и сохраняет конкретное указание на отцов — праотцов завета.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это видно сегодня
  rationale: Устойчивое второзаконническое выражение указывает на нынешнее, наблюдаемое подтверждение сказанного; буквальный оборот разъяснён в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение חָיִל в данном контексте
  choice: богатство
  alternative: успех; достаток; благосостояние
  rationale: Предыдущий стих прямо говорит о приобретённом богатстве, поэтому экономический смысл здесь наиболее вероятен, но более широкий диапазон значения отмечен в сноске.
- issue: Значение הָקִים применительно к завету
  choice: утвердить
  alternative: подтвердить; осуществить; исполнить
  rationale: Глагол описывает действенное подтверждение и осуществление уже обещанного завета; перевод не сводит его смысл исключительно ни к учреждению, ни к простому повторному подтверждению.
- issue: Кого обозначает אֲבֹתֶיךָ
  choice: твоим отцам
  alternative: твоим предкам
  rationale: Мужское множественное число в данном контексте указывает прежде всего на праотцов, которым был клятвенно обещан завет; конкретность исходного выражения сохранена.
translation_notes:
  register: Современный литературный русский язык с ясным, но торжественным звучанием. Повелительное «помни» естественно передаёт силу наставления; эмфаза сохранена оборотом «именно он». Все местоименные обозначения Бога даны со строчной буквы как нейтральная современная редакционная норма, без изменения смысла.
