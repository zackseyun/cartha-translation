base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: ru
  text: 'И я увидел: вот, вы согрешили против Яхве, вашего Бога, — сделали себе литого тельца[a]. Вы быстро уклонились с пути, которым Яхве повелел вам идти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тельца, отлитого из металла». Еврейское выражение обозначает тельца, изготовленного литьём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 'И я увидел: вот'
  rationale: ראה передаётся своим обычным значением «увидел», а הִנֵּה — указательной частицей «вот», привлекающей внимание к обнаруженному. Двоеточие естественно выражает связь между наблюдением и его содержанием.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: вы согрешили против Яхве, вашего Бога
  rationale: Предлог ל при חטא здесь обозначает того, против кого совершён грех. Русское совершенное прошедшее естественно передаёт предшествующее действие без отдельной формы плюсквамперфекта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: сделали себе
  rationale: Дательный «себе» передаёт значение заинтересованного лица в конструкции עשה + ל и звучит естественно по-русски.
- source_word: עֵגֶל מַסֵּכָה
  choice: литого тельца
  rationale: מַסֵּכָה обозначает изделие, изготовленное литьём, особенно идола. «Литой телец» кратко сохраняет и образ, и способ изготовления.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: Вы быстро уклонились с пути
  rationale: «Уклонились с пути» сохраняет пространственную и нравственно-заветную метафору глагола סור; מַהֵר передано наречием «быстро».
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: по которому Яхве повелел вам идти
  rationale: В еврейском тексте буквально говорится о пути, который Яхве заповедал им; добавление «идти» по смыслу обусловлено метафорой пути и необходимо для естественного русского синтаксиса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер проступка Израиля
  choice: согрешили против Яхве, вашего Бога
  alternative: согрешили пред Яхве, вашим Богом
  rationale: Формулировка «против» ясно сохраняет направленность нарушения против Бога и не смягчает обвинение до простого совершения греха в его присутствии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Частица «вот» сохраняет торжественный повествовательный акцент, а синтаксис остаётся понятным обычному читателю.
