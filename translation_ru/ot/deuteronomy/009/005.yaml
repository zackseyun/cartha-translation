base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: ru
  text: 'Не за твою праведность и не за прямоту твоего сердца ты входишь, чтобы овладеть их землёй: Яхве, твой Бог, изгоняет перед тобой эти народы из-за их нечестия[a] и чтобы исполнить слово[b], данное Яхве твоим отцам[c] под клятвой, — Аврааму, Исааку и Иакову.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишает их владения перед тобой». Еврейский глагол может подчёркивать не только изгнание народов, но и утрату ими владения землёй.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обещание». Буквально: «слово»; в контексте клятвы это слово имеет силу обещания.'
    reason: lexical_alternative
  - marker: c
    text: 'Под «отцами» здесь подразумеваются названные далее праотцы Израиля: Авраам, Исаак и Иаков.'
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: за твою праведность
  rationale: 'Предлог בְּ в отрицательной конструкции передаёт причину: овладение землёй происходит не благодаря праведности Израиля.'
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: и не за прямоту твоего сердца
  rationale: «Прямота» сохраняет образное значение יֹשֶׁר и обозначает внутреннюю нравственную цельность; повтор отрицания делает русскую фразу ясной.
- source_word: בָא לָרֶשֶׁת אֶת־אַרְצָם
  choice: ты входишь, чтобы овладеть их землёй
  rationale: 'בוא указывает на вступление в землю, а инфинитив לרשת — на цель: принять её во владение.'
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: за нечестие этих народов
  rationale: רִשְׁעָה означает нравственную порочность и виновность; בְּ здесь, как и в первой части стиха, имеет причинное значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: изгоняет их перед тобой
  rationale: Каузативная форма ירשׁ обозначает устранение народов из их владения; основной текст естественно передаёт результат, а сноска отмечает оттенок лишения владения.
- source_word: וּלְמַעַן הָקִים
  choice: а также для того, чтобы исполнить
  rationale: לְמַעַן выражает цель, а הקים применительно к данному под клятвой слову означает утвердить или привести его в исполнение.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: слово, которое ... с клятвой дал
  rationale: «Слово» сохраняет широкое значение דָּבָר, тогда как оборот «с клятвой дал» естественно выражает клятвенное обязательство.
- source_word: לַאֲבֹתֶיךָ
  choice: твоим отцам
  rationale: Названные далее Авраам, Исаак и Иаков показывают, что речь конкретно о праотцах Израиля.
theological_decisions:
- issue: Основания овладения землёй
  choice: 'Сохранены оба названных основания: нечестие народов и верность Яхве слову, данному праотцам.'
  alternative: Сосредоточить смысл только на нечестии народов либо только на обетовании.
  rationale: Еврейский текст прямо соединяет причинную конструкцию כִּי и целевую конструкцию וּלְמַעַן; ни одна из них не должна поглощать другую.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя Бога; транслитерация сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены прямое обращение к Израилю в единственном числе, образ «прямоты сердца», личное имя Яхве и параллельность двух оснований Божьего действия.
