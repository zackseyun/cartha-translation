  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: ru
  text: Вспомни рабов Твоих — Авраама, Исаака и Иакова. Не обращай внимания[a] на упрямство[b] этого народа, на его нечестие и на его грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не поворачивайся к»; также возможно: «не смотри на», «не принимай во внимание».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «непреклонность», «жёсткость». Здесь употреблено не то выражение, которое в других местах буквально означает «жестоковыйность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Императив в ходатайственной молитве Моисея. «Вспомни» естественно передаёт призыв помнить о Божьих рабах и связанных с ними отношениях.
- source_word: לַעֲבָדֶיךָ
  choice: рабов Твоих
  rationale: עבד может означать раба или слугу. Здесь это почётное обозначение патриархов в их отношении к Богу; традиционное русское «рабы Твои» сохраняет силу исходного слова и уместно в возвышенной молитвенной речи.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Авраама, Исаака и Иакова
  rationale: Имена переданы в их общепринятой русской библейской форме; тире ясно обозначает приложение к словам «рабов Твоих».
- source_word: אַל תֵּפֶן אֶל
  choice: Не обращай внимания на
  rationale: Буквально выражение говорит о повороте к чему-либо, а в данном молитвенном контексте — о внимании и принятии во внимание. Русская формулировка передаёт контекстуальный смысл без чрезмерной буквальности.
- source_word: קְשִׁי
  choice: упрямство
  rationale: Существительное обозначает твёрдость, непреклонность, а в нравственном контексте — упрямство. Здесь не употреблена другая еврейская идиома «жестоковыйный», поэтому она не вносится в перевод.
- source_word: הָעָם הַזֶּה
  choice: этого народа
  rationale: עם означает «народ»; указательное местоимение сохранено.
- source_word: רִשְׁעוֹ
  choice: его нечестие
  rationale: רשע здесь обозначает нравственное зло, нечестие. Суффикс единственного числа согласован с собирательным существительным «народ», что естественно и по-русски.
- source_word: חַטָּאתוֹ
  choice: его грех
  rationale: חטאת передано конкретным и обычным словом «грех». Единственное число и местоименная отсылка к народу сохранены.
theological_decisions:
- issue: Передача עבד как обозначения патриархов
  choice: рабов Твоих
  alternative: слуг Твоих
  rationale: В молитвенном обращении это слово выражает принадлежность Богу и верное служение Ему. «Рабов Твоих» сохраняет более полный смысл исходного термина и остаётся понятной, достойной формой русской библейской речи, не утверждая здесь социально-правовой статус патриархов.
- issue: Просьба Бога не принимать во внимание грех народа
  choice: Не обращай внимания
  alternative: Не смотри на
  rationale: Перевод сохраняет ходатайственный характер слов Моисея и не уточняет сверх текста, каким именно образом Бог ответит на просьбу. Образ буквального поворота поясняется в сноске.
- issue: Единственное число суффиксов при собирательном «народ»
  choice: его нечестие и его грех
  alternative: их нечестие и их грех
  rationale: Еврейские суффиксы стоят в единственном числе и относятся к собирательному слову «народ». Русское согласование в единственном числе естественно и сохраняет грамматическую форму источника без изменения богословского смысла.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимение «Твоих» написано с прописной буквы по принятой русской традиции уважительного обращения к Богу. Повтор предлога «на» сохраняет трёхчастное перечисление: упрямство, нечестие и грех.'
