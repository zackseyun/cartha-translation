source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: ru
  text: 'И знай сегодня: Яхве, твой Бог, — Тот, кто переходит впереди тебя[a], всепожирающий огонь[b]. Он истребит их и покорит их перед тобой; ты лишишь их владений[c] и быстро погубишь их, как Яхве сказал тебе[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идёт впереди тебя». Еврейское причастие буквально изображает Яхве как переходящего впереди Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «огонь пожирающий» или «огонь поедающий».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «изгонишь их». Еврейский глагол может подчёркивать как лишение владения, так и изгнание прежних жителей.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «как Яхве говорил тебе». Речь идёт о ранее данном Израилю слове Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: И знай сегодня
  rationale: Союз וְ сохраняет связь с предыдущим контекстом, а форма יָדַעְתָּ здесь передаёт настойчивое побуждение или вывод. Формулировка естественна для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямо передаёт заветное обращение во втором лице единственного числа.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: Тот, кто переходит впереди тебя
  rationale: Причастие от עבר изображает Яхве переходящим впереди Израиля; «переходит» сохраняет связь с переходом в землю лучше, чем обобщённое «идёт».
- source_word: אֵשׁ אֹכְלָה
  choice: огонь пожирающий
  rationale: Сохраняет яркую метафору уничтожающего огня и её богословскую весомость; выражение понятно и уместно в возвышенной русской речи.
- source_word: יַשְׁמִידֵם
  choice: Он истребит их
  rationale: Порода хифиль глагола שׁמד выражает причинение гибели. «Истребит» передаёт силу глагола и позволяет отличить его от последующего אבד.
- source_word: יַכְנִיעֵם
  choice: покорит их
  rationale: В военном контексте хифиль כנע означает привести противника к подчинению или повергнуть его; «покорит» звучит естественно и не сводит смысл к внутреннему смирению.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Сохраняет пространственный и военный смысл устойчивого сочетания.
- source_word: וְהוֹרַשְׁתָּם
  choice: ты лишишь их владений
  rationale: Хифиль ירשׁ здесь обозначает лишение прежних жителей их земельного владения. Перевод сохраняет территориально-правовой оттенок, а не только идею физического изгнания.
- source_word: וְהַאֲבַדְתָּם
  choice: погубишь их
  rationale: Передаёт каузативное значение хифиля אבד и лексически отличается от ранее употреблённого שׁמד.
- source_word: מַהֵר
  choice: быстро
  rationale: Точно передаёт наречие образа действия, не превращая его в указание на неопределённо близкое будущее.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: как Яхве говорил тебе
  rationale: Сохраняет отсылку к предшествующему слову Яхве, не уточняя без необходимости, было ли оно обещанием, предсказанием или повелением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное заветное имя. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Образ אֵשׁ אֹכְלָה
  choice: огонь пожирающий
  alternative: огонь поедающий; огонь всепожирающий
  rationale: Метафора святого и уничтожающего Божьего присутствия сохранена без смягчения и без поясняющей богословской парафразы.
- issue: Соотношение Божьего и человеческого действия
  choice: Он истребит и покорит; ты лишишь владений и погубишь
  alternative: Свести всё действие либо только к Богу, либо только к Израилю
  rationale: 'Перевод сохраняет напряжение исходного текста: Яхве действует решающим образом, но Израилю также приписано последующее действие.'
- issue: Значение מַהֵר в контексте завоевания
  choice: быстро
  alternative: вскоре
  rationale: Сохранено прямое значение наречия и возможное напряжение с более длительным ходом завоевания; перевод не пытается заранее согласовать или переистолковать его.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность и параллелизм еврейского текста, но остаётся понятным обычному читателю. Метафора огня и сильная военная лексика намеренно не смягчены.
