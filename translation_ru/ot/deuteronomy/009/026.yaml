  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: ru
  text: 'И я помолился Яхве и сказал: «Господь Яхве, не погуби Твой народ и Твоё наследие, которых Ты искупил Своим величием, которых Ты вывел из Египта сильной рукой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучей рукой».'
    reason: Лексема חֲזָקָה допускает в данном устойчивом выражении как буквальное «сильной», так и более идиоматическое «могучей».
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל־יְהוָה וָאֹמַר
  choice: И я молился Яхве и говорил
  rationale: Последовательные формы с וַ передают развитие повествования. Русское «и» сохраняет связь с предыдущим контекстом, а несовершенный вид естественно вводит содержание молитвы.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: 'Сохраняются оба элемента составного обращения: титул אֲדֹנָי и личное имя יהוה. «Владыка» звучит естественно и торжественно, не создавая повтора «Господь Господь».'
- source_word: אַל־תַּשְׁחֵת
  choice: не погуби
  rationale: Запретительная форма выражает настоятельную просьбу. «Не погуби» точно передаёт שׁחת и уместно в молитвенной речи.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: Твой народ и Твоё наследие
  rationale: «Наследие» сохраняет образ народа как принадлежащего Яхве удела и не сводит נַחֲלָה к обычной собственности.
- source_word: אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ
  choice: которые Ты искупил Своим величием
  rationale: Пדה передано традиционным и контекстуально точным «искупил», а גֹּדֶל — прямым соответствием «величие», без подмены более узким понятием силы.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: и вывел из Египта
  rationale: הוציא в формуле исхода естественно передаётся глаголом «вывести». Союз «и» избегает тяжёлого повтора относительного оборота, сохраняя тот же референт.
- source_word: בְּיָד חֲזָקָה
  choice: сильной рукой
  rationale: Буквально сохраняется антропоморфный образ и основное значение חזק — «сильный».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в еврейском тексте, и отличает его от титула אֲדֹנָי.
- issue: Передача составного обращения אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог
  rationale: Выбранный вариант сохраняет и титул, и личное имя, не заменяя יהוה общим обозначением «Бог».
- issue: Образ Израиля как נַחֲלָה Яхве
  choice: Твоё наследие
  alternative: Твоё достояние
  rationale: «Наследие» удерживает заветный образ удела, не разъясняя сверх текста характер принадлежности народа Богу.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Личные местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской религиозно-литературной норме. Синтаксис слегка сглажен ради естественности, но ключевые заветные образы сохранены.
