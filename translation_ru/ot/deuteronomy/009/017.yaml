lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: я схватил
  rationale: Глагол תפשׂ обозначает решительное физическое действие — взять или ухватить. «Схватил» естественно передаёт это действие, не добавляя чрезмерной жестокости.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: обе скрижали
  rationale: Слово לֻחוֹת означает таблички, а в данном контексте — уже известные читателю скрижали завета. «Обе» естественно передаёт указание на две скрижали; материал в этом стихе прямо не назван.
- source_word: וָאַשְׁלִכֵם
  choice: бросил их
  rationale: Глагол שלך имеет обычное значение «бросать». Выбран современный и нейтральный русский эквивалент без архаичного оттенка.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: из обеих рук
  rationale: Выражение буквально указывает, что скрижали были брошены «с обеих моих рук». Формулировка сохраняет необычное подчёркивание обеих рук, присутствующее в еврейском тексте.
- source_word: וָאֲשַׁבְּרֵם
  choice: разбил
  rationale: Глагол שׁבר означает «ломать, разбивать». «Разбил» точно и естественно передаёт действие, не утверждая сверх текста, что скрижали непременно разлетелись на множество осколков.
- source_word: לְעֵינֵיכֶם
  choice: у вас на глазах
  rationale: Современная русская идиома ясно и выразительно передаёт буквальное «перед вашими глазами», то есть открыто, в присутствии народа.
