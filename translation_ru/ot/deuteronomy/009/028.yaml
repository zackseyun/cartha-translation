source:
  edition: WLC
  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: ru
  text: 'Иначе жители страны, из которой Ты вывел нас, скажут[a]: «Яхве не смог привести их в землю, о которой говорил им[b], и из ненависти к ним вывел их, чтобы умертвить в пустыне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «страна, из которой Ты вывел нас, скажет»; под страной подразумеваются её жители.'
    reason: cultural_note
  - marker: b
    text: 'По смыслу также возможно: «которую обещал им». Буквально: «о которой говорил им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Иначе
  rationale: Передаёт опасаемое следствие в контексте ходатайства Моисея естественным современным русским языком.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: жители страны, из которой Ты вывел нас
  rationale: Буквально субъектом является «страна», но здесь это метонимия, обозначающая её жителей; раскрытие метонимии необходимо для естественной русской речи, а буквальная форма отмечена в сноске.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: Яхве не смог
  rationale: Прямо передаёт обвинение в неспособности, которое, по словам Моисея, могли бы высказать египтяне; текст не утверждает его истинность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, стоящее в еврейском тексте.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: в землю, о которой говорил им
  rationale: Сохраняет буквальную и несколько открытую формулировку דִּבֶּר לָהֶם, не подменяя её более определённым «обещал»; в контексте речь идёт об обещанной земле.
- source_word: וּמִשִּׂנְאָתוֹ אוֹתָם
  choice: и из ненависти к ним
  rationale: Предлог מִן выражает причину или побуждение; русская формулировка сохраняет предполагаемый мотив, приписываемый Яхве чужими словами.
- source_word: הוֹצִיאָם לַהֲמִתָם
  choice: вывел их, чтобы умертвить
  rationale: Сохраняет повтор корня «выводить» и причинное значение породы hифиль у глагола מות.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и контекстуально точное обозначение местности странствования Израиля.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Значение אֲשֶׁר דִּבֶּר לָהֶם
  choice: о которой говорил им
  alternative: которую обещал им
  rationale: Буквальная передача сохраняет смысловую открытость еврейского выражения, тогда как контекст обещания земли остаётся понятен и поясняется сноской.
- issue: Обвинение в неспособности и ненависти
  choice: передано как прямая речь предполагаемых жителей страны
  alternative: смягчить формулировку, чтобы исключить её отнесение к Богу
  rationale: Это не утверждение повествователя, а опасаемая Моисеем клеветническая интерпретация исхода; структура прямой речи сохраняет богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Обращённое к Богу местоимение «Ты» написано с прописной буквы. Прямая речь оформлена русскими кавычками; формулировка остаётся сжатой и сохраняет обвинительный характер предполагаемых слов египтян.
