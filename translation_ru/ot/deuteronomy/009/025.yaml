  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: ru
  text: И я пал ниц перед Яхве на сорок дней и сорок ночей[a] — всё это время я лежал ниц, потому что Яхве сказал, что уничтожит вас.
