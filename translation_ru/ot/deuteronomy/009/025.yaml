    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: И я простёрся
  rationale: Форма хитпаэль глагола נפל здесь обозначает, что Моисей пал ниц перед Богом, ходатайствуя за народ. «Простёрся» естественно передаёт длительное пребывание ниц и сочетается с указанием срока.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии», а имя יהוה передано как «Яхве», без замены титулом.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: на сорок дней и сорок ночей
  rationale: Винительный падеж выражает длительность. Относительная конструкция с повторным הִתְנַפָּלְתִּי буквально вновь указывает на время простирания, но по-русски такое повторение тяжеловесно; длительность полностью выражена оборотом «на сорок дней и сорок ночей».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину ходатайственного простирания Моисея.
- source_word: אָמַר יְהוָה
  choice: Яхве сказал
  rationale: Еврейский перфект сообщает о предшествующем заявлении Яхве; порядок событий понятен из причинной связи, поэтому отдельная русская форма давнопрошедшего времени не требуется.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: что уничтожит вас
  rationale: Инфинитив השמיד после אמר передаёт заявленное намерение. «Уничтожит» сохраняет силу глагола, не усиливая его до «истребит без остатка».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Характер действия Моисея
  choice: простёрся перед Яхве
  alternative: пал перед Яхве
  rationale: Контекст и возвратная порода глагола допускают акцент на длительном лежании ниц в ходатайстве; перевод не добавляет прямо отсутствующее в стихе слово «молился».
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранено имя «Яхве» и причинная связь; синтаксически избыточное для русского языка повторение еврейского относительного оборота не воспроизведено.
