base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: ru
  text: Помни, не забывай, как ты разгневал Яхве, твоего Бога, в пустыне. С того дня, как ты вышел из земли Египетской, до вашего прихода на это место вы были непокорны Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с Яхве»; в данном контексте предлог имеет противительное значение: «против Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Помни, не забывай
  rationale: Сохранены оба повелительных элемента и их emphатическое сочетание; по-русски оно звучит естественно и торжественно.
- source_word: אֲשֶׁר הִקְצַפְתָּ
  choice: как ты прогневал
  rationale: Глагол в породе хифиль передаёт причинение гнева; «прогневал» сохраняет эту каузативность и подходит возвышенному библейскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Обычное и контекстуально точное русское обозначение пустынной, необжитой местности в повествовании об исходе.
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ מֵאֶרֶץ מִצְרַיִם
  choice: С того дня, когда ты вышел из земли Египетской
  rationale: Естественно передаёт начальную границу периода и сохраняет форму второго лица единственного числа.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: и до вашего прихода на это место
  rationale: Сохранён переход еврейского текста от единственного числа к множественному; отглагольная конструкция позволяет выразить его без неестественной фразы.
- source_word: מַמְרִים הֱיִיתֶם
  choice: вы восставали
  rationale: Передаёт продолжительное и повторяющееся неповиновение в течение указанного периода.
- source_word: עִם יְהוָה
  choice: против Яхве
  rationale: После глагола неповиновения предлог עִם имеет контекстуально враждебный смысл, который по-русски естественно выражается словом «против».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Характер неповиновения Израиля
  choice: вы восставали
  alternative: вы были непокорны
  rationale: Выбранная форма сохраняет деятельный и продолжительный характер מרה, не превращая его только в описание свойства.
- issue: Значение עִם при מרה
  choice: против Яхве
  alternative: с Яхве
  rationale: Буквальное «с» сохраняет формальную неоднозначность предлога, но в данном сочетании по-русски затемняет очевидное противительное отношение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён намеренный переход от обращения к отдельному слушателю («ты») к народу во множественном числе («вашего», «вы»).
