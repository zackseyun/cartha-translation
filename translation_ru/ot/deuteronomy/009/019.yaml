base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: ru
  text: Ибо я боялся того гнева и той ярости, которые Яхве обратил против вас, чтобы уничтожить вас. Но Яхве услышал меня[a] и в тот раз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте «услышал меня» подразумевает, что Яхве благосклонно ответил на просьбу Моисея.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: я боялся
  rationale: Форма глагола גור выражает страх или ужас; «я боялся» естественно звучит по-русски и сохраняет личный характер высказывания.
- source_word: מִפְּנֵי
  choice: гнева и ярости (как причины страха)
  rationale: Предлог в данном обороте указывает на причину страха; отдельное «из-за» в русском предложении не требуется при управлении глагола «бояться» родительным падежом.
- source_word: הָאַף וְהַחֵמָה
  choice: гнева и ярости
  rationale: Оба слова обозначают сильный гнев. Парное выражение передано двумя близкими существительными, чтобы сохранить накопление и напряжённость исходной формулировки.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: которыми Яхве воспылал против вас
  rationale: Глагол קצף обозначает сильный гнев. «Воспылал» передаёт его интенсивность и позволяет сохранить связь относительного оборота с двумя существительными; «против вас» соответствует עֲלֵיכֶם.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом «Господь».
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: чтобы уничтожить вас
  rationale: Инфинитив породы хифиль от שׁמד выражает целевую направленность на полное уничтожение; перевод сохраняет прямоту и силу текста.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Но Яхве услышал меня
  rationale: שׁמע с אֶל в контексте ходатайства означает не только физически услышать, но и благосклонно откликнуться. «Услышал меня» сохраняет исходный образ, а «но» естественно обозначает поворот от угрозы к благоприятному ответу.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: и в тот раз
  rationale: Оборот указывает ещё на один случай, когда Бог услышал Моисея. «И в тот раз» сохраняет добавочное значение גַּם и указание на конкретный прошлый случай.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Интенсивность Божьего гнева
  choice: гнева и ярости, которыми Яхве воспылал
  alternative: сильного гнева Яхве
  rationale: Исходный текст соединяет אַף, חֵמָה и קצף. Перевод сохраняет это намеренное нагнетание, не сводя три элемента к одному обобщающему выражению.
- issue: Смысл Божьего ответа на ходатайство Моисея
  choice: услышал меня
  alternative: внял мне
  rationale: «Услышал» формально соответствует שׁמע и сохраняет библейскую образность; контекстуальный смысл благоприятного ответа пояснён в сноске, а не внесён вместо исходного выражения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Намеренное накопление слов, обозначающих гнев, сохранено как особенность еврейского текста; архаические формы и конфессионально закреплённая замена личного имени титулом не использованы.
