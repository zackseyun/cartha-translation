  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: ru
  text: 'И сказал мне Яхве: «Встань, скорее спустись отсюда, потому что твой народ, который ты вывел из Египта, развратился. Они быстро уклонились от пути, который Я заповедал им, и сделали себе литое изваяние[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изваяние из расплавленного металла». Еврейское слово обозначает образ, изготовленный посредством литья металла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его заветный характер и отличая его от титула «Господь».
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Встань, скорее спустись отсюда
  rationale: Сохраняет последовательность повелений, направление движения и настоятельность речи; «скорее» естественно звучит в современном русском.
- source_word: שִׁחֵת
  choice: развратился
  rationale: Форма допускает понимание нравственного разложения или пагубного поведения; возвратный глагол кратко передаёт, что народ сам впал в порочность.
- source_word: עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: твой народ, который ты вывел из Египта
  rationale: Сохраняет обращённую к Моисею формулировку и её намеренно отчуждающий, обличительный оттенок.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Они быстро уклонились от пути
  rationale: Передаёт образ отклонения от предписанного пути и сохраняет повтор указания на быстроту.
- source_word: אֲשֶׁר צִוִּיתִם
  choice: который Я заповедал им
  rationale: Естественная русская передача необычного управления еврейского глагола в контексте заповеданного образа жизни.
- source_word: מַסֵּכָה
  choice: литое изваяние
  rationale: Называет и предмет, и способ его изготовления из расплавленного металла, не заменяя конкретное слово общим понятием «идол».
theological_decisions:
- issue: Риторическое отчуждение в словах «твой народ, который ты вывел из Египта»
  choice: Формулировка сохранена буквально по смыслу.
  alternative: «Мой народ, который Я вывел из Египта» или нейтральное «народ, вышедший из Египта»
  rationale: Текст намеренно вкладывает в уста Яхве обращение к Моисею с «твой» и «ты вывел»; сглаживание устранило бы напряжение обличения.
- issue: Характер проступка в שִׁחֵת
  choice: «развратился»
  alternative: «поступил растленно», «испортил себя», «погубил себя»
  rationale: Выбранный вариант сохраняет нравственно-религиозный смысл и возвратную направленность, не уточняя сверх текста, идёт ли речь прежде всего о внутренней порче, пагубном поступке или его последствиях.
- issue: Конкретность מַסֵּכָה
  choice: «литое изваяние»
  alternative: «идол», «литой идол»
  rationale: Перевод сохраняет указание на изготовленный литьём образ и не вводит более общее богословски нагруженное обозначение вместо конкретного термина.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Имя Яхве передано транслитерацией; синтаксис прямой и энергичный, повтор наречий быстроты сохранён.
