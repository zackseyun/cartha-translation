source:
  edition: WLC
  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: ru
  text: 'Не говори в своём сердце, когда Яхве, твой Бог, изгонит их от тебя: «За мою праведность Яхве ввёл меня, чтобы я овладел этой землёй». Напротив, Яхве изгоняет эти народы от тебя за их нечестие[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве лишает их владения землёй из-за их нечестия». Еврейский глагол связан с тем же корнем, что и «овладеть», и в данном контексте может означать как лишение владения, так и изгнание.'
    reason: Лексическая многозначность и словесная связь форм ירשׁ; основной текст использует естественное русское «изгоняет».
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: Не говори в своём сердце
  rationale: אַל с имперфектом выражает запрет. Оборот «в своём сердце» сохраняет еврейский образ внутренней речи и понятен современному читателю.
- source_word: בַּהֲדֹף יְהוָה אֱלֹהֶיךָ אֹתָם מִלְּפָנֶיךָ
  choice: когда Яхве, твой Бог, прогонит их перед тобой
  rationale: Инфинитивная конструкция с בְּ имеет временное значение; נדף означает гнать или оттеснять. «Перед тобой» сохраняет пространственный образ מִלְּפָנֶיךָ, не сводя его лишь к результату завоевания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, непосредственно представленное тетраграмматоном, а не заменяется титулом.
- source_word: בְּצִדְקָתִי
  choice: За мою праведность
  rationale: Предлог בְּ здесь указывает на мнимое основание дарования земли. «Праведность» сохраняет нравственно-богословскую весомость צְדָקָה и самоуверенное утверждение, которое Моисей запрещает.
- source_word: הֱבִיאַנִי יְהוָה
  choice: Яхве привёл меня
  rationale: Каузативная форма בוא означает «привёл» или «дал войти»; контекст вхождения в землю делает направление ясным без обязательного добавления «сюда».
- source_word: לָרֶשֶׁת
  choice: овладеть
  rationale: ירשׁ в данном контексте обозначает вступление во владение землёй. «Овладеть» точно и естественно передаёт цель вхождения.
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: Напротив, за нечестие этих народов
  rationale: Союз וְ противопоставляет истинную причину мнимой праведности Израиля. «Напротив» ясно выражает контраст, а «нечестие» передаёт нравственную виновность רִשְׁעָה.
- source_word: יְהוָה מוֹרִישָׁם מִפָּנֶיךָ
  choice: Яхве лишает их владения перед тобой
  rationale: 'Причастие מוֹרִישׁ обозначает происходящее действие лишения владения или изгнания. Формулировка сохраняет смысловую перекличку с לָרֶשֶׁת: Израиль овладевает землёй, а народы лишаются владения.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Мнимая заслуга Израиля
  choice: «За мою праведность»
  alternative: «Благодаря моей правоте»; «за мои добрые дела»
  rationale: 'Перевод сохраняет термин «праведность» и тем самым напряжение текста: Израилю запрещено считать землю наградой за собственную нравственную заслугу.'
- issue: Причина изгнания народов
  choice: «Напротив, за нечестие этих народов»
  alternative: «и за нечестие этих народов»
  rationale: 'Контраст заложен в логике еврейской фразы: не праведность Израиля, а нечестие народов названо причиной их лишения земли. При этом перевод не утверждает сверх сказанного, будто это единственная причина всего дарования земли.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Сохранены метафора сердца, личное имя Яхве, обращение во втором лице единственного числа и пространственный образ «перед тобой». Контраст передан явно, но причинное и богословское напряжение исходного текста не снято.
