revisions:
- from: 'Не говори в своём сердце, когда Яхве, твой Бог, прогонит их перед тобой: «За мою праведность Яхве привёл меня овладеть этой землёй». Напротив, за нечестие этих народов Яхве лишает их владения перед тобой[a].'
  to: 'Не говори в своём сердце, когда Яхве, твой Бог, изгонит их от тебя: «За мою праведность Яхве ввёл меня, чтобы я овладел этой землёй». Напротив, Яхве изгоняет эти народы от тебя за их нечестие[a].'
  rationale: Исправлены неестественные пространственные обороты и целевая конструкция при «ввёл меня». «Напротив» уместно передаёт контраст между отвергнутым притязанием на собственную праведность и названной причиной изгнания народов, не добавляя конфессионального толкования. Сноска сохранена, но привязана к слову «изгоняет» и сформулирована нормативно.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: запрет внутренне приписывать вступление во владение землёй собственной праведности и указание на нечестие народов сохранены. Однако «прогонит их перед тобой» и особенно «лишает их владения перед тобой» неестественны по-русски и неточно воспроизводят מִלְּפָנֶיךָ / מִפָּנֶיךָ как устранение народов «от тебя, с твоего пути».'
  naturalness: Нужна правка управления и синтаксиса. «Привёл меня овладеть» звучит неполно; «ввёл меня, чтобы я овладел» естественно передаёт целевую конструкцию. «Изгоняет их от тебя» — современная литературная и ясная передача контекстуального значения глагола.
  terminology: «Яхве», «праведность», «овладеть» и «нечестие» допустимы и соответствуют регистру. Следует сохранить различие, но также словесную связь между овладением землёй и изгнанием прежних жителей; это отражено в примечании как возможный вариант «лишает их владения».
  issues:
  - severity: medium
    issue: Неестественное «прогонит их перед тобой»
    rationale: Русское «прогнать перед кем-либо» может означать провести или прогнать кого-либо мимо этого человека, тогда как еврейский оборот означает устранение народов от лица Израиля.
  - severity: high
    issue: Неестественное и семантически неясное «лишает их владения перед тобой»
    rationale: Сочетание «лишать владения перед тобой» не является нормативным или ясным русским выражением. Причастие מוֹרִישׁ в данном контексте естественно передать «изгоняет», а вариант «лишает их владения» вынести в сноску.
  - severity: medium
    issue: Неудачная конструкция «привёл меня овладеть этой землёй»
    rationale: Русскому инфинитивному обороту не хватает ясной целевой связи. «Ввёл меня, чтобы я овладел этой землёй» точно передаёт каузативное «привёл меня [войти]» и цель ירשׁ.
