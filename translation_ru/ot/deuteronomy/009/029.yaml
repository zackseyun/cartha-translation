base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: ru
  text: Но[a] они — Твой народ и Твоё наследие; их Ты вывел Твоей великой силой и простёртой рукой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они — Твой народ и Твоё наследие». Еврейский союз может означать просто «и»; перевод «но» подчёркивает вероятное противопоставление в ходатайстве Моисея.'
    reason: lexical_alternative
  - marker: b
    text: «Простёртая рука» — устойчивый образ, связанный с исходом и обозначающий могущественное избавление, совершённое Господом.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: Но они
  rationale: 'Союз וְ может означать простое «и», однако в контексте ходатайства Моисея естественно передаёт противопоставление: несмотря на грех Израиля, это Божий народ и Его наследие.'
- source_word: עַמְּךָ
  choice: Твой народ
  rationale: עַם обозначает народ как общность; здесь выражение прямо указывает на особые отношения Израиля с Богом.
- source_word: וְנַחֲלָתֶךָ
  choice: и Твоё наследие
  rationale: נַחֲלָה означает наследие или полученное во владение достояние. «Наследие» сохраняет библейский образ принадлежности народа Богу.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: их Ты вывел
  rationale: Относительное предложение относится к народу как к людям. Конструкция с местоимением «их» по-русски ясна и естественна, а «вывел» точно передаёт характерное для повествования об исходе употребление каузативной формы יצא.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: Своей великой силой
  rationale: Инструментальный предлог בְּ передан творительным падежом; «великая сила» непосредственно отражает כֹּחַ и הַגָּדֹל.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: и простёртой рукой
  rationale: «Рука» естественно передаёт זְרוֹעַ в русском библейском образном языке, а «простёртая» сохраняет значение причастия נְטוּיָה и устойчивый образ могущественного избавления.
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: Сохранить выражение «простёртой рукой».
  alternative: 'Передать смысл отвлечённо: «могущественными деяниями».'
  rationale: В еврейском тексте намеренно употреблён телесный образ, характерный для языка исхода. Его сохранение передаёт литературную и богословскую силу текста, не утверждая буквальной телесности Бога.
- issue: Народ как Божье נַחֲלָה
  choice: Перевести как «Твоё наследие».
  alternative: «Твоё достояние» или «Твоя собственность».
  rationale: «Наследие» сохраняет многозначность термина и его смысл в обращённой к Богу мольбе Моисея, не сводя отношения Бога и народа только к владению.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественности молитвенного обращения. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому религиозному регистру. Точка с запятой помогает ясно связать утверждение о принадлежности народа Богу с напоминанием об исходе.
