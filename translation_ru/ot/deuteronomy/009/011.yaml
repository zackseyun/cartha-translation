source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: ru
  text: И по окончании сорока дней и сорока ночей Яхве дал мне две каменные скрижали — скрижали завета.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И
  rationale: Форма служит переходом в повествовании. В современном русском буквальное «и было» здесь звучало бы тяжеловесно; последовательность естественно передаётся союзом «и» вместе с обстоятельством времени.
- source_word: מִקֵּץ
  choice: по окончании
  rationale: Оборот указывает на момент завершения указанного периода; «по окончании» точно и естественно передаёт это значение.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: сорока дней и сорока ночей
  rationale: Сохранено прямое и привычное соответствие еврейскому выражению.
- source_word: נָתַן
  choice: дал
  rationale: Общеупотребительный глагол точно передаёт простое значение исходного слова, не добавляя оттенков вручения или доставки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֵלַי
  choice: мне
  rationale: Сочетание נתן с אֶל естественно передаётся по-русски конструкцией «дал мне».
- source_word: שְׁנֵי
  choice: две
  rationale: Числительное согласовано с русским существительным женского рода «скрижали»; определённость пары ясна из контекста.
- source_word: לֻחֹת הָאֲבָנִים
  choice: каменные скрижали
  rationale: «Скрижали» — понятное и закрепившееся в библейском контексте обозначение письменных каменных плит; определение «каменные» прямо передаёт материал.
- source_word: לֻחֹת הַבְּרִית
  choice: скрижали завета
  rationale: Повтор существительного сохранён как приложение, чтобы отразить структуру еврейского текста и явно обозначить связь скрижалей с заветом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. Форма «Яхве» передаёт тетраграмматон как имя, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Тире ясно оформляет пояснительное повторение «скрижали завета». Формальное «и было» не воспроизводится, поскольку וַיְהִי здесь выполняет прежде всего повествовательно-переходную функцию.
