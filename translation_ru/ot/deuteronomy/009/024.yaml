  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: ru
  text: Вы были непокорны Яхве[a] с того дня, как я узнал вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский предлог: «с Яхве»; в этом сочетании он выражает противление ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: непокорны
  rationale: Форма от מרה обозначает неповиновение и сопротивление власти. Предикативное «непокорны» естественно сочетается с הֱיִיתֶם и сохраняет смысл устойчивого противления Богу.
- source_word: הֱיִיתֶם
  choice: были
  rationale: Перфект 2-го лица множественного числа от היה в ретроспективном обобщении передан русским прошедшим временем; продолжительность состояния выражена оборотом «с того дня».
- source_word: עִם
  choice: 'Яхве (смысловое отношение: непокорны Яхве)'
  rationale: Предлог буквально означает «с», но при מרה описывает противление тому, кому не повинуются. В русском глагольно-именная конструкция «непокорны Яхве» передаёт это отношение естественно, без добавления «против».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: מִיּוֹם
  choice: с того дня
  rationale: Временной оборот указывает исходную точку продолжительного поведения Израиля.
- source_word: דַּעְתִּי אֶתְכֶם
  choice: как я узнал вас
  rationale: Прямо передаёт ידע с объектом во 2-м лице множественного числа. В контексте речь идёт о начале знакомства Моисея с народом, а не только об интеллектуальном знании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер непокорности Израиля
  choice: были непокорны
  alternative: восставали против
  rationale: «Непокорны» сохраняет широкое значение מרה — неповиновение и сопротивление — и не сужает его до открытого мятежа.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, но понятная. Порядок слов близок еврейскому акценту на постоянной непокорности.
