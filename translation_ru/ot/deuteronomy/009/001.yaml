source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: ru
  text: Слушай, Израиль! Сегодня ты переходишь Иордан, чтобы войти и вытеснить народы[a], которые больше и сильнее тебя, с большими городами, укреплёнными до небес[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступить во владение». Еврейский глагол может означать вступление во владение, а в контексте завоевания — вытеснение прежних жителей.'
    reason: lexical_alternative
  - marker: b
    text: «До небес» — образное выражение, означающее чрезвычайную высоту и мощь укреплений.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: Слушай
  rationale: Форма повелительного наклонения в единственном числе обращена к Израилю как к единому народу. «Слушай» естественно передаёт призыв к вниманию и сохраняет характерную для Второзакония формулу.
- source_word: עֹבֵר הַיּוֹם
  choice: Сегодня ты переходишь
  rationale: Причастие с הַיּוֹם обозначает настоящее или непосредственно предстоящее действие; начальная позиция «Сегодня» сохраняет временной акцент.
- source_word: אֶת־הַיַּרְדֵּן
  choice: Иордан
  rationale: Общепринятое русское название реки; добавлять слово «река» для ясности не требуется.
- source_word: לָבֹא
  choice: войти
  rationale: Инфинитив בוא после упоминания перехода через Иордан обозначает вступление в землю и естественно передаётся глаголом «войти».
- source_word: לָרֶשֶׁת
  choice: вытеснить
  rationale: В контексте завоевания ירשׁ может означать овладение землёй посредством лишения прежних жителей их владений. При прямом дополнении «народы» русское «вытеснить» передаёт этот смысл естественнее, чем буквальное «овладеть народами».
- source_word: גּוֹיִם
  choice: народы
  rationale: Обозначает отдельные этнополитические общности; «народы» — обычный и контекстуально точный русский эквивалент.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: которые больше и сильнее тебя
  rationale: Сохраняет прямое сравнение с Израилем и не сужает многозначное גָּדוֹל исключительно до численности.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: с большими городами, укреплёнными
  rationale: Предлог «с» ясно выражает связь городов с упомянутыми народами, а построение остаётся естественным для современного русского языка.
- source_word: בַּשָּׁמָיִם
  choice: до небес
  rationale: Сохраняет яркую гиперболу оригинала о чрезвычайной высоте и неприступности укреплений.
theological_decisions:
- issue: Смысл завоевательного глагола ירשׁ
  choice: «вытеснить народы» с указанием лексической альтернативы в сноске
  alternative: «овладеть землёй народов» / «вступить во владение»
  rationale: Контекст предполагает как овладение землёй, так и устранение прежних обладателей. Основной текст следует синтаксису, где объектом названы народы, а сноска сохраняет другую сторону значения глагола.
- issue: Гиперболическое описание городских укреплений
  choice: «укреплёнными до небес»
  alternative: «с чрезвычайно высокими укреплениями»
  rationale: Образ оригинала сохранён без превращения риторической гиперболы в буквальное географическое утверждение и без её ослабления пересказом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Единственное число в обращении и глагольных формах сохранено, поскольку Израиль представлен как единый народ. Образ «до небес» оставлен в тексте, а его гиперболический характер пояснён в сноске.
