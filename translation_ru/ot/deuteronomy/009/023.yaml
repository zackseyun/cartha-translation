  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: ru
  text: 'И когда Яхве послал вас из Кадеш-Барнеа и сказал: «Поднимитесь и овладейте землёй, которую Я дал вам», вы восстали против повеления Яхве, вашего Бога,[a] не поверили Ему[b] и не послушали Его голоса.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «против уст Яхве, вашего Бога»; это еврейский оборот со значением «против Его повеления» или «слова».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не доверились Ему».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не повиновались Его голосу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: И когда … послал
  rationale: Предлог ב при инфинитиве образует обстоятельство времени; конструкция «И когда … послал» естественно передаёт еврейский оборот.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: из Кадес-Барнеа
  rationale: Составной топоним передан принятой русской транслитерацией; предлог «из» соответствует исходному מִן.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Еврейская формула введения прямой речи передана естественным русским глаголом; субъект остаётся тем же.
- source_word: עֲלוּ
  choice: Поднимитесь
  rationale: Сохраняет пространственное значение עלה — движения вверх, в землю и горную область.
- source_word: וּרְשׁוּ
  choice: овладейте
  rationale: В контексте вступления в землю ירשׁ означает завладеть ею, вступить во владение; «овладейте» кратко и ясно передаёт этот смысл.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: которую Я дал вам
  rationale: Перфект изображает дар как уже установленный и несомненный; русское прошедшее время непосредственно передаёт форму без добавочного толкования.
- source_word: וַתַּמְרוּ
  choice: вы восстали
  rationale: מרה обозначает мятежное противление законной власти; «восстали против» соответствует сильному значению глагола.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: против повеления Яхве, вашего Бога
  rationale: Буквально «против уст Яхве» — идиома, обозначающая Его властное слово или повеление. Смысл передан понятно, а буквальная форма отмечена в сноске.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: не поверили Ему
  rationale: Hифиль глагола אמן с дополнением לוֹ допускает значения веры и доверия; «поверили Ему» сохраняет связь с Божьим обещанием, не исключая оттенка доверия.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: не послушали Его голоса
  rationale: Оборот שׁמע בקול объединяет слышание с повиновением. Выбранная формулировка сохраняет образ голоса и выражает неповиновение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Временной оттенок נָתַתִּי в обещании земли
  choice: которую Я дал вам
  alternative: которую Я даю вам
  rationale: Перфект представляет дар земли как состоявшийся и твёрдо установленный; перевод не развивает это в отдельную богословскую систему.
- issue: Соотношение веры и доверия в הֶאֱמַנְתֶּם לוֹ
  choice: не поверили Ему
  alternative: не доверились Ему
  rationale: Контекст включает как Божье слово, которому Израиль не поверил, так и личное доверие Богу. Основной текст сохраняет первое, а второе указано как допустимая смысловая грань.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя, при этом сохранены повтор имени Яхве, образ голоса и последовательность обвинений. Заглавные местоимения при обращении к Богу использованы в соответствии с распространённой русской библейской традицией.
