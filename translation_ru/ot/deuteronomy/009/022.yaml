base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: ru
  text: И в Тавере, и в Массе, и в Киврот-Гаттааве[a] вы снова и снова гневили Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Киврот-Гаттаава» буквально означает «могилы желания» или «могилы влечения».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְתַבְעֵרָה
  choice: и в Тавере
  rationale: Предлог בְּ обозначает место; топоним передан транслитерацией в форме, естественной для русского склонения.
- source_word: וּבְמַסָּה
  choice: и в Массе
  rationale: Союз и предлог сохранены, а название места передано транслитерацией.
- source_word: וּבְקִבְרֹת הַתַּאֲוָה
  choice: и в Киврот-Гаттааве
  rationale: Сочетание выступает как закреплённое название места, поэтому оно транслитерировано; буквальное значение приведено в сноске.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: вы продолжали вызывать гнев
  rationale: Сочетание היה с причастием выражает продолженное или повторявшееся действие в прошлом; такая передача также сохраняет каузативный смысл породы хифиль глагола קצף.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Имя יהוה передано как личное имя «Яхве»; показатель прямого дополнения אֶת отдельно не переводится.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно употреблено собственное имя Бога; транслитерация сохраняет различие между יהוה и титулом אֲדֹנָי.
- issue: Характер действий Израиля
  choice: продолжали вызывать гнев
  alternative: вызывали гнев
  rationale: Конструкция היה с причастием указывает на длительное или повторявшееся действие, не уточняя сверх текста ни мотив, ни степень вины.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной библейской интонации. Повтор союза «и» воспроизводит перечислительную структуру еврейского текста; топонимы не переводятся внутри стиха.
