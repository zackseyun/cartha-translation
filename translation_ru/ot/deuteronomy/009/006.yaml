  terminology: «Праведность», «земля», «овладел ею» и «упрямый народ» подходят современному литературному и библейскому регистру. «Упрямый» передаёт смысл קְשֵׁה־עֹרֶף, хотя не сохраняет образ шеи; в данном регистре это оправдано. Сноску следует сформулировать без смешения двух альтернатив («во владение» и «в наследие») в одних скобках.
