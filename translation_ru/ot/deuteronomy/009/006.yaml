  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: ru
  text: 'Итак, знай: не благодаря твоей праведности Господь, твой Бог, даёт тебе эту добрую землю, чтобы ты овладел ею[a], ведь ты — упрямый народ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ты получил её в наследие». Еврейский глагол может обозначать получение наследия, но во Второзаконии часто включает также смысл овладения землёй и вступления во владение ею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Итак, знай
  rationale: Форма совершенного вида с союзом в данном контексте имеет увещательный смысл и подводит итог предыдущему рассуждению; «итак» естественно передаёт выводную связь.
- source_word: לֹא בְצִדְקָתְךָ
  choice: не за твою праведность
  rationale: Предлог בְּ указывает на основание или причину. Формулировка отрицает, что нравственная правота Израиля служит основанием дара земли.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Господь, твой Бог
  rationale: Тетраграмматон передан принятой в русской библейской традиции формой «Господь», а местоименный суффикс сохранён как корпоративное обращение в единственном числе.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Причастие выражает совершающееся или близкое действие; настоящее время звучит естественно и сохраняет непосредственность обещанного дара.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: эту добрую землю
  rationale: Сохранены указательное слово и положительная оценка земли; «земля» соответствует контексту обетования.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы ты овладел ею
  rationale: Глагол ירשׁ во Второзаконии обозначает вступление во владение землёй и её обладание; «овладел» сохраняет деятельный оттенок лучше, чем одно лишь «получил в наследие».
- source_word: כִּי עַם קְשֵׁה עֹרֶף אָתָּה
  choice: ведь ты — народ упрямый
  rationale: Второе כִּי вводит обоснование. Идиома «жестоковыйный» буквально связана с негнущейся шеей, но в современном русском яснее передаётся словом «упрямый».
theological_decisions:
- issue: Основание получения земли
  choice: Прямо отрицать, что праведность Израиля является основанием Божьего дара.
  alternative: Свести высказывание к общему призыву к смирению.
  rationale: Еврейский текст противопоставляет предполагаемую праведность народа Божьему дару и упрямству самого народа; перевод сохраняет это напряжение, не развивая его в более широкую догматическую формулу.
- issue: Корпоративное обращение в единственном числе
  choice: Сохранить формы «твою», «твой», «тебе», «ты» при обозначении Израиля как народа.
  alternative: Перевести обращение формами множественного числа.
  rationale: Еврейский текст обращается к Израилю как к единому корпоративному адресату в мужском роде единственного числа.
- issue: Передача образа קְשֵׁה עֹרֶף
  choice: Передать смысл идиомы словом «упрямый».
  alternative: Сохранить традиционную метафору «жестоковыйный» или дать буквальное «с жёсткой шеей».
  rationale: «Упрямый» понятно современному читателю и точно выражает обвинение в упорном неповиновении; буквальная метафора в основном тексте звучала бы архаично или неестественно.
translation_notes:
  register: Современный литературный русский, ясный и достоинственный. Синтаксис сохраняет выводный характер начала и корпоративное обращение к Израилю. Архаичное «жестоковыйный» заменено понятным «упрямый», а возможный наследственный оттенок ירשׁ отмечен в сноске.
