  source_fidelity: 'Смысловой каркас передан верно: увещательное «знай», отрицание праведности Израиля как основания дара земли, настоящее/близкое действие «даёт», цель овладения землёй и объяснение через характеристику народа сохранены. «Господь, твой Бог» — допустимая русская библейская передача יהוה אֱלֹהֶיךָ. Однако сочетание «не за твою праведность» в современном русском неестественно для значения основания/причины.'
