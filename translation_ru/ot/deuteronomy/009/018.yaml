base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: ru
  text: И я пал ниц перед Яхве, как и прежде,[a] на сорок дней и сорок ночей; хлеба я не ел и воды не пил из-за всего вашего греха, который вы совершили, сделав зло в глазах Яхве и разгневив Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как в первый раз». Еврейское выражение отсылает к прежнему сорокадневному пребыванию Моисея перед Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: И я простёрся
  rationale: Возвратная форма נפל описывает, как Моисей поверг себя перед Богом в молитвенном заступничестве. «Простёрся» естественно и достойно передаёт телесную позу, не добавляя в текст прямого упоминания молитвы.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי обозначает положение или действие перед кем-либо, в его присутствии; личное имя יהוה передано как «Яхве».
- source_word: כָּרִאשֹׁנָה
  choice: как и прежде
  rationale: Выражение отсылает к прежнему сорокадневному пребыванию Моисея перед Яхве. Такой перевод сохраняет ретроспективную отсылку и естественно звучит по-русски.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: на сорок дней и сорок ночей
  rationale: Прямое обозначение продолжительности; предлог «на» естественно связывает его с глаголом «простёрся».
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: хлеба я не ел и воды не пил
  rationale: Сохранены явно названные в еврейском тексте «хлеб» и «вода», а также параллельное построение фраз.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: из-за всего вашего греха
  rationale: עַל здесь указывает на причину поступка Моисея; единственное число חטאת сохранено как собирательное «грех».
- source_word: אֲשֶׁר חֲטָאתֶם
  choice: который вы совершили
  rationale: Однокоренная конструкция буквально означает «грех, которым вы согрешили»; по-русски сочетание «грех, который вы совершили» передаёт её смысл без неестественного повтора.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: сделав зло в глазах Яхве
  rationale: Оборот сохраняет инфинитивное выражение содержания греха и библейскую метафору божественной оценки «в глазах».
- source_word: לְהַכְעִיסוֹ
  choice: и вызвав Его гнев
  rationale: Каузативная форма כעס означает вызвать гнев или раздражение. Деепричастная связь сохраняет возможный оттенок результата или цели, не сводя его жёстко только к одному из них.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — собственное заветное имя Бога. «Яхве» прямо передаёт это имя и соответствует предоставленному консультационному решению.
- issue: Связь לְהַכְעִיסוֹ с предшествующим действием
  choice: и вызвав Его гнев
  alternative: чтобы вызвать Его гнев; тем самым вызвав Его гнев
  rationale: Еврейский инфинитив допускает оттенки цели и результата. Формулировка с деепричастием сохраняет напряжение между ними и не утверждает однозначно, что народ сознательно ставил целью разгневать Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены телесный образ «простёрся», конкретные слова «хлеб» и «вода», собирательное единственное число «грех» и идиома «в глазах Яхве».
