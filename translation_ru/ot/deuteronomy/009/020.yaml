  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: ru
  text: И Яхве был очень разгневан на Аарона, с тем чтобы уничтожить его; и в то время я также молился за Аарона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: И на Аарона
  rationale: При глаголе гнева предлог בְ естественно передаётся по-русски конструкцией «гневаться на кого-либо»; союз связывает эту фразу с предыдущим повествованием.
- source_word: הִתְאַנַּף יְהוָה מְאֹד
  choice: Яхве разгневался так сильно
  rationale: Форма глагола выражает сильный гнев, а מְאֹד усиливает его. Оборот «так сильно» естественно подводит к следующему указанию на возможное уничтожение Аарона.
- source_word: לְהַשְׁמִידוֹ
  choice: что хотел уничтожить его
  rationale: Инфинитив с לְ указывает здесь на направленность гнева к уничтожению Аарона. Такая формулировка передаёт смысл естественно по-русски, не уточняя способ уничтожения.
- source_word: וָאֶתְפַּלֵּל
  choice: но ... я молился
  rationale: Глагол означает «молиться». В русском контексте противительный союз «но» ясно передаёт смысловое противопоставление угрозе уничтожения, хотя еврейский союз сам по себе шире по значению.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: и за Аарона
  rationale: בְּעַד в контексте молитвы означает «за, в защиту, ради», а גַּם показывает, что Моисей молился также за Аарона, помимо народа.
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Устойчивое и естественное соответствие еврейскому временному выражению, отсылающему к описываемым событиям.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано распространённой научно обоснованной русской транслитерацией «Яхве», а не заменено титулом.
- issue: Направленность гнева и угроза уничтожения Аарона
  choice: разгневался так сильно, что хотел уничтожить его
  alternative: весьма разгневался на Аарона, чтобы уничтожить его
  rationale: Русская конструкция передаёт связь между крайним гневом и возможным уничтожением, не утверждая, что уничтожение действительно произошло. Она сохраняет напряжение между Божьим гневом и последующей молитвой Моисея.
translation_notes:
  register: Современный литературный русский язык; изложение прямое, торжественное без архаизмов. Порядок слов подчёркивает Аарона как дополнительный объект Божьего гнева и ходатайственной молитвы Моисея.
