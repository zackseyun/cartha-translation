  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: ru
  text: Оставь Меня[a], и Я уничтожу их и сотру их имя из-под неба[b], а из тебя сделаю народ сильнее и многочисленнее их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дай Мне уничтожить их и стереть их имя из-под неба».'
    reason: 'Лексико-синтаксический вариант: следующие за повелением глаголы можно понимать как выражение цели, а не только как последовательное обещание действия.'
  - marker: b
    text: 'Буквально: «из-под небес»; выражение означает полное удаление с земли — прекращение существования народа и памяти о нём.'
    reason: Сохранение сведения о форме оригинала и пояснение древнееврейской идиомы.
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Оставь Меня
  rationale: Повелительная форма רפה с מן означает «отступись, перестань, оставь в покое». «Оставь Меня» кратко и естественно передаёт идиому, не добавляя прямого упоминания о том, что Моисей удерживает Бога своим заступничеством.
- source_word: וְאַשְׁמִידֵם
  choice: и Я уничтожу их
  rationale: שׁמד обозначает полное уничтожение. Союз ו после повеления допускает последовательное или целевое понимание; основное чтение сохраняет простую координацию, а целевой оттенок отражён в примечании [a].
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: и сотру их имя
  rationale: Метафора מחה означает стирание имени, то есть устранение существования и памяти о народе. Русское «сотру их имя» сохраняет образ исходного текста.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: из-под неба
  rationale: Хотя שׁמים имеет форму множественного числа, по-русски устойчиво и естественно выражение «из-под неба». Формальная особенность еврейского текста отмечена в сноске.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: а из тебя сделаю народ
  rationale: Конструкция עשה + дополнение + ל выражает превращение или создание кого-либо в новом качестве. «Из тебя сделаю народ» сохраняет обращение лично к Моисею и обещание возникновения от него нового народа, не разворачивая подразумеваемую генеалогию.
- source_word: עָצוּם וָרָב מִמֶּנּוּ
  choice: сильнее и многочисленнее их
  rationale: עָצוּם передаёт силу или могущество, а רַב здесь — многочисленность. Суффикс единственного числа относится к Израилю как к единому народу; русское «их» естественно соотносится с ранее упомянутыми людьми и сохраняет коллективный смысл сравнения.
theological_decisions:
- issue: Божье объявление суда и обещание произвести от Моисея более сильный народ
  choice: Передать слова как прямое и реальное заявление внутри повествования, не смягчая угрозу и не объясняя её как испытание Моисея.
  alternative: Сигнализировать в переводе, что это лишь риторическое высказывание или испытание Моисея.
  rationale: Еврейский текст прямо излагает Божьи слова об уничтожении и новом народе. Перевод должен сохранять богословское напряжение повествования, не разрешая спор о цели этого заявления.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Сильные глаголы «уничтожу» и «сотру» сохраняют суровость исходного текста; синтаксис остаётся ясным для обычного читателя.
