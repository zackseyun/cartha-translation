base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: ru
  text: 'И сказал мне Яхве: «Я видел этот народ, и вот, это упрямый народ[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с жёсткой шеей», то есть упорно не желающий подчиняться.'
    reason: Сохраняет образ древнееврейской идиомы קְשֵׁה עֹרֶף и поясняет её значение современному читателю.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав-последовательный продвигает повествование; русское «и сказал» естественно сохраняет связь и последовательность событий.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֵלַי לֵאמֹר
  choice: мне
  rationale: Формульное לֵאמֹר после глагола речи по-русски избыточно; начало прямой речи передаёт его функцию без тяжеловесного «говоря».
- source_word: רָאִיתִי
  choice: Я видел
  rationale: Перфект обозначает состоявшееся наблюдение, на котором основана данная оценка; «видел» естественно и не сужает аспектуальную возможность до русского результативного «увидел».
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняет собирательное единственное число и непосредственный указательный смысл.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет эмфатическую функцию привлечения внимания и при этом звучит естественно в современном литературном русском.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: народ упрямый
  rationale: Передаёт идиоматический смысл характеристики; буквальный образ жёсткой шеи сохранён в сноске.
- source_word: הוּא
  choice: это народ
  rationale: Русская конструкция с «это» естественно передаёт именную характеристику коллективного существительного в единственном числе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Метафора קְשֵׁה עֹרֶף
  choice: упрямый
  alternative: жестоковыйный; с жёсткой шеей
  rationale: Основной текст должен быть понятен современному читателю; смысл непокорности передан прямо, а конкретный древнееврейский образ указан в сноске без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизмов. Повтор слова «народ» сохранён. Формульное לֵאמֹר не воспроизведено отдельным словом, поскольку двоеточие и прямая речь естественно выполняют ту же функцию.
