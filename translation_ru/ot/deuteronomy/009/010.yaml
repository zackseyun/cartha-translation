  verdict: revise
  source_fidelity: В еврейском тексте стоит דִּבֶּר ... עִמָּכֶם — «говорил с вами»; выбор «говорил вам» контекстуально возможен, но устраняет выраженное предлогом עִם значение совместного общения. Кроме того, перфект דִּבֶּר относится к завершённому событию у горы; русское «сказал» точнее передаёт это в данном перечислении.
  naturalness: '«Две каменные скрижали» и «написанные пальцем Бога» естественны в современном литературном русском с умеренно библейским регистром. «Все слова, которые Яхве сказал с вами» было бы неестественно, поэтому при сохранении עִם следует «сказал, обращаясь к вам» либо «говорил с вами». В данном стихе наиболее гладко: «которые Яхве сказал вам», с примечанием о буквальном «с вами»; однако это оставляет источник только в примечании. Безопаснее сохранить «говорил с вами» и уточнить завершённость контекстом всего высказывания.'
  terminology: «Яхве», «скрижали», «палец Бога» и «собрание» переданы последовательно и без конфессионального истолкования. Сноска к עִם уместна при выбранном сглаженном варианте, но после восстановления прямого соответствия «с вами» не нужна.
