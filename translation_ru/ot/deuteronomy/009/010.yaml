source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: ru
  text: И Яхве дал мне две каменные скрижали, написанные пальцем Бога, и на них были все слова, которые Яхве сказал вам[a] на горе из среды огня в день собрания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил с вами».'
    reason: Еврейский предлог עִם обычно означает «с»; в данном контексте русское «сказал вам» естественно передаёт обращённую к народу речь, а примечание сохраняет лексическую особенность оригинала.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: וַיִּתֵּן
  choice: дал
  rationale: Прямое и естественное соответствие глаголу נתן в данном контексте.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: две каменные скрижали
  rationale: «Скрижали» точно обозначает предназначенные для письма плиты и сохраняет узнаваемую библейскую лексику, оставаясь понятным в современном русском языке.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: написанные пальцем Бога
  rationale: Сохраняет пассивное значение כְּתֻבִים и конкретный антропоморфный образ אֶצְבַּע, не заменяя его истолкованием вроде «силой Бога».
- source_word: וַעֲלֵיהֶם כְּכָל הַדְּבָרִים
  choice: и на них были все слова
  rationale: В еврейской безглагольной конструкции по-русски естественно восполняется связка «были»; כְּכָל в контексте указывает на полноту и соответствие содержания.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: которые Яхве говорил вам
  rationale: Русское «говорил вам» естественно передаёт направленную к народу речь; буквальное значение предлога עִם — «с вами» — отмечено в сноске.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из среды огня
  rationale: Сохраняет пространственную выразительность сочетания מִתּוֹךְ, не сокращая его до простого «из огня».
- source_word: בְּיוֹם הַקָּהָל
  choice: в день собрания
  rationale: קָהָל обозначает собранную общину Израиля; краткое выражение сохраняет формальный и общественный смысл исходного текста.
theological_decisions:
- issue: Антропоморфное описание действия Бога
  choice: написанные пальцем Бога
  alternative: написанные силой самого Бога
  rationale: Исходный текст прямо говорит о «пальце Бога». Конкретный образ сохранён без рационализирующего истолкования.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст употребляет собственное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Направленность речи в выражении דִּבֶּר ... עִמָּכֶם
  choice: говорил вам
  alternative: говорил с вами
  rationale: Контекст описывает обращение Яхве к народу, поэтому «вам» естественнее по-русски; вместе с тем буквальная конструкция с עִם допускает «с вами», что сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слово «скрижали» сохранено как точное и общеупотребительное в библейском контексте; более архаичное «перстом Божьим» заменено прозрачным выражением «пальцем Бога».
