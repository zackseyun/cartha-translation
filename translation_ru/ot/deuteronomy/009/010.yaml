  - severity: low
    issue: Вид глагола «говорил» в пересказе разового события
    rationale: Еврейский перфект דִּבֶּר указывает на состоявшееся говорение. Русское «говорил» допустимо, но «сказал» яснее маркирует завершённое событие и естественно сочетается с «все слова».
