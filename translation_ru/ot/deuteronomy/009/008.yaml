base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: ru
  text: Даже у Хорива[a] вы вызвали гнев Яхве, и Яхве разгневался на вас, чтобы уничтожить вас.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И у Хорива» или просто «У Хорива». Еврейский союз может лишь продолжать повествование, хотя здесь, вероятно, имеет усилительное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «Яхве разгневался на вас так, что хотел уничтожить вас». Еврейская конструкция непосредственно связывает гнев Яхве с угрозой уничтожения; она может выражать цель или результат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Даже у Хорива
  rationale: Союз ו продолжает перечисление, но в данном контексте, вероятно, также придаёт словам усилительный оттенок. «Даже у Хорива» естественно передаёт это усиление, не устраняя более нейтральной возможности.
- source_word: הִקְצַפְתֶּם
  choice: вы вызвали гнев
  rationale: 'Порода hифиль глагола קצף имеет каузативное значение: народ стал причиной гнева Яхве. Выражение «вызвали гнев» передаёт эту причинность и сохраняет серьёзность обвинения.'
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве»; показатель прямого дополнения אֶת отдельно не переводится.
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  choice: Яхве разгневался на вас
  rationale: Глагол אנף обозначает сильный гнев, а בָּכֶם при глаголе гнева естественно передаётся по-русски сочетанием «на вас».
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: так, что мог уничтожить вас
  rationale: Инфинитив hифиль от שׁמד указывает на уничтожение и непосредственно связывает его с гневом Яхве. Оборот «так, что мог» передаёт грозивший исход, не утверждая, что уничтожение действительно произошло.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте дважды прямо употреблён тетраграмматон; транслитерация сохраняет личное имя Бога завета.
- issue: Связь гнева Яхве с возможным уничтожением народа
  choice: разгневался на вас так, что мог уничтожить вас
  alternative: разгневался на вас, чтобы уничтожить вас
  rationale: Еврейский инфинитив с לְ допускает оттенок цели или результата. Основной текст естественно выражает непосредственную угрозу уничтожения, а примечание сохраняет более формальное целевое прочтение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общедоступным звучанием. Сохранено традиционное географическое сочетание «у Хорива», а личное имя Яхве передано без конфессионально окрашенной замены.
