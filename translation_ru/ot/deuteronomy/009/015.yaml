  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: ru
  text: И я повернулся и сошёл с горы; гора пылала огнём[a], и в обеих моих руках были две скрижали завета[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский союз можно передать и более буквально: «и гора пылала огнём». В контексте эта фраза может также описывать обстоятельство, сопровождавшее спуск: «когда гора пылала огнём».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «на обеих моих руках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: И я повернулся
  rationale: Форма wayyiqtol обозначает следующее действие в повествовательной последовательности. «Повернулся» прямо передаёт פנה, а начальное «и» сохраняет связь с предыдущим рассказом.
- source_word: וָאֵרֵד מִן הָהָר
  choice: и сошёл с горы
  rationale: ירד означает движение вниз; в данном контексте естественное русское выражение — «сошёл с горы».
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: гора пылала огнём
  rationale: Причастие בֹּעֵר выражает продолжающееся горение, а בָּאֵשׁ прямо упоминает огонь. «Пылала огнём» естественно и выразительно сохраняет оба элемента.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: а две скрижали завета
  rationale: В библейском контексте לֻחֹת — каменные скрижали, а הַבְּרִית означает «завет». Союз «а» естественно вводит сопутствующую деталь, не создавая противопоставления по смыслу.
- source_word: עַל שְׁתֵּי יָדָי
  choice: были у меня в обеих руках
  rationale: Буквально עַל означает «на», однако здесь речь о том, что Моисей нёс скрижали. «В обеих руках» передаёт этот смысл естественно и сохраняет указание на две руки.
