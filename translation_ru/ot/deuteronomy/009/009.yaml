  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: ru
  text: Когда я взошёл на гору, чтобы получить каменные скрижали[a] — скрижали завета, который Яхве заключил с вами[b], — я оставался на горе сорок дней и сорок ночей. Я не ел хлеба и не пил воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взять каменные скрижали»; здесь «получить» передаёт смысл: Моисей поднялся за скрижалями, которые ему предстояло принять от Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отсек завет с вами». Это древнееврейское устойчивое выражение означает «заключил с вами завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי
  choice: Когда я взошёл
  rationale: Сочетание ב с инфинитивом עָלָה и суффиксом первого лица имеет временное значение. «Когда я взошёл» естественно передаёт и временную связь, и движение вверх.
- source_word: הָהָרָה
  choice: на гору
  rationale: Направительный суффикс ה указывает на движение к определённой горе; в контексте речь идёт о Синае/Хориве.
- source_word: לָקַחַת
  choice: чтобы получить
  rationale: Основное значение глагола — «взять», но здесь Моисей поднимается за скрижалями, которые ему даст Бог; «получить» естественно выражает смысл контекста, а буквальный вариант отмечен в сноске.
- source_word: לוּחֹת הָאֲבָנִים
  choice: каменные скрижали
  rationale: Форма с конструктивным сочетанием буквально означает «скрижали из камня». Традиционное и понятное русское «каменные скрижали» точно передаёт предмет и материал.
- source_word: לוּחֹת הַבְּרִית
  choice: скрижали завета
  rationale: Повтор сохранён как приложение, поясняющее, что каменные скрижали являются скрижалями завета.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: который Яхве заключил с вами
  rationale: Выражение כָּרַת בְּרִית, буквально «разрезать завет», является устойчивой древнееврейской идиомой со значением «заключить завет».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: וָאֵשֵׁב
  choice: я оставался
  rationale: Глагол יָשַׁב может означать «сидеть», «жить», «оставаться». Указание на длительность пребывания делает «оставался» наиболее уместным.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: сорок дней и сорок ночей
  rationale: Прямо и естественно передаёт стандартное древнееврейское обозначение длительности.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: Я не ел хлеба и не пил воды
  rationale: Сохранены конкретные существительные «хлеб» и «вода», а также параллельное построение двух отрицательных высказываний.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» передаёт его принятую научную реконструкцию и не подменяет имя титулом.
- issue: Характер связи завета со скрижалями
  choice: «скрижали завета, который Яхве заключил с вами»
  alternative: «скрижали завета Яхве с вами»
  rationale: 'Относительное предложение сохранено по структуре еврейского текста: Яхве является действующим лицом при заключении завета, а адресат — весь Израиль.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Традиционное слово «скрижали» сохранено как общеизвестное и точное обозначение каменных табличек; синтаксис разбит на два предложения ради ясности, без утраты смысловых связей оригинала.
