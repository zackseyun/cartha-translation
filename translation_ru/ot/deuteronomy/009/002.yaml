  text: עַֽם גָּד֥וֹל וָ/רָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֨עְתָּ֙ וְ/אַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִ/פְנֵ֖י בְּנֵ֥י עֲנָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: ru
  text: 'народ многочисленный и высокий ростом — сыны Анака[a], которых ты знаешь и о которых слышал: «Кто устоит перед сынами Анака?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «анакимы». Буквально: «сыны Анака».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: народ
  rationale: עַם обозначает народ или этническую группу; «народ» естественно и точно передаёт собирательное значение.
- source_word: גָּדוֹל
  choice: многочисленный
  rationale: В описании народа גָּדוֹל может указывать на его величину или многочисленность. «Многочисленный» естественнее по-русски сочетается с «народ» и не смешивает это качество с последующим указанием на высокий рост.
- source_word: וָרָם
  choice: высокий ростом
  rationale: В данном контексте רָם характеризует физическую высоту людей; выражение «высокий ростом» ясно передаёт этот смысл и избегает значения общественного возвышения.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: сыны Анака
  rationale: Сохранено буквальное родственное выражение «сыны Анака», связывающее группу с именем предка; современная форма «сыновья Анака» возможна, но менее привычна для устойчивого этнического обозначения в библейском контексте.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: которых ты знаешь
  rationale: Прямая и естественная передача совершенного глагола, обозначающего уже известный Израилю народ.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: и о которых слышал
  rationale: Дополнение «о которых» естественно связывает фразу с предшествующим упоминанием народа и вводит известное изречение.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Кто устоит перед
  rationale: Идиома выражает способность выдержать противостояние; «устоит перед» сохраняет образ стояния и риторическую силу вопроса.
