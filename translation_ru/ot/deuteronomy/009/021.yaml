base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: ru
  text: А ваш грех — сделанного вами тельца — я взял, сжёг в огне, разбил и тщательно растёр, пока он не превратился в мелкую пыль. Потом я бросил эту пыль в поток[a], стекающий с горы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ручей»; еврейское слово может обозначать поток, русло временного потока или водоток в ущелье.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: ваш грех
  rationale: Сохраняет резкое отождествление идола с грехом Израиля; значение «жертва за грех» контексту не соответствует.
- source_word: הָעֵגֶל
  choice: тельца
  rationale: Обычное значение слова и ясная отсылка к золотому тельцу.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: сжёг в огне
  rationale: Естественно передаёт еврейское выражение и сохраняет конкретное упоминание огня.
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: разбил и тщательно растёр
  rationale: Передаёт последовательность дробления и измельчения, а также усилительное הֵיטֵב.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: пока он не превратился в мелкую пыль
  rationale: Естественно выражает предельную степень измельчения, указанную в исходном тексте.
- source_word: עֲפָרוֹ
  choice: эту пыль
  rationale: Относится к измельчённым остаткам тельца и поддерживает лексическую связь с предыдущей фразой.
- source_word: הַנַּחַל
  choice: поток
  rationale: Широкий и понятный русский эквивалент для водотока; возможны также «ручей» и сезонный поток в русле.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: стекающий с горы
  rationale: Передаёт причастную форму и движение воды вниз от горы.
theological_decisions:
- issue: Отождествление тельца с грехом Израиля
  choice: «ваш грех — тельца, которого вы сделали»
  alternative: «сделанную вами греховную вещь — тельца»
  rationale: Аппозиция исходного текста прямо называет тельца грехом народа; перевод сохраняет эту богословски весомую резкость, не смягчая её толкованием.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и торжественно без архаизмов. Тире подчёркивают приложение «тельца» к выражению «ваш грех», сохраняя структуру и смысловую напряжённость еврейского текста.
