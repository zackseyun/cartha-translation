base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: ru
  text: В то время мы овладели этой землёй, простиравшейся от Ароэра, расположенного у долины Арнона[a], и включавшей половину горной области Галаада с её городами[b]. Я отдал её племенам Рувима и Гада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у русла Арнона». Еврейское נחל может обозначать вади, ущелье, русло сезонного потока или долину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «половину горы Галаад». В территориальных описаниях еврейское הַר может обозначать целую горную область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: мы овладели
  rationale: В контексте завоевания и раздела земли глагол ירשׁ обозначает активное вступление во владение, а не пассивное наследование.
- source_word: הָאָרֶץ הַזֹּאת
  choice: этой землёй
  rationale: «Земля» естественно обозначает здесь завоёванную территорию.
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Прямой и естественный перевод устойчивого указания времени.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: от Ароэра, что у долины Арнона
  rationale: Сохранены топоним и относительная конструкция; предлог עַל в данном географическом контексте передан нейтральным «у».
- source_word: נַחַל
  choice: долина
  rationale: נחל может обозначать русло, ущелье или долину сезонного потока; «долина» понятно современному читателю и соответствует территориальному описанию.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: и половиной горной области Галаада
  rationale: הַר здесь, вероятно, обозначает горную местность как область, а не одну отдельную гору.
- source_word: וְעָרָיו
  choice: с её городами
  rationale: Местоимение отнесено к горной области Галаада; «с её городами» естественно в русском территориальном описании.
- source_word: נָתַתִּי
  choice: Я отдал её
  rationale: Сохранён переход от первого лица множественного числа к первому лицу единственного; местоимение поясняет, что речь идёт об описанной территории.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: потомкам Рувима и Гада
  rationale: Формы этнонимов имеют собирательное значение и называют соответствующие племенные группы; эта передача ясна и естественна по-русски.
