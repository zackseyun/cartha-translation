  source_fidelity: В целом переданы укреплённые города, высокая стена, двери/ворота и засов, а также противопоставленные им многочисленные неукреплённые поселения. Однако «кроме них было ещё» несколько разрывает исходную конструкцию и может неясно отсылать к укреплениям, а не к городам. Более прямое «не считая» точнее передаёт לְבַד («помимо, за исключением из подсчёта»).
