- source_word: חוֹמָה גְבֹהָה
  choice: высокой стеной
  rationale: Сохранено единственное число еврейского выражения; по-русски оно естественно описывает типовое укрепление каждого из названных городов.
- source_word: דְּלָתַיִם
  choice: двустворчатыми воротами
  rationale: Двойственное число указывает на две створки входа; «ворота» соответствует городскому контексту, а «двустворчатые» сохраняет морфологический оттенок исходного текста.
- source_word: וּבְרִיחַ
  choice: и засовами
  rationale: Хотя еврейское слово стоит в единственном числе, здесь оно может иметь собирательное значение; русское множественное число естественно согласуется с воротами нескольких городов.
- source_word: לְבַד
  choice: кроме них
  rationale: 'Передаёт добавочное значение: помимо перечисленных укреплённых городов существовало множество других поселений.'
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: неукреплённых городов
  rationale: Выражение обозначает поселения открытой местности, не защищённые стенами, в явном противопоставлении только что упомянутым укреплённым городам.
- source_word: הַרְבֵּה מְאֹד
  choice: очень много
  rationale: Прямо и естественно передаёт усиленное указание на большое количество.
- source_word: כָּל אֵלֶּה עָרִים
  choice: Все эти города были
  rationale: Русская связка «были» делает именное предложение естественным, сохраняя начальное смысловое выделение «все эти».
