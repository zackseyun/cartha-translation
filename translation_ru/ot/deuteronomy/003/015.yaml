  text: А Махиру я отдал Галаад[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте название «Галаад» употреблено с определённым артиклем; в русском языке географические названия обычно употребляются без артикля.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: А Махиру
  rationale: Союз וּ связывает стих с предшествующим рассказом о распределении земель, а предлог לְ передаётся русским дательным падежом. Имя מָכִיר традиционно транслитерируется как «Махир».
- source_word: נָתַתִּי
  choice: я отдал
  rationale: Форма qal perfect, 1-е лицо единственного числа, обозначает совершённое действие в повествовании. «Отдал» естественно передаёт נתן в контексте земельного надела, не вводя более специального значения «назначил».
- source_word: אֶת
  choice: '[показатель прямого дополнения не переводится]'
  rationale: Частица отмечает определённое прямое дополнение и не имеет самостоятельного соответствия в русском переводе.
- source_word: הַ/גִּלְעָד
  choice: Галаад
  rationale: Географическое название передаётся в принятой русской библейской форме «Галаад». Определённый артикль в русском перед именем местности отдельно не выражается.
