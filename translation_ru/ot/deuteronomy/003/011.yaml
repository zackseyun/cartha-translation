source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: ru
  text: Ведь из остатка рефаимов[a] уцелел только Ог, царь Васана. Вот его ложе — железное ложе. Разве оно не находится в Равве аммонитян? Оно девять локтей в длину и четыре локтя в ширину — по человеческому локтю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполинов». Еврейское слово «рефаимы», вероятно, обозначает древний народ, который связывали с необычайно высоким ростом.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «по обычному локтю». Буквально: «по локтю человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק ... נִשְאַר מִיֶּתֶר
  choice: из остатка ... уцелел только
  rationale: Естественно передаёт исключительность רַק и сохранение единственного представителя, выраженное נִשְאַר מִיֶּתֶר.
- source_word: הָרְפָאִים
  choice: рефаимов
  rationale: Сохраняет название древнего народа или группы, не подменяя его толкованием «исполины».
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательную силу слова и привлекает внимание к предмету, приводимому как свидетельство.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: его ложе — железное ложе
  rationale: Сохраняет повтор существительного и допускаемую контекстом нейтральность слова «ложе».
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: в Равве аммонитян
  rationale: Использует принятое русское библейское название города и естественное обозначение народа.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: девять локтей ... четыре локтя
  rationale: Сохраняет древнюю меру без приблизительного пересчёта и ложной точности.
- source_word: בְּאַמַּת אִישׁ
  choice: по человеческому локтю
  rationale: Близко воспроизводит буквальное выражение и оставляет его вероятное значение «по обычному локтю» в примечании.
theological_decisions:
- issue: Передавать ли הָרְפָאִים как название группы или как «исполинов»
  choice: рефаимы
  alternative: исполины
  rationale: Еврейское слово обозначает известную древнюю группу; перевод «исполины» толковательно подчёркивает рост, тогда как транслитерация сохраняет лексическую неопределённость.
- issue: Означает ли עֶרֶשׂ кровать, ложе или погребальное ложе/саркофаг
  choice: ложе
  alternative: кровать; погребальное ложе; саркофаг
  rationale: «Ложе» естественно в контексте размеров Ога и одновременно менее узко, чем «кровать»; погребальный смысл возможен, но самим контекстом не требуется.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Васана» и «Равве» выбраны как узнаваемые русские формы названий; риторический вопрос и повтор «ложе» сохранены.
