base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: ru
  text: Затем мы повернули и пошли вверх по дороге в Васан[a]. Ог, царь Васана, вышел навстречу нам со всем своим народом, чтобы сразиться при Едрее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по дороге через Васан». Буквально: «по дороге Васана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Затем мы повернули
  rationale: Глагол פנה в повествовательной последовательности означает «повернуть»; «затем» естественно передаёт последовательность действий.
- source_word: וַנַּעַל
  choice: пошли вверх
  rationale: עלה сохраняет значение движения вверх, важное для описания пути.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: по дороге в Васан
  rationale: Конструкция буквально означает «дорога Васана» и может обозначать путь в эту область или через неё; основной текст использует естественное русское обозначение направления, а неоднозначность отмечена в сноске.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: יצא буквально означает «выйти»; военный характер выхода уже выражен последующей фразой.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ог, царь Васана
  rationale: Сочетание существительных естественно передано приложением; имена транслитерированы в принятой русской библейской форме.
- source_word: לִקְרָאתֵנוּ
  choice: навстречу нам
  rationale: לקראת означает движение навстречу; более узкое «против нас» не требуется, поскольку цель встречи далее прямо названа битвой.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: со всем своим народом
  rationale: עם — широкое понятие «народ»; контекст допускает войско, но исходный текст прямо не употребляет слово «армия».
- source_word: לַמִּלְחָמָה
  choice: чтобы сразиться
  rationale: В контексте конкретного столкновения מלחמה обозначает битву; целевая конструкция по-русски естественно передаётся инфинитивом.
- source_word: אֶדְרֶעִי
  choice: при Едрее
  rationale: Название места употреблено обстоятельственно без явного предлога; «при Едрее» естественно обозначает место сражения и сохраняет традиционную русскую форму топонима.
