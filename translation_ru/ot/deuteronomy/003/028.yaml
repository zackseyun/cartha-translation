base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: ru
  text: Наставь Иисуса Навина[a], укрепи его и ободри[b], потому что он перейдёт впереди этого народа и введёт этот народ во владение землёй[c], которую ты увидишь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дай Иисусу Навину повеление»; также возможно: «официально поручи ему». Еврейский глагол может обозначать властное наставление или официальное поручение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «придай ему мужества». Два стоящих рядом глагола призывают придать ему твёрдость и смелость.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сделает так, что они унаследуют землю». Каузативная форма глагола показывает, что Иисус Навин станет тем, через кого народ вступит во владение своим наследием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: А Иисусу Навину дай поручение
  rationale: Пиэль императива צוה в данном контексте означает не просто отдельный приказ, а официальное возложение ответственности на будущего руководителя. Выражение «дай поручение» звучит естественно по-русски и сохраняет оттенок властного наставления.
- source_word: וְחַזְּקֵהוּ
  choice: укрепи его
  rationale: Каузативно-интенсивная форма חזק передаёт призыв сделать Иисуса Навина твёрдым и сильным; «укрепи его» точно и естественно выражает этот смысл.
- source_word: וְאַמְּצֵהוּ
  choice: и ободри
  rationale: В сочетании с חזק глагол אמץ указывает на придание мужества и решимости. «Ободри» сохраняет отличие от физической или общей крепости, выраженной предыдущим глаголом.
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: потому что он перейдёт впереди этого народа
  rationale: עבר в контексте означает переход через Иордан, а לִפְנֵי сохраняет пространственный смысл «впереди» и одновременно подразумевает руководящую роль, не делая её явной сверх текста.
- source_word: וְהוּא יַנְחִיל אוֹתָם אֶת־הָאָרֶץ
  choice: и введёт его во владение землёй
  rationale: 'Хифиль נחל имеет каузативный смысл: Иисус Навин станет тем, через кого народ получит землю как наследственное владение. Эта формулировка естественна по-русски и не представляет его первичным дарителем земли.'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: которую ты увидишь
  rationale: Имперфект относится к предстоящему обозрению земли Моисеем; будущее время точно передаёт контекст.
theological_decisions:
- issue: Роль Иисуса Навина в получении народом земли
  choice: введёт его во владение землёй
  alternative: даст ему землю в наследие
  rationale: Выбранная формулировка сохраняет каузативность נחל и посредническую роль Иисуса Навина, не создавая впечатления, будто земля принадлежит ему и даруется им независимо от Бога.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Местоимение «его» относится к собирательному существительному «народ». Формулировка сохраняет различие между «укрепи» и «ободри», а также пространственно-лидерскую двусмысленность слова «впереди».
