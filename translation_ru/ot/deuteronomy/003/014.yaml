base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: ru
  text: Иаир, сын Манассии, овладел всей областью Аргова вплоть до границы гессурян и маахитян и назвал их по своему имени — то есть Васан — Хаввот-Иаир[a]. Так они называются и по сей день.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Хаввот-Иаир», вероятно, означает «селения Иаира» или «шатровые поселения Иаира».
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза построена сжато; буквально: «и назвал их по своему имени — Васан, Хаввот-Иаир — до сего дня». Синтаксическую связь слова «Васан» можно понимать несколько иначе.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: область
  rationale: В данном географическом контексте слово обозначает определённую территорию; «область» естественно передаёт этот смысл по-русски.
- source_word: אַרְגֹּב
  choice: Аргов
  rationale: Географическое название передано традиционной русской библейской формой, близкой к еврейскому произношению.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: вплоть до границы гессурян и маахитян
  rationale: גְּבוּל означает границу или рубеж, а формы הַגְּשׁוּרִי и הַמַּעֲכָתִי указывают на соответствующие народы.
- source_word: לָקַח
  choice: овладел
  rationale: В повествовании о получении территории «овладел» точнее и естественнее простого «взял».
- source_word: וַיִּקְרָא אֹתָם
  choice: назвал их
  rationale: Сохранено мужское множественное число еврейского местоименного суффикса; перевод не заменяет его более гладким, но менее точным единственным числом.
- source_word: עַל שְׁמוֹ
  choice: в свою честь
  rationale: Идиома означает, что Иаир дал местам название по собственному имени.
- source_word: אֶת הַבָּשָׁן
  choice: Васан
  rationale: Название сохранено в основном тексте без добавления отсутствующего в еврейском предлога; его синтаксическая связь с окружающими словами остаётся сжатой и поясняется в сноске.
- source_word: חַוֹּת יָאִיר
  choice: Хаввот-Иаир
  rationale: Сочетание функционирует как топоним, поэтому транслитерировано; вероятное значение составляющих приведено в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: как они называются и по сей день
  rationale: Естественная русская передача устойчивого указания на сохранение названия до времени повествователя.
theological_decisions:
- issue: Синтаксическая связь אֶת הַבָּשָׁן с множественным אֹתָם и названием חַוֹּת יָאִיר
  choice: Сохранить сжатое перечисление «Васан, Хаввот-Иаир», не вводя в основной текст отсутствующих связок.
  alternative: «назвал эти места в Васане Хаввот-Иаир» или «назвал Васан Хаввот-Иаир»
  rationale: Еврейская конструкция необычна и допускает несколько способов синтаксического членения. Выбранный вариант не превращает возможное приложение в однозначное обстоятельство места и сохраняет множественное «их».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционные русские формы «Манассия» и «Васан», а редкий топоним «Хаввот-Иаир» передан транслитерацией. Необычное множественное число и синтаксическая неоднозначность оригинала не сглажены полностью.
