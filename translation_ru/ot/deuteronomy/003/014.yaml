  source_fidelity: 'Начальная часть переведена точно: Иаир, сын Манассии, берёт всю область Аргова до границы гессурян и маахитян. Однако в заключительной части тире после «в свою честь» делает «Васан, Хаввот-Иаир» неясным приложением и не отражает достаточно явно, что еврейское עַל־שְׁמוֹ означает «по своему имени». Сложная связь «Васан» с множественным «их» должна быть отмечена, но основной текст может передать её более читаемо, не устраняя неоднозначности.'
  naturalness: '«Назвал их в свою честь — Васан, Хаввот-Иаир» синтаксически затруднительно для современного литературного русского: неясно, является ли «Васан» объектом, местом или частью данного имени. Формула «назвал их по своему имени — то есть Васан — Хаввот-Иаир» воспроизводит сжатую аппозиционную связь оригинала и английского аудиторского решения, а отдельное предложение о сохранении названия естественно передаёт «до сего дня».'
  terminology: Традиционные формы «Манассия», «Васан», «Аргов» и этнонимы «гессуряне», «маахитяне» приемлемы. «Хаввот-Иаир» оправданно сохранено как топоним; сноска с вероятными лексическими значениями нужна. «По своему имени» точнее, чем «в свою честь», поскольку прямо передаёт идиому עַל שְׁמוֹ.
