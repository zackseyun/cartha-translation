revisions:
- from: Иаир, сын Манассии, овладел всей областью Аргов вплоть до границы гессурян и маахитян и назвал их в свою честь — Васан, Хаввот-Иаир[a], — как они называются и по сей день.[b]
  to: Иаир, сын Манассии, овладел всей областью Аргова вплоть до границы гессурян и маахитян и назвал их по своему имени — то есть Васан — Хаввот-Иаир[a]. Так они называются и по сей день.[b]
  rationale: Исправление заменяет менее точное «в свою честь» на «по своему имени» и вводит сдержанное «то есть» для того аппозиционного понимания, которое принято в английском аудиторском тексте. Множественное «их», топоним «Хаввот-Иаир» и спорная роль слова «Васан» сохранены; последняя не закрепляется догматически и поясняется в сноске. Вторая фраза делает естественным для русского значение устойчивого «до сего дня».
