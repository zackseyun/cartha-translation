  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: ru
  text: В то время мы взяли землю у двух аморейских царей, которые были за Иорданом, — от потока Арнон[a] до горы Ермон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от долины Арнон» или «от реки Арнон». Еврейское слово נַחַל может обозначать сезонный поток, его русло или долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: мы отняли
  rationale: Форма глагола לקח описывает взятие земли у прежних владетелей. «Отняли» естественно сочетается с «у» и передаёт переход владения, не добавляя более узкого военного оттенка «захватили».
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Устойчивое и естественное русское соответствие временному выражению.
- source_word: אֶת הָאָרֶץ
  choice: эту землю
  rationale: Определённая форма указывает на упомянутую в контексте территорию; указательное «эту» естественно передаёт контекстуальную определённость по-русски.
- source_word: מִיַּד
  choice: у
  rationale: Буквально «из руки», то есть из владения или власти. Русское «отняли у» ясно и идиоматично передаёт смысл, тогда как буквальное «из руки» здесь звучало бы неестественно.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: двух аморейских царей
  rationale: Естественная русская конструкция, точно передающая двух царей амореев.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: владевших областью за Иорданом
  rationale: В еврейском относительном обороте сказуемое выражено лишь предложной группой; по контексту речь идёт о царях и их землях за Иорданом. Добавление «владевших областью» делает связь ясной по-русски, не определяя восточную или западную сторону сверх исходной перспективы.
- source_word: מִנַּחַל אַרְנֹן
  choice: от потока Арнон
  rationale: נחל может обозначать поток, русло или долину сезонной реки. «Поток» — понятное географическое обозначение, а неоднозначность отражена в примечании.
- source_word: עַד הַר חֶרְמוֹן
  choice: до горы Ермон
  rationale: עַד обозначает предел территории; «до» кратко и точно передаёт границу. חֶרְמוֹן передано традиционной русской формой «Ермон».
