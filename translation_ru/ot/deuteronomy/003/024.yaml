  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: ru
  text: О Владыка Яхве[a]! Ты начал являть Твоему слуге Твоё величие и Твою сильную руку. Какой бог на небесах или на земле может совершать дела, подобные Твоим, и могущественные деяния, подобные Твоим?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «Адонай Яхве»: אֲדֹנָי — титул «Владыка, Господь», יהוה — личное имя Бога.'
    reason: Пояснение необычного сочетания божественного титула и имени.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: О Владыка Яхве
  rationale: אֲדֹנָי передаётся как обращение «Владыка», а личное имя יהוה — как «Яхве». Это различает титул и имя и избегает неестественного сочетания «Господь Господь».
- source_word: הַחִלּוֹתָ
  choice: Ты начал
  rationale: Хифиль перфекта в данном обороте означает начало действия; русский перфектив «начал» естественно передаёт уже начавшееся действие.
- source_word: לְהַרְאוֹת
  choice: показывать
  rationale: Хифиль от ראה имеет каузативное значение «дать увидеть, показать»; длительный инфинитив после «начал» естественен по-русски.
- source_word: עַבְדְּךָ
  choice: рабу Твоему
  rationale: В молитвенном обращении עבד обозначает человека, полностью подчинённого Богу. Традиционное русское «раб» сохраняет эту силу лучше, чем более служебное «слуга».
- source_word: גָּדְלְךָ
  choice: Твоё величие
  rationale: Прямо передаёт значение величия и масштаба, не сужая его только до силы или славы.
- source_word: יָדְךָ הַחֲזָקָה
  choice: Твою сильную руку
  rationale: Сохраняет конкретный библейский образ действующей Божьей силы и прямо отражает прилагательное חזק.
- source_word: מִי אֵל
  choice: какой бог
  rationale: Риторический вопрос сравнивает Яхве с любым возможным божеством, не утверждая реальность или равенство иных богов.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: на небесах и на земле
  rationale: Сохраняет еврейский союз «и» и выражает всеохватный пространственный меризм.
- source_word: יַעֲשֶׂה
  choice: может совершать
  rationale: Хотя форма буквально допускает «совершит» или «совершает», в риторическом вопросе она выражает способность совершить сопоставимые дела.
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: дела, подобные Твоим, и такие же могущественные деяния
  rationale: Сохраняет параллелизм между обычным словом «дела» и более сильным обозначением проявлений могущества, избегая тяжеловесного двойного повторения «подобные Твоим».
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: О Владыка Яхве
  alternative: О Господь Бог; О Господь Яхве
  rationale: Основной текст различает титул אֲדֹנָי и личное имя יהוה. Транслитерация «Яхве» не заменяет имя общим титулом, а «Владыка» естественно обозначает обращение אֲדֹנָי.
- issue: Смысл риторического вопроса о «боге»
  choice: Сохранён вопрос «какой бог… может»
  alternative: Нет Бога, который мог бы
  rationale: Утвердительная перефразировка сделала бы подразумеваемый вывод явным. Вопросительная форма оригинала сохраняет риторическую силу и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Формы «рабу Твоему» и прописные местоимения поддерживают торжественный регистр, не вводя конфессионально специфической терминологии. Синтаксис риторического вопроса и образ «сильной руки» сохранены.
