source:
  edition: WLC
  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: ru
  text: 'А остальную часть Галаада и весь Васан — царство Ога — я отдал половине колена Манассии: всю область Аргов, то есть весь Васан. Он называется землёй рефаимов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному пониманию: «землёй великанов». «Рефаимы» — еврейское название древнего народа, связанного с этой областью.'
    reason: 'Лексическая альтернатива: этноним רְפָאִים традиционно также истолковывался как обозначение великанов.'
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: остальную часть Галаада
  rationale: Передаёт остаток территории Галаада после упомянутого ранее удела; естественно и точно по-русски.
- source_word: כָל הַבָּשָׁן
  choice: весь Васан
  rationale: Сохраняет всеохватное значение כֹּל и традиционную русскую форму географического названия.
- source_word: מַמְלֶכֶת עוֹג
  choice: царство Ога
  rationale: Прямо передаёт конструкцию принадлежности и политическое обозначение территории.
- source_word: נָתַתִּי
  choice: я отдал
  rationale: В контексте распределения земель естественно передаёт совершившуюся передачу удела и сохраняет первое лицо.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: половине колена Манассии
  rationale: Ясная современная формулировка, обозначающая половину племенного объединения Манассии.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: всю область Аргов
  rationale: חֶבֶל здесь означает территориальную область, а не буквальную верёвку; «область» точно и понятно.
- source_word: לְכָל הַבָּשָׁן
  choice: то есть весь Васан
  rationale: Передаёт вероятную пояснительно-приложительную связь фразы, не отождествляя её с отдельным новым объектом.
- source_word: יִקָּרֵא
  choice: называется
  rationale: Пассивный имперфект допускает обозначение устойчивого названия; настоящее время непосредственно сохраняет этот оттенок.
- source_word: אֶרֶץ רְפָאִים
  choice: землёй рефаимов
  rationale: Транслитерация сохраняет этноним и не навязывает спорное толкование «великаны» в основном тексте.
theological_decisions:
- issue: Передавать רְפָאִים как название народа или толковательно как «великаны»
  choice: рефаимов
  alternative: великанов
  rationale: В данном контексте слово функционирует как обозначение древнего народа. Транслитерация сохраняет исходную неопределённость, а традиционное толкование вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире выделяют приложение «царство Ога», а двоеточие вводит уточнение состава переданного удела. Форма «Аргов» следует традиционному русскому библейскому употреблению названия Аргов/Аргоб.
