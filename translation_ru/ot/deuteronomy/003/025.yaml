    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: Позволь же мне перейти
  rationale: Когортатив выражает настойчивую просьбу Моисея, а частица נָא смягчает её. «Позволь же мне» естественно передаёт и волевой оттенок, и мольбу.
- source_word: וְאֶרְאֶה
  choice: и увидеть
  rationale: Второй когортатив продолжает просьбу и обозначает цель перехода; инфинитив после «позволь» звучит естественно по-русски.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: ту добрую землю
  rationale: «Земля» сохраняет территориальный и заветный смысл אָרֶץ, а «добрая» передаёт характерную для Второзакония формулу без истолковывающего расширения.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: что за Иорданом
  rationale: Выражение указывает на землю по другую сторону Иордана относительно Моисея; краткая русская формулировка сохраняет пространственную перспективу.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: эту прекрасную горную страну
  rationale: הָר может обозначать как отдельную гору, так и гористую область. В описании земли коллективно-географическое значение вероятнее; «прекрасную» избегает тяжёлого повтора «добрую» при сохранении положительной оценки טוֹב.
- source_word: וְהַלְּבָנוֹן
  choice: и Ливан
  rationale: Сохранено общепринятое русское название географической области.
theological_decisions:
- issue: 'Географический смысл הָהָר: отдельная гора или горная область'
  choice: «горная страна» как наиболее вероятное контекстуальное значение
  alternative: «эта прекрасная гора»
  rationale: Единственное число הָר способно собирательно обозначать гористую местность. Контекст обзора обетованной земли и упоминание Ливана поддерживают региональное прочтение, но еврейская неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой молитвенной просьбы. Частица «же» передаёт настойчиво-просительный тон נָא без архаичного «молю». Повтор определения טוֹב передан словами «добрую» и «прекрасную» ради естественности русской речи; синтаксис сохраняет приложение без лишней запятой перед «и Ливан».
