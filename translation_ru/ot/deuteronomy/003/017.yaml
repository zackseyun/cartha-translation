  - marker: b
    text: То есть Мёртвого моря.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Арава
  rationale: В описании границ это географическое название Иорданской рифтовой долины, а не просто нарицательное «равнина».
- source_word: הַיַּרְדֵּן
  choice: Иордан
  rationale: Употреблено общепринятое русское название; слово «река» в перечне границ подразумевается и не нуждается в добавлении.
- source_word: גְבֻל
  choice: её границей служил
  rationale: Еврейский текст эллиптичен; такая формулировка естественно передаёт значение «граница, рубеж» и связь Иордана с Аравой.
- source_word: מִכִּנֶּרֶת
  choice: от Киннерета
  rationale: Сохранено географическое имя без уточняющего слова «море», отсутствующего в исходной форме.
- source_word: יָם הָעֲרָבָה
  choice: море Аравы
  rationale: Буквально передано древнее географическое обозначение, после которого следует поясняющее наименование.
- source_word: יָם הַמֶּלַח
  choice: Солёное море
  rationale: Формально передаёт еврейское название; современное название «Мёртвое море» дано в примечании.
- source_word: תַּחַת
  choice: ниже
  rationale: Сохраняет топографическое пространственное отношение, не превращая его без достаточных оснований в указание стороны света.
- source_word: אַשְׁדֹּת
  choice: склонов
  rationale: В данном топографическом контексте слово обозначает горные склоны или уступы.
- source_word: הַפִּסְגָּה
  choice: Писги
  rationale: Передано как собственное географическое имя в форме, естественной для русского падежного управления.
- source_word: מִזְרָחָה
  choice: на востоке
  rationale: Передаёт наречное указание восточного направления или положения, не устраняя возможную синтаксическую неоднозначность его связи с предыдущими словами.
