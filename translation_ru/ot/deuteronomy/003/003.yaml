base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: ru
  text: И Яхве, наш Бог, предал в наши руки также Ога, царя Башана, и весь его народ. Мы разбили его так, что у него не осталось ни одного уцелевшего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «пока не осталось у него уцелевшего».'
    reason: Буквальная синтаксическая альтернатива к идиоматичному переводу заключительной фразы.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: предал в наши руки
  rationale: Естественно передаёт древнееврейскую военную идиому, сохраняя образ «рук» и смысл передачи во власть победителя.
- source_word: גַּם
  choice: также
  rationale: Сохраняет добавочное значение и связывает победу над Огом с предшествующей победой над Сигоном.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ога, царя Башана
  rationale: Нормальная русская форма имени и титула; название области передано традиционной библейской формой «Башан».
- source_word: כָּל עַמּוֹ
  choice: со всем его народом
  rationale: עַם шире по значению, чем «войско»; предлог «со» естественно объединяет Ога и его народ как объекты предания в руки.
- source_word: וַנַּכֵּהוּ
  choice: Мы разбили его
  rationale: В контексте сражения נכה обозначает нанесение поражения; «разбили» передаёт военную силу глагола и допускает, что Ог представляет здесь свою сторону.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: так, что у него не осталось ни одного уцелевшего
  rationale: Передаёт результат полного разгрома естественным русским оборотом, не уточняя сверх текста, кто именно является подразумеваемым субъектом причинения этого результата.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя сохраняется как имя, без замены титулом; форма «Яхве» отражает общепринятую научную реконструкцию произношения.
- issue: Масштаб уничтожения
  choice: у него не осталось ни одного уцелевшего
  alternative: мы не оставили ему ни одного уцелевшего
  rationale: Сохраняет категоричность древнееврейского свидетельства о полном разгроме, но не делает грамматическую агентность более определённой, чем в исходном обороте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Военная идиома «предал в наши руки» сохранена как понятная и стилистически уместная; архаизмы и конфессионально окрашенные добавления исключены.
