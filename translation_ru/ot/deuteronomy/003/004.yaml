base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: ru
  text: В то время мы взяли все его города; не было ни одного города, которого мы не взяли у них[a]. Мы взяли шестьдесят городов — всю область Аргов, царство Ога в Васане.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «у них»; вероятно, имеются в виду люди или войско Ога, а не один Ог.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: взяли
  rationale: Глагол לכד обозначает овладение городом в ходе военных действий; «взяли» естественно и точно передаёт этот смысл по-русски.
- source_word: כָּל עָרָיו
  choice: все его города
  rationale: עיר может означать город или поселение; «города» соответствует контексту завоевания, а местоименный суффикс указывает на Ога.
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Прямой и естественный перевод устойчивого временного оборота.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: не было города, которого мы не отняли бы у них
  rationale: Сохранены усиленное отрицание и относительная конструкция еврейского текста; «отняли у них» ясно передаёт לקח с מן в контексте завоевания.
- source_word: מֵאִתָּם
  choice: у них
  rationale: Сохранено множественное число местоименного суффикса; оно, вероятно, относится к людям или войску Ога, а не только к самому Огу.
- source_word: שִׁשִּׁים עִיר
  choice: шестьдесят городов
  rationale: Прямой перевод числительного с существительным, согласованный с предыдущими обозначениями городов.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: всю область Аргов
  rationale: חבל здесь означает территориальную область; «область» понятно современному читателю. Название אַרְגֹּב передано в принятой русской библейской форме «Аргов».
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: царство Ога в Васане
  rationale: Конструкция определяет область Аргов как царство Ога, расположенное в Васане; формулировка сохраняет структуру и географическую связь исходного текста.
