lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: И мы оставались
  rationale: Форма от יָשַׁב с последовательным waw повествует о прошлом пребывании. «Оставались» естественно передаёт продолжительное нахождение в данном месте, а союз «и» сохраняет повествовательную связь, не усиливая причинно-следственный оттенок.
- source_word: בַּגָּיְא
  choice: в долине
  rationale: גַּיְא может обозначать долину, лощину или ущелье. «Долина» — наиболее широкое и естественное соответствие, не уточняющее без достаточных оснований характер рельефа.
- source_word: מוּל
  choice: напротив
  rationale: מוּל обозначает пространственное положение перед чем-либо или напротив него. «Напротив» кратко и естественно сочетается с географическим названием.
- source_word: בֵּית פְּעוֹר
  choice: Бет-Пеора
  rationale: Это географическое название, поэтому оно передано транслитерацией, а не буквальным переводом. После предлога «напротив» употреблён родительный падеж.
