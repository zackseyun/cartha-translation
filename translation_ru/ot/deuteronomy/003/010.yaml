    reason: transliteration_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: все города плоскогорья
  rationale: מִישׁוֹר обозначает здесь ровную возвышенную область к востоку от Иордана; «плоскогорье» точнее передаёт топографический смысл, чем общее «равнина».
- source_word: וְכָל הַגִּלְעָד וְכָל הַבָּשָׁן
  choice: весь Галаад и весь Васан
  rationale: Сохранены повтор квантора כֹּל и принятые в русской библейской традиции формы географических названий.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: вплоть до Салхи и Едреи
  rationale: עַד указывает на предел территории; «вплоть до» естественно выражает географическую протяжённость.
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  choice: города царства Ога
  rationale: Сочетание передано как приложение к предшествующим названиям, без добавления отсутствующей в еврейском тексте связки.
- source_word: בַּבָּשָׁן
  choice: в Васане
  rationale: Предлог בְּ имеет здесь локативное значение и указывает, где находилось царство Ога.
