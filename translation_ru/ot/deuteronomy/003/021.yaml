source:
  edition: WLC
  text: וְ/אֶת יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר עֵינֶ֣י/ךָ הָ/רֹאֹ֗ת אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֤ה אֱלֹהֵי/כֶם֙ לִ/שְׁנֵי֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה כֵּֽן יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל הַ/מַּמְלָכ֔וֹת אֲשֶׁ֥ר אַתָּ֖ה עֹבֵ֥ר שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: ru
  text: 'В то время я повелел Иисусу Навину: «Ты своими глазами видел всё, что Яхве, ваш Бог, сделал этим двум царям. Так же Яхве поступит со всеми царствами, в которые ты вступаешь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. буквально: «которые ты переходишь туда». Оборот может обозначать царства, в которые предстоит перейти по ту сторону Иордана.'
    reason: Сохраняет необычное сочетание глагола עבר («переходить») с направительным «туда» и поясняет избранную естественную русскую передачу без снятия неоднозначности.
lexical_decisions:
- source_word: וְאֶת־יְהוֹשׁוּעַ צִוֵּיתִי
  choice: я повелел Иисусу Навину
  rationale: Глагол צוה выражает авторитетное повеление. Традиционная русская форма имени Иисус Навин обеспечивает ясность и узнаваемость.
- source_word: בָּעֵת הַהִוא
  choice: В то время
  rationale: Естественная русская передача стандартного еврейского обстоятельства времени.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском вводная формула «говоря» здесь стилистически избыточна; её функцию естественно передают двоеточие и прямая речь.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Ты своими глазами видел
  rationale: Сохраняет эмфатическое указание на личное зрительное свидетельство, но звучит естественнее буквального «твои глаза видели».
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, ваш Бог
  rationale: Передаёт собственное имя Бога и сохраняет множественное число суффикса «ваш», хотя речь обращена непосредственно к Иисусу Навину как представителю Израиля.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: с этими двумя царями
  rationale: Русское «сделал с» идиоматично передаёт действие по отношению к царям, не добавляя явно выраженного предлога «против».
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Так же Яхве поступит
  rationale: כֵּן задаёт прямое сопоставление будущих действий с уже увиденным; «так же» ясно выражает эту связь.
- source_word: לְכָל הַמַּמְלָכוֹת
  choice: со всеми царствами
  rationale: Согласуется с русской конструкцией «поступить с» и сохраняет царства как объекты аналогичного действия.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: в которые ты переходишь
  rationale: Сохраняет единственное число обращения и мотив перехода; направление, выраженное שָׁמָּה, естественно передаётся сочетанием «в которые».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон как личное имя Бога; транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Смена числа в выражении «Яхве, ваш Бог»
  choice: сохранить «ваш»
  alternative: «твой Бог» для согласования с обращением к Иисусу Навину
  rationale: Еврейский текст намеренно сочетает обращение к Иисусу Навину в единственном числе с אֱלֹהֵיכֶם, «ваш Бог», включая его в народ; эта особенность не должна сглаживаться.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Эмфаза исходного текста передана оборотом «своими глазами», а вводная формула прямой речи — русской пунктуацией. Сохранены единственное число обращения к Иисусу Навину и неожиданное множественное «ваш Бог».
