base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: ru
  text: 'В то время я повелел вам: «Яхве, ваш Бог, отдал вам эту землю во владение. Все боеспособные мужчины должны перейти вооружёнными впереди ваших братьев, сынов Израиля».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «все сыны силы»; имеются в виду боеспособные мужчины. «Вооружёнными» можно также перевести: «готовыми к бою».'
    reason: Лексическое и культурное пояснение к בְּנֵי חָיִל и חֲלוּצִים.
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם בָּעֵת הַהִוא לֵאמֹר
  choice: В то время я повелел вам
  rationale: Естественная русская передача повествовательной формулы; отдельное «сказав» было бы избыточно перед прямой речью.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, ваш Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а суффикс второго лица множественного числа — «ваш».
- source_word: נָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  choice: отдал вам эту землю во владение
  rationale: Совершенный вид נָתַן обозначает совершившуюся передачу земли, а ירשׁ здесь связано с вступлением во владение и обладанием.
- source_word: חֲלוּצִים תַּעַבְרוּ לִפְנֵי
  choice: должны с оружием перейти впереди
  rationale: חֲלוּצִים указывает на готовность к военным действиям; конструкция с имперфектом в контексте повеления передана обязательностью.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: ваших братьев, сынов Израиля
  rationale: Сохранены родственное обозначение и буквальная этническая формула исходного текста.
- source_word: כָּל בְּנֵי חָיִל
  choice: все вы, способные сражаться
  rationale: В данном военном контексте выражение обозначает боеспособных мужчин, а не просто людей с внутренним мужеством.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Объём выражения כָּל בְּנֵי חָיִל
  choice: все вы, способные сражаться
  alternative: все храбрые мужчины
  rationale: Контекст требует военно-функционального значения; перевод не сводит выражение к нравственному качеству храбрости.
- issue: Родственное обозначение אֲחֵיכֶם
  choice: ваших братьев
  alternative: ваших соплеменников
  rationale: Буквальный образ родства сохранён без устранения его представительного значения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь оформлена естественно; синтаксис слегка перестроен, чтобы ясно связать «все» с боеспособными воинами и избежать тяжеловесной кальки.
