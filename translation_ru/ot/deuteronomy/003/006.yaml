  text: וַ/נַּחֲרֵ֣ם אוֹתָ֔/ם כַּ/אֲשֶׁ֣ר עָשִׂ֔ינוּ לְ/סִיחֹ֖ן מֶ֣לֶךְ חֶשְׁבּ֑וֹן הַחֲרֵם֙ כָּל עִ֣יר מְתִ֔ם הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: ru
  text: 'И мы предали их заклятию[a], как поступили с Сихоном, царём Хешбона, полностью уничтожив всё: каждый город, мужчин, женщин и детей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предали полному уничтожению». Еврейский глагол חרם — специальный термин: отдать кого-либо или что-либо под заклятие, безвозвратно посвятив Богу; в данном контексте это означало уничтожение.'
    reason: Лексическая альтернатива и пояснение технического термина.
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: предали мы их заклятию
  rationale: Глагол חרם в породе хифиль обозначает предание людей или вещей херему — безвозвратному посвящению, здесь влекущему уничтожение. «Предали заклятию» сохраняет технический смысл, а примечание поясняет его современному читателю.
- source_word: כַּאֲשֶׁר עָשִׂינוּ לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: как поступили с Сихоном, царём Хешбона
  rationale: Оборот עשה ל передан естественным русским выражением «поступить с кем-либо»; уточняющее приложение сохраняет синтаксис и титул исходного текста.
- source_word: הַחֲרֵם
  choice: полностью уничтожив
  rationale: Инфинитив абсолютный того же корня поясняет и усиливает предыдущее действие; русский деепричастный оборот естественно передаёт как пояснение, так и тотальность уничтожения.
- source_word: כָּל עִיר מְתִם
  choice: в каждом городе мужчин
  rationale: מְתִם — самостоятельное существительное «мужчины, люди», за которым отдельно названы женщины и малые дети. Передача триадой сохраняет структуру и не превращает слово в определение «населённый».
- source_word: הַנָּשִׁים וְהַטָּף
  choice: женщин и детей
  rationale: הַנָּשִׁים прямо означает «женщины»; טַף обозначает малых детей или зависимых членов семей. В данном перечислении естественное современное русское «детей» передаёт смысл без архаизации.
theological_decisions:
- issue: Передача חרם в контексте военного суда
  choice: Сохранить в основном тексте техническое выражение «предали заклятию», сразу пояснив его результат словами «полностью уничтожив».
  alternative: «полностью истребили» или «предали уничтожению»
  rationale: 'Такой вариант не смягчает тяжесть описанного действия, но и не сводит חרם к обычному глаголу уничтожения: сохраняются одновременно культово-правовой оттенок термина и его фактическое последствие.'
- issue: Объём уничтожения в выражении כָּל עִיר מְתִם הַנָּשִׁים וְהַטָּף
  choice: 'Передать перечисление прямо: «в каждом городе мужчин, женщин и детей».'
  alternative: «каждый населённый город вместе с женщинами и детьми»
  rationale: Форма מְתִם здесь лучше понимается как самостоятельное обозначение мужчин в трёхчастном перечислении. Перевод сохраняет тотальность утверждения и не скрывает этически и богословски трудное содержание стиха.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «предали мы» сохраняет повествовательный акцент, не делая фразу непонятной; имена переданы как «Сихон» и «Хешбон». Текст прямо сохраняет тяжёлое содержание оригинала без смягчения.
