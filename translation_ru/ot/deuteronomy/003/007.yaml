  text: וְ/כָל הַ/בְּהֵמָ֛ה וּ/שְׁלַ֥ל הֶ/עָרִ֖ים בַּזּ֥וֹנוּ לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/007.yaml
  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: ru
  text: Но весь скот и добычу из городов мы забрали себе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А весь скот и добычу городов мы взяли себе как трофеи».'
    reason: 'Лексическая альтернатива: союз ו может быть передан нейтральным «а», конструкция שְׁלַל הֶעָרִים — более буквально как «добыча городов», а בזז — явно выраженным оборотом «взяли как трофеи».'
lexical_decisions:
- source_word: וְ/כָל
  choice: Но весь
  rationale: 'Союз ו связывает стих с предшествующим уничтожением жителей и в контексте передаёт лёгкое противопоставление: людей уничтожили, но скот и имущество забрали. כָּל передано словом «весь».'
- source_word: הַ/בְּהֵמָה
  choice: скот
  rationale: В данном военном контексте בְּהֵמָה обозначает домашних животных; «скот» — точное и естественное русское соответствие.
- source_word: וּ/שְׁלַל
  choice: и добычу
  rationale: שָׁלָל означает имущество, захваченное на войне. «Добыча» сохраняет военный смысл и звучит естественно в современном литературном русском.
- source_word: הֶ/עָרִים
  choice: из городов
  rationale: Еврейская конструкция буквально означает «добыча городов»; русское «добыча из городов» ясно передаёт, что имущество было взято в покорённых городах.
- source_word: בַּזּוֹנוּ
  choice: мы забрали
  rationale: Глагол בזז означает грабить или брать добычу. В сочетании с существительным «добыча» глагол «забрали» позволяет избежать тяжеловесного повтора, сохраняя смысл присвоения военных трофеев.
- source_word: לָֽ/נוּ
  choice: себе
  rationale: Предлог ל с местоименным суффиксом указывает, что захваченное предназначалось самим израильтянам; краткое «себе» естественно выражает этот возвратный смысл.
