  text: וָ/אֶתְחַנַּ֖ן אֶל יְהוָ֑ה בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: ru
  text: 'И в то время я умолял Яхве[a], говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH. Традиционный перевод — «Господь»; другой вариант передачи имени — «Иегова».'
    reason: Альтернативная передача Божьего имени.
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: И… я умолял
  rationale: Форма хитпаэль глагола חנן выражает настойчивую мольбу о милости, а повествовательный союз ו передан как «И».
- source_word: אֶל
  choice: Яхве (при глаголе «умолял»)
  rationale: 'Направленность мольбы передана естественным русским управлением: «умолять кого», без отдельного перевода предлога.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Естественно и точно передаёт указанное повествованием время, не сужая его до отдельного момента.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохраняет формальную формулу введения прямой речи, которая следует в следующем стихе.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык; «умолял» сохраняет напряжённость просьбы, а оборот «говоря» — достоинство и формальную связь со следующей прямой речью.
