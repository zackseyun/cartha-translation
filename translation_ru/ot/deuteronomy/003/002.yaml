  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Не бойся его, потому что Я отдал его в твою руку — вместе со всем его народом и его землёй. Ты поступишь с ним так же, как поступил с Сихоном, царём амореев, жившим в Хешбоне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, принятой современной русской транслитерацией.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Не бойся его
  rationale: Прямо и естественно передаёт отрицательное повеление и сохраняет выраженное в еврейском тексте дополнение «его».
- source_word: בְיָדְךָ
  choice: в твою руку
  rationale: Сохраняет еврейский образ передачи во власть человека; единственное число соответствует форме исходного текста.
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Перфект представляет передачу как уже совершённую с точки зрения Бога; «отдал» естественно сочетается с оборотом «в твою руку» и обозначает передачу во власть.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: весь его народ и его землю
  rationale: Сохраняет полноту כָּל и не сужает עַם до значения «войско».
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Сделай с ним то же, что ты сделал
  rationale: Естественно передаёт широкое значение עשה и сравнительную конструкцию; форма понята как предписание в данном контексте.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: с Сихоном, царём амореев
  rationale: Сохраняет имя и титул, передавая собирательное обозначение народа привычным русским множественным числом.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: жившим в Хешбоне
  rationale: Причастие ישב здесь обозначает проживание; современное «жившим» естественнее архаичного «обитавшим».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация сохраняет это различие, не заменяя имя титулом.
- issue: Совершённость Божьей передачи до битвы
  choice: Я отдал
  alternative: Я отдаю; Я предам
  rationale: Еврейский перфект представляет победу и передачу во власть Израиля как уже решённое действие, хотя сражение ещё предстоит.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Сохранён образ единственной «руки» исходного текста; синтаксис второй фразы слегка сглажен для естественности русского языка без уточнения характера действий сверх сказанного в контексте.
