  terminology: «Яхве», «Сихон», «амореи» и «Хешбон» переданы последовательно и приемлемо. «В твою руку» сохраняет образ בְּיָדְךָ; единственное число «руку» следует сохранить. Богословски нагруженных добавлений нет.
