  source_fidelity: 'В целом перевод точно передаёт порядок и основные элементы еврейского текста: личное имя Яхве, запрет бояться Ога, совершённую передачу его, народа и земли во власть Моисея, а также сопоставление с Сихоном. Однако «Сделай с ним то же» неоправданно превращает וְעָשִׂיתָ в резкий русский императив и несколько тяжеловесно передаёт широкий глагол עשה. В данном контексте естественнее передать форму как будущее предписание: «Ты поступишь с ним так же...»'
