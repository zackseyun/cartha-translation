lexical_decisions:
- source_word: צִידֹנִים
  choice: Сидоняне
  rationale: Форма множественного числа обозначает жителей Сидона; естественное русское название народа — «сидоняне».
- source_word: יִקְרְאוּ
  choice: называют
  rationale: Глагол קרא с предлогом ל здесь выражает именование; настоящее время естественно передаёт общеизвестное употребление названия.
- source_word: לְחֶרְמוֹן
  choice: Ермон
  rationale: В еврейском тексте стоит собственное имя без слова «гора», поэтому оно не добавлено.
- source_word: שִׂרְיֹן
  choice: Сирионом
  rationale: Собственное название передано транслитерацией и поставлено в требуемый русским управлением творительный падеж.
- source_word: וְהָאֱמֹרִי
  choice: а амореи
  rationale: Морфологически единственное число имеет собирательное значение; множественное «амореи» соответствует параллелизму и глаголу во множественном числе. Союз «а» естественно сопоставляет два народных названия.
- source_word: יִקְרְאוּ לוֹ
  choice: называют его
  rationale: Местоимение относится к Ермону; конструкция передана естественным русским оборотом именования.
- source_word: שְׂנִיר
  choice: Сениром
  rationale: Собственное название передано принятой русской транслитерацией и творительным падежом после «называют».
