  text: רַ֠ק נְשֵׁי/כֶ֣ם וְ/טַפְּ/כֶם֮ וּ/מִקְנֵ/כֶם֒ יָדַ֕עְתִּי כִּֽי מִקְנֶ֥ה רַ֖ב לָ/כֶ֑ם יֵֽשְׁבוּ֙ בְּ/עָ֣רֵי/כֶ֔ם אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: ru
  text: Только ваши жёны, дети[a] и скот — я знаю, что скота у вас много, — пусть останутся в ваших городах[b], которые я дал вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «малые дети»; еврейское слово может также обозначать находящихся на попечении членов семьи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «селениях»; еврейское слово обозначает населённые пункты разного размера.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: только
  rationale: Передаёт ограничение и вводит исключение из предшествующего повеления.
- source_word: נְשֵׁיכֶם
  choice: ваши жёны
  rationale: В контексте семей тех, кто должен идти на войну, речь идёт именно о жёнах, а не о женщинах вообще.
- source_word: טַפְּכֶם
  choice: дети
  rationale: Еврейское слово обозначает малых детей и шире — зависимых членов семьи; «дети» звучит естественно в современном русском, а более широкий оттенок отмечен в сноске.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: скот / скота много
  rationale: Слово охватывает домашних стадных животных вообще, а не только крупный рогатый скот; повтор сохраняет повтор исходного текста.
- source_word: יָדַעְתִּי כִּי
  choice: я знаю, что
  rationale: Прямо сохраняет утверждение от первого лица; пояснительный характер вставки передан тире.
- source_word: יֵשְׁבוּ
  choice: пусть останутся
  rationale: Глагол буквально означает «сидеть, жить», но здесь обозначает тех, кто остаётся в поселениях, пока воины переходят Иордан.
- source_word: בְּעָרֵיכֶם
  choice: в ваших городах
  rationale: עִיר обозначает населённый пункт и может переводиться как «город» или «селение»; традиционное «городах» естественно в данном контексте, а диапазон значения отмечен в сноске.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: которые я дал вам
  rationale: Сохраняет совершённость действия и прямую относительную конструкцию еврейского текста.
