  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: ru
  text: Не бойтесь их[a], ибо Яхве, ваш Бог, сам сражается за вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не страшитесь их».'
    reason: 'Лексическая альтернатива для ירא: глагол может передаваться как «бояться» или «страшиться».'
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: Не бойтесь их
  rationale: Отрицание לֹא с формой 2-го лица множественного числа выражает запрет, а объектный суффикс 3-го лица множественного числа передан местоимением «их». Такое выражение точно и естественно по-русски.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего запрета; «потому что» ясно передаёт причинное значение в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, поскольку в еврейском тексте непосредственно стоит тетраграмматон.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В данном контексте אֱלֹהִים обозначает Бога Израиля в единственном числе; суффикс 2-го лица множественного числа передан словом «ваш».
- source_word: הוּא
  choice: Он сам
  rationale: Самостоятельное местоимение имеет усилительную функцию. «Он сам» естественно сохраняет это смысловое ударение.
- source_word: הַנִּלְחָם
  choice: сражается
  rationale: Причастная форма от לחם изображает Яхве как того, кто ведёт сражение; настоящее время передаёт продолжающееся или характерное действие.
- source_word: לָכֶם
  choice: за вас
  rationale: Предлог ל обозначает действие в пользу адресатов. В сочетании с «сражается» русский оборот «за вас» точно и естественно выражает значение «ради вас, на вашей стороне».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога, поэтому оно сохранено как «Яхве», без подмены титулом.
- issue: Усилительное значение הוּא
  choice: Он сам
  alternative: Он
  rationale: Формулировка «Он сам» сохраняет подчёркнутую мысль о том, что именно Яхве сражается за Израиль, не добавляя утверждения сверх текста.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и общедоступной формулировкой. Тире выделяет усилительное «Он сам» и сохраняет акцент еврейского самостоятельного местоимения.
