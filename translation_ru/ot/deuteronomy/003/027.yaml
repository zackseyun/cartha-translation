base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: ru
  text: Поднимись на вершину Фасги, подними глаза и посмотри на запад[a], на север, на юг и на восток; посмотри собственными глазами, ибо ты не перейдёшь через этот Иордан.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «к морю» — обычное обозначение направления на запад.'
    reason: cultural_note
  - marker: b
    text: 'Или: «через эту реку Иордан». В еврейском тексте буквально: «этот Иордан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Поднимись
  rationale: Повелительная форма глагола עלה прямо выражает движение вверх; «поднимись» естественно и точно передаёт команду.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: на вершину Фасги
  rationale: רֹאשׁ здесь означает верх или вершину, а הַפִּסְגָּה — географическое название Фасга. Такой перевод естественен в современном русском.
- source_word: וְשָׂא עֵינֶיךָ
  choice: обведи взглядом
  rationale: Буквально «подними глаза»; в сочетании с перечислением четырёх сторон света русский оборот «обведи взглядом» естественно передаёт направленное обозрение, не устраняя последующее усиление «своими глазами».
- source_word: יָמָּה וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: запад, север, юг и восток
  rationale: Направительные формы обозначают стороны света. Существительные после «обведи взглядом» дают естественную русскую конструкцию; יָמָּה передано по принятому географическому значению «на запад», буквально «к морю».
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: посмотри своими глазами
  rationale: Повтор упоминания глаз в еврейском тексте имеет выразительную силу. «Своими глазами» сохраняет акцент на личном зрительном восприятии.
- source_word: כִּי לֹא תַעֲבֹר
  choice: потому что ты не перейдёшь
  rationale: כִּי вводит основание повеления, а עבר применительно к Иордану естественно переводится «перейти».
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: через этот Иордан
  rationale: Сохранено указательное הַזֶּה («этот»). Предлог «через» требуется русским управлением глагола «перейти»; слово «река» подразумевается, как и в еврейском тексте.
