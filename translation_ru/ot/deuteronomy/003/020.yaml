source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: ru
  text: пока Яхве не даст покой и вашим братьям[a], как вам, и они тоже не овладеют землёй, которую Яхве, ваш Бог, даёт им за Иорданом[b]. Тогда каждый из вас возвратится в своё владение[c], которое я дал вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашим соплеменникам-израильтянам». В еврейском тексте буквально: «вашим братьям».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по ту сторону Иордана». Выражение зависит от местонахождения говорящего, находившегося к востоку от реки.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в свой удел» или «в своё наследственное владение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: даст покой
  rationale: Порода hифиль глагола נוח означает «дать покой, успокоение». Эта формулировка сохраняет важную для Второзакония тему безопасной и мирной жизни в земле.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לַאֲחֵיכֶם
  choice: вашим братьям
  rationale: Сохраняет мужской термин родства, которым здесь названы соплеменники-израильтяне; более явное смысловое толкование дано в сноске.
- source_word: כָכֶם
  choice: как вам
  rationale: 'Сохраняет краткое, эллиптическое сравнение еврейского текста: Яхве даст остальным тот же покой, который уже дан адресатам.'
- source_word: וְיָרְשׁוּ
  choice: не овладеют
  rationale: В контексте получения земли ירשׁ обозначает вступление во владение; конструкция «пока… не» естественно передаёт временной предел в русском языке.
- source_word: נֹתֵן
  choice: даёт
  rationale: Настоящее время передаёт причастную форму и представляет дарование земли как совершающееся и несомненное действие.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Естественное русское пространственное выражение, понимаемое относительно места Моисея и адресатов к востоку от реки.
- source_word: וְשַׁבְתֶּם אִישׁ
  choice: Тогда каждый из вас возвратится
  rationale: Передаёт последовательность событий и распределительное значение אִישׁ, не утяжеляя фразу буквальным «каждый мужчина».
- source_word: לִירֻשָּׁתוֹ
  choice: в своё владение
  rationale: Обозначает выделенный человеку земельный удел как принадлежащую ему собственность; вариант «удел» отмечен в сноске.
- source_word: נָתַתִּי לָכֶם
  choice: которое я дал вам
  rationale: Прошедшее время естественно передаёт завершённое предоставление заиорданской земли Моисеем.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение «покоя»
  choice: даст покой
  alternative: даст мир; даст облегчение
  rationale: «Покой» сохраняет богословски значимую формулировку Второзакония и не сужает её только до прекращения войны или временного облегчения.
- issue: Мужская форма לַאֲחֵיכֶם и распределительное אִישׁ
  choice: «братьям»; «каждый из вас»
  alternative: «соплеменникам»; «каждый мужчина»
  rationale: «Братьям» сохраняет образ родства в Израиле, а «каждый из вас» естественно передаёт распределительную функцию אִישׁ в обращении к мужчинам, не добавляя нового уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для широкого читателя; повтор имени «Яхве» и образ «покоя» сохранены. Все сноски поставлены непосредственно после слов, к которым относятся.
