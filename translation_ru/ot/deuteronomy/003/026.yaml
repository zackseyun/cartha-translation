base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: ru
  text: 'Но Яхве разгневался на меня из-за вас[a] и не внял мне. И Яхве сказал мне: «Довольно с тебя[b]! Больше не говори со Мной об этом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради вас»; «по вашей причине».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Довольно тебе» — резкая формула, прекращающая дальнейшее обращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: разгневался
  rationale: Форма глагола עבר в данном устойчивом обороте выражает гнев Яхве на Моисея. «Разгневался» точно передаёт силу выражения и соответствует современному литературному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: בִּי
  choice: на меня
  rationale: При русском глаголе «разгневаться» управление «на меня» естественно передаёт направленность гнева.
- source_word: לְמַעַנְכֶם
  choice: из-за вас
  rationale: В контексте выражение указывает на причину гнева Яхве; «из-за вас» передаёт это прямо и естественно.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: и не послушал меня
  rationale: שׁמע с אֶל здесь означает не просто услышать, а внять просьбе. «Не послушал меня» сохраняет этот смысл без добавочного толкования.
- source_word: רַב לָךְ
  choice: Довольно с тебя!
  rationale: Краткий идиоматический оборот выражает резкое прекращение разговора. Русская формула сохраняет обращённость к Моисею и категоричность ответа.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: Больше не говори
  rationale: Сочетание יסף с инфинитивом и עוֹד запрещает продолжать или повторять речь; «больше не говори» передаёт конструкцию естественным русским языком.
- source_word: בַּדָּבָר הַזֶּה
  choice: об этом
  rationale: В данном контексте דָּבָר обозначает обсуждаемый вопрос — просьбу Моисея. Краткое «об этом» ясно и не утяжеляет прямую речь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Еврейский текст непосредственно употребляет тетраграмматон. Передача «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Связь гнева Яхве с народом
  choice: из-за вас
  alternative: ради вас; по вашей вине
  rationale: לְמַעַנְכֶם допускает оттенки «ради вас» и «из-за вас». Контекст поддерживает причинное прочтение, но примечание сохраняет лексическую неоднозначность и не усиливает выражение до прямого обвинения «по вашей вине».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прямая речь кратка и категорична, как в еврейском тексте; местоимение «Мной» написано с прописной буквы в соответствии с устойчивой русской религиозной издательской практикой.
