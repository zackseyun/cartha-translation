source:
  edition: WLC
  text: וְ/לָ/רֻאוּבֵנִ֨י וְ/לַ/גָּדִ֜י נָתַ֤תִּי מִן הַ/גִּלְעָד֙ וְ/עַד נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַ/נַּ֖חַל וּ/גְבֻ֑ל וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: ru
  text: А рувимлянам и гадитянам я отдал земли от Галаада до долины Арнона[a] — граница проходила по середине долины, — и до долины Иавока, границы сынов Аммона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово נחל может обозначать поток, вади (временный водоток), его русло или связанную с ним долину. Здесь выбрано слово «долина», поскольку далее сказано, что граница проходила по её середине.
    reason: lexical_alternative
  - marker: b
    text: 'То есть аммонитян. Буквально по-еврейски: «сынов Аммона» — родственное обозначение народа Аммона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: рувимлянам и гадитянам
  rationale: Формы обозначают племенные группы, а не их родоначальников. Современные русские этнонимы кратко и точно передают этот смысл.
- source_word: נָתַתִּי
  choice: я отдал земли
  rationale: Глагол буквально означает «дал». Слово «земли» добавлено как подразумеваемое дополнение, необходимое для естественной русской фразы в контексте распределения территории.
- source_word: מִן הַגִּלְעָד וְעַד נַחַל אַרְנֹן
  choice: от Галаада до долины Арнона
  rationale: Сохраняется обозначенный предлогами пространственный диапазон. נחל допускает значения водотока, русла и связанной с ним долины; здесь «долина» хорошо сочетается с последующим указанием на проходящую по её середине границу.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: граница проходила по середине долины
  rationale: Краткая еврейская конструкция поясняет, что середина долины служила линией границы. Формулировка передаёт это отношение естественно по-русски, не меняя топографического смысла.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: и до долины Иавока
  rationale: То же слово נחל передано последовательно как «долина»; традиционная русская форма топонима — «Иавок».
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: границы сынов Аммона
  rationale: Сохранено еврейское родственное обозначение народа Аммона и приложение, согласно которому долина Иавока являлась его границей.
