  terminology: «Изнурительная болезнь», «лихорадка», «воспаление», «жгучий зной», «меч» и «ржавчина» допустимы. «Ржавчина» является контекстуально понятным названием болезни посевов для יֵרָקוֹן, хотя древний термин допускает более широкое значение пожелтения. Имя יהוה последовательно передано как «Яхве».
