base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: ru
  text: Яхве поразит тебя изнурительной болезнью[a], лихорадкой, воспалением, жгучим зноем, мечом, суховеем и ржавчиной; и они[b] будут преследовать тебя, пока ты не погибнешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чахоткой»; еврейское слово обозначает изнуряющую болезнь, от которой человек чахнет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и эти бедствия будут преследовать тебя»; еврейский глагол стоит во множественном числе и относится к перечисленным бедствиям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: поразит тебя
  rationale: Hiphil глагола נכה передаёт прямое поражающее действие; «поразит тебя» естественно и сохраняет обращение во втором лице единственного числа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена титулом.
- source_word: שַׁחֶפֶת
  choice: изнурительной болезнью
  rationale: Слово обозначает тяжёлую болезнь, при которой человек чахнет; формулировка не вводит неоправданно точного диагноза.
- source_word: קַּדַּחַת
  choice: лихорадкой
  rationale: Существительное обозначает лихорадочное состояние; это ясный современный эквивалент.
- source_word: דַּלֶּקֶת
  choice: воспалением
  rationale: Слово связано с горением и воспалением; перевод отличает его от соседних обозначений жара.
- source_word: חַרְחֻר
  choice: жгучим зноем
  rationale: Редкое слово, вероятно обозначающее палящий жар или жгучую горячку; «жгучий зной» сохраняет образ жара и не дублирует «лихорадку».
- source_word: חֶרֶב
  choice: мечом
  rationale: Буквальное и прозрачное обозначение оружия, которое также может подразумевать насильственную смерть или войну.
- source_word: שִׁדָּפוֹן
  choice: засухой
  rationale: Термин обозначает иссушающее поражение посевов, связанное с палящим ветром или жаром; «засуха» естественно передаёт результат, не смешивая его со следующей растительной болезнью.
- source_word: יֵרָקוֹן
  choice: ржавчиной
  rationale: В сельскохозяйственном контексте это болезненное пожелтение или бледность растений; традиционное «ржавчина» понятно как поражение посевов, но степень ботанической точности остаётся ограниченной.
- source_word: וּרְדָפוּךָ
  choice: и они будут преследовать тебя
  rationale: Глагол стоит во множественном числе и отсылает к перечисленным бедствиям; местоимение сохраняет грамматическое число оригинала.
- source_word: עַד אָבְדֶךָ
  choice: пока ты не погибнешь
  rationale: Оборот с אבד выражает окончательную гибель; перевод краток и сохраняет личное обращение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено личное имя; транслитерация «Яхве» сохраняет его и не подменяет титулом.
- issue: Субъект множественного глагола וּרְדָפוּךָ
  choice: они — перечисленные бедствия
  alternative: 'собирательное безличное: «всё это будет преследовать тебя»'
  rationale: Множественное число глагола естественно соотносится с рядом болезней и бедствий; явное «они» сохраняет грамматическую особенность и образ неотступного преследования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Перечень сохранён ритмичным и прямым; редкие древнееврейские сельскохозяйственные термины переданы общеупотребительными словами с указанием неопределённости в сноске.
