    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב בְּךָ
  choice: И Он снова наведёт на тебя
  rationale: Порода hифиль глагола שוב выражает причинительное значение «возвратить, снова привести»; в сочетании с болезнями естественное русское «снова наведёт на тебя» передаёт повторное ниспослание бедствия.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: все египетские болезни
  rationale: מַדְוֶה означает болезнь или недуг. Прилагательное «египетские» естественно передаёт конструкцию принадлежности и не уточняет сверх исходного текста характер болезней.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: которых ты боялся
  rationale: יגר обозначает страх; оборот с מִפְּנֵיהֶם буквально указывает на страх перед ними. «Которых ты боялся» ясно и естественно сохраняет отнесение местоимения к болезням.
- source_word: וְדָבְקוּ בָּךְ
  choice: и они пристанут к тебе
  rationale: דבק означает прилипать, держаться, неотступно прилепляться. «Пристанут к тебе» сохраняет яркий образ стойкого прикрепления и звучит естественно в современном русском.
theological_decisions:
- issue: Подлежащее глагола וְהֵשִׁיב прямо не названо в стихе
  choice: Он
  alternative: Господь
  rationale: Форма глагола указывает на мужское лицо единственного числа, а контекст называет действующим лицом Господа; местоимение сохраняет связность с контекстом и не добавляет отсутствующего здесь имени.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского предупреждения. Синтаксис остаётся ясным для широкого читателя; образное значение דבק сохранено без архаичного «прилепятся» в основном тексте.
