  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: ru
  text: И Он снова наведёт на тебя все болезни Египта[a], которых ты боялся[b], и они прильнут к тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все недуги Египта».'
    reason: lexical_alternative
  - marker: b
