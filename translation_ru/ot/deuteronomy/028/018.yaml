  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: ru
  text: Прокляты будут плод твоего чрева и плод твоей земли, приплод твоего крупного скота и приплод твоих стад.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В двух последних выражениях речь идёт о приплоде домашнего скота: сначала крупного рогатого скота, затем стад овец и коз.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Прокляты будут
  rationale: Предикативное прилагательное в формуле проклятия; будущее время естественно передаёт провозглашение последствий завета и согласуется с рядом однородных подлежащих.
- source_word: פְּרִי בִטְנְךָ
  choice: плод твоего чрева
  rationale: Сохраняет древнееврейскую метафору потомства и торжественный, но понятный библейский оборот.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: и плод твоей земли
  rationale: Сохраняет лексический параллелизм с «плодом чрева»; «земля» естественно обозначает возделываемую почву и её урожай.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: приплод твоего крупного скота
  rationale: שְׁגַר обозначает произведённый скотом приплод, а אֲלָפֶיךָ в данном контексте — крупный рогатый скот.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: и приплод твоих стад
  rationale: Выражение обозначает приплод мелкого скота; «стада» сохраняет собирательный смысл צֹאן, а повтор «приплод» ясно передаёт параллельную конструкцию.
