base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: ru
  text: Яхве поразит тебя безумием, слепотой и смятением сердца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растерянностью сердца»; возможно также: «ужасом в сердце».'
    reason: Лексема תִמְהוֹן допускает оттенки смятения, растерянности, ошеломления и ужаса.
lexical_decisions:
- source_word: יַכְּכָה
  choice: поразит тебя
  rationale: Форма глагола נכה передаёт нанесение удара или поражение бедствием. «Поразит тебя» естественно звучит по-русски и сохраняет силу формулы проклятия завета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: בְּשִׁגָּעוֹן
  choice: безумием
  rationale: שִׁגָּעוֹן обозначает безумие или расстройство рассудка; «безумием» — прямой и уместный здесь эквивалент.
- source_word: וּבְעִוָּרוֹן
  choice: слепотой
  rationale: עִוָּרוֹן буквально означает слепоту. Перевод не уточняет, физическая она или образная, сохраняя неопределённость оригинала.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: и смятением сердца
  rationale: תִמְהוֹן выражает ошеломление, растерянность или смятение, а לֵבָב — сердце как средоточие внутренней жизни и мысли. «Смятение сердца» сохраняет образ оригинала и естественно звучит в современном литературном русском.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Характер перечисленных поражений
  choice: Не уточнять, являются ли слепота и смятение физическими, душевными или образными
  alternative: Истолковать всё перечисление как психические состояния
  rationale: Еврейский текст прямо называет безумие, слепоту и смятение сердца, но не устраняет возможную смысловую широту слова «слепота».
translation_notes:
  register: Современный литературный русский с кратким, торжественным ритмом. Сохранены трёхчастное перечисление, образ «сердца» и личное имя Яхве; архаизмы исключены.
