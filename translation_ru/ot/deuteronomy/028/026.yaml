base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: ru
  text: Твой труп[a] станет пищей для всех птиц небес и зверей земли[b], и никто не будет их отпугивать[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоё мёртвое тело». Еврейское слово в контексте этого проклятия имеет унизительный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всякой птице небес и зверям земли». Эта устойчивая пара подчёркивает полную беззащитность и бесчестие.'
    reason: cultural_note
  - marker: c
    text: То есть никто не отгонит птиц и зверей, пожирающих тело.
    reason: clarification
lexical_decisions:
- source_word: וְהָיְתָה
  choice: станет
  rationale: В контексте проклятий эта форма выражает будущее следствие; с לְמַאֲכָל естественная русская конструкция — «станет пищей».
- source_word: נִבְלָתְךָ
  choice: твой труп
  rationale: Слово обозначает мёртвое тело и в данном контексте несёт оттенок унижения. «Труп» сохраняет суровость высказывания и остаётся естественным в современном русском языке.
- source_word: לְמַאֲכָל
  choice: пищей
  rationale: Существительное обозначает пищу или то, что поедают; творительный падеж в конструкции «станет пищей» точно и естественно передаёт результативное значение לְ.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: для всех птиц в небе
  rationale: Собирательное עוֹף естественно передано русским множественным числом. Оборот «в небе» понятен современному читателю и не создаёт возможной двусмысленности выражения «небесные птицы».
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: и зверей на земле
  rationale: בְּהֵמָה здесь собирательно обозначает наземных животных. «Звери» сохраняет угрожающий тон, а «на земле» образует естественную пару с «в небе».
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не будет их отпугивать
  rationale: Причастие в породе hифиль означает заставлять бояться, пугать. По контексту речь идёт об отпугивании птиц и зверей от тела; местоимение «их» делает подразумеваемый объект ясным.
