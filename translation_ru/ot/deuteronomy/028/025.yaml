base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: ru
  text: Яхве отдаст тебя на поражение перед твоими врагами. Одним путём ты выступишь против них, а семью путями побежишь от них и станешь ужасом[a] для всех царств земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предметом ужаса». Еврейское слово может обозначать как ужас, так и то, что вызывает ужас или страх.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: предаст тебя на поражение
  rationale: Сочетание נתן с נִגָּף в контексте военного проклятия означает, что адресат будет отдан врагам и потерпит поражение. Формулировка сохраняет образ «отдать/предать», не сводя его к простому «сделает».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: твоим врагам
  rationale: В данном военном контексте выражение «перед твоими врагами» обозначает поражение от них; дательный падеж естественно сочетается по-русски с оборотом «предаст на поражение».
- source_word: בְּדֶרֶךְ אֶחָד
  choice: одним путём
  rationale: Сохраняет конкретный образ единого, организованного выступления и параллель с «семью путями».
- source_word: תֵּצֵא אֵלָיו
  choice: ты выступишь против них
  rationale: Глагол יצא с אל в военном контексте означает выход навстречу противнику для сражения. Множественное местоимение согласовано с собирательным обозначением врагов и естественно для русского языка.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: а семью путями
  rationale: Сохраняет числовой контраст одного пути наступления и семи путей бегства, передающий полный разгром и рассеяние.
- source_word: תָּנוּס לְפָנָיו
  choice: побежишь от них
  rationale: Передаёт значение נוס «бежать, спасаться бегством» и естественно выражает удаление от победившего противника.
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: станешь ужасом
  rationale: זַעֲוָה может обозначать ужас либо то, что его вызывает. Краткая формулировка сохраняет эту смысловую напряжённость; более явное объектное понимание дано в примечании.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: для всех царств земли
  rationale: Передаёт широкий международный охват формулы и сохраняет традиционный, но современно понятный образ «царств земли».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл לְזַעֲוָה
  choice: станешь ужасом
  alternative: станешь предметом ужаса; станешь страшилищем
  rationale: Выбранный вариант допускает как состояние, внушающее ужас, так и понимание Израиля как зрелища, вызывающего ужас, не вводя лишнего толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены обращение к Израилю во втором лице единственного числа, образ одного и семи путей и широкая формула «все царства земли»; синтаксис сделан естественным для современного читателя.
