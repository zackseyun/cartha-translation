translation:
  language: ru
  text: тогда Яхве обрушит на тебя и твоё потомство необычайные[a], великие и продолжительные[b] кары, а также тяжёлые и продолжительные болезни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поразительные». Еврейский глагол означает сделать что-либо необычайным, исключительным; здесь речь идёт об исключительном характере и тяжести суда.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать «стойкие», «неотступные» или «долговременные». Одно и то же слово относится и к карам, и к болезням.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: обрушит ... необычайные
  rationale: Каузативная форма от פלא придаёт карам характер исключительных, необычайных бедствий. По-русски сочетание «обрушит ... необычайные кары» естественно передаёт и действие Бога, и усилительное значение глагола, не внося положительного оттенка слова «чудесные».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: кары
  rationale: מכה означает удар, поражение или бедствие. В контексте проклятий за нарушение завета «кары» ясно передаёт бедствия, посылаемые как наказание.
- source_word: זַרְעֶךָ
  choice: твоё потомство
  rationale: Передаёт собирательное значение זרע естественным современным русским выражением.
- source_word: גְּדֹלוֹת
  choice: великие
  rationale: Сохраняет основное значение прилагательного и допускает оттенок как масштаба, так и тяжести бедствий.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: продолжительные
  rationale: В данном контексте формы от אמן описывают твёрдо удерживающиеся, стойкие, не проходящие быстро бедствия и болезни. Одинаковый перевод сохраняет повтор исходного текста.
- source_word: חֳלָיִם
  choice: болезни
  rationale: Обычное современное обозначение заболеваний; множественное число сохранено.
- source_word: רָעִים
  choice: тяжёлые
  rationale: Применительно к болезням רָעִים означает мучительные, опасные или тяжёлые, а не нравственно злые.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, данное в еврейском тексте, и не подменяет его титулом.
- issue: Значение פלא в контексте суда
  choice: необычайные кары
  alternative: поразительные кары; чудесные кары; особенно тяжкие кары
  rationale: Сохранена идея исключительности и вызывающего изумление характера наказания без положительной окраски и без сведения значения исключительно к степени тяжести.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Конструкция перестроена ради естественности: буквальное «сделает необычайными твои поражения» передано как «обрушит на тебя ... необычайные кары». Повтор характеристики «продолжительные» сохранён.'
