  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: ru
  text: И будешь ты ощупью ходить в полдень, как слепой ощупью ходит во тьме[a], и не будет тебе успеха на твоих путях[b]. Во все дни ты будешь лишь угнетён и ограблен, и некому будет спасти тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь шарить руками»; еврейский глагол означает искать путь или предметы на ощупь, когда невозможно видеть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты не преуспеешь ни в чём, что делаешь».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «избавить тебя»; буквально: «и нет спасающего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: ощупью ходить / ощупью ходит
  rationale: Глагол обозначает движение или поиски на ощупь из-за невозможности видеть. Русское выражение передаёт конкретный физический образ и метафорическую беспомощность.
- source_word: בַּצָּהֳרַיִם
  choice: в полдень
  rationale: Обозначает самое светлое время дня; перевод сохраняет резкий контраст с тьмой.
- source_word: הָעִוֵּר
  choice: слепой
  rationale: Субстантивированное прилагательное мужского рода единственного числа естественно передаётся русским «слепой» без добавления отсутствующего в тексте существительного.
- source_word: בָּאֲפֵלָה
  choice: во тьме
  rationale: Краткое и образное соответствие слову со значением тьмы или мрака; сохраняет противопоставление полудню.
- source_word: תַצְלִיחַ אֶת דְּרָכֶיךָ
  choice: не будет тебе успеха на твоих путях
  rationale: Сохраняет широкий смысл успеха или преуспевания и образ «путей» как жизненного хода и начинаний.
- source_word: אַךְ
  choice: лишь
  rationale: 'Передаёт ограничительно-усилительное значение: положение адресата будет сводиться только к угнетению и ограблению.'
- source_word: עָשׁוּק
  choice: угнетён
  rationale: Пассивное причастие означает подвергаемого угнетению, притеснению или эксплуатации; «угнетён» сохраняет широкий смысл.
- source_word: גָזוּל
  choice: ограблен
  rationale: Пассивное причастие указывает на лишение имущества посредством кражи или насильственного захвата; современное «ограблен» ясно передаёт это.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Близко передаёт буквальную форму и подчёркивает непрерывность состояния без добавления отсутствующего притяжательного местоимения.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: и некому будет спасти тебя
  rationale: Естественная русская конструкция передаёт отсутствие любого избавителя; «спасти» здесь употреблено в обычном смысле избавления от беды.
theological_decisions:
- issue: Значение מוֹשִׁיעַ в контексте проклятий завета
  choice: спасти
  alternative: избавить; прийти на помощь
  rationale: Корень יָשַׁע здесь обозначает практическое спасение или избавление от угнетения, а не вводит специальный мессианский титул. Выбор сохраняет широкое значение без привнесения позднейших доктринальных выводов.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Повтор «ощупью» сохраняет риторическую структуру оригинала; перестановка обстоятельства «во все дни» делает длительность естественно заметной по-русски. Обращение оставлено во втором лице единственного числа, как в еврейском тексте.
