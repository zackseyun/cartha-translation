source:
  edition: WLC
  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: ru
  text: И не уклоняйся[a] ни от одного из слов, которые я заповедую вам сегодня, ни вправо, ни влево, чтобы пойти вслед за другими богами и служить им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь единственное число: обращение к Израилю как к единому народу; далее «вам» стоит во множественном числе.'
    reason: grammatical_clarification
  - marker: b
    text: 'Или: «поклоняться им». Глагол означает служение, а по отношению к божеству — также религиозное поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: не уклоняйся
  rationale: Глагол סור означает «сворачивать, уклоняться, отступать». «Не уклоняйся» естественно передаёт запрет отступать от заповеданного пути и сохраняет пространственный образ, продолженный словами «ни вправо, ни влево».
- source_word: מִכָּל הַדְּבָרִים
  choice: ни от одного из слов
  rationale: 'При отрицании מִכָּל имеет распределительный смысл: нельзя отступать ни от какой части сказанного. «Слов» сохраняет прямое значение דְּבָרִים, а их характер как повелений раскрывает следующее придаточное.'
- source_word: מְצַוֶּה ... הַיּוֹם
  choice: заповедую ... сегодня
  rationale: Причастие מְצַוֶּה передаёт совершающееся в момент речи наставление Моисея; настоящее время и «сегодня» сохраняют непосредственность заветного обращения.
- source_word: יָמִין וּשְׂמֹאול
  choice: ни вправо, ни влево
  rationale: Устойчивый пространственный образ обозначает отклонение в любую сторону. В русском отрицательном предложении парная конструкция «ни… ни…» звучит естественно.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: чтобы пойти вслед за
  rationale: Сохранён образ буквального «идти вслед за», который в данном контексте означает последовать за иными богами. Инфинитив передаёт направленность или результат уклонения, не превращая его в отдельное независимое повеление.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другими богами
  rationale: Это прямое соответствие еврейскому выражению; вариант «чужими богами» был бы более интерпретирующим.
- source_word: לְעָבְדָם
  choice: служить им
  rationale: עבד обозначает служение, а применительно к божеству включает религиозное поклонение. «Служить» сохраняет более широкий смысл верности и культового служения.
theological_decisions:
- issue: Упоминание других божеств в предостережении завета
  choice: другими богами
  alternative: чужими богами
  rationale: Перевод сохраняет обычную для Второзакония формулировку и не вводит отсутствующего в самом стихе разъяснения об онтологическом статусе этих богов.
- issue: Значение религиозного служения
  choice: служить им
  alternative: поклоняться им
  rationale: Основной перевод сохраняет лексически более широкое значение עבד, тогда как сноска отмечает несомненную в данном контексте связь с поклонением.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства заветного обращения. Единственное число «не уклоняйся» намеренно сохраняет грамматику еврейского текста и коллективное обращение к Израилю; смена на множественное «вам» не сглажена. Пространственная метафора и лексическая широта слова «служить» сохранены.
