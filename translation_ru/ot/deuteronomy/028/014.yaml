  terminology: «Другие боги» — прямое, нейтральное соответствие אֱלֹהִים אֲחֵרִים. «Служить им» корректно сохраняет широту עבד в религиозном контексте; сноска обоснованно указывает «поклоняться им» как возможное контекстуальное выражение. Все имеющиеся маркеры сносок стоят при релевантных элементах.
