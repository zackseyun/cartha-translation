base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: ru
  text: так что он не даст никому из них ничего от плоти своих сыновей[a], которых он будет есть, потому что у него ничего не останется, — во время осады и бедствия, которыми твой враг будет теснить тебя во всех твоих городах.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновей»; в еврейском тексте здесь употреблено слово мужского рода, а не общее слово «дети».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во всех твоих воротах»; городские ворота здесь обозначают сами города.'
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: так что он не даст никому из них
  rationale: Конструкция с מִן и инфинитивом продолжает предыдущее описание и выражает отказ дать или поделиться; «так что он не даст» естественно связывает стих с предыдущим контекстом, а «никому из них» передаёт распределительное значение буквально «одному из них».
- source_word: מִבְּשַׂר בָּנָיו
  choice: ничего от плоти своих сыновей
  rationale: Сохраняются конкретное, намеренно страшное слово «плоть» и мужской род בָּנָיו — «сыновей». «Ничего от» естественно передаёт частичное значение предлога מִן в сочетании с последующим указанием на полное отсутствие пищи.
- source_word: אֲשֶׁר יֹאכֵל
  choice: которую сам будет есть
  rationale: Имперфект описывает действие в предстоящем сценарии проклятия. Будущее время согласуется с контекстом, а «сам» ясно подчёркивает отказ делиться, не меняя смысла.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: потому что у него ничего не останется
  rationale: Оборот сообщает о полном отсутствии оставшегося у него и в контексте объясняет его отказ делиться. Русская причинная конструкция передаёт эту связь естественно.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: во время осады и бедствия
  rationale: מָצוֹר означает осаду, а מָצוֹק — тесноту, тяжкое бедствие или крайнее лишение. Такое сочетание сохраняет интенсивность и звучит естественно по-русски.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: которыми твой враг будет теснить тебя
  rationale: Форма от צוּק выражает причинение тесноты и тяжёлого давления. «Теснить» сохраняет связь с осадой и не сужает смысл до одной лишь эмоции.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: во всех твоих городах
  rationale: Буквально сказано «во всех твоих воротах», но «ворота» здесь метонимически обозначают города и поселения. В основном тексте выбран понятный современному читателю смысл, а образ отмечен в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и ужаса исходного предупреждения. Стих синтаксически продолжает предыдущий, поэтому начинается со строчной буквы и связки «так что». Образ «плоти» сохранён без смягчения; древнееврейская метонимия «ворота» раскрыта в основном тексте как «города» и отмечена сноской.
