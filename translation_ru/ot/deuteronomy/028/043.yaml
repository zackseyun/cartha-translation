  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: ru
  text: Иностранец, живущий среди вас,[a] будет подниматься над вами всё выше и выше, а вы будете опускаться всё ниже и ниже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришелец»; еврейское слово обозначает не-израильтянина, живущего среди Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: переселенец
  rationale: Еврейское גֵּר обозначает не уроженца страны, постоянно живущего среди Израиля. «Переселенец» естественно звучит по-русски и передаёт статус проживающего среди народа чужеземца, не сводя значение к случайному приезжему.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: который живёт среди вас
  rationale: Оборот указывает на присутствие переселенца внутри общины. Добавление «живёт» естественно раскрывает подразумеваемое постоянное проживание и значение существительного גֵּר.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: будет подниматься над вами
  rationale: Сохраняется пространственная метафора עלה с על, выражающая возвышение переселенца по отношению к Израилю без неоправданного сужения до экономической или политической области.
- source_word: מַעְלָה מָּעְלָה
  choice: всё выше и выше
  rationale: Повтор наречия передаёт непрерывное усиление восхождения; русская конструкция сохраняет повтор и звучит естественно.
- source_word: וְאַתָּה
  choice: а вы
  rationale: Хотя ו формально является соединительным союзом, контекст создаёт резкое противопоставление. Русское «а» естественно выражает этот контраст.
- source_word: תֵרֵד
  choice: будете опускаться
  rationale: Глагол сохраняет образ движения вниз и образует ясную смысловую пару с «будет подниматься».
- source_word: מַטָּה מָּטָּה
  choice: всё ниже и ниже
  rationale: Русская повторная конструкция точно передаёт усилительное повторение и симметрично противопоставлена словам «всё выше и выше».
theological_decisions:
- issue: Перемена общественного положения в контексте проклятий за нарушение завета
  choice: 'Сохранить широкий образ: живущий среди Израиля переселенец возвышается над ним, а Израиль опускается.'
  alternative: Истолковать восхождение и падение исключительно как экономическое обогащение и обнищание либо только как политическое господство.
  rationale: Еврейский текст не уточняет область перемены положения. Общая метафора допускает социальное, экономическое и политическое измерения, поэтому перевод не сужает её.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллелизм и повтор исходного текста сохранены; местоимение единственного числа по отношению к собирательному Израилю естественно передано русским множественным числом.
