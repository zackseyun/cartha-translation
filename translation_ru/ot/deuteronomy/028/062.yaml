base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: ru
  text: И вас останется совсем немного[a], хотя вы стали многочисленны, как звёзды небесные[b], потому что ты не слушал голоса Яхве, твоего Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди малочисленности»; это еврейская идиома, означающая, что людей останется совсем мало.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «тогда как вы были многочисленны, как звёзды небесные».'
    reason: alternative_reading
  - marker: c
    text: Еврейское выражение «слушать голос» в языке завета также означает слушаться, повиноваться. Здесь текст переходит от обращения ко многим («вас», «вы») к обращению к Израилю как к единому целому («ты», «твоего»).
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: И останется вас
  rationale: Нифаль глагола שׁאר обозначает тех, кто останется после утраты или суда. Безличная русская конструкция сохраняет результативно-пассивный смысл и звучит естественно.
- source_word: בִּמְתֵי מְעָט
  choice: совсем немного
  rationale: Это идиома, означающая малочисленность, а не только малое число мужчин. Слово «совсем» естественно передаёт усиленный смысл выражения.
- source_word: תַּחַת אֲשֶׁר
  choice: хотя
  rationale: В данном контексте оборот противопоставляет прежнюю многочисленность будущему сокращению народа; уступительное «хотя» ясно и естественно выражает этот контраст.
- source_word: הֱיִיתֶם
  choice: вы стали
  rationale: 'Форма היה допускает значение достигнутого состояния: Израиль стал многочисленным. Такой перевод подчёркивает историческое умножение народа, не превращая его в статичное описание.'
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: многочисленны, как звёзды небесные
  rationale: Передаётся как сравнение, так и количественное значение לָרֹב; выражение сохраняет узнаваемый язык заветных обетований и остаётся понятным современному читателю.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: потому что ты не слушал голоса
  rationale: Сочетание שׁמע בְּקוֹל буквально связано со слушанием, но в языке завета также означает послушание. Перевод сохраняет исходный образ и не устраняет эту смысловую напряжённость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохранена обычная формула заветных отношений и единственное число местоимения в коллективном обращении к Израилю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Переход от множественного числа к единственному в обращении
  choice: 'Сохранить: «вас… вы… ты… твоего»'
  alternative: 'Согласовать всё во множественном числе: «вы не слушали… вашего Бога»'
  rationale: Еврейский текст переходит от множественного обращения к коллективному единственному, представляя Израиль как единый народ. Русский перевод сохраняет этот заметный переход, не сглаживая структуру оригинала.
- issue: Значение שׁמע בְּקוֹל
  choice: «не слушал голоса»
  alternative: «не повиновался»
  rationale: В контексте завета выражение подразумевает повиновение, однако буквальный образ слушания важен и сам несёт этот оттенок. Поэтому он сохранён в основном тексте, а значение пояснено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Выражение «звёзды небесные» сохраняет узнаваемую формулу обетования, а конструкция «останется вас совсем немного» остаётся естественной для обычного читателя. Резкий переход к единственному числу сознательно сохранён как особенность коллективного обращения во Второзаконии.
