  text: בָּר֥וּךְ אַתָּ֖ה בָּ/עִ֑יר וּ/בָר֥וּךְ אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: ru
  text: Благословен будешь ты в городе[a], и благословен будешь ты в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благословен ты в городе, и благословен ты в поле».'
    reason: В еврейском тексте обе фразы безглагольные и могут передаваться как декларация настоящего времени либо, с учётом контекста, как обещание.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: благословен
  rationale: Страдательное причастие от ברך в контексте заветных благословений. «Благословен» сохраняет декларативный и богословский смысл, не сводя его к удачливости или благополучию.
- source_word: אַתָּה
  choice: ты
  rationale: Местоимение второго лица мужского рода единственного числа обращено к Израилю как к единому народу — участнику завета. Русское «ты» точно сохраняет число и форму обращения.
- source_word: בָּעִיר
  choice: в городе
  rationale: Предлог בְּ с существительным עִיר обозначает место. «В городе» прямо передаёт городскую область жизни и поддерживает противопоставление полю.
- source_word: וּבָרוּךְ
  choice: и благословен
  rationale: Союз и повтор сказуемого сохранены, поскольку в еврейском тексте они создают намеренный параллелизм двух областей благословения.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: שָׂדֶה может обозначать поле, открытую местность или сельскохозяйственную землю. «В поле» сохраняет конкретный образ и параллельный контраст с городом.
theological_decisions:
- issue: Передача безглагольной формулы благословения
  choice: Благословен будешь ты... и благословен будешь ты...
  alternative: Благословен ты... и благословен ты...
  rationale: В еврейском тексте глагол отсутствует, поэтому возможна как настоящая декларация, так и обращённое в будущее обещание. В контексте условий и последующих благословений Второзакония 28 форма «будешь» естественно передаёт обещательный оттенок, а сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор «благословен» и симметрия «в городе... в поле» сохранены; обращение стоит в единственном числе, как в еврейском тексте.
