source:
  edition: WLC
  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: ru
  text: И рассеет тебя Яхве среди всех народов, от одного края земли до другого[a], и там ты будешь служить другим богам, которых не знали ни ты, ни твои отцы, — дереву и камню[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от одного края страны до другого». Еврейское אֶרֶץ может означать как «землю» в широком смысле, так и «страну» или определённую территорию; упоминание всех народов поддерживает здесь широкий смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дерево и камень» — идолы, изготовленные из этих материалов.'
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: И рассеет тебя
  rationale: Каузативная порода глагола פוץ означает «рассеять, разогнать». Единственное число «тебя» сохраняет обращение к Израилю как к одному народу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: בְּכָל הָעַמִּים
  choice: среди всех народов
  rationale: עַמִּים обозначает народы; «среди» естественно передаёт распределение изгнанников по множеству народов.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: от одного края земли до другого
  rationale: Так передан общий географический охват. Русская формулировка сохраняет образ двух пределов, избегая тяжеловесного повторения слова «земля».
- source_word: וְעָבַדְתָּ
  choice: ты будешь служить
  rationale: Глагол עבד при богах означает служение с религиозной преданностью; «служить» сохраняет исходную лексику, не сводя смысл только к обрядовому поклонению.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямое и традиционно понятное обозначение иных божеств.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: которых не знали ни ты, ни твои отцы
  rationale: Сохранены отрицательная конструкция, личное местоимение для смыслового выделения и буквальное значение ידע «знать».
- source_word: עֵץ וָאָבֶן
  choice: дереву и камню
  rationale: Дательный падеж согласован с глаголом «служить», а тире показывает, что речь идёт о материале идолов, названных «другими богами».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение הָאָרֶץ в формуле рассеяния
  choice: земля в значении всего мира
  alternative: страна, земля как территория
  rationale: Сочетание с рассеянием «среди всех народов» склоняет к широкому географическому смыслу, но возможное значение «страна» отмечено в сноске.
- issue: Характер служения другим богам
  choice: будешь служить
  alternative: будешь поклоняться
  rationale: Перевод «служить» сохраняет более широкий смысл עבד и не устраняет напряжение текста относительно того, описывает ли он вынужденное участие в идолопоклонстве или фактическую религиозную измену.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным библейским звучанием. Сохранены коллективное обращение во втором лице единственного числа, последовательность еврейского текста и резкая заключительная характеристика идолов.
