  - severity: low
    issue: Формулировка «как Свой святой народ» менее прямо передаёт לּוֹ.
    rationale: «Для Себя святым народом» ясно выражает, что Яхве утверждает народ в статусе народа, принадлежащего Ему, не создавая неестественной конструкции с «как Свой».
