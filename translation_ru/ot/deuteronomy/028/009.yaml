base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: ru
  text: Яхве утвердит тебя для Себя святым народом[a], как Он поклялся тебе, если ты будешь соблюдать заповеди Яхве, Бога твоего, и ходить его путями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что ты соблюдаешь заповеди Яхве, Бога твоего». Древнееврейский союз может иметь причинное значение, хотя здесь контекст скорее указывает на условие.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: утвердит тебя
  rationale: Каузативная форма глагола קום здесь означает утверждение Израиля в данном ему заветном положении, а не физическое воздвижение.
- source_word: לּוֹ
  choice: как Свой
  rationale: Передаёт принадлежность народа Господу и естественно сочетается по-русски с выражением «святой народ».
- source_word: לְעַם קָדוֹשׁ
  choice: как Свой святой народ
  rationale: Предлог ל обозначает здесь положение, в котором Господь утвердит Израиль; формулировка сохраняет заветный смысл святости и принадлежности.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: как Он и клялся тебе
  rationale: Частица «и» естественно подчёркивает соответствие ранее данной клятве, не добавляя нового содержания.
- source_word: כִּי
  choice: если
  rationale: В контексте благословений и проклятий союз вводит условие; при этом возможное причинное прочтение отмечено в сноске.
- source_word: תִשְׁמֹר
  choice: будешь соблюдать
  rationale: Глагол שׁמר при слове «заповеди» означает исполнять или соблюдать их; это нормативное и естественное русское сочетание.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: Сохраняет заветно-правовой регистр исходного слова и привычно для современного русского библейского языка.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: и ходить Его путями
  rationale: Сохраняет ясную древнееврейскую метафору образа жизни и поведения согласно Божьей воле.
- source_word: יְהוָה
  choice: Господь
  rationale: Передаёт тетраграмматон традиционной русской библейской заменой-титулом; употребление прописной буквы отличает обозначение Бога.
- source_word: אֱלֹהֶיךָ
  choice: Бога твоего
  rationale: Сохраняет заветную формулу и несколько торжественный, но понятный современному читателю порядок слов.
theological_decisions:
- issue: Условное значение союза כִּי
  choice: «если ты будешь соблюдать…»
  alternative: «потому что ты соблюдаешь…»
  rationale: Синтаксис и общий контекст благословений и проклятий во Второзаконии поддерживают условное прочтение, однако причинное значение союза возможно и поэтому не скрыто, а вынесено в сноску.
- issue: Статус Израиля как святого народа
  choice: «утвердит тебя как Свой святой народ»
  alternative: «поставит тебя Себе святым народом»
  rationale: Перевод сохраняет одновременно действие Бога, принадлежность Ему и особый заветный статус народа, не уточняя сверх текста природу этой святости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены устойчивые образы «святой народ» и «ходить Его путями»; архаичные формы и перегруженный синтаксис исключены.
