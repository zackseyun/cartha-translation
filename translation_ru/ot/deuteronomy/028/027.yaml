base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: ru
  text: Яхве поразит тебя египетскими нарывами, опухолями[a], струпьями и зудящей болезнью кожи, от которых ты не сможешь исцелиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «геморроем». Значение еврейского слова не вполне ясно; возможно, речь идёт именно об опухолях в области заднего прохода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: поразит тебя
  rationale: Глагол נכה в породе хифиль выражает непосредственное поражение или нанесение удара; «поразит тебя» естественно и сохраняет силу высказывания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: египетскими нарывами
  rationale: שְׁחִין обозначает воспалённые язвы или нарывы; множественное число естественно для названия болезни, а определение «египетскими» сохраняет связь с Египтом.
- source_word: וּבְעפלים
  choice: опухолями
  rationale: Значение редкого термина не вполне определённо. Общее «опухолями» не вводит без достаточных оснований более узкий диагноз; возможное значение приведено в сноске.
- source_word: וּבַגָּרָב
  choice: струпьями
  rationale: גָּרָב обозначает кожное заболевание со струпьями или коростой; выбран конкретный и понятный современному читателю эквивалент.
- source_word: וּבֶחָרֶס
  choice: зудящей болезнью кожи
  rationale: Слово обозначает зудящее кожное поражение. Описательная передача избегает чрезмерно точного современного диагноза.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: от которых ты не сможешь исцелиться
  rationale: Формулировка сохраняет значение невозможности исцеления и пассивный смысл формы נרפא.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» сохраняет в основном тексте личное имя Бога и не заменяет его титулом.
- issue: Бог как непосредственный деятель суда
  choice: Яхве поразит тебя
  alternative: тебя постигнут
  rationale: Сохранён явный субъект и активная конструкция еврейского текста; причинность не смягчается и не перетолковывается.
translation_notes:
  register: Современный литературный русский язык с прямой, торжественно-сдержанной формулировкой. Медицинские обозначения переданы понятно, но без неоправданного уточнения диагнозов. Маркер сноски поставлен непосредственно после спорного слова.
