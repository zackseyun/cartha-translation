    issue: Неестественная и неточная конструкция «выходящий у неё между ног».
    rationale: 'Еврейское מִבֵּין רַגְלֶיהָ означает «между её ног», а не «у неё между ног». После замены управления на «к своему последу» причастие должно стоять в дательном падеже: «выходящему между её ног».'
  - severity: medium
    issue: Буквальное «в твоих воротах» в основном тексте двусмысленно для современного русского читателя.
    rationale: בִּשְׁעָרֶיךָ — устойчивое обозначение городов/поселений, находящихся за воротами, а не пространства самих ворот. Смысловой перевод «в твоих городах» с примечанием о буквальном образе точнее передаёт функцию выражения.
  - severity: low
    issue: «И на свой послед» звучит неестественно в современном литературном русском.
    rationale: «И к своему последу» лучше выражает направленность в продолжающемся синтаксисе проклятия и не меняет смысла.
