base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: ru
  text: и к своему последу, выходящему между её ног[a], и к детям, которых она родит, потому что она тайком съест их из-за полной нужды, во время осады и бедствия, которыми твой враг будет теснить тебя в твоих городах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своей плаценте». Еврейское слово обозначает послед, выходящий при родах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в твоих воротах». Это выражение обозначает города или поселения, оказавшиеся в осаде, а не только сами городские ворота.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: свой послед
  rationale: «Послед» — точный русский акушерский термин для плаценты и оболочек, выходящих после рождения ребёнка; он сохраняет прямоту и телесность еврейского текста.
- source_word: הַיּוֹצֵת מִבֵּין רַגְלֶיהָ
  choice: выходящий у неё между ног
  rationale: Оборот прямо описывает роды; «ног» естественнее в данном контексте, чем буквальное «ступней».
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: и на детей, которых она родит
  rationale: בנים в контексте обозначает потомство вообще, а не обязательно только сыновей; глагол ילד передан обычным русским «родит».
- source_word: כִּי תֹאכְלֵם
  choice: потому что она тайком съест их
  rationale: כִּי вводит причину описанного отношения женщины, а обычный глагол «есть» сохранён без смягчения, чтобы передать ужас проклятия.
- source_word: בְּחֹסֶר כֹּל
  choice: при недостатке всего
  rationale: Фраза обозначает крайнее, всеобъемлющее лишение и сохраняет обстоятельственное значение предлога בְּ.
- source_word: בַּסָּתֶר
  choice: тайком
  rationale: Наречие естественно передаёт скрытый характер действия и не ослабляет смысл.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: во время осады и бедствия
  rationale: 'Сохранена пара существительных: מָצוֹר — военная осада, מָצוֹק — стеснение, бедствие или тяжёлое положение.'
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: которыми твой враг будет теснить тебя
  rationale: «Теснить» передаёт причиняемое врагом давление и перекликается с условиями осады, не добавляя более общего смысла «угнетать».
- source_word: בִּשְׁעָרֶיךָ
  choice: в твоих воротах
  rationale: Сохранён еврейский образ ворот как обозначения пространства укреплённого города; переносный смысл разъяснён в примечании.
theological_decisions:
- issue: Референт местоимения в תֹאכְלֵם
  choice: «съест их» оставлено без уточнения
  alternative: явно указать, что речь только о детях либо о последе и детях вместе
  rationale: Еврейское местоимение множественного числа допускает связь со всем перечисленным; уточнение искусственно устранило бы мрачную неоднозначность текста.
translation_notes:
  register: Современный литературный русский с намеренно прямой, тяжёлой лексикой, соответствующей описанию ужасов осады. Начальное «и на» сохраняет синтаксическую зависимость от предыдущего стиха. Порядок слов по возможности следует еврейскому тексту, но остаётся естественным для русского.
