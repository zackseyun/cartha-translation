base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: ru
  text: Плоды твоей земли и всё, что добыто твоим трудом,[a] съест народ, которого ты не знал; и во все дни свои ты будешь лишь угнетён и сокрушён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весь твой труд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: плоды твоей земли
  rationale: Передаёт сельскохозяйственный образ и естественно охватывает урожай или произведения возделанной земли.
- source_word: כָל יְגִיעֲךָ
  choice: всё, что добыто твоим трудом
  rationale: Здесь יְגִיעַ может обозначать как сам тяжёлый труд, так и его результат; поскольку это является объектом глагола «съест», по-русски естественнее явно выразить плоды труда, не устраняя лексическую альтернативу в сноске.
- source_word: יֹאכַל
  choice: съест
  rationale: Сохранён обычный конкретный глагол «есть» без усиления до «пожрёт» или обобщения до «завладеет».
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: народ, которого ты не знал
  rationale: 'Сохраняет собирательное единственное число עַם и завершённый аспект: речь о прежде неизвестном адресату народе.'
- source_word: רַק עָשׁוּק וְרָצוּץ
  choice: лишь угнетён и сокрушён
  rationale: «Лишь» передаёт исключительность רַק, а два пассивных состояния сохраняют параллелизм и силу исходного текста.
- source_word: כָּל הַיָּמִים
  choice: во все дни свои
  rationale: Естественная для возвышенной русской прозы передача постоянной, продолжающейся участи при сохранении личного обращения.
