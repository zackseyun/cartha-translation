id: DEU.28.11
reference: Deuteronomy 28:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: ru
  text: Яхве даст тебе изобилие во благо[a] — в плоде твоего чрева[b], в приплоде твоего скота и в плодах твоей земли[c] — на земле, о которой Яхве поклялся твоим предкам, что даст её тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для добра», «для благополучия».'
    reason: lexical_alternative
  - marker: b
    text: «Плод твоего чрева» — еврейская идиома, обозначающая детей или потомство.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в урожае с твоей земли», «в плодах твоей почвы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: даст тебе изобилие
  rationale: 'Форма породы hифиль от יתר выражает причинение избытка: Яхве сделает так, что у адресата будет изобилие. Русская конструкция естественна и сохраняет каузативный смысл.'
- source_word: לְטוֹבָה
  choice: во благо
  rationale: Буквально «для добра»; в контексте благословения речь идёт об изобилии, служащем благу и благополучию адресата. Формулировка не сужает значение до одного лишь материального процветания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: בִּפְרִי בִטְנְךָ
  choice: в детях
  rationale: Буквально «в плоде твоего чрева» — древнееврейская идиома, обозначающая детей или потомство. Динамическая передача понятна современному читателю; буквальный образ отмечен в сноске.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: в приплоде твоего скота
  rationale: Так естественно по-русски передаётся увеличение числа домашних животных; буквальное «плод твоего скота» звучало бы неидиоматично.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: в плодах твоей земли
  rationale: אֲדָמָה здесь обозначает возделываемую землю, почву; «плоды земли» сохраняет земледельческий образ и звучит естественно.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: Здесь имеется в виду обещанная земля как место исполнения благословения.
- source_word: לַאֲבֹתֶיךָ
  choice: твоим предкам
  rationale: В данном контексте אָבוֹת указывает на праотцов Израиля; «предкам» ясно передаёт смысл на современном русском языке.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому сохранено личное имя без замены титулом.
- issue: Передача выражения «плод чрева»
  choice: дети в основном тексте с буквальным образом в сноске
  alternative: плод твоего чрева; потомство
  rationale: Это обычная идиома со значением детей или потомства. Выбор делает текст понятным, не вводя дополнительного богословского толкования; исходная метафора сохранена в сноске.
- issue: Связь לְטוֹבָה с изобилием
  choice: изобилие во благо
  alternative: процветание; изобилие в добре
  rationale: Формулировка сохраняет положительную целевую или результативную окраску выражения и не сводит благословение исключительно к богатству.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок трёх сфер благословения сохранён; буквальная трёхкратная конструкция со словом «плод» частично сглажена ради естественности русского текста. Тире выделяют перечисление, поясняющее, в чём проявится изобилие.
