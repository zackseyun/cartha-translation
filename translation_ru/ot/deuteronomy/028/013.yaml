  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: ru
  text: И Яхве поставит тебя главой, а не хвостом; ты будешь только наверху, а не внизу, если будешь слушать[a] заповеди Яхве, твоего Бога, которые я заповедую тебе сегодня соблюдать и исполнять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если будешь повиноваться заповедям Яхве, твоего Бога». Буквально еврейский текст говорит «слушать», но в контексте завета это означает слушать с готовностью повиноваться.'
    reason: Лексическая альтернатива и пояснение контекстуального значения שמע אל.
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: И поставит тебя Яхве
  rationale: נתן буквально означает «дать, поместить, поставить»; с последующим обозначением положения естественно передать как «поставит», сохранив причинно-статусный смысл.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: во главе, а не в хвосте
  rationale: Сохранена наглядная еврейская метафора противопоставления головы и хвоста, то есть ведущего и подчинённого положения.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: и будешь ты только наверху, а не внизу
  rationale: «Только» передаёт ограничительно-усилительное רק, а пространственная пара «наверху — внизу» сохраняет метафору статуса.
- source_word: כִּי תִשְׁמַע אֶל
  choice: если будешь слушать
  rationale: כִּי в контексте благословений вводит условие; שמע אל буквально означает «слушать», причём здесь подразумевается послушание. Буквальная образность сохранена, а смысл пояснён сноской.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: Обычное и стилистически уместное обозначение предписаний завета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я заповедую тебе сегодня
  rationale: Настоящее время передаёт актуальность речи Моисея, а «сегодня» сохранено как значимый элемент формулировки Второзакония.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: чтобы соблюдать и исполнять их
  rationale: 'Два глагола переданы раздельно: первый выражает внимательное соблюдение, второй — практическое исполнение.'
theological_decisions:
- issue: Значение условного כִּי
  choice: если будешь слушать
  alternative: потому что будешь слушать
  rationale: В последовательности благословений фраза естественно обозначает условие обещанного возвышения; перевод не добавляет идеи заслуживания сверх сказанного в тексте.
- issue: Смысл שמע אל в контексте завета
  choice: слушать с пояснением в сноске
  alternative: повиноваться
  rationale: Основной текст сохраняет исходную слуховую метафору, а сноска указывает на включённый в неё смысл послушания, не устраняя лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены парные метафоры «во главе — в хвосте» и «наверху — внизу», а также личное имя Яхве.
