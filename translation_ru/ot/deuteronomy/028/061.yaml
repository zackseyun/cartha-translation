base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: ru
  text: Также Яхве нашлёт на тебя всякую болезнь и всякое бедствие, о которых не написано в книге этого Закона, пока ты не будешь уничтожен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Передаёт добавочное значение частицы и естественно продолжает перечень проклятий.
- source_word: כָּל חֳלִי
  choice: всякую болезнь
  rationale: חֳלִי обозначает болезнь или нездоровье; «болезнь» — широкое и общеупотребительное соответствие.
- source_word: וְכָל מַכָּה
  choice: и всякое поражение
  rationale: מַכָּה может обозначать удар, поражение, язву или губительное бедствие. «Поражение» сохраняет образ нанесённого удара и не ограничивает смысл эпидемией.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: не записанные
  rationale: Естественно передаёт причастную конструкцию со значением отсутствия в письменном перечне; множественное число в русском согласует определение с двумя названными видами бедствий.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: в книге этого Закона
  rationale: Передаёт סֵפֶר как письменную книгу или свиток, а הַתּוֹרָה — как конкретный данный Израилю Закон.
- source_word: יַעְלֵם
  choice: нашлёт
  rationale: В породе hифиль глагол עלה с местоименным суффиксом означает, что названные бедствия будут наведены на адресата; «нашлёт» естественно выражает это по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עָלֶיךָ
  choice: на тебя
  rationale: В сочетании с «нашлёт» естественно передаёт направленность карающих бедствий на адресата.
- source_word: עַד הִשָּׁמְדָךְ
  choice: пока ты не будешь истреблён
  rationale: Передаёт предельный результат действия и страдательное значение формы השמד, сохраняя суровость исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Степень уничтожения в עַד הִשָּׁמְדָךְ
  choice: пока ты не будешь истреблён
  alternative: до полного твоего уничтожения
  rationale: «Истреблён» передаёт сильное значение глагола, но не добавляет отсутствующего в тексте уточнения «полностью».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для русского языка; сохранены добавочная связь с предыдущим перечнем, личное имя Яхве и предельная тяжесть угрозы.
