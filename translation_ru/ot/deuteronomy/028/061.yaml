  source_fidelity: 'Смысл в целом передан верно: добавочное «также», две категории бедствий, их отсутствие в книге Закона, действие Яхве, направленное на адресата, и конечный результат сохранены. Однако «поражение» в современном русском двусмысленно и часто означает военное поражение либо медицинское повреждение; для מַכָּה в данном контексте более ясно и достаточно широко «бедствие».'
  naturalness: 'Предлагаемая правка делает сочетание двух существительных и относительное определение более естественными: «о которых не написано» исключает неудачное согласование «не записанные» после существительных разного рода. Порядок с «Яхве нашлёт на тебя» также плавен для современного литературного русского.'
  terminology: «Яхве» точно передаёт тетраграмматон. «Болезнь» уместно для חֳלִי; «бедствие» передаёт широкий карающий/поражающий характер מַכָּה, не сужая его до эпидемии. «Книга этого Закона» сохраняет определённость еврейского выражения.
