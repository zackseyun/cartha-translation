  source_fidelity: 'Смысл в целом передан точно: Яхве является субъектом обоих глаголов; сохранены хранилища, всецелость охвата труда, благословение и даруемая земля. Однако формула «повелит благословению быть с тобой» чрезмерно тяжеловесна для современного литературного русского и недостаточно ясно связывает благословение с последующими сферами жизни. «Сопутствовать» естественно передаёт образное повеление благословению и значение אִתְּךָ («с тобой»), не превращая его в простое «пошлёт».'
