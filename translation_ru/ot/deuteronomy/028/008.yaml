  to: Яхве повелит благословению сопутствовать тебе в твоих хранилищах[a] и во всяком труде твоих рук[b] и благословит тебя на земле, которую Яхве, твой Бог, даёт тебе[c].
  rationale: Исправлена только русская синтаксическая и стилистическая реализация образного выражения «повелеть благословению». Глагол «сопутствовать» делает направленность благословения к адресату ясной, не сглаживая исходное «повелит» до «пошлёт» или «даст». «Труд твоих рук» — естественная русская передача сферы человеческих усилий; сноска сохраняет более широкий смысл древнееврейской идиомы.
