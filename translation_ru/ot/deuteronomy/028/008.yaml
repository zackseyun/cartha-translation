base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: ru
  text: Яхве повелит благословению сопутствовать тебе в твоих хранилищах[a] и во всяком труде твоих рук[b] и благословит тебя на земле, которую Яхве, твой Бог, даёт тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в твоих амбарах» или «в твоих житницах».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во всяком посылании твоей руки» — древнееврейский оборот, означающий всякий труд или начинание.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «даст тебе». Древнееврейское причастие здесь допускает передачу как настоящим, так и будущим временем.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו יְהוָה אִתְּךָ אֶת הַבְּרָכָה
  choice: Яхве повелит благословению быть с тобой
  rationale: Сохранён яркий древнееврейский оборот с глаголом «повелеть», а добавленное по нормам русского синтаксиса «быть» передаёт направленность благословения на адресата, не сглаживая образ до «пошлёт благословение».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: הַבְּרָכָה
  choice: благословению
  rationale: Определённая форма указывает на обещанное заветное благословение; в русском после «повелит» требуется дательный падеж.
- source_word: בַּאֲסָמֶיךָ
  choice: в твоих хранилищах
  rationale: Слово אָסָם обозначает помещение для хранения запасов, в особенности зерна. «Хранилища» понятно современному читателю и не сужает значение исключительно до амбаров или житниц.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: и во всяком деле твоих рук
  rationale: Передан идиоматический смысл начинаний и труда человека, при этом сохранён конкретный образ руки, характерный для древнееврейского текста.
- source_word: וּבֵרַכְךָ
  choice: и благословит тебя
  rationale: Перфект с союзом продолжает будущее значение предыдущего глагола; субъект — Яхве — однозначно устанавливается первой частью предложения.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: «Земля» сохраняет обычное для Второзакония заветное звучание обетованной земли, не добавляя слова «обетованной», которого здесь нет.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Причастная форма может обозначать происходящее или непосредственно предстоящее дарование. Настоящее время естественно передаёт её аспектуальную открытость.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя Бога и не подменяет его титулом.
- issue: Заветный оттенок слова הָאָרֶץ
  choice: на земле
  alternative: в стране
  rationale: «Земля» сохраняет устойчивую для Второзакония связь с даруемой Израилю землёй, не делая скрытый смысл явным дополнением.
- issue: Временное значение причастия נֹתֵן
  choice: даёт тебе
  alternative: даст тебе
  rationale: Настоящее время сохраняет неоднозначность древнееврейского причастия между совершающимся и непосредственно предстоящим действием; возможное будущее значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллельная структура стиха, образ «дел рук» и необычный оборот о повелении благословению; архаизмы и конфессионально окрашенные добавления исключены.
