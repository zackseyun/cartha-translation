  text: וְ/הָי֣וּ בְ/ךָ֔ לְ/א֖וֹת וּ/לְ/מוֹפֵ֑ת וּֽ/בְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: ru
  text: И будут они на тебе и на твоих потомках[a] знамением и чудом навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на твоём семени»; еврейское слово может собирательно обозначать потомство или потомков.'
    reason: lexical_alternative
  - marker: b
    text: «Они» — проклятия, описанные в предшествующем контексте.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: И будут они
  rationale: Форма продолжает описание будущих последствий, а местоимение сохраняет невыраженное в стихе подлежащее и связь с предшествующими проклятиями.
- source_word: בְךָ
  choice: на тебе
  rationale: Предлог передаёт мысль о проклятиях, пребывающих на адресате; такое выражение сохраняет образ и параллелизм оригинала.
- source_word: לְאוֹת
  choice: знамением
  rationale: אוֹת обозначает знак или знамение; «знамением» естественно сочетается с «чудом» и соответствует возвышенному, но понятному библейскому регистру.
- source_word: וּלְמוֹפֵת
  choice: и чудом
  rationale: מוֹפֵת может означать чудо, дивное явление или предзнаменование. «Чудом» сохраняет обычную пару «знамение и чудо», не уточняя сверх текста исключительно зловещий смысл.
- source_word: וּבְזַרְעֲךָ
  choice: и на твоих потомках
  rationale: זֶרַע здесь коллективно обозначает потомство. «Потомках» ясно и естественно передаёт смысл, а повтор «на» отражает повторённый еврейский предлог.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Выражение указывает на длительное, непрекращающееся действие. «Навеки» — краткий и естественный русский эквивалент, не добавляющий отдельного философского определения бесконечности.
theological_decisions:
- issue: К чему относится «они»
  choice: Сохранено местоимение «они»; по контексту оно относится к ранее описанным проклятиям.
  alternative: Внести в основной текст пояснение «эти проклятия».
  rationale: В еврейском стихе подлежащее прямо не названо. Сохранение местоимения не устраняет грамматическую неоднозначность, а сноска поясняет наиболее непосредственную контекстуальную связь.
- issue: Смысл עַד עוֹלָם
  choice: «навеки» без дополнительного уточнения характера продолжительности
  alternative: «навсегда» или «на все поколения»
  rationale: Основной эквивалент сохраняет силу выражения, но перевод не превращает его в более подробное догматическое утверждение, которого сам стих не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные уточнения не вводятся.
