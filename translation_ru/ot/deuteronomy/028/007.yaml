base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: ru
  text: Яхве предаст тебе на поражение твоих врагов, восстающих против тебя[a]. Одной дорогой они выступят против тебя, а семью дорогами побегут от тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Яхве отдаст врагов твоих, восстающих против тебя, поражёнными перед тобой».'
    reason: lexical_alternative
  - marker: b
    text: Образ означает, что враги выступят сплочённо, но после поражения разбегутся в разные стороны.
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: предаст тебе на поражение
  rationale: В военном контексте נתן означает не только «дать», но и «предать, отдать во власть». Русская конструкция передаёт смысл того, что Яхве сделает врагов побеждёнными перед Израилем, не превращая причастие נִגָּפִים в отдельное действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֹיְבֶיךָ
  choice: врагов
  rationale: Естественный русский эквивалент формы множественного числа с суффиксом второго лица единственного числа; принадлежность выражена местоименной конструкцией «против тебя» и контекстом обращения.
- source_word: הַקָּמִים עָלֶיךָ
  choice: восстающих против тебя
  rationale: Сохраняет образ קום с על как враждебного выступления против адресата, не сужая его до конкретной формы нападения.
- source_word: נִגָּפִים לְפָנֶיךָ
  choice: тебе на поражение
  rationale: 'Передаёт результативный военный смысл: враги будут отданы адресату уже как обречённые на поражение. Буквальный образ «поражёнными перед тобой» отражён в сноске.'
- source_word: בְּדֶרֶךְ אֶחָד
  choice: одной дорогой
  rationale: Сохраняет конкретный образ דרך и контраст с семью дорогами; форма согласована с русским существительным женского рода.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: выступят против тебя
  rationale: В военном контексте יצא אל обозначает выход или выступление против неприятеля. «Выступят» звучит естественно и сохраняет военную направленность.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: а семью дорогами
  rationale: 'Сохраняет числовой и образный параллелизм оригинала: единое наступление противопоставлено рассеянному бегству.'
- source_word: יָנוּסוּ לְפָנֶיךָ
  choice: побегут от тебя
  rationale: נוס означает «бежать, спасаться бегством»; в данном контексте לְפָנֶיךָ естественно передаётся по-русски как бегство «от тебя», вызванное поражением перед адресатом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал употребляет личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом, не вводя конфессиональной замены.
- issue: Смысл числа семь в образе бегства
  choice: Сохранить буквальное «семью дорогами»
  alternative: «во все стороны»
  rationale: Число может подразумевать полноту и полное рассеяние, но текст прямо говорит о семи дорогах. Буквальный образ сохранён, а его вероятный смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены параллелизм «одной дорогой — семью дорогами», личное имя Яхве и военная образность; синтаксис сделан естественным для широкого читателя.
