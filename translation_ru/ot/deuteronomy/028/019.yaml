  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: ru
  text: Проклят ты, когда входишь[a], и проклят, когда выходишь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при твоём вхождении… при твоём выходе». Это еврейское выражение охватывает весь ход повседневной жизни.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: проклят
  rationale: Страдательное причастие или прилагательное со значением «проклят». Этот обычный русский эквивалент сохраняет торжественную формулу заветных проклятий.
- source_word: אַתָּה
  choice: ты
  rationale: Местоимение второго лица мужского рода единственного числа. Единственное число прямого обращения к Израилю сохранено явно.
- source_word: בְּבֹאֶךָ
  choice: при входе твоём
  rationale: Предлог ב с инфинитивом בוא и суффиксом 2-го лица единственного числа буквально означает «при твоём вхождении». Формулировка сохраняет именную структуру и параллелизм еврейского текста, оставаясь понятной по-русски.
- source_word: וְ
  choice: и
  rationale: Простой соединительный союз между параллельными частями.
- source_word: בְּצֵאתֶךָ
  choice: при выходе твоём
  rationale: Предлог ב с инфинитивом יצא и суффиксом 2-го лица единственного числа буквально означает «при твоём выходе». Выбор симметричен первой части и сохраняет меризм.
theological_decisions:
- issue: Передача формулы заветного проклятия с сохранением вынесенного вперёд сказуемого
  choice: Проклят ты при входе твоём, и проклят ты при выходе твоём.
  alternative: Ты будешь проклят, когда входишь, и проклят, когда выходишь.
  rationale: В еврейском тексте слово «проклят» поставлено в начале обеих частей ради ударения. Выбранный порядок слов сохраняет торжественный параллелизм и не добавляет временного оттенка, прямо не выраженного глагольной формой.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой. Лексический повтор и синтаксический параллелизм оригинала сохранены; «при входе… при выходе» передаёт меризм без конфессионального истолкования.
