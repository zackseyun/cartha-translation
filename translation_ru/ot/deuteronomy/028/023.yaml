  text: וְ/הָי֥וּ שָׁמֶ֛י/ךָ אֲשֶׁ֥ר עַל רֹאשְׁ/ךָ֖ נְחֹ֑שֶׁת וְ/הָ/אָ֥רֶץ אֲשֶׁר תַּחְתֶּ֖י/ךָ בַּרְזֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: ru
  text: И небо над твоей головой станет медью[a], а земля под тобой — железом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзой». Еврейское слово может обозначать медь или бронзу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: станет
  rationale: Форма перфекта с союзом в контексте проклятий имеет будущее значение; «станет» естественно передаёт предсказанное изменение состояния и согласуется в числе с русским «небо».
- source_word: שָׁמֶיךָ
  choice: небо
  rationale: В данном образе речь идёт о небе как сфере погоды; русское единственное число звучит естественно и точно передаёт контекстуальное значение שָׁמַיִם.
- source_word: אֲשֶׁר עַל רֹאשְׁךָ
  choice: над твоей головой
  rationale: Прямая и естественная передача относительного оборота с сохранением пространственного образа.
- source_word: נְחֹשֶׁת
  choice: медь
  rationale: נְחֹשֶׁת может обозначать медь или бронзу. «Медь» — традиционное и понятное русское соответствие; возможное «бронза» отмечено в сноске.
- source_word: וְהָאָרֶץ
  choice: а земля
  rationale: «Земля» сохраняет противопоставление небу. Союз «а» естественно выражает параллельное сопоставление двух частей образа.
- source_word: אֲשֶׁר תַּחְתֶּיךָ
  choice: под тобой
  rationale: Кратко и естественно сохраняет вертикальный параллелизм с выражением «над твоей головой».
- source_word: בַּרְזֶל
  choice: железо
  rationale: Стандартное значение בַּרְזֶל; сохраняет буквальный образ твёрдой, бесплодной земли.
theological_decisions:
- issue: Метафорический смысл образа проклятия
  choice: Сохранить буквальные образы меди и железа, не поясняя в основном тексте засуху и затвердевшую землю.
  alternative: 'Передать смысл описательно: небо не даст дождя, а земля станет твёрдой и бесплодной.'
  rationale: Еврейский текст выражает проклятие посредством яркой металлической метафоры. Буквальная передача сохраняет её силу и не добавляет толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. Сохранены лаконизм, вертикальный параллелизм и металлическая образность оригинала.
