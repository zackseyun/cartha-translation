base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: ru
  text: И среди тех народов ты не обретёшь покоя[a], и не будет места, где могла бы отдохнуть твоя нога. Там Яхве даст тебе трепещущее сердце, угасающие глаза[b] и душевную боль[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будешь знать покоя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «истощение (или изнеможение) глаз».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «скорбь души»; «томление души».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: не обретёшь покоя
  rationale: Порода hифиль глагола רגע здесь передаёт отсутствие возможности успокоиться или обрести покой. Такой перевод естественен по-русски и сохраняет смысл проклятия изгнания.
- source_word: מָנוֹחַ
  choice: места отдыха
  rationale: В сочетании со «ступнёй ноги» существительное обозначает место, где можно остановиться и отдохнуть; конкретный оттенок передан без устранения общего значения покоя.
- source_word: לְכַף רַגְלֶךָ
  choice: для ступни твоей ноги
  rationale: כַּף в сочетании с רֶגֶל обозначает подошву, нижнюю часть стопы. Формулировка сохраняет телесный образ еврейского текста и остаётся понятной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: לֵב רַגָּז
  choice: трепещущее сердце
  rationale: רַגָּז выражает дрожь, тревогу и внутреннее смятение; «трепещущее сердце» сохраняет одновременно телесный и эмоциональный образ.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: угасающие глаза
  rationale: כִּלְיוֹן означает истощение, угасание или изнеможение. Выражение передаёт продолжительное ослабление глаз и связанное с ним отчаяние, не сводя образ исключительно к потере зрения.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: душевную боль
  rationale: דַּאֲבוֹן обозначает боль, скорбь или мучительное томление, а נֶפֶשׁ — внутреннюю жизнь человека. «Душевная боль» звучит естественно и сохраняет интенсивность выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон. «Яхве» сохраняет личное имя Бога и не подменяет его титулом; вариант «Иегова» менее точно отражает вероятное древнееврейское произношение.
- issue: Характер бедствия в כִּלְיוֹן עֵינַיִם
  choice: угасающие глаза
  alternative: изнеможение глаз; слабеющие глаза
  rationale: Текст допускает как телесное ослабление зрения, так и образ изнурённого ожидания. Выбранная формулировка сохраняет эту напряжённую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксический параллелизм исходного текста сохранён; устаревшая лексика избегается. Местоимения второго лица оставлены в единственном числе, как в еврейском тексте.
