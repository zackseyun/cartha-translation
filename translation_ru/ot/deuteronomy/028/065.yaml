  source_fidelity: 'В целом перевод точно передаёт последовательность образов и смысл еврейского текста: отсутствие покоя среди народов, отсутствие опоры для ноги, а затем ниспосланные Яхве внутренний трепет, изнеможение глаз и страдание души. Однако «ступни твоей ноги» анатомически неточно и стилистически неестественно: כַּף רֶגֶל означает подошву ноги. Формулировка второго колона нуждается в исправлении.'
  naturalness: Текст в целом звучит как современный литературный русский с уместным библейским ритмом. «Не будет места отдыха для ступни твоей ноги» тяжеловесно и тавтологично; «не будет места, где могла бы отдохнуть твоя нога» естественно и сохраняет конкретный образ оригинала. «Трепещущее сердце», «угасающие глаза» и «душевная боль» приемлемы.
