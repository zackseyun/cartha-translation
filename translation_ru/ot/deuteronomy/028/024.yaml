  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: ru
  text: Яхве превратит дождь для твоей земли в пыль и прах[a]; с неба этот дождь будет падать на тебя, пока ты не будешь уничтожен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пыль и рыхлую землю». В еврейском тексте стоят два близких по смыслу слова, обозначающих сухие мелкие частицы и землю; вместе они усиливают образ пыли и земли, падающих с неба вместо дождя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: превратит
  rationale: Буквально глагол означает «даст», но здесь он описывает превращение ожидаемого дождя в сухую пыль; «превратит» ясно и естественно передаёт этот контекстуальный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: מְטַר אַרְצְךָ
  choice: дождь для твоей земли
  rationale: Так естественно по-русски выражена связь дождя с землёй, которой он предназначен, без излишне буквального и двусмысленного оборота «дождь твоей земли».
- source_word: אָבָק וְעָפָר
  choice: пыль и прах
  rationale: Сохранена пара близких по значению слов, усиливающая образ засухи и опустошения; «прах» здесь обозначает сухую рыхлую землю.
- source_word: מִן הַשָּׁמַיִם יֵרֵד עָלֶיךָ
  choice: с неба всё это будет падать на тебя
  rationale: «С неба» естественно передаёт еврейское множественное по форме שׁמים. Выражение «всё это» позволяет сохранить собирательный смысл единственного числа глагола при двух названных веществах.
- source_word: עַד הִשָּׁמְדָךְ
  choice: пока ты не будешь уничтожен
  rationale: Передаёт конечный предел бедствия, не добавляя явно названного деятеля, которого в этой краткой еврейской конструкции нет.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, и не заменяет его титулом.
- issue: Неуказанный деятель уничтожения в עַד הִשָּׁמְדָךְ
  choice: пассивная конструкция «пока ты не будешь уничтожен»
  alternative: «пока Он не уничтожит тебя»
  rationale: Пассивная передача сохраняет компактность и неопределённость исходной формы и не вводит явно выраженного субъекта.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным библейским звучанием. Образ намеренно сохранён резким и парадоксальным: ожидаемый дождь превращается в падающую с неба пыль.'
