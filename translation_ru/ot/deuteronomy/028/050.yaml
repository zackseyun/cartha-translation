lexical_decisions:
- source_word: גּוֹי
  choice: народ
  rationale: В данном контексте слово обозначает чужеземный народ как вторгающуюся силу; по-русски «народ» звучит естественнее, чем современное политическое «нация».
- source_word: עַז פָּנִים
  choice: свирепого вида
  rationale: Выражение буквально описывает народ как «сильный/жестокий лицом». «Свирепого вида» сохраняет образ внешнего облика и естественно передаёт грозность и жестокость.
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение вводит характеристику упомянутого народа и естественно связывает части русского предложения.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: не проявит уважения к старику
  rationale: Идиома «поднять лицо» может означать оказать благосклонность, внимание или предпочтение. В сочетании со стариком речь естественно понимается как отсутствие уважения или почтения.
- source_word: זָקֵן
  choice: старику
  rationale: Единственное число имеет обобщающее значение. «Старик» ясно обозначает пожилого человека и сохраняет грамматическую форму оригинала.
- source_word: וְנַעַר
  choice: молодого
  rationale: נַעַר обозначает ребёнка, юношу или молодого человека. В противопоставлении старику обобщённое «молодого» сохраняет широту значения.
- source_word: לֹא יָחֹן
  choice: не пощадит
  rationale: Глагол חנן означает проявить милость или благосклонность. В контексте жестокого захватчика «не пощадит» естественно передаёт отсутствие милости, не исключая более буквального значения «не окажет милости».
