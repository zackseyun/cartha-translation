  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: ru
  text: Проклят ты в городе[a], и проклят ты в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под проклятием» (в обеих частях стиха).'
    reason: Лексическая альтернатива для אָרוּר, передающая состояние человека, на котором лежит проклятие.
lexical_decisions:
- source_word: אָרוּר
  choice: проклят
  rationale: Страдательное причастие употреблено как сказуемое в формуле заветного проклятия. «Проклят» кратко и точно передаёт объявленное состояние под судом, не превращая высказывание ни в пожелание, ни в простое предсказание.
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение 2-го лица мужского рода единственного числа выражено явно. Порядок «Проклят ты» сохраняет вынесенное вперёд сказуемое и торжественную эмфазу еврейской формулы.
- source_word: בָּעִיר
  choice: в городе
  rationale: Предлог בְּ обозначает место. «В городе» — прямой и естественный эквивалент, образующий параллель с «в поле».
- source_word: וְ
  choice: и
  rationale: Простой соединительный союз связывает две параллельные формулы и сохраняет их совокупную силу.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: שָׂדֶה обозначает поле или открытую сельскую местность. «В поле» сохраняет конкретный образ и противопоставление городу, вместе охватывающее основные сферы повседневной жизни.
theological_decisions:
- issue: Формула проклятия завета и её модальность
  choice: 'Сохранено прямое объявление: «Проклят ты…» в обеих частях.'
  alternative: «Ты будешь проклят…» или «Да будешь ты проклят…»
  rationale: В еврейском тексте стоит безглагольная предикативная конструкция с повтором причастия и местоимения, а не форма будущего времени и не пожелание. Прямое объявление сохраняет юридическую силу санкции завета.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и симметричной формулировкой. Повтор «проклят ты» сохранён ради риторического параллелизма оригинала; двоеточие или объединение частей не вводились.
