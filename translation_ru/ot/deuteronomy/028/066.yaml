base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: ru
  text: Жизнь твоя будет висеть перед тобой[a]; ты будешь страшиться ночью и днём и не будешь уверен, что останешься в живых.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жизнь твоя будет подвешена перед тобой»; этот образ выражает непрочность жизни и постоянную неизвестность, удастся ли выжить.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будешь уверен в своей жизни»; возможно также: «не будешь доверять своей жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: жизнь твоя
  rationale: Формально это форма множественного числа, но в данном контексте еврейское выражение обозначает жизнь человека, его дальнейшее существование; по-русски естественно единственное число.
- source_word: תְּלֻאִים
  choice: будет висеть ... на волоске
  rationale: Причастие от תלה («висеть, быть подвешенным») создаёт образ жизни, находящейся в непрочном, угрожающем положении. Русская идиома сохраняет образ и ясно передаёт постоянную угрозу гибели.
- source_word: לְךָ מִנֶּגֶד
  choice: перед тобой
  rationale: Сохраняется пространственный образ чего-то постоянно находящегося перед глазами человека.
- source_word: וּפָחַדְתָּ
  choice: ты будешь страшиться
  rationale: Глагол выражает страх или ужас; «страшиться» звучит естественно и достойно, не усиливая значение без основания.
- source_word: לַיְלָה וְיוֹמָם
  choice: ночью и днём
  rationale: Сохранён порядок еврейского текста; сочетание передаёт непрерывность страха.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: не будешь уверен, что останешься в живых
  rationale: Hiphil אמן с ב здесь означает отсутствие уверенности в сохранении собственной жизни, а не религиозную веру. Формулировка ясно передаёт смысл на современном русском языке.
