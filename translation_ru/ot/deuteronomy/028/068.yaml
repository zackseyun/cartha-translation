base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: ru
  text: 'И возвратит тебя Яхве в Египет на кораблях — тем путём, о котором Я сказал тебе: «Ты больше никогда не увидишь этого». Там вы будете предлагать себя своим врагам в рабы и рабыни[a], но никто вас не купит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «там вы будете проданы своим врагам в рабство — мужчины и женщины». Еврейский глагол можно понимать возвратно («продавать себя») или шире — как попадание в рабство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: возвратит тебя
  rationale: Каузативная порода хифиль от שׁוב указывает, что Яхве заставит народ вернуться; русское «возвратит тебя» кратко и естественно передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: בָּאֳנִיּוֹת
  choice: на кораблях
  rationale: Естественное русское обозначение способа морской перевозки.
- source_word: בַּדֶּרֶךְ אֲשֶׁר אָמַרְתִּי לְךָ
  choice: тем путём, о котором я сказал тебе
  rationale: Сохраняется связь относительного предложения со словом «путь»; речь может идти о маршруте возвращения.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: ты больше никогда его не увидишь
  rationale: Сочетание יסף и עוד означает, что действие впредь не повторится; местоимение мужского рода соотнесено с русским словом «путь».
- source_word: וְהִתְמַכַּרְתֶּם
  choice: вы будете предлагать себя
  rationale: Рефлексивно-медиальная форма допускает смысл «продавать/предлагать себя в продажу». Формулировка «предлагать себя» не подразумевает состоявшейся сделки, что согласуется с отсутствием покупателя.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: в рабы и рабыни
  rationale: Сохраняется выраженная в еврейском тексте пара мужского и женского рода и прямо называется рабский статус.
- source_word: וְאֵין קֹנֶה
  choice: но никто вас не купит
  rationale: Естественно передаёт буквальный образ отсутствия покупателя и контраст с попыткой продать себя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение וְהִתְמַכַּרְתֶּם
  choice: будете предлагать себя
  alternative: будете проданы; продадите себя
  rationale: Форма допускает рефлексивное или более общее медиальное понимание. Основной текст передаёт попытку отдаться в рабство, не утверждая завершённой продажи; неоднозначность отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но понятной библейской интонацией. Смена единственного числа («тебя») на множественное («вы») сохранена вслед за еврейским текстом: сначала Израиль представлен как единое целое, затем речь обращена к людям, составляющим народ.'
