base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: ru
  text: Мужчина среди вас, мягкий и весьма изнеженный, станет недобро смотреть на своего брата[a], на жену, близкую его сердцу, и на остальных своих детей, которые у него останутся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его глаз станет злым против». Это еврейское выражение может передавать враждебность, скупость или нежелание делиться.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которых он оставит».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: мужчина
  rationale: Форма стоит в единственном числе и обозначает именно мужчину; следующий стих образует параллель с женщиной.
- source_word: הָרַךְ
  choice: нежный
  rationale: Передаёт значение мягкости и непривычки к лишениям, сохраняя контраст с последующим жестоким поведением.
- source_word: וְהֶעָנֹג מְאֹד
  choice: и весьма изнеженный
  rationale: Фраза описывает человека, привыкшего к неге и удобствам; «изнеженный» естественно передаёт это значение, а «весьма» сохраняет усиление מְאֹד.
- source_word: תֵּרַע עֵינוֹ
  choice: станет недобро смотреть
  rationale: Русское выражение сохраняет образ глаза и одновременно понятно передаёт враждебность и нежелание делиться; буквальная форма пояснена в сноске.
- source_word: בְאָחִיו
  choice: на своего брата
  rationale: Сохранено обычное прямое значение слова אָח — «брат», без расширения до «родственника».
- source_word: אֵשֶׁת חֵיקוֹ
  choice: на жену, которую он прижимает к груди
  rationale: Так естественно по-русски сохраняются телесный образ חֵיק и заключённая в нём близость; буквальное «жена его лона» звучало бы неясно и архаично.
- source_word: יֶתֶר בָּנָיו
  choice: на остальных своих детей
  rationale: בָּנִים в данном контексте обозначает потомство в целом; «остальных» передаёт יֶתֶר как оставшуюся часть.
- source_word: אֲשֶׁר יוֹתִיר
  choice: которые у него останутся
  rationale: Передаёт детей, ещё остающихся у него во время бедствия, не вводя более узкого толкования «которых он пощадит».
