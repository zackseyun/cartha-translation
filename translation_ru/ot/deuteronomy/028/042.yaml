  text: The cricket shall take possession of all your trees and the fruit of your ground[a].
translation:
  language: ru
  text: Все твои деревья и плоды твоей земли захватит саранча[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сверчок», «кузнечик»; возможно, более общее значение — «жужжащее насекомое». Точно определить значение еврейского слова צְלָצַל невозможно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֵצְךָ
  choice: все твои деревья
  rationale: כָּל охватывает совокупность деревьев; עֵץ в земледельческом контексте естественно передаётся как «деревья».
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: и плоды твоей земли
  rationale: פְרִי обозначает плод или урожай, а אֲדָמָה — землю, почву; формулировка сохраняет конкретный земледельческий образ и звучит естественно по-русски.
- source_word: יְיָרֵשׁ
  choice: захватит
  rationale: Глагол ירשׁ означает овладеть, вступить во владение или вытеснить прежнего владельца. «Захватит» сохраняет образ овладения и в данном контексте подразумевает опустошение вредителем, не сводя значение просто к «съест».
- source_word: הַצְּלָצַל
  choice: саранча
  rationale: Точная идентификация насекомого неясна. «Саранча» соответствует сельскохозяйственному контексту и привычна русскому читателю; неопределённость отражена в сноске.
