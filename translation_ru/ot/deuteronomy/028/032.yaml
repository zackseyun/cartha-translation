base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: ru
  text: Твои сыновья и дочери будут отданы другому народу; твои глаза будут смотреть на них и весь день изнывать от тоски по ним, но рука твоя будет бессильна.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но это будет не в твоей власти». Буквально: «у твоей руки нет силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: Твои сыновья и дочери
  rationale: Еврейский текст прямо называет детей обоих полов; это перечисление сохранено ради точности и силы проклятия.
- source_word: נְתֻנִים
  choice: будут отданы
  rationale: Пассивное причастие в контексте предсказанного проклятия естественно передаётся будущим временем; «отданы» ближе к исходному глаголу, чем более толковательное «переданы во власть».
- source_word: לְעַם אַחֵר
  choice: другому народу
  rationale: «Народ» прямо передаёт עַם, а «другому» сохраняет значение אַחֵר, не усиливая его до «чужеземного».
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: ты будешь смотреть на них
  rationale: Фраза передаёт непосредственное и беспомощное наблюдение родителя. Дополнение «на них» естественно связывает зрение с детьми, оставаясь в рамках контекста.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: глаза твои весь день будут изнывать от тоски по ним
  rationale: כלה описывает истощение, угасание или изнеможение; в сочетании с направленностью к детям выражает мучительную тоску. Формулировка сохраняет образ изнемогающих глаз и его эмоциональную силу.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественная современная русская передача продолжительности действия.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: но рука твоя будет бессильна
  rationale: Еврейская идиома означает отсутствие силы или возможности действовать. Образ руки сохранён, а смысл ясно выражен современным русским языком.
theological_decisions:
- issue: Передача идиомы וְאֵין לְאֵל יָדֶךָ
  choice: но рука твоя будет бессильна
  alternative: и это будет не в твоей власти; и не будет силы в руке твоей
  rationale: В данном обороте אֵל обозначает силу или способность, а не Бога. Идиоматический перевод предотвращает ошибочное богословское прочтение и при этом сохраняет образ руки.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены прямое перечисление сыновей и дочерей, телесный образ изнывающих глаз и образ бессильной руки; синтаксис сделан естественным для обычного читателя.
