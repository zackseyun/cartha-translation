  source_fidelity: 'Текст точно передаёт еврейский оригинал: подневольное служение врагам, которых Яхве направляет против адресата; четыре состояния лишения; образ железного ярма; уничтожение как итог. «В нужде во всём» адекватно передаёт בְּחֹסֶר כֹּל, не сужая его до одного вида нужды.'
