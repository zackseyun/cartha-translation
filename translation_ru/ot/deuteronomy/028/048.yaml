language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: ru
  text: И будешь служить своим врагам, которых Яхве пошлёт против тебя, в голоде и жажде, в наготе и нужде во всём; и он возложит[a] железное ярмо на твою шею, пока не истребит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно также понимать врага, упомянутого собирательно, как субъекта слов «возложит» и «истребит». В основном тексте субъектом остаётся Яхве.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: и будешь служить
  rationale: Глагол עבד здесь обозначает подневольное служение врагам в контексте проклятия завета, а не поклонение.
- source_word: אֶת אֹיְבֶיךָ
  choice: своим врагам
  rationale: Прямое и естественное обозначение неприятелей; возвратное местоимение по-русски ясно соотносит их с адресатом.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: которых Яхве пошлёт против тебя
  rationale: Предлог בּ передаёт направленность враждебного действия; «против тебя» естественно выражает этот смысл. Единственное местоименное дополнение при глаголе понимается собирательно по отношению к врагам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, без замены титулом.
- source_word: בְּרָעָב וּבְצָמָא
  choice: в голоде и жажде
  rationale: Сохраняется повторяющаяся предложная конструкция, описывающая состояние лишения во время подневольного служения.
- source_word: וּבְעֵירֹם
  choice: в наготе
  rationale: Прямо передаёт отсутствие одежды и сохраняет суровость перечня проклятий.
- source_word: וּבְחֹסֶר כֹּל
  choice: в нужде во всём
  rationale: Естественная современная русская формулировка, передающая всеохватный недостаток необходимого.
- source_word: וְנָתַן
  choice: и он возложит
  rationale: В основном тексте субъектом считается Яхве, названный в предшествующей части; «возложит» естественно сочетается с образом ярма.
- source_word: עֹל בַּרְזֶל
  choice: железное ярмо
  rationale: Точно и идиоматично сохраняет образ крайне тяжёлого порабощения.
- source_word: עַל צַוָּארֶךָ
  choice: на твою шею
  rationale: Прямое воспроизведение телесного образа подчинения.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: пока не истребит тебя
  rationale: Hiphil глагола שׁמד выражает доведение до уничтожения; «истребит» сохраняет силу формулировки без добавочного истолкования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» является его общепринятой научной передачей по-русски.
- issue: Субъект форм וְנָתַן и הִשְׁמִידוֹ
  choice: 'Яхве остаётся субъектом: «он возложит… пока не истребит тебя»'
  alternative: Субъектом становится враг, понимаемый собирательно
  rationale: Ближайший явно названный субъект — Яхве, и последовательность форм единственного числа допускает продолжение с тем же субъектом. Однако синтаксис позволяет отнести действия и к врагу как орудию суда, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмом заветного проклятия. Повтор «в» сохранён в двух параллельных парах, чтобы передать накопление лишений; местоимение «он» не капитализировано согласно обычной современной орфографической практике.
