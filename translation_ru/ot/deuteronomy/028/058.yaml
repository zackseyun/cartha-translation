id: DEU.28.58
reference: Deuteronomy 28:58
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: ru
  text: Если ты не будешь тщательно исполнять все слова этого закона, записанные в этой книге[a], чтобы бояться[b] этого славного и внушающего трепет имени — Яхве[c], твоего Бога, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этом свитке».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы благоговеть перед этим славным и внушающим трепет именем». Еврейский глагол может выражать и страх, и благоговейное почтение.'
    reason: lexical_alternative
  - marker: c
    text: 'Евр.: «YHWH»; традиционно переводится как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: не будешь тщательно исполнять
  rationale: Сочетание שׁמר с инфинитивом עשׂה обозначает внимательное соблюдение с практическим исполнением; «тщательно исполнять» естественно передаёт обе стороны выражения.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: все слова этого закона
  rationale: Сохраняется буквальный компонент דִּבְרֵי («слова»), а תּוֹרָה в данном контексте обозначает записанный свод закона завета.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: записанные в этой книге
  rationale: Причастие указывает на письменную фиксацию текста; «книга» — естественное современное соответствие סֵפֶר, при этом исторически возможное «свиток» вынесено в примечание.
- source_word: לְיִרְאָה
  choice: чтобы бояться
  rationale: Инфинитив с לְ передаёт цель или результат. Глагол ירא включает страх и благоговейное почтение; основной текст сохраняет более сильное «бояться».
- source_word: הַשֵּׁם
  choice: имени
  rationale: Сохранён образ имени как явленной личности и славы Бога, без замены поясняющей перифразой.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: славного и внушающего трепет
  rationale: «Славного» передаёт честь и весомость נכבד, а «внушающего трепет» сохраняет сочетание благоговения и страха в נורא, не сводя его лишь к угрозе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Прямо сохранены форма единственного числа второго лица и указание на отношения завета.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя YHWH. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: 'Смысл ירא: страх или почитание'
  choice: бояться
  alternative: почитать; благоговеть
  rationale: Выбрано «бояться», чтобы сохранить присущую тексту напряжённость между страхом и благоговением; более мягкое понимание отмечено в сноске.
- issue: Связь לְיִרְאָה с исполнением закона
  choice: чтобы бояться
  alternative: и бояться
  rationale: Целевая конструкция с לְ сохранена через «чтобы», без превращения её в отдельное однородное условие.
translation_notes:
  register: Современный литературный русский язык с обращением на «ты», соответствующим еврейской форме 2-го лица единственного числа. Синтаксис сохраняет условную конструкцию и незавершённость стиха, продолжающегося в следующем предложении; конечное тире отражает это продолжение. Регистр торжественный, но понятный, без архаизмов.
