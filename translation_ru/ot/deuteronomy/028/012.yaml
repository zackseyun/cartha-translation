base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: ru
  text: Яхве откроет тебе Свою благую сокровищницу[a] — небеса, чтобы давать твоей земле дождь в своё время и благословлять всякое дело твоих рук. Ты будешь давать взаймы многим народам, а сам занимать не будешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своё доброе хранилище». Еврейское слово может обозначать сокровищницу, кладовую или хранилище; в данном контексте речь идёт о небесах, дающих дождь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога и сохраняет его заветный смысл.
- source_word: יִפְתַּח
  choice: откроет
  rationale: Имперфект Qal в контексте обещанного благословения имеет естественное будущее значение; конкретная метафора сохранена.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: Свою добрую сокровищницу
  rationale: אוֹצָר может означать сокровищницу или хранилище. «Сокровищница» естественно звучит по-русски и сохраняет образ небесного запаса благ, тогда как прилагательное «добрую» передаёт הַטּוֹב без истолковывающего расширения.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Сохраняет форму и возвышенный библейский регистр; приложение поясняет, что именно небеса названы сокровищницей.
- source_word: לָתֵת מְטַר אַרְצְךָ
  choice: чтобы давать твоей земле дождь
  rationale: Естественная русская конструкция точно передаёт целевой инфинитив и отношение дождя к земле, не создавая неестественного оборота «дождь твоей земли».
- source_word: בְּעִתּוֹ
  choice: в своё время
  rationale: Местоименная отсылка наиболее естественно относится к дождю; выражение сохраняет акцент на своевременности сезонных осадков.
- source_word: וּלְבָרֵךְ
  choice: и благословлять
  rationale: Сохраняет инфинитивную параллель с «давать» и координацию целей или результатов.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: всякое дело твоих рук
  rationale: Передаёт еврейскую идиому о человеческом труде естественным для русского библейского регистра выражением; множественное «рук» по-русски идиоматичнее исходного грамматического единственного.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: Ты будешь давать взаймы многим народам
  rationale: Hiphil глагола לוה здесь означает давать взаймы; «народам» соответствует национальному контексту גּוֹיִם.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: а сам занимать не будешь
  rationale: Qal לוה означает занимать. «А сам» ясно и естественно передаёт контраст, выраженный וְאַתָּה, не меняя содержания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Образ небес как Божьей сокровищницы
  choice: Сохранить приложение «Свою добрую сокровищницу — небеса»
  alternative: Истолковать как «откроет небеса, Свою богатую кладовую»
  rationale: Приложение в исходном тексте отождествляет сокровищницу с небесами. Буквенный образ сохранён без уточнения механизма благословения или богословского переосмысления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя; сохранены метафора сокровищницы, заветное имя и контраст между предоставлением и получением займа.
