base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: ru
  text: 'Утром ты будешь говорить[a]: «О, если бы был вечер!» — а вечером будешь говорить: «О, если бы было утро!» — от страха в твоём сердце, которого ты будешь страшиться[b], и от зрелища, которое ты увидишь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Кто даст вечер / утро?» Это еврейское выражение сильного желания: «О, если бы был вечер / было утро!»'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более буквально: «из-за страха твоего сердца, которого ты будешь бояться, и из-за вида (зрелища), который ты увидишь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Утром
  rationale: Естественная русская передача определённого обстоятельства времени.
- source_word: תֹּאמַר
  choice: ты будешь говорить
  rationale: Имперфект 2-го лица мужского рода в контексте проклятия выражает предсказание будущего состояния.
- source_word: מִי יִתֵּן
  choice: О, если бы уже был / было
  rationale: Еврейская формула буквально означает «Кто даст?», но идиоматически выражает сильное желание; «уже» передаёт томительное ожидание смены времени суток.
- source_word: עֶרֶב / בֹּקֶר
  choice: вечер / утро
  rationale: Сохраняется антитетический параллелизм исходного текста.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: от страха, охватившего твоё сердце
  rationale: Передаёт причинное значение מִן и естественно выражает по-русски страх во внутреннем человеке; буквальный повтор однокоренных слов в русском звучал бы тяжеловесно.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: и от того, что увидят твои глаза
  rationale: Сохраняет конкретный образ глаз и причинный параллелизм, не создавая неестественного русского повтора «зрелища глаз, которое увидишь».
