lexical_decisions:
- source_word: אָרוּר
  choice: Прокляты будут
  rationale: Страдательное причастие в безглагольной формуле проклятия. Будущее время естественно передаёт провозглашение последствий заветного проклятия; множественное число согласовано с двумя однородными подлежащими.
- source_word: טַנְאֲךָ
  choice: твоя корзина
  rationale: טֶנֶא обозначает корзину, нередко для собранных плодов. Общее слово «корзина» сохраняет широту значения и не уточняет содержимое сверх исходного текста.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: и твоя квашня
  rationale: מִשְׁאֶרֶת — сосуд, в котором замешивали тесто. «Квашня» — точное и компактное русское обозначение такой ёмкости; сноска поясняет слово для современного читателя.
