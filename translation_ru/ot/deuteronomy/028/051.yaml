base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: ru
  text: Он будет пожирать приплод твоего скота и плоды твоей земли, пока не погубит тебя. Он не оставит тебе ни зерна, ни молодого вина, ни масла, ни приплода крупного скота, ни приплода твоих отар[a], пока не уничтожит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение עַשְׁתְּרֹת צֹאנֶךָ редкое и не вполне однозначное; возможно также: «молодняк твоего мелкого скота». Здесь оно, вероятно, обозначает потомство или продуктивный прирост отары.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: Он будет пожирать
  rationale: Глагол אָכַל буквально означает «есть», но в контексте нашествия и полного истощения запасов «пожирать» естественно передаёт интенсивность действия. Местоимение «он» продолжает обозначение вражеского народа из предыдущего контекста.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: приплод твоего скота
  rationale: Слово פְּרִי, буквально «плод», применительно к домашнему скоту означает его потомство, то есть приплод.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: плоды твоей земли
  rationale: Сочетание обозначает сельскохозяйственный урожай; «плоды земли» сохраняет образ оригинала и естественно звучит по-русски.
- source_word: עַד הִשָּׁמְדָךְ
  choice: пока не погубит тебя
  rationale: Форма выражает конечный предел действия — полную гибель адресата. Активная конструкция в русском языке ясно сохраняет подразумеваемого деятеля, вражеский народ.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: Он не оставит тебе ни
  rationale: Относительное придаточное естественно передано самостоятельным предложением; отрицательная конструкция с повторяющимся «ни» подчёркивает полное лишение.
- source_word: דָּגָן
  choice: зерно
  rationale: Слово обозначает зерновые культуры или их урожай в целом.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Термин обычно относится к свежему вину или виноградному продукту нового урожая; «молодое вино» сохраняет отличие от общего слова «вино».
- source_word: יִצְהָר
  choice: масло
  rationale: В традиционной триаде «зерно, молодое вино и масло» имеется в виду оливковое масло; краткое «масло» соответствует контексту и библейскому словоупотреблению.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: приплод крупного скота
  rationale: שְׁגַר обозначает потомство или прирост скота, а אֲלָפִים здесь — крупный рогатый скот. Такой перевод не сужает значение исключительно до телят, хотя прежде всего подразумеваются они.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: приплод твоих отар[a]
  rationale: Редкое выражение, вероятно, обозначает потомство или продуктивный прирост мелкого скота. «Приплод твоих отар» передаёт контекстуальный смысл, а неоднозначность отмечена в сноске.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: пока не уничтожит тебя
  rationale: Каузативная форма אבד означает «погубить, уничтожить». Формулировка передаёт суровость проклятия и итоговую точку действия.
theological_decisions:
- issue: Единственное число деятеля в проклятии
  choice: Сохранено местоимение «он», относящееся к вражескому народу из предыдущего стиха
  alternative: Безличное или множественное «они»
  rationale: Еврейские глаголы стоят в мужском роде единственного числа и продолжают собирательное обозначение вторгшегося народа; перевод не уточняет его сверх текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией заветного проклятия. Повтор «пока не» и ряд с «ни» сохраняют нарастающую силу и структуру еврейского текста; различие между крупным скотом и отарами передано без излишнего сужения редких животноводческих терминов.
