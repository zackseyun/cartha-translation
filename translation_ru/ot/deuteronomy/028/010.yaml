lexical_decisions:
- source_word: וְרָאוּ
  choice: И увидят
  rationale: Форма в последовательности благословений выражает будущее следствие; союз ו передан нейтральным «и», без усиления причинно-следственной связи.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: все народы земли
  rationale: Контекст говорит о множестве народов за пределами Израиля, поэтому הָאָרֶץ здесь естественно понимать широко — «земля», а עַמִּים передать как «народы».
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что увидят народы.
- source_word: שֵׁם יְהוָה
  choice: имя Яхве
  rationale: Сохранена конструкция исходного текста и личное covenantное имя Бога передано как «Яхве».
- source_word: נִקְרָא עָלֶיךָ
  choice: наречено над тобой
  rationale: Так сохраняются пассивная форма и пространственный образ предлога עַל; идиома обозначает публичную принадлежность и отождествление с Яхве, не сводя смысл к одному толкованию.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: и убоятся тебя
  rationale: Глагол ירא здесь выражает страх народов перед Израилем вследствие явного Божьего покровительства; управление с מן естественно передано прямым дополнением.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Смысл идиомы נִקְרָא עָלֶיךָ
  choice: имя Яхве наречено над тобой
  alternative: ты назван именем Яхве; имя Яхве провозглашено над тобой
  rationale: Выбранная формулировка сохраняет образ исходного текста и его смысл covenantной принадлежности, не превращая идиому в полностью истолковывающий пересказ.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Наречено» и «убоятся» сохраняют достоинство и лаконизм оригинала; необычность оборота «наречено над тобой» пояснена сноской.
