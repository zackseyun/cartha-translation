base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: ru
  text: 'И произойдёт так: как Яхве радовался о вас, делая вам добро и умножая вас, так Яхве будет радоваться о вас, губя и истребляя вас; и вы будете вырваны с земли, в которую ты[a] вступаешь, чтобы овладеть ею.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь еврейский текст переходит от множественного «вы» к единственному «ты», обращаясь к Израилю как к единому народу.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: И произойдёт так
  rationale: Передаёт формулу наступающего последствия естественным современным русским языком.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: радовался / будет радоваться
  rationale: Один и тот же русский корень сохраняет намеренный риторический параллелизм между благословением и судом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога транслитерацией.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: делая вам добро
  rationale: Сохраняет широкий смысл благодеяния, не сужая его до материального процветания.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: и умножая вас
  rationale: Сохраняет характерную для Пятикнижия лексику заветного благословения.
- source_word: לְהַאֲבִיד אֶתְכֶם וּלְהַשְׁמִיד אֶתְכֶם
  choice: губя и истребляя вас
  rationale: Два разных глагола передают два близких еврейских глагола и сохраняют суровую силу формулы проклятия.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: и вы будете вырваны с земли
  rationale: «Вырваны» выражает насильственное удаление и передаёт образ сильнее нейтрального «изгнаны».
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: в которую ты вступаешь, чтобы овладеть ею
  rationale: Естественно передаёт направление движения и объект обладания, сохраняя переход к единственному числу.
theological_decisions:
- issue: Радость Яхве при совершении суда
  choice: сохранено прямое утверждение, что Яхве «будет радоваться», губя и истребляя Израиль
  alternative: смягчить выражение как «Яхве решит погубить вас» или «не пощадит вас»
  rationale: Еврейский текст намеренно строит резкую симметрию между радостью при благословении и радостью при суде; перевод не устраняет эту богословскую напряжённость.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, прямо представленное в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Параллельная конструкция и суровая лексика суда сохранены; различие числа в обращении отражено непосредственно в тексте и пояснено сноской.
