id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: ru
  text: Твой вол будет заколот у тебя на глазах, но ты не будешь есть его мяса; твоего осла силой уведут прямо у тебя на глазах[a], и он к тебе не вернётся; твой мелкий скот будет отдан твоим врагам, и некому будет тебя спасти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет отнят у тебя»; еврейское слово подразумевает насильственное отнятие или грабёж.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и не будет у тебя избавителя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: твой вол
  rationale: שׁוֹר обозначает крупное рогатое животное, нередко рабочее; «вол» точно передаёт единственное число и хозяйственный контекст.
- source_word: טָבוּחַ
  choice: будет заколот
  rationale: Страдательное причастие от טבח означает убой животного, а не просто его смерть; в последовательности проклятий естественно передаётся будущим временем.
- source_word: לְעֵינֶיךָ
  choice: у тебя на глазах
  rationale: Современный русский фразеологизм сохраняет смысл открытого совершения события в присутствии владельца и подчёркивает его бессилие.
- source_word: וְלֹא תֹאכַל מִמֶּנּוּ
  choice: но ты не будешь есть его мяса
  rationale: Буквально «не будешь есть от него»; по-русски указание на мясо естественно выражает, что владелец не получит никакой пищи от заколотого вола.
- source_word: חֲמֹרְךָ
  choice: твоего осла
  rationale: «Осёл» — обычное современное соответствие названию домашнего животного.
- source_word: גָּזוּל
  choice: силой уведут
  rationale: Корень גזל обозначает насильственное отнятие или грабёж. В сочетании с ослом глагол «уведут» звучит естественно, а «силой» сохраняет оттенок насилия.
- source_word: מִלְּפָנֶיךָ
  choice: прямо у тебя на глазах
  rationale: Буквально «из пределов твоего лица/присутствия»; перевод сохраняет наглядность насильственного увода в присутствии хозяина.
- source_word: וְלֹא יָשׁוּב לָךְ
  choice: и он к тебе не вернётся
  rationale: Сохраняется активная форма еврейского глагола שוב и естественное русское выражение возвращения животного к владельцу.
- source_word: צֹאנְךָ
  choice: твой мелкий скот
  rationale: צֹאן может включать овец и коз; «мелкий скот» точнее, чем одно «овцы», и понятнее по объёму, чем потенциально узкое «стадо».
- source_word: נְתֻנוֹת לְאֹיְבֶיךָ
  choice: будет отдан твоим врагам
  rationale: Страдательное причастие от נתן передано будущим временем; «отдан» сохраняет прямое значение и зловещую передачу имущества врагам.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: и некому будет тебя спасти
  rationale: מוֹשִׁיעַ — тот, кто спасает или избавляет. Русская безличная конструкция естественна и сохраняет личный характер отсутствующей помощи.
theological_decisions:
- issue: Спасительная лексика в заключительной фразе
  choice: некому будет тебя спасти
  alternative: не будет у тебя избавителя
  rationale: Корень ישׁע прямо выражает спасение или избавление. Здесь речь прежде всего о спасении от конкретного бедствия в рамках заветного проклятия, однако лексическое значение не следует ослаблять до общего «помочь».
translation_notes:
  register: Современный литературный русский язык с прямым, торжественно-сдержанным ритмом. Сохранено обращение во втором лице единственного числа, соответствующее еврейскому тексту. Повтор «у тебя на глазах» намеренно передаёт параллельные выражения לְעֵינֶיךָ и מִלְּפָנֶיךָ, хотя второе усилено словом «прямо».
