base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: ru
  text: Вот слова завета, который Яхве повелел Моисею заключить[a] с сынами Израиля в земле Моава, помимо завета, который Он заключил с ними на Хориве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассечь завет»; далее также: «завета, который Он рассёк с ними». Это древнееврейское устойчивое выражение означает заключение завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: Вот слова завета
  rationale: Указательное אֵלֶּה вводит итоговую или заголовочную формулу; «вот» естественно передаёт её по-русски. דִבְרֵי сохранено как «слова», не сужая значение до одних юридических «условий».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: заключить завет / заключил завет
  rationale: Буквальное «рассечь завет» является древнееврейской идиомой; по-русски её смысл естественно выражается устойчивым сочетанием «заключить завет», а буквальный образ отмечен в сноске.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранена форма исходного выражения и его собирательное обозначение народа Израиля.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: в земле Моава
  rationale: Сохранена полная географическая формула оригинала.
- source_word: מִלְּבַד
  choice: помимо
  rationale: Передаёт отличие данного завета от завета, заключённого прежде на Хориве, не утверждая тождества или полного разрыва между ними.
- source_word: בְּחֹרֵב
  choice: на Хориве
  rationale: Сохранено название Хорив без гармонизации с названием Синай; русский узус требует предлога «на».
theological_decisions:
- issue: Характер выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Еврейское выражение имеет собирательное значение, но дословная традиционная форма сохраняет исходный образ и не исключает принадлежавших к народу женщин.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Соотношение двух заветов
  choice: помимо завета
  alternative: в дополнение к завету; кроме завета
  rationale: מִלְּבַד отмечает отдельность моавского завета от хоривского, однако сам стих не раскрывает точный богословский характер их взаимосвязи; перевод оставляет это напряжение открытым.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «сыны Израиля» и «Хорив» сохраняют связь с исходной терминологией; синтаксис сделан ясным для обычного современного читателя.
