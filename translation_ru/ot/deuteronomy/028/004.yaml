base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: ru
  text: Благословен будет плод твоего чрева, плод твоей земли и плод твоего скота — приплод твоих стад и молодняк твоих отар.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приплод твоего крупного скота и приплод твоего мелкого скота». Еврейские выражения שְׁגַר אֲלָפֶיךָ и עַשְׁתְּרֹת צֹאנֶךָ — традиционные скотоводческие обозначения прироста поголовья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен будет
  rationale: Именное сказуемое в формуле благословения. Будущее время соответствует контексту провозглашаемых заветных благословений и сохраняет торжественный ритм.
- source_word: פְּרִי
  choice: плод
  rationale: 'Одно и то же слово повторено трижды; единообразный перевод сохраняет параллелизм еврейского текста: плод чрева, земли и скота.'
- source_word: בִטְנְךָ
  choice: твоего чрева
  rationale: В данном контексте בטן обозначает чрево как источник потомства. «Чрево» — понятное в торжественной библейской речи конкретное обозначение, сохраняющее образ оригинала.
- source_word: אַדְמָתְךָ
  choice: твоей земли
  rationale: Здесь имеется в виду земля, дающая урожай. «Земля» естественнее по-русски в сочетании «плод земли», чем более узкое «почва».
- source_word: בְהֶמְתֶּךָ
  choice: твоего скота
  rationale: Широкое обозначение домашних животных; «скот» охватывает названные далее стада и отары.
- source_word: שְׁגַר
  choice: приплод
  rationale: В сочетании с אֲלָפֶיךָ слово обозначает произведённое животными потомство; «приплод» точно и естественно передаёт хозяйственно-скотоводческий смысл.
- source_word: אֲלָפֶיךָ
  choice: твоих стад
  rationale: Существительное относится к крупному скоту. Коллективное «стада» естественно противопоставлено «отарам» мелкого скота.
- source_word: עַשְׁתְּרֹת
  choice: молодняк
  rationale: Редкое традиционное скотоводческое слово в сочетании с צֹאנֶךָ обозначает прирост или потомство отары. «Молодняк» сохраняет этот смысл без искусственной одинаковости с предыдущим выражением.
- source_word: צֹאנֶךָ
  choice: твоих отар
  rationale: Коллективное обозначение мелкого скота, прежде всего овец и коз. «Отары» естественно передают группы такого скота и образуют ясную пару со «стадами».
