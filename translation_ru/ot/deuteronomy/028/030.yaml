base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: ru
  text: Ты обручишь себе жену[a], но другой мужчина ляжет с нею[b]; построишь дом, но не будешь жить в нём; посадишь виноградник, но не начнёшь пользоваться его плодами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обручишься с женщиной».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол — грубоватое обозначение полового акта. Его иногда передают более резко, например «надругается над ней» или «изнасилует её», но сама эта форма глагола не уточняет однозначно, идёт ли речь о насилии.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не сделаешь его обычным». Это выражение означает начать употреблять плоды виноградника в пищу; ср. Лев 19:23–25.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ
  choice: обручишься
  rationale: Глагол обозначает вступление в юридически значимое обручение; современное русское «обручишься» передаёт этот смысл естественно и точнее, чем «женишься».
- source_word: אִשָּׁה
  choice: с женщиной
  rationale: При глаголе «обручиться» русское «с женщиной» естественно обозначает будущую жену, не добавляя слова, отсутствующего в еврейском тексте.
- source_word: אִישׁ אַחֵר
  choice: другой мужчина
  rationale: Прямо сохраняет противопоставление адресату.
- source_word: ישגלנה
  choice: овладеет ею
  rationale: Передаёт грубый сексуальный смысл глагола и тяжесть проклятия, но не утверждает однозначно насилие, которое сама данная глагольная форма явно не кодирует.
- source_word: תֵשֵׁב בּוֹ
  choice: будешь жить в нём
  rationale: В сочетании с домом ישב означает проживание; это естественная современная русская формулировка.
- source_word: כֶּרֶם
  choice: виноградник
  rationale: Обычный и точный русский эквивалент.
- source_word: תְחַלְּלֶנּוּ
  choice: начнёшь пользоваться его плодами
  rationale: В отношении виноградника глагол выражает начало обычного употребления плодов, вероятно на фоне Лев 19:23–25; перевод раскрывает идиому, не сводя её к сбору урожая.
