  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: ru
  text: Но если ты не будешь слушать голоса Яхве, твоего Бога[a], чтобы соблюдать и исполнять все Его заповеди и постановления, которые я заповедую тебе сегодня[b], то все эти проклятия придут на тебя и настигнут тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушать голос Яхве, твоего Бога». Это выражение подразумевает слушание, ведущее к послушанию; возможно также: «повиноваться Яхве, твоему Богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «соблюдая и исполняя все Его заповеди и постановления, которые я заповедую тебе сегодня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: Но если... то
  rationale: Вводит условие, противопоставленное предшествующим благословениям; конструкция «если... то» естественно передаёт условно-следственную связь.
- source_word: תִשְׁמַע בְּקוֹל
  choice: будешь слушать голоса
  rationale: Сохраняет еврейский образ слушания голоса, который в данном контексте подразумевает послушание, не сводя его к одному абстрактному глаголу.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твоего Бога
  rationale: Передаёт тетраграмматон личным именем «Яхве» и сохраняет обращение к Израилю во втором лице единственного числа.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: соблюдать и исполнять
  rationale: Передаёт оба инфинитива и различает внимательное соблюдение предписаний и их практическое исполнение.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: Его заповеди и постановления
  rationale: Сохраняет различие двух терминов заветно-правовой лексики.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я даю тебе сегодня
  rationale: Естественная русская передача акта повеления в текущей речи Моисея; настоящее время и «сегодня» сохранены.
- source_word: וּבָאוּ עָלֶיךָ
  choice: обрушатся на тебя
  rationale: Естественно и образно передаёт наступление проклятий, буквально приходящих на человека.
- source_word: וְהִשִּׂיגוּךָ
  choice: и настигнут тебя
  rationale: Сохраняет яркий образ преследования и достижения цели.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное заветное имя; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Степень явности значения послушания в תִשְׁמַע בְּקוֹל
  choice: слушать голоса
  alternative: повиноваться
  rationale: Сохранён библейский образ слышащего и послушного отклика; подразумеваемое значение пояснено в сноске без устранения образности в основном тексте.
- issue: Связь לִשְׁמֹר לַעֲשׂוֹת с условием
  choice: и не будешь соблюдать и исполнять
  alternative: чтобы соблюдать и исполнять; соблюдая и исполняя
  rationale: Отрицание естественно распространено на скоординированное содержание условия. Сноска отмечает более формальную синтаксическую передачу, сохраняя возможную связь инфинитивов с «слушать».
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранено второе лицо единственного числа, соответствующее еврейскому обращению к Израилю как к единому народу. Правовые термины переданы последовательно, а образная лексика слушания и настигающих проклятий сохранена.
