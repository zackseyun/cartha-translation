revisions:
- from: Но если ты не будешь слушать голоса Яхве, твоего Бога[a], и не будешь соблюдать и исполнять все Его заповеди и постановления, которые я даю тебе сегодня[b], то все эти проклятия обрушатся на тебя и настигнут тебя.
  to: Но если ты не будешь слушать голоса Яхве, твоего Бога[a], чтобы соблюдать и исполнять все Его заповеди и постановления, которые я заповедую тебе сегодня[b], то все эти проклятия придут на тебя и настигнут тебя.
  rationale: Исправлено «даю» на «заповедую» для точной передачи מְצַוְּךָ; «обрушатся» заменено на нейтральное и прямое «придут»; синтаксическая связь инфинитивов с «слушать» отражена через «чтобы соблюдать и исполнять». Сноска b теперь действительно предлагает синтаксический вариант, а не почти дословно повторяет основной текст.
