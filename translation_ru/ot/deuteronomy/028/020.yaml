revisions:
- from: Яхве пошлёт на тебя проклятие, смятение и кару во всяком деле, за которое ты возьмёшься[a], пока ты не будешь истреблён и вскоре не погибнешь за зло твоих поступков, потому что ты оставил Меня.
  to: Яхве пошлёт на тебя проклятие, смятение и обличение во всяком деле, за которое ты возьмёшься[a], пока ты не будешь уничтожен и быстро не погибнешь — за зло твоих поступков, тем, что ты оставил Меня.
  rationale: Исправлено «кара» на «обличение», чтобы точно передать מִגְעֶרֶת, не подменяя грозное порицание наказанием. Уточнена передача мַהֵר как «быстро» и немного выровнен синтаксис заключительной причинно-пояснительной конструкции. Сноска сохраняет буквальный образ еврейской идиомы.
