review_pass:
  verdict: revise
  source_fidelity: 'В целом структура стиха передана верно: прямое действие Яхве, триада санкций, всеохватность дел, двойной итог и причина сохранены. Однако הַמִּגְעֶרֶת означает «обличение / грозный упрёк, порицание», а не собственно «кару»; замена на «кару» сужает и меняет лексическое значение. Кроме того, מַהֵר относится к паре «будешь уничтожен / погибнешь» и естественнее передаётся как «быстро погибнешь», а не «вскоре не погибнешь».'
  naturalness: «Во всяком деле, за которое ты возьмёшься» — естественный современный русский оборот. Формула «пока ты не будешь истреблён» грамматически допустима, но «пока не будешь уничтожен» более естественна и точнее соотносится с пассивной формой еврейского глагола. «Обличение» в данном судебно-пророческом контексте литературно и понятно.
  terminology: Имя «Яхве» последовательно передаёт יהוה. «Проклятие» и «смятение» приемлемы. Для מִגְעֶרֶת следует сохранить терминологический смысл «обличение», не заменяя его последствием («кара»). Личное «Меня» уместно в принятом религиозном регистре.
  issues:
  - severity: medium
    issue: «кару» для הַמִּגְעֶרֶת
    rationale: Еврейское מִגְעֶרֶת, от גער, обозначает грозное обличение, порицание или выговор; «кара» означает уже наказание и не является тем же самым. В стихе перечислены «проклятие, смятение и обличение», поэтому это различие следует сохранить.
  - severity: low
    issue: «вскоре не погибнешь» для מַהֵר
    rationale: Наречие מַהֵר обозначает быстроту гибели; «быстро погибнешь» яснее и ближе к синтаксису оригинала. «Вскоре не погибнешь» в связке с «пока» стилистически менее прозрачно.
  - severity: low
    issue: Связь заключительного אֲשֶׁר
    rationale: В оригинале «из-за зла твоих поступков, которыми/ибо ты оставил Меня» допускает как относительное, так и пояснительно-причинное понимание. «Потому что» возможно, но «тем, что» лучше сохраняет связь с «поступками» без излишнего синтаксического разрыва.
  revised_text: Яхве пошлёт на тебя проклятие, смятение и обличение во всяком деле, за которое ты возьмёшься[a], пока ты не будешь уничтожен и быстро не погибнешь — за зло твоих поступков, тем, что ты оставил Меня.
  revised_footnotes:
