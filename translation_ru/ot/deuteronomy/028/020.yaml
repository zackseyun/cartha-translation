  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: ru
  text: Яхве пошлёт на тебя проклятие, смятение и обличение во всяком деле, за которое ты возьмёшься[a], пока ты не будешь уничтожен и быстро не погибнешь — за зло твоих поступков, тем, что ты оставил Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всяком простирании твоей руки», то есть во всём, к чему ты приложишь руку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח יְהוָה בְּךָ
  choice: Яхве пошлёт на тебя
  rationale: Порода пиэль глагола שׁלח выражает прямое действие Яхве; предлог ב отмечает того, на кого обрушиваются последствия заветного проклятия.
- source_word: הַמְּאֵרָה
  choice: проклятие
  rationale: Существительное обозначает конкретную санкцию завета; единственное число и определённость сохранены естественной русской формой.
- source_word: הַמְּהוּמָה
  choice: смятение
  rationale: Слово может обозначать смятение, панику или сумятицу. «Смятение» сохраняет широту значения и подходит к нарушению всякой деятельности.
- source_word: הַמִּגְעֶרֶת
  choice: кару
  rationale: Производное от גער обозначает суровый упрёк или грозное пресечение. В контексте ниспосылаемых санкций «кара» естественно передаёт действенный характер божественного обличения, не сводя его к словесному выговору.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: во всяком деле, за которое ты возьмёшься
  rationale: Русская идиома естественно передаёт буквальный образ «во всяком простирании твоей руки, которое ты сделаешь»; исходный образ отмечен в сноске.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: пока ты не будешь истреблён и вскоре не погибнешь
  rationale: Два близких глагола переданы разными русскими соответствиями, чтобы сохранить параллелизм и оттенки уничтожения и гибели; מַהֵר выражает скорое наступление исхода.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ
  choice: за зло твоих поступков
  rationale: מִפְּנֵי имеет причинное значение, а מַעֲלָלִים указывает на совершённые дела или поступки.
- source_word: אֲשֶׁר עֲזַבְתָּנִי
  choice: потому что ты оставил Меня
  rationale: Относительная конструкция раскрывает, в чём состоит зло поступков адресата; «оставил» прямо передаёт עזב и сохраняет личное первое лицо Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Источник суда за нарушение завета
  choice: Яхве непосредственно посылает проклятие, смятение и кару
  alternative: Бедствия приходят без указания действующего лица
  rationale: Яхве является явным подлежащим глагола יְשַׁלַּח; перевод не смягчает и не устраняет прямую божественную субъектность.
- issue: Связь зла поступков с оставлением Бога
  choice: «потому что ты оставил Меня» поясняет причину суда
  alternative: «которыми ты оставил Меня» как характеристика поступков
  rationale: Еврейское אֲשֶׁר допускает относительный или причинно-пояснительный оттенок. Основной текст выбирает естественную причинную связь, не добавляя особого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямотой речи завета. Единственное число второго лица сохранено. Заглавная буква в «Меня» указывает на говорящего Бога по норме религиозного русского письма; архаизмы сведены к минимуму.
