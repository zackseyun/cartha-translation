  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: ru
  text: Он осадит тебя у всех твоих ворот[a], пока по всей твоей земле не падут твои высокие укреплённые стены, на которые ты надеешься. Он осадит тебя у всех твоих ворот по всей твоей земле, которую дал тебе Яхве, твой Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у всех твоих ворот»; ворота здесь могут обозначать сами укреплённые города.'
    reason: Поясняет распространённую метонимию, не устраняя конкретный образ из основного текста.
lexical_decisions:
- source_word: וְהֵצַר
  choice: он осадит тебя
  rationale: Хифиль глагола צור в контексте ворот и укреплённых стен обозначает военную осаду, а не общее притеснение. Повтор передан одинаково.
- source_word: שְׁעָרֶיךָ
  choice: у всех твоих ворот
  rationale: Буквально «в/у всех твоих ворот». Ворота метонимически обозначают укреплённые города, но конкретный образ ворот сохранён в основном тексте.
- source_word: עַד רֶדֶת
  choice: пока … не падут
  rationale: Буквально «до схождения вниз»; применительно к стенам естественное русское «падут» точно передаёт их разрушение при осаде.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: твои высокие укреплённые стены
  rationale: 'Сохранены оба определения: высота стен и их оборонительная укреплённость.'
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: на которые ты надеешься
  rationale: בטח с предлогом ב выражает доверие и опору на что-либо; «надеешься» естественно передаёт уверенность в защитных сооружениях.
- source_word: בְּכָל אַרְצֶךָ
  choice: по всей твоей земле
  rationale: 'Передано распределительное значение сочетания ב с כָּל: действие охватывает всю землю.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: которую дал тебе Яхве, твой Бог
  rationale: Еврейский перфект נָתַן передан прошедшим временем «дал»; приложение «твой Бог» сохранено.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное заветное имя Бога. Форма «Яхве» сохраняет его как имя и соответствует принятой научной реконструкции произношения.
- issue: Объект надежды Израиля
  choice: «стены, на которые ты надеешься»
  alternative: «стены, на которые ты полагаешься»
  rationale: Сохранена богословски значимая мысль о доверии оборонительным сооружениям без добавочного противопоставления доверию Богу, которого данный стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Единственное число «тебя» сохранено как коллективное обращение к Израилю. Повтор «Он осадит тебя у всех твоих ворот» сохранён вслед за еврейским текстом.
