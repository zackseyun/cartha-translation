  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: ru
  text: У тебя будут оливковые деревья по всей твоей земле, но ты не будешь умащать себя маслом, потому что твои оливки[a] опадут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. буквально: «твоя олива». Это слово может употребляться собирательно, обозначая оливки или оливковый урожай; возможно также значение: «твоя олива сбросит плоды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: оливковые деревья
  rationale: Во множественном числе слово может обозначать оливки или оливковые деревья; оборот «по всей твоей земле будут расти» естественно указывает на деревья.
- source_word: יִהְיוּ לְךָ
  choice: будут расти
  rationale: Буквально — «будут у тебя»; в связи с деревьями русское «будут расти» естественно передаёт наличие насаждений, не меняя смысла.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: по всей твоей земле
  rationale: גְּבוּל может означать границу, пределы или территорию. Здесь речь идёт обо всей земле, принадлежащей адресату.
- source_word: וְשֶׁמֶן
  choice: маслом
  rationale: В еврейском тексте стоит общее слово «масло»; контекст ясно показывает, что имеется в виду оливковое масло.
- source_word: לֹא תָסוּךְ
  choice: не будешь умащать себя
  rationale: Глагол означает натирать или умащать тело маслом. «Умащать себя» сохраняет древнюю бытовую практику и возвышенный библейский регистр, не делая действие непременно обрядовым.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой масло не будет доступно.
- source_word: יִשַּׁל
  choice: опадут
  rationale: Глагол описывает осыпание или падение плодов; «опадут» кратко и естественно передаёт преждевременную потерю урожая.
- source_word: זֵיתֶךָ
  choice: твои оливки
  rationale: Единственное число употреблено собирательно и может обозначать оливу, её плод или урожай. В основном тексте выбраны плоды как наиболее естественный субъект глагола «опадут», а неоднозначность отмечена в сноске.
