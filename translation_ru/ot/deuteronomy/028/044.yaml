  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: ru
  text: Он будет давать тебе взаймы[a], а ты ему взаймы давать не будешь; он будет головой, а ты будешь хвостом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть пришелец, упомянутый в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: будет давать тебе взаймы / ему взаймы давать не будешь
  rationale: В данной породе и контексте глагол означает «давать взаймы». Повтор одной и той же русской конструкции сохраняет параллелизм и подчёркивает зависимость должника от заимодавца.
- source_word: הוּא
  choice: он
  rationale: Местоимение мужского рода единственного числа отсылает к пришельцу из предыдущего стиха; русский текст сохраняет его число и род.
- source_word: לְרֹאשׁ
  choice: головой
  rationale: Буквально сохранена устойчивая метафора главенства и высокого положения, перекликающаяся с более ранней формулировкой этой главы.
- source_word: לְזָנָב
  choice: хвостом
  rationale: Прямой перевод сохраняет яркий метафорический контраст с «головой» и выражает подчинённое положение.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: будет / будешь
  rationale: Формы глагола היה обозначают будущее положение в контексте проклятия завета; простое будущее естественно для современного русского языка.
- source_word: וְאַתָּה
  choice: а ты
  rationale: Союз «а» естественно передаёт подчёркнутое еврейским местоимением противопоставление в обеих частях стиха.
theological_decisions:
- issue: Род и число лица, названного местоимением
  choice: 'Сохранить единственное число мужского рода: «он»'
  alternative: Повторить существительное «пришелец» или передать множественным числом
  rationale: Еврейский текст употребляет мужское единственное число и отсылает к пришельцу из предыдущего стиха как к типичному представителю группы. Основной текст сохраняет местоименную форму, а сноска проясняет отсылку.
- issue: Метафора общественного и экономического положения
  choice: Сохранить буквально «головой» и «хвостом»
  alternative: 'Передать толкованием: «главным» и «подчинённым»'
  rationale: Буквальный образ понятен по-русски, сохраняет напряжённость текста и связь с противоположным обещанием во Второзаконии 28:13.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «давать взаймы» ясна обычному читателю и точнее, чем потенциально двусмысленное «одалживать». Метафоры «голова» и «хвост» сохранены без поясняющей подмены.
