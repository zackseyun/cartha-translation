  text: за то, что ты не служил Яхве, твоему Богу, с радостью и с весельем в сердце[a], при полном изобилии всего[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с радостью и с благом сердца». Буквально еврейское выражение говорит о «благе (доброте) сердца»; в данном контексте оно может обозначать внутреннюю радость или благополучие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от изобилия всего». Возможные переводы: «при изобилии всего» или «когда у тебя было изобилие всего». Смысл в том, что Израиль не служил Яхве, несмотря на дарованное ему изобилие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: за то, что
  rationale: В контексте провозглашения проклятия оборот указывает на основание воздаяния. Русское «за то, что» естественно передаёт одновременно причинный смысл и оттенок возмездия.
- source_word: עָבַדְתָּ
  choice: служил
  rationale: Глагол עבד при Боге как дополнении обозначает заветное служение, включающее поклонение и послушание; «служил» сохраняет эту широту.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем יהוה и титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: Суффикс второго лица мужского рода единственного числа соответствует обращению к Израилю как к единому народу.
- source_word: בְּשִׂמְחָה
  choice: с радостью
  rationale: Предложный оборот описывает образ служения; «с радостью» точно и естественно передаёт смысл.
- source_word: וּבְטוּב לֵבָב
  choice: и от доброго сердца
  rationale: Буквально выражение говорит о «добре/благости сердца». Русское «от доброго сердца» сохраняет образ сердца и не сводит выражение к повторению уже названной радости.
- source_word: מֵרֹב כֹּל
  choice: имея изобилие во всём
  rationale: 'Оборот указывает на обстоятельства: Израиль не служил Богу должным образом, хотя был обильно обеспечен. Такая передача избегает ошибочного впечатления, будто изобилие само стало прямой причиной непослушания.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное заветное имя Бога; транслитерация не подменяет его титулом.
- issue: Смысл служения в עבד
  choice: служил
  alternative: поклонялся
  rationale: «Служил» охватывает как поклонение, так и практическое послушание в рамках завета, тогда как «поклонялся» сужает значение.
- issue: Соотношение שִׂמְחָה и טוּב לֵבָב
  choice: с радостью и от доброго сердца
  alternative: с радостью и весельем в сердце
  rationale: Выбранная формулировка сохраняет различие двух еврейских выражений и подлинную неоднозначность טוּב לֵבָב, которое может подразумевать внутреннее благополучие или радостное расположение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Единственное число «ты» сохранено как коллективное обращение к Израилю. Начальная строчная буква и конечная запятая отражают синтаксическую незавершённость стиха в более широком предложении.
