  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: ru
  text: Виноградники ты будешь сажать и возделывать, но вина не будешь пить и урожая не соберёшь[a], потому что его съест червь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не запасёшь его». Еврейский глагол может означать «собирать», «накапливать» или «запасать».'
