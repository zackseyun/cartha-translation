lexical_decisions:
- source_word: כְּרָמִים
  choice: виноградники
  rationale: Прямое соответствие форме множественного числа; естественно для земледельческого контекста.
- source_word: תִּטַּע
  choice: ты будешь сажать
  rationale: Форма обозначает будущее действие в последовательности проклятий; современная русская конструкция передаёт это естественно.
- source_word: וְעָבָדְתָּ
  choice: и возделывать
  rationale: В земледельческом контексте עבד означает обрабатывать или возделывать землю и насаждения; подразумеваемый объект — виноградники.
- source_word: יַיִן לֹא תִשְׁתֶּה
  choice: вина не будешь пить
  rationale: Сохраняет прямое значение и естественный русский порядок слов с акцентом на недоступный плод труда.
- source_word: וְלֹא תֶאֱגֹר
  choice: и урожая не соберёшь
  rationale: Глагол אגר допускает значения «собирать», «накапливать», «запасать». В контексте уничтожения виноградников вредителем подразумевается урожай; существительное добавлено для ясности, а лексическая неоднозначность отмечена в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину отсутствия вина и урожая.
- source_word: תֹאכְלֶנּוּ
  choice: его съест
  rationale: Передаёт буквальный образ поедания; местоимение естественно соотносится с названным в переводе урожаем.
- source_word: הַתֹּלָעַת
  choice: червь
  rationale: Широкое и буквальное обозначение вредителя без неоправданного уточнения его биологического вида.
