  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: ru
  text: Яхве поразит тебя тяжёлыми нарывами на коленях и голенях[a], от которых ты не сможешь исцелиться, — от подошвы твоей ноги до твоего темени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово обозначает нижнюю часть ноги; возможный перевод: «на икрах».'
    reason: Лексема שׁוֹק относится к нижней части ноги и в данном контексте может пониматься несколько по-разному анатомически.
lexical_decisions:
- source_word: יַכְּכָה
  choice: поразит тебя
  rationale: Порода хифиль глагола נכה выражает непосредственное поражение или нанесение удара; «поразит тебя» естественно и сохраняет силу исходного выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте, не заменяя именование титулом.
- source_word: בִּשְׁחִין רָע
  choice: тяжёлыми нарывами
  rationale: שְׁחִין обозначает воспалённые кожные нарывы; единственное число имеет собирательное значение, а רָע указывает на тяжесть болезненного состояния.
- source_word: עַל הַבִּרְכַּיִם
  choice: на коленях
  rationale: Прямая и естественная передача анатомического обозначения.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: и голенях
  rationale: שׁוֹק здесь обозначает нижнюю часть ноги; «голени» точнее общего «ноги» и остаётся понятным современному читателю.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: от которых ты не сможешь исцелиться
  rationale: Пассивная форма сохраняет направленность еврейского выражения на неизлечимость поражения, не уточняя способ или возможного целителя.
- source_word: מִכַּף רַגְלְךָ
  choice: от подошвы твоей ноги
  rationale: Сочетание כַּף с רֶגֶל идиоматически обозначает подошву стопы; формулировка сохраняет образ полного охвата тела.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: до темени твоей головы
  rationale: קָדְקֹד означает темя, верхнюю часть головы; перевод передаёт верхнюю границу меризма.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не подменяет его титулом; она не добавляет конфессионального истолкования.
- issue: Субъект поражения
  choice: Яхве поразит тебя
  alternative: ты будешь поражён тяжёлыми нарывами
  rationale: Активная конструкция исходного текста прямо называет Яхве действующим субъектом; перевод сохраняет эту богословски значимую прямоту.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаической интонацией. Сохранены прямое действие Яхве, неизлечимость поражения и меризм «от подошвы… до темени», выражающий охват всего тела. Маркер [a] помещён непосредственно после соответствующего слова.
