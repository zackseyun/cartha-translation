lexical_decisions:
- source_word: זֶרַע רַב
  choice: много семян
  rationale: זֶרַע обозначает семя, в том числе посевной материал, а רַב указывает на большое количество. «Много семян» естественно по-русски и сохраняет конкретный земледельческий образ.
- source_word: תּוֹצִיא
  choice: вынесешь
  rationale: Порода хифиль глагола יצא буквально передаёт значение «вынести, вывести наружу». В контексте речь идёт о семенах, которые несут в поле для посева; буквальный образ сохранён, а подразумеваемое действие пояснено в сноске.
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: שׂדה — обычное обозначение поля или обрабатываемой земли. Русское «в поле» естественно передаёт направление движения в данном контексте.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: но соберёшь мало
  rationale: אסף означает «собирать»; в земледельческом контексте подразумевается сбор урожая. Формулировка сохраняет глагол исходного текста и противопоставление между многими семенами и малым сбором.
- source_word: כִּי
  choice: потому что
  rationale: Здесь כִּי вводит причину малого урожая; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: יַחְסְלֶנּוּ
  choice: их пожрёт
  rationale: חסל выражает полное поедание или уничтожение. «Пожрёт» естественно сочетается с саранчой и передаёт силу глагола; местоимение «их» согласовано с русским множественным «семян», тогда как еврейский суффикс единственного числа относится к собирательному זֶרַע.
- source_word: הָאַרְבֶּה
  choice: саранча
  rationale: אַרְבֶּה — обычное название саранчи. В русском «саранча» естественно употребляется как собирательное существительное и передаёт еврейскую форму без обязательного добавления слова «рой».
