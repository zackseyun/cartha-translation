lexical_decisions:
- source_word: בָּרוּךְ
  choice: благословен
  rationale: Страдательное причастие от ברך употреблено как именная часть сказуемого в формуле заветного благословения. «Благословен» сохраняет торжественную краткость и не добавляет явной временной формы, которой нет в еврейском тексте; в контексте раздела выражение имеет направленность в будущее.
- source_word: אַתָּה
  choice: ты
  rationale: Местоимение второго лица мужского рода единственного числа. Израиль как народ завета представлен единым адресатом; форма «ты» непосредственно передаёт грамматику оригинала.
- source_word: בְּבֹאֶךָ
  choice: при входе твоём
  rationale: Предлог ב с инфинитивом בוא и суффиксом второго лица единственного числа буквально обозначает обстоятельство входа или прихода. Формулировка сохраняет образ и параллельную структуру оригинала.
- source_word: וּבָרוּךְ
  choice: и благословен
  rationale: Союз ו соединяет повторённую формулу благословения. Повтор сохраняет риторическое равновесие еврейской строки.
- source_word: בְּצֵאתֶךָ
  choice: при выходе твоём
  rationale: Предлог ב с инфинитивом יצא и личным суффиксом обозначает обстоятельство выхода. В паре со «входом» выражение охватывает повседневные пути и занятия человека.
theological_decisions:
- issue: Обращение к Израилю в единственном числе
  choice: Сохранить форму «ты», не заменяя её множественным числом и не подставляя в основной текст имя «Израиль».
  alternative: «Благословенны вы…» или «Благословен Израиль…»
  rationale: Еврейский текст обращается к народу завета как к единому адресату во втором лице мужского рода единственного числа. Сохранение формы «ты» передаёт как грамматику, так и корпоративный характер обращения без толковательного расширения.
- issue: Временная отнесённость формулы благословения
  choice: Передать именной конструкцией «благословен ты» без добавления связки будущего времени.
  alternative: «Благословен будешь ты» или «ты будешь благословен».
  rationale: В оригинале употреблено причастие без явно выраженной связки. Контекст придаёт благословению будущую направленность, однако русская именная формула сохраняет и торжественное провозглашение, и отсутствие грамматически обозначенного времени.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной ритмикой формулы благословения. Лексика понятна широкому читателю; синтаксический параллелизм и повтор оригинала сохранены.
