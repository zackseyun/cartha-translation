lexical_decisions:
- source_word: וְהָיִיתָ
  choice: И станешь ты
  rationale: Форма в последовательности проклятий имеет будущее результативное значение; «станешь» естественно передаёт наступление нового состояния.
- source_word: לְשַׁמָּה
  choice: ужасом
  rationale: В контексте суда слово обозначает нечто настолько бедственное и потрясающее, что оно вызывает ужас или изумление; творительный предикатив естественен по-русски.
- source_word: לְמָשָׁל
  choice: притчей
  rationale: Сохраняет основной образ מָשָׁל — израильтянин станет предметом ставшего нарицательным изречения; отрицательный оттенок задаётся контекстом проклятия и соседним словом.
- source_word: וְלִשְׁנִינָה
  choice: насмешкой
  rationale: Передаёт отдельный от מָשָׁל смысл язвительного, уничижительного речения, не сводя два еврейских термина к одному «присловью».
- source_word: בְּכֹל הָעַמִּים
  choice: среди всех народов
  rationale: Точно и естественно передаёт множественное עַמִּים.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: куда Яхве угонит тебя
  rationale: נהג допускает значения «вести» и «гнать»; «угонит» передаёт принудительное перемещение в контексте проклятия и изгнания, а אֲשֶׁר со שָׁמָּה — направление «куда».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: שָׁמָּה
  choice: куда
  rationale: Значение направления «туда» естественно включено в русское относительное наречие «куда».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Степень принуждения в יְנַהֶגְךָ
  choice: угонит
  alternative: поведёт
  rationale: Глагол допускает оба оттенка; в контексте проклятия и рассеяния «угонит» лучше выражает насильственный характер изгнания, при этом альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской интонацией. Инверсия «станешь ты» сохраняет ритм и акцент, не создавая архаичности. Различие между מָשָׁל и שְׁנִינָה сохранено посредством «притчей» и «насмешкой».
