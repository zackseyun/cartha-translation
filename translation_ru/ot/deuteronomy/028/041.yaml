    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей и дочерей
  rationale: Еврейский текст прямо называет потомков мужского и женского пола; парное выражение сохраняет полноту и риторический строй оригинала.
- source_word: תּוֹלִיד
  choice: ты станешь отцом
  rationale: Форма обращена к мужчине и обозначает появление у него потомства. Такой перевод естественен в современном русском и яснее передаёт мужского адресата, чем буквальное «ты родишь».
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: но они не останутся с тобой
  rationale: 'Буквально: «но они не будут у/для тебя». В контексте последующего плена речь идёт об утрате детей; «не останутся с тобой» естественно выражает эту мысль, не утверждая, что родственная связь прекратится.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину того, почему дети не останутся с адресатом.
- source_word: יֵלְכוּ
  choice: уйдут
  rationale: Активная форма глагола הלך означает «идти, уходить». Перевод сохраняет активную конструкцию и не подменяет её явно пассивным «будут уведены», хотя принудительность подразумевается контекстом.
- source_word: בַּשֶּׁבִי
  choice: в плен
  rationale: Существительное שֶׁבִי обозначает плен, особенно военный плен или насильственное переселение. «Уйдут в плен» — прямое и естественное русское выражение.
theological_decisions:
- issue: Характер утраты детей
  choice: не останутся с тобой
  alternative: не будут твоими
  rationale: Еврейское לָךְ допускает оттенок принадлежности, обладания или нахождения у адресата. Контекст плена говорит прежде всего о разлучении; выбранная формулировка не превращает это в отрицание родства.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка «станешь отцом» избегает неестественного для мужского адресата «родишь», а «уйдут в плен» сохраняет активную форму еврейского глагола и не делает подразумеваемое насильственное уведение грамматически явным.
