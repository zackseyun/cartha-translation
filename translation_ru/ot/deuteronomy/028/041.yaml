  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: ru
  text: У тебя будут сыновья и дочери, но они не останутся у тебя[a], потому что уйдут в плен[b].
  philosophy: optimal-equivalence
  footnotes:
