  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: ru
  text: Яхве сделает так, что мор не отстанет от тебя, пока не истребит тебя с земли, в которую ты входишь, чтобы овладеть ею.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моровая язва», «повальная болезнь». Еврейское слово обозначает смертоносную эпидемическую болезнь, посланную как наказание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока он не истребит тебя» — если подразумеваемым субъектом считать Яхве; возможно также: «пока он не истребит тебя», где субъектом является мор.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: пошлёт… и она не отстанет
  rationale: Каузативная форма глагола דבק буквально означает «заставит прильнуть». По-русски выражение «пошлёт… и она не отстанет» естественно и ясно передаёт неотступность бедствия, сохраняя причинную роль Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: בְּךָ
  choice: от тебя
  rationale: В сочетании с отрицательной конструкцией «не отстанет» естественно передаёт тесное и продолжительное действие бедствия против адресата.
- source_word: הַדָּבֶר
  choice: моровую язву
  rationale: В контексте проклятий דֶּבֶר обозначает смертоносную повальную болезнь. Устойчивое русское библейское выражение «моровая язва» точно и понятно передаёт этот смысл.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: пока Он не истребит тебя
  rationale: כלה здесь означает довести до конца, полностью погубить. Заглавное «Он» указывает на Яхве как наиболее естественный подразумеваемый субъект, не исключая связи гибели с моровой язвой как орудием суда.
- source_word: מֵעַל הָאֲדָמָה
  choice: с земли
  rationale: Предлог מֵעַל сохраняется в естественном русском «с земли»; אֲדָמָה в контексте овладения территорией означает землю.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: в которую ты входишь
  rationale: Естественная русская передача идиоматического сочетания בוא с направительным שמה, сохраняющая значение предстоящего вступления в землю.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: ירש в контексте Второзакония означает вступить во владение землёй; «овладеть ею» передаёт целевую конструкцию и местоименный суффикс.
theological_decisions:
- issue: Передача דֶּבֶר в формуле заветного проклятия
  choice: моровая язва
  alternative: мор; повальная болезнь
  rationale: Выбранное выражение передаёт смертоносную эпидемию как бедствие суда, не уточняя конкретную болезнь.
- issue: Подразумеваемый субъект כַּלֹּתוֹ
  choice: Он, то есть Яхве
  alternative: она, то есть моровая язва
  rationale: Главный субъект предшествующей клаузы — Яхве, поэтому мужской субъект по смыслу наиболее естественен. Альтернативная синтаксическая связь с язвой сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Личное имя יְהוָה передано как «Яхве». Образ буквального «прилипания» выражен естественной русской конструкцией «не отстанет», а синтаксическая неоднозначность последующей клаузы отмечена сноской.
