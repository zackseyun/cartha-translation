revisions:
- from: Яхве пошлёт на тебя моровую язву, и она не отстанет от тебя, пока Он не истребит тебя с земли, в которую ты входишь, чтобы овладеть ею.[a][b]
  to: Яхве сделает так, что мор не отстанет от тебя, пока не истребит тебя с земли, в которую ты входишь, чтобы овладеть ею.[a][b]
  rationale: Исправление восстанавливает каузативный смысл יַדְבֵּק без добавления отдельного действия «послать» и не закрепляет в тексте спорный подразумеваемый субъект כַּלֹּתוֹ. Замена «моровой язвы» на «мор» делает строку современнее и компактнее, сохраняя библейский регистр и смысл эпидемического бедствия. Сноски сохранены у той же конечной точки и отражают лексическую и синтаксическую варианты.
