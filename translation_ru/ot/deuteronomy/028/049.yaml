source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: ru
  text: Яхве поднимет против тебя издалека, от края земли, народ, который налетит, как орёл[a], — народ, языка которого ты не поймёшь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прилетит, как орёл» или «устремится, как орёл». Еврейский глагол указывает на быстрое движение в полёте; слово, переведённое как «орёл», может также обозначать грифа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «языка которого ты не услышишь»; то есть не поймёшь его речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: поднимет против тебя
  rationale: Глагол נשׂא буквально означает «поднимать, нести», а в данном сочетании передаёт действие Яхве, направляющего или поднимающего чужой народ против Израиля. Формулировка сохраняет образ исходного текста и ясно выражает враждебную направленность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: גּוֹי
  choice: народ
  rationale: Здесь גוי обозначает чужой народ как политико-военную силу. Русское «народ» естественно в контексте и не сводит значение только к государственному устройству.
- source_word: מֵרָחוֹק
  choice: издалека
  rationale: Кратко и естественно передаёт пространственную удалённость.
- source_word: מִקְצֵה הָאָרֶץ
  choice: от края земли
  rationale: Сохраняет образ крайней удалённости. «Земли» здесь допускает широкий смысл мира или обитаемой земли, не ограничивая выражение территорией Израиля.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: который налетит, как орёл
  rationale: Глагол דאה описывает стремительное движение или полёт хищной птицы. «Налетит» естественно передаёт быстроту и угрозу вторжения, хотя направление вниз не выражено однозначно; возможные оттенки отмечены в сноске.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: языка которого ты не поймёшь
  rationale: Буквально сказано «не услышишь его языка», но שמע в таком контексте означает не понимать речь. Русская формулировка ясно передаёт смысл, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация сохраняет различие между личным именем и титулом.
- issue: Божественное действие в появлении вражеского народа
  choice: поднимет против тебя
  alternative: приведёт против тебя
  rationale: Выбранная формулировка сохраняет прямое действие Яхве и образ глагола «поднимать», не уточняя сверх текста способ, которым будет приведён народ.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено обращение во втором лице единственного числа и образ «края земли»; синтаксис упорядочен для ясного чтения вслух.
