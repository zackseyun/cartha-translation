  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: ru
  text: Нежная и изнеженная женщина среди вас, которая из-за своей неги и мягкости не решалась даже поставить подошву своей ноги на землю, недобро посмотрит[a] на мужа, близкого ей[b], на своего сына и на свою дочь —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её глаз станет злым по отношению к…». Этот еврейский оборот может выражать враждебность, завистливую скупость или своекорыстное нежелание делиться.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мужчину её лона» или «мужа у её груди» — интимное обозначение мужа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה וְהָעֲנֻגָּה
  choice: нежная и изнеженная
  rationale: Сохраняется парное описание женщины как мягкой, не привыкшей к тяготам и жившей в особой неге; современная русская формулировка не перегружена архаизмами.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: которая… не решалась даже ступить подошвой ноги на землю
  rationale: Форма נִסְּתָה допускает значение «не пробовала / не отваживалась». «Не решалась даже» естественно передаёт крайнюю степень изнеженности, а образ подошвы ноги сохранён.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: по своей избалованности и мягкости
  rationale: Предложная конструкция передаёт причину; два близких понятия сохранены, хотя по-русски они частично пересекаются.
- source_word: תֵּרַע עֵינָהּ
  choice: недобро посмотрит
  rationale: Еврейский оборот буквально говорит, что её глаз станет злым. Русское «недобро посмотрит» сохраняет образ взгляда и допускает враждебность и своекорыстное нежелание делиться; диапазон значения пояснён в сноске.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: на мужа, которого обнимала
  rationale: Буквально это «мужчина/муж её лона (груди)». Выбран естественный интимный образ, не сводящий выражение просто к «её мужу».
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: на своего сына и на свою дочь
  rationale: Сохранено отдельное упоминание сына и дочери, а не обобщающее «детей».
