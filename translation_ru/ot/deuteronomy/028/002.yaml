  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: ru
  text: И придут на тебя все эти благословения и настигнут тебя, если ты будешь слушаться голоса Яхве, твоего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если будешь слушать голос Яхве, твоего Бога». Еврейское выражение «слушать голос» часто подразумевает послушный отклик.'
    reason: 'Лексическая альтернатива: сохранение буквального значения идиомы наряду с её контекстуальным смыслом.'
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: И придут на тебя
  rationale: Форма глагола в контексте заветного условия передана будущим временем; עַל сохраняет образ благословений, приходящих на человека.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: все эти благословения
  rationale: Прямой и естественный перевод определённой именной группы в контексте благословений завета.
- source_word: וְהִשִּׂיגֻךָ
  choice: и настигнут тебя
  rationale: Глагол נשׂג в породе хифиль выражает достижение или настигание и сохраняет яркий образ благословений, которые догоняют адресата.
- source_word: כִּי
  choice: если
  rationale: В данном контексте частица вводит условие получения перечисленных благословений.
- source_word: תִשְׁמַע בְּקוֹל
  choice: будешь слушаться голоса
  rationale: Русское «слушаться» передаёт заложенный в еврейской идиоме смысл послушного отклика, а слово «голос» сохраняет образность исходного выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохранены обращение к одному адресату и выраженное суффиксом отношение завета.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Смысл выражения שׁמע בְּקוֹל
  choice: будешь слушаться голоса
  alternative: будешь слушать голос
  rationale: Выбранный вариант передаёт послушный отклик, подразумеваемый заветным контекстом, но примечание сохраняет буквальное значение и присущую выражению смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и образ благословений, которые приходят и настигают человека, сохранены.
