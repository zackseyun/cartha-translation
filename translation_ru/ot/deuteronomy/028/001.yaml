source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: ru
  text: 'И будет: если ты будешь неуклонно слушаться[a] голоса Яхве, твоего Бога, тщательно соблюдая и исполняя все Его заповеди, которые я повелеваю тебе сегодня, то Яхве, твой Бог, поставит тебя выше всех народов земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если, слушая, будешь слушать голос Яхве, твоего Бога». Это еврейское усилительное выражение означает внимательное слушание, ведущее к послушанию.'
    reason: Лексическая альтернатива и пояснение еврейской усилительной конструкции.
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет вводную формулу будущего условного следствия и торжественный заветный тон, не сводя её к одному союзу «если».
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: если ты станешь неуклонно слушаться голоса
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает действие, а глагол «слушать» в данном контексте подразумевает послушание. «Неуклонно слушаться» естественно передаёт и усиление, и заветный смысл; слово «голос» сохраняет образ оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет прямое притяжательное обозначение отношений завета.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: будешь стараться исполнять
  rationale: Передаёт сочетание внимательного соблюдения с практическим исполнением естественным современным русским выражением.
- source_word: כָּל מִצְוֺתָיו
  choice: все Его заповеди
  rationale: «Заповеди» сохраняет заветно-правовой регистр; прописная буква в местоимении соответствует принятому русскому благоговейному оформлению.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я даю тебе сегодня
  rationale: Естественно передаёт совершающееся в момент речи повеление Моисея; «даю» здесь означает установление заповедей, а не подарок.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: то ... поставит тебя выше
  rationale: В этой конструкции נתן означает поставить или утвердить в определённом положении, а עֶלְיוֹן выражает сравнительно возвышенный статус. «То» ясно обозначает следствие условия.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: выше всех народов земли
  rationale: Сравнение охватывает народы вообще; «земли» здесь естественнее передаёт широкий смысл הָאָרֶץ, чем локальное «страны».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом, не добавляя конфессионального истолкования.
- issue: Заветная формула שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: неуклонно слушаться голоса
  alternative: внимательно слушать голос
  rationale: В контексте завета слышание включает послушание, однако сохранение слова «голос» удерживает конкретный образ исходного текста и связь между слушанием и исполнением.
- issue: Характер обещанного возвышения Израиля
  choice: поставит тебя выше всех народов земли
  alternative: сделает тебя превыше всех народов земли
  rationale: Формулировка передаёт относительный статус Израиля среди народов, не превращая עֶלְיוֹן в божественный титул и не уточняя сверх сказанного, в чём именно будет состоять это возвышение.
translation_notes:
  register: Современный литературный русский язык с достоинством заветно-правовой речи. Синтаксис остаётся доступным для обычного читателя; повтор «Яхве, твой Бог» сохранён как значимый элемент оригинала. Местоимение «ты» передаёт единственное число обращения к Израилю как к единому народу.
