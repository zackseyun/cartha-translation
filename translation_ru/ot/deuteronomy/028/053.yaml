  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: ru
  text: И ты будешь есть плод своего чрева[a] — плоть своих сыновей и дочерей, которых дал тебе Яхве, твой Бог, — во время осады и крайней нужды[b], до которой доведёт тебя твой враг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё потомство». Буквально: «плод своего чрева».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тесноты», «мучительного страдания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: И ты будешь есть
  rationale: Перфект с союзом в контексте проклятия имеет предсказательное значение; форма будущего времени естественно передаёт грядущее последствие.
- source_word: פְרִי בִטְנְךָ
  choice: плод своего чрева
  rationale: Сохранён образный еврейский оборот, обозначающий потомство. «Чрево» уместно в торжественном и страшном контексте, хотя в современном русском имеет возвышенную окраску.
- source_word: בְּשַׂר
  choice: плоть
  rationale: Слово прямо обозначает человеческую плоть; этот вариант точно и с должной тяжестью передаёт ужас людоедства, не прибегая к более грубому «мясо».
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: своих сыновей и дочерей
  rationale: Сохранено явное упоминание детей обоих полов, а не обобщённое «детей».
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: которых дал тебе Яхве, твой Бог
  rationale: Сохранено напоминание о том, что сыновья и дочери даны Богом, что усиливает трагизм проклятия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: во время осады и бедствия
  rationale: Переданы как сами осадные условия, так и вызванное ими тяжёлое положение; «бедствие» оставляет открытыми оттенки нужды, тесноты и мучения.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: которыми будет теснить тебя твой враг
  rationale: Глагол передаёт давление и доведение до крайности. «Теснить» сохраняет конкретный оттенок вражеского нажима и подходит к осаде.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер исполнения проклятия
  choice: будешь есть
  alternative: ешь / съешь
  rationale: Будущее время передаёт предсказательную силу формы в перечне заветных проклятий, не превращая её ни в повеление, ни в описание уже совершившегося события.
translation_notes:
  register: Современный литературный русский с торжественной библейской окраской. Архаизирующее «чрево» сохранено ради исходного образа и пояснено сноской; остальной синтаксис и словарь рассчитаны на обычного современного читателя. Тире выделяют поясняющее приложение «плоть своих сыновей и дочерей» и помогают прочитать длинную фразу.
