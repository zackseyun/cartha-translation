base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: ru
  text: И придут на тебя все эти проклятия, и будут преследовать тебя, и настигнут тебя, пока ты не будешь истреблён, потому что ты не слушал голоса Яхве, твоего Бога, и не соблюдал Его заповедей и установлений, которые Он заповедал тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: придут на тебя
  rationale: Будущее время передаёт грядущие последствия нарушения завета; сочетание с «на тебя» сохраняет направленность еврейского выражения.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: все эти проклятия
  rationale: Прямой и естественный перевод существительного קְלָלוֹת в контексте благословений и проклятий Второзакония.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: будут преследовать тебя, и настигнут тебя
  rationale: Сохраняется образ неотступной погони и последовательность двух еврейских глаголов.
- source_word: עַד הִשָּׁמְדָךְ
  choice: пока ты не будешь истреблён
  rationale: Передаёт предельный результат действия и сохраняет пассивно-результативный смысл, не называя агента прямо.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: потому что ты не слушал голоса
  rationale: Сохраняет слуховой образ еврейской идиомы; последующее «не соблюдал» ясно раскрывает подразумеваемое неповиновение.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твоего Бога
  rationale: Передаёт тетраграмматон как личное имя «Яхве» и сохраняет формулу отношений завета.
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: и не соблюдал Его заповедей и установлений
  rationale: В русском синтаксисе отрицательный однородный глагол естественно поясняет практическое содержание «слушать голоса», не сводя исходную идиому только к слову «повиноваться».
- source_word: אֲשֶׁר צִוָּךְ
  choice: которые Он дал тебе
  rationale: По-русски заповеди и установления естественно «дают»; смысл их божественного предписания сохраняется без тяжеловесного «которые Он заповедал тебе».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Передача идиомы שׁמע בקול
  choice: не слушал голоса ... и не соблюдал
  alternative: не повиновался
  rationale: Основной текст сохраняет образ слушания голоса, а параллельный глагол раскрывает требуемое послушание, не устраняя риторическую фактуру оригинала.
- issue: Связь לִשְׁמֹר с предшествующим отрицанием
  choice: и не соблюдал
  alternative: чтобы соблюдать / соблюдая
  rationale: Такой русский оборот ясно передаёт, что непослушание выразилось в несоблюдении заповедей, при этом не добавляет отдельного богословского вывода.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным заветно-правовым регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы как устойчивая русская издательская конвенция.
