  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: ru
  text: Яхве уведёт тебя и царя, которого ты поставишь над собой, к народу, которого не знали ни ты, ни твои отцы; и там ты будешь служить другим богам[a] — дереву и камню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняться другим богам»; еврейский глагол буквально означает «служить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: уведёт
  rationale: Каузативная форма глагола הלך означает «заставит пойти / поведёт». В контексте проклятия «уведёт» естественно передаёт насильственное перемещение, не добавляя прямо отсутствующего в тексте слова «плен».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: царя, которого ты поставишь над собой
  rationale: Сохраняет значение поставления правителя и близко передаёт конструкцию с עַל.
- source_word: גּוֹי
  choice: народ
  rationale: В данном контексте גוי обозначает чужой народ; русское «народ» звучит естественнее, чем современное политическое «нация».
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: которого не знали ни ты, ни твои отцы
  rationale: Сохраняет усиленное упоминание адресата и его отцов, а также мужскую форму родственного термина.
- source_word: וְעָבַדְתָּ שָׁם
  choice: и там ты будешь служить
  rationale: Глагол עבד буквально означает «служить» и в сочетании с богами включает религиозное поклонение; буквальная лексема сохраняет смысловую напряжённость.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямо передаёт устойчивое выражение «другие боги», не уточняя его как «чужеземные».
- source_word: עֵץ וָאָבֶן
  choice: дереву и камню
  rationale: Сохраняет краткую еврейскую аппозицию и презрительное сведение идолов к материалу, из которого они сделаны.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя; транслитерация сохраняет его и не подменяет титулом.
- issue: Значение служения другим богам
  choice: служить
  alternative: поклоняться
  rationale: «Служить» точнее сохраняет широкий смысл עבד, тогда как «поклоняться» прямо выражает религиозный смысл, подразумеваемый контекстом.
- issue: Статус выражения «дерево и камень»
  choice: аппозиция «дереву и камню»
  alternative: «богам из дерева и камня»
  rationale: Исходный текст допускает понимание материалов как пояснения к «другим богам»; краткая аппозиция сохраняет его резкость и не разворачивает её в явное описание изготовления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис близок к еврейскому, но естественен по-русски; архаизмы избегаются. Единственная сноска отмечена в основном тексте.
