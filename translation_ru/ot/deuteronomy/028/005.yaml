lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословенны будут
  rationale: Страдательное причастие ברך употреблено как сказуемое в формуле благословения. В ряду заветных благословений конструкция с будущим временем передаёт уверенное провозглашение, а не пожелание.
- source_word: טַנְאֲךָ
  choice: твоя корзина
  rationale: טֶנֶא обозначает корзину, в частности для переноски плодов или урожая. Общее слово «корзина» естественно и не добавляет отсутствующей в еврейском тексте конкретизации.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: и твоя квашня
  rationale: מִשְׁאֶרֶת — сосуд, в котором замешивают тесто. Русское «квашня» точно и кратко обозначает такую утварь; менее привычное современному читателю слово пояснено в сноске.
