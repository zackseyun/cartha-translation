base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: ru
  text: 'Вот что по праву причитается священникам от народа — от тех, кто приносит жертву, будь то бык или животное из мелкого скота[a]: пусть приносящий отдаст священнику переднюю ногу[b], обе челюсти[c] и желудок[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать овцу или козу.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «руку»; применительно к животному — переднюю ногу или плечевую часть.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обе щеки». Еврейское слово имеет форму двойственного числа.'
    reason: lexical_alternative
  - marker: d
    text: 'Традиционно: «сычуг». Еврейское слово обозначает желудок животного, но точное анатомическое уточнение не вполне определённо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: что по праву причитается
  rationale: В данном правовом и культовом контексте слово обозначает установленную долю, законно принадлежащую священникам, а не «суд» в отвлечённом смысле.
- source_word: מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: от тех, кто приносит жертву
  rationale: Естественная русская передача определяет ту часть народа, от которой поступает священническая доля. Однокоренной повтор еврейского текста в русском звучал бы неестественно.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: будь то бык или овца
  rationale: Передаёт альтернативную конструкцию и сохраняет названия жертвенных животных в единственном числе.
- source_word: וְנָתַן
  choice: пусть приносящий отдаст
  rationale: Еврейская форма единственного числа употреблена дистрибутивно. Явное «приносящий» устраняет неясность русского местоимения и связывает предписание с каждым жертвователем.
- source_word: הַזְּרֹעַ
  choice: переднюю ногу
  rationale: Буквально слово значит «рука», но применительно к туше животного обозначает переднюю конечность или плечевую часть.
- source_word: הַלְּחָיַיִם
  choice: обе челюсти
  rationale: Сохраняет двойственное число еврейской формы и анатомический смысл; возможна передача «обе щеки».
- source_word: הַקֵּבָה
  choice: желудок
  rationale: Современное и понятное обозначение части внутренностей животного без излишне узкой анатомической конкретизации.
