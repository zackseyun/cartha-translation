  text: תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהוָ֥ה אֱלֹהֶֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: ru
  text: Будь безупречен в отношениях с Яхве, твоим Богом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будь целостным» или «совершенным» с Яхве, твоим Богом. Буквально: «с»; речь идёт о цельности и верности в отношениях с Богом.'
    reason: Слово תָּמִים может означать «целостный», «безупречный» или «совершенный»; עִם буквально означает «с».
lexical_decisions:
- source_word: תָּמִים
  choice: непорочен
  rationale: Слово обозначает цельность, безупречность и нравственную чистоту. В контексте запрета гаданий и оккультных практик «непорочен» передаёт призыв к верности Богу, не утверждая абсолютной безгрешности.
- source_word: תִּהְיֶה
  choice: будь
  rationale: Имперфект 2-го лица единственного числа здесь имеет побудительное значение. Русский императив естественно и точно передаёт предписание.
- source_word: עִם
  choice: перед
  rationale: Основное значение предлога — «с», однако сочетание «непорочен с Яхве» по-русски неестественно. «Перед» идиоматично выражает нравственное состояние человека в его отношениях с Богом, хотя буквальная форма отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твоим Богом
  rationale: Форма с суффиксом 2-го лица мужского рода единственного числа в данном заветном контексте однозначно указывает на единственного Бога Израиля.
theological_decisions:
- issue: Значение תָּמִים в призыве к верности завету
  choice: непорочность как цельность и верность Богу
  alternative: будь цельным / всецело преданным Яхве
  rationale: Непосредственный контекст противопоставляет верность Яхве обращению к гадателям и заклинателям. Перевод сохраняет этическую силу слова, а сноска — его оттенок цельности, не сводя смысл ни к безгрешному совершенству, ни только к внутренней искренности.
translation_notes:
  register: Современный литературный русский язык; краткая повелительная формулировка сохраняет торжественный заветный тон без архаизмов.
