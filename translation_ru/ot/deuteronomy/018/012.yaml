  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: ru
  text: Ведь всякий, кто делает такое, — мерзость перед Яхве, и из-за этих мерзостей Яхве, твой Бог, изгоняет их[a] от тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишает их владения»; еврейский глагол может подчёркивать как изгнание народов, так и то, что они утрачивают владение землёй.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего запрета; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: תוֹעֲבַת יְהוָה
  choice: мерзость для Яхве
  rationale: Сохраняет сильную нравственно-религиозную оценку תוֹעֵבָה и конструкцию, обозначающую то, что отвратительно в глазах Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: всякий, кто делает такое
  rationale: Передаёт универсальное значение כָּל с причастием и естественно отсылает к перечисленным ранее действиям.
- source_word: וּבִגְלַל
  choice: и за
  rationale: В данном контексте «за» кратко и естественно выражает причину наказания, не превращая её в цель.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: эти мерзости
  rationale: Сохраняет лексическую связь с единственным числом תוֹעֲבַת в первой части стиха и указывает на запрещённые практики предыдущих стихов.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет обращение к Израилю во втором лице единственного числа.
- source_word: מוֹרִישׁ אֹתָם
  choice: изгоняет их
  rationale: В контексте завоевания хифиль глагола ירש обозначает устранение народов из земли; «изгоняет» ясно передаёт основной смысл, а оттенок лишения владения отмечен в сноске.
- source_word: מִפָּנֶיךָ
  choice: перед тобой
  rationale: Сохраняет образное пространственное выражение «от лица твоего» и передаёт изгнание народов по мере продвижения Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Носитель оценки תוֹעֲבַת יְהוָה
  choice: всякий совершающий эти действия назван «мерзостью для Яхве»
  alternative: эти действия отвратительны Яхве
  rationale: Грамматическим подлежащим смыслового высказывания является כָּל עֹשֵׂה אֵלֶּה, то есть всякий совершающий перечисленное; перевод не переносит оценку исключительно на действия.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Конструкция «мерзость для Яхве» намеренно сохраняет силу и предмет оценки исходного текста; «перед тобой» удерживает пространственный образ еврейского выражения. Маркер сноски поставлен при глаголе, к которому относится лексическая альтернатива.
