  terminology: «Яхве» последовательно передаёт тетраграмматон. «Мерзость» сохраняет сильную оценочную лексику תּוֹעֵבָה и лексическую связь между единственным и множественным числом в стихе. Сноска об альтернативном значении хифиля ירש уместна и должна оставаться привязанной к глаголу.
