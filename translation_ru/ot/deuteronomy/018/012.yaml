  source_fidelity: 'Смысл в целом передан верно: כִּי вводит обоснование, כָּל עֹשֵׂה אֵלֶּה относится к каждому совершающему названные действия, а מוֹרִישׁ описывает изгнание/лишение владения народов. Однако «за эти мерзости» в русском может звучать как основание карательного воздаяния, тогда как וּבִגְלַל прямо обозначает причинное «из-за». «Перед тобой» после «изгоняет их» также двусмысленно: оно может значить «на твоих глазах», а מִפָּנֶיךָ означает удаление от лица/присутствия адресата.'
