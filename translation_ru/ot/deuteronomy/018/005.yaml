base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: ru
  text: Ибо Яхве, твой Бог, избрал его из всех твоих колен, чтобы он и его сыновья во все дни предстояли и служили во имя Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во все дни»; выражение указывает на постоянное, продолжающееся священническое служение.'
    reason: Пояснение временной идиомы כָּל הַיָּמִים и её возможного смыслового объёма.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим установлением и естественно звучит по-русски.
- source_word: בּוֹ בָּחַר
  choice: его избрал
  rationale: При глаголе בחר предлог ב отмечает избранное лицо; буквальное «в нём» по-русски было бы неверно понято.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Сохраняет личное заветное имя и обращение к отдельному израильтянину во втором лице единственного числа.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: из всех твоих колен
  rationale: Точно передаёт избрание из числа колен Израиля.
- source_word: לַעֲמֹד
  choice: предстояли
  rationale: В культовом контексте «предстоять» сохраняет образ стояния перед Богом и звучит естественнее буквального «стоять»; множественное число обусловлено следующим «он и его сыновья».
- source_word: לְשָׁרֵת
  choice: служили
  rationale: Передаёт священническое служение без ненужного добавления объекта, которого нет в еврейском тексте.
- source_word: בְּשֵׁם יְהוָה
  choice: во имя Яхве
  rationale: Сохраняет формулу служения, совершаемого именем и властью Яхве.
- source_word: הוּא וּבָנָיו
  choice: он и его сыновья
  rationale: Сохраняет явно мужское обозначение потомков в контексте наследственного священнического служения.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Близко передаёт буквальную временную формулу, не устраняя возможный оттенок постоянного, продолжающегося служения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Субъект священнического служения
  choice: он и его сыновья
  alternative: он и его дети; он со своими потомками
  rationale: Еврейское בָנָיו буквально означает «его сыновья» и в данном контексте указывает на мужскую линию священнического преемства.
- issue: Продолжительность служения
  choice: во все дни
  alternative: навсегда; во все времена; постоянно
  rationale: Формулировка сохраняет конкретное выражение исходного текста и его напряжение между буквальным «все дни» и смыслом непрерывного, долговременного установления.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Инверсия «его избрал Яхве» подчёркивает объект избрания, а «предстояли и служили» сохраняет культовый оттенок исходных глаголов.
