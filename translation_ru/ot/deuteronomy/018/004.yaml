  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: ru
  text: Отдавай ему начатки своего зерна, молодого вина и масла, а также первую шерсть с твоего стада.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первую часть от стрижки твоего стада».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: начатки / первую
  rationale: Слово обозначает начальную или первую долю. Для земледельческих продуктов естественно «начатки», тогда как перед шерстью по-русски яснее «первую».
- source_word: דָּגָן
  choice: зерно
  rationale: Широкое обозначение зерновых продуктов; «зерно» точно и понятно современному читателю.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Термин часто обозначает недавно произведённое вино; «молодое вино» сохраняет отличие от общего обозначения вина и звучит естественно.
- source_word: יִצְהָר
  choice: масло
  rationale: Речь обычно идёт об оливковом масле, однако само еврейское слово в данном контексте не требует уточнения «оливковое».
- source_word: גֵּז
  choice: шерсть со стрижки
  rationale: Слово может обозначать состриженную шерсть либо стрижку как процесс или её продукт. Формулировка передаёт конкретный дар и сохраняет связь со стрижкой.
- source_word: צֹאן
  choice: мелкий скот
  rationale: Собирательное слово охватывает овец и коз; «мелкий скот» точнее, чем одно лишь «овцы», хотя в связи с шерстью прежде всего подразумеваются овцы.
- source_word: תִּתֶּן לּוֹ
  choice: отдавай ему
  rationale: Имперфект имеет силу правового предписания. «Отдавай» естественно выражает постоянную обязанность в современном русском языке.
theological_decisions:
- issue: К кому относится местоимение לוֹ («ему»)
  choice: сохранено единственное число «ему» без уточнения адресата внутри стиха
  alternative: явно указать «священнику» или понимать местоимение собирательно как указание на священство
  rationale: В ближайшем контексте получателем является священник, однако в самом стихе стоит только местоимение единственного числа; перевод сохраняет грамматическую форму и не устраняет возможный представительский оттенок.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Повелительное «отдавай» передаёт нормативный и повторяющийся характер требования. Синтаксис упрощён для ясности, но порядок даров и смысловые различия исходного текста сохранены.
