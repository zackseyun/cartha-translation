base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: ru
  text: Пророка из твоей среды, из числа твоих братьев[a], подобного мне[b], воздвигнет для тебя Господь, твой Бог; его слушайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть из среды твоего народа, из числа израильтян. Еврейское слово «братья» здесь обозначает соплеменников в целом.
    reason: lexical_alternative
  - marker: b
    text: В Новом Завете этот стих применяется к Иисусу Христу (Деян. 3:22; 7:37); еврейский текст здесь буквально говорит о «пророке, подобном мне».
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: пророка
  rationale: Неопределённое существительное в единственном числе передано без добавления указательного или мессианского титула; винительный падеж обусловлен русским порядком слов.
- source_word: מִקִּרְבְּךָ
  choice: из твоей среды
  rationale: Близко передаёт буквальное значение и ясно указывает, что пророк появится внутри народа Израиля.
- source_word: מֵאַחֶיךָ
  choice: из числа твоих братьев
  rationale: Сохраняет мужской термин родства во множественном числе и передаёт его контекстуальный смысл — принадлежность к Израилю.
- source_word: כָּמֹנִי
  choice: подобного мне
  rationale: Прямо сохраняет сравнение будущего пророка с Моисеем, не уточняя сверх текста характер этого подобия.
- source_word: יָקִים לְךָ
  choice: воздвигнет для тебя
  rationale: Глагол в породе hифиль означает здесь, что Бог поставит или даст пророка; «воздвигнет» сохраняет образ исходного глагола, а «для тебя» — значение לְךָ.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Господь, твой Бог
  rationale: Тетраграмматон передан традиционным русским «Господь»; обособление приложения делает фразу естественной по-русски.
- source_word: אֵלָיו תִּשְׁמָעוּן
  choice: его слушайте
  rationale: Передаёт обращённое ко всему народу повеление внимать пророку. «Слушайте» сохраняет смысловую широту שׁמע и не сужает её до одного лишь «повинуйтесь».
theological_decisions:
- issue: Возможная мессианская конкретизация выражения «пророка, подобного мне»
  choice: 'В основном тексте сохранено неопределённое единственное число: «пророка… подобного мне».'
  alternative: Передать как титул «того Пророка» или прямо назвать Мессию.
  rationale: Еврейский текст сам по себе не содержит определённого артикля или явного мессианского титула. Новозаветное применение важно для канонического прочтения, но не должно незаметно добавляться в перевод данного стиха.
- issue: Значение «братьев» как обозначения членов народа
  choice: Сохранено «братьев», а широкий общеизраильский смысл пояснён в сноске.
  alternative: Передать в основном тексте как «соотечественников» или «израильтян».
  rationale: Так сохраняются и мужская форма еврейского термина родства, и его контекстуальное, коллективное употребление.
- issue: Смена числа адресата
  choice: Сохранён переход от единственного числа «твоей / твоих / для тебя» к множественному «слушайте».
  alternative: Унифицировать весь стих во множественном или единственном числе.
  rationale: Смена числа присутствует в масоретском тексте и отражает обращение к Израилю как к единому народу, а затем ко всем его членам.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сохраняет акцент исходного текста на «пророке», а формулировки избегают как архаизма «из среды братьев твоих», так и излишнего толкования.
