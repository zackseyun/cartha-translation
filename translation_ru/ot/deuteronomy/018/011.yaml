  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: ru
  text: или заклинателя[a], или того, кто обращается к медиуму[b] или к спириту[c], или того, кто обращается к мёртвым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «связывающего связывание»; имеется в виду произнесение магических заклинаний.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «того, кто вопрошает духа умершего». Еврейское слово может обозначать дух умершего или связанного с ним посредника.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ведуна» или «человека, связанного с духом». Значение еврейского слова, часто стоящего рядом со словом «медиум», точно не установлено; оно относится к практике получения тайного знания через духов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: заклинателя
  rationale: Еврейское выражение буквально связано с «связыванием» заклятия, но обозначает человека, произносящего магические заклинания. «Заклинатель» естественно и сжато передаёт название запрещённого занятия.
- source_word: שֹׁאֵל אוֹב
  choice: того, кто вопрошает дух умершего
  rationale: אוֹב может обозначать дух умершего либо посредника, связанного с таким духом. Выбранный вариант сохраняет предмет вопрошания и не устраняет лексическую неоднозначность; альтернативное понимание указано в сноске.
- source_word: יִדְּעֹנִי
  choice: знахаря
  rationale: Слово обозначает обладателя или практикующего тайное оккультное знание и часто стоит рядом с אוֹב. «Знахарь» понятно современному читателю, хотя не полностью передаёт узкую семантику; поэтому в сноске приведена альтернатива.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: того, кто обращается к мёртвым
  rationale: Глагол דרש здесь означает искать ответа, вопрошать или обращаться за сведениями. Такой перевод ясно передаёт некромантическую практику, не утверждая ничего о возможности получить ответ.
- source_word: וְ
  choice: или
  rationale: В продолжающемся перечне запрещённых лиц и практик союз естественно передаётся по-русски разделительным «или».
theological_decisions:
- issue: Передача терминов, относящихся к оккультным практикам, без привнесения позднейших представлений
  choice: Использовать понятные современные обозначения практик и сохранить различие между обращением к духу умершего и обращением к мёртвым.
  alternative: Передать אוֹב как «медиума», а יִדְּעֹנִי как «спирита» или «волшебника».
  rationale: Еврейский текст перечисляет запрещённые способы магического и некромантического обращения. Перевод не должен вносить образы современной индустрии развлечений, спиритизма Нового времени или утверждать действенность этих практик.
- issue: 'Неоднозначность אוֹב: дух умершего или посредник-медиум'
  choice: В основном тексте — «дух умершего», а значение «медиум» отметить в сноске.
  alternative: «того, кто обращается к медиуму» или «медиума».
  rationale: Синтаксически שֹׁאֵל позволяет понимать אוֹב как объект вопрошания, тогда как в других контекстах слово может обозначать и посредника. Сноска сохраняет эту реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; синтаксис продолжает перечень из предыдущего стиха. Сохранён торжественно-правовой тон без архаизмов вроде «обаятель» и без фантазийно окрашенного «волшебник».
