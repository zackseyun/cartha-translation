base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: ru
  text: Но пророк, который самонадеянно[a] скажет от моего имени то, чего я не повелел ему говорить, или станет говорить от имени других богов, — тот пророк должен умереть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дерзко». Еврейский глагол указывает на сознательную самонадеянность и самовольное превышение полномочий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть умрёт»; возможна также передача: «должен быть предан смерти». В еврейском тексте смертный приговор выражен кратко, без уточнения способа его исполнения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Передаёт резкое противопоставление истинному пророку, о котором говорится перед этим, и естественно звучит по-русски.
- source_word: הַנָּבִיא אֲשֶׁר יָזִיד
  choice: пророк, который самонадеянно
  rationale: Форма от זיד обозначает сознательную дерзость, самовольное превышение полномочий; наречие сохраняет нравственно-правовую окраску.
- source_word: לְדַבֵּר דָּבָר
  choice: скажет… то
  rationale: Еврейское сочетание буквально означает «говорить слово». Русская конструкция «скажет… то, чего» естественнее и сохраняет содержание без тяжеловесного повтора.
- source_word: בִּשְׁמִי
  choice: от моего имени
  rationale: Естественная русская передача притязания на божественное полномочие; первое лицо исходного текста сохранено.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: то, чего я не повелел ему говорить
  rationale: Сохраняет отрицание, прямое божественное повеление и указание на содержание речи.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: или станет говорить
  rationale: Союз по смыслу вводит второе из двух правонарушений; «или» ясно показывает их альтернативность.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: именем других богов
  rationale: Близко передаёт еврейскую формулу обращения к авторитету иных божеств и естественно звучит по-русски.
- source_word: וּמֵת הַנָּבִיא הַהוּא
  choice: тот пророк должен умереть
  rationale: Передаёт краткую формулу смертного приговора, не добавляя прямо не выраженного в глаголе указания на способ исполнения.
theological_decisions:
- issue: Упоминание Божьего имени в прямой речи
  choice: 'Сохранено первое лицо: «от моего имени».'
  alternative: «от имени Господа»
  rationale: В еврейском тексте говорит сам Бог; замена первого лица титулом внесла бы отсутствующее в стихе пояснение.
- issue: Характер смертной санкции
  choice: «должен умереть»
  alternative: «будет предан смерти» или «умрёт»
  rationale: Фраза имеет силу юридического приговора. Выбранный вариант выражает обязательную санкцию, но не уточняет, кем и каким образом она должна быть приведена в исполнение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-правовым звучанием. Божественные местоимения даны со строчной буквы в соответствии с обычной современной орфографией; это не меняет их референции. Повтор «пророк… тот пророк» сохранён ради эмфатической структуры оригинала.
