  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: ru
  text: Пусть среди вас не найдётся человека, который проводит своего сына или дочь через огонь[a], занимается гаданием, предсказывает будущее[b], толкует приметы[c] или колдует[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «проводит своего сына или свою дочь через огонь». Возможно также: «сжигает своего сына или дочь в огне» или «приносит своего сына или дочь в жертву в огне».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское слово имеет спорное значение; возможны переводы: «ворожит», «предсказывает по временам» или «наблюдает времена».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «занимается авгурией»; «гадаeт по знамениям».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «занимается чародейством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: пусть не будет среди вас
  rationale: Отрицание с нифалем imperfect выражает запрет для общины; «среди вас» естественно передаёт בְךָ в данном правовом контексте.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: кто проводит своего сына или дочь через огонь
  rationale: Сохранён буквальный образ каузативной формы עבר и подлинная неоднозначность обряда, без преждевременного уточнения, идёт ли речь о сожжении или жертвоприношении.
- source_word: קֹסֵם קְסָמִים
  choice: кто занимается гаданием
  rationale: Сочетание причастия с однокоренным дополнением обозначает занятие гадательной практикой; русское выражение естественно и сохраняет общий технический смысл.
- source_word: מְעוֹנֵן
  choice: ворожбой
  rationale: Точный вид практики спорен; «ворожба» — понятное современному читателю обозначение оккультного предсказания, не совпадающее полностью с соседним общим словом о гадании.
- source_word: מְנַחֵשׁ
  choice: толкованием примет
  rationale: Глагол связан с извлечением предзнаменований из знаков; выражение передаёт вероятный смысл и отличает эту практику от общего гадания.
- source_word: מְכַשֵּׁף
  choice: колдовством
  rationale: Причастие обозначает занятие магическими практиками; «колдовство» — естественный и достаточно широкий русский эквивалент без излишне узких позднейших ассоциаций.
theological_decisions:
- issue: Характер запрета проводить ребёнка через огонь
  choice: Сохранить еврейский оборот «проводит своего сына или дочь через огонь».
  alternative: «сжигает своего сына или дочь в огне»; «приносит своего сына или дочь в жертву в огне»
  rationale: Контекст осуждает языческий обряд с участием детей и огня, однако сам оборот в этом стихе не уточняет однозначно форму обряда. Буквенный образ сохраняет богословски значимую напряжённость и не утверждает больше, чем говорит текст.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Перечень оформлен параллельно через отглагольные существительные; архаичные слова сведены к минимуму. «Ворожба» оставлена как общеупотребительное религиозно-культурное обозначение, позволяющее отличить трудный еврейский термин от соседних видов гадательной практики.
