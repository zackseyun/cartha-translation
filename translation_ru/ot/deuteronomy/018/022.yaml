  naturalness: Текст современный и литературный. «Предсказанное им не происходит и не исполняется» естественно в данном юридико-пророческом контексте и яснее, чем «сказанное им не происходит».
  terminology: «Яхве» последовательно передаёт יהוה. «Самонадеянно» удачно передаёт בְּזָדוֹן как дерзкое, своевольное присвоение божественного поручения. «Не бойся его» точно и естественно передаёт запрет страшиться пророка.
