  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: ru
  text: Если пророк говорит от имени Яхве и предсказанное им[a] не происходит и не исполняется,[b] то это — то, чего Яхве не говорил. Пророк сказал это самонадеянно;[c] не бойся его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское דָּבָר может означать «слово», «сообщение», «дело» или «событие»; здесь оно связывает пророческое высказывание с предсказанным событием.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не будет и не придёт»; то есть не произойдёт и не исполнится.'
    reason: lexical_alternative
  - marker: c
    text: «Самонадеянно» означает здесь дерзко и своевольно, без поручения Яхве.
    reason: cultural_note
lexical_decisions:
- source_word: יְדַבֵּר הַנָּבִיא
  choice: пророк говорит
  rationale: Имперфект в формулировке правового случая передан настоящим временем; определённый артикль имеет обобщающее значение, которое по-русски естественно выражается без отдельного указательного слова.
- source_word: בְּשֵׁם יְהוָה
  choice: от имени Яхве
  rationale: Передаёт заявление о выступлении с божественной властью; тетраграмматон транслитерирован как личное имя «Яхве».
- source_word: הַדָּבָר
  choice: сказанное им / этого / это
  rationale: דָּבָר охватывает и произнесённое пророческое сообщение, и предсказанное дело или событие. Контекстуальные русские формы сохраняют эту смысловую связь без неестественной фразы «слово не происходит».
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: не происходит и не сбывается
  rationale: 'Сохранены оба еврейских глагола: первый указывает на то, что предсказанное не становится действительностью, второй — что оно не осуществляется.'
- source_word: בְּזָדוֹן
  choice: самонадеянно
  rationale: Слово обозначает дерзкую, своевольную самоуверенность пророка, говорящего без поручения Яхве.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: не бойся его
  rationale: Кратко и естественно передаёт запрет страшиться пророка или позволять ему запугать себя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет это, не заменяя имя титулом.
- issue: Критерий истинности пророческого слова
  choice: Стих сформулирован как проверка конкретного предсказания по его осуществлению
  alternative: Развёрнутое универсальное учение обо всех видах пророчества
  rationale: Перевод не расширяет правовое утверждение стиха и не привносит богословских оговорок, отсутствующих в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с ясной правовой условной конструкцией. Тон сдержанный и достойный; архаизмы и конфессионально маркированные обороты исключены.
