revisions:
- from: Если пророк говорит от имени Яхве и сказанное им[a] не происходит и не сбывается,[b] то этого Яхве не говорил. Пророк сказал это самонадеянно;[c] не бойся его.
  to: Если пророк говорит от имени Яхве и предсказанное им[a] не происходит и не исполняется,[b] то это — то, чего Яхве не говорил. Пророк сказал это самонадеянно;[c] не бойся его.
  rationale: Заменено «сказанное им» на «предсказанное им», поскольку именно неосуществление служит в стихе проверкой заявленного пророческого слова. Конструкция «это — то, чего Яхве не говорил» точнее воспроизводит הוּא הַדָּבָר אֲשֶׁר לֹא דִבְּרוֹ יְהוָה. Смысл, регистр и все сноски сохранены; сноска b приведена в соответствие с выбранным глаголом «исполняется».
  reviewer_model: gpt-5.6-terra
