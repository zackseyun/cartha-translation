  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: ru
  text: Пусть они едят равные доли, помимо дохода от продажи родового имущества.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст заключительной части труден. «Доход от продажи родового имущества» — вероятное контекстуальное понимание; возможно также: «помимо того, что причитается ему по отцовским домам». Оборот может в более общем смысле указывать на доход, связанный с родом или предками.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: равные доли
  rationale: Буквально «доля как доля»; идиома выражает равенство долей. Русское «равные доли» ясно передаёт распределительный смысл.
- source_word: יֹאכֵלוּ
  choice: пусть они едят
  rationale: Сохранён конкретный глагол «есть», относящийся к потреблению положенного священнослужителям содержания; форма в контексте имеет нормативно-разрешительный оттенок.
- source_word: לְבַד
  choice: помимо
  rationale: Слово обозначает нечто отдельное или дополнительное; «помимо» естественно вводит добавочный личный доход.
- source_word: מִמְכָּרָיו
  choice: то, что он получает от продажи
  rationale: Форма может указывать на продажи либо выручку от них. Формулировка передаёт вероятный смысл дохода, не сводя его только к самому акту продажи.
- source_word: עַל הָאָבוֹת
  choice: родового имущества
  rationale: Буквально выражение связано с «отцами/предками», но синтаксически оно сжато. В контексте наиболее вероятна связь с родовым владением или наследственными правами.
theological_decisions:
- issue: Толкование заключительной фразы מִמְכָּרָיו עַל הָאָבוֹת
  choice: Она обозначает отдельный доход от продажи родового имущества, не отменяющий равной доли левита.
  alternative: «помимо того, что причитается ему по отцовским домам» или более общее указание на доход, связанный с его родом
  rationale: Еврейская конструкция трудна и допускает несколько пониманий. Основной текст выражает наиболее связное контекстуальное прочтение, а примечание сохраняет реальную неопределённость.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Конкретный образ еды сохранён, а трудность заключительной фразы отмечена в сноске без чрезмерного уточнения.
