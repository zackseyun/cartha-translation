  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: ru
  text: И с человека, который не послушает Моих слов, которые пророк будет говорить от Моего имени, Я Сам взыщу с него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я призову его к ответу». Еврейское выражение буквально означает: «Я потребую от него»; оно говорит о Божьем взыскании за отказ слушать слова пророка, не уточняя его меру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Оборот вводит следствие предшествующего обещания о пророке и сохраняет направленность в будущее, не создавая чрезмерно архаичной формулы.
- source_word: הָאִישׁ
  choice: человек
  rationale: Сохраняется существительное в единственном числе с обобщающим значением; русское «человек» естественно передаёт форму и смысл оригинала.
- source_word: לֹא יִשְׁמַע אֶל
  choice: не станет слушать
  rationale: «Слушать» сохраняет как буквальное восприятие слов, так и подразумеваемую готовность им внимать, не сужая смысл до прямого «повиноваться».
- source_word: דְּבָרַי
  choice: Моих слов
  rationale: Передан множественный показатель и притяжательный суффикс; прописная буква указывает на речь Бога согласно русской библейской издательской традиции.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: которые пророк будет говорить
  rationale: Будущее время соответствует контексту обещанного пророка. Слово «пророк» эксплицирует ясный из предыдущего стиха референт местоимения и предотвращает ошибочное отнесение действия к непослушавшему человеку.
- source_word: בִּשְׁמִי
  choice: от Моего имени
  rationale: Естественный русский эквивалент устойчивого выражения, сохраняющий смысл речи по Божьему полномочию и от Его лица.
- source_word: אָנֹכִי
  choice: Я Сам
  rationale: Самостоятельное местоимение в еврейском тексте эмфатично; «Я Сам» передаёт это смысловое ударение.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: взыщу с него
  rationale: Русское «взыскать с кого-либо» кратко и торжественно передаёт требование ответа и Божий суд, не уточняя не названную в тексте форму наказания.
theological_decisions:
- issue: Характер Божьего ответа на отказ слушать слова пророка
  choice: Я Сам взыщу с него
  alternative: Я призову его к ответу
  rationale: 'Основной вариант сохраняет судебную силу и некоторую недосказанность еврейского выражения: Бог потребует ответа, но точная мера воздаяния здесь не определяется.'
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для прямой Божьей речи. Синтаксис упрощён ровно настолько, чтобы стих был понятен при чтении вслух; традиционно-библейское «взыщу» сохранено как точное и всё ещё понятное слово. Маркер [a] присутствует в основном тексте.
