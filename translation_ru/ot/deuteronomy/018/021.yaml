  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: ru
  text: 'И если ты скажешь в своём сердце: «Как нам узнать слово, которого не говорил Яхве?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: И если
  rationale: Сохраняет связь с предыдущим контекстом и условный характер вводимой мысли, не придавая союзу излишне противительного значения.
- source_word: תֹאמַר בִּלְבָבֶךָ
  choice: ты скажешь в своём сердце
  rationale: Передаёт обращение во втором лице единственного числа и сохраняет еврейский образ сердца как внутреннего средоточия мысли; выражение понятно в современном литературном русском.
- source_word: אֵיכָה נֵדַע
  choice: Как нам узнать
  rationale: Естественно передаёт вопрос о способе распознавания; «нам» соответствует форме первого лица множественного числа и звучит по-русски естественнее, чем буквальное «как мы узнаем» в данном контексте.
- source_word: הַדָּבָר
  choice: слово
  rationale: В контексте пророчества דָּבָר обозначает произнесённое пророческое слово или весть; «слово» точно сохраняет ключевую связь со следующим стихом.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: которого не говорил
  rationale: Отрицательная относительная конструкция определяет «слово». Русское прошедшее время естественно выражает вопрос о том, было ли данное слово прежде произнесено Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст называет Бога личным заветным именем; «Яхве» передаёт тетраграмматон без замены титулом.
- issue: Смысл הַדָּבָר в контексте проверки пророка
  choice: слово
  alternative: весть; дело
  rationale: Выбор «слово» сохраняет широкую семантику термина, но в ближайшем пророческом контексте естественно указывает на предполагаемое изречение от Яхве, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский с сохранением библейского образа «сказать в сердце». Формулировка торжественная, но доступная; подлинная вопросительная направленность и различие между единственным «ты» и множественным «нам» сохранены.
