    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: наследие
  rationale: В контексте распределения земли слово обозначает наследственный удел. Повтор одного русского слова в обеих частях сохраняет еврейский повтор и переход от земельного значения к богословской метафоре.
- source_word: בְּקֶרֶב
  choice: среди
  rationale: Естественно передаёт пространственно-социальное значение выражения בְּקֶרֶב אֶחָיו в современном русском языке.
- source_word: אֶחָיו
  choice: его братьев
  rationale: Сохраняет буквальное мужское множественное число еврейского слова; в контексте имеются в виду соплеменники-израильтяне, в частности остальные колена.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: הוּא
  choice: —
  rationale: Самостоятельное местоимение придаёт утверждению эмфазу. В русском предложении «Яхве — его наследие» эта выделенность естественно выражена именным сказуемым и тире без добавления тяжеловесного «Он Сам».
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: как Он говорил ему
  rationale: Сохраняет обычное значение глагола דִּבֶּר «говорить», не усиливая его до более толковательного «обещал».
theological_decisions:
- issue: К кому относятся местоимения единственного числа «у него», «его», «ему»
  choice: Сохранено единственное число, коллективно или представительно относящееся к левиту либо левитскому священнику.
  alternative: Понимать местоимения исключительно как указание на праотца Левия или распределительно на каждого отдельного священника.
  rationale: Ближайший контекст говорит о левитских священниках и колене Левия; еврейское единственное число допускает представительное или коллективное употребление. Перевод не сужает эту неоднозначность.
- issue: Смысл утверждения «Яхве — его наследие»
  choice: Сохранена краткая заветно-метафорическая формулировка без поясняющего развёртывания.
  alternative: Развернуть смысл как «Яхве является уделом левитов вместо земли».
  rationale: Исходный текст прямо называет Самого Яхве наследием левита. Буквенная связь двух употреблений נַחֲלָה сохраняет богословскую глубину и напряжение образа.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Повтор «наследие» намеренно сохранён; тире естественно передаёт эмфазу еврейского הוּא. Божественное местоимение написано с прописной буквы по принятой русской библейской традиции и для ясности референта.
