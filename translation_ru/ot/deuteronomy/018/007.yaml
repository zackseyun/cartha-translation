  naturalness: Текст в целом понятен, но «как все его братья-левиты» естественнее и ближе к синтаксису оригинала, чем «наравне со всеми своими братьями-левитами». «Перед Яхве» — современная литературная и ясная альтернатива несколько более архаичному «пред Яхве».
