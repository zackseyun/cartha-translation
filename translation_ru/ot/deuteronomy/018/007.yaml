  text: וְ/שֵׁרֵ֕ת בְּ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו כְּ/כָל אֶחָי/ו֙ הַ/לְוִיִּ֔ם הָ/עֹמְדִ֥ים שָׁ֖ם לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: ru
  text: то он может служить во имя Яхве, своего Бога,[a][b] как все его братья-левиты,[c] стоящие там перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и он будет служить». Еврейская форма в данном правовом контексте может выражать разрешение или более прямое установление.'
    reason: lexical_alternative
  - marker: b
    text: Евр. יהוה (YHWH); традиционная передача — «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Букв.: «как все его братья, левиты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: то он может служить
  rationale: Пиэль глагола שׁרת обозначает служение, здесь — священное служение левита. Союз продолжает условно-правовое построение предыдущего стиха, поэтому «то» естественно передаёт следствие, а «может» — разрешительный оттенок имперфекта, не исключая более прямого предписания, отмеченного в сноске.
- source_word: בְּשֵׁם
  choice: во имя
  rationale: Устойчивое сочетание указывает на действие, совершаемое именем и властью того, чьё имя названо; «во имя» сохраняет эту формулу естественным русским языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה, а не заменяющий его титул.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит Бога с подлежащим «он» и точно передаёт еврейский суффикс третьего лица.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: наравне со всеми своими братьями-левитами
  rationale: כ здесь выражает сопоставление; «наравне с» хорошо передаёт равное участие в служении. אֶחָיו буквально значит «его братья», а приложение הַלְוִיִּם уточняет, что речь идёт о других левитах.
- source_word: הָעֹמְדִים שָׁם
  choice: стоящими там
  rationale: Сохранено буквальное значение עמד «стоять» без замены на толкование «служить»; «там» отсылает к месту святилища из контекста.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Традиционная и ёмкая русская формула передаёт буквальное пространственное значение и одновременно пребывание в Божьем присутствии.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя יהוה. Форма «Яхве» непосредственно передаёт тетраграмматон, тогда как «Господь» является традиционной заменой имени титулом.
- issue: Модальность וְשֵׁרֵת в правовом контексте
  choice: может служить
  alternative: пусть служит; и будет служить
  rationale: 'В связи со стихом 6 форма допускает разрешительное понимание: пришедшему левиту позволено участвовать в служении. Однако еврейский имперфект может звучать и как прямое установление, поэтому альтернатива сохранена в сноске.'
- issue: Обозначение других левитов словом אֶחָיו
  choice: своими братьями-левитами
  alternative: другими левитами
  rationale: Буквальный термин родства сохранён вместе с поясняющим приложением «левитами», не превращая братство в абстрактное обозначение группы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «пред Яхве». Конструкция остаётся понятной обычному читателю; «братья-левиты» сохраняет родственный образ оригинала, а «наравне с» ясно выражает равноправное участие в служении.
