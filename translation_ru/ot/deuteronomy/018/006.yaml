  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: ru
  text: И если левит придёт из одного из твоих городов — из любой части Израиля[a], где он живёт, — и придёт со всем желанием своей души[b] на место, которое изберёт Яхве,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из одних из твоих ворот». Здесь «ворота» метонимически обозначают город или поселение.'
    reason: cultural_note
  - marker: b
    text: 'Или: «со всей тоской своей души»; идиоматически: «со всем желанием сердца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: И если
  rationale: Сохраняет соединительный союз и условное значение, связывая этот правовой случай с предыдущим предписанием.
- source_word: יָבֹא
  choice: придёт
  rationale: Имперфект в контексте казуистического закона естественно передаётся русским будущим временем в условной конструкции.
- source_word: הַלֵּוִי
  choice: левит
  rationale: Определённая форма употреблена как обобщённое обозначение представителя данной группы; в русском языке дополнительное указание определённости не требуется.
- source_word: מֵאַחַד שְׁעָרֶיךָ מִכָּל יִשְׂרָאֵל
  choice: из одного из твоих городов, где бы то ни было в Израиле
  rationale: «Ворота» здесь метонимически обозначают город или поселение. Оборот «где бы то ни было в Израиле» ясно передаёт распределительный смысл מִכָּל יִשְׂרָאֵל.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: в котором он проживает
  rationale: «Проживает» естественно описывает местожительство левита и несколько точнее простого «живёт» передаёт значение גור, не навязывая здесь более сильного смысла «пришелец».
- source_word: וּבָא
  choice: и … придёт
  rationale: 'Сохранено повторение глагола בוא: левит приходит из своего города и приходит к избранному месту.'
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: со всем желанием души своей
  rationale: Формулировка близко передаёт полноту личного желания и сохраняет прямое упоминание «души», не сводя выражение исключительно к сердцу или воле.
- source_word: אֶל הַמָּקוֹם
  choice: на место
  rationale: Текст говорит просто о «месте»; уточнение «святилище» не внесено, хотя оно подразумевается контекстом.
- source_word: אֲשֶׁר יִבְחַר
  choice: которое изберёт
  rationale: Будущее время соответствует форме имперфекта и повторяющейся во Второзаконии формуле об избрании места.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблён тетраграмматон как личное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Характер желания левита
  choice: со всем желанием души своей
  alternative: по желанию всего сердца
  rationale: Сохранены интенсивность выражения и слово נֶפֶשׁ («душа»), без богословского переосмысления его как исключительно внутренней сердечной установки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок частей предложения сохраняет повторение еврейского глагола «прийти», а лексика избегает как архаичного «обитать», так и конфессионально нагруженных уточнений.
