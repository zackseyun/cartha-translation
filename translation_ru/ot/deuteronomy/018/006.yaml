- from: И если левит придёт из одного из твоих городов, где бы то ни было в Израиле[a], в котором он проживает, и со всем желанием души своей[b] придёт на место, которое изберёт Яхве,
  to: И если левит придёт из одного из твоих городов — из любой части Израиля[a], где он живёт, — и придёт со всем желанием своей души[b] на место, которое изберёт Яхве,
  rationale: Исправлены сноска a и синтаксическая тяжеловесность, а также уточнена сноска b. Сохранены условная конструкция, повтор глагола «прийти», неопределённое «место», будущее «изберёт» и передача тетраграмматона как «Яхве».
