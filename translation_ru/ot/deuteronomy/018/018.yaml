source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: ru
  text: Я воздвигну им пророка, подобного тебе, из среды их братьев[a], вложу Мои слова в его уста, и он будет говорить им всё, что Я повелю ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их соплеменников», «их собратьев-израильтян»; буквально: «их братьев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: пророка
  rationale: Обычное русское соответствие еврейскому термину, обозначающему того, кто говорит от имени Бога; винительный падеж обусловлен глаголом «воздвигну».
- source_word: אָקִים
  choice: Я воздвигну
  rationale: Порода хифиль глагола קום означает «поставить, вызвать к служению, воздвигнуть». «Воздвигну» сохраняет идею Божьего призвания и назначения и соответствует достоинству библейского регистра.
- source_word: לָהֶם
  choice: им
  rationale: Дательный падеж естественно передаёт предоставление пророка народу; более развёрнутое «для них» возможно, но менее плавно в этой фразе.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: из среды их братьев
  rationale: Формально передаёт как מִקֶּרֶב «из среды», так и буквальное אֲחֵיהֶם «их братьев», не устраняя родственный и заветный оттенок выражения.
- source_word: כָּמוֹךָ
  choice: подобного тебе
  rationale: Прямо сохраняет сопоставление обещанного пророка с Моисеем; форма «тебе» отражает единственное число обращения.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: вложу Мои слова в его уста
  rationale: Сохраняет яркую метафору Божьего наделения пророка словами; «вложу … в уста» естественно для литературного русского языка.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: и он будет говорить им
  rationale: Будущее время соответствует последовательности обещанных действий, а «говорить им» естественно передаёт направленность אֶל.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: всё, что Я повелю ему
  rationale: «Всё, что» передаёт полноту כָּל אֲשֶׁר. Будущее «повелю» естественно согласуется с будущей миссией пророка и сохраняет модально-временную открытость еврейского имперфекта.
theological_decisions:
- issue: Возможная мессианская конкретизация обещанного пророка
  choice: Основной текст говорит только о пророке, подобном Моисею, не называя его прямо Мессией.
  alternative: Понимать выражение как линию пророков либо как единственного эсхатологического Пророка, исполнившегося в Мессии.
  rationale: Сам стих не устанавливает референт однозначно. Перевод сохраняет грамматическое единственное число и богословское напряжение, не внося в основной текст позднейшую каноническую идентификацию.
- issue: Значение אֲחֵיהֶם
  choice: их братьев
  alternative: их соплеменников; их собратьев-израильтян; их родичей
  rationale: Буквальное мужское родственное обозначение сохранено в тексте, а его более широкий заветно-народный смысл разъяснён в сноске без нейтрализации исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для обычного читателя; метафора «вложу Мои слова в его уста» и буквальное «из среды их братьев» сохранены. Местоимение «Мои» написано с прописной буквы согласно принятой русской библейской издательской традиции.
