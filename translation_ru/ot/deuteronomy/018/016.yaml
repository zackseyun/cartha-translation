base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: ru
  text: 'так, как ты просил у Господа, Бога твоего, на Хориве в день собрания, говоря: «Пусть я больше не слышу голоса Господа, Бога моего, и не вижу этого великого огня, чтобы мне не умереть».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: так, как
  rationale: Передаёт связь с предыдущим стихом и значение соответствия просьбе народа, не утяжеляя фразу буквальным «согласно всему, что».
- source_word: שָׁאַלְתָּ מֵעִם
  choice: ты просил у
  rationale: Естественное русское соответствие конструкции со значением просьбы, обращённой к кому-либо.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона в основном тексте.
- source_word: בְּיוֹם הַקָּהָל
  choice: в день собрания
  rationale: Сохраняет конкретное указание на день, когда народ был собран у Хорива.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: пусть я больше не слышу
  rationale: Передаёт модально-желательное значение речи народа и смысл прекращения повторного или дальнейшего слышания.
- source_word: וְלֹא אָמוּת
  choice: чтобы мне не умереть
  rationale: Естественно выражает подразумеваемый результат или цель просьбы; сохраняет связь страха смерти со слышанием голоса и видением огня.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции и не вносит конфессионально специфической интерпретации.
- issue: Логическая связь заключительных слов וְלֹא אָמוּת
  choice: целевая формулировка «чтобы мне не умереть»
  alternative: сочинительное «и я не умру»
  rationale: В контексте просьбы народа союз выражает желаемое предотвращение смерти. Русская целевая конструкция передаёт этот смысл, не утверждая отдельного обещания бессмертия или гарантии.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет зависимость стиха от предыдущего предложения; повтор «Господа, Бога моего/твоего» оставлен вслед за еврейским текстом.
