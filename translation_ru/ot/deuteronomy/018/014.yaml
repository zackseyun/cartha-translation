  - severity: medium
    issue: «не дал поступать так»
    rationale: Еврейский текст оставляет объект глагола נתן невыраженным. Добавление «поступать» сужает подразумеваемое «это» до разрешения на действие. «Не дал тебе этого» сохраняет исходную недосказанность; сноска поясняет контекст.
