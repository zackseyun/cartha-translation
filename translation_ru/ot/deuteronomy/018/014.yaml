  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: ru
  text: Ведь эти народы, которых ты вытесняешь[a], слушают толкователей знамений[b] и прорицателей; тебе же Яхве, твой Бог, не дал этого[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «которых ты изгоняешь» или «чьей землёй ты овладеваешь». Еврейский глагол может обозначать овладение землёй с вытеснением прежних жителей.'
    reason: lexical_alternative
  - marker: b
    text: Так названы люди, которые ищут руководства в приметах или знамениях и истолковывают их.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «а тебе — не так дал Яхве, твой Бог». Что именно Бог «не дал», в еврейском тексте не названо и подразумевается из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующими запретами и естественно звучит по-русски.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: эти народы
  rationale: В контексте речь идёт о народах земли, которой овладевает Израиль.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אוֹתָם
  choice: которых ты лишаешь владения
  rationale: Глагол ירשׁ здесь включает овладение землёй через лишение прежних жителей их владения; сноска сохраняет альтернативный ракурс «землёй которых ты овладеваешь».
- source_word: מְעֹנְנִים
  choice: толкователей знамений
  rationale: Обозначает людей, истолковывающих приметы или знамения; перевод понятен современному читателю и не привязывает термин к одной спорной технике.
- source_word: קֹסְמִים
  choice: прорицателей
  rationale: Передаёт практику гадательного предсказания и отличает её от более широкого истолкования знамений.
- source_word: יִשְׁמָעוּ
  choice: слушают
  rationale: Сохраняет прямое значение שׁמע и в данном контексте подразумевает доверительное следование советам этих людей.
- source_word: וְאַתָּה לֹא כֵן נָתַן לְךָ
  choice: но тебе ... не дал поступать так
  rationale: 'Еврейская фраза эллиптична: буквально «но тебе не так дал». Русский текст требует смыслового дополнения; формулировка сохраняет образ «дать», не превращая фразу просто в прямой запрет.'
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Передаёт личное имя יהוה транслитерацией и сохраняет форму обращения к Израилю в единственном числе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» прямо сохраняет его как имя, не заменяя титулом.
- issue: Не выраженный объект при נָתַן לְךָ
  choice: не дал поступать так
  alternative: не дал тебе этого; не позволил тебе делать это
  rationale: Объект и действие в еврейском тексте подразумеваются контекстом. Выбранная формулировка делает русский текст грамматически завершённым, сохраняя необычную конструкцию с «дал»; сноска отмечает буквальную эллиптичность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксический контраст между народами и Израилем сохранён; обращение во втором лице единственного числа отражено последовательно.
