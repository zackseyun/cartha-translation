  source_fidelity: 'Основной смысл передан верно: народы внимают практикам гадания, тогда как Израилю Яхве «не дал» того же. Однако «лишаешь владения» по-русски тяжеловесно и недостаточно естественно; «не дал поступать так» неоправданно превращает не названный в еврейском тексте объект в конкретное действие.'
  naturalness: «Ведь», «эти народы», «толкователи знамений» и «прорицатели» соответствуют современному литературному и сдержанно библейскому регистру. «Вытесняешь» естественнее в данном контексте, а «не дал тебе этого» грамматически гладко и сохраняет эллипсис оригинала.
  terminology: «Яхве, твой Бог» корректно передаёт יהוה אֱלֹהֶיךָ. «Толкователи знамений» и «прорицатели» достаточно различают מעוננים и קסמים, не навязывая спорной конкретной техники. Сноска к первому выражению уточняет охват ירשׁ.
