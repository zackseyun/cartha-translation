  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: ru
  text: Когда ты войдёшь в землю, которую Яхве, твой Бог, даёт тебе, не учись совершать мерзости, подобные мерзостям тех народов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не учись следовать мерзостным обычаям тех народов». Еврейский предлог может выражать как сравнение, так и соответствие образцу.'
    reason: Лексическая неоднозначность предлога כְּ.
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном контексте союз вводит временное обстоятельство, при котором начинает действовать последующий запрет.
- source_word: בָּא אֶל־הָאָרֶץ
  choice: войдёшь в землю
  rationale: Причастная конструкция имеет здесь предстоящее значение; русский глагол совершенного вида естественно передаёт вступление в землю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: 'Настоящее время сохраняет значение еврейского причастия: дарование земли представлено как уже осуществляемое и вместе с тем предстоящее.'
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: не учись совершать
  rationale: Сохраняется образ усвоения чужой практики; «совершать» звучит естественнее русского «делать» при существительном «мерзости».
- source_word: כְּתוֹעֲבֹת
  choice: совершать такие же мерзости, как
  rationale: Конструкция передаёт сравнительное значение предлога כְּ и сохраняет сильную нравственно-религиозную оценку слова תּוֹעֵבָה.
- source_word: הַגּוֹיִם הָהֵם
  choice: те народы
  rationale: Слово обозначает народы, населявшие землю, а указательное местоимение выражает дистанцированное «те».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Сила слова תּוֹעֵבָה
  choice: мерзости
  alternative: отвратительные обычаи
  rationale: «Мерзости» сохраняет резкую заветно-нравственную оценку и не ограничивает заранее перечень действий, раскрываемый в следующих стихах.
- issue: Значение предлога כְּ перед תוֹעֲבֹת
  choice: 'сравнение: «такие же… как»'
  alternative: 'соответствие образцу: «следовать мерзостным обычаям»'
  rationale: Предлог допускает как сравнение, так и соответствие образцу; основной текст избирает естественную русскую сравнительную конструкцию, а иной оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи, но без архаического «да не». Обращение сохраняется в единственном числе, как в еврейском тексте. Порядок «Яхве, твой Бог» удерживает смысловую структуру оригинала.
