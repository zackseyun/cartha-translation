  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: ru
  text: У священников-левитов — у всего колена Левия — не будет доли и наследственного удела вместе с Израилем. Они будут питаться жертвенными дарами Яхве[a] и его наследием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «огненными приношениями Яхве», то есть предназначенными Яхве жертвами, которые полностью или частично возносились на жертвеннике.'
    reason: Лексическая альтернатива поясняет связь אִשִּׁים с огнём и предотвращает ошибочное понимание, будто священнослужители ели сожжённые части жертв.
  - marker: b
    text: Еврейское «его наследием» допускает разные отнесения местоимения. Оно может означать наследие Яхве либо наследие Левия как собирательного лица; ср. стих 2, где наследием левитов назван Сам Яхве.
    reason: Сохраняет реальную неоднозначность местоименного суффикса и отмечает значимый ближайший контекст.
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: у священников-левитов
  rationale: Дефисное сочетание естественно передаёт приложение и обозначает священников из колена Левия, не превращая священников и левитов в две отдельные группы.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: у всего колена Левия
  rationale: Сохраняет всеохватность כָּל и пояснительную связь с предшествующим выражением.
- source_word: חֵלֶק וְנַחֲלָה
  choice: доли и наследственного удела
  rationale: 'Передаёт два близких юридических понятия: долю в распределении и наследственно закреплённое владение. Союз «и» сохраняет еврейскую форму, не устраняя её риторическую парность.'
- source_word: עִם יִשְׂרָאֵל
  choice: вместе с Израилем
  rationale: Выражает отсутствие общей с остальными израильтянами земельной доли.
- source_word: אִשֵּׁי יְהוָה
  choice: жертвенными дарами Яхве
  rationale: Контекстуально ясно обозначает жертвенные приношения, от которых священнослужители получали пищу; буквальная связь слова с огнём сохранена в сноске, чтобы не создать ложного впечатления, будто они ели сожжённые части жертв.
- source_word: וְנַחֲלָתוֹ
  choice: и его наследием
  rationale: Сохраняет союз וְ, местоименный суффикс мужского рода единственного числа и неоднозначность его референта, не превращая связь в явно пояснительное «то есть».
- source_word: יֹאכֵלוּן
  choice: они будут питаться
  rationale: В законодательном контексте имперфект описывает установленный порядок обеспечения; «питаться» естественно сочетается с жертвенными дарами и передаёт длительную норму.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя непосредственно, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» непосредственно передаёт личное имя и соответствует принятой для проекта передаче.
- issue: К кому относится суффикс в וְנַחֲלָתוֹ
  choice: сохранить форму «его наследием» и пояснить неоднозначность в сноске
  alternative: «Его наследием» как наследием Яхве; «их наследием» как наследием левитов; «то есть своим наследием»
  rationale: Еврейский суффикс имеет форму 3-го лица мужского рода единственного числа. Он может грамматически отсылать к Яхве либо к Левию/левиту как собирательному единственному; стих 2 поддерживает второе понимание, но сам стих 1 не устраняет напряжение полностью.
- issue: Связь между אִשֵּׁי יְהוָה и וְנַחֲלָתוֹ
  choice: сохранить соединительное «и»
  alternative: «то есть его наследием»
  rationale: В еврейском тексте стоит обычный союз וְ. Аппозиционное понимание возможно, однако явное «то есть» разрешило бы синтаксическую неоднозначность, которой исходный текст не разрешает.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Конструкция с тире передаёт пояснительное приложение без тяжеловесности. Местоимение «его» намеренно написано со строчной буквы, чтобы типографически не предрешать спорный референт; божественное имя передано как «Яхве».
