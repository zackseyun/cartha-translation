  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: указание времени («В этот день»), личное имя Яхве, обращение во 2-м лице ед. числа, два различаемых правовых термина, а также парное «соблюдай и исполняй» и полноту посвящения «всем сердцем и всей душой». «Повелевает тебе исполнять» естественно выражает מְצַוְּךָ לַעֲשׂוֹת. Побудительная форма во втором предложении допустимо передаёт предписывающую силу וְשָׁמַרְתָּ וְעָשִׂיתָ.'
