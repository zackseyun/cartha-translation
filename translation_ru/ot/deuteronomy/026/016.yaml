  text: הַ/יּ֣וֹם הַ/זֶּ֗ה יְהוָ֨ה אֱלֹהֶ֜י/ךָ מְצַוְּ/ךָ֧ לַ/עֲשׂ֛וֹת אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה וְ/אֶת הַ/מִּשְׁפָּטִ֑ים וְ/שָׁמַרְתָּ֤ וְ/עָשִׂ֨יתָ֙ אוֹתָ֔/ם בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: ru
  text: В этот день[a] Яхве, твой Бог, повелевает тебе исполнять эти постановления и законы[b]. Соблюдай и исполняй их всем сердцем и всей душой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сегодня».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «законы», может также означать «правовые решения» или «установленные нормы».
    reason: lexical_alternative
  - marker: c
    text: Еврейское не́феш может означать также «жизнь», «сам человек» или «всё существо».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: В этот день
  rationale: Передаёт указательное и торжественное звучание выражения буквально и естественно; возможное более разговорное соответствие «сегодня» отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет обращение во втором лице единственного числа и заветный характер отношений.
- source_word: מְצַוְּךָ
  choice: повелевает тебе
  rationale: Причастная форма имеет актуальное, непосредственное значение; настоящее время естественно передаёт его по-русски.
- source_word: לַעֲשׂוֹת
  choice: исполнять
  rationale: В отношении правовых предписаний русское «исполнять» звучит естественнее буквального «делать», не меняя смысла.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Подходящий юридико-заветный эквивалент, сохраняющий отличие от מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: В данном перечне обозначает обязательные правовые нормы; более буквальные варианты «суды» или «правовые решения» в современном русском способны создать неверное впечатление.
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ אֹתָם
  choice: Соблюдай и исполняй их
  rationale: Императив естественно передаёт предписывающую силу продолжения фразы, а два глагола сохраняют парное усиление еврейского текста.
- source_word: בְּכָל לְבָבְךָ
  choice: всем сердцем
  rationale: Устойчивое русское выражение передаёт целостную вовлечённость внутреннего человека — воли, мысли и чувства.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: и всей душой
  rationale: Сохраняет традиционный и контекстуально уместный эквивалент נֶפֶשׁ, не отрицая его более широких значений «жизнь» и «всё существо».
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Сила форм וְשָׁמַרְתָּ וְעָשִׂיתָ
  choice: Побудительное «Соблюдай и исполняй»
  alternative: Будущее/модальное «ты будешь / должен соблюдать и исполнять»
  rationale: После прямого повеления эти формы продолжают предписание. Русский императив ясно передаёт эту силу, не вводя вывода или обещания.
- issue: Единственное число обращения к Израилю
  choice: тебе / твой; повелительное единственное число
  alternative: вам / ваш
  rationale: Еврейский текст обращается к заветному народу как к одному адресату; русский язык позволяет явно сохранить это число.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным заветно-правовым звучанием. Обращение оставлено в единственном числе. Синтаксис разделён на два предложения ради ясности, при этом соединительная и предписывающая последовательность сохранена.
