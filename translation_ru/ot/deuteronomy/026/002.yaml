  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: ru
  text: Возьми часть первых плодов от всего урожая, который ты принесёшь со своей земли — земли, которую Яхве, твой Бог, даёт тебе,[a] — положи их в корзину и пойди на место, которое Яхве, твой Бог, изберёт, чтобы поселить там Своё имя.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «который ты принесёшь со своей земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы сделать так, чтобы Его имя обитало там». Это характерная для Второзакония формула об избранном Яхве месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: возьми
  rationale: Перфект с союзом в последовательности предписаний имеет повелительно-законодательную силу; русское повелительное наклонение естественно продолжает инструкцию.
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: часть первых плодов от всего урожая земли
  rationale: Предлог מִן указывает на взятие некоторой части, רֵאשִׁית — на первые плоды, а פְּרִי הָאֲדָמָה охватывает земледельческий урожай в целом, а не только плоды деревьев.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: который ты соберёшь на своей земле
  rationale: Каузатив בוא буквально связан с внесением или доставлением урожая; в русском контексте естественное «соберёшь» передаёт уборку и получение урожая, не делая фразу тяжеловесной.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: которую Яхве, твой Бог, даёт тебе
  rationale: Относительное предложение отнесено к земле; причастие נֹתֵן передано настоящим временем, подчёркивающим продолжающийся характер Божьего дара.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: положи их в корзину
  rationale: טֶנֶא — корзина для переноски сельскохозяйственных плодов; множественное «их» естественно согласуется с «плодами».
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: и пойди на место, которое … изберёт
  rationale: Сохранены последовательное предписание, характерное для Второзакония обозначение избранного места и будущая направленность формы יִבְחַר.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы поселить там своё имя
  rationale: Каузативный смысл שכן и образ пребывания имени сохранены без сведения выражения к простому обозначению места или владению им.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное covenantное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Формула святилища לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы поселить там своё имя
  alternative: чтобы поместить там своё имя
  rationale: Выбранная формулировка сохраняет характерный для Второзакония образ пребывания Божьего имени и не утверждает упрощённо, будто сам Бог пространственно заключён в святилище.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранены личное имя «Яхве» и богословски значимый образ обитания имени; сельскохозяйственная лексика сделана понятной широкому читателю.
