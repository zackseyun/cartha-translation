- from: возьми часть первых плодов от всего урожая земли, который ты соберёшь на своей земле[a], которую Яхве, твой Бог, даёт тебе, положи их в корзину и пойди на место, которое Яхве, твой Бог, изберёт, чтобы поселить там своё имя[b].
  to: Возьми часть первых плодов от всего урожая, который ты принесёшь со своей земли — земли, которую Яхве, твой Бог, даёт тебе,[a] — положи их в корзину и пойди на место, которое Яхве, твой Бог, изберёт, чтобы поселить там Своё имя.[b]
  rationale: Исправлена связь относительных предложений, чтобы «которую Яхве, твой Бог, даёт тебе» однозначно относилось к земле, как в еврейском тексте. «Соберёшь» заменено на «принесёшь», поскольку исходный глагол сохраняет значение принесения. Сноска о формуле Божьего имени сделана нейтральной и привязана к концу соответствующей формулы.
