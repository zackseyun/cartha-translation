review_pass:
  verdict: revise
  source_fidelity: 'Нужно устранить синтаксическую неоднозначность: в черновике «которую Яхве… даёт тебе» формально может относиться к «земле», но оказывается отделено относительным предложением о «урожае», а «который» при «урожае земли» создаёт тяжёлую конструкцию. Исправленный текст явно связывает Божий дар с землёй. «Принесёшь со своей земли» ближе к הֵבִיא, чем «соберёшь», не сводя действие к уборке урожая. Формула לְשַׁכֵּן שְׁמוֹ שָׁם сохранена с каузативным оттенком.'
  naturalness: «Возьми часть первых плодов от всего урожая» — естественная современная литературная формулировка. Вставное уточнение «земли, которую…» снимает двусмысленность, не утяжеляя законодательную речь. «Поселить там Своё имя» несколько образно, но намеренно сохраняет библейскую формулу; пояснение в сноске делает её понятной.
  terminology: «Яхве» последовательно передаёт יהוה. «Первые плоды» точно и понятно передаёт רֵאשִׁית в контексте приношения. «Место, которое … изберёт» сохраняет характерную для Второзакония формулу избранного святилища. Сноска b исправлена так, чтобы не добавлять спорного утверждения о «почитаемом присутствии», сохраняя лишь лингвистическое и контекстуальное пояснение.
  issues:
  - severity: medium
    issue: Неясная связь относительных предложений о земле и урожае.
    rationale: В исходном русском тексте «который ты соберёшь на своей земле, которую Яхве… даёт тебе» синтаксически перегружено; кроме того, «который» неудачно соотносится с сочетанием «урожай земли». В еврейском второе אֲשֶׁר относится к «земле», которую Бог даёт адресату.
  - severity: low
    issue: «Соберёшь» сужает значение תָּבִיא.
    rationale: Глагол הֵבִיא буквально обозначает принесение/доставление. «Принесёшь со своей земли» сохраняет это значение, тогда как «соберёшь» интерпретирует его как сбор урожая.
  - severity: low
    issue: Пояснение сноски b содержит избыточную богословскую конкретизацию.
    rationale: Слова «для Своего почитаемого присутствия» выходят за пределы буквального значения формулы. Нейтральное описание её как формулы об избранном месте сохраняет смысл без интерпретационного расширения.
