base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: ru
  text: 'И ты ответишь и скажешь пред Яхве, Богом твоим: «Отец мой был странствующим арамеем[a]. Он сошёл в Египет и поселился там как чужеземец, будучи немногочисленным; и там стал великим, сильным и многочисленным народом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отец мой был погибающим арамеем». Еврейское причастие может означать «погибающий, пропадающий», а также «блуждающий, странствующий».'
    reason: Сохранение подлинной лексической неоднозначности אֹבֵד.
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: И ты ответишь и скажешь
  rationale: Сохранена парная древнееврейская формула, вводящая торжественное исповедание. Будущее время в данном предписании передаёт обязательное действие, не сглаживая формулу до одного глагола.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: пред Яхве, Богом твоим
  rationale: «Пред» естественно для возвышенного современного русского регистра и передаёт идею пребывания перед лицом Бога; личное имя יהוה передано как «Яхве».
- source_word: אֲרַמִּי אֹבֵד
  choice: погибающим арамеем
  rationale: Причастие אֹבֵד прежде всего выражает состояние гибели или исчезновения. Формулировка сохраняет образ уязвимого предка; возможное значение «странствующий» вынесено в примечание.
- source_word: אָבִי
  choice: Отец мой
  rationale: Сохранено буквальное и риторически выразительное единственное число, в котором праотец представляет последующий народ.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Он сошёл в Египет
  rationale: «Сошёл» сохраняет традиционную пространственную направленность древнееврейского глагола при движении в Египет.
- source_word: וַיָּגָר שָׁם
  choice: жил там как пришелец
  rationale: Так передаётся не просто проживание, а положение чужеземца без коренного статуса; выражение понятнее современному читателю, чем «пришельствовал».
- source_word: בִּמְתֵי מְעָט
  choice: с немногими людьми
  rationale: Идиома указывает на малое число сопровождавших предка людей. Перевод сохраняет конкретность выражения и естественен по-русски.
- source_word: וַיְהִי שָׁם לְגוֹי גָּדוֹל עָצוּם וָרָב
  choice: а там стал великим, сильным и многочисленным народом
  rationale: Сохранён грамматически единый представитель — праотец, ставший через потомков народом; трёхчленная характеристика передаёт величину, силу и многочисленность.
theological_decisions:
- issue: Толкование אֲרַמִּי אֹבֵד אָבִי
  choice: Отец мой был погибающим арамеем
  alternative: Отец мой был странствующим арамеем; Арамей хотел погубить моего отца
  rationale: Масоретская огласовка наиболее прямо связывает причастие אֹבֵד с «моим отцом» как подлежащим. Значение «погибающий» лексически непосредственно и подчёркивает бедственное начало Израиля. Значение «странствующий» остаётся возможным и отмечено в сноске; толкование с арамеем как деятелем, желавшим погубить отца, требует более свободной синтаксической перестройки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным литургическим звучанием. Архаические формы вроде «пришельствовал» устранены, но формула «ответишь и скажешь» и предлог «пред» сохранены ради церемониального характера речи.
