base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: ru
  text: И Яхве вывел нас из Египта сильной рукой и простёртой рукой, великим ужасом[a], знамениями и чудесами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великим трепетом»; возможно также: «великими деяниями, внушающими трепет». Еврейское слово может обозначать страх, ужас либо внушающее страх проявление.'
    reason: Лексическая неоднозначность слова מוֹרָא.
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: вывел нас
  rationale: Порода хифиль глагола יצא означает «заставить выйти, вывести». Русское «вывел нас» естественно и точно передаёт исход из Египта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог מן вместе с глаголом «вывел» естественно передаётся по-русски сочетанием «из Египта».
- source_word: בְּיָד חֲזָקָה
  choice: сильной рукой
  rationale: Формально близко передаёт образ могущественного действия; прилагательное חֲזָקָה имеет основное значение «сильная, крепкая».
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: и простёртой мышцей
  rationale: Слово זְרוֹעַ обозначает руку от плеча, мышцу. «Простёртая мышца» сохраняет отличие от יָד и традиционный библейский образ, оставаясь понятным в возвышенном литературном регистре.
- source_word: וּבְמֹרָא גָּדֹל
  choice: великим ужасом
  rationale: מוֹרָא может обозначать ужас, страх или внушающее трепет явление. Основной текст сохраняет прямое и сильное значение, а неоднозначность отмечена в сноске.
- source_word: וּבְאֹתוֹת
  choice: знамениями
  rationale: אוֹתוֹת буквально означает «знаки, знамения»; «знамения» естественно для контекста чудесных Божьих действий.
- source_word: וּבְמֹפְתִים
  choice: и чудесами
  rationale: מוֹפְתִים в устойчивой паре с «знамениями» обозначает чудеса, поразительные сверхъестественные явления.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл מוֹרָא в формуле исхода
  choice: великим ужасом
  alternative: великим трепетом; великими деяниями, внушающими трепет
  rationale: Еврейское слово допускает как переживание страха, так и внушающее страх проявление. Прямое «великим ужасом» сохраняет силу выражения, а иные оттенки вынесены в сноску без устранения смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Слово «мышца» употреблено в значении руки от плеча, чтобы сохранить различие между יָד («рука, кисть») и זְרוֹעַ («рука, мышца») и не добавлять отсутствующую в оригинале идею правой руки.
