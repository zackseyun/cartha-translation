  terminology: «Господь», «заповеди» и «драгоценный народ» соответствуют традиционному библейскому и современному литературному регистру. В сноске альтернативу следует формулировать как переводческий вариант, не как якобы буквальное воспроизведение синтаксиса оригинала.
