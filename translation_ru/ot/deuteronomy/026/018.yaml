  source_fidelity: 'Основной смысл передан верно: редкий глагол הֶאֱמִיר передан как торжественное объявление, сохранены коллективное «ты», «сегодня», статус Израиля как עַם סְגֻלָּה и обязанность соблюдать заповеди. Однако «как Он говорил тебе» неудачно передаёт совершенную форму דִּבֶּר и в русском звучит как неоднократное действие; нейтральное «как Он сказал тебе» точнее и естественнее. Примечание a также неточно называет свою формулировку буквальной: в еврейском выражении нет конструкции с тире, а принадлежность выражается предшествующим לוֹ.'
