base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: ru
  text: И Господь сегодня объявил, что ты будешь Его драгоценным народом[a], как Он сказал тебе[b], и будешь соблюдать все Его заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его народом, Его драгоценным достоянием»; также возможно: «народом, составляющим Его драгоценное достояние».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как Он обещал тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: И Господь
  rationale: Тетраграмматон передан традиционным русским библейским соответствием «Господь»; союз ו сохранён как «И».
- source_word: הֶאֱמִירְךָ
  choice: объявил, что ты будешь
  rationale: Редкая форма Hiphil от אמר в контексте завета обозначает торжественное, действенное провозглашение. «Объявил» передаёт эту силу, не добавляя прямо отсутствующего в глаголе значения «избрал».
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественное современное соответствие, сохраняющее непосредственность заключения завета.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: что ты будешь Его драгоценным народом
  rationale: Формулировка сохраняет явное עַם «народ» и передаёт סְגֻלָּה как особо ценную собственность Бога; местоимение единственного числа отражено обращением «ты» к Израилю как целому.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: как Он говорил тебе
  rationale: Дословное значение דִּבֶּר сохранено, чтобы не превращать контекстуально возможное обещание в однозначное лексическое значение.
- source_word: וְלִשְׁמֹר
  choice: и будешь соблюдать
  rationale: В сочетании с заповедями שׁמר означает исполнять или соблюдать. Повтор личной глагольной формы естественно передаёт зависимый инфинитив и сохраняет связь с объявленным статусом.
- source_word: כָּל מִצְוֺתָיו
  choice: все Его заповеди
  rationale: Прямое и устойчивое соответствие, сохраняющее нормативный язык завета.
theological_decisions:
- issue: Смысл הֶאֱמִיר в формуле завета
  choice: торжественное Божье объявление о статусе Израиля
  alternative: «избрал», «отделил» или архаическое «признал Своим»
  rationale: Выбранная формулировка передаёт перформативную силу редкого глагола, но не вносит более узкое учение об избрании, которого сам глагол здесь не выражает однозначно.
- issue: Связь статуса народа с соблюдением заповедей
  choice: 'сохранить сочинительную связь: «и будешь соблюдать»'
  alternative: представить соблюдение заповедей как явное условие получения статуса
  rationale: Еврейский текст соединяет два инфинитивных оборота, но не обозначает их отношение как условие прямо; перевод не разрешает эту синтаксическую и богословскую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Единственное число «ты» сохранено как коллективное обращение к Израилю. Заглавные местоимения при упоминании Бога использованы в соответствии с распространённой русской библейской практикой.
