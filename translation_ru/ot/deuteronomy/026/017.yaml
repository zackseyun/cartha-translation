base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: ru
  text: Сегодня ты торжественно признал Яхве своим Богом и обязался ходить Его путями, соблюдать Его постановления, заповеди и правовые установления и слушаться Его голоса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внимать Его голосу». Буквально: «слушать Его голос»; в данном контексте выражение подразумевает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הֶאֱמַרְתָּ
  choice: торжественно признали
  rationale: Редкая форма глагола в этом заветном контексте обозначает официальное провозглашение или признание; добавление «торжественно» передаёт формальный характер действия.
- source_word: הַיּוֹם
  choice: Сегодня
  rationale: Естественно и прямо передаёт временное указание «сегодня, в этот день».
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: своим Богом
  rationale: 'Кратко и естественно выражает заветные отношения: Яхве должен быть Богом Израиля.'
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: ходить Его путями
  rationale: Сохраняет библейский образ поведения как хождения Божьими путями.
- source_word: חֻקָּיו
  choice: Его постановления
  rationale: Передаёт установленные нормы в юридическом и заветном контексте.
- source_word: מִצְוֺתָיו
  choice: заповеди
  rationale: Устоявшийся и понятный русский эквивалент для Божьих повелений.
- source_word: מִשְׁפָּטָיו
  choice: установления
  rationale: Сохраняет отдельный юридический термин, не смешивая его с постановлениями и заповедями; здесь слово обозначает обязательные правовые нормы.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: слушаться Его голоса
  rationale: Передаёт и буквальный образ слушания голоса, и присущий контексту смысл повиновения.
theological_decisions:
- issue: Заветное провозглашение и обязательства Израиля
  choice: Высказывание представлено как торжественное признание Яхве своим Богом и принятие обязательства жить в соответствии с Его волей.
  alternative: 'Сохранить более буквальную цепочку инфинитивов: «быть тебе Богом, и ходить… и соблюдать…».'
  rationale: Редкий глагол הֶאֱמַרְתָּ имеет формальный заветный оттенок, а последующие инфинитивы раскрывают содержание признания; русская формулировка делает эту связь ясной, не добавляя конфессионального толкования.
- issue: Значение שׁמע בקול
  choice: «слушаться Его голоса»
  alternative: «слушать Его голос»
  rationale: Выражение сохраняет образ голоса и одновременно естественно передаёт заложенный в заветном контексте смысл послушания.
translation_notes:
  register: Современный литературный русский язык с достоинством заветно-правового контекста. Обращение во множественном числе передаёт коллективного адресата — Израиль, хотя еврейские формы стоят во втором лице единственного числа. Заглавные местоимения при упоминании Бога используются последовательно в рамках русского библейского регистра.
