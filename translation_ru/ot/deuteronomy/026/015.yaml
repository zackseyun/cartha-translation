base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: ru
  text: Взгляни из Твоего святого жилища, с небес, и благослови Твой народ Израиль и землю, которую Ты дал нам, как Ты поклялся нашим отцам[a], — землю, где текут молоко и мёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашим предкам». В еврейском тексте — «нашим отцам»; имеются в виду патриархи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: Взгляни
  rationale: Императив выражает просьбу к Богу обратить взор с высоты; последующее «с небес» ясно передаёт направление взгляда без избыточного «взгляни вниз».
- source_word: מִמְּעוֹן קָדְשְׁךָ מִן הַשָּׁמַיִם
  choice: с небес, из Твоего святого жилища
  rationale: Обе исходные конструкции сохранены; в русском естественнее сначала назвать небеса, а затем пояснить их как Божье святое жилище.
- source_word: וּבָרֵךְ
  choice: и благослови
  rationale: Прямой и общепонятный эквивалент императива от ברך.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: Твой народ Израиль
  rationale: Сохраняется приложение, отождествляющее Божий народ с Израилем.
- source_word: הָאֲדָמָה
  choice: землю
  rationale: В контексте дара Израилю слово обозначает данную Богом землю; русский вариант естественен и позволяет последующему אֶרֶץ пояснить её как землю из обетования.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: которую Ты дал нам
  rationale: Совершённое действие передано естественным русским прошедшим временем, при этом сохраняется продолжающаяся значимость дара.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: как Ты клялся нашим отцам
  rationale: Сохраняется буквальное мужское обозначение и формула обетования патриархам.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: землю, где текут молоко и мёд
  rationale: Естественная современная русская передача устойчивого древнееврейского образа изобилия и плодородия.
theological_decisions:
- issue: Значение לַאֲבֹתֵינוּ в формуле заветного обетования
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Древнееврейский текст буквально говорит об «отцах» и в данном контексте отсылает к патриархам; более широкое «предкам» указано в примечании, не заменяя конкретность основной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы. Порядок двух обстоятельств места слегка перестроен ради естественности русского синтаксиса без изменения смысла.
