base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: ru
  text: Затем священник возьмёт корзину из твоей руки и поставит её перед жертвенником Яхве, твоего Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно переводится как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Затем ... возьмёт
  rationale: Перфект с союзом в последовательности обрядовых предписаний обозначает следующий шаг; «затем» естественно передаёт последовательность действий.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Определённое существительное в единственном числе обозначает священника, совершающего обряд.
- source_word: הַטֶּנֶא
  choice: корзину
  rationale: טֶנֶא обозначает корзину, здесь — сосуд с первыми плодами.
- source_word: מִיָּדֶךָ
  choice: из твоей руки
  rationale: Сохраняет конкретный образ передачи корзины из руки приносящего.
- source_word: וְהִנִּיחוֹ
  choice: и поставит её
  rationale: Hiphil глагола נוח означает поместить или поставить; местоимение женского рода ясно отсылает к корзине.
- source_word: לִפְנֵי
  choice: перед
  rationale: Обычное пространственное и культовое значение предлога.
- source_word: מִזְבַּח
  choice: жертвенником
  rationale: Стандартное обозначение алтаря для жертвоприношений; «жертвенник» соответствует принятому библейскому регистру русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное в еврейском тексте тетраграмматоном YHWH, не заменяя его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохранено обращение во втором лице единственного числа и личный характер заветной формулы.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя YHWH. Транслитерация «Яхве» сохраняет имя, а сноска сообщает читателю традиционный вариант передачи.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским словом «жертвенник». Единственное число второго лица сохранено. Формулировка звучит как последовательное обрядовое предписание.
