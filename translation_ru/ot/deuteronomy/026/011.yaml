  source_fidelity: 'Смысл в целом передан верно: повеление относится к адресату в единственном числе; «всему добру» передаёт בְּכָל־הַטּוֹב, «Яхве, твой Бог» — личное имя и заветное определение, а «левит» и гֵּר сохранены как участники общей радости. Однако в исходной русской фразе перечисление после тире синтаксически присоединяется неясно и может быть прочитано как приложение к «тебе и твоему дому», а не как указание на тех, с кем следует радоваться.'
