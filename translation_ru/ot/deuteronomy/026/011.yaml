  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: ru
  text: И ты радуйся всему добру, которое Яхве, твой Бог, дал тебе и твоему дому, вместе с левитом и переселенцем[a], живущим среди тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземец, живущий среди вас». Еврейское גֵּר обозначает человека неместного происхождения, постоянно живущего среди израильтян под защитой их общины.'
    reason: Лексическая альтернатива и пояснение общественно-правового значения термина.
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: И радуйся
  rationale: Форма глагола в контексте наставления передаёт предписание. «Радуйся» сохраняет как эмоциональный, так и празднично-богослужебный оттенок.
- source_word: בְכָל הַטּוֹב
  choice: всему добру
  rationale: Естественное русское выражение для всей совокупности полученных благ; оно остаётся близким к образности еврейского текста и не сводит смысл только к материальным вещам.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: которое ... дал тебе
  rationale: Передаёт завершённое действие נתן и сохраняет адресата с местоимением второго лица.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет обычную заветную формулу и местоименный суффикс второго лица.
- source_word: וּלְבֵיתֶךָ
  choice: и твоему дому
  rationale: «Дом» здесь обозначает не только строение, но семейно-хозяйственное сообщество; русский оборот сохраняет эту ёмкость и библейскую образность.
- source_word: אַתָּה
  choice: ты
  rationale: Отдельно выраженное местоимение сохранено ради акцента и включено в перечисление участников радости.
- source_word: הַלֵּוִי
  choice: левит
  rationale: Точный и общепринятый термин для представителя колена Левия.
- source_word: הַגֵּר
  choice: переселенец[a]
  rationale: גֵּר обозначает живущего среди Израиля человека неместного происхождения, находящегося под защитой общины. «Переселенец» понятнее современному читателю, чем архаичное «пришелец», а сноска уточняет правовой и общественный оттенок.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: живущий среди тебя
  rationale: Сохраняет причастную характеристику и единственное число обращения, присутствующее в еврейском тексте.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблено четырёхбуквенное личное имя Бога. «Яхве» сохраняет его как имя и отражает наиболее принятую научную реконструкцию произношения.
- issue: Круг участников радости
  choice: ты, левит и переселенец
  alternative: ты вместе с левитом и переселенцем
  rationale: Сохранено подчёркнутое אַתָּה и присоединённое перечисление без устранения лёгкой синтаксической напряжённости оригинала, где сказуемое стоит в единственном числе, а затем названы и другие участники.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет выделенное перечисление оригинала; местоимения второго лица переданы в единственном числе.
