base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: ru
  text: и поставить тебя превыше всех народов, которых Он создал, для хвалы, известности[a] и великолепия[b], и чтобы ты был святым народом, принадлежащим Яхве, твоему Богу, как Он сказал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имени»; здесь «имя» может означать известность или славу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «славы»; еврейское слово может обозначать красоту, великолепие, блеск или славу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как Он обещал»; буквально: «как Он сказал».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: и поставить тебя превыше всех народов
  rationale: Инфинитив נתן продолжает ряд целей и вместе с предикативным עֶלְיוֹן выражает возвышение Израиля над всеми народами. «Поставить… превыше» точно и естественно передаёт эту конструкцию в возвышенном современном русском языке.
- source_word: אֲשֶׁר עָשָׂה
  choice: которых Он создал
  rationale: Относительное предложение относится к народам. Хотя עשה обычно означает «делать», в отношении народов русское «создал» естественно выражает, что они обязаны Богу своим существованием, не требуя более специального глагола творения.
- source_word: לִתְהִלָּה
  choice: для хвалы
  rationale: Сохранены целевое значение предлога ל и отвлечённое существительное «хвала»; краткая формулировка не уточняет сверх текста, кому именно воздаётся хвала.
- source_word: וּלְשֵׁם
  choice: известности
  rationale: שֵׁם буквально значит «имя», но в данном сочетании обозначает доброе имя, известность или славу. «Известность» передаёт идиоматический смысл и не смешивается со следующим словом, которое может означать славу или великолепие.
- source_word: וּלְתִפְאָרֶת
  choice: великолепия
  rationale: תִּפְאֶרֶת охватывает красоту, блеск, великолепие и славу. «Великолепие» сохраняет образно-эстетический оттенок и различает члены трёхчастного ряда.
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ
  choice: и чтобы ты был святым народом
  rationale: Инфинитивная конструкция продолжает целевой ряд. Русское придаточное с «чтобы» звучит естественнее буквального инфинитивного оборота и сохраняет смысл посвящённости народа.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твоего Бога
  rationale: 'Предлог ל обозначает принадлежность или особое отношение: народ принадлежит Яхве. Имя יהוה передано транслитерацией «Яхве», а приложение «твоего Бога» сохраняет обращение к Израилю в единственном числе.'
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: как Он сказал
  rationale: דבר означает «говорить, сказать». Перевод не превращает речь прямо в обещание, хотя в заветном контексте она может иметь силу обещания.
theological_decisions:
- issue: Следует ли явно представить заключительные слова как обещание
  choice: как Он сказал
  alternative: как Он обещал
  rationale: В еврейском тексте стоит обычный глагол דבר — «говорить». Формулировка «сказал» сохраняет лексическую открытость текста, не отрицая подразумеваемого контекстом обещания.
- issue: Как передать отношение святого народа к יהוה
  choice: святым народом Яхве, твоего Бога
  alternative: святым народом для Яхве, твоего Бога
  rationale: Русский родительный оборот естественно выражает принадлежность, отмеченную предлогом ל, и не вводит идеи, будто народ является лишь средством для некоторой внешней цели.
- issue: К кому относится хвала, известность и великолепие
  choice: сохранить компактный целевой ряд без явного обладателя
  alternative: чтобы ты обрёл хвалу, известность и великолепие
  rationale: Еврейская конструкция не называет обладателя каждого качества отдельным местоимением. Добавление «ты обрёл» сняло бы возможную смысловую напряжённость и сделало бы толкование более однозначным, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксическая связь с предыдущим стихом намеренно сохранена начальным союзом «и». Заглавное «Он» употреблено как уважительное обозначение Бога; местоимения «тебя» и «твоего» сохраняют грамматическое единственное число обращения к Израилю.
