source:
  edition: WLC
  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: ru
  text: Когда ты закончишь отделять всю десятину от своего урожая в третий год — год десятины, — отдай её левиту, пришельцу, сироте и вдове, и они будут есть в твоих городах[a] и насытятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих воротах». Здесь имеются в виду города или поселения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном предписании союз вводит временное обстоятельство, после которого следует основное повеление.
- source_word: תְכַלֶּה לַעְשֵׂר
  choice: завершишь отделять всю десятину
  rationale: Порода пиэль глагола כלה выражает завершение действия, а עשר — отделение десятой части; формулировка сохраняет связь с последующим существительным «десятина».
- source_word: מַעְשַׂר תְּבוּאָתְךָ
  choice: десятину со своего урожая
  rationale: מַעְשַׂר означает десятую долю, а תְּבוּאָה — урожай или произведение земли. Предлог «со» естественно передаёт долю, отделяемую от урожая.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: год десятины
  rationale: Прямо передаёт определяющее сочетание и сохраняет его связь с третьим годом.
- source_word: וְנָתַתָּה
  choice: отдай её
  rationale: Последовательная глагольная форма продолжает предписание; местоимение «её» ясно отсылает к десятине.
- source_word: לַגֵּר
  choice: пришельцу
  rationale: גֵּר обозначает живущего среди израильтян некоренного жителя. «Пришелец» сохраняет юридико-заветную категорию и остаётся понятным в современном литературном русском.
- source_word: לַיָּתוֹם
  choice: сироте
  rationale: Русское «сирота» естественно и точно обозначает социально уязвимую категорию, выраженную древнееврейским יָתוֹם.
- source_word: בִשְׁעָרֶיךָ
  choice: в твоих городах
  rationale: Буквально «в твоих воротах»; в правовой речи Второзакония ворота метонимически обозначают поселения. В основном тексте дан естественный смысл, буквальная форма сохранена в сноске.
- source_word: וְאָכְלוּ ... וְשָׂבֵעוּ
  choice: Пусть они едят ... и насыщаются
  rationale: Форма передаёт предусмотренный законом результат и дозволение; русская конструкция с «пусть» звучит естественно и сохраняет предписывающий характер.
theological_decisions:
- issue: Перечень получателей десятины
  choice: 'Сохранены конкретные категории: «левиту, пришельцу, сироте и вдове»'
  alternative: Обобщить как «нуждающимся» или заменить современными социальными категориями
  rationale: Текст намеренно называет определённых участников заветного общества; обобщение устранило бы юридическую и богословскую конкретность стиха.
- issue: Значение выражения בִשְׁעָרֶיךָ
  choice: В основном тексте «в твоих городах», буквальный образ — в сноске
  alternative: «в твоих воротах»
  rationale: Ворота здесь обозначают местное поселение. Смысловой перевод делает норму понятной современному читателю, а сноска сохраняет образ исходного текста.
- issue: Синтаксическая сила заключительных глаголов
  choice: «Пусть они едят ... и насыщаются»
  alternative: «и они будут есть ... и насытятся»
  rationale: Выбрана формулировка, сохраняющая одновременно предписывающий контекст и желаемый результат, без добавления богословских выводов.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Сохранены ключевые термины «десятина», «левит» и «пришелец»; архаическая буквальность выражения о воротах разъяснена в сноске.
