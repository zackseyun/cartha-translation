revisions:
- from: Когда ты завершишь отделять всю десятину со своего урожая в третий год, в год десятины, отдай её левиту, пришельцу, сироте и вдове. Пусть они едят в твоих городах[a] и насыщаются.
  to: Когда ты закончишь отделять всю десятину от своего урожая в третий год — год десятины, — отдай её левиту, пришельцу, сироте и вдове, и они будут есть в твоих городах[a] и насытятся.
  rationale: 'Исправлена синтаксическая сила заключительных глаголов: получатели десятины не получают нового побудительного обращения, а будут есть и насытятся вследствие предписанной передачи. Также слегка улучшена естественность начальной глагольной конструкции. Сноска сохранена на том же слове и продолжает отражать буквальное значение еврейского выражения.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:03:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: завершение отделения десятины в третий, «год десятины», её передача четырём названным категориям и их питание в местном поселении. Однако заключительные וְאָכְלוּ ... וְשָׂבֵעוּ обозначают последующее следствие/результат, а не побудительное «пусть».'
  naturalness: «Завершишь отделять» допустимо, но «закончишь отделять» несколько естественнее в современном литературном русском. Конструкция «Пусть они едят ... и насыщаются» стилистически гладка, но неточно меняет синтаксическую силу оригинала; «они будут есть ... и насытятся» лучше сохраняет последовательность предписания.
  terminology: «Десятина», «левит», «пришелец», «сирота» и «вдова» точны и уместны для современного литературного перевода законодательного текста. «В твоих городах» — обоснованная смысловая передача בִּשְׁעָרֶיךָ; буквальное значение корректно дано в сноске.
  issues:
  - severity: medium
    issue: Побудительное «Пусть они едят ... и насыщаются» вместо результативного будущего.
    rationale: После повеления «отдай» формы וְאָכְלוּ и וְשָׂבֵעוּ описывают то, что получатели будут есть и насытятся. Русское «пусть» превращает это в отдельное адресованное им побуждение, которого в еврейской формулировке нет.
  - severity: low
    issue: «Завершишь отделять» менее естественно, чем «закончишь отделять».
    rationale: Оба варианта передают תְכַלֶּה לַעְשֵׂר, но «закончишь» более обычно в современном литературном русском и не меняет значения.
  revised_text: Когда ты закончишь отделять всю десятину от своего урожая в третий год — год десятины, — отдай её левиту, пришельцу, сироте и вдове, и они будут есть в твоих городах[a] и насытятся.
