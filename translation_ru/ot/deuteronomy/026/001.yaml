  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: ru
  text: И когда ты войдёшь в землю, которую Яхве, твой Бог, даёт тебе в наследие[a], овладеешь ею и поселишься в ней[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в удел»; еврейское слово означает наследственное владение или отведённый удел.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будешь жить в ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Обычная древнееврейская формула, вводящая будущее обстоятельство; по-русски естественно передаётся временным оборотом «И когда» без буквального и тяжеловесного «И будет, когда».
- source_word: תָבֹוא אֶל־הָאָרֶץ
  choice: ты войдёшь в землю
  rationale: בוא с אֶל здесь обозначает вступление внутрь страны; «войдёшь в землю» сохраняет форму обращения во втором лице единственного числа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет форму второго лица единственного числа и заветный характер обращения.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Причастная форма выражает совершающееся или предстоящее дарование; настоящее время по-русски сохраняет живую обещательную перспективу контекста.
- source_word: נַחֲלָה
  choice: в наследие
  rationale: Слово обозначает наследственный удел или владение; устойчивое русское выражение «дать в наследие» естественно сохраняет эту смысловую окраску.
- source_word: וִירִשְׁתָּהּ
  choice: овладеешь ею
  rationale: В контексте земли ירשׁ означает вступить во владение, завладеть; «овладеешь» передаёт активное принятие земли во владение и не повторяет слово «наследие».
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: и поселишься в ней
  rationale: ישׁב здесь обозначает оседлое проживание; «поселишься» естественно передаёт переход к жизни в земле после овладения ею.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Соотношение Божьего дара и действий Израиля
  choice: 'Сохранена последовательность: Бог даёт землю, адресат овладевает ею и поселяется в ней'
  alternative: Свести всё к общему утверждению о получении земли
  rationale: Еврейский текст удерживает рядом Божье дарование и последующее вступление народа во владение и проживание; перевод не устраняет это смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Единственное число «ты» сохранено как форма обращения к Израилю. Запятая в конце отражает синтаксическую незавершённость стиха и переход к следующему предложению.
