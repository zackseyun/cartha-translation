base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: ru
  text: 'И приди к священнику, который будет служить в те дни, и скажи ему: «Сегодня я возвещаю[a] Яхве, твоему Богу, что вошёл в землю, которую Яхве поклялся нашим отцам[b] дать нам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сегодня я возвестил». Еврейская форма, вероятно, имеет перформативный смысл: человек делает это заявление, произнося эти слова.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нашим предкам». Буквально: «нашим отцам»; в данном контексте могут подразумеваться прежде всего праотцы Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: И приди
  rationale: Глагол בוא обозначает приход или прибытие к священнику; в последовательности предписаний русское повелительное «приди» естественно передаёт директивную силу формы.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: который будет служить в те дни
  rationale: 'Буквально: «который будет в те дни». Добавление «служить» ясно выражает контекстуальный смысл — священника, исполняющего тогда служение, — не вводя представления о формальной должности сверх текста.'
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Сегодня я возвещаю
  rationale: 'Перфект может иметь перформативное значение: говорящий совершает объявление самими этими словами. Настоящее время сохраняет эту функцию.'
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное заветное имя יהוה, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: Сохранено обращение к священнику во втором лице единственного числа; текст не сглажен до «нашему Богу».
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: что вошёл в землю
  rationale: כִּי вводит содержание заявления, а בוא с אֶל в данном контексте указывает на вступление в обещанную землю.
- source_word: לַאֲבֹתֵינוּ לָתֶת לָנוּ
  choice: дать нам, нашим отцам
  rationale: Синтаксис еврейского текста связывает «нашим отцам» с клятвой, а «нам» — с дарованием; перестановка в русском делает эти отношения ясными и избегает ошибочного чтения «поклялся нашим отцам дать нам» лишь за счёт порядка слов.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте дважды стоит тетраграмматон; транслитерация сохраняет личное заветное имя и отличает его от титула.
- issue: К кому относится «нашим отцам»
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Мужская форма сохранена, поскольку в контексте Второзакония выражение может особо указывать на праотцов; более широкое «предкам» допустимо, но снимает эту возможность.
- issue: Временное значение הִגַּדְתִּי
  choice: Сегодня я возвещаю
  alternative: Сегодня я возвестил
  rationale: 'Выбрано перформативное настоящее: исповедующий объявляет это в момент произнесения. Совершенное прошедшее остаётся грамматически возможным.'
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной и богослужебной речи. Сохранены второе лицо единственного числа, прямая речь, личное имя Яхве и напряжение между буквальной формой перфекта и её вероятной перформативной функцией.
