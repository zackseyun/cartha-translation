base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: ru
  text: 'И скажи пред Яхве, Богом твоим: «Я вынес из дома священную долю[a] и также отдал её левиту, пришельцу[b], сироте[c] и вдове — согласно всем Твоим повелениям, которые Ты заповедал мне. Я не преступил Твоих заповедей и не забыл их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святыню», «посвящённое». Здесь имеется в виду посвящённая десятина или часть урожая, отделённая для раздачи.'
    reason: lexical_alternative
  - marker: b
    text: То есть живущему среди израильтян переселенцу или иноземцу.
    reason: lexical_clarification
  - marker: c
    text: Еврейское слово может обозначать сироту вообще или, в частности, ребёнка, лишившегося отца.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И скажи
  rationale: Форма продолжает последовательность предписанных обрядовых действий; русский совершенный вид естественно передаёт предписание совершить следующее действие.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: пред Яхве, Богом твоим
  rationale: לִפְנֵי означает «перед, в присутствии»; «пред» сохраняет достоинство ритуальной формулы. Личное имя יהוה передано как «Яхве».
- source_word: בִּעַרְתִּי
  choice: я убрал
  rationale: В данном контексте глагол означает удалить или вынести посвящённую долю из дома, а не сжечь её.
- source_word: הַקֹּדֶשׁ
  choice: священную долю
  rationale: Буквально это «святыня, священное»; контекст указывает на отделённую десятину или произведения, предназначенные для раздачи. «Доля» проясняет референт без чрезмерного уточнения.
- source_word: מִן הַבַּיִת
  choice: из дома
  rationale: Сохраняется определённая форма исходного текста; принадлежность дома говорящему ясна из контекста и не добавляется явно.
- source_word: וְגַם נְתַתִּיו
  choice: и также отдал её
  rationale: «Также» передаёт גַם, а местоимение женского рода относится к «священной доле».
- source_word: לַלֵּוִי
  choice: левиту
  rationale: Текст называет левита, не сужая значение до священника.
- source_word: לַגֵּר
  choice: пришельцу
  rationale: גֵּר обозначает живущего среди Израиля переселенца или иноземца; «пришелец» кратко сохраняет эту общественно-правовую категорию.
- source_word: לַיָּתוֹם
  choice: сироте
  rationale: Русское «сирота» естественно обозначает названную в законе уязвимую категорию; еврейское слово может особо подразумевать лишённого отца.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: согласно всему Твоему повелению, которое Ты дал мне
  rationale: Единственное число מִצְוָה передано как собирательное «повеление»; относительное предложение сохраняет повтор корня «повелевать», но выражено естественно по-русски.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: я не преступил Твоих заповедей
  rationale: עבר מן здесь означает нарушить или преступить установленную границу; сохраняется множественное число «заповедей».
- source_word: וְלֹא שָׁכָחְתִּי
  choice: и не забыл их
  rationale: Объект подразумевается и по-русски естественно выражен местоимением, относящимся к заповедям.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение הַקֹּדֶשׁ в обрядовом заявлении
  choice: священная доля
  alternative: святыня
  rationale: Перевод сохраняет идею посвящённости Богу и одновременно указывает на предназначенную для раздачи часть урожая; он не определяет её природу точнее, чем позволяет контекст.
translation_notes:
  register: Современный литературный русский с достоинством ритуального исповедания. Форма «пред Яхве» слегка возвышенна, но понятна; остальная фраза синтаксически проста и пригодна для публичного чтения. Прописные местоимения обращения к Богу использованы последовательно внутри прямой речи.
