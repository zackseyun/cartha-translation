  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: ru
  text: И вот теперь я принёс первую часть плодов земли[a], которую Ты, Яхве, дал мне. Положи её перед Яхве, твоим Богом, и поклонись[b] перед Яхве, твоим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «первое от плода земли»; возможно также: «начатки» или «первая часть урожая с земли».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол обозначает поклон с простиранием ниц; перевод «соверши поклонение» передаёт более широкий смысл этого действия.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет связь с предшествующим исповеданием и отмечает переход к совершаемому приношению.
- source_word: הִנֵּה
  choice: вот
  rationale: Естественно для современного русского языка передаёт указательное значение частицы без архаизации.
- source_word: הֵבֵאתִי
  choice: я принёс
  rationale: Прошедшее совершенного вида передаёт завершённое действие, о котором заявляет приносящий.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: начатки плодов земли
  rationale: «Начатки» естественно обозначают первую часть урожая, а множественное «плодов» позволяет согласовать местоимение с подразумеваемым приношением и сохраняет образное выражение оригинала.
- source_word: הָאֲדָמָה
  choice: земли
  rationale: В данном земледельческом контексте слово обозначает почву, дающую урожай; «земля» звучит естественнее, чем узкое «почва», и сохраняет возможный смысл дарованной земли.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: которую Ты дал мне
  rationale: Относительное местоимение грамматически относится к «земле», как и соответствующая форма в еврейском; сохраняется прямое признание Божьего дара.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וְהִנַּחְתּוֹ
  choice: Поставь же их
  rationale: В обрядовой инструкции форма имеет предписывающее значение. «Поставь» естественно описывает помещение принесённого перед Богом; «их» соотнесено с русским «начатки».
- source_word: לִפְנֵי
  choice: перед
  rationale: Кратко и точно передаёт как пространственное положение, так и нахождение в Божьем присутствии.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: и поклонись
  rationale: Сохраняет обозначенное глаголом телесное действие и не подменяет его более широким понятием поклонения как богослужения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет личное имя Бога; транслитерация сохраняет это различие.
- issue: Значение וְהִשְׁתַּחֲוִיתָ
  choice: поклонись
  alternative: соверши поклонение
  rationale: Выбранный вариант сохраняет конкретный телесный жест, который в контексте является актом почитания, не сводя глагол лишь к абстрактному религиозному понятию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным обрядовым звучанием. Обращение к Богу выделено прописной буквой «Ты», а к приносящему обращаются со строчной. Частица «вот» сохраняет дейктическую силу הִנֵּה без архаического «се».
