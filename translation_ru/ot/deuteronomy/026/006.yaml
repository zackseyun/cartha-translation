base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: ru
  text: Египтяне жестоко обращались с нами[a], угнетали нас[b] и возложили на нас тяжёлый труд[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «причиняли нам зло»; также возможно: «плохо обращались с нами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мучили нас», «притесняли нас».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обременили нас тяжёлой работой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: жестоко обращались с нами
  rationale: Глагол רעע в породе hифиль обозначает причинение зла или дурное, жестокое обращение. Выбран естественный современный оборот, не уточняющий конкретный вид насилия.
- source_word: הַמִּצְרִים
  choice: египтяне
  rationale: Определённое обозначение народа Египта, выступающего здесь как притесняющая сторона.
- source_word: וַיְעַנּוּנוּ
  choice: угнетали нас
  rationale: Глагол ענה в породе пиэль может означать угнетение, причинение страданий или унижение. «Угнетали» сохраняет отличие от предыдущего выражения и соответствует контексту порабощения.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: возложили на нас
  rationale: Буквально передаёт образ действия נתן על — положить или возложить что-либо на кого-либо — и сохраняет представление о тяжком бремени.
- source_word: עֲבֹדָה קָשָׁה
  choice: тяжёлый труд
  rationale: עֲבֹדָה означает труд, работу или служение, а קָשָׁה — тяжёлый, суровый. Сочетание «тяжёлый труд» естественно в русском языке и передаёт изнурительный характер работы.
theological_decisions:
- issue: Различение последовательных обозначений притеснения
  choice: 'Сохранить три отдельных действия: «жестоко обращались», «угнетали» и «возложили… тяжёлый труд».'
  alternative: Объединить первые два глагола в одно понятие угнетения либо во всех трёх частях прямо говорить о рабстве.
  rationale: Еврейский текст последовательно употребляет три связанных, но не тождественных выражения. Их разграничение сохраняет риторику и смысловую нарастающую последовательность, не добавляя отсутствующих в стихе уточнений.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повествовательным строем. Три глагольных выражения намеренно разграничены; образ возложенного бремени сохранён.
