base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: ru
  text: Я не ел ничего из неё, когда скорбел[a], не удалял ничего из неё[b], будучи нечистым, и не отдавал ничего из неё для умершего[c]. Я слушался голоса Яхве, моего Бога, и во всём поступил так, как Ты повелел мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время траура», «в моей скорби» или «в бедствии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не сжигал ничего из неё» или «не уничтожал ничего из неё». Еврейский глагол может означать удаление, уничтожение или сожжение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «умершему» или «в связи с умершим». Какое именно запрещённое употребление имеется в виду, не уточняется.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹנִי
  choice: когда скорбел
  rationale: Передаёт состояние скорби или траура естественным современным русским языком, не сводя значение исключительно к формальному трауру; возможные оттенки отмечены в сноске.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: не удалял ничего из неё
  rationale: В породе пиэль глагол בער может означать устранение, уничтожение или сожжение. Общее «удалял» сохраняет широту значения, а более узкие варианты вынесены в сноску.
- source_word: בְטָמֵא
  choice: будучи нечистым
  rationale: Формулировка ясно обозначает состояние ритуальной нечистоты, не добавляя отсутствующих в тексте подробностей.
- source_word: לְמֵת
  choice: для умершего
  rationale: Сохраняет краткость и неоднозначность еврейского выражения, не уточняя, идёт ли речь о погребальном обряде, приношении или иной связи с умершим.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: Я слушался голоса
  rationale: Еврейская идиома выражает не только слушание, но и послушание; русский глагол «слушался» передаёт это значение и сохраняет образ голоса.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: во всём поступил так, как Ты повелел мне
  rationale: Естественно и точно выражает полное соответствие сказанному повелению.
theological_decisions:
- issue: Характер запрещённого употребления «для умершего»
  choice: Сохранить широкую формулировку «для умершего»
  alternative: «для погребального обряда», «умершему» или «в связи с умершим»
  rationale: Еврейский текст не определяет конкретный обычай. Более узкая формулировка необоснованно разрешила бы смысловую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для торжественного исповедания. Синтаксис сделан ясным для чтения вслух; неоднозначные ритуальные выражения не конкретизированы без достаточных оснований.
