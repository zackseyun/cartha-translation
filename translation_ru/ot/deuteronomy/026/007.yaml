  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: ru
  text: Тогда мы воззвали к Яхве, Богу наших отцов, и Яхве услышал наш голос и увидел наше бедствие, наш тяжкий труд и наше угнетение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: мы воззвали
  rationale: Глагол צעק выражает настойчивый, отчаянный призыв о помощи; «воззвали» сохраняет силу обращения и подходит dignified современному библейскому повествованию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Богу наших отцов
  rationale: Точно сохраняет конструкцию и заветную формулу, связывающую Яхве с праотцами Израиля.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: услышал наш голос
  rationale: Сохраняет буквальный образ еврейского выражения; по-русски он понятен как услышанная мольба.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямо передаёт простой глагол ראה, не добавляя толкования вроде «обратил внимание».
- source_word: עָנְיֵנוּ
  choice: наше бедствие
  rationale: Передаёт состояние страдания и унижения; слово естественно в современном литературном русском.
- source_word: עֲמָלֵנוּ
  choice: наш тяжкий труд
  rationale: עָמָל охватывает изнурительный труд и мучительные тяготы; в египетском контексте «тяжкий труд» сохраняет связь с принудительными работами и отличает термин от бедствия и угнетения.
- source_word: לַחֲצֵנוּ
  choice: наше угнетение
  rationale: Передаёт давление и притеснение со стороны угнетателей и соответствует контексту рабства в Египте.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение того, что Яхве «увидел» страдание
  choice: сохранить буквальное «увидел»
  alternative: обратил внимание; сжалился
  rationale: Форма וַיַּרְא сообщает внимательное видение, но сама по себе не называет ни жалости, ни последующего действия; перевод не снимает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Трёхчастный ряд «бедствие — тяжкий труд — угнетение» сохраняет различия между еврейскими существительными и ритм исповедального повествования.
