  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: ru
  text: И Он привёл нас на это место и дал нам эту землю — землю, где текут молоко и мёд.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «землю, изобилующую молоком и мёдом». Еврейское выражение рисует образ плодородия и изобилия.'
    reason: lexical_alternative
  - marker: b
    text: Слово «мёд» в некоторых контекстах может обозначать также сладкий плодовый сироп, например финиковый, а не только пчелиный мёд.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: привёл нас
  rationale: Хифиль глагола בוא с суффиксом 1-го лица множественного числа выражает каузативное перемещение к месту назначения. «Привёл нас» естественно передаёт этот смысл по-русски.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: на это место
  rationale: Предлог אֶל обозначает движение к месту назначения, а מָקוֹם — «место». В данном контексте по-русски естественно сказать «привёл на это место».
- source_word: וַיִּתֶּן לָנוּ
  choice: и дал нам
  rationale: נתן с ל обозначает передачу получателю. Прямое «дал нам» сохраняет простой характер исходной формулировки.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: эту землю
  rationale: Здесь אֶרֶץ обозначает конкретную землю, дарованную Израилю; «земля» точно и традиционно передаёт контекстуальный смысл.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: землю, где текут молоко и мёд
  rationale: Причастие זָבַת буквально создаёт образ текущего изобилия. Формулировка сохраняет еврейскую метафору и при этом звучит понятно и естественно на современном русском.
- source_word: דְבָשׁ
  choice: мёд
  rationale: דְבָשׁ обычно означает мёд, хотя может охватывать и сладкий плодовый сироп. В основном тексте сохранено узнаваемое «мёд», а более широкая возможность отмечена в сноске.
theological_decisions:
- issue: Божественный субъект в историческом исповедании от первого лица
  choice: Сохранить местоимение «Он», не заменяя его именем «Господь»
  alternative: «И Господь привёл нас на это место…»
  rationale: В еврейском тексте данного стиха субъект выражен лишь формами глагола в 3-м лице единственного числа и определяется из предыдущего контекста. Местоимение сохраняет связность оригинала и не вводит явное имя Бога там, где в самом стихе оно отсутствует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавная буква в «Он» ясно отсылает к Богу из ближайшего контекста, не подставляя отсутствующее в стихе Божье имя. Тире естественно вводит пояснительное повторение «землю».
