  source_fidelity: Перевод точно передаёт казуистическую конструкцию כִּי («Когда»), жатву, забытый в поле сноп, запрет возвращаться за ним, назначение снопа для трёх уязвимых категорий и цель/следствие благословения. «Пришелец» с примечанием адекватно отражает גֵּר как неместного жителя, а не просто случайного иностранца. «Сирота» допустимо передаёт יָתוֹם; примечание не скрывает возможного более узкого оттенка «лишившийся отца».
  naturalness: Текст звучит естественно в современном литературном русском и сохраняет надлежащий сдержанно-законодательный регистр. Повтор «в поле» оправдан оригиналом и делает обстоятельство забывания ясным. Выражение «во всяком деле твоих рук» является прозрачным библейским образом и не препятствует пониманию.
  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. «Сноп», «пришелец», «сирота» и «вдова» точны для контекста. Примечания привязаны к соответствующим словам и не вносят конфессионального толкования.
