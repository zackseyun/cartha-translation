source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: ru
  text: Когда будешь жать урожай на своём поле и забудешь в поле сноп, не возвращайся, чтобы забрать его. Он будет для пришельца[a], сироты[b] и вдовы, чтобы Яхве, твой Бог, благословил тебя во всяком деле твоих рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «чужеземца», «переселенца». Еврейское слово обозначает человека неместного происхождения, постоянно живущего среди израильтян.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать сироту вообще или ребёнка, лишившегося отца.
    reason: lexical_scope
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: Вводит типичный случай в казуистическом законе; «когда» естественно передаёт ситуацию, сохраняя условный оттенок.
- source_word: תִקְצֹר קְצִירְךָ
  choice: будешь жать урожай
  rationale: Сохраняет сельскохозяйственный образ жатвы и различает действие жатвы и её результат.
- source_word: עֹמֶר
  choice: сноп
  rationale: В данном контексте обозначает связку сжатых стеблей, а не меру объёма «омер».
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: не возвращайся, чтобы забрать его
  rationale: Передаёт и возвращение, и намерение взять забытый сноп; формулировка ясна в современном русском.
- source_word: גֵּר
  choice: пришелец
  rationale: Обозначает живущего среди Израиля человека неместного происхождения; «пришелец» сохраняет социально-правовую категорию и библейское достоинство речи.
- source_word: יָתוֹם
  choice: сирота
  rationale: Естественное современное русское обозначение социально уязвимого ребёнка; еврейское слово может особо подразумевать лишённого отца.
- source_word: יִהְיֶה
  choice: Он будет для
  rationale: Сохраняет буквальное значение принадлежности или предназначения, не превращая высказывание в отдельный приказ «оставь».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно вводит цель или ожидаемый результат.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶיךָ
  choice: во всяком деле твоих рук
  rationale: Сохраняет древнееврейский образ рук как человеческого труда и при этом остаётся понятным по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, тетраграмматон; «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Социально-правовая категория גֵּר
  choice: пришелец
  alternative: чужеземец; переселенец; живущий среди вас иноземец
  rationale: Слово обозначает не просто незнакомца, а неместного жителя, находящегося внутри общества Израиля; краткое «пришелец» сохраняет эту особую категорию, а примечание уточняет её.
- issue: Связь послушания и благословения в לְמַעַן יְבָרֶכְךָ
  choice: чтобы Яхве, твой Бог, благословил тебя
  alternative: и тогда Яхве, твой Бог, благословит тебя
  rationale: Союз לְמַעַן допускает оттенки цели и результата; перевод «чтобы» сохраняет формулировку источника и не усиливает её до безусловной механической гарантии.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Сохранены повтор «в поле», образ «дела рук» и личное имя Яхве. Маркеры примечаний поставлены непосредственно после слов, к которым относятся.
