lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: и она уйдёт из его дома
  rationale: Глагол יצא с предлогом מִן означает выход или удаление из дома. «Уйдёт из его дома» естественно передаёт сам факт ухода и исходную точку, сохраняя последовательность правового казуса.
- source_word: וְהָלְכָה
  choice: пойдёт
  rationale: הלך обозначает следующий шаг после ухода. Нейтральное «пойдёт» не уточняет направление или способ движения сверх сказанного в еврейском тексте.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: и станет женой другого мужчины
  rationale: Конструкция היה ל־ в данном контексте указывает на вступление в брачное отношение. Слово «женой» восполняет подразумеваемый смысл по-русски, а сноска сохраняет буквальную форму выражения.
