  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: ru
  text: Не притесняй наёмного работника — бедного и нуждающегося, будь он твоим братом или пришельцем, живущим в твоей земле, в твоих городах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих воротах» — еврейское выражение, обозначающее города или поселения адресата.'
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: не притесняй
  rationale: Глагол עָשַׁק обозначает притеснение и эксплуатацию, особенно экономическую; «не притесняй» сохраняет широту и нравственную силу запрета, включая обман и удержание платы.
- source_word: שָׂכִיר
  choice: наёмный работник
  rationale: Существительное обозначает человека, нанятого за плату; современное выражение ясно передаёт трудовые отношения без оттенка домашнего рабства.
- source_word: עָנִי וְאֶבְיוֹן
  choice: бедный и нуждающийся
  rationale: Парное определение подчёркивает экономическую уязвимость работника и сохраняет два различных еврейских слова.
- source_word: מֵאַחֶיךָ
  choice: из твоих братьев
  rationale: Сохранён буквальный язык родства, характерный для законов Второзакония и обозначающий членов народа Израиля.
- source_word: מִגֵּרְךָ
  choice: из пришельцев
  rationale: גֵּר — постоянно проживающий среди Израиля чужеземец, находящийся под защитой закона; «пришелец» сохраняет библейскую общественно-правовую категорию и не переносит на неё современные миграционные статусы.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: живущих в твоей земле
  rationale: Относительное придаточное естественно связано с пришельцами; причастие «живущих» ясно выражает их пребывание в земле адресата.
- source_word: בִּשְׁעָרֶיךָ
  choice: в твоих городах
  rationale: Буквально «в твоих воротах»; в данном правовом контексте это устойчивое обозначение городов или поселений, находящихся под властью общины. Значение передано в тексте, а образ сохранён в примечании.
theological_decisions:
- issue: Заветный термин родства אַחֶיךָ
  choice: из твоих братьев
  alternative: из твоих соплеменников / из израильтян
  rationale: Родственный образ сохранён без замены этническим пояснением; в контексте закона речь идёт о собратьях-израильтянах.
- issue: Общественно-правовой статус גֵּר
  choice: пришельцы
  alternative: живущие среди вас чужеземцы / переселенцы
  rationale: Выбор сохраняет особую библейскую категорию защищённого некоренного жителя и не отождествляет её с какой-либо современной юридической категорией.
translation_notes:
  register: Современный литературный русский язык с достоинством правового наставления. Императив в единственном числе передаёт обращение еврейского текста. «В твоих городах» естественно раскрывает идиому בִּשְׁעָרֶיךָ, тогда как буквальный образ дан в примечании.
