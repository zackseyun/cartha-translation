base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: ru
  text: 'Если появится кожное заболевание[a], будьте особенно внимательны: в точности соблюдайте и исполняйте все указания священников-левитов. Исполняйте их так, как я повелел им.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционный перевод — «проказа». Древнееврейское слово обозначает в Торе более широкий круг поражений кожи и не относится исключительно к современной болезни Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Остерегайтесь
  rationale: Форма нифаль повелительного наклонения выражает настойчивое предостережение; русский императив сохраняет его силу и естественно вводит правовое предписание.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: при появлении кожного заболевания
  rationale: נֶגַע обозначает поражение или проявление, а צָרַעַת в Торе охватывает ряд кожных состояний и не тождественна современной болезни Хансена.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: в точности соблюдайте и исполняйте
  rationale: Переданы и усилительное מְאֹד, и два взаимосвязанных действия — внимательное соблюдение предписаний и их практическое исполнение.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: всё, чему научат вас
  rationale: Глагол ירה в породе хифиль означает учить, наставлять или давать указания; «научат» естественно передаёт здесь авторитетное священническое наставление.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священники-левиты
  rationale: Формулировка передаёт характерное для Второзакония обозначение священников из колена Левия, не превращая выражение в два отдельных сословия.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: Как я повелел им
  rationale: Сохранены первое лицо говорящего и местоименный суффикс третьего лица множественного числа, относящийся к священникам.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: так и вы тщательно исполняйте
  rationale: Переданы повтор глагола שׁמר, практическая направленность לעשות и сопоставительная связь כַּאֲשֶׁר; добавленное «вы» ясно отличает адресатов от «им».
theological_decisions:
- issue: Передача צָרַעַת
  choice: кожное заболевание
  alternative: проказа
  rationale: Древнееврейский термин в законодательстве Торы шире современного медицинского понятия проказы; выбранный вариант избегает анахронического отождествления, а примечание сохраняет традиционный эквивалент.
- issue: Определение הַכֹּהֲנִים הַלְוִיִּם
  choice: священники-левиты
  alternative: священники, левиты
  rationale: Выражение понято как единое второзаконническое наименование священников, принадлежащих к Левию, а не как перечисление двух групп.
translation_notes:
  register: Современный литературный русский язык с достоинством правового наставления. Синтаксис слегка упрощён ради ясности, но сохранены повелительная сила, двойное требование соблюдать и исполнять, а также повтор שׁמר. Множественное число выбрано по форме адресованного Израилю повеления и последующего תִּשְׁמְרוּ.
