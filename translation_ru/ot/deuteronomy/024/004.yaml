base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: ru
  text: то её первый муж, который отпустил её, не вправе снова взять её себе в жёны после того, как она была осквернена[a], потому что это мерзость перед Яхве. Не навлекай греха на землю, которую Яхве, твой Бог, даёт тебе в наследие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того, как она стала нечистой»; или: «после того, как её сделали нечистой». Еврейский текст говорит, что она была осквернена, но не уточняет точную природу этого осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: её первый муж
  rationale: В брачном контексте בַּעַל означает «муж», а הָרִאשׁוֹן прямо обозначает его как первого в противопоставлении последующему мужу.
- source_word: שִׁלְּחָהּ
  choice: отпустил её
  rationale: Сохраняет буквальное значение «отослал, отпустил»; юридический контекст предыдущих стихов показывает, что речь идёт о разводе.
- source_word: לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה
  choice: снова взять её себе в жёны
  rationale: Естественно передаёт возобновление брачного союза и стандартную древнееврейскую брачную формулу.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: после того, как она была осквернена
  rationale: Пассивная форма טמא выражает осквернение или нечистоту, не уточняя здесь её точную природу; русский пассив сохраняет эту неопределённость.
- source_word: תוֹעֵבָה
  choice: мерзость
  rationale: Передаёт сильную нравственно-заветную оценку слова תוֹעֵבָה привычным и весомым библейским термином.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Буквально и естественно передаёт значение «перед, в присутствии» и сохраняет личное имя Бога.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: Не навлекай греха на землю
  rationale: Каузатив חטא допускает смысл «навлечь вину/грех». Такая формулировка естественна по-русски и не вводит не выраженное прямо понятие ритуального загрязнения.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: даёт тебе в наследие
  rationale: Точно и естественно передаёт נחלה как землю, даруемую Богом в наследственное владение.
theological_decisions:
- issue: Смысл выражения «после того, как она была осквернена»
  choice: Сохранено широкое значение «была осквернена» без уточнения причины или вида осквернения.
  alternative: «стала нечистой»; «сделалась ритуально нечистой»; «была осквернена вторым браком»
  rationale: Еврейский текст использует пассив от טמא, но в самом стихе не определяет, является ли нечистота ритуальной, половой, правовой или связанной с последующим браком. Перевод не устраняет эту напряжённость.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, непосредственно присутствующее в еврейском тексте.
- issue: Адресат запрета во второй части стиха
  choice: 'Единственное число: «Не навлекай… твой Бог… тебе»'
  alternative: 'Множественное обобщение: «не навлекайте… ваш Бог… вам»'
  rationale: Еврейские формы стоят во втором лице мужского рода единственного числа; русский перевод сохраняет грамматику исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Начальное «то» сохраняет связь аподосиса с условиями в стихах 1–3. Использованы понятные библейские термины без архаических форм и без конфессионального истолкования неоднозначного места.
