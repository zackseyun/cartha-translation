translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном закона. Сельскохозяйственный образ сохранён, а редкий еврейский оборот передан естественным запретом повторного сбора. Все местоимения стоят в форме единственного числа, как в еврейском тексте.
