  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: ru
  text: Когда будешь сбивать маслины с оливкового дерева, не обирай его вторично[a]; пусть оставшиеся плоды достанутся переселенцу[b], сироте[c] и вдове.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «не обирай ветви вслед за собой», то есть не возвращайся, чтобы собрать маслины, оставшиеся после первого обивания.'
    reason: lexical_alternative
  - marker: b
    text: 'Переселенец — человек не из числа местных жителей, живущий среди израильтян; возможные переводы: «пришелец» или «чужеземец, живущий среди вас».'
    reason: cultural_note
  - marker: c
    text: 'Или: «лишённому отца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном установлении вводит обычную ситуацию, при которой действует предписание; временное «когда» естественнее простого условного «если».
- source_word: תַחְבֹּט זֵיתְךָ
  choice: будешь обивать свою оливу
  rationale: Глагол חבט обозначает удары по дереву или ветвям, которыми сбивают маслины; «обивать оливу» кратко передаёт традиционный способ сбора и сохраняет единственное число.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: не обирай её потом вторично
  rationale: Редкий оборот в контексте сбора урожая запрещает возвращаться и снимать плоды, оставшиеся после первого прохода. Формулировка передаёт практический смысл, не связывая глагол с современным значением «украшать».
- source_word: לַגֵּר
  choice: переселенцу
  rationale: גֵּר — не коренной житель, поселившийся среди израильтян и находящийся под защитой закона; «переселенец» понятно современному читателю и не сводит понятие только к этнической принадлежности.
- source_word: לַיָּתוֹם
  choice: сироте
  rationale: יָתוֹם обозначает ребёнка, лишённого отца или родителей и потому социально уязвимого; русское «сирота» естественно и не уточняет больше, чем позволяет контекст.
- source_word: וְלָאַלְמָנָה
  choice: и вдове
  rationale: Обычное соответствие אַלְמָנָה, сохраняющее социально-правовой смысл текста.
- source_word: יִהְיֶה
  choice: оставшееся пусть будет
  rationale: Глагол «быть» здесь выражает назначение оставшихся плодов названным людям; добавленное «оставшееся» делает подразумеваемый предмет ясным по-русски.
