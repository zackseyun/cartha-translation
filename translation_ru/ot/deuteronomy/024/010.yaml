source:
  edition: WLC
  text: כִּֽי תַשֶּׁ֥ה בְ/רֵֽעֲ/ךָ מַשַּׁ֣את מְא֑וּמָה לֹא תָבֹ֥א אֶל בֵּית֖/וֹ לַ/עֲבֹ֥ט עֲבֹטֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: ru
  text: Если ты дашь своему ближнему что-либо взаймы[a], не входи в его дом, чтобы взять у него залог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда ты даёшь своему ближнему что-либо взаймы».'
    reason: Союз כִּי в формулировке казуистического закона может передаваться и как «если», и как «когда».
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Частица вводит казуистическое правовое условие; «если» естественно для современного русского языка, хотя возможно и временное «когда».
- source_word: תַשֶּׁה
  choice: дашь … взаймы
  rationale: Форма хифиль от נשה означает предоставление займа или кредита; сочетание «дать взаймы» точно и естественно по-русски.
- source_word: בְרֵעֲךָ
  choice: своему ближнему
  rationale: רֵעַ обозначает другого человека, в данном контексте — члена сообщества; «ближний» сохраняет межличностный и правовой оттенок.
- source_word: מַשַּׁאת מְאוּמָה
  choice: что-либо взаймы
  rationale: מַשַּׁאת указывает на заём или долг, а מְאוּמָה расширяет значение до «что-либо»; русский оборот передаёт оба компонента без тяжеловесности.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: не входи в его дом
  rationale: Отрицательная имперфектная форма в правовом контексте выражает запрет; прямой императив естественен в современном русском.
- source_word: לַעֲבֹט
  choice: чтобы взять
  rationale: В контексте глагол עבט означает получение залога; «взять» не привносит более сильного оттенка насильственного изъятия.
- source_word: עֲבֹטוֹ
  choice: у него залог
  rationale: Существительное обозначает вещь, служащую обеспечением займа. Оборот «взять у него залог» естественно передаёт местоименный суффикс, не предрешая, кому изначально принадлежала заложенная вещь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным правовым звучанием. Использован прямой запрет «не входи» вместо архаичного или канцелярского оборота; термин «залог» сохраняет юридический смысл исходного текста.
