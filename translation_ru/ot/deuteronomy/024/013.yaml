  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: ru
  text: Непременно возврати ему залог к заходу солнца[a], чтобы он лёг в своей верхней одежде и благословил тебя; и это будет праведностью для тебя пред Яхве, твоим Богом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возврати ему взятое в залог при заходе солнца».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «это зачтётся тебе как праведность»; возможно также: «это будет твоим праведным поступком».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: непременно возврати
  rationale: Сочетание инфинитива абсолютного с личной формой того же глагола усиливает повеление; «непременно возврати» естественно передаёт эту эмфазу по-русски.
- source_word: הַעֲבוֹט
  choice: залог
  rationale: Слово обозначает вещь, взятую в обеспечение долга. «Залог» — краткий и понятный юридический эквивалент.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: к заходу солнца
  rationale: Еврейское выражение идиоматически обозначает наступление заката; предлог כְּ допускает временное прочтение «к тому времени, когда».
- source_word: וְשָׁכַב
  choice: чтобы он лёг
  rationale: В контексте форма выражает предполагаемый результат или цель возвращения одежды до ночи.
- source_word: בְּשַׂלְמָתוֹ
  choice: в своей верхней одежде
  rationale: שַׂלְמָה — одежда, служившая также ночным покрывалом. «Верхняя одежда» яснее современному читателю, чем архаичное «плащ» или «мантия», и не уточняет фасон без оснований.
- source_word: וּבֵרֲכֶךָּ
  choice: и благословил тебя
  rationale: 'Субъектом остаётся нуждающийся человек: получив одежду обратно, он благословит заимодавца.'
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: и это будет праведностью для тебя
  rationale: Формулировка близка к еврейскому тексту и сохраняет смысловую широту צְדָקָה, не решая однозначно, идёт ли речь о праведном поступке или о признании человека праведным.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: пред Яхве, твоим Богом
  rationale: «Пред» передаёт לִפְנֵי как нахождение перед лицом или в оценке Бога; имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному консультационному решению.
- issue: Смысл выражения וּלְךָ תִּהְיֶה צְדָקָה
  choice: это будет праведностью для тебя
  alternative: это зачтётся тебе как праведность; это будет твоим праведным поступком
  rationale: Буквальная конструкция допускает оттенки как нравственно правильного поступка, так и благоприятной Божьей оценки. Основной текст сохраняет эту богословскую напряжённость, а примечание показывает диапазон.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-заветного наставления. Эмфатическое повеление передано без архаизмов. Сохранены неоднозначность צְדָקָה и прямое употребление имени Яхве.
