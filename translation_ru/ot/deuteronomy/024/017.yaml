base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: ru
  text: Не извращай правосудия в отношении пришельца[a] и сироты и не бери одежду вдовы в залог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущего среди вас чужеземца». Еврейское слово обозначает человека не из местных, который постоянно жил среди израильтян и находился под защитой их общественных и правовых установлений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: извращай
  rationale: В породе хифиль глагол נטה в судебном контексте означает «искривлять», «отвращать от справедливости». Сочетание «извращать правосудие» естественно для современного русского юридического и литературного языка.
- source_word: מִשְׁפַּט
  choice: правосудие в отношении
  rationale: מִשְׁפַּט здесь обозначает справедливое судебное разбирательство или законное право защищаемого лица. Оборот сохраняет юридический смысл, не сужая его только до отдельного судебного решения.
- source_word: גֵּר
  choice: пришелец
  rationale: Гֵּר — не случайный путник, а человек чужого происхождения, постоянно живущий среди израильского общества и пользующийся его правовой защитой. «Пришелец» сохраняет особую библейско-правовую категорию; пояснение дано в сноске.
- source_word: יָתוֹם
  choice: сирота
  rationale: Слово обозначает ребёнка, лишённого отцовской и общественной защиты. «Сирота» — ясный и естественный современный русский эквивалент.
- source_word: תַחֲבֹל
  choice: бери ... в залог
  rationale: В данном долговом законодательстве חבל означает брать вещь как обеспечение долга. «Брать в залог» точно и понятно передаёт эту юридическую практику.
- source_word: בֶּגֶד
  choice: одежду
  rationale: בֶּגֶד — общее обозначение предмета одежды; перевод не уточняет без основания, был ли это плащ или верхняя накидка.
- source_word: אַלְמָנָה
  choice: вдовы
  rationale: Родительный падеж естественно выражает принадлежность одежды вдове и сохраняет акцент на защите социально уязвимого лица.
theological_decisions:
- issue: Передача защищаемой социальной категории גֵּר
  choice: пришелец
  alternative: живущий среди вас чужеземец; переселенец
  rationale: «Пришелец» сохраняет отличие этого лица и от коренного израильтянина, и от временного чужеземного гостя. Чтобы традиционное слово не было понято как обозначение случайного путника, его конкретный общественно-правовой смысл раскрыт в сноске.
- issue: Соотношение גֵּר и יָתוֹם
  choice: пришелец и сирота как две защищаемые категории
  alternative: пришелец-сирота как единая составная категория
  rationale: Хотя между существительными нет отдельного союза, контекст законов Второзакония и обычное перечисление уязвимых групп поддерживают понимание двух однородных категорий. Перевод не делает из сиротства характеристику только пришельца.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным юридическим звучанием. Единственное число повелительных форм передаёт обращение еврейского текста. Формулировка остаётся краткой и не добавляет конфессиональных толкований.
