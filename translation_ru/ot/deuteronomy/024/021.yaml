base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: ru
  text: Когда будешь собирать виноград в своём винограднике, не возвращайся затем собирать оставшееся[a]; пусть оно останется для чужеземца[b], сироты[c] и вдовы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обирай его после первого сбора». Еврейский глагол означает повторный проход, при котором собирают оставшийся виноград.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть чужеземцу, постоянно живущему среди израильтян; возможно также: «пришельцу».'
    reason: cultural_note
  - marker: c
    text: 'Или: «оставшемуся без отца». Еврейское слово нередко обозначает ребёнка, лишившегося отца, а также сироту вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном казуистическом предписании союз вводит ожидаемую ситуацию, поэтому «когда» естественнее условного «если».
- source_word: תִבְצֹר
  choice: будешь собирать виноград
  rationale: Глагол обозначает именно сбор винограда; дополнение выражено явно для естественности русского текста.
- source_word: כַּרְמְךָ
  choice: в своём винограднике
  rationale: Передаёт значение «твой виноградник», а возвратное местоимение естественно по-русски соотносит его с адресатом.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: не проходи по нему вслед за собой, собирая оставшееся
  rationale: Выражение запрещает владельцу повторно проходить по винограднику и подбирать то, что осталось после первого сбора. Формулировка сохраняет образ движения «вслед за собой» и яснее современному читателю, чем специальный глагол «подбирать» без пояснения.
- source_word: לַגֵּר
  choice: живущему среди вас чужеземцу
  rationale: גֵּר — не просто приезжий или любой иностранец, а чужеземец, постоянно живущий среди израильского общества; описательный перевод передаёт этот социально-правовой оттенок.
- source_word: לַיָּתוֹם
  choice: сироте
  rationale: Русское «сирота» естественно передаёт יָתוֹם; примечание сохраняет возможный более буквальный оттенок «оставшийся без отца».
- source_word: וְלָאַלְמָנָה
  choice: и вдове
  rationale: Прямой и естественный эквивалент אַלְמָנָה.
- source_word: יִהְיֶה
  choice: оно должно достаться
  rationale: В правовом контексте форма выражает предназначение оставшегося винограда указанным уязвимым людям; «должно достаться» естественно передаёт этот смысл.
theological_decisions:
- issue: Кому предназначен оставшийся виноград
  choice: «оно должно достаться» указанным людям
  alternative: «пусть оно останется» для них
  rationale: Еврейское יִהְיֶה буквально допускает «будет», но в контексте закона указывает на предназначение продукта. Перевод не уточняет сверх текста ни форму собственности, ни способ его получения.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой. Обращение сохранено в единственном числе, как в еврейском тексте. Описательное обозначение גֵּר предпочтено архаичному «пришелец» и неоднозначному «переселенец».
