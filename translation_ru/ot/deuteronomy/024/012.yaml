  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: ru
  text: А если этот человек беден, не ложись спать, оставив у себя его залог[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не ложись с его залогом», то есть не оставляй на ночь у себя вещь, отданную в обеспечение долга.'
    reason: Сохраняет буквальную формулировку еврейского текста и поясняет её юридический смысл.
lexical_decisions:
- source_word: וְאִם
  choice: А если
  rationale: Передаёт и соединительную силу ו, и условное продолжение предписания из предыдущего стиха; по-русски звучит естественно.
- source_word: אִישׁ עָנִי הוּא
  choice: этот человек беден
  rationale: אִישׁ обозначает конкретного мужчину из контекста, но в русском «этот человек» естественно отсылает к должнику; הוּא поддерживает указательно-эмфатический оттенок, переданный словом «этот».
- source_word: לֹא תִשְׁכַּב
  choice: не ложись спать
  rationale: Сохраняет буквальный образ глагола שׁכב и одновременно ясно указывает на удержание залога на ночь.
- source_word: בַּעֲבֹטוֹ
  choice: оставив у себя его залог
  rationale: 'עֲבוֹט — вещь, взятая в обеспечение долга. Контекстуальное «оставив у себя» раскрывает значение предлога ב: нельзя проводить ночь, продолжая удерживать залог.'
