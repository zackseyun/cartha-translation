base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: ru
  text: Если мужчина возьмёт женщину в жёны и станет её мужем, и случится, что она не найдёт благосклонности в его глазах, потому что он обнаружит в ней что-либо непристойное[a], и он напишет ей свидетельство о разводе, вложит его ей в руку и отошлёт её из своего дома,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дело непристойности» или «нечто постыдное». Еврейское словосочетание намеренно неоднозначно и допускает разные толкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном контексте вводит условие казуистического закона, а не причинное придаточное предложение.
- source_word: יִקַּח אִישׁ אִשָּׁה וּבְעָלָהּ
  choice: мужчина возьмёт женщину в жёны и станет её мужем
  rationale: Сохраняет два элемента еврейского выражения — взятие женщины в жёны и вступление с ней в брачные отношения — без неуместного оттенка обладания.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: она не найдёт благосклонности в его глазах
  rationale: Передаёт конкретную еврейскую идиому в понятной и достойной современной русской форме.
- source_word: עֶרְוַת דָּבָר
  choice: что-либо непристойное
  rationale: Сохраняет неопределённость спорного выражения и не сводит его значение к одному конкретному проступку.
- source_word: סֵפֶר כְּרִיתֻת
  choice: разводное свидетельство
  rationale: Ясно обозначает официальный документ о расторжении брака и естественно звучит по-русски.
- source_word: וְנָתַן בְּיָדָהּ
  choice: даст его ей в руки
  rationale: Сохраняет конкретный процедурный акт вручения документа.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: отошлёт её из своего дома
  rationale: Передаёт как удаление женщины из дома, так и юридический смысл её отпущения.
theological_decisions:
- issue: Следует ли понимать стих как повеление разводиться или как начало условия казуистического закона
  choice: Стих оформлен как условная правовая ситуация, синтаксически продолжающаяся в следующих стихах.
  alternative: Передать действия как разрешение или предписание развода при названном условии.
  rationale: Еврейский синтаксис Втор 24:1–4 образует протасис, а собственно правовое постановление появляется позднее; поэтому перевод не представляет развод как данное здесь повеление.
- issue: Конкретное содержание выражения עֶרְוַת דָּבָר
  choice: 'Оставить основание развода неопределённым: «что-либо непристойное».'
  alternative: Уточнить его как супружескую неверность, наготу либо иной определённый сексуальный проступок.
  rationale: Само еврейское выражение допускает более одного толкования; конкретизация устранила бы подлинную лексическую и богословско-правовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным правовым оттенком. Сохранена протяжённая условная конструкция, поскольку стих является лишь началом казуистического постановления; конечная запятая показывает его синтаксическую незавершённость.
