  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: ru
  text: и второй муж возненавидит её[a], напишет ей разводное свидетельство[b], даст ей его в руки и отошлёт её из своего дома; или если умрёт второй муж, взявший её себе в жёны[c], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станет ненавидеть её». Еврейская форма может обозначать наступление такого отношения в последовательности описываемых событий.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «документ отсечения», то есть официальный письменный документ о расторжении брака.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское выражение «взять её себе в жёны» означает жениться на ней.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: возненавидит её
  rationale: Глагол שׂנא сохраняет сильное значение «ненавидеть»; форма в последовательности условий естественно передаётся русским будущим совершенного вида.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: второй муж
  rationale: Буквально «последующий/второй мужчина»; в данном брачном казусе «второй муж» ясно выражает контраст с первым и естественно звучит по-русски.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: напишет ей разводное свидетельство
  rationale: Сочетание обозначает официальный письменный документ о расторжении брака; «разводное свидетельство» понятно современному читателю и сохраняет юридический характер.
- source_word: וְנָתַן בְּיָדָהּ
  choice: даст его ей в руки
  rationale: Сохранено конкретное процедурное действие и явная отсылка к документу.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: отошлёт её из своего дома
  rationale: Передаёт как действие удаления, так и пространственное выражение «из его дома», без добавочной интерпретации.
- source_word: אוֹ כִי יָמוּת
  choice: или если ... умрёт
  rationale: Оборот вводит альтернативное условие в правовом случае; русское «или если» точно сохраняет структуру.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: взявший её себе в жёны
  rationale: Сохранена прозрачность еврейской брачной идиомы לקח + ל + אשה, при этом выражение остаётся естественным для литературного русского.
