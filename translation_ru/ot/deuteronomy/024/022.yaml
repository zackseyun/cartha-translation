lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: И помни
  rationale: Форма перфекта с союзом в данном законодательном контексте имеет повелительно-увещевательную силу; союз сохраняет связь с предшествующим установлением.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что следует помнить.
- source_word: עֶבֶד
  choice: рабом
  rationale: В контексте Египта слово обозначает несвободное, рабское положение, а не обычную службу.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохраняет конкретную форму еврейского выражения и его библейскую торжественность, оставаясь понятным современному читателю.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: 'Передаёт логический вывод: прежнее рабство Израиля служит основанием нынешнего повеления.'
- source_word: אָנֹכִי מְצַוְּךָ
  choice: Я повелеваю тебе
  rationale: Самостоятельное местоимение передано прописным «Я» в прямой речи Бога, а причастие — естественным русским настоящим временем с актуальной силой повеления.
- source_word: לַעֲשׂוֹת
  choice: исполнять
  rationale: В сочетании с предписанием русский глагол «исполнять» естественно выражает практическое выполнение заповеданного, не добавляя специального обрядового смысла.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: это предписание
  rationale: דבר широко означает «слово, дело, вопрос»; здесь оно указывает на предшествующее законодательное требование. «Предписание» передаёт референт естественнее, чем буквальное «эту вещь», не ограничивая его до отдельной формулы приказа.
theological_decisions:
- issue: Основание заботы об уязвимых членах общества
  choice: Сохранена прямая причинно-следственная связь между памятью о рабстве в Египте и исполнением предшествующего предписания.
  alternative: Передать вторую часть как независимое повеление без явной логической связи.
  rationale: עַל כֵּן недвусмысленно представляет повеление как следствие упомянутого исторического опыта.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Раб» выбрано вместо смягчающего «слуга»; «земля Египетская» сохраняет исходный образ и достоинство стиля. Маркер сноски помещён сразу после выражения, которое она поясняет.
