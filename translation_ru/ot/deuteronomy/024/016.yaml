  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: ru
  text: Отцы не должны быть преданы смерти за сыновей[a], и сыновья не должны быть преданы смерти за отцов; каждый должен быть предан смерти за свой грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей». В еврейском тексте в обеих частях буквально: «сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: должны быть преданы смерти
  rationale: Порода хофаль глагола מות имеет каузативно-пассивное значение и в данном законодательном контексте указывает не на естественную смерть, а на предание смерти по приговору. Формулировка «преданы смерти» точнее, чем «умрут», и менее интерпретативна, чем «казнены».
- source_word: אָבוֹת
  choice: отцы
  rationale: Существительное прямо обозначает отцов, а не родителей вообще; этот выбор сохраняет конкретную лексику и параллелизм еврейского текста.
- source_word: בָּנִים
  choice: сыновья
  rationale: Буквальное значение — «сыновья». Хотя правовой принцип может охватывать детей вообще, перевод сохраняет мужской род исходного семейного обозначения.
- source_word: עַל
  choice: за
  rationale: В правовом контексте предлог обозначает основание наказания или ответственность за другого; русское «за» естественно и лаконично передаёт этот смысл.
- source_word: אִישׁ
  choice: каждый
  rationale: Слово употреблено дистрибутивно и подчёркивает личную ответственность каждого. В русском «каждый» естественно выражает эту силу без ненужного сужения принципа словом «мужчина».
- source_word: בְּחֶטְאוֹ
  choice: за свой грех
  rationale: Предлог ב в судебном контексте указывает на основание наказания, а местоименное «свой» ясно сохраняет притяжательный суффикс и противопоставляет собственный грех чужому.
theological_decisions:
- issue: Личная ответственность при предании смерти
  choice: Судебное предание смерти допускается за собственный грех виновного, но не за грех отца или сына.
  alternative: Общее утверждение обо всех последствиях греха, переходящих или не переходящих между поколениями.
  rationale: Повторяющаяся каузативно-пассивная форма מות и законодательный контекст говорят именно о предании смерти. Поэтому перевод сохраняет принцип личной ответственности, не распространяя его без текстового основания на все возможные последствия греха.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Конструкция «не должны быть преданы смерти» передаёт нормативное значение и судебный контекст; симметричный параллелизм оригинала сохранён.
