review_pass:
  verdict: approve
  source_fidelity: 'Текст точно передаёт трижды повторённую юридическую форму хофаль от מות как «быть преданными смерти», сохраняет запрет казни отцов за сыновей и сыновей за отцов, а также дистрибутивный принцип личной ответственности: «каждый ... за свой грех». «Отцы» и «сыновья» верно отражают конкретные мужские термины אָבוֹת и בָּנִים, без неоправданного обобщения до «родителей» или «детей».'
  naturalness: Формулировка естественна для современного литературного русского языка и уместно выдержана в сдержанном законодательном регистре. Повтор «не должны быть преданы смерти» сохраняет намеренный параллелизм оригинала, а заключительная фраза ясна и грамматически естественна.
  terminology: «Преданы смерти» удачно передаёт судебно-карательный смысл формы хофаль, не сводя её к естественной смерти и не добавляя более узкий современный термин «казнены». «За свой грех» точно передаёт основание наказания и притяжательный суффикс. Сноска [a] корректно привязана к «сыновей» и верно поясняет возможную русскую лексическую альтернативу, не выдавая её за буквальный смысл оригинала.
