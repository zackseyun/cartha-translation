- from: Отдай ему заработанное в тот же день, прежде чем зайдёт солнце, потому что он беден и от этой платы зависит его жизнь[a]. Иначе он воззовёт к Яхве против тебя, и на тебе будет грех.
  to: Выплати ему плату в тот же день, до захода солнца, потому что он беден и от этой платы зависит его жизнь[a]. Иначе он воззовёт к Яхве против тебя, и это будет тебе грехом.
