base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: ru
  text: Выплати ему плату в тот же день, до захода солнца, потому что он беден и от этой платы зависит его жизнь[a]. Иначе он воззовёт к Яхве против тебя, и это будет тебе грехом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к ней он возносит (или устремляет) свою душу/жизнь». Еврейская идиома выражает насущную зависимость работника от этой платы.'
    reason: Лексическая неоднозначность еврейской идиомы נֹשֵׂא אֶת נַפְשׁוֹ; сноска сохраняет образ исходного текста, не добавляя спекулятивного толкования.
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: в тот же день
  rationale: Буквально «в его день». В контексте закона речь идёт о дне выполненной работы; современное русское выражение ясно передаёт требование немедленной выплаты.
- source_word: שְׂכָרוֹ
  choice: заработанное
  rationale: Слово обозначает причитающуюся наёмному работнику плату. Субстантивированное «заработанное» естественно сочетается с глаголом «отдай» и подчёркивает, что плата уже принадлежит работнику.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: прежде чем зайдёт солнце
  rationale: Еврейская формула буквально говорит, что солнце не должно «зайти над» платой. Русская временная конструкция естественно выражает установленный предел — выплатить до заката.
- source_word: כִּי עָנִי הוּא
  choice: потому что он беден
  rationale: עָנִי здесь указывает на материально уязвимое положение наёмного работника; «беден» передаёт это прямо и понятно.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: и от этой платы зависит его жизнь
  rationale: Буквально идиома говорит, что работник «возносит/устремляет к ней свою жизнь». В данном контексте она выражает жизненную зависимость от своевременной платы; метафора раскрыта в сноске.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Иначе он воззовёт к Яхве против тебя
  rationale: После запрета союз וְלֹא вводит нежелательное последствие. «Воззовёт… против тебя» сохраняет смысл обращения угнетённого к Богу с жалобой на обидчика.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: и на тебе будет грех
  rationale: Формулировка сохраняет образный оборот с предлогом בְּ и не сводит его без необходимости к одному техническому понятию вроде юридической виновности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация позволяет сохранить это различие.
- issue: Смысл выражения וְהָיָה בְךָ חֵטְא
  choice: на тебе будет грех
  alternative: тебе это вменится в грех
  rationale: Выбранный вариант сохраняет краткость и некоторую образную неоднозначность еврейского выражения, не вводя явно отсутствующий в нём глагол «вменять».
translation_notes:
  register: Современный литературный русский язык с ясной повелительной формой и достоинством законодательной речи. Архаизмы сведены к минимуму; «воззовёт» сохранено как понятное возвышенное слово для молитвенного обращения угнетённого к Богу.
