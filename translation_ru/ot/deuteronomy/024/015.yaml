  source_fidelity: 'Смысл в целом передан верно: предписана выплата дневной платы до заката ввиду крайней зависимости бедного работника от неё; сохраняются обращение к Яхве и следствие в виде греха. Однако «заработанное» менее точно, чем «плата/заработок», поскольку שָׂכָר обозначает причитающееся вознаграждение. Сноска содержит не вполне обоснованное расширение («все его надежды») и слишком буквально трактует נֶפֶשׁ как «жизнь» в самой цитате.'
