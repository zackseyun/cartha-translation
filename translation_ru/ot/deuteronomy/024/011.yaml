  yaml_path: translation/ot/deuteronomy/024/011.yaml
  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: ru
  text: Стой снаружи, а человек, которому ты даёшь взаймы[a], вынесет тебе залог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который тебе должен». Еврейский оборот может подчёркивать либо то, что кредитор даёт взаймы, либо то, что должник находится у него в долгу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: снаружи
  rationale: Сочетание предлога с существительным обозначает место вне дома. «Снаружи» естественно передаёт требование кредитору не входить в жилище должника.
- source_word: תַּעֲמֹד
  choice: стой
  rationale: Глагол עמד имеет основное значение «стоять». В юридическом предписании форма повелительного наклонения по-русски ясно передаёт обязательный характер нормы и сохраняет конкретный физический образ.
- source_word: וְהָאִישׁ
  choice: а человек
  rationale: 'איש обозначает человека, здесь — должника. Союз «а» естественно выражает противопоставление действий: кредитор остаётся снаружи, должник сам выносит залог.'
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: которому ты даёшь взаймы
  rationale: Оборот с נשה описывает отношение кредитора к должнику и может акцентировать как предоставление займа, так и состояние задолженности. Основной текст передаёт взгляд со стороны кредитора, а альтернативный оттенок сохранён в сноске.
- source_word: יוֹצִיא
  choice: вынесет
  rationale: Порода хифиль глагола יצא означает «заставить выйти», то есть «вынести». Русский глагол одновременно передаёт действие и направленность из дома наружу.
- source_word: אֵלֶיךָ
  choice: тебе
  rationale: Предлог указывает направление к кредитору; дательный падеж естественно выражает это по-русски.
- source_word: הָעֲבוֹט
  choice: залог
  rationale: עבוט — вещь, служащая обеспечением займа. «Залог» является ясным и уместным юридическим термином без излишне современного коммерческого оттенка.
- source_word: הַחוּצָה
  choice: передано приставкой вы- в слове «вынесет»
  rationale: Направительная форма означает движение наружу. По-русски это значение естественно выражено глагольной приставкой, что позволяет избежать тяжёлого повтора «снаружи… наружу».
