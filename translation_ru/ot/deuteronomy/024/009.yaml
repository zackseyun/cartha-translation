  text: זָכ֕וֹר אֵ֧ת אֲשֶׁר עָשָׂ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/מִרְיָ֑ם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: ru
  text: Помни, что сделал Яхве, твой Бог, с Мариам по дороге, когда вы выходили из Египта.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Яхве, твой Бог, сделал Мариам».'
    reason: Альтернативная более прямая передача лица, затронутого действием; основной текст сохраняет нейтральную формулу «с Мариам».
  - marker: b
    text: То есть во время пути Израиля после исхода; см. Числа 12:1–15.
    reason: Контекстуальная перекрёстная ссылка поясняет, о каком событии идёт речь.
lexical_decisions:
- source_word: זָכוֹר
  choice: Помни
  rationale: Форма Qal, повелительное наклонение, 2-е лицо единственного числа; прямое повеление помнить. «Помни» естественно и сохраняет заветную значимость воспоминания.
- source_word: אֵת אֲשֶׁר
  choice: что
  rationale: 'Показатель прямого дополнения с относительной частицей вводит содержание воспоминания: «что сделал».'
- source_word: עָשָׂה
  choice: сделал
  rationale: Обычное значение глагола עשה; здесь речь о действии Яхве по отношению к Мариам, без уточнения характера действия в самом стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяется титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом 2-го лица единственного числа; сохранено прямое заветное обращение.
- source_word: לְמִרְיָם
  choice: с Мариам
  rationale: Предлог ל при עשה обозначает лицо, которого коснулось действие. Русское «что сделал с Мариам» естественно и не конкретизирует сверх текста, было ли действие направлено «против» неё.
- source_word: בַּדֶּרֶךְ
  choice: по дороге
  rationale: Буквально «на пути»; «по дороге» естественно обозначает происходившее во время пути Израиля.
- source_word: בְּצֵאתְכֶם
  choice: когда вы выходили
  rationale: Инфинитивная конструкция с временным значением и суффиксом 2-го лица множественного числа; несовершенный вид передаёт процесс выхода.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог מן выражает исходную точку движения; нормативное русское сочетание — «выходили из Египта».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Характер действия Бога по отношению к Мариам
  choice: что сделал… с Мариам
  alternative: что сделал… Мариам / против Мариам
  rationale: Формулировка сохраняет неопределённость предлога ל и не вносит в основной текст явной оценки действия; контекст раскрывается ссылкой на Числа 12:1–15.
translation_notes:
  register: Современный литературный русский язык; обращение в единственном числе («Помни», «твой») сохранено, тогда как участники исхода обозначены множественным числом («вы выходили»). Тон прямой, торжественный и понятный.
