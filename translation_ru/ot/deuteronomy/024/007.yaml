  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: ru
  text: Если обнаружится, что человек похитил одного из своих братьев, из сынов Израиля[a], поработил его[b] и продал, то этот похититель должен быть предан смерти. Искорени зло из своей среды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» здесь — собратья по народу Израиля, а не только родные братья.
    reason: cultural_note
  - marker: b
    text: 'Или: «обращался с ним как с собственностью»; еврейский глагол может обозначать порабощение или эксплуатацию похищенного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא
  choice: если обнаружится
  rationale: Нифаль глагола מצא имеет пассивное значение «быть найденным, обнаружиться»; такая формулировка естественно передаёт условие в правовом тексте.
- source_word: אִישׁ
  choice: человек
  rationale: В данном правовом предписании мужская форма обозначает лицо, совершившее преступление; русское «человек» сохраняет единственное число и звучит естественнее, чем подчеркнуто гендерное «мужчина».
- source_word: גֹּנֵב נֶפֶשׁ
  choice: похитил одного
  rationale: Буквально выражение означает «украл человека (душу)» и в контексте обозначает похищение человека. Глагол «похитил» точно и ясно передаёт правовой смысл.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: одного из своих братьев — кого-либо из сынов Израиля
  rationale: Сохраняется семейно-заветное обозначение «братья», а поясняющее приложение показывает, что речь идёт о соплеменнике-израильтянине, а не только о родном брате.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: поработил его
  rationale: В данном контексте глагол описывает обращение с похищенным как с собственностью или рабом. «Поработил» кратко и ясно передаёт этот смысл, при этом возможный более широкий оттенок отмечен в сноске.
- source_word: וּמְכָרוֹ
  choice: и продал
  rationale: Прямо передаёт глагол מכר с местоименным дополнением; объект без двусмысленности восстанавливается из предыдущей части фразы.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: то этот похититель должен быть предан смерти
  rationale: Еврейское «и тот похититель умрёт» в законодательном контексте выражает смертный приговор. Пассивная русская формула передаёт юридическую силу предписания.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Искорени зло из своей среды
  rationale: Устойчивая формула Второзакония требует устранить зло из общины; «искорени» сохраняет решительность повеления и естественно звучит по-русски.
theological_decisions:
- issue: Заветное родство в правовом тексте
  choice: 'Сохранить «одного из своих братьев» и пояснить: «кого-либо из сынов Израиля».'
  alternative: «одного из своих соплеменников-израильтян»
  rationale: Так сохраняется подлинная семейная образность אָח и одновременно ясно обозначается общенациональный охват нормы без сведения слова «брат» только к кровному родству.
- issue: Характер обращения с похищенным человеком
  choice: «поработил его»
  alternative: «обращался с ним как с собственностью» / «использовал его в своих интересах»
  rationale: Контекст продажи поддерживает значение порабощения, однако редкий глагол допускает оттенок эксплуатации или обращения как с имуществом; эта неоднозначность сохранена в сноске.
- issue: Сила формулы смертной казни
  choice: «должен быть предан смерти»
  alternative: «умрёт»
  rationale: В контексте закона форма וּמֵת предписывает наказание, а не просто предсказывает естественную смерть; русская юридическая формула выражает это без добавления способа казни.
translation_notes:
  register: Современный литературный русский язык с ясным и строгим правовым звучанием. Синтаксис сохраняет последовательность состава преступления и наказания; архаизмы сведены к минимуму, а повторяющаяся формула Второзакония передана торжественно и кратко.
