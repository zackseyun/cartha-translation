  source_fidelity: 'Смысл состава преступления и наказания передан точно: похищение соплеменника-израильтянина, обращение с ним как с зависимым/собственностью, продажа и смертная казнь. «Должен быть предан смерти» уместно передаёт юридическую силу וּמֵת. Однако приложение «кого-либо из сынов Израиля» после «одного из своих братьев» синтаксически и стилистически тяжеловесно; оно также неопределённее, чем исходное уточнение принадлежности похищенного к Израилю.'
