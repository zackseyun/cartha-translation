base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: ru
  text: И помни, что ты был рабом в Египте и что Яхве, твой Бог, выкупил тебя оттуда. Поэтому Я повелеваю тебе поступать так.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: И помни
  rationale: Форма с союзом в данном законодательном контексте имеет побудительную силу; «И помни» сохраняет простую связь с предыдущим предписанием.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что следует помнить, а не только причинное обоснование.
- source_word: עֶבֶד
  choice: рабом
  rationale: В контексте египетского порабощения слово обозначает несвободный, рабский статус; «слугой» неоправданно ослабило бы смысл.
- source_word: וַיִּפְדְּךָ
  choice: выкупил тебя
  rationale: Глагол פדה выражает освобождение посредством выкупа; «выкупил» сохраняет конкретный образ и богословскую насыщенность исходного слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Естественно и точно отсылает к Египту.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: 'Ясно передаёт вывод: пережитое Израилем искупление становится основанием для исполнения предписания.'
- source_word: אָנֹכִי מְצַוְּךָ
  choice: я повелеваю тебе
  rationale: Эксплицированное местоимение и причастная конструкция подчёркивают действующее повеление; современное русское настоящее время передаёт это естественно.
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: поступать так
  rationale: Выражение отсылает к непосредственно предшествующему установлению; «поступать так» естественно по-русски и не добавляет нового содержания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Статус Израиля, выраженный словом עֶבֶד
  choice: рабом
  alternative: слугой
  rationale: Египетский контекст подчёркивает принудительную несвободу; перевод «рабом» сохраняет этическую силу напоминания.
- issue: Смысл פדה
  choice: выкупил
  alternative: искупил; освободил
  rationale: «Выкупил» сохраняет образ избавления из рабской зависимости, не сводя слово лишь к общему освобождению и не ограничивая его позднейшим богословским употреблением.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный без архаизмов. Единственное число «ты» сохранено как обращение к Израилю. Повтор «что» добавлен ради ясной русской синтаксической связи двух предметов памяти; содержание исходника не расширено.
