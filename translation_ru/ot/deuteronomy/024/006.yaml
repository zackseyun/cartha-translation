review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: запрет касается взятия в залог ручной мельницы (пары жерновов) либо её верхнего жернова, поскольку этим фактически отнимается жизненно необходимое средство. Однако «ни оба жернова» может быть прочитано как запрет взять именно оба камня вместе, а не мельницу как предмет; более точное «ни ручную мельницу» сохраняет собирательное значение רֵחַיִם.'
  naturalness: Фраза «это всё равно что брать в залог жизнь» понятна, но несколько пояснительна и ослабляет краткую, категоричную формулу оригинала. «Ибо он берёт в залог саму жизнь» естественнее, лаконичнее и сохраняет повтор глагола.
  terminology: «Ручная мельница» — обычное современное обозначение мельничного устройства из двух жерновов; «верхний жернов» точно передаёт רָכֶב. «Жизнь» уместно передаёт נֶפֶשׁ в данном социально-правовом контексте; сноска корректно отмечает возможный оттенок «средства к жизни».
