  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: ru
  text: Нельзя брать в залог ни ручную мельницу, ни даже верхний жернов, ибо он берёт в залог саму жизнь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «средства к жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: брать в залог
  rationale: В данном правовом контексте глагол חבל означает брать имущество как обеспечение долга. Повтор одного и того же русского выражения сохраняет повтор в еврейском тексте.
- source_word: רֵחַיִם
  choice: оба жернова
  rationale: Двойственное число обозначает пару жерновов, то есть мельничное устройство в целом. Формулировка «оба жернова» ясно передаёт это обычному современному читателю.
- source_word: וָרָכֶב
  choice: ни даже верхний жернов
  rationale: 'רָכֶב здесь обозначает верхний, подвижный жернов. «Ни даже» естественно выражает юридический смысл: запрещено брать не только всю пару, но и один необходимый для работы жернов.'
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание запрета; «ведь» кратко и естественно связывает норму с её нравственным обоснованием.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В этом контексте נֶפֶשׁ означает конкретную человеческую жизнь, поддерживаемую ежедневным пропитанием, а не бесплотную «душу». Лишение жерновов угрожает самой возможности жить.
- source_word: הוּא
  choice: это всё равно что
  rationale: 'Местоимение указывает на смысл поступка берущего залог. Такая передача делает русскую фразу ясной, не меняя утверждения: залог жизненно необходимого орудия приравнивается к залогу жизни.'
theological_decisions:
- issue: Значение נֶפֶשׁ в правовом и социальном контексте
  choice: конкретная жизнь человека
  alternative: средства к жизни; душа; человек
  rationale: Речь идёт о залоге, лишающем должника возможности готовить ежедневную пищу. Поэтому закон представляет такой поступок как угрозу самой жизни. В сноске сохранён возможный смысловой оттенок «средства к жизни».
translation_notes:
  register: Современный литературный русский язык с краткой, достойной юридической формулировкой. Безличное «нельзя» естественно передаёт общий запрет; слова «оба жернова» понятнее специального обозначения ручной мельницы и сохраняют образ исходного текста.
