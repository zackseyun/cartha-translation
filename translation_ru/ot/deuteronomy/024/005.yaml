  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: ru
  text: Когда мужчина недавно женился[a], он не должен выступать с войском[b], и на него нельзя возлагать никакой обязанности[c]. Один год он должен быть свободен для своего дома[d] и радовать жену, на которой женился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возьмёт новую жену». Имеется в виду мужчина, недавно вступивший в брак.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не должен отправляться на войну». Еврейское выражение буквально говорит о выходе с войском и может охватывать военную службу шире, чем непосредственное участие в бою.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ему нельзя поручать никакого дела». Еврейская формулировка может обозначать любую возлагаемую на него служебную обязанность, а не только воинскую повинность.'
    reason: alternative_reading
  - marker: d
    text: 'Или: «должен быть освобождён и оставаться дома». Еврейское выражение может подчёркивать как освобождение от обязанностей ради семьи, так и пребывание со своими домашними.'
    reason: lexical_alternative
