  rationale: Вводит обычный случай в формулировке закона; «когда» естественно передаёт предполагаемую ситуацию, не превращая её в чисто гипотетическую.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: мужчина женится
  rationale: Сочетание לָקַח с אִשָּׁה означает вступление в брак. Такая передача естественна по-русски; буквальный образ «возьмёт новую жену» отмечен в сноске, поскольку חֲדָשָׁה указывает на недавнее заключение брака.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: не должен выходить с войском
  rationale: Сохраняет еврейский образ выхода с войском и не сужает значение до непосредственного участия в бою.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: на него нельзя возлагать никакой повинности
  rationale: Передаёт юридический смысл запрета налагать на человека служебную обязанность; דָּבָר здесь допускает более широкое понимание, чем только военная служба.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ
  choice: он должен быть свободен для своего дома
  rationale: נָקִי означает свободу от обязанностей или освобождение от них, а בַּיִת может обозначать дом и домочадцев. Формулировка сохраняет направленность освобождения на семейную жизнь.
- source_word: שָׁנָה אֶחָת
  choice: один год
  rationale: Прямо передаёт установленную законом продолжительность.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ אֲשֶׁר לָקָח
  choice: и радовать жену, на которой женился
  rationale: Порода piel глагола שׂמח имеет причинительное значение — доставлять радость, делать радостным. Повтор לָקַח передан повтором русского глагола «жениться», что сохраняет связь с началом стиха без неестественного «жену, которую взял».
