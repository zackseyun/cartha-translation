base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: ru
  text: Я же оставался на горе, как и в первый раз, сорок дней и сорок ночей. И Яхве услышал меня[a] и на этот раз; Яхве не захотел уничтожить вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внял мне». Еврейский глагол может обозначать как то, что кто-либо услышал, так и то, что он благосклонно выслушал и откликнулся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Я же
  rationale: Самостоятельное местоимение с союзом придаёт теме умеренное выделение и возобновляет рассказ; «Я же» естественно передаёт этот оттенок по-русски.
- source_word: עָמַדְתִּי
  choice: оставался
  rationale: Хотя основное значение глагола — «стоять», при указании на сорок дней и ночей он обозначает длительное пребывание, поэтому «оставался» точнее передаёт смысл в современном русском.
- source_word: בָהָר
  choice: на горе
  rationale: Нормальное русское обозначение местонахождения Моисея на Синае/Хориве.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: как и в первый раз
  rationale: Буквально фраза говорит о «первых днях», но в контексте сопоставляет это сорокадневное пребывание с первым таким пребыванием; выбранная формулировка ясна и естественна.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: сорок дней и сорок ночей
  rationale: Точное и традиционно понятное воспроизведение формулы продолжительности.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Яхве услышал меня
  rationale: שׁמע с אֶל может означать как «услышать», так и «благосклонно выслушать». «Услышал меня» естественно по-русски и сохраняет возможность подразумеваемого благоприятного ответа, отмеченную в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: и на этот раз
  rationale: Передаёт повторность благоприятного отклика и естественно связывает событие с прежним случаем.
- source_word: לֹא אָבָה
  choice: не захотел
  rationale: Сохраняет волевой оттенок глагола — отсутствие желания или согласия совершить действие.
- source_word: הַשְׁחִיתֶךָ
  choice: уничтожить вас
  rationale: Каузативная форма в контексте угрозы судом означает уничтожение Израиля; единственное собирательное «тебя» естественно передаётся обращением ко всему народу во множественном числе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Оттенок וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Яхве услышал меня
  alternative: Яхве внял мне
  rationale: «Услышал» сохраняет лексическую широту между самим слышанием и благосклонным откликом, тогда как «внял» однозначнее подчёркивает удовлетворение просьбы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Длинное еврейское предложение разделено на два для ясности; двоеточие перед последней частью показывает содержание благоприятного ответа, не превращая эту связь в отдельное догматическое утверждение.
