  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: ru
  text: 'И Яхве сказал мне: «Встань и отправляйся в путь впереди народа, чтобы они вошли и овладели землёй, которую Я поклялся отдать их отцам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть праотцам, предкам.
    reason: Уточняет, что «отцы» обозначают прежние поколения Израиля, прежде всего патриархов.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога в принятой современной русской транслитерации, не заменяя его титулом.
- source_word: קוּם לֵךְ לְמַסַּע לִפְנֵי הָעָם
  choice: Встань и отправляйся в путь впереди народа
  rationale: Сохраняет последовательность повелений и значение מַסַּע как пути или перехода; «впереди народа» естественно передаёт пространственный смысл לִפְנֵי, не исключая оттенка предводительства.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: чтобы они вошли и овладели
  rationale: Связь с предшествующим повелением естественно выражена целью; ירשׁ здесь обозначает вступление во владение землёй.
- source_word: הָאָרֶץ
  choice: землёй
  rationale: В контексте Второзакония речь идёт об обещанной Израилю земле; определённость понятна из контекста и придаточного предложения.
- source_word: נִשְׁבַּעְתִּי ... לָתֵת לָהֶם
  choice: Я поклялся отдать
  rationale: Сохраняет язык божественной клятвы и естественно передаёт инфинитив цели לָתֵת по-русски.
- source_word: לַאֲבֹתָם
  choice: их отцам
  rationale: Сохраняет конкретное мужское родовое обозначение אָבוֹת, относящееся здесь к праотцам Израиля.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя, а не титул; «Яхве» является наиболее распространённой научно обоснованной русской передачей предполагаемого произношения.
- issue: Значение לַאֲבֹתָם
  choice: их отцам
  alternative: их предкам; их праотцам
  rationale: Буквальное «отцам» сохраняет патриархальную и заветную конкретику выражения, а сноска разъясняет его родовое значение.
- issue: Связь וְיָבֹאוּ וְיִרְשׁוּ с повелением
  choice: чтобы они вошли и овладели
  alternative: и пусть они войдут и овладеют
  rationale: Формы с וְ после повеления допускают оттенок цели или результата; контекст лучше всего передаётся целевым оборотом, без превращения слов в отдельное прямое повеление народу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формула «встань и отправляйся в путь» ясна обычному читателю и сохраняет ритм двух еврейских императивов; архаизмы и конфессионально маркированные замены имени יהוה не используются.
