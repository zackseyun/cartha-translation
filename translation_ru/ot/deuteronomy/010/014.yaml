base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: ru
  text: Вот Яхве, твоему Богу, принадлежат небеса и небеса небес[a], земля и всё, что в ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «небеса и небеса небес»; это выражение означает высочайшие небеса.'
    reason: Сноска поясняет еврейскую усилительную конструкцию, формально сохранённую в основном тексте.
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и придаёт высказыванию торжественную выразительность; «вот» естественно сохраняет эту функцию в современном литературном русском.
- source_word: לַיהוָה
  choice: Яхве ... принадлежат
  rationale: Предлог לְ выражает здесь принадлежность; добавленный по нормам русского синтаксиса глагол «принадлежат» ясно передаёт посессивную конструкцию.
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: Сохраняет обращение во втором лице единственного числа и заветное отношение, не добавляя отсутствующих в оригинале смыслов.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמָיִם
  choice: небеса и небеса небес
  rationale: Формально передаёт оба элемента еврейской усилительной конструкции и сохраняет её возвышенный характер и образность; значение «высочайшие небеса» поясняется сноской.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В параллели с небесами и в сочетании со всем находящимся на ней слово имеет космический, а не территориальный смысл.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: и всё, что на ней
  rationale: Русское «на ней» естественно описывает всё находящееся на земле, тогда как буквальное «в ней» могло бы неоправданно сузить смысл до земных недр.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Сохранены прямое обращение «твоему Богу», личное имя Яхве и выразительная еврейская конструкция «небеса небес».
