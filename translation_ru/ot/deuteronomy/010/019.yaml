  text: Поэтому любите чужеземца[a], ведь вы были чужеземцами в земле Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселенца», «пришельца». Еврейское слово гер обозначает человека не из местного населения, живущего среди израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲהַבְתֶּם
  choice: Поэтому любите
  rationale: Форма с союзом продолжает мысль ст. 18, где говорится о Божьей любви к переселенцу. «Поэтому» передаёт логическую связь, а «любите» — силу повеления в естественном современном русском языке.
- source_word: הַגֵּר
  choice: переселенца
  rationale: גֵּר обозначает человека не из местного населения, который живёт среди Израиля и находится в уязвимом общественном положении, а не просто проезжего путника. «Переселенец» понятно передаёт длительное проживание вне родной среды, не вводя современную юридическую категорию.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание повеления. «Ведь» естественно связывает заповедь с историческим опытом Израиля; возможно также более прямое «потому что».
- source_word: גֵרִים
  choice: переселенцами
  rationale: 'Повтор того же русского корня сохраняет лексическую связь с הַגֵּר и подчёркивает: любовь к переселенцу основана на собственном опыте Израиля.'
- source_word: הֱיִיתֶם
  choice: вы были
  rationale: 'Здесь היה имеет простое значение состояния в прошлом: израильтяне жили в Египте как переселенцы.'
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохраняется существительное אֶרֶץ («земля»). Устойчивое русское библейское выражение остаётся понятным и звучит достоинственно.
theological_decisions:
- issue: Социальное значение термина גֵּר в законодательстве завета
  choice: переселенец
  alternative: чужеземец; пришелец; постоянно живущий иноземец
  rationale: Текст связывает нравственную обязанность Израиля с его собственным опытом жизни вне родной земли. «Переселенец» передаёт положение неместного жителя и его социальную уязвимость, не сводя смысл к незнакомцу или временному путешественнику и не импортируя современный правовой статус.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Лексический повтор «переселенца — переселенцами» намеренно сохраняет риторическую связь оригинала; обращение во множественном числе передаёт адресованную Израилю заповедь.
