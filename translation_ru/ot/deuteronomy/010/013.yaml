source:
  edition: WLC
  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: ru
  text: соблюдать[a] заповеди Яхве и его постановления, которые я заповедую тебе сегодня для твоего блага?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнять»; буквальнее: «хранить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: соблюдать
  rationale: Инфинитив с לְ продолжает перечисление того, чего Яхве требует в предыдущем стихе. «Соблюдать» естественно передаёт практическое исполнение заповедей и сохраняет за еврейским глаголом оттенки повиновения и бережного хранения.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: Форма множественного числа в сопряжённом состоянии обозначает предписанные Яхве обязательства; «заповеди» сохраняет правовой и заветный регистр Второзакония.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: חֻקֹּתָיו
  choice: его постановления
  rationale: Слово обозначает установленные предписания; «постановления» ясно передаёт правовой смысл и естественно сочетается с «заповедями».
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я заповедую тебе сегодня
  rationale: Относительное предложение отнесено к обоим предшествующим существительным. Настоящее время сохраняет непосредственность Моисеева обращения, а «сегодня» — характерный для Второзакония момент обновления заветных требований.
- source_word: לְטוֹב לָךְ
  choice: для твоего блага
  rationale: Оборот выражает благую цель или результат для адресата; выбранная формулировка кратка, естественна и не уточняет сверх текста, идёт ли речь преимущественно о пользе, благополучии или добре.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией «Яхве», а не заменено титулом.
- issue: Связь выражения לְטוֹב לָךְ с повелениями
  choice: «для твоего блага» оставлено как указание на благую цель или результат всех предписаний
  alternative: «тебе во благо»; «для твоего благополучия»
  rationale: Формулировка сохраняет богословски значимое утверждение, что повеления даны на благо Израилю, не сужая многозначное טוֹב до материального благополучия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранён вопросительный знак, поскольку стих синтаксически завершает вопрос, начатый в предыдущем стихе. Запятая перед «для твоего блага» не ставится, чтобы не отделять тесно связанное обстоятельство цели.
