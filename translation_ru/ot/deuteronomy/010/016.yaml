    reason: lexical_alternative
  - marker: b
    text: Еврейский текст буквально сохраняет метафору «крайняя плоть вашего сердца» — образ устранения внутреннего сопротивления Богу.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «не делайте больше свою шею жёсткой». Или: «не будьте больше жестоковыйны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Итак, обрежьте
  rationale: Форма с союзом в данном увещевательном контексте передаёт повеление, вытекающее из предшествующих слов. «Итак» естественно выражает этот вывод; возможное простое соединительное значение отмечено в сноске.
- source_word: עָרְלַת לְבַבְכֶם
  choice: крайнюю плоть вашего сердца
  rationale: Сохранена конкретная еврейская метафора и её заветная образность, без сведения выражения к толкованию вроде «очистите сердце» или «избавьтесь от упрямства».
- source_word: לְבַבְכֶם
  choice: вашего сердца
  rationale: «Сердце» — естественный русский эквивалент לֵבָב, обозначающего внутреннего человека, включая волю и разум; он также сохраняет исходную метафору.
- source_word: וְעָרְפְּכֶם
  choice: свою шею
  rationale: עֹרֶף буквально обозначает шею или затылок. Выбор сохраняет телесный образ еврейской идиомы.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: больше не ожесточайте
  rationale: Форма Hiphil от קשׁה означает «делать жёстким, твёрдым». В сочетании с «шеей» глагол «ожесточать» сохраняет образ, а «больше не» естественно передаёт עוֹד в запрете.
theological_decisions:
- issue: Метафорический язык внутреннего обрезания в контексте завета
  choice: 'Сохранить буквально: «обрежьте крайнюю плоть вашего сердца»'
  alternative: «Очистите свои сердца»; «удалите упрямство из своих сердец»
  rationale: Буквальная метафора удерживает связь между внешним знаком завета и внутренним нравственным откликом, не подменяя текст более узким богословским истолкованием.
- issue: Образ ожесточённой шеи как обозначение упрямства
  choice: 'Сохранить образ: «не ожесточайте свою шею»'
  alternative: «Не упрямьтесь больше»; «не будьте больше жестоковыйны»
  rationale: Так сохраняется телесная метафора оригинала. Значение идиомы поясняется в сноске, а архаичное «жестоковыйны» не вводится в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением двух намеренно резких телесных метафор оригинала. «Итак» передаёт вероятную логическую связь с контекстом; неоднозначность союза вынесена в сноску. Архаизм «жестоковыйны» оставлен только как переводческая альтернатива.
