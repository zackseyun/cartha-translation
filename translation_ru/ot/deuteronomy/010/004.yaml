  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: ru
  text: Он написал на скрижалях, как при первом написании, Десять слов[a], которые Яхве сказал вам на горе из среды огня в день собрания, и Яхве дал их мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Десять заповедей». Буквально по-еврейски: «десять слов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Он написал
  rationale: Форма wayyiqtol, 3-е лицо мужского рода единственного числа, продолжает повествование о прошлом. «Написал» естественно передаёт כתב и сохраняет связь с упоминанием первого написания.
- source_word: הַלֻּחֹת
  choice: на скрижалях
  rationale: В данном контексте לֻחֹת — таблички завета. Русское «скрижали» — понятное и устойчивое обозначение именно этих каменных табличек; слово «каменных» в этом стихе прямо не выражено.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: так же как в первый раз
  rationale: Передаёт сравнительную силу כ и смысл первоначального написания естественным современным русским языком, не делая фразу тяжеловесной.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Десять слов
  rationale: Буквальное значение выражения — «десять слов». Прописная буква отмечает устойчивое название заветного свода, а традиционный вариант вынесен в сноску.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: которые Яхве сказал вам
  rationale: Прямо и естественно передаёт содержание ранее произнесённых слов без добавления толкования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בָּהָר
  choice: на горе
  rationale: Обычный русский эквивалент указания на место откровения.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из среды огня
  rationale: Сохраняет образ речи, исходящей изнутри огня, и соответствует выражению מִתּוֹךְ.
- source_word: בְּיוֹם הַקָּהָל
  choice: в день собрания
  rationale: קָהָל обозначает собравшееся сообщество Израиля; «собрание» ясно передаёт событийный смысл выражения.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: и Яхве отдал их мне
  rationale: «Отдал» естественно передаёт נתן в контексте вручения скрижалей Моисею; местоимение сохраняет множественное число еврейского суффикса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Передача עֲשֶׂרֶת הַדְּבָרִים
  choice: Десять слов
  alternative: Десять заповедей
  rationale: Еврейское выражение буквально означает «десять слов». Такой вариант сохраняет формулировку источника, тогда как традиционное и верное по смыслу название указано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Скрижали» и «из среды огня» сохраняют достоинство и образность текста, оставаясь понятными широкому читателю. Синтаксис следует последовательности еврейского повествования, но не копирует её механически.
