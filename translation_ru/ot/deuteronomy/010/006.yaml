base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: ru
  text: Сыны Израиля отправились от Беэрот-Бене-Яакана в Мосеру[a]. Там умер Аарон и там был погребён; а его сын Елеазар служил священником вместо него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Беэрот-Бене-Яакан» можно понять буквально как «колодцы сыновей Яакана»; здесь оно передано транслитерацией как географическое название.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служил священником после него». Буквально: «на его месте»; выражение указывает на преемство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохранено буквальное родо-национальное выражение «сыны Израиля»; начальный союз передан связью с контекстом без искусственного вводного слова.
- source_word: נָסְעוּ
  choice: отправились
  rationale: В контексте странствий глагол означает сняться с места и двинуться дальше; «отправились» естественно передаёт это значение.
- source_word: מִבְּאֵרֹת בְּנֵי יַעֲקָן
  choice: от Беэрот-Бене-Яакана
  rationale: Сочетание передано как географическое название транслитерацией, а не переводом его составных частей.
- source_word: מוֹסֵרָה
  choice: в Мосеру
  rationale: Направление подразумевается формулой пути; русский винительный падеж с предлогом «в» естественно обозначает пункт назначения.
- source_word: שָׁם מֵת אַהֲרֹן וַיִּקָּבֵר שָׁם
  choice: Там умер Аарон и там был погребён
  rationale: Сохранены повтор наречия «там», локативное выделение и страдательное значение формы וַיִּקָּבֵר.
- source_word: וַיְכַהֵן אֶלְעָזָר בְּנוֹ תַּחְתָּיו
  choice: а его сын Елеазар стал священником вместо него
  rationale: Глагол כהן здесь обозначает вступление Елеазара в священническое служение в порядке преемства; «вместо него» прямо передаёт תַּחְתָּיו.
theological_decisions:
- issue: Характер священнического преемства Елеазара
  choice: стал священником вместо него
  alternative: служил священником после него
  rationale: Основной текст ясно выражает преемство, не добавляя конфессиональных представлений о порядке передачи служения; возможный акцент на последующем служении не меняет основного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Имена приведены в узнаваемой русской библейской форме; сохранён повтор «там». Единственная сноска относится к смыслу составного топонима, и её маркер присутствует в основном тексте.
