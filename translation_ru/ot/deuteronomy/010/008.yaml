revisions:
- from: В то время Яхве отделил колено Левия, чтобы оно носило ковчег завета Яхве, стояло перед Яхве, служило Ему и благословляло Его именем — и так доныне.
  to: В то время Яхве отделил колено Левия, чтобы оно носило ковчег завета Яхве, стояло перед Яхве, служило Ему и благословляло во имя Его — до сего дня.
  rationale: 'Исправлена двусмысленность в передаче «благословлять в/во имя Яхве»: русский текст больше не называет Яхве объектом благословения, которого в еврейском тексте нет. Заключительная временная формула приведена к более прямому и естественному соответствию источнику. Остальная структура и терминология сохранены.'
