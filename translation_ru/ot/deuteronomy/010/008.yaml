source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: ru
  text: В то время Яхве отделил колено Левия, чтобы оно носило ковчег завета Яхве, стояло перед Яхве, служило Ему и благословляло во имя Его — до сего дня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Естественная и точная передача временного указания без ненужного уточнения.
- source_word: הִבְדִּיל
  choice: отделил
  rationale: Глагол обозначает выделение колена для особого назначения; «отделил» сохраняет этот смысл и сакральный оттенок, не добавляя отсутствующего в тексте пояснения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: колено Левия
  rationale: Традиционное и понятное обозначение израильского колена, сохраняющее имя родоначальника.
- source_word: לָשֵׂאת
  choice: носило
  rationale: В данном контексте речь идёт о постоянной обязанности переносить ковчег; «носило» естественно выражает эту функцию.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохраняется полная цепочка зависимых существительных и явное упоминание завета.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: стояло перед Яхве
  rationale: Формально близкая передача культовой формулы без её чрезмерного истолкования.
- source_word: לְשָׁרְתוֹ
  choice: служило Ему
  rationale: «Служило» ясно выражает священное служение в контексте и сохраняет местоименный суффикс.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: и благословляло Его именем
  rationale: 'Формулировка сохраняет открытую конструкцию исходного текста: благословение совершается именем Яхве, при этом объект благословения не добавляется.'
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и так доныне
  rationale: Передаёт продолжающуюся силу установленного служения с точки зрения повествователя и естественно завершает русское предложение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер служения колена Левия
  choice: стояло перед Яхве, служило Ему
  alternative: предстояло перед Яхве и совершало священнослужение
  rationale: Выбранная формулировка сохраняет культовый контекст, но не вводит более узкое представление о священстве или поздней церковной должности.
- issue: Неуказанный объект благословения
  choice: благословляло Его именем
  alternative: благословляло народ Его именем
  rationale: В еврейском тексте объект глагола «благословлять» не назван, поэтому он не добавлен; тем самым сохраняется исходная недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка развёрнут посредством «чтобы оно», чтобы обязанности колена Левия звучали естественно и не создавали двусмысленной связи инфинитивов. Местоимение, относящееся к Богу, написано с прописной буквы согласно распространённой русской библейской типографике.
