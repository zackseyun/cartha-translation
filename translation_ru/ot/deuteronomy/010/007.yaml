  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: ru
  text: Оттуда они отправились в Гудгоду, а из Гудгоды — в Иотвафу, землю, где текут потоки воды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «землю с водотоками»; возможный смысл: «землю русел с водой». Еврейское выражение נַחֲלֵי מָיִם обозначает потоки, водные русла или водотоки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Оттуда
  rationale: Сочетание предлога с наречием обозначает отправление из предыдущего места; «оттуда» естественно передаёт пространственную последовательность.
- source_word: נָסְעוּ
  choice: они отправились
  rationale: В описаниях странствий глагол נסע обычно означает сняться с места и продолжить путь; «отправились» сохраняет оттенок начала очередного перехода.
- source_word: הַגֻּדְגֹּדָה
  choice: в Гудгоду
  rationale: Название места передано транслитерацией; конечное ה имеет направительное значение, естественно выраженное русским предлогом «в» с винительным падежом.
- source_word: וּמִן הַגֻּדְגֹּדָה
  choice: а из Гудгоды
  rationale: Предлог מִן обозначает исходный пункт следующего перехода. Союз «а» естественно связывает последовательные пункты маршрута, не добавляя причинного или временного толкования.
- source_word: יָטְבָתָה
  choice: в Иотвафу
  rationale: Топоним передан в принятой русской библейской форме «Иотвафа»; конечное направительное ה выражено конструкцией «в» с винительным падежом.
- source_word: אֶרֶץ
  choice: землю
  rationale: Слово приложением характеризует Иотвафу и буквально означает «земля»; форма винительного падежа согласована с направлением движения.
- source_word: נַחֲלֵי מָיִם
  choice: водных потоков
  rationale: Конструкция может обозначать потоки, русла или водотоки. «Водные потоки» понятно современному читателю и сохраняет образ проточной воды, не уточняя без достаточных оснований постоянный или сезонный характер русел.
