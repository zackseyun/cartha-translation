  source_fidelity: 'Основной смысл передан точно: Бог обещает написать слова на новых скрижалях; слова были на прежних скрижалях, разбитых Моисеем; затем скрижали должны быть помещены в ковчег. Однако וְשַׂמְתָּם — форма 2-го лица с последовательным будущим/предписывающим значением в данном контексте — точнее передаётся будущим временем «положишь», как и в английском audit trail, а не самостоятельным повелительным «положи».'
  naturalness: «Скрижали» и «ковчег» уместны в современном литературном библейском регистре. Предлагаемая синтаксическая правка делает последовательность обещания и последующего действия более прозрачной. Указательное «этих» допустимо контекстуально, поскольку речь идёт о скрижалях из предыдущего стиха.
  terminology: «Слова» точно передаёт הַדְּבָרִים и не навязывает более узкое «заповеди». «Скрижали» — устоявшееся соответствие לֻחוֹת; «ковчег» соответствует אָרוֹן в данном контексте. Сноску следует сформулировать так, чтобы она не повторяла буквально уже избранный основной вариант как отдельную альтернативу.
