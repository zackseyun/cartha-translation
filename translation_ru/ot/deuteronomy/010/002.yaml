  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: ru
  text: И Я напишу на этих скрижалях те слова, которые были на первых скрижалях[a], разбитых тобой, и положишь их в ковчег.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заповеди»; евр. «слова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: И Я напишу
  rationale: Форма Qal, имперфект 1-го лица единственного числа с союзом; в контексте Божьего обещания естественно передаётся будущим временем.
- source_word: הַלֻּחֹת
  choice: на этих скрижалях
  rationale: לוח обозначает дощечку или плиту; в библейском контексте установившееся русское «скрижали» точно и узнаваемо. Указательное «этих» естественно отсылает к скрижалям, веленным в предыдущем стихе, хотя формально в еврейском стоит определённый артикль.
- source_word: הַדְּבָרִים
  choice: те слова
  rationale: דבר имеет широкий диапазон значений, но здесь обозначает начертанные слова завета. «Слова» сохраняет буквальную лексику и не сужает значение до «заповедей».
- source_word: אֲשֶׁר הָיוּ
  choice: которые были
  rationale: Прямая и естественная передача относительного оборота с היה.
- source_word: הָרִאשֹׁנִים
  choice: первых
  rationale: Прилагательное отличает прежний комплект скрижалей от нового; «первых» ясно передаёт это противопоставление.
- source_word: שִׁבַּרְתָּ
  choice: разбитых тобой
  rationale: Piel, перфект 2-го лица мужского рода единственного числа от שבר. Причастный оборот естественен по-русски и сохраняет прямое указание на поступок Моисея.
- source_word: וְשַׂמְתָּם
  choice: а ты положи их
  rationale: Форма с суффиксом мужского рода множественного числа в данном предписывающем контексте передаётся повелительным «положи». Местоимение по смыслу относится к скрижалям.
- source_word: בָּאָרוֹן
  choice: в ковчег
  rationale: ארון здесь — священный ковчег, изготовление которого предписано непосредственно перед этим; винительный падеж с направительным значением естественно передаёт помещение внутрь.
theological_decisions:
- issue: К чему относится местоименный суффикс в וְשַׂמְתָּם («положи их»)
  choice: К скрижалям
  alternative: К словам или заповедям, написанным на скрижалях
  rationale: Грамматически суффикс мужского рода множественного числа может соотноситься и со «скрижалями», и со «словами», однако физическое помещение в ковчег и контекст Второзакония 10:1–5 указывают на скрижали.
translation_notes:
  register: Современный литературный русский с сохранением традиционных и широко понятных библейских терминов «скрижали» и «ковчег». Синтаксис сделан плавным, но структура обещания и последующего повеления сохранена.
