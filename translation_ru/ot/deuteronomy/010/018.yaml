base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: ru
  text: Он защищает права сироты[a] и вдовы и любит переселенца[b], давая ему пищу и одежду[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейское יָתוֹם обозначает человека, лишившегося отца; возможный перевод: «оставшийся без отца».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришельца», «живущего среди израильтян чужеземца». Древнееврейское גֵּר обозначает не просто путника, а человека чужого происхождения, поселившегося среди израильтян.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «хлеб и одежду». Здесь «хлеб» означает пищу, необходимую для жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: вершит правосудие
  rationale: Сочетание означает осуществлять или обеспечивать правосудие. Русское «вершит правосудие» сохраняет судебно-этическую силу выражения и звучит естественно и достойно.
- source_word: יָתוֹם
  choice: сирота
  rationale: В современном русском это обычное обозначение ребёнка, лишённого родителя или родителей; более узкий древнееврейский оттенок пояснён в сноске.
- source_word: אַלְמָנָה
  choice: вдова
  rationale: Прямое и точное обозначение названной в тексте уязвимой социальной группы.
- source_word: אֹהֵב
  choice: любит
  rationale: Прямая передача деятельного расположения Бога к переселенцу без сведения любви только к чувству или только к помощи.
- source_word: גֵּר
  choice: переселенец
  rationale: Речь идёт не о случайном путнике, а о человеке чужого происхождения, постоянно живущем среди израильтян. «Переселенец» передаёт это в понятном современном русском языке; возможные варианты приведены в сноске.
- source_word: לָתֶת לוֹ
  choice: давая ему
  rationale: Деепричастный оборот естественно связывает любовь с её конкретным проявлением — обеспечением необходимым.
- source_word: לֶחֶם
  choice: пища
  rationale: Буквально слово означает «хлеб», но в паре с одеждой обозначает необходимое пропитание в целом.
- source_word: שִׂמְלָה
  choice: одежда
  rationale: Общее современное обозначение одежды; уместно в паре с пищей как одной из основных жизненных потребностей.
theological_decisions:
- issue: Божья забота об уязвимых людях
  choice: 'Сохранены обе стороны утверждения: Бог осуществляет правосудие для сироты и вдовы и любит переселенца, обеспечивая его необходимым.'
  alternative: Свести смысл либо только к судебной защите, либо только к эмоциональному состраданию.
  rationale: Древнееврейский текст соединяет судебное действие, любовь и материальное обеспечение; перевод не устраняет напряжение между этими взаимодополняющими сторонами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формула «вершит правосудие» сохраняет юридическую образность оригинала, а «переселенец» делает древнюю социально-правовую категорию понятной современному читателю без архаизма «пришелец».
