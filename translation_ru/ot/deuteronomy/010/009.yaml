  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: ru
  text: 'Поэтому у Левия нет доли и наследственного удела среди его братьев[a]: Яхве — его наследие[b], как сказал ему Яхве, твой Бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с его братьями». Имя «Левий» в единственном числе обозначает здесь колено Левия в отличие от остальных колен Израиля.'
    reason: cultural_note
  - marker: b
    text: 'Или: «Яхве — его удел». Повтор слова, связанного с наследованием, подчёркивает: доля Левия — не земля, а сам Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста и естественно звучит по-русски.
- source_word: לְלֵוִי
  choice: у Левия
  rationale: Сохраняет единственное число и собственное имя оригинала; Левий здесь представляет всё колено.
- source_word: חֵלֶק וְנַחֲלָה
  choice: доли и наследственного удела
  rationale: 'Различает два еврейских существительных: חֵלֶק — доля, נַחֲלָה — наследственное владение, прежде всего земельный удел.'
- source_word: עִם אֶחָיו
  choice: среди его братьев
  rationale: Сохраняет образ родства, но по-русски естественно выражает получение удела наряду с прочими коленами Израиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הוּא נַחֲלָתוֹ
  choice: его наследие
  rationale: Повторяет корневую идею נַחֲלָה и подчёркивает противопоставление земельного наследия самому Яхве.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как и сказал
  rationale: Точно передаёт значение «как говорил/сказал», не вводя отсутствующего в глаголе явного понятия обещания.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет обращение во втором лице единственного числа к Израилю.
- source_word: לוֹ
  choice: ему
  rationale: Сохраняет местоимение единственного числа, отсылающее к Левию как представителю колена.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал содержит личное имя Бога; транслитерация сохраняет это различие.
- issue: Левий как единственный представитель колена
  choice: у Левия
  alternative: у колена Левия
  rationale: Сохраняется форма оригинала, а коллективный смысл поясняется в примечании.
- issue: Связь двух употреблений נַחֲלָה
  choice: «наследственного удела» / «наследие»
  alternative: «удела» / «доля»
  rationale: Русские формы позволяют сохранить смысловую связь и одновременно ясно выразить контраст между землёй и самим Яхве.
- issue: Братья Левия
  choice: среди его братьев
  alternative: среди других израильтян
  rationale: Сохраняется родственный язык оригинала и образ Израиля как братских колен без нейтрализующего истолкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Наследственный удел» ясно обозначает земельное наследование, а «наследие» сохраняет богословски значимое повторение без тяжеловесности.
