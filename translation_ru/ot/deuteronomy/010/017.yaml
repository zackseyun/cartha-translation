  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: ru
  text: Ведь Яхве, ваш Бог, — Бог богов и Господь господ, Бог великий, могучий и внушающий трепет[a], который нелицеприятен и не берёт взяток.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грозный»; еврейское слово означает того, кто внушает страх и благоговейный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего призыва; «ведь» естественно передаёт причинно-пояснительную связь в русском контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его титулом.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: Бог богов
  rationale: Сохраняет еврейскую конструкцию превосходства и не уточняет онтологический статус названных «богов».
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: и Господь господ
  rationale: Сохраняет параллелизм и торжественную формулу верховной власти.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: Бог великий, могучий и внушающий трепет
  rationale: Передаёт ряд божественных эпитетов; «внушающий трепет» выражает сочетание благоговения и страха в נוֹרָא без излишне отрицательного оттенка.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: который нелицеприятен
  rationale: Русский библейский и литературный эквивалент идиомы «не поднимает лица», то есть не оказывает предпочтения из-за личности или положения.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: и не берёт взяток
  rationale: Прямо и естественно передаёт юридико-нравственный смысл выражения.
theological_decisions:
- issue: Формула «Бог богов и Господь господ»
  choice: Сохранить буквально как утверждение верховенства
  alternative: Бог превыше всех богов и Господь превыше всех господ
  rationale: Исходные цепочки сопряжения выражают несравненное превосходство, не требуя от перевода пояснять природу других «богов» и «господ».
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, непосредственно представленное в еврейском тексте.
- issue: Смысл וְהַנּוֹרָא
  choice: внушающий трепет
  alternative: грозный; страшный; внушающий благоговейный страх
  rationale: Выбор сохраняет напряжение между страхом и благоговением, не сводя эпитет только к угрозе или только к восхищению.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Формула «Бог богов и Господь господ» сохранена; «нелицеприятен» уместно в возвышенном и судебно-нравственном контексте, хотя менее разговорно.
