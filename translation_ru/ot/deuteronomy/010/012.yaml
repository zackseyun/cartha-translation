source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: ru
  text: И теперь, Израиль, чего требует от тебя Яхве, твой Бог? Только того, чтобы ты боялся Яхве, твоего Бога,[a] ходил всеми Его путями, любил Его и служил Яхве, твоему Богу, всем своим сердцем и всей своей душой.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бояться» здесь означает благоговеть перед Яхве, испытывать перед Ним трепет и быть преданным Ему в послушании.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всей своей жизнью» или «всем своим существом». Еврейское слово нэфеш может означать душу, жизнь или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительную силу וְ, так и переход к итоговому увещанию, выраженный עַתָּה.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: чего требует от тебя
  rationale: В данном заветном увещании שׁאל с מֵעִם обозначает не необязательную просьбу, а требование; русское «требует» естественно передаёт обязательную силу оборота.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כִּי אִם
  choice: только того, чтобы
  rationale: Естественно вводит в русском языке исчерпывающее содержание требования после риторического вопроса.
- source_word: לְיִרְאָה
  choice: чтобы ты боялся
  rationale: Сохраняет прямое значение корня ירא и присущую заветному контексту напряжённость между страхом, благоговением и послушанием.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: ходил всеми Его путями
  rationale: Сохраняет еврейскую этическую метафору хождения; творительный оборот звучит литературно и понятно по-русски.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: любил Его
  rationale: Прямо передаёт любовь к Яхве как личную и заветную преданность.
- source_word: וְלַעֲבֹד
  choice: служил
  rationale: «Служить» охватывает поклонение, послушание и заветную преданность, не сужая смысл до обрядового богослужения.
- source_word: בְּכָל לְבָבְךָ
  choice: всем своим сердцем
  rationale: Традиционное и естественное соответствие, при котором «сердце» обозначает внутреннего человека, включая волю и мысли.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: всей своей душой
  rationale: Сохраняет установленное соответствие и выражение полноты посвящения; широта נֶפֶשׁ поясняется в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное заветное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл ירא в заветном увещании
  choice: бояться
  alternative: благоговеть
  rationale: «Бояться» сохраняет лексическую силу и богословскую напряжённость; контекст включает благоговение, трепет и послушную преданность, а не один лишь ужас.
- issue: Антропологический диапазон נֶפֶשׁ
  choice: душой
  alternative: всей жизнью; всем существом
  rationale: «Душой» естественно сочетается с «сердцем» и сохраняет традиционную образность, но сноска не позволяет свести נֶפֶשׁ к строго отделимой нематериальной части человека.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Сохранены обращение к Израилю в единственном числе, метафора «ходить путями» и повторение имени Яхве. Синтаксис слегка перестроен для естественного русского риторического вопроса, без устранения исходной смысловой напряжённости.
