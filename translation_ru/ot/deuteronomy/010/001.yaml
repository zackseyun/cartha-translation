base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: ru
  text: 'В то время Яхве сказал мне: «Высеки себе две каменные скрижали, подобные первым, поднимись ко мне на гору и сделай себе ковчег из дерева».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: В то время
  rationale: Естественно передаёт временную формулу и её указательное значение в повествовании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: פְּסָל לְךָ
  choice: Высеки себе
  rationale: Императив обозначает обтёсывание или высекание камня; «высеки» ясно и уместно в современном литературном русском, а «себе» сохраняет значение לְךָ.
- source_word: שְׁנֵי לֻוחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: две каменные скрижали, подобные первым
  rationale: «Скрижали» точно обозначает каменные таблички завета, а «подобные первым» сохраняет сравнительную конструкцию и отсылку к прежним скрижалям.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: поднимись ко мне на гору
  rationale: Передаёт как восхождение, так и направленность движения к говорящему на горе.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: и сделай себе ковчег из дерева
  rationale: «Ковчег» соответствует сакральному предмету для хранения скрижалей; «из дерева» непосредственно передаёт еврейскую конструкцию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» сохраняет имя и отражает наиболее распространённую научную реконструкцию произношения, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранена прямая и последовательная структура повелений; местоимение «мне» написано со строчной буквы, поскольку прописная форма отсутствует в еврейском тексте и является поздней русской конфессионально-редакционной традицией.
