source:
  edition: WLC
  text: וָ/אַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָ/אֶפְסֹ֛ל שְׁנֵי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וָ/אַ֣עַל הָ/הָ֔רָ/ה וּ/שְׁנֵ֥י הַ/לֻּחֹ֖ת בְּ/יָדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: ru
  text: И сделал я ковчег из древесины акации, вытесал две каменные скрижали, подобные первым, и поднялся на гору с обеими скрижалями в руке.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: сделал
  rationale: Прямо передаёт широкое значение глагола עשה и естественно описывает изготовление ковчега.
- source_word: אֲרוֹן
  choice: ковчег
  rationale: Традиционный и контекстуально точный русский эквивалент для священного вместилища скрижалей; не добавляет к тексту новых богословских утверждений.
- source_word: עֲצֵי שִׁטִּים
  choice: из древесины акации
  rationale: Передаёт породу дерева современным и понятным языком; форма «из древесины» подчёркивает материал изготовления.
- source_word: וָאֶפְסֹל
  choice: вытесал
  rationale: Глагол פסל обозначает обработку камня отсечением или высеканием; «вытесал» точно и естественно сочетается со скрижалями.
- source_word: לֻחֹת אֲבָנִים
  choice: каменные скрижали
  rationale: «Скрижали» сохраняет устойчивое обозначение табличек завета, а определение «каменные» прямо передаёт материал.
- source_word: כָּרִאשֹׁנִים
  choice: подобные первым
  rationale: Сохраняет выраженное в еврейском тексте сравнение с прежними скрижалями, не уточняя, в чём именно состояло подобие.
- source_word: וָאַעַל הָהָרָה
  choice: поднялся на гору
  rationale: Передаёт восхождение, выраженное глаголом עלה и направительным окончанием в הָהָרָה.
- source_word: וּשְׁנֵי הַלֻּחֹת בְּיָדִי
  choice: с обеими скрижалями в руке
  rationale: Естественно передаёт обстоятельственную конструкцию и сохраняет грамматически единственное число слова «рука».
theological_decisions:
- issue: Обозначение священного вместилища скрижалей
  choice: ковчег
  alternative: ящик, ларец
  rationale: «Ковчег» сохраняет закрепившееся в русском библейском языке обозначение предмета и его контекстуальную значимость, тогда как «ящик» звучит чрезмерно бытово, а «ларец» может привнести не выраженный в оригинале оттенок декоративности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «И сделал я» сохраняет повествовательный акцент исходного текста, оставаясь понятной современному читателю.
