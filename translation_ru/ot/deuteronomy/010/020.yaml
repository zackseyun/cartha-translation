base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: ru
  text: Бойся Яхве, твоего Бога[a]; Ему служи, держись Его[b] и клянись Его именем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговей перед Яхве, твоим Богом»; еврейский глагол обозначает страх, который в контексте завета включает благоговение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прилепляйся к Нему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господа
  rationale: В русском библейском употреблении традиционная передача тетраграмматона как «Господь» сохраняет узнаваемость и достоинство; падежная форма обусловлена прямым дополнением при «бойся».
- source_word: אֱלֹהֶיךָ
  choice: Бога твоего
  rationale: Точно передаёт сочетание с суффиксом второго лица единственного числа и сохраняет торжественный порядок слов.
- source_word: תִּירָא
  choice: бойся
  rationale: Глагол ירא прямо обозначает страх, который в контексте завета включает благоговение; «бойся» не ослабляет эту смысловую напряжённость.
- source_word: אֹתוֹ תַעֲבֹד
  choice: Ему служи
  rationale: Выделенное местоимение передано явно и поставлено перед глаголом для сохранения акцента; עבד переведено основным значением «служить», не сужая его до культового поклонения.
- source_word: וּבוֹ תִדְבָּק
  choice: к Нему прилепляйся
  rationale: Сочетание ב с דבק выражает тесную и постоянную приверженность; «прилепляйся к Нему» сохраняет образность и заветный оттенок.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: и Его именем клянись
  rationale: Русское «клясться чьим-либо именем» естественно и точно передаёт идиому с формой Niphal глагола שבע.
theological_decisions:
- issue: Форма передачи заветных предписаний
  choice: 'Последовательность повелительных форм единственного числа: «бойся… служи… прилепляйся… клянись».'
  alternative: 'Будущие формы долженствования: «будешь бояться… будешь служить…» или «должен бояться…».'
  rationale: В данном наставительно-правовом контексте еврейские имперфекты имеют повелительную силу. Русский императив естественно и непосредственно передаёт её, не добавляя модального слова, отсутствующего в источнике.
- issue: Смысл ירא в отношении Бога
  choice: «бойся» с примечанием о благоговейном оттенке.
  alternative: «почитай» или «благоговей перед».
  rationale: Более мягкие варианты выражают часть смысла, но устраняют подлинный компонент страха; основной текст сохраняет более широкий и напряжённый смысл еврейского слова.
- issue: Передача Божьего имени יהוה
  choice: «Господь».
  alternative: «Яхве».
  rationale: Выбрана укоренённая в русской библейской речи передача, понятная широкой аудитории; при этом она представляет имя титулом и потому является переводческой традицией, а не транслитерацией.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Инверсия «Господа, Бога твоего, бойся» и повторение ударных местоимений передают акценты еврейской фразы. Все обращения стоят в единственном числе, как в источнике.
