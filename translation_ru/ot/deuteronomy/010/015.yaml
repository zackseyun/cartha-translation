  source_fidelity: 'Основной смысл передан верно: רַק сохраняет ограничительный оттенок, חָשַׁק — особую привязанность Яхве к отцам, а избрание их потомства, отождествлённого с адресатами, выражено прямо. Однако «полюбив их» меняет неопределённый инфинитив לְאַהֲבָה («чтобы любить их» / «любя их») в совершенное деепричастие, способное обозначать предшествующее завершённое действие. Это менее точно, чем целевой оборот.'
