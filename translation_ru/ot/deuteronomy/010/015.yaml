source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: ru
  text: Однако лишь к твоим отцам Яхве привязался, чтобы любить их, и избрал их потомство после них — вас — из всех народов, как это и есть по сей день.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Однако только твоих отцов Яхве возжелал любить».'
    reason: 'Лексико-синтаксическая альтернатива: רַק может быть передано «только», а חָשַׁק — «возжелал» или «находил отраду»; инфинитив לְאַהֲבָה сохраняет связь с «любить».'
lexical_decisions:
- source_word: רַק
  choice: Но только
  rationale: 'Сочетание передаёт одновременно контраст с предыдущим утверждением о вселенной, принадлежащей Яхве, и ограничительно-усилительный оттенок: несмотря на это, особая привязанность была обращена именно к праотцам Израиля.'
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: к твоим отцам привязался
  rationale: Глагол חָשַׁק с ב обозначает сильную направленную привязанность. «Привязался к» естественно по-русски и сохраняет образ близкой, волевой привязанности, не сливая его со следующим глаголом «любить».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לְאַהֲבָה אֹתָם
  choice: полюбив их
  rationale: Деепричастная конструкция естественно связывает инфинитив с предшествующим חָשַׁק, сохраняя тесную смысловую связь. Она допускает оттенок цели или проявления привязанности, не перегружая русский текст.
- source_word: וַיִּבְחַר
  choice: и избрал
  rationale: «Избрал» — точное и привычное в библейском русском соответствие глаголу בחר, сохраняющее явный язык Божьего выбора.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: после них их потомство
  rationale: «Потомство» передаёт собирательное זֶרַע; «после них» сохраняет временно-преемственную формулировку оригинала.
- source_word: בָּכֶם
  choice: вас
  rationale: Местоимение приложением отождествляет потомство с нынешними слушателями; тире ясно отмечают это пояснение.
- source_word: מִכָּל הָעַמִּים
  choice: из всех народов
  rationale: Сохраняются отделительно-избирательный смысл предлога מִן и множественное עַמִּים без сужения значения до политических государств.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть по сей день
  rationale: Русская идиома передаёт обращение к нынешнему, наблюдаемому положению дел как подтверждению сказанного.
theological_decisions:
- issue: Язык Божьего избрания
  choice: Сохранены отдельные утверждения о привязанности, любви и избрании Яхве.
  alternative: Ослабить их до общего благоволения или развернуть в формулировку определённой поздней доктрины избрания.
  rationale: Еврейский текст прямо говорит о привязанности Яхве к отцам, любви к ним и выборе их потомства. Перевод не смягчает этих понятий и не систематизирует их сверх сказанного.
- issue: Связь לְאַהֲבָה с חָשַׁק
  choice: «полюбив их» оставляет любовь тесно связанной с привязанностью, не уточняя жёстко, является ли инфинитив целью или проявлением/результатом.
  alternative: «чтобы любить их» однозначнее подчёркивает цель; «из любви к ним» сильнее истолковывает основание.
  rationale: Инфинитив допускает близкие оттенки цели и результата. Русская деепричастная форма сохраняет смысловую напряжённость естественнее буквального оборота.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Отец» сохранено вместо поясняющего «праотец», а личное имя передано как «Яхве». Тире обозначают приложение «вас»; сноска фиксирует подлинную лексико-синтаксическую неоднозначность.
