base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: ru
  text: Он — твоя хвала[a], и Он — твой Бог. Он совершил для тебя эти великие и внушающие трепет дела[b], которые видели твои глаза.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот, Кого ты восхваляешь»; или: «предмет твоей похвалы». Буквально по-еврейски: «Он — твоя хвала».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «грозные дела»; или: «страшные дела». Еврейское слово обозначает то, что вызывает страх и благоговейный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: твоя хвала
  rationale: 'Буквально сохраняет ёмкую именную конструкцию: Бог представлен и как Тот, Кого восхваляют, и как основание хвалы Израиля.'
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет прямое заветное обращение к Израилю в форме второго лица единственного числа.
- source_word: עָשָׂה אִתְּךָ
  choice: совершил для тебя
  rationale: Передаёт благотворный для адресата смысл идиомы עשה את, не воспроизводя неестественное по-русски буквальное «сделал с тобой».
- source_word: הַגְּדֹלֹת
  choice: великие дела
  rationale: Субстантивированное прилагательное естественно передано с существительным «дела»; «великие» сохраняет широкий смысл исходного слова.
- source_word: הַנּוֹרָאוֹת
  choice: внушающие трепет дела
  rationale: Передаёт значение деяний, вызывающих страх, благоговение и изумление, не сводя его ни к ужасу, ни к ослабленному разговорному восхищению.
- source_word: רָאוּ עֵינֶיךָ
  choice: видели твои глаза
  rationale: Сохраняет конкретность и свидетельскую выразительность еврейской идиомы.
- source_word: הוּא ... וְהוּא
  choice: Он ... и Он
  rationale: Повтор местоимения сохраняет эмфатическую структуру оригинала без добавления отсутствующего в тексте значения исключительности.
theological_decisions:
- issue: Предикативное выражение הוּא תְהִלָּתְךָ
  choice: Он — твоя хвала
  alternative: Он — Тот, Кого ты восхваляешь; Он — предмет твоей похвалы
  rationale: 'Буквальный вариант сохраняет богословскую многозначность: Бог одновременно является предметом и основанием хвалы народа.'
- issue: Смысл הַנּוֹרָאוֹת
  choice: внушающие трепет дела
  alternative: грозные дела; страшные дела
  rationale: Выбор удерживает напряжение между страхом и благоговейным изумлением, не придавая слову исключительно отрицательного смысла.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Единственное число «твой/тебя» сохранено как корпоративное обращение к Израилю. Двоеточие оригинала передано разделением на два предложения для ясности; повтор «Он» сохранён ради смыслового акцента.
