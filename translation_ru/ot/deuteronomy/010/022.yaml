    rationale: «Сделал тебя многочисленным, как звёзды небесные» понятно, но «таким же многочисленным, как небесные звёзды» естественнее по-русски и явнее передаёт численное сравнение כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב.
