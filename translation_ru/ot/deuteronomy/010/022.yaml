source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: ru
  text: Твои отцы[a] сошли в Египет в числе семидесяти человек[b], а теперь Яхве, твой Бог, сделал тебя таким же многочисленным, как небесные звёзды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои предки». В еврейском тексте буквально: «твои отцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семьдесят душ». Еврейское נֶפֶשׁ здесь служит обозначением при подсчёте людей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как звёзды на небе». Сравнение указывает на многочисленность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: всего семьдесят человек
  rationale: נֶפֶשׁ здесь употреблено как счётное обозначение людей. Русское «семьдесят человек» естественно передаёт смысл, а «всего» подчёркивает противопоставление прежней малочисленности нынешнему множеству.
- source_word: יָרְדוּ
  choice: сошли
  rationale: Глагол ירד означает «спускаться, сходить» и сохраняет традиционное пространственное представление о пути в Египет.
- source_word: אֲבֹתֶיךָ
  choice: твои отцы
  rationale: Форма буквально означает «твои отцы». Основной текст сохраняет конкретный мужской термин, а более широкое по смыслу «предки» дано в примечании.
- source_word: מִצְרָיְמָה
  choice: в Египет
  rationale: Направительный суффикс указывает на движение в сторону Египта; по-русски естественно «сойти в Египет».
- source_word: וְעַתָּה
  choice: а теперь
  rationale: Сочетание связывает две части высказывания и одновременно выражает контраст между семьюдесятью людьми тогда и великой численностью теперь.
- source_word: שָׂמְךָ
  choice: сделал тебя
  rationale: Глагол שׂים буквально значит «поставить, поместить», но здесь обозначает приведение к новому состоянию; «сделал тебя» ясно передаёт результат.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямое и естественное соответствие форме с суффиксом второго лица единственного числа.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: многочисленным, как звёзды небесные
  rationale: לָרֹב уточняет, что сравнение относится к численному изобилию. «Многочисленным» делает эту связь явной, сохраняя образ небесных звёзд.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Передача אֲבֹתֶיךָ
  choice: твои отцы
  alternative: твои предки
  rationale: Основной текст сохраняет прямо выраженное мужское множественное число, не исключая того, что по контексту речь идёт о предках Израиля.
- issue: Коллективное второе лицо в שָׂמְךָ
  choice: сделал тебя
  alternative: сделал вас
  rationale: Еврейский текст обращается к Израилю как к единому народу во втором лице единственного числа; русский перевод сохраняет это коллективное «ты».
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис перестроен естественно для русского: численность вынесена в пояснительный оборот. Коллективное единственное число «тебя» и образ «звёзд небесных» сохранены.'
