  source_fidelity: 'В основном смысл передан точно: сохранены движение «сошли» в Египет, «отцы», коллективное единственное число обращения к Израилю, имя «Яхве» и образ звёзд. Однако «всего» не выражено непосредственно в еврейском тексте; контраст создаётся сочетанием «а теперь», но наречие добавляет акцент. Формула «в числе семидесяти человек» точно передаёт בְּשִׁבְעִים נֶפֶשׁ.'
  naturalness: Предлагаемая правка сохраняет современный литературный и умеренно библейский регистр. «Таким же многочисленным, как небесные звёзды» грамматически и стилистически более гладко выражает численный характер сравнения, чем «многочисленным, как звёзды небесные».
  terminology: «Яхве», «твой Бог» и «твои отцы» уместны и соответствуют исходному тексту. Примечания корректно поясняют вариант «предки», счётное употребление נֶפֶשׁ и смысл образа звёзд.
