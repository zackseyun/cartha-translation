base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: ru
  text: Тогда я повернулся, спустился с горы и положил скрижали в ковчег, который я сделал. Они были там[a], как повелел мне Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и они были там»; эти слова могут также подразумевать, что скрижали оставались там до времени речи говорящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Тогда я повернулся
  rationale: Глагол פנה означает «повернуться»; «тогда» естественно передаёт последовательность повествования, выраженную формой с вау.
- source_word: וָאֵרֵד מִן הָהָר
  choice: спустился с горы
  rationale: ירד означает движение вниз; русский глагол «спустился» точно и естественно передаёт действие, а определённость горы ясна из контекста.
- source_word: וָאָשִׂם אֶת הַלֻּחֹת
  choice: положил скрижали
  rationale: שׂים здесь значит «положить, поместить»; традиционное русское «скрижали» точно обозначает данные Богом таблички и уместно в современном литературном библейском тексте.
- source_word: בָּאָרוֹן
  choice: в ковчег
  rationale: אָרוֹן может обозначать ящик или ковчег; в данном контексте речь идёт о ковчеге завета. Винительный оборот «в ковчег» естественно выражает направленность помещения внутрь.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: который сделал
  rationale: Относительное предложение относится к ковчегу. Русский вид и последовательность действий уже показывают, что ковчег был сделан ранее, поэтому добавлять «до этого» не требуется.
- source_word: וַיִּהְיוּ שָׁם
  choice: Они остались там
  rationale: Оборот буквально сообщает, что скрижали «были там», и в контексте допускает значение продолжающегося пребывания. «Остались там» естественно передаёт этот вероятный результат, а буквальная возможность сохранена в сноске.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: как повелел мне
  rationale: כַּאֲשֶׁר выражает соответствие, а צוה с суффиксом первого лица — повеление, обращённое к говорящему.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. Форма «Яхве» является принятой научной реконструкцией произношения и прямо передаёт имя.
- issue: Временной смысл וַיִּהְיוּ שָׁם
  choice: Они остались там
  alternative: Они были там
  rationale: Контекст позволяет понимать фразу как указание на продолжающееся нахождение скрижалей в ковчеге, однако сама еврейская форма не устраняет более буквального статического прочтения; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Слово «скрижали» сохранено как общеупотребительное обозначение каменных табличек завета; синтаксис сделан ясным и естественным без добавления отсутствующих в стихе деталей.
