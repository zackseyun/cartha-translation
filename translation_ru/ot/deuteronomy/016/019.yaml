base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: ru
  text: Не извращай правосудие, не проявляй пристрастия[a] и не бери взятки, потому что взятка ослепляет глаза мудрых и искажает слова праведных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не узнавай лиц» — древнееврейская идиома, означающая предпочтение одних людей другим, то есть лицеприятие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «искажает дело тех, кто прав». Древнееврейское выражение может обозначать как слова праведных, так и, в судебном контексте, их доводы или дело.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: извращай правосудия
  rationale: Глагол נטה в породе хифиль с מִשְׁפָּט означает отклонять судебное решение от справедливости. «Извращать правосудие» естественно звучит по-русски и сохраняет юридическую силу выражения.
- source_word: תַכִּיר פָּנִים
  choice: проявляй пристрастия
  rationale: Буквально выражение означает «узнавать лица», но это древнееврейская идиома о предпочтении одних людей другим при вынесении решения. Русское «проявлять пристрастие» ясно передаёт её смысл.
- source_word: שֹׁחַד
  choice: взятка
  rationale: В данном юридическом контексте речь идёт о подношении, предназначенном повлиять на решение; «взятка» точнее, чем нейтральный «дар».
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: ослепляет глаза мудрых
  rationale: Сохранён прозрачный и выразительный образ исходного текста, показывающий, как взятка лишает мудрых способности судить верно.
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Форма множественного числа обозначает мудрых людей в целом; субстантивированное русское прилагательное передаёт это естественно и без неоправданного сужения до мужчин.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: искажает слова праведных
  rationale: סלף означает «искажать, извращать», а דִּבְרֵי буквально означает «слова»; близкий к форме оригинала перевод сохраняет также возможность юридического понимания, отмеченную в сноске.
- source_word: צַדִּיקִם
  choice: праведных
  rationale: צַדִּיקִים может обозначать как нравственно праведных, так и тех, кто прав в судебном деле. «Праведных» сохраняет широту значения, тогда как «невиновных» чрезмерно его сужает.
theological_decisions:
- issue: Значение דִּבְרֵי צַדִּיקִם в судебном контексте
  choice: слова праведных
  alternative: дело тех, кто прав
  rationale: Основной текст сохраняет буквальное значение דִּבְרֵי — «слова», не устраняя возможный юридический смысл «дело, доводы»; эта неоднозначность раскрыта в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Сохранено обращение во втором лице единственного числа, соответствующее древнееврейской форме. Образ «ослепляет глаза» передан без сглаживания; редкая идиома о «лицах» объяснена в сноске.
