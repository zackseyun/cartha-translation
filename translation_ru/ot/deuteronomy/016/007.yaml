  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: ru
  text: Свари его и съешь там, в месте, которое изберёт ГОСПОДЬ, твой Бог; утром же возвращайся к своим шатрам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: Свари
  rationale: Глагол בשל в данном контексте означает приготовление пищи посредством варки; конкретный способ передан прямо и естественно.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: на месте, которое изберёт для этого ГОСПОДЬ, твой Бог
  rationale: Местоименное בּוֹ грамматически допускает связь с местом («на нём/в нём»), но это было бы избыточным после בַּמָּקוֹם; перевод «для этого» сохраняет референциальную неоднозначность и согласуется с контекстом пасхальной жертвы.
- source_word: וּפָנִיתָ
  choice: отправляйся обратно
  rationale: Буквально «повернись»; в сочетании с последующим «иди» обозначает уход и возвращение, что естественно выражается по-русски одним глагольным оборотом.
- source_word: לְאֹהָלֶיךָ
  choice: к своим шатрам
  rationale: Сохранён конкретный образ множественного числа «шатры», который может обозначать жилища или место проживания народа.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционная русская передача капителью сохраняет различие между тетраграмматоном и обычным титулом «Господь», не навязывая реконструированное произношение.
- issue: Референт местоимения בּוֹ
  choice: для этого
  alternative: там / на нём
  rationale: Еврейская конструкция допускает некоторую неоднозначность; выбранный вариант не сводит её без необходимости только к месту и сохраняет возможную отсылку к совершению пасхальной жертвы.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Повелительные формы естественно передают модальные формы еврейского текста; пунктуация подчёркивает последовательность предписаний.
