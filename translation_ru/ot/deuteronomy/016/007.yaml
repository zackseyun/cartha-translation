    issue: «для этого» для בּוֹ
    rationale: Оборот не звучит по-русски без ясно названного предмета и фактически подставляет референт («это»). Наречное «там» передаёт контекстуальную связь местоимения с местом и не снимает спорных нюансов сверх необходимого.
  - severity: low
