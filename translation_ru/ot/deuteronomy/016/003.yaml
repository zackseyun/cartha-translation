  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: ru
  text: Не ешь с ней ничего квасного. Семь дней ешь с ней пресный хлеб[a], хлеб страдания, потому что ты поспешно вышел из земли Египетской, чтобы во все дни своей жизни помнить день, когда ты вышел из земли Египетской.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб бедности» или «хлеб бедствия». Еврейское выражение может указывать на тяготы, нужду или унижение, связанные с рабством и исходом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: с ней
  rationale: Предлог עַל здесь выражает сопровождение пасхальной жертвы другой пищей. Женский род местоимения естественно отсылает к пасхальной жертве, названной в предыдущем стихе.
- source_word: חָמֵץ
  choice: ничего квасного
  rationale: Субстантивированное חָמֵץ обозначает квасную пищу, а не только закваску как ингредиент; такая передача сохраняет широту запрета.
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: Общепонятная русская передача ритуального хлеба без закваски; она естественнее транслитерации и не уточняет форму изделий.
- source_word: לֶחֶם עֹנִי
  choice: хлеб бедствия
  rationale: עֹנִי может указывать на страдание, нужду или унижение. «Бедствие» сохраняет смысл тяготы, не сводя его исключительно к материальной бедности.
- source_word: בְחִפָּזוֹן
  choice: поспешно
  rationale: Передаёт обстоятельство срочного выхода, не добавляя возможного, но не обязательного оттенка панического бегства.
- source_word: לְמַעַן תִּזְכֹּר
  choice: чтобы ... помнить
  rationale: Сочетание выражает цель; русский инфинитив после «чтобы» звучит естественно при совпадении субъекта.
- source_word: יוֹם צֵאתְךָ
  choice: день, когда ты вышел
  rationale: Естественная русская передача еврейской конструкции с инфинитивом, сохраняющая конкретное воспоминание о дне исхода.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: во все дни своей жизни
  rationale: Сохраняет распределительный и длительный смысл выражения, а также его библейскую торжественность без архаизма.
theological_decisions:
- issue: Смысл לֶחֶם עֹנִי как знака исхода
  choice: хлеб бедствия
  alternative: хлеб бедности; хлеб страдания
  rationale: Выбранная формулировка удерживает связь хлеба как с прежними тяготами, так и с поспешностью исхода, не ограничивая смысл одной экономической нуждой.
- issue: Референт местоимения в עָלָיו
  choice: с ней, то есть с пасхальной жертвой из предыдущего стиха
  alternative: с ним, то есть с пасхальным приношением или праздником
  rationale: Непосредственный контекст говорит о принесённой пасхальной жертве. Перевод сохраняет межстиховую связь, не вставляя пояснение в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён там, где буквальное воспроизведение еврейской конструкции было бы неестественным, но повтор упоминания выхода из Египта и временной охват всей жизни сохранены.
