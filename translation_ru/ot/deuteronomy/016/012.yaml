  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/מִצְרָ֑יִם וְ/שָׁמַרְתָּ֣ וְ/עָשִׂ֔יתָ אֶת הַֽ/חֻקִּ֖ים הָ/אֵֽלֶּה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: ru
  text: Помни, что ты был рабом в Египте[a], и соблюдай и исполняй эти постановления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское עֶבֶד может означать как раба, так и слугу; здесь «раб» точнее передаёт подневольное положение Израиля в Египте.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Помни
  rationale: Форма с союзом в наставительном контексте передаёт повеление; краткий императив естественен по-русски.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что следует помнить.
- source_word: עֶבֶד
  choice: рабом
  rationale: В контексте египетского угнетения слово обозначает несвободное, подневольное положение; «раб» точнее передаёт эту реальность, чем «слуга».
- source_word: הָיִיתָ
  choice: ты был
  rationale: Простое обозначение состояния в прошлом.
- source_word: בְּמִצְרָיִם
  choice: в Египте
  rationale: Прямое и естественное соответствие предложной конструкции.
- source_word: וְשָׁמַרְתָּ
  choice: соблюдай
  rationale: В контексте закона שׁמר означает хранить верность предписаниям, то есть соблюдать их.
- source_word: וְעָשִׂיתָ
  choice: исполняй
  rationale: В паре с שׁמר глагол подчёркивает практическое осуществление предписанного; «исполняй» естественнее буквального «делай».
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Слово обозначает установленные обязательные предписания; «постановления» подходит современному литературному и юридическому регистру.
- source_word: הָאֵלֶּה
  choice: эти
  rationale: Прямое соответствие указательному определению.
theological_decisions:
- issue: Передача עֶבֶד применительно к пребыванию Израиля в Египте
  choice: раб
  alternative: слуга
  rationale: Контекст напоминает о принудительной зависимости Израиля в Египте. «Раб» сохраняет историческую и богословскую остроту этого напоминания, тогда как «слуга» может неоправданно смягчить смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Пара «соблюдай и исполняй» сохраняет два взаимодополняющих еврейских глагола и звучит естественно в библейско-правовом контексте.
