base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: ru
  text: Справедливости[a], справедливости добивайся, чтобы ты жил и вступил во владение[b] землёй, которую Яхве, твой Бог, даёт тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Праведности, праведности добивайся». Еврейское צֶדֶק может означать и справедливость, и праведность; здесь «справедливость» лучше соответствует судебно-правовому контексту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «унаследовал землю». Еврейский глагол может означать как вступление во владение, так и наследование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: Справедливости, справедливости
  rationale: Удвоение существительного сохранено как выразительное усиление. В контексте наставлений о судьях, неподкупности и беспристрастном суде «справедливость» естественно передаёт прежде всего общественно-правовой смысл слова צֶדֶק, не исключая его значения «праведность».
- source_word: תִּרְדֹּף
  choice: добивайся
  rationale: Глагол רדף буквально означает настойчиво преследовать или гнаться. В русском повелительное «добивайся» сохраняет смысл деятельного, неотступного стремления и естественно сочетается со словом «справедливость».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное отношение между повелением и последующими жизнью и владением землёй.
- source_word: תִּחְיֶה
  choice: ты жил
  rationale: Прямо передаёт значение продолжения жизни, не добавляя более узкого толкования вроде процветания.
- source_word: וְיָרַשְׁתָּ
  choice: и овладел
  rationale: ירשׁ может обозначать вступление во владение, обладание или наследование. «Овладел землёй» кратко и ясно передаёт приобретение владения; возможный оттенок наследования сохранён в сноске.
- source_word: הָאָרֶץ
  choice: землёй
  rationale: «Земля» сохраняет ключевое для Второзакония обозначение обещанной Богом земли и не ослабляет его до общего понятия страны.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохранены форма единственного числа и обращение к Израилю как к одному собеседнику в рамках завета.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Настоящее время естественно передаёт причастие נֹתֵן и изображает землю как совершающийся и несомненный дар Бога.
theological_decisions:
- issue: Значение צֶדֶק в судебно-правовом контексте
  choice: справедливость
  alternative: праведность
  rationale: Ближайший контекст говорит о судьях, взятках и беспристрастии, поэтому на первом плане стоит судебная справедливость. Сноска сохраняет более широкую нравственно-религиозную возможность слова.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Связь повеления с жизнью и владением землёй
  choice: целевое «чтобы» без дополнительного пояснения причинности
  alternative: «для того чтобы» или результативное «и тогда»
  rationale: לְמַעַן допускает оттенки цели и результата. Краткое «чтобы» сохраняет эту связь, не превращая стих в формулу механического воздаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством библейкого наставления. Сохранены эмфатическое повторение, единственное число обращения и личное имя Яхве. Синтаксис сделан ясным для обычного читателя без устранения смысловой широты ключевых еврейских слов.
