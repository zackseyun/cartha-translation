  text: לֹ֥א תוּכַ֖ל לִ/זְבֹּ֣חַ אֶת הַ/פָּ֑סַח בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: ru
  text: Ты не должен приносить пасхальную жертву ни в одном из твоих городов[a], которые Яхве, твой Бог, даёт тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «ворот твоих»; в данном контексте «ворота» метонимически обозначают город или поселение.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Не можешь
  rationale: Сочетание יכל с инфинитивом в данном законодательном контексте выражает запрет, а не просто физическую неспособность; русское «не можешь» сохраняет форму оригинала и естественно передаёт нормативный смысл.
- source_word: לִזְבֹּחַ אֶת הַפָּסַח
  choice: приносить пасхальную жертву
  rationale: זבח обозначает жертвенное заклание или принесение жертвы, а פסח здесь — пасхальное жертвоприношение. Такой перевод ясно выражает культовый смысл без неоправданного сужения до «ягнёнка».
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: ни в одном из твоих городов
  rationale: Вторичное значение «ворота» здесь метонимически указывает на город или поселение. В сочетании с отрицанием «ни в одном» естественно передаёт охват запрета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное covenantное имя Бога, прямо представленное тетраграмматоном в еврейском тексте.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Причастие настоящего времени выражает продолжающееся или характерное действие и соответствует повторяющейся во Второзаконии формуле дара земли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст употребляет собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение הַפָּסַח после глагола זבח
  choice: пасхальная жертва
  alternative: Пасха
  rationale: В данном синтаксическом окружении речь идёт о пасхальном жертвоприношении, но перевод не уточняет вид животного, поскольку сам термин этого здесь не определяет.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранено обращение во втором лице единственного числа. Метонимия «ворота» раскрыта в основном тексте как «города», а буквальный образ отмечен в сноске.
