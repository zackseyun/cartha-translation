  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: ru
  text: 'И не ставь себе каменного столба[a]: Яхве, твой Бог, ненавидит его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стоячего камня», «культового столба». Еврейское слово обозначает установленный вертикально камень, который мог служить предметом или знаком религиозного почитания.'
    reason: 'Лексическое пояснение: מַצֵּבָה имеет предметное значение установленного камня и культовую окраску в данном контексте.'
lexical_decisions:
- source_word: תָקִים
  choice: ставь
  rationale: В породе хифиль глагол קום означает «поставить, воздвигнуть». Русское «ставь» естественно передаёт установку вертикального каменного объекта.
- source_word: לְךָ
  choice: себе
  rationale: Дательный суффикс при запрете естественно передаётся возвратным местоимением «себе», выражающим личную причастность адресата.
- source_word: מַצֵּבָה
  choice: каменного столба
  rationale: מַצֵּבָה обозначает установленный вертикально камень или каменный столб, в данном контексте связанный с почитанием. Основной текст сохраняет конкретный образ, а примечание поясняет культовый контекст без внесения слова «священный» непосредственно в перевод.
- source_word: אֲשֶׁר
  choice: такие столбы
  rationale: Относительная связь перестроена в отдельное поясняющее предложение, поскольку буквальная русская конструкция с неодушевлённым «который» могла бы ошибочно представить столб субъектом глагола «ненавидит». Формулировка относится к запрещённому виду столбов в данном контексте.
- source_word: שָׂנֵא
  choice: ненавидит
  rationale: Прямое соответствие сильному значению глагола שׂנא; формулировка не смягчается до «не одобряет» или «гнушается».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве», а не заменяющим его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет форму прямого обращения, притяжательный суффикс и заветный характер выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Культовая окраска מַצֵּבָה
  choice: каменный столб с пояснением в сноске
  alternative: священный столб; культовый столб; стоячий камень
  rationale: Контекст указывает на предмет религиозного почитания, однако само слово прежде всего называет установленный камень. Перевод сохраняет предметный смысл, а сноска сообщает культовую функцию, не делая её частью самого наименования.
- issue: Объект ненависти Яхве
  choice: «ненавидит такие столбы»
  alternative: «который ненавидит Яхве»; «это ненавистно Яхве»
  rationale: Еврейский относительный оборот относится к запрещённому столбу. Русская перестройка ясно сохраняет Яхве субъектом глагола и столбы объектом, не ослабляя выражения.
translation_notes:
  register: Современный литературный русский язык с прямым запретом в единственном числе. Союз «и» сохранён как связь с предыдущим предписанием. Двоеточие естественно вводит основание запрета; повтор «такие столбы» устраняет синтаксическую двусмысленность русского относительного местоимения.
