  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное заветное имя יהוה; «Яхве» представляет наиболее вероятное произношение и не заменяет имя титулом.
- issue: Значение עֲצֶרֶת
  choice: торжественное собрание
  alternative: священное собрание; заключительное собрание
  rationale: Слово обозначает особое праздничное собрание и, вероятно, может подразумевать завершение праздника, но сам стих не требует однозначно закреплять этот оттенок.
