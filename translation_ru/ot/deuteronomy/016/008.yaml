lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Шесть дней
  rationale: Винительный времени естественно передаёт длительность без дополнительного предлога.
- source_word: תֹּאכַל
  choice: ешь
  rationale: Имперфект в правовом предписании имеет повелительно-нормативную силу; русская форма повелительного наклонения передаёт её ясно и естественно.
- source_word: מַצּוֹת
  choice: пресный хлеб
  rationale: Обычное русское обозначение хлеба без закваски в пасхальном контексте; собирательное единственное естественно передаёт еврейское множественное число.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: а в седьмой день
  rationale: Союз «а» естественно отмечает переход от первых шести дней к особому предписанию для седьмого, не вводя сильного противопоставления.
- source_word: עֲצֶרֶת
  choice: торжественное собрание
  rationale: Передаёт официальное празднично-сакральное собрание, не закрепляя спорный оттенок заключительного собрания.
- source_word: לַיהוָה
  choice: пред Яхве
  rationale: Предлог ל обозначает направленность или посвящённость собрания Богу; «пред Яхве» естественно звучит в культовом контексте, хотя возможно и «для Яхве».
- source_word: אֱלֹהֶיךָ
  choice: твоим Богом
  rationale: Сохраняет обращение к отдельному участнику заветного сообщества и обычную формулу «Яхве, твой Бог».
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: не делай никакой работы
  rationale: Прямо и естественно передаёт запрет совершать работу.
theological_decisions:
