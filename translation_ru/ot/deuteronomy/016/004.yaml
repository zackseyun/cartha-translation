  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: ru
  text: Пусть в течение семи дней на всей твоей территории не будет видно закваски, и пусть от мяса, которое ты принесёшь в жертву вечером, в первый день, ничего не остаётся на ночь до утра.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от плоти». Слово может обозначать мясо жертвенного животного. Выражение «в первый день» может относиться к пасхальной жертве в начале праздника, однако еврейский текст прямо не говорит здесь о пасхальном агнце.'
    reason: Лексическая альтернатива и сохранение неоднозначности относительно жертвы.
lexical_decisions:
- source_word: יֵרָאֶה
  choice: не будет видно
  rationale: Нифаль глагола ראה имеет здесь страдательное значение; эта формулировка естественно передаёт запрет, не превращая его в иной по смыслу приказ.
- source_word: שְׂאֹר
  choice: закваска
  rationale: В контексте Пасхи это точное и понятное обозначение вещества, вызывающего брожение теста; слово «дрожжи» было бы уже по значению.
- source_word: בְּכָל גְּבֻלְךָ
  choice: нигде во всех твоих владениях
  rationale: גְּבוּל здесь обозначает всю подвластную территорию, а не только её границы; «нигде» естественно сочетается с запретительной конструкцией.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Форма длительности в русском языке не требует дополнительного предлога.
- source_word: יָלִין
  choice: не остаётся на ночь
  rationale: Глагол לין означает провести или оставить на ночь; выбранная формулировка ясно передаёт запрет оставлять жертвенное мясо до следующего утра.
- source_word: מִן הַבָּשָׂר
  choice: от мяса … ничего
  rationale: Частичный оборот с מִן естественно передан отрицательной конструкцией «от мяса… ничего»; בָּשָׂר в жертвенном контексте означает мясо, хотя буквально может передаваться как «плоть».
- source_word: אֲשֶׁר תִּזְבַּח
  choice: которое ты принесёшь в жертву
  rationale: זבח обозначает ритуальный закол или жертвоприношение; выражение ясно передаёт культовый характер действия и не сводит его к обычному закланию.
- source_word: בָּעֶרֶב
  choice: вечером
  rationale: Прямое и естественное временное соответствие.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: в первый день
  rationale: Еврейский текст не уточняет «праздника», поэтому такое пояснение не внесено в основной текст.
- source_word: לַבֹּקֶר
  choice: до утра
  rationale: Предлог ל здесь обозначает временной предел; «до утра» точно передаёт его в контексте запрета.
theological_decisions:
- issue: К какому жертвенному мясу относятся слова «в первый день»
  choice: Сохранено общее обозначение мяса, принесённого в жертву, без уточнения «пасхальный агнец».
  alternative: Понимать выражение узко как мясо пасхальной жертвы либо шире как мясо праздничных жертв первого дня.
  rationale: В еврейском тексте сказано лишь о мясе, которое будет принесено в жертву вечером в первый день. Перевод не снимает существующую неоднозначность добавлением отсутствующего в тексте уточнения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Параллельные запреты переданы конструкцией «пусть… не…», обращение во втором лице единственного числа сохранено. Слово «владения» передаёт территориальный охват без архаичного буквального выражения «во всех границах».
