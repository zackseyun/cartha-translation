revisions:
- from: Пусть семь дней нигде во всех твоих владениях не будет видно закваски, и пусть от мяса, которое ты принесёшь в жертву вечером в первый день, ничего не остаётся на ночь до утра.[a]
  to: Пусть в течение семи дней на всей твоей территории не будет видно закваски, и пусть от мяса, которое ты принесёшь в жертву вечером, в первый день, ничего не остаётся на ночь до утра.[a]
  rationale: Заменено стилистически тяжёлое и потенциально неточное «нигде во всех твоих владениях» на «на всей твоей территории». Эта правка сохраняет всеобщий территориальный охват исходного текста и делает русский текст естественным. Сноска сохранена, поскольку она корректно фиксирует лексическую альтернативу и не навязывает решение спорного вопроса о жертве.
