base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: ru
  text: И принеси Яхве, твоему Богу, пасхальную жертву[a] из мелкого и крупного скота в том месте, которое изберёт Яхве, чтобы водворить там Своё имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «пасхальную жертву» здесь связаны с выражением «из мелкого и крупного скота». Некоторые понимают это как указание не только на саму пасхальную жертву, но и на праздничные жертвы, приносившиеся во время Пасхи и праздника Пресных хлебов.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: И принеси … жертву
  rationale: Глагол זבח обозначает жертвенное заклание. Русское «принеси … жертву» естественно передаёт культовое действие и в данном законодательном контексте имеет предписывающую силу.
- source_word: פֶּסַח
  choice: пасхальную жертву
  rationale: Здесь פֶּסַח является прямым дополнением при глаголе «приносить в жертву» и может обозначать пасхальную жертву или обряд. Явное существительное «жертву» делает русский текст естественным, не устраняя отмеченную в сноске неопределённость объёма выражения.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твоему Богу
  rationale: Предлог ל обозначает посвящение жертвы адресату. Форма «Яхве, твоему Богу» сохраняет личное имя יהוה и естественный русский порядок слов.
- source_word: צֹאן וּבָקָר
  choice: из мелкого и крупного скота
  rationale: Собирательные термины צֹאן и בָּקָר охватывают соответственно мелкий и крупный скот; предлог «из» выражает подразумеваемый выбор жертвенных животных из этих категорий, не сужая их до отдельных видов.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: на том месте, которое изберёт Яхве
  rationale: «На том месте» естественно обозначает установленное место богослужения, а будущее «изберёт» передаёт несовершенный вид еврейского глагола относительно речи Моисея.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы там обитало Его имя
  rationale: 'Масоретская форма выражает причинность, однако по-русски конструкция цели «чтобы … обитало» естественно передаёт результат: Яхве избирает место для пребывания Своего имени. Сохранён библейский образ имени как знака Божьего присутствия и принадлежности.'
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и соответствует предоставленному богословскому решению.
- issue: Объём понятия פֶּסַח при упоминании мелкого и крупного скота
  choice: Сохранить формулировку «пасхальную жертву … из мелкого и крупного скота» и пояснить неоднозначность в сноске
  alternative: Истолковать в основном тексте как пасхальную жертву вместе с праздничными жертвами
  rationale: Упоминание крупного скота шире предписания о пасхальном ягнёнке или козлёнке. Основной текст не должен без необходимости решать, включает ли выражение только пасхальную жертву или также связанные с праздником приношения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Повелительная форма передаёт законодательный характер стиха; архаизмы сведены к уместному «изберёт». Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции.
