  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: ru
  text: Праздник Шалашей отмечай семь дней[a], когда будешь собирать урожай с гумна и из виноградной давильни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
