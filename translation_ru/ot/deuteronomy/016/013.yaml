lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: Праздник шалашей
  rationale: חַג обозначает религиозный праздник, а סֻכּוֹת — шалаши, то есть временные укрытия. Такой перевод прозрачен для современного читателя и не смешивает их со святилищем.
- source_word: תַּעֲשֶׂה לְךָ
  choice: отмечай
  rationale: В сочетании с названием праздника עשה означает не буквальное «сделай», а соблюдение или празднование; повелительная форма сохраняет обязательный характер предписания.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Прямое и естественное обозначение продолжительности праздника.
- source_word: בְּאָסְפְּךָ
  choice: когда соберёшь урожай
  rationale: Предлог ב с инфинитивом передаёт временное обстоятельство. Слово «урожай» делает подразумеваемый объект глагола אסף ясным по контексту, не превращая временную связь в более узкое «после того как».
- source_word: מִגָּרְנְךָ
  choice: с гумна
  rationale: גֹּרֶן — гумно, место молотьбы и обработки зерна; сохранён конкретный сельскохозяйственный образ исходного текста.
- source_word: וּמִיִּקְבֶךָ
  choice: и из виноградной давильни
  rationale: יֶקֶב обозначает давильню или ёмкость, связанную с выжиманием винограда. Уточнение «виноградной» обеспечивает ясность в современном русском языке.
