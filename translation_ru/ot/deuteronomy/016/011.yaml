revisions:
- from: И радуйся пред Яхве, твоим Богом, — ты, твой сын и твоя дочь, твой раб и твоя рабыня, левит, который живёт в твоём городе,[a] переселенец,[b] сирота и вдова, которые живут среди вас, — на месте, которое Яхве, твой Бог, изберёт, чтобы поселить там Своё имя.[c]
  to: И радуйся перед Яхве, твоим Богом, — ты, твой сын и твоя дочь, твой раб и твоя рабыня, левит, который живёт в твоём городе,[a] пришелец,[b] сирота и вдова, которые живут среди тебя, — на месте, которое Яхве, твой Бог, изберёт, чтобы поселить там Своё имя.[c]
  rationale: Исправлено «среди вас» на «среди тебя» в соответствии с единственным числом еврейского суффикса. «Переселенец» заменён на «пришелец», а сноска уточнена, чтобы точнее передать גֵּר без внесения излишних историко-правовых деталей. Остальные формулировки сохранены, поскольку они передают исходный текст и соответствуют современному литературному регистру.
