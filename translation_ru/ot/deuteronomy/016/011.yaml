base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: ru
  text: И радуйся перед Яхве, твоим Богом, — ты, твой сын и твоя дочь, твой раб и твоя рабыня, левит, который живёт в твоём городе,[a] пришелец,[b] сирота и вдова, которые живут среди тебя, — на месте, которое Яхве, твой Бог, изберёт, чтобы поселить там Своё имя.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих воротах»; то есть в твоём городе или местной общине.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «житель-чужеземец». Еврейское слово обозначает человека неместного происхождения, живущего среди израильской общины.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы Его имя пребывало там». Еврейская форма выражает действие: «чтобы поселить там Своё имя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: И радуйся
  rationale: Императив естественно передаёт предписывающую силу еврейской формы в контексте праздничного установления и сохраняет торжественный тон.
- source_word: לִפְנֵי
  choice: пред
  rationale: Кратко и точно передаёт значение «перед, в присутствии», сохраняя богослужебный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: твой раб и твоя рабыня
  rationale: Сохраняет обозначенный исходным текстом зависимый социальный статус и различие по полу; слово «слуга» могло бы неоправданно смягчить смысл.
- source_word: בִּשְׁעָרֶיךָ
  choice: в твоём городе
  rationale: Буквально «в твоих воротах»; в законодательной речи Второзакония ворота метонимически обозначают город или местную общину. Современный русский перевод передаёт подразумеваемое значение.
- source_word: וְהַגֵּר
  choice: переселенец
  rationale: Обозначает живущего среди израильтян человека неместного происхождения, включённого в их общественный уклад; «чужеземец» могло бы ошибочно подразумевать лишь временного иностранца.
- source_word: וְהַיָּתוֹם
  choice: сирота
  rationale: Естественный современный русский эквивалент для социально уязвимого ребёнка, лишённого отцовской защиты.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы поселить там Своё имя
  rationale: Передаёт каузативный смысл формы שׁכן и сохраняет характерную для Второзакония формулу Божьего имени, не сводя её к простой установке святилища.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное заветное имя; транслитерация сохраняет это различие.
- issue: Статус עבד и אמה
  choice: раб и рабыня
  alternative: слуга и служанка
  rationale: В данном социально-правовом перечне зависимый статус существенен; более мягкая лексика могла бы его скрыть.
- issue: Формула пребывания Божьего имени
  choice: чтобы поселить там Своё имя
  alternative: чтобы Его имя пребывало там
  rationale: Выбранный вариант отражает каузативную форму глагола и одновременно сохраняет богословское напряжение между присутствием Бога и пребыванием Его имени.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис перечня упрощён без потери его состава; единственное число обращённого «ты» сохранено, а «среди вас» отражает переход исходного текста к коллективной общине. Местоимение «Своё» написано с прописной буквы по принятому русскому благоговейному употреблению.
