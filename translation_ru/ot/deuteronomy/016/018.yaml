  source_fidelity: 'Смысловые элементы еврейского текста переданы верно: предписание дано во 2-м лице единственного числа; названы судьи и административные должностные лица; сохранены «ворота», племенная организация, имя Яхве и требование справедливого суда. Однако «надзиратели» в современном русском языке обычно обозначает лиц, осуществляющих надзор, и неоправданно сужает/смещает административную роль שֹׁטְרִים.'
