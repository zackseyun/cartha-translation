  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: ru
  text: Назначь себе судей и должностных лиц во всех твоих воротах[a], которые Яхве, твой Бог, даёт тебе, по твоим племенам; пусть они судят народ по справедливости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всех твоих городах». Буквально: «во всех твоих воротах»; городские ворота были местом общественного управления и суда.'
    reason: Культурное пояснение буквального образа и возможного метонимического значения.
  - marker: b
    text: 'Или: «праведным судом».'
    reason: Лексическая альтернатива для מִשְׁפַּט צֶדֶק; основной текст передаёт тот же смысл естественным современным оборотом.
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: судей
  rationale: Существительное обозначает людей, выносящих судебные решения; «судьи» — прямой и ясный эквивалент в данном правовом контексте.
- source_word: שֹׁטְרִים
  choice: надзирателей
  rationale: Термин обозначает должностных лиц, обеспечивавших административный порядок и исполнение решений. «Надзиратели» сохраняет институциональный смысл, не сводя их роль к писцам.
- source_word: תִּתֶּן
  choice: поставь
  rationale: Буквально глагол означает «дать/поместить», но здесь речь идёт о назначении на должность. «Поставь» естественно передаёт этот смысл и сохраняет форму повеления, выраженную древнееврейским имперфектом в предписании.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: во всех твоих воротах
  rationale: Сохранён буквальный образ городских ворот — мест общественного управления и суда; культурное значение пояснено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: לִשְׁבָטֶיךָ
  choice: по твоим племенам
  rationale: Предлог לְ здесь допускает значение распределения или организации назначений в соответствии с племенной структурой; краткая формулировка сохраняет эту связь.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: и пусть они судят народ
  rationale: Глагол употреблён в собственно судебном смысле. Конструкция с «пусть» естественно передаёт предписывающее продолжение фразы.
- source_word: מִשְׁפַּט צֶדֶק
  choice: праведным судом
  rationale: Сочетание объединяет правовой смысл решения и нравственное требование справедливости; «праведным судом» сохраняет обе стороны выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя, не подменяя его титулом.
- issue: Смысл выражения מִשְׁפַּט צֶדֶק
  choice: праведным судом
  alternative: справедливым судом
  rationale: «Праведный» сохраняет одновременно юридическое и нравственно-богословское измерение слова צֶדֶק; более обыденный вариант «справедливый» указан в сноске, чтобы не устранять допустимую смысловую оттеночность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены обращение в единственном числе, образ городских ворот и личное имя Яхве; синтаксис упрощён лишь настолько, чтобы стих естественно читался по-русски.
