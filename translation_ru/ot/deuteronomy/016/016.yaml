  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: ru
  text: 'Три раза в год все мужчины твоего народа должны предстать[a] перед Яхве, твоим Богом, в месте, которое Он изберёт: в праздник Пресных хлебов, в праздник Недель и в праздник Шалашей[b]. Никто не должен представать перед Яхве с пустыми руками[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «будет виден перед Яхве»; здесь еврейская глагольная форма служит выражением явки человека в Божье присутствие.'
    reason: lexical_alternative
  - marker: b
    text: Традиционное название — «праздник Кущей».
    reason: alternative_reading
  - marker: c
    text: То есть без положенного дара или приношения.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: должен предстать
  rationale: Нифаль глагола ראה буквально допускает значение «быть увиденным», но здесь служит устойчивым выражением для явки человека пред Богом; «предстать» естественно передаёт этот смысл и сохраняет торжественный юридико-культовый оттенок.
- source_word: כָל זְכוּרְךָ
  choice: каждый мужчина из твоего народа
  rationale: Еврейское выражение прямо обозначает лиц мужского пола, обязанных участвовать в паломничестве. Формулировка сохраняет мужской референт и звучит естественнее, чем буквальное «весь твой мужской пол».
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: перед Яхве, твоим Богом
  rationale: Оборот с «лицом» обозначает пребывание в чьём-либо присутствии. Русское «перед» передаёт идиому без ненужной буквальности, а местоимение единственного числа сохранено.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: в месте, которое Он изберёт
  rationale: Будущее время сохраняет направленность несовершенного вида и характерную для Второзакония тему места, избираемого Богом.
- source_word: חַג הַמַּצּוֹת
  choice: праздник Пресных хлебов
  rationale: Название прозрачно передаёт מַצּוֹת и понятно современному читателю; оно предпочтено менее общеупотребительному «Опресноков».
- source_word: חַג הַשָּׁבֻעוֹת
  choice: праздник Недель
  rationale: Сохранено буквальное древнееврейское название праздника без внесения более позднего греческого названия «Пятидесятница».
- source_word: חַג הַסֻּכּוֹת
  choice: праздник Шалашей
  rationale: «Шалаши» непосредственно и понятно передают סֻכּוֹת; традиционное название «Кущи» приведено в примечании.
- source_word: וְלֹא יֵרָאֶה אֶת־פְּנֵי יְהוָה רֵיקָם
  choice: Никто не должен представать перед Яхве с пустыми руками
  rationale: Отрицание при обобщённом единственном числе естественно передано словом «никто». Выражение «с пустыми руками» сохраняет идиому и в данном культовом контексте подразумевает отсутствие дара или приношения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное заветное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Круг лиц, на которых возложена обязанность
  choice: каждый мужчина из твоего народа
  alternative: все у тебя; весь народ
  rationale: כָל זְכוּרְךָ прямо указывает на мужчин. Обобщение до всего населения устранило бы юридически значимое указание исходного текста.
- issue: Значение формы יֵרָאֶה
  choice: предстать перед Богом
  alternative: быть увиденным перед Богом
  rationale: Форма допускает буквальное пассивное прочтение, однако в контексте паломнических праздников функционирует как выражение явки в Божье присутствие. Примечание сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис правовой нормы сохранён, но кальки с древнееврейского устранены. Названия праздников даны единообразно и понятно; прописное «Он» следует принятой русской благоговейной письменной норме, не добавляя толкования.
