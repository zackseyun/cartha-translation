source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: ru
  text: И отпразднуй праздник Недель в честь Яхве, твоего Бога, с добровольным приношением, которое ты дашь по мере своих возможностей[a], сообразно тому, как благословит тебя Яхве, твой Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по мере добровольного приношения твоей руки». Еврейское выражение указывает на добровольный дар, соразмерный возможностям дающего и полученному от Бога благословению.'
    reason: Лексически редкое מִסַּת и образное выражение נִדְבַת יָדְךָ допускают более буквальное понимание как «мера добровольного приношения твоей руки».
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Тогда отпразднуй
  rationale: В сочетании с חַג глагол עשה означает совершать, отмечать праздник. «Тогда» естественно передаёт последовательность в контексте, а повелительная форма соответствует русской передаче еврейского предписания во втором лице.
- source_word: חַג שָׁבֻעוֹת
  choice: праздник Недель
  rationale: Сохраняется традиционное название паломнического праздника, связанное с отсчётом недель.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: в честь Яхве, твоего Бога
  rationale: Предлог ל обозначает посвящённость праздника Богу; «в честь» звучит по-русски естественно и не сводит выражение лишь к направлению действия.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: добровольный дар из своих рук[a]
  rationale: נִדְבָה передано как добровольный дар, а образ руки сохранён. Редкое מִסַּת допускает понимание меры или соразмерности; эта оттеночная неоднозначность вынесена в примечание, поскольку следующая фраза прямо задаёт меру дара Божьим благословением.
- source_word: אֲשֶׁר תִּתֵּן
  choice: и принеси
  rationale: Относительная конструкция «который ты дашь» естественно свёрнута в однородное предписание без изменения смысла; в культовом контексте «принести дар» точнее обычного «дать».
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: сообразно тому, как благословит тебя
  rationale: Передаёт пропорциональную зависимость размера добровольного дара от полученного Божьего благословения, не устанавливая конкретной суммы.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Личное имя יהוה передано как «Яхве», а повтор заветной формулы сохранён.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя Бога. Транслитерация «Яхве» сохраняет его отличие от титула «Господь».
- issue: Основание и размер добровольного дара
  choice: Дар доброволен и соразмерен Божьему благословению
  alternative: Фиксированная обязательная дань
  rationale: נִדְבָה прямо указывает на добровольность, а כַּאֲשֶׁר יְבָרֶכְךָ связывает меру дара с Божьим благословением; перевод не вводит установленной доли.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён ради ясности, но название праздника, имя Яхве, добровольный характер дара и образ рук сохранены; подлинная лексическая неоднозначность отмечена в сноске.
