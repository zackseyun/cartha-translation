  to: И отпразднуй праздник Недель в честь Яхве, твоего Бога, с добровольным приношением, которое ты дашь по мере своих возможностей[a], сообразно тому, как благословит тебя Яхве, твой Бог.
  rationale: 'Исправление восстанавливает пропущенный смысловой компонент מִסַּת, заменяет неестественное «из своих рук» современной русской идиомой и сохраняет в основном тексте все элементы еврейского предписания: празднование, посвящённость Яхве, добровольное приношение, личное предоставление дара и его соразмерность Божьему благословению.'
