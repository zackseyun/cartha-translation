  terminology: «Яхве», «пасхальная жертва», «заход солнца» и обращение во втором лице единственного числа уместны. «Водворить там Своё имя» сохраняет традиционный библейский регистр, оставаясь понятным современному читателю, и точнее отражает лексико-грамматическую форму оригинала.
