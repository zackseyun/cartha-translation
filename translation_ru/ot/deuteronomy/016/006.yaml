base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: ru
  text: Но только в том месте, которое изберёт Яхве, твой Бог, чтобы водворить там Своё имя[a], там приноси пасхальную жертву[b] вечером, при заходе солнца, в установленное время твоего выхода из Египта[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «чтобы там пребывало Его имя» или «чтобы поместить там Своё имя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закалывай Пасху», то есть пасхальную жертву.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в назначенное время твоего выхода из Египта».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: но только
  rationale: Передаёт сильное ограничение, противопоставленное запрету предыдущего стиха совершать жертвоприношение в любом из городов.
- source_word: הַמָּקוֹם
  choice: место
  rationale: Обычное и естественное соответствие; в контексте Второзакония обозначает избранное Богом место богослужения.
- source_word: יִבְחַר
  choice: изберёт
  rationale: Имперфект имеет здесь перспективное, будущее значение; «изберёт» сохраняет возвышенный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы там пребывало Его имя
  rationale: Сохраняет древнееврейский образ пребывания имени и при этом естественно звучит по-русски; каузативное прочтение отмечено в сноске.
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: приноси пасхальную жертву
  rationale: В культовом контексте זבח означает жертвенное заклание; выражение ясно показывает, что הַפֶּסַח здесь обозначает пасхальную жертву, а не только праздник.
- source_word: בָּעָרֶב
  choice: вечером
  rationale: Прямое и естественное временное обозначение.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: при заходе солнца
  rationale: Точно передаёт идиому, буквально связанную с «вхождением» солнца, то есть его заходом.
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: в то назначенное время, когда ты вышел из Египта
  rationale: Сохраняет значение מוֹעֵד как установленного времени и естественно раскрывает связь с исходом Израиля из Египта.
theological_decisions:
- issue: Формула пребывания Божьего имени в избранном месте
  choice: чтобы там пребывало Его имя
  alternative: чтобы поселить там Своё имя / чтобы поместить там Своё имя
  rationale: Основной текст сохраняет богословски значимый образ пребывающего имени, не отождествляя его без пояснений с физической локализацией самого Бога. Возможная каузативность формы לְשַׁכֵּן оставлена открытой в сноске.
- issue: Значение הַפֶּסַח как объекта глагола жертвоприношения
  choice: пасхальная жертва
  alternative: Пасха / пасхальный агнец
  rationale: Контекст требует жертвенного объекта, но текст не уточняет вид животного словом «агнец», поэтому перевод не добавляет эту конкретизацию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «изберёт» и «пребывало» сохраняют достоинство текста, оставаясь понятными. Единственное число «твой/ты» отражает древнееврейское обращение к Израилю как к единому народу. Маркеры сносок размещены непосредственно после соответствующих выражений.
