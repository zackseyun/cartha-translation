base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: ru
  text: Семь дней празднуй праздник в честь Яхве, твоего Бога, на месте, которое изберёт Яхве, потому что Яхве, твой Бог, благословит тебя во всём твоём урожае и во всяком деле твоих рук, и ты будешь исполнен радости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и будешь только радоваться»; или: «и непременно будешь радоваться». Еврейское выражение подчёркивает полноту, безраздельность радости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּחֹג
  choice: празднуй праздник
  rationale: Глагол חָגַג означает совершать или праздновать паломнический праздник; сочетание сохраняет культово-праздничный смысл, а не сводит его к общему веселью.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל указывает на посвящённость и направленность праздника Яхве; по-русски это естественно передаётся выражением «в честь».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени сохраняет тетраграмматон как имя Бога Израиля, а не заменяет его титулом.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: на месте, которое изберёт Яхве
  rationale: Формулировка близко передаёт указание на избранное Богом место поклонения и звучит естественно в современном русском языке.
- source_word: כִּי
  choice: потому что
  rationale: В данном контексте союз вводит основание для празднования и радости — Божье благословение.
- source_word: יְבָרֶכְךָ
  choice: благословит тебя
  rationale: Сохраняется обычная заветная лексика Божьего благословения без сужения смысла до материального преуспевания.
- source_word: תְּבוּאָתְךָ
  choice: твоём урожае
  rationale: Слово обозначает сельскохозяйственный продукт или урожай; «урожай» ясно и естественно в данном праздничном контексте.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: деле твоих рук
  rationale: Сохранён понятный русский библейский образ, обозначающий человеческий труд и его результаты.
- source_word: וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: и ты будешь исполнен радости
  rationale: Передаёт состояние человека и усилительную силу אַךְ как полноту, не устраняя возможный оттенок ограничения, отмеченный в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл заключительной фразы וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: и ты будешь исполнен радости
  alternative: и будешь только радоваться; и непременно будешь радоваться
  rationale: אַךְ допускает ограничительный либо усилительный оттенок. Основной текст естественно выражает полноту радости, а сноска сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы единственного числа сохранены по еврейскому тексту; употреблено «изберёт» как уместная высокая, но понятная форма. Сноска отмечена в основном тексте.
