  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: семидневное празднование, его посвящённость Яхве, избранное Им место, причинную связь с благословением, урожай, труд рук и усиленное заключительное утверждение о радости. «Исполнен радости» удачно передаёт предикативное שָׂמֵחַ с усилительным אַךְ, не навязывая спорный узко-ограничительный смысл «только».'
