base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: ru
  text: Не сажай себе Ашеру[a] — дерево любого вида — рядом с жертвенником Яхве, твоего Бога, который ты сделаешь себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столб Ашеры». Еврейское אֲשֵׁרָה может обозначать не только богиню Ашеру, но и связанное с её почитанием культовое дерево или деревянный предмет.'
    reason: Альтернативное понимание семантически неоднозначного культового термина.
lexical_decisions:
- source_word: תִטַּע
  choice: сажай
  rationale: Глагол נטע обычно означает «сажать». Такое соответствие сохраняет древесную образность и намеренно не сглаживает необычное сочетание с культовым объектом до «устанавливать».
- source_word: אֲשֵׁרָה
  choice: Ашеру
  rationale: Транслитерация сохраняет возможность понимать слово и как имя богини, и как обозначение связанного с ней культового дерева или деревянного предмета; сноска разъясняет эту неоднозначность.
- source_word: כָּל עֵץ
  choice: из какого бы то ни было дерева
  rationale: Передаёт всеохватность כָּל и древесное значение עֵץ, естественно связывая оборот с Ашерой без ограничения какой-либо породой дерева.
- source_word: אֵצֶל
  choice: рядом с
  rationale: Конкретно и естественно передаёт пространственную близость, выраженную אֵצֶל.
- source_word: מִזְבַּח
  choice: жертвенником
  rationale: Обычное и точное русское соответствие для מזבח.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохраняет обращение во втором лице единственного числа и заветный характер формулы.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: который ты сделаешь себе
  rationale: «Сделаешь» близко широкому значению עשה, а «себе» передаёт לָּךְ, не подменяя глагол более узким «построишь».
theological_decisions:
- issue: Обозначает ли אֲשֵׁרָה богиню Ашеру или связанный с её культом предмет
  choice: Сохранить транслитерацию «Ашера» в основном тексте и пояснить её в сноске.
  alternative: «столб Ашеры», «священное дерево Ашеры» или «деревянный идол Ашеры»
  rationale: 'В данном контексте значение спорно: слово может указывать на богиню, её символ либо культовое дерево или деревянный предмет. Транслитерация не устраняет заложенную в еврейском тексте неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с лаконичным правовым повелением во втором лице единственного числа. Необычный образ «сажать Ашеру» сохранён вслед за еврейским текстом; фраза не сглажена до конфессионально или археологически более определённого толкования.
