base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: ru
  text: Пусть каждый мужчина даст по своим возможностям[a], в соответствии с благословением Яхве, твоего Бога, которое Он дал тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по дару его руки» — то есть в соответствии с тем, что он может дать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: каждый мужчина
  rationale: Существительное употреблено дистрибутивно и в контексте предписания мужчинам (ст. 16) сохраняет мужское значение.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: по своим возможностям
  rationale: Буквально «по дару своей руки»; это идиома о том, что человек располагает возможностью принести. Естественный русский перевод передаёт меру дара, а буквальный образ отмечен в сноске.
- source_word: כְּבִרְכַּת
  choice: сообразно благословению
  rationale: 'Предлог כ указывает на меру или соответствие: размер приношения должен отвечать полученному благословению.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет форму единственного числа и обращение к Израилю как к одному адресату.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: которое дал ему
  rationale: По смыслу местоимение относится к каждому мужчине, хотя в еврейском сохраняется второе лицо «тебе» в обращении к собирательному Израилю. Русское согласование с ближайшим дистрибутивным субъектом делает фразу естественной.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Материальный оттенок слова «благословение»
  choice: сохранено общее слово «благословение»
  alternative: достаток, которым благословил
  rationale: В контексте речь включает материальное обеспечение, однако исходное слово шире; перевод не ограничивает его значение без необходимости.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Глагол «пусть даст» восстановлен по смыслу эллиптической еврейской конструкции и контексту приношений; «сообразно» точно выражает пропорциональность и остаётся понятным.
