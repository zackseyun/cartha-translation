lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת
  choice: семь недель
  rationale: В календарном контексте שָׁבֻעֹת обозначает недели, хотя слово этимологически связано с числом семь. Русское «семь недель» ясно передаёт смысл и сохраняет структуру счёта.
- source_word: תִּסְפָּר לָךְ
  choice: отсчитай себе
  rationale: Форма תִּסְפָּר выражает предписание, а לָךְ — личную отнесённость действия; «отсчитай себе» сохраняет оба элемента и звучит по-русски естественнее буквального «будешь считать для себя».
- source_word: מֵהָחֵל
  choice: с того времени, как
  rationale: Предлог מִן с инфинитивом обозначает исходный момент отсчёта; выбранная конструкция естественно передаёт временное значение.
- source_word: חֶרְמֵשׁ
  choice: серп
  rationale: חֶרְמֵשׁ — серп, употребляемый при жатве; в русском родовое значение не требует артиклевой конкретизации.
- source_word: בַּקָּמָה
  choice: по стоящему хлебу
  rationale: קָמָה означает хлеб или злаки, ещё стоящие на корню. «Стоящий хлеб» — понятное земледельческое выражение, а предлог «по» естественно сочетается с образом движения серпа.
- source_word: תָּחֵל לִסְפֹּר
  choice: начинай отсчитывать
  rationale: Сочетание глагола начала с инфинитивом ספר прямо указывает на начало счёта; несовершенный императивный оборот передаёт предписание естественным современным русским языком.
