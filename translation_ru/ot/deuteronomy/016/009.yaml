  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: ru
  text: Отсчитай семь недель[a]. С того времени, как серп коснётся хлеба на корню, начинай отсчитывать семь недель.
  philosophy: optimal-equivalence
  footnotes:
