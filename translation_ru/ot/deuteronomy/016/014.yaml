  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: ru
  text: Радуйся во время своего праздника[a] — ты, твой сын и твоя дочь, твой раб и твоя рабыня, левит, переселенец[b], сирота[c] и вдова, живущие в твоих городах[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «на своём празднике». Еврейское חַג может обозначать как сам праздник, так и праздничное торжество.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть некоренной житель, поселившийся среди израильтян; возможные переводы: «постоянно живущий иноземец», «пришелец».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может особо указывать на ребёнка, лишившегося отца и связанной с ним защиты.
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «которые в твоих воротах». Городские ворота здесь обозначают города и находящиеся под их управлением общины.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Радуйся
  rationale: Форма перфекта с союзом в контексте предписания имеет повелительное значение. Русский императив естественно и ясно передаёт обязательный характер наставления.
- source_word: בְּחַגֶּךָ
  choice: во время своего праздника
  rationale: חַג обозначает религиозный праздник и праздничное торжество, особенно паломнический праздник. Выражение передаёт как время, так и участие в праздновании.
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение подчёркивает адресата и естественно открывает следующий за тире перечень.
- source_word: וּבִנְךָ וּבִתֶּךָ
  choice: твой сын и твоя дочь
  rationale: Прямое соответствие еврейским терминам родства; единственное число имеет распределительное значение в обращённом к каждому израильтянину законе.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: твой раб и твоя рабыня
  rationale: עֶבֶד и אָמָה обозначают зависимых мужчин и женщин, в том числе находящихся в рабском состоянии. «Раб» и «рабыня» не смягчают названный в данном социально-правовом перечне статус.
- source_word: וְהַלֵּוִי
  choice: левит
  rationale: Обычное русское обозначение члена колена Левия, связанного с религиозным служением.
- source_word: וְהַגֵּר
  choice: переселенец
  rationale: גֵּר — не коренной израильтянин, постоянно живущий среди Израиля и обладающий особым правовым статусом. «Переселенец» передаёт проживание среди местного населения без архаизма «пришелец».
- source_word: וְהַיָּתוֹם
  choice: сирота
  rationale: יָתוֹם обозначает ребёнка, лишённого отцовской защиты, и шире — сироту как уязвимую социальную категорию. «Сирота» является естественным современным русским соответствием.
- source_word: וְהָאַלְמָנָה
  choice: вдова
  rationale: Точное и общепринятое обозначение названной в тексте уязвимой социальной категории.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: живущие в твоих городах
  rationale: Буквально сказано «которые в твоих воротах», но «ворота» здесь метонимически обозначают населённые пункты и местное сообщество. В основном тексте смысл идиомы передан естественным русским выражением.
theological_decisions:
- issue: Социальный статус עֶבֶד и אָמָה
  choice: раб и рабыня
  alternative: слуга и служанка
  rationale: В перечне членов хозяйства и социально зависимых лиц слова допускают широкий диапазон от слуги до раба, однако здесь существен зависимый, несвободный статус. Перевод сохраняет эту неудобную историческую реальность, не одобряя и не смягчая её.
- issue: Статус גֵּר
  choice: переселенец
  alternative: чужеземец; пришелец; постоянно живущий иноземец
  rationale: Речь не просто об иностранце, а о некоренном жителе, поселившемся среди Израиля. Выбор сохраняет включение такого жителя в общую праздничную радость и не переносит на текст современные юридические категории миграции.
- issue: Значение יָתוֹם
  choice: сирота
  alternative: лишённый отца
  rationale: Русское «сирота» естественно обозначает уязвимого ребёнка, тогда как примечание сохраняет возможный более узкий акцент древнееврейского слова на утрате отца и его защиты.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Повелительное «Радуйся» звучит естественнее буквального будущего времени. Перечень сохранён без усложнения синтаксиса; древнееврейская идиома о воротах раскрыта в тексте как «в твоих городах», а буквальная форма отмечена в сноске.
