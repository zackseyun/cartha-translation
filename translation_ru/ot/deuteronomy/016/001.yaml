  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: ru
  text: Соблюдай месяц Авив[a] и совершай Пасху в честь Яхве, твоего Бога, потому что в месяце Авив Яхве, твой Бог, вывел тебя ночью из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Авив — название месяца, связанное с ранним созреванием зерна; возможный перевод: «весенний месяц».'
    reason: Лексема אָבִיב может обозначать как стадию созревания зерна, так и связанный с ней сезон или календарный месяц.
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Соблюдай
  rationale: Императив требует не просто помнить о месяце, а тщательно соблюдать связанное с ним календарное предписание.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: месяц авив
  rationale: В данном контексте выражение служит календарным обозначением месяца, название которого связано с ранним созреванием зерна; транслитерация сохраняет эту конкретность.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: и совершай Пасху
  rationale: Буквально «делай Пасху»; «совершай» естественно передаёт исполнение предписанного пасхального обряда и подходит к юридическому контексту.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל выражает направленность и посвящённость празднования Богу; русское «в честь» ясно и естественно передаёт это отношение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: הוֹצִיאֲךָ
  choice: вывел тебя
  rationale: Каузативная форма глагола יצא обозначает выведение из Египта; «вывел» является точной и естественной русской формулировкой.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог מן обозначает исходный пункт движения; в сочетании с «вывел» нормативно переводится «из Египта».
- source_word: לָיְלָה
  choice: ночью
  rationale: Наречное употребление указывает на время исхода; «ночью» кратко и естественно сохраняет акцент текста.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблено личное имя Бога. Форма «Яхве» сохраняет имя, а не заменяет его титулом.
- issue: Понимание אָבִיב как названия месяца или указания на весну
  choice: авив как календарное обозначение
  alternative: весенний месяц; месяц весны
  rationale: В законодательном контексте выражение указывает на определённый месяц пасхального календаря. Вариант «весна» ослабил бы эту календарную конкретность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Единственное число «тебя» сохранено по еврейскому тексту как обращение к Израилю. Формулировка избегает архаизмов и при этом сохраняет императивную силу стиха.
