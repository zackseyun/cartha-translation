  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: ru
  text: И неукоснительно исполняйте все постановления и законы, которые я сегодня даю вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые я даю перед вами сегодня»; еврейское выражение означает, что предписания предъявляются народу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: тщательно исполняйте
  rationale: Сочетание שׁמר с инфинитивом עשה выражает требование внимательно следить за исполнением предписаний. Русское «тщательно исполняйте» естественно передаёт как директивную силу, так и смысл заботливого соблюдения.
- source_word: כָּל
  choice: все
  rationale: Передаёт полноту требования и естественно сочетается с двумя существительными во множественном числе.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: חֻקִּים обозначает установленные предписания; «постановления» сохраняет юридико-заветный регистр и отличается от следующего מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: В данном перечне מִשְׁפָּטִים относится к обязательным правовым нормам. «Законы» понятно современному читателю и сохраняет различие с «постановлениями», хотя возможны также «судебные решения» или «правила».
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם
  choice: которые я предлагаю вам
  rationale: Буквально נתן לפני — «даю/кладу перед вами»; в контексте провозглашения закона это означает представить предписания для принятия и исполнения. «Предлагаю вам» естественно передаёт идиому, не превращая её в необязательный совет благодаря повелительному контексту.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и прямой эквивалент, сохраняющий временную непосредственность обращения.
