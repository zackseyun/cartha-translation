base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: ru
  text: 'то Я дам вашей земле дождь в своё время: ранний и поздний дождь[a], — и ты соберёшь своё зерно, молодое вино[b] и масло[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть первые осенние и поздние весенние дожди.
    reason: cultural_note
  - marker: b
    text: То есть свежее вино нового урожая; возможно также просто «вино».
    reason: lexical_alternative
  - marker: c
    text: То есть оливковое масло.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: то Я дам
  rationale: Перфект с союзом в условной последовательности выражает последующее обещанное действие; «то» естественно связывает стих с условием предыдущего контекста.
- source_word: מְטַר אַרְצְכֶם
  choice: вашей земле дождь
  rationale: מָטָר обозначает необходимый для земледелия дождь, а אֶרֶץ здесь — землю Израиля, не современное политическое государство.
- source_word: בְּעִתּוֹ
  choice: в своё время
  rationale: Передаёт дождь, приходящий в надлежащий, установленный для него срок, и сохраняет местоименную связь с единственным числом מְטַר.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: ранний и поздний дождь
  rationale: 'Речь о двух сезонных дождях: первых осенних и поздних весенних. Эта парная формулировка кратка и сохраняет временное противопоставление еврейского текста.'
- source_word: וְאָסַפְתָּ
  choice: и ты соберёшь
  rationale: Глагол означает собирать урожай. Единственное число «ты» сохраняет заметный переход от множественного «вашей» к собирательному обращению к Израилю в единственном числе.
- source_word: דְגָנֶךָ
  choice: своё зерно
  rationale: דָּגָן — широкое обозначение зерновых продуктов; «зерно» понятно и не сужает значение до конкретной культуры.
- source_word: וְתִירֹשְׁךָ
  choice: молодое вино
  rationale: תִּירוֹשׁ обычно обозначает свежее вино или виноградный продукт нового урожая; «молодое вино» сохраняет эту особенность, не превращая его в неперебродивший сок.
- source_word: וְיִצְהָרֶךָ
  choice: масло
  rationale: В традиционной земледельческой триаде יִצְהָר означает оливковое масло. Краткое «масло» сохраняет ритм перечисления, а вид масла пояснён в сноске.
theological_decisions:
- issue: Земледельческое благословение в контексте завета
  choice: Передать как конкретное обещание своевременного дождя и урожая для Израиля в земле.
  alternative: Истолковать дождь преимущественно как духовный, сакраментальный, эсхатологический символ или как общее обещание материального процветания.
  rationale: Еврейский текст непосредственно говорит о земледельческом благословении в рамках завета. Перевод не должен вносить в основной текст более поздние символические толкования.
- issue: Смена числа во втором лице
  choice: Сохранить «вашей земле» во множественном числе и «ты соберёшь» в единственном.
  alternative: Унифицировать обращение, переведя обе формы либо единственным, либо множественным числом.
  rationale: Такой переход действительно присутствует в еврейском тексте и отражает обращение к народу как ко многим людям и одновременно как к единому Израилю; сглаживать его без необходимости не следует.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным звучанием. Сохранены конкретный земледельческий образ, первое лицо Божьего обещания и смена обращения с множественного числа на единственное. Тире выделяют поясняющее перечисление двух сезонных дождей.
