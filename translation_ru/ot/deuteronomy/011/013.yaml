  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: ru
  text: И если вы будете внимательно внимать Моим заповедям, которые Я даю вам сегодня[a], — любить Яхве[b], вашего Бога, и служить ему всем сердцем и всей душой[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если, слушая, будете слушать»; усилительная еврейская конструкция может также означать: «если будете внимательно повиноваться».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте — יהוה (ЙХВХ), личное имя Бога; традиционно передаётся «Господь».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всем своим существом» либо «всей своей жизнью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: И если
  rationale: Сочетание вводит условную часть предложения, продолжающегося в следующем стихе; естественное русское «И если» передаёт его функцию без буквального «и будет, если».
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: будете внимательно слушать
  rationale: Инфинитив абсолютный при личной форме усиливает глагол שמע. Перевод сохраняет образ слушания и передаёт усиление наречием; подразумеваемое послушание пояснено в сноске.
- source_word: אֶל מִצְוֺתַי
  choice: мои заповеди
  rationale: «Заповеди» сохраняет значение обязательных установлений в контексте завета; предлог אֶל естественно передан русским управлением глагола «слушать».
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: которые я заповедую вам сегодня
  rationale: Причастие מְצַוֶּה обозначает совершающееся речевое действие; настоящее время и слово «сегодня» сохранены.
- source_word: לְאַהֲבָה
  choice: любить
  rationale: Инфинитив передаёт требуемую направленность ответа и естественно зависит от содержания заповедей.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, вашего Бога
  rationale: Личное имя передано распространённой русской транслитерацией «Яхве», а приложение сохраняет заветное обозначение «ваш Бог».
- source_word: וּלְעָבְדוֹ
  choice: и служить Ему
  rationale: עבד охватывает преданное служение, включая поклонение, но не сводится только к культовому действию.
- source_word: בְּכָל לְבַבְכֶם
  choice: всем сердцем
  rationale: Русская формула естественно передаёт целостную внутреннюю преданность — волю, мысли и чувства.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: и всей душой
  rationale: Традиционный русский эквивалент сохраняет краткость и богословскую выразительность формулы, тогда как более широкий диапазон נֶפֶשׁ указан в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» передаёт его как имя, не заменяя титулом; традиционная замена отмечена в сноске.
- issue: Смысл усилительной конструкции שָׁמֹעַ תִּשְׁמְעוּ
  choice: будете внимательно слушать
  alternative: будете усердно повиноваться
  rationale: Основной текст сохраняет смысловой образ слышания, не устраняя заключённый в контексте оттенок послушания; этот оттенок поясняется в сноске.
- issue: Диапазон значения נֶפֶשׁ
  choice: душой
  alternative: всем существом; всей жизнью
  rationale: «Душой» сохраняет устойчивую формулу, но сноска предупреждает, что еврейское слово может обозначать не отделённую нематериальную часть человека, а его жизнь или всё его существо.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис оставлен открытым и завершён запятой, поскольку условное предложение продолжается в следующем стихе. Строчная форма «мои» не предрешает вопрос о непосредственном говорящем, тогда как «Ему» следует принятой русской практике почтительного местоименного обозначения Бога.
