  verdict: revise
  source_fidelity: 'Основной смысл передан верно: условная конструкция открыта для продолжения в следующем стихе; инфинитив абсолютный при «слушать» передан усилительно; сохранены «заповеди», имя «Яхве», служение, сердце и душа. Однако в русском тексте нарушена синтаксическая связь: «слушать мои заповеди, которые я заповедую» не соответствует еврейскому «слушать/внимать заповедям, которые Я повелеваю».'
  naturalness: '«Заповедую заповеди» — тяжёлая и неестественная тавтология. «Внимать Моим заповедям, которые Я даю вам сегодня» современно-литературно и естественно, сохраняя смысл речевого акта. Местоимение «Ему» лучше писать со строчной буквы: это обычное местоимение внутри повествовательного текста; почтительное написание не требуется оригиналом.'
  terminology: «Заповеди», «Яхве, ваш Бог», «служить», «всем сердцем и всей душой» уместны. Следует поставить сноску об имени Яхве непосредственно после имени, а не после «Бога», чтобы её якорь не мог читаться как относящийся к слову «Бог».
