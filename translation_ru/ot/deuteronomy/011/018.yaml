review_pass:
  verdict: revise
  source_fidelity: 'Основные соответствия сохранены: «положите», «эти Мои слова», «сердца и души», «повяжите», «как знак», «рука» и буквальное «между глазами» точно передают еврейские образы. Однако «пусть они будут» неоправданно меняет последовательное предписывающее будущее וְהָיוּ на русское побудительное пожелание.'
  naturalness: 'В исходном тексте «на сердце и душу вашу» грамматически и стилистически неудачно: притяжательное слово непосредственно согласуется лишь с «душу». Порядок «на руку вашу» и «между глазами вашими» намеренно библейский, но для современного литературного русского естественнее «на вашу руку» и «между вашими глазами».'
  terminology: «Повязки» оставляет значение טוֹטָפֹת открытым, не внося в основной текст позднейшее отождествление с тфилином. Сноска должна говорить об этом как о позднейшей практике/интерпретации и не создавать впечатления, что точное значение редкого слова установлено.
  issues:
  - severity: medium
    issue: Неудачное согласование в «на сердце и душу вашу».
    rationale: В русском варианте «вашу» формально относится к ближайшему существительному «душу», тогда как еврейский суффикс относится к обоим членам пары. «На ваши сердца и души» ясно передаёт обращение ко множеству адресатов и естественно по-русски.
  - severity: low
    issue: «Пусть они будут» вместо будущего предписания.
    rationale: וְהָיוּ продолжает ряд повелений и естественно передаётся как «и будут они», а не как русское пожелание «пусть будут».
  - severity: low
    issue: Сноска нуждается в более точной формулировке исторической связи с тфилином.
    rationale: Формулировка «позднее его связывали» может звучать слишком расплывчато. Следует пояснить, что выражение связывают с тфилином в позднейшей еврейской практике, сохранив неопределённость значения слова.
