source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: ru
  text: Итак, положите эти Мои слова на ваши сердца и души; повяжите их как знак на вашу руку, и будут они повязками[a] между вашими глазами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое еврейское слово имеет не вполне ясное значение; возможно: «налобные знаки». В позднейшей еврейской практике это выражение связывают с тфилином — небольшими кожаными коробочками, содержащими отрывки Писания и носимыми во время молитвы.'
    reason: Лексическая неопределённость и исторически засвидетельствованная связь с более поздней практикой требуют пояснения, не вводя тфилин в основной текст.
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: итак, положите
  rationale: Глагол שׂים имеет конкретное значение «класть, помещать». Повелительная форма естественно передаёт наставительный смысл последовательной глагольной формы, а «итак» связывает стих с предшествующим контекстом.
- source_word: דְּבָרַי אֵלֶּה
  choice: эти Мои слова
  rationale: Перевод сохраняет указательное местоимение и суффикс первого лица, относящий слова к говорящему.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: на сердце и душу вашу
  rationale: Сохранены образ предлога עַל («на») и парное сочетание «сердце — душа». Единственное число отражает собирательную форму еврейского текста и избегает излишне толковательного «внутри себя».
- source_word: וּקְשַׁרְתֶּם אֹתָם לְאוֹת
  choice: повяжите их как знак
  rationale: «Повяжите» передаёт конкретное действие קשׁר и естественно сочетается с ношением на руке; «как знак» сохраняет функцию אוֹת, не уточняя её сверх текста.
- source_word: עַל יֶדְכֶם
  choice: на руку вашу
  rationale: יָד прежде всего означает «рука»; сохранён буквальный пространственный образ без расширения до «предплечья».
- source_word: וְהָיוּ
  choice: и пусть они будут
  rationale: Такая конструкция по-русски естественно продолжает ряд предписаний и сохраняет предписывающий оттенок формы.
- source_word: לְטוֹטָפֹת
  choice: повязками
  rationale: Редкое слово טוֹטָפֹת обозначает предметы, носимые у лба, но его точное значение не вполне ясно. Нейтральное «повязками» сохраняет конкретность, не отождествляя их безоговорочно с более поздней формой практики.
- source_word: בֵּין עֵינֵיכֶם
  choice: между глазами вашими
  rationale: Сохранено буквальное выражение еврейского текста; вариант «на лбу» был бы поясняющим толкованием.
theological_decisions:
- issue: Буквальный или образный характер повеления носить слова на руке и между глазами
  choice: Сохранить конкретные телесные образы, не определяя, следует ли понимать их буквально, образно или одновременно в обоих смыслах.
  alternative: Передать только переносный смысл как постоянное памятование и руководство для мыслей и поступков либо прямо назвать позднейшую практику ношения тфилина.
  rationale: Сам стих использует конкретную лексику, но не разрешает однозначно соотношение символического наставления и буквальной практики. Перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Конкретная образность оригинала сохранена; порядок «руку вашу», «глазами вашими» поддерживает достоинство регистра, оставаясь понятным современному читателю.
