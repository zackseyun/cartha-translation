  text: וּ/כְתַבְתָּ֛/ם עַל מְזוּז֥וֹת בֵּיתֶ֖/ךָ וּ/בִ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: ru
  text: И напиши их на косяках своего дома и на своих воротах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у своих ворот». Еврейское выражение может обозначать как сами ворота, так и место у ворот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: И напиши их
  rationale: Перфект с союзом ו в последовательности наставлений имеет повелительную силу. Суффикс 3-го лица множественного числа отсылает к ранее упомянутым словам.
- source_word: עַל מְזוּזוֹת
  choice: на косяках
  rationale: מְזוּזוֹת обозначает боковые стойки дверного проёма; «косяки» — естественный современный русский эквивалент без отсылки к более позднему предмету еврейской традиции, называемому мезузой.
- source_word: בֵּיתֶךָ
  choice: своего дома
  rationale: בַּיִת здесь конкретно означает дом; возвратное «своего» естественно передаёт принадлежность при обращении ко второму лицу.
- source_word: וּבִשְׁעָרֶיךָ
  choice: и на своих воротах
  rationale: שַׁעַר обычно обозначает ворота, а иногда также место у ворот. Основной текст сохраняет прямое предметное значение, а пространственная альтернатива отмечена в сноске.
