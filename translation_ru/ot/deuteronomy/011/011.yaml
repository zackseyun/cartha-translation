source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: ru
  text: А земля, в которую вы переходите, чтобы овладеть ею[a], — это земля гор и долин; она пьёт воду от дождя с небес[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы получить её в наследие». Еврейский глагол может выражать как овладение землёй, так и получение её в наследие, особенно в контексте завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «небес». В библейском еврейском это обычное обозначение неба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: А земля
  rationale: Союз ו здесь противопоставляет эту землю описанному ранее Египту. Русское «А» естественно передаёт контраст, не делая его чрезмерно резким.
- source_word: עֹבְרִים שָׁמָּה
  choice: в которую вы переходите
  rationale: Причастие и указание направления описывают переход народа в эту землю. Отдельно переводить שָׁמָּה как «туда» по-русски избыточно, поскольку направление уже выражено относительной конструкцией.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: Глагол ירשׁ обозначает вступление во владение и в контексте завета может также иметь оттенок получения наследия. «Овладеть» сохраняет активный характер предстоящего вступления в землю.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: земля гор и долин
  rationale: Так передаётся противопоставление возвышенностей и низин; בְקָעוֹת может обозначать долины, впадины или котловины, а «долины» здесь наиболее ясно и естественно.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: от дождя с небес
  rationale: Оборот указывает на источник воды — дождь, приходящий с неба. «С небес» сохраняет образ и формальное множественное число еврейского שָׁמַיִם.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: она пьёт воду
  rationale: 'Сохранена олицетворяющая метафора оригинала: земля не просто орошается, а «пьёт» воду.'
theological_decisions:
- issue: Оттенки глагола ירשׁ в контексте обетованной земли
  choice: овладеть ею
  alternative: получить её в наследие
  rationale: Основной текст сохраняет активное вступление Израиля во владение, а сноска отмечает неустранённый заветный оттенок наследования, не подменяя один аспект другим.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены контраст с Египтом, образный параллелизм местности и олицетворение земли; синтаксис сделан понятным без сглаживания лексической неоднозначности.
