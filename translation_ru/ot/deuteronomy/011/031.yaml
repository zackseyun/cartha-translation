  naturalness: Текст современный и литературный. Повтор «овладеть / овладеете» несколько тяжеловесен, но оправдан повтором ירשׁ в оригинале и помогает сохранить смысловую связь.
  terminology: '«Яхве, ваш Бог» корректно передаёт יְהוָה אֱלֹהֵיכֶם. «Овладеть землёй» уместно в данном контексте и не подменяет дарование земли со стороны Бога. Сноска передаёт традиционную альтернативу, но формулировку можно слегка уточнить: тетраграмматон традиционно не столько «переводится», сколько «передаётся».'
