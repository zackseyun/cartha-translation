base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: ru
  text: Ведь вы переходите Иордан, чтобы войти и овладеть землёй, которую Яхве, ваш Бог, даёт вам[a], и вы овладеете ею и будете жить в ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH; традиционно передаётся «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего наставления; «ведь» естественно передаёт эту пояснительно-причинную связь.
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  choice: переходите Иордан
  rationale: Причастие выражает предстоящее, уже мыслимое как совершающееся действие; настоящее время сохраняет живость еврейского текста.
- source_word: לָבֹא לָרֶשֶׁת
  choice: чтобы войти и овладеть
  rationale: 'Сохраняется последовательность двух инфинитивов: вхождение в землю и вступление во владение ею.'
- source_word: הָאָרֶץ
  choice: землёй
  rationale: Обычное обозначение обещанной земли в контексте Второзакония.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, обозначенное тетраграмматоном, а не замещающий его титул.
- source_word: נֹתֵן לָכֶם
  choice: даёт вам
  rationale: Причастие передаёт настоящее или близкое и несомненное действие; настоящее время естественно звучит по-русски.
- source_word: וִירִשְׁתֶּם אֹתָהּ
  choice: Вы овладеете ею
  rationale: Глагол ירשׁ здесь обозначает вступление во владение землёй; будущее время передаёт последовательность предстоящих событий.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: будете жить в ней
  rationale: ישׁב в данном контексте означает проживание в земле; формулировка современна и не усиливает значение до «поселитесь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя YHWH; транслитерация сохраняет его отличие от титула «Господь».
- issue: Соотношение Божьего дара и овладения землёй Израилем
  choice: «даёт вам» и «овладеете ею» сохранены рядом
  alternative: Сгладить сочетание как только дарование или только завоевание
  rationale: Текст одновременно утверждает Божье дарование земли и предстоящее вступление народа во владение ею; это напряжение не следует устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Овладеть землёй» точнее и естественнее здесь, чем тяжеловесное «вступить во владение землёй»; «жить» предпочтено архаизирующему «обитать».
