base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: ru
  text: Никто не устоит перед вами[a]. Яхве, ваш Бог, наведёт страх и ужас перед вами на всю землю, по которой вы будете ступать[b], как Он говорил вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никто не сможет противостоять вам». Еврейское выражение «стоять перед кем-либо» здесь означает устоять против него, успешно ему противодействовать.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на лице всей земли». Еврейское слово может означать «земля» или «земной шар»; здесь ближайший контекст указывает на землю, по которой Израиль будет ступать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Никто не устоит перед вами
  rationale: Еврейская конструкция буквально изображает человека, стоящего перед кем-либо, но в данном контексте означает способность противостоять. «Никто не устоит» естественно передаёт идиоматический смысл, сохраняя образ стойкого сопротивления.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: страх и ужас перед вами
  rationale: Два близких существительных сохранены как усилительная пара. Оборот «перед вами» ясно показывает, что страх и ужас будут испытывать другие народы при встрече с Израилем.
- source_word: יִתֵּן
  choice: наведёт
  rationale: Хотя נתן обычно значит «дать, положить», по-русски сочетание «навести страх и ужас» естественно выражает причинение такого состояния и соответствует контексту.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, ваш Бог
  rationale: Личное имя יהוה передано как «Яхве», а приложение «ваш Бог» сохранено непосредственно.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: на всю землю
  rationale: 'Буквально: «на лице всей земли». В русском пространственный смысл естественно передаётся выражением «на всю землю»; последующая относительная конструкция ограничивает значение территорией, по которой пройдёт Израиль.'
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: по которой вы пройдёте
  rationale: Глагол דרך передаёт движение с попиранием или ступанием. «Пройдёте» звучит естественно в современном русском и сохраняет территориальный смысл; конкретный образ отмечен в сноске.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: как Он и говорил вам
  rationale: Глагол דבר означает «говорить», поэтому перевод не уточняет его как «обещал», хотя в контексте слова имеют силу обещания.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано транслитерацией «Яхве», без замены титулом.
- issue: Представительное единственное число אִישׁ
  choice: Никто
  alternative: Ни один человек
  rationale: В отрицательной конструкции אִישׁ имеет обобщающее значение «никто». Русское «никто» точно и естественно передаёт охват, не добавляя ненужного акцента на поле.
- issue: Характер Божьих слов в заключительной фразе
  choice: говорил
  alternative: обещал
  rationale: Перевод сохраняет более широкое значение דבר и не делает подразумеваемый обещательный характер лексически явным.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизмов. Местоимение «Он» написано с прописной буквы как уважительное обозначение Бога; синтаксис остаётся доступным обычному читателю.
