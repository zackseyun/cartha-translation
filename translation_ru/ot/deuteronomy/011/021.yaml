base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: ru
  text: чтобы ваши дни и дни ваших сыновей[a] умножились на земле, которую Яхве поклялся вашим отцам дать им, — как дни небес над землёй.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваших детей». Буквально по-еврейски: «ваших сыновей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока небеса остаются над землёй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результирующее значение оборота и естественно связывает стих с предшествующими повелениями.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: ваши дни… умножились
  rationale: Сохраняет еврейскую образность увеличения числа дней, не сводя её к пояснительному «вы долго жили».
- source_word: וִימֵי בְנֵיכֶם
  choice: и дни ваших сыновей
  rationale: Буквально передаёт мужской род и множественное число בנים; более широкое контекстуальное понимание отмечено в сноске.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: Соответствует предлогу עַל и в контексте Второзакония обозначает обещанную землю.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם לָתֵת לָהֶם
  choice: которую Яхве поклялся дать вашим отцам
  rationale: В русском языке дательный «вашим отцам» естественно служит одновременно дополнением при «поклялся» и получателем обещанной земли, передавая смысл обоих еврейских местоименных оборотов без тяжеловесного повтора.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное заветное имя, представленное тетраграмматоном.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: как дни небес над землёй
  rationale: Сохраняет необычную метафору и пространственный образ оригинала; идиоматическое значение продолжительности поясняется в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Объём значения בְנֵיכֶם
  choice: ваших сыновей
  alternative: ваших детей
  rationale: Основной текст сохраняет грамматически мужское «сыновья», а возможное родовое употребление не исключается и вынесено в сноску.
- issue: Значение заключительного сравнения
  choice: как дни небес над землёй
  alternative: пока небеса остаются над землёй
  rationale: Основной текст не устраняет метафорическую и синтаксическую неоднозначность; вероятное временное понимание указано как альтернатива.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены повтор слова «дни» и образное выражение оригинала; тире помогает ясно присоединить заключительное сравнение.
