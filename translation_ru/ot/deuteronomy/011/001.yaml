source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: ru
  text: Итак[a], люби Яхве, твоего Бога, и соблюдай Его требования, Его установления, Его постановления[b] и Его заповеди всю свою жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И люби Яхве, твоего Бога». Еврейский союз может означать простое «и»; здесь он понят как вывод из предшествующих слов.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Его правовые решения»; буквально возможно также «Его суды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: Итак, люби
  rationale: Глагол אָהַב передан обычным русским «люби». Союз וְ допускает простое «и», но в данном контексте подводит итог предшествующему рассуждению, поэтому выбран выводный союз «итак»; буквальная альтернатива сохранена в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой современной русской транслитерацией тетраграмматона.
- source_word: אֱלֹהֶיךָ
  choice: своего Бога
  rationale: Суффикс второго лица мужского рода единственного числа передан русским возвратным притяжательным местоимением, естественным при обращении к одному адресату.
- source_word: וְ/שָׁמַרְתָּ
  choice: и … исполняй
  rationale: שׁמר в контексте заветных требований означает хранить, соблюдать, исполнять. «Исполняй» естественно сочетается с последующим рядом правовых терминов.
- source_word: מִשְׁמַרְתּוֹ
  choice: требуемое Им
  rationale: Существительное обозначает порученное для соблюдения, обязанность или требование. Субстантивированное выражение сохраняет собирательный характер единственного числа и звучит естественнее буквального «Его поручение».
- source_word: חֻקֹּתָיו
  choice: Его установления
  rationale: «Установления» передаёт обязательные, установленные Богом нормы и сохраняет отличие от соседних מִשְׁפָּטִים и מִצְוֹת.
- source_word: וּמִשְׁפָּטָיו
  choice: Его постановления
  rationale: מִשְׁפָּט в правовом контексте может обозначать судебное решение, норму или постановление. «Постановления» понятно современному читателю и не смешивает эту категорию с заповедями; более буквальная альтернатива отмечена в сноске.
- source_word: וּמִצְוֺתָיו
  choice: Его заповеди
  rationale: «Заповеди» — точный и устойчивый русский эквивалент מִצְוֹת в библейском правовом контексте.
- source_word: כָּל הַיָּמִים
  choice: всю свою жизнь
  rationale: Буквально «все дни». Русское выражение «всю свою жизнь» естественно передаёт требование постоянного соблюдения на протяжении всех дней жизни адресата.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; вариант «Иегова» отражает более позднее смешанное чтение.
- issue: Соотношение любви и послушания
  choice: Повелительные формы «люби» и «исполняй» сохранены рядом
  alternative: Передать второй глагол как следствие любви
  rationale: Еврейский текст координирует обе обязанности союзом и не определяет вторую лишь как автоматическое следствие первой. Перевод сохраняет это напряжение, не добавляя причинно-следственной богословской схемы.
- issue: Значение מִשְׁפָּטָיו
  choice: Его постановления
  alternative: Его суды; Его правовые решения
  rationale: Выбранный вариант сохраняет самостоятельную правовую категорию рядом с установлениями и заповедями, не сводя весь ряд к общему понятию закона.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Императивы в единственном числе сохраняют личное обращение. Повтор «Его» поддерживает ритм и различие правовых категорий; выражение «всю свою жизнь» естественно передаёт еврейское «все дни».
