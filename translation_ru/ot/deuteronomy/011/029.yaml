revisions:
- from: И когда Яхве, твой Бог, приведёт тебя в землю, в которую ты входишь, чтобы овладеть ею, возложи[a] благословение на гору Гаризим, а проклятие — на гору Гевал.
  to: И когда Яхве, твой Бог, приведёт тебя в землю, в которую ты входишь, чтобы овладеть ею, установи благословение на горе Гаризим, а проклятие — на горе Гевал.
  rationale: Заменено только «возложи ... на гору» на «установи ... на горе», чтобы устранить неестественный образ физического возложения абстрактного благословения и не конкретизировать действие сверх еврейского текста. Сноска сохранена с тем же якорем и объясняет возможное понимание как публичного провозглашения.
