  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: ru
  text: И когда Яхве, твой Бог, приведёт тебя в землю, в которую ты входишь, чтобы овладеть ею, установи благословение на горе Гаризим, а проклятие — на горе Гевал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Естественно передаёт древнееврейскую формулу, вводящую будущее обстоятельство, без буквального и тяжеловесного «и будет, когда».
- source_word: יְבִיאֲךָ
  choice: приведёт тебя в
  rationale: Каузативная форма глагола בוא означает «ввести, привести»; будущее время соответствует контексту наставления о предстоящем вступлении в землю.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: 'Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהֶיךָ — прямым обозначением отношений: «твой Бог».'
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: В контексте Второзакония речь идёт об обещанной Израилю земле; определённость ясна из контекста и последующего придаточного предложения.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: в которую ты входишь
  rationale: Причастная конструкция выражает предстоящее и уже намеченное вхождение; направительное שָׁמָּה естественно включено в русскую конструкцию «в которую».
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: ירשׁ здесь означает вступить во владение землёй; «овладеть ею» сохраняет активный оттенок и местоименную отсылку к земле.
- source_word: וְנָתַתָּה
  choice: возложи
  rationale: נתן буквально имеет широкий смысл «дать, положить, поместить». «Возложи» сохраняет конкретность образа и повелительную силу последовательной глагольной формы, не сводя действие безоговорочно к произнесению.
- source_word: הַבְּרָכָה
  choice: благословение
  rationale: Определённое существительное обозначает заветное благословение, названное в ближайшем контексте.
- source_word: עַל הַר גְּרִזִים
  choice: на гору Гаризим
  rationale: Предлог עַל сохранён как «на»; «Гаризим» — устоявшаяся русская форма географического названия.
- source_word: הַקְּלָלָה
  choice: проклятие
  rationale: Прямой и естественный антоним к «благословению», сохраняющий параллелизм исходного текста.
- source_word: עַל הַר עֵיבָל
  choice: на гору Гевал
  rationale: Предлог и синтаксический параллелизм сохранены; «Гевал» — устоявшаяся русская библейская форма названия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Характер действия с благословением и проклятием
  choice: возложи благословение… а проклятие…
  alternative: провозгласи благословение… и проклятие…
  rationale: Глагол נתן буквально означает «дать/положить», тогда как точная обрядовая форма действия раскрывается в окружающем контексте. Основной текст сохраняет конкретную, но не вполне однозначную формулировку, а возможное понимание как провозглашения указано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены параллелизм благословения и проклятия, личное имя Яхве и предметная неоднозначность глагола נתן.
