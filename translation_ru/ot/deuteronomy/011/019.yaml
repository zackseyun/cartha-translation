base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: ru
  text: Учите своих детей этим словам[a], говоря о них, когда сидите у себя дома, когда идёте по дороге, когда ложитесь и когда встаёте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих сыновей». Древнееврейская форма мужского рода множественного числа может обозначать детей вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Учите
  rationale: Пиэль глагола למד означает «учить, обучать». Союз ו продолжает предшествующее наставление, но в русском отдельный стих естественно начинать без «и». Форма повелительного наклонения передаёт предписывающую силу древнееврейского перфекта с последовательным ו в данном контексте.
- source_word: אֹתָם
  choice: им
  rationale: Местоимение мужского рода множественного числа отсылает к словам заповеди в контексте. Русская конструкция «учить чему?» требует дательного падежа и сохраняет местоименную отсылку, не уточняя её сверх оригинала.
- source_word: אֶת־בְּנֵיכֶם
  choice: своих детей[a]
  rationale: בנים может обозначать как сыновей, так и детей вообще. В контексте передачи заветного наставления следующему поколению «детей» естественно выражает собирательный смысл; возвратное «своих» соответствует русскому узусу при общем подразумеваемом субъекте «вы».
- source_word: לְדַבֵּר בָּם
  choice: говоря о них
  rationale: Инфинитив с ל описывает сопровождающее действие или способ обучения. Предлог ב при דבר здесь естественно передаётся как «о»; деепричастная конструкция сохраняет связь с главным предписанием.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: когда сидите у себя дома
  rationale: ב с инфинитивом образует временное обстоятельство. «У себя дома» — современное и точное по смыслу соответствие выражению «в своём доме», без ненужной буквальности.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: когда идёте по дороге
  rationale: הלך означает «идти, ходить». «Идёте по дороге» сохраняет обычный, не обязательно специально путешественный смысл и естественно звучит по-русски.
- source_word: וּבְשָׁכְבְּךָ
  choice: когда ложитесь
  rationale: שכב буквально означает «ложиться, лежать»; в паре с вставанием здесь обозначает время отхода ко сну, сохраняя при этом лаконичность оригинала.
- source_word: וּבְקוּמֶךָ
  choice: когда встаёте
  rationale: קום означает «вставать, подниматься». «Встаёте» образует естественную ритмическую пару с «ложитесь».
theological_decisions:
- issue: Родовое значение בְּנֵיכֶם
  choice: своих детей
  alternative: своих сыновей
  rationale: Форма мужского рода множественного числа допускает как узкое значение «сыновья», так и представительное значение «дети, потомки». Контекст наставления следующего поколения поддерживает общее значение, однако буквальная альтернатива отмечена в сноске, чтобы сохранить лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены местоименная отсылка «им / о них», временная цепочка повседневных обстоятельств и ритмическая пара «ложитесь — встаёте». Формы второго лица множественного числа передают обращение ко всему Израилю, тогда как древнееврейские обстоятельственные формы внутри цепочки грамматически стоят в единственном числе, имея распределительный смысл.
