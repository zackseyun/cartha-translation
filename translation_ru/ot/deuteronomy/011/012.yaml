base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: ru
  text: земля, о которой заботится[a] Яхве, твой Бог; очи Яхве, твоего Бога, непрестанно обращены на неё — от начала года и до конца года.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ищет её», «печётся о ней». Еврейский глагол может означать «искать», «спрашивать о» или «заботиться»; здесь он выражает деятельное попечение Яхве об этой земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: земля
  rationale: В контексте Второзакония речь идёт об обетованной земле как территории, а не о земле вообще или планете.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог / твоего Бога
  rationale: Точно передаёт форму с суффиксом второго лица единственного числа; падеж изменён согласно русскому синтаксису.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: заботится о ней
  rationale: Глагол דרש может означать «искать», «спрашивать о» или «пекись/заботиться»; применительно к земле здесь выражает деятельное попечение Бога.
- source_word: תָּמִיד
  choice: непрестанно
  rationale: Передаёт постоянный, продолжающийся характер Божьего внимания и соответствует dignified современному литературному регистру.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: очи Яхве, твоего Бога, обращены на неё
  rationale: Сохраняет антропоморфный образ исходного текста; «обращены на неё» естественно выражает направленное внимание по-русски.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: от начала года и до конца года
  rationale: Ясно и близко к форме оригинала передаёт весь годовой временной промежуток.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное заветное имя, непосредственно присутствующее в еврейском тексте, не подменяя его титулом.
- issue: Антропоморфный образ Божьих очей
  choice: 'сохранить: «очи ... обращены на неё»'
  alternative: перефразировать как «Бог постоянно присматривает за ней»
  rationale: Исходный текст прямо говорит об очах Бога; сохранение образа не устраняет богословское напряжение и связь с предшествующим утверждением о попечении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Очи» сохраняет образность и торжественность оригинала, тогда как остальная формулировка остаётся понятной обычному читателю. Знак сноски поставлен после образа, завершающего смысловое пояснение попечения.
