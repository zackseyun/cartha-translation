base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: ru
  text: и Его знамения[a], и Его деяния, которые Он совершил посреди Египта[b] над фараоном, царём Египта, и над всей его землёй[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его чудеса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или просто: «в Египте»; буквально: «посреди Египта».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «против фараона… и против всей его земли». Еврейский предлог буквально означает «к» или «по отношению к», но в данном контексте речь идёт о деяниях суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: Его знамения
  rationale: אוֹת обозначает знак, знамение или предзнаменование. «Знамения» прямо передаёт слово и не добавляет отсутствующего в тексте определения «чудесные».
- source_word: מַעֲשָׂיו
  choice: Его деяния
  rationale: מַעֲשֶׂה означает совершённое дело или действие. «Деяния» сохраняет конкретный смысл и подходит к возвышенному, но понятному повествовательному регистру.
- source_word: אֲשֶׁר עָשָׂה
  choice: которые Он совершил
  rationale: Относительное предложение относится к знамениям и деяниям. «Совершил» естественно сочетается с обоими существительными и передаёт простой глагол עשה без смыслового расширения.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: посреди Египта
  rationale: בְּתוֹךְ буквально указывает на нахождение внутри, посреди чего-либо. Формулировка сохраняет пространственный акцент еврейского текста.
- source_word: לְפַרְעֹה
  choice: над фараоном
  rationale: Предлог לְ отмечает адресата или объект, на который направлены деяния. В данном контексте суда естественное русское «над фараоном» передаёт направленность действий, а более широкое значение предлога отмечено в сноске.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царём Египта
  rationale: Обычная передача сопряжённой конструкции; приложение согласовано с формой «фараоном».
- source_word: וּלְכָל אַרְצוֹ
  choice: и над всей его землёй
  rationale: אֶרֶץ здесь обозначает землю или страну. «Вся его земля» сохраняет территориальный смысл и притяжательный суффикс.
- source_word: וְאֶת ... וְאֶת
  choice: и ... и
  rationale: Повтор союза сохраняет связь со сказанным ранее и параллельное перечисление двух объектов.
theological_decisions:
- issue: Направленность Божьих деяний по отношению к фараону и его земле
  choice: над фараоном ... и над всей его землёй
  alternative: к фараону ... и ко всей его земле; против фараона ... и против всей его земли
  rationale: Контекст описывает суд, направленный на фараона и Египет. «Над» звучит по-русски естественнее буквального «к», но не выражает враждебность столь однозначно, как «против»; формальная широта לְ сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор «и Его… и Его…» сохраняет еврейскую координацию и связь с предыдущим стихом; конечное тире показывает, что синтаксическая мысль продолжается.
