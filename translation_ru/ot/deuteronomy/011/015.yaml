  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: ru
  text: И Я дам траву на твоём поле для твоего скота[a], и ты будешь есть и насытишься[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растительность», «зелень»; еврейское слово может обозначать растительный покров вообще, но здесь, вероятно, имеется в виду корм для скота.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будешь сыт»; еврейский глагол означает насытиться после еды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И Я дам
  rationale: Форма первого лица единственного числа в контексте обещания естественно передаётся будущим временем. Союз «и» сохраняет связь с предшествующим перечислением благословений; местоимение «Я» уместно выражает явно указанное в еврейской форме лицо.
- source_word: עֵשֶׂב
  choice: траву
  rationale: Слово может обозначать растительность вообще, но сочетание «для твоего скота» указывает прежде всего на растительный корм; «трава» здесь естественна и точна.
- source_word: בְּשָׂדְךָ
  choice: на твоём поле
  rationale: Конкретное сельскохозяйственное значение שָׂדֶה и форма единственного числа сохранены. По-русски о растущей траве естественно сказать «на поле».
- source_word: לִבְהֶמְתֶּךָ
  choice: для твоего скота
  rationale: בְּהֵמָה употреблено собирательно о домашних сельскохозяйственных животных; русское «скот» ясно передаёт этот смысл без сужения до крупного рогатого скота.
- source_word: וְאָכַלְתָּ
  choice: и ты будешь есть
  rationale: Сохранены будущее значение и обращение во втором лице единственного числа, представляющем Израиль как единое целое.
- source_word: וְשָׂבָעְתָּ
  choice: и насытишься
  rationale: Глагол означает достижение сытости или удовлетворения после еды. «Насытишься» кратко и естественно передаёт результативный смысл формы.
theological_decisions:
- issue: Обращение к Израилю в единственном числе
  choice: 'Сохранить второе лицо единственного числа: «твоём», «твоего», «ты будешь»'
  alternative: 'Передать обращение множественным числом: «ваших полях… вашего скота… вы будете»'
  rationale: В еврейском тексте последовательно употреблено второе лицо мужского рода единственного числа как заветное обращение ко всему Израилю; сохранение числа передаёт риторическую форму источника.
- issue: Характер обещанного благословения
  choice: Передать как конкретное Божье обеспечение травой для скота и пищей для человека
  alternative: Расширить формулировку до общего обещания процветания или изобилия
  rationale: Текст прямо говорит о сельскохозяйственном обеспечении и насыщении, но не формулирует более широкого учения о материальном процветании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность еврейского обещания, но остаётся естественным для обычного читателя. Заглавное «Я» обозначает говорящего Бога в принятой русской библейской орфографической традиции.
