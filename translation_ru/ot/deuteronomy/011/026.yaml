base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: ru
  text: 'Смотрите: сегодня я предлагаю вам благословение и проклятие.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Смотрите
  rationale: Форма единственного числа служит призывом ко всему Израилю как к единому народу. В современном русском обращение «Смотрите» естественно согласуется с последующим множественным «вам» и сохраняет функцию привлечения внимания.
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение выражено явно; дополнительное «сам» чрезмерно усилило бы акцент.
- source_word: נֹתֵן
  choice: предлагаю
  rationale: Глагол נתן буквально означает «давать, помещать». В сочетании с «перед вами» он описывает предъявление двух возможностей; русское «предлагаю вам» естественно передаёт этот смысл без неуместного представления о физическом размещении.
- source_word: לִפְנֵיכֶם
  choice: вам
  rationale: В конструкции с «предлагаю» значение «перед вами» естественно выражается дательным падежом; буквальное «перед вами» возможно, но здесь звучит тяжелее.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент временного указания.
- source_word: בְּרָכָה
  choice: благословение
  rationale: Сохраняет отвлечённое существительное и один из двух противопоставленных исходов завета.
- source_word: וּקְלָלָה
  choice: и проклятие
  rationale: Сохраняет симметричное противопоставление благословению без истолковывающего расширения.
theological_decisions:
- issue: Характер формулы благословения и проклятия
  choice: Передать два представленных Израилю исхода завета без поясняющей доктринальной вставки.
  alternative: Истолковать формулу как общий нравственный закон воздаяния.
  rationale: Стих вводит последующее изложение благословения и проклятия в контексте завета; перевод должен сохранить напряжение и краткость исходной формулы.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Двоеточие после призыва «Смотрите» естественно отделяет средство привлечения внимания от основного сообщения. Множественное «Смотрите» выбрано ради естественного обращения к народу, хотя древнееврейский императив грамматически стоит в единственном числе.
