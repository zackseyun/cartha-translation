  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: ru
  text: Тогда гнев Яхве воспылает на вас[a], и Он затворит небо, так что дождя не будет, и почва не даст своего урожая; и вы вскоре исчезнете с доброй земли, которую Яхве даёт вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воспылает нос Яхве против вас»; это еврейская идиома, обозначающая сильный гнев.'
    reason: Пояснение буквального антропоморфного образа, который в основном тексте естественно передан словом «гнев».
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Тогда гнев Яхве воспылает на вас
  rationale: Оборот חרה אף — еврейская идиома сильного гнева. «Гнев… воспылает» сохраняет исходную метафору и естественно звучит в современном литературном русском; «тогда» передаёт следственный переход в контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: и Он затворит небо
  rationale: Глагол עָצַר здесь изображает небо закрытым, вследствие чего прекращается дождь. «Затворит небо» сохраняет образ и имеет достойное библейское звучание без неясности.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: так что дождя не будет
  rationale: «Так что» естественно выражает результат затворения неба, подразумеваемый последовательностью еврейских предложений.
- source_word: וְהָאֲדָמָה
  choice: и земля
  rationale: אֲדָמָה обозначает возделываемую почву. В русском «земля» естественнее, чем «почва», а последующее הָאָרֶץ уточняется выражением «добрая земля».
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: не даст своего урожая
  rationale: Буквально близкая и естественная передача сельскохозяйственного значения יְבוּלָהּ — произведения, урожая земли.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל
  choice: и вы вскоре погибнете, исчезнув с
  rationale: אָבַד передаёт гибель, а מֵעַל вместе с упоминанием земли также указывает на исчезновение народа с неё. Формулировка сохраняет тяжесть суда и пространственный оттенок, не сводя смысл исключительно к смерти или изгнанию.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: той доброй земли
  rationale: הָאָרֶץ здесь — данная Израилю страна/земля, в отличие от возделываемой почвы אֲדָמָה выше. Указательное «той» естественно связывает определённую конструкцию с придаточным предложением.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: которую Яхве даёт вам
  rationale: Причастие נֹתֵן передано настоящим временем, подчёркивающим совершающееся дарование земли Израилю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное заветное имя. «Яхве» непосредственно передаёт его и не заменяет титулом.
- issue: Антропоморфная идиома אַף с חָרָה
  choice: гнев Яхве воспылает на вас
  alternative: Яхве разгневается на вас
  rationale: Выбранная передача сохраняет метафору пылающего гнева, не усиливая и не ослабляя утверждение текста.
- issue: Характер гибели народа на земле
  choice: погибнете, исчезнув с… земли
  alternative: будете истреблены; сгинете с земли; лишитесь земли
  rationale: Глагол אָבַד допускает широкий смысл гибели, тогда как מֵעַל указывает на удаление с поверхности земли. Перевод не определяет точный механизм суда, но сохраняет оба смысловых компонента.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «воспылает» и «затворит» сохраняют образность оригинала и остаются понятными широкому читателю. Местоимение «Он» написано с прописной буквы как издательская норма почтительного регистра, без изменения смысла оригинала.
