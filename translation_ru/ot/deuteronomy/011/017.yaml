    rationale: Оригинал не сообщает, что адресаты погибнут посредством или предварительно исчезнув с земли; глагол אָבַד с מֵעַל הָאָרֶץ образует единое высказывание о скором исчезновении/гибели с земли. Следует не разрывать его деепричастной конструкцией.
  - severity: low
    issue: Не отражено лексическое различие между אֲדָמָה и הָאָרֶץ.
    rationale: Повтор «земля ... земля» допустим, но «почва» для אֲדָמָה яснее сохраняет контраст между плодородной почвой и данной народу землёй.
