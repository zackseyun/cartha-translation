base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: ru
  text: Берегитесь, чтобы ваше сердце не было обмануто и чтобы вы не уклонились, не стали служить другим богам и поклоняться им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ваше сердце не прельстилось… и не стали кланяться им». Еврейский глагол, переданный словами «было обмануто», может означать также «было уговорено» или «было прельщено»; глагол «поклоняться» буквально обозначает земной поклон.'
    reason: лексические альтернативы
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Берегитесь
  rationale: Возвратная форма повеления естественно передаёт предостережение и рефлексивный оттенок еврейской формулы без неестественного добавления «себя».
- source_word: פֶּן
  choice: чтобы… не
  rationale: Вводит предостережение о нежелательном последствии; конструкция «чтобы… не» естественна в современном русском и сохраняет отрицательную направленность предупреждения.
- source_word: יִפְתֶּה
  choice: не поддалось обману
  rationale: Глагол פתה допускает значения обольщения, уговоров и обмана. Выражение сохраняет сердце как грамматический субъект и не сужает смысл только до интеллектуального заблуждения.
- source_word: לְבַבְכֶם
  choice: ваше сердце
  rationale: «Сердце» сохраняет библейский образ внутреннего человека — его воли, разумения и устремлений.
- source_word: וְסַרְתֶּם
  choice: и чтобы вы не уклонились
  rationale: «Уклониться» передаёт отход от должного пути и верности, характерный для контекста Второзакония.
- source_word: וַעֲבַדְתֶּם
  choice: не стали служить
  rationale: עבד обозначает служение богам как религиозную преданность; «служить» сохраняет отличие от следующего конкретного действия поклонения.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямой и нейтральный эквивалент, не вносящий более узкого значения «чужеземные».
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: и поклоняться им
  rationale: В религиозном контексте השתחוה означает земной поклон как акт почитания. «Поклоняться» звучит естественно по-русски; буквальный телесный образ отмечен в сноске.
theological_decisions:
- issue: Характер предостережения об отступничестве
  choice: 'Сохранена последовательность: внутреннее обольщение или обман, уклонение, служение другим богам и поклонение им.'
  alternative: Передать всё более обобщённо как предостережение против идолопоклонства.
  rationale: Исходный текст различает внутреннюю причину и последующие действия; перевод не сводит эту последовательность к одному богословскому термину.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Повтор «чтобы… не» и последующее «не стали» делают область действия предостережения ясной, не устраняя смысловой связи между этапами отступления.
