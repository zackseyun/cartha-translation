  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: ru
  text: то Яхве изгонит перед вами все эти народы, и вы вытесните народы, более многочисленные и сильные, чем вы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: изгонит
  rationale: Порода хифиль глагола ירשׁ выражает лишение владения, устранение прежних обладателей. «Изгонит» естественно передаёт это значение в контексте завоевания земли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, без замены его титулом.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: все эти народы
  rationale: גּוֹיִם здесь обозначает этнополитические сообщества, населявшие землю; «народы» соответствует контексту и сохраняет повтор лексемы далее.
- source_word: מִלִּפְנֵיכֶם
  choice: от вас
  rationale: Буквально «от вашего лица / из вашего присутствия». После русского «изгонит» сочетание «от вас» естественно выражает удаление народов перед наступающим Израилем.
- source_word: וִירִשְׁתֶּם
  choice: вы вытесните
  rationale: В породе каль ירשׁ может означать овладение или лишение владения. Поскольку прямое дополнение — народы, а не земля, «вытесните» передаёт устранение прежних обладателей и сохраняет отличие от первого «изгонит».
- source_word: גְּדֹלִים
  choice: многочисленнее
  rationale: В отношении народов сравнительное «многочисленнее» естественно передаёт превосходство по величине, не сводя выражение к физическому размеру.
- source_word: וַעֲצֻמִים
  choice: сильнее
  rationale: עָצוּם обозначает силу и могущество; «сильнее» — ясное современное соответствие в сравнительной конструкции.
- source_word: מִכֶּם
  choice: вас
  rationale: 'Предлог מִן с местоименным суффиксом употреблён для сравнения: «чем вы / вас».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение וִירִשְׁתֶּם при прямом дополнении «народы»
  choice: вы вытесните народы
  alternative: вы овладеете народами; вы завладеете их землёй
  rationale: Текст называет прямым объектом именно народы. Выбранный вариант сохраняет эту грамматическую особенность и значение лишения прежнего владения, не добавляя отсутствующего в стихе слова «земля».
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Повтор «народы» сохранён вслед за еврейским текстом; «изгонит» и «вытесните» передают разные формы одного еврейского корня без неестественной русской тавтологии.
