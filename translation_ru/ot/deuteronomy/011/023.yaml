  source_fidelity: 'Основной смысл передан верно: хифиль הורישׁ — изгнание/лишение владения, затем каль ירשׁ с прямым дополнением «народы» — овладение ими, то есть их вытеснение; сравнительные определения также сохранены. Однако начальное «И» не соответствует функции וְ в данном контексте: это продолжение условного периода предыдущего стиха и по-русски естественно передаётся «то».'
  naturalness: «Изгонит от вас» понятно, но «изгонит ... перед вами» ближе к מִלִּפְנֵיכֶם и естественно в библейско-повествовательском русском. «Вытесните народы» приемлемо, но «овладеете народами» в современном русском двусмысленно; «лишите владений» добавляет невыраженный объект. Исходный вариант «вытесните» удачно сохраняет прямой объект и контекстуальный смысл.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Народы», «многочисленнее» и «сильнее» — точные современные соответствия. Повтор «народы» оправдан еврейским повтором גּוֹיִם.
