  text: כִּי֩ אִם שָׁמֹ֨ר תִּשְׁמְר֜וּ/ן אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם לַ/עֲשֹׂתָ֑/הּ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לָ/לֶ֥כֶת בְּ/כָל דְּרָכָ֖י/ו וּ/לְ/דָבְקָה בֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: ru
  text: 'Ибо если вы будете тщательно[a] соблюдать всю эту заповедь[b], которую я повелеваю вам исполнять: любить Яхве, вашего Бога, ходить всеми Его путями и держаться Его[c], —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если, соблюдая, будете соблюдать»; сочетание инфинитива с личной формой глагола усиливает призыв.'
    reason: Передача еврейской усилительной конструкции.
  - marker: b
    text: В еврейском тексте стоит единственное число; возможно, это собирательное обозначение всего заветного предписания.
    reason: Сохранение грамматической формы и смысловой неоднозначности.
  - marker: c
    text: 'Возможный перевод: «прилепляться к Нему».'
    reason: Указание более буквальной передачи метафоры דבק.
lexical_decisions:
- source_word: כִּי אִם
  choice: Ибо если
  rationale: Сочетание вводит условие и одновременно связывает его с предыдущей мыслью; «ибо если» сохраняет обе функции.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: будете неукоснительно исполнять
  rationale: Инфинитив абсолютный при личной форме усиливает глагол. «Неукоснительно» передаёт усиление и требование деятельной верности, не утяжеляя русскую фразу буквальным повтором.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: всю эту заповедь
  rationale: 'Сохранено единственное число и возможный собирательный смысл: речь может идти о заповеди как о едином заветном предписании.'
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: которую я повелеваю вам исполнять
  rationale: Причастие מְצַוֶּה передано настоящим временем речи Моисея, а עשה — естественным русским «исполнять» применительно к заповеди. Местоименное дополнение выражено относительным местоимением «которую» и не повторяется.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: любить Яхве, вашего Бога
  rationale: Инфинитив сохранён как пояснение содержания исполнения; тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: ходить всеми Его путями
  rationale: Сохранена библейская метафора поведения и верности; буквальный образ не сводится к пояснительному «жить согласно».
- source_word: וּלְדָבְקָה בוֹ
  choice: и крепко держаться Его
  rationale: דבק обозначает тесную и стойкую привязанность. Русское выражение сохраняет образ и заветную направленность, оставаясь понятным современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не привносит конфессиональной замены.
- issue: Образы «ходить» и «держаться»
  choice: Сохранить обе метафоры в основном тексте
  alternative: жить по Его воле; оставаться верными Ему
  rationale: Образы выражают одновременно образ жизни, преданность и близкую связь. Их истолковательное упрощение сузило бы смысл и сняло бы часть богословского напряжения.
- issue: Единственное число הַמִּצְוָה
  choice: всю эту заповедь
  alternative: все эти заповеди
  rationale: Единственное число оригинала может собирательно обозначать всё заветное предписание. Перевод сохраняет грамматическую форму и не решает эту неоднозначность в пользу множественного числа.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксическая незавершённость условной фразы и конечное тире сохранены, поскольку предложение продолжается в следующем стихе. Заглавные местоимения при упоминании Бога употреблены как принятая русская издательская норма данного регистра.
