base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: ru
  text: Ведь земля, в которую ты входишь, чтобы овладеть ею, не похожа на землю Египта, из которой вы вышли, — землю, где ты сеял свои семена и орошал её ногой[a], как огород.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «орошал её ногой» может относиться к приведению в действие ножного оросительного устройства или к направлению воды ногой по небольшим каналам.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит пояснение к предшествующему наставлению и естественно передаёт смысловую связь в русском языке.
- source_word: הָאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: земля, в которую ты входишь
  rationale: Сохраняет образ предстоящего вступления в землю и единственное число обращения.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: Передаёт значение ירשׁ как вступления во владение, не добавляя более узкого оттенка наследования.
- source_word: לֹא כְאֶרֶץ מִצְרַיִם הִוא
  choice: не такова, как Египетская земля
  rationale: Естественно выражает прямое сопоставление земель и сохраняет тематическое слово «земля».
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: из которой вы вышли
  rationale: Сохраняет множественное число и характерную для рассказа об исходе формулу «вышли».
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: Там ты сеял свои семена
  rationale: Имперфект в описании Египта понят как обозначение привычного действия; «семена» звучит естественнее русского единственного «семя» в земледельческом контексте.
- source_word: וְהִשְׁקִיתָ בְרַגְלְךָ
  choice: и орошал землю ногой
  rationale: «Орошал» точно передаёт земледельческий контекст; объект «землю» восполнен из контекста, а буквальный образ ноги сохранён.
- source_word: כְּגַן הַיָּרָק
  choice: как огород
  rationale: Краткое и естественное русское соответствие небольшому участку с овощами или зеленью, требующему регулярного полива.
theological_decisions:
- issue: Формула исхода в контексте завета
  choice: из которой вы вышли
  alternative: которую вы покинули
  rationale: Глагол «вышли» сохраняет узнаваемую библейскую формулу исхода, не усиливая её дополнительным толкованием.
- issue: Чередование единственного и множественного числа обращения
  choice: ты входишь … вы вышли … ты сеял
  alternative: унифицировать всё обращение во множественном числе
  rationale: 'Сохранено намеренное грамматическое чередование еврейского текста: отдельный израильтянин/Израиль как единое целое и народ во множественном числе.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис упрощён до двух предложений для ясности; сохранены повтор слова «земля», формула исхода и необычный конкретный образ орошения ногой.
