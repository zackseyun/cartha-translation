  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: ru
  text: а проклятие — если не будете слушаться заповедей Яхве, вашего Бога,[a] и сойдёте с пути, которым я велю вам идти сегодня, и пойдёте за другими богами, которых вы не знали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будете слушать заповедей». В заветном контексте еврейский глагол часто подразумевает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: а проклятие
  rationale: Союз перед второй частью противопоставляет проклятие благословению предыдущего стиха; русское «а» естественно передаёт этот контраст, а определённость восстанавливается из параллельной конструкции.
- source_word: אִם לֹא תִשְׁמְעוּ אֶל
  choice: если не будете слушаться
  rationale: Условное אִם לֹא передано прямо. שׁמע с אֶל буквально связано со слушанием, но в заветном контексте подразумевает послушание; русское «слушаться» сохраняет обе стороны значения без отдельного пояснения.
- source_word: מִצְוֺת יְהוָה אֱלֹהֵיכֶם
  choice: заповедей Яхве, вашего Бога
  rationale: «Заповеди» — нормативный и понятный эквивалент מִצְוֺת. Тетраграмматон передан личным именем «Яхве», а приложение отделено запятой ради естественного русского синтаксиса.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: и сойдёте с пути
  rationale: Передаёт отклонение от предписанного пути и сохраняет исходную метафору; «сойти с пути» естественно звучит по-русски.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: который я указываю вам сегодня
  rationale: 'В сочетании с «путём» причастие מְצַוֶּה естественно передаётся как «указываю»: речь идёт о предписываемом пути. Настоящее время сохраняет непосредственность речи Моисея.'
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: последовав за другими богами
  rationale: Инфинитив описывает, в чём состоит сход с пути. «Последовать за» сохраняет образ движения и устойчиво выражает религиозную приверженность.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: которых вы не знали
  rationale: Прошедшее время прямо передаёт перфект; «знать» сохраняет широкое значение исходного глагола, не уточняя его как поклонение или признание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между Тетраграмматоном и титулом «Господь».
- issue: Значение תִשְׁמְעוּ אֶל в контексте завета
  choice: слушаться
  alternative: слушать
  rationale: Русское «слушаться» одновременно выражает слышание и предполагаемое им исполнение повелений. Оно не сводит глагол лишь к физическому восприятию речи.
- issue: Связь оборота לָלֶכֶת אַחֲרֵי с отклонением от пути
  choice: последовав за другими богами
  alternative: чтобы пойти за другими богами
  rationale: Деепричастный оборот естественно показывает, каким действием выражается сход с указанного пути, не навязывая более узкой причинной или целевой связи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены заветная лексика и метафора пути; синтаксис сделан ясным для обычного читателя. Стих является продолжением парной конструкции предыдущего стиха, поэтому начинается со строчной буквы и контрастного союза «а».
