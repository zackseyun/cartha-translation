  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: ru
  text: 'И знайте сегодня: я обращаюсь не к вашим детям, которые не познали и не видели наставления Яхве, вашего Бога,[a] Его величия, Его крепкой руки[b] и простёртой руки —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза эллиптична; буквально: «ведь не ваших детей, которые не знали и не видели…». По смыслу Моисей обращается к тем, кто сам был свидетелем деяний Яхве, в отличие от их детей.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «могучей руки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: И знайте сегодня
  rationale: Перфект с союзом в данном контексте вводит настойчивый призыв обратить внимание; повелительная формулировка естественна по-русски и сохраняет непосредственность обращения.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: я говорю не с вашими детьми
  rationale: 'Еврейская фраза эллиптична: управляющий глагол отсутствует. Восполнение «я говорю» ясно передаёт контраст между нынешними слушателями Моисея и их детьми, не меняя смысла.'
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: которые не знали и не видели
  rationale: Глаголы обозначают отсутствие личного, пережитого знания и свидетельства; одинаковая форма сохраняет параллелизм.
- source_word: מוּסַר
  choice: как воспитывал вас
  rationale: מוּסַר включает наставление, исправление и дисциплину. Глагольная передача естественнее в современном русском и выражает формирующее действие Бога; объект «вас» следует из контекста обращения.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, ваш Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהֵיכֶם — прямым соответствием «ваш Бог».
- source_word: גָּדְלוֹ
  choice: Его величия
  rationale: Передаёт проявленное в деяниях величие Бога и звучит естественно в перечислении.
- source_word: יָדוֹ הַחֲזָקָה
  choice: Его крепкой руки
  rationale: «Крепкая рука» достаточно буквально передаёт חֲזָקָה и сохраняет образ действенной Божьей силы.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: простёртой мышцы
  rationale: Традиционно понятный и точный библейский образ активной силы; «мышца» здесь обозначает руку от плеча и позволяет отличить זְרוֹעַ от יָד.
theological_decisions:
- issue: Эллиптическое противопоставление «не вашим детям»
  choice: 'Восполнить: «я говорю не с вашими детьми»'
  alternative: «ведь не ваши дети…»
  rationale: 'В оригинале после отрицания и прямого дополнения нет управляющего глагола. Восполнение делает русскую фразу связной и сохраняет контекстуальный смысл: Моисей обращается к очевидцам деяний Яхве, а не к следующему поколению.'
- issue: Значение מוּסַר применительно к действиям Яхве
  choice: «как воспитывал вас»
  alternative: «наказания / наставления Яхве»
  rationale: Слово совмещает педагогический и исправительный аспекты. «Воспитывал» не сводит его ни только к наказанию, ни только к словесному наставлению.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Эллипсис раскрыт для ясности, но отмечен сноской. Тире и конечная запятая показывают, что синтаксическая конструкция продолжается в следующем стихе.
