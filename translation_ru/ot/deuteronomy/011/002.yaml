revisions:
- from: 'И знайте сегодня: я говорю не с вашими детьми, которые не знали и не видели, как воспитывал вас Яхве, ваш Бог,[a] — не видели Его величия, Его крепкой руки[b] и простёртой мышцы, —'
  to: 'И знайте сегодня: я обращаюсь не к вашим детям, которые не познали и не видели наставления Яхве, вашего Бога,[a] Его величия, Его крепкой руки[b] и простёртой руки —'
  rationale: Перестроено предложение, чтобы «не познали и не видели» относилось ко всем дополнениям, как в еврейском тексте. «Наставление Яхве» сохраняет смысл מוּסַר как формирующего, в том числе исправляющего воздействия, не добавляя невыраженный объект. Эллипсис восполнен нейтральным «я обращаюсь не к» и пояснён сноской. «Простёртая рука» заменяет архаизирующее и в современном употреблении неестественное «простёртая мышца».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'В черновике выражение «не знали и не видели, как воспитывал вас Яхве» меняет синтаксические связи оригинала: оба глагола относятся к существительному מוּסַר и последующему перечню («наставления/вразумления Яхве, Его величия, Его сильной руки и простёртой руки»), а не к придаточному «как воспитывал вас». Добавленное «вас» также не выражено в данном стихе. Эллиптическое «я обращаюсь не к вашим детям» допустимо как контекстуальное восполнение и отмечено сноской.'
  naturalness: Исправленный текст сохраняет современный литературный строй. «Наставление» естественно передаёт педагогический аспект מוּסַר; «простёртая рука» — понятный современному читателю библейский образ. Конечное тире сохраняет незавершённость синтаксиса, продолжающегося в следующем стихе.
  terminology: «Яхве, ваш Бог» последовательно передаёт יהוה אֱלֹהֵיכֶם. «Крепкая рука» точно отражает חֲזָקָה; вариант «могучая» уместно оставить в сноске. «Наставление» не сводит מוּסַר исключительно к наказанию или к семейному воспитанию.
  issues:
  - severity: high
    issue: Неверная синтаксическая передача מוּסַר и последующего перечисления
    rationale: Фраза «не знали и не видели, как воспитывал вас Яхве» превращает дополнение «наставление Яхве» в придаточное образа действия и вводит объект «вас». В еврейском тексте «не знали и не видели» управляют «наставлением Яхве, вашего Бога, Его величием, Его сильной рукой и простёртой рукой».
  - severity: medium
