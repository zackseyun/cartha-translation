base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: ru
  text: 'и то, что Он сделал с Дафаном и Авирамом, сыновьями Елиава, сына Рувима: как земля раскрыла свои уста и поглотила их, их дома[a], их шатры и всё, что было при них[b], посреди всего Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их дома». Еврейское слово может обозначать как жилища, так и семьи или домочадцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всё существующее, что было у их ног». Выражение может охватывать всех и всё, что принадлежало им или находилось при них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: сделал
  rationale: Обычное значение глагола — «делать»; в ретроспективном придаточном естественно передаёт Божье действие без дополнительных толкований.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: сыновьями Елиава, сына Рувима
  rationale: Сохранена явная родословная формулировка еврейского текста, а не заменена указанием на принадлежность к колену.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: земля раскрыла уста
  rationale: Сохранена яркая персонификация оригинала; «уста» придаёт фразе уместное достоинство и сочетается с образом поглощения.
- source_word: וַתִּבְלָעֵם
  choice: поглотила их
  rationale: Точно и естественно передаёт конкретный образ еврейского глагола בלע — «глотать, поглощать».
- source_word: בָּתֵּיהֶם
  choice: их дома
  rationale: Формально соответствует слову «дома» и не устраняет возможность более широкого значения «домочадцы, семьи»; эта неоднозначность пояснена в сноске.
- source_word: אָהֳלֵיהֶם
  choice: их шатры
  rationale: Прямое значение слова ясно в контексте странствования Израиля.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: всё, что было при них
  rationale: Передаёт широкий и не вполне определённый охват выражения, не сводя его исключительно к людям, животным или имуществу; буквальный образ «у их ног» указан в сноске.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: посреди всего Израиля
  rationale: Сохраняет пространственный и публичный смысл события, совершившегося среди всего народа.
