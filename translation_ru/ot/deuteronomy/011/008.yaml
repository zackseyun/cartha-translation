base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: ru
  text: Итак, соблюдайте все заповеди[a], которые я сегодня заповедую тебе, чтобы вы укрепились[b], вошли и овладели[c] землёй, куда вы переходите, чтобы овладеть ею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всю заповедь». Единственное число употреблено собирательно и обозначает всю совокупность заповедей.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «стали сильны». Глагол может обозначать обретение силы или укрепление.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вступили во владение»; возможен также перевод «унаследовали». То же относится к словам «овладеть ею» в конце стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Итак, соблюдайте
  rationale: Глагол שׁמר в контексте завета означает исполнять, соблюдать предписания. «Итак» естественно передаёт связь с предшествующим наставлением.
- source_word: כָּל הַמִּצְוָה
  choice: все заповеди
  rationale: Еврейское единственное число имеет собирательное значение; русское множественное число ясно передаёт полноту совокупности предписаний.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я даю тебе сегодня
  rationale: «Даю» естественно передаёт действие צוה в отношении заповедей. Единственное число «тебе» сохранено, поскольку древнееврейский текст переходит от множественного обращения к Израилю как народу к корпоративному единственному.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: чтобы вы укрепились
  rationale: Конструкция выражает цель или ожидаемый результат, а חזק в породе qal допускает значение обретения силы, не уточняя её источник.
- source_word: וּבָאתֶם
  choice: вошли
  rationale: В контексте прибытия в землю בוא означает войти в неё; русское «вошли» кратко и естественно.
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: овладели ... чтобы овладеть ею
  rationale: ירשׁ здесь обозначает вступление во владение землёй. Повтор одного русского корня сохраняет намеренное лексическое повторение оригинала.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: куда вы переходите
  rationale: «Куда» естественно объединяет относительную конструкцию с направительным שָׁמָּה и сохраняет образ перехода, подразумевающего Иордан.
theological_decisions:
- issue: Чередование множественного и единственного обращения к Израилю
  choice: Сохранить «соблюдайте / вы» и единственное «тебе»
  alternative: 'Согласовать всё обращение во множественном числе: «вам»'
  rationale: Русский, в отличие от английского, позволяет без добавлений отразить грамматический переход оригинала. Он представляет Израиль одновременно как множество слушателей и как единый народ завета, не требуя догматического истолкования.
- issue: Значение ירשׁ применительно к земле
  choice: овладеть
  alternative: унаследовать / вступить во владение
  rationale: «Овладеть» сохраняет деятельный оттенок контекста вхождения в землю, тогда как «унаследовать» могло бы излишне ослабить его. Возможная наследственная семантика отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность цели и действий оригинала; направительное שָׁמָּה передано естественным русским «куда».
