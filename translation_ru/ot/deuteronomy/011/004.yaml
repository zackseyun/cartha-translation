  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: ru
  text: и что Он сделал с египетским войском, с его конями и колесницами, когда обрушил на них воды Красного моря[a], когда они преследовали вас, и Яхве погубил их до нынешнего дня;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «море Суф»; традиционно понимается как «Море тростника». Традиционный перевод — «Красное море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל מִצְרַיִם
  choice: египетское войско
  rationale: В сочетании с конями и колесницами חֵיל обозначает военную силу, то есть войско, а не богатство или силу вообще.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: с его конями и колесницами
  rationale: Местоименные суффиксы относятся к Египту как собирательному целому; «колесницы» естественно передаёт военное значение רֶכֶב в данном контексте.
- source_word: הֵצִיף אֶת מֵי
  choice: навёл ... воды
  rationale: 'Форма hifil выражает причинение действия: Бог сделал так, что воды нахлынули на преследователей. «Навёл на них воды» сохраняет причинность и звучит естественно по-русски.'
- source_word: יַם סוּף
  choice: Красное море
  rationale: В основном тексте сохранено общепринятое русское географическое название; буквальная связь סוּף с тростником или камышом отмечена в сноске.
- source_word: עַל פְּנֵיהֶם
  choice: на них
  rationale: В контексте затопления выражение означает, что воды обрушились на египтян; буквальное «на их лица» по-русски было бы неестественно и могло бы ввести в заблуждение.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: пока они гнались за вами
  rationale: Инфинитивная конструкция с בְּ указывает на одновременность действия; «пока» ясно и естественно передаёт этот временной смысл.
- source_word: וַיְאַבְּדֵם
  choice: погубил их
  rationale: Глагол אבד в каузативном значении обозначает доведение до гибели; «погубил» точно и естественно передаёт результат.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и нет их до сего дня
  rationale: Еврейский оборот указывает на сохраняющийся до времени речи результат уничтожения. Развёрнутая русская формулировка избегает ошибочного смысла, будто уничтожение продолжалось до этого дня.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Передача יַם סוּף
  choice: Красное море с лексической сноской
  alternative: Тростниковое море; море Суф
  rationale: «Красное море» остаётся узнаваемым традиционным названием, а сноска сохраняет лексическую неоднозначность и сообщает более буквальное понимание еврейского наименования.
- issue: Смысл עַד הַיּוֹם הַזֶּה после וַיְאַבְּדֵם
  choice: результат гибели сохраняется до настоящего времени
  alternative: 'буквально: «погубил их до сего дня»'
  rationale: Буквальная русская конструкция могла бы означать продолжительное уничтожение. Формулировка «и нет их до сего дня» передаёт устойчивый результат, подразумеваемый еврейской идиомой.
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но общепонятной библейской интонацией. Стих сохранён как синтаксическое продолжение предыдущего контекста: начинается со строчной «и» и завершается точкой с запятой. Местоимение «Он» написано с прописной буквы как ясная отсылка к Богу в русском религиозном регистре.'
