    rationale: «Пока они гнались за вами» в русском языке обычно задаёт предел действия и может исказить одновременное обстоятельство בְּרָדְפָם אַחֲרֵיכֶם. «Когда они преследовали вас» передаёт его точнее.
  - severity: medium
    issue: Добавочное утверждение «и нет их до сего дня»
    rationale: 'עַד הַיּוֹם הַזֶּה — идиома продолжительного результата, но отдельная клауза «и нет их» отсутствует в оригинале и чрезмерно эксплицирует смысл. Следует передать идиому непосредственно: «и Яхве погубил их до нынешнего дня».'
  - severity: low
