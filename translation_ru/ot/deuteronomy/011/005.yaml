  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: ru
  text: и что Он сделал для вас в пустыне, пока вы не пришли к этому месту —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: и что
  rationale: Союз с относительной частицей продолжает начатое ранее перечисление увиденных Израилем деяний; «и что» прямо и естественно сохраняет эту связь.
- source_word: עָשָׂה
  choice: Он делал
  rationale: Глагол עשה имеет общее значение «делать»; несовершенный вид по-русски уместно передаёт совокупность и продолжительность Божьих действий в пустыне.
- source_word: לָכֶם
  choice: для вас
  rationale: Предлог ל здесь представляет действия как совершавшиеся в отношении Израиля и для него; «для вас» естественнее русского «вам» при глаголе «делать».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность странствования Израиля; традиционное и понятное русское соответствие — «пустыня».
- source_word: עַד בֹּאֲכֶם
  choice: пока вы не пришли
  rationale: Первое עַד выражает временной предел. Конструкция «пока… не» естественно передаёт по-русски действие, продолжавшееся до момента прибытия, без отрицательного смысла.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: на это место
  rationale: Второе עַד имеет пространственное значение и указывает достигнутый пункт; с глаголом «прийти» современный русский требует естественной конструкции «на это место».
theological_decisions:
- issue: Неявно выраженное подлежащее при עָשָׂה
  choice: «Он» с прописной буквы, относящееся к Господу
  alternative: «он» со строчной буквы или явное «Господь»
  rationale: Из контекста подлежащим является Господь. Русское предложение требует местоименного подлежащего; «Он» сохраняет контекстуальную отсылку, тогда как повтор имени «Господь» добавил бы отсутствующее в данном стихе слово.
translation_notes:
  register: Современный литературный русский с сохранением синтаксической незавершённости отрывка как части более длинного перечисления. Запятая перед тире показывает продолжение конструкции в следующем стихе; формулировка остаётся ясной и достойной без архаизмов.
