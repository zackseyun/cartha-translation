  text: אֶֽת הַ/בְּרָכָ֑ה אֲשֶׁ֣ר תִּשְׁמְע֗וּ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: ru
  text: благословение[a] — если вы будете слушаться[b] заповедей Яхве, вашего Бога, которые я заповедую вам сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благословение, которое придёт, когда вы будете слушаться заповедей Яхве, вашего Бога». Еврейская относительная частица здесь имеет условный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будете слушать». В еврейском языке этот глагол часто означает такое слушание, которое выражается в послушании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: благословение
  rationale: 'Форма с показателем прямого дополнения продолжает начатую в предыдущем стихе конструкцию: Моисей предлагает народу благословение и проклятие. Краткая форма сохраняет эту синтаксическую связь без добавления отсутствующего в тексте глагола.'
- source_word: אֲשֶׁר
  choice: если
  rationale: Относительная частица здесь имеет условный оттенок и вводит условие получения благословения.
- source_word: תִּשְׁמְעוּ אֶל
  choice: будете слушаться
  rationale: Глагол שׁמע с предлогом אֶל означает внимать, прислушиваться и в контексте завета предполагает ответное послушание. Русское «слушаться» естественно сочетает смысл слышания и повиновения.
- source_word: מִצְוֺת
  choice: заповедей
  rationale: «Заповеди» точно передаёт юридический и заветный характер Божьих повелений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: 'Суффикс второго лица множественного числа выражает принадлежность: «вашего Бога».'
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: которые я заповедую вам сегодня
  rationale: Причастие מְצַוֶּה передаёт совершаемое сейчас повеление Моисея; настоящее время и слово «сегодня» сохраняют непосредственность речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано как «Яхве», а не заменено титулом. Это не добавляет конфессионального толкования.
- issue: Связь благословения с послушанием
  choice: если вы будете слушаться
  alternative: за то, что вы послушаетесь; которое будет, когда вы послушаетесь
  rationale: Условная передача сохраняет контекстуальную функцию אֲשֶׁר, не превращая высказывание ни в утверждение о уже совершённом послушании, ни в более развёрнутое богословское объяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире обозначает пояснительно-условное продолжение эллиптической конструкции предыдущего стиха. Местоимение «вы» делает множественное число адресата явным.
