  terminology: «Пустыня», «Ливан», «Евфрат», «граница» и «западное море» передают соответствующие географические обозначения адекватно. Строчная буква в «западном море» не отменяет его традиционного отождествления со Средиземным морем, которое корректно дано в сноске как традиционное понимание, а не как часть основного текста.
