base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: ru
  text: Всякое место, куда ступит ваша нога, будет вашим; от пустыни и Ливана, от Реки — реки Евфрата — до западного моря[a] будет проходить ваша граница.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «последнего моря» или «заднего моря»; традиционно под ним понимается Средиземное море, расположенное к западу.'
    reason: Сохраняет буквальный пространственный образ еврейского выражения и указывает его общепринятое географическое понимание.
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Всякое место
  rationale: 'Передаёт распределительное значение выражения: каждое место, а не одну местность как единое целое.'
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: куда ступит ваша нога
  rationale: Естественная русская формулировка сохраняет конкретный образ вступления ногой; буквальное «ступит подошва вашей ноги» звучало бы неестественно.
- source_word: לָכֶם יִהְיֶה
  choice: будет вашим
  rationale: Кратко и прямо передаёт обещание принадлежности.
- source_word: מִן הַמִּדְבָּר
  choice: от пустыни
  rationale: «Пустыня» в данном географическом контексте естественно передаёт מִדְבָּר, не уточняя конкретную названную область без основания в тексте.
- source_word: וְהַלְּבָנוֹן
  choice: и Ливана
  rationale: Сохранена сочинительная связь еврейского текста в несколько напряжённой формуле «от пустыни и Ливана», без превращения её в более однозначное «до Ливана».
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: от Реки — реки Евфрата
  rationale: Сохранены родовое обозначение с определённостью («Река») и последующее уточняющее наименование Евфрата.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: до Западного моря
  rationale: В географической ориентации древнееврейского текста אַחֲרוֹן обозначает море позади, то есть на западе; буквальное значение отмечено в сноске.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: будет проходить ваша граница
  rationale: Передаёт единственное число גְּבוּל и естественно связывает границу с перечисленными географическими пределами.
theological_decisions:
- issue: Географический характер обещания
  choice: Передать стих как обещание территории с указанными пределами, не уточняя способ или эпоху его исполнения.
  alternative: Истолковать границы как идеальные либо как безусловное вечное владение.
  rationale: Сам стих формулирует территориальное обещание, но не разрешает более широких вопросов об исполнении, типологии или продолжительности владения.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Синтаксическая неоднозначность сочетания «от пустыни и Ливана» сохранена; тире выделяют пояснительное повторение названия Евфрата.
