source:
  edition: WLC
  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: ru
  text: Разве не находятся они за Иорданом[a], по ту сторону дороги, ведущей к закату[b], в земле хананеев, живущих в Араве, напротив Галгала, у дубов Море[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по ту сторону Иордана». Еврейское выражение — географический оборот, точный смысл которого зависит от точки отсчёта.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за дорогой захода солнца»; выражение указывает в сторону запада, однако точное пространственное отношение допускает разные толкования.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «у терпентинных деревьев Море». Еврейское слово может обозначать дуб либо терпентинное дерево.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Разве не находятся они
  rationale: Риторический вопрос предполагает утвердительный ответ; местоимение во множественном числе указывает на две горы, названные в предыдущем стихе.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Естественная русская передача географического оборота без чрезмерного уточнения точки отсчёта; возможный вариант отмечен в сноске.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: по ту сторону дороги, ведущей к закату
  rationale: Сохраняет пространственное значение אַחֲרֵי, явно названную дорогу и образ заходящего солнца, не сводя неоднозначную фразу просто к указанию «на западе».
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: в земле хананеев
  rationale: Еврейское собирательное обозначение народа в единственном числе естественно передаётся по-русски множественным числом.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: живущих в Араве
  rationale: Причастие в единственном числе согласуется с собирательным этнонимом; в русском переводе согласование выполнено с «хананеев». Географическое название Арава сохранено, а не обобщено как «равнина».
- source_word: מוּל הַגִּלְגָּל
  choice: напротив Галгала
  rationale: Прямая и современная передача пространственного отношения с принятой русской формой топонима.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: у дубов Море
  rationale: אֵצֶל выражает близость, а אֵלוֹן может обозначать дуб или терпентинное дерево; основной текст использует понятное «дубы», сохраняя альтернативу в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис вопроса сделан естественным для русского читателя, географические названия переданы как Иордан, Арава, Галгал и Море. Необычный образ дороги к закату сохранён, а не заменён однозначным указанием стороны света.
