  source_fidelity: Текст точно передаёт целевое значение וּלְמַעַן («чтобы»), идиому долголетия («долго жили»), обещанную землю, клятву Яхве, адресатов дара («вашим отцам и их потомству») и образ земли, изобильной молоком и мёдом. Местоимение «их» корректно отсылает к «вашим отцам», как и לָהֶם וּלְזַרְעָם в еврейском тексте.
