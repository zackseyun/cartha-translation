  terminology: «Яхве» последовательно передаёт тетраграмматон. «Отцам» сохраняет конкретную лексику אֲבוֹת, а «потомству» удачно передаёт собирательное זֶרַע. Сноски корректно отмечают доступные лексические альтернативы без навязывания интерпретации.
