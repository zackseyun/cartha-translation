source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: ru
  text: чтобы вы долго жили на земле, которую Яхве поклялся дать вашим отцам[a] и их потомству[b], — земле, где текут молоко и мёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашим предкам». Буквально: «вашим отцам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их семени». Еврейское слово может собирательно обозначать потомство или более широкий круг потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: чтобы
  rationale: Естественно передаёт целевое значение еврейского союза и связывает стих с предшествующим контекстом.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: вы долго жили
  rationale: Еврейская идиома буквально означает «продлили дни»; по-русски её смысл естественно выражается как «долго жили».
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: Сохраняет предлог עַל и передаёт הָאֲדָמָה как обетованную территорию, а не просто почву.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: которую Яхве поклялся
  rationale: Сохраняет относительную конструкцию и явно выраженную торжественность клятвы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לַאֲבֹתֵיכֶם
  choice: вашим отцам
  rationale: Формально и точно отражает אֲבוֹת; более широкое контекстуальное понимание «предкам» отмечено в сноске.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: дать им и их потомству
  rationale: «Потомство» естественно передаёт собирательное единственное число זֶרַע, не ограничивая его одним поколением.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: земле, где текут молоко и мёд
  rationale: Сохраняет традиционный образ изобилия и плодородия; русская придаточная конструкция звучит естественно и ясно.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Кому была поклялась дать землю
  choice: «дать вашим отцам и их потомству»
  alternative: «дать вам»
  rationale: Сохранены оба явно названных в еврейском тексте адресата дара — отцы и их потомство; местоименные связи не упрощены.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным, при этом сохранены целевая связь, клятвенная формула, Божественное имя и собирательный смысл «потомства».
