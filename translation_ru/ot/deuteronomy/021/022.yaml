lexical_decisions:
- source_word: וְכִי
  choice: Если
  rationale: Вводит условный правовой случай; в русском начальное «и» не требуется и утяжеляло бы формулировку.
- source_word: יִהְיֶה בְאִישׁ
  choice: на ком-либо будет
  rationale: Естественно передаёт еврейскую конструкцию существования «будет в человеке», не делая пол участника главным смысловым акцентом; контекст далее сохраняет мужской род местоимения.
- source_word: חֵטְא
  choice: грех
  rationale: Сохраняет нравственно-правовой объём слова, не сужая его до чисто гражданского преступления.
- source_word: מִשְׁפַּט מָוֶת
  choice: заслуживающий смерти
  rationale: Передаёт смысл трудной конструкции «суд/приговор смерти» как основания для смертной казни, а альтернативы отмечены в сноске.
- source_word: וְהוּמָת
  choice: и его предадут смерти
  rationale: Формально-правовая передача каузативно-пассивной формы глагола מות.
- source_word: וְתָלִיתָ אֹתוֹ
  choice: а ты повесишь его
  rationale: Форма второго лица единственного числа передана будущим совершенного вида; «а» естественно связывает следующий этап условного случая.
- source_word: עַל עֵץ
  choice: на дереве
  rationale: Сохраняет основной и интертекстуально значимый образ еврейского עֵץ, не уточняя без достаточных оснований конструкцию как столб.
theological_decisions:
- issue: Пол участника правового случая
  choice: на ком-либо … его
  alternative: на мужчине / у мужчины
  rationale: אִישׁ может обозначать отдельного человека в казуистическом праве. Русское «на ком-либо» естественно, а мужской референт остаётся явным в «его»; текст не расширяется и не ограничивается доктринально.
- issue: Значение מִשְׁפַּט מָוֶת
  choice: грех, заслуживающий смерти
  alternative: грех, за который полагается смерть / смертный приговор
  rationale: Фраза допускает оттенок как объективной тяжести проступка, так и судебного приговора; основной текст остаётся ясным, а неоднозначность сохраняется в сноске.
- issue: Образ עֵץ
  choice: дерево
  alternative: столб
  rationale: Буквальное «дерево» сохраняет формулировку и её библейские переклички, не навязывая реконструкцию способа выставления тела.
translation_notes:
  register: Современный литературный русский с достоинством правового текста. Синтаксис условного установления сохранён; стих намеренно оканчивается запятой, поскольку предложение продолжается в следующем стихе. Все сноски отмечены в основном тексте.
