base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: ru
  text: Тогда все мужчины его города пусть побьют его камнями, и он умрёт. Так искорени зло из своей среды, и весь Израиль услышит и устрашится.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  choice: пусть побьют его камнями
  rationale: В судебно-правовом контексте רגם обозначает казнь через побиение камнями; такая формулировка естественна по-русски и сохраняет предписывающую силу формы.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: все мужчины его города
  rationale: Сочетание אַנְשֵׁי עִירוֹ буквально и по смыслу указывает на мужчин города; нейтральное «жители» скрыло бы выраженную в источнике мужскую семантику.
- source_word: בָאֲבָנִים
  choice: камнями
  rationale: Сохраняется конкретное указание на средство казни без избыточного повторения.
- source_word: וָמֵת
  choice: и он умрёт
  rationale: Передаёт последовательный результат предписанного действия, не превращая его явно в придаточное цели.
- source_word: וּבִעַרְתָּ
  choice: искорени
  rationale: В повторяющейся второзаконнической правовой формуле בער означает устранение зла из общины, а не буквальное сожжение; «искорени» сохраняет силу и торжественность формулы.
- source_word: הָרָע
  choice: зло
  rationale: Передаёт абстрактную нравственно-правовую категорию без сужения до отдельного проступка.
- source_word: מִקִּרְבֶּךָ
  choice: из своей среды
  rationale: Естественно передаёт общинный оборот и сохраняет обращение к Израилю как единому целому во втором лице единственного числа.
- source_word: יִשְׁמְעוּ
  choice: услышит
  rationale: Сохраняет простой смысл глагола «слышать»; добавление «об этом» понятно из контекста, но отсутствует в еврейском тексте.
- source_word: וְיִרָאוּ
  choice: и устрашится
  rationale: Передаёт вызванный судебным наказанием страх и его сдерживающее значение, не сводя смысл к почтению.
theological_decisions:
- issue: Гендерно маркированное обозначение городской общины
  choice: все мужчины его города
  alternative: все жители его города
  rationale: Еврейское אַנְשֵׁי имеет мужскую семантику. Выбранный вариант сохраняет её, не делая дополнительных выводов о гендерных ролях за пределами данного закона.
- issue: Второзаконническая формула устранения зла
  choice: искорени зло из своей среды
  alternative: удали зло из своей среды
  rationale: «Искорени» лучше сохраняет торжественную правовую силу повторяющейся формулы, тогда как «удали» звучит слабее; буквальное значение «выжги» здесь контекстуально неуместно.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью правового предписания. Будущее время «умрёт», «услышит», «устрашится» передаёт последовательность и ожидаемый результат; «пусть побьют» естественно выражает предписание. Формульная связь передана словом «Так».
