lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном казуистическом установлении союз вводит предполагаемую жизненную ситуацию; «когда» естественно передаёт эту функцию, не превращая её в отвлечённое условие.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: выйдешь на войну
  rationale: Сохраняет конкретный образ выхода и естественно звучит в современном русском языке.
- source_word: עַל אֹיְבֶיךָ
  choice: против своих врагов
  rationale: Предлог עַל при враждебном действии означает «против»; возвратное «своих» естественно соотносит врагов с подлежащим второго лица.
- source_word: וּנְתָנוֹ
  choice: отдаст их
  rationale: נתן передано прямым глаголом «отдаст». Хотя еврейский суффикс имеет единственное число, он, вероятнее всего, обозначает вражескую силу собирательно; в русском контексте естественно множественное «их».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямо передаёт существительное с суффиксом второго лица единственного числа и сохраняет заветную формулу.
- source_word: בְּיָדֶךָ
  choice: в твои руки
  rationale: Сохраняет еврейский образ передачи в чью-либо власть; русская идиома обычно употребляет здесь множественное число «руки».
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: и ты возьмёшь у них пленников
  rationale: Естественно передаёт результат захвата людей из среды побеждённого врага, а примечание сохраняет заметную в еврейском однокоренную конструкцию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Число местоименного суффикса при וּנְתָנוֹ и שִׁבְיוֹ
  choice: 'Множественное число по собирательному смыслу: «их», «у них»'
  alternative: 'Буквальное единственное число: «его», «у него»'
  rationale: Суффиксы формально стоят в единственном числе, тогда как названные перед этим «враги» — во множественном. Перевод следует вероятному собирательному употреблению, не скрывая формальную особенность оригинала в примечании.
