translation:
  language: ru
  text: то пусть твои старейшины и судьи выйдут и измерят расстояние до городов, расположенных вокруг убитого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: то пусть… выйдут
  rationale: Вав с перфектом продолжает последовательность предписанной законом процедуры; «то пусть» естественно передаёт её следующий этап.
- source_word: זְקֵנֶיךָ
  choice: твои старейшины
  rationale: Сохранены значение должностных представителей общины и обращение к Израилю во втором лице единственного числа.
- source_word: וְשֹׁפְטֶיךָ
  choice: и судьи
  rationale: Форма от שׁפט обозначает лиц, осуществляющих судебную власть; «судьи» прямо соответствует юридическому контексту.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: и измерят расстояние до городов
  rationale: Хотя буквально сказано «измерят до городов», по-русски естественно уточнить подразумеваемый объект измерения — расстояние; города остаются конечными точками измерения.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: расположенных вокруг
  rationale: Оборот ясно и естественно обозначает окрестные города относительно места, где находится убитый.
- source_word: הֶחָלָל
  choice: убитого
  rationale: חָלָל означает человека, погибшего насильственной смертью. Субстантивированное «убитого» сохраняет эту смысловую точность, не добавляя вывода о юридически установленном убийстве.
