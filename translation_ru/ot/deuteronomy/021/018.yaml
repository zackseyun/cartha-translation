base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: ru
  text: Если у человека есть сын, упрямый и непокорный, который не слушается ни отца, ни матери[a], и родители вразумляют его[b], а он их не слушается,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не слушает голоса своего отца и голоса своей матери». Здесь «слушать голос» означает внимать наставлению и повиноваться.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское «и» можно по смыслу передать уступительно: «хотя родители вразумляют его, он их не слушается».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Вводит условие казуистического закона; «если» естественно для современной русской правовой формулировки, хотя возможно и «когда».
- source_word: יִהְיֶה לְאִישׁ
  choice: у человека есть
  rationale: Еврейская конструкция бытия с дательным значением выражает обладание; по-русски естественно «у человека есть».
- source_word: בֵּן
  choice: сын
  rationale: Существительное обозначает именно сына, а не ребёнка вообще.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: упрямый и непокорный
  rationale: Сочетание описывает стойкое сопротивление и открытое неподчинение; перевод сохраняет парность и нарастание характеристики.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: не слушается
  rationale: שׁמע буквально связано со слушанием, но в контексте родительского авторитета включает повиновение; русское «слушаться» естественно передаёт оба оттенка.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: ни отца, ни матери
  rationale: Буквально «голоса отца и голоса матери»; под отрицанием русская конструкция «ни… ни…» естественно передаёт отказ внимать их властному наставлению.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: и родители наставляют его
  rationale: יסר обозначает исправительное воспитание или дисциплинирование, не обязательно телесное наказание. «Наставляют» сохраняет педагогическую направленность; подлежащее уточнено как родители по ближайшему контексту.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: но он их не слушается
  rationale: Противительный союз естественно раскрывает контекстуальный контраст, а повтор «слушается» сохраняет повторение שׁמע.
theological_decisions:
- issue: Характер родительского воздействия יסר
  choice: наставляют
  alternative: наказывают / подвергают взысканию
  rationale: Текст говорит об исправительной дисциплине, но не уточняет её способ; перевод не вводит представление о непременно телесном или карательном воздействии.
- issue: Связь между наставлением и продолжающимся неповиновением
  choice: и родители наставляют его, но он их не слушается
  alternative: хотя родители наставляют его, он их не слушается
  rationale: Союзы переданы так, чтобы показать контраст, не делая уступительное прочтение единственно возможным.
translation_notes:
  register: Современный литературный русский язык с ясной формулировкой казуистического закона. «Человек» предпочтён более узкому «мужчина», «не слушается» передаёт одновременно слушание и повиновение. Синтаксис оставлен незавершённым запятой, поскольку стих составляет условную часть положения, продолжающегося в следующем стихе.
