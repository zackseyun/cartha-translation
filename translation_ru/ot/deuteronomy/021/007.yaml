  - marker: b
    text: 'По смыслу: «не были свидетелями этого». В еврейском тексте буквально сказано: «наши глаза не видели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: И пусть они ответят и скажут
  rationale: Сочетание ענה и אמר вводит официальный устный ответ. Конструкция «пусть… ответят и скажут» естественно передаёт предписание в данном обрядово-правовом контексте и сохраняет оба глагола.
- source_word: יָדֵינוּ
  choice: наши руки
  rationale: 'Сохранён конкретный образ частей тела: «руки» обозначают непосредственное участие и ответственность за убийство.'
- source_word: לֹא שפכה אֶת־הַדָּם הַזֶּה
  choice: не проливали этой крови
  rationale: Сочетание שפך с דם — устойчивое выражение о пролитии крови, то есть убийстве. Формулировка сохраняет конкретное еврейское «этой крови», не заменяя его более толковательным «не совершали этого убийства».
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: и наши глаза этого не видели
  rationale: Сохранён телесный образ «наши глаза». Местоимение «этого» естественно отсылает к убийству, не сужая значение до исключительно юридического термина «не были свидетелями».
