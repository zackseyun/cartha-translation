translation:
  language: ru
  text: 'И пусть они ответят и скажут: «Наши руки не проливали этой крови[a], и наши глаза этого не видели[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «эта кровь» — правовая формула, отрицающая ответственность за убийство.
