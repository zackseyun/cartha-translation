base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: ru
  text: Так ты очистишь свою среду от вины за невинно пролитую кровь[a], если будешь поступать правильно в глазах Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «устранишь невинную кровь из своей среды». Выражение «невинная кровь» здесь может подразумевать ответственность общины за кровопролитие, вина за которое ещё не снята.'
    reason: lexical_alternative
  - marker: b
    text: 'Союз можно также понять как «когда» или «потому что»: «когда (или: потому что) будешь поступать правильно в глазах Яхве».'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאַתָּה
  choice: Так ты
  rationale: Союз и самостоятельное местоимение образуют подчёркнутый итоговый переход; «так ты» естественно связывает стих с предписанными выше действиями и сохраняет обращение во втором лице единственного числа.
- source_word: תְּבַעֵר
  choice: устранишь
  rationale: Пиэль глагола בער во второзаконнических правовых текстах означает удаление или искоренение зла и связанной с ним вины. «Устранишь» передаёт этот смысл без неуместного буквального образа сожжения.
- source_word: הַדָּם הַנָּקִי
  choice: вину за невинно пролитую кровь
  rationale: Буквально выражение означает «невинную кровь», но в данном контексте речь идёт об ответственности общины за неотомщённое кровопролитие. Добавление слова «вину» делает правовой смысл понятным по-русски; буквальная форма сохранена в примечании.
- source_word: מִקִּרְבֶּךָ
  choice: из своей среды
  rationale: 'Сохранён характерный для Второзакония общинно-правовой оборот: ответственность должна быть удалена из среды народа.'
- source_word: כִּי
  choice: потому что
  rationale: Союз прочитан как указывающий на основание или объяснение предыдущего утверждения. Поскольку возможны также временное и условное понимания, они отмечены в сноске.
- source_word: תַעֲשֶׂה הַיָּשָׁר
  choice: поступишь так, как правильно
  rationale: Субстантивированное прилагательное הַיָּשָׁר означает «правильное, справедливое»; глагол עשה здесь естественно передаётся русским «поступить».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена прозрачная древнееврейская метафора Божьей оценки и личное заветное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Значение выражения «невинная кровь»
  choice: В основном тексте явно обозначена вина общины за невинно пролитую кровь.
  alternative: 'Буквально: «устранишь невинную кровь из своей среды».'
  rationale: Контекст обряда по поводу нераскрытого убийства показывает, что устраняется не сама кровь как вещество, а ответственность за кровопролитие; сноска сохраняет образность и формальную неоднозначность еврейского выражения.
- issue: Связь, выраженная союзом כִּי
  choice: 'Причинная: «потому что».'
  alternative: 'Временно-условная: «когда» или «если».'
  rationale: Причинное значение возможно и соответствует структуре итогового предписания, но форма допускает временное либо условное прочтение; напряжение не снимается молча, а отражается в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное заветное имя, а не заменён титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Сохранены общинная направленность обращения, метафора «в глазах» и имя Яхве; неестественная для русского буквальная конструкция с «устранением крови» разъяснена в сноске.
