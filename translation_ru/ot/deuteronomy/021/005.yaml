    rationale: В нормативно-правовом изложении исходная форма естественнее передаётся русским будущим «И подойдут», без дополнительного оттенка пожелания или приказа, вносимого частицей «пусть».
  - severity: medium
    issue: «Всякий случай причинения вреда»
    rationale: 'Это развернутое юридическое истолкование נֶגַע, предполагающее причинение вреда и превращающее предмет в «случай». Исходное слово шире: оно может обозначать удар, повреждение, поражение или бедствие. «Всякое повреждение» сохраняет эту широту лучше; примечание фиксирует альтернативы.'
  - severity: low
    issue: Личные формы «чтобы они служили Ему и благословляли»
    rationale: Смысл не искажён, однако инфинитивы после «избрал» стилистически компактнее и ближе к двум еврейским инфинитивам цели.
