  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: ru
  text: И подойдут священники, сыны Левия, ибо их избрал Яхве, твой Бог, чтобы служить Ему и благословлять именем Яхве; по их слову будет решаться всякая тяжба и всякое повреждение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «удар», «телесное повреждение», «поражение» или «бедствие». В данном юридическом контексте оно, вероятно, относится к делам о причинённом вреде.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: И пусть подойдут
  rationale: Нифаль глагола נגשׁ обозначает приближение священников для официального участия в обряде и разбирательстве. «Пусть подойдут» естественно передаёт предписывающую силу формы.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: священники, сыны Левия
  rationale: Сохранено еврейское приложение и традиционное библейское выражение, остающееся понятным современному читателю.
- source_word: כִּי בָם בָּחַר
  choice: ведь их избрал
  rationale: כִּי вводит основание полномочий священников, а перфект указывает на совершённое избрание с сохраняющимся результатом.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Личное заветное имя передано как «Яхве», а местоимение второго лица единственного числа сохранено.
- source_word: לְשָׁרְתוֹ
  choice: чтобы они служили Ему
  rationale: שרת в данном контексте означает священническое служение; русское «служили Ему» ясно и не привносит лишних культовых уточнений.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: и благословляли именем Яхве
  rationale: Формулировка сохраняет представление о благословении, произносимом с Божьей властью и от Его имени.
- source_word: וְעַל פִּיהֶם
  choice: По их слову
  rationale: Буквально «по их устам» — идиома, обозначающая авторитетное устное решение. Русское выражение сохраняет речевой образ и юридический смысл.
- source_word: יִהְיֶה כָּל רִיב
  choice: будет решаться всякая тяжба
  rationale: Глагол היה буквально значит «будет», однако в юридическом контексте русский язык требует смыслового сказуемого. «Будет решаться» передаёт роль священнического постановления.
- source_word: וְכָל נָגַע
  choice: и всякий случай причинения вреда
  rationale: נֶגַע может обозначать удар, поражение, повреждение или бедствие. В юридическом окружении выражение, вероятно, относится к разбирательствам о причинённом вреде, но примечание сохраняет широту слова.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» отличает личное заветное имя от титула и не добавляет конфессионального истолкования.
- issue: Характер полномочий священников в выражении וְעַל־פִּיהֶם יִהְיֶה
  choice: По их слову будет решаться
  alternative: На их власти будет основано решение
  rationale: Выбранный вариант передаёт авторитет священнического слова, не уточняя сверх текста, являются ли они единственными судьями или официально подтверждают решение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены обращение на «ты», приложение «сыны Левия» и повтор имени Яхве; синтаксис слегка упрощён ради ясности без устранения юридической неоднозначности.
