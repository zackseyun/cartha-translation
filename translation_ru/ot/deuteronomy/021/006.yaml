  text: וְ/כֹ֗ל זִקְנֵי֙ הָ/עִ֣יר הַ/הִ֔וא הַ/קְּרֹבִ֖ים אֶל הֶ/חָלָ֑ל יִרְחֲצוּ֙ אֶת יְדֵי/הֶ֔ם עַל הָ/עֶגְלָ֖ה הָ/עֲרוּפָ֥ה בַ/נָּֽחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: ru
  text: И все старейшины того города, ближайшие к убитому[a], должны омыть руки над телицей, которой сломали шею в русле потока[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к телу убитого». Еврейское слово может обозначать как человека, убитого насильственной смертью, так и его тело.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в долине» или «в овраге». Еврейское слово обозначает поток, его русло либо связанную с водотоком долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: И все
  rationale: Союз продолжает последовательность предписаний, а כֹּל указывает на всю названную группу.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: старейшины того города
  rationale: זִקְנֵי обозначает старейшин как гражданских руководителей, а указательное определение сохранено словом «того».
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: ближайшие к убитому
  rationale: Форма множественного числа согласуется со старейшинами и выражает пространственную близость; חָלָל означает человека, погибшего насильственной смертью, и может также обозначать его тело.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: должны омыть руки
  rationale: Имперфект в законодательном контексте передаёт обязательное процедурное действие; «омыть руки» естественно для ритуального контекста и сохраняет предписывающую силу.
- source_word: עַל
  choice: над
  rationale: Предлог здесь обозначает положение рук над телицей во время ритуального омовения.
- source_word: הָעֶגְלָה
  choice: телицей
  rationale: עֶגְלָה — молодая самка крупного рогатого скота; «телица» является точным и привычным библейско-правовым соответствием.
- source_word: הָעֲרוּפָה
  choice: которой сломали шею
  rationale: В данном обряде ערף указывает на переламывание шеи животного, а не на обычный способ заклания; перевод не вводит представления об отсечении головы оружием.
- source_word: בַנָּחַל
  choice: в русле потока
  rationale: נַחַל может обозначать поток, его русло, овраг или связанную с водотоком долину. «В русле потока» передаёт топографический смысл без малопонятного заимствования «вади».
