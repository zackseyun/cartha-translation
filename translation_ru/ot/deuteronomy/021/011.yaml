source:
  edition: WLC
  text: וְ/רָאִיתָ֙ בַּ/שִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת תֹּ֑אַר וְ/חָשַׁקְתָּ֣ בָ֔/הּ וְ/לָקַחְתָּ֥ לְ/ךָ֖ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: ru
  text: и увидишь среди пленных женщину, прекрасную собой[a], и возжелаешь её, и возьмёшь её себе в жёны[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женщину красивой наружности».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возьмёшь её себе в жёны» — еврейская идиома, означающая вступление с ней в брак.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: и увидишь среди пленных
  rationale: В последовательности условий закона перфект имеет условно-временное значение. Будущее время естественно продолжает русскую конструкцию «когда…» из предшествующего контекста; «среди пленных» передаёт собирательное значение שִׁבְיָה без излишне конкретного «военнопленных».
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: женщину, прекрасную собой
  rationale: Оборот сохраняет акцент еврейского выражения на внешней красоте и звучит естественно и достойно по-русски; буквальное «красивую видом/обликом» менее плавно.
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: и возжелаешь её
  rationale: Глагол חָשַׁק выражает сильное желание или влечение. «Возжелаешь» сохраняет его силу и не смягчает смысл до простого «она тебе понравится».
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: и возьмёшь её себе в жёны
  rationale: Формулировка близко передаёт еврейскую брачную идиому «взять себе в жёны», включая значение לְךָ, и при этом остаётся естественной для современного литературного русского языка.
theological_decisions:
- issue: Передача нравственно трудного закона без смягчения или внесения отсутствующей в стихе оценки
  choice: Сохранено прямое описание желания и взятия пленницы в жёны
  alternative: 'Передать мягче: «захочешь избрать её своей женой», либо добавить указание на принуждение или одобрение'
  rationale: Еврейский текст прямо описывает ситуацию военного плена, желание мужчины и взятие женщины в жёны. Перевод не должен ни сглаживать нравственное напряжение, ни добавлять оценку, которой нет в данном стихе.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Возжелаешь» выбрано как понятное, но не разговорное слово, сохраняющее силу исходного глагола. Синтаксис продолжает условную правовую конструкцию окружающего контекста.
