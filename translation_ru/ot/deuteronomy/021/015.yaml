  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: ru
  text: Если у мужчины есть две жены — одна любимая, а другая нелюбимая[a], — и обе, любимая и нелюбимая, родили ему сыновей, а первенец — сын нелюбимой,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ненавидимая». Еврейское слово может иметь и такое, более сильное значение; здесь, вероятно, имеется в виду жена, не пользующаяся предпочтением, в отличие от любимой.'
    reason: Лексическая альтернатива для שְׂנוּאָה и сохранение диапазона значения исходного слова.
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Вводит условный случай в казуистическом законодательстве; «если» естественно передаёт его юридическую функцию.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: у мужчины две жены
  rationale: Буквальная конструкция существования «будут у мужчины» по-русски естественно передаётся конструкцией обладания «у мужчины…».
- source_word: שְׁתֵּי נָשִׁים
  choice: две жены
  rationale: В контексте семейного и наследственного права נָשִׁים обозначает именно жён, а не просто женщин.
- source_word: הָאַחַת אֲהוּבָה
  choice: одна любимая
  rationale: Сохраняет прямое значение страдательного причастия אֲהוּבָה и противопоставление двух жён.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: а другая нелюбимая
  rationale: שְׂנוּאָה буквально может означать «ненавидимая», но в данном контрастном семейно-правовом контексте может указывать на жену, не пользующуюся любовью или предпочтением. В сноске сохранён более сильный лексический вариант.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: родили ему сыновей
  rationale: Передаёт завершённость еврейского перфекта и сохраняет конкретное значение בָנִים «сыновья», существенное для закона о первенце.
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: обе, любимая и нелюбимая
  rationale: Слово «обе» ясно показывает, что сыновей родила каждая из двух жён, а повтор прилагательных следует структуре еврейского текста.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר לַשְּׂנִיאָה
  choice: причём первенцем оказался сын нелюбимой
  rationale: 'Естественно передаёт обстоятельственную конструкцию וְהָיָה и отношение принадлежности, выраженное לְ: первородный сын рождён нелюбимой женой.'
theological_decisions:
- issue: Значение שְׂנוּאָה в контексте семейного права
  choice: нелюбимая
  alternative: ненавидимая; менее любимая
  rationale: Слово допускает более сильное значение «ненавидимая», однако в противопоставлении жён может обозначать отсутствие любви или предпочтения. Основной текст не усиливает эмоциональную враждебность, а сноска сохраняет подлинную лексическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим строем фразы. Тире выделяют противопоставление жён, а конечная запятая сохраняет незавершённость условного периода, который продолжается в следующем стихе.
