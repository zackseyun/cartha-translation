  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: ru
  text: тогда отец и мать схватят его и выведут его к старейшинам его города и к воротам его места[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Городские ворота служили общественным местом, где местные старейшины разбирали судебные дела. Или: «к воротам его города (поселения)»; буквально: «к воротам его места».'
    reason: Культурное пояснение функции ворот и сохранение лексической неоднозначности слова «место».
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: схватят его
  rationale: Глагол תפשׂ с предлогом ב обозначает физически схватить, крепко удержать; «схватят» естественно передаёт решительность юридического действия.
- source_word: אָבִיו וְאִמּוֹ
  choice: отец и мать
  rationale: Оба родителя прямо названы субъектами совместного действия; русские притяжательные формы ясны из местоимения «его» далее и из контекста.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: приведут
  rationale: Порода hифиль глагола יצא означает вывести, привести наружу. В данном контексте движение направлено из дома к месту общественного суда; «приведут» звучит естественно и не добавляет способа передвижения.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: к старейшинам его города
  rationale: זקני העיר — местные руководители и судьи; формулировка близка еврейской структуре и сохраняет официальный оттенок.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: к воротам того места, где он живёт
  rationale: מקום буквально означает «место», но здесь указывает на его населённый пункт; развёрнутая формулировка передаёт смысл естественнее, не подменяя слово повтором «город».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным юридическим тоном. Союз «тогда» сохраняет связь с условием предыдущего стиха; повтор предлога «к» перед воротами отражает синтаксический параллелизм оригинала.
