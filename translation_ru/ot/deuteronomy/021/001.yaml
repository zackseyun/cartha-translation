id: DEU.21.1
reference: Deuteronomy 21:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: ru
  text: Если на земле, которую Яхве, твой Бог, даёт тебе во владение, найдут убитого[a], лежащего в поле, и неизвестно, кто его сразил,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда найдут убитого». В еврейском тексте стоит форма мужского рода единственного числа; сам закон рассматривает случай убийства, виновник которого неизвестен.'
    reason: Сохраняет возможное временное прочтение כִּי и поясняет грамматический род חָלָל без сужения общего правового принципа.
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Вводит условие казуистического закона; «если» естественно для современного русского юридического изложения, хотя возможно и «когда».
- source_word: יִמָּצֵא
  choice: найдут
  rationale: 'Русская неопределённо-личная конструкция естественно передаёт еврейскую пассивную форму нифаля: «будет найден».'
- source_word: חָלָל
  choice: убитого
  rationale: Слово обозначает человека, погибшего насильственной смертью, а не просто мёртвое тело; субстантивированное мужское единственное число сохраняет форму оригинала.
- source_word: בָּאֲדָמָה
  choice: на земле
  rationale: Здесь אֲדָמָה означает землю как территорию, передаваемую Израилю во владение, а не почву.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: которую Яхве, твой Бог, даёт тебе во владение
  rationale: Передаёт продолжающееся дарование земли и цель — вступление во владение ею — естественным современным русским языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, посредством принятой русской транслитерации.
- source_word: נֹפֵל
  choice: лежащего
  rationale: Причастие буквально означает «павший», но в данном контексте описывает положение тела; «лежащего» ясно и естественно передаёт этот смысл.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Точно и без ненужного уточнения передаёт местность; контекст не требует добавления «открытом».
- source_word: לֹא נוֹדַע
  choice: неизвестно
  rationale: Безличная русская конструкция кратко и естественно соответствует еврейской пассивной форме.
- source_word: מִי הִכָּהוּ
  choice: кто его сразил
  rationale: «Сразил» сохраняет связь глагола נכה с нанесением удара и в контексте убитого ясно указывает на смертельный исход, не сводя выражение к нейтральному «убил».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит личное имя Бога; «Яхве» сохраняет его как имя и соответствует современной научной русской передаче.
- issue: Грамматический род слова חָלָל
  choice: убитого
  alternative: убитого человека; погибшего
  rationale: Мужской род единственного числа отражает грамматику еврейского текста, не утверждая при этом, что правовой принцип неприменим к иным жертвам неизвестного убийства.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохраняет условное построение и незавершённость стиха, который продолжается в следующем стихе.
