  source_fidelity: Текст точно передаёт казуистическое условие כִּי, пассивный смысл יִמָּצֵא через естественную неопределённо-личную конструкцию, насильственную смерть в חָלָל, землю как наследуемую территорию, имя Яхве, положение тела в поле и неизвестность того, кто нанёс смертельный удар. Сохранены мужской род и единственное число исходной формы, а также незавершённый синтаксис, продолжающийся в следующем стихе.
  naturalness: Фраза звучит естественно на современном литературном русском и сохраняет уместный библейско-правовой регистр. «На земле» в данном контексте не двусмысленно, поскольку уточнено относительным придаточным о земле, данной во владение. «Сразил» несколько возвышенно, но оправдано регистром и точно передаёт נכה без излишней интерпретации как «убил».
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Убитого» сохраняет мужской род и насильственный характер חָלָל; примечание корректно отмечает, что грамматическая форма не сужает общий правовой случай. Маркер [a] поставлен у слова, к которому относится вариант прочтения כִּי.
