  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: ru
  text: то приведи её в свой дом, и пусть она обреет себе голову и подстрижёт ногти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отрастит ногти». Буквально по-еврейски: «сделает свои ногти»; значение этой идиомы спорно.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: то приведи её
  rationale: Хифиль глагола בוא с вау продолжает последовательность предписаний. Русское «то приведи» естественно передаёт обусловленное предыдущим стихом следующее действие и повелительную силу закона.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: в свой дом
  rationale: Сочетание означает вхождение внутрь дома. Буквальное «в середину своего дома» по-русски неестественно и создаёт отсутствующий в контексте пространственный акцент.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: и пусть она обреет себе голову
  rationale: גלח означает «брить, обривать»; конструкция с רֹאשׁ естественно передаётся по-русски как «обрить себе голову».
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: и подстрижёт ногти
  rationale: Буквально выражение означает «сделает/обработает свои ногти» и является спорной идиомой. «Подстрижёт ногти» — ясное контекстуальное прочтение; существенная альтернатива сохранена в сноске.
theological_decisions:
- issue: Неоднозначность выражения וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: 'В основном тексте: женщина подстригает ногти.'
  alternative: Женщина отращивает ногти.
  rationale: Еврейский текст буквально говорит «сделает/обработает свои ногти», не уточняя действие. Для естественности основного текста выбрано традиционное контекстуальное понимание «подстрижет», но реальная лексическая неоднозначность не устранена и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, ясной формой юридического предписания. Местоимение «свой» естественно соотносит дом с адресатом. Частица «пусть» передаёт предписываемые действия женщины без тяжеловесного повторения модальной конструкции.
