  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: ru
  text: Она должна снять с себя одежду своего плена[a], жить в твоём доме и оплакивать отца и мать целый месяц. После этого ты можешь войти к ней, стать её мужем, и она станет твоей женой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одежду её плена»; возможно также: «одежду пленницы» или «одежду, которую она носила при пленении».'
    reason: Еврейский генитив допускает несколько близких пониманий; основной текст сохраняет неоднозначность, не утверждая, что речь непременно об одежде, бывшей на ней в момент захвата.
lexical_decisions:
- source_word: וְהֵסִירָה אֶת שִׂמְלַת שִׁבְיָהּ מֵעָלֶיהָ
  choice: Пусть она снимет с себя одежду, в которой была взята в плен
  rationale: Глагол в хифиле выражает снятие или удаление; «снимет с себя» естественно передаёт מֵעָלֶיהָ. Описательный оборот сохраняет вероятный смысл שִׂמְלַת שִׁבְיָהּ, не утверждая сверх текста, что это была особая одежда пленницы.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: и остаётся в твоём доме
  rationale: ישב здесь обозначает пребывание или проживание. «Остаётся» естественно для последовательности предписаний и не создаёт буквального образа сидения.
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: Пусть она оплакивает отца и мать
  rationale: Хотя בכה буквально значит «плакать», при названных объектах «отца и мать» русский глагол «оплакивать» точно передаёт контекст скорби.
- source_word: יֶרַח יָמִים
  choice: целый месяц
  rationale: Буквально «месяц дней» — еврейский оборот, обозначающий полный месячный срок. «Целый месяц» сохраняет акцент и звучит естественно по-русски.
- source_word: תָּבוֹא אֵלֶיהָ
  choice: ты можешь войти к ней
  rationale: Сохранён библейский эвфемизм сексуального сближения. Модальное «можешь» передаёт разрешительный характер нормы в данном контексте.
- source_word: וּבְעַלְתָּהּ
  choice: и стать её мужем
  rationale: Глагол בעל в этом брачно-правовом контексте указывает на вступление в положение мужа. Такой перевод не привносит оттенок имущественного обладания.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: а она станет твоей женой
  rationale: Стандартная формула брачного статуса; «станет» ясно выражает наступающий результат.
theological_decisions:
- issue: Сексуально-брачная терминология в законе о пленной женщине
  choice: Сохранить различие между «войти к ней», «стать её мужем» и «она станет твоей женой».
  alternative: Объединить всё в более гладкое «ты можешь жениться на ней» либо прямо сказать «вступить с ней в половую связь».
  rationale: Еврейский текст последовательно называет сближение, положение мужа и статус жены. Сохранение этих элементов не смягчает трудный правовой контекст и не делает его жёстче, чем позволяет оригинал.
translation_notes:
  register: Современный литературный русский с достоинством правового библейского предписания. Повелительная последовательность передана через «пусть»; архаизмы и излишне канцелярские обороты устранены. Подлинная неоднозначность выражения об одежде отмечена сноской.
