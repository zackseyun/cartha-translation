    issue: Основной текст чрезмерно конкретизирует שִׂמְלַת שִׁבְיָהּ.
    rationale: Формулировка «одежду, в которой была взята в плен» возможна как толкование, но не является единственным значением еврейского генитива. Сноска отмечает неоднозначность, однако основной текст уже выбирает одну из альтернатив. Нейтральное «одежду своего плена» лучше сохраняет исходную широту.
  - severity: low
