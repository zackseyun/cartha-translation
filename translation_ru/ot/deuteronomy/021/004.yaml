base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: ru
  text: Пусть старейшины того города отведут тёлку вниз, в долину с постоянным потоком[a], которую не возделывают и не засевают, и там, в долине, переломят тёлке шею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «в долину с неиссякающим потоком» или «в долину с проточной водой». Еврейское выражение נַחַל אֵיתָן, вероятно, обозначает долину или русло с постоянным водным потоком; его также понимают как «суровую» или «крепкую» долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: отведут ... вниз
  rationale: Каузативная форма от ירד означает «заставить спуститься, свести вниз»; выражение передаёт движение в низлежащую долину.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: старейшины того города
  rationale: Естественная передача устойчивого сочетания в законодательном контексте.
- source_word: הָעֶגְלָה
  choice: тёлку
  rationale: Слово עֶגְלָה обозначает молодую самку крупного рогатого скота; «тёлка» точно и понятно современному читателю.
- source_word: אֶל נַחַל אֵיתָן
  choice: в долину с постоянным потоком
  rationale: נַחַל может обозначать долину, русло или поток, а אֵיתָן — постоянный, непрерывный. Перевод сохраняет вероятную связь с непрекращающимся водным потоком, не используя малознакомое русскому читателю слово «вади».
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: которую не возделывают и не засевают
  rationale: Обе пассивные формы относятся к сельскохозяйственному использованию местности; пара глаголов естественно звучит по-русски.
- source_word: וְעָרְפוּ
  choice: переломят ... шею
  rationale: В данном обрядовом контексте ערף указывает на переламывание шеи, а не на обычное заклание; конкретное действие сохранено.
- source_word: שָׁם ... בַּנָּחַל
  choice: там, в долине
  rationale: Сохранены и указательное наречие, и повторное обозначение места.
