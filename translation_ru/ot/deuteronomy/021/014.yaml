  source_fidelity: 'Основной смысл передан верно: условие отсутствия желания, освобождение женщины, усиленный запрет продажи, запрет на её хозяйственно-объектное использование и основание в предшествующем унижении сохранены. Однако «не используй её ради наживы» несколько сужает редкий глагол תתעמר до извлечения прибыли. В непосредственной связи с запретом продажи более точно и столь же сдержанно передать его как запрет обращать женщину в товар.'
