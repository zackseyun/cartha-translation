source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: ru
  text: Но если она тебе не желанна, отпусти её на свободу[a]. Ни в коем случае не продавай её за деньги и не обращай её в товар[b], потому что ты унизил её[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отошли её для неё самой»; то есть предоставь её самой себе, освободи её.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не обращайся с ней как с рабыней»; возможно также: «не эксплуатируй её». Еврейский глагол редок и подразумевает властное либо хозяйственно-объектное использование человека.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «потому что ты надругался над ней». Еврейское слово в зависимости от контекста может означать причинение страдания, унижение или сексуальное надругательство.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Но если
  rationale: Естественно вводит условие, противопоставленное предшествующему установлению; буквальное «и будет, если» в современном русском излишне тяжеловесно.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: она не будет тебе желанна
  rationale: Передаёт личный и эмоциональный оттенок חפץ — желание, расположение, удовольствие, — не сводя выражение только к сексуальному влечению и не добавляя отсутствующего в еврейском тексте «больше».
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: отпусти её на свободу
  rationale: Идиома, буквально означающая «отошли её для неё самой», указывает на освобождение женщины и возвращение ей самостоятельности.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: Ни в коем случае не продавай её за деньги
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает запрет; «ни в коем случае» естественно передаёт это усиление, а כֶּסֶף здесь означает деньги как плату.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: не используй её ради наживы
  rationale: Редкий глагол выражает властное или хозяйственно-коммерческое использование человека. В связи с запретом продажи формулировка подчёркивает эксплуатацию, не сужая значение исключительно до формального порабощения.
- source_word: תַּחַת אֲשֶׁר
  choice: потому что
  rationale: В данном контексте оборот указывает основание запрета; простая причинная связь наиболее естественна по-русски.
- source_word: עִנִּיתָהּ
  choice: ты унизил её
  rationale: Порода piel глагола ענה может обозначать причинение страдания, унижение и, в сексуальном контексте, надругательство. «Унизил» сохраняет широту выражения и его нравственную тяжесть.
theological_decisions:
- issue: Нравственный смысл закона о пленной женщине
  choice: Передать стих как ограничение власти мужчины над женщиной после брачно-сексуального овладения ею, прямо сохранив запреты на продажу и эксплуатацию.
  alternative: Представить происходящее лишь как обычный развод по взаимному согласию либо прямо назвать действие изнасилованием в основном тексте.
  rationale: Сам стих требует освободить женщину и запрещает превращать её в источник выгоды, поскольку мужчина её «унизил». Перевод не должен ни сглаживать принудительный контекст, ни придавать многозначному еврейскому глаголу более узкое юридическое значение, чем позволяет форма текста.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Усиленный запрет передан идиоматически. Формулировки не скрывают уязвимого положения женщины, но сохраняют лексическую неоднозначность редкого תתעמר и многозначного ענה.
