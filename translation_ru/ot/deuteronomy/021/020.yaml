  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: ru
  text: 'И скажут старейшинам его города: «Этот наш сын упрям и непокорен, он не слушается нас[a], он обжора и пьяница».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не слушает нашего голоса»; в этой еврейской идиоме слушать означает также внимать и повиноваться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: И скажут
  rationale: Форма продолжает последовательность предписанных действий в правовом установлении; союз «и» сохраняет связь с предыдущим шагом процедуры.
- source_word: זִקְנֵי עִירוֹ
  choice: старейшинам его города
  rationale: «Старейшины» точно обозначает признанных руководителей общины, а «город» соответствует обычному административно-правовому употреблению עִיר во Второзаконии.
- source_word: בְּנֵנוּ זֶה
  choice: Этот наш сын
  rationale: Так естественно передаётся указательное выражение с суффиксом первого лица множественного числа и сохраняется подчёркнутое отождествление обвиняемого.
- source_word: סוֹרֵר
  choice: упрям
  rationale: Слово обозначает стойкое нежелание подчиняться; «упрям» ясно и естественно передаёт эту характеристику.
- source_word: וּמֹרֶה
  choice: непокорен
  rationale: Причастие выражает активное сопротивление власти; «непокорен» сохраняет усиление по отношению к «упрям» и хорошо подходит к юридическому обвинению.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: он не слушается нас
  rationale: Еврейская идиома буквально говорит о слушании голоса, но в данном контексте подразумевает повиновение. Русское «не слушается нас» естественно передаёт оба оттенка; буквальная форма отмечена в сноске.
- source_word: זוֹלֵל
  choice: обжора
  rationale: В сочетании со словом «пьяница» термин обозначает человека, предающегося неумеренности в еде; существительное сохраняет характер обвинительной формулы.
- source_word: וְסֹבֵא
  choice: пьяница
  rationale: Причастие описывает человека, привычно предающегося пьянству; «пьяница» точно и понятно передаёт устойчивый характер порока.
