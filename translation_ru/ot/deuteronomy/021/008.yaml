  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: ru
  text: Соверши искупление за Твой народ Израиль, который Ты искупил, о Яхве, и не вменяй Твоему народу Израилю вину за пролитие невинной крови. Тогда с них будет снята вина за это кровопролитие.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפֵּר
  choice: Прости
  rationale: В молитвенном обращении и юридико-обрядовом контексте форма כפר означает устранение вины посредством искупления. «Прости» естественно передаёт просьбу, а примечание сохраняет более формальный вариант.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: который Ты искупил
  rationale: פדה обозначает выкуп или избавление; «искупил» сохраняет язык Божьего освобождения Израиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие имени от титула.
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב עַמְּךָ
  choice: и не возлагай вину за пролитие невинной крови на Твой народ
  rationale: Буквально говорится о том, чтобы не «помещать невинную кровь среди» народа; в данном юридическом контексте это просьба не вменять общине ответственность за кровопролитие.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: И будет искуплена их вина за пролитую кровь
  rationale: Нифаль передаёт пассивный результат, а «кровь» здесь метонимически обозначает ответственность за кровопролитие. Формулировка сохраняет пассивность и юридический смысл.
theological_decisions:
- issue: Смысл כפר в начальной просьбе
  choice: Прости
  alternative: Соверши искупление за
  rationale: Контекст допускает как прощение, так и обрядово-юридическое искупление. В основном тексте выбран естественный русский молитвенный эквивалент, а формальная сторона отмечена в сноске.
- issue: Передача заключительного הַדָּם
  choice: вина за пролитую кровь
  alternative: кровь
  rationale: Буквальное «кровь будет искуплена им» сохраняет форму, но по-русски неясно. Контекст обряда после нераскрытого убийства указывает на ответственность общины за кровопролитие.
translation_notes:
  register: Современный литературный русский, молитвенно-торжественный, но понятный. Местоимения обращения к Богу написаны с прописной буквы. Юридическая метонимия «кровь» раскрыта как вина за кровопролитие; её буквальная форма не внесена в основной текст, чтобы избежать неестественной и двусмысленной русской конструкции.
