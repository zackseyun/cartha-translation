    rationale: Основной текст заменяет обрядово-юридическое действие прощением, а более точное «соверши искупление» оставляет лишь в сноске. В этом стихе важно сохранить просьбу об искуплении за общину.
  - severity: low
    issue: Не вполне явное устранение вины в финальной клаузе
    rationale: '«Будет искуплена их вина» понятно, но формула «с них будет снята вина» яснее передаёт направленность לָהֶם: община освобождается от ответственности за кровь.'
