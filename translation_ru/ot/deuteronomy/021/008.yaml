revisions:
- from: Прости[a] Твой народ Израиль, который Ты искупил, Яхве, и не возлагай вину за пролитие невинной крови на Твой народ Израиль. И будет искуплена их вина за пролитую кровь.
  to: Соверши искупление за Твой народ Израиль, который Ты искупил, о Яхве, и не вменяй Твоему народу Израилю вину за пролитие невинной крови. Тогда с них будет снята вина за это кровопролитие.
  rationale: 'Начальная просьба исправлена так, чтобы в основном тексте сохранить значение כפר — обрядовое и юридическое искупление за народ, а не только его результат, прощение. Идиома о «невинной крови среди народа» передана естественной русской юридической формулой «не вменяй ... вину». В конце метонимия «кровь» раскрыта как вина за кровопролитие; добавлено «с них», чтобы явно выразить снятие ответственности с народа. Сноска не требуется: редакция не скрывает значимой альтернативы и не нуждается в дополнительной структурной опоре.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:07:24Z'
review_pass:
  verdict: revise
  source_fidelity: Начальное כַּפֵּר в данном обрядово-юридическом контексте означает просьбу об искуплении/очищении народа от вины; «Прости» возможно как результативное истолкование, но ослабляет этот смысл. Во втором члене «не возлагай вину» удачно передаёт юридическую направленность идиомы. Заключительное «вина за пролитую кровь» обоснованно раскрывает юридическую метонимию הַדָּם, однако «с них будет снята» яснее выражает, что вина устраняется от народа.
  naturalness: Предлагаемая редакция сохраняет современный литературный и молитвенно-торжественный регистр. «Соверши искупление за» естественно в библейско-ритуальном контексте; «с них будет снята вина» яснее, чем безличное «будет искуплена их вина».
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Искупление» для כפר и «искупил» для פדה различают обрядовое очищение от вины и прежнее избавление Израиля. Формула «вина за пролитие невинной крови» передаёт юридический смысл «невинной крови», не приписывая неустановленного виновника.
