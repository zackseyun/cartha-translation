  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: ru
  text: Не оставляй его труп на дереве на всю ночь; непременно похорони его в тот же день, потому что повешенный находится под Божьим проклятием[a]; не оскверняй своей земли, которую Яхве, твой Бог, даёт тебе в наследие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что повешенный проклят Богом»; возможно также: «потому что повешение — оскорбление Бога». Еврейская фраза кратка и допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: не должен оставаться… на ночь
  rationale: Глагол לון здесь обозначает пребывание в течение ночи; перевод ясно передаёт запрет оставлять тело до следующего дня.
- source_word: נִבְלָתוֹ
  choice: труп его
  rationale: נְבֵלָה обозначает мёртвое тело, труп; такой выбор точнее, чем более общее «тело».
- source_word: עַל הָעֵץ
  choice: на дереве
  rationale: עֵץ может означать дерево или деревянное сооружение. «На дереве» сохраняет прямой образ исходного текста и его последующие библейские отзвуки.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: непременно похорони его
  rationale: Инфинитив абсолютный при личной форме глагола усиливает повеление; наречие «непременно» передаёт эту эмфазу естественно по-русски.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот же день
  rationale: Выражение указывает, что погребение должно состояться до окончания именно этого дня.
- source_word: קִלְלַת אֱלֹהִים
  choice: под Божьим проклятием
  rationale: Краткая конструкция допускает несколько толкований. Основной перевод выражает понимание, согласно которому повешенный находится под Божьим проклятием, не устраняя альтернативы, приведённые в примечании.
- source_word: תָּלוּי
  choice: повешенный
  rationale: Страдательное причастие означает того, кто повешен или выставлен висящим. Субстантивированное «повешенный» кратко и естественно передаёт форму оригинала, хотя по-русски может ассоциироваться с казнью через повешение; контекст предыдущего стиха уточняет последовательность событий.
- source_word: תְטַמֵּא
  choice: оскверняй
  rationale: טמא применительно к земле несёт смысл нечистоты и осквернения; этот перевод сохраняет как культовый, так и нравственный оттенок.
- source_word: אַדְמָתְךָ
  choice: своей земли
  rationale: В контексте дарованного владения אֲדָמָה естественно обозначает землю, а не только почву.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: נַחֲלָה
  choice: в наследие
  rationale: נַחֲלָה обозначает наследственное владение; русское выражение «даёт… в наследие» естественно сохраняет этот смысл.
theological_decisions:
- issue: Значение כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: повешенный находится под Божьим проклятием
  alternative: «повешенный проклят Богом»; либо «повешение — оскорбление Бога»
  rationale: Еврейская фраза предельно сжата, а отношения между существительными допускают разные объяснения. Основной вариант связывает выставленного повешенным преступника с Божьим проклятием, но примечание сохраняет и другие грамматически возможные понимания.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Единственное число обращения сохранено. Эмфатическая конструкция передана словом «непременно»; неоднозначная богословски значимая фраза не разрешена безоговорочно и снабжена примечанием.
