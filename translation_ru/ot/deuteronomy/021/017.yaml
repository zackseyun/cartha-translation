  source_fidelity: Смысловой перевод в целом точно передаёт юридическое признание первенца, двойную наследственную долю и его законное право. Однако «первый плод его силы» звучит неестественно по-русски и оставляет неясной отсылку к отцу; более ясная формулировка передаёт רֵאשִׁית אֹנוֹ без изменения смысла.
  naturalness: «Но должен признать первенцем...» и «двойную долю» естественны для современного литературного русского. «Первое проявление силы отца» яснее и современнее, чем «первый плод его силы». «Право первенца принадлежит ему» естественно выражает юридический характер מִשְׁפַּט הַבְּכֹרָה.
