  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: ru
  text: Но он должен признать первенцем сына нелюбимой жены[a] и дать ему двойную долю[b] из всего своего имущества, ибо он — первое проявление силы отца[c]; право первенца принадлежит ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также: «сын ненавистной жены». В данном противопоставлении слово может обозначать жену, которую муж любит меньше.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «уста двух»; это идиома, означающая двойную наследственную долю.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «начало его силы». Речь о первенце как о первом проявлении производительной силы отца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: должен признать первенцем
  rationale: В породе хифиль глагол здесь означает юридически признать подлинный статус первенца, а не просто узнать или заметить его.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: сына нелюбимой жены
  rationale: В противопоставлении любимой жене причастие, вероятно, обозначает нелюбимую или менее любимую жену; выбранное выражение естественно по-русски и не усиливает значение до явной ненависти.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: дать ему двойную долю
  rationale: Буквальное «уста двух» является древнееврейской идиомой, означающей две наследственные доли.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: из всего своего имущества
  rationale: Оборот указывает на всё находящееся во владении отца, то есть на имущество, подлежащее разделу; естественный русский эквивалент передаёт смысл контекста.
- source_word: רֵאשִׁית אֹנוֹ
  choice: первый плод его силы
  rationale: Сохранена метафора первого проявления мужской производительной силы отца, без сведения выражения лишь к возрастному старшинству.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: право первородства
  rationale: Выражение обозначает законное наследственное преимущество, обусловленное статусом первенца.
- source_word: כִּי ... כִּי
  choice: но ... потому что
  rationale: Первое כִּי имеет противопоставительное значение относительно запрета предыдущего стиха, второе вводит основание предписания.
theological_decisions:
- issue: Значение שְׂנוּאָה применительно к жене
  choice: нелюбимая жена
  alternative: ненавистная жена; менее любимая жена
  rationale: Контекст противопоставляет двух жён по степени расположения мужа. Перевод сохраняет реляционный смысл и не утверждает более сильной эмоциональной враждебности, чем непременно требует древнееврейский текст.
- issue: Основание наследственного права первенца
  choice: ему принадлежит право первородства
  alternative: таков закон о первородстве; ему положено первородство
  rationale: מִשְׁפַּט здесь выражает установленное законом право конкретного сына, а не общее богословское учение о первородстве.
translation_notes:
  register: Современный литературный русский язык с юридически ясной формулировкой. Сохранены метафора רֵאשִׁית אֹנוֹ и последовательность аргумента; идиоматическое выражение о двойной доле передано естественно. Все сноски отмечены в основном тексте.
