  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: ru
  text: Когда он будет передавать своим сыновьям в наследство то, что ему принадлежит, он не вправе признать первенцем сына любимой жены вместо сына нелюбимой жены[a], который и есть первенец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ненавидимой жены»; возможно также: «жены, которую он любит меньше». В семейно-правовом контексте еврейское слово может указывать не на активную ненависть, а на меньшее расположение.'
    reason: Сохранение буквального сильного значения и сравнительного семейного употребления еврейского שׂנא.
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Когда
  rationale: Оборот вводит предусмотренный законом случай. В современном русском «когда» естественно передаёт временную рамку, тогда как буквальное «и будет в день» звучало бы неестественно.
- source_word: הַנְחִילוֹ אֶת־בָּנָיו אֵת אֲשֶׁר־יִהְיֶה לוֹ
  choice: он будет передавать своим сыновьям в наследство то, что ему принадлежит
  rationale: 'Сохраняет каузативное значение נחל — наделять наследством — и отдельно передаёт объект אֵת אֲשֶׁר יִהְיֶה לוֹ: принадлежащее отцу имущество.'
- source_word: לֹא יוּכַל
  choice: он не вправе
  rationale: В правовом контексте речь идёт не о физической невозможности, а об отсутствии законного права.
- source_word: לְבַכֵּר
  choice: признать первенцем
  rationale: Глагол означает предоставить или признать статус первенца. Выражение сохраняет юридический смысл, не сводя его лишь к объявлению.
- source_word: בֶּן הָאֲהוּבָה
  choice: сына любимой жены
  rationale: Причастие означает «любимая»; слово «жена» естественно восполняется из контекста закона о двух жёнах.
- source_word: עַל־פְּנֵי
  choice: вместо
  rationale: В данном сравнительном правовом обороте выражает предпочтение одного сына перед другим и попытку поставить его на место действительного первенца.
- source_word: בֶן הַשְּׂנוּאָה
  choice: сына нелюбимой жены
  rationale: Еврейское слово буквально связано с ненавистью, однако в семейном сравнении может обозначать жену, любимую меньше или не пользующуюся предпочтением. Более естественное русское «нелюбимой» сопровождается сноской, сохраняющей буквальный сильный вариант.
- source_word: הַבְּכֹר
  choice: который и есть первенец
  rationale: Относительная конструкция ясно показывает, что действительным первенцем является сын нелюбимой жены.
theological_decisions:
- issue: Контраст между двумя жёнами в законе о наследовании
  choice: «любимая» и «нелюбимая» в основном тексте с буквальным вариантом в сноске
  alternative: «любимая» и «ненавидимая»
  rationale: Еврейский текст использует сильную антонимическую пару, но в семейно-правовом контексте второй член может выражать сравнительно меньшую любовь, а не активную ненависть. Сноска сохраняет как буквальную силу, так и смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим оттенком. Синтаксис остаётся близким к структуре еврейского закона, но избегает неестественного буквального оборота «в день, когда он даст наследовать».
