  - severity: medium
    issue: Оборот «не тянула в ярме» неестественен по-русски.
    rationale: Он формально близок к еврейскому משך, но в современном литературном русском о рабочем животном обычно говорят «ходило под ярмом». Этот оборот передаёт смысл отсутствия прежнего тяглового использования; буквальное значение можно сохранить в сноске.
  - severity: low
