- from: Тогда старейшины города, ближайшего к убитому[a], пусть возьмут из стада тёлку[b], которую ещё не использовали для работы и которая не тянула в ярме[c].
  to: Тогда старейшины города, ближайшего к убитому[a], пусть возьмут из стада тёлку[b], которую не использовали в работе и которая не ходила под ярмом[c].
  rationale: 'Убрано невыраженное в оригинале «ещё». Идиоматичное «не ходила под ярмом» заменяет неестественное «не тянула в ярме», сохраняя юридически значимый смысл: тёлка прежде не использовалась для тягловой работы. Сноска к «убитому» уточнена, чтобы не ослаблять семантику חָלָל.'
