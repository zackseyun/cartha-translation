base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: ru
  text: Тогда старейшины города, ближайшего к убитому[a], пусть возьмут из стада тёлку[b], которую не использовали в работе и которая не ходила под ярмом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к телу убитого» или «к погибшему»; еврейское слово обозначает человека, убитого насильственной смертью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тёлку крупного скота», то есть молодую самку из стада.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «которая не тянула в ярме»; имеется в виду животное, прежде не использовавшееся как тягловое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Тогда
  rationale: Естественно передаёт древнееврейскую повествовательно-правовую формулу, вводящую следующий шаг предписания, без тяжеловесного буквального оборота «и будет».
- source_word: הָעִיר הַקְּרֹבָה אֶל הֶחָלָל
  choice: города, ближайшего к убитому
  rationale: Контекст придаёт прилагательному значение наивысшей степени, а חָלָל обозначает человека, погибшего насильственной смертью.
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: старейшины города… пусть возьмут
  rationale: Сохраняет правовое предписание, обращённое к признанным руководителям ближайшего города; указательное значение «того города» ясно из конструкции и естественно выражено определением.
- source_word: עֶגְלַת בָּקָר
  choice: из стада тёлку
  rationale: עֶגְלָה — молодая самка крупного рогатого скота; בָּקָר указывает на стадо, из которого её следует взять.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: которую ещё не использовали для работы
  rationale: 'Передаёт безлично-пассивный и инструментальный смысл выражения: животное прежде не использовалось в труде.'
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: которая не тянула в ярме
  rationale: Сохраняет конкретное значение משך «тянуть» и указывает на отсутствие прежней тягловой работы.
