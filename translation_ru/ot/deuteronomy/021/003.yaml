review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: ближайший к убитому город, его старейшины, тёлка из крупного скота и два условия её прежнего неиспользования сохранены. Однако «ещё» не выражено в еврейском тексте, а «не тянула в ярме» — неестественная русская сочетаемость. Идиома «не ходила под ярмом» точно передаёт запрет на прежнее применение в тягловой работе, хотя буквально глагол означает «тянула».'
  naturalness: Предложение в целом литературно, но «которую ещё не использовали для работы и которая не тянула в ярме» звучит тяжеловесно и не вполне естественно. Замена на «которую не использовали в работе и которая не ходила под ярмом» ясна и нормативна для современного литературного русского.
  terminology: «Старейшины», «убитый», «тёлка» и «ярмо» уместны и сохраняют правовой и формальный регистр. Не следует заменять «тёлку» на общее «корову», поскольку עֶגְלָה обозначает молодую самку крупного рогатого скота.
