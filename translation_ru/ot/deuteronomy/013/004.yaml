source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: ru
  text: Не слушайте слов того пророка или того сновидца, потому что Яхве, ваш Бог, испытывает вас, чтобы узнать, любите ли вы Яхве, вашего Бога, всем сердцем и всей душой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «душа» здесь может также означать жизнь, самого человека или всё его существо.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל דִּבְרֵי
  choice: Не слушайте слов
  rationale: שׁמע с אֶל означает «слушать, внимать»; форма запрета обращена ко всему народу во 2-м лице множественного числа. «Не слушайте» естественно передаёт как восприятие речи, так и призыв не следовать ей.
- source_word: הַנָּבִיא הַהוּא
  choice: того пророка
  rationale: Сочетание артикля и указательного הַהוּא указывает на ранее названного пророка; русское «того пророка» передаёт эту определённость.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: того сновидца
  rationale: Буквально выражение означает «того видящего тот сон». Существительное «сновидец» в современном русском кратко и понятно обозначает человека, ссылающегося на сон; повтор корня, естественный для еврейского, по-русски был бы тяжеловесен.
- source_word: כִּי מְנַסֶּה
  choice: потому что … испытывает
  rationale: כִּי вводит основание запрета, а причастие piel от נסה обозначает продолжающееся в данной ситуации испытание или проверку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменено титулом; форма «Яхве» соответствует принятой русской транслитерации.
- source_word: לָדַעַת
  choice: чтобы узнать
  rationale: Сохраняет прямое значение инфинитива «знать, узнать» и целевую связь, не снимая антропоморфной и богословской напряжённости выражения.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: любите ли вы
  rationale: Вопросительная частица с причастием выражает наличие или устойчивое состояние любви. Русское настоящее время естественно передаёт этот смысл без неуклюжего «находитесь ли вы в состоянии любви».
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: всем сердцем и всей душой
  rationale: Сохраняет традиционную и межтекстуально значимую заветную формулу; по-русски творительный падеж естественно передаёт значение полноты посвящения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Божественное испытание «чтобы узнать»
  choice: 'Сохранить: «испытывает вас, чтобы узнать»'
  alternative: «испытывает вас, чтобы показать/обнаружить»
  rationale: Исходный текст говорит לָדַעַת, «чтобы знать/узнать». Замена на «показать» заранее разрешила бы богословское напряжение, которого сам текст не разрешает.
translation_notes:
  register: Современный литературный русский с достоинством библейского увещания. Множественное «не слушайте» точно отражает обращение к Израилю. Формула «всем сердцем и всей душой» сохранена ради узнаваемости и межтекстовых связей; архаизмы и конфессионально окрашенные толкования исключены.
