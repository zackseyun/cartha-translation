  source_fidelity: Перевод точно передаёт запрет во 2-м лице множественного числа, указание на конкретных ранее упомянутых пророка и сновидца, причинное כִּי, настоящее значение מְנַסֶּה и целевой инфинитив לָדַעַת. Формулировка «чтобы узнать» обоснованно сохраняет антропоморфный язык исходного текста без богословского истолкования. Формула «всем сердцем и всей душой» верно отражает בְּכָל־לְבַבְכֶם וּבְכָל־נַפְשְׁכֶם.
  naturalness: Текст звучит естественно на современном литературном русском и сохраняет сдержанный, увещевательный регистр. «Не слушайте слов», «того пророка», «того сновидца» и «любите ли вы» ясны и идиоматичны. Пунктуация при приложении «Яхве, ваш Бог» нормативна.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Испытывает», «сердце» и «душа» уместны в данном заветном контексте. Сноска стоит после «душой», то есть у слова, которое поясняет, и корректно отмечает основные лексические альтернативы для נֶפֶשׁ.
