  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: ru
  text: И весь Израиль услышит и устрашится и впредь уже не станет совершать среди тебя[a] подобного злодеяния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть «среди вас». В еврейском тексте Израиль как единый народ назван в форме единственного числа.
    reason: Пояснение необычного единственного числа в корпоративном обращении.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: И весь Израиль
  rationale: כָּל с именем «Израиль» обозначает весь народ как единое целое; выражение естественно и сохраняет коллективный образ оригинала.
- source_word: יִשְׁמְעוּ
  choice: услышит
  rationale: В еврейском стоит форма множественного числа, согласованная по смыслу с народом; в русском подлежащее «весь Израиль» грамматически требует единственного числа. Дополнение «об этом» не добавляется, поскольку его нет в оригинале.
- source_word: וְיִרָאוּן
  choice: и устрашится
  rationale: Глагол ירא здесь передаёт страх, удерживающий от повторения преступления. «Устрашится» сохраняет краткость и возвышенный юридико-заветный регистр.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: и впредь … делать не будут
  rationale: Сочетание יסף с инфинитивом означает, что действие больше не повторится. «Впредь … делать не будут» естественно передаёт предупредительно-правовой смысл.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: такого зла
  rationale: דָּבָר в данном контексте указывает на описанный злой поступок. Русское «такого зла» звучит естественно и не сужает значение до словесного высказывания.
- source_word: בְּקִרְבֶּךָ
  choice: среди тебя
  rationale: Буквально «в твоей среде»; суффикс второго лица мужского рода единственного числа обращён к Израилю как к единому народу. Необычное для русского «среди тебя» сохраняет эту черту текста.
theological_decisions:
- issue: Число обращения к Израилю в заключительной фразе
  choice: 'Сохранено единственное число: «среди тебя»'
  alternative: «среди вас»
  rationale: Еврейский текст обращается к Израилю в единственном числе как к единому заветному народу. Вариант во множественном числе был бы более привычен по-русски, но устранил бы значимую форму корпоративного обращения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным юридико-заветным оттенком. Инверсия в последней части помогает естественно соединить грамматическое единственное число «весь Израиль» с еврейским смысловым множественным числом последующего сказуемого и сохраняет акцент на недопущении повторения зла.
