base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: ru
  text: Собери всю её добычу в центре городской площади и сожги город со всей его добычей полностью для ГОСПОДА, твоего Бога.[a] Пусть город навсегда останется грудой развалин[b] и больше не будет отстроен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как приношение, целиком сжигаемое для ГОСПОДА, твоего Бога». Еврейское כָּלִיל может означать «целиком, полностью» либо иметь жертвенный оттенок: нечто полностью сжигается для Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «грудой навеки» или «вечным холмом», то есть навсегда оставшимися развалинами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: её добычу
  rationale: «Добыча» естественно обозначает имущество, захваченное при разгроме города, и соответствует значению שָׁלָל в военно-правовом контексте.
- source_word: תִּקְבֹּץ
  choice: собери
  rationale: Форма 2-го лица мужского рода единственного числа в данном предписании естественно передаётся русским повелительным наклонением.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: на середину городской площади
  rationale: רְחוֹב здесь обозначает широкое общественное пространство, то есть городскую площадь, а не узкую улицу. Добавление «городской» естественно проясняет референт местоименного суффикса.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: и сожги
  rationale: Русский глагол «сжечь» уже выражает уничтожение огнём, поэтому буквальное «сожги огнём» было бы стилистически избыточным.
- source_word: כָּלִיל
  choice: целиком
  rationale: Наречное значение «целиком, полностью» ясно в основном тексте; тире и последующее «для ГОСПОДА» сохраняют оттенок полного посвящения Богу, а возможный жертвенный смысл отмечен в сноске.
- source_word: לַיהוָה
  choice: для ГОСПОДА
  rationale: Предлог ל выражает направленность или посвящение. Написание «ГОСПОДЬ» традиционно передаёт тетраграмматон יהוה, не подменяя его реконструированным произношением.
- source_word: תֵּל עוֹלָם
  choice: навеки останется грудой развалин
  rationale: תֵּל буквально обозначает груду или холм, здесь — груду разрушенного города; עוֹלָם выражает непреходящий характер этого состояния.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: больше не будет отстроен
  rationale: Страдательная форма בנה с עוֹד указывает, что город впредь не должен и не будет восстановлен. «Отстроен» естественно относится к разрушенному городу.
theological_decisions:
- issue: Жертвенный оттенок כָּלִיל при сожжении города
  choice: 'В основном тексте: «целиком, для ГОСПОДА»; жертвенный оттенок указан в сноске.'
  alternative: «как всецело сожжённое приношение ГОСПОДУ»
  rationale: כָּלִיל допускает как наречное понимание («целиком»), так и культовый оттенок чего-либо полностью сжигаемого для Бога. Основной текст не превращает город в технически обозначенную левитскую жертву, но сноска сохраняет богословски значимую возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Повелительные формы делают последовательность предписаний ясной; лексика конкретна и понятна без архаизации. Написание «ГОСПОДЬ» использовано для יהוה.
