  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: ru
  text: Непременно порази жителей того города остриём меча; предай город заклятию вместе со всем, что в нём, и со всем его скотом — остриём меча[a].
  philosophy: optimal-equivalence
  footnotes:
