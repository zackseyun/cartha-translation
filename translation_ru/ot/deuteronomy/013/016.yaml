    text: 'Буквально: «устами меча» — еврейский оборот со значением «остриём меча». «Предать заклятию» передаёт технический глагол, означающий безвозвратно предназначить к уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: непременно порази
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление. «Непременно порази» передаёт эту эмфазу и не подменяет глагол более узким «убей».
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: жителей того города
  rationale: Причастная форма обозначает тех, кто живёт в городе; «жители» — точный и естественный современный эквивалент.
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Буквально выражение означает «устами меча». Русское «остриём меча» сохраняет конкретный образ и ясно передаёт смертоносное применение оружия.
- source_word: הַחֲרֵם
  choice: предай заклятию на уничтожение
  rationale: Глагол в породе hифиль означает безвозвратно посвятить чему-либо статус херема, что в данном контексте влечёт уничтожение. Формулировка сохраняет как сакрально-правовой оттенок, так и фактический результат.
- source_word: אֹתָהּ
  choice: сам город
  rationale: Местоимение женского рода относится к слову «город». Явное повторение референта устраняет возможную неясность в русском предложении.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: всё, что в нём
  rationale: Передаёт распространение повеления на всё находящееся в городе без неоправданного уточнения состава.
- source_word: בְּהֶמְתָּהּ
  choice: весь его скот
  rationale: Собирательное בְּהֵמָה здесь обозначает домашних животных; «скот» естественно передаёт это значение и не сужает его до крупного рогатого скота.
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Повтор исходного оборота сохранён, поскольку он повторён в еврейском тексте и подчёркивает способ и охват уничтожения.
theological_decisions:
- issue: Передача חרם в контексте войны и суда
  choice: предай заклятию на уничтожение
  alternative: полностью уничтожь; предай заклятию
  rationale: Выбранная формулировка не сводит חרם к обычному военному уничтожению, но и не оставляет современному читателю непрозрачный термин без пояснения. Сакральный оттенок и окончательность действия сохранены.
- issue: Суровость повеления
  choice: сохранить полную силу повеления без смягчения
  alternative: 'передать более мягко: «разгроми» или «победи»'
  rationale: Еврейский текст прямо требует смертельного поражения жителей и уничтожения города, его содержимого и скота; смягчение исказило бы смысл и сняло бы присущее тексту богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повелительной интонацией. Синтаксис сохраняет эмфазу, повтор образа меча и суровость исходного текста; терминология не привязана к конфессиональному толкованию.
