source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: ru
  text: А того пророка или того сновидца следует предать смерти, потому что он произнёс мятежные слова против Яхве, вашего Бога, который вывел вас из земли Египетской и выкупил тебя из дома рабства, чтобы увести тебя с пути, по которому Яхве, твой Бог, повелел тебе идти. Так искорени зло из своей среды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: А того пророка или того сновидца
  rationale: Начальное וְ продолжает и подытоживает предшествующее условие; «а» естественно вводит правовое следствие. Повтор указательного местоимения передан дважды.
- source_word: יוּמָת
  choice: следует предать смерти
  rationale: Пассивная каузативная форма обозначает судебное умерщвление, а не просто наступление смерти.
- source_word: כִּי דִבֶּר סָרָה עַל יְהוָה אֱלֹהֵיכֶם
  choice: потому что он призывал к отступничеству от Яхве, вашего Бога
  rationale: סָרָה обозначает мятежное отпадение от заветной верности. В данном контексте речь пророка склоняет народ от Яхве; «призывал к отступничеству» естественно передаёт смысл конструкции, не сводя её к простой критике.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: который вывел вас из земли Египетской
  rationale: Сохранена устойчивая формула исхода и множественное обращение исходного текста.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: и выкупил тебя из дома рабства
  rationale: «Выкупил» сохраняет конкретный искупительный смысл פדה. «Дом рабства» естественнее по-русски, чем буквальное «дом рабов», и сохраняет образ порабощения. Единственное число отражает переход в еврейском тексте к собирательному обращению.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: Он хотел увести тебя с пути
  rationale: נדח в породе Hiphil означает заставить отклониться или увести; отдельное предложение устраняет двусмысленное присоединение целевого оборота к действию Бога.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: по которому Яхве, твой Бог, повелел тебе идти
  rationale: Сохранена метафора пути и хождения, характерная для Второзакония.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Так искорени зло из своей среды
  rationale: Формула требует решительного удаления зла из сообщества. Императив по-русски естественно выражает предписывающую силу древнееврейского перфекта с וְ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, прямо стоящее в исходном тексте, без замены титулом.
- issue: Смысл סָרָה
  choice: отступничество
  alternative: мятеж; непокорность; превратное
  rationale: В контексте призыва пойти за иными богами слово обозначает отпадение от верности Яхве. Формулировка сохраняет одновременно религиозный и заветно-политический оттенок.
- issue: Смена числа во втором лице
  choice: вас / вашего, затем тебя / твой
  alternative: последовательно множественное число
  rationale: Сохранён заметный переход исходного текста от множественного обращения к собирательному единственному числу, не объясняя его богословски.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и заветного контекста. Архаизмы сведены к минимуму; метафоры «путь», «идти» и «дом рабства» сохранены. Смена множественного числа на единственное воспроизведена намеренно.
