revisions:
- from: А того пророка или того сновидца следует предать смерти, потому что он призывал к отступничеству от Яхве, вашего Бога, который вывел вас из земли Египетской и выкупил тебя из дома рабства. Он хотел увести тебя с пути, по которому Яхве, твой Бог, повелел тебе идти. Так искорени зло из своей среды.
  to: А того пророка или того сновидца следует предать смерти, потому что он произнёс мятежные слова против Яхве, вашего Бога, который вывел вас из земли Египетской и выкупил тебя из дома рабства, чтобы увести тебя с пути, по которому Яхве, твой Бог, повелел тебе идти. Так искорени зло из своей среды.
  rationale: 'Исправлены цельный синтаксис и семантика инфинитива לְהַדִּיחֲךָ: вместо отдельного «Он хотел...» восстановлена зависимая цель «чтобы увести тебя». Формулировка о סָרָה приведена ближе к исходной конструкции без утраты современного литературного звучания. Смысл судебного предписания, имя Яхве, метафора пути, образ выкупа из дома рабства и смена числа адресата сохранены.'
