  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: ru
  text: Ты должен побить его камнями, и он умрёт, потому что он пытался увести тебя[a] от Яхве, твоего Бога, который вывел тебя из земли Египта, из дома рабства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соблазнить тебя отступить от Яхве»; или: «сбить тебя с пути верности Яхве».'
    reason: 'Лексическая альтернатива: глагол может обозначать уведение от верности Богу, склонение к отступничеству или введение в заблуждение.'
  - marker: b
    text: «Дом рабства» — заветная формула, напоминающая об избавлении Израиля из египетского рабства.
    reason: Культурно-историческое пояснение устойчивого выражения.
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים וָמֵת
  choice: Ты должен побить его камнями, и он умрёт
  rationale: Форма глагола в контексте закона выражает обязательное предписание. Отдельная фраза «и он умрёт» сохраняет последовательность и торжественную строгость еврейского текста, где смертельный исход назван явно.
- source_word: כִּי בִקֵּשׁ
  choice: потому что он пытался
  rationale: כִּי вводит основание приговора, а בִקֵּשׁ здесь обозначает намеренную попытку, а не просто желание или поиск.
- source_word: לְהַדִּיחֲךָ
  choice: увести тебя
  rationale: Каузативная форма נדח передаёт побуждение человека отойти от верности Богу. «Увести» естественно по-русски и сохраняет направленность действия, не уточняя сверх текста, шло ли дело о соблазнении, обмане или принуждении.
- source_word: מֵעַל יְהוָה אֱלֹהֶיךָ
  choice: от Яхве, твоего Бога
  rationale: Предлог указывает на отступление от заветной верности; личное имя יהוה передано как «Яхве», а не заменено титулом.
- source_word: הַמּוֹצִיאֲךָ
  choice: который вывел тебя
  rationale: Причастие служит определением Бога через совершённое Им избавление; прошедшее время естественно передаёт историческую отсылку.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохранено прямое упоминание «земли», а литературная русская форма остаётся ясной и соответствует возвышенному повествовательному регистру.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабства
  rationale: Буквальный и понятный перевод заветной формулы, представляющей Египет как место порабощения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, без замены титулом.
- issue: Характер отступничества в לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: увести тебя от Яхве
  alternative: соблазнить тебя отступить от Яхве; сбить тебя с пути, ведущего за Яхве
  rationale: Выбранная формулировка сохраняет каузативный смысл и разрыв верности Богу, но не определяет точный способ воздействия, который исходный глагол оставляет неоднозначным.
translation_notes:
  register: Современный литературный русский язык с выдержанным юридическим и заветным регистром. Синтаксис остаётся близким к еврейскому, но формулировки понятны современному читателю. Маркер [a] помещён при выражении, к которому относится лексическая альтернатива; маркер [b] — при формуле «дом рабства».
