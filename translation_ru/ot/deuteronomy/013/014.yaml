base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: ru
  text: 'вышли из твоей среды негодные люди[a] и совратили жителей своего города, говоря: «Пойдём и будем служить другим богам, которых вы не знали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья негодности»; традиционный перевод: «сыновья Велиала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: вышли
  rationale: Прямо передаёт Qal perfect глагола יצא и в зависимом сообщении естественно обозначает появление зачинщиков изнутри общины.
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: негодные люди
  rationale: Конструкция буквально означает «сыновья негодности» и идиоматически характеризует нравственно испорченных, беззаконных людей; перевод не превращает «Велиала» в имя собственное.
- source_word: מִקִּרְבְּךָ
  choice: из твоей среды
  rationale: Сохраняет единственное число местоимения и подчёркивает происхождение зачинщиков изнутри общины Израиля.
- source_word: וַיַּדִּיחוּ
  choice: совратили
  rationale: Hiphil от נדח означает заставить уклониться, увести с верного пути; в контексте речь идёт об отступлении к иным богам.
- source_word: יֹשְׁבֵי עִירָם
  choice: жителей своего города
  rationale: Естественно передаёт субстантивированное причастие «живущие» и рефлексивное отношение города к зачинщикам.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Пойдём и будем служить
  rationale: Две когортативные формы выражают совместное побуждение; «служить» сохраняет широкий заветный смысл עבד.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Буквальный и традиционно понятный эквивалент, не сужающий значение до этнически «чужеземных» богов.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: которых вы не знали
  rationale: Сохраняет множественное число обращения и глагол «знать», допускающий как знание, так и заветно-реляционный оттенок.
theological_decisions:
- issue: Значение בְּנֵי בְלִיַּעַל
  choice: негодные люди
  alternative: сыновья Велиала
  rationale: В данном древнееврейском контексте это идиома нравственной негодности или беззакония, а не обязательное обозначение персонифицированного злого существа.
- issue: Значение ידע применительно к иным богам
  choice: которых вы не знали
  alternative: которые были вам неизвестны
  rationale: Более буквальная формулировка сохраняет возможную смысловую глубину глагола «знать» и не сводит его к простой осведомлённости.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис оставлен зависимым от вводной условной конструкции предыдущего стиха; поэтому текст начинается со строчной буквы. Местоимения точно сохраняют переход от единственного числа «твоей» к множественному «вы».
