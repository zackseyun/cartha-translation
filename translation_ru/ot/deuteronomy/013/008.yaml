base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: ru
  text: из богов народов, окружающих вас, близких к тебе или далёких от тебя, от одного края земли до другого[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от одного края страны до другого». Еврейское אֶרֶץ может означать как «земля», так и «страна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: из богов
  rationale: 'Предлог מִן перед אֱלֹהֵי обозначает источник или принадлежность в продолжающемся перечислении: речь идёт о богах окружающих народов.'
- source_word: הָעַמִּים
  choice: народов
  rationale: Множественное עַמִּים обозначает этнические сообщества; «народов» точнее и естественнее, чем политически окрашенное «государств».
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: окружающих вас
  rationale: Причастный оборот естественно передаёт относительное предложение и сохраняет форму множественного числа второго лица.
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: близких к тебе или далёких от тебя
  rationale: Сохранены пространственное противопоставление и переход оригинала от множественного «вас» к единственному «тебе».
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: от одного края земли до другого
  rationale: Русская идиома естественно выражает полный географический охват; повтор существительного, обязательный в еврейском построении, по-русски не требуется. Многозначность אֶרֶץ отмечена в сноске.
theological_decisions:
- issue: Объём значения הָאָרֶץ в заключительной формуле
  choice: земли
  alternative: страны
  rationale: Формула «от одного края… до другого» здесь риторически указывает на максимально широкий охват. Вместе с тем אֶרֶץ допускает более узкое значение «страна», поэтому альтернативу следует сохранить в сноске, не сужая основной текст.
- issue: К чему относятся определения «близких» и «далёких»
  choice: сохранено синтаксическое присоединение без явного уточнения
  alternative: явно отнести определения к народам либо к их богам
  rationale: Еврейская форма допускает естественное смысловое соотнесение с окружающими народами, но в цепочке «из богов народов» возможна некоторая неоднозначность. Русский текст не вводит дополнительного существительного и не устраняет её искусственно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Тире сохраняют характер продолженного перечисления и показывают, что данный фрагмент синтаксически зависит от предыдущего стиха.
