base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: ru
  text: 'и сбудется то знамение или чудо[a], о котором он сказал тебе: «Пойдём вслед за иными богами, которых ты не знал[b], и будем служить им[c]»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и знамение, и чудо»; эта еврейская парная формула может означать «знамение или чудо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с которыми ты не был знаком».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и будем поклоняться им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: и сбудется
  rationale: В сочетании с предсказанным знамением глагол בוא означает, что оно произошло или исполнилось; «сбудется» естественно передаёт это значение по-русски.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: то знамение или чудо
  rationale: Сочетание обозначает подтверждающее знамение либо необычайное явление. Союз «или» естественно передаёт парную формулу в данном контексте, а указательное «то» связывает её с ранее данным предсказанием.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: о котором он говорил тебе
  rationale: Сохраняет относительное придаточное и связь данного знамения с тем, что предсказатель сообщил слушателю.
- source_word: לֵאמֹר
  choice: призывая
  rationale: Инфинитив вводит содержание речи. Здесь речь представляет собой побуждение, поэтому «призывая» яснее и естественнее буквального «говоря», не меняя смысла.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Пойдём вслед за
  rationale: Когортатив выражает совместное побуждение, а «вслед за» сохраняет образ следования и религиозной приверженности.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: иными богами
  rationale: Обычное для Второзакония обозначение чужих богов; «иными» соответствует возвышенному, но современному литературному регистру.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: которых ты не знал
  rationale: Сохраняет широкий смысл ידע — знать, быть знакомым, признавать — и не уточняет его без необходимости.
- source_word: וְנָעָבְדֵם
  choice: и будем служить им
  rationale: עבד в данном контексте означает религиозное служение; «служить» сохраняет как культовый, так и заветный оттенок.
theological_decisions:
- issue: Статус «иных богов»
  choice: которых ты не знал
  alternative: с которыми ты не был знаком
  rationale: Формулировка передаёт речь об идолопоклонническом соблазне, но не решает за текст онтологический вопрос о названных богах и сохраняет неоднозначность глагола «знать».
- issue: Значение религиозного действия
  choice: служить им
  alternative: поклоняться им
  rationale: «Служить» ближе к עבד и сохраняет более широкую идею религиозной верности и культового служения; «поклоняться» остаётся допустимым контекстуальным вариантом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Начальная строчная буква и конечная запятая сохранены, поскольку стих синтаксически продолжает условное предложение предыдущего стиха и не завершает его.
