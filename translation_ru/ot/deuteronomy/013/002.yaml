  text: כִּֽי יָק֤וּם בְּ/קִרְבְּ/ךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְ/נָתַ֥ן אֵלֶ֛י/ךָ א֖וֹת א֥וֹ מוֹפֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: ru
  text: Если появится среди вас пророк или сновидец и даст вам знамение или чудо,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знак или предзнаменование».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном законодательном контексте вводит условный случай, продолжающийся в следующем стихе.
- source_word: יָקוּם
  choice: появится
  rationale: Передаёт возникновение такого человека внутри общины естественным современным русским языком.
- source_word: בְּקִרְבְּךָ
  choice: среди вас
  rationale: Идиоматично передаёт нахождение внутри общины; единственное число в еврейском имеет собирательное значение.
- source_word: נָבִיא
  choice: пророк
  rationale: Стандартное и контекстуально точное соответствие.
- source_word: חֹלֵם חֲלוֹם
  choice: сновидец
  rationale: Естественное русское обозначение человека, которому снятся значимые или вещие сны; избегает тяжеловесного буквального «видящий сны».
- source_word: וְנָתַן אֵלֶיךָ
  choice: и даст вам
  rationale: В условной последовательности перфект имеет перспективное значение; русское будущее согласуется с «если появится».
- source_word: אוֹת
  choice: знамение
  rationale: Передаёт свидетельствующий или подтверждающий знак и сохраняет традиционно понятную библейскую лексику.
- source_word: מוֹפֵת
  choice: чудо
  rationale: В паре с אוֹת обозначает поразительное явление; перевод не уточняет, является ли оно подлинно сверхъестественным.
theological_decisions:
- issue: Природа знамения или чуда, данного пророком либо сновидцем
  choice: «знамение или чудо» без оценки происхождения и подлинности явления
  alternative: «знак или предзнаменование»; «чудесное знамение»
  rationale: Сам стих не определяет, подлинно ли явление, обманчиво или только заявлено как таковое; перевод сохраняет эту богословскую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Среди вас» и «появится» обеспечивают естественность, а «знамение» сохраняет достоинство и узнаваемость формулировки.
