base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: ru
  text: 'Если твой брат, сын твоей матери, или твой сын, или твоя дочь, или жена, которую ты прижимаешь к груди[a], или друг, который тебе как собственная душа[b], будет тайно склонять тебя, говоря: «Пойдём и будем служить другим богам, которых не знали ни ты, ни твои отцы», —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жена твоего лона (или груди)» — образ особенно тесной супружеской близости.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «друг, который тебе как собственная жизнь» или «как ты сам». Еврейское נֶפֶשׁ может означать душу, жизнь или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: станет тайно склонять тебя
  rationale: В породе хифиль глагол סות означает побуждать, склонять или заманивать к определённому поступку. «Склонять» сохраняет направленность побуждения, а наречие «тайно» передаёт בַּסֵּתֶר.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: твой брат, сын твоей матери
  rationale: Сохранено явное приложение еврейского текста, подчёркивающее особенно близкое родство.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: жена, которую ты прижимаешь к груди
  rationale: Образ חֵיק связан с грудью, лоном и тесными объятиями. Такая формулировка сохраняет телесный образ близости и при этом звучит понятно в современном русском языке.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: друг, который тебе как собственная душа
  rationale: Формулировка сохраняет образ נֶפֶשׁ и предельную степень личной близости, не сводя его однозначно к «жизни» или к выражению «как ты сам».
- source_word: בַּסֵּתֶר
  choice: тайно
  rationale: Естественная русская передача обстоятельственного выражения «втайне, в секрете».
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Пойдём и будем служить
  rationale: Две когортативные формы передают совместное побуждение. Сохранены и движение, и служение; עבד шире, чем исключительно культовое «поклоняться».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямая передача прилагательного אֲחֵרִים без истолковывающего уточнения «чужим» или «иноземным».
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: которых не знали ни ты, ни твои отцы
  rationale: Сохранены глагол «знать», явное местоимение «ты» и упоминание отцов. Конструкция «ни… ни…» естественно выражает отрицание для обеих групп.
theological_decisions:
- issue: Передача образов самых близких человеческих отношений
  choice: Сохранить конкретные образы «сын твоей матери», жены у груди и друга, подобного собственной душе.
  alternative: Сгладить их как «родной брат», «любимая жена» и «самый близкий друг».
  rationale: Накопление образов близости усиливает серьёзность предупреждения. Сглаженные эквиваленты понятнее, но устраняют часть риторической силы и образности исходного текста.
- issue: Значение עבד применительно к другим богам
  choice: служить
  alternative: поклоняться
  rationale: «Служить» сохраняет более широкий смысл религиозной преданности и деятельности, тогда как «поклоняться» могло бы неоправданно сузить значение до культового действия.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским звучанием. Необычные еврейские образы близости сохранены в основном тексте, а возможные значения пояснены в сносках. Завершающее тире показывает, что синтаксическая конструкция продолжается в следующем стихе.
