source:
  edition: WLC
  text: כִּֽי תִשְׁמַ֞ע בְּ/אַחַ֣ת עָרֶ֗י/ךָ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֥ן לְ/ךָ֛ לָ/שֶׁ֥בֶת שָׁ֖ם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: ru
  text: 'Если[a] услышишь, что в одном из твоих городов, которые Яхве, твой Бог, даёт тебе, чтобы ты там жил, говорят:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда услышишь» — еврейский союз в правовом тексте может вводить как условие, так и указание на время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном казуистическом законе союз вводит условную ситуацию. Вариант «когда» также грамматически возможен и отмечен в сноске.
- source_word: תִשְׁמַע
  choice: услышишь
  rationale: Глагол שׁמע здесь означает получение известия или сообщения; будущее совершенного вида естественно передаёт условную ситуацию по-русски.
- source_word: בְּאַחַת עָרֶיךָ
  choice: в одном из твоих городов
  rationale: Передаёт буквально и понятно сочетание со значением одного города из числа принадлежащих Израилю поселений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняется личное имя Бога, представленное тетраграмматоном, без замены титулом.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Настоящее время передаёт причастную форму и изображает Божий дар как совершающееся или характерное действие.
- source_word: לָשֶׁבֶת שָׁם
  choice: чтобы ты там жил
  rationale: Естественно передаёт целевое значение инфинитивной конструкции, не сужая смысл до первоначального заселения.
- source_word: לֵאמֹר
  choice: 'говорят:'
  rationale: Вводит содержание услышанного сообщения, которое следует в следующем стихе; русское безлично-личное построение устраняет ненужный буквальный повтор «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Условное или временное значение כִּי
  choice: Если
  alternative: Когда
  rationale: Правовой контекст поддерживает условное прочтение, но еврейский союз допускает также временное; неоднозначность отражена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с прямым обращением в единственном числе. Синтаксис сделан естественным для русского: содержание сообщения вводится оборотом «услышишь, что… говорят», при этом сохраняются незавершённость фразы и переход к следующему стиху.'
