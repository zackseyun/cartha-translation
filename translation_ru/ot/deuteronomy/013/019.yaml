  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: ru
  text: если будешь слушать голос Яхве, твоего Бога, соблюдать все Его заповеди, которые Я повелеваю тебе сегодня, и делать то, что правильно в глазах Яхве, твоего Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: если
  rationale: Здесь союз вводит условие, от которого зависит предшествующее обещание; условное «если» естественно передаёт эту связь.
- source_word: תִשְׁמַע בְּקוֹל
  choice: будешь слушать голос
  rationale: Сохранён образ слушания голоса; в данном заветном контексте выражение подразумевает внимательное слушание, ведущее к послушанию, но не сводится в переводе просто к «повиноваться».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  choice: соблюдать все Его заповеди
  rationale: «Соблюдать» естественно выражает тщательное исполнение установлений; כָּל передано явно словом «все».
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я даю тебе сегодня
  rationale: В русском выражение «даю заповеди» естественно передаёт совершающийся в речи акт повеления, выраженный причастием מְצַוְּךָ.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: делать то, что правильно
  rationale: Субстантивированное הַיָּשָׁר обозначает правильное, угодное или справедливое; нейтральное «то, что правильно» сохраняет широту оценки.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранена прозрачная древнееврейская метафора оценки, хорошо понятная в современном русском языке.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
- issue: Соотношение слушания и повиновения в שׁמע בקול
  choice: слушать голос
  alternative: повиноваться
  rationale: Перевод сохраняет личный и слуховой образ исходного выражения, одновременно позволяя контексту соблюдения заповедей раскрыть подразумеваемое послушание.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Структура условия сохранена; инфинитивы оформлены как однородные действия при «будешь», чтобы фраза звучала естественно и оставалась близкой к синтаксису оригинала.
