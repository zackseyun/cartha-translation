base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: ru
  text: Всё, что Я повелеваю вам[a], тщательно исполняйте. Ничего к этому не прибавляйте и ничего от этого не убавляйте.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё слово, которое Я повелеваю вам [исполнять]». В еврейском тексте стоит собирательное единственное число.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых традициях нумерации этот стих обозначен как Второзаконие 12:32.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: Всё, что
  rationale: Еврейское сочетание буквально означает «всё слово» и употребляет собирательное единственное число. Русское «всё, что» естественно передаёт полноту повеления, не сводя выражение к каждому отдельному слову.
- source_word: מְצַוֶּה אֶתְכֶם
  choice: Я повелеваю вам
  rationale: Причастная форма указывает на совершаемое в настоящем контексте повеление; настоящее время по-русски передаёт это естественно. Местоимение «Я» сохраняет явно выраженное אָנֹכִי.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: тщательно исполняйте
  rationale: Сочетание שׁמר с инфинитивом выражает внимательное соблюдение с целью исполнения. Такая формулировка ясна и сохраняет как усердие, так и практическое послушание.
- source_word: לֹא תֹסֵף עָלָיו
  choice: Не прибавляйте к этому
  rationale: Глагол יסף с עַל означает прибавление к чему-либо. Указательное местоимение естественно отсылает ко всему повелеваемому.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: и не убавляйте от этого
  rationale: גרע означает уменьшать или отнимать. «Убавлять от» сохраняет симметрию с запретом прибавлять и юридическую силу предписания.
theological_decisions:
- issue: Объём запрета прибавлять и убавлять
  choice: Сохранить отсылку ко всей совокупности повелеваемого, не уточняя, относится ли запрет к формулировкам или к содержанию заповедей.
  alternative: Передать как запрет изменять каждое отдельное слово.
  rationale: Собирательное כָּל הַדָּבָר допускает акцент на целостности данного повеления; перевод не должен искусственно сужать его до словесной формы.
- issue: Нумерация и связь с контекстом
  choice: Передать стих как самостоятельное предписание, не добавляя содержания следующего стиха.
  alternative: Теснее присоединить его к предыдущему разделу согласно нумерации Второзаконие 12:32 в ряде традиций.
  rationale: В масоретской разметке перед нами завершённое предписание, которое одновременно завершает предшествующую речь и подготавливает последующее законодательство.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повелительное наклонение прямо передаёт обязательную силу еврейских форм; прописное «Я» обозначает речь Бога по принятой русской издательской традиции.
