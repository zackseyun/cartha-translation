  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: ru
  text: 'Ибо ты должен непременно предать его смерти[a]: твоя рука должна первой подняться на него, чтобы предать его смерти, а затем — рука всего народа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты непременно должен убить его». В еврейском тексте инфинитив абсолютный употреблён с личной формой глагола для усиления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В контексте запрета щадить виновного частица вводит противопоставленный ему положительный приказ; русское «но» естественно передаёт этот переход.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: непременно предай его смерти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повелительный смысл; «непременно» сохраняет эмфазу, а «предай смерти» соответствует юридическому контексту.
- source_word: יָדְךָ תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: твоя рука первой должна подняться на него
  rationale: Сохранён конкретный образ руки и первоочерёдность участия адресата; «подняться на него» звучит естественно по-русски и передаёт направленное действие.
- source_word: לַהֲמִיתוֹ
  choice: чтобы умертвить его
  rationale: Каузативная форма מות означает причинение смерти; выбранный вариант сохраняет прямой смысл и избегает ненужного повторения выражения «предать смерти».
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: а затем — рука всего народа
  rationale: Сохранён параллелизм между рукой адресата и рукой всего народа, а «затем» ясно выражает последовательность действий.
theological_decisions:
- issue: Передача языка судебной казни без смягчения или усиления
  choice: предай его смерти
  alternative: убей его
  rationale: Стих предписывает смертную казнь в рамках закона завета. Выражение «предай его смерти» сохраняет юридический характер высказывания, не превращая его ни в эвфемизм, ни в более грубую формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Конкретный образ «руки» и синтаксический параллелизм оригинала сохранены; усилительная конструкция передана наречием «непременно».
