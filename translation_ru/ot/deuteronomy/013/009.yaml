  text: לֹא תֹאבֶ֣ה ל֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע אֵלָ֑י/ו וְ/לֹא תָח֤וֹס עֵֽינְ/ךָ֙ עָלָ֔י/ו וְ/לֹֽא תַחְמֹ֥ל וְ/לֹֽא תְכַסֶּ֖ה עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: ru
  text: Не соглашайся с ним[a] и не слушай его; пусть твой глаз не жалеет его[b], не щади его и не укрывай его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не уступай ему». Еврейский глагол может означать готовность, согласие или уступку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть твой глаз не жалеет его» — еврейский образ, выражающий отказ смотреть на человека с состраданием и потому щадить его.'
    reason: cultural_note
  - marker: c
    text: 'Или: «не покрывай его» — то есть не прячь его и не скрывай его вину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: не соглашайся с ним
  rationale: Глагол אָבָה в породе qal выражает готовность, согласие или уступку. В контексте склонения к отступничеству «не соглашайся с ним» естественно передаёт запрет поддаться уговорам, не сводя значение к простому выслушиванию.
- source_word: תִשְׁמַע אֵלָיו
  choice: не слушай его
  rationale: Сочетание שׁמע с אֶל означает слушать или внимать кому-либо. Здесь имеется в виду восприимчивость к уговорам, а не просто физическая способность слышать; при этом перевод не усиливает значение до однозначного «не повинуйся».
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: пусть твой глаз не жалеет его
  rationale: חוּס обозначает жалость, сострадание или пощаду. Сохранён прямо выраженный в еврейском тексте образ глаза, чтобы передать идиоматическую и риторическую силу фразы.
- source_word: תַחְמֹל
  choice: не щади его
  rationale: חמל может означать сострадать или щадить. «Не щади» отличает этот запрет от предыдущего упоминания жалости и сохраняет нарастающую силу ряда повелений.
- source_word: תְכַסֶּה עָלָיו
  choice: не укрывай его
  rationale: כסּה в piel означает покрывать, скрывать или укрывать. В данном правовом контексте выражение может относиться как к сокрытию самого виновного, так и к утаиванию его вины; «не укрывай его» сохраняет предметное местоимение и не устраняет эту смысловую связь.
theological_decisions:
- issue: Строгость заветно-судебных запретов в отношении склоняющего к отступничеству
  choice: 'Сохранить прямой ряд запретов без смягчения: не соглашаться, не слушать, не жалеть, не щадить и не укрывать.'
  alternative: Передать стих лишь как общее требование не одобрять поступок или смягчить его до запрета эмоциональной поддержки.
  rationale: Еврейский текст намеренно накапливает прямые запреты в правовом контексте. Перевод сохраняет их суровость и последовательность, не добавляя конфессионального толкования и не сводя речь только к внутреннему отношению.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повелительной интонацией. Параллелизм и накопление пяти запретов сохранены; архаизмы и канцелярские обороты не использованы.
