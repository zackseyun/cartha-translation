  source_fidelity: 'Текст точно передаёт отрицательное предписание: ничто из חֵרֶם не должно оставаться у адресата; сохранены образ прилипания к руке, целевая связь «чтобы», идиома пылающего гнева, двойное выражение милости/сострадания и обещание умножения. «Яхве» корректно передаёт тетраграмматон. Формулировка «преданного уничтожению» соответствует контексту חֵרֶם, не сводя термин к магическому «заклятию».'
  naturalness: Русский текст литературный и понятный. «Пусть ничто ... не прилипнет к твоей руке» несколько торжественно, но естественно для библейского регистра и удачно сохраняет конкретную метафору оригинала. Синтаксическая цепочка «даровал..., сжалился... и умножил...» читается плавно.
