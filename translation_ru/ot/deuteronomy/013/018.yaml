source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: ru
  text: И пусть ничто из преданного уничтожению не прилипнет к твоей руке[a], чтобы Яхве отвратился от пыла Своего гнева[b], даровал тебе милость, сжалился над тобой и умножил тебя, как Он поклялся твоим отцам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, традиционно: «из заклятого» либо «из того, что находится под заклятием». Еврейское חֵרֶם означает нечто безвозвратно посвящённое Богу, нередко с предназначением к уничтожению.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от пыла Своего носа». Это еврейская идиома, обозначающая сильный гнев.'
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק
  choice: не прилипнет
  rationale: Глагол דבק буквально передаёт прилипание или тесное присоединение. Русское «не прилипнет к твоей руке» сохраняет конкретный образ и одновременно указывает на удержание запретного в своей собственности.
- source_word: בְּיָדְךָ
  choice: к твоей руке
  rationale: Предлог ב при слове «рука» в сочетании с דבק допускает естественное русское управление «прилипнуть к руке»; телесная метафора оригинала сохранена.
- source_word: מְאוּמָה
  choice: ничто
  rationale: Слово обозначает что-либо, даже самую малость; при отрицании естественно передаётся как «ничто», подчёркивая полный запрет.
- source_word: הַחֵרֶם
  choice: из преданного уничтожению
  rationale: חֵרֶם обозначает безвозвратно посвящённое Богу, в данном контексте подлежащее уничтожению. Формулировка раскрывает смысл понятия, не заменяя его неясным для современного читателя словом «заклятие».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз естественно выражает цель или ожидаемый результат соблюдения повеления.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Яхве отвратился от пыла Своего гнева
  rationale: שׁוב с מן означает отвернуться или отступить от чего-либо, а חֲרוֹן אַף — устойчивый образ сильного, пылающего гнева. Перевод сохраняет интенсивность выражения, не воспроизводя буквально непривычный образ «носа».
- source_word: רַחֲמִים
  choice: милость
  rationale: Существительное выражает милосердие и сострадание. В сочетании с נתן естественное русское выражение «даровал тебе милость» передаёт благосклонное действие Бога.
- source_word: וְרִחַמְךָ
  choice: сжалился над тобой
  rationale: Глагольная форма того же смыслового поля передана отдельно от предшествующего существительного, чтобы сохранить еврейское усиление через близкие, но не тождественные выражения.
- source_word: וְהִרְבֶּךָ
  choice: умножил тебя
  rationale: Каузативная форма רבה означает сделать многочисленным. Несколько необычное, но понятное выражение сохраняет связь с языком патриархального обещания и не добавляет отсутствующее в тексте слово «потомство» или «народ».
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: как Он поклялся твоим отцам
  rationale: «Отцам» точно сохраняет указание на патриархов и заветную линию; «как» естественно передаёт сравнительную силу כַּאֲשֶׁר.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Передача חֵרֶם
  choice: преданное уничтожению
  alternative: заклятое; находящееся под заклятием
  rationale: Контекст говорит о безвозвратном посвящении, реализуемом через уничтожение. Выбранный вариант делает это понятным, не превращая понятие в магическое проклятие и не добавляя конфессионального толкования.
- issue: Образ божественного гнева
  choice: пыл Своего гнева
  alternative: ярость Своего гнева; пыл Своего носа
  rationale: Перевод сохраняет личный и напряжённый характер Божьего гнева, но передаёт телесную еврейскую идиому естественным русским выражением.
- issue: Заветное обещание умножения
  choice: умножил тебя
  alternative: сделал тебя многочисленным; умножил твоё потомство
  rationale: Формулировка сохраняет прямой объект оригинала и отзвук обещаний патриархам. Вариант с «потомством» был бы яснее, но добавлял бы существительное, которого в стихе нет.
- issue: Передача אֲבֹתֶיךָ
  choice: твоим отцам
  alternative: твоим предкам
  rationale: В контексте клятвы речь прежде всего идёт о патриархах. Буквальное «отцам» сохраняет заветную конкретность исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранены конкретный образ прилипания к руке, последовательность близких слов о милости и сострадании, а также несколько необычное заветное выражение «умножил тебя». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с устойчивой русской издательской традицией.
