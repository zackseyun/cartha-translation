source:
  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: ru
  text: Идите вслед за Яхве, вашим Богом[a], бойтесь его, соблюдайте его заповеди, слушайте его голос[b], служите ему и держитесь его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Следуйте за Яхве, вашим Богом». Буквально: «ходите вслед за Яхве, вашим Богом».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «слушать его голос» может также означать «слушаться его» или «повиноваться ему».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «неотступно следуйте за ним»; «будьте привязаны к нему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: Идите вслед за Яхве, вашим Богом
  rationale: Оборот «идти вслед за» сохраняет еврейский образ хождения за Богом и одновременно естественно передаёт верность и следование ему. Личное имя יהוה передано как «Яхве».
- source_word: תִירָאוּ
  choice: бойтесь его
  rationale: Глагол ירא применительно к Богу включает страх, благоговение и почтение; «бойтесь» сохраняет силу и широту исходного выражения, не сводя его только к почитанию.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: соблюдайте его заповеди
  rationale: В сочетании с заповедями שׁמר означает хранить и исполнять их; по-русски «соблюдать заповеди» звучит естественно и сохраняет заветный регистр.
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: слушайте его голос
  rationale: Перевод сохраняет явный образ исходного текста. В контексте выражение подразумевает также послушание, что отмечено в сноске, но не подменяет формулировку оригинала.
- source_word: תַעֲבֹדוּ
  choice: служите ему
  rationale: עבד может обозначать как служение, так и поклонение. «Служите» сохраняет более широкий смысл и не ограничивает его только богослужебным действием.
- source_word: תִדְבָּקוּן
  choice: держитесь его
  rationale: דבק выражает тесную привязанность, верность и неотступность. «Держитесь его» естественно по-русски и сохраняет напряжённость призыва.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие.
- issue: Явно ли передавать послушание в וּבְקֹלוֹ תִשְׁמָעוּ
  choice: слушайте его голос
  alternative: повинуйтесь ему; слушайтесь его голоса
  rationale: Оборот подразумевает послушание, однако буквально называет слушание голоса. Основной текст сохраняет образ и смысловую напряжённость, а возможное значение «повинуйтесь» вынесено в сноску.
- issue: Передача עבד в отношении Бога
  choice: служите ему
  alternative: поклоняйтесь ему
  rationale: Глагол охватывает служение Богу, включая поклонение, поэтому более широкое «служите» не сужает значение до культовой сферы.
translation_notes:
  register: Современный литературный русский язык с краткими параллельными повелительными формами, передающими ритм еврейского увещевания. Сохранены заветные образы хождения вслед за Богом, слушания его голоса и тесной привязанности к нему; архаические формы и конфессионально маркированная лексика избегаются.
