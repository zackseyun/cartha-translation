review_pass:
  verdict: revise
  source_fidelity: В целом сохранены три последовательных действия проверки, формула подтверждения, страдательное «совершена» и указание на событие внутри общины. Однако «разузнай» разговорнее и семантически слабее חקר в юридическом контексте; кроме того, «это правда и дело достоверно» синтаксически шероховато и не вполне ясно передаёт, что «дело/сообщение» является предметом двух характеристик.
  naturalness: «Расследуй, разузнай и тщательно расспроси» содержит стилистически неоднородное разговорное «разузнай». Формула «что это правда и дело достоверно» требует более естественной русской перестройки.
  terminology: «Мерзость» — точная и уместная передача תועבה в данном библейско-правовом контексте. «Среди вас» адекватно передаёт בְּקִרְבֶּךָ. Для חקר предпочтительно «тщательно исследуй», а שאל היטב естественно передать «как следует расспроси».
