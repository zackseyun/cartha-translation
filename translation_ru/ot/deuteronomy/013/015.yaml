base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: ru
  text: то расследуй, тщательно исследуй и как следует расспроси. И если окажется, что сообщение верно и дело достоверно установлено[a], что эта мерзость совершена среди вас,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и вот: это правда, дело достоверно». Еврейская формула кратко подтверждает истинность сообщения и установленность дела.'
    reason: Сохраняет возможную более формально близкую передачу краткой еврейской формулы, не создавая неграмматичной русской кальки.
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: расследуй
  rationale: В данном правовом контексте глагол обозначает целенаправленное выяснение обстоятельств; «расследуй» естественно передаёт юридический оттенок.
- source_word: וְחָקַרְתָּ
  choice: разузнай
  rationale: Глагол усиливает идею тщательного исследования. «Разузнай» сохраняет отличие от первого глагола и указывает на установление фактов.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: тщательно расспроси
  rationale: 'שׁאל означает спрашивать или расспрашивать, а הֵיטֵב усиливает действие: «тщательно, как следует».'
- source_word: וְהִנֵּה
  choice: И если окажется
  rationale: В формуле проверки וְהִנֵּה вводит установленный результат расследования. Условное «если» подразумевается правовым построением и делает по-русски ясной связь с последующим предписанием.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: это правда и дело достоверно
  rationale: 'Перевод сохраняет два элемента формулы подтверждения: истинность сообщения и установленность самого дела.'
- source_word: נֶעֶשְׂתָה
  choice: совершена
  rationale: Страдательная форма передаёт факт совершения названной мерзости; краткая форма естественна в русском юридически окрашенном повествовании.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: эта мерзость
  rationale: «Мерзость» сохраняет сильную нравственно-религиозную оценку исходного слова и привычный библейский регистр.
- source_word: בְּקִרְבֶּךָ
  choice: среди вас
  rationale: Выражение означает, что событие произошло внутри общины. Русское «среди вас» естественно передаёт этот коллективный смысл.
theological_decisions:
- issue: Формула судебного подтверждения
  choice: «если окажется, что это правда и дело достоверно»
  alternative: '«и вот: это правда, дело достоверно»'
  rationale: Условность явно следует из правового контекста, хотя отдельного еврейского союза «если» нет. Выбранная формулировка сохраняет переход от расследования к подтверждённому выводу, не снимая различия между истинностью сообщения и установленностью дела.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, юридически серьёзным регистром. Накопление трёх глаголов сохранено, а синтаксис сделан естественным для русского текста. Конечная запятая отражает незавершённость условного предложения, продолжающегося в следующем стихе.
