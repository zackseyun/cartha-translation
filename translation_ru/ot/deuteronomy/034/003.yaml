  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: ru
  text: и Негев[a], и равнину — долину Иерихона, города пальм — вплоть до Цоара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юг». Еврейское слово может быть названием области Негев или обозначением южной земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: В перечне земель слово выступает прежде всего как географическое название южной области. Транслитерация сохраняет это значение, а возможное нарицательное понимание отмечено в сноске.
- source_word: הַכִּכָּר
  choice: равнину
  rationale: В географическом контексте слово обозначает округлую равнинную область, связанную с Иорданской долиной; буквальное «круг» по-русски здесь было бы неясно.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: долину Иерихона
  rationale: בִּקְעָה обозначает широкую долину или равнину. «Долина» позволяет естественно отличить этот термин от предшествующего הַכִּכָּר, не устраняя семантической близости; вариант отмечен в сноске.
- source_word: עִיר הַתְּמָרִים
  choice: города пальм
  rationale: Сохранён традиционный образный эпитет Иерихона. Родительный оборот естественно продолжает сочетание «долину Иерихона» и передаёт приложение к названию города.
- source_word: עַד צֹעַר
  choice: вплоть до Цоара
  rationale: עַד указывает на предел показанной территории; «вплоть до» ясно передаёт пространственную протяжённость.
- source_word: וְאֶת ... וְאֶת
  choice: и ... и
  rationale: Повтор союза сохраняет накопительный ритм перечня, тогда как непереводимый русский эквивалент объектного показателя не требуется.
