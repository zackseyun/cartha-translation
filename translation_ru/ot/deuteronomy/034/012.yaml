  source_fidelity: '«Могучая сила» правомерно передаёт метонимическое «сильная рука» и снабжено буквальной сноской. Однако «по всем великим деяниям, внушавшим трепет» слишком далеко перестраивает вторую именную группу: в еврейском тексте стоит собирательное «весь великий морая» — страх, ужас либо внушающее страх явление. Более прямое «всему великому трепету» сохраняет эту неоднозначность, а глагол «явил» естественно относится к обоим проявлениям.'
