  - marker: b
    text: 'Буквально: «великому трепету». Возможные переводы: «великому ужасу» или «великим грозным деяниям».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «перед глазами всего Израиля», то есть открыто, на виду у всего народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: и по всей / и по всем
  rationale: Предлог לְ в продолжении итогового сопоставления передан русским «по», а כֹל — словами «всей / всем» с учётом рода и числа выбранных русских выражений.
- source_word: הַיָּד הַחֲזָקָה
  choice: могучая сила
  rationale: Буквально «сильная рука». В данном контексте «рука» обозначает проявленную силу; идиоматический перевод естественен по-русски, а буквальный образ сохранён в сноске.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: великие деяния, внушавшие трепет
  rationale: מוֹרָא допускает значения ужаса, страха и того, что внушает благоговейный трепет. Формулировка передаёт объективный, устрашающе-величественный характер совершённого, не сводя смысл только к внутреннему чувству или к ужасу.
- source_word: אֲשֶׁר עָשָׂה
  choice: которые Моисей совершил
  rationale: Глагол עָשָׂה имеет широкое значение «делать, совершать»; «совершил» естественно сочетается с «деяниями» и сохраняет прямой смысл глагола.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Сохраняет конкретный образ еврейского выражения «перед глазами» и естественно обозначает публичность происходившего.
- source_word: כָּל יִשְׂרָאֵל
  choice: всего Израиля
  rationale: Передаёт совокупное национальное значение выражения и соответствует нормам современного русского языка.
theological_decisions:
- issue: Характер заключительной похвалы Моисею
  choice: Передать стих как итоговое указание на могущественные и внушающие трепет деяния Моисея, совершённые публично перед Израилем.
  alternative: 'Более буквально: «и по всей сильной руке, и по всему великому ужасу, который Моисей совершил перед глазами всего Израиля».'
  rationale: Выбранный перевод сохраняет величие и напряжённость исходного текста, но не добавляет позднейших богословских истолкований. Неоднозначность מוֹרָא отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Начальное «и» и конструкция «по всей… и по всем…» сохраняют связь стиха с предшествующим итоговым предложением. Образность исходного текста и смысловая неоднозначность מוֹרָא отражены в сносках.
