  text: и по всей могучей силе[a], и по всему великому трепету[b], который Моисей явил на глазах у всего Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сильной руке»; «рука» здесь может означать проявленную силу или могущество.'
