base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: ru
  text: И Иисус Навин, сын Нуна, был исполнен духа мудрости[a], потому что Моисей возложил на него руки. Сыны Израиля слушали его и поступали так, как Яхве повелел Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был полон духа мудрости»; возможно также понимание: «был исполнен Духа мудрости». Еврейское выражение может обозначать как дух мудрости в общем смысле, так и особое наделение от Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: был исполнен духа мудрости
  rationale: Передаёт состояние Иисуса Навина естественным литературным русским языком и сохраняет еврейское сочетание «дух мудрости», не предрешая, обозначает ли רוּחַ прямо Святого Духа или дарованную Богом способность.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: возложил на него руки
  rationale: Устойчиво и точно передаёт формальный жест возложения рук.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: слушались его
  rationale: В данном контексте שמע с אֶל подразумевает не только слушание, но и послушание; следующее предложение подтверждает этот смысл.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет мужское родовое обозначение и заветно-семейный образ исходного текста; форма «сыны» уместна в достойном библейском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Следует ли понимать רוּחַ חָכְמָה как прямое именование Святого Духа
  choice: «духа мудрости» со строчной буквы
  alternative: «Духа мудрости» как явное указание на Святого Духа
  rationale: Еврейская формулировка допускает божественное наделение мудростью, но сама по себе не требует однозначно отождествлять רוּחַ со Святым Духом; строчная буква сохраняет эту смысловую открытость.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: «сыны Израиля»
  alternative: «израильтяне» или «дети Израиля»
  rationale: Выбранный вариант сохраняет грамматически мужское и семейно-заветное выражение оригинала, не сводя его к нейтральному этнониму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранены традиционное русское имя «Иисус Навин», формула «сыны Израиля» и личное имя «Яхве»; синтаксис сделан ясным и естественным.
