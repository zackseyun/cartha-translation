base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: ru
  text: И умер там Моисей, слуга Яхве, в земле Моава, по слову Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам Яхве»; это выражение можно также перевести: «по повелению Яхве».'
    reason: Лексическая альтернатива и пояснение еврейской идиомы עַל פִּי יְהוָה.
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» естественно передаёт переход к следующему событию.
- source_word: שָׁם
  choice: там
  rationale: Сохранено указание на место, описанное в предшествующем контексте.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени.
- source_word: עֶבֶד יְהוָה
  choice: слуга Яхве
  rationale: עֶבֶד может означать раба или слугу, но здесь это почётное обозначение Моисея как верного служителя Бога; «слуга» передаёт смысл без неуместного акцента на подневольном положении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: в земле Моава
  rationale: Сохранено явно присутствующее в еврейском тексте слово «земля» и географическое имя.
- source_word: עַל פִּי יְהוָה
  choice: по слову Яхве
  rationale: Еврейское выражение буквально связано с «устами», но идиоматически означает соответствие слову или повелению Яхве. Основной текст сохраняет словесный оттенок и остаётся естественным по-русски; буквальный образ и другая возможная передача отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Оттенок עֶבֶד в титуле Моисея
  choice: слуга
  alternative: раб; служитель
  rationale: Контекст представляет עֶבֶד как почётное обозначение отношений верности и порученного служения. «Раб» может чрезмерно выдвинуть на первый план подневольность, а «служитель» способен создать более узкую культовую ассоциацию.
- issue: Смысл עַל פִּי יְהוָה
  choice: по слову Яхве
  alternative: по повелению Яхве; буквально «по устам Яхве»
  rationale: Выбранная передача не устраняет связь со словом Яхве и одновременно выражает идиоматический смысл; возможный оттенок повеления и буквальный образ сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным строем. Приложение «слуга Яхве» выделено запятыми для естественности русской фразы; сохранены повтор имени Яхве и формулировка «земля Моава».
