base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: ru
  text: И похоронил[a] его в долине, в земле Моава, напротив Бет-Пеора, и никто до сих пор не знает места его погребения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В самом этом стихе тот, кто похоронил Моисея, прямо не назван; из предыдущего контекста следует, что это Господь.
    reason: Подлежащее глагола в еврейском тексте не выражено; примечание поясняет его вероятный контекстуальный референт, не вводя его в основной текст.
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: И Он похоронил его
  rationale: Форма Qal 3-го лица мужского рода единственного числа передана активной конструкцией. Подлежащее в самом стихе не названо; местоимение сохраняет эту формальную неопределённость, а заглавная буква естественно связывает его с Господом из предыдущего стиха.
- source_word: בַגַּיְ
  choice: в долине
  rationale: גַּיְ обозначает долину или ущелье; «долина» — точный и общепонятный вариант в данном географическом контексте.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: в земле Моава
  rationale: Сохранено конкретное еврейское выражение «земля Моава», а не сокращённое «в Моаве».
- source_word: מוּל בֵּית פְּעוֹר
  choice: напротив Бет-Пеора
  rationale: מוּל указывает на расположение напротив какого-либо места; топоним передан транслитерацией в привычной русской форме.
- source_word: וְלֹא יָדַע אִישׁ
  choice: никто не знает
  rationale: Хотя אִישׁ буквально означает «человек/мужчина», здесь оно употреблено в общем отрицательном обороте; современное русское «никто не знает» точно и естественно передаёт смысл.
- source_word: קְבֻרָתוֹ
  choice: места его погребения
  rationale: В контексте речь идёт о неизвестном местонахождении захоронения Моисея. «Место погребения» яснее передаёт этот смысл, чем обозначение самого действия.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивый, достойный и понятный русский эквивалент, сохраняющий временную перспективу повествователя.
theological_decisions:
- issue: Кто является подлежащим при глаголе «похоронил»
  choice: Сохранить местоименное подлежащее «Он», не добавляя имени Господа.
  alternative: Прямо написать «Господь похоронил его» либо употребить пассивную конструкцию «его похоронили».
  rationale: Предыдущий стих указывает на Господа как наиболее вероятное подлежащее, но в данном стихе имя не повторено. Местоимение сохраняет структуру оригинала и не делает подразумеваемое имя явным.
- issue: Обобщающее употребление אִישׁ
  choice: Передать как «никто».
  alternative: Буквальное «ни один человек» или гендерно маркированное «ни один мужчина».
  rationale: В отрицательном обороте существительное имеет обобщающее значение. «Никто» — естественная современная русская передача без изменения объёма утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому оригиналу, но остаётся естественным для современного читателя. Заглавное «Он» отражает очевидную связь с Господом в предыдущем контексте, тогда как примечание сообщает, что имя в самом стихе отсутствует.
