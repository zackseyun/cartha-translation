  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: ru
  text: Моисею было сто двадцать лет, когда он умер; зрение его не ослабло[a], и жизненная сила не иссякла[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаз его не потускнел». То есть зрение Моисея не ухудшилось.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его бодрость не убыла»; еврейское слово может обозначать телесную свежесть, жизненность или природную силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Моисею
  rationale: Союз ו продолжает повествование и не требует отдельного вводного слова в русском. Дательная конструкция естественно вводит сообщение о возрасте Моисея.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: было сто двадцать лет
  rationale: Еврейский оборот «сын ста двадцати лет» обозначает возраст; выбран обычный современный русский способ его выражения.
- source_word: בְּמֹתוֹ
  choice: когда он умер
  rationale: Предлог ב с существительным «смерть» и местоименным суффиксом имеет временное значение; придаточное предложение естественно передаёт его по-русски.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: зрение его не ослабло
  rationale: Глагол כָּהָה означает тускнеть или слабеть, а единственное число «глаз» здесь обозначает зрение. Основной текст передаёт смысл естественно, а буквальный образ сохранён в примечании.
- source_word: וְלֹא נָס לֵחֹה
  choice: и жизненная сила не иссякла
  rationale: Редкое לֵחַ может обозначать свежесть, телесную жизненность или силу; сочетание с נוּס («убегать, исчезать») говорит о неубывшей телесной бодрости. «Не иссякла» естественно сохраняет образ утраты силы, не сужая его до конкретной способности.
theological_decisions:
- issue: Характер сохранившейся способности Моисея
  choice: жизненная сила
  alternative: природная сила; телесная свежесть; бодрость
  rationale: Еврейское לֵחֹה допускает несколько близких телесных оттенков. Перевод не превращает выражение в утверждение о какой-либо отдельной чудесной способности и сохраняет его общую физиологическую направленность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествовательным тоном. Возраст передан обычной русской конструкцией; два последующих утверждения соединены параллельно. Редкий телесный образ לֵחֹה раскрыт без архаизма и без излишней медицинской конкретизации.
