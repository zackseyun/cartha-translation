  edition: WLC
  text: וְ/לֹֽא קָ֨ם נָבִ֥יא ע֛וֹד בְּ/יִשְׂרָאֵ֖ל כְּ/מֹשֶׁ֑ה אֲשֶׁר֙ יְדָע֣/וֹ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: ru
  text: И не восстал более[a] в Израиле пророк, подобный Моисею, которого Яхве знал лицом к лицу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё»; еврейское наречие может означать, что до времени повествователя в Израиле ещё не восстал пророк, подобный Моисею.'
    reason: Лексическая и временная неоднозначность наречия עוֹד.
lexical_decisions:
- source_word: וְלֹא
  choice: И не
  rationale: Союз продолжает заключительное повествование, а отрицание передаётся прямо, без добавления невыраженного противопоставления.
- source_word: קָם
  choice: восстал
  rationale: Глагол קום здесь означает появление пророка. «Восстал» сохраняет образ и торжественный характер итогового утверждения, оставаясь понятным в данном контексте.
- source_word: נָבִיא
  choice: пророк
  rationale: Обычное и контекстуально точное соответствие.
- source_word: עוֹד
  choice: более
  rationale: 'Передаёт основное ретроспективное значение: после Моисея в Израиле не появлялся равный ему пророк. Возможный смысл «ещё, до сих пор» отмечен в сноске, чтобы не устранять временную неоднозначность.'
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог ב обозначает среду, в которой не восстал сопоставимый с Моисеем пророк.
- source_word: כְּמֹשֶׁה
  choice: подобный Моисею
  rationale: Естественно и точно выражает сравнение с Моисеем в литературном русском языке.
- source_word: אֲשֶׁר יְדָעוֹ
  choice: которого Яхве знал
  rationale: Моисей является объектом глагола ידע; перевод сохраняет личностный характер знания, поясняемый следующим выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом.
- source_word: פָּנִים אֶל פָּנִים
  choice: лицом к лицу
  rationale: Сохраняет конкретный древнееврейский образ непосредственного общения и его межтекстовые связи, не заменяя его отвлечённым истолкованием.
theological_decisions:
- issue: Антропоморфный язык об отношениях Яхве с Моисеем
  choice: Сохранить выражение «лицом к лицу»
  alternative: «знал лично» или «знал непосредственно»
  rationale: Исходный текст использует конкретный образ уникальной близости и непосредственности. Перевод не превращает его ни в утверждение о телесности Бога, ни в отвлечённую богословскую формулу.
- issue: Временной охват утверждения о пророке, подобном Моисею
  choice: Основной текст передаёт ретроспективный смысл словом «более», а возможное «ещё, до сих пор» вынесено в сноску
  alternative: «И ещё не восстал в Израиле пророк…»
  rationale: Наречие עוֹד допускает оттенок «после него больше не» и оттенок «ещё не, до сих пор». Сноска сохраняет возможность временно открытого прочтения, не превращая её в однозначное предсказание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов близок к древнееврейскому, но остаётся естественным; конкретный образ «лицом к лицу» сохранён без догматического уточнения.
