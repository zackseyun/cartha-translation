lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: весь Неффалим
  rationale: Сочетание כָּל с названием колена обозначает всю относящуюся к нему область. Краткая передача сохраняет географический смысл, не добавляя отсутствующего в еврейском тексте слова «земля».
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: землю Ефрема и Манассии
  rationale: אֶרֶץ здесь означает землю или территорию; единое существительное относится к двум соединённым названиям колен.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: всю землю Иуды
  rationale: Перевод явно передаёт אֶרֶץ и сохраняет географический, а не этнический акцент выражения.
- source_word: עַד
  choice: до
  rationale: В описании обозреваемого пространства предлог обозначает предел его протяжённости; русское «до» естественно передаёт этот смысл.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: Западного моря
  rationale: Буквально выражение означает «заднее море» и отражает древнееврейскую ориентацию лицом на восток; смысловой перевод «Западное море» ясно передаёт направление, не подменяя выражение названием «Средиземное море» в основном тексте.
