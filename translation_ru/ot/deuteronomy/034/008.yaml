  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: ru
  text: И оплакивали сыны Израиля Моисея на равнинах Моава тридцать дней; и завершились дни плача и траура по Моисею.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: оплакивали
  rationale: Глагол בכה обозначает плач; при указании умершего как объекта русское «оплакивали Моисея» естественно передаёт плач по нему и не смешивает его полностью с более широким понятием скорби далее.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет исходное выражение «сыновья/сыны Израиля» и его библейскую образность; «сыны» уместно в современном литературном тексте возвышенного регистра.
- source_word: אֶת מֹשֶׁה
  choice: Моисея
  rationale: Показатель прямого дополнения при בכה вводит того, кого оплакивают; русская конструкция с винительным падежом передаёт это непосредственно.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: на равнинах Моава
  rationale: עֲרָבוֹת обозначает равнинную степную местность; «равнины Моава» ясно и традиционно передаёт географический смысл.
- source_word: שְׁלֹשִׁים יוֹם
  choice: тридцать дней
  rationale: Прямое соответствие числительного и существительного.
- source_word: וַיִּתְּמוּ
  choice: завершились
  rationale: Глагол תם выражает достижение конца, завершённость периода; возвратная форма естественна по-русски и сохраняет результативный оттенок.
- source_word: יְמֵי בְכִי אֵבֶל מֹשֶׁה
  choice: дни плача и скорби по Моисею
  rationale: 'Передаёт все смысловые элементы трудной сжатой цепочки: период плача и траурной скорби по Моисею. Союз «и» естественно выражает тесно связанные аспекты траура, не устраняя возможной пояснительной связи между ними.'
