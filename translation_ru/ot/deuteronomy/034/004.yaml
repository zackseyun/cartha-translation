  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו זֹ֤את הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶ֑נָּ/ה הֶרְאִיתִ֣י/ךָ בְ/עֵינֶ֔י/ךָ וְ/שָׁ֖מָּ/ה לֹ֥א תַעֲבֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: ru
  text: 'И сказал ему Яхве: «Вот земля, о которой Я поклялся Аврааму, Исааку и Иакову, сказав: „Твоему потомству[a] отдам её“. Я дал тебе увидеть её своими глазами, но туда ты не перейдёшь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семени». В еврейском употреблено существительное единственного числа с собирательным значением.'
    reason: Лексическая альтернатива сохраняет буквальный образ и грамматическую форму еврейского זֶרַע.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, в принятой современной русской форме.
- source_word: זֹאת הָאָרֶץ
  choice: Вот земля
  rationale: В данном контексте הָאָרֶץ обозначает землю обетования; конструкция «вот земля» естественно указывает на открывшийся Моисею вид.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся
  rationale: Сохраняет прямое значение глагола — дать клятву — и торжественный характер заветного обещания.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Русские дательные формы передают повторяющийся еврейский предлог לְ без неестественного повторения служебных слов.
- source_word: לְזַרְעֲךָ
  choice: твоему потомству
  rationale: «Потомство» является естественным русским собирательным существительным и сохраняет собирательную единственность еврейского זֶרַע.
- source_word: אֶתְּנֶנָּה
  choice: отдам её
  rationale: Краткая форма естественно выражает содержание обещания и передаёт местоименный суффикс женского рода, относящийся к земле.
- source_word: הֶרְאִיתִיךָ בְעֵינֶיךָ
  choice: Я дал тебе увидеть её своими глазами
  rationale: Передаёт каузативную форму ראה и подчёркивает личное, непосредственное видение.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: но туда ты не перейдёшь
  rationale: «Перейдёшь» сохраняет пространственный образ перехода в землю, а «но» естественно выражает контраст между возможностью увидеть и невозможностью войти.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. Форма «Яхве» сохраняет его как имя и соответствует современному научно обоснованному произношению, не подменяя его титулом.
- issue: Передача זֶרַע в обетовании патриархам
  choice: потомство
  alternative: семя; потомки
  rationale: Еврейское слово грамматически стоит в единственном числе, но имеет собирательное значение. «Потомство» сохраняет эту особенность и не устраняет возможную богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис речи сохраняет формулу клятвы и прямое содержание обещания; устаревшие формы и конфессионально маркированная лексика не используются.
