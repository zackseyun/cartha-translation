base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: ru
  text: по всем знамениям и чудесам, которые Яхве послал его совершить в земле Египта — к фараону, всем его слугам и ко всей его земле[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против всей его земли» или «по всей его земле». Еврейский предлог допускает различные оттенки отношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: по всем знамениям и чудесам
  rationale: Начальное לְ продолжает синтаксическую связь с предыдущим стихом и указывает, в чём Моисей не имел равного. «По всем» естественно передаёт эту связь в русском тексте; традиционная пара «знамения и чудеса» сохраняет различие אוֹת и מוֹפֵת.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: которые Яхве послал его совершить
  rationale: Сохраняется прямое значение שׁלח «послал» и целевая конструкция с לַעֲשׂוֹת. Глагол «совершить» по-русски естественно сочетается со знамениями и чудесами.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся собственное имя, выраженное тетраграмматоном, без замены титулом.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египетской земле
  rationale: Формулировка отражает существительное אֶרֶץ и сохраняет возвышенный повествовательный регистр, оставаясь понятной современному читателю.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: над фараоном, всеми его слугами и всей его землёй
  rationale: Повторяющийся לְ обозначает направленность и воздействие знамений. В данном контексте русское «над» естественно передаёт действия, затронувшие фараона, его слуг и страну, хотя еврейский предлог допускает и другие оттенки.
- source_word: עֲבָדָיו
  choice: его слугами
  rationale: «Слуги» — прямой эквивалент עֲבָדִים; в царском контексте слово может включать придворных и должностных лиц, но перевод не сужает значение до «чиновников».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер знамений по отношению к фараону и Египту
  choice: над фараоном, всеми его слугами и всей его землёй
  alternative: перед фараоном, его слугами и по всей его земле; против фараона, его слуг и всей его земли
  rationale: Контекст включает и явление знамений перед фараоном, и суд, поразивший Египет. Основной перевод передаёт воздействие, а примечание сохраняет неоднозначность предлога לְ и не сводит смысл только к одной стороне.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Строка сохраняет синтаксическую незавершённость стиха, поскольку он продолжает мысль Второзакония 34:10.
