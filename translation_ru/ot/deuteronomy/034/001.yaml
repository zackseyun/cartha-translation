  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: ru
  text: 'Затем Моисей поднялся с равнин Моава на гору Нево, на вершину Фасги, что напротив Иерихона. И Яхве показал ему всю землю[a]: Галаад до Дана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал ему увидеть всю землю».'
    reason: Лексическая альтернатива, явно передающая каузативное значение еврейской формы וַיַּרְאֵהוּ.
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה обозначает движение вверх; «поднялся» естественно и точно передаёт направление.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: с равнин Моава
  rationale: עַרְבוֹת здесь обозначает равнинную, степную область Моава; «равнины» ясно и привычно передаёт географический смысл.
- source_word: הַר נְבוֹ
  choice: на гору Нево
  rationale: Сочетание הַר с географическим названием естественно передаётся как «гора Нево».
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: на вершину Фасги
  rationale: רֹאשׁ в данном географическом контексте означает вершину; «Фасга» сохраняет укоренившуюся русскую форму названия.
- source_word: אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ
  choice: что напротив Иерихона
  rationale: В географическом описании עַל־פְּנֵי означает расположение напротив или лицом к чему-либо; краткое «что напротив» звучит естественно.
- source_word: וַיַּרְאֵהוּ
  choice: показал ему
  rationale: Каузативная форма ראה означает «дать увидеть, показать»; основной текст использует наиболее естественное русское соответствие, а буквальный оттенок отмечен в сноске.
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: הָאָרֶץ относится к обозреваемой земле, а не ко всей земле как миру; контекст сохраняет нужное ограничение.
- source_word: אֶת־הַגִּלְעָד עַד־דָּן
  choice: Галаад до самого Дана
  rationale: Фраза уточняет, какую землю увидел Моисей; «до самого» естественно передаёт предел עַד.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Каузативное значение וַיַּרְאֵהוּ
  choice: показал ему
  alternative: дал ему увидеть
  rationale: Обе передачи отражают каузатив глагола ראה. В основном тексте выбрана естественная формулировка, а более буквальная сохранена в сноске без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Географические названия даны в привычных русских библейских формах; двоеточие вводит последующее перечисление обозреваемой земли.
