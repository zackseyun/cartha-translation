  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: ru
  text: и вернёшься к Яхве, твоему Богу, и будешь слушаться его голоса[a] во всём, что я заповедую тебе сегодня, — ты и твои дети[b], — всем сердцем и всей душой[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и будешь внимать его голосу». Еврейский оборот подразумевает не только слушание, но и повиновение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твои сыновья»; здесь это слово может обозначать детей, потомство в целом.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово также может означать «жизнь», «самого себя» или «всё существо».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד יְהוָה אֱלֹהֶיךָ
  choice: и обратишься к Яхве, твоему Богу
  rationale: Глагол שׁוב с עַד передаёт возвращение или обращение к кому-либо. «Обратишься» естественно звучит по-русски и сохраняет идею поворота к Богу, не подменяя её более узким богословским термином «покаешься». Имя יהוה передано как «Яхве».
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: и будешь слушаться его голоса
  rationale: Оборот שׁמע בקול означает не только слышать, но внимать и повиноваться. «Слушаться голоса» сохраняет как силу выражения, так и его образность.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: во всём, что я заповедую тебе сегодня
  rationale: Предлог כְּ здесь выражает соответствие всей полноте заповеданного. Русское «во всём, что» передаёт смысл естественнее буквального «согласно всему, что».
- source_word: אַתָּה וּבָנֶיךָ
  choice: ты и твои дети
  rationale: בנים буквально может означать «сыновья», но в данном семейно-заветном контексте способно обозначать потомство в целом; «дети» не создаёт необоснованного ограничения по полу.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: всем сердцем и всей душой
  rationale: Устойчивое и понятное русское соответствие, сохраняющее две части еврейской формулы. נֶפֶשׁ имеет более широкий диапазон значений, что отражено в примечании.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה, поэтому транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл возвращения к Богу в וְשַׁבְתָּ עַד
  choice: обратишься к Яхве
  alternative: вернёшься к Яхве; покаешься перед Яхве
  rationale: «Обратишься» сохраняет заветный смысл поворота к Богу, не сводя многозначный שׁוב исключительно к техническому понятию покаяния.
- issue: Объём значения בָנֶיךָ
  choice: твои дети
  alternative: твои сыновья
  rationale: Форма мужского рода может обозначать потомков вообще; контекст не требует утверждать, что речь идёт только о мужчинах.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Синтаксис сохраняет последовательность еврейского стиха; вставное «ты и твои дети» выделено тире для ясности. Строчная буква в начале и запятая в конце учитывают возможную синтаксическую связь с соседними стихами.
