base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: ru
  text: любя Яхве, твоего Бога, слушаясь его голоса[a] и крепко держась за него[b], потому что он — твоя жизнь и долгота твоих дней, чтобы ты жил на земле, которую Яхве поклялся дать твоим отцам[c] — Аврааму, Исааку и Иакову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушая его голос»; еврейское выражение часто подразумевает также послушание и исполнение услышанного.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прилепляясь к нему».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «предкам»; слово «отцам» сохранено, поскольку далее прямо названы Авраам, Исаак и Иаков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ
  choice: любя Яхве, Бога твоего
  rationale: Инфинитив с ל продолжает пояснение к призыву избрать жизнь в предыдущем стихе и обозначает средство. Постпозиция «Бога твоего» сохраняет торжественный библейский регистр без архаизации.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: слушаясь его голоса
  rationale: Оборот שׁמע בקול означает не только слышать, но и внимать, исполнять услышанное. «Слушаться голоса» естественно передаёт обе стороны еврейской идиомы.
- source_word: וּלְדָבְקָה־בוֹ
  choice: и крепко держась его
  rationale: דבק с ב обозначает тесную привязанность и неизменную верность. Выражение понятно современному читателю и сохраняет образ физического удерживания.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: потому что он — твоя жизнь
  rationale: Местоимение мужского рода естественнее всего относится к Яхве. Именная конструкция передана прямо, без поясняющего добавления «источник».
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: и долгота твоих дней
  rationale: Близкая к форме оригинала передача сохраняет образ продолжительности жизни и торжественный параллелизм.
- source_word: לָשֶׁבֶת עַל־הָאֲדָמָה
  choice: чтобы ты жил на земле
  rationale: Инфинитив выражает цель или результат. Русское «жил» здесь естественнее «обитал», а «земля» передаёт территорию обетования.
- source_word: לַאֲבֹתֶיךָ ... לָתֵת לָהֶם
  choice: поклялся дать твоим отцам
  rationale: В русском управление глагола «дать» естественно связывает обещанную землю с адресатами клятвы; имена сразу уточняют, кто назван отцами.
theological_decisions:
- issue: К чему относится הוּא в выражении «он — твоя жизнь»
  choice: Местоимение относится к Яхве
  alternative: Местоимение обобщённо относится к предшествующему пути любви, послушания и верности
  rationale: Ближайший грамматически подходящий и наиболее заметный референт — Яхве, Бог Израиля. При этом контекстуальная связь жизни с верностью завету сохраняется.
- issue: Отношение «долготы дней» к жизни на обещанной земле
  choice: 'Сохранена целевая связь: «чтобы ты жил на земле»'
  alternative: 'Понимать инфинитив как простое продолжение: «жить на земле»'
  rationale: ל с инфинитивом допускает цель или результат; «чтобы» ясно и без излишнего толкования передаёт связь с предыдущей фразой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено имя Яхве и обращение к одному лицу в мужском роде. Архаизмы вроде «внимать», «прилепляться» и «обитать» не помещены в основной текст; один из них дан как буквальная альтернатива в сноске.
