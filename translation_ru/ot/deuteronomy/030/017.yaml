lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: В контексте союз вводит условие, противопоставленное предшествующему призыву; «но если» естественно передаёт этот поворот.
- source_word: יִפְנֶה לְבָבְךָ
  choice: твоё сердце отвернётся
  rationale: Сохраняет образ сердца как средоточия внутренней верности и выражает подразумеваемое отступление.
- source_word: וְלֹא תִשְׁמָע
  choice: и ты не послушаешь
  rationale: «Послушаешь» сохраняет значение слышания и одновременно допускает присущий контексту оттенок повиновения.
- source_word: וְנִדַּחְתָּ
  choice: и тебя увлекут в сторону
  rationale: Страдательная форма передаёт воздействие, уводящее человека с пути, не уточняя прямо действующее лицо.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: и ты станешь поклоняться
  rationale: В данном контексте телесное преклонение является актом религиозного поклонения; выбран естественный современный русский эквивалент.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямой и общепонятный перевод устойчивого второзаконнического выражения.
- source_word: וַעֲבַדְתָּם
  choice: и служить им
  rationale: Сохраняет основное значение культового служения и отличает его от предшествующего поклонения.
theological_decisions:
- issue: Последовательность отступления от заветной верности
  choice: 'Сохранена цепь: сердце отворачивается, человек не слушает, его увлекают в сторону, он поклоняется другим богам и служит им.'
  alternative: 'Перевести וְנִדַּחְתָּ более активно: «ты позволишь увлечь себя», а וְלֹא תִשְׁמָע — как «не повинуешься».'
  rationale: Еврейский текст описывает нарастающую последовательность неверности, но не требует усиления личной активности в страдательном глаголе и не устраняет многозначность שׁמע.
translation_notes:
  register: Современный литературный русский язык; обращение во втором лице единственного числа сохранено. Формулировка торжественная, но доступная. Запятая в конце отражает незавершённость условного предложения, продолжающегося в следующем стихе.
