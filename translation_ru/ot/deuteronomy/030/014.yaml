lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: 'В данном контексте частица вводит противопоставление предыдущим утверждениям: слово не далеко и не недоступно, но совсем близко. Русское «но» естественно передаёт этот дискурсивный поворот.'
- source_word: קָרוֹב אֵלֶיךָ
  choice: близко к тебе
  rationale: Прямо и естественно передаёт значение близости и сохраняет направленность предлога אֶל.
- source_word: הַדָּבָר
  choice: это слово
  rationale: «Слово» сохраняет широкое значение דָּבָר и связь с данным Богом наставлением; указательное «это» по-русски ясно отсылает к сказанному выше, не сужая смысл до одной лишь заповеди.
- source_word: מְאֹד
  choice: совсем
  rationale: В сочетании «совсем близко» естественно и выразительно передаёт усиление, заключённое в מְאֹד.
- source_word: בְּפִיךָ
  choice: в твоих устах
  rationale: Сохраняет телесный образ речи; «уста» уместны в современном литературном библейском регистре и не являются непонятным архаизмом.
- source_word: וּבִלְבָבְךָ
  choice: и в твоём сердце
  rationale: Сохраняет параллелизм «уста — сердце» и широкий древнееврейский смысл внутреннего человека, включающий мысль и волю.
- source_word: לַעֲשֹׂתוֹ
  choice: чтобы ты исполнял его
  rationale: Передаёт целевое значение конструкции с לְ. В контексте Божьего наставления русский глагол «исполнять» естественнее, чем буквальное «делать», и выражает практическое послушание.
theological_decisions:
- issue: Значение הַדָּבָר
  choice: «это слово» в основном тексте
  alternative: «это дело» или «эта заповедь»
  rationale: Непосредственный контекст говорит о Божьей заповеди, однако דָּבָר шире по значению. Перевод «слово» сохраняет эту смысловую широту, а возможные контекстуальные значения отмечены в сноске.
- issue: Отношение близости слова к исполнению
  choice: «чтобы ты исполнял его»
  alternative: «и ты можешь исполнить его» или «для исполнения его»
  rationale: Источник выражает цель или направленность, но прямо не добавляет модального утверждения о способности. Поэтому перевод сохраняет целевую конструкцию, не усиливая её богословски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Единственное число «тебе / твоих / твоём / ты» сохраняет обращение к Израилю как к единому народу. Образ «в устах и в сердце» оставлен без рационализирующей замены.
