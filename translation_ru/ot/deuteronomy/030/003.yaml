base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: ru
  text: тогда Господь, твой Бог, восстановит твоё благополучие[a] и смилуется над тобой; он вновь соберёт тебя[b] из всех народов[c], среди которых Господь, твой Бог, рассеял тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вернёт твой плен»; это еврейское выражение означает восстановление после бедствия или изгнания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вернётся и соберёт тебя».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «из среды всех народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: В современном русском библейском употреблении традиционная передача тетраграмматона как «Господь» естественна, узнаваема и сохраняет достоинство речи; личное имя можно пояснять на уровне общей редакционной политики издания.
- source_word: שָׁב אֶת־שְׁבוּתְךָ
  choice: восстановит твоё благополучие
  rationale: Устойчивое древнееврейское выражение обозначает перемену бедственного положения и восстановление; буквальное «возвратит твой плен» по-русски двусмысленно и неестественно.
- source_word: וְרִחֲמֶךָ
  choice: и смилуется над тобой
  rationale: Передаёт сострадательную милость רחם в естественном и достойном русском библейском регистре.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: Он вновь соберёт тебя
  rationale: Второе שָׁב допускает понимание «снова, вновь» при следующем глаголе; выбранная формулировка ясна по-русски, а буквальная синтаксическая возможность отмечена в сноске.
- source_word: מִכָּל הָעַמִּים
  choice: из всех народов
  rationale: «Народы» точно и естественно передаёт множественное עַמִּים; вариант «племена» был бы уже по значению, а «нации» — менее уместен в данном регистре.
- source_word: הֱפִיצְךָ
  choice: рассеял тебя
  rationale: «Рассеял» хорошо передаёт каузативное значение פוץ в контексте изгнания и географического рассеяния.
- source_word: שָׁמָּה
  choice: среди которых
  rationale: Буквальное «туда» естественно преобразовано в русское относительное придаточное с сохранением локативного смысла.
theological_decisions:
- issue: Значение оборота שׁוּב אֶת־שְׁבוּת
  choice: восстановит твоё благополучие
  alternative: возвратит тебя из плена / возвратит твой плен
  rationale: Оборот шире буквального возвращения пленников и говорит об обращении бедственного состояния; последующая часть стиха отдельно описывает собирание рассеянных.
- issue: Функция второго וְשָׁב
  choice: вновь соберёт тебя
  alternative: вернётся и соберёт тебя
  rationale: Еврейская конструкция допускает как самостоятельное «вернётся», так и значение повторности при «соберёт». Основной текст выбирает естественное контекстуальное прочтение, не скрывая альтернативу в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным и доступным; местоимение «Он» после точки с запятой устраняет возможную перегруженность повтором подлежащего. Все смысловые альтернативы, реально обусловленные древнееврейским текстом, вынесены в краткие сноски.
