  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: ru
  text: И введёт тебя Яхве, твой Бог, в землю, которой владели твои отцы[a], и ты овладеешь ею; он будет благ к тебе[b] и сделает тебя многочисленнее твоих отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую унаследовали твои отцы»; также возможно: «которой овладели твои отцы». Еврейский глагол может обозначать наследование, овладение или владение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделает тебе добро»; также возможно: «дарует тебе благополучие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: введёт тебя
  rationale: Каузативная форма глагола בוא означает «ввести, привести». В русском «введёт тебя в землю» естественно передаёт направленное вступление; слово «обратно» контекстуально возможно, но в самом глаголе прямо не выражено.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом второго лица мужского рода единственного числа прямо означает «твой Бог».
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте Второзакония речь идёт об обещанной земле; «земля» сохраняет географический и заветный смысл.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: которой владели твои отцы
  rationale: Глагол ירשׁ охватывает значения наследования, овладения и владения. Здесь предки уже владели землёй, поэтому эта формулировка ясна и сохраняет возможный оттенок обладания.
- source_word: וִירִשְׁתָּהּ
  choice: и ты овладеешь ею
  rationale: При земле как объекте ירשׁ часто означает «овладеть, вступить во владение». Выбор сохраняет связь с тем же еврейским корнем в предыдущей части стиха.
- source_word: וְהֵיטִבְךָ
  choice: Он будет благотворить тебе
  rationale: Каузатив от יטב буквально выражает действие во благо адресата. «Благотворить тебе» сохраняет широкий смысл и не сужает его лишь до материального процветания.
- source_word: וְהִרְבְּךָ
  choice: сделает тебя многочисленнее
  rationale: Каузатив от רבה означает «умножить, сделать многочисленным». В сравнительной конструкции современная русская формулировка «сделает тебя многочисленнее» звучит яснее, чем буквальное «умножит тебя более».
- source_word: מֵאֲבֹתֶיךָ
  choice: твоих отцов
  rationale: Сравнительный предлог מן указывает на превосходство по численности, а אבות сохраняется как явно мужское «отцы».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Передача אֲבֹתֶיךָ
  choice: твои отцы
  alternative: твои предки
  rationale: Еврейское слово имеет форму мужского рода и буквально обозначает «отцов»; перевод сохраняет эту форму, не устраняя возможную родословную и заветную окраску.
- issue: Смысл וְהֵיטִבְךָ
  choice: будет благотворить тебе
  alternative: дарует тебе благополучие; сделает тебе добро
  rationale: Широкое благотворное действие Бога не сведено исключительно к материальному процветанию; альтернативный буквальный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет последовательность еврейских клауз, но избегает неестественных калек. Местоимение «Он» написано с прописной буквы как традиционная русская графическая норма почтительного обозначения Бога, без изменения смысла оригинала.
