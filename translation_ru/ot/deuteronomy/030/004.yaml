base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: ru
  text: Если твои изгнанники[a] окажутся на краю небес[b], то оттуда Яхве, твой Бог, соберёт тебя и оттуда возьмёт тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои изгнанные» или «твои рассеянные». Еврейское слово обозначает тех, кого изгнали, отогнали или рассеяли.'
    reason: lexical_alternative
  - marker: b
    text: «На краю небес» — еврейский образ, означающий самое далёкое из возможных мест.
    reason: cultural_note
  - marker: c
    text: 'По смыслу возможно также: «приведёт тебя». Еврейский глагол буквально означает «возьмёт тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִהְיֶה
  choice: Если … окажутся
  rationale: Условная конструкция передана естественным русским оборотом; форма «окажутся» выражает предполагаемое пребывание в отдалённом месте, не добавляя усилительного «даже».
- source_word: נִדַּחֲךָ
  choice: твои изгнанники
  rationale: Форма от נדח обозначает тех, кто был изгнан, отогнан или рассеян. Множественное «изгнанники» естественно передаёт собирательный смысл при обращении к Израилю как к единому народу.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: на краю небес
  rationale: Сохранён пространственный образ еврейского текста; в данном контексте это идиома предельно далёкого места.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Повтор наречия сохранён в обеих частях стиха ради исходного акцента.
- source_word: יְקַבֶּצְךָ
  choice: соберёт тебя
  rationale: Порода piel глагола קבץ означает «собирать». Единственное число местоимения сохраняет обращение к Израилю как к единому целому.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהֶיךָ — обычным заветным обозначением «твой Бог».
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: и оттуда заберёт тебя
  rationale: לקח буквально значит «брать, взять». «Заберёт» естественно по-русски передаёт взятие кого-либо из указанного места, не предвосхищая прямо сформулированное в следующем стихе «приведёт».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Собирательное обращение к Израилю в единственном числе
  choice: Сохранить «тебя» и «твой» при множественном «изгнанники»
  alternative: Развернуть обращение во множественное число или добавить «твой народ»
  rationale: 'Так сохраняется напряжение исходной грамматики: Израиль — единый адресат, хотя речь идёт о рассеянных представителях народа.'
- issue: Различение קבץ и לקח
  choice: «соберёт» и «заберёт»
  alternative: «соберёт» и «приведёт»
  rationale: Выбор не сливает два разных действия и не переносит в этот стих более определённую направленность движения из следующего стиха.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис остаётся простым и ясным; повтор «оттуда» и образ «края небес» сохранены. Формулировка избегает архаизмов и конфессионально окрашенных замен личного имени.
