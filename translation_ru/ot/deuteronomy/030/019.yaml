source:
  edition: WLC
  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: ru
  text: 'Сегодня я призываю небо и землю в свидетели против вас[a]: я поставил перед тобой жизнь и смерть, благословение и проклятие. Выбери же жизнь, чтобы ты и твоё потомство жили[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь стоит множественное «вас», а далее — единственное «тобой»: народ рассматривается и как множество людей, и как единый участник завета.'
    reason: grammatical_note
  - marker: b
    text: 'Буквально: «семя»; то есть потомки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: я призываю ... в свидетели против вас
  rationale: 'Хифиль глагола עוּד с предлогом בְּ имеет здесь юридический, заветный оттенок: небо и земля призываются как свидетели против стороны завета.'
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественно передаёт временное ударение древнееврейского текста в современном русском языке.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небо и землю
  rationale: Устойчивое русское сочетание точно передаёт формулу всеохватного свидетельства; морфологически множественное שָׁמַיִם по-русски идиоматично соответствует слову «небо».
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: жизнь и смерть
  rationale: Прямо и естественно передаёт противопоставленные последствия заветного выбора.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: я предложил тебе
  rationale: В данном контексте выражение означает поставить перед человеком два исхода на выбор; «предложил тебе» естественно выражает эту функцию, не подразумевая дарования обоих исходов.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: благословение и проклятие
  rationale: Сохраняет форму единственного числа и ясное заветное противопоставление.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: Выбери же жизнь
  rationale: Форма с וְ после перечисления имеет побудительно-следственный оттенок. Частица «же» естественно связывает повеление с названными вариантами, не усиливая связь до отдельного логического «поэтому».
- source_word: לְמַעַן תִּחְיֶה
  choice: чтобы жил
  rationale: Передаёт целевое значение לְמַעַן и сохраняет связь с избранием жизни.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: ты и твоё потомство
  rationale: «Потомство» сохраняет собирательную широту זֶרַע и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Юридическая формула свидетелей завета
  choice: «призываю небо и землю в свидетели против вас»
  alternative: «свидетельствую вам небом и землёй» / «предупреждаю вас»
  rationale: Основной текст сохраняет судебно-заветный характер формулы и не сводит её к общему предупреждению.
- issue: Смена числа во втором лице
  choice: Сохранены «против вас», затем «тебе», «ты» и «твоё»
  alternative: Унифицировать всё как множественное или всё как единственное число
  rationale: В еврейском тексте בָכֶם стоит во множественном числе, тогда как последующие формы — в мужском единственном. Сохранение смены числа отражает обращение к народу как ко множеству и как к единому участнику завета, не устраняя напряжение оригинала.
- issue: Связь повеления «выбери» с предшествующим перечислением
  choice: «Выбери же жизнь»
  alternative: «И выбери жизнь» / «Поэтому выбери жизнь»
  rationale: «Же» передаёт естественный вывод и настойчивое побуждение, но не вводит более сильную логическую связку, чем допускает еврейское וְ.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи, но без архаизмов. Синтаксис сохраняет торжественную судебно-заветную рамку. Пунктуация завершена точкой, поскольку стих представлен как самостоятельная единица.
