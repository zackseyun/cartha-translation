base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: ru
  text: Ибо эта заповедь, которую я сегодня даю тебе, не слишком трудна для тебя[a] и не далека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не выше твоего понимания», «не недоступна тебе» или «не сокрыта от тебя». Еврейский глагол может указывать на нечто необычайное, непостижимое или находящееся за пределами человеческой досягаемости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание и пояснение к предшествующему призыву; «ибо» естественно сохраняет логическую связь и достойный письменный регистр.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: эта заповедь
  rationale: «Заповедь» передаёт מִצְוָה в его заветно-правовом контексте и звучит естественно в русском библейском дискурсе.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которую я сегодня даю тебе
  rationale: По-русски «даю заповедь» естественнее буквального «заповедую»; настоящее время и «сегодня» сохраняют непосредственность обращения Моисея.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: не слишком трудна для тебя
  rationale: Форма от פלא может обозначать нечто необычайное, непостижимое или недоступное. В сочетании с последующим указанием на удалённость смысл относится к практической доступности заповеди, однако иные оттенки сохранены в сноске.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: и не далека
  rationale: Сохраняется пространственная метафора רָחוֹק, развиваемая в следующих стихах; краткая формулировка естественна по-русски.
theological_decisions:
- issue: Значение נִפְלֵאת применительно к способности человека исполнить заповедь завета
  choice: «не слишком трудна для тебя» — как указание на доступность заповеди в непосредственном контексте
  alternative: «не выше твоего понимания», «не недоступна тебе» или «не сокрыта от тебя»
  rationale: Перевод передаёт утверждаемую текстом доступность заповеди, но не превращает стих в общее доктринальное заявление о независимой нравственной способности человека. Богословское напряжение не снимается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка ясна обычному читателю; синтаксис сохраняет компактность и параллелизм еврейского текста.
