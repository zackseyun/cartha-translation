  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: ru
  text: 'Она не на небесах, так что тебе пришлось бы сказать: «Кто взойдёт для нас на небеса, возьмёт её для нас и даст нам услышать её[a], чтобы мы исполнили её?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвестит её нам». Буквально: «сделает так, чтобы мы услышали её».'
    reason: Лексико-грамматическая альтернатива для каузативной формы глагола שמע.
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: на небесах
  rationale: Предлог בְּ с שָׁמַיִם обозначает местонахождение; «на небесах» естественно передаёт недоступную небесную сферу и сохраняет формально множественное число древнееврейского слова.
- source_word: הִוא
  choice: она
  rationale: Местоимение женского рода отсылает к «заповеди» (הַמִּצְוָה) из стиха 11; русский женский род позволяет сохранить эту связь без подстановки существительного.
- source_word: לֵאמֹר
  choice: чтобы ты говорил
  rationale: Инфинитив вводит содержание предполагаемого возражения; конструкция с «чтобы» естественна после отрицания «не на небесах».
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: кто взойдёт для нас
  rationale: «Взойдёт» сохраняет направленность глагола עלה вверх, а «для нас» — благотворное значение לָנוּ, не уточняя, идёт ли речь о представительстве или действии ради народа.
- source_word: הַשָּׁמַיְמָה
  choice: на небеса
  rationale: Направительное окончание -ה выражает движение к небесам; русское «взойти на небеса» передаёт его естественно.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: и принесёт её нам
  rationale: Буквальное значение לקח — «взять», но в контексте движения на небеса и возвращения с заповедью русское «принесёт» ясно выражает получение и доставку, не добавляя лишнего богословского смысла.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: и даст нам её услышать
  rationale: Так сохраняется каузативная форма שמע («сделает так, чтобы мы услышали») без более узкого толкования «возвестит» или «объяснит».
- source_word: וְנַעֲשֶׂנָּה
  choice: чтобы мы исполнили её
  rationale: В отношении заповеди עשה означает не просто совершить действие, а исполнить предписанное; придаточное цели передаёт связь с предшествующим слушанием.
theological_decisions:
- issue: Референт местоимения הִוא
  choice: Сохранено местоимение «она», отсылающее к заповеди из предыдущего стиха.
  alternative: Повторить «эта заповедь».
  rationale: Местоимение точно воспроизводит связность древнееврейского текста и не превращает подразумеваемый референт в явное повторение.
- issue: Каузатив וְיַשְׁמִעֵנוּ
  choice: «даст нам её услышать»
  alternative: «возвестит её нам»
  rationale: Выбранный вариант сохраняет буквальную образность слушания и не сводит способ сообщения только к провозглашению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм исходного текста сохранён, но порядок слов сделан естественным для русского. Формы «взойдёт», «небеса» и «исполнили» dignified and broadly understandable without confessional terminology.
