  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: ru
  text: И Яхве, твой Бог, даст тебе изобилие во всяком деле твоих рук[a], в плоде твоего чрева, в приплоде твоего скота и в плодах твоей земли — во благо. Ибо Яхве снова будет радоваться о тебе — во благо тебе, как Он радовался о твоих отцах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дарует тебе достаток»; еврейский глагол означает, что Бог даст изобилие или избыток.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отцах»; то есть о праотцах или предках Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: даст тебе изобилие
  rationale: Порода hифиль глагола יתר выражает причинение избытка или достатка. Формулировка сохраняет каузативный смысл и естественно вводит последующий перечень благ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: во всяком деле твоих рук
  rationale: Естественный русский эквивалент еврейской идиомы о труде и начинаниях; множественное «рук» по-русски звучит естественнее исходного собирательного единственного.
- source_word: בִּפְרִי בִטְנְךָ
  choice: в плоде твоего чрева
  rationale: Сохраняет исходную метафору потомства и её связь с формулами заветного благословения.
- source_word: בְהֶמְתְּךָ
  choice: твоего скота
  rationale: В сельскохозяйственном контексте обозначает домашних животных в целом.
- source_word: אַדְמָתְךָ
  choice: твоей земли
  rationale: Обозначает возделываемую землю, дающую урожай; по-русски сочетание «плоды земли» естественно и конкретно.
- source_word: לְטוֹבָה / לְטוֹב
  choice: тебе во благо / благотворить тебе
  rationale: Обе конструкции указывают на благоприятный результат. Во второй части «радоваться о тебе и благотворить тебе» естественно передаёт тесную связь שׂוּשׂ עַל и לְטוֹב, не превращая её в абстрактное «для добра».
- source_word: יָשׁוּב ... לָשׂוּשׂ
  choice: снова будет радоваться
  rationale: Глагол «возвратиться» с инфинитивом здесь означает возобновление действия — «снова, вновь».
- source_word: אֲבֹתֶיךָ
  choice: твоих отцах
  rationale: Сохраняет явно мужское обозначение предшествующих поколений Израиля; более широкое значение разъяснено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его и не подменяет титулом.
- issue: Значение אֲבֹתֶיךָ
  choice: твоих отцах
  alternative: твоих предках
  rationale: Буквальная мужская форма может отсылать как к праотцам, так и шире к прежним поколениям; основной текст сохраняет форму источника, а сноска обозначает широту значения.
- issue: Связь לְטוֹב с радостью Яхве
  choice: радоваться о тебе и благотворить тебе
  alternative: радоваться о тебе тебе во благо
  rationale: Еврейская конструкция допускает понимание «радоваться о тебе к добру/во благо». Выбранная формулировка ясно передаёт благотворный результат, не приписывая тексту конфессионально специфического смысла.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены метафоры «плод чрева» и «плоды земли», но синтаксис сделан естественным для современного читателя. Обращение во всём стихе — к одному лицу, как в еврейском тексте.
