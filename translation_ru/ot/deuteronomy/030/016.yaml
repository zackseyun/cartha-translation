revisions:
- from: Я сегодня повелеваю тебе любить Яхве, твоего Бога, ходить Его путями и соблюдать Его заповеди, установления и законы[a]. Тогда ты будешь жить и умножишься, и Яхве, твой Бог, благословит тебя в той земле, куда ты входишь, чтобы овладеть ею[b][c].
  to: Ибо я сегодня повелеваю тебе любить Яхве, твоего Бога, ходить Его путями и соблюдать Его заповеди, установления и законы[a], — и ты будешь жить и умножишься, и Яхве, твой Бог, благословит тебя[b] в земле, в которую ты входишь, чтобы овладеть ею[c].
  rationale: Перевод исправлен минимально. «Ибо» передаёт контекстуальную связку אֲשֶׁר в самостоятельном русском стихе; «Тогда» удалено, чтобы не сужать значение глагольной последовательности. Конструкция «в земле, в которую ты входишь» яснее выражает движение в землю. Сноска b перенесена к благословению, которое входит в охватываемую ею последовательность.
