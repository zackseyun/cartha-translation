base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: ru
  text: Ибо я сегодня повелеваю тебе любить Яхве, твоего Бога, ходить Его путями и соблюдать Его заповеди, установления и законы[a], — и ты будешь жить и умножишься, и Яхве, твой Бог, благословит тебя[b] в земле, в которую ты входишь, чтобы овладеть ею[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «судебные постановления». Еврейское מִשְׁפָּטָיו может обозначать законы, правовые решения или постановления.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейскую последовательность можно также понять как выражение цели или следствия: «чтобы ты жил и умножался и чтобы Яхве, твой Бог, благословил тебя».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «чтобы унаследовать её». В контексте обетованной земли לְרִשְׁתָּהּ может подчёркивать получение земли во владение как наследия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: Я сегодня повелеваю тебе
  rationale: Начальное אֲשֶׁר связывает стих с предшествующей мыслью и вводит содержание повеления. В самостоятельной подаче стиха естественный русский порядок передаёт эту связь без тяжеловесного начального «которое».
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: любить Яхве, твоего Бога
  rationale: Инфинитив передаёт содержание повеления; личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: ходить Его путями
  rationale: Сохранена древнееврейская метафора образа жизни; выражение понятно и укоренено в литературном русском языке.
- source_word: לִשְׁמֹר
  choice: соблюдать
  rationale: В контексте завета и закона «соблюдать» естественно выражает не только хранение, но и исполнение.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: Его заповеди, установления и законы
  rationale: Три правовых термина разграничены по-русски. מִשְׁפָּטִים здесь передано как «законы»; возможное «судебные постановления» отмечено в сноске.
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: Тогда ты будешь жить и умножишься
  rationale: Последовательность форм после повеления естественно прочитана как обещанный результат. «Умножишься» сохраняет идею численного возрастания народа в лице единственного адресата.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: в той земле, куда ты входишь
  rationale: Направительное שָׁמָּה передано русским «куда», что сохраняет значение «туда» без неестественного повтора.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: Глагол ירשׁ означает вступить во владение; местоименный суффикс женского рода явно соотнесён с землёй.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно транслитерировано, а не заменено традиционным титулом.
- issue: Связь послушания с жизнью и благословением
  choice: 'обещанный результат: «Тогда ты будешь жить… и… благословит»'
  alternative: 'цель или следствие: «чтобы ты жил… и чтобы… благословил»'
  rationale: Еврейская глагольная последовательность допускает как результативно-обещательный, так и целевой оттенок; основной текст выбирает естественное для русского обещание, а альтернативу сохраняет в сноске.
translation_notes:
  register: Современный литературный русский с достоинством заветно-правовой речи. Сохранены метафора «ходить Его путями», личное имя Яхве и обращение к Израилю в единственном числе; синтаксис сделан естественным для самостоятельного чтения стиха.
