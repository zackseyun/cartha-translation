base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: ru
  text: И ты вернёшься[a], и будешь слушаться голоса Яхве[b], и исполнишь все его заповеди, которые я заповедую тебе сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратишься»; в данном контексте слово может также означать возвращение к завету и покаяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будешь слушать голос Яхве»; этот еврейский оборот обычно подразумевает послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָשׁוּב
  choice: вернёшься
  rationale: Глагол שׁוב означает «вернуться, обратиться назад». «Вернёшься» сохраняет возможные оттенки возвращения к завету, покаяния и восстановления, не сводя смысл только к одному из них.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: будешь слушаться голоса Яхве
  rationale: Оборот שמע בקול буквально связан со слушанием голоса, но в контексте Второзакония обычно предполагает послушание. Русское «слушаться голоса» передаёт оба компонента выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: וְעָשִׂיתָ
  choice: исполнишь
  rationale: При объекте «заповеди» русское «исполнишь» естественно передаёт עשׂה — «сделать, исполнить» — и сохраняет практический характер требуемого действия.
- source_word: כָּל מִצְוֺתָיו
  choice: все его заповеди
  rationale: Сохранены полнота, выраженная כָּל, юридико-заветный оттенок слова מִצְוָה и местоименный суффикс третьего лица.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я заповедую тебе сегодня
  rationale: Настоящее время «заповедую» передаёт непосредственный характер причастной формы, а «сегодня» сохраняет важный для Второзакония акцент на нынешней обязательности повеления.
- source_word: וְאַתָּה
  choice: И ты
  rationale: Явно выраженное местоимение сохранено для смыслового ударения; союз передан без навязывания противительного или временного значения.
theological_decisions:
- issue: Следует ли передавать שׁוב как прямое указание на покаяние
  choice: вернёшься
  alternative: обратишься; покаешься
  rationale: В контексте восстановления слово может подразумевать заветное обращение и покаяние, но еврейская форма не требует ограничивать его смысл только покаянием. «Вернёшься» сохраняет богословскую многозначность.
- issue: Следует ли свести שמע בקול к одному значению «повиноваться»
  choice: будешь слушаться голоса Яхве
  alternative: будешь повиноваться Яхве; будешь слушать голос Яхве
  rationale: Выбранный оборот сохраняет образ голоса и одновременно естественно выражает послушание. Следующая часть стиха отдельно говорит об исполнении заповедей, поэтому два связанных выражения не сливаются полностью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Устаревшие формы вроде «глас» и тяжеловесные канцелярские обороты не используются. Повтор союзов сохраняет последовательный ритм еврейского текста.
