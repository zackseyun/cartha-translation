  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: ru
  text: И когда постигнет тебя всё это — благословение и проклятие, которые Я положил перед тобой, — и ты вспомнишь обо всём этом[a] среди всех народов, куда изгнал тебя Яхве, твой Бог,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвратишь это к своему сердцу»; также возможно: «примешь это к сердцу».'
    reason: Сноска сохраняет буквальный образ еврейского выражения и отмечает возможный вариант, тогда как основной текст передаёт его контекстуальный смысл припоминания и осмысления.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Оборот вводит будущее обстоятельство; «и когда» естественно передаёт временное значение и сохраняет связь с предшествующим контекстом.
- source_word: יָבֹאוּ עָלֶיךָ כָּל הַדְּבָרִים הָאֵלֶּה
  choice: постигнет тебя всё это
  rationale: Буквально сказано, что «все эти вещи/события придут на тебя». Русское «постигнет тебя всё это» естественно выражает наступление перечисленных заветных последствий.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: благословение и проклятие
  rationale: Переданы противопоставленные последствия завета стандартными и ясными русскими терминами.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: которые я предложил тебе
  rationale: Идиома буквально означает «дал/положил перед тобой»; «предложил тебе» передаёт представление благословения и проклятия на выбор, не утяжеляя фразу.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: и ты примешь это к сердцу
  rationale: Выражение буквально описывает возвращение сказанного к сердцу, то есть осознанное припоминание и внутреннее принятие. Русская идиома сохраняет образ сердца и подходит контексту размышления в изгнании.
- source_word: בְּכָל הַגּוֹיִם
  choice: среди всех народов
  rationale: «Среди» ясно передаёт пребывание Израиля в рассеянии внутри чужих народов.
- source_word: הִדִּיחֲךָ
  choice: изгнал тебя
  rationale: Глагол обозначает принудительное удаление или изгнание; выбранный вариант сохраняет силу действия и контекст заветного наказания.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Личное имя יהוה передано формой «Яхве», а приложение отделено запятой согласно нормам современного русского языка.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное заветное имя Бога; транслитерация «Яхве» делает это явным, не подменяя имя титулом.
- issue: Смысл וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: примешь это к сердцу
  alternative: вспомнишь об этом / возвратишь это в своё сердце
  rationale: Основной текст сохраняет внутренний, сердечный аспект выражения, но не сводит его только к памяти или только к покаянию; буквальный образ отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Синтаксис сохраняет незавершённость условно-временного периода, который продолжается в следующем стихе; поэтому стих оканчивается запятой.
