  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: ru
  text: И Яхве, твой Бог, возложит все эти проклятия[a] на твоих врагов и на ненавидящих тебя, которые преследовали тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все эти клятвы». Во Второзаконии это слово обычно обозначает проклятия, то есть кары за нарушение завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: возложит
  rationale: Глагол נתן имеет широкий диапазон значений («дать», «положить», «возложить»). В сочетании с проклятиями и предлогом עַל форма «возложит… на» естественно передаёт их обращение на указанных людей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Конструкция с суффиксом второго лица мужского рода единственного числа имеет прямое притяжательное значение.
- source_word: כָּל הָאָלוֹת הָאֵלֶּה
  choice: все эти проклятия
  rationale: В контексте Второзакония אָלָה обозначает предусмотренные заветом проклятия или кары, хотя слово может также относиться к клятве; альтернативное значение отмечено в сноске.
- source_word: אֹיְבֶיךָ
  choice: твоих врагов
  rationale: Прямой и естественный русский эквивалент формы множественного числа с притяжательным суффиксом.
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: и на тех, кто ненавидит тебя
  rationale: Относительная конструкция естественно передаёт субстантивированное причастие и сохраняет его значение без тяжеловесного «ненавидящих тебя».
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: и преследовал тебя
  rationale: רדף допускает значения «преследовать», «гнаться», «подвергать гонениям». Нейтральное «преследовал» сохраняет широту исходного значения; прошедшее время отражает перфектную форму.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет имя, не подменяя его титулом.
- issue: Значение אָלוֹת в контексте завета
  choice: проклятия
  alternative: клятвы
  rationale: Ближайший контекст говорит о карах за нарушение завета, поэтому контекстуальное значение «проклятия» вынесено в основной текст, а более широкая лексическая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к древнееврейскому, но относительная конструкция делает фразу естественной и понятной.
