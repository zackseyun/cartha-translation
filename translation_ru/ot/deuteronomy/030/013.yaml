base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: ru
  text: 'Она не за морем[a], так что тебе не придётся сказать: «Кто перейдёт для нас на ту сторону моря, добудет её для нас[b] и сделает так, чтобы мы её услышали[c], чтобы мы исполнили её?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по другую сторону моря».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возьмёт её для нас»; по смыслу — добудет её для нас.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сделает так, чтобы мы услышали её»; то есть объявит или разъяснит её нам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: за морем
  rationale: Выражение указывает на место по другую сторону моря. «За морем» естественно по-русски и сохраняет пространственный образ; возможное более явное прочтение дано в сноске.
- source_word: הִוא
  choice: она
  rationale: Местоимение женского рода отсылает к «заповеди» (הַמִּצְוָה) из ближайшего контекста; русский женский род позволяет сохранить эту связь.
- source_word: לֵאמֹר
  choice: чтобы ты сказал
  rationale: Инфинитив вводит содержание предполагаемого возражения; конструкция с «чтобы» естественно передаёт риторический смысл.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: перейдёт для нас на ту сторону моря
  rationale: Перевод сохраняет и значение перехода, и явно названную цель движения — другую сторону моря.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: принесёт её нам
  rationale: Буквально глагол означает «возьмёт», но здесь речь идёт о том, чтобы добыть заповедь на той стороне моря и доставить её народу; «принесёт» ясно передаёт этот контекстуальный смысл.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: даст нам услышать её
  rationale: Каузативная форма глагола שׁמע буквально означает «сделает так, чтобы мы услышали»; выбранная формулировка сохраняет эту особенность без излишне тяжеловесной буквальности.
- source_word: וְנַעֲשֶׂנָּה
  choice: чтобы мы исполнили её
  rationale: «Исполнить» естественно сочетается с заповедью, а придаточное цели передаёт связь между услышанным повелением и его выполнением.
