base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: ru
  text: 'Смотри: сегодня я поставил[a] перед тобой жизнь и добро, смерть и зло[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положил» или «дал».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «бедствие», «несчастье» или «вред»; здесь оно прямо противопоставлено добру.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Смотри
  rationale: Повелительная форма глагола ראה служит прямым призывом обратить внимание. «Смотри» естественно для современного русского языка и сохраняет силу обращения без архаизации.
- source_word: נָתַתִּי
  choice: я поставил
  rationale: נתן имеет значения «дать», «положить», «поставить». В сочетании с לְפָנֶיךָ выражение означает, что говорящий поставил перед адресатом две возможности; «поставил перед тобой» сохраняет образ и не вводит отсутствующего в тексте глагола «выбирать».
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Буквально и идиоматически передаёт представление о предложенных человеку возможностях.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой современный эквивалент временного наречия.
- source_word: הַחַיִּים
  choice: жизнь
  rationale: Хотя форма слова морфологически множественная, חַיִּים обычно обозначает жизнь как единое абстрактное понятие.
- source_word: הַטּוֹב
  choice: добро
  rationale: Сохраняет широкое значение טוֹב и параллельное противопоставление доброго злому, не сужая смысл до благополучия.
- source_word: הַמָּוֶת
  choice: смерть
  rationale: Прямой эквивалент существительного, противопоставленного жизни.
- source_word: הָרָע
  choice: зло
  rationale: רַע может обозначать как нравственное зло, так и бедствие или вред. «Зло» сохраняет широкий и резкий контраст с «добром», не сводя смысл только к несчастью.
theological_decisions:
- issue: Смысл הָרָע в заветном противопоставлении
  choice: зло
  alternative: бедствие; несчастье; вред
  rationale: В стихе сопоставлены жизнь и добро со смертью и злом. «Зло» сохраняет нравственную и заветную напряжённость противопоставления, а примечание оставляет открытым присущий еврейскому слову оттенок пагубных последствий.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Сохранены две параллельные пары — «жизнь и добро, смерть и зло» — и единственное число обращения. Местоимение «я» написано со строчной буквы, поскольку в непосредственном контексте говорит Моисей.
