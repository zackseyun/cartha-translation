  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: ru
  text: 'Сегодня я объявляю вам: вы непременно погибнете[a]; вы не продлите своих дней[b] на земле, куда ты переходишь через Иордан, чтобы войти туда и овладеть ею.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «погибая, погибнете». В еврейском языке такой оборот выражает усиление: «непременно погибнете».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вы недолго проживёте на этой земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: я объявляю
  rationale: Хифиль глагола נגד означает «дать знать, объявить». Настоящее время по-русски естественно передаёт совершаемое в этот день торжественное провозглашение.
- source_word: לָכֶם
  choice: вам
  rationale: Сохранено множественное число обращения, явно выраженное в еврейском тексте.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и точный эквивалент временного указания, сохраняющий непосредственность заветного предостережения.
- source_word: כִּי
  choice: двоеточие после «объявляю вам»
  rationale: Частица вводит содержание объявления; в естественном русском синтаксисе это содержание ясно и точно вводится двоеточием без обязательного союза «что».
- source_word: אָבֹד תֹּאבֵדוּן
  choice: вы непременно погибнете
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает категоричность предсказания. «Непременно» передаёт это усиление без неестественного повтора.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: вы не продлите своих дней
  rationale: Сохранён образ буквального «удлинения дней», важный для языка благословений и предостережений Второзакония; местоимение «своих» делает оборот естественным по-русски.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: В данном контексте אֲדָמָה обозначает обещанную территорию, а не почву как вещество.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן
  choice: куда ты идёшь через Иордан
  rationale: Формулировка естественно передаёт движение за Иордан к земле и сохраняет резкий переход еврейского текста от множественного обращения к собирательному единственному.
- source_word: לָבֹא שָׁמָּה
  choice: чтобы войти туда
  rationale: Сохранены и значение движения внутрь у בוא, и прямо выраженное наречие שָׁמָּה «туда».
- source_word: לְרִשְׁתָּהּ
  choice: и овладеть ею
  rationale: Глагол ירש в контексте земли означает вступить во владение; женское местоимение «ею» передаёт суффикс третьего лица женского рода, относящийся к земле.
theological_decisions:
- issue: Смена множественного обращения на собирательное единственное
  choice: Сохранить «вам / вы», а затем «ты»
  alternative: Всюду употребить множественное число «вы»
  rationale: Еврейский текст сначала обращается к слушателям во множественном числе, но затем говорит об Израиле как об одном заветном народе в единственном числе. Сохранение смены числа передаёт риторику источника и не устраняет её богословски значимую напряжённость.
- issue: Заветное обозначение земли
  choice: Перевести הָאֲדָמָה как «земля»
  alternative: «почва» или «край»
  rationale: Речь идёт о территории за Иорданом, которой Израиль должен овладеть; «земля» сохраняет связь с обещанием земли и последующим предостережением о её утрате.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Сохранены заветный оборот «продлить дни», эмфатическая сила предупреждения, наречие «туда», местоименный суффикс «ею» и намеренная смена числа обращения.
