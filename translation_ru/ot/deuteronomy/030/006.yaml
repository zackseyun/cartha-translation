source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: ru
  text: И Яхве, твой Бог, обрежет[b] твоё сердце и сердце твоих потомков[a], чтобы ты любил Яхве, твоего Бога, всем сердцем и всей душой[c], чтобы ты жил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сердце твоего потомства».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обрежет твоё сердце» — образ внутреннего преобразования и верности завету.'
    reason: cultural_note
  - marker: c
    text: 'Или: «всей жизнью», «всем существом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: обрежет
  rationale: Глагол מול буквально означает совершение обрезания. При слове «сердце» он употреблён метафорически, однако важный для контекста образ знака завета сохранён, а не заменён толкованием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой в современном русском языке транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог / твоего Бога
  rationale: Форма с суффиксом второго лица мужского рода единственного числа передаёт обращение к Израилю как к одному собеседнику.
- source_word: לְבָבְךָ
  choice: твоё сердце
  rationale: В данном контексте לֵבָב обозначает внутреннего человека — его волю и привязанности; русское «сердце» сохраняет и образ, и широту значения.
- source_word: לְבַב זַרְעֶךָ
  choice: сердце твоих потомков
  rationale: זֶרַע — собирательное обозначение потомства. Формулировка сохраняет единственное число слова «сердце» и естественно передаёт коллективный смысл זֶרַע.
- source_word: לְאַהֲבָה
  choice: чтобы ты любил
  rationale: Инфинитив с ל здесь выражает цель или результат; союз «чтобы» сохраняет эту смысловую связь.
- source_word: בְּכָל לְבָבְךָ
  choice: всем сердцем
  rationale: Естественная русская формула, точно выражающая полноту преданности.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: и всей душой
  rationale: נֶפֶשׁ может обозначать душу, жизнь или всего человека. «Всей душой» естественно сочетается с «всем сердцем» и не устраняет более широкий смысл, отмеченный в сноске.
- source_word: לְמַעַן חַיֶּיךָ
  choice: чтобы ты жил
  rationale: לְמַעַן выражает цель или результат. Русская конструкция передаёт смысл идиоматично и оставляет открытой связь жизни как цели и следствия описанного действия.
theological_decisions:
- issue: Метафора обрезания сердца
  choice: Сохранено буквальное метафорическое выражение «обрежет твоё сердце».
  alternative: «изменит твоё сердце» или «очистит твоё сердце»
  rationale: Исходный текст связывает внутреннее преобразование с телесным знаком завета. Замена метафоры толкованием ослабила бы эту связь и сузила смысл.
- issue: Значение נֶפֶשׁ в формуле любви к Богу
  choice: В основном тексте употреблено «душой».
  alternative: «всей жизнью» или «всем существом»
  rationale: Слово может относиться ко всему живому человеку, а не только к отдельной нематериальной части. Традиционная и естественная русская формула сохранена, при этом смысловая широта указана в сноске.
- issue: Связь заключительного לְמַעַן с предшествующим высказыванием
  choice: Передано отдельной целевой конструкцией «чтобы ты жил».
  alternative: «и тогда ты будешь жить» или «ради твоей жизни»
  rationale: Так сохраняется возможный оттенок цели и результата без жёсткого сведения фразы только к причинно-следственному итогу.
translation_notes:
  register: Современный литературный русский язык с ясной, торжественной синтаксической структурой. Обращение во втором лице единственного числа сохранено. Имя Яхве передано прямо; ключевая метафора исходного текста не сглажена.
