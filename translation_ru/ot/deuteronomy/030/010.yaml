  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: ru
  text: если будешь слушаться голоса Яхве, твоего Бога,[a] соблюдая его заповеди и установления, записанные в этой книге Закона, и если вернёшься к Яхве, твоему Богу,[b] всем своим сердцем и всей своей душой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушать голос Яхве»; это выражение означает внимать его словам и повиноваться им.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обратишься к Яхве, твоему Богу»; также возможно по смыслу: «покаешься и обратишься к Яхве, твоему Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: если
  rationale: В данном контексте частица вводит условие исполнения предшествующего обещания; условное «если» лучше передаёт синтаксис и ход мысли, чем причинное «ибо».
- source_word: תִשְׁמַע בְּקוֹל
  choice: будешь слушаться голоса
  rationale: Оборот означает не просто услышать, а внимать сказанному и повиноваться; русский оборот сохраняет образ голоса и передаёт значение послушания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לִשְׁמֹר
  choice: соблюдая
  rationale: Инфинитив поясняет, в чём выражается послушание голосу Бога; деепричастие естественно передаёт эту смысловую связь по-русски.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: его заповеди и установления
  rationale: «Заповеди» сохраняет общеупотребительный библейский термин, а «установления» отличает חֻקִּים как предписанные нормы.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: в этой книге Закона
  rationale: Так естественно передаётся название заветного документа; «книга» понятно современному читателю, а «Закон» здесь обозначает Тору.
- source_word: כִּי תָשׁוּב
  choice: и если обратишься
  rationale: Повторное כִּי вводит параллельное условие. «Обратишься» сохраняет направленность движения к Богу и покаянно-заветный оттенок שׁוּב, не сводя его к отвлечённому термину «покаешься».
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: всем своим сердцем и всей своей душой
  rationale: Устойчивое и понятное русское выражение передаёт полноту внутренней преданности, выраженную повтором בְּכָל.
theological_decisions:
- issue: Передача заветного שׁוּב в контексте покаяния
  choice: обратишься
  alternative: вернёшься; повернёшься вновь; покаешься
  rationale: «Обратишься к» естественно по-русски передаёт поворот к Богу и сохраняет покаянный смысл, не устраняя образ движения и не заменяя его исключительно богословским термином.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт личное имя в исходном тексте и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образ «голоса», личное имя Яхве, условный параллелизм двух כִּי и смысловая напряжённость глагола שׁוּב. Местоимение «его» дано со строчной буквы по нормам нейтрального современного издания.
