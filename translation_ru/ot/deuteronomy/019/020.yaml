base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: ru
  text: А остальные услышат, устрашатся и больше не станут совершать среди вас[a] такого злого дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди тебя»; Израиль представлен как единое целое.'
    reason: Передаёт единственное число еврейского местоименного суффикса при естественном русском основном тексте.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: остальные
  rationale: Субстантивированное причастие нифаля от שׁאר обозначает прочих членов сообщества, остающихся после судебного наказания; «остальные» естественно и точно в данном контексте.
- source_word: יִשְׁמְעוּ
  choice: услышат
  rationale: Сохранено основное значение שמע. Контекст подразумевает, что люди узнают о случившемся, но это не добавлено в текст явно.
- source_word: וְיִרָאוּ
  choice: и устрашатся
  rationale: Глагол ירא здесь передаёт страх, вызванный наказанием и удерживающий от подобного преступления; «устрашатся» сохраняет краткость и возвышенный юридический тон.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: и больше не станут совершать
  rationale: Конструкция יסף с инфинитивом и עוֹד означает прекращение повторения действия. Русская формулировка естественно передаёт значение «впредь не делать снова», избегая буквального и неестественного «не прибавят делать».
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: подобного злого дела
  rationale: Предлог כ выражает уподобление, а דָּבָר в контексте означает поступок или дело. Перевод сохраняет смысл «злого дела такого рода», не сводя его к отвлечённой «вещи».
- source_word: בְּקִרְבֶּךָ
  choice: среди вас
  rationale: Устойчивое выражение означает внутри сообщества Израиля. По-русски «среди вас» естественно передаёт корпоративный смысл; единственное число еврейского суффикса невозможно сохранить без неестественной конструкции и поясняется в сноске.
theological_decisions:
- issue: Число и адресат в בְּקִרְבֶּךָ
  choice: среди вас с примечанием о корпоративном единственном числе
  alternative: в твоей среде / посреди тебя
  rationale: Еврейский текст обращается к Израилю как к единому целому во втором лице мужского рода единственного числа. Естественное русское «среди вас» передаёт обращение ко всему народу, а сноска сохраняет грамматическую и богословски значимую особенность оригинала, не навязывая её толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис остаётся близким к последовательности еврейского текста, но формулировка «больше не станут совершать» употреблена ради естественности. Единственная сноска отмечена в основном тексте.
