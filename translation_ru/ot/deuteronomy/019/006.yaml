  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: ru
  text: иначе мститель за кровь может погнаться за человеком, лишившим жизни другого, в горячке гнева[a], настичь его, потому что путь далёк, и убить его, хотя тот не подлежит смертной казни, ведь прежде[b] он не питал к нему ненависти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо его сердце стало горячим»; это еврейский образ разгоревшегося гнева.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «со вчерашнего и третьего дня»; еврейское выражение со значением «прежде», «ранее».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: чтобы… не
  rationale: Естественно передаёт предупредительно-целевое значение частицы в связи с устройством городов-убежищ.
- source_word: גֹּאֵל הַדָּם
  choice: мститель за кровь
  rationale: Сохраняет устойчивое библейское обозначение родственника, исполняющего роль кровного мстителя.
- source_word: הָרֹצֵחַ
  choice: убивший
  rationale: В данном контексте речь идёт о человеке, лишившем другого жизни без прежней вражды; слово «убийца» в современном русском может ошибочно подразумевать умышленное убийство.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: когда разгорится его сердце
  rationale: Сохраняет образ нагревшегося сердца и передаёт вспыхнувший гнев; союз в контексте естественно выражает обстоятельство возможной погони.
- source_word: וְהִשִּׂיגוֹ
  choice: и не настиг его
  rationale: Точно и естественно передаёт достижение преследуемого в ходе погони.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: из-за того, что путь далёк
  rationale: Передаёт буквальный образ большой протяжённости пути современным русским выражением.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: и не убил его
  rationale: Еврейское выражение означает нанесение смертельного удара; в русском «убил» ясно передаёт результат без неестественной кальки.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: хотя тот не подлежит смертной казни
  rationale: 'Сохраняет юридический смысл: у непреднамеренно убившего нет законного основания для смертного приговора.'
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: ведь прежде он не питал к погибшему ненависти
  rationale: Передаёт правовое основание отсутствия смертной вины — не было предшествующей вражды; «к погибшему» ясно различает участников.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: прежде
  rationale: Естественно передаёт еврейскую идиому прежнего времени; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Правовой статус непреднамеренно убившего
  choice: не подлежит смертной казни
  alternative: не заслуживает смерти
  rationale: Выбрана юридическая формулировка, поскольку מִשְׁפַּט указывает на правовой приговор или основание, а не только на нравственную оценку.
translation_notes:
  register: Современный литературный русский с достоинством юридико-повествовательной речи. Сохранён образ сердца, охваченного жаром гнева; двусмысленность слова «убийца» устранена контекстуальным «убивший», чтобы не приписывать умысел.
