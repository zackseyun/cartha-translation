base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: ru
  text: Но если кто ненавидит своего ближнего, подстережёт его, нападёт на него и нанесёт ему удар[a], так что тот умрёт, а затем убежит в один из этих городов,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, стоящее после «ударит», буквально означает «жизнь; душа». В этом выражении оно указывает на смертельное поражение. Возможный перевод: «поразит его насмерть».'
    reason: Лексическая особенность еврейского выражения וְהִכָּהוּ נֶפֶשׁ и допустимый вариант перевода.
lexical_decisions:
- source_word: וְכִי
  choice: Но если
  rationale: Оборот вводит условный случай, противопоставленный предшествующему постановлению о непреднамеренном убийстве.
- source_word: יִהְיֶה אִישׁ שֹׂנֵא לְרֵעֵהוּ
  choice: кто ненавидит своего ближнего
  rationale: Естественная для современного русского юридического изложения условная конструкция; «ближний» передаёт רֵעַ как другого члена сообщества, не подразумевая близкой дружбы.
- source_word: וְאָרַב לוֹ
  choice: подстережёт его
  rationale: Глагол выражает намеренное ожидание жертвы для нападения и тем самым сохраняет указание на умысел.
- source_word: וְקָם עָלָיו
  choice: нападёт на него
  rationale: Еврейская идиома буквально означает «встанет против него», но в данном контексте обозначает враждебное нападение; буквальное «восстанет» по-русски было бы неестественно и могло бы ввести в заблуждение.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: нанесёт ему смертельный удар, так что тот умрёт
  rationale: נֶפֶשׁ при глаголе «ударить» образует выражение о поражении, лишающем жизни; отдельное וָמֵת сохраняется в явном указании на смерть и проясняет, что умирает жертва.
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: а затем убежит в один из этих городов
  rationale: «Эти города» — упомянутые в ближайшем контексте города-убежища; «а затем» естественно передаёт последовательность действий и смену подразумеваемого субъекта после смерти жертвы.
theological_decisions:
- issue: Разграничение умышленного убийства и непреднамеренного причинения смерти
  choice: 'Сохранена последовательность признаков умысла: ненависть, подстерегание, нападение и смертельный удар.'
  alternative: Свести всю последовательность к одному глаголу «убьёт».
  rationale: Исходный текст юридически характеризует умышленное убийство через ряд действий; их сохранение не привносит конфессионального толкования и поддерживает противопоставление предшествующему случаю случайного убийства.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью юридического постановления. Синтаксис сохраняет условное придаточное, продолжающееся в следующем стихе; поэтому стих оканчивается запятой. Местоимение «тот» устраняет возможную неясность относительно того, кто умирает.
