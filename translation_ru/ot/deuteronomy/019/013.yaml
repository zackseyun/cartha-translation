base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: ru
  text: Не щади его[a], но очисти Израиль от невинной крови[b], и тогда тебе будет хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть твой глаз не жалеет его». В еврейском обороте глаз представлен как средоточие жалости; возможный перевод: «Не жалей его».'
    reason: lexical_alternative
  - marker: b
    text: То есть удали из общины Израиля вину, возникшую из-за пролития невинной крови.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: Не щади его
  rationale: Еврейский оборот буквально упоминает глаз как средоточие жалости, однако буквальная калька по-русски звучала бы неестественно. «Не щади» передаёт и сострадание, и отказ освободить виновного от назначенного законом наказания; образ глаза отмечен в сноске.
- source_word: וּבִעַרְתָּ
  choice: но очисти
  rationale: В законодательной речи Второзакония глагол обозначает устранение оскверняющего зло или вины из общины, а не буквальное сожжение. Союз «но» естественно подчёркивает противопоставление жалости и исполнения правосудия.
- source_word: דַם הַנָּקִי
  choice: невинной крови
  rationale: 'Сохранён ёмкий древнееврейский правовой образ: выражение может указывать как на кровь невинного, так и на возникшую из-за её пролития кровную вину. Пояснение вынесено в сноску, чтобы не устранять эту смысловую напряжённость в основном тексте.'
- source_word: מִיִּשְׂרָאֵל
  choice: Израиль от
  rationale: Русская конструкция «очистить Израиль от» естественно передаёт удаление чего-либо из среды народа, выраженное предлогом מן.
- source_word: וְטוֹב לָךְ
  choice: и тогда тебе будет хорошо
  rationale: Передана характерная для Второзакония формула благого результата послушания. «Тогда» ясно выражает следствие, подразумеваемое последовательностью повелений.
theological_decisions:
- issue: Характер повеления не щадить убийцу
  choice: Сохранить форму обращения к Израилю в контексте законного суда, не добавляя в стих призыва к личной мести.
  alternative: Понять слова как разрешение на частное возмездие.
  rationale: Ближайший контекст, Втор 19:11–12, говорит о передаче умышленного убийцы старейшинами для исполнения судебного приговора. Поэтому стих относится к общественному правосудию, хотя это пояснение не вносится в основной текст.
- issue: Смысл устранения «невинной крови»
  choice: Сохранить образ «очистить Израиль от невинной крови», а значение общинной кровной вины пояснить в сноске.
  alternative: Раскрыть выражение непосредственно в тексте как «снять с Израиля вину за пролитие невинной крови».
  rationale: Развёрнутый вариант понятнее, но однозначно заменяет исходную метонимию толкованием. Сохранение образа точнее передаёт юридико-богословскую ёмкость еврейского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Устранена неестественная буквальная калька образа глаза, но сам образ сохранён в сноске. Краткие повелительные формы поддерживают строгость контекста без избыточной архаизации.
