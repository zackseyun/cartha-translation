source:
  edition: WLC
  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: ru
  text: И если Яхве, твой Бог, расширит твои пределы, как Он поклялся твоим отцам[a], и даст тебе всю землю, которую обещал дать твоим отцам,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предкам» — здесь и далее в этом стихе. Буквально: «отцам»; имеются в виду праотцы Израиля.'
    reason: Лексическая альтернатива поясняет широкий родовой смысл אבות, не устраняя буквальную формулировку основного текста.
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет условный характер и связь с предшествующим законодательным наставлением.
- source_word: יַרְחִיב ... אֶת־גְּבֻלְךָ
  choice: расширит твои пределы
  rationale: Глагол в породе hифиль означает «сделает шире, расширит»; «пределы» естественно передаёт расширение подвластной территории и сохраняет образ границы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Точно передаёт существительное с суффиксом второго лица мужского рода единственного числа.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: как Он поклялся
  rationale: Сохраняет прямое указание на клятву и естественно звучит по-русски.
- source_word: לַאֲבֹתֶיךָ
  choice: твоим отцам
  rationale: Буквально сохраняет мужское родовое обозначение, относящееся здесь к праотцам Израиля.
- source_word: וְנָתַן לְךָ
  choice: и даст тебе
  rationale: Перфект с союзом продолжает условную конструкцию с будущей направленностью; русское будущее время ясно передаёт этот смысл.
- source_word: כָּל־הָאָרֶץ
  choice: всю землю
  rationale: В контексте обозначает всю обещанную Израилю землю, а не мир или земной шар.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: которую обещал дать
  rationale: Буквально глагол означает «говорил», но в контексте данного Богом обязательства «обещал» точно и естественно передаёт его силу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Основной текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Передача אבות
  choice: отцам
  alternative: предкам; праотцам
  rationale: «Отцам» формально соответствует еврейскому выражению и сохраняет патриархальную лексику заветного контекста; возможный более широкий смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Единственное число «твой/тебе» сохранено по еврейскому тексту как обращение к Израилю. Стих оставлен синтаксически незавершённым и заканчивается запятой, поскольку условная конструкция продолжается в следующем стихе.
