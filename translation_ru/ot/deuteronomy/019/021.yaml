  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: ru
  text: 'И пусть твой глаз не знает пощады[a]: жизнь за жизнь[b], глаз за глаз, зуб за зуб, рука за руку, нога за ногу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не щадит» или «не проявляет сострадания».'
    reason: lexical_alternative
  - marker: b
    text: 'В древнееврейском тексте: נֶפֶשׁ; здесь это слово означает «жизнь», а не «душу» в позднейшем богословском смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: не щадит
  rationale: Глагол חוס может означать «щадить», «жалеть», «проявлять сострадание». В судебно-правовом контексте «не щадит» естественно передаёт строгость предписания и сочетается с сохранённым образом глаза.
- source_word: עֵינֶךָ
  choice: твой глаз
  rationale: Сохранён конкретный древнееврейский образ, в котором глаз выступает субъектом жалости или пощады; замена на простое «ты» устранила бы выразительность оригинала.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В формуле נֶפֶשׁ בְּנֶפֶשׁ слово обозначает жизнь, а не «душу» в позднейшем метафизическом смысле.
- source_word: בְּ
  choice: за
  rationale: Предлог выражает здесь соответствие или воздаяние. Русское «за» кратко и естественно передаёт устойчивую правовую формулу.
- source_word: עַיִן
  choice: глаз
  rationale: Прямое обозначение части тела в формуле соразмерного воздаяния.
- source_word: שֵׁן
  choice: зуб
  rationale: Точное и естественное соответствие древнееврейскому названию части тела.
- source_word: יָד
  choice: рука
  rationale: Точное соответствие יָד в данном перечне телесных повреждений.
- source_word: רֶגֶל
  choice: нога
  rationale: В русском языке «нога за ногу» естественнее и шире соответствует רֶגֶל, чем более узкое «ступня».
theological_decisions:
- issue: Сохранить ли конкретную формулу воздаяния или заменить её обобщённым принципом соразмерного наказания
  choice: 'Сохранена формула: «жизнь за жизнь, глаз за глаз, зуб за зуб, рука за руку, нога за ногу».'
  alternative: 'Передать обобщённо: «наказание должно соответствовать преступлению».'
  rationale: Оригинал использует конкретную устойчивую судебную формулу. Обобщающий пересказ ослабил бы её риторику, правовую строгость и связь с другими местами Торы.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства правового предписания и конкретного образа «твой глаз». Конструкция «пусть… не щадит» передаёт предписывающую силу древнееврейской формы без излишней архаизации.
