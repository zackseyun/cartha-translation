source:
  edition: WLC
  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: ru
  text: Когда Яхве, твой Бог, истребит[a] народы, землю которых Яхве, твой Бог, отдаёт тебе, и ты лишишь их земли и поселишься в их городах и домах,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отсечёт»; также возможно: «устранит».'
    reason: Лексическая альтернатива для יַכְרִית, сохраняющая конкретный образ еврейского выражения.
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном законодательном контексте союз вводит ожидаемое будущее обстоятельство, после которого следуют предписания; «когда» естественно передаёт временное значение.
- source_word: יַכְרִית
  choice: истребит
  rationale: Порода хифиль глагола כרת означает устранение народов; «истребит» ясно и естественно передаёт смысл, тогда как буквальное «отсечёт» в современном русском здесь звучит неестественно. Возможные оттенки отмечены в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Точно передаёт форму с суффиксом второго лица единственного числа мужского рода.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Обычное и контекстуально точное соответствие; не привносит более поздних значений слова «язычники».
- source_word: נֹתֵן לְךָ
  choice: отдаёт тебе
  rationale: Причастная форма изображает дарование земли как совершающееся и несомненное. «Отдаёт» естественно сочетается с землёй как владением и сохраняет значение божественного дара.
- source_word: וִירִשְׁתָּם
  choice: лишишь их владений
  rationale: При личном дополнении глагол ירש означает вытеснить народы из их владений, а не «унаследовать их». Формулировка сохраняет направленность действия на народы.
- source_word: וְיָשַׁבְתָּ
  choice: поселишься
  rationale: В контексте овладения землёй глагол означает обосноваться и жить там; «поселишься» передаёт это естественно и точно.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: в их городах и домах
  rationale: Сохраняет оба местоименных суффикса и показывает, что речь идёт о городах и домах прежних жителей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога. «Яхве» передаёт тетраграмматон как имя, не заменяя его титулом; «Иегова» основано на более поздней гибридной форме.
- issue: Характер устранения народов
  choice: истребит
  alternative: отсечёт; устранит
  rationale: Выбор передаёт сильное значение хифиля כרת, но не уточняет сверх текста способ или полноту действия; буквальная образность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified законодательным звучанием. Синтаксис сохраняет незавершённую условно-временную конструкцию стиха, которая продолжается в следующем стихе; обращение остаётся во втором лице единственного числа.
