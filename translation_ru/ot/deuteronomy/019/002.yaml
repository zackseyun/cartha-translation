  source_fidelity: 'Смысл в целом передан верно: повеление, число городов, расположение в пределах земли, имя Яхве, дарование земли и цель овладения ею сохранены. Однако «среди своей земли» в современном русском обычно описывает расположение среди объектов или людей и менее точно передаёт בְּתוֹךְ применительно к территории; «в пределах своей земли» естественнее и точнее. Кроме того, «во владение» несколько ослабляет целевую конструкцию לְרִשְׁתָּהּ («чтобы овладеть ею»).'
