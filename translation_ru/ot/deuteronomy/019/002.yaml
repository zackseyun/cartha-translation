    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: три города
  rationale: עִיר может обозначать город или поселение; в данном законодательном контексте традиционное и точное «города» естественно предваряет установление городов-убежищ.
- source_word: תַּבְדִּיל
  choice: отдели
  rationale: Порода hифиль глагола בדל выражает отделение или выделение для особой цели. «Отдели» сохраняет конкретный смысл действия и звучит естественно в повелении.
- source_word: לָךְ
  choice: себе
  rationale: Дательный значения пользы передан возвратным местоимением «себе», естественным в русском языке.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: среди своей земли
  rationale: בְּתוֹךְ указывает на расположение внутри территории. «Среди своей земли» сохраняет пространственный оттенок, не утверждая непременно геометрический центр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма содержит суффикс второго лица мужского рода единственного числа и передаёт заветное обращение.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Причастие описывает совершающееся или предстоящее дарование земли; русский настоящий вид «даёт» естественно сохраняет эту перспективу.
- source_word: לְרִשְׁתָּהּ
  choice: во владение
  rationale: ירשׁ в контексте дарования земли может означать вступление во владение или наследование. «Во владение» ясно передаёт земельно-правовой смысл, а альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Значение ירשׁ при даровании земли
  choice: во владение
  alternative: в наследие
  rationale: Контекст допускает оба оттенка — обладание и наследование. Основной текст использует естественное земельно-правовое выражение, а подлинная лексическая неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой законодательного повеления. Единственное число обращения сохранено. Формулировка избегает архаизмов и конфессионально обусловленной замены Божьего имени.
