  terminology: «Яхве, твой Бог» передано правильно. «Города» уместно. Для ירשׁ в данном контексте «овладеть ею» хорошо передаёт приобретение/вступление во владение; вариант «получить её в наследие» следует сохранить в сноске без навязывания одного спорного оттенка.
