    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: должны послать за ним
  rationale: В данном законодательном контексте форма выражает обязательное предписание. Добавление «за ним» естественно передаёт подразумеваемую цель посылки и связывает её с последующим изъятием человека.
- source_word: זִקְנֵי עִירוֹ
  choice: старейшины его города
  rationale: זִקְנֵי обозначает признанных руководителей городской общины, а עִיר — город или поселение; «старейшины его города» точно и естественно для юридического контекста.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: забрать его оттуда
  rationale: לקח имеет широкое значение «брать». «Забрать» ясно передаёт удаление убийцы из города-убежища, не усиливая текст до «схватить».
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: выдать
  rationale: Оборот נתן ביד означает передать человека во власть другого. «Выдать» кратко и естественно выражает юридическую передачу.
- source_word: גֹּאֵל הַדָּם
  choice: мстителю за кровь
  rationale: Это специальное правовое обозначение лица, уполномоченного отомстить за пролитую кровь. Перевод сохраняет образ крови и юридическую функцию, не добавляя прямо не выраженное здесь родство.
- source_word: וָמֵת
  choice: и он умрёт
  rationale: Краткая формулировка сохраняет установленный законом исход после выдачи, не уточняя способ смерти и не добавляя причинной связи.
theological_decisions:
- issue: Роль גֹּאֵל הַדָּם
  choice: мститель за кровь
  alternative: родственник-мститель
  rationale: Корень גאל может обозначать родственного защитника или выкупщика, но в устойчивом сочетании с הַדָּם на первом плане стоит обязанность отомстить за кровь. Указание на родство не вносится в основной текст, поскольку в самом выражении оно не названо прямо.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Модальная конструкция «должны» передаёт обязательность нормы; синтаксис остаётся ясным для обычного читателя. Маркер [a] помещён непосредственно после соответствующего термина.
