  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: ru
  text: Тогда поступите с ним так, как он замышлял поступить со своим братом[a]. Искорени же зло из твоей среды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со своим соплеменником». Буквально: «со своим братом»; здесь это слово может также обозначать члена той же общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם לוֹ
  choice: То сделайте с ним
  rationale: Форма обращена к общине или судьям и выражает обязательное правовое предписание. Русское «сделать с ним» естественно передаёт направленное против виновного судебное действие.
- source_word: כַּאֲשֶׁר זָמַם
  choice: то, что он замышлял
  rationale: זמם обозначает обдуманный замысел, в данном контексте злонамеренный; «замышлял» сохраняет оттенок преднамеренности, не добавляя лишних подробностей.
- source_word: לַעֲשׂוֹת לְאָחִיו
  choice: сделать своему брату
  rationale: Буквально сохраняется אָח — «брат»; в правовом контексте это также член той же общины, что пояснено в сноске.
- source_word: וּבִעַרְתָּ הָרָע
  choice: Так искорените зло
  rationale: בער в повторяющейся правовой формуле Второзакония означает удалить, устранить зло, а не буквально сжечь. «Искорените» передаёт решительность и нравственно-общественный смысл формулы.
- source_word: מִקִּרְבֶּךָ
  choice: из своей среды
  rationale: Устойчивое выражение обозначает удаление зла изнутри сообщества; «из своей среды» звучит естественно и сохраняет общинный образ.
theological_decisions:
- issue: Значение אָחִיו как родственного и общинно-правового термина
  choice: своему брату
  alternative: своему соплеменнику; ближнему из своего народа
  rationale: Основной текст сохраняет буквальное, грамматически мужское «брату», не устраняя возможную заветно-общинную окраску. Более широкое значение отмечено в сноске.
- issue: Формула удаления зла из общины
  choice: искорените зло из своей среды
  alternative: удалите зло из своей среды
  rationale: Формула говорит о решительном устранении зла посредством предписанного суда. Перевод не уточняет, относится ли «зло» прежде всего к проступку, виновнику или их совокупному воздействию, сохраняя ёмкость еврейского выражения.
translation_notes:
  register: Современный литературный русский язык с краткой и весомой правовой формулировкой. Императивное «сделайте» передаёт обязательность предписания, а «искорените зло» сохраняет торжественный характер повторяющейся формулы Второзакония без архаизации.
