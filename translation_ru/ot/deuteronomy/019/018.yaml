  text: Судьи должны тщательно расследовать; и если окажется, что свидетель — лжесвидетель и дал ложное показание против своего брата,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ הַשֹּׁפְטִים הֵיטֵב
  choice: И пусть судьи тщательно расследуют дело
  rationale: Глагол דרשׁ в судебном контексте означает тщательно исследовать или расследовать; добавление «дело» естественно для русского языка и не вносит нового смыслового содержания.
- source_word: וְהִנֵּה
  choice: И вот, если … оказался
  rationale: Сохранён указательный оттенок неожиданно обнаруженного результата проверки; условная форма «если» учитывает функцию оборота в контексте, а «оказался» передаёт итог расследования.
- source_word: עֵד שֶׁקֶר
  choice: лжесвидетелем
  rationale: Устойчивый и точный русский эквивалент выражения «свидетель лжи».
- source_word: שֶׁקֶר עָנָה
  choice: дал ложное показание
  rationale: В судебном контексте ענה означает свидетельствовать или давать показание, а не просто отвечать.
- source_word: בְאָחִיו
  choice: против своего брата
  rationale: Предлог ב здесь обозначает направленность обвинительного свидетельства; «брат» сохраняет язык общинного родства оригинала.
theological_decisions:
- issue: Условное или констатирующее значение וְהִנֵּה
  choice: «И вот, если свидетель оказался…»
  alternative: «И вот, свидетель оказался…»
  rationale: Контекст описывает возможный исход расследования, поэтому «если» естественно связывает условие с наказанием в следующем стихе; «вот» сохраняет формальную окраску еврейского выражения и не устраняет оттенок обнаружения.
translation_notes:
  register: Современный литературный русский язык с достоинством юридического установления. Синтаксис оставляет стих незавершённым, поскольку предложение продолжается в следующем стихе.
