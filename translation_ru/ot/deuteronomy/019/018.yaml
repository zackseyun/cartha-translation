- from: И пусть судьи тщательно расследуют дело. И вот, если свидетель оказался лжесвидетелем и дал ложное показание против своего брата,
  to: Судьи должны тщательно расследовать; и если окажется, что свидетель — лжесвидетель и дал ложное показание против своего брата,
  rationale: Перевод переработан в единый незавершённый период, который естественно продолжается в следующем стихе. Сохранены тщательность расследования, судебная терминология, повторное указание на ложность свидетельства и «брат» исходного текста. Условная связь согласуется с непосредственным контекстом и английской аудиторской версией, а «окажется» передаёт оттенок обнаружения, выраженный וְהִנֵּה.
