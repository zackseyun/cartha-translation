lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: не проливалась
  rationale: Нифаль глагола שׁפך передаёт пассивное значение; применительно к крови естественный современный русский эквивалент — «проливаться».
- source_word: דָּם נָקִי
  choice: невинная кровь
  rationale: Устойчивое библейское юридико-нравственное выражение, обозначающее кровь человека, не заслуживающего смерти.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: среди твоей земли
  rationale: Сохраняет пространственное значение קֶרֶב и несколько торжественный законодательный регистр оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: даёт тебе в наследие
  rationale: Причастие נֹתֵן выражает продолжающееся действие, а נַחֲלָה — наследственное владение; формулировка естественна по-русски и сохраняет заветную лексику земли.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: и на тебе не было вины за кровь
  rationale: В данном юридическом контексте דָּמִים означает ответственность за кровопролитие; конструкция עָלֶיךָ передана выражением «на тебе», сохраняющим образ возложенной вины. Отрицание в русском синтаксически распространяется от начального וְלֹא на обе согласованные части цели.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Связь заключительной фразы с начальным отрицанием
  choice: «и на тебе не было вины за кровь»
  alternative: «а иначе на тебе будет вина за кровь»
  rationale: 'Еврейское וְלֹא естественно понимать как вводящее цель предотвращения обоих последствий: пролития невинной крови и появления кровной вины. При этом возможна смысловая трактовка заключения как отдельного следствия, поэтому буквальная идиома отмечена в сноске.'
