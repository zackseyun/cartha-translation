  source_fidelity: 'В заключительной части черновик неверно распространяет отрицание לֹא на фразу וְהָיָה עָלֶיךָ דָּמִים. В еврейском тексте буквально сказано: «и кровь будет на тебе»; в юридическом употреблении это означает кровную вину. Связь выражает последствие пролития невинной крови, а не вторую отрицательную цель.'
