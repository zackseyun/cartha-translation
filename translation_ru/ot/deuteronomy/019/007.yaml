- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего установления кратко и естественно.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: я повелеваю тебе
  rationale: Сохраняет выраженное местоимением подлежащее и прямую силу повеления; настоящее время естественно передаёт действующее предписание.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В современном русском двоеточие естественно вводит содержание повеления и позволяет не воспроизводить тяжеловесное «говоря».
- source_word: שָׁלֹשׁ עָרִים
  choice: три города
  rationale: Прямое соответствие еврейскому сочетанию числительного с существительным.
- source_word: תַּבְדִּיל
  choice: Отдели
  rationale: Hiphil глагола בדל означает отделить, выделить; форма русского повелительного наклонения естественно передаёт еврейский имперфект с предписывающим значением.
- source_word: לָךְ
  choice: для себя
  rationale: Сохраняет значение действия в пользу адресата и форму обращения к Израилю во втором лице единственного числа.
theological_decisions:
- issue: Обращение во втором лице мужского рода единственного числа в законе завета
  choice: 'Сохранено единственное число: «тебе», «для себя».'
  alternative: Передать множественным числом как обращение ко всему Израилю либо безличной конструкцией.
  rationale: Еврейский текст обращается к Израилю как к единому адресату; сохранение числа удерживает риторическую форму и не вносит толкование в основной текст.
- issue: Смысл תַּבְדִּיל применительно к городам убежища
  choice: «Отдели» с примечанием о возможном контекстуальном значении «выдели».
  alternative: «Назначь» или «выдели» непосредственно в основном тексте.
  rationale: «Отдели» сохраняет основное лексическое значение בדל, тогда как контекст подразумевает официальное выделение городов; эта смысловая широта отражена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Архаичное буквальное «говоря» заменено двоеточием; единственное число обращения сохранено. Маркер сноски поставлен после всего предложения.
