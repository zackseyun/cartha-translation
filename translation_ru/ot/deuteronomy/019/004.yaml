base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: ru
  text: 'Вот правило о том, кто лишил человека жизни и может бежать туда, чтобы остаться в живых: он ударил своего ближнего неумышленно и прежде[a] не питал к нему ненависти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со вчерашнего дня и позавчера»; эта идиома означает: «раньше, прежде».'
    reason: Сноска сохраняет буквальный временной образ древнееврейской идиомы מִתְּמֹל שִׁלְשֹׁם, тогда как основной текст передаёт её смысл.
lexical_decisions:
- source_word: דְּבַר הָרֹצֵחַ
  choice: в каком случае тот, кто убил человека
  rationale: В данном правовом контексте выражение вводит условия, при которых человек, причинивший смерть, вправе укрыться в городе-убежище. Описательный перевод не приписывает ему заранее вины, которую русские слова «убийца» и «убийство» нередко подразумевают.
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: может бежать туда и остаться в живых
  rationale: Форма определяет право такого человека бежать в убежище и результат этого бегства; «может» не превращает условие в прямое повеление.
- source_word: יַכֶּה אֶת רֵעֵהוּ
  choice: ударил своего ближнего
  rationale: Глагол נכה означает «ударить, поразить»; смертельный исход уже задан контекстом, поэтому не следует заменять его прямым глаголом «убить». רֵעַ передано традиционным и понятным словом «ближний».
- source_word: בִּבְלִי דַעַת
  choice: неумышленно
  rationale: Буквально «без знания»; в правовом контексте речь идёт об отсутствии осознанного намерения причинить смерть. «Неумышленно» ясно передаёт этот юридический смысл.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: не питал к нему ненависти
  rationale: Так естественно по-русски передаётся устойчивое предшествующее отношение, выраженное отрицанием причастия.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: прежде
  rationale: Это идиома со значением прежнего времени; краткое «прежде» естественно в русском тексте, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Правовая характеристика причинившего смерть
  choice: тот, кто убил человека
  alternative: убийца
  rationale: Нейтральное описание сохраняет различие между неумышленным причинением смерти и виновным убийством и не решает вопрос о виновности одним существительным.
translation_notes:
  register: Современный литературный русский язык с ясной правовой формулировкой и умеренно библейской лексикой. Синтаксис перестроен в естественную условную конструкцию, при этом сохранены нейтральность в вопросе виновности и последовательность исходного текста.
