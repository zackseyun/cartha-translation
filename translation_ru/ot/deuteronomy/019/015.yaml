revisions:
- from: Одного свидетеля недостаточно, чтобы обвинить человека в каком бы то ни было беззаконии или грехе — в любом грехе, который тот совершит. Только по свидетельству двух или трёх свидетелей дело может быть установлено.[a]
  to: Один свидетель не может выступать против человека по поводу какого бы то ни было беззакония или какого бы то ни было греха — любого греха, который он совершит. Дело будет установлено по свидетельству двух или трёх свидетелей.[a]
  rationale: Убрано сужающее «обвинить» и восстановлена более точная связь единственного свидетеля с выступлением против человека. Сохранены всеохватность трёх юридико-нравственных обозначений, повторное упоминание греха и юридический итог на основании двух или трёх свидетелей. Сноска поясняет дословный идиом и повтор глагола без перегрузки основного текста.
