  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: ru
  text: Один свидетель не может выступать против человека по поводу какого бы то ни было беззакония или какого бы то ни было греха — любого греха, который он совершит. Дело будет установлено по свидетельству двух или трёх свидетелей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «По устам двух свидетелей или по устам трёх свидетелей устоит дело». Еврейский глагол «устоит» повторяет глагол, употреблённый в начале стиха о единственном свидетеле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: недостаточно ... может быть установлено
  rationale: В судебном контексте קום означает, что свидетельство или дело имеет законную силу. Естественный русский перевод передаёт этот смысл, хотя формальное повторение глагола выражено не буквально.
- source_word: עֵד אֶחָד
  choice: одного свидетеля
  rationale: Родительный оборот с «недостаточно» естественно подчёркивает недостаточность единственного свидетельства.
- source_word: בְּאִישׁ
  choice: обвинить человека
  rationale: Предлог ב в данном судебном контексте указывает на свидетельство против лица; «человека» сохраняет единственное число, не ограничивая норму только мужчинами.
- source_word: לְכָל עָוֺן וּלְכָל חַטָּאת
  choice: в каком бы то ни было беззаконии или грехе
  rationale: Сохранено различие между עָוֺן и חַטָּאת, а конструкция передаёт всеохватность закона.
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: в любом грехе, который тот совершит
  rationale: Сохранено повторное упоминание греха и устранена возможная русская двусмысленность относительно того, кто его совершает.
- source_word: עַל פִּי
  choice: по свидетельству
  rationale: Это естественная русская передача буквального идиоматического выражения «по устам» в судебном контексте.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: двух или трёх свидетелей
  rationale: Кратко и точно сохраняет числовое требование; повтор существительного по-русски не обязателен.
- source_word: דָּבָר
  choice: дело
  rationale: В юридическом контексте דָּבָר обозначает рассматриваемое дело или обвинение; «дело» сохраняет достаточную широту значения.
theological_decisions:
- issue: Представительное мужское единственное число в אִישׁ
  choice: человека
  alternative: мужчину
  rationale: Русское «человек» грамматически мужского рода и соответствует форме оригинала, но естественно выражает общий юридический принцип без неоправданного ограничения его мужчинами.
- issue: Юридическое значение повторённого קום
  choice: недостаточно ... может быть установлено
  alternative: не устоит ... устоит
  rationale: Выбранная формулировка ясно передаёт юридическую силу свидетельства и установление дела, не превращая образное «стоять» в неясный русский оборот.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим звучанием. Сохранены накопление терминов «беззаконие» и «грех», всеохватность нормы и различие между одиночным свидетельством и подтверждением дела несколькими свидетелями.
