    rationale: בְּאִישׁ обозначает свидетельство против человека, а не обязательно действие обвинения; свидетельство может относиться к любому разбираемому правонарушению.
  - severity: low
    issue: Первое «יכול/недостаточно» не сохраняет явно, что речь идёт о недопустимости единственного свидетеля как свидетеля против лица.
    rationale: «Один свидетель не может выступать против человека» ближе к конструкции לֹא יָקוּם עֵד אֶחָד בְּאִישׁ и остаётся естественным по-русски.
