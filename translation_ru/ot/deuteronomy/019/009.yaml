  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: ru
  text: 'Если ты будешь соблюдать всю эту заповедь[a], исполняя её, которую я сегодня предписываю тебе исполнять: любить Яхве, твоего Бога, и ходить Его путями во все дни твоей жизни, — тогда прибавь себе ещё три города к этим трём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всю эту заповедь»; в еврейском тексте слово «заповедь» стоит в единственном числе.'
    reason: Сохраняется заметное единственное число исходного текста, которое в некоторых переводах заменяют множественным.
lexical_decisions:
- source_word: כִּי תִשְׁמֹר
  choice: если ты будешь соблюдать
  rationale: כִּי вводит условие, а שׁמר в контексте завета означает соблюдать заповедь. Русская условная конструкция естественно передаёт синтаксис стиха.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: всю эту заповедь
  rationale: Сохраняется единственное число מִצְוָה и всеохватное значение כָּל; по-русски сочетание звучит естественно.
- source_word: לַעֲשֹׂתָהּ
  choice: исполняя её
  rationale: Инфинитив указывает на практическое осуществление заповеди; деепричастная конструкция ясно связывает соблюдение с исполнением.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которую я сегодня даю тебе
  rationale: Причастие מְצַוֶּה обозначает совершаемое Моисеем повеление; «даю заповедь» семантически точно, но в контексте русского предложения естественно выражается глаголом «даю» при явном антецеденте «заповедь».
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: любить Яхве, твоего Бога
  rationale: Инфинитив передаёт содержание заповеди. Тетраграмматон передан личным именем «Яхве», а приложение выделено запятой.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: и ходить Его путями
  rationale: Сохранена библейская метафора хождения путями Бога без сведения её только к общему понятию поведения.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Формально передаёт устойчивое выражение о постоянной, пожизненной верности, не добавляя отсутствующего в еврейском притяжательного местоимения.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: тогда добавь себе ещё три города
  rationale: Перфект с וְ в условной конструкции выражает следствие; русский императив естественно соответствует предписанию в аподосисе и сохраняет לְךָ как «себе».
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: к этим трём
  rationale: 'Предлог עַל здесь имеет добавочное значение: новые города присоединяются к уже названным трём.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Связь любви к Богу и хождения Его путями со «всей этой заповедью»
  choice: сохранить их как пояснение содержания заповеди
  alternative: понимать только как отдельные условия
  rationale: Инфинитивы לְאַהֲבָה и וְלָלֶכֶת допускают оттенки цели и содержания. Пунктуация сохраняет тесную связь, не превращая фразу в богословски обособленный перечень условий.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены метафора «ходить Его путями», единственное число «заповедь» и личное имя Яхве; избегнуты архаизмы и конфессионально окрашенные добавления.
