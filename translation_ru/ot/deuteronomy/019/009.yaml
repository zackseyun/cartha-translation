    issue: «которую я сегодня даю тебе»
    rationale: Глагол נתן («давать») отсутствует. מְצַוְּךָ означает «повелеваю тебе / заповедую тебе»; в данном контексте следует выразить предписание, а не просто передачу заповеди.
  - severity: low
    issue: «во все дни»
    rationale: Фраза возможна в возвышенном стиле, но для современного литературного русского звучит неполно и менее ясно, чем «во все дни твоей жизни». Контекст второго лица оправдывает экспликацию «твоей жизни».
