  source_fidelity: Передача основной юридической последовательности, явки «перед Яхве» и обеих групп должностных лиц точна. Однако הָאֲנָשִׁים прямо обозначает мужчин; «оба человека» несколько ослабляет это указание. Оборот о должностных лицах означает тех, кто будет/окажется действующим в то время; «будут исполнять обязанности» передаёт контекстуальный смысл естественнее, чем просто «будут служить».
  naturalness: «Предстанут» уместно в формально-судебном регистре. «Двое мужчин» — естественная современная форма и точнее, чем «оба человека». «Будут исполнять обязанности в те дни» ясно и литературно характеризует священников и судей как актуальных должностных лиц.
  terminology: «Яхве» последовательно передаёт יהוה. «Священники», «судьи», «спор» и «тяжба» соответствуют юридико-религиозному контексту без излишней интерпретации.
