base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: ru
  text: тогда двое мужчин, между которыми идёт спор[a], предстанут перед Яхве, перед священниками и судьями, которые будут исполнять обязанности в те дни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у которых есть тяжба»; «между которыми судебное дело».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которые будут в те дни»; то есть будут тогда исполнять свои обязанности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: тогда … предстанут
  rationale: Союз וְ с перфектом продолжает последовательность предписанной судебной процедуры. «Тогда» естественно передаёт последовательность, а «предстанут» соответствует официальному контексту явки на суд.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: оба человека
  rationale: Еврейский текст буквально говорит о «двух мужчинах/людях». В современном русском «оба человека» сохраняет указание на двух участников тяжбы и звучит естественнее, чем буквальное «два мужчины».
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: между которыми идёт спор
  rationale: רִיב может обозначать спор, тяжбу или судебное дело. Выбранная формулировка естественно передаёт отношение между двумя участниками, не сужая значение до уже оформленного судебного дела.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי передаёт явку перед лицом Бога в судебно-заветном контексте; личное имя יהוה транслитерировано как «Яхве».
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: перед священниками и судьями
  rationale: Сохраняются обе названные группы признанных религиозно-судебных властей и повтор предлога перед вторым дополнением.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: которые будут служить в те дни
  rationale: 'Буквально: «которые будут в те дни». В контексте речь идёт о священниках и судьях, исполняющих тогда свои обязанности; «будут служить» ясно передаёт это без современного канцеляризма «занимать должность».'
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон יהוה. «Яхве» сохраняет личное заветное имя и наиболее вероятную научную реконструкцию произношения, не заменяя имя титулом.
translation_notes:
  register: Современный литературный русский язык с достойным юридико-повествовательным регистром. Синтаксис остаётся близким к еврейской последовательности, но тяжеловесная буквальная конструкция אֲשֶׁר לָהֶם הָרִיב передана естественно. Маркеры сносок помещены непосредственно после соответствующих выражений.
