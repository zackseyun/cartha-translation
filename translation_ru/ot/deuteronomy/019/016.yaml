  text: כִּֽי יָק֥וּם עֵד חָמָ֖ס בְּ/אִ֑ישׁ לַ/עֲנ֥וֹת בּ֖/וֹ סָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: ru
  text: Если против человека выступит злонамеренный свидетель[a], чтобы обвинить его в отступлении[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ложный свидетель». Буквально: «свидетель насилия (неправды)» — то есть неправедный или злонамеренный обвинитель в суде.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в мятеже», «в отступничестве». Еврейское слово означает серьёзное уклонение или отпадение; точный характер обвинения здесь не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном своде законов вводит условие конкретного судебного случая.
- source_word: יָקוּם
  choice: выступит
  rationale: В судебном контексте означает появиться или выступить в качестве свидетеля; по-русски «выступит» естественно передаёт эту функцию.
- source_word: עֵד חָמָס
  choice: злонамеренный свидетель
  rationale: Буквально «свидетель насилия/неправды»; сочетание указывает на свидетеля, действующего со злым, неправедным намерением, и не обязательно заранее сводится лишь к фактической ложности показания.
- source_word: בְּאִישׁ
  choice: против человека
  rationale: Предлог обозначает лицо, против которого направлено свидетельство; «человек» сохраняет значение איש и звучит естественно в русском правовом изложении.
- source_word: לַעֲנוֹת
  choice: чтобы обвинить
  rationale: Глагол буквально связан с ответом или свидетельством, но здесь обозначает обвинительное выступление в суде; русский инфинитив передаёт цель действия.
- source_word: בּוֹ
  choice: его
  rationale: Относится к обвиняемому и вместе с глаголом естественно выражается конструкцией «обвинить его».
- source_word: סָרָה
  choice: в отступлении
  rationale: Слово обозначает уклонение, отступление или мятежное отклонение; «отступление» сохраняет серьёзность обвинения и широту значения, не ограничивая его исключительно религиозным отступничеством.
theological_decisions:
- issue: Степень конкретизации слова סָרָה
  choice: в отступлении
  alternative: в мятеже; в отступничестве; в преступлении
  rationale: Контекст не уточняет, является ли обвинение политическим мятежом, религиозным отступничеством или иным серьёзным уклонением. Выбранный вариант сохраняет эту смысловую открытость.
- issue: Характер свидетеля в выражении עֵד חָמָס
  choice: злонамеренный свидетель
  alternative: ложный свидетель
  rationale: Еврейское выражение шире прямого обозначения ложного свидетеля и подчёркивает неправедный, вредоносный характер его выступления. Альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным правовым звучанием. Условная конструкция и незавершённость предложения сохранены в соответствии с синтаксисом стиха и его продолжением.
