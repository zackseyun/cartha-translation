source:
  edition: WLC
  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: ru
  text: Не передвигай межевой знак[a] своего ближнего, установленный предшественниками в твоём уделе, который ты получишь в наследие в земле, которую Яхве, твой Бог, даёт тебе во владение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «межу». Еврейское слово обозначает границу владения, обычно закреплённую межевым знаком.'
    reason: 'Лексическая альтернатива: слово גְּבוּל может обозначать как саму границу, так и отмечающий её знак.'
lexical_decisions:
- source_word: תַסִּיג
  choice: передвигай
  rationale: Порода hифиль глагола נסג здесь обозначает смещение установленной границы ради захвата чужой земли. «Передвигай» естественно передаёт запрещённое действие, не сужая его до полного удаления знака.
- source_word: גְּבוּל
  choice: межевой знак
  rationale: В данном правовом контексте слово обозначает границу земельного владения, закреплённую физическим знаком. «Межевой знак» ясно выражает конкретный предмет, который можно передвинуть.
- source_word: רֵעֲךָ
  choice: своего ближнего
  rationale: В правовом контексте רֵעַ означает другого члена общины. «Ближний» сохраняет характерный библейский правовой и нравственный смысл и остаётся понятным современному читателю.
- source_word: גָּבְלוּ
  choice: установленный
  rationale: Глагол означает проведение или закрепление границы. Причастная конструкция делает русское предложение естественным и связывает действие предшественников с межевым знаком.
- source_word: רִאשֹׁנִים
  choice: предшественниками
  rationale: Слово буквально указывает на прежних, живших ранее людей. «Предшественники» сохраняет эту широту и не утверждает более узко, что речь непременно идёт о прямых предках.
- source_word: בְּנַחֲלָתְךָ
  choice: в твоём уделе
  rationale: נַחֲלָה — наследственно полученный земельный надел. «Удел» естественно передаёт как земельный, так и заветно-наследственный смысл.
- source_word: תִּנְחַל
  choice: который ты получишь в наследие
  rationale: Форма глагола направлена к будущему вступлению Израиля во владение землёй и лексически перекликается с נַחֲלָה. Выражение «получишь в наследие» сохраняет эту связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Причастие изображает дарование земли как совершающееся и характерное действие Бога; настоящее время естественно передаёт этот оттенок.
- source_word: לְרִשְׁתָּהּ
  choice: во владение
  rationale: Инфинитив ירשׁ выражает вступление во владение землёй и обладание ею. «Во владение» кратко и естественно передаёт цель Божьего дара.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное заветное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл наследия и владения землёй
  choice: «удел», «получишь в наследие» и «во владение»
  alternative: Передать всё общей лексикой собственности
  rationale: 'Текст одновременно использует נחל для наследственного удела и ירשׁ для вступления во владение. Различение этих слов сохраняет юридическое и заветное напряжение: земля является и наследием Израиля, и даром Яхве, которым народ должен овладеть.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранено обращение к отдельному члену общины во втором лице единственного числа. Повтор наследственной лексики оставлен ради связи между נַחֲלָה и תִּנְחַל, но синтаксис упрощён причастным оборотом.
