  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: ru
  text: Подготовь себе дорогу и раздели на три части территорию твоей земли, которую Яхве, твой Бог, даёт тебе в наследие, чтобы всякий, кто лишил человека жизни, мог бежать туда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и будет для бегства туда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: подготовь
  rationale: Хифиль глагола כון здесь означает сделать дорогу готовой и пригодной; повелительная форма естественно передаёт предписание.
- source_word: הַדֶּרֶךְ
  choice: дорогу
  rationale: В данном географическом и правовом контексте דֶּרֶךְ обозначает конкретный путь сообщения, а не отвлечённый образ действий.
- source_word: וְשִׁלַּשְׁתָּ
  choice: раздели на три части
  rationale: Форма от שלש выражает трёхчастное устройство территории; развёрнутая русская формулировка ясна и точно передаёт смысл.
- source_word: גְּבוּל אַרְצְךָ
  choice: территорию своей земли
  rationale: גְּבוּל здесь указывает не только на линию границы, но на территориальный охват земли, организуемой относительно трёх городов.
- source_word: יַנְחִילְךָ
  choice: даёт тебе в наследие
  rationale: Хифиль נחל сочетает значение передачи дара и введения во владение наследием; выбранная формулировка сохраняет оба оттенка.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Передача личного имени транслитерацией сохраняет прямое употребление тетраграмматона и естественно воспроизводит заветную формулу.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: чтобы ... мог бежать туда
  rationale: Сжатая конструкция буквально означает «и будет для бегства туда»; целевая конструкция по-русски ясно передаёт её функцию без добавления нового содержания.
- source_word: כָּל רֹצֵחַ
  choice: всякий, кто лишил человека жизни
  rationale: רֹצֵחַ в законе о городах-убежищах охватывает убившего человека, включая непредумышленный случай; формулировка не предрешает вопрос вины и естественнее архаичного «человекоубийца».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Подразумевает ли רֹצֵחַ предумышленное убийство
  choice: кто лишил человека жизни
  alternative: убийца; человекоубийца
  rationale: Ближайший контекст различает непредумышленное и предумышленное лишение жизни. Перевод сохраняет более широкую правовую категорию и не объявляет человека виновным в убийстве заранее.
translation_notes:
  register: Современный литературный русский язык с достоинством правового предписания. Синтаксис сделан прямым и понятным; сохранены повелительные формы единственного числа, обращённые к Израилю как к единому адресату. Маркер сноски поставлен после всего целевого оборота, к которому относится буквальная альтернатива.
