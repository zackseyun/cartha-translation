  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: ru
  text: Если кто-нибудь пойдёт со своим ближним в лес заготавливать древесину и, замахнувшись топором, чтобы срубить дерево, железная часть топора соскочит с рукояти, поразит ближнего и тот умрёт, пусть он бежит в один из этих городов и останется в живых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Если кто-нибудь
  rationale: Относительная конструкция вводит конкретный случай в продолжающемся правовом изложении; по-русски условное начало естественно передаёт её функцию.
- source_word: רֵעֵהוּ
  choice: со своим ближним / в его ближнего
  rationale: В правовом контексте רֵעַ обозначает другого человека из ближайшего социального круга, не обязательно друга; «ближний» сохраняет широкий межличностный смысл.
- source_word: בַיַּעַר
  choice: в лес
  rationale: יַעַר означает лесистую местность; русское направление движения естественно выражено винительным падежом.
- source_word: לַחְטֹב עֵצִים
  choice: рубить дрова
  rationale: Устойчивое современное выражение для заготовки древесины; оно не требует понимать множественное עֵצִים как строго определённые стоящие деревья.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: и замахнётся топором
  rationale: Передаёт движение руки при ударе топором естественным русским оборотом, не вводя отдельного действующего лица.
- source_word: לִכְרֹת הָעֵץ
  choice: чтобы срубить дерево
  rationale: В данном контексте כרת обозначает валку дерева; «срубить» точно и общепонятно.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ
  choice: а железо соскочит с деревянной рукояти
  rationale: Основной текст сохраняет метонимическое «железо», а значение הָעֵץ как деревянной части орудия раскрывается словом «рукоять»; сноска отмечает буквальность и возможную синтаксическую неоднозначность.
- source_word: וּמָצָא אֶת־רֵעֵהוּ
  choice: попадёт в его ближнего
  rationale: מצא в контексте летящего предмета означает достичь или поразить; «попадёт» естественно описывает непреднамеренный удар.
- source_word: וָמֵת
  choice: и тот умрёт
  rationale: Указательное местоимение ясно показывает, что умирает ближний, не меняя причинно-следственной последовательности.
- source_word: הוּא יָנוּס ... וָחָי
  choice: то этот человек может убежать ... и остаться в живых
  rationale: Явное подлежащее снимает возможную путаницу после упоминания погибшего; «может» передаёт предоставленную законом возможность искать убежища, а וָחָי — сохранение жизни.
theological_decisions:
- issue: Модальность права на бегство в город-убежище
  choice: может убежать
  alternative: пусть убежит / убежит
  rationale: Контекст устанавливает защитную правовую возможность для непреднамеренно убившего, а не безусловное предсказание; формулировка не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясным правовым повествованием. Сохранены конкретность несчастного случая и защитный смысл постановления; техническое «топорище» не использовано ради широкой понятности.
