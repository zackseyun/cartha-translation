revisions:
- from: Если кто-нибудь пойдёт со своим ближним в лес рубить дрова и замахнётся топором, чтобы срубить дерево, а железо соскочит с деревянной рукояти[a], попадёт в его ближнего и тот умрёт, то этот человек может убежать в один из этих городов и остаться в живых.
  to: Если кто-нибудь пойдёт со своим ближним в лес заготавливать древесину и, замахнувшись топором, чтобы срубить дерево, железная часть топора соскочит с рукояти, поразит ближнего и тот умрёт, пусть он бежит в один из этих городов и останется в живых.
  rationale: 'Исправлены сужение значения «рубить дрова», неясная метонимия «железо» в основном тексте и двусмысленное «его ближнего». Сноска сохраняет буквальное выражение оригинала. Спорная дополнительная синтаксическая возможность из прежней сноски удалена: в данном контексте она не нужна для передачи текста и способна отвлечь от наиболее естественного понимания конструкции.'
