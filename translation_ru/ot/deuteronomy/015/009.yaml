revisions:
- from: 'Берегись, чтобы не возникла в твоём сердце нечестивая мысль: «Приближается седьмой год, год освобождения[a]», — и чтобы ты не посмотрел со злобой[b] на своего бедного брата[c] и ничего ему не дал. Иначе он воззовёт к Яхве против тебя, и на тебе будет грех.'
  to: 'Берегись, чтобы в твоём сердце не возникла порочная мысль: «Приближается седьмой год, год прощения долгов[a]», — и чтобы ты не стал скупиться на помощь своему бедному брату[c] и не дал ему ничего. Иначе он воззовёт к Яхве против тебя, и это будет тебе грехом.'
  rationale: 'Исправлена передача идиомы וְרָעָה עֵינְךָ: в основном тексте её смысл выражен естественно по-русски («не стал скупиться на помощь»), а буквальный образ сохранён в сноске [b]. Поскольку эта сноска поясняет выражение, которое больше не воспроизводится буквально в основном тексте, её маркер не ставится в тексте. «Порочная мысль» точнее передаёт моральную характеристику בְלִיַּעַל, а «год прощения долгов» ясно выражает функцию шемитты в данном контексте. Формула «это будет тебе грехом» сохраняет личную виновность и естественна в современном литературном русском.'
  reviewer_model: gpt-5.6-terra
