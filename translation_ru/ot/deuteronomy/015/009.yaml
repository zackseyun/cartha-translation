  - severity: low
    issue: «Нечестивая мысль» недостаточно точно передаёт בְלִיַּעַל.
    rationale: Русское «нечестивый» чаще относится к безбожию или религиозной нечестивости; «порочная мысль» лучше сохраняет широкий отрицательный моральный смысл.
  - severity: low
    issue: «Год освобождения» неоднозначен в русском контексте.
    rationale: Здесь шемитта относится к прощению долгов; более ясный основной текст не требует, чтобы читатель выводил это значение только из сноски.
