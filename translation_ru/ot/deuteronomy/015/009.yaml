  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: ru
  text: 'Берегись, чтобы в твоём сердце не возникла порочная мысль: «Приближается седьмой год, год прощения долгов[a]», — и чтобы ты не стал скупиться на помощь своему бедному брату[c] и не дал ему ничего. Иначе он воззовёт к Яхве против тебя, и это будет тебе грехом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «год освобождения»; возможные переводы: «год отпущения долгов» или «год отмены долгов».'
    reason: lexical_alternative
  - marker: c
    text: Здесь «брат» — член той же заветной общины, не обязательно родной брат.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Возвратное предостережение передано кратким и естественным русским императивом с требуемой силой предупреждения.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: нечестивая мысль в твоём сердце
  rationale: דָבָר в сочетании с сердцем и последующим «говоря» обозначает внутреннюю мысль или намерение; בְלִיַּעַל здесь качественная характеристика, а не имя собственное.
- source_word: קָרְבָה שְׁנַת הַשֶּׁבַע
  choice: приближается седьмой год
  rationale: Форма выражает близость наступления года; настоящее время естественно передаёт актуальную перспективу прямой речи.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: год освобождения
  rationale: В контексте Второзакония 15 речь идёт об освобождении должников от долговых обязательств; более точное содержание разъяснено в сноске.
- source_word: וְרָעָה עֵינְךָ
  choice: посмотрел со злобой
  rationale: Русское выражение сохраняет образ глаза/взгляда, но без неестественной кальки «глаз будет злым»; сноска раскрывает значение завистливой скупости.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: на своего бедного брата
  rationale: Сохранены семейная образность אָח и значение нужды; в сноске уточнён общинный смысл слова «брат».
- source_word: וְלֹא תִתֵּן לוֹ
  choice: и ничего ему не дал
  rationale: Отрицание передачи помощи передано естественно и с учётом контекста займа бедному.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: он воззовёт к Яхве против тебя
  rationale: Сохранены судебно-обличительный оттенок עָלֶיךָ и прямое обращение пострадавшего к Богу.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: на тебе будет грех
  rationale: Формулировка сохраняет характерную библейскую конструкцию личной вины, не уточняя сверх текста её юридические последствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Передача идиомы וְרָעָה עֵינְךָ
  choice: посмотрел со злобой с пояснением в сноске
  alternative: твой глаз будет злым; ты проявишь скупость
  rationale: Так сохраняется телесно-зрительная образность оригинала, но русский текст остаётся естественным; конкретный смысл не скрыт благодаря сноске.
- issue: Значение אָחִיךָ
  choice: твой брат
  alternative: твой соплеменник; твой ближний
  rationale: «Брат» сохраняет семейный язык заветной общины и грамматическую форму источника; сноска предупреждает ошибочное ограничение родным братом.
- issue: Степень определённости последствия וְקָרָא
  choice: он воззовёт
  alternative: он может воззвать
  rationale: Еврейская последовательность формулирует ожидаемое последствие без отдельного показателя возможности; русское будущее не ослабляет предупреждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён относительно еврейского периода, однако сохранены прямая речь, повтор «седьмой год, год освобождения», семейная лексика и формула личной вины. Все сноски поставлены непосредственно после поясняемых выражений.
