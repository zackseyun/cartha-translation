lexical_decisions:
- source_word: כִּי
  choice: Напротив
  rationale: В данном контексте частица вводит противопоставление запрету ожесточать сердце и отказывать бедному в предыдущем стихе; «напротив» ясно передаёт этот переход.
- source_word: פָתֹחַ תִּפְתַּח
  choice: непременно открой
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление. «Непременно» естественно передаёт настоятельность, а образ открытой руки сохраняется.
- source_word: יָדְךָ
  choice: свою руку
  rationale: Сохраняется конкретная древнееврейская метафора щедрости; возвратное местоимение естественно для русского синтаксиса.
- source_word: לוֹ
  choice: ему
  rationale: Указывает на бедного соплеменника как получателя помощи.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: и непременно дай ему взаймы
  rationale: Глагол עבט в каузативной форме означает дать взаймы, а повторная усилительная конструкция передаётся словом «непременно». Перевод не превращает заём в безвозмездный дар.
- source_word: דֵּי
  choice: достаточно
  rationale: Передаёт значение достаточности, то есть объёма, необходимого для покрытия нужды.
- source_word: מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: для той нужды, которую он испытывает
  rationale: Формулировка сохраняет повторяющиеся в оригинале понятия недостатка и нужды, но выражает их естественно по-русски, не сужая заранее характер потребности.
