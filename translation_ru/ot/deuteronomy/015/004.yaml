base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: ru
  text: И всё же[a] среди тебя не будет бедных, потому что Яхве непременно благословит тебя в земле, которую Яхве, твой Бог, даёт тебе как наследие, чтобы ты овладел ею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Однако», «Только» или «И всё же». Еврейское אֶפֶס вводит ограничение или уточнение к предшествующему наставлению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Впрочем
  rationale: Слово вводит ограничение или уточнение к предшествующему повелению об освобождении от долгов. «Впрочем» естественно передаёт поворот мысли, не превращая его в абсолютное исключение.
- source_word: אֶבְיוֹן
  choice: бедного
  rationale: Обозначает человека, испытывающего материальную нужду. «Бедный» — ясный и достаточно широкий современный русский эквивалент.
- source_word: כִּי
  choice: потому что
  rationale: 'Второе כִּי вводит основание утверждения: благословение Яхве.'
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: непременно благословит тебя
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие; «непременно» сохраняет эту эмфазу без добавления идеи материального изобилия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: נֹתֵן
  choice: даёт
  rationale: Причастная форма представляет дарование земли как совершающееся или уверенно предстоящее действие; русское настоящее время естественно выражает эту перспективу.
- source_word: נַחֲלָה
  choice: в наследие
  rationale: Сохраняет юридический и богословский смысл земли как удела, дарованного Израилю.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы ты овладел ею
  rationale: Передаёт идею вступления во владение землёй и явно сохраняет местоименный суффикс «ею».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте дважды стоит личное имя Бога. Форма «Яхве» передаёт его принятую научную реконструкцию, не подменяя имя титулом.
- issue: Соотношение обещания об отсутствии бедных с дальнейшим упоминанием бедных в 15:11
  choice: «не должно быть бедного» как нормативно-обетовательное утверждение
  alternative: «бедных не будет» как безусловное предсказание
  rationale: 'Модальная формулировка сохраняет напряжение контекста: Божье благословение открывает возможность отсутствия нужды, тогда как последующие стихи учитывают реальное существование бедных. Перевод не разрешает это напряжение искусственно.'
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Единственное число «среди тебя» сохраняет обращение к Израилю как к единому народу. Конструкция «даёт тебе в наследие, чтобы ты овладел ею» передаёт и дарование земли, и вступление во владение ею.
