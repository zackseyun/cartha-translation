    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: чужеземец
  rationale: В данном правовом контексте נָכְרִי обозначает человека, не принадлежащего к общине Израиля. «Чужеземец» сохраняет социально-правовое противопоставление слову «брат» и остаётся понятным в современном литературном русском.
- source_word: תִּגֹּשׂ
  choice: можешь взыскивать долг
  rationale: Глагол נגשׂ в контексте долгов означает требовать или взыскивать уплату. Эта формулировка естественна по-русски и передаёт дозволенный законом характер действия.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: то, что причитается тебе
  rationale: Формулировка сохраняет открытый характер еврейского выражения и в долговом контексте указывает на требование кредитора, не сужая его до конкретного вида имущества.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохранён буквальный семейно-заветный термин. В законах Второзакония он обозначает соплеменника, принадлежащего к общине Израиля; это поясняется в сноске, а не подменяется толкованием в основном тексте.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: ты должен отказаться
  rationale: Еврейская идиома буквально говорит об освобождении или отведении руки и означает отказ от долгового требования в год прощения. Русская формулировка ясно передаёт юридическое действие, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Объём значения слова «брат» во второзаконническом праве
  choice: Сохранить в основном тексте буквальное «твой брат».
  alternative: «твой соплеменник» или «твой соотечественник»
  rationale: Стих противопоставляет чужеземца «брату» внутри общины Израиля. Буквальный перевод сохраняет значимый для текста образ родства и не делает скрытое толкование частью основного текста.
- issue: Характер предписания תַּשְׁמֵט יָדֶךָ
  choice: Передать как обязанность отказаться от требования.
  alternative: Буквальное «пусть твоя рука отпустит»
  rationale: В контексте года прощения речь идёт не просто об ослаблении взыскания, а об оставлении долгового требования. При этом конкретный образ «руки» пояснён в сноске.
translation_notes:
  register: Современный литературный русский с ясной правовой лексикой и умеренно библейским достоинством. Параллель «чужеземец — брат» сохранена; трудная еврейская идиома с «рукой» передана по смыслу и раскрыта в сноске.
