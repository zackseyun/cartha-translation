base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: ru
  text: 'Вот правило об освобождении от долгов: всякий заимодавец должен отказаться от своего требования по ссуде, выданной им ближнему[a]. Он не должен взыскивать с ближнего своего и с брата своего[b], ибо провозглашено освобождение от долгов для Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпустить долг», «аннулировать долговое требование». Еврейское слово «шемитта» обозначает установленное освобождение от долговых требований в субботний год.'
    reason: lexical_alternative
  - marker: b
    text: «Брат» здесь обозначает члена собственной общины завета; в данном правовом контексте его нередко понимают как соплеменника.
    reason: lexical_alternative
  - marker: c
    text: 'Возможны также переводы: «ради Яхве», «в честь Яхве» или «посвящённое Яхве». Еврейский предлог обозначает связь освобождения с Яхве, не уточняя её характера однозначно.'
    reason: source_ambiguity
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: в чём состоит прощение долгов
  rationale: דְּבַר вводит содержание правового предписания, а שְׁמִטָּה в данном контексте означает установленное освобождение должников от долговых требований. Эта формулировка естественна по-русски и сохраняет юридико-экономический смысл.
- source_word: שָׁמוֹט
  choice: должен простить долг
  rationale: Инфинитив абсолютный придаёт предписанию категорическую силу. «Должен простить долг» ясно передаёт обязательное прекращение требования, не воспроизводя неестественно еврейский повтор.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: каждый заимодавец
  rationale: Еврейская идиома обозначает обладателя требования по займу. «Заимодавец» — точный современный юридический термин, более естественный, чем буквальное «владелец займа своей руки».
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: который он дал своему ближнему
  rationale: Форма Hiphil означает дать взаймы или сделать должником. В связи с явно названным долгом русская формулировка передаёт действие кредитора без избыточного буквализма.
- source_word: לֹא יִגֹּשׂ
  choice: пусть он не требует уплаты
  rationale: Глагол означает притеснять должника требованием, взыскивать или настойчиво добиваться уплаты. «Не требует уплаты» точно выражает значение в долговом праве.
- source_word: רֵעֵהוּ
  choice: ближний
  rationale: Обычный и стилистически достойный русский эквивалент для רֵעַ в общественном и заветном контексте.
- source_word: אָחִיו
  choice: брат
  rationale: Сохранено буквальное мужское обозначение, которое в контексте относится к члену той же общины завета.
- source_word: כִּי קָרָא
  choice: потому что объявлено
  rationale: Еврейская безличная конструкция естественно передаётся русским безличным пассивом и указывает на официальное провозглашение.
- source_word: לַיהוָה
  choice: перед Яхве
  rationale: Предлог ל допускает оттенки направления, отношения и посвящения. «Перед Яхве» сохраняет связь установленного освобождения с Богом и не сводит её однозначно ни к посвящению, ни к принадлежности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо стоит тетраграмматон; личное имя «Яхве» сохраняет различие между именем Бога и титулом.
- issue: Значение לַיהוָה в выражении שְׁמִטָּה לַיהוָה
  choice: прощение долгов перед Яхве
  alternative: прощение долгов для Яхве / в честь Яхве
  rationale: Еврейский предлог допускает несколько отношений. «Перед Яхве» оставляет открытым, идёт ли речь прежде всего об установлении, посвящённом Яхве, провозглашённом в его присутствии или имеющем обязательную силу по отношению к нему.
- issue: Социальный объём слова אָחִיו
  choice: брата
  alternative: соплеменника / другого израильтянина
  rationale: Основной текст сохраняет прямое обозначение источника, тогда как примечание поясняет его заветно-общинный смысл, не подменяя перевод толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством правового предписания. Использован понятный юридический термин «заимодавец»; архаические синтаксические кальки устранены. Повтор «ближнего и брата» сохранён как значимый параллелизм источника.
