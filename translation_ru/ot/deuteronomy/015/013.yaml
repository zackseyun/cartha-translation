  text: וְ/כִֽי תְשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ לֹ֥א תְשַׁלְּחֶ֖/נּוּ רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: ru
  text: И когда отпустишь его от себя на свободу[a], не отпускай его с пустыми руками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И если отпустишь его от себя на свободу». Еврейский союз допускает как условное («если»), так и временное («когда») понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: И когда
  rationale: Сочетание וְכִי может вводить как временное, так и условное придаточное. В контексте предписанного освобождения естественно основное чтение «и когда», а возможное «и если» сохранено в сноске.
- source_word: תְשַׁלְּחֶנּוּ
  choice: отпустишь его / не отпускай его
  rationale: Piel глагола שלח с местоименным суффиксом означает отпустить или отослать. «Отпустить» естественно передаёт освобождение от службы; повтор корня сохранён в обеих частях стиха.
- source_word: חָפְשִׁי
  choice: на свободу
  rationale: Прилагательное חָפְשִׁי обозначает свободное состояние в противоположность рабской или долговой службе. Русское выражение «отпустить на свободу» ясно и идиоматично.
- source_word: מֵעִמָּךְ
  choice: от себя
  rationale: Буквально «от пребывания с тобой». «От себя» близко передаёт форму текста, не добавляя толкований «со службы» или «из дома».
- source_word: לֹא תְשַׁלְּחֶנּוּ
  choice: не отпускай его
  rationale: Отрицание לֹא с имперфектом выражает запрет. В современном русском законодательное предписание естественно звучит как повелительное «не отпускай».
- source_word: רֵיקָם
  choice: с пустыми руками
  rationale: Наречие означает «пустым, ни с чем». Устойчивое русское выражение «с пустыми руками» точно передаёт смысл обеспечения освобождаемого.
