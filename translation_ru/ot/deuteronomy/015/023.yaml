  text: Только не ешь его крови; вылей её на землю, как воду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничение к предшествующему разрешению, не превращая его в простое противопоставление.
- source_word: אֶת דָּמוֹ
  choice: крови его
  rationale: Передаёт буквальное «его кровь»; родительный падеж естественен в русском при отрицании, а местоимение сохраняет отсылку к животному.
- source_word: לֹא תֹאכֵל
  choice: не ешь
  rationale: Форма единственного числа сохраняет прямое обращение и повелительную силу юридического наставления.
- source_word: עַל הָאָרֶץ
  choice: на землю
  rationale: В данном конкретном контексте речь идёт о выливании крови на почву, а не о земле как стране или мире.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: вылей её
  rationale: Естественно передаёт повелительный смысл древнееврейского имперфекта в законодательном контексте и согласуется с русским словом «кровь».
- source_word: כַּמָּיִם
  choice: как воду
  rationale: Прямо и естественно сохраняет сравнение исходного текста.
theological_decisions:
- issue: Отношение к крови в пищевом законе
  choice: Передать запрет употреблять кровь и предписание вылить её без дополнительного богословского объяснения.
  alternative: Перевести более истолковательно как «жизненную кровь», подчёркивая связь крови с жизнью.
  rationale: Сам стих формулирует конкретное предписание, но не излагает его богословского основания; добавлять это основание в основной текст не следует.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным тоном законодательного наставления. Сохранено обращение к одному лицу; инверсия «крови его» слегка возвышенна, но понятна и подчёркивает ограничение.
