base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: ru
  text: 'Ведь бедные никогда не переведутся на этой земле. Поэтому Я повелеваю тебе: непременно открывай руку твоему брату[a] — бедному[b] и нуждающемуся в твоей земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть соплеменнику, члену народа завета. В еврейском тексте буквально: «брату».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать бедного, униженного или страдающего; следующее слово, переведённое как «нуждающийся», также обозначает человека в бедности и нужде.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим повелением естественным для русского языка способом.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: бедные никогда не переведутся
  rationale: Отрицание с имперфектом выражает продолжающуюся реальность; единственное число в еврейском имеет собирательно-обобщающий смысл, который естественно передаётся русским множественным числом.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: в этой земле
  rationale: Контекст Второзакония указывает на землю завета. Русское «не переведутся в этой земле» естественно передаёт смысл удаления из среды земли без тяжеловесного буквализма.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Сохраняет явный логический вывод из первой части стиха.
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: 'Я повелеваю тебе:'
  rationale: Настоящее повелительное значение причастия сохранено; двоеточие естественно выполняет функцию еврейского вводного לֵאמֹר.
- source_word: פָּתֹחַ תִּפְתַּח
  choice: непременно открывай
  rationale: Инфинитив абсолютный перед личной формой усиливает повеление; «непременно» передаёт эмфазу, не добавляя отсутствующего в тексте наречия «широко».
- source_word: אֶת יָדְךָ
  choice: руку
  rationale: Сохранена исходная метафора открытой руки как готовности щедро помогать.
- source_word: לְאָחִיךָ
  choice: твоему брату
  rationale: Сохраняет родственно-заветный язык обращения; в контексте речь идёт о соплеменнике, члене народа завета.
- source_word: לַעֲנִיֶּךָ
  choice: бедному
  rationale: עָנִי может обозначать бедного, униженного или страдающего. В данном экономическом контексте «бедному» звучит естественно, а диапазон значения отмечен в сноске.
- source_word: וּלְאֶבְיֹנְךָ
  choice: и нуждающемуся
  rationale: Отличает אֶבְיוֹן от соседнего עָנִי и передаёт особую нужду, избегая неестественного повторения «бедному и бедняку».
theological_decisions:
- issue: Родственно-заветное значение לְאָחִיךָ
  choice: твоему брату
  alternative: твоему соплеменнику
  rationale: Буквальное «брату» сохраняет образ народа как семьи завета, а его контекстуальный представительский смысл поясняется в сноске.
- issue: Объём значения הָאָרֶץ / אַרְצֶךָ
  choice: земля / твоя земля
  alternative: страна / вся земля
  rationale: Непосредственный контекст относится к дарованной Израилю земле; перевод не превращает утверждение в отвлечённое высказывание обо всём земном шаре.
- issue: Соотношение брата, бедного и нуждающегося
  choice: 'приложение: брат — бедный и нуждающийся'
  alternative: три самостоятельные группы получателей
  rationale: Повторные местоименные суффиксы допускают формальное перечисление, однако в контексте два последних обозначения естественно уточняют, о каком брате идёт речь. Тире сохраняет эту связь, не устраняя полностью риторическую рядоположенность.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повеления. Идиома «не переведутся» естественно выражает непрекращающееся присутствие бедных; метафора открытой руки сохранена. Заглавное «Я» обозначает говорящего Бога согласно принятой русской библейской типографической традиции.
