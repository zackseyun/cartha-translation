lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: шило
  rationale: מַרְצֵעַ обозначает острый инструмент для прокалывания; «шило» — точный и естественный русский эквивалент.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: проткни им его ухо до двери
  rationale: Буквально конструкция говорит о помещении шила «в его ухо и в дверь». В контексте ритуала передаётся прокалывание уха у двери, при котором шило входит в дверь; формулировка сохраняет связь обоих объектов и не добавляет лишних подробностей.
- source_word: עֶבֶד
  choice: раб
  rationale: В данном правовом контексте речь идёт о закреплённом зависимом статусе, поэтому «раб» точнее, чем смягчающее «слуга».
- source_word: עוֹלָם
  choice: навсегда
  rationale: עוֹלָם выражает неограниченно длительный, постоянный статус в рамках человеческой жизни и данного правового порядка; естественное русское «навсегда» сохраняет силу выражения, а примечание указывает контекстуальный вариант.
- source_word: אֲמָתְךָ
  choice: твоя рабыня
  rationale: אָמָה обозначает женщину в рабском или зависимом статусе; «рабыня» согласуется с переводом עֶבֶד как «раб».
- source_word: וְאַף
  choice: и
  rationale: Частица присоединяет аналогичное предписание о рабыне; русское «и» в сочетании с «так же» ясно передаёт добавочное значение.
- source_word: תַּעֲשֶׂה כֵּן
  choice: так же поступи
  rationale: Естественная современная русская передача предписания сделать то же самое.
theological_decisions:
- issue: Передача терминов зависимого статуса в законе об израильском рабстве
  choice: «раб» и «рабыня»
  alternative: «слуга» и «служанка»
  rationale: Стих описывает юридически закрепляемый зависимый статус, подтверждённый особым ритуалом. «Раб» и «рабыня» сохраняют социально-правовую остроту исходных слов, не привнося более поздних богословских толкований.
- issue: Продолжительность статуса, выраженная словом עוֹלָם
  choice: «навсегда» с пояснением «пожизненно»
  alternative: «пожизненно» непосредственно в тексте
  rationale: «Навсегда» сохраняет широкую формулировку древнееврейского текста, тогда как примечание сообщает вероятный юридический смысл, не устраняя присущую слову смысловую широту.
translation_notes:
  register: Современный литературный русский язык с краткой, повелительной формой, соответствующей законодательному контексту. Сохранена юридическая прямота терминов «раб» и «рабыня»; архаизмы вроде «рабыне твоей» и канцелярские конструкции исключены.
