revisions:
- from: Если у тебя будет бедный — кто-нибудь из твоих братьев в одном из твоих городов[a], в твоей земле, которую даёт тебе Яхве, твой Бог, — не ожесточай своего сердца и не сжимай руки перед твоим бедным братом[b].
  to: Если у тебя окажется нуждающийся, один из твоих братьев, в одном из твоих городов, в земле, которую даёт тебе Яхве, твой Бог, не ожесточай своего сердца и не закрывай своей руки от твоего бедного брата[a].
  rationale: 'Исправлены синтаксис условной конструкции и передача образа закрытой руки. Основной текст сохраняет «города» как понятную передачу метонимии «ворота»; соответствующая буквальная деталь оставлена в сноске. Сноска о «братьях» сохраняется как полезное пояснение, но её якорь перенесён не следует: поскольку в данной редакции единственный реально требующий сноски элемент — «города», культурную сноску следует привязать к слову «братьев» в вёрстке, а не к финальному слову текста.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:01:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: условное положение, нуждающийся из числа «братьев», города в данной Богом земле и два запрета сохранены. Однако «перед твоим бедным братом» неточно передаёт מֵאָחִיךָ и по-русски ослабляет образ отказа в помощи; естественнее и ближе к исходному образу — «не закрывай руку от твоего бедного брата».'
  naturalness: Исходная фраза с тире («бедный — кто-нибудь из твоих братьев») тяжеловесна и неестественна для современного литературного русского. Перестройка с приложением после «нуждающийся» сохраняет структуру и делает фразу ясной. «Не закрывай руку» — устойчиво понятный библейско-литературный образ; он предпочтительнее, чем «не сжимай руки перед».
  terminology: «Яхве» точно отражает тетраграмматон и согласуется с английской аудиторской записью, хотя в её богословских решениях есть внутреннее расхождение между «Yahweh» и «the LORD». «Братья/брат» обоснованно сохраняют семейную лексику оригинала; сноска уместно поясняет её общинный охват. «Города» допустимо передаёт метонимию «ворота», при наличии буквальной сноски.
  issues:
