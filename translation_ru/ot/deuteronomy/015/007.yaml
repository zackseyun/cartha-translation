    issue: Неточная и неестественная передача «не сжимай руки перед твоим бедным братом».
    rationale: Еврейское וְלֹא תִקְפֹּץ אֶת־יָדְךָ מֵאָחִיךָ означает не закрывать/не сжимать руку, отказывая бедному брату. Русское «перед» не выражает отстранения или отказа и звучит неидиоматично в данном контексте.
  - severity: low
    issue: Тяжеловесная конструкция «будет бедный — кто-нибудь из твоих братьев».
    rationale: Она понятна, но тире создаёт неудачное пояснительное присоединение. «Окажется нуждающийся, один из твоих братьев» естественно передаёт то же приложение и не меняет смысла.
  - severity: low
    issue: Формулировка сноски «в одних из твоих ворот» шероховата.
    rationale: 'Это попытка буквально воспроизвести древнееврейскую форму, но по-русски лучше пояснить буквальный образ без неестественного оборота: «в пределах одних из твоих ворот».'
