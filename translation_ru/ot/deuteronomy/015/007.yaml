  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: ru
  text: Если у тебя окажется нуждающийся, один из твоих братьев, в одном из твоих городов, в земле, которую даёт тебе Яхве, твой Бог, не ожесточай своего сердца и не закрывай своей руки от твоего бедного брата[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в пределах одних из твоих ворот»; «ворота» здесь обозначают город или поселение.'
    reason: Лексическая метонимия и буквальный вариант.
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Если у тебя будет
  rationale: Условная формула естественно передаёт казуистический характер закона; будущее время в русском подходит для общей предполагаемой ситуации.
- source_word: אֶבְיוֹן
  choice: бедный
  rationale: Передаёт нужду и бедность человека, сохраняя субстантивированную форму без стилистически тяжёлого слова «бедняк».
- source_word: מֵאַחַד אַחֶיךָ
  choice: кто-нибудь из твоих братьев
  rationale: Сохраняет семейный язык заветного сообщества и естественно передаёт неопределённое «один из».
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: в одном из твоих городов
  rationale: «Врата» здесь метонимически обозначают город или поселение; смысл вынесен в основной текст, а буквальный образ отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Настоящее время сохраняет причастную форму и представляет землю как продолжающийся Божий дар.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: не ожесточай своего сердца
  rationale: Естественный русский библейский оборот, выражающий внутреннюю безжалостность и непреклонность.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: и не сжимай руки
  rationale: Сохраняет конкретный образ закрытой руки, отказывающейся дать помощь.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: перед твоим бедным братом
  rationale: Предлог «перед» естественно выражает отказ закрыть руку перед нуждающимся, сохраняя направленность действия и родственный язык.
theological_decisions:
- issue: Заветный семейный язык אַחֶיךָ / אָחִיךָ
  choice: братьев / братом
  alternative: соплеменников / соотечественников
  rationale: Буквальная семейная лексика подчёркивает взаимную обязанность членов общины завета; сноска поясняет её общественный охват, не устраняя мужскую форму исходного текста.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога, непосредственно присутствующее в еврейском тексте.
- issue: Образ закрывающейся руки
  choice: не сжимай руки
  alternative: не отказывай в помощи
  rationale: Сохранён телесный образ оригинала, связывающий внутреннее ожесточение сердца с внешним отказом проявить щедрость.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Синтаксис сохраняет развёрнутую условную конструкцию еврейского текста, но «города» используется в основном тексте ради ясности; буквальный образ ворот дан в сноске. Императивные запреты переданы естественными формами единственного числа.
