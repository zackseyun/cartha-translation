  source_fidelity: 'В первом предложении союз «или» не соответствует соединительному וּ («и»): речь идёт о первенцах как крупного, так и мелкого скота. Во втором запрете שׁוֹר обозначает конкретно быка/вола (домашнее животное рода крупного рогатого скота), а не весь «крупный скот»; это различие следует сохранить.'
  naturalness: Формулировка в целом литературна и понятна. «Среди твоего крупного скота и среди твоего мелкого скота» естественно передаёт две исходные категории, а «первенца твоего быка» ясно передаёт более узкое שׁוֹר.
  terminology: «Посвяти Яхве, твоему Богу» адекватно передаёт культовое תַּקְדִּישׁ и имя יהוה. «Мелкий скот» обоснованно сохраняет широту צֹאן; «стричь» точно передаёт גזז.
