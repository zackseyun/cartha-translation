base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: ru
  text: Каждого первенца мужского пола, который родится среди твоего крупного скота и среди твоего мелкого скота, посвяти Яхве, твоему Богу. Не используй для работы первенца твоего быка и не стриги первенца твоего мелкого скота.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  choice: каждого первенца
  rationale: Сочетание כָּל с существительным в единственном числе имеет распределительное значение; «каждого первенца» естественно передаёт его по-русски.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: который родится
  rationale: Нифаль глагола ילד обозначает рождение; русская возвратная форма точно и естественно передаёт значение.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: у твоего крупного или мелкого скота
  rationale: בקר обозначает крупный рогатый скот, а צאן — мелкий скот, прежде всего овец и коз. Союз «или» в русском перечислении естественно показывает две категории, не меняя области действия предписания.
- source_word: הַזָּכָר
  choice: мужского пола
  rationale: Уточняет, что предписание относится к первенцам-самцам; такая формулировка dignified и яснее, чем разговорное «самца» в данном контексте.
- source_word: תַּקְדִּישׁ
  choice: посвяти
  rationale: Хифиль קדש означает отделить как святыню, посвятить Богу. «Посвяти» сохраняет культовый смысл и звучит естественно в повелении.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твоему Богу
  rationale: Передаёт тетраграмматон как личное covenantal имя, а приложение сохраняет синтаксис и смысл исходной фразы.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: не используй для работы первенца из твоего крупного скота
  rationale: עבד с предлогом ב здесь запрещает использовать животное для труда. Формулировка устраняет возможную двусмысленность русского «не работай с» и сохраняет общий родовой смысл שׁוֹר.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: и не стриги первенца из твоего мелкого скота
  rationale: גזז прямо означает «стричь» шерсть; צאן не сужено до овец, поскольку слово включает также коз.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык; прямое обращение на «ты» сохраняет формы второго лица единственного числа в еврейском тексте. Сельскохозяйственные термины переданы ясно, без неоправданного сужения צאן до одних овец.
