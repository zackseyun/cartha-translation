  - severity: medium
    issue: «Первенца из твоего крупного скота» во втором запрете
    rationale: Существительное שׁוֹר уже означает быка/вола, в отличие от более широкого בָּקָר в первой части. Перевод как «крупный скот» стирает это лексическое различие.
