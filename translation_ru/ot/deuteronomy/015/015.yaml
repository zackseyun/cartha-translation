  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: ru
  text: И помни, что ты был рабом в земле Египта и что Яхве, твой Бог, выкупил тебя[a]. Поэтому Я заповедую тебе это сегодня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искупил тебя». Еврейский глагол פדה означает избавить из зависимости посредством выкупа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: И помни
  rationale: В данном законодательном контексте форма выражает наставление; повелительное «помни» естественно и точно передаёт её силу по-русски.
- source_word: עֶבֶד
  choice: рабом
  rationale: В контексте египетского порабощения слово обозначает несвободное, угнетённое положение; «раб» точнее, чем более мягкое «слуга».
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохранена конкретная историко-заветная формула оригинала, а не сокращённое «в Египте».
- source_word: וַיִּפְדְּךָ
  choice: выкупил тебя
  rationale: Глагол פדה обозначает избавление посредством выкупа; «выкупил» сохраняет образ освобождения из рабства и не превращает его в общее «освободил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, стоящее в еврейском тексте, без замены титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямая передача сочетания с притяжательным суффиксом второго лица единственного числа.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: 'Союзное выражение обозначает вывод: нынешнее повеление основано на памяти об избавлении из Египта.'
- source_word: אָנֹכִי מְצַוְּךָ
  choice: я и заповедую тебе
  rationale: «Заповедую» соответствует законодательному и заветному контексту; частица «и» при личном местоимении передаёт подчёркнутую причинно-следственную связь и делает фразу естественной по-русски.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: это
  rationale: В контексте выражение указывает на данное наставление. Буквальное «это дело/это слово» здесь было бы менее естественно и могло бы неоправданно сузить смысл.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой современный эквивалент, сохраняющий непосредственность обращения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте употреблено собственное заветное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Статус עֶבֶד при воспоминании о Египте
  choice: раб
  alternative: слуга
  rationale: Контекст египетского порабощения требует обозначения несвободного положения. Более мягкое «слуга» ослабило бы историческую и нравственную силу основания заповеди.
- issue: Образ פדה
  choice: выкупил
  alternative: искупил; освободил
  rationale: «Выкупил» сохраняет основное значение избавления из зависимости посредством выкупа. «Искупил» возможно, но в современном русском сильнее нагружено богословскими ассоциациями; «освободил» теряет образ выкупа.
translation_notes:
  register: Современный литературный русский с достоинством законодательного и заветного обращения. Формула «земля Египетская» сохраняет библейскую историческую конкретность, а синтаксис остаётся понятным современному читателю.
