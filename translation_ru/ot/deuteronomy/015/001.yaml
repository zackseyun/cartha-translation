  yaml_path: translation/ot/deuteronomy/015/001.yaml
  text: At the end of every seven years you shall make a release[a].
translation:
  language: ru
  text: По окончании каждого семилетнего срока совершай освобождение от долгов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпущение долгов», «отмена долгов». Еврейское שְׁמִטָּה означает «отпускание, освобождение» и здесь относится к закону об освобождении от долгов в седьмой год; само слово не уточняет, идёт ли речь о полном аннулировании долга или о прекращении его взыскания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: По истечении
  rationale: Передаёт временную идиому מִקֵּץ естественным современным русским выражением, не уточняя сверх текста, приходится ли действие на самый конец срока или на завершение семилетнего цикла.
- source_word: שֶׁבַע שָׁנִים
  choice: каждых семи лет
  rationale: В оригинале буквально «семи лет»; слово «каждых» естественно выражает повторяющийся характер установленного законом семилетнего цикла.
- source_word: תַּעֲשֶׂה
  choice: совершай
  rationale: Глагол עשה имеет широкое значение «делать, совершать». Здесь он предписывает регулярно осуществлять установленное действие; несовершенный вид с повелительным значением хорошо передаёт повторяемость.
- source_word: שְׁמִטָּה
  choice: освобождение от долгов
  rationale: שְׁמִטָּה буквально связано с отпусканием или оставлением. Контекст последующих стихов показывает, что речь идёт об освобождении должников от долгов; явное дополнение делает краткую норму понятной современному читателю, а сноска сохраняет более широкое лексическое значение.
theological_decisions:
- issue: 'Характер שְׁמִטָּה: окончательное прощение долга или временное прекращение взыскания'
  choice: освобождение от долгов
  alternative: отмена долгов; прекращение взыскания долгов
  rationale: Формулировка не решает окончательно, означает ли закон полное аннулирование обязательства или отпускание требования в установленный год; эта смысловая напряжённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным правовым тоном. Форма «совершай» передаёт обязательность и периодическое исполнение предписания без архаического «должен совершать».
