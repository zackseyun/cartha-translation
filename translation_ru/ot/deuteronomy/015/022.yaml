base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: ru
  text: В своих городах[a] ты можешь есть его; его могут есть и нечистый, и чистый[b] — как едят газель и оленя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих воротах» — древнееврейское выражение со значением «в твоих городах» или «в местных общинах».'
    reason: cultural_note
  - marker: b
    text: То есть это мясо разрешалось есть как ритуально нечистым, так и ритуально чистым людям.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: в пределах твоих городов
  rationale: Буквально «в твоих воротах», но это древнееврейская идиома, обозначающая города или местные общины. Перевод передаёт смысл естественным современным русским языком, а образ ворот отмечен в сноске.
- source_word: תֹּאכֲלֶנּוּ
  choice: ешь его
  rationale: Форма 2-го лица мужского рода единственного числа с местоименным дополнением 3-го лица мужского рода относится к животному из предыдущего контекста. В данном предписывающем контексте русский императив естественно передаёт разрешение, а слово «могут» далее делает разрешительный смысл явным.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: и нечистый, и чистый
  rationale: Слова обозначают ритуальный, а не нравственный статус людей. Краткая традиционная пара сохраняет формальную симметрию еврейского текста; значение пояснено в сноске.
- source_word: יַחְדָּו
  choice: наравне
  rationale: В контексте речь о равном праве обеих категорий есть мясо, а не обязательно об одновременной совместной трапезе. «Наравне» естественно передаёт этот оттенок.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: как газель и оленя
  rationale: צְבִי обозначает газель, а אַיָּל — оленя, нередко самца. В русском синтаксисе после подразумеваемого «едят» названия животных стоят в винительном падеже; сравнение отсылает к употреблению мяса диких животных без жертвенных ограничений.
theological_decisions:
- issue: Ритуальный статус участников трапезы
  choice: Сохранены термины «нечистый» и «чистый» с пояснением их ритуального значения.
  alternative: «Ритуально нечистый» и «ритуально чистый» непосредственно в основном тексте.
  rationale: Краткая формулировка ближе к форме еврейского текста и сохраняет библейскую терминологию, тогда как сноска предотвращает ошибочное нравственное толкование.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным библейским звучанием. Идиома о воротах передана по смыслу, а буквальный образ сохранён в сноске. Обращение оставлено в единственном числе в соответствии с древнееврейским текстом.
