base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: ru
  text: Непременно дай ему, и пусть сердце твоё не сожалеет, когда даёшь ему, потому что за это Яхве, твой Бог, благословит тебя во всех твоих делах и во всём, к чему ты приложишь руку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всяком посылании твоей руки», то есть во всём, за что ты берёшься.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: Непременно дай
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает повеление. «Непременно дай» естественно передаёт эмфазу, не добавляя прямо не выраженного наречия «щедро».
- source_word: לּוֹ
  choice: ему
  rationale: Местоименный суффикс мужского рода единственного числа отсылает к нуждающемуся соплеменнику из ближайшего контекста.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: и пусть сердце твоё не сожалеет
  rationale: Буквально говорится о том, чтобы сердце не испытывало дурного, тягостного чувства при даянии. «Не сожалеет» в данном контексте выражает нежелание расставаться с отданным, сохраняя образ сердца и не усиливая его до открытой неприязни.
- source_word: בְּתִתְּךָ לוֹ
  choice: когда даёшь ему
  rationale: Предлог ב при инфинитивной конструкции имеет здесь временно-обстоятельственное значение.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: потому что за это
  rationale: בגלל выражает причину, а הַדָּבָר הַזֶּה указывает на названный поступок — даяние нуждающемуся. Естественное русское «за это» передаёт причинную связь без тяжеловесного калькирования.
- source_word: יְבָרֶכְךָ
  choice: благословит тебя
  rationale: Стандартное значение глагола ברך сохранено без поясняющего расширения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохранено прямое заветное обозначение, относящееся к имени Яхве.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: во всех твоих делах
  rationale: מַעֲשֶׂה широко обозначает дело, труд или то, что человек совершает; «дела» естественно и достаточно широко звучит по-русски.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: во всём, к чему ты приложишь руку
  rationale: Русская идиома передаёт смысл буквального «во всяком посылании твоей руки» и частично сохраняет образ руки.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Род и число получателя помощи
  choice: ему
  alternative: нуждающемуся / им
  rationale: Еврейский суффикс имеет форму мужского рода единственного числа и отсылает к конкретно изображённому нуждающемуся соплеменнику.
- issue: Характер обещанного благословения
  choice: благословит тебя во всех твоих делах
  alternative: дарует успех во всех твоих делах
  rationale: Текст обещает благословение, но не определяет его исключительно как материальный успех; поэтому более узкое толкование не внесено.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренным сохранением еврейской образности. Единственное число и обращение на «ты» соответствуют еврейскому тексту. Инверсия «сердце твоё» сохраняет библейскую выразительность, не делая фразу архаичной.
