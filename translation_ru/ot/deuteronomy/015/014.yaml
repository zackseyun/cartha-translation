base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: ru
  text: Щедро надели его[a] из своего мелкого скота, с гумна и из виноградного точила; дай ему из того, чем благословил тебя Яхве, твой Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно снабди его». В еврейском тексте употреблена усилительная глагольная конструкция; сам глагол в данном контексте подразумевает обильное обеспечение человека при освобождении.'
    reason: Указаны возможная более формальная передача и усилительная сила еврейской конструкции.
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: щедро надели
  rationale: Глагол ענק в породе Hiphil здесь означает снабдить освобождаемого человека достаточным имуществом, а сочетание инфинитива абсолютного с личной формой усиливает повеление. «Щедро надели» естественно передаёт и обеспечение при освобождении, и усилительный характер еврейской конструкции.
- source_word: מִצֹּאנְךָ
  choice: из своего мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз. «Мелкий скот» точнее простого «стада» и сохраняет сельскохозяйственный контекст.
- source_word: וּמִגָּרְנְךָ
  choice: с гумна
  rationale: גֹּרֶן буквально обозначает гумно и метонимически — полученное там зерно. Конкретный образ сохранён.
- source_word: וּמִיִּקְבֶךָ
  choice: из точила
  rationale: יֶקֶב обозначает виноградное точило или находящийся при нём чан. «Точило» сохраняет конкретный образ и традиционно понятно в библейском сельскохозяйственном контексте.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: из того, чем благословил тебя Яхве, твой Бог
  rationale: Формулировка сохраняет относительную конструкцию и представляет Божье благословение как источник того, что следует отдать.
- source_word: תִּתֶּן לוֹ
  choice: дай ему
  rationale: Краткое повеление естественно передаёт еврейскую форму и сохраняет заключительное повторение обязанности дать освобождаемому человеку имущество.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие, не подменяя имя словом «Господь».
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. «Надели» передаёт обеспечение освобождаемого имуществом без канцеляризма; «гумно» и «точило» сохраняют конкретную аграрную образность оригинала.
