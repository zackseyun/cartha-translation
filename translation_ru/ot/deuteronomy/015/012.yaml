source:
  edition: WLC
  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: ru
  text: Если твой брат — еврей или еврейка — будет продан тебе и прослужит тебе шесть лет, то в седьмой год отпусти его[a] от себя на свободу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: После слов «еврей или еврейка» еврейский текст продолжает формой мужского рода единственного числа. Здесь она обобщённо обозначает освобождаемого человека; предписание относится и к мужчине, и к женщине.
    reason: Сохранение грамматической формы оригинала при разъяснении её общего охвата.
lexical_decisions:
- source_word: יִמָּכֵר
  choice: будет продан
  rationale: Форма нифаль передаёт пассивное значение; такой перевод не уточняет механизм продажи, которого сам стих не называет.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохраняет семейно-заветное обозначение исходного текста, не сводя его к понятию соплеменника или соотечественника.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: еврей или еврейка
  rationale: Передаёт две соотнесённые по роду формы этнонима; слов «раб» или «рабыня» в этом словосочетании нет.
- source_word: וַעֲבָדְךָ
  choice: и прослужит тебе
  rationale: Глагол עבד здесь обозначает службу или труд в пользу адресата; совершенный вид естественно сочетается с указанным шестилетним сроком.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: то в седьмой год
  rationale: Передаёт временную последовательность юридического предписания после шести лет службы.
- source_word: תְּשַׁלְּחֶנּוּ חָפְשִׁי
  choice: отпусти его на свободу
  rationale: שלח в данном контексте означает отпустить, а חָפְשִׁי указывает на свободный статус; сочетание естественно звучит в современном русском языке.
- source_word: מֵעִמָּךְ
  choice: от себя
  rationale: Прямо передаёт буквальное «от пребывания с тобой» и сохраняет указание на уход из-под власти или из хозяйства адресата.
theological_decisions:
- issue: Мужской род местоимения после упоминания еврея и еврейки
  choice: Сохранить в основном тексте форму мужского единственного числа «его», пояснив её охват в сноске.
  alternative: Передать явно как «его или её» либо заменить конструкцию формой без указания рода.
  rationale: В еврейском тексте после мужской и женской форм этнонима употреблён суффикс мужского рода единственного числа. Его грамматическую форму следует сохранить, не создавая ошибочного впечатления, будто закон относится только к мужчине.
translation_notes:
  register: Современный литературный русский язык, юридически ясный и достойный по тону. Конструкция с тире делает приложение «еврей или еврейка» естественным, а «отпусти ... на свободу» ясно передаёт освобождение без добавления отсутствующей в стихе терминологии.
