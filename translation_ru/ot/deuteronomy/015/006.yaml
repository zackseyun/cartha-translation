  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: ru
  text: 'Ведь Яхве, твой Бог, благословил тебя, как и обещал тебе[a]: ты будешь давать взаймы многим народам, а сам брать взаймы не будешь; ты будешь господствовать над многими народами, а они над тобой господствовать не будут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как говорил тебе». Буквально еврейский текст говорит «говорил», но в контексте завета эти слова имеют смысл обещания.'
    reason: 'Лексическая альтернатива: сохранена буквальная возможность для דִּבֶּר наряду с контекстуальным переводом «обещал».'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: בֵּרַכְךָ
  choice: благословил тебя
  rationale: Еврейская форма — перфект; русский совершенный вид естественно передаёт уже данное и остающееся действенным благословение.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: как и обещал тебе
  rationale: Буквально глагол означает «говорил», но в данном контексте речь идёт о ранее данном Богом обещании; частица «и» естественно подчёркивает соответствие сказанному.
- source_word: וְהַעֲבַטְתָּ
  choice: ты будешь давать взаймы
  rationale: Порода хифиль глагола עבט здесь означает давать ссуду; выбранное выражение естественно по-русски и сохраняет противопоставление следующей форме.
- source_word: גּוֹיִם רַבִּים
  choice: многим народам
  rationale: В экономическом и политическом контексте גּוֹיִם обозначает народы как национальные общности.
- source_word: לֹא תַעֲבֹט
  choice: брать взаймы не будешь
  rationale: Форма каль того же корня означает занимать; пара «давать взаймы — брать взаймы» ясно воспроизводит еврейскую антитезу.
- source_word: וּמָשַׁלְתָּ
  choice: ты будешь господствовать над
  rationale: מָשַׁל означает властвовать или господствовать; этот выбор сохраняет политическую силу выражения без архаичного оборота.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: они над тобой господствовать не будут
  rationale: Множественное число глагола отсылает к упомянутым народам; местоимение «они» делает эту связь явной.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение דִּבֶּר в формуле כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: обещал тебе
  alternative: говорил тебе; сказал тебе
  rationale: В контексте заветных благословений речь имеет силу обещания, однако буквальная возможность отмечена в сноске, чтобы не скрывать лексическую широту.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Симметричные пары «давать взаймы — брать взаймы» и «господствовать — господствовать» сохраняют риторический параллелизм оригинала; обращение к Израилю передано формами единственного числа.
