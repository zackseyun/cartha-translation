base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: ru
  text: Пусть тебе не будет тяжело, когда ты отпускаешь его от себя свободным, ведь за шесть лет его служба для тебя была равноценна двойной плате наёмному работнику[a]. И Яхве, твой Бог, благословит тебя во всём, что ты делаешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально содержит «двойную плату наёмного работника» и не уточняет характер сравнения. Его можно понимать как сравнение ценности шестилетней службы с расходами на наёмный труд; возможны и другие понимания сравнительной конструкции.
    reason: Сохраняет сжатость и спорность еврейской конструкции, не представляя интерпретацию основного текста как единственно возможную.
lexical_decisions:
- source_word: לֹא יִקְשֶׁה בְעֵינֶיךָ
  choice: Пусть тебе не будет тяжело
  rationale: Еврейская идиома буквально говорит «пусть не будет тяжело в твоих глазах» и выражает субъективное ощущение тяготы или досады. Выбранная формулировка естественна по-русски и сохраняет этот оценочный смысл.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: отпустить его от себя на свободу
  rationale: Форма с בְּ обозначает обстоятельство освобождения; חָפְשִׁי указывает именно на приобретение свободного статуса, а מֵעִמָּךְ передано прямо — «от себя», без добавления не выраженных в тексте понятий дома или службы.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: службу, стоящую вдвое больше платы наёмного работника
  rationale: מִשְׁנֶה означает двойную меру, а שְׂכַר שָׂכִיר — плату наёмного работника. В основном тексте сравнительная конструкция раскрыта как ценность шестилетней службы, при этом подлинная сжатость и неоднозначность еврейского выражения отмечены в сноске.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: за шесть лет он сослужил тебе службу
  rationale: Глагольная форма означает «служил тебе»; оборот «сослужил тебе службу» позволяет естественно связать её с последующим сравнением стоимости труда. Продолжительность передана как «за шесть лет».
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: И Яхве, твой Бог, благословит тебя
  rationale: В данном контексте форма выражает обещанный будущий результат. Личное имя יהוה передано как «Яхве», а не заменено титулом.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: во всём, что ты делаешь
  rationale: Прямое и естественное обозначение всей деятельности адресата без неоправданного сужения значения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Следует ли прямо назвать освобождаемого рабом
  choice: Сохранить местоимение «его» и глагол служения
  alternative: «раб твой служил тебе»
  rationale: В самом стихе употреблена глагольная форма «служил тебе», а зависимое положение человека уже задаётся контекстом закона. Добавление существительного «раб» здесь сильнее конкретизировало бы формулировку, чем это делает данный стих.
- issue: Смысл сравнения с платой наёмного работника
  choice: Стоимость шестилетней службы была вдвое выше платы наёмного работника
  alternative: Он прослужил вдвое дольше наёмного работника; он обошёлся вдвое дешевле наёмного работника
  rationale: Сжатое еврейское выражение допускает разные способы понимания основания сравнения. Основной текст следует наиболее непосредственному сравнению ценности труда с платой, но сноска сохраняет альтернативы и не выдаёт спорное уточнение за однозначное.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Синтаксис сделан понятным для обычного читателя; сохранены обращение на «ты», юридический смысл освобождения и обещательный характер заключительной фразы.
