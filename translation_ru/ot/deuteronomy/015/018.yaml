- from: Пусть тебе не будет тяжело отпустить его от себя на свободу, ведь за шесть лет он сослужил тебе службу, стоящую вдвое больше платы наёмного работника[a]. И Яхве, твой Бог, благословит тебя во всём, что ты делаешь.
