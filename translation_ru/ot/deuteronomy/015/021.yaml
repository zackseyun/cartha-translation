  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: ru
  text: Но если у него есть порок — хромота, слепота или любой серьёзный изъян[a], — не приноси его в жертву Яхве, твоему Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «любой плохой порок»; речь идёт о физическом недостатке, делающем животное непригодным для жертвоприношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Но если
  rationale: Условная конструкция одновременно противопоставляет этот случай предшествующему повелению о посвящении первенцев.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: у него есть порок
  rationale: Буквально «в нём будет порок»; русская конструкция естественно передаёт наличие физического недостатка у животного.
- source_word: פִּסֵּחַ אוֹ עִוֵּר
  choice: хромота, слепота
  rationale: Сохраняет два прямо названных физических недостатка и естественно согласуется с существительным «порок» в русском перечислении.
- source_word: כֹּל מוּם רָע
  choice: какой-либо серьёзный изъян
  rationale: רָע здесь характеризует физический изъян как тяжёлый или неприемлемый для жертвенного животного, а не как нравственное зло. Смена на «изъян» избегает неестественного повтора слова «порок».
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: не приноси его в жертву
  rationale: Отрицательная форма в законодательном контексте выражает запрет; глагол זבח обозначает заклание именно как жертвенное действие.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твоему Богу
  rationale: Передаёт личное имя יהוה и сохраняет обращение к отдельному слушателю во втором лице единственного числа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не добавляя истолкования.
- issue: Характер выражения מוּם רָע
  choice: серьёзный изъян
  alternative: плохой порок
  rationale: Прилагательное רָע в данном культовом законе описывает неприемлемость физического недостатка, а не нравственное зло; примечание сохраняет буквальную форму выражения.
translation_notes:
  register: Современный литературный русский язык; тон краткий и нормативный. Формулировка «приноси в жертву» яснее передаёт культовый смысл, чем простое «закалывай».
