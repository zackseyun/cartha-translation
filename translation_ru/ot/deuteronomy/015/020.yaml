base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: ru
  text: Ты и твои домашние должны есть его из года в год перед Яхве[a], твоим Богом, в том месте, которое изберёт Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии Яхве, твоего Бога».'
    reason: Лексическая альтернатива для לִפְנֵי, поясняющая идиоматическое значение выражения.
lexical_decisions:
- source_word: לִפְנֵי
  choice: пред
  rationale: Предлог буквально связан с «лицом», но идиоматически означает пребывание перед кем-либо или в чьём-либо присутствии. «Пред» кратко и уместно передаёт культовый контекст трапезы перед Богом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоим Богом
  rationale: Форма с суффиксом второго лица единственного числа означает «твой Бог»; творительный падеж обусловлен русской конструкцией «пред Яхве, твоим Богом».
- source_word: תֹאכֲלֶנּוּ
  choice: должны есть его
  rationale: Имперфект в законодательном наставлении выражает предписание. Местоимение «его» относится к ранее упомянутому первородному животному; множественное сказуемое естественно согласуется в русском с последующим составным субъектом.
- source_word: שָׁנָה בְּשָׁנָה
  choice: из года в год
  rationale: Передаёт распределительное значение ежегодно повторяющегося действия и сохраняет ритмичность еврейского оборота.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: на месте, которое изберёт Яхве
  rationale: Сохраняет характерную для Второзакония формулу о месте богослужения и будущее значение глагола.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: ты и твои домашние
  rationale: «Дом» здесь обозначает людей, составляющих домашнее сообщество. «Домашние» естественно и без излишнего сужения передаёт этот социальный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл לִפְנֵי в контексте священной трапезы
  choice: пред Яхве
  alternative: в присутствии Яхве
  rationale: Оба варианта лексически возможны. Основной текст сохраняет краткую пространственно-реляционную формулу, а примечание явно указывает её идиоматический смысл, не устраняя оттенок священного присутствия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Оборот «пред Яхве» выбран как краткий и торжественный; «домашние» понятно передаёт более широкий смысл домашнего сообщества.
