lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И если
  rationale: Условная формула казуистического закона естественно передаётся по-русски как «И если», сохраняя связь с предыдущим предписанием.
- source_word: יֹאמַר אֵלֶיךָ
  choice: он скажет тебе
  rationale: Имперфект описывает возможный случай; русское будущее время уместно в условной правовой конструкции.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Не уйду от тебя
  rationale: Так естественно передаётся буквальный образ «не выйду от тебя» и подразумеваемый отказ покинуть хозяина после освобождения, без излишнего уточнения смысла в основном тексте.
- source_word: כִּי אֲהֵבְךָ
  choice: потому что любит тебя
  rationale: כִּי вводит причину решения слуги; «потому что» ясно выражает причинную связь.
- source_word: וְאֶת־בֵּיתֶךָ
  choice: и твой дом
  rationale: '«Дом» сохраняет широту בַּיִת: речь может идти не только о строении, но и о семье и всём домашнем укладе; это пояснено в сноске.'
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: и потому что ему хорошо у тебя
  rationale: Фраза естественно передаёт благополучие слуги при хозяине и сохраняет повторную причинную конструкцию.
