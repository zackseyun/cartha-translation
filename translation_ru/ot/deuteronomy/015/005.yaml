  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: ru
  text: Лишь если ты будешь внимательно слушать голос Господа, твоего Бога, и тщательно исполнять всю эту заповедь, которую я предписываю тебе сегодня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: только если
  rationale: Передаёт ограничительно-условное значение выражения в связи с обещанием предыдущего стиха, не превращая его в простое пожелание.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: будешь внимательно слушать
  rationale: Инфинитив абсолютный с личной формой усиливает действие; «внимательно» естественно передаёт эмфазу в современном русском.
- source_word: בְּקוֹל
  choice: голос
  rationale: Выражение «слушать голос» сохраняет конкретный образ еврейского текста и подразумевает послушание без его подстановки в основной текст.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: старательно исполняя
  rationale: Сочетание «хранить/соблюдать, чтобы делать» выражает тщательность практического исполнения; формулировка избегает тяжеловесного буквального удвоения.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: всю эту заповедь
  rationale: Сохраняет единственное число и собирательный охват исходного текста.
- source_word: מְצַוְּךָ
  choice: даю тебе
  rationale: В контексте заповеди современное русское «даю» звучит естественно; содержание повеления уже явно названо существительным «заповедь».
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная и понятная русская передача малым набором в обычном регистре; она не вводит конфессионального толкования и соответствует литературной библейской норме.
- issue: Условный характер обещания
  choice: только если
  alternative: если только / лишь бы
  rationale: Сохраняет реальное условие и связь с контекстом, не ослабляя его до пожелания и не усиливая сверх грамматики.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан естественным, при этом сохранены условность, эмфатическое слушание, образ голоса и собирательное единственное число «заповедь».
