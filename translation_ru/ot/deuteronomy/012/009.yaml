  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: ru
  text: Ведь до сих пор вы ещё не пришли к месту покоя[a] и к наследию, которое Яхве, твой Бог, даёт тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к покою». Еврейское слово מְנוּחָה может обозначать как состояние покоя, так и место покоя; упоминание земли в данном контексте поддерживает более конкретный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего повеления; «ведь» естественно передаёт причинно-пояснительную связь в современном русском языке.
- source_word: בָּאתֶם
  choice: вы пришли
  rationale: Глагол בוא означает «приходить, входить». В сочетании с обозначением цели движения «пришли к» сохраняет широкое значение исходного слова.
- source_word: עַד עָתָּה
  choice: до сих пор … ещё не
  rationale: При отрицании выражение указывает, что действие не совершилось вплоть до настоящего момента; такая конструкция естественна по-русски.
- source_word: הַמְּנוּחָה
  choice: место покоя
  rationale: מְנוּחָה может обозначать как покой, так и место покоя. Контекст вступления в землю поддерживает конкретное пространственное значение, однако абстрактный смысл сохранён в сноске.
- source_word: הַנַּחֲלָה
  choice: наследие
  rationale: נַחֲלָה обозначает полученное в наследственное владение достояние, здесь — даруемую Богом землю. «Наследие» сохраняет оттенки дара и законного удела.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: נֹתֵן
  choice: даёт
  rationale: Причастная форма представляет дарование как совершающееся или уже осуществляемое с точки зрения говорящего; настоящее время сохраняет этот аспект.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Переход от множественного обращения к единственному
  choice: «вы … твой Бог … тебе»
  alternative: «вы … ваш Бог … вам»
  rationale: Еврейский текст переходит от множественного בָּאתֶם к формам единственного числа אֱלֹהֶיךָ и לָךְ, обращаясь к Израилю как к единому народу. Перевод сохраняет этот заметный переход, не устраняя его толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; необычный переход от множественного числа к единственному сохранён вслед за еврейским текстом.
