base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: ru
  text: Приноси свои всесожжения — мясо и кровь — на жертвенник Яхве, Бога твоего; кровь твоих жертв пусть будет вылита на жертвенник Яхве, Бога твоего, а мясо ешь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а мясо можешь есть». В контексте закона эта фраза может выражать разрешение, а не безусловную обязанность.'
    reason: Сохраняется неоднозначность между предписывающим и разрешительным оттенками заключительной глагольной формы.
lexical_decisions:
- source_word: וְעָשִׂיתָ עֹלֹתֶיךָ
  choice: Всесожжения твои… приноси
  rationale: Глагол עשה буквально означает «делать, совершать», но в сочетании с названием жертвы обозначает её совершение или принесение. «Приноси» естественно передаёт культовый смысл, а «всесожжения» — установленное русское обозначение жертв, полностью сжигаемых на жертвеннике.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: и мясо, и кровь
  rationale: В данном жертвенном контексте בשר обозначает мясо жертвенного животного. Парная конструкция «и мясо, и кровь» ясно показывает, что обе части всесожжения относятся к предписанию.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: на жертвеннике Яхве, Бога твоего
  rationale: Предлог עַל здесь указывает на помещение приношения на жертвенник. Имя יהוה передано как «Яхве», то есть как личное имя, а не заменено титулом.
- source_word: וְדַם זְבָחֶיךָ
  choice: кровь твоих жертв
  rationale: זבח — общее обозначение закалываемой жертвы, мясо которой, в отличие от всесожжения, могло употребляться в пищу. Краткое «жертв» точно и понятно без избыточного уточнения.
- source_word: יִשָּׁפֵךְ
  choice: пусть будет вылита
  rationale: Нифаль выражает действие над кровью; форма предписания по-русски естественно передаётся оборотом «пусть будет вылита».
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: а мясо ешь
  rationale: Союз «а» передаёт контраст между кровью, которую следует вылить, и мясом, которое можно есть. Форма «ешь» сохраняет прямой характер еврейского предписания, не исключая разрешительного смысла в данном правовом контексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога Израиля. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Сила заключительной фразы וְהַבָּשָׂר תֹּאכֵל
  choice: а мясо ешь
  alternative: и мясо ешь; а мясо можешь есть
  rationale: Еврейская форма внешне допускает прямое предписание, тогда как контекст закона может придавать ей разрешительный смысл. Основной текст сохраняет форму наставления, а примечание отмечает возможное понимание как разрешения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Инверсия «Всесожжения твои» и обращение «Бога твоего» поддерживают библейское достоинство речи без архаических форм; тире проясняют приложение «и мясо, и кровь».
