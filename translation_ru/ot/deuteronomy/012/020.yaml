base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: ru
  text: 'Когда Господь, твой Бог, расширит твою территорию, как Он обещал тебе, и ты скажешь: «Хочу поесть мяса», потому что тебе захочется мяса, — можешь есть мясо, сколько душе угодно.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: расширит твои пределы
  rationale: Передаёт пространственный смысл идиомы о расширении территории естественным современным русским языком.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная для общедоступного библейского текста.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: 'и ты скажешь: «Хочу поесть мяса»'
  rationale: Когортативная форма выражает желание или намерение; «хочу» естественно передаёт её в данном контексте.
- source_word: כִּי־תְאַוֶּה נַפְשְׁךָ
  choice: потому что тебе захочется мяса
  rationale: Нефеш здесь обозначает самого человека как носителя желания; буквальное «твоя душа возжелает» в современном русском звучит неестественно.
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: сколько душе угодно
  rationale: Естественная русская идиома сохраняет усиленный смысл свободного удовлетворения желания, а не вводит количественный запрет или предписание.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции и не вносит конфессионально маркированной реконструкции произношения.
- issue: Характер разрешения в תֹּאכַל
  choice: ешь мясо
  alternative: ты можешь есть мясо
  rationale: Еврейский имперфект в контексте разрешения допускает императивно-разрешительное русское «ешь»; это сохраняет прямоту формулировки без превращения её в обязанность.
translation_notes:
  register: Современный литературный русский, обращение во втором лице единственного числа сохранено. Формулировка достоинственная, но понятная; еврейская антропологическая идиома передана естественным русским выражением «сколько душе угодно».
