base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: ru
  text: 'Но, как едят газель[a] и оленя, так и ты можешь есть его: нечистый и чистый могут есть его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «косулю».'
    reason: lexical_alternative
  - marker: b
    text: То есть это мясо разрешалось есть как ритуально нечистым, так и ритуально чистым людям.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица вводит уточнение или ограничение по отношению к предшествующему постановлению; «но» естественно передаёт эту связь, не усиливая её до категорического «только».
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: так же, как
  rationale: Коррелятивная конструкция сопоставляет разрешённое употребление упомянутого мяса с употреблением мяса диких животных.
- source_word: יֵאָכֵל
  choice: едят
  rationale: Еврейская пассивная форма имеет обобщённое значение; безлично-обобщённое русское «едят» звучит естественно и не меняет смысла.
- source_word: הַצְּבִי
  choice: газель
  rationale: צְבִי обычно обозначает животное из группы газелей; «газель» — ясный современный эквивалент. Традиционный вариант «серна» отмечен в сноске.
- source_word: הָאַיָּל
  choice: олень
  rationale: אַיָּל обозначает оленя, нередко самца; общее «олень» не вносит излишней конкретизации.
- source_word: תֹּאכְלֶנּוּ
  choice: ты можешь есть его
  rationale: Имперфект в данном законодательном контексте выражает разрешение. Единственное число второго лица сохранено в соответствии с еврейским текстом.
- source_word: הַטָּמֵא
  choice: нечистый
  rationale: Слово обозначает человека в состоянии ритуальной нечистоты, а не нравственно порочного; краткая традиционная формулировка сохранена, а смысл пояснён в сноске.
- source_word: הַטָּהוֹר
  choice: чистый
  rationale: Антонимическая пара с טָמֵא сохранена без добавления толкования в основной текст.
- source_word: יַחְדָּו
  choice: и нечистый, и чистый
  rationale: В данном контексте слово указывает на одинаковое разрешение для обеих категорий, а не обязательно на совместную трапезу; парная конструкция естественно выражает этот смысл по-русски.
- source_word: יֹאכְלֶנּוּ
  choice: могут есть его
  rationale: В юридическом контексте форма выражает разрешение для обеих названных категорий людей.
theological_decisions:
- issue: Обозначение ритуального статуса
  choice: нечистый и чистый
  alternative: ритуально нечистый и ритуально чистый
  rationale: Основной текст сохраняет краткую лексическую пару оригинала. Чтобы эти слова не были поняты как оценка нравственного характера, их ритуально-правовой смысл разъясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Сохранено обращение во втором лице единственного числа, характерное для еврейского текста; синтаксис сделан естественным для современного читателя.
