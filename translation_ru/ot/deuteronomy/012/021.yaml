  verdict: revise
  source_fidelity: 'Смысл еврейского текста в целом передан точно: условие об удалённости избранного места, разрешение заколоть скот, дарованный Яхве, ссылка на прежнее повеление Моисея и разрешение есть в своих поселениях сохранены. «В своих городах» обоснованно передаёт метонимическое בִּשְׁעָרֶיךָ при буквальном варианте в сноске.'
  naturalness: Нужна небольшая стилистико-синтаксическая правка. В конструкции «можешь заколоть … и есть» модальность при втором глаголе подразумевается, но явное повторение «можешь» делает юридическое разрешение яснее. Формула «сколько пожелает твоя душа» естественнее передаёт обстоятельственное בְּכֹל אַוַּת נַפְשֶׁךָ, чем «есть всё, чего пожелает твоя душа».
  terminology: «Яхве», «крупный и мелкий скот», «заколоть» и «душа» уместны. «Заколоть» не вносит несоответствующего контексту значения обязательного жертвоприношения. Строчная буква в «своё имя» не меняет смысла и избегает внесения издательского конфессионального знака в перевод.
  issues:
