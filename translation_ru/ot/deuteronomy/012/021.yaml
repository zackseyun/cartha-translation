    issue: Неявная модальность второго глагола
    rationale: В русском «можешь заколоть … и есть» допустимо, но «и можешь есть» яснее передаёт продолжающееся правовое разрешение.
  - severity: low
    issue: Передача בְּכֹל אַוַּת נַפְשֶׁךָ как объекта «всё, чего пожелает…»
    rationale: Еврейское выражение характеризует меру или полноту желания при еде; «сколько пожелает твоя душа» сохраняет образ «души» и более естественно звучит по-русски.
