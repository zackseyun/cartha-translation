source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: ru
  text: Если место, которое Яхве, твой Бог, изберёт, чтобы поместить там своё имя, будет далеко от тебя, то можешь заколоть животных из крупного и мелкого скота, который дал тебе Яхве, как я повелел тебе, и можешь есть в своих городах[a] столько, сколько пожелает твоя душа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в своих воротах»; то есть в своих городах или поселениях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сколько пожелает твоя душа»; по смыслу также: «сколько захочешь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: Если… будет далеко от тебя
  rationale: כִּי вводит условие, а רחק обозначает удалённость. Русская условная конструкция естественно передаёт юридическую ситуацию, не усиливая её словом «слишком».
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: место, которое… изберёт
  rationale: Будущее время естественно для повторяющейся во Второзаконии формулы о ещё не указанном месте святилища.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: чтобы поместить там Своё имя
  rationale: Сохраняется прямое значение שׂים и характерная для Второзакония формула без толкования «поселить имя».
- source_word: וְזָבַחְתָּ
  choice: то можешь заколоть
  rationale: В контексте разрешается местный забой животных для пищи, а не жертвоприношение; «можешь» передаёт разрешительный смысл предписания.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: животных из крупного и мелкого скота
  rationale: בקר и צאן — собирательные обозначения крупного и мелкого домашнего скота; добавление «животных» делает партитивную конструкцию с מִ естественной по-русски.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: как я повелел тебе
  rationale: Сохранено первое лицо говорящего — Моисея — и отсылка к ранее данным установлениям.
- source_word: בִּשְׁעָרֶיךָ
  choice: в своих городах
  rationale: Буквально «в твоих воротах»; здесь ворота метонимически обозначают города или поселения. В основном тексте выбран ясный современный эквивалент, буквальный образ указан в примечании.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: всё, чего пожелает твоя душа
  rationale: Формулировка сохраняет נֶפֶשׁ («душа, сам человек») и одновременно звучит естественно по-русски; в данном контексте желание включает аппетит.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Характер заклания вне избранного святилища
  choice: разрешение заколоть животных для обычной еды
  alternative: повеление принести их в жертву
  rationale: Ближайший контекст противопоставляет удалённость центрального святилища местному употреблению мяса в пищу; поэтому זבח здесь не следует передавать словом, однозначно обозначающим жертвоприношение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено обращение к одному человеку во втором лице единственного числа, соответствующее еврейскому тексту. Заглавная буква в местоимении «Своё» употреблена как издательский знак почтительности, не меняющий смысла.
