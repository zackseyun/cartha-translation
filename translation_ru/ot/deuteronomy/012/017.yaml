  source_fidelity: 'Перечень передан полно и в верном порядке; «в городах» адекватно передаёт идиому בִּשְׁעָרֶיךָ, а культовые категории десятины, первенцев и добровольных приношений различены. Однако «приношения по любым обетам, которые ты дашь» синтаксически связывает «которые ты дашь» с «обетами» не вполне гладко и менее точно передаёт контекстуальный референт נְדָרֶיךָ как посвящённых по обету даров. Более естественно и ясно: «все приношения, обещанные тобой по обету».'
