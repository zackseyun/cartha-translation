  terminology: «Десятина», «молодое вино», «первенцы», «добровольные приношения» уместны. Для נְדָרֶיךָ основной текст должен отражать, что в данном перечне речь идёт о дарах, связанных с обетом, а сноска — сохранять буквальное «обеты». Для תְּרוּמַת יָדֶךָ нейтральное «приношение» оправданно; техническое «возношение» оставлено альтернативой в сноске.
