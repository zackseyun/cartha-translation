  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: ru
  text: Ты не должен есть в своих городах[a] десятину от твоего зерна, молодого вина и масла, первенцев твоего крупного и мелкого скота, все приношения, обещанные тобой по обету[b], добровольные приношения и приношение от твоей руки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих воротах»; здесь это выражение означает местные города или поселения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все твои обеты, которые ты дашь». В данном перечне имеются в виду приношения, посвящённые по обету, а не только произнесённые обещания.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «возношение твоей руки». Точное культовое значение выражения не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: Нельзя тебе есть
  rationale: Сочетание יכל с инфинитивом в данном законодательном контексте выражает запрет, а не физическую неспособность. Русская конструкция передаёт это прямо и естественно.
- source_word: בִּשְׁעָרֶיךָ
  choice: в твоих городах
  rationale: Буквально «в твоих воротах»; это устойчивое обозначение местных поселений. Основной текст передаёт смысл идиомы, а буквальный образ сохранён в сноске.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: десятину от твоего зерна
  rationale: מַעְשַׂר — установленная десятая доля, а דָּגָן обозначает зерно, а не урожай вообще.
- source_word: תִּירֹשְׁךָ
  choice: молодого вина
  rationale: תִּירוֹשׁ обычно обозначает новое, молодое вино и отличается от более общего обозначения вина.
- source_word: יִצְהָרֶךָ
  choice: масла
  rationale: Слово обычно относится к маслу, прежде всего оливковому; более общее «масло» не добавляет отсутствующего в тексте уточнения.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: первенцев твоего крупного и мелкого скота
  rationale: בְּכוֹר обозначает перворождённое животное; בָּקָר и צֹאן естественно передаются как крупный и мелкий скот.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: приношения по любым обетам, которые ты дашь
  rationale: Буквально речь идёт об «обетах, которые ты дашь», однако в перечне того, что можно есть, подразумеваются посвящённые по обету приношения. Формулировка сохраняет и культовый контекст, и упоминание самого обета.
- source_word: נִדְבֹתֶיךָ
  choice: добровольные приношения
  rationale: Это установленная категория приношений, добровольно посвящаемых вне обязательства по обету.
- source_word: תְּרוּמַת יָדֶךָ
  choice: приношение из твоей руки
  rationale: תְּרוּמָה — отделённый дар или приношение; необычное дополнение «руки» сохранено без навязывания спорного технического значения.
theological_decisions:
- issue: Культовое значение נְדָרֶיךָ в перечне съедаемых святынь
  choice: приношения по любым обетам, которые ты дашь
  alternative: любые обеты, которые ты дашь
  rationale: Само слово означает «обеты», но объектом действия «есть» являются не произнесённые обещания, а связанные с ними посвящённые дары. Перевод делает контекстуальный референт явным, не устраняя связи с обетом.
- issue: Значение תְּרוּמַת יָדֶךָ
  choice: приношение из твоей руки
  alternative: возношение твоей руки
  rationale: Точное ритуальное значение выражения допускает разное понимание. Нейтральное «приношение» сохраняет культовый характер, а образ руки — подлинную неясность еврейской формулы.
translation_notes:
  register: Современный литературный русский язык с прямым законодательным тоном. Культовые категории различены без архаизации; синтаксический параллелизм и обращение во втором лице единственного числа сохранены.
