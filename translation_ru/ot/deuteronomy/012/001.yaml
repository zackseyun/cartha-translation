base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: ru
  text: Вот постановления и правовые нормы[a], которые вы должны тщательно исполнять в земле, которую Яхве, Бог твоих отцов, дал тебе во владение[b], — во все дни вашей жизни на земле[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и законы»; מִשְׁפָּטִים может обозначать также судебные решения или обязательные установления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы ты унаследовал её»; глагол ירשׁ может выражать как получение наследия, так и вступление во владение.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на земле»; слово אֲדָמָה может также означать «суша» или «страна». Некоторые понимают это выражение более узко: «на этой земле».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественно вводит следующий далее свод законов; связка «суть» в современном русском не требуется.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Передаёт формально-правовой характер חֻקִּים и сохраняет отличие от следующего מִשְׁפָּטִים.
- source_word: וְהַמִּשְׁפָּטִים
  choice: и правовые нормы
  rationale: Передаёт юридический смысл решений и обязательных правил, не смешивая слово с חֻקִּים; возможны также «законы» или «судебные решения».
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: которые вы должны тщательно исполнять
  rationale: Сочетание שׁמר с инфинитивом выражает внимательное соблюдение на деле, а не простое хранение.
- source_word: בָּאָרֶץ
  choice: в земле
  rationale: В контексте Второзакония речь идёт о земле, отдаваемой Израилю во владение; сохранён территориальный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Бог твоих отцов
  rationale: Сохранена заветная формула и единственное число местоимения в еврейском тексте.
- source_word: לְךָ לְרִשְׁתָּהּ
  choice: дал тебе, чтобы ты овладел ею
  rationale: Сохранены единственное число адресата и целевое значение конструкции; ירשׁ здесь означает вступить во владение землёй.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: во все дни, пока вы живёте
  rationale: Переданы всеохватность времени и возвращение еврейского текста к множественному числу адресатов.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: אֲדָמָה допускает значения «земля», «суша», «почва»; здесь выражение естественно обозначает всё время земной жизни, хотя возможно более узкое территориальное понимание.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное заветное имя; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Чередование единственного и множественного числа адресата
  choice: Сохранены формы «вы… твоих… тебе… ты… вы»
  alternative: Согласовать всё во множественном числе ради гладкости
  rationale: Еврейский текст намеренно или стилистически переходит от множественного числа к единственному и обратно. Перевод сохраняет эту особенность, не устраняя возможное представление об Израиле одновременно как о народе и как о едином адресате.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным правовым регистром. Сохранены синтаксически заметные переходы между множественным и единственным числом адресата, присутствующие в масоретском тексте.
