source:
  edition: WLC
  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: ru
  text: Туда приносите ваши всесожжения, жертвы, десятины, приношение от вашей руки[a], приношения по обетам[b], добровольные приношения и первенцев вашего крупного и мелкого скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приношение вашей руки»; то есть дар, который вы лично представляете.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ваши обеты»; в этом перечне, вероятно, имеются в виду приношения во исполнение обетов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: приносите
  rationale: В данном предписании хифиль глагола בוא означает доставлять перечисленное к указанному месту; форма настоящего времени с повелительным значением естественна для современного русского языка.
- source_word: שָׁמָּה
  choice: туда
  rationale: Наречие направительно указывает на ранее названное место поклонения; «туда» точнее передаёт движение к нему, чем статическое «там».
- source_word: עֹלֹתֵיכֶם
  choice: ваши всесожжения
  rationale: עוֹלָה обозначает жертву, целиком сжигаемую на жертвеннике; «всесожжение» — точный и устоявшийся русский термин.
- source_word: וְזִבְחֵיכֶם
  choice: жертвы
  rationale: זֶבַח — широкое обозначение закалываемых жертв, отличных от всесожжений; общий термин не вводит неоправданного уточнения.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: десятины
  rationale: Существительное обозначает доли в одну десятую; «десятины» является ясным и традиционным эквивалентом.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: приношение от вашей руки
  rationale: תְּרוּמָה означает выделенный дар или приношение, а יֶדְכֶם буквально сохраняет образ руки как того, чем дар лично представляется. Предлог «от» делает выражение естественнее по-русски, не устраняя образ.
- source_word: נִדְרֵיכֶם
  choice: приношения по обетам
  rationale: Буквально слово может означать «ваши обеты», но в перечне предметов, которые приносят, подразумеваются дары во исполнение обетов. Формулировка раскрывает контекстуальный смысл, а сноска сохраняет буквальную возможность.
- source_word: נִדְבֹתֵיכֶם
  choice: добровольные приношения
  rationale: נְדָבָה обозначает дар, принесённый добровольно, а не во исполнение обета; формулировка ясно сохраняет это различие.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: первенцев вашего крупного и мелкого скота
  rationale: בָּקָר и צֹאן противопоставляют крупный скот мелкому стадному скоту, включая овец и коз; русский парный термин точно и компактно передаёт охват.
theological_decisions:
- issue: Значение נִדְרֵיכֶם в культовом перечне
  choice: приношения по обетам
  alternative: ваши обеты
  rationale: Контекст перечисляет то, что физически доставляют к месту поклонения, поэтому вероятнее имеются в виду дары во исполнение обетов. Однако эллиптичность оригинала отмечена в сноске и не превращена в догматическое уточнение.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. Синтаксис перечня сохранён, но громоздкость ограничена; термины «всесожжения», «десятины» и «первенцы» понятны в библейском контексте. Все притяжательные формы переданы без архаического «ваши ... ваши» перед каждым однородным членом там, где русский язык допускает естественное объединение.
