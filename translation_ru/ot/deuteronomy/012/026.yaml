  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: ru
  text: Но только твои святыни, которые будут у тебя, и приношения по твоим обетам[a] понесёшь и придёшь к месту, которое изберёт Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твои обеты». Здесь это может означать либо сами обеты, либо, в жертвенном контексте, приношения во исполнение этих обетов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Но
  rationale: Частица вводит ограничение по отношению к предшествующим разрешениям и предписаниям; русское «но» естественно передаёт противопоставление, а ограничительный смысл раскрывается самим требованием нести святыни к избранному месту.
- source_word: קָדָשֶׁיךָ
  choice: святыни
  rationale: Слово обозначает посвящённые Богу священные предметы или дары и шире названия какого-либо одного вида жертвы.
- source_word: אֲשֶׁר יִהְיוּ לְךָ
  choice: которые будут у тебя
  rationale: Сохранены будущая форма глагола и значение принадлежности или нахождения в распоряжении человека.
- source_word: וּנְדָרֶיךָ
  choice: и приношения по твоим обетам[a]
  rationale: Буквально речь идёт об «обетах», но в жертвенном контексте слово может метонимически обозначать дары, приносимые во исполнение обетов; сноска сохраняет буквальную альтернативу.
- source_word: תִּשָּׂא וּבָאתָ
  choice: возьми с собой и приди
  rationale: 'Передана последовательность двух действий: человек должен нести святыни и прийти с ними к указанному месту, а не просто абстрактно «принести» их.'
- source_word: הַמָּקוֹם
  choice: место
  rationale: Сохранено ключевое для Второзакония общее обозначение избираемого Богом места поклонения без преждевременного уточнения «святилище».
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: которое изберёт Яхве
  rationale: Будущая форма соответствует перспективе избрания места, а тетраграмматон передан личным именем «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Значение וּנְדָרֶיךָ в жертвенном контексте
  choice: приношения по твоим обетам
  alternative: твои обеты
  rationale: Контекст предполагает нечто, что можно нести к избранному месту, поэтому основному тексту придано конкретное культовое значение; буквальная формулировка оставлена в сноске, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка остаётся понятной неспециалисту; «святыни» сохраняет широту исходного культового термина, а «возьми с собой и приди» естественно воспроизводит два еврейских глагола.
