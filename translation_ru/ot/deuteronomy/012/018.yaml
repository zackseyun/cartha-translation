  to: Ешь это только перед Яхве, твоим Богом, на месте, которое изберёт Яхве, твой Бог, — ты, твой сын, твоя дочь, твой раб, твоя рабыня и левит, который живёт в твоих городах[a]. И радуйся перед Яхве, твоим Богом, во всех делах твоих рук[b].
