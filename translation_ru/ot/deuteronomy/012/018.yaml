base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: ru
  text: Ешь это только перед Яхве, твоим Богом, на месте, которое изберёт Яхве, твой Бог, — ты, твой сын, твоя дочь, твой раб, твоя рабыня и левит, который живёт в твоих городах[a]. И радуйся перед Яхве, твоим Богом, во всех делах твоих рук[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих воротах». Это древнееврейское выражение обозначает людей, живущих в твоих городах или местной общине.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «во всём посылании твоей руки», то есть во всех делах, трудах и начинаниях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: только
  rationale: После запрета в предыдущем стихе оборот вводит единственно допустимую альтернативу. Русская конструкция «ешь это только…» ясно передаёт ограничительное значение.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: пред Яхве, твоим Богом
  rationale: לִפְנֵי означает «перед, в присутствии». «Пред» сохраняет торжественный, но понятный библейский регистр; имя יהוה передано как «Яхве».
- source_word: תֹּאכְלֶנּוּ
  choice: ешь это
  rationale: Форма 2-го лица единственного числа с объектным суффиксом относится к перечисленному ранее священному приношению и в контексте имеет предписывающую силу.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: на месте, которое изберёт Яхве, твой Бог
  rationale: Передана обычная для Второзакония формула об избранном Богом месте. Местоименный элемент בּוֹ естественно поглощается русской относительной конструкцией.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: твой раб, твоя рабыня
  rationale: Сохранено различение мужчины и женщины и конкретный социальный статус древнего текста; более мягкое «слуга» могло бы его затушевать.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: левит, который живёт в твоих воротах
  rationale: Дословный образ «в воротах» сохранён в тексте, а его общественно-территориальный смысл пояснён в сноске.
- source_word: וְשָׂמַחְתָּ
  choice: и радуйся
  rationale: Глагол выражает деятельную радость праздничного богослужения; повелительное русское выражение соответствует предписывающей функции еврейской формы.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: всем делам своих рук
  rationale: Русский оборот сохраняет образ руки и передаёт смысл занятий, трудов и начинаний человека, не сужая его до одного вида деятельности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, а не титул; транслитерация сохраняет это различие без добавления конфессионального толкования.
- issue: Значение радости «пред Яхве»
  choice: сохранена формула без поясняющего богословского расширения
  alternative: истолковать её как радость исключительно в богослужении или как благословение всякого труда
  rationale: Контекст связывает радость с общей священной трапезой, но заключительный оборот охватывает дела человека шире; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены обращение в единственном числе, повтор имени Бога, полный перечень членов дома и образ «дел рук»; архаические формы и излишне канцелярская лексика избегаются.
