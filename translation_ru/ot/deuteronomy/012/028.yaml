  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: ru
  text: Соблюдай и слушай все эти слова, которые я заповедую тебе, чтобы тебе и твоим детям[a] после тебя было хорошо вовеки, ибо ты будешь делать то, что хорошо и правильно в глазах Яхве, твоего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «детям», буквально означает «сыновья», но здесь может относиться шире к детям или потомкам.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Внимательно слушай
  rationale: Сочетание глаголов выражает тщательное внимание к услышанному с подразумеваемым соблюдением. Естественная русская формулировка передаёт совместную силу обоих глаголов, не сводя שׁמע исключительно к «повинуйся»; более буквальная структура отмечена в сноске.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: Сохраняет буквальное значение דְּבָרִים и уместно в контексте произносимых Моисеем повелений.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: которые я заповедую тебе
  rationale: Причастная форма передаёт совершаемое сейчас наставление; «заповедую» естественно и точно выражает מְצַוֶּה в данном контексте.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: чтобы тебе … было хорошо
  rationale: Передаёт целевую конструкцию и обычную для Второзакония формулу благополучия ясным современным русским языком.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: и твоим детям после тебя
  rationale: בָּנִים формально может означать «сыновья», но в формуле о последующих поколениях охватывает детей и потомство; двусмысленность отмечена в сноске.
- source_word: עַד עוֹלָם
  choice: всегда
  rationale: В данном обещании обозначает неограниченную продолжительность в будущем; «всегда» звучит естественнее, чем тяжеловесное «навеки».
- source_word: כִּי
  choice: ибо
  rationale: Сохраняет причинно-пояснительную связь выбранного чтения, не превращая её в явное условие.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: то, что хорошо и правильно
  rationale: Субстантивированные прилагательные переданы естественной русской конструкцией с сохранением двух аспектов нравственной оценки.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачную древнееврейскую метафору божественной оценки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное заветное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Объём значения בָנֶיךָ
  choice: твоим детям
  alternative: твоим сыновьям; твоим потомкам
  rationale: В заветной формуле слово обозначает семейное потомство и не требует ограничения только лицами мужского пола; сноска сохраняет буквальную форму.
- issue: Связь, вводимая כִּי
  choice: ибо
  alternative: когда; если
  rationale: Причинное чтение согласуется с непосредственной синтаксической связью и сохраняет напряжение между обещанием благополучия и требуемым правильным поведением, не превращая фразу в однозначное условие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формы «заповедую» и «ибо» сохраняют достоинство речи, оставаясь понятными; синтаксис не перегружен архаизмами.
