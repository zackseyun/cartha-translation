  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: ru
  text: 'Тогда будет место, которое Яхве, ваш Бог, изберёт, чтобы поселить там Своё имя[a]; туда приносите всё, что Я повелеваю вам: ваши всесожжения, жертвы, десятины, приношение от ваших рук и всё лучшее из обетов, которые вы дадите Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы Он дал Своему имени пребывать там».'
    reason: Еврейский глагол стоит в каузативной форме; основной текст передаёт её естественным русским глаголом «поселить», а сноска сохраняет более формальную передачу конструкции.
lexical_decisions:
- source_word: וְהָיָה
  choice: Тогда
  rationale: Передаёт переход к будущему обстоятельству и следствию из предшествующих наставлений естественным русским оборотом.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: в то место, которое ... изберёт
  rationale: Сохраняет ключевое понятие конкретного избранного места и будущую направленность контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы там пребывало Его имя
  rationale: Сохраняет образ пребывания имени и естественно звучит по-русски; каузативная форма отражена в сноске.
- source_word: שָׁמָּה תָבִיאוּ
  choice: в то место ... приносите
  rationale: Русская конструкция передаёт направленность движения и директивную силу глагола без избыточного повторения наречия места.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: всё, что я повелеваю вам
  rationale: Передаёт всеохватность и продолжающуюся нормативную силу повеления естественным современным русским языком.
- source_word: עוֹלֹתֵיכֶם
  choice: ваши всесожжения
  rationale: Устоявшийся точный термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: זִבְחֵיכֶם
  choice: жертвы
  rationale: Сохраняет широту еврейского существительного и не сужает его до одного вида мирной жертвы.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: десятины
  rationale: Общепринятый и точный эквивалент для приношений десятой части.
- source_word: תְרֻמַת יֶדְכֶם
  choice: приношения ваших рук
  rationale: Сохраняет конкретный еврейский образ личного приношения, оставаясь понятным по-русски.
- source_word: כֹל מִבְחַר נִדְרֵיכֶם
  choice: всё лучшее из обетов
  rationale: Передаёт значение отборного, лучшего и не добавляет отсутствующее в оригинале существительное «приношения».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал прямо употребляет личное имя Бога; транслитерация сохраняет это отличие от титула.
- issue: Второзаконническая формула לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы там пребывало Его имя
  alternative: чтобы Он поселил там Своё имя; чтобы поместить там Своё имя
  rationale: Основной текст сохраняет образ пребывания имени, не отождествляя его без пояснения с локализацией самого Бога; каузативная неоднозначность отмечена в сноске.
- issue: מִבְחַר נִדְרֵיכֶם
  choice: всё лучшее из обетов
  alternative: все лучшие обетные приношения
  rationale: Не добавляет категорию «приношений», которой нет явно в еврейском тексте, и сохраняет напряжённую, несколько сжатую формулировку оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы «изберёт», «повелеваю», «всесожжения» сохраняют сакральный регистр, но синтаксис остаётся ясным для обычного читателя. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской издательской практике.
