review_pass:
  verdict: revise
  source_fidelity: 'Основные лексические соответствия верны: Яхве передаёт יהוה, «всесожжения», «жертвы» и «десятины» адекватны. Однако русское «в то место ... приносите» синтаксически тяжеловесно; явное «туда» точнее передаёт направительное שָׁמָּה. «Приношения ваших рук» неестественно и меняет единственное число תְּרוּמַת; «приношение от ваших рук» сохраняет образ и число. В основной формулировке имени следует предпочтительно сохранить каузативный оттенок глагола הִשְׁכִּין, не сводя его только к самостоятельному пребыванию имени.'
  naturalness: 'Исправленная фраза строится естественно для современного литературного русского: сначала называется избранное место, затем указание «туда». «Обеты, которые вы дадите Яхве» — нормативный русский способ передать «дать обет».'
  terminology: «Яхве», «всесожжения», «жертвы», «десятины» и «обеты» сохранены. «Поселит там Своё имя» передаёт каузатив הִשְׁכִּין без богословского истолкования; сноска отмечает более буквальный вариант, не устраняя образность текста.
