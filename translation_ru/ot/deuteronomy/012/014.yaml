  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: ru
  text: а только на том месте, которое Яхве изберёт в одном из твоих племён[a]. Там возноси свои всесожжения, и там делай всё, что Я повелеваю тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на территории одного из твоих племён.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: а только
  rationale: 'В продолжение запрета предыдущего стиха сочетание выражает ограничительное противопоставление: жертвоприношения разрешены исключительно в избранном месте.'
- source_word: בַּמָּקוֹם
  choice: на том месте
  rationale: Определённая форма указывает на конкретное место богослужения; по-русски применительно к совершению жертвоприношений естественно «на том месте».
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: которое Яхве изберёт
  rationale: Форма יִבְחַר здесь имеет перспективное значение и говорит о будущем выборе места; личное имя יהוה передано как «Яхве».
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: в одном из твоих племён
  rationale: Сохранена буквальная общественно-заветная терминология источника; по смыслу речь идёт о территории одного из племён, что пояснено в сноске.
- source_word: שָׁם
  choice: там
  rationale: Оба повтора наречия сохранены, поскольку они подчёркивают исключительность избранного места.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: возноси свои всесожжения
  rationale: Каузатив глагола עלה в сочетании с עֹלָה обозначает принесение жертвы, восходящей в огне; «возноси» сохраняет образность и культовый смысл.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: всё, что я повелеваю тебе
  rationale: Передаёт всеохватность כֹּל и продолжающееся в момент речи повеление без тяжеловесной русской конструкции.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Исключительность места жертвоприношения
  choice: а только на том месте
  alternative: кроме того места
  rationale: Формулировка сохраняет связь с запретом в предыдущем стихе и подчёркивает единственное разрешённое место, не уточняя сверх текста, где именно оно будет находиться.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Единственное число обращений («твоих», «тебе») сохранено. Повтор «там» и культовый термин «всесожжения» переданы последовательно.
