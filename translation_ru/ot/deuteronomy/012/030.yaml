  source_fidelity: 'Перевод точно передаёт двойное предостережение הִשָּׁמֶר... פֶּן: опасность быть пойманным в западню вслед за этими народами и опасность разузнавать о способах служения их богам с намерением подражать. Образ נקש («попасть в западню») сохранён. «После того, как они будут истреблены перед тобой» адекватно передаёт הִשָּׁמְדָם מִפָּנֶיךָ, включая перспективный характер контекста. Заключительное «Стану и я делать так же» верно выражает וְאֶעֱשֶׂה כֵּן גַּם אָנִי.'
