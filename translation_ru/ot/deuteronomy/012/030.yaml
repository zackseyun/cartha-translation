  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּנָּקֵשׁ֙ אַחֲרֵי/הֶ֔ם אַחֲרֵ֖י הִשָּׁמְדָ֣/ם מִ/פָּנֶ֑י/ךָ וּ/פֶן תִּדְרֹ֨שׁ לֵֽ/אלֹהֵי/הֶ֜ם לֵ/אמֹ֨ר אֵיכָ֨ה יַעַבְד֜וּ הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֶת אֱלֹ֣הֵי/הֶ֔ם וְ/אֶעֱשֶׂה כֵּ֖ן גַּם אָֽנִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: ru
  text: 'Берегись, чтобы не попасть в западню, последовав за ними после того, как они будут истреблены перед тобой, и чтобы не стал ты расспрашивать об их богах: «Как эти народы служили своим богам? Стану и я делать так же».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Естественно передаёт возвратное предостережение «береги себя / будь осторожен», не перегружая русскую фразу буквальным «для себя».
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: чтобы не попасть в западню, последовав за ними
  rationale: Глагол נקש выражает образ попадания в силки или западню; אַחֲרֵיהֶם допускает смысл следования за ними, который сохранён без устранения образности.
- source_word: הִשָּׁמְדָם מִפָּנֶיךָ
  choice: они будут истреблены перед тобой
  rationale: Сохраняет пассивную форму и пространственно-реляционное מִפָּנֶיךָ; будущее соответствует перспективе наставления перед входом в землю.
- source_word: תִּדְרֹשׁ לֵאלֹהֵיהֶם
  choice: стал ты расспрашивать об их богах
  rationale: דרש здесь означает разузнавать или исследовать способы чужого богослужения; «расспрашивать» естественно выражает этот контекст.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: Стану и я делать так же
  rationale: Передаёт намерение подражать описанному служению и сохраняет усилительное גַּם אָנִי — «и я».
theological_decisions:
- issue: Характер запрещённого интереса к чужим богам
  choice: Сохранено прямое предостережение против расспросов, ведущих к подражанию их служению
  alternative: Истолковать как запрет любого знания о чужих религиях
  rationale: Текст связывает расспрос с намерением «делать так же», но не формулирует универсального запрета на всякое изучение; перевод не расширяет запрет сверх контекста.
- issue: Образ духовной опасности
  choice: Сохранён образ западни
  alternative: 'Передать отвлечённо: «не соблазниться» или «не увлечься»'
  rationale: Образ נקש конкретен и подчёркивает опасность, не задавая дополнительной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Синтаксис несколько упрощён ради ясности, при этом последовательность предостережений и образ западни сохранены.
