  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: ru
  text: И там, перед Яхве, вашим Богом, ешьте и радуйтесь всем вашим трудам и начинаниям, которыми благословил тебя Яхве, твой Бог, — вы и ваши семьи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: ешьте
  rationale: Последовательная форма с ו в законодательном контексте выражает предписанное действие; русский императив естественно передаёт эту силу.
- source_word: שָׁם
  choice: там
  rationale: Сохраняет указание на место, которое Яхве изберёт согласно ближайшему контексту, без поясняющего расширения.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: пред Яхве, вашим Богом
  rationale: «Пред» передаёт присутствие Бога в контексте богослужения; личное имя יהוה транслитерировано как «Яхве».
- source_word: וּשְׂמַחְתֶּם
  choice: и радуйтесь
  rationale: Императив сохраняет параллель с «ешьте» и предписанный характер общей радости.
- source_word: מִשְׁלַח יֶדְכֶם
  choice: всему, к чему приложили руки
  rationale: Современный русский оборот передаёт еврейскую идиому о делах и начинаниях, сохраняя образ руки; буквальная форма и смысловые варианты приведены в сноске.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: вы и ваши семьи
  rationale: בָּתִּים здесь обозначает домашние сообщества, а не здания; «семьи» понятно передаёт состав участников общей трапезы.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: всему, чем благословил тебя Яхве, твой Бог
  rationale: Относительное предложение связано со сферой труда и начинаний как с данным Богом благословением. Повтор «всему» делает эту связь ясной по-русски, а переход к единственному числу сохраняет смену адресации в еврейском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Смена множественного и единственного числа в обращении
  choice: сохранить множественное число в начале («вашим», «вы», «ваши») и единственное в конце («тебя», «твой»)
  alternative: 'Выровнять всё обращение по множественному числу: «вас… ваш Бог»'
  rationale: Еврейский текст намеренно или по характерной для Второзакония риторике переходит от множественного адресата к собирательному единственному. Сохранение перехода не сглаживает эту особенность.
- issue: Смысл связи אֲשֶׁר с предшествующей фразой
  choice: 'относительная связь: «всему, чем благословил тебя»'
  alternative: 'причинная связь: «потому что Яхве… благословил тебя»'
  rationale: אֲשֶׁר естественно допускает отнесение к делам и начинаниям как к области Божьего благословения; причинное понимание возможно, но в основном тексте сохранена более прямая относительная конструкция.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. «Пред» выбрано как краткое и достойное обозначение пребывания в Божьем присутствии. Смена числа в обращении сохранена, несмотря на её необычность для русского, ради формы исходного текста.
