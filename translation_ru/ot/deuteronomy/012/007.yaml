  revision_rationale: Текст перестроен так, чтобы относительное предложение «которыми благословил тебя Яхве» ясно определяло «труды и начинания», как в исходной фразе. Сохранены повелительная сила глаголов, имя «Яхве», общий характер «домов» как семей/домашних сообществ и исходный переход от множественного адресата к единственному. Сноска сохранена как полезное указание на образ руки, но её буквальная формулировка уточнена.
