  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: ru
  text: Берегись приносить свои всесожжения в любом месте, какое увидишь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Берегись приносить свои всесожжения в каждом месте, какое увидишь».'
    reason: 'Еврейское בְּכָל מָקוֹם может быть передано более буквально, с распределительным значением: «в каждом месте». В данном предостережении «в любом месте» естественно выражает запрет приносить жертвы где угодно.'
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: 'Возвратная форма повеления с местоимением выражает настойчивое предостережение: «будь настороже», «берегись». Краткое «берегись» естественно и сохраняет силу еврейской формулы.'
- source_word: פֶּן
  choice: чтобы тебе не
  rationale: Частица вводит предотвращаемое действие после предостережения. Конструкция «берегись, чтобы тебе не…» передаёт её отрицательно-предупредительное значение современным русским языком.
- source_word: תַּעֲלֶה
  choice: возносить
  rationale: Hifil глагола עלה буквально означает «поднимать, заставлять восходить» и употребляется о принесении жертвы на алтаре. «Возносить всесожжения» сохраняет культовый смысл и образ восходящей жертвы.
- source_word: עֹלֹתֶיךָ
  choice: свои всесожжения
  rationale: עֹלָה — установленное обозначение жертвы, целиком сжигаемой на алтаре. «Всесожжение» — точный и узнаваемый русский библейский термин; возвратное «свои» естественно соотносит жертвы с адресатом.
- source_word: בְּכָל מָקוֹם
  choice: на любом месте
  rationale: 'В контексте запрета כָּל имеет распределительно-неопределённый смысл: нельзя приносить жертвы где угодно. «На любом месте» естественно передаёт запрет произвольно выбирать место; буквально возможно также «на каждом месте».'
- source_word: אֲשֶׁר תִּרְאֶה
  choice: какое увидишь
  rationale: Перевод сохраняет конкретный глагол «видеть» и не добавляет прямо не выраженного значения «выберешь», хотя в контексте подразумевается место, приглянувшееся человеку.
theological_decisions:
- issue: Требование единого места жертвоприношения
  choice: Передать прямой запрет возносить всесожжения в произвольно выбранном месте.
  alternative: Развернуть стих как общий запрет всякого богослужения вне центрального святилища.
  rationale: Контекст главы устанавливает централизацию культа, но данный стих непосредственно говорит о всесожжениях и местах, которые человек видит. Перевод не расширяет формулировку стиха за пределы сказанного.
translation_notes:
  register: Современный литературный русский с достоинством законодательного предостережения. «Берегись» сохраняет краткость и настойчивость оригинала; «возносить всесожжения» удерживает культовую терминологию и образность исходного текста. Местоимения даны в единственном числе, как в еврейском тексте.
