base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: ru
  text: Разрушьте их жертвенники, разбейте их священные каменные столбы, сожгите их ашеры огнём, изрубите резные изображения их богов[b] и сотрите их имя с того места[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ашеры — культовые предметы, связанные с ханаанской богиней Ашерой; возможно, священные деревянные столбы или иные её символы.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «идолов их богов». Еврейское выражение подчёркивает, что это изготовленные, вырезанные изображения.'
    reason: lexical_alternative
  - marker: c
    text: «Стереть их имя с того места» означает устранить оттуда их культовое присутствие и память о них, а не только стереть написанные имена.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: разрушьте их жертвенники
  rationale: נתץ обозначает разрушение возведённых сооружений; «разрушьте» естественно сочетается с «жертвенниками» и передаёт требование полного уничтожения.
- source_word: שִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: разбейте их священные камни
  rationale: מַצֵּבָה — культовый стоячий камень или каменный столб. «Священные камни» ясно передаёт предмет и его культовое назначение, не смешивая его с обычными колоннами.
- source_word: אֲשֵׁרֵיהֶם
  choice: их ашеры
  rationale: Термин обозначает культовые предметы, связанные с богиней Ашерой; транслитерация сохраняет культурную специфику и неоднозначность точного вида этих предметов.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: сожгите
  rationale: В русском глагол «сжечь» уже выражает уничтожение огнём, поэтому отдельное «огнём» было бы тяжеловесным повтором.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: резные изображения их богов
  rationale: פֶסֶל подчёркивает изготовленный, вырезанный характер культового изображения; это конкретнее, чем обобщающее «идолы».
- source_word: תְּגַדֵּעוּן
  choice: изрубите
  rationale: גדע означает отсечь или срубить. «Изрубите» в данном сочетании передаёт насильственное уничтожение предметов, не предполагая непременно, что все они были деревьями.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: уничтожьте само их имя
  rationale: Сохраняется сильная еврейская идиома об устранении имени, то есть памятной и культовой представленности; частица «само» делает её естественной и выразительной по-русски, не сводя смысл к буквальной надписи.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: на том месте
  rationale: По-русски уничтожить чьё-либо имя «на том месте» звучит естественнее буквального «из того места» и точно указывает на упомянутое место культа.
theological_decisions:
- issue: Значение אֲשֵׁרֵיהֶם в контексте ханаанского культа
  choice: ашеры
  alternative: священные столбы; культовые предметы Ашеры
  rationale: Транслитерация не решает без достаточных оснований, были ли это деревянные столбы, деревья или иные символы, связанные с Ашерой; пояснение вынесено в сноску.
- issue: Передача פְסִילֵי אֱלֹהֵיהֶם
  choice: резные изображения их богов
  alternative: их идолы
  rationale: Выбранная формулировка сохраняет материальную, изготовленную природу предметов и грамматическую связь с «их богами», не подменяя описание богословской категорией.
- issue: Смысл выражения «уничтожить их имя»
  choice: сохранить идиому в основном тексте
  alternative: стереть память о них; устранить их культовое присутствие
  rationale: Еврейский текст формулирует мысль кратко и образно. Сохранение идиомы удерживает её смысловую широту, а сноска поясняет вероятную функцию «имени» в данном контексте.
translation_notes:
  register: Современный литературный русский язык, повелительная форма как естественная передача еврейского предписания во 2-м лице множественного числа. Тон энергичный и торжественный без архаизмов; культурно специфический термин «ашеры» сохранён и пояснён.
