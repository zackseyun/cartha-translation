  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: ru
  text: И радуйтесь перед Яхве, вашим Богом, — вы, ваши сыновья и дочери, ваши рабы и рабыни, а также левит, который находится в ваших городах[a], потому что у него нет вместе с вами ни доли, ни наследственного надела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который в пределах ваших ворот»; «ворота» могли обозначать весь город или поселение.'
    reason: Лексическая альтернатива и пояснение еврейской метонимии.
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: и радуйтесь
  rationale: В данном предписывающем контексте форма выражает повеление; «радуйтесь» сохраняет смысл совместной радости перед Богом.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: перед Яхве, вашим Богом
  rationale: לִפְנֵי передаёт нахождение перед Богом, в Его присутствии; личное имя יהוה транслитерировано как «Яхве».
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: ваши сыновья и дочери
  rationale: Сохранена явная в еврейском тексте пара мужского и женского рода.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: ваши рабы и рабыни
  rationale: Слова обозначают зависимых членов дома мужского и женского пола; «рабы и рабыни» точно передаёт их социальное положение и родовое различие.
- source_word: וְהַלֵּוִי
  choice: левит
  rationale: Обычное русское обозначение представителя колена Левия; единственное число источника сохранено.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: живущий в ваших городах
  rationale: «Ворота» здесь метонимически обозначают населённые пункты или местные общины; смысл передан естественно по-русски, а буквальный образ отмечен в сноске.
- source_word: כִּי אֵין לוֹ
  choice: потому что у него нет
  rationale: Союз כִּי вводит причину включения левита в общую радость.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ни доли, ни наследственного надела
  rationale: «Доля» и «наследственный надел» передают отсутствие у левита земельной части и племенного наследия; повтор «ни» естественен в русском отрицательном обороте.
- source_word: אִתְּכֶם
  choice: вместе с вами
  rationale: Сохраняет прямое значение предлога и указывает, что левит не получил доли наряду с остальными израильтянами.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Социальный статус עבד и אמה
  choice: рабы и рабыни
  alternative: слуги и служанки
  rationale: В контексте перечисления зависимых членов дома эти слова указывают на несвободный статус; более мягкое «слуги» могло бы скрыть социальную реальность текста.
- issue: Земельное наследие левита
  choice: ни доли, ни наследственного надела
  alternative: ни части, ни наследия
  rationale: Формулировка сохраняет два связанных понятия и ясно указывает на отсутствие у левита племенного земельного надела, не добавляя объяснений в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Синтаксис перечисления упрощён для ясности, гендерные пары и социальные различия оригинала сохранены.
