  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: ru
  text: 'Не поступайте так, как мы поступаем здесь сегодня: каждый делает то, что правильно в его глазах.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый [делает] всё правильное в его глазах»; это распределительная конструкция: каждый действует по собственному суждению.'
    reason: Пояснение дистрибутивной и эллиптической еврейской конструкции.
lexical_decisions:
- source_word: תַעֲשׂוּן
  choice: не делайте
  rationale: Имперфект 2-го лица множественного числа под отрицанием выражает запрет; русский несовершенный вид естественно передаёт общее предписание.
- source_word: כְּכֹל אֲשֶׁר
  choice: так, как
  rationale: Сравнительная конструкция описывает образ действия; «так, как» ясно и естественно связывает запрет с нынешней практикой Израиля.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: мы делаем здесь сегодня
  rationale: Причастие с указаниями места и времени обозначает совершаемую в данный момент практику.
- source_word: אִישׁ
  choice: каждый
  rationale: Существительное в единственном числе употреблено дистрибутивно. Русское «каждый» сохраняет число и индивидуальный характер выражения, не сужая его до лиц мужского пола.
- source_word: כָּל הַיָּשָׁר
  choice: всё, что правильно
  rationale: Передаёт предмет личной оценки без добавления интерпретирующего «кажется».
- source_word: בְּעֵינָיו
  choice: в его глазах
  rationale: Сохранена прозрачная и понятная по-русски еврейская идиома личного суждения.
theological_decisions:
- issue: Дистрибутивная конструкция אִישׁ ... בְּעֵינָיו
  choice: каждый — всё, что правильно в его глазах
  alternative: каждый поступает так, как считает правильным
  rationale: Основной текст сохраняет дистрибутивную форму, эллиптичность и идиому оригинала, не превращая подразумеваемое действие в явное толкование.
- issue: Оценочный смысл הַיָּשָׁר
  choice: что правильно
  alternative: что кажется правильным
  rationale: В оригинале прямо не выражена кажимость. Формулировка оставляет напряжение между субъективной оценкой человека и объективной правильностью, раскрываемое контекстом.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным законодательным звучанием. Сохранена образность «в его глазах» и заметная эллиптичность заключительной части; двоеточие вводит пояснение к общей практике.
