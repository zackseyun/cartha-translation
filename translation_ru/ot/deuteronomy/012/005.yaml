  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: ru
  text: Но ищите место, которое Яхве, ваш Бог, изберёт из всех ваших племён, чтобы утвердить там Своё имя[a] для Своего обитания; туда и приходите.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы поместить там Своё имя и обитать там». Еврейская фраза кратка и допускает разные понимания: акцент может падать на Божье обитание, на место как Его обиталище либо на оба мотива.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: В контексте противопоставления вводит предписанную альтернативу ранее отвергнутым местам поклонения.
- source_word: הַמָּקוֹם
  choice: место
  rationale: Сохраняет конкретность и одновременно неопределённость избранного Богом места.
- source_word: יִבְחַר
  choice: изберёт
  rationale: Имперфект указывает на предстоящее избрание; «изберёт» соответствует возвышенному, но современному библейскому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямо передаёт форму с местоименным суффиксом множественного числа.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: среди всех ваших племён
  rationale: Естественно выражает избрание места в пределах совокупности израильских племён; не подразумевает избрания самого племени.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: чтобы утвердить там Своё имя
  rationale: «Утвердить имя» естественнее буквального «положить имя» и сохраняет смысл обозначения места Божьего присутствия и дозволенного поклонения.
- source_word: לְשִׁכְנוֹ
  choice: и обитать там
  rationale: Передаёт связь со корнем שכן и мотив Божьего пребывания, не конкретизируя его сверх текста; компактность еврейской конструкции отмечена сноской.
- source_word: תִדְרְשׁוּ
  choice: ищите
  rationale: Повелительное значение в данном предписании естественно передаётся русским императивом и сохраняет идею целенаправленного обращения к надлежащему месту.
- source_word: וּבָאתָ שָׁמָּה
  choice: туда и приходите
  rationale: Коллективное единственное число исходного текста передано естественным русским обращением во множественном числе; «приходите» близко к בוא, а «туда» передаёт направительность שמה.
theological_decisions:
- issue: Божественное имя и язык центрального святилища
  choice: «Яхве… утвердить там Своё имя и обитать там»
  alternative: «Господь… поместить там Своё имя для Своего обитания»
  rationale: Перевод сохраняет оба мотива — Божье имя и Божье пребывание — не отождествляя Бога с самим местом и не привнося позднейшую разработанную храмовую теологию.
- issue: Синтаксическая связь לְשִׁכְנוֹ
  choice: 'соотнести с Божьим обитанием: «и обитать там»'
  alternative: 'понять как характеристику места: «как Его обиталище» или связать с именем: «утвердить там Своё имя для обитания»'
  rationale: Еврейская фраза компактна и допускает разные синтаксические трактовки; основной текст должен быть понятен, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского предписания. Инверсия устранена ради ясности: управляющее «ищите» поставлено раньше дополнения, при этом последовательность смысловых элементов сохранена. Прописные местоимения при обращении к Богу применены последовательно в рамках данного стиха.'
