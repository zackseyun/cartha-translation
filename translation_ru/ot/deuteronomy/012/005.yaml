    issue: «и обитать там»
    rationale: Лְשִׁכְנוֹ буквально и синтаксически допускает понимание «для Его обитания / как Его обиталище»; перевод личным инфинитивом с союзом «и» конкретизирует связь сильнее, чем позволяет текст.
  - severity: low
    issue: «среди всех ваших племён»
    rationale: מִכָּל имеет исходное значение «из, от всех». «Из всех» точнее отражает предлог, оставаясь естественным по-русски.
