source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: ru
  text: Когда Яхве, твой Бог, истребит перед тобой народы, к которым ты идёшь, чтобы лишить их владений, и ты лишишь их владений и поселишься в их земле,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: Союз вводит будущее обстоятельство, служащее предпосылкой к предостережению в следующем стихе; временное «когда» естественно передаёт эту функцию.
- source_word: יַכְרִית
  choice: истребит
  rationale: Hифиль глагола כרת означает устранение народов с пути Израиля. «Истребит» сохраняет серьёзность действия, не добавляя явно формулы о поголовном уничтожении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямая передача существительного с суффиксом второго лица мужского рода единственного числа; обращение ко всему Израилю сохраняется в единственном числе.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В контексте имеются в виду народы, населявшие землю; это прямой и нейтральный русский эквивалент.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: к которым ты идёшь, чтобы лишить их владений
  rationale: Относительное אֲשֶׁר грамматически относится к «народам». Русская формулировка сохраняет эту связь и передаёт בָא שָׁמָּה как направленное движение, избегая неестественного «идёшь туда к которым».
- source_word: לָרֶשֶׁת אֹתָם
  choice: чтобы лишить их владений
  rationale: ירש с народами в качестве объекта обозначает вытеснение прежних владельцев и лишение их владения; перевод сохраняет направленность действия на народы.
- source_word: מִפָּנֶיךָ
  choice: перед тобой
  rationale: Устойчивое пространственное выражение передаёт устранение народов с пути и из присутствия Израиля.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: и ты овладеешь их землёй
  rationale: Буквально местоименный объект относится к народам, однако в русском «овладеть ими» могло бы означать подчинение людей. Контекстуально выражено вступление во владение их территорией; это также подготавливает последующее «в ней».
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: и поселишься в ней
  rationale: ישב здесь обозначает обоснование и проживание в земле после овладения ею. «Поселишься» естественно передаёт последовательность событий.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. «Яхве» сохраняет имя и не подменяет его титулом; форма «Иегова» отражает более позднюю смешанную вокализацию.
- issue: Характер устранения народов в יַכְרִית
  choice: истребит перед тобой
  alternative: отсечёт; уничтожит; устранит
  rationale: Перевод сохраняет сильный смысл божественного действия, но не разворачивает его в более конкретное богословское утверждение о способе или абсолютной полноте уничтожения.
- issue: Объект глагола ירש
  choice: лишить их владений / овладеешь их землёй
  alternative: прогнать их; завладеть ими
  rationale: Глагол совмещает идеи лишения прежнего владения и вступления в него. Контекст земли позволяет выразить обе стороны без утверждения, что Израиль должен был «владеть» самими людьми.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранено обращение к Израилю во втором лице единственного числа. Стих оставлен синтаксически незавершённым с запятой, поскольку его условно-временная конструкция продолжается в следующем стихе.
