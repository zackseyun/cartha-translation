revisions:
- from: Но вы перейдёте Иордан и поселитесь в земле, которую Яхве, ваш Бог, даёт вам во владение[a]. Он даст вам покой от всех врагов, окружающих вас, и вы будете жить в безопасности.
  to: Когда вы перейдёте Иордан и поселитесь в земле, которую Яхве, ваш Бог, отдаёт вам в наследие, и когда Он даст вам покой от всех окружающих вас врагов, тогда вы будете жить в безопасности.
  rationale: Перестроена только временно-следственная связь, чтобы отразить последовательность еврейских глаголов и заключительное следствие. «Даёт вам во владение» заменено на «отдаёт вам в наследие», что непосредственно передаёт наследственный характер наделения; вследствие этого уточняющая сноска устранена.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:00:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'В начальном וַעֲבַרְתֶּם и последующей цепочке глаголов выражена будущая временная последовательность: переход через Иордан и поселение в земле предшествуют дарованию покоя, после чего народ будет жить безопасно. Вариант с «Но вы перейдёте» допустим лишь при сильной зависимости от предыдущего контекста, но в пределах самого стиха менее ясно передаёт временно-условное развитие. מַנְחִיל אֶתְכֶם относится к предоставлению земли как наследственного владения; «отдаёт вам в наследие» передаёт это без утраты оттенка.'
  naturalness: «Когда ... и когда ... тогда ...» — естественная и ясная для современного литературного русского форма, сохраняющая последовательность еврейского текста. «Жить в безопасности» уместно передаёт בֶּטַח.
  terminology: «Яхве, ваш Бог» корректно различает личное имя и титул. «Покой» сохраняет важный лексический мотив הֵנִיחַ, а «в наследие» — наследственный оттенок מַנְחִיל.
  issues:
  - severity: medium
    issue: Начальное «Но вы перейдёте» неявно передаёт временную зависимость дальнейших событий.
    rationale: В данном стихе переход, поселение и дарование покоя образуют последовательность, итог которой обозначен последним «и будете жить в безопасности». Русская конструкция «когда ... тогда» делает эту связь явной и не требует опоры на предыдущий стих.
  - severity: low
    issue: 'Сноска «Буквально: “даёт вам унаследовать”» неточна как буквальная русская передача и стилистически тяжеловесна.'
    rationale: Глагол в каузативе означает наделение наследственным владением; основной текст может передать этот смысл непосредственно, поэтому сноска не нужна.
  revised_text: Когда вы перейдёте Иордан и поселитесь в земле, которую Яхве, ваш Бог, отдаёт вам в наследие, и когда Он даст вам покой от всех окружающих вас врагов, тогда вы будете жить в безопасности.
