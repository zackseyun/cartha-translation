base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: ru
  text: Когда вы перейдёте Иордан и поселитесь в земле, которую Яхве, ваш Бог, отдаёт вам в наследие, и когда Он даст вам покой от всех окружающих вас врагов, тогда вы будете жить в безопасности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: вы перейдёте
  rationale: Префиксированный союзом перфект продолжает ориентированную на будущее последовательность; в контексте это обещанное будущее событие. Союз «но» передаёт контраст с предыдущим стихом.
- source_word: הַיַּרְדֵּן
  choice: Иордан
  rationale: Устоявшееся русское название реки; добавление слова «река» не требуется.
- source_word: וִישַׁבְתֶּם בָּאָרֶץ
  choice: поселитесь в земле
  rationale: Глагол ישׁב здесь обозначает устойчивое проживание после вступления в землю; «поселитесь» естественно передаёт этот оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: מַנְחִיל אֶתְכֶם
  choice: даёт вам во владение
  rationale: Каузативная форма נחל означает, что Бог вводит народ во владение наследственным уделом. Формулировка естественна по-русски, а буквальный оттенок наследования отмечен в сноске.
- source_word: וְהֵנִיחַ לָכֶם
  choice: Он даст вам покой
  rationale: Каузатив глагола נוח выражает дарование покоя или избавления от вражеской угрозы и сохраняет важный для Второзакония мотив покоя.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: от всех врагов, окружающих вас
  rationale: Передаёт и полноту («всех»), и пространственное значение מסביב.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: вы будете жить в безопасности
  rationale: בטח указывает на безопасное, спокойное проживание; выбранная формулировка ясна и естественна в современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Образ покоя в земле
  choice: даст вам покой
  alternative: избавит вас от тревоги
  rationale: Более буквальная формулировка сохраняет богословски значимый мотив дарованного Богом покоя, не сводя его лишь к эмоциональному состоянию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис разбит на два предложения ради ясности, но последовательность действий и причинная связь сохранены; конфессионально маркированная терминология не вводится.
