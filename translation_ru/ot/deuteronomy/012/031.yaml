base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: ru
  text: 'Не делай так для Яхве, твоего Бога, ибо они совершали для своих богов всякую мерзость, которую ненавидит Яхве[a]: они даже сжигали в огне своих сыновей и дочерей для своих богов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякую мерзость Яхве». Это формальная передача еврейской конструкции; по смыслу речь о том, что мерзостно и ненавистно Яхве.'
    reason: Сохраняет формальную неоднозначность конструкции תּוֹעֲבַת יְהוָה, не создавая впечатления, будто мерзость исходит от Яхве.
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  choice: Не делай так
  rationale: Прямой запрет во втором лице единственного числа; «так» сохраняет отсылку к способам поклонения народов из предыдущего контекста.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: для Яхве, твоего Бога
  rationale: Предлог ל выражает направленность культового действия; «для» естественно передаёт совершение обряда в честь Бога и сохраняет параллель с לֵאלֹהֵיהֶם.
- source_word: כָּל תּוֹעֲבַת יְהוָה
  choice: всякую мерзость пред Яхве[a]
  rationale: תּוֹעֵבָה обозначает нечто глубоко отвратительное и недопустимое. Оборот «пред Яхве» естественно передаёт отношение Яхве к названным действиям, а формальная неоднозначность конструкции отмечена в сноске.
- source_word: אֲשֶׁר שָׂנֵא
  choice: которую Он ненавидит
  rationale: Сохранена сильная и личная оценка, прямо выраженная глаголом שׂנא; местоимение относится к Яхве.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: для своих богов они совершали
  rationale: «Совершали» соответствует культовому контексту, не добавляя конкретного вида обряда; прошедшее несовершенное передаёт установившуюся практику народов.
- source_word: כִּי גַם
  choice: они даже
  rationale: גַם выделяет следующий поступок как особенно страшный пример; по-русски это естественно выражается частицей «даже».
- source_word: אֶת בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: своих сыновей и дочерей
  rationale: Сохранено явное упоминание детей обоих полов без обобщения словом «дети».
- source_word: יִשְׂרְפוּ בָאֵשׁ
  choice: сжигают в огне
  rationale: Настоящее время передаёт обычную, повторяющуюся практику; «в огне» буквально и ясно отражает способ жертвоприношения.
- source_word: לֵאלֹהֵיהֶם
  choice: для своих богов
  rationale: Предлог ל указывает на культовую направленность или посвящение действия божествам; «для» сохраняет эту связь без избыточного толкования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное заветное имя «Яхве», а не заменён титулом.
- issue: Сила выражений תּוֹעֵבָה и שָׂנֵא
  choice: мерзость; ненавидит
  alternative: нечто отвратительное; не принимает
  rationale: Выбрана сильная лексика, соответствующая резкой нравственной и богословской оценке исходного текста; её смысл не смягчён.
- issue: Временная форма יִשְׂרְפוּ после עָשׂוּ
  choice: сжигают
  alternative: сжигали; сожгут
  rationale: В контексте описывается характерная практика народов. Русское настоящее время ясно выражает обычное действие, тогда как будущее могло бы ошибочно прозвучать как предсказание.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис слегка упрощён ради ясности; двоеточие вводит предельный пример мерзостной культовой практики. Заглавное «Он» употреблено как принятое в русском религиозном регистре указание на Бога.
