base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: ru
  text: 'Непременно уничтожьте все места, где народы, которых вы лишаете земли, служили своим богам[a]: на высоких горах, на холмах и под всяким зеленеющим деревом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялись своим богам». Еврейский глагол «служить» здесь означает религиозное поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: непременно уничтожьте
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление. «Непременно уничтожьте» естественно передаёт эту эмфазу в современном русском языке.
- source_word: הַמְּקֹמוֹת
  choice: все места
  rationale: В контексте речь идёт о конкретных местах языческого культа; «места» сохраняет прямоту оригинала, не добавляя более узкого толкования вроде «святилища».
- source_word: עָבְדוּ שָׁם ... אֶת אֱלֹהֵיהֶם
  choice: где ... служили своим богам
  rationale: Глагол עבד применительно к богам обозначает религиозное служение, то есть поклонение. «Служили» сохраняет основное значение еврейского слова, а примечание разъясняет культовый смысл.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Здесь имеются в виду неизраильские народы земли; «народы» точно передаёт контекст и не привносит более позднее значение слова «язычники».
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: которых вы лишаете владения
  rationale: В контексте завоевания ירשׁ означает вступление во владение с вытеснением прежних жителей. Формулировка передаёт лишение ими земли и избегает неуместного здесь значения «наследовать».
- source_word: עַל הֶהָרִים הָרָמִים
  choice: на высоких горах
  rationale: Прямое соответствие существительного и определяющего его прилагательного; сохраняется указание на возвышенные культовые места.
- source_word: הַגְּבָעוֹת
  choice: на холмах
  rationale: Обычное и точное русское соответствие; уточнение «на вершинах» отсутствует в оригинале.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: под всяким зеленеющим деревом
  rationale: רַעֲנָן описывает дерево со свежей, пышной зеленью. «Зеленеющим» звучит естественно и точнее передаёт живую листву, чем буквальное «зелёным».
theological_decisions:
- issue: На что непосредственно направлено повеление об уничтожении
  choice: На все места культа народов, лишаемых владения
  alternative: Передать повеление шире — как искоренение их религиозных обрядов вообще
  rationale: Прямым дополнением в еврейском тексте являются «все места». Перевод сохраняет конкретный объект повеления, не устраняя подразумеваемого более широкого отказа от чужого культа.
- issue: Значение служения богам
  choice: Сохранить «служили» и пояснить культовый смысл в примечании
  alternative: Перевести непосредственно как «поклонялись»
  rationale: עבד сохраняет смысл служения, но применительно к божествам означает религиозное поклонение. Основной текст удерживает лексическую форму оригинала, а примечание делает смысл прозрачным.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повеления. Эмфаза выражена наречием «непременно»; архаизмы и конфессионально окрашенные термины не используются.
