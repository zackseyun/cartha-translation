  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: ru
  text: Только крови не ешьте; выливайте её на землю, как воду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничение к предшествующему разрешению и сохраняет краткость еврейского текста.
- source_word: הַדָּם
  choice: крови
  rationale: В русском языке при отрицании естественен родительный падеж; речь идёт о крови убитого животного.
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Отрицательная форма имперфекта выражает прямой запрет; повелительная конструкция естественна для современного русского языка и сохраняет обращение во множественном числе.
- source_word: עַל הָאָרֶץ
  choice: на землю
  rationale: В данном контексте אֶרֶץ обозначает поверхность земли, куда следует вылить кровь; винительный падеж после «на» естественно передаёт направление действия.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: выливайте её
  rationale: Глагол שׁפך означает «лить, выливать»; местоимение женского рода однозначно отсылает к крови. Несовершенный вид подходит для общего предписания.
- source_word: כַּמָּיִם
  choice: как воду
  rationale: Прямо и естественно передаёт сравнительный оборот, сохраняя простой смысл образа.
theological_decisions:
- issue: Обращение с кровью в пищевом постановлении
  choice: Передать прямой запрет употреблять кровь в пищу и предписание выливать её на землю.
  alternative: Добавить символическое или ритуальное толкование значения крови.
  rationale: Стих содержит конкретное постановление и сам по себе не раскрывает его символику; перевод не должен привносить позднейшие богословские объяснения.
translation_notes:
  register: Современный литературный русский язык с кратким, ясным и достойным звучанием. Формы множественного числа сохраняют грамматику еврейского обращения. Точка с запятой отражает тесную связь запрета и следующего предписания.
