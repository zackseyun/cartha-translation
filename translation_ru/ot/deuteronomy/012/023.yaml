lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Вводит строгое ограничение к данному ранее разрешению и естественно передаётся русским «только».
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  choice: твёрдо держись того, чтобы не есть
  rationale: Сохраняет образную силу повеления חֲזַק («будь твёрд, крепок») и передаёт לְבִלְתִּי как решительное воздержание, не превращая выражение в буквальное и неестественное «будь крепок, чтобы не есть».
- source_word: הַדָּם
  choice: кровь
  rationale: Прямое соответствие; последовательное повторение ключевого слова сохраняет логику стиха.
- source_word: כִּי
  choice: потому что
  rationale: Ясно передаёт причинное объяснение запрета.
- source_word: הַנָּפֶשׁ / הַנֶּפֶשׁ
  choice: жизнь
  rationale: В данном контексте נֶפֶשׁ обозначает оживляющую жизнь существа; «жизнь» точнее контекстуально и не привносит позднейшего представления о нематериальной душе.
- source_word: וְלֹא תֹאכַל
  choice: не ешь же
  rationale: Передаёт запретительную силу формы и смысловую связь с предшествующим обоснованием; частица «же» естественно подчёркивает вывод.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: жизнь вместе с мясом
  rationale: Сохраняет конкретный образ употребления животной пищи и лексическую связь с предыдущим «жизнь». В пищевом контексте современное «мясо» естественнее русского «плоть».
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте пищевого запрета
  choice: жизнь
  alternative: душа
  rationale: Стих отождествляет кровь с жизнью животного как основание запрета. Вариант «душа» может создать не требуемое еврейским текстом противопоставление нематериальной души телу; лексическая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Формулировка «твёрдо держись» сохраняет настойчивость исходного идиоматического повеления, а «мясо» отвечает конкретному пищевому контексту.
