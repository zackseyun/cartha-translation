  yaml_path: translation/ot/deuteronomy/012/024.yaml
  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: ru
  text: Не ешь её[a]; вылей её на землю, как воду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть кровь животного, о которой говорится в ближайшем контексте.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: Не ешь её
  rationale: Отрицание с формой 2-го лица единственного числа выражает прямой запрет; местоимение сохраняет суффикс 3-го лица и отсылает к крови из ближайшего контекста.
- source_word: עַל הָאָרֶץ
  choice: на землю
  rationale: В конкретном предписании הָאָרֶץ обозначает поверхность земли; это естественная современная русская формулировка.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: вылей её
  rationale: Глагол שׁפך здесь означает вылить жидкость; повелительная форма естественно передаёт обязательное предписание еврейского имперфекта в законодательной речи.
- source_word: כַּמָּיִם
  choice: как воду
  rationale: Сохраняет сравнительный оборот и звучит естественно по-русски.
theological_decisions:
- issue: Референт местоименных суффиксов
  choice: Сохранить местоимение «её», отсылающее к крови в окружающем контексте.
  alternative: Явно вставить в основной текст слово «кровь».
  rationale: В еврейском тексте существительное здесь не повторено; местоимение сохраняет структуру источника, а сноска устраняет возможную неясность без расширения основного текста.
translation_notes:
  register: Современный литературный русский язык; краткая и ясная форма прямого законодательного запрета. Женский род местоимения обусловлен подразумеваемым словом «кровь».
