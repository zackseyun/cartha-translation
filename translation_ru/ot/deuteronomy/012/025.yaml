  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: ru
  text: Не ешь её, чтобы тебе и твоим детям[a] после тебя было хорошо, ибо ты будешь поступать так, как правильно в глазах Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновьям»; в более широком смысле: «потомкам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: не ешь её
  rationale: Глагол אָכַל означает «есть, употреблять в пищу»; местоименный суффикс отсылает к крови в ближайшем контексте. Женский род местоимения естественно согласуется с русским словом «кровь».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое и одновременно результативное отношение между запретом и последующим благополучием.
- source_word: יִיטַב לְךָ
  choice: хорошо было тебе
  rationale: Сохраняет широкий смысл типичной для Второзакония формулы благополучия, не сужая её до материального процветания.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: и твоим детям после тебя
  rationale: בָּנִים может обозначать сыновей, детей или потомство; «детям» сохраняет семейный образ и не ограничивает смысл только мужчинами.
- source_word: כִּי
  choice: потому что
  rationale: Здесь союз обосновывает обещанное благополучие послушанием.
- source_word: תַעֲשֶׂה
  choice: ты будешь делать
  rationale: Имперфект передаёт ожидаемое, направленное в будущее поведение адресата.
- source_word: הַיָּשָׁר
  choice: то, что правильно
  rationale: Передаёт этическое значение יָשָׁר — «прямой, правый, правильный» — естественным современным русским выражением.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет древнееврейскую метафору божественной оценки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Исходный текст содержит личное имя; форма «Яхве» является принятой научной реконструкцией произношения и сохраняет различие между именем и титулом.
- issue: Объём значения בָנֶיךָ
  choice: твоим детям
  alternative: твоим сыновьям; твоим потомкам
  rationale: Мужская форма множественного числа может в данном контексте представительно обозначать детей и последующие поколения. «Детям» сохраняет непосредственный семейный образ, не исключая дочерей.
- issue: Связь благополучия с послушанием
  choice: потому что ты будешь делать
  alternative: когда ты будешь делать; ибо ты делаешь
  rationale: כִּי допускает оттенки основания и условия; в данном синтаксисе наиболее прямо выражено основание обещанного благополучия, при этом будущее «будешь делать» сохраняет перспективу наставления.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Сохранены повтор личного местоимения и древнееврейская метафора «в глазах». Маркеры сносок не используются, поскольку в русском основном тексте выбран широкий эквивалент «детям», а альтернативы зафиксированы в переводческих решениях.
