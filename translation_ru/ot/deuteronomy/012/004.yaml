    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Не поступайте
  rationale: Сочетание отрицания לֹא с имперфектом 2-го лица множественного числа в контексте закона выражает прямой запрет. «Не поступайте» естественно для современного русского и передаёт действие шире, чем буквальное «не делайте».
- source_word: כֵּן
  choice: так
  rationale: Наречие отсылает к описанному выше обращению с культовыми местами народов; краткое «так» сохраняет анафоричность и не вносит толкование в основной текст.
- source_word: לַיהוָה
  choice: с Яхве
  rationale: Предлог ל здесь обозначает направленность или отношение действия. Русское «поступать так с кем-либо» естественно передаёт смысл обращения по отношению к Яхве.
- source_word: אֱלֹהֵיכֶם
  choice: вашим Богом
  rationale: Передаёт форму с суффиксом 2-го лица множественного числа и сохраняет выраженную в тексте связь Бога с обращённым к нему народом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Основной текст прямо содержит тетраграмматон. «Яхве» передаёт личное заветное имя, а традиционный вариант отмечен в сноске.
- issue: Смысл краткого запрета в контексте
  choice: Сохранить краткое «не поступайте так», пояснив отсылку в сноске
  alternative: Развернуть в основном тексте как запрет обращаться с Яхве так же, как с языческими святынями
  rationale: Еврейское כֵּן намеренно зависит от предшествующего контекста. Краткая формулировка сохраняет связность и некоторую смысловую напряжённость оригинала, не сужая запрет до одного конкретного действия.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным регистра закона. Форма множественного числа соответствует обращению ко всему Израилю; сочетание «поступать с» делает русский текст естественным, сохраняя лаконичность оригинала.
