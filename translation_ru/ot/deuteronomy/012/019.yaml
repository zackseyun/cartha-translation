  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: ru
  text: Смотри, не оставляй левита[a] во все дни своей жизни на своей земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «левитов»; в еврейском тексте стоит единственное число «левита», вероятно представляющее всех левитов как группу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в своей земле»; буквально: «на своей земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Смотри
  rationale: Возвратный императив с לְךָ выражает настойчивое предостережение. «Смотри» естественно передаёт эту силу в современном русском языке, не прибегая к более тяжеловесному «берегись».
- source_word: פֶּן
  choice: не
  rationale: Частица вводит предостережение о недопустимом действии. В сочетании «Смотри, не…» её значение ясно и идиоматично передаётся по-русски.
- source_word: תַּעֲזֹב
  choice: не оставляй … без поддержки
  rationale: Глагол עזב означает «оставлять, покидать». В данном социально-заветном контексте речь идёт о том, чтобы не лишать левита положенного попечения; дополнение «без поддержки» делает смысл естественным по-русски, сохраняя нравственную весомость запрета.
- source_word: אֶת הַלֵּוִי
  choice: левита
  rationale: Существительное стоит в единственном числе с артиклем и, вероятно, имеет собирательно-представительное значение. Единственное число сохранено в основном тексте.
- source_word: כָּל יָמֶיךָ
  choice: во все дни своей жизни
  rationale: Передаёт буквальное «все твои дни» ясной современной формой, сохраняя длительность обязательства и торжественную ритмику.
- source_word: עַל אַדְמָתֶךָ
  choice: на своей земле
  rationale: אדמה здесь обозначает землю как место проживания и удел. Предлог «на» близко соответствует עַל и при этом естественен в русском выражении «жить на своей земле».
theological_decisions:
- issue: Представительное единственное число при обозначении левита
  choice: левита
  alternative: левитов
  rationale: Еврейский текст употребляет единственное число с артиклем, вероятно представляя через отдельного левита всю эту группу. Сохранение единственного числа точнее отражает форму источника, а примечание проясняет её обобщающий смысл.
translation_notes:
  register: Современный литературный русский язык с прямым, достойным тоном наставления. Обращение остаётся в единственном числе, как в еврейском тексте. Формулировка избегает архаизмов, сохраняя длительность обязанности и представительное единственное число.
