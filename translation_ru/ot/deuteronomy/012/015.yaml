source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: ru
  text: Но всякий раз, когда тебе захочется[a], ты можешь закалывать животных и есть мясо — по мере того благословения Яхве, твоего Бога, которое Он дал тебе, — в любом из твоих поселений[b]. И нечистый, и чистый могут есть это мясо, как едят мясо газели или оленя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по всему желанию твоей души», то есть когда бы ты ни пожелал.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во всех твоих воротах». Ворота здесь обозначают города и другие поселения.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Но
  rationale: Частица вводит оговорку к предшествующему повелению; «но» естественно передаёт её ограничительно-противительный оттенок.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: всякий раз, когда тебе захочется
  rationale: Еврейское выражение буквально говорит о «всём желании твоей души», но по смыслу обозначает свободное желание; естественный русский оборот передаёт это без неуместной психологизации слова נֶפֶשׁ.
- source_word: תִּזְבַּח
  choice: ты можешь закалывать животных
  rationale: В данном контексте форма выражает дозволение совершать обычный убой ради пищи, а не обязательное жертвоприношение. Дополнение «животных» делает русскую фразу ясной, не меняя подразумеваемого объекта.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: и есть мясо
  rationale: בָשָׂר здесь означает плоть животного как пищу; современное русское «мясо» точно передаёт смысл.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: по мере того благословения Яхве, твоего Бога, которое Он дал тебе
  rationale: Сохранены сравнительный предлог, существительное «благословение» и мысль о дарованном Богом достатке; «по мере» естественно выражает зависимость количества мяса от данного благополучия.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: в любом из твоих поселений
  rationale: Буквально говорится «во всех твоих воротах»; в еврейском это обозначение городов и других населённых мест. В контексте дозволения כָּל естественно передаётся как «в любом».
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: И нечистый, и чистый
  rationale: Сохранены категории ритуального состояния без добавления морального смысла; повтор «и… и…» ясно показывает, что дозволение относится к обеим группам.
- source_word: יֹאכְלֶנּוּ
  choice: могут есть это мясо
  rationale: Контекст придаёт форме разрешительный смысл. Явное «это мясо» естественнее русского местоимения и точно указывает на мясо заколотого животного.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: как едят мясо газели или оленя
  rationale: Сравнение относится к употреблению в пищу мяса диких животных, не предназначенных для жертвоприношения. Добавленные слова лишь раскрывают подразумеваемую в еврейском эллиптическую конструкцию; «или» естественно представляет два параллельных примера.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не смешивает его с титулом.
- issue: Значение «нечистого» и «чистого»
  choice: Сохранить формулировку «нечистый» и «чистый» без уточнения в основном тексте
  alternative: ритуально нечистый и чистый
  rationale: Контекст закона указывает на ритуальный статус, однако добавление определения в основной текст устранило бы краткость и некоторую подразумеваемость оригинала. Перевод не придаёт словам значения нравственной порочности.
- issue: Характер действия תִּזְבַּח
  choice: Дозволенный обычный убой животных ради пищи
  alternative: обязательное жертвенное заклание
  rationale: Стих разрешает употреблять мясо по поселениям и допускает к нему ритуально нечистых, поэтому здесь речь не об обязательной храмовой жертве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясного чтения, но сохранены ключевые повторы, категории ритуальной чистоты и имя Яхве. Эллиптическое заключительное сравнение раскрыто минимально, чтобы по-русски было ясно, что речь идёт об употреблении мяса.
