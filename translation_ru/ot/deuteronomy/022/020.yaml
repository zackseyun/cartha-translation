lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз с условной частицей противопоставляет этот случай изложенному ранее; «Но если» естественно передаёт переход.
- source_word: אֱמֶת הָיָה הַדָּבָר הַזֶּה
  choice: это дело действительно так
  rationale: Оборот буквально означает «это дело было истинным»; выбранная формулировка естественна для современного русского языка и сохраняет судебный контекст без сужения до конкретного обвинения.
- source_word: לֹא נִמְצְאוּ בְתוּלִים
  choice: не было найдено доказательств девственности
  rationale: Форма בְּתוּלִים морфологически множественная и в данном правовом контексте обозначает признаки или доказательства девственности; перевод ясно передаёт контекстуальный смысл.
- source_word: לַנַּעֲרָ
  choice: у молодой женщины
  rationale: נַעֲרָה обозначает молодую женщину брачного возраста; русская конструкция «у ... не было найдено» естественно передаёт отношение, выраженное предлогом ל.
