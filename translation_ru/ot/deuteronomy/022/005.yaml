  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: ru
  text: Женщина не должна носить мужскую принадлежность[a], и мужчина не должен надевать женскую одежду, потому что всякий, кто так поступает, мерзок Яхве, твоему Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужское снаряжение» или «мужская одежда». Еврейское слово в первой части стиха шире конкретного слова «одежда» во второй.'
    reason: Сохраняет широкий диапазон כְּלִי и явное лексическое различие между כְּלִי и שִׂמְלָה, не предрешая, относятся ли «принадлежности» только к одежде.
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: ничего мужского
  rationale: 'כְּלִי — более широкое слово, чем обозначение одежды во второй части стиха: оно может означать предмет, принадлежность, орудие или снаряжение. Выражение «ничего мужского» естественно передаёт запрет иметь на себе предмет, относящийся к мужчине, не сводя смысл исключительно к одежде; сноска сохраняет возможные конкретизации.'
- source_word: עַל אִשָּׁה
  choice: на женщине не должно быть
  rationale: Буквальное «быть на женщине» описывает предмет, находящийся на ней или при ней. Русская конструкция сохраняет эту широту и звучит естественно.
- source_word: יִלְבַּשׁ
  choice: надевать
  rationale: Глагол означает облачаться или надевать одежду. «Надевать» ясно передаёт действие и естественно сочетается с «одежду».
- source_word: שִׂמְלַת אִשָּׁה
  choice: женскую одежду
  rationale: שִׂמְלָה обозначает одежду или предмет одежды, часто верхнее одеяние. Собирательное русское «одежду» не сужает значение до определённого вида одежды.
- source_word: גֶּבֶר / אִשָּׁה
  choice: мужчина / женщина; мужской / женский
  rationale: Исходный текст прямо противопоставляет мужчину и женщину; перевод сохраняет это гендерное различие.
- source_word: תּוֹעֲבַת יְהוָה
  choice: отвратителен для Яхве
  rationale: תּוֹעֵבָה выражает сильное нравственно-религиозное отвращение. Предикативное «отвратителен» естественно по-русски передаёт отношение Бога к совершающему названные действия. Имя יהוה передано как «Яхве».
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: всякий, кто делает это
  rationale: Причастная конструкция имеет обобщающее значение. Единственное «это» естественно объединяет два только что названных действия, тогда как буквальное «эти» потребовало бы добавления существительного.
theological_decisions:
- issue: Объём первого запрета (כְלִי גֶבֶר)
  choice: 'Сохранить широкое значение: «ничего мужского».'
  alternative: «мужской одежды»; «мужского оружия/снаряжения»; «мужской принадлежности»
  rationale: В первой части употреблено широкое כְּלִי, а во второй — конкретное слово שִׂמְלָה «одежда». Перевод не отождествляет эти слова и не решает без достаточных оснований, относится ли первый запрет только к одежде либо также к иным мужским принадлежностям или снаряжению.
- issue: Референт выражения תועבת יהוה
  choice: «всякий, кто делает это, отвратителен для Яхве»
  alternative: «это отвратительно Яхве»; «совершающий это — мерзость пред Яхве»
  rationale: Грамматически תּוֹעֲבַת יְהוָה относится к выражению «всякий, кто делает это», то есть прямо характеризует совершающего, а не только действие. Выбранная формулировка сохраняет эту направленность без архаичного русского оборота.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передан личным именем «Яхве», что прозрачно отражает исходный текст и согласуется с предоставленным английским консультационным слоем.
- issue: Гендерно маркированная лексика
  choice: Сохранить противопоставление женщины и мужчины.
  alternative: Использовать нейтральное «человек».
  rationale: Еврейский текст прямо и содержательно противопоставляет אִשָּׁה и גֶּבֶר; нейтрализация устранила бы существенную часть смысла.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Формулировка первой части намеренно широка и снабжена сноской; архаизмы «мерзость пред» и канцелярские обороты избегаются.
