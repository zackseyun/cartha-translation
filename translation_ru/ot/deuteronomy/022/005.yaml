revisions:
- from: На женщине не должно быть ничего мужского[a], и мужчина не должен надевать женскую одежду, потому что всякий, кто делает это, отвратителен для Яхве, твоего Бога.
  to: Женщина не должна носить мужскую принадлежность[a], и мужчина не должен надевать женскую одежду, потому что всякий, кто так поступает, мерзок Яхве, твоему Богу.
  rationale: Исправление заменяет чрезмерно неопределённое «ничего мужского» на предметно ориентированное «мужскую принадлежность», сохраняя намеренную широту исходного כְּלִי. Заключительная формула сделана более естественной и стилистически соразмерной силе תּוֹעֵבָה; «так поступает» ясно охватывает оба предшествующих действия. Сноска сокращена и нормализована, но по-прежнему фиксирует ключевую лексическую неоднозначность.
