- from: Тогда пусть выведут девушку[a] ко входу в дом её отца, и мужчины её города побьют её камнями, и она умрёт, потому что совершила гнусный поступок[b] в Израиле, предаваясь блуду[c] в доме своего отца. Так искорени зло из своей среды.
  to: Тогда пусть выведут девушку[a] ко входу в дом её отца, и мужчины из её города забросают её камнями до смерти, потому что она совершила в Израиле гнусный поступок[b], предаваясь блуду[c] в доме своего отца. Так искорени зло из своей среды.
  rationale: Уточнён способ казни, чтобы русский текст недвусмысленно передавал смерть от побиения камнями. «Мужчины из её города» сохраняет мужской субъект еврейской формулы, но звучит естественнее. Сноска о נַעַר переписана для точности и ясности. Неоднозначность זנה между проституцией и более широким незаконным сексуальным поведением сохранена в сноске.
