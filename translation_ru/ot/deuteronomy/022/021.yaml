base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: ru
  text: Тогда пусть выведут девушку[a] ко входу в дом её отца, и мужчины из её города забросают её камнями до смерти, потому что она совершила в Израиле гнусный поступок[b], предаваясь блуду[c] в доме своего отца. Так искорени зло из своей среды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодую женщину». Еврейское נַעַר в этом контексте обозначает молодую женщину; возможен также перевод «девушка».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «позорное дело», «возмутительное деяние». Еврейское נְבָלָה обозначает нравственно отвратительный, вопиющий поступок.'
    reason: lexical_alternative
  - marker: c
    text: Буквально глагол связан с поведением блудницы; в зависимости от контекста זנה может шире обозначать недозволенные половые отношения.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: девушку
  rationale: В данном контексте форма обозначает молодую незамужнюю женщину. «Девушка» естественно звучит по-русски и сохраняет указание на её возраст и положение.
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: ко входу в дом её отца
  rationale: «Вход» точно передаёт פֶּתַח, а «дом её отца» сохраняет конкретный образ исходного текста, не исключая значения отцовского семейства.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: побьют её камнями
  rationale: Русское выражение передаёт как действие, так и явно названное в еврейском тексте орудие казни, сохраняя юридическую тяжесть формулировки.
- source_word: אַנְשֵׁי עִירָהּ
  choice: мужчины её города
  rationale: Перевод сохраняет грамматически и лексически выраженное указание на мужчин, не заменяя его нейтральным «жители».
- source_word: נְבָלָה
  choice: гнусный поступок
  rationale: В данном нравственно-правовом контексте слово обозначает не простую глупость, а постыдное и возмутительное деяние.
- source_word: לִזְנוֹת
  choice: предаваясь блуду
  rationale: Формулировка сохраняет сильную сексуально-нравственную окраску глагола זנה, но не сужает его непременно до коммерческой проституции.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Так искорени зло из своей среды
  rationale: Перевод передаёт устойчивую второзаконническую судебную формулу, её повелительную силу и образ полного удаления зла.
theological_decisions:
- issue: Передача нравственно-правовой тяжести обвинения
  choice: «гнусный поступок» и «предаваясь блуду»
  alternative: «непристойный поступок» и «совершая половую безнравственность»
  rationale: Выбранные выражения сохраняют резкость исходной юридической и нравственной оценки, не вводя более поздних богословских категорий и не сводя זנה обязательно к коммерческой проституции.
- issue: Кто совершает предписанную казнь
  choice: «мужчины её города»
  alternative: «жители её города»
  rationale: Еврейское אַנְשֵׁי прямо означает мужчин; нейтрализация могла бы скрыть деталь исходного правового предписания.
- issue: Значение выражения «дом её отца»
  choice: Сохранить конкретное «в доме своего отца»
  alternative: «в семье своего отца» или «под кровом своего отца»
  rationale: Буквальная пространственная формулировка оставляет открытым присущий еврейскому בַּיִת диапазон между зданием и домохозяйством и не разрешает неоднозначность без необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством и сдержанностью правового текста. Сохранены повтор «камнями» и прямота описания наказания; избегнуты как эвфемистическое смягчение, так и избыточно архаичные обороты.
