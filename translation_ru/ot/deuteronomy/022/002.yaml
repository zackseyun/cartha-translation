  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: ru
  text: Но если твой брат далеко от тебя[a] и ты не знаешь его[b], возьми найденное к себе в дом и держи его у себя, пока твой брат не станет искать его[c]; затем возврати его ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если твой брат не близок к тебе». Здесь «твой брат», вероятно, означает соплеменника, члена народа завета, а не только родного брата.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «ты не знаешь его». То есть тебе неизвестно, кому принадлежит найденное.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «пока твой брат не потребует его» или «не спросит о нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Сохраняет родственный образ еврейского текста; в законах Второзакония выражение часто обозначает соплеменника, члена народа завета.
- source_word: קָרוֹב אֵלֶיךָ
  choice: живёт не рядом с тобой
  rationale: В контексте возвращения потерянного имущества речь идёт о физической близости владельца; добавление «живёт» делает русскую фразу естественной, не меняя практического смысла.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: или ты не знаешь его
  rationale: Маскулинный объектный суффикс буквально относится к владельцу — «его»; союз וְ в данном контексте естественно передаётся разделительным «или» как второе условие.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: приведи животное к себе домой
  rationale: Глагол אסף здесь означает принять или привести к себе; явное «животное» восстанавливает референт из предыдущего стиха и устраняет неясное русское местоимение.
- source_word: וְהָיָה עִמְּךָ
  choice: пусть оно остаётся у тебя
  rationale: Передаёт продолжительное хранение до появления владельца и нормативный оттенок законоположения.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: пока твой брат не станет искать его
  rationale: דרש может означать искать, разыскивать или справляться о пропаже; «искать» сохраняет лексическую широту исходного текста.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: тогда возврати его ему
  rationale: Каузативная форма שוב означает вернуть предмет или животное владельцу; «тогда» естественно выражает последовательность действий.
theological_decisions:
- issue: Объём значения выражения «твой брат»
  choice: Сохранено буквальное «твой брат» с пояснением о более широком общественном значении.
  alternative: «твой соплеменник» или «другой израильтянин»
  rationale: Так сохраняется юридически значимый язык родства и не сужается выражение до биологического брата.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Местоимения мужского рода относятся к потерянному животному из непосредственного контекста предыдущего стиха. Синтаксис слегка прояснён для самостоятельного чтения стиха, при этом буквальная грамматическая неоднозначность отмечена в сносках.
