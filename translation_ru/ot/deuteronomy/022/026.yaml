base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: ru
  text: 'А с молодой женщиной ничего не делай: она не совершила греха, за который полагается смерть. Ибо это дело подобно случаю, когда человек нападает на своего ближнего и убивает его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: А с молодой женщиной
  rationale: ו передаёт противопоставление наказанию мужчины в предыдущем стихе; נַעַר в данном судебном контексте обозначает молодую женщину, упомянутую ранее.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: ничего не делай
  rationale: Сохраняет обращение во втором лице единственного числа и абсолютный запрет предпринимать против неё карательные действия.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: на молодой женщине нет греха, заслуживающего смерти
  rationale: Близко передаёт еврейскую судебную формулу и ясно выражает отсутствие вины, влекущей смертную казнь.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: как человек восстаёт на своего ближнего
  rationale: Сохраняет образное выражение исходного текста и сравнительную конструкцию.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: и убивает его
  rationale: В контексте нападения רָצַח обозначает преступное лишение жизни; русское «убивает» естественно сочетается с местоименным объектом и не добавляет отдельной юридической квалификации сверх контекста.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: это дело подобно тому
  rationale: Передаёт заключение аналогии и судебное значение דָּבָר как рассматриваемого дела.
theological_decisions:
- issue: Характер невиновности молодой женщины
  choice: Стих утверждает отсутствие у неё греха, заслуживающего смерти, то есть вины, влекущей смертную казнь в этом деле.
  alternative: Понять слова как утверждение её полной нравственной безгрешности вообще.
  rationale: Формула חֵטְא מָוֶת имеет судебную направленность в составе данного законодательства; перевод сохраняет её и не распространяет утверждение за пределы рассматриваемого случая.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранены судебная формула и образ нападения; синтаксис сделан понятным для обычного читателя без конфессиональных уточнений.
