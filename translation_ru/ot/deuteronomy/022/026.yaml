  verdict: revise
  source_fidelity: 'Смысл передан в целом верно: противопоставление участи мужчины, отсутствие у молодой женщины вины, влекущей смерть, и сравнение с убийственным нападением сохранены. Однако «на молодой женщине нет греха» — буквальная, но неестественная для современного русского калька; заключительная сравнительная конструкция также нуждается в более ясном оформлении.'
  naturalness: «А с молодой женщиной ничего не делай» в законодательном контексте понятно, но «на молодой женщине нет греха» звучит не по-русски. Формулировка «это дело подобно тому, как...» тяжеловесна. Перестройка делает текст естественным, сохраняя сжатый законодательный регистр.
  terminology: «Молодая женщина» уместно передаёт נַעֲרָה в данном контексте. «Грех, за который полагается смерть» сохраняет юридическую силу חֵטְא מָוֶת, не расширяя её до утверждения о безгрешности вообще. «Нападает ... и убивает» ясно передаёт образ человека, восстающего против ближнего, и רצח как незаконное убийство.
  issues:
  - severity: medium
    issue: Неестественная калька «на молодой женщине нет греха».
    rationale: Русское выражение «грех на ком-либо» обычно означает лежащую на человеке моральную ответственность и неестественно сочетается здесь с определением «заслуживающий смерти». Исходная юридическая идиома означает отсутствие греха/вины, за которую следует смерть.
  - severity: low
    issue: Тяжеловесная сравнительная конструкция в последнем предложении.
    rationale: «Это дело подобно тому, как...» не является естественным современным способом оформить сравнение случая с нападением. «Подобно случаю, когда...» точнее отражает משפטный характер דָּבָר и лучше читается.
  revised_text: 'А с молодой женщиной ничего не делай: она не совершила греха, за который полагается смерть. Ибо это дело подобно случаю, когда человек нападает на своего ближнего и убивает его.'
