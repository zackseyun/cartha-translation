lexical_decisions:
- source_word: וְלָקְחוּ
  choice: пусть возьмут
  rationale: Обычное значение לקח — «брать». В данном юридическом контексте оборот передаёт передачу человека в распоряжение старейшин, не добавляя отсутствующего в тексте указания на насильственный захват.
- source_word: זִקְנֵי
  choice: старейшины
  rationale: В гражданско-правовом контексте זקנים обозначает признанных руководителей общины, а не просто пожилых мужчин.
- source_word: הָעִיר הַהִוא
  choice: того города
  rationale: Сохраняет значение местного поселения и юрисдикции, а также указательное значение הַהִוא.
- source_word: הָאִישׁ
  choice: этого человека
  rationale: איש буквально означает «мужчина, человек», а контекст указывает на ранее названного мужа. «Этого человека» естественно связывает стих с предшествующим обвинителем, не заменяя слово более узким «муж».
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: и накажут его
  rationale: יסר обозначает наказание, вразумление или дисциплинарное исправление. В юридическом контексте естественное русское «накажут» сохраняет общую правовую силу глагола, не уточняя способ воздействия.
theological_decisions:
- issue: Форма наказания, выраженная глаголом יסר
  choice: Не уточнять способ наказания в основном тексте.
  alternative: Передать как «высекут его».
  rationale: Сам глагол допускает дисциплинарное наказание различного рода и здесь прямо не называет телесного наказания; ближайший контекст далее устанавливает денежный штраф.
translation_notes:
  register: Современный литературный русский язык с достоинством юридического предписания. Конструкция «пусть возьмут… и накажут» передаёт предписывающую функцию древнееврейских форм, оставаясь понятной современному читателю.
