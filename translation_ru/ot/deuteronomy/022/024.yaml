  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: ru
  text: 'то выведите их обоих к воротам того города[a] и побейте их камнями, и они умрут: молодую женщину[b] — за то, что она не кричала в городе, а мужчину — за то, что он надругался над женой своего ближнего[c]. Так истреби зло из своей среды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Городские ворота в древнем Израиле служили обычным местом публичного разбирательства и суда.
    reason: cultural_note
  - marker: b
    text: 'Или: «девушку». В еврейском тексте это слово записано без конечной буквы более явной формы женского рода, однако следующий глагол — «она не кричала» — показывает, что речь идёт о женщине.'
    reason: textual_and_lexical_note
  - marker: c
    text: 'Или: «унизил», «обесчестил». Еврейский глагол может обозначать нарушение телесной неприкосновенности, сопровождаемое унижением; здесь он употреблён в контексте полового преступления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם אֶת שְׁנֵיהֶם
  choice: выведите их обоих
  rationale: Каузативная форма יצא передана глаголом «выведите», а שְׁנֵיהֶם — естественным русским сочетанием «их обоих».
- source_word: אֶל שַׁעַר הָעִיר הַהִוא
  choice: к воротам того города
  rationale: שַׁעַר может обозначать городские ворота как место публичного суда; множественное «ворота» соответствует норме современного русского языка.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: побейте их камнями
  rationale: Передаёт как действие глагола סקל, так и прямо названное орудие казни — камни, без ненужной русской тавтологии.
- source_word: וָמֵתוּ
  choice: и они умрут
  rationale: Сохраняет последовательность еврейских глагольных форм и выраженный результат, не превращая его явно в цель действия.
- source_word: הנער
  choice: молодую женщину
  rationale: Хотя согласный текст допускает форму, внешне совпадающую с мужской, женская форма сказуемого צָעֲקָה и контекст однозначно указывают на женщину. «Молодая женщина» не навязывает точный возраст.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: за то, что она не кричала в городе
  rationale: עַל דְּבַר вводит основание приговора; перевод прямо сохраняет сформулированную текстом причину.
- source_word: עִנָּה
  choice: надругался над
  rationale: В данном сексуально-правовом контексте глагол указывает на унижение и нарушение телесной неприкосновенности. «Надругался над» передаёт тяжесть действия, не сужая многозначность до одного современного юридического термина.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: женой своего ближнего
  rationale: Сохраняет социально-заветное обозначение רֵעַ как «ближний» и юридический статус женщины как жены.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Так истреби зло из своей среды
  rationale: Повторяющаяся формула Второзакония передана устойчиво и энергично; единственное число повеления отражает обращение к Израилю как к единому народу.
theological_decisions:
- issue: Основание виновности молодой женщины
  choice: за то, что она не кричала в городе
  alternative: за то, что она не позвала на помощь в городе
  rationale: Перевод сохраняет буквальное указание текста на отсутствие крика и не добавляет выводов о согласии, принуждении или более широкой этической норме.
- issue: Значение עִנָּה в контексте полового преступления
  choice: надругался над
  alternative: обесчестил; унизил; изнасиловал
  rationale: Выбранное выражение сохраняет сексуальный и унизительный характер действия, но не устраняет присущую еврейскому глаголу смысловую широту. «Изнасиловал» было бы более узким современным юридическим определением, чем позволяет сама лексема в этом стихе.
- issue: Обозначение обручённой женщины как жены
  choice: жена своего ближнего
  alternative: невеста своего ближнего
  rationale: Перевод следует существительному אֵשֶׁת («жена») и сохраняет юридическую логику древнего текста, не заменяя её современным пониманием помолвки.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Синтаксический параллелизм «молодую женщину… а мужчину…» сохранён; архаичные слова вроде «отроковица» и чрезмерно узкая современная юридическая терминология не используются.
