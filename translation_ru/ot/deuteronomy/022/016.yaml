  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: ru
  text: 'Отец молодой женщины скажет старейшинам: «Я отдал свою дочь в жёны этому человеку, а он ненавидит её[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а он возненавидел её». Древнееврейский глагол означает «ненавидеть»; в данном контексте его можно понимать либо как нынешнее состояние («ненавидит»), либо как возникшее отношение («возненавидел»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: скажет
  rationale: В контексте казуального закона форма обозначает предписанное действие в рассматриваемом случае; русское будущее время естественно передаёт эту процедурную последовательность.
- source_word: אֲבִי הַנַּעַר
  choice: отец молодой женщины
  rationale: Несмотря на дефектное написание הַנַּעַר, контекст и масоретское чтение указывают на молодую женщину брачного возраста. Такой перевод современен и точнее контекста, чем «отец девушки».
- source_word: הַזְּקֵנִים
  choice: старейшинам
  rationale: В данном судебно-правовом контексте это признанные руководители общины, а не просто пожилые мужчины.
- source_word: אֶת בִּתִּי
  choice: свою дочь
  rationale: В прямой речи בִּתִּי означает «мою дочь»; русское «свою» естественно соотносит дочь с говорящим отцом.
- source_word: נָתַתִּי
  choice: я отдал
  rationale: Глагол נתן здесь употреблён в устойчивом смысле передачи дочери в брак. «Отдал» естественно сочетается с выражением «в жёны».
- source_word: לָאִישׁ הַזֶּה
  choice: этому человеку
  rationale: אִישׁ буквально обозначает мужчину/человека; его роль мужа уже ясна из следующего выражения.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Это обычное древнееврейское выражение вступления в брак; русский оборот «отдать в жёны» передаёт его точно и естественно.
- source_word: וַיִּשְׂנָאֶהָ
  choice: а он ненавидит её
  rationale: שׂנא прямо означает «ненавидеть». Настоящее время естественно описывает нынешнее отношение мужа, а союз «а» передаёт контраст, возникающий в контексте.
