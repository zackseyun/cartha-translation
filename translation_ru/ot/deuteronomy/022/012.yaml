lexical_decisions:
- source_word: גְּדִלִים
  choice: кисти
  rationale: Слово обозначает свисающие элементы, прикрепляемые к одежде; «кисти» — естественный современный эквивалент, тогда как этимологически возможны «кручёные шнуры».
- source_word: תַּעֲשֶׂה לָּךְ
  choice: сделай себе
  rationale: Императивная передача формы несовершенного вида в юридическом предписании сохраняет обязательную силу, а «себе» передаёт личную заинтересованность, выраженную לָּךְ.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: на четырёх углах
  rationale: В контексте прямоугольного предмета одежды כָּנָף обозначает край или угол; «углах» ясно и соответствует образу четырёх оконечностей ткани.
- source_word: כְּסוּתְךָ
  choice: своего покрывала
  rationale: כְּסוּת — то, чем покрываются, нередко верхняя одежда или плащ. «Покрывало» сохраняет функциональное значение и связь с последующим глаголом «покрываешься», не уточняя тип одежды сверх еврейского текста.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: которым ты покрываешься
  rationale: Относительное придаточное естественно описывает назначение предмета и сохраняет корневую связь כסות/כסה посредством «покрывало/покрываешься».
