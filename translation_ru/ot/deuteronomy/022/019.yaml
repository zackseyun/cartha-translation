  source_fidelity: 'Основной юридический смысл передан верно: денежное взыскание в сто шекелей серебра выплачивается отцу молодой женщины, брак сохраняется, а муж лишается права отослать (то есть развестись с) ней пожизненно. Однако «опорочил имя девственницы» неестественно по-русски и недостаточно ясно передаёт еврейскую идиому הוֹצִיא שֵׁם רָע עַל — распространить порочащую молву / возвести обвинение против кого-либо.'
