  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: ru
  text: Пусть взыщут с него штраф в сто шекелей серебра и отдадут их отцу молодой женщины, потому что он распространил порочащую молву о девственнице из народа Израиля. Она останется его женой; он не имеет права отослать её[a] до конца своих дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развестись с ней». Буквально: «отослать её»; в брачно-правовом контексте это обычное выражение для расторжения брака.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ אֹתוֹ
  choice: пусть наложат на него штраф
  rationale: В данном юридическом контексте глагол обозначает денежное взыскание, а не наказание вообще.
- source_word: מֵאָה כֶסֶף
  choice: сто шекелей серебра
  rationale: В еврейском тексте буквально «сто серебра»; в денежно-правовом контексте подразумевается вес в шекелях.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: отцу молодой женщины
  rationale: נַעֲרָה здесь означает молодую женщину брачного возраста; выбран современный нейтральный эквивалент.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: потому что он опорочил имя
  rationale: Передаёт образ еврейской идиомы о создании дурной репутации и естественно звучит по-русски.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: девственницы из Израиля
  rationale: Сохраняет значение בְּתוּלָה в контексте обвинения и принадлежность к народу Израиля, не превращая выражение в этническое прилагательное с возможной иной коннотацией.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Она останется его женой
  rationale: В контексте уже существующего брака фраза устанавливает продолжение брачного статуса; «останется» яснее передаёт правовой смысл, чем буквальное «будет».
- source_word: לֹא יוּכַל
  choice: он не сможет
  rationale: Передаёт установленную законом невозможность или отсутствие права, сохраняя форму исходного выражения.
- source_word: לְשַׁלְּחָהּ
  choice: отослать её
  rationale: Сохраняет буквальный образ «послать прочь»; в брачно-правовом контексте это может означать развод, что отмечено в сноске.
- source_word: כָּל יָמָיו
  choice: до конца своих дней
  rationale: Естественная русская передача идиомы пожизненной длительности с сохранением образа «дней».
theological_decisions:
- issue: Юридическая идиома расторжения брака
  choice: отослать её
  alternative: развестись с ней
  rationale: Основной текст сохраняет образность еврейского глагола, а сноска указывает его конкретный правовой смысл в брачном контексте.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим звучанием. Сохранены достоинство текста, исходная образность и правовая напряжённость; архаизмы и конфессионально окрашенные формулировки исключены.
