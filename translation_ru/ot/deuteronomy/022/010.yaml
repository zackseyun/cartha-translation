lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: Не паши
  rationale: Отрицание с формой Qal imperfect 2-го лица мужского рода единственного числа выражает прямой запрет; русский повелительный оборот естественно передаёт силу правового предписания.
- source_word: בְּשׁוֹר
  choice: вола
  rationale: שׁוֹר обозначает крупное рогатое животное, используемое как тягловое; в контексте пахоты обычное русское соответствие — «вол».
- source_word: וּבַחֲמֹר
  choice: и осла
  rationale: חֲמוֹר — обычное обозначение осла; форма согласована с конструкцией «запрягая».
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие указывает, что оба животных используются совместно, в одной упряжке; «вместе» прямо сохраняет это значение.
theological_decisions:
- issue: Сила запрета в законе завета
  choice: 'Прямое предписание: «Не паши…»'
  alternative: «Ты не должен пахать…»
  rationale: Краткая отрицательная форма повелительного наклонения в современном русском ясно и достойно передаёт юридическую силу еврейского запрета без архаизации.
- issue: Характер совместного использования животных
  choice: «запрягая вместе»
  alternative: Буквальное «не паши на воле и осле вместе»
  rationale: Предлог בְ при глаголе пахоты обозначает орудие или средство действия. Добавление «запрягая» естественно раскрывает сельскохозяйственную ситуацию, не вводя богословского толкования.
translation_notes:
  register: Современный литературный русский; краткий, ясный и достойный правовой стиль. Формулировка избегает неестественного русского оборота «пахать с волом и ослом» и передаёт совместную упряжку двух животных.
