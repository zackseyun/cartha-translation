  verdict: revise
  source_fidelity: 'Начальное «Если обнаружится, что» передаёт идею обнаружения, но размывает прямо названный в еврейском тексте объект: «мужчина будет найден». Указательное «этой» во втором упоминании женщины не имеет формального соответствия в оригинале. Остальные ключевые элементы — брачный статус, установленная смерть обоих и формула удаления зла из Израиля — переданы по существу верно.'
  naturalness: «Если найдут мужчину, лежащего с замужней женщиной» — более прямой и естественный для современного русского юридико-повествовательного регистра вариант. Он сохраняет библейский эвфемизм без разговорной окраски. «Искорени зло из Израиля» допустимо в возвышенном законодательном стиле.
  terminology: «Замужняя женщина» удачно передаёт брак женщины без неуместного буквального оттенка собственности; сноска сохраняет внутреннюю форму идиомы. «Должны умереть» обоснованно не заменяется в основном тексте более эксплицитным «быть преданными смерти», а сноска корректно отмечает юридическое значение.
