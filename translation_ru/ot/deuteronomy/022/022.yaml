base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: ru
  text: Если найдут мужчину, лежащего с замужней женщиной[a], то оба они должны умереть[b] — мужчина, лежавший с женщиной, и женщина. Так искорени зло из Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с женщиной, имеющей мужа».'
    reason: lexical_alternative
  - marker: b
    text: 'В данном законе слова «должны умереть» устанавливают смертную казнь; возможный более явный перевод: «должны быть преданы смерти».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: обнаружится
  rationale: Нифаль от מצא указывает на обнаружение факта. Безличная русская конструкция естественна для законодательного текста и не усиливает значение до обязательного «застанут на месте».
- source_word: שֹׁכֵב עִם
  choice: лежал с
  rationale: Сохранён древнееврейский эвфемизм, обозначающий половую связь. Русское «спал с» звучит более разговорно, а «вступил в половую связь» было бы более разъяснительным.
- source_word: אִשָּׁה בְעֻלַת בַּעַל
  choice: замужняя женщина
  rationale: Естественно передаёт брачный статус женщины; буквальная внутренняя форма выражения отмечена в сноске, чтобы не вводить в основной текст неуместный оттенок собственности.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: оба они должны умереть
  rationale: В законодательном контексте форма выражает установленное наказание. Перевод сохраняет глагол «умереть», не добавляя прямо не выраженного в форме пассива «быть преданными смерти».
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה
  choice: мужчина, лежавший с этой женщиной
  rationale: Относительная конструкция сохраняет юридическое уточнение личности мужчины; указательное «этой» естественно связывает повторное упоминание с уже названной женщиной.
- source_word: וְהָאִשָּׁה
  choice: и женщина
  rationale: Повтор сохранён ради юридической ясности и для передачи прямо выраженной в законе ответственности обоих.
- source_word: וּבִעַרְתָּ הָרָע
  choice: так искорени зло
  rationale: Устойчивая второзаконническая формула означает удаление зла из общины. «Искорени» передаёт её сильный нравственно-юридический смысл естественным современным русским языком.
- source_word: מִיִּשְׂרָאֵל
  choice: из Израиля
  rationale: Кратко и непосредственно передаёт удаление зла из среды народа завета.
theological_decisions:
- issue: Передача брачного статуса в выражении בְעֻלַת בַּעַל
  choice: замужняя женщина
  alternative: женщина, имеющая мужа; буквально — женщина, принадлежащая мужу
  rationale: Основной текст ясно передаёт наличие брачных уз, не превращая древнееврейскую идиому в утверждение о собственности. Буквальная форма сохраняется в сноске.
- issue: Следует ли прямо обозначить судебную казнь
  choice: должны умереть
  alternative: должны быть преданы смерти
  rationale: Контекст закона подразумевает смертную казнь, однако древнееврейский текст буквально употребляет глагол «умереть», а не пассивную формулу казни. Эта напряжённость сохранена, а юридический смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранён библейский эвфемизм «лежать с», но синтаксис сделан естественным для современного читателя. Формула «искорени зло из Израиля» передана кратко и повелительно, в соответствии с её заветно-юридическим характером.
