  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: ru
  text: Если есть молодая женщина, девственница, обручённая с мужчиной, и другой мужчина встретит её в городе и ляжет с ней,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Если будет
  rationale: Вводит условный казуистический закон; по-русски «если будет» естественно передаёт гипотетический случай.
- source_word: נער
  choice: молодая женщина
  rationale: Форма в WLC записана дефектно, но по синтаксису и контексту означает молодую женщину брачного возраста; выбор избегает как архаичного «дева», так и слишком юного оттенка слова «девушка».
- source_word: בְתוּלָה
  choice: девственница
  rationale: Прямо сохраняет указание на девственность, существенное для данного правового случая.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: обручённая с мужчиной
  rationale: «Обручённая» передаёт официальное и юридически обязательное брачное обязательство точнее, чем современное «помолвленная».
- source_word: וּמְצָאָהּ אִישׁ
  choice: и другой мужчина встретит её
  rationale: Глагол מצא здесь естественно передать как «встретит». Слово «другой» контекстуально отличает этого мужчину от того, с кем женщина обручена, не меняя смысла.
- source_word: בָּעִיר
  choice: в городе
  rationale: Буквальный и контекстуально значимый перевод места действия.
- source_word: וְשָׁכַב עִמָּהּ
  choice: и ляжет с ней
  rationale: Сохраняет эвфемистическую правовую формулировку исходного текста и не добавляет отсутствующего здесь прямого указания на принуждение.
theological_decisions:
- issue: Следует ли прямо обозначить половой акт как насильственный
  choice: «ляжет с ней» без добавления «изнасилует» или «принудит»
  alternative: «изнасилует её»; «принудит её лечь с ним»
  rationale: В самом этом стихе лексически не выражено принуждение. Нейтральная формулировка сохраняет неоднозначность и не переносит в стих выводы из соседнего правового материала.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным регистром, соответствующим правовому контексту. Синтаксис сохраняет незавершённость условного предложения, продолжающегося в следующем стихе.
