base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: ru
  text: Если по дороге тебе случайно попадётся птичье гнездо[a] — на каком-либо дереве или на земле — с птенцами или яйцами, и мать сидит на птенцах или на яйцах, не бери мать вместе с её потомством.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «если тебе встретится птичье гнездо». Еврейский глагол подразумевает случайную встречу, а не намеренный поиск.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мать на детях». В данном контексте речь о том, чтобы не забирать мать вместе с её потомством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: если… случайно попадётся
  rationale: כִּי вводит условие казуистического закона, а нифаль יִקָּרֵא указывает на случайную встречу, а не на намеренный поиск.
- source_word: קַן צִפּוֹר
  choice: птичье гнездо
  rationale: Естественная русская передача генитивной конструкции без изменения смысла.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: по дороге тебе… попадётся
  rationale: Русская конструкция естественно объединяет буквальные элементы «перед тобой» и «на пути», передавая встречу с гнездом во время пути.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: на каком-либо дереве или на земле
  rationale: В данном конкретном контексте הָאָרֶץ обозначает поверхность земли; «на каком-либо дереве» сохраняет неопределённо-обобщающий смысл כָּל.
- source_word: אֶפְרֹחִים
  choice: птенцы
  rationale: Обычное и точное современное обозначение молодых птиц, находящихся в гнезде.
- source_word: וְהָאֵם רֹבֶצֶת
  choice: и мать сидит
  rationale: Глагол רֹבֶצֶת описывает положение птицы над птенцами или яйцами; «сидит» естественно по-русски и не сужает значение до обязательного высиживания.
- source_word: לֹא תִקַּח
  choice: не бери
  rationale: Прямая форма запрета естественна для русского законодательного наставления и сохраняет силу еврейского имперфекта с отрицанием לֹא.
- source_word: הָאֵם עַל הַבָּנִים
  choice: мать вместе с птенцами
  rationale: В заключительном запрете עַל передаёт совместное взятие матери и потомства; בָּנִים в птичьем контексте естественно обозначены словом «птенцы».
