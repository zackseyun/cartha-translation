  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: ru
  text: Не оставляй без внимания осла твоего брата или его вола, упавших на дороге[a]; непременно подними их вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не скрывайся от них», то есть не уклоняйся от помощи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: твоего брата
  rationale: Сохраняет буквальное значение и семейно-общинную силу обращения в законах Второзакония; в контексте речь идёт о члене народа завета.
- source_word: חֲמוֹר
  choice: осла
  rationale: Обычное современное русское обозначение этого домашнего рабочего животного.
- source_word: שׁוֹרוֹ
  choice: его вола
  rationale: В правовом контексте, связанном с рабочим скотом, «вол» естественно передаёт שׁוֹר.
- source_word: נֹפְלִים
  choice: упавших
  rationale: Причастие описывает животных, которые упали, вероятно под тяжестью груза или от изнеможения; перевод не уточняет причину падения.
- source_word: בַּדֶּרֶךְ
  choice: на дороге
  rationale: Прямое и естественное обозначение места происшествия.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: не оставляй без внимания
  rationale: В данном контексте форма от עלם означает намеренно не замечать нужду или уклоняться от помощи. Русская формулировка естественно передаёт запрет, не вводя конкретного действия вроде «проходить мимо».
- source_word: הָקֵם תָּקִים
  choice: непременно подними
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление; наречие «непременно» передаёт эту эмфазу.
- source_word: עִמּוֹ
  choice: вместе с ним
  rationale: Сохраняет прямо выраженную совместность действия с владельцем животного, не заменяя её более толковательным «помоги ему».
