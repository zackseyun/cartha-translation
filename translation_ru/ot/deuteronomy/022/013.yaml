lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном контексте כִּי вводит условие казуистической правовой нормы; русское «если» ясно обозначает предпосылку рассматриваемого случая.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: мужчина возьмёт себе жену
  rationale: Оборот сохраняет образ еврейского «взять жену», а возвратное местоимение делает его естественным и однозначно брачным в современном русском языке.
- source_word: וּבָא אֵלֶיהָ
  choice: войдёт к ней
  rationale: Сохранён сдержанный еврейский эвфемизм, обозначающий супружескую близость; пояснение вынесено в сноску.
- source_word: וּשְׂנֵאָהּ
  choice: а затем возненавидит её
  rationale: Глагол передан своим прямым значением «возненавидеть»; «а затем» естественно выражает последовательность действий и переход к неблагоприятному развитию дела.
