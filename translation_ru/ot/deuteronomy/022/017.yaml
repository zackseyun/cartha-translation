base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: ru
  text: '«И вот, он выдвинул против неё порочащие обвинения, говоря: „Я не нашёл у твоей дочери признаков девственности“. Но вот признаки девственности моей дочери[a]». И они разложат одежду[b] перед старейшинами города.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вот девства моей дочери». Здесь множественное число может обозначать признаки или свидетельства её девственности.'
    reason: lexical_alternative
  - marker: b
    text: Эту одежду, или ткань, предъявляли старейшинам как вещественное свидетельство по делу.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательную и привлекающую внимание функцию еврейского вводного оборота, оставаясь естественным для современного русского языка.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: возводит на неё порочащие обвинения
  rationale: Передаёт формальный характер обвинения и его направленность на опорочивание девушки; местоимение «неё» восполняется из контекста.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Я не нашёл у твоей дочери признаков девственности
  rationale: Еврейское множественное בְּתוּלִים в данном судебном контексте допускает понимание как признаков или свидетельств девственности. Формулировка сохраняет связь со следующим предъявлением вещественного свидетельства.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Но вот признаки девственности моей дочери
  rationale: «Но» естественно выражает контекстуальное противопоставление обвинению, а «признаки девственности» передаёт идиоматическое множественное число, не представляя свидетельство как уже доказанное вне судебного разбирательства.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: И они разложат одежду
  rationale: Глагол обозначает разворачивание или расправление предмета для предъявления; שִׂמְלָה — широкое обозначение одежды или полотнища, поэтому конкретный вид ткани не уточняется.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: перед старейшинами города
  rationale: Естественная русская судебно-общественная формула для предъявления свидетельства городским старейшинам.
