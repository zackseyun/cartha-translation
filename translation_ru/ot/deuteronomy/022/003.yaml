  terminology: '«Брат» корректно сохраняет אָחִיךָ без интерпретационного расширения. «Плащ» соответствует שִׂמְלָה. Сноска уточнена: буквально возвратный глагол говорит о том, чтобы скрыться/уклониться, а идиоматический смысл — не делать вид, что предмета не заметили.'
