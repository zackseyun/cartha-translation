base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: ru
  text: 'Так же поступай с его ослом, так же поступай с его плащом и так же поступай с любой вещью твоего брата, которая у него пропадёт и которую ты найдёшь: тебе нельзя оставлять её без внимания[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ты не можешь скрыться (от этого)»; также возможно: «ты не можешь сделать вид, будто не заметил».'
    reason: Сохраняет буквальный образ возвратного глагола לְהִתְעַלֵּם и поясняет его идиоматический смысл в правовом контексте.
lexical_decisions:
- source_word: וְכֵן
  choice: так же
  rationale: Передаёт связь с предыдущим стихом и сохраняет трёхкратный повтор, характерный для правового предписания.
- source_word: תַּעֲשֶׂה
  choice: поступай
  rationale: В данном правовом контексте форма выражает предписание; русский императив звучит естественно и сохраняет обязательную силу.
- source_word: לַחֲמֹרוֹ
  choice: с его ослом
  rationale: Предлог передан идиоматическим русским оборотом «поступить с», относящимся к найденному ослу ближнего.
- source_word: לְשִׂמְלָתוֹ
  choice: с его одеждой
  rationale: שִׂמְלָה обозначает предмет одежды, нередко верхнюю одежду; более общее «одежда» не вводит излишней конкретизации.
- source_word: לְכָל אֲבֵדַת אָחִיךָ
  choice: со всякой вещью твоего брата
  rationale: Контекст ясно указывает на потерянную вещь; «вещь» естественнее по-русски, а состояние утраты выражено следующим придаточным предложением. Родственное обозначение «брат» сохранено.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: которая потеряется у него
  rationale: Сохраняет непереходное значение еврейского глагола и не превращает владельца в явно названного деятеля.
- source_word: וּמְצָאתָהּ
  choice: и которую ты найдёшь
  rationale: Прямо и естественно передаёт последующее обнаружение потерянной вещи.
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  choice: тебе нельзя оставлять её без внимания
  rationale: В правовом контексте оборот выражает запрет уклониться от ответственности. Выбранная формулировка естественна по-русски, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Значение אָחִיךָ в контексте закона заветного сообщества
  choice: твоего брата
  alternative: твоего соплеменника; твоего ближнего
  rationale: Сохранено прямое мужское родственное обозначение исходного текста, не расширенное и не суженное толкованием.
- issue: Сила выражения לֹא תוּכַל לְהִתְעַלֵּם
  choice: тебе нельзя оставлять её без внимания
  alternative: ты не можешь скрыться; ты не должен делать вид, будто не заметил
  rationale: Оборот имеет буквальный образ сокрытия или уклонения, но в законодательном контексте запрещает пренебречь найденным. Основной текст передаёт правовую силу, а сноска — образность.
translation_notes:
  register: Современный литературный русский язык с достоинством правового наставления. Трёхкратное «так же поступай» намеренно сохраняет повтор исходного текста; лексика понятна широкому читателю и не содержит конфессионально специфических формулировок.
