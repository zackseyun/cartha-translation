- source_word: לֹא תִלְבַּשׁ
  choice: не надевай
  rationale: Отрицание с формой 2-го лица единственного числа в законодательном контексте естественно передаётся прямым запретом; глагол לבש означает ношение или надевание одежды.
- source_word: שַׁעַטְנֵז
  choice: шаатнез
  rationale: Редкий технический термин сохранён транслитерацией, поскольку его точный оттенок не вполне прозрачен; следующая фраза непосредственно поясняет состав запрещённого материала.
- source_word: צֶמֶר
  choice: шерсти
  rationale: Обычное обозначение шерсти в контексте тканей.
- source_word: וּפִשְׁתִּים
  choice: и льна
  rationale: Слово может обозначать лён как растение или льняной материал; применительно к одежде естественно понимать его как льняное волокно или ткань.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие указывает на совместное использование двух материалов в одной одежде.
