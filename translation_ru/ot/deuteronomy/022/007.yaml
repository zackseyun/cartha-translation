base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: ru
  text: непременно отпусти мать, а потомство можешь взять себе[a], чтобы тебе было хорошо и чтобы ты долго жил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновей»; в контексте птичьего гнезда имеются в виду яйца или птенцы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: обязательно отпусти
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление; «обязательно отпусти» естественно передаёт эту эмфазу по-русски.
- source_word: הָאֵם
  choice: мать
  rationale: Непосредственный контекст говорит о птице, поэтому добавлять «птицу» не требуется.
- source_word: הַבָּנִים
  choice: птенцов
  rationale: Буквально «сыновей, детей», но применительно к птичьему гнезду речь идёт о птенцах; это естественное контекстуальное соответствие.
- source_word: תִּקַּח לָךְ
  choice: можешь взять себе
  rationale: После повеления отпустить мать форма глагола в данном контексте выражает дозволение; «себе» сохраняет значение לָךְ.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: чтобы тебе было хорошо
  rationale: Передаёт распространённую формулу цели или результата близко к еврейскому тексту и естественно для современного русского языка.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: и чтобы ты долго жил
  rationale: Буквально «и продлишь дни»; по-русски идиоматический смысл естественнее выражается как «долго жил», при этом связь с לְמַעַן передана повтором «чтобы».
theological_decisions:
- issue: Характер обещанного результата
  choice: 'Сохранена формула благословения или результата послушания: «чтобы тебе было хорошо и чтобы ты долго жил».'
  alternative: Понимать слова как безусловную механическую гарантию долголетия каждому отдельному человеку.
  rationale: Еврейский текст связывает благополучие и долгую жизнь с исполнением заповеди, но не требует усиливать это утверждение до явно безусловной индивидуальной гарантии.
translation_notes:
  register: Современный литературный русский язык; повеление передано ясно и сдержанно, без архаизмов. Союз «а» естественно обозначает переход от обязательного отпускания матери к дозволению взять птенцов.
