  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: ru
  text: Ведь он нашёл её в поле[a]; обручённая молодая женщина кричала, но некому было её спасти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в открытой местности». Еврейское выражение указывает на удалённую сельскую местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего судебного решения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: בַשָּׂדֶה
  choice: в поле
  rationale: Прямой и понятный перевод, обозначающий открытую сельскую местность, где поблизости могло не оказаться помощи.
- source_word: מְצָאָהּ
  choice: встретил её
  rationale: В данном контексте מצא означает, что мужчина наткнулся на женщину или встретил её; «встретил» звучит естественно и не предполагает предшествующего поиска.
- source_word: צָעֲקָה
  choice: кричала
  rationale: Глагол обозначает крик в бедствии, в данном контексте — призыв о помощи; русский глагол сохраняет это значение без лишнего уточнения.
- source_word: הנער
  choice: молодая женщина
  rationale: Хотя согласная форма сама по себе допускает формальную неоднозначность, контекст и женское согласование однозначно указывают на женщину; современное выражение не звучит архаично или по-детски.
- source_word: הַמְאֹרָשָׂה
  choice: обручённая
  rationale: Причастие обозначает женщину, юридически связанную обещанием брака; «обручённая» сохраняет древний правовой вес точнее, чем современное «помолвленная».
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: но некому было её спасти
  rationale: Оборот выражает отсутствие человека, способного прийти на помощь. «Спасти» здесь имеет непосредственный ситуативный смысл и естественно сочетается с безличным «некому было».
theological_decisions:
- issue: Передача правового статуса הַמְאֹרָשָׂה
  choice: обручённая
  alternative: помолвленная; обещанная в жёны
  rationale: «Обручённая» передаёт формально признанный брачный статус в древнеизраильском праве, не сводя его к менее обязательной современной помолвке и не привнося конфессиональных толкований.
- issue: Родовая передача הַנַּעַר в контексте
  choice: молодая женщина
  alternative: девушка; девица
  rationale: Женский референт установлен контекстом и согласованием. Выбранное выражение точно по роду, современно и не создаёт неуместного акцента на несовершеннолетии или архаическом стиле.
translation_notes:
  register: 'Современный литературный русский язык с достоинством юридического объяснения. Синтаксис краткий и ясный; сохранена логика стиха: изолированное место, крик женщины и отсутствие возможного спасителя.'
