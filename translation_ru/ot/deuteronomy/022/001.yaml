  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: ru
  text: Если увидишь вола твоего брата или его овцу[a], которые отбились, не делай вид, будто не заметил их; непременно верни их своему брату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать мелкий скот, то есть овцу или козу.
    reason: Передаёт более широкий лексический диапазон שֶׂה, не перегружая основной текст.
lexical_decisions:
- source_word: אָחִיךָ
  choice: твоего брата / своему брату
  rationale: Сохраняет родственный образ еврейского текста; в контексте закона «брат» также может обозначать соплеменника.
- source_word: שֵׂיוֹ
  choice: овца
  rationale: Еврейское שֶׂה может обозначать мелкий скот — овцу или козу; «овца» естественно сочетается с данным примером, а более широкий смысл отмечен в сноске.
- source_word: נִדָּחִים
  choice: отбились от стада
  rationale: Причастие от נדח передаёт состояние животных, ушедших в сторону, заблудившихся или отогнанных; в данном контексте естественное русское выражение не утверждает, что их обязательно кто-то прогнал.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: не оставляй их без внимания
  rationale: Передаёт запрет намеренно уклоняться от помощи или делать вид, будто не заметил животных.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: непременно верни их
  rationale: Инфинитив абсолютный с личной формой того же глагола усиливает повеление; «непременно» естественно выражает эту эмфазу.
theological_decisions:
- issue: Значение «брат» в законодательном контексте
  choice: Сохранено буквальное «брат»
  alternative: «соплеменник» или «ближний»
  rationale: Исходный текст использует термин родства; его социально-заветный диапазон не следует молча сужать или заменять толкованием.
- issue: Причина удаления животных
  choice: «отбились от стада»
  alternative: «были отогнаны» или «заблудились»
  rationale: Еврейская форма допускает состояние удаления без однозначного указания на действующее лицо; перевод сохраняет эту неопределённость и подходит к потерявшемуся скоту.
translation_notes:
  register: Современный литературный русский язык с ясной законодательной формой. Сохранены прямое обращение во втором лице единственного числа и выразительное усиление повеления. В основном тексте требуется поставить маркер [a] после слова «овца».
