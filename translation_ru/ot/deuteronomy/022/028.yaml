base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: ru
  text: Если мужчина встретит молодую женщину, девственницу, которая не обручена[a], схватит её[b] и ляжет с ней, и их обнаружат,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которая не помолвлена».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может означать «схватить», «ухватить» или «захватить». Некоторые понимают эту фразу как указание на изнасилование; по мнению других, юридический характер случившегося следует определять из более широкого контекста, а не только по этому глаголу.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: если
  rationale: Вводит условие казуистического закона; «если» естественно для современного русского юридического изложения.
- source_word: יִמְצָא
  choice: встретит
  rationale: Основное значение — «найти»; в данном контексте русское «встретит» естественно передаёт случай, когда мужчина находит или встречает женщину, без добавления мотива поиска.
- source_word: אִישׁ
  choice: мужчина
  rationale: Сохраняет конкретное мужское лицо, обозначенное еврейским существительным в единственном числе.
- source_word: נער בְתוּלָה
  choice: молодую женщину, девственницу
  rationale: Передаёт оба признака — молодость и девственность — современным языком, избегая архаичного «девица» и возможного слишком юного оттенка слова «девочка».
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: которая не обручена
  rationale: «Обручена» достаточно точно передаёт юридически значимое состояние помолвки или обручения в древнеизраильском обществе.
- source_word: וּתְפָשָׂהּ
  choice: схватит её
  rationale: Глагол תפשׂ означает «схватить», «ухватить», «захватить». Выбор сохраняет выраженный в слове физический компонент, не заменяя его заранее более узким юридическим определением.
- source_word: וְשָׁכַב עִמָּהּ
  choice: и ляжет с ней
  rationale: Сохраняет прозрачный библейский эвфемизм половой связи и формально соответствует еврейскому выражению.
- source_word: וְנִמְצָאוּ
  choice: и их обнаружат
  rationale: 'Передаёт форму множественного числа и пассивный смысл: случившееся становится известным и оба оказываются обнаружены.'
theological_decisions:
- issue: Следует ли прямо обозначить произошедшее словом «изнасилует»
  choice: Сохранить формулировку «схватит её и ляжет с ней».
  alternative: «изнасилует её»; «возьмёт её»
  rationale: Значение תפשׂ включает физическое схватывание, но сам глагол не является однозначным юридическим термином для изнасилования. Основной текст сохраняет силу еврейской формулировки, не смягчая её до «возьмёт» и не снимая спорный вопрос более узким толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной интонацией закона. Синтаксис сохраняет незавершённость условного предложения, поскольку стих продолжается в следующем стихе. Архаизмы по возможности исключены; традиционный оборот «ляжет с ней» сохранён как ясный и близкий к форме оригинала.
