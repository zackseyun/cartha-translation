base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: ru
  text: 'и станет выдвигать против неё обвинения и опорочит её имя, говоря: «Я взял эту женщину в жёны и сблизился с ней, но не нашёл у неё признаков девственности[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не нашёл у неё девственности». Здесь имеются в виду признаки, считавшиеся свидетельством девственности; ср. следующие стихи.'
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: станет обвинять её в постыдных поступках
  rationale: Оборот обозначает возведение на женщину обвинений. Прилагательное «постыдных» передаёт порочащую силу выражения, не внося прямо понятие ложности, которое устанавливается дальнейшим разбирательством.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: порочить её доброе имя
  rationale: Естественный русский фразеологизм сохраняет образ «имени» и передаёт нанесение ущерба репутации.
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: Я взял эту женщину в жёны
  rationale: В брачном контексте לקח означает взять женщину в жёны; дополнение «в жёны» устраняет неестественную для современного русского двусмысленность, а «эту женщину» сохраняет отстранённую формулировку говорящего.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: сблизился с ней
  rationale: Сохраняется скромный эвфемизм источника, который в контексте обозначает половую близость.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: не нашёл у неё признаков девственности
  rationale: Множественное בְּתוּלִים в данном судебном контексте указывает на свидетельства или признаки девственности, упоминаемые в последующих стихах.
