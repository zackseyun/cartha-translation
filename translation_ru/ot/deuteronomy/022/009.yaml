  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: ru
  text: 'Не засевай свой виноградник двумя видами семян, иначе всё будет посвящено[a]: и семя, которое ты посеешь, и урожай виноградника.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «станет святым (освящённым)», то есть будет отделено и больше не сможет употребляться обычным образом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: не засевай
  rationale: Глагол זרע означает «сеять»; с объектом «виноградник» русское «засевать» естественно передаёт действие и сохраняет сельскохозяйственную точность.
- source_word: כַּרְמְךָ
  choice: свой виноградник
  rationale: כֶּרֶם — обычное обозначение виноградника; возвратное «свой» естественно соотносит его с адресатом повеления.
- source_word: כִּלְאָיִם
  choice: семенами двух разных видов
  rationale: Двойственная форма обозначает запрещённое смешение разных видов. Формулировка передаёт множественность семян и различие их видов, не сводя термин к неопределённой «смеси».
- source_word: פֶּן
  choice: иначе
  rationale: פֶּן вводит нежелательное последствие, которого следует избежать; «иначе» естественно звучит в современном русском законодательном наставлении.
- source_word: תִּקְדַּשׁ
  choice: станет посвящённым
  rationale: Сохранено прямое значение корня קדש — «стать святым, посвящённым, отделённым». В контексте это означает изъятие урожая из обычного употребления, но перевод не заменяет неоднозначный исходный образ истолкованием «будет конфискован».
- source_word: הַמְלֵאָה
  choice: весь урожай
  rationale: Буквально «полнота» здесь обозначает полный объём полученного урожая; «весь урожай» ясно и естественно передаёт смысл.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: то, что вырастет из посеянных тобой семян
  rationale: Хотя буквально это «семя, которое ты посеешь», в перечне урожая זֶרַע может указывать на полученный от посева продукт. Формулировка устраняет неестественное впечатление, будто посвящаются только первоначально высеянные семена.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: и урожай виноградника
  rationale: תְּבוּאָה означает урожай или произведение земли; «урожай виноградника» — точный и естественный русский эквивалент.
theological_decisions:
- issue: Значение תִּקְדַּשׁ в законе о смешанном посеве
  choice: «станет посвящённым» с пояснением об отделении от обычного употребления
  alternative: «будет конфискован» / «станет запретным» / «станет святым»
  rationale: Еврейский глагол буквально выражает освящение или посвящение, тогда как точный практический результат обсуждается. Основной текст сохраняет богословско-правовую напряжённость, а примечание предотвращает ошибочное понимание как положительной оценки смешанного урожая.
translation_notes:
  register: Современный литературный русский язык с лаконичным нормативным тоном. Императив в единственном числе соответствует еврейскому обращению. Трудное תִּקְדַּשׁ передано достаточно буквально, а его правовое значение пояснено в сноске.
