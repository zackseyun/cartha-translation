review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: предписание относится к постройке нового дома, устройству защитного ограждения на крыше и ответственности за предотвратимое падение. Однако оборот «чтобы на твоём доме не было вины» ослабляет исходное действие адресата («не возлагай/не навлекай») и по-русски звучит менее естественно.'
  naturalness: '«Ограждение по краю крыши» — современно и понятно. Формулировку о вине следует сделать активной и нормативной: «чтобы не навлечь на свой дом вину за пролитую кровь».'
  terminology: «Ограждение» удачно передаёт מַעֲקֶה без неоправданного уточнения материала или типа конструкции. «Вина за пролитую кровь» адекватно выражает юридико-нравственную силу דָּמִים; терминологически предпочтительнее сохранить связь этой вины с ответственностью владельца.
  issues:
