- from: Когда построишь новый дом, сделай ограждение по краю крыши, чтобы на твоём доме не было вины за пролитую кровь, если кто-нибудь упадёт с крыши.
  to: Когда построишь новый дом, сделай ограждение по краю крыши, чтобы не навлечь на свой дом вину за пролитую кровь, если кто-нибудь упадёт с крыши.
  rationale: 'Исправлена только передача юридической идиомы «возложить кровь на дом»: активное «не навлечь ... вину» сохраняет образ вины, лежащей на доме, и яснее выражает ответственность строящего. Остальные элементы исходного текста переданы точно и естественно; сноска не обязательна, поскольку «ограждение по краю крыши» достаточно ясно в контексте.'
