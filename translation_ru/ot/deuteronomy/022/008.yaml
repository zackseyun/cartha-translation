base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: ru
  text: Когда построишь новый дом, сделай ограждение по краю крыши, чтобы не навлечь на свой дом вину за пролитую кровь, если кто-нибудь упадёт с крыши.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: Вводит типичный случай в правовом предписании; «когда» естественно передаёт предполагаемую ситуацию, не превращая её в причинное придаточное.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: построишь новый дом
  rationale: Прямо и естественно передаёт глагол, существительное и определение.
- source_word: וְעָשִׂיתָ
  choice: сделай
  rationale: Форма с וְ в законодательном контексте имеет предписывающую силу; русский императив ясно и естественно выражает обязанность.
- source_word: מַעֲקֶה
  choice: ограждение
  rationale: Обозначает защитный барьер по краю плоской крыши. «Ограждение» понятно современному читателю и не сужает конструкцию до перил или каменного парапета.
- source_word: לְגַגֶּךָ
  choice: по краю крыши
  rationale: Передаёт назначение и фактическое расположение защитного ограждения; добавление «по краю» уточняет подразумеваемую конструкцию без изменения смысла.
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: чтобы на твоём доме не было вины за пролитую кровь
  rationale: Идиома буквально говорит о возложении «крови» на дом; перевод сохраняет юридико-нравственный смысл ответственности за предотвратимую смерть и образ вины, лежащей на доме.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: если кто-нибудь упадёт
  rationale: Причастие с глаголом обозначает неопределённого потенциального пострадавшего. Русская формулировка сохраняет условный характер ситуации без неестественного повтора.
- source_word: מִמֶּנּוּ
  choice: с крыши
  rationale: Местоименный суффикс естественно относится к крыше или строению; явное повторение «с крыши» устраняет возможную для русского языка неясность.
theological_decisions:
- issue: Значение דָּמִים в юридическом контексте
  choice: вина за пролитую кровь
  alternative: кровопролитие; ответственность за смерть
  rationale: Речь идёт не только о факте гибели, но и о нравственно-правовой ответственности хозяина за предотвратимую смерть. Формулировка сохраняет образ крови и не привносит более поздних доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного предписания. Императив «сделай» звучит ясно и нормативно; «ограждение» доступнее специального «парапет». Поскольку сноски отсутствуют, маркеры в основном тексте не требуются.
