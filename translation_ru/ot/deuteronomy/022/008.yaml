    rationale: В еврейском выражении וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ адресат не просто констатирует отсутствие вины, а не допускает/не навлекает кровной вины на свой дом. Активная русская формулировка лучше передаёт ответственность и естественнее в современном литературном языке.
  revised_text: Когда построишь новый дом, сделай ограждение по краю крыши, чтобы не навлечь на свой дом вину за пролитую кровь, если кто-нибудь упадёт с крыши.
