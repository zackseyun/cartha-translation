translation:
  language: ru
  text: Тогда отец молодой женщины и её мать пусть возьмут и представят доказательство девственности молодой женщины старейшинам города у городских ворот[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «девственности молодой женщины» (множественное число); это идиоматическое выражение, обозначающее доказательство или вещественные признаки, предъявляемые как свидетельство девственности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: должны взять
  rationale: В правовой последовательности форма выражает предписанное последующее действие; «должны» естественно передаёт обязательность процедуры.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: отец молодой женщины и её мать
  rationale: נַעֲרָה обозначает молодую женщину брачного возраста; такой перевод современен и не придаёт ей детского возраста.
- source_word: וְהוֹצִיאוּ
  choice: вынести
  rationale: Каузативная форма יצא здесь означает вынести и представить нечто перед властями; «вынести» сохраняет конкретность исходного выражения.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: доказательство девственности молодой женщины
  rationale: Буквально употреблено множественное число «девственности», но в данном юридическом контексте это идиома, обозначающая вещественное свидетельство девственности.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: к старейшинам города
  rationale: Предлог אֶל указывает направление к старейшинам как к судебному органу города.
- source_word: הַשַּׁעְרָה
  choice: к воротам
  rationale: Направительное окончание буквально указывает движение к воротам; повторение «к» в русском ясно сохраняет связь места со старейшинами и не устраняет направительный оттенок.
