base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: ru
  text: Но если мужчина встретит в поле обручённую молодую женщину, схватит её[a] и ляжет с ней, то умереть должен только мужчина, который лёг с ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьмёт её силой», «одолеет её»; контекст этого постановления показывает, что речь идёт об изнасиловании. Еврейский текст буквально говорит, что мужчина «схватит» её.'
    reason: Лексическая альтернатива и пояснение насильственного характера действия.
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Условие противопоставлено предыдущему правовому случаю; «но если» естественно передаёт этот переход.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое соответствие еврейскому שׂדה; из контекста соседних стихов ясно, что речь идёт о месте вдали от людей.
- source_word: יִמְצָא
  choice: встретит
  rationale: В описании правового случая русское «встретит» естественнее буквального «найдёт» и не добавляет намеренного поиска.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: обручённую молодую женщину
  rationale: «Обручённую» передаёт юридически обязательный статус, более сильный, чем современная помолвка; «молодая женщина» ясно и не архаично передаёт возрастное обозначение.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: схватит её
  rationale: Глагол выражает силовое удержание или захват. Перевод сохраняет конкретный образ исходного текста, а насильственный характер действия поясняется в сноске и подтверждается контекстом закона.
- source_word: וְשָׁכַב עִמָּהּ
  choice: ляжет с ней
  rationale: Сохранён обычный древнееврейский эвфемизм для полового сношения; выражение понятно и выдержано в достойном регистре.
- source_word: וּמֵת ... לְבַדּוֹ
  choice: тогда умереть должен только тот мужчина
  rationale: 'Формулировка передаёт предписываемое законом последствие и исключительность наказания: смерти подлежит мужчина, но не женщина.'
theological_decisions:
- issue: Следует ли прямо назвать действие изнасилованием в основном тексте
  choice: Сохранить лексически прозрачное «схватит её», указав насильственный характер в сноске.
  alternative: «изнасилует её» или «возьмёт её силой»
  rationale: Контекст однозначно описывает действие без согласия женщины, однако сам глагол חזק означает прежде всего «схватить, удержать, одолеть», а не является специальным словом со значением «изнасиловать». Такое решение сохраняет и смысл контекста, и точность к формулировке источника.
translation_notes:
  register: Современный литературный русский язык с достойным правовым и библейским звучанием. Синтаксис остаётся близким к последовательности еврейского текста, но избегает неестественных для русского повторов.
