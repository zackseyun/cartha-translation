id: DEU.22.29
reference: Deuteronomy 22:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/נָתַן הָ/אִ֨ישׁ הַ/שֹּׁכֵ֥ב עִמָּ֛/הּ לַ/אֲבִ֥י ה/נער חֲמִשִּׁ֣ים כָּ֑סֶף וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔/הּ לֹא יוּכַ֥ל שַׁלְּחָ֖/ה כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: ru
  text: Тогда мужчина, который лёг с ней, должен дать отцу молодой женщины пятьдесят шекелей серебра, и она станет его женой, потому что он обесчестил её[a]. Он не сможет отослать её[b] до конца своих дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «унижал (или унизил) её». В данном контексте еврейский глагол означает сексуальное бесчестье и унижение.'
    reason: lexical_alternative
  - marker: b
    text: «Отослать её» здесь означает развестись с ней.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Тогда ... должен дать
  rationale: Последовательный вав с перфектом продолжает правовое предписание; «тогда» ясно передаёт последовательность, а «должен» — обязательность.
- source_word: הַשֹּׁכֵב עִמָּהּ
  choice: который лёг с ней
  rationale: Сдержанное и понятное выражение, близкое к еврейской формулировке полового акта.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: отцу молодой женщины
  rationale: נַעֲרָ обозначает девушку или молодую женщину брачного возраста; выбранный вариант естественен и не создаёт ненужного впечатления детского возраста.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: пятьдесят шекелей серебра
  rationale: Буквально «пятьдесят серебра»; в правовом и хозяйственном контексте подразумевается весовая денежная единица — шекель.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: и она станет его женой
  rationale: Передаёт возникающий вследствие предписания брачный статус, не добавляя идеи владения.
- source_word: תַּחַת אֲשֶׁר
  choice: потому что
  rationale: Естественно передаёт причинное основание правового постановления.
- source_word: עִנָּהּ
  choice: обесчестил её
  rationale: В породе пиэль и данном сексуальном контексте глагол обозначает унижающее, оскверняющее обращение. «Обесчестил» сохраняет серьёзность и некоторую лексическую широту, не уточняя насилие сверх формулировки самого стиха.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: Он не сможет отослать её
  rationale: Сохраняет буквальную модальную конструкцию «не сможет» и образ «отослать», который в брачном правовом контексте означает развод.
- source_word: כָּל יָמָיו
  choice: до конца своих дней
  rationale: Естественный современный русский эквивалент еврейской идиомы пожизненной длительности.
theological_decisions:
- issue: Передача עִנָּהּ без смягчения сексуального унижения и без излишнего уточнения вида принуждения
  choice: обесчестил её
  alternative: унижал её; надругался над ней; изнасиловал её
  rationale: «Обесчестил» обозначает серьёзное сексуальное бесчестье и деградацию, сохраняя семантическую широту ענה. «Изнасиловал» может соответствовать пониманию более широкого контекста, но вносит в этот отдельный глагол большую конкретность; «унижал» в современном русском слишком расплывчато.
- issue: Смысл запрета לֹא יוּכַל שַׁלְּחָהּ
  choice: сохранить образ «отослать» в тексте и пояснить брачно-правовой смысл
  alternative: он не сможет развестись с ней
  rationale: Так перевод остаётся близким к исходной формулировке, а сноска устраняет возможную неясность и указывает на развод как юридический смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формулировка сдержанна, но не смягчает тяжесть поступка; исходная лексическая неоднозначность ענה отмечена в сноске.
