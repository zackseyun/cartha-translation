base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: ru
  text: Но Яхве, твой Бог, отдаст их в твою власть[a] и повергнет их в великое смятение[b], пока они не будут истреблены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдаст их перед тобой»; здесь это означает, что Яхве отдаст врагов в твою власть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в великую панику»; возможен также перевод: «в великую сумятицу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: отдаст их в твою власть
  rationale: Сочетание נתן с прямым дополнением и לְפָנֶיךָ в военном контексте означает передачу врагов под власть Израиля; этот перевод естественно выражает подразумеваемый смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом второго лица мужского рода единственного числа прямо означает «твой Бог».
- source_word: לְפָנֶיךָ
  choice: в твою власть
  rationale: Буквально «перед тобой», но вместе с נתן здесь идиоматически указывает на передачу врагов во власть адресата.
- source_word: וְהָמָם
  choice: повергнет их в великое смятение
  rationale: Глагол המם обозначает причинение паники, замешательства или разгрома; «повергнет» сохраняет каузативную силу и военный оттенок.
- source_word: מְהוּמָה גְדֹלָה
  choice: великое смятение
  rationale: Сочетание обозначает сильную панику, сумятицу или смятение; выбранный вариант достоин по регистру и достаточно широк по смыслу.
- source_word: עַד הִשָּׁמְדָם
  choice: пока они не будут истреблены
  rationale: Конструкция с עַד задаёт предел действия, а форма שׁמד выражает их уничтожение; пассивная формулировка сохраняет результативный смысл.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Обращение во втором лице единственного числа сохранено. Лексика избегает архаизмов, при этом удерживает военный контекст и смысловую широту מְהוּמָה.
