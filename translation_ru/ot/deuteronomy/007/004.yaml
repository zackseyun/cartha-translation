base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: ru
  text: Потому что он отвратит твоего сына от следования за Мной[a], и они станут служить другим богам[b]. Тогда гнев Яхве[c] воспылает против вас[d], и Он быстро уничтожит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от [хождения] за Мной»; это выражение означает перестать следовать Яхве и быть Ему верным.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст переходит от единственного числа («твоего сына») к множественному («они станут служить»). Возможно также понимание по смыслу: «и он станет служить другим богам».'
    reason: alternative_reading
  - marker: c
    text: «Яхве» передаёт еврейское имя יהוה (YHWH), традиционно заменяемое в переводах словом «Господь».
    reason: alternative_reading
  - marker: d
    text: Здесь обращение стоит во множественном числе («против вас»), а далее — в единственном («уничтожит тебя»); этот переход в еврейском тексте сохранён.
    reason: textual_feature
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание запрета, данного в предыдущем стихе; русский причинный союз ясно сохраняет эту связь.
- source_word: יָסִיר
  choice: отвратит
  rationale: Каузативная форма глагола סור означает, что кто-то побудит сына отступить. «Отвратит … от» естественно передаёт это значение и соответствует возвышенному, но современному регистру.
- source_word: בִּנְךָ
  choice: твоего сына
  rationale: В еврейском тексте стоит мужской род и единственное число, связанные с запретом брать чужеземную дочь за своего сына; обобщение до «детей» устранило бы эту конкретику.
- source_word: מֵאַחֲרַי
  choice: от следования за Мной
  rationale: Буквально «от [хождения] за Мной» — устойчивое выражение верности и послушания Яхве. Перевод передаёт идиому естественно, не сводя её лишь к физическому движению.
- source_word: וְעָבְדוּ
  choice: и они станут служить
  rationale: Глагол имеет форму множественного числа. Перевод сохраняет заметный переход от единственного «сына» к множественному субъекту, не исправляя его на предполагаемое «он».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямой и общепонятный перевод, сохраняющий противопоставление исключительной верности Яхве.
- source_word: וְחָרָה אַף יְהוָה
  choice: Тогда гнев Яхве воспылает
  rationale: Еврейская идиома буквально изображает гнев как разгорающийся огонь. «Воспылает» сохраняет образ и достоинство речи, а «тогда» естественно показывает следствие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не заменяющий его титул.
- source_word: בָּכֶם
  choice: на вас
  rationale: Предлог при выражении о разгорающемся гневе обозначает тех, на кого он направлен. Сохранено множественное число обращения.
- source_word: וְהִשְׁמִידְךָ
  choice: и Он … уничтожит тебя
  rationale: Каузативная форма שׁמד выражает полное уничтожение. «Уничтожит» достаточно сильно и ясно; единственное число местоимения сохранено.
- source_word: מַהֵר
  choice: быстро
  rationale: Наречие указывает на стремительность суда; выбран прямой и современный русский эквивалент.
theological_decisions:
- issue: Референт подлежащих и переход от единственного числа к множественному
  choice: Сохранены «он отвратит твоего сына» и затем «они станут служить», без уточнения личности «он» и без согласования числа.
  alternative: Передать «он станет служить другим богам», понимая продолжение как относящееся только к сыну; либо явно назвать чужеземного супруга причиной отступления.
  rationale: В еврейском тексте подлежащее יָסִיר не названо прямо, а затем глагол неожиданно переходит во множественное число. Сохранение форм оставляет открытым, расширяется ли предупреждение на семью или общину либо отражает иной синтаксический переход.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не подменяет его титулом.
- issue: Число адресата в формуле суда
  choice: «на вас … уничтожит тебя»
  alternative: Сгладить оба местоимения до единственного или множественного числа.
  rationale: Источник переходит от множественного בָּכֶם к единственному וְהִשְׁמִידְךָ. Этот переход может соотносить весь народ с Израилем как единым адресатом; перевод не устраняет напряжение.
translation_notes:
  register: Современный литературный русский с торжественной интонацией предупреждения. Формы «отвратит» и «воспылает» несколько возвышенны, но понятны и уместны для библейского законодательного контекста. Заглавные буквы в «Мной» и «Он» указывают на Бога по принятой русской религиозной письменной традиции, не добавляя толкования к содержанию.
