base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: ru
  text: 'Но вот что вы должны с ними сделать: разрушьте их жертвенники, разбейте их священные столбы[a], срубите их столбы Ашеры[b], а их резные изображения[c] сожгите в огне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их священные камни». Речь идёт о вертикально установленных культовых камнях.'
    reason: lexical_alternative
  - marker: b
    text: Евр. ашерим — вероятно, деревянные культовые предметы, связанные с богиней Ашерой.
    reason: cultural_note
  - marker: c
    text: 'Или: «резные идолы». Еврейское слово точнее обозначает изображения, изготовленные резьбой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: Но вот что вы должны с ними сделать
  rationale: Оборот выражает резкое противопоставление предыдущему запрету и вводит следующий перечень предписанных действий; формулировка естественна для современного русского языка и сохраняет директивную силу.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: разрушьте их жертвенники
  rationale: Глагол נתץ обозначает разрушение сооружения; «разрушьте» точно и естественно сочетается с «жертвенниками».
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: разбейте их священные столбы
  rationale: מַצֵּבָה здесь означает вертикально установленный культовый камень или столб; «священные столбы» передаёт культовый контекст, а «разбейте» сохраняет силу формы Piel.
- source_word: אֲשֵׁירֵיהֶם תְּגַדֵּעוּן
  choice: срубите их столбы Ашеры
  rationale: אֲשֵׁרִים — культовые предметы, связанные с богиней Ашерой и, вероятно, изготовленные из дерева; «срубите» соответствует действию גדע и отличает их от каменных столбов.
- source_word: פְסִילֵיהֶם
  choice: их резные изваяния
  rationale: פֶּסֶל обозначает изготовленное резьбой изображение; «резные изваяния» сохраняет конкретный способ изготовления и не сводит значение к более общему слову «идолы».
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: сожгите в огне
  rationale: Формулировка сохраняет явно упомянутый в еврейском тексте огонь и звучит естественно в торжественном предписании.
theological_decisions:
- issue: Передача אֲשֵׁרִים как особого вида ханаанского культового предмета
  choice: столбы Ашеры
  alternative: ашерим; изображения Ашеры; священные деревья
  rationale: Контекст перечисляет разные виды культовых объектов. Конкретное обозначение сохраняет историко-религиозный референт, не заменяя его общим словом «идолы»; примечание оговаривает неопределённость точного вида предмета.
- issue: Сила повеления уничтожить культовые объекты
  choice: 'прямые повелительные формы: «разрушьте», «разбейте», «срубите», «сожгите»'
  alternative: смягчённое обобщение вроде «уничтожьте всё это»
  rationale: Еврейский текст содержит конкретные и сильные предписания. Перевод не смягчает их и не добавляет отсутствующего в стихе богословского обоснования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Прямые повелительные формы сохраняют последовательность и силу еврейского текста; редкие реалии пояснены в примечаниях без конфессионального истолкования.
