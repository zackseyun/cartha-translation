base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: ru
  text: Он отдаст их царей в твою руку, и ты сотрёшь их имя из-под небес. Ни один человек[a] не устоит перед тобой, пока ты не истребишь их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никто не устоит перед тобой». Еврейское слово אִישׁ («человек») употреблено здесь в обобщающем смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Он отдаст
  rationale: Форма совершенного вида с союзом в данном ряду обещаний имеет будущее значение; подразумеваемый субъект — Господь из контекста.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: их царей в твою руку
  rationale: Сохранён еврейский образ передачи в чью-либо руку, то есть во власть.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: и ты сотрёшь их имя
  rationale: Каузативная форма אבד относится к собирательному существительному «имя» и означает полное устранение памяти о них; «сотрёшь» естественно передаёт этот образ по-русски.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: из-под небес
  rationale: Сохранён пространственный образ исходного текста, обозначающий полное исчезновение из мира людей.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: Ни один человек не устоит перед тобой
  rationale: Глагол обозначает занять позицию и устоять в сопротивлении; «перед тобой» сохраняет исходный образ, а «ни один человек» передаёт אִישׁ в обобщающем единственном числе.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: пока ты не истребишь их
  rationale: Оборот указывает на конечный предел действия, а שׁמד в контексте войны означает полное уничтожение.
theological_decisions:
- issue: Обобщающее значение אִישׁ
  choice: Ни один человек не устоит перед тобой
  alternative: Никто не устоит перед тобой
  rationale: Слово אִישׁ стоит в мужском роде и единственном числе, но имеет обобщающий смысл. Основной текст сохраняет форму «человек», а сноска указывает естественный смысловой вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены ключевые еврейские образы «в твою руку» и «из-под небес»; архаизмы по возможности исключены.
