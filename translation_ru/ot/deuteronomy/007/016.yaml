base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: ru
  text: Ты истребишь все народы, которых Яхве, твой Бог, отдаёт тебе[a]. Не щади их[b] и не служи их богам, потому что это — западня для тебя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поглоти» или «съешь». Здесь еврейский глагол образно означает полное уничтожение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть твой глаз не щадит их»; также возможно: «не жалей их».'
    reason: lexical_alternative
  - marker: c
    text: Местоимение «это» может относиться прежде всего к служению их богам, но также шире — к самим богам или к связанной с ними идолопоклоннической ситуации.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: истреби
  rationale: Глагол אָכַל буквально означает «есть, поглощать», но здесь употреблён как военная метафора полного уничтожения. «Истреби» естественно передаёт смысл в современном русском языке, а исходный образ отмечен в сноске.
- source_word: כָּל הָעַמִּים
  choice: все народы
  rationale: Множественное число עַמִּים обозначает отдельные народы; «народы» точнее, чем политически окрашенное «нации».
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: которых Яхве, твой Бог, отдаёт тебе
  rationale: Причастие נֹתֵן передаёт продолжающееся или близкое действие. В данном военном контексте «отдаёт тебе» по-русски естественнее буквального «даёт тебе» и не требует добавления отсутствующего в тексте объекта вроде «в руки».
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: не щади их
  rationale: 'Еврейская идиома буквально говорит: «пусть твой глаз не щадит их». Краткое «не щади их» ясно передаёт её смысл; буквальный образ сохранён в сноске.'
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: и не служи их богам
  rationale: עבד применительно к божествам означает религиозное служение и верность. «Служи» сохраняет более широкий заветный смысл, чем одно лишь «поклоняйся».
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: потому что это — западня для тебя
  rationale: מוֹקֵשׁ — ловушка или западня. Указательное «это» сохраняет неопределённость референта местоимения הוּא, не сводя его безоговорочно только к служению богам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией «Яхве», а не заменено титулом «Господь».
theological_decisions:
- issue: К чему относится הוּא во фразе כִּי מוֹקֵשׁ הוּא לָךְ
  choice: Сохранить неоднозначность с помощью формулировки «это — западня для тебя».
  alternative: 'Уточнить: «служение им станет для тебя западнёй»; либо отнести местоимение к богам или более широкой ситуации, связанной с народами и идолопоклонством.'
  rationale: Ближайший контекст указывает на служение чужим богам, однако грамматическое местоимение допускает более широкий референт. Основной текст не должен устранять эту реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткими повелительными формами, соответствующими наставительному тону отрывка. Военная резкость исходного текста не смягчена; буквальные еврейские образы и синтаксическая неоднозначность разъяснены в сносках.
