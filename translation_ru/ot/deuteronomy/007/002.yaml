  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: ru
  text: И когда Яхве, твой Бог, предаст их тебе и ты поразишь их, непременно предай их полному уничтожению[a]. Не заключай с ними союза и не оказывай им милости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непременно предай их заклятию». В еврейском тексте глагол חרם употреблён в усилительной конструкции и обозначает полное, безвозвратное предание уничтожению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не щади их»; также возможно: «не оказывай им благосклонности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: предаст их тебе
  rationale: В военном контексте נתן означает отдать или предать кого-либо во власть противника. Русское «предаст их тебе» естественно передаёт этот смысл и сохраняет Божье действие, не добавляя отсутствующего в еврейском тексте слова «рука».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
- source_word: לְפָנֶיךָ
  choice: тебе
  rationale: Буквально «перед тобой»; вместе с נתן это идиома передачи врагов во власть Израиля. В русском «предаст их тебе» ясно и естественно выражает смысл без ненужной буквальности.
- source_word: וְהִכִּיתָם
  choice: и ты поразишь их
  rationale: נכה в военном контексте обозначает нанесение поражения или разящий удар. «Поразишь» сохраняет силу выражения и соответствует достоинству библейского регистра.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: непременно предай их полному уничтожению
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол חרם. Формулировка сохраняет как идею полного посвящения определённой участи, так и конкретную участь уничтожения, не сводя выражение к обычной военной победе.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Не заключай с ними союза
  rationale: כרת ברית — устойчивое выражение «заключить завет/союз». В данном международно-военном контексте «союз» звучит естественно и не исключает формальной обязательности отношений.
- source_word: וְלֹא תְחָנֵּם
  choice: и не оказывай им милости
  rationale: חנן означает проявлять благосклонность, милость или благодать. «Оказывать милость» сохраняет широкий смысл; контекстуально возможное «не щади их» дано в примечании.
theological_decisions:
- issue: Передача חרם в контексте священной войны
  choice: непременно предай их полному уничтожению
  alternative: совершенно истреби их; предай их заклятию
  rationale: 'Выбранная формулировка сохраняет усиление конструкции и особый сакрально-судебный оттенок חרם: речь идёт не просто о разгроме, а о безвозвратном предании уничтожению. Примечание сохраняет традиционный термин «заклятие» как более буквальную, но менее прозрачную альтернативу.'
- issue: Передача תְחָנֵּם
  choice: не оказывай им милости
  alternative: не щади их; не оказывай им благосклонности
  rationale: Основной текст отражает значение милости или благосклонности, не сужая его до одного эмоционального оттенка; контекстуальная возможность «не щади» отмечена отдельно.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Формы единственного числа сохраняют обращение к Израилю как к единому народу. Причинно-временное начало וּ передано как «И когда», а синтаксис слегка уплотнён ради естественности русского текста.
