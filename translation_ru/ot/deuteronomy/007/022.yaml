  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: ru
  text: И Яхве, твой Бог, будет мало-помалу изгонять эти народы с твоего пути[a]. Ты не сможешь быстро истребить их, иначе дикие звери[b] размножатся и будут угрожать тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет мало-помалу вытеснять эти народы с твоего пути».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «зверь поля»; собирательно — дикие животные.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: будет… изгонять
  rationale: В данном земельно-военном контексте глагол означает устранение народов с занимаемой ими территории. «Изгонять» естественно передаёт это значение, не сужая его исключительно до юридического лишения владения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: הַגּוֹיִם הָאֵל
  choice: эти народы
  rationale: Сохраняются и обычное здесь значение גּוֹיִם, и указательная сила הָאֵל.
- source_word: מִפָּנֶיךָ
  choice: от тебя
  rationale: Естественное русское выражение для удаления народов с пути и из присутствия Израиля; буквальный пространственный оборот «от лица твоего» звучал бы архаично.
- source_word: מְעַט מְעָט
  choice: мало-помалу
  rationale: Устойчивое современное выражение передаёт постепенность и повтор исходного слова.
- source_word: לֹא תוּכַל
  choice: ты не сможешь
  rationale: Сохранено прямое модальное значение неспособности в будущем контексте, без превращения фразы в недвусмысленный запрет.
- source_word: כַּלֹּתָם
  choice: покончить с ними
  rationale: Глагол означает довести устранение народов до конца. Оборот передаёт завершённость и сохраняет естественность русского языка, не добавляя отсутствующего в форме отдельного наречия «полностью».
- source_word: מַהֵר
  choice: быстро
  rationale: Прямое и стилистически нейтральное соответствие наречию.
- source_word: פֶּן
  choice: иначе
  rationale: В данном предостерегающем контексте естественно передаёт нежелательное последствие; конструкция не превращена в утверждение о намерении Бога.
- source_word: תִּרְבֶּה
  choice: размножатся
  rationale: Передаёт увеличение численности животных и естественно сочетается с множественным собирательным обозначением по-русски.
- source_word: חַיַּת הַשָּׂדֶה
  choice: дикие звери
  rationale: Идиоматично передаёт животных открытой местности в противопоставлении домашним; буквальная образность отмечена в сноске.
- source_word: עָלֶיךָ
  choice: против тебя
  rationale: Сохраняет потенциально враждебную направленность угрозы, не ослабляя предлог до нейтрального «для тебя».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и соответствует наиболее принятой научной реконструкции произношения.
- issue: Смысл לֹא תוּכַל
  choice: 'утверждение о невозможности: «не сможешь»'
  alternative: 'запрет: «не должен» / «нельзя»'
  rationale: Форма буквально выражает неспособность, хотя контекст допускает оттенок ограничения. Перевод сохраняет эту напряжённость и не превращает её без достаточного основания в прямое повеление.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Мало-помалу» сохраняет повтор и ритм еврейского выражения без излишней архаики; «покончить с ними» ясно передаёт доведение устранения до конца, а «дикие звери» понятно обычному читателю.
