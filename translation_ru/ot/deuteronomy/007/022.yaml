    issue: 'Неестественная передача מִפָּנֶיךָ: «изгонять эти народы от тебя».'
    rationale: Оборот «от тебя» возможен, но с «изгонять народы» звучит не вполне определённо и хуже выражает идею удаления с пути/из присутствия адресата. «С твоего пути» сохраняет контекстуальный пространственный смысл и естественен в современном русском.
  - severity: medium
