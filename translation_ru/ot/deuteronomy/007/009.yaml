base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: ru
  text: Итак, знай[a], что Яхве, твой Бог, — Бог, Бог верный, хранящий завет и являющий неизменную любовь[b] тем, кто любит Его и соблюдает Его заповеди, до тысячи поколений[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «И знай» или «Поэтому знай»; еврейский союз может обозначать как простое продолжение, так и вывод из предыдущих слов.'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. חֶסֶד: также «верную любовь», «милость» или «верность завету».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на протяжении тысячи поколений». Это выражение подчёркивает чрезвычайно долгую верность Бога завету.'
    reason: lexical_alternative
  - marker: d
    text: 'Еврейский порядок слов допускает такую передачу: «...являющий неизменную любовь тем, кто любит Его и соблюдает Его заповеди, до тысячи поколений»; слова «до тысячи поколений» могут теснее связываться с предшествующей группой слов.'
    reason: previous_rendering
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Итак, знай
  rationale: Форма qal perfect 2 м. ед. ч. в данном контексте имеет побудительную силу; союз передан как вывод из предшествующего рассуждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: הוּא הָאֱלֹהִים
  choice: — Бог
  rationale: Местоимение и именная конструкция выражают усиленное утверждение; по-русски оно естественно передаётся именным сказуемым с тире.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: Бог верный
  rationale: Сохраняет приложение и смысл надёжности, постоянства и верности в контексте завета.
- source_word: שֹׁמֵר הַבְּרִית
  choice: хранящий завет
  rationale: Причастие описывает постоянное действие Бога; «хранить завет» соответствует библейскому регистру и остаётся понятным современному читателю.
- source_word: וְהַחֶסֶד
  choice: и неизменную любовь
  rationale: חֶסֶד объединяет любовь, милость и верность обязательствам; «неизменная любовь» кратко сохраняет устойчивый характер этого отношения.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: к тем, кто любит Его и соблюдает Его заповеди
  rationale: Предлог ל обозначает тех, по отношению к кому проявляется верность завету; параллельные причастные обороты объединены естественной русской конструкцией.
- source_word: לְאֶלֶף דּוֹר
  choice: до тысячи поколений
  rationale: Передаёт огромную продолжительность Божьей верности, сохраняя числовой образ оригинала.
theological_decisions:
- issue: Связь верности Бога завету с любовью и послушанием людей
  choice: Верность завету и неизменная любовь направлены к тем, кто любит Бога и соблюдает Его заповеди.
  alternative: Бог хранит завет и милость с любящими Его.
  rationale: Формулировка сохраняет данную в стихе связь Божьей верности с человеческой любовью и послушанием, не превращая её ни в отвлечённую безусловность, ни в позднейшую богословскую систему.
- issue: Объём выражения «до тысячи поколений»
  choice: Отнесено ко всему действию хранения завета и любви.
  alternative: Синтаксически теснее связать только с теми, кто любит Бога и соблюдает заповеди.
  rationale: Еврейский порядок допускает тесную связь с предшествующей группой, но общий смысл указывает на длительность Божьей верности; примечание сохраняет синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Повтор «Бог, Бог верный» намеренно сохраняет аппозиционное усиление еврейского текста; местоимение «Его» написано с прописной буквы согласно распространённой русской библейской практике.
