  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: ru
  text: Кроме того[b], Яхве, твой Бог, нашлёт на них шершней[a], пока не погибнут те, кто остался, и те, кто скрывается от тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также образное понимание: «ужас» или «паника»; некоторые считают, что речь идёт не буквально о шершнях, а о страхе, посланном Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И ещё».'
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: Кроме того
  rationale: Передаёт добавочное и усилительное значение выражения, связывая эту угрозу с предшествующими обещаниями победы; по-русски звучит естественно и без избыточного удвоения союза.
- source_word: הַצִּרְעָה
  choice: шершней
  rationale: Основное словарное значение — жалящие насекомые, шершни. Хотя в еврейском стоит единственное число с артиклем, оно допускает собирательное понимание; русское множественное число естественно передаёт нашествие. Возможное образное значение отмечено в сноске.
- source_word: יְשַׁלַּח
  choice: нашлёт
  rationale: Глагол подчёркивает, что Яхве целенаправленно посылает это бедствие; «нашлёт» идиоматично сочетается в русском с вредоносными существами и бедствиями.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, непосредственно представленное тетраграмматоном.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет прямое обращение во втором лице единственного числа и притяжательную конструкцию.
- source_word: בָּם
  choice: на них
  rationale: В сочетании с русским глаголом «наслать» естественно выражает направленность действия против врагов; буквальное пространственное «среди них» здесь было бы менее идиоматично.
- source_word: עַד אֲבֹד
  choice: пока не погибнут
  rationale: Передаёт предел действия и результат, не уточняя сверх текста способ гибели.
- source_word: הַנִּשְׁאָרִים
  choice: те, кто уцелел
  rationale: Обозначает оставшихся после прежних поражений; формулировка ясна в военном контексте и не вносит специального богословского смысла слова «остаток».
- source_word: וְהַנִּסְתָּרִים
  choice: и прячется
  rationale: Контекстуально передаёт людей, которые скрываются от Израиля. Единственное число сказуемого согласовано с русской конструкцией «те, кто».
- source_word: מִפָּנֶיךָ
  choice: от тебя
  rationale: Естественно передаёт еврейскую идиому «от твоего лица/присутствия» и смысл укрывания от наступающего Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблено личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Буквальное или образное понимание הַצִּרְעָה
  choice: Буквальное «шершней» в основном тексте
  alternative: Посланный Богом ужас или паника
  rationale: Прямое словарное значение указывает на насекомое. Возможное образное понимание действительно существует, но контекст не требует молча подменять им буквальное значение, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, умеренно торжественным библейским регистром. Фраза построена естественно для русского читателя; прямое обращение в единственном числе сохранено.
