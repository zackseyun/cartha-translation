  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: ru
  text: И если вы будете внимать этим постановлениям[a], соблюдать и исполнять их, то Яхве, ваш Бог, сохранит для вас завет и неизменную любовь[b], которые Он клятвенно обещал вашим отцам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этим установлениям»; также возможно: «этим судебным решениям».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское хесед означает стойкую, преданную любовь, особенно верность в отношениях завета; возможные переводы: «преданная любовь», «верность завету» или «милость».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вашим предкам»; буквально: «вашим отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: И если… то
  rationale: Оборот вводит обусловленное следствие. Русская конструкция «если… то» естественно передаёт связь между послушанием Израиля и последующим действием Бога, не превращая её в механическую причинность.
- source_word: תִּשְׁמְעוּן
  choice: будете внимать
  rationale: Глагол שׁמע означает не только слышать, но и откликаться послушанием. «Внимать» сохраняет слуховой оттенок и не дублирует следующие глаголы «соблюдать и исполнять».
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: этим постановлениям
  rationale: מִשְׁפָּטִים здесь обозначает обязательные правовые установления. «Постановления» понятно современному читателю и не смешивает этот термин с более общим словом «заповеди».
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: соблюдать и исполнять их
  rationale: 'Сохранены оба исходных глагола и свойственное заветной речи усиление: предписания надлежит беречь в соблюдении и осуществлять на деле.'
- source_word: וְשָׁמַר
  choice: сохранит
  rationale: «Сохранит» передаёт действие того же корня שׁמר, который ранее относится к соблюдению постановлений, и естественно сочетается в русском с заветом и любовью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: ваш Бог
  rationale: Сохранено выражение отношений завета; множественному адресату в русском соответствует «ваш».
- source_word: לְךָ
  choice: для вас
  rationale: Предлог указывает на тех, ради кого и в чью пользу Бог хранит завет и любовь.
- source_word: הַבְּרִית
  choice: завет
  rationale: Устойчивый и содержательно точный эквивалент центрального библейского термина בְּרִית.
- source_word: הַחֶסֶד
  choice: неизменную любовь
  rationale: חֶסֶד объединяет благоволение, преданность и постоянство в отношениях завета. «Неизменная любовь» сохраняет и личностный, и устойчивый характер понятия.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: о которых Он поклялся
  rationale: Передаётся именно клятва, а не просто обещание. Относительная конструкция связывает её с названными заветом и любовью, не уточняя сверх текста форму этой связи.
- source_word: לַאֲבֹתֶיךָ
  choice: вашим отцам
  rationale: Буквально сохранено мужское множественное обозначение праотцов Израиля.
theological_decisions:
- issue: Значение חֶסֶד в контексте завета
  choice: неизменную любовь
  alternative: верность завету; милость; преданную любовь
  rationale: Выбор не сводит חֶסֶד ни к юридической верности, ни к одному лишь чувству или милосердию, а удерживает вместе любовь, постоянство и заветную преданность.
- issue: Связь послушания Израиля с Божьим сохранением завета
  choice: условно-следственная конструкция «если… то»
  alternative: «за то, что»; «вследствие того, что»
  rationale: Конструкция отражает синтаксическое условие данного стиха, не утверждая, что Божий завет целиком возникает как награда за человеческую заслугу; сам текст одновременно отсылает к ранее данной отцам клятве.
- issue: Обозначение праотцов в לַאֲבֹתֶיךָ
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Исходный текст прямо говорит об отцах, то есть о патриархальных праотцах, поэтому родовое обозначение не нейтрализовано.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Внимать» придаёт достоинство и сохраняет смысл слышания с послушным откликом; остальная лексика общеупотребительна. Синтаксис условного периода делает длинную древнееврейскую фразу ясной без устранения её богословского напряжения.
