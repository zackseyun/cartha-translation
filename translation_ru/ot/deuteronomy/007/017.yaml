- source_word: כִּי
  choice: Если
  rationale: В данном контексте частица вводит предполагаемое условие, на которое далее следует ободряющий ответ.
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: скажешь в своём сердце
  rationale: Сохраняет образ внутренней речи, естественный и понятный в современном литературном русском.
- source_word: רַבִּים ... מִמֶּנִּי
  choice: многочисленнее меня
  rationale: Передаёт сравнительное значение конструкции без добавления отсутствующего в еврейском тексте множественного лица.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: эти народы
  rationale: Обычное для Второзакония обозначение отдельных народов земли.
- source_word: אֵיכָה אוּכַל
  choice: Как смогу я
  rationale: Передаёт вопрос о возможности и сохраняет оттенок будущей перспективы несовершенного вида.
- source_word: לְהוֹרִישָׁם
  choice: лишить их владения землёй
  rationale: Каузативная форма ירש в контексте завоевания означает заставить прежних жителей утратить владение; формулировка явно сохраняет земельный оттенок.
