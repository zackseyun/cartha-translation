  text: וַ/אֲהֵ֣בְ/ךָ֔ וּ/בֵרַכְ/ךָ֖ וְ/הִרְבֶּ֑/ךָ וּ/בֵרַ֣ךְ פְּרִֽי בִטְנְ/ךָ֣ וּ/פְרִֽי אַ֠דְמָתֶ/ךָ דְּגָ֨נְ/ךָ֜ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ שְׁגַר אֲלָפֶ֨י/ךָ֙ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֔/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: ru
  text: 'Он будет любить тебя, благословит тебя и умножит тебя. Он благословит плод твоего чрева и плод твоей земли: твоё зерно, молодое вино и оливковое масло, приплод твоего крупного и мелкого скота — на земле, которую Он поклялся твоим отцам[a] дать тебе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоим предкам». Буквально: «твоим отцам».'
    reason: Лексическая альтернатива для לַאֲבֹתֶיךָ.
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Он будет любить тебя
  rationale: В контексте форма продолжает ряд обещанных благословений и имеет будущее значение. «Любить» прямо передаёт заветную любовь, не заменяя её толкованием.
- source_word: וּבֵרַכְךָ
  choice: благословит тебя
  rationale: Обычный и естественный русский эквивалент ברך в контексте завета.
- source_word: וְהִרְבֶּךָ
  choice: умножит тебя
  rationale: Сохраняет прямое дополнение «тебя» и широкое значение роста численности, не сводя его только к потомству.
- source_word: פְּרִי בִטְנְךָ
  choice: плод твоего чрева
  rationale: Сохраняет конкретную древнееврейскую метафору потомства и её связь с повторяющимся словом פְּרִי.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: плод твоей земли
  rationale: Передаёт сельскохозяйственные плоды земли и сохраняет лексический повтор «плод».
- source_word: דְּגָנְךָ
  choice: твоё зерно
  rationale: Современное и ясное обозначение урожая зерновых культур.
- source_word: תִירֹשְׁךָ
  choice: молодое вино
  rationale: Передаёт תירוש как свежее, новое вино, отличая его от вина вообще.
- source_word: יִצְהָרֶךָ
  choice: масло
  rationale: В данном сельскохозяйственном перечне речь обычно идёт об оливковом масле; краткое «масло» соответствует исходному тексту без лишнего уточнения.
- source_word: שְׁגַר אֲלָפֶיךָ וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: приплод твоего крупного и мелкого скота
  rationale: Естественно по-русски передаёт потомство как стад крупного скота, так и стад овец и коз, не принимая редкое עשתרות за имя собственное.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: Указывает на обещанную территорию; русский предлог «на» здесь естественен.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: которую Он поклялся твоим отцам дать тебе
  rationale: Сохраняет формулу клятвы, мужское множественное «отцам» и обращение во втором лице единственного числа.
theological_decisions:
- issue: Передача לַאֲבֹתֶיךָ
  choice: твоим отцам
  alternative: твоим предкам
  rationale: Древнееврейское слово буквально означает «отцам» и здесь отсылает к отцам Израиля; более широкое «предкам» возможно, но менее формально точно.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены конкретные образы «плод чрева» и «плод земли»; редкие животноводческие выражения переданы естественным собирательным оборотом. Прописное «Он» употреблено как ясная отсылка к Богу в русском религиозно-литературном регистре.
