  source_fidelity: 'Основной смысл передан верно: сохранены единственное число «заповедь», триада правовых терминов, обращение во 2-м лице единственного числа и «сегодня». Однако וְשָׁמַרְתָּ допускает как выводное, так и простое соединительное значение, поэтому «итак» не следует закреплять без непосредственно привязанной сноски. Главное: לַעֲשׂוֹתָם синтаксически зависит от «повелеваю/заповедую», а не образует второе самостоятельное повеление; «и исполняй их» несколько меняет структуру оригинала.'
