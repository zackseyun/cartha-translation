base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: ru
  text: Итак[a] соблюдай заповедь, установления и постановления[b], которые Я повелеваю тебе сегодня исполнять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И соблюдай» или «Поэтому соблюдай»; еврейский союз может обозначать простое присоединение либо вывод из предшествующих стихов.'
    reason: lexical_alternative
  - marker: b
    text: «Постановления» можно также перевести как «судебные решения» или «правовые нормы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Итак, соблюдай
  rationale: Глагол שׁמר в контексте завета означает «соблюдать». Начальный союз передан как «итак», поскольку здесь он может выражать вывод из предшествующего; возможная сочинительная трактовка отмечена в сноске.
- source_word: הַמִּצְוָה
  choice: заповедь
  rationale: Сохранено единственное число еврейского существительного и его характерное для Второзакония заветно-правовое звучание.
- source_word: הַחֻקִּים
  choice: установления
  rationale: Слово передаёт предписанные нормы и сохраняет отличие этой категории от следующего правового термина.
- source_word: הַמִּשְׁפָּטִים
  choice: постановления
  rationale: מִשְׁפָּטִים может обозначать судебные решения, правовые нормы или постановления. «Постановления» естественно в современном русском и сохраняет юридический оттенок.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые Я заповедую тебе сегодня
  rationale: Настоящее время передаёт непосредственность причастной формы מְצַוֶּה; «сегодня» сохранено как значимый для речи Второзакония элемент.
- source_word: לַעֲשׂוֹתָם
  choice: и исполняй их
  rationale: Буквально конструкция означает «чтобы делать/исполнять их». В русском координация с повелительным «исполняй» ясно и естественно выражает требование практического исполнения, не смешивая его с предшествующим «соблюдай».
theological_decisions:
- issue: Различение трёх обозначений закона завета
  choice: заповедь, установления и постановления
  alternative: заповедь, уставы и суды
  rationale: Перечень сохранён как три пересекающиеся, но различные правовые категории. Они не сведены к общему слову, поэтому риторическая и заветно-правовая сила оригинала остаётся заметной.
- issue: Связь стиха с предшествующим контекстом
  choice: Итак
  alternative: И / Поэтому
  rationale: Начальное וְ допускает как простое соединение, так и вывод из сказанного прежде. В основном тексте отражена вероятная выводная связь, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной заветно-правовой лексикой. Синтаксис сделан естественным для русского языка; единственное число «заповедь» и различие трёх правовых терминов сохранены.
