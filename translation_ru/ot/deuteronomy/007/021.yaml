  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: ru
  text: Не страшись их, ибо Яхве, твой Бог, посреди тебя — великий и грозный Бог[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внушающий благоговейный трепет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: не трепещи перед ними
  rationale: Глагол ערץ передаёт сильный страх, ужас или трепет, а מִפְּנֵיהֶם буквально указывает на страх «перед ними». Такой перевод сохраняет интенсивность выражения и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохранены обращение к Израилю в единственном числе и заветное указание на принадлежность.
- source_word: בְּקִרְבֶּךָ
  choice: посреди тебя
  rationale: Выражение обозначает присутствие Бога внутри общины Израиля. Единственное число сохранено, поскольку к народу обращаются как к единому целому; перевод не создаёт впечатления индивидуального внутреннего переживания.
- source_word: אֵל גָּדוֹל
  choice: Бог великий
  rationale: אֵל здесь служит обозначением Бога в приложении к имени Яхве, а גָּדוֹל прямо означает «великий».
- source_word: וְנוֹרָא
  choice: и грозный
  rationale: Форма от ירא описывает Того, кто внушает страх и благоговейный трепет. «Грозный» сохраняет эту силу, не сводя смысл исключительно к ужасу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное заветное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер страха, выраженный словом נוֹרָא
  choice: грозный
  alternative: внушающий благоговейный трепет
  rationale: Текст говорит о Боге как вызывающем страх и трепет. Основной перевод сохраняет лаконичность и силу, а примечание отмечает оттенок благоговения, не устраняя напряжение между страхом и почитанием.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным строем. Единственное число в «тебя» сохраняет коллективное обращение к Израилю; тире ясно оформляет приложение «Бог великий и грозный».
