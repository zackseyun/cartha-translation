  source_fidelity: 'Перевод точно передаёт последовательность объектов в еврейском тексте: великие испытания, знамения, чудеса, могучую руку и простёртую мышцу. «Которые видели твои глаза» сохраняет эксплицитный образ רָאוּ עֵינֶיךָ. «Которыми ... вывел тебя» обоснованно связывает придаточное с образами руки и мышцы; относительное אֲשֶׁר не маркирует числа и не требует иной русской формы. «Так ... поступит со всеми народами, которых ты боишься» верно передаёт כֵּן יַעֲשֶׂה ... לְכָל הָעַמִּים אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם.'
  naturalness: Текст читается естественно в современном литературном русском при сохранении уместного библейского достоинства. «Простёртая мышца» несколько возвышенно-библейское, но это устойчивая, понятная формула и точнее сохраняет различие между «рукой» и זְרוֹעַ, чем стилистически менее удачное повторение слова «рука».
  terminology: '«Яхве» последовательно передаёт тетраграмматон. Пара «знамения и чудеса» удачна; «великие испытания» соответствует מַסּוֹת без навязывания значения искушения. Сноска a поставлена непосредственно после соответствующего выражения и корректно сообщает допустимую лексическую альтернативу. Дополнительная сноска к «могучей руке» не требуется: английская сноска b фактически относится к варианту перевода «народы/племена», а не к этому образу, и в русском наборе такая сноска отсутствует.'
