  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: ru
  text: великие испытания, которые видели твои глаза[a], знамения и чудеса, могучую руку и простёртую мышцу, которыми Яхве, твой Бог, вывел тебя. Так Яхве, твой Бог, поступит со всеми народами, которых ты боишься.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великие проверки». Еврейское слово может обозначать тяжёлые испытания или проверяющие деяния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: великие испытания
  rationale: מַסּוֹת обозначает испытания или тяжёлые проверяющие события; в контексте речь о грозных деяниях в Египте, а не об искушении ко греху.
- source_word: רָאוּ עֵינֶיךָ
  choice: которые видели твои глаза
  rationale: Сохранён явный образ еврейского текста, подчёркивающий личное свидетельство адресата.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: знамения и чудеса
  rationale: Традиционная и ясная русская передача устойчивой пары, сохраняющая различие между указующим знаком и вызывающим изумление деянием.
- source_word: הַיָּד הַחֲזָקָה
  choice: могучую руку
  rationale: Естественно передаёт образ Божьей непреодолимой силы; «могучая» в данном контексте звучит литературнее буквального «сильная».
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: простёртую мышцу
  rationale: «Мышца» сохраняет различение между יָד («рука/кисть») и זְרוֹעַ («мышца/плечо») и соответствует достоинству библейского регистра; «простёртая» передаёт готовность к действенному вмешательству.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: которыми ... вывел тебя
  rationale: Множественное «которыми» естественно связывает избавление с двумя непосредственно предшествующими образами — рукой и мышцей; каузативная форма יצא передана как «вывел».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул.
- source_word: כֵּן יַעֲשֶׂה
  choice: Так ... поступит
  rationale: Кратко и естественно выражает сопоставление будущих действий Бога с уже совершённым избавлением.
- source_word: לְכָל הָעַמִּים
  choice: со всеми народами
  rationale: В сочетании с «поступит» предлог לְ обозначает тех, на кого будет направлено действие; עַמִּים буквально означает «народы».
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: которых ты боишься
  rationale: Естественная современная русская передача еврейской идиомы «бояться перед лицом/из-за присутствия кого-либо».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; «Яхве» передаёт наиболее общепринятую научную реконструкцию произношения, не подменяя имя титулом.
- issue: Отнесение אֲשֶׁר הוֹצִאֲךָ к образам силы
  choice: «которыми» относится к могучей руке и простёртой мышце
  alternative: Отнести придаточное шире ко всему перечню испытаний, знамений, чудес, руки и мышцы
  rationale: Ближайшие грамматические предшественники — «рука» и «мышца», однако более широкая смысловая связь со всем перечнем остаётся возможной; перевод не добавляет догматического уточнения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис слегка упрощён для ясности, но сохранены перечисление, образ «видели твои глаза» и парные метафоры Божьей силы. Архаизирующая «мышца» оставлена как точный и узнаваемый библейский термин; прочая лексика современна.
