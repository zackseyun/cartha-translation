  to: Изваяния их богов сожгите в огне. Не пожелай серебра и золота, что на них, и не бери их себе, чтобы они не стали для тебя западнёй[a], ведь это мерзость для Яхве, твоего Бога.[b]
  rationale: Минимально уточнена передача образа ловушки и устранена русская местоименная неоднозначность. Множественное «они» в главном тексте относится к «серебру и золоту»; сноска сохраняет близкую к еврейскому оригиналу возможность передать их как средство, которым человек оказывается уловлен. Заключительное «это» и его сноска сохранены, поскольку оригинал не требует уточнять, что именно названо мерзостью.
