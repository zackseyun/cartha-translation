  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: ru
  text: Изваяния их богов сожгите в огне. Не пожелай серебра и золота, что на них, и не бери их себе, чтобы они не стали для тебя западнёй[a], ведь это мерзость для Яхве, твоего Бога.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не оказаться пойманным ими в западню». Древнееврейский глагол передаёт образ попадания в силок или ловушку.'
    reason: lexical_alternative
  - marker: b
    text: Слово «это» может относиться к серебру и золоту с изваяний, к самому идольскому предмету или шире — ко всему связанному с ним поступку.
    reason: referential_ambiguity
lexical_decisions:
- source_word: פְּסִילֵי
  choice: изваяния
  rationale: Слово обозначает изготовленные высеченные или резные изображения; «изваяния» сохраняет конкретный смысл и звучит естественно и достойно.
- source_word: אֱלֹהֵיהֶם
  choice: их богов
  rationale: Прямая передача формы множественного числа с местоименным суффиксом.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: сожгите в огне
  rationale: Императив естественно передаёт силу древнееврейской формы предписания, а оборот «в огне» сохраняет указание на средство уничтожения.
- source_word: לֹא תַחְמֹד
  choice: не пожелай
  rationale: Передаёт запрещённое вожделение к привлекательной чужой ценности и сохраняет узнаваемый библейский этический язык без архаизма.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: серебра и золота, что на них
  rationale: Союз ו передан обычным «и»; выражение относится к драгоценному металлу, находящемуся на изображениях, вероятно как покрытие или украшение.
- source_word: וְלָקַחְתָּ לָךְ
  choice: и не бери его себе
  rationale: В контексте запрета согласованное отрицание естественно распространяется на последующее действие; единственное число «его» представляет серебро и золото как совокупный драгоценный материал.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: чтобы не попасть из-за него в западню
  rationale: Сохраняется образ силка или ловушки, заключённый в страдательной форме глагола; «из-за него» допускает связь с запретным металлом и всем идольским предметом.
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Сильное и устойчивое русское слово для того, что отвратительно и неприемлемо перед Богом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Референт местоимения בּוֹ в предостережении
  choice: «из-за него» — без узкого уточнения референта
  alternative: Отнести местоимение исключительно к серебру и золоту либо исключительно к изваянию
  rationale: Ближайший референт — взятый драгоценный металл, однако в поле смысла остаётся весь связанный с идолопоклонством предмет; перевод не устраняет эту многозначность.
- issue: Референт заключительного הוּא
  choice: «это»
  alternative: Явно назвать мерзостью изваяние, металл или действие присвоения
  rationale: 'Указательное «это» сохраняет грамматическую и смысловую широту оригинала: речь может охватывать запретный предмет, идольский комплекс и связанное с ним присвоение.'
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным библейским звучанием. Единственное число обращения сохранено. Формы «сожгите» и «не пожелай» отражают смену числа в древнееврейском тексте: сначала обращение ко всему народу во множественном числе, затем к Израилю как к единому адресату во втором лице единственного числа.'
