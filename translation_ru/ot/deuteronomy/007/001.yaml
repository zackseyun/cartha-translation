source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: ru
  text: Когда Яхве, твой Бог, приведёт тебя в землю, в которую ты входишь, чтобы овладеть ею, и изгонит[a] перед тобой многие народы — хеттов, гиргашитов, амореев, хананеев, периззеев, хиввеев и иевусеев, — семь народов, которые многочисленнее и сильнее тебя[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишит владений многие народы перед тобой».'
    reason: Глагол נשל может акцентировать лишение народов их земли, наряду со значением изгнания.
  - marker: b
    text: 'Или: «более великих и могущественных, чем ты».'
    reason: Прилагательные רַב и עָצוּם могут передавать соответственно величие и могущество; в отношении народов вероятно значение численного превосходства и силы.
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном контексте союз вводит обстоятельство времени для последующих повелений; русское «когда» естественно передаёт ход речи.
- source_word: יְבִיאֲךָ
  choice: приведёт тебя в
  rationale: Каузативная форма глагола בוא обозначает введение адресата в названную землю; «приведёт ... в» точно и естественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте Второзакония обозначает землю, которой Израиль должен овладеть; «земля» сохраняет обычное библейское и территориальное значение.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: в которую ты входишь
  rationale: Причастная конструкция описывает предстоящее вступление Израиля; указательное שָׁמָּה естественно включено в русское направление «в которую».
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: ירשׁ здесь означает вступить во владение землёй; формулировка передаёт целевое значение לְ и активный характер действия.
- source_word: וְנָשַׁל
  choice: и изгонит
  rationale: Глагол означает устранить народы из занимаемой ими земли, фактически лишив их владений; «изгонит» ясно передаёт действие в данном контексте.
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: Речь идёт о нескольких этнических общностях Ханаана; «народы» точнее и естественнее, чем «государства».
- source_word: מִפָּנֶיךָ
  choice: перед тобой
  rationale: Сохранён еврейский пространственный оборот, означающий удаление народов с пути и из присутствия Израиля.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: хеттов, гиргашеев, амореев, хананеев, ферезеев, евеев и иевусеев
  rationale: Еврейские собирательные названия народов переданы принятыми русскими формами во множественном числе.
- source_word: שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: семь народов, которые многочисленнее и сильнее тебя
  rationale: Сравнительная конструкция с מִן передана явно; רַבִּים в сочетании с народами естественно понимать как численное превосходство, а עֲצוּמִים — как превосходство в силе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вводит дополнительного толкования.
- issue: Характер изгнания хананейских народов
  choice: изгонит
  alternative: лишит владений
  rationale: Основной текст передаёт физическое удаление народов, не смягчая действие; сноска сохраняет юридико-территориальный оттенок возможного перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранено обращение к Израилю во втором лице единственного числа и незавершённый синтаксис стиха, продолжающийся в следующем стихе. Имена народов даны в формах, привычных русской библейской традиции.
