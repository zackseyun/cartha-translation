base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: ru
  text: Но потому что Яхве любит вас и хранит клятву, которую дал вашим отцам, Яхве вывел вас могучей рукой и выкупил вас из дома рабов[a], из руки фараона, царя Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «из дома рабства». Буквально по-еврейски: «из дома рабов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: но потому, что
  rationale: В контексте стих противопоставляет истинную причину избрания отвергнутой причине из ст. 7; перевод передаёт и причинное, и противительное значение.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: потому, что Яхве любит вас
  rationale: Причинная конструкция естественно передаётся личной глагольной формой; имя יהוה транслитерировано как «Яхве».
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: и хранит клятву
  rationale: «Хранит» выражает верное соблюдение клятвы и сохраняет параллельную причинную конструкцию без тяжеловесности.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: которую дал вашим отцам
  rationale: По-русски клятву обычно «дают»; «отцам» сохраняет конкретную связь с патриархами.
- source_word: בְּיָד חֲזָקָה
  choice: могучей рукой
  rationale: Сохраняет образ руки и естественно передаёт идиому мощного избавительного действия Бога.
- source_word: וַיִּפְדְּךָ
  choice: выкупил вас
  rationale: Передаёт значение פדה — освобождение посредством выкупа — конкретнее, чем общее «спас».
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабов
  rationale: Сохраняет буквальный и выразительный еврейский образ; более привычный русский вариант отмечен в сноске.
- source_word: מִיַּד פַּרְעֹה
  choice: из руки фараона
  rationale: 'Сохранён повторяющийся образ руки: могучая рука Яхве освобождает из руки, то есть власти, фараона.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Значение אֲבֹתֵיכֶם
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Мужская форма и контекст завета указывают прежде всего на патриархов; более общее «предкам» ослабляет эту конкретность.
- issue: Образ рабства в מִבֵּית עֲבָדִים
  choice: из дома рабов
  alternative: из дома рабства
  rationale: Основной текст сохраняет конкретное «рабы», не смягчая реальность египетской неволи; идиоматическая альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены ключевые еврейские образы «руки» и «дома рабов»; синтаксис сделан естественным для широкого круга читателей.
