  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: ru
  text: 'Не потому, что вы превосходили численностью все другие народы, Яхве привязался к вам и избрал вас[a]: из всех народов вас было меньше всего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильно полюбил вас». Еврейский глагол выражает сильную привязанность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: вы превосходили численностью все другие народы
  rationale: Сочетание מִן с идеей многочисленности выражает сравнение. Эта формулировка естественно передаёт численное превосходство, которое отрицается в данном контексте.
- source_word: חָשַׁק
  choice: привязался к вам
  rationale: Глагол обозначает сильную личную привязанность или влечение. «Привязался» сохраняет этот оттенок и не смешивает חָשַׁק с глаголом אָהַב («любить»), употреблённым в следующем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וַיִּבְחַר
  choice: и избрал вас
  rationale: «Избрал» точно передаёт обычное значение בחר в контексте избрания Израиля, не добавляя последующих богословских построений.
- source_word: כִּי
  choice: ':'
  rationale: В данном контексте כִּי вводит пояснение к предыдущему отрицанию. Двоеточие естественно выражает эту пояснительную связь по-русски.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: из всех народов вас было меньше всего
  rationale: Идиоматическая русская формулировка сохраняет превосходную степень и численный контраст с первой частью стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Богословское осмысление избрания Израиля
  choice: избрал вас
  alternative: выбрал вас
  rationale: 'Сохранён прямой смысл текста: выбор Израиля не объясняется его численным превосходством. Перевод не уточняет цели или систематико-богословские следствия этого избрания.'
- issue: Соотношение חָשַׁק и языка любви
  choice: привязался к вам
  alternative: полюбил вас
  rationale: Так сохраняется сильная личная направленность глагола и его лексическое отличие от אָהַב в следующем стихе, при этом альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Оборот «превосходили численностью» ясно передаёт сравнительный смысл, а заключение «вас было меньше всего» звучит естественно и сохраняет численный контраст.
