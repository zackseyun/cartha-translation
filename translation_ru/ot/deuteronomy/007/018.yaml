  source_fidelity: Текст точно передаёт запрет לֹא תִירָא מֵהֶם («не бойся их»), усиленное זָכוֹר תִּזְכֹּר («непременно помни») и завершённые действия Яхве по отношению к фараону и всему Египту. «Со всем Египтом» сохраняет собирательное обозначение страны/народа, не сужая его до одних египтян.
  naturalness: Фраза звучит естественно на современном литературном русском, с уместно сдержанным библейским регистром. «Сделал с фараоном и со всем Египтом» в данном контексте является понятным русским способом обозначить действия, совершённые над ними.
  terminology: «Яхве, твой Бог» корректно передаёт יהוה אֱלֹהֶיךָ и сохраняет личное имя Бога. Усиление «непременно помни» не привносит толкования и адекватно передаёт инфинитив абсолютный с имперфектом. Сноска привязана к усилительной конструкции и уместно объясняет её.
