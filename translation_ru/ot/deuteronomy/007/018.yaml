source:
  edition: WLC
  text: לֹ֥א תִירָ֖א מֵ/הֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר עָשָׂה֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/פַרְעֹ֖ה וּ/לְ/כָל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: ru
  text: Не бойся их; непременно помни[a], что Яхве, твой Бог, сделал с фараоном и со всем Египтом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «помнить — помни»; эта еврейская конструкция усиливает повеление: «непременно помни» или «хорошо помни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: Не бойся их
  rationale: Сочетание לֹא с имперфектом в увещевательном контексте выражает запрет, а מִן после ירא обозначает объект страха. Русская форма «не бойся их» естественно передаёт обращение к Израилю в единственном числе.
- source_word: זָכֹר תִּזְכֹּר
  choice: непременно помни
  rationale: Инфинитив абсолютный перед личной формой того же глагола усиливает повеление. «Непременно помни» сохраняет эмфатическую силу конструкции и звучит естественно по-русски.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: что ... сделал
  rationale: Относительная конструкция обозначает завершённое историческое действие; русское «что ... сделал» ясно и непосредственно передаёт смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является современной русской транслитерацией тетраграмматона.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Суффикс второго лица мужского рода единственного числа соответствует обращению к Израилю как к единому народу.
- source_word: לְפַרְעֹה
  choice: с фараоном
  rationale: Предлог לְ при עשה указывает на того, кого затронуло действие. По-русски сочетание «сделал с фараоном» идиоматично и сохраняет неопределённость относительно конкретных действий, известных из контекста Исхода.
- source_word: וּלְכָל מִצְרָיִם
  choice: и со всем Египтом
  rationale: Еврейский текст называет Египет как страну и совокупное целое, не заменяя это выражение явным обозначением египтян.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не привносит конфессиональной замены.
- issue: Характер повеления помнить
  choice: непременно помни
  alternative: помни; хорошо помни
  rationale: Усилительная еврейская конструкция подчёркивает настоятельность памяти о Божьих действиях, не уточняя сверх текста ни её психологический характер, ни ритуальную форму.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Сохранено обращение в единственном числе к Израилю; точка с запятой передаёт тесную связь запрета бояться с призывом помнить исход.
