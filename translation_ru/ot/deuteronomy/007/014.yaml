base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: ru
  text: Ты будешь благословеннее всех народов[a]. Среди тебя не будет ни бесплодного мужчины, ни бесплодной женщины[b], ни бесплодного животного среди твоего скота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превыше всех народов». Еврейский предлог здесь выражает сравнение.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте употреблены обе формы — мужская и женская: «бесплодный и бесплодная».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: ты будешь благословен
  rationale: Пассивное причастие от ברך вместе с формой היה выражает будущее состояние благословения; личное местоимение добавлено для ясного воспроизведения обращения во 2-м лице единственного числа.
- source_word: מִכָּל הָעַמִּים
  choice: больше, чем все народы
  rationale: Предлог מִן здесь имеет сравнительное значение. Такая формулировка естественно передаёт сравнение, не превращая его в указание на происхождение «из народов».
- source_word: לֹא יִהְיֶה בְךָ
  choice: среди тебя не будет
  rationale: Экзистенциальная конструкция с בְּ указывает на отсутствие внутри народа; единственное число сохраняет образ Израиля как единого народа завета.
- source_word: עָקָר וַעֲקָרָה
  choice: ни бесплодного мужчины, ни бесплодной женщины
  rationale: В еврейском тексте намеренно употреблены мужская и женская формы. Русский перевод явно сохраняет оба рода и передаёт неспособность иметь потомство без излишне медицинской терминологии.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: и среди твоего скота — тоже
  rationale: בְּהֵמָה обозначает домашних животных собирательно. Слово «скот» широко и естественно в данном сельскохозяйственном контексте, а «тоже» ясно распространяет отрицание и признак бесплодия на животных.
theological_decisions:
- issue: Мужская и женская формы обозначения бесплодия в благословении завета
  choice: Явно назвать бесплодного мужчину и бесплодную женщину
  alternative: Обобщить как «никого бесплодного»
  rationale: Различение полов присутствует в исходном тексте и потому сохраняется без сведения к нейтральному общему обозначению.
- issue: Единственное число в обращении к Израилю
  choice: Сохранить «ты/тебя/твоего»
  alternative: Передать множественным числом «вы/среди вас/вашего»
  rationale: Еврейский текст обращается к Израилю как к единому народу завета; перевод сохраняет эту грамматическую и богословскую особенность.
- issue: Сфера обещания об отсутствии бесплодия
  choice: Распространить отрицание как на людей, так и на скот
  alternative: Понять последнюю фразу лишь как отдельное упоминание скота без явно восстановленного сказуемого
  rationale: Эллиптическая последняя фраза координирована с предшествующим отрицанием и естественно означает отсутствие бесплодия также среди домашних животных.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сравнительная конструкция передана ясно и естественно; корпоративное единственное число сохранено. Тире в заключительной фразе отмечает эллипсис и позволяет избежать тяжеловесного повтора слова «бесплодного».
