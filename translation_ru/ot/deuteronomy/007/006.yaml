  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: ru
  text: Ибо ты — святой народ, принадлежащий Яхве, твоему Богу. Яхве, твой Бог, избрал тебя, чтобы ты был Его народом, драгоценным достоянием[a], из всех народов, живущих на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его драгоценным народом». Буквально в еврейском тексте: «народом драгоценного достояния»; выражение соединяет понятия народа и особо ценимого достояния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего повеления; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: עַם קָדוֹשׁ
  choice: святой народ
  rationale: Сочетание обозначает народ, отделённый для Бога; традиционная формулировка ясна современному читателю и сохраняет богословскую весомость.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: у Яхве, твоего Бога
  rationale: Предлог ל выражает отношение и принадлежность. Оборот «народ у Яхве» сохраняет конструкцию исходного текста, хотя по-русски звучит несколько торжественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, прямо стоящее в еврейском тексте.
- source_word: בְּךָ בָּחַר
  choice: избрал тебя
  rationale: Глагол בחר выражает выбор; «избрал» сохраняет его заветный оттенок и естественно звучит в данном контексте.
- source_word: לִהְיוֹת לוֹ
  choice: чтобы ты был Его
  rationale: Инфинитивная конструкция выражает цель, а местоименная форма לו — отношение принадлежности.
- source_word: לְעַם סְגֻלָּה
  choice: драгоценным народом
  rationale: Сохраняет явно названный עַם «народ» и передаёт значение סְגֻלָּה как особо ценимого достояния; буквальная особенность пояснена в сноске.
- source_word: מִכֹּל הָעַמִּים
  choice: из всех народов
  rationale: מן с כל обозначает выбор из общей совокупности и не требует сравнительного смысла «выше всех народов».
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: живущих на земле
  rationale: Естественно передаёт распространённую еврейскую формулу о народах, находящихся на поверхности земли, без тяжеловесного буквального оборота.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл избрания в מִכֹּל הָעַמִּים
  choice: из всех народов
  alternative: превыше всех народов
  rationale: Еврейская конструкция прежде всего указывает на выбор из числа народов; перевод не добавляет идеи внутреннего превосходства, прямо не выраженной предлогом.
- issue: Отношение святости народа к Яхве
  choice: святой народ у Яхве, твоего Бога
  alternative: святой народ Яхве, твоего Бога; святой народ для Яхве, твоего Бога
  rationale: Выбранная формулировка удерживает неоднозначность ל между отношением, предназначением и принадлежностью, не сводя её только к одному оттенку.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Местоимение «Его» написано с прописной буквы по принятой русской религиозной традиции; синтаксис сохраняет обращение к Израилю в единственном числе.
