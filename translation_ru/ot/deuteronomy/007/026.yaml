  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: ru
  text: Не вноси мерзость в свой дом, иначе и сам станешь, подобно ей, обречённым на уничтожение[a]. Безусловно гнушайся ею и глубоко ненавидь её, потому что она обречена на уничтожение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преданным заклятию»; традиционно: «проклятым». Еврейское слово обозначает то, что по Божьему суду отдано уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: вноси
  rationale: Каузативная форма בוא означает «внести, принести внутрь»; «вноси» естественно сочетается с указанием «в свой дом».
- source_word: תּוֹעֵבָה
  choice: мерзость
  rationale: Слово обозначает нечто глубоко отвратительное в религиозно-нравственном смысле, здесь — идольский предмет; «мерзость» сохраняет сильную богословскую окраску.
- source_word: בֵּיתֶךָ
  choice: свой дом
  rationale: Сохранён конкретный образ дома как места, куда запрещено вносить обречённый идольский предмет.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: иначе и сам станешь, подобно ей, обречённым на уничтожение
  rationale: Союз передаёт следствие нарушения запрета. Формулировка сохраняет значение חֵרֶם как посвящённости уничтожению по Божьему суду и явно относит предупреждение к адресату.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: гнушайся ею всем сердцем
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает повеление; «всем сердцем» идиоматически передаёт полноту отвращения, не ослабляя образ.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: и всячески отвергай её
  rationale: Второе усиленное повеление передано отдельным выражением, чтобы сохранить параллелизм двух близких, но не полностью тождественных глаголов.
- source_word: כִּי חֵרֶם הוּא
  choice: потому что она обречена на уничтожение
  rationale: Причинная связь выражена прямо, а повтор ключевого понятия חֵרֶם сохранён для смысловой цельности стиха.
theological_decisions:
- issue: Значение חֵרֶם в контексте суда за идолопоклонство
  choice: обречённый на уничтожение
  alternative: преданный заклятию; проклятый
  rationale: חֵרֶם здесь обозначает предмет, отданный уничтожению по Божьему суду, а не просто нечто проклятое или табуированное. Выбранная формулировка понятна современному читателю и сохраняет судебно-заветный смысл.
translation_notes:
