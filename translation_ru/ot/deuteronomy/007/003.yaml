  terminology: «Брачные союзы» удачно передаёт взаимно-социальный оттенок хитпаэля תִתְחַתֵּן, не сводя его к единичному браку. «В жёны» — необходимое в русском контекстуальное уточнение глагола «брать», не меняющее смысла. Сноска предлагает допустимую более формальную альтернативу и не навязывает толкования.
