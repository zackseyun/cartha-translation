  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: ru
  text: 'Не вступай с ними в брачные союзы[a]: свою дочь не отдавай за его сына, а его дочь не бери в жёны своему сыну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «не роднись с ними через брак».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: вступай в брачные союзы
  rationale: Возвратная порода хитпаэль выражает вступление во взаимные брачные связи. Эта формулировка естественна по-русски и передаёт социально-взаимный смысл, не сводя запрет к одному отдельному браку.
- source_word: בָּם
  choice: с ними
  rationale: Предлог с местоименным суффиксом относится к народам, названным ранее; «с ними» естественно сочетается с выражением «вступать в брачные союзы».
- source_word: בִּתְּךָ
  choice: свою дочь
  rationale: Передаёт существительное в единственном числе с суффиксом второго лица; возвратное «свою» нормативно и естественно при обращении на «ты».
- source_word: תִתֵּן
  choice: не отдавай
  rationale: Глагол буквально означает «давать»; в русском брачном контексте «отдавать дочь за кого-либо» точно и без лишнего пояснения передаёт подразумеваемое замужество.
- source_word: לִבְנוֹ
  choice: за его сына
  rationale: Русская конструкция «отдать дочь за сына» естественно выражает обозначенное предлогом ל отношение и брачный смысл.
- source_word: וּבִתּוֹ
  choice: его дочь
  rationale: Сохранены единственное число и суффикс третьего лица мужского рода, имеющий распределительное значение по отношению к представителям ранее названных народов.
- source_word: תִקַּח
  choice: не бери в жёны
  rationale: Буквально глагол означает «брать», но по-русски добавление «в жёны» необходимо для ясного и естественного выражения брачного смысла данного контекста.
- source_word: לִבְנֶךָ
  choice: своему сыну
  rationale: Передаёт существительное в единственном числе с суффиксом второго лица и отношение, выраженное предлогом ל; дательный падеж естественен после «брать в жёны».
theological_decisions:
- issue: Объём запрета
  choice: Запрет брачных связей с народами, названными в предшествующем контексте, без добавления мотива из следующего стиха.
  alternative: Всеобщий запрет любых браков с иноплеменниками либо этнический запрет, оторванный от контекста завета.
  rationale: Местоимение «с ними» имеет непосредственный контекстуальный референт. Перевод не расширяет и не сужает запрет богословским толкованием, отсутствующим в самом стихе.
- issue: Родовые обозначения членов семьи
  choice: Сохранить формы «дочь» и «сын» в единственном числе.
  alternative: Заменить их обобщающим гендерно-нейтральным словом «дети».
  rationale: Еврейский текст использует конкретные родовые термины в единственном числе как представительную юридическую формулу; их нейтрализация устранила бы значимую форму исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством правовой речи. Обращение передано формой единственного числа, как в еврейском тексте. Выражение «брачные союзы» сохраняет взаимный и общественный оттенок запрета, а параллельные предписания изложены естественными русскими брачными конструкциями.
