base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: ru
  text: и воздаёт ненавидящим Его прямо в лицо[a], чтобы погубить их. Он не медлит с тем, кто ненавидит Его, — прямо в лицо воздаст ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к его лицу»; выражение можно также понять как «пред ним» или «в его присутствии». Единственное число может относиться к каждому из ненавидящих по отдельности.'
    reason: лексическая и грамматическая неоднозначность
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: и воздаёт
  rationale: Пиэль глагола שׁלם здесь означает ответное воздаяние. «Воздаёт» сохраняет судебный оттенок и естественно звучит в возвышенной современной русской речи.
- source_word: לְשֹׂנְאָיו
  choice: ненавидящим Его
  rationale: Причастная форма обозначает людей, которые ненавидят Бога. Такой перевод точнее, чем более широкое «врагам».
- source_word: אֶל־פָּנָיו
  choice: прямо в лицо
  rationale: Буквально выражение связано с лицом и в данном контексте подчёркивает непосредственное, личное воздаяние. В первой части единственное число еврейского местоименного суффикса понято распределительно по отношению к каждому из ненавидящих.
- source_word: לְהַאֲבִידוֹ
  choice: чтобы погубить их
  rationale: Инфинитив породы хифиль выражает цель или результат воздаяния. Русское множественное число согласовано с «ненавидящим», тогда как еврейское единственное число можно понимать распределительно.
- source_word: לֹא יְאַחֵר
  choice: Он не медлит
  rationale: Пиэль глагола אחר означает задерживать или откладывать. Настоящее время передаёт общий характер утверждения.
- source_word: לְשֹׂנְאוֹ
  choice: с тем, кто ненавидит Его
  rationale: Оборот с ל обозначает лицо, в отношении которого Бог не откладывает воздаяние. Формулировка естественна по-русски и сохраняет значение ненависти.
- source_word: יְשַׁלֶּם לוֹ
  choice: воздаст ему
  rationale: Будущее время сохраняет форму еврейского глагола и повторяет корень שׁלם, усиливая мысль первой части стиха.
theological_decisions:
- issue: Язык Божьего суда
  choice: Бог лично воздаёт ненавидящим Его и губит их
  alternative: Безличные последствия их поступков
  rationale: В еврейском тексте Бог является непосредственным субъектом воздаяния и уничтожения; перевод не смягчает это до безличного закона последствий.
- issue: Значение אֶל־פָּנָיו
  choice: непосредственное воздаяние каждому ненавидящему — «прямо в лицо»
  alternative: «пред ним» или «в его присутствии»
  rationale: Идиома допускает пространственное прочтение, поэтому альтернативы сохранены в сноске, а основной текст передаёт наиболее вероятный в контексте оттенок прямого личного воздаяния.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы для ясности референции; синтаксис сохраняет повтор «воздаёт / воздаст» и напряжённость исходного высказывания.
