  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: повтор глагола שׁלם («воздаёт / воздаст»), ненавистников Бога, целенаправленное погубление, отсутствие промедления и переход от множественного числа к единственному во второй половине стиха. «Прямо в лицо» уместно передаёт непосредственный характер אֶל־פָּנָיו, не исключая отмеченного в сноске пространственного смысла.'
