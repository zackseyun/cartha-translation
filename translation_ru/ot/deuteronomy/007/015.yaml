source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: ru
  text: И Яхве отведёт от тебя всякую болезнь и не наведёт на тебя ни одной из тяжких болезней Египта[a], которые ты знал[b], но наведёт их на всех ненавидящих тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское прилагательное может также означать «вредоносных», «губительных» или «бедственных».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые ты испытал на себе». Еврейский глагол «знать» здесь может подразумевать знание из личного опыта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: отведёт
  rationale: Порода hифиль глагола סור выражает удаление или устранение; «отведёт от тебя» естественно передаёт причинное значение и образ удаления бедствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: כָּל חֹלִי
  choice: всякую болезнь
  rationale: חֹלִי означает болезнь или недуг; форма единственного числа с כָּל имеет обобщающее значение.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: тяжких болезней Египта
  rationale: מַדְוֶה обозначает болезнь, а רַע может характеризовать её как тяжкую, вредоносную или губительную. «Тяжких» звучит естественно по-русски, не превращая нравственную характеристику «злые» в неясное выражение.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: которые ты знал
  rationale: Буквальная передача ידע сохраняет возможность как обычного знания, так и знания из личного опыта; последнее пояснено в сноске.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: не наведёт на тебя
  rationale: שׂים с ב буквально описывает возложение или помещение на кого-либо; применительно к болезням русское «навести на» естественно передаёт причинение бедствия.
- source_word: וּנְתָנָם בְּכָל שֹׂנְאֶיךָ
  choice: но наведёт их на всех ненавидящих тебя
  rationale: נתן буквально означает «дать, поместить»; повтор «наведёт» сохраняет связь с болезнями и делает противопоставление ясным. Причастие שֹׂנְאֶיךָ точно передано как «ненавидящих тебя», а не более широким словом «врагов».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблено личное имя Бога; транслитерация «Яхве» сохраняет это имя, не подменяя его титулом.
- issue: Характер обещания об избавлении от болезней
  choice: Конкретное обетование в контексте завета с Израилем
  alternative: Безусловное обещание каждому верующему никогда не болеть; исключительно метафорическое описание
  rationale: Текст прямо говорит о болезнях и болезнях Египта, но сам по себе не распространяет это обетование на всех людей и все обстоятельства и не даёт оснований понимать болезни лишь метафорически.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность еврейских предложений, но употребляет естественное для русского сочетание «навести болезнь». Местоимение второго лица оставлено в единственном числе, как в еврейском тексте.
