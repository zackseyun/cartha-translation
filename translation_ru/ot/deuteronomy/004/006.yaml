  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: ru
  text: 'Соблюдайте же их и исполняйте, ибо в этом — ваша мудрость и ваше разумение в глазах народов, которые услышат все эти постановления[a] и скажут: «Поистине[b], этот великий народ — мудрый и разумный народ!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Постановления» — перевод еврейского חֻקִּים, юридического термина, который также можно передать словами «установления» или «предписания».
    reason: lexical_alternative
  - marker: b
    text: 'Или, более буквально: «Только этот великий народ — мудрый и разумный народ». Еврейское רַק обычно означает «только», но здесь, вероятно, служит усилительным восклицанием: «Поистине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  choice: Соблюдайте же их и исполняйте
  rationale: Глагол שׁמר в контексте заповедей означает их соблюдение, а עשה подчёркивает практическое исполнение. Сочетание двух глаголов сохраняет смысловую парность оригинала; местоимение «их» естественно отсылает к предшествующим установлениям.
- source_word: כִּי הִוא
  choice: ибо в этом
  rationale: Форма единственного числа обобщённо указывает на только что названное соблюдение и исполнение установлений. Русское «в этом» естественно передаёт такую собирательную отсылку, не ограничивая её одним отдельным предписанием.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: ваша мудрость и ваше разумение
  rationale: «Мудрость» передаёт חכמה, а «разумение» сохраняет отдельный, хотя и близкий, смысл בינה и позволяет далее отразить связь с נבון.
- source_word: לְעֵינֵי הָעַמִּים
  choice: в глазах народов
  rationale: Это естественный русский эквивалент буквального образа «в глазах народов»; он сохраняет значение публичной оценки со стороны других народов.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: все эти постановления
  rationale: חֻקִּים — юридически окрашенное обозначение установленных норм. «Постановления» понятно современному читателю и сохраняет правовой оттенок.
- source_word: רַק
  choice: Поистине
  rationale: Хотя основное ограничительное значение слова — «только», здесь оно вводит emphатическое признание народов. «Поистине» естественно передаёт восклицательную уверенность, а буквальная возможность отмечена в сноске.
- source_word: עַם חָכָם וְנָבוֹן הַגּוֹי הַגָּדוֹל הַזֶּה
  choice: этот великий народ — мудрый и разумный народ
  rationale: Формулировка сохраняет повтор слова «народ» и смысловую перекличку נבון с ранее названным «разумением». Различие между עם и גוי невозможно последовательно передать здесь без неестественного русского выражения.
theological_decisions:
- issue: Связь послушания с мудростью
  choice: Соблюдение и исполнение постановлений представлены как то, в чём мудрость и разумение Израиля становятся видимы другим народам.
  alternative: Можно понимать местоимение הִוא как указание прежде всего на сами постановления, рассматриваемые как мудрость Израиля.
  rationale: Оборот «в этом» сохраняет обобщённую отсылку и не разрывает связь между данными Богом постановлениями и их практическим исполнением. Перевод не добавляет утверждений о заслуге или национальном превосходстве.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; «ибо» и «поистине» поддерживают достоинство речи без архаизации.
