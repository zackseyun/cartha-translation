  source_fidelity: Перевод точно передаёт повеление соблюдать и исполнять установления, связь этого с мудростью и разумением народа перед другими народами и последующее признание ими. «В этом» удачно сохраняет собирательную отсылку הִוא, не вынуждая выбирать между самими постановлениями и их соблюдением. Различение הָעַמִּים («народы») и הַגּוֹי («народ») в русском тексте сохранено.
