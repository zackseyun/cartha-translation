  terminology: «Постановления» является допустимой передачей חֻקִּים и последовательно снабжено полезной лексической сноской. Пара «мудрость и разумение» корректно отражает חָכְמָה / בִּינָה, а «мудрый и разумный» сохраняет перекличку с חָכָם / נָבוֹן. Сноска к רַק надлежащим образом отмечает основное значение «только», не устраняя контекстуально вероятного усилительного смысла «Поистине».
