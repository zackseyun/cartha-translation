source:
  edition: WLC
  text: מִן הַ/שָּׁמַ֛יִם הִשְׁמִֽיעֲ/ךָ֥ אֶת קֹל֖/וֹ לְ/יַסְּרֶ֑/ךָּ וְ/עַל הָ/אָ֗רֶץ הֶרְאֲ/ךָ֙ אֶת אִשּׁ֣/וֹ הַ/גְּדוֹלָ֔ה וּ/דְבָרָ֥י/ו שָׁמַ֖עְתָּ מִ/תּ֥וֹךְ הָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: ru
  text: С небес Он дал тебе услышать Свой голос, чтобы вразумлять тебя[a], а на земле показал тебе Свой великий огонь; и ты слышал Его слова из среды огня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы наставлять тебя», «чтобы исправлять тебя»; еврейский глагол может обозначать как наставление, так и исправляющее воспитание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изнутри огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: С небес
  rationale: Естественно передаёт еврейскую идиому и сохраняет пространственное противопоставление выражению «на земле».
- source_word: הִשְׁמִיעֲךָ
  choice: Он дал тебе услышать
  rationale: Сохраняет каузативное значение породы хифиль глагола שׁמע и при этом звучит естественно по-русски.
- source_word: קֹלוֹ
  choice: Свой голос
  rationale: В контексте Божьей слышимой речи קוֹל означает «голос»; возвратное притяжательное местоимение соответствует нормам русского языка.
- source_word: לְיַסְּרֶךָּ
  choice: чтобы вразумлять тебя
  rationale: Глагол יסר охватывает наставление, исправление и воспитательное воздействие. «Вразумлять» сохраняет сочетание обучающего и исправляющего смыслов, не сводя его только к наказанию.
- source_word: וְעַל הָאָרֶץ
  choice: а на земле
  rationale: Союз «а» ясно выражает заложенное в контексте противопоставление небес и земли.
- source_word: הֶרְאֲךָ
  choice: показал тебе
  rationale: Идиоматически передаёт каузативную форму глагола ראה — «дал увидеть».
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: Свой великий огонь
  rationale: Прямо сохраняет конкретный образ, притяжательность и определение величия без смыслового расширения.
- source_word: וּדְבָרָיו
  choice: Его слова
  rationale: Сохраняет явно выраженное в еврейском тексте множественное число.
- source_word: שָׁמַעְתָּ
  choice: ты слышал
  rationale: Передаёт совершившееся восприятие речи на слух, не добавляя оттенка послушания.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из среды огня
  rationale: Сохраняет конкретное пространственное значение מִתּוֹךְ и торжественную образность оригинала.
theological_decisions:
- issue: Смысл Божьего воздействия в לְיַסְּרֶךָּ
  choice: чтобы вразумлять тебя
  alternative: чтобы наставлять тебя; чтобы исправлять тебя; чтобы наказывать тебя
  rationale: Выбранный вариант удерживает напряжение между наставлением и исправляющим воздействием, не ограничивая значение ни простым обучением, ни карательным наказанием.
- issue: Конкретный язык Божьего откровения
  choice: Свой голос… Свой великий огонь… Его слова
  alternative: абстрактное описание Божьего откровения
  rationale: Конкретные выражения еврейского текста сохранены без богословского смягчения или перетолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные местоимения при указании на Бога использованы последовательно; синтаксис остаётся ясным для современного читателя.
