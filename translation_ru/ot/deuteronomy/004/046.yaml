source:
  edition: WLC
  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: ru
  text: за Иорданом, в долине напротив Бет-Пеора, в земле Сихона, царя аморреев, жившего в Хешбоне. Его поразили Моисей и сыны Израиля[a], когда вышли из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». В еврейском тексте буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Кратко и естественно передаёт местность по ту сторону реки с точки зрения говорящего; направление определяется контекстом.
- source_word: בַּגַּיְא
  choice: в долине
  rationale: גַּיְא обозначает долину или ущелье; «долина» здесь естественно соответствует широкому топографическому описанию.
- source_word: מוּל בֵּית פְּעוֹר
  choice: напротив Бет-Пеора
  rationale: מוּל выражает пространственное положение напротив или перед чем-либо; название места передано транслитерацией.
- source_word: בְּאֶרֶץ סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: в земле Сихона, царя аморреев
  rationale: Сохранены структура приложения и значение אֶרֶץ как земли, принадлежавшей или подвластной Сихону.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: жившего в Хешбоне
  rationale: Причастие יוֹשֵׁב указывает на постоянное местопребывание; «жившего» звучит естественно в современном русском.
- source_word: אֲשֶׁר הִכָּה
  choice: Его поразили
  rationale: נכה в военном контексте означает нанести поражение, сразить или поразить. «Поразили» сохраняет образ исходного глагола, не уточняя сверх текста, был ли царь лично убит в данном действии.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: и сыны Израиля
  rationale: Сохраняется формально выраженное мужское множественное число и традиционный заветный этноним; более идиоматичное коллективное обозначение дано в примечании.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: когда вышли из Египта
  rationale: Инфинитивная конструкция с בְּ передаёт временное обстоятельство. Нулевое местоимение естественно для русского и соотносится с Моисеем и сынами Израиля.
theological_decisions:
- issue: Гендерно маркированный заветный этноним וּבְנֵי יִשְׂרָאֵל
  choice: и сыны Израиля
  alternative: и израильтяне
  rationale: Основной текст сохраняет буквальную мужскую форму и устойчивое библейское обозначение народа, а примечание предлагает естественный русский коллективный эквивалент без изменения референции.
- issue: Степень конкретизации глагола נכה по отношению к Сихону
  choice: поразили
  alternative: разгромили / убили
  rationale: «Поразили» сохраняет военный смысл и не устраняет лексическую широту исходного глагола, который сам по себе может обозначать удар, поражение или гибель в бою.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским звучанием. Длинная еврейская относительная конструкция разделена на два предложения ради ясности; смысловые связи сохранены. Географические имена переданы последовательной современной транслитерацией: Бет-Пеор, Сихон, Хешбон.'
