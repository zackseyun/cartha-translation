  naturalness: Русский текст естественен для современного литературного регистра. Разделение длинной цепочки определений на два предложения улучшает читаемость без смысловой потери; местоимение «Его» однозначно отсылает к Сихону. Формы «за Иорданом», «напротив Бет-Пеора» и «когда вышли из Египта» звучат нормативно и уместно.
