  naturalness: Исправленный текст остаётся естественным современным литературным русским. Оборот «чтобы овладеть которой» несколько книжный, но уместен для торжественно-юридического регистра и ясно связывает переход через Иордан с целью овладения землёй.
  terminology: «Призываю небо и землю в свидетели против вас», «непременно», «истреблены» адекватно передают юридическую формулу и усилительные инфинитивы. «Исчезнете с той земли» сохраняет отличие первого высказывания (утрата/исчезновение с земли) от последующего пассивного «будете истреблены», не предрешая спорных богословских выводов.
