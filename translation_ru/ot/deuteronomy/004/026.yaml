  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: ru
  text: 'Сегодня я призываю небо и землю в свидетели против вас: вы вскоре непременно исчезнете с той земли, чтобы овладеть которой вы переходите Иордан. Вы недолго проживёте на ней, ибо непременно будете истреблены.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: я призываю ... в свидетели против вас
  rationale: Хифиль глагола עוּד и предлог בְ передают юридический вызов свидетелей против адресатов; русская формула сохраняет судебно-заветный характер выражения.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небо и землю
  rationale: В русском языке это естественная устойчивая формула; морфологическое множественное число שָׁמַיִם не требует перевода «небеса» в данном сочетании.
- source_word: אָבֹד תֹּאבֵדוּן מַהֵר
  choice: вы вскоре непременно исчезнете
  rationale: Инфинитив абсолютный усиливает уверенность угрозы, что выражено наречием «непременно»; מַהֵר передано естественным «вскоре». Глагол «исчезнете» в сочетании «с земли» передаёт утрату пребывания на ней, не смешивая эту формулировку с последующим пассивным «будете истреблены».
- source_word: מֵעַל הָאָרֶץ
  choice: с земли
  rationale: Естественно передаёт буквальное «с поверхности земли» и подразумеваемое удаление из страны.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: которой идёте овладеть, перейдя Иордан
  rationale: Формулировка ясно связывает переход через Иордан с целью вступить во владение землёй и естественно передаёт направительное שָׁמָּה.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: Вы недолго проживёте на ней
  rationale: Идиоматически передаёт каузативное «не продлите дней» без неестественной русской кальки, сохраняя смысл краткого пребывания на земле.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: непременно будете истреблены
  rationale: Пассивная форма и усилительная конструкция сохранены соответственно страдательным оборотом и словом «непременно»; «истреблены» выражает суровый приговор, не вводя философского понятия полного небытия.
theological_decisions:
- issue: Формула призыва неба и земли как свидетелей завета
  choice: Передана как юридический призыв творения свидетельствовать против Израиля
  alternative: «Предостерегаю вас сегодня небом и землёй»
  rationale: Исходная конструкция имеет характер судебного свидетельства в рамках завета; буквенно-идиоматический перевод сохраняет эту функцию, не добавляя богословских выводов.
- issue: Соотношение אָבֹד תֹּאבֵדוּן и הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: Различены как «исчезнете с земли» и «будете истреблены»
  alternative: 'Оба оборота перевести одинаково: «погибнете»'
  rationale: 'Различение сохраняет движение мысли: сначала утрата земли, затем усиленное утверждение о гибельном суде, при этом не определяет сверх сказанного конечную участь каждого человека.'
translation_notes:
  register: 'Современный литературный русский язык с достоинством заветно-судебной речи. Синтаксис слегка перестроен ради ясности: переход через Иордан оформлен деепричастным оборотом, а еврейская идиома о продлении дней передана естественным русским выражением. Стих не нуждается в сносках: существенные оттенки можно сохранить в основном тексте.'
