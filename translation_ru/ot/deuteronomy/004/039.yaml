base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: ru
  text: Итак, знай сегодня и прими это в своё сердце[a], что Яхве — Он Бог на небесах вверху и на земле внизу; другого нет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возврати это к своему сердцу»; то есть внутренне осмысли и прими как истину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нет иного».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Итак, знай сегодня
  rationale: Форма совершенного вида с союзом в данном контексте имеет побудительную силу. «Знай сегодня» сохраняет настоятельность и временную непосредственность призыва; «итак» естественно связывает его с предшествующим рассуждением.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: и положи это на сердце
  rationale: Еврейская идиома буквально говорит о возвращении или обращении чего-либо к сердцу и означает внутренне осмыслить и принять истину. Русское «положить на сердце» сохраняет образ сердца и передаёт не только знание, но и внутреннее усвоение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: הוּא הָאֱלֹהִים
  choice: Он Бог
  rationale: Самостоятельное местоимение הוּא несёт усилительное ударение. Конструкция «Яхве — Он Бог» сохраняет это выделение и утверждение исключительности.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: на небесах вверху и на земле внизу
  rationale: 'Сохранена пространственная пара, охватывающая весь мир: небеса вверху и земля внизу.'
- source_word: אֵין עוֹד
  choice: другого нет
  rationale: Краткая естественная формулировка передаёт абсолютную исключительность, не добавляя уточнений, отсутствующих в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Усилительное הוּא в утверждении о Боге
  choice: Яхве — Он Бог
  alternative: Яхве есть Бог; Яхве — Бог
  rationale: Выбранная конструкция сохраняет явно выраженное и ударное местоимение, не разворачивая утверждение в более позднюю богословскую формулу.
- issue: Исключительность в אֵין עוֹד
  choice: другого нет
  alternative: нет более никого; нет иного
  rationale: Фраза сохраняет абсолютное утверждение об исключительности Яхве в пределах сказанного стихом, без дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ сердца, космическая пара «небеса — земля», личное имя Яхве и усилительное местоимение; синтаксис остаётся понятным обычному читателю.
