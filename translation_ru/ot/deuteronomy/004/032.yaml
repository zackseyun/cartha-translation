revisions:
- from: 'Итак, расспроси о прежних днях, которые были до тебя[a], начиная с того дня, когда Бог сотворил человека на земле, и от одного края небес до другого: случалось ли когда-нибудь нечто подобное этому великому событию или было ли слышано что-либо подобное?'
  to: 'Спроси же о прежних днях, которые были до тебя[a]: от дня, когда Бог сотворил человека на земле, и от одного края небес до другого, — бывало ли нечто столь великое или слышано ли было что-либо подобное?'
  rationale: Убрано невыраженное в оригинале «итак»; «расспроси» заменено на более прямое и естественное «спроси же», передающее императив с נָא. Заключительный вопрос переформулирован так, чтобы не сужать דבר до одного только «события», при этом сохранены риторическая форма, временной и пространственный охват оригинала и сноска к אָדָם.
