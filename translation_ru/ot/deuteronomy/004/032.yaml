  source_fidelity: 'Смысл в целом передан верно: призыв обратиться к древнему прошлому, временной охват от сотворения человека и пространственный меризм «от края небес до края небес», а также два риторических вопроса сохранены. Однако «итак» не имеет прямой опоры в еврейском тексте, а «расспроси о» менее естественно и несколько меняет простой призыв שְׁאַל נָא («спроси же / спроси теперь»).'
