  terminology: «Бог», «сотворил», «человека», «небеса» и «слышано» уместны. «Нечто подобное этому великому событию» допустимо, но «столь великое» лучше сохраняет широкое דבר («дело, явление, событие»), не сужая его до конкретного события. Сноска к «человека» корректно отмечает родовое значение אָדָם.
