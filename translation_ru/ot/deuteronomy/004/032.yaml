  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: ru
  text: 'Спроси же о прежних днях, которые были до тебя[a]: от дня, когда Бог сотворил человека на земле, и от одного края небес до другого, — бывало ли нечто столь великое или слышано ли было что-либо подобное?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «человека», здесь может обозначать человечество в целом.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: итак, расспроси
  rationale: Императив с частицей נָא передаёт настойчивый призыв обратиться к свидетельству прошлого; «расспроси» естественно указывает на тщательное исследование, а «итак» сохраняет побудительно-усилительный оттенок в контексте.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: о прежних днях
  rationale: Обозначает древнейшее прошлое; формулировка сохраняет возвышенность и остаётся понятной современному читателю.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: которые были до тебя
  rationale: 'Сохраняет временной смысл: дни, предшествовавшие адресату.'
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: начиная с того дня, когда … сотворил
  rationale: Ясно обозначает начальную точку всего рассматриваемого периода.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово обозначает единого Бога-Творца.
- source_word: אָדָם
  choice: человека
  rationale: Существительное употреблено в единственном числе и в контексте сотворения может обозначать человека как представителя всего человечества; «человека» сохраняет эту смысловую широту без обязательного превращения слова в имя собственное.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Прямой и естественный русский локативный эквивалент.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: и от одного края небес до другого
  rationale: Передаёт меризм всеохватного пространственного масштаба, сохраняет множественное число «небеса» и избегает ненужного повтора.
- source_word: הֲנִהְיָה
  choice: случалось ли когда-нибудь нечто подобное
  rationale: Вопросительная форма глагола היה спрашивает, происходило ли подобное событие; «когда-нибудь» естественно выражает охват всей предшествующей истории.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: подобное этому великому событию
  rationale: דבר здесь означает дело или событие, а не только слово; «событие» точно соответствует историческому контексту.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: или было ли слышано что-либо подобное?
  rationale: Сохраняет пассивную форму и риторический вопрос о том, известно ли по свидетельству или слуху что-либо сравнимое.
theological_decisions:
- issue: Значение אָדָם в рассказе о сотворении
  choice: человека
  alternative: Адама; человечество
  rationale: Контекст охватывает историю от сотворения людей, а אָדָם допускает как представительно-родовое понимание, так и ассоциацию с первым человеком. Основной текст сохраняет грамматическое единственное число и широкое значение, а примечание явно отмечает родовой смысл.
translation_notes:
  register: Современный литературный русский язык с достойным, слегка возвышенным библейским регистром. Длинная риторическая конструкция сохранена, но расчленена естественными русскими связками; подлинная неоднозначность אָדָם отмечена в сноске.
