source:
  edition: WLC
  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: ru
  text: Ведь Яхве, твой Бог, — сострадательный Бог[a]. Он не оставит тебя[b], не погубит тебя и не забудет завета твоих отцов[c], который Он поклялся дать им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милосердный Бог».'
    reason: Лексема רַחוּם может передавать как сострадание, так и милосердие.
  - marker: b
    text: 'Или: «не покинет тебя»; буквально также возможно: «не отпустит тебя».'
    reason: Глагол רפה в хифиле имеет диапазон значений «отпустить, оставить, покинуть, лишить поддержки».
  - marker: c
    text: 'Или: «завета твоих предков». Буквально в еврейском тексте: «завета твоих отцов»; имеются в виду праотцы Израиля, с которыми связан завет.'
    reason: Сноска поясняет возможную более общую передачу и историческую конкретность мужской формы источника.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего призыва; «ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: אֵל רַחוּם
  choice: Бог сострадательный
  rationale: רַחוּם обозначает сострадание и милосердие. «Сострадательный» ясно передаёт Божью чуткость к бедствию людей и сохраняет возвышенный, но современный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохранены обращение во втором лице единственного числа и личный характер отношений завета.
- source_word: לֹא יַרְפְּךָ
  choice: не оставит тебя
  rationale: Порода хифиль глагола רפה здесь выражает значение «отпустить, оставить без поддержки». «Не оставит» естественно передаёт обещание верности, не сужая его до физического действия.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: не погубит тебя
  rationale: Глагол שׁחת в хифиле означает уничтожить или погубить. «Погубит» естественно сочетается с личным объектом и сохраняет силу предупреждения.
- source_word: וְלֹא יִשְׁכַּח אֶת־בְּרִית
  choice: не забудет завета
  rationale: 'Сохранён буквальный и богословски значимый образ: Бог не забывает завет.'
- source_word: אֲבֹתֶיךָ
  choice: с твоими отцами
  rationale: «Отцами» сохраняет мужскую форму и историческую отсылку к праотцам Израиля; предлог «с» естественно выражает участников завета по-русски.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: который клятвенно обещал им
  rationale: Формулировка сохраняет значение торжественной клятвы и даёт естественную русскую связь относительного местоимения с «заветом».
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. «Яхве» передаёт его как имя, а не заменяет титулом.
- issue: Значение אֲבֹתֶיךָ в истории завета
  choice: твоими отцами
  alternative: твоими предками
  rationale: Мужская форма источника исторически указывает на праотцов Израиля. Основной текст сохраняет эту конкретность, а более общее значение отмечено в сноске.
- issue: Отношение к завету в אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: завет, который клятвенно обещал им
  alternative: завет, о котором поклялся им
  rationale: В источнике сохраняется язык клятвы без уточнения её содержания. Русская формулировка не добавляет конкретных обязательств, но ясно связывает клятву с заветом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранено обращение на «ты» во втором лице единственного числа. Повтор отрицания перед однородными сказуемыми поддерживает ритм и категоричность еврейского обещания; во второй и третьей позициях русский союз не добавлен, чтобы фраза звучала естественно.
