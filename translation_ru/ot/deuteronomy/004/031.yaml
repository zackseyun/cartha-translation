  source_fidelity: 'Основной смысл передан верно: יהוה передано личным именем «Яхве», רַחוּם — как «сострадательный», а три отрицательных действия сохранены. Однако конструкция «завета с твоими отцами» не вполне соответствует еврейскому בְּרִית אֲבֹתֶיךָ («завет твоих отцов»), а «клятвенно обещал им» менее точно передаёт נִשְׁבַּע לָהֶם, где прямо говорится о клятве.'
