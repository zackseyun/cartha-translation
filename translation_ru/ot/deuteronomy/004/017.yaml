lexical_decisions:
- source_word: תַּבְנִית
  choice: образ
  rationale: В контексте запрета на идольские изображения слово обозначает видимое воспроизведение облика существа; «образ» естественно по-русски и сохраняет повтор в обеих частях стиха.
- source_word: כָּל
  choice: какого-либо / какой-либо
  rationale: 'При существительных в единственном числе передаёт неопределённо-обобщающее значение: любое существо данного класса.'
- source_word: בְּהֵמָה
  choice: животное
  rationale: Здесь слово обозначает наземное животное в противопоставлении птицам и водным существам, а не только домашний скот.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: которое на земле
  rationale: Сохраняет краткое пространственное описание оригинала и противопоставление небесной и водной сферам.
- source_word: צִפּוֹר כָּנָף
  choice: крылатая птица
  rationale: Прямо передаёт сочетание существительных и его описательную силу, не создавая неестественной русской конструкции.
- source_word: תָּעוּף
  choice: летающей
  rationale: Причастный оборот естественно выражает по-русски характеристику целого класса и соответствует значению еврейского глагола.
- source_word: בַּשָּׁמָיִם
  choice: в небесах
  rationale: Сохраняет форму множественного числа и возвышенный регистр, хотя по смыслу речь может идти о видимом небе.
theological_decisions:
- issue: Значение תַּבְנִית в контексте запрета изображений
  choice: образ
  alternative: вид / подобие / изображение
  rationale: «Образ» сохраняет связь как с внешним обликом, так и с его воспроизведением, не уточняя сверх текста ни материал, ни культовую функцию конкретного предмета.
translation_notes:
