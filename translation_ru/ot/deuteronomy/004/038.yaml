  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: ru
  text: чтобы изгнать перед тобой народы, более многочисленные и сильные, чем ты[a], ввести тебя и дать тебе их землю в наследие — как это видно ныне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишить владений»; еврейский глагол означает вытеснить прежних жителей, чтобы землю получил другой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как в этот день» — устойчивое выражение со значением «как это очевидно сегодня» или «как обстоит дело сегодня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: изгнать
  rationale: В породе hифиль глагол ירשׁ при объекте «народы» означает лишить прежних жителей владения, вытеснив их; «изгнать» ясно передаёт действие, не добавляя толкования в основной текст.
- source_word: גּוֹיִם
  choice: народы
  rationale: Обычное значение слова соответствует контексту народов, населявших землю; перевод «язычники» внёс бы ненужную религиозную окраску.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: которые многочисленнее и сильнее тебя
  rationale: В данном военно-политическом контексте גָּדוֹל указывает на превосходство народов по величине или численности, а עָצוּם — по силе. Придаточная конструкция естественна для современного русского языка.
- source_word: מִפָּנֶיךָ
  choice: от тебя
  rationale: Идиома обозначает удаление народов прочь перед Израилем; «от тебя» звучит естественно и сохраняет направленность удаления.
- source_word: לַהֲבִיאֲךָ
  choice: ввести тебя
  rationale: Каузативная форма בוא означает «ввести»; подразумеваемая цель — земля — прямо названа в следующей части стиха.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: отдать тебе их землю
  rationale: Передаёт идею дара и естественный русский порядок слов. «Отдать» здесь подчёркивает переход земли к адресату, не отрицая божественного дара.
- source_word: נַחֲלָה
  choice: в наследие
  rationale: Сохраняет важное для Второзакония значение земли как дарованного наследственного владения.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  rationale: Передаёт дейктическую формулу, указывающую на очевидное нынешнее положение дел, сохраняя при этом её связь с «сегодня».
theological_decisions:
- issue: Заветное значение נַחֲלָה
  choice: в наследие
  alternative: во владение
  rationale: «Наследие» сохраняет представление о земле как о дарованном Богом наследственном уделе; «владение» было бы семантически допустимо, но богословски менее содержательно.
- issue: Степень осуществления завоевания в формуле כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  alternative: как ныне видишь
  rationale: 'Перевод сохраняет формальную неоднозначность: выражение может указывать на уже очевидное исполнение сказанного, не уточняя сверх текста объём или этап завоевания.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет целевую связь с предыдущим стихом; местоимение «тебя» передаёт единственное число собирательного обращения к Израилю.
