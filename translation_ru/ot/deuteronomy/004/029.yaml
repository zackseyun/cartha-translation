  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: ru
  text: Но оттуда вы будете искать Яхве, твоего Бога,[a] и ты найдёшь его, если будешь искать его всем своим сердцем и всей своей душой.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте обращение переходит от множественного числа («вы будете искать») к единственному («твоего Бога… ты найдёшь»), представляя народ и как множество, и как единого адресата.
    reason: grammatical_shift
  - marker: b
    text: 'Или: «всей своей жизнью» или «всем своим существом»; еврейское נֶפֶשׁ может означать жизнь, самого человека или живое существо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Но ... вы станете искать
  rationale: Форма обращена ко множеству и в данном контексте имеет будущее, результативное значение. «Но» естественно передаёт контраст с предшествующим предупреждением.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: 'Сочетание предлога מִן с наречием שָׁם имеет ясное пространственное значение: рассеянный народ станет искать Бога из тех мест.'
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Яхве, Бога твоего
  rationale: Личное имя יְהוָה передано как «Яхве». Единственное число притяжательного суффикса сохранено, чтобы не скрывать переход от множественного обращения к единственному.
- source_word: וּמָצָאתָ
  choice: и ты найдёшь его
  rationale: Глагол стоит во втором лице единственного числа; подразумеваемый объект восстанавливается из предыдущей части. «Найдёшь» передаёт успешное обретение искомого.
- source_word: כִּי
  choice: если
  rationale: Здесь союз вводит условие, при котором ищущий найдёт Бога. «Если» сохраняет условный смысл, не усиливая его до неизбежного «когда».
- source_word: תִדְרְשֶׁנּוּ
  choice: будешь искать его
  rationale: В контексте отношений с Богом דרש означает усердно искать его, а не просто справляться или расспрашивать о нём.
- source_word: בְּכָל לְבָבְךָ
  choice: всем своим сердцем
  rationale: לֵבָב обозначает внутреннего человека, включая волю, мысли и чувства; русское выражение естественно передаёт полноту устремления.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: и всей своей душой
  rationale: Традиционное и понятное русское выражение сохраняет формулу всецелой преданности; более широкий диапазон נֶפֶשׁ отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено личное заветное имя Бога; транслитерация «Яхве» отличает его от титула «Господь».
- issue: Переход от множественного обращения к единственному
  choice: 'Сохранить: «вы ... Бога твоего ... ты»'
  alternative: Согласовать всё во множественном числе ради плавности
  rationale: Масоретский текст действительно меняет число после первого глагола. Сохранение перехода передаёт обращение одновременно к народу как множеству и к Израилю как единому адресату.
- issue: Значение נֶפֶשׁ в формуле всецелой преданности
  choice: душой
  alternative: жизнью; всем существом
  rationale: «Душой» сохраняет литературную и богословскую узнаваемость формулы, не исключая более широкого значения всего живого человека, которое указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис оставлен ясным, а необычный переход числа сохранён и пояснён; местоимения, относящиеся к Богу, написаны со строчной буквы как нейтральная современная норма.
