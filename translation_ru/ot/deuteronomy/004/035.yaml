  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: ru
  text: 'Тебе было показано это, чтобы ты знал: Яхве[a] — Бог; нет иного, кроме Него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (ЙХВХ); традиционно вместо него также читают «Господь».
    reason: Объяснение передачи божественного имени
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: тебе было показано
  rationale: 'Глагол в породе хофаль имеет каузативно-пассивное значение: Израиль не просто увидел, но ему было показано. Русская пассивная конструкция передаёт это прямо и естественно.'
- source_word: לָדַעַת
  choice: чтобы ты знал
  rationale: Инфинитив с ל здесь выражает цель или предполагаемый результат показанного.
- source_word: כִּי
  choice: — двоеточие перед содержанием знания
  rationale: Союз вводит содержание того, что Израиль должен знать; в русском это естественно передаётся двоеточием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: הוּא הָאֱלֹהִים
  choice: — Бог
  rationale: Русская именная конструкция с тире естественно выражает отождествление. Отдельное местоимение הוּא придаёт еврейской фразе подчёркнутый характер, но буквальное «Он есть Бог» в данном русском предложении звучало бы тяжеловесно.
- source_word: אֵין עוֹד מִלְבַדּוֹ
  choice: нет иного, кроме Него
  rationale: Формула прямо утверждает исключительность Яхве, не добавляя дальнейших философских или догматических уточнений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное Божье имя. Форма «Яхве» сохраняет имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Сила утверждения об исключительности Бога
  choice: нет иного, кроме Него
  alternative: нет другого Бога, кроме Него
  rationale: Выбранный вариант сохраняет краткость и абсолютный характер еврейской формулы, не вставляя отсутствующее в этой части стиха существительное «Бог».
- issue: Подчёркивающее местоимение הוּא
  choice: Яхве — Бог
  alternative: Яхве — Он есть Бог
  rationale: Русское именное сказуемое с тире ясно и торжественно передаёт отождествление, тогда как механическое сохранение местоимения менее естественно. Исключительный смысл дополнительно и прямо выражен следующей частью стиха.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Сохранены обращение к Израилю в единственном числе, пассивное значение глагола и исключительное утверждение заключительной части стиха.
