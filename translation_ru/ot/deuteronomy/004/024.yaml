lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего предостережения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет притяжательный суффикс второго лица единственного числа и личное обращение к Израилю в рамках завета.
- source_word: אֵשׁ אֹכְלָה
  choice: пожирающий огонь
  rationale: Сохраняет яркую метафору огня, который уничтожает всё на своём пути; выражение естественно для современного литературного русского языка.
- source_word: הוּא
  choice: —
  rationale: Связка в настоящем времени по-русски опускается, а тире ясно и выразительно оформляет именную предикативную конструкцию.
- source_word: אֵל
  choice: Бог
  rationale: Передаёт общее обозначение Бога, стоящее в приложении к предыдущему образу.
- source_word: קַנָּא
  choice: ревнивый
  rationale: Передаёт исключительное право Яхве на верность народа завета и неприятие соперничающего поклонения, не смягчая напряжённость еврейского слова.
theological_decisions:
- issue: Передача Божьей ревности
  choice: ревнивый Бог
  alternative: ревностный Бог
  rationale: В контексте запрета идолопоклонства речь идёт не просто о рвении, а об исключительном требовании верности в отношениях завета. «Ревнивый» сохраняет эту трудную, но существенную богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой и торжественной структурой. Образ «пожирающего огня» сохранён без поясняющего расширения; личное имя Яхве передано транслитерацией.
