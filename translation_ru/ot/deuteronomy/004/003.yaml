translation:
  language: ru
  text: 'Вы своими глазами видели, что сделал Яхве при Ваал-Фегоре: каждого мужчину, который пошёл вслед за Ваал-Фегором[a], Яхве, твой Бог, истребил из твоей среды.[b]'
