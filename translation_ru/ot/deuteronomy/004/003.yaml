    text: 'Или: «который последовал за Ваал-Фегором». Буквально: «который пошёл вслед за Ваал-Фегором».'
    reason: lexical_alternative
  - marker: b
    text: В начале стиха обращение стоит во множественном числе («вы»), а здесь еврейский текст переходит к единственному («твой», «твоей»).
