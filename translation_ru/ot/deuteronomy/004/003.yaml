lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Вы своими глазами видели
  rationale: Передаёт вынесенное вперёд слово «глаза» и подчёркнутую мысль о личном свидетельстве естественным современным русским оборотом.
- source_word: עָשָׂה
  choice: сделал
  rationale: В данном контексте глагол обозначает действие Яхве при суде, а не создание чего-либо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняет личное имя Бога, переданное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּבַעַל פְּעוֹר
  choice: у Ваал-Фегора
  rationale: Предлог ב обозначает место или обстоятельства события; «у» кратко сохраняет эту связь, не сводя её однозначно к причине.
- source_word: כָּל הָאִישׁ
  choice: каждого мужчину
  rationale: Сохраняет распределительное значение и грамматически мужскую форму единственного числа.
- source_word: הָלַךְ אַחֲרֵי
  choice: пошёл вслед за
  rationale: Сохраняет еврейский образ следования, который в контексте подразумевает религиозную приверженность.
- source_word: הִשְׁמִידוֹ
  choice: истребил
  rationale: Сильный каузативный глагол выражает полное уничтожение; прямое дополнение уже представлено оборотом «каждого мужчину».
- source_word: מִקִּרְבֶּךָ
  choice: из твоей среды
  rationale: Передаёт удаление изнутри общины и сохраняет единственное число второго лица.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя.
- issue: Распределительное כָּל הָאִישׁ
  choice: каждого мужчину
  alternative: каждого / всех, кто
  rationale: Выбранный вариант сохраняет явно мужскую форму исходного текста, не исключая распределительного смысла.
- issue: Смена числа адресата
  choice: «вы… видели», затем «твой Бог… из твоей среды»
  alternative: унифицировать всё во множественном числе
  rationale: Исходный текст переходит от множественного числа в עֵינֵיכֶם к единственному в אֱלֹהֶיךָ и מִקִּרְבֶּךָ; перевод сохраняет эту особенность, не устраняя возможную риторическую напряжённость.
