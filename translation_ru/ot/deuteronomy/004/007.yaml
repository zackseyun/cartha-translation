  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: ru
  text: Ведь есть ли какой-нибудь великий народ, у которого боги[a] были бы так же близки к нему, как близок к нам Яхве, наш Бог, всякий раз, когда мы взываем к нему?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово стоит во множественном числе: «боги». Здесь божества других народов риторически сопоставляются с Яхве, Богом Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всякий раз, когда мы обращаемся к нему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предыдущего наставления; «ведь» естественно передаёт пояснительно-аргументативную связь.
- source_word: מִי גוֹי גָּדוֹל
  choice: есть ли какой-нибудь великий народ
  rationale: Риторическое еврейское «какой великий народ?» в современном русском естественно передаётся вопросительной конструкцией «есть ли…».
- source_word: אֲשֶׁר לוֹ
  choice: у которого
  rationale: Русская конструкция обладания естественно передаёт буквальное «которому принадлежат / у которого есть».
- source_word: אֱלֹהִים
  choice: боги
  rationale: Согласованное прилагательное קְרֹבִים стоит во множественном числе, а контекст сопоставляет божеств других народов с Яхве, Богом Израиля.
- source_word: קְרֹבִים אֵלָיו
  choice: были бы так близки
  rationale: Форма сохраняет множественное согласование и риторико-сравнительный оттенок; отношение к народу уже выражено словами «у которого».
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: как близок к нам Яхве, наш Бог
  rationale: В русском сравнении требуется восполнить подразумеваемое сказуемое и адресат близости; это проясняет синтаксис, не добавляя нового содержания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: всякий раз, когда мы взываем к нему
  rationale: Сочетание בְּכָל с инфинитивной конструкцией выражает повторяющееся обстоятельство; «взываем к нему» естественно передаёт обращение к Богу в молитве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное заветное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение אֱלֹהִים в первой части стиха
  choice: множественное «боги» — божества других народов
  alternative: Бог; божественные существа
  rationale: Множественное число прилагательного קְרֹבִים и сопоставление с «Яхве, нашим Богом» указывают здесь на богов народов; перевод сохраняет риторическое сравнение, не утверждая тем самым их реального существования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Риторический вопрос передан естественной конструкцией «есть ли…». Местоимение, относящееся к Богу, написано со строчной буквы согласно нейтральной современной издательской практике.
