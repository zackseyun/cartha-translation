    rationale: Фраза «у которого боги были бы так близки» может подразумевать связь с народом, но не выражает прямо, что боги «близки к нему». В еврейском это обозначено местоимением אֵלָיו. Добавление «к нему» сохраняет параллелизм с «близок к нам».
