  terminology: «Яхве, наш Бог» верно передаёт יהוה אֱלֹהֵינוּ; «боги» оправдано множественным числом קְרֹבִים и контрастом с Богом Израиля. Строчная буква в местоимении соответствует заявленной нейтральной редакционной практике.
