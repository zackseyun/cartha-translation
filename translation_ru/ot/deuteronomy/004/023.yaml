  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: ru
  text: Берегитесь, чтобы не забыть завет Яхве, вашего Бога, который он заключил с вами, и не сделать себе изваяние — изображение чего бы то ни было, которое Яхве, ваш Бог, повелел вам не делать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которое Яхве, твой Бог, повелел тебе». Отрицание подразумевается из контекста; ср. Второзаконие 4:16.'
    reason: В еврейском тексте в заключительной части нет явного слова «не»; сноска сохраняет формальную особенность и объясняет контекстуальное восполнение.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Берегитесь
  rationale: Возвратный императив-предостережение естественно передаётся современным русским «берегитесь», сохраняя смысл бдительности по отношению к самим себе.
- source_word: פֶּן תִּשְׁכְּחוּ
  choice: чтобы вам не забыть
  rationale: פֶּן вводит нежелательную возможность; такая конструкция ясно и естественно выражает предупреждение по-русски.
- source_word: בְּרִית
  choice: завет
  rationale: «Завет» — устоявшийся русский библейский эквивалент, сохраняющий смысл обязательных отношений между Богом и Израилем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: который Он заключил с вами
  rationale: Выражение כרת ברית является идиомой со значением «заключить завет»; буквальное «разрезал» по-русски было бы непонятно.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: и не сделать себе
  rationale: «Себе» сохраняет возвратно-бенефактивное значение לָכֶם, а повтор отрицания естественно связывает второй предмет предостережения с פֶּן.
- source_word: פֶּסֶל
  choice: изваяние
  rationale: Слово обозначает изготовленное, прежде всего высеченное или вырезанное, культовое изображение; «изваяние» передаёт конкретный образ без архаизма «истукан».
- source_word: תְּמוּנַת כֹּל
  choice: изображение чего бы то ни было
  rationale: Формулировка сохраняет широкий охват כֹּל и репрезентативный смысл תְּמוּנָה.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: которое Яхве, ваш Бог, запретил вам делать
  rationale: В еврейском тексте буквально стоит «которое повелел тебе Яхве, твой Бог», без выраженного отрицания. Контекст 4:16 и синтаксис предупреждения требуют запретительного смысла; он сделан ясным в тексте и отмечен сноской.
theological_decisions:
- issue: Подразумеваемое отрицание в заключительном относительном предложении
  choice: Передать запретительный смысл словами «которое Яхве, ваш Бог, запретил вам делать» и отметить это сноской.
  alternative: 'Формально перевести: «которое повелел тебе Яхве, твой Бог», оставив отрицание подразумеваемым.'
  rationale: Масоретский текст не содержит явной отрицательной частицы, поэтому формальная неоднозначность должна быть зафиксирована. Однако непосредственный контекст, особенно Второзаконие 4:16, однозначно предостерегает от изготовления изображений; без восполнения эллипсиса русский текст ошибочно звучал бы как повеление изготовить их.
- issue: Переход от множественного числа к единственному в обращении
  choice: Сохранить естественное русское множественное «вам/ваш» во всём стихе.
  alternative: 'Передать заключительную форму буквально в единственном числе: «тебе… твой Бог».'
  rationale: Еврейский текст переходит от множественных суффиксов к единственному, обращаясь к Израилю то как к общине, то как к единому народу. В русском внезапный переход мог бы восприниматься как смена адресата; единообразное множественное число сохраняет референцию, хотя формальное колебание не воспроизводит.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. «Берегитесь», «завет» и «изваяние» сохраняют достоинство регистра без избыточной архаики. Личное имя передано как «Яхве».
