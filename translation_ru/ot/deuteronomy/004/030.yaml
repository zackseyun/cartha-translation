base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: ru
  text: Когда ты будешь в беде и всё это постигнет тебя, в последние дни[a] ты возвратишься к Яхве, твоему Богу, и будешь слушать его голос[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «в грядущие дни». Еврейское выражение может обозначать будущее время вообще и не обязательно указывает на определённую схему последних времён.
    reason: alternative_reading
  - marker: b
    text: Или «будешь повиноваться ему». Еврейский оборот, буквально означающий «слушать его голос», часто подразумевает, что услышанному следуют с послушанием.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: когда ты окажешься в беде
  rationale: Сочетание с בְּ обозначает пребывание в стеснённых, бедственных обстоятельствах. В русском придаточное с «когда» естественно передаёт временную функцию безглагольного начала фразы.
- source_word: וּמְצָאוּךָ
  choice: и всё это постигнет тебя
  rationale: Глагол מצא буквально означает «найти», но при бедствиях и событиях в роли субъекта по-русски естественно «постигнуть».
- source_word: כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: всё это
  rationale: דְּבָרִים здесь указывает на ранее названные события и бедствия, а не только на произнесённые слова. «Всё это» ясно и лаконично передаёт контекстуальный смысл.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  rationale: Сохранён узнаваемый библейский оборот и его богословская выразительность; возможное более широкое значение будущего времени пояснено в сноске.
- source_word: וְשַׁבְתָּ עַד
  choice: ты возвратишься к
  rationale: שׁוב с עַד выражает возвращение или обращение к кому-либо. «Возвратишься» сохраняет образ заветного и личного возвращения, не добавляя прямо понятия покаяния.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: Точно сохранены форма единственного числа и обращение ко второму лицу, подчёркивающее отношения завета.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: и будешь слушать его голос
  rationale: Перевод сохраняет образ слышания голоса. В данном обороте שׁמע часто подразумевает также послушание; эта смысловая возможность отмечена в сноске.
theological_decisions:
- issue: Временное выражение בְּאַחֲרִית הַיָּמִים и риск узкого эсхатологического прочтения
  choice: в последние дни
  alternative: в грядущие дни
  rationale: Основной текст сохраняет традиционный библейский оборот, но сноска не позволяет безосновательно ограничить его определённой схемой последних времён.
- issue: Заветное возвращение в וְשַׁבְתָּ עַד יְהוָה
  choice: ты возвратишься к Яхве
  alternative: ты покаешься и обратишься к Яхве
  rationale: «Возвратишься» передаёт явное значение глагола и его relational/covenantal силу, тогда как прямое добавление «покаешься» сделало бы подразумеваемый смысл отдельным утверждением.
- issue: Смысл שׁמע בְּקוֹל как слушания и послушания
  choice: будешь слушать его голос
  alternative: будешь повиноваться ему
  rationale: Выбранный вариант сохраняет еврейский слуховой образ, не исключая значения деятельного послушания, которое пояснено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено обращение к одному лицу на «ты», личное имя «Яхве» и слуховой образ «слушать голос». Местоимение «его» написано со строчной буквы согласно нейтральной современной издательской норме.
