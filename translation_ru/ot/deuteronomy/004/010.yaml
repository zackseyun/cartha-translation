  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: ru
  text: 'тот день, когда ты стоял перед Яхве, твоим Богом, у Хорива, и Яхве сказал мне: «Собери ко Мне народ, и Я дам им услышать Мои слова, чтобы они учились бояться Меня во все дни, пока живут на земле[a], и учили своих детей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на этой земле» / «в этой стране». Еврейское אֲדָמָה может обозначать землю вообще, почву или конкретную землю, где живёт народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: тот день, когда
  rationale: Сохраняет временную относительную конструкцию и связь с предшествующим призывом помнить пережитое событие.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: ты стоял перед
  rationale: Передаёт конкретную картину предстояния перед Богом без ослабления заветного контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּחֹרֵב
  choice: у Хорива
  rationale: Естественное современное русское обозначение места у горы Хорив.
- source_word: הַקְהֶל לִי אֶת־הָעָם
  choice: Собери ко Мне народ
  rationale: Передаёт каузативное повеление собрать народ и прямо сохраняет направление לִי — «ко Мне».
- source_word: וְאַשְׁמִעֵם
  choice: и Я дам им услышать
  rationale: 'Сохраняет каузативное значение формы שמע: Бог сделает так, чтобы народ услышал Его слова; оборот остаётся понятным и торжественным.'
- source_word: דְּבָרָי
  choice: Мои слова
  rationale: Сохраняет множественное число и указание на произнесённые Богом слова.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: чтобы они учились бояться Меня
  rationale: Передаёт цель и сохраняет вес слова ירא — страх, включающий благоговение и послушание, не сводя его лишь к почтению.
- source_word: כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: во все дни, пока живут
  rationale: Естественно по-русски выражает охватывающую всю жизнь продолжительность и сохраняет образ «всех дней».
- source_word: עַל־הָאֲדָמָה
  choice: на земле
  rationale: Русское «земля» сохраняет возможные значения обитаемой земли, почвы и конкретной страны, не сужая выражение преждевременно.
- source_word: וְאֶת־בְּנֵיהֶם יְלַמֵּדוּן
  choice: и учили своих детей
  rationale: «Детей» передаёт потомство в целом. Дополнение «этому» не вводится, поскольку в еврейском тексте предмет обучения явно не повторён.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное заветное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл ירא в заветном контексте
  choice: бояться Меня
  alternative: благоговеть передо Мной; почитать Меня
  rationale: «Бояться» сохраняет напряжение между страхом, благоговением и послушанием, не разрешая его в пользу одного более мягкого оттенка.
- issue: Охват בְּנֵיהֶם
  choice: своих детей
  alternative: своих сыновей
  rationale: В данном контексте речь идёт о передаче Божьих слов следующему поколению вообще, а не только лицам мужского пола.
- issue: Неназванный предмет обучения детей
  choice: и учили своих детей
  alternative: и учили этому своих детей
  rationale: Еврейский текст называет детей объектом глагола, но не повторяет, чему именно их учить. Перевод не добавляет указательное «этому» и тем самым сохраняет формальную недосказанность.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Прописные местоимения в прямой Божьей речи поддерживают принятый русский библейский регистр. Текст начинается со строчной буквы как синтаксическое продолжение предыдущего стиха; маркер сноски поставлен непосредственно при неоднозначном слове «земле».
