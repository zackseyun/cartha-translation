  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: ru
  text: Не прибавляйте к тому, что я заповедую вам, и ничего не отнимайте от этого, чтобы соблюдать заповеди Яхве[a], Бога вашего, которые я заповедую вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (тетраграмматон), имя Бога; традиционно передаётся как «Господь».
    reason: Указывает еврейскую форму божественного имени и традиционную замену титулом, согласуясь с передачей «Яхве» в основном тексте.
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: прибавляйте к
  rationale: Глагол יסף в породе хифиль с עַל означает добавление к чему-либо; русское «прибавлять к» естественно передаёт запрет дополнять данное повеление.
- source_word: הַדָּבָר
  choice: слову
  rationale: דבר допускает значения «слово», «дело», «предмет». Здесь единственное число собирательно обозначает содержание возвещаемого Моисеем повеления; «слово» сохраняет форму и речевой контекст.
- source_word: מְצַוֶּה
  choice: заповедую
  rationale: Причастие описывает совершаемое в данный момент повеление. Русское настоящее время естественно передаёт эту актуальность без тяжеловесной перифразы.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: убавляйте от него
  rationale: גרע означает уменьшать, отнимать или убавлять. Формулировка образует ясную смысловую пару с «прибавляйте к» и сохраняет местоименную отсылку к «слову».
- source_word: לִשְׁמֹר
  choice: чтобы соблюдать
  rationale: Инфинитив с ל выражает цель или результат. «Чтобы соблюдать» ясно передаёт связь между неизменностью слова и исполнением заповедей.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: В контексте завета מצות естественно и традиционно передаётся словом «заповеди», сохраняющим правовой и религиозный вес выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь»; форма «Яхве» общепринята в современной русскоязычной библеистике.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: В формуле завета с именем Яхве אֱלֹהִים имеет единственное значение; притяжательная форма передаёт суффикс второго лица множественного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. Основной текст сохраняет имя, а примечание сообщает традиционную замену титулом, не навязывая конфессионального предпочтения.
- issue: Смысл связи לִשְׁמֹר с предшествующим запретом
  choice: 'цель: «чтобы соблюдать»'
  alternative: 'простой инфинитив: «соблюдать»'
  rationale: Конструкция допускает оттенок цели или результата; «чтобы» естественно выражает эту связь, не уточняя её сверх того, что позволяет синтаксис.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Сохранены множественное обращение, собирательное единственное «слово» и симметрия «прибавлять к — убавлять от». Повтор «которые я заповедую вам» оставлен вслед за еврейским текстом.
