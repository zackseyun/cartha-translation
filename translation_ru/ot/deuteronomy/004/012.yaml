base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: ru
  text: И Яхве говорил к вам из среды огня[a]. Вы слышали голос слов[b], но никакого облика[c] не видели — только голос.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из огня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «голос слов»; возможно также: «звук речи».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «образа», «вида». Еврейское слово обозначает видимую форму или подобие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Глагол דבר обычно означает «говорить»; форма прошедшего времени естественна в повествовательном контексте.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из среды огня
  rationale: 'Сохраняет пространственный оттенок: речь исходила изнутри огня, а не просто от огня.'
- source_word: קוֹל דְּבָרִים
  choice: звучание слов
  rationale: Передаёт буквальное сочетание «голос/звук слов» и подчёркивает слышимую, членораздельную речь.
- source_word: שֹׁמְעִים
  choice: слышали
  rationale: Причастная форма в данном контексте естественно передаётся русским прошедшим временем.
- source_word: תְמוּנָה
  choice: образ
  rationale: Слово обозначает видимую форму, облик или изображение; «образ» сохраняет широту значения и связь с темой видимого представления Бога.
- source_word: אֵינְכֶם רֹאִים
  choice: никакого образа не видели
  rationale: Естественно выражает полное отсутствие зрительно воспринимаемой формы и сохраняет противопоставление слышанию.
- source_word: זוּלָתִי קוֹל
  choice: только голос
  rationale: 'זוּלָתִי вводит исключение: видимого образа не было, воспринимался лишь голос.'
theological_decisions:
- issue: Антропоморфный или изобразительный язык о явлении Бога
  choice: Сохранено противопоставление слышимой речи и отсутствия видимого образа без дальнейшего догматического пояснения.
  alternative: «Вы слышали Его голос, но не видели никакого зримого изображения».
  rationale: Стих утверждает реальность Божьей речи и одновременно отсутствие видимой формы; перевод не сводит эту напряжённость к позднейшей богословской формуле.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; повтор слова «голос» сохранён вслед за еврейским текстом.
