lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: овладели
  rationale: В контексте завоевания ירשׁ означает вступить во владение землёй, нередко вытеснив прежних жителей. «Овладели» естественно передаёт этот смысл и не создаёт ошибочного впечатления о наследовании.
- source_word: אַרְצוֹ
  choice: его землёй
  rationale: Местоименный суффикс 3-го лица мужского рода указывает на ранее названного Сихона; «земля» прямо и естественно передаёт אֶרֶץ.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: землёй Ога, царя Башана
  rationale: Сохраняется структура исходного сочетания и единообразный перевод אֶרֶץ словом «земля»; приложение отделено запятой по нормам русского языка.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: владениями двух аморейских царей
  rationale: В еврейском тексте сочетание относится к землям Сихона и Ога. Слово «владениями» добавлено для ясной русской связи приложения, не меняя референтов.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Это обычное географическое выражение со значением стороны по ту сторону Иордана относительно принятой точки отсчёта. «За Иорданом» сохраняет присущую оригиналу зависимость от перспективы повествования.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: к восходу солнца
  rationale: Буквальный образ обозначает восточное направление. Перевод сохраняет конкретную образность еврейского выражения, а значение поясняется в сноске.
