base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: ru
  text: И соблюдай Его установления и Его заповеди, которые Я заповедую тебе сегодня, чтобы хорошо было тебе и твоим детям, которые будут после тебя[a], и чтобы ты долго жил на земле, которую Яхве, твой Бог, даёт тебе на протяжении всех твоих дней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «дети» можно также перевести как «сыновья» или, шире по смыслу, «потомки».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все дни». Выражение подчёркивает, что дарование земли продолжается в течение всех дней адресата.'
    reason: ambiguity
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: И соблюдай
  rationale: Глагол שׁמר в контексте завета означает «соблюдать». Русский императив естественно передаёт побудительную силу формы, а союз «и» сохраняет связь с предшествующим рассуждением.
- source_word: חֻקָּיו
  choice: Его установления
  rationale: חֹק обозначает установленное предписание или узаконение. «Установления» сохраняет торжественный правовой оттенок и отличается от следующего слова «заповеди».
- source_word: מִצְוֺתָיו
  choice: Его заповеди
  rationale: מִצְוָה — повеление или заповедь; традиционное русское слово ясно и уместно в контексте завета.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: которые я заповедую тебе сегодня
  rationale: Причастная форма מְצַוְּךָ описывает совершаемое сейчас повеление; настоящее время хорошо передаёт ситуацию речи Моисея.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: чтобы хорошо было тебе
  rationale: Идиома ייטב לְ выражает благополучие. Выбранная формулировка естественна для литературного русского и сохраняет целевое или результативное значение придаточного.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: и твоим детям после тебя
  rationale: בָּנִים буквально может означать «сыновья», но в данном межпоколенческом контексте охватывает детей и дальнейшее потомство; эта широта отмечена в сноске.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: и чтобы ты долго жил
  rationale: Еврейское выражение буквально говорит о продлении дней. Русское «долго жил» естественно передаёт эту устойчивую семитскую идиому без изменения смысла.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: אֲדָמָה здесь обозначает даруемую Богом землю, а עַל буквально соответствует русскому «на».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является общепринятой современной русской транслитерацией.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Причастие נֹתֵן передаёт продолжающееся или актуальное действие; настоящее время в русском сохраняет непосредственность обещания.
- source_word: כָּל הַיָּמִים
  choice: на все дни
  rationale: Буквальное временное выражение сохранено, поскольку оно может указывать как на весь срок жизни адресата, так и шире на постоянное владение дарованной землёй; двусмысленность не сведена без пояснения к одному варианту.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон, личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Характер обещанного долголетия
  choice: чтобы ты долго жил на земле
  alternative: чтобы ты навеки владел землёй
  rationale: Фраза תַּאֲרִיךְ יָמִים прежде всего говорит о продолжительности дней адресата. Перевод не превращает её в безусловное обещание вечного владения и сохраняет связь благополучия с соблюдением заповедей.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы только в притяжательной позиции «Его» по принятой русской религиозной норме; обращение к одному адресату сохранено в единственном числе. Синтаксис остаётся близким к последовательности еврейского текста, но идиома о продлении дней передана естественным русским выражением.
