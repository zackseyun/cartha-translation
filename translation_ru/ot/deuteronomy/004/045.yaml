base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: ru
  text: Вот свидетельства, установления и законы, которые Моисей изложил израильтянам, когда они вышли из Египта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественно вводит в русском языке последующий перечень и передаёт указательное значение еврейского местоимения в безглагольном предложении.
- source_word: הָעֵדֹת
  choice: свидетельства
  rationale: Сохраняет основное лексическое значение и возможный оттенок заветных свидетельств, не сводя термин к более узкому понятию указов.
- source_word: הַחֻקִּים
  choice: установления
  rationale: Передаёт предписанный, установленный характер חֻקִּים и позволяет отличить этот термин от следующей правовой категории.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: В данном перечне обозначает правовые нормы и решения; «законы» понятно современному читателю и не создаёт ошибочного впечатления, будто речь идёт лишь о судебных приговорах.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: которые Моисей изложил
  rationale: Глагол דבר буквально относится к речи; в контексте передачи свода предписаний «изложил» естественно выражает устное сообщение, не добавляя идеи письменной фиксации.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтянам
  rationale: Это современный и точный русский этноним для идиомы «сыны Израиля», относящейся ко всему народу, а не только к мужчинам.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: когда они вышли из Египта
  rationale: Передаёт временное значение предлога בְּ с инфинитивом и сохраняет образ выхода из Египта без замены его более широким «после исхода».
