base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: ru
  text: И поскольку Он любил твоих отцов и избрал их потомство после них[a], Он вывел тебя из Египта Своим присутствием[b] и Своей великой силой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его потомство после него». В еврейском тексте стоят местоименные суффиксы единственного числа; вероятно, слово «отцы» понимается собирательно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Своим лицом»; возможен также перевод «перед Ним». Здесь выражение, вероятно, указывает на личное присутствие Бога при избавлении Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: И поскольку
  rationale: Оборот вводит основание сказанного ранее. «И поскольку» естественно передаёт причинное значение и связь с контекстом.
- source_word: אָהַב
  choice: любил
  rationale: Прямое соответствие глаголу со значением любви; не добавляет отсутствующего в форме оттенка «возложил любовь».
- source_word: אֲבֹתֶיךָ
  choice: твоих отцов
  rationale: Сохраняет мужской род и множественное число еврейского выражения, а также его заветно-родовой смысл.
- source_word: וַיִּבְחַר
  choice: избрал
  rationale: «Избрал» естественно для контекста Божьего выбора и не требует более поздней богословской терминологии.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: после них их потомство
  rationale: Еврейские местоименные суффиксы стоят в единственном числе, однако относятся к собирательно понимаемым «отцам». Русское множественное число ясно передаёт смысл контекста, а «потомство» сохраняет собирательность זרע.
- source_word: וַיּוֹצִאֲךָ
  choice: вывел тебя
  rationale: Порода hифиль глагола יצא означает побуждение к выходу; «вывел» является обычной и точной формулировкой исхода.
- source_word: בְּפָנָיו
  choice: Он Сам
  rationale: Буквально выражение связано с «лицом» Бога, а в данном контексте подчёркивает Его личное присутствие и непосредственное действие. «Он Сам» естественно передаёт этот смысл по-русски; буквальная форма указана в сноске.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: Своей великой силой
  rationale: Передаёт инструментальное значение предлога и прямой смысл существительного כח.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: С глаголом «вывел» русский предложный оборот естественно выражает движение наружу.
theological_decisions:
- issue: Собирательное значение единственного числа в выражении «его потомство после него»
  choice: после них их потомство
  alternative: после него его потомство
  rationale: Формально суффиксы единственного числа могут отражать собирательное понимание предшествующего слова «отцы». Множественное число в основном тексте не создаёт впечатления, будто речь идёт только об одном праотце; форма оригинала сохранена в сноске.
- issue: Значение בְּפָנָיו
  choice: Он Сам
  alternative: пред Его лицом; Его присутствием
  rationale: Оборот буквально упоминает Божье «лицо», но здесь, вероятно, указывает на Его собственное присутствие при избавлении. «Он Сам» ясно передаёт непосредственное Божье действие, а сноска сохраняет буквальный образ и возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но причинная связь, собирательное «потомство» и акцент на непосредственном Божьем действии сохранены.
