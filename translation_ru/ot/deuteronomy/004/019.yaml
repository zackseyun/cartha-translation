  terminology: «Яхве», «твой Бог», «небесное воинство», «поклонился» и «служить» уместны. «Уделил» допустимо для חלק, но конструкция «которые ... уделил» избегает неясной анафоры «Их». Сноска верно не выводит из глагола חלק одобрение поклонения.
