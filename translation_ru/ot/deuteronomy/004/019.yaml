revisions:
- from: Берегись, чтобы, подняв глаза к небу и увидев солнце, луну и звёзды — всё небесное воинство, — ты не увлёкся, не поклонился им и не стал служить им. Их Яхве, твой Бог, уделил[a] всем народам под всеми небесами[b].
  to: Берегись, чтобы, подняв глаза к небу и увидев солнце, луну и звёзды — всё небесное воинство, — ты не увлёкся, не поклонился им и не стал служить им. Это небесное воинство Яхве, твой Бог, уделил[a] всем народам под всем небом[b].
  rationale: 'Заменены неясное местоимение «Их» на ясное обозначение референта и неидиоматичное «под всеми небесами» на «под всем небом». Сноска сохраняет буквальную форму еврейского выражения. Богословская неоднозначность глагола חלק сохранена: перевод не представляет уделение небесных светил как одобрение поклонения им.'
  reviewer_model: gpt-5.6-terra
