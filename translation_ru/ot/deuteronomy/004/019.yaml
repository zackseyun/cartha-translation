  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: ru
  text: Берегись, чтобы, подняв глаза к небу и увидев солнце, луну и звёзды — всё небесное воинство, — ты не увлёкся, не поклонился им и не стал служить им. Это небесное воинство Яхве, твой Бог, уделил[a] всем народам под всем небом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распределил», «назначил». Еврейский текст говорит, что Яхве уделил это небесное воинство всем народам, но сам по себе не утверждает, что Он одобрил поклонение ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «под всеми небесами». Еврейская формула означает «под всем небом», то есть повсюду на земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: Берегись, чтобы ... не
  rationale: Конструкция вводит предостережение о возможном опасном исходе; русская отрицательная конструкция естественно передаёт её увещевательную силу.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: подняв глаза к небу
  rationale: Сохранён образ направленного вверх взгляда; деепричастная форма естественно связывает его с последующим «увидев».
- source_word: הַשֶּׁמֶשׁ ... הַיָּרֵחַ ... הַכּוֹכָבִים
  choice: солнце, луну и звёзды
  rationale: Прямое и естественное обозначение перечисленных небесных светил.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: всё небесное воинство
  rationale: «Воинство» сохраняет значение צָבָא и в данном перечислении обозначает совокупность небесных светил, не сужая выражение до ангельских существ.
- source_word: וְנִדַּחְתָּ
  choice: ты не увлёкся
  rationale: Форма нифаль обозначает, что человек оказывается уведённым в сторону; «увлёкся» передаёт соблазняющее отклонение без оттенка физического принуждения.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: не поклонился им
  rationale: Сохранено конкретное действие поклонения; вместе с последующим «служить» оно ясно выражает идолопоклонство.
- source_word: וַעֲבַדְתָּם
  choice: не стал служить им
  rationale: В культовом контексте עבד означает религиозное служение; перевод сохраняет лексическое различие между поклоном и служением.
- source_word: אֲשֶׁר חָלַק
  choice: Их ... уделил
  rationale: Глагол חלק означает разделить, распределить, уделить. «Уделил» сохраняет смысл распределения и не добавляет утверждения, будто Бог одобрил поклонение светилам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: לְכֹל הָעַמִּים
  choice: всем народам
  rationale: Точно и естественно передаёт множественное עַמִּים как совокупность народов.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: под всеми небесами
  rationale: Формально сохраняет множественное число и масштаб исходной еврейской формулы; идиоматический вариант пояснён в сноске.
theological_decisions:
- issue: Смысл слов о том, что Яхве уделил небесные светила всем народам
  choice: Сохранить формулировку о распределении светил, не утверждая, что Бог тем самым разрешил поклоняться им.
  alternative: Истолковать фразу либо как назначение светил для общего человеческого употребления, либо как предание народов поклонению светилам.
  rationale: חלק допускает значения распределения и уделения, однако сама фраза не уточняет характер этого уделения. Контекст запрещает идолопоклонство, поэтому перевод сохраняет богословское напряжение и не вносит отсутствующего в тексте объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Синтаксис упрощён посредством деепричастных оборотов, но последовательность взгляда, видения, увлечения, поклона и служения сохранена. «Небесное воинство» оставлено как понятный традиционный образ и непосредственно поясняется перечислением светил.
