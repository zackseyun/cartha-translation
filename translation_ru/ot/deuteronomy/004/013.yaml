base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: ru
  text: И Он объявил вам Свой завет, который повелел вам исполнять, — Десять слов[a], — и написал их на двух каменных скрижалях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Десять заповедей».'
    reason: 'Традиционный перевод выражения עֲשֶׂרֶת הַדְּבָרִים; основной текст уже передаёт его буквально: «Десять слов».'
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: объявил
  rationale: Глагол נגד в породе хифиль означает «сообщить, объявить, сделать известным». «Объявил» сохраняет торжественный, заветный тон и естественно звучит по-русски.
- source_word: בְּרִיתוֹ
  choice: Свой завет
  rationale: «Завет» — точный и укоренившийся русский эквивалент בְּרִית, передающий обязательный и отношенческий характер установления. Возвратное «Свой» естественно соотносит завет с подлежащим.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: который повелел вам исполнять
  rationale: Буквальное «делать» применительно к завету по-русски неестественно; «исполнять» точно передаёт требование осуществлять предписанное, не сводя его лишь к хранению или соблюдению обряда.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Десять слов
  rationale: Это прямое соответствие еврейскому выражению «десять слов». Оно сохраняет собственное обозначение текста, тогда как традиционное «Десять заповедей» дано в примечании.
- source_word: וַיִּכְתְּבֵם
  choice: и написал их
  rationale: כתב — обычный глагол «писать». Контекст каменных скрижалей допускает «начертал», но источник не требует более специального глагола.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: на двух каменных скрижалях
  rationale: «Каменные скрижали» — ясное, точное и литературно укоренившееся обозначение двух плит из камня; предложный падеж обусловлен русским управлением глагола «написал».
theological_decisions:
- issue: Передача עֲשֶׂרֶת הַדְּבָרִים
  choice: Десять слов
  alternative: Десять заповедей
  rationale: Основной текст сохраняет буквальное наименование заветных установлений в еврейском оригинале. Знакомое традиционное обозначение не отвергается, но приводится в сноске, чтобы не подменять формулировку источника.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Богу, даны с прописной буквы. Парные тире ясно оформляют приложение «Десять слов» и сохраняют синтаксическую связь с «заветом».
