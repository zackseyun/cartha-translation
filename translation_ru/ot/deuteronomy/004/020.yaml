base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: ru
  text: Но Яхве взял вас и вывел из железоплавильной печи — из Египта, чтобы вы стали для Него народом — Его наследием, как и поныне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из печи для железа». Египет образно представлен как место тяжёлого угнетения, подобное печи, в которой плавят металл.'
    reason: Пояснение метафоры и буквального устройства еврейского выражения.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его заветный характер и не заменяя титулом.
- source_word: לָקַח
  choice: взял
  rationale: Сохраняет прямое значение глагола; в контексте подразумевается, что Яхве избрал Израиль и сделал его Своим, но это не вносится в перевод как пояснение.
- source_word: וַיּוֹצִא
  choice: вывел
  rationale: Естественно передаёт каузативную форму глагола יצא в контексте исхода.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: из железоплавильной печи
  rationale: Сохраняет образ כור как плавильной печи и связь с железом; выражение метафорически характеризует египетское угнетение.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: В русском языке естественно сначала назвать Египет, а затем пояснить его образом железоплавильной печи; повтор исходного предлога מִ передан обоими оборотами с «из».
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: чтобы вы стали Его народом, Его наследием
  rationale: Передаёт לו через «Его», а נַחֲלָה — через «наследие», сохраняя конкретную заветную лексику принадлежности и избегая неестественного русского «народом наследия».
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть сегодня
  rationale: Естественно передаёт указание на нынешнее, наблюдаемое положение Израиля.
theological_decisions:
- issue: Заветная принадлежность в לְעַם נַחֲלָה
  choice: Его народом, Его наследием
  alternative: Его собственным народом; народом, принадлежащим Ему
  rationale: Выбранный вариант сохраняет многозначный образ «наследия» и одновременно ясно выражает принадлежность народа Яхве, не сводя фразу к общему обозначению собственности.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской религиозной издательской традиции.
