  rationale: Перестроен порядок образа и его пояснения в соответствии с еврейским текстом; уточнена синтаксическая связь «народ — Его наследие»; заключительная временная формула передана естественным литературным оборотом. Сноска сохранена с исходным маркером и содержанием, поскольку она верно поясняет метафору.
