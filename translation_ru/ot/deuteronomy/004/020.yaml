    issue: Связь «народом, Его наследием» недостаточно ясна
    rationale: Запятая создаёт два равноправных именных дополнения и ослабляет смысл «народа как наследия/достояния Бога», выраженный לְעַם נַחֲלָה. Тире яснее маркирует пояснительное приложение без изменения образа.
  - severity: low
