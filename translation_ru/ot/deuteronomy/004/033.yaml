  text: Слышал ли какой-либо народ голос Бога, говорящего из огня, как слышал ты, — и остался жив?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и жил». В контексте речь о том, что народ не погиб, услышав голос Бога из огня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: Слышал ли
  rationale: Вопросительная частица с перфектом вводит риторический вопрос об известном опыте; русская форма прошедшего времени с «ли» передаёт это естественно.
- source_word: עָם
  choice: какой-нибудь народ
  rationale: עָם обозначает народ как общность; неопределённое «какой-нибудь» естественно выражает смысл риторического вопроса.
- source_word: קוֹל אֱלֹהִים מְדַבֵּר
  choice: голос Бога, говорящего
  rationale: קוֹל здесь означает слышимый, осмысленный голос, а не просто звук. Единственное число причастия согласуется с пониманием אֱלֹהִים как «Бог»; оборот передаёт Бога как говорящего, не добавляя содержания Его речи.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: из среды огня
  rationale: Сохраняется пространственный образ речи, исходящей изнутри огня; выражение возвышенное, но понятное современному читателю.
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: как слышал ты
  rationale: Сравнительное כַּאֲשֶׁר передано словом «как», а постановка местоимения после глагола сохраняет подчёркивание אַתָּה — именно Израиль пережил это.
- source_word: וַ/יֶּחִי
  choice: и остался жив
  rationale: Буквальное значение — «и жил», но в данном вопросе речь о том, что народ не погиб после встречи с Божьим голосом. «Остался жив» ясно выражает контекстуальный смысл без усилительного «всё же».
theological_decisions:
- issue: Значение אֱלֹהִים при непосредственном Божьем откровении
  choice: Бог
  alternative: бог; боги
  rationale: Единственное число причастия и контекст заветного откровения на Хориве указывают на единственного Бога, говорившего Израилю.
- issue: Следует ли усиливать подразумеваемое противопоставление между слышанием Бога и сохранением жизни
  choice: и остался жив
  alternative: и всё же остался жив; и уцелел
  rationale: Союз в еврейском тексте лишь соединяет части высказывания. Выбранная формулировка передаёт сохранение жизни, но не добавляет отсутствующего в оригинале явного усиления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторический строй оригинала сохранён; инверсия «слышал ты» передаёт смысловое ударение на местоимении.
