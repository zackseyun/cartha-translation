  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: ru
  text: Или пытался ли когда-нибудь какой-нибудь бог пойти и взять себе народ из среды другого народа — испытаниями, знамениями, чудесами, войной, могучей рукой, простёртой рукой и великими устрашающими деяниями[a], — подобно всему тому, что Яхве, ваш Бог, сделал для вас в Египте у вас на глазах?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великими, внушающими трепет делами» либо «великими грозными деяниями». Еврейское выражение обозначает действия, вызывающие страх и благоговейный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: пытался ли когда-нибудь
  rationale: В данном контексте נסה означает «пытаться, предпринимать». Такая передача поддерживает риторический вопрос о беспримерности события и не вводит неуместный смысл «испытывать».
- source_word: אֱלֹהִים
  choice: какой-нибудь бог
  rationale: Неопределённое употребление в сравнительном риторическом вопросе указывает на любое божество; строчная буква сохраняет полемический контраст с Яхве.
- source_word: לָבוֹא לָקַחַת
  choice: прийти и взять
  rationale: Сохраняется последовательность инфинитивов движения и целевого действия. Русское «прийти и взять» естественно и не требует искусственно менять исходную пространственную перспективу.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: народ из среды другого народа
  rationale: Передаёт намеренное повторение גוי и образ извлечения одного народа изнутри другого.
- source_word: בְּמַסֹּת
  choice: испытаниями
  rationale: Обозначает испытующие события и суды, связанные с исходом; инструментальный творительный передаёт повторяющийся предлог בְּ.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: знамениями, чудесами
  rationale: Естественная русская библейская пара, различающая знаковую функцию אותות и необычайный характер מופתים.
- source_word: וּבְמִלְחָמָה
  choice: войной
  rationale: Сохраняет единственное число и военную сторону избавления от Египта.
- source_word: וּבְיָד חֲזָקָה
  choice: могучей рукой
  rationale: Естественно передаёт устойчивый образ проявления Божьей силы при исходе.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: простёртой рукой
  rationale: Сохраняет телесный образ исходного выражения; в русском повтор «рукой» вместо буквального «мышцей» звучит ясно и достойно.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: великими устрашающими деяниями
  rationale: Передаёт не только вызванный страх, но и сами внушающие страх и трепет действия. Лексическая неоднозначность отмечена в сноске.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: подобно всему тому, что ... сделал
  rationale: Сохраняет сравнительную связь и всеохватность כֹל, естественно связывая общий вопрос с событиями в Египте.
- source_word: לְעֵינֶיךָ
  choice: у вас на глазах
  rationale: Современный русский эквивалент идиомы «перед твоими глазами»; единственное число в еврейском обращено к Израилю как коллективному адресату, тогда как русский контекст естественно требует множественного обращения.
theological_decisions:
- issue: Значение אֱלֹהִים в риторическом сравнении
  choice: какой-нибудь бог
  alternative: Бог
  rationale: Речь идёт о любом божестве в сопоставлении с уникальными действиями Яхве. Эта передача сохраняет полемическую силу и не отождествляет субъект первой части с Яхве.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога и отличает его от титула.
- issue: Образ זְרֹעַ נְטוּיָה
  choice: простёртая рука
  alternative: простёртая мышца
  rationale: Исходный образ силы сохраняется без анатомически неестественного для современного русского выражения; богословский смысл действенной Божьей мощи не конкретизируется сверх текста.
translation_notes:
  register: Современный литературный русский с достоинством риторической речи. Цепочка инструментальных форм сохранена, но союз «и» не повторяется перед каждым элементом, чтобы перечисление звучало естественно. Коллективное обращение к Израилю передано формами множественного числа.
