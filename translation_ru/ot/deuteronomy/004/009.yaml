  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: ru
  text: Только берегись и весьма тщательно оберегай себя, чтобы не забыть того, что видели твои глаза, и чтобы это не ушло из твоего сердца во все дни твоей жизни. Расскажи о них своим детям и детям своих детей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своим сыновьям и сыновьям своих сыновей». Древнееврейские слова мужского рода в этом контексте могут обозначать детей или потомков в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничительно-усилительное значение частицы без добавления отсутствующего в тексте противительного союза.
- source_word: הִשָּׁמֶר לְךָ
  choice: берегись
  rationale: Естественно передаёт идиому с возвратным значением и настоятельный призыв к бдительности.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: и особенно тщательно следи за собой
  rationale: נֶפֶשׁ здесь обозначает самого человека, а не отдельно мыслимую нематериальную душу; наречное сочетание сохраняет сильное усиление מְאֹד и повтор корня שׁמר.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: того, что видели твои глаза
  rationale: Контекст непосредственного зрительного опыта уточняет широкое значение דְּבָרִים; сохранён еврейский акцент на свидетельстве собственных глаз.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: и чтобы это не ушло из твоего сердца
  rationale: Сохраняет метафору удаления из сердца и не сужает לֵבָב до одного лишь разума или памяти.
- source_word: וְהוֹדַעְתָּם
  choice: Расскажи об этом
  rationale: Естественно по-русски передаёт каузатив ידע — сделать известным, сообщить; местоименное единственное «об этом» собирательно отсылает ко всему увиденному.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: своим детям и детям своих детей
  rationale: В данном межпоколенческом контексте בנים может обозначать потомство в целом; конструкция при этом сохраняет форму исходной цепочки поколений.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: «за собой»
  alternative: «свою душу»
  rationale: Здесь слово указывает на всего человека и его личную бдительность. Буквальное «душу» могло бы внести более узкое представление о составе человека, которого данный контекст не требует.
- issue: Значение לֵבָב
  choice: сохранено «сердце»
  alternative: «память» или «разум»
  rationale: В древнееврейском употреблении сердце охватывает внутреннюю жизнь, включая память, понимание и волю; замена одним из этих понятий неоправданно сняла бы смысловую широту.
- issue: Родовая отнесённость בָנֶיךָ
  choice: «детям»
  alternative: «сыновьям»
  rationale: Заповедь о передаче памяти следующим поколениям не ограничена в контексте исключительно потомками мужского пола; более широкое русское слово передаёт вероятный референциальный охват.
translation_notes:
  register: Современный литературный русский язык с достойной, увещательной интонацией. Повтор призыва к бдительности сохранён без тяжеловесного буквального «храни свою душу». Метафора сердца оставлена в основном тексте. Конечная точка выбрана как самостоятельная русская пунктуация, хотя дальнейший контекст тесно продолжает мысль.
