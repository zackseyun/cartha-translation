revisions:
- from: И там вы будете служить богам — творениям человеческих рук, сделанным из дерева и камня, которые не могут ни видеть, ни слышать, ни есть, ни обонять.[a]
  to: И там вы будете служить богам — изделиям человеческих рук, из дерева и камня, которые не могут ни видеть, ни слышать, ни есть, ни обонять.[a]
  rationale: Исправлена только неточная и стилистически перегруженная передача מַעֲשֵׂה יְדֵי אָדָם עֵץ וָאֶבֶן. Новая формулировка сохраняет приложение к «богам», человеческое происхождение и указание на материалы, не добавляя нового смысла. Сноска остаётся привязанной к выражению «не могут» и точно отражает формальную альтернативу исходника.
