review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: будущее служение, множественное «богам», человеческое изготовление, дерево и камень и четыре отрицательные способности сохранены. Однако «творениям человеческих рук, сделанным из дерева и камня» семантически и синтаксически тяжеловесно: «творения» может означать сотворённых существ, а причастие «сделанным» избыточно повторяет идею изготовления. «Не могут» — допустимое эксплицирующее выражение подразумеваемой в контексте неспособности; буквальная альтернатива корректно вынесена в примечание.'
  naturalness: После замены на «изделиям человеческих рук, из дерева и камня» фраза будет естественнее для современного литературного русского и сохранит сжатый, параллельный строй исходного текста. «Обонять» здесь уместно и не архаично.
  terminology: «Богам» точно сохраняет אֱלֹהִים и не подменяет его интерпретирующим «идолам». «Человеческих рук» адекватно передаёт обобщённое אָדָם. «Изделия» точнее, чем «творения», для מַעֲשֵׂה в данном полемическом описании рукотворных объектов.
  issues:
  - severity: medium
    issue: «Творениям человеческих рук» и «сделанным из дерева и камня»
    rationale: «Творения» в русском неоднозначно и может ассоциироваться с живыми существами или результатом творения вообще; последующее «сделанным» повторяет уже выраженную рукотворность. «Изделиям человеческих рук, из дерева и камня» точнее отражает «дело рук человека, дерево и камень» и звучит компактнее.
  revised_text: И там вы будете служить богам — изделиям человеческих рук, из дерева и камня, которые не могут ни видеть, ни слышать, ни есть, ни обонять.[a]
