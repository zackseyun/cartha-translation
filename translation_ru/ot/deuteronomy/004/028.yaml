  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: ru
  text: И там вы будете служить богам — изделиям человеческих рук, из дерева и камня, которые не могут ни видеть, ни слышать, ни есть, ни обонять.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые не видят, не слышат, не едят и не обоняют».'
    reason: Сохраняется более буквальная возможность передать повторяющиеся еврейские отрицания без явного выражения неспособности.
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: вы будете служить
  rationale: Глагол עבד означает служение, в данном контексте — также поклонение; форма в последовательности пророческого предупреждения естественно передаётся будущим временем.
- source_word: שָׁם
  choice: там
  rationale: Наречие указывает на земли народов, среди которых Израиль будет рассеян согласно ближайшему контексту.
- source_word: אֱלֹהִים
  choice: богам
  rationale: Сохранено прямое лексическое значение во множественном числе; перевод «идолам» заранее истолковал бы слово, тогда как рукотворность этих богов раскрывается далее.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: творениям человеческих рук
  rationale: Передаёт рукотворность названных богов и обобщённое значение אָדָם; множественное число обеспечивает ясную и естественную связь с «богам».
- source_word: עֵץ וָאֶבֶן
  choice: сделанным из дерева и камня
  rationale: В контексте слова обозначают материалы идолов. Добавление «сделанным из» естественно выражает смысл приложения в русском языке.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: которые не могут ни видеть, ни слышать, ни есть, ни обонять
  rationale: Оборот «не могут» ясно передаёт полемическое указание на неспособность рукотворных богов, а повторяющееся «ни» сохраняет ритм перечня отрицаний.
- source_word: יְרִיחֻן
  choice: обонять
  rationale: 'Глагол означает воспринимать запах; «обонять» точно и стилистически согласуется с рядом способностей: видеть, слышать, есть.'
theological_decisions:
- issue: Значение אֱלֹהִים применительно к рукотворным объектам поклонения
  choice: богам
  alternative: идолам
  rationale: Перевод «богам» сохраняет формулировку и напряжение исходного текста, а последующее описание недвусмысленно показывает их рукотворность и бессилие.
- issue: Обобщённое значение אָדָם
  choice: человеческих рук
  alternative: рук человека
  rationale: Прилагательное «человеческих» естественно передаёт родовое, а не исключительно мужское значение и подчёркивает противопоставление рукотворного истинно божественному.
- issue: Отрицание способностей рукотворных богов
  choice: не могут ни видеть, ни слышать, ни есть, ни обонять
  alternative: не видят, не слышат, не едят и не обоняют
  rationale: Основной перевод раскрывает подразумеваемую неспособность, не меняя предмет утверждения; более буквальная передача простых отрицаний приведена в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Обонять» выбрано вместо разговорного «чувствовать запах», чтобы сохранить компактный параллельный ряд. Тире ясно вводит пояснение о природе названных богов.
