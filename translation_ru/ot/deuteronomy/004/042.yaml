  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: ru
  text: чтобы тот, кто неумышленно[a] лишил жизни ближнего и прежде не питал к нему ненависти[b], мог бежать туда, в один из этих городов, и остаться в живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «без знания»; в этом правовом контексте имеется в виду неумышленное причинение смерти.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «со вчера и третьего дня»; это идиома со значением «прежде», «ранее».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: чтобы туда мог бежать
  rationale: Инфинитив с ל выражает цель учреждения городов, названных в предыдущем стихе; русская целевая конструкция естественно передаёт эту связь.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: тот, кто ... убил
  rationale: В контексте городов-убежищ речь идёт о человеке, причинившем смерть, но не обязательно о виновном убийце; поэтому «убийца» могло бы ошибочно подразумевать умысел.
- source_word: רֵעֵהוּ
  choice: ближнего
  rationale: «Ближний» сохраняет обычное библейско-правовое значение רֵעַ и остаётся понятным в современном русском языке.
- source_word: בִּבְלִי דַעַת
  choice: нечаянно ... не сознавая этого
  rationale: Буквально оборот означает «без знания»; в данном правовом контексте он указывает на неосознанность и отсутствие умысла. Формулировка сохраняет как контекстуальный смысл, так и образ знания.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: не питал к нему ненависти
  rationale: Причастие שֹׂנֵא обозначает устойчивое враждебное отношение; русский оборот естественно передаёт продолжительное состояние.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: прежде
  rationale: Это идиома, буквально отсылающая ко «вчера и третьему дню», но означающая прежнее время; «прежде» кратко и естественно передаёт её смысл.
- source_word: וְנָס אֶל אַחַת מִן הֶעָרִים הָאֵל וָחָי
  choice: Убежав в один из этих городов, он останется жив
  rationale: Передаёт разрешённое бегство и его правовой результат. Разделение на два предложения устраняет тяжеловесность длинной русской конструкции, не меняя логической связи.
