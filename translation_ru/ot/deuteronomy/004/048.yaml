  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: ru
  text: от Ароэра, расположенного на краю долины Арнона[a], до горы Сион, то есть Ермона[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у русла Арнона» либо «на краю ущелья Арнона». Еврейское נַחַל часто обозначает русло сезонного потока, овраг или ущелье, а не обязательно постоянную реку.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте — «Сион»; здесь это название прямо отождествляется с Ермоном. Ср. Второзаконие 3:9, где сказано, что сидоняне называли Ермон Сирионом.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: от Ароэра
  rationale: Предлог מִן обозначает начальную точку территориального диапазона; топоним передан принятой русской транслитерацией.
- source_word: אֲשֶׁר עַל שְׂפַת
  choice: расположенного на краю
  rationale: Относительное предложение относится к Ароэру; שָׂפָה буквально означает «край, кромка». Такая передача естественна и не предполагает наличия постоянного водного потока.
- source_word: נַחַל אַרְנֹן
  choice: долины Арнона
  rationale: נַחַל может обозначать русло, ущелье или долину сезонного потока, а не обязательно постоянную реку; «долина Арнона» ясно передаёт топографический смысл.
- source_word: וְ/עַד
  choice: до
  rationale: Обозначает конечную точку территориального диапазона.
- source_word: הַר שִׂיאֹן
  choice: горы Сион
  rationale: В данном месте еврейский топоним שִׂיאֹן передан как «Сион»; его не следует смешивать с более известным названием צִיּוֹן — «Сион» (Zion), хотя в русской передаче они совпадают.
- source_word: הוּא חֶרְמוֹן
  choice: то есть Ермона
  rationale: 'Местоимение הוּא имеет пояснительно-отождествляющую функцию: гора Сион прямо отождествляется с Ермоном.'
