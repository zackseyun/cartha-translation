  source_fidelity: 'Содержание передано точно: Моисей сообщает, что преподал установления и законы в соответствии с повелением Яхве, чтобы народ поступал так в земле, в которую входит для овладения ею. Целевая конструкция, указательное «так», выражение «в земле» и цель овладения землёй сохранены. Однако русское «Смотри» при последующем «вас/вы» создаёт неестественное переключение на обращение к одному человеку; еврейская форма единственного числа здесь функционирует как вводный призыв обратить внимание и может быть естественно передана словом «Вот» с примечанием о форме оригинала.'
