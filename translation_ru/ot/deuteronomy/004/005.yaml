  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: ru
  text: Вот[a], я научил вас установлениям и законам[b], как повелел мне Яхве, мой Бог, чтобы вы поступали так в земле[c], в которую вы вступаете, чтобы овладеть ею[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «смотри»; форма единственного числа служит призывом обратить внимание, хотя далее народ назван во множественном числе.'
    reason: grammatical_clarification
  - marker: b
    text: 'Возможный перевод: «предписаниям и судебным постановлениям».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «посреди земли» или «внутри земли».'
    reason: lexical_alternative
  - marker: d
    text: Еврейский глагол может также означать «вступить во владение ею» или, в контексте обещанной земли, «получить её в наследие».
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Смотри
  rationale: Императив единственного числа обращён к Израилю как к единому народу и служит призывом обратить внимание. «Смотри» сохраняет это число и непосредственность без архаического оттенка слова «вот».
- source_word: לִמַּדְתִּי
  choice: я научил вас
  rationale: Перфект обозначает уже совершённое Моисеем наставление, сохраняющее силу в настоящем контексте.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: установлениям и законам
  rationale: «Установления» передаёт предписанный характер חֻקִּים, а «законы» естественно выражает юридический смысл מִשְׁפָּטִים в современном русском языке.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз указывает на соответствие наставления Моисея повелению Бога; русское «как» передаёт это естественно и без лишнего усиления.
- source_word: יְהוָה אֱלֹהָי
  choice: Яхве, мой Бог
  rationale: Личное имя יהוה передано как «Яхве», а אֱלֹהָי — как приложение «мой Бог», с естественной русской пунктуацией.
- source_word: לַעֲשׂוֹת כֵּן
  choice: чтобы вы поступали так
  rationale: Инфинитив выражает цель данного наставления; כֵּן отсылает к преподанным установлениям и законам. Формулировка сохраняет эту отсылку и ясна по-русски.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: в земле
  rationale: Буквально выражение означает «посреди/внутри земли», но здесь идиоматически указывает на пребывание и действие в её пределах. Буквальная форма сохранена в примечании.
- source_word: בָּאִים שָׁמָּה
  choice: в которую вступаете
  rationale: Причастие выражает предстоящее вступление, а направительное שָׁמָּה естественно включено в русскую конструкцию «в которую»; отдельное «туда» было бы избыточно.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: ירשׁ в контексте земли обозначает вступление во владение. «Овладеть ею» сохраняет целевое значение и не сводит смысл исключительно к наследованию.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Отношение человеческого наставления к Божьему повелению
  choice: «как повелел мне Яхве» сохраняет полное соответствие наставления Моисея Божьему повелению
  alternative: Можно было бы передать как более слабое «согласно тому, что повелел мне Господь»
  rationale: כַּאֲשֶׁר прямо связывает преподанное Моисеем с данным ему повелением, не утверждая ничего сверх текста о способе или объёме откровения.
- issue: Цель наставления
  choice: «чтобы вы поступали так»
  alternative: «исполнять это»
  rationale: Выбранная формулировка сохраняет целевую силу инфинитива и указательное כֵּן, не превращая его в явно выраженное местоименное дополнение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством законодательной речи Второзакония. Единственное число в «Смотри» намеренно сохранено, несмотря на последующее множественное «вас». Синтаксис сделан естественным для русского: направительное «туда» выражено относительной конструкцией «в которую», а буквальное «посреди земли» вынесено в примечание.'
