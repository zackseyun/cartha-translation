  terminology: «Яхве», «резное изображение» и «зло в глазах Яхве, твоего Бога» удачно передают ключевые термины. «Дети и внуки» допустимо передаёт родовой смысл בָּנִים וּבְנֵי בָנִים; сноска корректно отмечает буквальные мужские формы. Сноски b и c содержательно соответствуют своим якорям.
