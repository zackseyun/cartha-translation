  source_fidelity: 'Основной смысл передан верно: сохранены временно-условное «Когда», смена единственного и множественного числа адресата, длительное пребывание в земле, изготовление резного изображения, формула «зло в глазах Яхве» и причинение ему гнева. Однако «развратитесь» в современном русском преимущественно ассоциируется с распущенностью и сужает значение וְהִשְׁחַתֶּם, обозначающего порочное, губительное поведение, особенно в связи с идолопоклонством. Добавленное «себе» при «сделаете» отсутствует в еврейском тексте и не требуется русской фразой.'
