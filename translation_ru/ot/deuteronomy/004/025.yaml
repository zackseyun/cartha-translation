base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: ru
  text: Когда у тебя родятся дети и внуки[a], и вы состаритесь[b] в этой земле, и поступите нечестиво, и сделаете резное изображение в виде чего бы то ни было[c], и совершите зло в глазах Яхве, твоего Бога, вызывая его гнев, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья и сыновья сыновей». Здесь мужские обозначения, вероятно, относятся к потомкам обоих полов в нескольких поколениях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и долго проживёте в этой земле»; еврейский глагол может указывать как на состаривание, так и на долгое, укоренённое пребывание.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «подобие чего бы то ни было»; возможно также: «изображение любой формы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В контексте предостережения союз вводит временно-условную ситуацию, продолжение которой следует в следующем стихе.
- source_word: תוֹלִיד
  choice: у тебя родятся
  rationale: Каузативная форма буквально связана с рождением потомства; по-русски оборот «у тебя родятся» естественно сохраняет обращение к одному представителю народа.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: дети и внуки
  rationale: Мужские формы обозначают потомство двух поколений и в данном общем заветном предостережении не ограничивают смысл только сыновьями и внуками мужского пола.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: и вы состаритесь в этой земле
  rationale: Глагол выражает состаривание или долгое пребывание; «состаритесь» сохраняет исходный образ, а множественное число соответствует еврейской форме и коллективному адресату.
- source_word: וְהִשְׁחַתֶּם
  choice: и развратитесь
  rationale: В данном контексте форма указывает на нравственное и заветное разложение, проявляющееся в идолопоклонстве; русский глагол передаёт это без добавления объекта.
- source_word: פֶּסֶל
  choice: резное изображение
  rationale: Слово обозначает изготовленное, в частности высеченное или вырезанное, культовое изображение; это конкретнее общего слова «идол».
- source_word: תְּמוּנַת כֹּל
  choice: в виде чего бы то ни было
  rationale: Передаёт идею изображения любой формы или подобия и сохраняет всеохватность запрета.
- source_word: הָרַע בְּעֵינֵי
  choice: зло в глазах
  rationale: Сохранена прозрачная еврейская оценочная метафора, естественная и понятная в современном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לְהַכְעִיסוֹ
  choice: вызывая Его гнев
  rationale: 'Деепричастный оборот естественно передаёт причинно-целевую связь и каузативный смысл: поступки вызывают Божий гнев.'
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Родовая отнесённость выражения בָּנִים וּבְנֵי בָנִים
  choice: дети и внуки
  alternative: сыновья и сыновья сыновей
  rationale: В заветном предостережении мужские существительные обозначают потомство по поколениям в целом; при этом сноска сохраняет буквальную возможность.
- issue: Число адресата внутри стиха
  choice: у тебя … вы … твоего
  alternative: полностью унифицировать обращение по числу
  rationale: 'Сохранено напряжение исходного текста: תוליד и אלהיך имеют единственное число, тогда как последующие глаголы стоят во множественном; это отражает обращение одновременно к отдельному представителю и ко всему Израилю.'
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены коллективное «вы» и переходы между единственным и множественным числом исходного обращения. Финальное тире показывает, что условно-временная конструкция продолжается в следующем стихе.
