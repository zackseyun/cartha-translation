lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: А вы
  rationale: Союз с самостоятельным местоимением противопоставляет адресатов тем, кто погиб из-за Ваал-Фегора; «А вы» естественно передаёт этот контраст.
- source_word: הַ/דְּבֵקִים
  choice: держащиеся
  rationale: Причастие от דבק обозначает тесную привязанность и верность; форма настоящего времени сохраняет причастное описание тех, кто продолжает держаться Бога.
- source_word: בַּ/יהוָה
  choice: Господа
  rationale: Тетраграмматон передан традиционным русским библейским соответствием «Господь»; управление глагола по-русски требует родительного падежа после «держаться».
- source_word: אֱלֹהֵי/כֶם
  choice: вашего Бога
  rationale: Сохранено значимое приложение с суффиксом второго лица множественного числа, прямо называющее Господа Богом адресатов.
- source_word: חַיִּים
  choice: живы
  rationale: Краткое прилагательное естественно передаёт предикативное значение и нынешнее состояние адресатов.
- source_word: כֻּלְּ/כֶם
  choice: все
  rationale: Передаёт полноту группы оставшихся в живых без добавочного усиления.
- source_word: הַ/יּוֹם
  choice: сегодня
  rationale: Современное и точное соответствие указанию на день произнесения речи.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» сохраняет узнаваемый и достойный русский библейский регистр, не навязывая спорную реконструкцию произношения; примечание здесь не требуется, поскольку вопрос не является смысловым центром стиха.
- issue: Характер привязанности, выраженной דבק
  choice: держащиеся
  alternative: прилепившиеся
  rationale: «Держащиеся» сохраняет образ постоянной близкой привязанности и верности, не сводя его исключительно к прошлому поступку и не перегружая текст архаикой.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Контраст передан начальным «А вы», порядок слов подчёркивает «все живы сегодня», а тире облегчает восприятие длинной именной группы.
