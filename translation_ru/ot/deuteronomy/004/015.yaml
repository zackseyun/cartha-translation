base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: ru
  text: Итак, очень тщательно берегите себя[a], ведь в тот день, когда Яхве говорил с вами на Хориве из среды огня, вы не видели никакого облика[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весьма оберегайте себя ради ваших жизней»; это древнееврейский оборот, означающий необходимость проявлять крайнюю осторожность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «никакого образа»; также возможно: «никакого подобия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: Поэтому особенно тщательно берегите себя
  rationale: Сочетание выражает усиленный призыв быть настороже и оберегать самих себя. Русское «берегите себя» естественно передаёт возвратный смысл, а «особенно тщательно» — усиление מְאֹד, не превращая נֶפֶשׁ в отдельное учение о душе.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для предостережения; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: вы не видели никакого облика
  rationale: תְּמוּנָה обозначает видимую форму, облик или подобие. «Облик» подчёркивает отсутствие видимого явления, не сужая значение до рукотворного изображения.
- source_word: בְּיוֹם דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: в тот день, когда Яхве говорил с вами
  rationale: Сохраняется временное выражение «в день» в естественной русской конструкции; личное имя יהוה передано как «Яхве».
- source_word: בְּחֹרֵב
  choice: на Хориве
  rationale: Это нормативное русское обозначение места событий у горы Хорив.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из среды огня
  rationale: Передаёт пространственную конкретность מִתּוֹךְ и сохраняет торжественную, но понятную библейскую образность.
theological_decisions:
- issue: Антропологический оттенок נֶפֶשׁ в לְנַפְשֹׁתֵיכֶם
  choice: 'идиоматическое возвратное значение: «берегите себя»'
  alternative: «берегите свои души»
  rationale: В данном обороте נֶפֶשׁ относится к самим людям и усиливает призыв к осторожности; буквальное «души» могло бы необоснованно внести противопоставление души и тела.
- issue: Значение תְּמוּנָה в контексте откровения на Хориве
  choice: «облик»
  alternative: «образ» или «подобие»
  rationale: Текст утверждает отсутствие видимой формы Яхве и тем самым подготавливает последующее предостережение против изображений. «Облик» сохраняет эту связь, не отождествляя само слово исключительно с идолом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис причинной связи сохранён, а трудный древнееврейский оборот передан естественно и без лишней антропологической конкретизации.
