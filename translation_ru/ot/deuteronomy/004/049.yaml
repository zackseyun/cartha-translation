base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: ru
  text: и вся Арава за Иорданом, к востоку, вплоть до моря Аравы[a], ниже склонов Фасги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть водоём, обычно отождествляемый с Мёртвым морем.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Арава
  rationale: В данном географическом контексте слово обозначает собственное название области Иорданской рифтовой долины, поэтому передано как топоним, а не общим словом «равнина».
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Естественное русское обозначение земли по другую сторону Иордана относительно точки отсчёта говорящего.
- source_word: מִזְרָחָה
  choice: к востоку
  rationale: Сохраняет направительное значение еврейского наречия и естественно звучит в географическом перечислении.
- source_word: יָם הָעֲרָבָה
  choice: море Аравы
  rationale: Буквально передаёт еврейское географическое название, не подменяя его более поздним общепринятым названием «Мёртвое море»; современное отождествление дано в сноске.
- source_word: תַּחַת
  choice: ниже
  rationale: Передаёт топографическое пространственное отношение без добавления значения «у подножия», которого в самом слове нет.
- source_word: אַשְׁדֹּת
  choice: склоны
  rationale: В географическом употреблении означает горные склоны или уступы; это значение соответствует рельефу Фасги.
- source_word: הַפִּסְגָּה
  choice: Фасга
  rationale: Использована укоренившаяся в русской библейской традиции форма топонима.
- source_word: וְכָל
  choice: и вся
  rationale: Сохраняет соединительный союз и значение полноты описываемой территории.
