  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранена синтаксическая связь с предшествующим контекстом посредством начального «и». Маркер сноски поставлен после «моря Аравы», поскольку именно этот топоним поясняется в сноске.
