  text: וְ/זֹ֖את הַ/תּוֹרָ֑ה אֲשֶׁר שָׂ֣ם מֹשֶׁ֔ה לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: ru
  text: 'Вот закон, который Моисей изложил сынам Израиля[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть израильтянам, народу Израиля; традиционно также: «детям Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Вот
  rationale: Сочетание союза с указательным местоимением вводит новый раздел. Русское «Вот» естественно передаёт указательно-представительную функцию и связь с предшествующим контекстом без тяжеловесного «И вот».
- source_word: הַתּוֹרָה
  choice: закон
  rationale: תּוֹרָה может означать наставление, но здесь служит заголовком для заветного закона, представляемого Моисеем; «закон» — привычный и контекстуально точный русский эквивалент.
- source_word: אֲשֶׁר
  choice: который
  rationale: Естественное русское относительное местоимение, согласованное со словом «закон».
- source_word: שָׂם ... לִפְנֵי
  choice: изложил ... перед
  rationale: Буквально оборот означает «поставил/положил перед». В контексте закона русское «изложил кому-либо» естественно передаёт его официальное представление аудитории, тогда как буквальное «положил перед» звучало бы неясно.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет мужскую форму и заветно-национальную формулу оригинала. В современном русском выражение понятно, хотя «израильтянам» было бы более идиоматично.
theological_decisions:
- issue: Родовая и национальная формула בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам; народу Израиля; детям Израиля
  rationale: Выбрана формально точная передача мужского множественного числа и традиционной заветной формулы без её нейтрализации. Сноска поясняет, что выражение обозначает народ Израиля как целое.
translation_notes:
  register: Современный литературный русский с библейским достоинством. Формула «сынам Израиля» намеренно сохраняет образ оригинала; глагол «изложил» устраняет неестественную для русского буквальность оборота «поставил перед». Двоеточие уместно, поскольку стих вводит следующий раздел.
