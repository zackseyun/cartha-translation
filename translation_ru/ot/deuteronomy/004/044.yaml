  terminology: «Закон» — контекстуально оправданная передача הַתּוֹרָה. Имя «Моисей» нормативно. «Сынам Израиля» сохраняет форму בְּנֵי יִשְׂרָאֵל; сноска корректно сообщает более идиоматические национальные соответствия и традиционный вариант.
