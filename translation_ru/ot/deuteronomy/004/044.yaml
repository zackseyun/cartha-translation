  source_fidelity: «Вот закон, который Моисей изложил сынам Израиля» точно передаёт представительную конструкцию וְזֹאת הַתּוֹרָה אֲשֶׁר שָׂם מֹשֶׁה לִפְנֵי בְּנֵי יִשְׂרָאֵל. «Изложил» несколько интерпретирует буквальное «поставил/положил перед», но в русском юридико-наставительном контексте естественно выражает официальное предъявление закона народу и не меняет смысла.
