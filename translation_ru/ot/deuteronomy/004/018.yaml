lexical_decisions:
- source_word: תַּבְנִית
  choice: образ
  rationale: В контексте запрета на изготовление изображений слово обозначает видимую форму или её воспроизведение. «Образ» сохраняет эту широту и не уточняет без основания материал или способ изготовления.
- source_word: כָּל
  choice: любого / любой
  rationale: 'При существительных в единственном числе передаёт распределительное значение: запрет охватывает всякое существо соответствующей категории.'
- source_word: רֹמֵשׂ
  choice: существо, ползающее
  rationale: Причастие от רמשׂ обозначает живое существо, передвигающееся у поверхности земли; такое выражение естественнее по-русски, чем субстантивированное «ползающее».
- source_word: בָּאֲדָמָה
  choice: по земле
  rationale: В сочетании с глаголом движения אֲדָמָה указывает на поверхность суши; русский предлог «по» естественно передаёт движение по земле.
- source_word: דָּגָה
  choice: рыба
  rationale: Собирательное существительное обозначает рыб как разряд водных существ; в русском единственное число после «любой» хорошо передаёт распределительный смысл.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: которая живёт в водах
  rationale: Глагол «живёт» добавлен как естественная русская связка для эллиптической еврейской конструкции «которая в водах», не меняя её смысла; множественное «водах» сохраняет форму מַיִם.
- source_word: מִתַּחַת לָאָרֶץ
  choice: под землёй
  rationale: Буквально и естественно передаёт пространственное выражение, сохраняя его связь с формулой запрета на изображения в Исходе 20:4.
theological_decisions:
- issue: Обозначение представляемой формы в контексте идолопоклонства
  choice: образа любого…
  alternative: подобия любого… / изображения любого…
  rationale: «Образ» передаёт תַּבְנִית как видимую форму или представление, не сужая значение до статуи, идола либо конкретной техники изготовления. Запретительный смысл определяется ближайшим контекстом.
- issue: Выражение о водах под землёй
  choice: в водах под землёй
  alternative: в водах ниже суши
  rationale: Сохранена традиционная пространственная формула без попытки согласовать её с современной космологией или, напротив, превратить её в отдельное учение об устройстве мира.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксическая форма родительного падежа сохраняет зависимость этого фрагмента от запрета в предшествующем контексте. Повтор слова «образа» воспроизводит повтор תַּבְנִית в еврейском тексте.
