base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: ru
  text: Ведь я умру в этой земле[a] и не перейду через Иордан, а вы перейдёте и овладеете[b] этой доброй землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я скоро умру в этой земле». Еврейское причастие может обозначать действие, которое вот-вот произойдёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вступите во владение этой доброй землёй»; возможно также: «унаследуете эту добрую землю». Еврейский глагол может обозначать овладение землёй, получаемой в наследственное владение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим наставлением и естественно звучит по-русски.
- source_word: אָנֹכִי מֵת
  choice: я умру
  rationale: Причастие מֵת в контексте обозначает предстоящую смерть Моисея; русский простой будущий передаёт это естественно, а оттенок близости события отмечен в сноске.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: в этой земле
  rationale: Сохраняет ключевое для Второзакония слово «земля» и указание на территорию к востоку от Иордана.
- source_word: אֵינֶנִּי עֹבֵר אֶת הַיַּרְדֵּן
  choice: не перейду через Иордан
  rationale: Отрицание с причастием выражает предстоящее несовершившееся действие; по-русски естественна форма будущего времени. Предлог «через» ясно передаёт пересечение реки.
- source_word: וְאַתֶּם עֹבְרִים
  choice: а вы перейдёте
  rationale: Союз וְ здесь противопоставляет участь Моисея участи народа; «а» сохраняет контраст без его усиления.
- source_word: וִירִשְׁתֶּם
  choice: овладеете
  rationale: Глагол ירשׁ здесь означает вступить во владение обещанной землёй; «овладеете» сохраняет динамику приобретения владения, тогда как возможный оттенок наследования отмечен в сноске.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: этой доброй землёй
  rationale: Буквально и естественно передаёт устойчивую во Второзаконии оценку обещанной земли, не конкретизируя её как плодородную или приятную.
theological_decisions:
- issue: Смысл ירשׁ в отношении обещанной земли
  choice: овладеете
  alternative: унаследуете
  rationale: Выбрано значение фактического вступления во владение, однако наследственный и дарованный характер земли не исключён и отражён в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Будущее время выбрано вместо буквального настоящего с причастием ради естественности русского повествования; контраст между Моисеем и Израилем сохранён союзом «а».
