  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: ru
  text: Бецер в пустыне, на плоскогорье[a], для колена Рувима; Рамоф в Галааде — для колена Гада; Голан в Васане — для колена Манассии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на равнине». Еврейское слово обозначает ровную местность или плато; здесь речь идёт о возвышенном плоскогорье к востоку от Иордана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Бецер
  rationale: Название города передано принятой русской библейской транслитерацией.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую степную местность; «в пустыне» естественно и сохраняет традиционное географическое значение.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: в стране плоскогорья
  rationale: מִישֹׁר — ровная местность, в данном контексте возвышенное плато к востоку от Иордана; «плоскогорье» точнее передаёт географию, чем потенциально двусмысленная «равнина».
- source_word: לָרֻאוּבֵנִי
  choice: для колена Рувима
  rationale: Еврейское прилагательное принадлежности стоит в единственном числе, но обозначает племенную общность; русское «для колена Рувима» ясно и естественно передаёт распределительное значение.
- source_word: רָאמֹת
  choice: Рамоф
  rationale: Использована устоявшаяся русская библейская форма топонима.
- source_word: בַּגִּלְעָד
  choice: в Галааде
  rationale: Использована устоявшаяся русская форма названия области.
- source_word: לַגָּדִי
  choice: для колена Гада
  rationale: Племенное обозначение раскрыто естественной русской конструкцией, параллельной двум другим названиям колен.
- source_word: גּוֹלָן
  choice: Голан
  rationale: Топоним передан прямой и узнаваемой русской транслитерацией.
- source_word: בַּבָּשָׁן
  choice: в Васане
  rationale: Использована устоявшаяся русская библейская форма названия области.
- source_word: לַמְנַשִּׁי
  choice: для колена Манассии
  rationale: Еврейское племенное прилагательное передано ясным русским обозначением колена с сохранением трёхчастного параллелизма.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: перечисление с точками с запятой
  rationale: Показатель прямого дополнения отдельно не переводится; повторяющаяся координация отражена структурой перечисления, а тире делает отношения между городами и коленами прозрачными.
