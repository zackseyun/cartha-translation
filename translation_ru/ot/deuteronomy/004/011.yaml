base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: ru
  text: Вы приблизились и встали у подножия горы, а гора пылала огнём до сердца небес[a] — тьма, облако и густой мрак[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до середины неба». Буквально: «до сердца небес»; это выражение может указывать на середину или высоту неба.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «глубокая тьма», «непроглядный мрак».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: вы приблизились
  rationale: Форма Qal wayyiqtol, 2-е лицо множественного числа, обозначает приближение; современное русское «приблизились» точно и естественно передаёт движение к горе.
- source_word: וַתַּעַמְדוּן
  choice: стали
  rationale: Глагол עמד означает «стоять»; в последовательности действий «стали» естественно передаёт, что народ занял место у горы.
- source_word: תַּחַת הָהָר
  choice: у подножия горы
  rationale: Хотя תַּחַת буквально может означать «под», в топографическом контексте выражение указывает на место у основания горы.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: пылала огнём
  rationale: Причастие выражает продолжающееся состояние. «Пылала огнём» сохраняет явное упоминание огня и звучит выразительно, но естественно.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: до самого сердца небес
  rationale: Сохраняется конкретный еврейский образ «сердца небес» как их середины или высоты; «самого» естественно подчёркивает предельность עַד.
- source_word: חֹשֶׁךְ עָנָן וַעֲרָפֶל
  choice: тьма, облако и густой мрак
  rationale: Сохранены три самостоятельных элемента описания. «Густой мрак» отличает עֲרָפֶל от предшествующего חֹשֶׁךְ и передаёт плотную, скрывающую темноту.
theological_decisions:
- issue: Образ явления Бога на Синае
  choice: Сохранить конкретное и внушающее трепет сочетание огня, тьмы, облака и густого мрака.
  alternative: Передать заключительные слова как обобщённое описание погодных явлений.
  rationale: Еврейский текст представляет многослойную картину явления Бога; перевод не сводит её к обычной погоде и не добавляет конфессионального истолкования.
- issue: Образ «сердца небес»
  choice: Сохранить буквальный образ в основном тексте и пояснить его идиоматический смысл в сноске.
  alternative: Сразу перевести как «до середины неба» или «до самой высоты неба».
  rationale: Так сохраняются поэтическая конкретность и возможная пространственная широта еврейского выражения без навязывания единственного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным, а образность еврейского текста — «сердце небес» и тройное описание тьмы — сохранена.
