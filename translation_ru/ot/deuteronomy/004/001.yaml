revisions:
- from: И теперь, Израиль, слушай постановления и законы, которым я учу вас, чтобы вы исполняли их, — тогда вы будете жить, войдёте и овладеете землёй, которую Яхве[a], Бог ваших отцов, даёт вам.
  to: И теперь, Израиль, слушай постановления и законы, которые я учу вас исполнять, чтобы вы жили, вошли и овладели землёй, которую Яхве[a], Бог ваших отцов, даёт вам.
  rationale: Исправлены только синтаксическая связь обучения с исполнением и передача целевого לְמַעַן. Значение, юридическая терминология, обращение в единственном числе к Израилю и место сноски при имени Яхве сохранены.
