id: DEU.4.1
reference: Deuteronomy 4:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: ru
  text: И теперь, Израиль, слушай постановления и законы, которые я учу вас исполнять, чтобы вы жили, вошли и овладели землёй, которую Яхве[a], Бог ваших отцов, даёт вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; традиционно переводится «ГОСПОДЬ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет явный переход от предшествующего повествования к увещанию Моисея.
- source_word: שְׁמַע אֶל
  choice: слушай
  rationale: Передаёт внимательное слушание, не сводя значение непосредственно к послушанию; требование исполнения выражено далее.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Естественный юридический термин, сохраняющий отличие от מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: Передаёт нормативно-правовой смысл и остаётся отличным от «постановлений».
- source_word: מְלַמֵּד
  choice: учу
  rationale: Настоящее время отражает продолжающееся наставление Моисея.
- source_word: לַעֲשׂוֹת
  choice: чтобы вы исполняли их
  rationale: В русском языке явно назван подразумеваемый объект и естественно передана цель обучения.
- source_word: לְמַעַן תִּחְיוּ
  choice: тогда вы будете жить
  rationale: В данном увещевательном контексте לְמַעַן допускает целевое и результативное понимание; формулировка естественно связывает исполнение с последующей жизнью, не уточняя её характер.
- source_word: וּבָאתֶם
  choice: войдёте
  rationale: Кратко и естественно передаёт движение внутрь обещанной земли.
- source_word: וִירִשְׁתֶּם
  choice: овладеете
  rationale: Передаёт конкретное вступление во владение землёй; смысл «унаследуете» возможен, но здесь менее непосредственен.
- source_word: הָאָרֶץ
  choice: землёй
  rationale: Сохраняет устойчивую библейскую лексику обещанной земли.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, представленное тетраграмматоном в еврейском тексте.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Бог ваших отцов
  rationale: Сохраняет традиционную заветную формулу и прямое значение אֲבוֹת.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Связь послушания с жизнью и овладением землёй
  choice: Сохранена условно-результативная последовательность без богословского уточнения природы жизни
  alternative: «чтобы вы жили» как строго целевая конструкция
  rationale: Еврейское לְמַעַן выражает цель или ожидаемый результат. Контекст связывает исполнение постановлений с жизнью, входом и владением землёй, но не требует дальнейшей догматической конкретизации.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Единственное число «слушай» соответствует обращению к Израилю как к единому народу, а множественное «вас» — смене числа в еврейском тексте. Пара «постановления и законы» сохраняет различие двух юридических терминов без тяжеловесной архаики.
