review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы обращение к Израилю, различие между חֻקִּים и מִשְׁפָּטִים, обучение исполнению заповедей, а также вход в землю и овладение ею. Однако «тогда вы будете жить» ослабляет выраженную לְמַעַן целевую связь; предпочтительно «чтобы вы жили». Формулировка «постановления и законы, которым я учу вас» синтаксически менее точна, чем конструкция с прямым дополнением: «которые я учу вас исполнять».'
  naturalness: Исправленный вариант сохраняет современный литературный и торжественный регистр. «Которые я учу вас исполнять» естественнее и яснее, чем «которым я учу вас», а параллельные глаголы «жили, вошли и овладели» компактно передают еврейскую последовательность.
  terminology: «Постановления и законы» приемлемо различает חֻקִּים и מִשְׁפָּטִים в современном русском. «Яхве» последовательно передаёт יהוה; сноска корректно отмечает еврейскую форму и традиционную передачу.
  issues:
  - severity: medium
    issue: «Тогда вы будете жить» вместо целевой конструкции.
    rationale: לְמַעַן в данном контексте прямо вводит цель/ожидаемый результат исполнения. «Тогда» делает связь преимущественно временно-условной и не передаёт её столь явно.
  - severity: medium
    issue: Неудачная синтаксическая связь в «постановления и законы, которым я учу вас».
    rationale: 'Еврейский текст говорит о постановлениях и законах, которым Моисей учит народ для исполнения. По-русски естественнее прямо сказать: «которые я учу вас исполнять».'
  revised_text: И теперь, Израиль, слушай постановления и законы, которые я учу вас исполнять, чтобы вы жили, вошли и овладели землёй, которую Яхве[a], Бог ваших отцов, даёт вам.
  revised_footnotes:
