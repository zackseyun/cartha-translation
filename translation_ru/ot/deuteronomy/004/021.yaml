base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: ru
  text: И Яхве разгневался на меня из-за ваших слов[a] и поклялся, что я не перейду Иордан и не войду в добрую землю, которую Яхве, твой Бог, даёт тебе в наследие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за вас». Буквально: «из-за ваших слов».'
    reason: Основной текст передаёт явное упоминание слов в еврейском тексте; сноска отмечает возможное контекстуальное, более обобщённое понимание выражения.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом; форма «Яхве» общепонятна в современной русской библейской речи.
- source_word: הִתְאַנֶּף בִּי
  choice: разгневался на меня
  rationale: Естественно передаёт глагол сильного гнева и управление предлогом בְּ при обозначении лица, на которое направлен гнев.
- source_word: עַל דִּבְרֵיכֶם
  choice: из-за вас
  rationale: В данном контексте оборот может идиоматически указывать на вину или поступок народа; буквальное упоминание «ваших слов» сохранено в сноске как реальная лексическая возможность.
- source_word: וַיִּשָּׁבַע
  choice: и поклялся
  rationale: Прямо и естественно передаёт клятвенное обязательство.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: что я не перейду Иордан
  rationale: Передаёт содержание клятвы и отрицание перехода через реку без добавления не выраженной явно причинной конструкции.
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ הַטּוֹבָה
  choice: и не войду в добрую землю
  rationale: Сохраняет параллелизм двух отрицательных инфинитивных оборотов и прямое значение טוֹבָה.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Настоящее время естественно отражает причастную форму и изображает дарование земли как уже совершающееся действие.
- source_word: נַחֲלָה
  choice: в наследие
  rationale: Краткая русская формула передаёт землю как наследственный удел, дарованный народу.
theological_decisions:
- issue: Связь недопущения Моисея в землю с народом Израиля
  choice: из-за вас
  alternative: из-за ваших слов / по причине ваших слов
  rationale: Основной текст передаёт контекстуальный смысл оборота естественно по-русски, не уточняя сверх текста характер вины народа; сноска сохраняет буквальную формулировку и её неоднозначность.
- issue: Кто осуществляет запрет на переход и вход
  choice: поклялся, что я не перейду… и не войду
  alternative: поклялся не позволить мне перейти… и войти
  rationale: Формулировка следует грамматической форме содержания клятвы и не добавляет каузативное «не позволить», хотя по смыслу запрет исходит от Яхве.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Сохранено обращение к Израилю как к единому народу во втором лице единственного числа: «твой Бог», «даёт тебе».'
