  source_fidelity: 'Текст точно передаёт синтаксические и смысловые элементы еврейского оригинала: вынесенное «А мне», повеление Яхве Моисею, обучение народа двум категориям установлений, цель их исполнения и вступление в землю для овладения ею. «Чтобы вы исполняли их» уместно передаёт целевую конструкцию לַעֲשׂוֹתְכֶם אֹתָם. «Чтобы овладеть ею» соответствует לְרִשְׁתָּהּ, а вариант с «унаследовать» корректно вынесен в сноску.'
