  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: ru
  text: А мне в то время Яхве повелел научить вас постановлениям и законам[a], чтобы вы исполняли их в земле, в которую переходите, чтобы овладеть ею[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предписаниям и правовым установлениям».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы унаследовать её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: А мне
  rationale: Вынесенное вперёд дополнение передаёт лёгкое смысловое выделение Моисея и естественно звучит по-русски.
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол обозначает властное предписание; «повелел» сохраняет силу выражения и соответствует возвышенному повествовательному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לְלַמֵּד
  choice: научить
  rationale: Передаёт поручение Моисею сообщить народу содержание постановлений и законов; управление дательным падежом естественно для русского языка.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: постановлениям и законам
  rationale: Сохраняет два взаимодополняющих юридических термина, не сводя их к одному общему понятию.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: чтобы вы исполняли их
  rationale: В юридическом контексте русское «исполнять» естественно передаёт буквальное «делать» и сохраняет целевое значение конструкции.
- source_word: בָּאָרֶץ
  choice: в земле
  rationale: «Земля» сохраняет заветно-географическое значение слова в контексте Второзакония.
- source_word: עֹבְרִים שָׁמָּה
  choice: в которую переходите
  rationale: Передаёт движение через границу в обещанную землю; указательное «туда» в русском придаточном избыточно.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: Передаёт цель вступления в землю и значение приобретения владения; возможный оттенок наследования отмечен в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: Транслитерация «Яхве» сохраняет личное имя Бога и наиболее прямо отражает принятую научную реконструкцию произношения.
- issue: Значение לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  alternative: чтобы унаследовать её
  rationale: В данном контексте глагол обозначает вступление во владение землёй, однако также может подчёркивать получение её как наследственного удела; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся близким к еврейскому, но избегает неестественной буквальности; юридическая пара терминов и неоднозначность глагола ירש сохранены.
