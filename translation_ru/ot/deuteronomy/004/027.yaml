  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: ru
  text: И рассеет вас Яхве среди народов, и вас останется лишь немного среди народов, куда Яхве уведёт вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда Яхве погонит вас». Еврейский глагол может означать как «вести», так и «гнать»; контекст говорит о суде и изгнании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: и рассеет
  rationale: Порода хифиль глагола פוץ выражает причинённое рассеяние; «рассеет» естественно передаёт действие в контексте суда и изгнания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: בָּעַמִּים
  choice: среди народов
  rationale: עַמִּים обозначает народы как этнические общности; этот вариант также сохраняет различие с גּוֹיִם далее.
- source_word: וְנִשְׁאַרְתֶּם מְתֵי מִסְפָּר
  choice: и останется вас немного
  rationale: Так естественно по-русски передаётся результативный смысл нифаля и идиома «люди числа», то есть столь малое число людей, что их легко пересчитать.
- source_word: בַּגּוֹיִם
  choice: среди племён
  rationale: Здесь גּוֹיִם обозначает чужие народы. «Племена» позволяет без неестественного повтора сохранить лексическое отличие от עַמִּים; это слово употреблено не в позднем значении «язычники».
- source_word: אֲשֶׁר יְנַהֵג ... אֶתְכֶם שָׁמָּה
  choice: куда ... уведёт вас
  rationale: נהג допускает значения «вести» и «гнать». «Уведёт» сохраняет эту смысловую широту, тогда как направительное שָׁמָּה естественно выражено словом «куда».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это, не заменяя имя титулом.
- issue: Характер перемещения в изгнание в глаголе יְנַהֵג
  choice: уведёт
  alternative: погонит; поведёт
  rationale: Глагол может обозначать как ведение, так и понуждаемое перемещение. Контекст суда предполагает несвободу изгнания, но русский глагол «уведёт» не устраняет присущую еврейскому слову неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис близок к еврейскому оригиналу, при этом оборот «останется вас немного» звучит естественно. Различие עַמִּים и גּוֹיִם передано словами «народы» и «племена».
