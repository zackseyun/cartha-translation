  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: ru
  text: чтобы вы не поступили пагубно и не сделали себе изваяния[a] в виде какого бы то ни было образа — подобия мужчины или женщины,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вы не развратились и не сделали себе изваяние — изображение какого бы то ни было образа, подобие мужчины или женщины».'
    reason: Сохраняет возможный рефлексивный оттенок תַּשְׁחִתוּן и более буквальное нагромождение терминов изображения.
lexical_decisions:
- source_word: פֶּן
  choice: чтобы … не
  rationale: Частица вводит предостережение о нежелательном результате; русская конструкция естественно продолжает призыв беречься из предыдущего контекста.
- source_word: תַּשְׁחִתוּן
  choice: не поступили нечестиво
  rationale: Порода hифиль глагола שׁחת здесь описывает активное нравственно пагубное, вероломное поведение. Такой перевод передаёт действие, не сводя смысл к внутреннему «развращению» человека.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: и не сделали себе
  rationale: Сохранено значение действия в собственных интересах, выраженное לָכֶם.
- source_word: פֶּסֶל
  choice: изваяние
  rationale: Слово обозначает изготовленное, в частности высеченное или вырезанное, изображение; «изваяние» точно и понятно без архаизма «истукан».
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: в виде какого-либо образа
  rationale: Сочетание нескольких близких терминов передано естественно по-русски, при этом сохранено общее указание на любую зримую форму без преждевременного сужения до идола.
- source_word: תַּבְנִית
  choice: подобия
  rationale: Слово обозначает форму, модель или подобие; здесь оно вводит конкретные категории, изображение которых запрещается.
- source_word: זָכָר אֹו נְקֵבָה
  choice: мужчины или женщины
  rationale: В контексте изображаемой человеческой фигуры это естественное русское соответствие; сами еврейские слова буквально обозначают особь мужского или женского пола.
theological_decisions:
- issue: Передача терминов, связанных с запрещёнными изображениями
  choice: «изваяние … в виде какого-либо образа — подобия»
  alternative: «идол … изображение … подобие»
  rationale: Еврейский текст намеренно нагромождает близкие слова. Перевод сохраняет конкретность изготовленного изображения и риторическое накопление, но не вставляет слово «идол» там, где סָמֶל может шире обозначать образ или фигуру; запретительный культовый контекст остаётся ясным.
- issue: Смысл תַּשְׁחִתוּן
  choice: «не поступили нечестиво»
  alternative: «не развратились»
  rationale: Выбранный вариант сохраняет активную ответственность адресатов и не разрешает спорную глагольную форму исключительно в рефлексивном смысле.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского предостережения. Термин «изваяние» конкретен, но не архаичен; тире помогает передать пояснительное нагромождение еврейских существительных. Финальная запятая показывает синтаксическое продолжение перечня в следующем стихе.
