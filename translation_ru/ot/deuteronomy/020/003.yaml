base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: ru
  text: 'и скажет им: «Слушай, Израиль! Сегодня вы вступаете в сражение с вашими врагами. Не падайте духом[a], не бойтесь, не паникуйте и не ужасайтесь перед ними[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть ваше сердце не ослабеет (не станет мягким)». Речь идёт об утрате мужества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не бойтесь, не приходите в смятение и не трепещите перед ними». Три последовательных запрета усиливают призыв не поддаваться страху в бою.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: и скажет
  rationale: Форма с waw в последовательном предписании продолжает порядок действий; в русском контексте закона естественно будущее время со значением предписанного действия.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Слушай, Израиль!
  rationale: Сохраняет характерную для Второзакония формулу призыва не только услышать, но и внять; «слушай» естественнее в современном русском, чем «услышь».
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: Сегодня вы вступаете в сражение
  rationale: Причастие выражает непосредственное приближение к бою; «вступаете в сражение» естественно передаёт движение к военному столкновению без излишней буквальности.
- source_word: עַל אֹיְבֵיכֶם
  choice: с вашими врагами
  rationale: В сочетании «сражение с» русский творительный оборот естественно передаёт направленность военных действий против врагов.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Не падайте духом
  rationale: Еврейская идиома буквально описывает ослабление или смягчение сердца, то есть утрату мужества; русская идиома точно и ясно передаёт её функцию.
- source_word: אַל תִּירְאוּ
  choice: не бойтесь
  rationale: Прямой современный эквивалент запрета испытывать страх.
- source_word: וְאַל תַּחְפְּזוּ
  choice: не паникуйте
  rationale: В военном контексте глагол обозначает тревожное смятение, а не просто поспешность; «паниковать» ясно выражает этот смысл.
- source_word: וְאַל תַּעַרְצוּ
  choice: не ужасайтесь
  rationale: Передаёт сильный страх и сохраняет нарастание ряда запретов, не вводя дополнительного значения физического сокрушения.
- source_word: מִפְּנֵיהֶם
  choice: при виде их
  rationale: Буквально оборот означает «перед ними/от лица их»; русское «при виде их» сохраняет образ присутствия противника и естественно связывается с ужасом.
