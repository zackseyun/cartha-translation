base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: ru
  text: И кто обручился с женщиной[a], но ещё не взял её в жёны[b], пусть уйдёт и вернётся домой, чтобы он не погиб в сражении и другой мужчина не взял её в жёны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «обручил женщину».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не взял её». Здесь имеется в виду, что после обручения он ещё не завершил заключение брака, взяв её в жёны.'
    reason: cultural_note
  - marker: c
    text: 'Или: «не женился на ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: И кто
  rationale: Продолжает перечисление мужчин, освобождаемых от участия в сражении; в русском контексте слово «мужчина» здесь можно естественно не повторять.
- source_word: אֵרַשׂ אִשָּׁה
  choice: обручился с женщиной
  rationale: Передаёт официальное обручение, которое предшествовало завершению брака; современно и понятно, хотя древнееврейская конструкция буквально переходная.
- source_word: וְלֹא לְקָחָהּ
  choice: но ещё не взял её в жёны
  rationale: Глагол לקח применительно к женщине имеет брачный смысл. Добавление «в жёны» ясно передаёт его по-русски, а «ещё» подчёркивает последовательность между обручением и завершением брака.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: пусть уйдёт и вернётся домой
  rationale: «Пусть» передаёт предписывающую силу форм, а «домой» является естественным русским соответствием буквального «в свой дом».
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: чтобы он не погиб в сражении
  rationale: Передаёт предостережение, вводимое פֶּן, современным русским оборотом; «сражение» указывает на предстоящий конкретный бой.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: и другой мужчина не взял её в жёны
  rationale: Сохраняет параллель с первым употреблением לקח и брачный смысл глагола в данном контексте.
theological_decisions:
- issue: Связь второго последствия с פֶּן
  choice: 'Оба глагола переданы как нежелательные последствия: «чтобы он не погиб… и другой мужчина не взял…»'
  alternative: «как бы он не погиб…, а другой мужчина не взял её»
  rationale: Единая конструкция сохраняет синтаксическую связь обоих последствий с предостережением и не превращает второе в простое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка избегает архаичного «дабы» и при этом сохраняет последовательность древнееврейского текста и повтор одного брачного глагола.
