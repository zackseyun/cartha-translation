  verdict: revise
  source_fidelity: 'В целом смысл передан верно: исключение для неплодовых деревьев, их уничтожение/вырубка, сооружение осадных средств против враждебного города и завершение осады выражены точно. Однако «из них» делает подразумеваемую связь с древесиной явным утверждением, а разбиение на два предложения и переход от «можешь» к повелительному «возводи» ослабляют единство еврейской конструкции. Формулировку о конечном результате следует приблизить к активному образу רִדְתָּהּ («приведёшь к падению»), не сводя его безоговорочно к «покорению».'
  naturalness: Предлагаемая редакция сохраняет современный литературный русский и обращение на «ты». «Деревья, которые, как ты знаешь, не дают пищи» естественно передаёт критерий עֵץ מַאֲכָל, не вводя не имеющееся в оригинале слово «плоды».
  terminology: «Осадные сооружения» — удачная широкая передача מָצוֹר. Сноска к этому словосочетанию сохраняет обоснованную лексическую альтернативу. Для רִדְתָּהּ основным текстом выбрана активная, но не чрезмерно буквальная формула «приведёшь его к падению»; сноска поясняет буквальный образ и альтернативу «покоришь».
