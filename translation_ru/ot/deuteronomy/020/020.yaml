base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: ru
  text: Только деревья, которые, как ты знаешь, не дают пищи, можешь уничтожать и рубить и возводить из них осадные сооружения[a] против города, который ведёт с тобой войну, пока не приведёшь его к падению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сооруди осадное укрепление». Еврейское מָצוֹר может обозначать как отдельное осадное сооружение, так и осадные укрепления в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока не покоришь его» или «пока он не падёт». Еврейское выражение буквально говорит о том, чтобы привести город вниз; оно описывает его поражение при осаде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничение и исключение из предшествующего запрета уничтожать плодовые деревья.
- source_word: עֵץ אֲשֶׁר ... לֹא עֵץ מַאֲכָל הוּא
  choice: деревья, о которых ты знаешь, что они не приносят съедобных плодов
  rationale: В контексте עֵץ обозначает живые деревья, а עֵץ מַאֲכָל — деревья, дающие пригодные в пищу плоды. Формулировка естественна по-русски и сохраняет практический критерий различения.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: можешь уничтожать и рубить
  rationale: Единственное число употреблено распределительно. «Можешь» передаёт разрешительный смысл правового предписания, а два глагола сохраняют сочетание уничтожения и вырубки.
- source_word: וּבָנִיתָ מָצוֹר
  choice: Из них возводи осадные сооружения
  rationale: מָצוֹר может обозначать осадные укрепления или комплекс осадных сооружений. «Из них» ясно выражает подразумеваемое использование срубленных деревьев, не меняя смысла действия.
- source_word: עַל הָעִיר
  choice: против города
  rationale: Предлог עַל в военном контексте передаёт направленность осадных действий против города.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: который ведёт с тобой войну
  rationale: Естественно передаёт еврейскую идиому «делать войну с» и сохраняет продолжающийся характер действия причастия.
- source_word: עַד רִדְתָּהּ
  choice: пока не покоришь его
  rationale: Форма выражает доведение города до подчинения. Активная русская конструкция сохраняет обращение ко второму лицу и военный смысл, не ограничивая образ буквальным падением укреплений.
