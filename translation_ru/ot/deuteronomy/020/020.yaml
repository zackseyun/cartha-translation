- from: Только деревья, о которых ты знаешь, что они не приносят съедобных плодов, можешь уничтожать и рубить. Из них возводи осадные сооружения[a] против города, который ведёт с тобой войну, пока не покоришь его[b].
  to: Только деревья, которые, как ты знаешь, не дают пищи, можешь уничтожать и рубить и возводить из них осадные сооружения[a] против города, который ведёт с тобой войну, пока не приведёшь его к падению[b].
  rationale: Редакция восстанавливает единый ряд действий и согласованную разрешительную модальность, уточняет передачу «деревьев для пищи» без необязательного сужения до плодов и сохраняет активный образ еврейского глагола в заключительной части. Указание на использование срубленных деревьев для осадных сооружений оставлено, поскольку оно грамматически и контекстуально связано с предшествующим объектом, но встроено в единый ряд действий, а не вынесено как самостоятельное добавление.
