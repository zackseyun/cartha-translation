base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: ru
  text: 'И пусть распорядители скажут народу: «Кто построил новый дом, но ещё не посвятил[a] его? Пусть он уйдёт и вернётся домой, чтобы он не погиб в сражении и другой человек не посвятил его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ввёл его в употребление». Еврейский глагол означает торжественно начать пользоваться новым домом, нередко с оттенком посвящения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: распорядители
  rationale: В данном военно-административном контексте это назначенные должностные лица, а не писцы. «Распорядители» передаёт их служебную функцию, не отождествляя их с военачальниками.
- source_word: הָעָם
  choice: народу
  rationale: Сохранено прямое значение «народ»; по контексту речь идёт о собранных для войны мужчинах, но перевод не сужает значение до «войска».
- source_word: מִי הָאִישׁ
  choice: Кто
  rationale: В русском вопросительное «кто» естественно вводит предусмотренный законом частный случай; мужской и военный контекст далее не требует тяжеловесного «кто тот мужчина».
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: построил новый дом
  rationale: Прямо и естественно передаёт значение еврейского выражения.
- source_word: וְלֹא חֲנָכוֹ
  choice: но ещё не посвятил его
  rationale: Глагол חנך обозначает торжественное начало пользования домом, возможно с обрядом посвящения. «Посвятил» сохраняет этот оттенок и повтор ключевого глагола; пояснение дано в сноске.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Пусть он уйдёт и возвратится домой
  rationale: Формы глагола имеют здесь предписывающую силу. «Домой» естественно передаёт «в свой дом» и не обязательно отсылает именно к только что построенному дому.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: чтобы не погибнуть в сражении
  rationale: Передаёт предупредительное значение פֶּן и конкретность определённого военного столкновения; «погибнуть» по-русски естественнее для смерти в бою.
- source_word: וְאִישׁ אַחֵר יַחְנְכֶנּוּ
  choice: и чтобы другой человек не посвятил этот дом
  rationale: Сохранены параллельная предупредительная конструкция и повтор глагола חנך. «Другой человек» передаёт איש אחר без неуместного разговорного оттенка.
theological_decisions:
- issue: Характер посвящения нового дома
  choice: Не уточнять, было ли оно строго религиозным обрядом или торжественным началом пользования домом
  alternative: Перевести как «освятил» либо «начал жить в нём»
  rationale: Еврейский חנך допускает посвятительный и инаугурационный оттенки. «Освятил» чрезмерно усилило бы культовый смысл, а «начал жить» сузило бы значение до практического заселения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием законодательной речи. Синтаксис упрощён там, где буквальное воспроизведение было бы тяжеловесным, но сохранены повтор חנך, предупредительная конструкция и неопределённость характера посвящения дома.
