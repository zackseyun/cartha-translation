base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: ru
  text: Когда вы приблизитесь к сражению[a], священник выйдет вперёд и обратится к народу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к войне». Еврейское מִלְחָמָה может обозначать как войну вообще, так и отдельное сражение; здесь непосредственное приближение к бою говорит в пользу перевода «сражение».'
    reason: lexical_alternative
  - marker: b
    text: Под «народом» здесь подразумеваются собравшиеся израильтяне, готовые к бою, однако в еврейском тексте употреблено более широкое слово «народ», а не более узкое обозначение воинов или войска.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: Когда вы приблизитесь
  rationale: Сочетание וְהָיָה с временной конструкцией естественно передаётся придаточным будущего времени; глагол קרב означает приближение.
- source_word: אֶל הַמִּלְחָמָה
  choice: к сражению
  rationale: מִלְחָמָה может обозначать как войну в целом, так и отдельное сражение; непосредственный контекст выхода к бою поддерживает «сражение».
- source_word: וְנִגַּשׁ
  choice: выйдет вперёд
  rationale: Глагол נגשׁ обозначает приближение; в ситуации обращения к собранным людям русское «выйдет вперёд» естественно передаёт предполагаемое движение, не добавляя новой роли.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Определённое существительное в единственном числе передано без поясняющего расширения.
- source_word: וְדִבֶּר אֶל הָעָם
  choice: и обратится к народу
  rationale: דבר с אֶל означает говорить кому-либо, обращаться к кому-либо; «обратится» звучит естественно в официальном публичном контексте. הָעָם сохранено как «народ», а не сужено до «войска».
