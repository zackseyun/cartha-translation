  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: ru
  text: Но если он не заключит с тобой мира, а будет воевать с тобой, то осади его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Но если… не
  rationale: Союз в данном контексте вводит противопоставление мирному исходу предыдущего стиха; «но если» естественно передаёт это отношение.
- source_word: תַשְׁלִים עִמָּךְ
  choice: не заключит с тобой мира
  rationale: Хифиль от שׁלם здесь означает установить мирные отношения или заключить мир. Русское «заключить мир» точно и естественно передаёт активное значение выражения.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: а начнёт войну против тебя
  rationale: Оборот עשה מלחמה означает «вести/начать войну». В сочетании с противопоставлением отказу от мира «начнёт войну против тебя» звучит естественно и сохраняет направленность враждебного действия.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: то осади его
  rationale: Глагол צור с על означает осаждать город. Последовательная форма в правовом наставлении передана прямым повелительно-инструктивным «осади»; местоимение мужского рода согласовано с подразумеваемым словом «город» из контекста.
