  source_fidelity: 'Первое условие передано точно: «не заключит с тобой мира» естественно выражает הִשְׁלִים עִם. Однако «начнёт войну» добавляет значение начала действия, которого в идиоме עָשָׂה ... מִלְחָמָה нет; она означает «вести/вести войну». Заключительное «осади его» точно передаёт וְצַרְתָּ עָלֶיהָ в контексте города.'
  naturalness: Текст краток и звучит современно. «Будет воевать с тобой» столь же естественно, но точнее, чем «начнёт войну против тебя». Мужской род местоимения в «осади его» оправдан подразумеваемым «городом» из ближайшего контекста.
  terminology: «Заключить мир» и «осадить» — устоявшиеся нейтрально-литературные соответствия. Для עָשָׂה מִלְחָמָה предпочтительно «воевать», без не засвидетельствованного оттенка начала войны.
