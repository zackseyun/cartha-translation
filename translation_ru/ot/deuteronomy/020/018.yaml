source:
  edition: WLC
  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: ru
  text: чтобы они не научили вас совершать такие же мерзости, какие они совершали для своих богов[a], иначе вы согрешили бы против Яхве, вашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своим богам».'
    reason: Предлог ל в לֵאלֹהֵיהֶם допускает передачу как действия, совершаемого «для» богов, так и действия, обращённого «к» ним; по-русски последнее здесь выражено дательным падежом.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר לֹא
  choice: чтобы … не
  rationale: Передаёт цель и предотвращаемый результат естественной для современного русского языка конструкцией.
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: они не научили вас совершать
  rationale: Сохраняет прямое значение למד в интенсивной породе и зависимый инфинитив עשה; «совершать» естественно сочетается с «мерзостями».
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: все те же мерзости
  rationale: «Те же» передаёт значение уподобления, выраженное предлогом כ, а «мерзости» сохраняет сильную нравственно-религиозную окраску תועבה.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которые совершали
  rationale: Относительное придаточное прямо характеризует упомянутые мерзости; прошедшее несовершенного вида естественно обозначает обычные культовые действия.
- source_word: לֵאלֹהֵיהֶם
  choice: для своих богов
  rationale: Предлог ל может обозначать адресата или того, ради кого совершаются культовые действия; «для» звучит естественно, а возвратное «своих» ясно соотносит богов с подлежащим.
- source_word: וַחֲטָאתֶם
  choice: и вы не стали грешить
  rationale: В контексте отрицательной целевой конструкции форма обозначает предотвращаемое следствие. Русское «не стали» ясно связывает грех с усвоением этих обычаев, не превращая фразу в утверждение о свершившемся грехе.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: против Яхве, вашего Бога
  rationale: При חטא предлог ל указывает на того, против кого совершается грех; имя יהוה передано как «Яхве», а приложение отделено запятой по нормам русского языка.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное заветное имя יהוה; транслитерация сохраняет отличие имени от титула и соответствует предоставленному согласованному слою.
- issue: Связь וַחֲטָאתֶם с предшествующей целью
  choice: и вы не стали грешить
  alternative: и вы согрешили бы
  rationale: Контекст выражает цель запрета — не допустить как обучения мерзостям, так и последующего греха. Выбранная конструкция сохраняет эту связь, тогда как буквальное утвердительное прошедшее по-русски исказило бы смысл.
translation_notes:
  register: Современный литературный русский язык; тон серьёзный и ясный. Сильное слово «мерзости» сохранено ради нравственно-религиозной весомости исходного текста, а синтаксис сделан естественным без устранения смысловой связи между подражанием культовым практикам и грехом.
