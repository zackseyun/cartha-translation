base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: ru
  text: 'Затем распорядители продолжат говорить народу и скажут: «Кто боязлив и малодушен?[a] Пусть он уйдёт и возвратится домой, чтобы он не лишил мужества своих братьев, сделав их такими же малодушными, как он сам».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто боится и мягок сердцем».'
    reason: Лексическая альтернатива и сохранение еврейского образа.
  - marker: b
    text: '«Братья» здесь — его соплеменники, участвующие вместе с ним в сражении; буквально: «чтобы он не растопил сердце своих братьев, как его сердце».'
    reason: Культурное пояснение и буквальная форма метафоры.
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: продолжат
  rationale: Идиома «прибавят говорить» означает продолжение речи; современное русское «продолжат» естественно передаёт её смысл.
- source_word: הַשֹּׁטְרִים
  choice: распорядители
  rationale: Здесь имеются в виду назначенные должностные лица, объявляющие войску предписания, а не современные полицейские.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: боязлив и малодушен
  rationale: Первое слово прямо обозначает испытывающего страх, а выражение «мягок сердцем» в военном контексте означает недостаток мужества.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: пусть он уйдёт и возвратится домой
  rationale: Формы глагола имеют предписывающую силу; «домой» естественно передаёт направительное «к своему дому».
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו כִּלְבָבוֹ
  choice: чтобы он не лишил мужества своих братьев, как лишился его сам
  rationale: Образ тающего сердца означает утрату мужества. Русская формулировка ясно передаёт переход страха на других и сохраняет сравнение с состоянием самого человека.
theological_decisions:
- issue: Гендерно маркированный язык военного контекста
  choice: Сохранить «он» и «братья»
  alternative: «этот человек» и «товарищи»
  rationale: Еврейский текст говорит о мужчине-воине и называет остальных израильтян его братьями; сохранение этой формы передаёт социальную и языковую фактуру источника.
- issue: Метафора тающего сердца
  choice: Передать смысл как утрату мужества, отметив буквальный образ в сноске
  alternative: «чтобы сердце его братьев не растаяло, как его сердце»
  rationale: Буквальная конструкция по-русски звучит неестественно и может быть непонятна, тогда как смысловая передача сохраняет военное значение образа без богословского уточнения сверх текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством законодательной речи. Выбрано оптимальное соответствие: синтаксис сделан естественным для русского, а непрозрачная метафора разъяснена в сноске. «Распорядители» отличает древних должностных лиц от современных полицейских или строевых офицеров.'
