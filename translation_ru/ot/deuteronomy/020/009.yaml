base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/009.yaml
  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: ru
  text: Когда распорядители закончат говорить народу, пусть они назначат[a] военачальников во главе народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может также означать «собрать», «пересчитать» или «поставить во главе» — в зависимости от контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: Когда … закончат
  rationale: Сочетание וְהָיָה с כְּ и инфинитивом вводит временное придаточное и указывает на завершение речи перед следующим действием.
- source_word: הַשֹּׁטְרִים
  choice: распорядители
  rationale: В контексте Второзакония это должностные лица, организующие народ; «распорядители» передаёт административную функцию и не создаёт современного полицейского оттенка слова «офицеры».
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: говорить народу
  rationale: Прямо передаёт еврейское выражение, сохраняя עָם как «народ», а не сужая его до «войска».
- source_word: וּפָקְדוּ
  choice: пусть они назначат
  rationale: Глагол פקד имеет широкий диапазон значений, включая назначение, сбор и поставление во главе. Здесь прямое дополнение שָׂרֵי צְבָאוֹת и выражение בְּרֹאשׁ הָעָם поддерживают значение назначения руководителей; местоимение ясно связывает действие с распорядителями.
- source_word: שָׂרֵי צְבָאוֹת
  choice: военачальников
  rationale: Естественное современное русское слово передаёт начальников военных сил, не прибегая к архаичному «начальники ополчений» или громоздкому «начальники войск».
- source_word: בְּרֹאשׁ הָעָם
  choice: во главе народа
  rationale: Сохраняет образ еврейского текста и одновременно естественно выражает руководящее положение.
