lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: и отдаст его
  rationale: Глагол נתן с суффиксом 3-го лица женского рода указывает на город из контекста. Будущее время и союз «и» передают последовательность действий; русское местоимение согласовано со словом «город».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом 2-го лица мужского рода единственного числа прямо передаёт обращение к Израилю.
- source_word: בְּיָדֶךָ
  choice: в твою руку
  rationale: Сохранён еврейский образ передачи города под власть адресата; выражение понятно и по-русски.
- source_word: וְהִכִּיתָ
  choice: и ты поразишь
  rationale: В военном контексте порода hифиль глагола נכה обозначает нанесение смертельного поражения; «поразишь» сохраняет силу и форму исходного выражения без поясняющего расширения.
- source_word: כָּל זְכוּרָהּ
  choice: всех, кто в нём мужского пола
  rationale: זָכוּר обозначает лиц мужского пола, а не более узко взрослых мужчин; оборот сохраняет эту широту и суффикс, относящийся к городу.
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Устойчивый еврейский оборот буквально означает «устами меча»; выбран естественный русский эквивалент, сохраняющий образ поражающей части меча.
theological_decisions:
- issue: Прямая передача повеления о смертельном насилии в войне
  choice: 'Сохранить прямую формулировку: «ты поразишь остриём меча всех, кто в нём мужского пола»'
  alternative: Смягчить до «победишь» либо добавить объяснение о суде или священной войне
  rationale: Текст прямо связывает передачу города с Яхве и предписывает поражение всех лиц мужского пола. Перевод не смягчает тяжесть сказанного и не добавляет отсутствующего в стихе богословского обоснования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и образ «в твою руку» сохранены; архаизмы и эвфемистическое смягчение устранены.
