  text: כִּֽי תֵצֵ֨א לַ/מִּלְחָמָ֜ה עַל אֹיְבֶ֗י/ךָ וְֽ/רָאִ֜יתָ ס֤וּס וָ/רֶ֨כֶב֙ עַ֚ם רַ֣ב מִמְּ/ךָ֔ לֹ֥א תִירָ֖א מֵ/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ הַ/מַּֽעַלְ/ךָ֖ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: ru
  text: Когда ты выйдешь на войну против своих врагов и увидишь коней и колесницы[a] и народ многочисленнее тебя[b], не бойся их, потому что с тобой Яхве, твой Бог, который вывел тебя из земли Египта[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «коня и колесницу»; единственное число, вероятно, употреблено собирательно и обозначает военные силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народ больше тебя». В данном контексте речь, вероятнее всего, о численном превосходстве.'
    reason: lexical_alternative
  - marker: c
    text: 'Выражение напоминает об исходе: избавление из Египта служит основанием для уверенности Израиля.'
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: Когда ты выйдешь на войну
  rationale: כִּי при форме будущего действия вводит предполагаемую ситуацию; русское «когда» естественно передаёт её без превращения в строгое условие. «Выйдешь на войну» сохраняет древнееврейскую военную идиому.
- source_word: עַל אֹיְבֶיךָ
  choice: против своих врагов
  rationale: Предлог עַל при враждебном действии означает «против»; местоимение «своих» естественно передаёт суффикс второго лица в русском контексте.
- source_word: סוּס וָרֶכֶב
  choice: коней и колесницы
  rationale: Формы единственного числа имеют собирательное значение и обозначают рода военных сил; множественное число ясно передаёт этот смысл по-русски.
- source_word: עַם רַב מִמְּךָ
  choice: народ многочисленнее тебя
  rationale: רַב в сравнительной конструкции с מִן прежде всего указывает на численное превосходство, не сводя «народ» исключительно к армии.
- source_word: לֹא תִירָא מֵהֶם
  choice: не бойся их
  rationale: Имперфект с отрицанием в наставительном контексте выражает запрет; краткая форма естественна и точна.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяется титулом; форма «Яхве» общепринята в современной русской научной и переводческой практике.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: с тобой Яхве, твой Бог
  rationale: Порядок слов звучит естественно по-русски и сохраняет утверждение о присутствии Бога рядом с Израилем.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  choice: Который вывел тебя из земли Египетской
  rationale: Субстантивированное причастие определяет Яхве как совершившего исход. Русское «вывел из» идиоматично передаёт движение из Египта, хотя буквально глагол означает «поднял» или «возвёл».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом без внесения конфессиональной замены.
- issue: Основание призыва не бояться
  choice: присутствие Яхве и Его действие при исходе сохранены как единое основание
  alternative: истолковать выражение только как общее обещание военной победы
  rationale: Стих прямо связывает уверенность Израиля с тем, что Яхве находится с ним и вывел его из Египта; текст не следует расширять до безусловного обещания победы в любой войне.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; сохранены военная идиома, собирательность терминов и личное имя Яхве. Формула «земля Египетская» выбрана как понятная и умеренно возвышенная.
