base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: ru
  text: Только женщин, малых детей, скот и всё, что есть в городе, — всю добычу этого города — можешь взять себе; и можешь пользоваться[a] добычей своих врагов, которую отдал тебе Яхве, твой Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть добычу своих врагов». Здесь еврейский глагол может означать употребление добычи и пользование ею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничительно-исключительную силу слова по отношению к предшествующему повелению.
- source_word: הַנָּשִׁים
  choice: женщин
  rationale: Прямое обозначение женщин во множественном числе.
- source_word: הַטַּף
  choice: малых детей
  rationale: Тַף обычно обозначает маленьких детей или малолетних иждивенцев; выбранное выражение сохраняет указание на возраст.
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: В контексте военной добычи речь идёт о домашних животных; «скот» естественно и достаточно широко передаёт это значение.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: и всё, что будет в городе
  rationale: Сохраняет всеохватность כֹל и модально-временную форму יִהְיֶה, не сводя её без необходимости к простому настоящему времени.
- source_word: כָּל שְׁלָלָהּ
  choice: всю добычу из него
  rationale: שָׁלָל — военная добыча; местоименный суффикс соотнесён с городом, а «из него» звучит по-русски естественнее, чем буквальное «его добычу».
- source_word: תָּבֹז לָךְ
  choice: можешь взять себе
  rationale: Передаёт разрешительную силу глагольной формы в правовом наставлении; значение захвата добычи уже явно выражено существительным «добыча».
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: и можешь пользоваться добычей своих врагов
  rationale: Глагол אָכַל буквально означает «есть», но применительно ко всей военной добыче метонимически выражает её употребление и извлечение пользы; буквальный вариант сохранён в примечании.
- source_word: אֹיְבֶיךָ
  choice: своих врагов
  rationale: Возвратное притяжательное местоимение естественно в русском при обращении во втором лице и точно передаёт суффикс.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, представленное тетраграмматоном.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Прямое и естественное воспроизведение заветного обращения во втором лице единственного числа.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: которую отдал тебе Яхве, твой Бог
  rationale: Перфект נָתַן представляет дарование добычи как совершённое и определяющее право адресата на неё; «отдал» здесь естественно сочетается с добычей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Сила глагольных форм второго лица в правовом наставлении
  choice: разрешительное «можешь»
  alternative: предписывающее «должен»; будущее «возьмёшь / будешь пользоваться»
  rationale: В данном законодательном контексте формы разрешают Израилю забрать добычу, а не обязательно предписывают использовать каждый её предмет.
- issue: Значение אָכַל применительно к военной добыче
  choice: «пользоваться» в основном тексте с буквальным вариантом в примечании
  alternative: «есть»
  rationale: Буквальное «есть» сохраняет образ, но по-русски может ошибочно ограничить добычу пищей, хотя перечисление включает всё имущество города. Примечание сохраняет лексическую напряжённость и буквальный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис сохраняет развёрнутое перечисление и повтор слова «добыча», но избегает неестественных кальк. Обращение остаётся во втором лице единственного числа, как в еврейском тексте.
