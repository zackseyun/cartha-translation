base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: ru
  text: И если город ответит тебе миром и откроет тебе[a], то все люди, находящиеся в нём, будут нести для тебя принудительную трудовую повинность[b] и будут служить тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, имеются в виду городские ворота.
    reason: implicit_object
  - marker: b
    text: 'Или: «будут нести для тебя повинность»; еврейское слово מַס может означать повинность, дань или подневольный труд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: миром
  rationale: Существительное означает «мир, благополучие»; в контексте предложения о мире обозначает мирный ответ города, не устраняя возможный оттенок принятия условий мира.
- source_word: תַּעַנְךָ
  choice: ответит тебе
  rationale: Глагол ענה здесь имеет обычное значение «ответить, откликнуться». В русском подлежащим естественно выступает «город».
- source_word: וּפָתְחָה לָךְ
  choice: откроет перед тобой ворота
  rationale: В еврейском тексте сказано буквально «откроет тебе», а объект подразумевается. В русском для ясности и естественности восстановлено контекстуально очевидное «ворота», при этом буквальная форма отмечена в сноске.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: весь народ, который окажется в нём
  rationale: Причастие נמצא буквально связано со значением «быть найденным»; русское «который окажется в нём» естественно передаёт всех находящихся в городе людей.
- source_word: לָמַס
  choice: на принудительных работах
  rationale: מַס может обозначать повинность, дань или подневольный труд. В сочетании с последующим «будет служить тебе» здесь наиболее вероятна трудовая повинность; сноска сохраняет лексическую широту.
- source_word: וַעֲבָדוּךָ
  choice: будет служить тебе
  rationale: עבד значит «служить, работать». Формулировка сохраняет отношение подчинения, не конкретизируя его сверх текста.
theological_decisions:
- issue: Язык подчинения в законе о войне
  choice: 'Прямо передать принудительный характер труда: «будет у тебя на принудительных работах и будет служить тебе».'
  alternative: «будет платить тебе дань и служить тебе»
  rationale: Перевод не смягчает тяжесть описанного подчинения, но сноска сохраняет возможность понимать מַס как повинность или дань.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским звучанием. «Город» назван явно, поскольку русское грамматическое согласование не позволяет естественно сохранить еврейское олицетворение города формой женского рода. Формулировка остаётся понятной широкому читателю и не сглаживает принудительный характер установленной службы.
