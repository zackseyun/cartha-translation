  verdict: revise
  source_fidelity: 'Начальная часть точно передаёт условие: город «ответит миром» и «откроет». Однако добавление «перед тобой ворота» вносит отсутствующее в еврейском тексте слово и меняет лаконичную формулу; хотя ворота подразумеваются контекстом, их лучше не включать в основной текст. «Который окажется в нём» несколько смещает значение הַנִּמְצָא («находящийся, пребывающий») к случайному будущему обнаружению. «Будет у тебя на принудительных работах» передаёт принудительность מַס, но менее точно выражает статус повинности.'
  naturalness: Предлагаемая редакция сохраняет современный литературный строй. «Нести принудительную трудовую повинность» ясно выражает обязанность, налагаемую на население, и не вызывает побочной ассоциации с современной уголовной формулой «на принудительных работах».
  terminology: «Миром» уместно в контексте предложения мира. «Принудительная трудовая повинность» передаёт מַס без сведения его к одной лишь дани; сноска сохраняет возможные значения «повинность» и «дань». «Служить тебе» точно соответствует וַעֲבָדוּךָ и не привносит более специального социального статуса.
