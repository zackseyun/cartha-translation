base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: ru
  text: 'Но предай их полному уничтожению[a]: хеттеев, аморреев, хананеев, ферезеев, евеев и иевусеев, как повелел тебе Яхве, твой Бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «непременно предай их заклятию»; еврейский глагол означает полностью посвятить уничтожению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В данном контексте союз противопоставляет этот приказ разрешению щадить далёкие города в предыдущем стихе; русское «но» естественно передаёт противительный смысл.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: предай их полному уничтожению
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает приказ, а корень חרם обозначает предание заклятию, предполагающему полное уничтожение. Формулировка сохраняет как идею предания, так и тотальность действия.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: хеттеев, аморреев, хананеев, ферезеев, евеев и иевусеев
  rationale: Устоявшиеся в русской библейской традиции названия народов; формы множественного числа передают собирательное значение еврейских этнонимов в единственном числе.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: как повелел тебе
  rationale: Прямо и естественно передаёт сравнительно-относительную конструкцию и предшествующий приказ, сохраняющий силу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Естественная передача заветной формулы с местоименным суффиксом второго лица единственного числа.
theological_decisions:
- issue: Передача חרם в военном предписании
  choice: предай их полному уничтожению
  alternative: совершенно истреби их; предай их заклятию
  rationale: 'Выбранная формулировка не сводит חרם к обычному убийству: она сохраняет представление о полном предании уничтожению по Божьему повелению. Сноска поясняет специальный смысл глагола.'
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в еврейском тексте, и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повеления. Императив единственного числа сохранён. Формулировка намеренно удерживает юридико-сакральный оттенок חרם, а не заменяет его только словом «истреби».
