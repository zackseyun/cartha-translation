  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: ru
  text: Так[a] поступай со всеми городами, которые находятся очень далеко от тебя и не принадлежат этим народам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Именно так»; «Таким образом».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которые не из городов этих народов»; то есть это города, не принадлежащие народам, о которых только что шла речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: Наречие указывает на образ действий, описанный в предшествующем контексте; «так» кратко и естественно передаёт эту связь.
- source_word: תַּעֲשֶׂה
  choice: поступай
  rationale: Имперфект 2-го лица единственного числа в правовом наставлении имеет предписывающую силу. «Поступай» сохраняет директивный тон и естественно сочетается с כֵּן.
- source_word: לְכָל הֶעָרִים
  choice: со всеми городами
  rationale: Предлог לְ обозначает объекты, в отношении которых совершаются описанные действия; по-русски нормативно и естественно сказать «поступать с городами».
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: находящимися очень далеко от тебя
  rationale: Передаёт пространственное значение прилагательного, исходную точку при מִן и усилитель מְאֹד, избегая тяжеловесного буквального оборота.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: не принадлежащими к числу городов
  rationale: 'Передаёт исключающее, или партитивное, значение מִן: речь идёт о городах, не входящих в указанную далее группу.'
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: этих народов
  rationale: В данном контексте גּוֹיִם обозначает конкретные народы, упомянутые в окружающем военном законодательстве. «Народы» естественнее и не вносит позднейших оттенков слова «язычники».
- source_word: הֵנָּה
  choice: передано указательным словом «этих»
  rationale: Форма женского рода множественного числа усиливает указание на названные народы; отдельное русское слово не требуется.
theological_decisions:
- issue: Разграничение далёких городов и городов народов, названных в окружающем контексте
  choice: 'Сохранить прямое юридическое разграничение: предшествующие правила относятся к далёким городам, не входящим в число городов этих народов.'
  alternative: Расширить стих пояснением условий осады из предыдущих стихов либо смягчить его до общего высказывания об иноземных городах.
  rationale: Стих очерчивает область действия предшествующего предписания. Перевод не должен ни ослаблять его военно-правовой смысл, ни добавлять в основной текст толкование из соседних стихов.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным тоном правового наставления. Форма «поступай» обращена к Израилю как к единому адресату и сохраняет число исходного текста.
