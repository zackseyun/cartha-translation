  text: כִּֽי תִקְרַ֣ב אֶל עִ֔יר לְ/הִלָּחֵ֖ם עָלֶ֑י/הָ וְ/קָרָ֥אתָ אֵלֶ֖י/הָ לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: ru
  text: Когда подойдёшь к городу, чтобы воевать против него, предложи ему мир.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воззови к нему о мире»; возможно также: «предложи ему условия мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: когда
  rationale: В данном предписании союз вводит ожидаемую ситуацию, а не причину; «когда» естественно передаёт временно-условный смысл.
- source_word: תִקְרַב
  choice: подойдёшь
  rationale: Передаёт конкретное приближение к городу простым и современным русским глаголом.
- source_word: עִיר
  choice: к городу
  rationale: Прямое соответствие существительному в единственном числе; неопределённость в русском языке выражена отсутствием уточняющих слов.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: чтобы воевать против него
  rationale: Сохраняет цель приближения и направленность военных действий против города; «против него» устраняет возможную двусмысленность выражения «воевать с ним».
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: предложи ему мир
  rationale: Идиоматически передаёт призыв, обращённый к городу, с целью установить мир; форма повелительного наклонения естественно выражает обязательное предписание древнееврейской конструкции.
theological_decisions:
- issue: Характер обращения к городу перед сражением
  choice: предложи ему мир
  alternative: воззови к нему о мире
  rationale: Выбрана естественная формулировка без уточнения конкретных условий мира, которых сам стих ещё не излагает; тем самым не привносится дополнительная правовая или богословская конкретизация.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного наставления. Сохранено обращение ко второму лицу единственного числа и не добавлено отсутствующее в исходном тексте «тогда».
