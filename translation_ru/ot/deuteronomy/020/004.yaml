  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: ru
  text: Ибо Яхве, ваш Бог, идёт с вами, чтобы сражаться за вас против ваших врагов и спасти вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавить вас»; возможно также: «даровать вам победу». В контексте сражения еврейский глагол может означать спасение или избавление, включая победу над врагом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание предыдущего призыва и естественно передаёт пояснительно-причинный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Точно передаёт форму со суффиксом второго лица множественного числа.
- source_word: הַהֹלֵךְ
  choice: идёт
  rationale: В русском настоящая форма естественно выражает описательное и продолжающееся значение причастия; более буквальное «есть Тот, Кто идёт» здесь звучало бы тяжеловесно.
- source_word: עִמָּכֶם
  choice: с вами
  rationale: Прямо выражает Божье присутствие и сопровождение народа.
- source_word: לְהִלָּחֵם לָכֶם
  choice: чтобы сражаться за вас
  rationale: Инфинитив передаёт цель, а дательный оборот — действие в пользу Израиля.
- source_word: עִם אֹיְבֵיכֶם
  choice: против ваших врагов
  rationale: В контексте сражения עִם обозначает противостояние, поэтому по-русски требуется «против».
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: и спасти вас
  rationale: Сохраняет широкое значение корня ישׁע — спасать, избавлять; в данном военном контексте оно также подразумевает дарование победы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Объём значения לְהוֹשִׁיעַ в военном контексте
  choice: спасти вас
  alternative: избавить вас; даровать вам победу
  rationale: «Спасти» сохраняет более широкое богословское звучание глагола, тогда как контекст сражения позволяет понимать это спасение также как избавление и победу.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным звучанием. Синтаксис слегка упрощён по сравнению с формальным воспроизведением еврейского причастного оборота, при этом причинная связь, Божье сопровождение, действие в пользу Израиля и смысл спасения сохранены.
