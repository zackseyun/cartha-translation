base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: ru
  text: Только в городах этих народов, которые Яхве, твой Бог, даёт тебе в наследие, не оставляй в живых ничего дышащего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «всякое дышащее»; также возможно: «ничего, что дышит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Но
  rationale: Частица вводит противопоставленное предыдущим предписаниям исключение; русское «но» естественно передаёт эту связь.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: в городах этих народов
  rationale: Буквальное «из городов» по-русски здесь звучит неестественно; местная конструкция «в городах» ясно обозначает область действия запрета, сохраняя связь городов с указанными народами.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה
  choice: которые Яхве, твой Бог, даёт тебе в наследие
  rationale: Настоящее время передаёт значение причастия נֹתֵן, а «в наследие» сохраняет заветно-земельную лексику נַחֲלָה.
- source_word: לֹא תְחַיֶּה
  choice: не оставляй в живых
  rationale: 'Так естественно и точно передаётся каузативное значение породы piel: не позволять жить, не сохранять жизнь.'
- source_word: כָּל נְשָׁמָה
  choice: ничего дышащего
  rationale: Отрицательная русская конструкция требует «ничего»; «дышащего» сохраняет конкретный образ נְשָׁמָה и не сужает референт до одних людей.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Заветно-земельное значение נַחֲלָה
  choice: в наследие
  alternative: во владение
  rationale: «Наследие» сохраняет богословскую и заветную окраску дара земли, не сводя его к простому владению.
- issue: Объём выражения כָּל נְשָׁמָה
  choice: ничего дышащего
  alternative: ни одной души
  rationale: Выбранная формулировка сохраняет телесный образ дыхания и не вводит позднейшее понимание «души» как нематериальной части человека.
translation_notes:
  register: Современный литературный русский язык; повеление сформулировано прямо и сдержанно. Синтаксис сохраняет связь с предшествующим контрастом, а тяжёлое содержание стиха не смягчается и не расширяется толкованием.
