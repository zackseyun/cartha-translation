base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: ru
  text: И кто насадил виноградник, но ещё не воспользовался им[a]? Пусть он уйдёт и вернётся домой, чтобы не погибнуть в бою и чтобы другой человек не воспользовался этим виноградником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу данного оборота: «не ввёл его в обычное употребление». Речь, вероятно, о том, что хозяин ещё не успел воспользоваться урожаем виноградника после первых лет, когда его плоды нельзя было употреблять (ср. Левит 19:23–25).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: И кто
  rationale: В контексте перечисления освобождаемых от военной службы эта естественная русская вопросительная формула передаёт еврейское «и кто тот человек», не вводя отсутствующего в оригинале «из вас».
- source_word: נָטַע כֶּרֶם
  choice: насадил виноградник
  rationale: «Насадил виноградник» — устойчивое и понятное по-русски сочетание, точно передающее завершённое действие נָטַע.
- source_word: וְלֹא חִלְּלוֹ
  choice: но ещё не начал пользоваться им
  rationale: В данном контексте חלל обозначает начало обычного пользования виноградником, вероятно получение пользы от его урожая после установленных первых лет. Формулировка не добавляет прямо не названные в стихе «плоды» и сопровождается пояснением.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Пусть он уйдёт и вернётся домой
  rationale: Форма передаёт предписывающее значение еврейской последовательности глаголов и сохраняет оба действия — уход и возвращение.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: чтобы не погибнуть в бою
  rationale: Естественно передаёт предупредительно-предотвратительное значение פֶּן; «погибнуть в бою» в современном русском звучит естественнее буквального «умереть в битве».
- source_word: וְאִישׁ אַחֵר
  choice: и чтобы другой человек
  rationale: Сохраняет явно выраженное איש и противопоставление первоначальному владельцу.
- source_word: יְחַלְּלֶנּוּ
  choice: не начал пользоваться этим виноградником
  rationale: Повторяет тот же контекстуальный смысл חלל. Существительное повторено вместо местоимения, чтобы в русском ясно обозначить объект действия.
