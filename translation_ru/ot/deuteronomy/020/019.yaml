source:
  edition: WLC
  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: ru
  text: Когда ты много дней будешь держать город в осаде, воюя против него, чтобы овладеть им, не губи его деревьев, пуская в ход против них топор, ведь ты можешь есть с них; не руби их. Разве дерево в поле — человек, чтобы выходить против тебя при осаде?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь человек — дерево полевое»; возможно также: «ведь полевое дерево служит человеку пищей». Еврейский текст заключительной части стиха труден; в основном тексте она понята как риторический вопрос, противопоставляющий дерево человеку-противнику.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר אֶל־עִיר
  choice: будешь держать город в осаде
  rationale: Передаёт военное значение глагола צור естественным современным русским выражением.
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Сохраняет конкретную временную формулировку еврейского текста, не обобщая её до «долгое время».
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: воюя против него, чтобы овладеть им
  rationale: Сохраняет и военное действие, и цель осады; «овладеть городом» естественно для русского военного контекста.
- source_word: לֹא תַשְׁחִית אֶת־עֵצָהּ
  choice: не губи его деревьев
  rationale: Глагол «губить» ясно передаёт причинение деревьям гибели и сохраняет запретительную форму; родительный падеж после отрицания звучит литературно.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: пуская в ход против них топор
  rationale: Еврейский оборот идиоматичен; выбранная формулировка естественно обозначает применение топора к деревьям, сохраняя направленность действия.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: ведь ты можешь питаться их плодами
  rationale: Контекст указывает на плодовые деревья. Упоминание плодов делает подразумеваемый смысл ясным по-русски, не предполагая поедания самой древесины.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: не руби их
  rationale: Кратко и естественно передаёт обычный глагол рубки деревьев; множественное число согласовано с русским «деревьев».
- source_word: הָאָדָם עֵץ הַשָּׂדֶה
  choice: Разве дерево в поле — человек
  rationale: Формулировка сохраняет оба образа и передаёт трудную конструкцию как риторический вопрос, не включая толкование в сам текст.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: чтобы выступать против тебя при осаде
  rationale: Передаёт дерево как немыслимого участника военного противостояния и делает риторический вопрос понятным, оставаясь близко к военному контексту.
theological_decisions:
- issue: Толкование трудной заключительной фразы כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: Риторический вопрос, противопоставляющий дерево человеку-противнику
  alternative: Утверждение «ведь человек — дерево полевое» или объяснение «ведь полевое дерево служит человеку пищей»
  rationale: Синтаксис еврейского текста допускает несколько пониманий. Риторический вопрос хорошо соответствует непосредственному военному контексту, однако подлинная неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Военная терминология ясна обычному читателю; архаизмы и конфессионально окрашенные формулировки не используются. Маркер примечания поставлен непосредственно после трудной заключительной фразы, к которой относится примечание.
