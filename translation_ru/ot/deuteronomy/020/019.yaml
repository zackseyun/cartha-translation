revisions:
- from: Когда ты много дней будешь держать город в осаде, воюя против него, чтобы овладеть им, не губи его деревьев, пуская в ход против них топор, ведь ты можешь питаться их плодами; не руби их. Разве дерево в поле — человек, чтобы выступать против тебя при осаде?[a]
  to: Когда ты много дней будешь держать город в осаде, воюя против него, чтобы овладеть им, не губи его деревьев, пуская в ход против них топор, ведь ты можешь есть с них; не руби их. Разве дерево в поле — человек, чтобы выходить против тебя при осаде?[a]
  rationale: 'Убрано невыраженное в оригинале слово «плоды»: «есть с них» по-русски ясно относится к тому, что дают деревья, но не уточняет текст сверх необходимого. В заключительной фразе «выходить против тебя» точнее отражает военный образ в избранном риторическом прочтении. Примечание и его якорь сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:02:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: осада города, запрет губить деревья топором и запрет срубать их сохранены. Однако «питаться их плодами» прямо добавляет слово «плоды», которого в еврейском тексте нет; полезность деревьев для пищи выражена формулой «от него будешь есть».'
  naturalness: Текст в целом современный и литературный. «Есть с этих деревьев» естественно подразумевает их съедобный урожай, не называя его эксплицитно. «Выходить против тебя» яснее передаёт военный смысл заключительного трудного оборота, чем несколько расплывчатое «выступать против тебя».
  terminology: «Держать город в осаде», «овладеть им», «губить», «рубить» уместны и нейтральны. Риторический вопрос и примечание сохраняют подлинную неоднозначность трудной еврейской конструкции без конфессионального истолкования.
  issues:
