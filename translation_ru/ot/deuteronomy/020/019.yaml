  - severity: low
    issue: «Выступать против тебя» менее конкретно передаёт образ выхода навстречу противнику.
    rationale: Для לָבֹא מִפָּנֶיךָ в принятом риторическом прочтении «выходить против тебя» естественнее сохраняет военный образ, не усиливая его.
