  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: ru
  text: Под вечер пусть он омоется водой, а когда зайдёт солнце[a], может войти внутрь лагеря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда войдёт солнце» — древнееврейское выражение, означающее закат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לִפְנוֹת עֶרֶב
  choice: К вечеру
  rationale: Сочетание с פנה указывает на приближение вечера; вводное וְהָיָה продолжает последовательность предписаний и не требует отдельного перевода.
- source_word: יִרְחַץ בַּמָּיִם
  choice: пусть он омоется водой
  rationale: Глагол רחץ в данном контексте обозначает телесное омовение; «омоется водой» естественно передаёт подразумеваемое возвратное значение и сохраняет ритуальный оттенок.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: а когда зайдёт солнце[a]
  rationale: Буквально еврейское выражение говорит о том, что солнце «входит», но это устойчивое обозначение заката. Русское «зайдёт солнце» естественно и близко к образу оригинала.
- source_word: יָבֹא
  choice: может войти
  rationale: В последовательности закона форма обозначает разрешённое возвращение после омовения и заката, а не только будущее действие.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: войти внутрь лагеря
  rationale: Слово תּוֹךְ подчёркивает вход во внутреннее пространство лагеря; «внутрь лагеря» сохраняет эту смысловую деталь без архаичного «стан».
theological_decisions:
- issue: Модальное значение יָבֹא после исполнения требований очищения
  choice: может войти
  alternative: пусть войдёт / войдёт
  rationale: Контекст допускает оттенок предписания или простого будущего, однако последовательность условий прежде всего выражает разрешение вновь войти в лагерь. Перевод не добавляет утверждений о природе ритуального очищения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным оттенком. «Лагерь» выбран вместо архаичного «стан»; «омоется» сохраняет ритуальный контекст, оставаясь понятным современному читателю.
