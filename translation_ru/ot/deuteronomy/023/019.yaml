    issue: Неоднозначное выражение «плата блудницы».
    rationale: Оно может быть понято как сумма, уплаченная блуднице, а не как её доход. אֶתְנַן זוֹנָה обозначает плату, полученную проституткой за её услуги.
  - severity: medium
    issue: Сноска передаёт альтернативу как «плату мужчины-проститутки».
    rationale: Для соответствия параллельному אֶתְנַן и английскому аудиторскому следу требуется «заработок мужчины-проститутки»; «плата мужчины-проститутки» остаётся двусмысленной.
