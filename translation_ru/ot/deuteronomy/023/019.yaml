  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: ru
  text: Не вноси в дом Яхве, твоего Бога, ни заработка проститутки, ни цены пса[a] во исполнение какого бы то ни было обета, потому что и то и другое — мерзость для Яхве, твоего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «заработок мужчины-проститутки», если слово «пёс» здесь употреблено как презрительное обозначение мужчины, занимавшегося культовой проституцией.'
    reason: Альтернативное толкование спорного выражения מְחִיר כֶּלֶב.
lexical_decisions:
- source_word: תָבִיא
  choice: вноси
  rationale: Порода hифиль глагола בוא означает внесение чего-либо внутрь определённого места; «вноси» естественно передаёт движение в дом Яхве.
- source_word: אֶתְנַן זוֹנָה
  choice: плата блудницы
  rationale: אֶתְנַן — плата за услуги, а זוֹנָה — блудница, женщина, занимающаяся проституцией. Краткое сочетание сохраняет прямоту и юридическую форму исходного текста.
- source_word: מְחִיר כֶּלֶב
  choice: цена пса
  rationale: מְחִיר обычно означает цену, а כֶּלֶב буквально — «пёс, собака». Основной текст сохраняет буквальное значение спорного выражения, не подменяя его толкованием.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: дом Яхве, твоего Бога
  rationale: בֵּית буквально означает «дом»; перевод «храм» был бы более узким и мог бы внести лишнюю историческую конкретизацию. Имя יהוה передано как «Яхве».
- source_word: לְכָל נֶדֶר
  choice: во исполнение какого бы то ни было обета
  rationale: Предлог לְ указывает здесь на назначение приношения, связанного с обетом. Эта формулировка естественна по-русски и передаёт всеохватность כָּל.
- source_word: תוֹעֲבַת
  choice: мерзость
  rationale: Слово обозначает нечто отвратительное и неприемлемое перед Богом; «мерзость» сохраняет силу правового и богословского осуждения.
- source_word: גַּם שְׁנֵיהֶם
  choice: и то и другое
  rationale: Фраза подчёркивает, что осуждение относится к обоим названным видам платы; русское выражение ясно сохраняет это включающее ударение.
theological_decisions:
- issue: Значение כֶּלֶב в выражении מְחִיר כֶּלֶב
  choice: 'В основном тексте перевести буквально: «пёс».'
  alternative: «мужчина-проститутка» или презрительное обозначение культового мужчины-проститутки
  rationale: Лексическое значение כֶּלֶב — «пёс, собака», тогда как переносное значение в этом месте остаётся спорным. Буквальный перевод сохраняет неоднозначность источника, а возможное переносное понимание отмечено в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено имя יהוה. Форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского предписания. Конструкция «ни… ни…» естественно оформляет единый запрет, а «пёс» сохраняет мужской род еврейского כֶּלֶב и возможность переносного смысла.
