base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: ru
  text: Но если ты дашь обет Яхве, твоему Богу, не медли исполнить его, потому что Яхве, твой Бог, непременно потребует его от тебя, и на тебе будет грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты будешь виновен в грехе». Буквально: «и будет в тебе грех».'
    reason: 'Лексико-синтаксическая альтернатива: еврейский оборот обозначает возникшую вследствие неисполненного обета греховную вину.'
lexical_decisions:
- source_word: כִּי
  choice: Но если
  rationale: В контексте частица вводит условие и одновременно слегка противопоставляет этот случай сказанному в предыдущем стихе о том, что не давать обета — не грех.
- source_word: תִדֹּר נֶדֶר
  choice: дашь обет
  rationale: Сочетание глагола נדר с однокоренным дополнением естественно передаётся по-русски устойчивым выражением «дать обет».
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твоему Богу
  rationale: Предлог указывает, кому даётся обет; личное имя יהוה передано как «Яхве».
- source_word: לֹא תְאַחֵר
  choice: не медли
  rationale: Отрицательная форма в правовом наставлении выражает запрет; краткое «не медли» естественно и точно передаёт идею недопустимой задержки.
- source_word: לְשַׁלְּמוֹ
  choice: исполнить его
  rationale: В контексте обета שלם означает выполнить взятое обязательство. «Исполнить» охватывает как принесение обещанного дара, так и иные формы выполнения обета.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: непременно потребует его
  rationale: Инфинитив абсолютный при личной форме глагола усиливает утверждение; «непременно» сохраняет эту эмфазу, а «потребует» соответствует правовому контексту.
- source_word: מֵעִמָּךְ
  choice: от тебя
  rationale: Оборот указывает на человека, с которого Яхве взыщет исполнение обета; это наиболее ясная современная русская формулировка.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: и на тебе будет грех
  rationale: Формулировка сохраняет компактный образ еврейского текста и не сводит его без пояснения только к абстрактной виновности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблено тетраграмматическое имя Бога; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл выражения וְהָיָה בְךָ חֵטְא
  choice: на тебе будет грех
  alternative: ты будешь виновен в грехе; это будет тебе в грех
  rationale: Буквальная конструкция допускает понимание греха как лежащей на человеке вины. Основной текст сохраняет образность и богословское напряжение, а сноска поясняет смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным правовым звучанием. Сохранено обращение на «ты», соответствующее форме единственного числа в еврейском тексте. Слово «обет» оставлено как общеупотребительное религиозно-правовое понятие.
