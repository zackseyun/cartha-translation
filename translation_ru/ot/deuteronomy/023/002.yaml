  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: ru
  text: Мужчина с раздавленными яичками или отсечённым половым членом не должен входить в собрание Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «войти в собрание Яхве» может относиться к полноправному участию в общине завета Израиля; точный объём этого ограничения остаётся предметом споров.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָבֹא
  choice: не должен входить
  rationale: В данном правовом контексте отрицание с глаголом בוא выражает запрет. Формулировка «не должен входить» естественно передаёт нормативный смысл, не превращая его в утверждение о физической невозможности.
- source_word: פְצוּעַ דַּכָּא
  choice: тот, у кого раздавлены яички
  rationale: Сочетание обозначает мужчину с мужскими половыми органами, повреждёнными раздавливанием. Прямое анатомическое обозначение точнее расплывчатого «повреждены половые органы» и понятнее традиционных эвфемизмов.
- source_word: וּכְרוּת שָׁפְכָה
  choice: или отсечён половой член
  rationale: Оборот обозначает отсечение мужского полового органа. Союз передан как «или», поскольку перечислены две различные формы увечья.
- source_word: בִּקְהַל
  choice: в собрание
  rationale: קהל означает собранное сообщество или собрание. «Собрание» сохраняет правовой и общинный оттенок и не вносит позднейших церковных ассоциаций.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Смысл исключения из «собрания Яхве»
  choice: Фраза переведена буквально, без уточнения конкретной области и последствий исключения.
  alternative: Уточнить как запрет на участие в богослужебном собрании, полноправное членство в общине Израиля либо гражданско-брачные права.
  rationale: Сам стих не определяет точный объём выражения. Перевод сохраняет эту неоднозначность и не приписывает запрету более поздних сотериологических или церковных последствий.
translation_notes:
  register: Современный литературный русский язык; формулировка прямая и анатомически точная, но без нарочитой грубости. Правовой запрет передан конструкцией «не должен входить».
