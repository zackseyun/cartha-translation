  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: ru
  text: Дети, которые родятся у них в третьем поколении, могут войти в собрание Яхве[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья»; в этом юридико-родословном контексте слово относится к детям или потомкам в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или более буквально: «третье поколение войдёт»; в данном правовом контексте смысл состоит в том, что вступление разрешается начиная с третьего поколения.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: Дети
  rationale: Буквально еврейское слово означает «сыновья», однако в данном юридико-родословном контексте оно обозначает потомство в целом. «Дети» сохраняет семейный образ и не сужает смысл только до лиц мужского пола.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: которые родятся у них
  rationale: Страдательная форма ילד с предлогом ל естественно передаётся как «родятся у них»; относительное местоимение сохраняет структуру и ясность исходной фразы.
- source_word: דּוֹר שְׁלִישִׁי
  choice: в третьем поколении
  rationale: Выражение указывает на поколение, начиная с которого допускается вступление в собрание.
- source_word: יָבֹא
  choice: могут войти
  rationale: Буквально глагол означает «войдёт/придёт». В юридическом контексте модальная передача «могут войти» естественно выражает разрешение, не превращая норму в простое предсказание.
- source_word: בִּקְהַל
  choice: в собрание
  rationale: קהל обозначает собранную общину, особенно в заветном и правовом контексте. «Собрание» сохраняет этот общественный смысл и звучит современно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что непосредственно отражает форму исходного текста.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Объём значения בָּנִים в юридико-родословном контексте
  choice: Дети
  alternative: Сыновья; потомки
  rationale: Форма грамматически мужского рода множественного числа, но здесь относится к продолжению рода. «Дети» сохраняет конкретный семейный смысл, тогда как «сыновья» может неоправданно сузить круг лиц, а «потомки» ослабляет буквальный образ.
- issue: Модальность формы יָבֹא
  choice: могут войти
  alternative: войдут; пусть войдут
  rationale: Форма сама по себе буквально означает «войдёт», но в правовом контексте выражает допустимость вступления. Основной текст передаёт этот смысл, а формальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой и ясной правовой формулировкой. Сохранены родословная конкретность, название общинного собрания и личное имя Бога; буквальная модальность и мужская форма исходного слова отражены в сносках.
