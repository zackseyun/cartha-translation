  text: לַ/נָּכְרִ֣י תַשִּׁ֔יךְ וּ/לְ/אָחִ֖י/ךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְ/ךָ֜ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹל֙ מִשְׁלַ֣ח יָדֶ֔/ךָ עַל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: ru
  text: С иноземца можешь взимать проценты[a], но с брата своего не взимай процентов[b], чтобы Яхве, Бог твой, благословил тебя во всех твоих начинаниях в стране, в которую ты входишь, чтобы овладеть ею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «давать взаймы под проценты»; традиционное «брать лихву» может подразумевать чрезмерный или неправедный процент, чего само еврейское слово здесь не уточняет.'
    reason: lexical_alternative
  - marker: b
    text: «Брат» здесь — соплеменник, член народа Израиля; еврейский текст сохраняет родственное наименование.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: с иноземца
  rationale: נָכְרִי обозначает чужеземца, не принадлежащего к народу Израиля. «Иноземец» ясно передаёт правовой и общественный контраст со словом «брат» и сохраняет достойный литературный регистр.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: можешь взимать проценты / не взимай процентов
  rationale: В породе хифиль глагол נשׁך здесь означает налагать или взыскивать процент по займу. «Взимать проценты» естественно для современного русского языка и не вносит заложенной в слове «лихва» дополнительной моральной оценки.
- source_word: אָחִיךָ
  choice: брата своего
  rationale: Сохранён буквальный родственный образ еврейского текста. В данном законодательном контексте речь идёт о соплеменнике, члене Израиля; это пояснено в сноске.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз передаёт целевое, допускающее также оттенок результата, отношение между повелением и последующим благословением.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: чтобы Яхве, Бог твой, благословил тебя
  rationale: Имя יהוה передано как «Яхве», а форма глагола в целевой конструкции — естественным русским сослагательным оборотом после «чтобы».
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: во всяком деле рук твоих
  rationale: Сохранён еврейский образ руки как обозначение человеческого труда и начинаний; формулировка понятна и соответствует возвышенному законодательному стилю.
- source_word: עַל הָאָרֶץ
  choice: в земле
  rationale: Хотя предлог עַל буквально может означать «на», в русском контексте пребывания и деятельности естественно «в земле».
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: в которую ты входишь, чтобы овладеть ею
  rationale: «Входишь» передаёт движение в землю, а отдельный целевой оборот сохраняет значение инфинитива לְרִשְׁתָּהּ — вступить во владение.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Объём понятия «брат» в законе о процентах
  choice: Сохранить «брат», пояснив его контекстуальное значение в сноске
  alternative: Израильтянин; соплеменник
  rationale: Так сохраняется родственная и заветная образность текста без ошибочного ограничения значения биологическим братом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Местоимения при обращении к человеку оставлены со строчной буквы; инверсия «Бог твой», «рук твоих» поддерживает достоинство юридико-заветного контекста, не делая текст архаичным.
