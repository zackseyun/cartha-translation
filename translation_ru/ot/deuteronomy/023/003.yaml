  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: ru
  text: Человек, рождённый от запретного союза[a], не допускается в собрание Яхве; ни один из его потомков — даже в десятом поколении — не допускается в собрание Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово מַמְזֵר (мамзер) имеет не вполне ясное значение. Традиционный перевод — «незаконнорождённый»; вероятно, речь идёт о человеке, рождённом от запрещённого союза, или о человеке с иным исключённым по происхождению статусом.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: рождённый от запретного союза
  rationale: Точное значение редкого еврейского термина спорно. В данном правовом контексте он, вероятно, обозначает человека, чьё рождение связано с запрещённым союзом или влечёт исключённый родовой статус. Этот перевод точнее традиционного «незаконнорождённый» и не предполагает, будто речь непременно идёт о любом рождении вне брака.
- source_word: יָבֹא
  choice: не может войти
  rationale: Глагол буквально означает «войти, прийти». В формулировке запрета конструкция естественно передаётся по-русски как «не может войти», то есть не допускается к участию.
- source_word: קְהַל יְהוָה
  choice: собрание Яхве
  rationale: קָהָל обозначает собравшуюся общину народа; «собрание» сохраняет общественный и заветный характер выражения без излишне конфессиональной окраски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: даже в десятом поколении
  rationale: Формула указывает на продолжительность родового ограничения; русский оборот сохраняет усилительное גַּם и прямое упоминание десятого поколения.
- source_word: לֹא יָבֹא לוֹ
  choice: никто из его потомков не может войти
  rationale: На фоне упоминания поколений местоименный оборот לוֹ относится к принадлежащим его роду. Экспликация «никто из его потомков» ясно передаёт это по-русски, хотя буквальная форма менее определённа.
theological_decisions:
- issue: Значение выражения «собрание Яхве»
  choice: Сохранить формулировку без уточнения, идёт ли речь о богослужебном, правовом или полном общинном участии
  alternative: Передать как «община Яхве» или конкретизировать вид допуска
  rationale: Сам стих не определяет точные границы понятия קְהַל יְהוָה; конкретизация могла бы преждевременно разрешить историко-богословский вопрос.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет эту особенность.
translation_notes:
  register: Современный литературный русский язык с краткой и строгой правовой формулировкой. Устаревшее и уничижительное «незаконнорождённый» вынесено в примечание как традиционный вариант; неоднозначность редкого термина не скрыта.
