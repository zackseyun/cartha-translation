base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: ru
  text: Пусть он живёт у тебя, в твоей среде, в том месте, которое выберет, в одном из твоих городов[a], где ему будет хорошо. Не притесняй его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в одних твоих воротах», то есть в пределах одного из твоих городов. В древнееврейском языке «ворота» могут обозначать город или местную общину.'
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: пусть он живёт
  rationale: Глагол обозначает пребывание или проживание; в данном правовом контексте речь идёт о разрешённом постоянном поселении.
- source_word: עִמְּךָ
  choice: у тебя
  rationale: Передаёт буквальное «с тобой» естественным русским выражением применительно к проживанию, сохраняя обращение к Израилю в единственном числе.
- source_word: בְּקִרְבְּךָ
  choice: среди вас
  rationale: Выражение означает нахождение внутри общины. Множественное «вас» естественно указывает на народ, хотя древнееврейская форма грамматически единственного числа.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: в том месте, которое выберет
  rationale: Сохраняет прямой смысл личного выбора места беглым рабом из предыдущего стиха.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: в одном из твоих городов
  rationale: «Ворота» здесь метонимически обозначают город или поселение; буквальная калька по-русски могла бы ошибочно означать пространство внутри ворот.
- source_word: בַּטּוֹב לוֹ
  choice: где ему будет хорошо
  rationale: Естественно передаёт буквальное «в хорошем для него», не сводя значение только к субъективному удовольствию.
- source_word: לֹא תּוֹנֶנּוּ
  choice: не притесняй его
  rationale: В правовом контексте глагол означает угнетать, притеснять или использовать уязвимого человека; «притеснять» сохраняет социальную и нравственную силу запрета.
theological_decisions:
- issue: Референт форм мужского рода единственного числа
  choice: 'Сохранён мужской род единственного числа: «он», «его».'
  alternative: Гендерно-нейтральное обозначение лица.
  rationale: Формы древнееврейского текста относятся к отдельному беглому рабу из предыдущего стиха и последовательно стоят в мужском роде единственного числа.
- issue: Субъект выбора места
  choice: Место выбирает сам беглый раб.
  alternative: Место назначает община или Господь.
  rationale: У ближайшего контекста и грамматики нет смены субъекта; местоименные формы продолжают относиться к человеку из предыдущего стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством правового наставления. Императив передан формами «пусть живёт» и «не притесняй». Сочетание «у тебя, среди вас» сохраняет повтор исходного текста и одновременно естественно раскрывает коллективный смысл обращения к Израилю.
