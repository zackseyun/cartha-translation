  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: ru
  text: Ни один мужчина не должен брать себе жену своего отца[a] и открывать край одежды своего отца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брать в жёны жену своего отца».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «открывать край одежды своего отца». Это сексуальный эвфемизм; возможный смысл: «обнажать наготу своего отца» или «посягать на брачное ложе своего отца».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: брать себе
  rationale: Глагол לָקַח с существительным «жена» может означать «брать в жёны». Формулировка «брать себе» сохраняет образ еврейского текста и допускает брачный смысл, не делая его единственно возможным.
- source_word: אִישׁ
  choice: никто
  rationale: Отрицательная правовая формула לֹא יִקַּח אִישׁ естественно передаётся по-русски как «никто не должен брать»; речь в контексте идёт о мужчине.
- source_word: אֵשֶׁת אָבִיו
  choice: жену своего отца
  rationale: Передаёт конструкцию буквально и не сужает её до слова «мачеха», которое предполагает более конкретное родственное положение.
- source_word: יְגַלֶּה
  choice: открывать
  rationale: Глагол גלה означает «открывать, обнажать» и здесь входит в сексуальный эвфемизм; выбранное слово сохраняет метафору.
- source_word: כְּנַף
  choice: край одежды
  rationale: כָּנָף может обозначать крыло, край или полу одежды. «Край одежды» понятно современному читателю и сохраняет образ без буквального, но потенциально вводящего в заблуждение слова «крыло».
theological_decisions:
- issue: Следует ли раскрывать сексуальный смысл эвфемизма непосредственно в основном тексте
  choice: Сохранить метафору «открывать край одежды своего отца»
  alternative: «обнажать наготу своего отца» или «посягать на брачное ложе своего отца»
  rationale: В еврейском тексте употреблено כְּנַף, «край одежды», а не обычное слово «нагота». Сохранение необычной метафоры не устраняет заложенную в оригинале неоднозначность; её сексуально-брачный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством правовой формулы. «Никто не должен» звучит естественнее буквального «мужчина не должен», а «край одежды» сохраняет конкретный, намеренно эвфемистический образ оригинала.
