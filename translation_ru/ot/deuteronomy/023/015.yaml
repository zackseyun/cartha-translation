  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: ru
  text: Ибо Яхве, твой Бог, ходит среди твоего стана, чтобы избавить тебя и предать твоих врагов в твои руки. Поэтому твой стан должен быть свят, чтобы Он не увидел среди тебя ничего непристойного[a] и не отвернулся от тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нагота дела (вещи)». Выражение широко и может обозначать нечто постыдное, непристойное или оскверняющее стан.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и повернёт назад от-за тебя»; то есть отступит от тебя. Этот образ означает, что Яхве перестаёт сопровождать стан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его заветный характер и отличая его от титула «Господь».
- source_word: מִתְהַלֵּךְ
  choice: ходит
  rationale: Сохраняет конкретный антропоморфный образ деятельного присутствия Бога в стане.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: среди твоего стана
  rationale: Естественно передаёт пребывание внутри стана; единственное число сохраняет обращение к Израилю как к одному целому.
- source_word: לְהַצִּילְךָ
  choice: чтобы избавлять тебя
  rationale: Соответствует военному контексту спасения от врагов и не сужает смысл до одного отдельного события.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: и предавать тебе твоих врагов
  rationale: Передаёт смысл еврейской идиомы — отдавать врагов во власть Израиля — естественным современным русским языком.
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: Поэтому твой стан должен быть свят
  rationale: Выражает следствие присутствия Яхве и предписывающую силу фразы, а не простое предсказание.
- source_word: עֶרְוַת דָּבָר
  choice: ничего непристойного
  rationale: Сохраняет широкое значение выражения, которое может обозначать постыдное или ритуально оскверняющее обстоятельство, а не только буквальную наготу.
- source_word: וְלֹא יִרְאֶה בְךָ
  choice: чтобы Он не увидел среди тебя
  rationale: Естественно выражает цель или возможный результат требования святости и сохраняет собирательное обращение к Израилю.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: и не отвернулся от тебя
  rationale: Передаёт образ прекращения Божьего сопровождающего присутствия, не добавляя прямо отсутствующего глагола «следовать».
theological_decisions:
- issue: Антропоморфное описание присутствия Яхве
  choice: Сохранить конкретное «ходит среди твоего стана»
  alternative: 'Передать отвлечённо: «присутствует в твоём стане»'
  rationale: Исходный текст намеренно использует образ движения, подчёркивая близость Бога и необходимость святости, но не утверждая телесность Бога.
- issue: Сила требования о святости стана
  choice: «твой стан должен быть свят»
  alternative: «твой стан будет свят»
  rationale: 'Контекст придаёт фразе предписывающий смысл: из присутствия и помощи Яхве вытекает обязанность хранить стан святым.'
- issue: Смысл ухода Яхве
  choice: «не отвернулся от тебя» с пояснительной сноской
  alternative: «не перестал следовать за тобой»
  rationale: Основной текст не вводит отсутствующий в еврейском глагол «следовать», а сноска сохраняет пространственный образ Бога, сопровождающего стан сзади.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Слово «стан» сохранено как понятное в военном контексте; синтаксис сделан естественным без устранения антропоморфизма и смысловой широты выражения עֶרְוַת דָּבָר.
