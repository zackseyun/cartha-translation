  source_fidelity: 'Смысл передан верно: условное установление касается мужчины, ставшего ритуально нечистым вследствие ночного семяизвержения; предписано удалиться за пределы стана и не входить в его внутреннее пространство. В исходном тексте два отдельных правовых предписания, что лучше отразить двумя параллельными формами.'
  naturalness: «Ночное излияние» в современном литературном русском слишком неопределённо и может означать иные выделения; «ночное семяизвержение» ясно, нейтрально и соответствует идиоматическому значению еврейского выражения. Формулировка «он должен выйти ... и не входить» несколько сглаживает два самостоятельных предписания; параллельное «должен ...; не должен ...» естественнее и точнее.
  terminology: «Нечистый» уместен как традиционный термин ритуального статуса и не должен пониматься как нравственное обвинение. «Стан» точно передаёт מַחֲנֶה в данном военно-лагерном контексте. «Мужчина» оправдан спецификой описываемого состояния.
