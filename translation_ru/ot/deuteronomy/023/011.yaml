base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: ru
  text: Если среди вас окажется мужчина, нечистый из-за ночного семяизвержения[a], он должен выйти за пределы стана; внутрь стана он не должен входить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за случая ночью»; это выражение означает ночное семяизвержение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном правовом установлении вводит условный случай; «если» естественно передаёт казуистическую конструкцию.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: среди вас окажется мужчина
  rationale: Передаёт экзистенциальное употребление היה с בך; «мужчина» уместно, поскольку речь идёт о специфическом мужском телесном состоянии.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: который нечист
  rationale: «Нечист» обозначает ритуальное состояние и не предполагает нравственной вины; это устоявшийся и понятный библейский термин.
- source_word: מִקְּרֵה לָיְלָה
  choice: из-за ночного излияния
  rationale: Еврейское выражение буквально означает «случай ночью» и в контексте обозначает ночное семяизвержение; выбранная формулировка точна, сдержанна и понятна.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: он должен выйти за пределы стана
  rationale: Передаёт обязательную силу правового предписания и движение за границу стана естественным современным русским языком.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: и не входить внутрь стана
  rationale: Сохраняет оттенок תּוֹךְ — внутреннее пространство стана, а не только пересечение его внешней границы.
theological_decisions:
- issue: Характер нечистоты в стихе
  choice: Передать её как ритуальную нечистоту, не подразумевающую нравственной вины.
  alternative: Истолковать нечистоту как свидетельство нравственного проступка.
  rationale: Контекст регулирует святость стана и телесные состояния. Сам текст не называет это состояние грехом, поэтому перевод не должен привносить нравственное осуждение.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского установления. Термин «стан» сохранён как понятное традиционное обозначение лагеря Израиля; формулировка избегает как эвфемистической неясности, так и излишне клинического звучания.
