  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: ru
  text: 'Не взимай с брата твоего процентов: процентов с денег[a], процентов с пищи и процентов за любой предмет, отданный в долг под проценты.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, традиционно передаваемое как «лихва», означает проценты по займу вообще, а не только чрезмерные или незаконные проценты.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: не давай ... в долг под проценты
  rationale: Хифиль глагола נשׁך в данном контексте запрещает кредитору давать с взиманием процентов. Эта формулировка естественна для современного русского языка и сохраняет перспективу заимодавца.
- source_word: לְאָחִיךָ
  choice: брату твоему
  rationale: Буквально «твоему брату». Сохранено семейно-заветное обозначение члена своего народа, без замены его более толковательным выражением.
- source_word: נֶשֶׁךְ
  choice: под проценты
  rationale: Слово обозначает процент, взимаемый по займу, а не только чрезмерный или незаконный рост; поэтому «проценты» точнее, чем более узкое и архаичное «лихва».
- source_word: כֶּסֶף
  choice: серебро
  rationale: Сохранено конкретное исходное значение слова и материально-экономический образ древнего текста; функциональное значение «деньги» отмечено в сноске.
- source_word: אֹכֶל
  choice: пища
  rationale: Общее обозначение еды или продовольствия; «пища» соответствует достоинству законодательного регистра и остаётся понятным.
- source_word: כָּל דָּבָר
  choice: что-либо другое
  rationale: Передаёт всеохватность выражения и естественно завершает перечень после серебра и пищи.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: что можно дать в долг под проценты
  rationale: Еврейская конструкция допускает понимание предмета как того, на что начисляют процент или что дают под процент. Русская формулировка явно связывает относительное предложение с практикой процентного займа, не ограничивая его деньгами.
theological_decisions:
- issue: Круг лиц, обозначенный словом «брат»
  choice: Сохранить буквальное «брату твоему».
  alternative: «Соплеменнику твоему» или «соотечественнику твоему».
  rationale: Контекст закона указывает на члена заветного народа, однако буквальная семейная метафора богословски значима и не должна без необходимости заменяться толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Инверсия «брату твоему» сохраняет библейский оттенок без чрезмерной архаизации; конструкция «давать в долг под проценты» понятна обычному читателю.
