  register: Современный литературный русский язык с ясной правовой формулировкой. «Ближний» сохраняет достоинство библейского регистра, а «можешь есть» отличает разрешение от повеления. Подлинная временно-условная неоднозначность כִּי и обобщённость כְּלִי сохранены в сносках.
