base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: ru
  text: Когда войдёшь в виноградник своего ближнего[a], можешь есть виноград, сколько захочешь, досыта[b], но не клади виноград в свой сосуд[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если войдёшь в виноградник своего ближнего». Еврейская частица может вводить как временное, так и условное придаточное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по желанию твоей души, до насыщения твоего»; это оборот о желании или аппетите и насыщении.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ёмкость». Еврейское слово имеет общее значение и не указывает, о каком именно сосуде или вместилище идёт речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: Частица вводит обстоятельственную ситуацию закона и может иметь временной или условный оттенок. «Когда» естественно передаёт казуистическую формулировку, а вариант «если» отмечен в сноске.
- source_word: תָבֹא בְּכֶרֶם
  choice: войдёшь в виноградник
  rationale: Глагол בוא с предлогом ב здесь обозначает вхождение в какое-либо место; эта формулировка естественна в современном русском языке.
- source_word: רֵעֶךָ
  choice: своего ближнего
  rationale: רֵעַ означает ближнего, товарища или другого человека; «ближний» сохраняет широкий межличностный смысл и уместен в библейском правовом контексте.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: можешь есть виноград
  rationale: В контексте закона форма выражает разрешение, а не приказ; «можешь» ясно передаёт дозволенность личного потребления.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: сколько захочешь, досыта
  rationale: Буквальное сочетание связано с желанием или аппетитом человека и насыщением. Русская идиома кратко и естественно передаёт право есть по желанию до сытости.
- source_word: כֶּלְיְךָ
  choice: свою ёмкость
  rationale: כְּלִי — общее обозначение сосуда, принадлежности или вместилища; «ёмкость» не уточняет без основания корзину, суму либо иной конкретный предмет.
- source_word: לֹא תִתֵּן
  choice: не клади ничего
  rationale: נתן может означать «дать», «положить», «поместить». При дополнении «в ёмкость» естествен глагол «класть»; «ничего» восполняет подразумеваемый виноград.
