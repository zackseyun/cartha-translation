  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: ru
  text: Не выдавай господину раба, который убежал от своего господина к тебе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу». Еврейское слово может означать как слугу, так и раба; здесь выбран вариант «раб», поскольку подчинённость человека господину составляет суть закона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: не выдавай
  rationale: В породе хифиль глагол здесь означает передать человека под власть другого. «Не выдавай» естественно для современного русского языка и сохраняет юридическую силу запрета.
- source_word: עֶבֶד
  choice: раба
  rationale: Слово может обозначать раба или слугу, однако здесь зависимость человека от господина составляет суть закона, поэтому «раб» точнее.
- source_word: אֶל אֲדֹנָיו
  choice: господину
  rationale: В данном общественно-правовом контексте אָדוֹן обозначает господина, которому подчинён раб, а не божественный титул.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: который убежал
  rationale: Нифаль глагола נצל может передавать избавление или бегство. В контексте ухода раба от господина естественно значение «убежал»; относительная конструкция сохраняет форму еврейской фразы.
- source_word: אֵלֶיךָ
  choice: к тебе
  rationale: Предлог אֶל выражает направленность движения к адресату.
- source_word: מֵעִם אֲדֹנָיו
  choice: от своего господина
  rationale: מֵעִם выражает удаление от лица, с которым человек прежде находился; «от своего господина» — естественный русский эквивалент.
theological_decisions:
- issue: Обозначение общественного положения עֶבֶד
  choice: раб
  alternative: слуга
  rationale: Речь идёт о человеке, находившемся под властью господина, от которого он бежал и которому его запрещено выдавать. Зависимое положение существенно для смысла нормы, поэтому «раб» точнее, чем более мягкое «слуга».
- issue: Значение נצל в форме нифаль
  choice: убежал
  alternative: спасся / был избавлен
  rationale: Форма допускает оттенок избавления, однако сочетание с מֵעִם אֲדֹנָיו и запретом выдачи наиболее непосредственно описывает бегство. Перевод не добавляет причины или нравственной оценки этого бегства.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная правовая формулировка. Единственное число и мужской род сохранены по форме еврейского текста. Повтор «господину / господина» оставлен ради смысловой ясности и соответствия оригиналу.
