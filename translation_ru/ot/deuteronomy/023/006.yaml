  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: ru
  text: Но Яхве, твой Бог, не пожелал слушать Валаама, и Яхве, твой Бог, обратил для тебя проклятие в благословение, потому что Яхве, твой Бог, любил тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: не пожелал
  rationale: Глагол выражает волю или согласие, а не неспособность; «не пожелал» точно и естественно передаёт этот оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму и функцию исходного текста, не заменяя имя титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом второго лица мужского рода единственного числа прямо означает «твой Бог»; единственное число обращения сохранено.
- source_word: לִשְׁמֹעַ אֶל
  choice: слушать
  rationale: Сочетание означает слушать кого-либо или внимать ему; «слушать Валаама» сохраняет присущую выражению широту, не уточняя сверх текста, что речь лишь о повиновении.
- source_word: בִּלְעָם
  choice: Валаама
  rationale: Устоявшаяся русская библейская форма личного имени; падеж обусловлен глагольным управлением.
- source_word: וַיַּהֲפֹךְ
  choice: обратил
  rationale: Глагол обозначает превращение или изменение на противоположное; русское сочетание «обратил проклятие в благословение» естественно и точно.
- source_word: הַקְּלָלָה
  choice: проклятие
  rationale: Существительное обозначает предназначенное Израилю проклятие; определённость понятна из контекста и не требует указательного слова.
- source_word: לִבְרָכָה
  choice: в благословение
  rationale: Предлог ל здесь указывает на результат превращения; по-русски это естественно передаётся конструкцией «обратить в».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину действия Яхве; «потому что» ясно передаёт причинную связь.
- source_word: אֲהֵבְךָ
  choice: любил тебя
  rationale: Простая форма глагола «любить» сохраняет прямоту и теплоту исходного высказывания без дополнительного богословского истолкования.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблено личное имя Бога. «Яхве» передаёт тетраграмматон как имя, тогда как «Господь» заменяет его титулом, а «Иегова» отражает позднюю смешанную традицию произношения.
- issue: Смысл выражения «слушать Валаама»
  choice: не пожелал слушать Валаама
  alternative: не захотел исполнить просьбу Валаама; не послушался Валаама
  rationale: Исходное выражение допускает значения «слушать» и «внимать». Выбранная формулировка сохраняет эту смысловую широту и не приписывает тексту более узкого утверждения о просьбе или повиновении.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранено обращение к Израилю в единственном числе («твой», «тебя»). Повтор «Яхве, твой Бог» воспроизведён полностью как значимый риторический элемент исходного текста.
