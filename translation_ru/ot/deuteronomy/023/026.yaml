  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: ru
  text: Когда войдёшь на ниву ближнего твоего, можешь срывать рукой колосья, но не заноси серпа над нивой ближнего твоего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но не размахивай серпом над нивой ближнего твоего». Еврейский глагол буквально означает «поднять», «взмахнуть» или «привести в движение»; в данном контексте он обозначает применение серпа для жатвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Когда войдёшь
  rationale: כִּי вводит обстоятельство применения закона, а בוא здесь естественно передаётся как «войти». Формула «когда войдёшь» сохраняет казуальный характер предписания.
- source_word: בְּקָמַת
  choice: на ниву
  rationale: קָמָה обозначает стоящий, ещё не сжатый хлеб. Русское «нива» кратко и естественно обозначает поле со стоящим хлебом, не сводя выражение к уже собранному зерну.
- source_word: רֵעֶךָ
  choice: ближнего твоего
  rationale: רֵעַ в правовом контексте обозначает другого члена сообщества. «Ближний» — понятный и укоренившийся библейско-правовой эквивалент; порядок слов придаёт тексту достоинство без архаизации грамматики.
- source_word: וְקָטַפְתָּ
  choice: можешь срывать
  rationale: Хотя форма буквально повествовательная, в противопоставлении последующему запрету она выражает разрешённое действие. «Можешь» ясно передаёт разрешение, а не приказ.
- source_word: מְלִילֹת
  choice: колосья
  rationale: Слово означает колосья, то есть зерноносные верхушки хлебных растений; «колосья» — точный и обычный русский сельскохозяйственный термин.
- source_word: בְּיָדֶךָ
  choice: рукой
  rationale: 'Фраза ограничивает допустимый способ взятия: сорвать немного вручную, не приступая к жатве орудием.'
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: но не заноси серпа
  rationale: Союз передан противительным «но», поскольку ручное срывание противопоставлено запрещённой жатве. Hiphil נוּף буквально выражает поднятие или размахивание; «заносить серп» сохраняет образ движения орудия и естественно звучит по-русски.
- source_word: עַל קָמַת רֵעֶךָ
  choice: над нивой ближнего твоего
  rationale: עַל допускает пространственное «над». В сочетании с «заносить серп» это передаёт буквальный образ и подразумеваемое применение серпа к чужому стоящему хлебу.
