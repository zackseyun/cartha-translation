translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Нива» и «ближний» общеупотребительны в библейском регистре, но не затрудняют понимание. Повтор «нива ближнего твоего» сохранён вслед за еврейским текстом. Маркер сноски поставлен после всего запрета, к которому относится лексическая альтернатива.
