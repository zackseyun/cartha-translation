  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: ru
  text: Пусть у тебя будет отведённое место вне стана[a], и туда, за пределы стана, ты будешь выходить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука» (евр. яд); здесь, вероятно, идиома со значением определённого, отведённого места. Некоторые переводы понимают это слово более предметно — как орудие или колышек — в связи со следующим стихом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: отведённое место
  rationale: Основное значение слова — «рука», однако в данном контексте оно, вероятно, идиоматически обозначает определённое, отведённое место. Такой перевод согласуется с последующим указанием выходить туда и не смешивает это место с упомянутым в следующем стихе орудием.
- source_word: תִּהְיֶה לְךָ
  choice: пусть у тебя будет
  rationale: Конструкция היה + לְ выражает наличие или предоставление чего-либо; эта формулировка естественно передаёт также предписывающую силу контекста.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: вне стана
  rationale: Прямо обозначает местонахождение за границами лагеря. «Стан» сохраняет достойный библейский регистр и остаётся понятным современному читателю.
- source_word: וְיָצָאתָ
  choice: ты будешь выходить
  rationale: Форма с перфектом при וְ в предписывающем контексте передаёт обязанность; несовершенный вид по-русски уместно выражает повторяющееся действие.
- source_word: שָׁמָּה
  choice: туда
  rationale: Направительное наречие отсылает к только что названному месту.
- source_word: חוּץ
  choice: за пределы стана
  rationale: Финальное חוּץ повторно подчёркивает выход наружу. Добавление «стана» по смыслу раскрывает подразумеваемый ориентир и позволяет сохранить акцент без неестественного русского повтора.
