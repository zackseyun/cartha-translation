base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: ru
  text: Не гнушайся эдомитянином[a], потому что он твой брат[b]. Не гнушайся египтянином, потому что ты был переселенцем[c] в его стране.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не питай отвращения к эдомитянину».'
    reason: lexical_alternative
  - marker: b
    text: Эдомитяне происходили от Исава, брата Иакова (Израиля).
    reason: cross_reference
  - marker: c
    text: 'Или: «пришельцем»; то есть чужеземцем, живущим среди другого народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: гнушайся
  rationale: Порода пиэль глагола תעב выражает сильное неприятие, отношение к кому-либо как к отвратительному. «Гнушаться» сохраняет силу исходного слова и естественно сочетается с творительным падежом; повтор глагола передан в обеих параллельных частях.
- source_word: אֲדֹמִי
  choice: эдомитянин
  rationale: Обычное русское обозначение представителя народа Эдома; единственное число сохраняет представительный характер еврейской юридической формулировки.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Буквально передаёт родственный термин и сохраняет историческую связь Израиля с Эдомом через Исава, не заменяя её толкованием «родственник».
- source_word: מִצְרִי
  choice: египтянин
  rationale: Общепринятое русское обозначение представителя Египта; сохранено единственное число оригинала.
- source_word: גֵר
  choice: переселенец
  rationale: Слово обозначает человека, живущего не среди своего родного народа и находящегося на чужой земле. «Переселенец» понятно современному читателю и лучше сохраняет социальный оттенок длительного проживания, чем общее «чужеземец».
- source_word: בְאַרְצוֹ
  choice: в его земле
  rationale: Сохранены существительное «земля» и местоименный суффикс мужского рода единственного числа, соотносящийся с собирательно-представительным «египтянином».
- source_word: כִּי
  choice: потому что
  rationale: В обоих случаях союз вводит основание запрета; «потому что» ясно и естественно передаёт причинное значение в современном русском языке.
theological_decisions:
- issue: Представительное единственное число в названиях народов
  choice: 'Сохранить формы единственного числа: «эдомитянином», «египтянином», «он», «его»'
  alternative: 'Передать во множественном числе: «эдомитянами», «египтянами», «их»'
  rationale: Еврейский текст обращается к отдельному представителю народа как к представителю целого. Сохранение числа отражает юридическую форму оригинала и личный характер запрета.
- issue: Родство Израиля и Эдома
  choice: 'Передать אָחִיךָ буквально: «твой брат»'
  alternative: Истолковать как «твой родственник» или «твой сородич»
  rationale: Буквальная формулировка сохраняет богословско-историческое основание повеления — родство Израиля и Эдома через Иакова и Исава — не устраняя образную силу текста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Параллелизм и повтор оригинала сохранены. «Гнушайся» — сильное, но понятное слово; «переселенец» поддержан сноской, раскрывающей социально-правовой оттенок גֵר.
