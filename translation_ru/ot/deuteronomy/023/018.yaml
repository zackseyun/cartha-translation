base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: ru
  text: Среди дочерей Израиля не должно быть культовой блудницы[a], и среди сыновей Израиля не должно быть культового блудника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храмовой блудницы». Еврейские слова традиционно связывают с недозволенной сексуальной практикой при языческом богослужении; буквальное «посвящённая женщина / посвящённый мужчина» здесь могло бы ввести в заблуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: культовая блудница
  rationale: Женское существительное обозначает женщину, связанную с предосудительной сексуальной практикой языческого культа. Перевод сохраняет как сексуальный, так и культовый компонент; буквальное «посвящённая» в русском языке ввело бы в заблуждение.
- source_word: קָדֵשׁ
  choice: культовый блудник
  rationale: Мужской коррелят קְדֵשָׁה обозначает мужчину, участвующего в аналогичной культовой сексуальной практике. Мужская форма сохраняет явное гендерное противопоставление еврейского текста.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: Пусть не будет / и пусть не будет
  rationale: Передаёт юридический запрет естественной для современного русского языка формулой и сохраняет параллелизм двух частей стиха.
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  choice: среди дочерей Израиля / среди сыновей Израиля
  rationale: В данном экзистенциально-запретительном обороте מן естественно обозначает принадлежность к группе. «Среди» по-русски ясно выражает, что таких лиц не должно быть в общине, а «дочери/сыновья Израиля» сохраняет намеренную симметрию оригинала.
theological_decisions:
- issue: Значение קָדֵשׁ / קְדֵשָׁה в данном законодательном запрете
  choice: Мужчина и женщина, связанные с сексуальной практикой языческого культа
  alternative: Нравственно распущенные лица вообще; либо нейтрально «посвящённые» мужчина и женщина
  rationale: Контекст и техническое употребление слов указывают на осуждаемую культовую практику, а не на половую безнравственность вообще и не на положительное посвящение. При этом формулировка не уточняет устройство или конкретное место совершения такой практики.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Повтор и параллель «дочерей… сыновей» сохранены. «Культовый» предпочтено более узкому «храмовый», поскольку оригинал не обязательно ограничивает практику зданием храма.
