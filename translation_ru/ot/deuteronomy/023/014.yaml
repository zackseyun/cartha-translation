  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: ru
  text: И пусть при твоём снаряжении[a][b] будет колышек. Когда сядешь снаружи[c], копай им, а затем повернись и прикрой свои испражнения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кол»; некоторые понимают это слово функционально — как орудие для копания или небольшую лопатку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на твоём ухе». Значение этого еврейского выражения не вполне ясно; вероятно, речь идёт о снаряжении или принадлежностях воина.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст говорит: «когда сядешь снаружи», деликатно обозначая отправление естественной нужды.'
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: колышек
  rationale: Обычно это существительное обозначает колышек или небольшой кол. Здесь предмет служит для копания. «Колышек» сохраняет основной образ еврейского слова, не превращая его без достаточных оснований в «лопатку».
- source_word: עַל אֲזֵנֶךָ
  choice: при твоём снаряжении
  rationale: Буквально אֹזֶן означает «ухо», однако в данном выражении, по-видимому, имеется в виду часть воинского снаряжения либо место при нём. Буквальный перевод по-русски был бы непонятен; «при твоём снаряжении» передаёт наиболее вероятный смысл и сохраняет некоторую пространственную неопределённость.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: когда сядешь вне стана
  rationale: Формулировка буквально говорит о сидении снаружи и служит деликатным обозначением отправления естественной нужды. Перевод сохраняет этот эвфемизм; «стана» добавлено из непосредственного контекста правил для военного лагеря, чтобы по-русски ясно обозначить, за пределами чего происходит действие.
- source_word: וְחָפַרְתָּ בָהּ
  choice: выкопай им ямку
  rationale: Местоимение женского рода относится к יָתֵד. В еврейском тексте предмет копания прямо не назван, но русское «копай им» звучит неестественно; «ямку» кратко выражает неизбежно подразумеваемый результат действия.
- source_word: וְשַׁבְתָּ
  choice: затем повернись
  rationale: שׁוב здесь обозначает возвращение или поворот после копания. «Повернись» естественно передаёт последовательность действий, не уточняя её сверх текста.
- source_word: צֵאָתֶךָ
  choice: свои испражнения
  rationale: Слово обозначает человеческие экскременты. «Испражнения» — точное, современное и достаточно сдержанное обозначение, подходящее для законодательного текста.
- source_word: וְכִסִּיתָ
  choice: засыпь
  rationale: Буквально глагол означает «покрой». В контексте выкопанной ямки русское «засыпь» естественно обозначает покрытие землёй, не меняя требуемого действия.
