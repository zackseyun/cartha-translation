  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: ru
  text: Исполняй то, что вышло из твоих уст[a], — то, что ты пообещал Яхве, твоему Богу, как добровольное приношение[b], произнеся это своими устами.
  philosophy: optimal-equivalence
  footnotes:
