lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: то, что вышло из твоих уст
  rationale: Сохраняет конкретный древнееврейский образ исходящего из уст слова и естественно указывает на произнесённое обещание.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: соблюдай и исполняй
  rationale: 'Передаёт два согласованных повелительных значения: хранить верность сказанному и осуществить обещанное на деле.'
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: согласно тому, что ты обещал
  rationale: Показывает, что исполнение должно точно соответствовать содержанию данного обета.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твоему Богу
  rationale: Передаёт тетраграмматон личным именем «Яхве» и сохраняет заветную формулу.
- source_word: נְדָבָה
  choice: как добровольное приношение
  rationale: Термин обозначает приношение, сделанное по собственной воле; контекст допускает также наречное понимание — «добровольно».
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: что произнёс своими устами
  rationale: Сохраняет намеренное повторение темы устной речи и подчёркивает обязательность вслух данного обета.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Синтаксическая роль נְדָבָה
  choice: добровольное приношение
  alternative: добровольно
  rationale: Существительное может обозначать особый вид свободно принесённого дара, однако в данном контексте возможно и наречное понимание, относящее добровольность к обету; альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости и конкретной образности еврейского текста. Обращение ведётся к одному человеку во втором лице единственного числа. Повторное упоминание уст сохранено ради исходного акцента.
