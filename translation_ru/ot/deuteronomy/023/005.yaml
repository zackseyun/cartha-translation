source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: ru
  text: за то, что они не вышли вам навстречу с хлебом и водой в пути, когда вы вышли из Египта, и за то, что он нанял против тебя Валаама, сына Веора, из Пефора, что в Арам-Нахараиме[a], чтобы проклясть тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арам-Нахараим традиционно отождествляют с Месопотамией; буквально это название означает «Арам двух рек».
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: за то, что
  rationale: Оборот вводит основание предшествующего запрета; «за то, что» естественно продолжает русскую юридико-повествовательную фразу и сохраняет причинный смысл.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: не встретили вас
  rationale: Глагол здесь обозначает выход навстречу, далее уточнённый хлебом и водой; «не встретили» не усиливает смысл до истолковательного «не оказали гостеприимства».
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: с хлебом и водой
  rationale: Сохранены конкретные существительные исходного текста; повтор предлога перед вторым существительным по-русски не требуется.
- source_word: בַּדֶּרֶךְ
  choice: в пути
  rationale: Краткий и естественный русский эквивалент обстоятельства места.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: когда вы вышли из Египта
  rationale: Инфинитивная конструкция имеет временное значение и естественно передаётся придаточным времени.
- source_word: וַאֲשֶׁר
  choice: и за то, что
  rationale: Передаёт второе, параллельное основание и сохраняет связь с начальным עַל דְּבַר.
- source_word: שָׂכַר עָלֶיךָ
  choice: нанял против тебя
  rationale: «Нанял» прямо передаёт שׂכר, а «против тебя» — враждебную направленность עַל; сохранён переход исходника от множественного «вас» к единственному «тебя».
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Валаама, сына Веора
  rationale: Использованы укоренившиеся русские библейские формы имён и явно передано отчество.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: из Пефора в Арам-Нахараиме
  rationale: Сохраняются собственные географические названия; конструкция естественно указывает, что Пефор расположен в названной области, не подменяя её интерпретирующим «Месопотамия».
- source_word: לְקַלְלֶךָּ
  choice: чтобы проклясть тебя
  rationale: Целевой инфинитив передан придаточным цели прямо и естественно.
theological_decisions:
- issue: Переход от множественного обращения אֶתְכֶם / בְּצֵאתְכֶם к единственному עָלֶיךָ / לְקַלְלֶךָּ
  choice: сохранить «вас / вы», затем «тебя»
  alternative: унифицировать всё обращение как множественное или единственное
  rationale: Смена числа реально присутствует в еврейском тексте и характерна для Второзакония; её не следует сглаживать, поскольку единственное число может представлять Израиль как единое целое.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет зависимость стиха от предшествующего контекста, а географическое название оставлено в транслитерации с пояснением в сноске.
