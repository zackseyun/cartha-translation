  text: וְ/כִ֥י תֶחְדַּ֖ל לִ/נְדֹּ֑ר לֹֽא יִהְיֶ֥ה בְ/ךָ֖ חֵֽטְא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: ru
  text: Но если ты воздержишься от того, чтобы дать обет, не будет на тебе греха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет на тебе вины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Но если
  rationale: Сочетание вводит условие, противопоставленное требованию предыдущего стиха исполнить уже данный обет.
- source_word: תֶחְדַּל לִנְדֹּר
  choice: ты воздержишься от обета
  rationale: Глагол חדל с инфинитивом נדר означает отказ от совершения действия, то есть решение не давать обета; по-русски это естественно передаётся как «воздержаться от обета».
- source_word: לֹא יִהְיֶה
  choice: не будет
  rationale: Отрицательная форма היה имеет здесь экзистенциально-результативное значение.
- source_word: בְ/ךָ
  choice: на тебе
  rationale: Хотя предлог ב буквально может передаваться как «в», в правовом и нравственном контексте русское «на тебе» естественно выражает вменение греха или вины.
- source_word: חֵטְא
  choice: грех
  rationale: חֵטְא может обозначать как грех, так и вину; «грех» ясно передаёт основной нравственно-правовой смысл, а оттенок вины сохранён в примечании.
theological_decisions:
- issue: Нравственный статус отказа от обета
  choice: Само по себе решение не давать обета не является грехом.
  alternative: На человеке не будет вины или правовой ответственности за то, что он не дал обета.
  rationale: Контекст противопоставляет отсутствие обязанности давать обет виновности за неисполнение уже данного обета. Перевод не превращает обет в обязательное благочестивое действие и сохраняет возможный оттенок вины в примечании.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» сохраняет единственное число древнееврейского текста. Формулировка краткая, естественная и выдержана в достойном библейском регистре.
