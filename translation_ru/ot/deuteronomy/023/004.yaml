base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: ru
  text: Ни аммонитянин, ни моавитянин не войдёт в собрание Яхве[a]; даже до десятого поколения[b] никто из них не войдёт в собрание Яхве вовек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в общину Яхве».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоят оба выражения — «до десятого поколения» и «вовек»; перевод сохраняет их вместе, не сводя одно к другому.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: не войдёт
  rationale: В правовом контексте сочетание לֹא с имперфектом выражает запрет или недопущение. Будущая форма «не войдёт» естественна для русского языка и сохраняет категоричность нормы.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: ни аммонитянин, ни моавитянин
  rationale: Стандартные русские названия представителей этих народов; конструкция с повторяющимся «ни» ясно передаёт отрицание применительно к обеим группам.
- source_word: קְהַל
  choice: собрание
  rationale: Передаёт официально собранное сообщество Израиля без излишне церковного оттенка; возможный вариант «община» указан в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: даже в десятом поколении
  rationale: «Даже» передаёт усилительное גַּם, а предложная конструкция звучит естественно по-русски и сохраняет указание на поколение.
- source_word: לָהֶם
  choice: никто из них
  rationale: Местоименная отсылка передана естественной русской конструкцией без добавления в основной текст слова «потомки», которого прямо нет в еврейском тексте.
- source_word: עַד עוֹלָם
  choice: вовек
  rationale: Краткое и торжественное обозначение неограниченной длительности; оно сохраняется наряду с формулой о десятом поколении.
theological_decisions:
- issue: Соотношение выражений «в десятом поколении» и «вовек»
  choice: Оба выражения сохранены в основном тексте без согласующего истолкования.
  alternative: Понять «десятое поколение» просто как идиому со значением «никогда» либо ослабить значение слова «вовек».
  rationale: В еврейском тексте присутствуют обе временные формулы. Перевод сохраняет их напряжённое сочетание и не решает за читателя, как именно они соотносятся.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Конструкция «ни… ни… не войдёт» сохраняет форму единичного представителя каждой группы, а «вовек» соответствует библейскому регистру, оставаясь понятным современному читателю.
