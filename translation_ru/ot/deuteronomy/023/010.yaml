  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: ru
  text: Когда твое войско выступает против твоих врагов, берегись всего дурного[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всего нечистого»; «всего непристойного». Еврейское выражение имеет широкий смысл и в данном контексте может включать ритуальную нечистоту, но не ограничивается ею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: когда
  rationale: Союз вводит типичную ситуацию, при которой действует последующее предписание; «когда» естественнее для данного законодательного контекста, чем условное «если».
- source_word: תֵצֵא מַחֲנֶה
  choice: ты выступишь в поход
  rationale: Буквально сочетание говорит о выходе военного стана или войска. Русское «выступишь в поход» естественно передаёт военный контекст, не добавляя указания на конкретный вид сражения.
- source_word: עַל אֹיְבֶיךָ
  choice: против своих врагов
  rationale: В военном контексте עַל имеет значение направленности против неприятеля; возвратное «своих» естественно согласуется с обращением на «ты».
- source_word: וְנִשְׁמַרְתָּ
  choice: берегись
  rationale: 'Форма породы нифаль от שׁמר здесь имеет возвратное предписывающее значение: следить за собой, хранить себя от чего-либо.'
- source_word: מִכֹּל דָּבָר רָע
  choice: всего дурного
  rationale: Сочетание имеет широкий смысл — всякая дурная, недопустимая или нечистая вещь либо поступок. «Всего дурного» сохраняет эту широту и звучит естественно по-русски.
theological_decisions:
- issue: Объём значения דָּבָר רָע в законах о святости военного стана
  choice: всего дурного
  alternative: всего нечистого; всего непристойного
  rationale: Дальнейший контекст затрагивает ритуальную нечистоту и правила благопристойности, однако само еврейское выражение шире. Основной текст поэтому не ограничивает предписание одной лишь ритуальной категорией.
translation_notes:
  register: Современный литературный русский язык; прямое обращение на «ты» сохраняет форму единственного числа исходного текста. Формулировка краткая и предписывающая, без архаизмов.
