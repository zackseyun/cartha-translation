  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: ru
  text: Не ищи для них мира и благополучия во все дни своей жизни, вовеки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их благоденствия и их блага». Еврейские слова имеют более широкий смысл, чем только политический мир или материальное процветание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: ищи
  rationale: Глагол דרש означает «искать», «стремиться к» или «спрашивать о». В сочетании с отвлечёнными понятиями «мир» и «благополучие» форма «ищи» близка к еврейскому тексту и естественна по-русски.
- source_word: שְׁלֹמָם
  choice: для них мира
  rationale: שָׁלוֹם охватывает мир, благоденствие и общее благополучие. «Мира» сохраняет основной образ и не сливает это слово со следующим טוֹבָה; оборот «для них» естественно передаёт местоименный суффикс в русском контексте.
- source_word: טֹבָתָם
  choice: благополучия
  rationale: טוֹבָה обозначает благо, пользу или хорошее состояние. «Благополучие» ясно передаёт смысл и сохраняет отличие от שָׁלוֹם.
- source_word: כָּל יָמֶיךָ
  choice: во все дни своей жизни
  rationale: Выражение передаёт буквальный образ «всех твоих дней», сохраняя обращение к одному лицу и звуча естественно на современном русском языке.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Слово усиливает длительность запрета. «Вовеки» кратко и достойно передаёт это усиление, не устраняя его как якобы избыточное.
theological_decisions:
- issue: Сочетание «во все дни своей жизни» и «вовеки» может восприниматься как смысловое повторение
  choice: Сохранить оба обозначения длительности
  alternative: Сжать до «до конца своей жизни» или не передавать לְעוֹלָם отдельно
  rationale: В еврейском тексте כָּל יָמֶיךָ и לְעוֹלָם намеренно поставлены рядом для усиления. Перевод сохраняет это напряжение и не сглаживает формулировку источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Единственное число повелительного обращения сохранено; «вовеки» передаёт торжественное усиление оригинала.
