base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: ru
  text: так же, как поступили со мной[a] сыны Исава, живущие в Сеире, и моавитяне, живущие в Аре, — пока я не перейду Иордан и не войду в землю, которую Яхве, наш Бог, даёт нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделали для меня»; по контексту речь идёт о проходе и покупке пищи и воды.'
    reason: Лексический оборот עָשׂוּ לִי допускает широкую передачу; сноска сохраняет его буквальную форму и поясняет контекст.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Передаёт сравнительное значение союза естественным для русского языка способом.
- source_word: עָשׂוּ לִי
  choice: поступили со мной
  rationale: Естественно передаёт широкое значение оборота, не конкретизируя сверх еврейского текста, какое именно содействие было оказано; буквальная форма отмечена в сноске.
- source_word: בְּנֵי עֵשָׂו
  choice: сыны Исава
  rationale: Сохраняет родственное обозначение еврейского текста и его корпоративный смысл; форма «сыны» уместна в dignified biblical register.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: живущие в Сеире
  rationale: Современно и точно передаёт причастие со значением постоянного проживания.
- source_word: וְהַמּוֹאָבִים
  choice: и моавитяне
  rationale: Прямое и общепринятое обозначение народа Моава.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: живущие в Аре
  rationale: Сохраняет параллель с предыдущим оборотом; Ар передан как географическое имя.
- source_word: עַד אֲשֶׁר אֶעֱבֹר אֶת הַיַּרְדֵּן
  choice: пока я не перейду Иордан
  rationale: Русская конструкция «пока не» естественно выражает предел действия; «перейти Иордан» точно передаёт пересечение реки.
- source_word: אֶל הָאָרֶץ
  choice: и не войду в землю
  rationale: В русском языке после перехода через Иордан добавление «войду» ясно и естественно передаёт направленность אֶל без изменения смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Прямо передаёт форму с местоименным суффиксом первого лица множественного числа.
- source_word: נֹתֵן לָנוּ
  choice: даёт нам
  rationale: Настоящее время естественно передаёт причастную форму как совершающееся и несомненное дарование земли.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер действий сынов Исава и моавитян
  choice: поступили со мной
  alternative: пропустили меня и снабдили припасами
  rationale: Еврейский оборот широк и сам по себе не называет конкретных действий; более подробное толкование выводится из контекста и потому не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллельные определения сохранены; архаизмы сведены к уместному родовому обозначению «сыны Исава».
