    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: Довольно вам
  rationale: Еврейский оборот выражает достаточность и в данном контексте означает, что странствие вокруг этой местности продолжалось уже достаточно долго. «Довольно вам» естественно и ёмко передаёт его побудительную силу.
- source_word: סֹב
  choice: обходить
  rationale: Форма от סבב обозначает движение вокруг чего-либо. Несовершенный вид естественно сочетается по-русски с оборотом «довольно вам» и передаёт продолжавшееся движение.
- source_word: הָהָר הַזֶּה
  choice: эту горную область
  rationale: הַר может обозначать как отдельную гору, так и гористую местность. В контексте пути вокруг Сеира речь, вероятнее всего, идёт о более широкой горной области; подлинная лексическая альтернатива сохранена в сноске.
- source_word: פְּנוּ
  choice: поверните
  rationale: Повелительная форма פנה здесь требует изменить направление движения. «Поверните» прямо и естественно передаёт этот смысл.
- source_word: לָכֶם
  choice: не выражено отдельно
  rationale: Местоименный дательный при повелении не требует отдельного перевода на русский; добавление «себе» было бы неестественным и могло бы внести лишний смысл.
- source_word: צָפֹנָה
  choice: на север
  rationale: Направительное окончание указывает на движение в северном направлении; обычное русское соответствие — «на север».
