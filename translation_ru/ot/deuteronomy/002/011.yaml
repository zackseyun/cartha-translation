lexical_decisions:
- source_word: רְפָאִים
  choice: рефаимами
  rationale: Передано транслитерацией как название древнего народа; контекст допускает толкование «исполины», но оно излишне конкретизирует основной текст.
- source_word: יֵחָשְׁבוּ
  choice: считали
  rationale: Нифаль выражает отнесение к определённой группе; русская неопределённо-личная конструкция естественно передаёт пассивное значение.
- source_word: אַף הֵם
  choice: их тоже
  rationale: 'Сохраняет значение включения и акцент: этот народ также относили к упомянутой категории.'
- source_word: כָּעֲנָקִים
  choice: как и анакимов
  rationale: Префикс כ выражает сравнение; конструкция показывает, что их считали рефаимами так же, как анакимов.
- source_word: וְהַמֹּאָבִים
  choice: но моавитяне
  rationale: Союз ו здесь уместно передать противительным «но», поскольку речь переходит от общей классификации к особому моавитскому названию.
- source_word: יִקְרְאוּ לָהֶם
  choice: называли их
  rationale: Идиома קרא ל означает «называть»; прошедшее время естественно согласуется с повествованием о древнем народе.
- source_word: אֵמִים
  choice: эмимами
  rationale: Название народа передано транслитерацией; творительный падеж обусловлен русским управлением глагола «называть».
