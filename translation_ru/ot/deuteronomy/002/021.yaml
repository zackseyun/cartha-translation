  - severity: low
    issue: «истребил»
    rationale: Хотя глагол שׁמד силён, русское «истребил» легко воспринимается как поголовное физическое истребление. «Уничтожил» сохраняет силу исходного глагола, не уточняя способ или степень уничтожения сверх текста.
