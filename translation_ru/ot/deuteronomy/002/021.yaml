base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: ru
  text: народ великий, многочисленный и высокий ростом, как анакимы[a]. Яхве уничтожил их перед ними, и они лишили их владений и поселились на их месте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как потомки Анака».'
    reason: Лексическая альтернатива передачи этнонима עֲנָקִים.
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: народ великий, многочисленный
  rationale: Сочетание сохраняет собирательное единственное число עַם и различает גָּדוֹל («великий») и רַב («многочисленный»), не сводя оба определения к численности.
- source_word: רָם
  choice: высокий ростом
  rationale: В сравнении с анакимами речь идёт о физическом росте; уточнение «ростом» устраняет возможное значение «возвышенный».
- source_word: כָּעֲנָקִים
  choice: как анакимы[a]
  rationale: Префикс כְּ передаёт сравнение, а название народа транслитерировано. В сноске дан понятный описательный вариант.
- source_word: וַיַּשְׁמִידֵם
  choice: истребил их
  rationale: Порода хифиль глагола שׁמד выражает уничтожение или устранение; «истребил» передаёт силу глагола без обязательного утверждения о полном биологическом уничтожении.
- source_word: מִפְּנֵיהֶם
  choice: перед ними
  rationale: Сохранён образ еврейского оборота «из-перед их лица» и смысл устранения прежних жителей с пути нового народа.
- source_word: וַיִּירָשֻׁם
  choice: они лишили их земли
  rationale: В данном контексте ירשׁ обозначает овладение территорией через лишение прежних жителей владения. Упоминание земли естественно раскрывает подразумеваемый объект владения.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: поселились на их месте
  rationale: Фраза выражает замещение прежних жителей новыми; перевод современный и сохраняет пространственный смысл תַּחַת.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное имя и наиболее вероятную традиционную реконструкцию его произношения.
- issue: Неоднозначность местоимений во второй половине стиха
  choice: сохранить последовательность «их — ними — они — их»
  alternative: явно назвать потомков Исава и прежних жителей
  rationale: Референты ясны из ближайшего контекста, тогда как сам стих использует местоимения. Их замена именами сделала бы перевод толковательным и устранила бы формальную особенность исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Начальная строчная буква сохранена, поскольку стих синтаксически продолжает описание из предыдущего стиха. Маркер [a] помещён непосредственно после слова, к которому относится сноска.
