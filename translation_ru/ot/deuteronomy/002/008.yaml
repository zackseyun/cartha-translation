base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: ru
  text: Итак, мы прошли мимо наших братьев[a], сынов Исава, живущих в Сеире, удаляясь от дороги Аравы[b], от Эйлата и Эцион-Гевера; затем мы повернули и пошли по дороге Моавской пустыни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших родичей, потомков Исава». В еврейском тексте буквально: «наших братьев, сынов Исава».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «от дороги Аравы». Арава — область рифтовой долины к югу от Мёртвого моря.'
    reason: lexical_note
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: мы прошли мимо
  rationale: Глагол עבר с מֵאֵת в данном повествовании обозначает продолжение пути мимо людей или в стороне от них, а не переправу через водную преграду.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: наших братьев, сынов Исава
  rationale: Сохранено буквальное обозначение родства между Израилем и потомками Исава; «сынов» естественно передаёт генеалогическое употребление בְּנֵי.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: живущих в Сеире
  rationale: Причастие от ישב здесь указывает на постоянное проживание; современное «живущих» звучит естественнее архаичного «обитающих».
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: удаляясь от дороги Аравы
  rationale: Передаёт исходное מִן как движение от дороги и сохраняет Араву как географическое название. Возможная синтаксическая трактовка «по дороге Аравы» отмечена в сноске.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: от Эйлата и Эцион-Гевера
  rationale: Сохранены повторяющееся значение предлога מִן и традиционные русские формы географических названий.
- source_word: וַנֵּפֶן
  choice: затем мы повернули
  rationale: Глагол פנה обозначает перемену направления; «повернули» кратко и точно выражает это движение.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: и пошли по дороге Моавской пустыни
  rationale: Второе עבר в контексте пути естественно передано глаголом «пошли», а конструкция דֶּרֶךְ מִדְבַּר מוֹאָב — как дорога, относящаяся к Моавской пустыне, без уточнения направления, которого нет в еврейском тексте.
theological_decisions:
- issue: Обозначение родства с эдомитянами
  choice: наших братьев, сынов Исава
  alternative: наших соплеменников, потомков Исава
  rationale: Буквальное «братьев» сохраняет значимое для Второзакония родство Израиля с потомками Исава и не сводит его к более общему обозначению этнической близости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Родственная терминология и географические названия сохранены, а тяжёлая цепочка исходных предложных оборотов слегка прояснена деепричастием «удаляясь».
