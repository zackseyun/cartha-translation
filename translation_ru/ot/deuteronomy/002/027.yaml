base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: ru
  text: Позволь мне пройти через твою землю. Я пойду только по дороге[a], не сворачивая ни вправо, ни влево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по дороге, по дороге»; повторение усиливает обещание строго придерживаться дороги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Позволь мне пройти
  rationale: Когортатив породы qal, 1-е лицо единственного числа, в дипломатическом обращении выражает вежливую просьбу; эта передача точнее простого будущего времени.
- source_word: בְאַרְצֶךָ
  choice: через твою землю
  rationale: Предлог ב после глагола עבר обозначает прохождение через территорию; по-русски естественно сказать «пройти через землю».
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: только по дороге
  rationale: Дословное повторение «по дороге, по дороге» имеет усилительное значение и подчёркивает строгое следование маршруту. Частица «только» естественно передаёт эту эмфазу по-русски.
- source_word: אֵלֵךְ
  choice: Я пойду
  rationale: הלך в контексте передвижения означает «идти, следовать»; «пойду» — ясный и естественный русский эквивалент.
- source_word: לֹא אָסוּר
  choice: не сворачивая
  rationale: סור означает отклоняться или сворачивать с пути. Деепричастная конструкция естественно связывает запрет на отклонение с заявлением о движении по дороге.
- source_word: יָמִין וּשְׂמֹאול
  choice: ни вправо, ни влево
  rationale: Устойчивое обозначение отсутствия отклонения в любую сторону; парный союз «ни… ни…» идиоматичен в русском отрицательном обороте.
