source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: ru
  text: Встаньте, отправляйтесь в путь и перейдите долину Арнона[a]. Смотри, Я отдал в твою руку Сихона, аморейского царя Хешбона, и его землю. Начни овладевать ею[b] и вступи с ним в сражение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вади Арнон», «русло Арнона» или «поток Арнон»; еврейское נחל может обозначать долину временного водотока, его русло или сам поток.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «начни вступать во владение ею». Глагол ירש может также означать «лишать владения, вытеснять», но здесь непосредственно названа земля Сихона.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «начни с ним войну» или «вызови его на войну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Встаньте
  rationale: Форма множественного числа повелительного наклонения передаёт призыв подняться и начать действовать; современно и достойно.
- source_word: סְּע֗וּ
  choice: отправляйтесь в путь
  rationale: В контексте передвижения נסע означает выступить или двинуться; выбран естественный русский оборот.
- source_word: וְ/עִבְרוּ֮
  choice: и перейдите
  rationale: עבר с географическим объектом обозначает пересечение рубежа или водотока.
- source_word: נַ֣חַל אַרְנֹן
  choice: долину Арнона
  rationale: נחל может обозначать вади, русло потока или долину; основной текст использует понятное широкому читателю обозначение, а неоднозначность отмечена в сноске.
- source_word: רְאֵ֣ה
  choice: Смотри
  rationale: Повелительная форма единственного числа обращает внимание Моисея на последующее Божье заявление и сохраняет смену числа.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: Я отдал в твою руку
  rationale: Сохранены совершенный вид и еврейский образ передачи под власть; оборот понятен в возвышенной повествовательной речи.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: Сихона, аморейского царя Хешбона
  rationale: Переданы имя, этническая принадлежность и царский титул в естественном для русского языка порядке.
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: и его землю
  rationale: Прямое соответствие אֶרֶץ в значении владений царя.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: Начинай овладевать ею
  rationale: החל выражает начало действия, а ירש здесь относится к названной земле и допускает значение вступления во владение; аспектуальная форма передаёт начало продолжающегося действия.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: и вступи с ним в сражение
  rationale: Оборот обозначает начало военного противоборства; перевод ясен и не сводит смысл лишь к словесной провокации.
theological_decisions:
- issue: Божественное дарование и человеческое действие при завоевании
  choice: Сохранить и совершившееся Божье дарование («Я отдал»), и повеление Израилю действовать («Начинай овладевать… вступи…»).
  alternative: Передать перфект как будущее обещание («Я отдам») либо сделать главным значением ירש вытеснение прежних жителей.
  rationale: Еврейский текст намеренно соединяет завершённость Божьего решения с необходимостью человеческого действия; перевод не устраняет это напряжение.
- issue: Единственное и множественное число в обращении
  choice: Сохранить множественное число в первых повелениях и единственное число начиная со «Смотри».
  alternative: Унифицировать всё обращение во множественном числе ради русской гладкости.
  rationale: Смена числа присутствует в еврейском тексте и отражает коллективное обращение к Израилю как к единому народу; её не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Сохранены цепочка повелений, образ «в руку», смена числа адресата и смысловая напряжённость между Божьим даром и предписанным действием.
