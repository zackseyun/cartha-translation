source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ תֵּ֤ת פַּחְדְּ/ךָ֙ וְ/יִרְאָ֣תְ/ךָ֔ עַל פְּנֵי֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָ֑יִם אֲשֶׁ֤ר יִשְׁמְעוּ/ן֙ שִׁמְעֲ/ךָ֔ וְ/רָגְז֥וּ וְ/חָל֖וּ מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: ru
  text: Сегодня Я начну наводить на народы под всеми небесами страх и ужас перед тобой. Они услышат весть о тебе[a], задрожат и будут корчиться[b] из-за тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышат молву о тебе»; возможен также смысл «услышат о твоей славе». Еврейское выражение может обозначать весть, благодаря которой складывается репутация.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут мучиться»; еврейский глагол может описывать корчи, в том числе подобные родовым мукам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  choice: Я начну наводить
  rationale: Сочетание каузативной формы חלל с инфинитивом נתן означает начало действия; «начну наводить» естественно сочетается в русском со словами «страх и ужас».
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: страх и ужас перед тобой
  rationale: Оба существительных передают вызванный Израилем страх, а не его собственное чувство. Два разных русских слова сохраняют параллельную пару оригинала.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: на народы
  rationale: Буквально выражение связано с «лицом/поверхностью народов», но здесь это идиома распространения страха на народы; буквальное «на лицо народов» по-русски неестественно и может исказить смысл.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: под всеми небесами
  rationale: Сохранена форма множественного числа и всеохватный библейский образ.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Они услышат весть о тебе
  rationale: שֵׁמַע допускает значения вести, молвы или славы. «Весть о тебе» сохраняет широту значения и ясно соотносит местоимение с народами.
- source_word: וְרָגְזוּ
  choice: задрожат
  rationale: Глагол обозначает дрожь, трепет или сильное волнение; «задрожат» естественно выражает телесную реакцию страха.
- source_word: וְחָלוּ
  choice: будут корчиться
  rationale: Глагол передаёт мучительное телесное содрогание и может ассоциироваться с родовыми муками; выбранный вариант сохраняет яркий образ, не уточняя его сверх текста.
- source_word: מִפָּנֶיךָ
  choice: из-за тебя
  rationale: Буквально «от твоего лица/присутствия»; в данном контексте оборот указывает на причину их страдания и страха.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Прямую речь Бога отмечает прописное «Я». Длинное еврейское предложение разделено на два русских ради ясности; связь относительного придаточного с «народами» сохранена местоимением «они».
