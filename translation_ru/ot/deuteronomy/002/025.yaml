  source_fidelity: 'Текст точно передаёт последовательность и смысл еврейского оригинала: Бог начинает наводить на народы страх, народы услышат весть об Израиле, задрожат и испытают мучительное телесное потрясение вследствие его присутствия/силы. «Из-за тебя» является допустимым контекстуальным переводом מִפָּנֶיךָ, хотя буквально оборот связан с «лицом/присутствием».'
