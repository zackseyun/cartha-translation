base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: ru
  text: Ибо Яхве, твой Бог, благословил тебя во всяком деле рук твоих. Он знал[a], как ты шёл по этой великой пустыне. Все эти сорок лет Яхве, твой Бог, был с тобой; ты ни в чём не нуждался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он заботился о тебе, пока ты шёл по этой великой пустыне». Буквально употреблён глагол «знал», который в данном контексте может подразумевать внимательное наблюдение и заботу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
