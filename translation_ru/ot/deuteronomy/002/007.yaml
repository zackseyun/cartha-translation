- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл יָדַע применительно к пути Израиля
  choice: знал
  alternative: наблюдал за; заботился во время пути
  rationale: Основное лексическое значение сохранено в тексте, а возможный оттенок внимательного знания и попечения отмечен в сноске без устранения смыслового напряжения.
