- source_word: בֵּרַכְךָ
  choice: благословлял тебя
  rationale: Русский вид и форма прошедшего времени естественно выражают Божье благословение, сопровождавшее Израиль в описываемый период.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: во всяком деле твоих рук
  rationale: Сохраняет конкретный древнееврейский образ труда рук и при этом звучит понятно по-русски.
- source_word: יָדַע
