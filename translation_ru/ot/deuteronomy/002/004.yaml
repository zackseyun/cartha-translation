  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: ru
  text: 'А народу повели: «Вы вскоре пройдёте через территорию ваших братьев, сыновей Исава, живущих в Сеире. Они испугаются вас, и будьте очень осторожны.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и тщательно берегитесь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: повели
  rationale: Императив от צוה выражает властное распоряжение; «повели» сохраняет его силу и естественно звучит в обращении к Моисею.
- source_word: הָעָם
  choice: народу
  rationale: עם обозначает народ Израиля как единое целое; дательный падеж обусловлен русским управлением глагола «повелеть».
- source_word: אַתֶּם עֹבְרִים
  choice: вы вскоре пройдёте
  rationale: Причастие с самостоятельным местоимением в данном контексте указывает на предстоящее в ближайшем будущем действие.
- source_word: בִּגְבוּל
  choice: через владения
  rationale: גְּבוּל может означать как границу, так и ограниченную ею территорию; контекст передвижения через область Эдома поддерживает значение территории.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: ваших братьев, сыновей Исава
  rationale: «Братьев» прямо сохраняет родственную лексику, а «сыновей Исава» — явное генеалогическое обозначение исходного текста.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: живущих в Сеире
  rationale: Причастие от ישב здесь обозначает постоянное проживание; это ясная и современная русская формулировка.
- source_word: וְיִירְאוּ מִכֶּם
  choice: они испугаются вас
  rationale: ירא с מן выражает страх перед Израилем; совершенный вид по-русски естественно передаёт предстоящее возникновение страха.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: поэтому будьте предельно осторожны
  rationale: Нифаль от שמר имеет возвратный смысл «берегитесь, следите за собой», а מְאֹד усиливает предостережение. «Поэтому» естественно передаёт связь с ожидаемым страхом эдомитян.
theological_decisions:
- issue: Родственная лексика по отношению к Эдому
  choice: ваших братьев, сыновей Исава
  alternative: ваших сородичей, потомков Исава
  rationale: Буквальное «братьев» сохраняет подчёркнутую в тексте родственную связь Израиля с Эдомом и не сводит её к общему этническому родству.
- issue: Связь предостережения со страхом эдомитян
  choice: поэтому будьте предельно осторожны
  alternative: и тщательно берегитесь
  rationale: 'Контекст допускает понимание ו как смыслового следствия: именно страх жителей требует особой осторожности. При этом альтернативная более формальная связь указана в примечании.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены прямое родственное обозначение «братьев» и генеалогическая формула «сыновей Исава»; архаизмы сведены к минимуму.
