  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: ru
  text: Сегодня ты переходишь границу Моава у Ара[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «границу Моава, то есть Ар». В еврейском тексте перед словом «Ар» повторён показатель прямого дополнения, поэтому Ар может быть приложением, уточняющим название моавитянской пограничной области или города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: ты
  rationale: Местоимение второго лица мужского рода единственного числа обращено к Израилю как к единому народу; русское «ты» сохраняет грамматическое число и риторическую силу обращения.
- source_word: עֹבֵר
  choice: переходишь
  rationale: Предикативное причастие qal при самостоятельном местоимении выражает действие, совершающееся в данный момент; настоящее время естественно передаёт этот смысл по-русски.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Обычное наречное значение — «сегодня», с сохранением временного акцента.
- source_word: גְּבוּל
  choice: границу
  rationale: В данном географическом контексте слово обозначает рубеж территории; «граница» — ясный и естественный современный эквивалент.
- source_word: מוֹאָב
  choice: Моава
  rationale: Принятая русская форма библейского географического названия в требуемом родительном падеже.
- source_word: עָר
  choice: Ара
  rationale: Название места передано традиционной русской транслитерацией и поставлено в родительный падеж после предлога «у».
- source_word: אֶת ... אֶת
  choice: границу Моава у Ара
  rationale: Повтор показателя прямого дополнения перед «Ар» допускает присоединительное или аппозиционное понимание. Основной текст естественно передаёт географическую связь через «у Ара», а буквальная аппозиционная возможность сохранена в сноске.
theological_decisions:
- issue: Обращение к Израилю в единственном числе
  choice: 'Сохранить единственное число: «ты переходишь»'
  alternative: «Вы переходите» или пояснительное «ты, Израиль, переходишь»
  rationale: Еврейский текст обращается к Израилю как к единому целому посредством формы единственного числа. Русское «ты» прямо сохраняет эту особенность без пояснительной вставки.
translation_notes:
  register: 'Современный литературный русский язык; краткая, ясная и достойная формулировка. Порядок слов слегка адаптирован ради естественности: временное обстоятельство «сегодня» вынесено в начало, при этом исходный акцент сохранён.'
