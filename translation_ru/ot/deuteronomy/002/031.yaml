base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Смотри, Я уже начал отдавать в твою власть Сигона и его землю[a]. Начни овладевать его землёй[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед тобой». Здесь это означает, что Яхве отдаёт Сигона и его землю во власть Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Начни завладевать, чтобы овладеть его землёй». В еврейском тексте дважды употреблён один и тот же глагольный корень — для усиления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: רְאֵה
  choice: Смотри
  rationale: Императив служит для привлечения внимания; «смотри» естественно и сохраняет непосредственность речи.
- source_word: הַחִלֹּתִי תֵּת
  choice: Я уже начал отдавать
  rationale: Сохраняет начинательное значение конструкции и показывает, что действие уже началось; «отдавать» подходит контексту передачи во власть Израиля.
- source_word: לְפָנֶיךָ
  choice: тебе
  rationale: Буквально «перед тобой», но в данном военном контексте оборот означает передачу в распоряжение или под власть адресата.
- source_word: הָחֵל רָשׁ
  choice: Начинай овладевать
  rationale: 'Передаёт повеление приступить к завладению землёй и сохраняет словесную параллель: Яхве начал отдавать — Израиль должен начать овладевать.'
- source_word: לָרֶשֶׁת
  choice: овладевать
  rationale: Повтор корня ירש усиливает повеление. В основном тексте он передан естественной русской конструкцией, а особенность оригинала отмечена в сноске.
- source_word: אַרְצוֹ
  choice: его землю
  rationale: «Земля» — обычный и достаточно широкий эквивалент для территории, которой правил Сигон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Соотношение Божьего дара и действия Израиля
  choice: «Я уже начал отдавать… Начинай овладевать»
  alternative: Сгладить параллель и представить только один аспект
  rationale: 'Сохраняется напряжённая параллель оригинала: Бог начинает передачу, а Израилю велено начать завладение; ни одна сторона не устраняется.'
translation_notes:
  register: Современный литературный русский язык с прямым, торжественным, но не архаичным звучанием. Имя «Сигон» дано в привычной русской библейской форме. Частица «уже» естественно подчёркивает начавшееся действие совершенной формы.
