base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: ru
  text: В Сеире прежде жили хорреи, но потомки Исава лишили их владений[a], истребили их, устранив со своего пути[b], и поселились на их месте — так же, как Израиль поступил с землёй, полученной им во владение[c], которую Яхве дал им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изгнали их». Еврейский глагол может означать овладение землёй посредством вытеснения прежних жителей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «истребили их от своего лица»; это еврейский оборот, означающий устранить кого-либо из своего присутствия.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «с землёй своего наследия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: хорреи
  rationale: Устоявшееся русское название народа, населявшего Сеир; оно понятнее буквальной транслитерации «хорим».
- source_word: לְפָנִים
  choice: прежде
  rationale: Здесь выражение имеет временное значение и указывает на прежнее население Сеира.
- source_word: בְנֵי עֵשָׂו
  choice: потомки Исава
  rationale: В данном историко-этническом контексте «сыны Исава» обозначает его потомков; современное русское выражение передаёт смысл естественно.
- source_word: יִירָשׁוּם
  choice: изгнали их
  rationale: Глагол ירשׁ в контексте овладения землёй подразумевает устранение прежних жителей и занятие их владения. Основной текст передаёт аспект вытеснения, а примечание сохраняет аспект овладения.
- source_word: וַיַּשְׁמִידוּם
  choice: истребили их
  rationale: שׁמד выражает сильное уничтожение; «истребили» сохраняет эту силу, не уточняя сверх текста степень полноты уничтожения.
- source_word: מִפְּנֵיהֶם
  choice: перед собой
  rationale: Сохранён образ еврейского оборота, указывающего на удаление народа из присутствия и с пути завоевателей; значение пояснено в примечании.
- source_word: תַּחְתָּם
  choice: на их месте
  rationale: Контекст требует значения замещения прежних жителей новыми.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: с землёй своего владения
  rationale: יְרֻשָּׁה может обозначать как наследие, так и полученное во владение достояние. «Земля своего владения» сохраняет связь с обладанием землёй и единственное число при собирательном имени «Израиль».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: לָהֶם
  choice: им
  rationale: Сохранён переход оригинала от собирательного единственного числа «Израиль / своего» к множественному числу, относящемуся к народу.
theological_decisions:
- issue: Временная точка сравнения с действиями Израиля
  choice: Передать сравнение как утверждение текста, не разрешая хронологический вопрос
  alternative: Сгладить формулировку, чтобы она не подразумевала уже совершившегося овладения землёй, либо считать оборот поздней вставкой
  rationale: Масоретский текст прямо сопоставляет действия потомков Исава с тем, как Израиль поступил со своей землёй. Перевод сохраняет это напряжение и не вводит гармонизирующего или источниковедческого решения.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, представленное в исходном тексте, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Потомки Исава» выбрано вместо архаичного «сыны Исава»; образный оборот «перед собой» сохранён и пояснён. Тире делает длинное историческое сравнение ясным без изменения синтаксической связи.
