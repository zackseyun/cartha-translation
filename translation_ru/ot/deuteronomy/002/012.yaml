  source_fidelity: Основная проблема — יִירָשׁוּם передано лишь как «изгнали их», тогда как глагол в данном контексте включает овладение владениями прежних жителей. Формулировка «лишили их владений» передаёт этот аспект без излишнего развёртывания. Оборот מִפְּנֵיהֶם следует связать с устранением хорреев из присутствия/с пути потомков Исава, а не оставлять двусмысленное русское «истребили их перед собой».
  naturalness: «Истребили их перед собой» в современном русском звучит неестественно и может означать, что действие было совершено заранее. Перестройка на «истребили их, устранив со своего пути» сохраняет смысл идиомы и естественный литературный синтаксис. «С землёй своего владения» также тяжеловесно; «с землёй, полученной им во владение» ясно и сохраняет собирательное единственное число при «Израиль».
  terminology: «Сеир», «хорреи», «потомки Исава», «Израиль» и «Яхве» уместны. Сильное «истребили» адекватно שׁמד и не утверждает сверх текста полного физического уничтожения. Переход от единственного числа («им», то есть Израилем как народом) к множественному («им», то есть израильтянам) следует сохранить, насколько это возможно в русском контексте.
