base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: ru
  text: Пищу покупайте у них за серебро[a] и ешьте; также покупайте у них воду за серебро и пейте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с оттенком цели или результата: «Покупайте у них пищу за серебро, чтобы есть»; далее соответственно: «...воду за серебро, чтобы пить». Древнееврейская последовательность допускает такое понимание.'
    reason: Сохраняет отмеченную смысловую возможность целевого или результативного прочтения, но формулирует её на современном русском языке.
lexical_decisions:
- source_word: אֹכֶל
  choice: пищу
  rationale: Общее обозначение еды или съестных припасов; контекст не требует сужать значение до зерна.
- source_word: תִּשְׁבְּרוּ
  choice: покупайте
  rationale: Здесь глагол שׁבר означает приобретение пищи за плату; форма передаёт предписание, обращённое к Израилю.
- source_word: מֵאִתָּם
  choice: у них
  rationale: 'Естественно передаёт источник приобретения: пищу и воду следует получить у жителей Сеира, а не отнять.'
- source_word: בַּכֶּסֶף
  choice: за серебро
  rationale: Сохраняет конкретный древнееврейский образ средства платежа и естественно звучит по-русски.
- source_word: וַאֲכַלְתֶּם
  choice: и ешьте
  rationale: Сохраняет формальную сочинительную связь древнееврейской последовательности, не устраняя возможный оттенок результата или цели.
- source_word: וְגַם
  choice: также и
  rationale: Передаёт присоединение параллельного предписания о воде.
- source_word: מַיִם
  choice: воду
  rationale: Прямой русский эквивалент в требуемой синтаксической форме.
- source_word: תִּכְרוּ
  choice: покупайте
  rationale: В параллели с покупкой пищи и при уточнении «за серебро» כרה означает приобретение воды за плату, а не её выкапывание.
- source_word: וּשְׁתִיתֶם
  choice: и пейте
  rationale: Сохраняет древнееврейскую координацию и допускает контекстуальный оттенок последующего результата.
theological_decisions:
- issue: Нравственно-правовая сила повеления о ресурсах Эдома
  choice: Израиль должен покупать пищу и воду, платя серебром, а не брать их без возмещения.
  alternative: 'Можно выразить заключительные глаголы как цель: «чтобы вам есть… чтобы вам пить».'
  rationale: Упоминание платы дважды ясно сохраняет требование законного приобретения. Сочинительная передача заключительных глаголов ближе к форме еврейского текста и не делает оттенок цели единственно возможным.
translation_notes:
  register: Современный литературный русский язык; повелительные формы естественно передают предписывающие формы контекста. «За серебро» сохраняет историческую конкретность, а симметричная структура двух частей — ритм оригинала.
