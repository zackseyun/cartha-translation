  language: ru
  text: Только скот и добычу из захваченных нами городов мы взяли себе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: 'Передаёт ограничение по отношению к предыдущему стиху: людей предали заклятию, но скот и прочую добычу оставили себе.'
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: В контексте военной добычи слово обозначает домашних животных; русское собирательное «скот» естественно и точно.
- source_word: בָּזַזְנוּ לָנוּ
  choice: мы взяли себе как добычу
  rationale: Передаёт значение глагола «грабить, брать как добычу» и сохраняет значение выгоды/присвоения, выраженное לָנוּ.
- source_word: וּשְׁלַל
  choice: а также добычу
  rationale: שָׁלָל — военная добыча; «а также» ясно присоединяет второй объект и не создаёт неестественного повтора глагола.
- source_word: הֶעָרִים
  choice: из городов
  rationale: Родительная конструкция естественно передаёт принадлежность или происхождение добычи, взятой в городах.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: которые захватили
  rationale: לכד в военном контексте означает «захватить»; опущенное местоимение «мы» естественно восстанавливается формой сказуемого и контекстом.
