base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: ru
  text: А аввеев[a], живших в селениях[b] до Газы, уничтожили кафторяне, вышедшие из Кафтора, и поселились вместо них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аввитов».'
    reason: lexical_alternative
  - marker: b
    text: 'Также можно перевести: «в деревнях» или «в стоянках»; речь идёт о местах проживания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: аввеев
  rationale: Название народа передано традиционной русской транслитерацией; винительный падеж обусловлен тем, что этот народ является прямым дополнением при глаголе «уничтожили».
- source_word: הַיֹּשְׁבִים
  choice: живших
  rationale: Причастная форма естественно передаёт постоянное проживание и согласуется с «аввеев».
- source_word: בַּחֲצֵרִים
  choice: в селениях
  rationale: חֲצֵרִים обозначает места проживания, часто небольшие или неукреплённые поселения; «селения» сохраняет широту значения, не сводя его непременно к деревням либо временным стоянкам.
- source_word: עַד עַזָּה
  choice: до самой Газы
  rationale: Передаёт пространственный предел עַד и звучит естественно по-русски.
- source_word: כַּפְתֹּרִים
  choice: кафтореи
  rationale: Этноним передан принятой для русского библейского регистра формой, образованной от топонима Кафтор.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: пришедшие из Кафтора
  rationale: В данном контексте исход и переселение естественно выражаются русским «пришедшие из»; значение движения у יצא сохраняется.
- source_word: הִשְׁמִידֻם
  choice: уничтожили
  rationale: Порода Hiphil глагола שׁמד выражает полное уничтожение; выбран сильный, но стилистически сдержанный русский эквивалент.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: и поселились на их месте
  rationale: Передаёт как обитание, так и замещение прежних жителей, выраженное תַחְתָּם.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «А» сохраняет связь этого пояснения с предыдущим контекстом. Порядок слов перестроен ради ясности: аввеи представлены дополнением при «уничтожили», что соответствует синтаксису еврейского текста и устраняет возможную двусмысленность.'
