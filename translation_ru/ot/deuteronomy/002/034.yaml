  terminology: «Предали заклятию» удачно сохраняет особый смысл חרם; примечание следует сформулировать нейтральнее. Слова «как посвящённое Богу» и «безвозвратного посвящения людей или имущества» в прежнем примечании могут создать излишне конкретное представление о ритуальном посвящении. Достаточно объяснить, что в данном военном контексте термин означает обречение на уничтожение, а не магическое проклятие.
