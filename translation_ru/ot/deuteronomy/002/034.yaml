  source_fidelity: 'Вторая часть черновика передаёт חרם как техническое действие и верно сохраняет перечисление мужчин, женщин и малых детей. Однако конструкция «предали заклятию каждый город — мужчин, женщин и малых детей» синтаксически нарушена: перечисление в винительном падеже не может служить пояснением к «городу». Перестройка через «в каждом из них» ясно передаёт, что речь идёт о людях каждого взятого города, не добавляя сведений к тексту.'
