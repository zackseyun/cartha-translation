base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: ru
  text: В то время мы взяли все его города и в каждом из них предали заклятию[a] мужчин, женщин и малых детей. Мы не оставили в живых никого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол связан с понятием херем. Здесь он означает предание уничтожению; «заклятие» не подразумевает магического проклятия.
    reason: Пояснение специального значения חרם и предотвращение ошибочного понимания русского слова «заклятие» как магического проклятия.
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: мы взяли
  rationale: Глагол לכד в военном контексте означает овладеть городом. «Взяли» — естественное для современного русского языка обозначение захвата города.
- source_word: כָּל עָרָיו
  choice: все его города
  rationale: Передаёт и всеохватность כָּל, и местоименный суффикс «его»; עִיר здесь уместно переводить как «город».
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Прямой и естественный перевод временного оборота.
- source_word: וַנַּחֲרֵם
  choice: предали заклятию
  rationale: Глагол חרם обозначает посвящение на уничтожение в рамках херема. «Предали заклятию» сохраняет специальный сакрально-военный смысл, не сводя его просто к убийству или разорению.
- source_word: כָּל עִיר מְתִם
  choice: каждый город — мужчин
  rationale: 'Сжатая еврейская конструкция связывает каждый город с перечислением его жителей; מְתִם указывает на мужчин. Тире позволяет естественно по-русски открыть перечень: мужчины, женщины и дети.'
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: женщин и малых детей
  rationale: Сохраняется различение женщин и טף — малых детей или юных иждивенцев. «Малых детей» точнее общего «детей».
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Мы не оставили в живых никого
  rationale: Идиоматически передаёт отсутствие любого уцелевшего; смысл שָׂרִיד в данном военном контексте — «уцелевший».
theological_decisions:
- issue: Передача языка חרם в повествовании о завоевании
  choice: предали заклятию каждый город
  alternative: полностью уничтожили каждый город; обрекли каждый город на уничтожение
  rationale: Выбранная формулировка сохраняет особый сакрально-юридический оттенок חרם и не смягчает описываемое уничтожение. Смысл термина пояснён в сноске, поскольку слово «заклятие» без пояснения может быть понято как колдовство.
- issue: Гендерная конкретность מְתִם
  choice: мужчин, женщин и малых детей
  alternative: всех жителей, включая женщин и детей
  rationale: Еврейский текст отдельно называет мужчин, женщин и малых детей; перевод сохраняет это различение и не заменяет его обобщающим словом «жители».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Формулировка не смягчает жестокость эпизода. Техническое «предали заклятию» сохранено ради смысловой точности и разъяснено в сноске; синтаксис с тире перед перечнем передаёт сжатую структуру оригинала.
