lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Тогда … сказал
  rationale: Форма с וַ последовательно продвигает повествование, поэтому «тогда» естественно передаёт смену события. В этой краткой вводной формуле русское «сказал» звучит естественнее буквального «говорил»; последующее לֵאמֹר передано двоеточием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֵלַי
  choice: мне
  rationale: Предлог אֶל с суффиксом первого лица указывает на адресата речи; по-русски это естественно выражается дательным падежом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לֵאמֹר вводит последующую прямую речь. В современном русском эту функцию естественно выполняет двоеточие, тогда как «говоря» здесь было бы тяжеловесно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя; традиционная замена «Господь» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная повествовательная формула. Двоеточие вместо буквального «говоря» соответствует нормальному русскому введению прямой речи.
