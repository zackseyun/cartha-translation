  text: Then Yahweh spoke to me[a], saying,
translation:
  language: ru
  text: 'Тогда Яхве сказал мне[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; традиционно переводится как «Господь».'
