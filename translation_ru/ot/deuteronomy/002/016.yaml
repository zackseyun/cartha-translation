lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: И когда
  rationale: Сочетание вводит придаточное времени, продолжение которого следует в следующем стихе; по-русски естественно передаётся как «И когда».
- source_word: תַּמּוּ ... לָמוּת
  choice: умерли
  rationale: 'Конструкция буквально выражает завершение процесса смерти: все люди данной группы к этому времени уже умерли. Простое «умерли» естественно передаёт результат, тогда как «закончили умирать» по-русски звучит неуместно.'
- source_word: כָּל אַנְשֵׁי הַמִּלְחָמָה
  choice: все воины
  rationale: Буквально «все мужи войны»; современное русское «все воины» сохраняет мужской и военный смысл без архаической тяжеловесности.
- source_word: מִקֶּרֶב הָעָם
  choice: исчезнув из среды народа
  rationale: Предлог מִן с קֶרֶב обозначает устранение из состава народа. Деепричастный оборот ясно связывает исчезновение из среды народа со смертью и не создаёт неестественного русского сочетания «умерли из среды».
