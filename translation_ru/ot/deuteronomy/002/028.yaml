base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: ru
  text: Пищу продавай мне за серебро[a], чтобы я мог есть, и воду давай мне за серебро, чтобы я мог пить. Только позволь мне пройти пешком[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за деньги». Буквально: «за серебро».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на моих ногах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: пищу
  rationale: Общее обозначение еды; контекст не требует сужать значение до хлеба или зерна.
- source_word: בַּכֶּסֶף
  choice: за серебро
  rationale: Сохраняет конкретный образ еврейского כֶּסֶף и в данном контексте естественно выражает плату.
- source_word: תַּשְׁבִּרֵנִי
  choice: продавай мне
  rationale: Hiphil глагола שׁבר здесь означает продавать или отпускать пищу; форма передаёт обращённую к собеседнику просьбу.
- source_word: וְאָכַלְתִּי
  choice: чтобы я мог есть
  rationale: Передаёт предполагаемый результат или цель просьбы, не превращая высказывание в простое предсказание.
- source_word: וּמַיִם
  choice: воду
  rationale: Прямое и естественное соответствие.
- source_word: תִּתֶּן לִי
  choice: давай мне
  rationale: Передаёт נתן с косвенным дополнением и согласуется с просьбой регулярно предоставлять необходимую воду во время прохода.
- source_word: וְשָׁתִיתִי
  choice: чтобы я мог пить
  rationale: Как и предыдущее וְאָכַלְתִּי, выражает предполагаемый результат или цель.
- source_word: רַק
  choice: только
  rationale: Ограничивает просьбу одним требованием — разрешить проход.
- source_word: אֶעְבְּרָה
  choice: позволь мне пройти
  rationale: Когортатив имеет здесь просительное, разрешительное значение.
- source_word: בְרַגְלָי
  choice: пешком
  rationale: Естественный русский эквивалент выражения «на моих ногах», обозначающий проход своим ходом, без притязания на землю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Повтор синтаксических конструкций сохранён вслед за еврейским оригиналом; буквальный семитский оборот בְרַגְלָי передан естественным русским «пешком», а буквальная форма отмечена в сноске. Финальное тире сохраняет незавершённость фразы, продолжающейся в следующем стихе.
