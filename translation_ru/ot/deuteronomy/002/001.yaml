source:
  edition: WLC
  text: וַ/נֵּ֜פֶן וַ/נִּסַּ֤ע הַ/מִּדְבָּ֨רָ/ה֙ דֶּ֣רֶךְ יַם ס֔וּף כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/נָּ֥סָב אֶת הַר שֵׂעִ֖יר יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: ru
  text: И мы повернули и отправились в пустыню по дороге к Красному морю[a], как сказал мне Яхве, и много дней обходили гору Сеир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тростниковому морю». Так можно передать еврейское название Ям-Суф более буквально.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: И мы повернули
  rationale: Глагол פנה обозначает поворот или изменение направления; перевод не добавляет значения возвращения, которого сама форма прямо не выражает.
- source_word: וַנִּסַּע
  choice: отправились
  rationale: В контексте передвижения נסע означает сняться с места и выступить в путь; «отправились» естественно передаёт это значение по-русски.
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительный суффикс -ה указывает на движение в сторону пустыни; русская конструкция «отправились в пустыню» сохраняет эту направленность.
- source_word: דֶּרֶךְ יַם סוּף
  choice: по дороге к Красному морю[a]
  rationale: דֶּרֶךְ здесь обозначает дорогу или путь следования. Традиционное географическое название «Красное море» помещено в основной текст, а более буквальный вариант названия יַם סוּף приведён в сноске.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: как сказал мне Яхве
  rationale: כַּאֲשֶׁר выражает соответствие («как»), а דִּבֶּר אֶל — обращённую к кому-либо речь. «Сказал» звучит естественно и не добавляет прямо не выраженного здесь значения приказа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: обходили гору Сеир
  rationale: סבב означает двигаться вокруг или обходить. Несовершенный вид «обходили» вместе с указанием длительности естественно передаёт продолжительное движение вокруг Сеира.
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Выражение буквально обозначает длительность в течение многих дней; прямой русский эквивалент сохраняет конкретный образ времени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и представляет наиболее распространённую научную реконструкцию его произношения, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены последовательность действий, конкретное указание длительности и личное имя Яхве; архаизмы и избыточно церковная лексика не используются.
