lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с повествовательным וַ־ продолжает последовательность событий; «тогда» естественно передаёт переход к следующему действию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֵלַי
  choice: мне
  rationale: 'Предлог אֶל с суффиксом первого лица единственного числа означает адресата речи: «мне».'
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит прямую речь следующего стиха. В современном русском его функцию естественно передаёт двоеточие; буквальное «говоря» отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык. Двоеточие устраняет неестественную для русского повествования конструкцию «сказал мне, говоря», не теряя её функции; буквальная форма сохранена в сноске.
