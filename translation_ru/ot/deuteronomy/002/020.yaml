base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: ru
  text: И эта земля считается землёй рефаимов[a]. Прежде в ней жили рефаимы[b], а аммонитяне называют их замзуммимами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «земля рефаимов».'
    reason: 'Еврейское сочетание допускает более определённое понимание: «земля рефаимов».'
  - marker: b
    text: «Рефаимы» — название древнего народа, который по традиции связывали с необычайно высоким ростом; поэтому в некоторых переводах здесь стоит «великаны».
    reason: Сноска сохраняет этноним в тексте, одновременно отмечая традиционное толкование, не превращая его в однозначный перевод.
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: землёй рефаимов
  rationale: Сочетание обозначает землю, связанную с народом рефаимов. Этноним сохранён транслитерацией, а не истолкован как «великаны».
- source_word: תֵּחָשֵׁב
  choice: считается
  rationale: Форма нифаля передаёт значение «считаться, рассматриваться как»; настоящее время соответствует форме и пояснительному характеру высказывания.
- source_word: אַף הִוא
  choice: И эта земля
  rationale: Частица אַף добавляет упомянутую землю к предшествующему примеру; явное повторение «земля» естественно по-русски и устраняет неясность местоимения.
- source_word: רְפָאִים
  choice: рефаимы
  rationale: В контексте это название древнего народа, сопоставленное с аммонитским названием «замзуммимы»; поэтому сохранён этноним.
- source_word: יָשְׁבוּ בָהּ
  choice: в ней жили
  rationale: Глагол ישׁב здесь естественно означает проживание на данной земле.
- source_word: לְפָנִים
  choice: прежде
  rationale: Кратко и естественно передаёт указание на прежние времена.
- source_word: וְהָעַמֹּנִים
  choice: а аммонитяне
  rationale: Союз «а» естественно отмечает переход от общего названия народа к названию, принятому у аммонитян, не создавая сильного противопоставления.
- source_word: יִקְרְאוּ לָהֶם
  choice: называли их
  rationale: В контексте описывается принятое аммонитянами наименование народа в прошлом; русское прошедшее время согласуется с повествовательной перспективой.
- source_word: זַמְזֻמִּים
  choice: замзуммимами
  rationale: Название народа передано транслитерацией и поставлено в требуемый русским глагольным управлением творительный падеж.
