  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: ru
  text: И Яхве, наш Бог, отдал его в наши руки[a], и мы поразили его, его сыновей[b] и весь его народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед нами»; в данном военном контексте это означает, что Яхве отдал его во власть Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'В согласном тексте: «его сына»; здесь это слово традиционно понимают во множественном или собирательном смысле: «его сыновей».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: предал его нам
  rationale: В военном контексте сочетание נתן с לְפָנֵינוּ означает, что Бог отдал врага во власть Израиля. «Предал его нам» естественно передаёт этот смысл, не ограничиваясь буквальным «дал его перед нами».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Форма с суффиксом первого лица множественного числа прямо означает «наш Бог».
- source_word: וַנַּךְ
  choice: мы поразили
  rationale: Глагол נכה в повествовании о войне обозначает нанесение решающего поражения и может подразумевать гибель. «Поразили» сохраняет силу выражения, не делая подразумеваемую смерть единственно возможным смыслом.
- source_word: בנו
  choice: его сыновей
  rationale: Хотя согласный текст допускает чтение в единственном числе «его сына», традиционное понимание в данном контексте — множественное или собирательное; неоднозначность отмечена в сноске.
- source_word: כָּל עַמּוֹ
  choice: весь его народ
  rationale: Прямое значение עַם — «народ». Контекст военного столкновения не требует сужать смысл до одного лишь войска.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Божье действие и человеческое действие в победе
  choice: «Яхве… предал его нам, и мы поразили»
  alternative: Свести всё действие либо только к Божьему вмешательству, либо только к военной победе Израиля
  rationale: 'Перевод сохраняет последовательность исходного текста: Бог отдаёт противника во власть Израиля, а Израиль наносит ему поражение.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Синтаксис остаётся ясным и близким к структуре еврейского текста; архаизмы и конфессионально окрашенные замены Божьего имени не используются.
