  naturalness: Исправленный текст сохраняет современный литературный библейский регистр. «Окажешься напротив» естественно передаёт пространственную ситуацию; «не тесни их» кратко и литературно в данном контексте. «Не вступай с ними в борьбу» остаётся допустимой широкой передачей второго запрета, не добавляя слова «война».
  terminology: «Сыны Аммона» и «сыны Лота» последовательно сохраняют родственные формулы еврейского текста. «Во владение» уместно для יְרֻשָּׁה; вариант «в наследие» корректно вынесен в примечание. Маркеры примечаний размещены у соответствующих слов и не требуют структурных изменений.
