  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: ru
  text: 'Когда ты окажешься напротив сынов Аммона[a], не тесни их[b] и не вступай с ними в борьбу, потому что Я не дам тебе во владение[c] ничего из земли сынов Аммона: ведь Я отдал её во владение сынам Лота.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к аммонитянам»; так же далее в стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не нападай на них». Еврейское слово может обозначать враждебные действия вообще, а не только осаду.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в наследие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Когда подойдёшь к
  rationale: Передаёт приближение и пространственное значение מוּל естественным современным русским оборотом, не утверждая, что Израиль уже вошёл на эту землю.
- source_word: בְּנֵי עַמּוֹן
  choice: сыны Аммона
  rationale: Сохраняет родственную формулу оригинала и её параллель с выражением «сыны Лота»; более идиоматичный вариант «аммонитяне» указан в примечании.
- source_word: אַל תְּצֻרֵם
  choice: не притесняй их
  rationale: Передаёт запрет враждебного давления шире, чем узкое «не осаждай»; возможное значение нападения отмечено в примечании.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: не вступай с ними в борьбу
  rationale: Отражает значение разжигания или начала враждебного столкновения, не добавляя отсутствующее в данном стихе слово «война».
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: ничего из земли сынов Аммона
  rationale: 'Ясно выражает партитивное значение מִן при отрицании: Израилю не будет дана никакая часть этой земли.'
- source_word: יְרֻשָּׁה
  choice: во владение
  rationale: Подходит к контексту дарованной территории и сохраняет возможное значение устойчивого земельного удела; «в наследие» дано как альтернатива.
- source_word: לִבְנֵי לוֹט נְתַתִּיהָ
  choice: Я отдал её во владение сынам Лота
  rationale: Сохраняет завершённость божественного дарования и родственную формулу исходного текста.
theological_decisions:
- issue: Родственные обозначения народов
  choice: сыны Аммона / сыны Лота
  alternative: аммонитяне / потомки Лота
  rationale: Буквальная родственная формула подчёркивает происхождение народа и основание данного ему земельного удела, не превращая выражение в исключительно этническое обозначение.
- issue: Характер запрета враждебных действий
  choice: не притесняй их и не вступай с ними в борьбу
  alternative: не осаждай их и не провоцируй их
  rationale: Выбор сохраняет широкий смысл двух еврейских глаголов и не добавляет прямого упоминания войны, которого в этом стихе нет.
