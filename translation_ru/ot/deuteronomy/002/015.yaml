base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: ru
  text: К тому же рука Яхве была против них, чтобы привести их в смятение и удалить из стана, пока с ними не было покончено[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «пока им не пришёл конец», «пока они не погибли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: И
  rationale: В данном контексте естественно продолжает мысль предыдущего стиха; усилительное значение גַּם подразумевается связью повествования и не требует тяжеловесного «и также».
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохраняет еврейский образ непосредственного действия и силы Бога, а также передаёт личное имя יהוה как «Яхве».
- source_word: בָם
  choice: против них
  rationale: При выражении «рука Яхве» предлог обозначает направленное против них враждебное действие.
- source_word: לְהֻמָּם
  choice: приводя их в смятение
  rationale: Глагол המם в породе хифиль выражает причинение смятения, паники или растерянности; перевод не подменяет это значение итоговым уничтожением.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: среди стана
  rationale: В сочетании с המם начальное מִן допускает понимание сферы, внутри которой происходило поражающее действие; «стан» сохраняет конкретный образ лагеря общины.
- source_word: עַד תֻּמָּם
  choice: пока они не исчезли
  rationale: Передаёт полное прекращение существования данной группы, не уточняя сверх текста, умерли ли они исключительно вследствие смятения или иным образом под Божьим судом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо содержит тетраграмматон; личное имя сохранено, а не заменено титулом.
- issue: Характер действия Божьей руки
  choice: была против них
  alternative: была на них
  rationale: Контекст суда над поколением воинов требует отрицательной направленности, однако образ «руки» сохранён без догматического расширения.
- issue: Связь смятения с гибелью поколения
  choice: приводя их в смятение… пока они не исчезли
  alternative: истребляя их… пока они не погибли
  rationale: Различаются лексическое значение המם и конечный результат תֻּמָּם, чтобы не сводить оба выражения к одному понятию уничтожения.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Стан» выбран ради узнаваемого конкретного образа и параллели с контекстом странствования; синтаксис сделан ясным, а смысловая неоднозначность глаголов המם и תמם сохранена в сносках.
