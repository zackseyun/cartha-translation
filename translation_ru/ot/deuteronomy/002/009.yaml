source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: ru
  text: 'И сказал мне Яхве: «Не притесняй Моав и не вступай с ним в войну[a], потому что Я не дам тебе ни части его земли во владение[b], ибо Ар Я отдал сынам Лота во владение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не враждуй с Моавом и не затевай с ним войны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в наследие»; так можно перевести оба употребления выражения «во владение» в этом стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: Не притесняй Моав
  rationale: Глагол צרר здесь обозначает враждебное давление или притеснение; формулировка отличается от следующего прямого запрета военных действий.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: и не вступай с ним в войну
  rationale: Сочетание hitpael глагола גרה с מִלְחָמָה означает вступление в военное противоборство; русская формулировка естественна и сохраняет военный смысл.
- source_word: מֵאַרְצוֹ
  choice: ни части его земли
  rationale: 'Предлог מִן имеет партитивное значение: Израилю не будет отдана никакая часть земли Моава. Мужской суффикс сохранён местоимением «его».'
- source_word: יְרֻשָּׁה
  choice: во владение
  rationale: Слово обозначает владение, полученное как наследственный удел; «во владение» ясно и естественно в обоих случаях.
- source_word: לִבְנֵי לוֹט
  choice: сынам Лота
  rationale: Сохраняет буквальную генеалогическую формулировку оригинала; в контексте речь идёт о потомках Лота.
- source_word: עָר
  choice: Ар
  rationale: Стандартная русская транслитерация названия территории или города Моава.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Форма «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Земля Моава как дар потомкам Лота
  choice: «Ар Я отдал сынам Лота во владение»
  alternative: «Ар Я отдал потомкам Лота в наследие»
  rationale: Перевод сохраняет утверждение о Божьем даровании земли и не уточняет сверх текста характер или продолжительность этого владения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «Яхве», «Моав», «Ар» и «сынам Лота» сохраняют имена и генеалогическую структуру исходного текста; синтаксис упрощён до естественного русского порядка слов без устранения смысловой параллели запретов.
