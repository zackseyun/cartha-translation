translation:
  language: ru
  text: И выступил Сихон навстречу нам, он и весь его народ, чтобы сразиться у Яхаца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: выступил
  rationale: Глагол יצא в повествовании обозначает выход навстречу другой стороне; в военном контексте русское «выступил» естественно передаёт организованное движение на бой.
- source_word: סִיחֹן
  choice: Сихон
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: לִקְרָאתֵנוּ
  choice: навстречу нам
  rationale: Буквально передаёт конструкцию с לקראת, не устраняя её формальной нейтральности; враждебный смысл ясно задаётся последующим «чтобы сразиться».
- source_word: הוּא וְכָל עַמּוֹ
  choice: он и весь его народ
  rationale: Сохраняет самостоятельное местоимение и обычное значение עם «народ», не сужая его до профессионального войска.
- source_word: לַמִּלְחָמָה
  choice: чтобы сразиться
  rationale: Естественно по-русски выражает цель выхода; значение войны или битвы в данном эпизоде передано глагольной конструкцией.
- source_word: יָהְצָה
  choice: у Яхаца
  rationale: Направительный -ה у топонима в данном контексте обозначает место, к которому направились и где произошло сражение; «у Яхаца» соответствует традиционной русской форме названия и не утверждает непременно пребывание внутри поселения.
