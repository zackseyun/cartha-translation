base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: ru
  text: 'подобно тому, как Он поступил ради потомков Исава[a], живущих в Сеире: Он истребил хорреев перед ними[b], а они лишили их владений[c] и поселились на их месте, где живут по сей день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновей Исава», то есть потомков Исава.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение «перед ними» здесь означает, что хорреи были устранены с их пути и территории.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «овладели ими»; в данном контексте имеется в виду, что потомки Исава лишили хорреев владений и заняли их землю.'
    reason: lexical_alternative
lexical_decisions:
