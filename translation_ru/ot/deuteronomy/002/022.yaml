- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: живущих в Сеире
  rationale: Естественно передаёт причастную конструкцию современным литературным русским языком.
- source_word: הִשְׁמִיד
  choice: истребил
  rationale: Передаёт сильное каузативное значение уничтожения без разговорной окраски.
- source_word: הַחֹרִי
  choice: хорреев
  rationale: Традиционная русская передача названия народа.
- source_word: מִפְּנֵיהֶם
  choice: перед ними
  rationale: Сохраняет образ еврейского выражения; по смыслу Бог устранил хорреев с пути и территории сынов Исава.
- source_word: וַיִּירָשֻׁם
  choice: они овладели их землёй
  rationale: В контексте завоевания ירשׁ означает вступить во владение, лишив прежних жителей их территории. Упоминание земли делает этот смысл ясным по-русски и избегает двусмысленного «овладели ими».
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: поселились на их месте
  rationale: Точно выражает заселение места, прежде занятого хорреями.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: по сей день
  rationale: Устойчивое и понятное русское соответствие еврейской временной формуле.
theological_decisions:
- issue: Подразумеваемое подлежащее глаголов «сделал» и «истребил»
  choice: Местоимение «Он» относится к Господу из непосредственного контекста.
  alternative: Оставить подлежащее невыраженным или передать конструкцию безлично.
  rationale: Формы единственного числа мужского рода и параллель с окружающими стихами указывают на действие Господа; прописная буква проясняет референцию, не вводя нового богословского содержания.
- issue: Соотношение Божьего действия и действий сынов Исава
  choice: Бог истребляет хорреев, после чего сыны Исава овладевают их землёй и занимают их место.
  alternative: Приписать все действия одному подлежащему.
  rationale: Еврейский текст переходит от единственного числа в הִשְׁמִיד к множественному в וַיִּירָשֻׁם и וַיֵּשְׁבוּ, сохраняя различие между Божьим действием и действиями потомков Исава.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Живущих» и «поселились» предпочтены архаизирующим «обитающих» и «водворились». Синтаксис сохраняет связь стиха с предшествующим контекстом.
