source:
  edition: WLC
  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: ru
  text: От Ароера, расположенного на краю долины Арнона, и города, находящегося в долине, вплоть до Галаада не было ни одного города, который оказался бы для нас недосягаемым[a]. Всё это Яхве, наш Бог, отдал нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не было города, который был бы слишком высок для нас»; высота здесь служит образом укреплённости или недоступности.'
    reason: Сохраняет буквальную метафору שָׂגְבָה и указывает возможные смысловые оттенки, не сводя выражение только к одному из них.
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: От Ароэра
  rationale: Предлог מִן обозначает исходную точку географического диапазона; «от» естественно передаёт это значение.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: на краю долины Арнон
  rationale: שָׂפָה буквально означает «губа, край, берег», а נַחַל может обозначать поток, ущелье или долину; данная формулировка ясно передаёт топографию без излишней технической терминологии.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: и города, находящегося в долине
  rationale: Сохранён простой соединительный союз וְ без добавления отсутствующего в еврейском тексте предлога «от»; родительный падеж обусловлен русским построением всего географического оборота.
- source_word: וְעַד הַגִּלְעָד
  choice: вплоть до Галаада
  rationale: עַד указывает конечную границу описываемого пространства.
- source_word: קִרְיָה
  choice: город
  rationale: קִרְיָה обозначает город или поселение; в военном контексте «город» звучит естественно и не исключает укреплённого населённого пункта.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: оказался бы для нас недосягаемым
  rationale: Глагол שׂגב выражает высоту и вследствие этого укреплённость или недоступность. Перевод передаёт контекстуальный смысл, а буквальный образ отмечен в сноске.
- source_word: אֶת־הַכֹּל
  choice: Всё это
  rationale: Собирательное הַכֹּל охватывает всю только что названную территорию вместе с её городами; единственное собирательное выражение сохраняется.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Яхве, наш Бог
  rationale: Личное имя יהוה передано как «Яхве», а אֱלֹהֵינוּ — как «наш Бог».
- source_word: לְפָנֵינוּ
  choice: отдал нам
  rationale: В повествовании о завоевании идиома נָתַן לִפְנֵי означает отдать или предоставить в чью-либо власть. Буквальное «перед нами» в современном русском здесь затемняло бы смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Характер Божьего действия в выражении נָתַן ... לְפָנֵינוּ
  choice: отдал нам
  alternative: предал в наши руки
  rationale: Выбрана нейтральная передача идиомы, выражающая предоставление территории и городов Израилю без добавления образа «рук», которого в данном стихе нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Географический перечень сохранён близко к синтаксису источника, а непрозрачная для русского читателя военная метафора естественно передана в тексте и раскрыта в сноске.
