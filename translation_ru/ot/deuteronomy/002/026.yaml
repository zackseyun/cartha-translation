  text: 'Тогда я послал из пустыни Кедемот к Сихону, царю Хешбона, послов со словами мира[a], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с предложением мира». Буквально: «со словами мира» — то есть с мирным дипломатическим обращением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: И послал я
  rationale: Последовательная форма с וַ־ продолжает повествование; русское «И послал я» сохраняет связь с предшествующим контекстом и подчёркивает подлежащее первого лица.
- source_word: מַלְאָכִים
  choice: послов
  rationale: В дипломатическом контексте речь идёт о людях-представителях, а не об ангелах; «послы» естественно передаёт их официальную миссию.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: из пустыни Кедемоф
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность. Название קְדֵמוֹת передано в принятой русской библейской форме «Кедемоф».
- source_word: סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: к Сигону, царю Хешбона
  rationale: Сохранена аппозиция с царским титулом; имена переданы в современных русских библейских формах.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: со словами мира
  rationale: Буквальное выражение «слова мира» сохраняет образность и допускает как мирное обращение, так и предложение условий мира.
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Стандартная формула введения прямой речи; двоеточие указывает на продолжение речи в следующем стихе.
