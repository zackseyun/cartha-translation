base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: ru
  text: Но Сихон, царь Хешбона, не захотел пропустить нас через свою землю, потому что Яхве, твой Бог, ожесточил его дух и сделал его сердце непреклонным[a], чтобы предать его в твою руку, как и ныне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепил его сердце». Еврейский глагол может означать «укреплять, делать сильным», однако здесь по контексту речь идёт о непреклонности или упрямстве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: не захотел
  rationale: Передаёт внутреннее нежелание или отсутствие согласия, а не только внешний отказ.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: пропустить нас через свою землю
  rationale: Порода hифиль выражает разрешение или побуждение пройти, а местоименное בּוֹ в контексте относится к владениям Сихона; явное «через свою землю» естественно по-русски.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: ожесточил его дух
  rationale: Сохраняет и значение «сделал жёстким», и еврейский антропологический термин «дух».
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: сделал его сердце непреклонным
  rationale: Глагол буквально может обозначать укрепление, но в данном контексте описывает стойкое, упрямое противление; «непреклонным» передаёт контекстуальный смысл, не сливая выражение с предшествующим «ожесточил».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно и ясно передаёт целевое значение конструкции.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: предать его в твою руку
  rationale: Сохраняет понятный библейский образ передачи человека во власть другого.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и произошло ныне
  rationale: Передаёт указание на очевидный к моменту речи итог; добавление «произошло» делает эллиптическую идиому понятной на современном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Божественное ожесточение и нежелание Сихона
  choice: Прямо сохранить как нежелание Сихона, так и совершённое Яхве ожесточение.
  alternative: Ослабить причинность, представив Бога лишь допускающим самоожесточение Сихона.
  rationale: Еврейский текст недвусмысленно утверждает оба положения; перевод не должен устранять содержащуюся в тексте богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены выражения «его дух» и «в твою руку»; архаичные синтаксис и лексика по возможности исключены.
