  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: ru
  text: Не вступайте с ними в вражду, ибо Я не дам вам из их земли даже места, куда можно поставить ногу, ибо гору Сеир Я отдал Исаву во владение[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до ступания подошвы ноги»; то есть: ни малейшего участка земли.'
    reason: lexical_alternative
  - marker: b
    text: «Гора Сеир» может означать также гористую область, или нагорье, Сеира.
    reason: cultural_note
  - marker: c
    text: 'Или: «в наследие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: Не вступайте с ними в вражду
  rationale: Порода хитпаэль глагола גרה с предлогом ב указывает на враждебное столкновение или разжигание конфликта. Такая формулировка естественна по-русски и, в отличие от узкого «не нападайте», не сводит запрет только к началу военных действий.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: Я не дам вам из их земли
  rationale: 'Сохранено партитивное значение предлога מן: Бог не даст Израилю никакой части земли эдомитян.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: даже места, куда могла бы ступить стопа
  rationale: Передан буквальный образ ступающей стопы и идиоматический смысл предельно малого участка земли.
- source_word: יְרֻשָּׁה
  choice: во владение
  rationale: Слово обозначает владение, полученное в удел, и допускает также перевод «в наследие». В данном контексте акцент сделан на дарованной Богом территории.
- source_word: לְעֵשָׂו
  choice: Исаву
  rationale: Дательный падеж естественно передаёт получателя Божьего дара.
- source_word: הַר שֵׂעִיר
  choice: гору Сеир
  rationale: Формально сохраняется традиционное обозначение; при этом еврейское выражение может называть всю гористую область Сеира.
theological_decisions:
- issue: Божественное дарование территории Эдому
  choice: Запрет вступать во вражду обоснован тем, что Бог отдал Сеир Исаву.
  alternative: Передать запрет как исключительно политическое предписание, не подчёркивая Божьего распределения земель.
  rationale: Обе причинные частицы כִּי связывают запрет с решением Бога не давать Израилю земли Эдома и с Его прежним даром Исаву; перевод сохраняет эту связь без добавочного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным для широкого читателя; образ стопы сохранён, а неоднозначность יְרֻשָּׁה и географический объём הַר שֵׂעִיר отмечены в сносках.
