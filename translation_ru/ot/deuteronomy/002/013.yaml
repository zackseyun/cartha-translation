  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: ru
  text: Теперь встаньте и перейдите через поток Заред[a]. И мы перешли через поток Заред.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «русло Заред»; возможно также: «долину Заред». Еврейское נחל в зависимости от местности может обозначать поток, русло сезонного водотока или долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временной указатель, вводящий следующее повеление, и сохраняет непосредственность еврейского текста.
- source_word: קֻמוּ
  choice: встаньте
  rationale: Форма повелительного наклонения множественного числа; естественно и достаточно торжественно передаёт призыв начать действие.
- source_word: וְעִבְרוּ
  choice: и перейдите через
  rationale: В контексте пути עבר означает переход с одной стороны на другую; русский глагол «перейти» естественно выражает направленность.
- source_word: לָכֶם
  choice: не выражено отдельно
  rationale: Этический дательный придаёт повелению идиоматический оттенок, который по-русски уже содержится в форме повелительного наклонения; буквальное «себе» звучало бы неестественно.
- source_word: נַחַל
  choice: поток
  rationale: נחל может обозначать водоток, русло или долину сезонной реки. «Поток» остаётся понятным современному читателю и не утверждает без необходимости, что речь идёт о постоянной реке; диапазон значения указан в сноске.
- source_word: זָרֶד
  choice: Заред
  rationale: Географическое название передано принятой русской библейской транслитерацией.
- source_word: וַנַּעֲבֹר
  choice: И мы перешли
  rationale: Последовательная глагольная форма повествует об исполнении повеления. Союз «И» сохраняет простую еврейскую последовательность, не усиливая причинно-следственный оттенок.
