  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: ru
  text: 'Лишь к земле аммонитян[a] ты не приближался: ни к какой-либо части местности у потока Яббок[b], ни к городам нагорья, ни к чему, о чём повелел Яхве, наш Бог[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к земле сынов Аммона».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ко всей руке потока Яббок»; это выражение означает берег, сторону или прилегающую к потоку местность.'
    reason: cultural_note
  - marker: c
    text: 'Еврейское выражение эллиптично: предмет повеления не назван. Его также понимают как «как повелел Яхве, наш Бог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Вводит исключение из предшествующего рассказа о занятых землях; кратко и естественно передаёт ограничительное значение.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: к земле аммонитян
  rationale: Современное русское название народа звучит естественнее буквального «сынов Аммона»; буквальная форма отмечена в сноске.
- source_word: לֹא קָרָבְתָּ
  choice: ты не приближался
  rationale: Сохраняет пространственное значение глагола קרב и обращение к Израилю как к единому народу во втором лице единственного числа, не уточняя, шла ли речь именно о военном нападении.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: ни к местности вдоль потока Яббок
  rationale: Идиома יַד применительно к водотоку обозначает сторону, берег или прилегающую область; «местность вдоль» передаёт её шире, чем один берег, а повтор «ни» естественно распространяет отрицание.
- source_word: וְעָרֵי הָהָר
  choice: ни к городам нагорья
  rationale: הָהָר здесь обозначает гористую область, а не одну конкретную гору; «нагорье» — компактное географическое соответствие.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: ни ко всему тому, о чём повелел
  rationale: Сохраняет эллиптичность еврейской фразы и не добавляет отсутствующий в тексте глагол «запретил» или явно названный объект повеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Прямо передаёт форму первого лица множественного числа и заветное обозначение Бога Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл заключительной эллиптической фразы וְכֹל אֲשֶׁר צִוָּה
  choice: о чём повелел Яхве
  alternative: что запретил Яхве / как повелел Яхве
  rationale: Масоретский текст не называет предмет повеления и не употребляет глагол «запрещать». Основной текст сохраняет эту недосказанность, а сноска указывает возможное контекстуальное понимание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Единственное число «ты» сохранено как коллективное обращение к Израилю. Географические формулировки сделаны понятными без устранения эллиптичности заключительной части стиха.
