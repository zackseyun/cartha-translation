base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: ru
  text: Эмимы прежде[a] жили там — народ великий, многочисленный и рослый, как анакимы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в прежние времена».'
    reason: Лексический вариант временного выражения לְפָנִים.
lexical_decisions:
- source_word: הָאֵמִים
  choice: Эмимы
  rationale: Этноним передан принятой русской транслитерацией, а не переведён по предполагаемой этимологии.
- source_word: לְפָנִים
  choice: прежде
  rationale: В данном временном употреблении выражение означает «прежде, в прежние времена»; краткое «прежде» естественно для современного литературного русского.
- source_word: יָשְׁבוּ בָהּ
  choice: жили там
  rationale: Глагол ישׁב с предлогом ב обозначает проживание; местоименный суффикс женского рода отсылает к ранее названной земле или области, поэтому по-русски естественно «там».
- source_word: עַם
  choice: народ
  rationale: Слово обозначает этническую общность и сохраняется как собирательное существительное в единственном числе.
- source_word: גָּדוֹל
  choice: великий
  rationale: Сохраняет широкое значение величины и внушительности народа, не сводя его только к численности, которая отдельно выражена следующим словом.
- source_word: וְרַב
  choice: многочисленный
  rationale: В данном перечислении слово характеризует численность народа; «многочисленный» точно и естественно согласуется с «народ».
- source_word: וָרָם
  choice: рослый
  rationale: В сопоставлении с анакимами прилагательное указывает на высокий рост. «Рослый» естественно характеризует людей и сохраняет физический смысл.
- source_word: כָּעֲנָקִים
  choice: как анакимы
  rationale: Сравнительная частица כ передаёт уподобление, а этноним транслитерирован в традиционной русской форме.
