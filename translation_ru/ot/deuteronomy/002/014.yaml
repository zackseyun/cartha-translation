reference: Deuteronomy 2:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: ru
  text: А от Кадес-Барнеа до того времени, когда мы перешли поток Зеред[a], мы шли тридцать восемь лет, пока всё поколение воинов не исчезло из стана, как и поклялся им Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «русло Зеред»; еврейское слово может обозначать сезонный поток, его русло или ручей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: А времени
  rationale: Буквально «и дни», но в данном контексте сочетание обозначает продолжительность пути; «времени ... было» естественно передаёт эту функцию по-русски.
- source_word: הָלַכְנוּ מִקָּדֵשׁ בַּרְנֵעַ
  choice: с тех пор, как мы вышли из Кадес-Барнеа
  rationale: В маршрутном контексте הלך обозначает путь или движение; конструкция с исходной точкой естественно передаётся глаголом «вышли».
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: до того, как перешли
  rationale: עבר при водотоке означает пересечение; русское «перешли» кратко и идиоматично.
- source_word: נַחַל זֶרֶד
  choice: поток Зеред
  rationale: נחל может обозначать поток, русло сезонного водотока или ручей. «Поток» сохраняет родовую неопределённость лучше, чем более узкие варианты.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: тридцать восемь лет
  rationale: Нормальная современная русская форма числительного.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: К тому времени всё поколение ... исчезло
  rationale: תֹּם выражает полное прекращение существования поколения; формулировка передаёт завершившийся к указанному сроку процесс.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воинов
  rationale: Буквально «мужей войны»; «воины» естественно передаёт явно мужскую военную группу без тяжеловесности.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: из стана
  rationale: Сочетание означает исчезновение из среды лагеря. «Из стана» сохраняет коллективно-лагерный образ и достоинство стиля.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: как и поклялся им Яхве
  rationale: Сохраняется явная клятва и личное имя יהוה; совершенный вид указывает на предшествовавшую клятву.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Кого обозначает אַנְשֵׁי הַמִּלְחָמָה
  choice: воины
  alternative: мужи войны; способные к войне мужчины
  rationale: Еврейское выражение явно относится к мужчинам военного поколения. «Воины» сохраняет этот смысл и не расширяет его до всего поколения без различия пола.
- issue: Смысл תֹּם в контексте суда
  choice: исчезло из стана
  alternative: вымерло; было истреблено
  rationale: Текст утверждает полное прекращение присутствия поколения, но в этом стихе не уточняет единый способ смерти; нейтральное «исчезло» не усиливает причинность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранено слово «стан» как понятное и уместное для походного лагеря; синтаксис разделён на два предложения ради ясности при сохранении логической связи срока и исчезновения поколения.
