lexical_decisions:
- source_word: צוּר
  choice: Твердыня
  rationale: Буквально «скала»; во Второзаконии это насыщенный смыслом образ и наименование Бога Израиля. «Твердыня» сохраняет метафору и звучит в современном русском языке как возвышенный, но понятный божественный титул.
- source_word: יְלָדְךָ
  choice: породившей тебя
  rationale: Форма глагола ילד здесь представляет Бога как Того, кто произвёл Израиль на свет. «Породившей» передаёт идею рождения и допускает оттенок «зачавшей», хотя грамматический род русского слова «Твердыня» не позволяет в точности воспроизвести отцовский оттенок еврейской конструкции.
- source_word: תֶּשִׁי
  choice: ты пренебрёг
  rationale: Редкий и трудный глагол в параллели с «забыл» выражает виновное невнимание или небрежение. «Пренебрёг» сохраняет смысловой параллелизм, не превращая обе строки в дословное повторение.
- source_word: וַתִּשְׁכַּח
  choice: и забыл
  rationale: Прямо передаёт продолжение обвинения во втором лице единственного числа и сохраняет поэтический параллелизм.
- source_word: אֵל
  choice: Бога
  rationale: В данном контексте אֵל обозначает Бога Израиля и стоит в параллели с титулом «Твердыня».
- source_word: מְחֹלְלֶךָ
  choice: родившего тебя
  rationale: Причастная форма от חול вызывает образ родовых мук и появления на свет. «Родившего тебя» ясно и без смягчения сохраняет необычный образ рождения, применённый к Богу.
theological_decisions:
- issue: Отцовский и материнский образы Бога
  choice: Сохранить в основном тексте как порождение («породившей») и рождение («родившего»), не заменяя их общим «создал».
  alternative: 'Передать нейтрально: «создавшей тебя» и «давшего тебе жизнь».'
  rationale: 'Еврейский текст намеренно соединяет два родительских образа: ילד может обозначать зачатие или порождение, а מחוללך вызывает образ родов. Русская грамматика из-за женского рода слова «Твердыня» частично меняет восприятие первого образа, поэтому его возможный отцовский оттенок отмечен в сноске, а напряжение исходного текста сохранено.'
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. «Твердыня» сохраняет традиционно узнаваемый библейский образ, а глаголы «породившей» и «родившего» удерживают намеренное сочетание родительских образов. Синтаксис краток и сохраняет двучленный параллелизм стиха.
