source:
  edition: WLC
  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: ru
  text: 'Если бы Я не опасался дерзости врага[a], как бы противники не истолковали всё превратно[b], как бы не сказали: «Наша рука взяла верх[c], и не Яхве совершил всё это».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «гнева врага», «злобы врага» или «вызывающего поведения врага».'
    reason: Еврейское כַּעַס может обозначать гнев, досаду или то, что вызывает раздражение; здесь оттенок определяется хвастливой реакцией врага.
  - marker: b
    text: 'Еврейский глагол труден для истолкования; возможны также переводы: «неверно истолковали», «ошибочно судили» или «не распознали истинной причины».'
    reason: Форма יְנַכְּרוּ допускает несколько близких контекстуальных пониманий, связанных с неверным распознаванием или оценкой.
  - marker: c
    text: 'Буквально: «Наша рука высока».'
    reason: Сноска сохраняет буквальную еврейскую метафору превосходства и победы.
lexical_decisions:
- source_word: לוּלֵי
  choice: Если бы… не
  rationale: Передаёт условно-исключительный оборот и естественно связывает этот стих с предшествующим описанием суда.
- source_word: כַּעַס אוֹיֵב
  choice: дерзости врага
  rationale: В данном контексте כַּעַס обозначает вызывающую, оскорбительную реакцию врага; «дерзость» естественно подводит к последующему хвастливому заявлению, не сводя смысл только к гневу.
- source_word: אָגוּר
  choice: Я не опасался
  rationale: Сохраняет прямой антропопатический язык еврейского текста; контекст показывает, что речь идёт не о бессилии, а о предотвращении ложного вывода врагов.
- source_word: פֶּן
  choice: как бы не
  rationale: Повторённый союз вводит две предупредительные оговорки; русское «как бы не» сохраняет их целевую и опасительную силу.
- source_word: יְנַכְּרוּ
  choice: не истолковали всё превратно
  rationale: Трудная форма נכר в контексте, вероятнее всего, означает ошибочно распознать или неверно объяснить причину поражения Израиля. Добавленное «всё» естественно указывает на описываемое событие.
- source_word: צָרֵימוֹ
  choice: их противники
  rationale: Сохраняет множественное обозначение врагов Израиля и не отождествляет грамматические формы более жёстко, чем это делает исходный текст.
- source_word: יָדֵינוּ רָמָה
  choice: Наша рука взяла верх
  rationale: Передаёт метафору силы и победы естественным современным русским оборотом; буквальный образ отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: פָּעַל כָּל זֹאת
  choice: совершил всё это
  rationale: Точно передаёт действие, которое противники ошибочно отрицают, и звучит достойно и естественно по-русски.
theological_decisions:
- issue: Передача Божьих слов «Я опасался»
  choice: Сохранить глагол опасения
  alternative: «Я удержался из-за…» или «Я принял во внимание…»
  rationale: Исходный текст прямо приписывает Яхве опасение. Смягчающий пересказ устранил бы антропопатическое напряжение; ближайший контекст сам показывает, что причина — возможное превратное толкование врагов, а не недостаток Божьей силы.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя в исходном тексте сохраняется как имя, без подмены традиционным титулом.
- issue: Причина сдерживания суда
  choice: Сохранить опасение, что враги припишут победу себе
  alternative: Обобщить как заботу о Божьей славе
  rationale: Текст конкретно говорит о превратном выводе противников. Более богословски обобщённая формулировка была бы верной интерпретацией контекста, но не непосредственным переводом стиха.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Повтор «как бы не» воспроизводит параллелизм двух פֶּן. Реплика противников передана живо и прямо; архаизмы и конфессионально маркированные замены имени Бога избегаются.
