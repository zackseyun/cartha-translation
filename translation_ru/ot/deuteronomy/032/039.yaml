  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: ru
  text: Смотрите же теперь, что именно Я — Он, и нет бога, кроме Меня.[a] Я умерщвляю и оживляю, Я поразил[b] — и Я исцелю; и никто не избавит от Моей руки.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет бога со Мною». В этом контексте выражение означает, что нет иного божества наряду с говорящим.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я сокрушил»; еврейский глагол может обозначать также тяжёлое поражение или сокрушение.'
    reason: lexical_alternative
  - marker: c
    text: «От Моей руки» — то есть от Моей власти; это образ невозможности избежать Божьего могущества.
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: Увидьте же теперь
  rationale: Множественное повелительное רְאוּ передаёт прямой призыв признать открываемую истину; עַתָּה — «теперь». Частица «же» естественно связывает призыв с контекстом и сохраняет торжественный поэтический тон.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: Я, именно Я, — Он
  rationale: Повтор אֲנִי אֲנִי имеет усилительное значение. «Именно Я» естественно передаёт это ударение по-русски, а «Он» сохраняет формально неоднозначную формулу הוּא без истолковывающего расширения.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: и нет бога рядом со Мной
  rationale: עִמָּדִי буквально означает «со Мной», но в контексте исключительности указывает, что никакое божество не стоит рядом с говорящим. Строчная буква в «бога» показывает, что речь идёт не об имени или титуле Бога Израиля, а об отрицании всякого иного божества.
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: Я умерщвляю и оживляю
  rationale: Глагольная пара непосредственно и симметрично выражает противоположные действия. «Умерщвляю» передаёт каузативную форму מות и соответствует возвышенному регистру; «оживляю» естественно передаёт וַאֲחַיֶּה.
- source_word: מָחַצְתִּי וַאֲנִי אֶרְפָּא
  choice: Я поразил — и Я исцелю
  rationale: מחץ может означать сильный удар, сокрушение или нанесение раны. «Поразил» сохраняет интенсивность, не сужая образ до конкретного вида ранения; перфект и имперфект переданы как совершённое действие и последующее исцеление.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: и никто не избавит из Моей руки
  rationale: Формулировка сохраняет еврейский образ руки как власти и силы. Причастие מַצִּיל естественно передано личной глагольной конструкцией «никто не избавит».
theological_decisions:
- issue: Исключительность Бога по отношению к другим богам
  choice: «нет бога рядом со Мной»
  alternative: «нет Бога со Мной»
  rationale: 'Перевод сохраняет сильное утверждение исключительности: рядом с говорящим нет иного божества. При этом «рядом» остаётся близким к значению предлога עִם и не вводит позднейшую философскую терминологию.'
- issue: Богословский смысл формулы אֲנִי אֲנִי הוּא
  choice: «Я, именно Я, — Он» без поясняющего дополнения
  alternative: «Я один — Бог» или «Я — Сущий»
  rationale: Исходная формула богословски весома, но формально лаконична. Перевод сохраняет её повтор и местоименную форму, не превращая её в развёрнутое догматическое утверждение.
- issue: Божественная власть над смертью, жизнью, поражением и исцелением
  choice: Сохранить все действия как прямые утверждения от первого лица
  alternative: Смягчить причинность формулами о допущении смерти или ранения
  rationale: Еврейские каузативные и активные формы прямо приписывают эти действия говорящему. Смягчение изменило бы богословское напряжение текста.
translation_notes:
  register: Современный литературный русский с торжественным, поэтическим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, использованы согласно устойчивой русской библейской традиции. Параллелизм и резкие противопоставления исходного стиха сохранены; тире отмечает переход от поражения к исцелению.
