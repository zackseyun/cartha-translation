base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: ru
  text: Они приносили жертвы бесам[a], не Богу, — богам, которых они не знали, богам новым, недавно появившимся[b], перед которыми не трепетали ваши отцы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не богу». Еврейский текст допускает понимание, отрицающее истинную божественность этих существ, хотя в контексте они противопоставлены истинному Богу Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «новые, недавно пришедшие»; речь может идти о богах, недавно появившихся или введённых в поклонение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «которых не боялись ваши отцы». Редкий еврейский глагол может обозначать страх или трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: приносили жертвы
  rationale: Форма Qal глагола זבח обозначает совершение жертвоприношения; русское выражение естественно и сохраняет культовый смысл.
- source_word: לַשֵּׁדִים
  choice: бесам
  rationale: שֵׁדִים обозначает демонических существ; «бесы» — ясный и традиционно понятный русский эквивалент без затемняющей транслитерации.
- source_word: לֹא אֱלֹהַ
  choice: не Богу
  rationale: В контексте выражение противопоставляет получателей жертв истинному Богу Израиля; прописная буква передаёт этот контраст, тогда как неоднозначность отмечена в сноске.
- source_word: אֱלֹהִים
  choice: богам
  rationale: Множественное אֱלֹהִים здесь относится к объектам ложного поклонения и сохраняет намеренное соседство понятий «бесы» и «боги».
- source_word: לֹא יְדָעוּם
  choice: которых не знали
  rationale: ידע с объектным суффиксом буквально означает «знать их»; прошедшее время естественно в русском повествовании.
- source_word: חֲדָשִׁים
  choice: новым
  rationale: Прилагательное употреблено субстантивированно и согласуется по смыслу с предшествующим «богам», сохраняя краткость еврейского текста.
- source_word: מִקָּרֹב בָּאוּ
  choice: недавно появившимся
  rationale: Оборот выражает недавнее появление или введение этих богов, а не прежде всего пространственную близость.
- source_word: לֹא שְׂעָרוּם
  choice: перед которыми не трепетали
  rationale: Редкий глагол передаёт страх, ужас или трепет. «Не трепетали перед» сохраняет более конкретный образ, не сводя его к нейтральному «не боялись».
- source_word: אֲבֹתֵיכֶם
  choice: ваши отцы
  rationale: Еврейское существительное прямо означает «отцы»; этот вариант сохраняет мужской род и обозначает праотцов Израиля.
theological_decisions:
- issue: Соотношение «бесов» и «богов»
  choice: 'Сохранить оба обозначения последовательно: «бесам, не Богу, богам…»'
  alternative: Сгладить повтор и представить «богам» лишь как пояснение либо перевести «не-богам».
  rationale: Еврейский текст намеренно ставит рядом שֵׁדִים и אֱלֹהִים, одновременно отрицая, что адресаты жертв являются истинным Богом. Сохранение обоих слов передаёт полемическое напряжение без навязывания поздней систематизации.
- issue: Значение לֹא אֱלֹהַ
  choice: «не Богу» с прописной буквы
  alternative: «не богу» или «не божеству»
  rationale: Контекст песни противопоставляет ложных получателей жертв истинному Богу Израиля. При этом грамматически возможное неопределённое понимание не исключается и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксическая последовательность оригинала и намеренное повторение «бесам… богам» сохранены; редкий образ трепета передан без архаичной тяжеловесности.
