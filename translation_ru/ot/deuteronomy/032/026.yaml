  text: אָמַ֖רְתִּי אַפְאֵי/הֶ֑ם אַשְׁבִּ֥יתָה מֵ/אֱנ֖וֹשׁ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: ru
  text: 'Я сказал: «Рассею их[a],

    сотру память о них среди людей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол редок, и его точное значение неясно. Возможные переводы: «развею их», «разгоню их по углам» или «уберу их с глаз».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди смертных». В еврейском тексте употреблено собирательное слово в единственном числе, обозначающее человека или смертных людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Я сказал
  rationale: Форма qal, перфект 1-го лица единственного числа от אמר прямо вводит высказанное намерение Бога. «Я сказал» сохраняет форму исходного текста, не заменяя речь внутренним размышлением или решением.
- source_word: אַפְאֵיהֶם
  choice: Рассею их
  rationale: Редкая и трудная форма, которую связывают с рассеиванием, раздуванием или удалением по углам. «Рассею их» ясно передаёт угрозу полного разобщения, но не закрепляет за неясным словом чрезмерно узкий образ.
- source_word: אַשְׁבִּיתָה
  choice: сотру
  rationale: Hiphil от שבת означает «заставить прекратиться, положить конец». С дополнением «память о них» русское «сотру память» естественно выражает прекращение всякого воспоминания, хотя буквально возможно «положу конец».
- source_word: מֵאֱנוֹשׁ
  choice: среди людей
  rationale: אֱנוֹשׁ — собирательное обозначение человека или смертных людей. В сочетании с исчезновением памяти предлог מִן обозначает человеческую среду, из которой память будет устранена; «среди людей» передаёт это по-русски естественно.
- source_word: זִכְרָם
  choice: память о них
  rationale: זֵכֶר обозначает память или воспоминание. «Память о них» точнее и естественнее по-русски, чем буквальное притяжательное сочетание «их память», которое может означать также их способность помнить.
theological_decisions:
- issue: Божественная речь и угроза суда в поэтическом контексте
  choice: 'Передать высказанное намерение будущим временем внутри прямой речи: «Я сказал: „Рассею… сотру…“»'
  alternative: «Я сказал, что рассеял бы их и уничтожил бы память о них» либо «Я решил рассеять их…»
  rationale: Еврейские формы выражают заявленное намерение, исполнение которого далее ограничивается соображением, названным в следующем стихе. Русское будущее в прямой речи сохраняет решительность угрозы, не предрешая вопрос о её исполнении и не превращая אמר в глагол внутреннего решения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим синтаксисом. Разбивка на две строки сохраняет параллелизм. Выражение «сотру память о них» понятно современному читателю и передаёт полное исчезновение из человеческого воспоминания; неоднозначность редкого глагола отмечена в сноске.
