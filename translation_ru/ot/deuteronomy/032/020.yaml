base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: ru
  text: 'И сказал Он: «Скрою от них Своё лицо и посмотрю, каким будет их конец, потому что они — порочное поколение[a], дети, в которых нет верности[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поколение извращений»; также возможно: «поколение превратностей» или «извращённое поколение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в которых нет надёжности» или «верности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: Скрою от них Моё лицо
  rationale: Сохранён древнееврейский образ сокрытия лица, обозначающий отнятие благоволения и явленного присутствия; формулировка естественна для возвышенной современной русской речи.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: посмотрю, каким будет их конец
  rationale: אַחֲרִית допускает значения «конец», «исход», «последствия». «Каким будет их конец» сохраняет буквальный образ и мрачную торжественность контекста.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: поколение извращённое
  rationale: Существительное во множественном числе выражает нравственную испорченность, превратность и кривизну. Прилагательное «извращённое» передаёт смысл естественнее по-русски, не сводя его к современному узкому сексуальному значению; инверсия поддерживает поэтический регистр.
- source_word: בָּנִים
  choice: дети
  rationale: Слово обозначает народ как Божьих детей и здесь относится ко всему сообществу, поэтому родовое «дети» точнее по референту, чем «сыновья».
- source_word: לֹא אֵמֻן בָּם
  choice: в которых нет верности
  rationale: אֵמֻן означает надёжность, верность, постоянство. «Верность» сохраняет нравственно-заветный аспект обвинения, а конструкция близко отражает древнееврейскую форму.
theological_decisions:
- issue: Антропоморфный заветный образ Божьего лица
  choice: Сохранить «Скрою от них Моё лицо»
  alternative: «Отвернусь от них» / «оставлю их без внимания»
  rationale: Буквальный образ имеет самостоятельную богословскую силу и передаёт отнятие благоволения или присутствия, не объясняя сверх сказанного способ этого действия.
- issue: Значение אֵמֻן
  choice: верность
  alternative: надёжность / преданность
  rationale: В контексте осуждения Божьих детей речь идёт не просто об интеллектуальной вере, а об отсутствии устойчивой нравственной и заветной верности.
- issue: Смысл Божьего «посмотрю»
  choice: Сохранить прямое «посмотрю» без поясняющей перефразировки
  alternative: «увижу, что с ними станет»
  rationale: Текст не требует вывода о недостатке Божьего знания; поэтическое высказывание сохранено без догматического уточнения или сглаживания напряжения.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием Песни Моисея. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской издательской традиции. Маркеры обеих сносок присутствуют в основном тексте.
