  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: ru
  text: Один лишь Яхве вёл его[a], и не было с ним чужого бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «направлял его». Еврейский глагол может означать «вести» или «направлять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: בָּדָד
  choice: один
  rationale: В наречном употреблении указывает, что Яхве действовал без помощи или участия кого-либо ещё; по-русски «один» звучит естественно и кратко.
- source_word: יַנְחֶנּוּ
  choice: вёл его
  rationale: 'Форма породы хифиль от נחה здесь означает «вести, направлять». Единственное число местоимения сохранено: в контексте Израиль/Иаков представлен как единое лицо.'
- source_word: וְאֵין עִמּוֹ
  choice: и не было с ним
  rationale: Экзистенциальное отрицание и предлог совместности естественно передаются русской конструкцией «не было с ним».
- source_word: אֵל נֵכָר
  choice: чужого бога
  rationale: Обозначает божество, чуждое Израилю и его Богу. «Чужой бог» — ясное современное выражение, сохраняющее полемическую направленность текста.
theological_decisions:
- issue: К кому относится местоимение единственного числа в выражениях «вёл его» и «с ним»
  choice: Сохранено мужское единственное число «его / с ним», корпоративно относящееся к Израилю/Иакову.
  alternative: Передать множественным числом «их / с ними», поясняя, что речь идёт о народе.
  rationale: В еврейском тексте стоят суффиксы мужского рода единственного числа, а ближайший контекст олицетворяет Израиль/Иакова как одно лицо. Сохранение формы источника не устраняет эту значимую особенность.
translation_notes:
  register: Современный литературный русский язык с ясным и торжественным звучанием. Порядок частей стиха и корпоративное единственное число сохранены; конструкция «не было с ним» выбрана как естественная для русского языка.
