  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: ru
  text: Мне — отмщение и воздаяние[a], когда пошатнётся их нога[b], ведь близок день их бедствия, и спешит то, что им уготовано[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отплата».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда поскользнётся их нога» или «когда подогнётся их нога».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и спешит предназначенное им»; еврейская фраза предельно сжата.'
    reason: lexical_alternative
  - marker: d
    text: Первая часть стиха цитируется в Римлянам 12:19; ср. также Евреям 10:30.
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: Мне — отмщение и воздаяние
  rationale: Дательная конструкция לִי выражает принадлежность и исключительное право Бога; «отмщение» передаёт судебное воздаяние, а «воздаяние» естественно по-русски передаёт שִׁלֵּם как соразмерную отплату.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: когда пошатнётся их нога
  rationale: Сохраняется собирательное единственное число «нога» и образ утраты опоры; временное значение לְעֵת естественно выражено союзом «когда».
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: ведь близок день их бедствия
  rationale: «Ведь» передаёт пояснительно-причинный оттенок כִּי; אֵיד обозначает гибельное бедствие, не требуя уточнения его конкретного вида.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: и спешит то, что им уготовано
  rationale: 'Сохраняется сжатость и некоторая неопределённость еврейской фразы: речь о приготовленном или предназначенном им, без истолкования как абстрактной «судьбы».'
theological_decisions:
- issue: Характер Божьего отмщения
  choice: «Мне — отмщение»
  alternative: «Я отомщу» / «Мне принадлежит правосудие»
  rationale: Формулировка сохраняет утверждение об исключительном праве Бога на судебное воздаяние, не смягчая его до общего понятия правосудия и не придавая ему оттенка личной мстительности.
- issue: Смысл עֲתִדֹת לָמוֹ
  choice: «то, что им уготовано»
  alternative: «их погибель» / «предназначенное им»
  rationale: Конкретно-неопределённая формулировка сохраняет смысл приготовленного впереди суда, не уточняя его содержание сверх еврейского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством древнееврейской поэзии. Инверсия «Мне — отмщение» сохраняет торжественную краткость и межтекстовую узнаваемость; архаизирующая лексика сведена к уместным библейско-литературным словам «отмщение», «воздаяние» и «уготовано».
