base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: ru
  text: Ибо имя Яхве[a] я провозглашу; воздайте величие нашему Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); в традиционных переводах обычно передаётся как «ГОСПОДЬ». «Яхве» — одна из передач этого имени; также употребляется «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз сохраняет причинно-пояснительную связь с окружающим призывом и уместен в возвышенной поэтической речи.
- source_word: שֵׁם
  choice: имя
  rationale: Прямой эквивалент, сохраняющий конкретное обозначение явленной личности и славы Бога без пояснительного пересказа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶקְרָא
  choice: я провозглашу
  rationale: В контексте песни глагол означает публично возвестить имя; будущее время естественно передаёт еврейскую форму и её контекстуальную направленность.
- source_word: הָבוּ
  choice: воздайте
  rationale: Повелительная форма множественного числа обращена к слушателям; «воздайте» выражает признание принадлежащего Богу величия, не подразумевая, будто люди наделяют Его им.
- source_word: גֹדֶל
  choice: величие
  rationale: Прямо передаёт значение величия, возвышенности и хорошо сочетается с глаголом «воздайте».
- source_word: לֵאלֹהֵינוּ
  choice: Богу нашему
  rationale: Сохраняет направление воздаяния, первое лицо множественного числа и поэтический порядок слов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет это, а примечание сообщает читателю традиционные варианты передачи.
- issue: Смысл призыва הָבוּ גֹדֶל
  choice: воздайте величие
  alternative: признайте величие; придайте величие
  rationale: 'Выбранная формулировка сохраняет образное повеление при естественном для русского языка понимании: слушатели должны признать и возвеличить Бога, а не сделать Его великим.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «Богу нашему» сохраняет ритм и достоинство песни, оставаясь понятной современному читателю.
