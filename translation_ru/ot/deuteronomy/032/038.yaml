translation:
  language: ru
  text: которые ели жир их жертв и пили вино их возлияний? Пусть они встанут и помогут вам; пусть будет для вас укрытием[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте глагол «пусть будет» стоит в единственном числе, хотя предшествующее «пусть они встанут» — во множественном. К кому относится эта форма, не уточняется.
    reason: Сохраняет и объясняет грамматически трудное единственное число оригинала, не навязывая его референт.
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: жир их жертв
  rationale: 'Сохраняет конкретный культовый образ: речь о жире принесённых им жертв.'
- source_word: יֵין נְסִיכָם
  choice: вино их возлияний
  rationale: «Возлияние» — точный и понятный термин для жидкого жертвенного приношения.
- source_word: סִתְרָה
  choice: укрытием
  rationale: Передаёт значение защищённого, скрытого места, не сужая образ до исключительно военного убежища.
theological_decisions:
- issue: К кому относятся местоимения третьего лица
  choice: Сохранена ссылка на чужих богов из предшествующего контекста без добавления слова «боги» в данный стих.
  alternative: «те боги, которые ели…»
  rationale: Еврейский текст использует относительную конструкцию без явного существительного; добавление устранило бы связность и неоднозначность исходной формы.
- issue: Оттенок заключительных форм
  choice: 'Переданы как насмешливо-повелительный вызов: «Пусть они встанут… пусть станут…»'
  alternative: 'Предсказательное: «они встанут и помогут вам»'
  rationale: Контекст и формы יָקוּמוּ, יְהִי выражают иронический призыв обратиться за защитой к тем, кому приносились жертвы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Начальная строчная буква сохраняет синтаксическую связь с вопросом предыдущего стиха; вопросительный знак завершает относительную характеристику, после чего следует иронический вызов.
