base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: ru
  text: Так ли вы воздаёте Яхве, безрассудный и немудрый народ? Не Он ли твой Отец, Который приобрёл тебя[a]? Он создал тебя и утвердил тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Который создал тебя» или «Который выкупил тебя». Еврейский глагол может означать «приобретать», «покупать», «владеть», а в некоторых контекстах — «создавать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: воздаёте
  rationale: Глагол גמל здесь означает отвечать кому-либо поступками, воздавать ему за сделанное; в обличительном риторическом вопросе «воздаёте» передаёт эту ответность и сохраняет возвышенный, но понятный регистр.
- source_word: זֹאת
  choice: так ли
  rationale: Указательное слово относится к образу поведения Израиля; русская конструкция «Так ли вы воздаёте…?» естественно передаёт значение «таким ли образом».
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: народ глупый и немудрый
  rationale: נָבָל обозначает нравственную глупость и низость, а לֹא חָכָם буквально отрицает мудрость. Такая формулировка сохраняет параллелизм и прямое обращение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אָבִיךָ
  choice: твой Отец
  rationale: Сохраняется обращение к Израилю в единственном числе и прямо выраженное в тексте отцовство Бога; прописная буква обозначает божественного референта по русской издательской традиции.
- source_word: קָּנֶךָ
  choice: Который обрёл тебя
  rationale: קנה имеет диапазон значений «приобретать, покупать, владеть», а в ряде контекстов — «создавать». «Обрёл тебя» сохраняет идею принадлежности и отличает этот глагол от следующего עשה, не навязывая исключительно торгового оттенка.
- source_word: עָשְׂךָ
  choice: создал тебя
  rationale: В данном контексте עשה говорит о созидательном действии Бога по отношению к Израилю; «создал» естественнее в современном русском, чем буквальное «сделал».
- source_word: וַיְכֹנְנֶךָ
  choice: утвердил тебя
  rationale: Форма от כון выражает установление, упрочение и приведение в устроенное состояние; «утвердил» сохраняет отличие от предшествующего созидания.
theological_decisions:
- issue: Значение קנה применительно к Богу и Израилю
  choice: Который обрёл тебя
  alternative: Который создал тебя; Который приобрёл тебя; Который выкупил тебя
  rationale: Еврейский глагол многозначен. Контекст допускает созидательный смысл, однако следующие глаголы уже прямо говорят, что Бог создал и утвердил Израиль. Основной текст сохраняет лексическое различие и идею принадлежности, а примечание честно отражает другие возможные прочтения.
- issue: Отцовство Бога
  choice: твой Отец
  alternative: твой отец
  rationale: Текст прямо называет Яхве Отцом Израиля. Прописная буква является русской графической нормой для обозначения Бога и не добавляет к исходному тексту отдельного догматического утверждения.
translation_notes:
  register: Современный литературный русский с достоинством поэтического обличения. Сохранён переход от множественного «вы» к собирательному единственному «тебя», присутствующий в еврейском тексте. «Немудрый» несколько приподнят, но прозрачен и поддерживает поэтический параллелизм.
