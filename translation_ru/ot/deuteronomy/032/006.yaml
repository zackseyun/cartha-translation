  - severity: low
    issue: «народ глупый»
    rationale: «Глупый» возможно, но в современном употреблении чаще описывает интеллектуальную несообразительность. «Безрассудный» естественнее передаёт этически окрашенную, осуждаемую неразумность נָבָל.
  - severity: low
