revisions:
- from: Так ли вы воздаёте Яхве, народ глупый и немудрый? Не Он ли твой Отец, Который обрёл тебя[a]? Он создал тебя и утвердил тебя.
  to: Так ли вы воздаёте Яхве, безрассудный и немудрый народ? Не Он ли твой Отец, Который приобрёл тебя[a]? Он создал тебя и утвердил тебя.
  rationale: Исправлено только небезопасное «обрёл тебя», которое по-русски может означать «нашёл». «Приобрёл тебя» сохраняет различие между קנה, «создал» и «утвердил», а сноска честно фиксирует значимые альтернативы. Небольшая стилистическая замена «глупый» на «безрассудный» точнее отражает нравственный оттенок נָבָל без догматического истолкования.
