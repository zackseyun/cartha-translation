  source_fidelity: 'Основной смысл передан верно: риторический упрёк, обращение к Яхве, характеристика народа и переход от множественного числа к собирательному единственному сохранены. Однако «обрёл тебя» в современном русском обычно значит «нашёл тебя» и потому не передаёт надёжно значение קָנָה («приобрести; обрести во владение», в данном контексте также допускающее «создать»).'
  naturalness: «Обрёл тебя» неестественно и семантически двусмысленно в нежелательном направлении. «Приобрёл тебя» — ясное современное соответствие лексическому основному значению; возможный созидательный смысл следует оставить в примечании. «Безрассудный» лучше передаёт нравственно окрашенную глупость נָבָל, чем более бытовое «глупый».
  terminology: «Яхве», «Отец», «создал» и «утвердил» уместны. Замена «обрёл» на «приобрёл» согласует основной текст с заявленной лексической мотивировкой и устраняет повтор основного варианта в сноске.
