base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: ru
  text: 'И сказал он им: «Примите близко к сердцу все слова, которыми я сегодня торжественно предостерегаю вас[a], чтобы вы заповедали своим сыновьям соблюдать[b] и исполнять все слова этого закона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которыми я сегодня свидетельствую вам»; возможно также: «которыми я сегодня свидетельствую против вас». В контексте завета еврейский глагол может выражать как свидетельство, так и предостережение с судебным оттенком.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сыновьям»; это слово может обозначать следующее поколение шире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Примите близко к сердцу
  rationale: Естественная русская передача еврейской идиомы о сосредоточенном внимании, внутренней решимости и воле; она сохраняет образ сердца.
- source_word: הַדְּבָרִים
  choice: слова
  rationale: В контексте речь идёт о произнесённых словах заветного наставления; повтор «слова» отражает повтор в еврейском тексте.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: которыми я сегодня свидетельствую вам
  rationale: Глагол имеет смысл торжественного свидетельства и может включать предостережение; дательный оборот по-русски естественно передаёт обращённость свидетельства к народу, не усиливая неявный оттенок «против вас».
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: чтобы вы заповедали
  rationale: 'В данном контексте относительная частица с имперфектом естественно выражает цель: народ должен принять слова к сердцу, чтобы передать их следующему поколению как обязательное наставление.'
- source_word: בְּנֵיכֶם
  choice: своим сыновьям
  rationale: Сохраняется явно мужская форма еврейского существительного; возможный более широкий смысл следующего поколения отмечен в сноске.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: хранить и исполнять
  rationale: Два инфинитива передают как бережное и внимательное соблюдение, так и практическое исполнение закона.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: слова этого закона
  rationale: «Закон» ясно передаёт תּוֹרָה в заветном контексте Второзакония, а буквальное «слова этого закона» сохраняет структуру и повтор оригинала.
theological_decisions:
- issue: Свидетельский и предостерегающий оттенки מֵעִיד בָּכֶם
  choice: свидетельствую вам
  alternative: предостерегаю вас сегодня; призываю во свидетельство против вас сегодня
  rationale: Основной текст сохраняет торжественный смысл свидетельства, а сноска удерживает возможную предупредительную и судебно-заветную силу выражения, не выбирая её однозначно.
- issue: Гендерная форма בְּנֵיכֶם
  choice: своим сыновьям
  alternative: своим детям
  rationale: Основной текст соответствует мужскому множественному числу оригинала; возможное представительное обозначение следующего поколения поясняется отдельно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Примите близко к сердцу» звучит естественно и сохраняет сердечную образность оригинала; «заповедали», «хранить и исполнять» поддерживают торжественный заветный регистр без архаической перегруженности.
