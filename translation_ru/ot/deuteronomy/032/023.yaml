  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: ru
  text: Я обрушу на них бедствие за бедствием[a], истрачу на них все Мои стрелы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедствия»; буквально: «зло» — здесь в смысле пагубных бедствий, а не нравственного зла.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «израсходую на них Мои стрелы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: обрушу
  rationale: В данном поэтическом контексте форма от אסף передаёт накопление множества бедствий, направленных на народ. «Обрушу» естественно выражает их нарастающее и сокрушительное действие, хотя буквальный образ собирания передаётся менее явно.
- source_word: עָלֵימוֹ
  choice: на них
  rationale: Предлог עַל с местоименным суффиксом обозначает направленность бедствий на людей; «на них» кратко и естественно сохраняет поэтическую конструкцию.
- source_word: רָעוֹת
  choice: бедствия
  rationale: Во множественном числе и в контексте суда слово обозначает пагубные события, несчастья или кары, а не нравственное зло.
- source_word: חִצַּי
  choice: Мои стрелы
  rationale: Сохранён буквальный воинский образ и суффикс первого лица.
- source_word: אֲכַלֶּה
  choice: истрачу ... все
  rationale: Piel от כלה здесь означает полностью израсходовать. Русская конструкция «истрачу все Мои стрелы» ясно передаёт полноту действия и естественно сочетается с образом боеприпасов.
- source_word: בָּם
  choice: на них
  rationale: Предлог בְּ здесь указывает на цель, против которой расходуются стрелы; по-русски в этой конструкции естественно «на них».
theological_decisions:
- issue: Значение רָעוֹת в контексте Божьего суда
  choice: бедствия
  alternative: зло; несчастья; кары
  rationale: «Бедствия» сохраняет суровость объявленного суда, но не создаёт ненужного впечатления, будто речь идёт о нравственном зле, совершаемом Богом.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической энергией Песни Моисея. Воинская метафора стрел сохранена; прописная буква в «Мои» указывает на говорящего Бога согласно принятой русской библейской издательской традиции.
