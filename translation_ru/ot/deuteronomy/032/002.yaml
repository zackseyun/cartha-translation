  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: ru
  text: Пусть моё наставление падает, как дождь[a], пусть моя речь струится, как роса, как мелкий дождь на траву[b], как обильный дождь на растения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каплет» / «нисходит каплями». Еврейский глагол изображает наставление, нисходящее подобно дождю.'
    reason: lexical_alternative
  - marker: b
    text: «Мелкий дождь» передаёт редкое еврейское слово, которое может обозначать лёгкий дождь или дождевые капли.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: льётся
  rationale: Глагол изображает нисхождение капель, особенно дождя. «Льётся» естественно по-русски передаёт образ дождя, не придавая строке технического или архаического оттенка.
- source_word: לִקְחִי
  choice: моё наставление
  rationale: לֶקַח обозначает преподаваемое наставление или учение. «Наставление» ясно указывает на содержание речи Моисея и не сводит слово к процессу обучения.
- source_word: תִּזַּל
  choice: струится
  rationale: נזל означает течь или сочиться. «Струится» сохраняет мягкое движение влаги и поэтический параллелизм с дождём и росой.
- source_word: אִמְרָתִי
  choice: моя речь
  rationale: אִמְרָה может обозначать слово, изречение или речь. В параллели с «наставлением» здесь имеется в виду произносимая речь в целом.
- source_word: שְׂעִירִם
  choice: мелкий дождь
  rationale: Редкое слово в данном контексте, вероятно, обозначает лёгкий дождь или дождевые капли. «Мелкий дождь» передаёт этот вероятный смысл, не скрывая его неопределённости, которая отмечена в сноске.
- source_word: דֶשֶׁא
  choice: молодая трава
  rationale: Слово обозначает свежую, только появившуюся растительность; «молодая трава» естественно передаёт этот оттенок.
- source_word: רְבִיבִים
  choice: обильные ливни
  rationale: רְבִיבִים обозначает обильные дождевые потоки или сильные дожди. Сочетание передаёт интенсивность и противопоставляет их более лёгкому дождю предыдущей строки.
- source_word: עֵשֶׂב
  choice: зелень
  rationale: Слово шире, чем «трава», и обозначает травянистую растительность. «Зелень» звучит естественно, сохраняет собирательность и отличает её от דֶשֶׁא.
