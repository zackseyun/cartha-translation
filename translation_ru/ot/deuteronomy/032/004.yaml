base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: ru
  text: 'Он — Скала: дело Его совершенно, ибо все пути Его справедливы[a]. Он — верный Бог, и нет в Нём неправды; праведен и прям Он.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все пути Его — правосудие». Еврейское מִשְׁפָּט может означать «справедливость», «судебное решение», «правосудие» или то, что по праву верно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: Скала
  rationale: Существительное צוּר здесь служит метафорическим титулом Бога в Песни Моисея. «Скала» сохраняет образ твёрдости и надёжности; прописная буква передаёт титульную функцию.
- source_word: תָּמִים
  choice: совершенно
  rationale: При кратком среднем подлежащем «дело» естественно употребить предикативное наречие. Оно передаёт полноту, безупречность и цельность Божьего действия.
- source_word: פָּעֳלוֹ
  choice: Его дело
  rationale: Единственное число с местоименным суффиксом обозначает Божье действие или совокупный труд; «дело» сохраняет именную и поэтическую форму.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание предыдущего утверждения; «ведь» естественно связывает строки в современной русской поэтической речи.
- source_word: כָל־דְּרָכָיו
  choice: все пути Его
  rationale: Сохранена древнееврейская метафора путей как образа поступков и образа действия Бога.
- source_word: מִשְׁפָּט
  choice: справедливы
  rationale: Хотя в еврейском стоит существительное «правосудие / справедливость / суд», русская предикативная форма ясно передаёт, что каждый Божий путь соответствует справедливости.
- source_word: אֵל אֱמוּנָה
  choice: Бог верный
  rationale: אֱמוּנָה здесь характеризует надёжность и неизменную верность Бога. Прилагательное «верный» естественно передаёт смысл конструкции в русском языке.
- source_word: וְאֵין עָוֶל
  choice: и нет в Нём неправды
  rationale: Фраза отрицает в Боге всякую моральную кривизну и несправедливость. Добавление «в Нём» эксплицирует подразумеваемое отношение, не меняя смысла.
- source_word: צַדִּיק
  choice: праведен
  rationale: Передаёт нравственную правоту и справедливость Бога традиционным, понятным русским библейским словом.
- source_word: וְיָשָׁר
  choice: прям
  rationale: Сохраняет образ нравственной прямоты, отличая יָשָׁר от предшествующего צַדִּיק и не сливая два качества в одно.
- source_word: הוּא
  choice: Он
  rationale: Финальная постановка местоимения сохраняет подчёркнутый порядок слов и поэтическое завершение еврейской строки.
theological_decisions:
- issue: Метафорический титул הַצּוּר
  choice: «Скала» с прописной буквы
  alternative: «скала» со строчной буквы; «Твердыня»
  rationale: Прописная буква показывает, что метафора относится к Богу как титул. «Скала» ближе к конкретному образу צוּר, тогда как «Твердыня» сильнее истолковывает его как защитное укрепление.
- issue: Значение אֱמוּנָה как Божьего свойства
  choice: «верный»
  alternative: «Бог верности»; «Бог истины»; «надёжный Бог»
  rationale: Контекст противопоставляет Божью надёжность неправде и утверждает Его неизменную нравственную верность. «Верный» сохраняет это богословское содержание, не сужая слово до отвлечённой истинности.
- issue: Соотношение מִשְׁפָּט и צַדִּיק
  choice: Развести как «справедливы» и «праведен»
  alternative: Передать оба корня словами от «праведный» или «справедливый»
  rationale: 'Различная русская лексика сохраняет два взаимосвязанных, но не тождественных утверждения: Божьи пути соответствуют справедливости, а Сам Он праведен.'
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим строем. Инверсия «пути Его» и финальное «Он» сохраняют ритм и акцент исходной песни, оставаясь понятными. Различены «праведен» и «прям», чтобы не устранять параллельные оттенки еврейского текста.
