  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: ru
  text: 'И он скажет: «Где их боги — скала, в которой они искали убежища?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «скала, в ней они искали убежища»; в еврейском тексте местоименный суффикс при слове «скала» имеет мужской род. Слово «скала» стоит в единственном числе как приложение к выражению «их боги».'
    reason: лексическая и синтаксическая альтернатива
lexical_decisions:
- source_word: וְאָמַר
  choice: И он скажет
  rationale: 'Союз וְ передан как «и», а форма אָמַר в контексте поэтической речи понимается в будущем значении: Господь скажет это, обличая бессилие ложных богов.'
- source_word: אֵי
  choice: Где
  rationale: Вопросительная частица означает «где?». В русском языке отдельная форма согласования по числу здесь не требуется.
- source_word: אֱלֹהֵימוֹ
  choice: их боги
  rationale: Форма אֱלֹהִים с суффиксом 3-го лица множественного числа в данном контексте обозначает богов, на которых они полагались; множественное число сохраняет полемическую силу строки.
- source_word: צוּר
  choice: скала
  rationale: Буквальное значение — «скала». Здесь слово стоит как приложение к «их боги» и иронически описывает мнимую защиту, которую они искали у этих богов. Строчная буква не позволяет ошибочно принять слово за титул Господа.
- source_word: חָסָיוּ
  choice: они искали убежища
  rationale: Глагол חסה означает искать прибежища или защиты. Этот вариант сохраняет конкретный образ укрытия и звучит естественно по-русски.
- source_word: בּוֹ
  choice: в которой
  rationale: Предлог с суффиксом 3-го лица мужского рода единственного числа относится к единственному числу צוּר. Русское относительное сочетание «в которой» естественно согласуется со словом «скала».
theological_decisions:
- issue: Кто говорит и каково временное значение глагола
  choice: 'Реплика представлена как будущие слова Господа: «И он скажет»'
  alternative: «И он сказал»; «Тогда скажут»
  rationale: В контексте Второзакония 32:36–38 наиболее естественно видеть продолжение описания того, что Господь скажет, когда обнаружится бессилие ложных богов. При этом имя говорящего не добавлено в сам стих, поскольку его нет в еврейской строке.
- issue: Образ скалы
  choice: «скала» со строчной буквы
  alternative: «Скала» как божественный титул
  rationale: Здесь צוּר поясняет выражение «их боги», а не обозначает Господа. Строчная буква сохраняет контраст с употреблением образа Скалы применительно к Господу в других местах песни.
- issue: Несогласованность множественного «боги» и единственного «скала»
  choice: 'Сохранено приложение в единственном числе: «их боги — скала»'
  alternative: 'Согласовать по числу: «скалы»'
  rationale: Еврейский текст намеренно ставит единственное צוּר рядом с формой множественного смысла «их боги». Перевод сохраняет эту поэтическую напряжённость, не устраняя её толкованием.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконизма и поэтической резкости оригинала. Местоимение «он» написано со строчной буквы, поскольку еврейский текст не называет говорящего в этой строке и русская капитализация местоимений является редакционной, а не исходной особенностью.
