base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: ru
  text: Внимайте[a], небеса, и я буду говорить; и да слышит земля слова моих уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слушайте внимательно, небеса… и пусть земля слышит». В еврейском тексте употреблены возвышенные поэтические формы повеления и призыва; выражение «да слышит» можно также понять как «услышит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Внимайте
  rationale: Побудительная форма породы хифиль от אזן призывает не просто услышать, а слушать внимательно. «Внимайте» передаёт возвышенный поэтический призыв и остаётся понятным в современном литературном русском языке.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: В поэтическом обращении множественное «небеса» естественно передаёт שָׁמַיִם и сохраняет торжественную пару «небеса — земля».
- source_word: וַאֲדַבֵּרָה
  choice: и я буду говорить
  rationale: Когортатив выражает намерение или решимость говорящего. Будущее время естественно передаёт это значение, не сводя форму к цели.
- source_word: וְתִשְׁמַע
  choice: и да слышит
  rationale: Имперфект, допускающий юссивное значение, в параллели с повелительным обращением выражает пожелание-призыв. Конструкция «да слышит» сохраняет волитивность и возвышенный строй.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В космической паре с небесами речь идёт о земле, а не об отдельной стране или территории.
- source_word: אִמְרֵי
  choice: слова
  rationale: «Слова» естественно и достаточно весомо передаёт поэтическое обозначение произносимых речений.
- source_word: פִי
  choice: моих уст
  rationale: Сохранён конкретный еврейский образ «слова моих уст»; «уста» поддерживают достоинство поэтической речи без затемнения смысла.
theological_decisions:
- issue: Охват обращения к небесам и земле
  choice: Поэтический призыв к космосу как свидетелю
  alternative: Чисто риторическое обращение ко всем слушателям
  rationale: Пара «небеса — земля» образует торжественную формулу, известную по заветным и пророческим контекстам. Перевод сохраняет свидетельскую торжественность, но не добавляет в основной текст прямого толкования.
- issue: Модальность וְתִשְׁמַע
  choice: 'Пожелание-призыв: «да слышит»'
  alternative: 'Сообщение о будущем: «земля услышит»'
  rationale: Параллелизм с повелительным הַאֲזִינוּ поддерживает волитивное прочтение, однако сама форма допускает оттенок будущего; примечание сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. «Внимайте» и «уста» употреблены как понятные возвышенные формы; синтаксический параллелизм оригинала сохранён.
