base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: ru
  text: Как орёл, который будоражит своё гнездо[a] и парит над птенцами[b], расправляет крылья, берёт его и несёт его на своих маховых перьях[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как гриф». Древнееврейское נֶשֶׁר может обозначать крупную хищную птицу, в том числе орла или грифа. Слово, переведённое «будоражит», также можно передать: «пробуждает» или «побуждает».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «трепещет над птенцами» или «носится над птенцами».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на своих крыльях». Древнееврейское слово обозначает оперённую часть крыла, в отличие от общего слова «крылья» выше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: как орёл
  rationale: נֶשֶׁר обозначает крупную хищную птицу; традиционное «орёл» естественно передаёт образ силы и защиты, тогда как зоологически возможное «гриф» сохранено в сноске.
- source_word: יָעִיר קִנּוֹ
  choice: тревожит своё гнездо
  rationale: Каузативная форма עור значит «пробуждать, побуждать, приводить в движение»; «тревожит» кратко и образно передаёт птицу, побуждающую птенцов покинуть покой гнезда.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: парит над птенцами
  rationale: רחף описывает трепетание или зависание в воздухе; «парит» здесь звучит естественно и сохраняет защитный образ. גּוֹזָלִים конкретизировано как «птенцы».
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: Он расправляет крылья
  rationale: פרשׂ означает «распростирать, расправлять». Прописная форма «Он» передаёт поэтический переход от сравнения с птицей к подразумеваемому Господу в контексте песни.
- source_word: יִקָּחֵהוּ
  choice: подхватывает птенца
  rationale: לקח обычно значит «брать». Слово «птенца» делает понятным мужской единственный объектный суффикс и сохраняет индивидуализацию одного из птенцов, не подменяя образ прямым упоминанием Израиля.
- source_word: יִשָּׂאֵהוּ
  choice: несёт его
  rationale: נשא в данном образе обозначает физическое несение; местоимение сохраняет единственное число исходного текста.
- source_word: עַל אֶבְרָתוֹ
  choice: на своих маховых перьях
  rationale: אֶבְרָה относится к оперённой части крыла, в частности к маховым перьям. Такой перевод сохраняет отличие от более общего כָּנָף «крыло» и при этом понятнее современному читателю, чем редкое «маховые крылья» или книжное «перья крыла».
theological_decisions:
- issue: Переход от образа орла к подразумеваемому Господу
  choice: Во второй половине стиха использовать «Он» с прописной буквы
  alternative: 'Сохранять образ птицы на протяжении всего стиха: «он расправляет… подхватывает… несёт»'
  rationale: В древнееврейском все глаголы имеют форму мужского рода единственного числа, которая грамматически согласуется и с נֶשֶׁר, и с подразумеваемым Господом. Контекст стихов 10–12 применяет образ к Господу; прописное «Он» слегка обозначает этот переход, не добавляя имени в текст.
- issue: Единственное число объекта в יִקָּחֵהוּ и יִשָּׂאֵהוּ
  choice: Передать как отдельного «птенца» и затем «его»
  alternative: 'Передать собирательно как Израиль: «подхватывает его и несёт его»'
  rationale: Исходный текст после множественного «птенцами» неожиданно использует объект мужского рода единственного числа. Перевод сохраняет это напряжение и не отождествляет объект с Израилем прямо внутри самого сравнения.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтичности Песни Моисея. Синтаксис сделан плавным и доступным; редкая орнитологическая деталь передана понятным выражением «маховые перья». Подлинная неоднозначность названия птицы, значения יָעִיר и перехода от птицы к Господу не устранена, а отмечена переводом и сносками.
