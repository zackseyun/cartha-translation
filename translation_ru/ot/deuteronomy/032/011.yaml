revisions:
- from: Как орёл, который тревожит своё гнездо[a], парит над птенцами, Он расправляет крылья, подхватывает птенца и несёт его на своих маховых перьях[b].
  to: Как орёл, который будоражит своё гнездо[a] и парит над птенцами[b], расправляет крылья, берёт его и несёт его на своих маховых перьях[c].
  rationale: Правка устраняет необоснованное графическое отождествление орла с Господом, исправляет неточный вариант в сноске и сохраняет неожиданное единственное число объектного суффикса как «его». Добавлена сноска к глаголу רחף, чтобы отразить его допускаемые оттенки («трепетать/носиться/парить»). Сравнительный образ и его возможное контекстуальное применение к Господу не отрицаются, но не подменяют синтаксис самого стиха.
