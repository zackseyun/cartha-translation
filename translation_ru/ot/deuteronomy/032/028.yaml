  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: ru
  text: Ибо они — народ, не способный к разумным решениям, и нет у них разумения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующей мысли; «ибо» сохраняет причинно-пояснительную связь и соответствует достоинству поэтической речи.
- source_word: גּוֹי
  choice: народ
  rationale: Собирательное существительное обозначает человеческую общность; в данном поэтическом контексте русское «народ» естественнее, чем политически окрашенное «нация».
- source_word: אֹבַד עֵצוֹת
  choice: лишённый благоразумных советов
  rationale: Буквальное сочетание «погибший/утративший советы» идиоматически указывает на отсутствие здравого руководства или способности вырабатывать разумные решения. Добавление «благоразумных» передаёт смысл мудрого совета, не сводя выражение только к чужим наставлениям.
- source_word: הֵמָּה
  choice: они —
  rationale: Самостоятельное местоимение имеет подчёркивающую функцию; в русском это естественно передаётся явным подлежащим и именным сказуемым с тире.
- source_word: וְאֵין
  choice: и нет
  rationale: Сохраняет сочинительную связь и стандартную конструкцию отрицания наличия.
- source_word: בָּהֶם
  choice: у них
  rationale: Русская конструкция обладания «нет у них» естественно выражает отсутствие внутренне присущего народу качества; буквальное «в них» здесь звучало бы менее естественно.
- source_word: תְּבוּנָה
  choice: разумение
  rationale: Передаёт способность понимать и различать, сохраняя возвышенный регистр библейской поэзии и связь с лексикой мудрости.
