    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: яд
  rationale: В сочетании с обозначением змей слово означает яд, а не «ярость» или «жар»; это естественный современный русский эквивалент.
- source_word: תַּנִּינִם
  choice: змеиный
  rationale: Слово может обозначать крупных пресмыкающихся или чудовищ, однако параллелизм с ядовитыми змеями и упоминание яда здесь указывают на змеиный образ.
- source_word: יֵינָם
  choice: их вино
  rationale: Прямая передача формы с притяжательным суффиксом; метафора отождествляет их вино со смертельным ядом.
- source_word: וְרֹאשׁ
  choice: и отрава
  rationale: В данном контексте слово обозначает ядовитое вещество, а не буквальную «голову». «Отрава» сохраняет поэтический регистр и позволяет избежать близкого повтора слова «яд».
- source_word: פְּתָנִים
  choice: аспидов
  rationale: Точное биологическое отождествление древнееврейского названия ядовитой змеи неясно. Традиционное русское «аспид» сохраняет библейскую образность, а примечание обозначает возможные современные соответствия.
- source_word: אַכְזָר
  choice: жестокая
  rationale: Буквальный образ олицетворяет отраву как безжалостную и смертоносную; «жестокая» передаёт эту поэтическую характеристику.
