base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: ru
  text: Ведь их скала не такова, как наша Скала, и наши враги — судьи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и наши враги — судьи [или арбитры]». Еврейское פְּלִילִים имеет судебный оттенок; фраза может означать, что даже враги выносят суждение в пользу этого сравнения.'
    reason: Передаёт буквальное значение פְּלִילִים и поясняет возможный контекстуальный смысл, не выдавая редакторскую капитализацию за вариант еврейского текста.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предшествующим утверждением и вводит его обоснование; в русском поэтическом рассуждении звучит естественно.
- source_word: כְצוּרֵנוּ צוּרָם
  choice: их скала не такова, как наша Скала
  rationale: Сохранены метафора и намеренный повтор צוּר. Прописная буква в «Скала» указывает на Бога Израиля, а строчная в «их скала» — на предмет упования врагов, не устраняя словесного контраста.
- source_word: וְאֹיְבֵינוּ
  choice: и наши враги
  rationale: Союз ו передан прямо, без добавления «даже» или сравнительного оборота, которых в еврейском тексте нет.
- source_word: פְּלִילִים
  choice: тому судьи
  rationale: Сохранено именное значение множественного числа «судьи, арбитры». Указательное «тому» делает русскую конструкцию понятной и передаёт подразумеваемый предмет их суждения.
theological_decisions:
- issue: Передача метафоры צוּר применительно к Богу Израиля
  choice: Сохранить «Скала» как метафорическое наименование
  alternative: защитник; прибежище; сила
  rationale: Один и тот же еврейский термин намеренно относится к Богу Израиля и к предмету упования других народов; замена пояснительным титулом разрушила бы этот контраст.
- issue: Смысл заключительной фразы וְאֹיְבֵינוּ פְּלִילִים
  choice: «и наши враги тому судьи»
  alternative: «как признают даже наши враги»; «и наши враги рассудят»
  rationale: Выбранный вариант удерживает буквальный судебный образ и именную форму, не превращая высказывание прямо в признание или свидетельство, хотя такой смысл возможен в контексте.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Синтаксис остаётся ясным для обычного читателя; метафора и судебная образность оригинала сохранены.
