    text: 'Или: «Иаков — мерная верёвка Его наследия»; также возможно: «Иаков — отмеренный удел Его наследия». Еврейское חֶבֶל может буквально означать мерную верёвку, а переносно — отмеренную долю или выпавший удел.'
