lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующим словам песни; «ибо» сохраняет эту связь и соответствует возвышенному поэтическому регистру.
- source_word: חֵלֶק
  choice: удел
  rationale: Слово обозначает выделенную кому-либо часть или долю. «Удел» естественно передаёт образ распределения и сочетается с темой наследия.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: עַמּוֹ
  choice: Его народ
  rationale: В данном контексте עַם обозначает народ, принадлежащий Яхве и состоящий с Ним в отношениях завета.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Сохранено прямо названное в тексте имя патриарха, которым поэтически обозначен народ Израиля.
- source_word: חֶבֶל
  choice: доля
  rationale: Здесь слово, буквально способное обозначать мерную верёвку, по расширенному значению указывает на отмеренную или выпавшую долю. «Доля» звучит естественно и сохраняет параллелизм с «уделом».
- source_word: נַחֲלָתוֹ
  choice: Его наследия
  rationale: נַחֲלָה означает наследие, наследственный удел или владение; «наследие» сохраняет образ принадлежности и распределения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное заветное имя; его транслитерация отличает имя от титула и не добавляет конфессионального толкования.
- issue: Следует ли пояснять имя «Иаков» как «Израиль»
  choice: Иаков
  alternative: Израиль
  rationale: Сохранение исходного имени поддерживает поэтический параллелизм и не подменяет образ его истолкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем древнееврейской поэзии. Именные конструкции с тире сохраняют параллелизм двух полустиший; местоимение «Его» написано с прописной буквы как устоявшаяся русская форма почтительного указания на Бога.
