  text: Когда Моисей закончил говорить все эти слова всему Израилю,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: закончил
  rationale: Форма wayyiqtol от כלה обозначает завершение действия; «закончил» естественно передаёт этот смысл по-русски.
- source_word: לְדַבֵּר
  choice: говорить
  rationale: Инфинитив с כלה образует конструкцию «закончил говорить», идиоматичную и близкую к структуре еврейского текста.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דברים здесь относится к предшествующим словам Моисея; буквальное «слова» сохраняет формальную связь с исходным текстом без расширения до «всего сказанного».
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: всему Израилю
  rationale: Сохранено собирательное заветное наименование «Израиль»; русский дательный падеж естественно выражает адресата речи.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Использована устоявшаяся русская форма библейского имени.
