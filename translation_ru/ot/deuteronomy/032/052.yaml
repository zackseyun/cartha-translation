base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: ru
  text: Ведь ты увидишь землю издали[a], но не войдёшь туда — в землю, которую Я даю сынам Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с противоположной стороны»; еврейское выражение означает, что Моисей увидит землю, оставаясь вне её.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит объяснение предыдущего высказывания; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: מִנֶּגֶד
  choice: издали
  rationale: Выражение указывает на наблюдение с противоположной стороны или на расстоянии; «издали» кратко и естественно передаёт смысл без входа в землю.
- source_word: תִּרְאֶה
  choice: ты увидишь
  rationale: Имперфект 2-го лица мужского рода единственного числа здесь имеет предсказательное, будущее значение.
- source_word: הָאָרֶץ
  choice: эту землю
  rationale: В контексте речь идёт о конкретной обещанной земле; указательное «эту» по-русски естественно выражает контекстуальную определённость еврейского артикля.
- source_word: וְשָׁמָּה לֹא תָבֹא
  choice: но не войдёшь туда
  rationale: בוא с направительным контекстом означает войти или прийти; «не войдёшь туда» ясно передаёт запрет пересечь границу земли.
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: Предлог אֶל обозначает движение к цели и здесь, в сочетании с בוא, естественно передаётся как движение внутрь.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: которую Я даю
  rationale: Причастие נֹתֵן представляет дарование как совершающееся или непосредственно предстоящее действие; настоящее время сохраняет этот аспект.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Формально сохраняет мужской множественный בְנֵי и традиционное заветное наименование народа, не сводя его к более общему «народу Израиля».
theological_decisions:
- issue: Гендерно маркированное заветное обозначение בְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: детям Израиля; народу Израиля; израильтянам
  rationale: Еврейское выражение грамматически имеет мужской род множественного числа и служит устойчивым обозначением всего народа. Формулировка сохраняет форму источника, не отрицая коллективного охвата выражения.
- issue: Характер Божьего дарования земли в אֲנִי נֹתֵן
  choice: Я даю
  alternative: Я дам
  rationale: Настоящее время сохраняет причастную форму источника и представляет обещанное дарование как уже осуществляемое Божье действие, не заменяя её простым будущим.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаической интонацией. Тире после «туда» естественно присоединяет уточнение «в землю» и сохраняет структуру исходного высказывания.
