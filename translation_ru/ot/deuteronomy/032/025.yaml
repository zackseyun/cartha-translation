lexical_decisions:
- source_word: מִחוּץ
  choice: снаружи
  rationale: Кратко и точно передаёт пространственное противопоставление внешнего пространства внутренним покоям, не сужая значение до улицы.
- source_word: תְּשַׁכֶּל
  choice: будет лишать детей
  rationale: Порода пиэль глагола שׁכל означает делать бездетным, лишать детей. Формулировка сохраняет олицетворение меча и каузативный оттенок.
- source_word: חֶרֶב
  choice: меч
  rationale: Сохраняет конкретный поэтический образ войны как действующей и губительной силы.
- source_word: וּמֵחֲדָרִים
  choice: а во внутренних покоях
  rationale: Предлог מִן буквально означает «из», однако здесь выражение образует пространственный контраст с «снаружи» и указывает на опасность внутри жилища. «Внутренние покои» сохраняют образ חדרים.
- source_word: אֵימָה
  choice: ужас
  rationale: Передаёт сильный, подавляющий страх и поддерживает лаконизм еврейской поэзии.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: и юношу, и девушку
  rationale: Парная конструкция גם...גם передана повтором «и... и». «Девушка» естественно звучит по-русски, а возможный оттенок девственности בְּתוּלָה отмечен в сноске.
- source_word: יוֹנֵק
  choice: грудного младенца
  rationale: Передаёт причастное значение «сосущий грудь» современным и ясным русским выражением.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: вместе с седовласым старцем
  rationale: Сохраняет конкретный образ седины и обозначение пожилого мужчины; «старец» придаёт строке достоинство, не являясь специальным церковным титулом в данном контексте.
