base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: ru
  text: Ликуйте[a], народы, вместе с Его народом[b], потому что Он отомстит за кровь Своих слуг и обратит возмездие на Своих врагов. Он совершит искупление за Свою землю и Свой народ[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пойте от радости» либо «восклицайте от радости». Еврейский глагол может обозначать радостный крик или пение.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза очень сжата и буквально читается: «Ликуйте, народы, Его народ». Возможно также понимание: «народы, прославляйте Его народ».'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Или: «Он очистит Свою землю и Свой народ». Еврейский глагол может подчёркивать как искупление, так и очищение от вины или осквернения.'
    reason: lexical_alternative
  - marker: d
    text: 'Греческая Септуагинта и один из свитков Мёртвого моря сохраняют более пространную форму этого стиха: в ней есть дополнительные призывы к небесам и небесным существам радоваться, а к народам — поклониться Богу. Основной текст следует масоретскому еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Ликуйте
  rationale: Повелительная форма глагола רנן выражает громкую, радостную хвалу — ликование, радостный возглас или пение. «Ликуйте» естественно и кратко сохраняет праздничную силу слова.
- source_word: גוֹיִם
  choice: народы
  rationale: В данном международном и заветном контексте גוים обозначает народы мира. «Язычники» внесло бы более позднюю религиозную окраску.
- source_word: עַמּוֹ
  choice: вместе с Его народом
  rationale: 'Масоретский текст предельно сжат: буквально «ликуйте, народы, Его народ». Предлог «вместе с» передаёт наиболее вероятную связь: народы призваны ликовать вместе с Божьим народом, при этом неоднозначность отмечена в сноске.'
- source_word: דַם עֲבָדָיו
  choice: кровь Своих слуг
  rationale: עבדים может означать как слуг, так и рабов. Здесь главное — их принадлежность Богу и пролитая кровь; современное «слуг» точнее передаёт эту функцию без ненужного акцента на правовом статусе рабов.
- source_word: יִקּוֹם
  choice: отомстит за
  rationale: Глагол נקם в сочетании с кровью означает совершить возмездие за пролитую кровь. Русское «отомстит за кровь» идиоматично и сохраняет смысл судебного воздаяния.
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  choice: воздаст местью Своим врагам
  rationale: Оборот буквально говорит о возвращении или воздаянии мести противникам. Формулировка сохраняет отдельное существительное נָקָם («месть, возмездие») и направленность действия на врагов.
- source_word: וְכִפֶּר
  choice: совершит искупление за
  rationale: Глагол כפר несёт смысл искупления, заглаживания вины и очищения. Основной текст сохраняет его искупительный вес, а очистительное прочтение указано в сноске.
- source_word: אַדְמָתוֹ
  choice: Свою землю
  rationale: אדמה здесь обозначает землю, принадлежащую Богу и связанную с Его народом; «земля» естественно для национально-заветного контекста.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Заключительное עמו прямо передано как «Свой народ» и соединено с «Своей землёй» согласно наиболее естественному пониманию двух соотнесённых объектов глагола כפר.
theological_decisions:
- issue: Связь народов с Божьим народом в начальной строке
  choice: Народы призваны ликовать вместе с Божьим народом.
  alternative: 'Возможно более буквальное и синтаксически трудное понимание: «народы, прославляйте Его народ»; древние греческие и кумранские свидетели также содержат более пространную форму строки.'
  rationale: Масоретская последовательность слов сжата и не содержит явного предлога «с». Добавление «вместе с» представляет наиболее вероятную синтаксическую связь, но не выдаётся за бесспорную и сопровождается примечанием.
- issue: Значение כפר в заключительной строке
  choice: Бог совершит искупление за Свою землю и Свой народ.
  alternative: Бог очистит Свою землю и Свой народ или снимет с них осквернение.
  rationale: Перевод «совершит искупление» сохраняет экспиаторный смысл корня, не определяя сверх сказанного в стихе способ этого искупления. Очистительный оттенок остаётся в сноске.
- issue: Характер Божьего воздаяния врагам
  choice: Сохранён явный язык мести как справедливого воздаяния за кровь Божьих слуг.
  alternative: Сглаженное «Он воздаст Своим врагам».
  rationale: В еврейском тексте נָקָם названо прямо; его устранение ослабило бы суровую богословскую напряжённость песни и слило бы два соседних выражения о возмездии.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием Песни Моисея. Заглавные местоимения, относящиеся к Богу, поддерживают принятый в русском библейском стиле почтительный регистр. Формулировки не смягчают тему возмездия и не уточняют механизм искупления сверх еврейского текста.
