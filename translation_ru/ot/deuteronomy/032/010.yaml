  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: ru
  text: Он нашёл его в пустынной земле, среди пустынной, воющей глуши; окружил его, заботился о нём[a], хранил его как зрачок Своего ока[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол можно также понять как «давал ему разумение», «вразумлял его» или «внимательно наблюдал за ним».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «как зрачок Своего глаза»; традиционно также: «как зеницу ока Своего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: Он нашёл его
  rationale: Прямо передаёт Qal от מצא «найти»; прошедшее время естественно для поэтического рассказа о прошлом. Единственное число сохраняет образ Иакова/Израиля как одного лица.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: в пустынной земле
  rationale: Сохраняет оба элемента сочетания — «земля» и «пустыня» — и звучит естественно в возвышенной современной русской речи.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: среди пустынной, воющей глуши
  rationale: 'Передаёт сжатую поэтическую картину: תֹהוּ — пустота и запустение, יְלֵל — вой, יְשִׁמֹן — безлюдная пустынная местность. «Глушь» позволяет выразить запустение без космологического оттенка слова «хаос».'
- source_word: יְסֹבְבֶנְהוּ
  choice: окружил его
  rationale: Сохраняет конкретный образ глагола סבב — окружить, обступить — не заменяя его истолкованием «защитил».
- source_word: יְבֹונְנֵהוּ
  choice: заботился о нём
  rationale: В последовательности действий Божьей охраны передаёт внимательное, понимающее попечение. Возможный смысл «давал ему разумение» сохранён в сноске.
- source_word: יִצְּרֶנְהוּ
  choice: хранил его
  rationale: Точно передаёт נצר «хранить, оберегать» и естественно сочетается с образом зрачка.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: как зрачок Своего ока
  rationale: אִישׁוֹן обозначает зрачок. Формулировка сохраняет телесный образ оригинала; «око» поддерживает достоинство поэтического регистра, а традиционный русский оборот приведён в сноске.
theological_decisions:
- issue: К кому относятся местоимения мужского рода единственного числа
  choice: Иаков/Израиль представлен собирательно как одно лицо; сохранено «его».
  alternative: Передать во множественном числе как прямое указание на народ.
  rationale: Контекст песни говорит о народе через образ Иакова, а грамматика стиха последовательно употребляет единственное число. Перевод не устраняет эту поэтическую персонификацию.
- issue: Значение יְבֹונְנֵהוּ
  choice: «заботился о нём» — внимательное, разумное попечение.
  alternative: «давал ему разумение» или «вразумлял его».
  rationale: Глагол допускает значения понимания, внимания и сообщения разумения. Окружение глаголами «окружил» и «хранил» поддерживает смысл заботливого внимания, но интеллектуальный оттенок остаётся реальной возможностью и отмечен в сноске.
- issue: Обладатель ока в выражении עֵינוֹ
  choice: Прописное «Своего» указывает на око Господа в соответствии с ближайшей последовательностью Божьих действий.
  alternative: Строчное «своего» без типографического обозначения божественного референта.
  rationale: Местоименный суффикс относится к действующему лицу — Господу; прописная буква соответствует принятому русскому благоговейному регистру, не меняя смысла оригинала.
translation_notes:
  register: Современный литературный русский с достоинством древнееврейской поэзии. «Глушь» передаёт безлюдное запустение, а «око» сохраняет возвышенность заключительного сравнения без общей архаизации текста. В основном тексте сохранена сжатая цепь действий и собирательное единственное число.
