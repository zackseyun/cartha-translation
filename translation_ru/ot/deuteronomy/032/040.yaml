  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: ru
  text: 'Ибо Я поднимаю Свою руку к небесам и говорю[a]: «Жив Я вовеки!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я жив вовеки». В сочетании с поднятием руки эти слова имеют силу торжественной клятвы.'
    reason: Пояснение буквальной формы и её контекстуальной клятвенной функции.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит торжественное основание предшествующего заявления; «ибо» сохраняет логическую связь и возвышенный, но понятный регистр.
- source_word: אֶשָּׂא
  choice: поднимаю
  rationale: Глагол נשׂא здесь описывает поднятие руки при клятве. «Поднимаю» естественно передаёт конкретный жест без архаизма «воздеваю».
- source_word: אֶל שָׁמַיִם
  choice: к небесам
  rationale: Передаёт направление движения и сохраняет обычную для еврейского слова форму множественного числа; выражение естественно в торжественной русской речи.
- source_word: יָדִי
  choice: руку
  rationale: Сохранено единственное число исходного текста; принадлежность выражена формой первого лица глагола и контекстом, поэтому отдельное «Свою» по-русски не требуется.
- source_word: וְאָמַרְתִּי
  choice: и говорю
  rationale: В сочетании с предшествующим действием форма передаёт торжественное произнесение клятвы. Настоящее время сохраняет непосредственный, перформативный характер речи.
- source_word: חַי אָנֹכִי
  choice: Жив Я
  rationale: Сохранена необычная, торжественная структура еврейской формулы. В контексте поднятой руки она звучит как самоудостоверяющая клятва, но не превращена в явное «клянусь», которого в тексте нет.
- source_word: לְעֹלָם
  choice: вовеки
  rationale: Точно передаёт неограниченную длительность и соответствует достоинству поэтической речи; слово понятно современному читателю, хотя и имеет возвышенную окраску.
theological_decisions:
- issue: Передача Божьей клятвы Собою без добавления отсутствующего в тексте глагола «клянусь»
  choice: «Жив Я вовеки!» с пояснением клятвенной силы в сноске
  alternative: «Клянусь Собою, вечно Живым» или «Как жив Я вовеки»
  rationale: Еврейский текст буквально утверждает, что Бог жив вовеки, но жест поднятой руки придаёт словам силу клятвы. Выбранный вариант сохраняет и прямое утверждение, и его контекстуальную клятвенную функцию, не добавляя богословски насыщенной формулировки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Архаическое «воздеваю» не использовано; «вовеки» сохранено как понятное и уместное для торжественной прямой речи.
