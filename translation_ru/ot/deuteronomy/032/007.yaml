base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: ru
  text: 'Вспомни древние дни,

    вдумайтесь[b] в годы сменявшихся поколений[a].


    Спроси своего отца[c] — и он расскажет тебе,

    своих старейшин — и они скажут тебе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «годы поколения и поколения» — еврейское выражение о следующих друг за другом поколениях.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь неожиданно стоит множественное число: «вдумайтесь», тогда как окружающие повеления обращены к одному лицу: «вспомни» и «спроси». Возможно, единственный адресат представляет весь народ.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Или, в более широком смысле: «своего предка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Форма Qal, повелительное наклонение, 2-е лицо мужского рода единственного числа. «Вспомни» естественно передаёт прямой призыв обратиться памятью к прошлому.
- source_word: יְמוֹת עוֹלָם
  choice: древние дни
  rationale: Сочетание обозначает дни далёкого прошлого. «Древние дни» сохраняет поэтическую краткость и смысл древности.
- source_word: בִּינוּ
  choice: вдумайся
  rationale: Глагол בין здесь призывает не просто помнить, а осмыслять и различать значение прошлого. В основном тексте употреблено естественное русское единственное число, а множественное число еврейской формы отмечено в сноске.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: годы сменявшихся поколений
  rationale: Буквально «годы поколения и поколения» — идиома последовательной смены поколений. Выбранная формулировка передаёт этот смысл естественно по-русски, а буквальное строение указано в сноске.
- source_word: שְׁאַל
  choice: Спроси
  rationale: Прямое и естественное соответствие повелительной форме глагола שאל.
- source_word: אָבִיךָ
  choice: своего отца
  rationale: Основное значение существительного с суффиксом 2-го лица — «твой отец». Возвратное местоимение требуется нормами русского языка при обращении «спроси».
- source_word: וְיַגֵּדְךָ
  choice: и он расскажет тебе
  rationale: Hiphil глагола נגד означает сообщить или поведать. «Расскажет тебе» естественно сочетается с передачей памяти о прошлом.
- source_word: זְקֵנֶיךָ
  choice: своих старейшин
  rationale: Слово обозначает старших, обладающих памятью и авторитетом в общине, поэтому «старейшины» точнее, чем просто «старики».
- source_word: וְיֹאמְרוּ לָךְ
  choice: и они скажут тебе
  rationale: Сохранено обычное значение אמר «сказать» и лексическое отличие от предыдущего נגד «рассказать».
theological_decisions:
- issue: Единственное или собирательное значение слова אָבִיךָ
  choice: 'В основном тексте: «своего отца»'
  alternative: «своего предка» или собирательно «отцов»
  rationale: Непосредственное лексическое значение — отец отдельного адресата; более широкое родовое понимание возможно в контексте передачи памяти и поэтому вынесено в сноску, а не исключено.
translation_notes:
  register: Современный литературный русский язык с краткими поэтическими строками и сохранённым параллелизмом. Обращение на «ты» следует формам единственного числа в основной части еврейского текста. Эллипсис во второй половине («спроси… своих старейшин») естественен для русской поэзии и отражает еврейский параллелизм.
