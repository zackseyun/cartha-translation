source:
  edition: WLC
  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: ru
  text: Ибо огонь возгорелся в гневе Моём и пылает до глубин Шеола[a]; он пожирает землю и её плоды и воспламеняет основания гор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до самого глубокого Шеола»; возможно также: «до глубин мира мёртвых». Буквально: «до Шеола нижайшего (глубочайшего)».'
    reason: Слово תַּחְתִּית допускает передачу как «нижний», «самый низкий» или «глубочайший», а שְׁאוֹל обозначает область умерших и не вполне совпадает с русскими словами «могила», «преисподняя» или «ад».
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующего возвещения о суде; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: אֵשׁ קָדְחָה
  choice: огонь возгорелся
  rationale: Сочетание существительного с перфектом описывает уже разгоревшийся огонь; «возгорелся» передаёт начало и последующий результат действия.
- source_word: בְאַפִּי
  choice: в гневе Моём
  rationale: אַף буквально означает «нос», но в этой устойчивой идиоме обозначает гнев; буквальное воспроизведение было бы непонятно по-русски.
- source_word: וַתִּיקַד
  choice: и пылает
  rationale: Глагол продолжает образ огня; настоящее время естественно передаёт продолжающийся результат уже начавшегося горения.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: до глубин Шеола
  rationale: Название «Шеол» сохраняет древнееврейское представление о мире мёртвых, а תַּחְתִּית указывает на его предельную глубину. Русская формулировка сохраняет образ, не отождествляя Шеол с позднейшими богословскими понятиями.
- source_word: וַתֹּאכַל
  choice: он пожирает
  rationale: Буквально глагол означает «есть»; применительно к огню «пожирает» сохраняет яркую метафору разрушения.
- source_word: אֶרֶץ
  choice: землю
  rationale: Широкое значение «земля» уместно в космическом образном ряду, где также названы Шеол и основания гор; более локальное «страну» неоправданно сужало бы смысл.
- source_word: וִיבֻלָהּ
  choice: и её плоды
  rationale: Слово обозначает то, что производит земля — её урожай или произрастания; «плоды» ясно и естественно передаёт собирательный смысл.
- source_word: וַתְּלַהֵט
  choice: и воспламеняет
  rationale: Форма передаёт интенсивное или причинительное действие огня; «воспламеняет» сохраняет его активный и нарастающий характер.
- source_word: מוֹסְדֵי הָרִים
  choice: основания гор
  rationale: Буквальный образ указывает на глубочайшие опоры гор и подчёркивает всеохватность огня.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; преисподняя; мир мёртвых
  rationale: Транслитерация сохраняет ветхозаветное обозначение области умерших и не подменяет его более поздним и узким понятием ада. Возможный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством древней поэзии. Синтаксис сохраняет нарастающую последовательность образов огня, а местоимение «он» однозначно отсылает к огню. Прописная буква в «Моём» следует принятой русской практике для речи Бога.
