  naturalness: Текст литературен и поэтичен. Однако в конструкции «Как мог бы один …, а двое — обратить …» форма «мог бы» грамматически относится к единственному числу и не может безупречно быть опущена при подлежащем «двое». Явное «могли бы» делает параллелизм естественным и устраняет синтаксическую неровность.
  terminology: «Скала» с прописной буквы уместна как повторяющийся божественный титул в Песни Моисея. «Яхве» корректно передаёт יהוה. «Продала» сохраняет намеренно резкий образ מכר, а «отдал … во власть» — смысл הִסְגִּיר.
