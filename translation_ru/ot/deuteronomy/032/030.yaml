  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: ru
  text: 'Как мог бы один преследовать тысячу,

    а двое могли бы обратить в бегство десять тысяч,

    если бы их Скала не продала их

    и Яхве не отдал их во власть[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не выдал их».'
    reason: Лексическая альтернатива для הִסְגִּירָם, которое означает передачу в чужую власть.
lexical_decisions:
- source_word: אֵיכָה
  choice: Как мог бы
  rationale: Передаёт риторическое изумление и подразумеваемую невозможность такого исхода без Божьего суда.
- source_word: יִרְדֹּף
  choice: преследовать
  rationale: Обычное военное значение רדף; современное и точное русское соответствие.
- source_word: אֶחָד אֶלֶף
  choice: один преследовать тысячу
  rationale: Сохраняет резкое численное несоответствие исходного текста.
- source_word: וּשְׁנַיִם
  choice: а двое
  rationale: Союз «а» естественно оформляет параллельную усиливающую строку в русском языке.
- source_word: יָנִיסוּ
  choice: обратить в бегство
  rationale: Передаёт каузативную форму глагола נוּס и соответствует военному контексту.
- source_word: רְבָבָה
  choice: десять тысяч
  rationale: Прямое числовое значение здесь яснее современному читателю, чем «тьма» или «мириада».
- source_word: אִם לֹא כִּי
  choice: если бы ... не
  rationale: В сочетании с риторическим вопросом выражает единственно возможное объяснение описанного поражения.
- source_word: צוּרָם
  choice: их Скала
  rationale: Сохраняет ключевую метафору Песни Моисея; прописная буква показывает, что это обозначение Бога.
- source_word: מְכָרָם
  choice: не продала их
  rationale: Сохраняет метафору продажи, употреблённую для передачи народа во власть врагов; женский род согласован с существительным «Скала».
- source_word: וַיהוָה
  choice: и Яхве
  rationale: Передаёт личное заветное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: הִסְגִּירָם
  choice: не отдал их во власть
  rationale: 'Передаёт каузативный смысл: отдать людей под чужую власть. Дополнение «во власть» делает значение естественным по-русски, не уточняя прямо, кому именно они отданы.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет Тетраграмматон; транслитерация сохраняет отличие личного имени от титула.
- issue: Метафорический титул צוּרָם
  choice: их Скала
  alternative: их скала
  rationale: В Песни Моисея «Скала» служит повторяющимся обозначением Бога. Прописная буква помогает распознать титульное употребление, не устраняя метафору.
- issue: Образ продажи в מְכָרָם
  choice: продала их
  alternative: отдала их
  rationale: Более буквальный вариант сохраняет напряжённый образ Божьего суда и не смягчает его до общего «оставила» или «отдала».
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Параллелизм и числовая градация сохранены; тире во второй строке устраняет ненужное повторение глагола. Необычное сочетание «Скала не продала» сознательно удерживает исходную метафору и грамматическое согласование.
