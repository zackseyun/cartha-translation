base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: ru
  text: Но Иешурун разжирел и стал лягаться; ты разжирел, растолстел и раздобрел[a]. Он оставил Бога, создавшего его, и презрел Твердыню своего спасения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «покрылся жиром» или «распух». Еврейское слово редкое, и его точный оттенок неясен, однако речь определённо идёт о чрезмерной упитанности.'
    reason: Лексическая неопределённость редкой формы כָּשִׂיתָ.
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: Иешурун
  rationale: Имя-титул Израиля передано транслитерацией, чтобы сохранить поэтическое именование и не сводить его заранее к толкованию «Праведный» или просто «Израиль».
- source_word: וַיִּשְׁמַן
  choice: разжирел
  rationale: Сохранён конкретный образ откормленного существа; в контексте он подразумевает благополучие, породившее самодовольство.
- source_word: וַיִּבְעָט
  choice: стал лягаться
  rationale: Буквальный образ упитанного животного, которое брыкается, выразительнее отвлечённого «взбунтовался».
- source_word: שָׁמַנְתָּ
  choice: ты разжирел
  rationale: Форма второго лица сохранена, чтобы передать внезапный переход от повествования к прямому обличению.
- source_word: עָבִיתָ
  choice: растолстел
  rationale: Слово усиливает телесный образ чрезмерной сытости и естественно звучит в современном русском языке.
- source_word: כָּשִׂיתָ
  choice: раздобрел
  rationale: Редкая и не вполне ясная форма, по-видимому, завершает ряд образов избыточной упитанности; выбранное слово передаёт общий смысл, а неопределённость отмечена в сноске.
- source_word: וַיִּטֹּשׁ
  choice: оставил
  rationale: Прямо и ясно передаёт отказ Израиля от верности своему Богу без архаизации.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: Бога, создавшего его
  rationale: Сохранена определительная конструкция и мысль о Боге как Создателе Израиля.
- source_word: וַיְנַבֵּל
  choice: презрел
  rationale: Передаёт активное бесчестие и пренебрежение, выраженные глаголом.
- source_word: צוּר
  choice: Твердыню
  rationale: Устойчивая и понятная русская передача божественной метафоры скалы как надёжной защиты; прописная буква отмечает её функцию как именования Бога.
- source_word: יְשׁוּעָתוֹ
  choice: своего спасения
  rationale: Сохраняет богословски весомое и контекстуально точное значение избавления, даруемого Богом.
theological_decisions:
- issue: Переход от третьего лица ко второму и обратно
  choice: 'Сохранён переход: «Иешурун… ты… Он».'
  alternative: 'Привести весь стих к третьему лицу: «он разжирел… растолстел… оставил».'
  rationale: Смена лица присутствует в еврейском тексте и усиливает прямое обличение; её не следует сглаживать.
- issue: Божественная метафора צוּר
  choice: «Твердыню» с прописной буквы
  alternative: «скалу» или «твердыню» со строчной буквы
  rationale: В Песни Моисея это повторяющееся метафорическое именование Бога; прописная буква помогает распознать эту функцию, не устраняя сам образ.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой телесной метафоры и поэтических повторов. «Лягаться» намеренно оставляет образ откормленного, взбрыкнувшего животного; синтаксическая смена лиц не сглажена.
