base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: ru
  text: 'Когда Всевышний наделял народы уделами,

    когда разделял сынов человеческих[a],

    Он установил границы народов

    по числу сынов Израиля[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны человеческие» — еврейское выражение, обозначающее людей, человечество.
    reason: lexical_alternative
  - marker: b
    text: В Свитках Мёртвого моря здесь засвидетельствовано чтение «сынов Божьих», а в Септуагинте — «ангелов Божьих» вместо «сынов Израиля».
    reason: textual_variant
lexical_decisions:
- source_word: בְּהַנְחֵל
  choice: когда ... давал ... их уделы
  rationale: Конструкция с инфинитивом породы hифиль и предлогом בְּ образует временное придаточное; глагол נחל здесь означает наделение народов причитающимися им владениями. «Давал ... их уделы» естественно передаёт распределительный смысл.
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Здесь это титул Бога; традиционное и понятное русское соответствие сохраняет его возвышенный характер.
- source_word: גּוֹיִם
  choice: народам
  rationale: В контексте речь идёт о народах мира, а не о «язычниках» в позднейшем религиозном смысле.
- source_word: בְּהַפְרִידוֹ
  choice: когда разделял
  rationale: Вторая временная конструкция; суффикс третьего лица указывает на Всевышнего как действующее лицо. «Разделял» сохраняет широкий смысл פרד, не уточняя, идёт ли речь о расселении или ином разграничении.
- source_word: בְּנֵי אָדָם
  choice: сынов человеческих
  rationale: Формулировка сохраняет образ и мужскую грамматическую форму еврейского выражения, оставаясь при этом понятным поэтическим обозначением человечества.
- source_word: יַצֵּב
  choice: установил
  rationale: Порода hифиль глагола יצב выражает твёрдое установление; русский глагол естественно сочетается с «границами».
- source_word: גְּבֻלֹת עַמִּים
  choice: границы народов
  rationale: Передаёт территориальное разграничение человеческих сообществ и сохраняет лексическую связь с народами в первой строке.
- source_word: לְמִסְפַּר
  choice: по числу
  rationale: Кратко и естественно передаёт соответствие количества или меры.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Прямо следует чтению масоретского текста WLC и сохраняет форму исходного выражения, не заменяя её толковательным «израильтян».
theological_decisions:
- issue: Текстовый вариант в заключительной строке
  choice: сынов Израиля
  alternative: сынов Божьих; ангелов Божьих
  rationale: Основной текст следует предоставленному WLC, где стоит בְּנֵי יִשְׂרָאֵל. Кумранская рукопись поддерживает чтение «сынов Божьих», а Септуагинта — «ангелов Божьих». Поскольку вариант существенно влияет на понимание стиха, он указан в сноске без разрешения текстологического и богословского напряжения.
- issue: Значение выражения בְּנֵי אָדָם
  choice: сынов человеческих
  alternative: людей; человечество; сынов Адама
  rationale: Основной текст сохраняет мужскую образную форму еврейского выражения, а сноска поясняет его собирательное значение и не сводит неоднозначное אָדָם исключительно к личному имени Адам.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Параллелизм четырёх строк отражает структуру еврейского стиха; синтаксис остаётся ясным для обычного читателя. Местоимение «Он» написано с прописной буквы по принятой русской библейской издательской норме, без добавления конфессионально специфической терминологии.
