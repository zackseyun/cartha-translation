  text: творогом из коровьего молока и молоком от мелкого скота, с жиром ягнят, баранов из Васана и козлов, с отборной пшеницей[a]; и пил ты пенящееся вино[b] — кровь винограда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с жиром почек пшеницы» — образное выражение, означающее самые лучшие, тучные зёрна.'
