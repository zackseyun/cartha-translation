base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: ru
  text: 'Я напою Мои стрелы кровью,

    и Мой меч будет пожирать плоть —

    от крови убитых и пленных,

    от головы врага с распущенными волосами.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна, особенно редкое слово פַּרְעוֹת. Буквально: «от головы врага с распущенными волосами». Возможны также переводы: «от волосатых голов врага», «от головы вражеских предводителей» или «от длинноволосых воинов врага».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: Я напою
  rationale: Каузативная форма буквально означает «сделаю пьяными». Русское «напою кровью» естественно сохраняет яркую поэтическую метафору насыщения стрел кровью.
- source_word: חִצַּי
  choice: Мои стрелы
  rationale: Прямое и естественное соответствие существительному «стрела» во множественном числе с суффиксом первого лица.
- source_word: מִדָּם
  choice: кровью
  rationale: Предлог מן после глагола опьянения обозначает то, чем стрелы будут напоены; творительный падеж идиоматичен по-русски.
- source_word: וְחַרְבִּי
  choice: и Мой меч
  rationale: Формально передаёт сочинительную связь и притяжательный суффикс первого лица.
- source_word: תֹּאכַל בָּשָׂר
  choice: будет пожирать плоть
  rationale: «Пожирать» сохраняет олицетворяющую метафору еврейского «есть плоть» и её насильственную силу.
- source_word: מִדַּם חָלָל וְשִׁבְיָה
  choice: кровь убитых и пленников
  rationale: חָלָל здесь обозначает павших или убитых в бою, а שִׁבְיָה, вероятнее всего, пленников. В поэтическом синтаксисе эта строка конкретизирует, что именно поглощает меч.
- source_word: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: головы вражеских воинов
  rationale: Фраза трудна, а редкое פַּרְעוֹת допускает связь с распущенными волосами, предводителями или воинами. Основной текст передаёт вероятный военный референт, а буквальные и альтернативные возможности сохранены в примечании.
theological_decisions:
- issue: Толкование трудной фразы מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: головы вражеских воинов
  alternative: «с волосатых голов врага»; «с головы вражеских предводителей»; «с длинноволосых воинов врага»
  rationale: Это лексико-синтаксическая, а не конфессиональная трудность. Читаемый военный смысл дан в основном тексте, но неоднозначность редкого слова не скрыта и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Сохранены военные метафоры опьянения стрел и пожирающего меча; трудное заключительное выражение не представлено как однозначное.
