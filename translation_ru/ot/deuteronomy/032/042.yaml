  source_fidelity: 'Начальные две строки в целом верно передают образ: אַשְׁכִּיר — каузативное «напою/сделаю пьяными», а «меч будет пожирать плоть» сохраняет метафору. Однако заключительные члены с מִן в черновике превращены в не связанные синтаксически дополнения («кровь… головы…»), хотя они должны быть отмечены как исходные пункты/источники. Кроме того, «воины» не выражено прямо в מֵרֹאשׁ פַּרְעוֹת אוֹיֵב, а множественное «головы» преждевременно разрешает трудную форму רֹאשׁ.'
  naturalness: «Напою стрелы кровью» и «меч будет пожирать плоть» естественны для торжественной русской поэзии. Повтор предлога «от» делает финальную конструкцию понятной, не сглаживая её намеренно резкий и образный характер. Буквальное «врага с распущенными волосами» несколько необычно, но допустимо в поэтическом тексте и честнее отражает спорное פַּרְעוֹת; пояснение вынесено в сноску.
  terminology: «Убитые» и «пленные» точно и современно передают חָלָל и вероятное личное значение שִׁבְיָה. «Распущенные волосы» передаёт базовое значение פַּרְעוֹת, не навязывая интерпретацию «предводители» или «воины». Альтернативное понимание как предводителей сохранено в примечании.
