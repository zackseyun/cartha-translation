  - severity: medium
    issue: «Головы вражеских воинов» чрезмерно конкретизирует спорное מֵרֹאשׁ פַּרְעוֹת אוֹיֵב.
    rationale: В тексте нет отдельного слова «воины», רֹאשׁ формально единственно, а פַּרְעוֹת может обозначать распущенные волосы либо в переносном истолковании предводителей. Основной текст должен сохранять эту неопределённость; толковательные варианты следует оставить в сноске.
