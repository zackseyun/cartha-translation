  rationale: Еврейское выражение обозначает наземных ползающих существ в целом и не позволяет уверенно сузить его только до змей.
translation_notes:
  register: Современный литературный русский язык с достоинством древнееврейской поэзии. Сохранены параллелизм, конкретные образы пожирания, клыков, яда и праха; чрезмерно архаичные «алчба», «моровая язва» и «гады» не использованы.
