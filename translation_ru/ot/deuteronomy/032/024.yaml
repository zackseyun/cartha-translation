lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: изнурённые голодом
  rationale: Передаёт состояние истощения и измождения от голода, сохраняя поэтическую сжатость еврейского выражения.
- source_word: לְחֻמֵי רֶשֶׁף
  choice: пожираемые горячкой
  rationale: Редкая пассивная форма לְחֻמֵי буквально рисует пожирание, а רֶשֶׁף здесь естественно обозначает жгучую, губительную болезнь; «горячка» сохраняет образ жара и не дублирует следующую погибель.
- source_word: קֶטֶב מְרִירִי
  choice: горькой погибелью
  rationale: קֶטֶב означает губительное бедствие или погибель, а מְרִירִי — «горький»; буквальный образ сохранён в понятной поэтической форме.
- source_word: שֶׁן בְּהֵמוֹת
  choice: клыки зверей
  rationale: שֶׁן буквально означает «зуб», но применительно к нападающим зверям русское «клыки» естественно передаёт угрозу, не добавляя отдельного определения «диких».
- source_word: אֲשַׁלַּח בָּם
  choice: Я пошлю на них
  rationale: Предлог ב в этой конструкции обозначает направленное против людей бедствие; «пошлю на них» идиоматично и сохраняет прямое действие говорящего.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: яд ползающих в прахе
  rationale: В сочетании с ползающими существами חֲמַת означает яд, а זֹחֲלֵי עָפָר шире, чем только змеи; перевод сохраняет неопределённость и образ праха.
