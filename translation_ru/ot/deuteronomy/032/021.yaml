base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: ru
  text: Они возбудили Мою ревность тем, что не является богом, прогневили Меня своими идолами[a]. Я же возбужу их ревность теми, кто не народ[b], и разгневаю их безрассудным народом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своими пустыми вещами», «своими тщетами». Еврейское слово может обозначать дыхание, пустоту или ничтожность и в данном контексте относится к идолам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не народом». Это выражение намеренно перекликается с «тем, что не является богом» в первой части стиха.'
    reason: lexical_alternative
  - marker: c
    text: «Безрассудный» здесь обозначает прежде всего нравственное и духовное безрассудство, а не просто недостаток ума.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: вызвали во Мне ревность
  rationale: Передаёт каузативный смысл глагола קנא и сохраняет его смысловую перекличку с последующим אַקְנִיאֵם.
- source_word: בְּלֹא אֵל
  choice: не-богом
  rationale: Намеренно необычная форма сохраняет резкое отрицание божественного статуса и точный параллелизм с «не-народом».
- source_word: כִּעֲסוּנִי
  choice: прогневили Меня
  rationale: Естественно передаёт каузативное значение «вызвали Мой гнев» и допускает симметричное повторение во второй половине стиха.
- source_word: בְּהַבְלֵיהֶם
  choice: своими идолами
  rationale: В контексте речь идёт об идолах; буквальные оттенки пустоты, тщеты и ничтожности сохранены в примечании.
- source_word: אַקְנִיאֵם
  choice: вызову в них ревность
  rationale: Сохраняет взаимную, возмездную симметрию с первой строкой и каузативный смысл еврейской формы.
- source_word: בְּלֹא עָם
  choice: не-народом
  rationale: Передаёт намеренный параллелизм с «не-богом» и риторически резкое обозначение тех, кто не считается народом.
- source_word: בְּגוֹי נָבָל
  choice: неразумным народом
  rationale: «Неразумный» может обозначать нравственно-духовное безрассудство, не сводя выражение к недостатку умственных способностей.
- source_word: אַכְעִיסֵם
  choice: прогневлю их
  rationale: Повторяет формулировку первой половины и сохраняет структуру ответного воздаяния.
theological_decisions:
- issue: Кого обозначают «не-народ» и «неразумный народ»
  choice: Оставить обозначение обобщённым, не называя конкретный исторический народ.
  alternative: Уточнить как язычников в целом или как определённый языческий народ.
  rationale: В еврейском тексте этот народ не назван; обобщённая передача сохраняет исходную неоднозначность и не привносит позднейшее толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Необычные образования «не-бог» и «не-народ» сохранены ради ключевого риторического параллелизма еврейского текста; порядок двух ответных действий воспроизводит структуру воздаяния.
