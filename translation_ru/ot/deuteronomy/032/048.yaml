lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: Форма продвигает повествование и вводит прямую речь; по-русски «сказал» естественно сочетается с последующими словами, не требуя буквального воспроизведения формулы לֵאמֹר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; традиционная русская форма пояснена в сноске.
- source_word: אֶל־מֹשֶׁה
  choice: Моисею
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Идиома подчёркивает точное совпадение по времени; «в тот самый день» естественно передаёт этот акцент в русском повествовании.
- source_word: לֵאמֹר
  choice: двоеточие после «сказал Моисею»
  rationale: Еврейская формула вводит прямую речь следующего стиха. В современном русском её функцию яснее и естественнее передаёт двоеточие, без избыточного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя, поэтому оно сохранено в основном тексте. Сноска отмечает традиционную замену «Господь» и вариант «Иегова», не объявляя спорное произношение бесспорным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «И» сохраняет повествовательную связь с предыдущим контекстом; двоеточие естественно вводит речь, начинающуюся в следующем стихе.
