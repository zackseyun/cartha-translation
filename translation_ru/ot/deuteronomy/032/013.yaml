  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: ru
  text: 'Он дал ему ездить по высотам земли[a],

    и тот ел плоды полей[b];

    Он дал ему сосать мёд из скалы[c]

    и масло из кремнистой скалы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по возвышенностям земли». Еврейский глагол буквально означает «дал ему ехать (верхом)». Здесь, вероятно, имеются в виду возвышенные плодородные места, а не культовые высоты.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «урожай полей»; буквально: «плоды полей».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «дал ему сосать мёд из скалы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: вознёс его
  rationale: Каузатив породы hифиль от רכב буквально передаёт идею «дать ехать, посадить верхом». В данном поэтическом контексте «вознёс его» естественно по-русски выражает движение на высоты и торжественное возвышение; буквальный образ отмечен в сноске.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: на высоты земли
  rationale: במות здесь обозначает возвышенности или высоты местности. Формулировка сохраняет топографический и поэтический смысл, не создавая ненужной ассоциации с культовыми высотами.
- source_word: וַיֹּאכַל
  choice: и тот питался
  rationale: 'Местоимение «тот» ясно показывает смену действующего лица: питается тот, кого Бог вознёс. «Питался» естественно сочетается с собирательным обозначением урожая и сохраняет продолжительный поэтический образ.'
- source_word: תְּנוּבֹת שָׂדָי
  choice: плодами поля
  rationale: תנובות означает урожай, плоды или произведения земли. «Плоды поля» — естественное и образное соответствие; единственное число «поля» сохраняет собирательную форму еврейского текста.
- source_word: וַיֵּנִקֵהוּ
  choice: кормил его
  rationale: Hифиль от ינק буквально означает «давал сосать». В основном тексте выбрано естественное русское «кормил», а яркий буквальный образ сохранён в сноске.
- source_word: דְבַשׁ מִסֶּלַע
  choice: мёдом из скалы
  rationale: 'Перевод сохраняет конкретные образы источника и дара: דבש — «мёд», סלע — «скала».'
- source_word: וְשֶׁמֶן מֵחַלְמִישׁ צוּר
  choice: и маслом из кремнистой скалы
  rationale: שמן передано общим словом «масло», поскольку еврейский текст не уточняет, что оно оливковое. חלמיש צור обозначает твёрдую, кремнистую скалу и подчёркивает чудесное изобилие там, где его невозможно ожидать.
theological_decisions:
- issue: Кого обозначают местоимения третьего лица
  choice: Сохранить местоимения, не подставляя в основной текст имена «Господь» и «Израиль»
  alternative: Прямо назвать субъект Господом, а объект Израилем или Иаковом
  rationale: Референты понятны из ближайшего контекста, но сам стих использует местоимения. Их сохранение уважает структуру еврейской речи и не превращает контекстуальное пояснение в часть перевода.
- issue: Образ получения пищи из скалы
  choice: Сохранить скалу как источник мёда и масла без рационализирующего пояснения
  alternative: Истолковать выражение как продукты пчёл и олив, находившихся среди скал
  rationale: Поэтическая формулировка намеренно подчёркивает изобилие, приходящее из неплодородного камня; перевод не должен сужать этот образ до одного объяснения.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. Заглавное «Он» во второй половине строки обусловлено началом нового предложения, а не специальным конфессиональным правилом написания местоимений. Формулировки избегают архаизмов и при этом сохраняют возвышенный тон Песни Моисея.
