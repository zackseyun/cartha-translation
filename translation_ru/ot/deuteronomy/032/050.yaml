  rationale: Исправлен только русский эквивалент еврейского идиома נֶאֱסַף אֶל־עַמֶּיךָ / וַיֵּאָסֶף אֶל־עַמָּיו. «Присоединиться к своему народу» лучше сохраняет образ исходника и его неоднозначность, чем «приобщиться», и последовательно повторён для Моисея и Аарона. Остальной текст сохраняет исходный смысл и современный литературный регистр.
