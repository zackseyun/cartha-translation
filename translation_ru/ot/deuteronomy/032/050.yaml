review_pass:
  verdict: revise
  source_fidelity: 'В целом синтаксис, повелительная форма «умри», гора Ор и повтор сравнительного оборота переданы верно. Однако «приобщись к своему народу» не является точной передачей נֶאֱסַף אֶל־עַמֶּיךָ: «приобщиться» в современном русском обычно означает присоединиться к делу, группе или практике и может нести чуждый исходнику оттенок сознательного/религиозного присоединения. Нужен нейтральный устойчиво-библейский образ «присоединись к своему народу», с пояснением идиомы в сноске.'
  naturalness: «На горе, на которую ты поднимаешься» естественно и достаточно передаёт направление שָׁמָּה без избыточного «туда». «Твой брат Аарон» и «на горе Ор» нормативны. Замена «приобщись/приобщился» на «присоединись/присоединился» делает фразу яснее и современнее, сохраняя возвышенный регистр.
  terminology: Топоним «гора Ор» передан корректно. Для идиомы אסף אל־עמיו следует сохранить одинаковую формулировку в обоих случаях. Сноска должна называть буквальный смысл как «быть присоединённым к своему народу», а не повторять неточный выбранный глагол; вариант «к предкам» допустим как интерпретирующая альтернатива, не как снятие неоднозначности основного текста.
  issues:
  - severity: medium
    issue: «Приобщись к своему народу» / «приобщился к своему народу»
    rationale: Глагол «приобщиться» в современном литературном употреблении означает приобщение к чему-либо (например, к культуре, вере, делу) и плохо воспроизводит пассивный еврейский идиоматический образ «быть собранным/присоединённым к своему народу». «Присоединись» сохраняет образ, не добавляя религиозно-оценочного значения.
