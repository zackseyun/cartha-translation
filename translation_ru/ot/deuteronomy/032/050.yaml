lexical_decisions:
- source_word: וּמֻת
  choice: И умри
  rationale: Повелительная форма глагола מות обращена к Моисею; прямое повеление сохранено без превращения его в простое предсказание.
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: на горе, на которую ты поднимаешься
  rationale: «Гора» и движение вверх переданы прямо; שָׁמָּה естественно выражено направительной конструкцией «на которую», поэтому отдельное «туда» по-русски избыточно.
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: и приобщись к своему народу
  rationale: Сохранён библейский образ соединения с народом после смерти. «Приобщись» передаёт форму повеления естественнее, чем тяжеловесное «будь собран».
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Простое сравнительное «как» естественно связывает смерть Моисея со смертью Аарона.
- source_word: אַהֲרֹן אָחִיךָ
  choice: твой брат Аарон
  rationale: Современный естественный порядок слов без потери родственного определения.
- source_word: בְּהֹר הָהָר
  choice: на горе Ор
  rationale: Топоним הֹר передан принятой русской формой «Ор», а הָהָר — словом «гора».
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: и приобщился к своему народу
  rationale: Повтор того же оборота сохранён для лексической связности и сопоставления Моисея с Аароном.
theological_decisions:
- issue: Оборот אסף אל־עמיו как обозначение смерти
  choice: Сохранить в основном тексте образ «приобщиться к своему народу»
  alternative: «отойти к предкам» или «быть погребённым с предками»
  rationale: Еврейский оборот связан со смертью, но не сводится явно только к погребению или происхождению. Образная формулировка сохраняет смысловую и богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Повтор ключевого оборота сохранён; ненужная русскому языку буквальная передача שָׁמָּה отдельным словом «туда» опущена.
