  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: ru
  text: Поднимись на эту гору Аварим[a] — гору Нево, что в земле Моав, напротив Иерихона, и осмотри землю Ханаана, которую Я отдаю сынам Израиля во владение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Аварим — горная область к востоку от Мёртвого моря; гора Нево была одной из её вершин.
    reason: geographical_clarification
  - marker: b
    text: 'Или: «в наследственное владение». Еврейское слово обозначает владение, особенно земельный надел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Поднимись
  rationale: Повелительная форма ед. ч. от עלה передаёт прямое указание взойти на гору; «поднимись» естественно и сохраняет направление движения.
- source_word: הַר הָעֲבָרִים
  choice: гора Аварим
  rationale: Географическое название передано транслитерацией; сочетание естественно читается как название горной области или горы.
- source_word: הַר נְבוֹ
  choice: гора Нево
  rationale: Аппозиция уточняет конкретную вершину; имя собственное передано традиционной русской формой «Нево».
- source_word: אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ
  choice: напротив Иерихона
  rationale: В географическом контексте идиома означает расположение напротив, перед лицом или в виду Иерихона.
- source_word: וּרְאֵה
  choice: и осмотри
  rationale: Императив ראה здесь означает не просто зрительное восприятие, а повеление обозреть показываемую землю; «осмотри» естественно в данном контексте.
- source_word: אֶרֶץ כְּנַעַן
  choice: землю Ханаан
  rationale: Название страны передано принятой русской библейской формой; конструкция с приложением сохраняет структуру исходного сочетания.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: которую Я отдаю
  rationale: Причастная форма с явно выраженным местоимением передаёт совершаемое и предстоящее дарование земли; «отдаю» подчёркивает передачу во владение.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняется буквальная форма устойчивого этнонима и его грамматически мужское выражение.
- source_word: לַאֲחֻזָּה
  choice: во владение
  rationale: אֲחֻזָּה обозначает закреплённое владение, особенно земельное; русский оборот ясен и не добавляет обязательного оттенка наследования.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам / народу Израиля
  rationale: Формулировка сохраняет образ и грамматическую форму исходного устойчивого обозначения народа, не исключая того, что речь идёт обо всём народе завета.
- issue: Характер дарования земли в לַאֲחֻזָּה
  choice: во владение
  alternative: в наследие
  rationale: Выбрано более прямое значение земельного владения; вариант «в наследие» возможен по контексту, но способен внести более узкий богословско-юридический оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис близок к еврейскому, но не перегружен архаизмами; географические имена даны в узнаваемых русских формах.
