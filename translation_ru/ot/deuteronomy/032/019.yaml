  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: ru
  text: И увидел Господь и отверг их, потому что Его сыновья и дочери вызывали Его гнев[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «презрел их»; возможный оттенок: «отверг их с презрением».'
    reason: Лексическая альтернатива для וַיִּנְאָץ, которое может обозначать презрительное отвержение.
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и общепонятная передача тетраграмматона в русском библейском стиле; она сохраняет достоинство текста и не вводит менее привычную транслитерацию.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямое и естественное соответствие обычному значению глагола ראה в породе qal.
- source_word: וַיִּנְאָץ
  choice: отверг их
  rationale: Глагол выражает презрительное отвержение. «Отверг» ясно передаёт разрыв отношений, а подразумеваемое дополнение «их» восстановлено из контекста.
- source_word: מִכַּעַס
  choice: разгневанный
  rationale: Предлог מִן имеет здесь причинное значение, а כעס обозначает раздражение или провокацию, вызывающую гнев. Причастная конструкция естественно выражает это по-русски.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: Своими сыновьями и дочерьми
  rationale: Сохранено явное упоминание обоих полов; возвратное «Своими» однозначно относит сыновей и дочерей к Господу.
theological_decisions:
- issue: Подразумеваемое дополнение при וַיִּנְאָץ
  choice: Дополнение восстановлено как «их», то есть Израиль/народ.
  alternative: 'Оставить дополнение невыраженным: «увидел Господь и отверг».'
  rationale: В русском языке переходный глагол здесь естественно требует дополнения, а его референт ясно определяется контекстом; это не добавляет нового богословского утверждения.
- issue: Характер Божьего неудовольствия
  choice: «отверг их, разгневанный»
  alternative: «презрел их» или «возгнушался ими»
  rationale: Формулировка сохраняет серьёзность Божьего суда и причинную связь с поведением Его сыновей и дочерей, не усиливая значение сверх данных еврейского текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «И» сохранён для связи с контекстом песни; порядок слов слегка приближен к еврейскому, но остаётся естественным для русского читателя.
