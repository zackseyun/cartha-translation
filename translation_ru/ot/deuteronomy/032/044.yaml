  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: ru
  text: И пришёл Моисей и произнёс перед народом все слова этой песни — он и Осия[a], сын Нуна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Осия»; в других местах этот человек обычно назван Иисусом Навином (см. Чис. 13:16).'
    reason: Поясняет исходную форму имени и её отличие от более привычного имени того же человека.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא в данной повествовательной форме обычно означает «прийти»; перевод сохраняет переход к следующему событию, не уточняя направление сверх сказанного в тексте.
- source_word: וַיְדַבֵּר
  choice: произнёс
  rationale: Форма глагола דבר обозначает речевое действие. «Произнёс» естественно сочетается с последующим «все слова этой песни» и передаёт публичное устное оглашение без добавления особой риторической силы.
- source_word: אֶת כָּל דִּבְרֵי
  choice: все слова
  rationale: Перевод прямо передаёт полноту, выраженную сочетанием כָּל דִּבְרֵי, не сводя отдельные слова к более общему понятию «содержание» или «весть».
- source_word: הַשִּׁירָה הַזֹּאת
  choice: этой песни
  rationale: Слово שִׁירָה означает «песня» и в контексте относится к песни Моисея; вариант «поэма» возможен, но менее непосредственно отражает обозначение текста.
- source_word: בְּאָזְנֵי הָעָם
  choice: вслух перед народом
  rationale: Буквально выражение значит «в уши народа». Русская идиома «вслух перед народом» сохраняет смысл публичного устного произнесения и звучит естественно.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение сохранено в заключительном присоединении «он и Осия», чтобы не устранять необычную структуру еврейской фразы.
- source_word: וְהוֹשֵׁעַ
  choice: и Осия
  rationale: В масоретском тексте употреблено имя הוֹשֵׁעַ — «Осия», а не более привычная форма имени этого человека «Иисус»; перевод следует форме исходного текста.
- source_word: בִּן נוּן
  choice: сын Навина
  rationale: Патронимическое выражение передано в принятой русской библейской форме «сын Навина», которая ясно отождествляет лицо и не изменяет содержания конструкции.
theological_decisions:
- issue: Передача имени спутника Моисея как «Осия» или как более привычного «Иисус Навин»
  choice: Осия
  alternative: Иисус
  rationale: Еврейский текст данного стиха прямо содержит форму הוֹשֵׁעַ. Поэтому имя не гармонизировано с более известной формой יְהוֹשֻׁעַ; различие открыто пояснено в сноске.
- issue: Синтаксическая связь слов «он и Осия» с предшествующими действиями
  choice: Сохранить заключительное присоединение «он и Осия»
  alternative: Перестроить как «Моисей вместе с Осией пришли и произнесли»
  rationale: В еврейском тексте глаголы стоят в единственном числе при Моисее, после чего добавлено «он и Осия». Перевод сохраняет эту напряжённую структуру и не решает без основания, в одинаковой ли мере оба лица совершали каждое из названных действий.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Выражение «вслух перед народом» естественно передаёт еврейскую идиому, а тире позволяет сохранить необычное заключительное присоединение «он и Осия» без чрезмерного сглаживания синтаксиса.
