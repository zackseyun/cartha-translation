revisions:
- from: Когда[a] Я наточу Мой сверкающий меч[b] и рука Моя возьмётся за суд, Я обращу возмездие на Моих врагов и воздам ненавидящим Меня.
  to: Когда[a] Я наточу Мой сверкающий меч[b] и рука Моя возьмётся вершить суд, Я воздам Моим врагам возмездием и воздам ненавидящим Меня.
  rationale: 'Сделаны две стилистико-семантические правки: действие возмездия передано естественной русской конструкцией «воздам ... возмездием», а образ руки, берущейся за суд, — как «возьмётся вершить суд». Временная/условная неоднозначность אִם и буквальный образ «молнии меча» сохранены в сносках.'
  reviewer_model: gpt-5.6-terra
