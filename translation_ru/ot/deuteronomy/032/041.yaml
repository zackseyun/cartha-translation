  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: ru
  text: Когда[a] Я наточу Мой сверкающий меч[b] и рука Моя возьмётся вершить суд, Я воздам Моим врагам возмездием и воздам ненавидящим Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если».'
    reason: Еврейское אִם может иметь как условное, так и временное значение.
  - marker: b
    text: 'Буквально: «молнию Моего меча».'
    reason: Сноска сохраняет необычную поэтическую метафору исходного текста, переданную в основном тексте естественным русским выражением.
lexical_decisions:
- source_word: אִם
  choice: Когда
  rationale: В данном поэтическом контексте вводит момент будущего действия; русское «когда» естественно связывает условно-временную придаточную часть с последующим обещанием воздаяния. Возможное условное значение сохранено в сноске.
- source_word: שַׁנּוֹתִי
  choice: Я наточу
  rationale: Форма от שׁנן передаёт действие затачивания оружия; выбран прямой и понятный русский глагол.
- source_word: בְּרַק חַרְבִּי
  choice: Мой сверкающий меч
  rationale: Буквально выражение означает «молнию Моего меча». Передача через «сверкающий меч» сохраняет образ ослепительного блеска клинка и звучит естественно по-русски; буквальная метафора указана в сноске.
- source_word: מִשְׁפָּט
  choice: суд
  rationale: Слово охватывает суд, судебное решение и правосудие. «Взяться за суд» сохраняет сжатый образ еврейского текста, не уточняя сверх источника способ исполнения суда.
- source_word: אָשִׁיב נָקָם
  choice: Я обращу возмездие
  rationale: Сохраняет направленность действия к противникам и судебный оттенок נָקָם; буквальное «верну месть» в современном русском звучало бы неестественно.
- source_word: אֲשַׁלֵּם
  choice: воздам
  rationale: Передаёт идею полного ответного воздаяния и естественно сочетается с объектом «ненавидящим Меня».
theological_decisions:
- issue: Условное или временное прочтение אִם
  choice: 'Основной текст: «Когда»'
  alternative: «Если»
  rationale: В контексте торжественного заявления о грядущем суде временное прочтение естественно, однако еврейская частица допускает условное значение, поэтому оно отмечено в сноске.
- issue: Характер Божьего ответа противникам
  choice: «возмездие» и «воздам»
  alternative: «месть» и «отплачу»
  rationale: Выбранные слова сохраняют суровость высказывания, но также его контекст суда; они не смягчают действие и не приписывают ему человеческую мстительность.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Заглавные формы местоимений, относящихся к Богу, использованы последовательно. Сжатый параллелизм исходного стиха сохранён без конфессиональных уточнений.
