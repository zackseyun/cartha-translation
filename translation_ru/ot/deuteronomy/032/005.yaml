  source_fidelity: Основной смысл передан, но «это их порок» превращает сжатое מוּמָם («их изъян/порок») в самостоятельное разъяснительное утверждение и тем самым чрезмерно закрепляет синтаксическую связь. «С Ним» возможно, однако «по отношению к Нему» точнее передаёт неопределённое отношение, выраженное לֹו, не сводя его к оттенку совместности.
  naturalness: Текст в целом литературен, но «они не Его дети — это их порок» звучит как современное логическое пояснение, а не как намеренно сжатая поэтическая строка. Предлагаемая редакция сохраняет сжатость, оставаясь понятной.
  terminology: «Поколение» уместно. «Кривое и извращённое» сохраняет образную пару עִקֵּשׁ וּפְתַלְתֹּל; «извращённое» здесь относится к нравственной искривлённости, а не к специальному современному значению. Личные местоимения, относящиеся к Богу, сохранены с прописной буквы согласно принятой русской библейской орфографии.
