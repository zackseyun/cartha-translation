  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: ru
  text: Они поступили по отношению к Нему порочно[a]; они не Его дети — их собственный изъян[b]. Они — поколение кривое и извращённое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская строка трудна и предельно сжата. Первую фразу можно понять и так: «Они развратили себя»; отношение к Нему также передают как «против Него».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «их порок» или «их ущербность». Синтаксическая связь этих слов с предыдущими выражениями не вполне ясна; возможно и понимание: «не Его дети из-за своего изъяна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: поступили порочно
  rationale: Порода пиэль выражает порочное, губительное действие. Такой перевод сохраняет глагольную силу и не навязывает возвратное значение.
- source_word: לוֹ
  choice: с Ним
  rationale: 'Предлог с местоименным суффиксом в этой сжатой строке допускает разные оттенки отношения к Богу. «С Ним» естественно по-русски и не уточняет чрезмерно: «для Него» или «против Него».'
- source_word: לֹא בָּנָיו
  choice: они не Его дети
  rationale: Именное предложение передано с добавлением связки, необходимой для естественного русского синтаксиса. Временной оттенок «больше не» в еврейском тексте прямо не выражен.
- source_word: מוּמָם
  choice: это их порок
  rationale: מוּם означает изъян, недостаток или порок. Здесь «порок» естественно передаёт нравственный смысл, а указательное «это» связывает сжатую фразу с отрицанием сыновства, не превращая связь в однозначно причинную.
- source_word: דּוֹר
  choice: поколение
  rationale: Обычное и точное соответствие в поэтическом и заветном контексте.
- source_word: עִקֵּשׁ
  choice: строптивое
  rationale: Слово обозначает искривлённость и нравственную испорченность. «Строптивое» сохраняет характеристику упрямого уклонения и соответствует достоинству библейской поэзии.
- source_word: וּפְתַלְתֹּל
  choice: извращённое
  rationale: Редкое прилагательное усиливает образ нравственной искривлённости. «Извращённое» понятно современному читателю и не сливает полностью значение с предыдущим эпитетом.
theological_decisions:
- issue: Означает ли לֹא בָּנָיו утрату заветного сыновства или отрицание сыновнего характера
  choice: они не Его дети
  alternative: они больше не Его дети; они Ему не дети
  rationale: Еврейская фраза резко отрицает сыновство, но не содержит явного временного показателя. Перевод сохраняет напряжённость текста, не формулируя сверх него учение об утрате заветного статуса.
- issue: Синтаксическая связь в сжатой первой строке
  choice: Они поступили с Ним порочно; они не Его дети — это их порок.
  alternative: Они развратили себя; они не Его дети — на них порок; Они поступили против Него порочно — не Его дети, а собственный их позор
  rationale: Строка трудна и допускает несколько разборов. Основной текст следует масоретской огласовке и сохраняет сжатость; действительная неоднозначность отмечена в сноске без конъектуры.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены резкость отрицания и синтаксическая напряжённость оригинала; архаизмы и конфессионально обусловленные уточнения не вводятся.
