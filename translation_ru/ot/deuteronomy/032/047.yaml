source:
  edition: WLC
  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: ru
  text: Ведь это для вас не пустое слово[a], но сама ваша жизнь[b], и благодаря этому слову вы долго проживёте на земле, чтобы, перейдя Иордан, овладеть ею[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пустое дело»; «не нечто ничтожное».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ваши жизни»; еврейская форма множественного числа здесь может обозначать жизнь как единое понятие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «туда, чтобы вступить во владение ею»; возможно также: «чтобы получить её в наследие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: пустое слово
  rationale: Сохраняет конкретный образ еврейского выражения и передаёт смысл чего-то тщетного, бессодержательного или незначительного; в контексте речь идёт о только что возвещённом наставлении.
- source_word: מִכֶּם
  choice: для вас
  rationale: 'Предлог מן здесь естественно понимать идиоматически: это слово не пусто по отношению к Израилю, то есть не является пустым или незначительным для него.'
- source_word: חַיֵּיכֶם
  choice: сама ваша жизнь
  rationale: Формально множественное חַיִּים обычно употребляется как отвлечённое существительное «жизнь». Частица «сама» по-русски подчёркивает противопоставление пустому слову, не добавляя нового содержания.
- source_word: וּבַדָּבָר הַזֶּה
  choice: благодаря этому слову
  rationale: Предлог ב передаёт средство или основание. Повтор «слово» сохраняет связь с דָבָר в первой части стиха.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: вы долго проживёте
  rationale: Это естественный современный русский эквивалент идиомы «удлините дни»; буквальный образ по-русски звучал бы неестественно.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: Передаёт территориальный смысл обетованной земли и сохраняет обычное для Второзакония выражение.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: перейдя Иордан
  rationale: Причастная форма обозначает предстоящее и уже определённое действие. Русский деепричастный оборот ясно связывает переход с целью овладеть землёй.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: которой идёте овладеть
  rationale: שָׁמָּה указывает направление «туда», а ירשׁ означает вступить во владение, овладеть или получить в наследие. Формулировка естественна по-русски и сохраняет целевое значение.
theological_decisions:
- issue: Связь Божьего слова, жизни и длительного пребывания в земле
  choice: Стих представляет возвещённое слово как жизнь Израиля и как средство долгой жизни в земле.
  alternative: Считать выражение лишь риторической похвалой важности наставления без заветных последствий.
  rationale: Параллельные утверждения «сама ваша жизнь» и «благодаря этому слову вы долго проживёте» прямо связывают верность возвещённому слову с жизнью народа в земле, не требуя привнесения более поздних богословских систем.
- issue: Значение ירשׁ применительно к земле
  choice: овладеть
  alternative: унаследовать
  rationale: Глагол допускает оба оттенка. «Овладеть» лучше передаёт предстоящее вступление Израиля во владение землёй, тогда как вариант «получить её в наследие» сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Идиома תַּאֲרִיכוּ יָמִים передана естественно («долго проживёте»), а повтор ключевого слова דָבָר сохранён. Порядок заключительных компонентов слегка перестроен ради ясного русского синтаксиса.
