base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: ru
  text: 'Ведь их лоза — от лозы Содома,

    от полей Гоморры;

    их виноград — ядовитый виноград,

    их гроздья горьки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִגֶּפֶן סְדֹם גַּפְנָם
  choice: их лоза — от лозы Содома
  rationale: Сохраняет повтор образа «лоза / лоза» и исходное значение происхождения, выраженное предлогом מִן.
- source_word: שַׁדְמֹת
  choice: поля
  rationale: Обычное современное соответствие для возделываемых полей; естественно сочетается с образом виноградной лозы.
- source_word: עִנְּבֵי רוֹשׁ
  choice: ядовитый виноград
  rationale: רוֹשׁ обозначает ядовитое или горькое растение/вещество; «ядовитый» ясно передаёт губительный смысл, не вводя спорной ботанической идентификации.
- source_word: אַשְׁכְּלֹת מְרֹרֹת לָמוֹ
  choice: гроздья их горьки для них
  rationale: Передаёт и именную конструкцию, и местоименное לָמוֹ «для них», сохранённое в масоретском тексте.
theological_decisions:
- issue: Референт местоимения «их» и метафорический смысл лозы
  choice: Сохранить местоимения и образ без поясняющей конкретизации
  alternative: Назвать прямо народ или его дела/плоды
  rationale: Стих зависит от контекста, а исходный текст не раскрывает метафору внутри самого стиха; конкретизация сузила бы возможный смысл.
- issue: Функция לָמוֹ в заключительной строке
  choice: «для них»
  alternative: 'Опустить местоимение: «гроздья их горьки»'
  rationale: Явное местоименное дополнение присутствует в WLC; его сохранение удерживает напряжение текста и не решает заранее, означает ли выражение принадлежность, переживаемое последствие или оценку.
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом. Синтаксис краткий и торжественный, но без архаизмов; строки отражают структуру еврейского стиха.
