lexical_decisions:
- source_word: ל֥וּ
  choice: Если бы
  rationale: Частица выражает не простое условие, а сожаление и пожелание; в русском условное наклонение естественно передаёт этот оттенок.
- source_word: חָכְמ֖וּ
  choice: они были мудры
  rationale: Форма от חכם обозначает обладание мудростью или её проявление; сочетание «были мудры» естественно связано с пожеланием, выраженным לוּ.
- source_word: יַשְׂכִּ֣ילוּ
  choice: поняли бы
  rationale: Hифиль от שׂכל может означать понимание или разумное действие; здесь в параллелизме с בין преобладает познавательный смысл.
- source_word: זֹ֑את
  choice: это
  rationale: Сохранено единственное число указательного местоимения, отсылающего к сказанному ранее.
- source_word: יָבִ֖ינוּ
  choice: уразумели бы
  rationale: Глагол בין означает различить, постичь или осознать; отдельный русский глагол сохраняет поэтический параллелизм, не сливая его с שׂכל.
- source_word: לְאַחֲרִיתָם
  choice: свой конец
  rationale: אַחֲרִית может обозначать конец, итог или дальнейшую участь. «Свой конец» кратко передаёт предупреждающий смысл, а возвратное местоимение естественно для русского языка при совпадении субъекта и обладателя.
theological_decisions:
- issue: Значение אַחֲרִיתָם в контексте
  choice: свой конец
  alternative: свою будущую участь; то, что ожидает их впоследствии
  rationale: Контекст песни говорит об исходе и последствиях, которые им следовало бы осознать. Перевод «конец» сохраняет судебно-предупреждающую силу, но сноска отмечает более широкий временной смысл слова.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью. Условное наклонение передаёт оттенок сожаления; два разных глагола — «поняли» и «уразумели» — сохраняют параллелизм исходного текста.
