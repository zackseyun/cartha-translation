  verdict: revise
  source_fidelity: 'Основной смысл передан верно: причинное «за то, что» повторено, нарушение верности направлено против Бога, дважды сохранено «среди сынов Израиля», а географическая привязка и название пустыни переданы точно. Однако «не явили Мою святость» несколько смещает прямой смысл piel קדשׁ с Бога как объекта («не почтили/не признали Меня святым») к абстрактному проявлению свойства.'
  naturalness: «Нарушили верность Мне» понятно, но для современного литературного русского менее естественно, чем «оказались неверны Мне». «Не почтили Меня как Святого» ясно и естественно передаёт публичное признание Божьей святости.
  terminology: «Сыны Израиля», «Мерива-Кадес», «пустыня Цин» сохранены последовательно и в подходящем библейском регистре. Сноска к топониму уместна; её варианты уточнены без изменения смысла.
  issues:
  - severity: low
    issue: «Нарушили верность Мне» — не вполне идиоматичная коллокация.
    rationale: Глагол מעל обозначает нарушение верности по отношению к Богу. «Оказались неверны Мне» сохраняет этот смысл и звучит естественнее.
  - severity: medium
    issue: «Не явили Мою святость» не вполне прямо передаёт «не освятили Меня / не почтили Меня как Святого».
    rationale: В еврейском тексте объектом глагола является «Меня». Формулировка «не почтили Меня как Святого» сохраняет направленность действия на Бога и его публично-реляционный смысл, не предполагая, что люди создают Божью святость.
  revised_text: за то, что вы оказались неверны Мне среди сынов Израиля у вод Меривы-Кадеса[a], в пустыне Цин, за то, что не почтили Меня как Святого среди сынов Израиля.
