base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: ru
  text: за то, что вы оказались неверны Мне среди сынов Израиля у вод Меривы-Кадеса[a], в пустыне Цин, за то, что не почтили Меня как Святого среди сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у вод Распри в Кадесе»; также возможно: «у вод Меривы в Кадесе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: нарушили верность Мне
  rationale: Глагол מעל с предлогом ב обозначает вероломное нарушение обязательств по отношению к Богу. Формулировка сохраняет оттенок измены доверию и естественна в современном русском языке.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: среди сынов Израиля
  rationale: Буквально передаёт устойчивое еврейское обозначение народа и сохраняет повтор одной и той же фразы в стихе.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: у вод Меривы-Кадеса
  rationale: Сочетание передано как географическое название, связанное с известным событием; возможный нарицательный смысл слова מְרִיבָה отмечен в сноске.
- source_word: מִדְבַּר צִן
  choice: в пустыне Цин
  rationale: Обычная и понятная русская передача географического обозначения; «пустыня» здесь естественнее, чем «дикая местность».
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: не явили Мою святость
  rationale: Порода piel глагола קדשׁ в данном контексте выражает публичное признание или проявление Божьей святости. Выбор не предполагает, будто люди способны сделать Бога святым.
theological_decisions:
- issue: Смысл קִדַּשְׁתֶּם אֹתִי
  choice: не явили Мою святость
  alternative: не освятили Меня; не почтили Меня как Святого
  rationale: Формулировка передаёт публичный характер проступка Моисея и Аарона перед Израилем, не создавая впечатления, что Божья внутренняя святость зависит от человеческого действия.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Сохранена явная образность исходного выражения и его двукратный повтор; это также соответствует достоинству библейского регистра.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический повтор «за то, что… за то, что…» сохранён как значимый элемент еврейского текста. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
