lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: возбуждали в нём ревность
  rationale: 'Порода hифиль глагола קנא с местоименным дополнением 3-го лица мужского рода передаёт причинное значение: они вызывали в нём ревность. Формулировка сохраняет антропопатический язык заветных отношений и естественно звучит по-русски.'
- source_word: בְּזָרִים
  choice: чужими
  rationale: Субстантивированное זָרִים буквально означает «чужие, посторонние, иноземные». Поскольку слово «боги» в еврейском тексте стиха отсутствует, основной текст сохраняет намеренную недосказанность, а контекстуальное понимание поясняется в сноске.
- source_word: בְּתוֹעֵבֹת
  choice: мерзостями
  rationale: תּוֹעֵבָה обозначает нечто отвратительное, вызывающее отвращение, особенно часто — в контексте идолопоклонства. «Мерзости» сохраняет вес и обличительный характер исходного слова.
- source_word: יַכְעִיסֻהוּ
  choice: вызывали его гнев
  rationale: Hифиль глагола כעס означает «приводить в гнев, вызывать гнев». Выбранная формулировка передаёт причинное значение и образует естественный поэтический параллелизм с первой строкой.
theological_decisions:
- issue: Следует ли прямо назвать זָרִים чужими богами
  choice: В основном тексте оставить буквальное «чужими»
  alternative: «чужими богами» или «иноземными богами»
  rationale: Контекст песни ясно указывает на идолопоклонство, однако существительное «боги» в данном стихе не выражено. Буквальный вариант сохраняет неоднозначность исходного текста, а вероятный контекстуальный смысл приводится в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с обычной современной редакционной практикой; две строки сохраняют параллелизм еврейской поэзии.
