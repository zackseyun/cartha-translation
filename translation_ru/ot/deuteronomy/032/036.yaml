  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: ru
  text: Ибо Яхве вступится за Свой народ[a] и сжалится над Своими рабами[b], когда увидит, что сила их иссякла[c] и не осталось никого — ни раба, ни свободного[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет судить Свой народ». В данном контексте речь, вероятно, идёт о суде в пользу народа, то есть о защите его права.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изменит решение о Своих рабах». Еврейский глагол может означать как перемену намерения, так и сострадание.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «рука иссякла»; «рука» здесь означает силу или способность действовать.'
    reason: lexical_alternative
  - marker: d
    text: Буквально еврейская пара означает примерно «удержанный и отпущенный (или оставленный)». Вероятно, это выражение означает «раб и свободный» или, шире, «вообще никто».
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: вступится за
  rationale: Глагол דין может означать «судить», «вершить суд» или «защищать право, оправдывать». Параллель со состраданием и контекст полного бессилия народа указывают здесь на судебное действие в его пользу; «вступится за» естественно передаёт этот смысл по-русски, не устраняя возможного значения «будет судить».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Сохраняет собирательный и заветный смысл выражения; возвратное притяжательное местоимение естественно в русском предложении.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: и сжалится над Своими рабами
  rationale: Форма נחם с предлогом על может выражать как сожаление и перемену решения, так и сострадание. В данном контексте «сжалится» ясно передаёт милосердный поворот к Божьим рабам, а альтернативный оттенок отмечен в сноске.
- source_word: כִּי יִרְאֶה
  choice: когда увидит
  rationale: 'Первое כִּי вводит основание («ибо»), а второе естественно понимать как временно-причинное обстоятельство: сострадание проявляется, когда Яхве видит полное бессилие народа.'
- source_word: אָזְלַת יָד
  choice: сила их иссякла
  rationale: Буквально говорится, что «рука исчезла/иссякла»; «рука» здесь является образом силы или способности действовать. Русский перевод передаёт смысл идиомы.
- source_word: וְאֶפֶס
  choice: и не осталось никого
  rationale: אפס обозначает отсутствие или прекращение; перед последующей парой лиц естественно передаётся как полное отсутствие кого-либо.
- source_word: עָצוּר וְעָזוּב
  choice: ни раба, ни свободного
  rationale: Трудная парная формула буквально близка к «удержанному и отпущенному/оставленному». Вероятно, это меризм, охватывающий всех без исключения; «ни раба, ни свободного» ясно передаёт принятое контекстуальное понимание, а буквальная неоднозначность сохранена в сноске.
theological_decisions:
- issue: Характер действия Яхве по отношению к Своему народу
  choice: Яхве вступится за народ и проявит к нему сострадание.
  alternative: Яхве будет судить Свой народ, а затем изменит решение о Своих рабах.
  rationale: Параллелизм со словами о сострадании и пояснение о полном бессилии народа поддерживают благоприятный, восстановительный смысл судебного действия. При этом сноски сохраняют лексическую возможность перевода «будет судить» и «изменит решение», не снимая напряжения между судом и милостью.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, достойным библейского текста регистром. Синтаксис остаётся ясным для обычного читателя; личное имя «Яхве» и слово «рабы» сохраняют ключевые особенности исходного текста. Все существенные лексические неоднозначности вынесены в сноски.
