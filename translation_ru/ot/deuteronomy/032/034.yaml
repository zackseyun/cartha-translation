  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: ru
  text: Не сокрыто ли это у Меня, не запечатано ли в Моих хранилищах?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сбережено ли это у Меня, не запечатано ли в Моих сокровищницах?»'
    reason: Лексические варианты для כָּמֻס и בְּאוֹצְרֹתָי.
lexical_decisions:
- source_word: הֲלֹא
  choice: не… ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: הוּא
  choice: это
  rationale: Местоимение мужского рода в еврейском тексте обобщённо отсылает к сказанному ранее; русское «это» сохраняет неопределённость точного антецедента и не превращает его в лицо.
- source_word: כָּמֻס
  choice: сокрыто
  rationale: Страдательное причастие означает нечто скрытое или сбережённое про запас. «Сокрыто» передаёт основной смысл и сохраняет возвышенный, но понятный регистр.
- source_word: עִמָּדִי
  choice: у Меня
  rationale: В данном контексте естественно выражает нахождение во владении и под хранением говорящего; буквальное «со Мной» по-русски звучало бы менее ясно.
- source_word: חָתֻם
  choice: запечатано
  rationale: Прямо передаёт образ предмета, закрытого печатью и надёжно сохранённого.
- source_word: בְּאוֹצְרֹתָי
  choice: в Моих хранилищах
  rationale: אוֹצָר может обозначать сокровищницу или хранилище. «Хранилищах» согласуется с образами сокрытия и запечатывания, не сужая смысл до денежных сокровищ.
theological_decisions:
- issue: К чему относится хранимое и запечатанное
  choice: Безлично-обобщающее «это», отсылающее к предшествующему содержанию без уточнения его природы
  alternative: Личное «он» либо конкретизация как записи вины или уготованного суда
  rationale: Еврейское הוּא грамматически имеет мужской род, однако точный антецедент остаётся неявным. «Это» сохраняет контекстуальную и богословскую неоднозначность, не навязывая персонализацию или конкретное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Параллелизм двух риторических конструкций «не… ли» отражает устройство еврейской строки. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
