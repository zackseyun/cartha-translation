  text: וַ/תָּבֹ֖אוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ חֶ֠שְׁבּוֹן וְ/ע֨וֹג מֶֽלֶךְ הַ/בָּשָׁ֧ן לִ/קְרָאתֵ֛/נוּ לַ/מִּלְחָמָ֖ה וַ/נַּכֵּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: ru
  text: Когда вы пришли на это место[a], Сихон, царь Хешбона, и Ог, царь Башана, вышли нам навстречу, чтобы сразиться с нами, и мы разбили их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вы пришли на это место». Еврейская повествовательная форма допускает как простое присоединение следующего события, так и передачу временной связи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и мы поразили их»; в военном контексте этот глагол часто означает нанесение поражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: Когда вы пришли
  rationale: Форма повествовательного прошедшего времени обращена ко всему народу. «Когда» естественно передаёт временную связь с последующим событием, тогда как буквальное сочинение сохранено в сноске.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: на это место
  rationale: Обычное современное русское сочетание с глаголом «прийти»; מָקוֹם означает «место».
- source_word: וַיֵּצֵא
  choice: вышли
  rationale: יצא буквально означает «выйти». В русском сказуемое поставлено во множественном числе по двум однородным подлежащим — Сихону и Огу; это не добавляет значения «выступили походом».
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Сихон, царь Хешбона
  rationale: Имена переданы в принятой русской библейской форме; приложение обособлено по нормам современного русского языка.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: и Ог, царь Башана
  rationale: Сохранена параллельная структура царского титула и географическое имя.
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: нам навстречу, чтобы сразиться с нами
  rationale: לִקְרָאתֵנוּ обозначает движение навстречу, а לַמִּלְחָמָה уточняет враждебную, военную цель. Формулировка естественна по-русски и не усиливает глагол до «двинулись походом».
- source_word: וַנַּכֵּם
  choice: и мы разбили их
  rationale: Военный контекст указывает на поражение противника. «Разбили» передаёт результат естественнее, чем двусмысленное в современном русском «поразили», при этом буквальный образ отмечен в сноске.
