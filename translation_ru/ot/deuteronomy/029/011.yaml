base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: ru
  text: чтобы ты вступил в завет Яхве, твоего Бога, и принял на себя его клятвенное обязательство[a], которые Яхве, твой Бог, заключает с тобой сегодня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и принял на себя его клятвенное проклятие». Еврейское слово может обозначать клятву, включающую установленные заветом санкции или проклятия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «режет с тобой сегодня». «Резать завет» — древнееврейское выражение, означающее заключение завета.'
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: чтобы ты вступил
  rationale: Инфинитив с לְ выражает цель в связи с предшествующим созывом народа. В сочетании с בְּרִית глагол עבר обозначает вступление в заветные обязательства, а не буквальное перемещение.
- source_word: בִּבְרִית
  choice: в завет
  rationale: При русском глаголе «вступить» естественно управление «в завет»; בְּרִית передано традиционным и точным словом «завет».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога / твой Бог
  rationale: Суффикс второго лица мужского рода единственного числа передан притяжательной конструкцией; падеж согласован с русским синтаксисом.
- source_word: וּבְאָלָתוֹ
  choice: и связал себя его клятвой[a]
  rationale: אָלָה может обозначать клятву с подразумеваемыми санкциями или проклятием. Русская формулировка передаёт принятие обязательства и избегает неестественного «вступил в клятву»; оттенок проклятия сохранён в сноске.
- source_word: כֹּרֵת עִמְּךָ
  choice: заключает с тобой этот завет
  rationale: Буквальное «режет с тобой» является древнееврейской идиомой заключения завета. В русском употреблена естественная эквивалентная формула.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и точный эквивалент временного наречия.
theological_decisions:
- issue: Передача имени יהוה в формуле завета
  choice: Яхве, твой Бог
  alternative: Господь, твой Бог
  rationale: Исходный текст непосредственно употребляет личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: 'Смысл אָלָה: клятва или проклятие'
  choice: его клятвой
  alternative: его проклятием / клятвой с её проклятиями
  rationale: Основной текст сохраняет более широкое значение «клятва», не исключая содержащихся в ней заветных санкций; этот существенный оттенок указан в сноске.
- issue: Отнесение אשר ... כרת к сочетанию завета и клятвы
  choice: когда Яхве, твой Бог, заключает с тобой этот завет
  alternative: которые Яхве, твой Бог, заключает с тобой
  rationale: Русская формулировка избегает грамматически неестественного «заключать клятву», при этом представляет клятву как часть совершаемого сегодня заключения завета.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным заветным регистром. Повтор «Яхве, твой Бог» сохранён вслед за древнееврейским текстом. Маркеры сносок поставлены при тех выражениях, которые они поясняют.
