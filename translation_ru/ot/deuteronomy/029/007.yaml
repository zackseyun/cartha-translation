  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: ru
  text: и взяли их землю и отдали её в наследие колену Рувима, колену Гада и половине колена Манассии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово буквально означает «манассиец»; здесь этникон в единственном числе употреблён в собирательном значении — о колене Манассии.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: и взяли
  rationale: Форма wayyiqtol, 1-е лицо множественного числа от לקח, передаёт последовательное повествовательное действие. «Взяли» точно отражает обычное значение глагола, не усиливая его до «захватили».
- source_word: אַרְצָם
  choice: их землю
  rationale: Существительное אֶרֶץ с местоименным суффиксом 3-го лица множественного числа обозначает территорию ранее упомянутых царей; «землю» естественно и точно в данном контексте.
- source_word: וַנִּתְּנָהּ
  choice: и отдали её
  rationale: Форма wayyiqtol от נתן с суффиксом женского рода отсылает к «земле». «Отдали» естественно выражает передачу земли получателям, сохраняя прямое значение глагола.
- source_word: לְנַחֲלָה
  choice: в наследие
  rationale: נַחֲלָה обозначает наследственное владение или земельный удел. «В наследие» сохраняет смысл передаваемого племенного владения и звучит ясно в современном русском языке.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: колену Рувима, колену Гада
  rationale: Еврейские этниконы в единственном числе имеют собирательное значение и обозначают соответствующие племенные общности. Русское «колену Рувима/Гада» естественно передаёт этот смысл.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: и половине колена Манассии
  rationale: חֲצִי שֵׁבֶט буквально означает «половина колена», а этникон הַמְנַשִּׁי указывает на Манассию. Основной текст передаёт это естественной русской формой; морфологическая особенность отмечена в сноске.
