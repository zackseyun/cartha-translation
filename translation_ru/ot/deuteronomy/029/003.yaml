source:
  edition: WLC
  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: ru
  text: Но Яхве до сего дня не дал вам сердца, чтобы знать, глаз, чтобы видеть, и ушей, чтобы слышать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Яхве до сего дня не дал вам сердца, чтобы знать, и глаз, чтобы видеть, и ушей, чтобы слышать».'
    reason: Союз וְ можно передать нейтральным «и», а повторяющиеся союзы — сохранить во всех членах перечисления.
lexical_decisions:
- source_word: וְלֹא
  choice: Но ... не
  rationale: Союз продолжает речь и одновременно подчёркивает контраст с предшествующим упоминанием того, что Израиль видел; в современном русском «но» естественно передаёт этот оттенок.
- source_word: נָתַן
  choice: не дал
  rationale: Еврейский перфект обозначает свершившийся факт, последствия которого сохраняются до указанного момента; сочетание с «до сего дня» ясно передаёт эту продолжающуюся реальность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: לֵב לָדַעַת
  choice: сердца, чтобы знать
  rationale: Сохраняется еврейский образ сердца как средоточия понимания и внутреннего расположения, а также прямое значение глагола ידע — «знать».
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: глаз, чтобы видеть
  rationale: Сохраняются конкретный образ и синтаксический параллелизм исходного текста.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: и ушей, чтобы слышать
  rationale: Сохраняются параллелизм и библейский образ слуха как подлинного восприятия.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое, достоинственное русское выражение точно обозначает состояние, продолжавшееся вплоть до настоящего для говорящего дня.
theological_decisions:
- issue: Божественное действие в отсутствии у Израиля понимания
  choice: Прямо сказано, что Яхве до этого дня не дал народу сердца, чтобы знать, глаз, чтобы видеть, и ушей, чтобы слышать.
  alternative: Понимать фразу в разрешительном смысле — что Яхве не позволил или не содействовал достижению такого понимания; либо считать её лишь указанием на состояние Израиля.
  rationale: Исходный текст явно приписывает недаяние Яхве. Перевод не смягчает это до одной лишь человеческой неспособности, но и не добавляет систематического объяснения соотношения Божьего владычества и человеческой ответственности.
translation_notes:
  register: Современный литературный русский с достоинственным библейским звучанием. Формула «до сего дня» слегка возвышенная, но общепонятная. Конкретные образы сердца, глаз и ушей сохранены; неоднозначность союза отмечена в сноске.
