  source_fidelity: 'Основной смысл передан верно: сохранены личное имя «Яхве», образ насильственного удаления с земли, тройное нагнетание гнева, изгнание в иную землю и заключительная временная формула. Однако «вырвал их из их земли» менее точно передаёт מֵעַל («с, с поверхности») и звучит по-русски несколько неестественно; предпочтительно «вырвал их с их земли».'
