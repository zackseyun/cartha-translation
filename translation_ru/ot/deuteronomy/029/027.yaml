  terminology: «Яхве» последовательно передаёт тетраграмматон. «Гнев, ярость и великое негодование» сохраняет триаду בְּאַף, בְּחֵמָה, בְּקֶצֶף גָּדוֹל без ненужного богословского истолкования. «Другая земля» сохраняет широту אֶרֶץ и не сужает её исключительно до современного понятия государства.
