base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: ru
  text: И вырвал их Яхве с их земли в гневе, ярости и великом негодовании и бросил их в другую землю, как это и поныне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как в этот день». Это устойчивое выражение указывает на положение, сохраняющееся и известное в момент речи: «как это и поныне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: вырвал их
  rationale: Глагол נתשׁ обозначает вырывание или исторжение, нередко с образом растений, вырванных из почвы. «Вырвал» сохраняет силу этого образа и естественно сочетается с последующим «из их земли».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: מֵעַל אַדְמָתָם
  choice: из их земли
  rationale: В контексте заветного суда и изгнания אֲדָמָה указывает на землю, которой они лишились; русский оборот «из их земли» естественнее буквального «с поверхности их земли».
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: в гневе, ярости и великом негодовании
  rationale: Сохранено накопление трёх близких по смыслу обозначений гнева. Разные русские слова передают риторическое усиление, а גָּדוֹל непосредственно отражено словом «великом».
- source_word: וַיַּשְׁלִכֵם
  choice: и бросил их
  rationale: שׁלך значит «бросать, швырять». «Бросил» сохраняет резкость образа суда и при этом остаётся естественным в современном русском.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: в другую землю
  rationale: Передаёт направленное перемещение и изгнание в иную страну или землю, не уточняя того, чего нет в исходном тексте.
- source_word: כַּיּוֹם הַזֶּה
  choice: как это и есть ныне
  rationale: Формула указывает на сохраняющееся и очевидное к моменту речи положение. «Ныне» поддерживает достоинство библейского регистра без смыслового затемнения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Накопление слов, обозначающих Божий гнев
  choice: в гневе, ярости и великом негодовании
  alternative: в гневе, ярости и великой злобе; в гневе и великой ярости
  rationale: Три еврейских существительных намеренно нагнетают выражение суда. Перевод не сводит их к одному понятию и не смягчает напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Образ насильственного вырывания сохранён; синтаксис сделан естественным для русского языка. Слово «ныне» выбрано как понятное и слегка возвышенное, но не архаически затемнённое.
