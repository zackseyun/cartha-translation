source:
  edition: WLC
  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: ru
  text: но и с тем, кто стоит сегодня здесь с нами перед Яхве, нашим Богом, и с тем, кого сегодня здесь с нами нет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова могут относиться к израильтянам, отсутствовавшим в собрании, к будущим поколениям или к тем и другим.
    reason: Сохраняется неопределённость круга людей, обозначенных выражением «кого сегодня здесь с нами нет».
lexical_decisions:
- source_word: כִּי
  choice: но и
  rationale: 'В связи с отрицанием в предыдущем стихе частица вводит противопоставление и расширение круга участников: «не только… но и…».'
- source_word: אֶת אֲשֶׁר
  choice: с тем, кто
  rationale: Предлог «с» восполнен из формулы заключения завета в предыдущем стихе; единственное число сохраняет распределительный характер еврейской конструкции.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: здесь с нами
  rationale: Конструкция выражает присутствие человека в собрании; перевод сохраняет пространственный и совместный оттенки.
- source_word: עֹמֵד
  choice: стоит
  rationale: Сохранён конкретный образ человека, стоящего перед Богом в собрании, без сведения его к более отвлечённому «присутствует».
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественный современный эквивалент временного указания; повтор сохранён в обеих частях стиха.
- source_word: לִפְנֵי
  choice: перед
  rationale: Кратко и точно передаёт пространственный и заветный смысл выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: нашим Богом
  rationale: Прямо передаёт существительное с местоименным суффиксом первого лица множественного числа.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ
  choice: и с тем, кого сегодня здесь с нами нет
  rationale: Зеркально соотнесено с первой частью и сохраняет неопределённость того, о ком именно говорится; русская конструкция «кого нет» естественно передаёт еврейское отрицание наличия.
theological_decisions:
- issue: Кого охватывают слова о тех, кого сегодня нет в собрании
  choice: Не уточнять референта и сохранить широкую формулировку
  alternative: Указать только отсутствующих современников либо только будущие поколения
  rationale: Еврейский текст не определяет, имеются ли в виду отсутствующие израильтяне, будущие поколения или обе группы; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Начальное «но и» намеренно опирается на «не только» предыдущего стиха. Повтор «сегодня здесь с нами» сохраняет риторический параллелизм оригинала.
