base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: ru
  text: И отделит его Яхве от всех колен Израиля на погибель, согласно всем проклятиям[a] завета, записанным в этой книге Закона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клятвенным проклятиям». Еврейское слово может обозначать проклятия завета, связанные с клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: И отделит его
  rationale: Порода hифиль глагола בדל с местоименным суффиксом передаёт отделение человека от сообщества. «Отделит его» сохраняет образ и естественно сочетается с последующим «от всех колен Израиля».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: לְרָעָה
  choice: на погибель
  rationale: В данном контексте רָעָה обозначает губительное последствие суда, а не нравственное зло. «На погибель» ясно выражает направленность наказания.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: от всех колен Израиля
  rationale: Предлог מִן обозначает отделение от всей совокупности колен Израиля.
- source_word: כְּכֹל
  choice: согласно всем
  rationale: Предлог כְּ выражает соответствие наказания записанным санкциям завета.
- source_word: אָלֹות
  choice: проклятиям
  rationale: В контексте завета אָלָה обозначает проклятия, которыми скреплена клятва; в основном тексте выбрано ясное русское «проклятия», а клятвенный оттенок отмечен в сноске.
- source_word: הַבְּרִית
  choice: завета
  rationale: «Завет» — точное и устоявшееся обозначение בְּרִית в библейском контексте.
- source_word: הַכְּתוּבָה
  choice: записанным
  rationale: Причастие женского рода единственного числа грамматически согласовано с אָלָה как собирательно осмысляемым существительным; по-русски множественное «записанным» естественно относится к «проклятиям».
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: в этой книге Закона
  rationale: סֵפֶר передано как «книга», а תּוֹרָה в данном корпусном обозначении — как «Закон»; порядок слов сделан естественным для современного русского языка.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; его транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл לְרָעָה в описании суда
  choice: на погибель
  alternative: во зло
  rationale: Контекст говорит о губительном наказании по проклятиям завета, а не приписывает Богу нравственное зло.
- issue: Клятвенный оттенок אָלוֹת
  choice: проклятиям с пояснением в сноске
  alternative: проклятиям, скреплённым клятвой
  rationale: Краткий основной текст остаётся понятным, а сноска сохраняет характерную для завета связь проклятия с клятвой без чрезмерного истолкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены порядок основных смысловых компонентов и юридико-заветная лексика исходного текста.
