  - marker: b
    text: 'Буквально: «всякий мужчина Израиля»; это выражение имеет распределительное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: стоите
  rationale: Причастная форма описывает собравшихся, которые сейчас предстоят перед Богом; русское настоящее время естественно передаёт эту сцену.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и точный эквивалент временного указания с сохранением его смыслового акцента.
- source_word: כֻּלְּכֶם
  choice: все вы
  rationale: Передаёт коллективную полноту обращения и сохраняет вынесенное вперёд местоименное ударение.
- source_word: לִפְנֵי
  choice: перед
  rationale: Кратко и естественно выражает нахождение в присутствии Бога в контексте заключения завета.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашим Богом
  rationale: Точно передаёт форму с притяжательным суффиксом; творительный падеж обусловлен русским управлением после «перед».
- source_word: רָאשֵׁיכֶם
  choice: ваши предводители
  rationale: Передаёт метафорическое значение «главы» естественным современным русским словом, не создавая телесного смысла; синтаксическая неоднозначность отмечена в сноске.
- source_word: שִׁבְטֵיכֶם
  choice: ваши племена
  rationale: Сохраняет прямое лексическое значение и масоретское членение как отдельный элемент перечня.
- source_word: זִקְנֵיכֶם
  choice: ваши старейшины
  rationale: Устойчивое и понятное обозначение старших общинных руководителей Израиля.
- source_word: שֹׁטְרֵיכֶם
  choice: ваши управители
  rationale: Передаёт административную функцию без чрезмерно узкого уточнения обязанностей.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: каждый мужчина Израиля
  rationale: Сохраняет дистрибутивную конструкцию с אִישׁ и её мужскую форму, не сглаживая её до общего «все израильтяне».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя; «Яхве» является принятой современной научной транслитерацией и не подменяет имя титулом.
- issue: Мужская форма в כֹּל אִישׁ יִשְׂרָאֵל
  choice: каждый мужчина Израиля
  alternative: весь Израиль; все израильтяне
  rationale: Перевод сохраняет явное אִישׁ («мужчина, муж») и дистрибутивную силу выражения. При этом не делается вывода, будто во всём собрании отсутствовали женщины и дети, которые названы далее.
- issue: Соотношение רָאשֵׁיכֶם и שִׁבְטֵיכֶם
  choice: ваши предводители, ваши племена
  alternative: главы ваших племён
  rationale: Масоретская акцентуация поддерживает чтение как двух элементов перечня, однако синтаксис допускает тесное соединение слов; альтернативное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены перечислительная структура, личное имя Бога и мужская форма заключительного выражения; неестественное буквальное «ваши главы» заменено ясным «ваши предводители», а неоднозначность отражена в сноске.
