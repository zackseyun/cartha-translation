  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: ru
  text: 'Сегодня все вы стоите перед Яхве, вашим Богом: главы ваших племён[a], ваши старейшины и ваши распорядители — все мужчины Израиля[b].'
  philosophy: optimal-equivalence
  footnotes:
