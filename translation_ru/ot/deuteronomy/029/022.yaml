source:
  edition: WLC
  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: ru
  text: Вся её земля — сера, соль и выжженная пустошь[a]; её не засевают, она ничего не взращивает, и никакая трава на ней не всходит — подобно разорению Содома и Гоморры, Адмы и Цевоима, которые Яхве низверг в своём гневе и ярости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сера и соль, горение». Еврейская именная конструкция кратко перечисляет признаки опустошённой земли; слово, переданное как «выжженная пустошь», буквально означает «горение» или «выжженное состояние».'
    reason: Сохраняет лексическую и синтаксическую неоднозначность שְׂרֵפָה, не вводя образ «пожарища» как отдельного события.
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: сера и соль
  rationale: Прямой современный эквивалент; сочетание обозначает опустошение и бесплодие земли.
- source_word: שְׂרֵפָה
  choice: сплошное пожарище
  rationale: Существительное обозначает горение либо выжженное огнём состояние. «Пожарище» естественно передаёт и образ огня, и результат разорения; «сплошное» выражает связь с כָל אַרְצָהּ, не превращая образ в отвлечённое действие.
- source_word: כָל אַרְצָהּ
  choice: вся её земля
  rationale: Сохранены всеобщность כָל, существительное «земля» и женский притяжательный суффикс. В русском бессвязочная именная конструкция передана с помощью тире.
- source_word: לֹא תִזָּרַע
  choice: её не засевают
  rationale: Безлично-пассивная русская конструкция естественно передаёт нифаль и описывает устойчивое состояние земли, не добавляя значения невозможности.
- source_word: וְלֹא תַצְמִחַ
  choice: она ничего не взращивает
  rationale: 'Каузативная форма сохраняет землю как подлежащее: она не производит никакой растительности. «Ничего» естественно восполняет подразумеваемый объект.'
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: и никакая трава на ней не всходит
  rationale: Передано буквально-идиоматическое значение появления растительности; «никакая трава» сохраняет отрицательную всеобщность כָּל при отрицании.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: как при низвержении ... которые ... низверг
  rationale: «Низвержение / низверг» сохраняет корневой повтор существительного и глагола הפך. Оборот «как при» по-русски естественно соотносит состояние земли с катастрофой городов.
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: Содома и Гоморры, Адмы и Цевоима
  rationale: Употреблены узнаваемые русские формы библейских топонимов с передачей начального צ как «ц» в имени Цевоим.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой научной русской транслитерацией, а не заменено титулом.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: в Своём гневе и ярости
  rationale: Два слова переданы раздельно, с сохранением нарастающей силы выражения; возвратное притяжательное местоимение естественно указывает на Яхве как субъект.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя יהוה. «Яхве» сохраняет его как имя и соответствует наиболее распространённой современной реконструкции, не подменяя его титулом.
- issue: Характер Божьего суда
  choice: в Своём гневе и ярости
  alternative: в Своём гневе; в пылу гнева
  rationale: Сохранены оба параллельных обозначения Божьего гнева без ослабления, слияния или дополнительного богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством и яркой пророческой образностью. Короткие параллельные отрицания передают ритм оригинала; архаизмы не используются. Форма «она — как при низвержении» намеренно сохраняет сжатость сравнения, не уточняя сверх текста механизм уподобления.
