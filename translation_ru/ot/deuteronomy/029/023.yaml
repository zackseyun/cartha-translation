    rationale: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה — эллиптический вопрос о причине/значении «жара великого гнева», а не сообщение или вопрос о моменте, когда гнев начал разгораться. Добавление глагола сужает и меняет смысл.
