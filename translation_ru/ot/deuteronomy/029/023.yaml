  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: ru
  text: 'И скажут все народы: «Почему Яхве так поступил с этой землёй? Почему этот великий жар гнева?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: И скажут
  rationale: Перфект с союзом в предсказательном контексте передаёт будущее действие; союз сохраняет связь с предшествующим описанием.
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: В контексте Второзакония речь идёт о чужих народах, которые увидят постигшее землю бедствие.
- source_word: עַל מֶה
  choice: Почему
  rationale: Естественная русская передача идиоматического вопроса о причине.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Яхве так поступил
  rationale: Сочетание עשה с ככה означает «сделать так»; «так поступил» естественно описывает действие по отношению к земле.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לָאָרֶץ הַזֹּאת
  choice: с этой землёй
  rationale: Здесь אָרֶץ — земля завета, подвергшаяся суду; русское управление «поступить с» требует предлога «с».
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: Почему разгорелся этот великий гнев?
  rationale: Передаёт вопрос о причине и сохраняет образ жара через глагол «разгорелся», избегая тяжеловесного буквального сочетания «жар гнева».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Два параллельных вопроса сохранены; метафора жара гнева естественно выражена глаголом «разгорелся».
