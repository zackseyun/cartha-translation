  terminology: «Яхве» последовательно передаёт тетраграмматон. «Земля» уместна для הארץ в заветном контексте. «Жар гнева» сохраняет образ חֳרִי הָאַף, не превращая его в утверждение о том, что гнев именно «разгорелся».
