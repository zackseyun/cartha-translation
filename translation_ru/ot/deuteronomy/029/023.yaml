  source_fidelity: 'Первый вопрос передан верно: וְאָמְרוּ в данном контексте естественно передать будущим временем, כָּל־הַגּוֹיִם — «все народы», а имя יהוה — «Яхве». Однако во втором вопросе в исходном тексте нет глагола «разгорелся»: это вопросительная именная конструкция о причине «жара/пылания великого гнева».'
