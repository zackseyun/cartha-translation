translation:
  language: ru
  text: великие испытания, которые видели твои глаза,[a] те великие знамения и чудеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великие проверки». В старых переводах встречается «великие искушения», однако здесь имеются в виду испытания или проверки, а не склонение ко греху.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת
  choice: великие испытания
  rationale: Существительное обозначает испытания или события, служащие проверкой. «Испытания» естественно по-русски и, в отличие от «искушений», не предполагает склонения ко греху.
- source_word: הַגְּדֹלֹת
  choice: великие
  rationale: Прилагательное подчёркивает масштаб и значительность испытаний; «великие» сохраняет торжественную весомость выражения.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: которые видели твои глаза
  rationale: Сохранён явный древнееврейский образ непосредственного свидетельства, а также обращение во втором лице единственного числа.
- source_word: הָאֹתֹת
  choice: знамения
  rationale: «Знамения» — ясный и устоявшийся русский эквивалент для необычайных действий, указывающих на Божью силу.
- source_word: וְהַמֹּפְתִים
  choice: и чудеса
  rationale: Передаёт обычное сочетание «знамения и чудеса», не уточняя сверх того, что выражено исходным словом.
- source_word: הַגְּדֹלִים
  choice: великие
  rationale: Сохраняет повтор прилагательного и подчёркивает величие названных знамений и чудес.
- source_word: הָהֵם
  choice: те
  rationale: Указательное местоимение с эмфатической силой отсылает к непосредственно увиденным знамениям и чудесам.
theological_decisions:
- issue: 'Значение הַמַּסּוֹת: испытания или искушения'
  choice: испытания
  alternative: искушения; проверки
  rationale: В данном контексте слово говорит об испытании или подтверждающей проверке через пережитые события, а не о побуждении ко греху. При этом перевод не уточняет, кто именно подвергался испытанию, сохраняя смысловую широту оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественности и прямого древнееврейского образа «видели твои глаза». Фрагментарное начало исходного отрывка не дополнено словами из контекста.
