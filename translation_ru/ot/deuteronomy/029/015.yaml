lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит поясняющее основание для предшествующих слов; «ведь» естественно передаёт эту функцию в современном русском языке.
- source_word: יְדַעְתֶּם
  choice: вы знаете
  rationale: Перфект обозначает знание, приобретённое в прошлом и сохраняющееся у слушателей теперь; настоящее время по-русски передаёт это естественно.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: как мы жили
  rationale: Конструкция указывает на известные слушателям обстоятельства жизни в Египте; буквальное воспроизведение было бы неестественным по-русски.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохранено выражение «земля Египетская» как понятная и стилистически возвышенная передача еврейского оборота без архаизации всего предложения.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: и как проходили
  rationale: Передано движение через земли других народов без добавления идеи страданий, хотя конструкция допускает и понимание пережитого опыта.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: среди народов
  rationale: בקרב буквально означает «посреди, среди»; этот вариант естественен по-русски и сохраняет образ пребывания и движения среди народов.
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: через которые вы проходили
  rationale: Относительное предложение отнесено к народам; повтор глагола сохранён вслед за еврейским текстом, несмотря на некоторую стилистическую тяжеловесность.
