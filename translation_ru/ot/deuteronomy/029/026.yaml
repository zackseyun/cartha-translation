  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: ru
  text: И воспылал гнев Яхве против той земли, так что Он навёл на неё все проклятия, написанные в этой книге.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Передаёт образ горящего гнева в еврейской идиоме, сохраняя его выразительность и естественно звуча по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בָּאָרֶץ הַהִוא
  choice: на ту землю
  rationale: Предлог ב при выражении гнева обозначает объект, на который он направлен; русское «на ту землю» естественно сочетается с «гнев».
- source_word: לְהָבִיא עָלֶיהָ
  choice: и Он навёл на неё
  rationale: Инфинитив выражает следствие или цель. Личная конструкция по-русски ясно связывает действие с Яхве и передаёт причинённое наступление проклятий.
- source_word: כָּל הַקְּלָלָה
  choice: все проклятия
  rationale: Еврейское единственное число имеет собирательный смысл; множественное число естественно передаёт полноту совокупности проклятий.
- source_word: הַכְּתוּבָה
  choice: записанные
  rationale: Сохраняет значение пассивного причастия и подчёркивает документально закреплённый характер проклятий.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: в этой книге
  rationale: «Книга» — понятная и традиционная передача סֵפֶר в данном заветном контексте без ненужного уточнения материальной формы свитка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Связь гнева с наведением проклятий
  choice: 'сочинительная конструкция результата: «и Он навёл»'
  alternative: 'целевая конструкция: «чтобы навести»'
  rationale: לְהָבִיא допускает оттенок цели или результата. В контексте ретроспективного описания суда конструкция «и Он навёл» естественно выражает наступившее следствие, не исключая целевой связи.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной торжественностью. Сохранён яркий образ «воспылал гнев», но синтаксис сделан естественным для обычного читателя; архаизмы и конфессионально маркированные замены имени избегаются.
