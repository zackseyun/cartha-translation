  text: וְ/לֹ֥א אִתְּ/כֶ֖ם לְ/בַדְּ/כֶ֑ם אָנֹכִ֗י כֹּרֵת֙ אֶת הַ/בְּרִ֣ית הַ/זֹּ֔את וְ/אֶת הָ/אָלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: ru
  text: И не с вами одними я заключаю этот завет[a] и эту клятву[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «режу этот завет»; это древнееврейское устойчивое выражение означает заключение завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и это проклятие». Древнееврейское слово может обозначать как клятву, так и связанное с ней проклятие за её нарушение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא
  choice: И не
  rationale: Союз с отрицанием продолжает речь и вводит противопоставление последующему контексту; краткая русская конструкция сохраняет связь с предыдущим стихом.
- source_word: אִתְּכֶם לְבַדְּכֶם
  choice: с вами одними
  rationale: 'Передаёт отношение совместности и значение исключительности: речь идёт не только о присутствующих слушателях.'
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение выражает подлежащее с возможным оттенком подчёркивания; в русском контексте естественно передать его обычным «я», не усиливая до «я сам».
- source_word: כֹּרֵת
  choice: заключаю
  rationale: Глагол буквально означает «режу» в устойчивом древнееврейском выражении о заключении завета. Русское «заключаю завет» естественно и точно передаёт смысл идиомы; форма настоящего времени соответствует причастной форме в данном речевом контексте.
- source_word: הַבְּרִית הַזֹּאת
  choice: этот завет
  rationale: «Завет» сохраняет юридический и богословский вес בְּרִית в контексте Второзакония.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: и эту клятву
  rationale: אָלָה может обозначать клятву, включающую налагаемое ею проклятие. В основном тексте «клятва» лучше передаёт акт скрепления завета, а значение «проклятие» сохраняется в примечании.
theological_decisions:
- issue: Передача אָלָה в контексте завета
  choice: клятва
  alternative: проклятие
  rationale: Сочетание בְּרִית и אָלָה указывает на завет и скрепляющую его клятвенную санкцию. «Клятва» передаёт сам акт принятия обязательства, но не устраняет возможный акцент на проклятии за нарушение, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Сохранены начальный союз, противопоставление и незавершённость синтаксиса, поскольку стих продолжает предложение в следующем контексте. Местоимение «я» написано со строчной буквы по обычной современной орфографической норме; богословское почтение не выражается факультативной прописной буквой.
