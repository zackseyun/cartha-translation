lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: и вы видели
  rationale: Форма Qal wayyiqtol, 2-е лицо множественного числа, продолжает обращённое к народу воспоминание Моисея; простое прошедшее время естественно по-русски, а союз «и» сохраняет связь с предшествующим контекстом.
- source_word: שִׁקּוּצֵיהֶם
  choice: их мерзости
  rationale: Слово обозначает нечто вызывающее сильное отвращение, особенно предметы языческого культа. «Мерзости» сохраняет резкую оценочную окраску и отличается от следующего названия идолов.
- source_word: גִּלֻּלֵיהֶם
  choice: их идолов
  rationale: Это презрительное обозначение идолов. В основном тексте «идолы» ясно передаёт предмет речи; особо грубая уничижительная окраска отмечена в сноске.
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: из дерева и камня, серебра и золота
  rationale: Перечень естественно понимать как указание на материалы культовых предметов. Повтор предлога перед второй парой не требуется в русском перечислении.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: которые были у них
  rationale: Оборот сохраняет широкое значение присутствия или нахождения во владении окружающих народов и не утверждает точнее, чем еврейский текст, что идолы непременно принадлежали им юридически.
theological_decisions:
- issue: Передача двух уничижительных обозначений языческих культовых предметов
  choice: «мерзости» и «идолы»
  alternative: «отвратительные предметы» и «навозные идолы»
  rationale: Два разных еврейских слова сохранены как два обозначения. Основной текст остаётся понятным и литературным, а особенно грубый оттенок второго слова вынесен в сноску без внесения конфессионального толкования.
- issue: Отнесение оборота אֲשֶׁר עִמָּהֶם
  choice: к предметам, находившимся у упомянутых ранее народов
  alternative: «которые были среди них»
  rationale: Контекст предыдущего стиха указывает на народы, через земли которых прошёл Израиль. Формулировка не создаёт впечатления, будто эти идолы находились у Израиля.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Тире выделяют перечень материалов как пояснение к культовым предметам. Сохранены два разных уничижительных термина оригинала и незавершённая контекстуальная связь стиха без добавления толкований.
