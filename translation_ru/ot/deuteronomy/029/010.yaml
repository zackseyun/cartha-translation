translation:
  language: ru
  text: ваши малые дети[a], ваши жёны и чужеземец, живущий среди вашего стана[b], — от рубящего ваши дрова до черпающего для вас воду,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши дети». Еврейское טַף обозначает прежде всего малых детей, иногда — зависимых членов семьи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «переселенец». Еврейское גֵּר обозначает чужеземца, постоянно живущего среди общины.'
    reason: lexical_clarification
lexical_decisions:
- source_word: טַפְּכֶם
  choice: ваши малые дети
  rationale: טַף обозначает прежде всего маленьких детей, а в некоторых контекстах также зависимых членов семьи. «Малые дети» сохраняет конкретный смысл и звучит достойно в перечне участников собрания.
- source_word: נְשֵׁיכֶם
  choice: ваши жёны
  rationale: В контексте семей и общинного собрания נָשִׁים с притяжательным суффиксом естественно означает «ваши жёны».
- source_word: וְגֵרְךָ
  choice: и переселенец
  rationale: גֵּר — чужеземец, постоянно живущий внутри общины, а не случайный путник. «Переселенец» передаёт его положение понятнее, чем общее «чужеземец», при этом единственное число сохранено.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: который находится среди вашего стана
  rationale: Перевод явно передаёт относительное אֲשֶׁר и пространственный образ нахождения внутри стана; «стан» соответствует историко-литературному регистру.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: от рубящего ваши дрова
  rationale: Причастная конструкция сохраняет форму חֹטֵב и начало диапазона מִן...עַד; עֵצִים в данном сочетании естественно передано как «дрова».
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: до черпающего для вас воду
  rationale: Причастие передаёт שֹׁאֵב, а «черпать воду» точно отражает действие. Оборот «для вас» естественно выражает притяжательное значение суффикса при מַיִם, не создавая неестественного русского «вашу воду».
theological_decisions:
- issue: Социальный охват заветного собрания
  choice: Перечень включает семьи, живущего внутри общины переселенца и выполняющих низкостатусный труд людей.
  alternative: Ограничить перечисление только этническими израильтянами или истолковать работников как чисто метафорические категории.
  rationale: Прямой смысл еврейского текста перечисляет разные слои реально присутствующего сообщества. Перевод сохраняет эту широту, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Стан» сохраняет историческую обстановку; причастия «рубящего» и «черпающего» воспроизводят параллелизм оригинала. Маркер [b] поставлен непосредственно после слов о переселенце, к которым относится примечание.
