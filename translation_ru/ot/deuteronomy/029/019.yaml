source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: ru
  text: Яхве не пожелает простить его, ибо тогда гнев Яхве и Его ревность воспылают против того человека; на него лягут все проклятия[a], записанные в этой книге, и Яхве сотрёт его имя из-под небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все клятвенные проклятия». Еврейское слово может обозначать проклятие, связанное с клятвой завета, а не просто общее пожелание зла.'
    reason: Лексическая альтернатива и сохранение заветно-клятвенного оттенка термина אָלָה.
lexical_decisions:
- source_word: יֹאבֶה
  choice: не пожелает
  rationale: Глагол выражает волю или согласие, а не способность; «не пожелает» естественно передаёт волевой оттенок.
- source_word: סְלֹחַ לוֹ
  choice: простить его
  rationale: В контексте завета סלח означает простить или помиловать; выбран современный и прямой русский эквивалент.
- source_word: כִּי אָז
  choice: потому что тогда
  rationale: Сохраняет как объяснительную, так и временную связь исходного выражения.
- source_word: יֶעְשַׁן אַף יְהוָה וְקִנְאָתוֹ
  choice: гнев Яхве и Его ревность воспылают
  rationale: Буквально еврейский текст говорит, что гнев «задымится». Русское «воспылают» естественно передаёт яркий образ разгоревшегося гнева и согласуется с двумя однородными существительными.
- source_word: בָּאִישׁ הַהוּא
  choice: против того человека
  rationale: Предлог ב при выражении враждебности естественно передаётся как «против»; указательное и единственное число сохранены.
- source_word: וְרָבְצָה בוֹ
  choice: ляжет на него
  rationale: Сохраняет образ глагола רבץ — лечь, расположиться, остаться на ком-либо — без неестественной буквальности.
- source_word: כָּל הָאָלָה
  choice: всякое проклятие
  rationale: Передаёт распределительное значение «все проклятия» в естественной русской форме; заветно-клятвенный оттенок отмечен в сноске.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: записанное в этой книге
  rationale: «Книга» является понятным современным эквивалентом סֵפֶר, которое также может обозначать свиток.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: сотрёт его имя
  rationale: Сохраняет библейский образ удаления имени, памяти или потомства и звучит естественно по-русски.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: из-под небес
  rationale: Сохраняет устойчивое еврейское выражение об удалении с земли и множественную форму «небеса».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Образ божественного гнева
  choice: «гнев Яхве и Его ревность воспылают»
  alternative: «гнев Яхве и Его ревность задымятся»
  rationale: Буквальный образ дыма не устранён до нейтрального «будут направлены», но передан естественным русским образом разгорающегося огня; никаких выводов о природе божественных страстей не добавлено.
- issue: Обозначение нарушителя завета
  choice: «того человека»
  alternative: «того мужчину»
  rationale: אִישׁ здесь обозначает отдельного человека в мужском единственном числе; «человек» сохраняет индивидуальную референцию, не вводя лишнего акцента на биологическом поле.
- issue: Терминология проклятия завета
  choice: «всякое проклятие» со сноской
  alternative: «всякое клятвенное проклятие»
  rationale: Основной текст остаётся ясным и естественным, а формальный оттенок проклятия, призываемого при клятве в контексте завета, сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Синтаксис сохраняет нарастающую последовательность судебных последствий; устаревшие формы и конфессионально маркированные замены имени Яхве не используются.
