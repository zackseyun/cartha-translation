  terminology: «Яхве», «гнев», «ревность», «проклятие» и «сотрёт его имя из-под небес» уместны и соответствуют исходному тексту. Сноска сохраняет важный клятвенно-заветный оттенок אָלָה без его навязывания основному тексту.
