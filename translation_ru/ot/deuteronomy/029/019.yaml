  source_fidelity: 'Смысл оригинала в целом передан точно: волевое «не пожелает простить», образ воспылавшего гнева, направленность против конкретного человека, пребывание проклятия на нём и стирание имени сохранены. Однако כָּל הָאָלָה при естественном русском согласовании лучше передать множественным «все проклятия», а не сочетанием «всякое проклятие» с единственным причастием.'
