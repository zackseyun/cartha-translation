lexical_decisions:
- source_word: לֶחֶם
  choice: хлеб
  rationale: Основное конкретное значение слова; оно сохраняет образ и противопоставление вину и другому напитку. Более широкое «пища» возможно в иных контекстах, но здесь не требуется.
- source_word: אֲכַלְתֶּם
  choice: вы не ели
  rationale: Перфект подводит итог пережитому Израилем периоду; русское прошедшее время естественно передаёт этот ретроспективный смысл.
- source_word: יַיִן
  choice: вино
  rationale: Прямое и обычное значение еврейского слова.
- source_word: שֵׁכָר
  choice: пьянящий напиток
  rationale: Слово обозначает алкогольный, обычно ферментированный напиток, отличный от вина, без обязательного указания на современный крепкий дистиллированный алкоголь. Выбор точнее современного понимания выражения «крепкий напиток» и понятнее архаичного «сикера».
- source_word: שְׁתִיתֶם
  choice: не пили
  rationale: Русское прошедшее время естественно передаёт ретроспективное употребление еврейского перфекта; общий субъект «вы» не нуждается в повторении.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно передаёт целевую направленность и допускаемый контекстом оттенок предполагаемого результата.
- source_word: תֵּדְעוּ
  choice: вы знали
  rationale: В придаточном с «чтобы» эта форма естественно выражает намеченный результат — признание того, кто является Богом Израиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Прямо передаёт форму с местоименным суффиксом и обозначенную ею связь с адресатами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и является наиболее принятой научной реконструкцией произношения; титул «Господь» заменил бы имя, а форма «Иегова» отражает более позднее смешанное чтение.
- issue: Связь лишения обычной пищи и напитков с познанием Бога
  choice: чтобы вы знали
  alternative: и потому вы узнали
  rationale: Конструкция לְמַעַן прежде всего указывает на цель или намеченный результат. Перевод с «чтобы» сохраняет эту богословскую напряжённость и не сводит её только к причинно-следственному итогу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и ясный; местоимение «Я» написано с прописной буквы по русской религиозной традиции. Тире перед именем подчёркивает именную часть сказуемого без добавления отсутствующего в источнике смысла.
