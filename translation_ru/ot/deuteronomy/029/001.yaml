  source_fidelity: 'Основной смысл передан точно: Моисей обращается ко всему Израилю, напоминает о том, что они видели действия Яхве в Египте, и сохраняет тройное перечисление фараона, его слуг и его земли. Однако «сделал ... с фараоном» в современном русском может звучать разговорно и допускать смысл совместного действия. Дательный падеж («сделал фараону») естественнее обозначает затронутых действием лиц и ближе передаёт функцию повторяющегося לְ, не навязывая в основном тексте значение «против».'
