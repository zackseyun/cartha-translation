base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: ru
  text: 'И созвал Моисей весь Израиль и сказал им: «Вы видели всё, что Яхве сделал у вас на глазах в земле Египта фараону, всем его слугам и всей его земле[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против фараона, против всех его слуг и против всей его земли». Еврейский предлог לְ в данном контексте может передавать направленность действий Яхве против них как суда.'
    reason: Лексическая альтернатива для повторяющегося предлога לְ.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: созвал
  rationale: В данном повествовательном контексте קרא означает призвать народ собраться; «созвал» естественно передаёт значение созыва всего Израиля.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Собирательное обозначение народа завета; эта форма кратка, естественна и сохраняет охват исходного выражения.
- source_word: רְאִיתֶם
  choice: вы видели
  rationale: Еврейский перфект указывает на пережитое адресатами событие, сохраняющее значение для настоящего; русское «вы видели» естественно выражает этот смысл без излишнего уточнения времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, обозначенное тетраграмматоном, а не заменяется титулом.
- source_word: לְעֵינֵיכֶם
  choice: у вас на глазах
  rationale: Современный русский идиом естественно передаёт непосредственность и публичную очевидность увиденного.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египта
  rationale: Сохраняется явно присутствующее в еврейском тексте слово «земля», при этом выражение остаётся понятным по-русски.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: с фараоном, со всеми его слугами и со всей его землёй
  rationale: Русская конструкция «что сделал с…» естественно обозначает затронутых действием и не уточняет сверх текста характер действия; возможный контекстуальный смысл направленного суда отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер действий Яхве по отношению к Египту
  choice: что Яхве сделал… с фараоном
  alternative: что Яхве сделал… против фараона
  rationale: Предлог לְ обозначает объекты, затронутые действием, а контекст допускает понимание этих действий как суда. Основной текст сохраняет более широкую формулировку, а направленность «против» вынесена в сноску, чтобы не устранять смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; повтор «со всеми… и со всей…» сохраняет риторическую полноту еврейского текста.
