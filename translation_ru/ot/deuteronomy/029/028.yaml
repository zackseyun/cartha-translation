base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: ru
  text: Сокрытое принадлежит Господу, нашему Богу, а открытое — нам и нашим детям[a] навеки, чтобы мы исполняли все слова этого закона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейской рукописной традиции над словами «нам и нашим детям» стоят особые точки; их точное значение остаётся неясным.
    reason: textual_note
  - marker: b
    text: 'Или: «этого наставления». Здесь еврейское слово «тора» обозначает заветное учение, которое Моисей излагает Израилю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: сокрытое
  rationale: Страдательное причастие употреблено субстантивно во множественном числе. Русское собирательное «сокрытое» естественно передаёт всё, что скрыто от человеческого знания, не придавая выражению оттенка эзотерических тайн.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: принадлежит Господу, нашему Богу
  rationale: Предлог לְ выражает принадлежность. Тетраграмматон передан принятой в русском библейском стиле формой «Господь», а אֱלֹהֵינוּ — «наш Бог».
- source_word: וְהַנִּגְלֹת
  choice: а открытое
  rationale: Страдательное причастие от גלה образует смысловую параллель с «сокрытым». Союз передан как противопоставительный «а», что соответствует контрасту двух частей.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: нам и нашим детям
  rationale: Глагол принадлежности подразумевается из первой части и в русском может быть естественно опущен после тире. בנים в контексте преемственности завета охватывает детей и потомков, а не только сыновей.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткая литературная передача устойчивого выражения о неограниченной продолжительности.
- source_word: לַעֲשׂוֹת
  choice: чтобы мы исполняли
  rationale: 'Инфинитив с לְ выражает цель: открытое дано Израилю для послушного исполнения. «Исполняли» естественнее применительно к предписаниям закона, чем буквальное «делали».'
- source_word: אֵת כָּל דִּבְרֵי
  choice: все слова
  rationale: Сохраняется буквальный образ «слов», подчёркивающий конкретные положения заветного наставления.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: этого закона
  rationale: תורה может означать как закон, так и наставление; в контексте Второзакония «закон» ясно и узнаваемо обозначает изложенное Моисеем учение завета.
theological_decisions:
- issue: Что относится к «сокрытому» и «открытому»
  choice: Сохранено общее противопоставление того, что оставлено Богу, и того, что открыто Израилю ради послушания.
  alternative: Понимать стих либо как всеобщий принцип обо всех божественных тайнах, либо исключительно как указание на благословения и проклятия ближайшего контекста.
  rationale: Еврейский текст не определяет исчерпывающе объём обеих категорий; перевод не сужает и не расширяет их без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Собирательные формы «сокрытое» и «открытое» сохраняют лаконичный параллелизм оригинала; тире естественно восполняет опущенную во второй части связку принадлежности.
