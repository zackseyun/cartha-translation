base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: ru
  text: Я водил вас сорок лет по пустыне. Ваша одежда на вас не износилась, и твоя сандалия на твоей ноге не износилась.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте обращение переходит от множественного числа к единственному: буквально: «твоя сандалия не износилась на твоей ноге». Возможно, Израиль здесь представлен как единое целое либо единственное число имеет распределительное значение и относится к каждому из народа.'
    reason: Сохранён и разъяснён переход числа в оригинале.
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: Я вёл
  rationale: Каузативная форма от הלך в данном контексте означает, что Господь вёл Израиль через пустыню; «вёл» естественно передаёт это значение по-русски.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; с глаголом движения русское «по пустыне» звучит естественно и сохраняет образ странствия.
- source_word: בָּלוּ / בָלְתָה
  choice: не износились / не износилась
  rationale: Глагол בלה применительно к одежде и обуви означает износиться от употребления.
- source_word: שַׂלְמֹתֵיכֶם
  choice: одежды ваши
  rationale: Существительное во множественном числе обозначает предметы одежды в целом; «одежды» сохраняет число и соответствует достоинству библейского повествования.
- source_word: מֵעֲלֵיכֶם
  choice: на вас
  rationale: Буквально выражение связано с положением «на вас»; при русском «износиться» такая передача естественна.
- source_word: נַעַלְךָ
  choice: сандалия твоя
  rationale: נַעַל обозначает обувь, в данном историческом контексте — сандалию. Сохранено единственное число и обращение к Израилю как к одному целому либо к каждому его представителю.
- source_word: מֵעַל רַגְלֶךָ
  choice: на ноге твоей
  rationale: Буквально «с/поверх ноги твоей»; с глаголом «износилась» естественно передать состояние обуви во время ношения как «на ноге твоей».
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямая и однозначная передача продолжительности.
theological_decisions:
- issue: Переход от множественного обращения («вас», «ваши») к единственному («твоя», «твоей»)
  choice: Сохранить переход к единственному числу в последней части стиха
  alternative: 'Сгладить по-русски: «ваши сандалии на ваших ногах»'
  rationale: Масоретский текст явно меняет число. Это может представлять Израиль как единое целое или иметь распределительное значение; перевод не должен устранять эту значимую особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «одежды ваши», «сандалия твоя» выбран для ясного сохранения форм множественного и единственного числа; лексика остаётся понятной современному читателю.
