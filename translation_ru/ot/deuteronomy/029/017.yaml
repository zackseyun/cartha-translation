  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: ru
  text: Как бы среди вас не оказалось мужчины или женщины, рода или племени, чьё сердце сегодня отворачивается от Яхве, нашего Бога, чтобы пойти и служить богам тех народов; как бы среди вас не оказалось корня, приносящего яд и полынь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корня, приносящего желчь и полынь». Еврейское רֹאשׁ может обозначать яд, ядовитое растение или, в традиционной передаче, желчь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן יֵשׁ בָּכֶם
  choice: как бы не оказалось среди вас
  rationale: Сохраняет предостерегающий смысл частицы פֶּן и экзистенциальной конструкции, оставаясь естественным по-русски.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: мужчины или женщины
  rationale: Передаёт явно названную в еврейском тексте пару, не заменяя её обобщающим словом.
- source_word: מִשְׁפָּחָה
  choice: рода
  rationale: В данном общественно-заветном контексте обозначает родственную группу шире отдельной семьи.
- source_word: שֵׁבֶט
  choice: племени
  rationale: Здесь слово обозначает племя Израиля, а не жезл или ветвь.
- source_word: לְבָבוֹ פֹנֶה
  choice: чьё сердце сегодня отворачивается
  rationale: Причастие פֹנֶה допускает значение происходящего или начинающегося отступления; форма «отворачивается» сохраняет эту динамику.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: чтобы пойти и служить
  rationale: Естественно передаёт сочетание движения с целью последующего служения.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: богам тех народов
  rationale: Слово גּוֹיִם здесь относится к окружающим народам и их богам.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: корня, приносящего яд и полынь
  rationale: Сохраняет образ скрытого корня, дающего губительный плод, и не устраняет многозначность רֹאשׁ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит Тетраграмматон; транслитерация сохраняет личное заветное имя.
- issue: Характер отступления в לְבָבוֹ פֹנֶה
  choice: сердце отворачивается
  alternative: сердце отвернулось
  rationale: Настоящая форма не превращает причастие в однозначно завершённое действие и сохраняет напряжение между начинающимся и продолжающимся отступлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «как бы не оказалось среди вас» сохранён как значимый риторический параллелизм исходного текста.
