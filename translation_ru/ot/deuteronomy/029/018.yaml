revisions:
- from: 'И когда он услышит слова этой клятвы[a], то станет благословлять себя в своём сердце, говоря: «Будет у меня благополучие, даже если я буду поступать по упорству своего сердца», — чтобы погубить напоённое вместе с иссохшим.[b]'
  to: 'И когда он услышит слова этой клятвы[a], то станет благословлять себя в своём сердце, говоря: «Будет у меня благополучие, хотя я следую упрямству своего сердца», — чтобы погубить насыщенное влагой вместе с жаждущим.[b]'
  rationale: 'Исправлены только две стилистико-лексические точки. Заключительная метафора по-прежнему не объясняется в основном тексте: «насыщенное влагой» и «жаждущее» оставлены субстантивированными, как в еврейском. Целевая связь לְמַעַן сохранена словом «чтобы», а альтернативное истолкование вынесено в примечание.'
