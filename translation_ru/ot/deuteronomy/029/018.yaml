    rationale: «Напоённое» в русской речи чаще относится к тому, кого/что напоили, и слабее выражает исходное противопоставление насыщенного влагой и жаждущего/сухого. «Насыщенное влагой вместе с жаждущим» точнее показывает образность и не вводит явно «землю» в основной текст.
  - severity: low
