  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: ru
  text: 'И когда он услышит слова этой клятвы[a], то станет благословлять себя в своём сердце, говоря: «Будет у меня благополучие, хотя я следую упрямству своего сердца», — чтобы погубить насыщенное влагой вместе с жаждущим.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этого проклятия». Еврейское слово может обозначать клятву, влекущую за собой проклятие.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно: «чтобы погубить орошаемую землю вместе с сухой», то есть уничтожить всё без различия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: клятва
  rationale: Слово обозначает клятву, которая в данном контексте включает проклятие и предусмотренные за нарушение санкции; основной текст сохраняет форму covenantal oath, а альтернативный оттенок вынесен в примечание.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: станет благословлять себя в своём сердце
  rationale: Возвратная форма передаёт внутреннее самоблагословение и иронию самоуверенности говорящего.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: будет у меня благополучие
  rationale: שָׁלוֹם здесь означает не только мир, но также целость, безопасность и благополучие; выбранное выражение естественно передаёт самонадеянное ожидание невредимости.
- source_word: שְׁרִרוּת לִבִּי
  choice: по упорству своего сердца
  rationale: Сочетание указывает на упрямую, ожесточённую волю, а не просто на личное желание.
- source_word: לְמַעַן סְפוֹת
  choice: чтобы погубить
  rationale: לְמַעַן сохраняет целевую или результирующую связь, а ספה в контексте суда наиболее вероятно означает уничтожение или сметание.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: напоённое вместе с иссохшим
  rationale: 'Субстантивированная метафора сохраняет трудность и широту еврейского выражения: буквально противопоставлены насыщенное влагой и жаждущее или сухое; более конкретное толкование дано в примечании.'
theological_decisions:
- issue: Значение covenantal הָאָלָה
  choice: клятва в основном тексте
  alternative: проклятие
  rationale: Еврейское слово может обозначать клятву с заключённым в ней проклятием. «Клятва» соответствует синтаксису фразы, а примечание сохраняет санкционный смысл.
- issue: Самоуверенное утверждение שָׁלוֹם יִהְיֶה לִּי
  choice: будет у меня благополучие
  alternative: я останусь невредим; будет у меня мир
  rationale: Формулировка сохраняет широкий смысл שָׁלוֹם и не ограничивает его ни политическим миром, ни одной лишь физической безопасностью.
- issue: Трудная метафора הָרָוָה אֶת־הַצְּמֵאָה
  choice: сохранить образ «напоённого» и «иссохшего»
  alternative: погубить и орошаемую землю, и сухую; уничтожить всех без различия
  rationale: Выражение остаётся неоднозначным и, вероятно, пословичным; основной текст не сводит его к одному толкованию, а примечание сообщает вероятную интерпретацию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис несколько приподнят, но понятен обычному читателю. Метафора заключительной части намеренно сохранена, а её вероятное значение пояснено в сноске.
