  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: ru
  text: Итак, соблюдайте слова этого завета и исполняйте их, чтобы поступать благоразумно[a] во всём, что вы делаете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иметь успех»; еврейское слово может обозначать как благоразумные действия, так и их успешный результат.'
    reason: Лексическая многозначность תַּשְׂכִּילוּ.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Итак, соблюдайте
  rationale: В контексте завета שׁמר означает хранить верность предписаниям, то есть соблюдать их. «Итак» естественно передаёт связь с предшествующим контекстом, не превращая союз в чрезмерно сильный вывод.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: слова этого завета
  rationale: Формулировка сохраняет конкретное значение דְּבָרִים как содержания, выраженного словами, и не заменяет его более толковательным «условия».
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: и исполняйте их
  rationale: Местоимение во множественном числе соотнесено со «словами». Русское «исполняйте их» естественно передаёт идиоматическое еврейское «делайте их».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное отношение без искусственного уточнения одного из этих оттенков.
- source_word: תַּשְׂכִּילוּ
  choice: поступать благоразумно
  rationale: Порода hifil глагола שׂכל может обозначать как разумное, умелое действие, так и достигаемый благодаря ему успех. Основной текст сохраняет акцент на характере действия, а оттенок успеха отмечен в сноске.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: во всём, что вы делаете
  rationale: Естественная русская формулировка, сохраняющая всеохватность כָּל и сферу, к которой относится благоразумное действие или успех.
theological_decisions:
- issue: Связь послушания завету с благоразумием или успехом в תַּשְׂכִּילוּ
  choice: поступать благоразумно
  alternative: иметь успех / преуспевать
  rationale: Еврейский глагол допускает как смысл мудрого действия, так и смысл успешного результата. Основной перевод не сводит обещание к материальному процветанию, а сноска сохраняет реальный оттенок успеха и присущую тексту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Соблюдайте» и «исполняйте» ясно передают параллельные требования завета; буквальное, но неестественное «делайте их» устранено. Сноска помещена непосредственно после слова, к которому относится.
