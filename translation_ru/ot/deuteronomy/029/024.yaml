  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: ru
  text: 'Тогда скажут: «За то, что они оставили завет Яхве, Бога их отцов, который он заключил с ними, когда вывел их из земли Египта».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Тогда скажут
  rationale: Форма продолжает предшествующий вопрос и вводит ответ; «тогда» естественно передаёт ход речи, а будущее время соответствует контексту.
- source_word: עַל אֲשֶׁר
  choice: За то, что
  rationale: Сочетание вводит причину бедствия; русская конструкция естественно продолжает подразумеваемое объяснение наказания.
- source_word: עָזְבוּ
  choice: оставили
  rationale: Глагол означает отступление от завета; «оставили завет» ясно и без архаизации передаёт сознательную неверность.
- source_word: בְּרִית
  choice: завет
  rationale: Устоявшийся русский библейский термин сохраняет смысл обязательных отношений между Богом и Израилем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени сохраняет тетраграмматон как имя, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: Бога их отцов
  rationale: Сохраняется конструкция исходного текста и мужской род слова אֲבוֹת в значении предков-отцов.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: который Он заключил с ними
  rationale: Еврейская идиома буквально говорит «срезал завет»; по-русски нормативно «заключил завет».
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: когда вывел их
  rationale: Предлог בְּ при инфинитиве имеет временное значение; субъект однозначно восстанавливается как Яхве.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Формулировка сохраняет полную географическую фразу и её исходную торжественность, оставаясь понятной современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его и не подменяет титулом.
- issue: Выражение אֱלֹהֵי אֲבֹתָם
  choice: Бога их отцов
  alternative: Бога их предков
  rationale: «Отцов» точнее сохраняет грамматически мужскую форму и традиционную связь с отцами Израиля; более широкое «предков» здесь не требуется.
- issue: Связь исхода и заключения завета
  choice: который Он заключил с ними, когда вывел их
  alternative: который Он заключил с ними после того, как вывел их
  rationale: Временная конструкция допускает связь с событием исхода, но прямо не выражает «после»; перевод не уточняет хронологию сверх исходного текста.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским звучанием. Местоимение «Он» написано с прописной буквы как издательская норма благоговейного регистра; смысл от этого не меняется. Сноски не требуются: возможный вариант «Бог их предков» не отражает отдельной текстовой неоднозначности, необходимой для публикационного примечания.'
