  terminology: '«Яхве», «завет» и «Бог их отцов» точны и последовательно передают ключевые термины. «Оставили завет» является естественным современным выражением для עָזְבוּ в заветном контексте. Отдельная сноска не требуется: вариант порядка слов «Бог их отцов / Бог их отцов» не представляет здесь смысловой или текстологической неопределённости.'
