  text: וַ/יֵּלְכ֗וּ וַ/יַּֽעַבְדוּ֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲוּ֖וּ לָ/הֶ֑ם אֱלֹהִים֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ם וְ/לֹ֥א חָלַ֖ק לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: ru
  text: и пошли служить другим богам и поклоняться им — богам, которых они не знали и которых Он им не назначил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые не были им назначены». В еврейском тексте субъект глагола в единственном числе не назван; вероятнее всего, подразумевается Бог.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Сохраняет прямое значение глагола הלך и еврейскую последовательность действий, не сводя выражение к переносному «последовали».
- source_word: וַיַּעַבְדוּ
  choice: служить
  rationale: Передаёт обычное значение עבד и сохраняет отличие от следующего глагола, обозначающего поклонение.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Это прямое и естественное соответствие выражению; вариант «чужим богам» был бы более толковательным.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: поклоняться им
  rationale: Естественно передаёт действие преклонения перед божествами; буквальное «падать ниц перед ними» здесь было бы стилистически тяжелее.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: богам, которых они прежде не знали
  rationale: «Знали» сохраняет возможный опытный и отношенческий оттенок ידע, а «прежде» естественно выражает предшествование, подразумеваемое контекстом.
- source_word: וְלֹא חָלַק לָהֶם
  choice: и которых Он им не назначил
  rationale: Глагол חלק означает распределять или назначать долю. Заглавное «Он» ясно передаёт наиболее вероятный подразумеваемый субъект — Бога, не устраняя грамматическую неоднозначность, отмеченную в сноске.
theological_decisions:
- issue: Подразумеваемый субъект глагола חָלַק в единственном числе
  choice: «которых Он им не назначил», где «Он» относится к Богу
  alternative: «которые не были им назначены»
  rationale: В еврейском тексте стоит глагол 3-го лица мужского рода единственного числа без явно названного субъекта. Контекст Второзакония делает Бога наиболее вероятным действующим лицом, однако пассивное понимание смысла остаётся возможным и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность еврейских глаголов, но избегает неестественного многократного «и». Тире пояснительно присоединяет повторное слово «богам».
