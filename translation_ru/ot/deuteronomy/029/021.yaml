source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: ru
  text: 'И будущее поколение[a] — ваши потомки, которые придут после вас, — и чужеземец, который придёт из далёкой страны, скажут, когда увидят бедствия той земли и её болезни[b], которыми поразил её Яхве[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позднейшее поколение». Речь идёт о поколении, которое будет жить после нынешнего, а не обязательно о последнем поколении в истории.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «её недуги».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «которыми Яхве сделал её больной» или «которыми Яхве навёл на неё недуг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: скажут
  rationale: Единственное число еврейского глагола согласуется с первым, стоящим после него подлежащим «поколение», однако далее названо составное подлежащее («поколение… и чужеземец»), а וְרָאוּ имеет множественное число. В русском множественное «скажут» естественно передаёт совокупный субъект.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: будущее поколение
  rationale: Выражение обозначает поколение, которое будет жить позднее нынешних слушателей, и само по себе не означает последнее поколение истории.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: ваши потомки, которые придут после вас
  rationale: בנים здесь относится к последующим поколениям; «потомки» точнее контекста, чем буквальное «сыновья», а «придут после вас» естественно передаёт идиому יָקֻמוּ מֵאַחֲרֵיכֶם.
- source_word: וְהַנָּכְרִי
  choice: и чужеземец
  rationale: נָכְרִי — человек из другого народа или страны; «чужеземец» сохраняет национально-географический смысл.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: из далёкой земли
  rationale: Прямое и естественное соответствие, сохраняющее образ удалённой страны.
- source_word: וְרָאוּ
  choice: когда увидят
  rationale: В данном построении действие видения служит обстоятельством для последующей речи; временная связь по-русски выражена союзом «когда».
- source_word: מַכּוֹת
  choice: бедствия
  rationale: מַכּוֹת буквально обозначает удары и может относиться к карам или поражениям. В отношении опустошённой земли «бедствия» ясно передаёт видимые последствия суда, не сужая их до эпидемий.
- source_word: תַּחֲלֻאֶיהָ
  choice: её болезни
  rationale: Сохранена метафора земли, поражённой болезнями; возможен также более медицинский вариант «её недуги».
- source_word: חִלָּה
  choice: поразил
  rationale: Пиэль глагола חלה означает «сделать больным, подвергнуть недугу, поразить». «Поразил» естественно сочетается с землёй и сохраняет причинённое ей тяжёлое состояние.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: בָּהּ
  choice: её
  rationale: Местоимение относится к земле; при русском глаголе «поразил» естественно оформить землю как прямое дополнение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Объём значения בְּנֵיכֶם
  choice: ваши потомки
  alternative: ваши сыновья; ваши дети
  rationale: В контексте будущего поколения слово обозначает потомство адресатов в целом; перевод не ограничивает смысл только мужчинами.
- issue: Характер поражения земли
  choice: поразил её
  alternative: сделал её больной; навёл на неё недуг
  rationale: Формулировка сохраняет причинное действие Яхве и образ тяжёлого состояния земли, не уточняя сверх текста конкретный вид кары.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Порядок частей слегка перестроен ради естественного согласования составного подлежащего; двоеточие сохранено, поскольку далее продолжается описание, предваряющее речь наблюдателей.
