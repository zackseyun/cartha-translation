base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: ru
  text: чтобы Он сегодня утвердил тебя Своим народом[a] и был твоим Богом, как Он сказал тебе и как поклялся отцам твоим — Аврааму, Исааку и Иакову[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «народом для Себя».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское «отцам твоим» означает здесь праотцов — Авраама, Исаака и Иакова.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза естественным современным русским языком.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: сегодня утвердить тебя
  rationale: Каузативная форма קום обозначает утверждение Израиля в его заветном положении; единственное число сохраняет собирательное обращение еврейского текста.
- source_word: לוֹ לְעָם
  choice: как Свой народ
  rationale: Естественно выражает принадлежность Богу и сохраняет смысл заветной формулы; более буквальный порядок слов отмечен в сноске.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: и быть твоим Богом
  rationale: Передаёт стандартную заветную формулу по-русски; явное «Он Сам» здесь стилистически перегрузило бы фразу, тогда как субъект ясно назван далее.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: как Он говорил тебе
  rationale: Сохраняет прямое значение דבר и не смешивает речь с последующим упоминанием клятвы.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: и как клялся
  rationale: Точно передаёт значение נשבע — принести клятву.
- source_word: לַאֲבֹתֶיךָ
  choice: твоим отцам
  rationale: Непосредственно следующие имена Авраама, Исаака и Иакова показывают, что речь именно о праотцах мужского пола.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Русские падежные формы передают повторяющийся еврейский предлог без ненужного повторения «к».
theological_decisions:
- issue: Формулировка заветной принадлежности
  choice: как Свой народ ... твоим Богом
  alternative: народом для Себя ... Богом для тебя
  rationale: Выбранная формулировка естественна по-русски и сохраняет взаимную заветную связь, не превращая её в утверждение о происхождении или исключительности иного рода.
- issue: Значение לַאֲבֹתֶיךָ
  choice: твоим отцам
  alternative: твоим предкам
  rationale: Перечень Авраама, Исаака и Иакова конкретизирует слово как обозначение патриархов, поэтому гендерно нейтральное «предкам» было бы менее точным.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Прописное «Свой» обозначает отнесённость к Богу. Тире естественно вводит уточняющий перечень праотцов.
