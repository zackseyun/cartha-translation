  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: ru
  text: '«Проклят тот, кто сбивает слепого с дороги[a]!» И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводит слепого в заблуждение на дороге».'
    reason: 'Лексическая альтернатива: מַשְׁגֶּה означает «вводящий в заблуждение, сбивающий», а בַּדָּרֶךְ сохраняет конкретный контекст дороги.'
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Передаёт предикативную формулу заветного проклятия прямо и без превращения её в пожелание.
- source_word: מַשְׁגֶּה
  choice: тот, кто сбивает … с пути
  rationale: Причастие породы хифиль выражает причинение блуждания или введение в заблуждение; выбранный оборот естественен по-русски и сохраняет каузативный смысл.
- source_word: עִוֵּר
  choice: слепого
  rationale: Субстантивированное прилагательное мужского рода единственного числа передано столь же краткой русской формой, обозначающей отдельного слепого человека.
- source_word: בַּדָּרֶךְ
  choice: с пути
  rationale: В сочетании с глаголом движения русский оборот «сбивать с пути» естественно передаёт ситуацию, когда слепому человеку не дают верно идти дорогой, сохраняя при этом образ пути.
- source_word: וְאָמַר
  choice: И … скажет
  rationale: В предписанной литургической последовательности форма имеет будуще-предписывающий смысл; русский глагол будущего времени передаёт установленный ответ народа.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Точно передаёт собирательное выражение без добавления отсутствующего в стихе уточнения «Израиля».
- source_word: אָמֵן
  choice: Аминь
  rationale: Устоявшаяся русская передача литургического подтверждения сохраняет его заветный и общественный характер.
theological_decisions:
- issue: Характер формулы проклятия
  choice: Проклят тот, кто…
  alternative: Да будет проклят тот, кто…
  rationale: Еврейский текст формулирует декларативное заветное проклятие, а не просто пожелание; краткая именная конструкция сохраняет силу провозглашения.
- issue: Передача עִוֵּר как субстантивированного прилагательного
  choice: слепого
  alternative: слепого человека
  rationale: Русская форма соответствует мужскому роду и единственному числу оригинала, не добавляя слова, которого нет в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой заветного провозглашения. «Сбивает с пути» понятно обычному читателю и сохраняет образ дороги; более буквальная пространственная передача вынесена в сноску.
