lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: И напиши
  rationale: Форма Qal с союзом в последовательности предписаний естественно передаётся русским повелительным наклонением; сохраняется обращение во 2-м лице единственного числа.
- source_word: עַל הָאֲבָנִים
  choice: на камнях
  rationale: Предлог עַל означает «на», а определённость указывает на камни, уже названные в контексте.
- source_word: אֵת כָּל דִּבְרֵי
  choice: все слова
  rationale: Буквально и естественно передаёт כָּל דִּבְרֵי, не сужая значение до отдельных юридических постановлений.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: этого закона
  rationale: В данном заветно-правовом контексте תּוֹרָה уместно передать словом «закон»; указательное местоимение сохранено.
- source_word: בַּאֵר הֵיטֵב
  choice: ясно и отчётливо
  rationale: באר выражает идею разъяснения или ясного изложения, а הֵיטֵב усиливает её. Парная формула естественно передаёт требование сделать надпись вполне ясной, не ограничивая смысл только разборчивостью букв.
