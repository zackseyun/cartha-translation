  text: אָר֕וּר מַכֵּ֥ה רֵעֵ֖/הוּ בַּ/סָּ֑תֶר וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: ru
  text: 'Проклят тот, кто тайно поражает своего ближнего[a]. И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бьёт»; возможно также: «убивает». Еврейский глагол может обозначать как нанесение удара, так и смертельное насилие.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Страдательное причастие, вводящее формулу заветного проклятия; «проклят» — ясное и традиционное соответствие в торжественном провозглашении.
- source_word: מַכֵּה
  choice: поражает
  rationale: Причастие от נכה может обозначать удар, тяжёлое нападение или смертельное поражение. «Поражает» передаёт серьёзность насилия, не сводя значение однозначно к убийству.
- source_word: רֵעֵהוּ
  choice: своего ближнего
  rationale: רֵעַ обозначает ближнего, товарища или другого члена сообщества; «ближний» естественно и узнаваемо передаёт это значение.
- source_word: בַּסָּתֶר
  choice: тайно
  rationale: Выражение указывает на действие, скрытое от других; наречие «тайно» звучит естественно по-русски.
- source_word: וְאָמַר
  choice: И ... скажет
  rationale: В церемониальной последовательности форма описывает предписанный ответ народа; будущее время сохраняет формально-литургический строй.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Точно передаёт выражение «весь народ» без добавления подразумеваемого, но не названного здесь Израиля.
- source_word: אָמֵן
  choice: Аминь
  rationale: Устоявшаяся русская передача литургического ответа, выражающего подтверждение и согласие.
theological_decisions:
- issue: Степень насилия в מַכֵּה
  choice: поражает
  alternative: бьёт; убивает
  rationale: Глагол נכה охватывает диапазон от нанесения удара до смертельного насилия. «Поражает» сохраняет тяжесть поступка и подлинную неопределённость исходного текста, не ослабляя действие до простого удара и не уточняя его как убийство.
translation_notes:
  register: Современный литературный русский язык с dignified литургическим ритмом. Порядок частей и формула ответа народа близки к еврейскому тексту; лексическая неоднозначность נכה сохранена в основном тексте и пояснена в сноске.
