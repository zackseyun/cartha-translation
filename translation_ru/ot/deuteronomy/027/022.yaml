  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: ru
  text: 'Проклят тот, кто ложится со своей сестрой — дочерью своего отца или дочерью своей матери. И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Предикативное прилагательное вводит формулу заветного проклятия; «проклят» точно, ясно и соответствует торжественно-правовому регистру.
- source_word: שֹׁכֵב עִם
  choice: ложится с
  rationale: Еврейский эвфемистический оборот обозначает половую связь. «Ложится с» сохраняет образ и серьёзный тон оригинала, не переходя к клиническому пояснению или разговорному выражению.
- source_word: אֲחֹתוֹ
  choice: со своей сестрой
  rationale: Прямое обозначение родства с суффиксом третьего лица мужского рода; возвратное «своей» естественно связывает родство с субъектом в русском языке.
- source_word: בַּת אָבִיו
  choice: дочерью своего отца
  rationale: Приложение уточняет слово «сестрой» по отцовской линии. Формулировка сохраняет явную и симметричную юридическую структуру еврейского текста.
- source_word: אוֹ
  choice: или
  rationale: Простой разделительный союз, обозначающий альтернативу между родством по отцу и по матери.
- source_word: בַת אִמּוֹ
  choice: дочерью своей матери
  rationale: Параллельное уточнение родства по материнской линии; повтор слова «дочерью» передаёт формальную ясность оригинала.
- source_word: וְאָמַר
  choice: И ... скажет
  rationale: Форма продолжает предписанную литургическую последовательность. Русское будущее время естественно выражает установленный общий ответ народа.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Прямой эквивалент без добавления «Израиля» или замены на «собрание», которых в данном выражении нет.
- source_word: אָמֵן
  choice: Аминь
  rationale: Устоявшаяся русская передача еврейской литургической формулы подтверждения сохраняет её заветный и богослужебный характер.
theological_decisions:
- issue: Объём и форма запрета кровосмесительной связи
  choice: Сохранено прямое описание половой связи с сестрой, уточнённое происхождением от того же отца или той же матери.
  alternative: Ограничить смысл только сводной сестрой либо обобщить как связь с любой близкой родственницей.
  rationale: Сам стих определяет сестру через родство по отцовской или материнской линии. Перевод не сужает и не расширяет эту формулировку и сохраняет возможность включения как единокровной или единоутробной, так и полнородной сестры.
- issue: Мужской субъект правовой формулы
  choice: «тот, кто ... со своей сестрой»
  alternative: «мужчина, который ... со своей сестрой» либо гендерно нейтральная перестройка без указания родственной перспективы.
  rationale: Причастие и притяжательные суффиксы в еврейском тексте имеют мужской род. «Тот, кто» естественно передаёт типичного участника правовой формулы, сохраняя заданную оригиналом мужскую перспективу без лишнего слова «мужчина».
translation_notes:
  register: 'Современный литературный русский язык с торжественным правовым и литургическим звучанием. Синтаксис близок к еврейской формуле, но естественен по-русски; тире обозначает приложение. Подстрочная сноска не требуется: буквальное родственное уточнение уже сохранено в основном тексте.'
