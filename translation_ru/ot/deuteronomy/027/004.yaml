base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: ru
  text: Когда вы перейдёте Иордан, установите эти камни, которые Я сегодня повелеваю вам установить, на горе Эйвал[a] и покройте[b] их известью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых текстовых традициях, прежде всего в Самаритянском Пятикнижии, здесь стоит «на горе Гаризим» вместо «на горе Эйвал».
    reason: textual_variant
  - marker: b
    text: 'В еврейском тексте здесь обращение неожиданно переходит от множественного числа к единственному: буквально «и покрой их».'
    reason: source_grammar
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: Когда вы перейдёте
  rationale: Сочетание וְהָיָה с инфинитивной конструкцией вводит будущее временное обстоятельство; по-русски оно естественно передаётся придаточным времени.
- source_word: אֶת הַיַּרְדֵּן
  choice: Иордан
  rationale: Название без добавления «река» достаточно ясно и соответствует обычному русскому употреблению.
- source_word: תָּקִימוּ אֶת הָאֲבָנִים הָאֵלֶּה
  choice: установите эти камни
  rationale: Каузативная форма קום обозначает постановку или воздвижение камней; «установите» точно и естественно, тогда как «памятники» было бы истолкованием.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: о которых Я сегодня даю вам повеление
  rationale: Формулировка сохраняет относительную связь с камнями и настоящее значение причастия מְצַוֶּה, не добавляя отсутствующего в еврейском тексте повторного глагола «установить».
- source_word: בְּהַר עֵיבָל
  choice: на горе Эйвал
  rationale: Предлог בְּ при названии горы здесь естественно передаётся как «на»; имя транслитерировано с еврейского.
- source_word: וְשַׂדְתָ אֹתָם
  choice: и покройте их
  rationale: Глагол שׂוד означает покрывать штукатуркой или известковым составом. В основном тексте употреблено множественное число ради естественного согласования с обращением «вы», а смена числа в еврейском отмечена сноской.
- source_word: בַּשִּׂיד
  choice: известью
  rationale: שִׂיד обозначает известь или известковую штукатурку; «известью» называет материал и не создаёт тавтологии.
theological_decisions:
- issue: Название горы в текстовых традициях Второзакония 27:4
  choice: Эйвал
  alternative: Гаризим
  rationale: Масоретский текст WLC называет гору Эйвал, поэтому это чтение помещено в основной текст. Известное чтение Самаритянского Пятикнижия «Гаризим» сохранено в сноске без попытки скрыть текстологическое расхождение.
- issue: Смена грамматического числа в обращении
  choice: Множественное число в основном тексте с указанием формы единственного числа в сноске
  alternative: 'Буквально: «и покрой их»'
  rationale: Еврейский текст переходит от форм множественного числа תָּקִימוּ и אֶתְכֶם к форме единственного числа וְשַׂדְתָ. Русское множественное число сохраняет связность повеления, а сноска делает особенность оригинала доступной читателю.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным звучанием. Синтаксис сделан естественным для широкого читателя; имя Эйвал передано непосредственно с еврейского. Заглавная буква в «Я» обозначает говорящего Бога согласно принятой русской библейской практике.
