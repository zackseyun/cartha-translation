  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: ru
  text: И принеси мирные жертвы[a], ешь там и радуйся перед Яхве, твоим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; также возможно: «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: и принеси
  rationale: В жертвенном контексте זבח означает совершить жертвоприношение. Русское «принеси» естественно сочетается со словом «жертвы» и передаёт предписывающий характер формы.
- source_word: שְׁלָמִים
  choice: мирные жертвы
  rationale: Термин обозначает особый вид жертвоприношений, связанный с благополучием, общением и общей жертвенной трапезой. «Мирные жертвы» — традиционный и узнаваемый русский эквивалент; иные смысловые возможности отмечены в сноске.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: ешь там
  rationale: Перевод прямо сохраняет действие и указание места; форма повеления естественно передаёт продолжающийся ряд предписаний.
- source_word: וְשָׂמַחְתָּ
  choice: и радуйся
  rationale: שׂמח выражает радость в контексте поклонения и праздничной трапезы; «радуйся» сохраняет этот торжественный оттенок.
- source_word: לִפְנֵי
  choice: перед
  rationale: В культовом контексте выражение означает нахождение перед Богом, в Его присутствии. «Перед» — ясный и современный русский эквивалент.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоим Богом
  rationale: Сохранено явное местоименное окончание второго лица единственного числа, соответствующее обращению к Израилю как к единому народу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Передача названия жертв שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Слово обозначает категорию жертв, а не только внутреннее состояние мира. Традиционный термин оставлен в основном тексте, а допустимые смысловые варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Цепочка повелительных форм передаёт предписывающую последовательность еврейских форм, не утяжеляя фразу повторением местоимения.
