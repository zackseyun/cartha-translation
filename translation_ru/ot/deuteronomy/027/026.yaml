  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: ru
  text: 'Проклят тот, кто не поддерживает в силе слова этого закона, исполняя их. И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Предикативная форма вводит формулу заветного проклятия; «проклят» точно, ясно и соответствует достойному современному русскому стилю.
- source_word: אֲשֶׁר
  choice: тот, кто
  rationale: Передаёт обобщённо-личное значение еврейского относительного оборота без неоправданного уточнения пола.
- source_word: לֹא יָקִים
  choice: не утверждает
  rationale: Hiphil глагола קום может означать утверждать, поддерживать в силе или подтверждать. «Не утверждает» сохраняет отличие этого глагола от последующего «исполняя» и не сводит выражение просто к соблюдению.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: слов этого закона
  rationale: דִּבְרֵי буквально означает «слова» или «положения», а תּוֹרָה в данном контексте публичных заветных проклятий естественно передаётся словом «закон».
- source_word: לַעֲשׂוֹת אֹתָם
  choice: исполняя их
  rationale: 'Деепричастный оборот естественно передаёт обстоятельственное значение инфинитива: закон утверждается практически — исполнением его слов.'
- source_word: וְאָמַר כָּל הָעָם
  choice: И весь народ скажет
  rationale: В предписанном литургическом порядке форма выражает ожидаемый или предписанный ответ народа; будущее время естественно передаёт эту функцию.
- source_word: אָמֵן
  choice: Аминь
  rationale: Устоявшаяся русская литургическая передача сохраняет формальный смысл общего подтверждения.
theological_decisions:
- issue: Смысл заветной обязанности в יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: Проклятие относится к тому, кто не утверждает закон своим практическим исполнением.
  alternative: Речь может пониматься как неподтверждение или неустановление обязательной силы закона; возможен также более общий перевод «не соблюдает закон».
  rationale: Сочетание «утверждает» с «исполняя их» связывает признание обязательной силы закона с послушанием, не сводя первое к одному лишь словесному подтверждению и не привнося позднейших богословских формулировок.
- issue: Обобщённое значение אֲשֶׁר
  choice: тот, кто
  alternative: кто бы ни; человек, который
  rationale: Единственное число имеет представительное, обобщённое значение. Русское «тот, кто» сохраняет это значение естественно и без излишней гендерной конкретизации.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной заветной формулы. Синтаксис сохраняет различие между утверждением закона и его исполнением; кавычки выделяют установленный ответ народа.
