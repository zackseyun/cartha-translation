  source_fidelity: Фраза «не утверждает слов этого закона, исполняя их» в целом отражает различие между יָקִים («поддерживать в силе / утверждать / подтверждать») и לַעֲשׂוֹת אֹתָם («исполняя их»). Однако русское «утверждает» без уточнения может означать просто словесное одобрение или заявление и потому недостаточно ясно передаёт заветно-правовой смысл глагола. «Поддерживает в силе» лучше сохраняет этот смысл, не сводя выражение к одному лишь «соблюдает».
