  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: ru
  text: 'Вот те, кто должны стать на горе Гаризим, чтобы благословить народ, когда вы перейдёте Иордан: Симеон, Левий, Иуда, Иссахар, Иосиф[a] и Вениамин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом перечне имя Иосиф представляет колена Ефрема и Манассии.
    reason: Перекрёстный контекст поясняет представительное употребление имени Иосиф, не заменяя формулировку оригинала.
lexical_decisions:
- source_word: אֵלֶּה יַעַמְדוּ
  choice: Вот кто должен встать
  rationale: Указательное местоимение с имперфектом в контексте предписания естественно передано современной русской конструкцией, сохраняющей директивную силу.
- source_word: לְבָרֵךְ אֶת הָעָם
  choice: чтобы благословлять народ
  rationale: Инфинитив с ל выражает цель; несовершенный вид уместен для церемониального действия, совершаемого в ходе провозглашения благословений.
- source_word: עַל הַר גְּרִזִים
  choice: на горе Гаризим
  rationale: Передаёт местонахождение на горе и использует укоренившуюся русскую форму топонима.
- source_word: בְּעָבְרְכֶם אֶת הַיַּרְדֵּן
  choice: когда вы перейдёте Иордан
  rationale: Временное значение ב с инфинитивом передано придаточным предложением; совершенный вид естественно обозначает предстоящее пересечение реки до церемонии.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: Симеон, Левий, Иуда, Иссахар, Иосиф и Вениамин
  rationale: Использованы традиционные и понятные русские формы библейских имён; повторяющийся союз естественно передан перечислением с союзом перед последним элементом.
theological_decisions:
- issue: Сила указания о размещении колен
  choice: должен встать
  alternative: встанет
  rationale: Контекст содержит распоряжение Моисея о будущей церемонии, поэтому сохранена предписывающая, а не только предсказательная сила формы.
- issue: Значение имени Иосиф в перечне колен
  choice: Иосиф
  alternative: колена Ефрема и Манассии
  rationale: В основном тексте сохранено прямо названное еврейским оригиналом имя; его представительное значение поясняется в сноске без внесения уточнения в сам перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного повествования. Конструкция «вот кто должен» ясна обычному читателю и сохраняет указательный и предписывающий характер оригинала.
