  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: ru
  text: И напиши на них все слова этого закона[a], когда перейдёшь, чтобы ты вошёл в землю, которую Яхве, твой Бог, даёт тебе, — землю, где текут молоко и мёд, — как сказал тебе Яхве, Бог твоих отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все слова этого наставления». Еврейское слово тора может означать как «наставление», так и «закон»; здесь «закон» соответствует контексту завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог твоих предков». В еврейском тексте буквально: «Бог твоих отцов» — устойчивая формула завета во Второзаконии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: И напиши
  rationale: Перфект с союзом в контексте предписания передан повелительной формой; она естественно продолжает распоряжения предыдущего стиха.
- source_word: עֲלֵיהֶן
  choice: на них
  rationale: Местоимение отсылает к камням из предыдущего стиха; буквальное соответствие ясно по контексту.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: все слова этого закона
  rationale: דִּבְרֵי передано конкретным «слова», а תּוֹרָה — как «закон» ввиду заветно-правового контекста; возможное значение «наставление» сохранено в сноске.
- source_word: בְּעָבְרֶךָ
  choice: когда перейдёшь
  rationale: Предлог с инфинитивом выражает время. Объект перехода, понятный из контекста, не добавлен в основной текст.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: чтобы войти
  rationale: Сохраняется целевое или результативное значение конструкции без попытки устранить напряжение в последовательности действий.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Личное имя יהוה передано как «Яхве»; приложение оформлено естественно для современного русского языка.
- source_word: נֹתֵן לְךָ
  choice: даёт тебе
  rationale: Настоящее время сохраняет значение причастия и представляет дар земли как уже совершающийся и несомненный.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: землю, где текут молоко и мёд
  rationale: Сохранён образ изобилия, при этом использована естественная русская синтаксическая конструкция.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как и говорил
  rationale: Глагол означает «говорил/сказал»; перевод не подменяет его более толковательным «обещал».
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Бог твоих отцов
  rationale: Сохраняются мужской род исходного выражения и устойчивая заветная формула Пятикнижия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и согласуется с предоставленным консультационным решением.
- issue: Значение תּוֹרָה
  choice: закон
  alternative: наставление
  rationale: В данном заветном контексте «закон» наиболее ясно передаёт функцию текста, но более широкое значение еврейского слова отмечено в сноске.
- issue: Передача אֲבֹתֶיךָ
  choice: твоих отцов
  alternative: твоих предков
  rationale: Буквальная формула подчёркивает преемственность завета и не нейтрализует грамматически мужское обозначение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Синтаксис следует движению еврейской фразы; добавление «Иордан» исключено, поскольку в данном стихе оно лишь подразумевается контекстом.
