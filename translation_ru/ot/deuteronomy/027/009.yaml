  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: ru
  text: 'Затем Моисей и священники-левиты обратились ко всему Израилю со словами: «Храни молчание и слушай[a], Израиль! Сегодня ты стал народом Яхве, твоего Бога[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будь внимателен и слушай». Еврейский императив может подчёркивать как молчание, так и сосредоточенное внимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стал народом, принадлежащим Яхве, твоему Богу»; возможно также: «народом для Яхве, твоего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Затем ... обратились ... со словами
  rationale: Форма с וַ продвигает повествование, а глагол דבר обозначает речевое обращение; русский оборот естественно вводит прямую речь.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священники-левиты
  rationale: Сочетание называет священников как левитов; сложное наименование кратко сохраняет тесную связь двух обозначений.
- source_word: כָּל יִשְׂרָאֵל
  choice: всему Израилю
  rationale: Сохраняется собирательное обозначение всего народа и управление русского глагола «обратились».
- source_word: הַסְכֵּת
  choice: храни молчание
  rationale: Редкий императив в данном контексте призывает к молчаливому, сосредоточенному вниманию. Формулировка сохраняет конкретный оттенок молчания, не исключая значения внимательности.
- source_word: וּשְׁמַע
  choice: и слушай
  rationale: Императив שמע здесь требует внимательного восприятия; «слушай» естественнее современного русского «услышь».
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественный современный эквивалент дейктического выражения «в этот день».
- source_word: נִהְיֵיתָ לְעָם
  choice: ты стал народом
  rationale: Единственное число сохраняет обращение к Израилю как к единому целому, а «народом» передаёт לְעָם без добавления определённости.
- source_word: לַיהוָה
  choice: народом Яхве
  rationale: При היה + ל конструкция выражает принадлежность или заветное отношение. Русский родительный оборот естественно передаёт принадлежность, а примечание сохраняет более развёрнутый вариант.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Местоимение второго лица единственного числа согласовано с корпоративным обращением к Израилю.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Корпоративное обращение к Израилю в единственном числе
  choice: ты стал народом
  alternative: вы стали народом; Израиль стал народом
  rationale: Еврейские формы стоят во втором лице мужского рода единственного числа и представляют Израиль как единое заветное целое; это сохраняется в переводе.
- issue: Значение принадлежности в לַיהוָה
  choice: народом Яхве
  alternative: народом для Яхве; народом, принадлежащим Яхве
  rationale: Конструкция допускает буквальный оттенок направленности «для», но в сочетании с היה прежде всего выражает принадлежность. Основной текст передаёт её кратко, а примечание показывает развёрнутую возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямого заветного обращения. Единственное число последовательно сохраняет собирательный образ Израиля. «Храни молчание» несколько возвышенно, но понятно и точнее удерживает вероятный конкретный смысл редкого еврейского императива.
