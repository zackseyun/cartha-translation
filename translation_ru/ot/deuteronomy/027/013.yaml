base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: ru
  text: 'А эти должны встать на горе Гевал при провозглашении проклятия[a]: Рувим, Гад, Ашер, Завулон, Дан и Неффалим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для проклятия»; также возможно: «для произнесения проклятия».'
    reason: Выражение עַל הַקְּלָלָה кратко обозначает назначение колен в связи с проклятием. Оно не уточняет прямо, кто именно произносит его.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: А эти
  rationale: Сочетание союза с указательным местоимением вводит вторую, противопоставленную предыдущей, группу; «А эти» естественно передаёт эту связь по-русски.
- source_word: יַעַמְדוּ
  choice: пусть станут
  rationale: Имперфект в контексте распоряжения Моисея выражает предписание; конструкция «пусть станут» сохраняет его директивный характер и торжественный регистр.
- source_word: עַל הַקְּלָלָה
  choice: для проклятия
  rationale: Предлог עַל здесь указывает на назначение или связь с обрядовым провозглашением проклятия. Краткая формулировка сохраняет неоднозначность еврейского текста и параллель с благословением в предыдущем стихе.
- source_word: בְּהַר עֵיבָל
  choice: на горе Гевал
  rationale: Предлог בְ обозначает местонахождение; «на горе» — естественное русское соответствие. Имя передано в принятой русской библейской форме.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Принятая в русской библейской традиции форма имени колена.
- source_word: גָּד
  choice: Гад
  rationale: Принятая в русской библейской традиции форма имени колена.
- source_word: אָשֵׁר
  choice: Асир
  rationale: Принятая в русской библейской традиции форма имени колена.
- source_word: זְבוּלֻן
  choice: Завулон
  rationale: Принятая в русской библейской традиции форма имени колена.
- source_word: דָּן
  choice: Дан
  rationale: Принятая в русской библейской традиции форма имени колена.
- source_word: נַפְתָּלִי
  choice: Неффалим
  rationale: Принятая в русской библейской традиции форма имени колена.
theological_decisions:
- issue: Обрядовая функция колен по отношению к проклятию
  choice: для проклятия
  alternative: для провозглашения проклятия; чтобы произносить проклятие
  rationale: В еврейском тексте нет явно выраженного глагола «провозглашать» или «произносить». Контекст указывает на обрядовую роль колен, однако основной текст не уточняет её сверх сказанного в оригинале.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формой предписания. Сохранены традиционные русские библейские формы имён; синтаксис сделан естественным без избыточного уточнения подразумеваемого обряда.
