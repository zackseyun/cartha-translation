  source_fidelity: Список колен и местонахождение переданы верно. Однако выражение «пусть станут для проклятия» в современном русском звучит неестественно и может быть понято как «станут проклятыми». Еврейское עַל הַקְּלָלָה обозначает связь колен с проклятием в церемонии, но само по себе не называет их произносящими проклятие; поэтому агентность следует не навязывать.
  naturalness: «А эти должны встать на горе Гевал при провозглашении проклятия» — современная литературная и ясная формулировка. Она передаёт предписывающий оттенок имперфекта и ритуальную связь с проклятием без неудачного оборота «для проклятия».
  terminology: '«Гевал», «Рувим», «Гад», «Завулон», «Дан» и «Неффалим» соответствуют традиционным русским библейским формам. Для אָשֵׁר предпочтительно «Ашер»: форма «Асир» архаична для современного литературного текста и омонимична обычному слову «асир» («пленный, заключённый»).'
