lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Предикативная форма вводит формулу заветного проклятия; «проклят» точно, ясно и соответствует торжественно-правовому контексту.
- source_word: שֹׁכֵב עִם
  choice: ложится с
  rationale: В данном контексте это устойчивый эвфемизм, обозначающий половую связь. Русское «ложится с» сохраняет образ и эвфемистический характер еврейского выражения.
- source_word: חֹתַנְתּוֹ
  choice: со своей тёщей
  rationale: Существительное обозначает мать жены, а суффикс — принадлежность третьему лицу мужского рода единственного числа; прямой современный эквивалент — «его/своей тёщей». Возвратное «своей» естественно соотносит родство с субъектом.
- source_word: וְאָמַר
  choice: И ... скажет
  rationale: Перфект с союзом продолжает предписанную литургическую формулу; в русском будущем времени единственное число согласуется с собирательным существительным «народ».
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Передаёт всеобщность ответа без добавления не выраженного непосредственно уточнения «Израиля».
- source_word: אָמֵן
  choice: Аминь
  rationale: Традиционная и общепонятная русская передача еврейского литургического возгласа.
theological_decisions:
- issue: Эвфемизм для половой связи в правовой формуле
  choice: 'Сохранить еврейский образ: «ложится со своей тёщей»'
  alternative: «вступает в половую связь со своей тёщей»
  rationale: Так сохраняются сдержанность и формальная близость к источнику, при этом смысл в данном контексте остаётся понятным.
- issue: Грамматически мужской субъект
  choice: «тот, кто»
  alternative: «мужчина, который»
  rationale: Форма сохраняет единственное число и мужскую соотнесённость через последующее «со своей тёщей», не добавляя в основной текст существительного, отсутствующего в еврейском.
translation_notes:
  register: Современный литературный русский язык с торжественной краткостью заветной и литургической формулы. Пунктуация делает прямой ответ народа явным, не добавляя смысловых элементов.
