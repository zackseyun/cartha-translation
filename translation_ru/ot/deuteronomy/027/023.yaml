  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: ru
  text: 'Проклят тот, кто ляжет[а] со своей тёщей. И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Буквально: «ляжет с». Это еврейский эвфемизм, обозначающий половую связь.'
