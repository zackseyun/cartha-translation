    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обнажил край (или полу) одежды своего отца». Это сексуальный эвфемизм, связанный с языком Лев 18:8 и 20:11; по смыслу также возможно: «обнажил наготу своего отца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Сохраняет краткую формулу заветного проклятия и естественно звучит в современном русском языке.
- source_word: שֹׁכֵב עִם
  choice: ложится с
  rationale: Передаёт устойчивый древнееврейский эвфемизм половой связи, сохраняя юридический и библейский регистр без клинической конкретизации.
- source_word: אֵשֶׁת אָבִיו
  choice: с женой своего отца
  rationale: Буквально передаёт родственное обозначение и не сужает его до «мачехи», чего древнееврейский текст прямо не говорит.
- source_word: כִּי
  choice: потому что
  rationale: Ясно передаёт причинное основание проклятия.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: открыл край одежды своего отца
  rationale: 'Сохраняет необычный образ исходного текста: כָּנָף означает крыло, край или полу одежды; здесь выражение служит сексуальным эвфемизмом и отсылает к нарушению брачных прав отца.'
- source_word: וְאָמַר כָּל הָעָם
  choice: И весь народ скажет
  rationale: Передаёт формульный общий ответ народа в контексте провозглашения заветных проклятий.
- source_word: אָמֵן
  choice: Аминь
  rationale: Сохраняет традиционную литургическую передачу древнееврейского ответа.
theological_decisions:
- issue: Передача сексуального эвфемизма גִלָּה כְּנַף אָבִיו
  choice: Сохранить в основном тексте образ «открыл край одежды своего отца».
  alternative: «обнажил наготу своего отца» или пояснительное «посягнул на брачные права своего отца»
  rationale: Существительное כָּנָף буквально не означает «нагота», хотя выражение связано с языком запретов в Лев 18:8 и 20:11. Сохранение образа не устраняет подлинную лексическую неоднозначность и не заменяет её богословским толкованием.
- issue: Точное родственное отношение женщины
  choice: «жена своего отца»
  alternative: «мачеха»
  rationale: В данном контексте речь может идти о мачехе, однако исходный текст обозначает её именно как жену отца и не употребляет отдельного слова «мачеха».
translation_notes:
  register: Современный литературный русский язык с сохранением краткого, торжественного юридико-литургического строя. Архаизмы сведены к общеупотребительному библейскому ответу «Аминь»; необычный образ исходного текста сохранён и пояснён в сноске.
