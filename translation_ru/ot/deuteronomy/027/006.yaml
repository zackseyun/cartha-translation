    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: из цельных камней
  rationale: Прилагательное שְׁלֵמוֹת прямо означает «целые, цельные, неповреждённые». Перевод сохраняет его непосредственный смысл, а обусловленное контекстом понимание «необтёсанные» вынесено в сноску.
- source_word: תִּבְנֶה
  choice: построй
  rationale: Имперфект в данном предписании имеет повелительную силу. Совершенный вид и форма единственного числа естественно передают конкретное обращение к Израилю.
- source_word: מִזְבַּח
  choice: жертвенник
  rationale: Точный и общепонятный русский термин для сооружения, на котором приносят жертвы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: Суффикс второго лица мужского рода единственного числа выражает принадлежность и отношения завета; дательный падеж обусловлен русским синтаксисом.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: и принеси на нём
  rationale: В породе хифиль глагол עלה с названием жертвы означает её вознесение, то есть принесение в жертву. «Принеси» естественно передаёт это значение по-русски.
- source_word: עוֹלֹת
  choice: всесожжения
  rationale: Устоявшийся точный термин для жертв, полностью сжигаемых на жертвеннике.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата или посвящение жертвы; русский дательный падеж без дополнительного предлога передаёт это естественно.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Следует ли переводить שְׁלֵמוֹת как «необтёсанные»
  choice: цельные
  alternative: необтёсанные
  rationale: Само прилагательное означает «целые/цельные». Значение «необтёсанные» выводится из запрета применять к камням железное орудие в предыдущем стихе, поэтому оно сохранено как контекстуальная альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для текста заветного предписания. Повелительные формы звучат ясно и естественно; традиционные культовые термины «жертвенник» и «всесожжения» сохранены ради точности.
