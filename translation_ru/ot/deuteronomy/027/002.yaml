base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: ru
  text: И в тот день, когда вы перейдёте через Иордан в землю, которую Яхве, твой Бог, даёт тебе, поставь себе большие камни и покрой их известью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрой их известковой штукатуркой»; еврейское слово может обозначать известь либо изготовленное из неё покрытие.'
    reason: Лексическая неоднозначность названия материала שִׂיד.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם
  choice: В тот день, когда
  rationale: Еврейский оборот вводит будущую временную ситуацию. Такой перевод естественно передаёт её без буквального и тяжеловесного «и будет в тот день».
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: вы перейдёте Иордан
  rationale: Глагол עבר с названием реки означает переход с одного берега на другой; форма второго лица множественного числа сохранена.
- source_word: אֶל הָאָרֶץ
  choice: войдёте в землю
  rationale: Предлог אֶל обозначает направленность движения. Добавление естественного русского глагола «войдёте» ясно выражает переход в землю, не меняя смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: נֹתֵן
  choice: даёт
  rationale: Причастие представляет дарование земли как совершающееся и несомненное, поэтому настоящее время предпочтительнее будущего.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: поставь себе
  rationale: Порода Hiphil глагола קום здесь означает установить или поставить камни. Единственное число обращения и значение לְךָ сохранены.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: большие камни
  rationale: Прямое и естественное современное соответствие, обозначающее размер камней.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: обмажь их известью
  rationale: Глагол обозначает нанесение покрытия, а שִׂיד — известь или известковую штукатурку. «Обмажь известью» ясно передаёт действие и материал без неестественного повтора.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смена числа в обращении к Израилю
  choice: «вы перейдёте», затем «Бог твой… тебе… поставь себе»
  alternative: 'Последовательно множественное число: «Бог ваш… вам… поставьте себе»'
  rationale: Еврейский текст переходит от множественного תַּעַבְרוּ к единственному числу в אֱלֹהֶיךָ, לָךְ и וַהֲקֵמֹתָ לְךָ. Эта характерная для Второзакония смена коллективного обращения сохранена, несмотря на некоторую необычность по-русски.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Синтаксис сделан естественным, но намеренная смена множественного числа на единственное в еврейском коллективном обращении сохранена. Маркер сноски поставлен непосредственно после спорного выражения.
