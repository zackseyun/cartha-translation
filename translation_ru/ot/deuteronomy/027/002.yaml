  verdict: revise
  source_fidelity: 'Смена числа в обращении передана верно: после множественного «вы перейдёте» еврейский текст переходит к единственному числу («твой», «тебе», «установи»). Однако добавленное «и войдёте» разворачивает еврейское «перейдёте Иордан в землю» в два отдельных действия и не требуется для русского перевода. «Перейдёте через Иордан в землю» точнее воспроизводит синтаксическую связь исходного текста. Покрытие известью и лексическая сноска оправданны.'
  naturalness: «Обмажь» имеет разговорный оттенок, несколько сниженный для современного литературного библейского регистра. «Покрой их известью» естественно, ясно и сохраняет значение нанесения покрытия. «И в тот день, когда...» плавно передаёт начальный союз и временный оборот.
  terminology: «Яхве» корректно передаёт тетраграмматон. «Твой Бог» сохраняет единственное число оригинала. «Известь» — допустимое основное значение שִׂיד; сноска корректно отмечает возможность понимания как известкового покрытия.
