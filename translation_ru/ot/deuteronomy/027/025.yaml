    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Краткая именная формула точно передаёт предикативное прилагательное в формуле заветного проклятия и естественно звучит по-русски.
- source_word: לֹקֵחַ
  choice: тот, кто берёт
  rationale: Субстантивированное причастие выражает любое лицо, совершающее названное действие; эта конструкция сохраняет обобщённое значение и форму единственного числа.
- source_word: שֹׁחַד
  choice: взятку
  rationale: Обычный современный юридический термин для незаконного вознаграждения, побуждающего к преступному или неправосудному действию.
- source_word: לְהַכּוֹת
  choice: чтобы убить
  rationale: В сочетании с выражением «невинная кровь» глагол נכה обозначает нанесение смертельного удара; «убить» ясно передаёт итоговое значение контекста.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: невиновного
  rationale: Необычное сочетание נֶפֶשׁ с דָּם נָקִי относится к невиновному человеку, которого лишают жизни. Смысл передан естественно, а буквальный образ сохранён в сноске.
- source_word: וְאָמַר כָּל הָעָם
  choice: И весь народ скажет
  rationale: В предписывающем литургическом контексте перфект с вавом обозначает установленный ответ народа; русское будущее время передаёт это без архаизации.
- source_word: אָמֵן
  choice: Аминь
  rationale: Устоявшаяся русская литургическая форма сохраняет характер торжественного подтверждения сказанного.
theological_decisions:
- issue: Передача формулы проклятия в контексте завета
  choice: Проклят тот, кто берёт взятку, чтобы убить невиновного
  alternative: Проклят берущий взятку, чтобы поразить невинную кровь
  rationale: Основной вариант сохраняет юридическую и заветную силу высказывания, ясно называя подкуп ради убийства невиновного, но не вводит дополнительных мотивов или доктринальных толкований. Буквальная образность еврейского выражения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой, подходящей для публичного провозглашения. Слово «убить» выбрано ради ясности смертельного смысла; буквальная метафора крови вынесена в сноску.
