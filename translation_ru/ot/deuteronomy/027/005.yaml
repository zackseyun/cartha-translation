base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: ru
  text: И построй там жертвенник для Яхве, твоего Бога, — жертвенник из камней; не поднимай над ними железа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не применяй к ним железного орудия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: И устрой
  rationale: Qal с союзом в контексте предписания имеет повелительную силу. «Устрой» естественно сочетается с «жертвенник» и передаёт не только возведение, но и сооружение культового объекта.
- source_word: שָׁם
  choice: там
  rationale: Прямое соответствие локативному наречию, отсылающему к ранее указанному месту.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшееся русское обозначение сооружения для жертвоприношений.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: Яхве, твоему Богу
  rationale: Предлог ל обозначает посвящение адресату, а имя יהוה передано транслитерацией «Яхве», сохраняющей личное имя в исходном тексте.
- source_word: מִזְבַּח אֲבָנִים
  choice: жертвенник из камней
  rationale: Естественная русская передача конструкции, прямо указывающей материал сооружения.
- source_word: לֹא תָנִיף
  choice: не поднимай
  rationale: Сохраняет конкретный образ Hiphil глагола נוף и подлинную неоднозначность выражения; в контексте подразумевается применение железного орудия к камням.
- source_word: עֲלֵיהֶם בַּרְזֶל
  choice: над ними железа
  rationale: Буквально сохраняет пространственное отношение על и метонимическое «железо», не добавляя в основной текст отсутствующее существительное «орудие».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя יהוה. «Яхве» отличает его от титула «Господь» и сохраняет форму имени, при признании того, что точное древнее произношение полностью не засвидетельствовано.
translation_notes:
  register: Современный литературный русский с достоинством законодательного предписания. «Устрой» звучит естественнее буквального «построй» применительно к жертвеннику; конструкция после тире сохраняет повтор исходного текста. Местоимения, относящиеся к Богу, даны со строчной буквы по нормам современного русского изложения.
