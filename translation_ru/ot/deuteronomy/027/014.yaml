lexical_decisions:
- source_word: וְעָנוּ
  choice: ответят
  rationale: Глагол ענה в этой формуле вводит торжественный ответ или провозглашение. «Ответят» сохраняет буквальный и процедурный характер речи.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: В еврейском тексте прямо названы левиты, а не священники; поэтому более узкое обозначение не вводится.
- source_word: וְאָמְרוּ
  choice: и скажут
  rationale: Обычное значение אמר передано естественной русской формулой, сохраняющей последовательность двух глаголов речи.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: каждому израильтянину
  rationale: Так передаётся обращение ко всему собранию через форму единственного числа. Современное русское выражение не создаёт ложного впечатления, будто речь идёт лишь о некоторой группе мужчин; буквальная форма отмечена в сноске.
- source_word: קוֹל רָם
  choice: громким голосом
  rationale: Устойчивое соответствие для публичного, ясно слышимого и торжественного провозглашения.
theological_decisions:
- issue: Мужской род с собирательно-представительным значением в אִישׁ
  choice: каждому израильтянину
  alternative: каждому мужу Израиля / каждому человеку Израиля
  rationale: Еврейский текст использует существительное мужского рода в единственном числе как представительное обозначение членов Израиля. Основной вариант остаётся современным и естественным, а формальная особенность оригинала сохраняется в сноске без утверждения, что адресатами были исключительно мужчины.
translation_notes:
  register: Современный литературный русский язык с торжественным оттенком, уместным для публичного провозглашения завета. Сохранена традиционная парная формула «ответят и скажут», но избегнуто архаичное «муж Израиля» в основном тексте.
