  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: ru
  text: 'Проклят тот, кто лишает переселенца[a], сироту и вдову права на справедливый суд. И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. гер — не-израильтянин, живущий среди израильтян и находившийся под защитой закона.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Сохраняет краткую и торжественную форму заветного проклятия, естественную для современного русского языка.
- source_word: מַטֶּה
  choice: извращает
  rationale: Причастная форма глагола נטה в породе hифиль означает отклонение или искажение правосудия; «извращает» ясно передаёт намеренное нарушение справедливого судебного порядка.
- source_word: מִשְׁפַּט
  choice: правосудие в отношении
  rationale: В данном юридическом контексте слово обозначает справедливое судебное разбирательство и законное право уязвимого человека; русская конструкция остаётся точной и не перегруженной пояснениями.
- source_word: גֵּר
  choice: переселенца
  rationale: Обозначает не коренного жителя, постоянно живущего среди Израиля и находящегося в уязвимом общественно-правовом положении; «переселенец» естественнее современному читателю, чем «пришелец», а примечание уточняет исторический смысл.
- source_word: יָתוֹם
  choice: сироты
  rationale: Обычный и точный современный русский эквивалент для социально уязвимого ребёнка, лишённого отцовской защиты; контекст не требует уточнять, потерял ли он одного или обоих родителей.
- source_word: אַלְמָנָה
  choice: вдовы
  rationale: Прямой и однозначный эквивалент еврейского обозначения вдовы.
- source_word: וְאָמַר כָּל הָעָם
  choice: И весь народ скажет
  rationale: В последовательности обрядовых предписаний форма выражает установленный ответ народа; будущее время по-русски естественно передаёт эту литургическую инструкцию.
- source_word: אָמֵן
  choice: Аминь
  rationale: 'Сохраняется традиционная литургическая передача слова, выражающего подтверждение: «истинно», «да будет так».'
theological_decisions:
- issue: Передача социально-правовой триады без наложения современных политических категорий
  choice: переселенца, сироты и вдовы
  alternative: пришельца, лишённого отца и вдовы
  rationale: Формулировка сохраняет исторические категории уязвимых людей в законе Израиля, но звучит понятно и естественно для современного русского читателя.
- issue: Смысл מַטֶּה מִשְׁפַּט
  choice: извращает правосудие в отношении
  alternative: отклоняет судебное право
  rationale: Выбранный вариант передаёт осуждение несправедливого судебного обращения, не сужая смысл до одного технического юридического действия и не добавляя частной богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом заветной формулы. Синтаксис следует еврейскому тексту без ненужной архаизации; двоеточие естественно вводит установленный ответ народа.
