  text: וַ/יְצַ֤ו מֹשֶׁה֙ וְ/זִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת הָ/עָ֖ם לֵ/אמֹ֑ר שָׁמֹר֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: ru
  text: 'И Моисей и старейшины Израиля повелели народу: «Соблюдайте всю заповедь[a], которую я сегодня заповедую вам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все заповеди»; в еврейском тексте стоит единственное число, которое здесь может иметь собирательное значение.'
    reason: лексическая альтернатива и пояснение грамматического числа
lexical_decisions:
- source_word: וַיְצַו
  choice: повелели
  rationale: Глагол צוה обозначает властное предписание. Форма множественного числа согласуется с двумя однородными субъектами — Моисеем и старейшинами.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: и старейшины Израиля
  rationale: Союз «и» сохраняет еврейскую координацию Моисея и старейшин как совместных субъектов действия.
- source_word: הָעָם
  choice: народу
  rationale: В данном общинно-заветном контексте עָם естественно передаётся словом «народ».
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский ввод прямой речи естественно выражается в современном русском языке пунктуационно, без тяжеловесного «говоря».
- source_word: שָׁמֹר
  choice: Соблюдайте
  rationale: В контексте Божьего повеления שׁמר означает не только хранение, но и исполнение; «соблюдайте» ясно и естественно передаёт этот смысл.
- source_word: כָּל הַמִּצְוָה
  choice: всю заповедь
  rationale: Сочетание כָּל с существительным в единственном числе передано буквально и естественно; сохранено возможное собирательное значение.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: которую я ... заповедую вам
  rationale: Настоящее время передаёт актуальное повеление, а переход от совместного субъекта повествования к первому лицу единственного числа в речи сохранён без сглаживания.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и точный эквивалент временного указания; положение рядом с глаголом естественно для русского языка.
theological_decisions:
- issue: Число существительного מִצְוָה в заветном наставлении
  choice: 'единственное число с возможным собирательным смыслом: «всю заповедь»'
  alternative: 'множественное число: «все заповеди»'
  rationale: В еврейском тексте стоит единственное число. Его сохранение не устраняет возможный собирательный смысл и не подменяет авторскую формулировку более привычным множественным числом.
- issue: Переход от Моисея и старейшин к говорящему «я»
  choice: 'сохранить: «повелели… которую я… заповедую»'
  alternative: 'согласовать речь во множественном числе: «которую мы заповедуем»'
  rationale: Еврейский текст содержит реальный переход от совместного субъекта к первому лицу единственного числа; перевод не должен молча устранять эту особенность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Архаическое «говоря» заменено нормативным оформлением прямой речи; синтаксическая и богословская напряжённость оригинала сохранена.
