  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: ru
  text: '«Проклят тот, кто бесчестит[a] своего отца или свою мать!» И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пренебрегает», «относится с презрением». Еврейский глагол означает считать кого-либо незначительным, недостойным уважения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Страдательное причастие, вводящее формулу заветного проклятия; «проклят» точно и естественно передаёт её в русском библейско-правовом контексте.
- source_word: מַקְלֶה
  choice: бесчестит
  rationale: Форма от קלה выражает отношение к человеку как к незначительному, недостойному уважения. «Бесчестит» передаёт общественно-нравственную сторону проступка, не сводя его лишь к чувству или отдельному словесному действию.
- source_word: אָבִיו וְאִמּוֹ
  choice: своего отца или свою мать
  rationale: 'Местоименные суффиксы переданы возвратным притяжательным местоимением по нормам русского языка. Формальное «и» в данной правовой формуле имеет распределительный смысл: проклятие относится к бесчестью любого из родителей, поэтому естественно русское «или».'
- source_word: וְאָמַר כָּל הָעָם
  choice: И весь народ скажет
  rationale: Сохранены последовательность литургического действия, соединительная связь и прямое значение «весь народ» без добавления отсутствующего в еврейском тексте уточнения.
- source_word: אָמֵן
  choice: Аминь
  rationale: Традиционная русская передача торжественного литургического подтверждения сохраняет его заветный и богослужебный характер.
theological_decisions:
- issue: Характер проступка против родителей
  choice: бесчестит своего отца или свою мать
  alternative: пренебрегает своим отцом или своей матерью; относится с презрением к своему отцу или своей матери
  rationale: Еврейский глагол обозначает обращение с кем-либо как с малозначимым или достойным презрения. «Бесчестит» сохраняет связь с обязанностью почитать родителей и не ограничивает проступок только внутренним отношением, словами или одним конкретным действием.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем заветной формулы. Сохранены прямая речь, коллективный литургический ответ и традиционное «Аминь».
