  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: ru
  text: '«Проклят человек, который сделает резное или литое изображение[a] — мерзость для Яхве, дело рук ремесленника, — и поставит его в тайном месте». И весь народ ответит и скажет: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Литое изображение обычно изготовляли посредством отливки, нередко из металла.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Сохраняет краткую и торжественную формулу заветного проклятия.
- source_word: הָאִישׁ
  choice: человек
  rationale: В данном юридическом изречении существительное мужского рода имеет обобщающее значение; русское «человек» естественно передаёт и грамматическую форму, и представительный характер формулы.
- source_word: פֶסֶל
  choice: резное изображение
  rationale: Передаёт конкретный смысл изображения, изготовленного посредством резьбы, не сужая значение до общего слова «идол».
- source_word: מַסֵּכָה
  choice: литое изображение
  rationale: Указывает на способ изготовления отливкой; слово «металлическое» не добавлено в основной текст, поскольку материал прямо не назван.
- source_word: תּוֹעֲבַת יְהוָה
  choice: мерзость перед Яхве
  rationale: Сохраняет сильную оценочную лексику и выражает то, что отвратительно Яхве, естественно для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: дело рук ремесленника
  rationale: Близко передаёт еврейский оборот и подчёркивает человеческое происхождение изображения.
- source_word: וְשָׂם בַּסָּתֶר
  choice: и поставит его в тайном месте
  rationale: Глагол передан с учётом установки изображения, а существительное סֵתֶר — как скрытое от других место.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: И весь народ пусть ответит и скажет
  rationale: Передаёт предписанный общий ответ народа в торжественном литургическо-правовом контексте.
- source_word: אָמֵן
  choice: Аминь
  rationale: Сохраняет узнаваемую заветную и богослужебную формулу согласия и подтверждения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Обобщающее мужское единственное число הָאִישׁ
  choice: человек
  alternative: мужчина; всякий, кто
  rationale: «Человек» в русском языке является существительным мужского рода и естественно выполняет ту же обобщающую функцию, не превращая формулу в утверждение исключительно о мужчинах.
- issue: Характер запрещённого предмета
  choice: резное или литое изображение
  alternative: идол
  rationale: Конкретные способы изготовления сохранены, а культовая отвратительность предмета выражена последующим определением «мерзость перед Яхве»; более общее «идол» устранило бы это лексическое различие.
translation_notes:
  register: Современный литературный русский язык с торжественным звучанием формулы проклятия. Синтаксическая рамка и приложение сохранены, но порядок слов сделан естественным для русского чтения. «Пусть ответит и скажет» передаёт предписанный совместный отклик без архаического «да скажет».
