- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Прямо и естественно передаёт временное обстоятельство с предлогом ב.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив לאמר вводит содержание повеления, следующее далее; в современном русском двоеточие выполняет эту функцию естественнее, чем буквальное «говоря».
