base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: ru
  text: Итак, слушай голос Яхве, твоего Бога, и исполняй Его заповеди и установления, которые я заповедую тебе сегодня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повинуйся Яхве, твоему Богу». Еврейский оборот «слушать голос» часто включает в себя смысл послушания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: Итак, слушай голос
  rationale: Оборот שׁמע בקול означает внимательное слушание, предполагающее послушание. Перевод «слушай голос» сохраняет образ и не сводит значение только к «повинуйся», поскольку далее отдельно сказано об исполнении заповедей. Связка «итак» естественно передаёт продолжение и вывод в данном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Прямая передача формы с местоименным суффиксом второго лица единственного числа.
- source_word: וְעָשִׂיתָ
  choice: и исполняй
  rationale: Глагол עשה здесь означает осуществлять предписанное. «Исполняй» естественно сочетается в русском языке с заповедями и установлениями и точно передаёт практическое действие.
- source_word: מִצְוֺתָיו
  choice: Его заповеди
  rationale: «Заповеди» сохраняет нормативный и заветно-правовой оттенок מִצְוֹת.
- source_word: חֻקָּיו
  choice: Его установления
  rationale: «Установления» различает חֻקִּים и «заповеди», оставаясь понятным современному читателю.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: которые я заповедую тебе
  rationale: Причастная форма передаёт действие, совершаемое в момент речи Моисея; настоящее время сохраняет непосредственность обращения.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественный современный эквивалент, сохраняющий характерный для Второзакония акцент на нынешнем моменте заветного обращения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: 'Смысл שׁמע בקול: слушание или повиновение'
  choice: слушай голос
  alternative: повинуйся
  rationale: В еврейском обороте присутствует смысл послушания, но образ слушания остаётся лексически значимым. Основной текст сохраняет этот образ, а сноска сообщает более явно выраженную смысловую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Императивные формы естественно передают предписывающую силу высказывания; местоимение «Его» написано с прописной буквы согласно распространённой русской религиозно-литературной норме.
