base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: ru
  text: '«Проклят тот, кто ложится с каким-либо животным». И весь народ скажет[a]: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение «тот, кто ложится» стоит в форме мужского рода единственного числа; возможен также обобщённый перевод: «всякий, кто ложится».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Предикативное прилагательное открывает формулу заветного проклятия; «проклят» сохраняет её торжественную и декларативную силу.
- source_word: שֹׁכֵב עִם
  choice: ложится с
  rationale: В данном правовом контексте это эвфемизм половой связи. Русское «ложится с» сохраняет эвфемистический характер оригинала, не делая выражение ни чрезмерно прямым, ни неясным.
- source_word: כָּל בְּהֵמָה
  choice: с каким-либо животным
  rationale: כָּל при существительном в единственном числе имеет распределительное значение, а בְּהֵמָה здесь обозначает животное как широкую категорию; «каким-либо животным» естественно передаёт смысл запрета.
- source_word: שֹׁכֵב
  choice: тот, кто ложится
  rationale: Причастие мужского рода единственного числа употреблено субстантивно. Основной текст сохраняет естественную русскую формулу без добавления отсутствующего в еврейском слова «мужчина»; грамматический мужской род отмечен в сноске.
- source_word: וְאָמַר כָּל הָעָם
  choice: И весь народ скажет
  rationale: Сочетание waw с перфектом продолжает предписанную церемониальную последовательность; будущее время по-русски передаёт её литургически-перформативный характер.
- source_word: אָמֵן
  choice: Аминь
  rationale: Традиционная литургическая передача сохраняет форму и функцию заветного подтверждения.
theological_decisions:
- issue: Мужской род субстантивированного причастия в формуле проклятия
  choice: тот, кто ложится
  alternative: мужчина, который ложится; всякий, кто ложится
  rationale: Еврейская форма грамматически мужского рода и единственного числа, но отдельного существительного «мужчина» в тексте нет. Формулировка «тот, кто» сохраняет мужской род и не добавляет лексического уточнения; сноска сообщает о форме оригинала, не снимая возможной обобщённой юридической функции.
translation_notes:
  register: Современный литературный русский язык с торжественной краткостью заветной формулы. Эвфемизм оригинала сохранён; синтаксис сделан естественным для публичного литургического чтения.
