  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: ru
  text: '«Проклят тот, кто передвигает межевой знак[a] своего ближнего». И весь народ скажет: «Аминь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «границу владения своего ближнего». Еврейское слово может обозначать как границу земельного участка, так и знак, которым она отмечена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Сохраняет краткую предикативную формулу заветного проклятия и её юридическую силу; это естественное и общеупотребительное русское соответствие.
- source_word: מַסִּיג
  choice: тот, кто передвигает
  rationale: Причастие обозначает человека, совершающего данное действие. «Передвигает» передаёт неправомерное смещение, а не только полное удаление межевого знака.
- source_word: גְּבוּל
  choice: межевой знак
  rationale: В контексте земельного права слово обозначает границу владения и может конкретно относиться к знаку, которым она отмечена. «Межевой знак» ясно передаёт смысл действия.
- source_word: רֵעֵהוּ
  choice: своего ближнего
  rationale: Слово обозначает другого члена сообщества в межличностном и правовом контексте; «ближний» сохраняет этот смысл и соответствует притяжательному суффиксу.
- source_word: וְאָמַר
  choice: И … скажет
  rationale: Глагол продолжает литургико-правовую формулу общего подтверждения; будущее время естественно выражает предписанный ответ народа.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Точно передаёт выражение без добавления контекстуально подразумеваемого уточнения «Израиля».
- source_word: אָמֵן
  choice: Аминь
  rationale: Устоявшийся литургический ответ, сохраняющий значение общего подтверждения произнесённого проклятия.
theological_decisions:
- issue: Формула проклятия в контексте закона завета
  choice: Проклят тот, кто передвигает межевой знак своего ближнего
  alternative: Проклят сдвигающий границу владения своего ближнего
  rationale: Перевод сохраняет торжественную юридическую формулу и конкретный характер мошеннического посягательства на чужое земельное владение, не добавляя doctrинальных толкований.
- issue: Мужской род причастия и притяжательного суффикса
  choice: тот, кто … своего ближнего
  alternative: всякий, кто … чужую межу
  rationale: Форма единственного мужского рода сохранена как типовой правовой случай; при этом не вводится отсутствующее в тексте обобщение «всякий» и не устраняется отношение к ближнему.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой, уместной для публичного провозглашения закона. «Межевой знак» понятен в земельно-правовом контексте и точнее, чем архаичное «межевой столб»; синтаксис остаётся ясным для обычного читателя.
