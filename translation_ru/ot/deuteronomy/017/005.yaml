  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: ru
  text: то выведите к городским воротам[b] того мужчину или ту женщину, кто совершил это злое дело[a], — мужчину или женщину, — и побейте их камнями, и они умрут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это злое деяние». Еврейское слово דָּבָר может также означать «дело» или «обстоятельство», в том числе в юридическом контексте.'
    reason: lexical_alternative
  - marker: b
    text: Городские ворота в древнем Израиле служили общественным местом суда и иных правовых разбирательств.
    reason: cultural_note
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: то выведите
  rationale: Союз с перфектом в законодательной последовательности обозначает следующий процедурный шаг; «то выведите» естественно передаёт эту связь с условием предыдущего контекста.
- source_word: הָאִישׁ הַהוּא אוֹ אֶת הָאִשָּׁה הַהִוא
  choice: того мужчину или ту женщину
  rationale: Сохраняет указательность и прямо названную в еврейском тексте пару мужского и женского пола.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которые совершили
  rationale: Форма множественного числа согласуется с парной формулировкой «мужчину или женщину»; русское «которые» сохраняет формальную неоднозначность числа фактических виновных, хотя речь идёт об одном из двух.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: это злое дело
  rationale: דָּבָר в судебном контексте может обозначать дело, поступок или обстоятельство; «злое дело» естественно и сохраняет нравственную оценку רָע.
- source_word: אֶל שְׁעָרֶיךָ
  choice: к воротам вашего города
  rationale: Буквальные «твои ворота» в контексте Второзакония означают городские ворота как общественно-судебное место. Добавление «города» предотвращает неверное бытовое понимание, не заменяя образ ворот.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: и побейте их камнями
  rationale: Сохраняет явно названные камни и передаёт установленное судебное наказание естественной русской формулой.
- source_word: וָמֵתוּ
  choice: до смерти
  rationale: В данном сочетании еврейская заключительная фраза выражает результат побиения камнями. Русское «до смерти» ясно и без лишней модальности передаёт этот результат.
theological_decisions:
- issue: Гендерная формулировка закона
  choice: того мужчину или ту женщину
  alternative: того человека
  rationale: Еврейский текст намеренно называет и мужчину, и женщину; обобщение словом «человек» устранило бы эту явную парность.
- issue: Место судебного исполнения приговора
  choice: к воротам вашего города
  alternative: на место общественного суда
  rationale: Сохранён конкретный древнеизраильский образ ворот, но краткое уточнение «города» делает его понятным современному читателю без отвлечённой парафразы.
- issue: Результат смертной казни
  choice: побейте их камнями до смерти
  alternative: побейте их камнями, и они умрут
  rationale: Оба варианта возможны; слитная русская конструкция естественно выражает результат, не меняя юридической силы текста.
translation_notes:
  register: Современный литературный русский язык с торжественным юридическим оттенком. Повтор «мужчину или женщину» сохранён как риторико-правовое подчёркивание исходного текста. Маркеры сносок поставлены непосредственно после выражений, к которым относятся.
