  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: ru
  text: Если какое-либо судебное дело окажется для тебя слишком трудным — будь то различие между одним кровопролитием и другим[a], между одним судебным делом и другим[b] или между одним поражением и другим[c], — в спорных делах у твоих ворот[d], тогда встань и поднимись к месту, которое изберёт Яхве, твой Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между кровью и кровью». Речь идёт о различении дел, связанных с кровопролитием, вероятно включая убийство и вину за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «между одним судебным притязанием и другим». Еврейское слово может обозначать судебное дело, притязание или решение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «между одним повреждением и другим», «между одним недугом и другим» либо «между одной язвой и другой».'
    reason: lexical_alternative
  - marker: d
    text: Городские ворота в древнем Израиле обычно служили местом судебных разбирательств; поэтому выражение также означает «в твоих городах» или «в местных судах».
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: окажется для тебя слишком трудным
  rationale: В породе нифаль глагол выражает здесь не необычность, а невозможность или чрезмерную трудность вынести решение; судебный контекст требует именно такого смысла.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: дело, подлежащее суду
  rationale: דָבָר имеет широкое значение «дело, вопрос», а сочетание с לַמִּשְׁפָּט указывает на дело, требующее судебного решения.
- source_word: בֵּין דָּם לְדָם
  choice: между одним кровопролитием и другим
  rationale: Передаёт конкретный образ буквального «между кровью и кровью» и вместе с тем делает понятной речь о различении дел, связанных с убийством или виной за кровь.
- source_word: בֵּין דִּין לְדִין
  choice: между одним судебным делом и другим
  rationale: דִּין может обозначать судебное дело, притязание или решение. Выбранная формулировка сохраняет необходимую широту и естественно звучит по-русски.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: между одним поражением и другим
  rationale: נֶגַע может означать удар, повреждение, недуг или язву. «Поражение» сохраняет эту многозначность, не сводя выражение только к телесной травме или болезни.
- source_word: דִּבְרֵי רִיבֹת
  choice: спорные дела
  rationale: Кратко и естественно передаёт дела, ставшие предметом тяжбы или разбирательства.
- source_word: בִּשְׁעָרֶיךָ
  choice: в твоих воротах
  rationale: Сохранён древнеизраильский образ городских ворот как места местного суда; культурный смысл пояснён в сноске.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: встань и поднимись
  rationale: Сохраняет парные глаголы, побуждение к решительному действию и направленность движения вверх к избранному месту.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: место, которое изберёт
  rationale: Будущее время отражает перспективное значение формы yiqtol и характерную для Второзакония речь о месте, которое Бог ещё определит.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; форма «Яхве» передаёт личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Синтаксис исходного перечисления сохранён, но упорядочен для ясности. Формула «в твоих воротах» оставлена ради культурного образа и снабжена пояснением; неоднозначность נֶגַע и דִּין не устранена безоговорочно.
