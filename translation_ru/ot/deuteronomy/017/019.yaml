source:
  edition: WLC
  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: ru
  text: Она должна быть при нём, и он должен читать её[a] во все дни своей жизни, чтобы учиться бояться Яхве[b], своего Бога, соблюдать все слова этого закона и эти постановления и исполнять их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «читать в ней»; возможно также: «читать из неё».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благоговеть перед Яхве, своим Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Пусть она будет при нём
  rationale: Местоимение женского рода относится к «копии закона» из предыдущего стиха. «При нём» передаёт постоянную доступность и владение, не добавляя идеи лишь физического соседства.
- source_word: וְקָרָא בוֹ
  choice: и пусть он читает её
  rationale: Буквально конструкция означает «читать в ней», то есть читать содержащийся в свитке текст. В современном русском «читать её» естественно и ясно; формальная особенность отмечена в сноске.
- source_word: כָּל יְמֵי חַיָּיו
  choice: во все дни своей жизни
  rationale: Сохранены полнота и торжественный ритм еврейского выражения; смысл — на протяжении всей жизни.
- source_word: לְמַעַן יִלְמַד
  choice: чтобы научиться
  rationale: Точно выражает цель постоянного чтения. Русский инфинитив естественно соотносится с подлежащим предыдущей части.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: бояться Яхве, своего Бога
  rationale: '«Бояться» сохраняет широкий библейский смысл ירא: страх, благоговейный трепет и покорность. Имя יהוה передано как «Яхве».'
- source_word: לִשְׁמֹר
  choice: соблюдать
  rationale: В контексте заветных предписаний שׁמר означает хранить посредством верного исполнения; «соблюдать» — естественный современный юридико-религиозный эквивалент.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: все слова этого закона
  rationale: תורה здесь обозначает записанное заветное наставление с нормативной силой. «Закон» понятен широкому читателю, а «все слова» сохраняет форму оригинала.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: эти постановления
  rationale: «Постановления» естественно передаёт חֻקִּים как установленные обязательные нормы и сохраняет отличие термина от более широкого «закона».
- source_word: לַעֲשֹׂתָם
  choice: и исполнять их
  rationale: Передаёт буквальную идею «делать их» в естественной русской сочетаемости с законами и постановлениями, не сводя действие только к внутреннему согласию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Оригинал прямо употребляет личное имя Бога. «Яхве» сохраняет различие между именем и титулом и соответствует наиболее вероятной научной реконструкции произношения.
- issue: Смысл ירא в контексте завета
  choice: бояться
  alternative: почитать; благоговеть перед
  rationale: «Бояться» не устраняет напряжение между страхом, благоговением и послушанием, присутствующее в еврейском слове; пояснение в сноске предотвращает узкое понимание как одного лишь испуга.
translation_notes:
  register: Современный литературный русский с достоинством законодательного наставления. Повтор «и» и выражение «во все дни своей жизни» сохраняют размеренный ритм еврейского текста; устаревшие формы и узкоконфессиональная лексика исключены.
