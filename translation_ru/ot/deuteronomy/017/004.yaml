  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: ru
  text: 'и тебе сообщат об этом, и ты услышишь и тщательно расследуешь; и вот, это правда, дело достоверно установлено: эта мерзость совершена в Израиле,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: и тебе сообщат об этом
  rationale: Хофаль глагола נגד передаёт пассивное сообщение адресату. Русское «тебе сообщат» естественно сохраняет этот смысл; «об этом» восполняет подразумеваемый объект из контекста.
- source_word: וְשָׁמַעְתָּ
  choice: и ты услышишь
  rationale: Сохранено обычное значение שׁמע «слышать, услышать» без добавления толкования.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: и тщательно расследуешь
  rationale: В судебном контексте דרש означает расследовать или исследовать, а הֵיטֵב усиливает требование тщательности.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: «И вот» сохраняет функцию указания на установленный результат расследования и соответствует dignified modern Russian.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: если это правда и дело достоверно
  rationale: Сочетание выражает судебно подтверждённый факт. «Правда» передаёт אֱמֶת, а «дело достоверно» — твёрдо установленный характер сообщения в נָכוֹן הַדָּבָר. Условная связь естественно продолжается из предыдущего стиха и ведёт к предписанию в следующем.
- source_word: נֶעֶשְׂתָה
  choice: совершена
  rationale: Пассивная форма עשה указывает, что деяние действительно было совершено; русская краткая страдательная форма подходит к слову «мерзость».
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: эта мерзость
  rationale: «Мерзость» сохраняет сильную нравственно-заветную оценку תּוֹעֵבָה и традиционно, но понятно звучит в современном русском.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Фраза обозначает совершение проступка внутри общины Израиля и прямо передаётся по-русски.
theological_decisions:
- issue: Передача формулы судебного подтверждения אֱמֶת נָכוֹן הַדָּבָר
  choice: если это правда и дело достоверно
  alternative: и вот, это правда, дело подтверждено
  rationale: Выбранный вариант сохраняет два элемента подтверждения и условный синтаксический ход всего предписания, не превращая сообщение в преждевременный безусловный вывод.
- issue: Передача תּוֹעֵבָה
  choice: мерзость
  alternative: отвратительное деяние
  rationale: «Мерзость» удерживает особую силу отрицательной оценки во Второзаконии и не смягчает текст, при этом не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной юридической интонацией. Синтаксис сохраняет цепочку действий и условный переход к приговору следующего стиха; пунктуация помогает избежать тяжеловесности.
