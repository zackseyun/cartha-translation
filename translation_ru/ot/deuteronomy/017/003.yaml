    reason: lexical_alternative
  - marker: b
    text: Слова «чего Я не повелевал» могут относиться непосредственно ко «всему воинству небесному» или шире — ко всему описанному поклонению другим богам.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: и пойдёт
  rationale: В условно-правовом контексте форма продолжает условие из предыдущего стиха; русское будущее время естественно передаёт возможное действие.
- source_word: וַיַּעֲבֹד
  choice: и станет служить
  rationale: Глагол עבד при обозначении божеств выражает культовое служение. «Служить» сохраняет его основной образ и не дублирует последующий глагол поклонения.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямое значение выражения; вариант «чужим богам» мог бы привнести отсутствующий в тексте этнический оттенок.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: и поклоняться им
  rationale: Глагол обозначает поклон или простирание ниц. «Поклоняться» естественно для современного русского библейского регистра и сохраняет отличие от более широкого «служить».
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: — солнцу, луне или всему воинству небесному
  rationale: Перечень конкретизирует возможные предметы поклонения. Конструкция с тире передаёт тесную связь с местоимением «им», а «или» сохраняет разделительный характер ряда. «Воинство небесное» оставляет открытым собирательный смысл צבא.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: чего Я не повелевал
  rationale: Формулировка сохраняет буквальную идею отсутствия Божьего повеления, не заменяя её более истолковывающим «что Я запретил». Местоимение «чего» позволяет услышать отсылку как к перечисленному, так и ко всему акту идолопоклонства.
theological_decisions:
- issue: Объём значения заключительной относительной конструкции אֲשֶׁר לֹא צִוִּיתִי
  choice: «чего Я не повелевал» — формулировка с широкой возможной отсылкой
  alternative: «которому Я не повелевал поклоняться» — отнесение только ко «всему воинству небесному»
  rationale: Грамматически конструкция может примыкать к ближайшему выражению «всему воинству небесному», но в контексте может также подводить итог всему описанному идолопоклонству. Перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством правового библейского контекста. Начальные союзы сохранены, поскольку стих синтаксически продолжает условие предыдущего стиха; конечная запятая показывает продолжение предложения в следующем стихе.
