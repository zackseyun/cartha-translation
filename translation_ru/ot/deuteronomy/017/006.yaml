reference: Deuteronomy 17:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: ru
  text: По свидетельству двух свидетелей или трёх свидетелей[a] тот, кто подлежит смерти[b], должен быть предан смерти; по свидетельству одного свидетеля его нельзя предавать смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам двух свидетелей или трёх свидетелей». Это еврейское выражение означает свидетельские показания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тот, кому надлежит умереть»; то есть человек, подлежащий смертной казни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: по свидетельству
  rationale: Буквально «по устам»; в данном юридическом контексте это еврейская идиома, обозначающая свидетельские показания как основание для решения.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: двух свидетелей или трёх свидетелей
  rationale: Сохранён повтор слова «свидетелей», отражающий подчёркнутый юридический стиль еврейского текста.
- source_word: יוּמַת
  choice: должен быть предан смерти
  rationale: Каузативно-пассивная форма указывает не просто на смерть, а на приведение смертного приговора в исполнение.
- source_word: הַמֵּת
  choice: тот, кто подлежит смерти
  rationale: Субстантивированное причастие имеет сжатую, несколько эллиптическую форму и обозначает человека, за преступление которого предусмотрена смертная казнь, а не уже умершего.
- source_word: לֹא יוּמַת
  choice: его нельзя предавать смерти
  rationale: Передаёт категорический юридический запрет и естественно звучит на современном русском языке.
- source_word: עֵד אֶחָד
  choice: одного свидетеля
  rationale: Прямой перевод, сохраняющий противопоставление двум или трём свидетелям.
theological_decisions:
- issue: Значение הַמֵּת в законе о смертной казни
  choice: тот, кто подлежит смерти
  alternative: осуждённый на смерть; мёртвый
  rationale: Контекст устанавливает доказательный порог для смертной казни. Вариант «мёртвый» контекстуально невозможен, а «осуждённый на смерть» преждевременно предполагает уже вынесенный приговор. Выбранная формулировка сохраняет и юридический смысл, и некоторую сжатость оригинала.
translation_notes:
  register: Современный литературный русский язык с ясным юридическим звучанием. Сохранён повтор слова «свидетелей» и пассивная формулировка смертной казни; архаические обороты вроде «да будет умерщвлён» не использованы.
