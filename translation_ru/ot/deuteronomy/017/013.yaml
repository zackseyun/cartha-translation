  text: וְ/כָל הָ/עָ֖ם יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹ֥א יְזִיד֖וּ/ן עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: ru
  text: И весь народ услышит и убоится[a], и впредь не будет поступать дерзко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испугается». Объект страха в еврейском тексте не указан.'
    reason: Сохранение лексической и смысловой неоднозначности.
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: И весь народ
  rationale: Передаёт союз וְ и определённое выражение «весь народ», не добавляя отсутствующего в стихе уточнения «Израиля».
- source_word: יִשְׁמְעוּ
  choice: услышит
  rationale: Глагол שמע здесь означает, что народ услышит о совершившемся суде; форма единственного числа естественно согласуется в русском с собирательным существительным «народ».
- source_word: וְיִרָאוּ
  choice: и убоится
  rationale: Сохраняет краткость и отсутствие явно названного объекта страха. «Убоится» поддерживает возвышенный юридико-заветный регистр, оставаясь понятным современному читателю.
- source_word: וְלֹא יְזִידוּן
  choice: не будет поступать дерзко
  rationale: Hiphil глагола זיד выражает сознательную, надменную и непокорную дерзость; оборот обозначает действие, а не только внутреннее качество.
- source_word: עוֹד
  choice: впредь
  rationale: В данном контексте указывает на прекращение такого поведения в будущем; по-русски «впредь» естественно сочетается с запретом и юридическим регистром.
theological_decisions:
- issue: Природа страха, вызванного судом
  choice: «убоится» без указания объекта
  alternative: «убоится Господа» или «испугается наказания»
  rationale: В еврейском тексте объект при ירא не назван; перевод не решает, имеется ли в виду страх перед Богом, перед наказанием или оба смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным юридико-библейским оттенком. Собирательное «народ» требует глаголов в единственном числе. Формулировка избегает конфессиональных уточнений и сохраняет неоднозначность оригинала.
