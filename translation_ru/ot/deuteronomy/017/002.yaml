  verdict: revise
  source_fidelity: Смысл условной юридической формулы, общинная сфера («среди вас»), гендерная пара и общее указание на нарушение завета переданы верно. Однако יהוה следует последовательно передать как «Яхве», согласно исходному тексту и английскому аудиторскому следу, а не титулом «Господь».
  naturalness: 'Фраза в целом естественна для современного литературного русского и корректно сохраняет незавершённость синтаксиса запятой. Форму «мужчина или женщина, делающие зло» лучше заменить на «мужчина или женщина, которые делают зло»: это более гладко согласует относительное определение с парным обозначением лица.'
  terminology: «Завет» точно передаёт בְּרִיתוֹ. «Нарушая Его завет» — естественная нейтральная передача לַעֲבֹר без конфессионального уточнения. «Города» допустимо передаёт метонимическое «ворота» при наличии сноски. В сноске ошибочно стоит «в одних из ваших ворот» вместо буквального единственного «в одних из твоих ворот»; для современного русского лучше сформулировать «в одних из твоих городских ворот».
