  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: ru
  text: Если среди вас, в одном из городов[a], которые Яхве, ваш Бог, даёт вам, найдётся мужчина или женщина, которые делают зло в глазах Яхве, вашего Бога, нарушая Его завет[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в одних из твоих ворот»; «ворота» здесь могут обозначать город или поселение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «преступая Его завет»; «нарушая Его союз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: Вводит условие в формулировке казуистического закона.
- source_word: יִמָּצֵא
  choice: найдётся
  rationale: Передаёт нифаль и безлично-пассивный характер юридической формулы естественным русским выражением.
- source_word: בְקִרְבְּךָ
  choice: среди вас
  rationale: Обозначает присутствие внутри общины и естественно звучит по-русски.
- source_word: בְאַחַד שְׁעָרֶיךָ
  choice: в одном из городов
  rationale: Буквально «в одних из твоих ворот»; в данном употреблении «ворота» метонимически обозначают город или поселение, находящееся под местной юрисдикцией.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: которые Господь, ваш Бог, даёт вам
  rationale: Причастие נֹתֵן передано настоящим временем; согласование с множественным адресатом выбрано как нормативное для современного русского библейского повествования.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: мужчина или женщина
  rationale: Сохраняет явно названную в еврейском тексте гендерную пару.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: делающие зло
  rationale: Естественная русская передача идиомы «делать злое»; множественное причастие охватывает альтернативную пару без предпочтения одного рода.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: в глазах Господа, вашего Бога
  rationale: Сохраняет прозрачную древнееврейскую оценочную метафору.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: нарушая Его завет
  rationale: Деепричастие передаёт обстоятельственное отношение инфинитива к злому поступку, не уточняя заранее конкретную форму нарушения.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона в основном тексте.
theological_decisions:
- issue: Характер нарушения завета
  choice: «нарушая Его завет» без уточнения нарушенной заповеди
  alternative: «преступая Его завет»; «чтобы нарушить Его завет»
  rationale: Сам стих говорит о нарушении завета в общем виде, тогда как конкретный проступок раскрывается далее; перевод не опережает контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-заветной речи. Множественное «вы» естественно передаёт собирательное обращение к Израилю; прописная буква в «Его» соответствует русской религиозной издательской традиции. Стих намеренно заканчивается запятой, поскольку синтаксическое условие продолжается в следующих стихах.
