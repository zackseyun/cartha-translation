base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: ru
  text: И приди к священникам-левитам и к судье, исполняющему обязанности в то время, и спроси их; они объявят тебе решение по делу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слово суда». Это выражение обозначает авторитетное судебное решение по рассматриваемому делу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: И приди
  rationale: Форма совершенного вида с союзом в контексте закона передаёт предписание; русский императив естественно выражает обязательное действие.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: к священникам-левитам
  rationale: Сочетание обозначает священников из левитов, не утверждая, что все левиты были священниками.
- source_word: הַשֹּׁפֵט
  choice: к судье
  rationale: Прямое и общепонятное обозначение должностного лица, разрешающего судебные дела.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: который будет в то время
  rationale: Передаёт указание на судью, исполняющего эту роль в рассматриваемое время, не вводя имени или постоянного носителя должности.
- source_word: וְדָרַשְׁתָּ
  choice: и спроси их
  rationale: В судебном контексте глагол означает обратиться за авторитетным разъяснением или решением; простой русский глагол сохраняет доступность текста.
- source_word: וְהִגִּידוּ לְךָ
  choice: они объявят тебе
  rationale: Hiphil глагола נגד выражает официальное сообщение вынесенного решения; «объявят» сохраняет формально-правовой оттенок.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: решение по делу
  rationale: Буквально «слово суда/судебного решения»; в данном контексте речь идёт об авторитетном решении конкретного спорного дела.
theological_decisions:
- issue: Характер полномочий священников и судьи
  choice: Передать их совместно как действующих участников судебного обращения, не уточняя распределение их полномочий.
  alternative: Истолковать одного из них как высшую или единственную инстанцию.
  rationale: Еврейский текст называет обе стороны и употребляет множественное число «они объявят», но не объясняет здесь внутреннее устройство суда.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным юридическим оттенком. Синтаксический параллелизм еврейского предписания сохранён без излишней архаизации.
