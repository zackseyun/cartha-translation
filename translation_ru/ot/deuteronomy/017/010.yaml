  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: ru
  text: Поступай согласно тому[a], что они объявят тебе из того места, которое изберёт Яхве, и тщательно исполняй всё так, как они тебя наставят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно решению». Еврейское слово דָּבָר может означать «слово», «дело» или, в судебном контексте, «решение».'
    reason: Лексическая альтернатива, сохраняющая судебный оттенок многозначного еврейского слова.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Поступай
  rationale: Глагол עשה имеет широкое значение «делать, поступать». В сочетании с עַל־פִּי естественное русское «поступай согласно» передаёт обязательную юридическую силу предписания.
- source_word: עַל פִּי הַדָּבָר
  choice: согласно слову
  rationale: Оборот עַל־פִּי означает «согласно, на основании, по указанию», а דָּבָר — «слово, дело, решение». Основной текст сохраняет образ еврейского оригинала, а судебное значение «решение» отмечено в сноске.
- source_word: יַגִּידוּ לְךָ
  choice: они объявят тебе
  rationale: Порода hифиль глагола נגד означает «сообщать, объявлять, давать знать». «Объявят» соответствует официальному характеру решения в данном контексте.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: с того места, которое изберёт Яхве
  rationale: Предлог מִן передан как «с», а форма יִבְחַר — будущим временем, уместным в перспективе Второзакония. «То место» сохраняет указательное значение הַהוּא.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: и тщательно исполняй
  rationale: Сочетание שׁמר с инфинитивом выражает внимательное, неукоснительное соблюдение. «Тщательно исполняй» естественно передаёт этот смысл по-русски.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: всё, чему они тебя наставят
  rationale: Форма hифиль от ירה обозначает авторитетное наставление или указание, в особенности правовое. «Наставят» сохраняет более широкий смысл, чем исключительно судебное «постановят».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между личным именем и титулом.
- issue: Характер указания священников и судьи
  choice: слово / наставят
  alternative: решение / постановят
  rationale: Контекст является судебным, но слова דָּבָר и ירה шире узких юридических терминов. Основной текст сохраняет эту смысловую широту, а судебное значение דָּבָר отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формы единственного числа передают обращение еврейского текста к Израилю как к одному адресату; множественное «они» сохраняет отсылку к священникам и судье из ближайшего контекста.
