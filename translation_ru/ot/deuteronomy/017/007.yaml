base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: ru
  text: Свидетели должны первыми принять участие в приведении его в исполнение, чтобы предать его смерти,[a] а затем — весь народ. Так искорени зло из своей среды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука свидетелей должна быть на нём первой… а после — рука всего народа». Это правовой оборот, возлагающий на свидетелей первичную ответственность за исполнение приговора.'
    reason: cultural_note
lexical_decisions:
- source_word: יַד הָעֵדִים ... וְיַד כָּל הָעָם
  choice: свидетели должны первыми поднять на него руку ... а затем — весь народ
  rationale: Еврейское «рука» обозначает непосредственное участие и ответственность при исполнении приговора. Русский оборот «поднять на него руку» сохраняет образ действия, а повторное упоминание «руки» естественно опускается во второй части.
- source_word: הָעֵדִים
  choice: свидетели
  rationale: Речь идёт о свидетелях в судебном процессе, а не просто об обвинителях.
- source_word: לַהֲמִיתוֹ
  choice: чтобы предать его смерти
  rationale: Каузативная форма глагола מות означает причинить смерть; выбранное выражение передаёт официальный судебный контекст.
- source_word: בָרִאשֹׁנָה ... בָּאַחֲרֹנָה
  choice: первыми ... а затем
  rationale: 'Сохранена установленная текстом последовательность: свидетели начинают исполнение приговора, после них участвует народ.'
- source_word: וּבִעַרְתָּ הָרָע
  choice: так искорени зло
  rationale: В законодательных формулах Второзакония בער означает устранение зла из общины, а не буквальное сожжение. «Искорени» сохраняет категоричность формулы.
- source_word: מִקִּרְבֶּךָ
  choice: из своей среды
  rationale: Выражение указывает на удаление зла из сообщества, к которому обращено повеление; сохранено единственное число обращения.
theological_decisions:
- issue: Объект устранения в формуле וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: искорени зло из своей среды
  alternative: истреби злодея из своей среды
  rationale: Масоретский текст прямо говорит «зло», не называя объект формулы «злодеем». Более широкая формулировка сохраняет правовой и богословский акцент на удалении зла из общины и не сужает смысл до одного человека.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Синтаксис упрощён ради ясности, но образ «поднять руку», последовательность исполнения приговора и формула удаления зла сохранены.
