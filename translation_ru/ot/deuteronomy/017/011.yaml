source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: ru
  text: Поступай по наставлению, которое они дадут тебе[a], и по решению, которое они объявят тебе. Не уклоняйся от слова, которое они сообщат тебе[b], ни вправо, ни влево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по закону, который они укажут тебе»; еврейское тора может означать закон, учение или наставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от дела» или «от решения»; еврейское давар может означать слово, дело или постановление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: по
  rationale: 'Еврейская идиома означает соответствие чему-либо: «согласно», «в соответствии с». В сочетании «поступай по» это естественно передаёт обязательность предписания.'
- source_word: הַתּוֹרָה
  choice: наставлению
  rationale: תּוֹרָה может обозначать закон, учение или наставление. Здесь речь идёт об авторитетном указании по конкретному судебному делу; «наставление» сохраняет широту слова и не сводит его только к писаному закону.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: которое они дадут тебе
  rationale: Порода hifil глагола ירה означает «наставлять, указывать». Сочетание «дать наставление» естественно по-русски и сохраняет значение авторитетного указания.
- source_word: הַמִּשְׁפָּט
  choice: решению
  rationale: В данном судебном контексте מִשְׁפָּט означает вынесенное решение или постановление. «Решение» ясно и естественно для современного читателя.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: которое они объявят тебе
  rationale: אָמַר обычно значит «сказать»; здесь формальное «объявят» соответствует сообщению судебного решения и поддерживает достойный правовой регистр.
- source_word: תַּעֲשֶׂה
  choice: поступай
  rationale: Имперфект имеет обязательную силу. Русский императив кратко и естественно передаёт прямое предписание, относящееся и к наставлению, и к решению.
- source_word: לֹא תָסוּר
  choice: не уклоняйся
  rationale: סוּר означает «сворачивать, отступать, уклоняться». Выбор сохраняет образ отклонения, развитый словами «ни вправо, ни влево».
- source_word: הַדָּבָר
  choice: слова
  rationale: דָּבָר допускает значения «слово», «дело», «решение». «Слово» сохраняет буквальную многозначность и торжественность, тогда как контекст указывает на постановление.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: которое они возвестят тебе
  rationale: Hifil глагола נגד означает «сообщить, объявить, сделать известным». «Возвестят» отличает этот глагол от предыдущего אָמַר и соответствует официальному контексту, не становясь непонятным.
- source_word: יָמִין וּשְׂמֹאל
  choice: ни вправо, ни влево
  rationale: Устойчивая пространственная формула обозначает любое отклонение; русская конструкция с повтором «ни» естественно передаёт всеохватный запрет.
theological_decisions:
- issue: Объём повиновения священнической и судебной власти
  choice: Передать обязательность исполнения наставления и решения, вынесенных по рассматриваемому делу, не расширяя утверждение за пределы данного контекста.
  alternative: Понять стих как утверждение безусловной и непогрешимой власти любых последующих религиозных учреждений.
  rationale: Еврейский текст говорит о судебном порядке заветного Израиля и требует подчинения вынесенному здесь решению, но сам по себе не формулирует более поздних экклезиологических положений.
translation_notes:
  register: Современный литературный русский язык с сдержанным правовым и библейским достоинством. Повелительные формы передают обязательную силу еврейских имперфектов; лексическая неоднозначность תּוֹרָה и דָּבָר сохранена в тексте и обозначена в примечаниях.
