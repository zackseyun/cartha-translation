  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: ru
  text: Он не должен брать себе много жён[a], чтобы его сердце не уклонилось; не должен также чрезмерно накапливать серебро и золото.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть его сердце не уклоняется». Еврейский текст допускает понимание этих слов как отдельного запрета, а не как указания на цель или возможный результат предыдущего запрета.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: умножает
  rationale: Порода hифиль глагола רבה обозначает увеличение числа или чрезмерное накопление. Повтор «умножает» сохраняет формальную связь между двумя запретами.
- source_word: נָשִׁים
  choice: жён
  rationale: В контексте предписаний царю речь идёт о супругах, а не о женщинах вообще.
- source_word: יָסוּר
  choice: уклонилось
  rationale: Глагол סור передаёт образ отклонения или отступления. «Уклонилось» естественно сочетается со словом «сердце» и не добавляет отсутствующего в тексте объекта отступления.
- source_word: לְבָבוֹ
  choice: его сердце
  rationale: «Сердце» сохраняет библейский образ внутренней воли, привязанностей и направленности человека.
- source_word: כֶּסֶף וְזָהָב
  choice: серебра и золота
  rationale: Конкретные названия драгоценных металлов сохраняют прямой смысл и парность еврейского выражения.
- source_word: מְאֹד
  choice: чрезмерно
  rationale: Наречие подчёркивает недопустимую чрезмерность накопления; «чрезмерно» ясно и естественно передаёт этот смысл по-русски.
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: и пусть не ... чтобы ... и пусть не
  rationale: Форма сохраняет законодательный тон, а среднюю часть передаёт как вероятное предостережение о цели или результате, не скрывая допустимого синтаксического варианта в сноске.
theological_decisions:
- issue: Связь между умножением жён и уклонением сердца
  choice: 'Средняя часть передана как цель или возможный результат первого запрета: «чтобы его сердце не уклонилось».'
  alternative: «И пусть его сердце не уклоняется» — самостоятельный, согласованный с соседними запрет.
  rationale: Еврейский синтаксис допускает оба прочтения. Контекст естественно поддерживает причинно-следственную связь, однако альтернативное понимание сохранено в сноске. Объект уклонения не добавлен, поскольку в еврейском тексте он не назван.
translation_notes:
  register: Современный литературный русский язык с ясным законодательным тоном. Повтор «умножает себе» намеренно сохраняет структуру и параллелизм еврейского текста; архаичные формы вроде «дабы» не используются.
