base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: ru
  text: Когда он сядет на престол своего царства, пусть запишет для себя в книге копию этого закона по тексту, находящемуся у священников-левитов[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от/из перед священниками-левитами». Вероятно, речь идёт об образцовом тексте закона, находившемся в их ведении; возможно также понимание: «в их присутствии».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «священники, левиты»; традиционный смысловой перевод: «священники-левиты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: Когда он сядет
  rationale: Еврейская конструкция вводит временное условие предписания. Русское «когда он сядет» естественно передаёт вступление царя на престол, не утяжеляя фразу буквальным «и будет».
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: на престол своего царства
  rationale: Сохранены конкретный образ престола и зависимое существительное «царства», без смыслового сжатия до «царский престол».
- source_word: וְכָתַב לוֹ
  choice: пусть перепишет для себя
  rationale: В данном законодательном контексте форма выражает предписание; «для себя» передаёт дательный личной заинтересованности. Глагол «перепишет» естественно указывает на изготовление собственной копии с существующего текста.
- source_word: מִשְׁנֵה הַתּוֹרָה הַזֹּאת
  choice: этот закон по экземпляру
  rationale: מִשְׁנֵה обозначает копию или дубликат, а תּוֹרָה в ближайшем законодательном контексте — данный закон, то есть свод наставлений. Русская конструкция избегает тяжеловесного сочетания «копию... с копии», сохраняя смысл изготовления собственного списка.
- source_word: עַל סֵפֶר
  choice: в свиток
  rationale: סֵפֶר обозначает письменный документ и в древнем контексте, вероятнее всего, свиток. «В свиток» конкретно и понятно передаёт материальный носитель текста.
- source_word: מִלִּפְנֵי
  choice: по экземпляру, хранящемуся у
  rationale: Буквально выражение означает «из-перед / от лица». В контексте оно, вероятнее всего, указывает на образцовый текст, находившийся перед священниками или в их ведении. Вероятный смысл дан в основном тексте, а буквальность и возможная неоднозначность отмечены в сноске.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священников-левитов
  rationale: Компактное русское обозначение естественно передаёт еврейское сочетание «священники, левиты», не утверждая, что все левиты являлись священниками.
theological_decisions:
- issue: Объём значения תּוֹרָה в законе о царе
  choice: этот закон
  alternative: это наставление; эта Тора
  rationale: «Этот закон» соответствует непосредственному контексту предписаний и не делает сверх текста вывода о точном объёме позднейшего канонического корпуса.
- issue: Связь царской копии со священниками
  choice: по экземпляру, хранящемуся у священников-левитов
  alternative: из того, что перед священниками-левитами; в присутствии священников-левитов
  rationale: Предлог מִן в сочетании с לִפְנֵי вероятнее указывает на источник копирования — авторитетный экземпляр при священниках. Поскольку оборот допускает более буквальное пространственное понимание, оно сохранено в сноске, а не устранено молча.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. «Пусть» ясно выражает обязательное предписание без архаичного «да». Термин «свиток» сохраняет древний предметный контекст; неоднозначность מִלִּפְנֵי открыто отражена в сноске.
