  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: ru
  text: 'Только пусть он не умножает себе коней[a] и не возвращает народ в Египет[b], чтобы умножить число коней, ведь Яхве сказал вам: «Вы больше не должны возвращаться этим путём»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть он не приобретает себе множество коней». Еврейский глагол означает «умножать, увеличивать».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и не приводит народ обратно в Египет». Еврейская форма глагола имеет каузативное значение: царь не должен становиться причиной возвращения народа.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Не продолжайте возвращаться этим путём впредь». Еврейский оборот означает: «Вы больше не должны возвращаться этим путём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Сохраняет ограничительно-противительный оттенок частицы, вводящей особое запрещение для царя.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: пусть он не умножает себе коней
  rationale: Передаёт каузативное значение רבה («делать многочисленным, увеличивать») и сохраняет לּוֹ — «себе»; более естественная альтернатива указана в сноске.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: и не возвращает народ в Египет
  rationale: 'Русский переходный глагол «возвращать» естественно выражает каузатив: царь не должен побуждать или заставлять народ вернуться.'
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: чтобы умножить число коней
  rationale: Передаёт цель действия и сохраняет лексическую связь с первым запретом, избегая неестественного единственного числа «коня» в русском.
- source_word: וַיהוָה
  choice: ведь Яхве
  rationale: Союз передаёт основание запрета в данном контексте, а тетраграмматон воспроизводится как личное имя «Яхве».
- source_word: לֹא תֹסִפוּן לָשׁוּב ... עוֹד
  choice: вы больше не должны возвращаться
  rationale: Естественно передаёт еврейскую конструкцию «не прибавите возвращаться… ещё», то есть категорический запрет на повторное возвращение.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: этим путём
  rationale: Творительный падеж естественно передаёт маршрут движения и сохраняет образ «пути».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация сохраняет его отличие от титула «Господь».
- issue: Характер запрета возвращения в Египет
  choice: запрет царю возвращать народ ради увеличения числа коней, обоснованный прежним повелением Яхве
  alternative: абсолютное утверждение о невозможности любого последующего пребывания отдельных израильтян в Египте
  rationale: Формулировка сохраняет категоричность прямой речи, но не расширяет её контекстуальное применение сверх связи с царской политикой и приобретением коней.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Сохранены повтор корня «умножать» и личное имя Яхве; тяжеловесные буквальные конструкции разъяснены в сносках.
