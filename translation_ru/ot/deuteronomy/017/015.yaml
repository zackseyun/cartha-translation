  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: ru
  text: Непременно поставь над собой царя, которого изберёт Яхве, твой Бог. Поставь над собой царя из среды своих братьев[a]; не ставь над собой чужеземца[b], который тебе не брат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» здесь — родственное обозначение израильтян, то есть людей из собственного народа.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человека-чужеземца, который тебе не брат».'
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: Обязательно поставь
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает предписание. «Обязательно» естественно передаёт эту эмфазу по-русски.
- source_word: עָלֶיךָ
  choice: над собой
  rationale: Сохраняет повторяющийся образ поставления правителя над народом; единственное число обращено к Израилю как к целому.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Прямое и традиционно понятное соответствие названию монархического правителя.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: которого изберёт Яхве, твой Бог
  rationale: Имперфект уместно передан будущим временем в конкретном законодательном предписании; בּוֹ обозначает избрание данного человека.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: из среды своих братьев
  rationale: Сохраняет как значение «из числа», так и родственную лексику оригинала; примечание поясняет её общенародный смысл.
- source_word: לֹא תוּכַל לָתֵת
  choice: ты не можешь поставить
  rationale: Формально сохраняет модальную конструкцию «не можешь», которая в данном правовом контексте имеет запретительную силу, не устраняя оттенок способности или дозволенности.
- source_word: אִישׁ נָכְרִי
  choice: чужеземца
  rationale: Естественное современное обозначение мужчины, не принадлежащего к Израилю; мужской референт понятен из должности царя и последующего слова «брат».
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: который тебе не брат
  rationale: Сохраняет поясняющую родственную формулировку и её краткую выразительность.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение אַחֶיךָ / אָחִיךָ
  choice: братьев / брат
  alternative: соплеменников / соотечественник
  rationale: Родственная лексика оригинала сохранена, а примечание объясняет, что здесь она обозначает членов народа Израиля.
- issue: Модальность לֹא תוּכַל
  choice: ты не можешь
  alternative: тебе нельзя
  rationale: Выбрана более формальная передача еврейской модальной конструкции; её запретительный смысл следует из законодательного контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Единственное число обращения сохранено как обращение к Израилю в целом; повтор «поставь над собой» воспроизводит структуру и настойчивость оригинала.
