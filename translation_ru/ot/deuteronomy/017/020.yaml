base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: ru
  text: чтобы он не возносился в сердце своём над своими братьями[a] и не уклонялся от заповеди ни вправо, ни влево, дабы он и его сыновья долго царствовали в Израиле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над своими соплеменниками». Буквально: «над своими братьями»; здесь используется язык родства внутри народа завета.'
    reason: Лексическая альтернатива и пояснение более широкого контекстуального значения.
lexical_decisions:
- source_word: לְבִלְתִּי
  choice: чтобы ... не
  rationale: Конструкция выражает цель или предотвращение; по-русски естественно передаётся оборотом «чтобы ... не».
- source_word: רוּם לְבָבוֹ
  choice: сердце его не возносилось
  rationale: Сохраняет древнееврейский образ сердца как внутреннего человека и идиому, обозначающую гордость, без её разъяснительной подмены.
- source_word: מֵאֶחָיו
  choice: над его братьями
  rationale: Точно передаёт образ возвышения над равными и сохраняет язык родства внутри народа завета.
- source_word: סוּר
  choice: уклонялся
  rationale: Естественное русское соответствие обычному языку отступления от предписанного пути.
- source_word: הַמִּצְוָה
  choice: от заповеди
  rationale: Определённая форма единственного числа сохранена; в контексте слово может собирательно обозначать данное Богом предписание.
- source_word: יָמִין וּשְׂמֹאול
  choice: ни вправо, ни влево
  rationale: Передаёт устойчивую метафору отклонения в любую сторону и естественно звучит по-русски при отрицании.
- source_word: לְמַעַן
  choice: дабы
  rationale: Ясно обозначает цель или ожидаемый результат и поддерживает достойный литературный регистр.
- source_word: יַאֲרִיךְ יָמִים
  choice: продлились дни
  rationale: Сохраняет еврейскую идиому продолжительности дней; субъектом в контексте выступают дни царствования царя и его сыновей.
- source_word: עַל מַמְלַכְתּוֹ
  choice: его царствования
  rationale: Здесь מַמְלָכָה допускает значение царской власти или правления; русское «дни его царствования» естественно выражает продолжительность пребывания на престоле.
- source_word: הוּא וּבָנָיו
  choice: его и его сыновей
  rationale: Сохранено прямое упоминание сыновей и династический смысл текста.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: среди Израиля
  rationale: Передаёт положение внутри общины Израиля современным и ясным русским выражением.
theological_decisions:
- issue: Родственный язык в законе о царе
  choice: братьями
  alternative: соотечественниками-израильтянами
  rationale: В оригинале буквально сказано «братьями»; это сохраняет язык родства народа завета, а более широкий контекстуальный смысл пояснён в сноске.
- issue: Династическая формулировка
  choice: его и его сыновей
  alternative: его и его потомков
  rationale: Еврейский текст прямо называет сыновей. Замена на «потомков» расширила бы лексическое значение и сгладила бы династическую конкретность.
- issue: Значение מַמְלָכָה в сочетании с продолжительностью дней
  choice: дни его царствования
  alternative: его дни в его царстве
  rationale: Формулировка относится к продолжительности царского правления и династии; выбранный вариант естественен по-русски, не превращая текст в обещание лишь личного долголетия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены ключевые образы оригинала — сердце, братья, уклонение вправо или влево, — но синтаксис сделан естественным для русского читателя.
