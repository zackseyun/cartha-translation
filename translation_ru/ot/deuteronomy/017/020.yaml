  to: чтобы он не возносился в сердце своём над своими братьями[a] и не уклонялся от заповеди ни вправо, ни влево, дабы он и его сыновья долго царствовали в Израиле.
  rationale: Исправлена заключительная конструкция, чтобы субъектом продолжительности царствования оставались царь и его сыновья, как в оригинале. «Долго царствовали» естественно передаёт еврейскую идиому «продлить дни» в сочетании с «на его царстве», не создавая в русском тексте ложного субъекта действия. Начальная идиома перестроена на естественный русский оборот при сохранении образа сердца.
