base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: ru
  text: А человек, который дерзко[a] поступит, отказавшись повиноваться священнику, стоящему там и служащему Яхве[c], Богу твоему, или судье, — тот человек должен умереть. Искорени зло из среды Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поступит с дерзостью»; возможно также: «поступит надменно» или «своевольно». Речь идёт о сознательном, вызывающем отказе, а не о случайной ошибке.'
    reason: lexical_alternative
  - marker: c
    text: «Яхве» передаёт личное имя יהוה (YHWH), которое традиционно заменяют словом «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: А человек
  rationale: Союз וְ продолжает предыдущее правовое предписание; «а» естественно вводит случай неповиновения. Единственное число и мужской род слова אִישׁ сохранены.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: поступит дерзко
  rationale: Оборот обозначает сознательное, вызывающее своеволие, а не случайную ошибку. «Поступит дерзко» передаёт нравственно-правовой оттенок и звучит естественно по-русски.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: и не послушает
  rationale: שׁמע буквально связано со слушанием, но в данном правовом контексте подразумевает отказ внимать решению и повиноваться ему. Русское «не послушает» сохраняет обе стороны значения.
- source_word: אֶל הַכֹּהֵן
  choice: священника
  rationale: כֹּהֵן прямо обозначает священника; расширять значение до общего должностного лица нет оснований.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: стоящего там, чтобы служить
  rationale: Причастие с инфинитивом описывает официальное храмовое служение священника. Слово «там» сохраняет שָׁם и отсылает к избранному месту из контекста.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твоему Богу
  rationale: При שׁרת частица אֶת вводит объект служения, поэтому по-русски естественно «служить Яхве». Обращение во втором лице единственного числа сохранено в форме «твоему Богу».
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: или судью
  rationale: שֹׁפֵט обозначает судебную власть; «судья» является прямым и ясным соответствием.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: тот человек должен умереть
  rationale: В правовом контексте форма выражает установленное последствие — смертную казнь. «Должен умереть» ясно передаёт обязательность приговора, не уточняя не названный здесь способ исполнения.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: Так искорени зло из Израиля
  rationale: בער входит в повторяющуюся во Второзаконии правовую формулу об удалении зла из общины. «Искорени» сохраняет её сильный повелительный смысл, не воспроизводя неуместно буквальный образ выжигания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон. Транслитерация «Яхве» сохраняет различие между именем и титулом; сноска отмечает традиционную замену.
- issue: Мужской род обозначения нарушителя
  choice: человек, который… тот человек
  alternative: тот, кто
  rationale: Исходный текст употребляет אִישׁ в мужском роде и единственном числе. Русское «человек» сохраняет индивидуальный характер правового случая без неестественного подчёркивания пола.
- issue: Характер смертной санкции
  choice: должен умереть
  alternative: пусть умрёт
  rationale: Контекст устанавливает обязательную судебную санкцию. Формулировка не добавляет сведений о способе казни или исполнителе, которых в стихе нет.
translation_notes:
  register: Современный литературный русский язык с достоинством правового текста. Синтаксис остаётся доступным обычному читателю; традиционная формула удаления зла передана сильным, но понятным глаголом «искорени». Подлинная смысловая широта שׁמע и בְזָדוֹן сохранена в тексте и сносках.
