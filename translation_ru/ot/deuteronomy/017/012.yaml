revisions:
- from: А человек, который поступит дерзко[a] и не послушает[b] священника, стоящего там, чтобы служить Яхве[c], твоему Богу, или судью, — тот человек должен умереть. Так искорени зло из Израиля.
  to: А человек, который дерзко[a] поступит, отказавшись повиноваться священнику, стоящему там и служащему Яхве[c], Богу твоему, или судье, — тот человек должен умереть. Искорени зло из среды Израиля.
  rationale: Перевод исправлен для естественного русского управления и более точной передачи юридического значения שׁמע. Сноска b сохранена как полезная лексическая альтернатива, но её якорь не требуется в основном тексте, поскольку основной вариант уже передаёт значение повиновения. Формула בִּעַרְתָּ הָרָע уточнена как удаление зла из среды народа, без добавления сведений о способе наказания.
