source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: ru
  text: 'Когда ты придёшь в землю, которую Яхве, твой Бог, даёт тебе, овладеешь ею и поселишься в ней, и скажешь: «Поставлю над собой царя[a], подобно всем народам, которые вокруг меня»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Назначу себе царя». Евр. «поставлю над собой царя».'
    reason: Лексическая альтернатива для שׂים; «над собой» передаёт עָלַי.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Когда ты придёшь
  rationale: כִּי вводит ожидаемую будущую ситуацию, а תָבֹא сохраняет обращение во втором лице единственного числа. «Когда» здесь естественнее условного «если».
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: В контексте Второзакония הָאָרֶץ обозначает землю, даруемую Израилю; «в землю» естественно сочетается с глаголом движения «придёшь».
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, твой Бог
  rationale: Личное имя יְהוָה передано транслитерацией «Яхве», а суффикс второго лица в אֱלֹהֶיךָ — сочетанием «твой Бог».
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Причастие נֹתֵן передаёт совершаемое или предстоящее дарование земли; настоящее время сохраняет аспект исходной формы и ясно выражает Божье действие.
- source_word: וִירִשְׁתָּהּ
  choice: овладеешь ею
  rationale: В контексте земли ירשׁ означает вступить во владение, завладеть. «Овладеешь ею» передаёт активное принятие земли во владение.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: и поселишься в ней
  rationale: ישׁב здесь обозначает устойчивое проживание после овладения землёй; «поселишься» точно передаёт переход к оседлой жизни.
- source_word: וְאָמַרְתָּ
  choice: и скажешь
  rationale: Последовательная форма продолжает цепь будущих действий и сохраняет второе лицо единственного числа.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: Поставлю над собой царя
  rationale: שׂים буквально означает «поставить, поместить», а עָלַי — «надо мной/над собой». Формулировка сохраняет как образ власти, так и намерение говорящего.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: как и все народы вокруг меня
  rationale: Оборот сравнивает намерение Израиля с практикой окружающих народов. Частица «и» делает русское сравнение естественным, не меняя его смысла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. «Яхве» непосредственно передаёт тетраграмматон и сохраняет его функцию заветного имени.
- issue: Оценка желания поставить царя
  choice: Сохранена нейтральная формулировка исходного стиха
  alternative: Передать просьбу как явно одобряемую или порицаемую
  rationale: Сам стих описывает будущие слова народа, не вынося здесь явной нравственной оценки; перевод не должен преждевременно разрешать напряжение последующего контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено обращение во втором лице единственного числа и последовательность действий. Причастие נֹתֵן передано настоящим временем «даёт», а буквальная конструкция о царе сохранена в основном тексте; более административное «назначу» вынесено в сноску.
