  to: Не приноси в жертву Яхве, твоему Богу, быка или овцу[a], у которых есть какой-либо порок или иной недостаток, потому что это мерзость для Яхве, твоего Бога.
  rationale: Исправлена передача תוֹעֲבַת на «мерзость», чтобы сохранить силу и форму ключевого еврейского выражения. Перечень животных сделан естественным для русского языка; неоднозначность שֶׂה (овца или коза) сохранена непосредственно привязанной сноской. «Порок или иной недостаток» передаёт מוּם и его обобщающее уточнение כֹּל דָּבָר רָע без навязывания морального значения.
