  terminology: «Приноси в жертву», «Яхве», «порок» и «мерзость» уместны в современном литературном библейском регистре. «Мерзость для Яхве» точнее сохраняет существительное תוֹעֵבָה, чем предикативное прилагательное «отвратительно».
