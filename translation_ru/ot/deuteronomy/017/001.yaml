base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: ru
  text: Не приноси в жертву Яхве, твоему Богу, быка или овцу[a], у которых есть какой-либо порок или иной недостаток, потому что это мерзость для Яхве, твоего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שֶׂה может обозначать овцу или козу.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: приноси в жертву
  rationale: В культовом контексте глагол обозначает жертвоприношение животного, а не просто заклание.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יְהוָה транслитерацией и сохраняет его отличие от титула «Господь».
- source_word: שׁוֹר
  choice: быка
  rationale: В данном перечне жертвенных животных естественно обозначает отдельное животное из крупного рогатого скота; «бык» не придаёт слову значения рабочего кастрированного вола.
- source_word: שֶׂה
  choice: животное из мелкого скота
  rationale: Еврейское слово может обозначать как овцу, так и козу; обобщённая формулировка сохраняет широту исходного термина.
- source_word: מוּם
  choice: порок
  rationale: В языке требований к жертвенным животным это физический недостаток, делающий животное непригодным для принесения.
- source_word: כֹּל דָּבָר רָע
  choice: какой-либо … изъян
  rationale: Фраза буквально означает «всякая плохая вещь» и уточняет מוּם; по-русски «какой-либо порок или изъян» естественно передаёт любой дисквалифицирующий недостаток без морального оттенка слова «зло».
- source_word: תוֹעֲבַת
  choice: отвратительно
  rationale: Передаёт сильную отрицательную оценку перед Богом и естественно сочетается в русском с указательным «это».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Характер выражения תוֹעֲבַת יְהוָה
  choice: это отвратительно для Яхве
  alternative: это мерзость пред Яхве
  rationale: Выбранный вариант сохраняет силу Божьей оценки, но звучит естественно на современном русском; он не уточняет сверх текста, является ли категория исключительно ритуальной или также нравственной.
translation_notes:
  register: Современный литературный русский язык с краткой законодательной формой повеления. Сохранено повторение «Яхве, твоего Бога». Широкое значение שֶׂה вынесено в точную формулировку основного текста и пояснено сноской; тяжеловесный буквализм «любая плохая вещь» заменён контекстуально ясной парой «порок или изъян».
