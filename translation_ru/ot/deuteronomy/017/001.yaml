  source_fidelity: 'В целом смысл передан верно: запрет относится к принесению в жертву животного с физическим изъяном; имя Яхве сохранено. Однако «отвратительно для Яхве» ослабляет и грамматически перестраивает именное выражение תוֹעֲבַת יְהוָה («мерзость/нечто гнусное для Яхве»).'
