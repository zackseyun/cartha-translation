base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: ru
  text: 'О Неффалиме он сказал:


    «Неффалим, насыщенный благоволением

    и исполненный благословения Яхве,

    овладей морем[a] и югом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «западом». Еврейское слово «море» может также обозначать запад как сторону света.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי אָמַר
  choice: О Неффалиме он сказал
  rationale: Предлог לְ в формуле, вводящей племенное благословение, естественно передаёт тему высказывания; такая формулировка ясна и сохраняет структуру еврейского текста.
- source_word: נַפְתָּלִי
  choice: Неффалим
  rationale: Использована закрепившаяся в русской библейской традиции форма имени и названия колена.
- source_word: שְׂבַע רָצוֹן
  choice: насыщенный благоволением
  rationale: שְׂבַע обозначает полноту, насыщенность, а רָצוֹן здесь — благоволение или благосклонность, вероятнее всего Божью. Формулировка сохраняет образ из оригинала.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: и исполненный благословения Яхве
  rationale: «Исполненный» передаёт состояние полноты и соответствует возвышенному поэтическому регистру; личное имя יְהוָה передано как «Яхве».
- source_word: יָם וְדָרוֹם
  choice: морем и югом
  rationale: יָם буквально означает «море», хотя может служить обозначением запада; דָרוֹם означает юг или южную область. Буквальный смысл вынесен в основной текст, а направительное прочтение отмечено в сноске.
- source_word: יְרָשָׁה
  choice: овладей
  rationale: Повелительная форма от ירשׁ выражает вступление во владение землёй. «Овладей» точнее передаёт этот динамический смысл, чем статичное «владей».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Источник благоволения в выражении שְׂבַע רָצוֹן
  choice: Не добавлять в основном тексте определение «Божьим»
  alternative: насыщенный Божьим благоволением
  rationale: Параллель с «благословением Яхве» указывает на Бога как вероятный источник благоволения, однако в первой строке это не выражено явно; перевод сохраняет лаконичность и некоторую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм благословения, прямое обращение к Неффалиму и краткий повелительный финал.
