  text: וּ/מִ/מֶּ֗גֶד אֶ֚רֶץ וּ/מְלֹאָ֔/הּ וּ/רְצ֥וֹן שֹׁכְנִ֖י סְנֶ֑ה תָּב֨וֹאתָ/ה֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: ru
  text: 'и отборными благами земли, и всем, что наполняет её,


    и благоволением Пребывавшего в терновом кусте[a].


    Пусть всё это сойдёт на голову Иосифа,


    на темя отделённого от своих братьев[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это выражение отсылает к явлению Бога Моисею в горящем терновом кусте.
    reason: historical_allusion
  - marker: b
    text: 'Или: «возвышающегося среди своих братьев»; возможны также переводы «посвящённого среди своих братьев» и «князя среди своих братьев». Еврейское слово указывает на отделённость или особый статус и здесь может подразумевать превосходство Иосифа.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד
  choice: лучшими дарами
  rationale: В контексте благословения מֶגֶד обозначает драгоценные, отборные блага или плоды. «Лучшие дары» естественно передаёт как ценность, так и идею даруемого изобилия.
- source_word: אֶרֶץ
  choice: земли
  rationale: אֶרֶץ может означать и землю вообще, и конкретную страну. В сочетании с «всем, что наполняет её» широкое русское «земля» сохраняет эту смысловую ёмкость.
- source_word: מְלֹאָהּ
  choice: всем, что наполняет её
  rationale: Развёрнутая формулировка яснее для современного читателя, чем буквальная «полнотой её», и точно передаёт совокупность всего находящегося на земле.
- source_word: רְצוֹן
  choice: благоволением
  rationale: Слово выражает благосклонность и добрую волю Бога. «Благоволение» сохраняет возвышенный поэтический регистр и не сводит смысл лишь к субъективному расположению.
- source_word: שֹׁכְנִי סְנֶה
  choice: Пребывавшего в терновом кусте
  rationale: Причастная конструкция служит описательным именованием Бога и отсылает к явлению Моисею. «Терновый куст» конкретнее передаёт סְנֶה, а прописная буква обозначает личный божественный референт без добавления имени, отсутствующего в строке.
- source_word: תָּבוֹאתָה
  choice: Пусть всё это сойдёт
  rationale: Форма выражает пожелание в составе благословения. Единственное число в еврейском суммарно охватывает перечисленные блага; «всё это» делает коллективный смысл естественным по-русски.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: на голову Иосифа
  rationale: Сохранён образ нисходящего на голову благословения и прямой поэтический параллелизм оригинала.
- source_word: קָדְקֹד
  choice: темя
  rationale: Краткое и точное русское слово для верхней части головы сохраняет отличие от רֹאשׁ и поэтический параллелизм.
- source_word: נְזִיר אֶחָיו
  choice: отделённого от своих братьев
  rationale: נְזִיר прежде всего указывает на отделённость или особый статус. Формулировка сохраняет связь и с фактическим отделением Иосифа от братьев, и с возможной идеей его выделенности, не подменяя её однозначным «князь».
theological_decisions:
- issue: Кого обозначает выражение שֹׁכְנִי סְנֶה
  choice: Бог, явившийся Моисею в терновом кусте, обозначен описательно
  alternative: Более общая отсылка к божественному явлению у Хорива
  rationale: Фраза явно перекликается с Исходом 3, но сама строка не называет Бога по имени и не уточняет природу явления. Описательный перевод сохраняет отсылку без догматического расширения.
- issue: Смысл נְזִיר применительно к Иосифу
  choice: отделённый от своих братьев
  alternative: возвышающийся среди братьев; посвящённый среди братьев; князь среди братьев
  rationale: Корень выражает отделение и особый статус, а в контексте Иосифа может также подразумевать превосходство. Основной текст сохраняет лексическое ядро, а примечание сообщает о возможном оттенке высокого положения.
translation_notes:
  register: Современный литературный русский с достоинством поэтического благословения. Строки сохраняют параллелизм оригинала; устаревшие обороты избегаются, но «благоволение» и «темя» удерживают возвышенный библейско-поэтический тон.
