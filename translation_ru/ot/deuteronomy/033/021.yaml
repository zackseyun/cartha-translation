source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: ru
  text: Он избрал себе лучшую часть[a], ибо там была отложена доля властителя[b]. Он пришёл вместе с главами народа; совершил праведные деяния Яхве[c] и Его судебные решения вместе с Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «первую часть» или «первейшую часть».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «законодателя». Возможно, здесь имеется в виду Моисей, но еврейское слово может также означать правителя или властителя.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «праведность Яхве» или «справедливость Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... לוֹ
  choice: Он избрал себе
  rationale: Буквально глагол означает «увидел», однако сочетание «увидел себе» в данном контексте выражает выбор предназначенной себе доли.
- source_word: רֵאשִׁית
  choice: лучшую часть
  rationale: Слово может обозначать начало, первую или первейшую часть; в контексте удела Гада речь, вероятнее всего, идёт о преимущественной, отборной части земли.
- source_word: חֶלְקַת מְחֹקֵק
  choice: доля властителя
  rationale: חֶלְקַת обозначает выделенную долю, а מְחֹקֵק — носителя власти, устанавливающего постановления; «властитель» сохраняет общий титул, не отождествляя его без достаточных оснований с Моисеем.
- source_word: סָפוּן
  choice: была сохранена
  rationale: Страдательное причастие передаёт смысл сокрытого, сбережённого или отложенного удела; «сохранена» естественно выражает его предназначенность.
- source_word: וַיֵּתֵא רָאשֵׁי עָם
  choice: Он пришёл с главами народа
  rationale: Краткая поэтическая конструкция допускает понимание движения вместе с народными предводителями; «главы народа» сохраняет образность и грамматическое число оригинала.
- source_word: צִדְקַת יְהוָה
  choice: праведную волю Яхве
  rationale: Форма может обозначать праведность, справедливость или праведное дело Яхве. В сочетании с עָשָׂה по-русски естественно «исполнил праведную волю», при этом варианты отмечены в сноске.
- source_word: וּמִשְׁפָּטָיו
  choice: Его судебные решения
  rationale: Множественное מִשְׁפָּטִים может означать суды, решения или установления; выбранный вариант ясно передаёт юридический оттенок.
- source_word: עִם יִשְׂרָאֵל
  choice: вместе с Израилем
  rationale: Предлог עִם прямо означает «с»; перевод сохраняет мысль о совместном действии с Израилем.
theological_decisions:
- issue: Кого обозначает מְחֹקֵק
  choice: Общий титул «властитель» без указания конкретного лица.
  alternative: «Законодатель», возможно Моисей; также «правитель» или «военачальник».
  rationale: Сжатая поэтическая фраза неоднозначна. Контекст не требует прямо отождествлять названного властителя с Моисеем, поэтому конкретизация оставлена для сноски.
- issue: Смысл выражения צִדְקַת יְהוָה
  choice: «праведная воля Яхве»
  alternative: «праведность Яхве», «справедливость Яхве» или «праведные деяния Яхве».
  rationale: Выражение может указывать как на качество или справедливое требование Яхве, так и на Его праведные деяния. Основной текст передаёт действие в соответствии с Его праведным намерением, а сноска сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены поэтическая сжатость, имя «Яхве» и неоднозначность ключевых еврейских выражений; тяжеловесные кальки смягчены там, где они затрудняли бы понимание.
