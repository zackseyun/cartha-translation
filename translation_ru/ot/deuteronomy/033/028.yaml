base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: ru
  text: Так Израиль жил в безопасности, особняком[a]; источник Иакова[b] — в стране зерна и молодого вина; даже небеса его роняли росу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдельно». Слово может обозначать обособленное, самостоятельное пребывание и не обязательно подразумевает одиночество в отрицательном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «око Иакова». Еврейское слово עֵין означает как «глаз», так и «источник»; здесь значение «источник» согласуется с образами плодородия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: живёт
  rationale: Глагол שׁכן обозначает постоянное пребывание или обитание. «Живёт» естественно звучит по-русски и передаёт устойчивое состояние, описанное в благословении.
- source_word: בֶּטַח
  choice: в безопасности
  rationale: Наречное употребление передаёт состояние защищённости и покоя.
- source_word: בָּדָד
  choice: особняком
  rationale: Слово выражает отдельность и самостоятельное пребывание; «особняком» сохраняет этот смысл, не придавая ему оттенка покинутости.
- source_word: עֵין יַעֲקֹב
  choice: источник Иакова
  rationale: עֵין может означать «глаз» или «источник». Образ источника лучше согласуется с последующим описанием плодородной страны и росы, однако иной смысл отмечен в сноске.
- source_word: אֶל אֶרֶץ
  choice: в стране
  rationale: В поэтической конструкции אֶל указывает на направленность или соотнесённость с землёй; по-русски местное значение естественно передаётся предлогом «в».
- source_word: דָּגָן
  choice: хлеб
  rationale: Здесь דָּגָן означает зерно и зерновые плоды. Русское «хлеб» в возвышенной земледельческой речи передаёт урожай зерновых, а не готовую пищу.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: תִּירוֹשׁ обозначает свежее, молодое вино как плод урожая.
- source_word: אַף
  choice: даже
  rationale: 'Частица усиливает завершающий образ: благословение исходит не только от земли, но и от небес.'
- source_word: שָׁמָיו
  choice: его небеса
  rationale: Сохранён местоименный суффикс третьего лица, относящий небеса к Иакову/Израилю или к пространству над ним.
- source_word: יַעַרְפוּ טָל
  choice: источают росу
  rationale: Глагол описывает капание или нисхождение влаги. «Источают росу» сохраняет поэтический образ и естественно звучит в русском настоящем времени.
theological_decisions:
- issue: Значение עֵין יַעֲקֹב
  choice: «источник Иакова»
  alternative: «око Иакова»
  rationale: Контекст зерна, вина и росы поддерживает значение «источник», но лексическая двусмысленность еврейского слова сохранена в сноске без догматического уточнения.
- issue: Смысл בָּדָד
  choice: «особняком» как спокойная отдельность
  alternative: «в одиночестве» или «отдельно»
  rationale: Контекст благословения указывает на безопасную обособленность, а не на отрицательное одиночество или оставленность.
- issue: Синтаксическая связь «источника Иакова»
  choice: Сочетание оставлено отдельным поэтическим звеном, соотносимым со следующей фразой о стране
  alternative: Понять «источник Иакова» как приложение к Израилю либо тесно связать его с первой строкой
  rationale: Краткая еврейская поэтическая конструкция допускает разные способы членения; пунктуация не разворачивает её в однозначное богословское утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Сохранены краткость, параллелизм и некоторая синтаксическая открытость еврейского текста; архаизмы вроде «обитал» и отрицательно окрашенное «одиноко» не использованы.
