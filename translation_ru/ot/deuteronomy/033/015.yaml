lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: лучшими дарами
  rationale: В перечне благословений רֹאשׁ естественно понимать качественно — как «лучшее, отборное»; слово «дарами» восполняет подразумеваемое содержание и создаёт естественную русскую фразу. Пространственное значение «с вершин» сохраняется в сноске.
- source_word: הַרְרֵי
  choice: гор
  rationale: Обычное значение множественного сопряжённого сочетания от הַר; оно сохранено в отличие от последующего גִּבְעוֹת — «холмов».
- source_word: קֶדֶם
  choice: древних
  rationale: В параллели с עוֹלָם здесь наиболее естественно временное значение «древность», а не направление «восток».
- source_word: מִמֶּגֶד
  choice: изобилием
  rationale: מֶגֶד обозначает драгоценные дары, богатый плод или урожай. «Изобилие» ясно передаёт образ щедрого плодородия, тогда как вариант «драгоценные дары» отмечен в сноске.
- source_word: גִּבְעוֹת
  choice: холмов
  rationale: Стандартное соответствие для גִּבְעָה, позволяющее сохранить отличие от «гор» в первой строке.
- source_word: עוֹלָם
  choice: вековечных
  rationale: Слово передаёт длительность и глубокую древность ландшафта. «Вековечные» сохраняет возвышенную поэтическую окраску, не отождествляя выражение с «древними» в первой части.
