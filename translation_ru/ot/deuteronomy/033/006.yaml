  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: ru
  text: Пусть живёт Рувим и пусть не умрёт, и пусть его людей будет немного.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть его люди будут сочтены». Последняя фраза еврейского текста трудна для понимания. Её также понимают как просьбу о том, чтобы Рувим не стал незначительным или не был исключён из числа колен.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: Пусть живёт
  rationale: Юссив породы qal от חיה выражает пожелание или благословение; конструкция «пусть живёт» естественно передаёт это значение по-русски.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: וְאַל יָמֹת
  choice: и не умрёт
  rationale: Сочетание אַל с юссивом выражает отрицательное пожелание. «Не умрёт» сохраняет прямое значение מות и параллелизм с первой частью.
- source_word: וִיהִי
  choice: и пусть ... будет
  rationale: Второй юссив вводит ещё одно пожелание и передан параллельной русской конструкцией.
- source_word: מְתָיו
  choice: его людей
  rationale: Трудное слово в данном контексте наиболее вероятно обозначает людей, принадлежащих колену Рувима. «Людей» звучит естественнее современного «мужей» и не предполагает значения «умершие».
- source_word: מִסְפָּר
  choice: немного
  rationale: Буквально «число»; при היה выражение, вероятно, означает численную малость, то есть «быть немногочисленными». Наречная конструкция «людей будет немного» естественна по-русски, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Толкование заключительной фразы וִיהִי מְתָיו מִסְפָּר
  choice: «и пусть его людей будет немного» — пожелание Рувиму сохраниться, хотя его колено останется малочисленным
  alternative: «и пусть его люди будут сочтены», то есть пусть Рувим не будет исключён из числа колен; также возможно понимание как утверждения «хотя его людей немного»
  rationale: Масоретский текст краток и труден. Наиболее прямое понимание מִסְפָּר при היה указывает на небольшое, поддающееся счёту число. Более благоприятное прочтение «пусть будут сочтены» возможно, но менее очевидно; исправления текста с добавлением отрицания не вносятся. Неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем благословения. Синтаксический параллелизм двух пожеланий сохранён; архаизм «мужи» не использован.
