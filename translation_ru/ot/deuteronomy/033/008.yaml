base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: ru
  text: 'О Левии он сказал:


    «Твои туммим и урим принадлежат верному тебе человеку[a],


    которого ты испытал в Массе[b],


    с которым спорил у вод Меривы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «твоему благочестивому человеку», «твоему преданному человеку». Еврейское слово может обозначать человека, хранящего верность завету.'
    reason: lexical_alternative
  - marker: b
    text: Название Масса связано со словом «испытание», а Мерива — со словами «спор», «распря» (см. Исх. 17:1–7; Чис. 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: О Левии
  rationale: Предлог לְ при названии колена вводит того, о ком произносится благословение; по-русски естественно «О Левии».
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: твои туммим и урим
  rationale: Это специальные священнические термины с не вполне ясным предметным значением, поэтому сохранена традиционная транслитерация и исходный порядок слов.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: у преданного тебе человека
  rationale: חָסִיד обозначает человека, отличающегося верностью и преданностью, в том числе верностью завету. Конструкция с «у» естественно передаёт принадлежность туммима и урима этому человеку, не уточняя его личность.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: которого ты испытал
  rationale: Глагол נסה означает подвергать испытанию или проверке; «испытал» точно и естественно передаёт смысл.
- source_word: בְּמַסָּה
  choice: в Массе
  rationale: Масса передана как географическое имя, а её смысловая связь с испытанием пояснена в сноске.
- source_word: תְּרִיבֵהוּ
  choice: с которым спорил
  rationale: Глагол ריב выражает спор, тяжбу или противоборство. Формулировка сохраняет прямое отношение между Богом и названным человеком, не сглаживая напряжённость текста.
- source_word: עַל מֵי מְרִיבָה
  choice: у вод Меривы
  rationale: В данном контексте עַל имеет локативный смысл; выражение сохраняет название места и естественно звучит по-русски.
theological_decisions:
- issue: Кого обозначает «преданный тебе человек»
  choice: Оставить референта неопределённым, сохранив единственное число.
  alternative: Прямо назвать Аарона, Левия или всё колено левитов.
  rationale: Еврейский текст допускает несколько отождествлений и сам не называет этого человека. Перевод не должен устранять данную неоднозначность.
- issue: Кто испытывал и с кем спорил
  choice: 'Сохранить грамматически явное обращение ко второму лицу: «ты испытал… спорил».'
  alternative: Переформулировать так, будто человек испытывал Бога или народ спорил с Богом.
  rationale: Суффиксы и формы второго лица в масоретском тексте представляют Бога действующим субъектом; необычное богословское напряжение не следует исправлять по мотивам параллельных повествований.
translation_notes:
  register: Современный литературный русский язык с поэтическим членением строк. Божественные местоимения даны со строчной буквы как нейтральное современное издательское решение. Термины «туммим» и «урим» сохранены без истолковывающего перевода; референт единственного числа намеренно не уточнён.
