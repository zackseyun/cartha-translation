base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: ru
  text: 'Об Иосифе он сказал:


    «Благословенна Яхве земля его —

    драгоценностями небес, росою

    и бездной[a], лежащей внизу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бездна» здесь, вероятно, означает глубинные воды под землёй.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף אָמַר
  choice: Об Иосифе он сказал
  rationale: Предлог לְ в формуле племенного благословения естественно передан как «об»; глагол אָמַר сохраняет простую рамку прямой речи.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: Да будет благословенна Яхве его земля
  rationale: Причастная конструкция передана как торжественная формула благословения. Имя יהוה транслитерировано как «Яхве», а אֶרֶץ обозначает землю, доставшуюся потомкам Иосифа.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: драгоценными дарами небес
  rationale: מֶגֶד означает драгоценное, превосходное благо или лучший плод; «дарами» естественно выражает небесные блага, не сужая их только до урожая.
- source_word: מִטָּל
  choice: росою
  rationale: Творительный падеж естественно продолжает перечень того, чем благословляется земля; роса особенно важна в земледельческом контексте.
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: и водами бездны, покоящейся внизу
  rationale: תְּהוֹם здесь обозначает глубинные воды; добавление «водами» делает образ понятным по-русски. רֹבֶצֶת буквально рисует бездну лежащей или покоящейся внизу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение תְּהוֹם
  choice: воды бездны
  alternative: бездна; подземные воды
  rationale: Сохранён библейский образ бездны и одновременно ясно указано, что речь идёт о глубинных водах, питающих землю; перевод не придаёт слову значения места наказания.
translation_notes:
  register: Современный литературный русский язык с приподнятым ритмом благословения. Синтаксис остаётся близким к еврейскому тексту, но перечень оформлен естественным русским творительным падежом.
