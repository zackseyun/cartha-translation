  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: ru
  text: И был он царём в Иешуруне[a][b], когда вместе собрались главы народа — племена Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
