lexical_decisions:
- source_word: וַיְהִי
  choice: И был он
  rationale: Форма глагола היה допускает значения «был» и «стал». В данном контексте «был» естественно передаёт состояние, а местоимение со строчной буквы не устраняет не названного в еврейском тексте референта.
- source_word: בִישֻׁרוּן
  choice: в Иешуруне
  rationale: Собственное имя ישׁרון передано транслитерацией; предлог ב имеет здесь наиболее естественное локативно-корпоративное соответствие «в».
- source_word: מֶלֶךְ
  choice: царём
  rationale: Обычное русское соответствие титулу מֶלֶךְ; творительный падеж требуется конструкцией «был царём».
- source_word: בְּהִתְאַסֵּף
  choice: когда собрались
  rationale: Инфинитив с предлогом ב вводит обстоятельство времени; придаточное предложение ясно и естественно передаёт эту функцию.
- source_word: רָאשֵׁי עָם
  choice: главы народа
  rationale: Сохранён еврейский образ «глав», который в русском библейском и литературном употреблении понятно обозначает руководителей.
- source_word: יַחַד
  choice: вместе
  rationale: Наречие выражает совместность и единство собравшихся, не уточняя политический или обрядовый характер собрания.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: все племена Израиля
  rationale: Сжатая еврейская конструкция передана пояснительным присоединением; «все» естественно выражает совокупный смысл יחד, не превращая собрание в более определённую институцию.
theological_decisions:
- issue: Кого называет царём стих
  choice: В основном тексте сохранено местоимение «он» со строчной буквы без прямого отождествления.
  alternative: «Господь стал царём в Иешуруне» или «Моисей стал царём в Иешуруне».
  rationale: В еврейском тексте подлежащее прямо не названо. Контекст допускает соотнесение как с Господом, так и с Моисеем, поэтому перевод не должен снимать эту неоднозначность.
- issue: Характер единства Израиля
  choice: Передано совместное собрание глав народа и племён без уточнения его институционального характера.
  alternative: Истолковать сцену как формальное воцарение или как особое заветное собрание.
  rationale: Текст говорит о собравшихся руководителях и племенах, но не определяет точный политический или литургический статус события.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ «главы народа», имя «Иешурун» и неоднозначность субъекта; порядок слов «был он» подчёркивает сказуемое, не капитализируя местоимение и не отождествляя его заранее с Богом.
