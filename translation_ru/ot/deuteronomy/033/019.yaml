  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: ru
  text: Они созовут народы на гору[a]; там принесут жертвы праведности[b], ведь будут черпать из изобилия морей[c] и из сокровищ, скрытых в песке[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к горе» либо «на некую гору». Еврейский текст не уточняет, какая именно гора имеется в виду.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «праведные жертвы», то есть правильные, угодные Богу жертвы. Выражение также может подразумевать жертвы, приносимые в праведности.'
    reason: theological_ambiguity
  - marker: c
    text: 'Буквально: «будут сосать изобилие морей» — образ получения пищи или богатства от моря.'
    reason: lexical_alternative
  - marker: d
    text: Буквально выражение говорит о скрытом, спрятанном в песке. Вероятно, имеются в виду богатства побережья или песчаных местностей, но их точный вид не назван.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: народы
  rationale: Сохраняет множественное число и коллективный смысл, не сводя речь к отдельным людям.
- source_word: הַר
  choice: на гору
  rationale: Передаёт направленность движения, при этом не отождествляет не названную в еврейском тексте гору с Сионом, Синаем или иным конкретным местом.
- source_word: יִקְרָאוּ
  choice: созовут
  rationale: Глагол קרא здесь допускает значения призыва, приглашения или созыва; «созовут» естественно сочетается с множеством народов, не уточняя цели призыва сверх текста.
- source_word: זִבְחֵי צֶדֶק
  choice: жертвы праведности
  rationale: 'Формально передаёт конструкцию с צֶדֶק и сохраняет неоднозначность: речь может идти о правильных, угодных Богу жертвах либо о жертвах, приносимых в праведности.'
- source_word: שֶׁפַע יַמִּים
  choice: изобилие морей
  rationale: Широкое выражение не ограничивает смысл рыбой, торговлей или иными конкретными морскими благами.
- source_word: יִינָקוּ
  choice: будут черпать
  rationale: Естественно передаёт метафорический смысл получения пищи или богатства, тогда как буквальное «сосать» по-русски здесь звучало бы неясно и резко.
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: сокрытые клады песка
  rationale: Передаёт усиленный образ спрятанных или хранимых в песке ценностей, не навязывая их конкретного отождествления.
theological_decisions:
- issue: Характер «жертв праведности»
  choice: Сохранена конструкция «жертвы праведности» без догматического уточнения.
  alternative: «праведные жертвы» или «угодные жертвы»
  rationale: Еврейское сочетание может характеризовать как сами жертвы, так и праведность их принесения; буквальная по структуре формулировка сохраняет это напряжение.
- issue: Какая гора имеется в виду
  choice: Гора оставлена неназванной.
  alternative: Сион, гора-святилище или горная область племени
  rationale: В исходном тексте нет собственного имени, поэтому конкретизация была бы истолкованием, а не переводом.
translation_notes:
  register: Современный литературный русский язык с поэтической приподнятостью, уместной для племенного благословения. Синтаксис краток и параллелен еврейскому стиху; неоднозначные образы не конкретизированы без опоры в источнике.
