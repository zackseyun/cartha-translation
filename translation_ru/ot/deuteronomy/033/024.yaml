base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: ru
  text: 'Об Ашере он сказал:


    «Ашер — благословеннее сыновей[a]!

    Да будет он любим своими братьями[b]

    и пусть он погружает свою ногу в масло[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Самый благословенный среди сыновей — Ашер». Еврейское выражение допускает сравнительное и превосходное понимание.'
    reason: lexical_alternative
  - marker: b
    text: Под «братьями», вероятно, подразумеваются остальные колена Израиля.
    reason: cultural_note
  - marker: c
    text: Образ ноги, погружаемой в масло, вероятно, говорит об изобилии или благоденствии; в переводе сохранена буквальная метафора.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: Об Асире он сказал
  rationale: Предлог לְ вводит благословение следующего колена. Русское «об Асире» естественно передаёт формулу и сохраняет связь с контекстом.
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: Благословеннее сынов Асир
  rationale: מִן при прилагательном допускает сравнительное или превосходное понимание. Сравнительная форма близко передаёт еврейское построение, не устраняя его неоднозначности; имя Асир сохранено в подчёркнутой позиции.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: Да будет он угоден своим братьям
  rationale: יְהִי выражает пожелание в составе благословения. רְצוּי означает того, кого принимают благосклонно, кто угоден; «угоден» сохраняет личностную направленность выражения.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: и да окунает ногу свою в масло
  rationale: Причастие וְטֹבֵל в поэтическом параллелизме продолжает пожелание. Конкретный образ, единственное число «нога» и общее значение שֶׁמֶן «масло» сохранены без истолкования в основном тексте.
theological_decisions:
- issue: Смысл образа окунания ноги в масло
  choice: Сохранить буквальный поэтический образ в основном тексте.
  alternative: Передать его толкованием как изобилие оливкового масла, благоденствие или роскошь.
  rationale: Образ, вероятно, указывает на изобилие и процветание, однако сам еврейский текст не уточняет его смысл. Буквальная передача сохраняет поэтическую и богословскую открытость.
- issue: Сравнительный или превосходный смысл בָּרוּךְ מִבָּנִים
  choice: 'Передать сравнительно: «Благословеннее сынов».'
  alternative: «Самый благословенный среди сынов» или «благословен среди сынов».
  rationale: Еврейское построение допускает сравнительный и превосходный оттенки. Основной текст следует его форме, а примечание сообщает альтернативу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом поэтического благословения. Синтаксис «да будет… и да окунает…» передаёт характер пожелания; архаизирующая лексика сведена к минимуму.
