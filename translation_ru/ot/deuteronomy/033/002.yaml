  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: ru
  text: 'Он сказал:


    «Яхве пришёл от Синая,

    воссиял им от Сеира,

    явился в сиянии с горы Фаран

    и пришёл из мириад святости[a].

    Из правой руки его —

    огненный закон для них[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из мириад святых». Еврейское выражение может обозначать святых небесных спутников, а не отвлечённую святость.'
    reason: alternative_reading
  - marker: b
    text: Еврейское אשדת — трудное и неясное слово. По традиции его переводят как «огненный закон», но оно может обозначать огненные вспышки или огонь, исходящий из правой руки Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: מִסִּינַי בָּא
  choice: пришёл от Синая
  rationale: Сохраняет значение явления и движения от Синая, выраженное глаголом בוא и предлогом מן.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: воссиял им от Сеира
  rationale: «Воссиял» сохраняет образ восходящего света; «им» буквально и без излишнего уточнения передаёт поэтическое לָמוֹ.
- source_word: הוֹפִיעַ מֵהַר פָּארָן
  choice: явился в сиянии от горы Фаран
  rationale: Передаёт как явление, так и световой, величественный оттенок формы הפעיל глагола יפע.
- source_word: וְאָתָה מֵרִבְבֹת קֹדֶשׁ
  choice: и пришёл из мириад святости
  rationale: Формально сохраняет необычное сочетание множественного רִבְבֹת с существительным קֹדֶשׁ и не решает безоговорочно, обозначает ли оно святость или святых существ.
- source_word: מִימִינוֹ
  choice: из Его правой руки
  rationale: Предлог מן естественно передан как «из» и сохраняет образ исходящего из руки.
- source_word: אשדת לָמוֹ
  choice: огненный закон для них
  rationale: Сохраняет традиционное, связанное с Синаем понимание трудной формы אשדת; неопределённость и иная возможность отражены в примечании.
theological_decisions:
- issue: Кто является субъектом поэтического богоявления
  choice: Назвать Бога завета личным именем «Яхве» без добавочного христологического толкования.
  alternative: Истолковать явление типологически как указание на последующее откровение.
  rationale: Контекст описывает явление Яхве у Синая; перевод не должен вносить в формулировку более позднюю богословскую интерпретацию.
- issue: Значение מֵרִבְבֹת קֹדֶשׁ
  choice: Сохранить в основном тексте формально неоднозначное «из мириад святости».
  alternative: «из мириад святых» или «из сонмов святых существ».
  rationale: Слово קֹדֶשׁ может быть понято как абстрактная «святость» либо как указание на святых небесных спутников; основной текст не должен незаметно устранять эту неоднозначность.
- issue: Толкование אשדת
  choice: Использовать традиционное «огненный закон» с примечанием о неясности.
  alternative: «огненные вспышки», «пылающий огонь» или огонь, исходящий из правой руки.
  rationale: Еврейская форма исключительно трудна. Традиционное прочтение уместно в синайском контексте, но его нельзя представлять как бесспорное.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного поэтического параллелизма. Строки разделены по смысловым звеньям древнееврейской поэзии; архаизмы сведены к минимуму, а «воссиял» сохранено ради световой образности.
