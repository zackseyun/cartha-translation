base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: ru
  text: 'О Гаде он сказал:


    «Благословен тот, кто даёт Гаду простор[a].

    Он, словно львица[b], обитает

    и раздирает руку — даже темя[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет благословен тот, кто даёт Гаду простор». Подразумеваемым деятелем может быть Бог, однако в еврейском тексте Он прямо не назван.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово можно также перевести как «лев»; оно может обозначать могучего льва в более общем смысле.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «руку, даже темя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: О Гаде
  rationale: Естественно вводит обращённое к колену Гада благословение; предлог לְ в этой формуле передан по смыслу.
- source_word: בָּרוּךְ מַרְחִיב גָּד
  choice: Благословен тот, кто даёт Гаду простор
  rationale: Причастие מַרְחִיב обозначает того, кто расширяет или предоставляет пространство. Формулировка естественна по-русски и не называет подразумеваемого деятеля прямо.
- source_word: כְּלָבִיא
  choice: как лев
  rationale: לָבִיא обозначает взрослого могучего льва и в некоторых контекстах львицу; «лев» естественно передаёт образ силы, а лексическая неоднозначность отмечена в сноске.
- source_word: שָׁכֵן
  choice: обитает
  rationale: Глагол может означать жить, пребывать, располагаться или залегать; «обитает» сохраняет одновременно территориальный смысл и связь с образом льва.
- source_word: וְטָרַף
  choice: и отрывает
  rationale: טרף описывает хищническое разрывание; «отрывает» ясно сочетается с названными далее частями тела.
- source_word: זְרוֹעַ
  choice: руку
  rationale: Сохранён буквальный образ части тела, а не переносное значение «сила».
- source_word: אַף קָדְקֹד
  choice: даже темя
  rationale: אַף усиливает и добавляет второй элемент, а קָדְקֹד обозначает темя, верхнюю часть головы.
theological_decisions:
- issue: Кто даёт Гаду простор
  choice: 'Деятель оставлен неназванным: «тот, кто даёт Гаду простор»'
  alternative: 'Прямо назвать Бога или понять форму как пожелание: «Да будет благословен тот, кто даёт Гаду простор»'
  rationale: Еврейский текст грамматически не называет Бога, хотя Он может подразумеваться. Перевод сохраняет эту открытость и форму провозглашённого благословения.
translation_notes:
  register: Современный литературный русский язык с краткими, энергичными строками поэтического благословения. Сохранены хищнический образ, телесная конкретность и неопределённость того, кто расширяет владения Гада.
