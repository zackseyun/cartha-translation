base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: ru
  text: 'О Вениамине он сказал:


    «Возлюбленный Яхве

    безопасно живёт при нём[a];

    он укрывает его весь день

    и обитает между его плечами[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «безопасно рядом с ним». Еврейский предлог может выражать близость, положение над ним или, в контексте защиты, пребывание под его покровом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «между его плечами». Не вполне ясно, кто здесь обитает и чьи это плечи. Образ понимают как близость и защиту; возможно также топографическое указание на склоны земли Вениамина или на святилище в его владениях.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: О Вениамине
  rationale: В ряду племенных благословений предлог לְ вводит того, к кому или о ком произносится благословение. Русское «О Вениамине» естественно передаёт функцию заголовка.
- source_word: יְדִיד יְהוָה
  choice: Любимый Яхве
  rationale: יְדִיד обозначает любимого, дорогого человека. Субстантивированное «Любимый» сохраняет теплоту выражения, а личное имя יהוה передано как «Яхве».
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: живёт в безопасности
  rationale: שׁכן означает жить, обитать; לָבֶטַח выражает состояние защищённости. Настоящее время уместно для поэтического благословения и не сужает его до однократного будущего события.
- source_word: עָלָיו
  choice: при нём
  rationale: Предлог עַל здесь допускает пространственные оттенки близости, положения над или под защитой. «При нём» передаёт близость, не закрепляя чрезмерно конкретную пространственную картину; варианты отмечены в сноске.
- source_word: חֹפֵף
  choice: укрывает
  rationale: Причастие выражает покрытие или защитное покровительство. «Укрывает» естественно по-русски и сохраняет как образ покрытия, так и смысл защиты.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Прямое и естественное соответствие, передающее непрерывность защиты.
- source_word: וּבֵין כְּתֵיפָיו
  choice: между его плечами
  rationale: כָּתֵף буквально означает плечо или бок, склон. Буквальный антропоморфный образ сохранён в тексте, а топографическое понимание указано в сноске.
- source_word: שָׁכֵן
  choice: обитает
  rationale: Форма повторяет корень שׁכן из первой строки. «Обитает» сохраняет мотив пребывания, избегая стилистически тяжёлого буквального повтора «живёт».
theological_decisions:
- issue: К кому относятся местоимения и кто обитает в заключительной строке
  choice: Строчные местоимения оставлены без типографического уточнения референтов; основной текст допускает чтение, при котором любимый Яхве живёт рядом с Ним, Яхве укрывает любимого, а любимый обитает между Его плечами.
  alternative: Яхве обитает над Вениамином и между его плечами; возможны и иные распределения местоименных референтов в поэтически сжатой фразе.
  rationale: Еврейский текст не называет субъекты повторно, а одинаковые местоименные суффиксы допускают несколько синтаксических соотнесений. Прописные буквы в русском искусственно сняли бы эту подлинную неоднозначность.
- issue: Образ «между его плечами»
  choice: Сохранён буквальный телесный образ.
  alternative: «Между его склонами» — топографическое толкование, связываемое с холмистой землёй Вениамина или расположением святилища.
  rationale: Слово כְּתֵפָיו само по себе допускает образ плеч или боков, однако перевод «склоны» уже выбирал бы конкретное толкование.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим строем. Сохранены параллелизм, личное имя Яхве и ключевой образ плеч; местоименная неоднозначность оригинала намеренно не устранена прописными буквами.
