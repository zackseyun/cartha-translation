- from: 'О Вениамине он сказал:

    «Любимый Яхве живёт в безопасности при нём[a];

    он укрывает его весь день

    и обитает между его плечами[b]».'
  to: 'О Вениамине он сказал:


    «Возлюбленный Яхве

    безопасно живёт при нём[a];

    он укрывает его весь день

    и обитает между его плечами[b]».'
  rationale: Исправлены только русская естественность и формулировка примечания. «Возлюбленный Яхве» точнее и идиоматичнее передаёт статус Вениамина как αγαπητός/ידיד Яхве. Перестановка «безопасно живёт» улучшает ритм, не меняя смысла. Сноска a теперь различает возможные значения еврейского предлога, не предлагая неестественное русское словосочетание как полноценный вариант перевода. Неоднозначность субъектов и суффиксов в финальной строке сохранена.
