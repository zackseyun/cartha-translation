base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: ru
  text: 'Вот благословение, которым Моисей, человек Божий, благословил сынов Израиля[a] перед своей смертью:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Израиля»; это обычное собирательное обозначение народа Израиля.'
    reason: Пояснение буквальной формы и её широкого собирательного значения.
lexical_decisions:
- source_word: וְזֹאת
  choice: Вот
  rationale: Вводит новый раздел и указывает на последующее благословение. Русское «Вот» естественно передаёт указательную и дискурсивную функцию сочетания, не добавляя временного значения.
- source_word: הַבְּרָכָה
  choice: благословение
  rationale: Существительное обозначает торжественное благословение или благословляющее изречение; определённость в русском контексте выражена конструкцией «Вот благословение».
- source_word: אֲשֶׁר בֵּרַךְ
  choice: которым ... благословил
  rationale: Творительный падеж естественно передаёт инструментальный смысл относительной конструкции и сохраняет в переводе родство существительного и глагола.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Общепринятая русская форма имени.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое и прозрачное обозначение пророка или человека, уполномоченного Богом; сохраняет форму и достоинство исходного титула.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет семейный образ и грамматически мужскую форму еврейского выражения; сноска поясняет его обычное собирательное значение.
- source_word: לִפְנֵי מוֹתוֹ
  choice: перед своей смертью
  rationale: Естественно передаёт временную фразу и ясно относит смерть к Моисею.
theological_decisions:
- issue: Собирательное значение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народ Израиля; детей Израиля
  rationale: Исходный текст буквально использует мужское множественное «сыны Израиля», но это стандартное собирательное название народа. Основной текст сохраняет семейный и гендерный образ, а сноска предотвращает ошибочное понимание, будто речь идёт только о мужчинах.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Двоеточие сохранено, поскольку стих вводит последующее благословение.
