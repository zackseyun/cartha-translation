base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: ru
  text: 'Бог издревле — обитель[a], а внизу — вечные руки. Он изгнал от тебя врага и сказал: «Истреби!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вечный Бог — твоё прибежище». Такое традиционное понимание еврейского текста возможно по смыслу; более буквальная формулировка — «Бог издревле — обитель».'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: обитель
  rationale: Существительное обозначает место обитания и, в данном контексте, укрытие. «Обитель» сохраняет исходный пространственный образ, не сводя его сразу к истолкованию «прибежище».
- source_word: אֱלֹהֵי קֶדֶם
  choice: Бог издревле
  rationale: קֶדֶם здесь указывает прежде всего на древнее, изначальное время. Выражение «Бог издревле» естественно по-русски передаёт временной смысл, не подменяя его более богословски определённым словом «вечный».
- source_word: וּמִתַּחַת
  choice: а внизу
  rationale: Предлог выражает пространственное положение снизу. «А внизу» сохраняет лаконичность и поэтический параллелизм еврейской строки.
- source_word: זְרֹעֹת עוֹלָם
  choice: вечные руки
  rationale: זְרֹעֹת буквально означает «руки» и образно говорит о силе и поддержке; עוֹלָם здесь передаёт непреходящую длительность. Такой перевод точен и понятен современному читателю.
- source_word: וַיְגָרֶשׁ
  choice: Он прогнал
  rationale: Глагол גרש означает изгонять, прогонять. «Прогнал» ясно и энергично передаёт военный контекст.
- source_word: מִפָּנֶיךָ
  choice: перед тобой
  rationale: Буквально выражение означает «от твоего лица/присутствия» и описывает устранение врага перед наступающим Израилем. «Перед тобой» сохраняет образ исходного текста.
- source_word: אוֹיֵב
  choice: врага
  rationale: Форма единственного числа сохранена; при этом в контексте она может иметь собирательное значение.
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Сохранено простое повествовательное продолжение; подразумеваемый субъект — Бог из предыдущей части стиха.
- source_word: הַשְׁמֵד
  choice: Истреби!
  rationale: Побудительная форма породы hифиль от שמד требует полного уничтожения. «Истреби!» передаёт силу приказа и его завершительный характер без добавления отсутствующих в тексте уточнений.
theological_decisions:
- issue: 'Передача קֶדֶם в выражении אֱלֹהֵי קֶדֶם: древность/изначальность или вечность Бога'
  choice: Бог издревле
  alternative: Вечный Бог
  rationale: קֶדֶם непосредственно обозначает древнее или изначальное время, тогда как «вечный» представляет собой традиционное и контекстуально возможное богословское осмысление. Основной текст сохраняет более прямой смысл, а альтернативу приводит сноска.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Сохранены образ обители, пространственное «внизу» и метафора вечных рук; архаичное «мышцы» не употребляется.
