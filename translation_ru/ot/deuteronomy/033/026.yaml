  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: ru
  text: Нет подобного Богу, Иешурун! Он едет по небесам тебе на помощь[b] и в своём величии — по облакам.
  philosophy: optimal-equivalence
  footnotes:
