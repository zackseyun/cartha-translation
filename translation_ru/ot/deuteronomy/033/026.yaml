lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: Нет подобного Богу
  rationale: Экзистенциальное отрицание с сравнительной конструкцией выражает абсолютную несравненность; формулировка сохраняет возвышенный поэтический тон и естественна по-русски.
- source_word: יְשֻׁרוּן
  choice: Иешурун
  rationale: Поэтическое имя Израиля транслитерировано, а звательная функция передана обращением и восклицательным знаком.
- source_word: רֹכֵב שָׁמַיִם
  choice: Он едет по небесам
  rationale: Причастие описывает величественное действие Бога. Глагол «едет» сохраняет образ всадника, а «по небесам» естественно передаёт ב в значении движения по пространству.
- source_word: בְעֶזְרֶךָ
  choice: тебе на помощь
  rationale: Предложная конструкция выражает цель или пользу; это ёмкая и естественная русская передача без устранения образности.
- source_word: וּבְגַאֲוָתוֹ
  choice: и в Своём величии
  rationale: В отношении Бога גַּאֲוָה обозначает возвышенность и величие; «гордость» здесь могло бы вызвать неверный нравственный оттенок.
- source_word: שְׁחָקִים
  choice: облакам
  rationale: Поэтическое слово может обозначать облака или небесные выси. «Облака» сохраняет конкретный образ и синонимический параллелизм, не дублируя «небеса».
theological_decisions:
- issue: Значение אֵל в сравнении
  choice: нарицательное божественное обозначение «Бог»
  alternative: собственное имя «Эль» или титул «Могучий»
  rationale: Контекст провозглашает несравненность Бога Израиля. «Бог» естественно передаёт здесь אֵל и не создаёт впечатления, будто речь идёт об отдельном божестве.
- issue: Синтаксическая связь второй половины стиха
  choice: обе параллельные строки описывают движение Бога по небесам и облакам
  alternative: понимать «в Своём величии» как преимущественно обстоятельство образа действия без явного восстановления сказуемого
  rationale: Эллиптический параллелизм допускает восстановление глагола «едет» во второй строке; тире сохраняет поэтическую сжатость и не вводит нового действия.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Сохранены образ небесного всадника, параллелизм «небеса — облака» и обращение к Израилю; архаическая частица «о» не использована.
