  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: ru
  text: 'Тот, кто об отце своём и матери своей сказал: «Я не видел его»[a], не признал своих братьев и не знал своих сыновей; ибо они соблюдали слово Твоё и хранили завет Твой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я не видел его». В этом контексте выражение, вероятно, означает «я не считался с ним» или «не принимал его во внимание», когда верность завету требовала предпочесть её родственным узам.'
    reason: Лексическая альтернатива и пояснение контекстуального смысла ראה.
lexical_decisions:
- source_word: הָאֹמֵר
  choice: тот, кто… сказал
  rationale: Субстантивированное причастие относится к Левию; русское относительное построение естественно передаёт эту функцию.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: об отце своём и матери своей
  rationale: Предлог ל при אמר может обозначать тех, о ком говорится или к кому обращаются. Контекст противопоставляет верность завету семейным связям; формулировка «об отце… и матери» сохраняет эту соотнесённость, не устраняя неоднозначность полностью.
- source_word: לֹא רְאִיתִיו
  choice: Я не видел его
  rationale: Сохранено основное значение ראה — «видеть». В данном контексте выражение, вероятно, имеет более широкий смысл «не принимать во внимание», что разъяснено в сноске, а не подменено в основном тексте.
- source_word: הִכִּיר
  choice: не признал
  rationale: Hiphil от נכר здесь означает признание или оказание родственного признания; «не признал» передаёт как узнавание, так и отказ считаться с семейной связью.
- source_word: אֶחָיו
  choice: своих братьев
  rationale: Сохранено конкретное мужское множественное число исходного текста.
- source_word: בָּנָיו
  choice: своих сыновей
  rationale: Передано конкретное обозначение сыновей без обобщения до «детей».
- source_word: יָדָע
  choice: не знал
  rationale: Буквальное «знал» сохраняет параллелизм и допускает подразумеваемый здесь смысл родственного признания.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предыдущего утверждения; «ибо» уместно в dignified современном библейском регистре.
- source_word: שָׁמְרוּ
  choice: соблюдали
  rationale: В отношении Божьего слова שׁמר естественно передаётся как послушное соблюдение.
- source_word: אִמְרָתֶךָ
  choice: слово Твоё
  rationale: אמרה означает слово или изречение; «слово» не сужает смысл до одной конкретной заповеди.
- source_word: בְּרִיתְךָ
  choice: завет Твой
  rationale: «Завет» — точный и общепринятый русский эквивалент ברית в данном контексте.
- source_word: יִנְצֹרוּ
  choice: хранили
  rationale: נצר имеет оттенок охраны и бережного сохранения; отдельный глагол сохраняет отличие от שׁמר.
theological_decisions:
- issue: Переход от единственного числа к множественному
  choice: Сохранён переход от представительного единственного числа («тот, кто… не признал… не знал») к корпоративному множественному («они соблюдали… хранили»).
  alternative: Согласовать весь стих либо в единственном, либо во множественном числе.
  rationale: Благословение обращено к Левию как к коллективному целому, однако еврейский текст намеренно сочетает представительный единственный субъект с множественным числом в обосновании; сглаживать этот переход не следует.
- issue: Отношение к ближайшим родственникам
  choice: Сохранены резкие буквальные формулировки, а возможный смысл непризнания семейных притязаний раскрыт только в сноске.
  alternative: 'Сразу перевести: «не считался с отцом и матерью».'
  rationale: Так сохраняются и образная сила исходного текста, и богословское напряжение между родственными узами и верностью завету без навязывания единственного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Лексическая резкость и смена грамматического числа исходного текста сохранены.
