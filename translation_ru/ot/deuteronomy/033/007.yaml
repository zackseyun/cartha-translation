base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: ru
  text: 'А об Иуде он сказал:


    «Услышь, Яхве, голос Иуды

    и приведи его к своему народу.

    Пусть он своими руками борется за себя,[a]

    а Ты будь ему помощью против его врагов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть ему будет достаточно его рук». Еврейская фраза трудна и допускает разные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: А об Иуде он сказал
  rationale: Кратко и естественно вводит благословение следующего колена; לְ передаёт тему высказывания.
- source_word: שְׁמַע יְהוָה
  choice: Услышь, Яхве
  rationale: Императив выражает молитвенное обращение; имя יהוה передано как «Яхве».
- source_word: קוֹל יְהוּדָה
  choice: голос Иуды
  rationale: Сохраняет конкретный образ исходного текста, не сужая значение до «мольбы» или «крика».
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: и приведи его к его народу
  rationale: Передаёт каузативную форму בוא и сохраняет открытым, идёт ли речь о возвращении после битвы или о соединении с народом.
- source_word: יָדָיו רָב לוֹ
  choice: Пусть его руки сражаются за него
  rationale: Военный контекст поддерживает понимание רָב как борьбы; выражение с «руками» сохраняет образ еврейского текста. Трудность фразы отмечена в сноске.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: а Ты будь ему помощью против его врагов
  rationale: Форма женского рода תִּהְיֶה согласуется с подразумеваемым обращением к Яхве и именным сказуемым עֵזֶר; מן перед врагами имеет значение защиты или помощи против них.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Собственное имя Заветного Бога передано непосредственно, а не заменено титулом.
- issue: Толкование יָדָיו רָב לוֹ
  choice: Пусть его руки сражаются за него
  alternative: Пусть его рук будет ему достаточно
  rationale: Выбранное прочтение согласуется с упоминанием врагов в следующей строке, однако подлинная неоднозначность трудной еврейской фразы сохранена в сноске.
- issue: Подлежащее последней просьбы
  choice: а Ты будь ему помощью
  alternative: и да будет помощь против его врагов
  rationale: Обращение к Яхве естественно продолжается в молитве; местоимение «Ты» добавлено только для ясности русского синтаксиса.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенно-поэтическим звучанием. Синтаксический параллелизм и образ рук сохранены; архаизмы по возможности исключены.
