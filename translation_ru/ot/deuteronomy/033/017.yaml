source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: ru
  text: 'Его первородный бык величествен,

    и его рога — как рога дикого быка[a];

    ими он разом забодает народы

    до краёв земли.

    Это — десятки тысяч Ефрема[b],

    это — тысячи Манассии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тура». Еврейское слово, вероятно, обозначает могучего дикого быка; в старых переводах его иногда передавали словом «единорог».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мириады Ефрема». Еврейское слово обозначает десятки тысяч или вообще несметные множества и здесь противопоставлено «тысячам Манассии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: его первородный бык
  rationale: Сохраняет конкретный образ первородного самца крупного рогатого скота и притяжательное местоимение, не подменяя метафору более общим обозначением силы.
- source_word: הָדָר לוֹ
  choice: величествен
  rationale: Передаёт значение величия и великолепия естественной для современного русского именной конструкцией.
- source_word: קַרְנֵי רְאֵם
  choice: рога дикого быка
  rationale: רְאֵם, вероятнее всего, обозначает мощное дикое животное из семейства полорогих, возможно тура; перевод избегает традиционного, но зоологически сомнительного «единорога».
- source_word: יְנַגַּח
  choice: забодает
  rationale: Глагол описывает удар рогами; «забодает» сохраняет конкретный образ и его военную силу.
- source_word: יַחְדָּו
  choice: разом
  rationale: Передаёт совместный или одновременный охват действия, не добавляя явно отсутствующего в еврейском тексте слова «все».
- source_word: אַפְסֵי אָרֶץ
  choice: до краёв земли
  rationale: Естественно передаёт поэтическое обозначение самых дальних пределов мира.
- source_word: רִבְבוֹת
  choice: десятки тысяч
  rationale: Сохраняет числовое значение множественного רְבָבָה и ясный контраст с последующими «тысячами».
- source_word: אַלְפֵי
  choice: тысячи
  rationale: Числовое значение наиболее вероятно благодаря параллелизму с «десятками тысяч».
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: Ефрем / Манассия
  rationale: Использованы укоренившиеся русские библейские формы имён.
theological_decisions:
- issue: К кому относится образ первородного быка
  choice: Сохранить притяжательную и образную форму еврейского текста без прямого отождествления быка с Иосифом или Ефремом.
  alternative: 'Передать: «Он величествен, как первородный бык», прямо отнеся сравнение к Иосифу; либо считать быка прежде всего образом Ефрема.'
  rationale: Благословение обращено к Иосифу, а заключительная строка называет Ефрема и Манассию. Еврейская формулировка допускает напряжение между общим образом силы Иосифа и особым первенством Ефрема, поэтому перевод его не устраняет.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического параллелизма. Конкретная зооморфная и военная образность не смягчена; строки разбиты по смысловым поэтическим членам.
