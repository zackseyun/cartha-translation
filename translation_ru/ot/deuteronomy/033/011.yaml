  source_fidelity: 'Перевод точно передаёт повелительные формы, обращённые к Яхве, и сохраняет последовательность образов еврейского текста: благословение силы/возможностей Левия, принятие труда его рук, сокрушение силы противников и их окончательная неспособность вновь восстать. «Чтобы они больше не поднялись» — обоснованная естественная передача краткой конструкции מִן יְקוּמוּן без излишнего догматического или исторического уточнения.'
