  terminology: «Яхве» последовательно передаёт тетраграмматон согласно заданному подходу. «Его сила», «дело его рук», «сокруши», «восстаёт» и «ненавидит» хорошо соответствуют лексике исходного текста. Сноска a корректно сохраняет существенные лексические альтернативы для חַיִל, а сноска b поясняет телесный образ и синтаксическую краткость заключения.
