id: DEU.33.11
reference: Deuteronomy 33:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: ru
  text: 'Благослови, Яхве, его силу[a]

    и прими дело его рук.

    Сокруши чресла тех, кто восстаёт против него,

    и тех, кто ненавидит его,

    чтобы они больше не поднялись[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его достаток»; возможно также: «его войско». Еврейское слово может обозначать силу, средства, богатство или военную мощь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Сокруши чресла восстающих против него и ненавидящих его, чтобы они не поднялись». Чресла здесь — образ силы; заключительная еврейская конструкция кратка и допускает понимание «чтобы они больше не поднялись».'
    reason: cultural_and_syntactic_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: Благослови
  rationale: Повелительная форма, обращённая к Богу. Прямой и естественный перевод, не подменяющий благословение его возможным следствием — преуспеванием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: חֵילוֹ
  choice: его силу
  rationale: חַיִל может обозначать силу, средства, богатство или войско. «Силу» лучше всего сохраняет широту значения в данном благословении, не сужая его до имущества или военной силы.
- source_word: וּפֹעַל יָדָיו
  choice: дело его рук
  rationale: Сохраняет конкретный еврейский образ и естественно обозначает труд или совершаемое служение.
- source_word: תִּרְצֶה
  choice: прими
  rationale: Передаёт просьбу о Божьем благоволении и одобрении служения Левия, не уточняя сверх текста, идёт ли речь исключительно о жертвах.
- source_word: מְחַץ
  choice: сокруши
  rationale: Сохраняет силу и поэтическую краткость повеления со значением «раздробить, сокрушить».
- source_word: מָתְנַיִם
  choice: чресла
  rationale: Формально сохраняет телесный образ источника силы. Хотя слово имеет возвышенную окраску, в поэтическом благословении оно уместно; смысл образа пояснён в сноске.
- source_word: קָמָיו
  choice: тех, кто восстаёт против него
  rationale: Сохраняет глагольный образ противников, поднимающихся против Левия, вместо более общего «врагов».
- source_word: וּמְשַׂנְאָיו
  choice: тех, кто ненавидит его
  rationale: Прямо передаёт личную враждебность, выраженную причастием.
- source_word: מִן יְקוּמוּן
  choice: чтобы они больше не поднялись
  rationale: Еврейское выражение эллиптично; перевод естественно передаёт подразумеваемый результат сокрушения и сохраняет повтор образа «восстать/подняться».
theological_decisions:
- issue: К кому относятся местоимения «его» и «него»
  choice: К Левию, колену, благословляемому в ближайшем контексте
  alternative: К священническому служителю или к представительному служению Левия в более общем смысле
  rationale: Ближайший контекст — благословение Левия во Второзаконии 33:8–11. Единственное число сохранено по еврейскому тексту без дополнительного истолкования.
- issue: Смысл просьбы «прими дело его рук»
  choice: Общая просьба о принятии Богом труда и служения Левия
  alternative: Исключительно принятие жертв, приносимых священниками
  rationale: Священнический контекст допускает связь с жертвоприношениями, но сама формулировка шире; перевод не сужает её без необходимости.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Слово «чресла» намеренно сохраняет образ оригинала и сопровождается пояснением; остальная лексика проста и общепонятна. Строки оформлены как поэтическое благословение.
