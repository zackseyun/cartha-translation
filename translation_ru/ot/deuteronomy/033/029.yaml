  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: ru
  text: Блажен ты, Израиль! Кто подобен тебе? Ты — народ, спасённый Яхве; Он — щит твоей помощи и меч твоего величия. Враги твои униженно покорятся тебе[a], а ты будешь попирать их высоты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притворно покорятся тебе»; еврейский глагол может указывать на вынужденную или неискреннюю покорность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их возвышенности» или «их твердыни»; некоторые понимают это как «их спины», однако буквальное значение еврейского существительного — «высоты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: Блажен ты
  rationale: Форма אַשְׁרֵי выражает восхищённое провозглашение благополучия и блаженного состояния; «Блажен ты» сохраняет возвышенный тон и естественно звучит по-русски.
- source_word: מִי כָמוֹךָ
  choice: Кто подобен тебе
  rationale: Прямо передаёт риторический вопрос о несравненности Израиля.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: народ, спасённый Яхве
  rationale: Причастие нифаля נוֹשַׁע характеризует Израиль как народ, которого спас или избавил Яхве; русское страдательное причастие сохраняет эту грамматику.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте, не заменяя именование титулом.
- source_word: מָגֵן עֶזְרֶךָ
  choice: щитом твоей помощи
  rationale: Сжатая конструкция буквально связывает щит с помощью Израилю; творительный падеж продолжает оборот «спасённый Яхве» и представляет Яхве как щит.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: и мечом твоего величия
  rationale: Эллиптическая параллель называет Яхве также мечом, связанным с величием или возвышением Израиля. «Величие» сохраняет положительный смысл גַּאֲוָה без обязательного оттенка порочной гордости.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: Враги твои будут заискивать перед тобой
  rationale: כחשׁ может обозначать вынужденную, притворную покорность. «Заискивать» естественно передаёт униженную и потенциально неискреннюю покорность, а неоднозначность отмечена в сноске.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: ты будешь попирать их высоты
  rationale: בָּמוֹת прямо означает высоты и в военной поэзии может подразумевать возвышенности или укрепления врага; «попирать» сохраняет образ победного наступления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет это именование и не подменяет его титулом.
- issue: Значение גַּאֲוָתֶךָ
  choice: твоего величия
  alternative: твоей гордости; твоего возвышения; твоей славы
  rationale: Контекст благословения допускает положительное значение величия или возвышения. Выбор не вносит отрицательной нравственной оценки, которую современный читатель может услышать в слове «гордость».
- issue: Характер покорности врагов
  choice: будут заискивать перед тобой
  alternative: притворно покорятся тебе; будут пресмыкаться перед тобой
  rationale: Еврейский глагол допускает как униженную, так и неискреннюю покорность. Основной текст передаёт поведение врагов, а сноска сохраняет оттенок притворства.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим тоном благословения. Синтаксис остаётся близким к параллелизму еврейского стиха, но не перегружен архаизмами. Все сноски обозначены в основном тексте.
