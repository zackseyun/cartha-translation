base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: ru
  text: 'Они будут учить Иакова Твоим постановлениям

    и Израиль — Твоему закону[a];

    будут возлагать благовония пред Тобою[b]

    и всесожжение на Твой жертвенник.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоему наставлению» (תּוֹרָה).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у Твоего носа (или ноздрей)» — антропоморфный образ благовоний, приносимых пред Богом.'
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: будут учить
  rationale: Порода hифиль глагола ירה в священническом и правовом контексте означает «учить, наставлять». «Будут учить» ясно и естественно передаёт значение формы.
- source_word: מִשְׁפָּטֶיךָ
  choice: Твоим постановлениям
  rationale: מִשְׁפָּט может обозначать судебное решение, норму или установление. Здесь множественное «постановления» передаёт нормативно-правовой смысл и естественно сочетается с глаголом «учить».
- source_word: לְיַעֲקֹב
  choice: Иакова
  rationale: Предлог לְ отмечает адресата обучения. В русском языке при глаголе «учить» лицо естественно ставится в винительном падеже, а предмет обучения — в дательном.
- source_word: וְתוֹרָתְךָ
  choice: и Израиль — Твоему закону
  rationale: תּוֹרָה охватывает закон и наставление. В заветно-священническом контексте «закон» сохраняет правовой оттенок и узнаваемую библейскую лексику; более широкое «наставление» указано в сноске.
- source_word: יָשִׂימוּ
  choice: будут возлагать
  rationale: שׂים означает «класть, помещать». «Возлагать» естественно и достойно звучит применительно к священнодействию, не добавляя нового содержания.
- source_word: קְטוֹרָה
  choice: благовония
  rationale: Существительное обозначает ароматическое курение, приносимое в богослужении. «Благовония» понятно современному читателю и сохраняет культовый контекст без архаичного «фимиам».
- source_word: בְּאַפֶּךָ
  choice: пред Тобою
  rationale: Буквально выражение связано с «носом/ноздрями», но в контексте каждения обозначает принесение благовоний непосредственно Богу. «Пред Тобою» естественно передаёт функцию выражения, а буквальный образ сохранён в сноске.
- source_word: וְכָלִיל
  choice: и всесожжения
  rationale: כָּלִיל обозначает жертву, целиком сжигаемую на жертвеннике. Русское «всесожжения» точно выражает этот культовый термин; множественное число передаёт обобщённый, повторяющийся характер служения.
- source_word: עַל מִזְבְּחֶךָ
  choice: на Твой жертвенник
  rationale: Прямое и естественное соответствие древнееврейскому выражению в жертвенном контексте.
theological_decisions:
- issue: Значение תּוֹרָה в контексте завета
  choice: закон
  alternative: наставление
  rationale: Речь идёт о священническом служении Левия, который возвещает Израилю Божьи требования. «Закон» сохраняет юридико-заветный оттенок, тогда как допустимое более широкое значение отмечено в сноске.
- issue: Передача антропоморфного выражения בְּאַפֶּךָ
  choice: пред Тобою
  alternative: у Твоих ноздрей / перед Твоим лицом
  rationale: Буквальное «у Твоего носа» в современном русском было бы неясным и могло бы отвлекать читателя. Основной текст передаёт смысл каждения перед Богом, а исходный образ раскрывается в сноске без догматического расширения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Поэтический параллелизм сохранён разбивкой на строки; местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис приспособлен к русскому управлению глагола «учить», не меняя ролей участников.
