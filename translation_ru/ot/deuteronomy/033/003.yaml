    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Воистину
  rationale: Передаёт усилительно-утвердительную функцию частицы в возвышенной, но понятной современной русской речи.
- source_word: חֹבֵב
  choice: любит
  rationale: Причастие выражает постоянное расположение; настоящее время естественно передаёт этот смысл.
- source_word: עַמִּים
  choice: народы
  rationale: Сохраняет множественное собирательное значение и не сужает его заранее до языческих народов.
- source_word: כָּל קְדֹשָׁיו
  choice: все святые Его
  rationale: Сохраняет широкое обозначение принадлежащих Богу святых, не отождествляя их однозначно ни с ангелами, ни только с Израилем.
- source_word: בְּיָדֶךָ
  choice: в Твоей руке
  rationale: Сохраняет буквальный образ власти, защиты и принадлежности, а также переход от третьего лица ко второму.
- source_word: תֻּכּוּ
  choice: расположились
  rationale: Редкая и неясная форма по контексту может изображать тех, кто сидит или склонился у ног наставника; нейтральное «расположились» не уточняет позу чрезмерно.
- source_word: לְרַגְלֶךָ
  choice: у Твоих ног
  rationale: Естественно передаёт пространственный образ слушателей или последователей перед говорящим.
- source_word: יִשָּׂא
  choice: принимает
  rationale: В сочетании со словами передаёт вероятный контекстуальный смысл «принимать, усваивать», при сохранении иных возможностей в примечании.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: Твои слова
  rationale: Ясно передаёт речь или изречения; редкость формы и возможное значение предлога מ отмечены в сноске.
theological_decisions:
- issue: Смена лица в поэтической речи
  choice: 'Сохранено: «Он… Его… Твоей… Твоих… Твои».'
  alternative: Привести все местоимения либо к третьему, либо ко второму лицу.
  rationale: Смена лица присутствует в еврейском тексте и составляет часть его поэтической напряжённости; унификация была бы толкованием.
- issue: Кого обозначают «святые»
  choice: Оставлено широкое обозначение «святые Его».
  alternative: 'Уточнить: «ангелы», «святой народ Израиля» или употребить конфессионально окрашенное обозначение.'
  rationale: Контекст не требует однозначного отождествления, поэтому перевод не вводит более узкую богословскую интерпретацию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные местоимения сохраняют традиционное обозначение обращения к Богу. Синтаксис удерживает необычную смену третьего и второго лица, не сглаживая её.
