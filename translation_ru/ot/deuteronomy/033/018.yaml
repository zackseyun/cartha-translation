  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: ru
  text: 'О Завулоне он сказал:


    «Радуйся, Завулон, когда ты выходишь[a],

    а ты, Иссахар, радуйся в своих шатрах!»'
  philosophy: optimal-equivalence
  footnotes:
