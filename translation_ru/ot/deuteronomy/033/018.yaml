    text: 'Буквально: «при твоём выходе». Еврейское выражение может указывать не только на время выхода, но и на сферу деятельности или благополучия Завулона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: О Завулоне
  rationale: Предлог ל вводит благословение, относящееся к колену Завулона; форма «о Завулоне» естественно передаёт эту функцию по-русски, не превращая вводную формулу в прямое обращение.
- source_word: אָמַר
  choice: он сказал
  rationale: Нейтральная и точная передача обычного глагола речи אמר; местоимение сохраняет связь с говорящим в окружающем контексте.
- source_word: שְׂמַח
  choice: Радуйся
  rationale: Повелительная форма передана повелительным наклонением; «радуйся» сохраняет возвышенный тон благословения.
- source_word: זְבוּלֻן
  choice: Завулон
  rationale: Традиционная русская форма имени колена.
- source_word: בְּ/צֵאתֶךָ
  choice: когда выходишь
  rationale: Инфинитив с ב может обозначать обстоятельство времени или сферу деятельности. Такая формулировка естественна по-русски и сохраняет образ выхода, не конкретизируя его как торговлю, поход или иной вид деятельности.
- source_word: וְ/יִשָּׂשכָר
  choice: и Иссахар
  rationale: Союз связывает второе колено с Завулоном; пропущенное сказуемое «радуйся» легко восстанавливается из первой части поэтического параллелизма.
- source_word: בְּ/אֹהָלֶיךָ
  choice: в своих шатрах
  rationale: Сохранены конкретный образ шатров и форма множественного числа. Возвратное «своих» естественно передаёт принадлежность при обращении к олицетворённому колену.
