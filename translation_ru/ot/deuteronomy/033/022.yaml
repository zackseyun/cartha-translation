  text: וּ/לְ/דָ֣ן אָמַ֔ר דָּ֖ן גּ֣וּר אַרְיֵ֑ה יְזַנֵּ֖ק מִן הַ/בָּשָֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: ru
  text: 'О Дане он сказал:


    «Дан — львёнок;

    он выпрыгивает[a] из Васана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стремительно выскакивает». Еврейский глагол указывает на внезапное движение прыжком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְדָן
  choice: О Дане
  rationale: Предлог לְ в формуле, вводящей благословение следующего колена, имеет значение «о, относительно»; по-русски естественно «О Дане».
- source_word: אָמַר
  choice: он сказал
  rationale: Прямое и нейтральное соответствие обычному глаголу речи אמר; местоимение сохраняет связь с Моисеем в контексте.
- source_word: דָּן
  choice: Дан
  rationale: Традиционная русская передача имени и названия колена.
- source_word: גּוּר אַרְיֵה
  choice: львёнок
  rationale: Сочетание обозначает детёныша льва. «Львёнок» естественно в современном русском языке и точно передаёт образ без архаизма.
- source_word: יְזַנֵּק
  choice: он выпрыгивает
  rationale: Глагол выражает резкое, стремительное движение прыжком. «Выпрыгивает» сохраняет динамичный образ и не добавляет более узкого смысла нападения, как «набрасывается».
- source_word: מִן הַבָּשָׁן
  choice: из Васана
  rationale: מִן указывает на исходную точку движения, поэтому выбрано «из». «Васан» — традиционная русская форма географического названия Башан.
