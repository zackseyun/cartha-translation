  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: ru
  text: Закон заповедал нам Моисей[a] — наследие общины Иакова.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моисей заповедал нам закон». Еврейский порядок слов выдвигает «закон» в начало строки.'
    reason: alternative_reading
  - marker: b
    text: '«Закон» можно также перевести как «учение», а «наследие» — как «достояние» или «владение». Из-за сжатого еврейского синтаксиса возможно: «Моисей заповедал нам закон, наследие общины Иакова».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: закон
  rationale: В данном заветном контексте слово обозначает данное через Моисея авторитетное наставление и установление; «закон» естественно передаёт этот общеобязательный смысл, хотя возможно и «учение».
- source_word: צִוָּה
  choice: заповедал
  rationale: Глагол означает «повелеть, заповедать». «Заповедал» сохраняет силу авторитетного повеления и естественно сочетается с библейским контекстом.
- source_word: לָנוּ
  choice: нам
  rationale: Дательный падеж естественно передаёт לָנוּ и допускает оттенки как адресата, так и получателя.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Устоявшаяся русская форма имени.
- source_word: מוֹרָשָׁה
  choice: наследие
  rationale: Слово обозначает полученное во владение, в том числе по наследственному праву. «Наследие» хорошо выражает здесь передаваемое народу заветное достояние.
- source_word: קְהִלַּת
  choice: общины
  rationale: Передаёт собирательный смысл сообщества народа без излишне церковного оттенка слова «собрание» в некоторых современных контекстах.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено прямо названное в еврейском тексте имя, без поясняющей замены на «Израиль».
theological_decisions:
- issue: Синтаксическая связь двух частей стиха
  choice: Вторая часть через тире характеризует закон как наследие общины Иакова.
  alternative: '«Моисей заповедал нам закон, наследие общины Иакова» или две более самостоятельные части: «Закон заповедал нам Моисей; он — наследие общины Иакова».'
  rationale: Еврейский текст сжат, а во второй части нет выраженной связки. Тире сохраняет поэтическую краткость и вероятную аппозицию, не добавляя отсутствующего местоимения или глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «Закон заповедал нам Моисей» отражает начальную позицию תּוֹרָה и поэтический характер благословения; тире сохраняет сжатость оригинала.
