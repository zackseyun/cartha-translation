lexical_decisions:
- source_word: וְלֹא
  choice: И не
  rationale: Союз וְ связывает заповедь с соседними заповедями, поэтому передан словом «и»; לֹא с формой имперфекта выражает категорический запрет и естественно передаётся по-русски частицей «не» с повелительным наклонением.
- source_word: תִּנְאָף
  choice: прелюбодействуй
  rationale: Глагол נאף в этой заповеди обозначает нарушение супружеской верности. «Прелюбодействуй» — точный, устоявшийся и уместный для торжественного правового контекста русский эквивалент; форма единственного числа сохраняет прямое обращение к каждому участнику завета.
theological_decisions:
- issue: Передача запрета во втором лице мужского рода единственного числа в законе завета
  choice: И не прелюбодействуй.
  alternative: Не прелюбодействуй.
  rationale: Единственное число сохраняет личное обращение заповеди. Русское повелительное наклонение с «не» естественно передаёт запретительную силу древнееврейского имперфекта, не ослабляя категоричности. Начальное «и» сохранено как присутствующий в тексте связующий союз.
translation_notes:
  register: Современный литературный русский язык с традиционной, но по-прежнему понятной библейско-правовой лексикой. Формулировка краткая и торжественная, как в исходном тексте.
