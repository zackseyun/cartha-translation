  source_fidelity: 'В черновике верно переданы созыв всего Израиля, обращение в единственном числе «Слушай, Израиль» и различение חֻקִּים / מִשְׁפָּטִים. Однако заключительная конструкция וּשְׁמַרְתֶּם לַעֲשֹׂתָם передана неполно: «тщательно исполняйте» добавляет невыраженную в тексте степень тщательности и не сохраняет различие между «хранить/соблюдать» и заключительным «исполнять».'
