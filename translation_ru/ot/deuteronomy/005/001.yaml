  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: ru
  text: 'Моисей созвал весь Израиль и сказал им: «Слушай, Израиль, постановления и законы[a], которые я сегодня говорю вам; усвойте их и храните, чтобы исполнять их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «законы», может также означать «правовые нормы» или «судебные постановления».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: созвал
  rationale: В данном повествовательном контексте קרא обозначает созыв народа; «созвал» естественно передаёт обращение ко всему собранию.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохраняет коллективное обозначение народа как единого целого.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Слушай, Израиль
  rationale: Повелительная форма единственного числа обращена к Израилю как к единому народу; «слушай» выражает внимательное восприятие, предполагающее послушание.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Слово обозначает предписанные установления и сохраняет юридико-заветный регистр.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: В контексте это обязательные правовые нормы; «законы» понятно современному читателю и не создаёт ложного впечатления, будто речь идёт только о судебных приговорах.
- source_word: דֹּבֵר בְּאָזְנֵיכֶם הַיּוֹם
  choice: которые я сегодня возвещаю вам
  rationale: Передаёт продолжающееся устное обращение Моисея и смысл еврейской идиомы «в ваши уши» естественным литературным русским языком.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Изучите их
  rationale: Передаёт призыв усвоить данные постановления, а не только впервые услышать их.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: и тщательно исполняйте
  rationale: Конструкция выражает внимательное соблюдение с целью практического исполнения; русская формулировка естественно объединяет эти тесно связанные оттенки, не ослабляя призыва к действию.
theological_decisions:
- issue: Различение пары חֻקִּים / מִשְׁפָּטִים
  choice: постановления и законы
  alternative: установления и правовые нормы; постановления и суды
  rationale: Два связанных юридических термина сохранены раздельно, но без неестественного или вводящего в заблуждение буквального «суды».
- issue: Сила повеления שְׁמַע в заветном обращении
  choice: Слушай, Израиль
  alternative: Услышь, Израиль
  rationale: «Слушай» в современном русском обозначает направленное, внимательное восприятие и допускает присущий контексту призыв к послушанию, не превращая этот оттенок в отдельное добавленное утверждение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным регистром. Единственное число в обращении «Слушай, Израиль» сохраняет представление о народе как о едином целом; последующие формы множественного числа естественно обращены ко всем его членам.
