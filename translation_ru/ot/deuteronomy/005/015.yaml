  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: ru
  text: И помни, что ты был рабом в Египте и что Яхве, твой Бог, вывел тебя оттуда сильной рукой[a] и простёртой рукой; поэтому Яхве, твой Бог, повелел тебе соблюдать субботний день[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучей рукой». Еврейский образ подчёркивает силу, с которой Яхве совершил избавление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делать день субботы»; этот еврейский оборот означает соблюдать его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: И помни
  rationale: Форма с союзом продолжает предыдущее наставление и в данном контексте имеет побудительную силу; «И помни» естественно передаёт обе особенности.
- source_word: עֶבֶד
  choice: рабом
  rationale: Речь идёт о подневольном положении Израиля в Египте; «раб» точнее, чем «слуга», передаёт принудительный статус.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в Египте
  rationale: Естественный современный русский эквивалент; буквальное «в земле Египетской» здесь не добавляет существенного смысла и звучит архаично.
- source_word: וַיֹּצִאֲךָ
  choice: вывел тебя
  rationale: Каузативная форма יצא обозначает выведение из Египта и естественно передаётся русским «вывел».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: בְּיָד חֲזָקָה
  choice: сильной рукой
  rationale: Прямо передаёт חֲזָקָה и сохраняет телесный образ еврейской идиомы о могущественном избавлении.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: и простёртой рукой
  rationale: В современном русском «рука» является наиболее понятным соответствием זְרוֹעַ в этом образе; «мышца» было бы архаично и могло бы пониматься как отдельный мускул.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: 'Ясно выражает вывод: освобождение из рабства служит основанием заповеди о субботе.'
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: соблюдать день субботы
  rationale: Буквально оборот означает «делать день субботы», но в данном контексте это еврейская идиома соблюдения установленного дня.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как собственное имя; транслитерация сохраняет это различие, не смешивая имя с титулом.
- issue: Характер положения Израиля в Египте
  choice: раб
  alternative: слуга
  rationale: Контекст исхода и освобождения требует сохранить значение принудительного подневольного состояния, на котором основано повеление о субботнем покое.
- issue: Связь исхода с соблюдением субботы
  choice: поэтому
  alternative: по этой причине
  rationale: Сохранена прямо выраженная в עַל כֵּן богословская связь между освобождением Израиля из рабства и обязанностью соблюдать субботу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для широкого читателя; архаизмы «земля Египетская», «мышца» и «десница» не используются. Повтор «рукой» несколько заметен по-русски, но сохраняет параллельные телесные образы יָד и זְרוֹעַ без введения архаической лексики.
