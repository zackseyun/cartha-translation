id: DEU.5.11
reference: Deuteronomy 5:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: ru
  text: Не употребляй имя Яхве, твоего Бога, напрасно[a], потому что Яхве не оставит без наказания[b] того, кто употребляет его имя напрасно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для лжи», «неправомерно» или «впустую». Еврейское слово может относиться как к ложному, так и к пустому употреблению имени Яхве и не ограничивает запрет одним видом злоупотребления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не признает невиновным» или «не оправдает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: употребляй / употребляет
  rationale: Глагол נשא буквально имеет значения «поднимать, нести, носить». В сочетании с «именем» здесь речь идёт об обращении с именем или его использовании. Русское «употреблять имя» естественно передаёт широкий смысл запрета и не ограничивает его одним лишь произнесением или клятвой.
- source_word: שֵׁם
  choice: имя
  rationale: Прямой и естественный эквивалент, сохраняющий возможные оттенки личности, авторитета и репутации, связанные с именем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Сохраняет обращение во втором лице единственного числа и заветный характер формулировки.
- source_word: לַשָּׁוְא
  choice: напрасно
  rationale: שָׁוְא может обозначать пустоту, тщету, ложь или неправду. «Напрасно» звучит естественно и не сводит запрет только к ложной клятве; смысловой диапазон уточнён в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит основание и следствие данного запрета.
- source_word: יְנַקֶּה (נקה)
  choice: не оставит без наказания
  rationale: 'Порода piel здесь выражает судебный смысл: не объявить невиновным, не освободить от вины или наказания. Выбранная формулировка ясна современному читателю.'
- source_word: אֲשֶׁר
  choice: того, кто
  rationale: Естественно передаёт обобщённое обозначение любого нарушителя.
- source_word: שְׁמוֹ
  choice: его имя
  rationale: Местоимение прямо отсылает к имени Яхве; строчная буква соответствует обычной современной русской орфографической практике.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Объём запрета
  choice: не употребляй имя ... напрасно
  alternative: не произноси имени ... напрасно; не носи имя ... ложно; не призывай имя ... для лжи
  rationale: 'Еврейская формулировка допускает широкий круг значений: ложную клятву, пустое призывание имени и иное неправомерное обращение с ним. Основной текст не ограничивает запрет только речью или только клятвами.'
- issue: Судебный смысл נקה
  choice: не оставит без наказания
  alternative: не признает невиновным; не оправдает
  rationale: Формулировка передаёт неизбежность Божьего суда, не уточняя сверх текста конкретный вид наказания.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой заповеди. Повтор ключевых слов «Яхве», «имя» и «напрасно» сохранён ради структуры и выразительности еврейского текста. Формулировка «употреблять имя» выбрана вместо более традиционного «произносить имя всуе», поскольку она понятна современному читателю и лучше сохраняет широту исходного выражения.
