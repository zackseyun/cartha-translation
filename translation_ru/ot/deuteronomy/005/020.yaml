  text: Не давай ложных показаний против ближнего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не свидетельствуй ложно против ближнего».'
    reason: 'Лексико-синтаксическая альтернатива: еврейскую юридическую конструкцию можно естественно передать глаголом «свидетельствовать».'
lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Прямо передаёт отрицание в запрете; повелительная сила естественно выражена русской формой «не давай».
- source_word: תַעֲנֶה
  choice: давай
  rationale: В сочетании с עֵד глагол относится к даче свидетельства; «давать свидетельство» — естественная русская юридическая формулировка.
- source_word: בְרֵעֲךָ
  choice: против ближнего твоего
  rationale: Предлог בְ в данном судебном контексте указывает, против кого направлено свидетельство. רֵעַ передано традиционным и понятным словом «ближний».
- source_word: עֵד
  choice: свидетельства
  rationale: В сочетании с תַעֲנֶה обозначает свидетельские показания; русское «давать свидетельство» сохраняет юридический смысл конструкции.
- source_word: שָׁוְא
  choice: ложного
  rationale: Хотя слово может обозначать также пустоту, тщету или обман, в контексте свидетельства точнее всего значение «ложный».
