base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: ru
  text: Эти слова Яхве произнёс всему вашему собранию на горе, из огня, облака и густого мрака, громким голосом, и больше ничего не добавил[a]. Затем он написал их на двух каменных скрижалях и дал их мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не продолжал говорить». Еврейское выражение может означать, что он больше ничего не добавил или что он не продолжал говорить.'
    reason: Сохранение смысловой неоднозначности выражения וְלֹא יָסָף.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие имени от титула «Господь».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: Все эти слова
  rationale: דְּבָרִים здесь обозначает только что произнесённые слова завета; перевод не сужает значение до «заповедей».
- source_word: כָּל קְהַלְכֶם
  choice: всему вашему собранию
  rationale: קָהָל обозначает собравшееся сообщество; «собрание» естественно и сохраняет коллективный смысл.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: из среды огня, облака и густого мрака
  rationale: «Из среды» передаёт пространственную выразительность מִתּוֹךְ, а «густой мрак» — плотную тьму, обозначенную עֲרָפֶל.
- source_word: קוֹל גָּדוֹל
  choice: громким голосом
  rationale: Буквально «великим голосом»; в данном контексте речь идёт о силе звучания, что по-русски естественно выражается словом «громким».
- source_word: וְלֹא יָסָף
  choice: и больше ничего не добавил
  rationale: Фраза может указывать на то, что Яхве не добавил других слов; неоднозначность относительно продолжения речи отмечена в сноске.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: двух каменных скрижалях
  rationale: «Скрижали» — понятное и устойчивое русское обозначение каменных табличек завета; прилагательное «каменных» естественно передаёт еврейскую конструкцию.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: и передал мне
  rationale: Глагол נתן означает «дать, передать»; «передал мне» ясно выражает направленное действие без ненужного повторения местоименного дополнения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в еврейском тексте, и не заменяет его титулом.
- issue: Смысл וְלֹא יָסָף
  choice: и больше ничего не добавил
  alternative: и не продолжал говорить
  rationale: Основной текст подчёркивает завершённость произнесённых слов, но еврейское выражение допускает понимание прекращения дальнейшей речи; этот вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Местоимение «он» написано со строчной буквы согласно нейтральной современной норме; имя «Яхве» прямо передаёт тетраграмматон. Маркер сноски поставлен непосредственно после неоднозначной фразы.
