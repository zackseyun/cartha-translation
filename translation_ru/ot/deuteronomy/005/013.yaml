  text: Six days you shall labor and do all your work,[a]
translation:
  language: ru
  text: Шесть дней трудись и делай всю свою работу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Шесть дней можешь трудиться и делать всю свою работу». В этом законодательном контексте форму первого еврейского глагола можно понимать как предписание или как разрешение; это значение распространяется и на следующий соединённый с ним глагол.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Шесть дней
  rationale: Сочетание числительного в сопряжённой форме с существительным естественно передаёт длительность без добавления отсутствующего в еврейском предлога.
- source_word: תַּעֲבֹד
  choice: трудись
  rationale: Глагол עבד здесь обозначает обычный труд. Русская форма повелительного наклонения естественно передаёт предписывающую силу имперфекта в законодательном контексте и позволяет отличить этот глагол от следующего עשה.
- source_word: וְעָשִׂיתָ
  choice: и делай
  rationale: Широкое значение עשה в сочетании с מְלָאכָה естественно передаётся глаголом «делать»; сохранена координация двух еврейских глаголов.
- source_word: כָּל
  choice: всю
  rationale: Передаёт значение полноты и согласуется в русском языке с существительным женского рода «работу».
- source_word: מְלַאכְתֶּךָ
  choice: свою работу
  rationale: מְלָאכָה в контексте субботней заповеди означает работу, занятие или дело. Возвратное притяжательное местоимение «свою» — естественный русский эквивалент суффикса второго лица при подлежащем «ты».
theological_decisions:
- issue: Предписывающая или разрешительная сила имперфекта в законодательном контексте
  choice: «трудись и делай» — предписание в форме повелительного наклонения
  alternative: «можешь трудиться и делать» — разрешительное понимание
  rationale: Контекст заветной заповеди допускает предписывающее прочтение, которое в современном русском естественно выражается повелительным наклонением. Вместе с тем еврейский имперфект может здесь обозначать разрешённую деятельность в течение шести дней, поэтому эта подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий, ясный и достойный законодательный стиль. Повелительные формы звучат естественнее буквального будущего «будешь трудиться», при этом разрешительное прочтение сохранено в сноске.
