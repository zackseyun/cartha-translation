revisions:
- from: О, если бы сердце их всегда было таким — чтобы они боялись Меня и соблюдали все Мои заповеди во все дни своей жизни, дабы благо было им и их детям вовеки![a]
  to: О, если бы у них было такое сердце — чтобы бояться Меня и соблюдать все Мои заповеди во все дни своей жизни, — чтобы им и их детям было хорошо вовеки![a]
  rationale: 'Исправлен объём «во все дни»: он относится к боязни Бога и соблюдению заповедей, как в еврейском тексте. Также заменено неестественное для современного русского «благо было им» на ясную и семантически равноценную формулу «было хорошо». Сноска уточнена, чтобы альтернативный вариант не вводил добавленного «всегда».'
