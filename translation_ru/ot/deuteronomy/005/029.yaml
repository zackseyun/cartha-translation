base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: ru
  text: О, если бы у них было такое сердце — чтобы бояться Меня и соблюдать все Мои заповеди во все дни своей жизни, — чтобы им и их детям было хорошо вовеки![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто даст, чтобы у них было такое сердце?» Еврейское начало — идиома сильного желания, буквально: «Кто даст…?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы
  rationale: Еврейская идиома, буквально «кто даст?», выражает сильное желание. Русское «О, если бы» естественно передаёт её эмоциональную и желательную силу.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: сердце их всегда было таким
  rationale: 'Конструкция передаёт содержание пожелания: чтобы у народа сохранялось именно такое внутреннее расположение. «Сердце» сохраняет библейское обозначение воли, мысли и нравственной направленности.'
- source_word: לְיִרְאָה אֹתִי
  choice: чтобы они боялись Меня
  rationale: «Бояться» сохраняет устойчивый библейский язык благоговейного страха и послушания перед Богом, не сводя его лишь к почтению.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: и соблюдали все Мои заповеди
  rationale: В сочетании с заповедями שׁמר означает исполнять и соблюдать их; это естественное современное русское выражение.
- source_word: כָּל הַיָּמִים
  choice: во все дни своей жизни
  rationale: Буквально «все дни»; контекстуально речь идёт о постоянстве на протяжении всей жизни.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: дабы благо было им
  rationale: Формула обозначает благополучие под Божьим благословением, не ограничивая смысл материальным процветанием. «Дабы» уместно в торжественной прямой речи и ясно передаёт цель или результат.
- source_word: וְלִבְנֵיהֶם לְעֹלָם
  choice: и их детям вовеки
  rationale: בנים в данном заветном контексте охватывает детей и потомство вообще; «детям» естественно и точно, а «вовеки» сохраняет сильную временную формулу.
theological_decisions:
- issue: Антропологическое значение לְבָבָם
  choice: сердце
  alternative: ум; внутреннее расположение
  rationale: Слово охватывает внутреннюю волю, мысль и нравственно-духовную направленность человека. «Сердце» сохраняет библейскую категорию и её богословскую полноту.
- issue: Смысл страха перед Богом
  choice: боялись Меня
  alternative: почитали Меня; благоговели передо Мной
  rationale: Исходный глагол сохраняет напряжение между страхом, благоговением и послушанием. Прямой перевод «боялись» не устраняет эту многозначность.
- issue: Референт וְלִבְנֵיהֶם
  choice: их детям
  alternative: их сыновьям; их потомкам
  rationale: Грамматически мужская форма в данном контексте обозначает потомство народа в целом, поэтому «детям» передаёт реальный объём значения без неоправданного сужения.
translation_notes:
  register: Современный литературный русский с достоинством библейской прямой речи. Синтаксис проясняет, что страх перед Богом и соблюдение заповедей характеризуют желаемое состояние сердца. Слова «дабы» и «вовеки» сохраняют торжественность, оставаясь понятными современному читателю.
