  source_fidelity: 'Основной смысл передан верно: личное имя יהוה передано как «Яхве», обращение во 2-м лице единственного числа сохранено, а הוֹצֵאתִיךָ корректно передано глаголом «вывел». «Дом рабства» — естественная русская идиоматическая передача בֵּית עֲבָדִים при сохранении буквального «дом рабов» в сноске. Однако «из Египетской земли» не является естественным современным русским соответствием מֵאֶרֶץ מִצְרַיִם; «из земли Египта» точнее и нормативнее.'
