base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: ru
  text: Я — Яхве, твой Бог, который вывел тебя из земли Египта, из дома рабства[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из дома рабов»; возможно также: «из места порабощения».'
    reason: Сноска сохраняет конкретное множественное число еврейского עֲבָדִים и поясняет смысл идиоматического выражения.
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Я —
  rationale: Самостоятельное местоимение открывает торжественное безглагольное высказывание; тире естественно передаёт именную конструкцию в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма содержит суффикс второго лица мужского рода единственного числа; в контексте речь идёт о Боге Израиля.
- source_word: הוֹצֵאתִיךָ
  choice: вывел тебя
  rationale: Каузативная форма глагола יצא означает «заставить выйти, вывести»; русский глагол естественно выражает исход из Египта.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из Египетской земли
  rationale: Предлог מִן обозначает исходную точку, а сочетание сохраняет образ земли/страны Египта в естественной русской форме.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабства
  rationale: Это естественная по-русски передача устойчивого образа места порабощения; конкретное множественное עֲבָדִים («рабы») отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога; транслитерация сохраняет его функцию, не подменяя титулом.
- issue: Передача выражения בֵּית עֲבָדִים
  choice: дом рабства
  alternative: дом рабов
  rationale: «Дом рабства» ясно обозначает Египет как место порабощения и звучит естественно по-русски, тогда как буквальное «дом рабов» может быть ошибочно понято просто как жилище, принадлежащее рабам. Конкретная форма оригинала сохранена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Строчная буква в «который» следует нейтральной современной орфографии и не вводит конфессиональную практику почтительного написания местоимений с прописной буквы.
