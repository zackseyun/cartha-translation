  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. «Бог» с прописной буквы уместен в данном референте и не создаёт конфессионально специфической интерпретации. «Дом рабства» удачно передаёт смысл формулы; сноска справедливо отмечает конкретное множественное число «рабов» в еврейском тексте.
