base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: ru
  text: 'Я в то время стоял между Яхве и вами, чтобы возвестить вам слово Яхве, потому что вы испугались огня и не взошли на гору. Он сказал[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «говоря». Эта формула вводит слова Яхве, следующие в стихе 6; «Он сказал» — синтаксическое развёртывание для русского языка.
    reason: Сохраняет формальную особенность לֵאמֹר и поясняет добавленную в русском переводе личную форму.
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: Я … стоял
  rationale: Самостоятельное местоимение подчёркивает роль Моисея; причастие в контексте прошедшего события передаётся естественной русской формой «стоял».
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: между Яхве и вами
  rationale: Сохраняется образ посреднического положения Моисея между Яхве и народом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное заветное имя Бога, непосредственно представленное тетраграмматоном.
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Естественный современный русский эквивалент временного выражения.
- source_word: לְהַגִּיד לָכֶם
  choice: чтобы передать вам
  rationale: В данной посреднической ситуации глагол означает сообщить народу услышанное слово; «передать» звучит естественно и точно.
- source_word: אֶת דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняется библейское обозначение Божьей речи без сведения его лишь к общему «сообщению».
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит причину посредничества Моисея: страх народа и его невосхождение на гору.'
- source_word: יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: вы испугались огня
  rationale: Русское управление «испугаться чего» естественно передаёт страх, вызванный огнём, без тяжеловесного воспроизведения еврейской идиомы.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: и не взошли на гору
  rationale: «Взойти на гору» точно и достойно передаёт направленное движение вверх.
- source_word: לֵאמֹר
  choice: Он сказал
  rationale: Формула вводит последующую речь Яхве; в русском самостоятельное предложение яснее, чем двусмысленное причастие «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное заветное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Подразумеваемый субъект при לֵאמֹר
  choice: Он сказал
  alternative: говоря
  rationale: Контекст следующего стиха указывает на Божью речь, однако еврейская формула сама по себе лаконична; местоимение проясняет русскую связь, а примечание сохраняет формальную особенность оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Синтаксис разделён перед вводом прямой речи, чтобы избежать впечатления, будто последующее говорит народ или Моисей.
