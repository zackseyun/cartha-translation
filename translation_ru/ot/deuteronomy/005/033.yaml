base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: ru
  text: Идите по всему пути, который заповедал вам Яхве, ваш Бог, чтобы вы жили, чтобы вам было хорошо и чтобы продлились ваши дни на земле, которой вы овладеете[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую вы унаследуете». Еврейский глагол может означать как вступление во владение, так и получение в наследство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: по всему пути
  rationale: Сохранены единственное число и образ пути как установленного Богом образа жизни; выражение передаёт также требование следовать ему во всей полноте.
- source_word: צִוָּה
  choice: заповедал
  rationale: Глагол естественно передаёт завершённое повеление, сохраняющее обязательную силу, и соответствует возвышенному повествовательно-законодательному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, стоящее в еврейском тексте.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Сохранено обращённое ко всему Израилю заветное выражение.
- source_word: תֵּלֵכוּ
  choice: идите
  rationale: Сохранена еврейская метафора хождения, обозначающая поведение и верность Божьему повелению.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Ясно выражает целевое и одновременно результативное отношение последующих благословений к послушанию.
- source_word: תִּחְיוּן
  choice: вы жили
  rationale: Прямо и естественно передаёт значение жизни в контексте заветного благословения.
- source_word: וְטוֹב לָכֶם
  choice: чтобы вам было хорошо
  rationale: Естественное русское выражение охватывает благополучие, не сужая его до материального процветания.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: чтобы продлились ваши дни
  rationale: Сохраняет образ «продления дней» и при этом звучит естественно и торжественно по-русски.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Обычное русское выражение для пребывания и жизни на конкретной территории обетованной земли.
- source_word: תִּירָשׁוּן
  choice: которой вы овладеете
  rationale: Передаёт конкретный смысл вступления во владение землёй; возможность значения наследования сохранена в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Значение ירשׁ применительно к земле
  choice: земле, которой вы овладеете
  alternative: земле, которую вы унаследуете
  rationale: Основной текст сохраняет конкретный территориальный смысл обладания, а примечание отражает подлинно возможный оттенок наследования.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного увещания. Сохранены повтор «чтобы» и метафоры пути и продления дней; синтаксис остаётся ясным для обычного читателя.
