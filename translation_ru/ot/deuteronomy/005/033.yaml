  source_fidelity: 'Текст точно передаёт повелительное «идите/ходите» (תלכון), единственный образ «пути» (בכל הדרך), связь с повелением Яхве, а также три следствия послушания: жизнь, благополучие и долготу дней. «Чтобы продлились ваши дни» естественно передаёт еврейскую идиому הארכת ימים, не сужая её смысл. «На земле, которой вы овладеете» соответствует בָּאָרֶץ אֲשֶׁר תִּירָשׁוּן; вариант «унаследуете» обоснованно вынесен в примечание.'
