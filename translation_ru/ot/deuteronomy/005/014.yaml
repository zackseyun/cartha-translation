  to: А седьмой день — суббота, посвящённая Яхве, твоему Богу. Не делай никакой работы — ни ты, ни твой сын, ни твоя дочь, ни твой раб, ни твоя рабыня, ни твой вол, ни твой осёл, ни весь твой скот, ни пришлый житель[a], живущий в твоих городах[b], — чтобы твой раб и твоя рабыня отдыхали так же, как ты.
