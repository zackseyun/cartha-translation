  source_fidelity: 'Основной смысл и структура перечня переданы точно: седьмой день посвящён Яхве; запрет работы распространяется на членов дома, рабов и рабынь, рабочий скот и пришлого жителя; цель — отдых раба и рабыни наравне с адресатом. Однако «ни какой-либо из твоих домашних животных» грамматически и семантически неудачно передаёт כָּל־בְּהֶמְתֶּךָ («весь твой скот»). «В твоих селениях» допустимо как смысловое раскрытие идиомы, но «в твоих городах» точнее соответствует общественно-юридической сфере выражения «в твоих воротах».'
