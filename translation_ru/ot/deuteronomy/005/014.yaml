  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: ru
  text: А седьмой день — суббота, посвящённая Яхве, твоему Богу. Не делай никакой работы — ни ты, ни твой сын, ни твоя дочь, ни твой раб, ни твоя рабыня, ни твой вол, ни твой осёл, ни весь твой скот, ни пришлый житель[a], живущий в твоих городах[b], — чтобы твой раб и твоя рабыня отдыхали так же, как ты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселенец». Еврейское גֵּר означает человека иноземного происхождения, живущего внутри местной общины.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в твоих воротах» — идиома со значением «в пределах твоего города или общины».'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: суббота
  rationale: Слово обозначает установленный священный день покоя, а не просто отдых вообще; в русском языке закрепилось соответствие «суббота».
- source_word: לַיהוָה
  choice: посвящённая Яхве
  rationale: Предлог ל выражает направленность или посвящение; такая формулировка естественно передаёт, что суббота принадлежит Яхве и посвящена Ему.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте, без замены титулом «Господь».
- source_word: מְלָאכָה
  choice: работа
  rationale: Широкое современное обозначение деятельности, запрещённой в субботу, без неоправданного сужения до физического труда.
- source_word: עַבְדְּךָ
  choice: твой раб
  rationale: Термин обозначает зависимого члена дома; «раб» сохраняет социально-правовой статус, существенный в повелении предоставить ему отдых.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: твоя рабыня
  rationale: Женский термин, парный к עבד; «рабыня» сохраняет и пол, и зависимый статус.
- source_word: שׁוֹר
  choice: вол
  rationale: В хозяйственно-правовом контексте речь идёт прежде всего о крупном рогатом рабочем животном; «вол» — точное и привычное русское соответствие.
- source_word: חֲמוֹר
  choice: осёл
  rationale: Обычное современное русское название домашнего вьючного животного.
- source_word: בְּהֵמָה
  choice: домашние животные
  rationale: В данном перечне слово охватывает принадлежащий дому скот; формулировка понятна современному читателю и не сводит значение к одному виду животных.
- source_word: גֵּר
  choice: переселенец
  rationale: Обозначает человека иноземного происхождения, постоянно или длительно живущего среди общины, а не случайного путника; сноска сохраняет возможное уточнение «пришлый житель».
- source_word: בִּשְׁעָרֶיךָ
  choice: в твоих селениях
  rationale: Буквально «в твоих воротах» — древнееврейская идиома пребывания в пределах города или местной общины; в основном тексте передан её смысл, буквальный образ отмечен в сноске.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно и точно выражает цель заповеди.
- source_word: כָּמוֹךָ
  choice: так же, как ты
  rationale: Сохраняет прямое сопоставление отдыха зависимых работников с отдыхом адресата заповеди.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя. Транслитерация «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Статус עבד и אמה
  choice: раб и рабыня
  alternative: слуга и служанка
  rationale: Контекст домашнего законодательства и парность терминов указывают на зависимый статус. Более мягкие слова «слуга/служанка» могли бы скрыть социальную реальность текста.
- issue: Характер субботы в выражении לַיהוָה
  choice: суббота, посвящённая Яхве
  alternative: суббота Яхве; суббота для Яхве
  rationale: Перевод раскрывает значение посвящения или принадлежности, выраженное предлогом ל, не сводя его к одному лишь обладанию.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Перечень сохранён ритмичным повторением «ни», а архаизмы вроде «пришелец» и «в пределах врат» устранены. Личное имя Бога передано как «Яхве»; социальные термины не смягчены.
