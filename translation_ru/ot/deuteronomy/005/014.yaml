  terminology: «Суббота», «Яхве», «работа», «раб/рабыня», «вол» и «осёл» приемлемы. «Весь твой скот» передаёт собирательное בְּהֵמָה без неоправданного ограничения только домашними животными. «Пришлый житель» сохраняет статус גֵּר, а сноска поясняет его происхождение и проживание среди общины.
