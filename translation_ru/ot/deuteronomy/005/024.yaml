base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: ru
  text: 'И вы сказали: «Вот, Господь, Бог наш, показал нам Свою славу и Своё величие, и мы услышали Его голос из огня. Сегодня мы увидели, что Бог говорит с человеком, и человек остаётся жив».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: вот
  rationale: Передаёт указательно-восклицательную частицу естественным и возвышенным русским выражением.
- source_word: יְהוָה
  choice: Господь
  rationale: Следует устойчивой русской библейской традиции передачи тетраграмматона и ясно сохраняет его как личное имя Бога в данном контексте.
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: Свою славу и Своё величие
  rationale: Сохраняет два отдельных понятия исходного текста без их смыслового слияния.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из огня
  rationale: Естественно передаёт буквальное «из среды огня» без ненужной тяжеловесности.
- source_word: יְדַבֵּר
  choice: может говорить
  rationale: 'В конструкции с כִּי форма допускает обобщённый смысл возможности: пережитое показало, что Бог может говорить с человеком, не вызывая неизбежно его смерти.'
- source_word: וָחָי
  choice: и тот остаётся жив
  rationale: 'Передаёт результативный смысл: человек, с которым говорит Бог, продолжает жить; местоимение «тот» устраняет возможную русскую двусмысленность субъекта.'
theological_decisions:
- issue: Означает ли встреча с Божьим голосом неизбежную смерть человека
  choice: «Бог может говорить с человеком, и тот остаётся жив»
  alternative: «Бог говорит с человеком, и он жив»
  rationale: 'Выбранный вариант сохраняет удивление говорящих: их опыт доказывает возможность непосредственной Божьей речи без смерти человека. Он не превращает утверждение в безусловную формулу о всяком случае.'
- issue: Передача имени יהוה
  choice: «Господь»
  alternative: «Яхве»
  rationale: «Господь» соответствует укоренившейся русской читательской и литургической традиции, не добавляя конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; сохранены повтор «Свою… Своё» и торжественный порядок наименования «Господь, Бог наш». Кавычка должна быть закрыта в итоговой публикационной строке.
