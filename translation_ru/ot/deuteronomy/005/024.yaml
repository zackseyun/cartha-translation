revisions:
- from: 'И вы сказали: «Вот, Господь, Бог наш, показал нам Свою славу и Своё величие, и мы услышали Его голос из огня. Сегодня мы увидели, что Бог может говорить с человеком, и тот остаётся жив.'
  to: 'И вы сказали: «Вот, Господь, Бог наш, показал нам Свою славу и Своё величие, и мы услышали Его голос из огня. Сегодня мы увидели, что Бог говорит с человеком, и человек остаётся жив».'
  rationale: Исправлена пунктуационная структурная ошибка. «Бог говорит с человеком, и человек остаётся жив» ближе к еврейской формулировке כִּי יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם וָחָי, не превращая высказывание в явно модальное утверждение и не оставляя неясным, кто именно остаётся жив. Смысл из английского аудиторского следа — удивление тому, что человек жив после Божьей речи, — сохранён контекстуально.
