base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: ru
  text: Не делай себе ни изваяния[a], ни какого-либо подобия[b] того, что на небесах вверху, на земле внизу или в водах под землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идола». Еврейское слово обозначает высеченное или вырезанное изображение и часто связано с идолопоклонством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изображения», «формы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: изваяние
  rationale: Слово обозначает высеченное или вырезанное изображение, нередко служащее идолом. «Изваяние» сохраняет конкретный смысл и не вводит заранее толкование «идол».
- source_word: תְּמוּנָה
  choice: подобие
  rationale: Слово может означать вид, форму или подобие. «Подобие» естественно передаёт расширение запрета на всякое воспроизведение облика.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Не делай себе
  rationale: Прямая запретительная форма естественна для современного русского языка; «себе» сохраняет значение לְךָ.
- source_word: כָּל תְּמוּנָה
  choice: никакого подобия
  rationale: После отрицательного запрета כָּל естественно передаётся словом «никакого», выражающим всеохватность.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: того, что на небесах вверху
  rationale: Сохраняются множественное число שָׁמַיִם и пространственное противопоставление «вверху — внизу».
- source_word: בָּאָרֶץ מִתָּחַת
  choice: на земле внизу
  rationale: Предлог «на» соответствует естественному русскому обозначению земной сферы, а «внизу» передаёт מִתָּחַת.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: в водах под землёй
  rationale: Формулировка прямо и естественно передаёт древнее пространственное представление текста.
theological_decisions:
- issue: Объём запрета на изображения
  choice: Передать запрет на изготовление изваяния или подобия, не добавляя цели поклонения.
  alternative: Истолковательно перевести как запрет делать идолов для поклонения.
  rationale: Поклонение и служение изображениям прямо запрещаются в следующем стихе; здесь сохранена последовательность исходного текста.
- issue: Связь между פֶסֶל и כָּל תְּמוּנָה
  choice: Передать бессоюзную связь пояснительным тире.
  alternative: Добавить союз «или» либо «и».
  rationale: В еврейском тексте между существительными нет выраженного союза. Тире сохраняет возможность понимать вторую фразу как пояснение или расширение первой, не закрепляя одну синтаксическую трактовку.
translation_notes:
  register: Современный литературный русский язык с краткой и торжественной формой заповеди. Пространственные пары «вверху — внизу — под землёй» сохранены ясно и без архаизмов; бессоюзие исходного текста передано тире.
