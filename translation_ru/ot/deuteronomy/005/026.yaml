  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: ru
  text: Ибо кто из людей[a], как мы, слышал голос живого Бога, говорящего из среды огня, и остался жив?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из всей плоти» — еврейское выражение, обозначающее людей как смертных существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование страха и просьбы народа в ближайшем контексте; «ибо» естественно передаёт причинно-аргументативную связь и сохраняет возвышенный тон.
- source_word: מִי כָל בָּשָׂר
  choice: кто из смертных
  rationale: Риторический вопрос охватывает смертных людей вообще. Такое выражение естественно по-русски и передаёт присущую идиоме «всякая плоть» мысль о человеческой смертности, не создавая впечатления буквального вопроса о телесной ткани.
- source_word: שָׁמַע
  choice: слышал
  rationale: Русское прошедшее время естественно описывает состоявшийся опыт, с которым сопоставляется опыт Израиля.
- source_word: קוֹל
  choice: голос
  rationale: При глаголе речи קוֹל обозначает именно голос, а не просто звук.
- source_word: אֱלֹהִים חַיִּים
  choice: живого Бога
  rationale: Хотя обе еврейские формы морфологически множественны, в данном устойчивом выражении и контексте они обозначают единого Бога Израиля.
- source_word: מְדַבֵּר
  choice: говорит
  rationale: Причастие описывает Бога, говорящего в момент слышания; личная глагольная форма создаёт ясное и естественное русское придаточное.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из среды огня
  rationale: Передаёт исходящий изнутри огня голос и сохраняет образность исходного выражения.
- source_word: כָּמֹנוּ
  choice: подобно нам
  rationale: Сравнение относится к уникальному опыту Израиля, слышавшего Бога; формулировка сохраняет краткость и допускаемую оригиналом связь с предшествующим высказыванием.
- source_word: וַיֶּחִי
  choice: и остался жив
  rationale: Передаёт буквальный смысл «и жил», одновременно естественно выражая по-русски удивление тому, что человек пережил такую встречу.
theological_decisions:
- issue: Антропологическая идиома כָל בָּשָׂר
  choice: кто из смертных
  alternative: кто из всякой плоти; кто из всех людей
  rationale: Выбор передаёт не только общий охват человечества, но и акцент на смертности и тварности человека перед живым Богом. Примечание сохраняет прозрачность исходной идиомы.
- issue: Число и значение אֱלֹהִים חַיִּים
  choice: живого Бога
  alternative: живых богов
  rationale: Несмотря на морфологическое множественное число, выражение в контексте относится к единому Богу Израиля; перевод во множественном числе исказил бы смысл.
- issue: Смысл וַיֶּחִי после слышания Божьего голоса
  choice: и остался жив
  alternative: и выжил
  rationale: 'Формулировка сохраняет основное значение глагола «жить» и передаёт напряжение текста: смертный человек услышал Бога и не умер, без добавления более сильного толкования.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторическая структура и напряжение между Божьим присутствием и человеческой смертностью сохранены; архаичное буквальное «всякая плоть» вынесено в примечание.
