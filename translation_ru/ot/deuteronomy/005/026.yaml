- from: Ибо кто из смертных[a] слышал, как голос живого Бога говорит из среды огня, подобно нам, — и остался жив?
  to: Ибо кто из людей[a], как мы, слышал голос живого Бога, говорящего из среды огня, и остался жив?
  rationale: Исправлен порядок слов, чтобы «как мы» безусловно относилось к человеческому опыту слышания Божьего голоса и сохранения жизни. «Кто из людей» точнее передаёт охват еврейской идиомы в современном литературном русском; примечание сохраняет буквальную форму и оттенок смертности. Смысл, регистр и ключевые богословские термины не изменены.
