    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: И когда вы услышали
  rationale: Сочетание вводит следующее событие повествования и временное придаточное; по-русски естественно передаётся без буквального «и было».
- source_word: הַקּוֹל
  choice: голос
  rationale: קוֹל может означать голос или звук, но контекст Божьей речи на Хориве поддерживает личностное «голос»; лексическая широта отмечена в сноске.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: из среды тьмы
  rationale: Передаёт пространственный образ תּוֹךְ («середина, среда») и сохраняет торжественный, но понятный регистр.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: в то время как гора горела огнём
  rationale: Союз понимается обстоятельственно, а причастие — как продолжающееся действие, сопутствующее слышанию голоса.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: вы приблизились ко мне
  rationale: Точно передаёт движение к Моисею и звучит естественно в современном литературном русском.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: все главы ваших племён
  rationale: Сохраняет еврейскую метафору «главы» для официальных племенных руководителей.
- source_word: וְזִקְנֵיכֶם
  choice: и ваши старейшины
  rationale: Здесь זְקֵנִים обозначает признанных представителей общины, а не просто пожилых людей.
