  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: ru
  text: А ты стой здесь со Мною, и Я скажу тебе всю заповедь[a], установления и законы, которым ты научишь их, чтобы они исполняли их в земле, которую Я даю им во владение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь стоит единственное число: «всю заповедь»; далее следуют множественные «установления» и «законы». «Заповедь» может иметь собирательный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы они овладели ею»; возможно также: «чтобы унаследовали её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: останься здесь со Мною
  rationale: Глагол עָמַד буквально связан со стоянием, но в данном сочетании выражает повеление Моисею оставаться в Божьем присутствии; «останься здесь» естественно передаёт этот смысл по-русски.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: и Я сообщу тебе
  rationale: Когортатив после повеления обозначает последующее намеренное действие; «сообщу тебе» позволяет естественно присоединить перечень наставлений.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: всю заповедь
  rationale: Сохранено единственное число מִצְוָה и охватывающее значение כָּל; существительное, вероятно, употреблено собирательно.
- source_word: הַחֻקִּים
  choice: установления
  rationale: «Установления» передаёт закреплённые предписания завета и сохраняет отличие от מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: В данном правовом контексте слово обозначает обязательные правовые нормы; «законы» понятно современному читателю и не смешивается с «установлениями».
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: которым ты научишь их
  rationale: Глагол выражает поручение Моисею обучить народ данным предписаниям; форма будущего времени сохраняет направленность поручения.
- source_word: וְעָשׂוּ
  choice: чтобы они исполняли их
  rationale: В контексте союзная форма выражает ожидаемую цель или результат обучения; «исполняли» естественно передаёт практическое соблюдение предписаний.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: которую Я даю им
  rationale: Причастие נֹתֵן изображает дарование земли как совершающееся и несомненное действие Бога.
- source_word: לְרִשְׁתָּהּ
  choice: во владение
  rationale: В контексте обещанной земли יָרַשׁ означает вступить во владение ею; существительное «владение» кратко и естественно передаёт цель дарования.
theological_decisions:
- issue: Правовая триада מִצְוָה / חֻקִּים / מִשְׁפָּטִים
  choice: 'Сохранить три различимых термина: «заповедь, установления и законы».'
  alternative: Обобщить как «все законы и предписания».
  rationale: Раздельная передача сохраняет правовую структуру и полноту наставления, не сводя разные обозначения к одному понятию.
- issue: Единственное число מִצְוָה
  choice: Передать как «всю заповедь» в единственном числе.
  alternative: Передать множественным числом «все заповеди».
  rationale: Единственное число исходного текста, вероятно собирательное; его сохранение не устраняет эту содержательную напряжённость.
- issue: Связь וְעָשׂוּ с обучением
  choice: Передать целевым оборотом «чтобы они исполняли их».
  alternative: Передать последовательностью «и они будут исполнять их».
  rationale: Целевая связь естественна в контексте поручения учить народ, хотя еврейская союзная конструкция допускает и оттенок последующего результата.
translation_notes:
  register: Современный литературный русский язык с достоинством речи завета. Прописные местоимения в прямой речи Бога сохранены как устойчивая русская библейская норма. Формулировки избегают архаизмов, но удерживают различие правовых терминов и единственное число «заповедь».
