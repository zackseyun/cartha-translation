source:
  edition: WLC
  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: ru
  text: И теперь зачем нам умирать? Ведь этот великий огонь пожрёт нас. Если мы и дальше будем слышать голос Яхве, нашего Бога, то умрём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как связующую силу ו, так и временное значение עַתָּה; выражение естественно продолжает речь народа.
- source_word: לָמָּה נָמוּת
  choice: зачем нам умирать?
  rationale: Риторический вопрос передаёт ожидаемую и страшную перспективу смерти; русская конструкция с инфинитивом звучит естественно и не превращает форму в простой вопрос о будущем.
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание предыдущего риторического вопроса и естественно передаёт объяснительную связь.
- source_word: תֹאכְלֵנוּ
  choice: пожрёт нас
  rationale: Глагол אכל буквально связан с поеданием; при огне «пожрёт» сохраняет яркий образ и остаётся нормативным для возвышенного повествования.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: этот великий огонь
  rationale: Прямо сохраняет указательное местоимение, качественное определение и образ огня.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: Если мы и дальше будем слышать
  rationale: Конструкция יסף + инфинитив обозначает продолжение действия; «и дальше будем» ясно и естественно передаёт это значение.
- source_word: קוֹל
  choice: голос
  rationale: В контексте божественной речи речь идёт именно о голосе, а не просто о звуке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Сохраняет притяжательную форму и заветный характер высказывания.
- source_word: עוֹד
  choice: и дальше
  rationale: В данном условном высказывании обозначает дальнейшее продолжение слышания.
- source_word: וָמָתְנוּ
  choice: то умрём
  rationale: Передаёт результат условия; добавленное по нормам русского языка «то» делает условно-следственную связь прозрачной.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством и выразительностью исходного образа. «Пожрёт» выбрано вместо более нейтрального «поглотит», чтобы сохранить метафору אכל; порядок слов и условная конструкция адаптированы к естественному русскому синтаксису.
