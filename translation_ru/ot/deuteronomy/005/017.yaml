    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Стандартная отрицательная частица; вместе с формой 2-го лица выражает прямой запрет.
- source_word: תִּרְצָח
  choice: убивай
  rationale: Глагол רָצַח обозначает прежде всего неправомерное лишение человека жизни. В русском языке традиционная и естественная формула «не убивай» сохраняет краткость заповеди, а необходимое смысловое уточнение дано в сноске.
theological_decisions:
- issue: Объём запрета в шестой заповеди
  choice: 'Основной текст: «Не убивай», со сноской, уточняющей значение как неправомерное лишение жизни, в том числе убийство.'
  alternative: «Не совершай убийства».
  rationale: Еврейский רָצַח уже, чем общее обозначение всякого умерщвления, однако русское «не убивай» является естественной, достоинственной и узнаваемой формой заповеди. Сноска предотвращает истолкование этого глагола как безусловного запрета на любое лишение жизни и сохраняет его нравственно-правовую точность.
translation_notes:
