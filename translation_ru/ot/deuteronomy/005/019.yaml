    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: И не
  rationale: Союз וְ связывает эту заповедь с предыдущими в последовательности Десяти заповедей; «И» сохраняет координацию и ритм еврейского текста, а «не» передаёт прямой запрет.
- source_word: תִּגְנֹב
  choice: кради
  rationale: 'Форма Qal imperfect 2-го лица мужского рода единственного числа вместе с לֹא выражает запрет. Русское «не кради» естественно, кратко и сохраняет общий смысл: в стихе не назван предмет кражи, поэтому более узкое «не похищай человека» в основной текст не внесено.'
theological_decisions: []
