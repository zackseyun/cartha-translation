  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: ru
  text: Ты подойди и выслушай всё, что скажет ГОСПОДЬ, Бог наш, и передай нам всё, что ГОСПОДЬ, Бог наш, скажет тебе; а мы выслушаем и исполним».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: Подойди ты
  rationale: 'Императив «подойди / приблизься» с явным местоимением передан с сохранением смыслового акцента: именно Моисей должен приблизиться.'
- source_word: וּשֲׁמָע
  choice: и выслушай
  rationale: В данном контексте שׁמע означает внимательное слушание Божьей речи; «выслушай» естественно по-русски и отличает поручение Моисею от последующего обязательства народа.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Тетраграмматон передан принятой в русской библейской традиции формой «ГОСПОДЬ», с прописным набором для обозначения личного Божьего имени.
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: перескажи нам
  rationale: Форма буквально означает «скажи / передай нам»; «перескажи» ясно выражает посредническую передачу услышанного, не добавляя идеи толкования.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: и мы выслушаем и исполним
  rationale: 'Сохранена последовательность двух глаголов: народ обещает услышать переданное и осуществить сказанное. «Исполним» естественно передаёт עשה применительно к повелениям.'
theological_decisions:
- issue: Посредническая роль Моисея
  choice: Сохранено прямое поручение Моисею приблизиться, услышать Бога и передать народу всё сказанное.
  alternative: Обобщить как просьбу к религиозному посреднику или добавить толкование его статуса.
  rationale: Стих описывает конкретную просьбу народа и не требует догматического уточнения природы посредничества.
- issue: Обязательство народа «слушать и делать»
  choice: «мы выслушаем и исполним»
  alternative: «мы послушаемся»
  rationale: Раздельная передача обоих еврейских глаголов сохраняет риторическую форму и полноту обещания, не сливая слушание с послушанием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис сделан ясным для устного чтения; повторение «ГОСПОДЬ, Бог наш» сохранено как значимое повторение оригинала. Закрывающая кавычка предполагает, что стих входит в продолжающуюся прямую речь из контекста.
