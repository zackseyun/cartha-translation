  source_fidelity: 'Текст точно передаёт основное отрицательно-сопоставительное высказывание: «не с нашими отцами ... а с нами». «Яхве», «заключил этот завет», указание на присутствие «здесь», время «сегодня» и признак жизни сохранены. Усиление אֲנַחְנוּ אֵלֶּה и всеохватность כֻּלָּנוּ естественно выражены сочетанием «с нами — со всеми нами».'
