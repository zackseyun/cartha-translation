base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: ru
  text: Не с нашими отцами[a] заключил Яхве этот завет[b], а с нами — со всеми нами, кто сегодня здесь и жив.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с нашими предками». Буквально: «с нашими отцами».'
    reason: lexical_alternative
  - marker: b
    text: Древнееврейская идиома буквально означает «разрезал этот завет».
    reason: lexical_alternative
  - marker: c
    text: 'Некоторые понимают это противопоставление риторически: не только с нашими отцами, но особенно с нами, находящимися здесь сегодня.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אֶת אֲבֹתֵינוּ
  choice: не с нашими отцами
  rationale: Сохраняет прямое отрицание и конкретное значение אבות — «отцы», не заменяя его в основном тексте более широким словом «предки».
- source_word: כָּרַת ... אֶת הַבְּרִית הַזֹּאת
  choice: заключил ... этот завет
  rationale: Обычный русский эквивалент древнееврейской идиомы «разрезал завет»; указательное הַזֹּאת передано словом «этот».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, обозначенное тетраграмматоном, а не заменяет его титулом «Господь».
- source_word: כִּי אִתָּנוּ
  choice: а с нами
  rationale: В данном отрицательно-сопоставительном построении כִּי имеет противительное значение; «а» естественно выражает его по-русски.
- source_word: אֲנַחְנוּ אֵלֶּה ... כֻּלָּנוּ
  choice: со всеми нами
  rationale: Передаёт усиленное указание на присутствующее поколение и явно сохраняет значение всеобщности כֻּלָּנוּ, избегая неестественной буквальной конструкции «мы, эти».
- source_word: פֹה הַיּוֹם ... חַיִּים
  choice: кто сегодня здесь и жив
  rationale: Сохраняет оба обстоятельства — «здесь» и «сегодня» — и предикативный смысл «живы» в естественной современной русской форме.
theological_decisions:
- issue: Отрицается ли связь завета с отцами безусловно или риторически подчёркивается его непосредственная обращённость к нынешнему поколению
  choice: 'В основном тексте сохранено прямое противопоставление: «не с нашими отцами ... а с нами».'
  alternative: Понимать фразу как «не только с нашими отцами» или как риторическое подчёркивание обновления и нынешней значимости завета.
  rationale: В древнееврейском тексте нет слова «только» или иного явного ограничителя. Поэтому перевод не разрешает богословское напряжение добавлением отсутствующих слов, а возможное риторическое понимание отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для широкого читателя; тире перед «со всеми нами» передаёт усиление древнееврейского приложения, а прямое противопоставление поколений сохранено без добавления толковательных ограничений.
