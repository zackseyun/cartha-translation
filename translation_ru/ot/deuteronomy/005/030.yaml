  language: ru
  text: 'Иди, скажи им: «Возвращайтесь в свои шатры».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Иди
  rationale: Императив הלך здесь прямо повелевает Моисею пойти и передать сообщение; «иди» — естественный и точный русский эквивалент.
- source_word: אֱמֹר
  choice: скажи
  rationale: Императив אמר вводит содержание порученной речи; «скажи» сохраняет простой характер повеления.
- source_word: לָהֶם
  choice: им
  rationale: Предлог с суффиксом 3-го лица множественного числа обозначает адресатов сообщения.
- source_word: שׁוּבוּ
  choice: возвращайтесь
  rationale: Императив множественного числа от שוב означает возвращение народа к прежнему месту пребывания после богоявления.
- source_word: לָכֶם
  choice: в свои
  rationale: Сочетание с שוב идиоматически указывает на возвращение каждого к принадлежащему ему месту; по-русски это естественно передаётся словом «свои».
- source_word: לְאָהֳלֵיכֶם
  choice: шатры
  rationale: Буквально — «ваши шатры». «Шатры» сохраняет конкретный исторический образ и звучит достойно и понятно в современном литературном русском языке.
