  text: You shall have no other gods before me[a].
translation:
  language: ru
  text: У тебя не должно быть других богов предо Мной[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кроме Меня». В еврейском тексте буквально: «перед Моим лицом»; это выражение может указывать и на присутствие, и на исключительность.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Пусть не будет у тебя
  rationale: Еврейская конструкция с היה и לְךָ буквально выражает существование или наличие по отношению к адресату. Русская конструкция «пусть не будет у тебя» естественно передаёт запрет и сохраняет форму, близкую к оригиналу.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: других богов
  rationale: Множественное אֱלֹהִים с определением «другие» обозначает иных, соперничающих богов; «других богов» — прямой и общепонятный русский эквивалент.
- source_word: עַל פָּנָי
  choice: предо Мной
  rationale: Буквально выражение связано с нахождением «перед лицом» говорящего. «Предо Мной» сохраняет образ присутствия и не сводит смысл исключительно к пояснительному «кроме Меня».
theological_decisions:
- issue: Смысл заключительного выражения עַל פָּנָי
  choice: предо Мной
  alternative: кроме Меня; в Моём присутствии
  rationale: Еврейское выражение допускает как пространственно-реляционный смысл «передо Мной / в Моём присутствии», так и подразумеваемое требование исключительности «кроме Меня». Основной текст сохраняет формально прозрачное выражение, а примечание указывает значимую альтернативу.
translation_notes:
  register: Современный литературный и торжественный библейский регистр. Форма «предо Мной» несколько возвышенна, но ясна обычному читателю и точнее сохраняет образ еврейского выражения, чем нейтральное толкование.
