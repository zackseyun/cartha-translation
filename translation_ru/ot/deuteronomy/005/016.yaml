  terminology: '«Почитай», «Яхве, Бог твой» и «земля, которую ... даёт тебе» удачны. Не следует переносить английские сноски: они содержательно не соответствуют позициям их маркеров и не требуются русскому тексту для сохранения неоднозначности.'
