  source_fidelity: 'Смысл и синтаксические связи еврейского текста в целом переданы точно: повеление обращено к обоим родителям; имя יהוה передано как «Яхве»; сохранены оба следствия/цели и конкретное указание на даруемую землю. Однако «чтобы продлились дни твои» в современном русском звучит неестественно и может восприниматься как разовое продление уже текущих дней, тогда как יַאֲרִיכֻן יָמֶיךָ — обычное выражение о долговременности жизни («пусть дни будут долгими»).'
