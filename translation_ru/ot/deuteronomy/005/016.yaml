base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: ru
  text: Почитай отца твоего и мать твою, как повелел тебе Яхве, Бог твой, чтобы дни твои были долгими и чтобы тебе было хорошо на земле, которую Яхве, Бог твой, даёт тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: Почитай
  rationale: Порода пиэль в данном контексте означает признавать значимость родителей и относиться к ним с почтением. «Почитай» точно передаёт этическую силу повеления и естественно звучит в русском библейском регистре.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: отца твоего и мать твою
  rationale: Повтор показателя прямого дополнения перед каждым существительным придаёт обоим родителям равный вес; симметричная русская конструкция это сохраняет.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: как повелел тебе
  rationale: Союз вводит соответствие ранее данному Божьему повелению, а перфект указывает на уже состоявшееся повеление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: Бог твой
  rationale: Сохраняется притяжательное значение суффикса и выраженная им связь Бога с адресатом завета.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Русский целевой союз естественно передаёт допускаемое контекстом значение цели и результата.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: продлились дни твои
  rationale: Сохранён образ исходного текста, в котором подлежащим выступают «дни», без сведения выражения только к пояснительному «ты долго жил».
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: и чтобы хорошо было тебе
  rationale: Естественно передаёт идиому благополучия, не уточняя сверх текста, идёт ли речь исключительно о материальном процветании.
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: Предлог «на» соответствует עַל, а «земля» здесь обозначает даруемую территорию, а не просто почву.
- source_word: נֹתֵן לָךְ
  choice: даёт тебе
  rationale: Настоящее время передаёт причастную форму и представляет дарование земли как совершающееся и несомненное действие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация сохраняет это отличие от титула.
- issue: Характер обещания долгой жизни и благополучия
  choice: Сохранить прямое заветное обещание без дополнительного толкования
  alternative: Представить его как безусловную гарантию каждому отдельному человеку либо как исключительно общенациональный принцип
  rationale: Текст связывает почитание родителей с долголетием и благополучием на даруемой земле, но сам не уточняет, как соотносятся индивидуальное и общинное измерения обещания.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским ритмом. Порядок «отца твоего», «Бог твой», «дни твои» выбран для достоинства и симметрии, оставаясь понятным современному читателю. Английские сноски не перенесены: предоставленные тексты сносок не соответствуют своим маркерам и не отражают необходимой неоднозначности еврейского текста.'
