  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: ru
  text: Лицом к лицу говорил с вами Яхве на горе, из среды огня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «лицом к лицу» означает непосредственное личное обращение; ср. Второзаконие 4:12, где Израиль слышит голос, но не видит образа.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: лицом к лицу
  rationale: Сохраняет буквальный образ и риторическую силу еврейского выражения, обозначающего непосредственное личное обращение, не утверждая само по себе зрительного восприятия Божьего облика.
- source_word: דִּבֶּר
  choice: говорил
  rationale: Точно передаёт значение глагола и вместе с עִמָּכֶם естественно образует сочетание «говорил с вами».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עִמָּכֶם
  choice: с вами
  rationale: Прямо отражает обычное значение предлога עִם и подчёркивает непосредственность обращения.
- source_word: בָּהָר
  choice: на горе
  rationale: Естественно передаёт локативное значение предлога ב в контексте Синая.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: из среды огня
  rationale: Передаёт более точное пространственное значение מִתּוֹךְ, сохраняя торжественный и зримый образ богоявления.
theological_decisions:
- issue: Антропоморфное выражение «лицом к лицу» в описании синайского богоявления
  choice: Сохранить выражение «лицом к лицу» как указание на непосредственное обращение в рамках завета, не истолковывая его как обязательное буквальное видение Божьего лица.
  alternative: 'Передать толковательно: «непосредственно» или «лично».'
  rationale: 'Второзаконие 4:12, 15 сообщает, что Израиль слышал голос, но не видел образа. Поэтому перевод сохраняет подлинное напряжение текста: образное выражение не устраняется, но и не превращается в прямое утверждение о зрительном восприятии.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Начальное «Лицом к лицу» сохраняет смысловое выделение исходного еврейского порядка слов.
