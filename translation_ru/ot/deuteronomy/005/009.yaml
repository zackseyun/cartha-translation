  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: ru
  text: Не поклоняйся им[a] и не служи им, ибо Я — Яхве, твой Бог, Бог ревнивый, взыскивающий[b] за вину отцов с детей, с третьего и с четвёртого поколения[c] тех, кто ненавидит Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не падай перед ними ниц». Еврейский глагол обозначает телесное преклонение в знак почитания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «привлекающий к ответу» или «наказывающий». Еврейское слово буквально говорит о Божьем посещении и здесь имеет судебный смысл, включающий расплату за вину.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на третьих и на четвёртых»; слово «поколения» добавлено по смыслу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: поклоняйся
  rationale: Передаёт конкретное действие почтительного преклонения перед объектом культа и сохраняет отличие от следующего глагола «служить».
- source_word: תָעָבְדֵם
  choice: служи им
  rationale: Сохраняет значение культового служения и не сливает два параллельных запрета в общее «не поклоняйся».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: אֵל קַנָּא
  choice: Бог ревнивый
  rationale: В контексте завета выражает исключительное право Бога на поклонение и неприятие соперничающих культов; «ревностный» ослабило бы эту смысловую сторону.
- source_word: פֹּקֵד
  choice: взыскивающий
  rationale: Русское «взыскивать за беззаконие» естественно выражает судебное привлечение к ответу, не сводя значение исключительно к наказанию.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: Сохраняет нравственную тяжесть слова и допускает присущую ему связь между проступком, виной и последствиями.
- source_word: אָבוֹת
  choice: отцов
  rationale: Следует мужскому множественному числу еврейского текста, не заменяя его более общим «предков» или «родителей».
- source_word: עַל בָּנִים
  choice: с детей
  rationale: В контексте смены поколений בנים обозначает потомков обоих полов; «детей» естественно передаёт этот охват.
- source_word: וְעַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: до третьего и четвёртого поколения
  rationale: Идиоматичная русская передача последовательности поколений; слово «поколения» подразумевается, но отсутствует в еврейском тексте.
- source_word: לְשֹׂנְאָי
  choice: тех, кто ненавидит Меня
  rationale: Сохраняет конечную характеристику людей, охваченных взысканием, не превращая фразу в утверждение о безусловной ответственности потомков независимо от их отношения к Богу.
theological_decisions:
- issue: Передача Божьей ревности
  choice: Бог ревнивый
  alternative: Бог ревностный
  rationale: «Ревнивый» точнее сохраняет заветную исключительность и Божье неприятие поклонения иным богам, не приписывая Богу порочную человеческую зависть.
- issue: Межпоколенческая ответственность
  choice: Финальное «тех, кто ненавидит Меня» оставлено как характеристика людей в пределах описанного взыскания
  alternative: Понимать стих как безусловное наказание потомков исключительно за грех отцов
  rationale: Так сохраняются синтаксис и богословское напряжение исходного текста без внесения учения об автоматической виновности потомков; при этом формулировка не устраняет реальности последствий отцовского беззакония для последующих поколений.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Единственное число во втором лице сохранено как в еврейском обращении. Заглавные буквы в местоимениях, относящихся к Богу, использованы в соответствии с принятым русским библейским регистром.
