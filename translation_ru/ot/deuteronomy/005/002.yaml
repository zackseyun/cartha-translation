  text: יְהוָ֣ה אֱלֹהֵ֗י/נוּ כָּרַ֥ת עִמָּ֛/נוּ בְּרִ֖ית בְּ/חֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: ru
  text: Яхве, наш Бог, заключил с нами завет на Хориве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассёк с нами завет на Хориве».'
    reason: Сноска сохраняет буквальный образ еврейского устойчивого выражения כָּרַת בְּרִית — «рассечь завет», которое в основном тексте естественно передано как «заключить завет».
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом «Господь».
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Точно передаёт форму с местоименным суффиксом первого лица множественного числа и выраженную ею связь Бога с народом.
- source_word: כָּרַת
  choice: заключил
  rationale: В сочетании с «завет» еврейский глагол образует устойчивое выражение, естественно передаваемое по-русски как «заключить завет»; буквальный образ сохранён в сноске.
- source_word: עִמָּנוּ
  choice: с нами
  rationale: Прямо передаёт предлог с местоименным суффиксом и сохраняет взаимный характер завета.
- source_word: בְּרִית
  choice: завет
  rationale: «Завет» — устоявшийся и содержательно точный русский эквивалент, сохраняющий религиозный и обязательственный смысл слова.
- source_word: בְּחֹרֵב
  choice: на Хориве
  rationale: Это естественная русская форма обозначения места при традиционной передаче топонима חֹרֵב как «Хорив».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» непосредственно сохраняет его как имя и не подменяет титулом; «Иегова» отражает более позднюю гибридную традицию произношения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и торжественная без архаизации. Порядок слов сохраняет акцент на Яхве как инициаторе завета.
