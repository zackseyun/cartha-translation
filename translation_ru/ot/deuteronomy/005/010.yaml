source:
  edition: WLC
  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַֽ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מצות/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: ru
  text: но проявляющий неизменную любовь к тысячам — к тем, кто любит Меня и соблюдает Его заповеди.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях и переводах: «Мои заповеди», что согласуется с окружающей речью от первого лица; в представленном здесь еврейском тексте: «Его заповеди».'
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: но проявляющий
  rationale: Причастие продолжает описание Бога из предыдущего стиха, а союз по контексту выражает противопоставление наказанию; «проявляющий» естественно передаёт действие по отношению к людям.
- source_word: חֶסֶד
  choice: неизменную любовь
  rationale: חֶסֶד обозначает верную, стойкую любовь и преданность; этот вариант понятен современному читателю и передаёт больше, чем одно лишь «милосердие».
- source_word: לַאֲלָפִים
  choice: к тысячам
  rationale: В данном еврейском тексте сказано буквально «к тысячам» без существительного «поколения», поэтому оно не добавляется.
- source_word: לְאֹהֲבַי
  choice: к тем, кто любит Меня
  rationale: Причастие с суффиксом первого лица естественно передаётся по-русски относительным оборотом.
- source_word: וּלְשֹׁמְרֵי
  choice: и соблюдает
  rationale: שמר в сочетании с заповедями означает хранить и исполнять их; «соблюдать заповеди» — точное и естественное русское выражение.
- source_word: מצות/ו
  choice: Его заповеди
  rationale: В предоставленном тексте суффикс третьего лица мужского рода означает «Его». Контекстуально ожидаемое «Мои» не подставляется в основной текст, а отмечается в сноске.
theological_decisions:
- issue: Лицо притяжательного местоимения при слове «заповеди»
  choice: Его заповеди
  alternative: Мои заповеди
  rationale: Основной текст следует предоставленной еврейской форме с суффиксом третьего лица, хотя первое лицо лучше согласуется с «любит Меня» и прямой речью вокруг. Значимое напряжение сохраняется, а контекстуальный вариант приводится в сноске.
- issue: Значение «тысяч»
  choice: тысячам
  alternative: тысяче поколений / тысячам поколений
  rationale: Существительное «поколения» в этом стихе отсутствует; его добавление сняло бы сохраняемую исходным текстом неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранена причастная связь с предыдущим стихом, поэтому фраза намеренно начинается со строчной буквы и не превращена в самостоятельное личное предложение. Местоимения, относящиеся к Богу, написаны с прописной буквы.
