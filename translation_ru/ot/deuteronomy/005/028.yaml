  - severity: low
    issue: Сноска b сформулирована не вполне естественно и неточно по-русски.
    rationale: «Правильно поступили во всём, что сказали» может восприниматься как совершение действий, о которых они говорили. Более нейтральное «Они хорошо поступили, сказав всё это» передаёт возможный широкий оттенок היטיבו, не добавляя нового содержания.
