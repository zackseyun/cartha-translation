base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: ru
  text: 'И Яхве услышал ваши слова, когда вы говорили мне[a], и Яхве сказал мне: «Я услышал слова этого народа, которые они сказали тебе. Они верно сказали всё, что сказали[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышал голос (или звук) ваших слов»; то же выражение повторяется далее о словах народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Они хорошо поступили, сказав всё это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: услышал / Я услышал
  rationale: В данном контексте глагол обозначает восприятие произнесённых слов; простое «услышал» точно и естественно по-русски.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: ваши слова / слова
  rationale: Буквальное «голос (или звук) слов» сохраняется в сноске; в основном тексте «услышал слова» естественно передаёт еврейскую слуховую идиому без потери смысла.
- source_word: בְּדַבֶּרְכֶם אֵלָי
  choice: когда вы говорили мне
  rationale: Предлог ב при инфинитивной конструкции обозначает одновременность действия; «когда» ясно передаёт временную связь.
- source_word: הָעָם הַזֶּה
  choice: этого народа
  rationale: Сохраняет собирательное единственное число עָם и указательное значение.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: которые они сказали тебе
  rationale: Относительное предложение относится к словам народа и сохраняет повтор корня דבר в естественной русской форме.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: Всё, что они сказали, — хорошо
  rationale: Передаёт одобрительную оценку сказанного, не создавая впечатления, будто речь идёт лишь о красноречии; возможное значение «правильно поступили» отмечено в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено личное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер Божьего одобрения слов народа
  choice: «Всё, что они сказали, — хорошо»
  alternative: «Они правильно поступили во всём, что сказали»
  rationale: Формулировка сохраняет направленность оценки на сказанное, а сноска отражает более широкую семантику הֵיטִיבוּ и не снимает возможную напряжённость между одобрением слов и оценкой поступка.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис прям и понятен; повтор имени «Яхве» и слов «услышал», «сказали» сохранён вслед за еврейским текстом. Неестественная для русского слуховая идиома вынесена в сноску.
