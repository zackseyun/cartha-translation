  source_fidelity: 'Первая часть передана точно: Яхве слышит обращённые к Моисею слова народа, затем сообщает Моисею, что услышал слова «этого народа». Опущенная в основном тексте слуховая идиома קוֹל («голос/звук») допустимо и прозрачно компенсирована сноской. Однако «Всё, что они сказали, — хорошо» несколько ослабляет личную глагольную оценку הֵיטִיבוּ («они хорошо/верно сказали, они поступили хорошо»); безопаснее сохранить субъект «они».'
