  terminology: «Яхве» последовательно и корректно передаёт יהוה. «Народ» удачно сохраняет собирательное единственное число הָעָם. В сноске b альтернативу следует сформулировать как возможное более широкое значение глагола היטיבו, не создавая неестественной конструкции «поступили во всём, что сказали».
