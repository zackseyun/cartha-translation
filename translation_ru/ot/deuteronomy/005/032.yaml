base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: ru
  text: Итак, тщательно исполняйте так, как повелел вам Яхве, ваш Бог; не уклоняйтесь ни вправо, ни влево.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не уклоняйтесь вправо или влево»; это образное выражение означает, что нельзя ни в чём отступать от Божьего повеления.'
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: тщательно исполняйте
  rationale: Сочетание שׁמר с инфинитивом выражает внимательное соблюдение, ведущее к исполнению; такая передача естественно выражает увещевательно-повелительный смысл контекста.
- source_word: כַּאֲשֶׁר
  choice: всё, что
  rationale: В данном контексте оборот требует полного соответствия повелению. Русское «всё, что повелел» передаёт полноту исполнения без тяжеловесного буквального «согласно тому, как».
- source_word: צִוָּה
  choice: повелел
  rationale: Совершенный вид передаёт уже данное Божье повеление, сохраняющее обязательную силу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Сохраняется прямое значение конструкции с притяжательным суффиксом второго лица множественного числа.
- source_word: לֹא תָסֻרוּ
  choice: не уклоняйтесь
  rationale: Глагол סור метафорически обозначает отступление от предписанного пути; «уклоняться» ясно и естественно передаёт этот смысл.
- source_word: יָמִין וּשְׂמֹאל
  choice: ни вправо, ни влево
  rationale: Русская парная конструкция с «ни… ни…» естественно выражает запрет отклонения в любом направлении и сохраняет образ пути.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с ясной повелительной интонацией. Сохранены образ пути и личное имя Бога; синтаксис сделан естественным для обычного читателя.
