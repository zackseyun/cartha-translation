base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: ru
  text: Не возжелай[a] жены твоего ближнего и не желай дома твоего ближнего[b], его поля, его раба, его рабыни, его быка, его осла — ничего, что принадлежит твоему ближнему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол означает сильное, предосудительное желание того, что принадлежит другому. Далее употреблён другой, близкий по смыслу глагол.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «дом» может также обозначать домохозяйство или владение в более широком смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: не желай
  rationale: Глагол חמד обозначает сильное, здесь предосудительное желание присвоить принадлежащее другому. «Не желай» естественно звучит как нравственный запрет и сохраняет знакомую библейскую формулировку.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: жены твоего ближнего
  rationale: Сочетание прямо обозначает жену ближнего; русский родительный оборот точен и естественен.
- source_word: תִתְאַוֶּה
  choice: не жажди
  rationale: Форма от אוה выражает сильное желание. «Не жажди» отличает этот глагол от предшествующего חמד, не превращая внутреннее желание в совершённое действие.
- source_word: בֵּית רֵעֶךָ
  choice: дома твоего ближнего
  rationale: בַּיִת может означать как дом, так и домохозяйство; перечисление поля, рабов и скота допускает более широкий имущественный оттенок, но основным и наиболее прозрачным соответствием остаётся «дом».
- source_word: שָׂדֵהוּ
  choice: его поля
  rationale: שָׂדֶה обычно означает поле или участок земли; конкретное «поле» сохраняет особенность формулировки Второзакония.
- source_word: עַבְדּוֹ
  choice: его раба
  rationale: В данном перечне имущества עֶבֶד указывает на несвободный статус человека; «раб» передаёт это прямо, без смягчения до общего «слуга».
- source_word: אֲמָתוֹ
  choice: его рабыни
  rationale: אָמָה обозначает женщину в рабском или зависимом статусе. «Рабыня» ясно передаёт статус и сохраняет половое различие в паре с עֶבֶד.
- source_word: שׁוֹרוֹ
  choice: его быка
  rationale: שׁוֹר обозначает крупный рогатый скот, часто рабочего быка; «бык» — понятное современное соответствие в имущественном перечне.
- source_word: חֲמֹרוֹ
  choice: его осла
  rationale: חֲמוֹר прямо означает осла; это точное и общеупотребительное русское соответствие.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: ничего, что принадлежит твоему ближнему
  rationale: Отрицательное «ничего» естественно подводит итог запрету и явно передаёт принадлежность, выраженную конструкцией с לְ.
- source_word: רֵעֶךָ
  choice: твоего ближнего
  rationale: רֵעַ означает другого человека, с которым говорящий связан общественными отношениями. «Ближний» точно, традиционно и понятно передаёт этот этический термин.
theological_decisions:
- issue: Различение двух глаголов запретительного желания
  choice: Передать חמד как «желать», а אוה как «жаждать»
  alternative: 'Перевести оба глагола одинаково: «желать» или «возжелать»'
  rationale: Еврейский текст употребляет два близких, но разных глагола. Разные русские соответствия сохраняют риторическую структуру и возможный оттенок усиления, не утверждая чрезмерно жёсткого смыслового разграничения.
- issue: Передача терминов рабского статуса
  choice: Употребить «раб» и «рабыня»
  alternative: «слуга» и «служанка»
  rationale: Контекст перечисления принадлежащих домохозяйству людей, животных и имущества делает несвободный статус существенным; прямые термины не скрывают историческую реальность текста.
- issue: Объём значения בַּיִת
  choice: В основном тексте оставить «дом», а более широкое значение отметить в сноске
  alternative: Перевести как «домохозяйство» или «всё хозяйство»
  rationale: «Дом» является прямым значением слова, тогда как контекст допускает также домохозяйство или владение. Сноска сохраняет эту неоднозначность без перегрузки основного текста.
translation_notes:
  register: Современный литературный русский с достоинством заповедной речи. Синтаксис сохранён компактным; повтор «твоего ближнего» отражает еврейскую формулировку. Лексическое различие «не желай / не жажди» передаёт два исходных глагола, а тире вводит итоговый всеохватывающий запрет.
