  text: Соблюдай день субботний[a], чтобы освящать его, как повелел тебе Яхве, твой Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Храни день субботний» или «Оберегай день субботний». Еврейский глагол подчёркивает тщательное, внимательное соблюдение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Соблюдай
  rationale: Инфинитив абсолютный породы qal употреблён как повеление. «Соблюдай» естественно передаёт внимательное и деятельное исполнение заповеди и сохраняет отличие от «помни» в Исходе 20:8.
- source_word: יוֹם הַשַׁבָּת
  choice: день субботний
  rationale: Естественное для литературного русского языка обозначение конкретного дня покоя; форма сохраняет библейское достоинство без излишней архаичности.
- source_word: לְקַדְּשׁוֹ
  choice: чтобы хранить его в святости
  rationale: Инфинитив с местоименным суффиксом выражает цель. Перевод указывает на особое, священное отношение к этому дню и не создаёт впечатления, будто человек наделяет его внутренней святостью.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Кратко и естественно вводит соответствие ранее данному Божьему повелению.
- source_word: צִוְּךָ
  choice: повелел тебе
  rationale: Глагол обозначает властное приказание; прошедшее время соответствует воспоминанию о ранее данной заповеди.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Естественно передаёт заветное обозначение с местоименным суффиксом второго лица единственного числа.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Еврейский текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение освящения субботнего дня
  choice: хранить его в святости
  alternative: освящать его; делать его святым
  rationale: Фраза передаёт требование относиться к дню как к святому и отделённому для Бога, не разрешая сверх текста вопрос о том, делает ли человеческое действие день святым по существу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Единственное число «тебе» сохранено по еврейскому тексту. Порядок слов сделан естественным для русского языка без утраты смыслового акцента.
