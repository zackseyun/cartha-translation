  source_fidelity: 'Текст точно передаёт еврейскую последовательность и акценты: emphatic הוּא отражено словом «Сам» в первом предложении и отдельным «Он» во втором; הַהֹלֵךְ לְפָנֶיךָ естественно передано как «идёт перед тобой»; обещания не оставить и не покинуть разведены. «Не бойся и не падай духом» хорошо передаёт увещевательный характер לֹא תִירָא וְלֹא תֵחָת.'
