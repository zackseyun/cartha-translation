  variant: modern literary Russian
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: ru
  text: Сам Яхве идёт перед тобой. Он будет с тобой, не подведёт тебя[a] и не покинет тебя. Не бойся и не падай духом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отпустит тебя».'
    reason: Лексема רפה в хифиле может передавать образ ослабления хватки или отпускания; этот вариант сохраняет более буквальный оттенок еврейского выражения.
lexical_decisions:
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо представленное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: הוּא הַהֹלֵךְ לְפָנֶיךָ
  choice: Сам Яхве идёт перед тобой
  rationale: «Сам» сохраняет усилительное значение самостоятельного местоимения הוּא, а настоящее время естественно передаёт причастную конструкцию и продолжающееся действие.
- source_word: הוּא יִהְיֶה עִמָּךְ
  choice: Он будет с тобой
  rationale: Прямо передаёт обещание Божьего присутствия; отдельное «Он» сохраняет повторный акцент исходного текста.
- source_word: לֹא יַרְפְּךָ
  choice: не подведёт тебя
  rationale: В данной формуле רפה в породе хифиль выражает мысль о том, что Бог не ослабит поддержки и не даст человеку остаться беспомощным. «Не подведёт» естественно по-русски и не сливается по смыслу со следующим «не покинет».
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: и не покинет тебя
  rationale: עזב означает оставить или покинуть; выбранный вариант сохраняет торжественный, но современный регистр.
- source_word: לֹא תִירָא וְלֹא תֵחָת
  choice: Не бойся и не падай духом
  rationale: Обе формы в контексте имеют силу запрета или ободряющего повеления. «Не падай духом» естественно передаёт состояние внутренней сломленности и смятения, выражаемое חתת, не повторяя просто идею страха.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי и не привносит в основной текст замену, которой в еврейском написании нет.
- issue: Характер обещания в לֹא יַרְפְּךָ וְלֹא יַעַזְבֶךָּ
  choice: не подведёт тебя и не покинет тебя
  alternative: не отпустит тебя и не оставит тебя
  rationale: Основной текст передаёт ободрение естественным русским языком, сохраняя два близких, но не тождественных действия. Более буквальная возможность для первого глагола отмечена в сноске, поскольку его образ допускает значение «не отпустит».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского ободрения. Краткие фразы сохраняют ритм и прямоту еврейского текста; обращение дано в единственном числе мужского рода, как в речи Моисея к Иисусу Навину.
