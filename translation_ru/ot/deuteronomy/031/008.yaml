  terminology: «Яхве» последовательно передаёт личное имя יהוה. Формулировки «будет с тобой», «не покинет тебя» и «не бойся» сохраняют библейский регистр без архаизации. Сноска уместно отмечает допустимый более буквальный оттенок первого глагола.
