  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: ru
  text: И явился Яхве в шатре[a], в облачном столпе, и облачный столп стал у входа[b] в шатёр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Шатре». В еврейском тексте буквально сказано «в шатре»; по контексту имеется в виду шатёр встречи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «над входом». Еврейский предлог может означать «на, над», хотя здесь по смыслу возможно положение у входа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה здесь обозначает видимое явление; «явился» естественно передаёт смысл, не уточняя сверх текста способ откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму, представленную в еврейском тексте, вместо замены имени титулом.
- source_word: בָּאֹהֶל
  choice: в шатре
  rationale: אֹהֶל буквально означает «шатёр». Контекст указывает на шатёр встречи, однако сам стих употребляет только определённую форму «шатёр».
- source_word: בְּעַמּוּד עָנָן
  choice: в облачном столпе
  rationale: Предлог ב сохраняется как «в» и представляет облачный столп как среду или образ явления, без дальнейшего истолкования таинственного описания.
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Глагол עמד конкретно описывает занятие положения; «встал» передаёт последовательность повествования лучше, чем статическое «стоял».
- source_word: עַמּוּד הֶעָנָן
  choice: облачный столп
  rationale: Естественное современное русское соответствие устойчивому еврейскому словосочетанию, ясно связывающее его с ранее упомянутым столпом.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: у входа в шатёр
  rationale: В данном пространственном сочетании עַל естественно обозначает положение у входа; более буквальное «над входом» сохранено как возможный вариант в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя Бога сохраняется как имя, что соответствует исходному тексту и не заменяет его титулом.
- issue: Описание богоявления
  choice: явился в шатре, в облачном столпе
  alternative: явился у шатра в облачном столпе; был виден в шатре как облачный столп
  rationale: Формулировка сохраняет конкретное, но не разъяснённое текстом соединение явления Яхве, шатра и облачного столпа и не отождествляет Бога со столпом сильнее, чем это делает оригинал.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены простота синтаксиса, повтор образа облачного столпа и неопределённость способа богоявления; архаизмы и конфессионально окрашенные уточнения не вводятся.
