base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: ru
  text: Ведь я знаю вашу непокорность и ваше упрямство[a]. Вот, пока я ещё жив среди вас, вы уже противитесь Яхве[b]; тем более после моей смерти!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вашу жёсткую шею» — древнееврейский образ упрямства и несговорчивости.'
    reason: lexical_alternative
  - marker: b
    text: Буквально предлог можно передать как «с Яхве», но в данном контексте речь идёт о противлении Ему.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: вашу непокорность
  rationale: Существительное מֶרִי обозначает непокорность, мятежность или открытое сопротивление. «Непокорность» сохраняет именную форму и естественно звучит в современном русском контексте.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: ваше упрямство
  rationale: Буквально «вашу жёсткую шею» — древнееврейская метафора упрямства. В основном тексте передан смысл идиомы, а исходный образ сохранён в сноске.
- source_word: הֵן
  choice: вот
  rationale: Частица привлекает внимание и подчёркивает последующее утверждение; «вот» сохраняет эту функцию без архаической тяжеловесности.
- source_word: בְּעוֹדֶנִּי חַי עִמָּכֶם הַיּוֹם
  choice: даже теперь, пока я ещё жив и нахожусь среди вас
  rationale: Передаёт временное и эмфатическое значение выражения. הַיּוֹם здесь отражено словом «теперь», указывающим на нынешнее положение в противопоставлении времени после смерти Моисея.
- source_word: מַמְרִים הֱיִתֶם
  choice: вы восстаёте
  rationale: Причастие с היה описывает продолжающееся, характерное поведение. Настоящее время по-русски естественно выражает эту длительность в сочетании с «даже теперь».
- source_word: עִם יְהוָה
  choice: против Яхве
  rationale: Хотя עִם обычно значит «с», при глаголе неповиновения сочетание выражает противодействие. Русское «против» ясно передаёт контекстуальный смысл; буквальная форма отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: וְאַף כִּי
  choice: что же будет
  rationale: 'Риторическое выражение вводит усиленный вывод: если народ восстаёт при жизни Моисея, тем более это ожидается после его смерти. Русская эллиптическая формула естественно сохраняет экспрессию и подразумеваемое усиление.'
- source_word: אַחֲרֵי מוֹתִי
  choice: после моей смерти
  rationale: Прямо и в сходной именной конструкции передаёт временное выражение исходного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя יהוה. Транслитерация «Яхве» сохраняет его как личное имя и не подменяет титулом.
- issue: Характер непокорности Израиля по отношению к Яхве
  choice: против Яхве
  alternative: с Яхве
  rationale: Предлог עִם буквально допускает «с», однако при ממרים контекст выражает сопротивление Яхве. Сноска сохраняет формальную особенность оригинала, не затемняя смысл основного текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией речи Моисея. Буквально чуждая русскому языку метафора вынесена в сноску; риторическое усиление в конце сохранено естественной восклицательной конструкцией.
