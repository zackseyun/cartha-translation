  source_fidelity: 'Основной смысл передан верно: מֶרִי — «непокорность», образ «жёсткой шеи» адекватно истолкован как упрямство, а עִם יהוה в данном контексте естественно передано значением противления Яхве. Однако заключительное «что же будет после моей смерти!» не выражает прямо сравнительно-усилительную силу וְאַף כִּי («тем более»).'
  naturalness: Текст в целом современный и литературный. «Восстаёте против Яхве» возможно, но «противитесь Яхве» точнее передаёт длительное противление без излишнего оттенка открытого мятежа. Концовка с «тем более» звучит естественно и сохраняет риторическую эллиптичность оригинала.
  terminology: «Яхве» последовательно передаёт יהוה. «Непокорность» и «упрямство» уместны; сноска сохраняет исходный образ. Примечание к предлогу עִם корректно поясняет, почему в основном тексте выбрано значение «против».
