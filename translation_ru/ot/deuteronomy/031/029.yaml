  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: ru
  text: 'Ибо я знаю: после моей смерти вы непременно испортитесь[a] и уклонитесь от пути, по которому я заповедал вам идти; и в последние дни[c] вас постигнет бедствие[b], потому что вы будете делать зло в глазах Яхве, вызывая его гнев делами своих рук.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы непременно развратитесь»; еврейская конструкция усиливает глагол со значением порчи и здесь может пониматься возвратно или непереходно.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское רָעָה может означать также «зло», «беду» или «несчастье».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в грядущие дни». Выражение обращено к будущему и в зависимости от контекста может иметь эсхатологический оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: Ибо я знаю
  rationale: כִּי вводит обоснование предшествующего наставления, а перфект יָדַעְתִּי здесь выражает твёрдую уверенность Моисея; настоящее время естественно передаёт этот смысл по-русски.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: вы непременно развратитесь
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает утверждение. Русское «непременно» передаёт усиление, а «развратитесь» — нравственную порчу без добавления отсутствующего в еврейском тексте прямого объекта.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: и уклонитесь от пути
  rationale: Сохранён устойчивый заветный образ ухода с предписанного Богом пути.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: по которому я заповедал вам идти
  rationale: Добавленное по смыслу «идти» делает русскую фразу естественной и раскрывает образ пути, не меняя содержания повеления.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: вас постигнет бедствие
  rationale: В сочетании с קרא существительное רָעָה обозначает несчастье или бедствие, постигающее людей; такой перевод естественнее русского «вас постигнет зло».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  rationale: Сохранён традиционный будущий оборот, который может означать как грядущие времена вообще, так и иметь эсхатологический оттенок в зависимости от контекста.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: потому что вы будете делать зло
  rationale: Прямо передана нравственная оценка поступков и причинная связь с грядущим бедствием.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена еврейская идиома оценки с точки зрения Яхве; по-русски она понятна и стилистически уместна.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: לְהַכְעִיסוֹ
  choice: вызывая его гнев
  rationale: 'Передан каузативный смысл формы: поступки народа вызывают гнев Яхве.'
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: делами своих рук
  rationale: Сохранён конкретный образ еврейского текста без уточнения, что именно представляют собой эти дела.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; «Яхве» передаёт наиболее вероятное произношение и не подменяет имя титулом.
- issue: Значение בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  alternative: в грядущие дни
  rationale: Основной текст сохраняет возможный эсхатологический вес выражения, а примечание удерживает более широкое временное понимание, не навязывая узкой схемы конца времён.
- issue: Характер порчи в הַשְׁחֵת תַּשְׁחִתוּן
  choice: вы непременно развратитесь
  alternative: вы непременно станете поступать нечестиво; вы окончательно испортитесь
  rationale: Выбранная формулировка передаёт нравственное разложение и усиление, но не утверждает, что народ портит какой-либо названный объект.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис слегка разгружен двоеточием и точкой с запятой, при этом причинные и последовательные связи исходного текста сохранены. Местоимение «его» написано со строчной буквы, поскольку почтительная прописная не выражена в еврейском тексте и не требуется для ясности.
