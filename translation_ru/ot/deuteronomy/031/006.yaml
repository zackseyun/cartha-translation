base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: ru
  text: Будьте сильны и мужественны. Не бойтесь и не трепещите перед ними[a], ибо Яхве, твой Бог, Сам идёт с тобой; Он не отпустит тебя и не покинет тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Второй глагол сильнее первого: он может означать «ужасаться» или «быть сокрушёнными страхом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Будьте тверды и мужественны
  rationale: Сочетание двух повелительных форм призывает к внутренней стойкости и мужеству. Такая передача сохраняет парность и звучит естественно по-русски.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: Не бойтесь и не трепещите
  rationale: Второй глагол усиливает первый и выражает сильный страх или ужас; «трепещите» сохраняет нарастание, не добавляя отсутствующего в тексте образа.
- source_word: מִפְּנֵיהֶם
  choice: перед ними
  rationale: Буквально выражение связано с нахождением «перед лицом» противников; по-русски «трепетать перед ними» естественно передаёт страх при их присутствии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: Он Сам идёт с тобой
  rationale: Местоимение הוּא перед причастной конструкцией придаёт высказыванию эмфатический оттенок; «Сам» естественно передаёт это выделение.
- source_word: לֹא יַרְפְּךָ
  choice: не оставит тебя без поддержки
  rationale: Форма от רפה здесь несёт смысл не ослабить хватку, не отпустить и не лишить поддержки. Выбранная формулировка ясна современному читателю и отличается от следующего «не покинет».
- source_word: וְלֹא יַעַזְבֶךָ
  choice: и не покинет тебя
  rationale: עזב означает оставить или покинуть. «Не покинет» сохраняет торжественный характер заверения без излишне архаичного оттенка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Различение יַרְפְּךָ и יַעַזְבֶךָ
  choice: не оставит тебя без поддержки и не покинет тебя
  alternative: не отпустит тебя и не оставит тебя
  rationale: 'Два заверения сохранены как смыслово близкие, но не тождественные: первое говорит о неослабной поддержке, второе — о том, что Бог не покинет.'
- issue: Переход от множественного числа к единственному
  choice: 'Сохранить: «будьте… не бойтесь», затем «твой… с тобой… тебя»'
  alternative: Согласовать весь стих во множественном числе
  rationale: Еврейский текст действительно переходит от обращения ко множеству к обращению к Израилю как к единому народу. Сохранение перехода не устраняет грамматическое и богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с dignified библейским ритмом. Сохранён заметный в еврейском тексте переход от множественного обращения к единственному, представляющему Израиль как единое целое. Местоимение «Сам» передаёт эмфазу конструкции הוּא הַהֹלֵךְ.
