lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: написал
  rationale: Повествовательная форма глагола כתב прямо означает «написал»; простой русский эквивалент сохраняет последовательность рассказа.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: эту песнь
  rationale: שִׁירָה обозначает песню, в данном контексте — возвышенное поэтическое произведение. «Песнь» естественно и достойно передаёт его литературный и заветный характер.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Обычное временное выражение передано естественной русской формулой без усиления до «в тот самый день».
- source_word: וַיְלַמְּדָהּ
  choice: научил этой песне
  rationale: 'Порода пиэль глагола למד означает «учить, обучать», а суффикс женского рода указывает на песнь. Повтор существительного вместо местоимения обеспечивает естественное русское управление: «научить кого-либо чему-либо».'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняется буквальная форма стандартного заветного наименования народа Израиля; родительный множественного числа обусловлен русским управлением глагола «научил».
theological_decisions:
- issue: Гендерно маркированное собирательное выражение בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народ Израиля; детей Израиля
  rationale: Еврейский текст употребляет мужское множественное בְּנֵי в составе традиционного обозначения всего народа. Буквальная форма сохраняет образ и заветную терминологию, а сноска поясняет её собирательное значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Песнь» предпочтена слову «песня» как естественное обозначение торжественного поэтического текста; синтаксис остаётся ясным для современного читателя.
