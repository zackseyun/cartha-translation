  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: ru
  text: 'И Он повелел Иисусу, сыну Нуна, и сказал: «Будь твёрд и мужествен, потому что ты введёшь сынов Израиля[a] в землю, которую Я обещал им, поклявшись, и Я буду с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян»; или: «народ Израиля». Буквально: «сынов Израиля».'
    reason: 'Лексическая альтернатива: сноска поясняет буквальную семейную форму и её естественные собирательные соответствия.'
lexical_decisions:
- source_word: וַיְצַו
  choice: Он повелел
  rationale: Пиэль глагола צוה означает «повелеть, поручить». «Повелел» прямо передаёт властный и торжественный характер поручения; местоимение сохраняет невыраженный в самом стихе субъект, определяемый из контекста.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисусу, сыну Навина
  rationale: Использована укоренившаяся в русской библейской традиции форма имени Иисус Навин; конструкция «сыну Навина» явно передаёт еврейский патроним.
- source_word: וַיֹּאמֶר
  choice: сказав
  rationale: Деепричастная конструкция естественно передаёт последовательность «и повелел… и сказал», не создавая в русском тяжеловесного повтора.
- source_word: חֲזַק וֶאֱמָץ
  choice: Будь твёрд и мужествен
  rationale: «Твёрд» выражает стойкость, а «мужествен» — решимость и отвагу; вместе слова сохраняют силу устойчивого двойного призыва.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для призыва и в современном русском ясно передаёт причинную связь.
- source_word: תָּבִיא
  choice: ты введёшь
  rationale: Каузативная форма глагола בוא буквально означает «ввести, привести внутрь». «Введёшь» сохраняет и причинность, и направленность движения в землю.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквальный семейно-родовой образ еврейского выражения сохранён в основном тексте; более привычные собирательные варианты указаны в сноске.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте заветного обетования הארץ обозначает обещанную землю; «земля» сохраняет ключевую библейскую тему.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: которую Я поклялся дать им
  rationale: В еврейском буквально стоит «которую Я поклялся им», при этом объект подразумеваемой клятвы восполняется из устойчивого контекста обещания земли. В русском добавление «дать» необходимо для ясной и естественной связи относительного местоимения «которую» с глаголом.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: и Я буду с тобой
  rationale: Формула сохраняет узнаваемое обещание Божьего присутствия. Прописная буква указывает на Бога как говорящего, не вставляя Его имя в текст стиха.
theological_decisions:
- issue: Неявный субъект וַיְצַו / וַיֹּאמֶר
  choice: Он повелел… сказав
  alternative: Господь повелел… и сказал
  rationale: В самом стихе субъект выражен только формой глагола третьего лица и устанавливается из ближайшего контекста. Местоимение не добавляет отсутствующее в еврейском тексте имя, а прописная буква соответствует божественному говорящему.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  alternative: израильтян; народ Израиля
  rationale: Основной текст сохраняет грамматически мужскую и семейно-заветную образность исходного выражения, не исключая его обычного собирательного значения, отмеченного в сноске.
- issue: Восполнение подразумеваемого действия в формуле клятвы
  choice: которую Я поклялся дать им
  alternative: о которой Я поклялся им
  rationale: Слово «дать» не выражено отдельно в масоретском тексте, но подразумевается конструкцией и обещанием земли. Его восполнение устраняет неестественность и смысловую неясность по-русски, не меняя содержания клятвы.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Синтаксис сделан плавным и доступным, при этом сохранены повтор местоимения «Я», формула Божьего присутствия и семейная образность выражения «сыны Израиля».
