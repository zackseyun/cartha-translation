  naturalness: 'Текст в целом литературный и ясный. Для современного русского «Иисусу, сыну Нуна» точнее передаёт בן־נון, чем «сыну Навина»: «Навин» закреплён прежде всего в традиционном составном именовании «Иисус Навин», но не является формой имени נוּן в данном патрониме. Формула «обещал им, поклявшись» естественно выражает еврейское «поклялся им» без искусственного эллипсиса.'
