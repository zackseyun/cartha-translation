base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: ru
  text: Созовите ко мне всех старейшин ваших племён и ваших должностных лиц, чтобы я произнёс перед ними эти слова и призвал небо и землю[a] в свидетели против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небеса и землю». В еврейском тексте это устойчивая формула свидетелей завета во Второзаконии.'
    reason: Лексическая альтернатива и пояснение заветной формулы.
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: Созовите
  rationale: Порода хифиль и форма повелительного наклонения во множественном числе выражают побуждение собрать людей. «Созовите» естественно передаёт целенаправленный сбор руководителей.
- source_word: אֵלַי
  choice: ко мне
  rationale: Прямо передаёт предлог с суффиксом первого лица, не заменяя его контекстуальным «передо мной».
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: старейшин ваших племён
  rationale: Сохраняет конструкцию принадлежности и ясно обозначает старейшин, представляющих племена.
- source_word: שֹׁטְרֵיכֶם
  choice: ваших распорядителей
  rationale: В административном контексте Второзакония слово обозначает должностных лиц, исполняющих распоряжения. «Распорядители» сохраняет широкое значение и не сужает его до писцов.
- source_word: וַאֲדַבְּרָה
  choice: чтобы я произнёс
  rationale: Когортатив выражает намерение Моисея после созыва руководителей; придаточное цели естественно передаёт эту связь.
- source_word: בְּאָזְנֵיהֶם
  choice: перед ними
  rationale: Буквально «в их уши» — еврейская идиома публичного, слышимого произнесения. Русское «произнёс перед ними» передаёт смысл без неестественного буквализма.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В данном контексте דְּבָרִים относится к словам, которые будут произнесены, а не просто к делам или обстоятельствам.
- source_word: וְאָעִידָה בָּם
  choice: и призвал ... в свидетели против них
  rationale: Хифиль от עוּד в заветно-правовом контексте выражает торжественное привлечение свидетелей; «против них» передаёт обвинительную направленность сочетания с בָּם.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небо и землю
  rationale: Естественная русская форма устойчивой космической формулы свидетелей; примечание сохраняет возможность более буквального множественного числа «небеса».
theological_decisions:
- issue: Заветная формула свидетелей
  choice: призвал небо и землю в свидетели против них
  alternative: засвидетельствовал против них небом и землёй
  rationale: 'Выбранная формулировка сохраняет судебно-заветный образ: небо и земля выступают свидетелями ответственности Израиля. Она не превращает их лишь в средство свидетельства и не устраняет обвинительную силу выражения.'
- issue: Референт местоимения בָּם
  choice: против них
  alternative: против вас
  rationale: Сохранён переход исходного текста от обращения во втором лице к упоминанию собранных людей в третьем лице; перевод не устраняет эту грамматическую и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. «Созовите» и «в свидетели» поддерживают официальный характер речи; архаические обороты вроде «во уши их» не используются. Маркер примечания поставлен после выражения, к которому оно относится.
