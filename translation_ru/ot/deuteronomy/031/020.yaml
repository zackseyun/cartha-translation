  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: ru
  text: Ибо, когда Я введу его в землю, которую Я под клятвой обещал его отцам, — в землю, где течёт молоко и мёд, — и он будет есть, насытится и разжиреет, тогда он обратится к другим богам, а они станут служить им и презрят Меня[b]; и он нарушит Мой завет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст говорит об Израиле то в единственном, то во множественном числе: «его… он», затем «они… презрят», а после этого снова «он нарушит». Так народ представлен и как единое целое, и как множество людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с презрением отвергнут Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо, когда
  rationale: כִּי связывает стих с предшествующим предупреждением как основание и одновременно вводит будущую временную ситуацию; сочетание «Ибо, когда» сохраняет обе функции.
- source_word: אֲבִיאֶנּוּ
  choice: Я введу его
  rationale: Глагол в породе hифиль означает «ввести/привести», а суффикс 3-го лица мужского рода единственного числа представляет Израиль как единый народ.
- source_word: הָאֲדָמָה
  choice: землю
  rationale: В данном обетованном и географическом контексте речь идёт о земле, а не о почве как веществе.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: о которой Я поклялся его отцам
  rationale: По-русски клянутся «о» даровании земли; «его отцам» сохраняет суффикс единственного числа и заветную формулу оригинала.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: землю, где течёт молоко и мёд
  rationale: Естественная современная русская передача устойчивого образа изобилия без устранения его конкретности.
- source_word: וְאָכַל וְשָׂבַע
  choice: будет есть досыта
  rationale: Передаёт последовательность будущих действий и состояние насыщения без тяжеловесного буквального удвоения «будет есть и насытится».
- source_word: וְדָשֵׁן
  choice: разжиреет
  rationale: Сохраняет конкретный и намеренно резкий образ сытости, ведущей к самодовольству; обобщённое «станет богатым» было бы более толковательным.
- source_word: וּפָנָה אֶל
  choice: обратится к
  rationale: Передаёт перемену направленности и верности, не добавляя отсутствующего в тексте отвлечённого термина «отступничество».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прилагательное означает именно «другие»; вариант «чужие боги» добавлял бы оттенок иностранного происхождения.
- source_word: וַעֲבָדוּם
  choice: они станут служить им
  rationale: Масоретская форма имеет подлежащее во множественном числе и объект «им». «Служить» сохраняет язык верности и поклонения, присущий עבד.
- source_word: וְנִאֲצוּנִי
  choice: презрят Меня
  rationale: נאץ обозначает презрительное отвержение. «Презрят» естественно и точно передаёт как отношение, так и оскорбление заветной верности.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: и он нарушит Мой завет
  rationale: הפר здесь означает сделать завет недействующим через неверность, то есть нарушить его; форма вновь имеет единственное число.
theological_decisions:
- issue: Чередование коллективного единственного и множественного числа применительно к Израилю
  choice: 'Сохранить последовательность оригинала: «его… он… они… презрят… он нарушит».'
  alternative: Согласовать все местоимения и глаголы либо во множественном, либо в единственном числе.
  rationale: 'Еврейский текст представляет Израиль то как один народ, то как составляющих его людей: единственное число до וַעֲבָדוּם, множественное в וַעֲבָדוּם и וְנִאֲצוּנִי, затем снова единственное в וְהֵפֵר. Сглаживание устранило бы подлинную особенность текста.'
- issue: Описание неверности завету
  choice: 'Передать конкретные действия: обратиться к другим богам, служить им, презреть Бога и нарушить завет.'
  alternative: Заменить описание богословскими терминами «впасть в идолопоклонство» или «совершить отступничество».
  rationale: Такие термины верно описывают смысл происходящего, но добавляют толковательную категоризацию вместо образного и заветного языка самого стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «Ибо, когда… тогда» делает причинно-временную связь ясной; конкретные образы «есть досыта» и «разжиреет» сохранены. Необычная смена числа намеренно не сглажена и пояснена в примечании.
