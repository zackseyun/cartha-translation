base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: ru
  text: 'И сказал им: «Мне сегодня сто двадцать лет. Я уже не могу выходить и входить[a], и Яхве сказал мне: „Ты не перейдёшь через этот Иордан“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «выходить и входить» может относиться как к обычной деятельности, так и к руководству народом.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: И сказал он им
  rationale: Передаёт стандартную повествовательную конструкцию с wayyiqtol и косвенным дополнением, сохраняя связность еврейского повествования.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Мне сегодня сто двадцать лет
  rationale: Еврейская формула возраста буквально говорит «я сын ста двадцати лет»; выбран естественный современный русский эквивалент с сохранением временного акцента הַיּוֹם — «сегодня».
- source_word: לֹא אוּכַל עוֹד
  choice: Я уже не могу
  rationale: 'יכל выражает способность, а עוֹד в отрицательной конструкции — прекращение прежней возможности: «уже не могу», «больше не могу».'
- source_word: לָצֵאת וְלָבוֹא
  choice: выходить и входить
  rationale: Буквальная передача сохраняет многозначность идиомы, которая может обозначать как обычную деятельность, так и руководство народом; примечание разъясняет варианты без сужения смысла основного текста.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом; форма «Яхве» общепринята в современной русскоязычной библеистике.
- source_word: אָמַר אֵלַי
  choice: сказал мне
  rationale: Простое прошедшее время естественно передаёт еврейский qatal и указывает на ранее произнесённое Божье слово, сохраняющее силу в настоящем.
- source_word: לֹא תַעֲבֹר
  choice: Ты не перейдёшь
  rationale: Форма сохраняет напряжение между категорическим Божьим постановлением и предсказанием результата, не уточняя сверх текста, является ли высказывание запретом или декларацией.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: через этот Иордан
  rationale: Сохранено указательное הַזֶּה — «этот»; предлог «через» естественно сочетается по-русски с глаголом «перейти» и названием реки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон. Транслитерация сохраняет личное заветное имя и отличает его от титула «Господь».
- issue: Смысл выражения לָצֵאת וְלָבוֹא
  choice: Сохранить идиому «выходить и входить» с примечанием
  alternative: Передать толкованием «руководить народом» или «заниматься обычными делами»
  rationale: Контекст допускает как общую неспособность к прежней деятельности, так и неспособность продолжать общественное или военное руководство. Основной текст не должен устранять эту смысловую напряжённость.
- issue: Модальность слов לֹא תַעֲבֹר
  choice: Ты не перейдёшь
  alternative: Тебе нельзя переходить
  rationale: Будущая форма по-русски может передавать твёрдое Божье постановление, не сводя его исключительно к запрету или исключительно к предсказанию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; исходная идиома сохранена ради смысловой многозначности и пояснена в примечании.
