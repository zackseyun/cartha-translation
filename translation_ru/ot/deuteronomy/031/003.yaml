  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: ru
  text: Яхве, твой Бог, сам перейдёт впереди тебя[a]. Он уничтожит эти народы перед тобой, и ты лишишь их владений[b]. Иисус Навин сам перейдёт впереди тебя, как сказал Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идёт впереди тебя»; «пойдёт впереди тебя». Еврейское причастие может обозначать происходящее, близкое или несомненное будущее действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты вытеснишь их». Еврейский глагол может означать вступление во владение путём лишения прежних жителей их владений; в данном контексте подразумевается также овладение их землёй.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: ваш Бог
  rationale: Форма с суффиксом 2-го лица мужского рода единственного числа; по-русски обращение к Моисею передано множественным числом по смыслу контекста, где речь обращена ко всему Израилю.
- source_word: הוּא
  choice: сам
  rationale: Самостоятельное местоимение имеет эмфатическую функцию; повтор подчёркивания сохранён и при Яхве, и при Иисусе Навине.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: перейдёт впереди вас
  rationale: Сохраняет образ предстоящего перехода и движения впереди Израиля; причастие в данном контексте естественно передаётся по-русски формой будущего времени.
- source_word: יַשְׁמִיד
  choice: уничтожит
  rationale: Каузативная форма от שׁמד обозначает причинение гибели или уничтожение; выбран сильный, но не усиленный сверх исходного значения русский глагол.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: эти народы
  rationale: В контексте Второзакония גּוֹיִם обозначает народы Ханаана как этнополитические общности.
- source_word: מִלְּפָנֶיךָ
  choice: перед вами
  rationale: Передаёт пространственный образ устранения народов с пути Израиля без неестественного русского оборота «из-перед вас».
- source_word: וִירִשְׁתָּם
  choice: и вы овладеете их землёй
  rationale: В контексте завоевания ירשׁ означает вступить во владение, вытеснив прежних жителей. Упоминание земли делает фразу естественной по-русски, а альтернативный оттенок отмечен в сноске.
- source_word: יְהוֹשֻׁעַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская форма имени, ясно отличающая этого носителя имени от Иисуса Христа.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: как сказал Яхве
  rationale: Прямо передаёт значение דִּבֶּר, не добавляя более узкого толкования «обещал».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Соотношение действий Яхве и Иисуса Навина
  choice: Сохранить «сам» при обоих подлежащих
  alternative: Передать простыми местоимениями без эмфазы
  rationale: Еврейский текст подчёркивает как личное действие Яхве, так и выступление Иисуса Навина впереди народа по Божьему слову; перевод не противопоставляет и не сливает эти две линии действия.
- issue: Значение ירשׁ в рассказе о завоевании
  choice: овладеть их землёй
  alternative: лишить их владений; вытеснить их
  rationale: Основной текст естественно выражает вступление Израиля во владение землёй, а сноска сохраняет присущий глаголу в данном контексте оттенок лишения прежних жителей владения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет повтор и риторическое подчёркивание исходного текста, избегая архаизмов и конфессионально маркированных замен личного имени Бога.
