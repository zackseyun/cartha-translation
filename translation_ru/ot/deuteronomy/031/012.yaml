  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: ru
  text: 'Собери народ: мужчин, женщин, маленьких детей и переселенца[a], живущего в твоих городах[b], — чтобы они слушали, учились, боялись[c] Яхве, вашего Бога, и тщательно исполняли все слова этого закона[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянно живущего у вас чужеземца». Еврейское слово обозначает пришлого человека, поселившегося среди Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «который в твоих воротах». «Ворота» здесь обозначают города или местные общины.'
    reason: cultural_note
  - marker: c
    text: 'Или: «глубоко почитали». Еврейский глагол включает благоговейный страх и готовность повиноваться.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «этого наставления». Еврейское слово תורה (тора) может означать как закон, так и наставление; в данном заветно-правовом контексте уместно «закон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: Собери
  rationale: Побудительная форма от קהל означает созвать людей и образовать из них собрание. «Собери» естественно звучит по-русски и сохраняет силу прямого повеления.
- source_word: הָעָם
  choice: весь народ
  rationale: עָם обозначает здесь всю общину Израиля. Слово «весь» явно передаёт охват, раскрываемый последующим перечислением, хотя в еврейском тексте идея полноты выражена контекстом.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: мужчин, женщин, маленьких детей
  rationale: Перевод сохраняет прямое перечисление групп. טַף обычно указывает на малых детей или малолетних иждивенцев, поэтому выбрано «маленьких детей».
- source_word: וְגֵרְךָ
  choice: и переселенца
  rationale: גֵּר — не просто случайный чужеземец, а пришлый человек, постоянно живущий среди Израиля. «Переселенец» передаёт этот общественно-правовой оттенок без архаичного «пришелец».
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: живущего в твоих городах
  rationale: Буквально сказано «который в твоих воротах». В Второзаконии «ворота» метонимически обозначают города и местные общины; смысл идиомы вынесен в основной текст, а буквальный образ отмечен в сноске.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: чтобы они слушали, учились
  rationale: Сохранены два самостоятельных глагола и их последовательность. «Слушали» подходит контексту публичного чтения и сохраняет важный для Второзакония мотив внимательного слушания.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: боялись Яхве, вашего Бога
  rationale: ירא в контексте завета соединяет страх, почтение и послушание. Основной текст сохраняет прямое «боялись», а его смысловой объём поясняется в сноске. Личное имя יהוה передано как «Яхве».
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: и тщательно исполняли
  rationale: Сочетание שמר с инфинитивом означает внимательно соблюдать и осуществлять на деле. «Тщательно исполняли» естественно передаёт как усердие, так и практическое послушание.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: все слова этого закона
  rationale: דִּבְרֵי буквально означает «слова», что сохранено. תּוֹרָה может означать «наставление», но в данном контексте публично читаемого документа завета уместно «закон».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие.
- issue: Смысл ירא по отношению к Богу
  choice: бояться
  alternative: почитать
  rationale: «Бояться» непосредственно передаёт еврейский глагол и сохраняет богословское напряжение между страхом, благоговением и послушанием; сноска поясняет, что речь не сводится к испугу.
- issue: Перечень участников собрания
  choice: мужчин, женщин, маленьких детей и переселенца
  alternative: всех жителей
  rationale: Еврейский текст намеренно перечисляет группы, включая малых детей и постоянно живущего среди Израиля чужеземца. Обобщение скрыло бы заявленную всеохватность собрания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Синтаксис сохраняет последовательность еврейских целевых и результативных действий без искусственной архаизации; культурная идиома о «воротах» раскрыта в тексте и отмечена сноской.
