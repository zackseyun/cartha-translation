lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное значение הלך — «идти». Хотя место назначения не указано и глагол иногда понимают как «продолжил», прямое значение не требует такого истолкования.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: וַיְדַבֵּר
  choice: произнёс
  rationale: דבר в пиэле означает «говорить». В сочетании с прямым дополнением «эти слова» глагол «произнёс» звучит естественно и сохраняет указание на речь, не превращая конструкцию в прямую цитату.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: Буквальное и естественное соответствие, указывающее на последующую речь.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: всему Израилю
  rationale: Предлог אֶל обозначает адресата, а כָּל יִשְׂרָאֵל сохраняет собирательное обозначение народа; русский дательный падеж естественно передаёт эту связь.
- source_word: וַ
  choice: И
  rationale: Начальный союз сохраняет формальную повествовательную связь с предыдущим контекстом и не навязывает более узкое временное значение «затем».
