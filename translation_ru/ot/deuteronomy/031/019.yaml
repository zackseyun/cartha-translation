  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: ru
  text: А теперь напишите себе эту песнь и научите сынов Израиля этой песне; вложите её в их уста, чтобы эта песнь была для Меня свидетелем против сынов Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы эта песнь была для Меня свидетелем среди сынов Израиля». Древнееврейский предлог допускает значение «среди», хотя контекст указывает на свидетельство против Израиля.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт как соединительный וְ, так и переходно-временное עַתָּה; выражение естественно для современного русского языка.
- source_word: כִּתְבוּ לָכֶם
  choice: напишите себе
  rationale: Сохраняет множественное повелительное наклонение и дательный оттенок לָכֶם, не добавляя отсутствующего в тексте уточнения «запишите».
- source_word: הַשִּׁירָה הַזֹּאת
  choice: эту песнь
  rationale: שִׁירָה прямо обозначает песню; «песнь» уместна для поэтического произведения в возвышенном, но понятном библейском регистре.
- source_word: וְלַמְּדָהּ אֶת־בְּנֵי יִשְׂרָאֵל
  choice: и научите ей сынов Израиля
  rationale: Женский объектный суффикс отсылает к «песни»; русское управление «научить чему» естественно передаёт содержание обучения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет буквальную форму древнееврейского выражения и его родовую идентификационную функцию; речь при этом идёт об израильтянах как народе.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: вложите её в их уста
  rationale: Сохраняет конкретный образ исходного текста — песнь должна быть у них в устах, то есть усвоена и произносима, — без поясняющей подмены идиомы.
- source_word: לְמַעַן תִּהְיֶה לִּי
  choice: чтобы ... стала Моим
  rationale: לְמַעַן выражает цель, а תִּהְיֶה допускает естественную передачу «стала»; притяжательная конструкция по-русски ясно передаёт לִי.
- source_word: לְעֵד
  choice: свидетелем
  rationale: עֵד означает «свидетель» и в данном контексте сохраняет судебно-заветный образ.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: против сынов Израиля
  rationale: В контексте свидетельства и будущего нарушения завета предлог בְּ вероятнее всего имеет направленный против кого-либо смысл; пространственная трактовка отмечена в сноске.
theological_decisions:
- issue: Объём выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: 'Основной текст сохраняет форму исходного выражения, не ограничивая его смысл только мужчинами: в контексте это наименование народа Израиля.'
- issue: Смысл предлога בְּ в сочетании לְעֵד בִּבְנֵי יִשְׂרָאֵל
  choice: свидетелем против сынов Израиля
  alternative: свидетелем среди сынов Израиля
  rationale: Ближайший контекст описывает песнь как свидетельство, обличающее Израиль при отступлении, что поддерживает противительный смысл. Поскольку форма предлога допускает более пространственное прочтение, оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Песнь» и «уста» сохраняют поэтический образ без архаизации синтаксиса. Местоимение «Моим» написано с прописной буквы как традиционное обозначение Бога в русской библейской печати.
