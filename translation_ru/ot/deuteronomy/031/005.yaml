  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: ru
  text: И предаст их Господь вам, и вы поступите с ними согласно всему повелению, которое я заповедал вам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: И предаст их Господь вам
  rationale: Глагол נתן в сочетании с לִפְנֵיכֶם здесь означает передачу народов во власть Израиля. «Предаст… вам» естественно передаёт смысл, не добавляя отсутствующего в тексте указания на конкретный способ победы.
- source_word: כְּכָל הַמִּצְוָה
  choice: по всей заповеди
  rationale: 'Сохранено собирательное единственное число исходного текста: речь идёт обо всём предписании как о целом.'
- source_word: צִוִּיתִי אֶתְכֶם
  choice: которую я дал вам
  rationale: В современном русском «дать заповедь» звучит естественнее буквального «заповедал вам», при этом сохраняется смысл властного предписания Моисея.
theological_decisions:
- issue: Обозначение Божьего имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача тетраграмматона как «Господь» уместна в основном тексте и согласуется с аудированным консультационным слоем; она не вносит конфессионально специфического толкования.
- issue: Содержание повеления о покорённых народах
  choice: не раскрывать его внутри стиха
  alternative: уточнить действия по предписанию из предыдущего контекста
  rationale: Стих отсылает к ранее данному повелению, но сам его не повторяет; перевод сохраняет эту контекстуальную отсылку и не добавляет пояснений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис близок к еврейскому, но естественен; архаизмы и лишние уточнения устранены.
