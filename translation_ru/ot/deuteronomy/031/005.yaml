    issue: Ослаблено значение צִוִּיתִי
    rationale: '«Которую я дал вам» может означать просто передачу заповеди, тогда как еврейский текст прямо говорит: «которое я повелел/заповедал вам».'
  - severity: medium
    issue: Неестественная конструкция «по всей заповеди»
    rationale: Она калькирует форму единственного числа, но в современном литературном русском звучит неясно. «Согласно всему повелению» сохраняет собирательное единственное число и смысл полноты.
  revised_text: И предаст их Господь вам, и вы поступите с ними согласно всему повелению, которое я заповедал вам.
