  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: ru
  text: «Возьмите эту книгу Закона[a] и положите её рядом с ковчегом завета Яхве, вашего Бога. Пусть она остаётся там свидетельством против вас[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот свиток Закона». Еврейское סֵפֶר может означать свиток или иной письменный документ.'
    reason: lexical_alternative
  - marker: b
    text: То есть свидетельством против вас, если вы нарушите завет.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: Возьмите
  rationale: Инфинитив qal употреблён как повеление. Множественное число соответствует последующему וְשַׂמְתֶּם и обращению к левитам в контексте.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: эту книгу Закона
  rationale: סֵפֶר обозначает письменный документ, в древней обстановке обычно свиток; תּוֹרָה здесь относится к записанному заветному наставлению. Традиционное и ясное «книга Закона» сохранено, а материальная альтернатива указана в примечании.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: и положите её
  rationale: Конкретное действие естественно передаётся глаголом «положить»; женский род местоимения обусловлен русским словом «книга».
- source_word: מִצַּד
  choice: рядом с
  rationale: Фраза указывает на положение сбоку от ковчега, а не внутри него.
- source_word: אֲרוֹן בְּרִית
  choice: ковчегом завета
  rationale: Так естественно и традиционно передаётся еврейская сопряжённая конструкция.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Прямая передача формы с местоименным суффиксом второго лица множественного числа.
- source_word: וְהָיָה שָׁם
  choice: Пусть она остаётся там
  rationale: Формально «и будет там» описывает предполагаемое продолжительное нахождение книги после того, как её положат; выбранная формулировка естественна по-русски.
- source_word: בְּךָ לְעֵד
  choice: свидетельством против вас
  rationale: В контексте завета сочетание выражает юридически значимое свидетельство против народа. Единственное число еврейского суффикса представляет Израиль как единое целое, тогда как русское «вас» согласуется с адресатами повеления и охватывает народ.
theological_decisions:
- issue: Роль книги как свидетельства
  choice: Книга служит свидетельством против Израиля при нарушении завета.
  alternative: Книга служит лишь нейтральным свидетельством или памятным знаком.
  rationale: Фраза לְעֵד בְּךָ и ближайший контекст Второзакония имеют судебно-заветный оттенок. Примечание поясняет подразумеваемое условие, не добавляя отдельного богословского положения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Имя Яхве передано явно. Порядок маркеров приведён к последовательному [a], [b], и каждый маркер присутствует в основном тексте.
