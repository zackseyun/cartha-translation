lexical_decisions:
- source_word: וְאָנֹכִי
  choice: А Я
  rationale: Усиленное местоимение אָנֹכִי передано явно выраженным и интонационно выделенным «Я»; וְ в данном контексте естественно выражает смысловое противопоставление как «а».
- source_word: הַסְתֵּר אַסְתִּיר
  choice: непременно скрою
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает уверенность и категоричность действия.
- source_word: פָּנַי
  choice: Моё лицо
  rationale: Сохранён конкретный древнееврейский образ «Моё лицо», без замены его толкованием о благоволении или присутствии.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача временного оборота с сохранением указательного значения.
- source_word: עַל כָּל הָרָעָה
  choice: из-за всего зла
  rationale: Предлог עַל здесь указывает на причину, а רָעָה обозначает совершённое нравственное зло.
- source_word: אֲשֶׁר עָשָׂה
  choice: которое он совершил
  rationale: Форма 3-го лица единственного числа сохранена; «совершил зло» звучит естественно и достойно в современном литературном русском.
- source_word: כִּי פָנָה אֶל
  choice: потому что обратился к
  rationale: כִּי вводит причину, а פָנָה אֶל обозначает обращение к объекту почитания или преданности; перевод не добавляет отсутствующее в еврейском тексте местоимение.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямая передача устойчивого обозначения иных божеств.
theological_decisions:
- issue: Антропоморфное описание Божьего удаления
  choice: Сохранить в основном тексте «скрою Моё лицо»
  alternative: «сокрою Моё присутствие» или «лишу его Моего благоволения»
  rationale: Еврейский текст использует конкретный образ лица; его буквальное сохранение не устраняет богословскую многозначность образа.
- issue: Единственное число при обозначении Израиля
  choice: Сохранить «он совершил» и подразумеваемое единственное число в «обратился»
  alternative: «они совершили… они обратились»
  rationale: Еврейские глаголы стоят в мужском роде единственного числа и представляют Израиль как единое лицо; форма источника сохранена.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавные буквы в «Я» и «Моё» обозначают говорящего Бога по принятой русской библейской традиции. Усиление выражено словом «непременно», а коллективный Израиль сохранён в грамматическом единственном числе.
