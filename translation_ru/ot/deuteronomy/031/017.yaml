  terminology: «Воспылает Мой гнев», «оставлю», «скрою от них Своё лицо» и «постигнут» соответствуют еврейскому тексту и подходят для библейского регистра. «Беды и несчастья» приемлемо передаёт רָעוֹת רַבּוֹת וְצָרוֹת. В примечании следует описать лексическую неопределённость без утверждения, что речь непременно идёт о пожирании.
