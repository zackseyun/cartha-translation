  source_fidelity: 'Основной смысл передан точно: гнев, оставление, сокрытие лица, последующие бедствия и речь Израиля как олицетворённого единственного лица сохранены. Однако «будут отданы на съедение» добавляет идею передачи кем-то, которой сжатая конструкция וְהָיָה לֶאֱכֹל прямо не выражает. Более нейтральное «станут добычей» лучше передаёт уязвимость, не называя ни действующего лица, ни способа уничтожения.'
