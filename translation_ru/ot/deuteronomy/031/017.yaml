base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: ru
  text: 'В тот день воспылает Мой гнев на них, и Я оставлю их, и скрою от них Своё лицо. Они станут добычей[a], и постигнут их многие беды и несчастья. В тот день он скажет[b]: «Не потому ли постигли меня эти беды, что Бога моего нет во мне?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и он/оно будет для съедения». Еврейское выражение сжато; оно может означать, что Израиль станет добычей или будет поглощён.'
    reason: lexical_alternative
  - marker: b
    text: 'Израиль представлен здесь как один человек и потому говорит о себе в единственном числе: «меня»; буквально: «Бога моего нет внутри меня».'
    reason: collective_singular
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: воспылает Мой гнев
  rationale: Сохраняет образ пылающего гнева, лежащий в основе еврейской идиомы, и звучит естественно и достойно по-русски.
- source_word: בּוֹ
  choice: на них
  rationale: Форма единственного числа относится к Израилю как к единому народу, однако ближайшие глагольные суффиксы имеют множественное число; в повествовательной части русское множественное число естественно передаёт коллективный референт.
- source_word: וַעֲזַבְתִּים
  choice: Я оставлю их
  rationale: Передаёт заветное оставление без чрезмерного усиления, возможного в варианте «покину навсегда».
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: скрою от них Своё лицо
  rationale: Сохраняет значимый еврейский образ сокрытия Божьего лица, не сводя его к пояснительному «лишу их Моего присутствия».
- source_word: וְהָיָה לֶאֱכֹל
  choice: они будут отданы на съедение
  rationale: Сжатая конструкция буквально означает «и он/оно будет для съедения». Русский оборот передаёт уязвимость перед уничтожением, не называя не указанного в тексте пожирателя.
- source_word: וּמְצָאֻהוּ
  choice: постигнут их
  rationale: В контексте бед глагол «постигнуть» естественнее буквального «найти»; местоимение во множественном числе соотнесено с Израилем как народом.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: многие беды и несчастья
  rationale: Передаёт два близких, но не полностью тождественных обозначения бедствий понятным современным языком.
- source_word: וְאָמַר
  choice: он скажет
  rationale: Сохранено единственное число оригинала, в котором Израиль олицетворён как один говорящий.
- source_word: הֲלֹא עַל כִּי
  choice: Не потому ли… что
  rationale: Естественно передаёт причинный риторический вопрос.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: Бога моего нет среди меня
  rationale: Сохраняет первое лицо единственного числа и образ «среди/внутри меня», не заменяя его истолковывающим множественным «среди нас».
- source_word: מְצָאוּנִי
  choice: постигли меня
  rationale: Повторяет тот же русский глагол, что и ранее, сохраняя лексическую связь между предсказанием бед и последующим признанием.
theological_decisions:
- issue: Коллективное единственное и множественное число применительно к Израилю
  choice: В повествовании употребить множественное число («их»), а в словах олицетворённого Израиля сохранить единственное («он», «меня»).
  alternative: Последовательно употребить либо единственное, либо множественное число.
  rationale: Так русский текст остаётся естественным в повествовательной части и одновременно сохраняет заметное олицетворение народа в прямой речи.
- issue: Смысл сокрытия Божьего лица
  choice: Сохранить образ «скрою… Своё лицо».
  alternative: Передать как «отвернусь от них» или «удалю от них Своё присутствие».
  rationale: Оригинал выражает суд через многозначный образ отношений и присутствия; буквальный образ сохраняет богословское напряжение и не подменяет его толкованием.
- issue: Осмысление Божьего отсутствия самим Израилем
  choice: Передать признание как риторический вопрос, не уточняя, является ли оно полным покаянием или лишь объяснением бедствия.
  alternative: Добавить формулировку, явно обозначающую покаяние или окончательное оставление Богом.
  rationale: Стих сообщает осознание связи между бедами и отсутствием Бога, но сам по себе не определяет глубину покаяния и не разрешает напряжение между Божьим сокрытием и Его заветными отношениями с народом.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены образы пылающего гнева и сокрытого лица; архаизмы сведены к умеренному «воспылает», уместному для высокого регистра.
