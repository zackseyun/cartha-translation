  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: ru
  text: 'И Яхве сказал Моисею: «Вот, приблизились дни, когда тебе предстоит умереть. Позови Иисуса Навина, и предстаньте оба в шатре встречи, чтобы Я дал ему повеление[a]». Моисей и Иисус Навин пошли и предстали в шатре встречи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы Я дал ему поручение» или «чтобы Я наставил его». Еврейский глагол צוה обычно означает «повелевать» или «давать повеление»; в этом контексте он может подразумевать официальное поручение Иисусу Навину.'
    reason: Лексическое значение צוה включает повеление; контекст допускает оттенок официального поручения, но не требует выводить самостоятельное значение «назначить».
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הֵן
  choice: вот
  rationale: Сохраняет функцию частицы, привлекающей внимание, и естественно звучит в современной литературной русской речи.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: приблизились дни, когда тебе предстоит умереть
  rationale: Сохраняет образ приблизившихся «дней» и значение инфинитива «умереть», не сводя выражение к свободному пересказу.
- source_word: קְרָא אֶת־יְהוֹשֻׁעַ
  choice: позови Иисуса Навина
  rationale: Прямо передаёт повелительное קְרָא; для имени используется укоренившаяся русская библейская форма, отличающая Иисуса Навина от других носителей имени.
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  choice: предстаньте оба / предстали
  rationale: Форма обозначает явиться и занять своё место перед Яхве; «оба» естественно выражает еврейское множественное число, обращённое к Моисею и Иисусу Навину.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: в шатре встречи
  rationale: Передаёт культовое обозначение как место встречи с Богом и сохраняет значение предлога «в».
- source_word: וַאֲצַוֶּנּוּ
  choice: чтобы Я дал ему поручение
  rationale: Передаёт официальный характер Божьего наставления Иисусу Навину, сохраняя возможный диапазон значений «повелеть», «дать поручение», «поставить на служение».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Значение צוה в связи с Иисусом Навином
  choice: дать ему поручение
  alternative: повелеть ему; вверить ему служение
  rationale: Контекст указывает на официальное поручение преемнику Моисея, однако сам глагол допускает более общее значение повеления; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены образ «приблизившихся дней», личное имя Яхве и формальность явления в шатре встречи.
