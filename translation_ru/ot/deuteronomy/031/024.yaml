  source_fidelity: 'Основной смысл передан верно: Моисей завершил запись слов «этого закона». Однако עַל סֵפֶר буквально означает запись «на» письменном носителе; «в свитке» возможно по-русски, но несколько отдаляет формулировку от образа письма на свитке. Оборот «до самого конца» передаёт завершённость, но не столь ясно связывает её именно с завершением записи.'
