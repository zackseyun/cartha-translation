lexical_decisions:
- source_word: וַיְהִי
  choice: И когда
  rationale: Повествовательная форма вводит следующий эпизод; в сочетании с временной конструкцией כְּכַלּוֹת естественно передаётся по-русски как «И когда».
- source_word: כְּכַלּוֹת
  choice: закончил
  rationale: Предлог כְּ с инфинитивом от כלה образует временную конструкцию и подчёркивает завершение действия.
- source_word: מֹשֶׁה
  choice: Моисей
  rationale: Использована традиционная русская форма библейского имени.
- source_word: לִכְתֹּב
  choice: записывать
  rationale: После «закончил» несовершенный инфинитив естественно обозначает доведённый до завершения процесс письменной фиксации.
- source_word: דִּבְרֵי
  choice: слова
  rationale: В данном литературно-правовом контексте דְּבָרִים обозначает словесное содержание записанного закона.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: этого закона
  rationale: В контексте Второзакония תּוֹרָה имеет смысл данного народу закона или наставления; «этого закона» ясно передаёт также указательное местоимение.
- source_word: עַל סֵפֶר
  choice: в свитке
  rationale: סֵפֶר обозначает письменный документ, обычно свиток; русский предложный оборот «в свитке» естественно описывает нахождение записанного текста.
- source_word: עַד תֻּמָּם
  choice: до самого конца
  rationale: Оборот буквально указывает на доведение упомянутых слов до их полного завершения; «до самого конца» естественно сохраняет значение полноты.
