  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: ru
  text: А их дети[a], которые не знали, услышат и научатся бояться Яхве[b], вашего Бога, во все дни, пока вы живёте на земле, на которую вы переходите через Иордан, чтобы овладеть ею[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновья». Еврейское слово может обозначать как сыновей, так и детей или потомков вообще.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте — יהוה (YHWH), личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Или: «чтобы вступить во владение ею»; возможен также оттенок получения земли в наследие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: А их дети
  rationale: בנים может обозначать как сыновей, так и детей или потомков вообще; в контексте наставления следующего поколения более уместно широкое «дети».
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: которые не знали
  rationale: Перфект ידע указывает на отсутствие прежнего знания или опыта. Дополнение в еврейском тексте не выражено, поэтому оно не добавлено и в переводе.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: услышат и научатся
  rationale: Будущие формы передают ожидаемый результат слушания; «услышат» сохраняет конкретный образ восприятия провозглашаемого наставления.
- source_word: לְיִרְאָה
  choice: бояться
  rationale: ירא в книге Второзаконие включает благоговейный страх и верность Богу; «бояться» сохраняет силу и богословскую ёмкость исходного выражения.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Яхве, вашего Бога
  rationale: Личное имя יְהוָה передано транслитерацией «Яхве», а местоименный суффикс при אֱלֹהֵיכֶם — прямым обращением «вашего Бога».
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: во все дни, пока вы живёте
  rationale: Формула длительности сохранена через «во все дни», а придаточное естественно выражено по-русски оборотом «пока вы живёте».
- source_word: עַל הָאֲדָמָה
  choice: на земле
  rationale: אֲדָמָה здесь обозначает землю как территорию обитания Израиля; сочетание «жить на земле» естественно в русском и соответствует предлогу עַל.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: в которую переходите через Иордан, чтобы овладеть ею
  rationale: Перевод явно передаёт направление שָׁמָּה, переход через Иордан и цель, выраженную инфинитивной конструкцией לְרִשְׁתָּהּ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное covenantное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Объём значения בנים
  choice: дети
  alternative: сыновья
  rationale: Контекст говорит о наставлении следующего поколения в целом; «сыновья» неоправданно сужало бы возможный охват слова.
- issue: Значение ירא по отношению к Богу
  choice: бояться
  alternative: почитать; благоговеть
  rationale: «Бояться» сохраняет присущую еврейскому слову напряжённость между страхом, благоговением и верностью, не сводя её лишь к почтению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис слегка приподнят, но понятен обычному читателю; сохранены повтор «во все дни» и невыраженный объект при «не знали», чтобы не устранять неоднозначность исходного текста.
