  yaml_path: translation/ot/deuteronomy/031/025.yaml
  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: ru
  text: 'И повелел Моисей левитам, носившим ковчег завета Яхве[a], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «левитам — носителям ковчега завета Яхве». Еврейское причастие можно передать более формально, как обозначение их служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол צוה обозначает отдание повеления; «повелел» точно передаёт его смысл и соответствует возвышенному повествовательному регистру.
- source_word: הַלְוִיִּם
  choice: левитам
  rationale: Устоявшееся русское обозначение представителей колена Левия; дательный падеж обусловлен управлением глагола «повелел».
- source_word: נֹשְׂאֵי
  choice: носившим
  rationale: Причастие от נשׂא атрибутивно характеризует левитов как тех, кто нёс или обычно носил ковчег. Форма «носившим» естественна по-русски и не превращает описание однозначно в официальный титул.
- source_word: אֲרוֹן
  choice: ковчег
  rationale: В контексте святилища и завета традиционное «ковчег» точно обозначает священный предмет, а не обычный сундук.
- source_word: בְּרִית
  choice: завета
  rationale: Сочетание אֲרוֹן בְּרִית передано устойчивым выражением «ковчег завета», сохраняющим конструктивную связь существительных.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет наличие божественного имени в еврейском тексте, не заменяя его титулом.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Инфинитивная формула вводит прямую речь следующего стиха. «Сказав» формально прозрачно передаёт её, а двоеточие естественно обозначает последующую речь.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, а не титул אֲדֹנָי. «Яхве» сохраняет личное имя и представляет наиболее принятую в современной русскоязычной научной и литературной передаче реконструкцию произношения; вариант «Господь» отражает традицию замещения при чтении, а «Иегова» — более позднюю гибридную форму.
- issue: Функция причастия נֹשְׂאֵי
  choice: описательное «носившим»
  alternative: титульное «носителям»
  rationale: Еврейское причастие допускает как описание левитов, нёсших ковчег, так и более устойчивое обозначение их обязанности. Основной текст сохраняет естественное описательное прочтение, а титульный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским строем. Порядок слов «И повелел Моисей» поддерживает повествовательную преемственность и торжественный тон; формула «сказав» сохранена ради близости к синтаксису оригинала.
