  text: וְ/עָשָׂ֤ה יְהוָה֙ לָ/הֶ֔ם כַּ/אֲשֶׁ֣ר עָשָׂ֗ה לְ/סִיח֥וֹן וּ/לְ/ע֛וֹג מַלְכֵ֥י הָ/אֱמֹרִ֖י וּ/לְ/אַרְצָ֑/ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: ru
  text: И поступит с ними ГОСПОДЬ так же, как поступил с Сихоном и Огом, царями аморреев, и с их землёй, когда истребил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон традиционным русским библейским соответствием, сохраняя отличие имени Бога посредством прописных букв.
- source_word: וְעָשָׂה ... כַּאֲשֶׁר עָשָׂה
  choice: И поступит ... так же, как поступил
  rationale: Сохраняет повтор глагола עשה и сравнительную конструкцию, оставаясь естественным по-русски.
- source_word: מַלְכֵי הָאֱמֹרִי
  choice: царями аморреев
  rationale: Естественная русская передача собирательного обозначения народа в данном титуле.
- source_word: הִשְׁמִיד אֹתָם
  choice: истребил их
  rationale: Порода hifil глагола שמד выражает причинение полного уничтожения; «истребил» точно и стилистически уместно передаёт эту силу.
- source_word: אֲשֶׁר
  choice: когда
  rationale: В заключительной фразе относительная частица допускает обстоятельственное временное прочтение; оно ясно связывает истребление царей и их земли с прежним деянием Господа.
theological_decisions:
- issue: Референт местоимения в אֲשֶׁר הִשְׁמִיד אֹתָם
  choice: «когда истребил их» — местоимение формально оставлено без уточняющей замены существительным
  alternative: «которых Он истребил» или «которую Он разорил»
  rationale: Еврейская конструкция сочетает אֲשֶׁר с местоименным суффиксом мужского рода множественного числа и допускает некоторую синтаксическую напряжённость после упоминания царей и земли. Перевод не вводит отсутствующее в источнике однозначное уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён синтаксический параллелизм оригинала; архаические формы и лишние пояснения не использованы.
