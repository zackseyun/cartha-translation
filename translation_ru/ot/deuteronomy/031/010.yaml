    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол צוה выражает властное предписание; «повелел» сохраняет его директивную силу и соответствует возвышенному повествовательному регистру.
- source_word: אוֹתָם
  choice: им
  rationale: Местоимение мужского рода множественного числа относится к названным в контексте лицам; при русском глаголе «повелел» естественно употребить дательный падеж.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский инфинитив вводит содержание речи. В современном русском его естественно передать пунктуационно, не добавляя тяжеловесного «сказав».
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: по завершении каждых семи лет
  rationale: מִקֵּץ означает «в конце, по завершении», а контекст предписания указывает на повторяющийся семилетний цикл. Формулировка сохраняет обе составляющие смысла.
- source_word: בְּמוֹעֵד
  choice: в назначенное время
  rationale: מוֹעֵד обозначает установленное, назначенное время или срок; выбранный вариант точен и естественен по-русски.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: года освобождения
  rationale: שְׁמִטָּה буквально связано с отпусканием или освобождением и обозначает установленное для седьмого года освобождение от долговых обязательств. Вариант передаёт смысл термина без подмены его традиционным толкованием.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: на празднике Шалашей
  rationale: חַג — «праздник», а סֻכּוֹת — «шалаши». Название «праздник Шалашей» прозрачно передаёт еврейский образ и понятно современному читателю.
theological_decisions:
- issue: Характер семилетнего срока
  choice: каждых семи лет
  alternative: семи лет
  rationale: Само выражение формально допускает «по завершении семи лет», однако законодательный контекст описывает регулярно повторяющийся семилетний цикл. Уточнение вынесено также в сноску, чтобы не скрывать буквальную форму.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Архаическое «сказав» опущено в пользу естественного оформления прямой речи; традиционное «Кущей» сохранено в сноске. Конечная запятая оставлена внутри незавершённой прямой речи, поскольку предложение продолжается в следующем стихе.
