  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: ru
  text: И написал Моисей этот закон[a] и передал его священникам, сынам Левия[b], которые носят ковчег завета Яхве[c], и всем старейшинам Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это наставление»; или: «эту Тору».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынам Левия»; также можно перевести: «левитам».'
    reason: lexical_alternative
  - marker: c
    text: 'Евр. יהוה (YHWH); традиционно переводится: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: и написал
  rationale: Прямо передаёт значение כתב и последовательность повествования, выраженную формой с וַ־.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: этот закон
  rationale: В данном контексте речь идёт о записанном Моисеем своде заветных предписаний; «закон» естественно и точно передаёт תּוֹרָה, тогда как возможны также «наставление» и «Тора».
- source_word: וַיִּתְּנָהּ
  choice: и передал его
  rationale: По-русски «передал» естественно описывает вручение записанного закона назначенным хранителям; местоимение «его» согласовано с русским словом «закон».
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: священникам, сынам Левия
  rationale: Сохраняет явное обозначение священников и приложение «сыны Левия», не сводя выражение к более общему «левитам».
- source_word: הַנֹּשְׂאִים
  choice: которые носят
  rationale: Причастие имеет характеризующее значение; настоящее время «носят» передаёт постоянную обязанность, а не только единичное действие.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Точно и естественно передаёт еврейскую сопряжённую конструкцию, сохраняя личное имя Бога.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: всем старейшинам Израиля
  rationale: Устоявшийся русский эквивалент для руководителей Израиля; дательный падеж продолжает управление глагола «передал».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя YHWH. «Яхве» сохраняет его как имя и отражает наиболее распространённую научную реконструкцию произношения; традиционная замена «Господь» отмечена в сноске.
- issue: Объём значения תּוֹרָה в данном месте
  choice: закон
  alternative: наставление; Тора
  rationale: Контекст говорит о записанном заветном тексте, поэтому «закон» уместен, но сноска сохраняет более широкое значение «наставление» и транслитерацию «Тора» без преждевременного определения точного объёма документа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «И написал Моисей» сохраняет повествовательный акцент исходного текста, оставаясь понятной современному читателю. Термины «ковчег завета» и «старейшины» сохранены как ясные и устоявшиеся.
