  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: ru
  text: И когда постигнут его многочисленные бедствия и невзгоды[a], эта песнь ответит перед ним — как свидетель[b], потому что она не забудется в устах его потомков. Ведь Я знаю его склонность[c] — то, что он делает сегодня, прежде чем Я приведу его в землю, которую поклялся дать[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «найдут его», «настигнут его».'
    reason: lexical_alternative
  - marker: b
    text: '«Перед ним» по контексту можно понимать и более сильно: «против него», поскольку песнь выступает свидетелем.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может также означать внутреннее намерение, побуждение или направленность.
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «которую Я поклялся». Слово «дать» подразумевается по контексту заветного обещания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Естественно передаёт еврейскую временную конструкцию, вводящую будущее событие.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: постигнут его
  rationale: В сочетании с бедствиями глагол מצא означает, что они находят или настигают человека; «постигнут» естественно звучит по-русски.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: многочисленные бедствия и невзгоды
  rationale: Здесь רעות обозначает пагубные события, а не нравственное зло; сочетание сохраняет два близких, но не тождественных понятия.
- source_word: וְעָנְתָה
  choice: ответит
  rationale: Сохраняет основное значение ענה «отвечать» и образ песни, выступающей свидетелем; свидетельская функция прямо названа далее.
- source_word: לְפָנָיו לְעֵד
  choice: перед ним как свидетель
  rationale: Передаёт буквальное пространственно-судебное выражение, не устраняя возможный более сильный смысл «против него».
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: она не забудется в устах его потомков
  rationale: Сохраняет образ устной передачи песни и коллективный смысл זרע.
- source_word: יִצְרוֹ
  choice: его склонность
  rationale: Передаёт внутреннюю направленность или расположение человека, не превращая слово в позднейший богословский термин.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: то, что он делает уже сегодня
  rationale: Передаёт настоящее продолжающееся действие; «уже» естественно подчёркивает контраст с ещё не состоявшимся вступлением в землю.
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: которую поклялся дать
  rationale: В сохранившейся еврейской формулировке буквально сказано «которую Я поклялся»; глагол «дать» восполнен из устойчивого контекста заветного обещания и пояснён в сноске.
theological_decisions:
- issue: Знание Богом внутренней направленности Израиля до вступления в землю
  choice: Я знаю его склонность
  alternative: Я знаю его замысел / воображение
  rationale: «Склонность» сохраняет нравственно-волевой смысл יצר, не разрешая скрыто напряжение между божественным предведением и ответственностью народа.
- issue: Судебная роль песни
  choice: ответит перед ним как свидетель
  alternative: будет свидетельствовать против него
  rationale: Основной текст сохраняет буквальные значения ענה и לפניו, тогда как возможная обвинительная сила выражения отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены единственное число собирательного обозначения Израиля, образ отвечающей песни и выражение об устах потомков.
