lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И произнёс
  rationale: Форма с повествовательным וַ продолжает последовательность событий. «Произнёс» естественно передаёт публичное устное изложение слов песни, не добавляя смысла пения.
- source_word: בְּאָזְנֵי
  choice: перед
  rationale: Буквально «в уши» — древнееврейская идиома, означающая, что слова произносились так, чтобы их слышали присутствующие. В данном контексте «перед всем собранием» передаёт это естественно по-русски.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: всем собранием Израиля
  rationale: קָהָל обозначает собравшуюся общину как единое целое. «Собрание» сохраняет общественный смысл слова без узкоконфессиональной окраски.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: слова этой песни
  rationale: Перевод сохраняет явно выраженное דִּבְרֵי («слова»), а שִׁירָה передаёт как «песня», не сводя выражение просто к «эту песню».
- source_word: עַד תֻּמָּם
  choice: до самого конца
  rationale: Выражение указывает на полное завершение произнесения песни. Такой перевод естественен по-русски и сохраняет основной смысл, а грамматическая неоднозначность местоименного суффикса отмечена в сноске.
