  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: ru
  text: 'И призвал Моисей Иисуса Навина и сказал ему перед всем Израилем: «Будь твёрд и мужествен, потому что ты войдёшь вместе с этим народом[a] в землю, которую Яхве поклялся дать их отцам[b], и ты дашь им её в наследие».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты введёшь этот народ в эту землю». Еврейский текст можно понять и как совместное вступление Иисуса Навина с народом, и как то, что он поведёт народ в землю.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «их отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: В повествовательном контексте קרא означает «позвал, призвал». «Призвал» естественно передаёт публичное обращение Моисея к Иисусу Навину.
- source_word: לִיהוֹשֻׁעַ
  choice: Иисуса Навина
  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая отличать Иисуса Навина от других носителей имени Иисус.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: перед всем Израилем
  rationale: Буквально «на глазах у всего Израиля»; выбранная формулировка ясно и естественно передаёт публичность происходящего.
- source_word: חֲזַק וֶאֱמָץ
  choice: Будь твёрд и мужествен
  rationale: Устойчивая пара повелений выражает стойкость и мужество, необходимые руководителю; современная формулировка сохраняет достоинство речи.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего призыва и здесь естественно имеет причинное значение.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: ты войдёшь вместе с этим народом
  rationale: Конструкция בוא с אֶת допускает понимание совместного вступления Иисуса Навина с народом. Перевод сохраняет отличие от следующей каузативной формы, где ему отведена активная роль в передаче земли в наследие.
- source_word: הָאָרֶץ
  choice: землю
  rationale: «Земля» — естественный и контекстуально значимый эквивалент в повествовании об обещанной Израилю земле.
- source_word: נִשְׁבַּע יְהוָה
  choice: Яхве поклялся
  rationale: Нифаль глагола שׁבע обозначает клятву; личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: לַאֲבֹתָם
  choice: их отцам
  rationale: Сохранён конкретный мужской родственный термин исходного текста, а не заменён более общим словом «предки».
- source_word: לָתֵת לָהֶם
  choice: дать их
  rationale: 'Инфинитив прямо выражает содержание клятвы: дать землю отцам; местоимение по-русски относится к слову «землю».'
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: ты передашь её им в наследие
  rationale: Каузативная форма נחל означает наделить наследием или дать во владение как наследство. Формулировка сохраняет понятие наследия и звучит естественно по-русски.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение תָּבוֹא אֶת הָעָם
  choice: ты войдёшь вместе с этим народом
  alternative: ты введёшь этот народ
  rationale: Еврейская конструкция допускает оба понимания. Основной текст сохраняет вероятное значение совместного вступления и не гармонизирует его автоматически с близкими формулировками; иной вариант отмечен в сноске.
- issue: Передача אֲבֹתָם
  choice: их отцам
  alternative: их предкам
  rationale: Выбран буквальный родственный термин исходного текста без гендерно-нейтрального обобщения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным регистром. Сохранены публичность наставления, формула ободрения, личное имя Яхве и смысл земли как наследия. Начальное «И» отражает повествовательную связь еврейского текста с предыдущим контекстом.
