base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: ru
  text: Когда весь Израиль придёт на место, которое изберёт Яхве, твой Бог, чтобы предстать перед Ним[a], читай этот закон перед всем Израилем, так, чтобы все слышали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидеть лицо Яхве, твоего Бога»; это выражение означает явиться в Его присутствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל יִשְׂרָאֵל
  choice: когда весь Израиль придёт
  rationale: Предлог בְּ с инфинитивом בוא образует придаточное времени; собирательное выражение כָל יִשְׂרָאֵל передано естественно и близко к форме оригинала.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: чтобы предстать перед
  rationale: В контексте паломничества выражение «видеть лицо» обозначает явление в чьё-либо присутствие; основной текст передаёт смысл идиомы, а буквальный образ сохранён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твоим Богом
  rationale: Сохранена форма второго лица единственного числа, в которой Моисей обращается к Израилю как к единому народу.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: на месте, которое Он изберёт
  rationale: Будущее значение имперфекта и тема места, избираемого Богом, переданы непосредственно; местоимение «Он» ясно соотнесено с Яхве.
- source_word: תִּקְרָא אֶת־הַתּוֹרָה הַזֹּאת
  choice: читай этот закон
  rationale: קרא здесь означает публичное чтение вслух, а תורה в данном контексте — данный Моисеем свод наставлений и закона. Русский императив естественно передаёт предписание, выраженное формой 2 м. ед.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: перед всем Израилем
  rationale: Передаёт публичное действие в присутствии собравшегося народа.
- source_word: בְּאָזְנֵיהֶם
  choice: вслух
  rationale: Естественно передаёт идиому «в их уши», подчёркивая слышимое публичное чтение без ненужной буквальности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Смысл выражения לֵרָאוֹת אֶת־פְּנֵי יְהוָה
  choice: предстать перед Яхве
  alternative: увидеть лицо Яхве
  rationale: Контекст предписанного собрания указывает на явление в Божье присутствие, а не на утверждение о буквальном зрительном созерцании Бога; буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Единственное число «твоим» и «читай» сохраняет обращение к Израилю как к единому народу. «Вслух» естественно выражает цель оборота «в их уши».
