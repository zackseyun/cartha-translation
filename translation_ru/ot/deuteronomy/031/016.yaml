  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: ru
  text: 'И сказал Яхве Моисею: «Вот, скоро ты ляжешь со своими отцами. Тогда этот народ встанет и станет блудодействовать[a], следуя за чужими богами той земли, в которую он входит, в самую её среду[b]. Он оставит Меня и нарушит Мой завет, который Я заключил с ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет блудодействовать вслед за чужими богами». Половая неверность здесь служит образом неверности завету через идолопоклонство.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте стоят формы единственного числа: «он входит», «в её/его среду» и далее «с ним». Так народ Израиля представлен как единое целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: вот, скоро ты ляжешь со своими отцами
  rationale: Сохраняет еврейский образ смерти и значение близкого будущего; формулировка торжественна, но понятна современному читателю.
- source_word: וְקָם
  choice: тогда этот народ встанет
  rationale: Будущее время соответствует пророческой последовательности после смерти Моисея; глагол сохранён без добавления толкования о мятеже.
- source_word: וְזָנָה אַחֲרֵי
  choice: станет блудодействовать вслед за
  rationale: Сохраняет намеренно резкую метафору половой неверности, обозначающую идолопоклонство и нарушение завета.
- source_word: אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: чужими богами той земли
  rationale: Естественно передаёт богов, чуждых Израилю и связанных с землёй, в которую он входит.
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: в которую он входит
  rationale: Русское единственное число естественно согласуется с собирательным существительным «народ» и сохраняет еврейскую форму; громоздкое буквальное повторение «туда, в её среду» опущено как избыточное в русском.
- source_word: וַעֲזָבַנִי
  choice: он оставит Меня
  rationale: Передаёт предсказанное отступничество простым и весомым глаголом; заглавная буква у местоимения соответствует принятому русскому благоговейному оформлению речи Бога.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: нарушит Мой завет
  rationale: «Нарушить завет» — ясное современное соответствие глаголу הפר в контексте завета.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: который Я заключил с ним
  rationale: Передаёт устойчивое выражение כרת ברית естественным русским «заключить завет» и сохраняет собирательное единственное число.
theological_decisions:
- issue: Идолопоклонство описано половой метафорой
  choice: Сохранить сильную метафору словом «блудодействовать».
  alternative: «Изменять», «быть неверным» или «впасть в идолопоклонство».
  rationale: Еврейский текст намеренно изображает поклонение иным богам как половую неверность завету; смягчение устранило бы существенную образность и напряжение текста.
- issue: Собирательное единственное число применительно к Израилю
  choice: 'Сохранить единственное число: «народ… он входит… с ним».'
  alternative: 'Перейти к множественному числу: «они входят… с ними».'
  rationale: В русском «народ» естественно принимает местоимения мужского рода единственного числа, поэтому можно одновременно сохранить ясность и грамматическую форму еврейского текста.
- issue: Образ смерти Моисея
  choice: Сохранить выражение «ляжешь со своими отцами».
  alternative: 'Истолковать непосредственно: «умрёшь» или «упокоишься вместе с предками».'
  rationale: Исходный образ связывает смерть Моисея с его предками; буквальный образ понятен по контексту и не требует устранения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены личное имя «Яхве», образ «лечь с отцами», резкая метафора блудодейства и естественное для русского собирательное единственное число.
