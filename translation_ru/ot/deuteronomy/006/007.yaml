  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: ru
  text: Настойчиво внушай[a] их своим сыновьям[b] и говори о них, когда сидишь у себя дома, когда идёшь по дороге, когда ложишься и когда встаёшь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально глагол связан с «заострением»; здесь он образно означает многократное и тщательное наставление.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоим сыновьям»; в еврейском тексте употреблена форма мужского рода во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: настойчиво внушай их
  rationale: Глагол שׁנן буквально связан с заострением, но здесь метафорически означает многократное, тщательное наставление. «Настойчиво внушай» естественно передаёт интенсивность и повторяемость действия, не превращая метафору в неясный буквализм.
- source_word: לְבָנֶיךָ
  choice: своим сыновьям
  rationale: 'בנים — форма мужского рода во множественном числе с суффиксом второго лица единственного числа: буквально «твоим сыновьям». Основной текст сохраняет выраженную в источнике родовую форму.'
- source_word: וְדִבַּרְתָּ בָּם
  choice: и говори о них
  rationale: Предлог ב после דבר в данном контексте естественно передаётся по-русски конструкцией «говорить о них».
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: когда сидишь у себя дома
  rationale: Инфинитивная конструкция с ב обозначает временное обстоятельство; перевод сохраняет привычную, повторяющуюся домашнюю ситуацию и звучит естественно по-русски.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: и когда идёшь дорогой
  rationale: דרך означает «дорога, путь». Формулировка передаёт передвижение в пути без ненужного сужения значения до определённого вида путешествия.
- source_word: וּבְשָׁכְבְּךָ
  choice: когда ложишься
  rationale: Выражение обозначает момент, когда человек ложится, в обычном суточном ритме; русский несовершенный вид сохраняет обобщённо-повторяющийся смысл.
- source_word: וּבְקוּמֶךָ
  choice: когда встаёшь
  rationale: Фраза обозначает вставание, особенно после сна, и образует естественную смысловую пару с «когда ложишься».
theological_decisions:
- issue: Родовое обозначение адресатов наставления в завете
  choice: своим сыновьям
  alternative: своим детям
  rationale: Еврейский текст прямо употребляет существительное мужского рода во множественном числе — «сыновья». Перевод сохраняет эту форму, не исключая возможного более широкого применения наставления в семье, отмеченного в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Синтаксический параллелизм исходного текста сохранён; формы второго лица единственного числа отражают еврейское обращение к отдельному представителю народа.
