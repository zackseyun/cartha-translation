  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: ru
  text: 'тогда скажи своему сыну[a]: «Мы были рабами фараона в Египте, и Яхве вывел нас из Египта могучей рукой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и скажи». Древнееврейский союз можно передать простым «и»; слово «тогда» яснее показывает последовательность наставления, начатого в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сильной рукой». Этот древнееврейский образ говорит о могущественном действии Яхве, избавившего народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: тогда скажи
  rationale: В контексте наставления союз וְ продолжает последовательность из предыдущего стиха; «тогда» естественно передаёт эту связь, а повелительная форма соответствует директивному значению древнееврейской конструкции.
- source_word: לְבִנְךָ
  choice: своему сыну
  rationale: Древнееврейская форма прямо обозначает сына в мужском роде, единственном числе.
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: мы были рабами фараона
  rationale: В контексте исхода עֲבָדִים обозначает людей в подневольном состоянии; родительный оборот естественно передаёт их подчинённость фараону.
- source_word: וַיּוֹצִיאֵנוּ
  choice: но ... вывел нас
  rationale: Каузативная форма глагола יצא означает «вывести». Союз «но» естественно подчёркивает смысловой контраст между рабством и избавлением, допустимый для וַ в данном повествовании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּיָד חֲזָקָה
  choice: сильной рукой
  rationale: Буквальное и понятное воспроизведение древнееврейского образа, обозначающего могущественное действие при избавлении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Степень подневольности в עֲבָדִים
  choice: рабы
  alternative: слуги; рабы-слуги
  rationale: Контекст египетского угнетения требует передать именно рабское, а не просто служебное положение Израиля.
translation_notes:
  register: Современный литературный русский язык; речь простая и торжественная. Сохранены конкретное «сын», обозначение рабства и образ сильной руки. Прямая речь оформлена по нормам русского языка.
