base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: ru
  text: Ибо Яхве, твой Бог, среди тебя — Бог ревнивый[a], чтобы не воспылал на тебя гнев Яхве, твоего Бога, и не уничтожил тебя с лица земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог ревностный». Здесь речь об исключительном праве Яхве на верность народа, с которым Он заключил завет, а не о греховной зависти.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с поверхности земли»; это выражение означает полное удаление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета из предыдущего стиха; «потому что» ясно выражает причинную связь.
- source_word: אֵל קַנָּא
  choice: Бог ревнивый
  rationale: Выражение обозначает исключительное право Бога на верность народа завета и Его неприятие соперничающего поклонения; «ревнивый» сохраняет сильную реляционную и богословскую напряжённость оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом второго лица мужского рода единственного числа.
- source_word: בְּקִרְבֶּךָ
  choice: пребывающий среди вас
  rationale: Передаёт присутствие Яхве посреди народа. Число «вас» естественно указывает на общину, хотя обращение к Израилю в еврейском грамматически стоит в единственном числе.
- source_word: פֶּן
  choice: иначе
  rationale: Вводит предостережение о возможном последствии и звучит естественно в современном русском.
- source_word: יֶחֱרֶה אַף
  choice: гнев ... воспылает
  rationale: Сохраняет еврейскую метафору разгорающегося гнева и торжественный регистр.
- source_word: בָּךְ
  choice: на тебя
  rationale: При обозначении гнева предлог имеет направленно-враждебное значение; русское «на тебя» идиоматично.
- source_word: וְהִשְׁמִידְךָ
  choice: и Он уничтожит тебя
  rationale: Порода hифиль глагола שׁמד выражает полное уничтожение или устранение; выбран сильный, но не разговорный эквивалент.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Устойчивое русское выражение точно передаёт еврейскую идиому полного удаления с земли.
theological_decisions:
- issue: Передача Божьей ревности
  choice: Бог ревнивый
  alternative: Бог ревностный
  rationale: «Ревнивый» сохраняет идею исключительных отношений завета и неприятия иных богов. Сноска предупреждает понимание этой характеристики как греховной зависти.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Число адресата в בְּקִרְבֶּךָ
  choice: среди вас
  alternative: среди тебя
  rationale: Еврейский текст обращается к Израилю как к единому адресату во втором лице единственного числа, но пространственное «среди тебя» в современном русском неестественно. «Среди вас» раскрывает собирательное значение, не меняя референта.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Причинная связь с предыдущим стихом выражена словами «потому что»; метафора воспылавшего гнева сохранена. Единственное число обращения к Израилю удержано в «твой», «тебя», но בְּקִרְבֶּךָ естественно передано собирательным «среди вас».
