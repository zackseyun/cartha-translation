  rationale: Перестроено предложение, чтобы обстоятельство «в земле» естественно относилось к благополучию и умножению, а не к акту речи Яхве. «Говорил» заменено на «сказал» для передачи еврейского перфекта. Сноска уточнена так, чтобы не выдавать один из спорных синтаксических разборов за единственно возможный.
