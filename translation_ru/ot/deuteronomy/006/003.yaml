- from: Итак, слушай, Израиль, и тщательно исполняй это, чтобы тебе было хорошо и чтобы вы стали весьма многочисленны, как говорил тебе Яхве, Бог твоих отцов[a], в земле, где текут молоко и мёд.[b]
