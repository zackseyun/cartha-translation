  source_fidelity: 'Основные соответствия сохранены: «слушай» передаёт שמע без преждевременного значения «повинуйся», «тщательно исполняй» адекватно передаёт שמר לעשׂות, переход от единственного числа к множественному («тебе» / «вы») отражён, а «Яхве» и «Бог твоих отцов» точно передают исходные термины. Однако «как говорил тебе ... в земле» по-русски естественно читается так, будто Яхве говорил с Израилем именно в этой земле. Это неудачно передаёт спорную синтаксическую связь: в основном варианте «земля» должна быть местом благополучия и умножения, тогда как альтернативой остаётся её понимание как содержания сказанного/обещанного.'
