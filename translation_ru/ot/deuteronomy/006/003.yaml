base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: ru
  text: Итак, слушай, Израиль, и тщательно исполняй это, чтобы тебе было хорошо и чтобы вы стали весьма многочисленны в земле, где текут молоко и мёд, как сказал тебе Яхве, Бог твоих отцов[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог твоих предков». Буквально по-еврейски: «Бог твоих отцов».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «как сказал тебе Яхве, Бог твоих отцов, о земле, где текут молоко и мёд» или «как обещал тебе Яхве, Бог твоих отцов, землю, где текут молоко и мёд». Еврейская фраза сжата: слова о земле можно понимать как место благополучия и умножения либо как содержание сказанного Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: слушай
  rationale: Глагол שׁמע может означать «слышать», «слушать» или «повиноваться». «Слушай» сохраняет прямое значение, а оттенок послушания раскрывается последующим призывом исполнять.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: тщательно исполняй это
  rationale: Сочетание שׁמר с инфинитивом עשה обозначает внимательное соблюдение, выраженное в поступках. Местоимение «это» восполняет подразумеваемые наставления завета.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: чтобы тебе было хорошо
  rationale: Естественно передаёт характерную для Второзакония формулу благополучия, не сводя её только к нравственной оценке.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: и чтобы вы стали весьма многочисленны
  rationale: רבה здесь относится к численному умножению народа; «весьма» передаёт מְאֹד. Переход от единственного числа к множественному сохранён как особенность еврейского обращения к Израилю.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как говорил
  rationale: Сохраняет значение глагола «говорить» и не делает подразумеваемое обещание явным в основном тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Бог твоих отцов
  rationale: Сохраняет явно мужское родственное обозначение אבות; более широкое «предков» указано в примечании.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: в земле, где текут молоко и мёд
  rationale: Естественная русская передача устойчивого образа обильной и плодородной обещанной земли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Родственное обозначение אֲבֹתֶיךָ
  choice: твоих отцов
  alternative: твоих предков
  rationale: Основной текст сохраняет мужскую форму исходного выражения, а естественный более широкий вариант отмечен в сноске.
- issue: Связь слов «земля, где текут молоко и мёд» с предшествующей фразой
  choice: благополучие и умножение происходят в этой земле
  alternative: эти слова являются содержанием обещания Яхве
  rationale: Сжатый еврейский синтаксис допускает обе связи. Основной текст следует последовательности слов и естественно связывает обстоятельство места с умножением, не исключая альтернативного разбора, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы «тебе» и «вы» намеренно сохраняют переход исходного текста от обращения к Израилю как к одному лицу к обращению к народу во множественном числе.
