lexical_decisions:
- source_word: וְהָיוּ
  choice: и пусть… будут
  rationale: Форма в продолжении повелительного контекста имеет предписывающее значение; конструкция «пусть… будут» естественно передаёт его по-русски.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: «Слова» прямо передаёт דְּבָרִים и не сужает смысл до отдельных заповедей.
- source_word: אֲשֶׁר
  choice: которые
  rationale: Естественное русское относительное местоимение, относящееся к слову «слова».
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение может нести лёгкое ударение, но дополнительное усиление по-русски здесь привнесло бы лишний смысл.
- source_word: מְצַוְּךָ
  choice: заповедую тебе
  rationale: Причастная форма описывает совершающееся сейчас речевое действие; настоящее время сохраняет эту непосредственность, а «заповедую» соответствует контексту заветного наставления.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и точный эквивалент, сохраняющий непосредственность обращения Моисея.
- source_word: עַל לְבָבֶךָ
  choice: у тебя на сердце
  rationale: Сохраняет образ предлога עַל — «на» — и при этом звучит естественнее по-русски, чем изолированное «на твоём сердце».
theological_decisions:
- issue: Антропологический смысл לֵבָב
  choice: сердце
  alternative: разум; внутреннее существо
  rationale: В древнееврейском «сердце» охватывает мышление, волю и чувства. Сохранение этого слова не сужает смысл до одной познавательной способности.
- issue: Характер предписания во וְהָיוּ
  choice: пусть… будут
  alternative: будут; должны быть
  rationale: Так сохраняется нормативная сила высказывания без превращения его ни в простое предсказание, ни в чрезмерно жёсткую юридическую формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Заповедую» сохраняет заветно-наставительный оттенок, а «у тебя на сердце» сочетает естественность с еврейским образом.
