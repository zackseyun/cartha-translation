    text: 'Или: «твоим предкам». В еврейском тексте буквально: «твоим отцам»; далее прямо названы Авраам, Исаак и Иаков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Оборот вводит ожидаемое будущее обстоятельство; «И когда» естественно связывает стих с предшествующей речью и сохраняет временное значение.
- source_word: יְבִיאֲךָ
  choice: приведёт тебя в
  rationale: Каузативная форма глагола בוא означает «ввести, привести»; предлог «в» естественно выражает движение в землю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохранены форма единственного числа и притяжательный суффикс второго лица.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте заветного обетования «земля» сохраняет устойчивую библейскую связь с обещанной землёй.
- source_word: אֲשֶׁר נִשְׁבַּע ... לָתֶת לָךְ
  choice: которую Он поклялся дать
  rationale: Русская конструкция естественно соединяет предмет дара с клятвой и сохраняет явное значение клятвы.
- source_word: לַאֲבֹתֶיךָ
  choice: твоим отцам
  rationale: Буквально передаёт мужское множественное обозначение праотцов, которых далее текст называет по именам.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Имена переданы в традиционной русской библейской форме; дательный падеж ясно показывает адресатов клятвы без неестественного повторения предлога.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: большими и прекрасными городами
  rationale: «Большие» передаёт размер, а «прекрасные» — положительное качество и желанность, выраженные словом טוֹב, без сужения смысла до экономического процветания.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: которых ты не строил
  rationale: Прямая и естественная передача относительного придаточного и отрицательной формы второго лица единственного числа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Передача לַאֲבֹתֶיךָ
  choice: твоим отцам
  alternative: твоим предкам
  rationale: Непосредственное упоминание Авраама, Исаака и Иакова показывает, что речь конкретно о патриархах; основной текст сохраняет это, а более широкая лексическая возможность отмечена в сноске.
- issue: Синтаксическая связь городов с даром земли
  choice: «с большими и прекрасными городами» относится к земле, которую Бог даёт
  alternative: 'начать отдельную фразу: «там будут большие… города»'
  rationale: Еврейская фраза продолжает описание того, что Израиль получает в земле. Сохранена незавершённость предложения, поскольку перечень продолжается в следующем стихе.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Местоимение «Он» написано с прописной буквы как уважительное обозначение Бога. Единственное число «тебя/твой/ты» сохранено. Конечная запятая намеренно показывает, что синтаксический перечень продолжается в следующем стихе.
