  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: ru
  text: И когда Яхве, твой Бог, приведёт тебя в землю, которую Он поклялся твоим отцам[a] — Аврааму, Исааку и Иакову — дать тебе, с большими и прекрасными городами, которых ты не строил,
