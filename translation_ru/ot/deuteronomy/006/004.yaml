  text: 'Слушай, Израиль: Яхве, наш Бог, Яхве един.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве — наш Бог; только Яхве — Бог наш»; также возможно: «Яхве, наш Бог, — единый Яхве». Еврейская формулировка предельно кратка и допускает несколько синтаксически правдоподобных переводов.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Слушай
  rationale: Форма повелительного наклонения в единственном числе обращена к Израилю как к единому народу. «Слушай» естественно для современного русского языка и передаёт не только восприятие на слух, но и призыв внять и повиноваться.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя народа завета; передано в принятой русской форме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом «Господь».
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Хотя אֱלֹהִים формально имеет окончание множественного числа, здесь слово с суффиксом первого лица множественного числа обозначает единственного Бога Израиля.
- source_word: אֶחָד
  choice: един
  rationale: Основное значение — «один». В данной именной конструкции русское «един» сохраняет краткость и исповедальный характер фразы, не подменяя возможный смысл толкованием «единственный» или «только».
theological_decisions:
- issue: Синтаксис и смысл заключительной части Шма
  choice: «Яхве, наш Бог, Яхве един»
  alternative: '«Яхве — наш Бог, только Яхве»; также возможно: «Яхве, наш Бог, — единый Яхве»'
  rationale: В краткой еврейской именной фразе нет выраженной связки, поэтому возможны несколько синтаксически правдоподобных прочтений. Основной текст максимально близко сохраняет формулировку и её исповедание единства Бога, а варианты, подчёркивающие исключительную верность Яхве либо иначе связывающие члены фразы, вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. «Слушай» предпочтено перед устаревшим «внемли»; краткое «един» сохраняет традиционную весомость исповедания и близость к компактному еврейскому оригиналу.
