  text: чтобы прогнать всех твоих врагов от тебя, как сказал[a] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол буквально означает «сказал»; речь идёт о ранее произнесённом Божьем слове, которое остаётся в силе.
    reason: lexical_note
lexical_decisions:
- source_word: לַהֲדֹף
  choice: чтобы прогнать
  rationale: Инфинитив с ל продолжает целевую конструкцию предыдущего стиха. Порода hифиль глагола נדף означает причинить удаление, оттеснить; в военном контексте естественно «прогнать».
- source_word: אֵת
  choice: '[показатель прямого дополнения, не переводится]'
  rationale: У еврейского показателя определённого прямого дополнения нет отдельного соответствия в русском языке.
- source_word: כָּל
  choice: всех
  rationale: Перед существительным во множественном числе передаёт полный охват.
- source_word: אֹיְבֶיךָ
  choice: твоих врагов
  rationale: Сохраняет значение существительного и обращение к Израилю во втором лице единственного числа.
- source_word: מִפָּנֶיךָ
  choice: от тебя
  rationale: Буквально «от твоего лица / из твоего присутствия»; здесь это идиома удаления врагов с пути и из присутствия адресата. «От тебя» естественно передаёт её по-русски.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Передаёт соответствие ранее произнесённому слову Яхве.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Еврейский перфект обозначает предшествующее высказывание. Русское прошедшее время точно и естественно передаёт форму, не заменяя «сказал» более истолковывающим «обещал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Смысл דִּבֶּר в контексте Божьего слова
  choice: сказал
  alternative: обещал; говорил
  rationale: «Сказал» сохраняет лексическое значение и завершённость предшествующего высказывания. Его продолжающаяся сила ясна из контекста, тогда как «обещал» добавляло бы толкование.
- issue: Связь לַהֲדֹף с предыдущим стихом
  choice: чтобы прогнать
  alternative: прогоняя; и прогнать
  rationale: Целевое «чтобы» отражает инфинитив с ל и показывает синтаксическую зависимость фрагмента от предыдущего высказывания.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формулировка. Еврейская идиома מִפָּנֶיךָ передана естественным русским «от тебя», без ненужной буквальности. Маркер сноски поставлен непосредственно после относящейся к ней фразы.
