  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: ru
  text: Тщательно соблюдайте[a] заповеди Яхве, вашего Бога, Его свидетельства[b] и постановления, которые Он заповедал тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неуклонно соблюдайте»; в еврейском тексте сочетание абсолютного инфинитива с личной формой глагола придаёт призыву особую настойчивость.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово можно также передать как «установления», «предписания» или «условия завета».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: тщательно соблюдайте
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает призыв. «Тщательно соблюдайте» естественно передаёт и повелительную силу, и эмфазу.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: Слово обозначает предписанные обязательства; «заповеди» сохраняет торжественный заветно-правовой оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: 'Форма принадлежности передаёт обращение к общине: «вашего Бога».'
- source_word: עֵדֹתָיו
  choice: Его установления
  rationale: В данном контексте слово относится к обязательным положениям завета. «Установления» понятно современному читателю и сохраняет отличие от заповедей и постановлений.
- source_word: חֻקָּיו
  choice: постановления
  rationale: Слово обозначает предписанные нормы или установленные правила; «постановления» естественно для современного русского юридико-заветного регистра.
- source_word: אֲשֶׁר צִוָּךְ
  choice: которые Он дал вам
  rationale: Глагол буквально связан с повелением, однако по-русски «дал» естественно сочетается со всем рядом — заповедями, установлениями и постановлениями — и сохраняет их обязательный характер.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Объём относительного оборота אֲשֶׁר צִוָּךְ
  choice: отнести ко всему предшествующему перечню
  alternative: отнести только к ближайшему слову «постановления»
  rationale: Грамматика допускает связь с рядом правовых терминов в целом, что наиболее естественно в контексте Второзакония.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным заветно-правовым звучанием. Местоимение «вы» передаёт обращение к общине; прописные формы «Его» и «Он» употреблены как принятая в русском религиозном письме форма почтительности.
