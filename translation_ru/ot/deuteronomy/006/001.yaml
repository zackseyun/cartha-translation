revisions:
- from: Вот заповедь — установления и постановления, — которую Яхве[a], ваш Бог, повелел преподать вам, чтобы вы исполняли их в земле, куда переходите, чтобы овладеть ею[b].
  to: 'Вот заповедь: установления и постановления, которые Яхве[a], ваш Бог, повелел преподать вам, чтобы вы исполняли их в земле, в которую вы вступаете, чтобы овладеть ею[b].'
  rationale: Исправлена только небезопасная для чтения пунктуационно-синтаксическая форма. Двоеточие представляет «установления и постановления» как раскрытие единственной «заповеди», сохраняя намеренное различие чисел в еврейском тексте. «В которую вы вступаете» точнее обозначает направленное движение в землю, чем «куда переходите», и не меняет смысла. Сноски сохранены вместе с их якорями.
  reviewer_model: gpt-5.6-terra
