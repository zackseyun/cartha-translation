  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: ru
  text: 'Вот заповедь: установления и постановления, которые Яхве[a], ваш Бог, повелел преподать вам, чтобы вы исполняли их в земле, в которую вы вступаете, чтобы овладеть ею[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Яхве» передаёт еврейское יהוה (ЙХВХ); традиционно его заменяют словом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «чтобы вступить во владение ею»; возможен также перевод: «чтобы получить её в наследие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Вот
  rationale: Вводит новый раздел и одновременно связывает его с предшествующим контекстом; русское «вот» естественно представляет последующее содержание, не добавляя временного значения.
- source_word: הַמִּצְוָה
  choice: заповедь
  rationale: Сохраняет единственное число и передаёт собирательное, заголовочное значение термина.
- source_word: הַחֻקִּים
  choice: установления
  rationale: Передаёт смысл закреплённых предписаний и сохраняет юридико-заветный регистр.
- source_word: וְהַמִּשְׁפָּטִים
  choice: и постановления
  rationale: Передаёт правовые решения и нормы; «постановления» звучит естественно в современном русском и остаётся отличным от «установлений».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Точно передаёт форму со суффиксом второго лица множественного числа.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: преподать вам
  rationale: Передаёт цель повеления и избегает добавления прямо не названного в данном стихе учителя; подразумеваемым посредником в контексте является Моисей.
- source_word: לַעֲשׂוֹת
  choice: чтобы вы исполняли их
  rationale: Целевая связь выражена естественно по-русски; местоимение соотносится с множественными «установлениями и постановлениями».
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: куда переходите
  rationale: Кратко передаёт движение к месту назначения и продолженный характер причастной формы.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы овладеть ею
  rationale: Сохраняет активный оттенок вступления во владение землёй; возможен и наследственный оттенок.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; основная передача сохраняет это имя, а традиционная замена титулом отмечена в сноске.
- issue: Соотношение единственного «заповедь» и множественных «установления и постановления»
  choice: Сохранить единственное число как обобщающий заголовок, раскрываемый множественными категориями
  alternative: 'Согласовать всё во множественном числе: «заповеди, установления и постановления»'
  rationale: Исходный текст намеренно сочетает единственное מִצְוָה с формами множественного числа; выравнивание устранило бы подлинное напряжение формулировки.
- issue: Значение ירשׁ применительно к земле
  choice: овладеть ею
  alternative: получить её в наследие
  rationale: Глагол допускает оттенки вступления во владение и наследования; в основном тексте сохранён активный оттенок перехода и занятия земли, а альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире сохраняет структуру «обобщающая заповедь — установления и постановления», не превращая единственное число источника во множественное.
