  source_fidelity: 'Текст точно передаёт еврейскую конструкцию: Яхве назван личным именем, «твоего Бога» соответствует אֱלֹהֶיךָ, תִּירָא передано как «бойся», עבד — как «служи», а בִּשְׁמוֹ תִּשָּׁבֵעַ — как «Его именем клянись». Явное местоимение וְאֹתוֹ естественно отражено русским «Ему»; добавления «только» нет.'
  naturalness: Фраза краткая, ясная и естественная для современного литературного библейского русского. Императивные формы «бойся», «служи», «клянись» уместно передают предписывающую силу еврейского имперфекта в данном наставительном контексте.
