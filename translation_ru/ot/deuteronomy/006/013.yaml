  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א וְ/אֹת֣/וֹ תַעֲבֹ֑ד וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: ru
  text: Бойся Яхве, твоего Бога[a], Ему служи[b] и Его именем клянись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговей перед Яхве, твоим Богом»; еврейский глагол означает благоговейный страх и трепет, а не только ужас.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ему поклоняйся»; еврейский глагол обычно означает «служить», а здесь включает служение, выражающее поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Форма с суффиксом 2-го лица мужского рода единственного числа естественно передаётся как «твоего Бога».
- source_word: תִּירָא
  choice: бойся
  rationale: Глагол ירא здесь выражает благоговейный страх и трепет перед Богом; «бойся» сохраняет полноту и напряжённость исходного значения.
- source_word: וְאֹתוֹ
  choice: Ему
  rationale: Явное местоименное дополнение сохранено и подчёркивает, что служение обращено именно к Яхве; слово «только» не добавлено, поскольку его нет непосредственно в стихе.
- source_word: תַעֲבֹד
  choice: служи
  rationale: עבד означает «служить» и в данном контексте включает служение Богу, не сужая смысл до исключительно обрядового поклонения.
- source_word: וּבִשְׁמוֹ
  choice: и Его именем
  rationale: Предлог ב при слове «имя» в контексте клятвы обозначает того, чьим именем клянутся.
- source_word: תִּשָּׁבֵעַ
  choice: клянись
  rationale: Нифаль глагола שׁבע означает «клясться, приносить клятву»; повелительная форма естественно передаёт предписывающую силу еврейского имперфекта.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его функция выражена синтаксисом.
theological_decisions:
- issue: Смягчать ли значение «бояться» до «почитать»
  choice: В основном тексте сохранено «бойся»
  alternative: «почитай»; «благоговей перед»
  rationale: Еврейский глагол охватывает благоговение, трепет и страх. Одно лишь «почитай» могло бы ослабить серьёзность заветного повеления.
- issue: Передавать ли עבד как «служить» или как «поклоняться»
  choice: «служи»
  alternative: «поклоняйся»
  rationale: «Служи» сохраняет широкое лексическое значение и включает верное Богу служение, не ограничивая смысл богослужебным действием.
- issue: Добавлять ли исключительность словом «только»
  choice: Не добавлять «только»
  alternative: «только Ему служи»
  rationale: Контекст требует исключительной верности Яхве, однако в самом стихе отдельного слова «только» нет; явное местоимение передано как «Ему» без усилительной вставки.
translation_notes:
  register: Современный литературный русский язык с краткими формами повелительного наклонения. Порядок слов сделан естественным для русского, при этом местоимение «Ему» сохранено для передачи явного и смыслового акцента еврейского текста. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным библейским регистром.
