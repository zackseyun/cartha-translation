  terminology: «Постановления» уместно для חֻקִּים; «бояться ГОСПОДА» сохраняет прямое значение ירא и не навязывает богословского истолкования. Капительное «ГОСПОДЬ» последовательно отмечает тетраграмматон. Английский аудиторский текст не требует иных терминологических изменений.
