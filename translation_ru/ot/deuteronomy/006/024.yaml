  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: ru
  text: И ГОСПОДЬ повелел нам исполнять все эти постановления, бояться ГОСПОДА, нашего Бога, чтобы нам всегда было хорошо и чтобы сохранять нас в живых, как и ныне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוֵּנוּ
  choice: И повелел нам
  rationale: Передаёт последовательное повествовательное וַ и значение глагола צוה без ненужного уточнения подлежащего местоимением.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: חֻקִּים обозначает установленные предписания; «постановления» естественно и достаточно формально передаёт юридико-заветный оттенок.
- source_word: לְיִרְאָה
  choice: бояться
  rationale: Сохраняет прямое значение ירא и его заветный смысл благоговейного страха, не сводя его только к почтению.
- source_word: לְטוֹב לָנוּ כָּל הַיָּמִים
  choice: чтобы нам всегда было хорошо
  rationale: Естественно передаёт целевую конструкцию и идиому «для нашего блага во все дни».
- source_word: לְחַיֹּתֵנוּ
  choice: чтобы сохранить нам жизнь
  rationale: Каузативный инфинитив от חיה здесь означает сохранение народа в живых; формулировка удерживает целевую связь.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: как и ныне
  rationale: Устойчивая и естественная передача идиомы «как в этот день», указывающей на нынешнее состояние народа.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционная русская передача тетраграмматона капительными буквами сохраняет различие с обычным титулом «Господь» и соответствует понятному литургическому регистру, не утверждая спорную реконструкцию произношения.
- issue: Связь целей повеления
  choice: «чтобы нам всегда было хорошо и чтобы сохранить нам жизнь»
  alternative: «для нашего блага во все дни, для сохранения нам жизни»
  rationale: Два еврейских оборота с לְ переданы как координированные цели, без утверждения более узкой причинной или результативной связи между ними.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для обычного читателя, при этом сохранены юридико-заветная лексика, прямое «бояться» и целевая структура оригинала.
