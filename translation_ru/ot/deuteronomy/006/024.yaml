- from: И повелел нам ГОСПОДЬ исполнять все эти постановления, бояться ГОСПОДА, нашего Бога, чтобы нам всегда было хорошо и чтобы сохранить нам жизнь, как и ныне.
  to: И ГОСПОДЬ повелел нам исполнять все эти постановления, бояться ГОСПОДА, нашего Бога, чтобы нам всегда было хорошо и чтобы сохранять нас в живых, как и ныне.
