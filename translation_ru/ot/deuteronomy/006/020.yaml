  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: ru
  text: 'Когда впоследствии[a] твой сын спросит тебя: «Что это за[b] свидетельства, постановления и законы, которые заповедал вам Яхве, наш Бог?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «завтра»; здесь это слово означает будущее, более позднее время.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Что означают свидетельства, постановления и законы…?» Еврейский текст буквально спрашивает: «Что [такое] свидетельства…?», не уточняя, идёт ли речь об их сущности или значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: Частица вводит ожидаемую в будущем ситуацию в наставлении; «когда» здесь естественнее условного «если».
- source_word: יִשְׁאָלְךָ
  choice: спросит тебя
  rationale: Передаёт обычное значение глагола שאל и сохраняет обращение во втором лице единственного числа.
- source_word: בִנְךָ
  choice: твой сын
  rationale: Еврейское существительное имеет мужской род и стоит в единственном числе; перевод не нейтрализует это обозначение.
- source_word: מָחָר
  choice: впоследствии
  rationale: Буквально слово означает «завтра», но здесь идиоматически указывает на более позднее время вообще.
- source_word: לֵאמֹר
  choice: 'спросит тебя:'
  rationale: Инфинитив вводит содержание вопроса. В современном русском его функция естественно передаётся двоеточием без тяжеловесного «говоря».
- source_word: מָה
  choice: Что это за
  rationale: Так вопрос о названных установлениях звучит естественно по-русски, не добавляя однозначного толкования «что они означают».
- source_word: הָעֵדֹת
  choice: свидетельства
  rationale: Сохраняет особый заветный оттенок термина и отличает его от двух следующих правовых категорий.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Передаёт חֻקִּים как установленные предписания и сохраняет различие внутри трёхчленной формулы.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: Передаёт правовой смысл מִשְׁפָּטִים понятным современным словом; более буквальное «суды» в данном перечислении могло бы быть понято как судебные учреждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Прямо сохраняет форму первого лица множественного числа и выраженную ею принадлежность.
- source_word: צִוָּה ... אֶתְכֶם
  choice: заповедал вам
  rationale: «Заповедал» соответствует контексту Божьих повелений, а «вам» сохраняет множественное число еврейского дополнения, противопоставленное предшествующему «тебя».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Родственное обозначение בִנְךָ
  choice: твой сын
  alternative: твой ребёнок
  rationale: Исходное слово прямо обозначает сына в мужском роде и единственном числе.
- issue: Число адресатов в вопросе сына
  choice: спросит тебя … заповедал вам
  alternative: спросит тебя … заповедал тебе
  rationale: Еврейский текст намеренно переходит от единственного числа в יִשְׁאָלְךָ к множественному в אֶתְכֶם; перевод сохраняет эту грамматическую напряжённость и не унифицирует адресата.
translation_notes:
  register: Современный литературный русский с достоинством библейского наставления. Двоеточие естественно передаёт функцию לֵאמֹר; различие «тебя» и «вам» сохранено. Юридическая триада переведена различными, общепонятными терминами без конфессионально обусловленного уточнения.
