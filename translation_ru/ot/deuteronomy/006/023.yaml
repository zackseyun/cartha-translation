  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: ru
  text: И он вывел нас оттуда, чтобы ввести нас и дать нам землю, которую он клятвенно обещал нашим отцам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашим предкам». Буквально: «нашим отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתָנוּ הוֹצִיא
  choice: И он вывел нас
  rationale: Сохраняет союз, вынесенный объект и исходный образ исхода; по-русски объект естественно включён в глагольную конструкцию.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Прямой и естественный эквивалент локативного наречия.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Ясно передаёт целевое значение конструкции.
- source_word: הָבִיא אֹתָנוּ
  choice: ввести нас
  rationale: Передаёт каузативное значение «дать войти» и сохраняет смысловой контраст «вывел — ввести» без преждевременного добавления названия места назначения.
- source_word: לָתֵת לָנוּ
  choice: дать нам
  rationale: Прямо и естественно передаёт инфинитив цели или результата.
- source_word: אֶת־הָאָרֶץ
  choice: землю
  rationale: Сохраняет обычное для Второзакония обозначение обещанной земли и его заветный оттенок.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: которую он клятвенно обещал
  rationale: Естественно по-русски воспроизводит эллиптическую еврейскую конструкцию и сохраняет существенное указание на клятву, не сводя её к простому обещанию.
- source_word: לַאֲבֹתֵינוּ
  choice: нашим отцам
  rationale: Передаёт явную мужскую форму исходного текста и его связь с праотцами Израиля; более широкая лексическая возможность отмечена в сноске.
theological_decisions:
- issue: Клятвенный характер обещания в נִשְׁבַּע
  choice: клятвенно обещал
  alternative: обещал
  rationale: Выбранная формулировка сохраняет не только содержание обещания, но и его подтверждение клятвой.
- issue: Заветное обозначение לַאֲבֹתֵינוּ
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Более буквальный вариант сохраняет мужскую форму и вероятную отсылку к праотцам, тогда как более широкое понимание остаётся доступным в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным синтаксисом. Контраст «вывел — ввести» сохранён; эллиптическая формула клятвы передана естественно, без утраты её заветного веса. Местоимение о Боге написано со строчной буквы в соответствии с обычной современной редакционной практикой и без добавления отсутствующей в еврейском тексте типографской маркировки почтительности.
