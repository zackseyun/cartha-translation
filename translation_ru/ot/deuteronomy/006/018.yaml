    issue: «Справедливо» для הַיָּשָׁר
    rationale: Русское «справедливо» преимущественно связано с честностью и справедливостью, тогда как יָשָׁר в данной этической паре означает то, что правильно, прямодушно или право. «Правильно» сохраняет более широкий смысл без доктринального сужения.
  - severity: low
    issue: Указательное «той»
    rationale: Определённость существительного в еврейском тексте не требует русского усилительного указательного местоимения. «Доброй землёй» достаточно; «той» может создавать ненужное противопоставительное или подчеркнуто-указательное значение.
  - severity: low
    issue: «Клятвенно обещал» вместо явного «поклялся дать»
    rationale: Нִשְׁבַּע означает «поклялся». В русском относительном придаточном безопасно восполнить эллиптически подразумеваемое «дать», прямо связывая клятву с землёй и отцами.
