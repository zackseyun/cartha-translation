base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: ru
  text: Делай то, что правильно и хорошо в глазах Яхве, чтобы тебе было хорошо и чтобы ты вошёл и овладел[a] доброй землёй, которую Яхве поклялся дать твоим отцам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унаследовал». Еврейский глагол может означать «унаследовать», «владеть» или «овладеть»; здесь речь идёт о вступлении Израиля во владение землёй, которую Яхве обещал под клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Делай
  rationale: В данном наставительном контексте форма выражает повеление; русское несовершенное повелительное передаёт постоянную обязанность.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: то, что справедливо и хорошо
  rationale: Сохраняет оба этических определения и естественно звучит по-русски; «справедливо» передаёт идею правильного и правого.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена прозрачная древнееврейская метафора оценки, а тетраграмматон передан личным именем «Яхве».
- source_word: לְמַעַן יִיטַב לָךְ
  choice: чтобы тебе было хорошо
  rationale: Передаёт целевое или результативное отношение и широкое значение благополучия, не сужая его до материального преуспевания.
- source_word: וּבָאתָ
  choice: и чтобы ты вошёл
  rationale: Передаёт вступление Израиля в землю и синтаксически связывает действие с целью предыдущего повеления.
- source_word: וְיָרַשְׁתָּ
  choice: и овладел
  rationale: В контексте вхождения в обещанную землю глагол означает вступить во владение; возможное значение «унаследовать» отмечено в сноске.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: той доброй землёй
  rationale: Буквально сохраняет положительную оценку земли; указательное «той» естественно вводит последующее определительное придаточное.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: которую Яхве клятвенно обещал твоим отцам
  rationale: Идиоматично передаёт эллиптическое древнееврейское выражение «поклялся [дать] отцам», сохраняя силу клятвы и конкретное слово «отцам».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное заветное имя, а не заменяющий его титул.
- issue: Значение לַאֲבֹתֶיךָ
  choice: твоим отцам
  alternative: твоим предкам
  rationale: Буквальный мужской термин указывает на отцов-патриархов, которым была дана клятва; более общее «предкам» ослабило бы эту конкретность.
- issue: Характер обещания земли
  choice: клятвенно обещал
  alternative: поклялся [дать]
  rationale: Русская формулировка восполняет подразумеваемое «дать», не добавляя нового содержания, и сохраняет заветно-клятвенную силу глагола נשבע.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Сохранена образность выражения «в глазах Яхве»; синтаксис слегка упорядочен для естественности русской речи.
