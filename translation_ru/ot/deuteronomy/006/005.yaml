  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: ru
  text: Люби Яхве, твоего Бога, всем сердцем, всей душой[a] и всеми силами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово נֶפֶשׁ может также означать «жизнь» или «самого себя».
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово מְאֹד буквально связано с «множеством», «изобилием» и предельной мерой; здесь оно может охватывать силу, рвение и все имеющиеся у человека возможности и средства.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Люби
  rationale: Форма qal перфекта 2-го лица мужского рода единственного числа с союзом в данном заветно-наставительном контексте выражает повеление. Русский императив естественно и ясно передаёт обязательную силу заповеди.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление имени Бога в еврейском тексте, не заменяя его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Хотя אֱלֹהִים имеет форму множественного числа, здесь слово обозначает единого Бога Израиля; суффикс 2-го лица передан притяжательным местоимением.
- source_word: בְּכָל
  choice: всем / всей / всеми
  rationale: Повторяющаяся конструкция выражает полноту и всеохватность любви; согласование по роду и числу обеспечивает естественное русское звучание при сохранении трёхкратного акцента на целостности.
- source_word: לְבָבְךָ
  choice: сердцем
  rationale: לֵבָב обозначает внутреннего человека, включая мысли и волю, а не только чувства. Традиционное русское «сердце» сохраняет эту ёмкость и не сужает значение до одного разума или эмоций.
- source_word: נַפְשְׁךָ
  choice: душой
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. «Душой» сохраняет узнаваемый и целостный смысл, а допустимые оттенки отмечены в сноске.
- source_word: מְאֹדֶךָ
  choice: силами
  rationale: Субстантивированное מְאֹד буквально связано с идеей «многого», изобилия и предельной меры и здесь охватывает всю способность, мощь и ресурсы человека. Множественное «всеми силами» является естественной русской формулой, не сводящей выражение только к физической силе.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя. «Яхве» сохраняет имя заветного Бога, не подменяя его титулом.
- issue: Антропологические термины в заповеди о любви
  choice: сердцем, душой и силами
  alternative: разумом, жизнью и всем достоянием
  rationale: Еврейские слова описывают человека целостно и частично перекрываются по смыслу, а не задают строгую систему отдельных способностей. Перевод сохраняет эту смысловую ёмкость и не навязывает современную психологическую схему.
- issue: Модальность заповеди
  choice: императив «Люби»
  alternative: «И ты будешь любить»; «ты должен любить»
  rationale: В контексте наставления форма выражает заветное требование. Прямой русский императив передаёт его естественно, не превращая заповедь ни в простое предсказание, ни в отвлечённое утверждение обязанности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской заповеди. Лаконичный императив звучит естественно и сохраняет повелительную силу. Повтор предельной полноты передан формами «всем / всей / всеми», а лексическая широта נֶפֶשׁ и מְאֹד сохранена посредством сносок.
