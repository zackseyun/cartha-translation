  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: ru
  text: чтобы ты боялся Яхве, своего Бога,[a] соблюдая все его постановления и заповеди, которые я заповедую тебе — тебе, твоему сыну и сыну твоего сына[b] — во все дни твоей жизни, и чтобы продлились твои дни.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговел перед Яхве, своим Богом». Еврейский глагол может обозначать как страх, так и благоговейный трепет и почитание.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сын твоего сына» означает внука, но буквальная форма подчёркивает последовательность поколений.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и чтобы твои дни были долгими», то есть чтобы ты долго жил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: чтобы ты боялся
  rationale: 'Сохраняет целевое значение לְמַעַן и прямое значение ירא, не сводя его только к уважению: в отношении Бога глагол охватывает страх, благоговение и трепет.'
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, своего Бога
  rationale: Передаёт тетраграмматон как личное имя «Яхве», а אֱלֹהֶיךָ — как указание на заветные отношения; возвратное «своего» естественно при русском подлежащем «ты».
- source_word: לִשְׁמֹר
  choice: соблюдая
  rationale: Деепричастие естественно выражает способ, которым проявляется страх перед Богом, и сохраняет тесную связь между благоговением и послушанием.
- source_word: חֻקֹּתָיו וּמִצְוֺתָיו
  choice: его постановления и заповеди
  rationale: 'Сохраняется различие двух заветно-правовых терминов: חֻקּוֹת — установленные предписания, מִצְווֹת — заповеди.'
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: которые я заповедую тебе
  rationale: Передаёт настоящее, разворачивающееся речевое действие причастия מְצַוֶּה и сохраняет торжественный, но понятный регистр.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: ты, твой сын и сын твоего сына
  rationale: Сохраняет явное перечисление трёх поколений и буквальный образ «сын твоего сына», не расширяя его до всех потомков.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: во все дни твоей жизни
  rationale: Близкая к форме оригинала и естественная по-русски передача продолжительности всей жизни.
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: и чтобы продлились твои дни
  rationale: Передаёт вторую целевую или результирующую конструкцию и сохраняет древнееврейский образ продления дней, не заменяя его общим пересказом «долго жил».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Значение ירא по отношению к Богу
  choice: бояться
  alternative: почитать / благоговеть
  rationale: «Бояться» сохраняет библейское напряжение между страхом, трепетом и благоговением; более мягкая передача могла бы неоправданно сузить значение.
- issue: Связь страха перед Богом с соблюдением заповедей
  choice: соблюдая
  alternative: и соблюдал
  rationale: Инфинитив לִשְׁמֹר допускает оттенок цели или способа; деепричастная конструкция передаёт послушание как проявление страха перед Богом, не превращая его в полностью отдельное действие.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис и образность оригинала по возможности сохранены, но фраза остаётся понятной обычному читателю. Строчные местоимения в отношении Бога соответствуют нейтральной современной орфографической практике.
