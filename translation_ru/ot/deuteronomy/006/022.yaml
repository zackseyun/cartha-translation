  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: ru
  text: И Яхве совершил великие и тяжкие знамения и чудеса в Египте[a], над фараоном и всем его домом, у нас на глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Египта». Еврейский предлог может обозначать место действия или того, на кого направлено действие; в данном контексте возможно и второе понимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: явил
  rationale: Буквально נתן означает «дал», однако в сочетании со «знамениями и чудесами» русское «явил» естественно передаёт совершение и наглядное обнаружение этих деяний, не сводя их лишь к абстрактному «совершил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: знамения и чудеса
  rationale: 'Устоявшаяся и ясная русская передача парного выражения: первое слово подчёркивает знаковое значение деяний, второе — их необычайность.'
- source_word: גְּדֹלִים וְרָעִים
  choice: великие и губительные
  rationale: גדלים указывает на величие и масштаб, а רעים здесь — на пагубное, бедственное воздействие казней, а не на нравственное зло.
- source_word: בְּמִצְרַיִם
  choice: в Египте
  rationale: Сохраняет наиболее прямое локативное значение предлога ב; возможность понимать Египет как объект поражения отмечена в сноске.
- source_word: בְּפַרְעֹה וּבְכָל בֵּיתוֹ
  choice: поразившие фараона и весь его дом
  rationale: В данном контексте ב обозначает затронутых губительными знамениями. Причастный оборот естественно выражает это по-русски; «дом» сохраняет ёмкость еврейского образа, охватывающего домочадцев и окружение.
- source_word: לְעֵינֵינוּ
  choice: у нас на глазах
  rationale: Современная и живая передача идиомы, означающей непосредственное свидетельство говорящих.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл וְרָעִים применительно к Божьим деяниям
  choice: губительные
  alternative: злые; страшные; бедственные
  rationale: Прилагательное описывает разрушительное воздействие знамений на Египет. «Губительные» сохраняет суровость текста, не приписывая Божьим действиям нравственного зла.
- issue: Значение предлога ב в последовательности בְּמִצְרַיִם בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: в Египте; поразившие фараона и весь его дом
  alternative: против Египта, против фараона и против всего его дома
  rationale: Еврейский предлог допускает как локативный, так и объектно-направленный оттенок. Перевод сохраняет естественное локативное прочтение первой фразы и передаёт контекстуальную направленность последующих, не скрывая альтернативы в сноске.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов. Сочетание «знамения и чудеса» сохранено как узнаваемая формула; «у нас на глазах» делает свидетельство непосредственным и естественным. Причастный оборот устраняет тяжёлое троекратное повторение предлога и ясно передаёт поражающее действие знамений.
