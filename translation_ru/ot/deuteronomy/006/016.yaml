  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: ru
  text: Не испытывайте Яхве, Бога вашего,[a] как вы испытали его в Массе.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не подвергайте Яхве, Бога вашего, испытанию».'
    reason: lexical_alternative
  - marker: b
    text: Масса — место, где израильтяне испытывали Яхве в пустыне (Исх. 17:1–7); это название связано с еврейским словом «испытание».
    reason: cross_reference
lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Стандартное отрицание, которое с формой несовершенного вида выражает запрет.
- source_word: תְנַסּוּ
  choice: испытывайте
  rationale: Форма Piel, 2-е лицо множественного числа, от נסה. «Испытывать» естественно передаёт намеренную проверку Бога и сохраняет связь с тем же глаголом далее в стихе.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель определённого прямого дополнения, не имеющий самостоятельного соответствия в русском тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Форма с суффиксом 2-го лица множественного числа; выбран естественный русский порядок слов.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Кратко и точно вводит сопоставление с прежним событием.
- source_word: נִסִּיתֶם
  choice: вы испытывали его
  rationale: Тот же глагол נסה, Piel, 2-е лицо множественного числа, теперь в перфекте. Местоимение «его» восполняет подразумеваемое в еврейском объектное дополнение и делает русскую фразу ясной.
- source_word: בַּמַּסָּה
  choice: в Массе
  rationale: Масса — название места; предлог «в» естественно передаёт местное значение еврейского בְּ. Смысловая связь названия с испытанием поясняется в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохраняется личное имя Бога без замены титулом.
- issue: Следует ли раскрывать отсылку к Исходу 17 в основном тексте
  choice: Сохранить только название «Масса»
  alternative: «в Массе, месте испытания»; «в месте испытания»
  rationale: Еврейский текст содержит географическое название без поясняющего добавления. Историческая и словесная связь раскрывается в сноске, чтобы не расширять основной текст.
- issue: Передача запрета испытывать Бога
  choice: «Не испытывайте»
  alternative: «Не подвергайте испытанию»; традиционное «не искушайте»
  rationale: «Испытывать» точнее сохраняет основное значение נסה и повтор одного корня в обеих частях стиха; «искушать» в современном русском может ошибочно означать побуждение ко греху.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной формулировкой. Повтор «испытывайте — испытывали» намеренно сохраняет лексическую связь исходного текста. Местоимение, относящееся к Богу, написано со строчной буквы согласно обычной современной издательской практике.
