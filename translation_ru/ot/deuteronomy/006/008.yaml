  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: ru
  text: Привяжи их как знак на своей руке, и пусть они будут налобными повязками на лбу, между твоими глазами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «филактериями» — небольшими футлярами с отрывками Писания, которые носят в еврейской традиции. Редкое еврейское слово может обозначать налобные повязки или украшения.'
    reason: Лексическая альтернатива и нейтральное пояснение традиционного понимания без утверждения о времени возникновения практики.
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Привяжи их
  rationale: Форма с союзом продолжает ряд наставлений и естественно передаётся русским повелительным наклонением. Местоимение «их» сохраняет ссылку на слова заповеди из предшествующего контекста.
- source_word: לְאוֹת
  choice: как знак
  rationale: Существительное אוֹת означает «знак» или «метка»; предлог לְ здесь выражает назначение. Перевод сохраняет символический смысл, не уточняя способ исполнения.
- source_word: עַל יָדֶךָ
  choice: к своей руке
  rationale: יָד в первую очередь означает «рука». Предлог «к» естественно сочетается с глаголом «привязать», не подменяя руку более толковательным вариантом «предплечье».
- source_word: וְהָיוּ
  choice: и пусть они будут
  rationale: Так передано продолжение предписания, а не простое предсказание; сохранена параллельность двух частей стиха.
- source_word: לְטֹטָפֹת
  choice: повязками
  rationale: Редкое слово обозначает предметы или украшения, носимые на лбу, но его точное значение неясно. «Повязками» передаёт конкретный образ без отождествления с более поздней формой филактериев.
- source_word: בֵּין עֵינֶיךָ
  choice: между твоими глазами
  rationale: Сохранено буквальное и образное выражение еврейского текста. Вариант «на лбу» яснее анатомически, но уже истолковывает идиому.
theological_decisions:
- issue: Следует ли разрешить спор о буквальном или образном характере предписания
  choice: Сохранить конкретную телесную образность, не определяя, является ли исполнение буквальным, символическим или сочетает оба аспекта
  alternative: Передать предписание только как метафору постоянной памяти либо прямо назвать более поздние филактерии
  rationale: Еврейский текст выражается конкретно, однако сам по себе не снимает историко-богословской неоднозначности. Перевод не должен заранее решать этот вопрос.
translation_notes:
  register: Современный литературный русский язык с ясным повелительным синтаксисом. Формулировка сохраняет конкретность и параллелизм еврейского текста; редкое слово передано доступно, а традиционный термин вынесен в примечание.
