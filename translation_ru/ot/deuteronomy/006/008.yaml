  verdict: revise
  source_fidelity: 'Основной смысл передан верно: повелительное предписание, местоимение «их», «знак», рука и расположение перед глазами сохранены. Однако «к своей руке» менее точно передаёт עַל («на»), а сочетание «повязками между твоими глазами» в современном русском звучит анатомически неясно. Уточнение «на лбу, между глазами» передаёт еврейскую идиому без решения вопроса о буквальном либо символическом исполнении.'
  naturalness: Исправленный текст сохраняет высокий, но понятный библейский регистр. «На своей руке» естественно с «привяжи», а «налобными повязками на лбу, между глазами» ясно обозначает образ редкого термина.
  terminology: '«Налобные повязки» — осторожная передача редкого טֹטָפֹת и не отождествляет его в основном тексте с филактериями. В примечании традиционный термин сохранён, но историческая формулировка смягчена: нельзя утверждать, что такие футляры лишь «стали носить» в позднейшей практике; также точное значение еврейского слова остаётся спорным.'
