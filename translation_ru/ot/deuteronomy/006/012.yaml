base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: ru
  text: Берегись, чтобы не забыть Яхве, который вывел тебя из земли Египта, из дома рабов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «из дома рабства». Буквально: «из дома рабов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Возвратная форма повеления естественно передаёт предупреждение «будь настороже» и включает усилительный личный оттенок לְךָ.
- source_word: פֶּן תִּשְׁכַּח
  choice: чтобы не забыть
  rationale: После предостерегающего повеления פֶּן вводит опасность, которой следует избежать; эта конструкция естественна в современном русском и сохраняет смысл предупреждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הוֹצִיאֲךָ
  choice: вывел тебя
  rationale: Каузативная форма глагола יצא в контексте исхода означает «вывести».
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохранено явно выраженное אֶרֶץ; форма «земля Египетская» естественна для dignified библейского русского регистра.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабов
  rationale: Конкретное множественное עֲבָדִים передано словом «рабы», а образ «дома» сохранён без замены абстрактным понятием.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Значение выражения בֵּית עֲבָדִים
  choice: дом рабов
  alternative: дом рабства
  rationale: Основной текст сохраняет конкретное значение множественного существительного «рабы» и метафору дома; более идиоматичный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Единственное число «тебя» сохранено по еврейскому тексту. Маркер сноски поставлен непосредственно после выражения, которое она поясняет.
