lexical_decisions:
- source_word: וּצְדָקָה
  choice: праведностью
  rationale: Сохраняет нравственно-судебный и заветный смысл צְדָקָה, не сужая его до одной лишь общественной справедливости.
- source_word: תִּהְיֶה לָּנוּ
  choice: это будет … для нас
  rationale: Передаёт предикативную конструкцию буквально и естественно, не вводя технического понятия «вменения», которого в тексте прямо нет.
- source_word: כִּי
  choice: если
  rationale: В данном контексте вводит условие, при котором сказанное о праведности относится к Израилю.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: будем тщательно исполнять
  rationale: Передаёт оттенок внимательного соблюдения в שׁמר и действие עשה без тяжеловесного русского сочетания «будем хранить, чтобы делать».
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: всю эту заповедь
  rationale: Сохраняет единственное число и представляет предписание как единое целое; возможен смысл «всю совокупность этого повеления».
- source_word: לִפְנֵי
  choice: пред
  rationale: Кратко и достойно передаёт жизнь и послушание в присутствии Бога; форма «пред» уместна в литературном библейском регистре.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Яхве, нашим Богом
  rationale: Передаёт личное имя יהוה транслитерацией и сохраняет заветное обозначение «наш Бог».
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: как Он повелел нам
  rationale: Естественно передаёт ранее данное и сохраняющее силу Божье повеление.
theological_decisions:
- issue: Связь послушания и праведности в заветном контексте
  choice: «это будет праведностью для нас»
  alternative: «это зачтётся нам в праведность» или «это будет справедливостью для нас»
  rationale: Еврейский текст прямо связывает исполнение заповеди с праведностью, но не определяет механизм этой связи в терминах позднейшей догматики. Формулировка сохраняет утверждение и его богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Пред» выбрано вместо разговорно-нейтрального «перед», а синтаксис остаётся ясным для широкого читателя. Местоимение «Он» написано с прописной буквы как допустимая русская издательская конвенция, не меняющая смысла исходного текста.
