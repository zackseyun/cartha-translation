  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: ru
  text: И напиши их на дверных косяках[a] своего дома и на своих воротах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «на дверных стойках». Еврейское слово обозначает боковые стойки дверного проёма.
    reason: lexical_alternative
  - marker: b
    text: Или «на столбах своих ворот» или «у своих ворот». Еврейское слово может обозначать как ворота, так и входное пространство или его конструктивные элементы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: И напиши их
  rationale: Соединительный союз וּ передаётся как «и», сохраняя последовательность повелений; форма перфекта в данном контексте имеет предписывающее значение. Местоименное дополнение «их» прямо отсылает к словам предшествующего контекста.
- source_word: עַל
  choice: на
  rationale: Предлог обозначает поверхность или место нанесения надписи; русское «на» естественно и точно передаёт пространственное значение.
- source_word: מְזוּזֹת
  choice: дверных косяках
  rationale: Существительное обозначает боковые стойки дверного проёма. «Дверные косяки» — понятное современному читателю и достаточно точное русское соответствие.
- source_word: בֵּיתֶךָ
  choice: своего дома
  rationale: «Дом» сохраняет конкретное значение בַּיִת, а возвратное притяжательное местоимение «своего» естественно в русском предложении при подлежащем «ты», выраженном формой глагола.
- source_word: וּבִשְׁעָרֶיךָ
  choice: и на своих воротах
  rationale: שַׁעַר обычно обозначает ворота или вход через них. «На своих воротах» сохраняет множественное число, притяжательное значение и параллельное указание места надписи.
