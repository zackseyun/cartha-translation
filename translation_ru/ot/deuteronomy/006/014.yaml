  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: ru
  text: Не следуйте другим богам[a] — никому из богов народов, окружающих вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Не ходите вслед за другими богами — никому из богов народов, окружающих вас».'
    reason: 'Лексическая альтернатива: сохраняет образное еврейское выражение «идти вслед за», тогда как основной текст передаёт его естественным русским глаголом «следовать».'
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: не ходите вслед за
  rationale: Сочетание отрицания с формой глагола הלך выражает запрет, а конструкция הלך אחרי буквально означает «ходить вслед за» и в данном контексте подразумевает приверженность и поклонение. Русский оборот сохраняет образность оригинала.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другими богами
  rationale: Прямое и ясное соответствие выражению «иные боги»; слово «чужеземные» добавило бы отсутствующий в прилагательном אֲחֵרִים оттенок.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: за кем-либо из богов народов
  rationale: 'Предлог מ־ понят как партитивный: речь идёт о любых богах из числа богов окружающих народов. Такая передача сохраняет значение конструкции и естественно звучит по-русски.'
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: окружающих вас
  rationale: Причастный оборот естественно передаёт относительное предложение и относится к «народам», сохраняя пространственный смысл.
theological_decisions:
- issue: Смысл запрета «ходить вслед»
  choice: Сохранён образ следования, подразумевающий религиозную верность и поклонение иным богам.
  alternative: 'Передать прямо: «не поклоняйтесь другим богам».'
  rationale: Второзаконие употребляет этот оборот в смысле религиозной приверженности, однако замена на одно лишь «поклоняться» сузила бы образ и устранила бы его заветный оттенок.
- issue: Упоминание других богов
  choice: Формулировка «другие боги» сохранена без пояснения их онтологического статуса.
  alternative: Передать как «ложные боги» или «так называемые боги».
  rationale: Оригинал запрещает следование иным объектам поклонения, но в этом стихе не добавляет определения «ложные» и не разрешает богословский вопрос формулировкой перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Основной текст сохраняет еврейский образ «ходить вслед», а партитивное מ־ передано естественным русским оборотом «за кем-либо из».
