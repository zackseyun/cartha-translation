  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: ru
  text: и дома, полные всякого добра, которых ты не наполнял, и высеченные цистерны[a], которых ты не высекал, виноградники и оливковые деревья, которых ты не сажал, — и будешь есть и насытишься[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать яму, колодец или цистерну; здесь, в сочетании со словом «высеченные», вероятнее всего имеются в виду высеченные в камне ёмкости для хранения воды.
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «и будешь есть, и будешь сыт». Эти еврейские формы продолжают последовательность того, что произойдёт после вступления Израиля в землю.'
    reason: verbal_sequence
lexical_decisions:
- source_word: בָתִּים
  choice: дома
  rationale: Прямое и естественное обозначение материальных построек; не добавляет эмоционального оттенка слова «жилища» или «домашние очаги».
- source_word: מְלֵאִים כָּל טוּב
  choice: полные всякого добра
  rationale: Передаёт как полноту, так и широкий смысл טוּב — ценные вещи и полезные припасы, а не только нравственное добро.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: которых ты не наполнял
  rationale: Сохраняет прямое относительное предложение, единственное число обращения и противопоставление полученного чужому труду адресата.
- source_word: בֹרֹת חֲצוּבִים
  choice: высеченные водосборники
  rationale: В данном контексте речь вероятнее всего о высеченных ёмкостях для хранения воды. «Водосборники» понятнее современному читателю, чем «цистерны», и точнее, чем «колодцы».
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: которых ты не высекал
  rationale: Сохраняет повтор корня חצב и образ труда по высеканию ёмкостей, хотя повтор слегка необычен по-русски.
- source_word: כְּרָמִים
  choice: виноградники
  rationale: Обозначает возделанные участки с виноградной лозой, а не отдельные лозы.
- source_word: זֵיתִים
  choice: оливковые деревья
  rationale: Ясно передаёт здесь насаждения, тогда как «оливы» может быть понято как плоды, а «оливковые рощи» добавило бы не выраженную в тексте собирательность.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: которых ты не сажал
  rationale: Естественно относится и к виноградникам, и к оливковым деревьям, сохраняя единственное число обращения.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: и будешь есть и насыщаться
  rationale: Будущее время естественно продолжает последовательность событий после вступления в землю; два глагола сохранены раздельно.
theological_decisions:
- issue: Характер обещанного изобилия
  choice: Перечислить материальные блага, получаемые Израилем без собственного труда, не добавляя в этот стих предупреждения или нравственной оценки
  alternative: Внести в перевод предостережение о забвении Бога либо намёк на незаконное присвоение имущества
  rationale: Сам стих описывает дома, запасы, водные сооружения и насаждения. Предупреждение следует далее, поэтому его не следует предварительно вносить в перевод этого стиха.
- issue: Единственное число обращения
  choice: Сохранить формы единственного числа «ты»
  alternative: Передать обращение множественным числом «вы»
  rationale: Еврейский текст обращается к Израилю как к единому заветному народу в грамматическом единственном числе; русский язык позволяет ясно сохранить эту особенность.
- issue: Временная отнесённость заключительных глаголов
  choice: Передать их русским будущим временем
  alternative: 'Использовать настоящее время: «ешь и насыщаешься»'
  rationale: Формы продолжают контекстуальную цепь будущих событий, хотя сами еврейские формы допускают более буквальное описание завершённого действия в этой последовательности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Повтор «высеченные… не высекал» намеренно сохранён как значимый повтор еврейского корня. Конечное тире оставлено, поскольку стих синтаксически ведёт к предупреждению следующего стиха.
