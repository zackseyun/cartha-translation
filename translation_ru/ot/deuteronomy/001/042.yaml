base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: ru
  text: 'И Яхве сказал мне: «Скажи им: не поднимайтесь и не вступайте в бой, потому что Меня нет среди вас; иначе вы будете разбиты перед своими врагами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, в общепринятой русской транслитерации.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: сказал мне
  rationale: Естественная русская передача обычной повествовательной формулы с указанием адресата речи.
- source_word: אֱמֹר לָהֶם
  choice: Скажи им
  rationale: Точно и естественно передаёт повелительное наклонение и косвенное дополнение.
- source_word: לֹא תַעֲלוּ
  choice: не поднимайтесь
  rationale: Сохраняет пространственно-военное значение глагола עלה — движение вверх, к месту предстоящего сражения.
- source_word: וְלֹא תִלָּחֲמוּ
  choice: и не вступайте в бой
  rationale: Передаёт значение Niphal глагола לחם в данном контексте и звучит естественно в современном литературном русском.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: потому что Меня нет среди вас
  rationale: Сохраняет причинную связь и смысл отсутствия Божьего присутствия посреди народа, не добавляя объяснения этого отсутствия.
- source_word: וְלֹא תִּנָּגְפוּ לִפְנֵי אֹיְבֵיכֶם
  choice: иначе ваши враги разобьют вас
  rationale: Контекстуально передаёт предупреждение о военном поражении. Буквальная отрицательная форма по-русски могла бы ошибочно прозвучать как обещание, что поражения не будет; образ действия перед врагами естественно выражен активной конструкцией.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Смысл заключительной конструкции וְלֹא תִּנָּגְפוּ
  choice: 'предупреждение о поражении в случае неповиновения: «иначе ваши враги разобьют вас»'
  alternative: «чтобы вы не были поражены перед вашими врагами»
  rationale: Отрицательная форма связана с предшествующим запретом и указывает на последствие, которого можно избежать, послушавшись. Контекст требует не обещания защиты при восхождении, а предупреждения о поражении при неповиновении.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формулировки просты и понятны; «вступайте в бой» уточняет военное значение без архаизации. Заглавная буква в «Меня» следует русской традиции почтительного обозначения Бога.
