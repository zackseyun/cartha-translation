review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Яхве запрещает народу идти вверх и вступать в сражение, поскольку Его нет среди них, и предупреждает о поражении. Однако «иначе ваши враги разобьют вас» несколько сужает и конкретизирует еврейское страдательное תִּנָּגְפוּ («будете поражены/разбиты»), превращая его в активное действие врагов; безопаснее сохранить пассивную форму.'
  naturalness: Фраза звучит естественно для современного литературного русского. «Не поднимайтесь и не вступайте в бой» удачно передаёт два запрета. Оборот «иначе вы будете разбиты перед своими врагами» естественен в библейско-литературном регистре и ближе к оригиналу.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Среди вас» точно отражает בְּקִרְבְּכֶם. «Вступайте в бой» уместно для נלחם. Сноска в исходном варианте неудачна, потому что называет буквальной форму «чтобы вы не были поражены», хотя такой союз не воспроизводит синтаксическое значение заключительной предупредительной конструкции.
  issues:
  - severity: medium
    issue: Активизация заключительной страдательной формы
    rationale: «Ваши враги разобьют вас» сообщает тот же общий исход, но добавляет явного деятеля и заменяет страдательное «будете поражены/разбиты». В переводе оптимальной эквивалентности пассив лучше сохранить.
  - severity: low
    issue: Неточная формулировка сноски как буквального перевода
    rationale: «Чтобы вы не были поражены» не является буквальной передачей וְלֹא תִנָּגְפוּ; союз «чтобы» добавлен интерпретационно. При ясном основном тексте отдельная сноска не требуется.
  revised_text: 'И Яхве сказал мне: «Скажи им: не поднимайтесь и не вступайте в бой, потому что Меня нет среди вас; иначе вы будете разбиты перед своими врагами».'
