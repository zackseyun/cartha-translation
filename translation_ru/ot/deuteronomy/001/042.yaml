  rationale: Сохранены содержание, причинно-предупредительная связь и современный литературный регистр. Заключительная часть приведена к страдательной форме, соответствующей еврейскому נָגַף в нифале, без излишнего уточнения деятеля. Сноска удалена, поскольку её заявленная буквальность неточна, а необходимая для понимания контекстуальная предупредительная функция уже ясно выражена словом «иначе».
