base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: ru
  text: И всё же в этом вы не верили в Господа, вашего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не доверяли Господу, вашему Богу»; возможно также: «не верили Господу, вашему Богу».'
    reason: 'Лексическая неоднозначность אמן с предлогом ב: выражение может обозначать веру в Бога, доверие Ему или признание истинности Его слов.'
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: Но и после всего этого
  rationale: Буквально сочетание означает «и/но в этом деле». В данном контексте оно указывает на всё только что рассказанное о Божьем водительстве и заботе; естественный русский оборот «после всего этого» передаёт связь с контекстом и укор, выраженный союзом ו.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: вы не доверяли
  rationale: Отрицание с причастием породы hифиль от אמן обозначает продолжавшееся в описываемой ситуации неверие или отсутствие доверия. «Не доверяли» естественно сочетается в русском языке с последующим ב и сохраняет личностный, заветный характер обвинения.
- source_word: בַּ/יהוָה
  choice: Господу
  rationale: Предлог ב при אמן обозначает того, кому верят или доверяют. Традиционная русская передача имени יהוה — «Господь»; дательный падеж обусловлен глаголом «доверять».
- source_word: אֱלֹהֵי/כֶם
  choice: вашему Богу
  rationale: Конструкция с местоименным суффиксом второго лица множественного числа непосредственно передана как «вашему Богу», сохраняя подчёркнутую заветную связь.
theological_decisions:
- issue: Значение אמן + ב по отношению к Господу
  choice: не доверяли Господу, вашему Богу
  alternative: не верили в Господа, вашего Бога; не верили Господу, вашему Богу
  rationale: Еврейская конструкция допускает смысл веры, доверия и признания истинности Божьего обещания. В контексте непослушания Израиля «не доверяли» наиболее естественно выражает отношение к Богу, не сводя обвинение лишь к отрицанию Его существования. Другие возможные оттенки сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Оборот «после всего этого» делает контекстуальную связь ясной обычному читателю; местоимение «вы» сохраняет прямой укор Моисея народу.
