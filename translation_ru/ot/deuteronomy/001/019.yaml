  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: ru
  text: И мы отправились от Хорива и прошли через всю ту великую и внушающую страх пустыню[a], которую вы видели по пути к горной области аморреев, как повелел нам Яхве, наш Бог, и дошли до Кадес-Варни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю ту великую и страшную пустыню». Еврейское слово может обозначать то, что вызывает страх, трепет или ужас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסַּע
  choice: мы отправились
  rationale: Глагол נסע в данной форме обозначает снятие с места и начало пути; «отправились» естественно передаёт этот смысл.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: прошли через всю… пустыню
  rationale: Сочетание הלך с показателем прямого дополнения описывает пересечение всей названной местности; по-русски это естественно выражается оборотом «прошли через».
- source_word: הַמִּדְבָּר
  choice: пустыню
  rationale: В контексте странствования מִדְבָּר означает необжитую пустынную местность; «пустыня» — ясный и традиционный русский эквивалент.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: великую и внушающую страх
  rationale: גָּדוֹל передано как «великая», а נוֹרָא — описательно, чтобы сохранить значение того, что вызывает страх, трепет или ужас, не приписывая пустыне нравственной характеристики.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: по пути к горной области аморреев
  rationale: הַר здесь имеет собирательное географическое значение «горная область», а דֶּרֶךְ указывает на путь или направление к ней.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: как повелел
  rationale: Оборот указывает на соответствие Божьему повелению; краткое «как повелел» точно и естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано русской транслитерацией, а не заменено титулом.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Кадес-Варни
  rationale: Использована укоренившаяся в русской библейской традиции форма географического названия, остающаяся понятной современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон как личное Божье имя. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Смысл прилагательного נוֹרָא применительно к пустыне
  choice: внушающая страх
  alternative: страшная; ужасная; внушающая трепет
  rationale: Выбранная формулировка сохраняет диапазон значения — вызывающая страх, трепет или ужас — и не сужает его до одной эмоциональной окраски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность еврейского повествования, но остаётся естественным для русского читателя; подлинная многозначность נוֹרָא отмечена сноской.
