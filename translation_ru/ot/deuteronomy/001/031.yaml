  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: ru
  text: и в пустыне[a], где ты видел, что Яхве, твой Бог, нёс тебя, как человек несёт своего сына[b], на всём пути, которым вы шли, пока не пришли на это место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в безлюдной местности».'
    reason: Лексема מִדְבָּר может обозначать не только песчаную пустыню, но и необжитую степную или пустынную местность.
  - marker: b
    text: Еврейский текст говорит «человек» и «его сын», а не «отец» и «ребёнок».
    reason: Поясняет сохранение мужского образа и отсутствие в исходном тексте более конкретного слова «отец».
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: и в пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «в пустыне» — естественный и устойчивый русский эквивалент в повествовании об исходе.
- source_word: אֲשֶׁר רָאִיתָ
  choice: где ты видел, как
  rationale: Повтор אֲשֶׁר допускает несколько способов синтаксической связи. Русское «где ты видел, как» естественно связывает личное свидетельство Израиля с последующим описанием Божьей заботы.
- source_word: נְשָׂאֲךָ
  choice: нёс тебя
  rationale: נשא здесь означает «нести»; форма «нёс» передаёт продолжавшуюся в пути заботу и поддерживает последующее сравнение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохранено обращение во втором лице единственного числа и заветное обозначение Бога Израиля.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: как человек несёт своего сына
  rationale: Сохранены прямо выраженные в еврейском тексте мужские образы אִישׁ («человек, мужчина») и בְּנוֹ («его сын»), без усиления до «отец» и без нейтрализации до «ребёнок».
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: на всём пути
  rationale: Кратко и естественно передаёт протяжённость заботы на протяжении всего странствия.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: которым вы шли
  rationale: הלך передано обычным русским «шли»; множественное число сохранено, несмотря на предшествующее обращение в единственном числе.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: пока не пришли на это место
  rationale: Передаёт временной предел пути и указание на нынешнее местонахождение слушателей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» сохраняет его как имя и отражает наиболее принятую научную реконструкцию произношения.
- issue: Мужской семейный образ в сравнении
  choice: как человек несёт своего сына
  alternative: как отец несёт ребёнка; как несут ребёнка
  rationale: Еврейский текст прямо употребляет אִישׁ и בְּנוֹ. Перевод сохраняет мужской образ, не превращая «человека» в более конкретное «отца».
- issue: Смена числа во втором лице
  choice: ты видел… твой Бог… тебя; вы шли… пришли
  alternative: последовательное единственное или множественное число
  rationale: Исходный текст переходит от единственного числа к множественному. Эта особенность обращения к Израилю сохранена, а не сглажена.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис оставлен как продолжение предыдущей мысли, поскольку стих начинается союзом «и». Смена единственного числа на множественное сохранена по еврейскому тексту.
