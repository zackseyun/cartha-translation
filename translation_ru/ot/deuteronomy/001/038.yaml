base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: ru
  text: Иисус, сын Навина, стоящий перед тобой, — он войдёт туда. Укрепи его, потому что он даст Израилю эту землю в наследие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он введёт Израиль во владение этой землёй»; возможно также: «он распределит её между израильтянами».'
    reason: Лексема נחל в каузативной форме допускает оттенки передачи в наследственное владение, введения во владение и распределения земли.
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Иисус, сын Навина
  rationale: Использована устоявшаяся русская форма библейского имени; патроним передан естественной конструкцией «сын Навина».
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: стоящий перед тобой
  rationale: Сохраняет буквальный образ стояния перед Моисеем и не сужает его до толкования «служащий тебе».
- source_word: הוּא יָבֹא שָׁמָּה
  choice: он войдёт туда
  rationale: Глагол בוא и направительное שָׁמָּה в контексте обозначают вхождение в упомянутую землю.
- source_word: אֹתוֹ חַזֵּק
  choice: Укрепи его
  rationale: 'Передаёт широкий смысл повелительной формы חזק: придать силы, поддержать и ободрить.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного Моисею повеления.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: он введёт Израиль во владение этой землёй
  rationale: Каузативная форма נחל означает, что Иисус обеспечит Израилю получение земли во владение. Слова «этой землёй» естественно раскрывают женский местоименный суффикс, отсылающий к земле.
theological_decisions:
- issue: Референт женского местоименного суффикса в יַנְחִלֶנָּה
  choice: Суффикс явно передан словами «этой землёй» и отнесён к обещанной Израилю земле.
  alternative: 'Оставить объект менее явным: «он введёт Израиль во владение ею».'
  rationale: Ближайший контекст говорит о вхождении в землю и обладании ею; экспликация референта устраняет неестественную для русского языка неясность, не добавляя нового богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повторение местоимения «он» сохранено ради эмфатической структуры еврейского текста; идиома «стоять перед» не заменена более узким толкованием «служить».
