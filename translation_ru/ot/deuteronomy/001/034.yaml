  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה אֶת ק֣וֹל דִּבְרֵי/כֶ֑ם וַ/יִּקְצֹ֖ף וַ/יִּשָּׁבַ֥ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: ru
  text: 'И услышал Яхве ваши слова[a], и разгневался, и поклялся, сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голос ваших слов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: В повествовательной последовательности שׁמע прямо обозначает восприятие сказанного; «выслушал» могло бы ошибочно подразумевать благосклонное внимание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: ваши слова
  rationale: Естественная русская передача смысла выражения; буквальная конструкция «голос ваших слов» нехарактерна для современного русского языка. Формальная особенность еврейского текста сохранена в сноске.
- source_word: וַיִּקְצֹף
  choice: разгневался
  rationale: Точно и с подобающей повествованию весомостью передаёт קצף; обозначает возникший гнев в последовательности событий.
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Краткая и естественная передача нифаля שׁבע; содержание клятвы следует далее.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Сохраняет формальную функцию еврейского инфинитива, вводящего прямую речь в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союзы «и» сохраняют последовательную структуру еврейского текста, не делая фразу неестественной.
