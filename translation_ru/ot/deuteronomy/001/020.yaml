lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: И я сказал вам
  rationale: Последовательная форма глагола אמר продолжает повествование; «вам» естественно передаёт форму второго лица множественного числа.
- source_word: בָּאתֶם עַד
  choice: Вы пришли в
  rationale: Перфект בוא обозначает достигнутое прибытие, а עַד при глаголе движения указывает на достигнутый предел; по-русски естественно «пришли в».
- source_word: הַר הָאֱמֹרִי
  choice: горную страну амореев
  rationale: הַר здесь может обозначать не одну гору, а гористую область; коллективное אֱמֹרִי передано множественным числом «амореев».
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Яхве, наш Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а форма с суффиксом אֱלֹהֵינוּ — как «наш Бог».
- source_word: נֹתֵן לָנוּ
  choice: даёт нам
  rationale: Причастие נֹתֵן выражает совершающееся или предстоящее дарование; настоящее время «даёт» сохраняет эту аспектуальную открытость и звучит естественно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Временной оттенок נֹתֵן
  choice: даёт нам
  alternative: отдаёт нам / даст нам
  rationale: Настоящее время сохраняет напряжение между уже начавшимся дарованием земли и её предстоящим фактическим овладением, не сводя причастие только к будущему.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и торжественный без архаизмов. «Горная страна» выбрана как понятное географическое обозначение области, при этом более буквальный вариант сохранён в сноске.
