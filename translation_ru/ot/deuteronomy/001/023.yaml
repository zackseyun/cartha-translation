lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: Мне понравилось
  rationale: Еврейская конструкция выражает личное одобрение Моисея; такой перевод естественно передаёт смысл идиомы בְּעֵינַי («в моих глазах»), не утяжеляя современную русскую речь.
- source_word: הַדָּבָר
  choice: это предложение
  rationale: В контексте הַדָּבָר обозначает высказанное ранее предложение народа, а указательное «это» связывает стих с предшествующими словами.
- source_word: וָאֶקַּח
  choice: я взял
  rationale: Сохраняется обычное значение глагола לקח; в данном контексте речь идёт о выделении людей из среды народа.
- source_word: מִכֶּם
  choice: из вас
  rationale: Предлог מן указывает, что мужчины были взяты из числа собравшегося народа.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: двенадцать мужчин
  rationale: Фраза прямо обозначает двенадцать взрослых мужчин; родовое обезличивание здесь не требуется.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: по одному от каждого колена
  rationale: 'Передана распределительная конструкция: каждое колено предоставляет одного мужчину; слово «мужчине» можно не повторять, поскольку оно ясно из первой части предложения.'
