base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: ru
  text: 'Я сказал вам, но вы не послушали: вы восстали против повеления Яхве[a], дерзко поступили и поднялись в горную страну.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «против уст Яхве», то есть против того, что Яхве повелел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Я говорил вам
  rationale: Передаёт обычное значение דבר в пиэле и обращение к множеству людей. Связь с предыдущим стихом в русском естественно выражается последовательностью повествования без обязательного отдельного союза.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: но вы не послушали
  rationale: שׁמע здесь допускает оттенки слушания и послушания. «Не послушали» сохраняет оба оттенка и не устраняет их напряжение.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: вы восстали против повеления Яхве
  rationale: מרה означает бунт или неповиновение законной власти; буквальное «уста Яхве» является еврейской идиомой, обозначающей высказанное им повеление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой современной русской транслитерацией, а не заменено титулом.
- source_word: וַתָּזִדוּ
  choice: дерзко поступили
  rationale: Глагол זיד обозначает самонадеянное, дерзкое действие. Такая формулировка передаёт нравственную оценку, не сливая этот глагол со следующим.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: пошли в горную страну
  rationale: עלה выражает движение вверх, а הָהָרָה с направительным окончанием — движение в гористую область. В данном контексте речь идёт скорее о горной стране, чем об одной горе.
theological_decisions:
- issue: Передача выражения אֶת־פִּי יְהוָה
  choice: против повеления Яхве
  alternative: против уст Яхве
  rationale: Буквальный образ сохранён в примечании, а в основном тексте передан его контекстуальный смысл. Это не сужает содержание до особой конфессиональной трактовки.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Не послушали» сохраняет связь между слышанием и повиновением; «дерзко поступили» передаёт самостоятельное значение וַתָּזִדוּ. Местоимение «вы» оставлено со строчной буквы как обращение к народу во множественном числе.
