revisions:
- from: Который шёл впереди вас по пути, чтобы высмотреть[a] для вас место, где вам расположиться станом, ночью — в огне, чтобы показывать вам путь, по которому вам идти, а днём — в облаке.
  to: Который шёл впереди вас по пути, чтобы отыскать[a] для вас место для стоянки, ночью — в огне, чтобы показывать вам путь, по которому вам идти, и днём — в облаке.
  rationale: Исправлены только лексическая точность לָתוּר, естественность выражения цели стоянки и нейтральное присоединение дневного облака. Не добавлены ни образ «столпа», ни имя Господа, ни конфессиональные толкования; модальная неоднозначность еврейского имперфекта остаётся переданной оборотом «по которому вам идти».
