base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: ru
  text: Который шёл впереди вас по пути, чтобы отыскать[a] для вас место для стоянки, ночью — в огне, чтобы показывать вам путь, по которому вам идти, и днём — в облаке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разведать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: Который шёл
  rationale: Субстантивированное причастие qal продолжает описание Господа из предыдущего стиха. Относительное «Который» сохраняет синтаксическую связь с контекстом, а прошедшее время естественно для русского повествования.
- source_word: לִפְנֵיכֶם
  choice: впереди вас
  rationale: Пространственное выражение указывает на того, кто ведёт народ, идя перед ним; это естественнее современного «пред вами».
- source_word: בַּדֶּרֶךְ
  choice: по пути
  rationale: דרך здесь обозначает путь следования в пустыне; предложное сочетание «по пути» передаёт движение и звучит естественно.
- source_word: לָתוּר
  choice: высмотреть
  rationale: Глагол выражает целенаправленный поиск и осмотр подходящего места. «Высмотреть» сохраняет оттенок исследования, не добавляя обязательно военного смысла разведки.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: место, где вам расположиться станом
  rationale: Инфинитив חנה с суффиксом обозначает место для стоянки народа. «Расположиться станом» ясно передаёт походный контекст и сохраняет достоинство стиля.
- source_word: בָּאֵשׁ לַיְלָה
  choice: ночью — в огне
  rationale: Огонь представлен как видимое явление, в котором Бог вёл народ ночью. Порядок слов делает временную параллель с «днём — в облаке» прозрачной.
- source_word: לַרְאֹתְכֶם
  choice: чтобы показывать вам
  rationale: Каузативный hiphil от ראה в контексте водительства естественно передаётся глаголом «показывать».
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: путь, по которому вам идти
  rationale: 'Формулировка сохраняет открытый модальный оттенок еврейского имперфекта: речь о предназначенном маршруте, без сведения выражения исключительно к нравственной обязанности или простому будущему.'
- source_word: וּבֶעָנָן יוֹמָם
  choice: а днём — в облаке
  rationale: «Облако» — известное из контекста явление Божьего присутствия и водительства. Противительный союз «а» естественно оформляет временную параллель ночи и дня.
theological_decisions:
- issue: Подлежащее определяется предыдущим стихом как Господь
  choice: Сохранено начало зависимым относительным оборотом «Который шёл…», без повторного называния Господа.
  alternative: 'Добавить для ясности: «Господь, Который шёл…»'
  rationale: В еврейском тексте стих синтаксически продолжает упоминание Господа, Бога Израиля, в предыдущем стихе. Повтор имени внесло бы отсутствующее здесь уточнение.
- issue: Модальность выражения אֲשֶׁר תֵּלְכוּ בָהּ
  choice: «по которому вам идти»
  alternative: «по которому вы пойдёте» или «по которому вам следует идти»
  rationale: Выбранный оборот передаёт путь, указанный Богом, но не разрешает неоднозначность только в пользу предсказания будущего либо нравственного предписания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксическая зависимость от предыдущего стиха сохранена; параллель «ночью — в огне… днём — в облаке» сделана ясной без добавления образа столпа, которого в данном стихе прямо нет.
