  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все слова», «все дела» или «все вопросы». Древнееврейское דְּבָרִים может обозначать сказанные наставления, дела или вопросы, требующие исполнения либо решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: я повелел
  rationale: Глагол צוה выражает властное предписание. «Повелел» сохраняет эту силу и соответствует достоинству повествования.
- source_word: אֶתְכֶם
  choice: вам
  rationale: Суффикс второго лица мужского рода множественного числа передан русским множественным «вам».
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Естественная русская передача стандартного древнееврейского временного оборота.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: всё
  rationale: דְּבָרִים допускает значения «слова», «дела», «вопросы». В данном контексте обобщающее «всё» естественно охватывает предписания, подлежащие исполнению, не сужая значение до одних произнесённых слов.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: что вам надлежало делать
  rationale: Форма עשה в относительном обороте после «повелел» обозначает предписанные действия. «Надлежало» передаёт обязательность без усиления до категорического «вы обязаны были».
