translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Использованы традиционные русские формы библейских имён и топонимов; архаическое «обитавшего» заменено более понятным «жившего». Пунктуация и повтор «в» намеренно сохраняют неоднозначность последней географической формулы.
