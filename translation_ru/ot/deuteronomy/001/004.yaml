  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: ru
  text: после того как он поразил Сигона, царя аморреев, жившего в Есевоне, и Ога, царя Васана, жившего в Астарофе, в Едреи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «жившего в Астарофе и Едреи». В еврейском тексте перед каждым из двух названий стоит предлог «в», а точная связь между этими местами не выражена вполне ясно.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  choice: после того как он поразил
  rationale: Сочетание временного предлога с инфинитивом и суффиксом указывает на действие, предшествующее основной речи Моисея; русский оборот естественно передаёт эту временную связь. «Поразил» сохраняет силу глагола נכה, не ослабляя её до общего «победил».
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Сигона, царя аморреев
  rationale: Имя передано в принятой русской библейской форме; конструкция сохраняет прямое обозначение народа, царём которого был Сигон.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: жившего в Есевоне
  rationale: יָשַׁב здесь обозначает проживание или пребывание; причастный оборот звучит естественно в русском и ясно относится к царю.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ога, царя Васана
  rationale: Имена переданы в укоренившейся русской библейской форме; конструкция буквально и естественно выражает царскую власть над областью Васан.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: жившего в Астарофе, в Едрее
  rationale: Повтор предлога ב перед обоими топонимами сохранён в русском, чтобы не устанавливать более точную связь между местами, чем допускает сжатая еврейская конструкция.
