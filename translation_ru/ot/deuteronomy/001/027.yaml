base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: ru
  text: 'Вы роптали в своих шатрах и говорили: «Яхве ненавидит нас[a], потому и вывел нас из земли Египта, чтобы отдать нас во власть амореев[b] и истребить нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из ненависти Яхве к нам»; здесь выражение указывает на причину, которую народ приписывал исходу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отдать нас в руку аморея»; слово «аморей» употреблено собирательно, то есть об амореях как о народе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: роптали
  rationale: Глагол רגן обозначает недовольные, приглушённые жалобы. «Роптали» точно передаёт отрицательную окраску и уместно в современном литературном библейском повествовании.
- source_word: בְאָהֳלֵיכֶם
  choice: в своих шатрах
  rationale: Конкретный образ шатров сохранён; возвратное местоимение естественно соотносит их с адресатами.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: Яхве ненавидит нас
  rationale: Абстрактное выражение с предлогом ב передано как естественное по-русски причинное утверждение, не смягчающее обвинение израильтян.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: вывел нас из земли Египетской
  rationale: Сохранены исход, глагол движения и явное упоминание земли; традиционная русская форма остаётся понятной и торжественной.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: отдать во власть амореев
  rationale: Еврейская идиома «дать в руку» означает передать под чужую власть. Идиоматический русский вариант ясно выражает этот смысл.
- source_word: הָאֱמֹרִי
  choice: амореев
  rationale: Форма единственного числа имеет собирательное значение и обозначает народ, поэтому по-русски употреблено множественное число.
- source_word: לְהַשְׁמִידֵנוּ
  choice: истребить
  rationale: Порода hифиль глагола שׁמד выражает полное уничтожение; «истребить» передаёт силу слова без разговорной окраски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Обвинение в ненависти со стороны Яхве
  choice: 'Сохранить как прямое утверждение народа: «Яхве ненавидит нас»'
  alternative: Смягчить как ощущение или предположение народа
  rationale: Текст прямо цитирует обвинение израильтян и не утверждает его истинность от лица повествователя; перевод сохраняет эту напряжённость без поясняющего смягчения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Роптали», «шатры» и «истребить» понятны современному читателю и сохраняют достоинство и силу исходного высказывания.
