base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: ru
  text: Тогда амореи[a], жившие в той горной области[b], вышли вам навстречу, погнались за вами, как пчёлы преследуют, и разбили вас в Сеире до самой Хормы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «аморей»; в еврейском стоит единственное число с собирательным значением, что видно из последующих глаголов во множественном числе.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на той горе». Еврейское слово может обозначать как гору, так и горную область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышли
  rationale: Глагол יצא в повествовании означает выход; русское «вышли» естественно передаёт выступление жителей горной области навстречу Израилю.
- source_word: הָאֱמֹרִי
  choice: амореи
  rationale: Форма единственного числа употреблена собирательно, что подтверждается последующими глаголами во множественном числе; по-русски естественно множественное число.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: жившие в той горной области
  rationale: Причастие обозначает постоянное проживание, а הַר здесь естественно понимать как горную местность или область, а не одну отдельную гору.
- source_word: לִקְרַאתְכֶם
  choice: вам навстречу
  rationale: Сохраняется основное значение выражения «навстречу вам»; в контексте враждебный характер встречи очевиден без добавления толкования.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: погнались за вами
  rationale: Передаёт военное преследование естественным современным русским выражением.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: как пчёлы
  rationale: Кратко и образно передаёт сравнение с тем, как пчёлы преследуют потревожившего их человека; глагол в русском можно не повторять.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: разбили вас
  rationale: Hiphil глагола כתת выражает сокрушительное поражение; «разбили» точно и естественно в военном контексте, не уточняя без основания масштаба потерь.
- source_word: בְּשֵׂעִיר
  choice: в Сеире
  rationale: Предлог ב передан в своём прямом локативном значении.
- source_word: עַד חָרְמָה
  choice: преследуя до Хормы
  rationale: עַד обозначает географический предел. Добавление «преследуя» естественно связывает предел с погоней и устраняет русскую двусмысленность сочетания «разбили до Хормы».
