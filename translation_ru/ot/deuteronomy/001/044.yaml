- from: Тогда амореи[a], жившие в той горной области[b], вышли вам навстречу, погнались за вами, как пчёлы, и разбили вас в Сеире, преследуя до Хормы.
  to: Тогда амореи[a], жившие в той горной области[b], вышли вам навстречу, погнались за вами, как пчёлы преследуют, и разбили вас в Сеире до самой Хормы.
  rationale: Убран деепричастный оборот, который ограничивал значение географического предела только преследованием. «До самой Хормы» сохраняет предел, обозначенный עַד, не предрешая его точную синтаксическую сферу. В сравнении восстановлен подразумеваемый в черновике, но выраженный в оригинале глагол.
