review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: собирательное «амореи», их проживание в горной области, выход навстречу, преследование, сравнение с пчёлами и географический предел сохранены. Однако деепричастное «преследуя до Хормы» добавляет синтаксическую связь, которой в еврейском тексте нет: «до Хормы» непосредственно следует за сообщением о поражении и может характеризовать весь ход нападения/поражения.'
  naturalness: Текст в целом естественен для современного литературного русского. Явное повторение глагола в сравнении («как пчёлы преследуют») делает образ грамматически завершённым и ясным, не утяжеляя фразу.
  terminology: «Амореи», «Сеир» и «Хорма» переданы корректно. Сноски уместно отражают собирательное единственное число и диапазон значения הַר.
  issues:
  - severity: medium
    issue: «преследуя до Хормы»
    rationale: Деепричастный оборот интерпретирует «до Хормы» исключительно как предел преследования. В оригинале обстоятельство стоит после «они разбили/поражали вас» и не требует такого синтаксического сужения. Следует сохранить более нейтральную привязку.
  - severity: low
    issue: Неполное выражение сравнения «как пчёлы»
    rationale: Русское сравнение возможно, но исходный текст содержит глагол «делают». Повтор «преследуют» даёт ясную и естественную передачу без смыслового расширения.
