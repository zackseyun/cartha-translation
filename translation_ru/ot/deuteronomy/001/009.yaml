  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: ru
  text: 'И сказал я вам в то время: «Не могу я один нести вас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: И сказал я вам
  rationale: Сохраняет повествовательную связку и обращение Моисея к народу; порядок слов естественен для торжественного русского повествования.
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Прямо передаёт временное указание без излишнего уточнения.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В данном контексте еврейская формула вводит содержание высказывания; по-русски её естественно выразить пунктуационно, а не тяжеловесным «говоря».
- source_word: לֹא אוּכַל
  choice: Не могу я
  rationale: Передаёт неспособность в настоящем времени; инверсия сохраняет смысловое ударение и достоинство речи.
- source_word: לְבַדִּי
  choice: один
  rationale: Естественный русский эквивалент со значением «сам, без помощи других».
- source_word: שְׂאֵת אֶתְכֶם
  choice: нести вас
  rationale: Сохраняет конкретную метафору נשׂא и её возможную смысловую широту — нести бремя руководства и ответственности за народ.
theological_decisions:
- issue: Значение метафоры «нести вас»
  choice: Сохранена буквальная метафора
  alternative: «справляться с вами» / «нести ответственность за вас»
  rationale: Исходный текст допускает широкий смысл; конкретизация преждевременно сняла бы образность и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским порядком слов. Формула לֵאמֹר передана нормативным русским оформлением прямой речи.
