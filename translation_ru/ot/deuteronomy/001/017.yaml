base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: ru
  text: 'Не будьте пристрастны на суде[a]: выслушивайте и малого, и великого одинаково. Не страшитесь никакого человека, потому что суд принадлежит Богу. А дело, которое окажется для вас слишком трудным, представьте мне, и я выслушаю его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не узнавайте лиц на суде» — еврейская идиома, означающая не оказывать предпочтения и не проявлять пристрастия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: будьте пристрастны
  rationale: В отрицательной конструкции «не будьте пристрастны» естественно передаёт судебную идиому «узнавать лица», то есть оказывать предпочтение одной из сторон.
- source_word: בַּמִּשְׁפָּט
  choice: на суде
  rationale: Контекст говорит о разбирательстве и вынесении судебного решения; «на суде» ясно и естественно передаёт эту сферу.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: и малого, и великого одинаково
  rationale: Сохраняется образная социальная пара исходного текста без уточнения, идёт ли речь о положении, влиянии или достатке.
- source_word: תִּשְׁמָעוּן
  choice: выслушивайте
  rationale: В судебном контексте глагол означает дать сторонам или делу надлежащее слушание; русский вид передаёт общее предписание.
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  choice: не страшитесь никакого человека
  rationale: Передаёт буквальный и контекстуальный смысл — не отступать из страха перед человеком; более узкое «не поддавайтесь запугиванию» могло бы неоправданно предположить активные угрозы.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: потому что суд принадлежит Богу
  rationale: Сохраняет прямое утверждение о принадлежности суда Богу и не уточняет сверх текста, означает ли это источник закона, власть суда или ответственность судей.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: дело, которое окажется для вас слишком трудным
  rationale: דָּבָר в данном правовом контексте — рассматриваемое дело, а конструкция с יִקְשֶׁה указывает на трудность его разрешения судьями.
- source_word: תַּקְרִבוּן אֵלַי
  choice: представьте мне
  rationale: Естественная русская юридическая формулировка для каузативного «поднесите/доставьте ко мне».
- source_word: וּשְׁמַעְתִּיו
  choice: и я выслушаю его
  rationale: Местоименный суффикс отнесён к «делу»; сохранён глагол слушания, тогда как «решу его» было бы более истолковывающим переводом.
theological_decisions:
- issue: Основание судебной власти в выражении «суд принадлежит Богу»
  choice: Сохранено прямое утверждение о принадлежности суда Богу.
  alternative: «Бог будет судить судей» или «суд должен основываться на Божьем законе».
  rationale: Обе альтернативы возможны как богословские следствия, но не выражены в данной фразе непосредственно; перевод сохраняет её ёмкость и напряжение.
- issue: Обобщающее אִישׁ
  choice: «никакого человека»
  alternative: «никого» или «никакого мужчины»
  rationale: В контексте אִישׁ имеет обобщающее значение. «Человек» сохраняет личностный референт и грамматически мужскую форму, не ограничивая запрет только взрослыми мужчинами.
translation_notes:
  register: Современный литературный русский с достоинством законодательной речи. Повеления переданы формами, естественными для общего наставления; повтор корня «слушать» сохранён как смысловая связь между работой судей и Моисея.
