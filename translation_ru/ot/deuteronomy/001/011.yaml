base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: ru
  text: Пусть Яхве, Бог ваших отцов, сделает вас в тысячу раз многочисленнее, чем вы теперь, и благословит вас, как Он сказал вам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Он обещал вам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Бог ваших отцов
  rationale: Буквально и естественно сохраняет заветную связь с праотцами Израиля.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: умножит вас ещё в тысячу раз
  rationale: Естественно по-русски выражает пожелание многократного численного увеличения; «ещё» передаёт образ прибавления в יֹסֵף, а כָּכֶם соотносит множитель с нынешней численностью народа.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: и благословит вас
  rationale: Продолжает выраженное первой глагольной формой пожелание; повторять «пусть» по-русски необязательно.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: как Он говорил вам
  rationale: Сохраняет более широкое значение глагола דבר — «говорить», не сужая его без необходимости до «обещать».
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Значение אֲבֹתֵיכֶם
  choice: ваших отцов
  alternative: ваших предков
  rationale: Мужская форма исходного текста сохранена; в данном контексте это устоявшееся заветно-историческое обозначение праотцов.
- issue: Характер слов Бога в כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: как Он говорил вам
  alternative: как Он обещал вам
  rationale: Контекст позволяет понимать сказанное как обещание, однако сам глагол шире; основной текст сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой благословения. Заглавное «Он» употреблено как уважительное обозначение Бога; пунктуационный знак сноски поставлен сразу после соответствующего выражения.
