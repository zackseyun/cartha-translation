  source_fidelity: 'Начальная часть верно передаёт благословительное пожелание, имя Яхве и выражение «Бог ваших отцов». Однако «умножит вас ещё в тысячу раз» неточно оформляет сравнительную конструкцию כָּכֶם ... אֶלֶף פְּעָמִים: «ещё» добавляет невыраженный смысл, а отсутствие явного сопоставления с нынешней численностью делает фразу двусмысленной. «Говорил вам» имеет несовершенный оттенок, тогда как דִּבֶּר — совершенная форма; «сказал вам» точнее и сохраняет широту глагола без интерпретации как обещания.'
