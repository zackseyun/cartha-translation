  terminology: «Яхве» корректно передаёт тетраграмматон; «Бог ваших отцов» сохраняет лексику и историко-заветный регистр исходного текста. «Благословит вас» уместно. Заглавное «Он» допустимо в выбранном уважительном регистре.
