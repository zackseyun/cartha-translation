base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: ru
  text: Яхве, ваш Бог, Который идёт впереди вас, Сам будет сражаться за вас — так же, как Он действовал ради вас[a] в Египте у вас на глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал с вами». В контексте речь идёт о том, что Яхве совершил ради Израиля в Египте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Несмотря на форму множественного числа, сочетание с יְהוָה и суффиксом второго лица множественного числа обозначает единственного Бога Израиля.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: Который идёт впереди вас
  rationale: Причастная конструкция передаёт продолжающееся действие и образ Божьего предводительства; настоящее время естественно звучит по-русски.
- source_word: הוּא יִלָּחֵם לָכֶם
  choice: Сам будет сражаться за вас
  rationale: Самостоятельное местоимение הוּא имеет эмфатическую силу, переданную словом «Сам»; לָכֶם указывает, что Бог сражается в интересах Израиля.
- source_word: כְּכֹל אֲשֶׁר
  choice: так же, как
  rationale: Оборот вводит сопоставление с прежними действиями Бога и естественно передаётся современным русским сравнительным оборотом.
- source_word: עָשָׂה אִתְּכֶם
  choice: действовал ради вас
  rationale: Буквальное «сделал с вами» по-русски двусмысленно и неестественно; контекст указывает на совершённое Богом в Египте в пользу Израиля. Необычная форма оригинала сохранена в сноске.
- source_word: בְּמִצְרַיִם
  choice: в Египте
  rationale: Прямое и естественное обозначение места действия.
- source_word: לְעֵינֵיכֶם
  choice: у вас на глазах
  rationale: Русский идиоматический эквивалент подчёркивает, что израильтяне лично видели Божьи действия.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Форма «Яхве» сохраняет его как имя и отражает наиболее широко принятую научную реконструкцию произношения, не подменяя имя титулом.
- issue: Характер Божьего участия в битве
  choice: Сам будет сражаться за вас
  alternative: Он будет сражаться за вас
  rationale: Эмфатическое הוּא подчёркивает, что сражаться будет лично Яхве; «Сам» сохраняет этот акцент без добавления иной богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавная буква в «Который» и «Сам» поддерживает традиционный русский религиозный регистр; синтаксис остаётся ясным для обычного читателя.
