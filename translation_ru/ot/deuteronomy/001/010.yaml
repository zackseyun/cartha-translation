  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: ru
  text: Яхве, ваш Бог, умножил вас, и вот, сегодня вас так же много, как звёзд на небе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «как звёзды небесные по множеству».'
    reason: Буквальная форма поясняет еврейское выражение לָרֹב, которое в основном тексте передано естественным русским оборотом.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» принята как современная научно обоснованная транслитерация.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: В данном контексте אֱלֹהִים обозначает единого Бога Израиля, а суффикс 2-го лица множественного числа передан словом «ваш».
- source_word: הִרְבָּה אֶתְכֶם
  choice: умножил вас
  rationale: Каузативная форма глагола רבה означает «сделал многочисленными, умножил»; выбранная формулировка сохраняет образ и связь с обетованием о многочисленном потомстве.
- source_word: וְהִנְכֶם
  choice: и вот
  rationale: Сохраняет указательную и риторическую силу частицы הִנֵּה, привлекающей внимание к нынешнему состоянию народа.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественно и точно передаёт временное значение еврейского слова.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: вас так же много, как звёзд на небе
  rationale: Идиоматично передаёт сравнение и значение многочисленности; «звёзды на небе» звучит естественнее в современном русском, чем буквальное «звёзды небес».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблено личное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом, не навязывая конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «умножил вас» сохранён ради образности исходного текста, тогда как сравнение со звёздами передано естественно для современного читателя.
