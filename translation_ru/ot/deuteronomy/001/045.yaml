  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: ru
  text: Тогда вы вернулись и плакали пред Яхве, но Яхве не прислушался к вашему голосу и не внял вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «не услышал вашего голоса и не приклонил к вам слуха». В еврейском тексте употреблены два близких по смыслу глагола слушания; вместе они подчёркивают, что Яхве не откликнулся на плач народа.'
    reason: Лексическая альтернатива и пояснение еврейского параллелизма.
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Тогда вы вернулись
  rationale: Глагол שׁוּב означает «возвращаться, поворачивать назад»; здесь речь идёт о возвращении после неудачного выступления. «Тогда» естественно передаёт последовательность повествования.
- source_word: וַתִּבְכּוּ
  choice: и плакали
  rationale: בכה означает «плакать, рыдать». Нейтральное «плакали» сохраняет торжественный тон, не добавляя отсутствующей в тексте степени переживания.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי буквально обозначает нахождение «перед, в присутствии». Форма «пред Яхве» кратка, понятна и уместна в возвышенном повествовательном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом; это сохраняет форму исходного текста.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: но Яхве не прислушался к вашему голосу
  rationale: שׁמע с בְּקוֹל может означать не только физически услышать, но и выслушать, послушаться или откликнуться. «Не прислушался» естественно передаёт отсутствие благосклонного отклика, не предполагая, будто Яхве физически не мог слышать.
- source_word: בְּקֹלְכֶם
  choice: к вашему голосу
  rationale: Существительное קוֹל буквально означает «голос». Буквальный образ сохранён вместо более истолковывающего «к вашим словам».
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: и не внял вам
  rationale: האזין означает «обратить слух, внимательно слушать». «Не внял» передаёт второй, усиливающий член параллелизма и избегает неестественного дословного повтора.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя, не подменяя его титулом и не вводя конфессионально закреплённый вариант произношения.
- issue: Смысл того, что Яхве «не услышал»
  choice: не прислушался… и не внял
  alternative: не услышал… и не приклонил слуха
  rationale: Контекст говорит не об отсутствии способности слышать, а об отказе принять плач народа и ответить на него. При этом синонимический параллелизм двух еврейских глаголов сохранён, а буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Пред Яхве» и «не внял» поддерживают достоинство стиля, оставаясь понятными; синтаксис и двойной глагольный параллелизм исходного текста сохранены.
