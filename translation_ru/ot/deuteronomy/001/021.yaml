base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: ru
  text: 'Смотри: Яхве, твой Бог, положил перед тобой землю. Поднимись и овладей ею, как сказал тебе Яхве, Бог твоих отцов[a]. Не бойся и не падай духом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог твоих предков». В еврейском тексте буквально: «Бог твоих отцов» — устойчивая заветная формула, сохранённая в основном тексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Смотри
  rationale: Императив служит призывом обратить внимание. «Смотри» передаёт прямую силу обращения естественным современным языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Конструкция с суффиксом второго лица мужского рода единственного числа; сохраняется обращение к Израилю как к единому адресату.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: отдал тебе
  rationale: Идиома описывает землю как уже предоставленную Богом Израилю для вступления во владение. Такое выражение естественно по-русски и сохраняет совершённый вид еврейского глагола.
- source_word: הָאָרֶץ
  choice: эту землю
  rationale: В контексте речь идёт о конкретной земле, обещанной Израилю; указательное местоимение естественно передаёт её определённость.
- source_word: עֲלֵה
  choice: Поднимайся
  rationale: Сохраняет пространственный образ движения вверх, к нагорьям земли, и одновременно выражает призыв выступить в путь.
- source_word: רֵשׁ
  choice: овладей ею
  rationale: Императив ירשׁ в контексте вступления в обещанную землю обозначает активное принятие её во владение.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как сказал
  rationale: Передаёт буквальное значение глагола «говорить», не заменяя его более истолковывающим «обещал».
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Бог твоих отцов
  rationale: Сохраняет мужской род и устойчивую заветную формулу исходного текста; более широкая формулировка вынесена в примечание.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Прямой и естественный запрет, точно передающий ירא.
- source_word: וְאַל תֵּחָת
  choice: и не падай духом
  rationale: Передаёт состояние внутренней сломленности и растерянности, выраженное חתת, не сливая его полностью со страхом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Заветная формула אֱלֹהֵי אֲבֹתֶיךָ
  choice: Бог твоих отцов
  alternative: Бог твоих предков
  rationale: Основной текст сохраняет явно мужское множественное число и традиционную библейскую формулу, а допустимый более общий эквивалент отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранено обращение к Израилю во втором лице единственного числа; синтаксис сделан ясным и естественным без устранения заветной формулы.
