base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: ru
  text: Вот слова, которые Моисей сказал всему Израилю за Иорданом[a], в пустыне, в Араве[b], напротив Суфа[c], между Фараном, Тофелом, Лаваном, Хацеротом и Ди-Захавом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по ту сторону Иордана». Еврейское выражение допускает перевод с разных географических точек зрения.'
    reason: lexical_alternative
  - marker: b
    text: Арава — географическое название рифтовой долины и равнинной области; возможен перевод «на равнине».
    reason: cultural_note
  - marker: c
    text: 'Еврейский текст: «Суф». Возможно, это название местности; некоторые связывают его с Тростниковым морем, однако слова «море» здесь нет.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Вот слова
  rationale: Естественная для современного русского языка формула, вводящая последующую речь; сохраняет указательную силу אֵלֶּה и значение דְּבָרִים как произнесённых слов.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה אֶל כָּל יִשְׂרָאֵל
  choice: которые Моисей произнёс перед всем Израилем
  rationale: Глагол «произнёс» передаёт торжественный и официальный характер речи. Предлог אֶל буквально указывает направленность речи к Израилю; по-русски в данном контексте естественно «перед всем Израилем», то есть перед собранием народа.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Краткое традиционное географическое выражение, сохраняющее зависимость значения от точки наблюдения; неоднозначность пояснена в сноске.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: В русском библейском и общеупотребительном языке «пустыня» может обозначать безлюдную засушливую местность и не обязательно песчаную пустыню.
- source_word: בָּעֲרָבָה
  choice: в Араве
  rationale: Передано как географическое название области Иорданской рифтовой долины, а не обобщённо как «на равнине».
- source_word: מוֹל סוּף
  choice: напротив Суфа
  rationale: מוֹל означает «напротив, перед»; סוּף сохранено как возможное название местности, поскольку слово «море» в еврейском тексте отсутствует.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: между Фараном, Тофелом, Лаваном, Хацеротом и Ди-Захавом
  rationale: Перечень топонимов оформлен по нормам современного русского языка без искусственного повторения союза «и», при сохранении всех названий и синтаксической связи с «между».
- source_word: דִי זָהָב
  choice: Ди-Захав
  rationale: Сочетание передано транслитерацией как топоним, а не переведено по возможному буквальному значению его частей.
