  source_fidelity: 'Основная передача соответствует еврейскому тексту: повеление обращено к судьям, משפטный смысл שָׁמֹעַ передан через «выслушивайте дела», а צֶדֶק — через «справедливо». Однако «живущим с ним чужеземцем» синтаксически тяжеловесно и может создавать неуместное впечатление совместного проживания. Для גֵּרוֹ предпочтительнее сохранить личный суффикс в естественной русской конструкции «пришельцем, живущим у него». Союз «или» допустимо передаёт подразумеваемые альтернативные категории тяжб; он не исключает обязанности судить каждую из них справедливо.'
