source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: ru
  text: 'В то время я повелел вашим судьям: «Выслушивайте дела[a] между вашими братьями и судите справедливо[b] — между человеком и его братом или пришельцем, живущим у него[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выслушивайте споры среди ваших братьев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «судите по правде». Еврейское צֶדֶק (цеде́к) в судебном контексте включает оттенки справедливости и праведности.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чужеземцем, живущим с ним» или «поселившимся у него иноземцем». Еврейское גֵּר (гер) обозначает неуроженца страны, постоянно живущего среди израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: я повелел
  rationale: Глагол צוה выражает властное распоряжение; «повелел» точно передаёт авторитет Моисея и соответствует возвышенному, но понятному повествовательному регистру.
- source_word: שֹׁפְטֵיכֶם
  choice: вашим судьям
  rationale: Существительное обозначает назначенных лиц, разбирающих судебные дела; «судьи» — прямой и естественный русский эквивалент.
- source_word: בָּעֵת הַהִוא
  choice: в то время
  rationale: Устойчивое и естественное обозначение ранее упомянутого периода.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: выслушивайте дела между вашими братьями
  rationale: שׁמע в данном судебном контексте означает внимательное выслушивание сторон или дел. Добавление «дела» делает юридический смысл явным, не устраняя возможного понимания как выслушивания споров.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: и судите справедливо
  rationale: Форма צֶדֶק здесь характеризует судебное решение как правое и справедливое. Русское наречие естественно передаёт его функцию при глаголе.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: между человеком и его братом
  rationale: Сохранены конкретная форма единственного числа и родственный язык оригинала, который представляет членов общины как братьев.
- source_word: גֵּרוֹ
  choice: живущим с ним чужеземцем
  rationale: גֵּר — не просто приезжий, а иноземец, постоянно живущий внутри израильского общества. «Живущим с ним» передаёт местоименный суффикс и связь такого человека с участником тяжбы.
theological_decisions:
- issue: Родственный язык общины в אֲחֵיכֶם и אָחִיו
  choice: вашими братьями / его братом
  alternative: соотечественниками / ближним
  rationale: Буквальный родственный образ сохранён, поскольку он выражает восприятие Израиля как единой общины; при этом в правовом предписании эти формы имеют представительное, а не обязательно исключительно мужское применение.
- issue: Значение צֶדֶק в судебном контексте
  choice: справедливо
  alternative: по правде / праведно
  rationale: В данном контексте на первом плане судебная справедливость, однако еврейское слово соединяет правовой и нравственный оттенки; примечание сохраняет эту смысловую широту.
- issue: Правовой статус גֵּר
  choice: живущий с ним чужеземец
  alternative: пришелец / переселенец
  rationale: Перевод показывает, что закон распространяет беспристрастный суд и на неуроженца, постоянно живущего среди израильтян, не приписывая ему позднейшего религиозного или гражданского статуса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прямой и пригодный для публичного чтения; родственный язык оригинала сохранён, а редкий социально-правовой термин пояснён в сноске.
