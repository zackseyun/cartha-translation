  to: 'Тогда вы ответили мне: «Мы согрешили против Яхве. Мы сами поднимемся и будем сражаться в точности так, как повелел нам Яхве, наш Бог». И каждый из вас надел своё боевое снаряжение, а затем вы самонадеянно отправились в горную местность[a].'
  rationale: Удалены не выраженное в оригинале «теперь» и добавленный самостоятельный глагол «сделаем». Усилительное местоимение сохранено как «мы сами». Заключительное действие передано как самонадеянное отправление в горную область; объединённое примечание стоит непосредственно после слов, к которым относится, и поясняет как географическую, так и лексическую неоднозначность.
