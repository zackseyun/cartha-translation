  - severity: medium
    issue: Добавлено самостоятельное действие в «сделаем всё, как повелел».
    rationale: Еврейское כְּכֹל אֲשֶׁר צִוָּנוּ — обстоятельственный оборот «согласно всему, что ... повелел», а не отдельное обещание сделать всё.
