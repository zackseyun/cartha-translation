  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: ru
  text: 'Тогда вы ответили мне: «Мы согрешили против Яхве. Мы сами поднимемся и будем сражаться в точности так, как повелел нам Яхве, наш Бог». И каждый из вас надел своё боевое снаряжение, а затем вы самонадеянно отправились в горную местность[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на гору». В данном контексте это выражение, вероятно, обозначает горную область в целом. Редкий еврейский глагол перед словом «отправились» допускает также переводы «опрометчиво пошли» или «самонадеянно двинулись»; он передаёт чрезмерную уверенность и безрассудную решимость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: Тогда вы ответили мне
  rationale: Глагол ענה в данном повествовательном контексте обозначает ответ Моисею; сочетание с ויאמר естественно передаётся одним вводящим речь оборотом без избыточного «ответили и сказали».
- source_word: חָטָאנוּ לַיהוָה
  choice: Мы согрешили против Яхве
  rationale: Предлог ל после חטא указывает на того, против кого совершён грех; «согрешили против» — естественная русская формулировка.
- source_word: אֲנַחְנוּ נַעֲלֶה וְנִלְחַמְנוּ
  choice: Теперь мы поднимемся и будем сражаться
  rationale: Отдельное местоимение אֲנַחְנוּ придаёт субъекту выразительность; «мы» сохранено, а «теперь» естественно передаёт решительный переход к действию, не меняя смысла. עלה сохраняет образ движения вверх.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: сделаем всё, как повелел нам
  rationale: Оборот выражает полное соответствие повелению. Добавленное по-русски «сделаем» раскрывает подразумеваемое действие и делает прямую речь естественной.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: каждый из вас надел своё боевое снаряжение
  rationale: Распределительное אִישׁ передано как «каждый из вас». חגר означает подпоясаться или закрепить на себе снаряжение, а כְּלֵי מִלְחָמָה может охватывать оружие и воинское оснащение; «надел боевое снаряжение» ясно и не сужает значение до одного вида оружия.
- source_word: וַתָּהִינוּ
  choice: вы самонадеянно решились
  rationale: Редкий глагол в ближайшем контексте имеет отрицательный оттенок опрометчивой, самоуверенной решимости. Перевод сохраняет как оценку поведения, так и переход к попытке восхождения.
- source_word: לַעֲלֹת הָהָרָה
  choice: подняться в горную местность
  rationale: Направительный суффикс указывает на движение к горе или в горный район. В контексте завоевания речь, вероятно, идёт не об одной вершине, а о более широкой горной области.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и соответствует наиболее принятой научной реконструкции произношения.
- issue: Нравственная окраска וַתָּהִינוּ
  choice: самонадеянно решились
  alternative: опрометчиво пошли; отважились; сочли лёгким делом
  rationale: Последующий стих прямо описывает неповиновение, поэтому отрицательный оттенок здесь контекстуально оправдан. При этом примечание сохраняет лексическую неопределённость редкого глагола.
translation_notes:
  register: Современный литературный русский язык с dignified библейским тоном. Прямая речь звучит естественно, без архаизмов; пространственный образ восхождения и отрицательная, но лексически не вполне однозначная оценка действий Израиля сохранены.
