  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: ru
  text: 'Куда мы поднимаемся? Наши братья лишили нас мужества[a], сказав: «Этот народ больше и выше нас; города большие и укреплённые до небес[b]; к тому же мы видели там потомков Анака[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «растопили наше сердце», то есть обескуражили нас.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «укреплены в небесах» — гиперболическое описание чрезвычайно высоких укреплений.'
    reason: cultural_note
  - marker: c
    text: 'Или: «сынов Анака»; также возможно: «анакитов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Куда мы идём?
  rationale: Вопросительное אָנָה указывает на направление, а עֹלִים буквально означает «поднимаемся». В данном контексте по-русски естественнее «идём»; буквальное направление движения несущественно для смысла вопроса.
- source_word: אַחֵינוּ
  choice: наши братья
  rationale: Сохраняет форму мужского множественного числа и риторическое обозначение соплеменников-израильтян.
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: лишили нас мужества
  rationale: Еврейская идиома буквально говорит о том, что братья «растопили наше сердце», то есть обескуражили народ и лишили его решимости; естественный русский эквивалент вынесен в текст, а образ сохранён в примечании.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: этот народ многочисленнее и выше нас
  rationale: גָּדוֹל может обозначать величину или многочисленность, тогда как רָם здесь указывает на высокий рост. Выбор передаёт оба элемента и избегает неясного «больше нас».
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: города велики и укреплены до небес
  rationale: Сохраняется гиперболический образ чрезвычайно высоких и мощных укреплений, а не заменяется пояснительным пересказом.
- source_word: וְגַם
  choice: к тому же
  rationale: Передаёт присоединение ещё одного устрашающего обстоятельства.
- source_word: בְּנֵי עֲנָקִים
  choice: потомков Анака
  rationale: Контекстуально это обозначение потомков Анака; такой вариант понятнее русскому читателю, чем транслитерация этнонима, и не добавляет толкования об их природе или росте.
- source_word: רָאִינוּ שָׁם
  choice: мы видели там
  rationale: Естественная русская передача завершённого наблюдения в рассказе о прошлом.
