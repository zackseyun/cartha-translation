base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: ru
  text: 'И взял я глав ваших племён — мужей мудрых и сведущих[a] — и поставил их главами над вами: начальниками тысяч, начальниками сотен, начальниками пятидесяти, начальниками десятков и должностными лицами в ваших племенах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «известных» или «признанных». Еврейское слово может обозначать людей, известных или признанных; в этом контексте оно также может указывать на сведущих людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: И взял я
  rationale: Последовательная форма с וַ־ продолжает повествование; русский порядок слов сохраняет торжественный повествовательный тон, не добавляя причинного значения.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: глав ваших племён
  rationale: «Главы» сохраняет еврейскую метафору и лексическую связь с последующим רָאשִׁים.
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: мужей мудрых и сведущих
  rationale: «Мужей» точно передаёт мужской род и соответствует достоинству контекста; «мудрых» обозначает практическую мудрость, а «сведущих» — знание и признанную компетентность.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: и поставил их главами над вами
  rationale: נתן с именной частью сказуемого выражает назначение на должность; формулировка также сохраняет повтор слова «главы».
- source_word: שָׂרֵי אֲלָפִים ... עֲשָׂרֹת
  choice: начальниками тысяч ... десятков
  rationale: «Начальники» передаёт должностную власть שַׂר, не сводя неоднозначные военно-административные единицы исключительно к военному командованию.
- source_word: חֲמִשִּׁים
  choice: пятидесятков
  rationale: Название организованной группы из пятидесяти человек передано привычным русским собирательным термином по аналогии с десятками, сотнями и тысячами.
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: и распорядителями в ваших племенах
  rationale: שֹׁטְרִים обозначает подчинённых административных должностных лиц; «распорядители» яснее отличает их от уже названных начальников, а לְ выражает сферу их служения внутри племён.
