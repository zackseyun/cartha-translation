base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: ru
  text: Ни один из этих мужчин, из этого злого поколения, не увидит доброй земли, которую Я поклялся дать вашим отцам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вашим предкам». Буквально: «вашим отцам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ни один… не
  rationale: В данном контексте אִם входит в клятвенную формулу и выражает решительное отрицание, а не обычное условие «если».
- source_word: יִרְאֶה
  choice: не увидит
  rationale: Сохраняет обычное значение ראה и в контексте суда указывает на то, что это поколение не войдёт в землю и не испытает обещанного блага.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: ни один из мужчин
  rationale: 'Передаёт распределительное значение единственного числа אִישׁ и частичное значение предлога ב: ни один человек из названной группы мужчин.'
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: этого злого поколения
  rationale: רע здесь имеет нравственную оценку, поэтому «злого» точнее, чем нейтральное «плохого»; русская конструкция естественно связывает группу мужчин с поколением.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: доброй земли
  rationale: Прямо передаёт характеристику земли как благой и желанной, не добавляя толкования.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: которую Я поклялся дать
  rationale: Сохраняет значение клятвы в נשבע и обычное значение «дать» у נתן.
- source_word: לַאֲבֹתֵיכֶם
  choice: вашим отцам
  rationale: Буквально сохраняет мужское множественное число исходного текста; по смыслу речь идёт о праотцах Израиля.
theological_decisions:
- issue: Значение לַאֲבֹתֵיכֶם
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Основной текст сохраняет буквальное «отцам», тогда как более широкое по смыслу «предкам» отмечено в сноске.
- issue: Клятвенная формула с אִם
  choice: 'решительное отрицание: «ни один… не увидит»'
  alternative: буквальное условное «если кто-либо увидит»
  rationale: После сообщения о Божьей клятве в предыдущем стихе אִם функционирует как эллиптическая клятвенная формула. Перевод должен передать её отрицательную силу, не восполняя невыраженное проклятие.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис близок к еврейскому тексту, при этом клятвенная идиома передана естественным русским отрицанием.
