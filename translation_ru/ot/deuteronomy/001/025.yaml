base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: ru
  text: 'Они взяли в руки плоды земли, принесли их вниз к нам и сообщили нам: «Земля, которую даёт нам Яхве, наш Бог, хороша».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: Они взяли в руки
  rationale: 'Сохраняется конкретный образ еврейского выражения: разведчики физически взяли и понесли образцы плодов.'
- source_word: מִפְּרִי הָאָרֶץ
  choice: плоды той земли
  rationale: 'Русское множественное «плоды» естественно передаёт собирательное פְּרִי; указательное «той» уместно для уже упомянутой земли. Частичность подразумевается контекстом: были взяты образцы плодов.'
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: принесли их к нам
  rationale: В каузативной породе ירד означает «спустить, принести вниз». В русском явное «вниз» здесь звучало бы тяжеловесно и без контекста могло бы отвлекать; движение к говорящим передано естественно.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: передали нам весть
  rationale: Идиома означает возвращение с сообщением и передачу отчёта. «Передали нам весть» естественно по-русски, а семантика возвращения уже ясна из повествовательной ситуации.
- source_word: טוֹבָה הָאָרֶץ
  choice: Хороша земля
  rationale: Краткая предикативная форма естественно и выразительно передаёт широкую положительную оценку טוֹבָה.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Прямое и общепонятное соответствие заветному выражению.
- source_word: נֹתֵן לָנוּ
  choice: даёт нам
  rationale: Причастная форма обозначает совершающееся или предстоящее дарование; русское настоящее время сохраняет эту аспектуальную открытость.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Временной оттенок נֹתֵן
  choice: даёт нам
  alternative: даст нам
  rationale: Настоящее время сохраняет форму еврейского причастия и представляет дарование земли как уже осуществляемое, не сводя его только к будущему.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и понятным; архаизмы и ненужные кальки исключены. Прямая речь вводится двоеточием, поскольку отдельное «и сказали» по-русски избыточно после «передали нам весть».
