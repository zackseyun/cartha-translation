    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «это наставление». Еврейское слово «тора» может означать «закон» или, шире, «наставление»; здесь выбрано слово «закон» с учётом контекста заветных установлений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: по ту сторону Иордана
  rationale: Еврейское выражение обозначает местность на другой стороне Иордана относительно точки отсчёта говорящего. Этот естественный русский оборот сохраняет географическую относительность оригинала.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: в земле Моава
  rationale: אֶרֶץ в данном географически-политическом контексте означает «земля»; традиционное и прозрачное сочетание «земля Моава» точно передаёт смысл.
- source_word: הוֹאִיל
  choice: начал
  rationale: В сочетании с последующим глаголом форма указывает на начало или принятие на себя действия. «Начал» естественно вводит последующее изложение Моисея.
- source_word: בֵּאֵר
  choice: разъяснять
  rationale: Глагол באר означает делать ясным, объяснять или подробно излагать. «Разъяснять» передаёт этот смысл современно и достойно.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: этот закон
  rationale: תּוֹרָה может означать как закон, так и наставление. В контексте заветных установлений Второзакония «закон» сохраняет юридико-заветный оттенок, а более широкая возможность отмечена в сноске.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Стандартная формула, вводящая содержание последующей речи; двоеточие ясно показывает её вводную функцию.
theological_decisions:
- issue: Передача תּוֹרָה в контексте завета
  choice: этот закон
  alternative: это наставление; эта Тора
  rationale: «Закон» соответствует контексту заветных предписаний, не отрицая более широкого значения божественного наставления. Лексическая неоднозначность сохранена в сноске без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; географическая и лексическая неоднозначность оригинала вынесена в краткие сноски.
