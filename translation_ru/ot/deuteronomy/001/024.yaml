  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: ru
  text: Они повернули и поднялись в горную местность, дошли до долины Эшкол[a] и разведали эту землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вади Эшкол» или «ручей Эшкол»; еврейское слово может обозначать долину с сезонным водотоком.'
