lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: они повернули
  rationale: Прямо передаёт обычное повествовательное значение פנה — «повернуть, направиться», не добавляя отсутствующей в тексте идеи простого выступления в путь.
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Сохраняет значение движения вверх, естественное для описания рельефа.
- source_word: הָהָרָה
  choice: в горную местность
  rationale: Направительный суффикс указывает на движение в сторону горной области; «горная местность» здесь естественнее и точнее, чем отдельная «гора».
- source_word: וַיָּבֹאוּ עַד
  choice: дошли до
  rationale: Передаёт достижение указанного предела или пункта, выраженное сочетанием בוא с עַד.
- source_word: נַחַל אֶשְׁכֹּל
  choice: долина Эшкол
  rationale: נַחַל может обозначать долину или русло сезонного потока; в основном тексте «долина» звучит ясно и соответствует топониму, а иные оттенки отмечены в сноске.
- source_word: וַיְרַגְּלוּ
  choice: разведали
  rationale: Передаёт целенаправленную разведку местности, а не просто осмотр или путешествие; по-русски это естественнее буквального «высмотрели как соглядатаи».
- source_word: אֹתָהּ
  choice: её
  rationale: Сохраняет местоименный объект женского рода; в русском тексте он естественно соотносится с долиной, хотя по контексту разведка относится к данной местности или земле.
