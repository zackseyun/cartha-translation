  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: ru
  text: 'кроме Халева, сына Иефоннии: он увидит её; ему и его сыновьям[a] Я отдам землю, по которой он ходил, потому что он всецело следовал за Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его потомкам»; в еврейском тексте: «его сыновьям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִי
  choice: кроме
  rationale: Вводит исключение из предшествующего приговора и естественно звучит по-русски.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Халев, сын Иефоннии
  rationale: Использованы традиционные русские библейские формы имён, понятные читателю.
- source_word: יִרְאֶנָּה
  choice: он увидит её
  rationale: Местоименный суффикс женского рода относится к земле; будущее время передаёт обещание.
- source_word: וְלֽוֹ אֶתֵּן
  choice: ему ... Я отдам
  rationale: Сохраняется выделение получателя, при этом порядок слов остаётся естественным для русского языка.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Обычное и контекстуально точное обозначение обещанной земли.
- source_word: אֲשֶׁר דָּרַךְ בָּהּ
  choice: по которой он ходил
  rationale: Сохраняет конкретный образ ступания и хождения по земле без архаизации.
- source_word: וּלְבָנָיו
  choice: и его сыновьям
  rationale: Передаёт буквально мужское множественное число בנים; более широкое значение потомства здесь возможно, но не навязывается.
- source_word: יַעַן אֲשֶׁר
  choice: потому что
  rationale: Естественно и ясно вводит основание обещания.
- source_word: מִלֵּא אַחֲרֵי יְהוָה
  choice: во всём следовал за Яхве
  rationale: Естественно передаёт идиому полного, безраздельного следования, не калькируя буквально «наполнил вслед».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно присутствующее в еврейском тексте личное имя Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Форма «Яхве» передаёт личное имя в исходном тексте и не заменяет его титулом.
- issue: Объём значения בָנָיו
  choice: его сыновьям
  alternative: его детям; его потомкам
  rationale: Основной текст сохраняет формально выраженное «сыновьям», не исключая возможности более широкого династического смысла в данном контексте.
- issue: Смысл идиомы מִלֵּא אַחֲרֵי
  choice: во всём следовал за
  alternative: полностью последовал за; всецело следовал за
  rationale: Выбранная формулировка передаёт полноту верности, не уточняя сверх текста её психологический или конфессиональный характер.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены конкретный образ хождения по земле, юридически-обещательный тон и прямое употребление имени Яхве.
