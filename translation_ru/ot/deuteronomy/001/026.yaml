  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: adversative וְלֹא («Но»), волевое отрицание אֲבִיתֶם («не захотели»), направленное движение לַעֲלֹת («подняться»), открытое неповиновение וַתַּמְרוּ («восстали») и идиоматическое אֶת־פִּי через «против повеления». «Яхве, вашего Бога» корректно передаёт יְהוָה אֱלֹהֵיכֶם.'
