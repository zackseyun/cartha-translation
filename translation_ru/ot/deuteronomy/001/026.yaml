  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: ru
  text: Но вы не захотели подняться и восстали против повеления Яхве, вашего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «восстали против уст Яхве, вашего Бога» — то есть воспротивились его повелению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: Но вы не захотели
  rationale: Сочетание союза с отрицательной формой אבה выражает противопоставление и сознательное нежелание; такой перевод естественен по-русски и сохраняет волевой оттенок.
- source_word: לַעֲלֹת
  choice: подняться
  rationale: Глагол עלה обозначает движение вверх; «подняться» сохраняет пространственную направленность исходного текста.
- source_word: וַתַּמְרוּ
  choice: и восстали
  rationale: Глагол מרה означает бунт или сознательное неповиновение власти; «восстали» передаёт эту силу без добавления конфессиональной интерпретации.
- source_word: אֶת פִּי
  choice: против повеления
  rationale: Буквально «против уст»; в данном обороте «уста» обозначают произнесённое повеление. Смысловой перевод звучит естественно на современном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяется титулом.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Суффикс второго лица множественного числа передан местоимением «вашего»; в сочетании с именем Яхве существительное имеет единственное число.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Идиома «восстать против уст»
  choice: восстали против повеления
  alternative: восстали против уст; ослушались слова
  rationale: Выбранный вариант передаёт неповиновение произнесённому Божьему распоряжению, не ослабляя оттенка открытого бунта в глаголе מרה.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная без архаизмов. Местоимение «вы» относится ко всему народу, как и формы второго лица множественного числа в еврейском тексте.
