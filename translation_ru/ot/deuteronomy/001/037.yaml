  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: ru
  text: 'Яхве разгневался и на меня из-за вас[a] и сказал[b]: «Ты тоже не войдёшь туда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве разгневался и на меня по причине вас».'
    reason: lexical_alternative
  - marker: b
    text: Ср. Числа 20:12, где невхождение Моисея в землю связано с его собственным проступком у вод Меривы; здесь, во Второзаконии, подчёркивается роль народа в случившемся.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: и; тоже
  rationale: Первое употребление имеет присоединительное значение и естественно передаётся как «и», второе подчёркивает, что Моисей также не войдёт в землю, поэтому передано как «тоже».
- source_word: בִּי
  choice: на меня
  rationale: 'С глаголом הִתְאַנַּף предлог ב обозначает объект гнева; по-русски естественно: «разгневался на меня».'
- source_word: הִתְאַנַּף
  choice: разгневался
  rationale: Форма передаёт сильный гнев или вступление в состояние гнева. «Разгневался» сохраняет вес исходного выражения и соответствует dignified literary register.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, не заменяя его титулом.
- source_word: בִּגְלַלְכֶם
  choice: из-за вас
  rationale: Прямо и естественно передаёт причинное значение выражения, не уточняя степень вины народа сверх сказанного в тексте.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Инфинитив вводит содержание прямой речи. В современном русском повествовании личная форма «и сказал» звучит естественнее буквального «говоря».
- source_word: אַתָּה
  choice: ты
  rationale: Местоимение второго лица мужского рода единственного числа обращено к Моисею; сопутствующее גַּם передаёт усиление через «ты тоже».
- source_word: לֹא תָבֹא
  choice: не войдёшь
  rationale: В контексте речь идёт о вступлении в обещанную землю; «войдёшь» точнее контекстуального русского «придёшь».
- source_word: שָׁם
  choice: туда
  rationale: Русское «туда» естественно передаёт направительное значение при глаголе движения и отсылает к земле, о которой идёт речь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Причина исключения Моисея из входа в землю
  choice: Сохранить прямое утверждение «из-за вас»
  alternative: Перенести акцент на собственный проступок Моисея либо возложить всю ответственность только на народ
  rationale: Второзаконие 1:37 подчёркивает роль народа, тогда как Числа 20:12 связывают исключение Моисея с его собственным проступком. Основной текст не должен устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан естественным для прямой речи; причинная формулировка и межтекстовое богословское напряжение сохранены.
