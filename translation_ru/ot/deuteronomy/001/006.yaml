  text: יְהוָ֧ה אֱלֹהֵ֛י/נוּ דִּבֶּ֥ר אֵלֵ֖י/נוּ בְּ/חֹרֵ֣ב לֵ/אמֹ֑ר רַב לָ/כֶ֥ם שֶׁ֖בֶת בָּ/הָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: ru
  text: 'Яхве, наш Бог, сказал нам у Хорива[a]: «Вы уже достаточно пробыли у этой горы[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — Хорив; это название горы, также связываемой с Синаем.
    reason: cross_reference
  - marker: b
    text: 'Или: «Довольно вам оставаться у этой горы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Несмотря на форму существительного, в данном контексте оно обозначает единого Бога Израиля; суффикс первого лица множественного числа передан словом «наш».
- source_word: דִּבֶּר אֵלֵינוּ
  choice: сказал нам
  rationale: Сочетание естественно передаёт направленную к адресатам речь; «сказал» по-русски лучше сочетается с последующей прямой речью, чем буквальное «говорил».
- source_word: בְּחֹרֵב
  choice: у Хорива
  rationale: Предлог имеет локативное значение. Форма «у Хорива» естественна для речи о пребывании возле горы и сохраняет употреблённое в еврейском тексте название.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Стандартная древнееврейская формула введения прямой речи естественно передана в современном русском языке двоеточием без избыточного «говоря».
- source_word: רַב לָכֶם שֶׁבֶת
  choice: вы уже достаточно пробыли
  rationale: Идиома выражает достаточность или чрезмерную продолжительность пребывания. Эта формулировка естественна по-русски и соответствует контексту призыва отправиться дальше.
- source_word: בָּהָר הַזֶּה
  choice: у этой горы
  rationale: Слово הַר означает «гора», а предлог ב здесь обозначает место пребывания; «у этой горы» не создаёт впечатления, будто весь народ находился непосредственно на вершине или склонах.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Еврейский текст содержит тетраграмматон как личное имя. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Соотношение Хорива и Синая
  choice: Сохранено название «Хорив» без отождествления в основном тексте
  alternative: Синай
  rationale: В данном стихе прямо употреблено название חֹרֵב. Примечание сообщает о связи с Синаем, не устраняя возможных вопросов о соотношении этих названий.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формула לֵאמֹר передана пунктуационно; синтаксис прямой речи сделан естественным без утраты оттенка достаточности или чрезмерной длительности пребывания.
