translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Географические названия «Арава» и «Негев» сохранены как региональные термины; менее известная «Шефела» пояснена в сноске. Двоеточие раскрывает перечень прилегающих областей, а тире сохраняет характер приложения перед выражением «землю ханаанеев».
