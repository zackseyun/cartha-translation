base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: ru
  text: 'Направьтесь, отправляйтесь в путь и идите в горную страну амореев, ко всем окрестным местам: в Араву, в горную страну, в низменность[a], в Негев и на морское побережье — в землю ханаанеев и в Ливан, вплоть до великой реки, реки Евфрат.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Шефелу» — так называлась низменная предгорная область к западу от Иудейских гор.'
    reason: 'Лексико-географическая альтернатива: שְׁפֵלָה может переводиться описательно или передаваться как название региона.'
lexical_decisions:
- source_word: פְּנוּ
  choice: Повернитесь
  rationale: Императив פנה обозначает смену направления; «повернитесь» кратко и прямо передаёт силу повеления.
- source_word: וּסְעוּ לָכֶם
  choice: отправляйтесь в путь
  rationale: נסע в контексте переходов означает сняться с места и отправиться; дательный לָכֶם здесь идиоматичен и не требует неестественного буквального «для себя».
- source_word: וּבֹאוּ
  choice: идите
  rationale: בוא может означать «приходить», «входить» или направляться куда-либо; в последовательности повелений русское «идите» естественно выражает движение к названной земле.
- source_word: הַר הָאֱמֹרִי
  choice: горную страну амореев
  rationale: הַר здесь обозначает не отдельную гору, а гористую область; этноним имеет собирательное значение.
- source_word: שְׁכֵנָיו
  choice: все прилегающие к ней области
  rationale: Буквально «всех его/её соседей»; местоимение относится к территориальному выражению «горная страна амореев». Перевод сохраняет пространственный смысл, не создавая неуместной персонификации.
- source_word: בָּעֲרָבָה
  choice: в Араву
  rationale: עֲרָבָה в перечне географических областей является названием Иорданской рифтовой долины; транслитерация сохраняет конкретный региональный смысл.
- source_word: בָהָר
  choice: в горную страну
  rationale: הַר обозначает здесь гористую область, а не одну гору.
- source_word: וּבַשְּׁפֵלָה
  choice: в низменность
  rationale: שְׁפֵלָה обозначает низменную предгорную область к западу от Иудейских гор; понятный русский эквивалент дан в тексте, а географическое название сохранено в примечании.
- source_word: וּבַנֶּגֶב
  choice: в Негев
  rationale: В ряду конкретных географических областей נֶגֶב обозначает южный регион Негев, а не просто направление «юг».
- source_word: וּבְחוֹף הַיָּם
  choice: на морское побережье
  rationale: חוֹף означает берег или побережье; выбран естественный современный русский географический оборот.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: в землю ханаанеев
  rationale: Форма этнонима имеет собирательное значение; русский множественный этноним естественно передаёт территориальную принадлежность.
- source_word: וְהַלְּבָנוֹן
  choice: и в Ливан
  rationale: Определённый артикль при географическом названии по-русски не передаётся; предлог восстановлен из синтаксического ряда для ясности.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: вплоть до великой реки, реки Евфрат
  rationale: Сохранены повтор נְהַר и приложение, торжественно уточняющее название границы.
