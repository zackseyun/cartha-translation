lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Самостоятельное местоимение при союзе подчёркивает адресатов и передаёт контраст с предшествующим приговором; по-русски естественно «А вы».
- source_word: פְּנוּ לָכֶם
  choice: поверните
  rationale: Императив פנה указывает на перемену направления, а לָכֶם усиливает обращённость действия к самим адресатам. Русское «поверните» естественно передаёт команду без тяжеловесного «повернитесь сами»; добавление «назад» было бы более определённым, чем еврейский текст.
- source_word: וּסְעוּ
  choice: отправляйтесь
  rationale: נסע в контексте пути означает сняться с места и двинуться в путь; «отправляйтесь» ясно и естественно передаёт этот смысл.
- source_word: הַמִּדְבָּרָה
  choice: в пустыню
  rationale: Направительное ה выражает движение к пустыне; русское «в пустыню» здесь идиоматично и не требует отдельного обозначения достижения цели.
- source_word: דֶּרֶךְ
  choice: по дороге к
  rationale: Слово обозначает путь или маршрут. В сочетании с названием моря «по дороге к» естественно выражает направление маршрута.
- source_word: יַם סוּף
  choice: Красному морю
  rationale: «Красное море» — укоренившееся русское географическое соответствие; более буквальное «Тростниковое море» сохранено в сноске.
