  yaml_path: translation/ot/deuteronomy/001/002.yaml
  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: ru
  text: От Хорива до Кадеш-Барнеа по дороге через гору Сеир — одиннадцать дней пути.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одиннадцать дней». Здесь это выражение означает время, необходимое для пути между Хоривом и Кадеш-Барнеа по указанному маршруту.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь стоит название «Хорив»; его часто связывают с Синаем.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: одиннадцать дней пути
  rationale: 'Буквально: «одиннадцать дней». В данном контексте это еврейское выражение обозначает продолжительность пути; добавление «пути» естественно передаёт смысл по-русски.'
- source_word: מֵחֹרֵב
  choice: от Хорива
  rationale: Хорив — прямо названный в еврейском тексте топоним; заменять его названием Синай в основном тексте не следует.
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: по дороге через гору Сеир
  rationale: דֶּרֶךְ обозначает дорогу или маршрут, а сочетание с הַר שֵׂעִיר указывает путь, связанный с горой либо горной областью Сеир. «Через» естественно обозначает маршрут, не сводя выражение к названию одной конкретной дороги.
- source_word: עַד
  choice: до
  rationale: В географическом контексте предлог указывает конечный пункт пути.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Кадеш-Барнеа
  rationale: Топоним передан транслитерацией, близкой к еврейской форме, и оформлен через дефис как составное название.
