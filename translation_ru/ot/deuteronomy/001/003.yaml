  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: ru
  text: И вот, в сороковом году, в одиннадцатом месяце, в первый день месяца, Моисей сказал сынам Израиля[a] всё, что Яхве повелел ему сказать им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально конструкция сжата: «повелел ему — им (к ним)»; возможно также понимание: «повелел ему о них». Смысл основного перевода: Моисей сообщил Израилю то, что Яхве поручил ему сказать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Формула вводит повествование и временную обстановку. «И вот» естественно выполняет эту функцию в современном литературном русском, не прибегая к архаичному «и было».
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: в сороковой год
  rationale: Количественное числительное в еврейской датировочной формуле обозначает порядковый номер года; по-русски естественно порядковое числительное.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: в одиннадцатый месяц
  rationale: Еврейская конструкция функционирует как календарная датировка; передана обычной русской формой.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Стандартная формула даты; слово «день» выражено для ясности по-русски.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Нейтральная передача глагола речи в данном контексте; не уточняет без необходимости характер обращения.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет родовой образ исходного выражения буквально и при этом соответствует традиционному, понятному русскому библейскому регистру.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё, что
  rationale: По смыслу Моисей сообщает в полном объёме повелённое ему. Русская конструкция естественна; значение соответствия и полноты удерживается словом «всё».
- source_word: צִוָּה
  choice: повелел
  rationale: Передаёт властное предписание; совершенный вид отражает предшествование повеления речи Моисея без обязательной громоздкой временной конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: ему сказать им
  rationale: 'Еврейская конструкция буквально сжата: «повелел ему — к ним/им». Добавлен подразумеваемый инфинитив «сказать», чтобы ясно и естественно обозначить содержание поручения, сохранив адресата «им».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Направленность повеления в אֹתוֹ אֲלֵהֶם
  choice: повелел ему сказать им
  alternative: повелел ему о них
  rationale: Предлог אֶל обычно указывает направление к адресатам, однако сжатый синтаксис допускает оттенок «относительно них». Основной текст передаёт наиболее вероятный адресный смысл, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Датировочная формула сохранена полностью; архаизмы и излишне буквальный, неестественный синтаксис исключены.
