base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: ru
  text: 'Смотри[a]: Я положил перед вами землю. Войдите и овладейте[b] землёй, которую Яхве поклялся дать вашим отцам[c] — Аврааму, Исааку и Иакову, — им и их потомкам[d] после них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот». Буквально употреблена форма единственного числа, обращённая к Израилю как к единому целому.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вступите во владение». Еврейский глагол может также означать «получить в наследие» или «завладеть».'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст буквально говорит «вашим отцам», имея здесь в виду Авраама, Исаака и Иакова.
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «их семени»; еврейское слово употреблено в собирательном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Вот
  rationale: Форма единственного числа служит призывом обратить внимание, обращённым к Израилю как к единому целому. «Вот» естественно передаёт эту дискурсивную функцию в современном русском языке, не создавая резкого перехода от единственного числа к последующим формам множественного.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: Я отдал вам
  rationale: Перфект נָתַתִּי представляет землю как уже предоставленную Израилю, а сочетание с לִפְנֵיכֶם подчёркивает, что она открыта перед ними и доступна для вступления во владение. «Отдал вам» естественно выражает этот результат в русском контексте.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте речь идёт о земле обетования. «Земля» сохраняет широкий смысл еврейского אֶרֶץ и привычную библейскую терминологию.
- source_word: בֹּאוּ
  choice: Войдите
  rationale: Императив множественного числа обозначает вступление в землю. «Войдите» яснее русского «придите» передаёт направленность движения внутрь неё.
- source_word: וּרְשׁוּ
  choice: овладейте
  rationale: Глагол ירשׁ здесь обозначает активное вступление во владение обещанной землёй; «овладейте» сохраняет эту активность и не сводит значение только к юридическому наследованию.
- source_word: נִשְׁבַּע יְהוָה
  choice: Яхве поклялся
  rationale: Передано прямое употребление личного имени יהוה и значение глагола שבוע — подтверждение обещания клятвой.
- source_word: לַאֲבֹתֵיכֶם
  choice: вашим отцам
  rationale: Мужское множественное אֲבֹתֵיכֶם непосредственно уточняется именами Авраама, Исаака и Иакова; «отцам» сохраняет это конкретное патриархальное значение.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Дательный падеж естественно передаёт повторяющийся еврейский предлог לְ. Повтор предлога не воспроизводится механически, поскольку русские падежные формы уже ясно отмечают синтаксическую связь.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: дать … им и их потомкам после них
  rationale: Конструкция сохраняет явное обещание как самим патриархам, так и коллективному זֶרַע после них. «Потомкам» естественно передаёт коллективное значение слова, а «после них» сохраняет временную формулировку оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон как личное заветное имя Бога. Транслитерация «Яхве» позволяет не заменять имя титулом и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение אֲבֹתֵיכֶם
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Последующее перечисление прямо отождествляет названных «отцов» с Авраамом, Исааком и Иаковом, поэтому конкретно мужская формулировка источника сохранена.
- issue: Адресаты обещания в לָתֵת לָהֶם וּלְזַרְעָם
  choice: им и их потомкам
  alternative: их потомкам
  rationale: Местоимение לָהֶם грамматически указывает и на самих патриархов, а не только на их потомков. Перевод сохраняет эту богословски значимую напряжённость обещания земли патриархам и последующим поколениям.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; сохранены клятва, личное имя Яхве, конкретное обозначение патриархов и двоякая направленность обещания — им самим и их потомкам.
