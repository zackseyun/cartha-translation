  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: ru
  text: Выберите себе мудрых, рассудительных и известных в ваших племенах мужчин[a], и я поставлю их вашими главами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признанных». Еврейское слово может подчёркивать, что эти мужчины были известны среди своих племён и имели сложившуюся репутацию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «головами»; то есть руководителями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: выберите
  rationale: Хотя глагол буквально может означать «дайте» или «представьте», в данном контексте народ должен отобрать подходящих кандидатов, которых затем назначит Моисей.
- source_word: לָכֶם
  choice: себе
  rationale: Возвратно-дательный оттенок показывает, что народ выбирает людей для себя и в собственных интересах.
- source_word: אֲנָשִׁים
  choice: мужчин
  rationale: Форма мужского рода во множественном числе обозначает мужчин, избираемых для руководства племенами; современное «мужчин» передаёт это точнее, чем нейтральное «людей».
- source_word: חֲכָמִים
  choice: мудрых
  rationale: В контексте управления и суда речь идёт о мудрости и здравом суждении, а не о техническом умении.
- source_word: וּנְבֹנִים
  choice: рассудительных
  rationale: Слово от корня בין указывает на способность понимать, различать и выносить здравые суждения; «рассудительных» естественно передаёт это качество по-русски.
- source_word: וִידֻעִים
  choice: признанных
  rationale: Страдательная форма от ידע, вероятно, описывает людей, известных и признанных среди соплеменников, то есть обладающих установившейся репутацией.
- source_word: לְשִׁבְטֵיכֶם
  choice: из ваших племён
  rationale: Оборот указывает на племена как на среду, из которой выбираются кандидаты; такое выражение естественно в современном русском.
- source_word: וַאֲשִׂימֵם
  choice: я поставлю их
  rationale: В прямой речи форма выражает последующее действие Моисея после выбора кандидатов; «поставлю» сохраняет образ исходного глагола и подразумевает официальное назначение.
- source_word: בְּרָאשֵׁיכֶם
  choice: вашими руководителями
  rationale: Существительное «голова» здесь метафорически обозначает начальников или руководителей. Основной текст передаёт функцию естественно, а буквальный образ сохраняется в сноске.
theological_decisions:
- issue: Мужской род в אֲנָשִׁים
  choice: мужчин
  alternative: людей
  rationale: Еврейский текст прямо употребляет существительное мужского рода применительно к племенным руководителям. Перевод сохраняет это грамматическое и историко-социальное указание, не расширяя и не сужая его богословскими выводами.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. «Мужчин» выбрано вместо более библейски-архаичного «мужей»; «руководителями» естественно передаёт метафорическое значение «голов», при этом исходный образ указан в сноске.
