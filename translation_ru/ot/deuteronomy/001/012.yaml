  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: ru
  text: Как мне одному нести ваши тяготы, ваше бремя и ваши споры[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши распри»; возможно: «ваши судебные дела».'
    reason: Слово רִיב может обозначать межличностный спор или распрю, а также дело, рассматриваемое в суде.
lexical_decisions:
- source_word: אֵיכָה
  choice: Как могу
  rationale: Вводит риторический вопрос, выражающий непосильность задачи; «Как могу» естественно передаёт этот смысл по-русски.
- source_word: אֶשָּׂא
  choice: нести
  rationale: Форма глагола נשׂא здесь означает нести на себе ответственность и тяготы; «нести» сочетается со всеми последующими существительными и сохраняет образ исходного текста.
- source_word: לְבַדִּי
  choice: я один
  rationale: Передаёт, что Моисей не способен справиться с этим без помощи; порядок слов сохраняет смысловое ударение.
- source_word: טָרְחֲכֶם
  choice: ваши тяготы
  rationale: טֹרַח обозначает тягостные хлопоты, трудности или обременение. «Тяготы» передаёт изнуряющий характер забот и отличается от следующего слова «бремя».
- source_word: מַשַּׂאֲכֶם
  choice: ваше бремя
  rationale: מַשָּׂא буквально означает груз или ношу и может употребляться отвлечённо. «Бремя» естественно передаёт эту метафору в данном контексте.
- source_word: רִיבְכֶם
  choice: ваши тяжбы
  rationale: רִיב может означать распрю, спор или судебное дело. «Тяжбы» уместно отражает контекст разбирательства дел Моисеем, хотя несколько усиливает юридический оттенок; поэтому более широкие варианты приведены в сноске.
