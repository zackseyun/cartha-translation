  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: ru
  text: 'Тогда все вы подошли ко мне и сказали: «Пошлём перед собой людей, чтобы они разведали для нас землю[a] и принесли нам весть о пути, по которому нам подниматься[b], и о городах, к которым мы придём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может также означать «исследовать» или «осмотреть»; здесь речь идёт о предварительной разведке земли.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по которому нам подняться по ней». «Подниматься» сохраняет обычный библейский оборот о восхождении; местоимение в еврейском тексте может относиться к пути или к земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: И подошли вы ко мне все
  rationale: «Подошли» естественно передаёт קָרַב, а постпозиция «все» сохраняет эмфатическое כֻּלְּכֶם.
- source_word: נִשְׁלְחָה אֲנָשִׁים לְפָנֵינוּ
  choice: Пошлём перед собой людей
  rationale: Когортатив передан побудительным «пошлём»; «перед собой» выражает отправку вперёд, а «людей» здесь обозначает выбранных мужчин без неестественного для русского уточнения.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: чтобы они разведали для нас эту землю
  rationale: חָפַר может означать исследование или разведывание. «Разведали» естественно для контекста предварительного осмотра и не требует непременно понимать действие как тайное шпионство.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: и принесли нам весть
  rationale: Фраза буквально говорит о возвращении слова; «принесли нам весть» сохраняет образ и звучит естественно по-русски.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: о пути, по которому нам подняться туда
  rationale: Сохранено значение עָלָה «подняться» и привязка местоимения к земле; инфинитивная конструкция естественно передаёт обсуждаемый будущий маршрут.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: и о городах, в которые нам предстоит войти
  rationale: «Войти» ясно передаёт движение к городам и внутрь них; «предстоит» выражает ожидаемое действие, не усиливая модальность до безусловного предсказания.
