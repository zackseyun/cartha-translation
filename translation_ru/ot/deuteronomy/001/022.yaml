  source_fidelity: 'Основной смысл передан точно: все подошли к Моисею, предложили послать мужчин вперёд для разведки и получить сообщение о маршруте и городах. Однако «туда» в сочетании «по которому нам подняться туда» однозначно относит местоимение к земле, тогда как еврейское בָּהּ грамматически может относиться к «пути»; это лучше не уточнять в основном тексте. «В которые нам предстоит войти» несколько сильнее, чем «к которым/в которые мы придём» в исходном тексте.'
