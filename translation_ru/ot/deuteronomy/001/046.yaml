lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: Так вы оставались
  rationale: Глагол ישׁב в данной форме обозначает продолжительное пребывание; «оставались» естественно передаёт длительную стоянку, а «так» связывает стих с предшествующим повествованием.
- source_word: בְקָדֵשׁ
  choice: в Кадесе
  rationale: Предлог בְּ обозначает местонахождение; с названием населённого пункта по-русски естественно употребить «в».
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Буквальная и ясная передача сочетания существительного с прилагательным, сохраняющая образ исходного текста, а не заменяющая его обобщением «долгое время».
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: столько, сколько вы там пробыли
  rationale: Передаёт сравнительное כְּ и эллиптическую заключительную фразу естественным русским оборотом, не уточняя, с каким именно периодом сопоставляются эти дни. «Там» эксплицирует подразумеваемую отсылку к Кадесу.
