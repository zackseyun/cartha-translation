  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: ru
  text: 'А ваши малые дети, о которых вы говорили: «Они станут добычей», и ваши дети, которые ныне не знают, что добро, а что зло,[a] — они войдут туда. Им Я отдам эту землю, и они вступят во владение ею.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Не знают, что добро, а что зло» — еврейское выражение, указывающее на отсутствие зрелого различения.
    reason: cultural_note
  - marker: b
    text: 'Или: «унаследуют её»; также возможно: «будут владеть ею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: ваши малые дети
  rationale: טַף обозначает малых детей или зависимых членов семьи. Сочетание «малые дети» естественно по-русски и сохраняет подразумеваемую уязвимость.
- source_word: לָבַז יִהְיֶה
  choice: станут добычей
  rationale: בַּז — захваченная врагом добыча. Русское «стать добычей» ясно передаёт опасение израильтян и звучит естественно.
- source_word: בְנֵיכֶם
  choice: ваши дети
  rationale: Хотя בנים формально имеет мужскую форму, в данном контексте слово обозначает потомство, следующее поколение в целом; «дети» точно передаёт широту референции и избегает ошибочного ограничения только сыновьями.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: ныне ещё не знают, что добро, а что зло
  rationale: Формулировка сохраняет противопоставление добра и зла и одновременно естественно выражает по-русски отсутствие зрелого различения, не превращая его в отдельное доктринальное утверждение.
- source_word: שָׁמָּה
  choice: войдут туда
  rationale: שָׁמָּה указывает направление движения в ранее названную землю; с глаголом «войдут» русское «туда» передаёт это без неестественного «внутрь туда».
- source_word: אֶתְּנֶנָּה
  choice: Им Я отдам эту землю
  rationale: Местоименный суффикс относится к земле. Эксплицитное «эту землю» устраняет возможную русскую неясность, а «отдам» естественно передаёт дарование земли Богом.
- source_word: יִירָשׁוּהָ
  choice: они овладеют ею
  rationale: ירשׁ здесь означает вступить во владение обещанной землёй. «Овладеют ею» сохраняет оттенок фактического обладания, не сводя значение исключительно к юридическому наследованию.
theological_decisions:
- issue: Смысл выражения «не знают добра и зла»
  choice: Сохранить образ различения добра и зла как указание на незрелость детей.
  alternative: Истолковать выражение как утверждение о полной нравственной невиновности или особом возрасте ответственности.
  rationale: Еврейская фраза описывает отсутствие зрелого различения, но сама по себе не разрешает позднейшие богословские вопросы о невиновности или возрасте ответственности.
- issue: Характер получения земли следующим поколением
  choice: Передать ירשׁ как овладение землёй, данной Богом.
  alternative: Перевести исключительно как «унаследуют», подчёркивая юридико-заветный аспект.
  rationale: В контексте присутствуют и Божий дар, и реальное вступление во владение; выбранная формулировка сохраняет оба аспекта без чрезмерного уточнения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Порядок фраз слегка перестроен ради естественного русского синтаксиса; местоименный объект раскрыт как «эта земля». Все сноски отмечены в основном тексте.
