revisions:
- from: 'А ваши малые дети, о которых вы говорили: «Они станут добычей», и ваши дети, которые ныне ещё не знают, что добро, а что зло,[a] — они войдут туда. Им Я отдам эту землю, и они овладеют ею.[b]'
  to: 'А ваши малые дети, о которых вы говорили: «Они станут добычей», и ваши дети, которые ныне не знают, что добро, а что зло,[a] — они войдут туда. Им Я отдам эту землю, и они вступят во владение ею.[b]'
  rationale: Удалено «ещё», чтобы не вносить невыраженный в оригинале временной оттенок. «Овладеют ею» заменено на «вступят во владение ею», поскольку эта формула точнее передаёт получение и обладание обещанной Богом землёй, не акцентируя возможный оттенок захвата. Сноски сохранены на тех же смысловых узлах.
