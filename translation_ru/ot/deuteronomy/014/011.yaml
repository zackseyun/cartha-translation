  text: Всякую чистую птицу можете есть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: всякую
  rationale: Квантор имеет всеохватное значение; в сочетании с существительным в единственном числе «всякую» естественно выражает разрешение есть любую птицу из категории чистых.
- source_word: צִפּוֹר
  choice: птицу
  rationale: В данном контексте слово обычно обозначает птицу; это точный и понятный русский эквивалент без неоправданного расширения до всех летающих существ.
- source_word: טְהֹרָה
  choice: чистую
  rationale: В установлениях о пище это нормативный термин ритуально-правовой категории, противопоставленной нечистому; «чистую» сохраняет эту категорию лучше, чем отвлечённое «непорочную» или «чистую» в бытовом смысле.
- source_word: תֹּאכֵלוּ
  choice: можете есть
  rationale: Имперфект второго лица множественного числа здесь выражает дозволение в рамках пищевых предписаний, а не приказ непременно есть.
