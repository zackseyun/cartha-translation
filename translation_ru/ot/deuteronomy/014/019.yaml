  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: ru
  text: И всякое летающее мелкое существо нечисто для вас[a]; их нельзя есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякая крылатая мелкая живность». Еврейское выражение сочетает שֶׁרֶץ («мелкое, кишащее или роящееся существо») с עוֹף («летающее существо; птица») и, вероятно, обозначает прежде всего летающих насекомых, а не птиц в обычном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: И всякое
  rationale: 'Союз וְ связывает запрет с предыдущими предписаниями, а כֹל с существительным в единственном числе имеет распределительное значение: «всякое».'
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: летающее мелкое существо
  rationale: Сочетание שֶׁרֶץ с עוֹף обозначает мелких существ, способных летать, вероятнее всего прежде всего летающих насекомых. Такой перевод передаёт смысл сочетания естественнее, чем буквальное «роящееся существо птиц».
- source_word: טָמֵא
  choice: нечисто
  rationale: «Нечисто» сохраняет установленную в пищевых предписаниях категорию ритуальной нечистоты и согласуется с существительным среднего рода.
- source_word: הוּא
  choice: нечисто
  rationale: Возобновляющее местоимение отдельно не воспроизводится, поскольку в русском именная конструкция естественно передаёт утверждение без него.
- source_word: לָ/כֶם
  choice: для вас
  rationale: Формулировка сохраняет обращённость предписания к израильтянам и естественна по-русски.
- source_word: לֹא יֵאָכֵלוּ
  choice: их нельзя есть
  rationale: Безличная конструкция передаёт запрет и сохраняет множественное число еврейской глагольной формы, относя запрет ко всему названному классу существ.
