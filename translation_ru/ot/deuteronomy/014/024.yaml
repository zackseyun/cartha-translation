  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: ru
  text: И если путь окажется для тебя слишком долгим и ты не сможешь нести десятину, потому что место, которое изберёт Яхве, твой Бог, чтобы поместить там Своё имя, будет далеко от тебя, когда Яхве, твой Бог, благословит тебя,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что Яхве, твой Бог, благословит тебя». Еврейский союз здесь может иметь как временное, так и причинное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Но если
  rationale: Продолжает условное предписание предыдущего стиха; «но» естественно обозначает переход к случаю, когда исполнение затруднено.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: путь окажется для тебя слишком долгим
  rationale: Передаёт еврейскую идиому о расстоянии, превышающем практические возможности человека.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: ты не сможешь нести десятину
  rationale: Местоимение относится к десятине из ближайшего контекста; явное существительное устраняет неестественную для русского языка неясность без изменения смысла.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: место ... будет далеко от тебя
  rationale: Сохраняет пространственный смысл и важное для Второзакония обозначение избранного места поклонения.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: которое изберёт Яхве, твой Бог
  rationale: Имперфект передан будущим временем в контексте закона о месте, которое Бог ещё назначит.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное заветное имя Бога.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: чтобы поместить там Своё имя
  rationale: Сохраняет характерную для Второзакония формулу и её богословскую образность, не заменяя её толкованием.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: когда Яхве, твой Бог, благословит тебя
  rationale: Временное прочтение естественно связывает трудность перевозки с будущим изобилием, однако союз допускает и причинное значение, отмеченное в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Значение заключительного כִּי
  choice: 'временное: «когда»'
  alternative: 'причинное: «потому что»'
  rationale: В данном законодательном контексте «когда» хорошо передаёт обстоятельство будущего благословения, но грамматика допускает причинное прочтение, поэтому неоднозначность отражена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством законодательной речи. Синтаксис сохраняет незавершённость условного периода: главное предписание следует в стихе 25. Заглавное «Своё» соответствует русской традиции благоговейного написания, не добавляя нового смыслового содержания.'
