base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: ru
  text: Вы — сыны Яхве, вашего Бога.[a] Не делайте на себе надрезов и не сбривайте волосы между глазами[b] по умершему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети Яхве, вашего Бога». В еврейском тексте стоит слово мужского рода во множественном числе, буквально — «сыновья».'
    reason: lexical_alternative
  - marker: b
    text: То есть на лбу.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: сыны
  rationale: Мужское множественное число буквально означает «сыновья/сыны». «Сыны» сохраняет форму исходного текста и уместно звучит в формуле заветной принадлежности; более широкое по смыслу «дети» приведено в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Предлог לְ здесь выражает отношение или принадлежность: израильтяне — сыны Яхве. В русском именная конструкция «сыны Яхве» передаёт это без отдельного предлога.'
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Передаёт форму со значением принадлежности и сохраняет формулу отношений завета.
- source_word: תִתְגֹּדְדוּ
  choice: не делайте на себе надрезов
  rationale: Возвратная форма обозначает нанесение себе порезов, в данном контексте как траурный обычай. Формулировка ясна современному читателю и не добавляет оценки сверх запрета.
- source_word: קָרְחָה
  choice: плешь
  rationale: Существительное обозначает лишённый волос участок, сделанный как знак траура. Конкретное «плешь» точнее абстрактного «плешивость».
- source_word: בֵּין עֵינֵיכֶם
  choice: между глазами
  rationale: Сохранена буквальная и понятная древнееврейская формулировка; подразумеваемая область лба поясняется в сноске.
- source_word: לָמֵת
  choice: по умершему
  rationale: Предлог указывает на траур по поводу смерти. Русское «по умершему» естественно выражает этот смысл и сохраняет единственное число слова מֵת.
theological_decisions:
- issue: Обозначение народа завета словом мужского рода
  choice: сыны
  alternative: дети
  rationale: Основной текст сохраняет мужское множественное число בָּנִים и его образ заветного сыновства, не утверждая тем самым, что женщины исключены из общины.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано как «Яхве», а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным словом «сыны», выбранным для сохранения заветной формулы. Буквальный образ «между глазами» оставлен в тексте, а его анатомический смысл пояснён в сноске.
