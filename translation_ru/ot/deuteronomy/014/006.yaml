  source_fidelity: 'Смысл трёх обязательных признаков передан верно: животное должно иметь раздвоенное копыто, расщелину, делящую его на две части, и жевать жвачку. Однако в черновике опущено существительное после «всякое», а определительный оборот вследствие этого грамматически и стилистически неудачен.'
  naturalness: 'Формулировка «всякое, у которого» ненормативна в данном контексте: требуется явно назвать «животное». Также «разделённое на две части» без ясной привязки может быть на мгновение отнесено к животному, а не к копыту. Перестройка делает юридическое разрешение ясным и современным.'
  terminology: «Животное», «копыто» и «жуёт жвачку» — точные, естественные современные соответствия. «Расщелина делит его на две части» передаёт усиленное второе описание копыта, не добавляя несодержащихся в тексте зоологических деталей.
