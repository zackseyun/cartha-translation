  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: ru
  text: Любое животное, у которого копыто раздвоено — то есть расщелина делит его на две части, — и которое жуёт жвачку, вы можете есть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: всякое животное
  rationale: 'Сочетание имеет распределительное значение: разрешение относится к любому животному, отвечающему следующим признакам. «Животное» здесь естественнее и шире, чем «скот».'
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: у которого раздвоено копыто
  rationale: Передаёт конкретный внешний признак животного современным и понятным русским выражением.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: разделённое на две части
  rationale: 'Еврейский текст усиливает и уточняет первый признак: расщелина полностью разделяет копыто на две части. Причастный оборот согласован со словом «копыто».'
- source_word: מַעֲלַת גֵּרָה
  choice: жуёт жвачку
  rationale: Устойчивое современное русское обозначение жвачного процесса; оно естественно передаёт древнееврейскую идиому «поднимает жвачку».
- source_word: בַּבְּהֵמָה
  choice: из животных
  rationale: Фраза обозначает класс, внутри которого действуют перечисленные критерии. В русском её естественно вынести в начало предложения.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: вы можете есть
  rationale: В данном законодательном контексте форма выражает дозволение, а не обязанность употреблять таких животных в пищу.
