  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точно определить, какие именно птицы названы здесь еврейскими словами, невозможно. В древних и современных переводах встречаются, в частности, варианты «красный коршун», «коршун», «сокол» и другие названия хищных птиц.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: красного коршуна
  rationale: Точное название птицы не установлено; «красный коршун» отражает распространённое современное отождествление и отличает этот еврейский термин от последующего דַּיָּה.
- source_word: הָאַיָּה
  choice: сокола
  rationale: Название хищной птицы часто понимается как обозначение сокола, хотя в древних переводах и словарях встречается также «коршун».
- source_word: הַדַּיָּה
  choice: коршуна
  rationale: Этот термин обычно связывают с коршуном; возможное смысловое пересечение с אַיָּה не устранено искусственно и отмечено в сноске.
- source_word: לְמִינָהּ
  choice: всякого вида
  rationale: Формула обозначает все разновидности названной птицы. Такой перевод естественен по-русски и передаёт классифицирующий смысл еврейского выражения.
- source_word: וְאֶת / וְ
  choice: и
  rationale: Союз связывает элементы продолжающегося перечня; непереводимый показатель прямого дополнения отдельно в русском не выражается.
