  verdict: revise
  source_fidelity: 'Смысловые компоненты стиха в целом переданы верно: левит не имеет доли и наследственного надела, названы переселенец, сирота и вдова, их насыщение связано с благословением Яхве. Однако «вместе с тобой» неточно и неестественно передаёт עִמָּךְ в контексте отсутствия земельной доли, а «в пределах твоих ворот» является калькой, не соответствующей современному литературному русскому. Идиома «в твоих воротах» относится к поселениям/местной общине и должна быть либо сохранена в естественной форме, либо передана смыслом со сноской.'
  naturalness: «У него нет доли и наследственного надела вместе с тобой» звучит по-русски так, будто левит не может владеть чем-либо совместно с адресатом, а не как утверждение об отсутствии собственного земельного удела. «Живущие в пределах твоих ворот» также создаёт буквальный и неуместный пространственный образ. «В твоих городах» с примечанием о буквальных «воротах» естественно и сохраняет культурную информацию.
  terminology: «Левит», «переселенец», «сирота», «вдова», «наследственный надел» и «Яхве» уместны. «Переселенец» допустим для גֵּר при поясняющей сноске. «Дела твоих рук» сохраняет образ оригинала и приемлемо в умеренно библейском регистре.
