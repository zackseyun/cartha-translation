base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: ru
  text: И пусть придёт левит, ведь у него нет доли и наследственного надела среди вас; и пусть придут переселенец[a], сирота и вдова, живущие в твоих городах[b]. Пусть они едят досыта, чтобы Яхве, твой Бог, благословил тебя во всех делах твоих рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущий среди вас иноземец». Еврейское слово обозначает человека не из числа коренных израильтян, постоянно живущего среди Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в твоих воротах». Ворота здесь обозначают город или местную общину.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: пусть придёт
  rationale: В данном законодательном наставлении форма выражает предписанное или ожидаемое действие. Конструкция «пусть придёт» передаёт эту направленность естественнее, чем простое прошедшее или категорическое будущее время.
- source_word: הַלֵּוִי
  choice: левит
  rationale: Еврейское слово обозначает левита как представителя племенной и общественной группы и само по себе не уточняет, что он священник.
- source_word: חֵלֶק וְנַחֲלָה
  choice: доли и наследственного надела
  rationale: 'Сохранены оба взаимодополняющих понятия: причитающаяся доля и земельный надел, передаваемый как наследие.'
- source_word: עִמָּךְ
  choice: вместе с тобой
  rationale: Сохранено прямое обращение к Израилю в единственном числе и мысль об отсутствии у левита общей с адресатом земельной доли.
- source_word: הַגֵּר
  choice: переселенец
  rationale: Так передан не просто незнакомец, а человек иного происхождения, постоянно живущий среди Израиля и находящийся в уязвимом общественном положении.
- source_word: הַיָּתוֹם
  choice: сирота
  rationale: В современном русском языке «сирота» естественно обозначает названную в древнем праве уязвимую категорию, хотя еврейское слово может особо подразумевать ребёнка без отца.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: живущие в пределах твоих ворот
  rationale: Сохранён конкретный древнееврейский образ ворот как обозначения города и местной общины; смысл идиомы разъяснён в сноске.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: пусть они едят досыта
  rationale: Передано не просто насыщение как физиологический итог, а достаточность предоставленной пищи; русский оборот естественен и соответствует цели предписания.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: чтобы … благословил тебя
  rationale: Союз цели сохраняет связь между заботой об уязвимых и ожидаемым Божьим благословением, не превращая его в безусловное предсказание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ
  choice: во всяком деле твоих рук
  rationale: Сохранён телесный образ труда рук и охват всех дел адресата; выражение остаётся понятным и достойным в современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, личное заветное имя Бога. «Яхве» прямо передаёт имя, не заменяя его титулом и не навязывая конфессиональную традицию произношения «Иегова».
- issue: Связь благословения с исполнением предписания
  choice: «чтобы … благословил» как цель и ожидаемый результат
  alternative: «и тогда благословит» как категорическое обещание
  rationale: לְמַעַן с имперфектом допускает целевую и результирующую окраску. Выбранная формулировка сохраняет эту открытость и не усиливает высказывание до механической гарантии.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «пусть» помогает естественно согласовать единственное число первого еврейского глагола с последующим перечислением и множественным числом «пусть они едят». Сохранены прямое обращение в единственном числе, древний образ ворот и личное имя Яхве; неясные культурные реалии пояснены сносками.
