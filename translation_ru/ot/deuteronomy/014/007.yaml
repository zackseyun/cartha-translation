base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: ru
  text: 'Но вот кого вам нельзя есть из тех, кто жует жвачку, и из тех, у кого раздвоены копыта: верблюда, зайца[a] и дамана[b]. Ибо они жуют жвачку, но копыта у них не раздвоены; они нечисты для вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кролика». Еврейское название животного, вероятнее всего, означает зайца, хотя точное зоологическое определение обсуждается.'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «скальный даман». Еврейское название обычно отождествляют с даманом, хотя точное зоологическое определение обсуждается.'
    reason: lexical_clarification
lexical_decisions:
- source_word: אַךְ
  choice: Но вот
  rationale: Передаёт ограничительно-противительный смысл частицы и естественно вводит исключения из правила предыдущего стиха.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: из жующих жвачку
  rationale: Устойчивое и понятное русское обозначение описанного поведения животных.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: и из имеющих раздвоенное копыто
  rationale: Сохраняет обе части еврейского выражения и передаёт его современным естественным русским языком.
- source_word: הַגָּמָל
  choice: верблюда
  rationale: Прямое и общепринятое соответствие.
- source_word: הָאַרְנֶבֶת
  choice: зайца
  rationale: Наиболее вероятное и традиционное определение животного; возможный вариант отмечен в сноске.
- source_word: הַשָּׁפָן
  choice: дамана
  rationale: Современное зоологическое название небольшого скального млекопитающего, обычно отождествляемого с данным еврейским термином.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: Они жуют жвачку
  rationale: Естественно передаёт обобщающее настоящее время и повторяет лексику первой части стиха.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: но копыта у них не раздвоены
  rationale: Передаёт противопоставление и коллективный смысл еврейского единственного числа естественной русской конструкцией.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: они нечисты для вас
  rationale: Сохраняет широкий библейский термин «нечисты», не добавляя в основной текст уточнений «ритуально» или «обрядово».
theological_decisions:
- issue: Характер нечистоты в пищевом законе
  choice: нечисты
  alternative: ритуально нечисты; обрядово нечисты
  rationale: Еврейское טָמֵא здесь относится к установленным законом категориям чистоты, но сам стих не содержит уточняющих определений; перевод сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис слегка упрощён для ясности, однако повтор ключевых признаков животных и формула «нечисты для вас» сохранены.
