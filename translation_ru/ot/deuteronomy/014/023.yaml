  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: ru
  text: И ешь пред Яхве, твоим Богом, на месте, которое Он изберёт, чтобы водворить там Своё имя[a], десятину твоего зерна, молодого вина и масла, а также первенцев твоего крупного и мелкого скота, чтобы ты учился бояться Яхве, твоего Бога, во все дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы имя Его пребывало там»; возможно также: «чтобы поместить там Своё имя». Еврейская каузативная форма может означать «водворить, дать пребывать»; выражение является устойчивой формулой о месте, избранном Яхве для Своего имени.'
    reason: Передаёт лексико-грамматическую неоднозначность каузативной формы לְשַׁכֵּן и сохраняет образный вариант передачи формулы.
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: И ешь
  rationale: Форма с союзом в контексте предписания передаёт повелительно-директивный смысл; настоящее повелительное звучит естественно по-русски.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: пред Яхве, твоим Богом
  rationale: Сохраняет пространственно-культовый оттенок «перед, в присутствии» и передаёт тетраграмматон личным именем.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: на месте, которое Он изберёт
  rationale: Будущее время соответствует перспективе закона и устойчивой формуле Второзакония.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы там обитало Его имя
  rationale: Сохраняет древнееврейский образ обитания имени, не сводя его к абстрактному обозначению святилища; каузативный оттенок отмечен в сноске.
- source_word: מַעְשַׂר
  choice: десятину
  rationale: Общепринятый и точный термин для десятой доли урожая.
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: твоего зерна, молодого вина и масла
  rationale: Передаёт традиционную земледельческую триаду; «молодое вино» сохраняет отличие תירוש от общего названия вина.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: а также первенцев твоего крупного и мелкого скота
  rationale: Ясно раскрывает парное обозначение крупных стадных животных и мелкого скота — овец и коз.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: чтобы ты учился бояться
  rationale: Сохраняет целевое значение לְמַעַן и длительный педагогический смысл глагола «учиться».
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Достоинная и понятная формулировка, сохраняющая буквальный образ постоянства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога в исходном тексте и не заменяет его титулом.
- issue: Формула святилища לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: чтобы там обитало Его имя
  alternative: чтобы поселить там Своё имя; чтобы поместить там Своё имя
  rationale: Основной текст сохраняет напряжение между Божьей запредельностью и присутствием Его имени в избранном месте; сноска показывает возможный каузативный смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность исходного предписания, но перечисление оформлено естественно для русского языка. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской религиозно-издательской традицией.
