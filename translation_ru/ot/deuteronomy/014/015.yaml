lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: страуса
  rationale: Буквально выражение означает «дочь я‘аны», но в перечне птиц служит видовым названием. «Страус» естественно передаёт наиболее вероятное современное понимание; буквальная форма отмечена в сноске.
- source_word: הַתַּחְמָס
  choice: ястреба
  rationale: Точное отождествление птицы остаётся неясным. «Ястреб» — допустимое современное обозначение хищной птицы; неопределённость и возможная передача «сова» отмечены в сноске.
- source_word: הַשָּׁחַף
  choice: чайку
  rationale: Современные лексикографические данные чаще связывают это трудное название с чайкой или сходной морской птицей. Традиционное «кукушка» менее вероятно, но приведено как альтернатива в сноске.
- source_word: הַנֵּץ
  choice: сокола
  rationale: Слово обозначает хищную птицу и может передаваться как «ястреб» или «сокол». Выбрано «сокол», чтобы не смешивать его с תַּחְמָס в том же стихе.
- source_word: לְמִינֵהוּ
  choice: со всеми его видами
  rationale: Еврейская классификационная формула относится непосредственно к соколу и охватывает принадлежащие к этой группе разновидности. Такая передача естественна по-русски и сохраняет единственное число местоимения.
