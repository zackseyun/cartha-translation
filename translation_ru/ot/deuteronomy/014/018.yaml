lexical_decisions:
- source_word: הַחֲסִידָה
  choice: аиста
  rationale: Наиболее общепринятое соответствие — «аист»; точное зоологическое отождествление не вполне бесспорно, что отмечено в сноске.
- source_word: הָאֲנָפָה
  choice: цаплю
  rationale: Традиционное и контекстуально уместное обозначение болотной птицы; точный вид остаётся неясным.
- source_word: לְמִינָהּ
  choice: со всеми её видами
  rationale: Формула охватывает всю соответствующую группу, а не только один биологический вид; выбран естественный современный русский оборот.
- source_word: הַדּוּכִיפַת
  choice: удода
  rationale: Современная лексикография преимущественно отождествляет эту редкую древнееврейскую птицу с удодом.
- source_word: הָעֲטַלֵּף
  choice: летучую мышь
  rationale: Надёжное значение древнееврейского слова; сохраняется классификация текста по летающим существам без навязывания современной таксономии.
