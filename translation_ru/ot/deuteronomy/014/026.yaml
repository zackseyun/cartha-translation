  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: ru
  text: 'И потрать эти деньги[a] на всё, чего тебе захочется[b]: на крупный и мелкий скот, на вино и хмельной напиток[c] — на всё, чего ты пожелаешь. Ешь там перед Яхве, твоим Богом, и радуйся — ты и твои домашние.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это серебро»; здесь серебро служит деньгами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чего пожелает твоя душа»; ниже — «чего попросит твоя душа». Здесь «душа» означает самого человека как носителя желания или аппетита.'
    reason: lexical_alternative
  - marker: c
    text: «Хмельной напиток» — опьяняющий напиток, отличный от вина; точный его вид здесь не указан.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: потрать эти деньги
  rationale: В контексте покупки припасов נָתַן с «серебром» означает употребить деньги на покупку. «Потрать» естественно передаёт смысл, а «деньги» — функцию серебра как средства платежа; буквальный образ отмечен в сноске.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשְׁךָ
  choice: на всё, чего тебе захочется
  rationale: נֶפֶשׁ здесь обозначает самого человека как носителя желания, особенно в контексте еды и питья. Русская безличная конструкция естественна и не навязывает позднейшего противопоставления души и тела; буквальная антропологическая идиома сохранена в сноске.
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: на крупный или мелкий скот
  rationale: בָּקָר обозначает крупный рогатый скот, а צֹאן — мелкий стадный скот, включая овец и коз. Такая пара точнее, чем сужающее «овцы».
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: на вино или хмельной напиток
  rationale: יַיִן — вино; שֵׁכָר — опьяняющий напиток, отличный от вина. «Хмельной напиток» ясно передаёт опьяняющий характер, не создавая анахронической ассоциации с современными крепкими дистиллятами.
- source_word: וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: на всё, чего ты пожелаешь
  rationale: Вторая формула повторяет и расширяет первую. Естественное русское «пожелаешь» передаёт просьбу внутреннего желания, не перегружая фразу буквальным «попросит твоя душа».
- source_word: וְאָכַלְתָּ שָּׁם לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: Ешь там перед Яхве, твоим Богом
  rationale: Императивное «ешь» естественно передаёт предписывающее значение формы. לִפְנֵי сохранено как «перед», а личное имя יהוה передано транслитерацией «Яхве».
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: и радуйся — ты и весь твой дом
  rationale: Сохранены праздничный призыв к радости и коллективная формула «ты и твой дом». Слово «весь» естественно выражает охват домочадцев, подразумеваемый этой формулой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения, не заменяя его титулом.
- issue: Упоминание алкогольных напитков
  choice: вино или хмельной напиток
  alternative: вино или крепкий напиток; вино или пиво
  rationale: Текст прямо называет יַיִן и שֵׁכָר; перевод не смягчает этого упоминания. При этом «хмельной напиток» не отождествляет שֵׁכָר исключительно с пивом и не предполагает дистилляцию.
- issue: Значение נֶפֶשׁ в выражениях желания
  choice: чего тебе захочется / чего ты пожелаешь
  alternative: чего пожелает твоя душа / чего попросит твоя душа
  rationale: В данном контексте נֶפֶשׁ означает человека как желающего и испытывающего аппетит. Основной текст передаёт смысл естественно, а буквальная форма вынесена в сноску, чтобы сохранить антропологический образ без доктринального истолкования.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным библейским звучанием. Повелительные формы поддерживают характер предписания; тире в заключении сохраняет торжественное присоединение формулы «ты и весь твой дом».
