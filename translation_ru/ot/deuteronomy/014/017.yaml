lexical_decisions:
- source_word: הַקָּאָת
  choice: пеликан
  rationale: Точное значение названия птицы не установлено. «Пеликан» — традиционный и узнаваемый вариант, соответствующий одному из основных лексикографических толкований; неопределённость сохранена в сноске.
- source_word: הָרָחָמָה
  choice: стервятник
  rationale: Еврейское слово обозначает, вероятно, хищную птицу-падальщика. «Стервятник» естественно звучит по-русски и не создаёт излишне точного видового отождествления.
- source_word: הַשָּׁלָךְ
  choice: баклан
  rationale: Точное отождествление спорно; «баклан» — распространённая передача этого названия как рыбоядной водоплавающей птицы. Другие возможные толкования указаны в сноске.
- source_word: וְ / וְאֶת
  choice: и / без отдельного перевода
  rationale: Союз וְ передан повторяющимся «и», сохраняющим структуру перечня; показатель прямого дополнения אֵת отдельного соответствия в русском языке не имеет.
