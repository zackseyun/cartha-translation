    text: 'Буквально: «свяжи (или заверни) серебро в своей руке». Вероятно, имеется в виду надёжно связать или завернуть его для переноски в пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: обменяй всё это на серебро
  rationale: В данном контексте выражение означает обмен ранее упомянутой десятины на серебро, служившее средством платежа. «Серебро» сохраняет конкретный образ еврейского текста, а «всё это» естественно отсылает к приношению из предыдущего стиха.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: заверни серебро и возьми его с собой
  rationale: צָרַר передаёт действие связывания или заворачивания, а בְּיָדְךָ буквально значит «в твоей руке» и в данном контексте указывает на надёжное хранение серебра при переноске. Формулировка сохраняет предметный образ, но звучит естественно по-русски.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: а затем отправляйся к месту
  rationale: הלך — обычный глагол движения. «Отправляйся» естественно передаёт предписание о предстоящем пути.
- source_word: אֲשֶׁר יִבְחַר
  choice: которое изберёт
  rationale: Имперфект в этой законодательной формуле имеет естественное будущее значение; «изберёт» сохраняет торжественный, но современный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, что соответствует прямому употреблению Тетраграмматона в исходном тексте.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Стандартное обозначение отношений завета, непосредственно связанное с именем Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Конкретное «серебро» сохранено, а трудная для русского языка конструкция о связывании серебра «в руке» передана естественно и пояснена в сноске.
