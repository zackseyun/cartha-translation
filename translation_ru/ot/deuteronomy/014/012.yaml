base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: ru
  text: 'И вот каких птиц вам нельзя есть: орла[a], бородача и чёрного грифа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное отождествление еврейских названий птиц в этом стихе остаётся неясным. Слово, переведённое как «орёл», может обозначать крупного грифа; «бородач» традиционно передавался также как «ягнятник» или «костолом»; птицу, названную здесь «чёрным грифом», некоторые считают скопой или орланом.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: И вот кого
  rationale: Буквально «и вот то, что»; перед перечнем птиц естественная русская конструкция «и вот кого» передаёт указательное введение списка.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: из них вы не должны есть
  rationale: Сохраняет обращение во втором лице множественного числа, запрет и разделительное значение предлога מִן — «из их числа».
- source_word: הַנֶּשֶׁר
  choice: орла
  rationale: Традиционное и понятное соответствие; еврейское название могло обозначать также крупного грифа, поэтому неопределённость отмечена в сноске.
- source_word: הַפֶּרֶס
  choice: бородача
  rationale: Современное русское название крупной хищной птицы Gypaetus barbatus, известной также как ягнятник; передаёт наиболее вероятное современное отождествление без архаизма.
- source_word: הָעָזְנִיָּה
  choice: чёрного грифа
  rationale: Одно из распространённых современных отождествлений, хотя точный вид спорен; альтернативы вынесены в сноску.
