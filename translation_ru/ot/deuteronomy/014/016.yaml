  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точно определить, какие именно птицы названы этими еврейскими словами, невозможно. В древних и современных переводах встречаются разные варианты; чаще всего их считают различными видами сов.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: сыч
  rationale: В перечне нечистых птиц слово обозначает одну из сов; точный вид не установлен. «Сыч» — традиционно понятное и достаточно конкретное соответствие, позволяющее отличить эту птицу от двух следующих.
- source_word: יַנְשׁוּף
  choice: филин
  rationale: Слово, вероятно, обозначает ночную птицу из совиных, однако точная идентификация спорна. «Филин» естественно передаёт крупную сову и сохраняет различие между названиями в перечне.
- source_word: תִּנְשָׁמֶת
  choice: сипуха
  rationale: В данном перечне слово обозначает птицу, вероятнее всего одну из сов. «Сипуха» — современное русское название светлоокрашенной совы и уместное соответствие традиционному толкованию, хотя точный вид неизвестен.
- source_word: אֶת
  choice: не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия.
- source_word: וְ
  choice: и
  rationale: Обычный сочинительный союз, связывающий элементы перечня.
- source_word: הַ
  choice: передано формой родового наименования без артикля
  rationale: В русском языке определённый артикль отсутствует; названия птиц здесь обозначают виды или классы в перечне.
theological_decisions: []
translation_notes:
  register: Краткий перечень передан современными общеупотребительными названиями птиц. Сохранены три разные номинации исходного текста и его неопределённость посредством сноски; синтаксис согласован с продолжающимся перечнем, поэтому строка начинается со строчной буквы и заканчивается точкой с запятой.
