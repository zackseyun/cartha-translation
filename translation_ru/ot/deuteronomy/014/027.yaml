base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: ru
  text: И левита, который живёт в твоих городах[a], не оставляй[b], потому что у него нет ни доли, ни наследственного владения наряду с тобой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который в твоих воротах»; это древнееврейское выражение означает города или местные общины.'
    reason: cultural_note
  - marker: b
    text: 'Или: «не покидай его», «не оставляй его без поддержки».'
    reason: lexical_alternative
  - marker: c
    text: То есть у левита не было обычного племенного земельного удела среди Израиля.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: И левита
  rationale: Определённое существительное в единственном числе обозначает отдельного представителя левитов как сословия. «Левит» точно передаёт значение; добавление «священник» было бы неоправданным, поскольку не всякий левит был священником.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: который живёт в твоём городе
  rationale: Буквально «который в твоих воротах». В древнееврейском это устойчивое обозначение города или местной общины. В основном тексте смысл передан естественным современным русским языком, а исходный образ отмечен в сноске.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: не оставляй
  rationale: Глагол עזב допускает значения «оставлять», «покидать», «забрасывать». «Не оставляй» сохраняет широту выражения и в контексте подразумевает, что левита нельзя оставлять без поддержки.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание повеления; «потому что» ясно и естественно передаёт причинную связь.
- source_word: אֵין לוֹ
  choice: у него нет
  rationale: Естественная русская передача древнееврейской конструкции существования с предлогом принадлежности.
- source_word: חֵלֶק וְנַחֲלָה
  choice: ни доли, ни наследственного владения
  rationale: 'Союз וְ соединяет два близких, но не полностью тождественных понятия: долю и наследственное, прежде всего земельное, владение. Русская парная конструкция «ни… ни…» естественно передаёт отрицание обоих понятий.'
- source_word: עִמָּךְ
  choice: вместе с тобой
  rationale: Сохраняет прямое значение предлога и мысль о том, что у левита нет наследственного земельного удела наряду с остальными израильтянами.
theological_decisions:
- issue: Характер того, чего лишён левит
  choice: Речь идёт об отсутствии у левита обычного племенного земельного удела среди Израиля, поэтому община не должна оставлять его без поддержки.
  alternative: Речь идёт лишь об общей социальной обездоленности без особой связи с землевладением.
  rationale: Сочетание חֵלֶק וְנַחֲלָה в контексте Второзакония указывает на долю и наследственный земельный удел. Перевод сохраняет эту конкретику, не добавляя в основной текст более развёрнутого богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Идиома о воротах раскрыта в основном тексте ради понятности, а исходный образ сохранён в сноске. Единственное число и обращение на «ты» соответствуют древнееврейскому тексту.
