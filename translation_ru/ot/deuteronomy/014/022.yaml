  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: ru
  text: Непременно отделяй десятую часть от всего урожая твоих посевов, который ежегодно приносит поле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Каждый год отделяй десятую часть от всего урожая, который даёт твоё поле».'
