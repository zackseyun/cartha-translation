lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: Обязательно отделяй десятую часть
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает предписание. «Обязательно» передаёт эмфазу, а «отделяй десятую часть» ясно выражает значение глагола в современном русском языке.
- source_word: תְּבוּאַת
  choice: урожая
  rationale: Существительное обозначает сельскохозяйственный плод, продукцию или урожай. В данном контексте «урожай» звучит естественно и не ограничивает речь одной культурой.
- source_word: זַרְעֶךָ
  choice: посеянного тобой
  rationale: Буквально — «твоего семени», но в сочетании с «урожаем» имеется в виду урожай от того, что адресат посеял. Причастный оборот сохраняет образ сеяния без неестественного выражения «урожай твоего семени».
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: который поле приносит
  rationale: Буквально — «выходящего [из] поля». По-русски конструкция «поле приносит» естественно передаёт сельскохозяйственный смысл и сохраняет поле как источник урожая.
- source_word: שָׁנָה שָׁנָה
  choice: из года в год
  rationale: Повтор существительного выражает регулярность по годам. «Из года в год» передаёт повторяемость и отчасти сохраняет риторический эффект исходного повторения.
