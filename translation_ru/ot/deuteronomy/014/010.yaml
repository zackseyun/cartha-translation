  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: ru
  text: 'А всё, у чего нет плавников и чешуи, не ешьте: для вас оно нечисто.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: А всё
  rationale: כֹל имеет всеохватное значение «всё», а ו здесь вводит противопоставление разрешению предыдущего стиха; русское «А» естественно передаёт этот переход.
- source_word: אֲשֶׁר אֵין ל/וֹ
  choice: у чего нет
  rationale: Относительная конструкция с אֵין и местоименным суффиксом выражает отсутствие признака; «у чего нет» точно и естественно по-русски.
- source_word: סְנַפִּיר וְ/קַשְׂקֶשֶׂת
  choice: плавников и чешуи
  rationale: В классифицирующем предписании естественны множественное «плавников» и собирательное «чешуи»; они передают два требуемых признака водных существ.
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Отрицательная форма второго лица множественного числа в законодательном контексте передана прямым запретом современного литературного русского языка.
- source_word: טָמֵא
  choice: нечисто
  rationale: В контексте предписаний о чистоте טָמֵא обозначает установленную категорию нечистоты; «нечисто» сохраняет принятую библейскую терминологию.
- source_word: הוּא לָ/כֶם
  choice: для вас оно нечисто
  rationale: Предложная группа לָכֶם указывает на статус по отношению к Израилю; «для вас» сохраняет эту относительную направленность, а «оно» передаёт הוּא.
