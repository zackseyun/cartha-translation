base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/004.yaml
  text: 'These are the animals that you may eat: the ox[a], the sheep, and the goat.'
translation:
  language: ru
  text: 'Вот животные, которых вам можно есть: крупный рогатый скот, овцы и козы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «Вот животное, которое вы можете есть»; единственное число вводит собирательную категорию, после чего перечисляются её виды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Вот животные
  rationale: Формально сочетание стоит в единственном числе («вот животное»), но существительное употреблено собирательно и вводит перечень разрешённых видов; русское множественное число естественно передаёт эту функцию.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: которых вам можно есть
  rationale: В контексте пищевых предписаний оборот выражает разрешение, а не обязанность; «можно есть» ясно передаёт этот смысл.
- source_word: שׁוֹר
  choice: крупный рогатый скот
  rationale: Слово обозначает животное из рода крупного рогатого скота и здесь входит в перечень категорий. Такое обозначение не сужает смысл до быка или вола определённого пола и состояния.
- source_word: שֵׂה כְשָׂבִים
  choice: овцы
  rationale: Сочетание буквально указывает на мелкое животное из овечьего стада; «овцы» естественно передаёт категорию без неоправданного ограничения по возрасту.
- source_word: וְשֵׂה עִזִּים
  choice: и козы
  rationale: Параллельное сочетание обозначает мелкое животное из козьего стада; «козы» передаёт видовую категорию без неоправданного ограничения до козлёнка.
