  yaml_path: translation/ot/deuteronomy/014/005.yaml
  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: ru
  text: оленя[a], газель, косулю, дикого козла, козерога, антилопу и горного барана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное значение нескольких названий животных в этом стихе неизвестно. «Косуля» может означать лань или благородного оленя; «дикий козёл» — козерога; «козерог» — также аддакса или дикого козла; «антилопа» — дикого быка или тура; «горный баран» — серну или горного козла.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: олень
  rationale: Общее и понятное современному читателю обозначение оленя; не сужает значение до самца, как «олень-самец».
- source_word: צְבִי
  choice: газель
  rationale: Наиболее распространённое современное отождествление; точнее традиционных, но менее определённых вариантов вроде «антилопа».
- source_word: יַחְמוּר
  choice: косуля
  rationale: Передаёт животное из семейства оленевых, не создавая чрезмерно экзотического звучания; точный вид остаётся спорным и отмечен в сноске.
- source_word: אַקּוֹ
  choice: дикий козёл
  rationale: Прозрачное обозначение дикого представителя козьих; возможное более узкое отождествление с козерогом сохранено в сноске.
- source_word: דִישֹׁן
  choice: козерог
  rationale: Вероятное, хотя не бесспорное, обозначение дикого горного козла; неопределённость зоологической идентификации сохранена.
- source_word: תְאוֹ
  choice: антилопа
  rationale: Читаемое современное обозначение крупного дикого жвачного; альтернативное понимание как дикого быка или тура приведено в сноске.
- source_word: זָמֶר
  choice: горный баран
  rationale: Понятное описательное наименование горного копытного; традиционные отождествления с серной или горным козлом не выдаются за несомненные.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; названия животных даны в винительном падеже как продолжение перечня разрешённых в пищу животных. Сноска [a] относится ко всему перечню и сохраняет реальную неопределённость редких древнееврейских зоонимов.
