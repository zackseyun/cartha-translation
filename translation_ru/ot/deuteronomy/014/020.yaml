  rationale: В пищевом законодательстве это установленная ритуальная категория, а не указание на физическую чистоту или нравственную непорочность.
- source_word: תֹּאכֵלוּ
  choice: можете есть
  rationale: В контексте противопоставления запрещённой и разрешённой пищи форма выражает дозволение; такой перевод естественно передаёт правовую силу высказывания.
