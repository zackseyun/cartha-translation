base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: ru
  text: Не ешьте никакой падали[a]. Можете отдать её переселенцу[b], живущему в ваших городах[c], чтобы он её съел, или продать её чужеземцу. Ведь вы — святой народ, принадлежащий Яхве, вашему Богу. Не варите козлёнка в молоке его матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть туши животного, умершего само собой или не заколотого дозволенным образом.
    reason: lexical_alternative
  - marker: b
    text: «Переселенец» — некоренной житель, постоянно живущий среди израильтян; он отличается от «чужеземца» далее в стихе.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в твоих воротах» — еврейское выражение, означающее проживание в городах или общинах Израиля. Еврейский правовой стиль можно также передать как предписание: «отдайте её… пусть он ест её; или продайте её чужеземцу».'
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: נְבֵלָה
  choice: падаль
  rationale: Обозначает тушу животного, умершего само или не заколотого дозволенным образом. «Падаль» кратко и естественно передаёт пищевой запрет, хотя в русском слове возможен отрицательный оттенок.
- source_word: גֵּר
  choice: переселенец
  rationale: Это не коренной израильтянин, постоянно живущий среди Израиля и имеющий определённое общественно-правовое положение; слово отличает его от נָכְרִי.
- source_word: בִּשְׁעָרֶיךָ
  choice: в ваших городах
  rationale: Буквально «в твоих воротах»; в данном правовом контексте ворота представляют городскую общину и территорию её юрисдикции. Русское «в ваших городах» ясно передаёт смысл идиомы.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: можете отдать её… и он может есть её
  rationale: 'В правовом контексте формы допускают разрешительный смысл: израильтянину запрещено есть такую тушу, но разрешено передать её не израильтянину.'
- source_word: נָכְרִי
  choice: чужеземец
  rationale: Обозначает иностранца, не обладающего положением постоянно живущего среди Израиля переселенца; «чужеземец» сохраняет отличие от גֵּר.
- source_word: עַם קָדוֹשׁ
  choice: святой народ
  rationale: Устоявшееся и содержательно точное обозначение народа, посвящённого Богу.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, а предлог выражает посвящённость и принадлежность народа Яхве.
- source_word: גְּדִי
  choice: козлёнок
  rationale: В данном устойчивом запрете означает молодое животное из коз; «козлёнок» ясно и естественно для современного русского читателя.
- source_word: תְבַשֵּׁל
  choice: варите
  rationale: Глагол обозначает приготовление посредством варки и здесь точнее общего «готовьте».
- source_word: בַּחֲלֵב אִמּוֹ
  choice: в молоке его матери
  rationale: Прямо сохраняет конкретный образ и синтаксическое отношение исходного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное заветное имя; «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Сила правовых форм при отдаче и продаже падали
  choice: 'разрешение: «можете отдать… или продать»'
  alternative: 'предписание: «отдайте… или продайте»'
  rationale: Контекст прежде всего запрещает израильтянам употребление в пищу и допускает передачу другим. Разрешительная формулировка естественна по-русски, а возможность более формального предписывающего прочтения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и заветного контекста. Множественное обращение передано последовательно, несмотря на морфологически единственное число во второй половине еврейского стиха, поскольку по смыслу адресат — весь Израиль. Лексическое различие между גֵּר и נָכְרִי сохранено как «переселенец» и «чужеземец».
