  - severity: low
    issue: «От урожая своего»
    rationale: Инверсия допустима, но воспринимается как несколько архаизирующая. «От твоего урожая» естественнее в целевом современном литературном варианте.
  - severity: low
    issue: «В своих городах»
    rationale: Перевод смысловой допустим, но «в пределах твоих городов» лучше отражает буквальное «в твоих воротах» как обозначение местной городской юрисдикции.
