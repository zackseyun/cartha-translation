base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: ru
  text: По окончании каждых трёх лет[a] выноси всю десятину от твоего урожая за тот год и оставляй её в пределах твоих городов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в каждый третий год».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в твоих воротах»; имеются в виду местные города или поселения.'
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: По окончании каждых трёх лет
  rationale: Передаёт временную точку מִקְצֵה и повторяющийся трёхлетний порядок; возможное понимание «в каждый третий год» отмечено в сноске.
- source_word: תּוֹצִיא
  choice: выноси
  rationale: Каузатив от יצא буквально означает «выносить, извлекать»; форма русского повелительного наклонения естественно передаёт предписание во втором лице.
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  choice: всю десятину от урожая своего
  rationale: «Всю» сохраняет идею полноты כָּל, «десятина» точно передаёт מַעְשֵׂר, а «урожай» естественно обозначает сельскохозяйственный доход תְּבוּאָה.
- source_word: בַּשָּׁנָה הַהִוא
  choice: за тот год
  rationale: В данном контексте оборот указывает на десятину, причитающуюся с урожая соответствующего года; по-русски «за тот год» выражает эту связь яснее, чем буквальное «в тот год».
- source_word: וְהִנַּחְתָּ
  choice: и складывай её
  rationale: Передаёт размещение и оставление десятины на месте для хранения; местоимение «её» делает объект ясным без изменения смысла.
- source_word: בִּשְׁעָרֶיךָ
  choice: в своих городах
  rationale: Буквально «в твоих воротах», но в библейском употреблении ворота метонимически обозначают подвластные человеку местные города или поселения. Идиоматический перевод понятнее современному русскому читателю, а буквальный образ сохранён в сноске.
