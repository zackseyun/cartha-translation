revisions:
- from: Ведь ты — святой народ, принадлежащий Яхве, твоему Богу, и Яхве избрал тебя, чтобы ты был его народом — драгоценным достоянием[a] из всех народов, живущих на земле.
  to: Ведь ты — святой народ, принадлежащий Яхве, твоему Богу; Яхве избрал тебя из среды всех народов, живущих на земле, чтобы ты был для него народом — его драгоценным достоянием[a].
  rationale: Правка устраняет двусмысленность в области действия «из всех народов», помещая этот оборот при «избрал», и более явно передаёт конструкцию «быть для него народом». Значение, регистр, личное имя Бога и сноска сохранены.
