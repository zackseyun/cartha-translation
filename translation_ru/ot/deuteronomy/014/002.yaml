  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וּ/בְ/ךָ֞ בָּחַ֣ר יְהוָ֗ה לִֽ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: ru
  text: Ведь ты — святой народ, принадлежащий Яхве, твоему Богу; Яхве избрал тебя из среды всех народов, живущих на земле, чтобы ты был для него народом — его драгоценным достоянием[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «особо ценимым народом». Еврейское סְגֻלָּה означает владение, которое особенно дорого своему владельцу.'
    reason: Лексическая альтернатива поясняет образ драгоценного достояния и возможность отнести определение непосредственно к народу.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего запрета; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: עַם קָדוֹשׁ
  choice: святой народ
  rationale: Выражение обозначает народ, посвящённый Богу; этот вариант точен, естественен и сохраняет богословское значение святости.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: принадлежащий Яхве, твоему Богу
  rationale: Предлог ל здесь указывает на отношение и принадлежность. Явное «принадлежащий» делает этот смысл понятным по-русски, не сводя святость лишь к нравственному качеству.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога сохраняет его заветное употребление в еврейском тексте.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: и Яхве избрал тебя
  rationale: С предлогом ב глагол בחר образует конструкцию выбора лица; по-русски объект естественно выражается винительным падежом.
- source_word: לִהְיוֹת לוֹ
  choice: чтобы ты был его
  rationale: Инфинитивная конструкция выражает цель или результат избрания, а местоимение передаёт принадлежность Богу.
- source_word: לְעַם סְגֻלָּה
  choice: его народом — драгоценным достоянием
  rationale: Так сохраняются и явное עַם «народ», и значение סְגֻלָּה как особо ценимого владения; приложение с тире звучит естественно по-русски.
- source_word: מִכֹּל הָעַמִּים
  choice: из всех народов
  rationale: Предлог מן обозначает выбор из числа народов, не требуя сравнительного смысла «выше всех».
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: живущих на земле
  rationale: Это естественная русская передача еврейского выражения о народах, находящихся на поверхности земли; причастие «живущих» делает подразумеваемое отношение явным без изменения смысла.
theological_decisions:
- issue: Характер избрания Израиля
  choice: Передать избрание как выбор Яхве, в результате которого народ принадлежит ему и становится его драгоценным достоянием.
  alternative: Перевести מִכֹּל как «выше всех народов» или развернуть стих в учение об этническом превосходстве либо в позднейшую систему представлений об избрании.
  rationale: Еврейский текст говорит о выборе Израиля из числа всех народов и о его особой принадлежности Яхве, но сам по себе не утверждает этнического превосходства и не раскрывает позднейших богословских систем.
- issue: Святость народа
  choice: Сохранить «святой» и пояснить принадлежность Яхве синтаксически.
  alternative: Передать только как нравственную безупречность или заменить словом «особый».
  rationale: קָדוֹשׁ включает идею посвящённости и отделённости для Бога; перевод не должен сужать её до нравственного состояния или ослаблять до общей исключительности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Личное имя передано как «Яхве»; местоимения, относящиеся к Богу, написаны со строчной буквы в соответствии с нейтральной современной издательской практикой.
