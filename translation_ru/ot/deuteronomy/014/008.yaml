base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: ru
  text: А свинья нечиста для вас, ибо у неё раздвоенное копыто, но жвачки она не жуёт. Не ешьте их мяса и не прикасайтесь к их тушам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте при словах «мяса» и «тушам» стоят суффиксы множественного числа: «их мяса» и «их туш». Возможно, этим запрет относится к животным данного разряда в целом.'
    reason: Поясняет переход от единственного числа («свинья») к множественным суффиксам в еврейском тексте, сохранённый в русском переводе.
lexical_decisions:
- source_word: הַחֲזִיר
  choice: свинья
  rationale: Обычное современное название животного; точно и без ненужной архаизации.
- source_word: כִּי מַפְרִיס פַּרְסָה הוּא וְלֹא גֵרָה
  choice: хотя у неё раздвоено копыто, жвачки не жуёт
  rationale: 'Передаёт противопоставление двух признаков: один у свиньи присутствует, другой отсутствует. Русское «хотя» естественно выражает уступительное отношение, возникающее в данном контексте.'
- source_word: טָמֵא הוּא לָכֶם
  choice: она нечиста для вас
  rationale: «Нечиста» сохраняет установленную в законе категорию ритуально-пищевой нечистоты, не превращая её в нравственную оценку.
- source_word: מִבְּשָׂרָם
  choice: их мяса
  rationale: Передан партитивный смысл предлога מִן и сохранён множественный суффикс исходного текста. В русском «мясо» в пищевом запрете естественнее, чем буквальное «плоть».
- source_word: נִבְלָתָם
  choice: их трупам
  rationale: Слово обозначает мёртвое тело животного; множественное число сохраняет форму еврейского текста.
- source_word: תִגָּעוּ
  choice: не прикасайтесь
  rationale: Прямо и естественно передаёт запрет касаться, не расширяя его до запрета приближаться или иметь любой контакт.
theological_decisions:
- issue: Характер нечистоты в пищевом законе Торы
  choice: нечиста для вас
  alternative: осквернена; порочна
  rationale: Перевод сохраняет правовую категорию нечистоты и её применимость к общине, не внося утверждения о нравственном зле животного.
- issue: Сила запрета касаться мёртвых животных
  choice: не прикасайтесь
  alternative: не берите в руки; не приближайтесь
  rationale: Сохранён прямой запрет глагола נגע без его неоправданного сужения или расширения.
- issue: Переход от единственного числа «свинья» к множественным суффиксам
  choice: сохранить «их мяса» и «к их трупам» с пояснением
  alternative: 'согласовать по-русски в единственном числе: «её мяса», «к её трупу»'
  rationale: В масоретском тексте оба местоименных суффикса имеют форму множественного числа. Перевод не устраняет эту особенность молча, поскольку она может относить заключительный запрет к рассматриваемому классу животных.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательного текста. Синтаксис сделан ясным для обычного читателя; традиционный термин «нечиста» сохранён. Необычный переход к множественному числу оставлен в основном тексте и пояснён сноской.
