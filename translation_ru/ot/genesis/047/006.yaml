base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: ru
  text: Земля Египта перед тобой[a]. Посели своего отца и своих братьев в лучшей части страны; пусть они живут в земле Гошен. А если ты знаешь, что среди них есть способные люди[b], назначь их управляющими над моим скотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «перед тобой» — еврейская идиома; здесь оно может означать, что Иосифу предоставлено право выбрать место в Египте.
    reason: cultural_note
  - marker: b
    text: 'Или: «умелые люди», «люди, способные к делу»; буквально: «люди силы». В этом хозяйственном контексте выражение не обязательно подразумевает воинскую доблесть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: Земля Египетская перед тобой
  rationale: Сохраняет образ еврейской идиомы לְפָנֶיךָ; в контексте она означает, что страна открыта для выбора места.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: в лучшей части страны
  rationale: מֵיטַב обозначает лучшую, отборную часть; добавление «части» естественно передаёт партитивный смысл.
- source_word: הוֹשֵׁב
  choice: Посели
  rationale: Каузативная форма глагола ישׁב означает веление устроить кого-либо на жительство.
- source_word: יֵשְׁבוּ
  choice: пусть они живут
  rationale: Передаёт проживание в данном месте современным и естественным русским языком.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: в земле Гошен
  rationale: Сохраняет явно выраженное в еврейском тексте слово אֶרֶץ, «земля».
- source_word: אַנְשֵׁי חַיִל
  choice: способные люди
  rationale: В хозяйственно-административном контексте выражение указывает на силу, умение и пригодность, а не обязательно на воинскую доблесть.
- source_word: וְשַׂמְתָּם
  choice: поставь их
  rationale: Глагол שׂים буквально значит «поставить, поместить» и здесь обозначает назначение на ответственную должность.
- source_word: שָׂרֵי מִקְנֶה
  choice: надзирателями над моим скотом
  rationale: שָׂרֵי обозначает начальников или распорядителей, а מִקְנֶה — принадлежащий владельцу скот; формулировка ясна в хозяйственном контексте.
- source_word: עַל אֲשֶׁר לִי
  choice: над моим скотом
  rationale: Буквально «над тем, что у меня»; контекст связывает притяжательное выражение со скотом фараона.
