translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён еврейский образ «перед тобой», а его идиоматический смысл пояснён в сноске. Формы «отца и братьев своих» поддерживают достоинство речи, не делая её архаичной.
