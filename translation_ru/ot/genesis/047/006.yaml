revisions:
- from: Земля Египетская перед тобой[a]. Посели отца и братьев своих в лучшей части страны; пусть они живут в земле Гошен. А если знаешь, что среди них есть способные люди[b], поставь их надзирателями над моим скотом.
  to: Земля Египта перед тобой[a]. Посели своего отца и своих братьев в лучшей части страны; пусть они живут в земле Гошен. А если ты знаешь, что среди них есть способные люди[b], назначь их управляющими над моим скотом.
  rationale: Правка заменяет неточное «надзирателями» на «управляющими», сохраняет иерархический и хозяйственный смысл еврейского שָׂרֵי מִקְנֶה и делает синтаксис более естественным для современного литературного русского. Идиома «перед тобой» сохранена, а её контекстуальный смысл пояснён сноской. Обновлённая сноска b точнее отражает диапазон אנשי חיל, не навязывая военного значения.
