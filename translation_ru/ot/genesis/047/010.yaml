  text: Иаков благословил фараона и вышел из его присутствия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «попрощался с фараоном» или «поприветствовал фараона»; еврейский глагол обычно означает «благословил», но в обстановке царской аудиенции мог также обозначать церемониальное приветствие или прощание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Основное значение глагола ברך — «благословлять». Оно предпочтительно и согласуется с тем же действием Иакова в Быт. 47:7; придворный контекст допускает оттенок церемониального приветствия или прощания, отмеченный в сноске.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Традиционная и общепринятая русская форма имени יעקב.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель определённого прямого дополнения в русском языке отдельного соответствия не имеет.
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Общепринятая русская форма египетского царского титула; винительный падеж передаёт синтаксическую роль прямого дополнения.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא конкретно обозначает выход или удаление; «вышел» естественно передаёт завершение царской аудиенции.
- source_word: מִלִּפְנֵי פַרְעֹה
  choice: от него
  rationale: Буквально «от лица/из присутствия фараона». После непосредственного упоминания фараона местоименная передача естественна по-русски и ясно обозначает удаление Иакова с аудиенции.
