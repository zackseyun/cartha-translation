lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Вайиктоль продвигает повествование; «тогда» естественно передаёт последовательность событий в современном русском языке.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского царя; в данном употреблении пишется со строчной буквы как титул.
- source_word: אֶל־יוֹסֵף
  choice: Иосифу
  rationale: Русский дательный падеж естественно обозначает адресата речи и передаёт сочетание предлога אֶל с именем.
- source_word: לֵאמֹר
  choice: не передано отдельным словом
  rationale: После глагола речи еврейский инфинитив служит формулой введения прямой речи; русское «говоря» здесь было бы избыточно.
- source_word: אָבִיךָ
  choice: твой отец
  rationale: Прямая передача существительного с притяжательным суффиксом второго лица единственного числа.
- source_word: וְאַחֶיךָ
  choice: и твои братья
  rationale: Сохранено конкретное родственное обозначение «братья», без необоснованного обобщения до «семья».
- source_word: בָּאוּ
  choice: пришли
  rationale: Еврейский перфект сообщает о завершившемся прибытии; в русском контексте естественна форма прошедшего времени совершенного вида.
- source_word: אֵלֶיךָ
  choice: к тебе
  rationale: Передаёт направление движения к Иосифу без добавления отсутствующего в оригинале наречия «сюда».
