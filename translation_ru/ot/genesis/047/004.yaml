base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: ru
  text: 'Они сказали фараону: «Мы пришли жить в этой земле как пришельцы[a], потому что для стад твоих слуг нет пастбищ: в земле Ханаанской стоит тяжёлый голод. И теперь, пожалуйста, позволь твоим слугам жить в земле Гесем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «временно жить в этой земле».'
    reason: 'Лексическая альтернатива: גור может подчёркивать как положение пришельцев, так и временность проживания.'
lexical_decisions:
- source_word: לָגוּר
  choice: пожить … как чужеземцы
  rationale: Глагол גור обозначает проживание в качестве пришельца или временного жителя, а не окончательное переселение; сочетание естественно передаёт обе стороны значения.
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: אֶרֶץ здесь означает территорию Египта, о которой говорят собеседники; указательное «этой» естественно в русском контексте и не меняет референцию.
- source_word: מִרְעֶה
  choice: пастбищ
  rationale: Слово обозначает место выпаса или пастбищные угодья; множественное число по-русски естественно при речи о стадах.
- source_word: לַצֹּאן אֲשֶׁר לַעֲבָדֶיךָ
  choice: для стад твоих слуг
  rationale: צֹאן — собирательное обозначение мелкого скота, а конструкция אֲשֶׁר לְ выражает принадлежность. «Стада» не ограничивает смысл только овцами.
- source_word: כָבֵד הָרָעָב
  choice: стоит жестокий голод
  rationale: כָבֵד буквально означает «тяжёлый», но применительно к голоду указывает на его крайнюю тяжесть; русское выражение передаёт это идиоматично.
- source_word: יֵשְׁבוּ נָא
  choice: позволь, пожалуйста, … поселиться
  rationale: Юссив с נָא выражает почтительную просьбу. «Поселиться» передаёт проживание в указанной местности, не обязательно подразумевая окончательную оседлость.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: В обращении к фараону это почтительное самоназвание просителей; «рабы» неоправданно выдвинуло бы на первый план их правовой статус.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: земля Гесем
  rationale: Сохраняется явное географическое обозначение еврейской конструкции; «Гесем» — укоренившаяся русская форма топонима.
