  terminology: «Пришельцы» хорошо передаёт גור без навязывания точной продолжительности проживания; сноска сохраняет временной оттенок как допустимую альтернативу. «Твои слуги» уместно в придворном обращении. Топоним «Гесем» оставлен в принятой русской библейской форме.
