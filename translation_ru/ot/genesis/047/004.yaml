revisions:
- from: 'Они сказали фараону: «Мы пришли пожить в этой земле как чужеземцы[a], потому что для стад твоих слуг нет пастбищ: в земле Ханаанской стоит жестокий голод. Поэтому позволь, пожалуйста, твоим слугам поселиться в земле Гесем»'
  to: 'Они сказали фараону: «Мы пришли жить в этой земле как пришельцы[a], потому что для стад твоих слуг нет пастбищ: в земле Ханаанской стоит тяжёлый голод. И теперь, пожалуйста, позволь твоим слугам жить в земле Гесем».'
