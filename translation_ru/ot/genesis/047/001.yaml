  source_fidelity: 'В основном передача точна: сохранены прибытие, перечисление имущества и местонахождение в Гесеме. Однако «теперь они» передаёт временной результат, тогда как וְהִנָּם прежде всего дейктически указывает: «вот они / вот они находятся». Формулировка «со своими стадами — мелким и крупным скотом» смешивает общее обозначение со следующим пояснением и не вполне ясно передаёт два отдельных термина צֹאן и בָּקָר.'
