base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: ru
  text: 'Иосиф пришёл к фараону и сообщил ему[a]: «Мой отец и мои братья со своим мелким и крупным скотом и со всем, что у них есть, пришли из земли Ханаанской; и вот они в земле Гесем[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сообщил фараону и сказал».'
    reason: previous_rendering
  - marker: b
    text: 'Или: «и вот, они в земле Гесем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл к фараону
  rationale: בוא допускает значения «приходить», «идти», «входить». В придворном контексте естественное русское выражение «пришёл к фараону» передаёт прибытие Иосифа к нему, не добавляя прямо не названного помещения.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: сообщил ему
  rationale: Два последовательных глагола буквально означают «сообщил фараону и сказал». В русском введение прямой речи одним глаголом устраняет неестественную избыточность; сноска сохраняет формальную структуру оригинала.
- source_word: אָבִי וְאַחַי
  choice: мой отец и мои братья
  rationale: Прямая передача притяжательных форм; «братья» точно соответствует мужскому множественному числу в данном контексте.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: со своими стадами — мелким и крупным скотом
  rationale: צאן обозначает преимущественно мелкий скот, то есть овец и коз, а בקר — крупный рогатый скот. Формулировка сохраняет различие и звучит понятно по-русски.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: и со всем, что у них есть
  rationale: Близкая к еврейскому тексту и естественная русская формулировка, охватывающая всё имущество семьи.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: пришли из земли Ханаанской
  rationale: Еврейский перфект описывает завершившееся прибытие с очевидным результатом в настоящем; русское прошедшее время естественно выражает это без отдельной грамматической формы перфекта.
- source_word: וְהִנָּם
  choice: теперь они
  rationale: הנה с местоименным суффиксом привлекает внимание к их нынешнему местонахождению. «Теперь они» передаёт актуальный результат прибытия естественнее, чем книжное «вот» в этой реплике; альтернативная дейктическая передача дана в сноске.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: в земле Гесем
  rationale: Сохранено явное אֶרֶץ «земля» и употреблена традиционная русская библейская форма топонима «Гесем».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис прямой и понятный; традиционные географические формы «земля Ханаанская» и «Гесем» сохранены. Тире поясняет различие между двумя видами скота без перегрузки перечисления.
