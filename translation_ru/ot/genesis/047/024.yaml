  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: ru
  text: 'Когда будете собирать урожай, отдавайте пятую часть фараону, а четыре пятых[a] пусть остаются у вас: на семена для поля, в пищу вам и тем, кто живёт в ваших домах, и на пропитание вашим детям.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «четыре руки»; это идиома, означающая четыре оставшиеся части из пяти, то есть четыре пятых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: когда соберёте урожай
  rationale: תְּבוּאָה означает урожай, плоды или продукцию земли; сочетание с ב в данном распорядительном контексте естественно передаётся временной конструкцией.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: отдавайте пятую часть фараону
  rationale: חֲמִישִׁית обозначает одну пятую; форма «отдавайте» естественно выражает постоянное правило, устанавливаемое Иосифом.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: а четыре пятых
  rationale: Буквально «четыре доли/руки»; в контексте после передачи одной пятой речь идёт о четырёх оставшихся долях из пяти. Передача долей дробью ясна современному читателю, а буквальный образ отмечен в сноске.
- source_word: יִהְיֶה לָכֶם
  choice: пусть остаются у вас
  rationale: Выражает предоставление оставшейся части земледельцам; выбранная формулировка естественна в контексте распределения урожая.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: на семена для поля
  rationale: Ламед указывает на назначение зерна для будущего посева; «для поля» сохраняет целевой смысл.
- source_word: וּלְאָכְלְכֶם
  choice: в пищу вам
  rationale: Субстантивированная форма от אכל обозначает пищу или употребление в пищу; формулировка сохраняет структуру перечня.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: и тем, кто живёт в ваших домах
  rationale: Относительная конструкция, вероятнее всего, указывает на людей в составе домашних хозяйств. Глагол «живёт» добавлен для естественности русского синтаксиса, не сужая обозначение до одной категории слуг или родственников.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: и на пропитание вашим детям
  rationale: טַף обычно обозначает малых детей, а иногда зависимых членов семьи; в семейном контексте «детям» звучит естественно и сохраняет основной смысл.
