  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: ru
  text: Что же до народа, то он переселил его[a] в города — от одного края Египта до другого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перевёл в города». В некоторых переводах, следующих другому чтению еврейского текста, сказано, что Иосиф сделал народ рабами; однако еврейский текст здесь непосредственно говорит о переселении.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: народ
  rationale: Собирательное существительное обозначает население Египта, затронутое мерами Иосифа; «народ» естественно передаёт это значение по-русски.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: он переселил
  rationale: Каузативная форма глагола עבר означает «заставить перейти, переместить, перевести». В данном контексте «переселил» ясно передаёт перемещение людей, не добавляя отсутствующей в масоретском тексте идеи порабощения.
- source_word: לֶעָרִים
  choice: в города
  rationale: Предлог ל здесь естественно понимается как указание направления или места назначения; «в города» передаёт переселение в городские центры.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: от одного края Египта до другого
  rationale: Это выражение охватывает всю протяжённость страны. Такой перевод естественен по-русски и не создаёт ошибочного впечатления, будто речь идёт лишь о пограничной линии.
theological_decisions:
- issue: Характер действий Иосифа по отношению к населению Египта
  choice: он переселил народ в города
  alternative: он обратил народ в рабство; он переводил народ из города в город
  rationale: Масоретский текст непосредственно говорит о перемещении или переселении. Вариант о порабощении основан на ином текстовом понимании и не должен подменять чтение WLC; вариант «из города в город» грамматически менее прям.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и повествовательная. Союз «А» сохраняет тематическое выдвижение народа, а тире естественно вводит указание на полный охват территории.
