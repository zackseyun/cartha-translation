  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: ru
  text: '«Когда я упокоюсь с моими предками[a], вынеси меня из Египта и похорони в месте их погребения[c]». Он сказал: «Я сделаю, как ты сказал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и я лягу с моими отцами»; в еврейском это обычный образ, связанный со смертью и погребением.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в их могиле» или «в их гробнице».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Когда я почИю
  rationale: Глагол שׁכב буквально означает «лечь», а в данном погребальном контексте служит устойчивым образом смерти. «Почию» естественно передаёт этот образ по-русски, не заменяя его прямым «умру»; союз וְ по смыслу вводит временное придаточное.
- source_word: עִם אֲבֹתַי
  choice: с моими отцами
  rationale: Сохраняет родственный и формульный характер еврейского выражения; здесь «отцы» означает предков.
- source_word: וּנְשָׂאתַנִי
  choice: вынеси меня
  rationale: נשא здесь означает перенести тело; «вынеси» вместе с מִמִּצְרַיִם ясно выражает движение из Египта.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог מן указывает на удаление из страны.
- source_word: וּקְבַרְתַּנִי
  choice: похорони
  rationale: Прямое современное соответствие глаголу קבר в данном контексте.
- source_word: בִּקְבֻרָתָם
  choice: там, где погребены они
  rationale: Передаёт место их погребения естественным русским оборотом, не уточняя без необходимости, была ли это могила, гробница или более общее место захоронения.
- source_word: וַיֹּאמַר
  choice: Он ответил
  rationale: В контексте это реплика в ответ на просьбу; такое оформление сохраняет простой ход повествования и естественно звучит по-русски.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Я сделаю
  rationale: Отдельное местоимение אָנֹכִי придаёт ответу личную уверенность; в русском она естественно выражается явным «я».
- source_word: כִדְבָרֶךָ
  choice: как ты сказал
  rationale: Естественно передаёт буквальное «согласно твоему слову», то есть обещание исполнить просьбу.
