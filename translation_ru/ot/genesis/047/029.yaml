base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: ru
  text: 'Когда приблизились дни, в которые Израилю предстояло умереть, он призвал своего сына Иосифа и сказал ему: «Если я нашёл благоволение в твоих глазах, положи, прошу, руку под моё бедро[a] и окажи мне неизменную милость и верность[b]. Прошу, не хорони меня в Египте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Положение руки под бедро было жестом, сопровождавшим торжественную клятву в повествованиях о патриархах; сравните Бытие 24:2.
    reason: cultural_note
  - marker: b
    text: 'Еврейское сочетание חֶסֶד וֶאֱמֶת обозначает преданную, надёжную доброту и верность; возможно также: «неизменную любовь и верность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Когда приблизилось время смерти Израиля
  rationale: Еврейская идиома буквально говорит о приблизившихся днях, когда Израилю надлежало умереть. По-русски буквальная конструкция звучала бы неестественно; «приблизилось время смерти» ясно передаёт смысл и сохраняет образ приближения.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено имя, употреблённое в исходном тексте, без замены на «Иаков».
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: своего сына Иосифа
  rationale: Использована укоренившаяся русская библейская форма еврейского имени יוֹסֵף.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Если я нашёл благоволение в твоих глазах
  rationale: Сохранена еврейская формула почтительной просьбы и её образность; נָא передаётся общей просительной интонацией высказывания.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: положи, прошу, руку под моё бедро
  rationale: Ритуальный жест передан буквально, а частица נָא — словом «прошу». Культурное значение пояснено в сноске.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: и окажи мне милость и верность
  rationale: Сочетание передаёт преданную, надёжную доброту. «Милость и верность» естественно звучит по-русски, сохраняет два элемента еврейской пары и не вводит в основной текст отсутствующее слово «завет».
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Не хорони меня в Египте, прошу
  rationale: Отрицательная просьба с נָא передана как настойчивая, но почтительная мольба.
theological_decisions:
- issue: Передача חֶסֶד וֶאֱמֶת в контексте торжественного семейного обязательства
  choice: милость и верность
  alternative: неизменная любовь и верность; преданная милость и надёжность
  rationale: Выбранная формулировка удерживает как доброжелательное, так и обязательственно-надёжное измерение выражения, не превращая подразумеваемый заветный оттенок в прямо названный «завет».
- issue: Жест «рука под бедром»
  choice: Сохранить буквальный образ в основном тексте и пояснить его в сноске
  alternative: 'Передать только подразумеваемое значение: «поклянись мне»'
  rationale: Буквальная передача сохраняет конкретность и культурную особенность повествования; сноска помогает читателю понять, что речь идёт о торжественной клятве.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественного русского без устранения формулы «в твоих глазах» и культурно значимого жеста. Просительная частица נָא передана словом «прошу» в обеих просьбах.
