  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: ru
  text: 'Иосиф сказал: «Приведите ваш скот, и я дам вам [пищу] в обмен на ваш скот, если деньги кончились».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и я дам вам за ваш скот, если деньги кончились». В еврейском тексте не названо, что именно Иосиф даст; из ближайшего контекста ясно, что речь идёт о пище. Еврейское «если» здесь также можно понимать как «раз» или «поскольку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Приведите
  rationale: Форма повелительного наклонения во множественном числе требует передать или представить имущество; применительно к животным естественно русское «приведите».
- source_word: מִקְנֵיכֶם
  choice: ваш скот
  rationale: מִקְנֶה обозначает домашних стадных животных в широком смысле; «скот» — краткий и естественный русский эквивалент.
- source_word: וְאֶתְּנָה לָכֶם
  choice: и я дам вам [пищу]
  rationale: Объект глагола в еврейском тексте не выражен. «Пищу» следует из ближайшего контекста голода и торговли хлебом, но заключено в квадратные скобки, чтобы не скрывать эллипсис оригинала.
- source_word: בְּמִקְנֵיכֶם
  choice: в обмен на ваш скот
  rationale: Предлог בְּ здесь выражает средство или обмен; русский оборот ясно передаёт характер сделки.
- source_word: אִם
  choice: раз
  rationale: Хотя אִם обычно означает «если», здесь условие представлено как уже существующая причина обмена; «раз» сохраняет оттенок условности и одновременно естественно выражает причинную связь.
- source_word: אָפֵס כָּסֶף
  choice: деньги кончились
  rationale: אָפֵס указывает на полное исчерпание; это точное и современное русское выражение.
