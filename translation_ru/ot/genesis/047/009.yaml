base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: ru
  text: 'Иаков ответил фараону: «Годы моего пребывания на чужбине[a] — сто тридцать лет. Немногочисленны и тяжки были годы моей жизни, и они не достигли того числа лет, которое прожили мои отцы во время своего пребывания на чужбине».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего пребывания пришельцем». Еврейское слово обозначает жизнь временного жителя, пришельца; возможен также перевод: «моих странствий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: моих странствий / их странствий
  rationale: Существительное обозначает проживание в качестве пришельца, временного жителя. «Странствия» естественно передаёт патриархальную жизнь вне постоянного владения землёй, хотя требует пояснения, чтобы не свести смысл лишь к передвижениям.
- source_word: יְמֵי שְׁנֵי
  choice: годы / во дни
  rationale: Буквальное нагромождение «дни лет» в современном русском звучит неестественно. Перевод сохраняет торжественную временную образность там, где она органична, но передаёт идиому понятным русским языком.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: сто тридцать лет
  rationale: Нормальная современная русская форма числительного, полностью соответствующая значению еврейского текста.
- source_word: מְעַט
  choice: немногочисленны
  rationale: Передаёт сравнительно малое число прожитых лет, особенно в сопоставлении с долголетием отцов Иакова.
- source_word: רָעִים
  choice: тяжки
  rationale: В данном контексте слово характеризует годы как исполненные бед и страданий, а не как нравственно злые. «Тяжки» сохраняет возвышенный тон и смысл жизненных невзгод.
- source_word: הִשִּׂיגוּ
  choice: не достигли
  rationale: Глагол означает достигать, настигать; здесь годы жизни Иакова не сравнялись по числу с годами его отцов.
- source_word: אֲבֹתַי
  choice: моих отцов
  rationale: Прямо сохраняет семейную и патриархальную преемственность; в контексте имеются в виду прежде всего Исаак и Авраам.
theological_decisions:
- issue: Самоопределение патриарха как временного жителя
  choice: странствия
  alternative: жизнь пришельца / временное проживание / паломничество
  rationale: Еврейское слово говорит о положении временного жителя или пришельца, а не обязательно о духовном паломничестве. Основной текст сохраняет традиционно понятный образ странствий, а примечание уточняет социально-исторический смысл.
- issue: Характер прожитых лет
  choice: тяжки
  alternative: злы / бедственны
  rationale: Слово רָעִים здесь допускает буквальное «злы», но контекст описывает пережитые бедствия. «Тяжки» не приписывает дням нравственного зла и не устраняет отрицательную оценку Иаковом своей жизни.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Еврейская формула «дни лет» не воспроизводится механически во всех случаях, поскольку по-русски это затемнило бы смысл; повтор слов «годы», «жизнь» и «странствия» сохраняет мерный характер речи Иакова.
