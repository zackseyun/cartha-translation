base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: ru
  text: Они привели свой скот к Иосифу, и Иосиф дал им хлеб в обмен на коней, мелкий и крупный скот, а также ослов. Он обеспечивал их хлебом[a] в обмен на весь их скот в тот год.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и он вёл их хлебом». Еврейский глагол может означать «вести, направлять, управлять»; здесь, вероятно, имеется в виду, что Иосиф обеспечивал людей хлебом во время голода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: свой скот / весь их скот
  rationale: Слово обозначает домашних животных в широком смысле, а не только крупный рогатый скот. В начале употреблено естественное русское «свой скот», а в итоговой фразе сохранено обобщение «весь их скот».
- source_word: לֶחֶם
  choice: хлеб
  rationale: Хотя слово может обозначать пищу вообще, буквальное «хлеб» уместно в контексте голода и сохраняет повтор исходного существительного.
- source_word: בַּסּוּסִים
  choice: в обмен на коней
  rationale: Предлог ב здесь выражает цену или средство обмена; явное «в обмен на» точно передаёт бартерную сделку.
- source_word: מִקְנֵה הַצֹּאן
  choice: стада овец и коз
  rationale: צֹאן охватывает мелкий скот, прежде всего овец и коз; такая формулировка точнее и понятнее, чем одно лишь «овцы».
- source_word: מִקְנֵה הַבָּקָר
  choice: стада крупного скота
  rationale: Выражение относится к стадным животным, главным образом крупному рогатому скоту; формулировка сохраняет коллективный смысл.
- source_word: חֲמֹרִים
  choice: ослов
  rationale: Современный, ясный и точный русский эквивалент.
- source_word: וַיְנַהֲלֵם
  choice: он обеспечивал их
  rationale: Глагол נהל буквально может означать «вести, направлять», но сочетание с хлебом в данном хозяйственном контексте указывает на содержание или обеспечение людей пропитанием.
- source_word: בַּלֶּחֶם
  choice: хлебом
  rationale: Творительный падеж естественно передаёт средство, которым Иосиф обеспечивал людей.
- source_word: בְּכָל מִקְנֵהֶם
  choice: в обмен на весь их скот
  rationale: Фраза подводит итог бартерной сделке; явное обозначение обмена устраняет возможность понять, будто хлеб предназначался животным.
- source_word: בַּשָּׁנָה הַהִוא
  choice: в тот год
  rationale: Естественная современная передача временного обстоятельства.
