base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: ru
  text: 'Когда в Египте и Ханаане закончились деньги[a], все египтяне[b] пришли к Иосифу и сказали: «Дай нам хлеба[c]. Зачем нам умирать перед тобой? Ведь денег больше нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебро иссякло»; еврейское слово כֶּסֶף означает как «серебро», так и «деньги».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «весь Египет пришёл к Иосифу».'
    reason: lexical_alternative
  - marker: c
    text: В условиях голода «хлеб» может означать пищу вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: закончились
  rationale: Глагол תמם выражает полное исчерпание; «закончились» естественно передаёт это значение по-русски.
- source_word: הַכֶּסֶף / כָּסֶף
  choice: деньги
  rationale: כֶּסֶף может означать серебро или деньги; в контексте приобретения продовольствия речь идёт о средствах платежа.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: в Египетской земле и в Ханаанской земле
  rationale: Хотя מן буквально может передаваться как «из», здесь по-русски естественнее обозначить место, где иссякли деньги; смысл исходного текста сохраняется.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: все египтяне пришли
  rationale: Буквально «весь Египет пришёл»; название страны метонимически обозначает её жителей.
- source_word: לֵאמֹר
  choice: и сказали
  rationale: Инфинитив вводит прямую речь; русское повествовательное «и сказали» звучит естественнее буквального «говоря».
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Дай нам хлеба
  rationale: Сохраняется конкретное לֶחֶם «хлеб», которое в условиях голода может обозначать пищу вообще; родительный партитивный «хлеба» естественен после «дай».
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: Зачем нам умирать перед тобой?
  rationale: Риторический вопрос передаёт настоятельную мольбу, а «перед тобой» непосредственно и без добавленной образности передаёт נֶגְדֶּךָ.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Ведь денег больше нет
  rationale: כִּי вводит основание просьбы, а אָפֵס указывает, что деньги полностью иссякли; формулировка естественна в современной русской речи.
