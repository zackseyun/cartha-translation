base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: ru
  text: Во всей земле не было пищи[a], потому что голод был чрезвычайно тяжёлым; земля Египта и земля Ханаана изнемогли[b] от голода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб»; здесь, вероятно, имеется в виду пища вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обессилели», «пришли в упадок». Еврейский глагол образно передаёт истощающее действие голода на Египет и Ханаан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: пища
  rationale: Буквально слово означает «хлеб», но в повествовании о голоде метонимически обозначает пропитание вообще. «Пища» ясно передаёт этот более широкий смысл.
- source_word: אֵין
  choice: не было
  rationale: Отрицательная экзистенциальная конструкция естественно передана в прошедшем времени, соответствующем контексту повествования.
- source_word: בְּכָל הָאָרֶץ
  choice: во всей земле
  rationale: Сохранён повторяющийся географический термин «земля»; по контексту речь идёт об охваченной голодом области, а не обязательно обо всём мире.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отсутствия пищи; причинное значение выражено прямо и естественно.
- source_word: כָבֵד ... מְאֹד
  choice: чрезвычайно тяжёлым
  rationale: Буквально голод назван «очень тяжёлым»; русское сочетание сохраняет образ и передаёт крайнюю степень бедствия.
- source_word: הָרָעָב
  choice: голод
  rationale: Контекст требует значения массового бедствия — голода, а не только индивидуального чувства голода.
- source_word: וַתֵּלַהּ
  choice: изнемогли
  rationale: Редкий глагол описывает состояние истощения и упадка сил. «Изнемогли» сохраняет олицетворение земель и не сводит образ к одному буквальному оттенку.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: земля Египта и земля Ханаана
  rationale: Повтор слова «земля» воспроизводит параллельную еврейскую конструкцию и подчёркивает обе затронутые области.
- source_word: מִפְּנֵי הָרָעָב
  choice: от голода
  rationale: Краткое и естественное причинное выражение по-русски, соответствующее значению еврейского оборота.
