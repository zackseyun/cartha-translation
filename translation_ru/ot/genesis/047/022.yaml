  text: רַ֛ק אַדְמַ֥ת הַ/כֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת פַּרְעֹ֗ה וְ/אָֽכְל֤וּ אֶת חֻקָּ/ם֙ אֲשֶׁ֨ר נָתַ֤ן לָ/הֶם֙ פַּרְעֹ֔ה עַל כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת אַדְמָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: ru
  text: Только землю священников он не купил, потому что священникам полагалось содержание от фараона[a] и они питались тем, что давал им фараон. Поэтому они не продали своей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была назначена доля», «было установлено содержание» или «выдавался паёк». Еврейское חֹק здесь означает назначенное обеспечение, а не прежде всего закон или постановление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Передаёт ограничительное значение и отмечает исключение из сказанного ранее.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: землю священников
  rationale: Естественно передаёт сочетание, обозначающее принадлежавшие священникам земельные владения.
- source_word: קָנָה
  choice: купил
  rationale: В контексте приобретения земли во время голода речь идёт именно о покупке.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину, по которой земля священников не была куплена.
- source_word: חֹק / חֻקָּם
  choice: полагалось содержание / тем, что давал
  rationale: Здесь слово обозначает установленное обеспечение, а не отвлечённый закон; вариативная передача устраняет неестественный по-русски повтор, сохраняя смысл.
- source_word: מֵאֵת פַּרְעֹה
  choice: от фараона
  rationale: Передаёт источник установленного содержания.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: они питались тем
  rationale: Естественно передаёт конкретный глагол «есть» и смысл жизни за счёт назначенного обеспечения.
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: что давал им фараон
  rationale: Простая относительная конструкция сохраняет фараона как источник постоянного обеспечения.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Ясно выражает следствие из предыдущего объяснения.
- source_word: מָכְרוּ
  choice: продали
  rationale: Прямой и контекстуально точный эквивалент коммерческого глагола.
- source_word: אַדְמָתָם
  choice: своей земли
  rationale: Возвратное местоимение естественно по-русски соотносит землю со священниками.
