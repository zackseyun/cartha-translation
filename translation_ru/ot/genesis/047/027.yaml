  rationale: Исправление переносит вероятный имущественный оттенок וַיֵּאָחֲזוּ בָהּ в основной текст, не устраняя альтернативного смысла из примечания. Также устранён избыточно архаичный оборот при сохранении имени, перехода числа, Гесема как области и характерной пары «плодились и умножились».
