base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: ru
  text: Израиль поселился в Египте, в земле Гесем, и они приобрели там владения[a], плодились и чрезвычайно умножились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закрепились там», «прочно обосновались там». Еврейский глагол может обозначать как приобретение владений в этой земле, так и прочное закрепление в ней.'
    reason: Лексическая неоднозначность формы וַיֵּאָחֲזוּ בָהּ.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: Глагол ישׁב здесь обозначает не временное пребывание, а обосновавшееся проживание; «поселился» естественно передаёт этот смысл.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя. Единственное число первого глагола относится к Израилю как патриарху и представителю семьи, а последующее множественное число — к его дому.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Передано явно присутствующее слово «земля» и сохранён территориальный акцент исходного текста.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: в земле Гесем
  rationale: Формулировка сохраняет повтор слова «земля» и представляет Гесем как область внутри Египта.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: они прочно обосновались в ней
  rationale: Нифаль глагола אחז допускает смысл получения владения, закрепления на земле или прочного обоснования. Основной текст передаёт установившееся положение семьи, а примечание сохраняет имущественный оттенок и неоднозначность.
- source_word: וַיִּפְרוּ
  choice: плодились
  rationale: Слово сохраняет повторяющуюся в Бытии лексику благословения о плодовитости и естественно звучит в данном контексте.
- source_word: וַיִּרְבּוּ
  choice: умножились
  rationale: Передаёт традиционную пару פרה ורבה и сохраняет отсылку к теме благословения в книге Бытие.
- source_word: מְאֹד
  choice: чрезвычайно
  rationale: Ясно передаёт усилительное значение наречия и соответствует достоинству повествовательного регистра.
theological_decisions:
- issue: Представительный смысл имени «Израиль» и переход от единственного числа к множественному
  choice: Сохранить «Израиль поселился», а затем перейти к «они» без поясняющей подстановки.
  alternative: Передать всё предложение через «израильтяне» либо заменить «Израиль» на «Иаков».
  rationale: 'Так сохраняются форма и напряжение еврейского текста: патриарх назван в единственном числе, но далее речь идёт о нём вместе с его домом и потомками.'
- issue: Смысл וַיֵּאָחֲזוּ בָהּ
  choice: «прочно обосновались в ней» с примечанием об альтернативном имущественном смысле.
  alternative: «приобрели в ней владения» или «получили её во владение».
  rationale: Еврейская форма допускает как идею закрепления, так и обладания землёй. Основной вариант не утверждает более узкий юридический смысл, чем позволяет контекст, а примечание сохраняет возможный оттенок владения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор слова «земля», имя «Израиль», переход от единственного числа к множественному и характерная для Бытия пара «плодились и умножились».
