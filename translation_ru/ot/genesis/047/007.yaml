  text: וַ/יָּבֵ֤א יוֹסֵף֙ אֶת יַֽעֲקֹ֣ב אָבִ֔י/ו וַ/יַּֽעֲמִדֵ֖/הוּ לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: ru
  text: Иосиф привёл своего отца Иакова и представил его фараону[a], а Иаков благословил фараона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставил его перед фараоном» или «велел ему встать перед фараоном».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «благословил» может обозначать произнесённое вслух благословение, а не просто учтивое приветствие.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: привёл
  rationale: 'Порода хифиль глагола בוא имеет каузативный смысл: Иосиф ввёл Иакова в присутствие фараона. «Привёл» естественно передаёт это действие по-русски.'
- source_word: אָבִיו
  choice: своего отца
  rationale: Суффикс 3-го лица мужского рода относится к Иосифу; возвратное притяжательное местоимение «своего» устраняет возможную двусмысленность и естественно звучит по-русски.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: представил его
  rationale: Буквально хифиль от עמד означает «поставил его» или «велел ему встать». В контексте царской аудиенции «представил его» естественно передаёт официальный характер действия.
- source_word: לִפְנֵי פַרְעֹה
  choice: фараону
  rationale: Конструкция означает нахождение перед фараоном, в его присутствии. При глаголе «представил» русский дательный падеж идиоматично выражает адресата представления.
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Обычное значение ברך — «благословлять». Его следует сохранить, не ослабляя до простого приветствия.
- source_word: פַרְעֹה
  choice: фараон
  rationale: Устоявшаяся русская передача египетского царского титула.
- source_word: וַ
  choice: и / а
  rationale: Последовательные формы с וַ продвигают повествование. Союз «и» связывает первые действия Иосифа, а «а» естественно отмечает смену действующего лица при сохранении последовательности.
theological_decisions:
- issue: Смысл действия Иакова по отношению к фараону
  choice: Иаков действительно благословил фараона
  alternative: Иаков лишь учтиво приветствовал фараона
  rationale: 'Глагол ברך в своём прямом значении означает «благословил». Такое прочтение сохраняет примечательное напряжение сцены: патриарх благословляет могущественного царя, несмотря на более низкое общественное положение.'
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным строем и умеренно возвышенным библейским регистром. Формулировка сохраняет официальный характер царской аудиенции и прямое значение «благословил».
