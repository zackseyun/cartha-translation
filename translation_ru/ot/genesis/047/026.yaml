base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: ru
  text: 'Иосиф установил это как закон относительно земли Египта, действующий доныне: пятая часть — фараону[a]. Лишь земля жрецов не перешла в собственность фараона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одна пятая — фараону». Речь идёт о доле в одну пятую, то есть о двадцати процентах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: установил это как закон
  rationale: 'Сочетание שׂוּם с לְחֹק имеет юридико-административный смысл: Иосиф закрепил ранее изложенное правило как закон. Местоимение «это» сохраняет отсылку к постановлению предыдущего стиха.'
- source_word: עַד הַיּוֹם הַזֶּה
  choice: действующий доныне
  rationale: Оборот указывает, что закон сохранял силу до времени повествователя; причастный оборот естественно связывает эту длительность именно с законом.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: для египетской земли
  rationale: Предлог עַל здесь обозначает область применения закона. Русская формулировка передаёт это без тяжеловесного буквального «над землёй Египта».
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: пятая часть — фараону
  rationale: Сжатая именная конструкция сохраняет юридическую краткость еврейского текста и определённость формы לַחֹמֶשׁ, не добавляя прямо не названный здесь объект выплаты.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: лишь земля жрецов
  rationale: «Лишь» естественно объединяет ограничительное רַק и усилительное לְבַדָּם, избегая неуклюжей русской избыточности «только одна земля».
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: не перешла в собственность фараона
  rationale: В контексте передачи египетской земли фараону конструкция היה + ל описывает принадлежность как результат; выбранная формулировка ясно передаёт, что земля жрецов стала исключением.
