lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: обеспечивал
  rationale: Порода пиэль глагола כלכל здесь означает материально содержать, снабжать необходимым. Несовершенный вид передаёт продолжающееся обеспечение во время голода.
- source_word: לֶחֶם
  choice: пищей
  rationale: Хотя основное буквальное значение — «хлеб», в данном контексте слово обозначает продовольствие в более широком смысле.
- source_word: כָּל בֵּית אָבִיו
  choice: весь дом своего отца
  rationale: «Дом» обозначает не здание, а всю семейно-хозяйственную общность; традиционная русская формулировка сохраняет образ исходного текста и остаётся понятной.
- source_word: לְפִי
  choice: по числу
  rationale: Буквально выражение связано с «устами», но идиоматически указывает на меру или соразмерность. В сочетании с הַטָּף вероятен смысл распределения по числу детей.
- source_word: הַטָּף
  choice: малых детей
  rationale: Слово обозначает маленьких детей семейства; перевод сохраняет возрастной оттенок, не расширяя значение до всех иждивенцев.
- source_word: אָבִיו ... אֶחָיו
  choice: своего отца, своих братьев
  rationale: Возвратное притяжательное местоимение естественно для современного русского языка и ясно соотносит родственников с Иосифом.
