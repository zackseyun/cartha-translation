  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: ru
  text: 'Он сказал: «Поклянись мне». И тот поклялся ему. Тогда Израиль поклонился у изголовья постели[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израиль поклонился, опираясь на верх своего посоха». Еврейские согласные допускают и такое чтение; оно отражено в Септуагинте и в Евреям 11:21.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: Поклянись мне
  rationale: Кратко и естественно передаёт повелительную форму формулы клятвы, сохраняя прямоту требования.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: И тот поклялся ему
  rationale: Сохраняет тот же глагол клятвы; местоименное «тот» естественно различает участников в русском повествовании, не добавляя имени, которого нет в стихе.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Передаёт телесный жест, не уточняя без достаточного основания, был ли это именно акт поклонения Богу или простирание ниц.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняет употреблённое в еврейском тексте имя, не заменяя его на «Иаков».
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: у изголовья постели
  rationale: Естественная современная русская передача положения у головного конца постели; она соответствует масоретской огласовке הַמִּטָּה («постель») и ближайшему контексту.
theological_decisions:
- issue: Масоретская огласовка даёт «постель», тогда как те же согласные допускают чтение «посох», отражённое в Септуагинте и Евреям 11:21.
  choice: постели
  alternative: посоха
  rationale: Основной текст следует имеющейся масоретской форме הַמִּטָּה («постель»), а древнее и канонически значимое альтернативное чтение сохраняется в примечании, чтобы не устранять текстовую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и торжественное без архаизмов. Формулировка «у изголовья постели» выбрана как естественная по-русски, а неоднозначность «постель/посох» явно сохранена в примечании.
