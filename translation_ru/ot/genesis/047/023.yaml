base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: ru
  text: 'Тогда Иосиф сказал народу: «Вот, сегодня я приобрёл вас и вашу землю для фараона. Вот вам семена, и засевайте землю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Иосиф сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הָעָם
  choice: народу
  rationale: Собирательное обозначение египетского населения, к которому обращается Иосиф.
- source_word: הֵן
  choice: Вот
  rationale: Частица вводит подчёркнутое объявление; «вот» сохраняет указательно-эмфатическую силу без архаизации.
- source_word: קָנִיתִי
  choice: я приобрёл
  rationale: קנה допускает значения «купить» и шире «приобрести». В контексте передачи людей и земли фараону «приобрёл» сохраняет юридико-экономический смысл и не сужает значение до обычной купли.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Прямое дополнение относится к самим людям, переходящим в зависимость от фараона.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямое и естественное обозначение времени совершившейся сделки.
- source_word: אַדְמַתְכֶם
  choice: вашу землю
  rationale: Здесь אֲדָמָה обозначает принадлежавшие людям сельскохозяйственные земли.
- source_word: לְפַרְעֹה
  choice: для фараона
  rationale: Предлог ל указывает, что Иосиф совершил приобретение в пользу и во владение фараона.
- source_word: הֵא לָכֶם זֶרַע
  choice: Вот вам семена
  rationale: Указательная частица представляет выдаваемое людям зерно для посева; русское множественное «семена» естественно в сельскохозяйственном контексте.
- source_word: וּזְרַעְתֶּם
  choice: и засевайте
  rationale: Форма совершенного вида с waw в прямой речи имеет предписывающую силу. Повелительное «засевайте» естественно передаёт распоряжение и сохраняет союз.
- source_word: הָאֲדָמָה
  choice: землю
  rationale: Речь идёт о возделывании пахотной земли; выбор также сохраняет связь с предшествующим «вашу землю».
theological_decisions:
- issue: Характер приобретения людей фараоном
  choice: «приобрёл вас»
  alternative: «купил вас»
  rationale: Текст прямо говорит о переходе людей вместе с землёй к фараону, но глагол קנה имеет более широкий диапазон, чем только обычная купля. Перевод не смягчает объект «вас», однако сохраняет лексическую широту глагола и не уточняет сверх текста точный правовой статус.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Повтор «вот» сохранён, поскольку в еврейском тексте стоят две разные указательные частицы, последовательно подчёркивающие объявление сделки и предоставление семян.
