base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: ru
  text: Иосиф собрал всё серебро[a], находившееся в земле Египетской и в земле Ханаанской, за зерно, которое покупали, и внёс серебро в дом фараона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все деньги». В еврейском тексте буквально сказано «всё серебро»: название металла употреблено в значении средства платежа.'
    reason: lexical_alternative
  - marker: b
    text: «Дом фараона» может означать не только царскую резиденцию, но также хозяйство фараона или его казну.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: собрал
  rationale: Глагол לקט означает собирать, накапливая полученное из множества отдельных сделок; «собрал» естественно передаёт это значение по-русски.
- source_word: כָּל הַכֶּסֶף
  choice: всё серебро
  rationale: כֶּסֶף буквально означает «серебро» и также употребляется в значении денег. Конкретный образ исходного текста сохранён, а денежная функция ясна из контекста и пояснена в сноске.
- source_word: הַנִּמְצָא
  choice: находившееся
  rationale: Причастие от מצא обозначает то, что имелось или находилось в этих землях; форма «находившееся» сохраняет его длительно-результативный оттенок.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: в земле Египетской и в земле Ханаанской
  rationale: Сохранено повторение слова «земля» и географический акцент еврейского текста; традиционные русские определения звучат литературно и ясно.
- source_word: בַּשֶּׁבֶר
  choice: за зерно
  rationale: В повествовании об Иосифе שֶׁבֶר обозначает зерно, приобретаемое во время голода, а предлог ב здесь выражает плату или обмен.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: которое там покупали
  rationale: В данном контексте שבר означает покупать зерно, а причастная форма передаёт продолжающееся действие. Безлично-неопределённое «покупали» естественно передаёт еврейское «они», не вводя в текст явно не названную группу; «там» делает русскую фразу связной.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: внёс серебро в дом фараона
  rationale: Направительный суффикс в בֵּיתָה указывает на движение внутрь. «Внёс ... в дом» кратко и точно передаёт это направление, не сужая значение слова «дом» до дворца или казны.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционными библейскими географическими формами «земля Египетская» и «земля Ханаанская». Синтаксис сохраняет последовательность исходного повествования, но избегает неестественного для русского повторения местоимения «они» без ясного антецедента.
