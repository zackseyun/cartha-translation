base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: ru
  text: 'Иосиф купил для фараона всю землю Египта[a], ибо каждый египтянин продал своё поле: голод был для них очень тяжёл[b]. И земля стала собственностью фараона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приобрёл для фараона всю землю Египта».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «голод был силён над ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: купил
  rationale: В контексте продажи полей глагол קנה обозначает возмездное приобретение; «купил» естественно передаёт коммерческий характер сделки.
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: всю землю Египта
  rationale: אַדְמָה здесь означает землю как сельскохозяйственную собственность, а не просто почву.
- source_word: לְפַרְעֹה
  choice: для фараона
  rationale: 'Предлог לְ указывает на получателя и выгодоприобретателя: Иосиф приобретает землю в собственность фараона.'
- source_word: מָכְרוּ מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: египтяне, каждый своё поле, продали
  rationale: 'Такая конструкция сохраняет коллективное «египтяне» и выраженную словом אִישׁ распределительность: каждый продал принадлежавшее ему поле.'
- source_word: כִּי חָזַק עֲלֵהֶם הָרָעָב
  choice: голод был очень тяжёл для них
  rationale: Идиоматично передаёт буквальный образ голода, который «усилился/был силён над ними», сохраняя ощущение его гнетущей силы.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: земля стала собственностью фараона
  rationale: Ясно выражает итоговый переход права собственности, заложенный в конструкции היה לְ.
theological_decisions: []
