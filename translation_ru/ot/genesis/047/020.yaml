  register: Современный литературный русский язык с достоинством повествовательного стиля. Порядок слов в выражении «египтяне, каждый своё поле, продали» намеренно слегка приподнят, чтобы сохранить распределительную структуру еврейского текста; «стала собственностью» естественно и недвусмысленно передаёт юридический результат.
