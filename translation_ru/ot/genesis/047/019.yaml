  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: ru
  text: Зачем нам умирать у тебя на глазах — и нам, и нашей земле? Купи нас и нашу землю за хлеб, и мы вместе с нашей землёй станем рабами фараона. Дай семян, чтобы нам жить, а не умереть, и чтобы земля не опустела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пришла в запустение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Зачем нам умирать
  rationale: Передаёт риторическую мольбу и естественно звучит по-русски; речь не о запросе причины как таковой, а о попытке предотвратить смерть.
- source_word: לְעֵינֶיךָ
  choice: у тебя на глазах
  rationale: Сохраняет наглядность еврейского выражения и передаёт смысл «в твоём присутствии, когда ты это видишь».
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: и нам, и нашей земле
  rationale: Парная конструкция «и … и» естественно воспроизводит еврейское גם … גם и сохраняет необычное олицетворение земли как умирающей.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ בַּלָּחֶם
  choice: Купи нас и нашу землю за хлеб
  rationale: «Купи» прямо передаёт коммерческое приобретение, а «за хлеб» — цену обмена и конкретный образ оригинала.
- source_word: עֲבָדִים לְפַרְעֹה
  choice: рабами фараона
  rationale: В данном экономико-правовом контексте עֲבָדִים означает утрату свободы и принадлежность фараону; «рабы» точнее, чем более мягкое «слуги».
- source_word: וְנִהְיֶה
  choice: станем
  rationale: 'Имперфект после повеления выражает ожидаемый результат покупки: переход людей и земли в зависимое положение.'
- source_word: וְתֶן זֶרַע
  choice: Дай семян
  rationale: В земледельческом контексте זֶרַע обозначает посевной материал. Русское множественное «семян» звучит естественнее при собирательном значении.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: чтобы земля не опустела
  rationale: Передаёт состояние запустения земли из-за отсутствия посева и населения; форма цели согласована с предыдущим пожеланием жить.
