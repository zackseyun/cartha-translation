  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: ru
  text: 'И фараон спросил Иакова: «Сколько лет твоей жизни?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сколько дней лет твоей жизни?» То есть: «Сколько тебе лет?»'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И … спросил
  rationale: Форма с последовательным וַ продолжает повествование. Глагол אָמַר буквально означает «сказал», но перед прямым вопросом естественное русское «спросил» точно передаёт речевое действие.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Традиционная и общепонятная передача египетского царского титула.
- source_word: אֶל־יַעֲקֹב
  choice: Иакова
  rationale: Предлог אֶל обозначает адресата речи; при глаголе «спросил» в современном русском языке адресат естественно выражается винительным падежом без предлога.
- source_word: כַּמָּה
  choice: сколько
  rationale: Вводит количественный вопрос о числе прожитых лет.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: лет твоей жизни
  rationale: 'Буквально: «дней лет твоей жизни». Основной текст передаёт смысл естественным современным русским выражением, а необычная формальная структура еврейского текста сохраняется в примечании.'
