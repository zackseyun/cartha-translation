lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: Форма глагола חיה в данном повествовательном и временном контексте означает, что Иаков продолжал жить в Египте указанный срок; «прожил» естественно передаёт это по-русски.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохранено явно присутствующее в еврейском тексте אֶרֶץ («земля»). Сочетание звучит торжественно и понятно в русском библейском повествовании.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: семнадцать лет
  rationale: Прямая и естественная передача числительного с обозначением времени.
- source_word: יְמֵי יַעֲקֹב
  choice: всех дней Иакова
  rationale: Сохранён еврейский способ обозначения продолжительности жизни через «дни»; слово «всех» естественно выражает итоговый характер фразы.
- source_word: שְׁנֵי חַיָּיו
  choice: лет его жизни
  rationale: Сохранено поясняющее приложение к выражению «дни Иакова», которое уточняет, что речь идёт о полной продолжительности его жизни.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: сто сорок семь
  rationale: Порядок компонентов числа приведён в соответствие с нормами современного русского языка при точном сохранении суммы.
