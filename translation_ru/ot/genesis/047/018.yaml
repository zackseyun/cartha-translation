base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: ru
  text: 'Когда закончился тот год, они пришли к нему во второй год и сказали: «Не станем скрывать от моего господина: деньги[a] кончились, и скот перешёл к моему господину. Перед моим господином не осталось ничего, кроме наших тел[b] и нашей земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро»; в еврейском языке это слово часто означает деньги.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нас самих». Буквально: «наших тел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Когда закончился тот год
  rationale: Глагол תמם выражает завершение; такая формулировка естественно и точно передаёт временное придаточное.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: на второй год
  rationale: Сохранено буквальное обозначение «второго года», не заменённое более толковательным «на следующий год».
- source_word: לֹא נְכַחֵד
  choice: Не станем скрывать
  rationale: Порода пиэль глагола כחד означает «скрывать, утаивать»; форма передаёт добровольное заверение говорящих.
- source_word: מֵאֲדֹנִי / אֶל אֲדֹנִי / לִפְנֵי אֲדֹנִי
  choice: от господина нашего / к господину нашему / перед господином нашим
  rationale: Повтор почтительного обращения сохранён. Русское «нашего» естественно для речи группы, хотя в еврейском стоит суффикс первого лица единственного числа, вероятно в речи её представителя.
- source_word: תַּם הַכֶּסֶף
  choice: деньги кончились
  rationale: כֶּסֶף буквально означает «серебро», но в данном хозяйственном контексте обозначает деньги; תמם указывает, что они полностью израсходованы.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: и скот перешёл к господину нашему
  rationale: מִקְנֵה הַבְּהֵמָה обозначает имущество в виде домашних животных. Эллиптическое אֶל אֲדֹנִי указывает на уже совершившийся переход скота во владение господина.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Перед господином нашим не осталось ничего
  rationale: Сохранён образный оборот с לִפְנֵי, при этом русская фраза остаётся понятной.
- source_word: גְּוִיָּתֵנוּ
  choice: наших тел
  rationale: גְּוִיָּה может обозначать тело или труп; здесь речь идёт о живых людях, готовых отдать самих себя, поэтому «тела» сохраняет конкретность исходного слова.
theological_decisions:
- issue: Смысл передачи скота Иосифу
  choice: «скот перешёл к господину нашему»
  alternative: «скот принадлежит господину нашему»
  rationale: Формулировка отражает контекст уже состоявшегося обмена, не добавляя оценки действий Иосифа или египтян.
- issue: Значение גְּוִיָּתֵנוּ
  choice: «наших тел»
  alternative: «нас самих»
  rationale: Сохранена телесная конкретность текста и напряжение предстоящего подчинения, без преждевременного определения его точной правовой формы.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Повтор «господин наш» передаёт настойчивую почтительность исходной речи; архаические формы обращения не используются.
