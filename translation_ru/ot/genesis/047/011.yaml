base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: ru
  text: Иосиф поселил своего отца и своих братьев и дал им земельное владение в Египте, в лучшей части страны[a] — в земле Раамсес, как повелел фараон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на лучших землях».'
    reason: Лексическая альтернатива для בְּמֵיטַב הָאָרֶץ, которое может обозначать лучшую часть территории или лучшие земли.
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: поселил
  rationale: Каузативная форма глагола ישׁב означает, что Иосиф устроил отца и братьев на жительство; «поселил» естественно передаёт этот смысл.
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: своего отца и своих братьев
  rationale: Перевод сохраняет прямо названные в еврейском тексте родственные отношения, не расширяя их до общего «семья».
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: дал им земельное владение
  rationale: אֲחֻזָּה обозначает участок земли, находящийся во владении; уточнение «земельное» ясно передаёт конкретный смысл и не вносит дополнительных ассоциаций слова «наследие».
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в Египте
  rationale: Естественная современная русская форма; значение אֶרֶץ в данном географическом сочетании передано названием страны без тяжеловесного «в земле Египетской».
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: в лучшей части страны
  rationale: מֵיטַב указывает на лучшую, отборную часть территории; формулировка естественна по-русски и не уточняет без основания, в чём именно состояло её превосходство.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: в земле Раамсес
  rationale: Сохраняется территориальное значение אֶרֶץ и передаётся древнееврейская форма географического названия רַעְמְסֵס.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: как повелел фараон
  rationale: Кратко и точно передаёт соответствие ранее данному распоряжению фараона.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор слова «земля» частично сокращён ради естественности, но сохранён в территориальном названии «земля Раамсес». Тире показывает, что земля Раамсес уточняет местоположение владения.
