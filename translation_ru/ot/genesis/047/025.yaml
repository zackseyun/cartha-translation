  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: ru
  text: 'Они сказали: «Ты сохранил нам жизнь. Да найдём мы милость в глазах господина моего[a], и будем рабами фараона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу почтительной просьбы: «Пусть господин мой будет к нам благосклонен». Выражение «найти милость в глазах» — древнееврейская идиома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Они сказали
  rationale: Обычное продолжение повествования с переходом к прямой речи; в русском отдельное «и» здесь необязательно.
- source_word: הֶחֱיִתָנוּ
  choice: Ты сохранил нам жизнь
  rationale: Каузатив породы hифиль от חיה означает «дать жить, сохранить в живых»; перевод передаёт сохранение физической жизни без дополнительных религиозных оттенков.
- source_word: נִמְצָא חֵן
  choice: Да найдём мы милость
  rationale: Форма yiqtol первого лица множественного числа здесь выражает почтительную просьбу или пожелание, а не утверждение о уже полученной милости.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: в глазах господина моего
  rationale: Сохранена прозрачная древнееврейская идиома и суффикс первого лица единственного числа при почтительном обращении к Иосифу.
- source_word: וְהָיִינוּ
  choice: и будем
  rationale: В данном контексте форма выражает последующее положение или обязательство египтян в ответ на сохранение их жизни.
- source_word: עֲבָדִים
  choice: рабами
  rationale: עֲבָדִים может означать слуг или рабов, но контекст передачи людей в зависимое служение фараону делает «рабами» наиболее точным и не смягчающим переводом.
- source_word: לְפַרְעֹה
  choice: фараона
  rationale: Русская конструкция «быть рабами кого-либо» естественно передаёт отношение принадлежности и подчинения, обозначенное предлогом לְ.
