  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: ru
  text: Из числа своих братьев Иосиф взял пятерых и представил их фараону.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквально: «с края (или конца) своих братьев»; возможно также: «из лучших среди своих братьев». Еврейское выражение буквально связано с «краем» или «концом», но здесь, вероятнее всего, означает, что Иосиф выбрал пятерых из числа своих братьев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: Из числа
  rationale: Сочетание מִן с קָצֶה буквально связано с «краем» или «концом», но здесь естественно выражает выбор части из целой группы. «Из числа» передаёт этот смысл по-русски, не устраняя засвидетельствованные альтернативные толкования, отмеченные в сноске.
- source_word: אֶחָיו
  choice: своих братьев
  rationale: В ближайшем контексте речь идёт о родных братьях Иосифа, поэтому конкретное «братьев» предпочтительнее более широкого «родственников».
- source_word: לָקַח
  choice: взял
  rationale: Прямое значение глагола — «взять»; в данном контексте подразумевается выбор пятерых, однако буквальное «взял» ясно и естественно по-русски.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: пятерых
  rationale: Русская субстантивированная форма числительного естественно указывает на пятерых мужчин из уже названных братьев и позволяет избежать тяжеловесного «пять человек».
- source_word: וַיַּצִּגֵם
  choice: представил их
  rationale: Каузативная форма יָצַג означает поставить или представить кого-либо перед другим; «представил их» естественно соответствует придворной сцене.
- source_word: לִפְנֵי פַרְעֹה
  choice: фараону
  rationale: Дательный падеж после «представил» идиоматично передаёт значение «перед фараоном, в присутствии фараона» в современном русском языке.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Имя «Иосиф» восстановлено как явное подлежащее ради естественности и устранения неясности русского местоименного отнесения; в еврейском тексте подлежащее выражено глагольной формой и определяется контекстом. Сохранена лексическая неоднозначность וּמִקְצֵה посредством сноски.
