  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: ru
  text: 'И фараон спросил его братьев: «Каково ваше занятие?[a]» Они ответили фараону: «Твои слуги — пастухи овец и коз[b], как и наши отцы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Какова ваша работа?»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пастухи стад»; речь идёт о тех, кто пасёт овец и коз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Каково ваше занятие?
  rationale: Существительное מַעֲשֶׂה обозначает дело, труд или занятие; в придворном контексте фараон спрашивает об их роде деятельности. Формулировка естественна для современного русского языка и сохраняет профессиональный смысл вопроса.
- source_word: רֹעֵה צֹאן
  choice: пастухи мелкого скота
  rationale: Причастие רֹעֵה указывает на занятие пастуха, а צֹאן — на стада мелкого скота, прежде всего овец и коз. Перевод отражает оба компонента еврейского выражения.
- source_word: עֲבָדֶיךָ
  choice: Твои слуги
  rationale: Хотя עֶבֶד может означать также раба, здесь это почтительное самоназвание при обращении к фараону; зависимое или рабское положение не выдвинуто на первый план.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: как мы, так и наши отцы
  rationale: Парная конструкция גַּם… גַּם подчёркивает преемственность занятия между поколениями; русская конструкция «как… так и» передаёт этот параллелизм естественно и точно.
- source_word: אֶל אֶחָיו
  choice: его братьев
  rationale: Местоименный суффикс по контексту относится к Иосифу. Русский перевод сохраняет формулировку оригинала, не вставляя имя Иосифа в основной текст.
