  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: ru
  text: И умер Баал-Ханан, сын Ахбора, и вместо него воцарился Хадар[a]. Имя его города — Пау[b], а имя его жены — Мехетавел, дочь Матред, которая была дочерью Мезагава[c].
  philosophy: optimal-equivalence
