lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественная русская презентативная формула, вводящая родословный перечень.
- source_word: בְנֵי
  choice: сыновья
  rationale: Сохраняет прямое родословное значение; далее перечислены мужчины по именам.
- source_word: שֵׂעִיר הַחֹרִי
  choice: Сеира-хоррея
  rationale: Имя передано как «Сеир», а этническое обозначение — традиционной и понятной русской формой «хоррей»; дефис естественно связывает имя с приложением.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жители той земли
  rationale: Причастная конструкция обозначает людей, постоянно живущих в данной земле; указательное «той» естественно отсылает к земле, о которой идёт речь в контексте.
- source_word: לוֹטָן
  choice: Лотан
  rationale: Устоявшаяся русская передача имени.
- source_word: שׁוֹבָל
  choice: Шовал
  rationale: Передача еврейского имени с сохранением начального שׁ как «ш».
- source_word: צִבְעוֹן
  choice: Цивеон
  rationale: Устоявшаяся русская библейская передача имени.
- source_word: עֲנָה
  choice: Ана
  rationale: Устоявшаяся русская передача имени.
