  yaml_path: translation/ot/genesis/036/027.yaml
  text: 'These are the sons of Etser: Bilhan, Zaavan, and Akan.'
translation:
  language: ru
  text: 'Вот сыновья Эцера: Билган, Зааван и Акан.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵצֶר
  choice: Эцер
  rationale: Передача еврейского имени по звучанию; צ передано как «ц», что точнее отражает форму оригинала.
- source_word: בִּלְהָן
  choice: Билган
  rationale: Буква ה в середине имени передана через «г» по принятой в русской библейской традиции передаче ряда еврейских имён.
- source_word: זַעֲוָן
  choice: Зааван
  rationale: Транслитерация сохраняет последовательность гласных и наличие гортанного ע, не вводя труднопроизносимого специального обозначения.
- source_word: עֲקָן
  choice: Акан
  rationale: Естественная русская транслитерация имени; начальный ע отдельно не обозначается.
