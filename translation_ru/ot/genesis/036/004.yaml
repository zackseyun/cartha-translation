lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: родила
  rationale: Обе формы происходят от ילד («рождать»). «Родила» естественно и точно передаёт действие в родословном повествовании, сохраняя женщину как грамматический субъект.
- source_word: לְעֵשָׂו
  choice: Исаву
  rationale: Предлог ל при ילד в родословном контексте указывает на отца ребёнка; русский дательный падеж кратко и естественно передаёт это отношение.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в русском; его функция выражена падежом и порядком слов.
- source_word: אֱלִיפָז
  choice: Елифаз
  rationale: Традиционная русская библейская форма имени, достаточно близкая к масоретскому אֱלִיפָז.
- source_word: עָדָה
  choice: Ада
  rationale: Традиционная и естественная русская передача личного имени עָדָה.
- source_word: בָשְׂמַת
  choice: Басемат
  rationale: Передача личного имени по масоретской огласовке; форма «Басемат» точнее отражает еврейское בָשְׂמַת, чем традиционное «Васемафа».
- source_word: רְעוּאֵל
  choice: Рагуил
  rationale: Устоявшаяся русская библейская форма имени רְעוּאֵל; она обеспечивает узнаваемость при сохранении личного имени без смыслового перевода.
- source_word: וּ
  choice: а
  rationale: Союз связывает два параллельных сообщения о рождении. Русское «а» естественно подчёркивает смену субъекта без внесения сильного противопоставления.
