base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: ru
  text: Вождь Дишон, вождь Ецер, вождь Дишан — вот вожди хорреев по своим родам[a] в земле Сеир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно также понять как «по их вождям» или «по их вождествам».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: вождь
  rationale: В данном перечне слово обозначает племенного или родового предводителя. «Вождь» ясно и естественно передаёт смысл, не прибегая к архаичному «князь»; повторение сохранено в соответствии со структурой еврейского текста.
- source_word: דִּשֹׁן
  choice: Дишон
  rationale: Имя передано транслитерацией; оно отличено от сходного имени Дишан.
- source_word: אֵצֶר
  choice: Эцер
  rationale: Имя собственное передано принятой русской библейской транслитерацией.
- source_word: דִּישָׁן
  choice: Дишан
  rationale: Имя передано транслитерацией с сохранением отличия от Дишона.
- source_word: אֵלֶּה אַלּוּפֵי הַחֹרִי
  choice: вот вожди хорреев
  rationale: Безглагольное итоговое предложение естественно передано русской конструкцией с «вот»; название народа употреблено во множественном числе.
- source_word: לְאַלֻּפֵיהֶם
  choice: по своим родам
  rationale: Предлог לְ здесь, вероятно, выражает распределение или классификацию, а אַלּוּף может обозначать не только вождя, но и возглавляемое им родовое подразделение. Основной текст передаёт смысл естественно, а неоднозначность отмечена в сноске.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: в земле Сеир
  rationale: Сохранено обычное географическое выражение исходного текста.
