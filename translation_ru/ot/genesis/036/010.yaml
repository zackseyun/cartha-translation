  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: ru
  text: 'Вот имена сыновей Исава: Елифаз, сын Ады, жены Исава; Реуэл, сын Басемат, жены Исава.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Вот имена
  rationale: Естественная русская формула представления списка, сохраняющая указательное значение אֵלֶּה и значение שְׁמוֹת.
- source_word: בְּנֵי עֵשָׂו
  choice: сыновей Исава
  rationale: Форма בְּנֵי здесь обозначает сыновей мужского пола; родительный оборот естественен для русского языка.
- source_word: אֱלִיפַז
  choice: Елифаз
  rationale: Передача личного имени в узнаваемой русской библейской форме.
- source_word: בֶּן עָדָה
  choice: сын Ады
  rationale: בֶּן прямо выражает сыновнее отношение; имя עָדָה передано как «Ада» с требуемой формой родительного падежа.
- source_word: רְעוּאֵל
  choice: Реуэл
  rationale: Транслитерация непосредственно отражает еврейскую форму имени и не подменяет её формой, восходящей к иной традиции передачи.
- source_word: בֶּן בָּשְׂמַת
  choice: сын Басемат
  rationale: Сохраняется параллельная первой конструкции родословная формула; имя передано непосредственно с еврейского.
- source_word: אֵשֶׁת עֵשָׂו
  choice: жены Исава
  rationale: Приложение относится к имени матери. Повтор оборота после каждого имени сохранён как характерная черта еврейского родословного стиля.
