source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: ru
  text: Тимна была наложницей Елифаза, сына Исава, и родила Елифазу Амалика. Это сыновья[a] Ады, жены Исава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «сыновья». В родословиях древнееврейское слово может также обозначать потомков; согласно ближайшему контексту, здесь названы внуки Ады.
    reason: Сохранение буквальной генеалогической формулы при пояснении степени родства.
lexical_decisions:
- source_word: וְתִמְנַע
  choice: Тимна
  rationale: Личное имя передано прямой транслитерацией с древнееврейского; начальный союз естественно не выражен отдельно в начале русского предложения.
- source_word: הָיְתָה פִילֶגֶשׁ לֶאֱלִיפַז
  choice: была наложницей Елифаза
  rationale: היה здесь служит связкой, а פִילֶגֶשׁ обозначает женщину в признанном, но подчинённом брачном союзе; родительный падеж естественно передаёт отношение, выраженное предлогом לְ.
- source_word: בֶּן עֵשָׂו
  choice: сына Исава
  rationale: Сопряжённая конструкция передана обычным русским родительным оборотом.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: и родила Елифазу Амалика
  rationale: 'Сохранена древнееврейская генеалогическая конструкция: отец обозначен дательным падежом, а ребёнок — прямым дополнением.'
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Это сыновья Ады
  rationale: Формула переведена близко к тексту. בָּנִים может употребляться шире, чем русское «сыновья», включая потомков; контекст пояснён в сноске без подмены формулировки оригинала.
- source_word: אֵשֶׁת עֵשָׂו
  choice: жены Исава
  rationale: Приложение согласовано с именем Ады и естественно передано родительным оборотом.
theological_decisions:
- issue: Степень родства названных лиц с Адой
  choice: В основном тексте сохранено «сыновья», а более широкое генеалогическое значение пояснено в сноске.
  alternative: «внуки Ады» или «потомки Ады»
  rationale: Еврейское בְּנֵי буквально означает «сыновья», но в родословиях может охватывать последующих потомков. По ближайшему контексту перечисленные лица являются внуками Ады, однако перевод «внуки» молча устранил бы семантическую широту исходной формулы.
translation_notes:
  register: 'Современный литературный русский язык с кратким, достойным генеалогическим стилем. Имена переданы непосредственно с древнееврейского: Тимна, Елифаз, Исав, Амалик, Ада.'
