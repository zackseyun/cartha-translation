base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: ru
  text: и Дишон, и Эцер, и Дишан. Вот вожди[a] хорреев, сыновья Сеира, в земле Эдома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родовые главы».'
    reason: Еврейское אַלּוּפִים обозначает общественно-политических глав родов или племенных групп, а не просто выдающихся людей.
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Дишон
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: אֵצֶר
  choice: Эцер
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: דִישָׁן
  choice: Дишан
  rationale: Личное имя передано принятой русской библейской транслитерацией с сохранением отличия от Дишона.
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественно передаёт указательно-идентифицирующую формулу в данном перечне.
- source_word: אַלּוּפֵי
  choice: вожди
  rationale: В контексте Бытия 36 слово обозначает глав родовых или племенных объединений; «вожди» ясно передаёт руководящее положение без архаичного или феодального оттенка.
- source_word: הַחֹרִי
  choice: хорреев
  rationale: Форма единственного числа употреблена собирательно как этноним; по-русски естественно множественное число.
- source_word: בְּנֵי שֵׂעִיר
  choice: сыновья Сеира
  rationale: 'Сохранена формальная родословная лексика оригинала и её возможная широта: речь может идти также о потомках.'
- source_word: בְּאֶרֶץ אֱדֹום
  choice: в земле Эдома
  rationale: Сохранено полное географическое выражение оригинала, включая слово «земля».
