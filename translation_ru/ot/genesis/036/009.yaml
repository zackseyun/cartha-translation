  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: ru
  text: И вот родословие Исава, отца Эдома, жившего в горной стране Сеир.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на горе Сеир»; или: «в горах Сеира».'
    reason: Слово הַר может обозначать отдельную гору, горы или горную местность.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Передаёт формулу введения нового раздела естественным современным русским языком; союз וְ здесь выполняет связующую функцию и не требует отдельного «и».
- source_word: תֹּלְדוֹת
  choice: родословие
  rationale: В данном генеалогическом разделе слово обозначает происхождение и линию потомков Исава; «родословие» сохраняет структурную функцию формулы в Бытии, не сводя её лишь к списку потомков.
- source_word: עֵשָׂו
  choice: Исава
  rationale: Традиционная русская форма библейского имени, поставленная в родительном падеже согласно синтаксису.
- source_word: אֲבִי אֱדוֹם
  choice: праотца Эдома
  rationale: Конструкция буквально означает «отца Эдома», но здесь выражает происхождение народа от Исава; «праотец» естественно передаёт этот смысл и не смешивает его с непосредственным отцовством.
- source_word: בְּהַר שֵׂעִיר
  choice: в горной земле Сеира
  rationale: הַר в географическом сочетании может обозначать гору, горы или горную область; основной вариант передаёт региональный смысл, сохраняя альтернативы в сноске.
