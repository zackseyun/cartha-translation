lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма wayyiqtol продвигает повествование; в русском последовательность событий естественно передаётся простым прошедшим временем без обязательного вводного «затем».
- source_word: שַׂמְלָה
  choice: Самла
  rationale: Личное имя передано транслитерацией, соответствующей еврейской форме и принятому русскому библейскому употреблению.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле смены правителей глагол מלך обозначает вступление нового царя на место прежнего; «воцарился» кратко и естественно передаёт это значение.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте преемства выражение означает, что новый правитель занял место предыдущего.
- source_word: שָׁאוּל
  choice: Шаул
  rationale: Форма «Шаул» непосредственно передаёт еврейское שָׁאוּל; традиционный русский вариант «Саул» указан в сноске.
- source_word: מֵרְחֹבוֹת הַנָּהָר
  choice: из Реховота-на-Реке
  rationale: Предлог מִן указывает на происхождение, а הַנָּהָר служит географическим уточнением названия Реховот. Дефисное оформление естественно обозначает составной топоним, не отождествляя реку без достаточных оснований.
