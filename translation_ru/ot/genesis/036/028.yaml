  text: 'Вот сыновья Дишана: Уц и Аран.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово, вводящее родословный перечень; «вот» естественно передаёт еврейскую именную конструкцию без добавления временной формы глагола.
- source_word: בְנֵי
  choice: сыновья
  rationale: В данном родословном контексте названы двое прямых потомков мужского пола, поэтому конкретное «сыновья» предпочтительнее более общего «дети» или «потомки».
- source_word: דִישָׁן
  choice: Дишан
  rationale: Личное имя передано традиционной русской библейской транслитерацией, различающей Дишана и Дишона в этой родословной.
- source_word: עוּץ
  choice: Уц
  rationale: Личное имя передано в узнаваемой традиционной русской библейской форме.
- source_word: וַאֲרָן
  choice: и Аран
  rationale: Союз ו передан словом «и», а личное имя — прямой транслитерацией.
