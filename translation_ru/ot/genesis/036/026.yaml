  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: ru
  text: 'А вот сыновья Дишана: Хемдан, Эшбан, Итран и Херан[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Керан».'
    reason: Возможны традиционная русская форма «Херан» и более буквальная передача еврейского начального согласного как «к».
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: А вот
  rationale: Сочетание союза с указательным местоимением вводит очередную ветвь родословия. «А вот» естественно связывает стих с предыдущим перечнем и не требует добавлять отсутствующую в еврейском тексте связку.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого состояния буквально означает «сыновья». Здесь перечислены непосредственные сыновья, поэтому более широкое «потомки» не требуется.
- source_word: דִישָׁן
  choice: Дишан
  rationale: Имя передано транслитерацией с масоретской формы данного стиха; гласная а отличает эту форму от имени Дишон в других местах главы.
- source_word: חֶמְדָּן
  choice: Хемдан
  rationale: Транслитерация масоретской формы имени с начальным ח и гласной сеголь.
- source_word: וְ/אֶשְׁבָּן
  choice: Эшбан
  rationale: Имя транслитерировано; союз учтён в оформлении однородного ряда.
- source_word: וְ/יִתְרָן
  choice: Итран
  rationale: Передача формы יִתְרָן непосредственно отражает начальные йод и тав; традиционное «Ифран» менее прозрачно для современного читателя.
- source_word: וּ/כְרָן
  choice: и Херан
  rationale: Союз передан явно перед последним элементом перечня. «Херан» соответствует принятой русской библейской передаче имени; возможна более буквальная транслитерация «Керан».
