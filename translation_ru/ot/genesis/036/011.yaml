  yaml_path: translation/ot/genesis/036/011.yaml
  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: ru
  text: 'Сыновьями Елифаза были: Феман, Омар, Цефо, Гатам и Кеназ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: В генеалогическом перечне форма глагола היה с союзом выражает простую связку и вводит список сыновей; «были» естественно передаёт эту функцию, не привнося значения становления.
- source_word: בְּנֵי
  choice: сыновьями
  rationale: Еврейское существительное стоит во множественном числе мужского рода и в данном генеалогическом контексте прямо обозначает сыновей.
- source_word: אֱלִיפָז
  choice: Елифаза
  rationale: Личное имя передано в принятой русской библейской форме, с падежным окончанием по нормам русского языка.
- source_word: תֵּימָן
  choice: Феман
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: אוֹמָר
  choice: Омар
  rationale: Личное имя транслитерировано в естественной для современного русского языка форме.
- source_word: צְפוֹ
  choice: Цефо
  rationale: Масоретская огласовка указывает на форму Ṣəfō; «Цефо» достаточно близко передаёт её по-русски. В русской традиции это имя также встречается как «Цефи», однако такая форма не соответствует огласовке данного стиха.
- source_word: גַעְתָּם
  choice: Гафам
  rationale: Использована узнаваемая русская библейская передача имени с традиционным соответствием ת — «ф».
- source_word: קְנַז
  choice: Кеназ
  rationale: Имя транслитерировано близко к масоретской форме и в соответствии с современной русской передачей; вариант «Кенец» менее точно отражает гласные исходного текста.
