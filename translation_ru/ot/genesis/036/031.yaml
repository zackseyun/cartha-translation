source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּ/אֶ֣רֶץ אֱד֑וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: ru
  text: Вот цари, которые царствовали в земле Эдома прежде, чем над сынами Израиля стал царствовать царь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде, чем у сынов Израиля стал царствовать царь». Буквально еврейский текст говорит: «прежде царствования царя для/над сынами Израиля».'
    reason: Лексическая неоднозначность предлога לִ перед выражением «сыны Израиля».
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Сочетание союза с указательным местоимением вводит новый перечень. Русское «вот» естественно передаёт эту представительную функцию без тяжеловесного «и вот эти».
- source_word: הַמְּלָכִים
  choice: цари
  rationale: Определённость выражена контекстом и вводной конструкцией «вот»; форма множественного числа передана прямо.
- source_word: אֲשֶׁר מָלְכוּ
  choice: которые царствовали
  rationale: Глагол מלך в породе qal здесь означает осуществление царской власти; «царствовали» точно и естественно соответствует контексту списка царей.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: в земле Эдома
  rationale: Сохранено явное слово אֶרֶץ «земля, страна» и территориальное значение сочетания.
- source_word: לִפְנֵי
  choice: прежде, чем
  rationale: Предлог употреблён во временном значении и указывает, что эдомские цари предшествовали появлению царской власти у Израиля.
- source_word: מְלָךְ מֶלֶךְ
  choice: стал царствовать царь
  rationale: Еврейская конструкция состоит из глагола и стоящего после него подлежащего «царь». Русская формулировка сохраняет единственное число и начало царствования, не добавляя значения «какой-либо».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: над сынами Израиля
  rationale: «Сыны Израиля» сохраняет форму традиционного еврейского этнонима, а «над» передаёт подразумеваемое отношение царского правления к народу; неоднозначность предлога ל отмечена в сноске.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Буквальная форма означает «сыны Израиля» и в данном месте служит названием народа. Она понятна по-русски и сохраняет образ исходного текста, не сводя его молча к нейтральному этнониму.
- issue: Отношение царя к Израилю в לִבְנֵי יִשְׂרָאֵל
  choice: над сынами Израиля
  alternative: для сынов Израиля; у сынов Израиля
  rationale: В контексте царствования «над» наиболее естественно выражает управление, однако сам предлог ל допускает более общее отношение «для/у»; поэтому альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Царствовали» и «сыны Израиля» сохраняют достоинство и форму исходного текста; синтаксис остаётся понятным обычному читателю.
