base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: ru
  text: 'Вот вожди[a] сынов Исава — сыновья Елифаза, первенца Исава: вождь Феман, вождь Омар, вождь Цефо, вождь Кеназ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы родов». Еврейское слово может обозначать вождя, стоящего во главе рода или племенного подразделения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: вожди / вождь
  rationale: В эдомских родословных это слово обозначает главу рода или племенного подразделения. «Вождь» сохраняет характер титула и позволяет одинаково передать его во вводной формуле и перед каждым именем.
- source_word: בְנֵי
  choice: сыны / сыновья
  rationale: Сохранено основное родословное значение «сыновья»; форма «сынов» после слова «вожди» естественна по-русски. Более широкое «потомки» здесь не требуется.
- source_word: בְּכוֹר
  choice: первенец
  rationale: «Первенец» точно передаёт порядок рождения и возможный статусный оттенок, не добавляя толкования.
- source_word: אֵלֶּה
  choice: вот
  rationale: В перечислении русское «вот» естественно передаёт еврейскую указательную вводную формулу без добавления отсутствующего в оригинале глагола.
- source_word: עֵשָׂו / אֱלִיפַז / תֵּימָן / אוֹמָר / צְפוֹ / קְנַז
  choice: Исав / Елифаз / Феман / Омар / Цефо / Кеназ
  rationale: Использованы закрепившиеся в русской библейской традиции формы личных и родовых имён.
