lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма wayyiqtol от מות обозначает последовательное событие в прошлом; «умер» естественно передаёт повествовательную формулу.
- source_word: יוֹבָב
  choice: Иовав
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В перечне царей מלך обозначает вступление на царство; «воцарился» кратко и естественно передаёт этот смысл.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Предлог תחת с местоименным суффиксом указывает на преемство и замещение в царской власти.
- source_word: חֻשָׁם
  choice: Хушам
  rationale: Личное имя транслитерировано с еврейского.
- source_word: מֵאֶרֶץ
  choice: из земли
  rationale: Сочетание מן с אֶרֶץ указывает на географическое происхождение; «из земли» сохраняет форму исходного выражения.
- source_word: הַתֵּימָנִי
  choice: теманитян
  rationale: Форма с этнико-географическим значением после «земли» естественно передаётся как обозначение народа, связанного с Теманом; неоднозначность отмечена в сноске.
