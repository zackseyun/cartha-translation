base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: ru
  text: И поселился Исав в горной области Сеир[a]. Исав — это Эдом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в горах Сеира»; или: «на горе Сеир».'
    reason: Лексически הַר допускает понимание как гористой местности, так и отдельной горы.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: Глагол ישׁב в повествовательной форме здесь обозначает проживание или обоснование на определённой территории; «поселился» естественно передаёт контекст установления места жительства.
- source_word: בְּהַר
  choice: в горной области
  rationale: Слово הַר может обозначать как отдельную гору, так и гористую местность. При названии территории Сеир выражение «в горной области» передаёт географический смысл, не сводя его к одной вершине.
- source_word: שֵׂעִיר
  choice: Сеир
  rationale: Устоявшаяся русская передача географического названия.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Устоявшаяся русская передача личного имени.
- source_word: הוּא אֱדוֹם
  choice: это Эдом
  rationale: Именное предложение прямо отождествляет Исава с Эдомом; конструкция сохраняет краткость и функцию генеалогического пояснения.
