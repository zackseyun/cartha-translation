  yaml_path: translation/ot/genesis/036/003.yaml
  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: ru
  text: и Басема́фу, дочь Измаила, сестру Невайо́та.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: и
  rationale: Союз וְ добавляет ещё один элемент к перечню жён Исава, а אֵת служит показателем определённого прямого дополнения и отдельно не переводится. В русском винительный падеж передан формами имени и приложений.
- source_word: בָּשְׂמַת
  choice: Басема́фу
  rationale: Личное имя передано в принятой русской библейской форме «Басемаф»; винительный падеж обусловлен синтаксисом продолжающегося перечня.
- source_word: בַּת
  choice: дочь
  rationale: Существительное в сопряжённой конструкции обозначает происхождение; приложение согласовано с именем в винительном падеже.
- source_word: יִשְׁמָעֵאל
  choice: Измаила
  rationale: Употреблена устоявшаяся русская библейская форма имени в родительном падеже.
- source_word: אֲחוֹת
  choice: сестру
  rationale: Сопряжённая конструкция обозначает родство; приложение согласовано с прямым дополнением в винительном падеже.
- source_word: נְבָיוֹת
  choice: Неваио́та
  rationale: Имя передано близко к масоретскому נְבָיוֹת с сохранением согласного в и сочетания ио; форма родительного падежа требуется после «сестру».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с традиционными русскими формами хорошо известных библейских имён. Структура двух параллельных приложений сохранена. Ударения отмечены в менее привычных именах для ясного чтения; союз «и» показывает, что стих продолжает предложение предыдущих стихов.
