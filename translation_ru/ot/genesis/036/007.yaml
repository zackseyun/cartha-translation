  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: ru
  text: Ведь имущества у них было слишком много, чтобы им жить вместе, и земля, где они жили как пришельцы,[a] не могла содержать их из-за их скота.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «земля их пришельчества», то есть земля их временного проживания в качестве пришельцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не могла их прокормить»; буквально: «не могла нести их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение отделения Исава от Иакова; «ведь» естественно передаёт пояснительно-причинную связь с предыдущим стихом.
- source_word: רְכוּשָׁם
  choice: имущества у них
  rationale: רְכוּשׁ обозначает нажитое движимое имущество и владения; русская конструкция естественна и не сводит значение только к скоту.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: было слишком много, чтобы жить вместе
  rationale: Сравнительно-результативная конструкция с מִן указывает на избыток, препятствующий совместному проживанию.
- source_word: אֶרֶץ מְגוּרֵיהֶם
  choice: земля, где они жили как пришельцы
  rationale: Передаёт не только место проживания, но и оттенок временного пребывания людей, не являющихся коренными владельцами этой земли.
- source_word: לָשֵׂאת אֹתָם
  choice: не могла вместить их
  rationale: Буквально נשא означает «нести»; применительно к земле идиоматическое «вместить» сохраняет образ ограниченной вместимости и соответствует контексту.
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: из-за их скота
  rationale: מִפְּנֵי выражает причину, а מִקְנֶה охватывает домашний скот в целом, а не только крупный рогатый скот.
