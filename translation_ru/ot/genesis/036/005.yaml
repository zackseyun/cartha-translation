lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: Охоливама
  rationale: Транслитерация личного имени в форме, естественной для русской библейской традиции и близкой к еврейскому звучанию.
- source_word: יָלְדָה
  choice: родила
  rationale: Прямо передаёт материнский субъект и лаконичный генеалогический стиль.
- source_word: יעיש
  choice: Иеуш
  rationale: Транслитерация личного имени с передачей двух гласных исходной формы.
- source_word: יַעְלָם
  choice: Иаалам
  rationale: Транслитерация личного имени, сохраняющая начальную последовательность гласных и долготу, отражённую удвоением а.
- source_word: קֹרַח
  choice: Корей
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: בְּנֵי
  choice: сыновья
  rationale: В данном контексте перечислены именно сыновья, поэтому родовое значение не обобщается до «детей» или «потомков».
- source_word: עֵשָׂו
  choice: Исав
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: родившиеся у него
  rationale: Сохраняет пассивную конструкцию и отнесённость сыновей к Исаву, не добавляя в эту часть фразы явно названного материнского субъекта.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохраняет явное אֶרֶץ «земля» и передаёт географическое название в естественной для русского библейского регистра форме.
