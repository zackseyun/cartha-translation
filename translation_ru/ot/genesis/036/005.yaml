  rationale: Исправлены две формы имён в соответствии с еврейским написанием и современной русской передачей, а также уточнён синтаксис заключительного относительного предложения. Смысл, генеалогический регистр, явное упоминание земли и сдержанность исходной пассивной конструкции сохранены.
