  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: ru
  text: Вот сыновья Исава, и вот их вожди[a]. Он — Эдом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово אַלּוּפִים обозначает глав родов или племён в Эдоме; возможный перевод: «племенные вожди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: вот
  rationale: Указательное слово вводит итоговое перечисление; «вот» естественно передаёт безглагольную древнееврейскую формулу и сохраняет её наглядность.
- source_word: בְנֵי עֵשָׂו
  choice: сыновья Исава
  rationale: В данном родословном контексте בְּנֵי обозначает именно сыновей, а не потомков вообще; имя передано в принятой русской библейской форме.
- source_word: וְאֵלֶּה
  choice: и вот
  rationale: Повтор указательной конструкции сохраняет параллелизм двух частей еврейской фразы.
- source_word: אַלּוּפֵיהֶם
  choice: их вожди
  rationale: В Бытии 36 אַלּוּף обозначает главу рода или племени в Эдоме. «Вожди» кратко и понятно передаёт общественно-политическую роль, не превращая титул в название самих родов.
- source_word: הוּא
  choice: Он
  rationale: Местоимение мужского рода единственного числа возвращает читателя к Исаву и прямо отождествляет его с Эдомом.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Передаёт древнееврейское имя, которым здесь назван Исав как родоначальник народа и страны Эдом.
theological_decisions:
- issue: К кому относится הוּא в заключительной фразе
  choice: «Он — Эдом», то есть Исав — Эдом
  alternative: «Это Эдом», с возможным отнесением ко всей названной группе
  rationale: Форма мужского рода единственного числа естественнее всего возвращается к Исаву; личная формулировка сохраняет прямое отождествление исходного текста, не разворачивая его в дополнительное толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, слегка торжественной родословной формулой. Повтор «вот» сохраняет параллелизм оригинала. Знак сноски поставлен непосредственно после слова «вожди», к которому относится пояснение.
