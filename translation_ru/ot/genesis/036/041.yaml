  text: אַלּ֧וּף אָהֳלִיבָמָ֛ה אַלּ֥וּף אֵלָ֖ה אַלּ֥וּף פִּינֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: ru
  text: Вождь[a] Охоливама, вождь Эла, вождь Пинон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глава рода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: вождь
  rationale: В Бытии 36 это слово обозначает главу эдомского племени или рода. «Вождь» кратко и естественно передаёт положение руководителя, не внося более позднего монархического титула.
- source_word: אָהֳלִיבָמָה
  choice: Охоливама
  rationale: Имя передано близко к еврейскому звучанию; форма сохраняет начальный гортанный согласный и структуру имени.
- source_word: אֵלָה
  choice: Эла
  rationale: В данном перечне слово является именем собственным и передано транслитерацией, без истолкования как нарицательного.
- source_word: פִּינֹן
  choice: Пинон
  rationale: Имя собственное передано непосредственно с еврейского с естественным для русского языка написанием.
