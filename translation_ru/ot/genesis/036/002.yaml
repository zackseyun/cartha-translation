base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: ru
  text: 'Исав взял себе жён из дочерей Ханаана: Аду, дочь Елона, хеттеянина, и Охоливаму, дочь Аны, дочь Цивеона, евеянина[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «евеянин». Некоторые толкователи, сопоставляя это место с родственными родословиями, иначе понимают данную родословную связь, в том числе как «хорреянина».
    reason: Сохраняет заметное расхождение между масоретским чтением и согласующим толкованием родственных родословий.
lexical_decisions:
- source_word: לָקַח אֶת נָשָׁיו
  choice: взял себе жён
  rationale: Сохраняет прямое значение глагола «взял» и ясно передаёт брачный контекст; «женился» было бы более свободным истолкованием.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: из дочерей Ханаана
  rationale: Сохранён библейский еврейский оборот, обозначающий женщин из народов или земли Ханаана.
- source_word: בַּת
  choice: дочь
  rationale: Повтор слова сохранён в обеих родословных связях, чтобы не устранять неоднозначность исходной формулировки.
- source_word: הַחִתִּי
  choice: хеттеянина
  rationale: Употреблён общепринятый русский этноним; дефис связывает имя с этническим определением в естественной русской форме.
- source_word: אָהֳלִיבָמָה
  choice: Охоливама
  rationale: Передача имени следует еврейской форме и современной русской транслитерации.
- source_word: הַחִוִּי
  choice: евеянина
  rationale: Основной текст следует масоретскому чтению חִוִּי; возможное сопоставление с «хорреянином» вынесено в сноску.
theological_decisions:
- issue: Этническое обозначение Цивеона в заключительной части стиха
  choice: евеянин — по масоретскому тексту
  alternative: хорреянин — при согласовании с родственными родословиями, особенно с Быт. 36:20
  rationale: Перевод следует засвидетельствованному еврейскому тексту и не устраняет родословное напряжение молчаливым согласованием.
- issue: Связь Аны и Цивеона в повторе בַּת
  choice: сохранить буквальный повтор «дочь Аны, дочь Цивеона»
  alternative: «дочь Аны, внучка Цивеона» или «дочь Аны, сына Цивеона»
  rationale: Исходный стих дважды употребляет בַּת; уточнение поколения или пола Аны разрешило бы неоднозначность на основании параллельных сведений, а не самой формулировки данного стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским звучанием. Сохранён оборот «дочери Ханаана» и повтор «дочь», но синтаксис и падежи сделаны естественными для русского текста.
