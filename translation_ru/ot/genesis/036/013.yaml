base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: ru
  text: 'И вот сыновья Рагуила: Нахаф, Зерах, Шамма и Мизза. Это были сыновья Васемафы[a], жены Исава.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: потомки Васемафы; по контексту — её внуки через Рагуила.'
    reason: Сохраняет в основном тексте повторённое еврейское «сыновья», одновременно поясняя его более широкое генеалогическое употребление в данном контексте.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит очередной пункт родословия; связь с предыдущим контекстом передаётся последовательностью повествования без тяжеловесного «И вот».
- source_word: בְּנֵי רְעוּאֵל
  choice: сыновья Рагуила
  rationale: Перечислены непосредственные сыновья Рагуила, поэтому конкретное родственное обозначение передано буквально.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: Нахаф, Зерах, Шамма и Мизза
  rationale: Личные имена переданы русской транслитерацией; союз естественно поставлен перед последним элементом перечня.
- source_word: אֵלֶּה הָיוּ
  choice: Они были
  rationale: Передаёт указательно-связочную формулу прошедшего времени естественным современным русским языком.
- source_word: בְּנֵי בָשְׂמַת
  choice: потомками Васемафы[a]
  rationale: בְּנֵי буквально означает «сыновья», но родословный контекст показывает, что названные мужчины — её внуки через Рагуила; «потомки» передаёт более широкий родословный смысл слова, а буквальная форма отмечена в сноске.
- source_word: אֵשֶׁת עֵשָׂו
  choice: жены Исава
  rationale: Естественно и точно передаёт еврейскую сопряжённую конструкцию.
theological_decisions:
- issue: Степень родства названных мужчин с Васемафой
  choice: потомки Васемафы
  alternative: сыновья Васемафы
  rationale: 'Текст повторяет בְּנֵי, однако в данном месте слово употреблено в широком родословном смысле: согласно контексту Рагуил — сын Васемафы, а перечисленные мужчины — его сыновья. Выбор устраняет ложное впечатление о непосредственном материнстве, не сужая смысл до «внуков» без пояснения.'
translation_notes:
  register: Современный литературный русский язык с краткой, достойной родословной формулой. Имена переданы в формах, согласующихся с русской библейской традицией и еврейским текстом.
