  text: וַ/יִּהְי֥וּ בְנֵי לוֹטָ֖ן חֹרִ֣י וְ/הֵימָ֑ם וַ/אֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: ru
  text: Сыновьями Лотана были Хори и Хемам[a], а сестрой Лотана была Тимна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь: «Хемам»; в параллельном перечне в 1 Пар. 1:39 — «Хомам».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: В данном родословном перечне форма глагола היה служит простой связкой и естественно передаётся словом «были».
- source_word: בְנֵי
  choice: сыновьями
  rationale: Здесь названы двое мужчин — Хори и Хемам, поэтому более точен родовой термин «сыновья», а не более широкие «дети» или «потомки».
- source_word: לוֹטָן
  choice: Лотан
  rationale: Личное имя передано русской транслитерацией еврейской формы.
- source_word: חֹרִי
  choice: Хори
  rationale: Личное имя передано транслитерацией; начальная буква ח соответствует принятой русской передаче через «х».
- source_word: הֵימָם
  choice: Хемам
  rationale: Передаёт огласованную форму масоретского текста данного стиха; вариант «Хомам» засвидетельствован в параллельном перечне в 1 Пар. 1:39 и отмечен в сноске.
- source_word: וַאֲחוֹת
  choice: а сестрой ... была
  rationale: Существительное означает «сестра»; связка «была» естественно восполняется по структуре первой части. Союз «а» по-русски ясно отделяет дополнительное генеалогическое сведение без выраженного противопоставления.
- source_word: תִּמְנָע
  choice: Тимна
  rationale: Личное имя передано близко к огласованной еврейской форме.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена краткая родословная форма. Творительный падеж со связкой («сыновьями… были», «сестрой… была») обеспечивает естественное русское звучание и сохраняет параллелизм частей стиха.
