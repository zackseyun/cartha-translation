  text: И умер Шаул[a], и вместо него стал царём Баал-Ханан, сын Ахбора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В традиционных русских переводах встречаются формы «Саул», «Ваалханан» и «Ахборов». Здесь «Шаул», «Баал-Ханан» и «Ахбор» передают еврейские формы ближе.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямой и обычный эквивалент повествовательной формы глагола מות; не заменяется эвфемизмом.
- source_word: שָׁאוּל
  choice: Шаул
  rationale: Передача имени, близкая к еврейскому звучанию и позволяющая отличить исходную форму от традиционного русского «Саул».
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В формуле престолонаследия глагол מלך обозначает вступление на царство; это естественнее по-русски, чем буквальное «царствовал» после выражения «вместо него».
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте смены правителя означает занятие места предшественника.
- source_word: בַּעַל חָנָן
  choice: Баал-Ханан
  rationale: Составное личное имя передано двумя компонентами через дефис, близко к еврейской форме.
- source_word: בֶּן
  choice: сын
  rationale: Обычная передача указания на непосредственное сыновство в генеалогической формуле.
- source_word: עַכְבּוֹר
  choice: Ахбор
  rationale: Устоявшаяся и фонетически понятная русская библейская транслитерация; буква כ здесь имеет спирантное произношение, передаваемое как «х».
