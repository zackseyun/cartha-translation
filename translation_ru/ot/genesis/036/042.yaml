lexical_decisions:
- source_word: אַלּוּף
  choice: вождь
  rationale: В перечне Бытия 36 слово обозначает главу эдомского рода или племенной группы. «Вождь» кратко, естественно для повторяющегося списка и не вносит исторически чуждого титула «князь» или «герцог».
- source_word: קְנַז
  choice: Кеназ
  rationale: Имя собственное передано транслитерацией; форма «Кеназ» закреплена в русской библейской традиции и соответствует еврейской огласовке.
- source_word: תֵּימָן
  choice: Теман
  rationale: Здесь слово является именем собственным, поэтому передано транслитерацией, а не переведено согласно возможному лексическому значению корня.
- source_word: מִבְצָר
  choice: Мивцар
  rationale: Имя собственное передано близко к еврейскому звучанию; буква צ отражена сочетанием «ц», а ב без дагеша — «в».
