  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: ru
  text: И умер Гадад, и вместо него стал царём Самла из Масреки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «из Масреки»; предлог может указывать как на происхождение, так и на связь с этим местом.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма wayyiqtol от מות обозначает очередное событие повествования; «умер» естественно передаёт формулу царской преемственности.
- source_word: הֲדָד
  choice: Гадад
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В контексте смены правителя מלך означает вступление на царство; выражение «стал царём» естественно и ясно передаёт начало правления.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: תחת с местоименным суффиксом обозначает замещение и преемственность, а не только временную последовательность.
- source_word: שַׂמְלָה
  choice: Самла
  rationale: Личное имя передано в форме, соответствующей русской библейской традиции.
- source_word: מִמַּשְׂרֵקָה
  choice: из Масреки
  rationale: Предлог מִן здесь естественно указывает на происхождение или связь с местом; русское «из Масреки» сохраняет это значение.
