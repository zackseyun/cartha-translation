  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: ru
  text: Вот родословие Исава (он же Эдом)[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вот родословие Исава; он — Эдом».'
    reason: Более буквальная передача начального союза и самостоятельной именной части הוּא אֱדוֹם.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Вводит новый раздел и естественно передаёт еврейскую формулу представления; начальный союз וְ не выражен отдельно, поскольку в современном русском здесь он не обязателен.
- source_word: תֹּלְדוֹת
  choice: родословие
  rationale: Сохраняет связь с повторяющейся структурной формулой книги Бытия и, в отличие от слова «потомки», не сводит значение исключительно к перечню потомков.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הוּא
  choice: он же
  rationale: Естественно по-русски передаёт отождествление Исава с Эдомом, сохраняя пояснительный характер фразы.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Сохранена традиционная русская форма имени; в данном контексте оно отождествляется с Исавом.
theological_decisions:
- issue: Передача структурного термина תֹּלְדוֹת
  choice: родословие
  alternative: повествование; потомки
  rationale: Выбор сохраняет литературную функцию повторяющейся формулы Бытия и не ограничивает её смысл только рассказом или только биологическими потомками.
- issue: Отождествление Исава и Эдома
  choice: он же Эдом
  alternative: он — Эдом
  rationale: Основной текст естественно передаёт пояснительное отождествление, а более буквальная синтаксическая форма приведена в примечании без устранения допустимого оттенка исходной конструкции.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, соответствует характеру генеалогического заголовка. Скобки обозначают пояснительное отождествление, присутствующее в еврейском тексте.
