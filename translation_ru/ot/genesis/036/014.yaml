  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: ru
  text: 'И вот сыновья Оголивамы, дочери Аны, дочери Цивона, жены Исава: она родила Исаву Йеуша, Ялама и Кораха.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: И вот
  rationale: Естественная для современного русского языка формула, вводящая очередное генеалогическое сообщение; сохраняет связь с предыдущим повествованием, не перегружая фразу буквальным «и эти были».
- source_word: בְּנֵי
  choice: сыновья
  rationale: Далее перечислены три мужчины, поэтому конкретное «сыновья» точнее широкого «дети» или «потомки».
- source_word: אָהֳלִיבָמָה
  choice: Оголивама
  rationale: Передача личного имени, близкая к еврейскому звучанию и укоренённая в русской библейской традиции.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: дочери Аны, дочери Цивона
  rationale: Повтор слова בַת сохранён без замены второго определения словом «внучки», чтобы не устранять неоднозначность генеалогической формулы.
- source_word: אֵשֶׁת עֵשָׂו
  choice: жены Исава
  rationale: Естественно передаёт конструкцию принадлежности и сохраняет приложение к Оголиваме.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: она родила Исаву
  rationale: 'Дательный падеж передаёт значение לְ при глаголе «родить»: дети были рождены Исаву.'
- source_word: יעיש
  choice: Йеуш
  rationale: Транслитерация личного имени с сохранением начального согласного йод.
- source_word: יַעְלָם
  choice: Ялам
  rationale: Прямая и понятная русская транслитерация еврейского имени.
- source_word: קֹרַח
  choice: Корах
  rationale: Транслитерация имени с передачей конечного ח через «х», без отождествления с русским нарицательным или иной традиционной формой.
theological_decisions:
- issue: Соотношение выражений «дочь Аны» и «дочь Цивона»
  choice: Сохранить оба определения буквально и параллельно
  alternative: Передать второе как «внучка Цивона»
  rationale: Еврейский текст дважды употребляет בַת и не выражает степень родства словом «внучка»; буквальный параллелизм сохраняет генеалогическую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с лаконичной генеалогической формулой. Имена переданы последовательно и близко к еврейскому звучанию; синтаксис остаётся ясным, но не сглаживает повтор «дочери» в исходном тексте.
