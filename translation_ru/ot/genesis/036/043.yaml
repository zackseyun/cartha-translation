source:
  edition: WLC
  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: ru
  text: Вождь[a] Магдиил, вождь Ирам. Это вожди Эдома по их поселениям в земле, которой они владели[b]. Это[d] Исав, отец Эдома[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глава рода». Еврейское слово может обозначать вождя племени или рода.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в земле их владения».'
    reason: lexical_alternative
  - marker: c
    text: То есть Исав был родоначальником эдомитян.
    reason: cultural_note
  - marker: d
    text: 'Или: «Он — Исав».'
    reason: translation_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: вождь
  rationale: В Бытие 36 это слово обозначает главу племени или рода. «Вождь» передаёт официальный статус естественно для современного русского языка и не вносит более поздней феодальной терминологии.
- source_word: מַגְדִּיאֵל
  choice: Магдиил
  rationale: Личное имя передано в традиционной русской библейской форме, близкой к еврейскому звучанию.
- source_word: עִירָם
  choice: Ирам
  rationale: Личное имя передано транслитерацией.
- source_word: אֵלֶּה
  choice: это
  rationale: Указательное местоимение вводит итоговое перечисление; настоящее время подразумевается русским именным предложением.
- source_word: אַלּוּפֵי אֱדֹם
  choice: вожди Эдома
  rationale: Повтор слова «вожди» сохраняет связь с двумя названными руководителями и передаёт конструкцию как итог предшествующего списка.
- source_word: לְמֹשְׁבֹתָם
  choice: по их поселениям
  rationale: 'Предлог לְ здесь выражает распределение или классификацию: вожди перечислены соответственно местам проживания их групп.'
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: в земле, которой они владели
  rationale: אֲחֻזָּה обозначает земельное владение. Придаточная конструкция точно и естественно передаёт смысл на современном русском языке.
- source_word: הוּא עֵשָׂו
  choice: Это Исав
  rationale: Фраза служит заключительным отождествлением всей описанной общности с Исавом. «Это» снижает риск ошибочно отнести местоимение только к последнему названному вождю.
- source_word: אֲבִי אֱדֹם
  choice: отец Эдома
  rationale: 'Сохранён еврейский генеалогический образ: «отец» здесь означает родоначальника народа Эдома.'
theological_decisions:
- issue: Обозначение Исава как родоначальника Эдома
  choice: отец Эдома
  alternative: предок эдомитян
  rationale: Буквальный образ сохраняет генеалогический и этнический смысл оригинала, не добавляя богословских выводов; пояснение устраняет возможное непонимание.
- issue: Референт заключительного הוּא
  choice: Это Исав
  alternative: Он — Исав
  rationale: Выбрана итоговая идентификация предшествующего перечня и народа; альтернативный более буквальный синтаксис отмечен в сноске, поскольку еврейское местоимение допускает такую передачу.
translation_notes:
  register: Современный литературный русский язык с достоинством генеалогического перечня. Синтаксис краткий и перечислительный; традиционный образ «отец Эдома» сохранён, а его этнический смысл пояснён в сноске.
