base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: ru
  text: 'Вот сыновья Реуэла, сына Исава: вождь[a] Нахат, вождь Зерах, вождь Шамма и вождь Мизза. Это вожди Реуэла в земле Едома. Это сыновья Басемат, жены Исава.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «племенной вождь»; еврейское слово אַלּוּף обозначает предводителя едомского рода или племени.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Вводит новую часть родословия и естественно передаёт еврейскую указательную формулу в современном русском языке.
- source_word: בְּנֵי רְעוּאֵל בֶּן עֵשָׂו
  choice: сыновья Реуэла, сына Исава
  rationale: Сохраняет прямое родословное отношение и устраняет возможную синтаксическую неясность с помощью приложения.
- source_word: אַלּוּף
  choice: вождь
  rationale: В едомском контексте слово обозначает племенного или родового предводителя; «вождь» ясно и не вносит позднейшего титула.
- source_word: נַחַת / זֶרַח / שַׁמָּה / מִזָּה
  choice: Нахат / Зерах / Шамма / Мизза
  rationale: Имена переданы непосредственно по масоретской форме; удвоение в «Мизза» отражает сильный дагеш.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Это вожди, произошедшие от Реуэла
  rationale: Конструкция указывает на вождей из линии Реуэла; развёрнутая формулировка по-русски избегает двусмысленного впечатления, будто они принадлежали ему как подчинённые.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: в земле Едома
  rationale: Сохраняет явно выраженное в еврейском тексте слово «земля».
- source_word: בְּנֵי בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: сыновья Басемат, жены Исава
  rationale: Передаёт указание на материнскую линию и сохраняет приложение, определяющее Басемат.
