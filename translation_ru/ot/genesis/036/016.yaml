  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: ru
  text: Вождь Корах, вождь Гаатам, вождь Амалек — это вожди Элифаза в земле Эдома; это сыновья Ады.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: вождь
  rationale: В родословном перечне Эдома слово обозначает главу рода или племени; «вождь» естественно и достаточно точно передаёт этот статус.
- source_word: גַּעְתָּם
  choice: Гаатам
  rationale: Транслитерация масоретской формы имени с передачей гортанной ע через сочетание гласных.
- source_word: בְּנֵי
  choice: потомки
  rationale: 'Здесь перечислены не только непосредственные сыновья Ады: названные вожди относятся к её линии через Элифаза. Контекстуальное значение «потомки» устраняет ложное впечатление о прямом материнстве, не меняя родословной связи.'
