base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: ru
  text: И умер Хушам, и вместо него воцарился Гадад, сын Бедада, поразивший Мадиан на поле Моава[a]. Имя его города — Авит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в земле (на территории) Моава». Еврейское слово может обозначать как поле, так и открытую местность, область или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямо и без эвфемизма передаёт обычное значение глагола מות.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: вместо него воцарился
  rationale: Передаёт и начало царствования, и смену предшественника; естественно звучит в русском повествовании.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Гадад, сын Бедада
  rationale: Имена переданы в традиционной русской библейской форме, а בן — обычным родословным оборотом «сын».
- source_word: הַמַּכֶּה
  choice: поразивший
  rationale: Причастная форма сохраняет определительный характер еврейского Hiphil-причастия и не уточняет без необходимости, было ли это окончательной победой.
- source_word: אֶת מִדְיָן
  choice: Мадиан
  rationale: Сохраняет собственное имя как в еврейском тексте, не заменяя его толкованием «мадианитяне».
- source_word: בִּשְׂדֵה מוֹאָב
  choice: на поле Моава
  rationale: Формально передаёт שׂדה; возможное более широкое географическое значение отмечено в сноске.
- source_word: וְשֵׁם עִירוֹ
  choice: Имя его города —
  rationale: Естественно передаёт еврейскую формулу именования, сохраняя лаконичный летописный стиль.
- source_word: עֲוִית
  choice: Авит
  rationale: Транслитерация топонима с учётом традиционной русской библейской передачи.
