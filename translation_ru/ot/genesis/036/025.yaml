  text: וְ/אֵ֥לֶּה בְנֵֽי עֲנָ֖ה דִּשֹׁ֑ן וְ/אָהֳלִיבָמָ֖ה בַּת עֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/025.yaml
  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: ru
  text: 'Вот сыновья Аны: Дишон и Оголивама, дочь Аны.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: сыновья
  rationale: Обычное значение слова в родословном перечне. Хотя далее названа также дочь, сохраняется формулировка исходного текста, не сглаживающая его грамматическое напряжение.
- source_word: דִּשֹׁן
  choice: Дишон
  rationale: Транслитерация еврейского личного имени с различением от имени דִּישָׁן (Дишан) в контексте главы.
- source_word: אָהֳלִיבָמָה
  choice: Оголивама
  rationale: Устоявшаяся русская библейская передача имени, достаточно близкая к еврейской форме.
theological_decisions:
- issue: Сочетание «сыновья Аны» с последующим упоминанием дочери
  choice: Сохранить «сыновья», как в масоретском тексте
  alternative: 'Передать обобщённо: «дети Аны»'
  rationale: Перевод не должен молча устранять реальную особенность исходного текста; слово בְנֵי формально означает «сыновья».
translation_notes:
  register: Современный литературный русский язык; краткая родословная формула передана естественно и с достоинством. Повтор «Аны» сохранён вслед за оригиналом.
