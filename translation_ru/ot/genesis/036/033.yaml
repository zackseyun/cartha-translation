lexical_decisions:
- source_word: וַיָּמָת
  choice: и умер
  rationale: Форма wayyiqtol от מוּת продолжает последовательное повествование; подлежащее Бела названо непосредственно.
- source_word: בָּלַע
  choice: Бела
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В формуле престолонаследия глагол מלך обозначает вступление во власть; по-русски естественно «стал царём».
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: תחת с местоименным суффиксом указывает на занятие места предшествующего правителя.
- source_word: יוֹבָב
  choice: Иовав
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בֶּן זֶרַח
  choice: сын Зераха
  rationale: Сопряжённая конструкция прямо выражает отчество.
- source_word: מִבָּצְרָה
  choice: из Боцры
  rationale: Предлог מִן прежде всего указывает на происхождение; «из Боцры» естественно передаёт это значение, сохраняя возможность связи с городом.
