source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: ru
  text: Исав взял своих жён, сыновей, дочерей и всех людей своего дома, а также свой скот, всех своих животных и всё имущество, которое он приобрёл в земле Ханаан, и отправился в землю[a] из-за своего брата Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в землю». В части рукописей и древних переводов читается: «в землю Сеир». Многие переводы передают выражение по смыслу: «в другую землю».'
    reason: 'Текстовая неопределённость и вариант чтения: масоретский текст не называет место назначения; часть текстовых свидетельств уточняет его как Сеир.'
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное значение לקח — «взять»; в рассказе о переселении естественно подразумевается, что Исав взял перечисленных людей и имущество с собой.
- source_word: נָשָׁיו
  choice: своих жён
  rationale: Форма множественного числа אִשָּׁה здесь обозначает именно жён Исава.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: сыновей, дочерей
  rationale: Перевод сохраняет явное разграничение сыновей и дочерей в еврейском тексте.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: всех людей своего дома
  rationale: В данном обороте נֶפֶשׁ означает людей, принадлежащих к домашнему сообществу; «людей своего дома» звучит по-русски естественно и не привносит богословского смысла слова «душа».
- source_word: מִקְנֵהוּ
  choice: свой скот
  rationale: מִקְנֶה обозначает домашний скот как движимое имущество; «скот» — ясный и традиционный русский эквивалент.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: всех своих животных
  rationale: Более широкое בְּהֵמָה передано словом «животные», чтобы сохранить отличие от предшествующего מִקְנֶה — «скот».
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: всё имущество, которое он приобрёл
  rationale: קִנְיָן означает имущество или собственность, а רכשׁ подчёркивает его приобретение.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохранено полное географическое выражение еврейского текста; такая форма литературна и понятна современному читателю.
- source_word: אֶל אֶרֶץ
  choice: в некую землю
  rationale: Масоретский текст буквально говорит «в землю», не называя её и не вводя слова «другую»; «в некую землю» сохраняет эту неопределённость в приемлемой русской форме.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: из-за своего брата Иакова
  rationale: מִפְּנֵי допускает причинный смысл «из-за, вследствие»; следующий стих объясняет причиной переселения невозможность двум братьям жить вместе из-за множества имущества.
theological_decisions:
- issue: Причинное или пространственное значение מִפְּנֵי
  choice: из-за своего брата Иакова
  alternative: подальше от своего брата Иакова / от лица своего брата Иакова
  rationale: Выбран причинный оттенок, поддерживаемый пояснением в Быт 36:7, при сохранении в примечаниях переводческого решения без превращения его в богословское утверждение.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Перечень сохранён без сокращений; повторение «всех / всё» передаёт накопительную структуру оригинала. Слово «некую» используется не разговорно, а для сохранения неопределённости אֶרֶץ.
