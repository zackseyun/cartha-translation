    rationale: 'Неопределённый артикл в русском выражении «некая земля» добавляет прагматический оттенок: речь о неизвестной, но конкретной земле. В еврейском просто «в землю»; это трудное, но намеренно неуточнённое чтение.'
  - severity: low
