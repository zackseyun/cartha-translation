review_pass:
  verdict: revise
  source_fidelity: Передача перечня лиц, скота и имущества в целом точна. Однако «в некую землю» неоправданно придаёт אֶרֶץ оттенок неопределённого, но конкретного места («в какую-то землю»), которого в еврейском нет; нейтральное «в другую землю» передаёт естественный для русского контекст ухода в иную землю, но это уже интерпретация. Безопаснее сохранить буквальную неопределённость как «в землю», несмотря на некоторую необычность. Причинное «из-за» допустимо для מִפְּנֵי и согласуется с пояснением следующего стиха.
  naturalness: «В некую землю» звучит несколько книжно-искусственно и в современном русском обычно предполагает намеренное умолчание о конкретном объекте. «В землю» в данном библейском контексте литературно приемлемо; «в земле Ханаанской» лучше заменить на более современное «в земле Ханаан», сохранив слово «земля» оригинала.
  terminology: Имена «Исав», «Иаков» и «Ханаан» нормативны. «Людей своего дома», «скот», «животных» и «имущество» адекватно передают соответствующие термины. Текстологическая сноска должна точно отличать буквальное чтение масоретского текста от вариантов, не выдавая контекстуальный перевод за чтение рукописей.
