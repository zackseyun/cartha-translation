  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: ru
  text: 'Вот вожди хорреев: вождь Лотан[a], вождь Шовал, вождь Цивеон, вождь Ана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы родов» или «племенные вожди»; еврейское слово может обозначать главу рода или племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное множественное слово вводит перечень; русское «вот» естественно представляет перечисляемых лиц без добавления глагола-связки.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: вожди / вождь
  rationale: В Бытии 36 термин обозначает глав рода или племени. «Вождь» передаёт положение руководителя и позволяет сохранить повтор перед каждым именем, как в еврейском тексте.
- source_word: הַחֹרִי
  choice: хорреев
  rationale: Форма морфологически единственного числа употреблена как собирательное название народа; по-русски естественно множественное «хорреи» в родительном падеже.
- source_word: לוֹטָן
  choice: Лотан
  rationale: Традиционная и фонетически близкая русская передача личного имени.
- source_word: שׁוֹבָל
  choice: Шовал
  rationale: Передача имени с учётом еврейского согласного שׁ и фрикативного ב без дагеша.
- source_word: צִבְעוֹן
  choice: Цивон
  rationale: Передача еврейского имени צִבְעוֹן в форме, принятой в русской библейской традиции.
- source_word: עֲנָה
  choice: Ана
  rationale: Фонетически близкая русская передача личного имени עֲנָה.
