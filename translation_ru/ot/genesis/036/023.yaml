  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: ru
  text: 'Вот сыновья Шовала: Алван[a], Манахат, Эвал, Шефо[b] и Онам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь Алван; в параллельной родословной в 1 Пар. 1:40 — Алиан.
    reason: alternative_reading
  - marker: b
    text: В еврейском тексте здесь Шефо; в параллельной родословной в 1 Пар. 1:40 — Шефи.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Вот
  rationale: Вводит очередной пункт родословия; «вот» естественно передаёт указательную формулу, тогда как союз ו в русском не обязательно выражать отдельно.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Здесь перечислены непосредственные потомки мужского пола, поэтому конкретное «сыновья» точнее широкого «потомки».
- source_word: שׁוֹבָל
  choice: Шовал
  rationale: Личное имя передано транслитерацией с древнееврейского.
- source_word: עַלְוָן
  choice: Алван
  rationale: Передана форма масоретского текста Бытия; вариант «Алиан» в параллельной родословной отмечен в сноске.
- source_word: וּ/מָנַחַת
  choice: Манахат
  rationale: Личное имя транслитерировано; союз выражен структурой русского перечисления.
- source_word: וְ/עֵיבָל
  choice: Эвал
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей древнееврейскому עֵיבָל.
- source_word: שְׁפוֹ
  choice: Шефо
  rationale: Передана форма масоретского текста данного стиха; вариант параллельной родословной сохранён в сноске.
- source_word: וְ/אוֹנָם
  choice: и Онам
  rationale: Личное имя транслитерировано, а союз перед последним членом списка сохранён по нормам русского языка.
