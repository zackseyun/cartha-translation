base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: ru
  text: 'Вот сыновья Оголивамы, жены Исава: вождь[a] Иеуш, вождь Ялам и вождь Корах. Это вожди Оголивамы, дочери Аны, жены Исава.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глава рода». Еврейское слово обозначает предводителей эдомских родовых или племенных групп.'
    reason: Лексическая альтернатива уточняет общественное положение названных лиц, не сужая значение в основном тексте.
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Мужское множественное число обозначает здесь названных по именам сыновей, а не потомков в широком смысле.
- source_word: אָהֳלִיבָמָה
  choice: Оголивама
  rationale: Устоявшаяся русская библейская передача личного имени, сохраняющая его узнаваемость.
- source_word: אֵשֶׁת עֵשָׂו
  choice: жена Исава
  rationale: Естественная русская передача сопряжённой конструкции; в обоих случаях выражение переведено одинаково.
- source_word: אַלּוּף
  choice: вождь
  rationale: В Бытии 36 слово обозначает предводителя эдомской родовой или племенной группы. «Вождь» кратко передаёт титул и не вносит излишней конкретизации в основной текст.
- source_word: יְעוּשׁ
  choice: Иеуш
  rationale: Передача личного имени по еврейской форме.
- source_word: יַעְלָם
  choice: Ялам
  rationale: Передача личного имени по еврейской форме.
- source_word: קֹרַח
  choice: Корах
  rationale: Передача личного имени по еврейской форме без отождествления с нарицательным значением.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: Это вожди Оголивамы
  rationale: Сохраняется краткая именная конструкция оригинала; не добавляется отсутствующее в еврейском тексте пояснение «происходившие от».
- source_word: בַּת עֲנָה
  choice: дочь Аны
  rationale: Прямая и естественная передача родственной связи.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: Вот ... Это
  rationale: Повтор указательных слов сохраняет рамочную структуру генеалогического сообщения, а настоящее время соответствует безглагольным предложениям еврейского текста.
