lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В последовательности царей форма глагола מלך обозначает вступление на престол; «воцарился» естественно передаёт это значение и сохраняет повествовательную последовательность.
- source_word: בֶּאֱדוֹם
  choice: в Эдоме
  rationale: Предлог ב прежде всего указывает место. Перевод «в Эдоме» непосредственно сохраняет еврейскую конструкцию, не исключая смысла царствования над Эдомом.
- source_word: בֶּלַע
  choice: Бела
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן בְּעוֹר
  choice: сын Беора
  rationale: Прямо передаёт стандартную еврейскую родословную конструкцию.
- source_word: וְשֵׁם עִירוֹ
  choice: имя его города
  rationale: Сохраняет явное местоименное окончание третьего лица в עִירוֹ и естественно передаёт конструкцию принадлежности.
- source_word: דִּנְהָבָה
  choice: Дингава
  rationale: Название города передано в форме, закрепившейся в русской библейской традиции; она отражает древнюю передачу имени и остаётся узнаваемой для русскоязычного читателя.
