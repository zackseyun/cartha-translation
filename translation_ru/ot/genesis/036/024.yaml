  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: ru
  text: 'Вот сыновья Цивеона: Айя и Ана. Это тот Ана, который нашёл в пустыне йемим[a], когда пас ослов для Цивеона, своего отца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение еврейского слова «йемим» неясно. Его понимают как «горячие источники», а в некоторых древних и позднейших толкованиях — как «мулов». В основном тексте сохранено еврейское слово, поскольку языковые данные не позволяют сделать уверенный выбор.
    reason: lexical_alternative
