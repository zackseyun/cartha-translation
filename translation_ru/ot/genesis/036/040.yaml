  register: Современный литературный русский язык с достоинством перечня. Синтаксический параллелизм исходного текста сохранён, но выражение בִּשְׁמֹתָם передано естественным наречием «поимённо». Имена транслитерированы преимущественно по еврейской форме; традиционная русская форма «Фимна» отмечена в сноске.
