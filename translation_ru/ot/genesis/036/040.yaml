base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: ru
  text: 'И вот имена вождей Исава — по их родам, по их местам, поимённо: вождь Тимна[a], вождь Алва[b], вождь Йетет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционная русская библейская форма этого имени — «Фимна».
    reason: translation_tradition
  - marker: b
    text: В еврейском тексте здесь «Алва»; ср. форму имени «Алиа» в 1 Паралипоменон 1:51.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит следующий перечень и передаёт указательное значение; связь с предыдущим контекстом сохраняется самим продолжением списка.
- source_word: שְׁמוֹת אַלּוּפֵי עֵשָׂו
  choice: имена вождей Исава
  rationale: Конструкция со значением принадлежности передана прямо; «вожди» обозначает племенных руководителей и не привносит позднейших дворянских титулов.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь означает родовую или клановую группу; «роды» естественно звучит в русском генеалогическом контексте.
- source_word: לִמְקֹמֹתָם
  choice: по их местам
  rationale: Сохраняет буквальную широту מָקוֹם и не сужает смысл до поселений или областей.
- source_word: בִּשְׁמֹתָם
  choice: поимённо
  rationale: Естественно по-русски выражает перечисление вождей по именам, не воспроизводя тяжеловесно оборот «по их именам».
- source_word: אַלּוּף
  choice: вождь
  rationale: Подходящее современное обозначение эдомского племенного руководителя; последовательно повторено как титул перед каждым именем.
- source_word: תִּמְנָע
  choice: Тимна
  rationale: Прямая русская передача масоретской формы имени.
- source_word: עַלְוָה
  choice: Алва
  rationale: Следует форме масоретского текста данного стиха и не гармонизирует её с родственной формой в 1 Паралипоменон 1:51.
- source_word: יְתֵת
  choice: Йетет
  rationale: Передаёт согласные масоретской формы и не смешивает имя с похожими библейскими именами.
theological_decisions: []
