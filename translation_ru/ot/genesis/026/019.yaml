  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: ru
  text: Слуги Исаака копали в русле потока[a] и нашли там колодец с живой водой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в долине» или «в русле сезонного водотока». Еврейское слово часто обозначает вади — русло, по которому вода течёт лишь в сезон дождей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живой водой», то есть свежей, проточной водой из подземного источника, а не стоячей водой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: стали копать
  rationale: Форма Qal wayyiqtol от חפר обозначает обычное действие копания; в последовательном повествовании естественно передаётся как «стали копать».
- source_word: עַבְדֵי יִצְחָק
  choice: слуги Исаака
  rationale: Сочетание обозначает людей, находившихся на службе у Исаака. «Слуги» естественно для контекста и не уточняет их правовой статус, которого данный стих не определяет.
- source_word: בַּנָּחַל
  choice: в русле потока
  rationale: נחל может обозначать вади — русло сезонного водотока. Выражение «в русле потока» понятно современному русскому читателю и передаёт географический смысл без экзотизма.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: и нашли там
  rationale: Сохранены последовательность повествования и указательное наречие שָׁם «там».
- source_word: בְּאֵר
  choice: колодец
  rationale: Обычное соответствие существительному בְּאֵר; характер воды уточняется следующей фразой.
- source_word: מַיִם חַיִּים
  choice: живая вода
  rationale: Буквальное выражение сохраняет образность и межтекстовый библейский отклик; примечание поясняет, что речь идёт о свежей, проточной родниковой воде.
