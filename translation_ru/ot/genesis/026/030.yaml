  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: ru
  text: И он устроил для них пир[a], и они ели и пили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздничное угощение»; еврейское слово обозначает пир, на котором заметное место занимает питьё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: устроил
  rationale: В сочетании с מִשְׁתֶּה глагол עשה означает не просто «сделал», а устроил или приготовил пир; «устроил» естественно передаёт организацию угощения.
- source_word: לָהֶם
  choice: для них
  rationale: Предлог ל обозначает тех, в чью пользу устроен пир; по-русски естественно «для них».
- source_word: מִשְׁתֶּה
  choice: пир
  rationale: Слово обозначает пир или праздничное угощение, в котором заметное место занимает питьё. «Пир» кратко и естественно сочетается с последующим «ели и пили».
- source_word: וַיֹּאכְלוּ
  choice: и они ели
  rationale: Прямо передаёт последовательное повествовательное действие и сохраняет союз.
- source_word: וַיִּשְׁתּוּ
  choice: и пили
  rationale: Прямо передаёт второе согласованное действие; повторять местоимение в русском языке не требуется.
theological_decisions: []
