base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: ru
  text: 'И они сказали: «Мы совершенно ясно увидели, что Яхве был с тобой. И мы сказали: „Пусть между нами — между нами и тобой — будет клятва[a], и заключим с тобой завет“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать клятву, подкреплённую призыванием проклятия на того, кто её нарушит.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И они сказали
  rationale: Сохраняет обычное повествовательное продолжение, выраженное формой с waw-консекутивом, без излишнего уточнения времени.
- source_word: רָאוֹ רָאִינוּ
  choice: Мы ясно увидели
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «ясно увидели» естественно передаёт эту эмфазу по-русски.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: что Яхве с тобой
  rationale: В данном контексте הָיָה обозначает явное для говорящих присутствие и благоволение Бога, сохраняющее актуальность; русское настоящее время звучит естественно и не ограничивает это присутствие прошлым.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַנֹּאמֶר
  choice: Поэтому мы решили
  rationale: Связывает предложение с сделанным наблюдением. «Решили» естественно передаёт предшествующее обсуждение или принятое говорящими решение, хотя буквально стоит «сказали».
- source_word: תְּהִי נָא
  choice: пусть … будет
  rationale: Передаёт побудительно-пожелательное значение юссива с частицей נָא; в русском контексте сама формула предложения достаточно вежлива без обязательного «пожалуйста».
- source_word: אָלָה
  choice: клятва
  rationale: В договорном контексте означает скрепляющую соглашение клятву; возможный оттенок призываемого на нарушителя проклятия сохранён в сноске.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: между нами — между нами и тобой
  rationale: Сохраняет формальную повторность и двусторонний характер еврейского выражения, оставаясь понятным по-русски.
- source_word: וְנִכְרְתָה בְרִית
  choice: и заключим … завет
  rationale: Естественная русская передача устойчивого еврейского оборота, буквально «разрежем завет».
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Передаёт обращение к Исааку в единственном числе.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Временной оттенок הָיָה в выражении о присутствии Яхве
  choice: Яхве с тобой
  alternative: Яхве был с тобой; Яхве был и остаётся с тобой
  rationale: Контекст указывает на присутствие Бога, распознанное по пережитому благословению и значимое в настоящем. Настоящее время сохраняет актуальность, не добавляя явно отсутствующего «остаётся».
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Повтор «между нами — между нами и тобой» намеренно сохраняет формально-договорную эмфазу оригинала; тире помогает естественному чтению.
