  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: ru
  text: 'И сказал Авимелех: «Что же ты с нами сделал? Ещё немного[a] — и кто-нибудь из народа лёг бы с твоей женой, и ты навлёк бы на нас вину».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто-нибудь из народа едва не лёг с твоей женой».'
    reason: Лексема כִּמְעַט может означать как «ещё немного — и», так и «почти, едва не».
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Что же ты с нами сделал?
  rationale: Частица «же» передаёт возмущённый, восклицательный характер еврейской конструкции מַה זֹּאת, а «с нами» сохраняет общинный объект לָּנוּ и звучит естественно по-русски.
- source_word: כִּמְעַט
  choice: Ещё немного — и
  rationale: Оборот естественно выражает опасность события, которое едва не произошло, и допускает условно-контрфактическое понимание последующего глагола. Более прямое прочтение «едва не» сохранено в сноске.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: лёг бы с твоей женой
  rationale: Сохраняет телесно-сексуальную идиому оригинала в понятной и достойной форме, не прибегая ни к разговорному «переспал бы», ни к клиническому выражению.
- source_word: אַחַד הָעָם
  choice: кто-нибудь из народа
  rationale: Передаёт неопределённого представителя коллективного הָעָם, не добавляя отсутствующего в тексте слова «мужчина».
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: и ты навёл бы на нас вину
  rationale: «Навёл бы на нас» естественно передаёт причинение и возложение последствий, а «вина» сохраняет нравственно-религиозный смысл אָשָׁם, не сводя его к общественному порицанию.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: И сказал Авимелех
  rationale: Сохраняет обычное повествовательное соединение wayyiqtol и торжественно-нейтральный библейский регистр без излишней архаизации.
theological_decisions:
- issue: Смысл אָשָׁם в данном контексте
  choice: вина
  alternative: обвинение; проступок
  rationale: Речь идёт об объективной нравственной виновности, которая легла бы на общину вследствие половой связи с замужней женщиной, а не только о дурной славе. При этом перевод не вводит специальную позднейшую жертвенную терминологию.
- issue: Модальность כִּמְעַט שָׁכַב
  choice: Ещё немного — и ... лёг бы
  alternative: кто-нибудь ... едва не лёг
  rationale: Еврейский оборот допускает как указание на лёгкую возможность и опасность, так и представление о почти совершившемся действии. Основной текст естественно выражает контрфактическую угрозу в контексте, а сноска сохраняет более буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис остаётся ясным для широкого читателя; архаизмы и конфессионально окрашенная лексика не используются.
