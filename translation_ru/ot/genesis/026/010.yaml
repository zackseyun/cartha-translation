  source_fidelity: 'Основной смысл передан точно: Авимелех возмущённо указывает на почти случившуюся возможность половой связи с женой Исаака и на вину, которая вследствие этого легла бы на его народ. Оборот «Ещё немного — и ... лёг бы» адекватно передаёт כִּמְעַט в данном контексте; сноска сохраняет вариант с «едва не».'
  naturalness: Текст в целом естественен для современного литературного русского. Однако «навести на нас вину» звучит неестественно и может восприниматься как намеренное приписывание вины. Нормативный и ясный оборот для причинения такой виновности — «навлечь на нас вину».
  terminology: «Авимелех», «лёг бы с твоей женой» и «вина» уместны по регистру и сохраняют смысл оригинала. «Кто-нибудь из народа» не добавляет явно отсутствующее в еврейском тексте слово «мужчина», тогда как контекст делает сексуального партнёра понятным.
