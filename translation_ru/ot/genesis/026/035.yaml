lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: И они были
  rationale: Форма Qal wayyiqtol, 3-е лицо женского рода множественного числа, продолжает повествование и относится к жёнам Исава из предыдущего стиха. «Были» естественно передаёт состояние; возможно также «стали».
- source_word: מֹרַת רוּחַ
  choice: горечью духа
  rationale: Сохранён выразительный еврейский оборот со значением глубокой досады, огорчения или скорби; творительный падеж естественно оформляет именную часть сказуемого в русском языке.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: для Исаака и Ревекки
  rationale: Предлог לְ обозначает затронутых этим состоянием лиц. Русское «для» здесь звучит естественнее буквального «Исааку и Ревекке», а повтор предлога перед вторым именем не требуется.
