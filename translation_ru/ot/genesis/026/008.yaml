base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: ru
  text: 'Когда Исаак прожил там уже много времени, Авимелех, царь филистимлян, выглянул в окно и увидел: Исаак ласкал[a] свою жену Ревекку.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «играл с», «смеялся с»; еврейский глагол связан с именем Исаака и может обозначать игривое либо интимно-нежное поведение. Здесь поступок Исаака показал, что Ревекка — его жена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Когда
  rationale: Сочетание вводит временное обстоятельство нового события; в современном русском повествовании естественное «когда» передаёт эту функцию без тяжеловесного «и случилось».
- source_word: אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: Исаак прожил там уже много времени
  rationale: Еврейская идиома буквально говорит, что его дни там продлились; русский оборот передаёт продолжительность пребывания ясно и естественно.
- source_word: וַיַּשְׁקֵף
  choice: выглянул
  rationale: Глагол обозначает взгляд из некоторого места наружу или вниз; вместе с упоминанием окна «выглянул» звучит естественно.
- source_word: בְּעַד הַחַלּוֹן
  choice: в окно
  rationale: Предлог с существительным «окно» описывает взгляд через оконный проём; по-русски при глаголе «выглянул» естественно сказать «в окно».
- source_word: וַיַּרְא וְהִנֵּה
  choice: 'и увидел:'
  rationale: Двоеточие передаёт вводимое הִנֵּה живое обнаружение увиденного, избегая архаичного или стилистически неуместного «вот».
- source_word: מְצַחֵק
  choice: ласкал
  rationale: Форма от צחק допускает игру, смех и интимно-нежное поведение. В данном контексте увиденное выдаёт супружеские отношения; «ласкал» естественно передаёт это, не уточняя характер близости сверх текста.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: свою жену Ревекку
  rationale: Приложение אִשְׁתּוֹ определяет статус Ревекки; русский порядок слов естественно ставит обозначение отношения перед именем.
