lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: И остался
  rationale: Глагол ישׁב в повествовательной форме обозначает пребывание или проживание. В данном контексте Исаак исполняет предшествующее повеление и остаётся в Гераре; «остался» естественно передаёт эту связь, не подразумевая непременно постоянного поселения.
- source_word: יִצְחָק
  choice: Исаак
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: בִּגְרָר
  choice: в Гераре
  rationale: Предлог בְּ выражает местонахождение; название места передано в принятой русской форме с нормативным склонением.
- source_word: וַ
  choice: И
  rationale: Повествовательный союз продолжает рассказ и связывает действие Исаака с предшествующим Божьим повелением. Русское «и» сохраняет простоту исходной связки, не усиливая причинно-следственный оттенок сверх текста.
