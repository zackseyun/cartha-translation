  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: ru
  text: 'Он ушёл оттуда и выкопал ещё один колодец. Из-за него не спорили. Он назвал его Реховот[a], сказав: «Теперь Яхве дал нам простор, и мы будем плодиться на этой земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Название «Реховот» созвучно еврейскому слову со значением «просторные места»; объяснение Исаака обыгрывает это значение: «Яхве дал нам простор».'
    reason: Сноска раскрывает непередаваемую напрямую игру слов между названием רְחֹבוֹת и глаголом הִרְחִיב.
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Он перешёл оттуда на другое место
  rationale: Глагол עתק в данном контексте обозначает перемещение Исаака с прежнего места; формулировка естественна по-русски и ясно передаёт смену стоянки.
- source_word: בְּאֵר אַחֶרֶת
  choice: ещё один колодец
  rationale: Передаёт значение «другой, ещё один» и естественно продолжает повествование о нескольких колодцах.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: Из-за него уже не спорили
  rationale: ריב означает спор или распрю; «из-за него» точно указывает на колодец, а «уже» естественно подчёркивает отличие от предыдущих случаев, не добавляя нового факта.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: он назвал его Реховот
  rationale: Естественная русская формула наречения имени; название передано транслитерацией и разъяснено в сноске.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: Теперь Яхве дал нам простор
  rationale: הִרְחִיב буквально связано с расширением пространства; «дал нам простор» сохраняет смысл и словесную связь с названием Реховот.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: и мы будем плодиться в этой земле
  rationale: «Плодиться» сохраняет обычное для פרה значение умножения потомства и отзвук языка благословения; «эта земля» в контексте указывает на землю пребывания Исаака.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Значение וּפָרִינוּ
  choice: будем плодиться
  alternative: будем преуспевать
  rationale: Выбрано основное значение корня פרה — приносить плод, умножаться; более широкое «преуспевать» могло бы сгладить связь с благословением о многочисленном потомстве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён для ясности, игра слов сохранена в основном тексте и объяснена сноской.
