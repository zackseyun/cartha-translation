  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/יִצְחָ֗ק וַ/יֹּ֨אמֶר֙ אַ֣ךְ הִנֵּ֤ה אִשְׁתְּ/ךָ֙ הִ֔וא וְ/אֵ֥יךְ אָמַ֖רְתָּ אֲחֹ֣תִ/י הִ֑וא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יִצְחָ֔ק כִּ֣י אָמַ֔רְתִּי פֶּן אָמ֖וּת עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: ru
  text: 'Авимелех призвал Исаака и сказал: «Так ведь она твоя жена! Как же ты сказал: „Она моя сестра“?» Исаак ответил ему: «Потому что я сказал: „Как бы мне не умереть из-за неё[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть: чтобы меня не убили из-за неё.'
    reason: Еврейское выражение кратко указывает на Ревекку как на причину опасности; контекст поясняет, что Исаак боялся быть убитым людьми, желавшими взять её.
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: призвал Исаака
  rationale: Конструкция קרא с לְ при обозначении лица может означать вызов или призыв к себе; «призвал» естественно передаёт действие царя, потребовавшего объяснений.
- source_word: אַךְ הִנֵּה
  choice: так ведь
  rationale: Сочетание частиц подчёркивает внезапно подтверждённый факт. «Так ведь» передаёт уверенное, укоризненное восклицание, не превращая его в вопрос и не используя архаичное «вот» в нагромождении частиц.
- source_word: אִשְׁתְּךָ הִוא
  choice: она твоя жена
  rationale: Прямое и естественное соответствие еврейскому утверждению; усиление выражено предшествующим «так ведь».
- source_word: וְאֵיךְ אָמַרְתָ
  choice: как же ты сказал
  rationale: «Как же» передаёт связующую частицу, вопрос и укоризненное недоумение, не добавляя отсутствующей в тексте модальности «мог».
- source_word: אֲחֹתִי הִוא
  choice: она моя сестра
  rationale: Сохраняется обычное значение אחות — «сестра»; контекст не требует расширительного перевода.
- source_word: כִּי אָמַרְתִּי
  choice: потому что я сказал себе
  rationale: כִּי вводит причину, а внутреннее высказывание Исаака по-русски естественно передать выражением «сказал себе». Это сохраняет образ речи, не сводя его просто к мысли.
- source_word: פֶּן אָמוּת
  choice: как бы мне не умереть
  rationale: После פֶּן глагол выражает опасение возможного исхода. Русская конструкция «как бы ... не» точно и естественно передаёт этот оттенок.
- source_word: עָלֶיהָ
  choice: из-за неё
  rationale: В данном контексте предлог указывает на причину или повод предполагаемой смерти Исаака; «из-за неё» сохраняет краткость и некоторую недосказанность оригинала.
theological_decisions:
- issue: Характер слов Исаака об опасности
  choice: Сохранить его собственное краткое объяснение без добавления нравственной оценки.
  alternative: Назвать его поступок ложью или оправданием.
  rationale: Стих сообщает мотив Исаака, но сам по себе не формулирует богословской или нравственной оценки его слов.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Реплики звучат естественно, но сохраняют эмфатичность, укор и краткость еврейского текста; архаизмы устранены.
