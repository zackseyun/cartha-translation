base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: ru
  text: Исаак снова выкопал[a] колодцы, вырытые при жизни его отца Авраама и засыпанные филистимлянами после смерти Авраама, и дал им те же названия, которые дал им его отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Исаак вернулся и выкопал». Здесь еврейский глагол «вернуться» в сочетании со следующим глаголом, вероятно, указывает на повторное, возобновлённое действие: «снова выкопал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב יִצְחָק וַיַּחְפֹּר
  choice: Исаак снова раскопал[a]
  rationale: Сочетание שׁוב с последующим глаголом обозначает возобновление действия. «Снова раскопал» естественно передаёт как повторность, так и восстановление ранее вырытых, но затем засыпанных колодцев; более формальный синтаксический вариант сохранён в сноске.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: колодцы
  rationale: В данном контексте русское «колодцы» само по себе ясно обозначает источники воды; буквальное «колодцы воды» неестественно для современного русского языка.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: вырытые при жизни его отца Авраама
  rationale: Неопределённый субъект множественного глагола естественно передан причастной пассивной конструкцией. «При жизни» точно выражает временной смысл בִּימֵי в этом контексте.
- source_word: וַיְסַתְּמוּם
  choice: засыпанные
  rationale: Глагол סתם означает «закрывать, закупоривать, заваливать». Для колодцев современное русское «засыпать» передаёт действие ясно и без стилистической тяжеловесности.
- source_word: פְּלִשְׁתִּים
  choice: филистимлянами
  rationale: Устоявшееся русское название этого народа.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: после смерти Авраама
  rationale: Прямой и естественный перевод временного оборота.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּׁמֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: и дал им те же названия, которые дал им его отец
  rationale: Конструкция выражает присвоение названий, соответствующих прежним названиям Авраама. «Те же названия» недвусмысленно передаёт это тождество; «названия» для колодцев по-русски естественнее, чем «имена».
