  source_fidelity: 'Основной смысл передан точно: повторное раскапывание ранее вырытых и затем засыпанных колодцев, действие филистимлян после смерти Авраама и восстановление прежних названий сохранены. Однако «раскопал» не вполне точно передаёт חפר применительно к колодцам: оно может вызвать представление о раскопках, а не о повторном выкапывании/прочистке засыпанных колодцев. «Снова выкопал» точнее отражает глагол и контекст.'
