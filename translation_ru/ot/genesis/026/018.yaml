  terminology: «Колодцы», «филистимляне» и «названия» употреблены уместно. «Названия» для колодцев естественнее, чем «имена». Сноска должна соответствовать исправленному основному тексту и не утверждать чрезмерно категорично спорное идиоматическое объяснение.
