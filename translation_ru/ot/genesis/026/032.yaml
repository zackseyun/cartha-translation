base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: ru
  text: 'И в тот день пришли слуги Исаака и рассказали ему о колодце, который выкопали, и сказали ему: «Мы нашли воду».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И
  rationale: В еврейском повествовании эта формула продолжает последовательность событий; в современном русском буквальное «и случилось» здесь тяжеловесно, поэтому связность естественно передана союзом «и».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Сохраняет указание на конкретный день, связанный с предшествующими событиями.
- source_word: עַבְדֵי יִצְחָק
  choice: слуги Исаака
  rationale: עבד может обозначать раба или слугу; здесь речь о людях из дома Исаака, занятых работой, а их социально-правовое положение не акцентировано.
- source_word: וַיַּגִּדוּ לוֹ
  choice: рассказали ему
  rationale: Hифиль глагола נגד означает сообщить или доложить; «рассказали ему» ясно и естественно в данном контексте.
- source_word: עַל אֹדוֹת הַבְּאֵר
  choice: о колодце
  rationale: Прямое и естественное соответствие выражению «относительно колодца».
- source_word: אֲשֶׁר חָפָרוּ
  choice: который выкопали
  rationale: Субъект в еврейском тексте не назван отдельно, но по контексту это слуги Исаака; русский допускает неопределённо-личную форму без внесения лишней конкретизации.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: и сказали ему
  rationale: Сохранён отдельный ввод прямой речи, явно присутствующий в еврейском тексте.
- source_word: מָצָאנוּ מָיִם
  choice: Мы нашли воду
  rationale: Прямо передаёт сообщение об успешном обнаружении воды; количество воды в оригинале не уточняется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование изложено ясно и сдержанно, без архаизма «и было». Повтор «ему» сохранён, поскольку он соответствует явной структуре еврейского текста и не затрудняет чтение.
