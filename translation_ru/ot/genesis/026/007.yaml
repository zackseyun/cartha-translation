base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: ru
  text: 'Когда люди того места спросили его о жене, он сказал: «Она моя сестра», потому что боялся сказать: «Она моя жена», — как бы люди того места не убили меня из-за Ревекки, ведь она была хороша собой.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: спрашивали
  rationale: Форма обозначает расспросы жителей; несовершенный вид естественно передаёт ситуацию, в которой Исаак давал такой ответ.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: жители того места
  rationale: Буквально «мужчины того места», но в контексте выражение естественно обозначает местных жителей; дальнейшее опасение Исаака сохраняет связь с той же группой.
- source_word: לְאִשְׁתּוֹ
  choice: о жене
  rationale: Предлог при глаголе שׁאל указывает на предмет расспросов.
- source_word: אֲחֹתִי הִוא
  choice: Она моя сестра
  rationale: Естественный русский порядок слов сохраняет прямую речь и идентификацию.
- source_word: כִּי יָרֵא לֵאמֹר
  choice: потому что боялся сказать
  rationale: כִּי вводит причину, а инфинитив после ירא — содержание того, что Исаак боялся произнести.
- source_word: פֶּן
  choice: опасаясь, как бы … не
  rationale: Русская конструкция точно передаёт опасение возможного нежелательного исхода, не превращая его в утверждение или цель.
- source_word: יַהַרְגֻנִי
  choice: не убили его
  rationale: В основном тексте лицо согласовано с повествованием для естественности; исходное первое лицо «меня» отмечено в сноске.
- source_word: עַל רִבְקָה
  choice: из-за Ревекки
  rationale: עַל здесь обозначает причину или повод.
- source_word: טוֹבַת מַרְאֶה
  choice: была красива
  rationale: Идиоматично и точно передаёт характеристику привлекательной внешности без ненужной тяжеловесности.
