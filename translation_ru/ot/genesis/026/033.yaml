  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: ru
  text: И он назвал его Шива́[a]. Поэтому имя этого города — Беэ́р-Ше́ва доныне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Шива́» созвучно еврейскому слову «семь» и связано с игрой слов в названии «Беэ́р-Ше́ва», которое можно понять как «колодец семи» или «колодец клятвы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: назвал
  rationale: В формуле наречения קרא с прямым дополнением естественно передаётся русским «назвал».
- source_word: אֹתָהּ
  choice: его
  rationale: Местоимение женского рода в еврейском относится к ранее упомянутому колодцу; в русском «колодец» мужского рода.
- source_word: שִׁבְעָה
  choice: Шива́
  rationale: Слово выступает как имя колодца, поэтому передано транслитерацией; созвучие со словами «семь» и «клятва» поясняется в сноске.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь.
- source_word: שֵׁם הָעִיר
  choice: имя этого города
  rationale: Указательное «этого» естественно в русском повествовании и соотносит название с городом, о котором идёт речь.
- source_word: בְּאֵר שֶׁבַע
  choice: Беэ́р-Ше́ва
  rationale: Собственное географическое название передано принятой библейской транслитерацией; его смысловая игра сохранена в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: доныне
  rationale: Ёмкий и литературный русский эквивалент устойчивого древнееврейского выражения.
