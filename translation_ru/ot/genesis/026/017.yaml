  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: ru
  text: Исаак ушёл оттуда, расположился станом в долине Герара[a] и поселился там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вади Герара». Еврейское слово может обозначать русло сезонного водотока, овраг или долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: ушёл оттуда
  rationale: Сочетание глагола движения с מִשָּׁם обозначает уход из прежнего места; «ушёл оттуда» естественно передаёт и движение, и исходную точку.
- source_word: וַיִּחַן
  choice: расположился станом
  rationale: Глагол חנה означает остановиться и разбить лагерь. Выражение «расположился станом» сохраняет кочевой контекст и звучит достойно в современном повествовании.
- source_word: בְּנַחַל גְּרָר
  choice: в долине Герара
  rationale: נַחַל может обозначать долину, русло сезонного потока или овраг. «Долина Герара» понятна широкому читателю, а более точный географический диапазон отражён в сноске.
- source_word: וַיֵּשֶׁב שָׁם
  choice: и поселился там
  rationale: ישב в данном контексте означает жить или обосноваться. После остановки станом «поселился» передаёт переход к пребыванию в этом месте, не устраняя возможного общего значения «жил».
