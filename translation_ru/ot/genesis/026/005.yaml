  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: ru
  text: потому что Авраам слушался Моего голоса[a] и соблюдал Моё требование, Мои заповеди, Мои установления и Мои законы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушал Мой голос»; в еврейском это выражение обычно подразумевает послушание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Мои наставления». Еврейское слово тора может означать закон, наставление или учение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: потому что
  rationale: В данном контексте слово вводит основание обещанного благословения; причинный союз естественно передаёт эту связь.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: слушался Моего голоса
  rationale: Передаёт и образ слышания, и заключённый в еврейской идиоме смысл послушания.
- source_word: וַיִּשְׁמֹר
  choice: соблюдал
  rationale: В сочетании с обязанностями и правовыми установлениями глагол означает хранить и исполнять их.
- source_word: מִשְׁמַרְתִּי
  choice: всё, что Я поручил ему хранить
  rationale: Так передаётся смысл вверенной обязанности, которую надлежит хранить, и термин не смешивается с последующими заповедями и установлениями.
- source_word: מִצְוֺתַי
  choice: Мои заповеди
  rationale: Обычный и ясный эквивалент для конкретных повелений в заветно-правовом контексте.
- source_word: חֻקּוֹתַי
  choice: Мои установления
  rationale: Сохраняет отдельный правовой термин и звучит понятнее современному читателю, чем более архаичное «уставы».
- source_word: וְתוֹרֹתָי
  choice: и Мои законы
  rationale: Во множественном числе и в ряду правовых терминов слово имеет выраженный нормативный смысл; примечание сохраняет более широкое значение «наставления».
theological_decisions:
- issue: Ряд заветно-правовых терминов до дарования Закона на Синае
  choice: 'Сохранить все отдельные элементы ряда: вверенное поручение, заповеди, установления и законы.'
  alternative: Свести ряд к общему выражению вроде «все Мои повеления» или заменить «законы» на «наставления».
  rationale: Нагромождение близких по смыслу терминов подчёркивает полноту послушания Авраама. Перевод не устраняет напряжение, связанное с употреблением такой лексики до Синая, и не навязывает ему конфессионального объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор притяжательного местоимения сохраняет риторическую полноту исходного перечня; прописная буква в местоимениях, относящихся к Богу, соответствует принятой русской издательской традиции.
