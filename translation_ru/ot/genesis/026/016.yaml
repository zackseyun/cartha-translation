  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל יִצְחָ֑ק לֵ֚ךְ מֵֽ/עִמָּ֔/נוּ כִּֽי עָצַֽמְתָּ מִמֶּ֖/נּוּ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: ru
  text: 'Тогда Авимелех сказал Исааку: «Уйди от нас, потому что ты стал гораздо сильнее нас».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты стал намного могущественнее нас».'
    reason: Слово עָצַם может обозначать не только физическую или общую силу, но и могущество, многочисленность и влияние.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вайиктоль продвигает повествование; «тогда» естественно передаёт последовательность событий в современном русском языке.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Традиционная русская библейская передача личного имени.
- source_word: אֶל יִצְחָק
  choice: Исааку
  rationale: Русский дательный падеж естественно обозначает адресата речи; имя передано в традиционной русской форме.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Уйди от нас
  rationale: Императив «иди» вместе с выражением удаления «от нас» по-русски естественно передаётся глаголом «уйди».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину приказа; «потому что» ясно и современно, без искусственного повышения регистра.
- source_word: עָצַמְתָּ
  choice: ты стал ... сильнее
  rationale: Глагол выражает приобретение силы или могущества; сравнительная конструкция в контексте естественно передаётся как «стал сильнее».
- source_word: מִמֶּנּוּ
  choice: нас
  rationale: 'Предлог מן употреблён сравнительно: «сильнее нас».'
- source_word: מְאֹד
  choice: гораздо
  rationale: Наречие усиливает сравнительную степень; «гораздо сильнее» — естественная русская конструкция.
