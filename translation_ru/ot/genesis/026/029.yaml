  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם תַּעֲשֵׂ֨ה עִמָּ֜/נוּ רָעָ֗ה כַּ/אֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּ/ךָ וְ/כַ/אֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּ/ךָ֙ רַק ט֔וֹב וַ/נְּשַׁלֵּֽחֲ/ךָ֖ בְּ/שָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: ru
  text: что ты не причинишь нам зла[a], как и мы не тронули тебя[b], а делали тебе только добро и отпустили тебя с миром[c]. Теперь ты благословлён Яхве».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «если ты причинишь нам зло». Здесь אִם, вероятно, вводит содержание требуемой клятвы.'
    reason: lexical_alternative
  - marker: b
    text: В этом контексте «не тронули» может означать «не причинили вреда».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отослали тебя с миром».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: что ты не
  rationale: В продолжение просьбы о клятве из предыдущего стиха אִם вводит её содержание и в клятвенной формуле передаёт отрицательный смысл. Такой перевод естественен по-русски, а буквальная условная форма сохранена в сноске.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: причинишь нам зла
  rationale: Сочетание עשה с רעה обозначает причинение зла или вреда; «причинишь нам зла» сохраняет нравственный оттенок רָעָה и подходит контексту договора о ненападении.
- source_word: נְגַעֲנוּךָ
  choice: мы не тронули тебя
  rationale: Основное значение נגע — «касаться, трогать»; в данном контексте глагол может подразумевать причинение вреда. Конкретный образ сохранён в тексте, а подразумеваемый смысл отмечен в сноске.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: делали тебе только добро
  rationale: Перевод сохраняет усилительное רַק («только») и прямое противопоставление злу в первой части стиха.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: и отпустили тебя с миром
  rationale: «Отпустили» естественно передаёт שילח в ситуации удаления Исаака, а устойчивое «с миром» сохраняет как идею безопасного ухода, так и мирных отношений.
- source_word: אַתָּה עַתָּה בְּרוּךְ יְהוָה
  choice: Теперь ты благословлён Яхве
  rationale: Краткая пассивная форма передаёт בְּרוּךְ, а имя Яхве прямо воспроизводит тетраграмматон. Порядок слов сделан естественным для современного русского языка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл אִם в формуле клятвы
  choice: 'отрицательное содержание обязательства: «что ты не причинишь»'
  alternative: 'условное: «если ты причинишь»'
  rationale: Контекст предыдущего стиха — просьба заключить договор и принести клятву. Отрицательное прочтение выражает требуемое обязательство, однако буквальная условная конструкция остаётся возможной и указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис продолжает фразу предыдущего стиха; сохранены риторическое противопоставление зла и добра и формула «с миром».
