lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: У него были
  rationale: Еврейская конструкция היה + ל выражает обладание; по-русски естественно передаётся конструкцией «у него были».
- source_word: מִקְנֵה צֹאן וּמִקְנֵה בָקָר
  choice: стада мелкого и крупного скота
  rationale: צֹאן обозначает мелкий скот, прежде всего овец и коз, а בָקָר — крупный рогатый скот; собирательное «стада» естественно передаёт значительные поголовья.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: множество работников
  rationale: В данном перечне хозяйственных богатств выражение, вероятнее всего, указывает на многочисленную рабочую силу или прислугу. Сноска сохраняет более буквальное и неоднозначное значение существительного עֲבֻדָּה.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: стали завидовать ему
  rationale: В контексте благосостояния Исаака קנא обозначает зависть; «стали завидовать» естественно вписывается в русское повествование.
- source_word: פְּלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское название народа.
