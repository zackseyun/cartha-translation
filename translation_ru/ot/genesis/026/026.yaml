lexical_decisions:
- source_word: וַאֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Имя передано в принятой русской библейской форме; повествовательный waw естественно выражается последовательностью событий без обязательного отдельного союза.
- source_word: הָלַךְ אֵלָיו
  choice: пришёл к нему
  rationale: Глагол הלך буквально обозначает движение, а в сочетании «к нему» современное русское «пришёл» естественно передаёт прибытие к Исааку, не заменяя местоимение именем.
- source_word: מִגְּרָר
  choice: из Герара
  rationale: Предлог מן передан как «из», название места — в традиционной русской форме.
- source_word: וַאֲחֻזַּת מֵרֵעֵהוּ
  choice: вместе с Ахуззафом, своим приближённым
  rationale: מֵרֵעֵהוּ может обозначать друга, спутника или близкого придворного соратника. «Приближённый» сохраняет придворный оттенок контекста, не утверждая конкретной должности советника; варианты отмечены в сноске.
- source_word: וּפִיכֹל שַׂר צְבָאוֹ
  choice: и Фихолом, военачальником своего войска
  rationale: שַׂר в военном сочетании означает начальника или командующего, а צָבָא — войско; «военачальник своего войска» ясно и достойно звучит по-русски.
