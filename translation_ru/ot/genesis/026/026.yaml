  source_fidelity: 'Глагол הָלַךְ точнее передать как «отправился», а не «пришёл»: русский вариант с «пришёл» возможен с точки зрения пункта прибытия, но ослабляет исходное значение движения от Герара к Исааку. Притяжательный суффикс в שַׂר־צְבָאוֹ относится к Авимелеху; «своего войска» по-русски может быть ошибочно соотнесено с Фихолом.'
  naturalness: Исправленный текст сохраняет современный литературный, ясный синтаксис. «Его войска» однозначно указывает на войско Авимелеха.
  terminology: «Друг» — наиболее прямое и нейтральное соответствие מֵרֵעֵהוּ. Возможный оттенок спутника либо придворного соратника следует оставить в сноске, а не закреплять в основном тексте как должность или статус «приближённого». Имена «Авимелех», «Ахуззаф» и «Фихол» допустимы в традиционной русской библейской передаче.
