  - severity: medium
    issue: «Своего войска» двусмысленно
    rationale: Возвратное притяжательное местоимение после приложения «Фихолом» может быть понято как относящееся к Фихолу. Еврейский суффикс обозначает войско Авимелеха; «его войска» это проясняет.
  - severity: low
    issue: «Своим приближённым» чрезмерно конкретизирует מֵרֵעֵהוּ
    rationale: Слово обозначает друга, товарища или спутника; придворный оттенок возможен, но не обязателен. Нейтральное «его другом» лучше сохраняет лексическую широту.
