base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: ru
  text: Живи в этой земле[a], и Я буду с тобой и благословлю тебя, потому что тебе и твоему потомству[b] Я дам все эти земли и подтвержу[c] клятву, которую Я дал Аврааму, твоему отцу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Живи как пришелец в этой земле». Еврейский глагол может обозначать проживание в качестве временного жителя или чужеземца.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семени». Здесь это слово имеет собирательное значение: «потомство».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «утвержу» либо «исполню» клятву.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: Поселись
  rationale: Глагол обозначает проживание в качестве пришельца или временного жителя. «Поселись» естественно по-русски передаёт повеление оставаться и жить в этой земле; оттенок временного пребывания сохранён в примечании.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: в этой земле
  rationale: В контексте обетования אֶרֶץ обозначает конкретную землю; выбор также сохраняет связь с последующим множественным выражением «все эти земли».
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: и Я буду с тобой
  rationale: Прямо передаёт формулу Божьего присутствия, не добавляя отсутствующей в тексте терминологии.
- source_word: וַאֲבָרְכֶךָ
  choice: и благословлю тебя
  rationale: Продолжает последовательность Божьих обещаний; повторение местоимения в русском не требуется.
- source_word: כִּי
  choice: потому что
  rationale: Передаёт пояснительно-причинную связь между повелением и следующим за ним обетованием.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: тебе и твоему потомству
  rationale: זֶרַע — собирательное существительное «семя, потомство». «Потомство» естественно передаёт собирательный смысл, а буквальный вариант указан в примечании.
- source_word: אֶתֵּן
  choice: Я дам
  rationale: Прямое будущее обещание.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: все эти земли
  rationale: Сохраняет множественное число и лексическую связь с «этой землёй» в начале стиха.
- source_word: וַהֲקִמֹתִי
  choice: и утвержу
  rationale: Каузативная форма קום применительно к клятве может означать «утвердить, подтвердить, исполнить». «Утвержу» сохраняет торжественный характер и не сводит значение только к исполнению.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: клятву, которой Я поклялся
  rationale: Сохраняет однокоренное сочетание существительного и глагола в еврейском тексте и его торжественно-юридический оттенок.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: Аврааму, отцу твоему
  rationale: Точно обозначает Авраама как отца Исаака; постпозиция «отцу твоему» поддерживает достоинство библейского регистра без архаизации всего стиха.
theological_decisions:
- issue: Передача формулы о клятве без чрезмерного богословского уточнения
  choice: утвержу клятву, которой Я поклялся
  alternative: подтвержу клятву; исполню клятву
  rationale: Еврейское וַהֲקִמֹתִי допускает оттенки утверждения, подтверждения и осуществления. Основной текст сохраняет широкую формулировку, а варианты отмечены в сноске, без внесения технического понятия обновления завета.
- issue: Собирательное значение זֶרַע
  choice: потомству
  alternative: семени; потомкам
  rationale: В непосредственном контексте речь прежде всего о линии потомков Исаака. «Потомство» сохраняет собирательность и не исключает более широких канонических смыслов, тогда как буквальное «семя» дано в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; форма «отцу твоему» намеренно сохраняет торжественность, не перегружая текст архаизмами.
