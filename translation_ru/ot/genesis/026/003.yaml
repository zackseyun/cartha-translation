    issue: «Поселись» для גּוּר
    rationale: Русское «поселиться» нередко подразумевает оседлое или постоянное устройство, тогда как גּוּר означает жить/пребывать как пришелец. «Живи» не навязывает постоянного характера проживания; специфический оттенок остаётся в сноске.
  - severity: medium
    issue: «Клятву, которой Я поклялся Аврааму»
    rationale: Конструкция формально возможна, но в современном русском воспринимается неестественно и размывает, что объектом клятвы был Авраам. «Клятву, которую Я дал Аврааму» точно и идиоматично передаёт смысл.
  - severity: low
    issue: «Утвержу клятву»
    rationale: Сочетание возможно, но менее естественно, чем «подтвержу клятву»; последнее передаёт значение установления/подтверждения ранее принесённой клятвы без богословского расширения.
