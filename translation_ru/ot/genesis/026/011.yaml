  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: ru
  text: 'И Авимелех приказал всему народу: «Кто прикоснётся к этому человеку или к его жене, тот непременно будет предан смерти».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: приказал
  rationale: Пиэль глагола צוה выражает властное повеление; «приказал» естественно и точно передаёт его силу.
- source_word: כָּל הָעָם
  choice: всему народу
  rationale: עם здесь обозначает всех людей, находящихся под властью Авимелеха, а не обязательно народ как этническую общность.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском языке содержание повеления естественно вводится двоеточием; отдельное «сказав» было бы избыточно.
- source_word: הַנֹּגֵעַ
  choice: кто прикоснётся
  rationale: 'Субстантивированное причастие с артиклем имеет обобщающее значение: «тот, кто прикоснётся». Глагол נגע сохранён без усилительного толкования вроде «поднимет руку».'
- source_word: בָּאִישׁ הַזֶּה
  choice: к этому человеку
  rationale: Предлог ב при נגע обозначает объект прикосновения; русское управление требует «прикоснуться к».
- source_word: וּבְאִשְׁתּוֹ
  choice: или к его жене
  rationale: В контексте אשה с притяжательным суффиксом означает «его жена»; союз передаёт второй возможный объект запрета.
- source_word: מוֹת יוּמָת
  choice: непременно будет предан смерти
  rationale: Сочетание абсолютного инфинитива с хофалом усиливает категоричность наказания, а пассивная формулировка указывает на приведение смертного приговора в исполнение.
