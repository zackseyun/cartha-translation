  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: ru
  text: Они встали рано утром и поклялись друг другу. Затем Исаак отпустил их, и они ушли от него с миром.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: встали рано утром
  rationale: Глагол שׁכם в этой форме означает ранний подъём; сочетание с בַבֹּקֶר естественно передаётся по-русски как «встали рано утром».
- source_word: וַיִּשָּׁבְעוּ
  choice: поклялись
  rationale: Нифаль от שׁבע означает «поклясться, дать клятву». Русское «поклялись» ясно передаёт взаимное принесение клятвы без избыточного сочетания «поклялись клятвой».
- source_word: אִישׁ לְאָחִיו
  choice: друг другу
  rationale: Буквально «каждый своему брату»; в данном контексте это еврейский взаимный оборот. «Друг другу» естественно и точно обозначает взаимность клятвы, не создавая ложного впечатления о кровном родстве.
- source_word: וַיְשַׁלְּחֵם
  choice: отпустил их
  rationale: Piel от שׁלח с объектным суффиксом здесь означает позволить гостям уйти, проводить или отослать их; «отпустил их» естественно для сцены завершения соглашения.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: они ушли от него
  rationale: Сочетание הלך с מֵאֵת обозначает удаление от человека; «ушли от него» точно и естественно передаёт движение.
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: שָׁלוֹם здесь охватывает мирные отношения и благополучный уход; устойчивое русское выражение «с миром» сохраняет оба оттенка.
