lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: они выкопали
  rationale: Форма Qal от חפר обозначает обычное действие копания; «выкопали» естественно передаёт завершённое действие в последовательности повествования.
- source_word: בְּאֵר אַחֶרֶת
  choice: другой колодец
  rationale: בְּאֵר означает «колодец», а אַחֶרֶת — «другой, ещё один»; выбранный вариант ясно отличает его от предыдущего колодца.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: но и из-за него стали спорить
  rationale: ריב передаёт спор или распрю, עַל указывает на предмет спора, а גַּם сохранено сочетанием «и ... тоже» по смыслу. «Но» естественно выражает контраст с новой попыткой найти колодец, не меняя сути связи.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: он назвал его
  rationale: Буквальная формула «назвал его имя» неестественна по-русски; «назвал его» точно и ясно передаёт формулу наречения имени.
- source_word: שִׂטְנָה
  choice: Ситна
  rationale: Название колодца передано транслитерацией; его смысловая связь с враждой и противодействием пояснена в сноске.
