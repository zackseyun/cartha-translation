base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: ru
  text: В стране был голод — помимо первого голода, который был во дни Авраама. Исаак пошёл к Авимелеху, царю филистимлян, в Герар.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Авимелеху, царю филистимлян, находившемуся в Гераре». Еврейская форма названия «Герар» имеет направительное окончание и может указывать на движение в Герар; однако её также можно понимать как обозначение места, где находился Авимелех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: В той земле настал голод
  rationale: Нарративная форма וַיְהִי вводит новое обстоятельство; «настал голод» естественно передаёт возникновение ситуации. «В той земле» указывает на местную область, а не на всю землю.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: помимо первого голода
  rationale: «Помимо» сохраняет сопоставление с прежним голодом, а «первого» прямо передаёт порядковое רִאשׁוֹן.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: который был во дни Авраама
  rationale: Относительное придаточное отождествляет первый голод с событием времён Авраама; «во дни» сохраняет достоинство библейского повествования и остаётся понятным.
- source_word: וַיֵּלֶךְ יִצְחָק אֶל אֲבִימֶּלֶךְ
  choice: Исаак пошёл к Авимелеху
  rationale: Последовательная глагольная форма продвигает рассказ; русское «пошёл» естественно выражает движение к человеку.
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: царю филистимлян
  rationale: Прозрачно передаёт конструкцию принадлежности и традиционное этническое наименование.
- source_word: גְּרָרָה
  choice: в Герар
  rationale: Направительное окончание -ה явно допускает и поддерживает значение движения к Герару; по-русски «пошёл ... в Герар» естественно обозначает пункт назначения.
theological_decisions:
- issue: Историко-этническое обозначение פְּלִשְׁתִּים
  choice: филистимлян
  alternative: народа филистимлян
  rationale: Это обычное этнополитическое обозначение, не богословский титул; общепринятая русская форма точна и понятна.
- issue: Синтаксическая связь גְּרָרָה
  choice: в Герар — пункт назначения Исаака
  alternative: у Авимелеха, царя филистимлян, в Гераре
  rationale: Направительное -ה непосредственно маркирует движение к Герару. При этом фраза также подразумевает, что Авимелех находился или правил там; примечание сохраняет допустимый локативный способ выражения.
