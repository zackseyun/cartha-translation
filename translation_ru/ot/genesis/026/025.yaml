  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: ru
  text: Исаак построил там жертвенник, призвал имя Яхве[a] и разбил там свой шатёр. Там слуги Исаака выкопали колодец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провозгласил имя Яхве». Еврейское выражение может означать как молитвенное призывание, так и провозглашение имени; упоминание жертвенника здесь скорее указывает на призывание.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Там Исаак построил жертвенник
  rationale: Глагол בנה в повествовательном контексте естественно передаётся как «построил», а מִזְבֵּחַ — как «жертвенник». Имя Исаака, подразумеваемое формой 3-го лица, названо для ясности в начале русского предложения.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: призвал имя Яхве
  rationale: Сохранена традиционная и понятная русская формула, передающая молитвенное обращение или поклонение. Возможный смысл «провозгласил имя» отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: Там он раскинул свой шатёр
  rationale: При существительном «шатёр» глагол נטה означает «раскинуть, поставить». «Раскинул шатёр» — естественное современное русское сочетание, сохраняющее образ исходного текста.
- source_word: עַבְדֵי יִצְחָק
  choice: его слуги
  rationale: עבד может обозначать раба или слугу; здесь речь идёт о работниках хозяйства Исаака, поэтому контекстуально уместно «слуги». Местоимение однозначно отсылает к названному в предыдущем предложении Исааку.
- source_word: וַיִּכְרוּ ... בְּאֵר
  choice: выкопали колодец
  rationale: Обычное и точное русское обозначение действия по устройству колодца.
- source_word: שָׁם
  choice: там
  rationale: Два употребления «там» сохранены, чтобы передать акцент исходного текста на месте событий; третье естественно охватывает однородные действия в пределах одного предложения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога. Транслитерация сохраняет различие между личным именем и титулом.
- issue: Смысл выражения קרא בשם יהוה
  choice: призвал имя Яхве
  alternative: провозгласил имя Яхве
  rationale: В связи с сооружением жертвенника наиболее вероятно молитвенное призывание имени Яхве, однако еврейское выражение допускает и оттенок публичного провозглашения; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис упрощён для ясности, но последовательность действий и повторный акцент на месте сохранены.
