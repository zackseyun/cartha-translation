base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: ru
  text: Когда Исаву было сорок лет, он взял себе в жёны[a] Иудифь, дочь Беэри, хеттеянина, и Басемат, дочь Элона, хеттеянина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взял жену: Иудифь… и Басемат…». В еврейском тексте слово «жена» стоит в единственном числе, хотя далее названы две женщины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עֵשָׂו בֶּן אַרְבָּעִים שָׁנָה
  choice: Когда Исаву было сорок лет
  rationale: Естественная русская передача повествовательного перехода и обычного древнееврейского обозначения возраста; буквальное «Исав был сыном сорока лет» по-русски неестественно.
- source_word: וַיִּקַּח אִשָּׁה
  choice: он взял себе в жёны
  rationale: Оборот обозначает вступление в брак. Множественное «в жёны» согласуется с двумя названными далее женщинами, тогда как формальное единственное число исходного текста отмечено в сноске.
- source_word: יְהוּדִית
  choice: Иудифь
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: בְּאֵרִי
  choice: Беэри
  rationale: Передача еврейского имени с сохранением его звукового состава.
- source_word: הַחִתִּי
  choice: хеттеянина
  rationale: Этноним с определённым артиклем относится соответственно к Беэри и Элону; русская форма в родительном падеже естественно оформляет приложение.
- source_word: בָּשְׂמַת
  choice: Басемат
  rationale: Прямая современная транслитерация еврейского личного имени.
- source_word: אֵילֹן
  choice: Элона
  rationale: Русская передача личного имени אֵילֹן в требуемом родительном падеже.
