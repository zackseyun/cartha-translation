base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: ru
  text: 'Тогда Яхве явился ему и сказал: «Не спускайся в Египет. Живи в той земле, о которой Я скажу тебе».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה здесь обозначает явление Бога; «явился» естественно передаёт смысл, не уточняя способ явления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом.
- source_word: אַל תֵּרֵד מִצְרָיְמָה
  choice: Не ходи в Египет
  rationale: Сочетание אַל с имперфектом выражает запрет. Буквальное направление «не спускайся» отмечено в сноске, тогда как в основном тексте использовано естественное русское обозначение пути.
- source_word: שְׁכֹן
  choice: Живи
  rationale: Императив от שכן означает проживать, обитать. «Живи» понятно современному читателю и не предполагает непременно окончательного поселения.
- source_word: בָּאָרֶץ
  choice: в земле
  rationale: אֶרֶץ обозначает здесь конкретную землю или область, где Исааку надлежит жить.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: которую Я укажу тебе
  rationale: Буквально выражение связано с речью — «о которой Я скажу тебе»; в контексте речь означает последующее Божье указание места. Более буквальная форма сохранена в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Характер Божьего указания земли
  choice: которую Я укажу тебе
  alternative: о которой Я скажу тебе
  rationale: Основной текст передаёт прагматический смысл будущей речи как руководящего указания, не добавляя сведений о конкретном способе откровения; буквальная синтаксическая возможность дана в сноске.
translation_notes:
  register: Современный литературный русский с ясным, достойным звучанием. «Живи» выбрано вместо более архаичного «обитай»; прямая речь оформлена по нормам русской пунктуации.
