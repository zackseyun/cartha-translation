  verdict: revise
  source_fidelity: «Яхве явился ему» точно передаёт וַיֵּרָא ... יְהוָה. Запрет «Не ходи в Египет» передаёт запрет и направление, но утрачивает выраженную глаголом ירד пространственную характеристику движения «вниз»; её можно без ущерба естественности сохранить в основном тексте. «Которую Я укажу тебе» передаёт контекстуальный смысл, однако глагол אמר означает «сказать», а не специально «указать»; более близкое и естественное соответствие возможно без примечания.
