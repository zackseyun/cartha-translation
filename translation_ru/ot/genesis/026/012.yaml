base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: ru
  text: Исаак посеял в той земле и в тот год получил стократный урожай[a], и Яхве благословил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получил сто мер». Буквально по-еврейски: «нашёл сто шеарим»; это редкое выражение указывает на исключительно обильный урожай, но точный смысл слова здесь не вполне ясен.'
    reason: Лексическая неоднозначность выражения מֵאָה שְׁעָרִים и идиоматическое употребление глагола מצא.
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: посеял
  rationale: Глагол זרע в земледельческом контексте означает посев семян; «посеял» прямо и естественно передаёт этот образ.
- source_word: בָּאָרֶץ הַהִוא
  choice: в той земле
  rationale: אֶרֶץ здесь обозначает землю, где находился Исаак; «в той земле» сохраняет указательное значение и не придаёт выражению лишнего политического оттенка.
- source_word: וַיִּמְצָא
  choice: получил урожай
  rationale: Основное значение מצא — «найти», но здесь глагол употреблён в контексте результата посева. «Получил урожай» естественно передаёт смысл, а буквальная форма отражена в сноске.
- source_word: בַּשָּׁנָה הַהִוא
  choice: в тот же год
  rationale: Такой перевод естественно связывает посев и урожай и передаёт указательное выражение «в тот год» без изменения смысла.
- source_word: מֵאָה שְׁעָרִים
  choice: во сто крат
  rationale: Редкое выражение описывает чрезвычайно обильную отдачу от посева. «Во сто крат» передаёт традиционно понимаемый смысл, не вводя конкретную древнюю единицу меры; неоднозначность отмечена в сноске.
- source_word: וַיְבָרֲכֵהוּ
  choice: благословил его
  rationale: ברך — обычный глагол со значением «благословлять»; перевод сохраняет прямое богословское утверждение текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано принятой русской транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер земледельческого результата Исаака
  choice: получил урожай во сто крат
  alternative: нашёл сто мер; собрал стократный урожай
  rationale: Основной текст ясно передаёт исключительную урожайность, при этом сноска сохраняет буквальную форму и лексическую неопределённость редкого выражения.
translation_notes:
  register: Современный литературный русский язык с простым, повествовательным синтаксисом. Сохранена цепочка предложений с союзом «и», характерная для еврейского повествования; редкое выражение о размере урожая передано понятно, а его подлинная неопределённость вынесена в сноску.
