  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: ru
  text: Я умножу твоё потомство, как звёзды небесные, и дам твоему потомству все эти земли; и в твоём потомстве будут благословлены все народы земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все народы земли будут благословлять себя твоим потомством». Еврейскую глагольную форму можно понять возвратно, хотя пассивное значение хорошо соответствует контексту заветного обещания.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Я умножу
  rationale: Каузативная форма глагола רבה выражает увеличение числа, совершаемое Богом; «умножу» естественно звучит в контексте заветного обещания.
- source_word: זַרְעֲךָ
  choice: твоё потомство
  rationale: זֶרַע — собирательное существительное, способное обозначать потомство как единое целое. Русское «потомство» сохраняет эту особенность лучше, чем множественное «потомки», и не имеет архаичности слова «семя» в данном значении.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: как звёзды небесные
  rationale: Передаёт явное сравнение и сохраняет возвышенный, но понятный современному читателю стиль; «небесные» естественно отражает הַשָּׁמַיִם.
- source_word: וְנָתַתִּי
  choice: и дам
  rationale: Прямо и естественно передаёт обычное значение נתן и характер Божьего обещания.
- source_word: לְזַרְעֲךָ
  choice: твоему потомству
  rationale: Последовательно передаёт повторяющееся זֶרַע тем же собирательным словом.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: все эти земли
  rationale: Во множественном числе אֲרָצוֹת здесь обозначает обещанные территории, а указательное הָאֵל — «эти».
- source_word: וְהִתְבָּרֲכוּ
  choice: будут благословлены
  rationale: Пассивное понимание хорошо соответствует контексту заветного обещания и ясно выражается по-русски; возможное возвратное понимание сохранено в сноске.
- source_word: בְזַרְעֲךָ
  choice: в твоём потомстве
  rationale: Сохраняет основное значение предлога בְּ и не устраняет возможное смысловое напряжение между сферой, основанием и посредничеством благословения.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: все народы земли
  rationale: «Народы» естественно передаёт этноколлективное значение גּוֹיִם, а «земли» — общечеловеческий охват формулы.
theological_decisions:
- issue: Значение формулы וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: в твоём потомстве будут благословлены все народы земли
  alternative: все народы земли будут благословлять себя твоим потомством
  rationale: Пассивное прочтение соответствует контексту патриархального обещания, однако еврейская глагольная форма допускает и возвратное понимание. Альтернатива вынесена в сноску, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Синтаксис сохраняет последовательность трёх обещаний и повтор слова «потомство». Точка с запятой помогает ясно отделить всемирное благословение от обещания земель.
