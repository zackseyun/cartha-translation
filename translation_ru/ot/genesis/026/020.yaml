base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: ru
  text: 'Тогда пастухи Герара стали спорить с пастухами Исаака, говоря: «Вода наша». И он назвал колодец Есек[a], потому что они спорили с ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Есек» связано с еврейским словом, означающим «спор», «распрю» или «тяжбу».
    reason: Передаёт игру слов между названием колодца עֵשֶׂק и однокоренным глаголом הִתְעַשְּׂקוּ, которую невозможно полностью сохранить в основном тексте.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: стали спорить
  rationale: Глагол ריב обозначает спор, распрю или тяжбу. «Стали спорить» естественно передаёт начавшийся конфликт из-за права на воду.
- source_word: רֹעֵי גְרָר
  choice: пастухи Герара
  rationale: רֹעִים — люди, пасущие мелкий или крупный скот; «пастухи» — прямое и понятное соответствие в патриархальном контексте.
- source_word: עִם רֹעֵי יִצְחָק
  choice: с пастухами Исаака
  rationale: Сохраняется параллелизм исходной фразы и ясно выражается принадлежность пастухов к дому Исаака.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: 'говоря: «Вода наша»'
  rationale: Краткая еврейская именная конструкция буквально означает «нам вода» и выражает притязание на неё; лаконичное «Вода наша» сохраняет напряжённость прямой речи.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: И он назвал колодец
  rationale: Еврейская идиома «назвал имя колодца» естественно передаётся по-русски как «назвал колодец».
- source_word: עֵשֶׂק
  choice: Есек
  rationale: Название колодца транслитерировано, а его смысл и связь с последующим глаголом поясняются в сноске.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: потому что они спорили с ним
  rationale: Возвратная форма от עשׂק здесь указывает на спор или тяжбу и созвучна названию עֵשֶׂק. Местоимение единственного числа естественно относится к Исааку.
