  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: ru
  text: 'И явился ему Яхве в ту ночь и сказал: «Я — Бог Авраама, отца твоего. Не бойся[a], потому что Я с тобой. Я благословлю тебя и умножу твоё потомство[b] ради Авраама, Моего слуги».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не страшись».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семя»; еврейское слово здесь имеет собирательное значение и обозначает потомство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога в принятой современной русской транслитерации, не заменяя его титулом.
- source_word: וַיֵּרָא אֵלָיו
  choice: явился ему
  rationale: Естественно передаёт нифаль глагола ראה в значении видимого явления или откровения.
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Сохраняет указательное значение и звучит естественно по-русски.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Я — Бог Авраама, отца твоего
  rationale: Сохраняет отнесение слова «отец» к Аврааму и близко следует еврейскому порядку слов; инверсия придаёт речи умеренно торжественное звучание.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Точная и естественная передача запрета; вариант «не страшись» более книжный.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: потому что Я с тобой
  rationale: כִּי вводит основание повеления не бояться; «потому что» ясно выражает причинную связь.
- source_word: וּבֵרַכְתִּיךָ
  choice: Я благословлю тебя
  rationale: В контексте обещания форма естественно передаётся русским будущим временем.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: и умножу твоё потомство
  rationale: Передаёт каузативное значение רבה и собирательный смысл זֶרַע без неестественной буквальности слова «семя».
- source_word: בַּעֲבוּר
  choice: ради
  rationale: Кратко и естественно выражает основание благословения ради Авраама, не уточняя сверх текста характер этой связи.
- source_word: עַבְדִּי
  choice: Моего слуги
  rationale: В данном контексте עֶבֶד обозначает состоящего на службе у Бога человека; «слуга» уместнее социально маркированного «раб».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Основание обещания в בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: ради Авраама, Моего слуги
  alternative: из-за Авраама, Моего слуги; благодаря Аврааму, Моему слуге
  rationale: «Ради» сохраняет причинно-бенефактивную широту выражения и связь обещания Исааку с Авраамом, не объясняя эту связь сверх сказанного.
- issue: Коллективное значение זֶרַע
  choice: потомство
  alternative: семя; потомки
  rationale: «Потомство» сохраняет собирательное значение единственного числа; «потомки» делает множественность явной, а «семя» в современном русском может восприниматься неестественно.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Инверсия «Авраама, отца твоего» сохраняет структуру исходного текста; остальные конструкции сделаны естественными для современного читателя. Прописные местоимения в прямой речи Бога выдержаны как редакционная норма данного проекта.
