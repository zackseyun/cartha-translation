  text: וְ/כָל הַ/בְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔י/ו בִּ/ימֵ֖י אַבְרָהָ֣ם אָבִ֑י/ו סִתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים וַ/יְמַלְא֖וּ/ם עָפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: ru
  text: И все колодцы, которые выкопали слуги[a] его отца при жизни Авраама, его отца, филистимляне завалили и засыпали землёй[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабы». Еврейское עֶבֶד может означать и слугу, и раба; данный контекст не требует подчёркивать подневольный статус.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское עָפָר может означать землю, почву, пыль или прах; здесь речь идёт о земле, которой засыпали колодцы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: И все колодцы
  rationale: Союз וְ сохраняет связь с предшествующим повествованием, а כָל передаёт полноту охвата. «Колодцы» — прямое и естественное соответствие בְּאֵרֹת.
- source_word: אֲשֶׁר חָפְרוּ
  choice: которые выкопали
  rationale: Относительное придаточное прямо определяет колодцы; русская форма прошедшего времени естественно обозначает действие, предшествовавшее поступку филистимлян.
- source_word: עַבְדֵי אָבִיו
  choice: слуги его отца
  rationale: עֶבֶד может обозначать как слугу, так и раба. Контекст не подчёркивает правовой статус этих людей, поэтому в основном тексте выбрано нейтральное «слуги», а возможное «рабы» отмечено в сноске.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: при жизни Авраама, его отца
  rationale: Идиома בִּימֵי передана естественным современным русским оборотом «при жизни»; повторное указание «его отца» сохранено вслед за еврейским текстом.
- source_word: סִתְּמוּם
  choice: завалили
  rationale: Глагол означает перекрыть или заг堵ить отверстие; применительно к колодцам «завалили» конкретно и естественно описывает действие.
- source_word: פְּלִשְׁתִּים
  choice: филистимляне
  rationale: Общепринятое русское название народа.
- source_word: וַיְמַלְאוּם עָפָר
  choice: и засыпали землёй
  rationale: Форма глагола содержит объектный суффикс множественного числа, относящийся к колодцам. «Засыпали землёй» естественно передаёт наполнение колодцев рыхлой почвой.
theological_decisions: []
