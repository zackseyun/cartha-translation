  source_fidelity: 'Русский текст точно передаёт все основные элементы еврейского текста: связующий союз, всеобщность («все»), колодцы, выкопанные слугами отца Исаака при жизни Авраама, а также два действия филистимлян — перекрытие колодцев и заполнение их землёй. Повторное уточнение «его отца» сохранено.'
  naturalness: Формулировка естественна для современного литературного русского с уместным библейским оттенком. Порядок слов с вынесенным вперёд дополнением и поздним подлежащим несколько книжный, но ясен и соответствует повествовательному регистру. Сочетание «завалили и засыпали землёй» передаёт два близких, но различимых еврейских глагола без смысловой потери.
  terminology: «Колодцы», «слуги», «филистимляне» и «земля» употреблены точно и нормативно. Сноска к «слугам» корректно отмечает возможное значение «рабы», не навязывая его основному тексту. Сноска к עָפָר адекватно отражает диапазон значений; выбранное в тексте «землёй» лучше всего подходит к контексту заполнения колодцев.
