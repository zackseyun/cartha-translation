  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יִצְחָ֔ק מַדּ֖וּעַ בָּאתֶ֣ם אֵלָ֑/י וְ/אַתֶּם֙ שְׂנֵאתֶ֣ם אֹתִ֔/י וַ/תְּשַׁלְּח֖וּ/נִי מֵ/אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: ru
  text: 'Исаак сказал им[a]: «Зачем вы пришли ко мне? Ведь вы ненавидели меня и отослали от себя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…ко мне, а вы ненавидели меня и отослали от себя?» Еврейский союз буквально может быть передан как «и», но здесь, вероятно, выражает основание или противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: Исаак сказал им
  rationale: Обычная повествовательная формула с глаголом אמר; порядок слов естественен для современного русского языка.
- source_word: מַדּוּעַ
  choice: Зачем
  rationale: В данном упрёке вопрос касается цели их неожиданного прихода; «зачем» звучит естественно и сохраняет вопросительную силу. Возможное «почему» не исключается смыслом.
- source_word: בָּאתֶם אֵלָי
  choice: вы пришли ко мне
  rationale: Русское прошедшее время естественно передаёт завершившийся приход, результат которого налицо.
- source_word: וְאַתֶּם
  choice: Ведь вы
  rationale: Союз וְ допускает простое соединение, но в контексте вводит основание недоумения Исаака; «ведь» естественно выражает этот обстоятельственно-противительный оттенок.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: вы ненавидели меня
  rationale: Сохранено прямое и сильное значение שנא без смягчения до «были враждебны».
- source_word: וַתְּשַׁלְּחוּנִי
  choice: отослали
  rationale: שׁלח здесь означает удалить человека, послав его прочь; «отослали» близко к тексту и не усиливает действие до «изгнали».
- source_word: מֵאִתְּכֶם
  choice: от себя
  rationale: Передаёт удаление из их присутствия и общества естественным современным русским оборотом.
