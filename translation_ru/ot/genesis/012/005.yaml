base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: ru
  text: Аврам взял с собой свою жену Сару, Лота, сына своего брата, всё имущество, которое они приобрели, и людей, которых они собрали[a] в Харране. Они отправились в землю Ханаана и пришли в землю Ханаана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально: «душу, которую они сделали в Харране»; здесь слово «душа» употреблено собирательно и, вероятно, обозначает людей, приобретённых или собранных там и вошедших в состав их дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял с собой
  rationale: В контексте ухода с перечисленными людьми и имуществом это естественно передаёт повествовательное значение לקח точнее, чем простое «взял».
- source_word: אִשְׁתּוֹ
  choice: свою жену
  rationale: В брачном контексте אִשָּׁה с местоименным суффиксом однозначно означает жену; «свою» естественно по-русски соотносит её с Аврамом.
- source_word: בֶּן אָחִיו
  choice: сына своего брата
  rationale: Сохранено буквальное обозначение родства, а не заменено более кратким «племянника».
- source_word: רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: всё имущество, которое они приобрели
  rationale: רְכוּשׁ обозначает имущество или собственность, а רכש — его приобретение; повтор корня невозможно естественно воспроизвести по-русски.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: всех людей, которых они собрали
  rationale: נפש здесь имеет собирательное значение «люди», а идиоматическое עשה, вероятно, относится к людям, вошедшим в состав их дома. Необычная буквальная форма сохранена в примечании.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: они отправились
  rationale: Сочетание глаголов выражает начало целенаправленного пути; русское «отправились» естественно передаёт его без ненужной тавтологии.
- source_word: אַרְצָה כְּנַעַן
  choice: в Ханаанскую землю
  rationale: Сохранены и направительное значение формы אַרְצָה, и существительное «земля».
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: пришли в Ханаанскую землю
  rationale: Повтор названия места назначения сохранён вслед за еврейским текстом, который подчёркивает исполнение намерения.
theological_decisions:
- issue: Характер людей, обозначенных выражением הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: не уточнять их статус и передать как «людей, которых они собрали»
  alternative: «рабов, которых они приобрели» или «обращённых ими людей»
  rationale: Еврейский текст не определяет прямо, были ли это рабы, зависимые члены дома либо иные присоединившиеся люди; перевод не должен вносить социальное или миссионерское толкование.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имена переданы в привычной русской библейской форме: Аврам, Сара, Лот, Харран, Ханаан. Намеренный повтор «в Ханаанскую землю» сохранён.'
