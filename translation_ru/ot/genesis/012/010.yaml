  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: ru
  text: В стране был голод, и Аврам спустился в Египет, чтобы пожить там некоторое время[a], потому что голод в стране был сильным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть пожить там как пришелец; этот глагол может подразумевать временное проживание среди чужого населения.
    reason: Лָגוּר обозначает проживание в качестве пришельца; временный характер и положение среди чужого населения являются возможными смысловыми оттенками.
lexical_decisions:
- source_word: וַיְהִי
  choice: наступил
  rationale: Форма вводит новое событие повествования; «наступил голод» естественно передаёт возникновение бедствия без добавления явного временного наречия.
- source_word: רָעָב
  choice: голод
  rationale: В данном контексте существительное обозначает массовую нехватку пищи, то есть голод как бедствие, а не личное чувство голода.
- source_word: בָּאָרֶץ
  choice: в той земле
  rationale: אֶרֶץ обозначает местную землю, где находился Аврам, а не всю землю; «той» делает русскую фразу естественной и отсылает к уже известной из контекста земле.
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Сохранено буквальное направление глагола ירד — движение «вниз» в Египет, характерное для библейского повествования.
- source_word: מִצְרַיְמָה
  choice: в Египет
  rationale: Направительный суффикс выражает движение к Египту; по-русски это естественно передаётся сочетанием «в Египет».
- source_word: לָגוּר
  choice: чтобы временно пожить
  rationale: גור означает проживание не на постоянной основе, обычно в положении пришельца. Основной текст ясно передаёт временность, а социально-правовой оттенок пояснён в сноске.
- source_word: שָׁם
  choice: там
  rationale: Прямое и естественное соответствие указательному наречию места.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину ухода Аврама в Египет.
- source_word: כָבֵד
  choice: сильным
  rationale: Буквально прилагательное означает «тяжёлый», но применительно к голоду выражает его суровость и интенсивность; «сильный голод» — естественное современное сочетание.
- source_word: הָרָעָב
  choice: голод
  rationale: Речь идёт о том же голоде, который уже назван; русский язык не требует артикля.
- source_word: בָּאָרֶץ
  choice: в той земле
  rationale: Повтор сохранён вслед за еврейским текстом ради смыслового акцента и повествовательной связности.
