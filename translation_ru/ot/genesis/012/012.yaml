  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: ru
  text: 'И когда[a] египтяне увидят тебя, они скажут: «Это его жена», — и убьют меня, а тебя оставят в живых[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И будет, когда»; по смыслу также возможно: «И случится, когда».'
    reason: Сохраняется возможность более буквальной передачи вводной конструкции וְהָיָה כִּי.
  - marker: b
    text: 'Или: «пощадят тебя».'
    reason: Краткая смысловая альтернатива для יְחַיּוּ — «оставят в живых, сохранят жизнь».
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Естественно передаёт вводную древнееврейскую конструкцию, обозначающую ожидаемую ситуацию; более буквальный вариант отмечен в сноске.
- source_word: יִרְאוּ אֹתָךְ
  choice: увидят тебя
  rationale: Прямое и нейтральное соответствие обычному значению ראה в данном контексте.
- source_word: הַמִּצְרִים
  choice: египтяне
  rationale: Стандартное современное обозначение народа; определённость ясна из контекста.
- source_word: וְאָמְרוּ
  choice: они скажут
  rationale: Сохраняет прямое значение глагола речи и будущую направленность высказывания.
- source_word: אִשְׁתּוֹ זֹאת
  choice: Это его жена
  rationale: Естественная русская именная конструкция, сохраняющая указательное значение זֹאת.
- source_word: וְהָרְגוּ אֹתִי
  choice: и убьют меня
  rationale: Прямо передаёт обычное значение הרג без неоправданного усиления до «убьют как преступники» или «совершат убийство».
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: а тебя оставят в живых
  rationale: Передаёт каузативное значение формы חיה — «сохранить жизнь, оставить в живых»; союз «а» естественно выражает контраст с убийством Аврама.
