  text: Но Яхве поразил фараона и его дом тяжёлыми бедствиями из-за Сары, жены Аврама.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также перевести: «навёл на фараона и его дом тяжкие поражения». Слова, переведённые как «поразил» и «бедствия», однокоренные и могут обозначать удар, поражение, бедствие или язву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: поразил
  rationale: Глагол נגע в каузативной форме здесь означает причинить тяжёлое поражение или бедствие; «поразил» сохраняет образ исходного слова и естественно сочетается с последующим дополнением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Устоявшаяся русская передача египетского царского титула.
- source_word: נְגָעִים גְּדֹלִים
  choice: тяжёлыми бедствиями
  rationale: נְגָעִים может обозначать удары, поражения, бедствия или язвы, а גְּדֹלִים указывает здесь на их тяжесть. Такой перевод сохраняет широту значения, не уточняя природу бедствий сверх текста.
- source_word: וְאֶת בֵּיתוֹ
  choice: и его дом
  rationale: «Дом» естественно допускает собирательное значение семьи и всего домашнего круга фараона, сохраняя образ и некоторую широту еврейского בַּיִת.
- source_word: עַל דְּבַר
  choice: из-за
  rationale: В данном контексте оборот выражает причину постигшего фараона бедствия.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Сары, жены Аврама
  rationale: Приложение прямо указывает на подлинный брачный статус Сары, существенный для смысла повествования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя и не заменяет его титулом.
- issue: Причинная связь в עַל דְּבַר שָׂרַי
  choice: из-за Сары
  alternative: по поводу Сары; за Сару
  rationale: Оборот обозначает, что бедствия связаны с положением Сары как жены Аврама; перевод не возлагает на неё нравственную вину и не конкретизирует механизм этой связи.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Но» передаёт контраст с предшествующим развитием событий; «его дом» сохраняет ёмкость исходного образа.
