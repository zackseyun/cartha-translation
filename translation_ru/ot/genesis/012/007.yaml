base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: ru
  text: 'Тогда Яхве явился Авраму и сказал: «Твоему потомству[a] Я дам эту землю». И он построил там жертвенник для Яхве, явившегося ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семени». Еврейское слово имеет форму единственного числа, но может собирательно обозначать потомство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה здесь обозначает явление Авраму; «явился» естественно и точно передаёт повествовательный контекст.
- source_word: לְזַרְעֲךָ
  choice: твоему потомству
  rationale: Русское «потомство» — собирательное существительное в единственном числе; оно естественно передаёт как грамматическую форму, так и коллективное значение זֶרַע.
- source_word: אֶתֵּן
  choice: Я дам
  rationale: Имперфект в прямой речи выражает обещанное будущее действие.
- source_word: הָאָרֶץ הַזֹּאת
  choice: эту землю
  rationale: В контексте обещания אֶרֶץ означает конкретную землю, а не всю землю как мир или политически оформленную страну.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: И он построил там жертвенник
  rationale: Сохраняет последовательность повествования, указание места и обычный русский библейский термин «жертвенник».
- source_word: הַנִּרְאֶה אֵלָיו
  choice: явившемуся ему
  rationale: Атрибутивное причастие определяет Яхве как Того, кто явился Авраму; русское причастие сохраняет эту синтаксическую связь без лишнего истолкования.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Единственное и собирательное значение זֶרַע
  choice: потомство
  alternative: семя; потомки
  rationale: «Потомство» сохраняет собирательное значение и форму единственного числа, не сужая обещание заранее до одного лица или множества отдельных потомков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прямой речи сохраняет акцент исходного текста на «твоему потомству», а повтор глагола «явился» отражает намеренный повтор еврейского корня ראה.
