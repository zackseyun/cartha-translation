  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: ru
  text: 'Когда он уже собирался войти в Египет, то сказал своей жене Сарай: «Послушай, я знаю, что ты красивая женщина[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщина, прекрасная видом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Еврейская повествовательная формула вместе с временным союзом вводит обстоятельство следующего действия. В современном русском естественнее передать её придаточным времени, не используя архаичное «и было».
- source_word: הִקְרִיב לָבוֹא
  choice: уже собирался войти
  rationale: Сочетание каузативной формы глагола «приближаться» с инфинитивом «войти» указывает на непосредственную близость предстоящего входа. «Уже собирался войти» естественно передаёт эту близость действия.
- source_word: מִצְרָיְמָה
  choice: в Египет
  rationale: Направительный суффикс при названии страны выражает движение внутрь или по направлению к Египту; русский предлог «в» передаёт это значение.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: своей жене Сарай
  rationale: Сохранены имя в форме, соответствующей еврейскому שָׂרַי до его изменения в 17:15, и указание на супружеские отношения.
- source_word: הִנֵּה נָא
  choice: Послушай
  rationale: Сочетание указательно-привлекающей внимание частицы и частицы вежливого побуждения здесь служит разговорным обращением. «Послушай» естественно передаёт его функцию без архаичного «вот, ныне».
- source_word: יָדַעְתִּי כִּי
  choice: я знаю, что
  rationale: Перфект ידע обозначает наличное знание, а כִּי вводит его содержание; русская конструкция прямо и естественно отражает оба элемента.
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: ты красивая женщина
  rationale: Предикативная конструкция буквально характеризует Сарай как женщину, красивую внешностью. Выбран естественный современный русский порядок слов, а буквальная образность отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Архаичная формула «и было» не воспроизводится буквально; последовательность и временная связь сохранены конструкцией «когда… то». Имя Сарай оставлено в форме, отличной от более позднего имени Сарра.
