  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: ru
  text: Я произведу от тебя великий народ, благословлю тебя и возвеличу твоё имя — и будь благословением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и ты будешь благословением». Еврейская форма — повелительная («будь»), однако в контексте Божьих обещаний её можно понимать как указание на результат: Аврам будет благословением.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: Я произведу от тебя великий народ
  rationale: Оборот передаёт значение «сделать кого-либо великим народом», но избегает неестественного по-русски впечатления, будто сам Аврам буквально является народом. «Народ» здесь обозначает большую этническую общность, происходящую от него.
- source_word: וַאֲבָרֶכְךָ
  choice: благословлю тебя
  rationale: Прямо и естественно передаёт личное Божье обещание Авраму.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: возвеличу твоё имя
  rationale: Сохраняет образ «имени», не сводя его только к репутации, и передаёт каузативный смысл «сделаю великим» естественным литературным русским глаголом.
- source_word: וֶהְיֵה
  choice: и будь
  rationale: Сохраняет форму повелительного наклонения второго лица и риторический переход от Божьих обещаний к призванию Аврама.
- source_word: בְּרָכָה
  choice: благословением
  rationale: 'Творительный падеж после «будь» естественно передаёт значение: Аврам должен стать носителем или источником благословения для других.'
theological_decisions:
- issue: Сила выражения וֶהְיֵה בְּרָכָה
  choice: 'повелительное: «и будь благословением»'
  alternative: 'результативное или предсказательное: «и ты будешь благословением»'
  rationale: Еврейская форма грамматически является императивом, поэтому основной текст сохраняет повелительную силу. Поскольку фраза следует за рядом Божьих обещаний, возможное понимание её как результата этих обещаний отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Тире подчёркивает смену от последовательности обещаний к заключительному повелению, а союз «и» сохраняет связь с еврейским текстом.
