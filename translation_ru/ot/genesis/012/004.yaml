  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: ru
  text: И пошёл Аврам, как сказал ему Яхве; и Лот пошёл с ним. Авраму было семьдесят пять лет, когда он вышел из Харрана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Форма wayyiqtol от הלך передаёт последовательное повествовательное действие. «Пошёл» естественно и точно, не усиливая оттенок начала пути, как могло бы «отправился».
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз выражает соответствие поступка Аврама сказанному Яхве. Русское «как» передаёт это естественно и без добавочного толкования.
- source_word: דִּבֶּר אֵלָיו
  choice: сказал ему
  rationale: В данном контексте דבר обозначает обращённую к Авраму речь. «Сказал ему» — естественный русский эквивалент; предшествование речи ясно из контекста и не требует дополнительной грамматической маркировки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом. Форма «Яхве» нормативна и узнаваема в современном русском библейском употреблении.
- source_word: אִתּוֹ
  choice: с ним
  rationale: Прямой и естественный эквивалент предлога с местоименным суффиксом.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: Авраму было семьдесят пять лет
  rationale: Еврейская идиома возраста передана обычной современной русской конструкцией без буквального семитизма.
- source_word: בְּצֵאתוֹ
  choice: когда он вышел
  rationale: Инфинитивная конструкция с ב указывает на время действия. «Когда он вышел» сохраняет обычное значение יצא и естественно обозначает уход из города.
- source_word: מֵחָרָן
  choice: из Харрана
  rationale: Предлог מ передан как «из», что естественно при глаголе выхода; топоним חָרָן дан в принятой русской форме «Харран».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя-тетраграмматон. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический повтор «пошёл… пошёл» сохранён как значимый параллелизм оригинала; архаические обороты устранены.
