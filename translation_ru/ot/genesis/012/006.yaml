  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: ru
  text: Аврам прошёл по земле до места Сихема, до дуба Море[a]. В то время в земле жили хананеи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать дуб, теревинф или вообще большое дерево; точная порода неизвестна.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «хананей тогда был в земле». В еврейском тексте этноним стоит в единственном числе, но имеет собирательное значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: прошёл
  rationale: Форма от עבר описывает продвижение Аврама по земле; «прошёл» естественно передаёт пересечение или прохождение местности, не уточняя путь и способ передвижения.
- source_word: בָּאָרֶץ
  choice: по этой земле / в этой земле
  rationale: Артикль указывает на уже подразумеваемую землю Ханаана. Указательное «этой» по-русски ясно связывает выражение с землёй, названной в контексте, а повтор во второй части сохранён.
- source_word: עַד מְקוֹם שְׁכֶם
  choice: до местности Сихема
  rationale: עַד обозначает предел движения, а מְקוֹם — место или местность. Такая передача не предполагает, что Сихем уже представлен как вполне сформировавшийся позднейший город.
- source_word: אֵלוֹן מוֹרֶה
  choice: дуба Море
  rationale: אֵלוֹן обозначает крупное дерево, традиционно дуб или теревинф; «дуб» понятно и естественно, а неопределённость породы отмечена в сноске. מוֹרֶה передано как имя собственное без истолковывающего перевода.
- source_word: וְהַכְּנַעֲנִי
  choice: хананеи
  rationale: Еврейское существительное стоит в единственном числе, но этноним с артиклем употреблён собирательно. Русское множественное число естественно передаёт присутствие народа, не создавая ложного впечатления об одном человеке.
- source_word: אָז
  choice: в то время
  rationale: Временное наречие указывает на обстоятельства описываемого периода; «в то время» звучит в русском повествовании естественнее буквального «тогда» в данном порядке слов.
theological_decisions:
- issue: Число собирательного этнонима וְהַכְּנַעֲנִי
  choice: «хананеи … жили» — русское множественное число
  alternative: «хананей … был» — формальное сохранение еврейского единственного числа
  rationale: В еврейском тексте этноним в единственном числе имеет собирательное значение. В современном русском буквальное единственное число воспринималось бы как указание на отдельного человека, поэтому множественное число точнее передаёт смысл; особенность оригинала сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому повествованию, но собирательный этноним передан естественным для русского языка множественным числом. Все сноски поставлены непосредственно после тех слов, к которым относятся.
