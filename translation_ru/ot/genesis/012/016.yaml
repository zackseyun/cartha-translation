  text: וּ/לְ/אַבְרָ֥ם הֵיטִ֖יב בַּ/עֲבוּרָ֑/הּ וַֽ/יְהִי ל֤/וֹ צֹאן וּ/בָקָר֙ וַ/חֲמֹרִ֔ים וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/אֲתֹנֹ֖ת וּ/גְמַלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: ru
  text: А с Аврамом он хорошо обошёлся из-за неё[a], и у Аврама появились овцы, крупный скот, ослы, рабы и рабыни, ослицы и верблюды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради неё». Еврейское выражение допускает оба перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: хорошо обошёлся
  rationale: Хифиль от יטב здесь означает благосклонно поступить с кем-либо; выражение естественно передаёт личное отношение к Авраму.
- source_word: בַּעֲבוּרָהּ
  choice: из-за неё
  rationale: Оборот обозначает причину или повод. «Из-за неё» сохраняет причинный смысл, не усиливая оттенок действия ради её блага.
- source_word: וַיְהִי לוֹ
  choice: у Аврама появились
  rationale: Еврейская конструкция указывает на возникшее в результате обладание, а не просто на уже имевшуюся собственность; повтор имени устраняет двусмысленность русского местоимения.
- source_word: צֹאן
  choice: овцы
  rationale: Собирательное название мелкого скота; в данном перечне «овцы» — ясный и традиционный эквивалент, хотя термин может включать и коз.
- source_word: בָקָר
  choice: крупный скот
  rationale: Собирательное обозначение крупного рогатого скота.
- source_word: חֲמֹרִים
  choice: ослы
  rationale: Мужская форма множественного числа обозначает ослов-самцов и сохраняет противопоставление последующим ослицам.
- source_word: עֲבָדִים
  choice: рабы
  rationale: В перечне имущества слово обозначает зависимых людей мужского пола; «рабы» прямо передаёт их несвободный статус.
- source_word: שְׁפָחֹת
  choice: рабыни
  rationale: Женская форма обозначает зависимых женщин; «рабыни» сохраняет как пол, так и несвободный статус.
- source_word: אֲתֹנֹת
  choice: ослицы
  rationale: Слово специально обозначает ослиц и противопоставлено слову חֲמֹרִים.
- source_word: גְמַלִּים
  choice: верблюды
  rationale: Прямой и общепринятый русский эквивалент.
theological_decisions: []
