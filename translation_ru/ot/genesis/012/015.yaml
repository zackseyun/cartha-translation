base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: ru
  text: Сановники фараона увидели её и расхвалили её фараону[a], и женщину взяли в дом фараона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «похвалили её фараону»; «хорошо отзывались о ней перед фараоном».'
    reason: lexical_alternative
  - marker: b
    text: Слово «дом» здесь может означать не только здание, но и царский дом или двор фараона.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: придворные фараона
  rationale: שָׂרִים обозначает высокопоставленных людей, начальников или князей. В контексте царского двора «придворные» естественно передаёт их положение, не подразумевая родства с фараоном.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: стали хвалить её перед фараоном
  rationale: Пиэль глагола הלל здесь означает «хвалить, превозносить, рекомендовать». Формулировка сохраняет прямое значение и допускает подразумеваемую похвалу её красоте.
- source_word: וַתֻּקַּח
  choice: взяли
  rationale: Еврейская пассивная форма не называет действующее лицо и подчёркивает пассивное положение женщины. Русская неопределённо-личная конструкция естественно сохраняет отсутствие названного агента.
- source_word: הָאִשָּׁה
  choice: женщину
  rationale: В еврейском тексте буквально стоит «женщина», а не отдельное слово «жена»; прямой перевод не вносит отсутствующего уточнения.
- source_word: בֵּית פַּרְעֹה
  choice: в дом фараона
  rationale: בַּיִת может обозначать как здание, так и царский дом или двор. «Дом фараона» сохраняет эту смысловую широту, тогда как «дворец» был бы более узким толкованием.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: увидев её
  rationale: ראה — обычный глагол «видеть». Деепричастная конструкция естественно связывает наблюдение с последовавшей похвалой, не добавляя нового смысла.
