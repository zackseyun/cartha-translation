  terminology: «Сановники фараона» удачно передаёт שָׂרֵי פַרְעֹה без ложного указания на родство. «Женщину» и «дом фараона» сохраняют лексику оригинала. Примечание к «дому» следует ограничить значениями царского дома/двора, не добавляя неуместное здесь «хозяйство».
