  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: ru
  text: Я благословлю благословляющих тебя, а того, кто пренебрегает тобой, Я прокляну[a]; и в тебе благословятся все племена земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол здесь может также означать «относится к тебе с презрением», «бесчестит тебя» или «проклинает тебя»; он слабее следующего глагола: «Я прокляну».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «через тебя будут благословлены все племена земли» или «тобой будут благословлять себя все племена земли». Еврейская форма допускает пассивное и возвратно-медиальное понимание, а предлог — значение «в» или «через».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: Я благословлю
  rationale: Форма 1-го лица ед. числа от ברך выражает Божье обещание; будущее время естественно передаёт его по-русски.
- source_word: מְבָרְכֶיךָ
  choice: благословляющих тебя
  rationale: Причастие во множественном числе употреблено субстантивно; перевод сохраняет число и действие.
- source_word: וּמְקַלֶּלְךָ
  choice: того, кто унижает тебя
  rationale: קלל может означать считать незначительным, бесчестить или проклинать. «Унижает» передаёт пренебрежительное отношение и сохраняет отличие от более сильного אָאֹר; единственное число оригинала также сохранено.
- source_word: אָאֹר
  choice: прокляну
  rationale: Глагол ארר прямо и сильно обозначает наложение проклятия; русский эквивалент сохраняет усиление по сравнению с קלל.
- source_word: וְנִבְרְכוּ
  choice: благословятся
  rationale: Нифаль от ברך допускает пассивное и возвратно-медиальное понимание. Русская форма «благословятся» естественна в библейском обещании, но сама по себе не устраняет всей неоднозначности, которая поясняется в сноске.
- source_word: בְךָ
  choice: в тебе
  rationale: Буквально и ёмко передаёт предлог ב, сохраняя возможные оттенки сферы и посредничества.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: все племена земли
  rationale: מִשְׁפָּחוֹת обозначает родственные группы или кланы; «племена» здесь естественно и передаёт более широкие семейно-родовые сообщества. «Земли» выражает всеобщий охват обещания.
theological_decisions:
- issue: Значение формулы וְנִבְרְכוּ בְךָ
  choice: «в тебе благословятся»
  alternative: «через тебя будут благословлены»; «тобой будут благословлять себя»
  rationale: Еврейский нифаль допускает пассивное и возвратно-медиальное истолкование, а בְּךָ — значение «в тебе» или инструментальное «через тебя». Основной текст сохраняет традиционно естественную русскую форму, а сноска открыто отмечает альтернативы, не разрешая богословский вопрос за читателя.
translation_notes:
  register: Современный литературный русский с достоинством библейского обещания. Сохранены контраст множественного и единственного числа, различие между קלל и ארר и неоднозначность заключительной формулы.
