base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: ru
  text: 'Зачем ты сказал: «Она моя сестра», — и я взял её себе в жёны? А теперь вот твоя жена; возьми её и уходи».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה
  choice: Зачем
  rationale: В контексте упрёка вопрос касается причины и последствий поступка Аврама; «зачем» естественно передаёт обвинительный оттенок, не вводя дополнительного содержания.
- source_word: אָמַרְתָּ
  choice: ты сказал
  rationale: Простое прошедшее время соответствует повествовательному упрёку фараона.
- source_word: אֲחֹתִי הִוא
  choice: Она моя сестра
  rationale: Прямая речь и настоящее время сохраняют форму еврейского безглагольного именного предложения.
- source_word: וָאֶקַּח
  choice: так что я взял
  rationale: Передаёт фактическое следствие слов Аврама, выраженное последовательностью событий; «так что» не приписывает Авраму намерения добиться этого результата.
- source_word: לִי לְאִשָּׁה
  choice: себе в жёны
  rationale: Естественный русский брачный оборот, сохраняющий значение личной заинтересованности дательного לִי.
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Обозначает переход от упрёка к распоряжению.
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: вот твоя жена
  rationale: «Вот» кратко и естественно передаёт указательную силу הִנֵּה без архаического «се».
- source_word: קַח וָלֵךְ
  choice: забирай её и уходи
  rationale: В контексте «забирай» естественнее голого «возьми» и ясно обозначает возвращение Сары Авраму; местоимение восполняет очевидный объект повеления.
theological_decisions:
- issue: Причинная связь между словами Аврама и поступком фараона
  choice: так что я взял её себе в жёны
  alternative: и я взял её себе в жёны
  rationale: Перевод сохраняет связь событий и упрёк фараона, но избегает целевого «чтобы», которое могло бы приписать Авраму намерение устроить этот брак.
translation_notes:
  register: Современный литературный русский язык; реплика звучит как резкий, но не стилистически усиленный сверх текста упрёк. Архаизмы устранены, краткость и повелительный характер концовки сохранены.
