base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: ru
  text: 'Оттуда он направился в горную местность к востоку от Вефиля и раскинул свой шатёр: Вефиль был к западу, а Гай — к востоку. Там он построил жертвенник Яхве[a] и воззвал к имени Яхве[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. YHWH (יהוה); традиционно: «Господь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «провозгласил имя Яхве». Еврейское выражение может означать как обращение к Яхве в поклонении, так и публичное возвещение его имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: он перешёл
  rationale: Глагол обозначает перемещение с прежнего места; «перешёл» естественно передаёт продолжение пути, не добавляя невыраженных подробностей о снятии лагеря.
- source_word: הָהָרָה
  choice: в горную местность
  rationale: Направительный суффикс указывает на движение к гористой области. По географическому контексту собирательное «горная местность» точнее и естественнее буквального единственного «гора».
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: к востоку от Вефиля
  rationale: קֶדֶם здесь имеет пространственное значение и указывает на расположение относительно Вефиля.
- source_word: וַיֵּט אָהֳלֹה
  choice: и раскинул свой шатёр
  rationale: Устойчивое русское выражение естественно передаёт установку шатра и сохраняет образ развёртывания полотнищ.
- source_word: מִיָּם
  choice: к западу
  rationale: Хотя יָם буквально означает «море», в географической ориентации слово обозначает запад, со стороны Средиземного моря.
- source_word: וְהָעַי מִקֶּדֶם
  choice: а Гай — к востоку
  rationale: Параллельная конструкция ясно показывает, что стоянка находилась между Вефилем и Гаем.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Обычный и точный русский эквивалент сооружения для жертвоприношения и поклонения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יְהוָה передано транслитерацией «Яхве», а не заменено титулом; традиционный вариант отмечен в сноске.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: и призвал имя Яхве
  rationale: Формулировка сохраняет библейскую идиому и её основной смысл — обращение к Богу в поклонении, не исключая возможного значения публичного провозглашения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя Бога. «Яхве» непосредственно представляет это имя; традиционная замена титулом указана в сноске.
- issue: Смысл וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: призвал имя Яхве
  alternative: провозгласил имя Яхве
  rationale: В контексте жертвенника наиболее непосредственно выражено молитвенное призывание в поклонении, однако еврейская формула допускает также публичное провозглашение, поэтому эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис упрощён для ясности, но географическая симметрия и повторение имени Яхве сохранены.
