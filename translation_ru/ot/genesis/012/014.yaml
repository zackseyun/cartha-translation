  text: И когда Аврам вошёл в Египет, египтяне увидели, что женщина[a] очень красива.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жена». Еврейское אִשָּׁה может означать и «женщина», и «жена»; в основном тексте сохранено более общее значение этого слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: И когда … вошёл
  rationale: 'Сочетание повествовательной формы היה с временным оборотом כְּבֹא вводит следующее событие: «и когда … вошёл». Такой оборот естественен в современном русском и передаёт последовательность повествования без буквального «и было».'
- source_word: אַבְרָם
  choice: Аврам
  rationale: Традиционная русская передача имени Abram на данном этапе повествования, до его переименования в Авраама.
- source_word: מִצְרָיְמָה
  choice: в Египет
  rationale: Направительный суффикс ה указывает на движение в Египет; в русском это естественно выражается сочетанием «вошёл в Египет».
- source_word: וַיִּרְאוּ
  choice: увидели
  rationale: Прямое значение ראה сохраняется без более истолковательного «заметили».
- source_word: הַמִּצְרִים
  choice: египтяне
  rationale: Определённая форма множественного числа этнонима естественно передаётся русским «египтяне».
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: אִשָּׁה может означать как «женщина», так и «жена». В основном тексте сохранено более общее обозначение исходного предложения; контекстуальная альтернатива отмечена в сноске.
- source_word: כִּי
  choice: что
  rationale: 'Здесь כִּי вводит содержание восприятия: египтяне увидели, что женщина красива.'
- source_word: יָפָה הִוא מְאֹד
  choice: она очень красива
  rationale: 'Именное предложение описывает её красоту; в русском после существительного местоимение можно не повторять, поэтому в тексте естественно: «женщина очень красива». מְאֹד передано усилителем «очень».'
