  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: ru
  text: Скажи, пожалуйста, что ты моя сестра, чтобы благодаря тебе[b] мне было хорошо и я остался в живых благодаря тебе[a].
