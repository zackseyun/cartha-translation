    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь и в конце стиха употреблены два близких причинных выражения: Аврам ожидает, что и благополучие, и сохранение его жизни будут связаны с Сарай и с тем, кем её сочтут.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Скажи, пожалуйста
  rationale: Форма повелительного наклонения женского рода единственного числа с частицей נָא выражает настойчивую, но смягчённую просьбу. Такой порядок слов естественен для современного русского языка.
- source_word: אֲחֹתִי אָתְּ
  choice: что ты моя сестра
  rationale: Именное предложение буквально означает «ты моя сестра». Союз «что» естественно вводит его как содержание просьбы после глагола «скажи».
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое, с возможным оттенком ожидаемого результата, значение еврейского выражения.
- source_word: יִיטַב לִי
  choice: мне было хорошо
  rationale: Сохраняет широту еврейской идиомы «будет хорошо мне», не сводя её исключительно к конкретному виду благосклонного обращения.
- source_word: בַעֲבוּרֵךְ
  choice: благодаря тебе
  rationale: В данном контексте выражает причину ожидаемого благополучия Аврама — предполагаемое родство Сары с ним.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: я остался жив
  rationale: Буквально «и будет жить моя נפש». Здесь נֶפֶשׁ обозначает жизнь или самого человека, поэтому русская идиома передаёт смысл без ошибочного акцента на отдельной нематериальной душе.
- source_word: בִּגְלָלֵךְ
  choice: благодаря тебе
  rationale: Второе причинное выражение подчёркивает, что Аврам связывает своё спасение с Сарой. Повтор в русском сохраняет смысловой нажим оригинала и избегает отрицательного оттенка оборота «из-за тебя».
