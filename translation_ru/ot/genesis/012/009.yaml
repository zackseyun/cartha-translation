lexical_decisions:
- source_word: וַיִּסַּע
  choice: двинулся дальше
  rationale: Форма qal wayyiqtol от נסע обозначает снятие с места и продолжение пути. «Двинулся дальше» естественно передаёт движение вперёд, не добавляя излишней конкретики о сворачивании лагеря.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Традиционная и общепринятая русская передача личного имени.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: направляясь
  rationale: Сочетание инфинитивов при основном глаголе придаёт движению продолжительный, поступательный характер. Деепричастие сохраняет этот оттенок и избегает стилистической тавтологии.
- source_word: הַנֶּגְבָּה
  choice: к Негеву
  rationale: Существительное с артиклем и направительным окончанием -ה, вероятнее всего, указывает на южную область Негев и движение в её сторону; при этом возможное значение направления отмечено в сноске.
