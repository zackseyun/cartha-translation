base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: ru
  text: 'Яхве сказал Авраму: «Оставь свою землю, свою родню и дом своего отца и иди в землю, которую Я тебе покажу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: לֶךְ־לְךָ
  choice: оставь… и иди
  rationale: Идиоматический призыв передан естественно по-русски; сочетание выражает решительное отправление, а не требует буквального «иди себе».
- source_word: מֵאַרְצְךָ
  choice: свою землю
  rationale: «Земля» сохраняет широкий смысл страны или территории происхождения.
- source_word: מִמּוֹלַדְתְּךָ
  choice: свою родню
  rationale: В данном перечне обозначает круг родственников и родственную среду; «родня» понятно современному читателю и не сужает значение до места рождения.
- source_word: מִבֵּית אָבִיךָ
  choice: дом своего отца
  rationale: Сохранён библейский образ отцовского дома, охватывающий семью и хозяйство.
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: в землю, которую Я тебе покажу
  rationale: Прямо сохраняет обещание будущего указания земли без добавочного уточнения.
theological_decisions:
- issue: Передача тетраграмматона
  choice: Яхве
  alternative: Господь
  rationale: В исходном еврейском тексте стоит личное имя יְהוָה; транслитерация сохраняет это различие.
- issue: Смысл לֶךְ־לְךָ
  choice: решительный призыв оставить прежнюю среду и отправиться
  alternative: «иди ради себя» или «иди к себе»
  rationale: Дательный суффикс допускает обсуждение оттенка, но в контексте естественно усиливает повеление; спорный богословский смысл в перевод не внесён.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Перечень из трёх всё более близких Авраму сфер сохранён; союз «и иди» делает направление повеления ясным и естественным.
