base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: ru
  text: 'Тогда фараон призвал Аврама и сказал: «Что это ты со мной сделал? Почему ты не сказал мне, что она твоя жена?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: В сочетании с לְ и обозначением лица глагол קרא здесь означает позвать или призвать к себе; «призвал» естественно передаёт официальный вызов Аврама фараоном, не усиливая его до оттенка принудительного задержания.
- source_word: פַרְעֹה
  choice: фараон
  rationale: Устоявшаяся русская передача египетского царского титула.
- source_word: לְאַבְרָם
  choice: Аврама
  rationale: Традиционная и узнаваемая русская форма личного имени אַבְרָם, оформленная как прямое дополнение при глаголе «призвал».
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Обычный повествовательный глагол אמר передан нейтральным «сказал»; следующие за ним вопросы не требуют замены на «спросил».
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: Что ты со мной сделал?
  rationale: Русская идиома естественно передаёт упрёк и личную направленность לִי. Буквальное «Что это ты сделал мне?» в современном русском звучало бы менее естественно.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: Почему ты не сказал мне
  rationale: Hiphil глагола נגד означает сообщить или дать знать; в данном контексте простое «сказал мне» ясно и естественно.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, о чём Аврам не сообщил фараону.
- source_word: אִשְׁתְּךָ הִוא
  choice: она твоя жена
  rationale: Именное предложение с местоимением הִוא передано настоящим временем и сохраняет явное указание на женщину как жену Аврама.
