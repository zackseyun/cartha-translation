  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: ru
  text: И фараон дал людям указания относительно него[a], и они отослали его, его жену и всё, что ему принадлежало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приказал относительно него людям». Еврейское «людям» не уточняет их роль; вероятно, речь идёт о людях или служителях фараона.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: отдал … распоряжения
  rationale: Глагол צוה означает «приказывать, давать распоряжение»; выбранная формулировка естественна по-русски и сохраняет властный характер действия фараона.
- source_word: עָלָיו
  choice: о нём
  rationale: Предлог עַל при צוה указывает на лицо, относительно которого даны распоряжения; «о нём» сохраняет намеренную неопределённость их точного содержания.
- source_word: אֲנָשִׁים
  choice: своим людям
  rationale: Буквально — «людям/мужчинам»; притяжательное «своим» естественно обозначает людей фараона, не уточняя вопреки тексту, были ли они слугами, стражниками или чиновниками.
- source_word: וַיְשַׁלְּחוּ
  choice: проводили
  rationale: В данном контексте שלח может обозначать как удаление, так и сопровождение при отбытии. «Проводили» естественно сочетается с перечислением лиц и имущества и не требует добавлять отсутствующий в еврейском тексте пункт назначения.
- source_word: אֹתוֹ
  choice: его
  rationale: Прямое дополнение относится к Авраму.
- source_word: אִשְׁתּוֹ
  choice: его жену
  rationale: В брачном контексте אשה с суффиксом означает «его жена».
- source_word: כָּל אֲשֶׁר לוֹ
  choice: всё, что у него было
  rationale: Идиоматичный русский эквивалент еврейской конструкции принадлежности, охватывающей имущество Аврама.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятая русская передача египетского царского титула; со строчной буквы как титул, употреблённый самостоятельно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь с предыдущим стихом. Формулировка не уточняет роль людей фараона и не усиливает насильственный оттенок удаления, которого сама глагольная форма однозначно не требует.
