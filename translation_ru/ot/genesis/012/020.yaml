  verdict: revise
  source_fidelity: В черновике верно передано, что фараон издал распоряжения относительно Аврама и что вместе с ним названы жена и всё принадлежавшее ему. Однако «своим людям» добавляет не выраженную в еврейском тексте принадлежность, а «проводили» ослабляет וַיְשַׁלְּחוּ («отослали/отправили прочь, отпустили»).
  naturalness: «Дал людям указания относительно него» — естественная современная литературная конструкция и сохраняет синтаксическую неопределённость еврейского выражения. «Отослали его» ясно передаёт отправление прочь без ненужного уточнения способа сопровождения.
  terminology: «Фараон» и «жена» употреблены корректно. «Всё, что ему принадлежало» точно передаёт כָּל־אֲשֶׁר לוֹ как совокупность имущества/принадлежавшего Авраму.
