    text: 'Буквально: «своих сыновей и своих дочерей». В данном контексте, вероятно, имеются в виду потомки Лавана — его внуки и внучки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: встал рано утром
  rationale: Глагол שׁכם в породе хифиль означает раннее начало действия, а בַּבֹּקֶר — «утром». Сочетание «встал рано утром» естественно по-русски и сохраняет временной акцент оригинала.
- source_word: וַיְנַשֵּׁק
  choice: поцеловал
  rationale: В данном контексте глагол обозначает родственный прощальный поцелуй; прямой русский эквивалент не требует поясняющего расширения.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: своих сыновей и дочерей
  rationale: Перевод сохраняет раздельные родственные обозначения оригинала и не заменяет их более общим словом «детей». Возможная расширенная референция к потомкам отмечена в сноске.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: и благословил их
  rationale: ברך прямо означает «благословлять». Прощальный контекст не даёт оснований сводить смысл к простому прощанию.
- source_word: וַיֵּלֶךְ וַיָּשָׁב
  choice: ушёл и вернулся
  rationale: 'Два последовательных глагола движения переданы естественной русской парой, сохраняющей ход повествования: Лаван покинул это место и возвратился.'
- source_word: לִמְקֹמוֹ
  choice: к себе
  rationale: Буквально выражение означает «к своему месту». Русское «к себе» естественно передаёт возвращение в собственное место или жилище, не уточняя его сверх оригинала.
theological_decisions:
- issue: Родственные обозначения мужского и женского рода
  choice: своих сыновей и дочерей
  alternative: своих детей; своих внуков и внучек
  rationale: В еврейском тексте прямо употреблены слова «сыновья» и «дочери». Основной текст сохраняет эту форму и присущую ей неоднозначность относительно точной степени родства, а контекстуальное пояснение вынесено в сноску.
