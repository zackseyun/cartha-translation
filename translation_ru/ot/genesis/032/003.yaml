  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: ru
  text: 'Увидев их, Иаков сказал: «Это стан Божий». И назвал он то место Маханаимом[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Название «Маханаим» имеет форму двойственного числа и может быть понято как «два стана»; оно перекликается со словами Иакова: «Это стан Божий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאָם
  choice: Увидев их
  rationale: Деепричастный оборот естественно передаёт временное значение כַּאֲשֶׁר; местоименное окончание 3-го лица множественного числа относится к ангелам Божьим из предыдущего стиха.
- source_word: מַחֲנֵה אֱלֹהִים
  choice: стан Божий
  rationale: «Стан» — понятное литературное обозначение расположившегося лагерем сообщества; оно сохраняет связь с названием מַחֲנָיִם. Родительный оборот передаёт конструкцию «стан Бога» без добавочного толкования.
- source_word: זֶה
  choice: Это
  rationale: Указательное местоимение выступает в составе именного сказуемого; в русском настоящем времени связка не требуется.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: И назвал он то место
  rationale: Русское «назвал» естественно передаёт еврейскую идиому «нарёк имя» и сохраняет повествовательную последовательность; постпозиция «он» поддерживает умеренно возвышенный библейский регистр.
- source_word: מַחֲנָיִם
  choice: Маханаимом
  rationale: Собственное имя передано принятой русской транслитерацией; творительный падеж требуется после глагола «назвал». Возможное значение двойственного числа вынесено в сноску.
