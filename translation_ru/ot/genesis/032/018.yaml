base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: ru
  text: 'И приказал он первому: «Когда встретит тебя Исав, брат мой, и спросит: „Чей ты? Куда идёшь? И чьи эти стада впереди тебя?“ —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: первому
  rationale: Субстантивированное «первый» по контексту обозначает первого из слуг, ведущих стада; в русском дополнение можно не повторять.
- source_word: לְמִי אַתָּה
  choice: Чей ты?
  rationale: Формально и естественно передаёт вопрос о том, кому слуга принадлежит или у кого служит, не уточняя это сверх текста.
- source_word: וְאָנָה תֵלֵךְ
  choice: Куда идёшь?
  rationale: Прямое современное соответствие направительному вопросу.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: И чьи эти стада впереди тебя?
  rationale: '«Эти» по ближайшему контексту — стада дара; добавление «стада» делает русский вопрос ясным, не меняя референта. לְפָנֶיךָ передано пространственно: «впереди тебя».'
- source_word: לֵאמֹר
  choice: 'приказал: … и спросит:'
  rationale: Обе служебные формулы введения речи переданы естественным русским синтаксисом без тяжеловесного повторения «сказав/говоря».
theological_decisions: []
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный регистр. Инверсия «Исав, брат мой» сохраняет акцент исходника и звучит уместно в прямой речи. Стих синтаксически продолжается в следующем стихе, поэтому завершён тире, а не точкой.
