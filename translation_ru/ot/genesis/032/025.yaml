lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: остался
  rationale: 'Нифаль глагола יתר допускает пассивное понимание «был оставлен», однако в данном повествовательном контексте естественное русское «остался» передаёт результат: после переправы остальных Иаков оказался один.'
- source_word: לְבַדּוֹ
  choice: один
  rationale: Кратко и естественно передаёт состояние Иакова, оставшегося без других людей.
- source_word: וַיֵּאָבֵק
  choice: боролся
  rationale: Редкий глагол обозначает телесную борьбу, схватку; «боролся» точно и естественно по-русски.
- source_word: אִישׁ
  choice: какой-то человек
  rationale: Существительное означает «мужчина, человек». Неопределённое «какой-то» сохраняет внезапность появления и загадочность персонажа, не предрешая его последующего богословского отождествления.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Передаёт взаимную телесную схватку человека с Иаковом.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: до рассвета
  rationale: Естественный русский эквивалент выражения, буквально означающего «до восхождения зари».
theological_decisions:
- issue: Кем был אִישׁ в сцене борьбы
  choice: В основном тексте — «какой-то человек», без уточнения его природы.
  alternative: ангел; Бог или Господь, явившийся в человеческом облике
  rationale: Сам этот стих называет персонажа только человеком. Последующий контекст и Ос 12:4 способствуют более полному пониманию, но перевод данного стиха должен сохранять исходную повествовательную загадку.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и dignified, без архаизмов. Разделение на два предложения устраняет тяжеловесное повторение союза «и», сохраняя последовательность еврейского текста.
