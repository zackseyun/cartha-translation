  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: ru
  text: Поэтому сыны Израиля и доныне не едят жилу[a], находящуюся на суставе бедра, потому что он коснулся сустава бедра Иакова в области этой жилы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение обозначает определённую жилу в области бедра; его точная анатомическая идентификация спорна. Его также понимают как седалищный нерв или связанное с ним сухожилие.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственное выражение, которым объясняется сохраняющийся обычай.
- source_word: לֹא יֹאכְלוּ
  choice: не едят
  rationale: Отрицательная форма имперфекта в данном пояснении обозначает продолжающийся обычай; русское настоящее время передаёт это естественно.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет семейно-родовое выражение оригинала и одновременно служит обычным библейским обозначением израильтян.
- source_word: גִּיד הַנָּשֶׁה
  choice: бедренное сухожилие
  rationale: Передаёт גִּיד как плотную волокнистую ткань, а הַנָּשֶׁה — как указание на область бедра; точная анатомическая идентификация остаётся спорной и отмечена в сноске.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: которое находится у впадины бедра
  rationale: כַּף в этом контексте обозначает углубление или суставную впадину, а יָרֵךְ — область бедра или таза; предлог «у» даёт понятное пространственное описание без чрезмерной анатомической конкретизации.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и доныне
  rationale: Естественное современное русское выражение для обычая, сохраняющегося «до этого дня».
- source_word: כִּי נָגַע
  choice: потому что он коснулся
  rationale: Сохраняет основное значение נגע — «коснуться», не усиливая его до «ударить»; местоимение оставлено без уточнения личности действующего лица, как в контексте оригинала.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב בְּגִיד הַנָּשֶׁה
  choice: впадины бедра Иакова у бедренного сухожилия
  rationale: Повторяет ключевую анатомическую лексику первой половины стиха и понимает בְ как указание на место прикосновения.
theological_decisions:
- issue: Кто коснулся бедра Иакова
  choice: он коснулся
  alternative: Бог коснулся / тот человек коснулся
  rationale: В самом стихе субъект не назван; местоименная передача сохраняет повествовательную и богословскую неоднозначность ближайшего контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «сыны Израиля». Анатомическое описание сохранено конкретным, но не чрезмерно техническим; повтор исходного термина передан последовательно.
