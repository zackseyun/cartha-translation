source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: ru
  text: 'И сказал: «Тебя будут называть уже не Иаковом, а Израилем, потому что ты боролся с Богом[a] и с людьми[b] и превозмог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с божественными существами». Еврейское אֱלֹהִים в разных контекстах может обозначать Бога, богов или небесных существ; здесь перевод «Богом» выбран с учётом повествовательного контекста.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «с мужчинами». Еврейское אֲנָשִׁים также может обозначать мужчин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: будут называть
  rationale: Пассив глагола אמר в формуле наречения имени естественно передаётся по-русски неопределённо-личной конструкцией «будут называть».
- source_word: עוֹד
  choice: впредь
  rationale: В контексте переименования слово указывает, что прежнее имя больше не будет употребляться как основное; «впредь» кратко и литературно передаёт этот смысл.
- source_word: כִּי אִם
  choice: а
  rationale: 'Сочетание выражает противопоставление в формуле переименования: не Иаковом, а Израилем.'
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя передано принятой русской библейской формой; следующая фраза сохраняет связанную с ним словесную игру через глагол «боролся».
- source_word: שָׂרִיתָ
  choice: боролся
  rationale: Глагол обозначает борьбу или противоборство и служит объяснением имени Израиль. «Боролся» ясно и естественно передаёт как физическую, так и более широкую сторону противостояния.
- source_word: אֱלֹהִים
  choice: Богом
  rationale: В ближайшем повествовательном контексте подразумевается Бог, хотя форма допускает и более широкое обозначение божественных существ; неоднозначность отмечена в сноске.
- source_word: אֲנָשִׁים
  choice: людьми
  rationale: «Людьми» естественно передаёт множественное число и сохраняет риторическое противопоставление Богу; более узкое «мужчинами» здесь звучало бы по-русски неестественно.
- source_word: וַתּוּכָל
  choice: и превозмог
  rationale: Форма от יכל обозначает успешный исход — способность устоять или взять верх. «Превозмог» сохраняет сжатость и возвышенность исходной формулы, не сводя её к грубой физической победе.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים в объяснении нового имени
  choice: Бог
  alternative: божественные существа / небесные существа
  rationale: Контекст таинственной встречи и последующее осмысление Иаковом пережитого поддерживают чтение «Бог». При этом возможный более широкий смысл слова не устранён, а вынесен в сноску.
- issue: Характер победы, выраженной וַתּוּכָל
  choice: превозмог
  alternative: устоял / одолел / оказался способен
  rationale: Перевод должен передать успешный исход борьбы, но не утверждать безоговорочно, будто Иаков полностью победил Бога. «Превозмог» сохраняет напряжение повествования.
- issue: Объём значения אֲנָשִׁים
  choice: люди
  alternative: мужчины / мужи
  rationale: В русском контексте «люди» наиболее естественно выражает противопоставление Богу и не вводит необязательного ограничения только взрослыми мужчинами; более буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным звучанием. Неопределённо-личное «будут называть» естественно воспроизводит еврейскую пассивную формулу наречения имени; тире перед заключительным результатом подчёркивает кульминацию, не добавляя нового смысла.
