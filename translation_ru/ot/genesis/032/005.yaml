  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: ru
  text: 'И он повелел им: «Так скажите моему господину Исаву: „Так говорит твой слуга Иаков: я жил у Лавана как пришелец[a] и оставался там доныне“».'
