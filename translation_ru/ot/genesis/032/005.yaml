lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол צוה выражает распоряжение с обязательной силой; «повелел» сохраняет её и соответствует достоинству повествования.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Типичная древнееврейская формула введения речи естественно передаётся в современном русском пунктуацией, без тяжеловесного «сказав».
- source_word: כֹּה תֹאמְרוּן
  choice: Так скажите
  rationale: Передаёт формулу точного поручения в естественной русской повелительной конструкции.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: моему господину Исаву
  rationale: «Господин» здесь является почтительным общественным титулом, а имя «Исав» стоит при нём в приложении.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет стандартную формулу посланнической речи; настоящее время естественно вводит передаваемое сообщение.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: В данном дипломатическом обращении это почтительное самонаименование, не обязательно обозначающее буквальное рабство.
- source_word: גַּרְתִּי
  choice: я жил ... как пришелец
  rationale: Глагол גור обозначает проживание в качестве чужеземца или временного поселенца; развёрнутая формулировка ясна современному читателю и сохраняет эту смысловую окраску.
- source_word: וָאֵחַר
  choice: и оставался там
  rationale: В контексте глагол указывает на продолжительное пребывание до настоящего момента; «там» естественно восполняет подразумеваемое место по-русски.
- source_word: עַד עָתָּה
  choice: доныне
  rationale: Краткий литературный эквивалент временного выражения «до настоящего времени».
