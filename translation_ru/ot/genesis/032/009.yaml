lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Стандартная повествовательная форма от אמר; в современном русском союз обычно не требуется.
- source_word: אִם
  choice: если
  rationale: Сохраняет условный характер рассуждения Иакова, не превращая возможность в уверенность.
- source_word: יָבֹא
  choice: подойдёт
  rationale: Передаёт основное значение בוא — приближение или приход; враждебное действие выражено следующим глаголом.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: к одному стану
  rationale: Речь идёт об одном из двух станов, на которые Иаков ранее разделил людей и имущество; предлог אֶל передан как «к».
- source_word: וְהִכָּהוּ
  choice: и разгромит его
  rationale: נכה означает «ударить, поразить»; применительно к стану естественное русское «разгромит» передаёт поражение всего стана, а местоимение относится к собирательному существительному «стан».
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: оставшийся стан
  rationale: Кратко и естественно передаёт то, что останется после нападения на первый стан.
- source_word: לִפְלֵיטָה
  choice: спасётся
  rationale: Именная конструкция буквально выражает состояние или возможность спасения; русская глагольная форма естественно передаёт предполагаемый результат.
