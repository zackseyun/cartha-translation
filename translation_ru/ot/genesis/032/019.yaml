base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: ru
  text: 'И скажи[a]: «Это дар от твоего слуги Иакова, посланный моему господину Исаву. И вот[b], он тоже идёт за нами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И скажешь».'
    reason: В еврейском тексте употреблена форма, которая в последовательности распоряжений имеет предписывающую силу.
  - marker: b
    text: 'Или: «он тоже позади нас».'
    reason: Еврейское выражение может обозначать как положение позади, так и движение следом.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И скажи
  rationale: Форма с waw продолжает ряд распоряжений Иакова; русский повелительный оборот естественно передаёт предписывающую силу.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: от твоего слуги Иакова
  rationale: В эллиптической именной конструкции принадлежность дара Иакову по-русски естественно выражается через «от»; формула «твой слуга» сохраняет подчёркнутую почтительность перед Исавом.
- source_word: מִנְחָה
  choice: дар
  rationale: В данном повествовательном контексте слово обозначает примирительный дар, а не культовое приношение; «дар» звучит современно и достойно.
- source_word: שְׁלוּחָה
  choice: посланный
  rationale: Пассивное причастие женского рода характеризует מִנְחָה как уже отправленный дар; русское причастие сохраняет пассивное значение.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: моему господину Исаву
  rationale: «Господин» передаёт почтительный социальный титул, а имя «Исав» выступает приложением; в русском языке запятая здесь не требуется.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Частица привлекает внимание к следующему сообщению; «и вот» естественно для современного литературного повествования.
- source_word: גַּם הוּא
  choice: он сам
  rationale: В контексте подчёркивается, что вслед за дарами идёт и сам Иаков; «сам» естественно передаёт этот фокус, хотя буквально возможно «он также».
- source_word: אַחֲרֵינוּ
  choice: идёт за нами
  rationale: Фраза обозначает положение Иакова позади посланных стад и в контексте подразумевает движение; буквальное «находится позади нас» также возможно.
