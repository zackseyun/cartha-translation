  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: ru
  text: В ту ночь он встал, взял двух своих жён, двух своих служанок[a] и одиннадцать своих детей и перешёл через брод Иавока.
  philosophy: optimal-equivalence
