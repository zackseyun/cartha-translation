    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма от קום обозначает вставание; «встал» естественно звучит в современном русском повествовании.
- source_word: בַּלַּיְלָה הוּא
  choice: В ту ночь он
  rationale: Так естественно передаётся обстоятельство времени; местоимение הוא сохраняется как подлежащее «он», без избыточного усиления.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямое значение לקח; в контексте подразумевается, что он повёл семью с собой, но это не добавлено явно.
- source_word: שְׁתֵּי נָשָׁיו
  choice: двух своих жён
  rationale: В данном контексте נָשִׁים обозначает именно жён Иакова.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: двух своих служанок[a]
  rationale: שִׁפְחָה обозначает женщину зависимого домашнего статуса, служанку или рабыню. В основном тексте выбрано ясное современное «служанок», а более жёсткое обозначение статуса сохранено в сноске.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: одиннадцать своих детей
  rationale: יְלָדִים означает детей или потомков, а не исключительно сыновей; перевод не устраняет возможное контекстуальное напряжение.
- source_word: וַיַּעֲבֹר
  choice: перешёл
  rationale: В контексте движения עבר означает переход через водную преграду.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: перешёл Иавок вброд
  rationale: מַעֲבַר — место перехода, брод. Русская конструкция «перешёл Иавок вброд» естественно и точно передаёт действие и характер переправы.
- source_word: יַבֹּק
  choice: Иавок
  rationale: Традиционная и узнаваемая русская передача названия потока.
