  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: ru
  text: Когда он увидел, что не мог одолеть его[a], он коснулся его тазобедренного сустава[b][c], и тазобедренный сустав Иакова был вывихнут, когда он боролся с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не мог взять над ним верх».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «впадины его бедра»; вероятно, имеется в виду тазобедренный сустав.'
    reason: lexical_alternative
  - marker: c
    text: Еврейские местоимения допускают неоднозначность; в этом стихе противник Иакова прямо не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Когда он увидел
  rationale: Последовательная форма с וַ продвигает повествование, а придаточное с «когда» естественно передаёт временную связь с последующим действием.
- source_word: לֹא יָכֹל לוֹ
  choice: не может одолеть его
  rationale: Сочетание יכל с ל выражает неспособность взять верх над противником; «одолеть» естественно для контекста борьбы и не превращает фразу в утверждение об абсолютном бессилии.
- source_word: וַיִּגַּע
  choice: коснулся
  rationale: Глагол נגע обычно означает прикосновение. Несмотря на сильное последствие, перевод сохраняет намеренно сдержанный глагол исходного текста.
- source_word: בְּכַף יְרֵכוֹ
  choice: сустава его бедра
  rationale: В данном контексте כף ירך обозначает область впадины или сустава у бедра. Выбранная формулировка понятна современному читателю; более буквальный образ отмечен в сноске.
- source_word: וַתֵּקַע
  choice: вывихнулся
  rationale: Здесь глагол передаёт смещение сустава из нормального положения; возвратная форма естественно выражает наступивший результат.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: сустав бедра Иакова
  rationale: Повторяется та же лексика, что и в предыдущей фразе, и сохраняется явное называние Иакова в еврейском тексте.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: когда он боролся с ним
  rationale: Инфинитивная конструкция обозначает одновременное действие. Русская формулировка сохраняет местоимения и не вводит в текст явного отождествления участников.
theological_decisions:
- issue: К кому относятся местоимения «он» и «его/ним» в рассказе о борьбе
  choice: Сохранить местоименную неоднозначность еврейского текста, не называя противника Иакова прямо.
  alternative: Прямо обозначить действующего как человека, ангела или Бога.
  rationale: 'В стихе участники не названы заново: их значение раскрывается по ходу более широкого повествования. Перевод не должен преждевременно устранять эту богословскую напряжённость.'
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены лаконичное «коснулся», повтор слова «сустав» и местоименная неоднозначность исходного текста.
