  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: ru
  text: У меня есть крупный скот, ослы, мелкий скот, рабы и рабыни[a]. Я послал сообщить моему господину, чтобы обрести благосклонность в твоих глазах».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги и служанки». Еврейские слова могут обозначать зависимых домашних слуг; в данном перечне имущества перевод «рабы и рабыни» яснее передаёт их положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: У меня есть
  rationale: Конструкция היה + ל выражает обладание; настоящее время естественно передаёт нынешнее состояние Иакова.
- source_word: שׁוֹר
  choice: крупный скот
  rationale: Слово обозначает животных крупного рогатого скота и здесь употреблено собирательно; такой перевод естественнее русского множественного «волы» и не сужает значение до рабочих кастратов.
- source_word: וַחֲמוֹר
  choice: ослы
  rationale: Собирательная категория имущества естественно передаётся русским множественным числом.
- source_word: צֹאן
  choice: мелкий скот
  rationale: Собирательное обозначение овец и коз; «мелкий скот» сохраняет объём понятия без необоснованного уточнения.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: рабы и рабыни
  rationale: В перечне имущества слова обозначают зависимых членов хозяйства; «рабы и рабыни» прямо сохраняет социальный статус и выраженное в еврейском различие по полу.
- source_word: וָאֶשְׁלְחָה
  choice: Я послал
  rationale: Последовательная прошедшая форма сообщает о уже совершённой отправке посланников; простое прошедшее время естественно по-русски.
- source_word: לְהַגִּיד לַאדֹנִי
  choice: сообщить об этом моему господину
  rationale: «Сообщить» естественно передаёт декларативный инфинитив; «об этом» восполняет понятный из контекста объект сообщения, а «господину» выражает почтительное обращение к Исаву, не божественный титул.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: чтобы обрести благосклонность в твоих глазах
  rationale: Сохранены целевое значение ל и образность устойчивого еврейского выражения; формулировка понятна в современном литературном русском.
theological_decisions:
- issue: Передача עֶבֶד / שִׁפְחָה в перечне хозяйственного имущества
  choice: рабы и рабыни
  alternative: слуги и служанки
  rationale: Контекст перечня собственности усиливает значение несвободного, зависимого статуса. Основной текст не должен смягчать эту социальную реальность; сноска сохраняет более широкую лексическую возможность.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Почтительное «мой господин» относится к Исаву. Сохранён образ «в твоих глазах», а категории скота переданы привычными русскими хозяйственными терминами.
