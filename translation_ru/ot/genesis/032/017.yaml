  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: ru
  text: 'Он передал каждое стадо отдельно своим слугам[a] и сказал своим слугам: «Идите впереди меня и оставляйте промежуток между одним стадом и другим[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал в руку своих слуг» — еврейское выражение, означающее передачу под чьё-либо управление или попечение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «между стадом и стадом». Повтор подчёркивает, что одно стадо должно было следовать отдельно от другого.'
    reason: source_clarity
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: передал своим слугам
  rationale: Буквально сказано «дал в руку своих слуг», но сочетание בְּיַד здесь означает передачу под чьё-либо управление или попечение. «Передал своим слугам» естественно выражает этот смысл по-русски.
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: עֶבֶד может обозначать как раба, так и слугу. Здесь в центре внимания поручение домашним слугам Иакова, а не их правовой статус.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: каждое стадо отдельно
  rationale: 'Повтор עֵדֶר עֵדֶר имеет распределительное значение: стада были разделены и поручены слугам по отдельности. Такая передача ясна и сохраняет акцент исходного текста.'
- source_word: עִבְרוּ לְפָנַי
  choice: идите впереди меня
  rationale: עבר буквально связано с прохождением или переходом, но в данном контексте слугам велено двигаться впереди Иакова; русский вариант не навязывает представления о конкретной переправе.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: оставляйте промежуток
  rationale: רֶוַח обозначает свободное пространство или интервал. В контексте движения нескольких стад «оставляйте промежуток» звучит естественно и передаёт продолжающееся распределение групп.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: между одним стадом и другим
  rationale: Русская распределительная конструкция естественно передаёт еврейское повторение и требование отделить каждую группу животных от следующей.
