lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Он взял их
  rationale: Прямо передаёт обычное повествовательное значение לקח; местоимение сохраняет связь с людьми, упомянутыми в предыдущем контексте.
- source_word: וַיַּעֲבִרֵם
  choice: переправил
  rationale: 'Форма породы hифиль имеет каузативный смысл: Иаков сделал так, чтобы они перешли водный поток. Русское «переправил» естественно выражает этот смысл.'
- source_word: הַנָּחַל
  choice: поток
  rationale: נחל может обозначать поток, русло или сезонный водоток. «Поток» понятно современному читателю и не уточняет без достаточных оснований, был ли водоток постоянным.
- source_word: וַיַּעֲבֵר
  choice: переправил
  rationale: Повторение того же русского глагола сохраняет повтор еврейского корня עבר и каузативное значение формы.
- source_word: אֲשֶׁר לוֹ
  choice: всё, что ему принадлежало
  rationale: Передаёт буквальную относительную конструкцию «то, что было у него/ему» естественным русским выражением и по контексту охватывает имущество Иакова.
