source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: ru
  text: 'И сказал он[a]: «Отпусти меня, потому что взошла заря[b]». Но тот сказал[c]: «Не отпущу тебя, пока ты не благословишь меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Освободи меня»; также возможно: «Отпусти меня прочь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что уже рассветает».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте говорящие в этом стихе прямо не названы; кто произносит каждую реплику, определяется из контекста.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Отпусти меня
  rationale: Повелительная форма שׁלח с суффиксом первого лица означает «отпусти/освободи меня»; в контексте борьбы «Отпусти меня» естественно и сохраняет связь с повторением того же корня далее.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: потому что взошла заря
  rationale: כִּי передаёт причину, а עָלָה הַשָּׁחַר буквально изображает зарю восходящей. Формулировка естественна для литературного русского языка и сохраняет образ оригинала.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Не отпущу тебя
  rationale: Отрицание с имперфектом выражает твёрдый отказ; повтор «отпусти — не отпущу» воспроизводит словесную связь еврейского текста.
- source_word: כִּי אִם
  choice: пока не
  rationale: В данном условно-ограничительном контексте русское «пока не» естественно выражает отказ отпустить до совершения требуемого действия; возможное более формальное соответствие — «если не».
- source_word: בֵּרַכְתָּנִי
  choice: ты не благословишь меня
  rationale: Перфект после כִּי אִם обозначает действие, исполнение которого является условием освобождения; русское будущее совершенного вида после «пока не» точно передаёт эту направленность.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: И сказал он ... Но тот сказал
  rationale: Первое וַיֹּאמֶר передано буквально, а «но» отмечает противопоставление ответной реплики. Указательное «тот» различает собеседников, не называя их и не разрешая их идентичность богословски.
theological_decisions:
- issue: Кто произносит каждую реплику
  choice: Не называть говорящих по имени или статусу; сохранить местоименные обозначения «он» и «тот».
  alternative: 'Явно указать: «человек», «Иаков», «ангел» или «Бог».'
  rationale: В еврейском стихе субъекты выражены лишь формами глагола третьего лица мужского рода. Имена или титулы пришлось бы вносить из окружающего повествования и тем самым снимать присущую тексту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Заря» сохраняет поэтический образ הַשָּׁחַר, а синтаксис остаётся ясным для обычного читателя. Все сноски отмечены в основном тексте.
