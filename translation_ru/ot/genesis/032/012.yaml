  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: ru
  text: 'Прошу, избавь меня от руки брата моего, от руки Исава, потому что я боюсь его: как бы он не пришёл и не поразил меня, мать вместе с детьми.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мать на детях»; это древнееврейский оборот о поражении матери вместе с её детьми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Прошу, избавь меня
  rationale: Повелительная форма породы hифиль от נצל с суффиксом 1-го лица означает избавление из опасности; частица נָא передана словом «прошу», сохраняющим почтительный и настойчивый тон мольбы.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён прозрачный древнееврейский образ руки как власти или силы; повтор оборота перед «Исавом» воспроизводит выразительное повторение оригинала.
- source_word: אָחִי
  choice: брата моего
  rationale: Сохраняет родственную связь и трагическое напряжение угрозы, исходящей от брата; постпозиция местоимения соответствует возвышенному молитвенному регистру.
- source_word: יָרֵא אָנֹכִי אֹתוֹ
  choice: я боюсь его
  rationale: Естественно передаёт нынешний страх Иакова, не ослабляя его признания.
- source_word: פֶּן יָבוֹא
  choice: как бы он не пришёл
  rationale: Оборот выражает опасение относительно возможного события и естественно звучит в современном литературном русском.
- source_word: וְהִכַּנִי
  choice: и не поразил меня
  rationale: נכה имеет широкое значение нанесения удара или поражения; «поразил» сохраняет силу угрозы, не уточняя без необходимости, идёт ли речь именно об убийстве.
- source_word: אֵם עַל בָּנִים
  choice: мать вместе с детьми
  rationale: Передаёт идиому о совместном поражении матери и детей, сохраняя её сжатый семейный образ; тире помогает избежать ложного понимания фразы как приложения к местоимению «меня».
theological_decisions:
- issue: Объём и синтаксическая связь выражения אֵם עַל בָּנִים
  choice: мать вместе с детьми
  alternative: мать с детьми; мать и детей
  rationale: Фраза описывает всеохватное нападение на семью. Перевод сохраняет образ оригинала и его некоторую синтаксическую резкость, не превращая текст в более конкретное утверждение об убийстве, чем допускает глагол נכה.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранены повтор «от руки» и конкретный образ семейного уничтожения; пунктуация проясняет, что «мать вместе с детьми» обозначает охват нападения, а не отождествляет Иакова с матерью.
