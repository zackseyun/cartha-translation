base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: ru
  text: 'И ещё скажите: «Вот, твой слуга Иаков идёт за нами». Ибо он сказал: «Я умилостивлю его[a] даром, который идёт впереди меня, а потом увижу его лицо. Может быть, он примет меня благосклонно[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умилостивлю его лицо». Глагол связан с языком искупления, но здесь означает, что Иаков надеется расположить к себе Исава даром.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднимет моё лицо» — еврейская идиома со значением «примет меня» или «окажет мне благосклонность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: И ещё скажите
  rationale: Форма обращена к нескольким слугам и продолжает данное им повеление; «ещё» передаёт גם.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная русская частица, привлекающая внимание без архаического оттенка.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: В дипломатически-почтительной речи Иакова это выражение подчёркивает подчинённость; «раб» здесь могло бы чрезмерно конкретизировать его правовое положение.
- source_word: אַחֲרֵינוּ
  choice: идёт за нами
  rationale: Передаёт положение Иакова позади посланников и согласуется с движением процессии.
- source_word: אֲכַפְּרָה פָנָיו
  choice: умилостивлю его
  rationale: В межличностном, не культовом контексте כפר означает попытку смягчить гнев Исава и добиться примирения. Русское выражение естественно передаёт смысл; буквальный образ лица пояснён в сноске.
- source_word: מִנְחָה
  choice: даром
  rationale: Речь о примирительном подарке Исаву; «приношение» могло бы создать неуместную культовую окраску, а «дань» — чрезмерно политическую.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: который идёт впереди меня
  rationale: Сохраняет значение причастия и пространственное движение дара перед Иаковом.
- source_word: אֶרְאֶה פָנָיו
  choice: увижу его лицо
  rationale: Буквальное выражение понятно по-русски и сохраняет повторяющийся в еврейском тексте мотив лица.
- source_word: אוּלַי
  choice: может быть
  rationale: Передаёт надежду вместе с сохраняющейся неопределённостью.
- source_word: יִשָּׂא פָנַי
  choice: примет меня благосклонно
  rationale: Передаёт значение еврейской идиомы — благосклонно принять или оказать расположение; буквальный образ сохранён в сноске.
theological_decisions:
- issue: Значение כפר в межличностном контексте
  choice: умилостивлю его
  alternative: совершу за него искупление / покрою его лицо
  rationale: Иаков намерен посредством дара смягчить гнев Исава, а не совершить культовый обряд. Перевод сохраняет идею примирительного воздействия, не внося в повествование жертвенно-богословский смысл.
- issue: Передача идиомы יִשָּׂא פָנַי
  choice: примет меня благосклонно
  alternative: поднимет моё лицо
  rationale: Буквальная калька неясна современному русскому читателю. Смысл благосклонного принятия вынесен в основной текст, а исходный образ лица отмечен в сноске, что также сохраняет связь с тройным повтором פָנִים.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Почтительная самохарактеристика Иакова сохранена как «твой слуга». Повтор образа лица частично удержан в основном тексте и полностью обозначен сносками; неясные для русского читателя еврейские идиомы переданы по смыслу.
