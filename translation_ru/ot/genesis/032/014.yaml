  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: ru
  text: 'И провёл он там ту ночь, а из того, что было у него в распоряжении,[a] взял дар для Исава, его брата:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из того, что пришло в его руку»; то есть из того, что было у него с собой или находилось в его распоряжении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן
  choice: переночевал
  rationale: Глагол לון означает остаться или провести ночь; «переночевал» естественно и точно передаёт это значение.
- source_word: שָׁם
  choice: там
  rationale: Прямой эквивалент еврейского наречия места.
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Сохраняет временное указание и указательное значение еврейского выражения.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Основное значение לקח; в контексте речь идёт о том, что Иаков выделил часть своего имущества.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: из того, что было у него под рукой
  rationale: Еврейская идиома буквально описывает то, что «пришло в его руку», то есть имелось в наличии или находилось в его распоряжении. Русская идиома передаёт смысл естественно; буквальный образ отмечен в сноске.
- source_word: מִנְחָה
  choice: дар
  rationale: В данном межличностном контексте слово обозначает подарок, предназначенный Исаву, а не культовое приношение. «Дар» сохраняет достоинство повествовательного регистра.
- source_word: לְעֵשָׂו אָחִיו
  choice: для Исава, своего брата
  rationale: Предлог לְ обозначает адресата; формулировка сохраняет имя и явно выраженное родство.
