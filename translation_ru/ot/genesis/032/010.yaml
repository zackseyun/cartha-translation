base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: ru
  text: 'И сказал Иаков: «Боже отца моего Авраама и Боже отца моего Исаака, Яхве, сказавший мне: „Возвратись в свою землю и к своей родне[a], и Я сделаю тебе добро[b]“»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к месту своего происхождения»; еврейское слово может обозначать родню, родную землю или место происхождения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение также можно передать: «буду хорошо поступать с тобой» или «окажу тебе благо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: И сказал Иаков
  rationale: Последовательная форма с וַ передвигает повествование вперёд; традиционный русский порядок слов сохраняет его плавное течение без излишнего уточнения временной связи.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: Боже отца моего Авраама и Боже отца моего Исаака
  rationale: В молитвенном обращении употреблён естественный русский звательный эквивалент «Боже»; обе параллельные конструкции сохранены.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, а не заменяющий его титул.
- source_word: הָאֹמֵר אֵלַי
  choice: сказавший мне
  rationale: Артиклированное причастие характеризует Яхве как Того, кто обратился к Иакову; русское причастие сохраняет форму и связь с прямым обращением.
- source_word: שׁוּב לְאַרְצְךָ
  choice: Возвратись в свою землю
  rationale: «Возвратись» передаёт повеление שוב и направление движения; «земля» сохраняет широкий географический и патриархальный смысл אֶרֶץ.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: и к своей родне
  rationale: מוֹלֶדֶת может обозначать родственную общность или место происхождения; здесь «родня» естественно передаёт семейно-родовой смысл, а неоднозначность отмечена в сноске.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: и Я сделаю тебе добро
  rationale: Так естественно по-русски передаётся благотворное действие Hiphil от יטב с עִם; перевод не создаёт ошибочного впечатления о совместном совершении добра.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому сохранено личное имя в распространённой научной транслитерации, без замены титулом.
- issue: Характер обещанного благодеяния
  choice: Я сделаю тебе добро
  alternative: Я буду хорошо поступать с тобой
  rationale: Формулировка сохраняет обещание Божьего благоволения, не конкретизируя его как исключительно материальное благополучие и не снимая широты еврейской идиомы.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксический параллелизм обращения сохранён; личное имя «Яхве» не заменено титулом. Конечная запятая показывает, что речь Иакова продолжается в следующем стихе.
