  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: ru
  text: 'Он приказал также второму, третьему и всем, кто шёл за стадами: «Так говорите Исаву, когда встретите его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: приказал
  rationale: Порода пиэль глагола צוה выражает распоряжение с обязательной силой; «приказал» точнее сохраняет её, чем более мягкое «наставил».
- source_word: גַּם אֶת הַשֵּׁנִי גַּם אֶת הַשְּׁלִישִׁי
  choice: также второму, третьему
  rationale: Субстантивированные порядковые числительные переданы без добавления отсутствующего в еврейском тексте слова «слуге»; повторение גם естественно свёрнуто в русском перечислении.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: всем, кто шёл за стадами
  rationale: Причастие обозначает всех сопровождавших последующие группы животных. «Стада» — естественное русское обозначение עדרים в данном контексте.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная еврейская формула введения речи передана естественным русским синтаксисом, без тяжеловесного «сказав».
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: Так говорите
  rationale: 'Буквально: «согласно этому слову говорите». В контексте это предписание повторить ранее заданную формулу; «так говорите» естественно и сохраняет директивную силу.'
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: когда встретите его
  rationale: מצא буквально может означать «найти», но при ожидаемой встрече с человеком русское «встретите» точнее передаёт контекст без изменения смысла.
