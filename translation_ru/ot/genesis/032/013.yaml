  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: ru
  text: 'Но Ты сказал: «Я непременно сделаю тебе добро и сделаю твоё потомство многочисленным, как морской песок, которого из-за множества не сосчитать».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «которое невозможно исчислить из-за его многочисленности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: Но Ты сказал
  rationale: Самостоятельное местоимение подчёркивает обращение к Богу, а союз в контексте молитвы выражает противопоставление нынешней опасности Божьему обещанию.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: Я непременно сделаю тебе добро
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает обещание; «непременно» передаёт эмфазу, не сужая смысл до материального благополучия.
- source_word: וְשַׂמְתִּי אֶת זַרְעֲךָ
  choice: и сделаю твоё потомство многочисленным
  rationale: Глагол שׂים здесь имеет результативное значение «сделаю», а собирательное זרע естественно передаётся словом «потомство». Слово «многочисленным» эксплицирует подразумеваемый результат, раскрытый последующим сравнением.
- source_word: כְּחוֹל הַיָּם
  choice: как морской песок
  rationale: Естественное современное русское соответствие образу «песка моря», сохраняющее сравнение.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: которого из-за множества не сосчитать
  rationale: Нифаль допускает значение невозможности подсчёта; מֵרֹב указывает причину — чрезвычайное множество.
