base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: ru
  text: Иаков продолжил свой путь, и встретили его ангелы Божьи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланники Бога». Еврейское слово может обозначать как ангелов, так и человеческих посланников; здесь контекст указывает на ангелов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: Иаков
  rationale: Начальный союз וְ естественно передан русским повествовательным присоединением без обязательного отдельного «и» перед подлежащим; связь с предыдущим рассказом сохраняется синтаксисом всего предложения.
- source_word: הָלַךְ לְ/דַרְכּוֹ
  choice: продолжил свой путь
  rationale: Еврейское сочетание буквально описывает, как Иаков пошёл своей дорогой; по-русски «продолжил свой путь» естественно выражает продолжение путешествия и избегает неуклюжего буквализма.
- source_word: וַ/יִּפְגְּעוּ ב֖/וֹ
  choice: и встретили его
  rationale: Глагол פגע с предлогом ב допускает значения «встретить», «повстречать», «натолкнуться». Нейтральное «встретили» не привносит ни враждебности, ни подчёркнутой случайности; порядок слов слегка сохраняет повествовательный акцент оригинала.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: ангелы Божьи
  rationale: Хотя מַלְאָךְ может означать и человеческого посланника, ближайший контекст с «станом Божьим» указывает на небесных существ. «Ангелы Божьи» естественно и точно передаёт конструкцию принадлежности.
theological_decisions:
- issue: Кого обозначает מַלְאֲכֵי אֱלֹהִים
  choice: небесные ангелы
  alternative: посланники Бога
  rationale: Само слово допускает оба значения, однако явление и последующее название места «стан Божий» в следующем стихе убедительно поддерживают сверхъестественный референт. Лексическая возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Инверсия «встретили его» сохраняет плавность повествования и лёгкий акцент исходного текста, оставаясь понятной современному читателю.
