base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: ru
  text: Иаков назвал то место Пениэл[a], потому что «я видел Бога лицом к лицу[b], и моя жизнь была спасена»[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Пениэл означает «лицо Бога»; это название связано с последующими словами Иакова: «Я видел Бога лицом к лицу».'
    reason: cultural_note
  - marker: b
    text: Слово «Бог» можно также понять шире — как «божественное существо», однако контекст скорее указывает на Бога.
    reason: alternative_reading
  - marker: c
    text: 'Также возможно: «душа моя была избавлена»; здесь «душа» означает жизнь или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב שֵׁם הַמָּקוֹם
  choice: И назвал Иаков то место
  rationale: Русское «назвал то место» естественно передаёт еврейскую формулу «нарёк имя места», не воспроизводя неестественную конструкцию буквально.
- source_word: פְּנִיאֵל
  choice: Пениэл
  rationale: Транслитерация отражает данную здесь форму топонима и сохраняет связь со словами «лицом» и «Бога».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Иаков дал месту это имя.
- source_word: רָאִיתִי אֱלֹהִים
  choice: Я видел Бога
  rationale: В контексте рассказа אֱלֹהִים естественнее всего относится к Богу, хотя лексически возможно более широкое понимание.
- source_word: פָּנִים אֶל פָּנִים
  choice: лицом к лицу
  rationale: Устойчивое русское выражение передаёт непосредственность встречи и сохраняет словесную связь с названием Пениэл.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: жизнь моя была сохранена
  rationale: נֶפֶשׁ здесь означает жизнь самого Иакова, а пассивная форма נצל указывает на её избавление или сохранение после встречи.
theological_decisions:
- issue: Значение אֱלֹהִים в словах Иакова
  choice: Бога
  alternative: божественное существо
  rationale: Непосредственный контекст и объяснение названия места поддерживают личное указание на Бога; альтернативная лексическая возможность отмечена, но не подменяет основной смысл.
- issue: Смысл сохранения נַפְשִׁי после встречи с Богом
  choice: жизнь моя была сохранена
  alternative: душа моя была избавлена
  rationale: Речь идёт прежде всего о том, что Иаков остался жив; перевод не вводит более позднее противопоставление души и тела.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён резкий переход от повествования в третьем лице к объяснению Иакова в первом лице без добавления отсутствующего в еврейском тексте «он сказал». Кавычки и двоеточие служат русской пунктуационной ясности.
