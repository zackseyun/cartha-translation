  to: Иаков назвал то место Пениэл[a], потому что «я видел Бога лицом к лицу[b], и моя жизнь была спасена»[c].
  rationale: Убрано необязательное и неестественное двоеточие после «потому что». Сохранён переход к первому лицу без добавления отсутствующих в оригинале слов «он сказал». «Моя жизнь была спасена» точнее передаёт мысль об избавлении и естественно звучит по-русски. Примечание о נֶפֶשׁ уточнено, чтобы не выдавать один из возможных русских вариантов за буквальный перевод.
