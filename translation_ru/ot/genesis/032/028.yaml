  text: 'И он сказал ему: «Как тебя зовут?» Тот ответил: «Иаков».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: И он сказал ему
  rationale: Форма с וַ־ последовательно продвигает повествование; глагол אמר передан обычным «сказал», а אֵלָיו — местоимением «ему».
- source_word: מַה שְּׁמֶךָ
  choice: Как тебя зовут?
  rationale: 'Буквально: «Каково твоё имя?» Выбран естественный современный русский вопрос, точно передающий смысл еврейской именной конструкции.'
- source_word: וַיֹּאמֶר
  choice: Тот ответил
  rationale: В контексте реплики глагол אמר выполняет функцию ответа. «Тот» ясно различает участников диалога и устраняет неестественную для русского последовательность одинаковых местоимений.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Устоявшаяся русская передача личного имени יַעֲקֹב.
