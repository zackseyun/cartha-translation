lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: Солнце взошло над ним
  rationale: Глагол זרח при подлежащем «солнце» естественно означает «взойти»; לוֹ передано как «над ним», сохраняя направленность образа без неестественного буквализма.
- source_word: כַּאֲשֶׁר עָבַר
  choice: когда он миновал
  rationale: כַּאֲשֶׁר обозначает временное соотношение, а עבר здесь естественно передаётся глаголом «миновать», поскольку объектом служит название места.
- source_word: פְּנוּאֵל
  choice: Пенуэл
  rationale: Транслитерация соответствует огласованной форме данного стиха и не унифицирует её с встречающейся в контексте формой «Пениэл».
- source_word: וְהוּא צֹלֵעַ
  choice: а он шёл, припадая
  rationale: Причастие צֹלֵעַ описывает продолжающееся состояние или действие — хромую походку. Русская конструкция звучит естественно и передаёт длительность.
- source_word: עַל יְרֵכוֹ
  choice: на бедро
  rationale: Сохранено יָרֵךְ «бедро» без замены на более узкое «тазобедренный сустав». Конструкция «припадая на бедро» позволяет отразить עַל, тогда как буквальное «хромал на бедре» по-русски неестественно.
