base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: ru
  text: 'Иаков спросил: «Назови, пожалуйста, своё имя». Тот ответил: «Почему же ты спрашиваешь о моём имени?» И там он благословил его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: Иаков спросил
  rationale: Сочетание «спросил и сказал» типично для древнееврейского повествования, но по-русски избыточно; глагол «спросил» естественно вводит следующую прямую речь и полностью передаёт смысл.
- source_word: הַגִּידָה נָּא שְׁמֶךָ
  choice: Назови, пожалуйста, своё имя
  rationale: Побудительная форма נגד означает «сообщить, открыть, сказать», а נָא смягчает просьбу. «Назови… своё имя» — естественная современная русская формулировка, сохраняющая прямое упоминание имени.
- source_word: לָמָּה זֶּה
  choice: Зачем же
  rationale: לָמָּה в данном контексте выражает вопрос о цели просьбы, а частица «же» естественно передаёт дополнительный оттенок זֶה без неуклюжей буквальности.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: ты спрашиваешь о моём имени
  rationale: Предложное сочетание с ל передано естественной русской конструкцией «спрашивать о чём-либо»; упоминание имени сохранено без толковательного расширения.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: И там он благословил его
  rationale: Глагол ברך прямо передан как «благословил», а שָׁם — как «там». Местоименная форма сохраняет невыраженный в еврейском тексте субъект.
theological_decisions:
- issue: Кем является собеседник Иакова, отказавшийся назвать своё имя
  choice: Сохранить неуточнённость посредством «тот» и последующего местоимения «он»
  alternative: Назвать его Богом, человеком или ангелом
  rationale: В самом стихе субъект прямо не назван. «Тот» делает смену говорящего ясной по-русски, но не разрешает богословскую неоднозначность за исходный текст.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Просьба звучит вежливо благодаря «пожалуйста», а частица «же» передаёт выразительность ответа без тяжёлого калькирования древнееврейской конструкции.
