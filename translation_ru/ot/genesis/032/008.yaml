  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: ru
  text: Иаков очень испугался и пришёл в смятение. Он разделил людей, которые были с ним, мелкий и крупный скот и верблюдов на два лагеря[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «на два отряда». Еврейское слово может обозначать как лагерь, так и организованную группу людей.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא יַעֲקֹב מְאֹד
  choice: Иаков очень испугался
  rationale: Глагол ירא обозначает страх, а מְאֹד усиливает его; сочетание «очень испугался» естественно передаёт оба элемента по-русски.
- source_word: וַיֵּצֶר לוֹ
  choice: и пришёл в смятение
  rationale: Идиома выражает внутреннюю тревогу, стеснение и тяжёлое душевное состояние. «Пришёл в смятение» сохраняет отдельный от страха оттенок и звучит естественно в литературном повествовании.
- source_word: וַיַּחַץ
  choice: Он разделил
  rationale: חצה означает делить или разделять; здесь речь о намеренном распределении сопровождавших Иакова людей и животных.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: людей, которые были с ним
  rationale: עָם здесь обозначает сопровождавших Иакова людей, а не народ в этническом смысле.
- source_word: הַצֹּאן
  choice: мелкий скот
  rationale: צֹאן — собирательное обозначение овец и коз; «мелкий скот» точно и кратко передаёт эту категорию.
- source_word: הַבָּקָר
  choice: крупный скот
  rationale: בָּקָר обозначает крупный рогатый скот; выбор сохраняет параллель с «мелким скотом».
- source_word: הַגְּמַלִּים
  choice: верблюдов
  rationale: Прямое соответствие значению גמלים.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: на два лагеря
  rationale: מַחֲנֶה может обозначать как лагерь, так и организованную группу. «Два лагеря» сохраняет основной повествовательный термин и его связь с ближайшим контекстом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным оттенком. Два предложения устраняют перегрузку длинной цепью союзов, не меняя последовательности действий. Сочетание «пришёл в смятение» сохраняет отличие душевного потрясения от уже названного страха.
