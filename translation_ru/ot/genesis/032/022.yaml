    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: отправились
  rationale: Форма от עבר описывает дальнейшее движение вперёд в повествовании. По-русски «отправились» естественно передаёт, что дары были посланы дальше, не создавая ненужного впечатления о переходе через реку или границу.
- source_word: הַמִּנְחָה
  choice: дары
  rationale: Здесь מִנְחָה обозначает не культовое приношение, а дар Иакова Исаву. Множественное «дары» естественно соотносится с несколькими группами скота, перечисленными в контексте, хотя еврейское слово имеет собирательное единственное число.
- source_word: עַל־פָּנָיו
  choice: вперёд него
  rationale: Идиома буквально означает «перед его лицом», а здесь указывает на движение впереди Иакова.
- source_word: וְהוּא
  choice: а сам он
  rationale: Отдельно выраженное местоимение создаёт контраст между дарами, ушедшими вперёд, и самим Иаковом, который остался.
- source_word: לָן
  choice: остался на ту ночь
  rationale: Глагол לון/לין означает ночевать или проводить ночь. Такое выражение современно и естественно по-русски.
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: מַחֲנֶה означает лагерь или стан. «Стан» сохраняет достоинство библейского повествования и здесь остаётся понятным современному читателю.
