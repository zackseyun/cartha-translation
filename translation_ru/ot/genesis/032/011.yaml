base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: ru
  text: Я недостоин[a] всех милостей и всей верности, которые Ты явил рабу Твоему, ведь с моим посохом я перешёл этот Иордан, а теперь у меня два стана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я мал по сравнению со всеми милостями и всей верностью» — еврейская идиома, выражающая смирение перед Божьей щедростью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Я недостоин
  rationale: Буквально глагол означает «я мал» или «я стал мал», но здесь это смиренное признание своей несоразмерности Божьим благодеяниям. «Я недостоин» естественно передаёт смысл идиомы по-русски.
- source_word: הַחֲסָדִים
  choice: всей милости
  rationale: חסד обозначает стойкую, деятельную и верную благосклонность. Русское «милость» сохраняет традиционную библейскую ёмкость; собирательное единственное число естественно передаёт множественные проявления этой милости.
- source_word: הָאֱמֶת
  choice: всей верности
  rationale: В паре с חסד слово אמת означает прежде всего надёжность и верность в отношениях, а не отвлечённую истину.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: которые Ты явил рабу Твоему
  rationale: 'Буквально: «которые Ты сделал с/для раба Твоего». Глагол «явил» естественно сочетается в русском языке с «милостью» и «верностью», не изменяя направленности Божьих действий к Иакову.'
- source_word: בְמַקְלִי
  choice: с одним посохом
  rationale: Буквально «с моим посохом». «С одним посохом» ясно выражает контекстуальный смысл — при первом переходе у Иакова не было нынешнего имущества и многочисленного дома; добавление «одним» делает естественной русскую фразу, не меняя её противопоставления.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: я перешёл этот Иордан
  rationale: Сохранено указательное «этот», подчёркивающее непосредственность слов Иакова.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: теперь у меня два стана
  rationale: 'Буквально: «я стал двумя станами». Русская формулировка естественно передаёт, что дом и имущество Иакова теперь образуют два стана, и сохраняет связь с ближайшим контекстом.'
theological_decisions:
- issue: Передача חסד и אמת в описании Божьего отношения к Иакову
  choice: «милость» и «верность»
  alternative: «неизменная любовь» и «верность»; «милости» и «истина»
  rationale: Эта пара описывает деятельную благосклонность Бога и Его надёжность в отношениях. Выбор разграничивает два понятия, не сводит אמת к отвлечённой истинности и не вводит в основной текст более узкое толкование слова חסד исключительно как заветного термина.
- issue: Смысл самоуничижения Иакова
  choice: «Я недостоин»
  alternative: «Я слишком мал»; «Я меньше всех…»
  rationale: Фраза выражает смирение перед щедростью Бога, а не утверждение о буквальном размере или социальном положении. При этом она не превращена в более сильное богословское заявление о полной нравственной недостойности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. «Стан» сохранён как понятный в контексте повествования термин, связывающий стих с разделением людей и имущества Иакова на две группы.
