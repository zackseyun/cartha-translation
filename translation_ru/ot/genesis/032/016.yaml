lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: кормящих верблюдиц
  rationale: Причастие מֵינִיקוֹת имеет форму женского рода и обозначает самок, кормящих детёнышей; в русском пол животного естественно выражается словом «верблюдицы».
- source_word: וּבְנֵיהֶם
  choice: с их верблюжатами
  rationale: Буквально — «и их дети/детёныши»; в контексте животных видовое название детёнышей звучит ясно и естественно. Предлог «с» по-русски идиоматично объединяет самок с находящимися при них детёнышами.
- source_word: פָּרוֹת
  choice: коров
  rationale: Существительное обозначает самок крупного рогатого скота; «коровы» — точный и общеупотребительный русский эквивалент.
- source_word: וּפָרִים
  choice: и десять быков
  rationale: פָרִים обозначает самцов крупного рогатого скота; «быки» сохраняет противопоставление коров и самцов.
- source_word: אֲתֹנֹת
  choice: ослиц
  rationale: Еврейское слово прямо обозначает ослиц; русская форма кратка, точна и естественна.
- source_word: וַעְיָרִם
  choice: и десять молодых ослов
  rationale: עַיִר может обозначать молодого осла или ослёнка, при этом форма мужского рода в данном перечне может противопоставлять их ослицам. Перевод сохраняет и вид животного, и указание на молодость, не превращая контекстуальное предположение о племенных самцах в бесспорный смысл.
