  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: ru
  text: Иаков послал перед собой вестников к своему брату Исаву, в землю Сеир, в область Эдома[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поле Эдома»; вероятно, это обозначение страны или территории Эдома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычная повествовательная форма прошедшего времени от שׁלח; «послал» точно и естественно передаёт действие без стилистического усиления.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: Слово может обозначать как ангелов, так и человеческих посланцев; здесь Иаков направляет людей к Исаву, поэтому контекст требует значения «вестники».
- source_word: לְפָנָיו
  choice: перед собой
  rationale: Буквально «перед его лицом»; в данном контексте выражение означает, что Иаков отправил вестников впереди себя.
- source_word: עֵשָׂו אָחִיו
  choice: к своему брату Исаву
  rationale: Естественный для современного русского порядок слов сохраняет имя и указание на родство.
- source_word: אַרְצָה שֵׂעִיר
  choice: в землю Сеир
  rationale: Направительный суффикс указывает на движение в сторону названной земли; существительное «земля» сохранено явно.
- source_word: שְׂדֵה אֱדֹם
  choice: в область Эдома
  rationale: Буквально «поле Эдома», но в сочетании с географическим названием выражение, вероятно, обозначает страну или территорию. «Область» естественно передаёт региональный смысл, а буквальный образ отмечен в сноске.
