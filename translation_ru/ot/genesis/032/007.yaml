  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: ru
  text: 'Посланники вернулись к Иакову[a] и сказали: «Мы пришли к твоему брату, к Исаву, и он тоже идёт тебе навстречу, а с ним — четыреста человек».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, что в данном контексте менее вероятно: «ангелы вернулись к Иакову». Еврейское слово מַלְאָכִים может означать и «посланников», и «ангелов», но здесь имеются в виду люди, которых Иаков послал к Исаву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: вернулись
  rationale: Форма wayyiqtol от שוב обозначает завершённое действие в повествовании; «вернулись» естественно передаёт возвращение ранее посланных людей.
- source_word: הַמַּלְאָכִים
  choice: посланники
  rationale: מַלְאָךְ может означать как человеческого посланника, так и ангела; непосредственный контекст указывает на людей, которых Иаков послал к Исаву.
- source_word: לֵאמֹר
  choice: и сказали
  rationale: Инфинитивная конструкция вводит прямую речь; по-русски здесь естественнее личная форма «и сказали».
- source_word: בָּאנוּ
  choice: мы ходили
  rationale: Глагол בוא буквально выражает прибытие или движение к месту, однако в отчёте вернувшихся посланников русское «мы ходили к» естественно охватывает состоявшееся посещение и не создаёт неверной пространственной перспективы.
- source_word: אָחִיךָ אֶל־עֵשָׂו
  choice: к твоему брату, к Исаву
  rationale: Повтор предлога и приложение сохранены, чтобы передать риторическое выделение родства и последующее уточнение имени.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: Он тоже идёт тебе навстречу
  rationale: Причастие передаёт продолжающееся движение, גם — добавочность, а לִקְרָאתְךָ нейтрально обозначает движение навстречу без уточнения мирных или враждебных намерений.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: и с ним четыреста человек
  rationale: Сохранены количество и сопровождение Исава; «человек» — обычная русская форма после числительного и в контексте обозначает группу мужчин.
theological_decisions:
- issue: Значение הַמַּלְאָכִים
  choice: В основном тексте — «посланники»
  alternative: «ангелы»
  rationale: Хотя слово допускает оба значения, здесь речь идёт о человеческих посланниках Иакова из предыдущего контекста; лексическая многозначность отмечена в сноске.
- issue: Характер встречи, выраженной לִקְרָאתְךָ
  choice: Нейтральное «идёт тебе навстречу»
  alternative: «идёт против тебя» или «идёт приветствовать тебя»
  rationale: Еврейская конструкция сама по себе не определяет намерение Исава; перевод не должен преждевременно разрешать повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным регистром. Синтаксис прямой речи сделан естественным для русского, при этом сохранены повтор «к твоему брату, к Исаву», добавочное «тоже» и неопределённость намерений Исава.
