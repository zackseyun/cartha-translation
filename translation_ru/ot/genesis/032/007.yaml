  to: 'Посланники вернулись к Иакову[a] и сказали: «Мы пришли к твоему брату, к Исаву, и он тоже идёт тебе навстречу, а с ним — четыреста человек».'
  rationale: 'Заменено «мы ходили» на «мы пришли» для прямой передачи בָּאנוּ. Остальные решения сохранены: повтор «к твоему брату, к Исаву» передаёт акцент и уточнение оригинала, «тоже идёт тебе навстречу» не предрешает характера встречи, а «четыреста человек» сохраняет численность и обозначение сопровождающей Исава мужской группы. Тире перед количественной группой служит лишь естественному русскому членению фразы и не меняет смысла.'
