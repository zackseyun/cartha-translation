base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: ru
  text: 'Тогда Иосиф сказал ему: «Вот его истолкование: три ветви — это три дня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: לוֹ
  choice: ему
  rationale: Сохраняется явно выраженное в еврейском тексте местоимение без подстановки референта «виночерпию».
- source_word: פִּתְרֹנוֹ
  choice: его истолкование
  rationale: Суффикс мужского рода относится к увиденному во сне; «истолкование» точно передаёт объяснение символического содержания.
- source_word: שְׁלֹשֶׁת
  choice: три … три
  rationale: Повтор числительного сохранён, поскольку он составляет основу поясняющего соответствия между образом и сроком.
- source_word: הַשָּׂרִגִים
  choice: ветви
  rationale: В контексте виноградной лозы слово обозначает её ветви или побеги; «ветви» — ясный и естественный русский эквивалент.
- source_word: יָמִים
  choice: дня
  rationale: Прямое обозначение единицы времени; форма родительного единственного числа требуется русским числительным «три».
- source_word: הֵם
  choice: — это
  rationale: Самостоятельное местоимение подчёркивает отождествление символа с его значением; русская конструкция «— это» естественно сохраняет эту пояснительную силу.
