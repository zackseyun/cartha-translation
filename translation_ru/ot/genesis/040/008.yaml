  source_fidelity: 'Основной перевод точно передаёт ход мысли еврейского текста: сон упомянут в единственном числе, отсутствие истолкователя выражено без добавления невозможности истолкования, а вопрос Иосифа сохраняет риторическую форму и множественное число «истолкования». Однако сноска a неточно обозначена как буквальная: חֲלוֹם חָלַמְנוּ означает «сон мы видели/снились» в форме однокоренного сочетания, но не содержит выражения «во сне».'
