  terminology: «Иосиф», «Бог» и «истолкования» употреблены уместно. «Истолкования» сохраняет множественное число פִּתְרֹנִים. Сноску b следует привести к альтернативе, отражающей порядок и риторическую форму исходной фразы, а не менять отношение принадлежности на «от Бога».
