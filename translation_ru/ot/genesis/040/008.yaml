  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: ru
  text: 'Они сказали ему: «Нам приснился сон[a], и некому его истолковать». Иосиф сказал им: «Не Богу ли принадлежат истолкования?[b] Расскажите мне, пожалуйста».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сон мы видели».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Разве не Богу принадлежат истолкования?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Нам приснился сон
  rationale: 'Еврейский текст буквально говорит: «сон мы видели во сне». По-русски естественная конструкция «нам приснился сон» передаёт однокоренное сочетание без ненужной тяжеловесности; единственное число сохранено.'
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: и некому его истолковать
  rationale: Активное причастие פֹתֵר обозначает того, кто истолковывает. Безличная русская конструкция естественно передаёт отсутствие доступного толкователя, не добавляя утверждения о принципиальной невозможности истолкования.
- source_word: הֲלוֹא
  choice: Не ... ли
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ. Русская конструкция «не ... ли» сохраняет эту функцию.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: Богу принадлежат истолкования
  rationale: Предлог לְ выражает принадлежность или источник. Формулировка сохраняет оба близких смысловых оттенка и не сводит фразу лишь к человеческой способности толковать.
- source_word: פִּתְרֹנִים
  choice: истолкования
  rationale: Существительное стоит во множественном числе и имеет обобщённый смысл; русский вариант сохраняет число и категориальное значение.
- source_word: סַפְּרוּ נָא לִי
  choice: Расскажите же мне
  rationale: Глагол означает «рассказать, поведать», а частица נָא смягчает побуждение. «Же» здесь передаёт приглашающий оттенок в контексте; объект в еврейском тексте не назван, поэтому он не добавлен и в переводе.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Использована устоявшаяся русская форма библейского имени.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים в словах Иосифа
  choice: Бог
  alternative: бог или боги
  rationale: В повествовательном контексте Иосиф говорит о Боге как источнике истолкований. Заглавная буква передаёт эту референцию, не добавляя конфессионального толкования.
- issue: Смысл принадлежности истолкований Богу
  choice: Не Богу ли принадлежат истолкования?
  alternative: Разве не от Бога истолкования?
  rationale: Основной вариант сохраняет грамматический образ принадлежности и риторическую форму исходного текста. Альтернатива яснее подчёркивает источник, но несколько сужает возможный смысл предлога לְ.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплики звучат естественно, но сохраняют риторический вопрос, множественное число «истолкования» и невыраженный объект последнего глагола.
