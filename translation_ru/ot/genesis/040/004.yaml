  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: ru
  text: Начальник стражи приставил Иосифа к ним[a], и он служил им. Некоторое время они оставались под стражей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначил Иосифа над ними». Еврейский глагол может обозначать назначение ответственным; Иосиф мог быть приставлен к узникам как для обслуживания, так и для надзора.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и были они дни под стражей» — древнееврейское выражение, означающее, что они оставались там некоторое время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: приставил
  rationale: Глагол פקד здесь обозначает назначение человека для исполнения определённой обязанности. «Приставил к ним» естественно передаёт связь Иосифа с заключёнными, не решая однозначно, был ли он лишь служителем или также надзирал за ними.
- source_word: שַׂר הַטַּבָּחִים
  choice: начальник стражи
  rationale: Буквально титул связан с «убивающими», однако в контексте Бытия обозначает высокопоставленного начальника царской охраны; «начальник стражи» ясно и уместно в современном русском.
- source_word: אֶת יוֹסֵף אִתָּם
  choice: к ним Иосифа
  rationale: Сочетание выражает назначение Иосифа находиться при этих узниках. Формулировка «приставил к ним» сохраняет возможный оттенок как обслуживания, так и порученного надзора.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: и тот прислуживал им
  rationale: שרת означает служить или обслуживать лично. «Прислуживал им» передаёт практическое обслуживание узников и не вносит культового значения слова «служил».
- source_word: וַיִּהְיוּ יָמִים
  choice: некоторое время
  rationale: Буквальное «были дни» является древнееврейским идиоматическим обозначением неопределённого промежутка времени.
- source_word: בְּמִשְׁמָר
  choice: под стражей
  rationale: מִשְׁמָר обозначает охраняемое заключение или содержание под стражей; выбранное выражение точно передаёт акцент на несвободе под охраной.
