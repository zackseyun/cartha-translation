  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: ru
  text: И разгневался фараон на двух своих придворных[a] — на главного виночерпия и на главного пекаря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царедворцев»; еврейское слово в некоторых контекстах может также означать «евнухов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: И разгневался
  rationale: Глагол קצף обозначает гнев; совершенный вид естественно передаёт последовательное событие еврейского повествования, не преувеличивая его интенсивность.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Устоявшаяся русская передача египетского царского титула.
- source_word: שְׁנֵי סָרִיסָיו
  choice: двух своих придворных
  rationale: סָרִיס может означать как евнуха, так и царедворца или придворного служащего. Контекст называет должности этих людей, но не требует утверждать, что они были евнухами.
- source_word: שַׂר הַמַּשְׁקִים
  choice: главного виночерпия
  rationale: Название начальника служителей, подававших напитки царю; «главный виночерпий» — ясный и традиционный русский эквивалент.
- source_word: שַׂר הָאֹפִים
  choice: главного пекаря
  rationale: Сочетание обозначает начальника пекарей; выбран естественный и точный русский должностной титул.
- source_word: עַל ... עַל ... וְעַל
  choice: на ... — на ... и на
  rationale: После глагола гнева עַל указывает на объект гнева. Повтор «на» сохраняет структуру источника, а тире ясно показывает, что две следующие должности уточняют, кто именно эти двое придворных.
