  text: וַ/יִּתֵּ֨ן אֹתָ֜/ם בְּ/מִשְׁמַ֗ר בֵּ֛ית שַׂ֥ר הַ/טַבָּחִ֖ים אֶל בֵּ֣ית הַ/סֹּ֑הַר מְק֕וֹם אֲשֶׁ֥ר יוֹסֵ֖ף אָס֥וּר שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: ru
  text: И он поместил их под стражу в доме начальника стражи[a] — в темнице[b], где был заключён Иосиф.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начальника палачей» или «начальника тех, кто закалывает». Здесь это название придворной должности, связанной с охраной и исполнением приговоров.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в дом заключения»; то есть в тюрьму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: он поместил их под стражу
  rationale: В контексте заключения נָתַן означает «поместить», а מִשְׁמָר — пребывание под охраной или стражей. Формулировка естественна по-русски и точно передаёт действие.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: в доме начальника стражи
  rationale: Контекст указывает на придворную должность начальника охраны; буквальное значение טַבָּחִים связано с теми, кто закалывает или приводит приговоры в исполнение, что отражено в примечании.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: в темнице
  rationale: Сочетание обозначает место заключения. «Темница» сохраняет достоинство библейского повествования и остаётся понятным современному читателю; тире передаёт пояснительное соотношение двух указаний места.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: где был заключён Иосиф
  rationale: אָסוּר буквально означает «связанный», а в данном контексте — находящийся в заключении. שָׁם естественно включено в русское «где».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным оттенком. «Темница» выбрана как понятное традиционное слово без архаической грамматики. Пояснительное тире делает цепочку еврейских предложных оборотов естественной по-русски, не устраняя их смысловой связи.
