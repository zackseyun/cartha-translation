  source_fidelity: 'Русский текст точно передаёт еврейскую конструкцию: «поместил их под стражу» соответствует וַיִּתֵּן אֹתָם בְּמִשְׁמָר; «в доме начальника стражи» адекватно передаёт בֵּית שַׂר הַטַּבָּחִים как функциональный титул; «в темнице» передаёт אֶל בֵּית הַסֹּהַר; заключительная относительная часть верно передаёт место, где содержался Иосиф. Пояснительное тире сохраняет отношение темницы к дому начальника стражи. Существенной утраты или богословской интерпретации нет.'
