  source_fidelity: Текст точно передаёт временной оборот בְּעוֹד שְׁלֹשֶׁת יָמִים, мрачный оборот о «поднятии головы» с мֵעָלֶיךָ, повешение עַל־עֵץ и последующее поедание плоти птицами. Формулировка «поднимет твою голову, сняв её с тебя» обоснованно раскрывает в русском языке страшную импликацию еврейского выражения, при этом сохраняет ключевой глагол и перекличку со ст. 13. «Повесит тебя на дереве» соответствует תלה и עץ; примечание корректно оставляет открытым характер деревянного сооружения.
