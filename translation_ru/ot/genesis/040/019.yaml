  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: ru
  text: Ещё три дня — и фараон поднимет твою голову, сняв её с тебя[a], повесит тебя на дереве[b], а птицы склюют с тебя плоть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимет твою голову с тебя». Это, вероятно, мрачная игра слов с тем же выражением, которое в стихе 13 употреблено в благоприятном смысле; здесь оно означает, что голову снимут с тела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на деревянном столбе». Буквально: «на дереве»; речь может идти о повешении либо выставлении тела на столбе.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Ещё три дня — и
  rationale: Естественно передаёт оставшийся трёхдневный срок и наступление события по его окончании.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: поднимет твою голову, сняв её с тебя
  rationale: Сохраняет ключевой глагол «поднимет» и словесную перекличку со стихом 13, а уточнение «сняв её с тебя» ясно передаёт мрачный смысл оборота מֵעָלֶיךָ.
- source_word: וְתָלָה אֹתְךָ עַל עֵץ
  choice: повесит тебя на дереве
  rationale: Передаёт обычное значение תלה и буквальный образ עֵץ, не исключая того, что речь могла идти о деревянном столбе.
- source_word: וְאָכַל הָעוֹף אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: птицы склюют с тебя плоть
  rationale: Собирательное הָעוֹף естественно передано множественным числом; «склюют» идиоматично для птиц, а «с тебя плоть» сохраняет телесную конкретность и значение повторного מֵעָלֶיךָ.
theological_decisions:
- issue: Передача казни и мрачной игры слов без смягчения пророчества
  choice: Сохранить глагол «поднимет» и одновременно пояснить отделение головы словами «сняв её с тебя».
  alternative: 'Передать прямо: «фараон обезглавит тебя и повесит твоё тело на столбе».'
  rationale: Прямое «обезглавит» ясно сообщает способ казни, но устраняет литературную перекличку с благоприятным истолкованием сна виночерпия. Выбранный вариант сохраняет и перекличку, и страшный смысл.
translation_notes:
  register: Современный литературный русский язык; повествование сдержанное и ясное, но жестокий образ исходного текста не смягчён. Намеренно сохранена словесная перекличка «поднимет твою голову».
