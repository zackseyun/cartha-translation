base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: ru
  text: 'И в одну ночь обоим — виночерпию и пекарю, состоявшим на службе у египетского царя и заключённым в темницу, — приснились сны: каждому свой сон, со своим истолкованием[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и приснились они оба сон». В еврейском тексте употреблена однокоренная конструкция, буквально «снились сны»; речь идёт о двух разных снах, по одному у каждого.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «каждому — свой сон, соответствующий истолкованию его сна». Еврейское выражение подчёркивает соответствие каждого сна его собственному истолкованию.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «виночерпию и пекарю египетского царя». Еврейское выражение обозначает их принадлежность к царской службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם
  choice: И приснились им обоим сны
  rationale: Еврейская однокоренная конструкция «снился сон» не переносится буквально, поскольку во множественном распределительном контексте это звучало бы по-русски тяжеловесно. Множественное «сны» ясно показывает, что каждый увидел собственный сон.
- source_word: אִישׁ חֲלֹמוֹ
  choice: каждому — свой сон
  rationale: Передаёт распределительное значение אִישׁ и принадлежность каждого сна одному из двух мужчин естественным современным русским языком.
- source_word: בְּלַיְלָה אֶחָד
  choice: в одну и ту же ночь
  rationale: Естественно выражает временное совпадение двух снов; буквально возможно «в одну ночь».
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: каждому сну — своё истолкование
  rationale: 'Сохраняет смысл соответствия: у каждого сна было особое, соответствующее ему истолкование. Синтаксис еврейской фразы допускает более буквальное отнесение к каждому человеку, что отмечено в сноске.'
- source_word: הַמַּשְׁקֶה
  choice: виночерпий
  rationale: Традиционный и точный русский термин для царского служителя, подававшего напитки; звание «главный» в данном стихе прямо не выражено.
- source_word: הָאֹפֶה
  choice: пекарь
  rationale: Прямой эквивалент обозначения служителя; «главный пекарь» не добавляется, поскольку соответствующее определение здесь отсутствует.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: египетского царя
  rationale: Русский родительный падеж кратко и естественно передаёт принадлежность или служебную связь с царём Египта, не уточняя её сверх текста.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: заключённые в темницу
  rationale: Передаёт состояние под стражей в месте заключения без неестественного буквального сочетания «связанные в доме темницы».
