  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: ru
  text: 'Но если ты вспомнишь обо мне, когда у тебя всё будет хорошо, то, пожалуйста, окажи мне милость: упомяни обо мне фараону и выведи меня из этого дома[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть из места заключения; в еврейском тексте буквально: «из этого дома».'
    reason: Уточняет контекстуальное значение слова בַּיִת, сохраняя в основном тексте буквальный образ.
lexical_decisions:
- source_word: כִּי אִם
  choice: Только
  rationale: В данном контексте сочетание вводит настойчивую просьбу Иосифа. «Только» естественно передаёт ограничительно-противительный оттенок, не превращая фразу в жёсткое условие.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: вспомни обо мне
  rationale: Глагол זכר означает «помнить, вспоминать», а אִתְּךָ здесь идиоматически усиливает мысль о том, чтобы виночерпий лично сохранил Иосифа в памяти. Буквальное «вспомни меня с собой» по-русски неясно.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: когда тебе будет хорошо
  rationale: Фраза указывает на будущее благополучие виночерпия после его восстановления в должности; перевод сохраняет временное значение и звучит естественно.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: и, пожалуйста, окажи мне милость
  rationale: נָא передано вежливым «пожалуйста», а חֶסֶד в этой личной просьбе обозначает благожелательность и милостивый поступок, без необходимости вводить формально-заветный смысл.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: упомяни обо мне фараону
  rationale: Порода Hiphil глагола זכר здесь означает довести дело Иосифа до сведения фараона. Эта формулировка точно и естественно выражает требуемое действие.
- source_word: וְהוֹצֵאתַנִי מִן הַבַּיִת הַזֶּה
  choice: и выведи меня из этого дома
  rationale: Каузативная форма יצא передана глаголом «выведи», а בַּיִת сохранено как «дом», без подмены более истолковывающим словом «темница».
