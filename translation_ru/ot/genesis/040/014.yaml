  verdict: revise
  source_fidelity: 'Начальное כִּי אִם вводит условительную просьбу («если/когда... то»), а не просто ограничительное «только». В нынешнем тексте условная связь ослаблена. Остальные основные соответствия верны: זכר передано естественно, חֶסֶד — уместно как «милость», Hiphil в «упомяни ... фараону» и «выведи» передан адекватно, а «дом» сохранён буквально.'
  naturalness: Текст в целом литературен, однако «когда тебе будет хорошо» звучит несколько расплывчато; «когда у тебя всё будет хорошо» естественнее. Конструкция с двоеточием возможна, но при ясной условной рамке лучше простое последовательное перечисление просьб.
  terminology: «Фараон» со строчной буквы нормативен как титул в данном контексте. «Милость» приемлема для חֶסֶד в личной просьбе, не навязывает специального богословского значения. «Дом» правильно оставлен в основном тексте; пояснение о месте заключения следует оставить в примечании.
