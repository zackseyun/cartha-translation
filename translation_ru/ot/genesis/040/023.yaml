  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: ru
  text: Но главный виночерпий не вспомнил об Иосифе, а забыл его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא
  choice: Но … не
  rationale: Союз связывает стих с исполнением истолкования Иосифа в предыдущем повествовании и одновременно вводит контраст; по-русски это естественно передаётся словом «но».
- source_word: זָכַר
  choice: вспомнил об
  rationale: Основное значение глагола — «помнить, вспоминать». В данном контексте речь идёт о том, что сановник не вспомнил об Иосифе и не вступился за него; перевод не добавляет подразумеваемое действие.
- source_word: שַׂר הַמַּשְׁקִים
  choice: главный виночерпий
  rationale: Это придворный титул высокопоставленного служителя, отвечавшего за напитки фараона. «Главный виночерпий» точно и привычно передаёт должность в русском библейском повествовании.
- source_word: אֶת יוֹסֵף
  choice: об Иосифе
  rationale: Показатель прямого дополнения отдельно не переводится; русское управление глагола «вспомнить» допускает естественную конструкцию «вспомнить об Иосифе».
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: а забыл его
  rationale: Глагол означает «забыть», а местоименный суффикс указывает на Иосифа. Союз «а» сохраняет присоединённое усилительное повторение без неестественного русского «но … но».
