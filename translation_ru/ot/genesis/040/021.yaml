  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: ru
  text: Он вернул главного виночерпия на прежнюю должность[a], и главный виночерпий подал чашу фараону[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вернул главного виночерпия к его служению виночерпия».'
