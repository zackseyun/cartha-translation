  - marker: b
    text: 'Буквально: «и дал чашу на ладонь фараона». Подразумеваемый по контексту деятель — главный виночерпий.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: восстановил
  rationale: Порода хифиль глагола שוב здесь означает возвращение человека к прежнему положению или обязанностям; «восстановил» естественно передаёт повторное назначение.
- source_word: שַׂר הַמַּשְׁקִים
  choice: главного виночерпия
  rationale: שַׂר обозначает начальника или главного придворного, а הַמַּשְׁקִים — служителей, подававших напитки; «главный виночерпий» — точное и принятое обозначение этой придворной должности.
- source_word: עַל מַשְׁקֵהוּ
  choice: в должности
  rationale: Буквально выражение указывает на возвращение к служению при подаче напитков. В русском контексте «в должности» ясно и естественно передаёт восстановление прежних обязанностей, а конкретный образ сохранён в сноске.
- source_word: וַיִּתֵּן
  choice: подал
  rationale: Хотя נתן обычно означает «дать» или «положить», в контексте служения виночерпия глагол «подал» естественно описывает вручение чаши фараону.
- source_word: הַכּוֹס
  choice: чашу
  rationale: Прямое соответствие конкретному существительному; винительный падеж обусловлен русским синтаксисом.
- source_word: עַל כַּף פַּרְעֹה
  choice: в руку фараона
  rationale: כַּף буквально означает «ладонь», однако сочетание описывает передачу предмета в руку; русский оборот сохраняет конкретность и звучит естественно.
theological_decisions:
- issue: Не названный прямо субъект וַיִּתֵּן во второй части стиха
  choice: «тот подал», то есть главный виночерпий
  alternative: «и он подал», с сохранением формальной местоименной неоднозначности
  rationale: В еврейском тексте субъект выражен только формой глагола, поэтому формально возможна неоднозначность при смене действующего лица. Однако действие подачи чаши фараону соответствует восстановленной обязанности виночерпия; русское «он» после подлежащего первой части почти неизбежно было бы отнесено к фараону и создало бы ложное впечатление, будто фараон подал чашу самому себе. Указательное местоимение «тот» делает контекстуально подразумеваемого деятеля понятным, а формальная особенность источника отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Слово «виночерпий» сохранено как традиционное и точное название придворной должности; более отвлечённое «в должности» обеспечивает естественность основного текста, а буквальная конкретика вынесена в сноску.
