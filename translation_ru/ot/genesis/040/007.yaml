  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: ru
  text: 'И он спросил придворных фараона, находившихся вместе с ним под стражей в доме его господина[a]: «Почему у вас сегодня такие печальные лица?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнухов фараона». Еврейское слово может обозначать как евнухов в буквальном смысле, так и царских придворных или должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: И он спросил
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» естественно сохраняет связь с предшествующим действием.
- source_word: סְרִיסֵי פַרְעֹה
  choice: придворных фараона
  rationale: סָרִיס может обозначать как евнуха, так и царского служащего; контекст подчёркивает придворное положение этих людей, а неоднозначность отмечена в сноске.
- source_word: אֲשֶׁר אִתּוֹ
  choice: находившихся вместе с ним
  rationale: Сохранена местоименная форма еврейского текста; из контекста ясно, что речь идёт об Иосифе.
- source_word: בְמִשְׁמַר בֵּית אֲדֹנָיו
  choice: под стражей в доме его господина
  rationale: Переданы и состояние заключения, и место — дом господина Иосифа; «господина» здесь естественно выражает отношение אָדוֹן к слуге.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная еврейская формула введения прямой речи в современном русском естественно передаётся синтаксически, без отдельного «говоря».
- source_word: מַדּוּעַ פְּנֵיכֶם רָעִים הַיּוֹם
  choice: Почему у вас сегодня такие печальные лица?
  rationale: Буквально «почему ваши лица сегодня плохи»; русское выражение естественно передаёт заметный печальный вид, сохраняя образ лица.
