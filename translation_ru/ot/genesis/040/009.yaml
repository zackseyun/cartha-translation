  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: ru
  text: 'Главный виночерпий рассказал Иосифу свой сон и сказал ему: «Мне снилось: вот передо мной виноградная лоза».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: рассказал
  rationale: Порода пиэль глагола ספר здесь означает «рассказывать, излагать»; «рассказал» естественно сочетается с прямым дополнением «сон».
- source_word: שַׂר הַמַּשְׁקִים
  choice: главный виночерпий
  rationale: Сочетание обозначает придворного начальника, отвечавшего за подачу напитков; «главный виночерпий» — точный и узнаваемый русский эквивалент.
- source_word: אֶת חֲלֹמוֹ
  choice: свой сон
  rationale: Суффикс 3-го лица мужского рода указывает на сон виночерпия; русское возвратное притяжательное местоимение естественно при совпадении обладателя с подлежащим.
- source_word: לְיוֹסֵף
  choice: Иосифу
  rationale: Предлог ל отмечает адресата; в русском это естественно передаётся дательным падежом.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал ему
  rationale: Местоименный объект לוֹ выражен в еврейском тексте и сохранён в переводе.
- source_word: בַּחֲלוֹמִי
  choice: Мне снилось
  rationale: Буквально «в моём сне»; идиоматическая русская формула «мне снилось» естественно вводит содержание сна и не меняет смысла.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица הִנֵּה привлекает внимание к внезапно предстающему образу; «вот» сохраняет эту живость без архаизации.
- source_word: גֶפֶן
  choice: виноградная лоза
  rationale: גֶפֶן обозначает виноградную лозу; полное русское сочетание ясно и не допускает ошибочного понимания общего слова «лоза».
- source_word: לְפָנַי
  choice: передо мной
  rationale: Это прямой и естественный эквивалент пространственного выражения «передо мною»; наличие лозы перед говорящим передано эллиптически после частицы «вот».
