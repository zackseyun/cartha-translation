  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: ru
  text: Утром Иосиф пришёл к ним и увидел их — и вот, они были расстроены[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подавлены», «мрачны» или «встревожены». Еврейское слово описывает заметно тяжёлое, угнетённое или тревожное состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: пришёл к ним
  rationale: Передаёт обычное повествовательное значение בוא и направление движения, выраженное אֲלֵיהֶם, без лишнего уточнения места.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Естественный современный русский эквивалент временного оборота; начальная позиция делает повествование плавным, не меняя смысла.
- source_word: וַיַּרְא אֹתָם
  choice: увидел их
  rationale: Прямо передаёт зрительное восприятие, не усиливая его до «всмотрелся» или «заметил».
- source_word: וְהִנָּם
  choice: и вот, они были
  rationale: «И вот» сохраняет указательно-презентативную функцию частицы הִנֵּה и обращает внимание на замеченное Иосифом состояние.
- source_word: זֹעֲפִים
  choice: расстроены
  rationale: Широко передаёт заметное эмоциональное неблагополучие узников, не сужая значение исключительно до гнева, печали или уныния.
