base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: ru
  text: После этих событий[a], виночерпий царя Египта и пекарь провинились перед своим господином, царём Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «И было после этих вещей»; также возможно: «После этого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Обычная еврейская формула перехода в повествовании. Такой перевод естественен по-русски и передаёт временную связь; более буквальный вариант отмечен в сноске.
- source_word: חָטְאוּ ... לַאֲדֹנֵיהֶם
  choice: провинились перед своим господином
  rationale: В данной конструкции חטא с ל обозначает проступок против лица. «Провинились перед» сохраняет нравственно-служебный смысл и естественно звучит в контексте царского двора, не утверждая точного характера неизвестного проступка.
- source_word: מַשְׁקֵה
  choice: виночерпий
  rationale: Существительное обозначает царского служителя, подававшего напитки. «Виночерпий» — устоявшееся и точное русское наименование этой придворной должности; звание начальника здесь прямо не выражено.
- source_word: הָאֹפֶה
  choice: пекарь
  rationale: Определённая субстантивированная форма означает «пекарь». Притяжательное местоимение не добавляется, поскольку его нет в исходном тексте.
- source_word: לַאֲדֹנֵיהֶם
  choice: перед своим господином
  rationale: אדון здесь обозначает человеческого властителя и хозяина двух придворных служителей. Единственное число «своим господином» согласуется с еврейской формой и последующим пояснением.
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: царём Египта
  rationale: Приложение поясняет, кто был их господином. Повтор титула и страны сохранён в соответствии с акцентом исходного текста.
theological_decisions:
- issue: Степень религиозной окраски глагола חטא
  choice: провинились перед
  alternative: согрешили против
  rationale: В придворном контексте речь идёт о проступке против царя, причём его характер не назван. Выбор не исключает нравственной вины, но и не навязывает исключительно богословское прочтение слова «согрешили».
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейско-историческим регистром. Слово «виночерпий» сохранено как точный традиционный термин, а синтаксис сделан естественным для современного читателя.
