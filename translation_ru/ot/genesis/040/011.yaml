  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: ru
  text: У меня в руке была чаша фараона; я взял виноград, выжал его в чашу фараона и вложил чашу в руку фараона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на ладонь фараона».'
