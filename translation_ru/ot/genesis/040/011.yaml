lexical_decisions:
- source_word: כּוֹס
  choice: чаша
  rationale: Обычное обозначение сосуда для питья; «чаша» естественно звучит в придворном контексте и сохраняет традиционную библейскую лексику без излишней архаизации.
- source_word: בְּיָדִי
  choice: у меня в руке
  rationale: Передаёт конкретный, зримый образ сна и естественно звучит по-русски.
- source_word: וָאֶקַּח
  choice: я взял
  rationale: Прямой и нейтральный эквивалент глагола לקח в последовательном повествовании.
- source_word: הָעֲנָבִים
  choice: виноград
  rationale: В русском языке собирательное «виноград» здесь естественнее буквального «виноградины» и точно обозначает плод.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: выжал его в чашу фараона
  rationale: Глагол שׂחט обозначает выжимание жидкости; формулировка ясно передаёт, что виноград выжимали непосредственно в чашу, не добавляя отсутствующего в тексте существительного «сок».
- source_word: וָאֶתֵּן
  choice: вложил
  rationale: В данном контексте נתן описывает не просто передачу, а помещение чаши в руку фараона; «вложил» естественно выражает это действие.
- source_word: עַל כַּף פַּרְעֹה
  choice: в руку фараона
  rationale: Буквально выражение означает «на ладонь фараона», но по-русски при передаче предмета естественно сказать «в руку»; буквальный образ отмечен в сноске.
