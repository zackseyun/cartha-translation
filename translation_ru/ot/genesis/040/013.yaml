lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Ещё через три дня
  rationale: Передаёт оставшийся промежуток времени и направленность к будущему событию.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: поднимет твою голову
  rationale: Сохраняет буквальный образ и литературную связь с противопоставленным употреблением того же оборота в стихе 19; положительный смысл проясняется следующим глаголом.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: вернёт тебя на твоё место
  rationale: כֵּן обозначает установленное место или должность; такой перевод естественен по-русски и не сужает значение исключительно до официального звания.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: будешь подавать чашу фараона ему в руку
  rationale: Передаёт конкретное придворное действие виночерпия; будущее значение русского оборота соответствует контексту еврейской перфектной формы после предсказания.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: как прежде
  rationale: Естественно передаёт прежний установленный порядок служения, не привнося юридического оттенка слова «устав».
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: когда служил у него виночерпием
  rationale: מַשְׁקֶה здесь обозначает придворную должность виночерпия; глагол «служил» делает синтаксическую связь ясной и естественной.
