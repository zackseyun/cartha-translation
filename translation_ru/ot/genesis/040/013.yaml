  source_fidelity: 'Основной смысл передан верно: срок, сохранённый буквальный идиоматический образ «поднимет твою голову», восстановление в должности и возвращение к обязанностям виночерпия. Однако в конце исходный русский синтаксис («будешь... когда служил») неудачно смешивает будущее предсказание с прошедшим временем и ослабляет связь «как прежде» с прежним порядком службы.'
