  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
translation:
  language: ru
  text: И на лозе было три ветви[a]. Она уже пускала почки, показался её цвет, и на её гроздьях созрел виноград.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «три побега»; возможен также перевод: «три усика».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: На лозе
  rationale: 'Предлог ב с определённым артиклем здесь естественно передаётся как «на»: ветви находятся и растут на лозе; начальный союз в русском можно не выражать, поскольку стих продолжает описание сна.'
- source_word: שָׂרִיגִם
  choice: ветви
  rationale: Слово обозначает побеги или ветви виноградной лозы. «Ветви» — наиболее понятный и нейтральный вариант; возможные уточнения сохранены в сноске.
- source_word: כְפֹרַחַת
  choice: словно расцвела
  rationale: Конструкция с כ и причастием передаёт зрительно воспринимаемое быстрое развитие лозы. «Словно расцвела» сохраняет образ сновидения и не превращает כ однозначно во временной союз.
- source_word: עָלְתָה נִצָּהּ
  choice: появились бутоны
  rationale: Буквально говорится, что её цветочная почка или цвет вышли, появились. Русское множественное число естественно передаёт собирательный образ роста на лозе.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: её гроздья созрели в виноград
  rationale: 'Глагол в породе hифиль выражает достижение зрелости, а «виноград» выступает результатом: гроздья стали зрелыми гроздьями винограда. Формулировка сохраняет стремительную последовательность стадий.'
