  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: ru
  text: А в верхней корзине была всевозможная еда для фараона, приготовленная пекарем[a]; птицы ели её из корзины над моей головой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «работа пекаря»; то есть изделия или выпечка, приготовленные пекарем для фараона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: а в верхней корзине
  rationale: «Верхняя корзина» естественно передаёт пространственное значение עֶלְיוֹן и связь с предыдущим описанием сна.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: всякая пища для фараона
  rationale: מִכֹּל с собирательным מַאֲכַל указывает на разнообразие пищи; «для фараона» сохраняет возможное значение принадлежности или предназначения.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: работа пекаря
  rationale: Буквальная формулировка сохраняет конструкцию еврейского текста и его некоторую неоднозначность; вероятный предметный смысл пояснён в сноске.
- source_word: וְהָעוֹף
  choice: и птицы
  rationale: עוֹף употреблено собирательно; русское множественное число естественно в данном контексте.
- source_word: אֹכֵל
  choice: клевали
  rationale: Причастие изображает продолжающееся действие, а «клевали» — естественный русский глагол о птицах, поедающих пищу.
- source_word: אֹתָם
  choice: её
  rationale: Хотя еврейский суффикс имеет форму множественного числа и отсылает к пищевым изделиям, в русском согласование с собирательным словом «пища» требует единственного числа.
- source_word: מִן הַסַּל
  choice: из корзины
  rationale: מן обозначает источник; «из корзины» идиоматично описывает, откуда птицы брали пищу.
- source_word: מֵעַל רֹאשִׁי
  choice: над моей головой
  rationale: Передаёт положение корзины выше головы, не утверждая прямо, что она соприкасалась с головой.
