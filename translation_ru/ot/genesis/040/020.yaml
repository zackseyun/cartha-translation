base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: ru
  text: На третий день, в день рождения фараона, он устроил пир для всех своих слуг и среди них поднял голову начальника виночерпиев и голову начальника пекарей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с передачей смысла: «выделил» или «обратил внимание на». Буквально по-еврейски: «поднял голову»; этот образ сохранён, поскольку в рассказе он обыгрывается применительно к двум придворным, которых ожидают разные участи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Последовательная повествовательная форма וַיְהִי естественно передаётся по-русски самим переходом к следующему событию, без буквального «и было»; временное выражение сохранено прямо.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: в день рождения фараона
  rationale: Естественная современная передача оборота со значением дня рождения фараона.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: он устроил пир
  rationale: מִשְׁתֶּה обозначает пир или праздничное застолье, часто с вином; «устроил пир» естественно передаёт сочетание глагола и существительного.
- source_word: לְכָל עֲבָדָיו
  choice: для всех своих слуг
  rationale: עֲבָדִים в придворном контексте охватывает царских слуг и служащих; нейтральное «слуги» не навязывает более узкого значения «рабы» или «сановники».
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: поднял голову
  rationale: Буквальный образ сохранён ради намеренной словесной игры с разными исходами для двух придворных в ближайшем контексте; смысл идиомы пояснён в сноске.
- source_word: שַׂר הַמַּשְׁקִים
  choice: начальника виночерпиев
  rationale: Придворный титул обозначает руководителя служивших при напитках; традиционное «виночерпии» точно и уместно в dignified литературном регистре.
- source_word: שַׂר הָאֹפִים
  choice: начальника пекарей
  rationale: Прямая и естественная передача параллельного придворного титула.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: среди них
  rationale: Местоимение естественно отсылает к уже названным слугам и передаёт публичный характер действия в их кругу без тяжеловесного повтора.
