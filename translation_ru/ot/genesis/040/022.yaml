lexical_decisions:
- source_word: וְאֵת
  choice: А
  rationale: Союз וְ в контексте противопоставляет участь начальника пекарей восстановлению в должности начальника виночерпиев в предыдущем стихе; русский союз «а» естественно передаёт этот контраст. Показатель прямого дополнения אֵת отдельно не переводится.
- source_word: שַׂר הָאֹפִים
  choice: начальника пекарей
  rationale: שַׂר обозначает главу или придворного чиновника; «начальник пекарей» точно и естественно передаёт должность.
- source_word: תָּלָה
  choice: повесил
  rationale: Основное значение глагола — «вешать». Перевод сохраняет лексическую широту исходного слова и не уточняет без достаточных оснований, шла ли речь о казни через повешение, посажении на кол или выставлении тела после смерти.
- source_word: כַּאֲשֶׁר
  choice: как и
  rationale: Оборот выражает точное соответствие события данному ранее истолкованию; «как и» звучит естественно и подчёркивает исполнение.
- source_word: פָּתַר
  choice: истолковал
  rationale: В контексте снов глагол означает «истолковать»; совершенный вид по-русски естественно указывает на предшествующее истолкование.
- source_word: לָהֶם
  choice: им
  rationale: Местоимение во множественном числе относится к обоим придворным и сохраняет число еврейского текста.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общепринятая русская форма имени יוֹסֵף.
