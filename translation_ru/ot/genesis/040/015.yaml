id: GEN.40.15
reference: Genesis 40:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: ru
  text: Ведь меня похитили из земли евреев[a], да и здесь я не сделал ничего, за что меня бросили в темницу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо я был непременно украден»; сочетание абсолютного инфинитива с личной формой глагола усиливает высказывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в яму». В данном контексте это слово означает темницу или тюремное подземелье.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с просьбой Иосифа вспомнить о нём.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: меня похитили
  rationale: Для похищения человека по-русски естественно «похитили»; усилительная конструкция с абсолютным инфинитивом отмечена в сноске.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: из земли евреев
  rationale: Сохраняет этническое обозначение и не превращает выражение в точное политико-географическое название.
- source_word: וְגַם פֹּה
  choice: да и здесь
  rationale: 'Естественно передаёт добавочное усиление: Иосиф утверждает свою невиновность также и в Египте.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: я не сделал ничего
  rationale: Прямо и естественно передаёт категорическое отрицание.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: за что меня бросили
  rationale: В данном контексте כִּי связывает отсутствие проступка с заключением; «за что» естественно выражает отсутствие основания для наказания, не утверждая отдельной цели действия.
- source_word: בַּבּוֹר
  choice: в темницу
  rationale: Буквально בּוֹר означает «яма», но здесь обозначает место заключения; «темница» ясно передаёт контекст, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Характер заявления Иосифа о невиновности
  choice: Сохранено абсолютное утверждение «не сделал ничего» применительно к причине заключения.
  alternative: Смягчить до «не сделал ничего дурного».
  rationale: Еврейский текст буквально отрицает совершение чего-либо, что могло бы послужить основанием для помещения в темницу; добавление «дурного» допустимо по смыслу, но отсутствует в форме исходного текста.
translation_notes:
  register: Современный литературный русский язык; речь естественная и достойная. «Темница» слегка возвышенно, но общеупотребительно в библейском повествовании и ясно обозначает место заключения.
