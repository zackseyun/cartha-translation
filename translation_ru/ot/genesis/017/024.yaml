lexical_decisions:
- source_word: וְאַבְרָהָם
  choice: Аврааму
  rationale: Соединительный ו продолжает повествование и в русском не требует обязательного отдельного «и»; дательный с безличной конструкцией естественно вводит указание возраста.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: было девяносто девять лет
  rationale: Еврейская идиома буквально означает «сын девяноста девяти лет»; современная русская возрастная формула точно передаёт её смысл.
- source_word: בְּהִמֹּלוֹ
  choice: когда была обрезана
  rationale: Предлог ב с инфинитивом и местоименным суффиксом выражает время действия; пассивная конструкция сохраняет форму исходного выражения.
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: плоть его крайней плоти
  rationale: Сохранено конкретное и намеренно полное телесное обозначение исходного текста, а не сокращённое «когда он был обрезан».
