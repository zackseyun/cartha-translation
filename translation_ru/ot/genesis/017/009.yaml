  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: ru
  text: 'И сказал Бог Аврааму: «Ты же соблюдай Мой завет — ты и твои потомки[a] из поколения в поколение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоё семя»; в еврейском тексте стоит собирательное существительное в единственном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с последовательным waw продолжает повествование; традиционная и естественная русская формула «И сказал» сохраняет связь с предыдущим контекстом.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Прямое соответствие еврейскому слову в данном контексте.
- source_word: וְאַתָּה
  choice: Ты же
  rationale: Вынесенное личное местоимение подчёркивает переход от Божьих обещаний к обязанности Авраама; частица «же» естественно передаёт этот контрастно-тематический акцент.
- source_word: אֶת־בְּרִיתִי תִשְׁמֹר
  choice: соблюдай Мой завет
  rationale: Глагол שׁמר в контексте завета означает хранить, соблюдать или исполнять. «Соблюдай» ясно выражает обязанность и сохраняет заветную терминологию без лишнего толкования.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: ты и твои потомки
  rationale: זֶרַע — грамматически единственное собирательное существительное «семя», обозначающее здесь потомство. «Потомки» — наиболее понятное и естественное современное русское обозначение людей последующих поколений.
- source_word: אַחֲרֶיךָ
  choice: после тебя
  rationale: Прямо передаёт преемственность потомства вслед за Авраамом.
- source_word: לְדֹרֹתָם
  choice: во все их поколения
  rationale: Передаёт продолжительность обязательства в череде поколений; оборот понятен и сохраняет присутствующее в оригинале местоименное указание на поколения потомков.
theological_decisions:
- issue: Характер обязанности Авраама и его потомства по отношению к завету
  choice: соблюдай Мой завет
  alternative: храни Мой завет
  rationale: «Соблюдай» передаёт обязательную силу תִשְׁמֹר в контексте завета, не добавляя специфического юридического или конфессионального смысла.
- issue: Передача собирательного זֶרַע
  choice: твои потомки
  alternative: твоё семя
  rationale: Контекст включает последующие поколения, поэтому «потомки» ясно передаёт собирательное значение. Формулировка не решает за читателя возможные богословские вопросы, возникающие из употребления единственного собирательного существительного в других местах.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Прописная буква в «Мой» употреблена как нормативно допустимое благоговейное написание местоимения, относящегося к Богу. Тире отделяет повторное поясняющее подлежащее и делает синтаксис естественным для русского языка.
