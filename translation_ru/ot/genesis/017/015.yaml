base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: ru
  text: 'И сказал Бог Аврааму: «Что до Сарай, твоей жены, не называй её Сарай, потому что её имя — Сара».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Больше не называй её Сарай; её имя будет Сара».'
    reason: 'Лексико-синтаксический вариант: он делает явными прекращение прежнего именования и установление нового имени, подразумеваемые формулой переименования.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вайиктоль с וַ продвигает повествование. Русское «И сказал» естественно продолжает последовательность событий и сохраняет библейскую торжественность без архаизации.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте форма обозначает единого Бога и требует обычного русского соответствия в единственном числе.
- source_word: שָׂרַי
  choice: Сара / Сарой
  rationale: Традиционная русская передача прежнего имени שָׂרַי — «Сара»; падежные формы необходимы по нормам русского языка. Отличие от нового имени «Сарра» сохранено.
- source_word: אִשְׁתְּךָ
  choice: жену твою
  rationale: Точно передаёт существительное с притяжательным суффиксом. Постпозиция «твою» поддерживает достойный библейский регистр, оставаясь понятной современному читателю.
- source_word: לֹא תִקְרָא
  choice: не называй
  rationale: Отрицание с имперфектом в прямой Божьей речи имеет силу запрета. Русский повелительный оборот выражает её ясно и естественно.
- source_word: אֶת שְׁמָהּ שָׂרָי
  choice: не называй Сарой
  rationale: Русская конструкция «называть кем» естественно передаёт еврейскую формулу «называть её имя Сара», не утрачивая самого акта переименования.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета и здесь естественно передаётся причинным «потому что».
- source_word: שָׂרָה שְׁמָהּ
  choice: имя её — Сарра
  rationale: Именное предложение сохранено без добавления будущего времени. Порядок слов подчёркивает имя и передаёт торжественное объявление.
theological_decisions:
- issue: Формула переименования
  choice: «не называй Сарой, потому что имя её — Сарра»
  alternative: «больше не называй её Сарой; отныне её имя — Сарра»
  rationale: Основной текст сохраняет прямой запрет и безглагольное объявление нового имени, не добавляя отсутствующих в еврейском тексте слов «больше», «отныне» или явного будущего времени.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Традиционные русские формы имён «Сара» и «Сарра» позволяют сохранить существенное для стиха различие прежнего и нового имени. Архаичные формы и конфессионально специфическая терминология не используются.
