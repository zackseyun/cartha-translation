  source_fidelity: 'Смысловая структура стиха в основном передана верно: Бог обращается к Аврааму, запрещает прежнее именование и объявляет новое имя. Однако в русском тексте нарушено ключевое различие еврейских имён שָׂרַי (Sarai) и שָׂרָה (Sarah): «Сара» и «Сарра» — неудачная и нестандартная пара для передачи именно различия исходных форм. Кроме того, первый оборот «Сару, жену твою» в сочетании с последующим «не называй Сарой» допускает неверное прочтение, будто запрещено называть её новым именем.'
