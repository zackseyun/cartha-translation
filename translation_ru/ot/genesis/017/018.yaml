  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: ru
  text: 'И сказал Авраам Богу: «О, если бы Измаил жил перед Тобой!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О, пусть Измаил живёт в Твоём присутствии!»; возможно также: «под Твоим благоволением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционная и естественная русская формула «И сказал» сохраняет связь с предыдущим контекстом.
- source_word: אֶל הָאֱלֹהִים
  choice: Богу
  rationale: Предлог אֶל при глаголе речи указывает адресата; определённое הָאֱלֹהִים в данном контексте естественно передаётся по-русски как «Богу».
- source_word: לוּ
  choice: О, если бы
  rationale: Частица вводит пожелание, а не условие; «О, если бы» передаёт оптативное значение и эмоциональность реплики.
- source_word: יִשְׁמָעֵאל
  choice: Измаил
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: יִחְיֶה
  choice: жил
  rationale: Имперфект после частицы пожелания выражает желаемое продолжение жизни или благополучное существование; форма «жил» естественна в русской конструкции «если бы».
- source_word: לְפָנֶיךָ
  choice: пред Тобою
  rationale: Буквально — «перед Твоим лицом / в Твоём присутствии». Краткое «пред Тобою» сохраняет пространственно-реляционную и возможную благоволительную окраску, не сводя выражение к одному толкованию.
theological_decisions:
- issue: Смысл пожелания Авраама о положении Измаила перед Богом
  choice: пред Тобою
  alternative: в Твоём присутствии; под Твоим благоволением
  rationale: Еврейское выражение может подразумевать жизнь в Божьем присутствии и благоволении, но не раскрывает здесь точного богословского содержания. Буквально близкая формулировка сохраняет эту неоднозначность и напряжение контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Форма «пред Тобою» понятна современному читателю и позволяет сохранить лаконичность и смысловую открытость оригинала; прописная буква в местоимении следует принятому русскому благоговейному оформлению обращения к Богу.
