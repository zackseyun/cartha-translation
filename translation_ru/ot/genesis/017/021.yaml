  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: ru
  text: Но Мой завет Я установлю с Исааком[a], которого Сарра родит тебе в это назначенное время в следующем году.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Мой завет Я установлю с Исааком». Еврейский союз можно передать просто как «и», но контекст указывает на противопоставление обещанию об Измаиле в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Но
  rationale: Союз וְ сам по себе обычно означает «и», однако здесь на фоне обещания об Измаиле в предыдущем стихе выражает смысловое противопоставление; это отражено словом «но».
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: בְּרִית в контексте Бытия обозначает завет; суффикс первого лица передан притяжательным местоимением «Мой».
- source_word: אָקִים
  choice: установлю
  rationale: Порода hifil глагола קום здесь означает твёрдо учредить, установить завет. «Установлю» естественно и сохраняет формальный заветный смысл.
- source_word: אֶת יִצְחָק
  choice: с Исааком
  rationale: Хотя אֶת формально маркирует прямое дополнение, в русском языке завет естественно устанавливают «с» его участником.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: которого Сарра родит тебе
  rationale: Относительное предложение определяет Исаака как обещанного сына; «тебе» сохраняет значение לְךָ.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: в это же время в следующем году
  rationale: מוֹעֵד указывает на определённое, назначенное время, а сочетание со «следующим годом» по-русски естественно передаётся выражением «в это же время в следующем году».
theological_decisions:
- issue: Завет устанавливается с Исааком, а не с Измаилом
  choice: Стих прямо говорит, что Бог установит Свой завет с Исааком.
  alternative: Понять обещание об Исааке как не исключающее Измаила из той же заветной линии.
  rationale: Перевод сохраняет противопоставление предыдущему обещанию об Измаиле и не добавляет последующих богословских выводов, которых сам стих не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов «Мой завет Я установлю» сохраняет смысловое выделение завета в еврейском тексте; написание «Мой» с прописной буквы соответствует принятой русской библейской традиции обращения к Богу.
