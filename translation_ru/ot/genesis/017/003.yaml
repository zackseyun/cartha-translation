  text: 'И Аврам пал лицом вниз, и Бог обратился к нему со словами:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: пал
  rationale: Форма Qal wayyiqtol от נפל передаёт завершённое последовательное действие в повествовании. В сочетании с «на лицо своё» глагол ясно описывает земной поклон без добавления толкования в основной текст.
- source_word: עַל פָּנָיו
  choice: на лицо своё
  rationale: Сохранён конкретный образ еврейского выражения, обозначающего положение ниц и почтение. Такая формулировка соответствует достоинству библейского повествования и понятна в контексте.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Использована традиционная русская форма имени; на данном этапе повествования имя ещё не изменено на Авраам.
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Piel wayyiqtol от דבר означает «говорить». Русское «говорил с ним» естественно сочетается с предлогом אִתּוֹ и сохраняет структуру формулы речи перед последующей прямой речью.
- source_word: אִתּוֹ
  choice: с ним
  rationale: Предлог אֵת с местоименным суффиксом здесь буквально и естественно передаётся как «с ним», сохраняя возможный оттенок общения, а не только направленности речи.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму существительного, глагол стоит в единственном числе, а контекст указывает на единого Бога.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Инфинитив אמר вводит прямую речь. «Сказав» сохраняет отдельный речевой маркер исходного текста и грамматически завершает русскую вводную конструкцию.
- source_word: וַ
  choice: и
  rationale: Повторяющийся союз передаёт последовательность и связность еврейского повествования; в кратком торжественном стихе русское «и» звучит естественно.
theological_decisions:
- issue: Число и референт אֱלֹהִים
  choice: 'единственное число: «Бог»'
  alternative: «боги» на основании одной лишь морфологической формы
  rationale: Согласование сказуемого в единственном числе и контекст заветной речи однозначно требуют единственного числа; множественный перевод противоречил бы синтаксису.
- issue: Характер действия Аврама
  choice: сохранить телесный образ «пал на лицо своё»
  alternative: истолковать как «поклонился» или «простёрся ниц»
  rationale: Исходный текст описывает действие образно и конкретно; перевод не должен заменять этот образ его богословским или ритуальным истолкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Синтаксический параллелизм исходника сохранён; архаические формы вроде «рече» исключены. Формула «на лицо своё» выбрана ради точности образа и традиционной выразительности.
