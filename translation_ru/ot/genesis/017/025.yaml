  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: ru
  text: А Измаилу, его сыну, было тринадцать лет, когда ему обрезали крайнюю плоть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «плоть его крайней плоти».'
    reason: Сноска сохраняет более развёрнутую и конкретную формулировку еврейского текста בְּשַׂר עָרְלָתוֹ, которую невозможно без стилистической неестественности полностью воспроизвести в основном русском тексте.
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל בְּנ֔/וֹ
  choice: А Измаилу, его сыну
  rationale: Союз ו передан как «А», естественно продолжающее повествование и слегка выделяющее Измаила после упоминания Авраама; приложение «его сыну» прямо передаёт בנו.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: было тринадцать лет
  rationale: Обычная древнееврейская формула возраста передана современным идиоматическим русским выражением.
- source_word: בְּ/הִמֹּל/וֹ
  choice: когда ему обрезали
  rationale: Предлог ב с инфинитивом и местоименным суффиксом имеет временное значение. Неопределённо-личная русская конструкция естественно передаёт пассивный смысл нифаля, сохраняя Измаила участником действия.
- source_word: אֵת בְּשַׂר עָרְלָת/וֹ
  choice: крайнюю плоть
  rationale: В основном тексте выбрано обычное и ясное русское обозначение объекта обрезания. Более буквальное «плоть его крайней плоти» тяжеловесно и неестественно по-русски, поэтому конкретная формулировка источника отмечена в сноске.
