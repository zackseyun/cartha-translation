base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: ru
  text: 'Вот завет Мой, который вы должны соблюдать между Мною и вами, а также между Мною и твоим потомством[a] после тебя: все лица мужского пола среди вас должны быть обрезаны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоими потомками». Еврейское זֶרַע — собирательное слово, которое может означать потомство или потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: Вот завет Мой
  rationale: Указательное местоимение вводит содержание завета; связка, отсутствующая в еврейском, естественно передаётся русской конструкцией с «вот». «Завет» сохраняет устойчивое библейское значение בְּרִית.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: который вы должны соблюдать
  rationale: Имперфект в данном контексте выражает обязательство. «Соблюдать завет» естественно по-русски и передаёт смысл хранения и исполнения его требований.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: между Мною и вами, а также между Мною и твоим потомством[a] после тебя
  rationale: Формулировка ясно передаёт обе стороны отношений завета и сохраняет заметную в еврейском смену множественного «вами» на единственное «твоим… тебя». זֶרַע передано собирательным словом «потомство», а возможный вариант вынесен в сноску.
- source_word: הִמּוֹל
  choice: должен быть обрезан
  rationale: Абсолютный инфинитив выражает обязательное установление завета. Страдательная конструкция естественно связывается с כָּל זָכָר и не меняет участника, к которому относится требование.
- source_word: לָכֶם כָּל זָכָר
  choice: каждый у вас мужского пола
  rationale: לָכֶם контекстуально обозначает принадлежность к общине, а כָּל זָכָר охватывает каждого представителя мужского пола, включая не только взрослых мужчин. Современная формулировка точнее, чем «каждый мужчина».
theological_decisions:
- issue: Мужская специфика требования об обрезании
  choice: каждый у вас мужского пола должен быть обрезан
  alternative: все вы должны быть обрезаны
  rationale: Еврейское כָּל זָכָר прямо ограничивает требование лицами мужского пола; обобщение «все вы» устранило бы выраженную в тексте специфику.
- issue: Смена числа во второй стороне завета
  choice: между Мною и вами… твоим потомством… после тебя
  alternative: между Мною, вами и вашими потомками
  rationale: В еврейском «вами» стоит во множественном числе, а «твоим потомством» и «после тебя» обращены к одному лицу. Перевод сохраняет эту грамматическую напряжённость и не унифицирует адресатов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным заветным регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Избегнуты архаизмы «мужеский пол» и потенциально сужающее значение слова «мужчина».
