  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: ru
  text: 'Когда Авраму было девяносто девять лет, Яхве явился Авраму и сказал ему: «Я — Бог Всемогущий[a]. Ходи передо Мной и будь непорочен».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Эль-Шаддай. Точное значение слова «Шаддай» остаётся предметом споров.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда ... было
  rationale: Глагольная форма с повествовательным союзом вводит временную обстановку; такая конструкция естественно передаёт её по-русски без архаического «и было».
- source_word: בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: Авраму было девяносто девять лет
  rationale: Это обычная древнееврейская формула указания возраста; перевод дан в соответствии с русской идиомой.
- source_word: וַיֵּרָא
  choice: явился
  rationale: В данной форме и конструкции глагол означает, что Яхве явился Авраму, а не просто был им увиден.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֵל שַׁדַּי
  choice: Бог Всемогущий
  rationale: Традиционный смысловой перевод сохраняет форму божественного титула; ввиду спорного точного значения שַׁדַּי еврейская форма указана в сноске.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Ходи предо Мной
  rationale: Сохранена метафора хождения как постоянного образа жизни в Божьем присутствии; «предо Мной» передаёт заветный и торжественный оттенок выражения.
- source_word: וֶהְיֵה תָמִים
  choice: и будь непорочен
  rationale: תָמִים здесь выражает нравственную цельность и безупречность, не обязательно абсолютное безгрешное совершенство.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В основном тексте сохранено личное имя, непосредственно присутствующее в еврейском оригинале; оно не заменено титулом.
- issue: Передача титула אֵל שַׁדַּי
  choice: Бог Всемогущий
  alternative: Эль-Шаддай; Бог Шаддай
  rationale: Основной текст передаёт общепринятый смысл титула, а сноска сохраняет еврейскую форму и отмечает неопределённость точного оттенка.
- issue: Смысл требования תָמִים
  choice: будь непорочен
  alternative: будь цельным; будь совершенен
  rationale: Выбор сохраняет нравственную силу повеления, но не навязывает понимание абсолютного безгрешия; слово может обозначать цельность и безупречность перед Богом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены метафора «ходить пред Богом» и личное имя Яхве; устаревшие повествовательные формулы не использованы. Маркер сноски поставлен непосредственно после титула, к которому относится примечание.
