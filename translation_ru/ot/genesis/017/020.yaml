revisions:
- from: А об Измаиле Я услышал тебя. Вот, Я благословил его, сделаю его плодовитым и чрезвычайно многочисленным. От него родятся двенадцать вождей, и Я произведу от него великий народ.
  to: А об Измаиле Я услышал тебя. Вот, Я благословил его, сделаю его плодовитым и чрезвычайно многочисленным. От него родятся двенадцать вождей, и Я сделаю его великим народом.
