  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: ru
  text: А об Измаиле Я услышал тебя. Вот, Я благословил его, сделаю его плодовитым и чрезвычайно многочисленным. От него родятся двенадцать вождей, и Я сделаю его великим народом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: А об Измаиле
  rationale: Предлог לְ здесь вводит тему ответа Бога на просьбу Авраама об Измаиле; «об Измаиле» естественно передаёт это значение по-русски.
- source_word: שְׁמַעְתִּיךָ
  choice: Я услышал тебя
  rationale: Сохранена прямая семантика глагола שמע и обращение к Аврааму; в контексте это также подразумевает, что просьба принята.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт дискурсивный указатель и акцент исходного текста в современном литературном русском.
- source_word: הִפְרֵיתִי אֹתוֹ
  choice: сделаю его плодовитым
  rationale: Каузативная форма פרה означает наделить плодовитостью, дать многочисленное потомство.
- source_word: וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד
  choice: и чрезвычайно многочисленным
  rationale: Естественно передаёт каузативное «умножу его» и усиленное בִּמְאֹד מְאֹד — «весьма, весьма».
- source_word: נְשִׂיאִם
  choice: вождей
  rationale: נָשִׂיא обозначает главу или предводителя племенной общины; «вожди» точнее контекста, чем монархическое «князья».
- source_word: יוֹלִיד
  choice: От него родятся
  rationale: Hifil от ילד буквально выражает «он породит»; безлично-родовая русская конструкция ясно указывает на происхождение двенадцати вождей и звучит естественно.
- source_word: וּנְתַתִּיו לְגוֹי גָּדוֹל
  choice: и Я произведу от него великий народ
  rationale: Конструкция буквально допускает «дам/сделаю его великим народом»; выбранный оборот естественно передаёт становление народа из потомков Измаила.
theological_decisions:
- issue: Соотношение благословения Измаила и заветной линии Исаака
  choice: Сохранено безусловное обещание Божьего благословения, многочисленного потомства и великого народа для Измаила.
  alternative: Ослабить благословение или пояснить, что оно не является заветным.
  rationale: Сам стих прямо утверждает благословение Измаила; различие с заветом через Исаака дано в соседнем стихе и не должно привноситься в этот текст.
- issue: Временное значение перфектных форм הִנֵּה בֵּרַכְתִּי ... וְהִפְרֵיתִי ... וְהִרְבֵּיתִי
  choice: «Я благословил его, сделаю его плодовитым и чрезвычайно многочисленным».
  alternative: 'Все три формы передать будущим временем: «благословлю… сделаю плодовитым… умножу».'
  rationale: У «благословил» сохранена формальная завершённость еврейского перфекта, тогда как последующие формы в цепи обещаний естественно раскрываются по-русски как будущие результаты; смысл твёрдого Божьего обещания не ослаблен.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизмов. Синтаксис сохраняет последовательность обещаний и акцент «Вот», но избегает неестественного буквального «умножу его весьма, весьма».
