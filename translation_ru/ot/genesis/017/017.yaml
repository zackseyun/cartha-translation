base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: ru
  text: 'Тогда Авраам пал ниц, рассмеялся и сказал про себя: «Неужели у столетнего родится ребёнок[a]? Неужели Сарра родит в девяносто лет?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родится сын». В еврейском тексте здесь употреблено слово «сын»; в данном контексте речь идёт об обещанном сыне.'
    reason: 'Лексическая альтернатива: основной текст сохраняет нейтральное «ребёнок», а примечание отмечает возможный более конкретный перевод и наличие соответствующего еврейского слова.'
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: Авраам пал ниц
  rationale: Сочетание נפל с עַל־פָּנָיו описывает падение лицом вниз. «Пал ниц» кратко и естественно передаёт позу преклонения, не добавляя мотива действия.
- source_word: וַיִּצְחָק
  choice: рассмеялся
  rationale: צחק прямо обозначает смех. Перевод сохраняет связь с последующим именем Исаак и не определяет заранее, был ли это смех радости, изумления или неверия.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: сказал про себя
  rationale: Буквальный оборот «сказал в своём сердце» означает внутреннюю, невысказанную речь. «Сказал про себя» естественно передаёт это в современном русском языке.
- source_word: הַלְּבֶן מֵאָה שָׁנָה יִוָּלֵד
  choice: Неужели у столетнего родится ребёнок
  rationale: Еврейский возрастной оборот буквально говорит о «сыне ста лет», то есть о столетнем человеке; пассивная форма ילד означает «родиться». «Неужели» естественно передаёт риторический вопрос, а «ребёнок» восполняет подразумеваемого субъекта без чрезмерного уточнения пола.
- source_word: וְאִם שָׂרָה הֲבַת תִּשְׁעִים שָׁנָה תֵּלֵד
  choice: Неужели Сарра родит в девяносто лет
  rationale: «Дочь девяноста лет» — еврейский способ обозначения возраста. Русский оборот «в девяносто лет» ясно и естественно передаёт смысл; повтор «неужели» сохраняет параллелизм двух риторических вопросов.
theological_decisions:
- issue: Характер смеха Авраама
  choice: 'Передать нейтрально: «рассмеялся»'
  alternative: «рассмеялся от радости» или «недоверчиво рассмеялся»
  rationale: Сам стих сообщает о смехе и внутренних вопросах Авраама, но прямо не называет ни причину смеха, ни его нравственную оценку. Перевод сохраняет эту неоднозначность.
- issue: Подразумеваемый ребёнок в первом вопросе
  choice: «ребёнок» с примечанием об альтернативе «сын»
  alternative: «сын»
  rationale: В самой форме יִוָּלֵד субъект не выражен явно, хотя контекст обещания указывает на сына. Основной текст не переуточняет, а примечание сохраняет контекстуально обоснованную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «пал ниц». Внутренняя речь передана естественным выражением «сказал про себя»; риторическая сила вопросов — частицей «неужели».
