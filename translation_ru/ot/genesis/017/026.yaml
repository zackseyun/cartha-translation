base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/026.yaml
  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: ru
  text: В тот самый день были обрезаны Авраам и его сын Измаил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: В тот самый день
  rationale: Устойчивое временное выражение подчёркивает, что событие произошло именно в этот день; такой перевод естественно и точно передаёт усилительное значение בְּעֶצֶם и указательность הַזֶּה.
- source_word: נִמּוֹל
  choice: были обрезаны
  rationale: Нифаль передаёт пассивное значение. Хотя еврейская глагольная форма стоит в единственном числе перед составным подлежащим, по-русски при двух однородных подлежащих естественно употребить множественное число.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: וְיִשְׁמָעֵאל
  choice: и ... Измаил
  rationale: Союз передан прямо, а имя — в его традиционной русской форме.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Существительное с суффиксом третьего лица мужского рода указывает, что Измаил — сын Авраама; русский порядок слов ясно сохраняет эту связь.
