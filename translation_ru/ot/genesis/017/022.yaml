    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Когда Бог закончил
  rationale: Форма wayyiqtol от כלה обозначает завершённое действие; придаточное с «когда» естественно передаёт временную связь с последующим действием. Подлежащее названо по ясному контексту, чтобы избежать неестественной для русского цепочки неоднозначных местоимений.
- source_word: לְדַבֵּר
  choice: говорить
  rationale: Инфинитив от דבר после כלה образует сочетание «закончить говорить».
- source_word: אִתּוֹ
  choice: с Авраамом
  rationale: Предлог את здесь выражает собеседование — «говорить с кем-либо». Имя восстановлено из контекста ради ясного современного русского изложения.
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה означает движение вверх. «Поднялся» сохраняет конкретный пространственный образ и звучит естественнее, чем более торжественное «вознёсся».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму существительного, единственное число глагола и контекст указывают на единственного Бога.
- source_word: מֵעַל
  choice: от него
  rationale: מֵעַל буквально передаёт удаление «с/от пространства над кем-либо». В данном контексте по-русски естественно «от него», при сохранении направления вверх в глаголе «поднялся».
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Устоявшаяся русская форма личного имени.
theological_decisions:
- issue: Антропоморфное пространственное описание ухода Бога
  choice: 'Сохранено: «Он поднялся от него»'
  alternative: «Бог удалился от Авраама»
  rationale: Еврейский текст изображает окончание богоявления как движение вверх. Конкретный образ сохранён без вывода о пространственной ограниченности Бога.
translation_notes:
  register: Современный литературный русский язык с ясным синтаксисом и сохранением конкретного образа восхождения. Местоимение «Он» относится к Богу; имя Авраама введено в первой части для устранения неясности двух местоимений исходного порядка.
