base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: ru
  text: Каждый мальчик среди вас, когда ему исполнится восемь дней[a], должен быть обрезан из поколения в поколение — как рождённый в доме, так и купленный за серебро[b] у всякого чужеземца, который не принадлежит к твоему потомству[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын восьми дней».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «купленный за деньги».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «у всякого сына чужеземца, который не из твоего семени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: В возрасте восьми дней
  rationale: Естественно передаёт древнееврейскую возрастную формулу «сын восьми дней», сохраняя точное указание срока.
- source_word: יִמּוֹל
  choice: должен быть обрезан
  rationale: Передаёт пассивное значение нифаля и обязательный характер предписания без излишне архаичного оборота.
- source_word: לָכֶם כָּל זָכָר
  choice: у вас ... каждый младенец мужского пола
  rationale: «У вас» передаёт לָכֶם как отнесение к общине завета; в данном возрастном контексте «младенец мужского пола» звучит естественнее буквального «каждый мужского пола».
- source_word: לְדֹרֹתֵיכֶם
  choice: из поколения в поколение
  rationale: Ясно выражает непрерывное действие установления во всех последующих поколениях.
- source_word: יְלִיד בָּיִת
  choice: рождённый в доме
  rationale: Близко следует конкретному образу еврейского выражения и обозначает рождённого внутри домохозяйства.
- source_word: וּמִקְנַת כֶּסֶף
  choice: и купленный за серебро
  rationale: Сохраняет конкретное значение כֶּסֶף «серебро» и ясно передаёт приобретение посредством покупки.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: у любого чужеземца
  rationale: Передаёт смысл идиомы «у всякого сына чужеземца» естественным современным русским языком.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: который не из твоего потомства
  rationale: «Потомство» естественно передаёт метафорическое זֶרַע «семя»; единственное число «твоего» сохраняет обращение непосредственно к Аврааму.
theological_decisions:
- issue: Круг лиц, на которых распространяется повеление об обрезании в доме Авраама
  choice: Текст включает рождённых в доме и купленных у чужеземцев, а не только биологических потомков Авраама.
  alternative: Ограничить предписание преимущественно физическими потомками Авраама.
  rationale: Еврейский текст прямо называет рождённых в доме и приобретённых за серебро, а заключительная оговорка отличает их от потомства Авраама. Перевод сохраняет этот охват, не делая дальнейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством законодательной речи. Формула «должен быть обрезан» ясна обычному читателю; двоеточие естественно вводит две охватываемые категории. Смена множественного «у вас» на единственное «твоего» намеренно сохраняет соответствующую смену лица в еврейском тексте.
