  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: ru
  text: И Я сделаю тебя чрезвычайно плодовитым[a], сделаю тебя родоначальником народов, и от тебя произойдут цари[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «очень, очень».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выйдут от тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: И Я сделаю тебя… плодовитым
  rationale: Каузативная форма породы hифиль от פרה означает «сделать плодовитым, дать многочисленное потомство». Такой перевод сохраняет образ плодородия и причинное значение формы.
- source_word: בִּמְאֹד מְאֹד
  choice: чрезвычайно
  rationale: Повтор מְאֹד создаёт сильное усиление — буквально «очень, очень». «Чрезвычайно» естественно передаёт эту эмфазу в современном русском языке.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: и произведу от тебя народы
  rationale: 'Сочетание נתן с ל здесь указывает на результат обещания: от Авраама произойдут многие народы. Формулировка естественна по-русски и сохраняет родословный смысл ближайшего контекста.'
- source_word: לְגוֹיִם
  choice: народы
  rationale: גּוֹיִם обозначает народы или нации. Здесь речь идёт о народах, происходящих от Авраама, а не специально о язычниках.
- source_word: וּמְלָכִים
  choice: и цари
  rationale: מְלָכִים прямо означает «цари»; более общее «правители» было бы менее точным.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: произойдут от тебя
  rationale: Буквально יצא означает «выйти», но в родословном контексте выражение указывает на происхождение. «Произойдут от тебя» точно и естественно передаёт этот смысл.
theological_decisions:
- issue: Объём обещания о потомках Авраама
  choice: Стих обещает, что от Авраама произойдут многие народы и цари.
  alternative: Фразу можно было бы понять более отвлечённо — как наделение Авраама особым положением среди народов.
  rationale: Ближайший контекст завета сосредоточен на потомстве и родословной. Перевод через происхождение лучше соответствует синтаксису и контексту, не привнося позднейших богословских систем.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «Я» оформлено с прописной буквы как обращённая речь Бога. Избегнуты архаизмы вроде «весьма размножу»; параллелизм еврейского текста сохранён.
