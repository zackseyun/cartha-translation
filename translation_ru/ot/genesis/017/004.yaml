  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: ru
  text: 'Что до Меня[a], вот: Мой завет с тобой, и ты станешь[b] отцом множества народов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Я — вот: Мой завет с тобой». Начальные местоимение и частица в еврейском тексте эмфатичны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будешь отцом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Что до Меня
  rationale: Самостоятельное местоимение поставлено в начале и несёт смысловое ударение. Оборот «что до Меня» естественно передаёт это выделение по-русски.
- source_word: הִנֵּה
  choice: вот
  rationale: Указательная частица привлекает внимание к следующему торжественному заявлению; «вот» сохраняет её прямую и выразительную силу.
- source_word: בְרִיתִי
  choice: Мой завет
  rationale: «Завет» — точный и устойчивый русский эквивалент בְּרִית в повествовании об Аврааме, сохраняющий ключевое значение данного понятия.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: Предлог с местоименным суффиксом непосредственно означает «с тобой»; перевод не добавляет отсутствующего в еврейском тексте оборота «между Мной и тобой».
- source_word: וְהָיִיתָ
  choice: и ты станешь
  rationale: В данном обещании форма имеет будущее, результативное значение. «Станешь» передаёт переход к обещанной роли, сохраняя возможность более буквального понимания «будешь» в сноске.
- source_word: לְאָב
  choice: отцом
  rationale: Предлог לְ обозначает назначение или становление в определённом качестве; русское «станешь отцом» естественно передаёт эту конструкцию.
- source_word: הֲמוֹן
  choice: множества
  rationale: Слово обозначает многочисленность, большую совокупность и сохраняет смысловую связь с объяснением нового имени Авраама в следующем стихе.
- source_word: גּוֹיִם
  choice: народов
  rationale: Здесь речь идёт о народах, которые произойдут от Авраама, а не о «язычниках» в более позднем специальном смысле.
theological_decisions:
- issue: Формула завета и роль Авраама
  choice: «Мой завет с тобой, и ты станешь отцом множества народов»
  alternative: «Я заключаю с тобой Мой завет» или истолковательное «ты станешь предком многих народов»
  rationale: Перевод сохраняет краткую именную формулу еврейского текста и обещанный результат, не добавляя явно не выраженного здесь действия заключения завета и не заменяя образ «отца» поясняющим словом «предок».
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Двоеточие после «вот» ясно вводит содержание заявления. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
