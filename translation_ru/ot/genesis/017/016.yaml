  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: ru
  text: 'Я благословлю её и, более того, дам тебе от неё сына. Я благословлю её: она даст начало народам, и от неё произойдут цари народов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. буквально: «она станет народами» или, при другом понимании необычного оборота, «она будет для народов». Возможный смысл: «она станет прародительницей народов».'
    reason: Сноска отмечает буквальную необычность и синтаксическую неоднозначность выражения וְהָיְתָה לְגוֹיִם, не навязывая один толковательный вариант.
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: Я благословлю её / Я благословлю её
  rationale: Глагол ברך передан как «благословлю», чтобы сохранить его заветный и богословский смысл. Повтор исходного текста сохранён.
- source_word: וְגַם
  choice: и, более того
  rationale: Так передана не только соединительная, но и усилительная функция частицы.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: дам тебе сына от неё
  rationale: Перфект в контексте Божьего обещания имеет будущее значение; выражение «сына от неё» естественно обозначает происхождение сына от Сарры.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: от неё произойдут народы
  rationale: Формулировка передаёт корпоративный смысл обещания и звучит естественно по-русски, не добавляя прямо отсутствующего в еврейском тексте слова «прародительница». Более буквальная необычная конструкция отмечена в сноске.
- source_word: מַלְכֵי עַמִּים
  choice: цари народов
  rationale: Сохранена конструкция «цари народов» и лексическая связь עַמִּים с человеческими общностями.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: произойдут от неё
  rationale: Передан смысл происхождения и потомства, выраженный буквально словами «будут от неё».
theological_decisions:
- issue: Обещание о народах, происходящих от Сарры
  choice: от неё произойдут народы; цари народов произойдут от неё
  alternative: она станет прародительницей народов; от неё произойдут цари народов
  rationale: Основной текст сохраняет широту заветного обещания о народах и царских линиях, но не вводит отсутствующее в еврейском оригинале существительное «прародительница».
