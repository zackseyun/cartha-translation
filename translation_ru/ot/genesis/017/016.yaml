  source_fidelity: 'В целом смысл передан верно: сохранены будущий характер обещания, повтор «Я благословлю её», происхождение сына от Сарры, а также народы и цари, происходящие от неё. Однако «от неё произойдут народы; цари народов произойдут от неё» неоправданно повторяет один и тот же глагол и размывает различие между וְהָיְתָה לְגוֹיִם («станет/будет для народов») и заключительным מִמֶּנָּה יִהְיוּ («будут/произойдут от неё»).'
