  to: И взял Авраам своего сына Измаила, и всех, кто родился в его доме, и всех купленных за его серебро — всех мужчин в доме Авраама, — и обрезал их крайнюю плоть в тот самый день[a], как сказал ему Бог[b].
  rationale: Исправлены видо-временная форма в заключительной клаузе и управление при обозначении обрезания. Смысл перечисления, телесная конкретность исходного текста, указание на мужской пол и акцент на немедленном исполнении сохранены. Примечания оставлены с корректными якорями и по-прежнему фиксируют альтернативный оттенок «говорил с ним».
