source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: ru
  text: И взял Авраам своего сына Измаила, и всех, кто родился в его доме, и всех купленных за его серебро — всех мужчин в доме Авраама, — и обрезал их крайнюю плоть в тот самый день[a], как сказал ему Бог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в самый этот день»; выражение подчёркивает, что Авраам исполнил повеление тогда же, без промедления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как говорил с ним Бог».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח; здесь глагол вводит немедленное исполнение повеления и охватывает всех перечисленных далее.
- source_word: יְלִידֵי בֵיתוֹ
  choice: всех рождённых в его доме
  rationale: Сохраняет образ и конструкцию еврейского текста, не уточняя в основном тексте социальный статус этих домочадцев.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: всех купленных за его серебро
  rationale: Передаёт покупку людей в состав домохозяйства и сохраняет конкретное слово «серебро», употреблённое в источнике.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: всех мужчин в доме Авраама
  rationale: Естественно по-русски передаёт всеохватность כָּל זָכָר и мужской пол, избегая тяжеловесного повтора «каждого мужчину среди мужчин».
- source_word: וַיָּמָל אֶת בְּשַׂר עָרְלָתָם
  choice: обрезал крайнюю плоть у них
  rationale: Точно и понятно передаёт телесное действие; выражение «плоть их крайней плоти» в современном русском было бы неестественным.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Устойчиво передаёт усилительное значение идиомы и подчёркивает исполнение без промедления.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: как говорил ему Бог
  rationale: דבר с אֵת допускает оттенки «говорить ему» и «говорить с ним»; выбранная формулировка естественна по-русски и не устраняет длительный диалогический фон главы.
theological_decisions:
- issue: Передача אֱלֹהִים
  choice: Бог
  alternative: Бог говорил с ним
  rationale: В контексте Бытия 17 речь идёт о Боге, заключающем завет с Авраамом; формулировка не вносит дополнительных конфессиональных толкований.
- issue: Гендерно конкретное описание домочадцев
  choice: всех мужчин в доме Авраама
  alternative: всех лиц мужского пола среди людей дома Авраама
  rationale: Источник прямо указывает мужской пол словом זָכָר; естественное русское «мужчин» сохраняет эту конкретность.
- issue: Характер Божьей речи к Аврааму
  choice: как говорил ему Бог
  alternative: как говорил с ним Бог
  rationale: Предлог при דבר допускает оба оттенка. Основной текст выбирает естественную русскую форму, а примечание сохраняет подлинную смысловую возможность диалогического «с ним».
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён лишь настолько, чтобы длинное перечисление оставалось ясным; тире выделяют итоговую группу «всех мужчин». Терминология телесно конкретна, но не архаична.
