  text: И Я установлю Мой завет между Мною и тобою[a] и безмерно умножу тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «дам (или: поставлю) Мой завет между Мною и тобою».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: И Я заключу
  rationale: Глагол נתן буквально означает «дать, положить, установить», но в сочетании с «завет» здесь естественный русский эквивалент — «заключить завет». Он передаёт совершение заветного установления, не превращая завет в передаваемый предмет.
- source_word: בְרִיתִי
  choice: Мой завет
  rationale: «Завет» сохраняет устойчивое формальное и богословское значение בְּרִית; суффикс первого лица единственного числа передан притяжательным местоимением.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: между Мною и тобою
  rationale: Прямо передаёт взаимную формулу еврейского текста и соответствует достоинству библейского регистра современного литературного русского языка.
- source_word: וְאַרְבֶּה
  choice: и чрезвычайно умножу
  rationale: Порода hифиль выражает причинное увеличение числа; «умножу» сохраняет прямую обращённость обещания к Авраму и традиционную лексику повествования о патриархах.
- source_word: אֹתְךָ
  choice: тебя
  rationale: В еврейском тексте стоит прямое дополнение второго лица мужского рода единственного числа, непосредственно обозначающее Аврама. Подразумеваемое потомство не вводится в основной текст.
- source_word: בִּמְאֹד מְאֹד
  choice: чрезвычайно
  rationale: Удвоенное מְאֹד служит сильным усилением. «Чрезвычайно» естественно и выразительно передаёт эту степень без тяжеловесного буквального повтора.
theological_decisions:
- issue: Заветная идиома נתן + ברית
  choice: заключу Мой завет
  alternative: дам / установлю Мой завет
  rationale: «Заключить завет» — естественная русская заветная формула, передающая действие Бога без предположения о простой передаче предмета. Более буквальное значение глагола сохранено в примечании.
- issue: Объект обещанного умножения
  choice: умножу тебя
  alternative: умножу твоих потомков
  rationale: Сохранено прямое обращение к Авраму и подлинная смысловая ёмкость местоимения; уточнение «потомков» было бы истолковательным расширением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы «Мною» и «тобою» выбраны как нормативные и естественные в торжественном контексте; прописные местоимения в отношении Бога соответствуют принятому русскому библейскому оформлению.
