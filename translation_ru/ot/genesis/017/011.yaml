base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: ru
  text: Обрежьте крайнюю плоть вашу, и это будет знаком завета между Мною и вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Обрежьте
  rationale: Форма с союзом в контексте установления завета передаёт предписание. Русский императив естественно и точно выражает эту директивную силу.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: крайнюю плоть вашу
  rationale: Сочетание буквально обозначает «плоть вашей крайней плоти», но в данном анатомическом контексте естественным русским соответствием является «крайняя плоть». Постпозиция местоимения поддерживает dignified biblical register without obscurity.
- source_word: וְהָיָה
  choice: и это будет
  rationale: Форма указывает на будущую функцию совершённого обрезания; указательное «это» ясно соотносит знак с предписанным действием.
- source_word: לְאוֹת
  choice: знаком
  rationale: אוֹת в контексте завета означает опознаваемый знак; творительный падеж после «будет» естественен в современном русском языке.
- source_word: בְּרִית
  choice: завета
  rationale: Контекст указывает на конкретный завет, уже устанавливаемый Богом с Авраамом; русская конструкция «знак завета» не требует артикля.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: между Мною и вами
  rationale: Сохраняется прямое отношение сторон и множественное число обращения, без добавления потомков, названных в окружающем контексте, но не в этой фразе.
theological_decisions:
- issue: Природа обрезания как знака завета
  choice: знак завета
  alternative: знамение завета; свидетельство завета
  rationale: Перевод сохраняет утверждение текста о заветной функции обрезания, не определяя сверх сказанного, является ли эта функция сакраментальной или только символической.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Написание «Мною» с прописной буквы принято как уважительное обозначение Бога. Формулировка остаётся понятной без архаизмов.
