  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: ru
  text: И дам тебе и твоему потомству после тебя землю, где ты живёшь как чужеземец, — всю землю Ханаана — во владение навеки[a], и буду их Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вечное владение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И дам
  rationale: Перфект с союзом в контексте заветного обещания естественно передаётся русским будущим временем.
- source_word: לְךָ
  choice: тебе
  rationale: Прямо обозначает Авраама как получателя обещанного дара.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: и твоему потомству после тебя
  rationale: «Потомство» сохраняет собирательный смысл זֶרַע, а «после тебя» передаёт преемственность поколений.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: землю, где ты живёшь как чужеземец
  rationale: Передаёт не просто место жительства, но положение пришлого жителя без собственного постоянного владения.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: всю землю Ханаанскую
  rationale: Приложение уточняет предыдущую фразу и сохраняет всеохватность כָּל.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: во владение навеки
  rationale: אֲחֻזָּה обозначает наследственное земельное владение, а עוֹלָם — его неограниченную, непреходящую длительность в формуле обещания.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: и буду их Богом
  rationale: Естественная русская передача устойчивой формулы заветных отношений без предположения об изменении Божьей сущности.
theological_decisions:
- issue: Передача формулы отношений завета без внесения позднейших доктринальных уточнений
  choice: и буду их Богом
  alternative: и буду Богом для них
  rationale: Выбранный вариант точно и естественно выражает принадлежность и отношения в рамках завета, не добавляя отсутствующих в тексте богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством заветной речи. Оборот «живёшь как чужеземец» понятнее архаичного «странствуешь» и точно передаёт статус пришлого жителя; «земля Ханаанская» сохраняет привычное библейское наименование.
