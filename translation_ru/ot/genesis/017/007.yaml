source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: ru
  text: Я установлю Мой завет между мной и тобой, и между твоим потомством[a] после тебя, во всех поколениях твоего потомства, как вечный завет, чтобы быть для тебя Богом[b] и для твоего потомства после тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «потомство», имеет форму единственного числа и собирательное значение; его можно также передать как «семя» или «потомки».
    reason: lexical_alternative
  - marker: b
    text: 'Или, более привычно по-русски: «чтобы быть твоим Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Я установлю
  rationale: Глагол קום в породе hифиль с בְּרִית означает установить или утвердить завет. «Установлю» естественно передаёт начало и прочность заветных отношений.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: Прямо сохраняет существительное בְּרִית и притяжательный суффикс первого лица.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: между Мною и тобой и
  rationale: Сохраняет стороны завета и в основном следует повторяющейся еврейской конструкции, не перегружая русскую фразу вторым «между».
- source_word: זַרְעֲךָ
  choice: твоим потомством
  rationale: זֶרַע — собирательное существительное в единственном числе. «Потомство» сохраняет собирательность и звучит естественнее буквального «семя».
- source_word: אַחֲרֶיךָ
  choice: после тебя
  rationale: Передаёт временную и родословную последовательность без дополнительного толкования.
- source_word: לְדֹרֹתָם
  choice: во все их поколения
  rationale: Выражает продолжение завета из поколения в поколение; местоимение «их» соотносится с собирательным «потомством».
- source_word: לִבְרִית עוֹלָם
  choice: как вечный завет
  rationale: «Вечный» доступно и традиционно передаёт עוֹלָם в контексте непреходящего завета, а «как» отражает предикативную функцию לְ.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: чтобы быть Богом тебе
  rationale: Близко сохраняет необычную, но понятную по-русски заветную формулу «быть для тебя Богом», не сводя её без пояснения к притяжательной конструкции.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: и твоему потомству после тебя
  rationale: Последовательно повторяет выбранную передачу זֶרַע и сохраняет заключительную родословную формулу.
theological_decisions:
- issue: Завет с потомством Авраама
  choice: твоим потомством
  alternative: твоим семенем; твоими потомками
  rationale: «Потомство» сохраняет собирательное значение единственного числа זֶרַע и не разрешает текст исключительно в сторону множества отдельных потомков либо одного представительного потомка.
- issue: Формула заветных отношений
  choice: быть Богом тебе
  alternative: быть твоим Богом
  rationale: Выбранная формулировка ближе к еврейской конструкции и сохраняет её реляционную торжественность; более гладкий русский вариант дан в примечании.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаичной заветной лексикой. Синтаксис в основном следует еврейскому оригиналу, а сноски сохраняют значимые лексические альтернативы и неоднозначность собирательного זֶרַע.
