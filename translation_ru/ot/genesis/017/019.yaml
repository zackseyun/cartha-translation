  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: ru
  text: 'И сказал Бог: «Нет, именно Сара, твоя жена, родит тебе сына, и ты дашь ему имя Исаак[a]. Я установлю мой завет с ним как вечный завет для его потомков после него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Исаак» созвучно еврейскому глаголу со значением «он смеётся» или «он будет смеяться».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Нет —
  rationale: В данном контексте это слово вводит прямое исправление просьбы Авраама об Измаиле. Русское «Нет —» естественно передаёт корректирующую силу реплики, не добавляя лишнего противопоставления.
- source_word: יֹלֶדֶת
  choice: родит
  rationale: Причастие употреблено в предсказательном значении; русская форма будущего времени ясно и естественно передаёт обещанное событие.
- source_word: וְקָרָאתָ אֶת שְׁמוֹ
  choice: ты дашь ему имя
  rationale: Передаёт еврейскую формулу наречения имени современным и достойным русским языком.
- source_word: יִצְחָק
  choice: Исаак
  rationale: Использована укоренившаяся русская форма библейского имени; словесная связь имени с глаголом «смеяться» отмечена в сноске.
- source_word: וַהֲקִמֹתִי
  choice: Я установлю
  rationale: Глагол выражает приведение завета в силу и его утверждение; «установлю» сохраняет каузативный смысл и естественно сочетается со словом «завет».
- source_word: בְּרִיתִי אִתּוֹ
  choice: Мой завет с ним
  rationale: Предлог указывает на отношения завета непосредственно с Исааком.
- source_word: לִבְרִית עוֹלָם
  choice: как вечный завет
  rationale: Конструкция обозначает качество или статус завета; «вечный» передаёт его непреходящий характер без дальнейшего богословского уточнения.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: для его потомства после него
  rationale: «Потомство» сохраняет собирательный смысл единственного числа זרע, а оборот «после него» воспроизводит временную и поколенческую последовательность оригинала.
theological_decisions:
- issue: Объём и непрерывность обетования завета
  choice: Завет прямо связывается с Исааком и распространяется на его потомство после него.
  alternative: Истолковать обещание исключительно как этническое или национальное либо как прямое определение позднейшей христианской системы заветов.
  rationale: Текст стиха утверждает вечный завет с Исааком и его потомством, но сам не уточняет его объём посредством позднейших богословских категорий; перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохранён близким к еврейскому, но формула наречения имени передана естественно для современного читателя.
