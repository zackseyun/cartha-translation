lexical_decisions:
- source_word: וְכָל אַנְשֵׁי בֵיתוֹ
  choice: И все мужчины в его доме
  rationale: Союз וְ связывает стих с предыдущим повествованием, כָל выражает полноту охвата, а אַנְשֵׁי בֵיתוֹ обозначает мужчин, принадлежавших к дому Авраама. «В его доме» естественно передаёт здесь не только жилище, но и состав домохозяйства.
- source_word: יְלִיד בָּיִת
  choice: рождённые в доме
  rationale: Фраза обозначает людей, родившихся внутри данного домохозяйства; буквальная структура сохранена без архаичного оборота.
- source_word: וּמִקְנַת כֶּסֶף
  choice: и купленные за деньги
  rationale: Сочетание указывает на приобретённых посредством покупки людей. Формулировка прямо сохраняет социально-экономический смысл древнего текста, не смягчая его.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: у чужеземца
  rationale: מֵאֵת при глагольно подразумеваемом приобретении передаёт источник покупки («у»), а בֶּן נֵכָר является идиоматическим обозначением чужеземца или постороннего.
- source_word: נִמֹּלוּ
  choice: были обрезаны
  rationale: 'Нифаль здесь естественно понимается как пассив: мужчины подверглись обрезанию.'
- source_word: אִתּוֹ
  choice: вместе с ним
  rationale: Предлог выражает совместность с Авраамом; «вместе с ним» ясно передаёт одновременное участие в описанном действии.
