  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: ru
  text: И все мужчины его дома — и родившиеся в его доме, и купленные за деньги у чужеземца[a] — были обрезаны вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
