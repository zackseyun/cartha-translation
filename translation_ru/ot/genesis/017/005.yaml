base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: ru
  text: Тебя больше не будут называть Аврамом; твоё имя будет Авраам, потому что Я сделал тебя отцом множества народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я дал тебя [как] отца множества народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא
  choice: не будут… называть
  rationale: Нифаль глагола קרא в формуле наречения имени имеет пассивное значение; русская неопределённо-личная конструкция естественно передаёт «не будет называться» при личном объекте.
- source_word: עוֹד
  choice: больше
  rationale: 'В сочетании с отрицанием обозначает прекращение прежнего именования: «больше не».'
- source_word: שִׁמְךָ
  choice: имя тебе
  rationale: В первой части местоименный объект «тебя» естественно передаёт смысл именования, а во второй «имя тебе будет» сохраняет явное упоминание имени и торжественную формулу.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Традиционная и общепринятая русская передача личного имени.
- source_word: וְהָיָה
  choice: будет
  rationale: Формально союз допускает «и», но противопоставление прежнего и нового имени ясно выражено пунктуацией; глагол передан будущим временем в естественной русской формуле переименования.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Традиционная и общепринятая русская передача личного имени.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание нового имени и ясно передаёт причинно-пояснительную связь.
- source_word: אַב
  choice: отцом
  rationale: Основное значение слова и необходимая часть объяснения нового имени.
- source_word: הֲמוֹן
  choice: множества
  rationale: Сохраняет существительное со значением многочисленности и связь с объяснением имени Авраама.
- source_word: גּוֹיִם
  choice: народов
  rationale: В данном контексте обозначает различные народы; «язычники» было бы анахронично и богословски сужало бы значение.
- source_word: נְתַתִּיךָ
  choice: Я сделал тебя
  rationale: Буквально «Я дал/поставил тебя»; в предикативной конструкции современное русское «сделал тебя отцом» естественно передаёт смысл, сохраняя завершённую форму еврейского перфекта.
theological_decisions:
- issue: Завершённый вид Божьего установления
  choice: Я сделал тебя отцом множества народов
  alternative: Я сделаю тебя отцом множества народов
  rationale: Еврейский перфект נְתַתִּיךָ представляет Божье обещание как уже установленную реальность. Прошедшее совершенного вида сохраняет напряжение между провозглашённым свершением и его будущим историческим осуществлением.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан естественным для русского, при этом сохранены формула переименования, объяснение имени и завершённый вид Божьего установления.
