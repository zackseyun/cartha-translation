source:
  edition: WLC
  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: ru
  text: 'А всякий необрезанный мужчина, у которого не обрезана крайняя плоть, — такой человек будет отсечён от своего народа[a][b]: он нарушил Мой завет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «та душа будет отсечена от народа своего». Еврейское נֶפֶשׁ здесь означает человека, а «будет отсечена» — устойчивый оборот заветной санкции.'
    reason: lexical_alternative
  - marker: b
    text: «Будет отсечён» может обозначать суровый суд за нарушение завета, в том числе исключение из общины или смерть; сам стих не уточняет вид кары.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: необрезанный мужчина
  rationale: עָרֵל обозначает необрезанного, а זָכָר уточняет мужской пол. Выражение естественно для современного русского языка и сохраняет юридическую точность установления.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: у которого не обрезана
  rationale: Нифаль глагола מול имеет пассивное или возвратное значение. Русская пассивная конструкция передаёт состояние, о котором говорится в общем постановлении.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: плоть крайней плоти
  rationale: Сохранена анатомическая конкретность еврейского выражения, хотя по-русски оно звучит несколько тяжеловесно; обобщение до одного слова «необрезан» устранило бы часть исходной формулировки.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: тот человек будет отсечён
  rationale: נפש здесь означает отдельного человека, на которого налагается санкция, а не обязательно нематериальную душу. «Будет отсечён» сохраняет образный заветный оборот כרת и не уточняет вид наказания сверх текста.
- source_word: מֵעַמֶּיהָ
  choice: от своего народа
  rationale: Суффикс грамматически согласован с существительным נפש женского рода, но относится к названному мужчине. «Народ» сохраняет обычное заветное значение עם.
- source_word: אֶת בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» — устойчивый и богословски весомый русский эквивалент ברית в Бытии 17.
- source_word: הֵפַר
  choice: он нарушил
  rationale: Глагол הפר может означать нарушение, расторжение или уничтожение силы завета. «Нарушил» ясно передаёт совершённое отступление и не предполагает, будто человек полностью упразднил Божий завет.
theological_decisions:
- issue: Значение заветной санкции כרת — «быть отсечённым»
  choice: Сохранить оборот «будет отсечён», не определяя точный вид кары.
  alternative: «Будет исключён из общины» или «будет предан смерти».
  rationale: Сам стих не уточняет, означает ли формула исключение из сообщества, смерть или иную суровую заветную кару. Буквальный образ сохраняет эту намеренную неопределённость.
- issue: Передача נפש
  choice: «человек»
  alternative: «душа»
  rationale: В данном юридическом контексте נפש обозначает самого человека как носителя ответственности. Вариант «душа» мог бы привнести более узкое позднейшее представление о составе человека.
- issue: Смысл הפר применительно к завету
  choice: «нарушил Мой завет»
  alternative: «расторг Мой завет» или «упразднил Мой завет»
  rationale: «Нарушил» передаёт вину человека, не создавая впечатления, что его поступок уничтожает действенность Божьего завета для всех.
translation_notes:
  register: Современный литературный русский язык с достоинством юридико-заветного постановления. Конкретное выражение «плоть крайней плоти» намеренно сохранено ради близости к еврейскому тексту; традиционное «истреблён» отвергнуто как слишком определённо указывающее на смерть.
