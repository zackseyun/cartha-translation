base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: ru
  text: И рождённый в твоём доме, и тот, кто куплен за твои деньги, непременно должен быть обрезан[a][b][c]. И Мой завет будет в вашей плоти как вечный завет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обязательно должен быть обрезан». В еврейском тексте абсолютный инфинитив употреблён вместе с личной формой того же глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рождённый в твоём доме» и «приобретённый за твои деньги». Речь идёт о людях из дома Авраама — как родившихся в нём, так и приобретённых за плату.'
    reason: cultural_note
  - marker: c
    text: 'Еврейские слова стоят в единственном числе и могут быть переданы: «тот, кто рождён в твоём доме, и тот, кто куплен за твои деньги».'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: непременно должен быть обрезан
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает высказывание. «Непременно должен быть обрезан» естественно передаёт и настоятельность предписания в контексте, и еврейское усиление.
- source_word: יְלִיד בֵּיתְךָ
  choice: рождённый в твоём доме
  rationale: Буквально — «рождённый дома / доморождённый». Формулировка сохраняет индивидуальное обозначение и не добавляет прямо отсутствующее в самом выражении слово «раб».
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: купленный за твои деньги
  rationale: Выражение обозначает человека, приобретённого за плату. «Деньги» в современном русском естественнее буквального «серебро», сохраняя экономический смысл.
- source_word: בְרִיתִי
  choice: Мой завет
  rationale: Прямой и устойчивый эквивалент существительного בְּרִית с суффиксом первого лица; явная лексика завета сохранена.
- source_word: בִּבְשַׂרְכֶם
  choice: в вашей плоти
  rationale: Предлог בְּ здесь прямо передан как «в». Это сохраняет тесную связь завета с телесным знаком, не заменяя её более толковательным выражением.
- source_word: לִבְרִית עוֹלָם
  choice: как вечный завет
  rationale: 'Предлог לְ обозначает роль или результат: завет в плоти пребывает «как вечный завет». Слово עוֹלָם в данном контексте естественно передаётся как «вечный».'
theological_decisions:
- issue: Соотношение телесного знака и завета
  choice: Сохранено прямое утверждение, что Божий завет будет «в вашей плоти как вечный завет».
  alternative: Передать обрезание лишь как символ завета либо, напротив, явно отождествить знак с принадлежностью к завету.
  rationale: Еврейский текст тесно связывает завет с плотью, но не разъясняет здесь точную богословскую природу этой связи. Перевод сохраняет напряжение и не вводит позднейшую доктринальную систему.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «и рождённый…, и купленный…» позволяет естественно сохранить единственное число сказуемого и собирательное обозначение обеих категорий. Прописная буква в «Мой» использована как издательская норма для прямой речи Бога.
