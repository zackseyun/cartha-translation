  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: ru
  text: Так были завершены[a] небеса и земля и всё их воинство[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окончены».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «воинство» означает всю совокупность того, что наполняет небеса и землю.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: были завершены
  rationale: Пассивная форма глагола כלה указывает на достижение полноты и завершённости. «Были завершены» сохраняет результативно-пассивный смысл и естественно звучит по-русски.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Форма שָׁמַיִם обозначает созданную небесную сферу, а не только видимое небо. «Небеса» сохраняет множественное число и возвышенный космологический оттенок.
- source_word: וְהָאָרֶץ
  choice: и земля
  rationale: В повествовании о сотворении אֶרֶץ означает земную область мироздания, а не отдельную страну или территорию.
- source_word: וְכָל
  choice: и всё
  rationale: Союз и слово всеохватности переданы прямо; средний род согласуется с собирательным существительным «воинство».
- source_word: צְבָאָם
  choice: их воинство
  rationale: צָבָא обозначает воинство, множество или упорядоченную совокупность. «Воинство» сохраняет образ организованного множества, а сноска разъясняет его всеобъемлющий смысл в данном контексте.
theological_decisions:
- issue: Объём значения выражения «всё их воинство»
  choice: Всеобъемлющее обозначение всего, что наполняет небеса и землю и принадлежит сотворённому порядку.
  alternative: Только звёзды или небесные светила; либо буквальное войско, расположенное по чинам.
  rationale: Выражение подводит итог сотворению небес и земли, поэтому контекст поддерживает широкий смысл. При этом слово «воинство» сохраняет возможность услышать оттенок упорядоченного множества, не сводя его исключительно к небесным телам.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Небеса» и «воинство» сохраняют образность исходного текста; потенциально неясное значение «воинства» пояснено в сноске.
