  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: ru
  text: а от дерева познания добра и зла не ешь, потому что в день, когда ты вкусишь от него,[a] ты непременно умрёшь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «в день, когда» может употребляться в значении «когда».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: а от дерева
  rationale: Союз וְ с предлогом מִן буквально означает «и/от», но здесь противопоставляет единственный запрет данному ранее разрешению; русское «а от» естественно передаёт и контраст, и исходную предложную конструкцию.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: познания добра и зла
  rationale: Существительное דַּעַת обозначает знание или познание, а сочетание «добро и зло» сохраняет полноту и нравственный вес древнееврейской пары.
- source_word: לֹא תֹאכַל
  choice: не ешь
  rationale: Отрицательная форма глагола выражает прямой запрет. «Не ешь» в современном русском звучит ясно и повелительно, не добавляя модального оттенка «нельзя».
- source_word: כִּי
  choice: потому что
  rationale: כִּי вводит основание запрета. «Потому что» ясно выражает причинную связь и естественно звучит в современном русском.
- source_word: בְּיוֹם אֲכָלְךָ מִמֶּנּוּ
  choice: в день, когда ты вкусишь от него
  rationale: Формулировка сохраняет буквальный временной образ «в день» и повторное מִמֶּנּוּ «от него», а придаточное с «когда» естественно передаёт инфинитивную конструкцию.
- source_word: מוֹת תָּמוּת
  choice: ты непременно умрёшь
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает уверенность и категоричность предсказания. «Непременно умрёшь» передаёт это усиление естественнее для современного русского, чем буквальное «смертью умрёшь».
theological_decisions:
- issue: Временной смысл выражения בְּיוֹם («в день») и исполнение приговора смерти
  choice: Сохранить в основном тексте выражение «в день, когда», не уточняя, означает ли оно немедленную физическую смерть, начало смертности или несомненность смертного приговора.
  alternative: Передать только как «когда» либо истолковать как указание на немедленное исполнение смертного приговора.
  rationale: Древнееврейская формулировка допускает идиоматическое временное понимание, но её буквальный образ создаёт значимое напряжение с дальнейшим повествованием. Перевод не должен устранять это напряжение толкованием.
translation_notes:
  register: Современный литературный русский с ясной повелительной формой и торжественной категоричностью заключительного предупреждения. Начальное «а» предполагает связь с разрешением в предыдущем стихе. Повторное «от него» сохранено во временной части, где оно естественно по-русски и соответствует древнееврейскому тексту.
