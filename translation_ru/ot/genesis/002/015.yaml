source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: ru
  text: И взял Яхве Бог человека и поселил его в Эдемском саду, чтобы он возделывал его и хранил[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он обрабатывал его и охранял». Еврейские глаголы могут означать «работать, обрабатывать, возделывать» и «хранить, охранять, присматривать».'
    reason: lexical_alternative
  - marker: b
    text: Глагол, переведённый как «поселил», может также означать «поместил» или «дал ему покой».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В сочетании יְהוָה אֱלֹהִים сохраняет как личное имя, так и общий божественный титул.
- source_word: הָאָדָם
  choice: человека
  rationale: В контексте речь идёт о конкретном ранее сотворённом человеке; русская форма естественна после глагола «взял».
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямое и нейтральное соответствие глаголу לקח в данном повествовательном контексте.
- source_word: וַיַּנִּחֵהוּ
  choice: поселил его
  rationale: Hiphil глагола נוח допускает значения «поместить», «дать покой», «поселить». «Поселил» естественно описывает введение человека в сад и отчасти сохраняет оттенок устроения на месте.
- source_word: בְּגַן עֵדֶן
  choice: в Эдемском саду
  rationale: Естественная современная русская форма, сохраняющая имя собственное Эдем.
- source_word: לְעָבְדָהּ
  choice: чтобы он возделывал его
  rationale: При объекте «сад» עבד имеет сельскохозяйственный смысл «обрабатывать, возделывать»; личная конструкция с «чтобы» звучит по-русски естественнее инфинитивной цепочки.
- source_word: וּלְשָׁמְרָהּ
  choice: и хранил
  rationale: שמר охватывает заботу, сохранение, наблюдение и охрану; «хранил» не сужает смысл до вооружённой защиты.
theological_decisions:
- issue: Характер поручения человеку в Эдеме
  choice: Передать обычные значения «возделывать» и «хранить», не вводя в основной текст специальную культовую трактовку.
  alternative: Понимать сочетание прежде всего как указание на священническое служение и охрану святилища либо исключительно как сельскохозяйственный труд.
  rationale: Глаголы עבד и שמר допускают более широкие ассоциации, однако сам стих не требует однозначной типологической или культовой интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет последовательность еврейского рассказа. Местоимение «его» грамматически относится к саду; сноска раскрывает диапазон обоих глаголов.
