base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: ru
  text: 'И сказал человек: «Вот, наконец, кость от костей моих и плоть от плоти моей; она будет называться женщиной[a], потому что взята от мужчины».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские слова «женщина» (ишша́) и «мужчина» (иш) созвучны; далее происхождение женщины от мужчины служит объяснением её названия.
    reason: Непередаваемая по-русски игра слов אִשָּׁה / אִישׁ.
lexical_decisions:
- source_word: הָאָדָם
  choice: человек
  rationale: В повествовании это конкретный первый человек; русское «человек» естественно передаёт אָדָם и не смешивает его с последующим אִישׁ, участвующим в игре слов.
- source_word: זֹאת הַפַּעַם
  choice: вот наконец
  rationale: Передаёт идиоматический возглас узнавания и свершения; буквальное «на этот раз» возможно, но в данном контексте звучит менее естественно.
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  choice: кость от костей моих и плоть от плоти моей
  rationale: «От» сохраняет значение מִן и подчёркивает происхождение; параллелизм и торжественная формула остаются ясными по-русски.
- source_word: לְזֹאת יִקָּרֵא אִשָּׁה
  choice: она будет называться женщиной
  rationale: Естественная русская формула именования; местоимение передаёт женский указательный референт זֹאת без тяжеловесного повторения «эта».
- source_word: אִשָּׁה ... אִישׁ
  choice: женщина ... мужчина
  rationale: Это точные современные соответствия, однако звуковая игра еврейских слов в русском языке не воспроизводится и поэтому отмечена сноской.
- source_word: כִּי מֵאִישׁ לֻקֳחָה זֹּאת
  choice: потому что взята от мужчины
  rationale: Сохраняет причинную связь, пассивную форму и происхождение, выраженное предлогом מִן; финальное זֹאת естественно подразумевается субъектом женского рода.
theological_decisions:
- issue: Различение אָדָם и אִישׁ
  choice: человек ... мужчина
  alternative: мужчина ... мужчина
  rationale: 'Так сохраняется лексическое различие исходного текста: הָאָדָם обозначает конкретного человека повествования, а אִישׁ образует пару с אִשָּׁה. Это не навязывает стиху более широкого антропологического вывода.'
- issue: Значение пары אִישׁ / אִשָּׁה
  choice: мужчина / женщина
  alternative: муж / жена
  rationale: Контекст допускает брачное измерение, но сами слова здесь служат именованию полов и игре слов; «муж/жена» преждевременно сужало бы смысл.
translation_notes:
  register: Современный литературный русский с умеренно торжественным ритмом. Инверсия «костей моих / плоти моей» сохраняет поэтическую формулу, оставаясь понятной. Единственный маркер [a] помещён непосредственно после слова, к которому относится сноска.
