  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: ru
  text: И благословил Бог седьмой день и освятил его[a], потому что в этот день Он отдыхал[b] от всей Своей работы, которую Бог сотворил, чтобы совершить[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятил его»; «отделил его как святой день».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать «перестал» или «прекратил работу».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «которую Бог сотворил, чтобы совершить». Заключительная фраза трудна для понимания; возможны также переводы: «которую Бог сотворил и совершил» или «которую Бог сотворил, совершая».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: 'Прямой и естественный эквивалент piel глагола ברך: Бог дарует седьмому дню благословение.'
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Существительное согласовано с глаголами в единственном числе и здесь обозначает единого Бога.
- source_word: יוֹם הַשְּׁבִיעִי
  choice: седьмой день
  rationale: Точная и естественная передача существительного с порядковым числительным и определённым артиклем.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: освятил его
  rationale: Глагол קדש в piel означает сделать святым, посвятить или отделить как святыню. «Освятил» кратко и точно сохраняет сакральный смысл.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину благословения и освящения седьмого дня.
- source_word: בּוֹ
  choice: в этот день
  rationale: Контекстуально ясная русская передача местоименной конструкции, относящейся к седьмому дню.
- source_word: שָׁבַת
  choice: отдыхал
  rationale: Передаёт традиционный и контекстуально значимый смысл прекращения работы и сохраняет связь с субботой; возможность перевода «перестал» отмечена в сноске.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: от всей Своей работы
  rationale: מלאכה обозначает работу или совершаемое дело; «работа» понятно современному читателю и естественно сочетается с «отдыхал».
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: которую Бог совершил, творя
  rationale: Формулировка передаёт оба глагольных элемента, ברא и עשה, в естественном русском синтаксисе, не выдавая спорное отношение инфинитива לַעֲשׂוֹת за однозначное; буквальная и альтернативные трактовки приведены в сноске.
theological_decisions:
- issue: Значение שָׁבַת и его связь с субботой
  choice: отдыхал
  alternative: перестал работать; прекратил
  rationale: «Отдыхал» сохраняет канонически значимую связь с субботним покоем, но само по себе не требует представления о Божьей усталости. Лексическое значение прекращения деятельности указано в сноске.
- issue: Освящение седьмого дня
  choice: освятил его
  alternative: отделил его как святой; посвятил его
  rationale: Основной текст сохраняет прямой язык святости, не сводя действие лишь к функциональному отделению дня.
- issue: Неясная заключительная конструкция ברא ... לעשות
  choice: которую Бог совершил, творя
  alternative: которую Бог сотворил, чтобы делать; которую Бог сотворил и сделал
  rationale: Еврейская конструкция допускает разные синтаксические объяснения. Основной вариант остаётся читаемым, а сноска сохраняет буквальную необычность и основные альтернативы, не превращая одну из них в бесспорное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским порядком слов. «Освятил» сохранено как широко понятное богословски значимое слово. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой. Трудная заключительная конструкция сделана читаемой, но её неоднозначность явно сохранена в сноске.
