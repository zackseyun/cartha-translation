  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: ru
  text: И создал Господь Бог из ребра[a], которое взял у человека, женщину и привёл её к человеку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из части бока»; еврейское слово может означать также «сторону».'
    reason: Сохраняет семантическую неоднозначность צֵלָע между традиционным «ребром» и более широким значением «сторона, часть бока».
lexical_decisions:
- source_word: וַיִּבֶן
  choice: создал
  rationale: Буквально глагол означает «построил», однако в сочетании с материалом и результатом естественное русское «создал из» передаёт образ целенаправленного устроения, не создавая неуместного архитектурного оттенка.
- source_word: יְהוָה אֱלֹהִים
  choice: Господь Бог
  rationale: Традиционная и понятная русская передача сочетания личного имени Бога с титулом; «Господь» оформлено с прописной буквы без искусственной капитализации всего слова.
- source_word: הַצֵּלָע
  choice: ребра
  rationale: В данном повествовательном контексте традиционное значение «ребро» уместно, хотя еврейское слово может шире обозначать бок или сторону; неоднозначность отмечена в сноске.
- source_word: הָאָדָם
  choice: человека
  rationale: С определённым артиклем здесь обозначает человека, ранее созданного Богом; нарицательная передача сохраняет связь с общим словом «человек», не превращая его без необходимости в личное имя.
- source_word: לְאִשָּׁה
  choice: женщину
  rationale: 'Конструкция с ל выражает результат: ребро было устроено как женщина; по-русски это естественно передаётся конструкцией «создал из ребра женщину».'
- source_word: וַיְבִאֶהָ אֶל־הָאָדָם
  choice: и привёл её к человеку
  rationale: Прямая и естественная передача действия и направления; местоимение женского рода однозначно относится к женщине.
theological_decisions:
- issue: Передача образа «строительства» женщины
  choice: создал ... женщину
  alternative: построил ... в женщину / устроил ... в женщину
  rationale: Глагол בנה сознательно отличается от обычного «сделал», но буквальное «построил ребро в женщину» в современном русском звучит ненормативно. «Создал из» сохраняет деятельное формирование и указание на исходный материал, не навязывая дополнительного догматического смысла.
- issue: Значение צלע
  choice: ребро с текстовой сноской об альтернативе
  alternative: сторона / часть бока
  rationale: Контекст допускает традиционное анатомическое понимание, но лексема в других местах часто означает «сторону». Сноска сохраняет реальную лексическую широту, не перегружая основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и понятным; сохранены повтор «человек» и последовательность действий оригинала.
