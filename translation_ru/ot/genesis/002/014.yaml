source:
  edition: WLC
  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: ru
  text: Имя третьей реки — Хиддекель[a]; она течёт к востоку от Ашшура[b]. А четвёртая река — Евфрат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хиддекель традиционно отождествляют с рекой Тигр.
    reason: alternative_reading
  - marker: b
    text: 'Или: «к востоку от Ассирии»; по-еврейски: «к востоку от Ашшура».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: имя
  rationale: Прямое значение слова; естественно сохраняется в формуле именования реки.
- source_word: נָּהָר
  choice: река
  rationale: Обычное значение еврейского слова и наиболее уместный вариант в данном контексте.
- source_word: שְּׁלִישִׁי
  choice: третья
  rationale: Прямая передача порядкового числительного с согласованием со словом «река».
- source_word: חִדֶּקֶל
  choice: Хиддекель
  rationale: Передаёт еврейскую форму названия, не подменяя её традиционным отождествлением; «Тигр» указан в примечании.
- source_word: הוּא
  choice: она
  rationale: Местоимение соотнесено с русским существительным женского рода «река»; отдельная связка в настоящем времени не требуется.
- source_word: הֹלֵךְ
  choice: течёт
  rationale: Для реки это естественный современный русский эквивалент еврейского причастия со значением движения.
- source_word: קִדְמַת
  choice: к востоку от
  rationale: Передаёт географическое значение конструкта, сохраняя пространственное отношение без излишнего уточнения.
- source_word: אַשּׁוּר
  choice: Ашшур
  rationale: Транслитерация еврейского собственного имени сохраняет неоднозначность между городом, землёй и Ассирией; географическая альтернатива дана в примечании.
- source_word: רְבִיעִי
  choice: четвёртая
  rationale: Прямая передача порядкового числительного с согласованием со словом «река».
- source_word: פְרָת
  choice: Евфрат
  rationale: Устоявшееся русское название реки ясно и естественно для современного читателя.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского: именная формула передана через тире, а применительно к реке употреблён глагол «течёт». Союз ו перед последним предложением передан как «А», чтобы сохранить переход к четвёртой реке без тяжеловесного повторения.'
