id: GEN.2.7
reference: Genesis 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: ru
  text: И создал Господь Бог человека из праха земного, и вдохнул в его ноздри дыхание жизни, и стал человек живым существом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «живой душой»; то есть целостным живым существом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Господь Бог
  rationale: Устойчивое и понятное русское соответствие сочетанию личного имени Бога с титулом; передача «Господь» сохраняет принятую в русской библейской традиции замену тетраграмматона.
- source_word: וַיִּיצֶר
  choice: создал
  rationale: В данном контексте глагол означает придание формы, подобно работе мастера. «Создал» звучит естественно и достойно по-русски, хотя образ формования выражает менее явно, чем «вылепил».
- source_word: הָאָדָם
  choice: человека / человек
  rationale: Здесь речь идёт об отдельном человеке, но до появления имени Адам слово остаётся нарицательным. Русское «человек» сохраняет эту особенность лучше, чем преждевременное употребление имени.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: из праха земного
  rationale: Передаёт материал, из которого создан человек, и сохраняет традиционный библейский образ праха. Русская фраза естественна, хотя еврейская игра слов אָדָם / אֲדָמָה воспроизводится лишь частично.
- source_word: בְּאַפָּיו
  choice: в его ноздри
  rationale: Сохраняет телесную конкретность еврейского выражения и естественно звучит по-русски.
- source_word: נִשְׁמַת חַיִּים
  choice: дыхание жизни
  rationale: Точно и идиоматично передаёт сочетание; множественное חַיִּים здесь имеет отвлечённое значение.
- source_word: וַיְהִי ... לְנֶפֶשׁ חַיָּה
  choice: стал ... живым существом
  rationale: Глагол выражает переход в новое состояние, а נֶפֶשׁ חַיָּה обозначает целое живое существо, не обязательно отдельную от тела нематериальную душу.
theological_decisions:
- issue: Передача הָאָדָם
  choice: человек
  alternative: Адам; человеческое существо
  rationale: Нарицательное «человек» соответствует текущему этапу повествования и не заставляет текст преждевременно звучать как собственное имя, сохраняя при этом индивидуальный референт.
- issue: Передача לְנֶפֶשׁ חַיָּה
  choice: живое существо
  alternative: живая душа; живое создание
  rationale: Выражение описывает человека как целостное одушевлённое живое существо. «Живая душа» допустима как традиционная передача, но в современном русском может ошибочно подразумевать отделимую нематериальную часть человека.
- issue: Передача имени יְהוָה
  choice: Господь
  alternative: Яхве
  rationale: «Господь Бог» является естественной и узнаваемой русской библейской формой. Транслитерация «Яхве» точнее показывает личное имя, но менее привычна в широком литературном употреблении.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранена последовательность кратких сочинённых предложений оригинала. Традиционные слова «прах земной» употреблены там, где они остаются понятными современному читателю; потенциально вводящее в заблуждение «живая душа» вынесено в примечание.
