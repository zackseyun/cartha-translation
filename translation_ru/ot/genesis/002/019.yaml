  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: ru
  text: Господь Бог образовал из земли всех полевых животных и всех небесных птиц[a] и привёл их к человеку, чтобы увидеть, как он их назовёт. И какое имя человек давал каждому живому существу[b], таким и было его имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уже образовал». Древнееврейская глагольная форма обычно передаётся простым прошедшим временем, однако в данном контексте действие можно понимать как предшествовавшее приведению животных к человеку.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Адам». В древнееврейском тексте стоит ха-адам, буквально «человек».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: образовал
  rationale: Простое прошедшее время прямо передаёт повествовательную форму wayyiqtol. Контекст допускает понимание действия как предшествующего приведению животных, но древнееврейская форма сама по себе не выражает плюсквамперфект.
- source_word: יְהוָה אֱלֹהִים
  choice: Господь Бог
  rationale: Традиционная и естественная для русского библейского регистра передача составного Божественного наименования; «Господь» передаёт тетраграмматон без реконструкции произношения в основном тексте.
- source_word: מִן הָאֲדָמָה
  choice: из земли
  rationale: Естественно передаёт почву, земной грунт и сохраняет смысловую связь между אֲדָמָה и человеком в ближайшем контексте.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: всех полевых животных
  rationale: Сохраняет образное определение «поля» и не сужает выражение до строго диких животных.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: всех небесных птиц
  rationale: Краткая, литературная передача птиц, летающих в небесном пространстве; в данном контексте עוֹף естественно понимать как птиц.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: и привёл их к человеку
  rationale: Местоимение «их» восполняет подразумеваемый множественный объект, необходимый в русском; הָאָדָם передано нарицательно согласно форме с артиклем.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: чтобы увидеть, как он их назовёт
  rationale: Передаёт инфинитив цели и естественное русское выражение для присвоения имён, сохраняя буквальный мотив Божьего наблюдения.
- source_word: וְכֹל אֲשֶׁר יִקְרָא לוֹ הָאָדָם נֶפֶשׁ חַיָּה
  choice: И как бы человек ни назвал каждое живое существо
  rationale: Русская уступительно-обобщительная конструкция естественно выражает открытое дистрибутивное значение כֹל אֲשֶׁר; «живое существо» не привносит позднейших ассоциаций слова «душа».
- source_word: הוּא שְׁמוֹ
  choice: таково и было его имя
  rationale: Естественно передаёт именную древнееврейскую фразу и подчёркивает, что данное человеком название становилось именем существа.
theological_decisions:
- issue: Повествовательное время וַיִּצֶר и последовательность творения
  choice: Простое прошедшее «образовал» с примечанием о возможном предпрошедшем понимании
  alternative: «уже образовал»
  rationale: Wayyiqtol обычно продвигает повествование и формально не маркирует предпрошедшее время. Контекстуальное понимание предшествующего действия возможно, поэтому оно сохранено в примечании без гармонизирующего уточнения основного текста.
- issue: Нарицательное или собственное значение הָאָדָם
  choice: «человек»
  alternative: «Адам»
  rationale: Артикль и продолжающаяся связь с אֲדָמָה поддерживают нарицательное значение. Традиционное понимание как имени отмечено в сноске.
- issue: Антропоморфное выражение «чтобы увидеть» применительно к Богу
  choice: Сохранено буквально
  alternative: «чтобы узнать» или «посмотреть»
  rationale: Текст прямо употребляет לִרְאוֹת, и перевод не должен заранее разрешать богословское напряжение, связанное с Божьим знанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; сохранены повтор мотива называния и намеренная неоднозначность повествовательного времени.
