  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: ru
  text: И насадил Яхве Бог сад в Эдеме, на востоке[a], и поместил там человека, которого создал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к востоку». Еврейское выражение может обозначать как местоположение («на востоке»), так и направление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: насадил
  rationale: Глагол נטע обозначает посадку растений; в сочетании с «садом» естественное русское соответствие — «насадил».
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהִים — обычным русским словом «Бог».
- source_word: גַּן
  choice: сад
  rationale: גן означает сад, то есть возделываемое или ограждённое место; «сад» ясно и точно передаёт смысл в данном контексте.
- source_word: בְעֵדֶן
  choice: в Эдеме
  rationale: עֵדֶן здесь является географическим названием; предложная форма естественно передаётся как «в Эдеме».
- source_word: מִקֶּדֶם
  choice: на востоке
  rationale: В контексте выражение, вероятнее всего, указывает местоположение сада. Возможное направительное значение сохранено в сноске.
- source_word: וַיָּשֶׂם שָׁם
  choice: поместил там
  rationale: שׂים означает «положить, поставить, поместить»; применительно к человеку «поместил» звучит естественно и достоинственно, а שָׁם прямо передано словом «там».
- source_word: הָאָדָם
  choice: человека
  rationale: Определённая форма указывает на конкретного человека, ранее созданного Богом. В русском после «поместил» требуется винительный падеж.
- source_word: אֲשֶׁר יָצָר
  choice: которого создал
  rationale: יצר буквально значит «формировать, ваять, создавать». «Создал» естественно в русском и сохраняет отсылку к предшествующему акту формирования; последовательность уже ясна из контекста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя יהוה; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Передача הָאָדָם
  choice: человек
  alternative: мужчина / Адам
  rationale: В данном месте выражение обозначает конкретного созданного человека, но ещё не обязательно функционирует как личное имя; «человек» сохраняет эту смысловую связь и не вносит преждевременно имя «Адам».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «И» сохраняет повествовательную связь с предыдущим стихом. Синтаксис прост и доступен; неоднозначность מִקֶּדֶם отмечена сноской.
