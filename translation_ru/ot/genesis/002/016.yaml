source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: ru
  text: 'И Яхве Бог повелел человеку: «Со всякого дерева в саду ты можешь свободно есть[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст усиливает глагол повторением однокоренных форм; возможная передача: «можешь есть без всякого ограничения».'
    reason: Уточнение усилительной конструкции אָכֹל תֹּאכֵל и возможной смысловой передачи.
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол צוה обозначает властное повеление; «повелел» точно передаёт его силу и естественно звучит в данном повествовании.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Сочетание сохраняет личное имя יְהוָה и обычное русское соответствие для אֱלֹהִים.
- source_word: עַל הָאָדָם
  choice: человеку
  rationale: При צוה предлог עַל указывает на адресата повеления. הָאָדָם здесь означает конкретного созданного человека; русское «человеку» естественно и не превращает обозначение человека в имя собственное.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула вводит прямую речь. В современном русском её функцию естественно передаёт двоеточие, без тяжеловесного «сказав».
- source_word: מִכֹּל עֵץ הַגָּן
  choice: со всякого дерева в саду
  rationale: «Со всякого дерева» передаёт מן с глаголом еды, а «в саду» естественно выражает принадлежность дерева к саду, не меняя объёма разрешения.
- source_word: אָכֹל תֹּאכֵל
  choice: ты можешь свободно есть
  rationale: Инфинитив абсолютный при личной форме усиливает глагольную идею. В контексте это разрешение, поэтому «можешь свободно есть» передаёт и модальность, и усиление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Значение הָאָדָם
  choice: человек
  alternative: мужчина; Адам
  rationale: В данном месте речь идёт о конкретном человеке, но форма ещё сохраняет нарицательное значение; «человек» не вводит преждевременно имя собственное и не сужает смысл до обозначения пола.
- issue: Модальность אָכֹל תֹּאכֵל
  choice: можешь свободно есть
  alternative: непременно будешь есть; ешь
  rationale: Хотя усиленная конструкция допускает более буквальную передачу уверенности, ближайший контекст представляет эти слова как широкое разрешение перед последующим запретом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Формальное «сказав» заменено нормативным двоеточием; архаизмы и конфессионально окрашенные замены личного имени исключены.
