  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: ru
  text: И человек дал имена всему скоту, небесным птицам и всем полевым зверям, но для человека не нашлось помощника, соответствующего ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он не нашёл помощника, соответствующего ему». Возможный перевод: «но человек не нашёл помощника, подходящего ему». Слово «человек» здесь также может быть передано именем «Адам».'
    reason: Сохраняет активную грамматическую форму еврейского текста, лексическую альтернативу для כְּנֶגְדּוֹ и возможность воспринимать אָדָם как личное имя.
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: человек / для человека
  rationale: 'Артикль при первом употреблении подчёркивает нарицательное значение: речь идёт о конкретном человеке в повествовании. Передача «Адам» возможна, но здесь преждевременно превращает обозначение человека в однозначное личное имя.'
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: дал ... имена
  rationale: Еврейское выражение означает присвоение имён; русский оборот естественен и сохраняет множественное число «имена».
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: В данном перечислении слово обозначает домашних животных как класс и противопоставлено полевым зверям.
- source_word: עוֹף הַשָּׁמַיִם
  choice: небесные птицы
  rationale: Достоинная и понятная передача устойчивого еврейского выражения; она сохраняет образ связи птиц с небом.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: все полевые звери
  rationale: Выражение относится к недомашним наземным животным. «Полевые звери» сохраняет образ оригинала и естественно звучит в библейском повествовательном регистре.
- source_word: עֵזֶר
  choice: помощник
  rationale: Существительное может обозначать помощь или того, кто помогает. В контексте искомого партнёра «помощник» передаёт личное значение и само по себе не подразумевает подчинённости.
- source_word: כְּנֶגְדּוֹ
  choice: соответствующий ему
  rationale: Передаёт идею находящегося напротив и соотносимого с человеком партнёра, не сводя значение лишь к удобству или пригодности.
- source_word: לֹא מָצָא
  choice: не нашлось
  rationale: Хотя еврейская форма буквально активна — «он не нашёл», безличная русская конструкция естественно выражает итог поиска и сохраняет повествовательный фокус.
theological_decisions:
- issue: Значение אָדָם в Бытии 2:20
  choice: человек
  alternative: Адам
  rationale: Контекст говорит о конкретном мужчине, но нарицательное значение слова всё ещё заметно. «Человек» сохраняет эту литературную неоднозначность лучше, чем однозначное личное имя.
- issue: Характер выражения עֵזֶר כְּנֶגְדּוֹ
  choice: помощник, соответствующий ему
  alternative: помощник, подходящий ему
  rationale: Выбранная формулировка сохраняет взаимную соотнесённость, выраженную כְּנֶגְדּוֹ, и не привносит представления о неполноценности или подчинённом положении помощника.
- issue: Грамматический субъект לֹא מָצָא
  choice: безличное «не нашлось»
  alternative: «он не нашёл»
  rationale: Безличная передача идиоматична по-русски, однако активная форма оригинала является подлинной альтернативой и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Синтаксис остаётся ясным; традиционные слова «скот» и «полевые звери» точно поддерживают противопоставление домашних и диких животных.
