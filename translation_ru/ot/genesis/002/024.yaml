id: GEN.2.24
reference: Genesis 2:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: ru
  text: Поэтому мужчина оставит отца и мать, прилепится к своей жене[a], и они станут одной плотью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепко соединится со своей женой». Еврейский глагол выражает сильную привязанность, подобную тесному сцеплению.'
    reason: lexical_alternative
  - marker: b
    text: «Одна плоть» — еврейское выражение, включающее телесное единение и образование новой родственной связи.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассказа и естественно звучит в современном русском языке.
- source_word: יַעֲזָב
  choice: оставит
  rationale: Форма выражает общее, имеющее нормативный оттенок положение, а не прямое повеление; будущее время естественно передаёт это по-русски.
- source_word: אִישׁ
  choice: мужчина
  rationale: Сохраняет явно мужской род и обобщённо-представительный смысл еврейского существительного, не подменяя его словом «человек» или контекстуально возможным, но менее точным «муж».
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: отца и мать
  rationale: Еврейский текст прямо называет обоих родителей; притяжательность в русском ясна из подлежащего и не требует повторения «своих».
- source_word: וְדָבַק
  choice: прилепится
  rationale: Передаёт сильную привязанность и соединение; слово сохраняет образность еврейского глагола и остаётся понятным в современном литературном русском.
- source_word: בְּאִשְׁתּוֹ
  choice: к своей жене
  rationale: В данном брачном контексте אִשָּׁה с суффиксом означает именно жену; предлог «к» соответствует русскому управлению глагола «прилепиться».
- source_word: וְהָיוּ
  choice: и они станут
  rationale: Множественное число глагола позволяет естественно выразить подразумеваемых мужчину и жену местоимением «они»; «станут» передаёт наступление нового состояния.
- source_word: לְבָשָׂר אֶחָד
  choice: одной плотью
  rationale: Сохраняет традиционный и точный образ, включающий телесное единство и образование новой родственной связи, не сводя смысл только к телу.
theological_decisions:
- issue: Гендерно маркированная формулировка брака
  choice: мужчина
  alternative: человек; некто; муж
  rationale: אִישׁ имеет мужской род и здесь представляет мужскую сторону брачного союза; нейтрализация рода скрыла бы форму исходного текста.
- issue: Характер высказывания
  choice: 'Будущее время как общее нормативное положение: «оставит… прилепится… станут»'
  alternative: Прямое повеление; описание только древнего обычая
  rationale: Еврейские глагольные формы выражают общий принцип, выведенный из повествования о сотворении, но грамматически не являются прямым императивом.
- issue: Смысл выражения «одна плоть»
  choice: Сохранить образ без поясняющего расширения в основном тексте
  alternative: одно тело; единое целое
  rationale: 'Буквальный образ намеренно ёмок: он охватывает телесный союз и новую родственную связь. Более разъясняющие варианты могли бы сузить или преждевременно разрешить эту смысловую напряжённость.'
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис краткий и афористичный. «Прилепится» слегка возвышенно, но понятно и точно сохраняет образ исходного текста; сноска предлагает более разговорно прозрачную альтернативу.
