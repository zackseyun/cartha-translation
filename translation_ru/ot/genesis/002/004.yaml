    text: 'Буквально: «в день, когда Яхве Бог создал…»; оборот «в день» может означать просто «когда» или «в то время, когда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Вот происхождение
  rationale: Формула вводит новый раздел Бытия. «Происхождение» передаёт связь תוֹלְדוֹת с порождением и началом, но не ограничивает смысл родословием; указательное אֵלֶּה естественно передано словом «вот».
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: неба и земли
  rationale: Устойчивая русская пара обозначает весь сотворённый мир. Единственное число «небо» в современном русском естественнее и не обязано воспроизводить морфологическое число שָׁמַיִם.
- source_word: בְּהִבָּרְאָם
  choice: когда они были сотворены
  rationale: Передаёт временное значение конструкции с инфинитивом и местоименным суффиксом, а также страдательный залог формы Niphal.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: Когда … создал
  rationale: Идиома בְּיוֹם здесь означает время события, а не обязательно отдельный календарный день; русское «когда» ясно и естественно.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Сохраняет личное имя YHWH и следующее за ним обозначение אֱלֹהִים без замены имени титулом.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: землю и небо
  rationale: Сохранён обратный по отношению к первой половине порядок слов, создающий литературное обрамление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Текст прямо содержит тетраграмматон; транслитерация отличает личное имя от титула и не вносит конфессионального толкования.
- issue: Значение בְּיוֹם в повествовании о творении
  choice: когда
  alternative: в день, когда
  rationale: Это обычная временная идиома. Перевод «когда» не заставляет читателя понимать выражение как указание на один календарный день и сохраняет допустимый диапазон смысла.
- issue: Связь заголовка с предыдущим или последующим повествованием
  choice: сохранена формульная двусмысленность
  alternative: «Вот рассказ о сотворении…»
  rationale: תוֹלְדוֹת может обозначать происхождение, историю или последующее развитие. Перевод не уточняет насильно направление заголовка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула заголовка передана естественно, без архаизма «вот родословие»; личное имя передано как «Яхве». Все маркеры сносок присутствуют в основном тексте.
