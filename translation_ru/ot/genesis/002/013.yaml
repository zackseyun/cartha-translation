base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: ru
  text: Имя второй реки — Гихон; она обтекает всю землю Куш[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Куш — древнее географическое название, традиционно связываемое с землями к югу от Египта.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם הַ/נָּהָר הַ/שֵּׁנִי
  choice: Имя второй реки
  rationale: Естественная русская конструкция точно передаёт продолжение перечня рек; союз וְ допустимо не выражать отдельно, поскольку последовательность ясна из контекста.
- source_word: גִּיחוֹן
  choice: Гихон
  rationale: Древнее собственное имя передано принятой русской транслитерацией, а не переводится.
- source_word: הוּא הַ/סּוֹבֵב
  choice: она огибает
  rationale: Местоимение соотнесено с русским существительным женского рода «река»; причастие от סבב описывает движение вокруг или охват территории, и «огибает» сохраняет эту смысловую широту без излишней топографической конкретизации.
- source_word: אֵת כָּל אֶרֶץ
  choice: всю землю
  rationale: Прямо и естественно передаёт כָּל אֶרֶץ как всю названную область.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Сохранено древнее географическое название; замена на «Эфиопия» была бы интерпретирующей и потенциально анахроничной.
