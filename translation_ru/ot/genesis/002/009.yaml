source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: ru
  text: И Яхве Бог произрастил из почвы всякое дерево, приятное на вид и пригодное в пищу, и дерево жизни посреди сада, и дерево познания добра и зла.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «познание добра и зла» сохранено буквально. Его понимают по-разному: как нравственное различение, достижение зрелости или всеобъемлющее знание. Кроме того, еврейский синтаксис не позволяет с полной уверенностью определить, относится ли выражение «посреди сада» только к дереву жизни или к обоим названным деревьям.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: произрастил
  rationale: Каузативная порода hифиль передаёт действие Бога, который сделал так, что деревья выросли; «произрастил» сохраняет эту каузативность и соответствует возвышенному повествовательному регистру.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Личное имя יהוה передано как «Яхве», а אֱלֹהִים — как «Бог», без замены имени титулом.
- source_word: מִן הָאֲדָמָה
  choice: из земли
  rationale: אֲדָמָה обозначает почву, землю, из которой произрастают растения; «из земли» естественно по-русски и сохраняет связь с контекстом сотворения человека.
- source_word: כָּל עֵץ
  choice: всякое дерево
  rationale: Единственное число после כָּל имеет распределительное значение; «всякое дерево» передаёт его прямо и естественно.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: приятное на вид
  rationale: Фраза обозначает визуальную привлекательность; этот вариант точен, современен и не усиливает значение до желания обладать.
- source_word: וְטוֹב לְמַאֲכָל
  choice: и хорошее для пищи
  rationale: Близко воспроизводит еврейскую конструкцию и указывает на пригодность дерева или его плода в пищу.
- source_word: וְעֵץ הַחַיִּים
  choice: дерево жизни
  rationale: Прямой и закрепившийся перевод конструкции сопряжённого состояния.
- source_word: בְּתוֹךְ הַגָּן
  choice: посреди сада
  rationale: Передаёт расположение внутри или в середине сада без излишнего уточнения геометрического центра.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: дерево познания добра и зла
  rationale: Сохраняет буквальную и богословски значимую формулу, не сводя её к одному из спорных толкований.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение выражения «познание добра и зла»
  choice: Сохранить буквальное выражение
  alternative: нравственное различение; зрелость; всеобъемлющее знание
  rationale: Еврейская формула допускает несколько толкований, поэтому основной текст не разрешает эту неоднозначность.
- issue: Синтаксическая связь «посреди сада»
  choice: Не утверждать однозначно, что обстоятельство относится к обоим названным деревьям
  alternative: Явно поместить оба дерева посреди сада
  rationale: Положение וְעֵץ הַחַיִּים בְּתוֹךְ הַגָּן непосредственно связывает местоположение с деревом жизни, тогда как синтаксический охват следующего упоминания дерева познания не вполне однозначен.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Начальное «И» сохраняет последовательность еврейского повествования; «произрастил» выбрано ради каузативности формы, несмотря на его несколько высокий регистр.
