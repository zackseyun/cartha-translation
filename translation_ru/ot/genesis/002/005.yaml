id: GEN.2.5
reference: Genesis 2:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: ru
  text: И ещё не было на земле ни одного полевого кустарника[a], и ещё не взошло ни одно полевое растение, потому что Яхве Бог[b] ещё не дал дождя на землю, и не было человека, чтобы возделывать почву[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полевого куста».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Господь Бог». В еврейском тексте здесь стоит личное имя Бога — Яхве.'
    reason: alternative_reading
  - marker: c
    text: Еврейские слова, переведённые как «человек» (адам) и «почва» (адама), созвучны.
    reason: wordplay
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: полевой кустарник
  rationale: שִׂיחַ обозначает кустарник или куст; выбранный вариант сохраняет отличие от עֵשֶׂב в следующей части стиха.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: ещё не было на земле
  rationale: טֶרֶם выражает состояние, которое до данного момента ещё не наступило; בָאָרֶץ в контексте сотворения передано как «на земле».
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: полевое растение
  rationale: עֵשֶׂב широко обозначает травянистую растительность; «растение» понятно современному читателю и не сужает значение до травы или съедобной зелени.
- source_word: טֶרֶם יִצְמָח
  choice: ещё не взошло
  rationale: צמח означает прорастать или всходить; «взошло» естественно описывает появление растительности из почвы.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отсутствия названной растительности.
- source_word: הִמְטִיר
  choice: не посылал дождя
  rationale: Каузативная форма глагола מטר указывает, что Бог давал дождю идти; русское «посылал дождь» естественно передаёт эту причинность без тяжеловесной конструкции.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהִים — словом «Бог».
- source_word: וְאָדָם אַיִן
  choice: и не было человека
  rationale: אָדָם здесь обозначает человека как представителя человечества, необходимого для обработки земли; «человек» сохраняет единственное число и не вносит лишнего гендерного уточнения.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: чтобы возделывать почву
  rationale: עבד в земледельческом контексте означает обрабатывать или возделывать, а אֲדָמָה — почву, пригодную для обработки.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: земля / почва
  rationale: Разные русские слова сохраняют смысловое различие между אֶרֶץ как землёй в широком смысле и אֲדָמָה как обрабатываемой почвой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация сохраняет его как имя, а примечание сообщает традиционный вариант.
- issue: Значение אָדָם в данном контексте
  choice: человек
  alternative: мужчина
  rationale: Слово указывает на человека как земледельца и представителя человечества; контекст не требует сужать его значение до обозначения мужского пола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное וְ передано союзом «И», поскольку стих продолжает предшествующее повествование. Парные конструкции с «ещё не» сохраняют структуру и временное соотношение еврейского текста.
