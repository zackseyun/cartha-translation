  text: И мужчина, и его жена были наги и не стыдились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: И были
  rationale: Форма היה с повествовательным союзом связывает стих с предыдущим рассказом; при именном сказуемом естественно передаётся простым прошедшим временем «были».
- source_word: שְׁנֵיהֶם
  choice: они оба
  rationale: Выражение буквально означает «двое из них / оба они» и подчёркивает, что сказанное относится к обоим членам пары.
- source_word: עֲרוּמִּים
  choice: наги
  rationale: Прилагательное обозначает отсутствие одежды. «Наги» точно, кратко и соответствует достоинству библейского повествования; форма множественного числа относится к обоим.
- source_word: הָאָדָם
  choice: человек
  rationale: В данном контексте имеется в виду конкретный мужчина рядом со своей женой. «Человек» сохраняет обычное повествовательное обозначение הָאָדָם в этом разделе, а уточнение «его жена» исключает обобщённое значение человечества.
- source_word: וְאִשְׁתּוֹ
  choice: и его жена
  rationale: Существительное אִשָּׁה с притяжательным суффиксом естественно означает здесь «его жена» и продолжает брачную формулировку предыдущего стиха.
- source_word: וְלֹא יִתְבֹּשָׁשׁוּ
  choice: и не стыдились
  rationale: Форма от בוש выражает переживание стыда. Русское «не стыдились» передаёт состояние без сведения смысла к лёгкому смущению.
theological_decisions:
- issue: Значение הָאָדָם в данном контексте
  choice: человек
  alternative: мужчина; Адам
  rationale: Речь идёт о конкретном мужчине, поскольку рядом названа «его жена», однако нарицательное «человек» сохраняет лексическую и повествовательную связь с предыдущим контекстом и не вводит имя собственное там, где еврейский текст употребляет форму с артиклем.
translation_notes:
  register: 'Современный литературный русский язык с краткой, торжественной синтаксической формой. Тире выделяют поясняющее приложение «человек и его жена» и помогают сохранить еврейский порядок: сначала «они оба наги», затем уточнение, кто именно. Архаическое «обнажены» не требуется; «наги» остаётся понятным и стилистически уместным.'
