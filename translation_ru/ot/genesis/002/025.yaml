  source_fidelity: 'Смысл передан в целом точно: речь о мужчине и его жене, об их наготе и отсутствии стыда. Однако исходное «они оба ... — человек и его жена» неестественно переставляет и пояснительно дублирует подлежащее; это ослабляет прямую конструкцию еврейского текста.'
  naturalness: Форма «наги» уместна в сдержанном библейском литературном регистре. Предложение следует перестроить в естественную для современного русского парную конструкцию «и мужчина, и его жена», которая также передаёт акцент שְׁנֵיהֶם («оба»).
  terminology: הָאָדָם в этом контексте относится к конкретному мужчине, а не к человечеству вообще; «мужчина» здесь яснее и естественнее, чем «человек» в сочетании «человек и его жена». אִשְׁתּוֹ точно передано как «его жена». «Не стыдились» верно передаёт בוש без неоправданного смягчения.
