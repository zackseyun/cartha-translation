  text: Имя первой реки — Пишон; она обтекает всю землю Хавила[a], где есть золото.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «окружает всю землю Хавила». Еврейское причастие может означать «обходить вокруг» или «окружать»; перевод «обтекает» естественно передаёт образ реки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: Имя первой
  rationale: Сохраняет существительное «имя», а הָאֶחָד передаёт порядковое значение в последовательности четырёх рек. Женский род обусловлен русским словом «река».
- source_word: פִּישׁוֹן
  choice: Пишон
  rationale: Транслитерация еврейского названия реки непосредственно с языка-источника; передаёт согласный ש как «ш».
- source_word: הַסֹּבֵב
  choice: огибает
  rationale: Причастие от סבב означает движение вокруг или окружение. «Огибает» естественно описывает реку и не требует утверждать, что она полностью замыкает территорию в кольцо.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: всю землю Хавила
  rationale: «Земля» сохраняет обычное географическое значение אֶרֶץ, а «всю» передаёт כָּל. Хавила транслитерируется как географическое название.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: где есть золото
  rationale: Естественно передаёт относительную конструкцию с локативным שָׁם; артикль при הַזָּהָב не требует определённой формы в русском экзистенциальном обороте.
