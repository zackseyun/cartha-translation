  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: ru
  text: 'И сказал Яхве Бог: «Нехорошо человеку быть одному. Я создам для него помощника, соответствующего ему[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помощника, подходящего ему», «помощника ему под стать»; буквально оборот также связан со значением «напротив него». Еврейское выражение указывает на того, кто соответствует человеку; само по себе оно не определяет его статус.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהִים — обычным русским словом «Бог»; тем самым сохраняются и имя, и божественный титул.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным waw продолжает последовательность событий; русское «И сказал» естественно сохраняет библейскую повествовательную связь без обязательного добавления «тогда».
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: Нехорошо человеку быть одному
  rationale: Передаёт оценочное לֹא טוֹב и инфинитивную конструкцию естественным современным русским синтаксисом. «Человеку» здесь обозначает конкретного мужчину в повествовании, не превращая фразу в отвлечённое утверждение о человечестве.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Я создам для него
  rationale: Имперфект выражает намерение Бога. В данном контексте עשה естественно передаётся как «создам», а местоименный оборот — «для него».
- source_word: עֵזֶר
  choice: помощника
  rationale: Существительное обозначает того, кто оказывает помощь. Русское «помощник» прямо передаёт это значение и само по себе не утверждает более низкого положения.
- source_word: כְּנֶגְדּוֹ
  choice: соответствующего ему
  rationale: Оборот выражает нахождение напротив и соответствие, соотнесённость с мужчиной. Такой перевод сохраняет идею взаимного соответствия точнее, чем одно лишь «подходящего».
theological_decisions:
- issue: Значение הָאָדָם в данном контексте
  choice: человеку
  alternative: мужчине; Адаму
  rationale: Речь идёт о конкретном человеке мужского пола, ранее созданном в саду, однако употребление с артиклем ещё сохраняет нарицательное значение. «Человеку» позволяет не вводить личное имя преждевременно; контекст уточняет пол персонажа.
- issue: Возможное иерархическое прочтение עֵזֶר כְּנֶגְדּוֹ
  choice: помощника, соответствующего ему
  alternative: подходящего ему помощника; помощника ему под стать; помощника напротив него
  rationale: Еврейский текст говорит о помощи и соответствии, но сам по себе не устанавливает превосходства или подчинённости. Перевод не должен привносить такой вывод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён личный Божий именослов «Яхве». Конструкция «Нехорошо человеку быть одному» естественна и легко понятна; причастный оборот «соответствующего ему» выбран ради точности, а более идиоматические варианты вынесены в сноску.
