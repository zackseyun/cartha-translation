lexical_decisions:
- source_word: וְנָהָר יֹצֵא מֵעֵדֶן
  choice: Из Эдема вытекала река
  rationale: Причастие יֹצֵא описывает продолжающееся течение реки от её истока; «вытекала» естественно передаёт это в русском повествовании. Предлог מִן обозначает исходную точку.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: чтобы орошать сад
  rationale: Инфинитив выражает цель. «Орошать» точно и естественно описывает действие реки по отношению к саду.
- source_word: וּמִשָּׁם יִפָּרֵד
  choice: оттуда она разделялась
  rationale: Nifal глагола פרד допускает значения «разделяться» и «быть разделённым»; возвратная форма сохраняет непереходное описание реки без указания внешнего деятеля.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: образуя четыре рукава
  rationale: Буквально река «становилась четырьмя головами». В данном речном контексте «рукава» ясно обозначают её четыре основные части после разделения, а конструкция с деепричастием естественно передаёт результирующее состояние.
