base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: ru
  text: И навёл Господь Бог на человека глубокий сон, и он уснул. Тогда Он взял одно из его рёбер[a] и закрыл плотью место, откуда было взято ребро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одну из его боковых частей». Еврейское слово может означать как ребро, так и бок или боковую часть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: навёл
  rationale: Порода hифиль выражает причинение действия; русское «навёл ... сон» естественно передаёт каузативную еврейскую конструкцию.
- source_word: יְהוָה אֱלֹהִים
  choice: Господь Бог
  rationale: Традиционное литературное русское обозначение сочетания личного имени Бога с אֱלֹהִים.
- source_word: תַּרְדֵּמָה
  choice: глубокий сон
  rationale: Существительное обозначает тяжёлый, глубокий сон; этот эквивалент ясен и соответствует контексту.
- source_word: הָאָדָם
  choice: человека
  rationale: В данном повествовательном контексте речь идёт о конкретном человеке; русская форма сохраняет определённую референцию без неестественного артиклевого уточнения.
- source_word: וַיִּישָׁן
  choice: и тот уснул
  rationale: Глагол означает «спать» или «уснуть»; «уснул» естественно следует за наведением глубокого сна, а местоимение «тот» устраняет возможную двусмысленность относительно субъекта.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: одно из его рёбер
  rationale: צֵלָע может обозначать ребро или бок; анатомический контекст поддерживает «ребро», а значимая альтернатива сохранена в сноске.
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: закрыл плотью
  rationale: Сохраняет значение סגר «закрывать» и передаёт בָּשָׂר как материал, которым закрыто место изъятия.
- source_word: תַּחְתֶּנָּה
  choice: то место
  rationale: Буквально слово может означать «под ним/вместо него»; в контексте оно указывает на место вынутого ребра, что по-русски естественно передаётся как «то место».
theological_decisions:
- issue: Передача הָאָדָם в контексте
  choice: человека
  alternative: мужчину; Адама
  rationale: Текст говорит о конкретном человеке, но здесь ещё уместно сохранить нарицательное значение הָאָדָם, не превращая его без необходимости в личное имя и не усиливая половую характеристику сверх русской формы.
- issue: Передача צֵלָע
  choice: ребро
  alternative: бок; часть бока
  rationale: Образ изъятия и последующего закрытия плотью поддерживает анатомическое «ребро», однако более широкое значение «бок» лексически возможно и потому отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Последовательность действий передана естественно; подлинная неоднозначность слова צֵלָע сохранена в сноске.
