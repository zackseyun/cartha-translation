base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: ru
  text: К седьмому дню Бог завершил Своё дело, которое Он совершил, и в седьмой день отдыхал от всего Своего дела, которое Он совершил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: завершил
  rationale: Глагол כלה означает «закончить, завершить». Совершенный вид естественно передаёт завершённость дела; сочетание «к седьмому дню» указывает, что оно уже было окончено к наступлению этого дня.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя форма морфологически множественная, здесь она согласована с глаголом в единственном числе и обозначает единого Бога.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: к седьмому дню / в седьмой день
  rationale: В первой части «к седьмому дню» передаёт вероятный контекстуальный смысл завершённости к этому сроку; во второй части обычное «в седьмой день» непосредственно обозначает день прекращения труда. Буквальная форма первой фразы отмечена в сноске.
- source_word: מְלַאכְתּוֹ
  choice: Своё дело
  rationale: מְלָאכָה обозначает работу, труд или совершаемое дело. «Дело» здесь звучит естественно и охватывает всю созидательную деятельность Бога.
- source_word: אֲשֶׁר עָשָׂה
  choice: которое совершал
  rationale: עשה — широкий глагол со значениями «делать, совершать, создавать». «Совершал» сохраняет широту значения и в русском контексте избегает тяжеловесного повтора «дело, которое сделал».
- source_word: וַיִּשְׁבֹּת
  choice: отдыхал
  rationale: שבת прежде всего означает прекращение деятельности. Традиционное «отдыхал» уместно в данном контексте и обозначает прекращение творческого труда, не обязательно восстановление после усталости.
- source_word: מִכָּל
  choice: от всего
  rationale: Сочетание מן с כָּל указывает на прекращение всей совокупности названного дела.
theological_decisions:
- issue: Подразумевает ли текст, что Бог продолжал работать в седьмой день
  choice: 'Основной текст говорит: «К седьмому дню Бог завершил», то есть дело было завершено к наступлению седьмого дня.'
  alternative: 'Более буквальное: «В седьмой день Бог завершил Своё дело».'
  rationale: Еврейская фраза буквально допускает перевод «в седьмой день», однако рядом сказано, что в этот день Бог отдыхал. Основной перевод выражает вероятный контекстуальный смысл, а формально точная альтернатива сохранена в сноске, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимение «Свой» применительно к Богу написано с прописной буквы согласно распространённой русской библейской традиции. Повтор структуры исходного текста по возможности сохранён.
