base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: ru
  text: 'Авраам поднял глаза и увидел: вот, позади — баран, запутавшийся рогами в зарослях. Авраам пошёл, взял барана и принёс его во всесожжение вместо своего сына.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: поднял глаза
  rationale: Естественно передаёт еврейскую идиому о направлении взгляда вверх или вдаль, сохраняя образность повествования.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное значение глагола; вместе с последующим וְהִנֵּה передаёт момент обнаружения барана.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет указательную и привлекающую внимание функцию еврейской повествовательной частицы.
- source_word: אַיִל
  choice: баран
  rationale: Точное и естественное обозначение взрослого самца овцы, уместное в контексте жертвоприношения.
- source_word: אַחַר
  choice: позади
  rationale: В данном контексте слово наиболее естественно понимается как наречие места. Местоимение «него» в еврейском тексте прямо не выражено, поэтому оно не добавлено в основной текст.
- source_word: נֶאֱחַז
  choice: застрявший
  rationale: Передаёт состояние животного, удерживаемого зарослями; по-русски естественно сочетается с указанием «рогами».
- source_word: בַּסְּבַךְ
  choice: в чаще
  rationale: Передаёт густые переплетённые заросли, в которых мог застрять баран.
- source_word: בְּקַרְנָיו
  choice: рогами
  rationale: Русский творительный падеж ясно выражает, какой частью тела баран застрял в зарослях.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: принёс его во всесожжение
  rationale: 'Устойчиво и точно передаёт жертвенный смысл сочетания глагола עלה с существительным עֹלָה: животное целиком сжигается на жертвеннике.'
- source_word: תַּחַת בְּנוֹ
  choice: вместо своего сына
  rationale: Точно передаёт выраженное предлогом תַּחַת замещение; «своего» естественно указывает по-русски на сына Авраама.
theological_decisions:
- issue: Заместительный смысл תַּחַת בְּנוֹ
  choice: вместо своего сына
  alternative: на месте своего сына
  rationale: Контекст прямо указывает, что баран был принесён как замена сыну. Формулировка сохраняет смысл самого рассказа, не добавляя более позднего богословского истолкования.
translation_notes:
  register: Современный литературный русский с сохранением краткого, торжественного повествовательного строя. Термин «всесожжение» сохранён как точное и широко узнаваемое библейское обозначение жертвы; синтаксис сделан ясным для современного читателя.
