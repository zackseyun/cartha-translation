base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: ru
  text: 'И сказал Авраам своим юношам: «Останьтесь здесь с ослом, а мы с юношей пойдём туда, поклонимся[a] и вернёмся к вам[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падём ниц»; еврейский глагол может более буквально обозначать простирание ниц при поклонении.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте употреблена форма первого лица множественного числа: «вернёмся к вам». Текст не поясняет, скрывает ли Авраам своё намерение, ожидает ли он возвращения Исаака или уверен в Божьем попечении.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: своим юношам
  rationale: נַעַר может обозначать юношу, слугу или спутника. «Юношам» передаёт основной лексический смысл и сохраняет связь с тем же словом, которым далее назван Исаак, не сводя роль сопровождавших к однозначному «слуги».
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Останьтесь здесь
  rationale: Форма от יָשַׁב буквально связана с сидением или пребыванием; в данном повелении естественное русское «Останьтесь здесь» точно передаёт требование не идти дальше.
- source_word: עִם הַחֲמוֹר
  choice: с ослом
  rationale: חֲמוֹר — обычное обозначение осла; выбран современный нейтральный русский эквивалент.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: а мы с юношей
  rationale: Естественная русская конструкция передаёт Авраама и Исаака как совместный субъект. «Юноша» сохраняет повтор נַעַר внутри стиха и не уточняет возраст Исаака сверх текста.
- source_word: נֵלְכָה עַד כֹּה
  choice: пойдём туда
  rationale: Когортатив и указательное выражение передают намерение направиться к отдельному месту; «туда» звучит естественно и не добавляет предполагаемого расстояния.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: поклонимся
  rationale: שׁחה означает склониться или простереться, нередко в поклонении Богу. В данном контексте «поклонимся» сохраняет одновременно телесный образ и религиозный смысл.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: и вернёмся к вам
  rationale: 'Сохранено первое лицо множественного числа: Авраам говорит о возвращении их обоих. Союз «и» передаёт последовательность без добавления отсутствующего в еврейском тексте наречия «затем».'
theological_decisions:
- issue: Множественное число в словах Авраама о возвращении
  choice: «и вернёмся к вам»
  alternative: Истолковать слова как намеренное сокрытие происходящего либо как прямое выражение веры в возвращение Исаака
  rationale: Еврейский текст употребляет форму первого лица множественного числа и не объясняет намерение Авраама. Перевод сохраняет эту богословскую напряжённость, не выбирая между сокрытием, ожиданием и уверенностью в Божьем обеспечении.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Конструкция «мы с юношей» естественнее буквального «я и юноша», при этом точно сохраняет совместность действий и множественное число сказуемых.
