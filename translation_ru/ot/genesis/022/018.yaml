  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: ru
  text: И в твоём потомстве благословятся все народы земли[a], потому что ты послушался Моего голоса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут благословлять себя». Еврейский глагол здесь допускает возвратное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: благословятся
  rationale: Форма хитпаэль допускает возвратно-медиальное понимание, однако в контексте патриархального обетования естественно передаёт получение благословения. Русское «благословятся» сохраняет формальную неоднозначность лучше, чем однозначно пассивное «будут благословлены».
- source_word: בְזַרְעֲךָ
  choice: в твоём потомстве
  rationale: זֶרַע — собирательное существительное со значением потомства. Предлог ב передан как «в», чтобы сохранить формулу обетования и не навязывать исключительно инструментальное значение «через».
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: все народы земли
  rationale: גּוֹיִם непосредственно означает «народы», а הָאָרֶץ здесь указывает на всемирный охват обетования.
- source_word: עֵקֶב אֲשֶׁר
  choice: потому что
  rationale: Сочетание выражает основание подтверждаемого обетования; «потому что» ясно и естественно передаёт причинную связь.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: ты послушался Моего голоса
  rationale: Идиома שׁמע בקול обозначает не просто слышание, а отклик послушанием. «Послушался Моего голоса» сохраняет и идиоматический смысл, и образ исходного текста.
theological_decisions:
- issue: Значение формы хитпаэль глагола ברך в обетовании Аврааму
  choice: 'Народы получают благословение в потомстве Авраама: «благословятся».'
  alternative: Народы будут благословлять себя, обращаясь к потомству Авраама как к образцу или формуле благословения.
  rationale: Контекст обетования поддерживает результирующее значение получения благословения, но еврейская форма допускает возвратное прочтение. Основной текст сохраняет ёмкую русскую форму, а более явная альтернатива приведена в сноске без привнесения позднейших доктринальных выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Потомство» употреблено вместо архаичного «семя»; конструкция «послушался Моего голоса» сохраняет образ оригинала и остаётся понятной современному читателю.
