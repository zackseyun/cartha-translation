  text: וּ/בְתוּאֵ֖ל יָלַ֣ד אֶת רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֨לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְ/נָח֖וֹר אֲחִ֥י אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: ru
  text: А Вафуил стал отцом Ревекки. Этих восьмерых Милка родила Нахору, брату Авраама.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: А Вафуил
  rationale: Союз ו передан как «А», естественно продолжающее родословное перечисление; имя дано в закрепившейся русской библейской форме.
- source_word: יָלַד אֶת רִבְקָה
  choice: стал отцом Ревекки
  rationale: При подлежащем-мужчине יָלַד обозначает отцовство. Современная формулировка точна и избегает архаичного «родил» или «породил».
- source_word: שְׁמֹנָה אֵלֶּה
  choice: этих восьмерых
  rationale: Форма естественна по-русски как прямое дополнение при «родила» и сохраняет указательное значение и число без добавления слова «детей».
- source_word: יָלְדָה
  choice: родила
  rationale: При подлежащем-женщине глагол непосредственно означает рождение и естественно передаётся русским «родила».
- source_word: מִלְכָּה
  choice: Милка
  rationale: Использована традиционная русская библейская форма имени.
- source_word: לְנָחוֹר
  choice: Нахору
  rationale: 'Дательный падеж естественно передаёт ל в формуле рождения: Милка родила этих детей Нахору.'
- source_word: אֲחִי אַבְרָהָם
  choice: брату Авраама
  rationale: Приложение согласовано с дательным «Нахору» и ясно сохраняет родственную связь.
