  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: ru
  text: А его наложница, которую звали Реума, тоже родила Теваха, Гахама, Тахаша и Мааху.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: А его наложница
  rationale: Слово פִּילֶגֶשׁ обозначает наложницу, то есть женщину, состоявшую с мужчиной в признанном, но вторичном брачном союзе. «Наложница» — точный и общеупотребительный русский эквивалент; начальный союз וּ передан как «А», естественно связывающее стих с предыдущим перечнем.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: которую звали Реума
  rationale: 'Буквально: «и имя её — Реума». Относительная конструкция звучит естественно по-русски и не меняет смысла. Имя передано транслитерацией с еврейского.'
- source_word: וַתֵּלֶד גַּם הִוא
  choice: тоже родила
  rationale: Глагол ילד в данной родословной означает «родила», а גַּם הִוא подчёркивает, что наряду с Милкой детей родила и Реума. Частица «тоже» естественно сохраняет это сопоставительное ударение.
- source_word: אֶת טֶבַח וְאֶת גַּחַם וְאֶת תַּחַשׁ וְאֶת מַעֲכָה
  choice: Теваха, Гахама, Тахаша и Мааху
  rationale: Личные имена переданы прямой транслитерацией с еврейского и поставлены в винительный падеж согласно русскому управлению глагола «родила».
