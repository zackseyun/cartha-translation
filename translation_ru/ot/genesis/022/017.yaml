  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: ru
  text: что Я непременно благословлю тебя и многократно умножу твоё потомство[a], как звёзды небесные и как песок, что на берегу моря; и твоё потомство овладеет воротами своих врагов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя». Еврейское слово стоит в единственном числе, но может собирательно обозначать потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст сохраняет собирательное единственное число: «потомство» овладеет воротами «его врагов». По смыслу возможно также: «твои потомки овладеют воротами своих врагов».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: то
  rationale: В контексте клятвы и условно-мотивирующей связи с предыдущим стихом русское «то» естественно вводит содержание торжественного обещания; усиление передано последующими конструкциями.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: Я непременно благословлю тебя
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «непременно» передаёт эту эмфазу естественно по-русски.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: и многократно умножу
  rationale: Повторная усилительная конструкция выражает не только достоверность, но и чрезвычайное увеличение; «многократно умножу» сохраняет интенсивность без буквального повтора.
- source_word: זַרְעֲךָ
  choice: твоё потомство
  rationale: זֶרַע — собирательное существительное в единственном числе. «Потомство» естественно передаёт и множественность потомков, и грамматическое единство образа.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: как звёзды небесные
  rationale: Достоинственный и понятный оборот, сохраняющий возвышенный образ и связь звёзд с небесами.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: и как песок, что на берегу моря
  rationale: Оборот сохраняет относительное אֲשֶׁר и буквально-образное «край/берег моря», оставаясь естественным в современном русском.
- source_word: וְיִרַשׁ
  choice: овладеет
  rationale: יָרַשׁ здесь означает вступить во владение и обрести власть над укреплённым местом противника; «овладеет» передаёт активный смысл точнее, чем нейтральное «унаследует».
- source_word: שַׁעַר
  choice: воротами
  rationale: Сохранён конкретный библейский образ городских ворот как средоточия доступа и власти; метонимия не раскрывается внутри основного текста.
- source_word: אֹיְבָיו
  choice: своих врагов
  rationale: Возвратное «своих» согласуется в русском с собирательным единственным числом «потомство» и сохраняет формально единственное число еврейского суффикса, не задавая пола.
theological_decisions:
- issue: Собирательное единственное זֶרַע и суффикс единственного числа в אֹיְבָיו
  choice: «твоё потомство… своих врагов»
  alternative: «твои потомки… своих врагов»
  rationale: Форма «потомство» сохраняет корпоративно-единственное выражение оригинала и не сводит его ни исключительно к одному будущему лицу, ни только к множеству отдельных потомков. Русское «своих» позволяет сохранить эту напряжённость без искусственного мужского местоимения.
- issue: Значение образа ворот врагов
  choice: Сохранить буквальный образ «овладеет воротами»
  alternative: «покорит города своих врагов» или «одержит победу над врагами»
  rationale: Ворота метонимически обозначают власть над городом, но раскрытие метонимии в тексте устранило бы исходный образ и сузило его смысл.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Усилительные еврейские конструкции переданы идиоматически; сохранены образы небесных звёзд, морского берега и ворот врагов. Формулировка избегает как архаического «семя твоё», так и истолковывающего множественного числа в основном тексте.
