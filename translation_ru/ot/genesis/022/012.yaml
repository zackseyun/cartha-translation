  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: ru
  text: 'И он сказал: «Не поднимай руку на юношу и ничего ему не делай, потому что теперь Я знаю, что ты боишься Бога: ты не удержал от Меня своего сына, своего единственного сына[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своего сына, своего единственного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: поднимай руки на
  rationale: Естественная русская идиома, передающая направленное против человека действие и запрет причинить вред; отрицание выражено частицей «не».
- source_word: הַנַּעַר
  choice: юношу
  rationale: נַעַר может обозначать мальчика, отрока или юношу. В русском повествовательном контексте «юноша» звучит современно и не фиксирует возраст точнее, чем позволяет древнееврейское слово.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: ничего ему не делай
  rationale: Прямо и естественно передаёт полный запрет, выраженный отрицанием с מְאוּמָּה «что-либо».
- source_word: עַתָּה יָדַעְתִּי
  choice: теперь Я знаю
  rationale: Сохраняет прямую формулировку и временной акцент древнееврейского текста, не снимая богословского напряжения.
- source_word: יְרֵא אֱלֹהִים
  choice: ты боишься Бога
  rationale: Формально близкая и традиционно понятная передача богобоязненности; не сужает значение до одного лишь эмоционального страха.
- source_word: חָשַׂכְתָּ
  choice: не пожалел для Меня
  rationale: В данном контексте חָשַׂךְ означает не удержать или не пощадить. Русское «не пожалел для Меня» естественно сочетается с объектом жертвенного испытания, сохраняя направленность מִמֶּנִּי «от Меня / для Меня».
- source_word: יְחִידְךָ
  choice: своего единственного сына
  rationale: Хотя буквально это «своего единственного», повтор слова «сына» нужен для ясного и естественного русского приложения; выражение указывает на единственного сына в данном повествовательном и обетованном отношении, поскольку у Авраама был также Измаил.
- source_word: מִמֶּנִּי
  choice: для Меня
  rationale: В сочетании с русским «не пожалел» форма «для Меня» естественно передаёт того, от кого сын не был удержан; буквальное «от Меня» по-русски здесь менее идиоматично.
theological_decisions:
- issue: 'Антропоморфное выражение Божьего знания: «теперь Я знаю»'
  choice: Сохранить прямое «теперь Я знаю».
  alternative: «теперь Я вижу» или «теперь стало ясно»
  rationale: Древнееврейский текст прямо говорит «теперь Я знаю». Перевод не должен устранять богословское напряжение поясняющим пересказом.
- issue: Значение «единственный сын» при наличии Измаила
  choice: Сохранить «своего единственного сына» с пояснением в сноске.
  alternative: «своего единственного» или «своего особенного сына»
  rationale: יְחִיד обозначает единственного или уникального; контекст требует не отрицать существование Измаила, а понимать Исаака как единственного сына в особом контексте обетования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Я» применительно к Богу написано с прописной буквы по принятой русской издательской норме. «Юноша» избегает архаичного «отрок», а «не поднимай руки» сохраняет живую и понятную идиому.
