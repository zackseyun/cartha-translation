base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: ru
  text: 'Но ангел Яхве воззвал к нему с небес и сказал: «Авраам, Авраам!» Он ответил: «Вот я!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: воззвал
  rationale: В данном напряжённом повествовательном контексте קרא обозначает громкое обращение к человеку; «воззвал» передаёт направленный и настойчивый призыв, сохраняя достоинство библейского повествования.
- source_word: אֵלָיו
  choice: к нему
  rationale: Предлог אֶל с местоименным суффиксом указывает направление обращения к Аврааму; «к нему» — естественный русский эквивалент.
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאָךְ может означать посланника или ангела, но небесное происхождение говорящего здесь поддерживает традиционное и естественное «Ангел». Имя יהוה передано как «Яхве», без замены титулом.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Форма שָׁמַיִם морфологически множественна; русское устойчивое выражение «с небес» естественно передаёт исходящий из небесной сферы голос и сохраняет форму числа лучше, чем «с неба».
- source_word: וַיֹּאמֶר
  choice: сказал / ответил
  rationale: Первое употребление אָמַר вводит прямую речь Ангела и передано «сказал»; второе вводит реплику Авраама в ответ на обращение, поэтому контекстуально естественно «ответил».
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Авраам! Авраам!
  rationale: Повтор имени сохранён и оформлен отдельными восклицаниями, чтобы передать срочность и личный характер призыва.
- source_word: הִנְנִי
  choice: Вот я!
  rationale: Формула выражает присутствие и готовность откликнуться. «Вот я!» кратко и естественно передаёт её в современном литературном русском языке.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; это не определяет спорные богословские выводы о личности Ангела.
- issue: Следует ли истолковывать מַלְאַךְ יְהוָה как непосредственное явление самого Яхве
  choice: Ангел Яхве
  alternative: Сам Яхве; Посланник Яхве
  rationale: Перевод сохраняет грамматическую конструкцию исходного текста и не разрешает за читателя богословское напряжение между посланником и Пославшим.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис прост и понятен; повтор имени и лаконичность ответа сохранены. «Но» передаёт резкий поворот действия перед жертвоприношением.
