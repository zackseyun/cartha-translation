  text: אֶת ע֥וּץ בְּכֹר֖/וֹ וְ/אֶת בּ֣וּז אָחִ֑י/ו וְ/אֶת קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: ru
  text: Уца, его первенца, Буза, его брата, и Кемуила, отца Арама[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предка Арама». В родословиях слово «отец» иногда может обозначать не непосредственного родителя, а предка или родоначальника.'
    reason: 'Лексическая альтернатива: более широкое генеалогическое значение אֲבִי.'
lexical_decisions:
- source_word: ע֥וּץ
  choice: Уц
  rationale: Традиционная русская передача древнееврейского личного имени עוּץ.
- source_word: בְּכֹר֖וֹ
  choice: его первенец
  rationale: בכור обозначает перворождённого сына; «первенец» сохраняет как порядок рождения, так и возможное родовое значение термина.
- source_word: בּ֣וּז
  choice: Буз
  rationale: Традиционная русская передача личного имени בּוּז.
- source_word: אָחִ֑יו
  choice: его брат
  rationale: Прямая передача термина родства с местоименным суффиксом мужского рода единственного числа; формулировка не устраняет присущую контексту соотносительную неоднозначность.
- source_word: קְמוּאֵ֖ל
  choice: Кемуил
  rationale: Устоявшаяся русская библейская форма имени קְמוּאֵל.
- source_word: אֲבִ֥י
  choice: отец
  rationale: Наиболее прямое соответствие אֲבִי; более широкое генеалогическое значение «предок» отмечено в сноске, а не подставлено в основной текст.
- source_word: אֲרָֽם
  choice: Арам
  rationale: Транслитерация личного имени без добавления этнического или географического толкования.
theological_decisions:
- issue: Генеалогическое значение אֲבִי אֲרָם
  choice: Кемуил, отец Арама
  alternative: Кемуил, предок Арама
  rationale: Основной текст сохраняет прямое значение «отец», тогда как сноска указывает на возможное более широкое употребление родственного термина в родословиях, не отождествляя Арама с народом или территорией.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Сохранена синтаксическая форма перечня, поскольку стих продолжает предложение, начатое в Быт. 22:20.
