base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: ru
  text: Тогда Авраам протянул руку[a] и взял нож, чтобы заколоть своего сына[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёр руку».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол здесь конкретнее общего слова «убить» и может иметь оттенок заклания жертвы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: протянул
  rationale: В сочетании с «руку» глагол обозначает вытягивание руки к предмету, а не буквальное «посылание»; «протянул руку» естественно звучит по-русски и точно передаёт действие.
- source_word: יָדוֹ
  choice: руку
  rationale: Прямое соответствие существительному в единственном числе с притяжательным суффиксом; принадлежность в русском ясно выражена подлежащим и контекстом.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение глагола; перевод не добавляет отсутствующего в оригинале указания на силу или способ действия.
- source_word: הַמַּאֲכֶלֶת
  choice: нож
  rationale: Слово обозначает режущий инструмент для заклания; «нож» — ясное и естественное русское соответствие без излишней конкретизации формы орудия.
- source_word: לִשְׁחֹט
  choice: чтобы заколоть
  rationale: «Заколоть» конкретнее общего «убить» и сохраняет возможный жертвенный оттенок глагола, не превращая его в явное толкование «принести в жертву».
- source_word: בְּנוֹ
  choice: своего сына
  rationale: Возвратное притяжательное местоимение естественно для русского языка при совпадении владельца с подлежащим и точно передаёт смысл еврейского суффикса.
- source_word: וַ
  choice: Тогда … и
  rationale: Первый союз передан словом «тогда» как указание на последовательность событий, второй — обычным соединительным «и»; это сохраняет движение повествования в естественном русском синтаксисе.
theological_decisions:
- issue: Следует ли передавать שָׁחַט словом с возможным жертвенным оттенком
  choice: заколоть
  alternative: убить; зарезать; принести в жертву
  rationale: «Заколоть» передаёт более узкое значение, чем «убить», и допускает ритуально-жертвенную окраску. В то же время оно не утверждает прямо того, что действие уже является состоявшимся жертвоприношением, и потому сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым повествовательным ритмом. Выбрано «заколоть» как понятное, dignified and contextually precise wording; archaic excess and explicit doctrinal paraphrase are avoided.
