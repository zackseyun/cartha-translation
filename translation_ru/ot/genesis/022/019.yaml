  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: ru
  text: И возвратился Авраам к своим слугам[a]. Они поднялись и вместе пошли в Вирсавию. И жил Авраам в Вирсавии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте сказано: «Авраам возвратился к своим слугам». Исаак в этой части стиха не упомянут, хотя он присутствует в предшествующем повествовании.'
    reason: Сохраняет повествовательную неопределённость относительно Исаака, не представляя контекстуальное «слугам» как единственно буквальное значение еврейского слова.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: возвратился
  rationale: Глагол שׁוב в породе qal здесь прямо обозначает возвращение и естественно передаётся совершенным видом в последовательном повествовании.
- source_word: נְעָרָיו
  choice: своим слугам
  rationale: נַעַר может означать юношу, слугу или сопровождающего. В данном контексте речь о слугах, взятых Авраамом с собой (22:3, 5); «слуги» естественно и точно обозначает их роль.
- source_word: וַיָּקֻמוּ
  choice: они поднялись
  rationale: קום в повествовании обозначает начало следующего действия; «поднялись» сохраняет образ исходного текста и соответствует современному литературному регистру.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: вместе пошли
  rationale: Сочетание הלך и יחדו означает совместное движение, не уточняя его способ.
- source_word: בְּאֵר שָׁבַע
  choice: Вирсавия
  rationale: Использована устоявшаяся русская библейская форма географического названия, понятная русскоязычному читателю.
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: ישׁב в сочетании с названием места может означать проживание или пребывание. «Жил» естественно передаёт местожительство, не добавляя идеи нового поселения.
theological_decisions:
- issue: В тексте сказано, что с горы возвратился Авраам, тогда как Исаак в предыдущем повествовании присутствует рядом с ним.
  choice: Не добавлять Исаака в основной текст и сохранить формулировку, называющую только Авраама.
  alternative: Пояснить в основном тексте, что Исаак также возвратился, исходя из повествовательного контекста.
  rationale: Еврейский текст прямо называет только Авраама. Добавление Исаака устранило бы намеренно или фактически оставленную текстом неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Краткие предложения сохраняют последовательность еврейских глагольных форм без архаизмов; союз «И» в начале и заключительной части поддерживает повествовательный ритм.
