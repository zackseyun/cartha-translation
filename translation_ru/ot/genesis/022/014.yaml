base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: ru
  text: 'Авраам дал тому месту имя: «Господь усмотрит»[a], — как говорят и поныне: «На горе Господней будет усмотрено»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь увидит»; в контексте также: «Господь обеспечит».'
    reason: יִרְאֶה буквально означает «увидит», а в контексте Божьего обеспечения жертвой допускает значение «усмотрит/обеспечит».
  - marker: b
    text: 'Буквально: «будет увидено»; в связи с игрой слов в предыдущей фразе также возможно: «будет обеспечено».'
    reason: יִרָאֶה — форма нифаля от ראה («видеть»). Она сохраняет словесную связь с יִרְאֶה, тогда как контекст допускает передачу значения Божьего обеспечения.
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  choice: «Господь усмотрит»
  rationale: יִרְאֶה буквально означает «увидит», но в данном контексте имеет также естественный для библейского выражения смысл «усмотрит, позаботится, обеспечит». «Усмотрит» сохраняет связь с еврейским корнем ראה и одновременно передаёт контекст Божьего обеспечения жертвой.
- source_word: בְּהַר יְהוָה
  choice: «На горе Господней»
  rationale: Естественная и торжественная русская передача конструкции принадлежности с тетраграмматоном.
- source_word: יֵרָאֶה
  choice: «будет усмотрено»
  rationale: Нифаль от ראה допускает буквальное «будет увидено/явится» и контекстуальное «будет усмотрено». Пассивная форма сохраняет словесную связь с названием места и неоднозначность высказывания.
theological_decisions:
- issue: Передача игры слов между יִרְאֶה и יֵרָאֶה
  choice: «усмотрит» / «будет усмотрено»
  alternative: «увидит» / «явится» либо «обеспечит» / «будет обеспечено»
  rationale: Выбранная пара сохраняет общий корень и богословски значимый двойной смысл видения и предусмотрения, не сводя текст исключительно к материальному обеспечению.
- issue: Передача имени יהוה
  choice: «Господь»
  alternative: «Яхве»
  rationale: «Господь» соответствует устойчивой русской библейской традиции и обозначает тетраграмматон без спорной реконструкции произношения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Поныне» сохраняет достоинство стиля и остаётся понятным; «усмотрит» намеренно удерживает традиционную русскую игру значений между видением, предусмотрением и обеспечением.
