  text: וַ/יִּקְרָ֛א מַלְאַ֥ךְ יְהוָ֖ה אֶל אַבְרָהָ֑ם שֵׁנִ֖ית מִן הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: ru
  text: И ангел Яхве во второй раз воззвал к Аврааму с небес[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: воззвал
  rationale: Глагол קרא при прямом обращении означает «позвал, воззвал». «Воззвал» сохраняет значение обращения и соответствует возвышенному, но понятному повествовательному регистру.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאָךְ может означать «вестник» или «ангел»; в устойчивом контексте небесного посланника естественно «ангел», при этом в сноске сохранён лексический вариант «вестник».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: אֶל אַבְרָהָם
  choice: к Аврааму
  rationale: Предлог אֶל обозначает адресата обращения; русское «воззвал к Аврааму» точно и идиоматично передаёт эту связь.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Передаёт явное порядковое значение точнее, чем более общее «снова».
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Хотя שָׁמַיִם имеет форму множественного числа, русское устойчивое выражение «с небес» естественно для голоса из божественной сферы и сохраняет возвышенный регистр.
theological_decisions:
- issue: Значение выражения מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Перевод обозначает небесного посланника, но не решает спорный вопрос о том, является ли он сотворённым ангелом или особым явлением Бога; лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Союз «И» сохраняет последовательное развитие еврейского повествования. Конечная запятая отражает синтаксическое продолжение прямой речи в следующем стихе.
