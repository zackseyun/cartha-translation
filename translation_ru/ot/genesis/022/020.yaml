  language: ru
  text: 'После этих событий Аврааму сообщили: «Вот Милка тоже родила сыновей твоему брату Нахору:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: В данном повествовательном контексте דְּבָרִים естественно обозначает произошедшие события, а не произнесённые слова или абстрактные «вещи».
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: 'Аврааму сообщили:'
  rationale: Еврейская безличная пассивная конструкция передана естественной русской неопределённо-личной формой; לֵאמֹר обозначено двоеточием перед прямой речью без тяжеловесного «сказав».
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохранён маркер привлечения внимания, вводящий новость.
- source_word: יָלְדָה ... בָּנִים
  choice: родила сыновей
  rationale: Прямо передаёт глагол рождения и множественное число дополнения.
- source_word: מִלְכָּה
  choice: Милка
  rationale: Использована традиционная и узнаваемая русская библейская передача имени.
- source_word: לְנָחוֹר אָחִיךָ
  choice: Нахору, твоему брату
  rationale: Сохранены дательный смысл לְ и обращённое к Аврааму притяжательное местоимение второго лица.
