translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательной прозы. Союз וַ в начале не передан отдельным «и/теперь», поскольку здесь он связывает повествование и не выражает самостоятельного временного значения. Конечное двоеточие сохранено: стих вводит перечень сыновей в следующем стихе.'
