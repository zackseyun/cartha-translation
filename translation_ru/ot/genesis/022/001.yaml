base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: ru
  text: 'После этих событий Бог испытал Авраама и сказал ему: «Авраам!» Он ответил: «Вот я».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: וַיְהִי служит переходом к следующему эпизоду и не требует отдельного воспроизведения; «после этих событий» естественно передаёт временную связь и широкий смысл דְּבָרִים в данном повествовательном контексте.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В контексте слово обозначает единого Бога; артикль не воспроизводится отдельно в русском языке.
- source_word: נִסָּה
  choice: испытал
  rationale: Форма Piel глагола נסה означает подвергнуть испытанию, проверить. «Испытал» точно и естественно передаёт смысл, не привнося значения склонения ко злу.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: и сказал ему
  rationale: Прямое и естественное соответствие обычной повествовательной формуле с сохранением связи действий одного субъекта — Бога.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Устойчивый русский эквивалент ответа, выражающего присутствие, внимание и готовность откликнуться.
theological_decisions:
- issue: Значение נסה, когда субъектом выступает Бог
  choice: Бог испытал Авраама
  alternative: Бог искушал Авраама
  rationale: В данном контексте глагол обозначает проверку или испытание, а не побуждение ко злу. Выбор сохраняет напряжение рассказа, не добавляя отсутствующего в тексте богословского объяснения.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Повтор еврейского וַיֹּאמֶר во второй реплике естественно передан глаголом «ответил», поскольку это ответ Авраама на обращение.
