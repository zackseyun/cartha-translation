base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: ru
  text: Авраам взял дрова для всесожжения и возложил их на своего сына Исаака. Затем он взял в руку огонь и нож, и оба они пошли вместе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: дрова для всесожжения
  rationale: Конструкция буквально означает «дерево/дрова всесожжения». Предлог «для» естественно передаёт назначение дров, а «всесожжение» сохраняет установленное жертвенное значение עֹלָה.
- source_word: וַיָּשֶׂם עַל
  choice: возложил ... на
  rationale: Сочетание означает помещение предмета на кого-либо или что-либо. «Возложил» звучит достойно и сохраняет образ ноши, не добавляя ритуального смысла сверх контекста.
- source_word: יִצְחָק בְּנוֹ
  choice: своего сына Исаака
  rationale: Такой порядок слов естественен в современном русском языке и точно выражает родственную связь.
- source_word: בְּיָדוֹ
  choice: в руку
  rationale: Сохраняется единственное число еврейского выражения; русская конструкция «взял в руку» естественна.
- source_word: הָאֵשׁ
  choice: огонь
  rationale: Исходный текст называет именно огонь, не уточняя ни сосуд, ни способ его переноса, поэтому конкретизация не вводится.
- source_word: הַמַּאֲכֶלֶת
  choice: нож
  rationale: Слово обозначает нож, в том числе предназначенный для заклания; контекст передаёт жертвенную функцию без необходимости утяжелять основной текст.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: они вдвоём пошли дальше вместе
  rationale: «Пошли дальше» передаёт продолжение пути, а сочетание «вдвоём ... вместе» сохраняет намеренное усиление парности и единства в еврейском тексте.
theological_decisions:
- issue: Жертвенный термин עֹלָה
  choice: всесожжение
  alternative: жертва возношения
  rationale: В данном контексте слово обозначает жертву, целиком сжигаемую на огне. «Всесожжение» — ясный и общепринятый русский термин, не устраняющий жертвенного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис разделён на два предложения ради ясности; повтор «вдвоём ... вместе» сохранён как значимое усиление оригинала.
