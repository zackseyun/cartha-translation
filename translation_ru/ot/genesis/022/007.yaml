base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: ru
  text: 'Исаак сказал своему отцу Аврааму: «Отец!» Авраам сказал: «Вот я, сын мой». Исаак сказал: «Вот огонь и дрова, но где ягнёнок[a] для всесожжения?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שֶׂה обозначает животное из мелкого скота и может относиться не только к ягнёнку, но и, например, к козлёнку.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал / ответил
  rationale: Обычная повествовательная форма глагола אמר передана как «сказал»; во второй реплике контекстуально естественное «ответил» передаёт тот же речевой акт без изменения смысла.
- source_word: אָבִיו
  choice: отцу своему
  rationale: Сохраняет родственное обозначение и возвышенно-повествовательный тон, оставаясь понятным современному читателю.
- source_word: אָבִי
  choice: Отец мой!
  rationale: Передаёт обращение с суффиксом первого лица и эмоциональную силу реплики.
- source_word: הִנֶּנִי
  choice: Вот я
  rationale: Традиционная и точная передача еврейской формулы готовности и отклика; сохраняет её литературный резонанс.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохраняет притяжательный суффикс и тёплый тон обращения.
- source_word: הִנֵּה
  choice: вот
  rationale: Естественно указывает на находящиеся перед говорящим предметы без архаичного «се».
- source_word: הָאֵשׁ
  choice: огонь
  rationale: Прямой и естественный русский эквивалент; определённость ясна из ситуации.
- source_word: הָעֵצִים
  choice: дрова
  rationale: Хотя еврейское слово имеет форму множественного числа и буквально означает древесину или куски дерева, в данном контексте русское «дрова» точно обозначает топливо для жертвенника.
- source_word: אַיֵּה
  choice: где же
  rationale: «Где» передаёт вопрос о местонахождении, а частица «же» естественно выражает заметное отсутствие ожидаемого животного.
- source_word: הַשֶּׂה
  choice: ягнёнок
  rationale: В контексте жертвоприношения это естественное русское обозначение животного из мелкого скота, однако еврейское слово шире; эта неоднозначность сохранена в сноске.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: Передаёт установленное название жертвы, целиком сжигаемой на жертвеннике, и естественно сочетается с вопросом.
theological_decisions:
- issue: Значение жертвенного животного הַשֶּׂה
  choice: ягнёнок
  alternative: животное из мелкого скота; овца или козлёнок
  rationale: '«Ягнёнок» естественен в русском повествовании о жертве, но не выдаётся за единственно возможное лексическое значение: более широкий объём еврейского слова прямо отмечен в сноске.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Повтор глагола речи частично сохранён для близости к еврейскому повествованию, но одна реплика оформлена глаголом «ответил» ради естественности. Архаизмы «се» и «агнец» не использованы.
