  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: ru
  text: 'И сказал Авраам: «Бог усмотрит Себе ягнёнка[a] для всесожжения, сын мой». И пошли они оба вместе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «Бог увидит для Себя ягнёнка». Еврейский глагол означает «увидеть», но в данном контексте может также передавать смысл «усмотреть, обеспечить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ־ продолжает повествование; традиционное и естественное русское «И сказал» сохраняет его ход.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычное русское соответствие еврейскому обозначению Бога в речи Авраама.
- source_word: יִרְאֶה לּוֹ
  choice: Сам усмотрит Себе
  rationale: Глагол ראה буквально означает «видеть», но здесь допускает идиоматический смысл «усмотреть, обеспечить». «Усмотрит» сохраняет связь с образом видения, а «Себе» передаёт לּוֹ; «Сам» естественно подчёркивает, что об этом позаботится Бог.
- source_word: הַשֶּׂה
  choice: ягнёнка
  rationale: שֶׂה обозначает животное из мелкого скота — овцу или козу, часто молодое; в данном жертвенном контексте естественно «ягнёнок», как и в вопросе Исаака.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: עֹלָה — установленное название жертвы, сжигавшейся целиком; «всесожжение» сохраняет точную жертвенную терминологию.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохраняет прямое, родственное и эмоционально окрашенное обращение Авраама к Исааку.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: И пошли они оба вместе
  rationale: Передаёт подчёркнутое совместное движение и сохраняет повтор формулы внутри повествования.
theological_decisions:
- issue: Смысл слов Авраама о действии Бога
  choice: Бог Сам усмотрит Себе ягнёнка
  alternative: Бог увидит Себе ягнёнка / Бог обеспечит Себе ягнёнка
  rationale: «Усмотрит» удерживает как буквальный образ «видения», так и контекстуальный смысл обеспечения. Перевод не решает, говорит ли Авраам уклончиво, пророчески или одновременно и так и так, и тем самым сохраняет напряжение повествования.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейского повествования. «Всесожжение» оставлено как понятный устоявшийся термин; «Сам усмотрит Себе» передаёт еврейскую идиому без устранения её смысловой многозначности.
