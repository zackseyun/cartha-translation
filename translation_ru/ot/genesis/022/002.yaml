base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: ru
  text: 'И сказал: «Возьми, прошу тебя, своего сына, своего единственного[a], которого ты любишь, — Исаака; пойди в землю Мориа и принеси его там во всесожжение на одной из гор, о которой Я скажу тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего единственного сына». Еврейское יְחִידְךָ может обозначать единственного или неповторимого, особо дорогого человека; здесь оно подчёркивает исключительное положение Исаака в этом повелении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: прошу тебя
  rationale: Частица выражает просьбу или смягчает повеление; «прошу тебя» передаёт её силу на естественном современном русском языке, не придавая ей ошибочного временного значения «теперь».
- source_word: בִּנְךָ
  choice: своего сына
  rationale: Прямой и естественный перевод существительного בֵּן с суффиксом второго лица единственного числа.
- source_word: יְחִידְךָ
  choice: своего единственного
  rationale: Субстантивированное «единственного» сохраняет значение единственности и особого, неповторимого статуса Исаака, не утверждая без пояснения, что у Авраама не было другого сына.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: которого ты любишь
  rationale: Перфект описывает устойчивое, известное чувство Авраама; настоящее время естественно передаёт это состояние по-русски.
- source_word: וְלֶךְ לְךָ
  choice: пойди
  rationale: Простой императив естественно передаёт идиому; буквальное воспроизведение местоименного элемента לְךָ звучало бы по-русски неестественно и могло бы внести лишний оттенок.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: землю Мориа
  rationale: «Земля» прямо передаёт אֶרֶץ, а «Мориа» — традиционная русская форма топонима.
- source_word: וְהַעֲלֵהוּ ... לְעֹלָה
  choice: принеси его ... во всесожжение
  rationale: В жертвенном контексте Hiphil от עלה вместе с עֹלָה обозначает принесение жертвы всесожжения; формулировка сохраняет установленную жертвенную лексику.
- source_word: עַל אַחַד הֶהָרִים
  choice: на одной из гор
  rationale: Точно передаёт выбор одной, пока не названной горы из нескольких.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: о которой Я скажу тебе
  rationale: Сохраняет глагол אמר «сказать», не подменяя его глаголом «показать»; русская конструкция естественно указывает на последующее уточнение места.
theological_decisions:
- issue: Значение יְחִידְךָ применительно к Исааку при существовании Измаила
  choice: своего единственного
  alternative: своего единственного сына; своего единственного в своём роде
  rationale: Основной текст подчёркивает исключительный статус Исаака в данном повелении, не разрешая однозначно, является ли акцент биологическим, заветным или эмоциональным. Традиционный вариант «единственного сына» отмечен в сноске как возможный.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «своего» сохраняет нарастающую выразительность еврейской последовательности «сына твоего, единственного твоего», а тире выделяет имя Исаака как кульминационное уточнение.
