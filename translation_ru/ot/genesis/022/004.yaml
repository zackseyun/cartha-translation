lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Прямо передаёт обстоятельство времени с определённым порядковым числительным, не добавляя отсутствующего в еврейском тексте уточнения «пути».
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: поднял глаза
  rationale: Сохраняет образность еврейской идиомы и при этом естественно звучит на современном русском языке.
- source_word: וַיַּרְא
  choice: и увидел
  rationale: Передаёт последовательное повествовательное действие; повторять местоимение при названном подлежащем не требуется.
- source_word: הַמָּקוֹם
  choice: то место
  rationale: Определённая форма указывает на уже известное из контекста место; русское «то место» естественно выражает эту контекстуальную определённость, не уточняя его характера.
- source_word: מֵרָחֹק
  choice: вдали
  rationale: Кратко и литературно передаёт значение пространственной удалённости; «издалека» также возможно и отмечено в сноске.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Традиционная и общепринятая русская форма библейского имени.
