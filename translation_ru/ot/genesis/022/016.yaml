  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: ru
  text: 'и сказал: «Собою клянусь, — возвещает Яхве, — за то, что ты сделал это и не пожалел сына своего, единственного,»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Последовательная глагольная форма продолжает повествование; субъект понятен из контекста и по-русски может не повторяться.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Мною клянусь
  rationale: Торжественная формула клятвы означает, что Яхве клянётся Самим Собой. Настоящее время естественно передаёт перформативную силу совершенной формы в прямой речи.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественный характер формулы божественного изречения и передаёт тетраграмматон личным именем.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Естественно выражает усиленное причинное основание последующего обещания.
- source_word: עָשִׂיתָ אֶת הַדָּבָר הַזֶּה
  choice: ты сделал это
  rationale: В данном контексте הַדָּבָר הַזֶּה обозначает совершённый поступок; русское «сделал это» ясно и не буквалистично.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: и не пожалел
  rationale: В контексте принесения сына в жертву глагол означает не удержать для себя, не пощадить; «не пожалел» естественно и точно передаёт эту цену послушания.
- source_word: בִּנְךָ אֶת יְחִידְךָ
  choice: сына своего, единственного своего
  rationale: Повтор притяжательного местоимения сохраняет торжественную аппозицию оригинала; «единственного» передаёт уникальный статус Исаака, не добавляя слова «возлюбленного».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Значение יְחִידְךָ
  choice: единственного своего
  alternative: единственного сына своего / любимого своего
  rationale: Еврейское слово допускает оттенки единственности и уникальности. Выбранный вариант сохраняет основное значение и аппозицию, не усиливая позднейшие богословские ассоциации.
- issue: Значение חָשַׂךְ в контексте
  choice: не пожалел
  alternative: не удержал
  rationale: Оба значения возможны; «не пожалел» отражает контекст готовности отдать сына, не утверждая, что жертвоприношение фактически состоялось.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Фрагмент намеренно заканчивается запятой, поскольку стих продолжается в следующем высказывании.
