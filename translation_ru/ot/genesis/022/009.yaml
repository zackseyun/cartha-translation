  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: ru
  text: И пришли они на место, которое указал ему Бог[a]. Там Авраам построил жертвенник[b], разложил дрова, связал своего сына Исаака и положил его на жертвенник поверх дров[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «которое Бог сказал ему». В контексте: место, ранее указанное Богом.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте слово «жертвенник» употреблено с определённым артиклем. В русском языке артикля нет.
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст: «выше дров», то есть поверх разложенных дров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли они
  rationale: Повествовательная форма продвигает последовательность событий; русский порядок слов сохраняет множественное число и придаёт фразе естественное библейское достоинство без архаизации.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: которое указал ему Бог
  rationale: Буквально оборот содержит глагол «сказать», но в контексте речь идёт о ранее обозначенном Богом месте. «Указал» естественно передаёт этот эллиптический смысл по-русски; буквальный вариант сохранён в примечании.
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: Там Авраам построил жертвенник
  rationale: «Построил» прямо передаёт בנה. В еврейском у слова «жертвенник» есть определённый артикль, но русский язык не выражает эту категорию артиклем; особая определённость отмечена в примечании.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: разложил дрова
  rationale: ערך означает привести в порядок, расположить; в данном контексте «разложил дрова» ясно и естественно описывает подготовку жертвенника.
- source_word: וַיַּעֲקֹד
  choice: связал
  rationale: Глагол прямо обозначает связывание. Перевод не смягчает действие и не добавляет деталей о способе связывания.
- source_word: יִצְחָק בְּנוֹ
  choice: своего сына Исаака
  rationale: Такой порядок слов естественен для современного русского и сохраняет подчёркнутое в исходном тексте родство.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: положил его на жертвенник
  rationale: שׂים — общий глагол помещения; «положил» соответствует ситуации и не уточняет не названный в тексте способ действия.
- source_word: מִמַּעַל לָעֵצִים
  choice: поверх дров
  rationale: Оборот обозначает положение выше, непосредственно на разложенных дровах; «поверх дров» кратко и ясно передаёт пространственное отношение.
theological_decisions:
- issue: Определённость жертвенника
  choice: жертвенник с пояснением в примечании
  alternative: этот жертвенник; некий жертвенник
  rationale: В еврейском стоит определённый артикль, представляющий сооружение как конкретный жертвенник для данного жертвоприношения. Русский перевод без указательного слова звучит естественнее и не устраняет эту конкретность контекста.
- issue: Описание связывания Исаака
  choice: связал своего сына Исаака
  alternative: связал Исаака, сына своего; привязал Исаака
  rationale: «Связал» сохраняет точную силу глагола, не смягчая сцену и не привнося позднейшего богословского толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным ритмом. Синтаксис упрощён до естественных русских фраз, но последовательность действий, повторяемая в еврейском повествовании союзом וַ, сохранена перечислением. Архаизмы и конфессионально окрашенные добавления исключены.
