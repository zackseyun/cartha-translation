lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Хесед
  rationale: Личное имя передано транслитерацией с еврейского; в тексте употреблена форма винительного падежа «Хеседа», поскольку перечень продолжает конструкцию предыдущего стиха («родила»).
- source_word: חֲזוֹ
  choice: Хазо
  rationale: Личное имя передано близкой к еврейскому звучанию традиционной русской формой; как имя на -о оставлено несклоняемым.
- source_word: פִּלְדָּשׁ
  choice: Филдаш
  rationale: Личное имя передано принятой русской библейской транслитерацией; в тексте стоит винительный падеж «Филдаша».
- source_word: יִדְלָף
  choice: Идлаф
  rationale: Начальный еврейский йод передан буквой «И» согласно укоренившейся русской форме имени; в тексте стоит винительный падеж «Идлафа».
- source_word: בְּתוּאֵל
  choice: Вафуил
  rationale: Использована укоренившаяся русская библейская форма имени; в тексте стоит винительный падеж «Вафуила».
- source_word: וְאֶת / וְאֵת
  choice: запятые и заключительный союз «и»
  rationale: Еврейский показатель прямого дополнения отдельно не переводится. Повторяющийся союз естественно передан по-русски перечислением с одним союзом перед последним именем.
