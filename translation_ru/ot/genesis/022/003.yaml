  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: ru
  text: Авраам встал рано утром, оседлал своего осла, взял с собой двух своих слуг[a] и своего сына Исаака, наколол дров для всесожжения, поднялся и пошёл к месту, о котором сказал ему Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двух своих молодых людей» либо «двух своих сопровождающих». Еврейское слово נְעָרִים может обозначать как молодых мужчин, так и слуг или сопровождающих — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Авраам встал рано утром
  rationale: Глагол выражает ранний подъём, а временное выражение уточняет время; перевод естественно передаёт оба элемента.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: оседлал своего осла
  rationale: В данном контексте חבש означает подготовить осла к дороге, закрепив седло или поклажу; «оседлал» — ясный и традиционный русский эквивалент.
- source_word: שְׁנֵי נְעָרָיו
  choice: двух своих слуг
  rationale: נְעָרִים может обозначать молодых людей или прислужников; притяжательная форма и роль сопровождающих здесь позволяют естественно передать «слуг», не утверждая рабского статуса.
- source_word: יִצְחָק בְּנוֹ
  choice: своего сына Исаака
  rationale: Естественный русский порядок слов сохраняет подчёркнутое указание на сыновство Исаака.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: наколол дров для всесожжения
  rationale: בקע означает раскалывать или колоть, а עֹלָה — установленное обозначение жертвы всесожжения.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: поднялся и пошёл
  rationale: Сохранены оба последовательных глагола и характерный для еврейского повествования ритм действий.
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: к месту, о котором сказал ему Бог
  rationale: Формулировка сохраняет широкое значение אמר и не добавляет отсутствующего в тексте уточнения о том, что Бог указал или назвал место.
theological_decisions:
- issue: Передача жертвенного термина עֹלָה
  choice: всесожжение
  alternative: жертва всесожжения
  rationale: «Всесожжение» — устоявшийся точный термин для жертвы, целиком сжигаемой на жертвеннике; более развёрнутый вариант здесь не требуется.
- issue: Статус сопровождавших Авраама נְעָרִים
  choice: слуги с примечанием об альтернативе
  alternative: молодые люди / сопровождающие
  rationale: Контекст допускает служебную роль, но само слово неоднозначно; примечание сохраняет эту неоднозначность и не вводит определённого социального статуса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным для широкого читателя; последовательность действий и повтор двух глаголов в конце сохранены без излишней архаизации.
