  text: Иаков поцеловал Рахиль[a], возвысил голос и заплакал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приветствовал Рахиль поцелуем». Еврейский глагол обычно означает «поцеловал», но в этом контексте поцелуй мог также быть формой приветствия между родственниками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: поцеловал
  rationale: Глагол נשׁק в породе qal обычно означает физический поцелуй. В данном семейном контексте поцелуй мог одновременно служить приветствием, что отражено в сноске.
- source_word: לְרָחֵל
  choice: Рахиль
  rationale: Предлог ל при глаголе «целовать» обозначает объект действия; по-русски естественно употребить прямое дополнение без предлога.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: громко
  rationale: Буквально выражение означает «поднял свой голос», но вместе с последующим «заплакал» это еврейская идиома, указывающая на слышимый, громкий плач. Русское «возвысил голос» здесь могло бы ошибочно подразумевать речь или раздражение.
- source_word: וַיֵּבְךְּ
  choice: заплакал
  rationale: Глагол בכה означает «плакать, рыдать». Совершенный вид естественно передаёт начало действия в последовательном повествовании.
- source_word: וַ
  choice: а затем
  rationale: Последовательные формы с waw продвигают повествование. «А затем» ясно и естественно передаёт переход к следующему действию, не создавая резкого смыслового противопоставления.
