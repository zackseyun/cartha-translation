  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: ru
  text: 'Он сказал им: «Знаете ли вы Лавана, сына Нахора?» Они ответили: «Знаем[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы его знаем». В еврейском тексте буквально: «Знаем»; объект понятен из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Он спросил их
  rationale: Форма буквально вводит речь («сказал им»), но поскольку далее следует прямой вопрос, русское «спросил их» естественно и точно передаёт речевое действие и движение повествования.
- source_word: הַיְדַעְתֶּם
  choice: Знаете ли вы
  rationale: Глагол יָדַע в данном контексте означает личное знакомство; конструкция с «ли» сохраняет вопросительную форму и соответствует литературному русскому.
- source_word: לָבָן
  choice: Лавана
  rationale: Традиционная русская библейская передача личного имени с требуемым винительным падежом.
- source_word: בֶּן נָחוֹר
  choice: сына Нахора
  rationale: Сохранено прямое значение בֶּן «сын» без замены на более широкое «потомок»; приложение оформлено естественно для русского языка.
- source_word: וַיֹּאמְרוּ
  choice: Они ответили
  rationale: Буквально «они сказали»; в реплике на вопрос «ответили» яснее и естественнее выражает функцию глагола в диалоге.
- source_word: יָדָעְנוּ
  choice: Знаем
  rationale: Однословный ответ воспроизводит тот же корень יָדַע, что и вопрос, и не добавляет отсутствующего в еврейском тексте местоимения-объекта.
