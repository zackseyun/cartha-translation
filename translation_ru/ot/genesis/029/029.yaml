    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: И … отдал
  rationale: Форма wayyiqtol продолжает повествование и обозначает завершённое действие; «отдал» естественно передаёт передачу служанки Рахили.
- source_word: לָבָן
  choice: Лаван
  rationale: Традиционная и общепринятая русская передача имени.
- source_word: לְרָחֵל בִּתּוֹ
  choice: своей дочери Рахили
  rationale: Передаёт Рахиль как получателя и сохраняет уточнение о её родстве с Лаваном в естественном русском порядке слов.
- source_word: בִּלְהָה
  choice: Валлу
  rationale: Использована укоренившаяся в русской библейской традиции форма имени Валла; винительный падеж обусловлен синтаксисом.
- source_word: שִׁפְחָתוֹ
  choice: свою служанку
  rationale: שִׁפְחָה обозначает женщину-служанку, социальное положение которой могло включать несвободу. «Служанка» ясно и естественно передаёт гендерно маркированное слово, не добавляя указания на возраст.
- source_word: לָהּ לְשִׁפְחָה
  choice: чтобы та стала её служанкой
  rationale: Целевая конструкция буквально указывает, что Валла дана Рахили «в служанки»; развёрнутая формулировка устраняет неясность местоимений и сохраняет повтор שִׁפְחָה.
