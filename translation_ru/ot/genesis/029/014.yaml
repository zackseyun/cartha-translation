  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: ru
  text: 'Тогда Лаван сказал ему: «Воистину, ты — кость моя и плоть моя[a]». Иаков пробыл у него целый месяц[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейский оборот «кость моя и плоть моя» означает близкое кровное родство.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «месяц дней»; то есть целый месяц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Лаван сказал
  rationale: Ваййиктоль продолжает последовательность повествования; «тогда» естественно передаёт переход к следующему событию.
- source_word: אַךְ
  choice: Да
  rationale: Здесь частица имеет утвердительно-усилительное, а не ограничительное значение; «да» естественно вводит уверенное признание родства.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: кость моя и плоть моя
  rationale: Сохранён образный древнееврейский оборот о близком кровном родстве и его межтекстовые связи.
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: И Иаков прожил у него
  rationale: Глагол обозначает временное пребывание у Лавана. Имя «Иаков» устраняет возможную для русского читателя неясность местоименного субъекта, а «у него» естественно передаёт проживание вместе с Лаваном.
- source_word: חֹדֶשׁ יָמִים
  choice: целый месяц
  rationale: Идиоматическое сочетание буквально означает «месяц дней»; по-русски его естественный эквивалент — «целый месяц».
