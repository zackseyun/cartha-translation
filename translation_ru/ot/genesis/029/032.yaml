base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: ru
  text: 'Лия забеременела и родила сына. Она дала ему имя Рувим[a], потому что сказала: «Яхве увидел моё страдание; теперь мой муж будет любить меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имя «Рувим» созвучно древнееврейскому выражению «смотрите: сын!» и здесь объясняется словами Лии: «Яхве увидел моё страдание».'
    reason: Игра слов в древнееврейском имени не воспроизводится непосредственно по-русски.
lexical_decisions:
- source_word: וַתַּהַר
  choice: забеременела
  rationale: Глагол הרה означает зачатие или наступление беременности; «забеременела» естественно и ясно звучит в современном русском повествовании.
- source_word: וַתֵּלֶד בֵּן
  choice: родила сына
  rationale: Точно и лаконично передаёт обычную древнееврейскую формулу рождения.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: дала ему имя
  rationale: Естественная русская формула наречения, сохраняющая акцент на имени перед последующей игрой слов.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Использована устоявшаяся русская библейская форма имени; связанную с ним древнееврейскую игру слов поясняет сноска.
- source_word: כִּי אָמְרָה
  choice: потому что сказала
  rationale: כִּי вводит объяснение выбора имени; причинная связь передана прямо и естественно.
- source_word: כִּי רָאָה יְהוָה
  choice: Яхве увидел
  rationale: Совершенный вид передаёт совершившееся действие, которое Лия считает основанием своей надежды; первое כִּי внутри речи контекстуально понято как вводящее основание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в древнееврейском тексте, а не заменяет его титулом.
- source_word: בְּעָנְיִי
  choice: моё страдание
  rationale: עֳנִי обозначает бедствие, тяжёлое или униженное положение; «страдание» понятно современному читателю и сохраняет эмоциональную тяжесть контекста.
- source_word: כִּי עַתָּה
  choice: теперь
  rationale: Второе כִּי можно понимать как усилительное или причинное; в естественной русской речи достаточно «теперь», без излишнего прояснения неоднозначной частицы.
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: мой муж будет любить меня
  rationale: אִישִׁי в данном брачном контексте означает «мой муж», а форма глагола выражает надежду Лии на будущую любовь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Степень уверенности в словах Лии
  choice: теперь мой муж будет любить меня
  alternative: теперь-то мой муж полюбит меня
  rationale: Текст выражает надежду или ожидание Лии, не сообщая, что оно исполнилось. Нейтральная будущая форма сохраняет эту напряжённость и не усиливает уверенность сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык; повествование лаконичное и достоинственное. Устоявшаяся форма имени «Рувим» сохранена, а непередаваемая игра слов вынесена в сноску.
