base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: ru
  text: 'Она снова забеременела и родила сына, и сказала: «Потому что Яхве услышал, что меня ненавидят[a], Он дал мне и этого». И назвала его Симеоном[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что меня не любят» или «что меня любят меньше». Буквально еврейское слово означает «ненавидят», но в данном контексте оно может выражать отверженность или то, что Лию любили меньше.'
    reason: lexical_alternative
  - marker: b
    text: Имя «Симеон» созвучно еврейскому слову «услышал».
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Она снова забеременела
  rationale: עוֹד указывает на повторение действия, а повествовательная форма продвигает рассказ; «снова забеременела» естественно звучит по-русски.
- source_word: וַתֵּלֶד בֵּן
  choice: и родила сына
  rationale: Прямой и естественный перевод обычной формулы о рождении.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Яхве услышал
  rationale: שָׁמַע обозначает завершённое действие, значимое для настоящего высказывания; имя יהוה передано как «Яхве», а причинная связь в русском выражена общим строением реплики без отдельного «потому что».
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: что меня ненавидят
  rationale: Сохранено сильное прямое значение שְׂנוּאָה — «ненавидимая». Безличная конструкция не добавляет прямо не названного в этой фразе Иакова и естественна в современном русском.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: и дал мне и этого
  rationale: «Этого» относится к новорождённому сыну, а повтор «и» кратко и точно передаёт גם — добавочность дара.
- source_word: וַתִּקְרָא שְׁמוֹ שִׁמְעוֹן
  choice: Поэтому она назвала его Симеоном
  rationale: Русская формула «назвала его» естественно передаёт еврейское «нарекла его имя»; «поэтому» выявляет объяснительную связь между словами Лии и именем, уже присутствующую в контексте.
theological_decisions:
- issue: Описание отношения к Лии
  choice: меня ненавидят
  alternative: меня не любят; меня любят меньше
  rationale: Еврейское שְׂנוּאָה имеет прямое сильное значение «ненавидимая». Контекст допускает сравнительную нелюбовь или отверженность, но основной текст сохраняет напряжённость исходной формулировки, а варианты разъясняются в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом, чтобы сохранить форму исходного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным ритмом. Сильное слово «ненавидят» сохранено в основном тексте; возможный сравнительный смысл вынесен в сноску. Игра слов между שָׁמַע и שִׁמְעוֹן обозначена сноской.
