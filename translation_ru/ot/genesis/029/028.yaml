lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Иаков так и сделал
  rationale: Естественно передаёт глагол עשה с наречным כֵּן и его отсылку к требованию Лавана в предыдущем стихе, не уточняя сверх текста, что именно сделал Иаков.
- source_word: וַיְמַלֵּא
  choice: завершил
  rationale: Пиэль от מלא здесь означает довести указанный период до конца; «завершил» ясно и естественно сочетается с временным периодом.
- source_word: שְׁבֻעַ זֹאת
  choice: эту свадебную неделю
  rationale: שְׁבֻעַ обозначает семидневный период, который в данном контексте является неделей свадебного пира. Уточнение «свадебную» делает культурный смысл понятным современному читателю, а буквальная семантика отмечена в сноске.
- source_word: וַיִּתֶּן לוֹ
  choice: Тогда Лаван отдал ему
  rationale: Подлежащее восстанавливается из ближайшего контекста как Лаван. «Тогда» передаёт последовательность повествования, а «отдал» естественно вводит формулу выдачи дочери замуж.
- source_word: אֶת רָחֵל בִּתּוֹ לוֹ לְאִשָּׁה
  choice: ему в жёны свою дочь Рахиль
  rationale: Русский порядок слов естественно объединяет обозначение родства и брачную формулу. «В жёны» точно передаёт לְאִשָּׁה без архаизации.
