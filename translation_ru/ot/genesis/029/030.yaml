  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: ru
  text: И вошёл он также к Рахили[a], и также любил Рахиль больше, чем Лию[b]; и служил у него ещё семь лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «вошёл к Рахили» в этом брачном контексте подразумевает супружескую близость.
    reason: Пояснение древнееврейского эвфемистического оборота.
  - marker: b
    text: 'Или: «любил Рахиль, а не Лию». Древнееврейский предлог допускает оттенок предпочтения, хотя здесь наиболее естественно сравнение: «больше, чем Лию».'
    reason: Сохранение лексической альтернативы предлога מִן.
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: И вошёл он также к Рахили
  rationale: Сохранён сдержанный древнееврейский оборот «войти к женщине», который в брачном контексте подразумевает супружескую близость. «Также» передаёт גַּם и связывает фразу с предшествующим браком с Лией.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: и полюбил Рахиль
  rationale: Глагол אָהַב передан обычным русским «любить» без отсутствующего в исходном тексте усиления. Второе גַּם естественно учитывается контекстом сопоставления, без тяжеловесного повторения «также».
- source_word: מִלֵּאָה
  choice: больше, чем Лию
  rationale: 'Предлог מִן после глагола чувства здесь естественнее всего выражает сравнение: любовь к Рахили была сильнее любви к Лии. Возможное значение предпочтения отмечено в сноске.'
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: и служил у него
  rationale: Русское «служил у него» естественно передаёт продолжение работы у Лавана и функционально отражает сочетание עבד с עִם, не добавляя имени, которого в стихе нет.
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: ещё семь лет
  rationale: Краткое и естественное русское выражение точно передаёт дополнительный семилетний срок.
theological_decisions:
- issue: Характер любви Иакова к Рахили в сопоставлении с Лией
  choice: больше, чем Лию
  alternative: а не Лию
  rationale: Сравнительное понимание лучше согласуется с конструкцией מִן и не утверждает, будто Иаков вовсе не любил Лию; при этом возможное значение предпочтения сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с библейской сдержанностью. Порядок слов «вошёл он» слегка приподнят, но остаётся понятным; эвфемизм оригинала сохранён и пояснён. Местоимение «него» не заменено именем Лавана, чтобы не вносить отсутствующее в стихе уточнение.
