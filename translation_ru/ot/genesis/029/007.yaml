lexical_decisions:
- source_word: הֵן
  choice: Послушайте
  rationale: Междометие привлекает внимание собеседников. «Послушайте» естественно передаёт эту функцию в современной русской речи; буквальное «вот» здесь звучало бы менее естественно.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: день ещё долог
  rationale: 'Сохранён образ еврейской идиомы: впереди остаётся значительная часть дня. Формулировка понятна по-русски и не сводит выражение только к указанию на светлое время суток.'
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: скот собирать пока не время
  rationale: Передаёт значение надлежащего времени и собирательный характер מִקְנֶה. Русская безличная конструкция естественна и сохраняет смысл пассивного еврейского оборота.
- source_word: הַשְׁקוּ
  choice: Напоите
  rationale: Повелительная форма каузатива שׁקה означает дать животным пить; «напоите» кратко и естественно передаёт действие.
- source_word: הַצֹּאן
  choice: мелкий скот
  rationale: צֹאן обозначает мелких стадных животных, прежде всего овец и коз. «Мелкий скот» точнее отличает этот термин от более широкого מִקְנֶה.
- source_word: וּלְכוּ
  choice: и ступайте
  rationale: Союз сохранён, а «ступайте» естественно передаёт повеление отправиться после водопоя, не усиливая последовательность сверх выраженного в тексте.
- source_word: רְעוּ
  choice: пасти его
  rationale: רעה здесь означает пасти или выпасать животных. Местоимение согласовано с собирательным существительным «скот».
