  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: ru
  text: Заверши свадебную неделю с нею[a], и мы отдадим тебе также и ту[b] в обмен на то, что ты будешь работать у меня ещё семь лет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заверши неделю этой». Имеется в виду обычная свадебная неделя, связанная с Лией.'
    reason: cultural_note
  - marker: b
    text: 'Или: «и эта также будет дана тебе» / «и тебе отдадут также и эту». Еврейская форма формально стоит в 3-м лице женского рода единственного числа; по смыслу Лаван обещает отдать Иакову и другую дочь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «которую ты будешь отрабатывать у меня». Еврейский глагол может означать «служить» или «работать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Заверши
  rationale: Повелительная форма глагола מלא требует довести установленный срок до конца; «заверши» естественно передаёт это значение и силу повеления.
- source_word: שְׁבֻעַ זֹאת
  choice: свадебную неделю с этой женщиной
  rationale: 'Буквально: «неделю этой». В контексте речь идёт о принятой свадебной неделе Лии; добавление «свадебную» раскрывает культурный смысл, а «с этой женщиной» ясно передаёт женский указательный элемент זֹאת.'
- source_word: וְנִתְּנָה לְךָ
  choice: и мы отдадим тебе
  rationale: Форма морфологически имеет вид 3-го лица женского рода единственного числа и допускает безлично-пассивное понимание, однако в речи Лавана естественно выражает его обещание отдать Иакову и другую дочь.
- source_word: גַּם אֶת זֹאת
  choice: также и ту
  rationale: Второе זֹאת указывает на Рахиль. По-русски противопоставление «с этой… и ту» естественно различает двух дочерей, сохраняя указательный характер выражения.
- source_word: בַּעֲבֹדָה
  choice: за службу
  rationale: Сочетание предлога с существительным обозначает условие или плату, за которую Лаван обещает отдать Рахиль; «за службу» кратко и точно передаёт договорной характер отношений.
- source_word: תַּעֲבֹד עִמָּדִי
  choice: которую ты будешь нести у меня
  rationale: Глагол עבד может означать как «служить», так и «работать». Выражение «нести службу у меня» сохраняет смысл подчинённой работы на Лавана и звучит естественно в данном контексте.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: ещё семь лет
  rationale: 'Так естественно передаётся добавочный срок: ещё один отдельный семилетний период.'
