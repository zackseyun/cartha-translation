translation:
  language: ru
  text: Глаза Лии были нежными[a], а Рахиль была прекрасна сложением и внешностью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мягкими», «деликатными» или «слабыми». Значение еврейского прилагательного здесь не вполне ясно: оно может указывать на мягкость или нежность, но также допускает смысл слабости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: глаза
  rationale: Форма сопряжённого множественного числа прямо обозначает глаза Лии, а не её облик в целом.
- source_word: רַכּוֹת
  choice: нежными
  rationale: Прилагательное означает мягкость, нежность или хрупкость; «нежными» сохраняет положительную либо нейтральную возможность и не вносит однозначно отрицательной оценки, как «слабые».
- source_word: יְפַת תֹּאַר
  choice: прекрасна станом
  rationale: Сочетание описывает телосложение или фигуру. «Прекрасна станом» естественно и достаточно точно передаёт отдельный акцент на форме тела.
- source_word: וִיפַת מַרְאֶה
  choice: и лицом
  rationale: מַרְאֶה обозначает видимый облик. В данном парном описании «лицом» естественно передаёт внешнюю привлекательность, не сливая её полностью с упоминанием стана.
- source_word: וְ
  choice: а
  rationale: Русское «а» естественно выражает сопоставительно-противительный характер описания Лии и Рахили, сохраняя меньшую резкость, чем «но».
