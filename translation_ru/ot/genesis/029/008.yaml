  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: ru
  text: 'Они сказали: «Мы не можем напоить овец, пока не соберутся все стада и пастухи не откатят камень от устья колодца; тогда мы напоим овец[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мелкий скот». Еврейское צֹאן — собирательное название мелкого скота, особенно овец и коз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוּכַל
  choice: не можем
  rationale: Форма первого лица множественного числа выражает неспособность совершить действие. Эллиптическое «не можем» естественно в прямой речи и сохраняет краткость еврейского текста.
- source_word: יֵאָסְפוּ
  choice: соберутся
  rationale: Нифаль от אסף здесь описывает, как стада сходятся или оказываются собраны у колодца; русское возвратное «соберутся» сохраняет возможный средне-пассивный оттенок.
- source_word: הָעֲדָרִים
  choice: стада
  rationale: עדר обозначает стадо или отару; нейтральное «стада» не уточняет без необходимости вид мелкого скота.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: и не откатят камень
  rationale: גלל означает «катить, откатывать». Неопределённо-личная форма «откатят» передаёт не названного прямо исполнителя и подразумеваемое снятие камня с отверстия.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: от устья колодца
  rationale: Буквально פִּי — «рот, уста», а здесь — отверстие колодца. «Устье колодца» сохраняет конкретный образ оригинала и остаётся понятным по-русски.
- source_word: וְהִשְׁקִינוּ
  choice: тогда мы напоим
  rationale: Хифиль от שקה означает «поить, давать пить». «Тогда» ясно передаёт последовательность действий после сбора стад и удаления камня.
- source_word: הַצֹּאן
  choice: овец
  rationale: צאן — собирательное обозначение мелкого скота, прежде всего овец и коз. В пастушеском контексте «овец» звучит естественно, а более широкое значение отмечено в сноске.
