  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: ru
  text: Когда Лаван услышал весть об Иакове[a], сыне своей сестры, он побежал ему навстречу, обнял и поцеловал его и привёл в свой дом. Иаков рассказал Лавану обо всём этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщение об Иакове».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: когда … услышал
  rationale: Предлог כְּ с инфинитивом образует придаточное времени. «Когда … услышал» естественно передаёт последовательность событий, не усиливая значение до «как только».
- source_word: שֵׁמַע יַעֲקֹב
  choice: весть об Иакове
  rationale: שֵׁמַע означает известие или сообщение о ком-либо. «Весть об Иакове» сохраняет смысл и соответствует литературному повествовательному регистру.
- source_word: בֶּן אֲחֹתוֹ
  choice: сыне своей сестры
  rationale: Перевод сохраняет явное древнееврейское обозначение родства, не заменяя его более обобщённым словом «племянник».
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: он побежал ему навстречу
  rationale: לִקְרָאתוֹ здесь естественно означает движение навстречу человеку.
- source_word: וַיְחַבֶּק לוֹ וַיְנַשֶּׁק לוֹ
  choice: обнял и поцеловал его
  rationale: Прямой и естественный перевод жестов семейного приветствия без добавления отсутствующих в тексте оттенков.
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: привёл в свой дом
  rationale: Каузативная форма בוא означает «привести», а אֶל־בֵּיתוֹ указывает на дом Лавана.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: Иаков рассказал Лавану
  rationale: Подлежащее в древнееврейском не названо явно, но по контексту им является Иаков. Имя устраняет возможную путаницу после цепочки действий Лавана.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: обо всём этом
  rationale: דְּבָרִים может обозначать слова, дела, обстоятельства или события. Контекстуально широкое «обо всём этом» сохраняет объём выражения и звучит естественно по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранено буквальное обозначение родства «сын своей сестры»; повтор местоимения после однородных сказуемых сокращён по нормам русского языка. Имя Иаков введено во втором предложении для ясного обозначения смены действующего лица.
