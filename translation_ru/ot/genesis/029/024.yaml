  source_fidelity: 'Текст точно передаёт синтаксис и смысл еврейского оригинала: Лаван передаёт Зелфу, уже названную его служанкой, Лии, своей дочери, в качестве служанки. Конструкция «отдал ... в служанки» естественно выражает заключительное שִׁפְחָה как назначенную роль и не требует добавления местоимения «её».'
