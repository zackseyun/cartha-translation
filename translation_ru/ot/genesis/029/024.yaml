  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: ru
  text: И отдал Лаван Зелфу, свою служанку, своей дочери Лии в служанки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «рабыня» и указывает на зависимое, вероятно рабское, положение женщины.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Форма от נתן означает «дал, передал». В контексте передачи служанки дочери русское «отдал» естественно выражает направленность действия, не добавляя сверх текста идеи продажи или назначения.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: своей дочери Лии
  rationale: 'Буквально местоимение означает «ей», а последующая конструкция уточняет: «Лии, дочери своей». По-русски единая группа устраняет ненужный повтор и ясно сохраняет получателя и родственную связь.'
- source_word: זִלְפָּה
  choice: Зелфу
  rationale: Использована закрепившаяся в русской библейской традиции форма имени «Зелфа», поставленная в винительном падеже.
- source_word: שִׁפְחָתוֹ
  choice: свою служанку
  rationale: שִׁפְחָה обозначает зависимую женщину-служанку, вероятно находившуюся в рабском положении. «Служанка» естественно для современного литературного русского; социальный оттенок поясняется в сноске.
- source_word: שִׁפְחָה
  choice: в служанки
  rationale: Конечное существительное указывает роль, в которой Зелфа передана Лии. Русская конструкция «отдал ... в служанки» естественно передаёт это значение и сохраняет повтор того же еврейского слова на смысловом уровне.
