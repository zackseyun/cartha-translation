lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: Иаков отправился в путь
  rationale: 'Буквально: «Иаков поднял свои ноги». Это древнееврейский идиоматический оборот, означающий, что он продолжил или начал путь; естественный русский эквивалент сохраняет значение движения без неуместной буквальности.'
- source_word: אַרְצָה
  choice: пришёл в землю
  rationale: Направительный суффикс выражает движение к месту; глагол וַיֵּלֶךְ буквально означает «пошёл», однако в сочетании с пунктом назначения по-русски естественно передать результат движения как «пришёл».
- source_word: בְנֵי קֶדֶם
  choice: сынов Востока
  rationale: Сохранён традиционный и формально близкий этногеографический оборот. קֶדֶם может обозначать «восток» и «древность», но здесь контекст указывает на восточную область и её жителей.
