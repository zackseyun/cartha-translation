  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: ru
  text: 'Он спросил их: «Здоров ли он?»[a] Они ответили: «Здоров. А вот и его дочь Рахиль идёт со стадом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё ли у него благополучно?» Еврейское слово шалом здесь означает здоровье и благополучие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Здоров ли он?
  rationale: שָׁלוֹם в этой формуле обозначает благополучие человека, а не отвлечённый мир; вопрос «Здоров ли он?» естественно передаёт смысл в современном русском.
- source_word: שָׁלוֹם
  choice: Здоров
  rationale: Краткий ответ зеркально повторяет вопрос и подтверждает благополучие Лавана; русское именное сказуемое не требует связки в настоящем времени.
- source_word: וְהִנֵּה
  choice: А вот и
  rationale: Оборот привлекает внимание к появлению Рахили непосредственно перед говорящими; «А вот и» естественно передаёт указательную и событийную силу выражения.
- source_word: רָחֵל
  choice: Рахиль
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: בִּתּוֹ
  choice: его дочь
  rationale: Местоименный суффикс относится к Лавану; родственная связь сохранена явно.
- source_word: בָּאָה
  choice: идёт
  rationale: Форма описывает наблюдаемое в данный момент приближение; настоящее время естественно для непосредственной сцены.
- source_word: עִם הַצֹּאן
  choice: со стадом
  rationale: צֹאן — собирательное обозначение мелкого скота, обычно овец и коз; «стадо» шире и точнее, чем одни только «овцы».
