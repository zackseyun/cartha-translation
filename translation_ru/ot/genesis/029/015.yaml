  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: ru
  text: 'Тогда Лаван сказал Иакову[a]: «Разве потому, что ты мой родственник, ты будешь работать на меня даром? Скажи мне, какой должна быть твоя плата».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мой брат»; здесь — в более широком смысле: родственник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Неужели из-за того, что
  rationale: Передаёт риторический характер вопроса и связь родства с последующим упоминанием бесплатного труда, не превращая фразу в простое утверждение причины.
- source_word: אָחִי
  choice: мой родственник
  rationale: 'Буквально «мой брат», но здесь слово обозначает более широкое родство: Иаков — племянник Лавана. «Родственник» ясно и естественно передаёт смысл без ложного указания на родного брата.'
- source_word: וַעֲבַדְתַּנִי
  choice: ты будешь работать на меня
  rationale: В контексте договорённости о вознаграждении עבד означает трудиться на Лавана. Будущее время естественно выражает риторический вопрос о дальнейшем труде Иакова.
- source_word: חִנָּם
  choice: даром
  rationale: Кратко и идиоматично обозначает труд без платы, сохраняя связь с последующим вопросом о вознаграждении.
- source_word: הַגִּידָה לִּי
  choice: Скажи мне
  rationale: Естественная современная передача повелительной формы с косвенным дополнением.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: какой должна быть твоя плата
  rationale: «Плата» естественно обозначает вознаграждение за труд; конструкция «должна быть» соответствует ситуации установления условий, а не сообщения уже назначенной суммы.
