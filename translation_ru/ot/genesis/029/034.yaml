  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: ru
  text: 'Она снова забеременела и родила сына. Она сказала: «Теперь, на этот раз, мой муж привяжется ко мне[a], ведь я родила ему троих сыновей». Поэтому его назвали Левием.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «присоединится ко мне». Еврейский глагол созвучен имени Левий.'
    reason: Передать лексическую альтернативу и игру слов между объяснением Лии и именем ребёнка.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Она снова забеременела
  rationale: Глагол הרה обозначает зачатие или наступление беременности, а עוֹד — повторность. Современное «забеременела» естественно и однозначно.
- source_word: וַתֵּלֶד בֵּן
  choice: и родила сына
  rationale: Стандартное повествовательное выражение со значением рождения сына; перевод краток и естественен по-русски.
- source_word: עַתָּה הַפַּעַם
  choice: Теперь, на этот раз
  rationale: Сохранены оба усилительных элемента еврейского выражения без добавления отсутствующего в тексте «наконец».
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: мой муж привяжется ко мне
  rationale: Форма Niphal от לוה передаёт присоединение или тесную связь и образует звуковую игру с именем Левий. «Привяжется ко мне» естественно выражает надежду Лии на близость мужа.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: ведь я родила ему троих сыновей
  rationale: כִּי вводит основание сказанного; לוֹ сохранено словом «ему», а одушевлённая форма «троих» соответствует современной литературной норме.
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: Поэтому его назвали Левием
  rationale: Безлично-неопределённая русская конструкция не навязывает не названного в еврейском тексте деятеля и естественно передаёт формулу наречения имени.
theological_decisions:
- issue: Игра слов между יִלָּוֶה и לֵוִי
  choice: В основном тексте «привяжется ко мне», с альтернативой «присоединится ко мне» в сноске
  alternative: соединится со мной / присоединится ко мне
  rationale: Перевод сохраняет смысл надежды Лии на более тесную связь с мужем, а сноска отмечает иное возможное значение и недоступную полному воспроизведению еврейскую игру слов.
- issue: Неуказанный деятель при קָרָא שְׁמוֹ
  choice: его назвали Левием
  alternative: он назвал его Левием / она назвала его Левием
  rationale: В еврейском тексте глагол стоит в мужском роде единственного числа, но явный субъект отсутствует. Русская неопределённо-личная конструкция не разрешает эту неясность произвольно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся простым и доступным; архаизмы и конфессионально окрашенные формулировки не используются.
