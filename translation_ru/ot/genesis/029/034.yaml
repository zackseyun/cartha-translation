  source_fidelity: 'Текст точно передаёт последовательность еврейского повествования: повторное зачатие, рождение сына, слова Лии, основание её надежды и этиологическое наречение имени. «Мой муж привяжется ко мне» адекватно передаёт יִלָּוֶה ... אֵלַי как надежду на тесную связь, не снимая образной окраски. Неопределённо-личное «его назвали» уместно не навязывает субъект при невыраженном субъекте еврейского глагола.'
  naturalness: Перевод звучит естественно на современном литературном русском. «Теперь, на этот раз» несколько подчёркнуто, но оправданно воспроизводит усиленное עַתָּה הַפַּעַם. Формы «забеременела», «родила», «троих сыновей» и «его назвали Левием» ясны и соответствуют нейтральному библейскому повествовательному регистру.
