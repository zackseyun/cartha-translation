  text: וַ/יֹּ֣אמֶר לָבָ֔ן לֹא יֵעָשֶׂ֥ה כֵ֖ן בִּ/מְקוֹמֵ֑/נוּ לָ/תֵ֥ת הַ/צְּעִירָ֖ה לִ/פְנֵ֥י הַ/בְּכִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: ru
  text: 'Лаван сказал: «В наших местах[a] так не поступают — не отдают[b] младшую прежде старшей[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «у нас» или «в нашей местности»; буквально с еврейского — «в нашем месте», то есть согласно местному обычаю.
    reason: lexical_alternative
  - marker: b
    text: То есть не отдают замуж; слова «замуж» в еврейском тексте подразумеваются контекстом.
    reason: lexical_alternative
  - marker: c
    text: Буквально — «первородной»; речь идёт о старшей дочери, первой по рождению.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; нейтральное «сказал» естественно для современного русского повествования.
- source_word: לָבָן
  choice: Лаван
  rationale: Традиционная русская передача личного имени.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: так не поступают
  rationale: Безличная конструкция передаёт не невозможность действия, а принятую местную норму или обычай.
- source_word: בִּמְקוֹמֵנוּ
  choice: в наших местах
  rationale: Сохраняет конкретный образ «места» и естественно указывает на местный обычай; буквальное «в нашем месте» по-русски менее идиоматично.
- source_word: לָתֵת
  choice: отдают
  rationale: Передаёт простое значение נתן «дать, отдать», не вводя прямо подразумеваемое контекстом «замуж».
- source_word: הַצְּעִירָה
  choice: младшую
  rationale: Прилагательное употреблено субстантивно и обозначает младшую из двух женщин; слово «дочь» в еврейском тексте подразумевается контекстом.
- source_word: לִפְנֵי
  choice: прежде
  rationale: Здесь предлог обозначает очередность и предшествование, а не пространственное положение.
- source_word: הַבְּכִירָה
  choice: старшей
  rationale: В данном противопоставлении естественно обозначает старшую дочь; оттенок первородства сохраняется в примечании.
theological_decisions: []
