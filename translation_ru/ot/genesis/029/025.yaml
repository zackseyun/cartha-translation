base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: ru
  text: 'Утром оказалось, что это Лия. И Иаков сказал Лавану: «Что ты со мной сделал? Разве не ради Рахили я работал у тебя? Так зачем же ты меня обманул?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: оказалось
  rationale: Передаёт внезапное обнаружение и повествовательную неожиданность еврейского оборота; буквальное «вот» здесь звучало бы менее естественно по-русски.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: я работал у тебя
  rationale: В данном контексте עבד означает служить или работать на Лавана; естественное русское выражение «работал у тебя» точно передаёт отношение сторон.
- source_word: וְלָמָּה
  choice: так зачем же
  rationale: Сохраняет связь вопроса с предшествующим доводом и усиливает выраженное в еврейском тексте возмущение.
- source_word: רִמִּיתָנִי
  choice: ты меня обманул
  rationale: Прямо передаёт значение глагола רמה — обмануть, поступить вероломно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, драматической внезапности и обвинительного тона оригинала. Имя Иаков добавлено вместо местоимения для естественной ясности в отдельно цитируемом стихе.
