lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Пока он ещё говорил с ними
  rationale: Идиома с причастием обозначает продолжающееся действие, на фоне которого происходит следующее событие; русская конструкция естественно передаёт одновременность.
- source_word: וְרָחֵל בָּאָה
  choice: пришла Рахиль
  rationale: Форма בָּאָה продвигает повествование; порядок слов с постпозицией имени естественен при введении нового действующего лица в сцену.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: со стадом своего отца
  rationale: צֹאן — собирательное обозначение мелкого скота; «стадо» сохраняет обобщённость, а принадлежность, выраженная относительной конструкцией, естественно передана притяжательным оборотом.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему Рахиль пришла вместе со стадом.
- source_word: רֹעָה הִוא
  choice: она пасла его
  rationale: Женская форма причастия רֹעָה может обозначать как занятие в данный момент, так и роль пастуха. В контексте действие «пасла» звучит по-русски естественно и сохраняет связь со стадом, не вводя стилистически маркированное «пастушка».
