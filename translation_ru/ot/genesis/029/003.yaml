base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: ru
  text: Когда там собирались все стада, камень откатывали от отверстия колодца[a], поили овец, а затем возвращали камень на место над отверстием колодца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уста колодца», то есть его отверстие.'
    reason: Сохраняет древнееврейский образ при ясном основном переводе.
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: собирались
  rationale: Нифаль, имперфект 3-го лица множественного числа, в данном описании передаёт обычное, повторявшееся действие.
- source_word: שָׁמָּה
  choice: там
  rationale: Естественная русская передача наречия места.
- source_word: כָל הָעֲדָרִים
  choice: все стада
  rationale: עֲדָרִים обозначает стада пасущегося мелкого скота; множественное число сохранено.
- source_word: וְגָלֲלוּ
  choice: откатывали
  rationale: Глагол сохраняет конкретный образ перемещения тяжёлого камня и в контексте выражает повторявшееся действие.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: от устья колодца
  rationale: Буквальный образ «уста колодца» в современном русском естественно передаётся словом «устье», то есть отверстие колодца.
- source_word: וְהִשְׁקוּ
  choice: поили
  rationale: Каузативная форма глагола שׁקה означает «давать пить, поить».
- source_word: אֶת הַצֹּאן
  choice: скот
  rationale: צֹאן — собирательное обозначение мелкого скота; «скот» сохраняет собирательность и не сужает значение исключительно до овец.
- source_word: וְהֵשִׁיבוּ
  choice: возвращали
  rationale: Хифиль от שוב означает побуждение к возвращению; применительно к камню — возвращать его на место.
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: на прежнее место, к устью колодца
  rationale: Передаёт как возвращение камня на установленное место, так и его расположение у отверстия колодца, не перегружая русскую фразу.
