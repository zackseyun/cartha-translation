translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской образностью. Безлично-неопределённые формы «откатывали», «поили», «возвращали» не вводят в текст прямо не названных «пастухов» и естественно передают повторявшийся порядок действий.
