review_pass:
  verdict: revise
  source_fidelity: 'Основная временная и повторительная характеристика передана верно: «Когда ... собирались» и формы прошедшего несовершенного вида естественно выражают обычный порядок действий. Однако «скот» чрезмерно широко для צֹאן, которое в данном пастушеском контексте обозначает овец/мелкий скот. Оборот «на прежнее место, к устью колодца» не передаёт достаточно ясно, что камень вновь помещали на отверстие колодца.'
  naturalness: '«Устье колодца» и особенно «к устью колодца» звучат неестественно в современном русском: устье обычно относится к реке, а предлог «к» обозначает лишь направление, не положение камня над отверстием. «Отверстие колодца» и «на место над отверстием колодца» ясны и литературно естественны.'
  terminology: «Стада» для עֲדָרִים приемлемо. Для הַצֹּאן в непосредственном контексте предпочтительно «овец», а не общее «скот». Сноска сохраняет возможность показать еврейский образ «уста колодца».
  issues:
  - severity: medium
    issue: «Скот» для הַצֹּאן
    rationale: Русское «скот» может включать крупный скот, тогда как צֹאן относится к мелкому скоту; в данном контексте естественно и точнее «овец».
  - severity: medium
    issue: «На прежнее место, к устью колодца»
    rationale: Предлог «к» не выражает, что камень вновь лежал на/над отверстием; кроме того, «устье колодца» в современном русском неудачно. Следует прямо обозначить отверстие и положение камня над ним.
  revised_text: Когда там собирались все стада, камень откатывали от отверстия колодца[a], поили овец, а затем возвращали камень на место над отверстием колодца.
  revised_footnotes:
