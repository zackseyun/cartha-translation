revisions:
- from: Когда там собирались все стада, камень откатывали от устья колодца[a], поили скот, а затем возвращали камень на прежнее место, к устью колодца.
  to: Когда там собирались все стада, камень откатывали от отверстия колодца[a], поили овец, а затем возвращали камень на место над отверстием колодца.
  rationale: 'Исправлены две смысловые и стилистические неточности: צֹאן передано как «овец», а расположение возвращённого камня — как положение над отверстием колодца. Безлично-неопределённые формы и повторительный характер действия сохранены.'
