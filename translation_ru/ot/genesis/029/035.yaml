source:
  edition: WLC
  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: ru
  text: 'И снова она зачала и родила сына. Она сказала: «На этот раз я прославлю Яхве». Поэтому она назвала его Иудой[a]. После этого она перестала рожать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Иуда созвучно еврейскому глаголу со значением «прославлять», «хвалить» или «благодарить».
    reason: Сноска передаёт игру слов между יְהוּדָה и формой глагола ידה, которую невозможно воспроизвести русским именем без пояснения.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: И снова она зачала
  rationale: Глагол הרה означает зачатие или наступление беременности, а עוֹד в последовательности рождений указывает на повторение. Формулировка сохраняет краткость еврейского повествования.
- source_word: וַתֵּלֶד בֵּן
  choice: и родила сына
  rationale: Это естественная русская передача обычного еврейского выражения о рождении ребёнка.
- source_word: הַפַּעַם
  choice: На этот раз
  rationale: Выражение выделяет нынешнее рождение на фоне предшествующих, не добавляя прямо не выраженной эмоциональной окраски.
- source_word: אוֹדֶה
  choice: я прославлю
  rationale: Форма глагола ידה может обозначать хвалу или благодарение. «Прославлю» естественно передаёт обращённую к Богу хвалу и сохраняет связь с объяснением имени, которая раскрыта в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Союз ясно передаёт причинно-следственную связь между словами женщины и наречением имени.
- source_word: קָרְאָה שְׁמוֹ יְהוּדָה
  choice: она назвала его Иудой
  rationale: Идиома «назвала его имя» передана естественной русской конструкцией; использована закрепившаяся русская форма имени יְהוּדָה.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: После этого она перестала рожать
  rationale: Сочетание עמד с מן и инфинитивом означает прекращение действия. Русская формулировка кратка, естественна и не утверждает, что прекращение было окончательным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Значение אוֹדֶה
  choice: я прославлю
  alternative: я возблагодарю; я буду хвалить
  rationale: Глагол ידה допускает оттенки хвалы и благодарения. «Прославлю» сохраняет эту смысловую широту настолько, насколько позволяет краткая русская формулировка; возможный оттенок благодарения отмечен в сноске о словообразовательной связи.
- issue: Характер прекращения деторождения
  choice: она перестала рожать
  alternative: она больше не рожала
  rationale: Еврейская конструкция сообщает о прекращении на данном этапе повествования, но сама по себе не требует вывода, что это состояние осталось окончательным.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейского повествования синтаксисом. Союзные цепочки оригинала умеренно разделены на предложения ради естественности, при этом последовательность событий и причинная связь сохранены.
