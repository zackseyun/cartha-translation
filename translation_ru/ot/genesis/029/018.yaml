  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: ru
  text: 'Иаков любил Рахиль и сказал: «Я буду служить тебе семь лет за Рахиль, твою младшую дочь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: любил
  rationale: Глагол אָהַב прямо обозначает любовь. «Любил» точно передаёт форму и не добавляет более узкого оттенка «был влюблён».
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычное значение אמר естественно вводит прямую речь без дополнительной конкретизации.
- source_word: אֶעֱבָדְךָ
  choice: буду служить тебе
  rationale: עבד здесь означает труд, совершаемый для Лавана в рамках брачной договорённости. «Служить тебе» сохраняет как трудовой, так и личный характер отношений.
- source_word: שֶׁבַע שָׁנִים
  choice: семь лет
  rationale: Прямой и однозначный перевод числительного с существительным.
- source_word: בְּרָחֵל
  choice: за Рахиль
  rationale: 'Предлог ב здесь выражает основание или предмет обмена: семь лет службы за возможность взять Рахиль в жёны. Краткое «за Рахиль» естественно в данном контексте и не расширяет исходный текст.'
- source_word: בִּתְּךָ
  choice: твою дочь
  rationale: Прямая передача существительного в сопряжённой форме с местоименным суффиксом второго лица мужского рода единственного числа.
- source_word: הַקְּטַנָּה
  choice: младшую
  rationale: Хотя основное значение прилагательного — «маленькая», при сопоставлении сестёр оно естественно означает «младшая».
- source_word: וַ
  choice: и
  rationale: Начальные повествовательные союзы продолжают рассказ. В русском «и» естественно связывает два действия стиха; отдельное вводное слово не требуется.
