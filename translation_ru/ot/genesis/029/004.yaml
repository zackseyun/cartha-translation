lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם יַעֲקֹב
  choice: Иаков сказал им
  rationale: Сохраняется обычное значение אמר — «сказать» — и явно передаётся косвенное дополнение לָהֶם («им»); порядок слов естественен для современного русского языка.
- source_word: אַחַי
  choice: Братья мои
  rationale: Буквально «мои братья». Притяжательное местоимение сохранено, а обращение передано без предположения о буквальном родстве; его вежливый характер поясняется в сноске.
- source_word: מֵאַיִן אַתֶּם
  choice: откуда вы?
  rationale: מֵאַיִן спрашивает о происхождении или месте прибытия. Русское «откуда вы?» точно и естественно передаёт конструкцию без добавления глагола.
- source_word: וַיֹּאמְרוּ
  choice: Они ответили
  rationale: Хотя אמר буквально означает «сказали», в данной реплике контекстуальное «ответили» естественно передаёт функцию речи, не меняя содержания.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Мы из Харрана
  rationale: Предлог מִן указывает на место происхождения, а независимое אֲנָחְנוּ означает «мы». Русская именная конструкция без связки естественна в настоящем времени.
