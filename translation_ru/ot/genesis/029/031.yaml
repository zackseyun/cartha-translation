  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: ru
  text: Господь увидел, что Лию ненавидели, и открыл её утробу, а Рахиль была бесплодна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: Лию ненавидели
  rationale: Страдательное причастие буквально выражает, что Лия была объектом ненависти. Безличная конструкция естественна по-русски и сохраняет более сильный смысл исходного слова, не смягчая его до «не любили».
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: открыл её утробу
  rationale: Сохранён древнееврейский образ, обозначающий дарованную способность зачать; он понятен в контексте и поддерживает связь с последующим противопоставлением бесплодию Рахили.
- source_word: עֲקָרָה
  choice: была бесплодна
  rationale: Прямой и естественный русский эквивалент, точно передающий состояние Рахили.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, соответствующая принятому в данном издании стилю.
theological_decisions:
- issue: Степень отчуждения Лии
  choice: ненавидели
  alternative: не любили / любили меньше
  rationale: Исходное שְׂנוּאָה непосредственно означает «ненавидимая». Контекст может подразумевать сравнительное предпочтение Рахили, однако перевод не должен без пояснения ослаблять сильную формулировку еврейского текста.
- issue: Божье действие и зачатие
  choice: открыл её утробу
  alternative: дал ей способность иметь детей
  rationale: Буквальный образ сохраняет прямую связь плодовитости Лии с действием Господа и не вводит дополнительных медицинских или догматических уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов слегка адаптирован к естественной русской речи; резкое противопоставление положения Лии и Рахили сохранено.
