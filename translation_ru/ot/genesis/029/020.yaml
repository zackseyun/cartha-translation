  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: ru
  text: И служил Иаков за Рахиль семь лет, и они казались ему лишь несколькими днями, потому что он любил её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: служил
  rationale: Глагол עבד обозначает как труд, так и служение. В данном контексте Иаков исполняет оговорённую службу ради брака с Рахилью; «служил» сохраняет договорно-личный оттенок лучше, чем нейтральное «работал».
- source_word: בְּרָחֵל
  choice: за Рахиль
  rationale: Предлог ב в контексте брачной договорённости указывает, ради кого и в обмен на брак с кем совершается служение. Русское «служил за Рахиль» кратко и сохраняет форму и смысл контекста.
- source_word: שֶׁבַע שָׁנִים
  choice: семь лет
  rationale: Прямое соответствие числительному и существительному исходного текста.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: они казались ему
  rationale: Еврейское «были в его глазах» является идиомой субъективного восприятия; «казались ему» естественно передаёт её смысл по-русски.
- source_word: כְּיָמִים אֲחָדִים
  choice: лишь несколькими днями
  rationale: Выражение буквально означает «как немногие дни». «Лишь несколькими днями» естественно передаёт ощущение краткости, не меняя образ дней.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: потому что он любил её
  rationale: Конструкция указывает на любовь Иакова к Рахили как причину его восприятия семи лет. Глагольная русская формулировка ясна, естественна и не добавляет нового смысла.
