  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: ru
  text: 'У Лавана было две дочери: старшую звали Лия, а младшую — Рахиль.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имя старшей — Лия, а имя младшей — Рахиль».'
    reason: Буквальная формула имянаречения в еврейском тексте передана более естественной русской конструкцией.
lexical_decisions:
- source_word: וּלְלָבָן
  choice: У Лавана было
  rationale: 'Еврейская конструкция с предлогом לְ выражает обладание: буквально «у Лавана [были]», что естественно и близко передаётся русской конструкцией «у Лавана было». Начальный וּ выполняет связующую повествовательную функцию и не требует отдельного «и» вне более широкого контекста.'
- source_word: שְׁתֵּי בָנוֹת
  choice: две дочери
  rationale: Прямое соответствие числительного и существительного.
- source_word: שֵׁם הַגְּדֹלָה לֵאָה
  choice: старшую звали Лия
  rationale: 'Буквально: «имя старшей — Лия». В современном русском формула «старшую звали Лия» естественнее, сохраняет значение и параллелизм следующей части.'
- source_word: הַגְּדֹלָה
  choice: старшую
  rationale: При сопоставлении двух сестёр обозначает старшую по возрасту, а не большую по размеру.
- source_word: לֵאָה
  choice: Лия
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: וְשֵׁם הַקְּטַנָּה רָחֵל
  choice: а младшую — Рахиль
  rationale: Противительно-сопоставительное «а» естественно передаёт параллельное противопоставление старшей и младшей; эллипсис глагола «звали» сохраняет ясность и создаёт естественный русский ритм.
- source_word: הַקְּטַנָּה
  choice: младшую
  rationale: В контексте двух сестёр означает младшую по возрасту.
- source_word: רָחֵל
  choice: Рахиль
  rationale: Устоявшаяся русская библейская форма личного имени.
