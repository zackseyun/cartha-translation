  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: ru
  text: 'Тогда Иаков сказал Лавану: «Дай мне мою жену, потому что срок мой истёк, чтобы я вошёл к ней[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Войти к ней» — принятый в древнееврейском языке эвфемизм, означающий вступление в супружескую близость.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה אֶת אִשְׁתִּי
  choice: Отдай мне мою жену
  rationale: Формула требования הָבָה в данном контексте обращена к Лавану, от которого Иаков ожидает исполнения соглашения. «Жену» передаёт брачное значение אִשָּׁה, а «отдай» естественно выражает требование предоставить обещанную невесту, не подразумевая, что она принадлежит Лавану как вещь.
- source_word: כִּי מָלְאוּ יָמָי
  choice: потому что срок мой исполнился
  rationale: Буквально речь идёт о том, что «дни» Иакова наполнились или завершились, то есть истёк условленный срок его службы. Единственное число «срок» ясно передаёт этот смысл, а «исполнился» сохраняет образность оригинала.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: и я войду к ней
  rationale: Сохранён обычный древнееврейский эвфемизм בוא אל для супружеской близости. Форма с когортативным оттенком выражает намерение или желаемое следствие после исполнения требования.
