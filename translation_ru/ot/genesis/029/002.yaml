base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: ru
  text: Он увидел — и вот, в поле был колодец; и вот, возле него лежали три стада мелкого скота, потому что из того колодца поили стада. А на отверстии колодца был большой камень.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Он увидел
  rationale: Обычное повествовательное значение ראה; «увидел» естественно вводит открывшуюся Иакову картину.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: и вот ... и вот
  rationale: Повтор сохранён ради присущей еврейскому повествованию наглядности и живости.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: в поле колодец
  rationale: Прямая и естественная передача; שׂדה здесь допускает поле или открытую местность, но контекст не требует расширения.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: три стада мелкого скота
  rationale: צֹאן обозначает мелкий домашний скот — овец и коз; эта передача не сужает значение только до овец.
- source_word: רֹבְצִים עָלֶיהָ
  choice: возле него лежат
  rationale: רבץ описывает лежащих животных, а עַל при колодце естественно выражает нахождение рядом с ним.
- source_word: יַשְׁקוּ הָעֲדָרִים
  choice: поили стада
  rationale: Форма допускает неопределённого человеческого деятеля; русская неопределённо-личная конструкция сохраняет это без добавления субъекта.
- source_word: עַל פִּי הַבְּאֵר
  choice: закрывавший отверстие колодца
  rationale: Буквально «на устах колодца»; по смыслу камень находился над его отверстием. Причастная конструкция ясно передаёт расположение.
- source_word: וְהָאֶבֶן גְּדֹלָה
  choice: А камень ... был большим
  rationale: Сохранено самостоятельное описательное предложение, подготавливающее дальнейшее повествование.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Двойное «и вот» сохранено как значимый повествовательный приём; значение צֹאן не сужено до одних овец.
