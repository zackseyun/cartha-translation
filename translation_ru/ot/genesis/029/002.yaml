    issue: «закрывавший отверстие колодца»
    rationale: В еврейском тексте сказано, что большой камень находился «на устье/отверстии колодца»; причастие «закрывавший» добавляет функциональное утверждение, не выраженное непосредственно в стихе. Контекст следующего стиха может объяснять расположение камня, но не следует вносить это объяснение в данный основной текст.
  revised_text: Он увидел — и вот, в поле был колодец; и вот, возле него лежали три стада мелкого скота, потому что из того колодца поили стада. А на отверстии колодца был большой камень.
