  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: ru
  text: Когда Иаков увидел Рахиль[a], дочь Лавана, брата своей матери, и стадо Лавана, брата своей матери, он подошёл, откатил камень от устья колодца и напоил стадо Лавана, брата своей матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте выражение «брата своей матери» повторяется в этом стихе трижды, подчёркивая родственную связь Иакова с Лаваном.
    reason: literary_feature
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: В русском повествовании временное «Когда» естественно передаёт переход к следующему событию; буквальное «И было, когда» здесь звучало бы архаично и тяжеловесно.
- source_word: רָאָה
  choice: увидел
  rationale: Глагол обозначает непосредственное зрительное восприятие; «увидел» точно и естественно в данном контексте.
- source_word: בַּת לָבָן
  choice: дочь Лавана
  rationale: Сохраняется простое родственное определение Рахили без ненужного добавления связки.
- source_word: אֲחִי אִמּוֹ
  choice: брата своей матери
  rationale: Так сохраняются конкретная форма родства и троекратный повтор исходного текста; более краткое «своего дяди» устранило бы этот выразительный повтор.
- source_word: צֹאן
  choice: стадо
  rationale: Собирательное слово может обозначать мелкий домашний скот, включая овец и коз; «стадо» не сужает значение до одних овец.
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Передаёт физическое приближение Иакова к колодцу и звучит естественно в современном русском повествовании.
- source_word: וַיָּגֶל
  choice: откатил
  rationale: Глагол конкретно описывает перекатывание камня, а не просто его удаление.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: от устья колодца
  rationale: «Устье» сохраняет образ «рта/отверстия» колодца и при этом является понятным литературным русским выражением.
- source_word: וַיַּשְׁקְ
  choice: напоил
  rationale: Каузативная форма означает дать животным воды; «напоил стадо» кратко и идиоматично.
theological_decisions: []
