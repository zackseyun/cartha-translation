  text: И собрал Лаван всех мужчин того места и устроил пир[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех жителей того места». Буквально в еврейском тексте: «всех мужчин того места»; мужская форма сохранена, поскольку, вероятно, речь идёт о местных мужчинах, приглашённых на свадебное торжество.'
