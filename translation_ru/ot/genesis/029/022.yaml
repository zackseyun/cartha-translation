lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Глагол אסף здесь означает собрать людей вместе; «собрал» естественно и точно передаёт действие.
- source_word: לָבָן
  choice: Лаван
  rationale: Использована традиционная русская библейская передача имени.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: всех мужчин того места
  rationale: אַנְשֵׁי — форма множественного числа мужского рода от אִישׁ в сопряжённом состоянии, буквально «мужчин [этого] места». Формулировка сохраняет мужской род и не уточняет без необходимости, было ли это поселение городом.
- source_word: וַיַּעַשׂ
  choice: устроил
  rationale: Хотя עשה буквально имеет широкое значение «делать», в сочетании с обозначением пира по-русски естественно сказать «устроил пир».
- source_word: מִשְׁתֶּה
  choice: пир
  rationale: מִשְׁתֶּה обозначает праздничное застолье, часто с употреблением вина; «пир» кратко и уместно передаёт это значение в контексте свадьбы.
