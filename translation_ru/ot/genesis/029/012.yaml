  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: ru
  text: Иаков сказал Рахили, что он родственник её отца[a] и сын Ревекки. Тогда она побежала и рассказала об этом своему отцу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «брат её отца». В еврейском языке слово «брат» могло обозначать близкого родственника; Иаков приходился Лавану племянником.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: сказал
  rationale: Порода hифиль глагола נגד означает «сообщить, рассказать, дать знать»; «сказал» естественно вводит содержание сообщения в данном контексте.
- source_word: כִּי
  choice: что
  rationale: Оба употребления כִּי вводят содержание сообщения после глагола речи.
- source_word: אֲחִי אָבִיהָ
  choice: родственник её отца
  rationale: Слово אָח буквально означает «брат», но может обозначать и близкого родственника. По родословной Иаков — племянник Лавана, поэтому перевод передаёт смысл выражения, а буквальная форма отмечена в сноске.
- source_word: בֶן רִבְקָה
  choice: сын Ревекки
  rationale: Прямое и естественное соответствие еврейскому сочетанию «сын Ревекки».
- source_word: וַתָּרָץ
  choice: она побежала
  rationale: Глагол רוץ обозначает бег и сохраняет живое движение повествования.
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: рассказала об этом своему отцу
  rationale: נגד здесь означает «сообщить, рассказать»; добавление «об этом» естественно по-русски обозначает содержание сообщения, подразумеваемое оригиналом, а возвратное «своему» ясно указывает на отца Рахили.
