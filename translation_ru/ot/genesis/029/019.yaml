  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: ru
  text: 'Лаван сказал: «Лучше мне отдать её тебе, чем отдать её другому мужчине. Оставайся у меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר, вводящая прямую речь.
- source_word: טוֹב תִּתִּי אֹתָהּ לָךְ
  choice: лучше мне отдать её тебе
  rationale: В сравнительной конструкции טוֹב с מִן естественно передаётся по-русски словом «лучше»; инфинитив с суффиксом первого лица сохранён конструкцией «мне отдать».
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: чем отдать её другому мужчине
  rationale: Сравнительное מִן передано союзом «чем»; формулировка сохраняет прямой смысл еврейского текста.
- source_word: אִישׁ אַחֵר
  choice: другому мужчине
  rationale: Буквально «другому мужчине». Вариант «другому мужу» внёс бы не выраженную прямо интерпретацию.
- source_word: שְׁבָה עִמָּדִי
  choice: оставайся у меня
  rationale: Императив ישׁב здесь означает продолжать жить или находиться у Лавана; «оставайся у меня» естественно и ясно передаёт контекст.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; прямая и сдержанная повествовательная речь. Конструкция «лучше мне отдать» сохраняет личный субъект инфинитива и сравнительный смысл оригинала без лишней конкретизации брачных отношений.
