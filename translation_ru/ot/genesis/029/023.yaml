lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Когда наступил вечер
  rationale: Естественная современная передача повествовательной формулы и временного оборота; она сохраняет последовательность событий без архаичного «и было вечером».
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: он взял свою дочь Лию
  rationale: Передаёт прямое значение לקח и естественно оформляет приложение לֵאָה בִתּוֹ по-русски, не добавляя мотивов или оценки поступка.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: привёл её к Иакову
  rationale: Каузативная форма בוא означает «привести/доставить». Имя «Иаков» проясняет местоименную отсылку в русском тексте, не меняя её референта.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: и тот вошёл к ней
  rationale: Сохранён традиционный эвфемистический оборот со значением половой близости. «Тот» естественно возвращает субъект к Иакову после упоминания Лавана.
