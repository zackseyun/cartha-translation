base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: ru
  text: Эти трое — сыновья Ноя, и от них населилась вся земля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и от них рассеялась вся земля»; также: «распространилась».'
    reason: Лексическое примечание сохраняет более прямое значение глагола נפץ и метонимический строй еврейской фразы.
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: Эти трое
  rationale: Естественная русская передача вынесенной вперёд именной группы с сохранением указательного акцента.
- source_word: בְּנֵי נֹחַ
  choice: сыновья Ноя
  rationale: Прямая передача сопряжённой конструкции; настоящее именное предложение сохраняет обобщающий характер стиха.
- source_word: וּמֵאֵלֶּה
  choice: и от них
  rationale: Предлог מִן указывает на происхождение; местоимение естественно отсылает к только что названным трём сыновьям.
- source_word: נָפְצָה
  choice: расселилась
  rationale: Глагол נפץ выражает рассеяние, разнесение или распространение. «Расселилась» сохраняет образ движения и в данном родословном контексте понятно обозначает распространение человечества.
- source_word: כָל הָאָרֶץ
  choice: вся земля
  rationale: 'Сочетание естественно передаёт универсальный охват в послепотопном контексте, при этом сохраняет метонимию оригинала: земля означает её население.'
theological_decisions:
- issue: Объём значения הָאָרֶץ в контексте происхождения народов после потопа
  choice: вся земля
  alternative: вся страна / вся суша
  rationale: Контекст связывает трёх сыновей Ноя с последующим распространением человечества, поэтому универсальное «вся земля» предпочтительнее локального значения.
- issue: Субъект действия при נָפְצָה
  choice: сохранена метонимия «вся земля расселилась»
  alternative: от них населилась вся земля / по земле расселились люди
  rationale: Еврейский текст грамматически называет субъектом «всю землю». Сохранение метонимии не устраняет присущую оригиналу образность и не вводит явно отсутствующее слово «люди».
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная повествовательная формулировка. Тире естественно оформляет именное предложение. «Расселилась» понятно обычному читателю и ближе к исходному образу, чем более истолковывающее «была населена».
