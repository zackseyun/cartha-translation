base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: ru
  text: 'И сказал Бог Ною: «Вот знак завета, который Я установил между Мною и всякой плотью[a] на земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всеми живыми существами». Буквально: «всякой плотью» — в данном контексте это широкое обозначение одушевлённой жизни на земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным וַ последовательно развивает рассказ; традиционная русская связка «И сказал» естественна для возвышенного библейского повествования.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте речь идёт о едином Боге, обращающемся к Ною.
- source_word: אֶל נֹחַ
  choice: Ною
  rationale: Предлог обозначает адресата; дательный падеж естественно передаёт это отношение по-русски.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Вот знак завета
  rationale: Указательное זֹאת вводит отождествление; русское «вот» ясно и естественно представляет названный знак, а «знак завета» сохраняет ключевые понятия исходного текста.
- source_word: הֲקִמֹתִי
  choice: Я установил
  rationale: Hiphil глагола קום в сочетании с «заветом» означает установить или утвердить завет; прошедшее совершенного вида передаёт завершённое действие.
- source_word: בֵּינִי וּבֵין
  choice: между Мною и
  rationale: Сохраняется обычная формула, обозначающая стороны завета.
- source_word: כָּל בָּשָׂר
  choice: всякой плотью
  rationale: Буквальный широкий оборот охватывает здесь одушевлённую земную жизнь, а не только людей; «всякая плоть» сохраняет намеренную широту и библейскую образность.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: на земле
  rationale: Краткое русское определение естественно передаёт относительное придаточное и универсальный земной охват завета.
theological_decisions:
- issue: Объём значения כָּל בָּשָׂר в завете с Ноем
  choice: всякая плоть
  alternative: все живые существа; всё человечество
  rationale: В Бытии 9 выражение шире человечества и включает живых земных существ. Буквальная формулировка сохраняет эту широту и не устраняет смысловую напряжённость образа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; традиционные термины «знак», «завет» и «всякая плоть» сохранены ради точности и межтекстовой преемственности.
