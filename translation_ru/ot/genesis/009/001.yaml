source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: ru
  text: 'И благословил Бог Ноя и его сыновей и сказал им: «Плодитесь, размножайтесь и наполняйте землю[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну», однако здесь значение «земля» лучше соответствует послепотопному контексту и перекличке с Бытие 1:28.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Порода пиэль глагола ברך здесь означает дарование благословения; традиционное русское «благословил» точно и естественно передаёт смысл.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном повествовательном контексте речь идёт о едином Боге.
- source_word: נֹחַ
  choice: Ноя
  rationale: Использована устоявшаяся русская форма библейского имени в требуемом падеже.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Еврейское слово конкретно обозначает сыновей, а не детей вообще.
- source_word: וַיֹּאמֶר לָהֶם
  choice: и сказал им
  rationale: Прямо передаёт обычную повествовательную формулу, не добавляя оттенка приказа сверх формы последующих императивов.
- source_word: פְּרוּ
  choice: Плодитесь
  rationale: Точно передаёт повелительную форму и сохраняет словесную связь с Бытие 1:28.
- source_word: וּרְבוּ
  choice: размножайтесь
  rationale: В сочетании с «плодитесь» естественно выражает численное умножение потомства и сохраняет традиционную библейскую формулу.
- source_word: וּמִלְאוּ
  choice: наполняйте
  rationale: Передаёт значение «делать полным, наполнять» без внесения идеи повторного заселения, которой сам глагол не требует.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В послепотопном контексте и в связи с Бытие 1:28 наиболее уместно глобальное значение — земля как обитаемый мир.
theological_decisions:
- issue: Связь с повелением при сотворении в Бытие 1:28
  choice: Сохранена формула «Плодитесь, размножайтесь и наполняйте землю».
  alternative: «Рождайте много детей и заселяйте землю».
  rationale: Близкая к еврейской формулировка сохраняет намеренный словесный отклик на Бытие 1:28 и показывает преемственность благословения человечества после потопа, не превращая перевод в толкование.
- issue: Объём значения הָאָרֶץ
  choice: «землю» в смысле всей земли
  alternative: «страну» или «землю» в локальном смысле
  rationale: Контекст нового начала после всемирного для повествования потопа и параллель с Бытие 1:28 поддерживают широкий смысл, хотя лексема сама по себе допускает также значение отдельной земли или страны.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и узнаваемой ритмики формулы сотворения. Союзы передают последовательность еврейского повествования без излишней архаизации.
