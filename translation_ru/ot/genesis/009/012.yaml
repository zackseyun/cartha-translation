  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: ru
  text: 'И сказал Бог: «Вот знак завета, который Я даю между Мною и вами и всяким живым существом, которое с вами, на все поколения впредь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из поколения в поколение навеки».'
    reason: לְדֹרֹת עוֹלָם допускает более буквальную передачу, подчёркивающую как последовательность поколений, так и неопределённо долгую продолжительность.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным вау продолжает последовательность событий; традиционное и естественное русское повествовательное соответствие — «И сказал».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте речь идёт о едином Боге, обращающемся к Ною.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Вот знак завета
  rationale: «Вот» естественно вводит указание и отождествление знака; אוֹת передано обычным словом «знак», а בְּרִית — устойчивым библейским термином «завет».
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: который Я даю
  rationale: Причастие נֹתֵן буквально означает «даю» и выражает совершаемое действие. Русское «даю знак завета» понятно и позволяет не заменять исходный образ более интерпретирующим «устанавливаю».
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: между Мною и вами и
  rationale: Сохранена структура, перечисляющая стороны завета; форма «Мною» соответствует норме современного литературного русского после «между».
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: всяким живым существом
  rationale: В данном контексте выражение охватывает живых созданий, включая животных. «Существо» не вносит несвойственного контексту представления о «душе».
- source_word: אֲשֶׁר אִתְּכֶם
  choice: которое с вами
  rationale: Относительное придаточное прямо определяет живых существ, находящихся с Ноем и его семьёй.
- source_word: לְדֹרֹת עוֹלָם
  choice: на все будущие поколения
  rationale: Передаёт длительность во времени и сохраняет компонент «поколения»; «будущие» в русском контексте естественно выражает направленность формулы עוֹלָם.
theological_decisions:
- issue: Значение נֹתֵן в формуле о знаке завета
  choice: который Я даю
  alternative: который Я устанавливаю
  rationale: Выбрано прямое значение «даю», поскольку объектом относительного оборота является «знак завета». Это сохраняет образ исходного текста и не превращает действие в более специальную богословскую формулу.
- issue: Объём выражения נֶפֶשׁ חַיָּה
  choice: всяким живым существом
  alternative: всякой живой душой
  rationale: Контекст включает животных, поэтому «существо» точнее обозначает широкий круг живой твари и не навязывает антропологического смысла слову נֶפֶשׁ.
- issue: Временной охват לְדֹרֹת עוֹלָם
  choice: на все будущие поколения
  alternative: на вечные поколения
  rationale: Формулировка сохраняет неограниченную преемственность поколений, избегая неестественного русского сочетания «вечные поколения» и не разрешая сверх необходимого семантическую широту עוֹלָם.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис близок к еврейскому, но остаётся естественным; местоимение Бога написано с прописной буквы согласно распространённой русской библейской издательской практике.
