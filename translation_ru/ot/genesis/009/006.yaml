  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: ru
  text: Кто прольёт кровь человека[a], кровь того будет пролита человеком[b], потому что Бог сделал человека по Своему образу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское адам здесь означает человека вообще, а не только мужчину.
    reason: lexical_alternative
  - marker: b
    text: 'Или, при ином понимании предлога: «среди людей»; однако наиболее вероятен смысл, что кровь виновного будет пролита человеком.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Кто прольёт
  rationale: Причастие употреблено как обобщённая правовая формула. В русском условно-обобщённая конструкция с будущим совершенного вида звучит естественно и сохраняет торжественную силу изречения.
- source_word: דַּם הָאָדָם
  choice: кровь человека
  rationale: «Кровь» здесь означает жизнь, отнятую насильственным кровопролитием; אָדָם употреблено родово, о человеке вообще.
- source_word: בָּאָדָם
  choice: человеком
  rationale: 'Предлог בְּ понят как обозначение действующего лица: кровь виновного будет пролита человеком. Такой перевод сохраняет повтор אָדָם и не разворачивает краткое изречение в более подробное учение о порядке суда.'
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: кровь того будет пролита
  rationale: Пассивная форма сохранена. Указательное «того» естественно связывает ответное кровопролитие с тем, кто пролил кровь, не уточняя сверх текста, кем именно будет исполнен приговор.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предыдущего постановления; современное русское выражение ясно передаёт причинную связь.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: по Своему образу
  rationale: При явном подлежащем «Бог» возвратное притяжательное местоимение естественно передаёт «по образу Бога» и сохраняет смысл без тяжёлого повтора.
- source_word: עָשָׂה אֶת הָאָדָם
  choice: создал человека
  rationale: Хотя עָשָׂה буквально означает «сделал», в данном контексте происхождения человека русское «создал» естественно и не меняет утверждения о Боге как Творце; «человека» сохраняет родовое единственное число.
theological_decisions:
- issue: Родовое значение אָדָם
  choice: человек
  alternative: люди; человечество; мужчина
  rationale: Во всех трёх употреблениях слово относится к человеку как представителю человеческого рода, а не только к мужчине. Единственное число и повтор ключевого слова сохранены настолько, насколько это естественно по-русски.
- issue: Значение בָּאָדָם в постановлении о пролитой крови
  choice: кровь того будет пролита человеком
  alternative: кровь того прольётся среди людей
  rationale: Деятельное, или инструментальное, понимание предлога лучше соответствует синтаксису и параллелизму. При этом перевод не уточняет институт, процедуру или исполнителя суда сверх сказанного в еврейском тексте.
- issue: Формулировка учения об образе Бога
  choice: Бог создал человека по Своему образу
  alternative: по образу Бога Он создал человека
  rationale: Выбран естественный русский порядок слов; богословское основание неприкосновенности человеческой жизни сохранено без дополнительного толкования природы образа Божьего.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным правовым звучанием. Повтор слова «человек» намеренно сохраняет еврейскую риторику; синтаксис слегка сглажен ради ясности. Написание «Своему» с прописной буквы указывает на Бога и устраняет возможную двусмысленность.
