  source_fidelity: 'Первый член точно передаёт юссивное благословение и дательный смысл לְיֶפֶת: «Да даст Бог простор Иафету». Образ «шатров Сима» сохранён. Вторая юссивная форма в еврейском тексте не имеет явно выраженного подлежащего; русское «он» формально допускает оба основных прочтения, но в обычном русском синтаксисе преимущественно отсылает к Богу как к названному подлежащему. Нулевое подлежащее точнее сохраняет исходную неоднозначность. לָמוֹ передаётся как множественное «их».'
