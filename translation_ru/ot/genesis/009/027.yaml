base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: ru
  text: Да даст Бог простор Иафету, и да обитает в шатрах Сима[a], и да будет Ханаан их рабом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и да обитает Бог в шатрах Сима»; возможно также: «и да обитает Иафет в шатрах Сима». В еврейском тексте подлежащее глагола «обитать» не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: да даст простор
  rationale: Юссив передаёт пожелание; выражение «дать простор» естественно по-русски передаёт идею расширения и созвучно смысловой игре с именем Иафет, хотя само звуковое созвучие на русском воспроизвести невозможно.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: При грамматически множественной форме существительного контекст и форма глагола указывают на единственное число и на единого Бога.
- source_word: לְיֶפֶת
  choice: Иафету
  rationale: Предлог ל передан дательным падежом; личное имя дано в укоренившейся русской библейской форме «Иафет».
- source_word: וְיִשְׁכֹּן
  choice: и да обитает он
  rationale: 'Юссив передан формой пожелания. Местоимение «он» сохраняет неуказанность подлежащего: им может быть Бог или Иафет.'
- source_word: בְּאָהֳלֵי שֵׁם
  choice: в шатрах Сима
  rationale: Сохранён буквальный пространственный образ шатров; имя передано в укоренившейся русской форме «Сим».
- source_word: וִיהִי
  choice: и да будет
  rationale: Форма пожелания продолжает торжественный ряд благословения и приговора.
- source_word: כְנַעַן
  choice: Ханаан
  rationale: Сохранена принятая русская форма личного имени.
- source_word: עֶבֶד
  choice: раб
  rationale: В данном приговоре существенна подчинённость Ханаана; «раб» передаёт её точнее, чем смягчённое «слуга».
- source_word: לָמוֹ
  choice: у них
  rationale: Форма местоимения имеет значение множественного числа. Русское «рабом у них» естественно выражает зависимое положение по отношению к тем, кто подразумевается во множественном числе.
theological_decisions:
- issue: Кто является подлежащим в словах «да обитает он в шатрах Сима»
  choice: В основном тексте оставлено местоимение «он», которое может относиться как к Богу, так и к Иафету.
  alternative: «И да обитает Бог в шатрах Сима»; либо «и да обитает Иафет в шатрах Сима».
  rationale: В еврейском тексте подлежащее при глаголе «обитать» прямо не названо. Обе трактовки грамматически возможны, поэтому подлинная богословски значимая неоднозначность сохранена, а варианты пояснены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной формой пожелания «да…». Образы «простор» и «шатры» сохранены; синтаксис сделан ясным для обычного читателя без устранения неоднозначности оригинала.
