  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: ru
  text: Все живые существа, которые движутся,[a] будут вам в пищу. Как зелёные растения, даю вам всё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякое живое существо, которое ползает, будет вам в пищу». Еврейское слово רֶמֶשׂ нередко обозначает существ, которые ползают или снуют, но здесь по контексту оно, вероятно, употреблено в широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ אֲשֶׁר הוּא חַי
  choice: Всё живое, что движется
  rationale: Рֶמֶשׂ часто обозначает ползающих или снующих существ, но в данном контексте имеет широкий охват. Формулировка естественна по-русски и сохраняет связь с движущимися живыми существами.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: будет вам в пищу
  rationale: Передаёт предикативную конструкцию естественно и с достоинством, сохраняя смысл Божьего дозволения и предоставления пищи.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: Как зелёные растения
  rationale: Сочетание обозначает зелёную растительность, ранее данную человеку в пищу; собирательное «зелёные растения» понятно современному читателю.
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Перфект обозначает совершившийся акт предоставления. «Отдал» хорошо сочетается с адресатом «вам» и выражает передачу в распоряжение.
- source_word: אֶת כֹּל
  choice: всё
  rationale: Сохраняет всеобъемлющую силу כֹּל и естественно завершает сопоставление с ранее данной растительной пищей.
theological_decisions:
- issue: Объём дозволения употреблять животных в пищу после потопа
  choice: Стих выражает широкое дозволение употреблять в пищу живых движущихся существ.
  alternative: Ограничить смысл только ползающими или мелкими существами на основании רֶמֶשׂ.
  rationale: Хотя רֶמֶשׂ может иметь более узкое значение, контекст и заключительное «отдал вам всё» поддерживают широкий охват. При этом сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; ясная и торжественная, но не архаичная формулировка. Заглавное «Я» отражает прямую речь Бога. Маркер сноски поставлен после всего стиха, поскольку поясняет первый оборот, не разрывая краткое высказывание.
