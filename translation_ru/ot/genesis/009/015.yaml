  source_fidelity: 'Основной смысл передан верно: будущее «вспомню», завет, его участники, окончательное обещание о водах и уничтожении «всякой плоти» сохранены. Однако «среди всякой плоти» неудачно передаёт בְּכָל־בָּשָׂר: в русском оно прежде всего обозначает пространственное нахождение, тогда как здесь уточняется всеохватная категория живых существ.'
  naturalness: «Среди всякой плоти» звучит неестественно и затемняет синтаксическую связь. Формула «со всяким живым существом — со всякой плотью» сохраняет намеренную повторность и понятнее в современном литературном русском. Остальной текст естественен и выдержан в уместном торжественном регистре.
  terminology: '«Завет», «вспомню», «потоп» и повтор «всякая плоть» уместны. Следует исправить сноску: её вариант должен соответствовать альтернативному переводу всего спорного словосочетания, а не создавать несогласованную конструкцию «и всякой живой душой из всякой плоти».'
