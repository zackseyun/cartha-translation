base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: ru
  text: И Я вспомню Мой завет, который заключён между Мною и вами и со всяким живым существом — со всякой плотью[a], и воды уже никогда не станут потопом, чтобы уничтожить всякую плоть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со всяким живым существом из всякой плоти». Буквально: «со всякой живой душой во всякой плоти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: И Я вспомню
  rationale: Форма Qal 1-го лица ед. числа с союзом в контексте Божьей речи имеет будущее значение. Глагол «вспомню» сохраняет значимый для текста язык завета и не заменяет его истолковывающей перифразой.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» точно передаёт формальные обещательные отношения, о которых говорится в отрывке.
- source_word: אֲשֶׁר בֵּינִי וּבֵינֵיכֶם וּבֵין כָּל נֶפֶשׁ חַיָּה
  choice: который заключён между Мною и вами и всяким живым существом
  rationale: Добавление «заключён» естественно для современного русского языка и раскрывает эллиптическую конструкцию, сохраняя всех участников завета. נֶפֶשׁ חַיָּה в данном контексте обозначает живое существо, а не только человека.
- source_word: בְּכָל בָּשָׂר
  choice: среди всякой плоти
  rationale: 'Предлог בְ передаётся в классифицирующем смысле: речь идёт обо всех живых существах в составе всей одушевлённой плоти. Формулировка сохраняет образность и широкий охват еврейского текста.'
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: и ... уже никогда не станут
  rationale: Сочетание отрицания с עוֹד выражает окончательное неповторение события; «уже никогда» естественно передаёт это по-русски.
- source_word: הַמַּיִם לְמַבּוּל
  choice: воды ... не станут потопом
  rationale: 'Предлог לְ у מַבּוּל передаёт результат или функцию: воды становятся потопом. Такая конструкция естественна по-русски и близка к форме исходного текста.'
- source_word: לְשַׁחֵת
  choice: чтобы уничтожить
  rationale: Инфинитив выражает цель или результат действия потопа. «Уничтожить» сохраняет весомость исходного глагола.
- source_word: כָּל בָּשָׂר
  choice: всякую плоть
  rationale: Буквально-образное выражение сохранено при повторе, поскольку оно охватывает людей и животных, а не только человечество.
theological_decisions:
- issue: Антропоморфный язык Божьего воспоминания
  choice: Сохранить «Я вспомню» без поясняющей замены
  alternative: «Я буду помнить» или «Я исполню Мой завет»
  rationale: Исходный текст прямо говорит о воспоминании. Это сохраняет язык завета и присущее ему богословское напряжение, не объясняя за текст, каким образом действует Божье воспоминание.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской религиозной издательской традиции. Выражение «всякая плоть» сохранено ради образности, повторения и широкого охвата оригинала.
