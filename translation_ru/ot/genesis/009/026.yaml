  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: ru
  text: 'И сказал: «Благословен ГОСПОДЬ, Бог Сима! Пусть Ханаан будет их рабом».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть Ханаан будет его рабом». Еврейское местоимение имеет форму множественного числа, но его точное соотнесение в данном контексте не вполне ясно.'
    reason: Сохраняет формальное множественное число לָמוֹ в основном тексте и отмечает возможное понимание формы как относящейся к единственному референту.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Сохраняет форму хвалы, обращённой к Богу, а не пожелание благословения.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона; прописное написание отличает имя Бога от обычного титула.
- source_word: עֶבֶד
  choice: раб
  rationale: Прямое соответствие исходному слову в контексте подчинения; «слуга» здесь могло бы неоправданно смягчить смысл.
- source_word: לָמוֹ
  choice: у них
  rationale: Передаёт поэтическую местоименную форму, формально множественного числа, не устраняя реальную неоднозначность её соотнесения.
theological_decisions:
- issue: К кому относится местоимение לָמוֹ
  choice: у них
  alternative: у него / ему
  rationale: Масоретский текст содержит форму множественного числа. Перевод сохраняет её, хотя в контексте возможно понимание как поэтической формы с единственным референтом.
- issue: Кто назван благословенным
  choice: ГОСПОДЬ, Бог Сима
  alternative: да благословит ГОСПОДЬ Сима
  rationale: Синтаксис исходного текста прямо называет благословенным ГОСПОДА; нельзя переносить благословение на Сима.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим оттенком. Инверсия «Благословен ГОСПОДЬ» сохранена как естественная формула хвалы; архаические формы избегаются.
