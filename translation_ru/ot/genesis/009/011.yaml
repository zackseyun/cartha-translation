  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: ru
  text: 'И Я установлю Свой завет с вами: никогда больше всякая плоть[a] не будет истреблена[b] водами потопа, и никогда больше не будет потопа, который погубит землю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «всякая плоть» здесь охватывает живых существ в целом, а не только людей.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не будет отсечена»; по смыслу — не будет уничтожена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: И Я установлю
  rationale: Глагол קום в породе hифиль в сочетании с «заветом» означает установить или утвердить его. Будущее время соответствует обещанию в непосредственном контексте; «установлю» сохраняет торжественный язык завета, не уточняя сверх текста, учреждается ли завет впервые или подтверждается.
- source_word: בְּרִיתִי
  choice: Свой завет
  rationale: «Завет» — устойчивый и содержательно точный русский эквивалент בְּרִית. Возвратное местоимение «Свой» естественно передаёт принадлежность завета говорящему Богу.
- source_word: אִתְּכֶם
  choice: с вами
  rationale: Передаёт множественное число адресатов без ненужного пояснительного расширения.
- source_word: יִכָּרֵת
  choice: не будет истреблена
  rationale: Nифаль от כרת буквально означает «быть отсечённым», но в данном контексте обозначает гибель. «Будет истреблена» ясно и естественно выражает смысл, а буквальный образ сохранён в сноске.
- source_word: כָּל־בָּשָׂר
  choice: всякая плоть
  rationale: Формулировка близка к еврейской и сохраняет широкий охват людей и животных, не сужая его до одного человечества.
- source_word: עוֹד
  choice: никогда больше
  rationale: При повторяющемся отрицании слово приобретает значение категорического обещания «никогда больше», а не просто «ещё» или «снова».
- source_word: מִמֵּי הַמַּבּוּל
  choice: водами потопа
  rationale: Предлог מן здесь естественно понимается как указание на средство или причину гибели. Русский творительный падеж ясно передаёт это отношение.
- source_word: מַבּוּל
  choice: потоп
  rationale: Стандартный русский эквивалент מַבּוּל в повествовании о Ное.
- source_word: לְשַׁחֵת
  choice: который погубит
  rationale: Инфинитив цели передан естественным русским придаточным предложением. «Погубит» выражает разрушительное действие שׁחת и избегает стилистически тяжёлого повтора «истребить/уничтожить».
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте потопа слово обозначает землю в широком смысле; перевод не сужает его до отдельной страны или территории.
theological_decisions:
- issue: Охват выражения כָּל־בָּשָׂר
  choice: Сохранено широкое выражение «всякая плоть».
  alternative: «все люди» или пояснительное «все живые существа»
  rationale: Контекст после потопа включает и людей, и животных. «Всякая плоть» сохраняет широту исходного выражения и не вводит более узкого богословского прочтения.
- issue: Значение קום в формуле завета
  choice: «установлю Свой завет»
  alternative: «подтвержу Свой завет» или «сохраню Свой завет»
  rationale: «Установлю» сохраняет формальный язык завета и не снимает возможного смыслового напряжения между учреждением и подтверждением завета.
- issue: Масштаб הָאָרֶץ
  choice: «землю»
  alternative: «страну» или «сушу»
  rationale: Универсальный охват обещания и упоминание «всякой плоти» поддерживают широкое значение, но перевод не добавляет отдельного догматического определения географического масштаба потопа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «никогда больше» сохранён ради риторической силы исходного обещания; синтаксис сделан естественным для современного читателя.
