lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: Форма היה с последовательным вавом здесь служит простой связкой в прошедшем времени; перевод «стали» необоснованно вводил бы значение изменения состояния.
- source_word: בְנֵי נֹחַ
  choice: сыновья Ноя
  rationale: Конструктивное сочетание естественно и точно передаётся родительным оборотом.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: вышедшие из ковчега
  rationale: Определённое причастие употреблено атрибутивно и обозначает сыновей Ноя как тех, кто покинул ковчег; русское причастие сохраняет структуру и остаётся естественным.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: Сим, Хам и Иафет
  rationale: Использованы устоявшиеся русские формы библейских имён.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: Хам был отцом Ханаана
  rationale: Именное предложение сообщает фоновое генеалогическое уточнение; личное местоимение усиливает идентификацию Хама, но в русском отдельное «он» было бы стилистически тяжеловесным.
theological_decisions:
- issue: Генеалогическое замечание о Хаме и Ханаане
  choice: Сохранить прямое утверждение «Хам был отцом Ханаана» как отдельное повествовательное уточнение.
  alternative: Стилистически ослабить или оформить его как малозначительное примечание.
  rationale: Еврейский текст явно указывает родство Хама с Ханааном, подготавливая дальнейший рассказ. Перевод не добавляет позднейших богословских или этнических выводов.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и сдержанно торжественная. Второе предложение сохраняет повествовательный акцент исходного текста без ненужной перегрузки союзом «и».
