base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: ru
  text: Все земные животные, все птицы небесные, всё, что движется по земле, и все рыбы морские будут испытывать перед вами страх и ужас. Они отданы в ваши руки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отданы в вашу руку» — древнееврейский оборот, означающий передачу под власть или контроль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: страх и ужас перед вами
  rationale: Оба существительных обозначают внушаемые человеком страх и ужас. Оборот «перед вами» естественно передаёт объект страха по-русски и сохраняет усиление за счёт пары близких слов.
- source_word: חַיַּת הָאָרֶץ
  choice: всех земных животных
  rationale: В данном перечислении חַיָּה обозначает наземных животных; «земных» сохраняет связь с הָאָרֶץ, не ограничивая выражение только дикими зверями.
- source_word: עוֹף הַשָּׁמָיִם
  choice: всех небесных птицах
  rationale: «Небесные птицы» прямо отражает שָׁמַיִם и остаётся понятным в возвышенном современном русском регистре.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: на всём, что движется по земле
  rationale: רמשׂ может обозначать ползание или вообще движение малых наземных существ. Нейтральное «движется» сохраняет объём собирательного выражения, а «по земле» естественно передаёт связь с אֲדָמָה.
- source_word: דְּגֵי הַיָּם
  choice: всех морских рыбах
  rationale: Естественная русская передача конструктивного сочетания со всеохватным כָּל.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: они отданы в ваши руки
  rationale: Сохранена древнееврейская метафора передачи во власть, пассивный залог и результативное значение перфекта.
theological_decisions:
- issue: Власть людей над животными после потопа
  choice: Сохранена метафора «отданы в ваши руки», выражающая реальную передачу под власть людей.
  alternative: Разъясняющий перевод «отданы под вашу власть» либо ослабленная формулировка без значения власти.
  rationale: Буквенный образ понятен по-русски и не расширяет утверждение стиха до более общей богословской или этической доктрины.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «будет» и «отданы» сохраняют декларативный тон, а синтаксис упрощён без устранения образности оригинала.
