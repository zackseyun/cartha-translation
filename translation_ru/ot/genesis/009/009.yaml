base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: ru
  text: А Я — вот, устанавливаю Свой завет с вами и с вашим потомством, которое будет после вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семя». Древнееврейское слово имеет собирательное значение и может обозначать потомство или потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Я же
  rationale: Самостоятельное местоимение при союзе имеет лёгкое смысловое ударение; частица «же» естественно передаёт переход к словам Бога и подчёркивает субъект.
- source_word: הִנְנִי
  choice: вот, я
  rationale: Конструкция привлекает торжественное внимание к совершаемому Богом действию. «Вот, я» сохраняет акцент, не превращая выражение в представление говорящего («вот я»).
- source_word: מֵקִים
  choice: устанавливаю
  rationale: Причастная форма породы hифиль от קום обозначает установление завета. Настоящее время передаёт совершаемое здесь торжественное действие, а «устанавливаю» не предполагает непременно подтверждения уже существующего завета.
- source_word: בְּרִיתִי
  choice: мой завет
  rationale: «Завет» — устоявшееся и точное обозначение בְּרִית в контексте отношений Бога с людьми; «мой» прямо сохраняет местоименный суффикс первого лица.
- source_word: אִתְּכֶם
  choice: с вами
  rationale: Предлог прямо указывает на участников завета и естественно передаётся сочетанием «с вами».
- source_word: וְאֶת זַרְעֲכֶם
  choice: и с вашим потомством
  rationale: זֶרַע — собирательное существительное, обозначающее семя, потомство или потомков. «Потомство» сохраняет собирательность и звучит естественно в современном русском; предлог «с» повторён для ясности параллельной конструкции.
- source_word: אַחֲרֵיכֶם
  choice: после вас
  rationale: Кратко и точно обозначает последующие поколения, не добавляя отсутствующего в тексте придаточного предложения.
theological_decisions:
- issue: Передача терминологии завета в отношениях Бога с людьми
  choice: мой завет
  alternative: мой договор; мой союз
  rationale: «Завет» сохраняет ключевую библейскую категорию и торжественный характер отношений, не добавляя к древнееврейскому тексту конфессионального толкования.
- issue: Значение הֵקִים применительно к завету
  choice: устанавливаю
  alternative: подтверждаю; заключаю
  rationale: «Устанавливаю» сохраняет значение причинной породы קום и не решает заранее, учреждается ли завет впервые или подтверждается; «заключаю» было бы естественно, но сильнее сближало бы выражение с иной древнееврейской формулой כרת ברית.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Тире и оборот «вот, я» сохраняют двойной акцент וַאֲנִי הִנְנִי. Местоимения, относящиеся к Богу, не получают добавочной прописной буквы, отсутствующей как смысловое различие в исходном тексте.
