  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: ru
  text: А вы плодитесь и размножайтесь; распространяйтесь по земле и умножайтесь на ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: А вы
  rationale: Союз с самостоятельным местоимением подчёркивает обращение и возобновляет речь после предыдущего стиха; «А вы» естественно передаёт этот акцент по-русски.
- source_word: פְּרוּ
  choice: плодитесь
  rationale: Обычное библейское соответствие глаголу פרה в сочетании с רבה; сохраняет образ плодородия и связь с благословением о продолжении рода.
- source_word: וּרְבוּ
  choice: и размножайтесь / и умножайтесь
  rationale: 'Повтор глагола רבה сохранён, но передан двумя близкими русскими глаголами ради естественности: сначала в устойчивой паре «плодитесь и размножайтесь», затем как «умножайтесь».'
- source_word: שִׁרְצוּ
  choice: распространяйтесь
  rationale: Глагол обозначает обильное, многочисленное распространение живых существ. «Распространяйтесь» сохраняет идею стремительного заселения, не создавая в современном русском неуместной ассоциации слова «роиться» применительно к людям.
- source_word: בָאָרֶץ
  choice: по земле
  rationale: Здесь אֶרֶץ — земля как пространство расселения человечества после потопа; сочетание «распространяйтесь по земле» естественно передаёт сферу и широту распространения.
- source_word: וּרְבוּ בָהּ
  choice: и умножайтесь на ней
  rationale: Местоименный суффикс отсылает к земле; «на ней» идиоматично по-русски и сохраняет повтор повеления רבה.
theological_decisions:
- issue: Связь с повелением при сотворении и благословением после потопа
  choice: Передать слова как возобновлённое Божье повеление-благословение Ною и его сыновьям без поясняющих богословских добавлений.
  alternative: Представить стих лишь как повтор Бытия 1:28 либо расширить его специальной заветной терминологией.
  rationale: Еврейский текст использует повелительные формы, созвучные Быт. 1:28, однако перевод должен сохранять эту связь, не разрешая её посредством внесённых в текст толкований.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Устойчивая формула «плодитесь и размножайтесь» сохранена; более резкое образное значение שׁרץ передано естественным для обращения к людям глаголом «распространяйтесь».
