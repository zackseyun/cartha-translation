base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: ru
  text: Я поместил свой лук в облаке[a], и он будет знаком завета между Мной и землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою радугу». В еврейском тексте буквально сказано «свой лук»: употреблено обычное слово, обозначающее лук как оружие; здесь, в сочетании с облаком, имеется в виду радуга.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: свой лук
  rationale: קֶשֶׁת — обычное слово для лука как оружия; сочетание «в облаке» указывает здесь на радугу. В основном тексте сохранён исходный образ лука, а контекстуальное значение пояснено в сноске.
- source_word: נָתַתִּי
  choice: Я поместил
  rationale: נתן может означать «дать», «положить», «поместить». В данном контексте «поместил» естественно передаёт установление лука в облаке и завершённое действие с сохраняющимся результатом.
- source_word: בֶּעָנָן
  choice: в облаке
  rationale: В еврейском тексте существительное стоит в единственном числе; русское единственное число также естественно обозначает облако как место появления радуги.
- source_word: וְהָיְתָה
  choice: и он будет
  rationale: 'Форма в контексте выражает последующее назначение: помещённый в облаке лук будет служить знаком. Мужской род местоимения обусловлен русским словом «лук».'
- source_word: לְאוֹת בְּרִית
  choice: знаком завета
  rationale: אוֹת означает «знак», а בְּרִית — «завет». Творительный падеж естественно передаёт функцию знака; определённость завета ясна из ближайшего контекста.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: между Мной и землёй
  rationale: אֶרֶץ может означать «земля» или «страна»; всеобщий масштаб повествования о потопе требует значения «земля».
theological_decisions:
- issue: Значение קַשְׁתִּי в контексте завета
  choice: В основном тексте сохранено буквальное «свой лук», контекстуально обозначающее радугу.
  alternative: «Моя радуга»
  rationale: Еврейский текст употребляет обычное слово «лук», поэтому основной перевод сохраняет образ, потенциально связанный с оружием, не устраняя его богословскую выразительность. Сноска сообщает читателю непосредственный природный референт.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным синтаксисом. Возвратное притяжательное местоимение «свой» выбрано как наиболее естественное при подлежащем «Я». Местоимение «Мной» написано с прописной буквы как уважительное обозначение Бога; архаичные формы и конфессионально маркированная лексика не используются.
