base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: ru
  text: Тогда Сим и Иафет взяли одежду[a], положили её на плечи обоим, пошли спиной вперёд и прикрыли наготу своего отца. Лица их были обращены назад, и наготы своего отца они не видели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верхнюю одежду»; еврейское слово обозначает предмет одежды, которым здесь прикрыли Ноя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взяли
  rationale: Единственное число сказуемого при двух подлежащих — обычное для библейского еврейского повествования; по-русски естественно согласование во множественном числе.
- source_word: שֵׁם וָיֶפֶת
  choice: Сим и Иафет
  rationale: Использованы традиционные и общепринятые русские формы библейских имён.
- source_word: הַשִּׂמְלָה
  choice: одежду
  rationale: שִׂמְלָה обозначает предмет верхней одежды; общее слово «одежда» не уточняет фасон сверх исходного текста. Возможный более конкретный вариант указан в сноске.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: положили её себе на плечи
  rationale: Еврейская конструкция буквально говорит о плече обоих; русский множественный оборот ясно передаёт, что они вместе несли одежду на плечах.
- source_word: אֲחֹרַנִּית
  choice: спиной вперёд / обращены назад
  rationale: В первом случае естественный русский оборот передаёт движение назад, во втором — направление лиц; смысловой повтор сохранён без неуклюжего буквального дублирования.
- source_word: וַיְכַסּוּ
  choice: прикрыли
  rationale: Глагол כסה означает покрывать или закрывать; «прикрыли» естественно описывает действие с одеждой и сохраняет деликатность сцены.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: наготу своего отца
  rationale: Формально и естественно передаёт конструкцию, сохраняя мотив телесной обнажённости и связанный с ним оттенок стыда.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: Лица их были обращены назад
  rationale: В еврейском это безглагольная конструкция; связка и причастная форма добавлены ради нормального русского синтаксиса.
- source_word: לֹא רָאוּ
  choice: не видели
  rationale: Прямое значение глагола ראה сохраняется без добавления значения намеренного разглядывания.
theological_decisions:
- issue: Значение выражения «нагота своего отца»
  choice: Сохранено буквальное обозначение обнажённого тела Ноя, которое сыновья почтительно прикрывают.
  alternative: Понимать выражение как сексуальный эвфемизм по аналогии с отдельными местами в Левите.
  rationale: Непосредственный контекст описывает одежду, движение спиной вперёд, прикрытие и отказ видеть отца. Перевод сохраняет буквальную формулировку и не навязывает более узкого сексуального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегнуты как архаизмы («вспять», «срамота»), так и разговорные формулировки. Повтор «наготу своего отца» сохранён вслед за еврейским текстом.
