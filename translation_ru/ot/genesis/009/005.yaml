  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: ru
  text: И всё же за вашу кровь — за ваши жизни — Я непременно взыщу[a]. От руки каждого животного взыщу её[b], и от руки человека — от руки каждого, брата его, — взыщу жизнь человека[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вашу кровь за ваши жизни». Возможен перевод: «вашу кровь, за ваши жизни».'
    reason: Сочетание דִּמְכֶם לְנַפְשֹׁתֵיכֶם буквально связывает кровь с жизнями адресатов; точная синтаксическая связь передаётся по-разному.
  - marker: b
    text: 'Или: «потребую за неё отчёта».'
    reason: Глагол דרשׁ в этом контексте имеет судебный смысл требования ответа за пролитую кровь.
  - marker: c
    text: 'Буквально: «от руки человека, от руки человека — брата его».'
    reason: Примечание сохраняет повторяющуюся еврейскую идиому «от руки» и сжатую, синтаксически неоднозначную конструкцию אִישׁ אָחִיו.
lexical_decisions:
- source_word: וְאַךְ
  choice: И … непременно
  rationale: 'Союз וְ сохраняет связь с предыдущим, а אַךְ передаёт усиленное заверение: Бог непременно потребует ответа.'
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: вашу кровь, за вашу жизнь
  rationale: Раздельно переданы «кровь» и «жизнь», чтобы сохранить образ и синтаксическую неоднозначность еврейского выражения; единственное «жизнь» естественно по-русски обозначает жизнь каждого из адресатов.
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: взыщу / взыщу за неё
  rationale: В данном судебном контексте דרשׁ означает потребовать ответа или возмездия. «Взыщу» кратко передаёт юридическую и торжественную окраску.
- source_word: מִיַּד
  choice: с
  rationale: Еврейская идиома буквально означает «из руки», но здесь указывает на того, с кого требуется ответ. Русское «с» естественно сохраняет значение ответственности, тогда как буквальное «из руки» было бы неясно.
- source_word: כָּל חַיָּה
  choice: каждого животного
  rationale: חַיָּה в противопоставлении человеку обозначает животное. Нейтральное «животное» в современном русском точнее и естественнее, чем стилистически маркированное «зверь».
- source_word: אִישׁ אָחִיו
  choice: с каждого за жизнь его брата
  rationale: Буквальное сочетание «человек, брат его» имеет распределительный смысл и подчёркивает ответственность человека за другого человека; слово «брат» сохранено, не заменено толкованием «ближний».
- source_word: נֶפֶשׁ הָאָדָם
  choice: жизнь человека
  rationale: נֶפֶשׁ здесь означает жизнь, связанную с кровью, а не отдельно мыслимую нематериальную душу.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте пролития крови
  choice: жизнь
  alternative: душа
  rationale: Контекст связывает кровь с отнятием жизни и с ответом за это. «Душа» могла бы привнести не выраженное здесь противопоставление души и тела.
- issue: Характер Божьего требования, выраженного דרשׁ
  choice: взыщу
  alternative: потребую отчёта
  rationale: «Взыщу» сохраняет судебный смысл и возможность как требования ответа, так и воздаяния, не сводя глагол только к формальному отчёту.
- issue: Связь выражения אִישׁ אָחִיו с מִיַּד הָאָדָם
  choice: 'уточнение внутри одной фразы: «с человека — с каждого за жизнь его брата»'
  alternative: две самостоятельные фразы
  rationale: 'Так сохраняется наиболее вероятная синтаксическая связь: второе выражение конкретизирует человеческую ответственность, не превращаясь в отдельное высказывание.'
translation_notes:
  register: Современный литературный русский с торжественной, но понятной судебной лексикой. Повтор «взыщу» и слово «брат» сохранены ради структуры и образности оригинала; буквальная идиома «с руки» вынесена в примечание.
