  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: ru
  text: Ной, земледелец, начал сажать виноградник[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ной, земледелец, первым посадил виноградник». Еврейская фраза сжата; слово, переведённое как «начал», некоторые понимают в смысле «был первым».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: начал
  rationale: Глагол от חלל в породе хифиль здесь естественнее всего означает начало действия; по смыслу он связан со следующим глаголом וַיִּטַּע.
- source_word: נֹחַ
  choice: Ной
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: אִישׁ הָאֲדָמָה
  choice: земледелец
  rationale: Буквально «человек земли/почвы». Русское «земледелец» естественно передаёт сельскохозяйственный смысл выражения, не смешивая אֲדָמָה с именем אדם.
- source_word: וַיִּטַּע
  choice: сажать
  rationale: Обычное значение נטע — «сажать, насаждать»; несовершенный вид по-русски естественно зависит от глагола «начал».
- source_word: כָּרֶם
  choice: виноградник
  rationale: Точное и общеупотребительное обозначение участка, засаженного виноградной лозой.
theological_decisions:
- issue: Как понимать сжатую последовательность וַיָּחֶל ... וַיִּטַּע
  choice: «начал сажать виноградник»
  alternative: «первым посадил виноградник»
  rationale: Основной вариант передаёт обычное значение וַיָּחֶל — «начал» — и связывает его со следующим глаголом, не добавляя прямо не выраженного утверждения о первенстве. Возможное понимание как «первым» сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык. «Земледелец» выбран вместо буквального, но неестественного по-русски выражения «человек земли»; синтаксическая неоднозначность исходного текста сохранена в сноске.
