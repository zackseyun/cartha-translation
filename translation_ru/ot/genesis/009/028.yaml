- source_word: הַמַּבּוּל
  choice: потопа
  rationale: Определённое существительное отсылает к уже описанному потопу; «потоп» — ясное и устойчивое русское соответствие.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: триста пятьдесят лет
  rationale: Еврейская составная числительная конструкция естественно передаётся единым русским числительным; форма «лет» соответствует русскому управлению.
