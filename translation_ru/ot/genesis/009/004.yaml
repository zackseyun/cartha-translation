  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: ru
  text: Но не ешьте мяса с его жизнью — его кровью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Только мяса с его жизнью — его кровью не ешьте».'
    reason: 'Лексико-синтаксическая альтернатива: אַךְ может передаваться как «только»; порядок слов ближе к еврейскому тексту.'
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Союз вводит ограничение к данному в предыдущем стихе разрешению употреблять животных в пищу; «но» естественно передаёт этот контраст.
- source_word: בָּשָׂר
  choice: мясо
  rationale: В контексте употребления животных в пищу современное русское «мясо» звучит естественнее, чем «плоть», при сохранении конкретного значения слова.
- source_word: בְּנַפְשׁוֹ
  choice: с его жизнью
  rationale: נֶפֶשׁ здесь обозначает жизнь живого существа, а не «душу» как отдельную нематериальную сущность; предлог בְּ передан как сопутствие.
- source_word: דָמוֹ
  choice: его кровью
  rationale: Прямое значение דָם — «кровь»; повтор местоимения сохраняет связь обоих определений с мясом животного.
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: с его жизнью — его кровью
  rationale: Тире сохраняет краткое бессоюзное приложение еврейского текста, где кровь поясняет или отождествляется с жизнью, не добавляя явного толковательного союза.
- source_word: לֹא תֹאכֵלוּ
  choice: не ешьте
  rationale: Отрицательная форма глагола во множественном числе выражает запрет; русский императив естественен и сохраняет законодательную силу.
theological_decisions:
- issue: Значение נֶפֶשׁ в связи с кровью
  choice: «жизнь», а не «душа»
  alternative: «душа»
  rationale: В данном контексте речь идёт об одушевляющей жизни существа, связанной с кровью; перевод «душа» мог бы привнести более позднюю антропологическую категорию.
- issue: Отношение слов «жизнь» и «кровь»
  choice: Сохранено краткое приложение через тире
  alternative: Эксплицировать как «то есть его кровью»
  rationale: Еврейский текст ставит существительные рядом без пояснительного союза. Тире передаёт их тесную связь, сохраняя некоторую синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным запретительным тоном. «Мясо» выбрано вместо более архаичного «плоть» ввиду пищевого контекста; приложение через тире отражает сжатость оригинала.
