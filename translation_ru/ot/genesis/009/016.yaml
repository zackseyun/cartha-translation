revisions:
- from: Радуга[a] будет в облаке, и Я увижу её, чтобы вспомнить вечный завет между Богом и всяким живым существом во всякой плоти, которая на земле.
  to: Радуга[a] будет в облаке, и Я увижу её, чтобы вспомнить вечный завет между Богом и всяким живым существом — всякой плотью, что есть на земле.
  rationale: Заменена синтаксически тяжёлая конструкция «всяким живым существом во всякой плоти, которая на земле» на пояснительную аппозицию «всяким живым существом — всякой плотью, что есть на земле». Это ясно передаёт широкий охват еврейского выражения, не сводя его только к животным и не создавая ложной грамматической связи. Сноска сохранена; её якорь корректно стоит после «Радуга».
