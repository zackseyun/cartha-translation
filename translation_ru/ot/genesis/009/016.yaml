  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: ru
  text: Радуга[a] будет в облаке, и Я увижу её, чтобы вспомнить вечный завет между Богом и всяким живым существом — всякой плотью, что есть на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лук». Здесь имеется в виду радуга.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: будет
  rationale: Перфект с союзом продолжает обращённую в будущее речь Бога; русское будущее время прямо передаёт эту функцию.
- source_word: הַקֶּשֶׁת
  choice: радуга[a]
  rationale: Слово буквально означает «лук», но в данном контексте обозначает небесную радугу. Основной текст должен быть сразу понятен современному читателю, а исходный образ сохранён в сноске.
- source_word: בֶּעָנָן
  choice: в облаке
  rationale: Сохранены единственное число и определённость еврейского выражения.
- source_word: וּרְאִיתִיהָ לִזְכֹּר
  choice: и Я увижу её, чтобы вспомнить
  rationale: Местоименный суффикс относится к радуге, а инфинитив с ל передаёт цель или результат. Формулировка сохраняет явную связь между видением и воспоминанием.
- source_word: בְּרִית עוֹלָם
  choice: вечный завет
  rationale: עוֹלָם указывает на непреходящую, продолжающуюся во времени силу завета; «вечный завет» — ясное и устойчивое русское выражение.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: всяким живым существом
  rationale: נֶפֶשׁ здесь обозначает живое существо, а не отдельно понимаемую «душу»; выбранный вариант естественен по-русски и охватывает животную жизнь.
- source_word: בְּכָל בָּשָׂר
  choice: во всякой плоти
  rationale: Сохранена необычная уточняющая формула оригинала и библейское собирательное значение «плоти» как телесной живой природы.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: которая на земле
  rationale: Относительное предложение отнесено к ближайшему существительному «плоть», как допускает грамматика еврейского текста; «на земле» передаёт универсальный земной охват.
theological_decisions:
- issue: Антропоморфное описание Божьего воспоминания
  choice: сохранить «Я увижу её, чтобы вспомнить»
  alternative: пояснить как «Я увижу её и поступлю согласно Моему завету»
  rationale: Оригинал прямо говорит о Божьем воспоминании. Перевод не устраняет это богословское напряжение поясняющим пересказом.
- issue: Объём выражения «всякая плоть»
  choice: сохранить широкую формулу «во всякой плоти»
  alternative: свести выражение к «всем животным»
  rationale: Контекст завета охватывает всю земную живую плоть; более узкая формулировка неоправданно ограничила бы исходный текст.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Заглавные «Я» и «Бог» сохраняют ясность говорящего и референта. Необычное сочетание «во всякой плоти» оставлено ради точности и сохранения образности оригинала.
