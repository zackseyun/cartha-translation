    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное повествовательное значение глагола ראה — «увидеть»; более сильные варианты вроде «разглядывал» не выражены самим глаголом.
- source_word: חָם
  choice: Хам
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: אֲבִי כְנַעַן
  choice: отец Ханаана
  rationale: Сопряжённая конструкция прямо называет Хама отцом Ханаана; приложение естественно сохраняется по-русски.
- source_word: עֶרְוַת אָבִיו
  choice: наготу своего отца
  rationale: Формально близкий перевод сохраняет еврейское выражение и не вводит в основной текст более конкретного сексуального истолкования.
- source_word: וַיַּגֵּד
  choice: рассказал об этом
  rationale: Глагол נגד в породе hифиль означает «сообщить, рассказать». Добавление «об этом» делает русскую фразу естественной и ясно отсылает к увиденному.
- source_word: לִשְׁנֵי אֶחָיו
  choice: двум своим братьям
  rationale: Сохранено явно указанное в еврейском тексте число «два» и естественная русская притяжательная конструкция.
- source_word: בַּחוּץ
  choice: которые были снаружи
  rationale: Передаёт местное значение «снаружи, вне» и естественно связывает его с братьями, не добавляя не названного в тексте движения Хама наружу.
theological_decisions:
- issue: Значение выражения «нагота своего отца» в этом повествовании
  choice: В основном тексте сохранено буквальное выражение без указания на какой-либо сексуальный поступок помимо того, что Хам увидел обнажённого отца.
  alternative: Понимать выражение как эвфемизм более тяжкого сексуального проступка либо, с учётом позднейшего правового словоупотребления, как намёк на связь с матерью.
  rationale: В других ветхозаветных контекстах выражение может иметь сексуально-эвфемистический смысл, однако данный стих говорит, что Хам «увидел», а затем рассказал братьям, и ближайший контекст описывает обнажённого Ноя. Буквальная формулировка и примечание сохраняют интерпретационную напряжённость.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль краткий и dignified. Формулировка понятна широкому читателю, сохраняет структуру исходного текста и не навязывает спорного толкования.
