  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: ru
  text: 'И сказал Бог Ною и его сыновьям, бывшим с ним:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; традиционная и естественная для русского библейского рассказа конструкция «И сказал» сохраняет связность с предыдущим контекстом.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте существительное обозначает единого Бога, обращающегося к Ною.
- source_word: אֶל נֹחַ
  choice: Ною
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного еврейским предлогом אֶל.
- source_word: וְאֶל בָּנָיו
  choice: и его сыновьям
  rationale: Сохранены сочинительная связь, притяжательное значение суффикса и конкретное обозначение сыновей мужского пола.
- source_word: אִתּוֹ
  choice: бывшим с ним
  rationale: Причастный оборот ясно относит выражение «с ним» к сыновьям Ноя и естественно звучит по-русски.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит последующую прямую речь. В современном русском эту функцию естественно и точно выполняет двоеточие; буквальное «говоря» здесь было бы тяжеловесным.
