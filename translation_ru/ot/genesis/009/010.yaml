base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: ru
  text: 'и со всяким живым существом, которое с вами: с птицами, со скотом и со всеми дикими животными земли, которые с вами, — со всеми животными, вышедшими из ковчега, со всеми животными земли.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза в еврейском тексте трудна. Более буквально: «из всех вышедших из ковчега — для всех животных земли».'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: живое существо
  rationale: В данном контексте сочетание обозначает одушевлённое живое существо, прежде всего животное; этот вариант естественен по-русски и не привносит узкого значения слова «душа».
- source_word: בָּעוֹף
  choice: с птицами
  rationale: עוֹף может охватывать летающих существ вообще, однако в перечне животных «птицы» — наиболее естественный современный эквивалент.
- source_word: בַּבְּהֵמָה
  choice: со скотом
  rationale: בְּהֵמָה здесь обозначает домашних наземных животных; «скот» сохраняет отличие этой группы от диких животных.
- source_word: חַיַּת הָאָרֶץ
  choice: дикие животные / животные земли
  rationale: В первом употреблении «дикие животные» ясно противопоставлены скоту; в трудной заключительной фразе более буквальное «животные земли» сохраняет повтор и не сужает возможный смысл.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: со всеми вышедшими из ковчега
  rationale: Причастная конструкция относится к животным, вышедшим из ковчега. Повтор предлога «со» связывает фразу с продолжающимся перечислением участников завета.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: со всеми животными земли
  rationale: Заключение синтаксически затруднительно. В основном тексте оно передано как возобновляющее перечисление, а более формальная передача предлога לְ отмечена в сноске.
theological_decisions:
- issue: Круг животных — участников завета и синтаксис заключительной фразы
  choice: Текст охватывает всякое животное, находившееся с Ноем, и перечисляет птиц, скот и диких животных; заключительная фраза понята как возобновление и обобщение.
  alternative: 'Более формально конец можно передать: «из всех вышедших из ковчега — для всех животных земли».'
  rationale: Еврейский текст сжат и повторен, а функция לְ в конце не вполне ясна. Основной вариант даёт связный русский текст, тогда как сноска сохраняет реальную синтаксическую неоднозначность без догматического вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «со всеми» сохранён ради структуры еврейского перечисления; архаическое «зверьё» и двусмысленное «душа живая» не используются.
