base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: ru
  text: Он выпил вина[a], опьянел и обнажился[b] внутри своего шатра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из вина»; по смыслу, вероятно, речь идёт о некотором количестве вина.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «лежал обнажённым» или «оказался обнажённым». Еврейскую форму здесь естественно понимать возвратно: «обнажился».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Он выпил
  rationale: Форма Qal wayyiqtol от שׁתה передаёт последовательное завершённое действие в повествовании. Союз וַ естественно отражён последовательностью однородных сказуемых, без отдельного начального «и».
- source_word: מִן הַיַּיִן
  choice: вина
  rationale: 'Предлог מִן при определённом существительном имеет здесь партитивное значение: Ной выпил некоторое количество вина. Русский родительный партитивный «выпил вина» передаёт это естественно и кратко.'
- source_word: וַיִּשְׁכָּר
  choice: опьянел
  rationale: Qal от שׁכר обозначает наступление состояния опьянения. «Опьянел» сохраняет ингрессивный смысл и соответствует современному литературному регистру.
- source_word: וַיִּתְגַּל
  choice: обнажился
  rationale: 'Hitpael от גלה естественно допускает возвратное понимание: Ной оказался с открытым телом или обнажил себя. «Обнажился» передаёт возвратную форму, а примечание сохраняет возможное более стативное прочтение.'
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: внутри своего шатра
  rationale: בְּתוֹךְ указывает на нахождение внутри пространства, а суффикс — на принадлежность шатра Ною. «Внутри своего шатра» ясно и естественно передаёт оба элемента.
theological_decisions:
- issue: Нравственная и богословская оценка опьянения и обнажения Ноя
  choice: Передать действия описательно, не добавляя нравственной оценки и не уточняя характер обнажения сверх еврейского текста.
  alternative: «Он лежал нагим в своём шатре» или «он оказался обнажённым в своём шатре».
  rationale: Стих сообщает о питье, опьянении и обнажении Ноя, но сам по себе не формулирует нравственного суждения и не придаёт событию более узкого сексуального смысла. Возвратный перевод с примечанием сохраняет повествовательную и богословскую напряжённость для последующего контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Шатёр» сохраняет достоинство повествования, а глаголы «выпил», «опьянел», «обнажился» ясны обычному читателю. Все примечания отмечены в основном тексте.
