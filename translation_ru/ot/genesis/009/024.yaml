base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: ru
  text: Когда Ной пробудился после вина, он узнал, что сделал с ним его самый младший сын[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его младший сын». Еврейское прилагательное может означать «маленький», «младший» или «самый младший» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: пробудился
  rationale: Глагол יקץ означает пробуждение ото сна. Такой перевод передаёт прямое значение, не заменяя его толкованием «протрезвел».
- source_word: מִיֵּינוֹ
  choice: после вина
  rationale: Буквально выражение означает «от своего вина», то есть пробуждение после вызванного вином состояния. «После вина» естественно звучит по-русски и сохраняет связь пробуждения с вином, не вводя слова «опьянение» или «похмелье».
- source_word: וַיֵּדַע
  choice: узнал
  rationale: ידע обычно означает «знать», а в данном повествовательном контексте — прийти к знанию, узнать о ранее совершённом поступке. Русское «узнал» естественно передаёт эту последовательность.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: что сделал с ним
  rationale: Формулировка сохраняет неопределённость еврейского текста относительно характера совершённого действия и не добавляет его истолкования.
- source_word: בְּנוֹ הַקָּטָן
  choice: его самый младший сын
  rationale: В семейном контексте קָטָן может обозначать самого младшего по возрасту. Добавление «самый» ясно выражает выбранное основное прочтение, тогда как возможное сравнительное значение отмечено в сноске.
theological_decisions:
- issue: Характер поступка, совершённого по отношению к Ною
  choice: Оставить общее выражение «что сделал с ним», не уточняя поступок.
  alternative: Истолковать это как то, что Хам увидел наготу Ноя и рассказал о ней, либо как указание на более тяжёлое сексуальное посягательство.
  rationale: Сам стих не определяет характера действия. Конкретизация устранила бы намеренную или сохраняемую текстом неоднозначность.
- issue: Кого называет выражение «его самый младший сын»
  choice: Передать בְּנוֹ הַקָּטָן как «его самый младший сын», не называя его по имени.
  alternative: Перевести как «его младший сын» в сравнительном значении.
  rationale: Перевод сохраняет родственное обозначение исходного текста и не разрешает возникающий в более широком контексте вопрос о том, имеется ли в виду Хам или Ханаан.
translation_notes:
  register: Современный литературный русский язык с простым повествовательным синтаксисом. Формулировка «после вина» выбрана как естественная русская передача еврейского оборота без архаизации и без толковательного «протрезвел».
