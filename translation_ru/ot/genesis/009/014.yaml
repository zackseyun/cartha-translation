  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: ru
  text: И когда Я наведу облака на землю, в облаке станет виден лук[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть радуга. В еврейском тексте употреблено обычное слово «лук»; здесь оно обозначает радугу как знак завета.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И когда
  rationale: Конструкция вводит будущее временное обстоятельство; «И когда» естественно передаёт эту функцию по-русски.
- source_word: בְּעַנְנִי עָנָן
  choice: Я наведу облака
  rationale: Знаменательная форма глагола ענן с существительным עָנָן выражает действие Бога, покрывающего землю облаками. Русское «наведу облака» естественно и сохраняет причинный оттенок.
- source_word: עַל הָאָרֶץ
  choice: на землю
  rationale: В контексте всемирного завета הָאָרֶץ обозначает землю в широком смысле; с глаголом «наведу» русский язык естественно требует сочетания «на землю».
- source_word: וְנִרְאֲתָה
  choice: станет виден
  rationale: Форма нифаль от ראה означает «быть увиденным, стать видимым». «Станет виден» сохраняет пассивный оттенок и будущую соотнесённость.
- source_word: הַקֶּשֶׁת
  choice: лук
  rationale: קֶשֶׁת — обычное древнееврейское слово для боевого лука; здесь оно обозначает радугу как знак завета. «Лук» сохраняет образ исходного текста, а сноска проясняет референцию.
- source_word: בֶּעָנָן
  choice: в облаке
  rationale: Существительное стоит в единственном числе с артиклем; прямое соответствие «в облаке» сохраняет форму и образ оригинала.
theological_decisions:
- issue: Передача קֶשֶׁת в повествовании о завете с Ноем
  choice: лук
  alternative: радуга
  rationale: Выбор «лук» сохраняет намеренную образность еврейского слова и связь знака завета с обычным луком, не отрицая того, что в данном контексте речь идёт о радуге; это разъяснено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавное «Я» обозначает говорящего Бога. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
