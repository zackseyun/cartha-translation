lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная повествовательная форма от אמר вводит прямую речь; русское «И сказал» естественно продолжает рассказ, не добавляя имени говорящего, которого нет в этой форме еврейского текста.
- source_word: אָרוּר
  choice: Проклят
  rationale: Предикативное прилагательное передано краткой формой, сохраняющей силу торжественного провозглашения без добавления отсутствующей в еврейском связки.
- source_word: כְּנָעַן
  choice: Ханаан
  rationale: Традиционная русская передача имени; именно Ханаан прямо назван объектом проклятия.
- source_word: עֶבֶד עֲבָדִים
  choice: рабом рабов
  rationale: Буквальное повторение сохраняет выразительную еврейскую конструкцию, обозначающую крайнюю степень подчинённости; значение пояснено в сноске.
- source_word: יִהְיֶה
  choice: будет он
  rationale: Имперфект היה в контексте изречения указывает на последующее состояние; порядок слов сохраняет торжественный акцент, оставаясь понятным по-русски.
- source_word: לְאֶחָיו
  choice: у своих братьев
  rationale: Передаёт отношение подчинения братьям и сохраняет мужское множественное число и притяжательное значение суффикса; «братья» в контексте может иметь также родовое значение.
theological_decisions:
- issue: На кого направлено проклятие Ноя
  choice: В тексте прямо назван Ханаан.
  alternative: Считать непосредственным объектом проклятия Хама.
  rationale: Еврейский текст недвусмысленно называет Ханаана; перевод не переносит проклятие на Хама на основании позднейших толкований.
- issue: Передача языка подневольного состояния
  choice: Сохранить «рабом рабов».
  alternative: «слугой слуг» или «самым низким из рабов».
  rationale: «Раб» точнее передаёт суровость предсказанного подчинения, а буквальная конструкция сохраняет риторику оригинала, не превращая возможный усилительный оборот в однозначную пояснительную парафразу.
translation_notes:
  register: Современный литературный русский с торжественной интонацией изречения. Синтаксис слегка приподнят, но понятен; буквальный образ «раб рабов» сохранён ради риторической силы и смысловой неоднозначности оригинала.
