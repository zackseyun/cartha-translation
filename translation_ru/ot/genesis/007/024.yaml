lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: господствовали
  rationale: Форма глагола גבר передаёт силу и превосходство вод, а не просто увеличение их количества. «Господствовали» естественно выражает их непреодолимую власть в повествовании о потопе.
- source_word: הַמַּיִם
  choice: воды
  rationale: Множественное число сохраняет форму еврейского слова и соответствует возвышенному повествовательному стилю рассказа о потопе.
- source_word: עַל הָאָרֶץ
  choice: над землёй
  rationale: Предлог עַל естественно передан как «над», а «земля» сохраняет широкий смысл אֶרֶץ и допускает как весь земной мир, так и землю или сушу по контексту.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: сто пятьдесят дней
  rationale: Еврейское выражение буквально располагает числительные как «пятьдесят и сто», но по-русски длительность естественно передаётся как «сто пятьдесят дней» без добавочного предлога.
theological_decisions:
- issue: Объём значения אֶרֶץ в повествовании о потопе
  choice: земля
  alternative: суша; страна
  rationale: Контекст описывает потоп во всеобщих категориях, однако само еврейское слово допускает более узкое значение. Русское «земля» уместно в основном тексте и не устраняет эту смысловую широту; примечание делает её явной.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Господствовали» сохраняет образ силы и превосходства вод, не сводя смысл к простому повышению уровня воды.
