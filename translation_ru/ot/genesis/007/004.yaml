base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: ru
  text: Ведь ещё семь дней[a] — и Я буду посылать дождь на землю сорок дней и сорок ночей; и сотру всё живое[b], что Я создал, с лица почвы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через семь дней». Еврейское выражение означает, что до начала дождя остаётся семь дней.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «всё стоящее», то есть всё существующее живое. Еврейское слово в этом контексте обозначает живых существ, подлежащих гибели.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст говорит здесь «с лица почвы», отличая почву (אֲדָמָה) от «земли» (אֶרֶץ) в первой части стиха.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с повелением предыдущего стиха естественным современным русским союзом.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: ещё семь дней — и
  rationale: 'Естественно выражает еврейскую временную конструкцию: до начала дождя остаётся семь дней.'
- source_word: אָנֹכִי מַמְטִיר
  choice: Я буду посылать дождь
  rationale: Сохраняет явное божественное действие каузативной формы глагола מטר и умеренное смысловое ударение на местоимении.
- source_word: עַל הָאָרֶץ
  choice: на землю
  rationale: Широкое значение אֶרֶץ уместно в контексте потопа; перевод не сужает его до отдельной области.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: сорок дней и сорок ночей
  rationale: Прямое и естественное воспроизведение временного выражения.
- source_word: וּמָחִיתִי
  choice: и сотру
  rationale: Сохраняет конкретный образ стирания или удаления, присущий מחה, не заменяя его более общим «уничтожу».
- source_word: כָּל הַיְקוּם
  choice: всё живое
  rationale: В данном контексте обозначает совокупность живых существ, подлежащих суду; формулировка не расширяет значение до всего существующего вообще.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: что Я создал
  rationale: Естественный русский перевод завершённого творческого действия Бога.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица почвы
  rationale: Сохраняет образную идиому «с лица» и различает אֲדָמָה («почва») и ранее употреблённое אֶרֶץ («земля»).
theological_decisions:
- issue: Масштаб суда потопом в אֶרֶץ / היקום
  choice: Передать широкими выражениями «земля» и «всё живое», не ограничивая текст местной областью.
  alternative: Перевести אֶרֶץ как «страна» или «земля [определённой области]», что могло бы подразумевать региональный масштаб.
  rationale: Сочетание выражений в стихе имеет всеохватный характер. Перевод сохраняет эту силу, не превращая стих в утверждение современной научной модели и не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «ещё семь дней — и» ясна обычному читателю; «сотру» и «с лица почвы» сохраняют ключевые образы и лексическое различие исходного текста.
