source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: ru
  text: В шестисотый год жизни Ноя, во второй месяц, в семнадцатый день месяца, в этот самый день разверзлись все источники[a] великой бездны, и открылись окна небес[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родники великой бездны».'
    reason: Лексема מַעְיָן может обозначать источник или родник; вариант отражает более конкретное значение.
  - marker: b
    text: 'Или: «шлюзы небес».'
    reason: אֲרֻבּוֹת обозначает окна или отверстия; «шлюзы» контекстуально передаёт образ открытого пути для вод, но является более истолковывающим вариантом.
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: В шестисотый год жизни Ноя
  rationale: Сохраняет датировку по продолжительности жизни Ноя и естественно звучит по-русски.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: во второй месяц
  rationale: Прямо и естественно передаёт временное обозначение.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: в семнадцатый день месяца
  rationale: Количественная конструкция еврейского текста по функции обозначает порядковую календарную дату.
- source_word: בַּיּוֹם הַזֶּה
  choice: в тот самый день
  rationale: Передаёт указательное и подчёркивающее значение формулы, связывая событие с только что названной датой.
- source_word: נִבְקְעוּ
  choice: разверзлись
  rationale: Передаёт образ внезапного раскрытия или рассечения; возвышенное слово уместно в данном космическом контексте и не вводит современного объяснения.
- source_word: כָּל מַעְיְנֹת
  choice: все источники
  rationale: «Источники» понятно современному читателю и допускает значение мест выхода вод, не вызывая бытового образа декоративных фонтанов.
- source_word: תְּהוֹם רַבָּה
  choice: великой бездны
  rationale: Сохраняет древний образ глубинных вод и значение прилагательного רַבָּה, не сводя выражение к геологическому описанию.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: и окна небес
  rationale: Сохраняет буквальный космический образ отверстий в небесах и множественное значение שָׁמַיִם.
- source_word: נִפְתָּחוּ
  choice: открылись
  rationale: Естественно передаёт нифаль как наступление состояния открытия и сохраняет параллелизм с «разверзлись».
theological_decisions:
- issue: Космическая образность вод потопа
  choice: Сохранены выражения «великая бездна» и «окна небес».
  alternative: Интерпретирующая передача наподобие «подземные воды вырвались наружу» и «небесные шлюзы открылись».
  rationale: Древняя космическая образность составляет часть повествования; перевод не должен без необходимости превращать её в современное научное объяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксис сохраняет торжественную цепь точных датировок; архаизирующие формы избегаются, кроме уместного и понятного глагола «разверзлись».
