lexical_decisions:
- source_word: גָּבְרוּ
  choice: усилились
  rationale: Глагол передаёт силу и нарастание вод; «усилились» естественно по-русски и сохраняет образ вод, набравших мощь.
- source_word: מְאֹד מְאֹד
  choice: чрезвычайно
  rationale: Двойное מְאֹד служит сильным усилением. «Чрезвычайно» передаёт эту эмфазу в современном литературном русском без неестественного буквального повтора.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Предлог עַל здесь естественно передаётся как «на», а אֶרֶץ в контексте может означать как землю вообще, так и сушу или страну; основной вариант «земля» сохраняет широту значения.
- source_word: וַיְכֻסּוּ
  choice: и покрылись
  rationale: Форма означает, что горы оказались покрыты водами. Возвратная конструкция естественна по-русски и не меняет результата действия.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: все высокие горы
  rationale: Передаёт всеобщность כָּל, обычное значение הָרִים и определение «высокие» без ослабления образа.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: под всем небом
  rationale: Это устойчивое и естественное русское выражение с универсальным смыслом. Морфологически множественное שָׁמַיִם отражено в сноске более буквальным вариантом.
theological_decisions:
- issue: Объём значения אֶרֶץ в повествовании о потопе
  choice: земля
  alternative: суша; страна
  rationale: Сочетание с выражением «под всем небом» придаёт описанию всеохватный характер в рамках повествования. При этом многозначность אֶרֶץ отмечена в сноске, чтобы перевод не решал сверх текста вопрос о географическом масштабе потопа.
translation_notes:
  register: Современный литературный русский с торжественной повествовательной интонацией. Синтаксис сохраняет последовательность еврейского текста; неестественный для русского удвоенный усилитель заменён сильным наречием, а буквальная форма «под всеми небесами» вынесена в сноску.
