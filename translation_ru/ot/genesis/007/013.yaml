  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: ru
  text: В тот самый день Ной вошёл в ковчег[a], а с ним — Сим, Хам и Иафет, сыновья Ноя, жена Ноя и три жены его сыновей; они были с ними[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пришёл»; в данном контексте речь идёт о входе в ковчег.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «с ними». Форма множественного числа, вероятнее всего, относится к Ною и его сыновьям как к уже названной группе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: В тот самый день
  rationale: Идиома с בְּעֶצֶם подчёркивает точное совпадение по времени; «тот самый день» естественно передаёт это усиление по-русски.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: вошёл в ковчег
  rationale: Хотя בָּא буквально означает «пришёл», сочетание с направительным אֶל и контекстом обозначает вход внутрь ковчега; русский глагол «вошёл» ясно и естественно передаёт движение.
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: и с ним — Сим, Хам и Иафет, сыновья Ноя
  rationale: Добавление «с ним» раскрывает сопутствующее участие перечисленных лиц, а тире естественно присоединяет пояснительное «сыновья Ноя».
- source_word: וְאֵשֶׁת נֹחַ
  choice: жена Ноя
  rationale: Естественная русская передача конструкции принадлежности без добавления имени, отсутствующего в исходном тексте.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: и три жены его сыновей
  rationale: Сохраняются число и родственная связь; местоимение «его» однозначно относится к Ною.
- source_word: אִתָּם
  choice: с ним (вводит весь сопровождающий Ноя семейный круг)
  rationale: Еврейская форма буквально имеет множественное число «с ними» и стоит в конце перечня. В русском синтаксисе её смысл естественно вынесен перед перечнем как «и с ним», чтобы избежать тяжеловесного повторения; морфологическая особенность отмечена в сноске.
- source_word: תֵּבָה
  choice: ковчег
  rationale: Устоявшийся и понятный русский эквивалент названия судна в повествовании о Ное.
