source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: ru
  text: И Ной сделал всё так, как повелел ему Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Глагол עשה имеет широкое значение «делать, совершать». Здесь «сделал» естественно передаёт исполнение повеления, не уточняя сверх текста, какие именно действия были совершены.
- source_word: נֹחַ
  choice: Ной
  rationale: Устоявшаяся русская форма библейского имени נֹחַ.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё так, как
  rationale: Сочетание выражает полное соответствие данному повелению. Русская конструкция «сделал всё так, как» естественно и точно сохраняет смысл всецелого исполнения.
- source_word: צִוָּהוּ
  choice: повелел ему
  rationale: Глагол צוה означает «повелевать, приказывать». «Повелел» соответствует dignified biblical register современной русской речи и ясно выражает Божье повеление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление יְהוָה в еврейском тексте, не заменяя его титулом.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יְהוָה. Форма «Яхве» передаёт его транслитерацией и не подменяет титулом; «Иегова» основано на более позднем смешанном прочтении.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка краткая и ясная; полнота послушания передана конструкцией «сделал всё так, как».
