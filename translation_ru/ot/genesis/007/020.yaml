  text: Вода поднялась на пятнадцать локтей[a], и горы были покрыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на пятнадцать локтей вверх»; точка отсчёта в еврейском тексте прямо не указана.'
    reason: Примечание отражает значение מִלְמַעְלָה и сохраняет неуточнённость точки отсчёта, не добавляя её в основной текст.
lexical_decisions:
- source_word: גָּבְרוּ הַמַּיִם
  choice: вода поднялась
  rationale: Глагол גבר здесь описывает усиление и подъём воды; по-русски «вода поднялась» естественно передаёт пространственный смысл контекста, не вводя неясного олицетворения «возобладала».
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: на пятнадцать локтей
  rationale: Сохранена древняя мера длины «локоть», а конструкция с «на» естественно выражает величину подъёма.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: и горы были покрыты
  rationale: Сохранён пассив исходного текста и не добавлено прямо не названное дополнение «водой».
theological_decisions:
- issue: Точка отсчёта для пятнадцати локтей
  choice: ещё на пятнадцать локтей
  alternative: на пятнадцать локтей выше гор
  rationale: Еврейское מִלְמַעְלָה указывает на движение или протяжённость вверх, но в самом стихе не выражает однозначно формулу «выше гор». Основной текст сохраняет связь с предшествующим подъёмом воды, не уточняя сверх исходника точку отсчёта.
translation_notes:
  register: Современный литературный русский язык; изложение простое и торжественное. Единственное число «вода» выбрано как обычная русская форма для собирательного значения еврейского הַמַּיִם.
