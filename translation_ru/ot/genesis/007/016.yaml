  - severity: medium
    issue: Неясная группировка оборота «из всякой плоти»
    rationale: В исходной пунктуации оборот после «мужского и женского пола» может синтаксически связываться с характеристикой пола. Перестановка и явные существительные «самцы и самки» делают его связь с вошедшими прозрачной, не меняя смысла.
  revised_text: И вошедшие — самцы и самки из всякой плоти[a] — вошли, как повелел ему Бог; и Яхве затворил за ним[b].
