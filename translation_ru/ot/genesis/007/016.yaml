  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: ru
  text: И вошедшие — самцы и самки из всякой плоти[a] — вошли, как повелел ему Бог; и Яхве затворил за ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Плоть» здесь — собирательное обозначение живых существ.
    reason: cultural_note
