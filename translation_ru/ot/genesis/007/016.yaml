    text: То есть закрыл за Ноем, оставив его внутри ковчега. В еврейском тексте дверь прямо не названа.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: И вошедшие ... вошли
  rationale: Сохраняется еврейская конструкция с субстантивированным причастием и последующим личным глаголом, а также начальный союз. Лёгкий повтор в русском отражает повтор корня בוא в оригинале.
- source_word: זָכָר וּנְקֵבָה
  choice: мужского и женского пола
  rationale: Естественное современное обозначение полового различия применительно к совокупности животных; оно избегает неуместного в данном синтаксисе единственного числа «самец и самка».
- source_word: מִכָּל בָּשָׂר
  choice: из всякой плоти
  rationale: Предлог «из» передаёт מִן, а «плоть» сохраняет конкретный коллективный образ оригинала, не заменяя его толкованием «живые существа».
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: как повелел ему Бог
  rationale: «Как» выражает соответствие прежде данному повелению; совершенный вид «повелел» естественно передаёт предшествующее действие без необходимости вводить отсутствующую в русском форму давнопрошедшего времени.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычный русский эквивалент общего божественного наименования в повествовательном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Тетраграмматона, не подменяя его титулом «Господь».
- source_word: וַיִּסְגֹּר ... בַּעֲדוֹ
  choice: и Яхве затворил за ним
  rationale: «Затворил» передаёт действие закрывания, а «за ним» сохраняет отсутствие явно названного объекта в еврейском тексте; дверь подразумевается контекстом, но не добавляется в основной текст.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и следует наиболее вероятной научной реконструкции произношения.
- issue: Кто или что было затворено
  choice: Яхве затворил за ним
  alternative: Яхве затворил его внутри; Яхве закрыл за ним дверь
  rationale: Еврейское בַּעֲדוֹ допускает контекстуальный смысл закрытия за Ноем или заключения его внутри, однако прямо не называет дверь. Основной текст сохраняет эту сжатость, а примечание поясняет подразумеваемый смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Глагол «затворил» выбран как понятный, но торжественный; синтаксический повтор «вошедшие ... вошли» намеренно сохраняет структуру и акцент еврейского текста.
