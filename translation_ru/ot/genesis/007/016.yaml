revisions:
- from: И вошедшие — мужского и женского пола, из всякой плоти[a] — вошли, как повелел ему Бог; и Яхве затворил за ним[b].
  to: И вошедшие — самцы и самки из всякой плоти[a] — вошли, как повелел ему Бог; и Яхве затворил за ним[b].
  rationale: Исправление ограничено заменой отвлечённого оборота «мужского и женского пола» на прямое обозначение животных «самцы и самки». Это устраняет синтаксическую неясность, улучшает современную естественность и точнее передаёт еврейскую пару, сохраняя повтор «вошедшие ... вошли», «из всякой плоти», божественные имена и осторожность относительно подразумеваемой двери.
