base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: ru
  text: Они и все дикие животные по роду своему, и весь скот по роду своему, и все существа, ползающие по земле, по роду своему, и все птицы по роду своему — всякая птица, всякое крылатое существо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально последняя фраза: «всякая птица, всякое крыло»; «крыло» здесь обозначает крылатое существо.'
    reason: Передача еврейской идиомы и сохранение пояснительной структуры исходного текста.
lexical_decisions:
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное личное местоимение продолжает перечень вошедших в ковчег, начатый в предыдущем стихе; «они» естественно сохраняет связь с контекстом.
- source_word: הַחַיָּה
  choice: дикие животные
  rationale: В данном перечне חַיָּה противопоставлено בְּהֵמָה и обозначает прежде всего диких наземных животных.
- source_word: הַבְּהֵמָה
  choice: скот
  rationale: Русское «скот» кратко и естественно обозначает домашних четвероногих животных и сохраняет отличие от диких животных.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: по роду своему
  rationale: Устойчивая и понятная русская формула для классификационного оборота с מִין; местоимение «своему» позволяет естественно передать меняющийся грамматический род еврейских существительных.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: все существа, ползающие по земле
  rationale: Передаёт повтор корня רמש по смыслу, не сужая категорию до «пресмыкающихся» в современном зоологическом значении.
- source_word: הָעוֹף
  choice: птицы
  rationale: В сочетании с последующим צִפּוֹר контекст ясно указывает на птиц; это наиболее естественное русское обозначение.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: всякая птица, всякое крылатое существо
  rationale: Сохраняет двучленную пояснительную формулу и её всеохватность; буквальное «всякое крыло» по-русски было бы непонятно без пояснения.
