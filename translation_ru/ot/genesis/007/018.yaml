    rationale: Исходный текст сначала говорит о возрастании силы/преобладании вод, затем об их чрезвычайном увеличении. Перестановка допустима лишь при сохранении ясной связи מאד со вторым глаголом; здесь она её размывает.
  revised_text: Воды всё сильнее одолевали землю и чрезвычайно прибывали, а ковчег двигался по поверхности вод.
