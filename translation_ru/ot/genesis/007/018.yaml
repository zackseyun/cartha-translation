- from: Воды всё прибывали и чрезвычайно усиливались на земле, а ковчег двигался по поверхности вод.
  to: Воды всё сильнее одолевали землю и чрезвычайно прибывали, а ковчег двигался по поверхности вод.
  rationale: Правка сохраняет последовательность двух еврейских сказуемых и относит «чрезвычайно» к количественному увеличению вод. «Всё сильнее одолевали землю» передаёт глагол גבר и предлог על без определения географического масштаба, а «двигался по поверхности вод» сохраняет намеренно неуточнённый характер движения ковчега.
