  source_fidelity: 'Черновик верно передаёт оба глагола: גבר — нарастание, преобладание силы вод, и רבה מאד — их чрезвычайное увеличение. Однако «всё прибывали и чрезвычайно усиливались» переставляет смысловые акценты еврейского текста и синтаксически привязывает «чрезвычайно» к «усиливались», тогда как מאד непосредственно усиливает «умножились/прибыли».'
