  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: ru
  text: Воды всё сильнее одолевали землю и чрезвычайно прибывали, а ковчег двигался по поверхности вод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: усиливались
  rationale: Глагол גבר передаёт нарастание силы и мощи вод; «усиливались» естественно звучит по-русски и сохраняет этот смысл, не сводя его лишь к повышению уровня.
- source_word: הַמַּיִם
  choice: воды
  rationale: Форма множественного числа и повествовательный контекст потопа поддерживают традиционное и естественное русское «воды».
- source_word: וַיִּרְבּוּ מְאֹד
  choice: всё прибывали и чрезвычайно
  rationale: רבה обозначает умножение или увеличение, а מְאֹד резко усиливает его. Оборот «всё прибывали» естественно описывает непрерывный подъём вод; «чрезвычайно» сохраняет сильную степень интенсификации и относится к составному описанию нарастания вод.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: אֶרֶץ допускает значения «земля» и «страна/суша». Здесь «на земле» сохраняет широкую формулировку исходного текста без добавочного уточнения.
- source_word: וַתֵּלֶךְ
  choice: двигался
  rationale: הלך буквально означает «идти, двигаться». С ковчегом в качестве подлежащего «двигался» передаёт перемещение, не уточняя, плыл ли он направленно или дрейфовал.
- source_word: הַתֵּבָה
  choice: ковчег
  rationale: Устоявшееся и контекстуально точное русское обозначение תֵּבָה в повествовании о Ное.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: по поверхности вод
  rationale: Буквальное «по лицу вод» является еврейской идиомой, означающей поверхность воды; русский оборот ясно и естественно передаёт её смысл.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: земле
  alternative: суше / стране
  rationale: Слово может обозначать землю вообще, сушу или определённую территорию. Перевод «земле» сохраняет лексическую широту и не решает в самом стихе вопрос о географическом масштабе потопа.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранено различие между усилением вод и их количественным нарастанием; движение ковчега выражено без добавления отсутствующего в тексте способа движения.
