  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: ru
  text: И Ной вместе со своими сыновьями, женой и жёнами своих сыновей вошёл в ковчег из-за вод потопа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: Глагол בוא может означать приход, движение или вхождение; при אֶל הַתֵּבָה контекстуально точнее всего «вошёл в ковчег».
- source_word: נֹחַ
  choice: Ной
  rationale: Традиционная и общепринятая русская форма имени נֹחַ.
- source_word: וּבָנָיו
  choice: его сыновья
  rationale: בָּנִים здесь обозначает именно сыновей, а не детей вообще.
- source_word: וְאִשְׁתּוֹ
  choice: его жена
  rationale: Существительное אִשָּׁה с притяжательным суффиксом в данном семейном контексте означает жену Ноя.
- source_word: וּנְשֵׁי בָנָיו
  choice: жёны его сыновей
  rationale: Передаёт буквальную структуру сочетания «жёны его сыновей»; вариант «невестки» короче, но менее прозрачно отражает еврейское выражение.
- source_word: אִתּוֹ
  choice: а с ним
  rationale: Отдельно передаёт указание на сопровождение Ноя и сохраняет смысловую организацию еврейской фразы; вводная конструкция позволяет естественно согласовать сказуемое в единственном числе с Ноем.
- source_word: אֶל הַתֵּבָה
  choice: в ковчег
  rationale: Предлог אֶל выражает направленность движения, а תֵּבָה в рассказе о Ное традиционно и точно передаётся словом «ковчег».
- source_word: מִפְּנֵי
  choice: из-за
  rationale: 'В этом контексте сочетание указывает на причину: Ной вошёл в ковчег вследствие наступления вод потопа.'
- source_word: מֵי הַמַּבּוּל
  choice: вод потопа
  rationale: Сохраняет оба существительных еврейского сочетания и его родительную структуру без лишнего уточнения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексемой «ковчег». Конструкция «а с ним…» сохраняет явное אִתּוֹ и выделяет Ноя как грамматический центр предложения, не делая фразу неестественной.
