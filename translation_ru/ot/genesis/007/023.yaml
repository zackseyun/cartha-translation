  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: ru
  text: 'Он стёр с лица земли всё живое[a]: людей[b], скот, ползающих существ и птиц небесных[c]. Все они были стёрты с земли. Остались только Ной и всё, что было с ним в ковчеге.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уничтожил». Еврейский глагол передаёт образ стирания, удаления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от человека»; еврейское слово здесь употреблено собирательно и обозначает людей в целом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «птицы неба».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: стёр / были стёрты
  rationale: Глагол מחה передаёт образ стирания или удаления; «стёр» сохраняет этот образ и естественно звучит по-русски, а страдательная форма во втором случае отражена как «были стёрты».
- source_word: כָּל הַיְקוּם
  choice: всё живое
  rationale: В контексте потопа выражение обозначает совокупность живых существ на суше, а не отвлечённое «всё существующее».
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Русское устойчивое выражение естественно передаёт еврейский пространственный образ; с глаголом «стереть» оно также сохраняет словесную образность оригинала.
- source_word: מֵאָדָם
  choice: людей
  rationale: אָדָם здесь употреблено собирательно и обозначает человечество как одну из перечисленных категорий живых существ. Русское множественное число ясно передаёт этот смысл.
- source_word: בְּהֵמָה
  choice: скот
  rationale: В данном перечне слово обозначает домашних крупных животных; «скот» — краткий и привычный русский эквивалент.
- source_word: רֶמֶשׂ
  choice: ползающих существ
  rationale: Так передаётся широкая категория небольших наземных существ, передвигающихся у поверхности земли, без неоправданного сужения до пресмыкающихся.
- source_word: עוֹף הַשָּׁמַיִם
  choice: птиц небесных
  rationale: Формулировка сохраняет генитивную конструкцию и возвышенный стиль повествования, оставаясь понятной современному читателю.
- source_word: מִן הָאָרֶץ
  choice: с земли
  rationale: אֶרֶץ допускает значения «земля» и «страна»; в контексте повествования о потопе «земля» прямо и нейтрально передаёт формулировку текста.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: Остался только Ной
  rationale: «Только» передаёт ограничительную частицу אַךְ, а «остался» — значение שׁאר.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: и те, кто был с ним в ковчеге
  rationale: Собирательное относительное выражение охватывает находившихся с Ноем людей и животных; «те, кто» по-русски естественнее буквального «то, что» и не ограничивает референтов только людьми.
theological_decisions:
- issue: Масштаб уничтожения в повествовании о потопе
  choice: Передать всеохватную формулировку стиха прямо, сохранив названные в тексте категории наземной жизни.
  alternative: Истолковать формулировку либо как гиперболическое описание местного бедствия, либо как специально сформулированное научное утверждение о глобальном событии.
  rationale: Перевод сохраняет повествовательную силу еврейского текста, но не добавляет к нему решения позднейшего спора о географическом масштабе потопа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. Образ «стереть с лица земли» сохраняет лексику оригинала и одновременно является естественным русским оборотом. Перечень оформлен без повторяющегося «до», поскольку по-русски это могло бы ошибочно восприниматься как шкала, а не как ряд категорий.
