lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Через семь дней
  rationale: 'Буквальная конструкция означает: «и было по прошествии семи дней». В современном русском повествовании «через семь дней» естественно и точно передаёт достижение указанного момента времени.'
- source_word: וּמֵי הַמַּבּוּל
  choice: воды потопа
  rationale: Сочетание с существительным в форме сопряжения буквально обозначает «воды потопа»; это ясно и естественно по-русски.
- source_word: הָיוּ עַל
  choice: покрыли
  rationale: 'Буквально: «были на». В контексте наступления потопа глагол «покрыли» естественно выражает появление вод на поверхности земли, не добавляя нового участника или причины действия.'
- source_word: הָאָרֶץ
  choice: землю
  rationale: Слово אֶרֶץ может означать как всю землю, так и определённую страну или сушу. В основном тексте выбрано традиционное и контекстуально уместное «землю», а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Объём значения אֶרֶץ в рассказе о потопе
  choice: землю
  alternative: сушу; страну
  rationale: Еврейское слово допускает более широкое и более локальное понимание. Основной перевод сохраняет обычное для данного повествования «землю», но сноска не позволяет этому выбору искусственно разрешить дискуссию о географическом масштабе потопа.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза без архаичного «и было». Формулировка сохраняет событийную последовательность и понятна широкому кругу читателей.
