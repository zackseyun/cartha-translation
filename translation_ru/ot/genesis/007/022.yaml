source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: ru
  text: Всё на суше, в чьих ноздрях было дыхание жизни, умерло[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дыхание духа жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: всё … в чьих
  rationale: Оборот имеет всеохватное значение и включает как людей, так и животных; русское «всё» сохраняет неперсональный широкий охват.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: дыхание жизни
  rationale: Составное еврейское выражение обозначает жизненное дыхание. Такой перевод естественен по-русски и не создаёт лишнего впечатления о нескольких отдельных метафизических сущностях; буквальная структура сохранена в примечании.
- source_word: בְּאַפָּיו
  choice: в чьих ноздрях
  rationale: Еврейский текст использует единственное число с местоименным суффиксом, но значение распределительное; относительный оборот естественно передаёт его по-русски.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: на суше
  rationale: Выражение ограничивает область сухой землёй в противопоставлении водной среде; «на суше» кратко и точно передаёт этот смысл.
- source_word: מֵתוּ
  choice: умерло
  rationale: Глагол прямо сообщает о наступившей смерти; форма единственного числа согласована с собирательным «всё».
theological_decisions:
- issue: Значение רוּחַ в сочетании נִשְׁמַת רוּחַ חַיִּים
  choice: В основном тексте передать всё сочетание как «дыхание жизни».
  alternative: «дыхание духа жизни»
  rationale: В данном сочетании значения «дух» и «дыхание» семантически перекрываются, и речь идёт о жизненном дыхании. Буквальный вариант возможен, но по-русски способен ошибочно внушить сложное метафизическое различение, которого контекст не требует; поэтому он указан в примечании.
translation_notes:
  register: Современный литературный русский язык; формулировка лаконична и торжественна без архаизмов. Собирательное «всё» позволяет охватить всех наземных живых существ, не ограничивая стих только людьми.
