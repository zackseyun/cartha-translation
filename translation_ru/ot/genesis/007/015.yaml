  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: ru
  text: И вошли к Ною в ковчег по двое из всякой плоти, в которой было дыхание жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух жизни». Еврейское слово רוּחַ может означать «дыхание», «ветер» или «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И вошли
  rationale: Глагол בוא обозначает движение к месту или в него; в контексте посадки в ковчег русское «вошли» естественно выражает достигнутый результат.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: к Ною в ковчег
  rationale: Первое אֶל сохраняет направленность «к Ною», а второе в данном контексте естественно передаётся как движение «в ковчег».
- source_word: שְׁנַיִם שְׁנַיִם
  choice: по двое
  rationale: Повтор числительного имеет распределительное значение; «по двое» — точный и естественный русский эквивалент.
- source_word: מִכָּל הַבָּשָׂר
  choice: из всякой плоти
  rationale: «Плоть» сохраняет конкретный образ и тематическую лексику рассказа о потопе; здесь выражение охватывает живых существ.
- source_word: אֲשֶׁר בּוֹ
  choice: в которой было
  rationale: Формулировка близко передаёт еврейскую относительную конструкцию и согласуется с существительным «плоть».
- source_word: רוּחַ חַיִּים
  choice: дыхание жизни
  rationale: В контексте живых существ רוּחַ естественно понимать как оживляющее дыхание; при этом возможное значение «дух» отмечено в сноске.
theological_decisions:
- issue: Значение רוּחַ в сочетании רוּחַ חַיִּים
  choice: дыхание жизни
  alternative: дух жизни
  rationale: Зоологический и повествовательный контекст указывает прежде всего на признак телесной жизни, однако многозначность רוּחַ не устраняется и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Выражение «всякая плоть» сохранено ради образности и межтекстовой последовательности; синтаксис сделан ясным для обычного читателя.
