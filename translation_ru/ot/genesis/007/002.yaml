base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: ru
  text: 'Из всех чистых животных возьми себе по семь пар, самцу и самке в каждой, а из животных, которые не чисты, — по две особи: самца и самку.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: из всех животных
  rationale: Сочетание מִן с כֹּל обозначает совокупность, из которой следует брать животных. Русское «из всех» естественно передаёт это значение; בְּהֵמָה здесь понимается широко как «животные», без сужения до домашнего скота.
- source_word: הַטְּהוֹרָה
  choice: чистых
  rationale: «Чистый» — краткий и общепринятый русский эквивалент טָהוֹר в противопоставлении чистых и нечистых животных; уточнение «ритуально» отсутствует в исходном тексте.
- source_word: תִּקַּח לְךָ
  choice: возьми себе
  rationale: Повелительное значение формы передано императивом, а לְךָ отражено словом «себе».
- source_word: שִׁבְעָה שִׁבְעָה
  choice: по семь пар
  rationale: Повтор числительного выражает распределение или группировку; последующее «самец и самка» наиболее естественно указывает на семь пар. Возможность понимания как семи отдельных животных отмечена в сноске.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: самца и самку
  rationale: Буквально употреблены слова «мужчина и его жена/женщина», но применительно к животным это идиоматическое обозначение пары разного пола. «Самец и самка» звучит естественно и не вносит антропоморфизма.
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: которые не чисты
  rationale: Аналитическое отрицание исходного текста сохранено, вместо того чтобы без пояснения заменить его одним прилагательным «нечистые».
- source_word: שְׁנַיִם
  choice: по два
  rationale: Числительное буквально означает «два»; распределительное «по» естественно в русском контексте и согласуется с последующим указанием на самца и самку.
theological_decisions:
- issue: Число чистых животных
  choice: семь пар чистых животных
  alternative: семь отдельных чистых животных
  rationale: Повтор שִׁבְעָה שִׁבְעָה и последующая формула «самец и самка» убедительно указывают на парные единицы; однако грамматическая форма допускает более буквальное понимание «семь и семь», поэтому альтернативное толкование сохранено в сноске.
- issue: Характер чистоты животных
  choice: чистые / не чистые
  alternative: ритуально чистые / нечистые
  rationale: Исходный текст обозначает различие словами «чистый» и «не чистый», не добавляя определения «ритуальный». Перевод не уточняет природу этой категории сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с ясной повелительной конструкцией. Слова «животные», «самец» и «самка» нейтральны и понятны широкому кругу читателей; сохранено различие между «чистыми» и аналитическим «не чисты» без конфессиональных уточнений.
