  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: ru
  text: 'Тогда Яхве[a] сказал Ною: «Войди в ковчег — ты и весь твой дом, потому что Я увидел, что ты праведен предо Мной в этом поколении».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (ЙХВХ).
    reason: Поясняет непривычную для части русских читателей передачу тетраграмматона личным именем.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул «Господь».
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: בֹּא
  choice: Войди
  rationale: Императив означает «войди/входи»; выбран краткий и естественный вариант, соответствующий контексту ковчега.
- source_word: בֵּיתְךָ
  choice: весь твой дом
  rationale: «Дом» здесь обозначает не здание, а домочадцев, весь семейно-домашний круг Ноя; русский оборот сохраняет и смысл, и библейский образ.
- source_word: הַתֵּבָה
  choice: ковчег
  rationale: Это закрепившееся и контекстуально точное русское обозначение судна Ноя.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание повеления и ясно передаёт причинную связь.
- source_word: רָאִיתִי
  choice: Я увидел
  rationale: Сохранено прямое значение перфекта «увидел» без истолковывающей замены на «счёл» или «признал».
- source_word: צַדִּיק
  choice: праведен
  rationale: «Праведен» — точный и традиционно понятный эквивалент, сохраняющий нравственно-богословскую весомость слова.
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Сохранён образ пребывания перед Божьим лицом и Божьей оценки; форма естественна для возвышенного литературного регистра.
- source_word: בַּדּוֹר הַזֶּה
  choice: в этом поколении
  rationale: Оборот относится к поколению современников Ноя и не сужается до значения «век» или «эпоха».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер праведности Ноя
  choice: «Я увидел, что ты праведен предо Мной»
  alternative: «Я признал тебя праведным»; «ты один праведен»
  rationale: Перевод сохраняет данную в тексте Божью оценку, не добавляя ни исключительного «один», ни объяснения основания этой праведности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным; «предо Мной» и «весь твой дом» сохраняют достоинство и образность оригинала без архаизации всего стиха.
