base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: ru
  text: Из чистых животных и из животных, которые не чисты[a], и из птиц, и из всего, что ползает по земле —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечистых». Буквально: «которые не чисты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: из
  rationale: Предлог обозначает принадлежность к перечисляемым категориям; его повторение сохраняет структуру и ритм еврейского текста.
- source_word: בְּהֵמָה
  choice: животные
  rationale: Здесь слово обозначает широкую категорию, противопоставленную птицам и ползающим существам, а не только домашний скот.
- source_word: טְּהוֹרָה
  choice: чистые
  rationale: В контексте ритуальной классификации животных «чистые» — традиционный, точный и понятный современному читателю эквивалент.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: которые не чисты
  rationale: Так сохраняется аналитическое отрицание оригинала — буквально «которые не чисты», — без замены его одним словом «нечистые».
- source_word: עוֹף
  choice: птицы
  rationale: Хотя слово может охватывать летающих существ шире, в данном перечне «птицы» является естественным и достаточно точным переводом.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: всё, что ползает
  rationale: Передаёт собирательное значение и глагольный образ движения, оставаясь естественным в современном русском языке.
- source_word: עַל הָאֲדָמָה
  choice: по земле
  rationale: Оборот обозначает поверхность земли как среду передвижения ползающих существ; русское «ползает по земле» идиоматично.
