  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: ru
  text: 'И умерла всякая плоть, двигавшаяся по земле: птицы, скот, дикие животные, все кишащие на земле существа и весь человеческий род.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё человечество». Еврейское выражение «весь адам» употреблено собирательно и обозначает человеческий род в целом.'
    reason: Лексическая альтернатива и пояснение собирательного употребления הָאָדָם.
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: умерла
  rationale: Глагол גוע обозначает смерть, угасание жизни. Нейтральное современное «умерла» точно передаёт смысл и согласуется с собирательным выражением «всякая плоть».
- source_word: כָּל בָּשָׂר
  choice: всякая плоть
  rationale: Сохранён понятный библейский оборот, охватывающий здесь всю перечисленную далее земную одушевлённую жизнь.
- source_word: הָרֹמֵשׂ
  choice: двигавшаяся
  rationale: 'רמש в данном обобщающем контексте нельзя сужать до ползания: далее названы птицы, домашние и дикие животные. «Двигавшаяся» сохраняет широкий смысл.'
- source_word: עַל הָאָרֶץ
  choice: по земле
  rationale: При глаголе движения русское «по земле» естественно передаёт пространственное значение עַל הָאָרֶץ; при повторном употреблении далее выбрано «на земле».
- source_word: בָּעוֹף
  choice: птицы
  rationale: עוֹף может шире означать летающих существ, однако «птицы» — естественное и точное обозначение этой категории в русском перечне.
- source_word: וּבַבְּהֵמָה
  choice: скот
  rationale: בְּהֵמָה в противопоставлении חַיָּה обозначает домашних животных; «скот» кратко и традиционно передаёт эту категорию.
- source_word: וּבַחַיָּה
  choice: дикие звери
  rationale: В данном перечне חַיָּה противопоставлена домашнему скоту и означает диких наземных животных.
- source_word: וּבְכָל הַשֶּׁרֶץ
  choice: все кишащие существа
  rationale: שֶׁרֶץ обозначает мелких существ, которые кишат или роятся. «Существа» звучит естественнее буквального «кишащее» и не сужает значение до ползающих животных.
- source_word: הַשֹּׁרֵץ
  choice: кишевшие
  rationale: Повтор корня передан однокоренными словами «кишащие… кишевшие», насколько это допускает естественный русский синтаксис.
- source_word: וְכֹל הָאָדָם
  choice: и весь человеческий род
  rationale: С артиклем הָאָדָם употреблено собирательно и означает человечество в целом, а не только мужчин или отдельного человека.
theological_decisions:
- issue: Собирательное значение הָאָדָם
  choice: весь человеческий род
  alternative: всё человечество; все люди
  rationale: Еврейское выражение обозначает человеческий род коллективно. Выбранный вариант сохраняет торжественный регистр и не ограничивает смысл мужчинами.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены ключевой образ «всякая плоть», широкий смысл רמש и корневой повтор שֶׁרֶץ / שׁרץ. Маркер сноски поставлен непосредственно после поясняемого выражения.
