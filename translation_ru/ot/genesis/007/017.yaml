    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: продолжался
  rationale: При подлежащем «потоп» и указании времени «сорок дней» глагол передаёт длительность происходящего. «Продолжался» естественно выражает это по-русски; более формальный вариант отмечен в сноске.
- source_word: הַמַּבּוּל
  choice: потоп
  rationale: Устоявшееся и контекстуально точное обозначение потопа во времена Ноя.
- source_word: אַרְבָּעִים יוֹם
  choice: сорок дней
  rationale: Прямой перевод указания длительности; значение продолжительности выражено русским глаголом.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Естественная передача пространственного значения; в контексте потопа אֶרֶץ понимается широко как земля.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: вода прибывала
  rationale: Глагол выражает увеличение количества и уровня воды. Русское собирательное единственное число звучит естественно и не меняет смысла еврейского множественного числа.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: подняла ковчег
  rationale: Передаёт физическое действие прибывающей воды, поднявшей ковчег.
- source_word: הַתֵּבָה
  choice: ковчег
  rationale: Устоявшееся и точное в данном контексте название судна Ноя.
- source_word: וַתָּרָם
  choice: он возвысился
  rationale: 'Форма согласуется с «ковчегом» и описывает результат действия воды: ковчег оказался поднят над поверхностью земли.'
- source_word: מֵעַל הָאָרֶץ
  choice: над землёй
  rationale: Передаёт удаление вверх от поверхности земли без добавления отсутствующего в оригинале уточнения высоты.
