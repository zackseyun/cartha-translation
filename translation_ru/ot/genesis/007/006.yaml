translation:
  language: ru
  text: Ною было шестьсот лет, и на земле[a] был потоп[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Еврейское слово может означать как землю вообще, так и определённую страну или область.'
    reason: alternative_reading
  - marker: b
    text: 'Буквальнее: «и потоп был водами на земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Ною
  rationale: Имя передано в традиционной русской форме; дательный падеж требуется естественной русской конструкцией обозначения возраста «Ною было…». Начальный союз וְ не вынесен отдельно, поскольку в русском повествовании связь с предыдущим контекстом ясна без дополнительного «и».
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: было шестьсот лет
  rationale: Еврейское выражение буквально означает «сын шестисот лет», но является обычной идиомой возраста; по-русски его естественно передать конструкцией «было шестьсот лет».
- source_word: וְ/הַ/מַּבּוּל
  choice: и … был потоп
  rationale: מַבּוּל обозначает великий потоп; союз וְ сохранён как «и», а порядок слов перестроен ради естественного русского синтаксиса.
- source_word: הָיָה מַיִם
  choice: был потоп
  rationale: Буквальная конструкция «потоп был водами» по-русски неестественна. Основной текст передаёт её идиоматический смысл, а буквальное устройство и явное слово «воды» сохранены в сноске.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Предлог עַל передан как «на», а הָאָרֶץ — как «земля»; это наиболее прямое и естественное чтение в контексте рассказа о потопе.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: земля
  alternative: страна / суша
  rationale: Существительное допускает значения «земля», «страна» и «суша». В контексте повествования о потопе более уместно широкое «земля», однако возможное более узкое значение отмечено в сноске без догматического уточнения масштаба события.
- issue: Связь двух частей стиха
  choice: сочинительная связь «и»
  alternative: временная связь «когда»
  rationale: Еврейский текст соединяет части союзом וְ и прямо не употребляет временного союза. Поэтому сохранено «и», чтобы не делать подразумеваемую временную связь явной.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Идиома возраста передана естественно; необычная еврейская именная конструкция не калькирована в основном тексте, но отражена в сноске.
