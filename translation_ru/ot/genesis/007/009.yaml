base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: ru
  text: По двое[a] они пришли к Ною в ковчег — самец и самка, как Бог повелел Ною.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двое, двое»; то есть парами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: по двое
  rationale: 'Повтор числительного имеет распределительное значение: животные приходили парами. «По двое» естественно передаёт этот смысл по-русски, сохраняя начальную позицию и смысловое выделение оборота.'
- source_word: בָּאוּ
  choice: пришли
  rationale: Обычный глагол движения בוא здесь описывает прибытие к Ною; «пришли» сохраняет повествовательную перспективу и не сводит действие только к результату входа.
- source_word: אֶל נֹחַ
  choice: к Ною
  rationale: Предлог אֶל обозначает направленность движения к Ною.
- source_word: אֶל הַתֵּבָה
  choice: в ковчег
  rationale: При глаголе движения и в данном контексте אֶל указывает на ковчег как место назначения; русское «в ковчег» ясно передаёт вход внутрь.
- source_word: זָכָר וּנְקֵבָה
  choice: самец и самка
  rationale: Сохранены единственное число и биологическое обозначение пары, характерные для еврейского текста.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз выражает соответствие произошедшего Божьему повелению; простое «как» естественно и достаточно точно.
- source_word: צִוָּה אֱלֹהִים
  choice: Бог повелел
  rationale: Совершенный вид показывает, что повеление предшествовало приходу животных; русский вид и контекст передают эту временную последовательность без вспомогательной конструкции.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном повествовательном контексте слово обозначает единого Бога и требует формы единственного числа.
theological_decisions:
- issue: Причина и способ прихода животных
  choice: Сказано лишь, что животные пришли в соответствии с Божьим повелением.
  alternative: Уточнить, что Бог сверхъестественно привёл их, либо что Ной сам собрал их.
  rationale: Еврейский текст подчёркивает соответствие Божьему повелению, но не объясняет механизм прихода; перевод не добавляет отсутствующего пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальный оборот сохранён ради акцента оригинала; тире естественно присоединяет пояснение «самец и самка».
