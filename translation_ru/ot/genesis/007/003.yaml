  text: Также из птиц небесных — семь и семь[a], самцов и самок, чтобы сохранить в живых потомство на лице всей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь пар». В еврейском тексте буквально сказано: «семь, семь». Это распределительное выражение можно понимать как семь особей каждого пола или как семь пар; основной текст точнее сохраняет форму оригинала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Передаёт присоединение птиц к ранее названным животным без избыточного усиления.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: из птиц небесных
  rationale: В данном контексте עוֹף естественно означает птиц, а שָּׁמַיִם — небо; выражение «птицы небесные» понятно и сохраняет библейскую образность.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: семь и семь
  rationale: Сохраняет повтор числительного в еврейском тексте и не устраняет возможную неоднозначность между распределительным значением и пониманием как семи пар.
- source_word: זָכָר וּנְקֵבָה
  choice: самцов и самок
  rationale: Для животных это естественное современное обозначение мужского и женского пола; множественное число согласуется с группой птиц, не меняя смысла исходного выражения.
- source_word: לְחַיּוֹת
  choice: чтобы сохранить в живых
  rationale: 'Передаёт каузативное значение формы породы хифиль: не просто дать жить, а обеспечить сохранение жизни.'
- source_word: זֶרַע
  choice: потомство
  rationale: В контексте продолжения животной жизни после потопа слово означает потомство, хотя буквально может значить «семя».
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: на лице всей земли
  rationale: Сохраняет пространственный образ устойчивого еврейского выражения и остаётся понятным в литературном русском языке.
