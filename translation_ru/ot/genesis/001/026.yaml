base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: ru
  text: 'И сказал Бог: «Сотворим человека[a] по нашему образу, по нашему подобию[b], и пусть они владычествуют[c] над рыбами морскими, над птицами небесными[d], над скотом, над всей землёй и над всяким существом, пресмыкающимся по земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество», «человеческий род». Еврейское אָדָם здесь — собирательное единственное число: человек как единый род. Поэтому далее употреблено множественное число: «пусть они владычествуют».'
    reason: lexical_alternative
  - marker: b
    text: 'Формы множественного числа «Сотворим» и «нашему» соответствуют еврейскому тексту. Их понимают по-разному: как Божье размышление или совещание, как обращение к небесному совету или — в христианском прочтении всего Писания — как указание, согласующееся с позднейшим откровением о Троице.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «господствуют», «правят».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «над птицами в небе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; русское «И сказал» естественно сохраняет связь с предшествующим рассказом и его торжественный ритм.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово согласуется с глаголом в единственном числе и обозначает единого Бога.
- source_word: נַעֲשֶׂה
  choice: Сотворим
  rationale: Форма первого лица множественного числа имеет побудительно-совещательный оттенок. «Сотворим» сохраняет множественное число и уместно в контексте творения, не определяя, к кому обращена речь.
- source_word: אָדָם
  choice: человека
  rationale: 'Здесь אָדָם — собирательное единственное число: человек как человеческий род. Единственное «человека» сохраняет форму исходного текста, а последующее множественное «они» выявляет собирательный смысл.'
- source_word: בְּצַלְמֵנוּ
  choice: по нашему образу
  rationale: Предлог בְּ с צֶלֶם здесь выражает соответствие образцу; привычное русское сочетание точно и без излишнего толкования передаёт эту связь.
- source_word: כִּדְמוּתֵנוּ
  choice: по нашему подобию
  rationale: כְּ с דְּמוּת обозначает сходство или соответствие. Перевод сохраняет различие между «образом» и «подобием», не пытаясь богословски разграничить эти понятия.
- source_word: וְיִרְדּוּ
  choice: и пусть они владычествуют
  rationale: Глагол стоит в третьем лице множественного числа и имеет побудительное значение. «Пусть они владычествуют» сохраняет и грамматику, и смысл предоставленной человеку власти.
- source_word: בִדְגַת הַיָּם
  choice: над рыбами морскими
  rationale: Естественное русское соответствие еврейской конструкции «рыба моря» с собирательным значением.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: над птицами небесными
  rationale: עוֹף охватывает летающих существ, а הַשָּׁמַיִם буквально означает «небеса». В контексте перечня «птицы небесные» звучит естественно и возвышенно.
- source_word: וּבַבְּהֵמָה
  choice: над скотом
  rationale: בְּהֵמָה в данном перечне обозначает домашних наземных животных как класс; «скот» точно передаёт эту категорию.
- source_word: וּבְכָל הָאָרֶץ
  choice: над всей землёй
  rationale: В первой главе Бытия אֶרֶץ имеет всеобщий, а не местный смысл; «вся земля» сохраняет этот масштаб.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: над всяким пресмыкающимся, ползающим
  rationale: Повтор корня רמש передан сочетанием близких по смыслу слов, что сохраняет образ существ, передвигающихся у поверхности земли, и заметную повторность оригинала.
theological_decisions:
- issue: Множественное число в словах «Сотворим… по нашему образу, по нашему подобию»
  choice: Сохранить формы множественного числа, не называя в основном тексте адресата Божьей речи.
  alternative: Передать как внутреннее Божье решение, обращение к небесному совету либо прямое указание на Троицу.
  rationale: Еврейский текст последовательно употребляет первое лицо множественного числа, но сам стих не разъясняет адресата. Перевод сохраняет эту неоднозначность и не навязывает одно из исторических толкований.
- issue: Собирательное значение אָדָם и переход от единственного числа к множественному
  choice: Перевести «человека», сохранив затем «пусть они владычествуют».
  alternative: Перевести «человечество» или перестроить всё предложение в единственном числе.
  rationale: Резкий переход от собирательного единственного к грамматическому множественному присутствует в еврейском тексте и показывает, что речь идёт о человеческом роде. Его не следует сглаживать.
- issue: Характер власти человека над творением
  choice: Передать רדה как «владычествовать», не добавляя в основной текст оценки или способа осуществления этой власти.
  alternative: Пояснить как заботливое управление либо как неограниченное господство.
  rationale: Сам глагол обозначает осуществление власти, но в данном стихе не раскрывает всех её нравственных границ. Перевод не должен заранее разрешать этот богословско-этический вопрос.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом повествования о творении. Сохранены характерные для оригинала собирательное единственное число, последующий переход к множественному и повтор корня в заключительной части. Местоимения, относящиеся к Богу, написаны со строчной буквы как часть обычного современного издательского стиля, без изменения смысла.
