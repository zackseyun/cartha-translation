  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: ru
  text: И сотворил Бог человека по Своему образу[a]; по образу Божьему сотворил его; мужского и женского пола сотворил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество». Еврейское слово адам здесь стоит в единственном числе и собирательно обозначает весь человеческий род.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: сотворил
  rationale: «Сотворил» естественно для возвышенного повествования о Божьем творении и позволяет сохранить трёхкратное повторение еврейского глагола.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, согласование с глаголом в единственном числе указывает здесь на единого Бога.
- source_word: הָאָדָם
  choice: человека
  rationale: Единственное число представляет всё человечество; русское «человека» сохраняет грамматический переход от единственного «его» к множественному «их», не ограничивая смысл одним мужчиной.
- source_word: בְּצַלְמוֹ
  choice: по Своему образу
  rationale: Предлог ב при צֶלֶם допускает значение соответствия образу; возвратное притяжательное «Своему» недвусмысленно относит образ к Богу и естественно звучит по-русски.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: по образу Божьему
  rationale: Повтор слова «образ» сохраняет параллелизм и смысловое усиление оригинала.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение мужского рода единственного числа относится к הָאָדָם как к собирательно представленному человечеству.
- source_word: זָכָר וּנְקֵבָה
  choice: мужчиной и женщиной
  rationale: Такой перевод обозначает два пола применительно к людям и в современном русском звучит естественнее буквального субстантивированного «самцом и самкой»; творительный падеж передаёт состояние, в котором люди сотворены.
- source_word: אֹתָם
  choice: их
  rationale: Множественное местоимение сохраняет намеренный переход от человечества в единственном числе к человеческой множественности.
theological_decisions:
- issue: Передача אָדָם в контексте собирательно представленного человечества
  choice: человека
  alternative: человечество
  rationale: «Человека» сохраняет единственное число оригинала и последующий переход от «его» к «их», при этом в русском языке может обозначать человека как вид, то есть всё человечество.
- issue: Значение ב в выражениях об образе
  choice: по Своему образу / по образу Божьему
  alternative: в Своём образе / в образе Божьем
  rationale: «По образу» — естественное русское выражение соответствия образцу. Возможная смысловая оттенённость предлога не превращается в утверждение, будто человек сам является Божьим образом.
- issue: Передача половой пары זָכָר וּנְקֵבָה
  choice: мужчиной и женщиной
  alternative: мужского и женского пола
  rationale: Выбранная формулировка ясна для обычного читателя и сохраняет бинарную пару текста без внесения дополнительных антропологических выводов.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Трёхкратное «сотворил» и переход «человека — его — их» намеренно сохраняют структуру и напряжение еврейского текста.
