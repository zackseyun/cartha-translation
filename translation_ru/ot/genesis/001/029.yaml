  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: ru
  text: 'И сказал Бог: «Вот, Я дал вам всякое растение, производящее семя, какое есть на поверхности всей земли, и всякое дерево, на котором есть плод, дающий семя[a]. Это будет вам пищей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «на котором есть плод дерева, производящего семя». Возможное смысловое выражение: «плод, содержащий семя».'
    reason: Сохраняет близкую к еврейской конструкцию פְּרִי־עֵץ זֹרֵעַ זָרַע и отмечает возможное смысловое понимание без навязывания спорного синтаксического разбора.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественная для современного русского языка частица, привлекающая внимание к следующему за ней дарованию; сохраняет указательную силу еврейского слова без архаизации.
- source_word: נָתַתִּי
  choice: Я дал
  rationale: Перфект обозначает совершённое действие, результат которого сохраняет силу; русский прошедший вид «дал» естественно передаёт дарование в контексте завершения творения.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: всякое растение, производящее семя
  rationale: עֵשֶׂב обозначает растительность шире, чем русское «трава»; причастный оборот близко и понятно передаёт זֹרֵעַ זֶרַע.
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: какое есть на поверхности всей земли
  rationale: Сохраняет пространственный образ עַל־פְּנֵי и всеохватность כָּל, оставаясь естественным по-русски.
- source_word: כָּל הָעֵץ
  choice: всякое дерево
  rationale: Сочетание כָּל с существительным в единственном числе имеет распределительное значение, которому соответствует «всякое дерево».
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: на котором есть плод с семенами
  rationale: Передаёт основную мысль о плоде, содержащем семя, и избегает тяжёлого повтора «плод дерева»; более буквальная синтаксическая возможность отмечена в сноске.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Это будет вам пищей
  rationale: Единственное число «это» отражает еврейский собирательный субъект и естественно связывает оба перечисленных вида растительной пищи.
theological_decisions:
- issue: Объём первоначального пищевого дарования человеку
  choice: Передать только прямо названные растения и плодовые деревья, не добавляя богословских выводов о последующем или постоянном рационе.
  alternative: Истолковать стих как установление обязательного для всех времён исключительно растительного питания.
  rationale: Сам стих сообщает о даровании пищи в повествовании о творении, но не формулирует явно универсального запрета или неизменной нормы для всех последующих эпох.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «Я» в прямой речи Бога написано с прописной буквы по принятой русской религиозно-издательской традиции; синтаксис упрощён лишь там, где буквальное воспроизведение еврейской цепочки было бы неестественным.
