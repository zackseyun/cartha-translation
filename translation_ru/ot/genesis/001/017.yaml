  text: И поместил их Бог на небесном своде[a], чтобы они освещали землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в небесном пространстве».'
    reason: Лексическая альтернатива для רָקִיעַ; позволяет передать широкий пространственный смысл слова без однозначной конкретизации образа небесного свода.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: поместил
  rationale: Глагол נתן буквально означает «дать, положить, поставить»; в контексте размещения светил «поместил» естественно передаёт намеренное расположение.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения отсылает к светилам и звёздам предыдущего стиха.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя существительное имеет форму множественного числа, здесь оно согласуется с глаголом в единственном числе и обозначает единого Творца.
- source_word: בִּרְקִיעַ הַשָּׁמָיִם
  choice: на небесном своде
  rationale: רָקִיעַ обозначает распростёртое пространство или свод; устойчивое русское сочетание «небесный свод» сохраняет образ древнего текста и звучит естественно, не навязывая точной физической модели.
- source_word: לְהָאִיר
  choice: чтобы они освещали
  rationale: Каузативная форма глагола אור означает «давать свет, освещать». Личное «они» ясно соотносит действие со светилами.
- source_word: עַל הָאָרֶץ
  choice: землю
  rationale: В сочетании с русским глаголом «освещать» естественно употребляется прямое дополнение; смысл направленного на землю света сохраняется.
theological_decisions:
- issue: Космологический термин רָקִיעַ в повествовании о сотворении
  choice: небесный свод
  alternative: небесное пространство
  rationale: «Небесный свод» сохраняет образность и пространственный смысл исходного термина, не превращая его ни в специальное научное понятие, ни в конфессиональное утверждение о строении мира.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «поместил их Бог» сохраняет повествовательный ритм еврейского текста, оставаясь понятной современному читателю.
