  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: ru
  text: И земля была бесформенной и пустой, и тьма была над поверхностью бездны, и Дух Божий[a] парил над поверхностью вод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер от Бога» или «ветер Божий».'
    reason: Еврейское רוּחַ אֱלֹהִים допускает значения «Дух Божий», «ветер от Бога» и «ветер Божий».
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: И земля
  rationale: Союз ו сохраняется как «и», а הָאָרֶץ в данном контексте передаётся обычным словом «земля».
- source_word: הָיְתָה
  choice: была
  rationale: Форма глагола היה здесь естественнее всего выражает состояние, а не переход в новое состояние; перевод «стала» грамматически возможен в иных контекстах, но здесь не требуется.
- source_word: תֹהוּ וָבֹהוּ
  choice: бесформенной и пустой
  rationale: Сочетание описывает неустроенность и пустоту. Этот вариант сохраняет парность выражения и понятен современному читателю, не прибегая к архаическому «безвидна и пуста».
- source_word: וְחֹשֶׁךְ
  choice: и тьма
  rationale: Прямое соответствие еврейскому существительному с сохранением связи между частями стиха.
- source_word: עַל־פְּנֵי
  choice: над поверхностью
  rationale: Передаёт пространственный образ буквального «над лицом» естественным современным русским выражением.
- source_word: תְהוֹם
  choice: бездна
  rationale: Слово обозначает водную глубину, первозданную пучину; «бездна» кратко передаёт образ, не добавляя мифологических толкований.
- source_word: וְרוּחַ אֱלֹהִים
  choice: а Дух Бога[a]
  rationale: רוּחַ может означать «дух», «ветер» или «дыхание». В основном тексте выбран сильный и традиционно признанный личностный смысл, тогда как возможное метеорологическое прочтение сохранено в сноске. Союз «а» естественно обозначает переход от неподвижной тьмы к действию Духа, не меняя смысла связи.
- source_word: מְרַחֶפֶת
  choice: парил
  rationale: Причастие выражает продолжающееся движение над поверхностью; «парил» передаёт это значение кратко и естественно.
- source_word: הַמָּיִם
  choice: вод
  rationale: Форма множественного числа сохраняет образ первозданных вод и соответствует еврейскому тексту.
theological_decisions:
- issue: Следует ли переводить הָיְתָה как состояние («была») или как изменение состояния («стала»)
  choice: была
  alternative: стала
  rationale: Стих описывает состояние земли на данном этапе повествования. Еврейский текст не требует идеи предшествующего изменения или разрушения, поэтому перевод не вводит такого богословского построения.
- issue: Означает ли וְרוּחַ אֱלֹהִים Духа Бога или ветер от Бога
  choice: Дух Бога
  alternative: ветер от Бога; Божий ветер
  rationale: Еврейское выражение действительно допускает как личностное, так и метеорологическое понимание. Основной текст следует сильному традиционному прочтению, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаической интонацией. Синтаксис сохраняет последовательность образов оригинала. Маркер сноски поставлен непосредственно после неоднозначного выражения «Дух Бога».
