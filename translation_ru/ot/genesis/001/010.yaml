  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: ru
  text: И назвал Бог сушу Землёй[a], а собрание вод назвал Морями. И увидел Бог, что это хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «землёй» со строчной буквы. Еврейское אֶרֶץ может означать «земля» или «суша», а здесь также может пониматься как имя, данное суше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: назвал
  rationale: В данном контексте глагол обозначает присвоение имени; «назвал» естественно передаёт обе параллельные формулы стиха.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя существительное имеет форму множественного числа, здесь оно согласуется с глаголами в единственном числе и обозначает единого Творца.
- source_word: לַיַּבָּשָׁה
  choice: сушу
  rationale: «Суша» — точное и естественное русское обозначение сухой земли в противопоставлении собранным водам.
- source_word: אֶרֶץ
  choice: Землёй
  rationale: В формуле наречения слово выступает как данное суше имя; прописная буква обозначает эту функцию, а сноска сохраняет возможность понимания как нарицательного «земля».
- source_word: מִקְוֵה
  choice: собрание
  rationale: Существительное обозначает собранную массу вод; «собрание вод» близко к форме и смыслу еврейского выражения.
- source_word: הַמַּיִם
  choice: вод
  rationale: Форма множественного числа и возвышенный стиль исходного текста естественно передаются русским множественным числом.
- source_word: יַמִּים
  choice: Морями
  rationale: Множественное число сохраняет форму источника, а прописная буква подчёркивает параллельный акт наречения.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Это обычное значение глагола и устойчивый повторяющийся оборот повествования о творении.
- source_word: כִּי טוֹב
  choice: что это хорошо
  rationale: Формулировка сохраняет простоту и смысловую широту повторяющейся оценки, не сводя её лишь к красоте или полезности.
theological_decisions:
- issue: Считать ли אֶרֶץ нарицательным словом или именем, данным суше
  choice: Передать как имя «Земля» с прописной буквы
  alternative: Передать как нарицательное «земля» со строчной буквы
  rationale: Контекст прямо описывает наречение, поэтому прописная буква уместно отмечает функцию имени. Сноска предупреждает, что еврейская форма допускает и нарицательное понимание и не обязательно обозначает планету в современном научном смысле.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Порядок слов «назвал Бог» и повтор глагола сохраняют композицию оригинала; архаические формы не используются.
