  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: ru
  text: 'И сказал Бог: «Да будет свет»[a]. И был свет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть будет свет». Еврейская форма выражает волю или повеление.'
    reason: Передаёт альтернативный русский способ выразить еврейский юссив יְהִי, не подменяя глагол «сказал» интерпретирующим «повелел».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма wayyiqtol от אמר продолжает последовательность повествования; союз «и» сохраняет связь с предыдущим рассказом, не добавляя более узкого оттенка «тогда» или «затем».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Существительное множественного по форме числа согласовано здесь с глаголом в единственном числе и обозначает единого Творца; нормативный русский эквивалент — «Бог».
- source_word: יְהִי
  choice: Да будет
  rationale: Юссив от היה выражает волю или повеление. «Да будет» естественно передаёт торжественную формулу творческого повеления и сохраняет её смысловую ёмкость.
- source_word: אוֹר
  choice: свет
  rationale: Основное значение слова — «свет»; контекст не требует уточнять его источник или понимать его метафорически.
- source_word: וַיְהִי
  choice: И стал
  rationale: Форма wayyiqtol от היה сообщает о непосредственном осуществлении произнесённого. «И стал свет» близко отражает повтор глагола היה в повелении и исполнении, а также возникновение света.
- source_word: אוֹר
  choice: свет
  rationale: Повтор слова «свет» сохранён вслед за еврейским текстом, подчёркивая точное исполнение Божьего повеления.
theological_decisions:
- issue: Передача Божьего творческого повеления
  choice: Да будет свет!
  alternative: Пусть будет свет; Будь свет
  rationale: Еврейский юссив выражает Божью волю или действенное повеление. Формула «Да будет свет» сохраняет как торжественность, так и грамматическую неоднозначность между волеизъявлением и приказом, не вводя дополнительных богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской формулой «Да будет». Синтаксический параллелизм и повтор слова «свет» сохранены. Восклицательный знак передаёт силу повеления, не добавляя отдельного смыслового утверждения.
