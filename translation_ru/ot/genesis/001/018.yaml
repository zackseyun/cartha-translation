base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: ru
  text: и управлять днём и ночью, и отделять свет от тьмы[a]. Бог увидел, что это было хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «различать между светом и тьмой».'
    reason: Лексема בדל может обозначать не только отделение, но и проведение различия; примечание сохраняет эту смысловую возможность.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: и владычествовать над
  rationale: Инфинитив с לְ продолжает ряд назначений светил из предыдущего стиха. «Владычествовать над» сохраняет значение управления у משל и возвышенный, но понятный регистр, не приписывая светилам божественность или независимую власть.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: над днём и ночью
  rationale: Предлог בְ при משל передан русским управлением «над». Парная конструкция «днём и ночью» естественна и сохраняет симметрию еврейского текста; повторять «над» перед «ночью» по-русски необязательно.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: и отделять
  rationale: בדל обозначает установление разделения или различия. «Отделять» поддерживает повторяющийся язык рассказа о творении и сохраняет конкретность действия.
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: свет от тьмы
  rationale: При глаголе «отделять» русская конструкция «одно от другого» естественно передаёт еврейское בֵּין ... וּבֵין, не воспроизводя его механически.
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: И увидел Бог
  rationale: Сохраняется последовательный повествовательный ритм главы и характерный для библейского русского порядка слов, остающийся ясным современному читателю.
- source_word: כִּי טוֹב
  choice: что это хорошо
  rationale: '«Хорошо» сохраняет широкое значение טוֹב: благость, уместность и соответствие сотворённому порядку. Местоимение «это» естественно отсылает ко всему описанному результату.'
theological_decisions:
- issue: Роль небесных светил в сотворённом порядке
  choice: Светила поставлены владычествовать над днём и ночью и отделять свет от тьмы как части установленного Богом порядка.
  alternative: Передать משל менее образно как «управлять» либо истолковать владычество светил как самостоятельную или божественную власть.
  rationale: 'Формулировка сохраняет сильный язык еврейского текста, но не добавляет представления о светилах как божествах или независимых силах: Бог остаётся Творцом и тем, кто оценивает сотворённое.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Начальное «и» сохранено, поскольку стих синтаксически продолжает перечень назначений светил из Быт. 1:17. Маркер примечания поставлен после той части фразы, к которой относится лексическая альтернатива.
