base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: ru
  text: 'И благословил их Бог, сказав: «Плодитесь и размножайтесь, и наполняйте воды в морях, и птицы[a] пусть размножаются на земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «летающие существа»; еврейское עוֹף может обозначать летающих существ в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Порода piel глагола ברך здесь означает дарование благословения; традиционный русский эквивалент точно передаёт действие Бога.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к морским существам и птицам, сотворённым в предыдущем стихе.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В Бытии 1 это существительное согласуется с глаголом в единственном числе и обозначает единого Творца.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Стандартная древнееврейская конструкция вводит прямую речь; деепричастие естественно звучит в современном литературном русском.
- source_word: פְּרוּ
  choice: плодитесь
  rationale: Императив от פרה выражает плодовитость и продолжение рода; «плодитесь» сохраняет исходный образ и устойчивую библейскую формулу.
- source_word: וּרְבוּ
  choice: размножайтесь
  rationale: Императив от רבה обозначает численное умножение; в данном контексте естественный русский эквивалент — «размножайтесь».
- source_word: וּמִלְאוּ
  choice: наполняйте
  rationale: Императив от מלא означает «наполнять»; несовершенный вид по-русски естественно передаёт направленное к результату повеление.
- source_word: אֶת הַמַּיִם
  choice: воды
  rationale: Форма מַיִם грамматически множественная; «воды» сохраняет образность и возвышенный регистр рассказа о сотворении.
- source_word: בַּיַּמִּים
  choice: в морях
  rationale: Множественное число יַמִּים прямо передано русским множественным числом.
- source_word: וְהָעוֹף
  choice: а птицы
  rationale: Собирательное עוֹף может обозначать летающих существ шире, но в контексте наиболее естественно «птицы»; союз «а» ясно обозначает переход к другой группе без усиленного противопоставления.
- source_word: יִרֶב
  choice: пусть размножаются
  rationale: Юссивная форма от רבה имеет волитивный смысл; конструкция с «пусть» сохраняет оттенок благословения-повеления, а не простого предсказания.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אָרֶץ обозначает земную область обитания; «на земле» — прямой и естественный эквивалент.
theological_decisions:
- issue: Характер речи Бога в благословении
  choice: Императивы переданы повелительными формами, а юссив — конструкцией «пусть размножаются».
  alternative: 'Передать все формы как прямые повеления либо последнюю форму как простое будущее: «птицы будут размножаться».'
  rationale: Древнееврейский текст выражает благословение через императивы и юссив. Такой перевод сохраняет напряжение между даруемым благословением, повелением и волеизъявлением, не сводя речь ни к одному лишь приказу, ни к предсказанию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской ритмикой. Порядок слов «благословил их Бог» сохраняет торжественный тон, оставаясь понятным; лексика не архаизирована.
