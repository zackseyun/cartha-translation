  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: ru
  text: 'И сказал Бог: «Пусть земля произведёт живых существ[a] по их родам: скот, ползучих животных и диких зверей земли по их родам». И стало так.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живую душу» (евр. не́феш); здесь это выражение означает живое существо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: пусть земля произведёт
  rationale: Каузативная форма породы хифиль со значением повеления передаёт Божье веление земле вызвать к существованию живых существ; «произведёт» естественно и ясно выражает этот смысл по-русски.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте сотворения имеется в виду земная область мира, а не отдельная страна или территория.
- source_word: נֶפֶשׁ חַיָּה
  choice: живых существ
  rationale: Сочетание обозначает одушевлённые живые создания; множественное число естественно передаёт собирательное значение, раскрываемое последующим перечислением.
- source_word: לְמִינָהּ
  choice: по их родам
  rationale: Форма единственного числа относится к собирательному обозначению животных, тогда как русский перевод во множественном числе естественно выражает распределение по различным родам.
- source_word: בְּהֵמָה
  choice: скот
  rationale: Слово обозначает крупных наземных животных, прежде всего домашних; «скот» кратко и привычно передаёт эту категорию и сохраняет её отличие от диких зверей.
- source_word: רֶמֶשׂ
  choice: ползучих животных
  rationale: Термин охватывает мелких существ, передвигающихся у поверхности земли; перевод сохраняет широкое значение и не ограничивает его современным зоологическим классом пресмыкающихся.
- source_word: חַיְתוֹ אֶרֶץ
  choice: диких зверей земли
  rationale: Сочетание обозначает диких наземных животных в отличие от скота; «звери земли» также сохраняет характерную для главы торжественную формулу.
- source_word: וַיְהִי כֵן
  choice: И стало так
  rationale: Краткая формула исполнения Божьего веления передана точно и с сохранением ритма повествования.
theological_decisions:
- issue: Передача נֶפֶשׁ без привнесения позднейшего учения о нематериальной душе
  choice: живых существ
  alternative: живых душ
  rationale: В данном контексте נֶפֶשׁ חַיָּה называет животных как живых существ и само по себе не утверждает определённой антропологической или метафизической доктрины. Буквальная возможность отражена в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом повествования. Сохранены повтор «по их родам» и различие между скотом, ползучими животными и дикими зверями; узкоспециальная зоологическая терминология не используется.
