base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: ru
  text: 'И произвела земля растительность: растения, дающие семя по своим родам[a], и деревья, приносящие плод, в котором есть семя, по своим родам. И увидел Бог, что это хорошо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по его роду». Здесь «род» означает сотворённую категорию, а не современный биологический термин «вид».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: произвела
  rationale: Каузативная форма глагола יצא описывает землю как выводящую растительность наружу; «произвела» естественно передаёт появление растительности по Божьему повелению, не добавляя идеи самостоятельного творения.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В космическом контексте Бытия 1 речь идёт о земле, а не только об отдельной территории.
- source_word: דֶּשֶׁא
  choice: растительность
  rationale: Слово обозначает свежую зелёную поросль в широком смысле, а не исключительно траву; «растительность» сохраняет собирательное значение.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: растения, дающие семя
  rationale: Передаёт собирательное עֵשֶׂב и причастное описание способности производить семя современным и ясным русским языком.
- source_word: לְמִינֵהוּ
  choice: по своим родам
  rationale: מין означает род или категорию существ, но не обязательно современный биологический вид. Множественное согласование естественно при русских «растения» и «деревья».
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: и деревья, приносящие плод
  rationale: Единственное עֵץ употреблено собирательно. «Приносящие плод» — естественное русское соответствие причастной конструкции.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: семя которых в нём
  rationale: Формулировка сохраняет связь семени с деревьями и местоименное указание «в нём», естественно относимое к плоду, не разворачивая краткую еврейскую конструкцию в более узкое толкование.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: И увидел Бог, что это хорошо
  rationale: Сохраняет повторяющуюся оценочную формулу рассказа о сотворении и естественный для русского языка порядок слов.
theological_decisions:
- issue: Передача сотворённых категорий без внесения современной биологической таксономии
  choice: по своим родам
  alternative: по своим видам
  rationale: Еврейское מין обозначает род или категорию в рамках древнего текста и не является точным эквивалентом современного научного термина «вид».
- issue: Связь семени с деревом и плодом
  choice: семя которых в нём
  alternative: плоды, в которых их семя
  rationale: Еврейский текст буквально сохраняет дерево в единственном числе и говорит «его семя в нём». Выбранная формулировка остаётся близкой к этой структуре и позволяет местоимению «в нём» указывать на плод, не устраняя полностью краткость исходной связи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Двоеточие поясняет, какие формы растительности произвела земля; архаизмы и научно-техническая терминология исключены.
