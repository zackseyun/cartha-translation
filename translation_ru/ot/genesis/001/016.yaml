base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: ru
  text: 'И создал Бог два великих светила: большее светило — чтобы управлять днём, и меньшее светило — чтобы управлять ночью, и звёзды.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: создал
  rationale: Глагол עשה обычно означает «делать, создавать». В данном контексте «создал» естественно продолжает повествование о творении и не привносит значения «назначил».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Согласование с глаголом в единственном числе указывает здесь на единого Бога; это стандартная русская передача.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: два великих светила
  rationale: «Светила» точно передаёт מָאוֹר как небесные источники света, а «великих» прямо отражает גְּדֹלִים и сохраняет возвышенный регистр.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: большее светило
  rationale: В парном противопоставлении с меньшим светилом сравнительная форма по-русски естественно выражает соотношение, заложенное в גדול/קטן.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: чтобы управлять днём
  rationale: מֶמְשֶׁלֶת обозначает власть или управление; целевая конструкция с «чтобы» ясно и естественно передаёт функцию светила.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: меньшее светило
  rationale: Передача сохраняет симметричное противопоставление большему светилу и не сводит קָטֹן к абсолютному «малое».
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: чтобы управлять ночью
  rationale: Та же синтаксическая и смысловая конструкция передана последовательно.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: а также звёзды
  rationale: Союз и показатель прямого дополнения вводят ещё один объект действия «создал». «А также» естественно передаёт присоединительный характер краткой заключительной фразы.
theological_decisions:
- issue: Обозначение небесных тел без слов «солнце» и «луна»
  choice: Сохранены выражения «большее светило» и «меньшее светило».
  alternative: «солнце» и «луна»
  rationale: В еврейском тексте употреблено מָאוֹר («светило»), а не обычные названия солнца и луны. Сохранение исходной лексики не вводит отсутствующих в стихе наименований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Парные конструкции сохранены, при этом порядок слов и целевые обороты сделаны естественными для современного читателя.
