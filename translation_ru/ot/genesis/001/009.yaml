base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: ru
  text: 'И сказал Бог: «Пусть воды, которые под небесами[a], соберутся в одно место, и пусть покажется суша». И стало так.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под небом». Древнееврейское שָׁמַיִם в зависимости от контекста может означать «небо» или «небеса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательный вав продвигает повествование; традиционная русская конструкция сохраняет связность и торжественную простоту текста, не уточняя сверх необходимого временную последовательность.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Существительное употреблено с глаголом в единственном числе и в контексте Бытия 1 обозначает единого Бога-Творца.
- source_word: יִקָּווּ
  choice: пусть ... соберутся
  rationale: Юссив выражает повеление или волю Бога; возвратная форма естественно передаёт сосредоточение вод в одном месте.
- source_word: הַמַּיִם
  choice: воды
  rationale: Сохраняется множественная форма древнееврейского слова и возвышенная лексика повествования о творении.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: которые под небесами
  rationale: Придаточная конструкция ясно связывает указание местоположения с водами. «Небеса» сохраняет лексику контекста, а возможное значение «небо» отмечено в сноске.
- source_word: אֶל מָקוֹם אֶחָד
  choice: в одно место
  rationale: Предлог «в» передаёт направленность движения и сосредоточение; числительное «одно» явно сохраняет אֶחָד.
- source_word: וְתֵרָאֶה
  choice: и пусть покажется
  rationale: Нифаль в форме юссива продолжает ряд повелений; «покажется» естественно передаёт появление ранее скрытой суши.
- source_word: הַיַּבָּשָׁה
  choice: суша
  rationale: «Суша» — точный и естественный русский термин для открывшейся сухой земли в противопоставлении водам и соответствует ближайшему контексту стиха 10.
- source_word: וַיְהִי כֵן
  choice: И стало так
  rationale: Краткая формула точно и естественно передаёт исполнение Божьего повеления и подходит для последовательного употребления в Бытии 1.
theological_decisions:
- issue: Космологическое значение שָׁמַיִם в рассказе о творении
  choice: небесами
  alternative: небом
  rationale: Множественное «небеса» сохраняет форму и возвышенный регистр древнееврейского текста, но не закрепляет подробную космологическую схему; контекстуально возможное «небо» сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным и слегка возвышенным ритмом рассказа о творении. Синтаксис остаётся понятным обычному читателю; повтор «пусть» сохраняет параллелизм двух божественных повелений.
