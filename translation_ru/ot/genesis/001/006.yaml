  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: ru
  text: 'И сказал Бог: «Да будет простор[a] посреди вод, и пусть он отделяет одни воды от других[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «твердь», «свод», «купол» или «небосвод». Еврейское רָקִיעַ обозначает нечто распростёртое; варианты перевода по-разному отражают древние представления об устройстве мира.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «быть разделяющим между водами и водами», то есть отделять одну водную область от другой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с последовательным וַ־ продвигает повествование; «И сказал» сохраняет характерный ход еврейского рассказа, не уточняя временную связь сверх текста.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя существительное имеет форму множественного числа, здесь оно согласовано с глаголом в единственном числе и обозначает единого Творца.
- source_word: יְהִי
  choice: Да будет
  rationale: Юссив от היה выражает творческое повеление; эта формула естественна для возвышенного современного русского языка.
- source_word: רָקִיעַ
  choice: пространство
  rationale: Слово обозначает нечто распростёртое или протянутое. «Пространство» передаёт основную пространственную идею, не закрепляя в основном тексте спорную конкретную модель — твёрдый свод или купол.
- source_word: בְּתוֹךְ
  choice: посреди
  rationale: Кратко и естественно передаёт положение внутри окружающих вод.
- source_word: הַמָּיִם
  choice: вод
  rationale: Множественная форма сохраняет образ первозданных вод и хорошо сочетается с предлогом «посреди».
- source_word: וִיהִי מַבְדִּיל
  choice: и да отделяет оно
  rationale: Продолжает повелительное значение предыдущего юссива, а местоимение ясно указывает на созданное пространство; причастная конструкция естественно передана личным глаголом.
- source_word: בֵּין מַיִם לָמָיִם
  choice: одни воды от других
  rationale: Это естественный русский оборот после глагола «отделять»; он передаёт различение двух водных областей, тогда как буквальное строение отмечено в сноске.
theological_decisions:
- issue: Передача רָקִיעַ в связи с древней картиной мира
  choice: пространство
  alternative: твердь; свод; купол; небосвод
  rationale: Текст говорит о созданном Богом разделителе посреди вод. Выбранное слово сохраняет идею чего-то распростёртого, не устраняя неоднозначность и не навязывая в основном тексте определённую реконструкцию древней космологии; более конкретные варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Формула «Да будет» сохранена как естественное выражение божественного повеления; архаичное «твердь» вынесено в сноску. Маркеры сносок поставлены непосредственно после тех выражений, которые они поясняют.
