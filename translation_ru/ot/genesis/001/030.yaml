  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: ru
  text: А всем земным животным, всем небесным птицам и всему ползающему по земле, в которых есть живое существо[a], — всю зелёную растительность в пищу. И стало так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в которых есть живая душа»; то есть живое существо. Это не то же выражение, что «дыхание жизни» в Быт. 2:7.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: земным животным
  rationale: חַיָּה здесь обозначает наземных животных как категорию. «Животные» в современном русском естественнее и шире, чем «звери», не добавляя значения «дикие».
- source_word: עוֹף הַשָּׁמַיִם
  choice: небесным птицам
  rationale: עוֹף в данном контексте естественно передаётся словом «птицы», а «небесным» сохраняет образ принадлежности к небесному пространству.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: всему ползающему по земле
  rationale: Причастие רוֹמֵשׂ передаёт движение ползающих и мелких наземных существ; субстантивированное «всему ползающему» сохраняет собирательную форму оригинала.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: в котором есть живая душа
  rationale: Это близкая передача נֶפֶשׁ חַיָּה без смешения с иным выражением נִשְׁמַת חַיִּים, «дыхание жизни». Формулировка сохраняет древнееврейскую антропологическую неоднозначность; пояснение дано в сноске.
- source_word: כָּל יֶרֶק עֵשֶׂב
  choice: всю зелень растений
  rationale: Сочетание יֶרֶק עֵשֶׂב обозначает зелёную растительность. «Зелень растений» сохраняет оба компонента и звучит современнее, чем традиционное «зелёная трава».
- source_word: לְאָכְלָה
  choice: в пищу
  rationale: Кратко и точно выражает целевое значение конструкции с לְ.
- source_word: וַיְהִי כֵן
  choice: И стало так
  rationale: Естественная русская формула исполнения, точно передающая наступление названного положения вещей.
theological_decisions:
- issue: Значение נֶפֶשׁ חַיָּה применительно к животным
  choice: «живая душа» в основном тексте с пояснением
  alternative: «живое существо»
  rationale: Буквальная конструкция показывает, что נֶפֶשׁ חַיָּה относится здесь и к животным, но сама по себе не утверждает позднейшего философского понимания бессмертной нематериальной души. Вариант «дыхание жизни» отвергнут, поскольку соответствует другому еврейскому выражению.
- issue: Эллипсис сказуемого в стихе 30
  choice: 'сохранена именная конструкция с тире: «всю зелень растений в пищу»'
  alternative: добавить «Я даю» из стиха 29
  rationale: В еврейском тексте стиха 30 глагол подразумевается из предыдущего контекста, но не повторяется. Русская эллиптическая конструкция остаётся понятной и не вводит отсутствующего слова.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаичной библейской интонацией. Параллельные дательные конструкции и итоговая формула сохранены; тире помогает ясно передать отсутствующее в еврейском тексте сказуемое.
