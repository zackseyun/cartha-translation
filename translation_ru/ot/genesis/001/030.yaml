- from: А всем земным животным, всем небесным птицам и всему ползающему по земле, в котором есть живая душа[a], — всю зелень растений в пищу. И стало так.
  to: А всем земным животным, всем небесным птицам и всему ползающему по земле, в которых есть живое существо[a], — всю зелёную растительность в пищу. И стало так.
