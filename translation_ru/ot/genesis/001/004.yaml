  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: ru
  text: И увидел Бог, что свет хорош, и отделил[a] Бог свет от тьмы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разделил»; еврейский глагол может также означать проведение различия между двумя вещами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Глагол ראה в повествовательной форме естественно передаётся как «увидел»; в данном контексте слово допускает также оценочный оттенок, не требуя его отдельного выражения.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В Бытии 1 существительное множественной формы согласуется с глаголами в единственном числе и обозначает единого Творца.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель прямого дополнения не имеет отдельного соответствия в русском языке; его функция передаётся синтаксисом.
- source_word: הָאוֹר
  choice: свет
  rationale: 'Определённость, выраженная артиклем, в русском языке понятна из контекста: речь идёт о только что сотворённом свете.'
- source_word: כִּי
  choice: что
  rationale: Здесь כִּי вводит содержание восприятия Бога; русское «что» естественно передаёт эту синтаксическую связь.
- source_word: טוֹב
  choice: хорош
  rationale: טוֹב — обычное оценочное слово со значением «хороший»; краткая форма «хорош» естественна после «увидел, что» и не сужает смысл до приятности или полезности.
- source_word: וַיַּבְדֵּל
  choice: отделил
  rationale: בדל означает отделять, разделять или проводить различие. «Отделил» ясно звучит в контексте упорядочения творения и сохраняет неопределённость относительно характера этого отделения.
- source_word: בֵּין ... וּבֵין
  choice: свет от тьмы
  rationale: Буквальная конструкция «между… и между…» после русского глагола «отделил» естественно передаётся моделью «одно от другого».
- source_word: הַחֹשֶׁךְ
  choice: тьмы
  rationale: Определённость следует из контекста; родительный падеж обусловлен конструкцией «отделил… от…».
theological_decisions:
- issue: Повтор подлежащего אֱלֹהִים в обеих частях стиха
  choice: 'Сохранить повтор: «увидел Бог… и отделил Бог…»'
  alternative: 'Во второй части употребить местоимение или опустить подлежащее: «и Он отделил…» / «и отделил…»'
  rationale: Еврейский текст явно повторяет «Бог». Сохранение повтора передаёт ритм и акцент оригинала, не добавляя толкования.
- issue: Характер отделения света от тьмы
  choice: Передать глаголом «отделил», не уточняя, было ли отделение пространственным, временным или понятийным
  alternative: «разделил» или «провёл различие между»
  rationale: Текст утверждает само отделение, но не объясняет его механизм; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной повествовательной инверсии и повтора имени «Бог». Формулировка ясна для широкого читателя и близка к структуре еврейского текста.
