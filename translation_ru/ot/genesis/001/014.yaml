base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: ru
  text: 'И сказал Бог: «Пусть будут светила на небесном своде[a], чтобы отделять день от ночи; и пусть они служат знамениями, а также для определения назначенных времён[b], дней и лет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на небесном пространстве». Еврейское רָקִיעַ обозначает распростёртое пространство, воспринимаемое как небесный свод.'
    reason: лексическая альтернатива
  - marker: b
    text: 'Или: «времена года». Еврейское מוֹעֲדִים означает назначенные времена и в других контекстах может также обозначать установленные праздничные сроки.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: מְאֹרֹת
  choice: светила
  rationale: Существительное обозначает источники света. Русское «светила» естественно называет небесные светящие тела и точнее, чем общее «светы».
- source_word: רָקִיעַ
  choice: свод
  rationale: В данном контексте слово обозначает распростёртое небесное пространство. «Небесный свод» сохраняет образность древнееврейского текста и при этом понятно современному читателю.
- source_word: הַשָּׁמַיִם
  choice: небесный
  rationale: В сочетании בִּרְקִיעַ הַשָּׁמַיִם родительный оборот естественно передаётся по-русски прилагательным «небесный».
- source_word: לְהַבְדִּיל
  choice: чтобы отделять
  rationale: Инфинитив выражает назначение светил и продолжает повторяющийся в главе мотив разделения.
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: день от ночи
  rationale: Это естественное русское управление при глаголе «отделять», передающее еврейскую конструкцию «между… и между…».
- source_word: לְאֹתֹת
  choice: служат знамениями
  rationale: אוֹת может обозначать знак или указатель. «Знамения» сохраняет широту и возвышенный регистр слова, не уточняя природу этих знаков.
- source_word: לְמוֹעֲדִים
  choice: указывают назначенные времена
  rationale: מוֹעֲדִים означает установленные или назначенные времена и в иных контекстах может включать праздники. Глагол «указывают» естественно раскрывает функцию светил в русском предложении, не сужая значение до сезонов или праздников.
- source_word: לְיָמִים וְשָׁנִים
  choice: дни и годы
  rationale: Прямое и ясное обозначение названных в еврейском тексте единиц времени; общая конструкция «пусть они служат… указывают…» передаёт повторяемое לְ.
- source_word: יְהִי ... וְהָיוּ
  choice: Пусть будут… и пусть они служат
  rationale: Волевое «пусть» сохраняет форму божественного повеления; «служат» идиоматично передаёт назначение, выраженное וְהָיוּ לְ.
theological_decisions:
- issue: Значение מוֹעֲדִים в повествовании о сотворении
  choice: широкое значение «назначенные времена»
  alternative: «времена года» или «праздники»
  rationale: Контекст говорит о космическом упорядочении времени. Выбранный вариант сохраняет возможную связь с позднейшим употреблением слова для праздничных сроков, но не навязывает здесь исключительно календарно-культовый смысл.
- issue: Функция небесных светил как אֹתֹת
  choice: «знамения» без дальнейшего пояснения
  alternative: «знаки» или конкретизация как календарные указатели
  rationale: Исходный текст не разъясняет природу знамений. Перевод сохраняет эту смысловую открытость и не вводит ни астрологического, ни исключительно календарного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет торжественную формулу божественного повеления, но избегает архаизмов. Перечень функций светил слегка перестроен ради естественности русского языка при сохранении всех смысловых элементов оригинала.
