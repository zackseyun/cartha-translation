  text: В начале, когда Бог сотворил небеса и землю[a] —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: В начале, когда … сотворил
  rationale: Форма без артикля בְּרֵאשִׁית перед личной формой глагола естественно допускает прочтение как зависимого обстоятельственного оборота времени. «В начале» сохраняет лексическое звучание רֵאשִׁית и традиционную связь с еврейским названием книги, а «когда» ясно передаёт синтаксическую зависимость.
- source_word: בָּרָא
  choice: сотворил
  rationale: בָּרָא — обычный библейский глагол для Божьего творения. «Сотворил» точно и достойно передаёт его здесь, не уточняя способ творения сверх сказанного в тексте.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя אֱלֹהִים имеет форму множественного числа, здесь оно согласовано с глаголом единственного числа בָּרָא и обозначает единого Бога.
- source_word: אֵת
  choice: не передано отдельным словом
  rationale: אֵת служит показателем определённого прямого дополнения и не имеет отдельного соответствия в русском языке; его функция выражена падежом и порядком слов.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Множественная форма «небеса» отражает еврейское слово и вместе с «землёй» образует всеохватную пару, обозначающую весь сотворённый мир.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В сочетании с «небесами» אָרֶץ означает землю как часть космической целостности, а не отдельную страну или территорию.
theological_decisions:
- issue: Синтаксис начального высказывания
  choice: 'Зависимый временной оборот: «В начале, когда Бог сотворил небеса и землю…»'
  alternative: 'Самостоятельное предложение: «В начале Бог сотворил небеса и землю».'
  rationale: Отсутствие артикля у בְּרֵאשִׁית и следующая за ним личная форма בָּרָא позволяют и в данном контексте поддерживают прочтение стиха как временного введения, ведущего к главному предложению в стихе 3. Традиционное самостоятельное прочтение широко засвидетельствовано историей перевода и потому сохранено в сноске. Выбор синтаксиса не используется для разрешения более широкого богословского вопроса о творении из ничего.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. «Сотворил» сохраняет привычный высокий регистр без архаизации. Незавершённость временного оборота обозначена тире, поскольку стих синтаксически продолжается далее.
