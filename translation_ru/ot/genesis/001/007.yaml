base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: ru
  text: И сделал Бог пространство[a], и отделил воды под пространством от вод над пространством. И стало так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «твердь» (традиционный перевод); возможно также: «свод».'
    reason: 'Лексема רָקִיעַ допускает разные способы передачи: она связана с представлением о чём-то распростёртом, но сам стих не уточняет однозначно его вещественность или форму.'
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: создал
  rationale: Глагол עשה означает «делать, создавать». В контексте сотворения «создал» звучит естественно и не привносит более узкого значения «сформировал».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В Бытии 1 существительное אֱלֹהִים с глаголом в единственном числе обозначает единого Бога-Творца; «Бог» — точный и общепринятый русский эквивалент.
- source_word: הָרָקִיעַ
  choice: пространство
  rationale: רָקִיעַ обозначает нечто распростёртое или протянутое. «Пространство» передаёт основную пространственную идею понятным современным языком, не закрепляя однозначно представление о твёрдой оболочке или куполообразной форме; традиционный и иной возможный варианты указаны в сноске.
- source_word: וַיַּבְדֵּל
  choice: отделил
  rationale: Глагол בדל означает «отделять, разделять». «Отделил» естественно сочетается с конструкцией «воды… от вод…» и сохраняет тему упорядочивающего разделения в Бытии 1.
- source_word: בֵּין ... וּבֵין
  choice: … от …
  rationale: Еврейская парная конструкция выражает разграничение двух сторон. При русском глаголе «отделил» конструкция «одно от другого» является естественным эквивалентом.
- source_word: הַמַּיִם
  choice: воды
  rationale: Форма множественного числа «воды» сохраняет образность и возвышенный повествовательный строй еврейского текста.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: воды под пространством
  rationale: Сжатая русская конструкция точно передаёт вертикальное положение вод снизу, не требуя отсутствующей в еврейском тексте связки.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: воды над пространством
  rationale: «Над» ясно передаёт מֵעַל и образует естественную пространственную противоположность слову «под».
- source_word: וַיְהִי כֵן
  choice: И стало так
  rationale: Формула передаёт осуществление Божьего повеления и сохраняет повторяющийся рефрен главы; по-русски «И стало так» звучит естественно и торжественно.
theological_decisions:
- issue: Передача רָקִיעַ в повествовании о сотворении и связанные с ней космологические представления
  choice: пространство
  alternative: «твердь»; «свод»
  rationale: «Пространство» сохраняет идею распростёртости и не заставляет текст однозначно утверждать ни материальную твёрдость, ни определённую куполообразную форму. Сноска сохраняет традиционное прочтение и допустимую космологически более конкретную альтернативу.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом повествования. Сохранены повтор ключевого существительного и последовательность двух действий Бога; архаичное «твердь» вынесено в сноску.
