source:
  edition: WLC
  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: ru
  text: И сотворил Бог огромных морских существ[a], и всех живых существ, которые движутся и которыми кишели воды, — по их видам, и всякую крылатую птицу — по её виду. И увидел Бог, что это хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огромных морских чудовищ»; или: «огромных драконов». Еврейское слово танниним может обозначать крупных змееподобных или чудовищных существ; здесь водный контекст позволяет перевести его как «морские существа».'
    reason: Лексическая альтернатива сохраняет диапазон значения תַּנִּינִם и возможные ассоциации, не навязывая их основному тексту.
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: сотворил
  rationale: Передаёт особый глагол ברא в рассказе о творении и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, слово согласуется здесь с глаголом в единственном числе и обозначает единого Бога.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: огромных морских существ
  rationale: תנינים может обозначать крупных змееподобных или чудовищных существ; водный контекст поддерживает нейтральное обозначение морских существ, а прилагательное «огромных» передаёт הַגְּדֹלִים.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: всякое живое существо
  rationale: נפש חיה здесь обозначает одушевлённое живое существо, а не «душу» в позднейшем богословском смысле.
- source_word: הָרֹמֶשֶׂת
  choice: которое движется
  rationale: רמש охватывает широкий класс движущихся существ; такой перевод не сужает значение до ползания.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: которыми кишат воды
  rationale: שרץ выражает многочисленность и бурное изобилие живых существ; настоящее время естественно передаёт результат творческого действия в описываемом мире.
- source_word: לְמִינֵהֶם
  choice: по их видам
  rationale: Передаёт распределение множества водных существ по соответствующим категориям.
- source_word: כָּל עוֹף כָּנָף
  choice: всякую крылатую птицу
  rationale: Сохраняет оба компонента выражения — летающее существо/птицу и наличие крыльев — в естественной русской форме.
- source_word: לְמִינֵהוּ
  choice: по её виду
  rationale: Единственное число местоимения соответствует собирательно употреблённому выражению «всякую крылатую птицу».
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: И увидел Бог, что это хорошо
  rationale: Сохраняет повторяющуюся оценочную формулу Бытия 1 и её лаконичность.
theological_decisions:
- issue: Передача תַּנִּינִם в контексте творения при возможных мифологических ассоциациях
  choice: огромные морские существа
  alternative: огромные морские чудовища; огромные драконы
  rationale: 'Непосредственный контекст говорит о сотворении водной жизни. Основной перевод не усиливает возможные мифологические оттенки, но и не скрывает широкого диапазона еврейского слова: альтернативы сохранены в сноске.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Инверсия «И сотворил Бог» и «И увидел Бог» поддерживает ритм повествования; лексика остаётся понятной обычному читателю.
