  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: ru
  text: И сделал Бог диких животных земли по их родам, и домашних животных по их родам, и всех существ, ползающих по почве, — по их родам[a]. И увидел Бог, что это хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «По родам» — по присущим им категориям; эти слова не следует понимать как точное обозначение категорий современной биологической систематики.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: создал
  rationale: Глагол עשה обычно означает «делать, создавать». В контексте рассказа о творении «создал» звучит естественно и не добавляет не выраженных в еврейском тексте оттенков.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В Быт 1 существительное во множественной по форме форме согласуется с глаголом в единственном числе и обозначает единого Творца.
- source_word: חַיַּת הָאָרֶץ
  choice: земных зверей
  rationale: Выражение обозначает наземных диких животных в отличие от домашних животных и ползающих существ. «Земные звери» сохраняет категориальное различие и достоинство стиля.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: по родам их / по роду их
  rationale: מִין обозначает тип или категорию существ. «Род» здесь употреблён в общем, нетехническом смысле и не приравнивает библейские категории к современной биологической таксономии.
- source_word: הַבְּהֵמָה
  choice: домашних животных
  rationale: В данном перечислении בהמה обозначает преимущественно крупных приручённых животных, противопоставленных диким зверям; этот вариант ясен современному читателю и не сужает значение до крупного рогатого скота.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: всех ползающих по земле
  rationale: רמש обозначает небольших существ, передвигающихся у поверхности земли. Русское «ползающих» естественно передаёт категорию, а «по земле» выражает связь с אֲדָמָה.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: И увидел Бог, что это хорошо
  rationale: Формула передаёт повторяющуюся в Быт 1 Божью оценку сотворённого; указательное «это» естественно отсылает ко всему только что описанному.
theological_decisions:
- issue: Передача категорий творения без внесения современной научной таксономии
  choice: род / роды
  alternative: вид / виды
  rationale: Еврейское מִין обозначает категорию существ, но не требует отождествления с современным биологическим понятием вида. Сноска предупреждает о нетехническом употреблении русского слова «род».
- issue: Различение הָאָרֶץ и הָאֲדָמָה в одном стихе
  choice: земных зверей ... ползающих по земле
  alternative: зверей земли ... пресмыкающихся по почве
  rationale: Перевод сохраняет смысловую связь обеих групп с сушей, но русская идиоматика не позволяет без тяжеловесности воспроизвести различие двумя существительными. Выражения «земные» и «по земле» дают естественное контекстуальное различение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской ритмикой. Синтаксический параллелизм оригинала сохранён; архаизмы и узкоспециальная терминология избегаются.
