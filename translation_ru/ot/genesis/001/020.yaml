id: GEN.1.20
reference: Genesis 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: ru
  text: 'И сказал Бог: «Пусть воды закишат множеством живых существ[a], и пусть птицы[b] летают над землёй по небесному простору[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте употреблены однокоренные глагол и существительное: «пусть воды кишат кишением живых существ»; этот оборот подчёркивает обилие жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «летающие существа». Еврейское עוֹף может иметь более широкое значение, чем только птицы.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское רְקִיעַ также переводят как «свод» или «твердь».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет последовательное повествование, выраженное формой с waw, без избыточного истолкования союза.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Глагол стоит в единственном числе; в контексте Бытия 1 речь идёт о едином Боге-Творце.
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: пусть воды закишат множеством
  rationale: Глагол שׁרץ и однокоренное существительное подчёркивают обилие и движение живых созданий. Русское «закишат множеством» естественно передаёт этот усиленный образ, хотя не воспроизводит однокоренной повтор буквально.
- source_word: נֶפֶשׁ חַיָּה
  choice: живых существ
  rationale: В данном контексте выражение обозначает одушевлённые живые создания; перевод не привносит позднейшего специального значения слова «душа».
- source_word: וְעוֹף
  choice: и пусть птицы
  rationale: «Птицы» — ясное и естественное русское обозначение в данном контексте, хотя еврейское собирательное слово может охватывать летающих существ шире.
- source_word: יְעוֹפֵף
  choice: летают
  rationale: Форма с «пусть» передаёт волеизъявительное значение, а глагол «летают» — движение в воздухе без ненужного уточнения его характера.
- source_word: עַל הָאָרֶץ
  choice: над землёй
  rationale: При глаголе полёта предлог указывает на положение или движение выше земли.
- source_word: עַל פְּנֵי רְקִיעַ הַשָּׁמָיִם
  choice: по небесному простору
  rationale: Передаёт движение по видимому пространству небес и сохраняет образ протяжённости, не навязывая конкретной космологической модели.
theological_decisions:
- issue: Значение נֶפֶשׁ в рассказе о сотворении животных
  choice: живые существа
  alternative: живые души
  rationale: Здесь выражение характеризует животных как одушевлённую жизнь, а не формулирует специальное учение о природе души.
- issue: Передача רְקִיעַ
  choice: небесный простор
  alternative: небесный свод; небесная твердь
  rationale: Выбранный вариант сохраняет пространственный образ и понятен современному читателю, не разрешая однозначно спорный вопрос о подразумеваемом устройстве мира.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Синтаксический параллелизм двух повелений сохранён; лексика избегает как разговорности, так и конфессионально нагруженных толкований.
