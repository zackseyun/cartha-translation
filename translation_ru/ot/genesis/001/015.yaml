  text: и пусть они будут светилами на небесном своде, чтобы освещать землю. И стало так.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: и пусть они будут
  rationale: В контексте продолжающегося Божьего повеления форма передана волитивно; это сохраняет последовательность повеления и исполнения.
- source_word: לִמְאוֹרֹת
  choice: светилами
  rationale: מָאוֹר обозначает источник света, то есть светящее тело, а не отвлечённый свет; «светила» точно и естественно передаёт это значение.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: на небесном своде
  rationale: «Небесный свод» естественно передаёт конструкцию со словом רָקִיעַ и сохраняет образ протяжённого небесного пространства.
- source_word: לְהָאִיר עַל הָאָרֶץ
  choice: чтобы освещать землю
  rationale: Каузативный инфинитив אור выражает действие «давать свет, освещать»; русский оборот ясно передаёт назначение светил.
- source_word: וַיְהִי כֵן
  choice: И стало так
  rationale: Устойчивая формула исполнения в Бытии 1; краткая и естественная русская передача.
theological_decisions:
- issue: Волитивная сила וְהָיוּ внутри речи о творении
  choice: «и пусть они будут» как продолжение повеления
  alternative: «и будут они» как простое будущее
  rationale: Непосредственный синтаксический контекст продолжает Божье постановление из предыдущего стиха. Волитивная передача сохраняет литературную структуру повеления и последующего исполнения, не внося дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Светила» точнее, чем «светы», а «небесный свод» понятнее современному читателю, чем архаичное «твердь».
