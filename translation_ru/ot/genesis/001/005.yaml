base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: ru
  text: И назвал Бог свет днём, а тьму назвал ночью. И был вечер, и было утро — первый день[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «день один».'
    reason: Еврейский текст употребляет количественное «один», а не порядковое «первый».
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: назвал
  rationale: В конструкции наречения имени קרא естественно передаётся русским «назвал»; это ясно выражает действие именования.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Существительное имеет форму множественного числа, но здесь согласуется с глаголом в единственном числе и обозначает единого Творца.
- source_word: לָאוֹר
  choice: свет
  rationale: Предлог ל входит в еврейскую конструкцию именования; по-русски объект после «назвал» естественно ставится в винительном падеже.
- source_word: יוֹם
  choice: днём
  rationale: Это имя, данное свету. Творительный падеж соответствует русской конструкции «назвать чем»; строчная буква естественна для названий частей суточного цикла.
- source_word: וְלַחֹשֶׁךְ
  choice: а тьму
  rationale: Союз передаёт сопоставление двух параллельных актов именования; «а» звучит по-русски естественнее буквального «и», не меняя смысла.
- source_word: קָרָא
  choice: назвал
  rationale: Повтор глагола сохранён, чтобы передать параллелизм и ритм еврейской фразы.
- source_word: לָיְלָה
  choice: ночью
  rationale: Это имя, данное тьме; творительный падеж соответствует конструкции «назвал ночью».
- source_word: וַיְהִי
  choice: и был / и было
  rationale: Русское согласование по роду требует форм «был вечер» и «было утро»; повтор сохраняет структуру оригинала.
- source_word: עֶרֶב
  choice: вечер
  rationale: Основное значение слова — «вечер»; более узкое «закат» здесь неоправданно.
- source_word: בֹקֶר
  choice: утро
  rationale: Основное значение слова — «утро»; «рассвет» было бы уже по смыслу.
- source_word: יוֹם אֶחָד
  choice: день один
  rationale: Сохранён необычный еврейский кардинальный оборот «день один», а не заменён порядковым «первый день»; по-русски он понятен и позволяет не устранять возможную смысловую значимость формы оригинала.
theological_decisions:
- issue: Передача יוֹם אֶחָד в заключительной формуле дня творения
  choice: день один
  alternative: первый день
  rationale: В еврейском тексте употреблено количественное אֶחָד («один»), а не порядковое «первый». Формулировка «день один» сохраняет эту особенность и не предрешает её интерпретацию; более привычный русский вариант указан в примечании.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной близостью к синтаксическому ритму еврейского текста. Повтор «назвал» и парная формула «и был вечер, и было утро» сохранены; архаичные формы и конфессионально окрашенная терминология не используются.
