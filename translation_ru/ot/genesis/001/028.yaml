  source_fidelity: 'Перевод точно передаёт последовательность и смысл еврейского текста: Божье благословение, обращения во множественном числе, повеления плодиться, умножаться, наполнить землю, подчинить её и осуществлять власть над названными живыми существами. «Подчините её себе» адекватно передаёт силу כבש, а «владычествуйте над» — רדה, не смягчая и не расширяя смысл. «Всяким живым существом, которое передвигается по земле» сохраняет широкое значение חיה и рמש.'
