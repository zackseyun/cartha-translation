source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: ru
  text: 'Бог благословил их и сказал им: «Плодитесь и размножайтесь, наполняйте землю и подчините её себе; владычествуйте[a] над рыбами морскими, над птицами небесными и над всяким живым существом, которое передвигается[b] по земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господствуйте».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ползает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Пиэль глагола ברך обозначает дарование благословения. «Благословил» точно передаёт действие Бога и естественно звучит по-русски.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на форму множественного числа, согласование с глаголами единственного числа и контекст Бытия 1 указывают на единого Бога.
- source_word: פְּרוּ
  choice: плодитесь
  rationale: Императив призывает к деторождению и продолжению рода; «плодитесь» сохраняет образность и привычную библейскую формулу.
- source_word: וּרְבוּ
  choice: размножайтесь
  rationale: Глагол רבה здесь означает возрастать числом. В сочетании с «плодитесь» это ясный и естественный русский эквивалент.
- source_word: וּמִלְאוּ
  choice: наполняйте
  rationale: Глагол מלא имеет прямое значение «наполнять». Несовершенный вид естественно выражает продолжительный характер поручения.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В универсальном контексте рассказа о сотворении имеется в виду вся земля, а не отдельная страна или территория.
- source_word: וְכִבְשֻׁהָ
  choice: подчините её себе
  rationale: Глагол כבש выражает сильную идею подчинения и установления контроля. Этот вариант сохраняет силу исходного текста, не добавляя представления о разрушительной эксплуатации.
- source_word: וּרְדוּ
  choice: владычествуйте
  rationale: Глагол רדה означает осуществлять власть, господствовать. «Владычествуйте» сохраняет сильный смысл управления и при этом уместно в достойном литературном регистре.
- source_word: בִּדְגַת הַיָּם
  choice: над рыбами морскими
  rationale: Сочетание прямо обозначает морских рыб; русский порядок слов звучит естественно и сохраняет поэтическую торжественность.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: над птицами небесными
  rationale: עוֹף может шире обозначать летающих существ, но в данном перечислении «птицы» — наиболее естественный смысл. «Небесными» сохраняет образный язык оригинала.
- source_word: בְכָל חַיָּה
  choice: над всяким живым существом
  rationale: חַיָּה здесь обозначает животное или живое существо в широком смысле; выбранный вариант не сужает значение до диких зверей.
- source_word: הָרֹמֶשֶׂת
  choice: которое передвигается
  rationale: Причастие רמש описывает движение по земле и может относиться как к ползанию, так и к движению шире. «Передвигается» сохраняет широту значения; более узкий вариант отмечен в сноске.
theological_decisions:
- issue: Сила поручения человечеству в глаголах כבש и רדה
  choice: Сохранены сильные выражения «подчините её себе» и «владычествуйте».
  alternative: «Заботьтесь о ней», «будьте её хранителями» или более мягкое «управляйте».
  rationale: Еврейские глаголы выражают подчинение и осуществление власти, а не только заботу. Перевод не смягчает их до идеи попечения, но и не добавляет отсутствующего в тексте оправдания эксплуатации.
- issue: Объём значения הָאָרֶץ
  choice: «землю» в смысле всей земли.
  alternative: «страну» или «землю» как ограниченную территорию.
  rationale: Контекст всеобщего сотворения в Бытии 1 требует глобального, а не локального понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан плавным и доступным; сохранены повторяемость повелений и сила поручения. Маркеры сносок поставлены непосредственно после слов, к которым относятся.
