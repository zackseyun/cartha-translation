source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: ru
  text: И назвал Бог пространство[a] небом[b]. И был вечер, и было утро — день второй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твердь», «свод». Еврейское רָקִיעַ обозначает нечто распростёртое или протяжённое.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «небесами». Еврейское שָׁמַיִם может обозначать небо или небеса; здесь так Бог называет созданное пространство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: назвал
  rationale: В сочетании с предлогом ל глагол קרא обозначает наречение имени; русское «назвал» ясно и естественно передаёт этот смысл.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В Бытии 1 форма אֱלֹהִים согласуется с глаголом в единственном числе и обозначает единого Творца.
- source_word: לָרָקִיעַ
  choice: пространство
  rationale: רָקִיעַ обозначает нечто распростёртое или протяжённое. «Пространство» сохраняет основной образ, оставаясь понятнее традиционной «тверди» и менее конкретизирующим, чем «купол» или «свод».
- source_word: שָׁמָיִם
  choice: небом
  rationale: Здесь שָׁמַיִם — имя, которое Бог даёт пространству. «Небо» естественно по-русски и не навязывает различия между видимым небом и иными значениями слова.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: И был вечер, и было утро
  rationale: Эта формулировка сохраняет повторяющуюся структуру древнееврейского текста и звучит естественно в возвышенном русском повествовании.
- source_word: יוֹם שֵׁנִי
  choice: день второй
  rationale: Порядок слов передаёт торжественную формулу нумерации дней и соответствует отсутствию артикля при שֵׁנִי, не превращая это в неопределённое «некий второй день».
theological_decisions:
- issue: Как передать רָקִיעַ, не навязывая определённую космологическую модель
  choice: пространство
  alternative: твердь; свод; купол
  rationale: Исходное слово связано с представлением о чём-то распростёртом. «Пространство» сохраняет образ протяжённости, но не утверждает ни твёрдую материальную оболочку, ни конкретную форму.
- issue: Значение שָׁמַיִם как данного Богом имени
  choice: небо
  alternative: небеса
  rationale: «Небо» наиболее естественно воспринимается как название видимого пространства и сохраняет акт наречения. «Небеса» также возможно, однако может сильнее ассоциироваться исключительно с Божьим местопребыванием.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом повествования о сотворении. Сохранён повтор «и был… и было…», а архаичная «твердь» вынесена в примечание.
