source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: ru
  text: 'И сказал Бог: «Пусть земля произрастит[a] зелень: растения, дающие семя, и плодовые деревья, приносящие плод по своему роду[b], с семенем в них[c], на земле». И стало так.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть земля произведёт растительность».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по его роду»; единственное число употреблено распределительно — применительно к каждому роду.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «плод, в котором его семя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: пусть земля произрастит
  rationale: Юссивная форма породы hифиль обращена к земле и выражает повеление вызвать появление растительности. «Произрастит» сохраняет образ прорастания и уместно в торжественном повествовании, не становясь архаичным.
- source_word: דֶּשֶׁא
  choice: зелень
  rationale: Собирательное обозначение свежей растительности. «Зелень» передаёт широкий смысл и не сужает его до одной травы.
- source_word: עֵשֶׂב
  choice: растения
  rationale: Речь идёт о травянистой растительности как классе. Общее слово «растения» понятно современному читателю и не вызывает преимущественно кулинарных ассоциаций слова «травы».
- source_word: מַזְרִיעַ זֶרַע
  choice: дающие семя
  rationale: Причастный оборот описывает постоянное свойство растений производить семя; русский оборот естественен и сохраняет этот смысл.
- source_word: עֵץ פְּרִי
  choice: плодовые деревья
  rationale: Естественная русская передача конструкции «дерево плода» как собирательного класса.
- source_word: עֹשֶׂה פְּרִי
  choice: приносящие плод
  rationale: Обычный русский оборот для плодоношения, соответствующий причастному описанию характерного действия дерева.
- source_word: לְמִינוֹ
  choice: по своему роду
  rationale: 'Сохраняет морфологическое единственное число и его распределительное значение: каждый класс воспроизводится согласно своему роду.'
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: с семенем в нём
  rationale: Лаконичная конструкция сохраняет единственное число и не устраняет полностью возможную соотнесённость местоимения с плодом либо описываемым плодовым деревом.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Прямая и естественная передача обстоятельства места.
- source_word: וַיְהִי כֵן
  choice: И стало так
  rationale: Устойчивая формула исполнения в Бытии 1; звучит естественно, кратко и торжественно.
theological_decisions:
- issue: Объём и характер категорий растительности
  choice: 'Передать דֶּשֶׁא, עֵשֶׂב и עֵץ פְּרִי как различимые, но широкие наблюдаемые категории: «зелень», «растения» и «плодовые деревья».'
  alternative: 'Либо формально: «трава, сеющая семя, плодовое дерево»; либо обобщённо: «все виды растений и деревьев».'
  rationale: Такая передача сохраняет данные текстом различия, не превращая их в современную ботаническую классификацию и не сглаживая их в свободный пересказ.
- issue: Соотнесённость выражения אֲשֶׁר זַרְעוֹ בוֹ
  choice: Сохранить компактное «с семенем в нём» и пояснить синтаксическую возможность в сноске.
  alternative: Однозначно перевести «плод, в котором его семя» или «деревья, семя которых в них».
  rationale: Еврейская конструкция допускает разную синтаксическую соотнесённость; основной текст не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной повествовательной интонацией. Слова «произрастит» и «И стало так» поддерживают ритм главы; устаревшие формы и специальная ботаническая терминология не используются.
