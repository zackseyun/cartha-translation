base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: ru
  text: Но Ной обрёл благоволение в глазах Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Ной обрёл милость в глазах Яхве».'
    reason: 'Лексико-дискурсивная альтернатива: וְ может означать «и», а חֵן — «милость».'
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Но Ной
  rationale: Союз וְ допускает простое «и», однако здесь вводит контраст между Ноем и всеобщим развращением, описанным непосредственно перед этим; «но» естественно передаёт этот дискурсивный оттенок.
- source_word: מָצָא
  choice: обрёл
  rationale: Глагол буквально означает «нашёл». В русском сочетание «обрёл благоволение» звучит естественнее буквального «нашёл благоволение», сохраняя при этом смысл исходной идиомы.
- source_word: חֵן
  choice: благоволение
  rationale: Слово означает благосклонность, благоволение или милость. «Благоволение» точно передаёт положительное расположение Яхве к Ною и не сужает смысл до позднейшего богословского употребления слова «благодать».
- source_word: בְּ/עֵינֵי
  choice: в глазах
  rationale: Сохранена прозрачная древнееврейская метафора со значением «в чьём-либо восприятии или оценке»; она понятна и в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Значение חֵן как отношения Бога к Ною
  choice: благоволение
  alternative: милость; благодать
  rationale: «Благоволение» сохраняет широту древнееврейского слова и сообщает о благосклонном отношении Бога, не навязывая стиху более узкую позднейшую догматическую терминологию.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена образность выражения «в глазах», при этом глагол «обрёл» выбран ради естественного русского словоупотребления.
