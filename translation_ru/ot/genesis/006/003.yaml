  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: ru
  text: 'Тогда Яхве сказал: «Мой Дух не будет вечно противиться человеку[a], потому что он — плоть[b]. И будут дни его — сто двадцать лет[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой Дух не будет вечно пребывать в человеке»; значение еврейского глагола неясно.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «потому что и он — плоть». Слово «человек» здесь передаёт еврейское адам, употреблённое в единственном числе в значении всего человечества.'
    reason: lexical_alternative
  - marker: c
    text: Неясно, означают ли сто двадцать лет срок до потопа или предел человеческих дней.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: יָדוֹן
  choice: не будет… противиться
  rationale: Глагол труден и спорен; этот вариант сохраняет возможный смысл Божьего противодействия человеку. Альтернативное понимание как «пребывать» отмечено в сноске.
- source_word: רוּחִי
  choice: Мой Дух
  rationale: Притяжательная форма в речи Бога естественно указывает на Божий Дух; прописная буква обозначает референта, не навязывая более поздней догматической конкретизации.
- source_word: בָאָדָם
  choice: человеку
  rationale: При выбранном значении יָדוֹן управление дательным падежом естественно по-русски. Единственное число сохраняет собирательно-родовое употребление אָדָם.
- source_word: לְעֹלָם
  choice: вечно
  rationale: Естественный современный эквивалент со значением неограниченной продолжительности.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: потому что он — плоть
  rationale: Редкая конструкция, вероятно, имеет причинное значение. «Плоть» сохраняет образность и антропологическую напряжённость еврейского текста; возможное значение גַּם отражено в сноске.
- source_word: וְהָיוּ יָמָיו
  choice: И будут дни его
  rationale: Сохраняет простую сочинительную связь исходного текста и не добавляет явно не выраженного логического «поэтому».
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: сто двадцать лет
  rationale: Точное и естественное словесное обозначение числа в литературном библейском стиле.
theological_decisions:
- issue: Значение Божьего «Духа» в отношении человека
  choice: «Мой Дух» — Божий Дух в общем ветхозаветном смысле
  alternative: «моё дыхание» или «моё жизненное дыхание»
  rationale: רוּחַ допускает значения «дух», «ветер», «дыхание», однако притяжательная форма и Божья речь поддерживают «Мой Дух». Перевод не конкретизирует позднейшую тринитарную терминологию.
- issue: Значение и управление спорного глагола יָדוֹן
  choice: «противиться человеку»
  alternative: «пребывать в человеке»
  rationale: Оба понимания представлены в истории толкования и лексикографии. Основной текст следует чтению о противодействии, а подлинная неоднозначность сохранена в сноске.
- issue: Смысл ста двадцати лет
  choice: Оставлено без пояснения как «дни его — сто двадцать лет»
  alternative: Срок до потопа или предельная продолжительность человеческой жизни
  rationale: Сам стих не разрешает однозначно, обозначает ли число отсрочку до суда или предел человеческих дней; перевод не должен решать эту экзегетическую неопределённость.
- issue: Охват אָדָם
  choice: Родовое единственное число «человек»
  alternative: «человечество» или «люди»
  rationale: Так сохраняются грамматическое единственное число и собирательное значение исходного слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Инверсия «И будут дни его» намеренно сохраняет формальную структуру и неоднозначность исходного текста; архаические формы и конфессионально окрашенные подстановки исключены.
