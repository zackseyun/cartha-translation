base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: ru
  text: Но Я установлю мой завет с тобой[a], и ты войдёшь в ковчег — ты, твои сыновья, твоя жена и жёны твоих сыновей вместе с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я подтвержу мой завет с тобой». В контексте завета еврейский глагол может иметь оба оттенка значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Но Я установлю
  rationale: Глагол קום в породе хифиль в сочетании с בְּרִית может означать установление или подтверждение завета. «Установлю» естественно передаёт направленное в будущее обещание; «но» выражает контраст с предшествующим возвещением гибели.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» — точный и устойчивый русский эквивалент בְּרִית, сохраняющий каноническую и богословскую значимость термина.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: Предлог обозначает отношение завета, а в конце стиха — совместное пребывание; простой русский оборот точно передаёт оба употребления.
- source_word: וּבָאתָ אֶל הַתֵּבָה
  choice: и ты войдёшь в ковчег
  rationale: בוא с обозначением места назначения естественно передаётся глаголом «войти», а תֵּבָה в рассказе о Ное — традиционным и контекстуально точным словом «ковчег».
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение имеет эмфатическую функцию; она сохранена посредством приложения после тире.
- source_word: וּבָנֶיךָ
  choice: твои сыновья
  rationale: Еврейский текст прямо говорит о сыновьях, поэтому более общее «дети» было бы неточным.
- source_word: וְאִשְׁתְּךָ
  choice: твоя жена
  rationale: Прямой и естественный перевод семейного обозначения.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: жёны твоих сыновей
  rationale: Перевод сохраняет буквальную структуру сочетания; «невестки» возможно, но несколько более интерпретативно.
theological_decisions:
- issue: Смысл выражения об установлении завета
  choice: 'будущее обещание: «Я установлю Мой завет с тобой»'
  alternative: «Я подтвержу Мой завет с тобой»
  rationale: Еврейское выражение допускает как установление, так и подтверждение завета. Сам стих не разрешает вопрос, идёт ли речь о начале нового завета или о подтверждении ранее данного обязательства, поэтому основной текст использует стандартную формулировку, а альтернативу сохраняет в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской терминологией. Заглавное «Я» употреблено как принятое в русском библейском стиле обозначение речи Бога; синтаксис списка сохранён ясным и торжественным.
