source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: ru
  text: И вот Я наведу на землю воды потопа, чтобы истребить всякую плоть, в которой есть дыхание жизни[a], под небесами. Всё, что на земле, погибнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух жизни». Еврейское слово רוּחַ может означать «дыхание», «ветер» или «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: И вот Я
  rationale: Самостоятельное местоимение и конструкция הִנְנִי придают словам торжественное эмфатическое звучание. «И вот Я» естественно передаёт акцент и непосредственность в современном русском.
- source_word: מֵבִיא
  choice: наведу
  rationale: Причастие обозначает близкое, решительно предстоящее действие. В сочетании с потопом русское «наведу» звучит естественно и сохраняет активную роль говорящего.
- source_word: הַמַּבּוּל מַיִם
  choice: воды потопа
  rationale: Передаёт и специальное обозначение Потопа, и явно названную водную стихию, не сводя выражение к общему слову «потоп».
- source_word: עַל הָאָרֶץ
  choice: на землю
  rationale: В контексте всеобщего охвата הָאָרֶץ лучше передать как «землю», а не локальное «страну» или «сушу».
- source_word: לְשַׁחֵת
  choice: чтобы истребить
  rationale: Инфинитив выражает цель. «Истребить» точно и торжественно передаёт полное уничтожение живых существ в данном контексте.
- source_word: כָּל בָּשָׂר
  choice: всякую плоть
  rationale: Сохраняет ключевое библейское собирательное выражение и его широкий охват, не ограничивая его только людьми.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: в которой есть дыхание жизни
  rationale: רוּחַ здесь естественно обозначает оживляющее дыхание, но допускает значение «дух»; альтернативу сохраняет сноска.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: под небесами
  rationale: Естественный русский эквивалент идиомы, обозначающей весь мир под небом и подчёркивающей всеобщий охват.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: Всё, что на земле
  rationale: Кратко и точно сохраняет итоговую формулу всеобщности.
- source_word: יִגְוָע
  choice: погибнет
  rationale: Глагол означает умереть, испустить дух. «Погибнет» соответствует контексту суда и звучит естественно и торжественно.
theological_decisions:
- issue: Значение רוּחַ в выражении רוּחַ חַיִּים
  choice: дыхание жизни
  alternative: дух жизни
  rationale: В повествовании о Потопе выражение прежде всего указывает на жизненное дыхание одушевлённых существ и перекликается с языком сотворения. Однако лексическая неоднозначность реальна, поэтому вариант «дух жизни» отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены собирательное «всякая плоть», торжественное вступление и реальная неоднозначность רוּחַ; синтаксис упрощён настолько, чтобы стих был понятен обычному читателю.
