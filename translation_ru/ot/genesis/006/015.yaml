  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: ru
  text: 'Вот как ты должен сделать его: длина ковчега — триста локтей[a], ширина — пятьдесят локтей, а высота — тридцать локтей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя мера длины, приблизительно равная расстоянию от локтя до кончиков пальцев.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: Вот как ты должен сделать его
  rationale: Оборот вводит дальнейшие указания по сооружению ковчега. «Вот как» естественно передаёт пояснительную силу конструкции, а «должен сделать» сохраняет директивный оттенок имперфекта. Местоимение «его» согласовано с русским словом «ковчег», хотя еврейское תֵּבָה женского рода.
- source_word: הַתֵּבָה
  choice: ковчег
  rationale: Традиционный и понятный русский эквивалент תֵּבָה в повествовании о Ное; в данном контексте обозначает сооружаемое судно.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה אֹרֶךְ הַתֵּבָה
  choice: длина ковчега — триста локтей
  rationale: Сохранена древняя единица измерения и порядок смысловых компонентов, естественный для современного русского описания размеров.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: ширина — пятьдесят локтей
  rationale: רָחְבָּהּ обозначает ширину ковчега; опущенное повторение «ковчега» ясно восстанавливается из контекста.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: а высота — тридцать локтей
  rationale: В контексте размеров сооружения קוֹמָה естественно передаётся словом «высота»; союз «а» ясно завершает перечисление параметров.
