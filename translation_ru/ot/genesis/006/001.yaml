base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: ru
  text: 'И было так: когда люди[a] начали умножаться на земле и у них рождались дочери,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «человек»; здесь это слово употреблено собирательно и относится к человечеству в целом.
