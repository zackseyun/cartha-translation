lexical_decisions:
- source_word: וַיְהִי
  choice: И было так
  rationale: Передаёт повествовательный оборот, вводящий новое развитие событий, без чрезмерно архаичного «и случилось».
- source_word: כִּי
  choice: когда
  rationale: После וַיְהִי союз вводит временную придаточную часть.
- source_word: הֵחֵל
  choice: начали
  rationale: Глагольная форма в этой конструкции означает начало действия.
- source_word: הָאָדָם
  choice: люди
  rationale: Существительное стоит в единственном числе, но здесь имеет собирательное значение и обозначает человечество, а не отдельного мужчину или Адама.
- source_word: לָרֹב
  choice: умножаться
  rationale: Передаёт численный рост человеческого населения и сохраняет характерную библейскую лексику, понятную современному читателю.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на земле
  rationale: Естественный русский эквивалент пространственного выражения «на поверхности земли/почвы»; буквальное «по лицу земли» здесь звучало бы архаично.
- source_word: וּבָנוֹת
  choice: и ... дочери
  rationale: Прямой и естественный эквивалент, подготавливающий содержание следующего стиха.
- source_word: יֻלְּדוּ לָהֶם
  choice: у них стали рождаться
  rationale: Передаёт пассивную конструкцию с לָהֶם естественным русским оборотом и согласуется с продолженным процессом умножения людей.
theological_decisions:
- issue: Собирательное значение הָאָדָם
  choice: люди
  alternative: человек; человечество
  rationale: В контексте речь идёт обо всём человеческом роде, а не об одном мужчине. Множественное «люди» ясно передаёт собирательный смысл, тогда как формальное «человек» в современном русском могло бы быть ошибочно понято как указание на отдельное лицо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Начальный оборот сохраняет функцию еврейского וַיְהִי, а незавершённая синтаксическая форма в конце соответствует продолжению мысли в следующем стихе.
