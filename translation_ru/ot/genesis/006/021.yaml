  source_fidelity: Перевод точно передаёт повеление, бенефактивное «себе», отбор пищи из всего её разнообразия, её пригодность для еды, сбор припасов у Ноя и их назначение для Ноя и животных. «Всякой пищи» в сочетании с «возьми себе» естественно имеет партитивный смысл и не требует значения «всю пищу без остатка».
