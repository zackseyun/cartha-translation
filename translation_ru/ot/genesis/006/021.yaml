base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: ru
  text: Ты же возьми себе всякой пищи, которую можно есть[a], и собери её у себя. Она будет пищей тебе и им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую едят». Еврейское выражение может обозначать как пищу, обычно употребляемую в пищу, так и то, что пригодно для еды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ты же
  rationale: Самостоятельное местоимение подчёркивает адресата, а частица «же» естественно передаёт выделительно-сопоставительный оттенок конструкции.
- source_word: קַח לְךָ
  choice: возьми себе
  rationale: Императив לקח прямо означает «возьми», а дательный компонент לְךָ передаёт личную ответственность и пользу адресата.
- source_word: מִכָּל מַאֲכָל
  choice: всякой пищи
  rationale: В контексте заготовки выражение означает взять некоторое количество из всего разнообразия пищи, а не забрать всю существующую пищу без остатка. Русская партитивная конструкция после «возьми» естественно выражает это значение.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: которую можно есть
  rationale: Нифаль глагола אכל здесь естественно описывает пищу как пригодную к употреблению. Перевод сохраняет модально-пассивный смысл, а более буквальная возможность отмечена в сноске.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: и собери её у себя
  rationale: Глагол אָסַף означает собирать или накапливать, а אֵלֶיךָ указывает, что припасы должны находиться у Ноя. Формулировка естественна по-русски и не добавляет прямо не выраженного понятия хранения.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: Она будет пищей тебе и им
  rationale: Последовательная форма וְהָיָה выражает будущий результат повеления; לְאָכְלָה идиоматично передано словом «пищей», при этом сохранено различение между Ноем и животными.
