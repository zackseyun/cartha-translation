  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: ru
  text: Вот история Ноя. Ной был праведным, безупречным человеком среди своих современников[a]. Ной ходил с Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в своих поколениях»; возможно также: «в своё время».'
    reason: 'Сохраняет неоднозначность выражения בְּדֹרֹתָיו: оно может относиться к современникам Ноя либо иметь более общее временное значение.'
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Вот родословие
  rationale: Формула вводит новый раздел книги Бытие. «Родословие» сохраняет связь с ключевым структурным термином תּוֹלְדֹת и в русском языке может обозначать как линию потомков, так и относящееся к ней повествование.
- source_word: נֹחַ
  choice: Ной
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: אִישׁ צַדִּיק
  choice: человеком праведным
  rationale: Передаёт мужской референт и нравственно-религиозный смысл צַדִּיק естественным литературным русским языком.
- source_word: תָּמִים
  choice: непорочным
  rationale: В описании характера слово указывает на цельность и безупречность, не требуя значения абсолютной безгрешности.
- source_word: בְּדֹרֹתָיו
  choice: среди своих современников
  rationale: 'Контекстуально естественная передача: Ной выделялся среди людей своего времени. Буквальная множественная форма и иная возможная временная трактовка сохранены в сноске.'
- source_word: אֶת הָאֱלֹהִים הִתְהַלֶּךְ
  choice: ходил с Богом
  rationale: Сохраняет древнееврейскую метафору постоянной жизни в близости к Богу и её межтекстовую связь с Быт. 5:22, 24.
theological_decisions:
- issue: Смысл תָּמִים применительно к Ною
  choice: «непорочным» как характеристика нравственной цельности и безупречности
  alternative: «совершенным» или «без изъяна»
  rationale: Текст противопоставляет Ноя развращённому окружению, но сам по себе не утверждает его абсолютную безгрешность.
- issue: Смысл בְּדֹרֹתָיו
  choice: «среди своих современников» в основном тексте с указанием буквальной формы в сноске
  alternative: «в своих поколениях» или «в своё время»
  rationale: Древнееврейское выражение допускает оттенки сравнения с современниками и временной отнесённости; сноска не позволяет русскому идиоматическому переводу скрыть эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена традиционная метафора «ходил с Богом»; синтаксис сделан ясным и доступным без конфессионально окрашенных уточнений.
