    issue: Сноски b и c поставлены после заключительного предложения, а не у слов «нефилимы» и «сыны Божьи».
    rationale: Привязка сносок должна однозначно указывать на комментируемые единицы. В нынешнем виде обе сноски визуально могут быть отнесены к «людям прославленным», что неверно.
  - severity: low
    issue: Финальное «люди прославленные» несколько неестественно для современного литературного русского.
    rationale: Оборот понятен, но «люди, пользовавшиеся славой» более плавно передаёт смысл «люди имени/славы», не добавляя интерпретации.
