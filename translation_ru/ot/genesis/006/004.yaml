reference: Genesis 6:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: ru
  text: Нефилимы[a] были на земле в те дни — и также после того, — когда сыны Божьи[b] входили к дочерям человеческим[c], и те рождали им детей. Они были могучими людьми древности, людьми, пользовавшимися славой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «нефилимы» встречается редко, и его точное значение неизвестно; традиционный перевод — «исполины».
    reason: alternative_reading
  - marker: b
    text: Выражение «сыны Божьи» также понимают как «божественные существа»; существуют и толкования, согласно которым речь идёт о земных правителях или о благочестивой линии Сифа.
    reason: alternative_reading
  - marker: c
    text: «Дочери человеческие» — то есть женщины человеческого рода.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: нефилимы
  rationale: Редкое и спорное еврейское название передано транслитерацией, чтобы не навязывать толкования «исполины» или «падшие».
- source_word: בָאָרֶץ
  choice: на земле
  rationale: В контексте первобытной истории это естественнее и шире, чем «в стране».
- source_word: וְגַם אַחֲרֵי כֵן
  choice: а также и после того
  rationale: Сохраняет как присоединительное усиление, так и временное значение выражения.
- source_word: אֲשֶׁר יָבֹאוּ
  choice: когда ... входили
  rationale: Несовершенный вид естественно передаёт повторявшееся действие; оборот «входили к» сохраняет библейский эвфемизм.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: сыны Божьи
  rationale: Формально близкая и понятная русская передача сохраняет неоднозначность обозначения и не отождествляет этих существ ни с ангелами, ни с правителями, ни с потомками Сифа.
- source_word: בְּנוֹת הָאָדָם
  choice: дочери человеческие
  rationale: 'Передаёт собирательное значение אָדָם естественным для русского библейского регистра выражением: женщины человеческого рода.'
- source_word: וְיָלְדוּ לָהֶם
  choice: и те рождали им детей
  rationale: Местоимение «те» ясно указывает на дочерей человеческих, а подразумеваемое дополнение «детей» делает фразу естественной по-русски.
- source_word: הַגִּבֹּרִים
  choice: могучие люди
  rationale: Сохраняет широкое значение силы и могущества, не сужая его до «воинов» и не идеализируя как «героев».
- source_word: מֵעוֹלָם
  choice: древности
  rationale: Кратко и естественно обозначает давнее, древнее время.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: люди прославленные
  rationale: Идиоматически передаёт людей, обладавших именем и известностью, сохраняя возвышенный тон.
theological_decisions:
- issue: Кто такие «сыны Божьи»
  choice: Сохранить выражение «сыны Божьи» без пояснения в основном тексте.
  alternative: Божественные существа; ангельские существа; земные правители; благочестивая линия Сифа.
  rationale: Еврейское выражение допускает разные толкования; перевод не должен разрешать спор, который сам текст однозначно не разрешает.
- issue: Значение הַנְּפִלִים
  choice: Передать как «нефилимы».
  alternative: Исполины; падшие.
  rationale: Точное значение редкого слова неизвестно; транслитерация сохраняет подлинную неопределённость.
- issue: Связь нефилимов с могучими людьми
  choice: Передать местоимение הֵמָּה как «они», не уточняя его референт сверх сказанного в тексте.
  alternative: Прямо отождествить могучих людей с детьми, нефилимами либо сынами Божьими.
  rationale: Синтаксис допускает вопросы о точном референте; явное уточнение внесло бы в перевод спорное толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Архаизмы сведены к понятному и закрепившемуся выражению «сыны Божьи»; спорные обозначения и синтаксические связи сохранены без конфессионального уточнения.
