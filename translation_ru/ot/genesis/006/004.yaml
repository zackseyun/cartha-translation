revisions:
- from: Нефилимы были на земле в те дни, а также и после того, когда сыны Божьи входили к дочерям человеческим[a] и те рождали им детей. Они были могучими людьми древности, людьми прославленными.[b][c]
  to: Нефилимы[a] были на земле в те дни — и также после того, — когда сыны Божьи[b] входили к дочерям человеческим[c], и те рождали им детей. Они были могучими людьми древности, людьми, пользовавшимися славой.
  rationale: Исправлены исключительно размещение сносок, пунктуация и стилистика заключительного определения. Перевод по-прежнему не разрешает спорные вопросы о значении «нефилимов», личности «сынов Божьих» и точном соотнесении местоимения «они».
