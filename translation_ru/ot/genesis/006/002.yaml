  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: ru
  text: И увидели сыны Божьи[a], что дочери человеческие красивы[b], и взяли себе в жёны всех, кого выбрали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественные существа». О том, кто назван «сынами Божьими», существуют разные толкования: небесные существа, человеческие правители или знатные люди либо потомки Сифа.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «хороши»; здесь — привлекательны внешне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: сыны Божьи
  rationale: Формально близкая передача сохраняет неоднозначное еврейское выражение и не определяет его референтов.
- source_word: בְּנוֹת הָאָדָם
  choice: дочери человеческие
  rationale: Естественная литературная передача собирательного הָאָדָם, сохраняющая противопоставление «сынам Божьим».
- source_word: כִּי טֹבֹת הֵנָּה
  choice: что ... красивы
  rationale: В данном контексте טֹבֹת обозначает внешнюю привлекательность; «красивы» естественно передаёт смысл, не приписывая женщинам нравственную добродетель.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: и брали себе в жёны
  rationale: Оборот передаёт брачный смысл נָשִׁים и сохраняет значение לָהֶם; несовершенный вид по-русски естественно описывает последовавшую практику выбора.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: тех, кого выбирали
  rationale: Передаёт неограниченный выбор из всего круга женщин, не добавляя отсутствующих в тексте уточнений.
theological_decisions:
- issue: Кого обозначают «сыны Божьи»
  choice: Сохранить буквальное выражение «сыны Божьи», не уточняя их природу.
  alternative: Небесные существа; человеческие правители или знатные люди; потомки Сифа.
  rationale: Сам стих не разрешает спор о референте выражения; конкретизация в основном тексте устранила бы заложенную в источнике неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Сыны Божьи» сохраняет узнаваемую формулу и исходную неоднозначность; архаичные синтаксические конструкции по возможности устранены.
