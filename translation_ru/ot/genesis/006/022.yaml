  text: 'И Ной сделал: всё, что повелел ему Бог, он так и сделал.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол «сделал» повторён для усиления: буквально: «И сделал Ной; согласно всему, что повелел ему Бог, так он сделал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: сделал ... сделал
  rationale: Глагол עשה имеет широкое значение «делать, совершать». Повтор сохранён, поскольку он подчёркивает полное исполнение Ноем Божьего повеления.
- source_word: נֹחַ
  choice: Ной
  rationale: Традиционная и общепринятая русская передача имени נֹחַ.
- source_word: כְּכֹל אֲשֶׁר
  choice: всё так, как
  rationale: Передаёт и полноту כֹּל («всё»), и значение соответствия, выраженное предлогом כְּ («так, как; в соответствии с»).
- source_word: צִוָּה
  choice: повелел
  rationale: Глагол צוה обозначает властное распоряжение. «Повелел» точно передаёт смысл и соответствует достойному литературному регистру.
- source_word: אֹתוֹ
  choice: ему
  rationale: В русском языке при глаголе «повелеть» лицо, которому дано повеление, естественно обозначается дательным падежом.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, здесь слово согласовано с глаголом в единственном числе и обозначает единого Бога.
- source_word: כֵּן
  choice: так
  rationale: Слово возобновляет предшествующую мысль и подчёркивает точное соответствие действий Ноя Божьему повелению.
theological_decisions:
- issue: Передача повторённой формулы послушания
  choice: 'Сохранить оба употребления глагола: «сделал ... так он и сделал»'
  alternative: «Ной сделал всё, что повелел ему Бог»
  rationale: Сокращённый вариант передаёт общий смысл, но устраняет намеренный повтор עשה. Сохранение повтора подчёркивает полноту послушания Ноя, не добавляя к тексту богословского толкования.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими именами и умеренно возвышенным глаголом «повелел». Перестройка порядка слов делает фразу естественной по-русски, сохраняя полноту, соответствие повелению и смысловой повтор оригинала.
