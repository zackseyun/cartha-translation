base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: ru
  text: И увидел Яхве, что велико зло человечества на земле[a] и что каждый замысел его сердца был постоянно направлен только ко злу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что велико зло человека на земле»; еврейское אָדָם здесь употреблено собирательно и означает человечество.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «только зло весь день»; то есть постоянно, неизменно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: И увидел
  rationale: Повествовательная форма wayyiqtol продолжает последовательность событий; союз «и» сохраняет связь с контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: רַבָּה רָעַת הָאָדָם
  choice: велико зло человеческого рода
  rationale: רַבָּה указывает на огромную степень или распространённость нравственного зла, а коллективное הָאָדָם обозначает здесь человечество.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: В контексте первобытной истории אֶרֶץ означает землю в широком смысле, а не отдельную страну.
- source_word: יֵצֶר
  choice: устремление
  rationale: Слово обозначает внутреннюю направленность или формирующийся замысел; «устремление» естественно сочетается с «помыслами» и не сводит значение только к отдельному намерению.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: помыслов его сердца
  rationale: Формулировка сохраняет библейское представление о сердце как средоточии мысли, воли и желания.
- source_word: רַק רַע כָּל הַיּוֹם
  choice: лишь злом во всякое время
  rationale: Сохранены ограничительное רַק, нравственное значение רַע и идиоматический смысл כָּל הַיּוֹם — постоянство, буквально «весь день».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт личное имя и не подменяет его титулом; точное древнее произношение при этом не вполне достоверно.
- issue: Коллективное значение הָאָדָם
  choice: человеческого рода
  alternative: человека; человечества
  rationale: В данном месте слово относится ко всему человечеству. Выбранная формулировка ясно выражает коллективный смысл и сохраняет связь со словом «человек».
- issue: Всеохватность внутреннего зла
  choice: всякое устремление ... было лишь злом во всякое время
  alternative: все устремления ... постоянно были злы
  rationale: Формулировка удерживает сильные универсальные выражения оригинала, не добавляя учения о природе или степени вины за пределами самого стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены антропологический образ «сердца», всеохватность высказывания и личное имя Яхве; тяжеловесная буквальность смягчена лишь там, где она мешала бы ясности.
