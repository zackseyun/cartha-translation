source:
  edition: WLC
  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: ru
  text: Земля растлилась перед Богом[a], и земля наполнилась насилием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля была растлена в глазах Бога».'
    reason: Лִפְנֵי может означать как «перед, в присутствии», так и, по смыслу контекста, «в чьих-либо глазах».
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: растлилась
  rationale: Форма нифаля от שׁחת обозначает состояние порчи или переход в него. «Растлилась» передаёт нравственное разложение в данном контексте, не вводя внешнего деятеля, как могло бы подразумевать «была развращена».
- source_word: הָאָרֶץ
  choice: земля
  rationale: אֶרֶץ может означать как всю землю, так и страну или сушу. В повествовании о потопе основным выбран более широкий смысл «земля»; повтор слова сохранён вслед за еврейским текстом.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: перед Богом
  rationale: Выражение буквально указывает на пребывание перед лицом или в присутствии Бога и допускает смысл «в глазах Бога». «Перед Богом» кратко сохраняет образ и не устраняет эту смысловую широту.
- source_word: וַתִּמָּלֵא
  choice: наполнилась
  rationale: Форма нифаля от מלא описывает землю как ставшую полной чего-либо; русское «наполнилась» естественно передаёт и результат, и развитие повествования.
- source_word: חָמָס
  choice: насилием
  rationale: חָמָס обозначает насилие, жестокость и сопряжённое с ними беззаконие. «Насилием» прямо и ёмко передаёт основное значение, не сужая его до отдельного вида преступления.
theological_decisions:
- issue: Характер растления земли
  choice: Нравственное растление земли, то есть человеческого общества, перед Богом
  alternative: Физическая порча или разорение земли
  rationale: Ближайший контекст говорит о человеческом зле и насилии. Вместе с тем перевод сохраняет образ самой «земли» и не подменяет его пояснением о человечестве.
- issue: Смысл выражения לִפְנֵי הָאֱלֹהִים
  choice: перед Богом
  alternative: в глазах Бога
  rationale: Основной вариант сохраняет пространственно-реляционный образ еврейского выражения, тогда как примечание отмечает допустимый оценочный оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Растлилась» выбрано как ёмкое соответствие нравственной порче; повтор «земля» сохранён ради структуры и акцента оригинала.
