  source_fidelity: 'Основной смысл передан точно: קֵץ כָּל־בָּשָׂר сохранён как «конец всякой плоти», חָמָס — как «насилие», причинное מִפְּנֵיהֶם — как «из-за них», а трудная конструкция מַשְׁחִיתָם אֶת־הָאָרֶץ передана без догматического сужения и пояснена в сноске. Однако «настал предо Мною» в русском скорее означает, что событие произошло в Божьем присутствии, и недостаточно передаёт образ того, что этот конец «пришёл/предстал» перед Богом для суда.'
