  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: ru
  text: 'И сказал Бог Ною: «Конец всякой плоти предстал предо Мною, потому что из-за них земля наполнилась насилием. И вот, Я уничтожу их вместе с землёй[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская конструкция допускает также перевод: «уничтожу их и землю»; буквально: «уничтожаю их с землёй».'
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: конец всякой плоти
  rationale: Сохраняет широкий охват выражения — людей и прочих живых существ — и его значимые связи с другими местами повествования, не сужая смысл до одного человечества.
- source_word: בָּא לְפָנַי
  choice: настал предо Мною
  rationale: Передаёт наступление конца и сохраняет образ того, что дело предстало перед Богом; буквальное «пришёл предо Мною» звучало бы в современном русском неестественно.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: земля наполнилась насилием
  rationale: «Насилие» прямо передаёт חָמָס в контексте допотопного развращения, а «земля» соответствует всеобщему масштабу повествования.
- source_word: מִפְּנֵיהֶם
  choice: из-за них
  rationale: 'Предлог здесь имеет причинное значение: насилие наполнило землю по их вине.'
- source_word: וְהִנְנִי
  choice: И вот, Я
  rationale: «И вот» сохраняет указательное усиление и торжественный переход к объявлению близкого Божьего действия.
- source_word: מַשְׁחִיתָם
  choice: уничтожу их
  rationale: Причастная форма после הִנְנִי выражает предстоящее и близкое действие; каузатив глагола שׁחת в контексте суда означает уничтожение.
- source_word: אֶת־הָאָרֶץ
  choice: вместе с землёй
  rationale: Так передаётся наиболее вероятное совместное значение трудной конструкции и исключается ошибочное понимание земли как орудия уничтожения; синтаксическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Объём выражения «всякая плоть»
  choice: Широкое обозначение живых существ, оказавшихся под судом, а не только людей.
  alternative: Только всё человечество.
  rationale: В повествовании о потопе выражение כָּל־בָּשָׂר неоднократно охватывает людей и животных; буквальная формулировка сохраняет эту широту.
- issue: Значение הָאָרֶץ
  choice: земля
  alternative: страна; суша
  rationale: Всеобщая рамка повествования поддерживает «земля», хотя само еврейское слово в иных контекстах может означать страну или сушу.
- issue: Связь уничтожения живых существ и земли
  choice: их вместе с землёй
  alternative: их и землю
  rationale: Конструкция допускает понимание земли как сопутствующего объекта уничтожения или как второго прямого объекта. Основной текст передаёт первое, а сноска сохраняет второе.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Оборот «предо Мною» сохраняет судебно-пространственный образ оригинала, не делая фразу чрезмерно архаичной.
