  terminology: «Бог», «Ной», «всякая плоть», «земля», «насилие» и «уничтожу» уместны. «Всякая плоть» оправданно сохраняет широкую, не ограниченную людьми сферу выражения. Сноска надлежащим образом отмечает синтаксическую неопределённость последнего словосочетания.
