- from: Сделай для ковчега крышу[a] и сверху доведи его до одного локтя[b]. Дверь ковчега помести в его боковой стене. Устрой в нём нижний, второй и третий ярусы.
  to: Сделай для ковчега крышу[a] и заверши её сверху до размера в один локоть[b]. Дверь ковчега помести в его боковой стене. Устрой в нём нижний, второй и третий ярусы.
  rationale: Заменено неестественное «сверху доведи его до одного локтя» на более ясное «заверши её сверху до размера в один локоть». Такая редакция сохраняет неразрешённую синтаксическую и архитектурную неоднозначность исходника, не превращая возможное сужение в утверждение основного текста. Остальные формулировки источнику соответствуют и стилистически естественны.
