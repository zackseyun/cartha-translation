base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: ru
  text: Сделай для ковчега крышу[a] и заверши её сверху до размера в один локоть[b]. Дверь ковчега помести в его боковой стене. Устрой в нём нижний, второй и третий ярусы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окно» либо «световой проём». Еврейское слово встречается редко, и его точное значение неясно.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская фраза «заверши её сверху до размера в один локоть» трудна для понимания; возможно, речь идёт о том, что верх ковчега сходился до ширины в один локоть.
    reason: cultural_note
lexical_decisions:
- source_word: צֹהַר
  choice: крыша
  rationale: Редкое слово обозначает верхний элемент ковчега; по контексту «крыша» наиболее естественна, однако значения «окно» и «световой проём» остаются возможными и отмечены в сноске.
- source_word: תַּעֲשֶׂה לַתֵּבָה
  choice: сделай для ковчега
  rationale: Предлог ל указывает, что этот элемент следует устроить для ковчега; формулировка естественна по-русски и близка структуре еврейского текста.
- source_word: וְאֶל־אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: и сверху доведи его до одного локтя
  rationale: Фраза синтаксически и архитектурно неясна. Перевод сохраняет прямые компоненты «до локтя» и «сверху», не добавляя явно отсутствующего в тексте объяснения о сужении конструкции.
- source_word: פֶּתַח
  choice: дверь
  rationale: В указаниях о строительстве ковчега речь идёт о функциональном входе; «дверь» здесь естественнее общего слова «проём».
- source_word: בְּצִדָּהּ
  choice: в его боковой стене
  rationale: Так естественно передаётся расположение двери в боку ковчега; слово «стена» имплицитно уточняет конструкцию, не меняя смысла.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: нижний, второй и третий ярусы
  rationale: Формы перечисляют три уровня. «Ярусы» нейтрально описывает внутренние уровни большой конструкции и не навязывает морскую терминологию «палубы».
- source_word: תַּעֲשֶׂהָ
  choice: устрой в нём
  rationale: Женский объектный суффикс отсылает к ковчегу. В русском «устрой в нём ... ярусы» естественно выражает устройство ковчега с тремя уровнями.
