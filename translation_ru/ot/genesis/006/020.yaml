base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: ru
  text: Из птиц каждого рода, из скота каждого рода и из всех существ, ползающих по земле, каждого рода к тебе придут по двое, чтобы ты сохранил их в живых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעוֹף
  choice: птиц
  rationale: Слово עוֹף обозначает птиц или шире летающих существ; в данном перечислении естественное современное русское соответствие — «птицы».
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: каждого рода
  rationale: מִין обозначает род или категорию живых существ. Формулировка «каждого рода» передаёт классификационный смысл, не навязывая современное биологическое понятие вида.
- source_word: הַבְּהֵמָה
  choice: скота
  rationale: בְּהֵמָה в контексте противопоставлена птицам и ползающим существам и обозначает категорию наземных домашних животных; русское «скот» передаёт это кратко и естественно.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: всех ползающих по земле существ
  rationale: רֶמֶשׂ обозначает малых существ, которые движутся или ползают, а הָאֲדָמָה — землю, почву. Добавление «существ» делает выражение естественным по-русски.
- source_word: שְׁנַיִם מִכֹּל
  choice: по двое от каждого
  rationale: 'Оборот имеет распределительное значение: из каждой названной категории должны прийти два существа.'
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: придут к тебе
  rationale: Глагол בוא с אֶל выражает движение к Ною; в самой фразе прямо не сказано о входе в ковчег.
- source_word: לְהַחֲיוֹת
  choice: чтобы ты сохранил им жизнь
  rationale: Каузативная форма от חיה означает сохранение живыми. Такая формулировка ясно и естественно передаёт цель, подразумевая Ноя как того, кто сохранит животных в живых.
