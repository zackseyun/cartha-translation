  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: ru
  text: И увидел Бог землю — и вот, она была разорена[a], потому что всякая плоть извратила свой путь на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В обоих случаях в еврейском тексте употреблён один и тот же глагольный корень; он может обозначать нравственную порчу, а также разорение, повреждение или гибель.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямо передаёт повествовательную форму глагола ראה и сохраняет лаконичный ритм еврейского текста.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово обозначает единого Бога; это естественное русское соответствие.
- source_word: הָאָרֶץ
  choice: землю / на земле
  rationale: В контексте рассказа о потопе «земля» лучше передаёт широкий смысл, чем более узкое «страна» или «земля́» в значении территории.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет функцию привлечения внимания и торжественную наглядность, оставаясь естественным для современного русского повествования.
- source_word: נִשְׁחָתָה
  choice: была испорчена
  rationale: «Испорчена» допускает как нравственную порчу, так и состояние общего повреждения или разорения и тем самым не сводит значение שׁחת только к одной стороне.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину состояния земли.
- source_word: הִשְׁחִית
  choice: испортила
  rationale: Повтор того же русского корня отражает повтор שׁחת и причинную связь между состоянием земли и действием всякой плоти; форма прошедшего времени естественна в русском контексте.
- source_word: כָּל בָּשָׂר
  choice: всякая плоть
  rationale: Сохраняет широкий и намеренно не вполне определённый еврейский образ, не ограничивая его без необходимости только человечеством или всеми живыми существами.
- source_word: דַּרְכּוֹ
  choice: свой путь
  rationale: Сохраняет метафору образа жизни и поведения; возвратное местоимение естественно передаёт еврейский суффикс при собирательном выражении.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Естественно передаёт пространственное выражение и согласуется с широким контекстом потопа.
theological_decisions:
- issue: Смысл שׁחת в двух частях стиха
  choice: Использовать «была испорчена / испортила», сохранив единый корень и связь между порчей творения и поведением всякой плоти.
  alternative: «была растлена / извратила» или «была погублена / погубила»
  rationale: Первый вариант чрезмерно сужает смысл к нравственному растлению, второй — к физической гибели. «Испорчена» шире и позволяет услышать обе стороны значения, хотя сочетание «испортила свой путь» намеренно сохраняет некоторую необычность исходной метафоры.
- issue: Объём выражения כָּל בָּשָׂר
  choice: Сохранить «всякая плоть».
  alternative: «все люди» или «все живые существа»
  rationale: Еврейское выражение допускает разный объём в контексте; перевод не должен заранее устранять эту смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Тире перед «и вот» естественно выделяет увиденное Богом состояние земли. Формула «всякая плоть» сохранена как понятный традиционный библейский образ; лексический повтор «испорчена — испортила» намеренно отражает повтор одного еврейского корня.
