  to: И увидел Бог землю — и вот, она была разорена[a], потому что всякая плоть извратила свой путь на земле.
  rationale: Перевод исправлен ради естественности современного литературного русского и ясности метафоры «свой путь». «Разорена» передаёт состояние земли, не сводя значение к одной нравственной порче; «извратила свой путь» точно передаёт поведенческий смысл второй части. Примечание сохраняет значимую лексическую связь повторённого еврейского корня и его семантическую широту.
