source:
  edition: WLC
  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: ru
  text: Сделай себе ковчег из дерева гофер[a]; устрой в ковчеге отделения[b] и покрой его изнутри и снаружи смолой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из кипарисового дерева». Еврейское слово «гофер» встречается только здесь, поэтому точный вид древесины неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отсеки»; буквально: «гнёзда».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обмажь его… битумом (дёгтем)». В еврейском тексте глагол со значением нанесения покрытия и название самого покрывающего вещества — родственные слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Сделай себе
  rationale: Передаёт императив עשה и дательный личной заинтересованности לְךָ без ненужного сужения значения до «построй».
- source_word: תֵּבַת
  choice: ковчег
  rationale: Устоявшееся и понятное русское обозначение судна Ноя; также сохраняет связь с тем же особым еврейским существительным в Исходе 2, не отождествляя его с обычным словом «корабль».
- source_word: עֲצֵי גֹפֶר
  choice: из дерева гофер
  rationale: Гофер — уникальное и точно не идентифицированное название; транслитерация не выдаёт предположительный вид древесины за установленный.
- source_word: קִנִּים
  choice: отделения
  rationale: Буквально слово означает «гнёзда», но здесь образно обозначает внутренние ячейки или отсеки ковчега; «отделения» естественно и не чрезмерно технически.
- source_word: וְכָפַרְתָּ
  choice: и покрой его
  rationale: В данном не культовом контексте глагол означает нанесение покрытия; функциональное «герметизируй» было бы более толковательным.
- source_word: מִבַּיִת וּמִחוּץ
  choice: изнутри и снаружи
  rationale: Естественно передаёт обе поверхности ковчега, указанные парными предложными оборотами.
- source_word: בַּכֹּפֶר
  choice: смолой
  rationale: Обозначает материал защитного водонепроницаемого покрытия; точный состав вещества не установлен, поэтому общеупотребительное «смола» предпочтительнее более узкого «битум».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного слова «ковчег». Синтаксис краток и повелителен, как в еврейском оригинале. Неопределённость редких слов גֹפֶר и כֹּפֶר отражена в примечаниях, а не устранена догадочной конкретизацией.
