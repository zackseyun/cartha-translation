id: GEN.6.7
reference: Genesis 6:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: ru
  text: 'И сказал Яхве: «Я сотру человека[a], которого Я сотворил, с лица земли — от человека до скота, до пресмыкающихся и до небесных птиц[c], потому что Я сожалею, что создал их[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «человечество». Еврейское адам здесь может обозначать весь человеческий род; перевод «человека» сохраняет форму единственного числа и повтор того же слова далее в стихе.
    reason: lexical_alternative
  - marker: b
    text: Или «Мне скорбно оттого, что Я создал их». Еврейский глагол выражает сожаление или скорбь о прежнем действии; сам по себе он не означает, что Бог был застигнут врасплох, чего-либо не предвидел или совершил нравственную ошибку.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «птиц небес»; это обычное еврейское выражение, которое также можно перевести как «птиц небесных» или «птиц в небе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, обозначенное тетраграмматоном, в принятой русской форме.
- source_word: אֶמְחֶה
  choice: Я сотру
  rationale: Сохраняет конкретный образ удаления, стирания с поверхности, поддержанный выражением «с лица земли».
- source_word: הָאָדָם
  choice: человека
  rationale: В контексте слово имеет собирательное значение — человеческий род, но единственное число сохраняет повтор אָדָם и представительный характер исходной формулировки.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: которого Я сотворил
  rationale: Естественно передаёт относительное придаточное и завершённое действие Бога; «сотворил» уместно для повествования о творении.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Сохраняет еврейский пространственный образ; «земля» здесь обозначает сушу, почву, а не обязательно весь мир.
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמָיִם
  choice: от человека до скота, до пресмыкающихся и до небесных птиц
  rationale: Передаёт ступенчатое перечисление с повтором עַד; «скот» точно и кратко передаёт בְּהֵמָה, а «небесные птицы» сохраняет образ исходного сочетания.
- source_word: נִחַמְתִּי
  choice: Я сожалею
  rationale: Niphal от נחם здесь выражает ретроспективное сожаление или скорбь о совершённом действии. Формулировка сохраняет богословское напряжение текста, не добавляя утверждений о неожиданности, неведении или нравственной ошибке.
- source_word: כִּי עֲשִׂיתִם
  choice: что создал их
  rationale: Множественное местоимение относится к перечисленным живым существам; «создал» естественно передаёт עשה в данном контексте творения.
theological_decisions:
- issue: Божественное сожаление в נִחַמְתִּי
  choice: потому что Я сожалею, что создал их
  alternative: потому что Мне скорбно оттого, что Я создал их
  rationale: «Сожалею» прямо передаёт направленное на прежнее действие значение формы נחם и не устраняет трудность текста. Само еврейское слово не утверждает, что Бог был застигнут врасплох, чего-либо не предвидел или совершил нравственную ошибку.
- issue: Собирательное значение הָאָדָם
  choice: человека
  alternative: человечество
  rationale: Единственное число сохраняет повтор одного и того же еврейского слова в начале стиха и в последующем перечислении, тогда как примечание поясняет его собирательный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет торжественную прямую речь и ступенчатое перечисление, но избегает устаревших форм. Все примечания отмечены в основном тексте.
