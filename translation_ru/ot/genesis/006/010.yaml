  text: 'And Noah fathered three sons: Shem[a], Ham, and Japheth.'
translation:
  language: ru
  text: 'У Ноя родились три сына: Сим, Хам и Иафет.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: родились
  rationale: Каузативная форма глагола ילד сообщает, что Ной стал отцом. Русская конструкция «у Ноя родились» естественно передаёт появление у него детей, не прибегая к архаичному «родил» или тяжеловесному «породил».
- source_word: שְׁלֹשָׁה בָנִים
  choice: три сына
  rationale: בָנִים здесь означает именно сыновей, что подтверждается последующим перечислением трёх мужских имён.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Сим, Хам и Иафет
  rationale: Частица אֶת отмечает прямые дополнения; по-русски имена естественно перечислены после двоеточия. Использованы закрепившиеся в русской библейской традиции формы имён.
- source_word: נֹחַ
  choice: Ной
  rationale: Устоявшаяся русская форма древнееврейского личного имени נֹחַ.
