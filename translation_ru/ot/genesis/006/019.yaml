  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: ru
  text: А из всего живого — из всякой плоти[a] — приведи в ковчег по двое от каждого, чтобы сохранить их в живых вместе с тобой; они должны быть самцом и самкой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всякая плоть» — древнееврейское обозначение живых существ, имеющих плоть.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: А из всего живого
  rationale: Сохраняет соединительную связь с предыдущим повелением и широкое значение субстантивированного הַחַי, не сужая его заранее до конкретной группы животных.
- source_word: מִכָּל בָּשָׂר
  choice: из всякой плоти
  rationale: Передаёт повтор предлога מן и сохраняет характерный древнееврейский оборот «всякая плоть», поясняющий выражение «всё живое».
- source_word: שְׁנַיִם מִכֹּל
  choice: по двое от каждого
  rationale: 'Естественно по-русски выражает распределительное значение: из каждой подразумеваемой группы живых существ следует взять двоих.'
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: введи в ковчег
  rationale: Каузативная форма глагола передаётся прямым повелением «введи», а сочетание с направительным предлогом — движением внутрь ковчега.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: чтобы сохранить их в живых вместе с тобой
  rationale: Передаёт целевое значение инфинитива и его каузативный смысл — обеспечить продолжение жизни; местоимение «их» естественно восполняется по контексту.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: пусть это будут самец и самка
  rationale: Естественная русская формулировка сохраняет предписывающую силу конструкции и прямое обозначение биологического пола пары.
