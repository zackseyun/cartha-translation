  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: ru
  text: И Яхве пожалел[a], что создал человека[b] на земле, и почувствовал боль в сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опечалился из-за того, что создал». Еврейский глагол выражает сожаление или скорбь о совершённом прежде; сам по себе он не говорит, что Бог узнал нечто неожиданное или совершил нравственную ошибку.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть человеческий род; возможный перевод: «людей» или «человечество».'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: пожалел
  rationale: Нифаль глагола נחם с последующим כִּי, вводящим прежнее действие, выражает сожаление об этом действии. «Пожалел» сохраняет ретроспективный смысл и не смешивает его с отдельным последующим глаголом, обозначающим душевную боль.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה принятой современной русской транслитерацией, не заменяя его титулом.
- source_word: כִּי עָשָׂה
  choice: что создал
  rationale: כִּי вводит содержание сожаления, а עשה в данном контексте относится к предшествующему сотворению человека. Русское придаточное естественно передаёт это временное и смысловое отношение.
- source_word: הָאָדָם
  choice: человека
  rationale: Существительное אָדָם употреблено собирательно и обозначает человеческий род. Единственное число «человека» сохраняет форму и связь с языком повествования о сотворении; значение пояснено в примечании.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: В контексте Бытия речь идёт о земле как мире обитания людей, а не об отдельной стране; по-русски нормативно «на земле».
- source_word: וַיִּתְעַצֵּב אֶל־לִבּוֹ
  choice: и сердце его исполнилось болью
  rationale: Глагол עצב в хитпаэле выражает внутреннюю боль, а אֶל־לִבּוֹ указывает на сердце как средоточие переживания. Эта естественная русская формулировка сохраняет образ сердца и отличает боль от предшествующего сожаления.
theological_decisions:
- issue: 'Антропопатическое описание Бога: сожаление и сердечная боль'
  choice: Прямо сказать, что Яхве пожалел и что его сердце исполнилось болью.
  alternative: 'Ослабить выражение: «Яхве опечалился» или истолковать его как «Яхве решил поступить иначе».'
  rationale: Еврейский текст последовательно называет сожаление о прежнем действии и внутреннюю боль. Перевод сохраняет эту богословскую напряжённость, не добавляя ни мысли о неожиданности для Бога, ни утверждения о нравственной ошибке.
- issue: Собирательное значение הָאָדָם
  choice: «человека» в значении всего человеческого рода, с примечанием.
  alternative: «людей», «человечество» или указание только на Адама как отдельную личность.
  rationale: Контекст говорит о человеческом роде в целом. Единственное число воспроизводит форму оригинала, а примечание предотвращает ошибочное ограничение смысла одним Адамом.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным и естественным; два разных еврейских глагола переданы как «пожалел» и «исполнилось болью», чтобы сохранить двухчастное движение мысли: сожаление о совершённом и глубокую внутреннюю боль.'
