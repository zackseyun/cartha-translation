  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: ru
  text: «Выслушай нас, господин мой! Ты — князь Божий среди нас.[a] Похорони свою умершую в лучшей из наших гробниц. Никто из нас не откажет тебе в своей гробнице для погребения твоей умершей».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великий князь среди нас». Еврейское выражение «князь Божий» может употребляться как усилительный оборот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Выслушай нас
  rationale: Повелительная форма с суффиксом 1-го лица множественного числа. «Выслушай» естественно передаёт просьбу принять во внимание последующее обращение.
- source_word: אֲדֹנִי
  choice: господин наш
  rationale: Почтительное обращение к Аврааму. Русское «господин наш» сохраняет социальную учтивость; форма «наш» согласуется с коллективным говорящим, хотя еврейская форма буквально допускает «мой господин» как устойчивое обращение.
- source_word: נְשִׂיא אֱלֹהִים
  choice: князь Божий
  rationale: Сохранена буквальная конструкция «князь Бога/Божий», которая может указывать как на особый статус перед Богом, так и служить усилительным оборотом со значением «великий, могущественный князь». Последняя возможность вынесена в сноску.
- source_word: בְּתוֹכֵנוּ
  choice: среди нас
  rationale: Естественно передаёт положение Авраама в среде местного сообщества.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: в лучшей из наших гробниц
  rationale: מִבְחָר обозначает лучшее, отборное; קֶבֶר в данном контексте — гробница или место погребения.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Похорони свою умершую
  rationale: В контексте речь идёт об умершей Сарре. Русская субстантивированная форма женского рода звучит естественно и не меняет референта, хотя еврейское выражение буквально означает «твоего умершего/твою умершую».
- source_word: אִישׁ מִמֶּנּוּ
  choice: Никто из нас
  rationale: 'В сочетании с отрицанием выражение имеет распределительное значение: ни один человек из сообщества.'
- source_word: אֶת־קִבְרוֹ לֹא יִכְלֶה מִמְּךָ
  choice: не откажет тебе в своей гробнице
  rationale: כּלה в этой конструкции передаёт удержание или отказ предоставить. Русская формулировка ясно выражает обещание предоставить гробницу.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: чтобы ты мог похоронить свою умершую
  rationale: 'Предлог מִן с инфинитивом выражает предотвращаемое действие: никто не откажет в гробнице и тем самым не воспрепятствует погребению.'
theological_decisions:
- issue: Значение выражения נְשִׂיא אֱלֹהִים
  choice: В основном тексте сохранено «князь Божий».
  alternative: «великий князь» или «могущественный вождь»
  rationale: Еврейская конструкция допускает как прямую связь статуса Авраама с Богом, так и идиоматическое усилительное значение. Перевод не должен молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и заметной учтивостью переговорной речи. «Гробница» соответствует контексту семейных мест погребения лучше, чем более общее «могила». Повтор «похоронить свою умершую» сохранён вслед за повтором исходного текста.
