lexical_decisions:
- source_word: וַיָּקָם
  choice: Тогда Авраам встал
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность событий, а «встал» — основное значение קום.
- source_word: מֵעַל פְּנֵי
  choice: от
  rationale: Буквально выражение означает удаление «от лица/присутствия»; в данном контексте русское «встал от» естественно обозначает, что Авраам отошёл от тела умершей.
- source_word: מֵתוֹ
  choice: своей умершей
  rationale: Еврейский текст буквально говорит «его умершей/его мёртвой», не повторяя имени Сарры и существительного «жена». Субстантивированное «умершей» сохраняет эту сжатость, а «своей» передаёт притяжательный суффикс.
- source_word: וַיְדַבֵּר אֶל
  choice: и обратился к
  rationale: Так естественно по-русски передаётся обращённая к адресатам речь; последующее לֵאמֹר позволяет избежать тяжеловесного сочетания «говорил... говоря».
- source_word: בְּנֵי חֵת
  choice: сынам Хета
  rationale: Сохранено буквальное родовое обозначение «сыны Хета», а общеупотребительное этническое соответствие вынесено в примечание.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Оборот вводит содержание речи в следующем стихе; двоеточие ясно обозначает эту связь в современном русском тексте.
