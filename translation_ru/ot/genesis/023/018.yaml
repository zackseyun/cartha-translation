- source_word: לְאַבְרָהָם לְמִקְנָה
  choice: перешли во владение Авраама
  rationale: В контексте юридической сделки сочетание выражает результат приобретения. Глагольная формулировка естественно продолжает синтаксис предыдущего стиха и передаёт переход имущества во владение Авраама.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Сохраняет образ еврейской идиомы и одновременно ясно выражает публичность сделки и присутствие свидетелей.
- source_word: בְנֵי חֵת
  choice: сынов Хета
  rationale: Буквально передаёт родоплеменное обозначение «сыны Хета»; контекстуальный вариант «хеттеев» приведён в сноске.
- source_word: בְּכֹל בָּאֵי
  choice: у всех входивших
  rationale: Причастная конструкция обозначает всех приходивших к городским воротам; русский вариант сохраняет её обобщённый характер.
- source_word: שַׁעַר עִירוֹ
  choice: в ворота его города
  rationale: Передаёт конструкцию буквально и сохраняет городской контекст места публичных и правовых дел.
