  source_fidelity: 'Текст точно передаёт וַיִּשְׁתַּחוּ אַבְרָהָם לִפְנֵי עַם הָאָרֶץ: Авраам совершает почтительный телесный жест перед местным народом. «Тогда» адекватно передаёт повествовательное продвижение wayyiqtol, не добавляя нового смыслового содержания.'
