  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: ru
  text: Тогда Авраам поклонился перед народом той земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся перед народом той земли».'
    reason: 'Лексическая альтернатива: וַיִּשְׁתַּחוּ может описывать более глубокий поклон, вплоть до простирания ниц.'
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Форма глагола שׁחה обозначает почтительный поклон. В контексте переговоров это жест уважения к людям, а не поклонение Богу; русский глагол «поклонился» естественно сохраняет это значение.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сочетание с פָּנִים означает «перед, в присутствии». Краткое «перед» точно и естественно по-русски.
- source_word: עַם הָאָרֶץ
  choice: народ той земли
  rationale: Сочетание обозначает местное население, в присутствии которого совершается сделка. Указательное «той» в современном русском ясно связывает землю с уже известной из контекста местностью.
- source_word: וַ
  choice: Тогда
  rationale: Вав при форме wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность действий.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Использована устоявшаяся русская форма библейского имени.
