lexical_decisions:
- source_word: וַיִּהְיוּ חַיֵּי שָׂרָה
  choice: Сарра прожила
  rationale: Естественно передаёт идиоматическое указание на продолжительность жизни, не меняя смысла еврейского выражения «и были годы жизни Сарры».
- source_word: מֵאָה שָׁנָה וְעֶשְׂרִים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: сто двадцать семь лет
  rationale: Современная русская форма точно передаёт суммарный возраст; повтор слова «год» в еврейском тексте является структурной особенностью, буквальное воспроизведение которой по-русски звучало бы неестественно.
- source_word: שְׁנֵי חַיֵּי שָׂרָה
  choice: таковы были годы жизни Сарры
  rationale: Сохраняет итоговое повторение и торжественную завершённость исходной формулы.
