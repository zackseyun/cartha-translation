  - severity: medium
    issue: Неестественная аспектуальная конструкция «И он говорил с ними, сказав».
    rationale: В русском деепричастие совершенного вида «сказав» плохо сочетается с несовершенным повествовательным «говорил»; еврейское לֵאמֹר в такой конструкции естественно передаётся двоеточием после «сказал им».
  - severity: low
    issue: «Убрал её с глаз моих» излишне конкретизирует и разговорно переосмысливает מִלְּפָנַי.
    rationale: Исходный оборот связан с погребением и означает удаление умершей из присутствия говорящего; «удалив её от себя» сохраняет эту связь более нейтрально.
