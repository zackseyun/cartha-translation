  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: ru
  text: 'И он сказал им: «Если вы желаете, чтобы я похоронил мою покойную, удалив её от себя, выслушайте меня и походатайствуйте[a] за меня перед Ефроном, сыном Цохара».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратитесь от моего имени к Ефрону».'
    reason: Глагол פגע в сочетании с предлогом ב может обозначать встречу или обращение к кому-либо, а в этом контексте — просьбу, переданную через посредников.
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: И он говорил с ними, сказав
  rationale: Сохраняет значение דבר с предлогом, указывающим на разговор с собеседниками, и отдельную функцию לֵאמֹר как введения прямой речи; форма остаётся понятной в современном литературном русском.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Если вы желаете
  rationale: Еврейская идиома буквально упоминает «душу/самих вас», но здесь выражает желание и согласие; русский оборот передаёт волевой смысл без неестественного буквализма.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: чтобы я похоронил мою умершую
  rationale: Субъект инфинитива определяется контекстом как Авраам. Субстантивированное «умершую» сохраняет отсутствие слова «жена» в еврейском тексте, а женский род обусловлен Саррой и русской грамматикой.
- source_word: מִלְּפָנַי
  choice: и убрал её с глаз моих
  rationale: Передаёт буквальный образ «от лица/из присутствия моего» в погребальном контексте. Добавленное местоимение лишь делает синтаксис естественным по-русски, не уточняя личность умершей сверх грамматического рода.
- source_word: שְׁמָעוּנִי
  choice: выслушайте меня
  rationale: В контексте просьбы речь идёт не только о физическом слышании, но о внимательном принятии обращения; «выслушайте» естественно и точно передаёт императив.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: и походатайствуйте за меня перед Ефроном
  rationale: פגע с ב в данном переговорном контексте означает обратиться к человеку с просьбой в пользу другого. «Походатайствуйте» выражает это, а сноска сохраняет более широкую возможность простого обращения от имени Авраама.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: Ефроном, сыном Цохара
  rationale: Использованы укоренившиеся русские формы библейских имён и прозрачно передано родственное обозначение בן.
