  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: ru
  text: Тогда Авраам встал и поклонился народу той земли — сынам Хета[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хеттеям». Буквально: «сынам Хета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Тогда Авраам встал
  rationale: Форма Qal wayyiqtol от קום обозначает вставание и продолжает последовательность повествования; «тогда» естественно передаёт последовательный waw.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Форма от שׁחה обозначает низкий поклон или простирание. «Поклонился» естественно передаёт почтительный телесный жест, не уточняя без необходимости глубину поклона.
- source_word: לְעַם הָאָרֶץ
  choice: народу той земли
  rationale: Сохранено буквальное обозначение местных жителей; указательное «той» уместно в данном контексте и звучит естественнее, чем отвлечённое «народу земли».
- source_word: לִבְנֵי חֵת
  choice: сынам Хета
  rationale: Сохранено буквальное генеалогическое наименование этнической группы. Приложение поясняет, кого именно обозначает «народ той земли».
- source_word: חֵת
  choice: Хет
  rationale: Имя собственное передано традиционной русской библейской транслитерацией.
