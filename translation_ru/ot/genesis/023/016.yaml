  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: ru
  text: Авраам послушал Ефрона и отвесил ему серебро в сумме, названной Ефроном при сынах Хета[a], — четыреста сиклей серебра, ходового у торговцев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при хеттеях»; буквально: «при сынах Хета».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «принимаемого торговцами» или «по принятому у торговцев весу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: Авраам послушал Ефрона
  rationale: Оборот שׁמע אל означает «слушать, внимать, послушаться». «Послушал» естественно передаёт принятие названных условий, не превращая глагол в более определённое «согласился».
- source_word: וַיִּשְׁקֹל
  choice: отвесил
  rationale: Глагол обозначает взвешивание серебра как платёжного металла; «отвесил» сохраняет конкретную торговую практику до чеканки монет.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: Сохранено прямое значение слова и историческая материальная форма платежа, а не обобщённое «деньги».
- source_word: אֲשֶׁר דִּבֶּר
  choice: о котором тот сказал
  rationale: Источник буквально говорит о серебре, которое Ефрон «сказал» при свидетелях. Русская конструкция сохраняет необычную формулировку оригинала, оставаясь понятной в контексте названной суммы.
- source_word: בְּאָזְנֵי
  choice: при
  rationale: Буквально «в уши». Русское «при» кратко и естественно передаёт публичное произнесение в присутствии и при слышании свидетелей.
- source_word: בְנֵי חֵת
  choice: сыны Хета
  rationale: Сохранена буквальная родовая формула Бытия; общеупотребительный этноним дан в примечании.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: четыреста сиклей серебра
  rationale: Переданы древняя весовая единица и материал платежа без модернизации.
- source_word: עֹבֵר לַסֹּחֵר
  choice: ходившего у торговцев
  rationale: Фраза, вероятно, указывает на серебро, принимаемое в торговом обороте. Такое выражение сохраняет коммерческий образ и не сводит неоднозначный оборот лишь к норме веса; варианты пояснены в примечании.
