base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: ru
  text: И умерла Сарра в Кириаф-Арбе, то есть Хевроне[a], в земле Ханаана; и пришёл Авраам оплакивать Сарру и плакать о ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кириаф-Арба здесь отождествляется с Хевроном.
    reason: cross_reference
lexical_decisions:
- source_word: וַתָּמָת
  choice: умерла
  rationale: Прямо передаёт обычное значение מות, не смягчая ясного сообщения о смерти.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: в Кириаф-Арбе
  rationale: Название места передано традиционной русской библейской формой, остающейся узнаваемой для современного читателя; предлог и падеж отражают еврейскую конструкцию.
- source_word: הִוא חֶבְרוֹן
  choice: то есть в Хевроне
  rationale: Местоименная пояснительная конструкция отождествляет Кириаф-Арбу с Хевроном; добавление предлога по нормам русского языка делает географическое пояснение естественным.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохраняет явно выраженное אֶרֶץ и передаёт географическое название естественной традиционной русской формой.
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: בוא допускает «пришёл» или «пошёл» в зависимости от точки зрения; «пришёл» естественно следует повествовательной перспективе и не вводит лишней пространственной конкретики.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: оплакивать Сарру
  rationale: ספד обозначает траурное оплакивание, нередко сопровождаемое причитанием. «Оплакивать» точно и естественно передаёт действие и его объект.
- source_word: וְלִבְכֹּתָהּ
  choice: и плакать о ней
  rationale: בכה прямо означает «плакать»; местоименный суффикс женского рода передан как «о ней», что сохраняет личный объект скорби.
