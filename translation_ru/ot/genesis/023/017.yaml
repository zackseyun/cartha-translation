lexical_decisions:
- source_word: וַיָּקָם
  choice: было закреплено за Авраамом
  rationale: В контексте купли-продажи глагол קום имеет юридический смысл утверждения или перехода владения. Дополнение «за Авраамом» проясняется последующим стихом и делает русскую фразу естественной, не меняя юридического содержания.
- source_word: שְׂדֵה עֶפְרוֹן
  choice: поле Ефрона
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции, обозначающей принадлежность поля Ефрону до сделки.
- source_word: בַּמַּכְפֵּלָה
  choice: в Махпеле
  rationale: Название местности передано транслитерацией; предлог «в» естественно обозначает расположение поля в названном месте.
- source_word: לִפְנֵי מַמְרֵא
  choice: напротив Мамре
  rationale: Сохраняет пространственный смысл «перед, напротив» без необоснованного уточнения стороны света.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: само поле, пещера на нём
  rationale: Передаёт повторное перечисление объектов сделки в юридически точной и естественной русской форме.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: и все деревья на поле
  rationale: Собирательное единственное הָעֵץ после כָל естественно передаётся по-русски множественным числом.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: в пределах всей его границы кругом
  rationale: Сохраняет полноту территориального охвата и формальный характер описания участка.
