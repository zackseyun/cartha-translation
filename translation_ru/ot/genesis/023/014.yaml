lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Форма wayyiqtol от ענה в повествовательном диалоге вводит ответную реплику; «ответил» прямо и естественно передаёт последовательность разговора.
- source_word: עֶפְרוֹן
  choice: Ефрон
  rationale: Устоявшаяся русская передача еврейского личного имени.
- source_word: אֶת אַבְרָהָם
  choice: Аврааму
  rationale: Хотя אֵת обычно маркирует прямое дополнение, при ענה лицо, которому отвечают, в современном русском естественно обозначается дательным падежом; имя передано в его традиционной русской форме.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитивная конструкция вводит последующую прямую речь; «говоря» сохраняет структуру еврейского выражения и остаётся понятным в библейском повествовательном регистре.
- source_word: לוֹ
  choice: ему
  rationale: Местоименный суффикс относится к Аврааму; «ему» сохраняет местоименную форму оригинала без поясняющего расширения.
