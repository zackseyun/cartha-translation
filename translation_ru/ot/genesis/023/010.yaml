    rationale: בְּאָזְנֵי בְנֵי־חֵת буквально задаёт публичность ответа по отношению к сынам Хета, тогда как לְכֹל בָּאֵי שַׁעַר עִירוֹ отдельно называет всех входивших в городские ворота. Формулировка «в присутствии ... перед всеми» сохраняет обе части без добавочного целевого оттенка «так, чтобы».
