base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: ru
  text: 'Ефрон сидел среди сынов Хета[a], и Ефрон-хеттеянин ответил Аврааму в присутствии сынов Хета, перед всеми, кто входил в ворота его города:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди хеттеян». Буквально по-еврейски здесь и далее: «сыны Хета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: сидел
  rationale: Причастие описывает положение Ефрона в момент происходящего; русское несовершенное «сидел» естественно передаёт фоновое, продолжающееся состояние.
- source_word: בְּתוֹךְ בְּנֵי חֵת
  choice: среди сынов Хета
  rationale: «Среди» естественно выражает присутствие внутри собравшейся группы, а «сыны Хета» сохраняет форму еврейского родового наименования.
- source_word: וַיַּעַן
  choice: ответил
  rationale: Обычное и точное обозначение ответной реплики в повествовательном диалоге.
- source_word: הַחִתִּי
  choice: хеттеянин
  rationale: Передаёт этническое обозначение Ефрона и сохраняет отличие от родового выражения «сыны Хета».
- source_word: בְּאָזְנֵי
  choice: так, чтобы слышали
  rationale: Еврейская идиома буквально связана со слухом и обозначает публичное высказывание в присутствии свидетелей; выбранная формулировка естественна по-русски.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: и все входившие в ворота его города
  rationale: Фраза называет всех присутствовавших у городских ворот публичных свидетелей; союз «и» объединяет их с ранее названными сынами Хета как тех, кто слышал ответ.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В современном русском двоеточие естественно вводит прямую речь следующего стиха и функционально передаёт еврейское «сказав».
