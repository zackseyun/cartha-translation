base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: ru
  text: После этого Авраам похоронил свою жену Сарру в пещере в поле Махпелы, напротив Мамре[a] (то есть в Хевроне), в земле Ханаан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Мамре». Еврейское выражение обозначает местоположение перед Мамре или напротив него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Обычный повествовательный переход со значением «после этого, затем»; выбран естественный современный русский оборот, сохраняющий последовательность событий.
- source_word: קָבַר
  choice: похоронил
  rationale: Прямое и общеупотребительное соответствие еврейскому глаголу «хоронить».
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: свою жену Сарру
  rationale: Русский порядок слов естественно передаёт отношение принадлежности и одновременно сохраняет имя и указание на супружество.
- source_word: אֶל מְעָרַת
  choice: в пещере
  rationale: Предлог אֶל буквально указывает направление «к, в», но при глаголе погребения русская норма требует обозначения места формой «в пещере».
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: в пещере на поле Махпела
  rationale: Конструктивная цепочка обозначает пещеру, связанную с полем Махпела. Формулировка «на поле» ясна и естественна по-русски и согласуется с описанием владения в контексте главы.
- source_word: הַמַּכְפֵּלָה
  choice: Махпела
  rationale: Название места передано транслитерацией; еврейский артикль в русском топониме отдельно не выражается.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: напротив Мамре
  rationale: Выражение обозначает пространственное положение перед другим местом или напротив него; «напротив» сохраняет пространственный смысл без необоснованного уточнения стороны света.
- source_word: הִוא חֶבְרוֹן
  choice: то есть Хеврона
  rationale: Оборот поясняет, что упомянутый Мамре соотнесён с Хевроном; русская пояснительная конструкция передаёт это естественно.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохранено явно присутствующее в еврейском тексте слово «земля» и традиционное, но понятное современному читателю географическое наименование.
