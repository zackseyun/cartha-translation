    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: перешли
  rationale: В контексте юридически оформленной покупки глагол קום указывает на признанный переход имущества к новому владельцу. «Перешли» естественно передаёт этот смысл по-русски, не прибегая к буквальному и неясному «встали».
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Прямое соответствие названию приобретённого земельного участка.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: и находившаяся на нём пещера
  rationale: Сохраняет относительную конструкцию и отнесение местоименного суффикса к полю; такая формулировка естественна для современного русского языка.
- source_word: לְאַבְרָהָם
  choice: в собственность Авраама
  rationale: В сочетании с юридическим значением קום выражает Авраама как нового законного владельца.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: как место для погребения
  rationale: Передаёт назначение владения для захоронения; имущественный оттенок אֲחֻזָּה уже ясно выражен словами «в собственность Авраама».
- source_word: מֵאֵת
  choice: от
  rationale: Естественно обозначает прежних владельцев и источник передачи имущества.
- source_word: בְּנֵי חֵת
  choice: сынов Хета
  rationale: Формально прозрачно сохраняет родовое обозначение древнееврейского текста; контекстуальный этноним «хеттеи» указан в примечании.
