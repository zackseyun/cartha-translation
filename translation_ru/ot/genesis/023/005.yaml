lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: И ответили
  rationale: Форма Qal wayyiqtol от ענה продолжает повествование и вводит ответ; «ответили» естественно передаёт диалогический контекст.
- source_word: בְנֵי חֵת
  choice: сыны Хета
  rationale: Сохраняет буквальное родовое обозначение «сыновья/сыны Хета» и личное имя Хет; более привычный русский библейский оборот «сыны» уместен в торжественном повествовательном регистре.
- source_word: אֶת אַבְרָהָם
  choice: Аврааму
  rationale: Хотя אֶת отмечает прямое дополнение, русский глагол «ответить» нормативно требует дательного падежа, поэтому синтаксическая роль естественно передана формой «Аврааму».
- source_word: לֵאמֹר לוֹ
  choice: ':'
  rationale: Еврейская формула буквально означает «сказав ему» и вводит последующую прямую речь. В современном русском двоеточие передаёт эту функцию без тяжеловесного повтора «сказав ему», поскольку адресат уже выражен словом «Аврааму».
