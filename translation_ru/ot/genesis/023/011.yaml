  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: ru
  text: '«Нет[a], господин мой, выслушай меня: поле я отдаю тебе[b], и пещеру, которая в нём, отдаю тебе. В присутствии моих соплеменников[c] я отдаю её тебе. Похорони свою умершую».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Не так, господин мой; выслушай меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейские формы можно также перевести прошедшим временем: «я отдал тебе», однако здесь они, вероятно, выражают совершаемую в данный момент передачу.'
    reason: grammatical_note
  - marker: c
    text: 'Буквально: «на глазах у сынов моего народа»; то есть публично, перед свидетелями из его общины.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: Нет
  rationale: В данном диалоге это вежливое возражение или поправка к предложению Авраама, а не отвлечённое отрицание. «Нет» естественно звучит в современной русской прямой речи.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Сохраняет почтительное обращение и социальную учтивость переговоров, не придавая ему значения рабского подчинения.
- source_word: שְׁמָעֵנִי
  choice: выслушай меня
  rationale: Императив выражает просьбу внимательно принять сказанное. «Выслушай меня» естественнее в русском контексте переговоров, чем буквальное «услышь меня».
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Прямое обозначение участка земли; в контексте сделки речь идёт о конкретном поле.
- source_word: נָתַתִּי לָךְ / נְתַתִּיהָ לָךְ
  choice: я отдаю тебе / я отдаю её тебе
  rationale: 'Формы перфекта здесь имеют перформативную силу: словами Ефрон совершает или публично заявляет передачу имущества. Русское настоящее время ясно передаёт этот смысл.'
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: пещеру, которая в нём
  rationale: Явно сохраняется пространственная связь пещеры с полем; местоимение «нём» относится к полю.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: в присутствии моих соплеменников
  rationale: Еврейская идиома буквально означает «на глазах у сынов моего народа» и указывает на публичность передачи перед свидетелями общины. Выбран естественный современный русский эквивалент.
- source_word: קְבֹר מֵתֶךָ
  choice: похорони свою умершую
  rationale: Прямой императив завершает предложение. Хотя еврейское выражение формально допускает общее «твоего умершего», контекст однозначно указывает на Сарру; русская форма естественно передаёт эту контекстуальную соотнесённость.
