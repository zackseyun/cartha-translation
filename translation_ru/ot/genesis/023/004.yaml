  terminology: «Участок для погребения в собственность» сохраняет имущественный оттенок אֲחֻזַּת קֶבֶר. «Свою умершую» оправдано непосредственным контекстом смерти Сарры, не вводя её имени в реплику Авраама. Примечание к этому выражению следует формулировать как контекстуальную русскую передачу, поскольку еврейская форма буквально означает «моего умершего».
