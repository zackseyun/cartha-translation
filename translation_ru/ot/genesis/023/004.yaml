  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: ru
  text: Я чужеземец и временный житель среди вас. Дайте мне у вас участок для погребения в собственность[a], чтобы я мог похоронить свою умершую, чтобы её больше не было передо мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «владение для могилы». Речь идёт не просто о месте для могилы, а о закреплённом земельном владении для погребения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица моего» или «из предо мною».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: чужеземец
  rationale: Слово обозначает человека, живущего вне своей родной земли и рода и не имеющего полных прав на землю. «Чужеземец» естественно передаёт происхождение извне и положение Авраама среди хеттов.
- source_word: וְתוֹשָׁב
  choice: и поселенец
  rationale: Слово дополняет גֵּר, подчёркивая проживание в данной местности без наследственного земельного владения и статуса коренного жителя. «Поселенец» сохраняет социально-правовой оттенок пары.
- source_word: עִמָּכֶם
  choice: у вас / среди вас
  rationale: Первое употребление передано идиоматическим русским «у вас» применительно к проживанию, второе — «среди вас» применительно к приобретению погребального участка в их земле.
- source_word: תְּנוּ לִי
  choice: дайте мне
  rationale: Прямой императив נתן передан без лишнего уточнения способа передачи; последующий контекст главы раскрывает условия приобретения.
- source_word: אֲחֻזַּת קֶבֶר
  choice: участок в собственность для погребения
  rationale: אֲחֻזָּה означает не просто место, а закреплённое земельное владение. Формулировка сохраняет важный для главы имущественно-правовой смысл и остаётся понятной современному читателю.
- source_word: וְאֶקְבְּרָה
  choice: чтобы я мог похоронить
  rationale: Когортатив после просьбы выражает цель; конструкция с «чтобы» естественно передаёт этот оттенок по-русски.
- source_word: מֵתִי
  choice: мою умершую
  rationale: Еврейское выражение буквально означает «мою умершую / моего умершего» и называет умершего члена семьи, не повторяя имени Сарры. Женский род в русском обусловлен известным из контекста референтом.
- source_word: מִלְּפָנַי
  choice: с глаз моих
  rationale: Буквально «от лица моего / от того, что передо мной»; русский оборот «с глаз моих» сохраняет пространственный образ и передаёт контекстуальный смысл.
