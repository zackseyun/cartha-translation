  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: ru
  text: 'И он обратился к Ефрону в присутствии народа той земли со словами: «Если бы ты только выслушал меня![a] Я даю серебро за поле — возьми его у меня,[b] чтобы я мог похоронить там мою умершую».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Только послушай меня!»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Я дал серебро за поле». Еврейский перфект здесь, вероятно, выражает официально совершаемое предложение платы; возможен также перевод: «Я дам серебро за поле».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר אֶל־עֶפְרוֹן
  choice: И он обратился к Ефрону
  rationale: Глагол דבר обозначает речь, а конструкция с אֶל — обращение к собеседнику. «Обратился» естественно передаёт официально-публичный характер переговоров, не сводя выражение к нейтральному «сказал».
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: в присутствии народа той земли
  rationale: Буквально речь звучит «в ушах народа земли», то есть публично, так, чтобы местное сообщество слышало. Русская формулировка сохраняет общественно-правовой контекст сделки без буквализма «в ушах».
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Если бы ты только выслушал меня!
  rationale: Эллиптическое сочетание частиц и формы שמע выражает настойчивую, но вежливую просьбу. Сослагательная конструкция с «только» сохраняет оттенок пожелания, а «выслушал» естественно звучит в русском диалоге.
- source_word: נָתַתִּי כֶּסֶף הַשָּׂדֶה
  choice: Я даю серебро за поле
  rationale: 'Перфект נָתַתִּי в речи о сделке, вероятно, имеет перформативную силу: Авраам официально предлагает плату. Настоящее «даю» передаёт это значение; «серебро» сохраняет конкретную денежную лексику оригинала.'
- source_word: קַח מִמֶּנִּי
  choice: возьми его у меня
  rationale: Местоимение «его» восполняет очевидный из контекста объект — серебро — и делает русскую фразу грамматически естественной, не усиливая значение до более толковательного «прими плату».
- source_word: וְאֶקְבְּרָה
  choice: чтобы я мог похоронить
  rationale: Когортатив выражает намерение и цель Авраама. Целевая конструкция естественно связывает принятие платы с последующим погребением.
- source_word: מֵתִי
  choice: мою умершую
  rationale: Буквально — «мою умершую / моего умершего», устойчивое обозначение умершего близкого. В данном контексте речь идёт о Сарре, поэтому русский женский род необходим для естественного и точного выражения референта.
- source_word: שָׁמָּה
  choice: там
  rationale: Прямой и естественный эквивалент указательного наречия места.
