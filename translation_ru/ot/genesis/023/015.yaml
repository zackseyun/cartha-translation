  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: ru
  text: '— Господин мой, послушай меня: участок земли стоимостью в четыреста сиклей серебра — что это между нами с тобой? Похорони умершую.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Господин мой
  rationale: Почтительное обращение к Ефрону, а не божественный титул; сохраняет социальную учтивость и форму единственного числа.
- source_word: שְׁמָעֵנִי
  choice: послушай меня
  rationale: Естественно передаёт повелительную форму שׁמע как настойчивую, но вежливую просьбу.
- source_word: אֶרֶץ
  choice: земля
  rationale: В контексте сделки означает конкретный земельный участок; последующее указание цены ясно задаёт имущественный смысл.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: ценой в четыреста сиклей серебра
  rationale: Слово «ценой» естественно раскрывает эллиптическое указание стоимости, не добавляя нового содержания.
- source_word: בֵּינִי וּבֵינְךָ מַה הִוא
  choice: что это для нас с тобой?
  rationale: Передаёт риторическое преуменьшение суммы и личный характер переговоров; «для нас с тобой» звучит по-русски естественнее буквального «между мной и тобой».
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Похорони свою умершую
  rationale: В контексте речь идёт о Сарре, поэтому субстантивированное причастие женского рода естественно и точно передаёт מֵתְךָ; союз וְ не требует отдельного русского связующего слова перед заключительным повелением.
