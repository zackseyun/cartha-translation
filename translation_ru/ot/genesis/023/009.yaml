base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: ru
  text: пусть он отдаст мне пещеру Махпелы, которая принадлежит ему и находится на краю его поля.[a] Пусть при вас отдаст её мне за полную плату серебром[b] в собственность для погребения.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце его поля». Еврейское выражение может означать край, конец или оконечность поля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за полное серебро», то есть за полную цену.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как собственность для погребения». Еврейское слово подчёркивает законное владение, а не только право пользоваться местом для погребения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: пусть он отдаст
  rationale: Имперфект в контексте просьбы имеет побудительное значение; «пусть отдаст» естественно передаёт просьбу о передаче собственности.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: пещеру Махпелу
  rationale: Конструкция с собственным именем передана принятой русской формой; винительный падеж обусловлен глаголом «отдаст».
- source_word: אֲשֶׁר לוֹ
  choice: которая принадлежит ему
  rationale: Ясно выражает принадлежность и сохраняет имущественно-правовой оттенок переговоров.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: находится на краю его поля
  rationale: קָצֶה обозначает край, конец или оконечность; «на краю» естественно по-русски и не уточняет положение сверх исходного текста.
- source_word: בְּכֶסֶף מָלֵא
  choice: за полную плату серебром
  rationale: Передаёт идиому о полной, неуменьшенной цене и сохраняет прямое упоминание серебра как средства платежа.
- source_word: יִתְּנֶנָּה
  choice: пусть ... отдаст её мне
  rationale: Сохраняет повтор глагола נתן и женский объектный суффикс, относящийся к пещере; платёжный оборот ясно показывает, что речь не о безвозмездном даре.
- source_word: בְּתוֹכְכֶם
  choice: при вас
  rationale: В данном публично-правовом контексте выражает совершение и признание сделки в присутствии общины естественнее буквального «среди вас».
- source_word: לַאֲחֻזַּת קָבֶר
  choice: во владение для погребения
  rationale: אֲחֻזָּה означает закреплённое владение или собственность; формулировка сохраняет юридический смысл и назначение участка.
