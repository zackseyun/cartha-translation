base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: ru
  text: 'Тогда она позвала мужчин своего дома и сказала им: «Посмотрите, он привёл к нам еврея, чтобы тот насмехался над нами[a]. Он пришёл ко мне, чтобы лечь со мной, а я громко закричала».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы посмеяться над нами», «чтобы позабавиться за наш счёт». Древнееврейский глагол может означать насмешку или унизительную забаву; в этом обвинении возможен и сексуальный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: она позвала мужчин из своего дома
  rationale: Форма אַנְשֵׁי — мужского рода и указывает именно на мужчин; оборот «из своего дома» естественно передаёт принадлежность к домашнему окружению, не добавляя отсутствующего в тексте уточнения «слуги».
- source_word: רְאוּ
  choice: Посмотрите
  rationale: Современный естественный императив, привлекающий внимание слушателей без архаического оттенка.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: он привёл к нам еврея
  rationale: Каузативная форма בוא передана глаголом «привёл», а לָנוּ — словами «к нам». Существительное אִישׁ вместе с этнонимом по-русски естественно выражается словом «еврея»; мужской пол однозначен из формы слова и контекста.
- source_word: לְצַחֶק בָּנוּ
  choice: чтобы тот издевался над нами
  rationale: צחק с предлогом ב может обозначать насмешку или обращение с кем-либо как с предметом забавы; «издевался над нами» сохраняет обвинительный характер и допускает присутствующий в контексте оттенок унижения, не сводя выражение только к сексуальному насилию.
- source_word: בָּא אֵלַי
  choice: Он пришёл ко мне
  rationale: Нейтрально и точно передаёт בוא с אֶל, не добавляя прямо не выраженного указания на вход в комнату.
- source_word: לִשְׁכַּב עִמִּי
  choice: чтобы лечь со мной
  rationale: Сохранён прозрачный древнееврейский эвфемизм сексуальной близости; в контексте обвинения его смысл понятен без разговорного «переспать».
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: а я громко закричала
  rationale: «Закричала» соответствует чрезвычайной ситуации, а «громко» естественно передаёт выражение «громким/великим голосом». Союз «а» сохраняет последовательность и одновременно естественно обозначает противопоставление заявленной попытке.
