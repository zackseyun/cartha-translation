  source_fidelity: '«Издевался над нами» несколько усиливает לְצַחֶק בָּנוּ: глагол прежде всего означает насмешку, осмеяние или обращение с кем-либо как с предметом забавы. В данном контексте возможен оттенок унизительного, в том числе сексуально окрашенного, обращения, но его следует оставить в примечании, а не делать основным значением. «Насмехаться над нами» точнее сохраняет широту исходного выражения. «Мужчин своего дома» точнее, чем «мужчин из своего дома», передаёт אַנְשֵׁי בֵיתָהּ как мужчин её домашнего окружения.'
