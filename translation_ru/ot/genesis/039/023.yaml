  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: ru
  text: Начальник темницы не следил ни за чем из того, что было поручено Иосифу[a], потому что Яхве был с ним, и всему, что он делал, Яхве давал успех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не видел ничего из того, что было в его руке»; «в руке» означает «в ведении, под ответственностью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё, что он делал, Яхве делал успешным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: начальник темницы
  rationale: שַׂר обозначает начальника или должностное лицо, а не рядового стражника; «начальник темницы» естественно передаёт административную роль.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: не следил ни за чем
  rationale: В контексте речь не о буквальном зрении, а о том, что начальник не проверял вверенные Иосифу дела и не занимался ими лично.
- source_word: בְּיָדוֹ
  choice: из того, что было поручено Иосифу
  rationale: Буквально «в его руке»; это древнееврейская идиома, обозначающая находящееся в чьём-либо ведении. Имя уточняет референта местоимения без изменения смысла.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: потому что Яхве был с ним
  rationale: בַּאֲשֶׁר здесь естественно понимать причинно; русская конструкция ясно передаёт основание доверия начальника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: всему, что он делал
  rationale: Относительная конструкция охватывает всякую деятельность Иосифа; дательный оборот согласован с русским выражением «давать успех».
- source_word: מַצְלִיחַ
  choice: давал успех
  rationale: Каузативная форма Hiphil указывает, что Яхве обеспечивал успешный исход дел Иосифа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблён тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Источник успеха Иосифа
  choice: Яхве давал успех всему, что делал Иосиф
  alternative: всё, что делал Иосиф, преуспевало
  rationale: Выбранная формулировка сохраняет каузативное значение מַצְלִיחַ и прямо называет Яхве действующим источником успеха.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Темница» сохраняет исторический колорит и остаётся общепонятной; синтаксис сделан естественным для современного читателя.
