  source_fidelity: 'Перевод верно передаёт структуру и смысл еврейского текста: начальник темницы не осуществлял надзора за тем, что было в ведении Иосифа, поскольку Яхве был с Иосифом; Яхве же даровал успех всему, что Иосиф делал. Причинное «потому что» для בַּאֲשֶׁר уместно, а «давал успех» сохраняет каузативный смысл מַצְלִיחַ.'
