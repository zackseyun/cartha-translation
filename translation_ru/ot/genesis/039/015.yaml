lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: И когда он услышал
  rationale: Повествовательная конструкция וַיְהִי с временным оборотом естественно передаётся по-русски придаточным времени; союз «и» сохраняет последовательность рассказа.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного.
- source_word: הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  choice: я закричала
  rationale: Сочетание буквально говорит о повышении голоса и возгласе; «закричала» естественно и ёмко передаёт единое действие в данном контексте, а буквальная форма сохранена в сноске.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: оставил свою одежду
  rationale: Сохраняется единственное число собирательного русского существительного и указание на принадлежность одежды.
- source_word: אֶצְלִי
  choice: рядом со мной
  rationale: Передаёт основное пространственное значение предлога, не исключая значения «у меня», отмеченного в сноске.
- source_word: וַיָּנָס
  choice: выбежал
  rationale: В контексте бегства из дома глагол передаёт поспешное удаление; идея бегства сохраняется вместе с последующим указанием наружу.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: и скрылся снаружи
  rationale: Передаёт выход наружу без тяжеловесного повтора «выбежал и вышел»; последовательность двух еврейских глаголов сохранена.
