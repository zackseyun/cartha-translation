lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Еврейская повествовательная формула вводит последующее событие. Такой перевод сохраняет временную связь и естественно звучит по-русски.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: устремила взгляд на
  rationale: Буквально выражение означает «подняла глаза к», но в данном контексте передаёт направленное, заинтересованное внимание. «Устремила взгляд» сохраняет образность, не добавляя прямо не названных чувств.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: жена его господина
  rationale: Конструкция обозначает женщину через её отношение к господину Иосифа. Формулировка близка к еврейскому тексту и сохраняет ясную отсылку местоимения.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Использована устоявшаяся русская форма библейского имени, понятная современному читателю.
- source_word: שִׁכְבָה עִמִּי
  choice: Ложись со мной
  rationale: Прямое повеление в контексте является недвусмысленным сексуальным предложением. Перевод сохраняет лаконичность и прямоту еврейского выражения, не усиливая его грубость.
