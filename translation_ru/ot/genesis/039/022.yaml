base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: ru
  text: И начальник темницы вверил Иосифу всех заключённых, находившихся в темнице, и всё, что там делали, делал он.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всем, что там делалось, ведал он». Еврейский текст подчёркивает, что Иосиф отвечал за всю работу в темнице; это не обязательно означает, что каждое дело он выполнял лично.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: начальник темницы
  rationale: שַׂר обозначает начальника или должностное лицо, ведающее темницей. Такой перевод точен, естественен и соответствует контексту.
- source_word: בְּיַד יוֹסֵף
  choice: вверил Иосифу
  rationale: Буквально «[отдал] в руку Иосифа» — идиома передачи под власть, надзор и ответственность. «Вверил Иосифу» естественно передаёт её смысл.
- source_word: כָּל הָאֲסִירִם
  choice: всех заключённых
  rationale: אֲסִירִים в данном контексте означает людей, содержащихся в темнице; «заключённые» — ясный современный эквивалент.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: и всё, что там делали
  rationale: 'Множественное причастие עֹשִׂים имеет неопределённый субъект: речь идёт обо всей деятельности в темнице без уточнения исполнителей.'
- source_word: הוּא הָיָה עֹשֶׂה
  choice: делал он
  rationale: Поставленное отдельно הוּא подчёркивает Иосифа, а היה с причастием выражает продолжительное или обычное действие. Инверсия сохраняет эмфазу, не утяжеляя русский текст.
theological_decisions:
- issue: Делал ли Иосиф лично всю работу или отвечал за её выполнение
  choice: Основной текст сохраняет буквальную формулировку «делал он», а примечание поясняет возможный смысл руководства и ответственности.
  alternative: «всем, что там делалось, распоряжался он»
  rationale: Еврейская формулировка приписывает Иосифу всю совершаемую там деятельность, но контекст допускает как непосредственное исполнение, так и распорядительную ответственность. Не следует без пояснения устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Темница» сохраняет связь с ближайшим контекстом и при этом остаётся понятным словом; синтаксис сделан ясным, а заключительная инверсия передаёт эмфазу оригинала.
