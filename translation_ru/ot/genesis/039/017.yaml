    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: И она пересказала ему
  rationale: Нарративный wayyiqtol продолжает последовательность событий; «пересказала» естественно вводит повтор обвинения мужу, сохраняя местоимение исходного текста.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: всё теми же словами
  rationale: Оборот указывает на соответствие её рассказа прежним словам; русская формулировка передаёт сравнительное כ и множественное דְּבָרִים без буквализма.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная древнееврейская формула введения цитаты естественно передаётся русской пунктуацией без избыточного «говоря».
- source_word: הָעֶבֶד הָעִבְרִי
  choice: раб-еврей
  rationale: «Раб» точно отражает зависимое положение Иосифа; приложение через дефис сохраняет этническое обозначение и пренебрежительный оттенок речи женщины.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: которого ты привёл к нам
  rationale: Сохранены обращённый к мужу укор и форма первого лица множественного числа.
- source_word: בָּא אֵלַי
  choice: пришёл ко мне
  rationale: Передано простое движение к говорящей без внесения более явного сексуального эвфемизма, чем допускает сама конструкция.
- source_word: לְצַחֶק בִּי
  choice: чтобы надругаться надо мной
  rationale: В данном обвинительном контексте צחק с בְּ подразумевает враждебное и, вероятно, сексуально оскорбительное действие; «надругаться» сохраняет серьёзность обвинения, не уточняя конкретное действие.
