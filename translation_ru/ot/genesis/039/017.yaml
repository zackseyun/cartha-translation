  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: ru
  text: 'И она сказала ему примерно так: «Раб-еврей, которого ты привёл к нам, пришёл ко мне, чтобы насмехаться надо мной[a]».'
