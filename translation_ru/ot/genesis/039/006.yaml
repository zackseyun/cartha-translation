  - severity: low
    issue: «статен»
    rationale: Слово возможно, но чаще характеризует осанку, высокий рост или представительность. «Строен» точнее и естественнее передаёт יְפֵה תֹאַר как привлекательное телосложение, сохраняя различие с «красив».
