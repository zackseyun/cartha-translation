    text: 'Буквально: «хлеба». Здесь «хлеб», вероятно, означает пищу вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не знал с ним ничего». Вероятно, то есть не занимался ничем из того, что было поручено Иосифу.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: оставил
  rationale: Сохраняет основное значение глагола עזב; в данном контексте естественно подразумевает передачу имущества и дел в ведение Иосифа.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: всё, что у него было
  rationale: Передаёт всеобъемлющий характер выражения, не сужая его до одних материальных владений.
- source_word: בְּיַד יוֹסֵף
  choice: в руках Иосифа
  rationale: Сохраняет еврейский образ руки как обозначение распоряжения и ответственности; русское выражение понятно и естественно.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: и при нём ни о чём не заботился
  rationale: 'Передаёт контекстуальный смысл: при Иосифе хозяину не приходилось следить за делами. Необычная буквальная конструкция отмечена в сноске, чтобы сохранить её неоднозначность.'
- source_word: כִּי אִם
  choice: кроме
  rationale: Кратко и естественно обозначает единственное исключение.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: пищи, которую ел
  rationale: לֶחֶם буквально означает «хлеб», но здесь, вероятнее всего, употреблено шире — о пище или еде вообще. Буквальный вариант сохранён в сноске.
- source_word: וַיְהִי יוֹסֵף
  choice: Иосиф же был
  rationale: Частица «же» естественно отмечает переход к описанию Иосифа и подготавливает следующий эпизод.
- source_word: יְפֵה תֹאַר
  choice: статен
  rationale: Передаёт привлекательность телосложения или фигуры естественным современным русским словом.
- source_word: וִיפֵה מַרְאֶה
  choice: красив
  rationale: Передаёт привлекательную внешность и вместе со словом «статен» сохраняет смысловое различие двух параллельных характеристик.
