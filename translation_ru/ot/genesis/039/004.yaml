  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: ru
  text: Иосиф снискал его благосклонность и служил ему. Тот поставил Иосифа над своим домом и отдал ему в руки всё, что имел.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал в его руку», то есть доверил Иосифу и передал под его управление.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו
  choice: Иосиф снискал его благосклонность
  rationale: Передаёт устойчивое еврейское выражение «нашёл благоволение в его глазах» естественным современным русским языком, сохраняя смысл положительного расположения хозяина к Иосифу.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: и служил ему
  rationale: Прямое и контекстуально точное обозначение личной службы Иосифа Потифару.
- source_word: וַיַּפְקִדֵהוּ עַל בֵּיתוֹ
  choice: Тот поставил Иосифа над своим домом
  rationale: Глагол выражает назначение к надзору; «дом» сохраняет образ оригинала и может охватывать всё домашнее хозяйство. Имена участников уточнены лишь настолько, насколько нужно для устранения неестественной русской цепочки местоимений.
- source_word: וְכָל יֶשׁ־לוֹ
  choice: всё, что имел
  rationale: Естественно и полно передаёт совокупность имущества и дел хозяина.
- source_word: נָתַן בְּיָדוֹ
  choice: отдал ему в руки
  rationale: Сохраняет еврейский образ руки как власти, распоряжения и попечения; значение пояснено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно формальной библейской интонацией. Разделение на два предложения и форма «Тот поставил Иосифа» устраняют местоименную двусмысленность, не добавляя нового участника. Образ «в руки» сохранён, а его административный смысл раскрыт в сноске.
