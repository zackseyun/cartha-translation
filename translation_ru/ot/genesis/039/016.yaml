  text: So she kept his garment beside her until his master came home.
translation:
  language: ru
  text: Она положила его одежду возле себя и оставила её там, пока его господин не пришёл домой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: оставила
  rationale: Глагол נוח в каузативной форме здесь означает, что она положила одежду рядом с собой и продолжала держать её там; «оставила» естественно передаёт результативное состояние.
- source_word: בִּגְדוֹ
  choice: его одежду
  rationale: בֶּגֶד обозначает одежду или предмет одежды; контекст не уточняет её вид, поэтому более конкретное название не вводится.
- source_word: אֶצְלָהּ
  choice: у себя
  rationale: Буквально «рядом с ней»; в данном контексте речь о том, что одежда оставалась при ней. «У себя» звучит естественно и не добавляет лишней конкретики.
- source_word: עַד בּוֹא אֲדֹנָיו אֶל בֵּיתוֹ
  choice: до тех пор, пока его господин не вернулся домой
  rationale: 'Буквально: «до прихода его господина в его дом». По-русски «вернулся домой» естественно выражает приход хозяина в собственный дом; местоимение «его» при «господин» относится к Иосифу.'
