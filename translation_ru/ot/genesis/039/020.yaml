  terminology: «Господин Иосифа» адекватно передаёт земного хозяина/господина Иосифа в контексте рабского положения, не превращая титул в божественное обращение. «Темница» допустима в умеренно библейском регистре. Примечания корректно объясняют термин сохар и повтор корня אסר.
