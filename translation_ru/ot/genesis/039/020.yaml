base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: ru
  text: Господин Иосифа взял его и поместил в темницу[a] — место, где содержались царские узники[b]. И он был там, в темнице.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в дом сохара»; сохар — вероятно, египетское обозначение темницы или места содержания под стражей.'
    reason: cultural_note
  - marker: b
    text: 'В еврейском тексте дважды употреблён один корень со значением «связывать, заключать»: буквально — «где узники царя были заключены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: господин Иосифа
  rationale: В данном повествовательном контексте אֲדֹנֵי обозначает земного хозяина Иосифа, а не божественный титул. «Господин Иосифа» естественно для современного литературного русского языка и соответствует положению Иосифа как раба.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное значение לקח — «взять». Более сильное «схватил» внесло бы отсутствующую в еврейском глаголе экспрессию.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: отдал в
  rationale: В сочетании с направительным אֶל глагол נתן здесь передаёт помещение или передачу человека в место заключения. «Отдал в темницу» естественно по-русски и уместно в контексте заключения под стражу.
- source_word: בֵּית הַסֹּהַר
  choice: темница
  rationale: Выражение обозначает место заключения. «Темница» сохраняет достоинство библейского повествования, оставаясь понятным современному читателю; буквальное воспроизведение «дом сохара» было бы непрозрачным.
- source_word: מְקוֹם אֲשֶׁר
  choice: место, где
  rationale: Сохраняется явное пояснительное приложение еврейского текста, а не свёртывается до одного относительного наречия.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: держали узников царя
  rationale: Смысл корня אסר — связывать, заключать, держать под стражей. Русская формулировка передаёт содержание без тяжеловесного повторения «заключённые были заключены», а примечание отмечает повтор корня в оригинале.
- source_word: וַיְהִי שָׁם
  choice: И был он там
  rationale: Прямо передаёт состояние и местонахождение Иосифа, не добавляя значения длительности, которое появилось бы в варианте «оставался».
- source_word: בְּבֵית הַסֹּהַר
  choice: в темнице
  rationale: Повтор названия места сохранён, поскольку он присутствует в еврейском тексте и завершает стих с акцентом на заключении Иосифа.
