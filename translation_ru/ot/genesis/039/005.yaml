source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: ru
  text: И с того времени, как он поставил его над своим домом и над всем, что у него было[a], Яхве благословил дом египтянина благодаря Иосифу, и благословение Яхве пребывало на всём, что у него было[b], в доме и в поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И с тех пор, как он поручил ему свой дом и всё, что у него было».'
    reason: Возможна более идиоматичная передача מֵאָז и управленческого значения הִפְקִיד.
  - marker: b
    text: 'Или: «на всём, что у него было, — и в доме, и в поле».'
    reason: Пунктуационно-синтаксическая альтернатива яснее показывает, что заключительная пара раскрывает полный охват владений.
lexical_decisions:
- source_word: מֵאָז
  choice: с того времени, как
  rationale: Передаёт исходную временную точку и естественно связывается по-русски с последующим личным глаголом.
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ לוֹ
  choice: поставил его над своим домом и над всем, что у него было
  rationale: Глагол в породе hифиль обозначает поручение надзора или управления; «поставил над» ясно выражает делегированную власть. Различие предлогов בְּ и עַל сглажено ради естественной русской конструкции, но сфера управления сохранена.
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Сохраняет прямое значение ברך и явное приписывание благополучия Божьему благословению, не сводя его лишь к материальному успеху.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בֵּית הַמִּצְרִי
  choice: дом египтянина
  rationale: Естественная русская передача сочетания, которое может охватывать и жилище, и домашнее хозяйство египтянина.
- source_word: בִּגְלַל יוֹסֵף
  choice: ради Иосифа
  rationale: 'Кратко и естественно передаёт причинное значение: благословение пришло в связи с Иосифом и благодаря его присутствию.'
- source_word: בִּרְכַּת יְהוָה ... בְּכָל אֲשֶׁר יֶשׁ לוֹ
  choice: благословение Яхве пребывало на всём, что у него было
  rationale: Русское «пребывало на» естественно выражает устойчивое наличие благословения и сохраняет образ благословения, распространяющегося на всё имущество.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: в доме и в поле
  rationale: Сохраняет конкретную меризматическую пару домашних и сельскохозяйственных владений без поясняющего расширения в основном тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет эту особенность текста и является принятой современной научной передачей предполагаемого произношения.
- issue: Характер благословения дома египтянина
  choice: Сохранено прямое утверждение, что Яхве благословил его дом ради Иосифа
  alternative: Передать как простое материальное процветание
  rationale: Текст прямо называет действие Яхве благословением и связывает его с Иосифом; перевод не уточняет сверх сказанного ни заветный статус египтянина, ни точный механизм благословения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Начальное «И» сохраняет повествовательную связь с предыдущим стихом. Формулировки доступны широкому читателю; конкретные образы «дом» и «поле» сохранены.
