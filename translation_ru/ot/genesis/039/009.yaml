source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: ru
  text: Нет никого выше меня в этом доме[a], и он ничего от меня не удержал, кроме тебя, потому что ты его жена. Как же я могу совершить это великое зло[b] и согрешить против Бога?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Нет в этом доме никого великого более меня»; речь идёт о положении Иосифа в доме и хозяйстве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «это великое нечестие» либо «этот тяжкий проступок». Древнееврейское רָעָה может обозначать зло, нечестие или дурной поступок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: Нет никого выше меня
  rationale: Конструкция אֵין с прилагательным отрицает наличие кого-либо более великого или высокого по положению; в контексте речь о ранге Иосифа в доме.
- source_word: בַּבַּיִת הַזֶּה
  choice: в этом доме
  rationale: בַּיִת здесь охватывает дом и домашнее хозяйство Потифара; русский оборот сохраняет образ оригинала и естественно допускает оба оттенка.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: ничего от меня не удержал
  rationale: חָשַׂךְ означает удерживать или оставлять недоступным, а מְאוּמָה под отрицанием — «ничего».
- source_word: כִּי אִם אוֹתָךְ
  choice: кроме тебя
  rationale: כִּי אִם после отрицания вводит единственное исключение.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: потому что ты его жена
  rationale: Сочетание вводит основание исключения; причинная связь ясно и естественно передаётся союзом «потому что».
- source_word: וְאֵיךְ
  choice: Как же я могу
  rationale: וְאֵיךְ вводит нравственный вывод из сказанного; частица «же» передаёт связь и риторическую силу вопроса.
- source_word: אֶעֱשֶׂה
  choice: совершить
  rationale: Хотя עשה буквально означает «делать», с существительным «зло» глагол «совершить» звучит в современном русском естественно и сохраняет общий характер действия.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: это великое зло
  rationale: רָעָה может обозначать зло, нечестие или дурной поступок; «великое зло» сохраняет нравственный вес и структуру древнееврейского выражения.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: и согрешить против Бога
  rationale: Глагол חטא с ל здесь обозначает грех против кого-либо; «против Бога» — естественное русское соответствие.
theological_decisions:
- issue: Референт אֱלֹהִים в речи Иосифа
  choice: Бога
  alternative: бога / некоего божества
  rationale: В повествовании Бытия Иосиф говорит о Боге, Которому поклоняется; нравственное измерение поступка выходит за рамки проступка против хозяина. Написание с прописной буквы соответствует этому контексту.
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным регистром. Сохранены риторический вопрос, нравственная сила выражения и широкое значение слова «дом».
