  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: ru
  text: И когда я повысила голос и закричала, он оставил свою одежду[a] возле меня и убежал наружу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою накидку». Еврейское слово בֶּגֶד — общее обозначение предмета одежды и не уточняет, что именно на нём было.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: И когда я повысила
  rationale: Оборот וַיְהִי с כַּהֲרִימִי вводит временное придаточное; русское «и когда» естественно передаёт ход повествования. Женский род глагола обусловлен тем, что эти слова произносит жена Потифара.
- source_word: קוֹלִי
  choice: голос
  rationale: В сочетании с формой от רום существительное קוֹל образует обычное выражение «повысить голос».
- source_word: וָאֶקְרָא
  choice: и закричала
  rationale: קרא может означать «звать», «взывать», «кричать»; в рассказе о поднятой тревоге «закричала» естественно выражает настойчивый громкий зов, не добавляя его адресата.
- source_word: וַיַּעֲזֹב
  choice: он оставил
  rationale: עזב здесь означает, что Иосиф оставил предмет одежды, когда бежал; нейтральное «оставил» точно передаёт действие.
- source_word: בִּגְדוֹ
  choice: свою одежду
  rationale: בֶּגֶד — общее обозначение предмета одежды и не уточняет его вид. Возвратное «свою» естественно указывает на принадлежность подлежащему.
- source_word: אֶצְלִי
  choice: возле меня
  rationale: 'אצל обозначает близость: «рядом, возле». Такой перевод сохраняет пространственный смысл и не сводит выражение однозначно к владению.'
- source_word: וַיָּנָס הַחוּצָה
  choice: и убежал наружу
  rationale: נוס передаёт бегство, а направительное הַחוּצָה — движение изнутри наружу. Формулировка сохраняет оба компонента.
