base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: ru
  text: И когда она день за днём говорила Иосифу, он не слушал её, не соглашаясь лечь рядом с ней[a] или быть с ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лечь с ней». В данном контексте еврейский глагол может иметь сексуальный смысл; перевод «лечь рядом с ней» сохраняет пространственное значение выражения и не сливает его со следующими словами «быть с ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И
  rationale: В данном контексте повествовательная форма связывает этот стих с предыдущим и вводит продолжающееся развитие событий. Простое «И» естественно передаёт эту функцию в современном русском без архаичного «и было».
- source_word: כְּדַבְּרָהּ ... יוֹם יוֹם
  choice: день за днём она говорила
  rationale: Конструкция с כְּ имеет временное значение, а повтор יוֹם יוֹם выражает настойчиво повторяющееся действие. Русское «день за днём» естественно передаёт длительность и повторяемость.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Использована закрепившаяся в русской библейской и литературной традиции форма имени, понятная современному читателю.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: но он не слушал её
  rationale: שׁמע с אֶל означает слушать или внимать кому-либо. «Не слушал её» сохраняет широту выражения, а союз «но» естественно обозначает противопоставление её настойчивости его отказу.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: не соглашался лечь рядом с ней
  rationale: שׁכב допускает как буквальное значение лежания, так и сексуальный смысл, тогда как אֵצֶל имеет пространственное значение «рядом, возле». Формулировка сохраняет оба смысловых уровня в контексте соблазнения; «не соглашался» связывает инфинитив с отказом слушать её.
- source_word: לִהְיוֹת עִמָּהּ
  choice: и быть с ней
  rationale: Буквальное и широкое выражение, которое не сводит отказ Иосифа только к половому акту и сохраняет самостоятельную силу второй фразы.
theological_decisions:
- issue: Соотношение двух заключительных выражений
  choice: 'Сохранены два отдельных действия: «лечь рядом с ней» и «быть с ней».'
  alternative: Объединить их в одно прямое указание на половую связь.
  rationale: 'Еврейский текст ставит рядом два инфинитивных оборота. Их раздельная передача сохраняет возможное расширение смысла: Иосиф избегал как предложенного действия, так и компрометирующего пребывания с ней.'
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Избегаются архаизмы и излишне прямое толкование сексуального подтекста; двусмысленность исходного выражения сохранена и пояснена в сноске.
