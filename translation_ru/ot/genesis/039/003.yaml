  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: ru
  text: Его господин увидел, что Яхве с ним и что Яхве даёт ему успех во всём, что он делает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его руке». Это выражение может обозначать сферу его деятельности или то, что находится в его ведении; также возможно: «через него» или «под его руководством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямое повествовательное значение ראה; в контексте подразумевает распознавание по результатам, но не требует поясняющего перевода «заметил».
- source_word: אֲדֹנָיו
  choice: его господин
  rationale: Речь о Потифаре как о хозяине Иосифа; «господин» естественно передаёт социальное положение в данном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אִתּוֹ
  choice: с ним
  rationale: Кратко и естественно передаёт присутствие Яхве с Иосифом, сохраняя местоименную связь с контекстом.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: всему, что он делает
  rationale: Сохраняет всеохватность выражения и незавершённый, повторяющийся характер деятельности без тяжеловесности.
- source_word: מַצְלִיחַ
  choice: даёт успех
  rationale: 'Передаёт каузативное значение формы породы hifil: именно Яхве приводит дела Иосифа к успеху.'
- source_word: בְּיָדוֹ
  choice: в его руках
  rationale: Сохраняет конкретный образ еврейского выражения; русское множественное число соответствует естественной идиоме, а возможные оттенки орудийности и сферы ответственности отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Степень смыслового уточнения בְּיָדוֹ
  choice: сохранить образ «в его руках» в основном тексте
  alternative: через него; под его руководством
  rationale: Еврейская формулировка допускает оттенки орудийности, посредничества и сферы ведения; конкретный образ не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сохраняет повтор имени Яхве и подчёркивает его действие; еврейский образ «в руке» передан естественной русской формой «в руках».
