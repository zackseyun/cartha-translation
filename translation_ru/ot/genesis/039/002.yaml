base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: ru
  text: Яхве был с Иосифом, и он был преуспевающим человеком[a]. Он находился в доме своего египетского господина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «успешным человеком». Еврейское причастие может обозначать того, кто преуспевает или достигает успеха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֶת יוֹסֵף
  choice: с Иосифом
  rationale: Оборот означает присутствие Яхве рядом с Иосифом и подразумеваемое повествованием благоволение, не делая этот подтекст отдельным утверждением.
- source_word: אִישׁ מַצְלִיחַ
  choice: успешным человеком
  rationale: Причастие от צלח обозначает того, кто преуспевает или достигает успеха; «успешный» не сводит смысл исключительно к материальному достатку.
- source_word: בְּבֵית
  choice: в доме
  rationale: Сохраняет конкретный пространственный образ еврейского текста; в контексте он может включать и принадлежность к домашнему хозяйству.
- source_word: אֲדֹנָיו
  choice: своего господина
  rationale: В данном контексте слово обозначает человека, имеющего власть над Иосифом; «господин» естественно передаёт социальное отношение, не смешивая его с божественным именем.
- source_word: הַמִּצְרִי
  choice: египтянина
  rationale: Передаёт определение хозяина по происхождению в естественной русской форме «господина-египтянина».
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: был ... стал ... находился
  rationale: Передаёт последовательность трёх повествовательных форм היה современным русским языком, избегая тяжеловесного троекратного повторения «был».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит собственное имя Бога. Форма «Яхве» сохраняет его как имя, тогда как «Господь» заменяет имя титулом.
- issue: Связь успеха Иосифа с присутствием Яхве
  choice: Сохранить два последовательных утверждения без добавленного причинного союза
  alternative: «Поэтому Иосиф преуспевал»
  rationale: Контекст ясно связывает присутствие Яхве с успехом Иосифа, однако еврейский текст выражает это последовательностью предложений, а не явным причинным союзом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор имени «Иосиф» вместо местоимения устраняет возможную неясность после конструкции «Яхве был с Иосифом». Второе предложение сохраняет отдельность заключительной еврейской клаузы.
