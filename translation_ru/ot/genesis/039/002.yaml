- from: Яхве был с Иосифом, и Иосиф стал успешным человеком[a]. Он находился в доме своего господина-египтянина.
  to: Яхве был с Иосифом, и он был преуспевающим человеком[a]. Он находился в доме своего египетского господина.
  rationale: Правка сохраняет последовательность трёх еврейских клауз и не добавляет причинной связи. «Преуспевающим» точнее отражает мַצְלִיחַ без сужения до материального благополучия; «египетского господина» естественно передаёт הַמִּצְרִי как определение к אֲדֹנָיו.
