  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: ru
  text: 'И случилось однажды[a]: он вошёл в дом, чтобы заняться своей работой, а никого из людей дома в доме не было.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как в этот день»; вероятный смысл — «в один из таких дней» или «однажды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось
  rationale: Сохраняет повествовательную формулу и последовательность событий, не прибегая к архаичному «и было».
- source_word: כְּהַיּוֹם הַזֶּה
  choice: однажды[a]
  rationale: В данном контексте выражение обозначает некую конкретную оказию; естественное русское «однажды» передаёт функцию идиомы, а буквальная форма отмечена в сноске.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: он вошёл в дом
  rationale: Глагол בוא с направительным окончанием указывает на движение внутрь дома; «вошёл» кратко и естественно передаёт это значение.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: чтобы заняться своей работой
  rationale: מְלָאכָה означает работу или служебное занятие; выбранная формулировка естественна для бытового и управленческого контекста.
- source_word: מֵאַנְשֵׁי הַבַּיִת
  choice: из домашних слуг
  rationale: Буквально «из людей/мужчин дома»; в контексте дома Потифара речь, вероятнее всего, о домашней прислуге. Слово אִישׁ в отрицательной конструкции может означать «никто», поэтому русская формулировка не обязана подчёркивать мужской пол.
- source_word: שָׁם בַּבָּיִת
  choice: там, в доме
  rationale: Передаёт и שָׁם «там», и בַּבָּיִת «в доме», сохраняя локативное усиление без неестественного повтора.
