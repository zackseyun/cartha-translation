  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: ru
  text: Но Яхве был с Иосифом, проявил к нему неизменную любовь[a] и даровал ему благоволение в глазах начальника темницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верную милость»; также возможно: «доброту». Еврейское слово חֶסֶד обозначает неизменную любовь, верность, милость или доброту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: וַיְהִי ... אֶת
  choice: был с
  rationale: Естественно передаёт еврейскую конструкцию присутствия и поддержки и сохраняет повторяющуюся формулу повествования об Иосифе.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: проявил к нему неизменную любовь
  rationale: Идиома означает оказать или явить חֶסֶד. «Проявил» естественно по-русски, а «неизменная любовь» передаёт устойчивую, верную благосклонность, не вводя отсутствующего в стихе прямого упоминания завета.
- source_word: חִנּוֹ
  choice: благоволение
  rationale: В данном контексте обозначает благосклонное принятие Иосифа другим человеком; «благоволение» сохраняет возвышенный, но понятный регистр.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохраняет прозрачную и понятную по-русски еврейскую идиому.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: начальник темницы
  rationale: Передаёт должностное значение שַׂר и место заключения без излишней конкретизации его административной роли.
- source_word: וַ
  choice: Но
  rationale: В начале стиха союз выражает смысловой контраст между заключением Иосифа и продолжающимся присутствием Яхве.
theological_decisions:
- issue: Смысл חָסֶד применительно к отношению Яхве к Иосифу
  choice: неизменная любовь
  alternative: верная милость; доброта; заветная верность
  rationale: חָסֶד включает верность, любовь и благосклонность. Основной вариант передаёт устойчивость этого отношения, но не утверждает прямо формальный завет, который в ближайшем контексте не назван; допустимые оттенки сохранены в сноске.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет в русском тексте личное имя Бога и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формулировка сохраняет образ «в глазах», но избегает неестественного буквального оборота для וַיֵּט. Слово «темница» выбрано как понятное и достойное по стилю обозначение места заключения.
