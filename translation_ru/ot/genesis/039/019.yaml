  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: ru
  text: 'Когда его господин услышал слова своей жены, сказанные ему: «Вот что сделал со мной твой раб», — он разгневался.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Когда ... услышал
  rationale: Конструкция вводит следующее событие и обозначает временное обстоятельство. В русском повествовании естественное «когда» передаёт эту связь без тяжеловесного «и случилось».
- source_word: אֲדֹנָיו
  choice: его господин
  rationale: Речь о Потифаре как владельце и главе дома; «господин» точно передаёт социальное отношение и соответствует повествовательному регистру.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: слова своей жены, сказанные ему
  rationale: Сохраняется существительное «слова» и относительная связь, но оборот оформлен естественно для современного русского языка.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: Вот что
  rationale: Выражение указывает на содержание или характер обвинения; «вот что» естественно передаёт его указательную силу, не уточняя обвинение сверх еврейского текста.
- source_word: עָשָׂה לִי
  choice: сделал со мной
  rationale: Глагол передан нейтрально, а לִי — без усиления до «против меня». Русское «сделал со мной» в данном контексте звучит естественнее буквального «сделал мне».
- source_word: עַבְדְּךָ
  choice: твой раб
  rationale: עבד допускает значения «раб» и «слуга», однако в контексте принадлежности Иосифа дому Потифара «раб» яснее передаёт его несвободный статус.
- source_word: וַיִּחַר אַפּוֹ
  choice: он разгневался
  rationale: Еврейская идиома буквально описывает разгорающийся гнев. Русское «разгневался» точно и достойно передаёт смысл; буквальное «его гнев разгорелся» также возможно, но здесь менее естественно после длинного придаточного.
