  register: Современный литературный русский язык с достоинством прямой речи. Формулировка «при мне не заботится» сохраняет присутствующее в еврейском тексте אִתִּי и не устраняет полностью синтаксическую неоднозначность; «Послушайте» передаёт функцию הֵן без архаичного «вот».
