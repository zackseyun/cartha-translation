base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: ru
  text: 'Но он отказался и сказал жене своего господина: «Вот, мой господин не вникает в то, что происходит в доме[a], и всё, что у него есть, отдал в мои руки[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не знает со мной, что в доме»; то есть предоставил домашние дела Иосифу и сам в них не вникает.'
    reason: idiom_explanation
  - marker: b
    text: 'Или: «доверил мне». Буквально: «отдал в мою руку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Но он отказался
  rationale: Глагол означает отказ; союз «но» естественно передаёт противопоставление домогательству, описанному в предыдущем стихе.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: и сказал жене своего господина
  rationale: Естественная русская передача конструкции принадлежности, сохраняющая социальное положение Иосифа.
- source_word: הֵן
  choice: Послушайте
  rationale: Частица привлекает внимание к последующему объяснению; форма вежливого обращения уместна для речи Иосифа к жене господина.
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: В контексте домашнего рабства слово обозначает хозяина Иосифа; «господин» звучит естественно и не смешивается с божественным титулом.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: при мне не заботится о том, что в доме
  rationale: Сохраняется необычное אִתִּי «со мной/при мне», а идиома לא ידע передаётся по смыслу как отсутствие необходимости вникать в домашние дела.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: и всё, что у него есть
  rationale: Точно и естественно обозначает совокупность имущества господина.
- source_word: נָתַן בְּיָדִי
  choice: отдал в мои руки
  rationale: Сохраняет конкретный образ еврейского выражения и одновременно ясно сообщает о передаче управления.
theological_decisions: []
