base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: ru
  text: Иосиф был уведён в Египет, и египтянин Потифар, придворный чиновник[a] фараона, начальник стражи, купил его у измаильтян, которые привели его туда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнух». Еврейское слово может означать как придворного чиновника, так и евнуха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: был уведён
  rationale: 'Хофал от ירד выражает каузативно-пассивное действие: Иосифа заставили отправиться вниз, в Египет. «Был уведён» естественно передаёт несвободное перемещение и сохраняет традиционный мотив движения в Египет, расположенный ниже по отношению к Ханаану.'
- source_word: מִצְרָיְמָה
  choice: в Египет
  rationale: Направительный суффикс указывает на движение к Египту; по-русски естественно «в Египет».
- source_word: וַיִּקְנֵהוּ
  choice: купил его
  rationale: В контексте продажи Иосифа קנה прямо обозначает покупку; простой глагол сохраняет торговый и рабовладельческий характер действия.
- source_word: סְרִיס פַּרְעֹה
  choice: царедворец фараона
  rationale: סְרִיס может означать как евнуха, так и придворного должностного лица. «Царедворец» естественно обозначает человека при дворе и не утверждает спорный физиологический смысл; альтернатива дана в сноске.
- source_word: שַׂר הַטַּבָּחִים
  choice: начальник стражи
  rationale: Титул мог обозначать начальника царской охраны либо исполнителей казней. Устоявшееся «начальник стражи» ясно передаёт высокий силовой пост, не делая спорную функцию излишне конкретной.
- source_word: אִישׁ מִצְרִי
  choice: египтянин
  rationale: Русское существительное естественно передаёт сочетание «мужчина/человек египетский» без стилистически тяжеловесного «египетский мужчина».
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: у измаильтян
  rationale: Буквально «из руки измаильтян»; при глаголе покупки русский язык идиоматически требует «купил у».
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: которые привели его туда
  rationale: Относительное придаточное относится к измаильтянам; «туда» сохраняет שָׁמָּה. «Привели» передаёт каузативное движение к уже названному Египту без неестественного русского «свели вниз».
theological_decisions:
- issue: Значение סְרִיס в титуле Потифара
  choice: В основном тексте — «царедворец фараона»
  alternative: «евнух фараона»
  rationale: Еврейское слово допускает и придворно-служебное, и физиологическое значение. Контекст уверенно указывает на должность, но не позволяет окончательно исключить значение «евнух», поэтому оно сохранено в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательной прозы. Порядок приложений слегка перестроен ради естественного русского синтаксиса: национальность Потифара поставлена перед именем, а его должности следуют после него. Начальное וְ передано без добавления «теперь» или «и вот».'
