  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: ru
  text: 'Она схватила его за одежду[a] и сказала: «Ложись со мной!»[b] Но он оставил свою одежду в её руке, убежал и вышел наружу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за его одеяние», «за его плащ». Древнееврейское слово обозначает предмет одежды без точного указания его вида.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Переспи со мной!» Буквально древнееврейская идиома использует «ложись» в значении сексуального предложения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: она схватила его
  rationale: Глагол תפשׂ обозначает решительное физическое действие — крепко взять или схватить; «схватила» естественно и выразительно передаёт внезапность действия.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: за одежду / свою одежду
  rationale: בגד — общее обозначение предмета одежды. «Одежда» не уточняет без достаточных оснований, был ли это плащ, накидка или иной предмет.
- source_word: לֵאמֹר
  choice: и сказала
  rationale: Инфинитив вводит прямую речь. В современном русском повествовании сочинительная конструкция естественнее буквального «говоря».
- source_word: שִׁכְבָה עִמִּי
  choice: Ложись со мной!
  rationale: Сочетание שׁכב с עִם служит сексуальным предложением. Перевод сохраняет древнееврейскую эвфемистическую образность и остаётся понятным по контексту.
- source_word: וַיַּעֲזֹב
  choice: он оставил
  rationale: עזב здесь означает оставить предмет, позволив ему остаться у другого человека; «оставил» точно соответствует контексту.
- source_word: בְּיָדָהּ
  choice: у неё в руке
  rationale: Сохраняется буквальный образ руки и ясно выражается, что одежда осталась в её физическом обладании.
- source_word: וַיָּנָס
  choice: убежал
  rationale: נוס обозначает поспешное бегство; «убежал» передаёт направленное спасение бегством естественным современным русским языком.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: вышел наружу
  rationale: Сочетание יצא с הַחוּצָה обозначает движение изнутри наружу. Отдельный глагол сохранён вслед за отдельным древнееврейским сказуемым.
