    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: В генеалогической формуле глагол חיה указывает на достижение названного возраста. «Прожил семьдесят лет» естественно передаёт еврейскую конструкцию и сохраняет её временную последовательность.
- source_word: שִׁבְעִים שָׁנָה
  choice: семьдесят лет
  rationale: Буквальное обозначение возраста; в сочетании с «прожил» смысл достижения семидесятилетнего возраста понятен без добавления слова «исполнилось».
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: В родословиях ילד в каузативной породе означает, что мужчина стал отцом или произвёл потомство. Такой перевод точен, современен и не предполагает, что все названные сыновья родились одновременно.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: Аврама, Нахора и Арана
  rationale: Повторяющийся показатель прямого дополнения выделяет каждое имя; по-русски это естественно передаётся обычным перечислением.
- source_word: תֶּרַח
  choice: Фарра
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Использована устоявшаяся русская библейская форма имени до его переименования в Авраама.
- source_word: נָחוֹר
  choice: Нахор
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הָרָן
  choice: Аран
  rationale: Использована устоявшаяся русская библейская форма имени; начальная буква ה здесь относится к имени и не переводится как артикль.
theological_decisions:
- issue: Порядок рождения сыновей и хронология
  choice: Стих передан как сообщение о том, что к семидесятилетнему возрасту Фарра стал отцом названных сыновей; перечисление само по себе не устанавливает точного порядка их рождения.
  alternative: Понимать имена как строгую последовательность рождения либо считать, что все трое родились, когда Фарре было ровно семьдесят лет.
  rationale: Еврейский текст называет возраст Фарры и трёх сыновей, но не разрешает все хронологические вопросы, возникающие при сопоставлении с последующими стихами. Перевод не вводит скрытой гармонизации.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Формулировка краткая и достоинственная; архаичное «родил» в основном тексте заменено естественным «стал отцом», а буквальная возможность отмечена в сноске.
