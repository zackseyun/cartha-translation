  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: ru
  text: 'И сказал Яхве: «Вот, они — один народ, и у всех них один язык; и это они начали делать. Теперь ничто из того, что они замыслили сделать, не окажется для них недоступным».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Теперь ничто из того, что они замыслили сделать, не будет удержано от них».'
    reason: 'Лексическая неоднозначность формы יִבָּצֵר: она может указывать как на недоступность или невозможность, так и на то, что нечто удерживается от кого-либо.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; соответствует исходному еврейскому тексту.
- source_word: הֵן
  choice: вот
  rationale: Естественно и с достойной торжественностью вводит наблюдение говорящего.
- source_word: עַם אֶחָד
  choice: один народ
  rationale: Прямо передаёт единство группы людей, не придавая слову узкого политического значения «нация».
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: и у всех них один язык
  rationale: Слово שָׂפָה буквально означает «губа», но здесь идиоматически обозначает общий язык; לְכֻלָּם сохраняется как «у всех них».
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: и это они начали делать
  rationale: Формально и естественно передаёт значение «начать», не добавляя отсутствующего в тексте слова «только» и не превращая совершённое начало в прогноз.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: для них не будет недоступно ничто
  rationale: Сохраняет неоднозначность Niphal глагола בצר между невозможностью и недоступностью/удержанием, не сводя фразу исключительно к человеческой способности.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: ничто из того, что они замыслили сделать
  rationale: «Замыслили» передаёт намерение и обдуманный замысел יזם; русская конструкция естественно сочетается с предшествующим отрицанием.
theological_decisions:
- issue: Объём утверждения о возможностях объединённого человечества
  choice: 'Сохранено сильное контекстуальное утверждение: задуманные ими предприятия не будут для них недоступны.'
  alternative: «Для них не будет ничего невозможного» либо «ничто не будет удержано от них».
  rationale: Формулировка не приписывает людям абсолютного всемогущества и не уточняет без достаточных оснований, идёт ли речь только о способности людей или о том, что нечто не будет удержано от них Богом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому, но остаётся ясным для обычного читателя; подлинная лексическая неоднозначность заключительной части сохранена и отмечена сноской.
