  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: ru
  text: 'Вот родословие Фарры: Фарра стал отцом Аврама, Нахора и Арана; Аран стал отцом Лота.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Формула естественно вводит новый раздел и указывает на последующее изложение; отдельное «и» в современном русском здесь не требуется.
- source_word: תּוֹלְדֹת
  choice: родословие
  rationale: В Бытии это повторяющийся структурный термин о линии происхождения и связанном с ней повествовании. «Родословие» сохраняет генеалогический смысл и звучит естественнее буквального «порождения».
- source_word: תֶּרַח
  choice: Фарра
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Каузативная форма глагола ילד в генеалогии означает «породил, стал отцом». Выбран современный и достойный оборот без архаического «родил» применительно к мужчине.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: Аврама, Нахора и Арана
  rationale: Показатели прямого дополнения отдельно не передаются; имена даны в традиционных русских формах и поставлены в винительном падеже.
- source_word: וְהָרָן הוֹלִיד אֶת לוֹט
  choice: Аран стал отцом Лота
  rationale: Повтор генеалогического глагола передан последовательно. Союзная связь выражена точкой с запятой и последовательностью фраз, без избыточного начального «и».
