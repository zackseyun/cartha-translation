- from: После рождения Фарры Нахор жил ещё сто девятнадцать лет, и у него родились сыновья и дочери.
  to: После того как Нахор стал отцом Фарры, он прожил ещё сто девятнадцать лет и стал отцом сыновей и дочерей.
  rationale: Заменены обе безлично-событийные формулировки на «стал отцом», чтобы передать активную родословную связь, выраженную ילד, сохранив современный литературный регистр и не вводя архаизмов. Число, имя и перечисление сыновей и дочерей оставлены без изменений.
