lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле глагол обозначает продолжительность жизни после рождения названного сына; «жил ещё» естественно передаёт продолжение жизни.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת תֶּרַח
  choice: После рождения Фарры
  rationale: Русская конструкция естественно выражает период после того, как у Нахора родился Фарра, не прибегая к архаичному «родил» о мужчине.
- source_word: תֶּרַח
  choice: Фарра
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: сто девятнадцать лет
  rationale: Число передано в естественном для русского языка порядке, с сохранением точного значения еврейского текста.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: у него родились сыновья и дочери
  rationale: Естественная современная русская формулировка сохраняет активную родословную связь и явно называет потомков обоих полов.
