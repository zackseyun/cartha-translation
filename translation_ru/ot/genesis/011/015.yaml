  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Шелах стал отцом Эвера, он жил ещё 403 года, и у него родились сыновья и дочери.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле חיה обозначает продолжительность жизни; «ещё» естественно передаёт, что речь идёт о годах после рождения Евера.
- source_word: שֶׁלַח
  choice: Шелах
  rationale: Транслитерация непосредственно отражает еврейскую форму имени и сохраняет отличие от имени Шела.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: После рождения Евера
  rationale: В данном родословном контексте каузатив הוליד означает, что Шелах стал отцом Евера; русская конструкция «после рождения Евера» передаёт это естественно и без архаизма «родил» применительно к мужчине.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 года
  rationale: Еврейское числительное буквально построено как «три года и четыреста лет» и означает 403 года; цифровая запись ясна современному читателю.
- source_word: וַיּוֹלֶד
  choice: у него родились
  rationale: При мужском субъекте ילד в родословной означает произведение потомства; эта русская формула естественна и сохраняет смысл, не прибегая к архаическому «породил».
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Перевод сохраняет явное указание еврейского текста на потомков обоих полов.
