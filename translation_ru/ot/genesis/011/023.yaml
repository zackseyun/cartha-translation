lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле глагол חיה обозначает продолжительность жизни; русское «жил» естественно и точно передаёт смысл.
- source_word: שְׂרוּג
  choice: Серуг
  rationale: Традиционная русская библейская передача личного имени.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת נָחוֹר
  choice: после рождения Нахора
  rationale: Хифиль ילד обозначает отцовство, однако русская конструкция «после рождения Нахора» естественно выражает временное отношение и не предполагает, что рожал отец.
- source_word: מָאתַיִם שָׁנָה
  choice: двести лет
  rationale: Идиоматическая русская передача длительности.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: и у него родились сыновья и дочери
  rationale: Естественная современная русская формула сохраняет указание на мужских и женских потомков, не прибегая к архаичному «родил» применительно к отцу.
