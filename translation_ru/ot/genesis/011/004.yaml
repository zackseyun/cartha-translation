base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: ru
  text: 'И сказали они: «Давайте построим себе город и башню, вершина которой — в небесах[a], и сделаем себе имя, чтобы не рассеяться[b] по лицу всей земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вершина которой достигает небес». Буквально по-еврейски: «вершина её в небесах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы нас не рассеяли». Еврейская форма может описывать как расселение, так и рассеяние под внешним воздействием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Давайте
  rationale: Побудительное междометие, призывающее к совместному действию; «давайте» естественно передаёт это значение в современном русском языке.
- source_word: נִבְנֶה לָּנוּ
  choice: построим себе
  rationale: Форма первого лица множественного числа выражает совместное побуждение, а לָּנוּ имеет здесь значение действия в собственных интересах.
- source_word: עִיר וּמִגְדָּל
  choice: город и башню
  rationale: Прямые и контекстуально достаточные соответствия; военная функция башни текстом не уточняется.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: вершина которой — в небесах
  rationale: Сохраняется буквальный пространственный образ еврейского текста без добавления глагола «достигать»; женский род относительного местоимения естественно соотносит вершину с башней.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: и сделаем себе имя
  rationale: Русское выражение сохраняет еврейскую идиому и её литературную выразительность, не сводя значение лишь к репутации или славе.
- source_word: פֶּן נָפוּץ
  choice: чтобы не рассеяться
  rationale: פֶּן вводит отрицательную цель или опасаемый результат; русская конструкция естественно сохраняет обе возможные смысловые стороны.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: по лицу всей земли
  rationale: Сохраняется образное выражение עַל־פְּנֵי; в контексте первобытной истории הָאָרֶץ обозначает всю землю, а не отдельную страну.
theological_decisions:
- issue: Объём значения הָאָרֶץ в повествовании о Вавилоне
  choice: вся земля
  alternative: вся страна / вся суша
  rationale: Контекст Бытия 11 говорит о расселении человечества в мировом масштабе; перевод не ограничивает повествование локальной территорией.
- issue: Образ вершины башни בַשָּׁמַיִם
  choice: в небесах
  alternative: достигающая небес
  rationale: Еврейский текст буквально указывает положение вершины и не выражает отдельно идею достижения; образ сохранён без рационализирующего уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Выражения «сделаем себе имя» и «по лицу всей земли» сохранены ради образности и межтекстовых связей; синтаксис остаётся ясным для широкого читателя.
