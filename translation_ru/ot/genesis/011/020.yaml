  text: Реу жил тридцать два года и стал отцом Серуга.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле форма глагола חיה естественно передаётся русским «жил» и указывает на возраст до рождения названного потомка.
- source_word: רְעוּ
  choice: Реу
  rationale: Традиционная и узнаваемая русская передача еврейского личного имени.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: тридцать два года
  rationale: Еврейское «два и тридцать» передано в обычном для современного русского языка порядке без изменения числового значения.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Каузативная форма ילד в родословии означает рождение потомка от названного мужчины; «стал отцом» точно и естественно передаёт смысл, не прибегая к архаичному «родил» или «родил сына».
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия и выражен синтаксически.
- source_word: שְׂרוּג
  choice: Серуга
  rationale: Традиционная русская форма имени Серуг поставлена в родительный падеж после оборота «стал отцом».
