lexical_decisions:
- source_word: וַיְהִי
  choice: был
  rationale: Глагольная форма вводит исходное состояние повествования; в современном русском это естественно передаётся прошедшим временем без архаического «и было».
- source_word: כָל הָאָרֶץ
  choice: у всей земли
  rationale: В контексте рассказа речь идёт обо всём населённом мире; конструкция «у всей земли был» естественно описывает общее для всех людей состояние и сохраняет образ «земли».
- source_word: שָׂפָה אֶחָת
  choice: один язык
  rationale: Буквально שָׂפָה означает «губа», но здесь это устойчивое обозначение языка или речи; «один язык» ясно и естественно передаёт смысл.
- source_word: וּדְבָרִים אֲחָדִים
  choice: и одни и те же слова
  rationale: Перевод сохраняет отдельное упоминание דְּבָרִים («слова») и выраженную אֲחָדִים общность, не сливая эту фразу с предшествующим «один язык».
