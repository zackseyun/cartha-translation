  text: На всей земле был один язык и одни и те же слова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и единая речь»; возможно также: «и один набор слов». Буквально по-еврейски: «и слова одни».'
