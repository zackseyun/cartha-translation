  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: ru
  text: И сошёл Яхве посмотреть на город и башню, которые построили сыны человеческие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди». Буквально: «сыны человека»; древнееврейское выражение обозначает людей в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: И сошёл
  rationale: Глагол ירד буквально означает движение вниз; совершенный вид естественен в русском повествовании и сохраняет антропоморфный образ. Союз «и» передаёт последовательность древнееврейского нарратива.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: לִרְאֹת
  choice: посмотреть
  rationale: Передаёт обычное значение ראה и целевое значение инфинитива, не усиливая его до «осмотреть» или «проверить».
- source_word: הָעִיר וְאֶת הַמִּגְדָּל
  choice: на город и башню
  rationale: Стандартные современные соответствия; управление с повтором предлога не требуется по нормам естественного русского языка.
- source_word: אֲשֶׁר בָּנוּ
  choice: которые построили
  rationale: Относительное местоимение во множественном числе согласуется с однородными существительными «город и башню»; простое прошедшее естественно и не навязывает завершённость сверх формы древнееврейского перфекта.
- source_word: בְּנֵי הָאָדָם
  choice: сыны человеческие
  rationale: Сохраняет образную форму «сыны человека» и её собирательный смысл, оставаясь понятным достоинственным библейским выражением; более прямое разъяснение дано в сноске.
theological_decisions:
- issue: Антропоморфное описание сошествия Яхве
  choice: Сохранить конкретное «сошёл … посмотреть».
  alternative: «взглянул с небес» или «обратил внимание»
  rationale: Исходный текст прямо описывает движение вниз; абстрактная перефразировка устранила бы повествовательный образ и его иронию.
- issue: Смысл выражения בְּנֵי הָאָדָם
  choice: «сыны человеческие» в основном тексте с пояснением собирательного значения в сноске.
  alternative: «люди» или «человечество»
  rationale: Так сохраняются мужская образная форма и противопоставление Яхве людям, но сноска предотвращает ошибочное понимание выражения как указания только на мужчин.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Форма «сыны человеческие» намеренно сохраняет образ исходного текста; остальной синтаксис остаётся простым и естественным.
