  text: Эвер жил тридцать четыре года и стал отцом Пелега.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле глагол חיה обозначает число прожитых лет до названного далее события; естественное русское соответствие — «жил».
- source_word: עֵבֶר
  choice: Эвер
  rationale: Имя передано непосредственно с древнееврейского в форме, принятой в русской библейской традиции.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: тридцать четыре года
  rationale: Порядок числительных приведён к норме современного русского языка при точном сохранении числа.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: В родословии каузативная форма ילד с мужчиной в роли субъекта означает, что он произвёл на свет потомка. «Стал отцом» точно и естественно передаёт смысл, не прибегая к архаичному «родил» в специальном значении «породил».
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения выражен обычным русским синтаксисом.
- source_word: פָּלֶג
  choice: Пелега
  rationale: Имя передано непосредственно с древнееврейского; падежное окончание обусловлено русским синтаксисом.
