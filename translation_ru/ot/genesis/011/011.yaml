  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Сим стал отцом Арпаксада, он прожил ещё пятьсот лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: Глагол חיה в родословном повествовании обозначает продолжительность последующей жизни; «ещё» естественно передаёт продолжение жизни после рождения сына.
- source_word: שֵׁם
  choice: Сим
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: после того как Сим стал отцом
  rationale: Оборот передаёт временное значение אַחֲרֵי и каузативную форму ילד естественным современным русским языком, сохраняя указание на отцовство.
- source_word: אַרְפַּכְשָׁד
  choice: Арпаксад
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: пятьсот лет
  rationale: Прямое и естественное обозначение продолжительности жизни.
- source_word: וַיּוֹלֶד
  choice: у него родились
  rationale: По-русски это естественный способ сообщить о последующем появлении потомства; он избегает архаичного или двусмысленного «родил» применительно к мужчине.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Сохранено явное упоминание потомков обоих полов, а не заменено обобщающим словом «дети».
