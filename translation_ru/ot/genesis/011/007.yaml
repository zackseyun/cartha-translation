  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: ru
  text: Давайте сойдём и смешаем там их язык, чтобы один не понимал языка другого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Давайте же
  rationale: Побудительная форма вводит совместное действие; «же» естественно передаёт оттенок призыва в современном русском.
- source_word: נֵרְדָה
  choice: сойдём
  rationale: Когортатив первого лица множественного числа буквально указывает на совместное нисхождение.
- source_word: נָבְלָה
  choice: смешаем
  rationale: В данном контексте глагол означает привести язык в состояние смешения и взаимной непонятности.
- source_word: שְׂפָתָם
  choice: их язык
  rationale: Буквально «их губа», но по смыслу метонимически обозначает язык как средство речи.
- source_word: אֲשֶׁר לֹא יִשְׁמְעוּ אִישׁ שְׂפַת רֵעֵהוּ
  choice: чтобы они перестали понимать друг друга
  rationale: Еврейская идиома буквально говорит, что каждый не будет понимать язык ближнего; взаимное «друг друга» естественно и точно передаёт общий результат.
theological_decisions:
- issue: Множественное число в божественной речи
  choice: сойдём и смешаем
  alternative: сойду и смешаю
  rationale: Сохранено явное первое лицо множественного числа оригинала без попытки истолковать, к кому обращена речь.
- issue: Цель или результат смешения языка
  choice: чтобы
  alternative: так что
  rationale: אֲשֶׁר с отрицательным имперфектом здесь естественно выражает намеченную цель; перевод не смягчает причинную связь.
translation_notes:
  register: Современный литературный русский, торжественный, но общепонятный. Идиоматическое «перестали понимать друг друга» избегает неестественного буквального «муж языка ближнего своего», сохраняя смысл взаимной утраты понимания.
