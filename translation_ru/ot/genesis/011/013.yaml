  text: וַֽ/יְחִ֣י אַרְפַּכְשַׁ֗ד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֶׁ֔לַח שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Арпахшад стал отцом Шелаха, он прожил ещё 403 года, и у него родились сыновья и дочери.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле глагол חיה обозначает последующую продолжительность жизни; «жил ещё» естественно связывает её с рождением названного сына.
- source_word: אַרְפַּכְשַׁד
  choice: Арпахшад
  rationale: Передача имени непосредственно с еврейской формы, без греко-латинского варианта «Арфаксад».
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֶׁלַח
  choice: после рождения Шелаха
  rationale: Конструкция указывает на время после того, как Арпахшад произвёл на свет Шелаха. Русское отглагольное выражение естественно и не меняет субъекта подразумеваемого отцовства.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 года
  rationale: Сохраняется точное число, а порядок числительных приводится к современной русской норме.
- source_word: וַיּוֹלֶד
  choice: у него родились
  rationale: В данном родословном контексте форма ילד говорит о потомстве мужчины; этот оборот естественнее буквального «он породил» и точнее общего «у него были».
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Сохраняется явное указание еврейского текста на потомков обоих полов.
