  text: Serug lived thirty years and fathered Nahor.
translation:
  language: ru
  text: Серуг прожил тридцать лет и стал отцом Нахора.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: Форма wayyiqtol от חיה в родословной вводит указание возраста; «прожил тридцать лет» естественно передаёт формулу и её временную последовательность.
- source_word: שְׂרוּג
  choice: Серуг
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: тридцать лет
  rationale: Еврейское сочетание обозначает возраст; в конструкции «прожил тридцать лет» это значение ясно из родословной формулы.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Hiphil от ילד в родословиях указывает на мужское родительство или происхождение. «Стал отцом» точно и естественно звучит в современном русском языке, не прибегая к архаичному «родил» или «породил».
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, функция которого передана русским синтаксисом.
- source_word: נָחוֹר
  choice: Нахора
  rationale: Традиционная русская передача личного имени; форма родительного падежа обусловлена сочетанием «стал отцом».
