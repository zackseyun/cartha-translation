  source_fidelity: Черновик верно передаёт временную последовательность, число лет, имена и упоминание сыновей и дочерей. Однако «у него родились сыновья и дочери» описывает рождение детей с их точки зрения и не выражает прямо, что именно Евер был их отцом; оба глагола ילד в данном родословном контексте относятся к отцовству Евера.
