  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Евер стал отцом Фалека, он прожил ещё четыреста тридцать лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле חיה означает продолжительность жизни; частица «ещё» естественно показывает, что речь идёт о годах после рождения Фалека.
- source_word: עֵבֶר
  choice: Евер
  rationale: Использована традиционная русская форма библейского имени.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: после рождения Фалека
  rationale: Оборот передаёт время, отсчитываемое после того, как Евер стал отцом Фалека, и звучит естественно по-русски; Фалек — традиционная русская форма имени.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: четыреста тридцать лет
  rationale: Порядок числительных приведён в соответствие с нормой современного русского языка без изменения суммы.
- source_word: וַיּוֹלֶד
  choice: у него родились
  rationale: Так естественно передаётся мужское родительство в современном русском; буквальное «родил» здесь неприемлемо, а «породил» звучит архаично.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Сохранено явное упоминание потомков обоих полов, присутствующее в еврейском тексте.
