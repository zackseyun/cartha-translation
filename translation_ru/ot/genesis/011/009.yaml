  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: ru
  text: Поэтому его назвали Вавилоном[a], потому что там Яхве смешал язык всей земли и оттуда Яхве рассеял их по всей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское название «Бавель» (Вавилон) созвучно глаголу бала́ль — «смешивать»; на этой игре слов основано данное объяснение имени.
    reason: В русском названии игра слов между בָּבֶל и בָּלַל не слышна и требует пояснения.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход к объяснению названия кратко и естественно.
- source_word: קָרָא שְׁמָהּ
  choice: ему дали имя
  rationale: Естественно передаёт еврейскую формулу наречения и не вводит конкретного субъекта там, где он прямо не назван.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Устоявшаяся русская форма библейского топонима; связь с еврейским глаголом поясняется в сноске.
- source_word: כִּי שָׁם
  choice: потому что там
  rationale: Сохраняет пояснительную причинную связь, заданную контекстом.
- source_word: בָּלַל
  choice: смешал
  rationale: Передаёт основное значение глагола и поддерживает смысл игры слов с названием בָּבֶל; в контексте речь идёт о смешении речи людей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: язык всей земли
  rationale: שָׂפָה буквально означает «губа», но здесь метонимически обозначает язык или речь; единственное число и охват «всей земли» сохранены.
- source_word: וּמִשָּׁם
  choice: и оттуда
  rationale: Сохраняет пространственную и повествовательную связь с только что названным местом.
- source_word: הֱפִיצָם
  choice: рассеял их
  rationale: Точно передаёт каузативное значение географического расселения людей.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: по всей земле
  rationale: Естественный современный русский эквивалент еврейского выражения «по лицу всей земли»; повтор «всей земли» сохранён.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; еврейские идиомы переданы естественными русскими соответствиями, а значимая игра слов вынесена в сноску.
