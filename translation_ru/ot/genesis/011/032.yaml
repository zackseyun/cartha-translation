lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: Всех дней Фарры было
  rationale: Формула подводит итог продолжительности жизни. Перевод сохраняет характерный для библейской генеалогии образ «дней», при этом слово «всех» естественно показывает итоговый смысл конструкции.
- source_word: תֶרַח
  choice: Фарра
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная широкому кругу читателей.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: двести пять лет
  rationale: Порядок компонентов числа приведён к норме современного русского языка; форма «лет» соответствует русскому управлению после составного числительного 205.
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямо передаёт значение глагола מות, без отсутствующего в источнике эвфемизма.
- source_word: בְּחָרָן
  choice: в Харране
  rationale: Предлог ב обозначает место смерти; русское «в» естественно употребляется с названием города. Удвоенное «р» соответствует традиционной русской форме топонима.
