  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: ru
  text: Нахор жил двадцать девять лет и стал отцом Фарры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле wayyiqtol от חיה естественно передаётся глаголом «жил» и указывает возраст до следующего названного события.
- source_word: נָחוֹר
  choice: Нахор
  rationale: Имя передано в форме, традиционно принятой в русском библейском употреблении и близкой к древнееврейскому звучанию.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: двадцать девять лет
  rationale: Древнееврейское «девять и двадцать» передано естественным для современного русского языка порядком числительных; форма «лет» соответствует русскому управлению после составного числительного.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד в родословиях означает, что мужчина породил ребёнка, то есть стал его отцом. Эта передача современна, ясна и не вносит дополнительных оттенков.
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия и выражается синтаксической конструкцией.
- source_word: תָּרַח
  choice: Фарры
  rationale: Использована укоренившаяся русская библейская форма имени «Фарра»; родительный падеж требуется конструкцией «стал отцом».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая и ритмичная родословная формула. Архаичное «родил» применительно к отцу и книжное «породил» не использованы.
