  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: ru
  text: 'И сказали они друг другу: «Давайте сделаем кирпичи и хорошенько обожжём их». И кирпич служил им вместо камня, а битум — вместо раствора.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Битум — природное асфальтоподобное смолистое вещество, которое использовали как строительный раствор.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: друг другу
  rationale: Еврейское распределительное выражение буквально описывает обращение одного человека к другому; по-русски естественнее всего передать его взаимным оборотом «друг другу».
- source_word: הָבָה
  choice: давайте
  rationale: Частица вводит совместное побуждение; «давайте» современно и естественно сочетается с формой первого лица множественного числа.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: сделаем кирпичи
  rationale: Знаменательный глагол от существительного «кирпич» означает изготовление кирпичей; выбран ясный современный эквивалент.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: и хорошенько обожжём их
  rationale: Сочетание глагола с однокоренным существительным усиливает значение действия. В контексте изготовления кирпича «обожжём» точнее русского «сожжём», а «хорошенько» передаёт интенсивность.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: кирпич служил им вместо камня
  rationale: 'Конструкция выражает функциональную замену: кирпич использовался там, где обычно применяли камень. Такой перевод естественно передаёт смысл היה + ל.'
- source_word: הַחֵמָר
  choice: битум
  rationale: חֵמָר обозначает природный битум, то есть асфальтоподобное смолистое вещество, применявшееся в строительстве.
- source_word: לַחֹמֶר
  choice: вместо раствора
  rationale: В строительном контексте חֹמֶר обозначает связующий материал; «раствор» точно передаёт его функцию и сохраняет параллелизм с «вместо камня».
theological_decisions: []
