  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Фалек стал отцом Реу, он жил ещё двести девять лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле глагол חיה обозначает последующий срок жизни; частица «ещё» естественно передаёт продолжение жизни после названного события.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: после рождения Реу
  rationale: Еврейская конструкция буквально указывает на время после того, как Фалек произвёл на свет Реу. Номинальная русская формулировка естественна и сохраняет временное отношение, не меняя отцовской перспективы контекста.
- source_word: רְעוּ
  choice: Реу
  rationale: Имя передано транслитерацией, близкой к еврейской форме רְעוּ, а не традиционной формой «Рагав».
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: двести девять лет
  rationale: Число переставлено в обычный для русского языка порядок; форма «лет» соответствует русскому управлению составного числительного.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: и у него родились сыновья и дочери
  rationale: Формулировка естественно передаёт генеалогическое значение ילד и сохраняет прямое указание как на сыновей, так и на дочерей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционному «родил» применительно к отцу предпочтены естественные конструкции «после рождения» и «у него родились». Имя «Фалек» сохранено в принятой русской библейской форме, тогда как «Реу» следует еврейскому тексту.
