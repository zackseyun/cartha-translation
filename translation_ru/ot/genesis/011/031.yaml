  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт структуру и смысл масоретского текста: Фарра берёт с собой перечисленных родственников; группа отправляется из Ура халдеев с целью идти в Ханаан, доходит до Харрана и поселяется там. «Они вместе вышли» — допустимая естественная передача трудного וַיֵּצְאוּ אִתָּם при наличии поясняющей сноски. Однако имя שָׂרַי следует передавать «Сарай», а не «Сара»: в данном стихе исходный текст ещё не употребляет позднейшую форму имени שָׂרָה (Быт 17:15).'
  naturalness: Русский текст звучит современно и литературно. «Дошли до Харрана» хорошо передаёт עַד; «поселились там» уместно в миграционном контексте. Перестановка «вышли вместе» была бы несколько плавнее, но не обязательна.
