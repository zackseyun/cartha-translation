source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: ru
  text: Фарра взял своего сына Аврама, Лота, сына Арана, своего внука[a], и свою невестку Сарай, жену своего сына Аврама. Они вместе вышли[b] из Ура халдеев, чтобы идти в землю Ханаана. Они дошли до Харрана и поселились там[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Лота, сына Арана, сына его сына», то есть внука Фарры.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в масоретском тексте: «они вышли с ними». Неясное соотношение местоимений, вероятно, указывает на совместное отправление всей семьи. В Самаритянском Пятикнижии и греческой Септуагинте отражено чтение с Фаррой как подлежащим: «он вывел их».'
    reason: textual_variant
  - marker: c
    text: 'Или: «стали жить там».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Основное значение глагола לקח сохранено; в контексте переселения русское «взял» естественно означает, что Фарра взял названных родственников с собой.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: Лота, сына Арана, своего внука
  rationale: Передаёт как отца Лота, так и его родство с Фаррой; буквальная необычная конструкция поясняется в сноске.
- source_word: כַּלָּתוֹ
  choice: свою невестку
  rationale: Точное и современное обозначение жены сына по отношению к Фарре.
- source_word: אֵשֶׁת אַבְרָם בְּנוֹ
  choice: жену своего сына Аврама
  rationale: Сохраняет пояснительное приложение и ясно показывает семейные отношения.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: они вместе вышли
  rationale: 'Передаёт совместное отправление группы естественным русским языком, не скрывая текстуальную трудность: буквально масоретский текст говорит «они вышли с ними»; это отмечено в сноске.'
- source_word: מֵאוּר כַּשְׂדִּים
  choice: из Ура халдеев
  rationale: Формально передаёт еврейскую конструкцию с названием народа и соответствует современному русскому употреблению.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: чтобы идти в землю Ханаана
  rationale: Инфинитив передаёт цель, а направительная форма существительного — пункт назначения.
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: они дошли до Харрана
  rationale: «Дошли до» естественно передаёт значение עַד «до, вплоть до» и последовательность еврейского повествования без добавления противопоставления.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: поселились там
  rationale: В рассказе о переселении ישב обозначает проживание или обоснование на месте; «поселились» точно отражает контекст.
theological_decisions:
- issue: Кто вышел и с кем (וַיֵּצְאוּ אִתָּם)
  choice: В основном тексте — «они вместе вышли», с буквальным чтением в сноске.
  alternative: «Они вышли с ними» или чтение единственного числа по древним вариантам.
  rationale: Масоретский текст имеет множественное «они вышли» и «с ними», что создаёт неясную самореференцию после перечня участников. Естественный основной текст передаёт совместное отправление, а сноска сохраняет подлинную неоднозначность и упоминает вариантную традицию без её принятия.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательной прозы. Сохранены традиционные русские формы библейских имён: Фарра, Аврам, Аран, Сара, Харран. Синтаксис разделён на три предложения ради ясности; еврейская последовательность событий сохранена без добавленного противительного «но».'
