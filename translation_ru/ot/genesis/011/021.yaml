  naturalness: «Реу ... родил сыновей и дочерей» допустимо в традиционном библейском стиле, но в современном литературном русском глагол «родил» при мужском субъекте обычно воспринимается как неестественный. «Стал отцом» сохраняет смысл и звучит естественно.
  terminology: Имена «Реу» и «Серуг» переданы последовательно. «Сыновей и дочерей» точно воспроизводит бָּנִים וּבָנוֹת. Богословски нагруженных терминов нет.
