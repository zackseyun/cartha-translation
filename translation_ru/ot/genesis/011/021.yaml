  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Реу стал отцом Серуга, он жил ещё двести семь лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле глагол означает, что Реу продолжал жить после рождения названного сына; «жил ещё» естественно выражает это по-русски.
- source_word: רְעוּ
  choice: Реу
  rationale: Использована традиционная русская передача еврейского личного имени.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: После рождения Серуга
  rationale: Отглагольная конструкция естественна в современном русском и сохраняет временное отношение; мужское родительство ясно из контекста и следующего глагола.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: двести семь лет
  rationale: Число передано в обычном для русского языка порядке.
- source_word: וַיּוֹלֶד
  choice: родил
  rationale: При мужском субъекте в родословной формуле означает «стал отцом, произвёл потомство»; краткое «родил» соответствует традиционному библейскому употреблению, хотя в повседневной речи может ассоциироваться с матерью.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей и дочерей
  rationale: Сохранено явное указание еврейского текста на потомков обоих полов.
