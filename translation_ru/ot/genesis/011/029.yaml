  register: Современный литературный русский с умеренно торжественным библейским звучанием. Первая фраза сохраняет исходную древнееврейскую идиому, а примечание даёт более естественный русский эквивалент. Во второй фразе конструкция с повтором слова «имя» передана идиоматически, без потери генеалогической информации.
