base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: ru
  text: Аврам и Нахор взяли себе жён.[a] Жену Аврама звали Сара, а жену Нахора — Милка, дочь Арана, отца Милки и Иски.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно по-русски: «Аврам и Нахор женились». Буквально по-древнееврейски: «взяли себе жён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взяли
  rationale: Глагол לקח буквально означает «брать»; в брачном контексте выражение «взяли себе жён» передаёт древнееврейскую идиому, оставаясь понятным по-русски.
- source_word: לָהֶם
  choice: себе
  rationale: 'Предлог с местоименным суффиксом выражает личную заинтересованность: каждый из братьев взял жену для себя.'
- source_word: נָשִׁים
  choice: жён
  rationale: Хотя существительное может означать и «женщин», брачный контекст требует значения «жёны».
- source_word: שֵׁם אֵשֶׁת
  choice: жену … звали
  rationale: Естественная русская передача конструкции «имя жены …», сохраняющая её смысл без тяжеловесного оборота.
- source_word: שָׂרָי
  choice: Сара
  rationale: Традиционная русская форма имени на данном этапе повествования, отличающаяся от позднейшего имени «Сарра» (Быт. 17:15).
- source_word: מִלְכָּה
  choice: Милка
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: בַּת
  choice: дочь
  rationale: Прямое обозначение родства; контекст не требует расширительного толкования.
- source_word: הָרָן
  choice: Аран
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: אֲבִי
  choice: отца
  rationale: Обычное значение слова אָב — «отец»; ближайший генеалогический контекст поддерживает прямое родство.
- source_word: יִסְכָּה
  choice: Иска
  rationale: Устоявшаяся русская библейская передача личного имени.
