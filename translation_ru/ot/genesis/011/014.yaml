  - marker: b
    text: 'Или: «Евер»; форма «Эвер» точнее передаёт еврейское имя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Шелах
  rationale: Имя передано непосредственно с еврейской формы שֶׁלַח; союз וְ перед именем в русском начале стиха отдельно не выражен, поскольку здесь он служит связью в последовательности родословия.
- source_word: חַי
  choice: жил
  rationale: Форма глагола חיה в родословной формуле естественно передаётся русским «жил» и указывает на возраст до следующего названного события.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: тридцать лет
  rationale: Передаёт еврейское обозначение продолжительности и в контексте ясно выражает возраст Шелаха.
- source_word: וַ/יּוֹלֶד
  choice: и стал отцом
  rationale: Порода хифиль глагола ילד в мужской родословной означает рождение потомка от названного предка. «Стал отцом» естественно для современного русского языка и не вносит архаичного оттенка.
- source_word: אֶת
  choice: '[не переводится отдельно]'
  rationale: Показатель прямого дополнения, функция которого передана русским синтаксисом.
- source_word: עֵבֶר
  choice: Эвер
  rationale: Непосредственная передача еврейского имени עֵבֶר с начальным гортанным согласным, который в русской транслитерации здесь отдельно не обозначается.
