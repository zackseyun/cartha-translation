  yaml_path: translation/ot/genesis/011/012.yaml
  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: ru
  text: Арфаксад прожил тридцать пять лет и стал отцом Шелаха[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя можно также передать как «Сала»; здесь оно транслитерировано с еврейского как «Шелах».
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Арфаксад
  rationale: Союз וְ связывает стих с предшествующей родословной, но в русском начале предложения его можно не передавать отдельно без утраты последовательности повествования; имя транслитерировано в принятой русской библейской форме.
- source_word: חַי
  choice: прожил
  rationale: В возрастной формуле родословия глагол חיה означает, что человек прожил указанное число лет до рождения названного потомка; «прожил» естественно передаёт эту конструкцию.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: тридцать пять лет
  rationale: Буквальный порядок числительных — «пять и тридцать лет», однако современный русский нормативно выражает это число как «тридцать пять».
- source_word: וַ/יּוֹלֶד
  choice: стал отцом
  rationale: Каузативная форма ילד в мужской родословной означает «породил, стал отцом». Выражение «стал отцом» точно и естественно для современного русского языка, не привнося предположения о непосредственности родства сверх формулы текста.
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель определённого прямого дополнения передаётся русским синтаксисом и отдельного соответствия не требует.
- source_word: שָׁלַח
  choice: Шелаха
  rationale: Форма «Шелах» непосредственно передаёт масоретское שָׁלַח; в предложении имя поставлено в родительный падеж после «отцом».
theological_decisions:
- issue: Степень непосредственности родства в глаголе וַיּוֹלֶד
  choice: стал отцом Шелаха
  alternative: родил Шелаха / породил Шелаха
  rationale: Родословная формула обозначает происхождение по отцовской линии; выбранная передача сохраняет смысл и не делает формулировку более биологически или хронологически узкой, чем позволяет контекст.
translation_notes:
  register: Современный литературный русский язык; краткая и ритмичная формула родословия. Архаическое «родил» применительно к отцу и тяжеловесное «породил» не использованы. Единственная сноска отмечает традиционный вариант имени.
