  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: ru
  text: Сарай была бесплодна[a]; детей у неё не было.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Сарай была бесплодна; потомства у неё не было».'
    reason: 'Лексическая и синтаксическая альтернатива: начальный וַ допускает явное «и», а וָלָד может передаваться собирательным словом «потомство».'
lexical_decisions:
- source_word: וַתְּהִי
  choice: была
  rationale: Форма וַתְּהִי с היה вводит состояние Сары в ходе повествования. Русское «была» естественно передаёт стативное значение; отдельный начальный союз не требуется.
- source_word: שָׂרַי
  choice: Сара
  rationale: Использована традиционная русская библейская форма имени, соответствующая Саре до переименования в Быт 17:15.
- source_word: עֲקָרָה
  choice: бесплодна
  rationale: Прилагательное обозначает неспособность рождать детей. «Бесплодна» точно, кратко и уместно в литературном повествовании; «бездетна» могло бы лишь описывать отсутствие детей, не передавая причины.
- source_word: אֵין לָהּ
  choice: у неё не было
  rationale: Отрицательная бытийная конструкция с לְ естественно передаётся по-русски конструкцией обладания «у неё не было».
- source_word: וָלָד
  choice: детей
  rationale: Существительное обозначает рождённого ребёнка или потомство. В отрицательной русской конструкции идиоматично множественное «детей», которое передаёт отсутствие потомства без утверждения грамматической численности.
