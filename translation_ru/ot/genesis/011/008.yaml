  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: ru
  text: И рассеял их Яхве оттуда по всей земле[a], и они перестали строить город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по лицу всей земли»; также возможно: «по всей стране».'
    reason: Лексическая альтернатива и сохранение буквального древнееврейского образа; הָאָרֶץ может означать как «землю», так и «страну».
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: рассеял
  rationale: Каузативный глагол от פוץ обозначает рассеяние людей; «рассеял» естественно передаёт действие и его судебный контекст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Прямое и естественное обозначение исходной точки, отсылающее к месту строительства.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: по всей земле
  rationale: Естественно передаёт распространение по всей земле; буквальный образ «по лицу всей земли» сохранён в примечании.
- source_word: וַיַּחְדְּלוּ
  choice: перестали
  rationale: Глагол חדל означает прекращение действия; сочетание «перестали строить» современно и точно.
- source_word: לִבְנֹת
  choice: строить
  rationale: Инфинитив естественно сочетается в русском языке с глаголом «перестали».
- source_word: הָעִיר
  choice: город
  rationale: Определённый существительный оборот относится к уже упомянутому строившемуся городу; в русском после «строить» определённость ясна из контекста без указательного слова.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: В тексте стоит тетраграмматон; форма «Яхве» непосредственно передаёт личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет последовательность древнееврейского рассказа; тяжеловесная буквальная идиома вынесена в примечание.
