base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: ru
  text: Когда они шли с востока[a], то нашли равнину в земле Шинар и поселились там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда они шли на восток». Древнееврейское выражение מִקֶּדֶם может указывать как на исходную точку («с востока»), так и на направление движения («на восток»).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: Когда они шли
  rationale: Оборот с וַיְהִי вводит обстоятельство последующего действия, а נסע обозначает отправление в путь и дальнейшее передвижение. Русская временная конструкция передаёт это естественно, без архаичного «и было».
- source_word: מִקֶּדֶם
  choice: с востока
  rationale: Предлог מִן прежде всего указывает на исходную точку, поэтому в основном тексте выбран смысл «с востока». Возможное направительное значение сохранено в сноске.
- source_word: וַיִּמְצְאוּ
  choice: нашли
  rationale: Прямое и контекстуально точное соответствие глаголу מצא.
- source_word: בִקְעָה
  choice: равнину
  rationale: Слово обозначает широкую долину или равнину; в данном географическом контексте «равнина» звучит естественно и точно.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: в земле Шинар
  rationale: Сохранено географическое обозначение אֶרֶץ и передано древнееврейское название שִׁנְעָר посредством близкой к оригиналу транслитерации.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: и поселились там
  rationale: В контексте передвижения ישב указывает не просто на проживание, но и на прекращение пути и обоснование на месте.
