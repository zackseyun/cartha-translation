  source_fidelity: Основной вариант «при жизни своего отца» передаёт вероятный временной смысл, но снимает заложенную в עַל־פְּנֵי двусмысленность между значениями «в присутствии/перед лицом» и «прежде». Более нейтральное «при своём отце» сохраняет оба возможных оттенка. «В земле своего рождения» точнее и устраняет потенциальную неясность местоимения в формуле «где он родился».
  naturalness: «Аран умер при своём отце Фарре» — естественная литературная русская формулировка с библейским достоинством. «В Уре Халдейском» соответствует устойчивому русскому библейскому употреблению.
  terminology: 'Традиционные русские библейские формы «Аран», «Фарра» и «Ур Халдейский» приемлемы. Сноска уточнена: прежняя формулировка называла «перед лицом» буквальным значением, тогда как буквальная основа оборота — «на лице/на פני», а «перед лицом» является идиоматической передачей.'
