  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: ru
  text: Аран умер при своём отце Фарре, в земле своего рождения, в Уре Халдейском.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде своего отца Фарры», то есть пока тот был ещё жив. Древнееврейский оборот буквально означает «на лице своего отца» и может также передавать смысл «перед лицом, в присутствии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Форма wayyiqtol от מות последовательно повествует о прошлом событии; «умер» — естественный русский эквивалент.
- source_word: עַל־פְּנֵי
  choice: при жизни
  rationale: В данном контексте древнееврейское выражение указывает, что Аран умер раньше отца, пока тот был жив. Основной текст передаёт смысл естественно, а буквальная образность и возможный оттенок присутствия сохранены в сноске.
- source_word: תֶּרַח אָבִיו
  choice: своего отца Фарры
  rationale: Сочетание называет Фарру отцом Арана; возвратное «своего» устраняет возможную неясность в русском предложении. Имена переданы в укоренившейся русской библейской форме.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: в земле, где он родился
  rationale: מוֹלֶדֶת обозначает землю рождения или происхождения; описательная формулировка ясна современному читателю и не сужает значение до одного города.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: в Уре Халдейском
  rationale: Это естественная и традиционно узнаваемая русская форма географического наименования «Ур халдеев».
