  text: אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן מְאַ֣ת שָׁנָ֔ה וַ/יּ֖וֹלֶד אֶת אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: ru
  text: Вот родословие Сима. Симу было сто лет, и он стал отцом Арпахшада[a] через два года после потопа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционная русская форма этого имени — «Арфаксад»; она восходит к греческой передаче, тогда как «Арпахшад» ближе к древнееврейской форме.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Вот родословие
  rationale: Устойчивая формула, вводящая в Бытии историю рода и происходящих от названного лица потомков. «Родословие» естественно по-русски и сохраняет генеалогический смысл, хотя грамматическое число оригинала передаётся не буквально.
- source_word: שֵׁם
  choice: Сим
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: בֶּן מְאַת שָׁנָה
  choice: Симу было сто лет
  rationale: Естественная русская передача древнееврейского возрастного оборота, буквально означающего «сын ста лет».
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד в родословиях обозначает произведение потомка на свет; эта формулировка современна, ясна и не использует архаичное «родил» применительно к отцу.
- source_word: אַרְפַּכְשָׁד
  choice: Арпахшад
  rationale: Форма непосредственно передаёт согласные древнееврейского имени; традиционный русский вариант «Арфаксад» отражает греческую форму и указан в примечании.
- source_word: שְׁנָתַיִם
  choice: через два года
  rationale: Двойственное число существительного «год» прямо обозначает два года; вместе с последующим предлогом образует естественное русское обозначение времени.
- source_word: אַחַר הַמַּבּוּל
  choice: после потопа
  rationale: Определённая форма указывает на уже известный из повествования потоп; в русском контексте это однозначно и без прописной буквы.
theological_decisions: []
