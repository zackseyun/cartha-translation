  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: В родословной формуле глагол חיה обозначает число лет, прожитых до названного далее события; «прожил» естественно передаёт эту последовательность.
- source_word: פֶלֶג
  choice: Пелег
  rationale: Принята традиционная русская передача библейского личного имени.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: тридцать лет
  rationale: Еврейское выражение указывает возраст Пелега при рождении сына; по-русски оно естественно сочетается с «прожил».
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Каузативная форма ילד в мужской родословной означает, что у названного мужчины родился сын. «Стал отцом» ясно и современно, без архаизма «родил» применительно к мужчине.
- source_word: אֶת
  choice: не переводится
  rationale: Показатель определённого прямого дополнения не имеет отдельного соответствия в русском языке.
- source_word: רְעוּ
  choice: Реу
  rationale: Принята традиционная русская передача личного имени.
