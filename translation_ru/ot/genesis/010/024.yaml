- source_word: וְ/אַרְפַּכְשַׁד
  choice: Арпахшад
  rationale: Имя передано непосредственно с еврейской формы אַרְפַּכְשַׁד; написание «Арфаксад» восходит к традиции, испытавшей греческое влияние.
- source_word: יָלַד
  choice: родил
  rationale: В родословии при подлежащем мужского рода глагол обозначает рождение потомка от данного мужчины. Русское «родил» лаконично и сохраняет повтор и формальную структуру еврейского текста; контекст исключает физиологическое понимание.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, функция которого в русском выражена синтаксисом.
- source_word: שָׁלַח / וְ/שֶׁלַח
  choice: Шелах / а Шелах
  rationale: Имя передано по еврейской форме שָׁלַח/שֶׁלַח. Соединительный וְ во второй части естественно передан русским «а», обозначающим переход к следующему звену родословия без противопоставления.
- source_word: עֵבֶר
  choice: Эвер
  rationale: Передача имени עֵבֶר через «Эвер» близка к еврейскому звучанию и соответствует современному принципу транслитерации; традиционное «Евер» менее явно отражает начальную гортанную согласную.
