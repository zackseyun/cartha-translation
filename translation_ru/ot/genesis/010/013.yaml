lexical_decisions:
- source_word: מִצְרַיִם
  choice: Мицраим
  rationale: В таблице народов это имя родоначальника; транслитерация сохраняет его функцию собственного имени, не подменяя её географическим названием «Египет».
- source_word: יָלַד
  choice: произвёл на свет
  rationale: В данной родословной глагол обозначает происхождение потомков от мужчины. Формулировка естественна по-русски и допускает собирательное понимание названных народов.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, функция которого передаётся русским синтаксисом и формой винительного падежа.
- source_word: לוּדִים
  choice: лудимов
  rationale: Транслитерированное название народа с русским оформлением множественного числа и винительного падежа.
- source_word: עֲנָמִים
  choice: анамимов
  rationale: Транслитерированное название народа, сохраняющее форму и характер еврейского этнонима.
- source_word: לְהָבִים
  choice: легавимов
  rationale: Транслитерация отражает согласную ה как «г», принятую в русской библейской традиции; неопределённые позднейшие отождествления в основной текст не внесены.
- source_word: נַפְתֻּחִים
  choice: нафтухимов
  rationale: Транслитерированное название народа с передачей ח как «х».
- source_word: וְ
  choice: и
  rationale: Обычный русский союз, связывающий последний элемент перечисления.
