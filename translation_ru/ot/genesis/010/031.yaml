  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: ru
  text: Вот сыновья Сима — по их родам, по их языкам, в их землях, по их народам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально повторяющиеся еврейские предлоги распределяют потомков Сима по родам, языкам и народам.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит итоговую формулу; «вот» естественно передаёт еврейскую безглагольную конструкцию.
- source_word: בְנֵי שֵׁם
  choice: сыновья Сима
  rationale: Сохранена формальная генеалогическая формула и традиционная русская передача имени שֵׁם как «Сим» с родительным падежом «Сима».
- source_word: לְמִשְׁפְּחֹתָם
  choice: по их родам
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу; «роды» уместны в библейском генеалогическом контексте, а «по» передаёт классифицирующее значение предлога לְ.
- source_word: לִלְשֹׁנֹתָם
  choice: по их языкам
  rationale: לָשׁוֹן буквально означает «язык» и здесь относится к языковым группам; перевод сохраняет и смысл, и повтор классифицирующего предлога.
- source_word: בְּאַרְצֹתָם
  choice: в их землях
  rationale: Множественное אֶרֶץ обозначает земли или территории проживания; «земли» не привносит представления о современных государствах.
- source_word: לְגוֹיֵהֶם
  choice: по их народам
  rationale: גּוֹי здесь означает народ как этническую общность; «по» сохраняет параллельную классифицирующую конструкцию.
