base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: ru
  text: Вот роды[a] сыновей Ноя, по их поколениям, по их народам[b]; от них отделились народы[c] на земле после потопа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семейства»; также возможно: «племена».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по их поколениям, в их народах».'
    reason: syntactic_alternative
  - marker: c
    text: 'Или: «разошлись» или «расселились».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: роды
  rationale: Слово обозначает родственные группы. «Роды» естественно для генеалогического итога и точнее передаёт более широкую общность, чем отдельная семья.
- source_word: לְתוֹלְדֹתָם
  choice: по их родословиям
  rationale: В данном итоговом стихе תּוֹלְדוֹת указывает на линии происхождения и перечисление потомков; «родословия» ясно передаёт эту функцию.
- source_word: בְּגוֹיֵהֶם
  choice: по их народам
  rationale: Предлог ב здесь можно понимать как указание на распределение или группировку. Повтор «по» сохраняет параллелизм с «по их родословиям» и звучит естественно по-русски.
- source_word: וּמֵאֵלֶּה
  choice: От них
  rationale: Кратко и естественно связывает заключение с перечисленными родами сыновей Ноя; начальный союз в русском не обязателен после разделения предложения.
- source_word: נִפְרְדוּ
  choice: отделились
  rationale: Форма нифаль от פרד выражает разделение. «Отделились» сохраняет эту смысловую основу, не сводя её только к географическому расселению.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В контексте таблицы народов речь идёт о крупных группах людей, происходящих от сыновей Ноя.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Контекст послепотопного происхождения народов предполагает землю в широком, всемирном смысле.
- source_word: אַחַר הַמַּבּוּל
  choice: после потопа
  rationale: Прямой и естественный перевод временного оборота.
theological_decisions:
- issue: Масштаб значения אֶרֶץ
  choice: земля в общем, всемирном смысле
  alternative: определённая страна или территория
  rationale: Стих завершает перечень всех народов, ведущих происхождение от сыновей Ноя, поэтому намеренно не сужает значение до одной местности.
- issue: Характер разделения народов в נִפְרְדוּ
  choice: отделились
  alternative: расселились / разошлись
  rationale: Выбранный вариант сохраняет идею разделения, не уточняя сверх текста, было ли главным образом географическое расселение или образование отдельных народов.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием итоговой формулы. Два еврейских предложных оборота переданы параллельной конструкцией «по… по…». Длинное еврейское предложение разделено на два русских для ясности; смысловая связь сохранена.
