  yaml_path: translation/ot/genesis/010/027.yaml
  text: and Hadoram[a], and Uzal, and Diklah.
translation:
  language: ru
  text: и Хадорама[a], и Узала, и Диклу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это собственные имена в перечне народов; различия в их написании связаны с особенностями транслитерации, а не со значением.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אֶת
  choice: и
  rationale: וְ перед непереводимым показателем прямого дополнения אֵת связывает однородные элементы генеалогического перечня; по-русски эта структура естественно передаётся союзом «и».
- source_word: הֲדוֹרָם
  choice: Хадорама
  rationale: Имя транслитерировано в принятой русской библейской форме; винительный падеж обусловлен тем, что אֵת отмечает прямое дополнение продолжающегося предложения.
- source_word: אוּזָל
  choice: Узала
  rationale: Собственное имя передано транслитерацией и поставлено в винительном падеже в соответствии с синтаксисом еврейского текста.
- source_word: דִּקְלָה
  choice: Диклу
  rationale: Собственное имя передано традиционной русской формой «Дикла» и поставлено в винительном падеже как прямое дополнение.
theological_decisions: []
