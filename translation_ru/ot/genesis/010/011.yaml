base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: ru
  text: Из той земли вышел Ассур и построил Ниневию[a], Реховоф-Ир и Калах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из той земли он вышел в Ассирию и построил Ниневию, Реховоф-Ир и Калах». При таком прочтении подразумеваемым подлежащим остаётся Нимрод из предыдущего стиха, а אַשּׁוּר означает Ассирию, а не Ассура.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: Из той земли
  rationale: Предлог מִן указывает на исходную точку, а אֶרֶץ здесь обозначает территорию. Формулировка естественна для современного русского языка и сохраняет географический смысл.
- source_word: יָצָא
  choice: вышел
  rationale: Глагол יצא обычно означает «выходить». Форма «вышел» прямо передаёт движение из ранее названной земли и не придаёт тексту архаического оттенка.
- source_word: אַשּׁוּר
  choice: Ассур
  rationale: Имя может обозначать как человека Ассура, так и страну Ассирию. В основном тексте оно понято как явно названное подлежащее, что естественно соответствует непосредственному синтаксису фразы; географическое прочтение сохранено в сноске.
- source_word: וַיִּבֶן
  choice: и построил
  rationale: בנה — обычный глагол со значением «строить». «Построил» передаёт его прямо, тогда как «основал» было бы более узким толкованием.
- source_word: נִינְוֵה
  choice: Ниневию
  rationale: Употреблена традиционная русская форма названия города с требуемым винительным падежом.
- source_word: רְחֹבֹת עִיר
  choice: Реховоф-Ир
  rationale: В перечне городов сочетание вероятнее всего является географическим названием. Транслитерация сохраняет это понимание, не заменяя его менее вероятным нарицательным переводом вроде «городские площади».
- source_word: כָּלַח
  choice: Калах
  rationale: Употреблена традиционная русская передача названия города.
theological_decisions:
- issue: Подлежащее и значение אַשּׁוּר
  choice: 'Ассур является подлежащим: «вышел Ассур»'
  alternative: «Он вышел в Ассирию», где подразумеваемое подлежащее — Нимрод из предыдущего стиха, а אַשּׁוּר обозначает страну
  rationale: Древнееврейский текст допускает оба прочтения, поскольку אַשּׁוּר может обозначать Ассура или Ассирию. Непосредственный синтаксис естественно позволяет считать אַשּׁוּר явно выраженным подлежащим, не перенося подлежащее из предыдущего стиха. Подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и достойное, без архаизмов. Традиционные русские формы библейских географических названий сохранены.
