  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: ru
  text: 'Сыновья Куша: Сева[a], Хавила, Савта, Раама и Савтеха[b]. Сыновья Раамы: Шева и Дедан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословиях древнееврейское выражение «сыновья» может обозначать не только непосредственных сыновей, но и потомков, а также роды или народы, ведущие от них происхождение.
    reason: cultural_note
  - marker: b
    text: Некоторые имена в этом стихе могут обозначать народы, области или предков, по имени которых были названы народы, а не только отдельных людей.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן прямо означает «сыновья»; в родословиях она может обозначать также потомков или народы, что пояснено в сноске. Начальный союз естественно не передаётся отдельно в русском перечне родословий.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Имя передано транслитерацией с древнееврейского, без отождествления с конкретной позднейшей страной или народом.
- source_word: סְבָא
  choice: Сева
  rationale: Транслитерация имени с различением от שְׁבָא («Шева») в конце стиха.
- source_word: חֲוִילָה
  choice: Хавила
  rationale: Прямая, естественная для русского языка транслитерация древнееврейского имени.
- source_word: סַבְתָּה
  choice: Савта
  rationale: Транслитерация древнееврейской формы с передачей ב без дагеша как «в» и תּ как «т».
- source_word: רַעְמָה
  choice: Раама
  rationale: Транслитерация сохраняет две гласные вокруг гортанной ע, не подбирая спорного географического соответствия.
- source_word: סַבְתְּכָא
  choice: Савтеха
  rationale: Форма близко передаёт согласные и огласовку древнееврейского имени и отличает его от Савты.
- source_word: וּבְנֵי רַעְמָה
  choice: Сыновья Раамы
  rationale: Повтор родословной формулы сохранён; русское родительное окончание делает выражение естественным.
- source_word: שְׁבָא
  choice: Шева
  rationale: Транслитерация с «ш» отражает שׁ и позволяет отличить это имя от סְבָא («Сева»).
- source_word: דְדָן
  choice: Дедан
  rationale: Имя передано прямо, без превращения в название этнической группы.
theological_decisions:
- issue: Значение формулы «сыновья» в перечне народов
  choice: В основном тексте сохранено буквальное «сыновья», а расширенный родословно-этнический смысл указан в сносках.
  alternative: Перевести как «потомки» или «народы, произошедшие от».
  rationale: Так сохраняются форма и неоднозначность древнееврейского текста без сведения названных фигур исключительно к непосредственным биологическим сыновьям либо исключительно к народам.
translation_notes:
  register: Современный литературный русский язык; краткая структура перечня сохранена. Имена последовательно транслитерированы с древнееврейского, при этом Сева и Шева различены по исходным согласным.
