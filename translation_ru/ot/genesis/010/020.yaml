  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: ru
  text: Вот потомки Хама[a] — по своим родам, по своим языкам, в своих землях, по своим народам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «сыновья Хама».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Вводит итоговое указание и перечисление; по-русски естественно передаёт идентифицирующую силу еврейского указательного местоимения.
- source_word: בְנֵי חָם
  choice: потомки Хама
  rationale: Буквально «сыновья Хама», однако в генеалогическом контексте בְּנֵי охватывает также последующие поколения; «потомки» ясно передаёт функцию выражения.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по своим родам
  rationale: Предлог לְ здесь обозначает распределение или классификацию; «роды» передаёт родственные объединения точнее, чем бытовое «семьи».
- source_word: לִלְשֹׁנֹתָם
  choice: по своим языкам
  rationale: לָשׁוֹן буквально означает «язык», а здесь метонимически — язык речи; повтор «по своим» сохраняет классифицирующую структуру.
- source_word: בְּאַרְצֹתָם
  choice: в своих землях
  rationale: Предлог בְּ имеет местное значение; «земли» не привносит современного представления о государствах.
- source_word: בְּגוֹיֵהֶם
  choice: по своим народам
  rationale: Несмотря на предлог בְּ, в итоговой формуле выражение обозначает группировку по народам; русский оборот «по своим народам» передаёт это значение и отличает его от местного «в своих землях».
