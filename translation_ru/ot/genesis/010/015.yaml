lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Ханаан
  rationale: Союз ו продолжает генеалогический перечень; в русском начале стиха отдельное «и» необязательно. Имя передано в принятой русской библейской форме «Ханаан».
- source_word: יָלַד
  choice: стал отцом
  rationale: В мужской генеалогической линии глагол означает рождение или произведение потомства. «Стал отцом» естественно для современного русского языка и не использует архаичное «родил» применительно к мужчине.
- source_word: אֶת
  choice: не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке.
- source_word: צִידֹן
  choice: Сидона
  rationale: Имя צִידֹן передано принятой русской формой «Сидон» и поставлено в родительный падеж после выражения «стал отцом».
- source_word: בְּכֹר/וֹ
  choice: своего первенца
  rationale: Существительное с суффиксом 3-го лица мужского рода указывает, что Сидон был первенцем Ханаана. Возвратное «своего» однозначно связывает первенца с подлежащим.
- source_word: וְ/אֶת
  choice: и
  rationale: Союз вводит второй однородный объект, а показатель прямого дополнения отдельно не переводится.
- source_word: חֵת
  choice: Хета
  rationale: Личное имя передано традиционной русской библейской формой «Хет» без поясняющего добавления в основном тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткой генеалогической структуры. Формулировка «стал отцом» выбрана вместо архаического «родил» или «породил». Маркер сноски помещён после всего утверждения о Хете, к которому относится пояснение.
