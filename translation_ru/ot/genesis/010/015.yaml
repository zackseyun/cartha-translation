  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: ru
  text: Ханаан стал отцом Сидона, своего первенца, и Хета.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
