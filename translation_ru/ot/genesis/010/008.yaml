lexical_decisions:
- source_word: וְכוּשׁ
  choice: И Хуш
  rationale: Союз וְ продолжает родословное повествование; имя כּוּשׁ передано в принятой русской библейской форме «Хуш».
- source_word: יָלַד
  choice: родил
  rationale: В родословиях глагол обозначает рождение потомка от названного мужчины. «Родил» кратко и непосредственно сохраняет формулу еврейского текста; смысл — «стал отцом».
- source_word: נִמְרֹד
  choice: Нимрода
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение возобновляет указание на Нимрода и явно обозначает подлежащее следующей части.
- source_word: הֵחֵל לִהְיוֹת
  choice: начал становиться
  rationale: Формально передаёт начинательное значение הֵחֵל с инфинитивом היה и не добавляет спорного смысла «стал первым».
- source_word: גִּבֹּר
  choice: могучим человеком
  rationale: גִּבּוֹר может обозначать сильного, могущественного человека, героя или воина. Широкое «могучий человек» не сужает значение до исключительно военного.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Естественное русское соответствие в данном контексте; אֶרֶץ допускает как широкий смысл «земля», так и региональный «страна».
theological_decisions:
- issue: Значение הֵחֵל לִהְיוֹת
  choice: начал становиться
  alternative: стал первым могучим человеком
  rationale: Еврейская конструкция прямо выражает начало состояния или процесса. Значение первенства возможно как контекстуальный вывод, но не должно безоговорочно вноситься в основной текст.
- issue: Объём значения אֶרֶץ
  choice: земля
  alternative: страна
  rationale: В контексте перечня народов широкий смысл вероятен, однако лексическая неоднозначность сохранена в примечании и не превращена в доктринальное утверждение.
- issue: Характер могущества Нимрода
  choice: могучий человек
  alternative: воин / герой
  rationale: Стих сам по себе не требует сугубо военного понимания גִּבּוֹר; более широкая передача сохраняет напряжение до последующего контекста.
translation_notes:
  register: Современный литературный русский с краткой родословной формулой и сдержанно торжественным библейским звучанием. Необычное «начал становиться» сохранено ради точной передачи начинательной конструкции оригинала; неоднозначности גִּבּוֹר и אֶרֶץ вынесены в примечания.
