  text: и иевусеев, аморреев и гиргашеев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: иевусеев
  rationale: Еврейское прилагательное-этноним стоит в единственном числе, но употреблено собирательно и обозначает народ; русский родительный множественного числа естественно продолжает перечень потомков Ханаана.
- source_word: הָאֱמֹרִי
  choice: амореев
  rationale: Форма единственного числа имеет собирательное значение. В контексте перечня народов по-русски естественна форма множественного числа.
- source_word: הַגִּרְגָּשִׁי
  choice: гергесеев
  rationale: Этноним в единственном числе обозначает народ в целом; традиционная русская форма «гергесеи» передана родительным множественного числа в соответствии с синтаксисом продолжающегося перечня.
- source_word: וְאֶת / וְאֵת
  choice: и
  rationale: Союз ו продолжает перечисление, а показатель прямого дополнения אֵת отдельно не переводится. Повторять «и» перед каждым элементом в современном русском необязательно.
