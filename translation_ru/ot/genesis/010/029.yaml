  yaml_path: translation/ot/genesis/010/029.yaml
  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: ru
  text: Офира, Хавилу и Иовава. Все они — сыновья[a] Иоктана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки Иоктана». В родословиях еврейское выражение «сыновья» иногда может иметь более широкое значение, однако здесь оно, вероятнее всего, относится к только что перечисленным сыновьям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: показано перечислением и союзом «и» перед последним именем
  rationale: Повторяющееся אֵת отмечает прямые дополнения в продолжающемся с предыдущего стиха перечне; в русском отдельного соответствия этому показателю нет. Союз ו естественно передан в структуре перечисления.
- source_word: אוֹפִר
  choice: 'Офир (в тексте: Офира)'
  rationale: Собственное имя передано в принятой русской библейской форме; винительный падеж обусловлен синтаксическим продолжением предыдущего стиха.
- source_word: חֲוִילָה
  choice: 'Хавила (в тексте: Хавилу)'
  rationale: Собственное имя передано в принятой русской библейской форме и поставлено в винительный падеж как прямое дополнение.
- source_word: יוֹבָב
  choice: 'Иовав (в тексте: Иовава)'
  rationale: Собственное имя передано традиционной русской транслитерацией и поставлено в винительный падеж.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественная для современного русского итоговая формула, относящаяся ко всем только что перечисленным лицам.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Хотя в родословиях слово может обозначать потомков шире, непосредственный контекст представляет перечень названных сыновей; основное значение здесь наиболее естественно.
- source_word: יָקְטָן
  choice: 'Иоктан (в тексте: Иоктана)'
  rationale: Использована устоявшаяся русская библейская форма имени; родительный падеж соответствует конструкции «сыновья Иоктана».
theological_decisions:
- issue: Широта родословного обозначения בְּנֵי
  choice: сыновья Иоктана
  alternative: потомки Иоктана
  rationale: Сохранено прямое родственное значение, лучше всего соответствующее ближайшему контексту, а более широкая возможность отмечена в сноске без устранения лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства родословного повествования. Формы имён соответствуют устойчивой русской библейской традиции; падежные окончания передают связь стиха с продолжающимся перечнем из предыдущего контекста.
