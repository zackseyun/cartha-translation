base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: ru
  text: Граница хананеев проходила от Сидона в сторону Герара до Газы, а в сторону Содома, Гоморры, Адмы и Цевоима — до Лаши[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Леши».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: проходила
  rationale: В повествовательной формуле глагол היה служит связкой; по-русски применительно к границе естественно сказать «граница проходила».
- source_word: גְּבוּל
  choice: граница
  rationale: В географическом контексте слово обозначает предел территории или пограничную линию.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Форма единственного числа употреблена собирательно и обозначает народ; русский родительный множественного числа естественно сочетается со словом «граница».
- source_word: מִצִּידֹן
  choice: от Сидона
  rationale: Предлог מִן обозначает исходную точку описания границы; «Сидон» — принятая русская форма названия.
- source_word: בֹּאֲכָה
  choice: в сторону
  rationale: В описаниях границ эта идиома указывает направление движения или ориентацию; «в сторону» естественно передаёт её без введения отсутствующего в еврейском тексте конкретного путника.
- source_word: גְרָרָה
  choice: Герара
  rationale: Направительное окончание передано конструкцией «в сторону Герара»; использована традиционная русская форма топонима.
- source_word: עַד
  choice: до
  rationale: Предлог обозначает конечный предел границы; краткое русское «до» точно и естественно.
- source_word: עַזָּה
  choice: Газы
  rationale: Использована традиционная русская форма топонима в родительном падеже после «до».
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Содома, Гоморры, Адмы и Цевоима
  rationale: Топонимы образуют последовательность, задающую направление границы; употреблены привычные русские библейские формы.
- source_word: לָשַׁע
  choice: Лаши
  rationale: Форма «Лаша» непосредственно отражает масоретскую огласовку לָשַׁע; в тексте поставлена в родительный падеж после «до», а вариант названия сохранён в примечании.
