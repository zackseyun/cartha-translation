translation_notes:
  register: Современный литературный русский язык с достоинством библейского географического перечня. Две параллельные конструкции «в сторону… до…» сохраняют структуру и некоторую синтаксическую неоднозначность еврейского описания границы; тире облегчает чтение длинного ряда топонимов.
