  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: ru
  text: и арвадцев, и цемарян, и хаматян. После этого племена хананеев рассеялись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: арвадцев
  rationale: Собирательное название жителей Арвада в перечне народов; русская форма множественного числа естественно передаёт значение.
- source_word: הַצְּמָרִי
  choice: цемарян
  rationale: Собирательный этноним, обозначающий народ Цемара; форма множественного числа соответствует функции слова в перечне.
- source_word: הַחֲמָתִי
  choice: хаматян
  rationale: Собирательное название жителей Хамата; русское множественное число ясно передаёт групповой смысл.
- source_word: וְאַחַר
  choice: После этого
  rationale: Передаёт временную последовательность и естественно связывает последующее расселение с предшествующим перечнем.
- source_word: נָפֹצוּ
  choice: рассеялись
  rationale: Форма нифаль выражает рассеяние или расселение; возвратный русский глагол сохраняет непереходный результативный смысл без указания действующего лица.
- source_word: מִשְׁפְּחוֹת
  choice: племена
  rationale: В этногенеалогическом контексте речь идёт о крупных родственных группах, а не о домашних семьях; «племена» понятно современному читателю.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Грамматически это собирательное единственное число, обозначающее весь народ; русское множественное число передаёт его смысл естественно.
