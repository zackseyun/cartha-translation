  text: Иоктан родил Алмодада, Шелефа, Хацармавета и Иераха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И Иоктан родил Алмодада, и Шелефа, и Хацармавета, и Иераха». Повторяющийся перед каждым именем союз «и» в основном тексте стилистически сглажен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָקְטָן
  choice: Иоктан
  rationale: Личное имя передано в принятой русской библейской форме; начальный союз естественно выражен связью с предыдущим контекстом и отдельно в данном стихе не воспроизводится.
- source_word: יָלַד
  choice: родил
  rationale: В родословной эта форма обозначает отцовство и происхождение потомков; «родил» сохраняет лаконичную библейскую формулу и остаётся понятным современному читателю.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, функция которого в русском выражается падежной формой имён.
- source_word: אַלְמוֹדָד
  choice: Алмодада
  rationale: Личное имя транслитерировано в традиционной русской библейской форме и поставлено в винительный падеж.
- source_word: שָׁלֶף
  choice: Шелефа
  rationale: Личное имя передано близко к еврейскому звучанию и поставлено в винительный падеж.
- source_word: חֲצַרְמָוֶת
  choice: Хацармавета
  rationale: Личное имя передано в принятой русской библейской форме; начальное ח отражено буквой «Х».
- source_word: יָרַח
  choice: Иераха
  rationale: Личное имя передано в традиционной русской библейской форме и поставлено в винительный падеж.
