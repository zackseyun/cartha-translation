  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
translation:
  language: ru
  text: 'И сыновья Арама: Уц, Хул, Гефер и Маш[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте этого стиха — Маш; в 1 Пар. 1:17 — Мешех.
