lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыны
  rationale: Форма множественного числа слова בֵּן в сопряжённом состоянии с союзом וְ. В родословном перечне «сыны» прямо и естественно передаёт формулу происхождения; начальный союз отдельно не выражен, поскольку стих продолжает список.
- source_word: אֲרָם
  choice: Арама
  rationale: Традиционная русская передача имени; родительный падеж обусловлен конструкцией «сыны Арама».
- source_word: עוּץ
  choice: Уц
  rationale: Традиционная русская транслитерация еврейского личного имени עוּץ.
- source_word: חוּל
  choice: Хул
  rationale: Традиционная русская транслитерация имени חוּל, сохраняющая начальный гортанный согласный через «х».
- source_word: גֶתֶר
  choice: Гефер
  rationale: Устоявшаяся русская библейская форма имени; еврейская буква ת без дагеша традиционно передаётся здесь как «ф».
- source_word: מַשׁ
  choice: Маш
  rationale: Основной текст следует масоретскому чтению מַשׁ; отличающееся чтение в 1 Пар 1:17 отмечено в сноске.
theological_decisions: []
translation_notes:
  register: Краткая родословная формула передана на современном литературном русском языке с сохранением традиционных русских форм библейских имён. Маркер сноски поставлен после «Маш», поскольку вариант относится именно к этому имени.
