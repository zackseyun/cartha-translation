base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: ru
  text: 'У Евера родились два сына: одного звали Пелег, потому что в его дни земля была разделена[a], а его брата звали Иоктан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна была разделена». Еврейское слово может означать как землю вообще, так и страну или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: У Евера
  rationale: Еврейская конструкция с предлогом לְ вводит того, у кого родились сыновья; по-русски естественно передать её как «У Евера родились».
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: родились два сына
  rationale: Пассивная форма ילד означает «были рождены / родились»; русское «родились два сына» точно и естественно передаёт число и залог.
- source_word: שֵׁם הָאֶחָד
  choice: одного звали
  rationale: Буквально «имя одного»; идиоматическая русская конструкция сохраняет противопоставление одного сына его брату, не добавляя отсутствующего в тексте слова «первый».
- source_word: פֶּלֶג
  choice: Фалек
  rationale: Использована традиционная русская библейская форма имени, понятная русскоязычному читателю.
- source_word: כִּי בְיָמָיו
  choice: потому что в его дни
  rationale: כִּי вводит объяснение имени, а выражение בְיָמָיו буквально и естественно передаётся как «в его дни».
- source_word: נִפְלְגָה
  choice: была разделена
  rationale: Нифаль глагола פלג обозначает разделение; пассивная формулировка также сохраняет звуковую связь с именем Фалек, насколько это возможно в традиционной транслитерации.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Русское «земля», как и еврейское אֶרֶץ, допускает широкий смысл «земля, мир» и более узкий «страна, территория», позволяя сохранить исходную неоднозначность.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: а его брата звали Иоктан
  rationale: Союз передаёт сопоставление двух братьев; русская конструкция звучит естественно и сохраняет смысл еврейского «имя его брата — Иоктан».
theological_decisions:
- issue: Масштаб значения הָאָרֶץ в объяснении имени Фалека
  choice: земля
  alternative: страна; территория
  rationale: Контекст перечня народов допускает глобальный смысл, но само слово אֶרֶץ может обозначать и определённую землю или территорию. Основной русский вариант «земля» сохраняет эту смысловую открытость, а примечание прямо указывает альтернативу, не определяя механизм или масштаб разделения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Синтаксис слегка сглажен по нормам русского языка, при этом сохранены генеалогическая структура, пассивный смысл глагола и неоднозначность слова אֶרֶץ.
