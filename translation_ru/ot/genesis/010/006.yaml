  text: וּ/בְנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם וּ/פ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: ru
  text: 'И сыновья Хама: Куш, Мицраим[a], Пут[b] и Ханаан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мицраим — еврейское имя, которым также обозначается Египет. В этом родословии оно передано как имя родоначальника.
    reason: alternative_reading
  - marker: b
    text: Имя «Пут» в русской библейской традиции также передаётся как «Фут».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «И», чтобы сохранить связь с предшествующим родословием; בְנֵי — форма сопряжённого множественного числа «сыновья», которая здесь обозначает названных родоначальников и их линии.
- source_word: חָם
  choice: Хама
  rationale: Имя передано в общепринятой русской библейской форме; родительный падеж обусловлен сочетанием «сыновья Хама».
- source_word: כּוּשׁ
  choice: Куш
  rationale: Транслитерация еврейского имени в современной русской форме, близкой исходному звучанию.
- source_word: וּ/מִצְרַיִם
  choice: Мицраим[a]
  rationale: В родословии слово передано как имя родоначальника, а не заменено названием страны «Египет»; примечание сохраняет связь между этими значениями.
- source_word: וּ/פוּט
  choice: Пут[b]
  rationale: Форма «Пут» непосредственно передаёт еврейские согласные פ־ו־ט; традиционная русская форма «Фут» указана в примечании.
- source_word: וּ/כְנָעַן
  choice: и Ханаан
  rationale: Использована устоявшаяся русская форма имени; союз перед последним элементом естественно оформляет перечисление и соответствует еврейскому ו.
