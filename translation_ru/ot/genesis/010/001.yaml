lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Вводит новый раздел повествования; «вот» естественно выполняет указательно-заголовочную функцию, а соединительное ו не требует отдельного «и» в начале русского заголовка.
- source_word: תּוֹלְדֹת
  choice: родословие
  rationale: Сохраняет формульный характер заголовков книги Бытия и достаточно широко указывает на родовую линию; возможное более узкое значение «потомки» вынесено в сноску.
- source_word: בְּנֵי נֹחַ
  choice: сыновей Ноя
  rationale: Прямая и современная передача древнееврейской сопряжённой конструкции.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Сима, Хама и Иафета
  rationale: Традиционные русские формы личных имён; падеж обусловлен приложением к словосочетанию «сыновей Ноя».
- source_word: וַיִּוָּלְדוּ
  choice: родились
  rationale: Нифаль глагола ילד передаёт рождение, а не активное действие отцовства.
- source_word: לָהֶם
  choice: у них
  rationale: Естественная русская конструкция принадлежности при глаголе «родились», соответствующая древнееврейскому לָהֶם.
- source_word: בָּנִים
  choice: сыновья
  rationale: Сохраняет явно мужское значение исходного слова, существенное в генеалогическом контексте.
- source_word: אַחַר הַמַּבּוּל
  choice: после потопа
  rationale: Ясная и традиционно понятная передача временного указания и термина מַבּוּל в контексте Бытия.
theological_decisions:
- issue: Передача формулы תּוֹלְדֹת
  choice: родословие
  alternative: потомки
  rationale: «Родословие» сохраняет литературную функцию повторяющейся формулы Бытия и не сводит её исключительно к перечню потомков; более узкая возможность отмечена в сноске.
- issue: Мужское значение בָּנִים
  choice: сыновья
  alternative: дети
  rationale: Исходный текст употребляет мужское множественное число, и дальнейшая генеалогия перечисляет мужских потомков; нейтральное «дети» сгладило бы эту особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном заголовка. Тире ясно показывает, что Сим, Хам и Иафет — сыновья Ноя. Начальное «И» во втором предложении сохраняет связь, выраженную древнееврейским союзом, не нарушая естественности русского повествования.
