  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: ru
  text: и патрусимов, и каслухимов (оттуда вышли филистимляне)[a], и кафторимов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оттуда вышли филистимляне». По месту этой фразы в перечне она может указывать на происхождение филистимлян от названных непосредственно перед ними каслухимов.'
    reason: Сохранение возможной синтаксической неоднозначности исходного текста.
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: патрусимов
  rationale: Название народа передано транслитерацией в форме винительного падежа, требуемой повторяющимся показателем прямого дополнения אֶת.
- source_word: כַּסְלֻחִים
  choice: каслухимов
  rationale: Не вполне идентифицированный этноним передан транслитерацией без попытки истолковать его значение.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: оттуда вышли
  rationale: Передаёт буквальный пространственный образ еврейского מִשָּׁם и глагола יָצְאוּ, не усиливая его до однозначного утверждения о происхождении от конкретного народа.
- source_word: פְּלִשְׁתִּים
  choice: филистимляне
  rationale: Употреблено общепринятое русское название этого народа.
- source_word: כַּפְתֹּרִים
  choice: кафторимов
  rationale: Этноним передан транслитерацией и поставлен в винительный падеж по синтаксису перечня.
- source_word: וְאֶת
  choice: и
  rationale: Союз передан явно, тогда как служебный показатель прямого дополнения отдельно не переводится.
theological_decisions:
- issue: К чему относится замечание о выходе филистимлян
  choice: Сохранено наречное выражение «оттуда», а замечание помещено после каслухимов.
  alternative: «от каслухимов произошли филистимляне»
  rationale: Еврейский текст буквально говорит «оттуда вышли филистимляне». Положение придаточной части допускает связь с непосредственно названными каслухимами, но прямое указание на происхождение именно от них было бы более определённым, чем исходная формулировка.
translation_notes:
  register: Современный литературный русский с традиционными формами библейских этнонимов; сохранены перечислительный ритм и синтаксическая зависимость фрагмента от предыдущего стиха.
