  source_fidelity: Текст точно передаёт перечисление этнонимов и сохраняет буквальное наречное «оттуда» в אֲשֶׁר יָצְאוּ מִשָּׁם. Это не превращает спорную связь придаточного в однозначное утверждение, что филистимляне произошли именно от каслухимов. Порядок народов и родительный/винительный характер зависимого от предыдущего стиха перечня сохранены.
