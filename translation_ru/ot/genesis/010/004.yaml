lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Сыновья
  rationale: Сохраняет прямую генеалогическую формулу древнееврейского текста; в данном перечне слово может обозначать также потомков или родственные народы, но перевод «сыновья» не устраняет эту естественную для родословий широту.
- source_word: יָוָן
  choice: Иаван
  rationale: Традиционная и узнаваемая русская передача имени; имя не заменяется толкованием «греки» или «ионийцы».
- source_word: אֱלִישָׁה
  choice: Елиса
  rationale: Устоявшаяся русская библейская передача имени или названия, соответствующая древнееврейской форме.
- source_word: וְ/תַרְשִׁישׁ
  choice: Фарсис
  rationale: Устоявшаяся русская библейская форма географического или этнического названия.
- source_word: כִּתִּים
  choice: Киттим
  rationale: Передаёт форму множественного числа этнонима и соответствует современной русской транслитерации.
- source_word: וְ/דֹדָנִים
  choice: Доданим
  rationale: Основной текст следует масоретскому чтению WLC דֹדָנִים; вариант «Роданим» вынесен в текстологическую сноску.
