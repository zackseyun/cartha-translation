id: GEN.10.12
reference: Genesis 10:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: ru
  text: и Ресен — между Ниневией и Калахом[a]; это великий город[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Кальху» — ассирийская форма названия города, традиционно передаваемого как «Калах».
    reason: lexical_alternative
  - marker: b
    text: Слова «это великий город» могут относиться непосредственно к Ресену или к более обширной городской области между Ниневией и Калахом.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: и
  rationale: Союз וְ с показателем прямого дополнения אֵת вводит следующий объект в перечне городов; по-русски достаточно союза «и».
- source_word: רֶסֶן
  choice: Ресен
  rationale: Собственное географическое название передано традиционной русской транслитерацией.
- source_word: בֵּין ... וּבֵין
  choice: между ... и
  rationale: Обычная передача парной предложной конструкции, указывающей положение Ресена относительно двух городов.
- source_word: נִינְוֵה
  choice: Ниневией
  rationale: Использована устоявшаяся русская форма «Ниневия» в падеже, требуемом предлогом «между».
- source_word: כָּלַח
  choice: Калахом
  rationale: Сохранена традиционная библейская форма еврейского топонима; ассирийская форма указана в сноске.
- source_word: הִוא
  choice: это
  rationale: Самостоятельное местоимение выполняет возобновляющую связочную функцию; «это» естественно передаёт пояснительный характер фразы, не уточняя её референт.
- source_word: הָעִיר
  choice: город
  rationale: Определённость существительного в данном именном предложении естественно выражается по-русски контекстом.
- source_word: הַגְּדֹלָה
  choice: великий
  rationale: גדול может обозначать как величину, так и значительность; «великий город» сохраняет эту смысловую широту и звучит достойно.
theological_decisions:
- issue: К чему относится выражение «это великий город»
  choice: Фраза сохранена без явного уточнения её референта.
  alternative: Она может относиться непосредственно к Ресену либо к более широкой городской области между Ниневией и Калахом.
  rationale: Еврейский синтаксис не позволяет бесспорно определить референт заключительной фразы, поэтому перевод не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире отделяет уточнение местоположения Ресена, а точка с запятой сохраняет формальную связь с заключительной неоднозначной фразой.
