lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: От них
  rationale: 'Предлог מִן с указательным местоимением обозначает происхождение: перечисляемые группы произошли от названных выше потомков Иафета.'
- source_word: נִפְרְדוּ
  choice: отделились
  rationale: Нифаль глагола פרד передаёт разделение или обособление; возвратная форма «отделились» естественно описывает разграничение групп.
- source_word: אִיֵּי הַגּוֹיִם
  choice: народы островов и побережий[a]
  rationale: אִיִּים может обозначать как острова, так и приморские земли. Метонимическое выражение «народы островов и побережий» позволяет естественно согласовать географический термин с последующими указаниями на язык и роды, не скрывая буквальную конструкцию, приведённую в сноске.
- source_word: בְּאַרְצֹתָם
  choice: в своих землях
  rationale: אֶרֶץ здесь обозначает территории расселения; «земли» сохраняет широкий территориальный смысл.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: каждый по своему языку
  rationale: אִישׁ употреблено дистрибутивно, а לָשׁוֹן означает язык; русская формулировка точно и естественно передаёт распределение по языковым группам.
- source_word: לְמִשְׁפְּחֹתָם
  choice: по своим родам
  rationale: מִשְׁפָּחָה в родословном и племенном контексте означает расширенную родовую группу; «роды» здесь уместнее современного слова «семьи».
- source_word: בְּגוֹיֵהֶם
  choice: в своих народах
  rationale: גּוֹי означает народ или этнополитическую общность; перевод сохраняет предлог и итоговую последовательность категорий стиха.
theological_decisions:
- issue: Являются ли субъектом географические области или населяющие их народы
  choice: В основном тексте субъект передан как «народы островов и побережий».
  alternative: 'Буквально: «острова (или побережья) народов отделились».'
  rationale: Еврейская конструкция формально географическая, но последующие характеристики — язык и роды — относятся к человеческим сообществам. Метонимический перевод делает русский текст понятным, а сноска сохраняет буквальную форму и её неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским ритмом. Сохранён параллельный ряд: земли, язык, роды, народы; архаизмы и конфессионально окрашенные толкования исключены.'
