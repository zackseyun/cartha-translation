  yaml_path: translation/ot/genesis/010/028.yaml
  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: ru
  text: и Овала[a], и Авимаила, и Шеву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте перед каждым именем повторяются союз «и» и показатель прямого дополнения: «и [доп.] Овала, и [доп.] Авимаила, и [доп.] Шеву». В русском языке функцию этого показателя передаёт винительный падеж.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: и + винительный падеж
  rationale: Союз וְ передан словом «и». Показатель определённого прямого дополнения אֶת не имеет отдельного русского соответствия; его синтаксическая функция естественно выражается винительным падежом имён.
- source_word: עוֹבָל
  choice: Овала
  rationale: Еврейское личное имя передано транслитерацией «Овал» и поставлено в винительный падеж в соответствии с синтаксисом перечня.
- source_word: אֲבִימָאֵל
  choice: Авимаила
  rationale: Имя транслитерировано как «Авимаил» без перевода составляющих и поставлено в винительный падеж.
- source_word: שְׁבָא
  choice: Шеву
  rationale: Форма שְׁבָא передана как «Шева» и поставлена в винительный падеж. Такое написание отличает это имя от иных близких по звучанию еврейских имён.
