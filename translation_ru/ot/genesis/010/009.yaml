  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: ru
  text: 'Он был могучим охотником перед Яхве; поэтому говорят[a]: «Как Нимрод, могучий охотник перед Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «наперекор Яхве», если в более широком контексте понимать это выражение как враждебное.'
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: могучий охотник
  rationale: Сочетание описывает человека, отличавшегося исключительной силой или искусностью в охоте. «Могучий охотник» кратко, естественно и сохраняет оттенок גִבֹּר.
- source_word: לִפְנֵי
  choice: пред
  rationale: Основное значение — «перед, в присутствии». Краткое «пред Яхве» сохраняет буквальность и возможную смысловую напряжённость, не навязывая отрицательного толкования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: עַל כֵּן יֵאָמַר
  choice: поэтому и говорят
  rationale: Естественная русская формула, вводящая известное изречение; настоящее время уместно передаёт незавершённую форму и характер поговорки.
- source_word: כְּנִמְרֹד
  choice: Как Нимрод
  rationale: Префикс כְּ выражает сравнение; «как Нимрод» естественно вводит поговорку.
theological_decisions:
- issue: Смысл לִפְנֵי יְהוָה применительно к Нимроду
  choice: пред Яхве
  alternative: в противлении Яхве
  rationale: Само выражение обычно означает «перед» или «в присутствии» и прямо не обозначает неповиновение. Основной текст сохраняет нейтральную формулировку, а возможное враждебное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «пред Яхве» выбрана ради краткости, ритма поговорки и сохранения неоднозначности исходного выражения.
