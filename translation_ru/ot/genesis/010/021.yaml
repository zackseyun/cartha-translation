id: GEN.10.21
reference: Genesis 10:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: ru
  text: У Сима также родились дети. Он был отцом всех сыновей Евера и старшим братом Иафета.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братом Иафета, который был старшим». Еврейское слово, означающее «старший» или «великий», может относиться как к Симу, так и к Иафету.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם ... יֻלַּד
  choice: У Сима ... родились дети
  rationale: Дательный оборот и пассивная форма ילד естественно переданы по-русски конструкцией «у Сима родились дети»; явное множественное «дети» выражает подразумеваемое потомство.
- source_word: גַּם הוּא
  choice: также
  rationale: 'Передаёт добавочное и подчёркнутое значение: потомство родилось и у Сима.'
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: отцом всех сыновей Евера
  rationale: Сохраняет прямые соответствия אָב — «отец» и בְּנֵי — «сыновья», не подменяя названную родословную этнонимом.
- source_word: אֲחִי יֶפֶת
  choice: братом Иафета
  rationale: Точно передаёт конструкцию «брат Иафета».
- source_word: הַגָּדוֹל
  choice: старшим
  rationale: В контексте родства прилагательное указывает, вероятнее всего, на старшинство по возрасту; синтаксически оно может относиться либо к Симу, либо к Иафету.
theological_decisions:
- issue: К кому относится הַגָּדוֹל — к Симу или к Иафету
  choice: Сим — «старшим братом Иафета»
  alternative: Иафет — «братом старшего Иафета» / «братом Иафета, который был старшим»
  rationale: Еврейская конструкция допускает оба синтаксических прочтения. Основной текст выбирает естественное по-русски понимание, но примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Длинная еврейская конструкция разделена на два предложения ради естественности; родословные обозначения сохранены без конфессионального истолкования.
