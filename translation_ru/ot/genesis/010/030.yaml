  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: ru
  text: Их поселение простиралось от Меши в сторону Сефара[a] — горы на востоке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Их место обитания было от Меши в направлении Сефара, горы востока».'
    reason: מוֹשָׁבָם может означать «место обитания», וַיְהִי допускает более буквальное «было», а הַר הַקֶּדֶם — «гора востока». Сноска сохраняет единственное число и приложную связь с Сефаром.
lexical_decisions:
- source_word: וַיְהִי
  choice: И ... простиралось
  rationale: Нарративная форма связывает стих с предыдущим изложением; по-русски в описании границ естественно выразить היה глаголом «простиралось».
- source_word: מוֹשָׁבָם
  choice: поселение их
  rationale: Слово обозначает место или область проживания; «поселение» уместно в географическом описании расселения народов.
- source_word: מִמֵּשָׁא
  choice: от Меши
  rationale: Передаёт исходную точку с предлогом מִן; топоним транслитерирован в традиционной русской форме.
- source_word: בֹּאֲכָה
  choice: в сторону
  rationale: Географическая формула от בוא указывает направление движения или протяжённости; «в сторону» звучит естественно и не вводит подразумеваемого путешественника.
- source_word: סְפָרָה
  choice: Сефара
  rationale: Топоним передан транслитерацией; направительное ה выражено оборотом «в сторону».
- source_word: הַר הַקֶּדֶם
  choice: к восточным горам
  rationale: הַר может обозначать гору или горную область, а קֶדֶם — восток; множественное число по-русски естественно передаёт региональный географический смысл, сохраняя возможность буквального понимания в сноске.
