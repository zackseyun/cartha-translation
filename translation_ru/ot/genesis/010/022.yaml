  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: ru
  text: 'Сыновья Сима: Элам, Ашшур, Арпахшад, Луд и Арам.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן; в родословии прямое соответствие «сыновья» сохраняет формулировку и мужскую генеалогическую линию исходного текста.
- source_word: שֵׁם
  choice: Сим
  rationale: Устоявшаяся русская библейская форма имени, соответствующая еврейскому שֵׁם.
- source_word: עֵילָם
  choice: Элам
  rationale: Устоявшаяся русская передача имени עֵילָם; здесь оно дано как имя в родословном перечне.
- source_word: אַשּׁוּר
  choice: Ассур
  rationale: Передаёт еврейское имя, не заменяя его более поздним географическим названием «Ассирия».
- source_word: אַרְפַּכְשַׁד
  choice: Арпахшад
  rationale: Транслитерация, ориентированная на еврейскую форму имени; она точнее отражает согласные исходного текста, чем традиционное «Арфаксад», восходящее к греческой передаче.
- source_word: לוּד
  choice: Луд
  rationale: Прямая передача стоящей здесь формы единственного числа; вариант «лудийцы» был бы истолковывающим этнонимом.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохраняет еврейское имя в родословии, не подменяя его более поздним географическим обозначением «Сирия».
theological_decisions: []
translation_notes:
  register: Краткая родословная формула передана современным литературным русским языком с сохранением двоеточия и последовательности имён. Для Сима употреблена укоренившаяся русская библейская форма; остальные имена переданы в формах, близких к еврейскому тексту. Один и тот же маркер [a] поставлен после обоих имён, к которым относится общая культурная сноска.
