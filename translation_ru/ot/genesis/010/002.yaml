  rationale: Форма сопряжённого множественного числа от בֵּן вводит родословный перечень; «сыновья» прямо передаёт мужскую родословную формулировку еврейского текста.
- source_word: יֶפֶת
  choice: Иафет
  rationale: Личное имя передано в закрепившейся русской библейской форме.
- source_word: גֹּמֶר
