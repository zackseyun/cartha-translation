  rationale: Имя в родословном перечне транслитерировано в традиционной русской форме.
- source_word: מָגוֹג
  choice: Магог
  rationale: В данном стихе слово функционирует как личное имя, поэтому сохранена транслитерация без этногеографического истолкования.
- source_word: מָדַי
  choice: Мадай
  rationale: Сохранена форма родословного имени; возможное отождествление с мидянами вынесено в примечание.
- source_word: יָוָן
  choice: Иаван
  rationale: Сохранена традиционная русская передача родословного имени; возможные значения «Иония» или «греки» отмечены в примечании.
- source_word: תֻבָל
  choice: Фувал
  rationale: Имя передано в устоявшейся русской библейской форме.
- source_word: מֶשֶׁךְ
  choice: Мешех
  rationale: Имя транслитерировано близко к еврейской форме; это современнее и точнее традиционного варианта «Мосох».
- source_word: תִירָס
  choice: Фирас
  rationale: Имя передано в закрепившейся русской библейской форме.
