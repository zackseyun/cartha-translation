lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Сыновья
  rationale: Форма сопряжённого состояния множественного числа от בֵּן обозначает сыновей; начальный союз וּ естественно не передаётся по-русски в этом пункте генеалогического перечня, чтобы избежать тяжеловесности.
- source_word: גֹּמֶר
  choice: Гомера
  rationale: Имя собственное передано в традиционной русской библейской форме и поставлено в родительный падеж по синтаксису конструкции.
- source_word: אַשְׁכֲּנַז
  choice: Ашкеназ
  rationale: Имя собственное передано в традиционной русской библейской форме.
- source_word: וְ/רִיפַת
  choice: Рифат
  rationale: Основной текст следует масоретскому чтению רִיפַת; отличие параллельного места отмечено в сноске.
- source_word: וְ/תֹגַרְמָה
  choice: Фогарма
  rationale: Имя собственное передано в укоренившейся русской библейской форме; еврейское начальное ת традиционно отражено как «Ф».
