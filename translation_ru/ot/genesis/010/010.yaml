  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: ru
  text: Началом его царства были Вавилон[a], Эрех, Аккад и Калне[b] в земле Сеннаар.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское название — Бавел; это Вавилон.
    reason: lexical_alternative
  - marker: b
    text: Эрех обычно отождествляют с древним Уруком, а Аккад — с городом Аккадом.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: были
  rationale: Форма глагола היה вводит описание в прошедшем времени. Множественное число естественно в русском согласуется с последующим перечнем городов.
- source_word: רֵאשִׁית
  choice: началом
  rationale: Слово может означать начало, первую часть или главную часть. «Началом» сохраняет наиболее вероятный смысл первоначального ядра царства, не превращая перечисленные города в столицы.
- source_word: מַמְלַכְתּוֹ
  choice: его царства
  rationale: В контексте перечня городов מַמְלָכָה обозначает царство или владение; «царство» ясно и естественно передаёт этот смысл.
- source_word: בָּבֶל
  choice: Вавилон
  rationale: Это общепринятое русское название города בבל. Сноска указывает еврейскую форму имени и сохраняет связь с последующим повествованием.
- source_word: אֶרֶךְ
  choice: Эрех
  rationale: Передана еврейская форма географического названия; вероятное отождествление с Уруком вынесено в сноску.
- source_word: אַכַּד
  choice: Аккад
  rationale: Современная русская форма исторического названия города и области естественно передаёт еврейское אַכַּד.
- source_word: כַלְנֵה
  choice: Калне
  rationale: Название транслитерировано согласно масоретскому чтению, без отождествления с похожими названиями в других местах.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: в земле Сеннаар
  rationale: «В земле» сохраняет слово אֶרֶץ, а «Сеннаар» — устоявшуюся русскую библейскую форму топонима שִׁנְעָר.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционными формами библейских топонимов. Конструкция «началом… были» передаёт структуру еврейской фразы и при этом звучит естественно; неоднозначность רֵאשִׁית не разрешается как «столица» или «главная часть».
