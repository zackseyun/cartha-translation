  text: and the Hivites[a], the Arkites, and the Sinites.
translation:
  language: ru
  text: и хиввеев[a], аркеев и синеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хиввейский род, аркейский род и синейский род». В еврейском тексте стоят формы этнонимов в единственном числе с артиклем, имеющие собирательное значение и обозначающие народы или роды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: и
  rationale: Союз וְ продолжает перечисление, а показатель прямого дополнения אֶת отдельно по-русски не передаётся.
- source_word: הַחִוִּי
  choice: хиввеев
  rationale: Форма единственного числа с артиклем употреблена собирательно как название народа; традиционный русский этноним во множественном числе естественно передаёт этот смысл.
- source_word: הָעַרְקִי
  choice: аркеев
  rationale: Собирательное обозначение жителей или потомков, связанных с Аркой; форма «аркеев» сохраняет характер этнонима и соответствует структуре перечня.
- source_word: הַסִּינִי
  choice: синеев
  rationale: Собирательное этническое наименование; «синеев» передаёт его как этноним и сохраняет параллелизм перечисления.
