base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: ru
  text: 'Она спросила слугу: «Кто этот человек, идущий по полю нам навстречу?» Слуга ответил: «Это мой господин».[a] Тогда она взяла покрывало и покрылась им.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть хозяин слуги; здесь «господин» не является божественным титулом.
    reason: lexical_clarification
  - marker: b
    text: 'Или: «и покрылась». Еврейская форма имеет возвратное значение: она взяла покрывало и покрыла им себя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: слуга
  rationale: В данном повествовательном контексте עֶבֶד обозначает доверенного слугу Авраама; слово «слуга» естественно передаёт его роль, не устраняя полностью социальную зависимость.
- source_word: הַלָּזֶה
  choice: этот
  rationale: Указательное слово относится к видимому человеку; русское «этот человек» естественно в вопросе об опознании, хотя по ситуации возможно и «тот человек».
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: идущий по полю нам навстречу
  rationale: Причастная конструкция сохранена, а לִקְרָאתֵנוּ естественно передано как движение навстречу говорящей и её спутникам.
- source_word: הוּא אֲדֹנִי
  choice: Это мой господин
  rationale: אֲדֹנִי выражает отношение слуги к его человеческому господину; в русском контексте «господин» сохраняет социальный смысл и не является здесь божественным титулом.
- source_word: הַצָּעִיף
  choice: покрывало
  rationale: צעיף обозначает женское покрывало; этот вариант понятен современному читателю и не уточняет сверх текста его точную форму.
- source_word: וַתִּתְכָּס
  choice: закрылась им
  rationale: Возвратная форма указывает, что Ревекка покрыла себя взятым покрывалом; местоимение «им» естественно выражает подразумеваемое средство.
theological_decisions:
- issue: Значение אֲדֹנִי
  choice: мой господин
  alternative: мой господь
  rationale: Речь идёт об Исааке как человеческом господине слуги, а не о божественном титуле; строчная буква и выбор существительного предотвращают богословское переосмысление.
translation_notes:
  register: Современный литературный русский язык с кратким, ясным повествовательным синтаксисом. Сохранены последовательность действий, причастная характеристика мужчины и социальное значение обращения слуги.
