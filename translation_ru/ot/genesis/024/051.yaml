base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: ru
  text: Вот Ревекка перед тобой. Возьми её и иди; пусть она станет[a] женой сына твоего господина, как сказал Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть она будет женой». Еврейская форма выражает пожелание или разрешение и может передаваться как «будет» либо «станет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица привлекает внимание к непосредственно присутствующей Ревекке; «вот» естественно и точно передаёт это в современном русском языке.
- source_word: רִבְקָה
  choice: Ревекка
  rationale: Традиционная и общепонятная русская форма еврейского личного имени.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Сохраняет пространственный образ оригинала и в контексте выражает присутствие и готовность отдать Ревекку.
- source_word: קַח וָלֵךְ
  choice: Бери её и иди
  rationale: Передаёт два последовательных повеления; местоимение «её» восполняет ясный из контекста объект. Несовершенный вид «бери» естественен как разрешение забрать находящуюся перед слугой Ревекку.
- source_word: וּתְהִי אִשָּׁה
  choice: пусть она станет женой
  rationale: Юссив выражает согласие или пожелание; «пусть» сохраняет эту модальность, а «станет женой» естественно обозначает вступление в брак.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: сына твоего господина
  rationale: Русская конструкция «стать женой кого-либо» естественно передаёт отношение, выраженное לְ; «господин» соответствует отношениям слуги и хозяина.
- source_word: כַאֲשֶׁר דִּבֶּר
  choice: как сказал
  rationale: Передаёт соответствие происходящего ранее произнесённому слову без ненужного уточнения временной соотнесённости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного Божьего имени сохраняет отличие тетраграмматона от титула «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Модальность וּתְהִי в брачной формуле
  choice: пусть она станет женой
  alternative: пусть она будет женой
  rationale: Форма допускает значение «быть» или «стать». В данном контексте речь идёт о предстоящем браке, поэтому «станет» звучит естественно, при этом разрешительно-пожелательная сила юссива сохранена словом «пусть».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис краток и близок к последовательности еврейского оригинала; архаизмы не используются.
