base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: ru
  text: Ревекка подняла глаза и увидела Исаака, а затем сошла с верблюда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «упала с верблюда»; вероятно, это выражение здесь означает, что она спешилась.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת־עֵינֶיהָ
  choice: подняла глаза
  rationale: Сохраняет выразительную и понятную по-русски еврейскую идиому, не сводя её к более общему «посмотрела».
- source_word: וַתֵּרֶא
  choice: увидела
  rationale: Передаёт основное значение глагола ראה и последовательность повествования.
- source_word: אֶת־יִצְחָק
  choice: Исаака
  rationale: Использована традиционная русская форма библейского имени в требуемом падеже.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: сошла с верблюда
  rationale: В контексте глагол «пасть» вероятнее всего идиоматически обозначает быстрое спешивание. «Сошла» естественно передаёт предполагаемый смысл, тогда как буквальное «упала» может ошибочно представить несчастный случай.
