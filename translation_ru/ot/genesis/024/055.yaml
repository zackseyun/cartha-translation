  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: ru
  text: 'Но её брат и мать сказали[a]: «Пусть девушка побудет с нами несколько дней или десять дней; потом пусть отправляется».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дни или десять». Вероятно, имеется в виду: «несколько дней или десять дней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но ... сказали
  rationale: Форма глагола в еврейском стоит в единственном числе, хотя подлежащее составное; по нормам современного русского требуется множественное число. Союз «но» передаёт контраст с настойчивой просьбой слуги в предыдущем стихе.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: её брат и мать
  rationale: Сохранены единственное число слова «брат», порядок участников и притяжательная отсылка к Ревекке; повтор местоимения по-русски не требуется.
- source_word: תֵּשֵׁב
  choice: пусть ... побудет
  rationale: В контексте просьбы отсрочить отъезд глагол ישב означает временно остаться; «побудет» естественно выражает ограниченную продолжительность.
- source_word: הַנַּעֲרָ
  choice: девушка
  rationale: Нейтральное и достойное современное обозначение молодой незамужней женщины без архаического оттенка.
- source_word: אִתָּנוּ
  choice: с нами
  rationale: Прямо передаёт присутствие вместе с говорящими.
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: несколько дней, хотя бы десять
  rationale: Буквально выражение допускает «дни или десять». В контексте просьбы задержать Ревекку оно, вероятно, означает неопределённый краткий срок, уточняемый как десять дней; «хотя бы» передаёт прагматический смысл, а буквальная неоднозначность отмечена в сноске.
- source_word: אַחַר
  choice: потом
  rationale: Естественно обозначает последующее действие после названного срока.
- source_word: תֵּלֵךְ
  choice: она пойдёт
  rationale: Контекст однозначно указывает на девушку как субъект. Простое будущее естественно передаёт согласие отпустить её после отсрочки, не превращая фразу в отдельное повеление.
