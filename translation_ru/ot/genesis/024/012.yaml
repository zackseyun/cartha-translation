  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: ru
  text: 'И он сказал: «О, Яхве, Боже моего господина Авраама! Прошу, даруй мне сегодня успех[a] и яви милость моему господину Аврааму[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устрой, чтобы сегодня это произошло передо мной». Слуга просит Бога устроить желаемую встречу.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское хесед означает также верную доброту, неизменную любовь или преданную милость.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Бог господина моего Авраама
  rationale: Сохраняет отношение слуги к Аврааму; порядок «господина моего» поддерживает достойный молитвенный регистр и не смешивает титул Авраама с обращением к Богу.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: прошу, даруй мне сегодня успех
  rationale: Каузативная форма קרה выражает просьбу к Богу устроить желаемое событие. В русском «даруй мне успех» естественно передаёт смысл контекста, тогда как буквальное «сделай, чтобы случилось передо мной» звучит неясно; частица נָא передана словом «прошу».
- source_word: וַעֲשֵׂה חֶסֶד
  choice: яви милость
  rationale: Устойчивое и понятное русское выражение для оказания благой, верной милости; дополнительный смысл преданности и постоянства раскрыт в сноске.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: господину моему Аврааму
  rationale: Русское управление при «яви милость» требует дательного падежа и естественно передаёт значение еврейского עִם в этом обороте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога. «Яхве» сохраняет это различие и соответствует наиболее принятой научной реконструкции произношения.
- issue: Смысл חֶסֶד в просьбе об отношении Бога к Аврааму
  choice: милость с пояснением о верности и постоянстве
  alternative: неизменная любовь; верная доброта; заветная верность
  rationale: «Милость» естественна в русской молитвенной речи, но сама по себе не полностью выражает оттенок надёжной, преданной доброты; сноска сохраняет широту слова, не сводя его исключительно к формальной категории завета.
- issue: Каузативность הַקְרֵה и Божье действие
  choice: даруй мне сегодня успех
  alternative: сделай так, чтобы сегодня это произошло передо мной
  rationale: Основной текст ясно оставляет успех даром и действием Бога, а сноска сохраняет более буквальный образ события, которое Бог устраивает перед молящимся.
translation_notes:
  register: Современный литературный русский с dignified молитвенным тоном. Междометие «О» сохранено как уместное торжественное обращение, но архаизмы и искусственно буквальные обороты устранены. Неопределённость отсутствующего при הַקְרֵה дополнения отмечена в сноске.
