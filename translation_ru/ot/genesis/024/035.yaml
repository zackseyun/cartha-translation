source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: ru
  text: Яхве щедро благословил моего господина, и тот стал велик. Яхве дал ему мелкий и крупный скот, серебро и золото, слуг и служанок[a], верблюдов и ослов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабов и рабынь». Еврейские слова могут обозначать как домашних слуг, так и людей, находившихся в рабской зависимости.'
    reason: Лексическая неоднозначность терминов עֲבָדִם и שְׁפָחֹת.
lexical_decisions:
- source_word: יהוה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом «Господь».
- source_word: בֵּרַךְ ... מְאֹד
  choice: щедро благословил
  rationale: 'Естественно по-русски выражает усиленное значение: Яхве благословил господина слуги в весьма большой мере.'
- source_word: אֲדֹנִי
  choice: моего господина
  rationale: Здесь слово обозначает Авраама как господина слуги, а не Бога; «господин» уместно передаёт социальное отношение в повествовании.
- source_word: וַיִּגְדָּל
  choice: и тот стал велик
  rationale: Сохраняет широкое значение роста в богатстве, положении и значимости, не сводя его только к материальному достатку; местоимение «тот» ясно указывает на господина.
- source_word: וַיִּתֶּן לוֹ
  choice: Яхве дал ему
  rationale: 'Повтор имени устраняет возможную для русского читателя неясность субъекта: дающий — Яхве, получающий — господин слуги.'
- source_word: צֹאן וּבָקָר
  choice: мелкий и крупный скот
  rationale: 'Точно и естественно передаёт два собирательных обозначения: овец и коз, с одной стороны, и крупный рогатый скот — с другой.'
- source_word: כֶסֶף וְזָהָב
  choice: серебро и золото
  rationale: Сохраняет конкретные названия драгоценных металлов, перечисленных как богатство.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: слуг и служанок
  rationale: Передаёт мужскую и женскую категории домашней прислуги, сохраняя в сноске возможное более жёсткое значение зависимого статуса.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: верблюдов и ослов
  rationale: Прямые современные соответствия названиям животных.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено собственное имя Бога; транслитерация сохраняет различие между именем Яхве и титулом «Господь».
- issue: Социальный статус עֲבָדִם и שְׁפָחֹת
  choice: слуг и служанок
  alternative: рабов и рабынь
  rationale: Еврейские слова допускают оба оттенка. Основной текст использует более широкое обозначение домашних слуг, а сноска сохраняет более сильный вариант, особенно вероятный ввиду включения людей в перечень имущества.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным без устранения смысловой широты выражения «стал велик»; архаизмы и конфессионально окрашенные замены имени Бога избегаются.
