  language: en
  yaml_path: translation/ot/genesis/024/034.yaml
  text: And he said[a], “I am Abraham’s servant.”
translation:
  language: ru
  text: 'Он сказал: «Я слуга Авраама[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я раб Авраама».'
    reason: 'Лексическая альтернатива: עֶבֶד может обозначать как слугу, так и раба.'
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Он сказал
  rationale: Форма с последовательным waw продвигает повествование; в современном русском простое «Он сказал» естественно передаёт ход рассказа без избыточного уточнения связи.
- source_word: עֶבֶד
  choice: слуга
  rationale: Слово может означать как слугу, так и раба. Здесь говорящий почтительно представляет своё положение в доме Авраама, поэтому в основном тексте естественно «слуга», а более жёсткий социальный смысл сохранён в сноске.
- source_word: אַבְרָהָם
  choice: Авраама
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительный падеж для выражения принадлежности.
- source_word: אָנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение выражает явное самоотождествление; русское именное предложение «Я слуга Авраама» естественно передаёт эту функцию без добавления связки в настоящем времени.
