  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: ru
  text: 'Но он сказал им: «Не задерживайте меня: Яхве даровал успех моему пути[a]. Отпустите меня, чтобы я пошёл к моему господину».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал успешным мой путь»; под «путём» здесь подразумеваются путешествие слуги и исполнение поручения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Но он сказал им
  rationale: Последовательная форма продолжает повествование, а «но» естественно передаёт противопоставление просьбе семьи задержаться.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Не задерживайте меня
  rationale: Запрет с אַל и глаголом אחר в каузативной форме означает просьбу не удерживать и не откладывать отправление говорящего.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном יהוה.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: даровал успех моему пути
  rationale: Передаёт каузативное значение глагола צלח и сохраняет образ «пути», который в контексте включает путешествие и поручение слуги.
- source_word: שַׁלְּחוּנִי
  choice: Отпустите меня
  rationale: В данном контексте повелительная форма שלח означает позволить слуге отправиться обратно, а не просто физически «послать» его.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: чтобы я пошёл к моему господину
  rationale: Когортатив выражает намерение, следующее за разрешением уйти; אֲדֹנִי здесь обозначает земного господина слуги, Авраама.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя Бога; транслитерация сохраняет различие между יהוה и титулом אֲדֹנִי, который в конце стиха относится к Аврааму.
- issue: Значение אֲדֹנִי
  choice: мой господин
  alternative: мой владыка
  rationale: Речь идёт об Аврааме как о господине слуги, а не о Боге. Строчная буква и контекст сохраняют это различие.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис сохраняет краткость и настойчивость речи слуги; формулировки избегают как архаизмов, так и разговорности.
