base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: ru
  text: Исаак привёл её в шатёр своей матери Сарры[a], взял Ревекку, и она стала его женой. Он полюбил её, и после смерти матери[b] Исаак утешился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в шатёр Сарры, своей матери». Еврейский порядок слов допускает обе формулировки; основной смысл от этого не меняется.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «после своей матери». По контексту речь идёт о времени после смерти матери, хотя слово «смерть» здесь прямо не употреблено.'
    reason: implicit_context
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: привёл её
  rationale: Порода hифиль глагола בוא с суффиксом 3-го лица женского рода означает «привести/ввести её». «Привёл её в шатёр» естественно передаёт направленное движение внутрь.
- source_word: הָאֹהֱלָה
  choice: в шатёр
  rationale: Направительный ה указывает на движение к шатру и, по контексту, внутрь него; русская конструкция «привёл в шатёр» ясно передаёт этот смысл.
- source_word: שָׂרָה אִמּוֹ
  choice: своей матери Сарры
  rationale: Приложение называет Сарру матерью Исаака. Такой порядок слов естественен в современном русском и сохраняет принадлежность шатра Сарре.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: взял Ревекку
  rationale: Глагол לקח буквально означает «взять». Здесь он употреблён в брачном контексте, но следующая фраза отдельно сообщает, что Ревекка стала женой Исаака, поэтому оба повествовательных шага сохранены.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: она стала его женой
  rationale: Оборот היה + ל + אשה обозначает вступление в положение жены; выбранная формулировка естественна по-русски и сохраняет последовательность событий.
- source_word: וַיֶּאֱהָבֶהָ
  choice: Он полюбил её
  rationale: אהב — обычный глагол со значением «любить». Совершенный вид «полюбил» естественно выражает наступившее в ходе повествования чувство.
- source_word: וַיִּנָּחֵם
  choice: утешился
  rationale: Нифаль от נחם в данном контексте означает получить утешение, а не раскаяться. Возвратное «утешился» кратко и естественно передаёт это значение.
- source_word: אַחֲרֵי אִמּוֹ
  choice: после смерти матери
  rationale: Буквально сказано «после своей матери», однако контекст смерти Сарры в Быт 23 делает смысл утраты ясным. Для понятности по-русски слово «смерти» внесено в основной текст, а буквальность отмечена в сноске.
theological_decisions:
- issue: Подразумеваемая смерть Сарры в выражении אַחֲרֵי אִמּוֹ
  choice: после смерти матери
  alternative: после своей матери; об утрате матери
  rationale: Еврейский текст не называет смерть прямо, но предшествующий рассказ и смысл утешения указывают на переживание после смерти матери. Сноска сохраняет формальную неоднозначность исходного выражения.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-повествовательным библейским регистром. Сохранены отдельные звенья исходного текста («взял Ревекку» и «она стала его женой»), без конфессиональных уточнений.
