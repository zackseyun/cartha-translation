base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: ru
  text: Она поспешно вылила воду из своего кувшина в водопойное корыто[a], снова побежала к колодцу черпать воду и начерпала воды для всех его верблюдов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опорожнила свой кувшин в корыто».'
    reason: 'Лексическая альтернатива: וַתְּעַר כַּדָּהּ может быть передано как «опорожнила свой кувшин»; הַשֹּׁקֶת — как «корыто».'
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Она поспешно
  rationale: Глагол выражает поспешное, быстрое действие; наречие естественно передаёт эту характеристику по-русски.
- source_word: וַתְּעַר כַּדָּהּ
  choice: вылила воду из своего кувшина
  rationale: ערה означает опорожнить сосуд, вылив его содержимое. Добавление «воду» ясно из контекста и позволяет естественно обозначить действие с кувшином.
- source_word: הַשֹּׁקֶת
  choice: поило
  rationale: Существительное обозначает ёмкость, из которой поят животных; «поило» точно и кратко передаёт смысл в контексте верблюдов.
- source_word: וַתָּרָץ עוֹד
  choice: снова побежала
  rationale: עוֹד указывает на повторение действия, а сочетание естественно звучит в современной русской повествовательной речи.
- source_word: הַבְּאֵר
  choice: колодцу
  rationale: בְּאֵר обычно означает колодец и именно так понимается в данном повествовательном контексте.
- source_word: לִשְׁאֹב
  choice: за водой
  rationale: Буквально — «черпать»; русское выражение «побежала к колодцу за водой» естественно передаёт цель движения.
- source_word: וַתִּשְׁאַב
  choice: начерпала
  rationale: Глагол обозначает черпание воды; совершенный вид передаёт результат действия для всех верблюдов, не исключая его многократности.
- source_word: לְכָל גְּמַלָּיו
  choice: для всех его верблюдов
  rationale: Сохраняет значение предназначения воды и полноту, выраженную כָּל.
