  rationale: Правка заменяет редкое «поило» на прозрачное и точное «водопойное корыто» и приводит сноску в соответствие с основной лексической альтернативой еврейского глагола. Смысл, последовательность действий и аспектуальная завершённость исходного текста сохранены.
