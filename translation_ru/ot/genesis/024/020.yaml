    issue: Слово «поило» в основном тексте
    rationale: Хотя оно может обозначать ёмкость для питья животных, в современном литературном русском оно значительно менее обычно и менее прозрачно, чем «водопойное корыто». Кроме того, сноска предлагает «водопойную колоду», создавая ненужное терминологическое расхождение.
  - severity: low
