lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; простое «сказал» естественно для современного русского рассказа.
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог с местоименным суффиксом 3-го лица мужского рода указывает на адресата речи; по-русски естественно «сказал ему».
- source_word: הִשָּׁמֶר לְךָ
  choice: смотри
  rationale: Предупредительная конструкция с императивом от שׁמר и дательным отношения. В данном контексте русское «смотри, не…» ясно и естественно передаёт настойчивое предостережение.
- source_word: פֶּן
  choice: не
  rationale: После «смотри» отрицательная частица естественно вводит действие, которого следует остерегаться, без архаичного оборота.
- source_word: תָּשִׁיב
  choice: возвращай
  rationale: 'Порода hифиль глагола שוב имеет каузативное значение: «заставить вернуться, вернуть». Переходное русское «возвращать кого-либо» сохраняет эту каузативность и необычную формулировку оригинала.'
- source_word: אֶת־בְּנִי
  choice: моего сына
  rationale: Прямое дополнение с существительным и суффиксом 1-го лица единственного числа.
- source_word: שָׁמָּה
  choice: туда
  rationale: Направительное наречие передаёт движение к ранее упомянутому месту; «туда» точнее сохраняет направительное значение, чем «там».
