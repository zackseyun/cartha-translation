  source_fidelity: 'Перевод точно передаёт временную последовательность: после того как верблюды закончили пить, мужчина взял украшения. «Человек» верно сохраняет общее הָאִישׁ, не подменяя его «слугой». Сохранены число браслетов, их предназначение для рук женщины и указанные веса. Подразумеваемое в еврейском выражении название единицы веса («сикли») уместно восполнено.'
