base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: ru
  text: Когда верблюды напились, человек взял золотое кольцо[a] весом в одну беку[b] и два браслета ей на руки, весом в десять сиклей золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «золотое кольцо для носа» или «золотая серьга»: еврейское слово может обозначать кольцо, которое носили в носу или в ухе.'
    reason: lexical_alternative
  - marker: b
    text: Бека — древняя мера веса, равная половине сикля.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: когда верблюды напились
  rationale: Оборот указывает на завершение питья как временную точку последующего действия. «Напились» естественно по-русски передаёт, что верблюды закончили пить, не добавляя идеи поспешности.
- source_word: הָאִישׁ
  choice: человек
  rationale: В еврейском тексте здесь стоит общее обозначение «человек, мужчина», а не слово «слуга»; перевод сохраняет формулировку источника.
- source_word: נֶזֶם זָהָב
  choice: золотое кольцо
  rationale: נֶזֶם может обозначать кольцо, носимое в носу или в ухе. Общее «кольцо» сохраняет лексическую неоднозначность, а варианты поясняются в сноске.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: весом в одну беку
  rationale: Сохранено название древней меры веса; добавление «одну» требуется нормой русского согласования и соответствует единственному числу.
- source_word: וּשְׁנֵי צְמִידִים
  choice: и два браслета
  rationale: Перевод прямо сохраняет указанное в еврейском тексте число предметов.
- source_word: עַל יָדֶיהָ
  choice: ей на руки
  rationale: Формулировка близка буквальному «на её руки» и при этом естественна по-русски; конкретизация «на запястья» не вносится в основной текст.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: весом в десять сиклей золота
  rationale: В исходной идиоме единица веса подразумевается. «Сиклей» делает смысл ясным русскому читателю и передаёт общий вес обоих браслетов.
