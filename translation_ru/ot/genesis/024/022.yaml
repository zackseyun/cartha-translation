  terminology: «Бека» и «сикль» последовательно передают древние меры веса; сноска корректно объясняет соотношение беки и сикля. Общее «золотое кольцо» не снимает лексической неоднозначности נֶזֶם, а сноска надлежащим образом указывает варианты «кольцо для носа» и «серьга».
