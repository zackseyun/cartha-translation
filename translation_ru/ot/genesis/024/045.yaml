  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: ru
  text: 'Я ещё не закончил говорить про себя[a], как вдруг вышла Ревекка с кувшином на плече, спустилась к источнику[b] и набрала воды. Я сказал ей: «Дай мне, пожалуйста, напиться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорить к своему сердцу» — еврейское выражение, обозначающее внутреннюю речь или молитву.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к роднику». Здесь употреблено еврейское слово, означающее природный источник, а не обычное слово «колодец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Я ещё не кончил
  rationale: Конструкция с טֶרֶם обозначает действие, ещё не завершённое к моменту последующего события; по-русски это естественно передаётся словами «ещё не кончил».
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: говорить в своём сердце
  rationale: Сохраняет образность еврейского выражения «говорить к своему сердцу», при этом естественно обозначая внутреннюю речь или молитву.
- source_word: וְהִנֵּה
  choice: как вдруг
  rationale: Передаёт внезапность и живость появления Ревекки без архаичного русского «вот» в данной синтаксической позиции.
- source_word: רִבְקָה
  choice: Ревекка
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: יֹצֵאת
  choice: вышла
  rationale: Причастие после וְהִנֵּה живо представляет наступившее действие; совершенный вид естественен в русском повествовании.
- source_word: כַדָּהּ
  choice: с кувшином
  rationale: כַּד — сосуд для набирания и переноса воды; «кувшин» является ясным и привычным русским соответствием.
- source_word: עַל־שִׁכְמָהּ
  choice: на плече
  rationale: Прямо и естественно передаёт пространственное значение выражения.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: спустилась к источнику
  rationale: עַיִן здесь означает природный источник, а не обычный колодец; направительная форма передана предлогом «к».
- source_word: וַתִּשְׁאָב
  choice: набрала воды
  rationale: Глагол обозначает черпание воды; русское «набрала воды» естественно описывает действие с кувшином.
- source_word: הַשְׁקִינִי נָא
  choice: Дай мне, пожалуйста, напиться
  rationale: Побудительная форма שׁקה означает «дать пить», а נָא выражает вежливую просьбу, переданную словом «пожалуйста».
theological_decisions:
- issue: Характер внутренней речи слуги
  choice: Оставить формулировку «говорить в своём сердце» без прямого обозначения молитвы
  alternative: «молиться про себя»
  rationale: Контекст указывает на молитвенное обращение, однако сам стих употребляет более широкую идиому внутренней речи; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранена еврейская образность внутренней речи; внезапность וְהִנֵּה передана естественным оборотом «как вдруг». Все сноски отмечены в основном тексте.
