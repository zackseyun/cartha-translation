lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: рассказал
  rationale: Пиэль глагола ספר здесь означает последовательное изложение совершившегося; «рассказал» естественно передаёт это в современном русском повествовании.
- source_word: הָעֶבֶד
  choice: слуга
  rationale: עֶבֶד может означать как слугу, так и раба. В данном контексте на первом плане его служебная роль и поручение Авраама, поэтому в основном тексте выбрано «слуга», а лексическая альтернатива отмечена в сноске.
- source_word: לְיִצְחָק
  choice: Исааку
  rationale: Имя יִצְחָק передано в принятой русской библейской форме «Исаак» и поставлено в дательном падеже согласно предлогу לְ.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: обо всём
  rationale: דְּבָרִים может обозначать слова, дела, обстоятельства или события. В контексте речь обо всём содержании исполненного поручения; «обо всём» звучит естественно и не сужает значение только до слов.
- source_word: אֲשֶׁר עָשָׂה
  choice: что он сделал
  rationale: Форма עָשָׂה указывает на уже завершённые действия слуги. Русское прошедшее время естественно выражает их предшествование рассказу без искусственного усложнения глагольной формы.
