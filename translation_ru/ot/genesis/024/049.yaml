lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет связующий союз и вводит непосредственный практический вывод из речи слуги.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: если вы намерены оказать
  rationale: Естественно передаёт еврейскую конструкцию с יֵשׁ и причастием, которая в данном контексте обозначает готовность и предполагаемое действие семьи.
- source_word: חֶסֶד וֶאֱמֶת
  choice: милость и верность
  rationale: 'Передаёт два взаимосвязанных понятия: благожелательное, преданное отношение и надёжность в поступках, не сводя אֱמֶת только к отвлечённой «истине».'
- source_word: אֶת אֲדֹנִי
  choice: моему господину
  rationale: Дательный падеж естественно выражает направленность милости и верности по отношению к господину слуги.
- source_word: הַגִּידוּ לִי
  choice: скажите мне
  rationale: Прямой и естественный русский императив, соответствующий просьбе дать определённый ответ.
- source_word: וְאִם לֹא
  choice: а если нет
  rationale: Союз «а» ясно передаёт противопоставление двух возможных ответов.
- source_word: וְאֶפְנֶה
  choice: и я обращусь
  rationale: Передаёт когортатив как намеренное последующее действие; русское будущее время здесь естественнее целевой конструкции и не устраняет решимости говорящего.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: направо или налево
  rationale: Сохраняет понятный образ выбора иного пути, выраженный буквальными направлениями.
