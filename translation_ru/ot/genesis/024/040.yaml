  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: ru
  text: 'Он сказал мне: «Яхве, перед Которым я ходил, пошлёт с тобой Своего ангела и сделает твой путь успешным[a]. Ты возьмёшь жену моему сыну из моего рода[b] и из дома моего отца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дарует успех твоему пути»; речь идёт об успешном исполнении поручения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из моей семьи»; еврейское слово может обозначать более широкую родственную группу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: перед Которым я ходил
  rationale: Сохраняет библейский образ жизни и поведения человека перед Богом, не сводя его к пояснительной парафразе.
- source_word: מַלְאָכוֹ
  choice: Своего ангела
  rationale: В контексте речь идёт о посланном Богом небесном существе; «ангел» точнее контекстуального «вестник».
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: и сделает твой путь успешным
  rationale: Передаёт каузативное значение глагола צלח и сохраняет метафору пути, относящуюся ко всему поручению.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: Ты возьмёшь жену моему сыну
  rationale: 'Естественно передаёт брачную формулу и цель поручения: найти и взять жену для сына Авраама.'
- source_word: מִמִּשְׁפַּחְתִּי
  choice: из моего рода
  rationale: «Род» обозначает более широкую родственную группу, чем ближайшая семья, и уместен в данном патриархальном контексте.
- source_word: וּמִבֵּית אָבִי
  choice: и из дома моего отца
  rationale: Сохраняет устойчивое библейское обозначение отцовского дома, то есть родового домохозяйства и линии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Смысл выражения «ходил перед Ним»
  choice: сохранить образ «перед Которым я ходил»
  alternative: Которому я верно служил; в присутствии Которого я жил
  rationale: Исходная формулировка может включать жизнь в Божьем присутствии, верность и ответственное поведение; буквальный образ сохраняет эту смысловую ёмкость без догматического уточнения.
- issue: Кем является מַלְאָכוֹ
  choice: ангел
  alternative: вестник
  rationale: Контекст допускает основное значение «посланник», но принадлежность Яхве и сверхъестественное водительство делают «ангел» наиболее естественным переводом, не уточняя природу этого ангела сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены образы «ходить перед Богом», «путь» и «дом отца», но синтаксис сделан понятным современному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской религиозной издательской нормой.
