base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: ru
  text: Ревекка и её девушки[a] поднялись, сели на верблюдов и последовали за тем человеком. А слуга взял Ревекку с собой и отправился в путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её служанки», «её молодые женщины, сопровождавшие её». Еврейское слово обозначает девушек или молодых женщин; в данном контексте речь, вероятно, идёт о женщинах, сопровождавших Ревекку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: поднялись
  rationale: Глагол קום буквально означает «встать, подняться». В русском множественное число естественно согласуется с составным подлежащим «Ревекка и… девушки» и сохраняет последовательность повествования, не подменяя действие более широким «отправились».
- source_word: נַעֲרֹתֶיהָ
  choice: бывшие с ней девушки
  rationale: נַעֲרָה обозначает молодую женщину или девушку; по контексту это сопровождающие Ревекку женщины, однако само слово не обязательно указывает на служебное положение. Формулировка сохраняет возрастно-половой смысл и естественно звучит по-русски.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: сели на верблюдов
  rationale: רכב с עַל здесь обозначает посадку верхом и последующее передвижение. «Сели на верблюдов» естественно передаёт начальное действие перед дорогой.
- source_word: אַחֲרֵי הָאִישׁ
  choice: последовали за тем человеком
  rationale: אַחֲרֵי означает «за, вслед за». Глагол «последовали» ясно передаёт движение вслед за ведущим, а «тем человеком» сохраняет существительное הָאִישׁ, не заменяя его истолкованием «слуга».
- source_word: הָעֶבֶד
  choice: слуга
  rationale: עֶבֶד может означать раба или слугу. В данном контексте речь идёт о доверенном домашнем слуге Авраама, поэтому нейтральное «слуга» соответствует роли персонажа без излишнего уточнения его правового статуса.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: слуга взял Ревекку с собой
  rationale: לקח буквально значит «взял»; в дорожном контексте русское «взял с собой» естественно выражает сопровождение Ревекки, не предполагая насилия или владения.
- source_word: וַיֵּלַךְ
  choice: отправился в путь
  rationale: הלך означает «идти, отправляться». Здесь идиоматическое «отправился в путь» передаёт продолжение путешествия и избегает неестественного обрыва «и пошёл».
