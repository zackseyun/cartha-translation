base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: ru
  text: 'Сегодня я пришёл к источнику[a] и сказал: «Яхве, Бог моего господина Авраама, если Ты, прошу, даруешь успех моему пути, которым я иду…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к роднику». Еврейское слово обозначает источник, место выхода воды; в традиционных переводах здесь встречается «колодец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Сегодня я пришёл
  rationale: Передаёт повествовательную прошедшую форму и сохраняет смысловое выделение слова «сегодня».
- source_word: הָעָיִן
  choice: к источнику
  rationale: עַיִן здесь обозначает природный источник воды; это точнее, чем традиционное «колодец».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Бог моего господина Авраама
  rationale: אֲדֹנִי обозначает хозяина слуги; «господин» естественно выражает эти отношения и не воспринимается здесь как божественный титул.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: если Ты и вправду даруешь успех
  rationale: Сохраняет условно-молитвенную, несколько эллиптическую конструкцию; נָא передано усилительным «и вправду», а каузативное значение מַצְלִיחַ — выражением «даруешь успех».
- source_word: דַּרְכִּי
  choice: моему пути
  rationale: Буквально сохраняет образ «моего пути» и притяжательное значение, не сводя его однозначно только к поездке или поручению.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: которым я иду
  rationale: Естественно по-русски передаёт еврейскую конструкцию «по которому я иду», относящуюся к пути.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте непосредственно употреблено личное имя Бога; транслитерация «Яхве» сохраняет это имя, не подменяя его титулом.
- issue: Неоконченная условная молитва
  choice: Сохранить обрыв фразы многоточием
  alternative: Дополнить подразумеваемое следствие условия
  rationale: Еврейская фраза продолжается в следующем стихе и здесь синтаксически остаётся незавершённой; дополнение устранило бы подлинную напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимение «Ты» написано с прописной буквы как уважительное обращение к Богу. Синтаксическая незавершённость стиха сохранена многоточием.
