base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: ru
  text: Тогда слуга вынес предметы из серебра и золота и одежду и дал их Ревекке, а её брату и матери дал ценные подарки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отборные дары». Еврейское слово может обозначать особо ценные или изысканные подарки, а в некоторых контекстах — лакомства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: достал
  rationale: Хифиль глагола יצא означает «вынести, достать». В данном контексте «достал» естественно передаёт конкретное действие слуги.
- source_word: הָעֶבֶד
  choice: слуга
  rationale: עֶבֶד может обозначать как раба, так и слугу. В этом повествовательном контексте «слуга» звучит естественно и не утверждает точнее не обозначенный здесь правовой статус.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: серебряные и золотые изделия
  rationale: כְּלִי — широкое обозначение предмета, вещи, сосуда или принадлежности. «Изделия» сохраняет широту значения и не сводит подарки именно к сосудам.
- source_word: וּבְגָדִים
  choice: и одежды
  rationale: בְּגָדִים обозначает предметы одежды; форма множественного числа и достойный повествовательный регистр сохранены.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: и отдал их Ревекке
  rationale: Местоимение «их» естественно отсылает к перечисленным изделиям и одеждам; «отдал» ясно передаёт вручение даров.
- source_word: וּמִגְדָּנֹת
  choice: ценные подарки
  rationale: מִגְדָּנוֹת обозначает отборные или драгоценные дары, а иногда лакомства. «Ценные подарки» естественно соответствует брачному контексту, не ограничивая смысл пищей.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: её брату и матери
  rationale: Принадлежность обоих родственников к Ревекке ясна из русского оборота; повтор местоимения не требуется.
theological_decisions: []
