  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: ru
  text: Но если женщина не захочет пойти с тобой[a], ты будешь свободен от этой моей клятвы[b]. Только сына моего не возвращай туда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойти за тобой», «последовать за тобой»; буквально: «идти за тобой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты будешь освобождён от этой моей клятвы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Передаёт условие, противопоставленное предшествующему поручению, и естественно звучит по-русски.
- source_word: לֹא תֹאבֶה
  choice: не захочет
  rationale: Сохраняет значение отсутствия желания или согласия, не усиливая его до открытого отказа.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Речь пока идёт о ещё не названной будущей невесте; слово «жена» было бы преждевременным.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: пойти с тобой
  rationale: В контексте путешествия естественно передаёт смысл следования за слугой; буквальный образ отмечен в сноске.
- source_word: וְנִקִּיתָ
  choice: ты будешь свободен
  rationale: Нифаль глагола נקה здесь означает освобождение от связывающего обязательства.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: от этой моей клятвы
  rationale: Сохраняет и указательное местоимение «этой», и суффикс первого лица «моей».
- source_word: רַק
  choice: Только
  rationale: Выражает строгое ограничение освобождения от клятвы.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: сына моего не возвращай туда
  rationale: Передаёт каузативное значение Hiphil שוב и категорический запрет; порядок слов придаёт естественное для русского текста смысловое выделение объекта.
