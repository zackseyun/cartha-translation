base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: ru
  text: А человек вошёл в дом. Верблюдов развьючили[a], дали им соломы и корма, а для омовения его ног и ног людей, которые были с ним, дали воды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыли верблюдов»; вероятно, с них сняли поклажу или другое снаряжение. Возможные переводы: «расседлали» или «освободили».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте глаголы «развьючил» и «дал» стоят в единственном числе, но подлежащее повторно не названо. Им мог быть вошедший человек или, по контексту, хозяин дома Лаван.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: А человек вошёл в дом
  rationale: 'Сохраняется прямое обозначение «человек», а направительный суффикс при «дом» естественно передаётся движением внутрь: «вошёл в дом».'
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: верблюдов развьючили
  rationale: Буквально глагол означает «открыл», но применительно к верблюдам здесь речь идёт о снятии поклажи или снаряжения после прибытия. «Развьючили» кратко и естественно передаёт наиболее вероятный смысл.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: соломы и корма
  rationale: תֶּבֶן — солома, используемая в том числе как корм; מִסְפּוֹא — корм для животных. Такое сочетание точно и понятно современному читателю.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: а ему и людям, которые были с ним, дали воды, чтобы вымыть ноги
  rationale: Передаётся цель предоставления воды и сохраняется упоминание как самого человека, так и сопровождавших его людей; русская конструкция избегает тяжеловесного повторения слова «ноги».
theological_decisions:
- issue: Кто развьючил верблюдов и дал корм и воду
  choice: Не называть действующее лицо в основном тексте; использовать неопределённо-личную конструкцию
  alternative: Продолжить действия за «человеком» либо прямо назвать Лавана
  rationale: Еврейские глаголы стоят в 3-м лице единственного числа без нового явно названного подлежащего. Грамматически действия можно отнести к вошедшему человеку, тогда как повествовательный контекст допускает Лавана как хозяина дома. Русская неопределённо-личная конструкция не вносит отсутствующего в стихе имени и не снимает подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Неопределённо-личные формы намеренно сохраняют неуточнённость действующего лица, а не превращают контекстуальный вывод в явное содержание стиха.
