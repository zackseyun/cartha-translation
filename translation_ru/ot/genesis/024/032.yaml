  rationale: 'Исправлена лишь синтаксическая неясность русского целевого оборота: сохранены вода, предназначенная для омовения ног самого человека и его спутников, а также намеренная неопределённость действующего лица в последующих действиях. Примечание уточнено, чтобы не ограничивать значение еврейского идиоматического выражения именно упряжью.'
