    issue: Неоднозначная цель в обороте «чтобы вымыть ноги»
    rationale: Русский инфинитив после «дали воды» неясно соотносится с упомянутыми лицами и способен обозначать омовение ног одного человека другому. В מקורном тексте сказано, что вода дана для омовения его ног и ног людей с ним.
  - severity: low
    issue: В примечании a чрезмерно конкретизирован вариант «освободили от упряжи»
    rationale: Еврейское выражение в данном контексте обозначает развязывание/освобождение верблюдов после пути; снятие поклажи или снаряжения вероятно, но «упряжь» может сузить смысл.
