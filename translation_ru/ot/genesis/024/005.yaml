base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: ru
  text: 'И слуга сказал ему: «Может быть, женщина не захочет пойти за мной[b] в эту землю. Неужели мне возвращать[a] твоего сына в землю, из которой ты вышел?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также перевести: «неужели мне вернуть твоего сына…?» В еврейском тексте инфинитив абсолютный употреблён вместе с личной формой того же глагола, что придаёт вопросу усиление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «идти за мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: слуга
  rationale: Слово עֶבֶד может обозначать слугу или раба. В этом повествовательном контексте «слуга» естественно передаёт положение доверенного домашнего подчинённого Авраама, не устраняя иерархических отношений.
- source_word: אוּלַי לֹא תֹאבֶה
  choice: а если … не захочет
  rationale: אוּלַי вводит предполагаемую возможность, а אָבָה выражает желание или согласие. Русская условная формулировка естественно передаёт обеспокоенный вопрос слуги.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: В еврейском тексте употреблено общее слово «женщина»; называть её заранее невестой или будущей женой было бы контекстуальным уточнением сверх текста.
- source_word: לָלֶכֶת אַחֲרַי
  choice: пойти за мной
  rationale: Передаёт буквальный образ движения «за» говорящим и при этом звучит естественно по-русски.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: в эту землю
  rationale: «Земля» сохраняет обычное для патриархального повествования значение אֶרֶץ и направление движения.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: следует ли мне тогда отвести … обратно
  rationale: Вопросительная конструкция передаёт размышление слуги, «обратно» — значение корня שׁוב, а усиление сочетания инфинитива абсолютного с личной формой отмечено в сноске.
- source_word: אֶת בִּנְךָ
  choice: твоего сына
  rationale: Прямое и недвусмысленное соответствие исходному тексту.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: в землю, из которой ты вышел
  rationale: Сохраняет явное упоминание земли и основное значение יָצָא «выйти», оставаясь понятным в современном русском повествовании.
