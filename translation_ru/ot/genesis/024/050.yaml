base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: ru
  text: 'Тогда Лаван и Вафуил ответили и сказали: «Это дело исходит от Яхве; мы не можем сказать тебе ни плохого, ни хорошего».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, выражение «сказать ни плохого, ни хорошего» означает, что они не могут возразить против решения Яхве или изменить его.
    reason: Пояснение древнееврейской идиомы с сохранением её возможной неоднозначности.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: ответили и сказали
  rationale: Сохранена парная древнееврейская формула введения прямой речи; в русском она слегка избыточна, но понятна и передаёт фактуру повествования.
- source_word: מֵיְהוָה
  choice: от Яхве
  rationale: Предлог מִן обозначает источник, а личное имя יְהוָה передано как «Яхве».
- source_word: יָצָא הַדָּבָר
  choice: это дело исходит
  rationale: דָּבָר в контексте означает обсуждаемое дело, а יָצָא с указанием источника — его происхождение. Настоящее время по-русски естественно выражает признание того, от кого исходит происходящее.
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: мы не можем сказать тебе
  rationale: יכל выражает возможность, а דבר с направлением речи к адресату естественно передаётся здесь глаголом «сказать».
- source_word: רַע אוֹ טוֹב
  choice: ни плохого, ни хорошего
  rationale: Сохранены порядок и полярная пара исходного текста; отрицательная конструкция с «ни… ни…» естественна для современного русского языка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Смысл выражения רַע אוֹ טוֹב
  choice: Сохранить буквальную полярную пару в основном тексте и пояснить идиому в сноске
  alternative: 'Передать толкованием: «мы не вправе ни возражать, ни что-либо менять»'
  rationale: Буквальная формулировка сохраняет образ и некоторую смысловую напряжённость оригинала, а сноска сообщает вероятную идиоматическую силу без её навязывания основному тексту.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Формула «ответили и сказали» намеренно сохраняет древнееврейскую повествовательную структуру; остальная фраза изложена естественно и понятно.
