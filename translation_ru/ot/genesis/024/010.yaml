  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: ru
  text: И слуга взял десять из верблюдов своего господина и отправился в путь, взяв с собой всякие ценные вещи своего господина.[a] И он встал и пошёл в Арам-Нахараим,[b] в город Нахора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё добро его господина было у него в руках». Еврейское выражение может указывать на владение или распоряжение; вероятно, речь идёт о ценностях и дарах, которые он вёз с собой.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское название Арам-Нахараим традиционно передают как «Месопотамия» или переводят «Арам двух рек».
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: слуга
  rationale: В контексте доверенного домочадца «слуга» естественно передаёт עֶבֶד, не утверждая сверх текста конкретный юридический статус.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: десять верблюдов из числа верблюдов своего господина
  rationale: 'Сохраняет партитивное значение предлога מִן: верблюды были выбраны из принадлежавших господину.'
- source_word: וַיֵּלֶךְ
  choice: отправился в путь
  rationale: В данном месте глагол обозначает начало поездки; эта передача естественна по-русски и отличает его от следующего וַיֵּלֶךְ после וַיָּקָם.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: В его распоряжении было всякое добро его господина
  rationale: טוּב здесь обозначает ценное имущество или дары, а בְּיָדוֹ — нахождение во власти и распоряжении. Формулировка сохраняет широкий смысл, не сводя его только к грузу или подаркам.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Он встал и пошёл
  rationale: Сохраняет два последовательных еврейских глагола и характерный повествовательный ритм, не объединяя их в одно «отправился».
- source_word: אֲרַם נַהֲרַיִם
  choice: Арам-Нахараим
  rationale: Передаёт еврейское географическое название транслитерацией, не подменяя его традиционным, но менее точным названием «Месопотамия».
- source_word: עִיר נָחוֹר
  choice: город Нахора
  rationale: Естественно передаёт сопряжённую конструкцию и оставляет открытым, означает ли она город, принадлежавший Нахору, либо связанный с ним.
