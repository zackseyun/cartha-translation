base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: ru
  text: Я склонился и поклонился Яхве, и благословил Яхве, Бога моего господина Авраама, который повёл меня верным путём[a], чтобы взять дочь брата моего господина для его сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «путём истины». Выражение может также означать «надёжным, верным путём» и подчёркивать верность Божьего водительства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: Я склонился
  rationale: Передаёт телесный жест глубокого поклона, не уточняя без основания, что слуга встал на колени.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: и поклонился Яхве
  rationale: Глагол обозначает почтительное поклонение, часто с простиранием; в сочетании со стоящим рядом וָאֶקֹּד формулировка сохраняет как телесный жест, так и религиозную направленность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: и благословил Яхве
  rationale: Сохраняет прямое значение корня ברך и традиционный библейский оборот; применительно к Богу означает воздать Ему хвалу.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Бога моего господина Авраама
  rationale: אֲדֹנִי обозначает здесь человеческого господина слуги, Авраама, а не божественный титул.
- source_word: הִנְחַנִי
  choice: который повёл меня
  rationale: Каузативная форма от נחה выражает ведение или направление; простое прошедшее естественно в последовательном рассказе слуги.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: верным путём
  rationale: 'Формулировка естественна по-русски и сохраняет многозначность אֱמֶת: путь оказался истинным, надёжным и соответствующим верному водительству Бога.'
- source_word: לָקַחַת
  choice: чтобы взять
  rationale: Инфинитив выражает цель. Буквальное «взять» сохраняет связь с контекстом заключения брака, не добавляя отсутствующего здесь глагола «женить».
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: дочь брата моего господина
  rationale: Точно воспроизводит конструктивную цепочку и прямо указывает родство Ревекки с Авраамом.
- source_word: לִבְנוֹ
  choice: для его сына
  rationale: Местоименный суффикс относится к господину слуги, Аврааму; выражение сохраняет краткость оригинала.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; «Яхве» передаёт его непосредственно, не подменяя титулом.
- issue: Смысл בְּדֶרֶךְ אֱמֶת
  choice: верным путём
  alternative: истинным путём; правильным путём; путём верности
  rationale: Выбор не сводит אֱמֶת лишь к географически правильному направлению и сохраняет оттенки истинности, надёжности и верности Божьего водительства.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор имени «Яхве» и родственных обозначений сохранён вслед за еврейским текстом; синтаксис сделан ясным без устранения смысловой многозначности.
