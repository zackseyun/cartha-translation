base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: ru
  text: 'Исаак вышел в поле, чтобы поразмышлять[a], под вечер. Он поднял взгляд и увидел: вот, приближались верблюды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прогуляться», «поразмышлять», «беседовать»; возможно также: «помолиться». Древнееврейский глагол встречается редко, и его точное значение здесь неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Форма глагола יצא обозначает движение наружу; «вышел» естественно передаёт последовательность повествования.
- source_word: יִצְחָק
  choice: Исаак
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: לָשׂוּחַ
  choice: поразмышлять
  rationale: Редкий глагол שׂוח имеет спорное значение. В данном контексте «поразмышлять» естественно передаёт уединённое созерцательное занятие, не уточняя без достаточных оснований, что это была молитва; неопределённость отражена в сноске.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямой и естественный русский эквивалент, обозначающий поле или открытую местность.
- source_word: לִפְנוֹת עָרֶב
  choice: под вечер
  rationale: Русское идиоматическое выражение, точно указывающее на приближение вечера.
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Он поднял глаза
  rationale: Сохраняет образ распространённого древнееврейского оборота и не сливает его со следующим глаголом зрения.
- source_word: וַיַּרְא
  choice: посмотрел
  rationale: После «поднял глаза» передаёт направленное зрительное восприятие и сохраняет последовательность двух глаголов.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Естественный современный русский способ сохранить указательную и оживляющую повествование функцию частицы הִנֵּה.
- source_word: גְמַלִּים בָּאִים
  choice: приближались верблюды
  rationale: Причастие передаёт продолжающееся движение; «приближались» ясно выражает движение каравана к месту наблюдения.
theological_decisions:
- issue: Характер занятия Исаака в поле
  choice: поразмышлять
  alternative: погулять; побродить; предаться раздумьям; беседовать; молиться
  rationale: Значение редкого לָשׂוּחַ точно не установлено. Основной текст выбирает вероятный смысл, но не отождествляет действие с молитвой как с несомненным фактом; иные толкования сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским повествовательным тоном. Синтаксис разделён на два предложения ради естественности; «и вот» сохраняет живость древнееврейского рассказа. Подлинная лексическая неопределённость отмечена сноской.
