revisions:
- from: 'Вот, я стою у источника воды. Пусть же девушка[a], которая выйдет черпать воду и которой я скажу: «Пожалуйста, дай мне отпить немного воды из твоего кувшина»[b],'
  to: 'Вот, я стою у источника воды; и когда девушка[a] выйдет черпать воду и я скажу ей: «Пожалуйста, дай мне немного воды из твоего кувшина»,[b]'
  rationale: Исправлена синтаксически ненормативная конструкция с «пусть же» на естественную для русского условно-временную связь «и когда ...». Она передаёт роль וְהָיָה как введения предполагаемого знака в пересказе молитвы. Просьба упрощена до плавной русской формы, а сноска b сохраняет более близкий к исходной формулировке вариант. Незавершённость в конце намеренно сохранена, поскольку предложение продолжается в следующем стихе.
