base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: ru
  text: 'Вот, я стою у источника воды; и когда девушка[a] выйдет черпать воду и я скажу ей: «Пожалуйста, дай мне немного воды из твоего кувшина»,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодая женщина»; еврейское עַלְמָה обозначает молодую женщину брачного возраста и само по себе прямо не означает «девственница».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Пожалуйста, дай мне отпить немного воды из твоего кувшина».'
    reason: alternative_rendering
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица живо вводит описываемую сцену; «вот» естественно и достойно передаёт её в современном русском языке.
- source_word: אָנֹכִי נִצָּב
  choice: я стою
  rationale: Самостоятельное местоимение и причастная форма обозначают текущее положение говорящего; дополнительное усиление «сам» контекстом не требуется.
- source_word: עַל עֵין הַמָּיִם
  choice: у источника воды
  rationale: עֵין обозначает природный источник, а не колодец; предлог «у» естественно передаёт пространственное значение עַל в данном контексте.
- source_word: וְהָיָה
  choice: Пусть же
  rationale: В молитвенно-условном контексте форма вводит желаемый знак; «пусть же» сохраняет волитивный оттенок и связь с дальнейшей незавершённой конструкцией.
- source_word: הָעַלְמָה
  choice: девушка
  rationale: Слово обозначает молодую женщину брачного возраста, само по себе не утверждая девственность; «девушка» наиболее естественно и точно в данном повествовании.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: которая выйдет черпать воду
  rationale: Причастие описывает предполагаемое будущее действие в условном сценарии; объект «воду» восполнен по ясному контексту для естественности русского выражения.
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: и которой я скажу
  rationale: Относительная конструкция по-русски плавно сохраняет последовательность и связь действий исходного текста.
- source_word: הַשְׁקִינִי נָא
  choice: Пожалуйста, дай мне отпить
  rationale: Каузатив שקה означает дать или позволить пить, а נָא смягчает просьбу; выбранная формулировка естественна и сохраняет значение единого глагольного действия.
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: немного воды из твоего кувшина
  rationale: Прямо передаёт количество, вещество, исходную точку и обращение к женщине.
theological_decisions:
- issue: Значение עַלְמָה
  choice: девушка
  alternative: молодая женщина; дева
  rationale: Еврейское слово указывает на молодую женщину брачного возраста, но само по себе не требует значения «девственница». Основной текст не должен привносить в этот рассказ более узкое богословски нагруженное толкование.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Синтаксис намеренно остаётся незавершённым в конце, поскольку стих продолжается в следующем предложении; «пусть же» передаёт характер молитвенной просьбы о знаке.
