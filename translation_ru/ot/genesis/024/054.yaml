  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: ru
  text: 'Затем он и люди, бывшие с ним, ели и пили и остались там на ночь. Утром они встали, и он сказал: «Отпустите меня к моему господину[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к моему хозяину». Еврейское אֲדֹנִי может означать «мой господин» или «мой хозяин»; здесь речь идёт об Аврааме, которому служил говорящий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ели и пили
  rationale: Два простых повествовательных глагола переданы кратко и последовательно, без добавления значения торжественной трапезы.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: он и люди, бывшие с ним
  rationale: Сохранены явное местоимение и относительная конструкция; речь идёт о слуге Авраама и сопровождавших его людях.
- source_word: וַיָּלִינוּ
  choice: остались там на ночь
  rationale: Глагол לון/לין обозначает пребывание на ночлег; такой перевод естественен по-русски и ясно выражает ночёвку в данном месте.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: Утром они встали
  rationale: Сохранены множественное число и утренняя временная привязка, а порядок слов сделан естественным для современного русского повествования.
- source_word: שַׁלְּחֻנִי
  choice: Отпустите меня
  rationale: Форма представляет собой повеление во множественном числе с местоименным суффиксом первого лица; в контексте слуга просит позволить ему отправиться обратно.
- source_word: לַאדֹנִי
  choice: к моему господину
  rationale: אָדוֹן с суффиксом означает «мой господин/хозяин» и здесь относится к Аврааму. «Господин» сохраняет обычное уважительное обозначение человеческого начальника; строчная буква исключает отождествление с божественным титулом.
theological_decisions:
- issue: Передача אָדוֹן применительно к Аврааму
  choice: моему господину
  alternative: моему хозяину
  rationale: Референтом является человек — Авраам, которому служит говорящий. Вариант «господин» ближе к форме обращения и сохраняет широту еврейского слова, тогда как строчная буква и контекст не допускают богословского прочтения титула.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис слегка сглажен без утраты последовательности еврейских действий; обращение передано во множественном числе согласно форме повелительного глагола.
