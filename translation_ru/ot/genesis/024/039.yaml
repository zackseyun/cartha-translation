  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: ru
  text: 'И я сказал своему господину: «Может быть, женщина не пойдёт за мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: И я сказал
  rationale: Форма wayyiqtol продолжает последовательное повествование; прошедшее время естественно передаёт её функцию в русском языке.
- source_word: אֶל־אֲדֹנִי
  choice: своему господину
  rationale: Здесь אָדוֹן обозначает Авраама как господина слуги, а не Бога. Возвратное «своему» естественно соотносит господина с говорящим.
- source_word: אֻלַי
  choice: Может быть
  rationale: Частица выражает возможность и неуверенность; это нейтральное и современное соответствие.
- source_word: לֹא תֵלֵךְ הָאִשָּׁה אַחֲרָי
  choice: женщина не пойдёт за мной
  rationale: Сочетание הלך с אַחֲרֵי буквально означает движение «за» кем-либо и в контексте также подразумевает согласие последовать. Русское «пойдёт за мной» сохраняет обе стороны выражения без лишнего истолкования.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Еврейское существительное означает «женщина»; хотя речь идёт о предполагаемой невесте Исаака, называть её здесь «женой» или «невестой» значило бы уточнить текст сверх оригинала.
