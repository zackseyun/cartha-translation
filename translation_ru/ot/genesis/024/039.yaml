  source_fidelity: 'Текст точно передаёт все элементы еврейского оригинала: последовательное «И я сказал», обращение к человеческому господину, оттенок возможности в אֻלַי и конструкцию «идти за мной» (הלך + אַחֲרַי). Будущее «не пойдёт» уместно передаёт imperfect в прямой речи. «Женщина» не вносит преждевременного уточнения вроде «невеста» или «жена».'
