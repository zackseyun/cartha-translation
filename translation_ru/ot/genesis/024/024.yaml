lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Она ответила ему
  rationale: В данном диалоге форма אמר продолжает повествовательную последовательность и естественно передаётся по-русски глаголом «ответила»; адресат выражен местоимением «ему».
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Я дочь Вафуила
  rationale: Именное предложение с подчёркнутым אָנֹכִי естественно и точно передаётся краткой русской формой самоидентификации.
- source_word: בְּתוּאֵל
  choice: Вафуил
  rationale: Употреблена укоренившаяся в русской библейской традиции форма имени.
- source_word: בֶּן מִלְכָּה
  choice: сына Милки
  rationale: Сопряжённая конструкция указывает, что Вафуил — сын Милки; родительный падеж естественно передаёт эту связь.
- source_word: אֲשֶׁר יָלְדָה
  choice: которого она родила
  rationale: Относительное местоимение относится к Вафуилу, а форма женского рода глагола указывает на Милку как на мать.
- source_word: לְנָחוֹר
  choice: Нахору
  rationale: Дательный падеж сохраняет обычную древнееврейскую формулу рождения, в которой לְ обозначает отца, не сводя её однозначно к значению «для».
