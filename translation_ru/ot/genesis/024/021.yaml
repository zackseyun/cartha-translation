  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: ru
  text: А человек молча наблюдал за ней[a], чтобы узнать, увенчал ли Яхве его путь успехом или нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с изумлением смотрел на неё, храня молчание».'
    reason: Еврейская форма מִשְׁתָּאֵה допускает оттенок пристального взгляда и удивления наряду с нейтральным наблюдением.
lexical_decisions:
- source_word: הָאִישׁ
  choice: человек
  rationale: Еврейское существительное означает «человек» или «мужчина». Хотя из контекста ясно, что это слуга Авраама, перевод сохраняет прямое обозначение исходного текста.
- source_word: מִשְׁתָּאֵה
  choice: наблюдал
  rationale: Причастная форма передаёт продолжительное, сосредоточенное наблюдение; возможный оттенок удивления не вносится в основной текст, но отмечается в сноске.
- source_word: לָהּ
  choice: за ней
  rationale: Предлог с местоименным суффиксом обозначает объект наблюдения; сочетание «наблюдал за ней» естественно для современного русского языка.
- source_word: מַחֲרִישׁ
  choice: молча
  rationale: Причастие от חרשׁ означает, что человек хранил молчание; наречие «молча» кратко и естественно передаёт обстоятельство действия.
- source_word: לָדַעַת
  choice: желая узнать
  rationale: Инфинитив выражает цель наблюдения. «Желая узнать» яснее по-русски связывает его молчаливое наблюдение с последующим косвенным вопросом.
- source_word: הַהִצְלִיחַ
  choice: увенчал ... успехом
  rationale: Каузативная форма hiphil означает «сделал успешным». Русское выражение «увенчал успехом» сохраняет каузативный смысл и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: דַּרְכּוֹ
  choice: его путь
  rationale: Слово буквально означает «путь» и в контексте охватывает как путешествие, так и порученное дело; русский вариант сохраняет эту смысловую широту.
- source_word: אִם לֹא
  choice: или нет
  rationale: В составе косвенного вопроса это сочетание естественно передаётся конструкцией «ли ... или нет».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-повествовательный. Сохранено исходное «человек», а не контекстуальное «слуга»; выражение «его путь» удерживает буквальный и переносный смысл еврейского דֶּרֶךְ.
