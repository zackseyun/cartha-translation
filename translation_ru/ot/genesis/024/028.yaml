  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: ru
  text: Тогда девушка побежала и рассказала домашним своей матери обо всём этом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дом своей матери». Еврейское выражение может обозначать как сам дом матери, так и её домочадцев или семью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: побежала
  rationale: Глагол רוץ обозначает быстрое движение; «побежала» естественно передаёт последовательное повествовательное действие.
- source_word: הַנַּעֲרָ
  choice: девушка
  rationale: נַעֲרָה обозначает молодую женщину; «девушка» — современное и естественное русское соответствие в данном контексте.
- source_word: וַתַּגֵּד
  choice: рассказала
  rationale: Порода хифиль глагола נגד означает «сообщить, дать знать»; «рассказала» естественно сочетается с содержанием происшедшего.
- source_word: לְבֵית אִמָּהּ
  choice: в доме своей матери
  rationale: בַּיִת может обозначать как дом, так и домочадцев. Русское «в доме своей матери» сохраняет естественность и допускает как пространственное, так и семейно-бытовое понимание.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: обо всём этом
  rationale: דְּבָרִים может означать слова, дела или обстоятельства; в контексте речь идёт о сообщении случившегося, что естественно передаётся выражением «обо всём этом».
