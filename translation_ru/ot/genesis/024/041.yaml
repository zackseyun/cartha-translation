  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: ru
  text: Тогда ты будешь свободен от моей клятвы[a], когда придёшь к моему роду; а если они не отдадут тебе её, ты будешь свободен от моей клятвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от моего проклятия»; еврейское слово может означать клятву с подразумеваемым проклятием или наказанием за её нарушение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: будешь свободен
  rationale: Обе формы корня נקה в данном контексте означают освобождение от обязательства или ответственности по клятве, а не отвлечённую нравственную невиновность; единообразный перевод сохраняет параллелизм стиха.
- source_word: מֵאָלָתִי
  choice: от клятвы, данной мне
  rationale: אָלָה обозначает клятву, подразумевающую санкцию или проклятие за нарушение. Формулировка «данной мне» естественно передаёт притяжательный суффикс и показывает, что речь идёт о клятве слуги Аврааму, а не о клятве самого Авраама.
- source_word: כִּי
  choice: когда
  rationale: Здесь союз вводит обстоятельство, при наступлении которого слуга освобождается от обязательства; «когда» сохраняет временно-условный оттенок, не превращая его в однозначное условие.
- source_word: תָבֹא אֶל מִשְׁפַּחְתִּי
  choice: придёшь к моему роду
  rationale: מִשְׁפָּחָה означает расширенную семью или род. «Род» в этом повествовательном контексте точнее современного узкого значения слова «семья» и звучит естественно.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: а если они не отдадут её тебе
  rationale: 'Прямое дополнение в еврейском тексте не выражено, но однозначно восстанавливается из контекста: речь о предполагаемой невесте. В русском языке местоимение «её» необходимо для ясной и естественной фразы; «отдадут» соответствует брачному контексту.'
theological_decisions:
- issue: Значение אָלָה в контексте клятвы
  choice: клятва
  alternative: проклятие
  rationale: В повествовании основной смысл — обязательство, возложенное на слугу клятвой. При этом возможный оттенок проклятия или санкции за нарушение сохранён в примечании, чтобы не устранять семантическое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Род» передаёт расширенную семейную группу; повтор ключевой формулы сохранён. Неявное дополнение «её» восстановлено только ради грамматической ясности и по непосредственному контексту.
