base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: ru
  text: 'Тогда я спросил её: «Чья ты дочь?» Она ответила: «Я дочь Вафуила, сына Нахора, которого Милка родила Нахору». Тогда я надел ей на нос кольцо[a], а на руки — браслеты[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «носовое кольцо». Еврейское слово может обозначать кольцевое украшение вообще; его назначение здесь уточняют слова «на нос».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на её руки»; по смыслу, вероятно, на запястья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: Тогда я спросил её
  rationale: Два последовательных еврейских глагола буквально означают «я спросил её и сказал», но здесь речь вводит содержание вопроса; по-русски естественно передать это одним глаголом с двоеточием.
- source_word: בַּת מִי אַתְּ
  choice: Чья ты дочь?
  rationale: Естественно передаёт еврейский вопрос о происхождении, сохраняя слово «дочь».
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Я дочь Вафуила, сына Нахора
  rationale: Сохраняет структуру родословного указания; местоимение «я» добавлено для естественной русской прямой речи.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: которого Милка родила ему
  rationale: Относительное местоимение относится к Вафуилу, а «ему» передаёт לּוֹ и указывает на Нахора; формулировка сохраняет явное упоминание матери.
- source_word: הַנֶּזֶם עַל אַפָּהּ
  choice: кольцо ей на нос
  rationale: נֶזֶם может обозначать кольцевое украшение вообще, а слова «на нос» уточняют, как оно использовано здесь.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: а браслеты — на руки
  rationale: צְמִידִים — парные браслеты; יָד имеет более широкий диапазон значений, чем русское «кисть», поэтому основной текст сохраняет более общее «руки».
