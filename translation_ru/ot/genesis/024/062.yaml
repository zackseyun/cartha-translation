lexical_decisions:
- source_word: בָּא מִבּוֹא
  choice: вернулся от
  rationale: Сочетание личной формы בוא с מִן и инфинитивом בוא — сжатая и несколько трудная конструкция. В данном контексте она указывает на завершённое прибытие со стороны Беэр-Лахай-Рои; «вернулся от» естественно передаёт движение к месту пребывания, не добавляя начального наречного маркера.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Беэр-Лахай-Рои
  rationale: Географическое название передано транслитерацией и с дефисами, отражающими составной характер еврейского имени.
- source_word: יוֹשֵׁב
  choice: жил
  rationale: Причастие обозначает продолжающееся или обычное проживание. Русское несовершенное «жил» естественно сохраняет длительный смысл.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: в земле Негев
  rationale: «Земля» передаёт явное אֶרֶץ, а «Негев» — географическое название южной засушливой области.
- source_word: וְהוּא
  choice: и
  rationale: Союз сохраняет координацию двух сообщений; отдельное «он» в русском не требуется, поскольку субъект остаётся тем же.
