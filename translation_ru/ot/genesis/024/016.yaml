  text: וְ/הַֽ/נַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְ/אִ֖ישׁ לֹ֣א יְדָעָ֑/הּ וַ/תֵּ֣רֶד הָ/עַ֔יְנָ/ה וַ/תְּמַלֵּ֥א כַדָּ֖/הּ וַ/תָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: ru
  text: Девушка была очень красива[a]. Она была девственницей, и ни один мужчина не познал её[b]. Она спустилась к источнику[c], наполнила свой кувшин и поднялась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «очень хороша видом».'
    reason: literal_rendering
  - marker: b
    text: 'То есть не имела половых отношений с мужчиной. По-еврейски буквально: «мужчина не знал её».'
    reason: lexical_alternative
  - marker: c
    text: 'Некоторые переводы: «к колодцу»; еврейское слово обычно означает источник воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: девушка
  rationale: Слово обозначает молодую женщину, здесь — брачного возраста. «Девушка» естественно звучит в современном русском языке и не придаёт тексту архаического оттенка.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: была очень красива
  rationale: Передаёт усиленную характеристику внешней привлекательности естественным русским выражением; буквальная образность отмечена в сноске.
- source_word: בְּתוּלָה
  choice: была девственницей
  rationale: Прямо передаёт обычное значение еврейского слова в данном повествовательном контексте.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: и ни один мужчина не познал её
  rationale: Сохраняет сдержанный еврейский эвфемизм «знать» применительно к половым отношениям, не устраняя его литературную и богословскую окраску; смысл пояснён в сноске.
- source_word: הָעַיְנָה
  choice: к источнику
  rationale: עַיִן здесь обозначает природный источник воды; «источник» точнее, чем «колодец», для которого обычно употребляется другое еврейское слово.
- source_word: כַדָּהּ
  choice: свой кувшин
  rationale: Кувшин — естественное русское название сосуда, которым набирали и переносили воду. Возвратное местоимение ясно передаёт принадлежность сосуда действующему лицу.
- source_word: וַתָּעַל
  choice: и поднялась
  rationale: Сохраняет пространственное противопоставление предыдущему «спустилась» без добавления отсутствующего в оригинале направления «обратно».
theological_decisions:
- issue: Соотношение слов «девственница» и «ни один мужчина не познал её»
  choice: Сохранены оба утверждения без сведения их в одно.
  alternative: 'Передать вторую фразу только как пояснение: «то есть не имела отношений с мужчиной».'
  rationale: Еврейский текст намеренно содержит и обозначение девственности, и отдельное уточнение через эвфемизм «знать»; перевод сохраняет это усиление и не устраняет возможный смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаическое «познал» сохранено только там, где оно передаёт значимый эвфемизм оригинала, и снабжено пояснением. Первоначальная цепочка предложений разделена для естественности русского повествования, без изменения последовательности или содержания.
