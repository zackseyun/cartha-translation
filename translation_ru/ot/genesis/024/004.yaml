lexical_decisions:
- source_word: כִּי
  choice: но
  rationale: В контексте частица противопоставляет это повеление запрету брать жену из дочерей хананеев в предыдущем стихе.
- source_word: אֶל אַרְצִי
  choice: в мою землю
  rationale: Сохраняет географический смысл אֶרֶץ и не вносит представления о современном государстве.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: к моим родным
  rationale: מוֹלֶדֶת может обозначать как место происхождения, так и родичей; контекст поиска жены среди людей Авраама делает значение родства наиболее вероятным.
- source_word: תֵּלֵךְ
  choice: пойди
  rationale: Имперфект здесь выражает предписание; русский повелительный вид естественно передаёт директивную силу.
- source_word: וְלָקַחְתָּ
  choice: и возьми
  rationale: Обычное значение לקח; брачный смысл ясно выражен дополнением «жену».
- source_word: אִשָּׁה
  choice: жену
  rationale: В брачном контексте אִשָּׁה означает именно жену, а не просто женщину.
- source_word: לִבְנִי לְיִצְחָק
  choice: для моего сына Исаака
  rationale: Естественно передаёт бенефактивное значение ל и приложение «Исаака» без неуклюжего повторения предлога.
