base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: ru
  text: И я возьму с тебя клятву именем Яхве, Бога неба и Бога земли, что ты не возьмёшь моему сыну жену из дочерей хананеев, среди которых я живу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: и я возьму с тебя клятву
  rationale: Каузативная порода глагола שׁבע означает побудить другого поклясться. Русское выражение «взять с тебя клятву» естественно передаёт эту каузативность и торжественный характер речи.
- source_word: בַּיהוָה
  choice: Господом
  rationale: Предлог בְּ обозначает того, кем клянутся. Тетраграмматон передан традиционным русским библейским соответствием «Господь»; исходное имя отмечено в сноске.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: Богом неба и Богом земли
  rationale: Повтор слова אֱלֹהֵי сохранён, а «земля» в паре с «небом» обозначает космическую целостность, а не только отдельную страну.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: что ты не возьмёшь
  rationale: Придаточное передаёт содержание клятвы. Будущее совершенного вида по-русски естественно выражает обязательство не совершать указанного действия.
- source_word: אִשָּׁה לִבְנִי
  choice: моему сыну жену
  rationale: В брачном контексте אִשָּׁה означает «жена», а дательный оборот естественно передаёт назначение выбора.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: из дочерей хананеев
  rationale: Сохранён еврейский образ «дочерей» как женщин, принадлежащих к народу хананеев.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: среди которых я живу
  rationale: Оборот с причастием יוֹשֵׁב и בְּקִרְבּוֹ обозначает постоянное проживание среди данного народа; выбран естественный современный русский эквивалент.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Господь с указанием «Яхве» в сноске
  alternative: Яхве в основном тексте
  rationale: Так сохраняется привычное для русского библейского регистра обозначение, а сноска прямо сообщает форму личного имени в еврейском тексте, не скрывая исходное чтение.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. Синтаксический параллелизм «Богом неба и Богом земли» и этнический образ «дочерей хананеев» сохранены; архаические «заклинаю» и «посреди которых обитаю» не использованы.
