  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: ru
  text: 'и скажет мне: «Пей и ты, и для твоих верблюдов я тоже начерпаю воды», — она и есть та женщина, которую Яхве предназначил[a] сыну моего господина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую Яхве определил (назначил) сыну моего господина».'
    reason: Глагол הֹכִיחַ в этой форме допускает значения «определить», «назначить», «указать»; основной текст передаёт контекстуальный смысл как «предназначил».
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: и скажет мне
  rationale: Перфект в пересказе ожидаемого знака передан русским будущим временем, естественным для условно-предвосхищающего контекста.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Пей и ты
  rationale: Сохраняются повелительное значение שְׁתֵה и усиление גַּם при личном местоимении.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: и для твоих верблюдов я тоже начерпаю воды
  rationale: Глагол שׁאב означает черпать; слово «воды» естественно восполняется из контекста, а «тоже» передаёт וְגַם.
- source_word: הִוא הָאִשָּׁה
  choice: она и есть та женщина
  rationale: Именное отождествительное предложение передано без превращения утверждения в явно выраженное пожелание; частица «и» подчёркивает опознание.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: которую … предназначил
  rationale: Hiphil глагола יכח здесь указывает на Божье определение или назначение женщины; «предназначил» естественно звучит в брачном контексте, не устраняя более широкую лексическую возможность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: לְבֶן אֲדֹנִי
  choice: сыну моего господина
  rationale: Дательный падеж естественно передаёт отношение, выраженное לְ; «господин» в данном контексте обозначает хозяина слуги.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Утверждение или пожелание в הִוא הָאִשָּׁה
  choice: она и есть та женщина
  alternative: пусть она будет той женщиной
  rationale: В еврейском тексте стоит безглагольное отождествительное предложение без формального показателя юссива. Молитвенный контекст допускает оттенок ожидаемого подтверждения, но не требует превращать фразу в пожелание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет связь с предыдущим условным контекстом; формулировки понятны без архаизмов. Повтор גַּם … וְגַם передан парой «и ты … тоже».
