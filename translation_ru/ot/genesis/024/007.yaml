base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: ru
  text: 'Яхве, Бог небес, который взял меня из дома моего отца и из земли, где я родился, который говорил мне и поклялся мне, сказав: «Твоему потомству Я отдам эту землю», — Он пошлёт перед тобой Своего ангела[a], и ты возьмёшь оттуда жену для моего сына.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своего посланника». Еврейское слово מַלְאָךְ может означать как «посланник», так и «ангел»; в этом контексте более вероятно, что речь идёт о небесном посланнике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Бог небес
  rationale: Естественное русское соответствие конструктивной форме; множественное число «небес» сохраняется и идиоматично для библейского регистра.
- source_word: לְקָחַנִי
  choice: взял меня
  rationale: Сохраняет основное значение לקח и подчёркивает действие Бога, выведшего Авраама из прежнего окружения.
- source_word: מִבֵּית אָבִי
  choice: из дома моего отца
  rationale: Близко передаёт семейно-родовое выражение, не сужая его до физического здания.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: и из земли, где я родился
  rationale: Естественно передаёт значение родной земли/места рождения, не навязывая более узкое значение «родня».
- source_word: דִּבֶּר לִי
  choice: говорил со мной
  rationale: Передаёт сам глагол «говорить», не подменяя его толкованием «обещал»; содержание обещания следует далее.
- source_word: נִשְׁבַּע לִי
  choice: поклялся мне
  rationale: Прямое и естественное соответствие глаголу שבע в контексте клятвы.
- source_word: לְזַרְעֲךָ
  choice: твоему потомству
  rationale: Сохраняет собирательный характер זֶרַע лучше, чем множественное «потомкам», и звучит естественно.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: Я отдам эту землю
  rationale: Прямо передаёт обещание дарования земли; «отдам» естественно в русской речи при обозначенном получателе.
- source_word: הוּא
  choice: Он
  rationale: Отдельное местоимение и тире перед ним передают выраженное в еврейском тексте смысловое выделение субъекта.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: пошлёт Своего ангела перед тобой
  rationale: В контексте Божьего сверхъестественного водительства מַלְאָךְ вероятнее обозначает ангела; буквальное «перед тобой» сохраняет образ предшествования и водительства.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי מִשָּׁם
  choice: и ты возьмёшь оттуда жену для моего сына
  rationale: Сохраняет форму поручения и естественно связывает «оттуда» с местом, из которого должна быть взята жена.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» передаёт наиболее принятую научную реконструкцию его произношения, тогда как «Господь» заменяет имя титулом.
- issue: Значение מַלְאָכוֹ
  choice: Своего ангела
  alternative: Своего посланника
  rationale: Слово допускает оба значения, но при описании Божьего провиденциального водительства более вероятен небесный посланник. Реальная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повтор относительных конструкций частично сохранён ради риторического строя оригинала; синтаксис и порядок слов сделаны понятными для современного читателя.
