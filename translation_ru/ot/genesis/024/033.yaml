  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: ru
  text: 'Перед ним поставили еду, но он сказал: «Я не стану есть, пока не скажу того, что должен сказать».


    «Говори», — сказал тот.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו לֶאֱכֹל
  choice: Перед ним поставили еду
  rationale: Неопределённо-личная конструкция естественно передаёт действие без названного в еврейском тексте значимого субъекта; цель «для еды» в русском языке ясно подразумевается словом «еду».
- source_word: לֹא אֹכַל
  choice: Я не стану есть
  rationale: Передаёт твёрдое намерение слуги не приступать к еде до исполнения поставленного условия.
- source_word: עַד אִם דִּבַּרְתִּי דְּבָרָי
  choice: пока не скажу того, что должен сказать
  rationale: 'Идиоматично передаёт буквальное «пока не скажу моих слов»: речь идёт о сообщении или деле, которое слуга намерен изложить, а не просто о произнесении отдельных слов.'
- source_word: דַּבֵּר
  choice: Говори
  rationale: Краткий императив точно и естественно передаёт разрешение продолжить речь.
