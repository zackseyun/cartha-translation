translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Реплики переданы естественно, без добавления конфессиональной интерпретации. Местоимение «тот» сохраняет неявный в данном стихе субъект ответной реплики и не вносит имя из контекста.
