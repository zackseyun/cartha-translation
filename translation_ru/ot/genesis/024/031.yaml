base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: ru
  text: 'Он сказал: «Войди, благословенный Яхве. Зачем ты стоишь снаружи? Я приготовил дом и место для верблюдов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Обычное повествовательное продолжение с wayyiqtol; русское «Он сказал» естественно передаёт ход рассказа.
- source_word: בּוֹא
  choice: Войди
  rationale: Императив בוא в контексте гостеприимства означает приглашение войти в дом.
- source_word: בְּרוּךְ יְהוָה
  choice: благословенный Яхве
  rationale: Страдательное причастие с именем Бога употреблено как обращение; формулировка сохраняет возможную неоднозначность между источником и деятелем благословения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Зачем ты стоишь снаружи?
  rationale: В данном приглашении לָמָּה естественно передаётся как «зачем», а עמד и בחוץ сохраняют значение положения и места.
- source_word: פִּנִּיתִי הַבַּיִת
  choice: Я приготовил дом
  rationale: Глагол буквально связан с освобождением или расчисткой места, но здесь обозначает подготовку дома к приёму гостя.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: и место для верблюдов
  rationale: Прямая передача оставляет неуточнённым, как именно было оборудовано место, как и в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно употреблено собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Связь בְּרוּךְ с именем Яхве
  choice: благословенный Яхве
  alternative: благословлённый Яхве; благословенный у Яхве
  rationale: Краткая форма сохраняет традиционно понятное обращение и исходную сжатость, не фиксируя окончательно, указывает ли конструкция прежде всего на деятеля или источник благословения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Войди» и «снаружи» выбраны как ясные общеупотребительные формы; синтаксис остаётся кратким и близким к еврейскому оригиналу.
