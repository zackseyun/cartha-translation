  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: ru
  text: 'И сказала ему: «У нас много и соломы, и корма, а также есть место для ночлега».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала
  rationale: Форма с последовательным וַ продолжает повествование; русский союз «и» естественно сохраняет связь и последовательность реплик.
- source_word: אֵלָיו
  choice: ему
  rationale: Прямо передаёт предлог с местоименным суффиксом.
- source_word: גַּם ... גַּם ... גַּם
  choice: и ... и ..., а также
  rationale: Повторение גַּם последовательно добавляет элементы; такая русская конструкция сохраняет накопительный смысл без неестественного троекратного «также».
- source_word: תֶּבֶן
  choice: солома
  rationale: В контексте содержания и кормления животных это обычный и точный русский эквивалент.
- source_word: מִסְפּוֹא
  choice: корм
  rationale: Обозначает корм для животных; «корм» точен, современен и понятен, тогда как «фураж» был бы более узким или специальным.
- source_word: רַב
  choice: много
  rationale: Передаёт значительное количество припасов и непосредственно относится к соломе и корму.
- source_word: עִמָּנוּ
  choice: у нас
  rationale: Буквально «с нами»; в данном контексте русское «у нас» естественно выражает наличие и доступность припасов.
- source_word: מָקוֹם
  choice: место
  rationale: Сохраняет общее значение существительного, не уточняя без основания, была ли это отдельная комната.
- source_word: לָלוּן
  choice: для ночлега
  rationale: Инфинитив обозначает пребывание на ночь; существительное с предлогом естественно передаёт назначение места в современном русском.
