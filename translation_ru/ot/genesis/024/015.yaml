  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: ru
  text: 'И случилось: не успел он закончить говорить, как вот вышла Ревекка, дочь Вафуила, сына Милки, жены Нахора, брата Авраама, с кувшином на плече.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось
  rationale: Передаёт вводную повествовательную формулу без архаичного оборота «и было».
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: не успел он закончить говорить
  rationale: Естественный русский оборот для действия, ещё не завершившегося к моменту следующего события; сохраняет непосредственную последовательность событий.
- source_word: וְהִנֵּה ... יֹצֵאת
  choice: как вышла Ревекка
  rationale: Конструкция «как вышла» естественно передаёт внезапное появление, выраженное וְהִנֵּה, и повествовательное значение причастия יֹצֵאת.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: родившаяся у Вафуила
  rationale: Сохраняет пассивную формулировку происхождения и не заменяет её пояснительным «дочь», которого прямо нет в этой фразе.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: сына Милки, жены Нахора, брата Авраама
  rationale: Сохраняет всю генеалогическую цепочку и приложения исходного текста.
- source_word: כַּד
  choice: кувшин
  rationale: Обычное современное название сосуда для набирания и переноски воды; вода здесь подразумевается контекстом.
- source_word: עַל שִׁכְמָהּ
  choice: На плече у неё
  rationale: Естественная русская локативная конструкция, точно указывающая положение кувшина.
