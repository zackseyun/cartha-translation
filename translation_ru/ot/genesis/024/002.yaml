  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: ru
  text: 'И сказал Авраам своему слуге, старшему в доме Авраама, распоряжавшемуся всем его имуществом: «Положи, пожалуйста, руку под моё бедро[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Положение руки под бедро было древним жестом при принесении клятвы и, вероятно, выражало торжественность принятого обязательства.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Передаёт обычную для еврейского повествования последовательную форму с וַ־, не усиливая временную связь словом «тогда».
- source_word: עַבְדּוֹ
  choice: своему слуге
  rationale: עֶבֶד может означать раба или слугу; здесь контекст подчёркивает положение доверенного домашнего управителя, поэтому «слуга» естественно и не утверждает сверх текста конкретный правовой статус.
- source_word: זְקַן בֵּיתוֹ
  choice: старшему в его доме
  rationale: Сохраняет возможные оттенки возраста и старшинства слова זָקֵן, не превращая выражение в формальное название должности.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: распоряжавшемуся всем, что у него было
  rationale: Причастие מֹשֵׁל обозначает осуществление власти или управления; «распоряжавшемуся» естественно описывает полномочия доверенного управителя по-русски.
- source_word: שִׂים נָא
  choice: Положи, пожалуйста
  rationale: Императив с נָא передан как вежливая или настойчивая просьба, без излишне официального оттенка.
- source_word: יָדְךָ
  choice: руку
  rationale: Прямое соответствие; притяжательное значение по-русски ясно из обращения и не требует обязательного «свою».
- source_word: תַּחַת יְרֵכִי
  choice: под моё бедро
  rationale: Буквально сохраняет культурно обусловленный жест, не заменяя его толкованием в основном тексте.
