lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: отпустили
  rationale: Порода пиэль здесь обозначает позволение и содействие отъезду; «отпустили» естественно передаёт формальное провожание в путь.
- source_word: רִבְקָה
  choice: Ревекку
  rationale: Использована традиционная русская форма библейского имени.
- source_word: אֲחֹתָם
  choice: сестру свою
  rationale: Прямо передаёт родственное обозначение «их сестра»; возвратное притяжательное местоимение естественно для русского синтаксиса.
- source_word: מֵנִקְתָּהּ
  choice: её кормилицу
  rationale: Причастная форма от ינק обозначает женщину, кормившую ребёнка грудью; русское «кормилица» точно и естественно передаёт эту роль.
- source_word: עֶבֶד אַבְרָהָם
  choice: слугу Авраама
  rationale: Контекст подчёркивает поручение и служебную роль, а не юридический статус; конструкция принадлежности естественно передаётся родительным падежом.
- source_word: אֲנָשָׁיו
  choice: его людей
  rationale: Буквально «его мужчины/люди»; местоимение относится к слуге Авраама. Формулировка не уточняет их роль сверх исходного текста.
