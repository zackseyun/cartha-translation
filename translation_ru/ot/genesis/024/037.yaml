base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: ru
  text: 'И мой господин взял с меня клятву, сказав: «Не бери моему сыну жену из числа дочерей хананеев, в земле которых я живу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «ханаанеянина, в земле которого я живу»; слово «ханаанеянин» употреблено в единственном числе в собирательном значении. По смыслу возможно: «среди которых я живу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: взял с меня клятву
  rationale: Порода hифиль глагола שׁבע означает побудить кого-либо поклясться, связать клятвой. Русское выражение естественно передаёт принудительно-обязывающую силу формы.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Слуга говорит о своём хозяине Аврааме, а не о Боге. Такой порядок слов сохраняет достоинство библейского повествования и ясно обозначает человеческого господина.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Обычное повествовательное введение прямой речи; деепричастие естественно по-русски связывает его с предыдущим действием.
- source_word: לֹא תִקַּח
  choice: не бери
  rationale: Форма в контексте наставления, подкреплённого клятвой, имеет запретительное значение. Русский императив прямо и естественно передаёт запрет.
- source_word: אִשָּׁה לִבְנִי
  choice: жену моему сыну
  rationale: В контексте заключения брака אִשָּׁה означает жену; имя Исаака не добавляется, поскольку в еврейском тексте его здесь нет.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: из дочерей хананеев
  rationale: Сохраняется родственное обозначение «дочери» и коллективное этническое значение единственного числа הַכְּנַעֲנִי; русское множественное «хананеев» естественно выражает этот коллектив.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: в земле которых я живу
  rationale: Перевод сохраняет упоминание земли и длительное проживание, при этом согласует относительное местоимение с естественным русским коллективным обозначением «хананеев».
