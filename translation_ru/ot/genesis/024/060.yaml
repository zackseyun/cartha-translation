base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: ru
  text: 'И благословили они Ревекку и сказали ей: «Сестра наша! Пусть твоё потомство станет тысячами десятков тысяч[a], и да овладеет оно воротами тех, кто ненавидит его[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несметным множеством»; буквально: «тысячами десятков тысяч».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воротами врагов его потомства». В еврейском тексте буквально сказано: «воротами тех, кто ненавидит его». Ворота здесь служат образом силы города и власти над ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: благословили
  rationale: 'Прямо передаёт действие породы piel: они произнесли над Ревеккой благословение.'
- source_word: רִבְקָה
  choice: Ревекка
  rationale: Устоявшаяся русская библейская форма имени, соответствующая еврейскому רִבְקָה.
- source_word: אֲחֹתֵנוּ
  choice: Сестра наша
  rationale: Естественное торжественное обращение, сохраняющее семейную близость исходного выражения.
- source_word: הֲיִי
  choice: да станешь ты
  rationale: Передаёт форму пожелания в благословении, а не обычный приказ.
- source_word: לְאַלְפֵי רְבָבָה
  choice: тысячами десятков тысяч
  rationale: Сохраняет необычную числовую образность еврейского выражения и подчёркивает неисчислимое множество потомков.
- source_word: וְיִירַשׁ
  choice: да овладеет
  rationale: В данном контексте ירש означает завладеть и установить власть; «овладеет» естественно сочетается с образом вражеских ворот.
- source_word: זַרְעֵךְ
  choice: твоё потомство
  rationale: Сохраняет собирательное единственное число еврейского זֶרַע и звучит естественно в современном русском языке.
- source_word: שַׁעַר
  choice: воротами
  rationale: Русское «ворота» употребляется во множественном числе, но сохраняет конкретный образ укреплённого входа в город и связанной с ним власти.
- source_word: שֹׂנְאָיו
  choice: тех, кто ненавидит его
  rationale: Буквально передаёт причастную конструкцию и сохраняет местоименную отсылку в единственном числе к собирательному слову «потомство».
theological_decisions:
- issue: Собирательное единственное число в слове «потомство»
  choice: твоё потомство ... тех, кто ненавидит его
  alternative: твои потомки ... тех, кто ненавидит их
  rationale: Еврейский текст использует собирательное существительное זַרְעֵךְ в единственном числе и соотносит с ним местоименный суффикс единственного числа в שֹׂנְאָיו. Русское «потомство ... его» позволяет сохранить эту грамматическую и литературную особенность, не навязывая ей дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным строем благословения. Частица «да» естественно передаёт пожелание; архаические «семя» и «врата» не используются. Необычная гиперболическая числовая формула сохранена в основном тексте и пояснена в сноске.
