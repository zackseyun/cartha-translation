lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: заставил … опуститься на колени
  rationale: Порода хифиль глагола ברך выражает побуждение к действию; применительно к верблюдам речь идёт о том, что человек заставил их преклонить колени. Выбранная формулировка конкретна и естественна по-русски.
- source_word: הַגְּמַלִּים
  choice: верблюдов
  rationale: Определённая форма множественного числа обозначает уже упомянутых в повествовании верблюдов.
- source_word: מִחוּץ לָעִיר
  choice: за городом
  rationale: Естественное русское обозначение места вне городской черты; по смыслу соответствует «вне города».
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: у колодца
  rationale: Предлог אֶל буквально указывает направление к колодцу, но после глагола, описывающего размещение верблюдов, выражение передаёт место их остановки. «Колодец с водой» в данном контексте по-русски избыточно.
- source_word: לְעֵת עֶרֶב
  choice: под вечер
  rationale: Краткое и естественное обозначение вечернего времени, сохраняющее временную отнесённость исходного выражения.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: в то время, когда женщины выходят черпать воду
  rationale: Форма הַשֹּׁאֲבֹת — причастие женского рода множественного числа, поэтому речь именно о женщинах, которые выходят за водой. Русская формулировка естественно передаёт действие и его обычное время.
