base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: ru
  text: 'Она быстро сняла кувшин с плеча[a] и сказала: «Пей, и я напою также твоих верблюдов». Я выпил, и она напоила также верблюдов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с неё» или «с того, что было на ней». Часть тела здесь прямо не названа; из более широкого контекста следует, что кувшин она несла на плече.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: быстро
  rationale: Глагол מהר передаёт поспешность действия; наречие естественно сочетается с последующим глаголом и сохраняет акцент на её незамедлительности.
- source_word: וַתּוֹרֶד
  choice: сняла
  rationale: Порода хифиль глагола ירד означает «опустить, спустить». В данном контексте естественное русское «сняла» ясно передаёт, что она опустила кувшин с места, где несла его.
- source_word: כַּדָּהּ
  choice: кувшин
  rationale: כַּד обозначает сосуд для воды; «кувшин» — ясное и традиционно понятное русское соответствие.
- source_word: מֵעָלֶיהָ
  choice: с плеча[a]
  rationale: Буквально сказано «с неё / с того, что было на ней», без названия части тела. Контекст Быт. 24:15 позволяет естественно указать плечо, а сноска сохраняет формальную неопределённость еврейского выражения.
- source_word: שְׁתֵה
  choice: Пей
  rationale: Краткое прямое повеление соответствует форме и лаконичности еврейского текста.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: и я напою также твоих верблюдов
  rationale: Хифиль שקה означает «дать пить, напоить». Русское «напою» кратко и естественно передаёт обещанное действие.
- source_word: וָאֵשְׁתְּ
  choice: Я выпил
  rationale: Форма продолжает повествование от первого лица; простое «я выпил» сохраняет последовательность событий без добавочной причинной связи.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: и она напоила также верблюдов
  rationale: Повтор глагола שקה передан тем же корнем «напоить», что поддерживает лексическую связь с её обещанием.
