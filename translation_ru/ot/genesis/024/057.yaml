lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И они сказали
  rationale: Обычная повествовательная форма wayyiqtol; союз «и» сохраняет последовательное течение еврейского рассказа.
- source_word: נִקְרָא
  choice: Позовём
  rationale: Форма выражает совместное волеизъявление или предложение. «Позовём» естественно передаёт его по-русски и не придаёт фразе излишне властного оттенка.
- source_word: לַנַּעֲרָ
  choice: молодую женщину
  rationale: נַעֲרָה обозначает молодую женщину; в данном контексте это достигшая брачного возраста Ревекка. Выбор современен и не звучит ни по-детски, ни архаично.
- source_word: וְנִשְׁאֲלָה
  choice: и спросим
  rationale: Продолжает совместное предложение; «спросим» ясно и естественно передаёт значение שאל.
- source_word: אֶת פִּיהָ
  choice: её саму
  rationale: Буквально «её уста» — идиома, подчёркивающая получение ответа непосредственно от самой Ревекки. В сочетании со «спросим» русский оборот «её саму» сохраняет этот акцент без неясного буквализма.
