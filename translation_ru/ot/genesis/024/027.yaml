base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: ru
  text: 'И сказал он: «Благословен Яхве, Бог моего господина Авраама, не оставивший моего господина без Своей неизменной любви и верности. А я — в пути — был приведён Яхве к дому братьев моего господина[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к дому братьев моего господина». В данном контексте «братья» обозначает родню Авраама по мужской линии, а не обязательно его родных братьев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Благословен Яхве
  rationale: Краткая славословная формула естественно передаётся именным предложением; личное имя יהוה транслитерировано как «Яхве».
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Бог господина моего Авраама
  rationale: Сохранена конструкция принадлежности и почтительное обозначение Авраама устами слуги.
- source_word: לֹא עָזַב חַסְדּוֹ וַאֲמִתּוֹ מֵעִם אֲדֹנִי
  choice: не оставивший господина моего без Своей неизменной любви и верности
  rationale: Русская конструкция «не оставить кого-либо без» естественно передаёт сочетание עזב с מעם, не создавая неясного буквального «не оставил ... от». חֶסֶד וֶאֱמֶת передано как устойчивое отношение любви и надёжности.
- source_word: אָנֹכִי
  choice: Меня же
  rationale: Самостоятельное местоимение имеет эмфатическое значение; частица «же» сохраняет выделение говорящего, а винительный падеж обусловлен русской конструкцией с глаголом «привёл».
- source_word: בַּדֶּרֶךְ נָחַנִי יְהוָה
  choice: Яхве привёл прямо
  rationale: בדרך в сочетании с глаголом ведения может означать, что Бог направил говорящего верным путём. «Прямо» естественно выражает успешное провиденциальное руководство в данном контексте.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: к дому родных господина моего
  rationale: אחים буквально означает «братья», но в родословно-семейном контексте обозначает более широкий круг мужской родни; «родные» понятно передаёт фактический референт, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл пары חֶסֶד וֶאֱמֶת
  choice: неизменная любовь и верность
  alternative: милость и истина; преданная любовь и надёжность
  rationale: Пара обозначает стойкое благоволение и надёжность в отношениях. Выбранная формулировка сохраняет этот богословский оттенок, не сводя אֱמֶת к отвлечённой истинности.
- issue: Направленность выражения מֵעִם אֲדֹנִי
  choice: не оставивший господина моего без
  alternative: не отнявший у господина моего; не оставивший любви и верности к господину моему
  rationale: Предлог буквально указывает на удаление «от кого-либо», но вместе с עזב смысл состоит в том, что Бог не лишил Авраама Своей любви и верности. Русская идиома сохраняет этот образ без богословского домысливания.
- issue: Значение בַּדֶּרֶךְ
  choice: прямо
  alternative: по пути; верным путём
  rationale: Фраза допускает как локальное «в пути», так и указание на верное направление. Контекст внезапного достижения нужной семьи поддерживает «прямо», однако это не превращено в отдельное доктринальное утверждение.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Инверсия «господина моего» слегка возвышает речь, не делая её архаичной. Заглавные буквы в «Своей» применены как русская традиционная форма почтительного соотнесения местоимения с Богом.
