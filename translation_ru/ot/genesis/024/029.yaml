    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: У Ревекки был брат
  rationale: Еврейская конструкция с לְ выражает обладание; по-русски естественно передаётся конструкцией «у ... был». Начальный וּ связывает предложение с контекстом и не требует отдельного союза.
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: по имени Лаван
  rationale: Сжатая современная передача формулы «и имя его — Лаван», сохраняющая её смысл без тяжеловесности.
- source_word: וַ/יָּרָץ
  choice: выбежал
  rationale: Глагол означает «побежал», а последующее הַחוּצָה задаёт направление наружу; русское «выбежал» естественно объединяет оба значения.
- source_word: אֶל הָ/אִישׁ
  choice: к тому человеку
  rationale: Сохраняется общее обозначение мужчины, употреблённое в еврейском тексте, без поясняющей подстановки «слуге»; «тому» естественно указывает на уже известного из контекста человека.
- source_word: אֶל הָ/עָיִן
  choice: к источнику
  rationale: עַיִן здесь обозначает природный источник, а не колодец; повтор предлога «к» сохраняет параллельные конструкции оригинала и возможную направительную связь.
