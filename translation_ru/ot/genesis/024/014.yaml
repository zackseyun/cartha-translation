source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: ru
  text: 'Пусть та девушка, которой я скажу: «Наклони, пожалуйста, свой кувшин, чтобы я напился», — и которая ответит: «Пей, и верблюдов твоих я тоже напою», — окажется той, кого Ты предназначил рабу Твоему Исааку[a]. По ней[b] я узнаю, что Ты явил милость господину моему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для раба Твоего, для Исаака». Еврейскую конструкцию с повторённым предлогом можно понять как пояснение («рабу Твоему Исааку») или как два последовательных оборота.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «По этому я узнаю». Буквально в еврейском тексте: «по ней» — девушка сама выступает знаком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Пусть … окажется
  rationale: В молитвенном контексте форма вводит просьбу о знаке. Русская конструкция естественно передаёт желательное значение, не дублируя сказуемое.
- source_word: הַנַּעֲרָ
  choice: девушка
  rationale: Слово обозначает молодую женщину, здесь брачного возраста; «девушка» ясно и естественно в современном русском.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Наклони, пожалуйста, свой кувшин
  rationale: הטה означает наклонить или опустить; при просьбе дать напиться «наклони кувшин» точно передаёт жест, а «пожалуйста» отражает נָא.
- source_word: וְאֶשְׁתֶּה
  choice: чтобы я напился
  rationale: Передаёт цель просьбы и когортативный оттенок естественной русской конструкцией.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: и верблюдов твоих я тоже напою
  rationale: Каузатив שׁקה означает «дать пить, напоить»; порядок слов сохраняет лёгкое смысловое выделение верблюдов.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: той, кого Ты предназначил
  rationale: В данном контексте Hiphil от יכח выражает определение или указание избранной женщины посредством просимого знака. «Предназначил» уместно для будущей жены Исаака и не перегружает фразу.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: рабу Твоему Исааку
  rationale: 'Повтор лamed допускает пояснительное прочтение: Исаак уточняет, кто назван Божьим рабом. Это синтаксически естественно и соответствует цели поисков невесты для Исаака.'
- source_word: וּבָהּ אֵדַע
  choice: По ней я узнаю
  rationale: Женский местоименный суффикс буквально отсылает к девушке как к знаку; «по ней» сохраняет этот референт и остаётся естественным по-русски.
- source_word: כִּי עָשִׂיתָ חֶסֶד
  choice: что Ты явил милость
  rationale: חֶסֶד здесь обозначает верную, благосклонную милость. «Явил милость» сохраняет библейскую весомость выражения без чрезмерного догматического уточнения.
- source_word: עִם אֲדֹנִי
  choice: господину моему
  rationale: Хотя עִם буквально значит «с», русское управление при «явить милость» требует дательного падежа.
theological_decisions:
- issue: К кому относится выражение לְעַבְדְּךָ לְיִצְחָק
  choice: '«рабу Твоему Исааку»: Исаак назван Божьим рабом'
  alternative: «для раба Твоего, для Исаака»; либо менее вероятно — первое выражение относится к молящемуся слуге Авраама
  rationale: Повтор предлога לְ может вводить поясняющее приложение. Контекст прямо касается назначения женщины Исааку, поэтому отождествление Божьего раба с Исааком даёт наиболее связный смысл, при этом формальная двусмысленность отмечена в сноске.
- issue: Референт וּבָהּ
  choice: '«По ней»: девушка служит знаком'
  alternative: '«По этому»: ответ и поступок девушки рассматриваются как знак в целом'
  rationale: Грамматический женский суффикс непосредственно согласуется с הַנַּעֲרָ, поэтому основной текст сохраняет личный референт, не исключая более широкого ситуативного понимания.
- issue: Передача חֶסֶד
  choice: милость
  alternative: верная любовь; неизменная любовь; доброта
  rationale: «Милость» в данном молитвенном контексте естественно охватывает благоволение и верность, не сводя слово ни к простой любезности, ни к узкому техническому понятию завета.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью без архаизмов. Заглавные местоимения «Ты», «Твоему» обозначают обращение к Богу; инверсия «верблюдов твоих», «господину моему» слегка возвышает речь, оставаясь понятной.
