  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: ru
  text: И слуга положил свою руку под бедро Авраама, своего господина, и поклялся ему по этому поводу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Под бедро» — буквальная передача еврейского выражения, описывающего жест при торжественной клятве. Некоторые усматривают в нём символическую связь с чреслами или с потомством завета.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: раб
  rationale: עֶבֶד обозначает зависимого слугу или раба. Русское «раб» прямо передаёт социальную зависимость этого человека от Авраама и соответствует повествовательному контексту.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: положил руку
  rationale: שׂוּם означает «класть, помещать»; выражение «положил руку» естественно и точно по-русски.
- source_word: תַּחַת יֶרֶךְ
  choice: под бедро
  rationale: יָרֵךְ буквально означает «бедро». Конкретный образ сохранён в основном тексте без истолкования символики жеста.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: Авраама, своего господина
  rationale: אֲדוֹן здесь обозначает хозяина, обладающего властью над рабом. «Господин» естественно выражает человеческие отношения власти и не смешивается с именованием Бога «Господь».
- source_word: וַיִּשָּׁבַע לוֹ
  choice: и поклялся ему
  rationale: Нифаль глагола שׁבע означает «клясться, приносить клятву», а местоименный объект לוֹ указывает, кому была дана клятва.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: в этом деле
  rationale: דָּבָר здесь относится к поручению, только что данному Авраамом. «В этом деле» кратко и естественно передаёт предмет клятвы.
theological_decisions:
- issue: Буквальная передача жеста клятвы или истолкование его символики
  choice: Сохранить буквальное «под бедро», а возможную символику пояснить в сноске.
  alternative: Передать жест истолковательно — как связанный с чреслами, половыми органами или потомством завета.
  rationale: Еврейский текст сообщает о физическом действии, но не объясняет его значения. Буквальный перевод сохраняет неоднозначность и не навязывает читателю конкретного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис простой и ясный; культурно непрозрачный жест сохранён буквально и кратко пояснён в сноске.
