  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: ru
  text: Вот я стою у водного источника[a], и дочери горожан[b] выходят черпать воду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у родника». Еврейское выражение עֵין הַמָּיִם обозначает источник воды, а не обычный колодец.'
    reason: lexical_alternative
  - marker: b
