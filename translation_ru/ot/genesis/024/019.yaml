  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: ru
  text: 'Когда она закончила давать ему пить[a], она сказала: «Я начерпаю воды и для твоих верблюдов, пока они не закончат пить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «И, закончив поить его, она сказала…»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכַל
  choice: Когда она закончила
  rationale: Глагол כלה означает «закончить, завершить». В сочетании с последующим инфинитивом форма обозначает завершение одного действия перед следующим; «когда она закончила» естественно передаёт эту последовательность по-русски.
- source_word: לְהַשְׁקֹתוֹ
  choice: поить его
  rationale: Каузативный инфинитив от שקה с местоименным суффиксом 3-го лица мужского рода означает «давать ему пить». Русское «поить его» точно и естественно в данном контексте.
- source_word: וַתֹּאמֶר
  choice: то сказала
  rationale: Обычный повествовательный глагол אמר, «сказать». Частица «то» связывает главное предложение с придаточным времени и сохраняет последовательность действий.
- source_word: גַּם לִגְמַלֶּיךָ
  choice: и для твоих верблюдов
  rationale: גַּם имеет добавочное значение, а לְ указывает, для кого будет набрана вода. Сочетание «и для твоих верблюдов» естественно передаёт оба элемента.
- source_word: אֶשְׁאָב
  choice: Я начерпаю воды
  rationale: שאב означает «черпать, набирать воду». Слово «воды» восполнено из непосредственного контекста; совершенный вид «начерпаю» уместен для обещанного действия.
- source_word: עַד אִם
  choice: пока … не
  rationale: Сочетание вводит предел действия, то есть «до тех пор, пока». Русская конструкция «пока … не» передаёт это значение естественно.
- source_word: כִּלּוּ לִשְׁתֹּת
  choice: они не напьются
  rationale: Буквально выражение означает «они закончат пить». В данном контексте «напьются» ясно и естественно обозначает завершение питья, не меняя референта — верблюдов.
