  text: אִם לֹ֧א אֶל בֵּית אָבִ֛/י תֵּלֵ֖ךְ וְ/אֶל מִשְׁפַּחְתִּ֑/י וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: ru
  text: но пойдёшь в дом моего отца и к моему роду[a] и возьмёшь жену для моего сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к моей семье», «к моим родственникам». Еврейское слово означает широкую родственную группу, а не только ближайших домашних.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: но
  rationale: В данном контексте клятвенного поручения сочетание вводит противопоставленное предыдущему запрету предписание; русское «но» естественно передаёт эту связь, не превращая выражение в буквальное условие «если не».
- source_word: בֵּית אָבִי
  choice: дом моего отца
  rationale: Сохраняет образ «дома» и допускает как значение жилища, так и более широкое значение отцовского дома или семьи.
- source_word: תֵּלֵךְ
  choice: пойдёшь
  rationale: Будущее совершенного вида в контексте поручения естественно выражает обязательное действие, сохраняя форму прямой речи.
- source_word: מִשְׁפַּחְתִּי
  choice: моему роду
  rationale: Здесь слово обозначает более широкую родственную группу, а не только ближайшую семью; «род» передаёт это значение естественнее, чем современное узкое понимание слова «семья».
- source_word: וְלָקַחְתָּ
  choice: и возьмёшь
  rationale: Прямой и традиционный эквивалент глагола לקח в контексте заключения брака.
- source_word: אִשָּׁה
  choice: жену
  rationale: Брачный контекст однозначно актуализирует значение «жена», а не общее «женщина».
- source_word: לִבְנִי
  choice: для моего сына
  rationale: Предлог ל обозначает предназначение или пользу; «для моего сына» ясно передаёт брачное поручение.
