translation_notes:
  register: Современный литературный русский, с умеренно формальным и повествовательно живым тоном. Длинный еврейский период перестроен в естественное русское предложение без утраты последовательности двух временных обстоятельств и основного действия. Архаизмы устранены; частица הִנֵּה передана как «И вот».
