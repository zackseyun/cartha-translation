base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: ru
  text: 'Когда он увидел кольцо[a] и браслеты на руках своей сестры и услышал, как его сестра Ревекка сказала: «Вот что сказал мне тот человек», он пошёл к тому человеку. И вот, он стоял возле[b] верблюдов у источника[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кольцо для носа». В Быт. 24:47 сказано, что это украшение было надето Ревекке на нос.'
    reason: lexical_alternative
  - marker: b
    text: Буквально используемый здесь предлог может означать положение «при» или «возле» чего-либо, а не сверху на нём.
    reason: lexical_clarification
  - marker: c
    text: 'Или, менее точно: «у колодца». Еврейское слово עַיִן обычно означает источник, ключ или место выхода воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: не передано отдельной формулой
  rationale: В данном длинном временном построении повествовательная формула וַיְהִי естественно выражается по-русски самой конструкцией «Когда… он пошёл»; буквальное «и случилось» было бы тяжеловесным.
- source_word: הַנֶּזֶם
  choice: кольцо
  rationale: נֶזֶם может обозначать кольцо вообще; ближайший контекст (Быт. 24:47) показывает, что его надели в нос, поэтому уточнение сохранено в сноске, а основной текст не сужает лексическое значение без необходимости.
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: браслеты на руках своей сестры
  rationale: «Браслеты» — естественное современное обозначение украшений; «на руках» формально соответствует יָדַיִם и понятно в контексте.
- source_word: וּכְשָׁמְעוֹ אֶת דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: и услышал, как его сестра Ревекка сказала
  rationale: Русская конструкция естественно передаёт слышание слов Ревекки и функцию לֵאמֹר как введения прямой речи, избегая тяжёлого «услышал слова… говорившей».
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: Вот что говорил мне этот человек
  rationale: «Вот что» передаёт указательное כֹּה, а «этот человек» естественно указывает на уже упомянутого Ревеккой незнакомца.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: он пошёл к тому человеку
  rationale: בוא с אֶל допускает передачу как движения к лицу; с точки зрения Лавана по-русски естественнее «пошёл к».
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет дейктическую живость הִנֵּה без архаического «се».
- source_word: עֹמֵד עַל הַגְּמַלִּים
  choice: стоял возле верблюдов
  rationale: Причастие выражает продолжающееся состояние, а עַל здесь обозначает положение при или возле верблюдов, а не на них.
- source_word: עַל הָעָיִן
  choice: у источника
  rationale: עַיִן в данном контексте означает природный источник или место выхода воды; «источник» точнее общего «колодец».
