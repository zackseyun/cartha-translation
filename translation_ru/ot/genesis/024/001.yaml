lexical_decisions:
- source_word: וְאַבְרָהָם
  choice: Авраам
  rationale: Начальный союз ו открывает новый повествовательный эпизод; в современном русском отдельное «и» здесь необязательно, а связь предложений сохраняется контекстом.
- source_word: זָקֵן
  choice: состарился
  rationale: Форма זָקֵן сообщает о наступившей старости Авраама. Русское «состарился» естественно передаёт состояние, достигнутое к этому моменту повествования.
- source_word: בָּא בַּיָּמִים
  choice: достиг преклонных лет[a]
  rationale: Буквально «вошёл в дни» — древнееврейская идиома глубокой старости. Выбран естественный современный русский эквивалент, а буквальный образ сохранён в сноске.
- source_word: וַיהוָה
  choice: а Яхве
  rationale: Союз ו связывает вторую часть стиха с первой и естественно передаётся здесь союзом «а» без значения противопоставления; личное имя יהוה транслитерировано как «Яхве».
- source_word: בֵּרַךְ
  choice: благословил
  rationale: Перфект описывает уже совершившееся и сохраняющее значение благословение; русский глагол совершенного вида точно и естественно передаёт эту мысль.
- source_word: בַּכֹּל
  choice: во всём
  rationale: Выражение обозначает всеохватность благословения, не сводя его лишь к материальному достатку.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо употреблено личное имя Бога, поэтому транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי.
- issue: Объём выражения בַּכֹּל
  choice: во всём
  alternative: всячески
  rationale: Формулировка «во всём» сохраняет широкое значение исходного текста и не уточняет без достаточных оснований, относилось ли благословение к имуществу, обстоятельствам жизни или ко всем её сторонам.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным звучанием. Лексический параллелизм двух указаний на старость сохранён без тяжеловесной буквальности; имя Авраама повторено вслед за древнееврейским текстом.
