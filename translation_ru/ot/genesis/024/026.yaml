  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: ru
  text: Тогда тот человек склонился и поклонился Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся ниц перед Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: склонился
  rationale: Глагол קָדַד обозначает телесное склонение; такой перевод естественно передаёт первый жест и не дублирует следующий глагол.
- source_word: הָאִישׁ
  choice: этот человек
  rationale: В еврейском тексте прямо сказано «человек», хотя из контекста ясно, что речь идёт о слуге Авраама. Указательное «этот» естественно связывает его с уже известным участником повествования.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Форма глагола שׁחה выражает почтительное земное поклонение; при дополнении «Яхве» оно является актом поклонения Богу. Русское «поклонился» сохраняет одновременно телесный образ и религиозный смысл.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, не заменяя его титулом «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» прямо сохраняет его в переводе.
- issue: Передача וַיִּשְׁתַּחוּ как телесного действия или общего понятия поклонения
  choice: поклонился
  alternative: простёрся ниц перед; воздал поклонение
  rationale: «Поклонился» не устраняет телесный аспект глагола и в сочетании с именем Бога ясно выражает религиозное поклонение, сохраняя смысловую напряжённость между жестом и богопочитанием.
translation_notes:
  register: Современный литературный русский язык; лаконичная повествовательная фраза. Сохранено исходное «человек», а не контекстуальное «слуга». Различие двух последовательных глаголов передано словами «склонился» и «поклонился».
