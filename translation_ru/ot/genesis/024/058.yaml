  text: וַ/יִּקְרְא֤וּ לְ/רִבְקָה֙ וַ/יֹּאמְר֣וּ אֵלֶ֔י/הָ הֲ/תֵלְכִ֖י עִם הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/תֹּ֖אמֶר אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: ru
  text: 'Тогда они позвали Ревекку и сказали ей: «Пойдёшь ли ты с этим человеком?» Она сказала: «Пойду».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: позвали
  rationale: В данном контексте קרא означает позвать человека для участия в разговоре. «Позвали» естественно по-русски и не придаёт действию излишне властного оттенка, возможного у слова «вызвали».
- source_word: לְרִבְקָה
  choice: Ревекку
  rationale: Использована закрепившаяся в русской библейской традиции форма имени רִבְקָה — «Ревекка».
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: сказали ей
  rationale: Перевод сохраняет обычное значение глагола אמר — «сказать», хотя по контексту по-русски также возможно «спросили её».
- source_word: הֲתֵלְכִי
  choice: Пойдёшь ли ты
  rationale: Форма глагола הלך выражает прямой вопрос к женщине о том, пойдёт ли она; перевод не добавляет отсутствующего в тексте выражения «согласна ли».
- source_word: עִם הָאִישׁ הַזֶּה
  choice: с этим человеком
  rationale: Существительное אִישׁ буквально означает «мужчина, человек». Хотя речь идёт о слуге Авраама, исходный текст здесь не называет его слугой.
- source_word: וַתֹּאמֶר
  choice: Она сказала
  rationale: Сохранено прямое значение אמר — «сказать»; вариант «она ответила» был бы естественнее в диалоге, но менее буквально отражал бы повтор глагола в древнееврейском тексте.
- source_word: אֵלֵךְ
  choice: Пойду
  rationale: Краткий русский ответ точно передаёт простое и решительное высказывание «я пойду» без добавления оттенка «я согласна».
