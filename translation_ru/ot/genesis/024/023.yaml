  text: 'И он сказал: «Чья ты дочь? Скажи мне, пожалуйста. Есть ли в доме твоего отца место, чтобы нам переночевать?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И он спросил
  rationale: Глагол буквально означает «сказал», но далее следуют вопросы; русское «спросил» естественно передаёт речевое действие в этом контексте, а союз «и» сохраняет поступательное движение еврейского повествования.
- source_word: בַּת מִי אַתְּ
  choice: Чья ты дочь?
  rationale: Естественная русская передача вопроса о семейной принадлежности с сохранением прямого упоминания дочери.
- source_word: הַגִּידִי נָא לִי
  choice: Скажи мне, пожалуйста
  rationale: Частица נָא смягчает повелительную форму; «пожалуйста» естественно выражает вежливую просьбу.
- source_word: הֲיֵשׁ
  choice: Есть ли
  rationale: Точно и естественно передаёт вопросительную конструкцию существования.
- source_word: בֵּית אָבִיךְ
  choice: в доме твоего отца
  rationale: Сохраняет конкретный образ отцовского дома, не сводя его к более общему понятию семьи или жилья.
- source_word: מָקוֹם
  choice: место
  rationale: «Место» непосредственно соответствует широкому значению существительного и в данном контексте означает доступное пространство для ночлега.
- source_word: לָנוּ
  choice: мы
  rationale: Первое лицо множественного числа сохранено в естественной русской придаточной конструкции и охватывает слугу и сопровождавших его людей.
- source_word: לָלִין
  choice: могли бы переночевать
  rationale: Глагол обозначает пребывание на ночь; такая формулировка ясна современному читателю и вежливо звучит в вопросе о возможности ночлега.
