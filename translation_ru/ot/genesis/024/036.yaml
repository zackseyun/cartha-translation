base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: ru
  text: Сарра, жена моего господина, родила моему господину сына, когда уже состарилась, и он отдал ему всё, что имел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Повествовательная форма глагола ילד обозначает завершённое рождение ребёнка; «родила» — точное и естественное соответствие в современном русском языке.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: жена моего господина
  rationale: Сохраняет конструкцию принадлежности и почтительное обозначение Авраама в речи слуги.
- source_word: בֵן לַאדֹנִי
  choice: родила моему господину сына
  rationale: Русская конструкция естественно передаёт еврейское выражение с ל и сохраняет акцент на рождении сына Аврааму.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: когда уже состарилась
  rationale: Буквально выражение связано с наступившей старостью Сарры. Выбранный вариант ясно и естественно передаёт временной смысл, не превращая его в неидиоматичное русское «после её старости».
- source_word: וַיִּתֶּן לוֹ
  choice: и он отдал ему
  rationale: Повествовательная форма נתן продолжает последовательность прошедших событий; местоимения относятся соответственно к Аврааму и его сыну.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: всё, что имел
  rationale: Передаёт всеохватность еврейской формулы владения и звучит естественно по-русски.
theological_decisions:
- issue: Характер передачи всего имущества сыну
  choice: отдал ему всё, что имел
  alternative: завещал ему всё своё имущество
  rationale: В тексте употреблён общий глагол נתן («дать, отдать»), а не специальный термин для завещания. Поэтому перевод не уточняет юридический способ или момент передачи.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Повтор «моему господину» сохранён как характерная черта почтительной речи слуги; синтаксис сделан естественным для современного читателя.
