lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой продвигает повествование; традиционная и естественная русская связка «И сказал» сохраняет последовательность.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Устоявшаяся русская передача личного имени.
- source_word: אֶל־אַבְרָהָם
  choice: Аврааму
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: מָה רָאִיתָ
  choice: Что ты имел в виду
  rationale: Буквально «что ты увидел»; в данном вопросе глагол «видеть» идиоматически указывает на соображение, восприятие или намерение. Основной текст передаёт смысл естественным современным русским, а буквальный образ сохранён в примечании.
- source_word: כִּי
  choice: когда
  rationale: Связывает вопрос о побуждении с совершённым поступком. В русском «когда» естественно вводит обстоятельство поступка, не навязывая причинного ответа.
- source_word: עָשִׂיתָ
  choice: сделал
  rationale: Простая форма прошедшего времени близко и естественно передаёт совершённое действие.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: это
  rationale: Контекст ясно указывает на поступок Авраама; русское местоименное «это» звучит естественнее тяжеловесного «это дело», не добавляя моральной оценки.
