  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: ru
  text: 'Авраам сказал о Сарре, своей жене[a]: «Она моя сестра». Тогда Авимелех, царь Герара, послал и взял Сарру[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказал Сарре, своей жене». Еврейский предлог допускает такое буквальное понимание, однако контекст скорее указывает на то, что Авраам говорил о Сарре, поскольку далее приводятся слова: «Она моя сестра».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть Авимелех распорядился привести Сарру к нему; буквально по-еврейски: «послал и взял Сарру».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычный повествовательный эквивалент формы wayyiqtol от אמר в современном литературном русском языке.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: о Сарре, своей жене
  rationale: Хотя אֶל обычно означает «к» или «ей», здесь последующая реплика «Она моя сестра» указывает, что Авраам говорил о Сарре. Неоднозначность предлога отмечена в сноске.
- source_word: אֲחֹתִי הִוא
  choice: Она моя сестра
  rationale: Прямой и естественный перевод именного предложения; суффикс первого лица передан притяжательным местоимением «моя».
- source_word: וַיִּשְׁלַח
  choice: послал за Саррой
  rationale: В контексте подразумевается, что Авимелех послал людей привести Сарру. Русское «послал за Саррой» естественно передаёт эллиптическое еврейское выражение, не уточняя исполнителей.
- source_word: מֶלֶךְ גְּרָר
  choice: царь Герара
  rationale: Конструктивное сочетание обозначает царский титул Авимелеха и подвластный ему город.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: взял её
  rationale: לקח имеет основное значение «брать». Местоимение устраняет тяжёлый повтор имени в русском тексте, не добавляя прямо не названной цели действия.
theological_decisions:
- issue: Насколько явно передавать намерение Авимелеха
  choice: взял её
  alternative: взял её себе в жёны
  rationale: В дальнейшем контексте подразумевается намерение приобрести Сарру как жену, однако данный стих прямо этого не говорит. Сдержанный перевод сохраняет границы исходного текста и повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным синтаксисом. Перевод сохраняет лаконичность еврейского текста, а неоднозначность אֶל и подразумеваемый характер действия Авимелеха поясняет в сносках.
