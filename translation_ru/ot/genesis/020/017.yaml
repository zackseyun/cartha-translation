  - marker: b
    text: 'Буквально: «и они родили». В контексте это стало следствием Божьего исцеления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: помолился
  rationale: Hitpael глагола פלל обычно означает «молиться». Контекст подразумевает ходатайство, но сам глагол не требует уточнения «ходатайствовал».
- source_word: אֶל הָאֱלֹהִים
  choice: Богу
  rationale: Естественная русская передача направления молитвы; артикль перед אֱלֹהִים отдельно не выражается.
- source_word: וַיִּרְפָּא
  choice: исцелил
  rationale: Прямое значение רפא — «исцелять»; оно сохраняет связь с Божьим устранением поражения, не конкретизируя его сверх текста.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Авимелеха
  rationale: Стандартная русская библейская форма имени в винительном падеже.
- source_word: אִשְׁתּוֹ
  choice: его жену
  rationale: Прямая и естественная передача существительного с притяжательным суффиксом.
- source_word: אַמְהֹתָיו
  choice: его служанок
  rationale: אָמָה обозначает служанку и может подразумевать рабыню. «Служанки» естественно в современном русском, а нюанс социального положения отмечен в сноске.
- source_word: וַיֵּלֵדוּ
  choice: и они стали рожать
  rationale: Глагол ילד в данной форме означает «рожать». «Стали рожать» естественно передаёт возобновившуюся способность после исцеления, не добавляя прямого дополнения «детей».
theological_decisions:
- issue: Связь заключительного глагола с исцелением
  choice: 'Сохранить сочинительную связь: «и они стали рожать».'
  alternative: «так что они стали рожать» / «и они родили»
  rationale: Еврейское וַ допускает понимание результата в контексте, особенно с учётом следующего стиха, однако формально выражает повествовательное продолжение. Союз «и» сохраняет эту неоднозначность, а «стали» передаёт восстановление способности без превращения связи в явно целевую.
- issue: Социальный статус אַמְהֹתָיו
  choice: «его служанок» в основном тексте
  alternative: «его рабынь»
  rationale: Слово может обозначать как служанок, так и женщин, находившихся в рабском положении. Основной текст не должен чрезмерно уточнять статус; более сильная возможность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Начальное «И» сохраняет повествовательную связь еврейского текста. Формулировка избегает архаизмов и не устраняет неоднозначность между простой последовательностью и результатом.
