translation:
  language: ru
  text: И помолился Авраам Богу, и Бог исцелил Авимелеха, его жену и его служанок[a], и они родили[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабынь». Еврейское слово может обозначать женщин-рабынь или служанок.'
