base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: ru
  text: 'Авимелех не приблизился к ней[a] и сказал: «Господи, неужели Ты убьёшь даже праведный[b] народ?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «приблизиться к женщине» здесь означает вступить с ней в половую связь.
    reason: cultural_note
  - marker: b
    text: 'Или: «невиновный». Еврейское слово может указывать как на праведность, так и на невиновность в конкретном деле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: не приближался к ней
  rationale: Сохранён образ еврейского выражения «приблизиться к ней»; в данном контексте это эвфемизм, означающий, что Авимелех не вступал с Саррой в половую связь. Значение пояснено в сноске.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Форма звательного падежа естественно передаёт прямое обращение Авимелеха к Богу и не добавляет отсутствующего в еврейском тексте слова «Бог».
- source_word: גּוֹי
  choice: народ
  rationale: Слово обозначает народ как собирательное целое. В современном русском «народ» здесь звучит естественнее, чем «нация», и не сужает смысл до одного Авимелеха или только его семьи.
- source_word: גַּם
  choice: даже
  rationale: В риторическом вопросе частица усиливает возражение Авимелеха; «даже» передаёт эту эмфазу.
- source_word: צַדִּיק
  choice: праведный
  rationale: Сохранено основное библейское значение прилагательного, не устраняя возможный контекстуальный оттенок невиновности в данном деле.
- source_word: תַּהֲרֹג
  choice: неужели Ты погубишь
  rationale: «Неужели» естественно передаёт силу риторического вопроса, а «погубишь» подходит для угрозы гибели целому народу. Будущее время сохраняет направленность несовершенного вида на предполагаемое действие.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: Авимелех ... и сказал
  rationale: Последовательность повествования передана простым русским союзом без добавления отсутствующего временного наречия вроде «теперь».
theological_decisions:
- issue: Корпоративный охват слова גּוֹי в мольбе Авимелеха
  choice: «народ» — собирательное обозначение общности, которой угрожает суд
  alternative: «нация» или более узкое «дом Авимелеха»
  rationale: Еврейский текст говорит о коллективе и не ограничивает угрозу одним царём; вместе с тем он не уточняет политический масштаб этой общности.
- issue: Значение צַדִּיק применительно к народу
  choice: «праведный»
  alternative: «невиновный»
  rationale: «Праведный» сохраняет более широкий смысл исходного слова и богословское напряжение вопроса. Контекст допускает оттенок невиновности именно в этом деле, но перевод не сводит значение только к юридической невиновности.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Сохранён еврейский эвфемизм, но он пояснён читателю; риторическая сила вопроса передана словом «неужели». Местоимение «Ты» при обращении к Богу написано с прописной буквы согласно принятой русской библейской традиции.
