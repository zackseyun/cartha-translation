  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: ru
  text: 'К тому же[a], она и вправду моя сестра: она дочь моего отца, но не дочь моей матери; и она стала моей женой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «И также, поистине, она моя сестра — дочь моего отца, но не дочь моей матери».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: К тому же
  rationale: Сочетание союза с усилительно-присоединительной частицей вводит дополнительный довод Авраама; «к тому же» естественно передаёт эту функцию в современной русской речи.
- source_word: אָמְנָה
  choice: и вправду
  rationale: Наречие подтверждает истинность сказанного. «И вправду» сохраняет усиление и звучит естественно в объяснительной речи.
- source_word: אֲחֹתִי
  choice: моя сестра
  rationale: Прямое соответствие термину родства с суффиксом первого лица единственного числа.
- source_word: בַת אָבִי
  choice: дочь моего отца
  rationale: Приложение поясняет, в каком смысле Сарра является сестрой Авраама, и сохраняет параллелизм со следующим уточнением.
- source_word: הִוא
  choice: она
  rationale: Самостоятельное местоимение выступает в именном предложении; настоящее время естественно выражено русской конструкцией без связки.
- source_word: אַךְ לֹא
  choice: но не
  rationale: 'Частица вводит ограничивающее противопоставление: родство по отцу, но не по матери.'
- source_word: בַת אִמִּי
  choice: дочь моей матери
  rationale: Формулировка сохраняет структуру и параллелизм еврейского текста.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: и она стала моей женой
  rationale: Конструкция с היה и двумя предлогами ל обозначает вступление в брачные отношения; «стала моей женой» сохраняет событийное значение.
