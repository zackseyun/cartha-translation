lexical_decisions:
- source_word: וַיִּסַּע
  choice: отправился
  rationale: Глагол נסע в повествовательной форме обозначает выступление в путь или перемещение; «отправился» естественно передаёт начало движения.
- source_word: מִשָּׁם
  choice: Оттуда
  rationale: Краткое и естественное указание на прежнее местонахождение Авраама.
- source_word: אַרְצָה הַנֶּגֶב
  choice: к Негеву
  rationale: Направительное окончание в אַרְצָה указывает на движение в сторону области; הַנֶּגֶב, вероятнее всего, служит географическим названием, хотя допускает значение движения на юг.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: ישב здесь означает проживание или обоснование в местности; «поселился» естественно сочетается с последующим географическим уточнением.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: между Кадесом и Шуром
  rationale: Прямое обозначение местности между двумя географическими пунктами; названия переданы в принятой русской библейской форме.
- source_word: וַיָּגָר
  choice: жил как пришелец
  rationale: גור обозначает проживание в качестве чужеземца или временного жителя; эта формулировка сохраняет смысловой оттенок лучше, чем простое «жил».
- source_word: בִּגְרָר
  choice: в Гераре
  rationale: Естественная передача местного значения предлога ב с географическим названием.
