lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит объяснение того, о чём сказано в предыдущем стихе; причинная связь естественно передаётся словами «потому что».
- source_word: עָצֹר עָצַר
  choice: совсем заключил
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие. «Совсем заключил» передаёт как образ закрытого чрева, так и эмфатический характер конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: всякое чрево в доме Авимелеха
  rationale: «Чрево» сохраняет конкретный телесный образ, а «дом» здесь обозначает домашних Авимелеха, то есть его домочадцев, а не только здание.
- source_word: עַל דְּבַר
  choice: из-за
  rationale: Оборот указывает причину постигшего дом Авимелеха бедствия.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: жены Авраама
  rationale: Естественно передаёт конструкцию принадлежности и уточняет личность Сарры.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Характер Божьего воздействия на дом Авимелеха
  choice: совсем заключил всякое чрево
  alternative: сделал всех женщин бесплодными
  rationale: Сохранён конкретный образ исходного текста и его усиление без расширительного толкования того, кого именно охватило действие.
