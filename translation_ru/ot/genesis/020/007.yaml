  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: ru
  text: 'Итак, верни жену этому человеку, потому что он пророк: он помолится за тебя, и ты останешься жив. Если же не вернёшь её, знай: ты непременно умрёшь — и ты, и все твои[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё твоё» / «и всё, что у тебя». Еврейское выражение широкое и может охватывать как домашних Авимелеха, так и всё, что ему принадлежит.'
    reason: Лексическая неоднозначность выражения כָל אֲשֶׁר לָךְ.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Связующий маркер вводит настоятельное повеление как вывод из предшествующего откровения; «итак» естественно передаёт переход и логическое следствие.
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  choice: верни жену этому человеку
  rationale: Каузативная форма שוב означает возвращение тому, кому она принадлежит по браку; указательное «этому» естественно отсылает к уже упомянутому Аврааму, не заменяя существительное местоимением.
- source_word: כִּי נָבִיא הוּא
  choice: потому что он пророк
  rationale: כִּי вводит основание повеления; прямой порядок слов звучит естественно в современном русском языке.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: он помолится за тебя
  rationale: Форма yiqtol здесь обозначает ожидаемое последующее действие, а בְּעַד указывает на молитву в пользу Авимелеха.
- source_word: וֶחְיֵה
  choice: и ты останешься жив
  rationale: Формально повелительная форма в этой последовательности выражает результат молитвы. Русская конструкция передаёт обещанный исход без неестественного «и живи».
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Если же не вернёшь её
  rationale: Отрицание с причастием описывает отказ совершить требуемое действие; объект «её» ясно восстанавливается из контекста.
- source_word: דַּע כִּי מוֹת תָּמוּת
  choice: 'знай: ты непременно умрёшь'
  rationale: Императив ידע вводит торжественное предупреждение, а инфинитив абсолютный с личной формой усиливает несомненность смерти.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: и ты, и все твои
  rationale: Фраза намеренно остаётся широкой и в данном контексте прежде всего допускает членов дома и зависимых людей; краткое «все твои» сохраняет личностную направленность и требует пояснения о возможном более широком охвате.
theological_decisions:
- issue: Объём угрозы в выражении אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: «и ты, и все твои» с примечанием о широте выражения
  alternative: «ты и всё, что у тебя» / «ты и всё твоё»
  rationale: Контекст суда над домом Авимелеха позволяет прежде всего слышать указание на принадлежащих к его дому людей, но грамматика не исключает всего ему принадлежащего. Примечание сохраняет эту неоднозначность.
- issue: Связь молитвы пророка с жизнью Авимелеха
  choice: 'Передать как ожидаемую последовательность: «он помолится… и ты останешься жив»'
  alternative: «чтобы он помолился… и ты жил»
  rationale: Текст связывает возвращение Сарры, молитву Авраама и сохранение жизни, но не формулирует отвлечённого учения о посредничестве; перевод сохраняет конкретную повествовательную связь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; усиление מוֹת תָּמוּת передано словом «непременно», а подлинная широта заключительной фразы сохранена посредством сноски.
