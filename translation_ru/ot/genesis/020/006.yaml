  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: ru
  text: 'И сказал ему Бог во сне[a]: «Да, Я знаю, что ты сделал это с чистым сердцем. И Я удержал тебя от греха против Меня, поэтому не позволил тебе прикоснуться к ней[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение допускает понимание «во сне» или, с учётом артикля и контекста, «в этом сне».
    reason: lexical_alternative
  - marker: b
    text: «Прикоснуться к ней» — сдержанное выражение, означающее здесь вступить с ней в половые отношения.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹום
  choice: во сне
  rationale: Русский язык не выражает определённость артиклем; «во сне» естественно обозначает тот сон, в котором Бог уже обращается к Авимелеху.
- source_word: גַּם אָנֹכִי יָדַעְתִּי
  choice: Да, Я знаю
  rationale: Первое גַּם אָנֹכִי имеет подтверждающе-усилительное значение; настоящее время естественно передаёт признание Богом намерения Авимелеха в прямой речи.
- source_word: בְתָם לְבָבְךָ
  choice: с чистым сердцем
  rationale: תֹּם обозначает цельность, честность и нравственную чистоту; выражение звучит естественно по-русски и не превращает слова Бога в формальное судебное оправдание.
- source_word: וָאֶחְשֹׂךְ גַּם אָנֹכִי אֹתְךָ
  choice: Я и Сам удержал тебя
  rationale: חָשַׂךְ здесь означает удержать или не допустить действия; «и Сам» сохраняет повторное усиление גַּם אָנֹכִי.
- source_word: מֵחֲטוֹא לִי
  choice: от греха против Меня
  rationale: Конструкция с מִן выражает предотвращение действия, а לִי представляет предполагаемый поступок как грех против Бога.
- source_word: עַל כֵּן לֹא נְתַתִּיךָ
  choice: поэтому не позволил тебе
  rationale: נָתַן с инфинитивом имеет здесь идиоматическое значение разрешения или допущения; עַל כֵּן вводит следствие Божьего удерживающего действия.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: прикоснуться к ней
  rationale: Сохранено сдержанное выражение исходного текста, которое в данном контексте подразумевает половую близость.
theological_decisions:
- issue: Смысл слов «греха против Меня» в речи Бога
  choice: Предполагаемый поступок прямо назван грехом против Бога.
  alternative: Понимать выражение лишь как причинение Богу обиды или как возникновение вины перед Ним.
  rationale: Еврейское לִי указывает на Бога как на Того, против Кого в конечном счёте был бы совершён грех; перевод сохраняет это прямое богословское утверждение, не отрицая вреда, который был бы причинён людям.
- issue: Соотношение чистоты намерений Авимелеха и Божьего удержания
  choice: 'Сохранены оба утверждения: Авимелех действовал с чистым сердцем, однако от греха его удержал Бог.'
  alternative: Объяснить чистоту его сердца исключительно Божьим вмешательством либо представить её как независимую заслугу Авимелеха.
  rationale: Текст ставит рядом человеческое намерение и Божье предотвращающее действие, не разъясняя полностью их соотношение; перевод не снимает этого напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Синтаксис упрощён до естественного русского порядка слов, при этом сохранены повторное усиление, причинно-следственная связь и сдержанный эвфемизм оригинала.
