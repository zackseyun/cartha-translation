base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: ru
  text: 'Разве не он сам сказал мне: «Она моя сестра»? И она сама тоже сказала: «Он мой брат». Я сделал это с искренним сердцем и чистыми руками[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в цельности моего сердца и в чистоте моих рук». Это древнееврейские нравственно-правовые образы, обозначающие искренность намерения и невиновность в поступке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественной современной русской конструкцией.
- source_word: הוּא
  choice: он сам
  rationale: Самостоятельное местоимение имеет усилительную функцию; частица «сам» сохраняет этот акцент.
- source_word: אָמַר לִי
  choice: сказал мне
  rationale: Прямо и естественно передаёт אמר с местоименным дополнением, не добавляя оттенков, которых нет в исходном тексте.
- source_word: אֲחֹתִי הִוא
  choice: Она моя сестра
  rationale: Естественная русская именная конструкция настоящего времени точно передаёт утверждение о родстве.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: И она сама тоже сказала
  rationale: «Сама» передаёт усиление самостоятельным местоимением, а «тоже» — добавочное значение גם.
- source_word: אָחִי הוּא
  choice: Он мой брат
  rationale: Прямая и естественная передача еврейского утверждения о родстве.
- source_word: בְּתָם לְבָבִי
  choice: с искренним сердцем
  rationale: תָּם здесь указывает на цельность и честность намерения. Формулировка передаёт нравственный смысл идиомы, не превращая слова Авимелеха в заявление об абсолютной безгрешности.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: и чистыми руками
  rationale: Сохраняет еврейский образ чистых рук как обозначение невиновности в поступке и остаётся понятным русскому читателю.
- source_word: עָשִׂיתִי זֹאת
  choice: Я сделал это
  rationale: Простое прошедшее время естественно передаёт завершённое действие в непосредственном оправдании Авимелеха.
theological_decisions:
- issue: Нравственно-правовая идиома в самооправдании Авимелеха
  choice: «с искренним сердцем и чистыми руками» — заявление о честности намерения и невиновности в данном поступке
  alternative: «в непорочности сердца моего и невинности рук моих»
  rationale: Контекст ограничивает заявление Авимелеха данным поступком. Перевод сохраняет напряжение его обращения к Богу, но не приписывает ему утверждения о полной нравственной безупречности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общепонятным библейским звучанием. Усиления «он сам» и «она сама тоже» сохранены; парная идиома передана естественно, без устранения её нравственно-правового смысла.
