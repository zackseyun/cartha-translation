base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: ru
  text: 'А Сарре он сказал: «Вот, я дал твоему брату тысячу единиц серебра[a]. Вот, это тебе — покров для глаз[b] для всех, кто с тобой; и перед всеми ты оправдана[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тысячу серебра». Единица веса или денежная единица в еврейском тексте не названа; возможно, подразумеваются шекели.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «покров для глаз». Вероятно, имеется в виду публичное возмещение, которое покрывает нанесённую обиду и восстанавливает честь Сарры.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможные переводы: «ты очищена от обвинения», «дело улажено перед всеми» или «тебе сделано внушение». Заключительная еврейская фраза трудна для истолкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: тысячу шекелей серебра
  rationale: 'Буквально: «тысячу серебра»; единица веса не названа, но в таком денежно-весовом контексте обычно подразумеваются шекели. В русском тексте единица выражена для ясности, а буквальная неопределённость отмечена в сноске.'
- source_word: לְאָחִיךְ
  choice: твоему брату
  rationale: Сохранено буквальное «брату», поскольку оно отсылает к тому, как Авраам и Сарра представили свои отношения, и сохраняет повествовательную иронию.
- source_word: כְּסוּת עֵינַיִם
  choice: покровом для глаз
  rationale: Сохранён трудный древнееврейский образ без сведения его к одному толкованию. По контексту дар, вероятно, публично покрывает нанесённый ущерб и восстанавливает честь Сарры.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: перед всеми, кто с тобой
  rationale: Предлог לְ допускает более буквальное «для всех», однако «перед всеми» естественно передаёт публичный характер жеста в данном контексте.
- source_word: וְאֵת כֹּל
  choice: и перед всеми
  rationale: Сжатая и трудная конструкция понята как расширение круга свидетелей от спутников Сарры до всех вообще.
- source_word: וְנֹכָחַת
  choice: ты оправдана
  rationale: Форма от יכח передана в смысле публичного оправдания или снятия обвинения. Альтернативное понимание «ты получила вразумление/упрёк» оставлено в сноске из-за сложности формы и синтаксиса.
theological_decisions:
- issue: Публичный статус Сарры в заключительной фразе
  choice: ты оправдана
  alternative: ты получила вразумление / дело улажено
  rationale: Контекст выплаты и публичного признания благоприятствует смыслу оправдания, но грамматика допускает иные понимания; неоднозначность не превращена в богословское утверждение и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «вот» сохранён как элемент прямой речи, но второе הִנֵּה естественно передано конструкцией «пусть это будет». Трудная метафора сохранена в основном тексте и пояснена в сноске.
