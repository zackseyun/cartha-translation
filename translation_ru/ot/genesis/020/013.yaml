base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: ru
  text: 'Когда Бог повёл меня странствовать из дома моего отца[a], я сказал ей: «Вот какую доброту[b] ты должна проявить ко мне: куда бы мы ни пришли, говори обо мне: „Он мой брат“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставил меня скитаться»; возможен и более резкий перевод: «увёл меня с пути». Еврейский глагол имеет каузативную форму и может обозначать странствие или уклонение с пути; здесь речь не обязательно идёт о нравственном заблуждении.'
    reason: lexical_alternative
  - marker: b
    text: «Доброта» передаёт еврейское хесед, которое в зависимости от контекста может также означать верную любовь, преданность или неизменную доброту.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: повёл меня странствовать
  rationale: Передаёт каузативное значение породы hифиль глагола תעה — Бог стал причиной странствий Авраама, — но не вносит не обязательного здесь смысла нравственного заблуждения.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, контекст указывает на единого Бога Авраама; форма глагола также допускает такое согласование с אֱלֹהִים.
- source_word: מִבֵּית אָבִי
  choice: вдали от дома моего отца
  rationale: Выражение обозначает удаление из отцовского дома, то есть из родной семьи и домашнего уклада. «Вдали от» естественно сочетается по-русски со «странствовать» и сохраняет исходную точку движения.
- source_word: חַסְדֵּךְ
  choice: милость
  rationale: В этой личной просьбе חֶסֶד означает доброе, верное расположение, проявленное поступком. «Милость» сохраняет ёмкость понятия и достойный библейский регистр.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: ты окажешь мне
  rationale: Естественное русское сочетание с существительным «милость», передающее буквально выраженную просьбу совершить это по отношению к Аврааму.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: куда бы мы ни пришли
  rationale: 'Естественно передаёт распределительный смысл: в каждом месте, куда они прибудут.'
- source_word: אִמְרִי לִי
  choice: говори обо мне
  rationale: Дательный компонент לִי в контексте обозначает речь в отношении Авраама; «обо мне» ясно передаёт адресатам содержание требуемого заявления.
- source_word: אָחִי הוּא
  choice: Он мой брат
  rationale: Сохраняет прямое и сюжетно значимое утверждение о брате без обобщения до «родственника».
theological_decisions:
- issue: Божественная причинность странствий Авраама
  choice: Бог повёл Авраама странствовать
  alternative: Бог допустил странствия Авраама; боги заставили Авраама скитаться
  rationale: Еврейский текст называет אֱלֹהִים грамматическим субъектом каузативного глагола. Перевод не смягчает это до простого позволения, но и не приписывает Богу введение Авраама в нравственное заблуждение. Контекст поддерживает единственное число «Бог».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для устной речи Авраама; сохранены божественная причинность и смысловая широта слова חֶסֶד.
