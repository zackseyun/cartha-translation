lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Естественно передаёт указательное привлечение внимания и сохраняет достоинство речи.
- source_word: אַרְצִי לְפָנֶיךָ
  choice: моя земля перед тобой
  rationale: Сохраняет образ и смысл открытого доступа к земле без лишнего истолкования.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: там, где тебе угодно
  rationale: Идиоматично передаёт буквальное «в [месте], хорошем в твоих глазах», то есть свободный выбор подходящего места.
- source_word: שֵׁב
  choice: поселись
  rationale: В данном контексте повелительная форма ישב означает обосноваться или жить в выбранном месте, а не просто сесть.
