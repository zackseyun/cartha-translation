base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: ru
  text: 'Но Бог явился Авимелеху во сне ночью и сказал ему: «Вот, ты умрёшь[a] из-за женщины, которую ты взял, потому что она замужем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вот, ты мёртв»; выражение означает несомненную и близкую смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычное повествовательное значение глагола בוא; речь о явлении во сне, поэтому более конкретное «вошёл» было бы неоправданным.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: ночью во сне
  rationale: Естественная русская передача ночного сновидения, сохраняющая оба элемента еврейского выражения.
- source_word: הִנְּךָ מֵת
  choice: вот, ты умрёшь
  rationale: Конструкция выражает несомненную и близкую смерть; русский футурум естественно передаёт силу угрозы, а буквальная альтернатива отмечена в сноске.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: из-за женщины, которую взял
  rationale: עַל указывает на причину приговора, а לקח не требует добавления насильственного оттенка.
- source_word: בְּעֻלַת בָּעַל
  choice: она замужем
  rationale: Идиоматично выражает наличие у женщины мужа и её существующий брачный союз, не воспроизводя неестественную для русского языка этимологическую избыточность.
theological_decisions:
- issue: Временная и модальная сила הִנְּךָ מֵת
  choice: ты умрёшь
  alternative: ты мёртв / ты покойник
  rationale: Еврейская форма оставляет напряжение между формальным настоящим состоянием и неизбежным близким исходом. В основном тексте выбран естественный русский приговор-угроза, а более буквальная форма сохранена в сноске.
- issue: Смысл בְּעֻלַת בָּעַל
  choice: она замужем
  alternative: у неё есть муж / она принадлежит мужу
  rationale: Выбор ясно передаёт брачный статус, не внося сверх текста идеи собственности и не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; речь Бога передана кратко и торжественно без архаизмов. Маркер сноски поставлен после всего стиха.
