  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: ru
  text: 'Тогда Авимелех призвал Авраама и сказал ему: «Что ты с нами сделал? Чем я согрешил против тебя, что ты навлёк на меня и на моё царство тяжкий грех? Ты сделал со мной то, чего не делают».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: Авимелех призвал Авраама
  rationale: Глагол קרא с לְ при обозначении лица допускает значение вызова или призыва; «призвал» естественно передаёт, что царь велел Аврааму явиться, не усиливая официальный оттенок до «приказал привести».
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: Что ты с нами сделал?
  rationale: Прямой и естественный русский вопрос, сохраняющий обвинительный тон и направленность действия против говорящего и его людей.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: Чем я согрешил против тебя
  rationale: В данном сочетании מֶה естественно передаётся русским «чем», а חטא сохраняет нравственную силу в переводе «согрешил», не сводясь к более нейтральному «провинился».
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит содержание и следствие предполагаемой вины Авимелеха: чем он согрешил, что Авраам навёл такое бедствие.'
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: ты навёл на меня и на моё царство
  rationale: Каузативная форма בוא обозначает причинение того, что нечто постигает человека; русское «навёл ... грех» сохраняет образ наступившей на царя и царство ответственности.
- source_word: חֲטָאָה גְדֹלָה
  choice: великий грех
  rationale: Сочетание обозначает тяжкий нравственный проступок и связанную с ним виновность; «великий грех» сохраняет библейскую этическую весомость без пояснительного расширения.
- source_word: מַמְלַכְתִּי
  choice: моё царство
  rationale: «Царство» — точный и общеупотребительный русский эквивалент владения и политической области царя.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ עָשִׂיתָ עִמָּדִי
  choice: Ты поступил со мной так, как поступать не следует
  rationale: Русская формулировка естественно передаёт нормативный смысл безлично-пассивного выражения «дела, которые не делаются / не должны делаться» и идиому עשה עם — «поступать с кем-либо».
theological_decisions:
- issue: Значение חֲטָאָה в выражении о царе и царстве
  choice: великий грех
  alternative: великая вина; тяжкое преступление
  rationale: «Грех» сохраняет религиозно-нравственное измерение исходного слова. Контекст допускает также оттенок навлечённой вины, но перевод не должен устранять напряжение между самим проступком и его последствиями.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Синтаксис сделан естественным для устного обвинения; архаизмы и конфессионально специфические формулы не использованы.
