base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: ru
  text: 'Авраам ответил: «Потому что я сказал: „Наверняка в этом месте нет страха Божьего[a], и меня убьют из-за моей жены“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговения перед Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Я сказал себе
  rationale: כִּי вводит объяснение Авраама. В русском прямая передача «потому что я сказал» здесь тяжеловесна; причинная связь естественно выражена всей последующей репликой.
- source_word: אָמַרְתִּי
  choice: я сказал себе
  rationale: Сохранено основное значение глагола «сказать», а местоимение «себе» ясно передаёт подразумеваемое внутреннее рассуждение.
- source_word: רַק
  choice: несомненно
  rationale: В данном контексте частица усиливает уверенность Авраама в своём предположении; «несомненно» естественно передаёт эту эмфатическую функцию.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: нет страха Божьего
  rationale: Сохранён библейский оборот и его нравственно-религиозная весомость; возможное значение благоговения отмечено в сноске.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: в этом месте
  rationale: Точная и естественная передача указательного обстоятельственного оборота без необоснованного расширения до «области».
- source_word: וַהֲרָגוּנִי
  choice: и меня убьют
  rationale: Передаёт ожидаемое Авраамом следствие и сохраняет сочинительную связь еврейского текста.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: из-за моей жены
  rationale: 'Современная и ясная передача идиомы со значением причины: Авраам опасался, что его убьют, чтобы завладеть его женой.'
theological_decisions:
- issue: Передача יִרְאַת אֱלֹהִים
  choice: страх Божий
  alternative: благоговение перед Богом
  rationale: Основной текст сохраняет буквальный и канонически значимый образ страха Божьего, не сводя его только к эмоциональному страху и не заменяя более узким толкованием; семантическая возможность благоговения указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Вложенная прямая речь показывает внутреннее рассуждение Авраама; архаизмы и конфессионально окрашенные уточнения не используются.
