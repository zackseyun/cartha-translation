  text: וַ/יַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּ/בֹּ֗קֶר וַ/יִּקְרָא֙ לְ/כָל עֲבָדָ֔י/ו וַ/יְדַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/אָזְנֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/אֲנָשִׁ֖ים מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: ru
  text: Авимелех встал рано утром, созвал всех своих слуг[a] и рассказал им обо всём этом; и эти люди очень испугались[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал к себе всех своих слуг».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «и люди весьма устрашились».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: встал рано утром
  rationale: Передаёт обычное значение конструкции «встать рано» и естественно воспроизводит еврейский временной оборот.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: созвал всех своих слуг
  rationale: Глагол קרא с предлогом ל здесь означает призыв или созыв, а עֲבָדָיו в контексте царского двора естественно обозначает слуг или приближённых без обязательного акцента на рабском статусе.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם
  choice: рассказал им обо всём этом
  rationale: Оборот буквально говорит о произнесении «всех этих слов в их уши», то есть о сообщении всего этого им лично; русский вариант передаёт смысл идиомы без буквализма.
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  choice: эти люди очень испугались
  rationale: В данном контексте ירא выражает сильный страх, а указательное «эти» естественно связывает הָאֲנָשִׁים с только что упомянутыми слугами. «Люди» сохраняет референцию к группе мужчин, не создавая неестественного повтора слова «мужчины».
theological_decisions: []
