base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: ru
  text: Тогда Авимелех взял мелкий скот[a] и крупный скот, рабов и рабынь[b] и отдал всё это Аврааму, а затем возвратил ему Сарру, жену Авраама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает мелкий домашний скот собирательно и может включать овец и коз.
    reason: lexical_alternative
  - marker: b
    text: Еврейские слова могут в иных контекстах означать также слуг и служанок; здесь передача людей вместе со скотом указывает на рабский статус.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямое соответствие обычному значению לקח; сохраняет последовательность повествования, не добавляя отсутствующего в тексте оттенка «привёл» или «велел привести».
- source_word: צֹאן
  choice: мелкий скот
  rationale: Собирательное обозначение овец и коз; точнее одного слова «овцы» и естественно сочетается с последующим обозначением крупного скота.
- source_word: בָקָר
  choice: крупный скот
  rationale: Обозначает крупный рогатый скот как собирательную категорию; в паре с צֹאן по-русски естественна формула «мелкий и крупный скот».
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: рабов и рабынь
  rationale: Контекст передачи людей вместе со скотом указывает на несвободный статус; перевод сохраняет также выраженное в еврейском тексте различие по полу.
- source_word: וַיִּתֵּן
  choice: отдал всё это
  rationale: Глагол значит «дал»; слова «всё это» естественно отсылают ко всему предшествующему перечню и не меняют смысла.
- source_word: וַיָּשֶׁב
  choice: возвратил
  rationale: Порода hифиль от שוב имеет каузативный смысл «вернул, возвратил».
- source_word: אֵת שָׂרָה אִשְׁתּוֹ
  choice: Сарру, его жену
  rationale: Приложение сообщает, что Сарра — жена Авраама; русский порядок слов сохраняет эту связь без лишнего повторения имени.
