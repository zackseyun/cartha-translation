base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: ru
  text: А то, что сон дважды повторился фараону, объясняется тем, что это дело твёрдо установлено Богом[a] и Бог спешит осуществить его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это дело определено Богом» или «это дело исходит от Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог вскоре совершит это» или «Бог вот-вот совершит это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: А то, что
  rationale: Естественно вводит пояснение причины двукратного сна, сохраняя связь с предшествующей речью.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: сон повторился
  rationale: Передаёт пассивное значение инфинитивной конструкции современным и ясным русским выражением.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: фараону дважды
  rationale: Сохраняет адресата сна и значение двойственного числительного.
- source_word: כִּי
  choice: означает, что
  rationale: В данном контексте вводит объяснение значения повторения; такой оборот естественнее буквального «потому что» после начальной конструкции.
- source_word: נָכוֹן הַדָּבָר
  choice: это дело твёрдо установлено
  rationale: Передаёт устойчивость, решённость и несомненность предсказанного, не сужая דָּבָר до одного лишь «слова».
- source_word: מֵעִם הָאֱלֹהִים
  choice: Богом
  rationale: Выражает исходящую от Бога определённость решения; альтернативное более буквальное понимание отмечено в сноске.
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: и Бог спешит
  rationale: Сохраняет причастную форму и оттенок близкого, быстро наступающего действия.
- source_word: לַעֲשֹׂתוֹ
  choice: осуществить его
  rationale: Местоимение отсылает к «делу», а «осуществить» естественно передаёт совершение предсказанного события.
theological_decisions:
- issue: Значение הָאֱלֹהִים в объяснении Иосифа
  choice: Бог
  alternative: боги
  rationale: Несмотря на морфологически множественную форму существительного, синтаксис и контекст указывают на единственного Бога, открывающего будущее Иосифу.
- issue: Характер определённости предсказанного
  choice: это дело твёрдо установлено Богом
  alternative: это дело исходит от Бога / это дело решено у Бога
  rationale: Перевод сохраняет утверждение о твёрдой божественной определённости события, не уточняя сверх текста механизм божественного действия.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Формулировка близка к структуре древнееврейского текста, но избегает архаизмов; повтор слова «Бог» сохранён ради исходного акцента.
