base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: ru
  text: А второго он назвал Ефремом[a], потому что Бог сделал меня плодовитым в земле моего страдания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Ефрем» связано с еврейским выражением «сделал меня плодовитым».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: А второго он назвал
  rationale: Еврейская конструкция буквально говорит об имени второго сына; по-русски естественно передать её как акт наречения. Союз וְ передан как «А», отмечая переход ко второму сыну.
- source_word: אֶפְרָיִם
  choice: Ефремом
  rationale: Использована устоявшаяся русская библейская форма имени; творительный падеж обусловлен глаголом «назвал».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит данное Иосифом объяснение имени.
- source_word: הִפְרַנִי
  choice: сделал меня плодовитым
  rationale: Порода hифиль глагола פרה означает «сделать плодовитым, дать плодиться». Формулировка сохраняет образ плодородия и связь с именем Ефрем, не сужая смысл до материального преуспевания.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму существительного, контекст и синтаксис указывают на единственного Бога.
- source_word: בְּאֶרֶץ עָנְיִי
  choice: в земле моего страдания
  rationale: «Земля» точно передаёт אֶרֶץ, а «страдание» естественно и достаточно широко выражает עֳנִי — бедствие, угнетение или мучительный жизненный опыт.
theological_decisions:
- issue: Соотношение Божьего благословения и страдания Иосифа в Египте
  choice: Сохранено одновременное утверждение, что Бог сделал Иосифа плодовитым и что эта земля была землёй его страдания.
  alternative: Ограничить «страдание» только прежними испытаниями либо истолковать его исключительно как разлуку с семьёй.
  rationale: Текст не уточняет пределы страдания Иосифа; перевод сохраняет заложенное в стихе напряжение и не навязывает более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; традиционная форма имени сочетается с естественным синтаксисом.
