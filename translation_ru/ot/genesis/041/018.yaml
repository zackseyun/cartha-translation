translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «И вот» сохраняет наглядность рассказа о сне; устаревшие «пажить» и «злачные» намеренно не используются. Синтаксис остаётся ясным и ритмичным, а примечания сохраняют существенные лексические альтернативы.
