  text: И вот, из Нила[a] поднимались семь коров, крепких телом[b] и красивых на вид; они паслись среди болотной травы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный буквальный перевод: «из реки»; в египетском контексте под ней естественнее всего понимать Нил.'
