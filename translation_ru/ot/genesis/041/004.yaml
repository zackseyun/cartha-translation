  text: וַ/תֹּאכַ֣לְנָה הַ/פָּר֗וֹת רָע֤וֹת הַ/מַּרְאֶה֙ וְ/דַקֹּ֣ת הַ/בָּשָׂ֔ר אֵ֚ת שֶׁ֣בַע הַ/פָּר֔וֹת יְפֹ֥ת הַ/מַּרְאֶ֖ה וְ/הַ/בְּרִיאֹ֑ת וַ/יִּיקַ֖ץ פַּרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: ru
  text: Тогда коровы, безобразные на вид и тощие телом, съели семь коров, красивых на вид и тучных[a]. И фараон проснулся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плохих на вид и здоровых»; еврейские слова допускают более буквальный перевод «плохие» и «здоровые, упитанные», но контекст указывает на телесное противопоставление безобразных и тощих коров красивым и тучным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: Тогда ... съели
  rationale: Форма wayyiqtol женского рода множественного числа от אכל продолжает последовательность событий во сне. «Съели» передаёт обычное значение глагола, не усиливая его до «пожрали».
- source_word: הַפָּרוֹת
  choice: коровы
  rationale: Форма женского рода множественного числа прямо обозначает коров, а не скот вообще.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: безобразные на вид
  rationale: Прилагательное רעות буквально означает «плохие», но в сочетании со словом «вид» описывает непривлекательную внешность. Формулировка сохраняет конструкцию оригинала и естественна по-русски.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: и тощие телом
  rationale: Буквально выражение говорит о «тонкости плоти». «Тощие телом» естественно и наглядно передаёт крайнюю худобу, сохраняя телесный образ.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: семь коров
  rationale: Прямое дополнение с числительным передано без добавлений.
- source_word: יְפֹת הַמַּרְאֶה
  choice: красивых на вид
  rationale: Формулировка сохраняет параллелизм и прямой контраст с «безобразными на вид».
- source_word: וְהַבְּרִיאֹת
  choice: и тучных
  rationale: בְּרִיאֹת может означать «здоровые», «упитанные» или «тучные». В противопоставлении тощим коровам конкретное обозначение полноты наиболее уместно; «тучных» соответствует достоинству библейского повествования.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: И фараон проснулся
  rationale: Глагол означает пробуждение ото сна. Отдельное предложение естественно завершает сцену и сохраняет повествовательный переход.
