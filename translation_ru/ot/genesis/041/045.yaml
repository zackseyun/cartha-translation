  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: ru
  text: Фараон дал Иосифу имя Цафнат-Панеах[a] и отдал ему в жёны Асенефу, дочь Потиферы, жреца из города Он[b]. И Иосиф отправился по земле Египта[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Египетское имя; его точное значение неизвестно, и предлагаются разные толкования. Возможна также передача: «Цафнат-Паанеах».'
    reason: lexical_alternative
  - marker: b
    text: Он — египетский город, позднее известный под греческим названием Гелиополь.
    reason: cultural_note
  - marker: c
    text: 'Или: «по всей земле Египта». Еврейское выражение может обозначать движение по стране; возможен также оттенок действия в пределах территории, над которой Иосиф получил власть.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה שֵׁם יוֹסֵף
  choice: Фараон дал Иосифу имя
  rationale: Еврейская конструкция буквально означает «назвал имя Иосифа», то есть совершил официальное наречение. По-русски «дал Иосифу имя» естественно и ясно передаёт этот смысл.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Цафна́т-Панеа́х
  rationale: Египетское имя передано транслитерацией, поскольку его значение и этимология остаются неопределёнными; дефис отражает двухчастную форму в еврейском тексте.
- source_word: וַיִּתֶּן לוֹ אֶת אָסְנַת ... לְאִשָּׁה
  choice: отдал ему в жёны Асенефу
  rationale: Оборот לְאִשָּׁה обозначает заключение брака. Такая формулировка естественна для современного литературного русского языка и сохраняет инициативу фараона.
- source_word: אָסְנַת
  choice: Асенефу
  rationale: Использована укоренившаяся русская библейская форма имени Асенефа, поставленная в винительном падеже.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: дочь Поти-Фера
  rationale: Родственная связь передана прямо; имя транслитерировано с учётом его двухчастного написания в масоретском тексте.
- source_word: כֹּהֵן אֹן
  choice: жреца Она
  rationale: В египетском языческом контексте כֹּהֵן естественно передаётся словом «жрец», а название города Он сохраняется в форме еврейского текста.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: И Иосиф отправился по всей земле Египетской
  rationale: «Отправился» передаёт יצא в данном повествовательном контексте, а «по всей земле» естественно выражает движение по территории, обозначенное עַל, не исключая связи с новой властью Иосифа.
theological_decisions:
- issue: Характер передвижения Иосифа по Египту
  choice: отправился по всей земле Египетской
  alternative: вышел над землёй Египетской / объехал всю землю Египетскую
  rationale: Предлог עַל допускает пространственный оттенок движения по территории и возможный оттенок власти над ней. Основной текст передаёт прежде всего естественный контекстуальный смысл путешествия, а примечание отмечает допустимую менее определённую передачу.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской окраской. Сохранены привычные русскому читателю формы «Асенефа» и «земля Египетская», тогда как неясное египетское имя не переводится. Синтаксис сделан естественным без буквального воспроизведения неидиоматичного оборота «назвал имя Иосифа».
