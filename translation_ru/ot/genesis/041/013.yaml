  text: וַ/יְהִ֛י כַּ/אֲשֶׁ֥ר פָּֽתַר לָ֖/נוּ כֵּ֣ן הָיָ֑ה אֹתִ֛/י הֵשִׁ֥יב עַל כַּנִּ֖/י וְ/אֹת֥/וֹ תָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: ru
  text: 'И как он истолковал нам, так и случилось: меня фараон вернул на мою должность[a], а того повесил[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вернул на моё место»; речь идёт о восстановлении в прежней должности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подвесил». Еврейский глагол сам по себе может обозначать как казнь через повешение, так и вывешивание тела после смерти; здесь способ не уточняется.'
    reason: genuine_ambiguity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר... כֵּן הָיָה
  choice: И как… так и случилось
  rationale: Естественная русская конструкция точно передаёт соответствие предсказанного исхода истолкованию и избегает тяжеловесного повтора глагола «быть».
- source_word: פָּתַר לָנוּ
  choice: он истолковал нам
  rationale: В контексте снов глагол פתר означает истолковать сон; дополнение «нам» сохранено по еврейскому тексту.
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  choice: меня фараон вернул на мою должность
  rationale: Начальное «меня» сохраняет контраст с последующим «того». Выражение עַל כַּנִּי обозначает восстановление в прежнем служебном положении. Подлежащее «фараон» ясно из контекста и добавлено ради естественности и устранения неясности русского предложения.
- source_word: וְאֹתוֹ תָלָה
  choice: а того повесил
  rationale: Союз «а» естественно выражает резкое противопоставление двух судеб, а вынесенное дополнение «того» отражает контрастную структуру еврейского текста. תלה передано буквально без уточнения способа смерти.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сжатый придворно-повествовательный стиль. Контраст между судьбами двух слуг сохранён посредством «меня… а того». Местоименное подлежащее исходного текста раскрыто как «фараон» на основании ближайшего контекста (Быт. 40:20–22), без изменения смысла.
