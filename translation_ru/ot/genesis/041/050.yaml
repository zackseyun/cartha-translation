source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ru
  text: До наступления года голода[a] у Иосифа родились два сына, которых родила ему Асенефа, дочь Потифера, жреца Она[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до того, как наступил год голода». В еврейском тексте слово «год» стоит в единственном числе и обозначает начало периода голода.'
    reason: lexical_alternative
  - marker: b
    text: Он — египетский город, позднее известный под греческим названием Гелиополь.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: родились два сына
  rationale: Пассивная форма ילד с подлежащим во множественном числе естественно передаётся русским возвратным глаголом «родились».
- source_word: וּלְיוֹסֵף
  choice: у Иосифа
  rationale: В русском повествовании о рождении детей конструкция «у Иосифа родились» естественно передаёт еврейский дательный отношения.
- source_word: בְּטֶרֶם תָּבוֹא שְׁנַת הָרָעָב
  choice: до наступления года голода
  rationale: Сохраняется единственное число «год» и образ наступления времени; речь идёт о начале периода голода.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: которых родила ему
  rationale: Относительное местоимение относится к двум сыновьям; дательный «ему» сохраняет לּוֹ без двусмысленности.
- source_word: אָסְנַת
  choice: Асенефа
  rationale: Употреблена укоренившаяся в русской библейской традиции форма египетского личного имени.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: дочь Потифера
  rationale: Конструктивная цепь прямо обозначает родство; имя передано в принятой русской библейской форме.
- source_word: כֹּהֵן אֹון
  choice: жреца Она
  rationale: Для служителя египетского культа современное русское «жрец» точнее различает контекст, а топоним Он транслитерируется.
