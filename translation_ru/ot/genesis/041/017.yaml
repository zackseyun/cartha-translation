  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: ru
  text: 'Тогда фараон сказал Иосифу: «Во сне я стоял на берегу Нила[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «реки». В египетском контексте книги Бытие это слово обычно обозначает Нил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: сказал
  rationale: В повествовании перед прямой речью «сказал» естественно передаёт функцию глагола «говорить».
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского царя.
- source_word: אֶל יוֹסֵף
  choice: Иосифу
  rationale: Русский дательный падеж естественно обозначает адресата речи.
- source_word: בַּחֲלֹמִי
  choice: во сне
  rationale: Точно и естественно передаёт сочетание предлога с существительным и суффиксом первого лица; принадлежность сна говорящему ясна из прямой речи.
- source_word: הִנְנִי עֹמֵד
  choice: я стоял
  rationale: Представительная частица с причастием живо вводит положение говорящего; в русском рассказе о сне прошедшее время звучит естественно, хотя отдельное «вот» опущено во избежание стилистической тяжеловесности.
- source_word: עַל שְׂפַת
  choice: на берегу
  rationale: Буквально «на краю/губе»; применительно к реке современное русское соответствие — «на берегу».
- source_word: הַיְאֹר
  choice: Нила
  rationale: В египетском контексте יְאֹר обычно обозначает Нил; конкретное название ясно передаёт подразумеваемый объект, а буквальный вариант отмечен в сноске.
