base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: ru
  text: Утром его дух встревожился. Он послал созвать всех египетских чародеев и всех египетских мудрецов. Фараон рассказал им свой сон, но не нашлось никого, кто мог бы истолковать их[a] фараону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их». Хотя перед этим стоит единственное число — «свой сон», местоимение во множественном числе может относиться к двум снам фараона или к отдельным частям увиденного. Некоторые переводы сглаживают это как «истолковать его».'
    reason: Сохранено расхождение числа между еврейским существительным «сон» и последующим местоимением «их».
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Утром
  rationale: Естественно передаёт временное обстоятельство и последовательность повествования без излишней буквальности.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: дух его встревожился
  rationale: Сохраняет прямое значение רוּחַ («дух») и передаёт внутреннее смятение, выраженное глаголом פעמ.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: Он послал созвать
  rationale: 'Идиоматично передаёт два последовательных еврейских глагола: фараон послал людей, чтобы вызвать специалистов.'
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: всех египетских чародеев
  rationale: Обозначает египетских ритуальных специалистов, связанных с тайными искусствами и толкованием снов; «чародеи» ясно отличает их от мудрецов.
- source_word: כָּל חֲכָמֶיהָ
  choice: всех египетских мудрецов
  rationale: Суффикс относится к Египту; повтор прилагательного естественнее по-русски, чем буквальное «всех его мудрецов» с потенциально неясным референтом.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: Фараон рассказал им свой сон
  rationale: Сохраняет единственное число масоретского текста — «сон», не исправляя его по последующему местоимению во множественном числе.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: но никто не мог истолковать их фараону
  rationale: Сохраняет множественное число объектного местоимения אֹתָם и значение פתר как истолкования снов; модальная формулировка естественна в современном русском.
