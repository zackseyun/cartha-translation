    issue: «Урожайных» вместо «хороших»
    rationale: Еврейское טֹבוֹת обозначает «хорошие» годы; контекст объясняет их изобилие, но слово «урожайные» прямо сводит характеристику к урожаю и тем самым сужает исходное выражение.
  - severity: low
    issue: Связь «зерно … продовольствие в городах» выражена недостаточно ясно
    rationale: В оригинале «продовольствие в городах» аппозиционно поясняет зерно. «В городах для пропитания» передаёт общий смысл, но менее отчётливо обозначает запасы как продовольствие, размещённое в городах.
  revised_text: Пусть они соберут всё продовольствие этих грядущих хороших лет, накопят зерно под властью фараона как продовольственные запасы в городах и пусть хранят его.[a]
