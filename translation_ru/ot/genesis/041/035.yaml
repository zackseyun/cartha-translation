base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: ru
  text: Пусть они соберут всё продовольствие этих грядущих хороших лет, накопят зерно под властью фараона как продовольственные запасы в городах и пусть хранят его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть охраняют его»; также возможно: «и пусть берегут его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Пусть они соберут
  rationale: Имперфект в контексте совета Иосифа имеет побудительно-предписывающий оттенок, естественно передаваемый конструкцией «пусть».
- source_word: כָּל אֹכֶל
  choice: всё продовольствие
  rationale: אֹכֶל здесь обозначает пищевые запасы или съедобную продукцию; «продовольствие» естественно для административного контекста сбора урожая.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: этих наступающих урожайных лет
  rationale: Сохранены указательное значение הָאֵלֶּה и значение приближающегося периода; «урожайных» яснее передаёт смысл «хороших» лет в данном контексте изобилия.
- source_word: וְיִצְבְּרוּ
  choice: накопят
  rationale: Глагол обозначает складывание или накопление в большом количестве; «накопят» уместно для организованного создания запасов.
- source_word: בָר
  choice: зерно
  rationale: בָר обозначает зерно, особенно уже обмолоченное; более узкое «пшеница» не подтверждается текстом.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: под властью фараона
  rationale: Буквально «под рукой фараона» — идиома власти и контроля; смысловая передача звучит естественно и сохраняет политико-административный смысл.
- source_word: אֹכֶל בֶּעָרִים
  choice: в городах для пропитания
  rationale: Фраза допускает понимание зерна как продовольственного запаса, размещённого в городах; выбранная формулировка передаёт и место, и назначение.
- source_word: וְשָׁמָרוּ
  choice: и пусть хранят его
  rationale: שׁמר может означать хранить, охранять или сберегать. В контексте запасов нейтральное «хранят» сохраняет основное значение, а альтернативы отмечены в сноске.
