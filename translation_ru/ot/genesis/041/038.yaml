base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: ru
  text: 'Тогда фараон сказал своим слугам: «Найдём ли мы такого человека, в котором есть дух Божий[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух Божий», «дух от Бога» или «божественный дух». Еврейское выражение רוּחַ אֱלֹהִים допускает несколько пониманий.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: Прямое соответствие еврейскому слову; в придворном контексте оно может обозначать также служителей или сановников, но уточнять их ранг текст не требует.
- source_word: הֲנִמְצָא
  choice: Найдём ли мы
  rationale: Вопросительная частица и форма первого лица множественного числа образуют риторический совещательный вопрос.
- source_word: כָזֶה אִישׁ
  choice: такого человека
  rationale: Естественная русская передача указательного оборота, относящегося к Иосифу.
- source_word: אֲשֶׁר ... בּוֹ
  choice: в котором был бы
  rationale: Сохраняет выраженную предлогом בּוֹ идею пребывания «в нём»; сослагательная форма по-русски согласуется с риторическим вопросом о возможности найти такого человека.
- source_word: רוּחַ אֱלֹהִים
  choice: дух Божий
  rationale: Передаёт конструкцию без навязывания однозначной идентификации; строчная буква сохраняет подлинную неоднозначность слов фараона, а примечание указывает возможные понимания.
theological_decisions:
- issue: Обозначает ли רוּחַ אֱלֹהִים определённо Духа Божьего или в более общем смысле божественный дух
  choice: дух Божий
  alternative: Дух Божий; Божий дух; божественный дух
  rationale: Еврейская конструкция не имеет артикля и допускает несколько оттенков, особенно в устах фараона. Основной текст сохраняет традиционную и близкую форме оригинала передачу со строчной буквы, не разрешая неоднозначность типографически; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Фараон» пишется со строчной буквы как титул; формулировка вопроса естественна по-русски и сохраняет риторический характер оригинала.
