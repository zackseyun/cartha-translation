base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: ru
  text: 'Пусть фараон сделает так: назначит над страной управителей и в течение семи лет изобилия будет собирать пятую часть урожая Египта[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обложит Египет пятой частью». Еврейский глагол может означать сбор или взимание одной пятой в годы изобилия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Пусть фараон сделает так
  rationale: Широкое значение עשה передано как совет-побуждение; подразумеваемое «так» естественно связывает фразу с последующими мерами.
- source_word: וְיַפְקֵד
  choice: назначит
  rationale: Каузативная форма פקד здесь означает поставить людей на ответственную административную должность.
- source_word: פְּקִדִים
  choice: надзирателей
  rationale: Слово обозначает назначенных должностных лиц, осуществляющих надзор; этот вариант ясно передаёт их функцию.
- source_word: עַל הָאָרֶץ
  choice: над страной
  rationale: В административном контексте הָאָרֶץ означает территорию государства, а עַל указывает на сферу полномочий.
- source_word: וְחִמֵּשׁ
  choice: будет собирать пятую часть
  rationale: Редкий глагол חמשׁ в пиэле, вероятнее всего, означает взимать или собирать одну пятую; временная форма согласована с периодом семи лет.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: урожая Египетской земли
  rationale: Добавление «урожая» проясняет подразумеваемый предмет сбора в контексте лет изобилия и последующего хранения зерна, не создавая впечатления, будто изымается часть территории.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: в семь лет изобилия
  rationale: שָׂבָע обозначает полноту и достаток, а в данном повествовании — период обильных урожаев.
