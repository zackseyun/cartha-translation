- from: 'Пусть фараон сделает так: назначит над страной надзирателей и в семь лет изобилия будет собирать пятую часть урожая Египетской земли[a].'
  to: 'Пусть фараон сделает так: назначит над страной управителей и в течение семи лет изобилия будет собирать пятую часть урожая Египта[a].'
  rationale: Исправлены регистрово и семантически менее точные «надзиратели», а также тяжеловесные формулировки. Смысл административной меры, предмет сбора и временные рамки сохранены; сноска по-прежнему отражает лексическую неоднозначность глагола חמשׁ.
