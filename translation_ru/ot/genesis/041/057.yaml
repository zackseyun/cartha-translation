lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: И со всей земли приходили
  rationale: Буквально выражение означает «и вся земля приходила», но форма глагола во множественном числе указывает на жителей разных земель. Русская безлично-обобщённая конструкция естественно передаёт это значение, не сужая широкий охват еврейского выражения.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: приходили в Египет
  rationale: Глагол בוא передаёт прибытие, а направительное окончание в מִצְרַיְמָה — движение в сторону Египта. Несовершенный вид по-русски уместно описывает многократный поток людей во время голода.
- source_word: לִשְׁבֹּר
  choice: покупать зерно
  rationale: В повествовании об Иосифе שׁבר обозначает покупку или приобретение хлебного зерна в условиях голода; дополнение «зерно» делает подразумеваемый предмет покупки ясным.
- source_word: אֶל יוֹסֵף
  choice: к Иосифу
  rationale: Сохранено прямое значение предлога אֶל — обращение и прибытие к Иосифу как к распорядителю запасов; вариант «у Иосифа» был бы более толковательным.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой люди направлялись в Египет.
- source_word: חָזַק הָרָעָב
  choice: голод свирепствовал
  rationale: Буквально голод «был силён» или «усилился». Глагол «свирепствовал» естественно и выразительно передаёт тяжесть и господство голода без ослабления смысла.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: Повтор слова אֶרֶץ сохранён ради риторического обрамления стиха и широкого географического охвата.
