lexical_decisions:
- source_word: קָצַף
  choice: разгневался
  rationale: Глагол обозначает гнев; «разгневался» передаёт его силу в достойном современном регистре, не усиливая значение до ярости.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: В данном придворном контексте речь идёт о служащих фараона. «Слуг» сохраняет связь с основным значением עבד, не представляя их непременно рабами и не сводя только к чиновничьему статусу.
- source_word: בְּמִשְׁמַר
  choice: под стражу
  rationale: Существительное обозначает охраняемое заключение; выражение «под стражу» естественно по-русски и не предполагает непременно отдельного тюремного здания.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: в доме начальника стражи
  rationale: Выражение обозначает дом придворного начальника, ведавшего стражей; буквальная связь טבחים с убивающими или палачами сохранена в примечании.
- source_word: שַׂר הָאֹפִים
  choice: главного пекаря
  rationale: Сочетание обозначает руководителя пекарей; «главный пекарь» кратко и естественно передаёт придворную должность.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: меня и главного пекаря
  rationale: Повтор «меня» после обстоятельства места отражён тире и повторением, что сохраняет эмфатическую структуру еврейской фразы и остаётся естественным по-русски.
