base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: ru
  text: А семь худых и безобразных коров, вышедших после них, — это семь лет; и семь пустых колосьев, иссушённых восточным ветром, будут семью годами голода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: худых
  rationale: В описании коров прилагательное обозначает истощённость, худобу; это естественное и понятное соответствие в современном русском.
- source_word: וְהָרָעֹת
  choice: невзрачных
  rationale: Здесь רַע описывает дурной внешний вид или плохое состояние коров, а не нравственное зло. «Невзрачных» естественно передаёт зрительный образ, не внося морального смысла.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: вышедших после них
  rationale: Передаёт появление коров вслед за первыми и сохраняет последовательность видения.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: это семь лет
  rationale: Естественная русская формула символического отождествления образов сна с семью годами.
- source_word: הַשִׁבֳּלִים
  choice: колосьев
  rationale: Обычное и точное современное русское обозначение верхней зерноносной части злака.
- source_word: הָרֵקוֹת
  choice: пустых
  rationale: В применении к колосьям слово указывает на отсутствие полноценного зерна; буквальное «пустых» ясно сохраняет сельскохозяйственный образ.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: иссушённых восточным ветром
  rationale: Глагольная форма обозначает повреждение знойным восточным ветром. «Иссушённых» естественно для колосьев и передаёт результат воздействия без излишней конкретизации как обжигания.
- source_word: יִהְיוּ
  choice: станут
  rationale: Будущая форма сохраняет предсказательный оттенок еврейского имперфекта; в русском «станут семью годами» звучит естественнее буквального «будут» в данном символическом истолковании.
- source_word: שְׁנֵי רָעָב
  choice: годами голода
  rationale: Точное контекстуальное соответствие для периода массовой нехватки пищи; конструкция естественна в русском повествовании.
