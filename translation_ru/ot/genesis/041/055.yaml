base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: ru
  text: 'И когда вся земля Египетская стала голодать, народ воззвал к фараону, прося хлеба. Фараон сказал всем египтянам: «Идите к Иосифу и делайте всё, что он вам скажет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: стала голодать
  rationale: Передаёт наступление голода и сохраняет глагольную форму; выражение «начался голод» было бы более отвлечённым, а «страдала от голода» — несколько более интерпретирующим.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: вся земля Египетская
  rationale: Сохраняет явно выраженное אֶרֶץ («земля») и естественно звучит в русском библейском повествовании.
- source_word: וַיִּצְעַק הָעָם
  choice: народ воззвал
  rationale: צעק обозначает настойчивый крик о помощи в бедствии; «воззвал» передаёт силу обращения без излишней разговорности.
- source_word: לַלָּחֶם
  choice: прося хлеба
  rationale: Сохраняет буквальное «хлеб», которое в контексте может метонимически обозначать пищу или продовольствие; причастный оборот естественно выражает цель обращения.
- source_word: לְכָל מִצְרַיִם
  choice: всем египтянам
  rationale: Название страны употреблено собирательно; по-русски обращение фараона естественнее передать как обращение ко всем египтянам, не меняя смысла.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: Идите к Иосифу
  rationale: Прямо передаёт повелительное наклонение и предлог אֶל; используется традиционная русская форма имени.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: делайте всё, что он вам скажет
  rationale: Естественно передаёт вынесенный объект действия и широкий смысл относительной конструкции; «всё» эксплицирует подразумеваемый объём повеления, не сужая его.
theological_decisions: []
