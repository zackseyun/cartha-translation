  terminology: Имя «Иосиф» соответствует устойчивой русской библейской традиции. «Фараон», «египтяне» и «хлеб» употреблены точно. Добавленное «всё» в «делайте всё, что он вам скажет» является естественным способом передать неограниченный объём относительной конструкции и не меняет смысла.
