  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: ru
  text: 'И сказал фараон Иосифу: «Смотри, я поставил тебя над всей землёй Египта».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное и естественное русское «И сказал» сохраняет связность еврейского рассказа.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя; в данном контексте это титул.
- source_word: אֶל־יוֹסֵף
  choice: Иосифу
  rationale: Русский дательный падеж естественно передаёт адресата речи, выраженного предлогом אֶל.
- source_word: רְאֵה
  choice: Смотри
  rationale: Императив привлекает внимание к следующему торжественному заявлению; «Смотри» сохраняет прямую побудительную форму без архаизации.
- source_word: נָתַתִּי אֹתְךָ
  choice: я поставил тебя
  rationale: Буквально נתן означает «дать», но в сочетании с עַל здесь выражает наделение властью; «поставил тебя» естественно передаёт назначение на высокий пост.
- source_word: עַל
  choice: над
  rationale: Предлог обозначает власть Иосифа над вверенной ему областью.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: всей землёй Египта
  rationale: Передаёт как всеохватность כָּל, так и территориально-государственное значение אֶרֶץ; творительный падеж обусловлен русским управлением «над».
