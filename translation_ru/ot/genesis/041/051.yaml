  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: ru
  text: Иосиф назвал своего первенца Манассией[a], ибо Бог дал мне забыть все мои тяготы[b] и весь дом моего отца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Манассия» созвучно еврейскому выражению «дающий забыть» или «заставляющий забыть».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все мои беды»; возможно также: «весь мой тяжкий труд».'
    reason: lexical_alternative
  - marker: c
    text: «Дом отца» — еврейское выражение, обозначающее семью или домашнее сообщество по отцовской линии.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא יוֹסֵף אֶת שֵׁם הַבְּכוֹר
  choice: Иосиф назвал своего первенца
  rationale: Глагол קרא в сочетании со словом «имя» означает «назвать, дать имя». Естественная русская конструкция передаёт этот смысл без буквального и тяжеловесного «назвал имя первенца»; слово «первенец» сохранено как явно присутствующее в еврейском тексте.
- source_word: מְנַשֶּׁה
  choice: Манассией
  rationale: Использована традиционная русская форма имени в творительном падеже после глагола «назвал». Связь имени с последующим נַשַּׁנִי пояснена в сноске.
- source_word: כִּי
  choice: потому что сказал
  rationale: Союз вводит объяснение данного имени. Слово «сказал» эксплицирует подразумеваемое высказывание Иосифа и позволяет естественно передать формы первого лица в следующей части.
- source_word: נַשַּׁנִי
  choice: дал мне забыть
  rationale: 'Форма выражает каузативный смысл: Бог сделал так, что Иосиф забыл. «Дал мне забыть» звучит естественно и сохраняет причинное действие Бога, не добавляя толкования о том, что забылась лишь боль воспоминаний.'
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово имеет единственное значение, что подтверждается формой связанного с ним глагола.
- source_word: כָּל עֲמָלִי
  choice: все мои тяготы
  rationale: עָמָל охватывает страдания, беды и тяжкий труд. «Тяготы» достаточно широко передаёт пережитые Иосифом лишения, не сужая значение только до труда или душевной боли.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: и весь дом моего отца
  rationale: Сохранён еврейский образ «дом отца», обозначающий отцовскую семью или родовое домашнее сообщество. Такой перевод также не сводит высказывание только к забыванию отдельных людей.
theological_decisions:
- issue: Возможный смысл слов Иосифа о том, что он забыл дом своего отца
  choice: 'Высказывание передано прямо: Бог дал Иосифу забыть все его тяготы и весь дом его отца.'
  alternative: Передать смысл как «Бог дал мне забыть боль, связанную с домом моего отца» или объяснить это как гиперболу.
  rationale: Еврейский текст не уточняет, что Иосиф забыл лишь боль или тяжёлые воспоминания. Перевод сохраняет смысловую и богословскую напряжённость и не вносит гармонизирующего пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для обычного читателя, при этом сохранены «первенец» и образ «дом моего отца». Прямая речь ясно показывает, что объяснение имени принадлежит Иосифу.
