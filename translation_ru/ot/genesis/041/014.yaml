base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: ru
  text: Тогда фараон послал за Иосифом. Его поспешно вывели из темницы[a]. Он побрился, переоделся и предстал перед фараоном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «из ямы». Это слово может обозначать яму, цистерну или устроенное подобным образом место заключения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח פַּרְעֹה וַיִּקְרָא אֶת יוֹסֵף
  choice: фараон послал за Иосифом
  rationale: Два последовательных глагола буквально означают «послал и позвал Иосифа», но вместе описывают распоряжение привести его. Русское «послал за Иосифом» естественно передаёт этот смысл без ненужной избыточности.
- source_word: וַיְרִיצֻהוּ
  choice: Его поспешно вывели
  rationale: 'Каузативная форма от רוץ передаёт срочность: Иосифа заставили быстро выйти или быстро доставили. Безлично-личная конструкция с подразумеваемыми слугами естественна по-русски.'
- source_word: מִן הַבּוֹר
  choice: из темницы
  rationale: בּוֹר буквально обозначает яму или цистерну, но здесь служит названием места заключения. «Темница» ясно передаёт контекст, а буквальное значение сохранено в примечании.
- source_word: וַיְגַלַּח
  choice: Он побрился
  rationale: Активная форма допускает естественное русское возвратное «побрился» и не требует предполагать, что его брил кто-то другой.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: переоделся
  rationale: Краткое современное соответствие выражению «сменил свои одежды».
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: предстал перед фараоном
  rationale: Контекст аудиенции позволяет естественно передать буквальное «пришёл к фараону» как появление перед правителем, не добавляя существенного нового содержания.
