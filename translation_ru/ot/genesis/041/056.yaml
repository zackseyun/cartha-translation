base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: ru
  text: Голод был по всей земле[b]. Тогда Иосиф открыл все хранилища с зерном[a] и продавал зерно египтянам. А голод в Египте всё усиливался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыл всё, что было в них». Еврейский текст не называет хранилища прямо; они подразумеваются из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по всей стране». Еврейское слово может обозначать как землю в широком смысле, так и отдельную страну или область.'
    reason: ambiguity
lexical_decisions:
- source_word: הָרָעָב
  choice: голод
  rationale: В данном повествовании רָעָב означает тяжёлый и продолжительный недостаток пищи; русское «голод» естественно передаёт и бедствие, и его нарастание.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: по всей земле
  rationale: Так сохраняется широкий охват еврейского выражения, не устраняя контекстуальную неоднозначность אֶרֶץ между землёй как обитаемым миром и страной/областью.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: открыл все хранилища с зерном
  rationale: Еврейская фраза эллиптична и буквально не называет хранилища. Контекстуальное восполнение делает действие понятным по-русски, а сноска сохраняет необычную форму исходного текста.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: стал продавать зерно египтянам
  rationale: В рассказе о голоде שׁבר обозначает продажу зерна или продовольствия. «Египтянам» естественно передаёт коллективное לְמִצְרַיִם и не создаёт впечатления продажи неодушевлённой стране.
- source_word: וַיֶּחֱזַק
  choice: всё усиливался
  rationale: Буквально глагол связан с силой; при подлежащем «голод» он означает, что бедствие становилось тяжелее. Форма «усиливался» передаёт нарастание.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египетской земле
  rationale: Сохраняет полную форму еврейского географического выражения и возвышенный повествовательный регистр Бытия.
