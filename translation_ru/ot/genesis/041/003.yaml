base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: ru
  text: И вот, вслед за ними из Нила[a] вышли семь других коров, безобразных на вид и тощих, и встали рядом с теми коровами на берегу Нила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «реки»; в египетском контексте речь идет о Ниле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет живой повествовательный указатель и внезапность картины сна, оставаясь естественным для современного русского языка.
- source_word: פָּרוֹת
  choice: коров
  rationale: Форма женского рода множественного числа обозначает именно коров, а не скот вообще; возраст животных не указан.
- source_word: אֲחֵרוֹת
  choice: других
  rationale: Передаёт отличие второй группы из семи коров от первой.
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: вслед за ними ... вышли
  rationale: Причастная конструкция описывает появление второй группы после первой; «вышли из Нила» естественно передаёт движение из воды на берег.
- source_word: הַיְאֹר
  choice: Нила
  rationale: В египетском контексте יְאֹר обозначает Нил; прямое наименование ясно для современного читателя.
- source_word: רָעוֹת מַרְאֶה
  choice: безобразных на вид
  rationale: Фраза характеризует неприятную внешность, а не нравственное зло; выбранное выражение сохраняет описательную форму оригинала.
- source_word: דַקּוֹת בָּשָׂר
  choice: тощих
  rationale: Естественно и наглядно передаёт крайнюю телесную худобу животных; буквальное «тонких плотью» по-русски звучало бы неестественно.
- source_word: וַתַּעֲמֹדְנָה אֵצֶל
  choice: и встали рядом
  rationale: Передаёт простое последовательное действие и непосредственную близость ко второй группе.
- source_word: שְׂפַת הַיְאֹר
  choice: на берегу Нила
  rationale: «Берег» — естественный русский эквивалент для края реки.
