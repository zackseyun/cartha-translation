lexical_decisions:
- source_word: וָאֵרֶא
  choice: И увидел я
  rationale: Форма глагола ראה продолжает последовательный рассказ фараона от первого лица; такой перевод сохраняет повествовательное движение и естественную для торжественного рассказа инверсию.
- source_word: בַּחֲלֹמִי
  choice: во сне
  rationale: Предлог с существительным и суффиксом первого лица означает «в моём сне»; по-русски принадлежность естественно выражается формой «во сне» в контексте рассказа говорящего.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица הִנֵּה ярко вводит увиденную картину; «вот» передаёт её непосредственность без архаизации.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: семь колосьев
  rationale: שִׁבֹּלֶת здесь обозначает колос злака. Русское «колос» точно и понятно передаёт образ.
- source_word: עֹלֹת
  choice: поднимаются
  rationale: Причастная форма изображает действие как разворачивающееся перед глазами во сне; настоящее время сохраняет эту наглядность.
- source_word: בְּקָנֶה אֶחָד
  choice: на одном стебле
  rationale: קָנֶה обозначает тростниковидный стебель; в образе злака естественный русский эквивалент — «стебель».
- source_word: מְלֵאֹת
  choice: полных
  rationale: Перевод сохраняет основное значение «полный, наполненный» и согласуется с образом колосьев, наполненных зерном.
- source_word: וְטֹבוֹת
  choice: и хороших
  rationale: טוֹב имеет широкое значение «хороший»; буквальный эквивалент сохраняет оценочную широту исходного текста, не сужая её до «здоровых» или «отборных».
