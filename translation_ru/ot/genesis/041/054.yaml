base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: ru
  text: Стали наступать семь лет голода, как сказал Иосиф. Во всех землях был голод, а во всей земле Египта был хлеб[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была пища»; еврейское слово «хлеб» может обозначать пищу или продовольствие вообще.'
    reason: 'Лексическая альтернатива: конкретное значение слова сохранено в основном тексте, а его более широкое употребление указано в примечании.'
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: начали наступать
  rationale: Сочетание начинательного глагола с инфинитивом передаёт наступление предсказанных лет. «Начали наступать» сохраняет начинательный оттенок еврейского текста и естественно звучит по-русски.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: семь лет голода
  rationale: Так передаётся конструкция со значением семилетнего периода, отмеченного голодом; формулировка ясна и близка к структуре оригинала.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: как и сказал Иосиф
  rationale: Оборот передаёт точное соответствие наступившего события прежним словам Иосифа. Частица «и» естественно подчёркивает это соответствие, не усиливая его сверх оригинала.
- source_word: וַיְהִי רָעָב
  choice: голод был
  rationale: Простая бытийная конструкция сохраняет сдержанный повествовательный характер еврейского выражения.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: во всех землях
  rationale: «Земли» сохраняет множественное число и не вносит более современного политического понятия государств.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: а по всей земле Египетской
  rationale: Союз «а» естественно выражает подразумеваемое противопоставление между всеобщим голодом и наличием хлеба в Египте; «по всей» идиоматично обозначает распространённость на всей территории.
- source_word: הָיָה לָחֶם
  choice: был хлеб
  rationale: Основной текст сохраняет конкретное слово «хлеб», тогда как возможное более широкое значение «пища, продовольствие» отмечено в сноске.
