  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: ru
  text: Иосифу было тридцать лет, когда он предстал перед фараоном, царём Египта. Иосиф вышел от фараона и прошёл по всей земле Египта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: Иосифу было тридцать лет
  rationale: Еврейское идиоматическое обозначение возраста естественно передаётся по-русски конструкцией «было тридцать лет».
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: когда он предстал перед фараоном
  rationale: Сочетание предлога с инфинитивом указывает на время, а «предстал перед» естественно передаёт официальное появление Иосифа в присутствии правителя.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: фараоном, царём Египта
  rationale: Приложение «царь Египта» поясняет титул фараона; запятая соответствует нормам современного русского языка.
- source_word: וַיֵּצֵא יוֹסֵף מִלִּפְנֵי פַרְעֹה
  choice: Иосиф вышел от фараона
  rationale: Передаёт буквальное движение из присутствия фараона без тяжеловесного оборота «из-пред лица фараона».
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: прошёл по всей земле Египетской
  rationale: Глагол עבר обозначает передвижение по стране; «прошёл по всей» сохраняет широту охвата, не добавляя прямо не названной цели поездки.
