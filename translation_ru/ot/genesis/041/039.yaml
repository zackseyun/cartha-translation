  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: ru
  text: 'Тогда фараон сказал Иосифу: «После того как Бог открыл тебе всё это, нет никого столь же проницательного и мудрого, как ты».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поскольку Бог открыл тебе всё это». Выражение, буквально означающее «после того как», здесь может также указывать на основание вывода фараона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятая русская передача египетского царского титула.
- source_word: אַחֲרֵי
  choice: После того как
  rationale: Сохраняет основное временное значение предлога; в контексте предшествующее откровение одновременно служит основанием для вывода фараона.
- source_word: הוֹדִיעַ
  choice: открыл ... всё это
  rationale: Порода hифиль от ידע означает «дать узнать, сделать известным»; «открыл» естественно передаёт сообщение Богом прежде неизвестного содержания.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму, контекст и согласование указывают здесь на единственного Бога.
- source_word: אֶת כָּל זֹאת
  choice: всё это
  rationale: Кратко и точно обозначает всё содержание истолкования и объяснения Иосифа.
- source_word: אֵין
  choice: нет никого
  rationale: Естественная русская передача отрицательной экзистенциальной конструкции.
- source_word: נָבוֹן
  choice: проницательного
  rationale: Передаёт способность понимать, различать и верно судить, проявленную Иосифом.
- source_word: וְחָכָם
  choice: и мудрого
  rationale: Стандартно передаёт חכם и сохраняет парное сочетание проницательности и мудрости.
- source_word: כָּמוֹךָ
  choice: как ты
  rationale: Естественная русская сравнительная конструкция после «нет никого столь же».
theological_decisions:
- issue: Значение אֱלֹהִים в речи фараона
  choice: Бог
  alternative: боги
  rationale: Глагольная форма и ближайший контекст представляют того, кто открыл Иосифу значение снов, как единственного Бога; поэтому единственное число точнее передаёт смысл данного места.
- issue: Связь אַחֲרֵי с выводом фараона
  choice: Сохранено временное «после того как», при этом причинно-логический оттенок отмечен в сноске
  alternative: Поскольку Бог открыл тебе всё это
  rationale: Еврейское выражение буквально обозначает следование во времени, но в контексте сделанное Богом откровение также является основанием оценки Иосифа. Сноска сохраняет оба оттенка без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. «Проницательный» передаёт интеллектуальную различительность נבון и не смешивает её с последующим «мудрый». Сноска поставлена после всей реплики, к которой относится альтернативное прочтение.
