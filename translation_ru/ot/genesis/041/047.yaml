  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: ru
  text: В течение семи лет изобилия земля давала урожай пригоршнями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пригоршнями». Еврейское слово образовано от существительного со значением «пригоршня, горсть» и образно подчёркивает необычайное обилие урожая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: приносила урожай
  rationale: Глагол עשה буквально означает «делать, производить», но при подлежащем «земля» в земледельческом контексте естественно передаётся как «приносить урожай».
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте повествования имеется в виду возделываемая земля Египта; «земля» сохраняет конкретный образ и не расширяет смысл до всего мира.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: в течение семи лет изобилия
  rationale: Оборот обозначает весь предсказанный семилетний период достатка; «изобилие» точно и естественно передаёт שׂבע.
- source_word: לִקְמָצִים
  choice: пригоршнями
  rationale: Существительное קְמָץ означает «пригоршня, горсть». Наречное «пригоршнями» сохраняет необычный конкретный образ чрезвычайно обильного урожая, не заменяя его толкованием вроде «в огромном количестве».
