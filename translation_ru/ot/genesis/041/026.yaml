  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: ru
  text: Семь хороших коров — это семь лет, и семь хороших колосьев — это семь лет. Это один сон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: коров
  rationale: Еврейское слово обозначает коров, то есть самок крупного рогатого скота; в данном контексте это точное и естественное соответствие.
- source_word: הַטֹּבֹת
  choice: хороших
  rationale: Сохраняет широкое значение прилагательного и прямую словесную связь с образами сна, не сводя смысл только к внешнему виду или здоровью.
- source_word: שָׁנִים
  choice: лет
  rationale: 'Прямое соответствие еврейскому слову: символы сна истолковываются как годы.'
- source_word: שִׁבֳּלִים
  choice: колосьев
  rationale: В русском языке «колосья» естественно и точно обозначают зерноносную верхнюю часть стебля; контекст сна исключает двусмысленность.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: Это один сон
  rationale: Передаёт форму единственного числа и подчёркивает, что обе последовательности образов составляют единое сновидение и несут одну весть.
- source_word: הֵנָּה
  choice: это
  rationale: Женское местоимение множественного числа выполняет связочную функцию; русская конструкция «это семь лет» передаёт её естественно.
