  source_fidelity: 'Текст точно передаёт последовательность действий: фараон снова засыпает и во второй раз видит сон. «Вот» уместно передаёт וְהִנֵּה, «семь колосьев» — שֶׁבַע שִׁבֳּלִים, а «поднимались на одном стебле» сохраняет наглядно-разворачивающийся характер עֹלוֹת и образ одного стебля. «Полные и хорошие» передаёт בְּרִיאוֹת וְטֹבוֹת без излишнего истолкования.'
