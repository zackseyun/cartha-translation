  terminology: «Колосья» и «стебель» точны в сельскохозяйственном контексте. «Полные» естественно обозначает налитые зерном колосья; сохранённое «хорошие» оставляет широкую оценочность טוֹבוֹת. Сноски привязаны к соответствующим словам и полезно поясняют лексику.
