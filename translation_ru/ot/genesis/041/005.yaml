  text: וַ/יִּישָׁ֕ן וַֽ/יַּחֲלֹ֖ם שֵׁנִ֑ית וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּ/קָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: ru
  text: 'Потом он заснул, и ему во второй раз приснился сон: вот, семь колосьев[a] поднимались на одном стебле — полные[b] и хорошие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть колосья злака; еврейское слово обозначает несущую зёрна верхнюю часть растения.
    reason: lexical_clarification
  - marker: b
    text: 'Или: «налитые». Еврейское прилагательное описывает колосья как хорошо наполненные зёрнами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Потом он заснул
  rationale: Форма wayyiqtol продолжает последовательность повествования; «потом» естественно передаёт переход к следующему действию.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: ему во второй раз приснился сон
  rationale: Сохраняет значение наречного שֵׁנִית — «во второй раз» — и звучит естественно в современном русском.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт яркое предъявление картины внутри сна, не сглаживая дискурсивную функцию еврейского выражения.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: семь колосьев
  rationale: שִׁבֹּלֶת обозначает несущую зёрна верхнюю часть хлебного злака; «колосья» — точный и естественный русский эквивалент.
- source_word: עֹלֹת
  choice: поднимались
  rationale: Причастие изображает продолжающееся, наглядно разворачивающееся действие; несовершенный вид сохраняет эту особенность.
- source_word: בְּקָנֶה אֶחָד
  choice: на одном стебле
  rationale: В данном сельскохозяйственном образе קָנֶה означает стебель, а предлог בְּ естественно передаётся по-русски как «на».
- source_word: בְּרִיאוֹת
  choice: полные
  rationale: Применительно к колосьям прилагательное указывает на полноту, налитость зёрнами; «полные» передаёт смысл без неестественного буквального «тучные».
- source_word: וְטֹבוֹת
  choice: и хорошие
  rationale: Прямо сохраняет широкое оценочное значение טוֹב и относится к качеству колосьев.
