  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: ru
  text: 'И когда хорошие коровы вошли внутрь тощих[a], нельзя было заметить, что они вошли внутрь них: вид у тощих был таким же дурным, как и вначале. Тут я проснулся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их внутренность»; то есть внутрь тощих коров. В еврейском тексте повторяется выражение «в их внутренность».'
    reason: Лексическая альтернатива и прояснение референтов местоимений в связи с предыдущим стихом.
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: И вошли они
  rationale: Форма Qal wayyiqtol, 3-е лицо женского рода множественного числа, продолжает последовательность рассказа. Инверсия естественна в русском повествовании и помогает связать местоимение с ранее съеденными коровами, не добавляя отсутствующего в еврейском тексте существительного.
- source_word: אֶל קִרְבֶּנָה
  choice: в их утробы
  rationale: קֶרֶב обозначает внутренность или внутреннюю часть. В образе коров, поглотивших других коров, «утробы» конкретно и естественно передаёт физический смысл, сохраняя необычность сна.
- source_word: וְלֹא נוֹדַע
  choice: но не было заметно
  rationale: Нифаль от ידע здесь указывает не столько на отсутствие чьего-либо знания, сколько на то, что поглощение никак не проявилось внешне. Перевод сохраняет безличность конструкции и ясно выражает зрительный контекст.
- source_word: כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: что они вошли в их утробы
  rationale: כִּי вводит содержание того, что не было заметно. Повтор выражения «в их утробы» воспроизводит еврейский повтор и удерживает конкретный образ.
- source_word: וּמַרְאֵיהֶן רַע
  choice: вид их остался таким же дурным
  rationale: מַרְאֶה означает видимый облик, а רַע — плохой, дурной. «Остался» контекстуально выражает результат сравнения с первоначальным состоянием; «таким же» раскрывает силу последующего כַּאֲשֶׁר, не уточняя, были ли коровы безобразными, тощими или болезненными.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: как и вначале
  rationale: Фраза сопоставляет их вид после поглощения с первоначальным видом. «Как и вначале» естественно и точно передаёт временное сравнение.
- source_word: וָאִיקָץ
  choice: Тут я проснулся
  rationale: Wayyiqtol, 1-е лицо единственного числа, завершает пересказ сна. «Тут» естественно отмечает непосредственную последовательность, не вводя причинной связи.
