source:
  edition: WLC
  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: ru
  text: Тогда фараон снял со своей руки перстень с печатью[a] и надел его на руку Иосифа; он облачил Иосифа в одежды из тонкого льна[b] и возложил ему на шею золотую цепь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кольцо». Еврейское слово может обозначать кольцо вообще, но в данном царском контексте, вероятно, имеется в виду перстень с печатью — знак переданной власти.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово שֵׁשׁ обозначает высококачественный лён, служивший признаком богатства и почёта.
    reason: cultural_note
  - marker: c
    text: 'Или: «золотое ожерелье» либо «золотой воротник». Точная форма обозначенного еврейским словом шейного украшения неизвестна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: снял
  rationale: Глагол означает удаление или снятие; применительно к перстню естественно русское «снял».
- source_word: טַבַּעְתּוֹ
  choice: перстень с печатью
  rationale: Само существительное может обозначать кольцо или перстень вообще, но в царском административном контексте речь, вероятно, о печатном перстне как знаке переданной власти.
- source_word: מֵעַל יָדוֹ
  choice: со своей руки
  rationale: Идиоматично передаёт пространственное значение еврейского оборота и ясно указывает на фараона.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: и надел его на руку Иосифа
  rationale: Хотя נתן обычно значит «дать» или «положить», сочетание с перстнем и выражением «на руку» описывает надевание.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: он облачил Иосифа
  rationale: «Облачил» сохраняет торжественный характер церемонии и избегает двусмысленности русского местоимения при двух мужских участниках.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: в одежды из тонкого льна
  rationale: שֵׁשׁ обозначает высококачественный лён, связанный с богатством и почётом; формулировка точна и понятна современному читателю.
- source_word: רְבִד הַזָּהָב
  choice: золотую цепь
  rationale: Термин обозначает золотое шейное украшение, точная форма которого не вполне ясна; «цепь» естественно в контексте почётного облачения.
- source_word: עַל צַוָּארוֹ
  choice: ему на шею
  rationale: Естественная русская передача буквального «на его шею» применительно к возложению украшения.
