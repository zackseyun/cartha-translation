base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: ru
  text: 'И сказал Иосиф фараону: «Сны фараона — одно целое[a]. То, что делает Бог, Он возвестил фараону[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сон фараона — один». По контексту два сна фараона составляют единое откровение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «то, что Бог намерен сделать» или «то, что Бог вскоре сделает». Еврейская причастная форма может обозначать совершаемое действие; в данном контексте она также может указывать на предстоящее исполнение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной глагольной формой продолжает повествование; обычное русское «И сказал» сохраняет эту связь без утяжеления.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: Сны фараона — одно
  rationale: Хотя חֲלוֹם стоит в единственном числе, по контексту речь о двух снах, составляющих единое откровение. Множественное «сны» проясняет референцию, а «одно» сохраняет выражение исходного текста и его смысловую напряжённость.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Определённое обозначение Бога естественно передаётся по-русски без артиклевого эквивалента.
- source_word: עֹשֶׂה
  choice: делает
  rationale: Причастная форма буквально представляет действие Бога как совершаемое; настоящее время не добавляет прямо не выраженной будущности, хотя контекст указывает на предстоящее осуществление.
- source_word: הִגִּיד
  choice: возвестил
  rationale: Порода хифиль глагола נגד означает «сообщить, объявить, дать знать». «Возвестил» сохраняет торжественный оттенок Божьего откровения и остаётся понятным современному читателю.
- source_word: לְפַרְעֹה
  choice: фараону
  rationale: Русский дательный падеж естественно передаёт косвенный объект с לְ.
theological_decisions:
- issue: Временная направленность עֹשֶׂה
  choice: что Он делает
  alternative: что Он намерен сделать / что Он вскоре сделает
  rationale: Еврейское причастие само по себе допускает актуальное либо близкое предстоящее действие. Основной текст сохраняет более формальное «делает», а примечание отмечает обусловленный контекстом будущий оттенок, не превращая его в бесспорное значение формы.
- issue: Единство двух снов
  choice: Сны фараона — одно
  alternative: Сон фараона один / Сны фараона означают одно и то же
  rationale: Формулировка сохраняет утверждение об их единстве, не сводя его исключительно к одинаковому значению и не скрывая грамматического единственного числа оригинала.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Повтор слова «фараон» сохранён вслед за еврейским текстом. Заглавное «Он» использовано по принятой русской издательской традиции для ясной отсылки к Богу, без добавления отдельного богословского утверждения.
