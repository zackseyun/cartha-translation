  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: ru
  text: И вот, вслед за ними поднялись семь других коров — хилых, очень безобразных с виду и тощих. Никогда во всей земле Египетской я не видел настолько безобразных коров.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет яркий повествовательный указатель, вводящий следующую картину сна, и естественно звучит в современном русском.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: семь других коров
  rationale: Передаёт число, женский род животных и противопоставление первой группе коров.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: вслед за ними вышли
  rationale: Причастная форма в пересказе сна естественно передана личным глаголом; «вышли» сохраняет движение вверх и наружу из Нила, понятное из контекста.
- source_word: דַּלּוֹת
  choice: хилых
  rationale: Передаёт слабость и жалкое физическое состояние, не дублируя последующее указание на худобу.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: очень безобразных с виду
  rationale: В данном сочетании רָעוֹת характеризует внешний облик, а не нравственное зло; формулировка ясна и естественна по-русски.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: и тощих
  rationale: Идиоматически передаёт буквальное «тонких плотью», то есть крайнюю телесную худобу, без неестественного русского оборота.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: Таких ... коров я не видел
  rationale: Естественно выражает отсутствие в прошлом какого-либо сопоставимого примера.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: во всей земле Египетской
  rationale: Сохраняет традиционное географическое обозначение и высокий, но понятный регистр.
- source_word: לָרֹעַ
  choice: таких жалких
  rationale: Передаёт итоговую широкую оценку их исключительно плохого вида и состояния, не сводя смысл только к внешней некрасивости и не создавая оттенка нравственной «плохости».
