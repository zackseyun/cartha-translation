lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: управлять моим домом
  rationale: Предлог עַל при בַּיִת в этом контексте обозначает власть и надзор. «Дом» сохраняет широту еврейского выражения, которое может охватывать и двор, и всё хозяйство фараона.
- source_word: עַל־פִּיךָ
  choice: твоему слову
  rationale: Буквально «по твоим устам». «Твоему слову» естественно передаёт распоряжение, исходящее от Иосифа, не добавляя более узкого значения «приказ».
- source_word: יִשַּׁק
  choice: будет повиноваться
  rationale: Обычное значение глагола — «целовать», однако здесь сочетание, вероятно, выражает подчинение или почтительное повиновение распоряжениям Иосифа. Буквальный образ сохранён в сноске ввиду лексической неоднозначности.
- source_word: כָּל־עַמִּי
  choice: весь мой народ
  rationale: Прямой и естественный коллективный эквивалент.
- source_word: רַק הַכִּסֵּא
  choice: Только престолом
  rationale: רַק вводит единственное ограничение власти Иосифа; творительный оборот кратко и близко к оригиналу указывает, в каком отношении фараон остаётся выше.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: я буду выше тебя
  rationale: Конструкция גדל מן выражает превосходство. «Буду выше тебя» естественно обозначает более высокий статус, а упоминание престола ограничивает это превосходство царской властью.
