lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: Мне приснился сон
  rationale: Естественная современная русская передача еврейской конструкции с однокоренными глаголом и существительным.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: но некому его истолковать
  rationale: Передаёт отсутствие человека, способного выступить истолкователем сна; противительный союз естественно выражает связь частей фразы.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: стоит тебе услышать сон — и ты можешь его истолковать
  rationale: Сохраняет упоминание слушания сна и передаёт подразумеваемую способность Иосифа истолковать услышанное, не утверждая, что одно слушание механически гарантирует толкование.
