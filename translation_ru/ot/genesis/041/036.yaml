  source_fidelity: 'Перевод точно передаёт синтаксис и смысл еврейского текста: продовольствие предназначено как запас для страны на предстоящие семь голодных лет, чтобы страна не погибла от голода. Будущее значение וְהָיָה и תִּהְיֶיןָ отражено корректно. «Не погибла» является естественной контекстуальной передачей נִכְרְתָה; буквальный образ «быть отсечённой» сохранён в сноске.'
