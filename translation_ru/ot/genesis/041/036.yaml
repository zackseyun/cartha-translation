  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: ru
  text: Это продовольствие будет запасом для страны на семь лет голода, которые наступят в Египте,[a] чтобы страна не погибла от голода.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Египетской земле».'
    reason: literal_rendering
  - marker: b
    text: 'Буквально: «чтобы страна не была отсечена голодом»; то есть чтобы она не погибла и не была разорена из-за голода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָאֹכֶל
  choice: это продовольствие будет
  rationale: Форма וְהָיָה в данном предписывающем и ориентированном на будущее контексте передана будущим временем. הָאֹכֶל означает пищу или продовольствие вообще; слово «продовольствие» естественно для описания общегосударственного запаса и не сужает значение до одного лишь зерна.
- source_word: לְפִקָּדוֹן
  choice: запасом
  rationale: Существительное обозначает то, что сохраняют и сберегают для последующего употребления. «Запас» точно и естественно передаёт смысл в контексте подготовки к голоду.
- source_word: לָאָרֶץ
  choice: для страны
  rationale: אֶרֶץ здесь обозначает Египет как страну. «Страна» яснее современному читателю, чем буквальное «земля», и позволяет сохранить отнесение последующей угрозы ко всей стране.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: на семь лет голода
  rationale: Предлог לְ выражает предназначение запаса на предстоящий период. Определённость этих семи лет следует из уже изложенного сна и его истолкования.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: которые наступят в Египте
  rationale: Относительное предложение указывает на будущие годы голода. Глагол «наступят» по-русски естественно сочетается с годами, а «в Египте» без смысловой потери передаёт בְּאֶרֶץ מִצְרָיִם.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ בָּרָעָב
  choice: чтобы страна не погибла от голода
  rationale: Нифаль глагола כרת буквально передаёт образ отсечения, но применительно к стране означает её гибель или разорение. «Не погибла от голода» ясно выражает смысл; исходный образ отмечен в сноске.
