  source_fidelity: 'Основной текст в целом верно передаёт последовательность и повтор ключевого слова אֹכֶל («пища»), а также локальный смысл בְּתוֹכָהּ: пища с окружающих полей помещалась в соответствующем городе. Однако сноска неверно определяет антецедент относительного местоимения: אֲשֶׁר סְבִיבֹתֶיהָ относится к «городу», а не к «полю».'
