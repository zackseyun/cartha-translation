  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: ru
  text: Он собрал всю пищу за семь лет, которые были в земле Египта, и поместил пищу в городах. В каждом городе он поместил пищу с полей вокруг него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пищу поля города, который вокруг него, он поместил внутри него». В еврейском тексте слово «пища» повторяется, а мысль о помещении пищи в городе возобновляется для усиления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Глагол קבץ означает собирать воедино; «собрал» естественно и точно передаёт его в повествовательном контексте.
- source_word: כָּל אֹכֶל
  choice: всю пищу
  rationale: אֹכֶל шире, чем «зерно», поэтому «пища» сохраняет объём значения исходного слова и не вносит излишнего уточнения.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: за семь лет, которые были в земле Египетской
  rationale: Предлоговое «за семь лет» естественно обозначает период сбора, а придаточное сохраняет близкую к еврейской формулировку «которые были» и её отсылку к годам изобилия.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: разместил пищу по городам
  rationale: נתן буквально означает «положил, поместил»; «разместил по городам» ясно передаёт распределение, не подменяя глагол более толковательным «запас».
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: пищу с полей вокруг каждого города
  rationale: Формулировка естественно передаёт связь пищи с полевыми угодьями, окружавшими соответствующий город.
- source_word: נָתַן בְּתוֹכָהּ
  choice: он поместил в самом этом городе
  rationale: «В самом этом городе» передаёт локальное בְּתוֹכָהּ и подчёркивающую возвратную конструкцию, сохраняя повтор глагольной мысли исходника.
