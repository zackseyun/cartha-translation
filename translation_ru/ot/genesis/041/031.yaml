    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: не будут знать
  rationale: Нифаль глагола ידע допускает значения «быть известным», «узнаваться», «быть заметным». Безличная русская конструкция естественно передаёт мысль, что прежнее изобилие перестанет ощущаться и вспоминаться, не сводя смысл только к зрительной заметности.
- source_word: הַשָּׂבָע
  choice: изобилие
  rationale: Существительное обозначает обилие урожая и достаток предшествующих лет; «изобилие» точно и естественно для данного контекста.
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: Речь идёт о территории Египта, а не обо всей земле как мире; «страна» ясно передаёт региональный смысл.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: 'Предлог выражает причину: последующий голод сделает прежнее изобилие неощутимым.'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: того голода, что наступит после этого
  rationale: Формулировка сохраняет указательное значение הַהוּא и временную последовательность אַחֲרֵי כֵן, оставаясь естественной по-русски.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: потому что он будет очень тяжёлым
  rationale: При описании голода כָבֵד означает исключительную тяжесть. Русское «тяжёлый голод» естественно сохраняет образ исходного текста и его интенсивность.
