  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: ru
  text: И вот вслед за ними росли семь колосьев — иссохших, тонких, опалённых восточным ветром.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт живое указание на новый образ во сне и сохраняет повествовательный акцент.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: семь колосьев
  rationale: В данном земледельческом контексте שִׁבֳּלִים означает колосья, а не стебли.
- source_word: צְנֻמוֹת
  choice: иссохших
  rationale: Редкое слово описывает сморщенность или иссушенность; отдельный перевод сохраняет накопление характеристик в еврейском тексте.
- source_word: דַּקּוֹת
  choice: тонких
  rationale: Прямо передаёт значение худобы, тонкости или скудости и не смешивает это определение с предшествующим צְנֻמוֹת.
- source_word: שְׁדֻפוֹת קָדִים
  choice: опалённых восточным ветром
  rationale: Передаёт повреждение колосьев горячим и сухим восточным ветром; «опалённых» естественно звучит применительно к растениям.
- source_word: צֹמְחוֹת אַחֲרֵיהֶם
  choice: вслед за ними росли
  rationale: Причастная форма изображает продолжающийся рост в сцене сна, а אַחֲרֵיהֶם указывает на появление после ранее названных колосьев.
