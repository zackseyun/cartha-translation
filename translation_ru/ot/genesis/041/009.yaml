  text: 'Тогда начальник виночерпиев сказал фараону: «Сегодня я вспоминаю о своих проступках[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грехи»; или: «провинности». Еврейское слово может обозначать как нравственную вину, так и нарушение обязанностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Тогда ... заговорил
  rationale: Последовательная форма с וַ продвигает повествование. «Тогда» естественно передаёт переход к следующему событию, а «заговорил» уместно вводит речь.
- source_word: שַׂר הַמַּשְׁקִים
  choice: начальник виночерпиев
  rationale: Придворный титул обозначает главного над служителями, подававшими напитки фараону. Этот вариант точен, понятен и сохраняет исторический колорит.
- source_word: אֶת־פַּרְעֹה
  choice: с фараоном
  rationale: При русском глаголе «заговорил» конструкция «с фараоном» естественно передаёт направленность речи; еврейский показатель прямого дополнения отдельно не переводится.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартная формула введения речи естественно выражена русской пунктуацией без избыточного «сказав».
- source_word: אֶת חֲטָאַי
  choice: свои проступки
  rationale: חטא может обозначать грехи, проступки или провинности. В придворном контексте «проступки» сохраняет нравственный оттенок, но не утверждает более узкое богословское значение.
- source_word: אֲנִי מַזְכִּיר
  choice: я вспоминаю
  rationale: Порода хифиль от זכר здесь может означать «припоминать», «упоминать» или «напоминать». По контексту виночерпий вызывает в памяти и признаёт прежние проступки; «вспоминаю» естественно сохраняет этот смысл.
- source_word: הַיּוֹם
  choice: Сегодня
  rationale: Современный и точный эквивалент с сохранением временного акцента исходного текста.
theological_decisions:
- issue: Нравственная или служебная окраска חֲטָאַי
  choice: проступки
  alternative: грехи; провинности
  rationale: Исходное слово допускает как нравственное, так и более широкое значение вины или нарушения обязанностей. Основной текст не должен без необходимости сужать его до исключительно богословского понятия греха.
translation_notes:
  register: Современный литературный русский язык с умеренно dignified библейским регистром. «Виночерпий» сохраняет придворно-историческую точность, а синтаксис прямой речи остаётся естественным для современного читателя.
