base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: ru
  text: И в одну и ту же ночь нам обоим — мне и ему — приснились сны; каждому из нас приснился сон, соответствующий истолкованию этого сна.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И мы видели сны в одну ночь, я и он; каждый — согласно истолкованию своего сна — мы видели сны».'
    reason: Передаёт повтор глагола «видеть сны» в еврейском тексте и его необычное сочетание с распределительным «каждый», сохраняя связь каждого сна с его истолкованием.
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: нам обоим приснились сны
  rationale: Еврейская конструкция буквально означает «мы увидели сон», но далее речь идёт о разных снах двух людей. Русское множественное число естественно передаёт смысл, а «нам приснились» соответствует обычному русскому выражению.
- source_word: בְּלַיְלָה אֶחָד
  choice: в одну и ту же ночь
  rationale: Буквально «в одну ночь»; в контексте подчёркнуто, что оба сна были увидены в ту же самую ночь.
- source_word: אֲנִי וָהוּא
  choice: мне и ему
  rationale: Сохраняет порядок участников исходного текста и согласуется с естественной русской конструкцией «нам приснились».
- source_word: אִישׁ
  choice: каждому
  rationale: 'Слово употреблено дистрибутивно: каждый из двух мужчин увидел собственный сон.'
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: сон со своим значением
  rationale: כְּ выражает соответствие сна его истолкованию. «Значение» здесь естественнее по-русски, чем тяжеловесное «согласно истолкованию», и не утверждает, что истолкование уже было дано в момент сна.
- source_word: חָלָמְנוּ
  choice: приснился сон
  rationale: Заключительный глагол возобновляет мысль и вместе с дистрибутивным «каждому» передаётся формой единственного числа.
