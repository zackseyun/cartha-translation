  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: ru
  text: 'Он велел посадить его на вторую из своих колесниц, и перед ним возглашали: «Аврех!»[a] И поставил его над всей землёй Египта.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Аврех» — слово с неясным значением, возможно египетское или древнееврейское торжественное восклицание. Многие понимают его приблизительно как «Преклоните колени!»
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: Он велел везти его
  rationale: Каузативная порода глагола רכב указывает, что фараон распорядился везти Иосифа; эта формулировка естественно передаёт каузативный смысл по-русски.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: на своей второй колеснице
  rationale: מִשְׁנֶה здесь обозначает второе место или ранг; речь, вероятнее всего, о колеснице фараона, следующей по статусу после его собственной главной колесницы. Русское притяжательное местоимение естественно передаёт относительное אֲשֶׁר־לוֹ.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: и перед ним возглашали
  rationale: קרא в контексте торжественного шествия означает публично выкрикивать или провозглашать; «перед ним возглашали» сохраняет и пространственное значение, и официальный характер сцены.
- source_word: אַבְרֵךְ
  choice: Аврех
  rationale: Значение слова неясно; возможно, это египетское заимствование либо древнееврейское торжественное восклицание. Транслитерация не устраняет исходную неоднозначность.
- source_word: וְנָתוֹן אֹתוֹ
  choice: Так он поставил его
  rationale: Необычная конструкция с абсолютным инфинитивом подводит итог возвышению Иосифа. «Так» естественно выражает результирующую связь, не перегружая русский текст.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: над всей землёй Египетской
  rationale: עַל обозначает власть над территорией, а традиционно понятное сочетание «земля Египетская» сохраняет территориальный смысл אֶרֶץ и достоинство регистра.
