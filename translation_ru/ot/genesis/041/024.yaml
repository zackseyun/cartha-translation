lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: поглотили
  rationale: Глагол בלע передаёт яркий образ проглатывания; «поглотили» естественно звучит применительно к необычному образу сна и не ослабляет его.
- source_word: שִׁבֳּלִים
  choice: колосья
  rationale: В данном земледельческом контексте слово обозначает колосья зерновых; это точный и обычный русский эквивалент.
- source_word: הַדַּקֹּת
  choice: тонкие
  rationale: Сохраняет прямое значение прилагательного и контраст с хорошими колосьями, не добавляя признаков вроде пустоты или иссушенности.
- source_word: הַטֹּבוֹת
  choice: хорошие
  rationale: Буквально и естественно передаёт широкое значение טוב, не конкретизируя его как «полные» или «здоровые».
- source_word: וָאֹמַר אֶל
  choice: Я рассказал об этом
  rationale: Буквально конструкция означает «я сказал [обратился] к», но в контексте подразумевается рассказ о сне. «Рассказал об этом» естественно выражает подразумеваемый объект, не вводя нового содержания.
- source_word: הַחַרְטֻמִּים
  choice: египетским мудрецам
  rationale: Термин обозначает придворных египетских специалистов по тайному знанию, знамениям и снам. «Мудрецы» избегает современного оттенка сценической магии; культурная специфика пояснена в сноске.
- source_word: וְאֵין מַגִּיד לִי
  choice: но никто не смог объяснить мне смысл сна
  rationale: Форма от נגד здесь по контексту означает сообщить или открыть значение сна. Перевод естественно передаёт результативный смысл, тогда как буквальное «никто не сообщал мне» по-русски неясно.
