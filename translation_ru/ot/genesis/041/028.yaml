  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: ru
  text: 'Вот о чём я говорил фараону: Бог показал фараону, что Он собирается сделать[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Бог делает». Еврейское причастие может обозначать настоящее либо предстоящее действие; в контексте толкования сна речь идёт о грядущих событиях, открытых фараону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Вот то
  rationale: Идентифицирующая конструкция естественно передаётся по-русски как «Вот то»; она указывает на уже данное Иосифом объяснение.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל פַּרְעֹה
  choice: о чём я говорил фараону
  rationale: Русское управление «говорить кому о чём» естественно выражает относительную конструкцию и сохраняет значение речи, обращённой к фараону.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В данном контексте форма с артиклем обозначает Бога, о котором говорит Иосиф; русский язык не требует передачи артикля.
- source_word: עֹשֶׂה
  choice: намерен сделать
  rationale: Причастие обозначает действие Бога, раскрытое во сне как предстоящее. Формулировка передаёт направленность к будущему, не усиливая её до значения немедленности.
- source_word: הֶרְאָה אֶת פַּרְעֹה
  choice: показал фараону
  rationale: Каузативная форма глагола ראה означает «показал»; фараон выступает лицом, которому Бог открыл содержание будущего действия.
theological_decisions:
- issue: Передача הָאֱלֹהִים в речи Иосифа
  choice: Бог
  alternative: Бог (с сохранением возможного формального оттенка «этот Бог» через артикль)
  rationale: Обычное русское именование сохраняет референцию еврейского текста и не добавляет конфессиональной интерпретации.
- issue: Временной оттенок причастия עֹשֶׂה
  choice: намерен сделать
  alternative: делает / собирается сделать
  rationale: Контекст толкования сна указывает на грядущие события, однако сама форма допускает настоящее или ближайшее будущее; основной текст передаёт будущую направленность, а примечание сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык; синтаксис упрощён до естественной русской конструкции, при этом сохранены повтор имени фараона, торжественная сдержанность речи Иосифа и временная неоднозначность причастия в примечании.
