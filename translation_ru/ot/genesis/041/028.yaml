    issue: «намерен сделать» для עֹשֶׂה
    rationale: Русское «намерен» обозначает волевое намерение, тогда как еврейское причастие означает «делает/совершает» и в данном контексте может иметь ближайше-будущее значение. «Собирается сделать» точнее передаёт контекстуальный будущий оттенок без дополнительного семантического компонента.
  - severity: low
    issue: Формулировка первой части
    rationale: «Вот о чём я говорил фараону» естественнее и точнее соотносит «дело/слово» с содержанием уже произнесённого объяснения, чем «Вот то, о чём…».
  - severity: low
    issue: Примечание формулирует альтернативы не вполне параллельно
    rationale: Следует дать основной контекстуальный вариант «собирается сделать» и альтернативу «делает», а пояснение связать непосредственно с причастием.
