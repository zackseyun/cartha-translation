lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Через
  rationale: Сочетание повествовательного וַיְהִי с מִקֵּץ вводит новое событие по завершении указанного срока. В современном русском «через» естественно и точно передаёт наступление события по окончании периода.
- source_word: שְׁנָתַיִם יָמִים
  choice: два полных года
  rationale: Буквальное «два года дней» — еврейский оборот, подчёркивающий полноту двухлетнего срока; слово «полных» передаёт эту функцию без неестественной кальки.
- source_word: פַרְעֹה
  choice: фараон
  rationale: Общепринятая русская передача египетского царского титула; строчная буква соответствует употреблению титула как обозначения правителя.
- source_word: חֹלֵם
  choice: увидел сон
  rationale: Причастная форма изображает фараона во время сна; русский повествовательный оборот «увидел сон» естественно вводит последующее содержание сна, не добавляя его истолкования.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к внезапно открывающейся картине сна. «Вот» сохраняет её наглядную и литературную функцию без архаичности.
- source_word: עֹמֵד
  choice: стоит
  rationale: Причастие представляет положение как продолжающуюся сцену; настоящее время после двоеточия сохраняет живую перспективу сна.
- source_word: עַל הַיְאֹר
  choice: у Нила
  rationale: Предлог עַל здесь обозначает положение возле реки, а יְאֹר в египетском контексте относится к Нилу. «У Нила» естественно передаёт пространственное отношение.
