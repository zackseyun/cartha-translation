  text: Предложение понравилось фараону и всем его слугам.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «И это дело было хорошо в глазах фараона и в глазах всех его слуг».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Дело понравилось фараону и всем его слугам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב
  choice: понравилось
  rationale: 'В сочетании с בְּעֵינֵי глагол выражает положительную оценку: нечто оказалось угодным или приемлемым. «Понравилось» естественно передаёт этот смысл по-русски.'
- source_word: הַדָּבָר
  choice: предложение
  rationale: Слово דָּבָר многозначно («слово», «дело», «то, о чём сказано»). Здесь оно относится к только что высказанному совету Иосифа, поэтому контекстуально точнее «предложение».
- source_word: בְּעֵינֵי
  choice: понравилось … фараону и … слугам
  rationale: Еврейская идиома буквально означает «было хорошо в глазах». В современном русском её естественный эквивалент — «понравилось»; буквальное «было хорошо в глазах» звучало бы неестественно.
- source_word: פַרְעֹה
  choice: фараону
  rationale: Традиционная русская передача египетского царского титула; дательный падеж обусловлен конструкцией с «понравилось».
- source_word: כָּל עֲבָדָיו
  choice: всем его слугам
  rationale: עֲבָדִים может обозначать рабов, слуг или царедворцев. «Слуги» сохраняет широту обозначения придворных, состоящих на службе у фараона, не сужая смысл до должностных лиц.
