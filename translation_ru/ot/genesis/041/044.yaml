base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: ru
  text: 'И сказал фараон Иосифу: «Я — фараон, и без тебя[a] никто не поднимет ни руки, ни ноги[b] во всей земле Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помимо тебя». В данном контексте это может означать: без твоего разрешения или участия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не поднимет своей руки и своей ноги» — образное выражение со значением «не предпримет никакого действия, не сделает ни одного шага».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной глагольной формой продолжает повествование; обычное русское «И сказал» естественно передаёт эту связь.
- source_word: אֲנִי פַרְעֹה
  choice: Я — фараон
  rationale: Прямо передаёт безглагольное предложение с торжественным самоутверждением власти, не добавляя отсутствующего в тексте усиления.
- source_word: וּבִלְעָדֶיךָ
  choice: но без тебя
  rationale: «Без тебя» сохраняет как буквальный смысл отсутствия/исключения, так и подразумеваемый контекст дозволения Иосифа; «но» естественно выражает противопоставление в русском.
- source_word: לֹא יָרִים אִישׁ
  choice: никто не поднимет
  rationale: Отрицательное местоимение «никто» естественно передаёт обобщённое אִישׁ при отрицании, а «не поднимет» сохраняет конкретный образ еврейского выражения.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: ни руки, ни ноги
  rationale: Русская отрицательная конструкция с повторным «ни» идиоматична и сохраняет обе части исходного образного выражения.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: во всей земле Египетской
  rationale: Традиционное, но понятное современному читателю территориальное обозначение, близкое к форме еврейского текста.
