  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: ru
  text: После них настанут семь лет голода, и всё изобилие в Египетской земле будет забыто, а голод опустошит землю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голод погубит землю». Еврейский глагол может означать полное опустошение или уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: настанут
  rationale: В предсказательном контексте форма обозначает будущее наступление следующих лет; «настанут» естественно передаёт последовательность и смысл возникновения периода.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: семь лет голода
  rationale: Конструкция прямо обозначает семилетний период массового недостатка пищи; «голод» — точный и привычный русский эквивалент.
- source_word: אַחֲרֵיהֶן
  choice: после них
  rationale: Местоименный суффикс женского рода во множественном числе отсылает к семи годам изобилия из предыдущего стиха.
- source_word: וְנִשְׁכַּח
  choice: будет забыто
  rationale: 'Нифаль от שׁכח имеет пассивный смысл: прежнее изобилие перестанут помнить из-за тяжести голода.'
- source_word: כָּל הַשָּׂבָע
  choice: всё изобилие
  rationale: שָׂבָע означает сытость, полноту и достаток; «изобилие» сохраняет широкий смысл и контраст с голодом.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египетской земле
  rationale: Сохраняет полную географическую формулу оригинала и звучит естественно в библейском повествовательном регистре.
- source_word: וְכִלָּה
  choice: истощит
  rationale: Пиэль от כלה может обозначать полное израсходование, уничтожение или доведение до конца. «Истощит» естественно описывает опустошающее действие голода на землю, не снимая оттенка крайнего разорения.
- source_word: הָרָעָב
  choice: голод
  rationale: Определённая форма указывает на уже упомянутый период голода; в русском повтор без указательного слова сохраняет связность.
- source_word: אֶת הָאָרֶץ
  choice: землю
  rationale: אָרֶץ здесь относится к Египетской земле в целом; выбор сохраняет повтор ключевого образа и широту воздействия.
