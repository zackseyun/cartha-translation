    issue: «Невзрачные» недостаточно точно передаёт וְהָרָעוֹת.
    rationale: В контексте внешнего вида слово означает плохие/дурные на вид; «невзрачные» чаще значит неприметные и не выражает отрицательной оценки облика с достаточной силой.
  - severity: low
    issue: Сочетание «семь первых, упитанных коров» синтаксически тяжеловесно и может читаться как «первые семь» в иной классификации.
    rationale: הָרִאשֹׁנוֹת отмечает коров, появившихся раньше во сне. «Семь прежних ... коров» яснее передаёт эту последовательность.
