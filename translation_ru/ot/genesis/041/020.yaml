  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: ru
  text: И тощие, дурные на вид коровы съели семь прежних упитанных коров.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «худые и дурные на вид коровы… семь первых, здоровых коров».'
