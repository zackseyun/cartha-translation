lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: съели
  rationale: Глагол אכל означает «есть, съедать». Русское «съели» естественно передаёт завершённое поглощение коров во сне без излишнего усиления, присущего слову «пожрали».
- source_word: הַפָּרוֹת
  choice: коровы
  rationale: Форма женского рода множественного числа указывает именно на коров, а не на крупный рогатый скот вообще.
- source_word: הָרַקּוֹת
  choice: тощие
  rationale: Прилагательное описывает истощённый внешний вид. «Тощие» в современном русском яснее и выразительнее, чем нейтральное «худые», и соответствует контексту сна.
- source_word: וְהָרָעוֹת
  choice: невзрачные
  rationale: Здесь רעות характеризует плохой внешний вид, а не нравственное зло. «Невзрачные» естественно передаёт этот зрительный смысл и сочетается с описанием коров.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: семь ... коров
  rationale: Показатель прямого дополнения, числительное и существительное переданы обычной русской конструкцией; определённость ясна из контекста и последующих определений.
- source_word: הָרִאשֹׁנוֹת
  choice: первых
  rationale: Слово обозначает коров, появившихся ранее; «первых» естественно сохраняет последовательность событий во сне.
- source_word: הַבְּרִיאֹת
  choice: упитанных
  rationale: В данном описании בְּרִיאֹת указывает на крепкое, хорошо откормленное состояние. «Упитанных» сохраняет телесный образ и контраст с тощими коровами; более общее «здоровых» также возможно.
