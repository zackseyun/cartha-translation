lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Обычный повествовательный глагол, вводящий ответ в прямой речи; русский эквивалент естественен и точен.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: אֶת־פַּרְעֹה
  choice: фараону
  rationale: Русский глагол «ответить» требует дательного падежа, поэтому прямое дополнение древнееврейской конструкции передано естественной русской формой.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Формула «сказав» в данном месте не нужна по нормам современного русского языка; её функцию естественно выполняет оформление прямой речи.
- source_word: בִּלְעָדָי
  choice: Не от меня это
  rationale: Выражение отрицает, что способность дать ответ исходит от Иосифа. Такая передача сохраняет противопоставление Иосифа Богу и звучит по-русски естественнее буквального «помимо меня».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Единственное число сказуемого и контекст речи Иосифа требуют формы единственного числа.
- source_word: יַעֲנֶה
  choice: даст … ответ
  rationale: В сочетании со שְׁלוֹם буквальное «ответит благополучие» по-русски невозможно; развернутая конструкция ясно передаёт действие и сохраняет связь с темой ответа.
- source_word: שְׁלוֹם פַּרְעֹה
  choice: фараону ответ во благо
  rationale: שָׁלוֹם обозначает мир, целость, благополучие или благоприятный исход. «Во благо» передаёт положительную направленность ответа, не сводя значение лишь к душевному спокойствию.
theological_decisions:
- issue: Источник способности истолковать сон
  choice: Иосиф отрицает, что ответ исходит от него, и прямо приписывает его Богу.
  alternative: «Не я» — более краткая передача, которая также противопоставляет Иосифа Богу.
  rationale: Конструкция בִּלְעָדָי и следующая за ней ссылка на Бога создают явное противопоставление; перевод сохраняет его без добавления богословских выводов.
- issue: Характер Божьего ответа фараону
  choice: «ответ во благо»
  alternative: «благоприятный ответ» или «ответ о благополучии фараона»
  rationale: Древнееврейское שְׁלוֹם допускает оттенки благополучия, мира и благоприятного исхода. Основной текст передаёт общий положительный смысл, а примечание сохраняет лексическую широту и синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с естественным оформлением прямой речи. Формулировка краткая и достойная; традиционные библейские имена сохранены. Необычная древнееврейская конструкция со שָׁלוֹם передана идиоматически, а её смысловой диапазон отмечен в сноске.
