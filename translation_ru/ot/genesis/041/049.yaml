  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: ru
  text: Иосиф накопил зерна чрезвычайно много, словно морского песка, пока не перестал считать, потому что ему не было счёта[a].
  philosophy: optimal-equivalence
  footnotes:
