lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: накопил
  rationale: Глагол צבר обозначает собирание и накопление запасов; «накопил» естественно передаёт административный контекст заготовки зерна.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Использована закрепившаяся в русском литературном и библейском употреблении форма еврейского имени.
- source_word: בָּר
  choice: зерна
  rationale: בָּר здесь обозначает зерно или хлебные злаки вообще, без уточнения конкретной культуры.
- source_word: כְּחוֹל הַיָּם
  choice: словно песка в море
  rationale: Сохранён образ морского песка как неисчислимого множества; русская конструкция согласована с партитивным «зерна».
- source_word: הַרְבֵּה מְאֹד
  choice: чрезвычайно много
  rationale: Передана усиленная степень количества, выраженная сочетанием הרבה מאד.
- source_word: עַד כִּי
  choice: пока не
  rationale: 'Оборот передаёт достигнутый предел или результат: накопление дошло до того, что счёт прекратили.'
- source_word: חָדַל לִסְפֹּר
  choice: перестал считать
  rationale: Единственное число естественно соотносится с Иосифом; формулировка ясна и современна.
- source_word: כִּי אֵין מִסְפָּר
  choice: потому что ему не было счёта
  rationale: Сохранён близкий русскому языку идиоматический образ отсутствия счёта, а причинная связь выражена явно.
