base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: ru
  text: С нами там был молодой еврей, раб начальника стражи. Мы рассказали ему свои сны, и он истолковал их нам — каждому в соответствии с его сном[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждому согласно его сну истолковал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: молодой еврей
  rationale: נַעַר обозначает юношу или молодого мужчину; в сочетании с этнонимом естественное современное русское выражение «молодой еврей» передаёт возраст, не создавая детского оттенка.
- source_word: עֶבֶד
  choice: раб
  rationale: Слово указывает на несвободное, зависимое положение Иосифа; «раб» точнее, чем более широкое «слуга».
- source_word: שַׂר הַטַּבָּחִים
  choice: начальник стражи
  rationale: Это придворная должность; буквально компонент הַטַּבָּחִים связан с исполнителями казней, однако в повествовательном контексте традиционное «начальник стражи» ясно передаёт функцию титула без неоправданной буквальности.
- source_word: וַנְּסַפֶּר לוֹ
  choice: мы рассказали ему свои сны
  rationale: Объект восстанавливается из непосредственного контекста и следующей фразы; добавление «сны» делает русскую речь естественной, не меняя смысла.
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: он истолковал их нам
  rationale: В контексте сновидений פתר означает «истолковывать»; местоимение «их» избегает ненужного повтора уже названных снов.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: каждому истолковал в соответствии с его сном
  rationale: Формулировка сохраняет распределительное значение אִישׁ и подчёркивает, что истолкование каждого соответствовало именно его сну, при этом оставаясь естественной по-русски.
