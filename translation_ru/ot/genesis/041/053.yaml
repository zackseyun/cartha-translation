lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: И закончились
  rationale: Форма wayyiqtol от כלה обозначает завершение периода; «закончились» естественно передаёт смысл и согласуется с подлежащим «семь лет».
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: семь лет изобилия
  rationale: Конструктивная цепочка буквально выражает семь лет, характеризуемых изобилием; эта формулировка ясна и естественна по-русски.
- source_word: אֲשֶׁר הָיָה
  choice: которые были
  rationale: Относительное придаточное относится к годам изобилия. Простое прошедшее время сохраняет еврейскую последовательность без ненужного усложнения.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в Египетской земле
  rationale: Сохраняет явное אֶרֶץ («земля, страна») и передаёт сочетание современным литературным русским языком.
