  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: ru
  text: И вот, из Нила выходят семь коров, красивых с виду и тучных, и пасутся среди болотной травы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди тростника»; еврейское слово обозначает болотную или прибрежную растительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет живой указательный маркер повествования и естественно звучит в современном русском языке.
- source_word: הַיְאֹר
  choice: из Нила
  rationale: В египетском контексте יְאֹר обозначает именно Нил, а не реку вообще.
- source_word: עֹלֹת
  choice: выходят
  rationale: Причастная форма изображает разворачивающееся перед глазами действие; настоящее время естественно передаёт непосредственность сна.
- source_word: פָּרוֹת
  choice: семь коров
  rationale: Существительное обозначает самок крупного рогатого скота; «коров» — прямой и общеупотребительный эквивалент.
- source_word: יְפוֹת מַרְאֶה
  choice: красивых с виду
  rationale: Естественно и достаточно близко передаёт характеристику приятной внешности.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: тучных телом
  rationale: Сохраняет образ телесной полноты, не сводя выражение к общему понятию здоровья или сытости.
- source_word: וַתִּרְעֶינָה
  choice: пасутся они
  rationale: Передаёт продолженное действие выпаса и поддерживает зримый характер сцены.
- source_word: בָּאָחוּ
  choice: среди болотной травы
  rationale: Передаёт прибрежную болотную растительность Нила, не сужая значение исключительно до тростника.
