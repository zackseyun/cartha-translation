  text: 'И тонкие колосья поглотили семь крепких и полных колосьев[a]. Фараон проснулся — и вот: это был сон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь тучных и полных колосьев». Еврейское прилагательное может обозначать здоровое, крепкое или упитанное состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: поглотили
  rationale: Глагол בלע буквально означает «глотать, поглощать». Выбор сохраняет яркий и сверхъестественный образ сна, не добавляя хищнического оттенка.
- source_word: הַשִּׁבֳּלִים
  choice: колосья
  rationale: В данном контексте שִׁבֹּלֶת обозначает зерноносную верхушку растения, то есть колос, а не весь стебель.
- source_word: הַדַּקּוֹת
  choice: тонкие
  rationale: Прямое соответствие прилагательному со значением «тонкий, тощий»; естественно описывает колосья и не смешивает их с образом коров из предыдущего сна.
- source_word: שֶׁבַע
  choice: семь
  rationale: Прямое соответствие количественному числительному.
- source_word: הַבְּרִיאוֹת
  choice: тучных
  rationale: Прилагательное בָּרִיא может обозначать здоровое, упитанное, крепкое состояние. В сочетании с колосьями «тучные» сохраняет образную силу оригинала, хотя в современном русском это литературное употребление.
- source_word: וְהַמְּלֵאוֹת
  choice: и полных
  rationale: Формально близко передаёт מלא, «полный»; применительно к колосьям подразумевает наполненность зерном, не заменяя её понятием зрелости.
- source_word: וַיִּיקַץ
  choice: проснулся
  rationale: Естественный современный русский эквивалент повествовательного глагола со значением пробуждения ото сна.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт указательно-эмфатическую функцию הִנֵּה и внезапность осознания без архаичного русского «се».
- source_word: חֲלוֹם
  choice: это был сон
  rationale: 'В еврейском кратко: «и вот — сон». Русская связочная конструкция естественно выражает осознание фараона, сохраняя лаконизм.'
