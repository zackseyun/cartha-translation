    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Qal глагола ילד здесь означает «родить»; это прямой и естественный русский эквивалент.
- source_word: הַבְּכִירָה
  choice: первенница
  rationale: Субстантивированная форма женского рода означает старшую по рождению дочь. «Первенница» сохраняет указание на первородство и понятно из контекста.
- source_word: בֵּן
  choice: сына
  rationale: Прямое дополнение при глаголе «родила»; неопределённость в русском языке не требует отдельного артикля.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: дала ему имя
  rationale: Естественная современная русская передача еврейской формулы «назвала его имя», без неуклюжего буквализма.
- source_word: מוֹאָב
  choice: Моав
  rationale: Традиционная русская форма библейского имени.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение возобновляет речь о названном сыне.
- source_word: אֲבִי מוֹאָב
  choice: праотец Моава
  rationale: אָב в данном контексте обозначает родоначальника. «Моав» буквально сохранён как имя, которое также представляет произошедший от него народ.
- source_word: עַד הַיּוֹם
  choice: до сего дня
  rationale: Устойчивое и достойное русское соответствие формуле, указывающей на продолжение до времени повествователя.
