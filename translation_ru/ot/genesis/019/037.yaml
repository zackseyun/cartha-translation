  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: ru
  text: Старшая дочь родила сына и назвала его Моавом[a]. Он — родоначальник Моава по сей день.
  philosophy: optimal-equivalence
  footnotes:
