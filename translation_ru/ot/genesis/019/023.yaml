  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: ru
  text: Солнце взошло над землёй[a], и Лот пришёл в Цоар.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «страна».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: солнце
  rationale: Определённое существительное с артиклем; в русском языке слово «солнце» в таком контексте обычно употребляется без дополнительных средств выражения определённости.
- source_word: יָצָא
  choice: взошло
  rationale: Форма qal перфекта глагола יצא буквально означает «вышло», но применительно к солнцу естественно передаётся русским «взошло».
- source_word: עַל הָאָרֶץ
  choice: над землёй
  rationale: Предлог עַל допускает значение «над/на», а אֶרֶץ — «земля» или «страна». «Над землёй» естественно описывает восход и сохраняет широту значения еврейского слова.
- source_word: וְלוֹט
  choice: и Лот
  rationale: Простой союз וְ передан союзом «и»; имя לוֹט передано в принятой русской форме «Лот».
- source_word: בָּא
  choice: пришёл
  rationale: Qal перфект глагола בוא означает прибытие или вхождение. «Пришёл» естественно передаёт завершённое движение Лота к городу, не уточняя сверх текста временное соотношение двух действий.
- source_word: צֹעֲרָה
  choice: в Цоар
  rationale: Имя города снабжено направительным окончанием ה; русское «в Цоар» естественно выражает движение к месту назначения.
