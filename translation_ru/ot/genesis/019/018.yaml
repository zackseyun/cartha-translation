  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: ru
  text: 'Но Лот сказал им[a]: «Нет, прошу вас, господа мои!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нет, прошу, Господь мой!» Еврейскую форму אֲדֹנָי можно понимать как почтительное обращение в единственном числе, однако множественное «им» в данном контексте скорее указывает на обращение «господа мои».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но ... сказал
  rationale: Последовательная форма продвигает повествование, а союз «но» естественно передаёт возражение Лота в ответ на предыдущее повеление.
- source_word: לוֹט
  choice: Лот
  rationale: Традиционная русская форма библейского имени.
- source_word: אֲלֵהֶם
  choice: им
  rationale: Предлог אֶל с суффиксом 3-го лица мужского рода множественного числа прямо означает «им»; местоимение сохраняет форму еврейского текста.
- source_word: אַל
  choice: Нет
  rationale: В этой безглагольной мольбе отрицательная частица выражает решительное отклонение только что предложенного действия.
- source_word: נָא
  choice: прошу вас
  rationale: Частица просьбы передана естественной современной русской формулой; добавленное «вас» согласуется с множественным адресатом.
- source_word: אֲדֹנָי
  choice: господа мои
  rationale: В непосредственном контексте обращение направлено к двум посетителям, что поддерживает понимание формы как множественного числа. Порядок слов слегка возвышенный, но понятный и сохраняет лексическое значение обращения.
theological_decisions:
- issue: Следует ли понимать אֲדֹנָי как обращение к двум посетителям («господа мои») или как обращение к Богу («Господь мой»).
  choice: 'Обращение во множественном числе: «господа мои».'
  alternative: «Господь мой».
  rationale: Форма «им» указывает на множественных адресатов — двух посетителей/ангелов, поэтому ближайший синтаксический контекст поддерживает множественное обращение. Возможное прочтение как единственного почтительного или божественного титула сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Восклицательный знак передаёт настойчивость краткой мольбы; подлинная неоднозначность обращения сохранена в сноске.
