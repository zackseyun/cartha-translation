source:
  edition: WLC
  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: ru
  text: 'Вот, прошу: этот город достаточно близко, чтобы убежать туда, и он мал. Прошу, позволь мне спастись там. Разве он не мал? Тогда я останусь в живых.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и моя душа (или жизнь) будет жить». Здесь древнееврейское «моя душа/жизнь» — обычный способ сказать «я»; в контексте: «и я останусь в живых». Союз в начале фразы может выражать результат просьбы.'
    reason: Поясняет буквальную форму וּתְחִי נַפְשִׁי, не навязывая слову נֶפֶשׁ специализированного значения и не вводя неестественную кальку в основной текст.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Вот, прошу
  rationale: הִנֵּה привлекает внимание к находящемуся поблизости городу, а נָא передаёт настойчивую вежливую просьбу. Формула сохраняет срочность речи без архаического «се».
- source_word: הָעִיר הַזֹּאת
  choice: этот город
  rationale: Прямая и естественная передача существительного с указательным определением.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: достаточно близко, чтобы убежать туда
  rationale: «Достаточно близко» ясно выражает пригодность близкого места для бегства; שָׁמָּה передано наречием «туда».
- source_word: וְהִיא מִצְעָר
  choice: и он мал
  rationale: מִצְעָר обозначает малость города. «Мал» сохраняет повтор того же слова в следующем риторическом вопросе и звучит достойнее разговорного «маленький».
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Позволь мне, прошу, спастись там
  rationale: Когортатив выражает просьбу о разрешении или возможности спастись; в данном контексте מלט включает не только движение бегства, но и избавление от гибели.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: ведь он мал
  rationale: Отрицательный риторический вопрос по-русски естественно передаётся утверждением с «ведь», сохраняя ожидаемый утвердительный ответ и повтор מִצְעָר.
- source_word: וּתְחִי נַפְשִׁי
  choice: чтобы мне остаться в живых
  rationale: נֶפֶשׁ здесь обозначает самого говорящего, а сочетание с חיה означает сохранение жизни. Связь с предшествующей просьбой естественно передана как цель или желаемый результат.
theological_decisions:
- issue: Значение נַפְשִׁי в заключительной фразе
  choice: не вводить отдельную антропологическую сущность и передать идиому как «мне остаться в живых»
  alternative: «и оживёт моя душа» / «и будет жить моя жизнь»
  rationale: В контексте Лот просит сохранить ему жизнь; буквальная калька могла бы необоснованно придать слову נֶפֶשׁ специализированный смысл «душа» и затемнить обычную древнееврейскую идиому.
- issue: Логическая функция וְ перед וּתְחִי
  choice: 'цель или желаемый результат: «чтобы»'
  alternative: 'временная последовательность: «тогда»'
  rationale: После просьбы «позволь мне спастись» заключительная форма естественно выражает намерение или результат — сохранение жизни. Формальная неоднозначность союза отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой настойчивой просьбы. Повтор «мал» сохранён как важная часть довода Лота; архаизмы «се» и «душа моя будет жить» не используются. Маркер [a] помещён непосредственно после относящейся к нему заключительной фразы.
