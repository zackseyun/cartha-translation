base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: ru
  text: 'Когда они вывели их наружу, он сказал: «Спасайся, чтобы сохранить жизнь! Не оглядывайся назад[a] и нигде не останавливайся на равнине. Спасайся в горах[b], иначе погибнешь[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не смотри позади себя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на гору»; также возможно: «в горную местность».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы тебя не смело»; «иначе будешь уничтожен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: наружу
  rationale: Направительная форма указывает на движение из города или иного внутреннего пространства наружу; русский наречный эквивалент естественен и не добавляет отсутствующего в форме слова «город».
- source_word: הִמָּלֵט עַל נַפְשֶׁךָ
  choice: Спасайся, спасай свою жизнь
  rationale: Императив передаёт срочное бегство ради сохранения жизни. Повтор глагольного корня в русском не буквальный, но ясно выражает как повеление спасаться, так и идиоматический смысл עַל נַפְשֶׁךָ.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: Не оглядывайся назад
  rationale: Естественная русская передача запрета смотреть позади себя; сохраняет направленность взгляда назад.
- source_word: וְאַל תַּעֲמֹד
  choice: и нигде не останавливайся
  rationale: В контексте срочного бегства עמד означает задержаться или остановиться, а не просто принять стоячее положение.
- source_word: בְּכָל הַכִּכָּר
  choice: на равнине
  rationale: כִּכָּר обозначает равнинную область; отрицание вместе с בְּכָל естественно передано словом «нигде» перед глаголом.
- source_word: הָהָרָה
  choice: в горах
  rationale: Направительная форма означает движение в горную местность. Русское множественное число естественно выражает топографическое противопоставление равнине, не исключая буквального понимания «на гору».
- source_word: פֶּן תִּסָּפֶה
  choice: иначе погибнешь
  rationale: Форма נספה допускает значения «погибнуть», «быть уничтоженным» или «быть сметённым вместе с другими». Основной текст использует естественный и достаточно широкий русский эквивалент.
theological_decisions:
- issue: Кто произносит повеление
  choice: «он сказал»
  alternative: «они сказали» по смыслу, относя речь ко всей группе посланников
  rationale: В еврейском тексте глагол стоит в единственном числе. Перевод сохраняет эту грамматическую особенность и не уточняет личность говорящего сверх сказанного в тексте.
- issue: Характер грозящей участи
  choice: «иначе погибнешь»
  alternative: «чтобы тебя не смело» или «иначе будешь уничтожен»
  rationale: Выбрана широкая формулировка, не ограничивающая гибель конкретным физическим механизмом и сохраняющая связь с надвигающимся судом.
translation_notes:
  register: Современный литературный русский язык с краткими срочными повелениями. Повтор «Спасайся» сохраняет риторическую структуру стиха; речь обращена к одному мужчине, как и в еврейском тексте.
