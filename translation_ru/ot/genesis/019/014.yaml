source:
  edition: WLC
  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: ru
  text: 'Лот вышел и обратился к своим зятьям[a], которые собирались жениться на его дочерях: «Встаньте, уходите из этого места, потому что Яхве собирается уничтожить город!» Но зятьям казалось, что он шутит.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение может обозначать как женихов, собиравшихся жениться на дочерях Лота, так и мужчин, уже женившихся на них.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Но в глазах своих зятьёв он был словно шутящий».'
    reason: literal_rendering
lexical_decisions:
- source_word: חֲתָנָיו
  choice: своим зятьям
  rationale: חָתָן может обозначать как зятя, так и жениха дочери. Русское «зятья» естественно передаёт родство, а следующий оборот и сноска сохраняют неоднозначность семейного положения этих мужчин.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: которые собирались жениться на его дочерях
  rationale: Причастие буквально описывает «берущих его дочерей» в жёны и допускает как начавшийся или предстоящий, так и уже состоявшийся брак. Контекст следующего стиха склоняет к значению намерения, но альтернативу следует сохранить в сноске.
- source_word: קוּמוּ צְּאוּ
  choice: Встаньте, уходите
  rationale: Два повелительных глагола передают срочность и отрывистость речи. «Встаньте, уходите» звучит ясно и достойно в современном русском языке.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: из этого места
  rationale: Прямо передаёт исходный оборот и указательное значение «этого».
- source_word: מַשְׁחִית
  choice: готов уничтожить
  rationale: Причастие породы hифиль выражает предстоящее, уже близкое действие. Перевод сохраняет его неизбежность и близость, не утверждая, что разрушение уже началось.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: הָעִיר
  choice: город
  rationale: Определённый артикль указывает на уже известный из контекста город; в русском после глагола естественно сказать «уничтожить город».
- source_word: כִּמְצַחֵק
  choice: что он шутит
  rationale: Оборот описывает восприятие Лота как человека, говорящего несерьёзно. «Шутит» не усиливает значение до насмешки.
- source_word: בְּעֵינֵי חֲתָנָיו
  choice: зятьям казалось
  rationale: Еврейская идиома «в глазах его зятьев» естественно передаётся по-русски конструкцией «зятьям казалось».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и наиболее прямо отражает общепринятую научную реконструкцию произношения.
- issue: Брачный статус зятьёв Лота
  choice: мужчины, собиравшиеся жениться на дочерях Лота
  alternative: мужчины, уже женившиеся на его дочерях
  rationale: Форма לֹקְחֵי допускает обе временные интерпретации. Основной текст следует наиболее вероятному по ближайшему повествовательному контексту прочтению, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткими, настойчивыми повелениями в прямой речи. Синтаксис сделан естественным для обычного читателя, при этом брачный статус зятьёв и образное выражение заключительной фразы не сглажены без пояснения.
