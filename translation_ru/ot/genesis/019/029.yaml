  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: ru
  text: И вот, когда Бог уничтожил города равнины, Бог вспомнил об Аврааме[a] и вывел Лота из среды ниспровержения[b], когда ниспроверг города, в которых жил Лот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Бог вспомнил об Аврааме» означают, что Бог с верностью принял Авраама во внимание и стал действовать, а не то, что прежде Он его забыл.
    reason: cultural_note
  - marker: b
    text: 'Или: «из среды гибели». В еврейском тексте существительное «ниспровержение» родственно следующему глаголу «ниспроверг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Передаёт еврейскую повествовательную формулу и вводимую ею временную конструкцию без архаичного «и случилось так».
- source_word: בְּשַׁחֵת אֱלֹהִים
  choice: когда Бог уничтожил
  rationale: Инфинитивная конструкция с בְּ имеет временное значение; «уничтожил» естественно передаёт שׁחת в данном контексте.
- source_word: עָרֵי הַכִּכָּר
  choice: города равнины
  rationale: כִּכָּר здесь обозначает равнинную область Иордана; выбран традиционно понятный и контекстуально точный эквивалент.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: Бог вспомнил об Аврааме
  rationale: Сохранена библейская идиома זכר, не заменённая истолковывающим выражением вроде «поступил ради Авраама».
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: и вывел Лота
  rationale: В контексте удаления из области катастрофы русское «вывел» естественно выражает направленное наружу действие שׁלח, не вводя более сильного толкования «спас».
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: из самой гущи гибели
  rationale: «Из самой гущи» передаёт מִתּוֹךְ, а «гибель» — катастрофическое ниспровержение; сноска сохраняет формальную связь существительного со следующим глаголом הפך.
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: когда ниспроверг города
  rationale: Временное значение конструкции сохранено; «ниспроверг» отражает образ переворачивания/низвержения в הפך и его связь с הֲפֵכָה.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: в которых жил Лот
  rationale: Прямая и естественная передача относительного предложения; древнееврейская форма сама по себе не требует русского предпрошедшего значения.
theological_decisions:
- issue: Значение слов «Бог вспомнил об Аврааме»
  choice: Сохранить идиому в основном тексте и пояснить её в сноске.
  alternative: «Бог поступил ради Авраама» или «Бог принял Авраама во внимание».
  rationale: Глагол זכר применительно к Богу указывает не на восстановление утраченной памяти, а на действенное, верное внимание. Истолковывающая замена в основном тексте преждевременно устранила бы образность и возможную богословскую глубину выражения.
- issue: Связь избавления Лота с Авраамом
  choice: 'Сохранить последовательность: Бог вспомнил об Аврааме и вывел Лота, не добавляя явного причинного союза.'
  alternative: «Поэтому Бог спас Лота ради Авраама».
  rationale: Контекст предполагает связь между Божьим памятованием об Аврааме и избавлением Лота, но еврейский текст выражает её повествовательным соположением, а не прямо формулирует словами «ради» или «поэтому».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Краткая формула «И было» сохраняет еврейское повествовательное оформление; лексика избегает как разговорности, так и излишней церковнославянской архаики.
