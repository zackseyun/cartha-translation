  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: ru
  text: А мужчин, находившихся у входа в дом, они поразили слепотой[a], от малого до великого, так что те выбились из сил, пытаясь найти вход.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зрительным помрачением» или «зрительной дезориентацией»; редкое еврейское слово может обозначать нечто большее, чем обычная слепота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: поразили
  rationale: Форма Hiphil глагола נכה означает «ударить, поразить»; в сочетании с названием недуга русское «поразили слепотой» естественно передаёт причинённое состояние.
- source_word: הָאֲנָשִׁים
  choice: мужчин
  rationale: В данном контексте אֲנָשִׁים обозначает мужчин из толпы у дома Лота; винительный падеж обусловлен синтаксисом русского предложения.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: стоявших у входа в дом
  rationale: Оборот указывает на местонахождение мужчин. Причастие «стоявших» естественно восполняет подразумеваемое в еврейском тексте положение, не меняя смысла.
- source_word: בַּסַּנְוֵרִים
  choice: слепотой
  rationale: Редкое слово סַנְוֵרִים обозначает сверхъестественно вызванную неспособность нормально видеть. «Слепотой» ясно передаёт основной смысл, а возможные оттенки сохранены в сноске.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Сохранён меризм, охватывающий всю группу без исключения; формула может относиться к положению или значимости, поэтому её не следует сужать до возраста.
- source_word: וַיִּלְאוּ
  choice: выбились из сил
  rationale: Глагол לָאָה выражает изнеможение; современный русский оборот передаёт напряжённость и безуспешность усилий.
- source_word: לִמְצֹא
  choice: пытаясь найти
  rationale: Инфинитив указывает, на что были направлены изнурительные усилия; деепричастный оборот естественно выражает это по-русски.
- source_word: הַפָּתַח
  choice: вход
  rationale: Пֶתַח означает проём или вход. Повтор слова «вход» сохраняет лексический повтор еврейского текста и связывает конец стиха с началом.
theological_decisions:
- issue: Характер поражения, обозначенного словом סַנְוֵרִים
  choice: сверхъестественно причинённая слепота
  alternative: ослепляющее помрачение или зрительная дезориентация
  rationale: Повествование ясно указывает на нарушение зрения, из-за которого мужчины не могли найти вход, однако редкость термина не позволяет свести его значение исключительно к обычной слепоте. Основной вариант дан в тексте, нюансы — в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Сохранены меризм «от малого до великого» и повтор слова «вход»; редкий термин не истолкован чрезмерно узко.
