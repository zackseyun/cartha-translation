    issue: «спастись на горе»
    rationale: Предлог «на» обозначает местонахождение, тогда как הָהָרָה содержит направительное окончание и означает движение к горе. Кроме того, «спастись» может создавать впечатление, что спасение уже происходит на горе, а не что Лот не способен туда добраться.
  - severity: medium
    issue: Не выражена связка פֶּן
    rationale: Фраза «бедствие настигнет меня» превращает опасаемый результат в безусловное предсказание. «Иначе» естественно передаёт предупреждающую/опасающуюся функцию פֶּן в русском контексте.
