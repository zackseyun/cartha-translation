id: GEN.19.19
reference: Genesis 19:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: ru
  text: 'Вот, прошу тебя: твой слуга обрёл благоволение в твоих глазах, и ты оказал мне великую милость[a], сохранив мне жизнь. Но я не смогу добраться до горы — иначе бедствие[b] настигнет меня, и я умру.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доброту»; «неизменную любовь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «зло»; здесь имеется в виду губительное бедствие, которое может настигнуть Лота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Вот, прошу
  rationale: «Вот» привлекает внимание, а «прошу» передаёт вежливую настойчивость частицы נָא; сочетание естественно звучит в современной русской речи.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: обрёл благоволение в твоих глазах
  rationale: Сохранены как значение устойчивого оборота о благосклонном отношении, так и его еврейский образ.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: В данном обращении это почтительное самообозначение, а не указание прежде всего на юридический статус раба.
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: ты явил мне великую милость
  rationale: Передаёт каузативную идею величия проявленного חֶסֶד естественным русским оборотом, не прибегая к тяжеловесному «возвеличил».
- source_word: עָשִׂיתָ עִמָּדִי
  choice: явил мне
  rationale: Буквальное «сделал со мной» в сочетании с חֶסֶד по-русски идиоматично передаётся как проявление или оказание милости.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: сохранив мне жизнь
  rationale: Передаёт сохранение человека в живых без излишнего сотериологического оттенка слова «спасти».
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: Но я не смогу
  rationale: «Но» естественно выражает контраст, а форма первого лица сохраняет подчёркнутое личное опасение Лота.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: спастись на горе
  rationale: Форма с направительным окончанием обозначает движение к горе; «спастись» здесь естественно передаёт успешное бегство от гибели.
- source_word: פֶּן תִּדְבָּקַנִי
  choice: бедствие настигнет меня
  rationale: פֶּן вводит опасаемое последствие, а דבק в данном контексте означает, что бедствие догонит и настигнет Лота.
- source_word: הָרָעָה
  choice: бедствие
  rationale: В контексте уничтожения городов слово обозначает губительную беду, а не нравственное зло.
theological_decisions:
- issue: Передача חֶסֶד в просьбе, обращённой к небесным посланникам, действующим с Божьей властью
  choice: милость
  alternative: неизменная любовь; доброта; верность завету
  rationale: «Милость» передаёт благожелательное и спасающее деяние в данном контексте, не превращая слово в узкий технический термин и не приписывая тексту более явную формулу завета, чем выражено здесь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены почтительная форма просьбы, образ «в твоих глазах» и единственное число «на горе»; синтаксис сделан ясным для обычного читателя.
