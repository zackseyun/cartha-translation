- from: 'Вот, прошу: твой слуга обрёл благоволение в твоих глазах, и ты явил мне великую милость[a], сохранив мне жизнь. Но я не смогу спастись на горе: бедствие[b] настигнет меня, и я умру.'
  to: 'Вот, прошу тебя: твой слуга обрёл благоволение в твоих глазах, и ты оказал мне великую милость[a], сохранив мне жизнь. Но я не смогу добраться до горы — иначе бедствие[b] настигнет меня, и я умру.'
  rationale: Исправлены направление движения к горе и значение опасаемого последствия, вводимого פֶּן. «Оказал мне великую милость» естественно передаёт «сделал великой твою милость, которую ты оказал мне», не меняя смысла. Маркеры сносок сохранены у соответствующих лексем.
