base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: ru
  text: 'Когда занялась заря, ангелы стали торопить Лота: «Встань, возьми жену и двух дочерей, которые здесь, чтобы тебе не погибнуть при наказании города[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за беззакония города»; или: «из-за вины города». Еврейское слово может означать беззаконие, вину или наказание как последствие вины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Когда занялась заря
  rationale: Передаёт временное значение конструкции и образ наступающей зари естественным современным русским выражением.
- source_word: וַיָּאִיצוּ
  choice: стали торопить
  rationale: Глагол обозначает настойчивое побуждение действовать быстро; выбранное выражение передаёт срочность без излишней книжности.
- source_word: הַמַּלְאָכִים
  choice: ангелы
  rationale: В данном контексте речь идёт о небесных посланниках; «ангелы» точно и понятно передаёт референт.
- source_word: קוּם קַח
  choice: Встань, возьми
  rationale: Сохранены два отдельных повеления и их настойчивый ритм.
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ
  choice: жену и двух дочерей
  rationale: Прямо передаёт оба дополнения и указанное в еврейском тексте число дочерей.
- source_word: הַנִּמְצָאֹת
  choice: которые здесь
  rationale: Причастие означает находящихся или присутствующих; краткая формулировка естественна и отличает дочерей, находившихся рядом с Лотом.
- source_word: פֶּן תִּסָּפֶה
  choice: чтобы тебе не погибнуть
  rationale: Конструкция выражает предостережение, а форма единственного числа обращена к Лоту; «погибнуть» передаёт угрозу разделить судьбу обречённого города.
- source_word: בַּעֲוֺן הָעִיר
  choice: при наказании города
  rationale: В контексте суда עָוֹן может обозначать не только беззаконие или вину, но и их последствие — наказание. Предлог «при» позволяет естественно выразить опасность погибнуть во время постигшей город кары.
theological_decisions:
- issue: Значение עָוֹן в контексте суда
  choice: наказание города
  alternative: беззаконие города; вина города
  rationale: Непосредственно речь идёт о грозящей Лоту гибели при уничтожении Содома, поэтому в основном тексте передано последствие вины. Семантическая многозначность еврейского слова сохранена в сноске, без устранения связи между грехом, виной и наказанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Выражение «занялась заря» сохраняет образность, а повеления переданы кратко и настойчиво. Маркер сноски поставлен непосредственно после спорного выражения בַּעֲוֺן הָעִיר.
