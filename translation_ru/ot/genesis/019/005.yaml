base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: ru
  text: 'Они позвали Лота и сказали ему: «Где те мужчины, которые пришли к тебе этой ночью? Выведи их к нам, чтобы мы познали их».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, яснее по смыслу данного контекста: «чтобы вступить с ними в половую связь». Буквально по-еврейски: «познать их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: Они позвали Лота
  rationale: קרא אֶל в данном повествовательном контексте означает обратиться к кому-либо громким зовом; «позвали» передаёт это без добавления не выраженной прямо интенсивности.
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: Где те мужчины
  rationale: אַיֵּה — вопрос о местонахождении, а אֲנָשִׁים здесь обозначает именно мужчин — пришедших к Лоту посетителей. Указательное «те» естественно выделяет уже известных собеседникам людей.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: пришли к тебе этой ночью
  rationale: Фраза определяет посетителей по их приходу в эту ночь; «этой ночью» естественно передаёт הַלַּיְלָה в данном контексте.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Выведи их к нам
  rationale: Каузативная форма יצא требует значения «заставить выйти / вывести»; поскольку Лот находится внутри, русское «выведи» точно и естественно.
- source_word: וְנֵדְעָה אֹתָם
  choice: чтобы мы познали их
  rationale: ידע буквально означает «знать, познать». Форма «познали» сохраняет исходную лексику и намеренную многозначность, тогда как вероятный сексуальный смысл поясняется в сноске.
theological_decisions:
- issue: Следует ли прямо выразить сексуальное намерение в וְנֵדְעָה אֹתָם
  choice: Сохранить в основном тексте «чтобы мы познали их», а вероятный сексуальный смысл указать в сноске.
  alternative: 'Перевести явно: «чтобы вступить с ними в половую связь» или интерпретирующе: «чтобы надругаться над ними».'
  rationale: В контексте повествования выражение, вероятнее всего, имеет сексуальный и насильственный смысл, однако еврейский текст использует обычный глагол «знать». Буквальная формулировка сохраняет литературную двусмысленность и не превращает вероятное контекстуальное толкование в единственно возможную форму основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Познать» несколько возвышенно, но уместно для сохранения лексической формы и двусмысленности еврейского ידע; сноска делает вероятный смысл понятным современному читателю.
