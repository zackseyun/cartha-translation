base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: ru
  text: В ту ночь они напоили отца вином. Старшая вошла и легла с отцом; а он не знал ни когда она легла, ни когда встала.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он не знал о её отходе ко сну и о её вставании».'
    reason: Передаёт формальную конструкцию еврейского текста с существительными действия, тогда как основной текст естественно воспроизводит её временными придаточными.
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: напоили
  rationale: Форма гифиль от שׁקה передаёт понудительное значение «дать пить, напоить». Русское «напоили … вином» естественно выражает этот смысл.
- source_word: יַיִן
  choice: вином
  rationale: Обычное и контекстуально точное соответствие еврейскому יין.
- source_word: בַּלַּיְלָה הוּא
  choice: в ту ночь
  rationale: Естественное русское обозначение конкретной ночи, сохраняющее определённую временную отсылку.
- source_word: הַבְּכִירָה
  choice: старшая
  rationale: Слово буквально обозначает перворождённую женщину. В данном контексте «старшая» естественно указывает на старшую из двух дочерей, не утрачивая противопоставления по порядку рождения.
- source_word: וַתָּבֹא
  choice: вошла
  rationale: Сохраняет прямое значение глагола «войти» и уместно в повествовательном контексте.
- source_word: וַתִּשְׁכַּב אֶת
  choice: легла с
  rationale: Это устойчивое библейское обозначение половой связи. «Легла с» сохраняет эвфемистический и сдержанный регистр оригинала.
- source_word: וְלֹא יָדַע
  choice: он же не знал
  rationale: ידע здесь означает отсутствие осознания происходящего. Формально близкое «не знал» оставляет содержание незнания для следующих обстоятельственных оборотов.
- source_word: בְּשִׁכְבָהּ
  choice: когда она легла
  rationale: Инфинитивная конструкция с предлогом указывает на время или обстоятельство действия. Перевод не добавляет отсутствующего в этой фразе уточнения «с ним».
- source_word: וּבְקוּמָהּ
  choice: когда встала
  rationale: Параллельный временной оборот; «встала» звучит естественно и сохраняет связь с предшествующим «легла».
theological_decisions:
- issue: Степень осведомлённости Лота
  choice: «он же не знал ни когда она легла, ни когда встала»
  alternative: «он ничего не заметил»
  rationale: Перевод сохраняет буквальную формулировку и повествовательное напряжение текста, не расширяя утверждение до полного отсутствия какой-либо осведомлённости.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Сексуальный эвфемизм оригинала сохранён без огрубления; синтаксис слегка упрощён ради ясности, а параллелизм заключительной фразы удержан конструкцией «ни … ни …».
