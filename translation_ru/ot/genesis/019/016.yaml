base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: ru
  text: Но он медлил. Тогда те люди[a] крепко взяли его за руку, его жену за руку и обеих его дочерей за руки, потому что Яхве сжалился над ним; они вывели его и оставили за пределами города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть пришедшие к Лоту ангельские посланники; еврейский текст здесь называет их «людьми».
    reason: Контекстуальная идентификация действующих лиц при сохранении буквального обозначения основного текста.
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: он медлил
  rationale: Глагол обозначает промедление, задержку; «медлил» передаёт действие, не сводя его к внутреннему сомнению.
- source_word: הָאֲנָשִׁים
  choice: те люди
  rationale: В самом стихе употреблено обычное слово «люди», хотя из контекста известно, что это ангельские посланники. Указательное «те» естественно связывает их с предшествующим повествованием.
- source_word: וַיַּחֲזִקוּ ... בְּיָד
  choice: крепко взяли за руку
  rationale: Конструкция выражает решительное, настойчивое удержание. Такой перевод передаёт срочность спасения, но не добавляет излишней грубости.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: за руку его, его жену и обеих его дочерей
  rationale: Русское единственное число «за руку» может иметь распределительное значение для нескольких лиц; перечисление сохраняет всех четырёх участников без тяжеловесного повторения.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: потому что Яхве сжалился над ним
  rationale: Предлог перед חֶמְלָה здесь передаёт основание спасительного действия, а выражение «сжалился над ним» естественно выражает сострадание и жалость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменено титулом.
- source_word: וַיֹּצִאֻהוּ
  choice: они вывели его
  rationale: Каузативная форма глагола «выходить» означает, что эти люди обеспечили его выход из города.
- source_word: וַיַּנִּחֻהוּ מִחוּץ לָעִיר
  choice: оставили за пределами города
  rationale: Глагол означает поместить или оставить в определённом месте; «за пределами города» ясно обозначает положение вне городской черты.
theological_decisions:
- issue: Кем названы спасители Лота
  choice: те люди
  alternative: ангелы / посланники
  rationale: Хотя контекст раскрывает их как ангельских посланников, данный стих называет их «людьми». Основной текст сохраняет это повествовательное обозначение, а контекстуальная идентификация вынесена в примечание.
- issue: Передача мотива спасения
  choice: потому что Яхве сжалился над ним
  alternative: по милости Яхве к нему
  rationale: 'Сохранена явная причинная связь: решительное вмешательство посланников объясняется состраданием Яхве к Лоту.'
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Короткое первое предложение подчёркивает опасное промедление Лота; дальнейшая фраза сохраняет стремительность спасения. Использовано личное имя «Яхве».
