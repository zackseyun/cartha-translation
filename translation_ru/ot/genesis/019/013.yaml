  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: ru
  text: Мы вот-вот уничтожим это место, потому что их вопль[a] стал велик перед Яхве, и Яхве послал нас уничтожить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вопль против них стал велик перед Яхве». Еврейскую форму можно буквально понять как «их вопль», однако в данном контексте многие понимают её как вопль, поднявшийся против жителей этого места.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: скоро уничтожим
  rationale: Причастие породы хифиль может обозначать действие, которое вот-вот совершится. В прямой речи о близком суде сочетание «скоро уничтожим» естественно передаёт значение непосредственного будущего.
- source_word: הַמָּקוֹם הַזֶּה
  choice: это место
  rationale: Сохраняет обычное значение מָקוֹם и указательную силу הַזֶּה.
- source_word: גָדְלָה
  choice: стал велик
  rationale: Перфект глагола גדל передаёт достигнутый результат возрастания; выражение сохраняет образную силу оригинала и звучит возвышенно, но понятно.
- source_word: צַעֲקָתָם
  choice: их вопль
  rationale: Существительное обозначает крик бедствия, жалобы или протеста, а суффикс третьего лица множественного числа формально означает «их». Контекстуальная возможность значения «вопль против них» сохранена в сноске.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: пред Яхве
  rationale: Естественное русское соответствие идиоме «перед лицом Яхве», сохраняющее идею того, что вопль достиг Божьего присутствия и суда, без буквалистской тяжеловесности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: послал нас
  rationale: Форма обозначает завершённое поручение, результат которого действует в момент речи; русское простое прошедшее естественно выражает это в контексте.
- source_word: לְשַׁחֲתָהּ
  choice: уничтожить его
  rationale: Инфинитив выражает цель посланничества. Местоимение женского рода в еврейском относится к подразумеваемому городу или к месту как референту; в русском согласование с «место» требует формы «его».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Смысл צַעֲקָתָם
  choice: их вопль
  alternative: вопль против них
  rationale: Основной текст сохраняет наиболее прямое грамматическое значение местоименного суффикса и не снимает неоднозначность. Значимая контекстуальная трактовка приведена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Скоро уничтожим» ясно передаёт близость действия; «пред Яхве» и «вопль стал велик» сохраняют достоинство и образность оригинала. Маркер [a] помещён непосредственно после неоднозначного выражения в основном тексте.
