base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: ru
  text: 'Они сказали: «Отойди прочь![a]» И добавили: «Этот пришёл поселиться чужеземцем, а теперь ещё и судить вздумал![b] Сейчас мы поступим с тобой хуже, чем с ними».[c] И они с силой напирали на этого человека, на Лота,[d] и подошли, чтобы выломать дверь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посторонись!»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально с усилением: «Этот один пришёл жить чужеземцем — и судит, судит!» Возможен смысл: «а теперь ещё берётся быть судьёй».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «теперь мы причиним тебе зло больше, чем им» — угроза причинить Лоту больший вред, чем его гостям.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «сильно напирали на человека, на Лота». Повтор предлога подчёркивает, что натиск был направлен лично на Лота.'
    reason: source_clarity
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Отойди прочь!
  rationale: Сочетание императива с הָלְאָה в данном враждебном контексте требует приказа отступить или убраться с дороги. «Отойди прочь» передаёт силу реплики и звучит естественно по-русски.
- source_word: הָאֶחָד
  choice: Этот человек
  rationale: Указательное выражение имеет пренебрежительный оттенок. «Этот человек» сохраняет отчуждённость реплики, не переходя к чрезмерно разговорному «этот тип».
- source_word: בָּא לָגוּר
  choice: пришёл сюда жить чужеземцем
  rationale: Глагол גור обозначает проживание среди местных в положении пришлого, не принадлежащего к общине. Перевод передаёт именно общественный статус, а не просто краткость пребывания.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: а теперь ещё и судить вздумал
  rationale: Личный глагол с абсолютным инфинитивом усиливает обвинение. Русская конструкция передаёт возмущение тем, что Лот самонадеянно берётся их судить, не превращая фразу в нейтральное сообщение о должности судьи.
- source_word: נָרַע לְךָ מֵהֶם
  choice: мы поступим с тобой хуже, чем с ними
  rationale: Порода hифиль от רעע означает причинить зло или вред. Идиоматический русский перевод сохраняет сравнительную угрозу и не уточняет вид насилия сверх сказанного в тексте.
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: они с силой напирали на этого человека, на Лота
  rationale: В физическом контексте פצר описывает сильный нажим; מְאֹד усиливает действие. Повтор предлога перед «человеком» и «Лотом» отражён повтором «на», сохраняющим эмфатическую аппозицию.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: подошли, чтобы выломать дверь
  rationale: נגשׁ с инфинитивом обозначает приближение с намерением совершить действие. «Выломать дверь» естественно передаёт разрушительное применение שׁבר в данном контексте.
