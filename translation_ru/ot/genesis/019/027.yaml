  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: ru
  text: Авраам встал рано утром и пошёл к тому месту, где он стоял перед Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед лицом Яхве»; это еврейское выражение означает «перед Яхве», то есть в его присутствии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: встал рано
  rationale: Порода hифиль глагола שׁכם обычно означает «встать рано»; это передаёт временной акцент, не вкладывая в сам глагол идею движения.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Существительное בֹּקֶר означает «утро»; вместе с «встал рано» естественно образует по-русски выражение «встал рано утром».
- source_word: אֶל הַמָּקוֹם
  choice: и пошёл к тому месту
  rationale: Предлог אֶל обозначает направленность к месту. В русском языке после «встал» для естественной связи с обстоятельством направления требуется явно выразить подразумеваемое перемещение; союз «и» не меняет последовательности повествования.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: где он стоял
  rationale: Относительное наречие «где» естественно включает значение שָׁם («там»). Русское прошедшее время в контексте ясно отсылает к прежнему событию, не требуя отдельной формы давнопрошедшего времени.
- source_word: אֶת־פְּנֵי
  choice: перед
  rationale: В сочетании עמד את־פני выражение означает стоять перед кем-либо, то есть в его присутствии. «Перед» кратко и естественно передаёт идиому.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом; форма соответствует принятой современной русской передаче имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Передача «Яхве» сохраняет личное имя и не подменяет его титулом; вариант «Иегова» основан на более позднем смешении согласных имени с огласовкой замещающего чтения.
- issue: Значение выражения עָמַד ... אֶת־פְּנֵי יְהוָה
  choice: стоял перед Яхве
  alternative: стоял пред лицом Яхве; находился в присутствии Яхве
  rationale: Выражение передаёт нахождение Авраама перед Богом, но текст не уточняет его позу, роль или характер обращения сверх буквального «стоял». Поэтому сохранён глагол «стоял» и не добавлена богословская интерпретация.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранена торжественная простота библейского рассказа без архаизмов «пред» и «лице». Добавлен естественно подразумеваемый глагол движения «пошёл», поскольку русское «встал ... к месту» невозможно, тогда как אֶל явно задаёт направление.
