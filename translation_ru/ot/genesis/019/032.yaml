base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: ru
  text: Давайте напоим нашего отца вином и ляжем с ним, чтобы у нас было потомство[a] от нашего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «чтобы сохранить в живых семя от нашего отца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: Давайте
  rationale: Побудительная форма от הלך здесь служит призывом к совместному действию; «давайте» естественно передаёт эту функцию по-русски.
- source_word: נַשְׁקֶה
  choice: напоим
  rationale: Каузативная порода глагола שקה означает «дать пить, напоить»; форма «напоим» кратко и ясно сохраняет каузативный смысл.
- source_word: אָבִינוּ
  choice: нашего отца
  rationale: Прямое соответствие притяжательной конструкции; повтор во второй части стиха сохранён вслед за еврейским текстом.
- source_word: יַיִן
  choice: вином
  rationale: Обычное значение יין — «вино»; творительный падеж естественен при русском глаголе «напоить».
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: и ляжем с ним
  rationale: Сочетание שכב с עִם является сексуальным эвфемизмом. «Ляжем с ним» сохраняет образность и сдержанность оригинала, не делая выражение излишне разговорным или явным.
- source_word: וּנְחַיֶּה
  choice: чтобы сохранить
  rationale: Порода piel глагола חיה здесь имеет каузативное значение «сохранить живым, продолжить». В контексте рода естественно «сохранить потомство».
- source_word: מֵאָבִינוּ
  choice: от нашего отца
  rationale: Предлог מִן указывает на источник или происхождение потомства; «от нашего отца» прямо сохраняет эту смысловую связь.
- source_word: זָרַע
  choice: потомство
  rationale: זֶרַע буквально значит «семя», но в данном контексте обозначает детей или продолжение рода; «потомство» ясно передаёт контекстуальное значение.
theological_decisions:
- issue: Смысл выражения וּנְחַיֶּה ... זָרַע
  choice: сохранить потомство
  alternative: сохранить семя / продолжить род
  rationale: Перевод передаёт намерение продолжить род, не добавляя оценки поступка и не разрешая нравственное напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с сохранением сдержанного библейского эвфемизма. Побуждение передано естественным «давайте», а повтор «нашего отца» сохранён ради соответствия исходному тексту.
