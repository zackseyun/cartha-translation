base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: ru
  text: Лот поднялся из Цоара и поселился в горной местности; с ним были две его дочери, потому что он боялся жить в Цоаре. Он поселился в пещере[a] — он и две его дочери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «в пещере» с определённым артиклем. Он может обозначать конкретную пещеру, в которой поселился Лот; по-русски при первом упоминании естественно «в пещере».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִצּוֹעַר
  choice: ушёл из Цоара
  rationale: Глагол עלה буквально обозначает движение вверх; в данном контексте Лот покидает низменный Цоар и направляется в горы. Русское «ушёл из Цоара» естественно передаёт перемещение, а направление раскрывается следующими словами «в горах».
- source_word: וַיֵּשֶׁב בָּהָר
  choice: поселился в горах
  rationale: ישב здесь означает проживание или поселение. Единственное הַר может обозначать горную местность собирательно; «в горах» естественно и близко к топографическому смыслу.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: вместе с двумя своими дочерьми
  rationale: Естественно передаёт присоединённую безглагольную конструкцию и ясно указывает, что дочери находились с Лотом.
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: потому что боялся жить в Цоаре
  rationale: כִּי вводит причину, יָרֵא выражает состояние страха, а ישב в данном контексте означает проживание.
- source_word: וַיֵּשֶׁב בַּמְּעָרָה
  choice: Он поселился в пещере
  rationale: В еврейском тексте существительное определённое — буквально «в этой/той пещере» или «в пещере». Русское «в пещере» при первом упоминании звучит естественно, не требуя неопределённого артикля, которого в русском нет.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: с двумя своими дочерьми
  rationale: Передаёт повторное указание на обитателей пещеры. Перестройка необходима для естественного русского синтаксиса, при этом смысловой повтор сохраняется.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Сохранён повтор упоминания двух дочерей, присутствующий в еврейском тексте. «Поселился» выбрано вместо архаичного «обитал»; оно не обязательно подразумевает постоянное поселение.
