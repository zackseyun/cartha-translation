base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: ru
  text: 'И сказала старшая младшей: «Отец наш стар, и нет на земле мужчины, который вошёл бы к нам[a], как это водится по всей земле[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть вступил бы с нами в половую связь. В еврейском тексте употреблено эвфемистическое выражение «войти к нам».
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду обычный человеческий порядок, в данном контексте — половая близость и продолжение рода.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: старшая
  rationale: Слово обозначает первородную, то есть старшую дочь. В паре с «младшей» краткое «старшая» естественно по-русски и ясно передаёт порядок рождения из контекста.
- source_word: הַצְּעִירָה
  choice: младшей
  rationale: Сравнительное обозначение младшей по возрасту; форма естественно соответствует парному противопоставлению «старшая — младшая».
- source_word: אָבִינוּ זָקֵן
  choice: Отец наш стар
  rationale: Краткая именная конструкция сохраняет прямоту и несколько торжественный повествовательный строй еврейского текста.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: и нет на земле мужчины
  rationale: אִישׁ здесь обозначает именно мужчину, что существенно в контексте половой связи и продолжения рода; בָאָרֶץ передано буквально как «на земле».
- source_word: לָבוֹא עָלֵינוּ
  choice: который вошёл бы к нам
  rationale: Сохранён эвфемистический характер выражения о половой близости. Русское «войти к» соответствует библейскому способу выражения и не делает основной текст излишне явным.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: как это водится по всей земле
  rationale: Передаёт значение всеобщего обычая или обычного человеческого порядка, оставаясь понятным современному русскому читателю.
theological_decisions:
- issue: Смысл выражения «по всей земле»
  choice: Сохранено широкое указание на общечеловеческий обычай без уточнения в основном тексте.
  alternative: Явно перевести как обычай половой близости, брака или продолжения рода.
  rationale: Еврейское выражение допускает обобщённую формулировку, а конкретный смысл определяется контекстом; явное уточнение необоснованно снимало бы присущую тексту эвфемистичность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Инверсия «Отец наш стар» и эвфемизм «вошёл бы к нам» сохраняют строй и сдержанность исходного текста; архаичные или конфессионально окрашенные формулы не используются.
