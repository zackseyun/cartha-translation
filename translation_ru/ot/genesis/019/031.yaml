  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: противопоставление старшей и младшей, старость отца, отсутствие мужчины «на земле», эвфемистическое выражение о вступлении в половую связь и ссылку на общий человеческий обычай. «Старшая» несколько менее буквально подчёркивает первородство, чем «первенница», однако в контексте пары «старшая — младшая» это естественная и семантически допустимая передача.'
