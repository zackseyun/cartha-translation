base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: ru
  text: Прежде чем они легли спать[a], мужчины этого города, мужчины Содома, окружили дом[d] — от юноши до старика[b], все жители со всех концов города[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде чем они успели лечь». Речь идёт о том, что последующее произошло до того, как гости расположились на ночь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от юноши и до старика» — выражение, охватывающее весь возрастной диапазон.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «от края (конца)»; по смыслу — из всех частей города.'
    reason: lexical_alternative
  - marker: d
    text: 'Возможный перевод: «собрались вокруг дома». Еврейский глагол может обозначать как окружение, так и движение или собирание вокруг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Прежде чем они легли
  rationale: Передаёт временное предшествование и сохраняет конкретное значение глагола שׁכב — «лечь», не уточняя сверх текста, что они уже уснули или отправились спать.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: мужчины города, мужчины Содома
  rationale: Сохраняет мужской референт אַנְשֵׁי и намеренное приложительное повторение, отождествляющее город с Содомом.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: окружили дом
  rationale: נסב с עַל обозначает движение или расположение вокруг; «окружили» естественно передаёт образ сомкнувшейся вокруг дома толпы, не добавляя прямо не названного насилия.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: от юноши до старика
  rationale: Сохраняет форму меризма — два возрастных полюса, выражающих весь возрастной диапазон присутствовавших мужчин.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Передаёт коллективное עָם и сохраняет переход от конкретного «мужчины» к собирательному обозначению всей городской массы.
- source_word: מִקָּצֶה
  choice: со всех концов города
  rationale: Буквально связано с «краем, концом»; в данном контексте идиоматически указывает, что люди собрались из всех частей города. Слова «города» восполняют ясный контекстуальный референт.
theological_decisions:
- issue: Гендерное обозначение собравшейся толпы
  choice: Сохранить «мужчины города, мужчины Содома», а כָּל הָעָם передать как «весь народ».
  alternative: Во всех случаях употребить обобщающее «жители» или «люди города».
  rationale: Начальное אַנְשֵׁי имеет явно мужское значение, тогда как עָם является более широким собирательным словом. Различие исходного текста не следует сглаживать.
- issue: Степень враждебности действия נסב
  choice: Передать как «окружили дом».
  alternative: «Собрались вокруг дома».
  rationale: Контекст допускает и само собирание вокруг, и охватывающее окружение. Основной перевод отражает более сильный пространственный оттенок, а примечание сохраняет менее определённую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксическое повторение «мужчины города, мужчины Содома» сохранено ради структуры оригинала; архаизмы и конфессионально окрашенные толкования не вводятся.
