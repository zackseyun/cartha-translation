  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: ru
  text: 'И сказал: «Прошу вас, господа мои, зайдите в дом вашего слуги, переночуйте и омойте ноги; а утром встанете пораньше и пойдёте своей дорогой». Но они сказали: «Нет, мы переночуем на площади[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово означает открытое общественное место в городе — площадь или широкое пространство у улицы.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: Прошу вас
  rationale: Сочетание служит вежливым и настойчивым приглашением; буквальное «вот, пожалуйста» в современном русском звучало бы неестественно.
- source_word: אֲדֹנַי
  choice: господа мои
  rationale: Контекст и формы множественного числа показывают, что Лот почтительно обращается к двум посетителям; перевод не вводит божественный титул.
- source_word: סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם
  choice: зайдите в дом вашего слуги
  rationale: Глагол выражает отклонение от пути и заход в дом; «зайдите» естественно передаёт приглашение, а «вашего слуги» сохраняет формулу самоуничижения.
- source_word: וְלִינוּ
  choice: переночуйте
  rationale: Краткий и ясный современный эквивалент глагола со значением провести ночь.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: омойте ноги
  rationale: Сохраняет конкретный обычай гостеприимства и достойный повествовательный регистр.
- source_word: וְהִשְׁכַּמְתֶּם
  choice: утром встанете пораньше
  rationale: Передаёт раннее вставание на следующий день без излишнего усиления повелительности.
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: пойдёте своей дорогой
  rationale: Естественный русский оборот, обозначающий продолжение пути.
- source_word: כִּי
  choice: не выражено отдельным союзом
  rationale: После отрицательного ответа частица вводит решительное противопоставление или уточнение; по-русски естественнее «Нет, мы…», тогда как «Нет, но…» звучит тяжеловесно.
- source_word: בָרְחוֹב
  choice: на площади
  rationale: Здесь רְחוֹב обозначает открытое общественное пространство города, а не только улицу.
- source_word: נָלִין
  choice: мы переночуем
  rationale: Сохраняет лексическую связь с тем же корнем לין ранее в стихе.
theological_decisions:
- issue: Следует ли понимать אֲדֹנַי как божественный титул или как обращение к людям
  choice: 'почтительное обращение во множественном числе: «господа мои»'
  alternative: «господин мой» — единственное число, возможно с отнесением к божественной фигуре
  rationale: Лот обращается к двум пришедшим, а глаголы и местоименные суффиксы во множественном числе поддерживают обращение к обоим. Основной текст не должен преждевременно отождествлять адресата с Богом.
translation_notes:
  register: Современный литературный русский с достойной повествовательной интонацией. Формула «вашего слуги» намеренно сохранена как древнее почтительное самообозначение; синтаксис слегка упрощён ради естественности, без устранения настойчивого гостеприимства Лота.
