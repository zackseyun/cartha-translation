base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: ru
  text: И в ту ночь они снова дали отцу выпить вина. Младшая встала и легла с ним, а он не знал, когда она легла и когда встала.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: они напоили
  rationale: Форма гифиль от שׁקה означает «дать пить, напоить». Русское «напоили вином» естественно передаёт каузативность, не усиливая глагол до самостоятельного значения «довели до опьянения».
- source_word: גַּם
  choice: снова
  rationale: В данном повествовательном контексте частица отмечает повторение действий предыдущей ночи; «снова» яснее и естественнее русского «также».
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Прямое и идиоматичное русское соответствие временному обороту.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: младшая встала
  rationale: Субстантивированное прилагательное женского рода означает младшую из двух дочерей; контекст позволяет не повторять слово «дочь».
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: легла с ним
  rationale: Сохраняет обычный библейский эвфемизм половой связи и близко следует еврейскому выражению.
- source_word: וְלֹא יָדַע
  choice: он не заметил
  rationale: ידע здесь выражает отсутствие осознания происходящего. «Не заметил» естественно сочетается с последующими временными конструкциями и сохраняет смысл неосведомлённости.
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: ни того, как она легла, ни того, как встала
  rationale: Конструкции с בְּ и отглагольными формами допускают временное понимание; парная русская конструкция передаёт параллелизм оригинала.
theological_decisions:
- issue: Степень осознанности отца
  choice: он не заметил ни того, как она легла, ни того, как встала
  alternative: он не знал о том, как она легла и как встала
  rationale: Текст утверждает отсутствие осознания в обозначенные моменты, не уточняя физиологические подробности и не предлагая дополнительного морального объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством и сдержанностью повествования. Синтаксис сделан естественным для обычного читателя; сохранены повтор ночи, эвфемистическое «легла с ним» и параллелизм заключительной фразы.
