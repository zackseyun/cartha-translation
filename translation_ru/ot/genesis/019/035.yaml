    issue: «Напоили своего отца вином»
    rationale: Хотя это возможно в русском, глагол «напоить» легко воспринимается как доведение до опьянения. Оригинал прямо говорит о том, что дочери дали отцу пить вино, не вкладывая это более сильное значение в сам глагол.
  - severity: low
    issue: «Он не заметил»
    rationale: ידע означает «знать, быть осведомлённым». «Не заметил» может подразумевать главным образом непосредственное восприятие; «не знал» точнее отражает еврейское выражение и не уточняет характер его неосведомлённости.
  revised_text: И в ту ночь они снова дали отцу выпить вина. Младшая встала и легла с ним, а он не знал, когда она легла и когда встала.
