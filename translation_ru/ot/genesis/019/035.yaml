revisions:
- from: И в ту ночь они снова напоили своего отца вином. Младшая встала и легла с ним, а он не заметил ни того, как она легла, ни того, как встала.
  to: И в ту ночь они снова дали отцу выпить вина. Младшая встала и легла с ним, а он не знал, когда она легла и когда встала.
  rationale: 'Исправлены два места, где русский выбор мог либо усилить смысл исходного глагола, либо сузить значение «не знал». Повторность действия («снова»), временная отсылка, эвфемистическая формула и параллелизм заключения сохранены. Сноска не требуется: вариант «не знал о её лежании и вставании» в русском не улучшает ясность и не отражает текстологического разночтения.'
