  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: ru
  text: Тогда Яхве пролил на Содом и Гоморру серу[a] и огонь от Яхве с небес[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционные русские переводы нередко передают это выражение как «серный и огненный дождь». Еврейское גָּפְרִית обозначает серу.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от Яхве с небес». Повтор Божьего имени сохранён из исходного текста и не заменён местоимением и не опущен.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией и позволяет сохранить его намеренное двукратное употребление в стихе.
- source_word: הִמְטִיר
  choice: обрушил… дождь
  rationale: Каузативная форма означает «послал дождь, заставил излиться дождём». Русское выражение сохраняет образ дождя и естественно передаёт ниспосланное свыше бедствие.
- source_word: גָּפְרִית
  choice: сера
  rationale: Точный и понятный современному читателю эквивалент названия вещества.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямой русский эквивалент; вместе с «серой» обозначает содержание ниспосланного дождя.
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: на Содом и Гоморру
  rationale: Предлог указывает, на какие города обрушился суд; повтор еврейского предлога перед вторым названием по-русски не требуется.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Сохраняет явно указанное в еврейском тексте происхождение действия и не устраняет повтор имени.
- source_word: מִן הַשָּׁמָיִם
  choice: с небес
  rationale: Передаёт множественную форму еврейского существительного и направление сверху вниз.
- source_word: וַ
  choice: Тогда
  rationale: Естественно передаёт продвижение последовательного повествования.
theological_decisions:
- issue: Повтор имени Яхве в выражении «Яхве… от Яхве»
  choice: Повтор сохранён в основном тексте без истолковывающей переработки.
  alternative: «Тогда Яхве обрушил… с небес» или «…от Себя с небес».
  rationale: Масоретский текст прямо повторяет имя יהוה. Сохранение этой необычной конструкции не предрешает вопрос о её богословском значении и не сглаживает напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «обрушил… дождь из серы и огня» делает каузативный образ естественным для русского читателя, а заключительное «от Яхве с небес» намеренно сохраняет необычный повтор исходного текста.
