  rationale: Исправлены число слова «зять», чрезмерно узкое «близкие», стилистически маркированное «эти мужчины» и менее точное «отсюда». Вопросительная конструкция и отдельное повеление передают синтаксическую напряжённость оригинала естественно для современного литературного русского. Сноска сохраняет лексическую неоднозначность חָתָן, не утверждая спорный статус брака дочерей Лота.
