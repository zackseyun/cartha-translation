base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: ru
  text: 'Мужчины сказали Лоту: «Есть ли у тебя здесь ещё кто-нибудь — зять, твои сыновья, твои дочери и все, кто у тебя есть в городе? Выведи их из этого места».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: эти мужчины
  rationale: Существительное буквально означает «мужчины, люди». Хотя из контекста известно, что это ангелы, в основном тексте сохранено обозначение самого стиха; указательное «эти» естественно передаёт определённость и отсылает к уже названным посетителям.
- source_word: עֹד מִי לְךָ פֹה
  choice: Кто у тебя здесь ещё есть?
  rationale: Естественно передаёт вопрос о других людях, связанных с Лотом и находящихся в городе.
- source_word: חָתָן
  choice: зятья
  rationale: В данном контексте слово обозначает мужей или женихов дочерей Лота. Хотя еврейская форма грамматически единственного числа, здесь она открывает перечень категорий близких; русское множественное число согласуется с дальнейшим повествованием и не создаёт впечатления, будто зять был только один. Лексическая неоднозначность отмечена в сноске.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: сыновья, дочери
  rationale: Прямо передаёт формы множественного числа; принадлежность к Лоту уже ясно выражена оборотом «у тебя» и заключительной фразой «твои близкие».
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: и все твои близкие в городе
  rationale: 'Буквально: «и всё, что у тебя в городе». В контексте речь идёт о людях, которых следует вывести; «все твои близкие» естественно выражает принадлежность к семье или дому Лота, не ограничивая круг только кровными родственниками.'
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: выведи их отсюда
  rationale: Императив обращён к Лоту в единственном числе. Местоимение «их» восстанавливает подразумеваемый объект из перечня, а «отсюда» естественно передаёт «из этого места» в непосредственной ситуации речи.
theological_decisions:
- issue: Следует ли назвать הָאֲנָשִׁים ангелами в основном тексте
  choice: Сохранить «эти мужчины»
  alternative: «ангелы» или «посланники»
  rationale: Повествовательный контекст раскрывает природу посетителей, однако данный стих употребляет обычное слово «мужчины». Перевод не подменяет лексическую форму контекстуальным богословским истолкованием.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанно-достоинственной повествовательной интонацией. Формулировка сохраняет исходное обозначение посетителей как мужчин и отмечает неоднозначность חָתָן в сноске.
