  naturalness: Текст звучит естественно на современном литературном русском и сохраняет уместную для повествования сжатость и срочность. Сочетание «Поспеши, спасайся туда» ясно в контексте бегства к указанному городу; повтор «туда» отражает повтор направительного наречия в еврейском тексте.
