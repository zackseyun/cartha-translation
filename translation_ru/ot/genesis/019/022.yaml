source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: ru
  text: «Поспеши, спасайся туда, потому что я не могу ничего сделать, пока ты туда не придёшь». Поэтому город назвали Цоаром[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Цоар» созвучно еврейскому слову со значением «малый» или «незначительный»; см. Бытие 19:20.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «он назвал имя города Цоар».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Поспеши
  rationale: Повелительная форма выражает настоятельную срочность; «поспеши» естественно звучит в современном литературном русском языке.
- source_word: הִמָּלֵט
  choice: спасайся
  rationale: Нифаль повелительного наклонения от מלט означает «спастись, вырваться, найти спасение». В данном контексте «спасайся» передаёт и бегство, и избавление от грозящей гибели.
- source_word: שָׁמָּה
  choice: туда
  rationale: Направительное наречие обозначает движение к указанному месту; русское «туда» точно передаёт это значение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего повеления; «потому что» ясно и естественно выражает причинную связь.
- source_word: לֹא אוּכַל
  choice: я не могу
  rationale: Форма прямо выражает невозможность или неспособность. Настоящее время сохраняет непосредственное ограничение, заявленное говорящим.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: ничего сделать
  rationale: Буквально «сделать [какое-либо] дело/что-либо»; при отрицании русское «ничего сделать» естественно передаёт неограниченный объём выражения.
- source_word: עַד בֹּאֲךָ
  choice: пока ты не придёшь
  rationale: Инфинитив с местоименным суффиксом 2-го лица мужского рода означает «до твоего прихода». Конструкция «пока… не» идиоматична по-русски и сохраняет временной предел.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Устойчивая формула вывода вводит объяснение названия города.
- source_word: קָרָא שֵׁם הָעִיר
  choice: город назвали
  rationale: Еврейская конструкция буквально говорит, что некто «назвал имя города». Неопределённо-личная русская конструкция передаёт смысл без неестественного буквализма и не уточняет не названного в тексте деятеля.
- source_word: צֹעַר
  choice: Цоар
  rationale: Традиционная русская транслитерация географического названия; созвучие с еврейским словом со значением «малый» поясняется в примечании.
theological_decisions:
- issue: Заявление о невозможности действовать до спасения Лота
  choice: «я не могу ничего сделать»
  alternative: «я не должен ничего делать» / «я не могу сделать этого»
  rationale: לֹא אוּכַל прямо выражает невозможность, а דָּבָר не сужает высказывание до одного конкретного действия. Перевод сохраняет богословское напряжение рассказа и не объясняет его через предполагаемые ограничения ангела или через особое божественное дозволение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Срочные повеления переданы кратко; причинная и временная связи выражены прозрачно. Оба примечания поставлены при названии города, к которому они непосредственно относятся.
