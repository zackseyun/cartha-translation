  yaml_path: translation/ot/genesis/019/036.yaml
  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: ru
  text: И обе дочери Лота забеременели от своего отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от их отца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: забеременели
  rationale: Форма глагола הרה указывает, что обе женщины зачали и стали беременны; «забеременели» — ясный и естественный современный русский эквивалент.
- source_word: שְׁתֵּי
  choice: обе
  rationale: Числительное при выражении «дочери Лота» охватывает двух дочерей; русское «обе» естественно передаёт этот смысл.
- source_word: בְנוֹת לוֹט
  choice: дочери Лота
  rationale: Конструктивная цепочка естественно передаётся в русском языке сочетанием с родительным падежом.
- source_word: מֵאֲבִיהֶן
  choice: от своего отца
  rationale: Предлог מִן обозначает источник, здесь — отцовство; «от своего отца» точно и естественно сохраняет буквальный образ еврейского выражения.
