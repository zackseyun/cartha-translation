base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: ru
  text: Но его жена, которая была позади него, оглянулась[a] и стала соляным столбом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взглянула из-за его спины»; также возможно: «взглянула, будучи позади него».'
    reason: Еврейское מֵאַחֲרָיו буквально обозначает положение «из-за/сзади него». «Оглянулась» естественно передаёт смысл глагола в контексте, не добавляя, что она шла.
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: оглянулась
  rationale: Глагол означает «посмотреть, взглянуть»; в сочетании с מֵאַחֲרָיו и в данном контексте русское «оглянулась» естественно передаёт взгляд назад, не приписывая женщине не названного в тексте мотива.
- source_word: אִשְׁתּוֹ
  choice: его жена
  rationale: Существительное с местоименным суффиксом 3-го лица мужского рода единственного числа прямо означает «его жена»; из контекста речь идёт о жене Лота.
- source_word: מֵאַחֲרָיו
  choice: шедшая позади него
  rationale: Оборот буквально обозначает положение «сзади него, позади него». Причастная конструкция естественна по-русски и сохраняет указание на положение жены относительно мужа; движение следует из непосредственного контекста бегства.
- source_word: וַתְּהִי
  choice: стала
  rationale: В повествовательной последовательности היה здесь обозначает наступление нового состояния, поэтому «стала» точнее простого «была».
- source_word: נְצִיב מֶלַח
  choice: соляным столбом
  rationale: נְצִיב обозначает нечто поставленное или стоящее, а сочетание с מֶלַח естественно передаётся устойчивым русским выражением «соляной столб».
theological_decisions:
- issue: Характер превращения жены Лота
  choice: «стала соляным столбом» — прямое утверждение о наступившем состоянии
  alternative: «стала словно соляной столб» или «превратилась в подобие соляного столба»
  rationale: В еврейском тексте нет показателя сравнения. Перевод сохраняет прямую форму повествовательного утверждения, не добавляя объяснения природы события.
- issue: Направление и характер взгляда
  choice: «оглянулась» с отдельным указанием, что она шла позади него
  alternative: «посмотрела позади себя» или буквально «взглянула из-за него»
  rationale: Еврейская конструкция допускает буквальное понимание положения женщины «позади него», тогда как контекст придаёт взгляду направление назад. Основной текст передаёт оба элемента, а примечание сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с традиционно узнаваемым, но естественным выражением «соляной столб». Союз «но» подчёркивает контраст с повелением не оглядываться. Порядок слов и причастный оборот устраняют неестественную буквальность, сохраняя все существенные элементы еврейского текста.
