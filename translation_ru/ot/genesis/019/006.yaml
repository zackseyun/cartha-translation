  text: Лот вышел к ним ко входу и закрыл за собой дверь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Повествовательная форма от יצא обозначает последовательное действие в прошлом; «вышел» естественно передаёт движение из дома наружу.
- source_word: אֲלֵהֶם
  choice: к ним
  rationale: Предлог אֶל с местоименным суффиксом указывает на движение по направлению к находившимся снаружи людям.
- source_word: לוֹט
  choice: Лот
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הַפֶּתְחָה
  choice: ко входу
  rationale: Пֶּתַח означает вход или проём, а направительное ה передаёт движение к нему. Перевод сохраняет отличие от דֶּלֶת — самой двери.
- source_word: וְהַדֶּלֶת
  choice: и ... дверь
  rationale: דֶּלֶת обозначает дверь как закрываемый предмет, в отличие от входа или проёма в предыдущем слове.
- source_word: סָגַר
  choice: закрыл
  rationale: Обычный современный русский глагол для действия с дверью; кратко и ясно передаёт значение סגר.
- source_word: אַחֲרָיו
  choice: за собой
  rationale: В данном пространственном контексте выражение означает, что Лот, выйдя наружу, закрыл дверь позади себя; по-русски это естественно передаётся оборотом «за собой».
