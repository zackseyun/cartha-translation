base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: ru
  text: 'На следующий день старшая сказала младшей: «Вот, прошлой ночью я легла с отцом. Давай и сегодня ночью напоим его вином, а потом пойди и ляг с ним, чтобы у нашего отца было потомство».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы сохранить (или: поддержать) семя от нашего отца». «Семя» — древнееврейский образ потомства; в данном контексте речь о том, чтобы обеспечить потомство через отца. Слово «старшая» передаёт древнееврейское обозначение первородной дочери.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: На следующий день
  rationale: Естественное русское повествовательное начало передаёт временной переход; буквальное «и было» здесь звучало бы архаично и тяжеловесно.
- source_word: הַבְּכִירָה
  choice: первородная
  rationale: Сохраняет акцент древнееврейского слова на порядке рождения и в контексте ясно указывает на старшую дочь.
- source_word: הַצְּעִירָה
  choice: младшей
  rationale: Субстантивированное прилагательное естественно передаёт краткое противопоставление первородной и младшей.
- source_word: הֵן
  choice: Вот
  rationale: Передаёт частицу привлечения внимания в современном, но достойном русском регистре.
- source_word: שָׁכַבְתִּי אֶת־אָבִי
  choice: я легла с отцом
  rationale: Сохраняет сексуальный эвфемизм оригинала, не делая выражение ни неясным, ни клинически прямым.
- source_word: אֶמֶשׁ
  choice: прошлой ночью
  rationale: В данном повествовательном контексте это наиболее естественное обозначение предшествующей ночи.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: давай ... напоим его вином
  rationale: 'Передаёт каузативную форму глагола: они намерены дать отцу вина и довести его до опьянения; конструкция с «давай» естественно выражает побуждение первого лица множественного числа.'
- source_word: גַּם הַלַּיְלָה
  choice: и сегодня ночью
  rationale: 'Частица «и» сохраняет добавочное значение גם: действие предлагается повторить ещё одной ночью.'
- source_word: וּבֹאִי
  choice: потом войди
  rationale: Глагол буквально означает «войди/приди»; «потом» естественно показывает последовательность действий, не устраняя конкретный образ входа.
- source_word: שִׁכְבִי עִמּוֹ
  choice: ляг с ним
  rationale: Сохраняет тот же сексуальный эвфемизм, что и в первой половине стиха.
- source_word: וּנְחַיֶּה
  choice: чтобы нам сохранить
  rationale: Передаёт каузативное значение породы Piel — «сберечь, сохранить живым» — и целевую связь в данном контексте.
- source_word: מֵאָבִינוּ זָרַע
  choice: потомство от нашего отца
  rationale: Зֶרַע буквально «семя», но здесь обозначает потомство; «от нашего отца» сохраняет значение источника у предлога מִן.
