base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: ru
  text: Но он настойчиво уговаривал их[a], и они свернули к нему и вошли в его дом. Он устроил для них пир, испёк пресные хлебы[b], и они ели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильно упрашивал их»; «очень настаивал».'
    reason: lexical_alternative
  - marker: b
    text: То есть хлебы без закваски; возможна также передача «пресные лепёшки».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: стал настойчиво их уговаривать
  rationale: Глагол פצר выражает сильное, повторное побуждение, а מְאֹד усиливает его. Такая передача естественна по-русски и сохраняет интенсивность действия.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: они свернули к нему
  rationale: Сохраняется пространственный образ глагола סור — отклониться от пути, свернуть, — а также выраженное в еврейском направление «к нему».
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: вошли в его дом
  rationale: Идиоматичная русская передача движения к дому и внутрь него в данном контексте.
- source_word: מִשְׁתֶּה
  choice: пир
  rationale: Слово обозначает праздничное угощение или пир, нередко с питьём; контекст не требует отдельно подчёркивать употребление вина.
- source_word: מַצּוֹת
  choice: пресные хлебы
  rationale: Форма множественного числа сохранена. Выражение означает хлебные изделия без закваски; «пресные хлебы» понятно и соответствует библейскому контексту.
- source_word: אָפָה
  choice: испёк
  rationale: Прямо передаёт явное действие в еврейском тексте и согласуется с Лотом как субъектом предыдущего глагола.
- source_word: וַיֹּאכֵלוּ
  choice: и они ели
  rationale: Сохраняет простое повествовательное завершение и несовершенно-видовую естественность русского описания трапезы.
