  text: וַ/יִּשְׁלְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת יָדָ֔/ם וַ/יָּבִ֧יאוּ אֶת ל֛וֹט אֲלֵי/הֶ֖ם הַ/בָּ֑יְתָ/ה וְ/אֶת הַ/דֶּ֖לֶת סָגָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: ru
  text: Но мужчины[a] протянули руки, ввели Лота к себе в дом и закрыли дверь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчины»; из контекста ясно, что это ангельские посланники.'
    reason: Сохраняет точное обозначение оригинала и одновременно сообщает контекстуальную идентификацию действующих лиц.
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: мужчины
  rationale: Еврейское слово прямо означает «мужчины». Контекст указывает, что это ангельские посланники, однако основной текст сохраняет обозначение, употреблённое в данном стихе.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: протянули руки
  rationale: Еврейское сочетание с שׁלח описывает физическое протягивание руки; русская формулировка естественна и не добавляет отсутствующего в тексте объекта.
- source_word: וַיָּבִיאוּ
  choice: ввели
  rationale: Каузативная форма глагола בוא означает «привести, ввести». «Ввели» передаёт движение внутрь дома, не усиливая действие до более толковательного «втащили».
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: к себе в дом
  rationale: Формулировка сохраняет как направленность к мужчинам, так и движение внутрь дома; направительный суффикс при הַבָּיְתָה естественно передан предлогом «в».
- source_word: הַדֶּלֶת
  choice: дверь
  rationale: Обычное и точное соответствие еврейскому דֶּלֶת; уточнение «входную» не требуется.
- source_word: סָגָרוּ
  choice: заперли
  rationale: В данном контексте русское «заперли дверь» естественно передаёт закрытие двери для защиты от находившихся снаружи, хотя глагол сам по себе может означать просто «закрыли».
- source_word: וַ
  choice: Но
  rationale: Начальный союз продолжает повествование и одновременно противопоставляет действие мужчин нападению толпы в предыдущем стихе.
theological_decisions:
- issue: Следует ли прямо назвать мужчин ангелами
  choice: В основном тексте сохранено «мужчины»
  alternative: ангелы; посланники
  rationale: Ближайший контекст отождествляет их с ангельскими посланниками, но в самом стихе употреблено обычное הָאֲנָשִׁים — «мужчины». Перевод не заменяет авторское обозначение его контекстуальным истолкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, динамичным рядом однородных сказуемых. Формулировка сохраняет быстрый темп еврейского повествования и избегает конфессионально окрашенных уточнений.
