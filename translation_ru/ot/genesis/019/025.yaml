base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: ru
  text: И Он ниспроверг[a] эти города, и всю равнину[b], и всех жителей этих городов, и растительность земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перевернул». Еврейский глагол может подчёркивать катастрофическое переворачивание.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «равнина» обозначает область Иорданской долины.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: ниспроверг
  rationale: Глагол הפך здесь обозначает катастрофическое ниспровержение или переворачивание. «Ниспроверг» сохраняет конкретную силу образа и не сводит значение к общему «уничтожил».
- source_word: הֶעָרִים הָאֵל
  choice: эти города
  rationale: Указательное אֵל отсылает к уже названным городам; в русском повествовательном контексте естественно «эти города».
- source_word: כָּל הַכִּכָּר
  choice: всю равнину
  rationale: כִּכָּר в данном контексте означает область Иорданской равнины; буквальное «круг» по-русски было бы неясно.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: всех жителей этих городов
  rationale: Причастная форма от ישב обозначает живущих в городах; «жители» передаёт это кратко и естественно.
- source_word: צֶמַח הָאֲדָמָה
  choice: растительность земли
  rationale: צֶמַח обозначает произрастающую растительность, а אֲדָמָה — землю или почву. Формулировка сохраняет вещественный и земледельческий смысл выражения.
theological_decisions:
- issue: Неявное подлежащее глагола в единственном числе
  choice: Сохранено местоимение «Он» без прямого именования действующего лица.
  alternative: Прямо назвать Бога или Господа либо опустить местоимение по-русски.
  rationale: В самом еврейском предложении подлежащее при глаголе не названо, хотя предшествующий контекст указывает на Бога. Местоимение сохраняет связность повествования, не добавляя имени, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор союза «и» сохранён, чтобы передать последовательную структуру еврейского текста; архаические и конфессионально окрашенные формулы не использованы.
