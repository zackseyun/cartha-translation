lexical_decisions:
- source_word: אַל־נָא
  choice: прошу вас, не
  rationale: 'Передаёт усиленную вежливую мольбу: נָא смягчает и делает запрет настоятельной просьбой.'
- source_word: אַחַי
  choice: братья мои
  rationale: Формально сохраняет обращение «мои братья»; в контексте это почтительное обращение к мужчинам, а не указание на кровное родство.
- source_word: תָּרֵעוּ
  choice: делайте зла
  rationale: Глагольная форма от רעע здесь означает совершать зло, поступать дурно; выбран прямой и естественный русский эквивалент без сужения смысла.
theological_decisions:
- issue: Степень конкретизации осуждаемого поступка
  choice: не делайте зла
  alternative: не поступайте так дурно
  rationale: Исходный текст выражается обобщённо и не называет поступок в этом стихе; перевод сохраняет эту форму и не вносит дополнительной интерпретации из контекста.
translation_notes:
  register: Современный литературный русский язык; обращение звучит настойчиво, но уважительно. Инверсия «И сказал» сохраняет повествовательную связь с предыдущим стихом, оставаясь естественной для библейского повествования.
