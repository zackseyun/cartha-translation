  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: ru
  text: Младшая также родила сына и назвала его Бен-Амми[a]. Он — прародитель аммонитян[b] до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Бен-Амми», вероятно, означает «сын моего народа» или «сын моего родича».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: Младшая
  rationale: Определённое прилагательное употреблено как существительное и в контексте обозначает младшую дочь Лота; краткая русская форма естественно сохраняет сопоставление со старшей.
- source_word: גַם הִוא
  choice: также
  rationale: 'Передаёт добавочное значение: младшая, подобно старшей, тоже родила сына.'
- source_word: יָלְדָה בֵּן
  choice: родила сына
  rationale: Точное и естественное для современного русского повествования соответствие еврейскому обороту.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: назвала его
  rationale: Естественно передаёт еврейскую формулу наречения имени без нехарактерной для современного русского кальки «назвала имя его».
- source_word: בֶּן עַמִּי
  choice: Бен-Амми
  rationale: Личное имя передано транслитерацией; его значимое толкование вынесено в сноску.
- source_word: הוּא אֲבִי
  choice: Он — прародитель
  rationale: В данном этногенеалогическом контексте אָב обозначает родоначальника народа, а не непосредственного отца; «прародитель» ясно передаёт эту функцию.
- source_word: בְנֵי עַמּוֹן
  choice: аммонитян
  rationale: Буквально «сынов Аммона»; общепринятое русское название народа звучит естественно, а буквальная форма указана в сноске.
- source_word: עַד הַיּוֹם
  choice: до сего дня
  rationale: Устойчивое, литературное и понятное соответствие повествовательной формуле, относящей продолжение этого положения ко времени рассказчика.
