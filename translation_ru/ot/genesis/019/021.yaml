  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: ru
  text: 'И он сказал ему: «Вот, я исполню и эту твою просьбу[a]: не разрушу города, о котором ты говорил».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я поднял твоё лицо» — древнееврейская идиома, означающая проявить благосклонность или принять просьбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию привлечения внимания и естественно вводит ответ в современном русском повествовании.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: я исполню твою просьбу
  rationale: Буквально выражение означает «я поднял твоё лицо», но это древнееврейская идиома благосклонного принятия обращения. В данном контексте естественный русский эквивалент — согласие исполнить просьбу; перфект имеет силу объявляемого решения, результат которого последует далее.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: и эту твою просьбу
  rationale: דָּבָר обозначает только что изложенное Лотом дело или просьбу, а גַּם сохраняется добавочным «и».
- source_word: לְבִלְתִּי הָפְכִּי
  choice: не разрушу
  rationale: Конструкция выражает обещание не подвергать город катастрофическому ниспровержению. «Не разрушу» ясно передаёт смысл по-русски, не прибегая к неестественному буквальному «не переверну».
- source_word: הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: города, о котором ты говорил
  rationale: Передаёт определённый город и относительную конструкцию близко к форме и смыслу еврейского текста.
theological_decisions:
- issue: Кто говорит в стихе
  choice: Сохранено местоимение «он» без уточнения личности говорящего
  alternative: Назвать говорящего ангелом или Господом
  rationale: В самом стихе субъект выражен лишь глагольной формой и определяется контекстом; уточнение внесло бы толкование непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка понятна широкому читателю; буквальная идиома вынесена в сноску, а неоднозначность личности говорящего сохранена.
