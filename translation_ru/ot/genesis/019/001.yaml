base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: ru
  text: Два ангела пришли в Содом вечером, а Лот сидел у ворот Содома.[a] Увидев их, Лот встал им навстречу и поклонился до земли.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Городские ворота в древности были общественным местом, где встречались люди и решались городские дела.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «поклонился лицом к земле»; имеется в виду глубокий земной поклон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Глагол בוא с направительным окончанием у названия города обозначает прибытие к месту; «пришли в Содом» естественно передаёт движение и достижение цели.
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: два ангела
  rationale: מַלְאָךְ может означать «посланник» или «ангел», но здесь речь идёт о небесных посетителях из предшествующего повествования.
- source_word: בָּעֶרֶב
  choice: вечером
  rationale: Краткое и естественное обозначение времени прибытия в современном русском языке.
- source_word: יֹשֵׁב
  choice: сидел
  rationale: Причастная форма задаёт фоновое, продолженное состояние; русское прошедшее несовершенного вида сохраняет этот оттенок.
- source_word: בְּשַׁעַר סְדֹם
  choice: у ворот Содома
  rationale: В контексте древнего города «ворота» обозначают не только вход, но и прилегающий общественный комплекс; «у ворот» звучит естественно и не создаёт ложного образа сидения внутри створок.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: встал им навстречу
  rationale: Передаёт как вставание, так и направленное приветственное движение к посетителям.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: поклонился до земли
  rationale: Русская идиома ясно передаёт глубокий поклон, при котором лицо обращено к земле, без тяжеловесного буквального описания.
theological_decisions:
- issue: Означает ли וַיִּשְׁתַּחוּ поклонение или почтительный земной поклон
  choice: почтительный глубокий поклон («поклонился до земли»)
  alternative: «поклонился им как божественным существам» / «совершил поклонение»
  rationale: Глагол שׁחה употребляется и о богопоклонении, и о выражении почтения людям либо небесным посланникам. Сам стих не требует богословски усиленного значения, поэтому перевод сохраняет нейтральное описание жеста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и доступен; культурная реалия ворот и степень поклона пояснены в сносках без внесения конфессионального толкования.
