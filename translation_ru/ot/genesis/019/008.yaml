  source_fidelity: В черновике верно переданы предложение Лота, ограничение רַק и образ защиты гостей. Однако начальная частица мольбы נָא не выражена, а «этим людям» утрачивает мужской род אֲנָשִׁים, существенный в данном контексте.
  naturalness: «Не познали мужчины» в современном литературном русском может читаться как отсутствие знакомства, а не как сексуальный эвфемизм. «Не были с мужчиной» ясно и естественно передаёт смысл в сдержанном регистре. «Под сень моей кровли» допустимо, но несколько тяжеловесно; «под сенью моей крыши» сохраняет образ и звучит более естественно.
  terminology: Половой смысл выражения ידע сохранён без морализующего смягчения. «Мужчинам» точнее «людям» для אֲנָשִׁים. Сноска о гостеприимстве уместна; её следует согласовать с выбранным образом.
