source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: ru
  text: Прошу вас, у меня есть две дочери, которые не были с мужчиной.[a] Прошу, позвольте мне вывести их к вам, и делайте с ними, что вам угодно. Только этим мужчинам не делайте ничего, потому что они пришли под сенью моей крыши.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые не познали мужчины», то есть не вступали в половую связь с мужчиной; традиционно: «девственницы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «под тенью моей кровли». Этот образ выражает защиту, которую хозяин дома был обязан оказывать принятым им гостям.'
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: «Вот» естественно привлекает срочное внимание; оттенок мольбы частицы נָא передаётся общим просительным тоном следующей речи, без неестественного «вот, пожалуйста».
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: которые не познали мужчины
  rationale: Сохранён прозрачный библейский эвфемизм ידע в значении половой близости; буквальная форма не сводит выражение к более узкому существительному «девственницы».
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Позвольте мне вывести их к вам
  rationale: Когортатив и частица נָא передают настойчивую просьбу или предложение; русский оборот сохраняет волевой и просительный оттенок.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: и делайте с ними, что вам угодно
  rationale: Естественный современный русский эквивалент идиомы «что хорошо в ваших глазах»; не смягчает ужасающего содержания предложения.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: Только этим людям не делайте ничего
  rationale: «Только» сохраняет ограничительно-контрастную силу רַק, а «не делайте ничего» — полный запрет אַל ... דָבָר.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: потому что они пришли
  rationale: Передаёт причинную связь с последующим образом крова и обусловленной им защитой гостей, не перегружая русский текст буквальным «потому именно».
- source_word: בְּצֵל קֹרָתִי
  choice: под сень моей кровли
  rationale: Сохраняет образ «тени» и крыши/кровли, а также подразумеваемые укрытие и обязанность хозяина защищать гостей.
theological_decisions:
- issue: Следует ли смягчать нравственно шокирующее предложение Лота
  choice: Сохранить прямой и тяжёлый смысл еврейского текста без оправдания или эвфемистического смягчения
  alternative: 'Передать более расплывчато, например: «поступите с ними по своему усмотрению»'
  rationale: Повествование сообщает слова Лота, но не выражает здесь их нравственного одобрения. Перевод не должен ни оправдывать предложение, ни ослаблять его жестокость.
- issue: Является ли образ кровли лишь указанием на местонахождение или также выражает защиту гостя
  choice: Сохранить буквальный образ в тексте и пояснить культурный смысл в сноске
  alternative: Перевести только как «они находятся в моём доме и под моей защитой»
  rationale: Так сохраняются и исходная метафора, и её контекстуальное значение без внесения пояснения непосредственно в слова стиха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенными, но понятными оборотами «не познали мужчины» и «под сень моей кровли». Синтаксис сохраняет резкий контраст между предложением отдать дочерей и запретом причинять что-либо гостям.
