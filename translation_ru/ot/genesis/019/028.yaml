base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: ru
  text: 'Он взглянул на Содом и Гоморру и на всю равнинную область и увидел: вот, от земли поднимался дым, словно дым из печи[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как дым из обжиговой печи».'
    reason: Лексема כִּבְשָׁן может обозначать печь, в том числе печь для обжига.
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: посмотрел на
  rationale: Глагол описывает взгляд с возвышенного места на лежащую внизу местность. В контексте предыдущего стиха это направление ясно, а естественное русское «посмотрел на» не перегружает фразу.
- source_word: עַל פְּנֵי
  choice: на
  rationale: Идиома буквально означает взгляд «на поверхность» или «поверх» чего-либо; русское «на» естественно передаёт направленность взгляда.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Содом и Гоморру
  rationale: Устоявшиеся русские формы географических названий; падеж обусловлен управлением глагола.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: всю землю равнины
  rationale: כִּכָּר обозначает равнинную область или округ; формулировка сохраняет географический образ и остаётся понятной современному читателю.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямой эквивалент глагола ראה, сохраняющий последовательность повествования.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица вводит внезапно открывшуюся взору картину; «вот» сохраняет её указательную и выразительную силу без архаизации.
- source_word: עָלָה
  choice: поднимался
  rationale: Несовершенный вид естественно изображает наблюдаемое продолжающееся движение дыма вверх.
- source_word: קִיטֹר
  choice: дым
  rationale: Основное значение существительного — дым или испарение; «дым» точно соответствует контексту и не добавляет отсутствующих характеристик.
- source_word: הָאָרֶץ
  choice: с земли
  rationale: Здесь имеется в виду видимая местность, а не мир в целом; «с земли» естественно передаёт источник поднимающегося дыма.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: как дым из печи
  rationale: כִּבְשָׁן может обозначать печь или печь для обжига. Основной текст использует широкое и естественное «печь», а более конкретная возможность отмечена в сноске.
