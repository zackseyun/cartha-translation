  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: ru
  text: 'И сказал Яхве Бог: «Вот, человек стал как один из нас, зная добро и зло. И теперь — как бы ему не протянуть руку, не взять также от дерева жизни, не съесть и не жить вечно —»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза в конце стиха остаётся незавершённой: мысль обрывается после слов «и не жить вечно».'
    reason: Сохраняется синтаксическая незавершённость исходного текста, которую русский читатель иначе может принять за пропуск или ошибку.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Сохраняется личное имя Яхве и приложение אֱלֹהִים; сочетание естественно звучит по-русски.
- source_word: הֵן
  choice: Вот
  rationale: Передаёт указательно-восклицательную силу слова и уместно в возвышенной повествовательной речи.
- source_word: הָאָדָם
  choice: человек
  rationale: В данном контексте обозначает конкретного человека, о котором шла речь; русское «человек» естественно и не превращает выражение в отвлечённое обозначение человечества.
- source_word: הָיָה כְּאַחַד מִמֶּנּוּ
  choice: стал как один из Нас
  rationale: Передаёт наступившее состояние и буквально сохраняет сравнительную конструкцию и первое лицо множественного числа.
- source_word: לָדַעַת טוֹב וָרָע
  choice: зная добро и зло
  rationale: Причастный оборот естественно поясняет, в каком отношении человек стал «как один из Нас», не сужая смысл выражения.
- source_word: פֶּן
  choice: как бы … не
  rationale: Естественная русская форма предупредительно-предотвратительного придаточного, сохраняющая незавершённость последующей мысли.
- source_word: יִשְׁלַח יָדוֹ
  choice: протянул руку свою
  rationale: Сохраняет конкретный образ еврейской идиомы в понятной русской форме.
- source_word: עֵץ הַחַיִּים
  choice: дерево жизни
  rationale: Прямой, традиционный и прозрачный перевод словосочетания.
- source_word: וָחַי לְעֹלָם
  choice: стал жить вечно
  rationale: Передаёт последовательность возможных действий и длительный результат, выраженный исходным текстом.
theological_decisions:
- issue: Множественное число в выражении מִמֶּנּוּ
  choice: Сохранить «Нас» без истолковывающего дополнения.
  alternative: Передать как множественное величия, обращение к небесному совету либо прямое указание на внутрибожественную множественность.
  rationale: Еврейский текст недвусмысленно использует форму первого лица множественного числа, но сам стих не разрешает вопрос о её референте; перевод должен сохранять эту богословскую напряжённость.
- issue: Незавершённое окончание прямой речи
  choice: Сохранить оборванную предупредительную конструкцию с многоточием.
  alternative: Завершить мысль добавленным следствием или оформить её как законченное предложение.
  rationale: После לְעֹלָם условно-предупредительная мысль синтаксически остаётся без выраженного главного предложения, а следующий стих переходит к действию; многоточие естественно передаёт это по-русски без добавления отсутствующих слов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «И сказал» и постпозиция «руку свою» поддерживают достоинство речи, оставаясь понятными; личное имя передано как «Яхве». Маркер сноски помещён в основном тексте.
