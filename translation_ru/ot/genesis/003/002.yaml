  rationale: Здесь слово обозначает женский персонаж повествования, а не подчёркивает её роль жены.
- source_word: הַנָּחָשׁ
  choice: змею
  rationale: נָחָשׁ обозначает змею; это точный и естественный современный русский эквивалент.
- source_word: מִפְּרִי
  choice: плоды
  rationale: Буквально конструкция означает «от плода»; в русском при глаголе «есть» предлог не требуется, а множественное число естественно передаёт собирательное значение.
- source_word: עֵץ הַגָּן
  choice: деревьев в саду
  rationale: Хотя עֵץ морфологически стоит в единственном числе, в данном контексте оно имеет собирательно-распределительное значение; русский вариант во множественном числе ясно передаёт общую дозволенность.
- source_word: נֹאכֵל
  choice: мы можем есть
  rationale: Имперфект в контексте выражает дозволенность, перекликаясь с разрешением в Быт. 2:16; «можем есть» в современном русском естественно передаёт это значение.
theological_decisions:
- issue: Объём разрешения относительно деревьев и их плодов
  choice: 'Общее разрешение: «плоды деревьев в саду»'
  alternative: 'Буквально: «от плода дерева сада»'
  rationale: Единственное число עֵץ здесь допускает собирательное понимание, подтверждаемое контекстом Быт. 2:16 и последующим исключением в 3:3. Множественное число не создаёт ложного впечатления, будто речь пока идёт лишь об одном дереве.
