id: GEN.3.1
reference: Genesis 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: ru
  text: 'Змей был хитрее всех полевых животных, которых создал Яхве Бог[a]. Он сказал женщине: «Неужели Бог и правда сказал[b]: „Не ешьте ни от какого дерева в саду[c]“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проницательнее», «изворотливее». Еврейское слово в других контекстах может обозначать благоразумие, но здесь приобретает оттенок коварной хитрости.'
    reason: lexical_alternative
  - marker: b
    text: Повествователь говорит «Яхве Бог», а змей — только «Бог». Так сохраняется различие формулировок еврейского текста.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «от всякого дерева сада». В отрицательном вопросе выражение означает «ни от какого дерева» и передаёт преувеличение Божьего запрета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: Змей
  rationale: Определённая форма передана по-русски естественным обозначением уже введённого в повествование персонажа; начальный וְ не требует механического «и» при открытии новой сцены.
- source_word: עָרוּם
  choice: хитрее
  rationale: Слово может означать благоразумие, проницательность или хитрость. Здесь последующая вводящая в заблуждение реплика придаёт ему отрицательный оттенок; сравнительная степень передаёт конструкцию с מִכֹּל.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: всех полевых животных
  rationale: Сравнительная конструкция естественно звучит по-русски как «хитрее всех»; חַיַּת הַשָּׂדֶה обозначает животных поля, то есть наземных животных вне домашней сферы.
- source_word: אֲשֶׁר עָשָׂה
  choice: которых создал
  rationale: Относительное предложение отнесено к множественному русскому существительному «животных»; «создал» соответствует עָשָׂה в контексте повествования о творении.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Передаёт непосредственно присутствующее в еврейском тексте личное имя יהוה и следующее за ним אֱלֹהִים, не сводя сочетание к титулу.
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: Он сказал женщине
  rationale: Местоимение естественно сохраняет змея как подлежащее; «женщине» не вводит преждевременно имя Ева.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: Неужели Бог и правда сказал
  rationale: «Неужели» и «и правда» передают скептический, вкрадчивый характер вопроса, не превращая его в простое утверждение.
- source_word: לֹא תֹאכְלוּ
  choice: Не ешьте
  rationale: Форма множественного числа сохранена и естественно передаёт цитируемый запрет по-русски.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: ни от какого дерева в саду
  rationale: В области действия отрицания מִכֹּל естественно означает «ни от какого»; такая формулировка ясно передаёт преувеличенное представление змеем Божьего запрета.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, поэтому оно транслитерировано как «Яхве»; это также позволяет сохранить отличие между речью повествователя «Яхве Бог» и речью змея «Бог».
- issue: Нравственный оттенок עָרוּם
  choice: хитрее
  alternative: проницательнее / изворотливее
  rationale: Лексема допускает как положительную рассудительность, так и отрицательную хитрость. Контекст коварного вопроса поддерживает «хитрее», однако примечание сохраняет широту значения.
- issue: Объём запрета в вопросе змея
  choice: ни от какого дерева
  alternative: от всякого дерева
  rationale: Под отрицанием русское «ни от какого» лучше всего выражает подразумеваемый тотальный запрет и преувеличение змея; более буквальная форма может быть двусмысленна в современном русском.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Синтаксис вопроса естественен для устной реплики, но сохраняет риторическую напряжённость оригинала; архаизмы и конфессионально маркированные формулы не вводятся.
