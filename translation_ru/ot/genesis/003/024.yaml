  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: ru
  text: И изгнал Он человека, и к востоку от Эдемского сада[a] поставил херувимов и пламя меча, обращающегося во все стороны[b], чтобы охранять путь к дереву жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «на восточной стороне Эдемского сада» или «у восточной стороны Эдемского сада».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «пламя меча, обращающегося (или поворачивающегося)». Традиционный перевод: «пламенный меч, обращавшийся во все стороны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: изгнал
  rationale: Глагол גרשׁ обозначает принудительное удаление или изгнание; «изгнал» естественно и точно передаёт силу действия.
- source_word: הָאָדָם
  choice: человека
  rationale: В данном повествовательном контексте речь идёт о конкретном человеке, ранее помещённом в сад, а не о человечестве как отвлечённом целом.
- source_word: וַיַּשְׁכֵּן
  choice: поставил
  rationale: Каузативная форма от שכן означает поместить или расположить на определённом месте; «поставил» естественно сочетается с порученной охраной.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: к востоку от Эдемского сада
  rationale: Пространственное выражение указывает на восточную сторону сада; перевод сохраняет это значение без излишнего уточнения, находились ли стражи непосредственно у границы.
- source_word: הַכְּרֻבִים
  choice: херувимов
  rationale: Устоявшееся русское библейское наименование особых небесных существ; форма передаёт еврейское множественное число.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: пламя вращающегося меча
  rationale: Сохраняется конструкция «пламя меча» и причастное значение непрерывного поворачивания; перевод не сводит образ без необходимости просто к «пылающему мечу».
- source_word: לִשְׁמֹר
  choice: охранять
  rationale: В контексте преграждённого доступа глагол שׁמר выражает охрану и недопущение к объекту.
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: путь к дереву жизни
  rationale: Формально «путь дерева жизни» по смыслу обозначает путь, ведущий к нему; русский предлог «к» ясно и естественно выражает это отношение.
theological_decisions:
- issue: Значение אָדָם в данном повествовательном контексте
  choice: человека
  alternative: человечество
  rationale: Стих говорит о конкретном участнике повествования, изгнанном из Эдема. Перевод не превращает его здесь в собирательное обозначение всего человечества.
- issue: Характер образа меча и пламени
  choice: пламя вращающегося меча
  alternative: пылающий меч, обращавшийся во все стороны
  rationale: Еврейская конструкция допускает непривычный образ «пламени меча»; он сохранён, чтобы не устранять подлинную образную неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет последовательность еврейского рассказа; местоимение «Он» проясняет подразумеваемого Бога, не называя Его заново. Термин «херувимы» сохранён как устоявшееся специальное наименование.
