base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: ru
  text: 'Тогда Яхве Бог сказал женщине: «Что это ты сделала?» Женщина ответила: «Змей обманул меня[a], и я съела».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ввёл меня в заблуждение»; еврейский глагол может обозначать обман или введение в заблуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В сочетании יְהוָה אֱלֹהִים естественно образует «Яхве Бог», сохраняя имя и наименование.
- source_word: לָאִשָּׁה
  choice: женщине
  rationale: אִשָּׁה допускает значения «женщина» и «жена»; здесь повествовательное обозначение «женщина» лучше соответствует ближайшему контексту и не делает брачный оттенок основным.
- source_word: מַה זֹּאת עָשִׂית
  choice: Что это ты сделала?
  rationale: Сохраняет и вопросительное מַה, и указательное זֹּאת, не превращая вопрос в причинное «Зачем?» или «Почему?».
- source_word: הַנָּחָשׁ
  choice: Змей
  rationale: В контексте Бытия 3 «змей» — естественное литературное обозначение персонажа; оно сохраняет повествовательную и богословскую значимость образа.
- source_word: הִשִּׁיאַנִי
  choice: обманул меня
  rationale: Глагол обозначает введение в заблуждение или обман. «Обманул» ясно и современно передаёт основной смысл, не добавляя оттенка соблазнения.
- source_word: וָאֹכֵל
  choice: и я ела
  rationale: Сохраняет простое присоединение следующего действия союзом и не добавляет явно причинного «поэтому». Форма «ела» естественно оставляет подразумеваемый предмет пищи невыраженным, как в еврейском тексте.
theological_decisions:
- issue: Характер действия змея в объяснении женщины
  choice: Змей обманул меня
  alternative: Змей ввёл меня в заблуждение / обольстил меня
  rationale: Перевод прямо передаёт приписанный змею обман, не усиливая текст дополнительной идеей соблазнения и не снимая ответственности самой женщины, о которой стих прямо не рассуждает.
translation_notes:
  register: Современный литературный русский язык с простым, торжественным повествовательным строем. Реплики переданы естественно и без архаизмов; личное имя Яхве сохранено.
