  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: ru
  text: 'Женщине Он сказал: «Я многократно умножу твои страдания, связанные с беременностью[a]; в боли ты будешь рожать детей[b]. Твоё желание будет обращено к твоему мужу[c], а он будет править над тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твои страдания и твою беременность». Последнее еврейское слово может означать также «зачатие». Связь двух существительных допускает понимание «страдания, связанные с беременностью».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновей»; здесь, вероятно, имеются в виду дети или потомство вообще.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Ты будешь желать своего мужа». Редкое еврейское слово может обозначать желание или сильное влечение вообще. Одни понимают его как стремление к близости, другие — как желание подчинить себе; ср. Быт 4:7.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: женщине
  rationale: В сцене вынесения приговора речь обращена к женщине; значение «жена» здесь возможно лексически, но супружеское отношение прямо выражено далее словом אִישֵׁךְ.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Я многократно умножу
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие; формулировка сохраняет это подчёркивание и остаётся понятной по-русски.
- source_word: עִצְּבוֹנֵךְ
  choice: твои страдания
  rationale: Существительное охватывает боль, тяготу и мучительный труд. «Страдания» естественно соответствует контексту беременности и родов, не сужая значение исключительно до физической боли.
- source_word: וְהֵרֹנֵךְ
  choice: тяготы беременности
  rationale: Еврейское существительное может обозначать зачатие или беременность. В русском «беременность» здесь естественнее, а слово «тяготы» передаёт тесную смысловую связь с предшествующим обозначением страдания; буквальная сочинительная конструкция отмечена в сноске.
- source_word: בְּעֶצֶב
  choice: в муках
  rationale: Предложное сочетание описывает обстоятельства родов. «В муках» идиоматично по-русски и передаёт боль и тяжесть процесса.
- source_word: תֵּלְדִי בָנִים
  choice: ты будешь рожать детей
  rationale: בָנִים буквально означает «сыновья», но в данном обобщающем высказывании обозначает детей или потомство в целом.
- source_word: אִישֵׁךְ
  choice: к мужу
  rationale: Суффиксальная форма אִישׁ в данном отношении естественно обозначает мужа, а не просто мужчину.
- source_word: תְּשׁוּקָתֵךְ
  choice: Тебя будет влечь
  rationale: Редкое слово обозначает желание или влечение, но его точный оттенок спорен. Такая русская формулировка сохраняет неопределённость между близостью, зависимым стремлением и иными видами желания.
- source_word: יִמְשָׁל בָּךְ
  choice: он будет господствовать над тобой
  rationale: Глагол означает властвовать или править. Будущее время передаёт утверждение о том, что произойдёт, не превращая его в предписание.
theological_decisions:
- issue: Смысл влечения женщины к мужу
  choice: Сохранить широкое значение желания или влечения без уточнения его характера.
  alternative: Половое желание; стремление к близости или зависимость; желание подчинить себе, по аналогии с Быт 4:7.
  rationale: Слово תְּשׁוּקָה встречается редко, и контекст не позволяет бесспорно выбрать один оттенок. Основной текст не должен устранять эту реальную неоднозначность.
- issue: Описательный или предписывающий характер власти мужа
  choice: 'Передать как описание последующего положения: «он будет господствовать над тобой».'
  alternative: Понимать как установление или предписание мужской власти.
  rationale: Еврейская глагольная форма сообщает, что будет происходить, но сама по себе не выражает повеления или нравственного одобрения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для широкого читателя; усилительная конструкция оригинала и смысловая напряжённость второй половины стиха сохранены. Местоимение «Он» написано с прописной буквы согласно принятой русской библейской издательской традиции, без добавления имени говорящего.
