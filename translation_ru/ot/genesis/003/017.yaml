  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: ru
  text: 'Адаму же Он сказал[a]: «За то, что ты послушал голос своей жены и ел от дерева, о котором Я заповедал тебе: „Не ешь от него“, — проклята земля из-за тебя[b]. В мучительном труде[c] будешь питаться от неё во все дни своей жизни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеку». Еврейское אָדָם может здесь пониматься как имя «Адам» или как обозначение «человек».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «по твоей вине» или «по твоей причине». Еврейское выражение указывает на причинную связь между Адамом и проклятием земли.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может также означать «в скорби» или «с болью»; здесь оно связано с тяжёлым добыванием пищи.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: Адаму
  rationale: В данном повествовательном контексте речь идёт о конкретном человеке, поэтому слово передано как личное имя; возможное прочтение «человеку» отмечено в сноске.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: ты послушал голоса своей жены
  rationale: Передача сохраняет образный состав еврейского выражения «слушать голос» и одновременно естественно указывает на то, что Адам внял её словам, не усиливая смысл до однозначного «повиновался».
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: и ел от дерева
  rationale: Предлог מִן передан явно; в библейском контексте выражение «есть от дерева» понятно как вкушение его плода и сохраняет связь с формулировкой запрета.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: о котором Я заповедал тебе
  rationale: Относительная конструкция сохранена. Инфинитив לֵאמֹר не переводится отдельным словом «говоря», поскольку содержание повеления естественно вводится двоеточием.
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Не ешь от него
  rationale: Русская форма прямого запрета естественно передаёт модальную силу еврейского отрицания с имперфектом.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: проклята земля
  rationale: Сохранён эмфатический порядок сказуемого и подлежащего. «Земля» здесь обозначает почву, которую человеку предстоит возделывать.
- source_word: בַּעֲבוּרֶךָ
  choice: из-за тебя
  rationale: Фраза ясно передаёт причинный смысл и не создаёт возможного впечатления благой цели, которое могло бы возникнуть при варианте «ради тебя».
- source_word: בְּעִצָּבוֹן
  choice: в мучительном труде
  rationale: Слово охватывает боль, тяготу и скорбь; в контексте добывания пищи сочетание передаёт тяжесть труда, не устраняя смысловой переклички с болью женщины в предыдущем стихе.
- source_word: תֹּאכֲלֶנָּה
  choice: будешь питаться от неё
  rationale: Женский суффикс отсылает к земле. Формулировка не подразумевает буквального поедания почвы, а указывает на получение пропитания от неё.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: во все дни своей жизни
  rationale: Сохранены полнота и торжественный ритм еврейского идиоматического выражения.
theological_decisions:
- issue: Значение אָדָם в обращении
  choice: Адам
  alternative: человек
  rationale: Контекст допускает понимание слова и как имени конкретного персонажа, и как обозначения «человека». В основном тексте выбрано имя «Адам», а подлинная лексическая неоднозначность отражена в сноске.
- issue: Характер проклятия
  choice: проклята земля из-за тебя
  alternative: проклята земля ради тебя / по твоей вине
  rationale: Текст прямо относит проклятие к земле, а не к Адаму. «Из-за тебя» сохраняет причинную связь, не уточняя сверх текста, является ли оттенок исключительно виновным или целевым.
- issue: Смысл בְּעִצָּבוֹן
  choice: в мучительном труде
  alternative: в скорби / с болью
  rationale: Контекст земледельческого пропитания поддерживает значение тяжёлого труда, однако компонент боли и скорби остаётся возможным и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской торжественностью. Сохранены формула «послушал голоса» и инверсия «проклята земля», но синтаксис упрощён двоеточием перед прямой речью. Местоимения Бога написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
