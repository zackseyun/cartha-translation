base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: ru
  text: В поте лица твоего будешь есть хлеб, пока не возвратишься в землю[a], потому что из неё ты взят; ведь прах ты, и в прах возвратишься.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в поте лица твоего»; по-русски также: «в поте чела».'
    reason: 'Лексико-идиоматическая альтернатива: основной текст сохраняет еврейский образ, а сноска отмечает традиционный русский оборот.'
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: В поте лица твоего
  rationale: Формально и естественно передаёт еврейское выражение «в/при поте лица твоего», сохраняя исходный образ; более привычный русский оборот указан в сноске.
- source_word: תֹּאכַל לֶחֶם
  choice: будешь есть хлеб
  rationale: Сохраняет конкретное לֶחֶם «хлеб», которое в контексте также может обозначать пропитание вообще.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: пока не возвратишься в землю
  rationale: Передаёт предел продолжающегося труда и אֲדָמָה как землю/почву; «земля» естественно связывается с последующим прахом.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: потому что из неё ты взят
  rationale: Сохраняет причинную связь, женский род местоимения, отсылающего к «земле», и пассивную форму оригинала.
- source_word: כִּי
  choice: потому что / ведь
  rationale: Первое כִּי ясно вводит причину, второе — поясняющее основание; различие союзов делает ход мысли естественным по-русски, не меняя его функции.
- source_word: עָפָר
  choice: прах
  rationale: «Прах» точно и торжественно передаёт עָפָר в формуле человеческого происхождения и смертности, оставаясь понятным в современном литературном русском.
- source_word: תָּשׁוּב
  choice: возвратишься
  rationale: Будущее совершенного вида выражает объявленный и несомненный итог без архаической модальности.
theological_decisions:
- issue: Смертность человека и его происхождение из земного вещества
  choice: Текст утверждает возвращение человека в землю и прах, из которого он взят.
  alternative: Понимать возвращение в прах преимущественно как метафору унижения.
  rationale: Непосредственный контекст и параллель אֲדָמָה «земля» — עָפָר «прах» указывают на телесную смертность; перевод не добавляет последующих доктринальных выводов.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Инверсия «лица твоего» и слово «прах» уместно сохраняют достоинство и выразительность текста, не делая его непонятным.
