lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предыдущего утверждения змея; «ведь» естественно передаёт обосновывающую связь в современном русском.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: Бог знает
  rationale: Русское настоящее время идиоматично передаёт еврейское причастие при подлежащем.
- source_word: כִּי
  choice: что (передано бессоюзным пояснением после двоеточия)
  rationale: Второе כִּי вводит содержание знания Бога; двоеточие по-русски естественно оформляет это изъяснение без отдельного «что».
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Сохраняет образ «дня», но ясно передаёт временное значение оборота и не требует понимания строго как 24-часового периода.
- source_word: אֲכָלְכֶם מִמֶּנּוּ
  choice: вы вкусите от него
  rationale: «Вкусите» — понятное литературное обозначение принятия пищи, а «от него» сохраняет связь с плодом дерева, грамматически мужским в русском контексте.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: ваши глаза откроются
  rationale: Возвратная конструкция естественно передаёт еврейскую пассивно-результативную форму и сохраняет метафору прозрения.
- source_word: וִהְיִיתֶם
  choice: вы станете
  rationale: В данном контексте глагол обозначает переход в новое состояние; «станете» точнее и естественнее русского «будете».
- source_word: כֵּאלֹהִים
  choice: как Бог
  rationale: Единственное число лучше всего согласуется с ближайшим контекстом, где אֱלֹהִים обозначает Бога; реальная лексическая неоднозначность отмечена в сноске.
- source_word: יֹדְעֵי
  choice: знающими
  rationale: Творительный падеж согласуется с конструкцией «станете как Бог» и сохраняет компактную причастную форму исходного текста.
- source_word: טוֹב וָרָע
  choice: добро и зло
  rationale: Устойчивое русское выражение передаёт нравственный и различительный диапазон еврейской пары понятий.
theological_decisions:
- issue: Референт אֱלֹהִים в כֵּאלֹהִים
  choice: как Бог
  alternative: как боги; как божественные существа
  rationale: В непосредственном контексте то же слово обозначает единого Бога, а знание добра и зла представлено как свойственное Богу. Поскольку форма допускает и другие значения, они сохранены в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис остаётся ясным для широкого читателя; подлинная неоднозначность אֱלֹהִים не устранена, а вынесена в сноску.
