  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: ru
  text: 'Ведь Бог знает: в день, когда вы будете есть с него, ваши глаза откроются, и вы станете как Бог[a] и будете знать добро и зло.'
  philosophy: optimal-equivalence
  footnotes:
