  source_fidelity: 'Основной смысл передан точно: כִּי вводит объяснение, «Бог знает» верно отражает יֹדֵעַ אֱלֹהִים, временной оборот, открытие глаз и знание добра и зла сохранены. Однако «вкусите от него» способно означать лишь попробовать, тогда как אכל означает «есть»; местоимение «него» также оставляет менее ясную отсылку, чем нейтральное «с него» применительно к дереву. Причастный оборот «знающими» при «станете как Бог» грамматически возможен, но создаёт неудачную смысловую связь: по-русски он может восприниматься как характеристика Бога, а не будущего состояния людей. Лучше ясно отнести знание к адресатам.'
