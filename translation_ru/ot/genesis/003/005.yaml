  terminology: «Бог», «добро и зло» и сноска к כֵּאלֹהִים удачны. Альтернативы «как боги» и «как божественные существа» корректно сохраняют спорную семантику אֱלֹהִים. Маркер сноски поставлен непосредственно после спорного выражения.
