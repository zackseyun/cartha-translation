  source_fidelity: 'Текст точно передаёт структуру и основные лексические элементы еврейского оригинала: установленная Богом вражда, дважды повторённое «семя», мужское единственное הוּא и повтор одного редкого глагола שׁוּף. Одинаковое «поразит / поразишь» обоснованно сохраняет повтор и не решает спорную степень силы глагола в самом основном тексте. Конструкции «тебя в голову» и «его в пяту» естественно выражают направленность удара, подразумеваемую оригиналом.'
