base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: ru
  text: И Я положу вражду[a] между тобой и женщиной, между твоим семенем[b] и её семенем. Оно[c] поразит тебя в голову[d], а ты поразишь его в пяту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «враждебность».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семенем» в обоих случаях. Это слово может обозначать потомство в целом или отдельного его представителя.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Он поразит тебя в голову». В еврейском тексте после собирательного существительного «семя» стоит местоимение мужского рода единственного числа; русское «оно» согласовано со словом «семя».'
    reason: alternative_reading
  - marker: d
    text: В обеих частях еврейского текста употреблён один и тот же редкий глагол. Его можно также передать словами «ударить», «ушибить» или, с учётом удара в голову, «сокрушить».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: вражду
  rationale: Слово обозначает активную и длительную неприязнь или враждебность; «вражда» естественно и весомо передаёт его в современном русском языке.
- source_word: אָשִׁית
  choice: Я положу
  rationale: Глагол שׂים означает «класть, помещать, устанавливать». Выражение «положу вражду» сохраняет образ исходного текста и остаётся понятным по-русски.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: между тобой и женщиной
  rationale: Прямо передаёт повторяющуюся конструкцию со значением взаимного противостояния.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: твоим семенем ... её семенем
  rationale: «Семя» сохраняет повтор исходного образа и допускает как собирательное значение потомства, так и указание на отдельного представителя.
- source_word: הוּא
  choice: Оно
  rationale: В русском тексте местоимение согласовано с существительным среднего рода «семя». Возможность личного понимания еврейского местоимения мужского рода сохранена в примечании.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: поразит ... поразишь
  rationale: Один и тот же редкий еврейский глагол передан одинаково в обеих частях, чтобы не устранять его лексическую неоднозначность. Различие между ударами в голову и в пяту выражено самими объектами действия.
- source_word: רֹאשׁ
  choice: голову
  rationale: Прямое и естественное обозначение части тела; русская конструкция «поразить в голову» передаёт еврейское сочетание местоименного объекта с уточнением части тела.
- source_word: עָקֵב
  choice: пяту
  rationale: Точное обозначение части тела; «пята» соответствует возвышенному, но понятному регистру библейского текста.
theological_decisions:
- issue: Собирательное или индивидуальное понимание семени женщины
  choice: В основном тексте употреблены «семя» и согласованное с ним местоимение «оно»; индивидуальное прочтение указано в примечании.
  alternative: «Он поразит тебя в голову», с пониманием семени как отдельного представителя.
  rationale: Еврейское זֶרַע является собирательным существительным, а следующее за ним הוּא имеет форму мужского рода единственного числа. Русское «семя» сохраняет собирательный образ, но грамматически требует среднего рода. Примечание оставляет открытой возможность отнесения действия к отдельному представителю, не навязывая полного мессианского толкования.
- issue: Степень силы действия, выраженного глаголом שׁוּף
  choice: Оба употребления переданы глаголом «поразить».
  alternative: «Сокрушит тебе голову, а ты поразишь его в пяту» или «ушибёт ... ушибёшь».
  rationale: В еврейском тексте в обеих частях повторён один редкий глагол, точная сила которого спорна. Одинаковый русский глагол сохраняет повтор и неоднозначность, тогда как различная тяжесть повреждений следует из противопоставления головы и пяты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм исходного текста и повтор слов «семя» и «поразить» сохранены; архаичное, но общеупотребительное в библейском контексте слово «пята» выбрано ради точности и достоинства стиля.
