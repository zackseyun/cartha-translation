base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: ru
  text: Тогда у обоих открылись глаза, и они поняли, что наги. Они сшили между собой листья смоковницы и сделали себе повязки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опоясания», «пояса» или «передники». Точный вид одежды не указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: открылись
  rationale: Сохраняет еврейскую идиому и возвратно-пассивный смысл нифаля, не поясняя сверх текста характер нового восприятия.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: глаза у них обоих
  rationale: Естественная русская конструкция, сохраняющая акцент на обоих людях.
- source_word: וַיֵּדְעוּ
  choice: поняли
  rationale: В данном контексте ידע обозначает наступившее осознание; «поняли» естественно передаёт результат открывшихся глаз, не добавляя идеи стыда или совести.
- source_word: עֵירֻמִּם
  choice: наги
  rationale: Точно передаёт значение «обнажённые» и сохраняет литературную связь с Быт 2:25; краткая форма «наги» уместна в возвышенном, но понятном повествовании.
- source_word: וַיִּתְפְּרוּ
  choice: сшили
  rationale: Прямой и естественный эквивалент обозначенного действия.
- source_word: עֲלֵה תְאֵנָה
  choice: листья смоковницы
  rationale: Точная и привычная русская передача еврейской конструкции; «смоковница» соответствует библейскому литературному регистру.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: сделали себе
  rationale: Передаёт явное еврейское указание на действие для самих себя.
- source_word: חֲגֹרֹת
  choice: набедренные повязки
  rationale: Существительное обозначает предметы, которыми опоясываются. Выбор передаёт назначение одежды яснее, чем общее «прикрытия», при этом примечание сохраняет менее конкретные варианты.
theological_decisions:
- issue: Связь нового знания со стыдом и нравственным сознанием
  choice: 'Передать только прямо названную последовательность: глаза открылись, люди поняли, что наги, и сделали одежду.'
  alternative: Добавить, что им стало стыдно или что в них пробудилась совесть.
  rationale: Стыд подразумевается развитием повествования, но в этом стихе прямо не назван; перевод не должен заранее разрешать богословское напряжение.
- issue: Конкретность חֲגֹרֹת
  choice: набедренные повязки
  alternative: прикрытия; передники; пояса
  rationale: Еврейское слово указывает на то, чем опоясываются, однако точный покрой не описан. Основной текст передаёт функцию предмета, а примечание отмечает лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис прост и прозрачен; «наги» и «смоковница» сохраняют достоинство и межтекстовую связь, не делая текст архаичным.
