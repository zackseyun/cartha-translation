  terminology: «Смоковница» и «наги» уместны в умеренно возвышенном библейском регистре. «Повязки» сохраняет смысл одежды, надеваемой/завязываемой вокруг тела, не навязывая конкретизацию «набедренные». Примечание корректно отмечает варианты, но не должно компенсировать излишнюю конкретизацию основного текста.
