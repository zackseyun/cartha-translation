  source_fidelity: 'Основная последовательность и смысл переданы верно: у обоих открылись глаза, они осознали свою наготу, сшили листья смоковницы и изготовили для себя предметы одежды. Однако «набедренные повязки» чрезмерно конкретизирует חֲגֹרֹת: еврейское слово обозначает то, чем подпоясываются, но не определяет ни точный покрой, ни участок тела, который оно закрывает.'
