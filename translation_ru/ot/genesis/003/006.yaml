revisions:
- from: И увидела женщина, что дерево хорошо для пищи, приятно для глаз[a] и желанно для обретения мудрости[b]. Она взяла его плод и съела; дала также своему мужу, который был с ней, и он съел.
  to: И увидела женщина, что дерево хорошо для пищи, что оно приятно для глаз[a] и желанно, чтобы обрести мудрость[b]. Она взяла от плода его и съела; дала также своему мужу, который был с ней, и он съел.
  rationale: Правка сохраняет смысл и нейтральную оценочную лексику оригинала, устраняет чрезмерно окрашенное «вожделенно» из сноски и делает русский синтаксис более ясным. «Чтобы обрести мудрость» оставляет открытым вопрос о том, получает ли мудрость сам вкушающий или дерево наделяет ею; вариант с побудительным оттенком остаётся в сноске.
