base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: ru
  text: И увидела женщина, что дерево хорошо для пищи, что оно приятно для глаз[a] и желанно, чтобы обрести мудрость[b]. Она взяла от плода его и съела; дала также своему мужу, который был с ней, и он съел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желанно для глаз». Еврейское выражение подчёркивает зрительную привлекательность дерева.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы сделать мудрым». Еврейское выражение может обозначать как обретение мудрости или разумения, так и наделение ими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: увидела
  rationale: Передаёт обычное повествовательное значение глагола ראה без добавочного истолкования.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Сохраняет данное в еврейском тексте обозначение персонажа, не заменяя его именем или исключительно брачным статусом.
- source_word: טוֹב לְמַאֲכָל
  choice: хорошо для пищи
  rationale: Близко передаёт оценку пригодности дерева в пищу и сохраняет повторяющееся в Бытии слово «хорошо».
- source_word: תַאֲוָה הוּא לָעֵינַיִם
  choice: приятно для глаз
  rationale: Естественно по-русски выражает зрительную привлекательность дерева, не придавая слову תַאֲוָה заранее усиленной нравственно отрицательной окраски.
- source_word: וְנֶחְמָד הָעֵץ
  choice: и желанно
  rationale: Передаёт привлекательность и желанность дерева; средний род согласуется с русским словом «дерево».
- source_word: לְהַשְׂכִּיל
  choice: для обретения мудрости
  rationale: Передаёт целевое значение инфинитива и идею приобретения разумности или мудрости, не уточняя сверх текста механизм этого приобретения.
- source_word: מִפִּרְיוֹ
  choice: его плод
  rationale: В русском объект действия естественно выражается без буквального воспроизведения предлога מן; единственное число сохраняет собирательное значение еврейского «плод».
- source_word: וַתִּתֵּן גַּם
  choice: дала также
  rationale: Сохраняет добавочное значение גַּם и лаконичное повествовательное движение.
- source_word: לְאִישָׁהּ עִמָּהּ
  choice: своему мужу, который был с ней
  rationale: Ясно передаёт принадлежность и синтаксическую связь עִמָּהּ с мужем, сохраняя важную деталь его присутствия.
theological_decisions:
- issue: Нравственная окраска восприятия женщины
  choice: Нейтрально передать оценки словами «хорошо», «приятно» и «желанно».
  alternative: Использовать явно отрицательно окрашенные слова вроде «возжеленно», «соблазнительно» или «похоть».
  rationale: Еврейский текст описывает то, как женщина оценила дерево, но в самих этих словах не выражает нравственный приговор; отрицательную оценку не следует преждевременно вносить в лексику.
- issue: Значение לְהַשְׂכִּיל
  choice: «для обретения мудрости»
  alternative: «чтобы сделать мудрым»
  rationale: Форма может указывать как на приобретение разумения, так и на наделение им. Основной текст сохраняет целевую направленность и не определяет подразумеваемый субъект чрезмерно жёстко; альтернативный оттенок отмечен в сноске.
- issue: Присутствие мужа
  choice: «своему мужу, который был с ней»
  alternative: «своему мужу с ней»
  rationale: Придаточное предложение естественно для современного русского языка и ясно передаёт עִמָּהּ, не устраняя повествовательной детали о присутствии мужа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и плавным, без архаизмов; повтор «и» частично сохранён, а перед последовательностью действий поставлена точка для естественного русского ритма.
