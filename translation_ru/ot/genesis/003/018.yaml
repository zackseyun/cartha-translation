translation:
  language: ru
  text: Она произведёт для тебя колючки и чертополох[a], а ты будешь есть полевые растения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Она» относится к земле, названной в предыдущем стихе. Еврейский глагол имеет каузативное значение: земля произведёт или даст эту растительность. Точный ботанический вид слова, переданного как «чертополох», неизвестен; возможно также «колючий сорняк».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «растительность поля»; традиционно: «трава поля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ
  choice: колючки
  rationale: קוֹץ обозначает колючую растительность; собирательное множественное «колючки» естественно звучит по-русски и не уточняет ботанический вид.
- source_word: וְדַרְדַּר
  choice: чертополох
  rationale: דַּרְדַּר — колючий сорняк, названный в паре с קוֹץ. «Чертополох» сохраняет привычное различие между двумя элементами пары, не утверждая точный ботанический вид.
- source_word: תַּצְמִיחַ לָךְ
  choice: будет растить для тебя
  rationale: Каузативная форма глагола צמח указывает, что земля производит эту растительность. Оборот передаёт каузативный смысл естественным современным русским языком, а «для тебя» сохраняет явное לָךְ и его контекстуально тягостный оттенок.
- source_word: וְאָכַלְתָּ
  choice: а ты будешь питаться
  rationale: Форма продолжает описание будущего последствия. Союз «а» естественно подчёркивает переход от колючей поросли к тому, чем человеку предстоит питаться.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: полевыми растениями
  rationale: עֵשֶׂב имеет широкое значение съедобной растительности и не ограничивается травой. «Полевые растения» понятно современному читателю и сохраняет связь со שָׂדֶה, «полем».
theological_decisions:
- issue: Подразумеваемое подлежащее женского рода при תַּצְמִיחַ
  choice: Местоимение «она» относится к земле из предыдущего стиха.
  alternative: Безличная конструкция либо повтор существительного «земля».
  rationale: Еврейский глагол стоит в женском роде, единственном числе и естественно соотносится с הָאֲדָמָה в Быт. 3:17. Местоимение сохраняет межстиховую связь, не добавляя отсутствующего здесь существительного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Устаревшие «терния и волчцы» заменены понятными словами; при этом не заявляется точное ботаническое определение דַּרְדַּר. Межстиховое «она» намеренно сохраняет отсылку к земле из Быт. 3:17.
