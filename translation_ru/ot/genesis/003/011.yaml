  source_fidelity: 'Первая часть передана точно: מִי הִגִּיד לְךָ כִּי עֵירֹם אָתָּה — «Кто сказал тебе, что ты наг?» Настоящее время «ты наг» соответствует еврейскому именному предложению. Во втором вопросе исходная еврейская форма является нейтральным вопросом без отрицания; «не ел ли ты» в русском добавляет отрицательную форму и оттенок ожидаемого подтверждения. «Ел ли ты» сохраняет вопросительность без этого прагматического добавления. «С дерева, с которого Я запретил тебе есть» верно передаёт מִן ... מִמֶּנּוּ и запрет צִוִּיתִיךָ לְבִלְתִּי אֲכָל.'
