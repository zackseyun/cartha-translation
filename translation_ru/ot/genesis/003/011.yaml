base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: ru
  text: 'И Он сказал: «Кто сказал тебе, что ты наг? Ел ли ты с дерева, с которого Я запретил тебе есть?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И Он сказал
  rationale: Стандартная передача повествовательного wayyiqtol; местоимение сохраняет невыраженный в самом стихе подлежащий, а прописная буква указывает на ясного из контекста божественного Говорящего.
- source_word: מִי הִגִּיד לְךָ
  choice: Кто сказал тебе
  rationale: Глагол נגד в породе hифиль означает «сообщить, сказать, дать знать»; «сказал тебе» естественно в современном русском.
- source_word: כִּי עֵירֹם אָתָּה
  choice: что ты наг
  rationale: 'Именное предложение стоит в настоящем времени: буквально «что ты наг», без добавления прошедшего времени.'
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: Не ел ли ты с дерева
  rationale: Вопросительная частица הֲ вводит общий вопрос; конструкция «не ... ли» естественно передаёт вопрос, ожидающий признания, не превращая его в утверждение.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: с которого Я запретил тебе есть
  rationale: צוה с לבלתי выражает повеление не совершать действие. Русское «запретил тебе есть» точно и без синтаксической тяжеловесности передаёт «повелел тебе не есть»; מִמֶּנּוּ соотнесено с деревом посредством «с которого».
theological_decisions:
- issue: Обозначение Говорящего при невыраженном подлежащем
  choice: «Он» без добавления имени «Господь Бог»
  alternative: «Господь Бог сказал»
  rationale: В еврейском стихе субъект выражен только формой глагола третьего лица мужского рода; из контекста это Бог, но имя в данном предложении не повторяется.
- issue: Характер вопроса о вкушении
  choice: 'Сохранён прямой вопрос: «Не ел ли ты…?»'
  alternative: Утвердительное обвинение или вопрос «Ты ел…?»
  rationale: Вопросительная частица требует вопросительной формы; перевод не решает сверх текста, насколько вопрос риторический и предполагает ли он заранее известный ответ.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Наг» выбрано вместо разговорного «голый»; синтаксис остаётся ясным и естественным. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской религиозно-литературной норме.
