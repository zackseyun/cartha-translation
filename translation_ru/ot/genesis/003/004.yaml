  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: ru
  text: 'Но змей сказал женщине: «Вы вовсе не умрёте».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально повторяет глагол «умирать» в особой усилительной конструкции: «непременно умрёте»; с отрицанием: «вовсе не умрёте». Форма глагола — множественного числа.'
    reason: Пояснение эмфатической еврейской конструкции и грамматического числа.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: Последовательная форма продолжает повествование, однако в данном контексте речь змея прямо противоречит Божьему предупреждению; союз «но» естественно передаёт это противопоставление.
- source_word: הַנָּחָשׁ
  choice: змей
  rationale: נָחָשׁ означает змею или змея; традиционное и литературно уместное «змей» сохраняет роль этого персонажа в повествовании, не добавляя позднейших толкований.
- source_word: הָאִשָּׁה
  choice: женщине
  rationale: אִשָּׁה может означать «женщина» или «жена». Здесь повествование последовательно говорит о ней как о женщине до наречения имени Ева, поэтому выбран более широкий смысл.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: Нет, вы вовсе не умрёте
  rationale: Инфинитив абсолютный при личной форме глагола усиливает утверждение, а לֹא отрицает его. Частица «вовсе» передаёт категоричность отрицания и не допускает двусмысленного смысла «умрёте, но не наверняка». Множественное «вы» сохраняет число еврейской глагольной формы.
theological_decisions:
- issue: Сила отрицания в словах змея
  choice: 'Категорическое отрицание: «Нет, вы вовсе не умрёте»'
  alternative: «Вы не умрёте» или «Вы не обязательно умрёте»
  rationale: Еврейская конструкция подчёркнута и прямо обращает формулу предупреждения из Быт. 2:17 в отрицание. Перевод сохраняет остроту противоречия, не объясняя, идёт ли речь о немедленной или будущей смерти.
translation_notes:
  register: Современный литературный русский язык. «Змей» сохраняет принятую библейскую образность; «вовсе не умрёте» звучит естественно, достойно и передаёт безоговорочный характер отрицания.
