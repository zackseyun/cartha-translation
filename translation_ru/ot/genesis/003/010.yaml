  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: ru
  text: 'Он сказал: «Я услышал Твой голос[a] в саду, испугался, потому что я наг, и спрятался».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твой звук». Еврейское слово коль может означать «голос» или «звук».'
