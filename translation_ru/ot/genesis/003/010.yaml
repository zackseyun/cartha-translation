lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он ответил
  rationale: Форма вводит реплику человека в ответ на заданный ему вопрос; «ответил» естественно передаёт функцию глагола в контексте, не меняя содержания.
- source_word: אֶת קֹלְךָ
  choice: Я услышал Тебя
  rationale: Буквально речь идёт о «твоём קול» — звуке или голосе. По-русски «услышал Тебя» естественно сохраняет возможность понимать это как голос или как звук присутствия; буквальные варианты приведены в сноске.
- source_word: שָׁמַעְתִּי
  choice: услышал
  rationale: Прямое и естественное соответствие qal perfect 1cs глагола שמע.
- source_word: בַּגָּן
  choice: в саду
  rationale: Сохраняет определённое, уже известное из контекста место действия.
- source_word: וָאִירָא
  choice: и испугался
  rationale: Естественно передаёт возникший у человека страх и последовательность повествования.
- source_word: כִּי
  choice: потому что
  rationale: 'Передаёт причинное значение союза: нагота названа причиной страха.'
- source_word: עֵירֹם אָנֹכִי
  choice: я наг
  rationale: Именное предложение в еврейском не выражает времени; настоящее «я наг» сохраняет эту непосредственную самооценку и звучит достойно в литературном русском.
- source_word: וָאֵחָבֵא
  choice: и спрятался
  rationale: Форма имеет возвратный смысл; русский возвратный глагол точно и естественно его выражает, сохраняя простое соединение событий союзом «и».
theological_decisions:
- issue: Значение קוֹל применительно к присутствию Бога
  choice: услышал Тебя
  alternative: услышал Твой голос; услышал звук Твоего присутствия
  rationale: קוֹל допускает значения «голос» и «звук». Основной текст не уточняет, слышал ли человек речь или иной звук Божьего присутствия; русский оборот «услышал Тебя» сохраняет эту неоднозначность, а буквальные возможности раскрыты в сноске.
- issue: Временное значение עֵירֹם אָנֹכִי
  choice: я наг
  alternative: я был наг
  rationale: Еврейское именное предложение само по себе не маркирует времени. Настоящее время сохраняет непосредственный смысл слов человека, не исключая их роли как объяснения прошлого поступка.
- issue: Связь последнего действия с предшествующим
  choice: и спрятался
  alternative: поэтому спрятался
  rationale: Еврейский текст соединяет действия повествовательной формой с ו; причинно-следственная связь понятна из контекста, но не делается более явной, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified повествовательным строем. Местоимение «Тебя» написано с прописной буквы как принятая в русском библейском стиле форма почтительного обращения к Богу; это орфографическая конвенция, а не добавленное толкование.
