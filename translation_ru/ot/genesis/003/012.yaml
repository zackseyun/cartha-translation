  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: ru
  text: 'И сказал человек: «Женщина, которую Ты дал мне, чтобы она была со мной, — это она дала мне плод[a] с дерева, и я съел».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с дерева». Слово «плод» подразумевается из контекста.'
    reason: В еврейском тексте предмет после «дала мне» не назван; он восполнен для естественности русского выражения.
lexical_decisions:
- source_word: הָאָדָם
  choice: человек
  rationale: В данном контексте слово обозначает конкретного мужчину, однако русское «человек» естественно передаёт повторяющееся повествовательное наименование הָאָדָם и сохраняет связь с более широким значением слова.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Прямо передаёт еврейское слово и обозначает женщину, данную человеку; вариант «жена» здесь был бы более интерпретирующим.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: которую Ты дал мне, чтобы она была со мной
  rationale: Естественно выражает значение совместного пребывания и предназначения быть рядом, не устраняя заложенного в ответе намёка на Бога как Давшего женщину.
- source_word: הִוא
  choice: это она
  rationale: Самостоятельное местоимение имеет эмфатическую функцию; конструкция «это она» сохраняет акцент на женщине и перенос ответственности.
- source_word: נָתְנָה לִי
  choice: дала мне
  rationale: Простое прошедшее время соответствует завершённому действию в повествовании.
- source_word: מִן הָעֵץ
  choice: от дерева
  rationale: Буквально сохраняет выражение источника без добавления отсутствующего в стихе слова «плод»; подразумеваемый предмет понятен из контекста.
- source_word: וָאֹכֵל
  choice: и я ел
  rationale: Форма передаёт последовательное повествовательное действие; «ел» сохраняет обычное библейское повествовательное звучание и не добавляет причинного оттенка, который возник бы при «поэтому я съел».
theological_decisions:
- issue: Намёк на перекладывание вины на женщину и на Бога
  choice: 'Сохранено: «которую Ты дал мне… — это она дала мне»'
  alternative: «женщина дала мне» без повторного ударения либо усиленное «Ты сам дал мне эту женщину»
  rationale: Исходный текст допускает и даже подразумевает перенос ответственности, но перевод не должен ни смягчать, ни риторически усиливать обвинение.
- issue: Степень признания человеком собственной вины
  choice: Сохранено краткое «и я ел»
  alternative: «и поэтому я съел» или «но я всё же съел»
  rationale: Еврейский текст сообщает действие без явного причинного или уступительного союза; богословское напряжение признания и самооправдания оставлено открытым.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Заглавное «Ты» используется как уважительное обращение к Богу. Тире перед «это она» помогает передать эмфатическое הִוא без тяжеловесного «она сама».
