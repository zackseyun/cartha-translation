base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: ru
  text: «Но плодов дерева, которое посреди сада[a], — сказал Бог, — не ешьте и не прикасайтесь к нему, чтобы вам не умереть».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое находится в середине сада».'
    reason: 'Лексическая альтернатива для בְּתוֹךְ: выражение может подчёркивать нахождение во внутренней или средней части сада.'
lexical_decisions:
- source_word: וּמִפְּרִי
  choice: но плодов
  rationale: Союз в контексте передаёт противопоставление словам предыдущего стиха, а родительный падеж после подразумеваемого «есть» естественно выражает מִן в современном русском.
- source_word: הָעֵץ
  choice: дерева
  rationale: Прямое и контекстуально определённое обозначение дерева; русская форма определяется управлением слова «плодов».
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  choice: которое посреди сада
  rationale: «Посреди» естественно передаёт пространственное значение בְּתוֹךְ и сохраняет возможный смысл нахождения во внутренней, средней части сада.
- source_word: אָמַר אֱלֹהִים
  choice: сказал Бог
  rationale: Форма qatal сообщает о ранее произнесённых словах; русское прошедшее время точно и естественно.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: не ешьте
  rationale: Русский запрет во втором лице множественного числа естественно передаёт отрицательную форму yiqtol; объект уже выражен начальным сочетанием «плодов дерева», поэтому повторное «от него» было бы тяжеловесным.
- source_word: וְלֹא תִגְּעוּ בּוֹ
  choice: и не прикасайтесь к нему
  rationale: Сохраняются добавочный союз, прямой запрет и обычное значение נגע; местоимение относится к дереву.
- source_word: פֶּן תְּמֻתוּן
  choice: чтобы вам не умереть
  rationale: Конструкция передаёт предупредительно-предохранительный оттенок פֶּן, не превращая его без необходимости в категорическое предсказание.
theological_decisions:
- issue: В пересказе женщины к Божьему запрету добавлены слова о прикосновении, отсутствующие в Бытии 2:17.
  choice: Сохранить слова «и не прикасайтесь к нему» именно как часть речи женщины.
  alternative: Опустить или ослабить это добавление ради согласования с Бытием 2:17.
  rationale: Еврейский текст данного стиха явно содержит эти слова; перевод должен сохранять повествовательное и богословское напряжение, а не устранять его гармонизацией.
- issue: Модальность выражения פֶּן תְּמֻתוּן.
  choice: «чтобы вам не умереть»
  alternative: «иначе умрёте»
  rationale: Выбранная формулировка сохраняет оттенок опасения или предотвращения, присущий פֶּן, тогда как альтернатива звучит более категорически.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Инверсия «сказал Бог» и вставная конструкция сохраняют структуру реплики, не делая её архаичной. Маркер [a] помещён непосредственно после соответствующего оборота.
