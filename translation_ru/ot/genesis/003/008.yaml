  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: ru
  text: И услышали они звук[a] Яхве Бога, ходившего по саду в пору дневного ветра[b]; и человек[c], и его жена спрятались от лица Яхве Бога среди деревьев сада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голос». Еврейское слово может означать и «звук», и «голос».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в дневной прохладе». Буквально: «при ветре дня».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском: «человек» с определённым артиклем; также возможно: «Адам».'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: звук
  rationale: Еврейское слово может обозначать как голос, так и вообще звук. В данном контексте речь прямо не упоминается, поэтому «звук» сохраняет неоднозначность оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В сочетании с личным именем образует наименование «Яхве Бог».
- source_word: מִתְהַלֵּךְ
  choice: ходившего
  rationale: Сохраняет конкретный антропоморфный образ движения Бога по саду, не смягчая и не истолковывая его.
- source_word: בַּגָּן
  choice: по саду
  rationale: Русское «ходить по саду» естественно передаёт движение внутри обозначенного пространства.
- source_word: לְרוּחַ הַיּוֹם
  choice: во время дневного ветра
  rationale: Передаёт רוּחַ как «ветер» и не подменяет его предполагаемым следствием — прохладой; временное выражение сформулировано естественно по-русски.
- source_word: הָאָדָם
  choice: мужчина
  rationale: В сочетании «и его жена» слово обозначает конкретного мужчину, но наличие артикля и контекст позволяют не превращать его безоговорочно в собственное имя.
- source_word: וְאִשְׁתּוֹ
  choice: и его жена
  rationale: Прямая и естественная передача существительного с местоименным суффиксом.
- source_word: מִפְּנֵי
  choice: от лица
  rationale: Сохраняет пространственно-личностный образ еврейского выражения, буквально связанного с лицом или присутствием.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: среди деревьев сада
  rationale: Единственное число עֵץ здесь естественно понимается собирательно; русский контекст требует множественного числа «деревьев».
theological_decisions:
- issue: Антропоморфное изображение Бога, ходящего по саду
  choice: Сохранено конкретное «ходившего по саду».
  alternative: «двигавшегося по саду» или истолкование как проявления Божьего присутствия
  rationale: Еврейский рассказ изображает действие Бога конкретно; перевод не должен ни устранять антропоморфизм, ни объяснять его богословски.
- issue: Передача הָאָדָם
  choice: «мужчина»
  alternative: «человек» или «Адам»
  rationale: Упоминание его жены указывает на конкретного мужчину, тогда как перевод собственным именем снял бы сохраняющуюся в еврейском тексте связь с общим обозначением человека.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «от лица» намеренно сохраняет образность оригинала; личное имя передано как «Яхве». Все неоднозначные места отмечены сносками.
