base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: ru
  text: 'Тогда Яхве[a] Бог позвал человека и сказал ему: «Где ты?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Господь». Здесь еврейский текст содержит имя יהוה (Яхве).'
    reason: Указать традиционный русский способ передачи божественного имени и прояснить форму основного текста.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: Форма Qal wayyiqtol продолжает повествовательную последовательность. «Позвал» естественно передаёт обращённый к человеку зов; «воззвал» здесь звучало бы излишне архаично, а «призвал» могло бы подразумевать поручение или назначение.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Сочетание сохраняет личное имя, представленное тетраграмматоном, и следующее за ним обозначение אֱלֹהִים. Форма «Яхве» понятна в современном русском библейском употреблении; традиционный вариант «Господь Бог» указан в сноске.
- source_word: הָאָדָם
  choice: человека
  rationale: В данном контексте существительное с артиклем обозначает конкретного первого человека, к которому обращается Бог. Русское «человек» сохраняет связь с более широким значением אָדָם и здесь однозначно относится к мужчине из повествования.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал ему
  rationale: Перевод сохраняет явное местоименное дополнение לוֹ и параллельное продолжение повествования.
- source_word: אַיֶּכָּה
  choice: Где ты?
  rationale: Вопросительное слово с суффиксом второго лица мужского рода единственного числа передано прямым и естественным русским вопросом без добавления толкования.
- source_word: וַ
  choice: Тогда
  rationale: Начальный повествовательный союз при wayyiqtol обозначает последовательность событий; «тогда» естественно выражает её в современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Основной текст передаёт тетраграмматон как личное имя, не заменяя его титулом. Традиционная русская передача «Господь» сохранена в сноске, поскольку она широко известна читателям и отражает давнюю переводческую традицию.
- issue: Значение הָאָדָם
  choice: человек
  alternative: мужчина; Адам
  rationale: Артикль указывает на уже известного участника повествования, однако форма остаётся нарицательным обозначением. «Человек» сохраняет лексическую широту исходного слова; «мужчина» чрезмерно сужает смысл, а личное имя «Адам» не передаёт артикль и раньше времени снимает возможную смысловую связь с человечеством.
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной интонацией. Синтаксис близок к еврейской последовательности, но не выглядит дословным; архаизмы и добавочные толкования исключены.
