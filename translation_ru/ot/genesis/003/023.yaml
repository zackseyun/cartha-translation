  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: ru
  text: И выслал его Яхве Бог из Эдемского сада, чтобы он возделывал землю, из которой был взят[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрабатывал землю». Еврейский глагол может означать «работать», «служить», а в данном контексте — «обрабатывать, возделывать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: И выслал его
  rationale: 'Пиэль глагола שׁלח здесь передаёт удаление из сада: «выслал» сохраняет смысл отправления прочь, но не подменяет его более сильным «изгнал», соответствующим глаголу גרשׁ в следующем стихе.'
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Передаёт личное имя יהוה транслитерацией «Яхве» и сохраняет составное божественное наименование.
- source_word: מִגַּן עֵדֶן
  choice: из Эдемского сада
  rationale: Предлог מִן выражает удаление из места; такая форма естественна для современного русского языка.
- source_word: לַעֲבֹד
  choice: чтобы он возделывал
  rationale: С объектом «земля» глагол עבד имеет сельскохозяйственный смысл «обрабатывать, возделывать»; целевая конструкция передаёт לְ с инфинитивом.
- source_word: אֶת הָאֲדָמָה
  choice: землю
  rationale: אֲדָמָה обозначает почву, землю, из которой был взят человек; выбор сохраняет повествовательную связь с его сотворением.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: из которой был взят
  rationale: Относительная конструкция относится к земле; страдательная форма «был взят» точно передаёт לֻקַּח без добавления явно не названного деятеля.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон; «Яхве» прямо передаёт личное имя и не заменяет его титулом.
- issue: Характер порученного человеку труда
  choice: возделывал землю
  alternative: обрабатывал землю; трудился на земле; служил земле
  rationale: Сельскохозяйственное значение естественно при אֲדָמָה, при этом перевод не добавляет богословского истолкования труда как наказания или искупления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок «И выслал его Яхве Бог» слегка маркирован, но естественен и сохраняет повествовательный акцент исходного текста; «Эдемский сад» является общепонятной русской формой.
