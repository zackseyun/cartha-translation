base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: ru
  text: И сделал Яхве Бог для человека и для его жены кожаные одежды[a] и одел их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежды из кожи». Слово, переведённое как «одежды», может обозначать длинные нательные одежды, подобные хитонам. «Человека» можно также перевести как «Адама».'
    reason: Лексическая альтернатива и сохранение неоднозначности слова אָדָם.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Передаёт личное имя יהוה транслитерацией «Яхве», а אֱלֹהִים — обычным русским словом «Бог», сохраняя составное именование исходного текста.
- source_word: לְאָדָם
  choice: для человека
  rationale: В данном контексте אָדָם обозначает мужчину в противопоставлении его жене; нарицательное «человек» также сохраняет присущую еврейскому тексту возможность услышать здесь имя Адам.
- source_word: וּלְאִשְׁתּוֹ
  choice: и для его жены
  rationale: Суффикс третьего лица мужского рода при אִשָּׁה естественно передаётся как «его жена».
- source_word: כָּתְנוֹת עוֹר
  choice: кожаные одежды
  rationale: כֻּתֹּנֶת обозначает нательную или длинную одежду, а עוֹר — кожу; «кожаные одежды» звучит естественно и не уточняет покрой сверх сказанного в источнике.
- source_word: וַיַּעַשׂ
  choice: И сделал
  rationale: Прямо передаёт общеупотребительный глагол עשה и повествовательную последовательность формы wayyiqtol.
- source_word: וַיַּלְבִּשֵׁם
  choice: и одел их
  rationale: Каузативная форма глагола לבש означает «наделить одеждой, одеть»; русское «одел их» ясно и естественно передаёт действие над людьми.
theological_decisions:
- issue: Передавать ли אָדָם как имя собственное или как нарицательное
  choice: «человек»
  alternative: «Адам»
  rationale: Сочетание «для человека и для его жены» естественно сохраняет нарицательный смысл, заметный на этом этапе повествования, не исключая возможного понимания слова как имени; альтернативное чтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет краткость и последовательность еврейского повествования; формулировки понятны без специальной богословской подготовки.
