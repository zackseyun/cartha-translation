base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: ru
  text: И человек[a] дал своей жене имя Ева[b], потому что она была матерью всех живущих[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Адам». В древнееврейском тексте здесь стоит הָאָדָם (ха-адам), буквально «человек», с определённым артиклем.'
    reason: alternative_reading
  - marker: b
    text: Древнееврейское имя חַוָּה (Хавва) по звучанию связано здесь со словом חַי — «живущий, живой».
    reason: wordplay
  - marker: c
    text: 'Или: «матерью всего живого»; буквально: «матерью всех живущих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: назвал
  rationale: Форма Qal wayyiqtol от קרא в данной формуле обозначает наречение именем. Русское «назвал» естественно передаёт как действие, так и функцию этой формулы.
- source_word: הָאָדָם
  choice: человек
  rationale: Существительное употреблено с определённым артиклем и буквально означает «человек», а не бесспорно собственное имя. В русском контексте определённость уже известного участника не требует отдельного артикля.
- source_word: שֵׁם אִשְׁתּוֹ חַוָּה
  choice: назвал свою жену Евой
  rationale: Буквальная конструкция «назвал имя своей жены Ева» неестественна по-русски; творительный падеж после «назвал» точно и ясно передаёт древнееврейскую формулу наречения именем.
- source_word: חַוָּה
  choice: Ева
  rationale: Использована устоявшаяся русская форма библейского имени; связь древнееврейского звучания имени со словом «живущий» пояснена в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину или объяснение данного имени; «потому что» ясно передаёт причинное значение.
- source_word: הָיְתָה
  choice: была
  rationale: Форма היה здесь естественнее всего выражает состояние, а не переход в новое состояние; поэтому выбрано «была», а не «стала».
- source_word: אֵם כָּל חָי
  choice: матерью всех живущих
  rationale: Компактное выражение сохраняет субстантивированное значение חָי и не сужает явно его объём до одной заранее определённой категории.
theological_decisions:
- issue: Следует ли передавать הָאָדָם как собственное имя «Адам» или как обозначение «человек»
  choice: человек
  alternative: Адам
  rationale: Наличие определённого артикля поддерживает нарицательное прочтение «человек». Альтернативное традиционное понимание не исключено и приведено в сноске.
- issue: Объём выражения אֵם כָּל חָי
  choice: матерь всех живущих
  alternative: матерь всего живого
  rationale: Древнееврейское выражение лаконично и допускает некоторую широту. Основной текст не уточняет его как «всех людей» и тем самым сохраняет смысловую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис сделан естественным для русского языка, при этом сохранены причинная связь наречения имени, нарицательное הָאָדָם и открытый объём выражения «всех живущих».
