  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: ru
  text: 'И сказал Господь Бог змею[a]: «За то, что ты сделал это, проклят ты больше всех домашних животных и всех полевых зверей. На брюхе своём будешь ходить[b] и прах будешь есть во все дни жизни твоей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «змее».'
    reason: lexical_alternative
  - marker: b
    text: Выражения «ходить на брюхе» и «есть прах» могут также передавать образ унижения и поражения, а не только описывать способ движения и буквальную пищу.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: Господь Бог
  rationale: Традиционное и естественное русское соответствие сочетанию божественного имени יהוה и наименования אֱלֹהִים; сохраняет различие двух компонентов без транслитерации имени.
- source_word: הַנָּחָשׁ
  choice: змей
  rationale: «Змей» сохраняет возвышенный повествовательный регистр и грамматический мужской род еврейского слова; возможное общеупотребительное соответствие «змея» отмечено в сноске.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: За то, что ты сделал это
  rationale: Ясно передаёт причинное основание последующего проклятия и естественно вводит судебное изречение по-русски.
- source_word: אָרוּר אַתָּה
  choice: проклят ты
  rationale: Инверсия отражает вынесение сказуемого вперёд в еврейском тексте и сохраняет торжественный тон приговора.
- source_word: מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: более всякого скота и всякого полевого зверя
  rationale: «Более» передаёт сравнительное значение предлога מִן, не устраняя возможного оттенка выделения из ряда животных; «скот» обозначает домашних животных, а «полевой зверь» — животных вне этой категории.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: На брюхе своём будешь передвигаться
  rationale: Сохраняет конкретный образ «на брюхе», но не добавляет более узкого значения «ползать», которого сам глагол הלך прямо не выражает.
- source_word: וְעָפָר תֹּאכַל
  choice: и прах будешь есть
  rationale: Передаёт образ буквально и сохраняет выдвинутое положение слова «прах», не сводя выражение только к буквальному рациону или только к метафоре унижения.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: во все дни жизни твоей
  rationale: Сохраняет полноту и торжественный ритм еврейского выражения.
theological_decisions:
- issue: Кого обозначает змей в непосредственном контексте
  choice: В основном тексте обращение передано как обращение к змею без дополнительного отождествления.
  alternative: Добавить в перевод прямое отождествление змея с сатаной.
  rationale: Сам стих называет адресата הַנָּחָשׁ и описывает приговор в образах, относящихся к животному. Более поздние богословские связи не следует вносить в формулировку этого стиха.
- issue: Смысл поедания праха
  choice: Сохранён буквальный образ «прах будешь есть».
  alternative: Перевести исключительно как указание на унижение и поражение.
  rationale: Выражение допускает образный смысл унижения, но основной текст не должен исключать его конкретно-повествовательное звучание.
- issue: Сравнительное значение проклятия
  choice: «Проклят ты более всякого скота и всякого полевого зверя».
  alternative: «Проклят ты среди/из всех животных».
  rationale: Предлог מִן естественно допускает сравнительное прочтение; выбранный вариант сохраняет его, не утверждая, что в данном стихе отдельно провозглашается проклятие каждого другого животного.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Архаизмы сведены к минимуму; сохранены естественные для высокого повествования инверсия «проклят ты» и формула «во все дни жизни твоей».
