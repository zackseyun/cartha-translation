source:
  edition: WLC
  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: ru
  text: Не может быть, чтобы Ты поступил так — погубил праведного вместе с нечестивым, так что с праведным будет то же, что с нечестивым. Да не будет этого от Тебя! Разве Судья всей земли не поступит справедливо?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה
  choice: Неужели Ты сделаешь такое / Не может быть, чтобы Ты так поступил
  rationale: Междометная формула выражает решительное отвержение и нравственное негодование. В первом случае она естественно соединена с последующим инфинитивом как риторический вопрос, а повтор передан прямой формулой решительного отрицания.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: сделаешь такое
  rationale: 'Идиоматично передаёт запретительно-отвергающую конструкцию с инфинитивом: речь идёт о немыслимости подобного поступка.'
- source_word: לְהָמִית
  choice: погубишь
  rationale: Hiphil глагола מות имеет каузативное значение «предать смерти, умертвить». «Погубишь» естественно в данном повествовательном контексте и ясно обозначает причинение смерти.
- source_word: צַדִּיק
  choice: праведного
  rationale: Сохраняет нравственно-судебное значение и прямое противопоставление нечестивому; единственное число соответствует еврейскому собирательно-типическому употреблению.
- source_word: עִם רָשָׁע
  choice: вместе с нечестивым
  rationale: Передаёт עִם и сохраняет формальное противопоставление двух лиц или типов в единственном числе.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: так что праведный окажется наравне с нечестивым
  rationale: 'Выражает недопустимый результат общего приговора: между праведным и нечестивым не будет проведено различия. «Наравне» естественно передаёт сравнительную конструкцию, не утверждая их нравственного тождества.'
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: Неужели Судья всей земли
  rationale: Причастие употреблено субстантивно как обозначение Бога; прописная буква уместна для титула. «Вся земля» сохраняет возможный всемирный охват выражения.
- source_word: מִשְׁפָּט
  choice: правосудия
  rationale: В данном риторическом вопросе слово обозначает справедливое судебное действие. Сочетание «совершить правосудие» сохраняет как юридический, так и нравственный оттенок.
theological_decisions:
- issue: Риторическое обращение Авраама к справедливости Бога
  choice: Неужели Судья всей земли не совершит правосудия?
  alternative: Разве Судья всей земли не поступит справедливо?
  rationale: Выбранный вариант сохраняет смелость вопроса, ожидаемый утвердительный ответ и судебную лексику מִשְׁפָּט, не превращая фразу в отвлечённое утверждение о Божьем характере.
- issue: Смысл уподобления праведного нечестивому
  choice: праведный окажется наравне с нечестивым
  alternative: с праведным будет то же, что с нечестивым
  rationale: Формулировка передаёт равное обращение при общем уничтожении, не подразумевая, что праведный становится нравственно нечестивым.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной силой прямой речи. Сохранены повтор חָלִילָה, судебная образность и напряжённый риторический вопрос. Местоимение «Ты» написано с прописной буквы как принятая в русском библейском регистре форма почтительного обращения к Богу.
