  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: ru
  text: И Яхве[a] ушёл, закончив говорить с Авраамом, а Авраам вернулся на своё место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH), тетраграмматон; также передают как «Иегова», а традиционно заменяют словом «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Глагол הלך в данном повествовательном контексте обозначает уход; краткое «пошёл» сохраняет образ движения и не добавляет отсутствующего в еврейском тексте направления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כַּאֲשֶׁר כִּלָּה לְדַבֵּר
  choice: окончив говорить
  rationale: Естественная русская конструкция точно передаёт временное отношение и завершённость действия.
- source_word: אֶל אַבְרָהָם
  choice: с Авраамом
  rationale: В современном русском «говорить с кем-либо» звучит естественно; значение адресованной Аврааму речи сохраняется, хотя אֶל буквально указывает направление «к/Аврааму».
- source_word: שָׁב
  choice: вернулся
  rationale: Точно передаёт возвращение, обозначенное глаголом שוב.
- source_word: לִמְקֹמוֹ
  choice: на своё место
  rationale: Сохраняет буквальную неопределённость מָקוֹם и не конкретизирует его как дом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет это имя; традиционная замена «Господь» превращает его в титул, а «Иегова» отражает более позднюю форму прочтения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет повествовательную связь וַ; причастно-деепричастная конструкция делает последовательность действий ясной и естественной.
