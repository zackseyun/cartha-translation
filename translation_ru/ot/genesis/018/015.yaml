base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: ru
  text: 'Сарра же отрицала это, говоря: «Я не смеялась», — потому что боялась. Но он сказал: «Нет, ты смеялась»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: В этой части стиха говорящий прямо не назван; из окружающего повествования следует, что это Господь.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: стала отрицать
  rationale: Порода пиэль глагола כחשׁ допускает значения отрицания и неправды. В данном контексте Сарра отрицает, что смеялась; этот вариант естественен по-русски и не усиливает без необходимости нравственную оценку до прямого «солгала».
- source_word: לֵאמֹר
  choice: прямая речь после двоеточия
  rationale: Стандартный древнееврейский оборот, вводящий цитату; в современном русском его естественно передать пунктуационно, без отдельного «сказав».
- source_word: לֹא צָחַקְתִּי
  choice: Я не смеялась
  rationale: Прямая передача отрицательной формы перфекта первого лица единственного числа.
- source_word: כִּי יָרֵאָה
  choice: потому что испугалась
  rationale: כִּי указывает причину отрицания. Русский совершенный вид естественно передаёт возникший в данной ситуации страх.
- source_word: וַיֹּאמֶר
  choice: Но он сказал
  rationale: Союз «но» ясно передаёт противопоставление между отрицанием Сарры и последующим возражением; субъект оставлен местоименным, как в еврейской фразе.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Нет, ты смеялась
  rationale: Начальное לֹא отвергает слова Сарры, а כִּי вводит категорическое возражение. По-русски краткая формула с «нет» естественно сохраняет силу ответа без искусственного добавления «но».
theological_decisions:
- issue: Кто говорит в וַיֹּאמֶר
  choice: «он сказал», без явного называния Господа
  alternative: «Господь сказал» или «один из мужчин сказал»
  rationale: 'В самой этой части стиха субъект повторно не назван: употреблён лишь глагол мужского рода в единственном числе. Контекст связывает говорящего с Господом, однако перевод сохраняет формальную неопределённость данного предложения и позволяет контексту установить личность говорящего.'
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-повествовательным библейским регистром. Частица «же» отмечает переход к реакции Сарры; лексика остаётся доступной обычному читателю. Все сноски имеют маркеры в основном тексте.
