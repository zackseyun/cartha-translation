  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: ru
  text: 'И он сказал: «Я непременно вернусь к тебе примерно в это же время через год[a], и вот, у Сарры, твоей жены, будет сын». Сарра же слушала у входа в шатёр, позади него[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в пору жизни»; это трудное выражение обычно понимается как указание на соответствующее время следующего года.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза предельно кратка: «и он был позади него». Мужское местоимение может относиться к входу или шатру; по смыслу Сарра находилась у входа позади говорящего. Возможный перевод: «у входа в шатёр, который был позади него».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: Обычная передача повествовательной формы wayyiqtol; местоимение сохраняет неопределённость личности говорящего в самом стихе.
- source_word: שׁוֹב אָשׁוּב
  choice: Я непременно вернусь
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает утверждение; наречие «непременно» естественно передаёт эту эмфазу.
- source_word: כָּעֵת חַיָּה
  choice: примерно в это же время через год
  rationale: Контекстуальная передача идиомы, обозначающей соответствующее время следующего года; «примерно» отражает сравнительно-временное כְּ.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную и привлекающую внимание функцию частицы, оставаясь естественным в современном русском.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: у Сарры, твоей жены, будет сын
  rationale: Конструкция с לְ передаёт обладание/появление; русская конструкция «у … будет» сохраняет форму обещания и звучит естественно.
- source_word: וְשָׂרָה שֹׁמַעַת
  choice: Сарра же слушала
  rationale: Причастие выражает продолжающееся действие; «слушала» точнее контекстуального «слышала», а «же» отмечает смену фокуса повествования.
- source_word: פֶּתַח הָאֹהֶל
  choice: у входа в шатёр
  rationale: Естественная современная передача сочетания «вход/отверстие шатра».
- source_word: וְהוּא אַחֲרָיו
  choice: позади него
  rationale: Краткая пространственная формулировка сохраняет основную сцену, не вводя в текст искусственного мужского лица; неоднозначность отнесения местоимения пояснена в сноске.
theological_decisions:
- issue: Личность говорящего
  choice: «он», без уточнения
  alternative: «Господь» или «один из мужчин»
  rationale: В данном стихе еврейский текст употребляет лишь глагол в третьем лице мужского рода. Более точное именование субъекта потребовало бы внести контекстуальное толкование непосредственно в перевод.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис в прямой речи естественный, без архаизмов; подлинная неоднозначность заключительной фразы вынесена в сноску.
