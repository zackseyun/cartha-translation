  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: ru
  text: И взял он творог[a], молоко и приготовленного телёнка и поставил всё перед ними. Сам же он стоял возле них[b] под деревом, пока они ели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сливки» или «масло»; еврейское слово обозначает густой молочный продукт, точный вид которого зависит от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «над ними»; вероятно, имеется в виду, что он стоял рядом, прислуживая гостям как хозяин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: творог
  rationale: Слово обозначает густой молочный продукт; в пастушеском контексте «творог» естественнее современного «масла», однако точный вид продукта неясен.
- source_word: חָלָב
  choice: молоко
  rationale: Прямое и общеупотребительное соответствие еврейскому существительному.
- source_word: וּבֶן הַבָּקָר
  choice: телёнка
  rationale: Буквально «сына крупного скота»; это идиоматическое обозначение молодого животного из стада, уже упомянутого в предыдущем стихе.
- source_word: אֲשֶׁר עָשָׂה
  choice: приготовленного
  rationale: В контексте подачи пищи глагол עשה означает приготовление; причастная конструкция по-русски передаёт это естественно и без неясного местоимения.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: и поставил всё перед ними
  rationale: Буквально «дал перед ними»; русский оборот точно передаёт подачу угощения. «Всё» естественно объединяет перечисленные продукты, не добавляя нового предмета.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Сам же он стоял возле них
  rationale: Форма с причастием описывает продолжающееся положение Авраама рядом с гостями. «Возле них» передаёт хозяйское присутствие, тогда как буквальное «над ними» по-русски могло бы ошибочно подразумевать господство.
- source_word: תַּחַת הָעֵץ
  choice: под деревом
  rationale: Прямой и естественный перевод предложного сочетания.
- source_word: וַיֹּאכֵלוּ
  choice: пока они ели
  rationale: В контексте последовательная форма выражает действие гостей, происходившее в то время, когда Авраам стоял возле них; временное придаточное естественно передаёт связь действий.
theological_decisions:
- issue: Следует ли переводом подчёркивать позднейшее христологическое или тринитарное толкование посетителей
  choice: Передать стих как обычное повествование о гостеприимстве Авраама, не уточняя природу посетителей.
  alternative: Использовать возвышенную лексику или особые формулировки, намекающие на божественный статус посетителей.
  rationale: Сам еврейский текст этого стиха описывает поданное угощение и поведение хозяина; богословская идентификация посетителей здесь прямо не выражена и не должна вноситься в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь с предыдущим стихом; инверсия избегается, кроме естественного эмфатического «Сам же он».
