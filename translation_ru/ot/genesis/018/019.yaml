  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: ru
  text: Ибо Я знаю его[a], чтобы он заповедал своим сыновьям и своему дому, чтобы они после него хранили путь Яхве, поступая праведно и справедливо[b], — чтобы Яхве исполнил для Авраама то, что сказал о нём[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я избрал его». Древнееврейский глагол обычно означает «знать», но в данном контексте может подразумевать особое благоволение или избрание.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «творя праведность и суд». «Дом» здесь означает домашних Авраама, а не здание.'
    reason: cultural_note
  - marker: c
    text: 'Или: «то, что обещал ему». Буквально древнееврейский текст говорит: «то, что сказал о нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим высказыванием естественным для русского языка способом.
- source_word: יְדַעְתִּיו
  choice: Я знаю его
  rationale: Сохраняет основное значение глагола ידע и настоящее значение перфекта при глаголе состояния; возможный оттенок избрания не вносится в основной текст, а отмечается в сноске.
- source_word: לְמַעַן אֲשֶׁר
  choice: чтобы
  rationale: Естественно передаёт целевое значение конструкции.
- source_word: יְצַוֶּה
  choice: заповедал
  rationale: Передаёт сильное значение породы пиэль глагола צוה — повелеть, обязать; в библейском контексте «заповедать» звучит достойно и понятно.
- source_word: בָּנָיו
  choice: своим сыновьям
  rationale: Сохраняет явно мужскую форму древнееврейского существительного; дальнейшее «всему своему дому» расширяет круг адресатов.
- source_word: בֵּיתוֹ
  choice: всему своему дому
  rationale: «Дом» здесь означает домашнее сообщество Авраама, а не здание; добавление «всему» естественно обозначает совокупность его домочадцев.
- source_word: וְשָׁמְרוּ
  choice: хранить
  rationale: В сочетании с «путём» глагол שׁמר означает верно соблюдать и держаться его.
- source_word: דֶּרֶךְ יְהוָה
  choice: путь Яхве
  rationale: Сохраняет образ пути как требуемого Богом образа жизни и передаёт тетраграмматон личным именем.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: поступать праведно и справедливо
  rationale: Передаёт этическую пару צדקה и משפט естественной русской глагольной конструкцией, сохраняя различие между праведностью и справедливостью.
- source_word: הָבִיא ... עַל אַבְרָהָם
  choice: исполнил для Авраама
  rationale: Буквально конструкция означает «навёл/привёл на Авраама», но в сочетании с благим обещанием естественный русский эквивалент — исполнить сказанное для него.
- source_word: אֵת אֲשֶׁר דִּבֶּר עָלָיו
  choice: то, что сказал о нём
  rationale: Сохраняет буквальное и несколько неоднозначное «сказал о нём», не заменяя его однозначно словом «обещал».
theological_decisions:
- issue: Передавать ли ידע как знание или как избрание
  choice: Я знаю его
  alternative: Я избрал его
  rationale: Контекст допускает особое признание и избрание, однако собственное значение глагола — «знать». Основной текст сохраняет лексику источника, а богословски значимая альтернатива вынесена в сноску.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Связь человеческого послушания с исполнением Божьего слова
  choice: Сохранена двойная целевая конструкция «чтобы… чтобы…»
  alternative: Сгладить связь и представить вторую часть как простое последующее событие
  rationale: Древнееврейский текст дважды употребляет למען и тем самым ставит воспитание дома, праведную жизнь и исполнение сказанного Богом в напряжённую целевую связь; перевод не должен её устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет две целевые конструкции оригинала, а тире поясняет, в чём состоит хранение пути Яхве. Все маркеры сносок размещены непосредственно в основном тексте.
