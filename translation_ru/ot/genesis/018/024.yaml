source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: ru
  text: А если в городе найдётся пятьдесят праведников[a]? Неужели Ты погубишь город и не пощадишь этого места[b] ради пятидесяти праведников, которые в нём?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Может быть, в городе есть пятьдесят праведников».'
    reason: 'Лексико-синтаксическая альтернатива: אוּלַי может быть передано наречием вероятности, а יֵשׁ — обычной бытийной конструкцией.'
  - marker: b
    text: 'Или: «и не простишь этому месту».'
    reason: Глагол נשא допускает значение прощения или снятия вины, хотя в данном контексте основным является смысл сохранения от уничтожения.
lexical_decisions:
- source_word: אוּלַי יֵשׁ
  choice: А если … найдётся
  rationale: Естественно вводит предположение Авраама и сохраняет вероятностно-условную силу сочетания אוּלַי с бытийной конструкцией יֵשׁ.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: пятьдесят праведников
  rationale: Русское существительное во множественном числе обозначает праведных людей без добавления отсутствующего в еврейском тексте указания на пол.
- source_word: בְּתוֹךְ הָעִיר
  choice: в городе
  rationale: Передаёт нахождение внутри города естественным современным русским языком; более буквальное «посреди города» здесь могло бы ошибочно указывать на его центральную часть.
- source_word: הַאַף תִּסְפֶּה
  choice: Неужели Ты погубишь город
  rationale: «Неужели» передаёт усиленную риторическую вопросительность הַאַף, а «погубишь» — уничтожение в результате суда. Объект, подразумеваемый в еврейском тексте, назван для ясности.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: и не пощадишь этого места
  rationale: В данном контексте נשא означает отказ от уничтожения, то есть сохранение города; «пощадишь» ясно выражает противопоставление гибели.
- source_word: לְמַעַן
  choice: ради
  rationale: Кратко и точно выражает основание, по которому Авраам просит сохранить город.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: которые в нём
  rationale: Сохраняет относительное придаточное и повторно подчёркивает, что праведники находятся внутри города.
theological_decisions:
- issue: Значение נשא в просьбе о городе
  choice: пощадишь этого места
  alternative: простишь этому месту / простишь это место
  rationale: Непосредственное противопоставление — между уничтожением города и отказом от его уничтожения ради праведников. «Пощадишь» передаёт судебно-повествовательный смысл, не сводя выражение исключительно к прощению вины.
translation_notes:
  register: Современный литературный русский язык с достойной, но общедоступной библейской интонацией. Обращение к Богу оформлено с прописной буквы. Риторический напор вопроса сохранён без архаизмов; подлинная многозначность נשא отмечена в сноске.
