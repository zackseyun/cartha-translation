base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: ru
  text: 'Он снова обратился к нему и сказал: «Может быть, там найдутся сорок?» Тот сказал: «Ради сорока Я не сделаю этого[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не уничтожу его ради сорока». В еврейском тексте сказано буквально: «Я не сделаю», а подразумеваемое действие определяется из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: снова заговорил
  rationale: Сочетание יסף + עוד + инфинитив передаёт повторение или продолжение речи. «Снова заговорил» естественно выражает повторность, не воспроизводя буквально тяжеловесное «ещё прибавил говорить».
- source_word: אֵלָיו
  choice: с ним
  rationale: В данном русском обороте «заговорил с ним» звучит естественнее, чем «заговорил к нему», и передаёт направленность речи к собеседнику.
- source_word: אוּלַי
  choice: может быть
  rationale: Передаёт осторожно высказанное предположение в ходатайстве Авраама и соответствует современному литературному русскому языку.
- source_word: יִמָּצְאוּן
  choice: найдутся
  rationale: Возвратная форма естественно передаёт нифаль глагола מצא — «быть найденными, найтись» — в гипотетическом условии.
- source_word: שָׁם
  choice: там
  rationale: Прямое и естественное соответствие локативному наречию.
- source_word: אַרְבָּעִים
  choice: сорок
  rationale: Числительное передано непосредственно; подразумеваемое существительное «праведников» сохраняется невыраженным, как в еврейском тексте и ближайшем контексте.
- source_word: לֹא אֶעֱשֶׂה
  choice: Я не сделаю этого
  rationale: В еврейском тексте действие оставлено невыраженным и восстанавливается из контекста. Местоимение «этого» делает фразу естественной по-русски, не уточняя действие в основном тексте.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: ради этих сорока
  rationale: «Ради» передаёт значение основания и ходатайства; указательное «этих» естественно оформляет субстантивированное числительное и соотносит его с предполагаемыми сорока людьми.
theological_decisions:
- issue: Неуказанный объект Божьего действия в לֹא אֶעֱשֶׂה
  choice: 'Сохранить смысловую неполноту: «Я не сделаю этого»'
  alternative: «Я не уничтожу город» / «Я не погублю его»
  rationale: Еврейский текст не называет действие прямо, а отсылает к предшествующему разговору. Основной перевод не должен снимать эту эллиптичность путём добавления конкретного объекта или действия.
- issue: Не названные прямо сорок человек
  choice: «этих сорока» без добавления «праведников»
  alternative: «сорока праведников»
  rationale: Хотя из контекста ясно, о ком идёт речь, в данном стихе существительное отсутствует. Перевод сохраняет эту контекстуальную подразумеваемость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повторение двух глаголов речи сохранено, но смягчено естественным оборотом «снова заговорил… и сказал». Строчная форма местоимения «ним» в повествовании не добавляет отсутствующей в оригинале конфессиональной типографической маркировки; прописное «Я» в прямой речи обусловлено началом самостоятельной реплики.
