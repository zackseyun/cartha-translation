  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: ru
  text: И явился ему Яхве у дубов Мамре[a], когда он сидел у входа в шатёр во время дневного зноя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у терпентинных деревьев Мамре». Еврейское слово может обозначать крупные деревья, например дубы или терпентинные деревья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה здесь обозначает зримое явление. «Явился» естественно для повествования и не добавляет толкования, заключённого в варианте «открыл Себя».
- source_word: אֵלָיו
  choice: ему
  rationale: Точно передаёт предлог с суффиксом 3-го лица мужского рода единственного числа; адресат определяется предшествующим контекстом как Авраам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: у дубов Мамре
  rationale: Предлог בְּ в данном пространственном выражении естественно передаётся как «у». Слово אֵלוֹן может обозначать крупное дерево, обычно дуб или терпентинное дерево; в основном тексте выбран понятный традиционный вариант «дубы», а неопределённость вида отмечена в сноске.
- source_word: וְהוּא יֹשֵׁב
  choice: когда он сидел
  rationale: Причастная конструкция задаёт фоновое обстоятельство происходящего; «когда он сидел» естественно передаёт её повествовательную функцию.
- source_word: פֶּתַח הָאֹהֶל
  choice: у входа в шатёр
  rationale: Пֶּתַח означает вход или проём. «У входа в шатёр» конкретно и идиоматично; «шатёр» уместен для жилища патриарха.
- source_word: כְּחֹם הַיּוֹם
  choice: во время дневного зноя
  rationale: Передаёт время сильной дневной жары, не уточняя без достаточных оснований конкретный час.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон. Форма «Яхве» сохраняет личное имя и наиболее вероятное произношение, не подменяя имя титулом.
- issue: Кто является Аврааму в последующем эпизоде
  choice: 'Сохранено прямое утверждение стиха: «явился ему Яхве»'
  alternative: Истолковать явление как явление исключительно через трёх путников или заранее отождествить одного из них с Яхве
  rationale: Стих прямо называет Яхве субъектом явления, но ещё не объясняет соотношение этого утверждения с тремя мужами в следующем стихе. Перевод не должен преждевременно устранять повествовательное и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; сохранены местоименная отсылка «ему» и неопределённость относительно точного вида деревьев.
