revisions:
- from: Сойду же и посмотрю, всё ли они сделали в соответствии с воплем о ней, дошедшим до Меня[a]; а если нет — узнаю[b].
  to: Сойду теперь и посмотрю, совершили ли они всё то, о чём свидетельствует дошедший до Меня вопль о ней[a]; а если нет — узнаю[b].
  rationale: Исправлены два места, где русский текст либо смещал оттенок исходного выражения, либо звучал неестественно. «Теперь» передаёт נָא при когортативе без разговорного или полемического оттенка «же». Трудный оборот עָשׂוּ כָּלָה передан через сопоставление содеянного с воплем и сохранённую идею полноты («всё то»), без доктринального или судебно-правового истолкования. Сноска b сделана содержательной и сохраняет лаконичную неоднозначность оригинала.
