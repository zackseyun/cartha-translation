    rationale: Она не передаёт наиболее естественный в данном контексте оттенок נָא и в русском может звучать как возражение или логический акцент. «Теперь» лучше отражает непосредственность решения.
  - severity: medium
    issue: «всё ли они сделали в соответствии с воплем»
    rationale: Оборот «в соответствии с воплем» неестественно представляет вопль нормой действий. Еврейский идиоматический оборот сопоставляет полноту содеянного с сообщённым воплем; это следует выразить более ясно, не устраняя трудность текста.
