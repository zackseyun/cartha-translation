base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: ru
  text: Сойду теперь и посмотрю, совершили ли они всё то, о чём свидетельствует дошедший до Меня вопль о ней[a]; а если нет — узнаю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «действительно ли они поступили во всём так, как свидетельствует дошедший до Меня вопль о ней». Еврейский оборот с буквальным значением полноты указывает на то, полностью ли совершённое соответствует этому воплю.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст кратко сохраняет условие открытым: «и если нет — узнаю»; не уточняется, что именно последует, если содеянное не соответствует воплю.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: Сойду же
  rationale: Когортатив выражает намерение и решимость говорящего; частица נָא здесь не является просьбой, а оттеняет непосредственность намерения. «Сойду же» естественно передаёт оба элемента без лишнего усиления.
- source_word: וְאֶרְאֶה
  choice: и посмотрю
  rationale: Глагол ראה в контексте означает увидеть посредством проверки, удостовериться. «Посмотрю» сохраняет образное повествовательное выражение и не заменяет его толкованием «расследую».
- source_word: הַכְּצַעֲקָתָהּ
  choice: в соответствии с воплем о ней
  rationale: צְעָקָה — вопль, вызванный тяжёлым злом или несправедливостью. Суффикс женского рода связывает вопль с упомянутым городом или местностью; русский оборот «вопль о ней» передаёт эту связь, не представляя город источником вопля.
- source_word: הַבָּאָה אֵלַי
  choice: дошедшим до Меня
  rationale: Причастный оборот относится к «воплю». «Дошедшим до Меня» естественно передаёт движение, выраженное глаголом בוא.
- source_word: עָשׂוּ כָּלָה
  choice: всё ли они сделали
  rationale: Трудный оборот с עשׂה и כָּלָה выражает полноту соответствия между совершённым и дошедшим воплем. Формулировка сохраняет неопределённое множественное «они» и идею полноты, оставаясь понятной по-русски.
- source_word: וְאִם לֹא
  choice: а если нет
  rationale: Противительно-условный переход естественно передаётся русским «а если нет».
- source_word: אֵדָעָה
  choice: узнаю
  rationale: Когортатив ידע означает достижение достоверного знания. «Узнаю» в русском контексте проверки естественнее, чем статичное «буду знать», и не добавляет способа получения знания.
theological_decisions:
- issue: Антропоморфное описание Божьего исследования
  choice: Сохранить слова Бога «сойду» и «посмотрю», не заменяя их отвлечённым описанием всеведения или суда.
  alternative: Передать смысл как «исследую» или «произведу суд», чтобы ослабить антропоморфизм.
  rationale: Еврейский текст намеренно изображает Бога в доступных человеку повествовательных категориях. Перевод должен сохранять эту богословскую напряжённость, а не разрешать её посредством поясняющего пересказа.
- issue: Фраза «а если нет — узнаю»
  choice: Сохранить открытое условие и последующее «узнаю».
  alternative: Уточнить как «если же это не так, Я всё равно узнаю истину» или истолковать как судебный приговор.
  rationale: Исходный текст лаконичен и не уточняет здесь отношение этого высказывания к Божьему всеведению. Добавление доктринального объяснения сняло бы присущую повествованию напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан понятным для обычного читателя, но антропоморфная образность, условность высказывания и трудный оттенок полноты в עָשׂוּ כָּלָה не устранены.
