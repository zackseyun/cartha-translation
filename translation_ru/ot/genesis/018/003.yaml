    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol; сохраняет связность еврейского рассказа, не уточняя последовательность сильнее, чем это делает исходный текст.
- source_word: אֲדֹנָי
  choice: Господин мой
  rationale: Уважительное обращение к одному адресату согласуется с последующими формами второго лица единственного числа. Строчная буква сохраняет непосредственный смысл обращения, а возможное понимание как обращения к Богу отмечено в сноске.
- source_word: אִם נָא
  choice: если
  rationale: Условная конструкция входит в формулу вежливой просьбы; оттенок почтительности частицы נָא естественно выражен словом «прошу» далее в предложении без тяжеловесного повтора.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: я обрёл благоволение в твоих глазах
  rationale: Сохраняет образность устойчивого еврейского выражения и остаётся понятным в современном литературном русском; «благодать» внесла бы не обязательные здесь богословские ассоциации.
- source_word: אַל נָא
  choice: прошу, не
  rationale: Естественно передаёт сочетание запрета с частицей настойчивой, почтительной просьбы.
- source_word: תַעֲבֹר מֵעַל
  choice: проходи мимо
  rationale: Передаёт движение дальше, минуя говорящего, кратким и естественным русским выражением.
- source_word: עַבְדֶּךָ
  choice: раба твоего
  rationale: В почтительном самоназвании перед превосходящим или почётным гостем традиционное «раб твой» точнее сохраняет степень самоуничижения, чем более нейтральное «слуга»; контекст не требует понимать это как указание на юридическое рабство.
theological_decisions:
- issue: Следует ли понимать אֲדֹנָי как божественный титул «Господь» или как почтительное обращение «господин мой»
  choice: господин мой
  alternative: Господь
  rationale: Хотя в Бытии 18 явившийся Аврааму назван Яхве и масоретская огласовка допускает традиционное понимание как обращения к Богу, непосредственная речь обращена к одному из посетителей и использует формы второго лица единственного числа. Основной текст не устраняет эту смысловую напряжённость, а альтернативное понимание сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «Господин мой» и выражение «раб твой» сохраняют почтительность исходной речи, не делая синтаксис архаичным.
