  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: ru
  text: 'Тогда он сказал: «Прошу, пусть господин мой[a] не гневается, и я скажу лишь ещё раз: может быть, там найдутся десять». Он ответил: «Не уничтожу его[b] ради этих десяти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское обращение אֲדֹנָי можно понять как почтительное «господин мой»; с учётом контекста возможно также «Господь».
    reason: Сохранение неоднозначности обращения и его божественного референта.
  - marker: b
    text: 'Буквально: «Не уничтожу ради этих десяти»; объект глагола в еврейском подразумевается из контекста.'
    reason: Пояснение добавленного в русском местоимения.
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: Прошу, пусть мой господин не гневается
  rationale: נָא передаёт вежливую настойчивую просьбу, а идиома חרה выражает разгорающийся гнев. Русская формулировка естественна, сохраняет смиренный тон Авраама и не устраняет неоднозначность обращения אֲדֹנָי.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: и я скажу лишь ещё раз
  rationale: Когортатив передаёт намерение или просьбу продолжить речь, а אַךְ הַפַּעַם ограничивает её последним обращением в этой последовательности.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: может быть, там найдутся десять
  rationale: אוּלַי выражает возможность, а нифаль יִמָּצְאוּן имеет значение «будут найдены / найдутся». Возвратная русская конструкция передаёт пассивный смысл естественно.
- source_word: לֹא אַשְׁחִית
  choice: Не уничтожу его
  rationale: Глагол שׁחת в породе hифиль означает «уничтожить». Прямое дополнение в еврейском не выражено и в русском восстановлено из контекста как место, которому угрожает уничтожение.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: ради этих десяти
  rationale: בַּעֲבוּר обозначает основание, ради которого действие отменяется. Указательное «этих» естественно передаёт определённость уже названных десяти.
theological_decisions:
- issue: Референт и оформление אֲדֹנָי в обращении Авраама
  choice: мой господин
  alternative: Господь / мой Владыка
  rationale: Контекст указывает на божественного собеседника, однако само обращение допускает восприятие как почтительного титула. Строчная буква и сноска сохраняют эту смысловую напряжённость и не подменяют אֲדֹנָי именем יהוה.
- issue: Неуказанный объект глагола «уничтожить»
  choice: его
  alternative: 'оставить объект невыраженным: «не уничтожу»'
  rationale: Местоимение необходимо для естественного русского синтаксиса и относится к обсуждаемому месту или городу; сноска отмечает, что в еврейском объект только подразумевается.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Частица «прошу» передаёт вежливость נָא без архаического оборота; «лишь ещё раз» подчёркивает заключительный характер просьбы. Местоименные референты не конкретизированы именами, поскольку еврейский текст использует формы «он сказал».
