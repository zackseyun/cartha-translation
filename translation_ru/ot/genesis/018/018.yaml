  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: ru
  text: Авраам непременно станет великим и могучим народом, и в нём получат благословение все народы земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все народы земли будут благословлять себя им». Еврейскую форму можно понять возвратно; основной текст передаёт её как пассивную по смыслу: народы получат благословение в связи с Авраамом.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: непременно станет
  rationale: Сочетание абсолютного инфинитива с имперфектом усиливает утверждение. «Непременно станет» естественно передаёт и будущее время, и emphатическую уверенность, а глагол «стать» соответствует конструкции с לְגוֹי.
- source_word: לְגוֹי
  choice: народом
  rationale: גוי обозначает народ или нацию как общность. В русском библейском повествовании «народ» звучит естественнее, чем современное политическое «нация», и сохраняет связь с последующим упоминанием всех народов.
- source_word: גָּדוֹל
  choice: великим
  rationale: «Великий» сохраняет как количественный, так и качественный оттенок слова и соответствует возвышенному языку обетования.
- source_word: וְעָצוּם
  choice: и могучим
  rationale: עצום может указывать на силу, мощь или многочисленность. «Могучим» сохраняет образ силы и естественно сочетается с «великим», не сводя значение только к численности.
- source_word: וְנִבְרְכוּ
  choice: получат благословение
  rationale: 'Нифаль глагола ברך передан в основном тексте как пассивный по смыслу: народы становятся получателями благословения. Такая формулировка ясна в современном русском и не создаёт неестественной двусмысленности возвратной формы «благословятся».'
- source_word: בוֹ
  choice: в нём
  rationale: 'Предлог ב с местоименным суффиксом выражает связь или сферу: благословение обретается в связи с Авраамом. «Через него» возможно по смыслу, но добавляет более явное представление о посредничестве, чем требует сама форма.'
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: все народы земли
  rationale: Это универсальная формула книги Бытия. «Народы» обеспечивает лексическую связь с גוי в первой части стиха, а «земли» передаёт всеобщий, а не местный охват.
theological_decisions:
- issue: Толкование формулы благословения, связанной с Авраамом
  choice: 'Все народы изображены получателями благословения в связи с Авраамом: «в нём получат благословение».'
  alternative: Все народы будут благословлять себя им, то есть употреблять его как образец или формулу благословения.
  rationale: Нифаль глагола ברך в патриархальных обетованиях допускает обсуждаемое возвратное понимание, однако пассивное прочтение хорошо соответствует широкому контексту обетования. Лексически возможная альтернатива сохранена в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для повествования об обетовании. Синтаксис ясен для широкого читателя; усиление передано словом «непременно», а богословски значимая неоднозначность вынесена в сноску.
