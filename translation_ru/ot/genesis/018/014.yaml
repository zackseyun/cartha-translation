  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: ru
  text: Разве есть что-нибудь слишком трудное для Яхве?[a] В назначенное время Я вернусь к тебе, примерно в это же время в следующем году, и у Сарры будет сын.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве есть что-нибудь слишком дивное для Яхве?» Еврейский глагол может обозначать нечто необычайное или превосходящее человеческие силы.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение буквально связано со «временем жизни»; это трудная идиома, которую здесь обычно понимают как указание на соответствующее время следующего года.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: есть что-нибудь слишком трудное
  rationale: Нифаль глагола פלא может обозначать нечто необычайное, дивное или превосходящее чьи-либо силы. В риторическом вопросе выражение «слишком трудное» естественно передаёт мысль о том, что ничто не выходит за пределы силы Яхве, не усиливая смысл до абстрактного «невозможно».
- source_word: מֵיְהוָה
  choice: для Яхве
  rationale: 'Предлог מן при פלא выражает предел способности: нечто слишком трудное для кого-либо. Имя יהוה передано как «Яхве», то есть как личное имя, стоящее в еврейском тексте.'
- source_word: דָּבָר
  choice: что-нибудь
  rationale: Хотя דבר буквально может означать «слово», «дело» или «вещь», в русском риторическом вопросе неопределённое «что-нибудь» естественно сохраняет широкий смысл.
- source_word: לַמּוֹעֵד
  choice: В назначенное время
  rationale: מוֹעֵד обозначает установленный, назначенный срок; такой перевод точен и естественен в современном русском языке.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: Я вернусь к тебе
  rationale: שוב здесь означает возвращение, а местоимение второго лица мужского рода единственного числа обращено к Аврааму; уточнять его имя в тексте стиха не требуется.
- source_word: כָּעֵת חַיָּה
  choice: примерно в это же время через год
  rationale: Трудная еврейская идиома буквально связана со «временем жизни». По контексту она указывает на соответствующее время следующего года; ясный смысл вынесен в основной текст, а буквальная особенность отмечена в сноске.
- source_word: וּלְשָׂרָה בֵן
  choice: и у Сарры будет сын
  rationale: В еврейском это безглагольная конструкция «и Сарре — сын». Будущее значение определяется обещанием и контекстом; русская конструкция естественно передаёт обладание и обещанный результат.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом, не вводя конфессионально обусловленную замену.
- issue: Смысл риторического вопроса
  choice: Разве есть что-нибудь слишком трудное для Яхве?
  alternative: Разве есть что-нибудь слишком дивное для Яхве?; Разве есть что-нибудь невозможное для Яхве?
  rationale: Формулировка подчёркивает способность Яхве исполнить обещание, сохраняя диапазон значения פלא. «Невозможное» было бы сильнее исходного выражения, а «слишком дивное» в современном русском может быть понято неясно.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Риторическое «разве» естественно передаёт ожидаемый отрицательный ответ. Тире выделяют временное уточнение, не изменяя синтаксической связи обещания.
