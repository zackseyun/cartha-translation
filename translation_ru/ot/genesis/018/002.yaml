base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: ru
  text: 'Он поднял глаза и увидел: вот, три мужчины стоят возле него[a]. Увидев их, он побежал им навстречу от входа в шатёр и поклонился до земли[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стоят рядом с ним»; еврейский предлог может указывать на близость к нему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пал ниц». Еврейский глагол описывает глубокий почтительный поклон, но сам по себе не обязательно означает поклонение Богу.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: Он поднял глаза и увидел
  rationale: Сохраняется образная еврейская идиома «поднял глаза», при этом сочетание естественно звучит на современном русском языке.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица вводит увиденное как живую, внезапно предстающую перед героем картину; русское «вот» передаёт эту повествовательную функцию.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: три человека
  rationale: Слово אֲנָשִׁים обозначает мужчин или людей мужского пола; в русском сочетание «три человека» естественно и не устраняет мужскую форму числительного.
- source_word: נִצָּבִים עָלָיו
  choice: стоят возле него
  rationale: Предлог עַל здесь допускает указание на непосредственную близость или положение относительно Авраама. «Возле него» естественно передаёт близость, не создавая ненужного образа людей, нависших над ним.
- source_word: וַיַּרְא
  choice: Увидев их
  rationale: Деепричастная конструкция естественно связывает повторное восприятие гостей с немедленной реакцией Авраама, не устраняя последовательности действий.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: он побежал им навстречу
  rationale: Глагол прямо обозначает бег и подчёркивает поспешность и готовность Авраама принять гостей.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: от входа в шатёр
  rationale: Так естественно передаётся исходная точка движения; «шатёр» соответствует кочевому контексту точнее, чем более общее «палатка».
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: поклонился до земли
  rationale: Выражение передаёт глубокий телесный поклон и не навязывает религиозное значение «поклонился как Богу», которого сам глагол в данном контексте не требует.
theological_decisions:
- issue: Следует ли понимать жест Авраама как богопоклонение
  choice: поклонился до земли
  alternative: пал ниц в поклонении
  rationale: Еврейский глагол может обозначать глубокий почтительный поклон как перед человеком, так и перед Богом. Поскольку в этом стихе пришедшие представлены как «три человека», перевод не должен преждевременно разрешать вопрос об их природе и адресате возможного поклонения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены образная формула «поднял глаза» и вводное «вот», но синтаксис сделан естественным для обычного современного читателя. Маркеры сносок поставлены непосредственно после выражений, к которым относятся.
