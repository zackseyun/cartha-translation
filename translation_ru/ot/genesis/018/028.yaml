base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: ru
  text: 'Допустим, до пятидесяти праведников не хватит пятерых — неужели Ты погубишь весь город из-за пяти? Он сказал: «Не погублю, если найду там сорок пять».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: Допустим
  rationale: Вводит предположение в ходе заступнической просьбы Авраама; передаёт условно-гипотетический смысл естественным современным русским языком.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: до пятидесяти праведников не хватит пятерых
  rationale: 'Сохраняет смысл численного недостачного количества: до требуемых пятидесяти недостаёт пяти человек, не создавая впечатления, будто отсутствуют пять заранее определённых лиц.'
- source_word: הַצַּדִּיקִם
  choice: праведников
  rationale: Традиционное и понятное соответствие, сохраняющее нравственный и судебный смысл еврейского слова.
- source_word: הֲתַשְׁחִית
  choice: неужели Ты погубишь
  rationale: Hiphil глагола שׁחת означает уничтожить или погубить; «неужели» естественно передаёт риторический вопрос, а «погубишь» позволяет повторить тот же корень в Божьем ответе.
- source_word: בַּחֲמִשָּׁה
  choice: из-за этих пятерых
  rationale: Предлог выражает основание или причину; указательное слово поясняет, что речь идёт о недостающих пяти, а не о пяти праведниках как причине гибели.
- source_word: אֶת כָּל הָעִיר
  choice: весь город
  rationale: Передаёт полноту, выраженную сочетанием כָּל הָעִיר, естественной русской конструкцией.
- source_word: לֹא אַשְׁחִית
  choice: Не погублю
  rationale: Сохраняет лексический повтор с вопросом Авраама; подразумеваемый объект — город — ясен из контекста.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: если найду там сорок пять
  rationale: Прямо сохраняет условие, местное наречие и число, с естественным для русского порядком слов.
theological_decisions:
- issue: Передача צַדִּיקִים
  choice: праведников
  alternative: справедливых
  rationale: «Праведники» сохраняет широкий нравственный и судебный вес термина и не сужает его до одного качества справедливости.
- issue: Объект Божьего решения не уничтожать
  choice: Не погублю
  alternative: Не погублю его
  rationale: Еврейский текст не выражает объект местоимением; русский допускает его опущение, поскольку город ясно назван непосредственно перед этим. Так сохраняется лаконизм оригинала без смысловой потери.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Обращение к Богу оформлено с прописной буквы по устойчивой русской издательской практике. Формулировка избегает двусмысленного впечатления, будто из определённой группы пятидесяти отсутствуют пять конкретных праведников.
