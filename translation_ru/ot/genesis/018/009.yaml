  source_fidelity: 'Основной смысл передан верно: собеседники спрашивают Авраама о местонахождении Сарры, и он сообщает, что она в шатре. Однако הִנֵּה — указательная частица («вот», «там»), и её значение не следует полностью устранять посредством одного лишь подразумеваемого/выраженного подлежащего «она».'
