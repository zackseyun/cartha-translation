  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: ru
  text: 'И они сказали ему: «Где Сарра, твоя жена?» Он ответил: «Вот она, в шатре».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И они сказали
  rationale: Последовательная форма глагола אמר продолжает повествование; союз «и» естественно передаёт связь с предыдущим событием без добавления отсутствующего в тексте временного оттенка.
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог אֶל с суффиксом 3-го лица мужского рода единственного числа указывает на Авраама как адресата речи.
- source_word: אַיֵּה
  choice: Где
  rationale: Вопросительное наречие обозначает вопрос о местонахождении; в русском именная конструкция не требует выраженной связки в настоящем времени.
- source_word: שָׂרָה
  choice: Сарра
  rationale: Передача имени соответствует устойчивой русской библейской форме.
- source_word: אִשְׁתֶּךָ
  choice: жена твоя
  rationale: Существительное в сопряжённой форме с суффиксом 2-го лица мужского рода единственного числа означает «твоя жена». Постпозиция местоимения сохраняет достоинство речи и лёгкий библейский колорит, оставаясь понятной современному читателю.
- source_word: וַיֹּאמֶר
  choice: Он ответил
  rationale: Буквально «и он сказал»; поскольку реплика непосредственно отвечает на вопрос, «ответил» естественно выражает функцию высказывания, не меняя его содержания.
- source_word: הִנֵּה
  choice: Она
  rationale: Частица הִנֵּה указывает на предъявляемое местонахождение («вот/там»). В кратком ответе по-русски естественно восстановить подразумеваемое подлежащее «она»; отдельное «вот» или «там» здесь звучало бы менее естественно и могло бы ошибочно подразумевать видимый жест.
- source_word: בָאֹהֶל
  choice: в шатре
  rationale: Предлог ב с определённым существительным אֹהֶל обозначает нахождение внутри известного из контекста шатра. «Шатёр» точно и естественно передаёт жилище кочевого контекста.
