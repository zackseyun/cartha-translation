  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: ru
  text: 'И сказал он: «Прошу, пусть мой Господь[a] не гневается, и я скажу: может быть, там найдутся тридцать». Он ответил: «Не сделаю этого, если найду там тридцать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой господин». Еврейский титул допускает понимание как почтительного обращения; здесь написание с прописной буквы отражает контекст, в котором адресатом является Господь.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: Пусть не гневается
  rationale: Отрицание אַל с частицей вежливой просьбы נָא и глаголом חרה передано как почтительная просьба; русская конструкция естественна и сохраняет сдержанный тон Авраама.
- source_word: לַאדֹנָי
  choice: мой Господь
  rationale: Форма содержит обращение «к моему господину/Господу». В контексте адресат понимается как Господь; прописная буква указывает на это, не подменяя титул личным именем.
- source_word: וַאֲדַבֵּרָה
  choice: и я скажу
  rationale: Когортатив выражает почтительное намерение или просьбу продолжить речь. «И я скажу» сохраняет направленность действия и звучит естественно по-русски.
- source_word: אוּלַי
  choice: может быть
  rationale: Передаёт предположительный и осторожный характер ходатайства.
- source_word: יִמָּצְאוּן
  choice: найдутся
  rationale: Нифаль от מצא здесь имеет пассивное значение; русское «найдутся» кратко и естественно передаёт его.
- source_word: שָׁם
  choice: там
  rationale: Прямой естественный эквивалент наречия места.
- source_word: שְׁלֹשִׁים
  choice: тридцать
  rationale: Прямое соответствие количественному числительному; подразумеваются праведники из предыдущего контекста, но это не добавляется в текст.
- source_word: לֹא אֶעֱשֶׂה
  choice: Не сделаю этого
  rationale: Объект в еврейском тексте не выражен и восстанавливается из контекста как предполагаемое уничтожение; местоимение «этого» делает русскую фразу естественной без чрезмерного уточнения.
- source_word: אִם אֶמְצָא
  choice: если найду
  rationale: Прямая и ясная передача обычной условной конструкции.
theological_decisions:
- issue: Передача אֲדֹנָי в обращении Авраама
  choice: мой Господь
  alternative: мой господин
  rationale: В данном теофаническом контексте Авраам обращается к божественному собеседнику, поэтому прописная буква уместно обозначает референта. При этом сохраняется титул, а не вводится отсутствующее здесь личное имя Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством и лёгкой торжественностью. Синтаксический параллелизм еврейского повествования в основном сохранён, но ответ оформлен естественным русским глаголом речи. Неявное обозначение праведников после «тридцать» не восполняется, чтобы сохранить лаконичность оригинала.
