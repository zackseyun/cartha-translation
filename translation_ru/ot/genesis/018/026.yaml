base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: ru
  text: 'И сказал Яхве: «Если Я найду в Содоме, в самом городе, пятьдесят праведников, то ради них пощажу всё это место».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прощу всё это место ради них». Древнееврейский глагол может означать прощение или удержание наказания; по контексту в основном тексте употреблено «пощажу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Естественно передаёт последовательность древнееврейского повествования.
- source_word: אִם אֶמְצָא
  choice: Если Я найду
  rationale: Прямо и естественно передаёт условную конструкцию.
- source_word: בִסְדֹם
  choice: в Содоме
  rationale: Сохраняет простое указание места без добавления отсутствующего в этой фразе слова «город».
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: пятьдесят праведников
  rationale: Русское существительное во множественном числе обозначает праведных людей без излишнего уточнения пола.
- source_word: בְּתוֹךְ הָעִיר
  choice: среди жителей города
  rationale: В контексте поиска людей выражение означает их присутствие внутри городской общины; формулировка устраняет неестественное русское «внутри города», сохраняя смысл.
- source_word: וְנָשָׂאתִי
  choice: пощажу
  rationale: В данном контексте глагол נָשָׂא означает удержать суд или простить место ради праведников; «пощажу» ясно передаёт результат.
- source_word: לְכָל הַמָּקוֹם
  choice: всё это место
  rationale: Передаёт полный охват местности, которой угрожает суд.
- source_word: בַּעֲבוּרָם
  choice: ради них
  rationale: Естественно выражает основание, по которому будет пощажено всё место.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл וְנָשָׂאתִי применительно ко всему месту
  choice: пощажу
  alternative: прощу
  rationale: Контекст говорит об удержании грядущего суда над местом. Вместе с тем значение прощения возможно и отмечено в сноске, чтобы не устранять смысловую широту глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; заглавная буква в местоимении «Я» отражает прямую речь Бога в принятой русской религиозной письменной традиции.
