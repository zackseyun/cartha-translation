  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: ru
  text: 'Сарра рассмеялась про себя, говоря: «После того как я увяла, будет ли у меня наслаждение, а господин мой стар?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: рассмеялась
  rationale: Глагол צחק в породе qal обычно означает «смеяться». Форма передаёт внутреннюю реакцию Сарры на обещание.
- source_word: בְּקִרְבָּהּ
  choice: про себя
  rationale: Буквально «внутри неё»; современное русское «про себя» естественно передаёт невысказанную внутреннюю реакцию.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив вводит прямую речь; внутренний характер речи уже выражен словами «про себя».
- source_word: אַחֲרֵי בְלֹתִי
  choice: теперь, когда я износилась
  rationale: בלה обозначает обветшание, изношенность. «Износилась» сохраняет телесную выразительность оригинала и не сводит её лишь к возрасту.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: мне будет наслаждение
  rationale: Редкое существительное עֶדְנָה указывает на удовольствие или отраду, вероятно с телесно-супружеским оттенком, но не определяет его однозначно.
- source_word: וַאדֹנִי
  choice: господин мой
  rationale: Так Сарра почтительно называет Авраама; строчная буква исключает смешение с божественным титулом.
- source_word: זָקֵן
  choice: стар
  rationale: Прямое и естественное соответствие предикативному прилагательному זָקֵן.
theological_decisions:
- issue: Смысл слова עֶדְנָה
  choice: наслаждение
  alternative: удовольствие; супружеское наслаждение; возвращение телесной свежести
  rationale: Основной текст сохраняет широкий смысл редкого слова и его вероятные телесные и супружеские оттенки, не сводя его исключительно к половому удовольствию или способности к деторождению.
- issue: Связь וַאדֹנִי זָקֵן с предыдущей частью вопроса
  choice: хотя и господин мой стар
  alternative: и господин мой стар
  rationale: Союз ו формально может быть простым соединительным, однако в контексте он выражает дополнительное препятствие. «Хотя и» естественно передаёт этот оттенок, не устраняя исходной связи.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «господин мой» сохраняет почтительность речи Сарры, а «износилась» — яркий телесный образ еврейского текста.
