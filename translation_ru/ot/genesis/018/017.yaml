  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: ru
  text: 'И сказал Яхве: «Неужели Я скрою от Авраама то, что делаю?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Разве Я скрываю от Авраама то, что делаю?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽיהֹוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, посредством принятой русской транслитерации.
- source_word: אָמָר
  choice: сказал
  rationale: Форма wayyiqtol продолжает повествование; простое прошедшее время естественно по-русски.
- source_word: הַֽמְכַסֶּה אֲנִי
  choice: Неужели Я скрою
  rationale: Вопросительная конструкция с причастием выражает внутреннее обсуждение и риторический вопрос; «неужели» естественно передаёт ожидаемый отрицательный ответ, а будущее время соответствует предстоящему действию сокрытия.
- source_word: מֵֽאַבְרָהָם
  choice: от Авраама
  rationale: После глагола «скрыть» предлог מִן естественно передаётся русским «от».
- source_word: אֲשֶׁר
  choice: то, что
  rationale: Естественное русское соответствие относительной конструкции без излишней буквальности.
- source_word: אֲנִי עֹשֶׂה
  choice: Я делаю
  rationale: Прямо отражает еврейское причастие и сохраняет его аспектуальную неоднозначность, не добавляя явно значения близкого будущего.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет личное имя יהוה; транслитерация сохраняет различие между именем Бога и титулом «Господь».
- issue: Временная отнесённость אֲנִי עֹשֶׂה
  choice: то, что делаю
  alternative: то, что собираюсь сделать
  rationale: Настоящее время ближе к форме исходного текста и сохраняет возможность понимать действие как уже осуществляемое либо предстоящее, тогда как «собираюсь сделать» явно уточняет ближайшее будущее.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавное «Я» употреблено как традиционное типографическое обозначение речи Бога, не меняющее смысла исходного текста.
