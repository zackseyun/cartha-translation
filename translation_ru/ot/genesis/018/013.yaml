  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: ru
  text: 'И сказал ГОСПОДЬ Аврааму: «Почему Сарра засмеялась, сказав: „Неужели я и вправду рожу, ведь я уже состарилась?“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона; прописные буквы отличают личное имя Бога от обычного титула.
- source_word: הַאַף אֻמְנָם
  choice: неужели… и вправду
  rationale: Сочетание вопросительной частицы с усилительными אַף и אֻמְנָם выражает недоверчивое удивление и подчёркивает реальность предполагаемого рождения.
- source_word: אֵלֵד
  choice: я… рожу
  rationale: Форма первого лица глагола ילד непосредственно означает «я рожу»; слово «ребёнка» в еврейском тексте не выражено.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: когда я состарилась
  rationale: В данном вопросе союз וַ вводит обстоятельство, препятствующее ожидаемому событию; «состарилась» сохраняет глагольный характер и перфект исходного выражения.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Выбрана укоренённая в русской библейской традиции передача, не меняющая референта и не вносящая конфессионального толкования.
- issue: Предмет обещанного рождения
  choice: не добавлять «ребёнка»
  alternative: «рожу ребёнка»
  rationale: Еврейский текст употребляет глагол «рожу» без прямого дополнения; русская фраза остаётся естественной и ближе к форме источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой речи сохранён; вопрос передаёт недоверчивое удивление Сарры, не устраняя его напряжения.
