base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: ru
  text: Затем те люди встали и оттуда посмотрели вниз, в сторону Содома[a], а Авраам шёл с ними, чтобы проводить их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посмотрели в сторону Содома». Еврейский глагол обычно подразумевает взгляд с возвышенного места.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы отправить их в путь». Еврейское выражение может означать сопровождение уходящих гостей и прощание с ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: поднялись
  rationale: Форма глагола קום обозначает, что люди встали; «поднялись» естественно передаёт переход от предшествующей сцены к дальнейшему движению, не сводя значение лишь к отправлению в путь.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Прямое и естественное соответствие пространственному наречию.
- source_word: הָאֲנָשִׁים
  choice: те люди
  rationale: В еврейском тексте употреблено обычное слово «люди»; указательное «те» помогает естественно отослать к уже названным участникам, не определяя их преждевременно как ангелов.
- source_word: וַיַּשְׁקִפוּ
  choice: посмотрели вниз
  rationale: Глагол שׁקף часто описывает взгляд с возвышенного места; перевод сохраняет вероятный топографический оттенок.
- source_word: עַל־פְּנֵי סְדֹם
  choice: в сторону Содома
  rationale: Оборот указывает на направление взгляда; буквальное воспроизведение «на лицо Содома» по-русски было бы неясным.
- source_word: הֹלֵךְ עִמָּם
  choice: шёл с ними
  rationale: Причастие הֹלֵךְ передаёт продолжающееся сопутствующее действие; несовершенный вид «шёл» естественно сохраняет эту длительность.
- source_word: לְשַׁלְּחָם
  choice: чтобы проводить их
  rationale: В контексте гостеприимства глагол означает сопровождение уходящих гостей при прощании и отправление их дальше; «проводить» кратко и естественно выражает этот смысл по-русски.
theological_decisions:
- issue: Кем являются הָאֲנָשִׁים в данном месте
  choice: В основном тексте перевести как «те люди»
  alternative: «гости» или «ангелы»
  rationale: Сам стих называет их обычным словом «люди». Такой перевод сохраняет повествовательную неоднозначность и не вносит в этот стих идентификацию, раскрываемую контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным и повествовательным; богословски значимая неопределённость обозначения «люди» сохранена.
