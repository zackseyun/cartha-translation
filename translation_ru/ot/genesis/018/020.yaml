  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: ru
  text: 'И сказал Яхве: «Вопль Содома и Гоморры велик, и их грех крайне тяжек[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их грех чрезвычайно тяжёл». Еврейское слово буквально означает «тяжёлый» и здесь выражает крайнюю серьёзность. Выражение «вопль Содома и Гоморры» может также пониматься как вопль, поднявшийся против этих городов из-за творящегося в них зла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с последовательным וַ־ продолжает повествование; обычное русское «И сказал» естественно передаёт переход к следующему действию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: вопль против Содома и Гоморры
  rationale: זַעֲקָה обозначает громкий вопль, вызванный тяжким злом или притеснением. Предлог «против» естественно выражает подразумеваемую направленность жалобы, при этом буквальная конструкция отмечена в сноске.
- source_word: כִּי רָבָּה
  choice: велик
  rationale: Прилагательное согласуется с «воплем» и указывает на его огромную силу или масштаб.
- source_word: וְחַטָּאתָם
  choice: и грех их
  rationale: Единственное число с местоименным суффиксом представляет совокупную греховность жителей; порядок слов сохраняет возвышенный, но понятный русский строй.
- source_word: כִּי כָבְדָה מְאֹד
  choice: чрезвычайно тяжёл
  rationale: Сохранён образ тяжести, которым древнееврейский текст выражает крайнюю серьёзность греха; «чрезвычайно» передаёт усилительное מְאֹד.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Направленность вопля
  choice: вопль против Содома и Гоморры
  alternative: вопль Содома и Гоморры
  rationale: Контекст допускает понимание вопля как жалобы на зло этих городов, однако еврейская сопряжённая конструкция сама по себе не содержит предлога «против»; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным строем. Образ «тяжёлого» греха сохранён как понятная русская метафора; подлинная неоднозначность выражения о вопле отмечена в сноске.
