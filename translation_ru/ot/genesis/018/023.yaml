base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: ru
  text: 'Тогда Авраам приблизился и сказал: «Неужели ты сметёшь[a] праведного вместе с нечестивым?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погубишь», «истребишь»; еврейский глагол обозначает уничтожение в суде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: приблизился
  rationale: Глагол נגשׁ обозначает приближение. «Приблизился» естественно передаёт и физическое движение Авраама, и его вступление в ходатайственную речь.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: וַיֹּאמַר
  choice: сказал
  rationale: Обычная передача повествовательной формы глагола אמר в современном русском языке.
- source_word: הַאַף
  choice: неужели
  rationale: Сочетание вопросительной частицы с אַף усиливает вопрос. «Неужели» естественно выражает изумление и настойчивость обращения, не превращая вопрос в утверждение.
- source_word: תִּסְפֶּה
  choice: сметёшь
  rationale: Глагол ספה здесь передаёт устранение или гибель под судом. «Сметёшь» сохраняет яркий образ еврейского текста; более общие варианты указаны в сноске.
- source_word: צַדִּיק
  choice: праведного
  rationale: Форма единственного числа употреблена как обобщённое обозначение человека, живущего праведно. Русское единственное число сохраняет грамматику и принципиальный характер вопроса.
- source_word: עִם
  choice: вместе с
  rationale: Передаёт совместную участь, о которой спрашивает Авраам, и немного яснее простого «с» в данном противопоставлении.
- source_word: רָשָׁע
  choice: нечестивым
  rationale: Форма единственного числа употреблена обобщённо и прямо противопоставлена «праведному». «Нечестивый» сохраняет нравственную, а не только юридическую категорию.
theological_decisions:
- issue: Обобщённые нравственные категории в единственном числе
  choice: 'Сохранить единственное число: «праведного» и «нечестивым».'
  alternative: 'Передать множественным числом: «праведных вместе с нечестивыми».'
  rationale: В еврейском тексте обе формы стоят в единственном числе и могут обозначать представителей нравственных категорий вообще. Русское единственное число звучит естественно и сохраняет как формальную особенность, так и принципиальный вопрос о Божьем суде.
- issue: Сила вопроса Авраама
  choice: Передать הַאַף словом «неужели», сохранив вопрос как смелое ходатайственное обращение.
  alternative: «Разве ты действительно…» или нейтральное «погубишь ли ты…».
  rationale: «Неужели» удерживает усиленную вопросительную интонацию оригинала, не утверждая заранее ответа и не ослабляя напряжение между грядущим судом и участью праведного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Обращение «ты» дано со строчной буквы как нейтральная современная орфографическая норма. Образное «сметёшь» сохраняет выразительность оригинала, а сноска предлагает более общие смысловые соответствия.
