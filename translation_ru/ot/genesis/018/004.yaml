    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Прошу, пусть принесут
  rationale: Страдательная форма в сочетании с частицей вежливой просьбы передана естественной русской конструкцией, сохраняющей неопределённость исполнителя.
- source_word: מְעַט מַיִם
  choice: немного воды
  rationale: Передаёт небольшое количество воды и скромный характер предложения Авраама.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: Омойте ноги
  rationale: Повелительная форма во множественном числе передана прямо; «омыть ноги» естественно для контекста древнего гостеприимства и выдержано в литературном регистре.
- source_word: וְהִשָּׁעֲנוּ
  choice: и отдохните
  rationale: Буквальное значение связано с тем, чтобы прислониться или расположиться; в данном контексте речь идёт об отдыхе гостей в тени. Более буквальный оттенок сохранён в сноске.
- source_word: תַּחַת הָעֵץ
  choice: под деревом
  rationale: Определённый артикль указывает на конкретное дерево; русская форма естественно сохраняет эту определённость контекстуально.
