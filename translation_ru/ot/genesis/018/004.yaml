  source_fidelity: «Прошу, пусть принесут немного воды» естественно передаёт вежливую просьбу с пассивным йуссивом יֻקַּח и сохраняет неопределённость того, кто принесёт воду. «Омойте ноги» точно передаёт императив «вымойте ваши ноги». «Отдохните под деревом» верно выражает контекстуальный смысл וְהִשָּׁעֲנוּ תַּחַת הָעֵץ, не исключая буквального оттенка «опереться/расположиться».
