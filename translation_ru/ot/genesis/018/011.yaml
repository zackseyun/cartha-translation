  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: ru
  text: Авраам и Сарра были стары и достигли преклонного возраста; у Сарры уже не было того, что бывает у женщин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «путь, свойственный женщинам» — сдержанное выражение, означающее, что у Сарры прекратились менструации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: были стары
  rationale: Прилагательное обозначает преклонный возраст; простое «стары» естественно в современном русском и сохраняет повторное уточнение следующей фразы.
- source_word: בָּאִים בַּיָּמִים
  choice: в преклонных летах
  rationale: Еврейская идиома буквально связана с «вхождением в дни» и означает глубокую старость. Русское выражение передаёт смысл и сохраняет достоинство стиля.
- source_word: חָדַל לִהְיוֹת
  choice: уже прекратилось
  rationale: Глагол חָדַל означает прекращение состояния или процесса; «уже прекратилось» ясно выражает завершённость к описываемому моменту.
- source_word: אֹרַח כַּנָּשִׁים
  choice: обычное у женщин
  rationale: Это скромная идиома о менструации. Формулировка сохраняет эвфемистический характер оригинала, а сноска поясняет точный смысл.
- source_word: לְשָׂרָה
  choice: у Сарры
  rationale: Предлог обозначает отношение к Сарре; русская конструкция «у Сарры» здесь наиболее естественна.
