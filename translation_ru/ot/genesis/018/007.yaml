  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: ru
  text: Авраам побежал к стаду, взял нежного и хорошего телёнка, отдал его юноше[a], и тот поспешил приготовить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуге» или «мальчику». Еврейское слово הַנַּעַר может обозначать юношу, мальчика или слугу — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: к стаду
  rationale: Слово обозначает здесь крупный рогатый скот как совокупность животных; «к стаду» естественно передаёт сцену выбора одного животного.
- source_word: רָץ
  choice: побежал
  rationale: Глагол прямо обозначает бег и сохраняет живость рассказа и поспешность гостеприимства Авраама.
- source_word: בֶּן־בָּקָר
  choice: молодого телёнка
  rationale: Еврейское сочетание буквально указывает на молодое животное из крупного рогатого скота; в контексте приготовления пищи естественный русский эквивалент — «молодой телёнок».
- source_word: רַךְ וָטוֹב
  choice: нежного и хорошего
  rationale: «Нежного» передаёт רַךְ, а «хорошего» сохраняет широкое значение טוֹב и характеристику качества животного без излишнего уточнения.
- source_word: הַנַּעַר
  choice: юноше
  rationale: נַעַר может обозначать юношу, мальчика или слугу. «Юноше» сохраняет основной возрастной смысл и не вводит в основной текст более интерпретационное «слуге».
- source_word: וַיְמַהֵר
  choice: поспешил
  rationale: Глагол означает быстро приступить к действию; «поспешил» естественно передаёт эту динамику в русском повествовании.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: приготовить его
  rationale: Хотя עשה имеет общее значение «делать», в данном пищевом контексте речь идёт о приготовлении телёнка.
theological_decisions:
- issue: Кто является подразумеваемым подлежащим וַיְמַהֵר («поспешил»)?
  choice: «тот поспешил», то есть юноша
  alternative: «он поспешил» с возможной отсылкой к Аврааму
  rationale: Ближайший названный участник — юноша, которому Авраам передал телёнка, поэтому русский текст естественно относит действие приготовления к нему. Указательное «тот» делает синтаксическую связь ясной, не добавляя ему статуса слуги.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного, динамичного повествования. Повтор местоимения «его» допустим и отражает структуру оригинала; «тот» устраняет неясность русского подлежащего в последней части фразы.
