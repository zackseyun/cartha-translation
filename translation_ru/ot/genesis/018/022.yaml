  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: ru
  text: Тогда те люди повернули оттуда и направились в сторону Содома, а Авраам всё ещё стоял перед Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые древние рукописные свидетельства содержат чтение: «а Яхве всё ещё стоял перед Авраамом». В еврейском масоретском тексте: «а Авраам всё ещё стоял перед Яхве».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: повернули
  rationale: Глагол פנה здесь обозначает перемену направления и последующее удаление; «повернули» естественно передаёт движение повествования, не добавляя лишних подробностей.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Краткое и естественное соответствие обстоятельству места.
- source_word: הָאֲנָשִׁים
  choice: те люди
  rationale: Еврейское существительное буквально означает «люди» или «мужчины». Указательное «те» связывает их с уже упомянутыми посетителями, не вводя в текст толкование их природы.
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Обычное повествовательное значение הלך; форма «пошли» естественна по-русски и согласуется с направлением движения.
- source_word: סְדֹמָה
  choice: к Содому
  rationale: Направительный суффикс -ה указывает движение в сторону Содома. «К Содому» сохраняет этот оттенок и не обязательно утверждает, что они уже достигли города.
- source_word: עוֹדֶנּוּ
  choice: всё ещё
  rationale: Передаёт продолжение прежнего состояния Авраама с присущим форме усилением.
- source_word: עֹמֵד
  choice: стоял
  rationale: Причастие описывает продолжающееся положение; сочетание «всё ещё стоял» естественно выражает это в русском повествовании.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сохраняет как пространственное значение «перед», так и возможный смысл нахождения в присутствии другого лица.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Текст заключительной части стиха
  choice: Авраам всё ещё стоял перед Яхве
  alternative: Яхве всё ещё стоял перед Авраамом
  rationale: Основной текст следует масоретскому чтению предоставленного WLC. Иное древнее чтение существенно для истории текста и сохранено в сноске без изменения основного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным ритмом. Формулировка сохраняет буквальную образность и текстовую неоднозначность, не уточняя природу «людей» и не сглаживая вариант заключительной части стиха.
