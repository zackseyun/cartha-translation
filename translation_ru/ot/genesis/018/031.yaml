  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: ru
  text: 'Тогда он сказал: «Вот, я осмелился обратиться к моему Господу[a]. Может быть, там найдутся двадцать». Он сказал: «Не уничтожу ради двадцати».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот, я решился обратиться к моему Господу»; возможен также смысл: «я взял на себя смелость обратиться».'
    reason: Лексическое значение הוֹאַלְתִּי охватывает как решимость предпринять действие, так и смелость или дерзновение сделать это.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: Сочетание вводит почтительное привлечение внимания. Русское «вот» естественно передаёт вводную частицу, а оттенок вежливой просьбы поддерживается всем смиренным строем реплики.
- source_word: הוֹאַלְתִּי
  choice: я осмелился
  rationale: В данном контексте глагол выражает решимость взять на себя смелость обратиться к вышестоящему; «осмелился» естественно передаёт почтительность и риск, не усиливая оттенок самонадеянности.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: говорить с моим Господом
  rationale: Предлог אֶל обозначает обращение к собеседнику. «Моим Господом» сохраняет личное почтительное обращение и указывает на божественного Собеседника, не подменяя титул именем Яхве.
- source_word: אוּלַי
  choice: Может быть
  rationale: Передаёт осторожное, предположительное ходатайство Авраама естественным современным русским языком.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: там найдутся двадцать
  rationale: Возвратная форма «найдутся» естественно воспроизводит пассивный нифаль и сохраняет отсутствие названного существительного после числительного.
- source_word: לֹא אַשְׁחִית
  choice: Не уничтожу
  rationale: Русская конструкция допускает невыраженный объект, как и еврейский текст; поэтому не добавлено местоимение, которое могло бы преждевременно уточнить объект уничтожения.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: ради двадцати
  rationale: «Ради» кратко и точно передаёт основание пощады ради конкретных двадцати человек, сохраняя определённость числительного из контекста.
theological_decisions:
- issue: Передача אֲדֹנָי в обращении Авраама
  choice: моим Господом
  alternative: моим господином
  rationale: В контексте Бытия 18 собеседник отождествляется с Господом. Прописная буква указывает на божественный титул, но не заменяет его именем Яхве, которого в данной форме стиха нет.
- issue: Неуказанный объект при לֹא אַשְׁחִית
  choice: Не уничтожу
  alternative: Не уничтожу его / этот город
  rationale: Еврейский текст не называет объект прямо. Русский язык позволяет сохранить эту недосказанность, не решая дополнительно, имеется ли в виду город, место или область.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис лаконичен; повтор еврейского «и сказал» во второй реплике передан естественным «Он ответил». Не названные в оригинале «праведники» и объект уничтожения не добавлены.
