    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Я принесу
  rationale: Когортатив выражает вежливое предложение Авраама; в современном русском естественно передаётся будущим временем в контексте приглашения.
- source_word: פַת לֶחֶם
  choice: немного хлеба
  rationale: Сохраняет скромное преуменьшение, характерное для речи гостеприимного хозяина, и звучит естественнее буквального «кусок хлеба».
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: и вы подкрепитесь
  rationale: Еврейская идиома буквально говорит о поддержании сердца, но в данном контексте означает подкрепиться пищей; образ отмечен в сноске.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: потом пойдёте дальше
  rationale: Передаёт продолжение пути после угощения естественным современным русским выражением.
- source_word: כִּי עַל כֵּן
  choice: ведь потому
  rationale: Передаёт причинно-объяснительную связь, не устраняя несколько необычную логику учтивой речи Авраама.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: вы и прошли мимо вашего слуги
  rationale: Сохраняет глагол движения עבר и почтительное самоуничижительное именование Авраама «ваш слуга».
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: Хорошо, сделай, как сказал
  rationale: Кратко и естественно передаёт согласие гостей с предложением Авраама.
