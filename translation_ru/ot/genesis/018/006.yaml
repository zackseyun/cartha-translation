base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: ru
  text: 'Авраам поспешил в шатёр, к Сарре, и сказал: «Поскорее замеси тесто из трёх сеа[a][b] тонкой муки и сделай лепёшки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сеа — древняя мера объёма сыпучих тел; три сеа составляли приблизительно 20–22 литра.
    reason: cultural_note
  - marker: b
    text: 'Или: «три меры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: поспешил
  rationale: Передаёт быстроту действия и сохраняет энергичный темп повествования естественным современным русским языком.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: в шатёр к Сарре
  rationale: Направительный суффикс указывает на движение к шатру; контекст позволяет естественно передать вход внутрь, а אֶל שָׂרָה — цель движения, Сарру.
- source_word: מַהֲרִי
  choice: Скорее!
  rationale: Женская форма повеления обращена к Сарре. Краткое восклицание сохраняет настойчивость и звучит естественно по-русски.
- source_word: שְׁלֹשׁ סְאִים
  choice: трёх сей
  rationale: Сохранена конкретная древняя единица объёма; форма «сей» является родительным падежом от «сеа» после числительного «три».
- source_word: קֶמַח סֹלֶת
  choice: муки тонкого помола
  rationale: Передаёт муку высокого качества, тщательно и мелко смолотую, без введения лишней конфессиональной терминологии.
- source_word: לוּשִׁי
  choice: замеси тесто
  rationale: Глагол обозначает замешивание; слово «тесто» добавлено как естественно подразумеваемый объект в русском языке.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: и сделай лепёшки
  rationale: «Лепёшки» точнее русского «пироги» передаёт простые круглые хлебные изделия; «сделай» не уточняет способ приготовления сверх исходного текста.
