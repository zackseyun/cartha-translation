  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: ru
  text: 'Авраам ответил и сказал: «Вот, осмелился я говорить с моим Господом[a], хотя я — прах и пепел».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с моим господином». Древнееврейская форма может быть почтительным обращением; в основном тексте «Господом» написано с прописной буквы, поскольку из окружающего контекста следует, что Авраам обращается к ГОСПОДУ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן … וַיֹּאמַר
  choice: ответил и сказал
  rationale: Сохранены оба глагола устойчивой древнееврейской повествовательной формулы, поскольку здесь они торжественно вводят ответ Авраама.
- source_word: הִנֵּה נָא
  choice: вот
  rationale: «Вот» естественно передаёт указательно-дискурсивную функцию הִנֵּה. Частица נָא выражает почтительность и смягчение просьбы; в русском контексте эта учтивость уже передана общей смиренной формой реплики, тогда как буквальное «вот, пожалуйста» звучало бы неестественно.
- source_word: הוֹאַלְתִּי
  choice: осмелился я
  rationale: Форма означает, что говорящий решился или отважился предпринять действие. «Осмелился» передаёт одновременно смелость Авраама и его почтительное сознание собственной малости.
- source_word: לְדַבֵּר
  choice: говорить
  rationale: Прямое и естественное соответствие инфинитиву דבר.
- source_word: אֶל אֲדֹנָי
  choice: с моим Господом
  rationale: Русское управление «говорить с» здесь естественнее буквального «говорить к». Форма допускает значение почтительного обращения «мой господин», однако контекст связывает адресата с ГОСПОДОМ; прописная буква отражает это, не подменяя исходное слово именем יהוה.
- source_word: וְאָנֹכִי
  choice: хотя я
  rationale: 'Союз וְ по контексту имеет уступительный оттенок: Авраам противопоставляет дерзновение говорить своему ничтожеству.'
- source_word: עָפָר וָאֵפֶר
  choice: прах и пепел
  rationale: Естественное русское устойчивое выражение, передающее смертность и ничтожность человека.
theological_decisions:
- issue: Значение אֲדֹנָי в обращении Авраама
  choice: моим Господом
  alternative: моим господином
  rationale: Сама форма может быть почтительным обращением к господину, но ближайший контекст отождествляет собеседника Авраама с ГОСПОДОМ. Основной текст отражает контекстуальное понимание, а сноска сохраняет языковую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Инверсия «осмелился я» сохраняет достоинство и подчёркивает смирение Авраама без архаизации всего стиха.
