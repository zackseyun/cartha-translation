    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: И … родила
  rationale: Форма wayyiqtol продолжает последовательность повествования; глагол «родила» естественно передаёт ילד с прямым дополнением «сына».
- source_word: זִלְפָּה
  choice: Зелфа
  rationale: Традиционная и узнаваемая русская форма личного имени.
- source_word: שִׁפְחַת
  choice: служанка[a]
  rationale: שִׁפְחָה обозначает женщину-служанку зависимого положения и может также подразумевать рабский статус. «Служанка» естественно звучит по-русски, а сноска сохраняет более сильную лексическую возможность.
- source_word: לֵאָה
  choice: Лии
  rationale: 'Сопряжённая конструкция естественно передаётся русским родительным падежом: «служанка Лии».'
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: Предлог לְ при ילד указывает на отца либо того, для кого рождается ребёнок; русский дательный падеж сохраняет эту конструкцию без лишнего уточнения.
- source_word: בֵּן
  choice: сына
  rationale: Неопределённое существительное мужского рода; в русском после «родила» естественна форма винительного падежа без артикля.
