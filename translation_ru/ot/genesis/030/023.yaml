base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: ru
  text: 'Она зачала и родила сына, и сказала: «Бог снял с меня позор[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесчестье» или «стыд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Она зачала
  rationale: Глагол הרה означает зачатие или наступление беременности; «зачала» кратко и естественно передаёт повествовательную последовательность.
- source_word: וַתֵּלֶד בֵּן
  choice: и родила сына
  rationale: Сочетание ילד с בֵּן прямо означает рождение сына; выбран современный и вместе с тем достойный повествовательный оборот.
- source_word: וַתֹּאמֶר
  choice: и сказала
  rationale: Форма продолжает цепь последовательных событий; повтор подлежащего в русском не требуется.
- source_word: אָסַף
  choice: снял с меня
  rationale: В данном контексте אסף имеет значение удаления или устранения. Русский оборот «снял с меня» естественно сочетается с социальным позором и передаёт достигнутый результат.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на форму множественного числа, существительное согласовано здесь с глаголом в единственном числе и обозначает единого Бога.
- source_word: חֶרְפָּתִי
  choice: позор
  rationale: חֶרְפָּה охватывает значения позора, бесчестья и стыда, особенно публичного унижения. «Позор» ясно передаёт социальную сторону бездетности в контексте рассказа.
theological_decisions:
- issue: Число и референт אֱלֹהִים
  choice: Бог
  alternative: боги
  rationale: Глагол אָסַף стоит в единственном числе, а контекст указывает на единственного Бога; грамматика не допускает здесь множественного перевода.
- issue: Характер снятого унижения
  choice: позор
  alternative: бесчестье / стыд
  rationale: Перевод сохраняет общественное измерение חֶרְפָּה и не добавляет утверждения о личной вине Рахили.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским повествовательным регистром. Формулировка краткая, ясная и сохраняет последовательность древнееврейского текста.
