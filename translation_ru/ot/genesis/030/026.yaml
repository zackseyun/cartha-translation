  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: ru
  text: Отдай мне моих жён и моих детей, за которых я служил тебе[a], чтобы я мог уйти; ведь ты знаешь мою службу — как я служил тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за которых я работал на тебя». Женский род местоимения в еврейском тексте может относить эти слова прежде всего к жёнам, за которых Иаков служил Лавану.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мою службу, которой я служил тебе». Еврейский текст повторяет один и тот же корень со значением «служить, работать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: Отдай мне
  rationale: Императив נתן в контексте означает требование Лавану отпустить и передать Иакову его семью; «отдай мне» естественно передаёт адресованную ему просьбу.
- source_word: נָשַׁי וְאֶת יְלָדַי
  choice: моих жён и моих детей
  rationale: Контекст однозначно указывает на жён и детей Иакова; это точные и естественные современные соответствия.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָהֵן
  choice: за которых я служил тебе
  rationale: Предлог ב выражает основание или цену службы. Форма женского множественного числа особенно естественно соотносится с жёнами, но относительное «которых» в русском может охватывать названную семью, сохраняя неоднозначность объёма ссылки.
- source_word: וְאֵלֵכָה
  choice: и я уйду
  rationale: Когортатив выражает намерение и волю Иакова отправиться; в русском контексте «и я уйду» звучит естественно и передаёт желаемый результат просьбы.
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: ведь ты знаешь
  rationale: כִּי вводит обоснование, а перфект ידע имеет актуальное настоящее значение. Частица «ведь» естественно передаёт апелляцию к известному Лавану факту.
- source_word: עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: как я служил тебе
  rationale: Русская конструкция избегает тяжеловесного «службу, которой я служил», сохраняя смысл и повтор корня служ- в пределах стиха.
