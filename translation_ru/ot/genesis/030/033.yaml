  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранена персонификация честности как свидетеля, но тяжеловесные буквальные обороты заменены ясными русскими конструкциями. Термин «масть» употреблён в общеупотребительном значении окраски животного.
