  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: ru
  text: 'И моя честность засвидетельствует в мою пользу впоследствии[a][b], когда ты придёшь проверить мою плату[c]: всякая коза, которая не крапчатая и не пятнистая, и всякий ягнёнок, который не тёмной масти[d], если окажется у меня, будет считаться украденным.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя праведность» или «моя непорочность засвидетельствует в мою пользу». Здесь речь идёт о доказуемой порядочности Иакова при расчёте платы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в день завтрашний». Выражение может означать как «завтра», так и вообще более позднее время, когда Лаван проверит стадо.'
    reason: lexical_alternative
  - marker: c
    text: 'Или ближе к буквальному: «когда ты придёшь по поводу моей платы пред тобою». Оборот «пред тобою» может относиться к предстоящей проверке либо к плате; по смыслу речь идёт о проверке доли Иакова.'
    reason: translation_clarification
  - marker: d
    text: 'Или: «коричневой масти». Еврейское слово обозначает животное тёмной окраски.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: засвидетельствует обо мне
  rationale: Глагол ענה здесь выражает ответное свидетельство в пользу Иакова. Русское «засвидетельствует обо мне» естественно передаёт эту судебно-доказательную образность, не превращая её в буквальное и неясное «ответит во мне».
- source_word: צִדְקָתִי
  choice: моя честность
  rationale: В контексте договора о плате слово обозначает доказуемую правоту и порядочность Иакова. «Честность» ясно передаёт практический этический смысл; варианты «праведность» и «непорочность» сохранены в сноске.
- source_word: בְּיוֹם מָחָר
  choice: впоследствии
  rationale: Буквально выражение означает «в день завтрашний», но в данном контексте может указывать не строго на следующий календарный день, а на будущую проверку стада.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: когда ты придёшь проверить мою плату
  rationale: Оборот описывает будущую проверку доли Иакова Лаваном. «Проверить» выражает подразумеваемое практическое действие, а לְפָנֶיךָ не воспроизводится отдельным оборотом, поскольку личная проверка Лавана уже ясно обозначена.
- source_word: נָקֹד וְטָלוּא
  choice: крапчатая и пятнистая
  rationale: «Крапчатая» передаёт мелкие отметины נָקֹד, а «пятнистая» — более крупные пятна или участки окраски טָלוּא; союз «и» сохранён вслед за еврейским текстом.
- source_word: חוּם
  choice: тёмной масти
  rationale: Слово обозначает тёмную, вероятно коричневую, окраску овец. «Тёмной масти» естественно для описания животных и не создаёт ложной точности относительно оттенка.
- source_word: בָּעִזִּים / בַּכְּשָׂבִים
  choice: коза / овца
  rationale: Еврейские формы называют соответствующие классы животных. В русском единственное число после «всякая» естественно передаёт распределительное значение; «овца» здесь уместнее чрезмерно узкого «ягнёнок».
- source_word: גָּנוּב הוּא אִתִּי
  choice: если окажется у меня, будет считаться украденной
  rationale: 'Краткая еврейская формула устанавливает правило: любое животное неподходящей масти, найденное у Иакова, признаётся украденным. Русская формулировка раскрывает подразумеваемый условный и юридический смысл.'
