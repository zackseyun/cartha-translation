  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: ru
  text: Он поставил прутья, с которых снял кору, в желобах, у водопойных корыт, куда стадо приходило пить, прямо перед стадом. Когда животные приходили пить, они приходили в течку[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они спаривались». Еврейский глагол буквально описывает наступление у животных полового возбуждения (течки); в данном контексте может подразумеваться и спаривание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: поставил
  rationale: Глагол означает установить или поместить что-либо в определённое положение; «поставил» естественно передаёт целенаправленное размещение прутьев.
- source_word: הַמַּקְלוֹת אֲשֶׁר פִּצֵּל
  choice: прутья, с которых снял кору
  rationale: מַקְלוֹת здесь обозначает приготовленные Иаковом ветви или прутья, а פִּצֵּל в контексте — снятие полос коры, обнажавшее светлую древесину.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: в желобах — в водопойных корытах
  rationale: Два близких обозначения описывают место водопоя; тире передаёт вероятное уточняющее отношение, не превращая их без необходимости в два разных места.
- source_word: אֲשֶׁר תָּבֹאןָ הַצֹּאן לִשְׁתּוֹת
  choice: куда стадо приходило пить
  rationale: צֹאן — собирательное обозначение мелкого скота, то есть овец и коз; нейтральное «стадо» сохраняет эту широту.
- source_word: לְנֹכַח הַצֹּאן
  choice: прямо перед стадом
  rationale: Выражение указывает на расположение непосредственно перед животными или напротив них; «прямо перед» ясно передаёт пространственный смысл.
- source_word: וַיֵּחַמְנָה
  choice: у них начиналась течка
  rationale: Глагол буквально связан с жаром и применительно к животным означает приходить в половое возбуждение, в течку. Такой перевод сохраняет образ исходного текста и не подменяет состояние прямо названным спариванием.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: когда животные приходили пить
  rationale: Инфинитивная конструкция выражает временное обстоятельство; явное «животные» делает русский текст понятным, не сужая стадо до одних овец.
