  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: ru
  text: 'Когда Рахиль увидела, что не родила Иакову детей, она стала завидовать своей сестре и сказала Иакову: «Дай мне детей[a], иначе я умру!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновей». Здесь слово обозначает желанное потомство в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל
  choice: Когда Рахиль увидела
  rationale: Последовательность событий и причинно-временная связь естественно передаются придаточным с «когда».
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: что не родила Иакову детей
  rationale: Глагол יָלַד в форме женского рода означает «родить»; подразумеваемое дополнение выражено словом «детей», а дательный «Иакову» сохраняет отношение, обозначенное לְ.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: она стала завидовать своей сестре
  rationale: קנא в данном контексте означает зависть к плодовитости сестры. «Стала завидовать» передаёт возникновение чувства в ходе повествования; местоимение избегает тяжеловесного повтора имени без изменения референции.
- source_word: הָבָה לִּי בָנִים
  choice: Дай мне детей
  rationale: Хотя בָנִים буквально означает «сыновья», в контексте бесплодия речь идёт о потомстве вообще; «детей» естественно передаёт смысл, а буквальный вариант отмечен в сноске.
- source_word: וְאִם אַיִן מֵתָה אָנֹכִי
  choice: иначе я умру
  rationale: Идиоматичное русское выражение сохраняет резкость ультиматума и отчаяние прямой речи, не объясняя их психологически.
theological_decisions:
- issue: Обращение Рахили к Иакову как к тому, кто должен дать ей детей
  choice: Сохранена прямая формулировка «Дай мне детей»
  alternative: Не перефразировать как молитву или просьбу к Богу
  rationale: Текст прямо адресует требование Иакову; перевод не должен заранее исправлять или богословски истолковывать слова Рахили.
translation_notes:
  register: Современный литературный русский язык; прямая речь передана кратко и эмоционально. Синтаксис плавный, но сохраняет причинно-временную связь и напряжённость еврейского текста.
