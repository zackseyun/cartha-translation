lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Он сказал ему
  rationale: Естественно передаёт последовательное повествовательное действие wayyiqtol; союз ו здесь не обязательно выражать отдельным русским «и».
- source_word: אַתָּה יָדַעְתָּ
  choice: Ты знаешь
  rationale: Перфект глагола состояния יָדַע в прямой речи естественно передаётся настоящим временем. Самостоятельное местоимение отражено явным «ты», без добавления усилительной частицы.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: как я служил тебе
  rationale: עבד в данном контексте обозначает труд и службу у другого человека; «служил тебе» сохраняет обе стороны значения.
- source_word: מִקְנְךָ
  choice: твой скот
  rationale: מִקְנֶה — собирательное обозначение домашних стад; современное русское «скот» здесь шире, чем «крупный рогатый скот».
- source_word: וְאֵת אֲשֶׁר הָיָה מִקְנְךָ אִתִּי
  choice: и что стало с твоим скотом при мне
  rationale: Оборот буквально описывает, каким скот был при Иакове, а по контексту — что с ним произошло и как он prospered под его присмотром. «Что стало» естественно по-русски передаёт итог, не называя его прямо; буквальная форма отмечена в сноске.
