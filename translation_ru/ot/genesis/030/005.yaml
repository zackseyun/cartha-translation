lexical_decisions:
- source_word: וַתַּהַר
  choice: зачала
  rationale: Глагол הרה означает зачатие или наступление беременности; «зачала» кратко и естественно передаёт последовательность событий в повествовании.
- source_word: בִּלְהָה
  choice: Валла
  rationale: Использована традиционная русская библейская форма имени, хорошо узнаваемая читателями.
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Глагол ילד в данной форме означает «родила»; это естественное современное русское соответствие.
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: Предлог ל обозначает отношение рождения ребёнка к Иакову и естественно передаётся русским дательным падежом.
- source_word: בֵּן
  choice: сына
  rationale: Существительное בֵּן означает «сын»; после «родила Иакову» нормативна форма винительного падежа «сына».
