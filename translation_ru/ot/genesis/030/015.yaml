  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: ru
  text: 'Но Лия сказала ей: «Разве мало того, что ты взяла моего мужа? Хочешь забрать ещё и мандрагоры моего сына?» Рахиль сказала: «Тогда в обмен на мандрагоры твоего сына он ляжет с тобой этой ночью».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: «Мало тебе того»
  rationale: Естественно передаёт риторический вопрос со значением «разве недостаточно?» и сохраняет упрёк Лии.
- source_word: קַחְתֵּךְ אֶת־אִישִׁי
  choice: «ты отняла у меня мужа»
  rationale: Глагол לקח буквально означает «взять»; в данном конфликтном контексте русское «отнять у меня» ясно передаёт обвинительный оттенок, не утверждая сверх текста юридического или постоянного присвоения.
- source_word: דּוּדָאֵי
  choice: «мандрагоры»
  rationale: Обычное обозначение растения Mandragora в библейской традиции; не добавляется толкование о предполагаемых свойствах плодов.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: «он ляжет с тобой»
  rationale: Сохраняет прямой эвфемизм древнееврейского текста и его сексуальный смысл без грубости или смягчающего пересказа.
- source_word: תַּחַת
  choice: «за»
  rationale: 'В контексте сделки кратко и естественно выражает обмен: ночь с Иаковом в обмен на мандрагоры.'
theological_decisions:
- issue: Оценка поступков Лии и Рахили
  choice: Не добавлять нравственной или богословской оценки к их спору и соглашению
  alternative: Явно назвать действия греховными, законными либо оправданными
  rationale: Стих повествует о словах сестёр, но сам не формулирует их богословской оценки.
- issue: Предполагаемая роль мандрагор
  choice: Назвать растение без объяснения его назначения
  alternative: Указать, что мандрагоры считались средством от бесплодия или афродизиаком
  rationale: Такая связь возможна из контекста и древних представлений, но в самом стихе прямо не выражена.
translation_notes:
  register: Современный литературный русский язык; реплики звучат естественно, но сохраняют напряжённость и лаконизм исходного текста. Местоименное «та» указывает на Лию из ближайшего контекста, не подменяя её имя в самом стихе.
