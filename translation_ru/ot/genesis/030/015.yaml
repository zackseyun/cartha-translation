  to: 'Но Лия сказала ей: «Разве мало того, что ты взяла моего мужа? Хочешь забрать ещё и мандрагоры моего сына?» Рахиль сказала: «Тогда в обмен на мандрагоры твоего сына он ляжет с тобой этой ночью».'
  rationale: Заменены усиленные «отняла/отнять» на нейтральные «взяла/забрать», соответствующие לקח и английскому аудиту, при сохранении обвинительного тона самой реплики. Явно передан риторический вопрос. Добавлено имя Лии, установленное ближайшим контекстом, для естественной ясности русского текста.
