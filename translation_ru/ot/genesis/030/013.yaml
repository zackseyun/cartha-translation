  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: ru
  text: 'И сказала Лия: «Счастлива я![a] Ведь женщины[b] назовут меня счастливой». И назвала его Асиром.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Асир созвучно древнееврейским словам, переведённым здесь как «счастлива» и «назовут счастливой».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дочери»; здесь это слово, вероятно, означает женщин вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Счастлива я!
  rationale: Существительное с суффиксом первого лица выражает счастье или благополучие Лии. Восклицательная конструкция естественна по-русски и сохраняет связь со следующим глаголом и именем ребёнка.
- source_word: אִשְּׁרוּנִי
  choice: назовут меня счастливой
  rationale: Пиэль глагола אשר означает признать или назвать кого-либо счастливым. Этот перевод сохраняет повтор корня внутри высказывания Лии.
- source_word: בָּנוֹת
  choice: женщины
  rationale: Буквально слово означает «дочери», но здесь множественное число употреблено в более широком идиоматическом значении — женщины. Основной текст передаёт контекстуальный смысл, а буквальное значение отмечено в сноске.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: И назвала его Асиром
  rationale: Естественный русский эквивалент древнееврейской формулы наречения имени; содержание формулы передано без неестественной кальки «назвала его имя».
- source_word: אָשֵׁר
  choice: Асир
  rationale: Использована устоявшаяся русская библейская форма личного имени. Его смысловая связь со словами о счастье поясняется в сноске.
