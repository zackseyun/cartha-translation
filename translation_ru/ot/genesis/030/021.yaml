lexical_decisions:
- source_word: וְ/אַחַר
  choice: После этого
  rationale: Передаёт временную последовательность после упомянутых ранее рождений; естественно звучит в современном русском повествовании.
- source_word: יָלְדָה
  choice: она родила
  rationale: Форма qal, перфект, 3-е лицо женского рода единственного числа; обычный и точный русский глагол в контексте рождения ребёнка.
- source_word: בַּת
  choice: дочь
  rationale: Прямое дополнение при глаголе «родила»; русский язык не требует неопределённого артикля.
- source_word: וַ/תִּקְרָא אֶת שְׁמָהּ
  choice: и назвала её
  rationale: Естественный русский эквивалент еврейской идиомы «нарекла её имя»; сохраняет значение наречения имени без неестественной буквальности.
- source_word: דִּינָה
  choice: Диной
  rationale: Традиционная русская передача имени דִּינָה; творительный падеж обусловлен управлением глагола «назвала».
