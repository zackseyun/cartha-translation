base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: ru
  text: Иаков отделил ягнят[a] и поставил стадо лицом к полосатым[b] и ко всем тёмноокрашенным[c] животным в стаде Лавана[d]. Он выделил себе отдельные стада и не ставил их вместе со стадом Лавана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овец»; еврейское слово может обозначать ягнят или молодых овец.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пёстрым»; речь идёт о животных с полосами или опоясывающими отметинами.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «бурым» или «коричневым».'
    reason: lexical_alternative
  - marker: d
    text: 'Возможно: «происходившим из стада Лавана».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: ягнят
  rationale: Слово обозначает ягнят или молодых овец; «ягнят» передаёт его более узкое значение и уместно в контексте разведения стад.
- source_word: הִפְרִיד
  choice: отделил
  rationale: Прямо передаёт каузативное значение глагола פרד — отделить, обособить.
- source_word: פְּנֵי הַצֹּאן
  choice: поставил стадо лицом
  rationale: Сохраняет конкретный еврейский образ «лицо стада» и ясно выражает направление, в котором были обращены животные.
- source_word: עָקֹד
  choice: полосатым
  rationale: Термин обозначает животных с полосами или опоясывающими отметинами; «полосатым» понятно современному читателю.
- source_word: כָל חוּם
  choice: ко всем тёмноокрашенным животным
  rationale: חוּם указывает на тёмную, возможно бурую или коричневую окраску; более широкая передача не создаёт ложной точности.
- source_word: בְּצֹאן לָבָן
  choice: в стаде Лавана
  rationale: Основное локативное значение предлога בְ естественно передаётся как «в»; возможное указание на происхождение отмечено в сноске.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: Он образовал для себя отдельные стада
  rationale: Передаёт и создание групп животных для себя, и подчёркнутую словом לְבַדּוֹ обособленность.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: и не ставил их вместе со стадом Лавана
  rationale: Естественно передаёт размещение отделённых стад не совместно со стадом Лавана.
