  yaml_path: translation/ot/genesis/030/025.yaml
  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: ru
  text: 'Когда Рахиль родила Иосифа, Иаков сказал Лавану: «Отпусти меня, и я пойду к себе, в свою землю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: В данном повествовательном контексте еврейская конструкция вводит временное придаточное; естественное русское «Когда» передаёт её функцию без тяжеловесного «И было».
- source_word: שַׁלְּחֵנִי
  choice: Отпусти меня
  rationale: Форма от שׁלח здесь означает позволить Иакову уйти; «отпусти» естественно передаёт просьбу об освобождении от службы у Лавана.
- source_word: וְאֵלְכָה
  choice: и я пойду
  rationale: 'Когортатив выражает намерение или желаемое последствие просьбы; русская конструкция сохраняет прямую связь: «отпусти — и я пойду».'
- source_word: אֶל מְקוֹמִי וּלְאַרְצִי
  choice: к себе, в свою землю
  rationale: «К себе» идиоматично передаёт «к моему месту», а «в свою землю» сохраняет отдельное упоминание родной страны и притяжательное значение обоих выражений.
