base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: ru
  text: 'Когда Иаков вечером пришёл с поля, Лия вышла ему навстречу и сказала: «Ты должен войти ко мне, ведь я наняла тебя за мандрагоры моего сына»[a]. И он лёг с нею в ту ночь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст повторяет однокоренные формы глагола «нанять», усиливая утверждение Лии: «я действительно наняла тебя». Предлог перед словом «мандрагоры» может указывать на средство или цену сделки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: вернулся с поля
  rationale: Глагол בוא обозначает приход или возвращение; в данном контексте естественное русское «вернулся с поля» ясно передаёт движение Иакова к дому, не добавляя нового места назначения.
- source_word: בָּעֶרֶב
  choice: вечером
  rationale: Краткое и естественное соответствие еврейскому обозначению времени.
- source_word: וַתֵּצֵא ... לִקְרָאתוֹ
  choice: вышла ему навстречу
  rationale: Сохраняет сочетание глагола движения с לִקְרָאתוֹ и естественно звучит по-русски.
- source_word: אֵלַי תָּבוֹא
  choice: Ты должен войти ко мне
  rationale: В контексте это настойчивое требование супружеской близости. «Войти ко мне» сохраняет библейский эвфемизм, а «должен» передаёт заявленное Лией право, не превращая реплику в простое приглашение.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: я наняла тебя
  rationale: Сохраняет ключевой глагол שׂכר и договорный характер сцены. Усилительная конструкция с инфинитивом отмечена в сноске, поскольку её буквальное воспроизведение в основном тексте было бы тяжеловесным.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: за мандрагоры моего сына
  rationale: Предлог בְּ здесь естественно понимается как указание на цену сделки; «за» ясно и кратко передаёт этот смысл.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: он лёг с нею
  rationale: Сохраняет традиционный библейский эвфемизм половой близости и достоинство повествовательного тона.
- source_word: בַּלַּיְלָה הוּא
  choice: в ту ночь
  rationale: Естественно передаёт еврейское сочетание существительного с указательным местоимением.
