lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: Что мне дать тебе?
  rationale: Вопрос о вознаграждении передан естественной современной русской конструкцией с инфинитивом, сохраняющей прямоту предложения Лавана.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Не давай мне ничего
  rationale: Сочетание לֹא с имперфектом здесь выражает отказ от предложенной платы; русское отрицательное повелительное предложение точно и естественно передаёт этот смысл.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Если ты сделаешь для меня вот что
  rationale: Оборот «вот что» передаёт указательное הַדָּבָר הַזֶּה и естественно вводит условие, которое Иаков далее разъясняет.
- source_word: אָשׁוּבָה
  choice: я снова буду
  rationale: В контексте שׁוב может обозначать как возвращение, так и возобновление прежней работы. В основном тексте выбран наиболее естественный контекстуальный смысл «снова», а реальная неоднозначность отмечена в сноске.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: буду пасти твоё стадо
  rationale: רעה в сочетании с צֹאן обозначает пастьбу и уход за мелким скотом; «стадо» — понятный русский собирательный эквивалент для овец и коз.
- source_word: אֶשְׁמֹר
  choice: стеречь его
  rationale: שׁמר дополняет «пасти» значением охраны и надзора; «стеречь» ясно передаёт защитную сторону работы пастуха.
