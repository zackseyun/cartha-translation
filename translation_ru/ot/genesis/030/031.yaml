  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: ru
  text: 'Он сказал: «Что мне дать тебе?» Иаков ответил: «Тебе не нужно мне ничего давать. Если ты сделаешь для меня вот что, я снова[a] буду пасти твоё стадо и стеречь его».'
