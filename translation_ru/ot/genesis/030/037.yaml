  text: וַ/יִּֽקַּֽח ל֣/וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְ/ל֣וּז וְ/עֶרְמ֑וֹן וַ/יְפַצֵּ֤ל בָּ/הֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַ/לָּבָ֔ן אֲשֶׁ֖ר עַל הַ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: ru
  text: Иаков взял себе свежие прутья тополя[a], миндаля[b] и платана[c] и снял с них кору полосами, обнажив белую древесину прутьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стиракса»; точное значение слова לִבְנֶה не установлено, хотя перевод «тополь» широко распространён.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых традиционных переводах — «орешника», однако более вероятно, что לוּז означает миндальное дерево.
    reason: lexical_alternative
  - marker: c
    text: В некоторых традиционных переводах — «каштана», однако более вероятно, что עֶרְמוֹן означает платан.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: прутья
  rationale: Речь идёт о срезанных тонких ветвях, использованных Иаковом; «прутья» конкретно и естественно передаёт предмет в данном контексте.
- source_word: לִבְנֶה לַח
  choice: свежие прутья тополя
  rationale: לִבְנֶה обычно отождествляют с тополем, хотя точный вид дерева неясен; לַח указывает на свежую, ещё не высохшую древесину.
- source_word: לוּז
  choice: миндаль
  rationale: По современным лексикографическим данным, здесь вероятнее миндальное дерево, а не орешник, встречающийся в некоторых традиционных переводах.
- source_word: עֶרְמוֹן
  choice: платан
  rationale: Наиболее вероятное значение еврейского названия дерева — платан; традиционное «каштан» считается менее точным.
- source_word: וַיְפַצֵּל ... פְּצָלוֹת לְבָנוֹת
  choice: снял с них кору полосами
  rationale: Контекст описывает частичное удаление коры, в результате которого на прутьях появились светлые полосы. Такая формулировка естественно передаёт и действие, и его видимый результат.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: обнажив белую древесину
  rationale: Оборот означает обнажение белой части под корой; уточнение «древесину» делает образ понятным по-русски без изменения смысла.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: древесину прутьев
  rationale: Русская родительная конструкция естественно выражает принадлежность белой обнажённой части самим прутьям.
