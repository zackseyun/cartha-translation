lexical_decisions:
- source_word: וַתַּהַר
  choice: зачала
  rationale: Глагол הרה в повествовательной форме означает «зачать»; этот вариант точен, краток и естественен для рассказа о рождении.
- source_word: עוֹד
  choice: снова
  rationale: 'В данной последовательности עוֹד указывает на повторение: Лия зачала ещё раз. «Снова» ясно и естественно передаёт это значение.'
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Глагол ילד в этой форме означает «родить»; выбран обычный и точный русский эквивалент.
- source_word: בֵּן
  choice: сына
  rationale: Существительное прямо означает «сын»; форма винительного падежа обусловлена русским синтаксисом.
- source_word: שִׁשִּׁי
  choice: шестого
  rationale: Порядковое числительное определяет сына по счёту; русская конструкция «родила шестого сына» естественно передаёт смысл.
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: Предлог לְ обозначает отношение к Иакову в формуле рождения; дательный падеж сохраняет это значение и звучит естественно по-русски.
