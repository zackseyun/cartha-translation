base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: ru
  text: 'Иаков разгневался на Рахиль[a] и сказал: «Разве я на месте Бога, который не дал тебе плода чрева[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «гнев Иакова вспыхнул на Рахиль».'
    reason: lexical_alternative
  - marker: b
    text: «Плод чрева» — образное обозначение детей, потомства.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: разгневался
  rationale: Еврейская идиома буквально изображает вспыхнувший гнев; русский глагол «разгневался» естественно и достаточно выразительно передаёт её смысл.
- source_word: בְּרָחֵל
  choice: на Рахиль
  rationale: Предлог обозначает человека, на которого направлен гнев; по-русски нормативно «разгневаться на кого-либо».
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Разве я на месте Бога
  rationale: תַּחַת выражает замещение или занятие чужого места; вопрос отрицает, что Иаков обладает Божьей властью.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: Контекст и согласование указывают здесь на единого Бога.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: который не дал тебе
  rationale: מנע обозначает удержание или недопущение. «Не дал тебе» ясно передаёт причинённое лишение и звучит естественнее, чем буквальное «удержал от тебя».
- source_word: פְּרִי בָטֶן
  choice: плода чрева
  rationale: Сохранён конкретный еврейский образ потомства; его значение поясняется в сноске.
theological_decisions:
- issue: Божественная обусловленность бездетности Рахили
  choice: Слова Иакова прямо представляют Бога тем, кто не дал Рахили потомства.
  alternative: Понять высказывание лишь как риторический отказ Иакова от ответственности, не связывая бездетность с действием Бога.
  rationale: Относительное предложение אֲשֶׁר מָנַע недвусмысленно называет Бога субъектом действия; перевод сохраняет это утверждение, не смягчая его и не развивая богословски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Плод чрева» сохранён ради прозрачности исходной метафоры, а более буквальная идиома гнева вынесена в сноску.
