  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение בגד трудно для истолкования. Возможно, это возглас «Удача!»; его также понимают как «Пришло счастье!». По традиционному толкованию его передают и как «Отряд!». Имя Гад созвучно еврейскому слову, на котором строится эта игра слов.
