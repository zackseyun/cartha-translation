lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Форма wayyiqtol продолжает последовательность событий повествования; «родила» естественно и точно передаёт действие.
- source_word: זִלְפָּה
  choice: Зелфа
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: שִׁפְחַת לֵאָה
  choice: служанка Лии
  rationale: Сочетание указывает на подчинённое положение Зелфы по отношению к Лии. «Служанка» понятно современному читателю, а более жёсткий социально-правовой оттенок еврейского слова отмечен в сноске.
- source_word: בֵּן שֵׁנִי
  choice: второго сына
  rationale: Буквально «сына, второго»; речь идёт о втором сыне, которого Зелфа родила Иакову.
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: Предлог לְ в формуле рождения обозначает отца и допускает естественную русскую конструкцию «родила Иакову».
