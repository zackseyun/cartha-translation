base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: ru
  text: Ведь то немногое, что было у тебя до меня, сильно умножилось, и Яхве благословил тебя с моим приходом[a]. А теперь когда же и мне позаботиться о собственном доме?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у моей ноги»; выражение может означать «с моим приходом» или «благодаря мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда же и мне сделать что-нибудь для собственного дома?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ
  choice: то немногое, что было у тебя
  rationale: Передаёт малое количество имущества Лавана естественным современным русским оборотом.
- source_word: לְפָנַי
  choice: до меня
  rationale: В контексте означает состояние дел до появления Иакова; формулировка кратка и сохраняет временное сопоставление.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: умножилось до изобилия
  rationale: Передаёт стремительный рост, выраженный פרץ, и достигнутое изобилие, обозначенное לָרֹב.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לְרַגְלִי
  choice: с моим приходом
  rationale: Буквально «у моей ноги»; здесь это идиома, связывающая благословение с приходом и присутствием Иакова. Причинный оттенок остаётся возможным и отмечен в сноске.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: когда же и мне позаботиться о собственном доме?
  rationale: Естественно выражает вопрос Иакова о том, когда он сможет действовать ради благополучия своей семьи, сохраняя акцент גַם אָנֹכִי — «и мне».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет это различие.
- issue: Связь благословения с Иаковом в לְרַגְלִי
  choice: с моим приходом
  alternative: благодаря мне
  rationale: Основной текст сохраняет временно-сопроводительный смысл и не превращает возможную причинную связь в единственно допустимое толкование.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Дом» сохранён как обозначение семьи и домашнего хозяйства; смысл обеспечения семьи раскрыт глаголом «позаботиться» без излишней конкретизации.
