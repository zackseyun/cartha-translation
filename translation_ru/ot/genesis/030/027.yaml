base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: ru
  text: 'Лаван сказал ему: «Если я обрёл благоволение в твоих глазах, прошу тебя…[a] Я узнал через гадание, что Яхве благословил меня благодаря тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский условный оборот остаётся без прямо выраженного продолжения. Слово «прошу» передаёт просительный оттенок частицы «на». По контексту подразумевается просьба Иакову остаться.
    reason: Сохранена синтаксическая эллиптичность исходного текста; сноска поясняет просительный оттенок и вероятное контекстуальное восполнение, не выдавая его за слова оригинала.
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: О, если бы я обрёл благоволение в твоих глазах!
  rationale: 'Еврейская условная формула здесь остаётся незавершённой: просьба подразумевается, но прямо не выражена. Перевод сохраняет эту эллиптичность, естественно передаёт мольбу частицей «о» и удерживает образ «в глазах».'
- source_word: נִחַשְׁתִּי
  choice: Я узнал по знамениям
  rationale: Пиэль глагола נחשׁ обозначает гадание или толкование знамений. Формулировка передаёт как способ получения знания, так и сильное лексическое значение, не смягчая его до простого жизненного опыта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וַיְבָרֲכֵנִי
  choice: благословил меня
  rationale: Естественная русская передача завершённого действия глагола ברך в данном контексте.
- source_word: בִּגְלָלֶךָ
  choice: благодаря тебе
  rationale: Передаёт причинную связь и положительный результат; в данном контексте звучит естественнее буквального «из-за тебя».
- source_word: לָבָן
  choice: Лаван
  rationale: Традиционная русская библейская форма личного имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Источник знания Лавана
  choice: узнал по знамениям
  alternative: узнал по опыту
  rationale: Основное значение формы נִחַשְׁתִּי связано с гаданием и толкованием знамений. Перевод сохраняет напряжение между языческой практикой Лавана и его признанием благословения Яхве.
- issue: Подразумеваемая просьба в незавершённом условном обороте
  choice: не добавлять «останься» в основной текст
  alternative: если я обрёл благоволение в твоих глазах, пожалуйста, останься
  rationale: В масоретском тексте прямого глагола «останься» нет. Контекст допускает такое восполнение, но сохранение эллипсиса точнее отражает форму источника; возможное восполнение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика Лавана передаёт почтительную мольбу без искусственно добавленного повеления; выражение «по знамениям» понятно широкому читателю и сохраняет связь с гадательной практикой.
