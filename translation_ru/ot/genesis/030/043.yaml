base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: ru
  text: И этот человек чрезвычайно разбогател, и у него стало много мелкого скота, рабынь и рабов, верблюдов и ослов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ ... מְאֹד מְאֹד
  choice: разбогател ... чрезвычайно
  rationale: Глагол פרץ буквально передаёт стремительное разрастание или выход за прежние пределы, а в контексте означает резкий рост достатка; удвоенное מְאֹד усиливает степень.
- source_word: הָאִישׁ
  choice: этот человек
  rationale: Сохраняет нарицательное обозначение исходного текста, при этом указательное «этот» естественно связывает его с уже названным в контексте Иаковом.
- source_word: וַיְהִי לוֹ
  choice: у него стало
  rationale: Передаёт не просто обладание, а возникший в результате описанных событий новый уровень достатка.
- source_word: צֹאן רַבּוֹת
  choice: много мелкого скота
  rationale: צֹאן — собирательное обозначение овец и коз; «мелкий скот» точнее, чем одни лишь «стада», обозначает состав имущества.
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: рабынь и рабов
  rationale: Парные слова обозначают женщин и мужчин несвободного домашнего статуса. В перечне приобретённого имущества перевод «рабыни и рабы» не смягчает социальную реальность текста.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: верблюдов и ослов
  rationale: Прямые современные русские соответствия названиям животных.
theological_decisions:
- issue: Передача статуса שְׁפָחוֹת и עֲבָדִים
  choice: рабыни и рабы
  alternative: служанки и слуги
  rationale: Слова могут обозначать домашних слуг, однако в данном перечне они представлены среди приобретённого имущества; перевод с указанием рабского статуса точнее сохраняет неприятную социальную реальность и не сглаживает текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» и последовательное перечисление сохраняют накопительный ритм еврейской фразы; удвоение מְאֹד מְאֹד передано сильным, но естественным наречием «чрезвычайно».
