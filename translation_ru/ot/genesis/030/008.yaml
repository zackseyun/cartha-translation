  - marker: b
    text: Имя «Неффалим» передаёт еврейское נַפְתָּלִי и созвучно употреблённым здесь словам со значением «бороться, борения».
    reason: wordplay
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: Борьбой Божьей
  rationale: Сохраняет необычную конструкцию оригинала и прямое упоминание Бога, не устраняя её смысловую неоднозначность; возможное усилительное значение поясняется в сноске.
- source_word: נִפְתַּלְתִּי
  choice: боролась я
  rationale: Передаёт образ борьбы и поддерживает корневую игру слов, связанную с именем Неффалим.
- source_word: עִם אֲחֹתִי
  choice: с сестрой моей
  rationale: Прямо передаёт обычное значение предлога עִם; состязательный оттенок уже выражен глаголом «боролась».
- source_word: גַּם יָכֹלְתִּי
  choice: и одолела
  rationale: В данном контексте глагол указывает на успех в соперничестве; «одолела» естественно продолжает образ борьбы.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: И назвала она его Неффалимом
  rationale: Естественно передаёт еврейскую формулу наречения имени и сохраняет связь имени с предшествующими словами Рахили.
- source_word: נַפְתָּלִי
  choice: Неффалим
  rationale: Использована устоявшаяся русская библейская форма имени; связь с еврейским корнем поясняется в сноске.
theological_decisions:
- issue: Значение слова אֱלֹהִים в выражении נַפְתּוּלֵי אֱלֹהִים
  choice: Сохранено прямое «Божьей»
  alternative: «великой» или «необычайной» борьбой
  rationale: Оригинал допускает как прямое отнесение борьбы к Богу, так и усилительное значение «великая, могучая». Основной текст сохраняет формальную и богословскую напряжённость, а сноска сообщает альтернативу.
