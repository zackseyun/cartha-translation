  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: ru
  text: Когда же скот был слабым[a], Иаков не клал прутьев[b]. Так слабый скот доставался Лавану, а крепкий скот — Иакову[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был немощным». Еврейское слово обозначает слабых животных; некоторые понимают его здесь более узко — как указание на позднее спаривание или на животных худшего качества.'
    reason: lexical_alternative
  - marker: b
    text: То есть не клал перед животными прутья, о которых говорится в предыдущих стихах. В еврейском тексте дополнение не названо прямо.
    reason: cross_reference
  - marker: c
    text: 'Или: «сильный», «здоровый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: Когда же скот был слабым
  rationale: Предлог ב при инфинитиве образует временную конструкцию. עטף здесь, в противопоставлении крепким животным, передано как состояние слабости без чрезмерно узкого истолкования, будто речь непременно идёт о позднем спаривании.
- source_word: הַצֹּאן
  choice: скот
  rationale: צֹאן — собирательное обозначение мелкого домашнего скота, прежде всего овец и коз. В данном контексте русское «скот» естественно и не ограничивает значение только овцами.
- source_word: לֹא יָשִׂים
  choice: Иаков не клал прутьев
  rationale: Глагол שׂים означает «класть, ставить, помещать»; объект в еврейском тексте подразумевается из предшествующих стихов. Для ясности по-русски восстановлены Иаков и прутья.
- source_word: וְהָיָה
  choice: Так ... доставался
  rationale: Конструкция выражает получившийся результат и распределение животных между Лаваном и Иаковом. «Доставался» естественно передаёт принадлежность или долю.
- source_word: הָעֲטֻפִים
  choice: слабый скот
  rationale: Форма от עטף обозначает слабых животных и сохраняет смысловую связь с первым предложением.
- source_word: וְהַקְּשֻׁרִים
  choice: крепкий
  rationale: Необычная форма קְשֻׁרִים в данном противопоставлении обозначает сильных, выносливых животных. «Крепкий» звучит естественно применительно к скоту и сохраняет контраст.
- source_word: לְלָבָן ... לְיַעֲקֹב
  choice: доставался Лавану ... Иакову
  rationale: Предлог ל здесь указывает на принадлежность или долю каждого; дательный падеж с глаголом «доставался» естественно передаёт эту функцию.
