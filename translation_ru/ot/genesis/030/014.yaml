  text: וַ/יֵּ֨לֶךְ רְאוּבֵ֜ן בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּמְצָ֤א דֽוּדָאִים֙ בַּ/שָּׂדֶ֔ה וַ/יָּבֵ֣א אֹתָ֔/ם אֶל לֵאָ֖ה אִמּ֑/וֹ וַ/תֹּ֤אמֶר רָחֵל֙ אֶל לֵאָ֔ה תְּנִי נָ֣א לִ֔/י מִ/דּוּדָאֵ֖י בְּנֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: ru
  text: 'Во время жатвы пшеницы Рувим пошёл и нашёл в поле мандрагоры[a], а затем принёс их своей матери Лии. Рахиль сказала Лии: «Пожалуйста, дай мне немного мандрагор твоего сына».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «любовные яблоки»; еврейское слово דּוּדָאִים обозначает растение, традиционно отождествляемое с мандрагорой и связываемое в контексте этого повествования с плодовитостью.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: Во время жатвы пшеницы
  rationale: Оборот обозначает период уборки пшеницы; современное русское «во время» естественно передаёт временное значение, не утрачивая сельскохозяйственного контекста.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное повествовательное значение הלך; добавление «вышел» контекстом не требуется.
- source_word: דּוּדָאִים
  choice: мандрагоры
  rationale: Это традиционное и наиболее узнаваемое соответствие; поскольку точное ботаническое отождествление не вполне бесспорно, неопределённость отмечена в сноске.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое и естественное соответствие שׂדה в данном сельскохозяйственном контексте.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: а затем принёс их своей матери Лии
  rationale: Передаёт каузативное значение בוא «принести» и ясно обозначает Лию как мать Рувима; «затем» естественно отражает последовательность повествовательных форм.
- source_word: תְּנִי נָא לִי
  choice: Пожалуйста, дай мне
  rationale: Частица נָא смягчает повеление и передаётся вежливой просьбой.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: немного мандрагор твоего сына
  rationale: Предлог מִן имеет партитивное значение — Рахиль просит часть найденных растений; притяжательная конструкция сохраняет указание на сына Лии.
theological_decisions:
- issue: Связь растения с плодовитостью
  choice: Не выражать эту связь непосредственно в основном тексте
  alternative: Назвать растения плодами или средством, связанным с зачатием
  rationale: Сам стих лишь сообщает о находке и просьбе; возможная связь с плодовитостью возникает из более широкого повествовательного контекста и не должна превращаться в явное утверждение перевода.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены простота библейского рассказа и вежливый оттенок просьбы Рахили; ботаническая неопределённость вынесена в сноску.
