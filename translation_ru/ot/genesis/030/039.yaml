  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: ru
  text: Так мелкий скот спаривался перед прутьями и давал полосатый[a], крапчатый и пятнистый[b] приплод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «с перевязями» или «с опоясывающими полосами»; традиционно это слово передавали как «с кольцевыми полосами».'
    reason: lexical_alternative
  - marker: b
    text: Различие между «крапчатым» (נְקֻדִּים) и «пятнистым» (טְלֻאִים) приблизительно; последнее слово можно также передать как «пёстрый», «в крупных пятнах» или «с пятнами неправильной формы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: спаривался
  rationale: Глагол יחם буквально связан с течкой или половым возбуждением животных, но в контексте разведения обозначает спаривание; выбран естественный современный русский эквивалент без сведения значения только к зачатию.
- source_word: הַצֹּאן
  choice: мелкий скот
  rationale: צאן — собирательное обозначение овец и коз. «Мелкий скот» точнее передаёт состав стада, чем одно лишь «овцы», и сохраняет собирательный смысл.
- source_word: אֶל הַמַּקְלוֹת
  choice: перед прутьями
  rationale: Предлог אֶל обычно означает направление к чему-либо, но в описанной сцене указывает на положение животных относительно выставленных прутьев; «перед прутьями» ясно передаёт ситуацию, не утверждая причинной связи.
- source_word: וַתֵּלַדְןָ
  choice: рождался приплод
  rationale: Форма от ילד означает рождение потомства. Слово «приплод» добавлено для естественности русского синтаксиса, поскольку в еврейском далее стоят субстантивированные определения без выраженного существительного.
- source_word: עֲקֻדִּים
  choice: полосатый
  rationale: Слово обозначает животных с полосами или опоясывающими отметинами. «Полосатый» — ясный современный эквивалент; возможное значение «с перевязями» отмечено в сноске.
- source_word: נְקֻדִּים
  choice: крапчатый
  rationale: Термин указывает на мелкие точки или пятнышки. «Крапчатый» позволяет отличить этот рисунок от более крупных пятен следующего определения.
- source_word: וּטְלֻאִים
  choice: пятнистый
  rationale: Слово описывает пёстрые, пятнистые или покрытые крупными пятнами отметины. «Пятнистый» естественно по-русски, а приблизительность различия с נְקֻדִּים отражена в сноске.
theological_decisions:
- issue: Причинная связь между прутьями и окраской приплода
  choice: 'Не выражать причинность сверх текста: «спаривался перед прутьями»'
  alternative: «Из-за прутьев» или иная формулировка, утверждающая действие прутьев
  rationale: Стих повествовательно связывает спаривание у прутьев с последующим приплодом, но сам по себе не формулирует механизм или богословское объяснение; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранена лаконичность повествования; собирательное «мелкий скот» не ограничивает צאן только овцами. Конструкция с «приплодом» делает эллиптический еврейский оборот естественным по-русски.
