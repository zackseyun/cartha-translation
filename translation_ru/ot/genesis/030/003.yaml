source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: ru
  text: 'Тогда она сказала: «Вот моя рабыня Валла. Войди к ней, чтобы она родила на моих коленях[a] и чтобы через неё и я обрела потомство[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «родила на моих коленях». Вероятно, речь идёт об обычае, при котором жена символически принимала рождённого рабыней ребёнка как своего.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «и я буду построена через неё». Это образ обретения детей и продолжения семьи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: моя рабыня
  rationale: Слово обозначает женщину, находящуюся в подчинённом положении служанки или рабыни. «Рабыня» ясно передаёт её социальный статус и не архаизирует речь.
- source_word: בֹּא אֵלֶיהָ
  choice: войди к ней
  rationale: Сохранён древнееврейский эвфемизм, означающий половую связь; в данном контексте он понятен по-русски и соответствует достоинству библейского повествования.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: чтобы она родила на моих коленях
  rationale: Буквальный и культурно значимый образ сохранён в основном тексте, а вероятный обычай символического принятия ребёнка пояснён в сноске.
- source_word: וְאִבָּנֶה
  choice: чтобы … и я обрела потомство
  rationale: Буквально глагол означает «быть построенной», но здесь метафорически говорит об обретении детей и продолжении семьи. Естественный русский смысл дан в тексте, а исходная метафора сохранена в сноске.
- source_word: מִמֶּנָּה
  choice: через неё
  rationale: Предлог представляет Валлу как ту, через кого Рахиль надеется обрести детей; «через неё» естественно передаёт это значение средства.
- source_word: גַם אָנֹכִי
  choice: и я
  rationale: 'Сочетание сохраняет акцент на Рахили: благодаря Валле она тоже надеется обрести потомство.'
- source_word: בִלְהָה
  choice: Валла
  rationale: Использована традиционная и хорошо узнаваемая русская форма библейского имени.
theological_decisions:
- issue: Смысл рождения ребёнка «на коленях» Рахили
  choice: Сохранить буквальный образ в тексте и осторожно объяснить вероятный обычай в сноске
  alternative: Сразу передать как усыновление или признание ребёнка своим
  rationale: Точный характер древнего обычая не вполне определён, поэтому перевод не должен превращать вероятное объяснение в однозначное утверждение.
- issue: Метафора וְאִבָּנֶה
  choice: Передать контекстуальный смысл «обрела потомство», указав буквальную метафору в сноске
  alternative: «была построена» или «устроилась»
  rationale: Буквальная калька по-русски неясна и неестественна, тогда как сноска позволяет сохранить образ семьи, которая «строится» через детей.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены исходный эвфемизм «войди к ней» и культурный образ рождения «на моих коленях»; неясные для современного читателя реалии пояснены без догматического уточнения.
