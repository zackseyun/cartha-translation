lexical_decisions:
- source_word: וַתַּהַר
  choice: зачала
  rationale: Глагол הרה означает зачатие или наступление беременности; «зачала» кратко и естественно передаёт действие в последовательности повествования.
- source_word: עוֹד
  choice: снова
  rationale: В данном рассказе слово указывает на повторение события.
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Глагол ילד в породе qal здесь означает «родила»; это обычное и ясное выражение в современном русском языке.
- source_word: שִׁפְחַת
  choice: рабыня[a]
  rationale: שִׁפְחָה обозначает женщину несвободного, зависимого положения; «рабыня» прямо передаёт её социально-правовой статус, а сноска сохраняет более мягкую традиционную альтернативу.
- source_word: בֵּן שֵׁנִי
  choice: второго сына
  rationale: Сочетание буквально означает «второго сына» и в контексте указывает на второго сына Валлы от Иакова.
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: 'Предлог לְ выражает здесь отношение родительства: Валла родила сына Иакову.'
- source_word: בִּלְהָה ... רָחֵל
  choice: Валла, рабыня Рахили
  rationale: Сохранена аппозиционная конструкция, в которой Валла определяется через своё положение по отношению к Рахили; использованы укоренившиеся русские формы библейских имён.
