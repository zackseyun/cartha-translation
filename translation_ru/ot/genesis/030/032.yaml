base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: ru
  text: Я пройду сегодня через всё твоё стадо и отделю из него всех крапчатых и пятнистых овец, а также всех тёмных овец; а среди коз — всех пятнистых и крапчатых. Это и будет моей платой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Тёмных» — возможно, «коричневых». Еврейское חוּם обозначает тёмную или коричневую окраску овец. «Крапчатые» (נָקֹד) и «пятнистые» (טָלוּא) — термины пёстрой окраски; точное различие между ними не вполне ясно.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: Я пройду
  rationale: Форма допускает как будущее, так и волитивное понимание. В русском контексте предложения Иакова естественное «я пройду» сохраняет прямой характер намеченного действия, не вводя излишне разрешительное «позволь мне».
- source_word: בְּכָל צֹאנְךָ
  choice: по всему твоему стаду
  rationale: צֹאן — собирательное обозначение мелкого скота, включая овец и коз; «стадо» естественно передаёт это значение.
- source_word: הָסֵר מִשָּׁם
  choice: и отделю оттуда
  rationale: В данном контексте речь идёт об изъятии и обособлении животных определённой окраски; «отделю» ясно выражает практический смысл действия.
- source_word: נָקֹד וְטָלוּא
  choice: крапчатую и пятнистую
  rationale: Оба слова обозначают неоднородную окраску. «Крапчатая» передаёт мелкие отметины, а «пятнистая» — более общие или крупные пятна, не утверждая чрезмерно строгого различия.
- source_word: חוּם
  choice: тёмную
  rationale: Слово обозначает тёмную, вероятно коричневую, окраску. «Тёмную» сохраняет широту значения; возможное уточнение вынесено в примечание.
- source_word: בַּכְּשָׂבִים
  choice: среди овец
  rationale: В противопоставлении козам слово указывает на овечью часть стада; «среди овец» современно и ясно.
- source_word: בָּעִזִּים
  choice: среди коз
  rationale: Естественная русская передача собирательного множественного числа без неоправданного уточнения пола животных.
- source_word: וְהָיָה שְׂכָרִי
  choice: это и будет моей платой
  rationale: שָׂכָר означает плату или вознаграждение за труд. «Плата» естественно звучит в договорённости Иакова с Лаваном.
theological_decisions: []
