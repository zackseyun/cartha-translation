  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: ru
  text: И всякий раз, когда у крепких животных стада[a] наступало время спаривания, Иаков клал прутья на виду у животных в водопойные желоба[b], чтобы они спаривались у прутьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «сильных», «выносливых»; еврейское слово обозначает более крепких животных в противоположность слабым, упомянутым в следующем стихе.
    reason: lexical_alternative
  - marker: b
    text: Или «в водопойные каналы»; речь идёт о местах, куда животные подходили пить.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: И всякий раз, когда
  rationale: Сочетание вводит повторявшееся в прошлом обстоятельство; такая передача естественно выражает обычное, многократное действие.
- source_word: יַחֵם / לְיַחְמֶנָּה
  choice: наступало время спаривания / чтобы они спаривались
  rationale: Корень יחם в данном контексте относится к течке и спариванию животных. Формулировка понятна современному читателю и сохраняет связь между двумя употреблениями корня.
- source_word: הַצֹּאן
  choice: животные из стада / животными
  rationale: צאן — собирательное обозначение мелкого скота, которое может включать овец и коз; слово «животные» в сочетании со «стадом» не сужает значение до одного вида.
- source_word: הַמְקֻשָּׁרוֹת
  choice: крепких
  rationale: В контексте слово противопоставлено слабым животным в следующем стихе и обозначает более сильных, крепких особей.
- source_word: וְשָׂם
  choice: Иаков клал
  rationale: Имперфективное русское «клал» передаёт повторявшееся действие в рамках описываемого обычая.
- source_word: הַמַּקְלוֹת
  choice: прутья
  rationale: Речь идёт об очищенных от коры прутьях, упомянутых ранее; «прутья» точнее связывает стих с ближайшим контекстом, чем более общее «палки».
- source_word: לְעֵינֵי הַצֹּאן
  choice: перед животными
  rationale: Еврейский оборот буквально означает «перед глазами стада». Естественная русская формулировка сохраняет смысл видимого расположения прутьев, не создавая тяжеловесности.
- source_word: בָּרֳהָטִים
  choice: в водопойные желоба
  rationale: רהטים обозначает желоба или каналы у места водопоя. «Водопойные желоба» ясно передаёт и форму, и назначение.
- source_word: בַּמַּקְלוֹת
  choice: у прутьев
  rationale: Предлог ב допускает локативно-обстоятельственное понимание. «У прутьев» сохраняет пространственную связь, не утверждая, будто прутья сами были непосредственной причиной.
theological_decisions:
- issue: Причинная роль прутьев
  choice: чтобы они спаривались у прутьев
  alternative: чтобы прутья заставляли их спариваться
  rationale: Текст сообщает о цели действий Иакова, но не требует утверждать объективную причинную силу прутьев. Перевод сохраняет описанную связь, не добавляя богословского или естественно-научного объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно буквальной синтаксической близостью к еврейскому тексту. Термины животноводства переданы понятно для широкого читателя; повторяемость действия и неоднозначная роль прутьев сохранены.
