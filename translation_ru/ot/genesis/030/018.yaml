base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: ru
  text: 'Лия сказала: «Бог дал мне награду за то, что я отдала свою служанку мужу». И назвала его Иссахаром[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Иссахар» созвучно древнееврейскому слову, означающему «плата» или «награда», и отражает объяснение Лии.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Бог дал мне
  rationale: Глагол נתן передан обычным русским прошедшим временем; местоимение «мне» выражает суффикс первого лица в следующем слове שְׂכָרִי и делает фразу естественной.
- source_word: שְׂכָרִי
  choice: награду
  rationale: שָׂכָר может означать плату, вознаграждение или награду. «Награду» естественно звучит в данном контексте и сохраняет смысловую связь с именем Иссахар, пояснённую в сноске.
- source_word: אֲשֶׁר
  choice: за то, что
  rationale: В этой конструкции относительная частица выражает основание названной Лией награды. Русское «за то, что» ясно передаёт причинно-возмездную связь, не усиливая её сверх текста.
- source_word: נָתַתִּי שִׁפְחָתִי
  choice: я отдала свою служанку
  rationale: «Отдала» естественно передаёт совершённое действие נתן в данном брачном контексте. «Свою служанку» — современное и понятное обозначение женщины зависимого статуса; возвратное «свою» нормативно по-русски передаёт еврейский суффикс «мою» при подлежащем первого лица.
- source_word: לְאִישִׁי
  choice: мужу
  rationale: В контексте отношений Лии и Иакова אִישׁ означает «муж». Притяжательность уже однозначно определяется говорящей и по-русски не требует отдельного «моему».
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: И назвала его
  rationale: Еврейская формула наречения имени естественно передаётся русским «назвала его», при этом союз сохраняет последовательность повествования.
- source_word: יִשָּׂשכָר
  choice: Иссахар
  rationale: Использована укоренившаяся русская форма библейского имени; в косвенном падеже — «Иссахаром». Созвучие со שָׂכָר объясняется в сноске.
theological_decisions:
- issue: Оценка Лией рождения как Божьего воздаяния
  choice: Передать слова Лии прямо как её собственное объяснение Божьего действия.
  alternative: 'Смягчить возмездный смысл, например: «Бог даровал мне сына».'
  rationale: Текст сообщает толкование самой Лии и связывает его с понятием שָׂכָר. Перевод не должен ни подтверждать, ни критиковать её богословскую оценку и не должен устранять выраженную ею связь.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Сохранена конкретная речь Лии о награде и объяснена игра слов, которую невозможно полностью воспроизвести в основном тексте.
