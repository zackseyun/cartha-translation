  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: ru
  text: Тогда Бог вспомнил о Рахили[a], Бог услышал её[b] и открыл её утробу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратил внимание на Рахиль». Библейское выражение «Бог вспомнил» означает, что Он благосклонно обратил внимание и начал действовать, а не то, что прежде Он её забыл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внял ей», «выслушал её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: вспомнил о
  rationale: 'Сохраняет библейскую идиому: Бог обратил на Рахиль благосклонное внимание и вслед за этим начал действовать; речь не о том, что Он прежде её забыл.'
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Существительное сочетается здесь с глаголами в единственном числе и обозначает единого Бога.
- source_word: אֶת רָחֵל
  choice: о Рахили
  rationale: При русском глаголе «вспомнить» естественно управление с предлогом «о»; имя передано в принятой русской библейской форме.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: услышал её
  rationale: Оборот שׁמע с אֶל означает внимательное слышание, предполагающее отклик. «Услышал её» естественно по-русски и не уточняет сверх текста, каким именно был ответ.
- source_word: וַיִּפְתַּח
  choice: открыл
  rationale: Сохраняет конкретный глагол и образность еврейского выражения.
- source_word: רַחְמָהּ
  choice: её утробу
  rationale: Рֶחֶם означает материнскую утробу; буквальное выражение сохраняет библейскую идиому о даровании способности зачать.
- source_word: וַ
  choice: тогда / и
  rationale: Начальное «тогда» передаёт продвижение повествования, а последующие связи естественно выражены однородными сказуемыми без избыточного повторения союза.
theological_decisions:
- issue: Антропоморфное выражение о том, что Бог «вспомнил» Рахиль
  choice: Сохранить «вспомнил» в основном тексте как библейскую идиому благосклонного внимания, ведущего к действию.
  alternative: «обратил внимание на Рахиль» / «помнил о Рахили»
  rationale: Еврейский текст не предполагает, будто Бог прежде забыл Рахиль, однако замена идиомы поясняющим пересказом ослабила бы значимый библейский образ. Последующие слова об услышанной Рахили и открытой утробе раскрывают практический смысл Божьего «воспоминания».
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и лаконичности повествования. Библейские идиомы «вспомнил» и «открыл её утробу» оставлены в основном тексте; возможные смысловые пояснения вынесены в сноски.
