lexical_decisions:
- source_word: וַיָּשֶׂם דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: установил расстояние в три дня пути
  rationale: Буквально сочетание говорит о «пути трёх дней»; по-русски естественно передать его как меру расстояния, сохранив образ пути.
- source_word: רֹעֶה
  choice: пас
  rationale: Причастная форма описывает продолжавшееся занятие Иакова; в русском повествовании естественен прошедший несовершенный вид.
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: остальной скот Лавана
  rationale: צֹאן обозначает мелкий домашний скот или стадо; «скот» здесь понятно охватывает овец и коз, а форма הַנּוֹתָרֹת указывает на оставшуюся часть.
