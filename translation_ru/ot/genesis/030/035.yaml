base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: ru
  text: В тот же день он отделил полосатых[a] и пятнистых козлов, всех крапчатых и пятнистых коз — всех, у которых была белая окраска, — и всех тёмно-бурых[b] ягнят и передал их на попечение своим сыновьям[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опоясанных»; еврейское слово обозначает отметины в виде полос или перевязей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бурых»; еврейское слово обозначает тёмную, коричнево-бурую окраску.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «дал в руку своих сыновей» — то есть передал им под надзор и ответственность.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיָּסַר
  choice: он отделил
  rationale: В породе hifil глагол סור означает удалить или отделить животных от остального стада. «Отделил» естественно передаёт действие в данном контексте.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот же день
  rationale: Русское «в тот же день» естественно связывает действие с непосредственно предшествующей договорённостью; частица «же» передаёт повествовательную непосредственность, не меняя временного значения.
- source_word: הַתְּיָשִׁים
  choice: козлов
  rationale: תיש обозначает именно самца козы; «козлов» — точное и обычное современное русское слово.
- source_word: הָעֲקֻדִּים
  choice: полосатых
  rationale: Слово обозначает животных с полосами или перевязями на шерсти. «Полосатых» понятно современному читателю и не вводит излишне специального оттенка.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: пятнистых
  rationale: Обе формы одного прилагательного обозначают пёструю, пятнистую окраску; единообразный перевод сохраняет их лексическое тождество.
- source_word: הָעִזִּים
  choice: коз
  rationale: Обычное множественное число «козы» в противопоставлении предшествующим козлам естественно понимается как обозначение самок.
- source_word: הַנְּקֻדּוֹת
  choice: крапчатых
  rationale: Прилагательное указывает на мелкие точки или крапины. «Крапчатых» отличает этот рисунок от более крупных пятен, обозначенных טלאות.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: всех, на которых было белое
  rationale: Формулировка сохраняет распределительное значение כֹּל и буквально передаёт наличие белой окраски, не уточняя форму отметин.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: и всех тёмно-бурых овец
  rationale: חוּם обозначает бурый или тёмно-коричневый цвет. «Тёмно-бурых» передаёт оба оттенка значения. כְּשָׂבִים может обозначать овец или ягнят; более общее «овец» здесь естественно в описании стада и не навязывает возраст животных.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: и передал их на попечение своим сыновьям
  rationale: Буквально «дал в руку своих сыновей» — идиома передачи под власть, надзор или ответственность. Выбранный перевод ясно передаёт смысл порученной заботы.
