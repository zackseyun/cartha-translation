base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: ru
  text: 'И сказала Лия: «Бог одарил меня добрым даром. На этот раз мой муж окажет мне честь[a], потому что я родила ему шестерых сыновей». И назвала она его Завулоном.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет жить со мной». Древнееврейский глагол встречается редко и связан игрой слов с именем Завулон; его смысл может соединять представления о почёте и о том, что муж будет жить или оставаться с Лией.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: одарил меня добрым даром
  rationale: Повтор корня передан однокоренными словами «одарил» и «даром»; это сохраняет выразительную игру слов и остаётся естественным по-русски.
- source_word: הַפַּעַם
  choice: теперь
  rationale: В данном контексте надежды Лии русское «теперь» естественно передаёт значение «на этот раз / теперь».
- source_word: יִזְבְּלֵנִי
  choice: будет чтить меня
  rationale: Редкий глагол, вероятно, выражает надежду Лии на почёт и признание со стороны мужа. Краткая формулировка сохраняет направленность действия на Лию; возможное значение «будет жить со мной» вынесено в сноску.
- source_word: אִישִׁי
  choice: мой муж
  rationale: В брачном контексте это ясный и естественный русский эквивалент.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: я родила ему шестерых сыновей
  rationale: Переданы и материнское действие, и косвенное дополнение לוֹ; форма «шестерых» нормативна при обозначении лиц мужского пола.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: И назвала она его Завулоном
  rationale: Естественно передаёт древнееврейскую формулу наречения имени, сохраняя повествовательный порядок и традиционную русскую форму имени.
- source_word: זְבֻלוּן
  choice: Завулон
  rationale: Использована устоявшаяся в русской библейской традиции форма личного имени.
theological_decisions:
- issue: Смысл редкого глагола יִזְבְּלֵנִי
  choice: будет чтить меня
  alternative: будет жить со мной
  rationale: Контекст шести рождённых сыновей поддерживает ожидание большего почёта со стороны Иакова, однако редкость глагола и его связь с именем Завулон не позволяют исключить значение совместного проживания; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Игра слов זבד / זֵבֶד передана сочетанием «одарил… даром», а неполностью воспроизводимая связь יִזְבְּלֵנִי с именем Завулон пояснена в сноске.
