base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: ru
  text: И услышал Бог Лию[a], и она зачала и родила Иакову пятого сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внял Бог Лии».'
    reason: Лексическая альтернатива передаёт возможный в שׁמע אֶל оттенок внимательного, благосклонного слушания.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: Глагол שׁמע с אֶל здесь обозначает не просто слуховое восприятие, а благосклонное внимание, за которым следует ответ. Русское «услышал» естественно передаёт оба оттенка в контексте молитвы или обращения к Богу.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В повествовательном контексте אֱלֹהִים обозначает единого Бога; нормативный русский эквивалент — «Бог».
- source_word: אֶל לֵאָה
  choice: Лию
  rationale: При русском глаголе «услышать» предложное управление еврейского оборота естественно передаётся прямым дополнением. Имя לֵאָה дано в принятой русской библейской форме «Лия».
- source_word: וַתַּהַר
  choice: она зачала
  rationale: «Зачала» кратко, точно и соответствует стилю повествований о рождении.
- source_word: וַתֵּלֶד
  choice: и родила
  rationale: Обычный современный и литературный эквивалент ילד в данном контексте.
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: 'Дательный падеж естественно сохраняет значение еврейского לְ: Лия родила сына Иакову.'
- source_word: בֵּן חֲמִישִׁי
  choice: пятого сына
  rationale: Порядковое числительное относится к сыну и указывает, что это пятый сын, рождённый Лией Иакову.
theological_decisions:
- issue: Характер Божьего ответа в выражении וַיִּשְׁמַע אֱלֹהִים אֶל לֵאָה
  choice: «услышал Бог Лию» — услышал благосклонно и ответил
  alternative: «внял Бог Лии»
  rationale: Еврейское שׁמע с אֶל может подразумевать внимательное, действенное слушание. «Услышал» сохраняет простоту исходного глагола и не устраняет возможную смысловую глубину; контекст последующего зачатия показывает ответ Бога.
translation_notes:
  register: Современный литературный русский с традиционными русскими формами библейских имён. Синтаксис сохраняет краткость еврейского повествования; двоеточие естественно выражает связь между тем, что Бог услышал Лию, и последовавшим зачатием.
