base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: ru
  text: 'И назвала она его Иосифом[a], сказав: «Пусть Яхве прибавит мне ещё одного сына».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Иосиф» созвучно еврейскому глаголу со значением «пусть прибавит» или «он прибавляет».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: И назвала она его
  rationale: Естественно передаёт еврейскую формулу наречения имени; буквальное «назвала его имя» в современном русском звучит неестественно.
- source_word: יוֹסֵף
  choice: Иосифом
  rationale: Использована устоявшаяся русская библейская форма имени; творительный падеж требуется после «назвала».
- source_word: לֵאמֹר
  choice: сказав
  rationale: Стандартно вводит прямую речь и сохраняет связь с предшествующим действием.
- source_word: יֹסֵף
  choice: Пусть ... прибавит
  rationale: Форма от יסף в данном контексте выражает пожелание или молитвенную просьбу и создаёт игру слов с именем Иосиф.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, присутствующее в еврейском тексте, а не заменяет его титулом.
- source_word: לִי
  choice: мне
  rationale: Естественный русский эквивалент дательного отношения при глаголе «прибавить».
- source_word: בֵּן אַחֵר
  choice: ещё одного сына
  rationale: Точно передаёт значение «другого, дополнительного сына» и естественно звучит по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» непосредственно передаёт имя и не подменяет его титулом.
- issue: Модальность יֹסֵף
  choice: Пусть Яхве прибавит
  alternative: Яхве прибавит; Яхве прибавил
  rationale: Контекст наречения имени допускает оттенок пожелания или молитвы; выбранная конструкция сохраняет эту модальность, не превращая слова Рахили ни в однозначное предсказание, ни в утверждение о прошлом.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной простоты повествования. Инверсия «назвала она» умеренно подчёркивает библейский повествовательный ритм, не делая фразу архаичной.
