  source_fidelity: Текст точно передаёт еврейскую конструкцию наречения имени и смысл последующей мотивирующей реплики. «Назвала она его Иосифом» естественно передаёт идиому «назвала его имя», не внося лишнего смысла. «Пусть Яхве прибавит мне ещё одного сына» обоснованно сохраняет желательное значение יֹסֵף и точно передаёт בֵּן אַחֵר.
