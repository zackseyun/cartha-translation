base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: ru
  text: 'И сказала Рахиль: «Бог рассудил моё дело, услышал мой голос и дал мне сына». Поэтому она назвала его Даном[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Дан созвучно еврейскому глаголу со значением «судить», «рассудить».
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  choice: рассудил моё дело
  rationale: Передаёт судебный оттенок формы от דין с суффиксом 1-го лица и в данном контексте указывает на решение Бога в пользу Рахили, не усиливая смысл до безусловного «оправдал».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на форму множественного числа существительного, глагол стоит в единственном числе, а в повествовании имеется в виду единый Бог.
- source_word: שָׁמַע בְּקֹלִי
  choice: услышал мой голос
  rationale: Сохраняет образное выражение еврейского текста и естественно звучит по-русски.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: и дал мне сына
  rationale: Прямо передаёт נתן с косвенным дополнением и существительное בן, обозначающее именно сына.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Естественно и кратко вводит объяснение данного имени.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: она назвала его Даном
  rationale: Современная русская формула именования естественнее буквального «нарекла имя ему Дан»; творительный падеж после «назвала» нормативен.
- source_word: דָּן
  choice: Дан
  rationale: Традиционная русская передача имени, сохраняющая доступную для пояснения связь с еврейским глаголом דין.
theological_decisions:
- issue: Смысл слов Рахили о судебном действии Бога
  choice: Бог рассудил моё дело
  alternative: Бог судил меня; Бог оправдал меня
  rationale: Выбранная формулировка сохраняет судебную метафору и допускает благоприятное для Рахили решение, явное из контекста, но не вносит более сильного богословского понятия оправдания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Союзы исходного текста в речи Рахили сохранены, но формула именования передана естественно для русского языка.
