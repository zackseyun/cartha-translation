lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Тогда она отдала
  rationale: Последовательная форма с וַ־ продвигает повествование; «тогда» естественно передаёт связь с предшествующим решением Рахили.
- source_word: לּוֹ
  choice: ему
  rationale: Дательный падеж естественно передаёт еврейское предложное местоимение при глаголе «отдать».
- source_word: בִּלְהָה
  choice: Валлу
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; винительный падеж обусловлен синтаксисом.
- source_word: שִׁפְחָתָהּ
  choice: свою служанку
  rationale: שִׁפְחָה обозначает женщину-служанку зависимого, подчинённого положения. «Служанка» понятно современному читателю и не устраняет более жёсткую социальную окраску, отмеченную в сноске.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Оборот передаёт установление брачного или наложнического союза, сохраняя формулировку самого текста без дополнительного правового толкования.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: вошёл к ней
  rationale: Сохранён сдержанный еврейский эвфемизм, который в данном контексте означает половую близость.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Использована общепринятая русская библейская форма имени.
theological_decisions:
- issue: Статус Валлы в выражении לְאִשָּׁה
  choice: в жёны
  alternative: как жену; в наложницы
  rationale: Буквальное «в жёны» сохраняет заявленный текстом характер союза и не сводит его безоговорочно к более узкой категории наложничества.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан естественным для повествования; традиционные формы имён сохранены. Эвфемизм оригинала не раскрыт в основном тексте более явно, чем в еврейском.
