  text: 'Тогда он сказал: «Назначь себе плату[a], и я дам её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Назови, сколько я должен тебе заплатить».'
    reason: 'Передаёт возможное идиоматическое понимание נָקְבָה שְׂכָרְךָ עָלַי: Иакову предлагается точно определить плату, обязательство по которой принимает на себя Лаван.'
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Тогда он сказал
  rationale: Последовательная форма с וַ передвигает повествование вперёд; «тогда» естественно передаёт смену реплики в современном русском языке.
- source_word: נָקְבָה
  choice: Назови
  rationale: Глагол נקב здесь означает ясно назвать или определить условие. В сочетании с платой русское «назови» кратко и естественно передаёт это значение.
- source_word: שְׂכָרְךָ
  choice: свою плату
  rationale: Существительное שָׂכָר в данном контексте обозначает вознаграждение за труд. «Плата» сохраняет единственное число еврейского текста и звучит естественно применительно к договорённости между Лаваном и Иаковом.
- source_word: עָלַי
  choice: передано контекстом и раскрыто в сноске
  rationale: Буквально «на мне» указывает на плату, обязательство по которой принимает говорящий. Дословное воспроизведение было бы неестественным по-русски; значение отражено притяжательной конструкцией и пояснено альтернативным переводом.
- source_word: וְאֶתֵּנָה
  choice: и я дам её
  rationale: Форма выражает обещание дать названную плату. Местоимение «её» согласовано с русским существительным «плата» и сохраняет обычное значение глагола נתן — «дать».
