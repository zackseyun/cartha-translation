reference: Genesis 30:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: ru
  text: Когда Лия увидела, что перестала рожать[a], она взяла свою служанку[b] Зелфу и отдала её Иакову в жёны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «остановилась от рождения [детей]»; то есть прекратила рожать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабыню».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Когда Лия увидела
  rationale: Последовательная форма с וַ продвигает повествование, а придаточное с «когда» естественно передаёт временную связь с последующим действием.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что поняла Лия, а не причину её действия.
- source_word: עָמְדָה מִלֶּדֶת
  choice: перестала рожать
  rationale: Сочетание עמד с מן и инфинитивом означает прекращение действия; по-русски это естественно передаётся как «перестала рожать».
- source_word: שִׁפְחָתָהּ
  choice: свою служанку
  rationale: שִׁפְחָה обозначает зависимую женщину-служанку или рабыню. «Служанка» понятно современному читателю, а возможный более жёсткий социальный оттенок отмечен в сноске.
- source_word: זִלְפָּה
  choice: Зелфу
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: Дательный падеж естественно передаёт адресата действия в этой конструкции.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Оборот נתן ל... לאשה является брачной формулой; «отдала … в жёны» сохраняет явное брачное значение и звучит естественно по-русски.
theological_decisions:
- issue: Положение Зелфы в доме и брачный характер передачи Иакову
  choice: «служанку» и «отдала её Иакову в жёны»
  alternative: «рабыню»; либо «наложницей» вместо «в жёны»
  rationale: Текст одновременно называет Зелфу שִׁפְחָה, то есть зависимой служанкой/рабыней Лии, и использует явное לְאִשָּׁה — «в жёны». Поэтому перевод не устраняет ни её подчинённого положения, ни брачной формулировки и не вводит отсутствующий здесь специальный термин «наложница».
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным синтаксисом. Сохранены традиционные русские формы библейских имён «Лия», «Зелфа» и «Иаков»; архаизмы и конфессионально нагруженные уточнения не вводятся.
