  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: ru
  text: И возник спор между пастухами стад Аврама и пастухами стад Лота. В то время в земле жили хананеи и фереззеи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי רִיב
  choice: И возник раздор
  rationale: Конструкция вводит новое событие, а רִיב обозначает спор, ссору или конфликт. «Возник раздор» естественно передаёт начало противостояния и сохраняет его серьёзность.
- source_word: רֹעֵי מִקְנֵה
  choice: пастухами скота
  rationale: רֹעֵי — люди, пасущие животных, а מִקְנֶה охватывает домашний скот в широком смысле. Сочетание не сужает значение до одних овец.
- source_word: בֵּין ... וּבֵין
  choice: между ... и
  rationale: Парная конструкция ясно разграничивает две стороны конфликта.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: А ханаанеи и фереззеи
  rationale: Еврейские этнонимы стоят в единственном числе, но имеют собирательное значение. В современном русском множественное число ясно и естественно передаёт речь о народах, а не о двух отдельных людях.
- source_word: אָז יֹשֵׁב
  choice: тогда жили
  rationale: אָז задаёт время, а причастие יֹשֵׁב описывает продолжавшееся пребывание. Русское «тогда жили» передаёт оба компонента без неестественной тяжеловесности.
- source_word: בָּאָרֶץ
  choice: в той земле
  rationale: «Земля» сохраняет характерную для Бытия географическую и возможную заветную окраску; указательное «той» естественно передаёт определённость и отсылает к уже названной земле.
theological_decisions:
- issue: Возможный заветный оттенок הָאָרֶץ
  choice: в той земле
  alternative: в той стране
  rationale: «Земля» сохраняет важную для повествования Бытия лексику, не добавляя богословского толкования, которого сам стих прямо не выражает.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным звучанием. Лексика конкретна и доступна; синтаксический параллелизм первой фразы сохранён.
