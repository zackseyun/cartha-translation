  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: ru
  text: Аврам двинулся со своим шатром, пришёл и поселился у дубов Мамре[a], которые находятся в Хевроне, и построил там жертвенник Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у теребинтов Мамре»; еврейское слово может обозначать крупные деревья, например дубы или теребинты.'
    reason: lexical_alternative
  - marker: b
    text: Яхве — передача еврейского имени יהוה; по традиции его также переводят как «ГОСПОДЬ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: двинулся со своим шатром
  rationale: Глагол от אהל описывает передвижение с шатром или перемещение стоянки. Такой перевод естественно передаёт начало пути и не дублирует последующие «пришёл и поселился».
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычный глагол движения; сохраняет последовательность повествования без добавочного толкования.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: Передаёт пребывание на новом месте современным литературным языком; «жил» слабее выражает устройство стоянки, а «обитал» звучит архаичнее.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: у дубов Мамре
  rationale: Предлог допускает локативное «у», а אֵלֹנֵי обозначает крупные деревья, обычно понимаемые как дубы или терпентинные деревья. В основном тексте выбран ясный традиционный вариант, а видовая неопределённость отмечена в сноске.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: что в Хевроне
  rationale: Кратко и естественно передаёт относительную конструкцию, указывающую местонахождение дубов Мамре.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: и построил там жертвенник
  rationale: Сохраняет действие, указание места и обычное библейское значение מִזְבֵּחַ.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל передан русским дательным отношением после «построил жертвенник», а тетраграмматон воспроизведён как личное имя «Яхве».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДУ
  rationale: В еврейском тексте стоит собственное божественное имя, поэтому в основном тексте оно передано непосредственно. Традиционная замена титулом «ГОСПОДЬ» указана в сноске, не смешивая имя с титулом.
- issue: Определение деревьев в אֵלֹנֵי מַמְרֵא
  choice: дубы Мамре
  alternative: терпентинные деревья Мамре
  rationale: Точный ботанический вид, обозначенный еврейским словом, не вполне определён. Читаемый основной вариант сопровождается сноской, сохраняющей лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность еврейского повествования, но избегает неестественной буквальности и устаревшей лексики.
