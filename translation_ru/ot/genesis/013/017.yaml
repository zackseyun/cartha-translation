  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: ru
  text: Встань, пройдись по земле вдоль и поперёк, ибо Я отдам её тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּם
  choice: Встань
  rationale: Повелительная форма глагола קום прямо побуждает подняться; «встань» естественно и точно передаёт силу команды.
- source_word: הִתְהַלֵּךְ
  choice: пройди
  rationale: Порода хитпаэль глагола הלך здесь обозначает хождение по территории; вместе с указанием длины и ширины «пройди» передаёт движение по всей земле без излишне разговорного оттенка.
- source_word: בָּאָרֶץ
  choice: по земле
  rationale: В данном контексте אֶרֶץ означает конкретную землю, показанную Авраму, а предлог ב при глаголе движения естественно передаётся по-русски как «по».
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: во всю её длину и ширину
  rationale: Парное выражение называет оба измерения территории и тем самым указывает на весь её простор; перевод сохраняет оба существительных и звучит естественно по-русски.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного повеления; «потому что» ясно сохраняет причинную связь.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: Я отдам её тебе
  rationale: Форма נתן выражает обещанное будущее действие, местоименный суффикс женского рода относится к земле, а לְךָ обозначает получателя.
theological_decisions:
- issue: К чему относится местоименный суффикс женского рода в אֶתְּנֶנָּה
  choice: «её» относится к земле
  alternative: 'Передать объект неявно: «дам тебе»'
  rationale: Женский суффикс 3-го лица единственного числа грамматически соотносится с אֶרֶץ и подчёркивает, что предмет обещанного дара — названная земля, без добавления дальнейшего толкования.
translation_notes:
  register: Современный литературный русский язык; прямое и торжественное, но не архаичное обращение. Порядок слов сохраняет последовательность повеления и обетования.
