  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: ru
  text: 'Лот поднял глаза и увидел всю Иорданскую равнину[a]: вся она была хорошо орошена — до того, как Яхве уничтожил Содом и Гоморру, — словно сад Яхве[b], словно земля Египта, по направлению к Цоару[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю долину Иордана»; буквальнее: «весь округ Иордана».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сад Яхве», вероятно, напоминает о плодородии и изобилии Эдема.
    reason: cross_reference
  - marker: c
    text: 'Или: «когда идёшь к Цоару». Еврейский оборот указывает направление к Цоару.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: поднял глаза
  rationale: Сохранён понятный по-русски еврейский оборот, обозначающий направление взгляда.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: всю Иорданскую равнину
  rationale: כִּכָּר обозначает округлую равнинную область; «Иорданская равнина» естественно передаёт географический смысл, а буквальный оттенок отмечен в сноске.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: вся она была хорошо орошена
  rationale: מַשְׁקֶה описывает местность, обильно обеспеченную водой. Двоеточие естественно связывает увиденную местность с её характеристикой, не вынуждая выбирать между пояснительным «что» и причинным «ведь» для כִּי.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: до того, как Яхве уничтожил
  rationale: לִפְנֵי выражает временное предшествование, а שׁחת здесь означает разрушение Содома и Гоморры.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, без замены титулом.
- source_word: כְּגַן יְהוָה
  choice: словно сад Яхве
  rationale: Сохранено сравнение и его вероятная отсылка к Эдему; современное «словно» звучит естественно и достойно.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: словно земля Египетская
  rationale: Слово אֶרֶץ сохранено, чтобы сравнение оставалось географическим; словопорядок соответствует литературной русской библейской речи.
- source_word: בֹּאֲכָה צֹעַר
  choice: по направлению к Цоару
  rationale: Еврейская формула указывает направление или приближение к Цоару; безличная русская передача избегает неуместного прямого обращения к читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Образ «сада Яхве»
  choice: сохранить выражение без вставки «Эдем» в основной текст
  alternative: словно Эдемский сад
  rationale: Текст прямо говорит «сад Яхве», вероятно вызывая в памяти Эдем, но не называет его здесь по имени. Сноска поясняет вероятную связь, не превращая её в явное утверждение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образные повторы «словно… словно…» и временная оговорка о будущем уничтожении городов. Пунктуация проясняет синтаксис длинного еврейского предложения, не устраняя неоднозначность כִּי посредством явного причинного или изъяснительного союза.
