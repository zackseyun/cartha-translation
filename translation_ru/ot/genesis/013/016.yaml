base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: ru
  text: 'И сделаю твоё потомство[a] столь же многочисленным, как прах земной: если человек[b] сможет сосчитать прах земной, то и твоё потомство можно будет сосчитать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоё семя» или «твои потомки»; еврейское זֶרַע — собирательное существительное, обозначающее потомство.'
    reason: lexical_alternative
  - marker: b
    text: То есть кто-нибудь; еврейское слово стоит в форме мужского рода единственного числа, но употреблено в обобщённом значении.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: И сделаю
  rationale: В сочетании с прямым дополнением и сравнением глагол שׂוּם имеет смысл «сделать [таким]»; этот вариант естественен по-русски и сохраняет причинный оттенок.
- source_word: זַרְעֲךָ
  choice: твоё потомство
  rationale: זֶרַע здесь — собирательное существительное, обозначающее потомков Аврама. «Потомство» сохраняет собирательное единственное число и не придаёт стиху искусственно узкого единичного смысла.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: как прах земной
  rationale: Передаёт явное сравнение и традиционный библейский образ; «прах» уместен в возвышенной, но понятной современной речи.
- source_word: אֲשֶׁר אִם
  choice: если
  rationale: В данном построении выражение вводит условное сравнение; русская конструкция с двоеточием и «если… то…» ясно передаёт эту связь без неестественной буквальности.
- source_word: אִישׁ
  choice: человек
  rationale: Существительное употреблено в обобщённом значении. Русское «человек» естественно сохраняет форму единственного числа и родовое значение исходного текста.
- source_word: לִמְנוֹת
  choice: сосчитать
  rationale: Глагол означает перечислить, определить число. Совершенный вид естественен после «сможет» и соответствует образу полного подсчёта.
- source_word: גַּם
  choice: и
  rationale: В конструкции «то и» частица естественно выражает соответствие между возможностью сосчитать прах и потомство.
- source_word: יִמָּנֶה
  choice: можно будет сосчитать
  rationale: Страдательно-безличная конструкция передаёт нифаль и условную возможность, а не предсказание фактического подсчёта.
theological_decisions:
- issue: Передача собирательного существительного זֶרַע в обещании Авраму
  choice: твоё потомство
  alternative: твоё семя; твои потомки
  rationale: «Потомство» сохраняет собирательный характер слова и говорит о бесчисленном множестве будущих потомков, не навязывая стиху исключительно единичное или специально мессианское прочтение.
- issue: Обобщённое употребление אִישׁ
  choice: человек
  alternative: кто-нибудь; всякий
  rationale: «Человек» точно и естественно передаёт грамматически мужскую форму единственного числа с обобщённым значением, не ограничивая смысл только мужчинами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Сохранены повтор «прах земной» и условная логика оригинала; порядок слов сделан естественным для русского языка.
