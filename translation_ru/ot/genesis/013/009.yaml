base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: ru
  text: Не вся ли земля перед тобой? Прошу, отделись от меня. Если ты пойдёшь налево[a], то я пойду направо; а если ты пойдёшь направо, то я пойду налево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте условные обороты кратки и не содержат глагола: буквально: «если налево, то я направо; а если направо, то я налево». Для ясности в переводе добавлено «ты пойдёшь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Не вся ли
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; русская конструкция с «ли» естественно передаёт эту силу.
- source_word: כָל הָאָרֶץ
  choice: вся земля
  rationale: В контексте речь идёт о всей доступной для поселения земле, а не обо всей планете; «вся земля» сохраняет образ и контекстуальный смысл.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: 'Сохранён пространственный образ: земля лежит перед Лотом и доступна ему для выбора.'
- source_word: הִפָּרֶד נָא מֵעָלַי
  choice: Прошу, отделись от меня
  rationale: Niphal-императив передан возвратным глаголом «отделись», а вежливая частица נָא — словом «прошу».
- source_word: אִם הַשְּׂמֹאל
  choice: Если ты пойдёшь налево
  rationale: В еврейском условная фраза эллиптична; глагол движения восполнен по контексту для ясного и естественного русского синтаксиса.
- source_word: וְאֵימִנָה
  choice: то я пойду направо
  rationale: Направительная форма от ימין обозначает движение вправо; «пойду направо» ясно передаёт противопоставление.
- source_word: וְאִם הַיָּמִין
  choice: а если ты пойдёшь направо
  rationale: Эллипсис восполнен тем же глаголом движения, чтобы сохранить параллелизм и сделать фразу понятной.
- source_word: וְאַשְׂמְאִילָה
  choice: то я пойду налево
  rationale: Направительная форма от שׂמאל передаёт ответное движение Аврама в противоположную сторону; выбран симметричный русский оборот.
