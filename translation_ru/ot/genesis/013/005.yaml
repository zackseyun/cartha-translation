  text: И у Лота, который шел вместе с Аврамом, тоже были мелкий и крупный скот и шатры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: И ... тоже
  rationale: Сочетание союза и частицы связывает стих с предыдущим повествованием и подчёркивает, что Лот также обладал имуществом.
- source_word: לְלוֹט ... הָיָה
  choice: у Лота ... были
  rationale: Предлог לְ в сочетании с глаголом бытия выражает обладание; русская конструкция «у Лота были» естественно и близко передаёт еврейский оборот.
- source_word: הַהֹלֵךְ אֶת־אַבְרָם
  choice: который ходил с Аврамом
  rationale: Причастие характеризует Лота как сопровождавшего Аврама; «ходил с» сохраняет длительный характер действия и естественно звучит в повествовании.
- source_word: צֹאן
  choice: стада мелкого скота
  rationale: Слово обозначает мелкий домашний скот, прежде всего овец и коз; такой перевод точнее простого «овцы» и сохраняет собирательное значение.
- source_word: וּבָקָר
  choice: и крупного скота
  rationale: בָּקָר обозначает крупный рогатый скот; в паре с צֹאן естественно передаётся как «крупный скот».
- source_word: וְאֹהָלִים
  choice: и шатры
  rationale: Множественное число прямо обозначает шатры как жилища Лота и его многочисленного домашнего хозяйства.
