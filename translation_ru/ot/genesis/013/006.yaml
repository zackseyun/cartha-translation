  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: ru
  text: Земля не могла вместить их, чтобы им жить вместе, потому что имущества у них было так много, что они не могли жить вместе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: вместить
  rationale: Глагол буквально означает «нести» и в данном контексте передаёт способность земли обеспечивать пространство и ресурсы для многочисленных стад обоих хозяев. «Вместить» сохраняет образ земли как не способной удержать их совместное хозяйство.
- source_word: רְכוּשׁ
  choice: имущество
  rationale: Слово обозначает нажитое достояние, здесь прежде всего скот и прочее хозяйственное имущество; общее «имущество» не сужает значение.
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: жить вместе
  rationale: В данном повествовательном контексте речь идёт о совместном проживании на одной территории, поэтому естественное современное выражение «жить вместе» точнее стилистически, чем буквальное «сидеть вместе».
