base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: ru
  text: И Лот выбрал себе всю равнину Иордана и Лот двинулся на восток[a]. И они отделились друг от друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с востока». Еврейское выражение может указывать как на направление движения, так и на исходную точку.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: выбрал себе
  rationale: Глагол בחר означает «выбирать», а дательный оборот לוֹ подчёркивает, что Лот сделал выбор для себя; русское «выбрал себе» передаёт это естественно.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: всю Иорданскую равнину
  rationale: כִּכָּר здесь обозначает равнинную область в районе Иордана. «Иорданская равнина» ясно и естественно передаёт географический смысл, не навязывая более узкого современного термина.
- source_word: וַיִּסַּע
  choice: двинулся
  rationale: נסע в повествовательном контексте означает сняться с места и отправиться в путь. «Двинулся» кратко и естественно передаёт начало перемещения.
- source_word: מִקֶּדֶם
  choice: на восток
  rationale: Контекстуально вероятнее всего выражение указывает направление движения Лота. Морфологически возможно и значение исходной точки — «с востока», поэтому оно вынесено в примечание.
- source_word: וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
  choice: они отделились друг от друга
  rationale: Нифаль глагола פרד выражает взаимное разделение, а идиома אִישׁ...אָחִיו буквально говорит о разделении одного с братом. В данном контексте естественное русское «друг от друга» сохраняет взаимный смысл без неясной буквальности.
theological_decisions:
- issue: Родственное обозначение אָחִיו («его брат») в распределительной идиоме
  choice: друг от друга
  alternative: один от брата своего
  rationale: Речь идёт об Авраме и Лоте как родственниках, однако буквальная конструкция по-русски звучит неестественно и может ошибочно представить их родными братьями. Взаимное «друг от друга» точно передаёт функцию всей еврейской идиомы.
- issue: Неоднозначность направления מִקֶּדֶם
  choice: на восток
  alternative: с востока
  rationale: Основной текст следует наиболее связному в данном контексте направительному пониманию, но допустимое исходное значение сохранено в примечании, чтобы не скрывать неоднозначность еврейского текста.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и достойное по тону. Синтаксис упрощён ровно настолько, чтобы стих звучал естественно, при сохранении последовательности действий и смысловой неоднозначности מִקֶּדֶם.
