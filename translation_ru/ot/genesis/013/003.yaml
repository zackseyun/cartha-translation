base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: ru
  text: И он шёл из Негева до Вефиля[a], двигаясь от стоянки к стоянке, — до места, где прежде стоял его шатёр, между Вефилем и Гаем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по своим переходам», то есть двигаясь последовательно от одной стоянки к другой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И он переходил
  rationale: Глагол הלך обозначает движение; в сочетании с לְמַסָּעָיו здесь передаёт последовательное продвижение по маршруту.
- source_word: לְמַסָּעָיו
  choice: стоянками
  rationale: Множественное מַסָּע может обозначать этапы пути, связанные со снятием лагеря. «Переходил стоянками» естественно передаёт движение от одной стоянки к другой; альтернативный смысл отмечен в сноске.
- source_word: מִנֶּגֶב
  choice: из Негева
  rationale: В данном географическом контексте נֶגֶב обозначает регион Негев, а не просто направление «юг».
- source_word: וְעַד בֵּית אֵל
  choice: до Вефиля
  rationale: עַד указывает на предел пути; традиционная русская форма топонима — «Вефиль».
- source_word: עַד הַמָּקוֹם
  choice: до того места
  rationale: Повтор עַד уточняет конечный пункт, указывая на конкретное прежнее место стоянки.
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: где прежде стоял его шатёр
  rationale: Русское «где» естественно включает значение שָׁם, а «стоял шатёр» идиоматично описывает его прежнее расположение.
- source_word: בַּתְּחִלָּה
  choice: прежде
  rationale: Слово отсылает к более ранней стоянке Аврама. «Прежде» звучит естественно и не создаёт впечатления абсолютного начала.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: между Вефилем и Гаем
  rationale: Конструкция בֵּין ... וּבֵין обозначает положение между двумя местами; использованы традиционные русские формы библейских топонимов.
