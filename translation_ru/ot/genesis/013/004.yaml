lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: место жертвенника
  rationale: Сохраняет конкретное указание на ранее упомянутый жертвенник и естественно продолжает движение, описанное в предыдущем стихе.
- source_word: אֲשֶׁר עָשָׂה שָׁם בָּרִאשֹׁנָה
  choice: который он прежде устроил там
  rationale: Глагол עשה буквально означает «сделал», но применительно к жертвеннику современное русское «устроил» звучит естественнее; «прежде» точно указывает на более раннее пребывание Аврама в этом месте.
- source_word: וַיִּקְרָא שָׁם אַבְרָם
  choice: И там Аврам призвал
  rationale: Повтор наречия «там» сохранён вслед за еврейским текстом ради пространственного акцента; имя передано в принятой русской форме «Аврам».
- source_word: בְּשֵׁם יְהוָה
  choice: имя Яхве
  rationale: В сочетании с קרא выражение допускает призывание Бога, провозглашение его имени и богослужебное обращение. Формулировка «призвал имя» сохраняет библейскую образность, а неоднозначность разъясняется в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а традиционная замена титулом отмечена в сноске.
theological_decisions:
- issue: Значение выражения קרא בשם יהוה
  choice: призвал имя Яхве
  alternative: воззвал к Яхве; провозгласил имя Яхве; призвал Яхве по имени
  rationale: Еврейская идиома может обозначать как молитвенное призывание, так и публичное провозглашение имени. Основной текст не сужает её до одного действия, а сноска сохраняет спектр значений.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное божественное имя, а не титул. Транслитерация «Яхве» отражает наиболее распространённую научную реконструкцию произношения; традиционные варианты указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет связь с предыдущим стихом, а повтор «там» — повествовательный акцент оригинала.
