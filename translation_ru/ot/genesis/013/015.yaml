base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: ru
  text: Всю землю, которую ты видишь, Я дам тебе и твоему потомству[a] навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семени». Еврейское זֶרַע — собирательное существительное, которое может означать «семя», «потомство» или «потомки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: не передано отдельным словом
  rationale: Здесь частица вводит пояснение к повелению осмотреть землю в предыдущем стихе. В русском отдельное «ибо» звучало бы тяжеловесно, а причинно-следственная связь достаточно ясна из контекста.
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: Винительный падеж естественно передаёт объект глагола «дам», а «всю» сохраняет полноту охвата.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: которую ты видишь
  rationale: Прямой и естественный перевод относительного оборота; настоящее время соответствует контексту восприятия.
- source_word: לְךָ
  choice: тебе
  rationale: Предлог ל при נתן обозначает получателя; русский дательный падеж передаёт это естественно.
- source_word: אֶתְּנֶנָּה
  choice: Я дам
  rationale: Имперфект в контексте Божьего обещания выражает будущее действие. Местоимение «Я» сохраняет акцент, заложенный личной формой глагола.
- source_word: וּלְזַרְעֲךָ
  choice: и твоему потомству
  rationale: «Потомство» — современное собирательное существительное, сохраняющее коллективный характер זֶרַע и не уточняющее число потомков.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткий, литературный и понятный эквивалент со значением непрекращающейся или бессрочной длительности.
theological_decisions:
- issue: Продолжительность обещания земли в выражении עַד עוֹלָם
  choice: навеки
  alternative: навсегда; на вечные времена
  rationale: «Навеки» сохраняет полную силу обещания и не навязывает читателю конкретную эсхатологическую или заветную схему.
- issue: Коллективное значение זֶרַע
  choice: потомству
  alternative: семени; потомкам
  rationale: «Потомству» сохраняет собирательную форму и присущую еврейскому слову неоднозначность между единством рода и множеством потомков; толкование не конкретизируется.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Порядок слов слегка выдвигает объект обещания вперёд, следуя еврейскому акценту; архаизмы сведены к минимуму. Местоимение «Я» написано с прописной буквы по русской библейской издательской традиции.
