  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: ru
  text: Аврам поднялся из Египта в Негев вместе с женой, со всем, что у него было, и с Лотом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на юг». Еврейское слово «Негев» может обозначать как южную область, называемую Негевом, так и юг или южную землю вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Сохраняет обычное значение глагола עלה — «подниматься, восходить» — и библейское представление о пути из Египта в землю Ханаана как о движении вверх; более точное соответствие, чем нейтральное «вышел».
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Прямо передаёт предлог מן и название страны.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: он, его жена
  rationale: Самостоятельное местоимение הוּא подчёркивает и уточняет состав отправившихся; перечисление естественно звучит по-русски.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: всё, что у него было
  rationale: Сохраняет широту выражения, которое может охватывать не только имущество, и не сужает его до одних материальных владений.
- source_word: וְלוֹט עִמּוֹ
  choice: и Лот вместе с ним
  rationale: Передаёт присоединённое к перечислению указание на Лота как спутника Аврама.
- source_word: הַנֶּגְבָּה
  choice: в Негев
  rationale: Передаёт направительный суффикс и вероятное географическое значение נֶגֶב как названия южной области; альтернативное общее значение «на юг» сохранено в сноске.
