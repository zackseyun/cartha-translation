  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: ru
  text: Аврам[a] был очень богат скотом, серебром и золотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Аврам был очень богат скотом, серебром и золотом».'
    reason: Начальный еврейский союз ו может быть передан словом «и», но также может лишь отмечать продолжение повествования и не выражаться отдельным словом по-русски.
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Аврам
  rationale: Имя передано в принятой русской библейской форме. Начальный ו связывает стих с повествованием, но в современном русском не требует обязательного союза «и».
- source_word: כָּבֵד מְאֹד
  choice: был очень богат
  rationale: Буквально כָּבֵד означает «тяжёлый, весомый», но при перечислении имущества идиоматически выражает большое богатство; מְאֹד передано усилителем «очень».
- source_word: בַּ/מִּקְנֶה
  choice: скотом
  rationale: מִקְנֶה здесь обозначает прежде всего домашний скот — стада и отары; русский творительный падеж естественно выражает то, чем Аврам был богат.
- source_word: בַּ/כֶּסֶף
  choice: серебром
  rationale: Сохраняется конкретное обозначение вида богатства; творительный падеж соответствует русскому управлению при «богат».
- source_word: וּ/בַ/זָּהָב
  choice: и золотом
  rationale: Союз и параллельное перечисление последней категории богатства сохранены естественным русским оборотом.
theological_decisions: []
