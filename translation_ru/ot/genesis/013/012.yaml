lexical_decisions:
- source_word: יָשַׁב
  choice: жил
  rationale: Глагол обозначает проживание или пребывание; «жил» естественно передаёт его значение в современном русском языке.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохранено прямо выраженное существительное אֶרֶץ («земля»); традиционная русская форма остаётся ясной и литературной.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: в городах равнины
  rationale: В данном контексте כִּכָּר обозначает равнинную область Иордана; перевод сохраняет множественное число и конструкцию принадлежности.
- source_word: וַיֶּאֱהַל
  choice: раскидывал свои шатры
  rationale: Глагол от אהל может означать разбивать шатёр или располагаться в шатрах. Формулировка естественно описывает кочевое расположение Лота и его людей, не утверждая, что он уже поселился в самом Содоме.
- source_word: עַד סְדֹם
  choice: вплоть до Содома
  rationale: עַד указывает на пространственный предел распространения стоянок; перевод сохраняет идею движения или протяжённости к Содому, не обязательно подразумевая вход в город.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Устоявшаяся русская передача личного имени на данном этапе повествования.
- source_word: לוֹט
  choice: Лот
  rationale: Устоявшаяся русская передача личного имени.
- source_word: סְדֹם
  choice: Содом
  rationale: Устоявшаяся русская передача географического названия.
