  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: ru
  text: Аврам жил в земле Ханаана, а Лот жил в городах равнины и раскинул шатры вплоть до Содома.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и передвинул свой шатёр до Содома». Еврейский глагол может означать жить в шатрах или разбить шатёр; смысл в том, что стоянки Лота простирались в направлении Содома, а не обязательно в том, что он уже поселился в самом городе.'
