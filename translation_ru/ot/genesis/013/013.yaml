    rationale: חַטָּאִים характеризует жителей как грешных/грешников, будучи параллельным רָעִים. Глагольная форма несколько меняет синтаксический и аспектуальный профиль высказывания.
  - severity: low
    issue: Усиление «крайне» в исходной фразе формально относится прежде всего к «нечестивы».
    rationale: מְאֹד стоит в конце и усиливает всю предикацию. Повторение усиления в русском яснее передаёт его сферу без изменения смысла.
