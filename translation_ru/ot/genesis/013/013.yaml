  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: ru
  text: Жители Содома были крайне нечестивы и весьма грешны против Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Яхве».'
    reason: 'Лексическая альтернатива для לַיהוָה: выражение может указывать не только на того, против кого грешат, но и на того, перед кем совершается и оценивается грех.'
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: Жители Содома
  rationale: Сочетание обозначает мужчин — жителей Содома; в данном контексте естественное русское «жители Содома» указывает на население города, не вводя неуклюжее «мужчины Содома». Начальный союз не воспроизводится отдельно, поскольку стих представляет поясняющее замечание, а в русском такая связь понятна без добавочного маркера.
- source_word: רָעִים
  choice: нечестивы
  rationale: В данном нравственном контексте слово означает не просто неприятность или вред, а моральное зло; «нечестивы» передаёт эту оценку в достойном и понятном регистре.
- source_word: וְ/חַטָּאִים
  choice: и грешили
  rationale: Еврейская предикативная форма характеризует содомлян как грешников. Русская глагольная передача звучит естественнее, чем сочетание «грешны против», и сохраняет смысл их устойчивого греховного поведения.
- source_word: לַ/יהוָה
  choice: против Яхве
  rationale: При языке греха предлог לְ может обозначать того, против кого совершается проступок. Имя יהוה передано как «Яхве», то есть как личное заветное имя, а не заменено титулом.
- source_word: מְאֹד
  choice: крайне
  rationale: Наречие выражает сильную степень. В русском «крайне» сохраняет усиление и относится к общей отрицательной характеристике содомлян.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» прямо передаёт это имя и не подменяет его титулом.
- issue: Значение לַיהוָה при חַטָּאִים
  choice: против Яхве
  alternative: перед Яхве
  rationale: Оборот допускает как направленность греха против Яхве, так и значение «перед ним, в его глазах». В основном тексте выбрано естественное при глаголе «грешить» значение «против», а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, весомой повествовательной формулировкой. «Нечестивы» сохраняет нравственно-религиозную силу оригинала, а глагольное «грешили против» избегает неестественного русского сочетания при сохранении смысла еврейского предиката.
