base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: ru
  text: 'И сказал Аврам Лоту: «Прошу, пусть не будет раздора между мной и тобой, между моими пастухами и твоими пастухами, ведь мы родственники[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально содержит слова «люди» и «братья». В еврейском языке слово «братья» может обозначать и родственников в более широком смысле.
    reason: Уточняет буквальную основу примечания, не навязывая спорный синтаксический разбор и сохраняя широкий смысл родства.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционная русская конструкция естественно передаёт связь с предыдущим контекстом.
- source_word: אַל נָא תְהִי
  choice: Прошу, пусть не будет
  rationale: Отрицательная форма с частицей נָא выражает вежливую, смягчённую просьбу, а не резкий запрет.
- source_word: מְרִיבָה
  choice: раздора
  rationale: Слово обозначает ссору, спор или распрю; «раздор» охватывает как личное противостояние, так и конфликт между пастухами.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: между мной и тобой
  rationale: Сохранены явное попарное обозначение сторон и повторяющаяся структура еврейского текста.
- source_word: רֹעַי ... רֹעֶיךָ
  choice: моими пастухами ... твоими пастухами
  rationale: Причастия от רעה обозначают людей, пасущих и стерегущих скот. «Пастухи» — естественное русское общее наименование в данном контексте.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание просьбы Аврама; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: мы родственники
  rationale: 'В данном контексте אַחִים обозначает не родных братьев, а мужчин одного рода: Лот был племянником Аврама. Идиоматический перевод передаёт смысл обращения к семейной близости, а буквальная форма отмечена в сноске.'
theological_decisions:
- issue: Значение אַחִים применительно к Авраму и Лоту
  choice: «мы родственники» в основном тексте
  alternative: «мы братья» или буквально «мы люди-братья»
  rationale: Еврейское אָח может обозначать не только родного брата, но и более широкое родство. Поскольку Аврам и Лот — дядя и племянник, «родственники» не создаёт ложного представления об их происхождении, сохраняя основанный на родстве призыв к миру.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «между» и слова «пастухами» сохранён ради риторического параллелизма оригинала; вежливость обращения передана словом «прошу».
