base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: ru
  text: 'И Яхве[a] сказал Авраму после того, как Лот отделился от него: «Подними глаза и посмотри с того места, где ты находишься, на север, на юг, на восток и на запад».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (ЙХВХ); традиционно: «Господь». «Яхве» — распространённая научная реконструкция произношения.'
    reason: Поясняет передачу божественного имени и отмечает традиционную замену, не представляя реконструированное произношение как бесспорно установленное.
lexical_decisions:
- source_word: וַיהוָה
  choice: И Яхве
  rationale: Союз ו сохраняет связь с предшествующим повествованием. Личное имя Бога יהוה передано как «Яхве», а не заменено титулом.
- source_word: אָמַר אֶל־אַבְרָם
  choice: сказал Авраму
  rationale: Обычная русская конструкция с дательным падежом естественно передаёт еврейское «сказал к Авраму».
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: после того, как Лот отделился от него
  rationale: Инфинитивная конструкция обозначает время после отделения Лота; местоимение «него» относится к Авраму.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Подними же глаза
  rationale: Буквальный образ естественен по-русски. Частица «же» передаёт мягкое побуждение נָא без чрезмерно разговорного «пожалуйста» и без добавления оттенка мольбы.
- source_word: וּרְאֵה
  choice: и посмотри
  rationale: Императив «посмотри» здесь передаёт направленное созерцание окружающей земли точнее, чем нейтральное «увидь».
- source_word: מִן־הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: с того места, где ты находишься
  rationale: Фраза обозначает точку обзора Аврама; отдельное «там» по-русски было бы избыточным.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: на север, на юг, на восток и на запад
  rationale: Формы с направительным окончанием переданы русскими сочетаниями с «на»; последовательность сторон света сохранена.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохраняется в основном тексте. «Яхве» — общепринятая научная реконструкция произношения; традиционная замена «Господь» указана в примечании, поскольку точное древнее произношение не засвидетельствовано непосредственно.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства повествовательной речи. Синтаксис сделан естественным для русского читателя, при этом сохранены порядок сторон света, образ «поднять глаза» и мягкий оттенок побуждения.
