base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: ru
  text: 'Тогда Иуда сказал Онану: «Войди к жене своего брата, исполни по отношению к ней долг деверя[a] и дай своему брату потомство».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более специальным языком: «исполни по отношению к ней левиратный долг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная русская форма библейского имени.
- source_word: בֹּא אֶל
  choice: войди к
  rationale: Сохранён древнееврейский эвфемистический оборот, обозначающий супружеское соитие; в русском библейском контексте он понятен и не становится грубо прямолинейным.
- source_word: אֵשֶׁת אָחִיךָ
  choice: жена своего брата
  rationale: Прямой и естественный перевод сочетания; возвратное местоимение соответствует нормам современного русского языка.
- source_word: וְיַבֵּם אֹתָהּ
  choice: исполни перед ней долг деверя
  rationale: Глагол обозначает особую обязанность брата умершего мужа. Формулировка передаёт как родственную, так и установленную обычаем обязанность, не ограничивая смысл одним лишь вступлением в брак или половым актом.
- source_word: וְהָקֵם זֶרַע
  choice: дай … потомство
  rationale: В данном сочетании речь идёт о появлении потомства, которое продолжит линию умершего брата. Перевод естественен по-русски и сохраняет целевую направленность выражения.
- source_word: לְאָחִיךָ
  choice: своему брату
  rationale: 'Предлог לְ указывает, для кого должно быть продолжено потомство: ребёнок будет считаться потомством умершего брата.'
theological_decisions:
- issue: Передача терминологии левиратной обязанности без внесения более поздней правовой или конфессиональной детализации
  choice: исполни перед ней долг деверя
  alternative: исполни по отношению к ней левиратный долг; возьми её в жёны как деверь
  rationale: Выбранный вариант сохраняет технический семейно-правовой смысл יִבֵּם, оставаясь понятным неспециалисту. Он не сводит обязанность только к браку или только к половым отношениям.
- issue: Чьим считается рождаемое потомство
  choice: дай своему брату потомство
  alternative: продолжи род своего брата; воздвигни семя брату своему
  rationale: 'Фраза сохраняет напряжение текста: биологическим отцом должен стать Онан, однако потомство предназначается умершему брату и продолжает его семейную линию.'
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Эвфемизм «войди к» сохранён из исходного текста; редкое слово «деверь» поддержано сноской, поясняющей специальный термин.
