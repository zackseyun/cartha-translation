  text: Когда ей настало время рожать, вот, в её утробе были близнецы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Когда пришло время
  rationale: Нарративная форма וַיְהִי вместе с временным оборотом בְּעֵת вводит следующий эпизод и указывает на наступление срока; русский оборот естественно передаёт обе функции без архаичного «и было».
- source_word: לִדְתָּהּ
  choice: ей рожать
  rationale: Инфинитив от ילד с суффиксом 3-го лица женского рода обозначает её роды; конструкция «пришло время ей рожать» ясна и естественна в современном русском языке.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к неожиданно обнаружившемуся обстоятельству. «Вот» сохраняет её выразительную и дискурсивную функцию.
- source_word: תְאוֹמִים
  choice: близнецы
  rationale: Существительное во множественном числе прямо обозначает близнецов.
- source_word: בְּבִטְנָהּ
  choice: в её утробе
  rationale: בֶּטֶן может означать живот или утробу; в контексте родов «утроба» является точным и стилистически достойным соответствием.
