lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: В то время
  rationale: Естественно вводит новый эпизод и сохраняет временную привязку; повествовательная формула וַיְהִי не воспроизводится тяжеловесно.
- source_word: וַיֵּרֶד
  choice: отошёл
  rationale: В контексте речь идёт об удалении Иуды от братьев; буквальное «спустился» возможно, но в современном русском способно неоправданно подчеркнуть рельеф.
- source_word: מֵאֵת אֶחָיו
  choice: от своих братьев
  rationale: Прямо передаёт отделение Иуды от его братьев.
- source_word: וַיֵּט עַד
  choice: направился к
  rationale: Естественно передаёт движение или поворот к человеку, не навязывая буквального значения «склонился».
- source_word: אִישׁ עֲדֻלָּמִי
  choice: к одному адулламитянину
  rationale: Передаёт представление конкретного человека, определяемого по происхождению, и звучит естественно по-русски.
- source_word: וּשְׁמוֹ חִירָה
  choice: по имени Хира
  rationale: Плавно и точно включает именную формулу в русское предложение.
- source_word: חִירָה
  choice: Хира
  rationale: Традиционная и фонетически уместная русская передача древнееврейского личного имени.
