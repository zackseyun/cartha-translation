  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: ru
  text: Там Иуда увидел дочь одного хананеянина по имени Шуа[a], взял её и вошёл к ней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и имя его — Шуа»; речь идёт о хананеянине, отце девушки, а не о ней самой.'
    reason: lexical_alternative
  - marker: b
    text: «Вошёл к ней» — древнееврейское выражение, означающее половую близость.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямое и естественное соответствие глаголу ראה в последовательном повествовании; варианты «заметил» и «встретил» добавляли бы оттенки, не выраженные явно.
- source_word: שָׁם
  choice: там
  rationale: Кратко и естественно передаёт наречие места.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: дочь одного хананеянина
  rationale: Сохраняет смысл сочетания «дочь человека-хананеянина» и звучит естественно по-русски.
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: по имени Шуа
  rationale: В еврейском тексте местоименный суффикс мужского рода указывает на отца, а не на дочь; русская формулировка остаётся краткой, а примечание устраняет возможную синтаксическую двусмысленность.
- source_word: וַיִּקָּחֶהָ
  choice: взял её
  rationale: Сохраняет буквальную широту לקח; контекст допускает значение взятия в жёны, но сам глагол здесь не требует разворачивать его как «женился на ней».
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: вошёл к ней
  rationale: Передаёт традиционную древнееврейскую идиому без устранения её образности; значение пояснено в примечании.
