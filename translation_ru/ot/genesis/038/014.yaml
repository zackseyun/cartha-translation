  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: ru
  text: 'Тогда она сняла с себя вдовьи одежды, покрылась покрывалом, закуталась и села у входа в Енаим[a], который находится по дороге в Тимну, потому что видела: Шела вырос, а её ему в жёны не отдали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Петах-Энаиме». Еврейское выражение можно понять либо как «у входа в Енаим», либо как составное название места.'
    reason: Сохраняет реальную топонимическую неоднозначность בְּפֶתַח עֵינַיִם.
lexical_decisions:
- source_word: וַתָּסַר ... בִּגְדֵי אַלְמְנוּתָהּ מֵעָלֶיהָ
  choice: сняла с себя вдовьи одежды
  rationale: Передаёт как снятие одежды, обозначавшей вдовство, так и явное еврейское מֵעָלֶיהָ — «с себя».
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: покрылась покрывалом, закуталась
  rationale: 'Сохраняет два последовательных еврейских глагола: она покрылась покрывалом, а затем укуталась или скрыла свой облик. Это полнее исходного текста, чем слияние действий в одно.'
- source_word: בְּפֶתַח עֵינַיִם
  choice: у входа в Енаим
  rationale: Контекстуально естественное понимание конструкции как указания на вход в населённый пункт Енаим; возможное прочтение как составного топонима вынесено в примечание.
- source_word: תִּמְנָתָה
  choice: в Тимну
  rationale: Направительный суффикс передан русским предлогом «в»; название дано в традиционной и естественной русской форме.
- source_word: וְהִוא לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: но её так и не отдали ему в жёны
  rationale: Сохраняется пассивная конструкция и подразумеваемое продолжительное невыполнение обещанного брака; «так и не» естественно выражает контекстуальный оттенок.
theological_decisions:
- issue: Степень явности намерения Фамари скрыть личность
  choice: закуталась
  alternative: переоделась / замаскировалась
  rationale: Исходный глагол допускает представление об укутывании и сокрытии облика, но не требует прямо называть это маскировкой; перевод не приписывает ей более определённого намерения, чем выражено в стихе.
- issue: Причина поступка Фамари
  choice: Она видела, что Шела уже вырос, но её так и не отдали ему в жёны
  alternative: потому что она поняла, что Шела вырос и её не отдадут ему в жёны
  rationale: Сохраняется фактическое наблюдение исходного текста без усиления до окончательного вывода о будущих намерениях Иуды.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Формы «вдовьи одежды» и «в жёны» понятны широкому читателю; синтаксис остаётся повествовательным и dignified без архаизации.
