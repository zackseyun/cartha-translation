lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: когда он втянул руку обратно
  rationale: Порода hifil глагола שׁוב с дополнением «рука» обозначает обратное движение руки. «Втянул руку обратно» естественно передаёт действие в контексте родов.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица вводит неожиданный поворот и придаёт повествованию наглядность; русское «вот» сохраняет этот эффект.
- source_word: יָצָא אָחִיו
  choice: вышел его брат
  rationale: В контексте рождения יָצָא буквально и естественно передаётся глаголом «вышел».
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Как же ты прорвался!
  rationale: Фраза является эмоциональным восклицанием и дважды обыгрывает корень פרץ. Русский глагол «прорвался» передаёт внезапный выход ребёнка; трудное עָלֶיךָ не развёрнуто в искусственное «для себя», а отмечено в сноске вместе с буквальной конструкцией.
- source_word: פָּרֶץ
  choice: Перец
  rationale: Транслитерация «Перец» близко передаёт еврейское имя и позволяет в сноске показать его связь с корнем פרץ («прорываться, проламывать»).
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: И назвали его Перец
  rationale: Еврейская формула содержит глагол в мужском роде единственного числа, но не называет действующее лицо. Русская неопределённо-личная конструкция сохраняет отсутствие указанного субъекта и звучит естественно.
