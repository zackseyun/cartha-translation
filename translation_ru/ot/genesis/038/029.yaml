  source_fidelity: 'Основной ход повествования передан верно: один из близнецов убирает руку, другой выходит первым, затем следует восклицание и наречение Перец. Однако «втянул руку обратно» несколько тяжеловесно; «убрал руку» естественнее и точнее описывает возвращение руки. Неопределённо-личное «назвали» приемлемо как естественная русская передача неназванного субъекта формулы наречения.'
