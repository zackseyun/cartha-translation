base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: ru
  text: Тогда Иуда послал козлёнка через своего друга-адулламитянина[a], чтобы забрать у женщины[c] залог[b], но тот не нашёл её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой своего друга»; это выражение означает действие через посредника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обеспечение», то есть вещи, оставленные в качестве гарантии.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «из руки женщины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Тогда … послал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт смену действия.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная русская форма личного имени.
- source_word: גְּדִי הָעִזִּים
  choice: козлёнка
  rationale: Сочетание обозначает детёныша козы; «козлёнок» — точное и естественное современное соответствие.
- source_word: בְּיַד
  choice: через
  rationale: Буквально «рукой»; здесь это еврейская идиома посредничества или агентности.
- source_word: רֵעֵהוּ
  choice: своего друга
  rationale: Слово обозначает близкого человека, товарища или спутника; в данном контексте естественно «друг».
- source_word: הָעֲדֻלָּמִי
  choice: адулламитянина
  rationale: Обозначает человека из Адуллама; использована традиционная русская форма этнохоронима.
- source_word: לָקַחַת
  choice: чтобы забрать
  rationale: Инфинитив выражает цель; по контексту Иуда хочет получить обратно оставленные им вещи.
- source_word: הָעֵרָבוֹן
  choice: залог
  rationale: Речь о предмете, оставленном как обеспечение обещанной платы; «залог» кратко и точно передаёт смысл.
- source_word: מִיַּד הָאִשָּׁה
  choice: у женщины
  rationale: Буквально «из руки женщины»; русская конструкция «забрать у женщины» естественно выражает источник и владение.
- source_word: וְלֹא מְצָאָהּ
  choice: но тот не нашёл её
  rationale: «Но» передаёт несостоявшийся результат поручения, а указательное местоимение «тот» ясно относит действие к другу Иуды.
