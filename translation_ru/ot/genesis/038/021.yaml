base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: ru
  text: 'Он спросил у жителей той местности: «Где та культовая блудница[a], что была у дороги в Энаиме[b]?» Они ответили: «Здесь не было культовой блудницы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово кедеша связано с понятием посвящённости и буквально может означать «посвящённая женщина». В этом контексте его часто понимают как обозначение женщины, связанной с культовой проституцией; однако точное значение термина и исторический характер такого статуса остаются предметом споров. Возможный традиционный перевод: «священная блудница».'
    reason: lexical_alternative
  - marker: b
    text: Энаим — название места; по форме оно совпадает с еврейским словом «глаза» и может быть связано со словом «источники».
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Он спросил
  rationale: Обычная повествовательная форма глагола שׁאל; «спросил» естественно вводит последующий прямой вопрос.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: у жителей той местности
  rationale: Передаёт смысл «люди/мужчины её места» естественным современным русским языком; указательное «той» проясняет отсылку к месту, где искали женщину, не меняя смысла.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейская формула «говоря» в современном русском повествовании естественно передаётся пунктуационным введением прямой речи.
- source_word: אַיֵּה
  choice: Где
  rationale: Прямой вопрос о местонахождении.
- source_word: הַקְּדֵשָׁה / קְדֵשָׁה
  choice: культовая блудница
  rationale: Сохраняет отличие термина קְדֵשָׁה от זֹנָה в других стихах главы и указывает на предполагаемую связь с культовой сферой, не вводя отсутствующего в тексте упоминания храма.
- source_word: הִוא
  choice: та … что была
  rationale: Самостоятельное местоимение передано указательно-относительной конструкцией, естественной для русского вопроса и сохраняющей выделение разыскиваемой женщины.
- source_word: בָעֵינַיִם
  choice: в Энаиме
  rationale: В контексте это название места; оно транслитерировано, а не переведено как «глаза» или «источники».
- source_word: עַל הַדָּרֶךְ
  choice: у дороги
  rationale: Передаёт местонахождение рядом с дорогой и естественно звучит по-русски.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Здесь не было культовой блудницы
  rationale: Прямо передаёт отрицание того, что такая женщина находилась в этом месте; прошедшее время соответствует הָיְתָה и русской повествовательной речи.
theological_decisions:
- issue: Точный статус женщины, обозначенной словом קְדֵשָׁה
  choice: В основном тексте — «культовая блудница», с оговоркой в сноске
  alternative: «священная блудница»; «посвящённая женщина»; просто «блудница»
  rationale: Форма связана с корнем קדשׁ («святость, посвящение») и традиционно понимается как обозначение женщины, связанной с культовой проституцией, однако историческая природа такого статуса оспаривается. Выбранный вариант сохраняет отличие от זֹנָה, а сноска не выдаёт спорную реконструкцию за несомненный факт.
translation_notes:
  register: Современный литературный русский язык с лаконичной повествовательной интонацией. Формула לֵאמֹר не калькируется как «говоря», а естественно оформляется прямой речью. Термин «культовая блудница» выбран ради смыслового различия внутри главы; спорность его исторического наполнения отмечена в сноске.
