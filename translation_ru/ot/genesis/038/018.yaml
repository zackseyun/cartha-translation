base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: ru
  text: 'Он спросил: «Какой залог мне дать тебе?» Она ответила: «Твою печать, твой шнур и посох, который у тебя в руке». Он отдал ей всё это, вошёл к ней[a], и она зачала от него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вошёл к ней» — еврейский эвфемизм, означающий половую близость.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: залог
  rationale: Предмет, оставляемый в обеспечение последующей платы; «залог» точно и естественно передаёт значение в данном повествовательном контексте.
- source_word: חֹתָמְךָ
  choice: твою печать
  rationale: Слово обозначает личную печать или знак для удостоверения, но не уточняет, что это был перстень.
- source_word: וּפְתִילֶךָ
  choice: твой шнур
  rationale: Вероятно, это шнур, на котором носили печать; перевод сохраняет конкретность текста, не добавляя прямо не указанной связи.
- source_word: וּמַטְּךָ אֲשֶׁר בְּיָדֶךָ
  choice: и посох, который у тебя в руке
  rationale: Сохраняет конкретный образ и относит придаточное, как и в еврейском тексте, непосредственно к посоху.
- source_word: וַיִּתֶּן לָּהּ
  choice: Он отдал ей всё это
  rationale: В еврейском нет выраженного местоименного дополнения, но контекст указывает на три названных предмета; «всё это» естественно восполняет его по-русски.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: вошёл к ней
  rationale: Сохраняет традиционный библейский эвфемизм половой близости и достоинство повествовательного регистра.
- source_word: וַתַּהַר לוֹ
  choice: она зачала от него
  rationale: Точно передаёт наступление беременности и отношение, выраженное לוֹ, в сжатой литературной форме.
theological_decisions:
- issue: Степень явности выражения половой близости
  choice: вошёл к ней
  alternative: лёг с ней / вступил с ней в связь
  rationale: Еврейский текст использует эвфемистическую формулу; её сохранение не смягчает и не усиливает повествование толковательным пересказом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплики переданы естественно; конкретные предметы и исходный эвфемизм сохранены без излишнего уточнения.
