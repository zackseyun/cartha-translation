  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: ru
  text: 'И сказал Иуда: «Пусть она оставит это себе, иначе над нами будут смеяться.[a] Вот, я послал этого козлёнка, но ты её не нашёл».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иначе мы покроем себя позором»; или: «иначе нас станут презирать». Еврейское выражение означает стать предметом презрения или насмешек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Пусть она оставит это себе
  rationale: 'Форма 3-го лица женского рода допускает разрешительно-побудительное понимание: Иуда соглашается, чтобы женщина оставила у себя залог. Местоимение «это» естественно отсылает ко всему залогу как к совокупности вещей, не вводя в текст явно не названного существительного.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: иначе над нами будут смеяться
  rationale: בּוּז выражает презрение, осмеяние или унижение. Русская фраза передаёт опасение Иуды стать предметом насмешек и сохраняет социальный оттенок контекста.
- source_word: הִנֵּה
  choice: ведь
  rationale: В данном контексте частица привлекает внимание к оправдывающему утверждению Иуды. Русское «ведь» естественно передаёт эту дискурсивную функцию; буквальное «вот» здесь звучало бы менее плавно.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: я послал этого козлёнка
  rationale: גְּדִי означает детёныша козы; «козлёнок» — ясный и естественный русский эквивалент. Указательное значение הַזֶּה сохранено словом «этого».
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: но ты её не нашёл
  rationale: Союз ו здесь выражает контраст между отправкой козлёнка и безуспешными поисками. Женский объектный суффикс сохранён местоимением «её».
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Использована традиционная русская библейская форма имени.
