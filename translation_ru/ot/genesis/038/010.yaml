base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: ru
  text: То, что он сделал, было злом в глазах Яхве[a], и Он также умертвил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (ЙХВХ).
    reason: Поясняет непривычную для части русскоязычных читателей передачу тетраграмматона.
lexical_decisions:
- source_word: וַיֵּרַע
  choice: было злом
  rationale: Глагол רעע здесь выражает нравственную оценку поступка. «Было злом» передаёт её прямо, не смягчая до «было неугодно».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена обычная древнееврейская метафора, обозначающая оценку со стороны Бога; выражение понятно и в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, представленное тетраграмматоном, а не заменено титулом.
- source_word: אֲשֶׁר עָשָׂה
  choice: то, что он сделал
  rationale: Естественная русская передача относительной конструкции, отсылающей к поступку Онана, описанному в предыдущем стихе.
- source_word: וַיָּמֶת
  choice: Он умертвил
  rationale: Форма хифиль глагола מות имеет каузативное значение и прямо приписывает смерть Онана действию Яхве. «Умертвил» сохраняет эту причинность и торжественный регистр.
- source_word: גַּם אֹתוֹ
  choice: также и его
  rationale: 'Сочетание связывает участь Онана с ранее упомянутой смертью Ира: Яхве умертвил и его.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет это различие, не подменяя имя титулом.
- issue: Непосредственная Божья причинность в וַיָּמֶת
  choice: Он умертвил также и его
  alternative: он также умер
  rationale: Каузативная форма глагола указывает не просто на наступление смерти, а на то, что Яхве предал Онана смерти. Заглавная буква помогает соотнести подразумеваемое подлежащее с Яхве.
- issue: Связь между нравственной оценкой и судом
  choice: и Он умертвил
  alternative: поэтому Он умертвил
  rationale: Союз ו допускает понимание последующего события как результата, однако буквально выражает последовательность. «И» сохраняет причинную связь в контексте, не делая её грамматически более явной, чем в еврейском тексте.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены метафора «в глазах» и каузативность Божьего суда; архаические обороты не используются.
