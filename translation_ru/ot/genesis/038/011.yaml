  naturalness: Текст звучит естественно на современном литературном русском. Оборот «как бы и он не умер» допустим, но вариант «как бы он тоже не умер» несколько плавнее и яснее сохраняет значение опасения.
  terminology: Имена «Иуда», «Фамарь» и «Шела», а также родственный термин «невестка» переданы удачно и соответствуют обычной русской библейской традиции. «Оставайся вдовой» точно передаёт предписание сохранять статус вдовы.
