base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: ru
  text: 'Тогда Иуда сказал Фамари, своей невестке: «Оставайся вдовой в доме своего отца, пока не вырастет мой сын Шела». Ведь он сказал[a]: «Как бы он тоже не умер, как его братья». Фамарь пошла и стала жить в доме своего отца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «думал»; еврейское «сказал» может вводить внутреннее рассуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: Оставайся вдовой
  rationale: Императив ישׁב в сочетании с существительным אַלְמָנָה предписывает Фамари сохранять статус вдовы; русское выражение естественно и точно передаёт эту социальную ситуацию.
- source_word: בֵית אָבִיךְ
  choice: в доме своего отца
  rationale: Передаёт и место проживания, и принадлежность к отцовскому дому; возвратное «своего» естественно при обращении к Фамари.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: пока не вырастет мой сын Шела
  rationale: יִגְדַּל здесь означает достижение зрелости; «вырастет» ясно передаёт смысл, не добавляя прямо не названного брачного возраста.
- source_word: כִּי אָמַר
  choice: Ведь он говорил
  rationale: Сохраняется буквальное значение глагола אמר и причинная связь כִּי, при этом контекст допускает внутреннюю речь; эта неоднозначность отмечена в сноске.
- source_word: פֶּן יָמוּת גַּם הוּא
  choice: Как бы и он не умер
  rationale: Оборот «как бы не» естественно выражает опасение, вводимое частицей פֶּן, и не превращает его в утверждение цели.
- source_word: כְּאֶחָיו
  choice: как его братья
  rationale: Кратко и близко к еврейскому сравнению; из контекста ясно, что речь идёт о смерти братьев.
- source_word: וַתֵּשֶׁב
  choice: стала жить
  rationale: В повествовательной последовательности обозначает начавшееся и продолжавшееся проживание в отцовском доме; избегается неестественный повтор «оставалась».
- source_word: כַּלָּתוֹ
  choice: своей невестке
  rationale: Стандартное современное обозначение родства; форма с возвратным местоимением естественна после подлежащего «Иуда».
- source_word: בֵּית אָבִיהָ
  choice: в доме своего отца
  rationale: Повторяет формулировку повеления Иуды и сохраняет смысл проживания в отцовском доме.
theological_decisions:
- issue: Передаёт ли כִּי אָמַר произнесённые слова или внутреннее рассуждение Иуды
  choice: В основном тексте сохранено «говорил» с прямой речью
  alternative: «думал»
  rationale: Еврейское אמר буквально означает «сказал/говорил», но может вводить внутреннюю речь. Основной текст не устраняет эту неоднозначность, а сноска сообщает естественную русскую альтернативу.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским ритмом. Имена переданы в укоренившейся русской форме: Иуда, Фамарь, Шела. Архаизмы вроде «дабы», «доколе» и «жила вдовою» не используются.'
