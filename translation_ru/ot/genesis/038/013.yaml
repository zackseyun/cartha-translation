translation_notes:
  register: Современный литературный русский язык; повествовательный стиль краткий и достоинственный. Начальное «И» сохраняет связь стиха с предыдущим повествованием. Формула לֵאמֹר передана естественной русской пунктуацией, без стилистически тяжеловесного буквализма.
