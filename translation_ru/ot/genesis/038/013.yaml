  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: ru
  text: 'И Тамар сообщили: «Вот, твой свёкор поднимается в Тимну, чтобы стричь своих овец».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: Фамари сообщили
  rationale: Пассивная форма глагола с косвенным дополнением естественно передаётся по-русски неопределённо-личной конструкцией; имя поставлено в дательном падеже.
- source_word: לֵאמֹר
  choice: двоеточие и прямая речь
  rationale: Стандартная формула введения речи в современном русском естественно выражается пунктуацией; буквальное «сказав» здесь звучало бы неестественно.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию привлечения внимания и подходит для сообщаемого известия.
- source_word: חָמִיךְ
  choice: твой свёкор
  rationale: Точно передаёт термин родства и женский род адресата во втором лице единственного числа.
- source_word: עֹלֶה
  choice: идёт
  rationale: Причастие обозначает происходящее или близкое действие; контекст направления передан без избыточного буквального «поднимается», поскольку движение вверх может быть топографическим.
- source_word: תִמְנָתָה
  choice: в Фимну
  rationale: Направительное окончание передано русской конструкцией движения «в» с винительным падежом; использована традиционная русская форма топонима.
- source_word: לָגֹז
  choice: стричь
  rationale: Инфинитив с ל выражает цель движения.
- source_word: צֹאנוֹ
  choice: своих овец
  rationale: В контексте стрижки собирательное צאן естественно означает овец; возвратное притяжательное местоимение однозначно соотносит их с подлежащим.
