  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: ru
  text: 'Он сказал: «Я пришлю козлёнка из стада». Она ответила: «Если дашь мне залог[a] до тех пор, пока не пришлёшь его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обеспечение».'
    reason: Лексема עֵרָבוֹן обозначает предмет или средство обеспечения исполнения обещания; «залог» — естественный основной вариант в данном контексте.
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: козлёнка
  rationale: Сочетание обозначает детёныша козы. «Козлёнок» — точный и естественный современный русский эквивалент без избыточного буквального оборота.
- source_word: מִן הַצֹּאן
  choice: из стада
  rationale: צֹאן обозначает мелкий домашний скот — овец и коз. Поскольку животное уже названо козлёнком, «из стада» передаёт собирательный смысл естественно и без повтора.
- source_word: עֵרָבוֹן
  choice: залог
  rationale: Слово обозначает предмет, оставляемый как обеспечение исполнения обещания. «Залог» точно соответствует повествовательной ситуации и сохраняет конкретный характер обеспечения.
- source_word: עַד שָׁלְחֶךָ
  choice: пока не пришлёшь его
  rationale: Еврейская конструкция буквально означает «до твоего посылания». В русском придаточное с «пока не» естественно выражает временной предел; местоимение «его» восстанавливает подразумеваемый из контекста объект — козлёнка.
- source_word: אִם תִּתֵּן
  choice: если дашь мне
  rationale: Союз אִם вводит условие Фамари. Местоимение «мне» не выражено отдельно в еврейском тексте, но однозначно подразумевается ситуацией и необходимо для естественной русской речи.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Я пришлю
  rationale: Самостоятельное местоимение אָנֹכִי сохранено как «Я», а форма глагола передана обещанием в будущем времени. «Пришлю» естественнее русского «отправлю» с учётом направления обещанной передачи Фамари.
