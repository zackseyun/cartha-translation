base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: ru
  text: 'Когда её выводили, она послала сказать своему свёкру: «Я беременна от того, кому принадлежат эти вещи». И добавила: «Прошу, узнай[a], чьи это печать, шнуры и посох».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «определи». Еврейский глагол может означать как узнавание, так и установление принадлежности; здесь просьба звучит как предъявление доказательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: её выводили
  rationale: 'Пассивное причастие описывает происходящее действие: Фамарь уже вели из дома для исполнения приговора. Несовершенный вид естественно передаёт длительность.'
- source_word: שָׁלְחָה אֶל חָמִיהָ לֵאמֹר
  choice: она послала сказать своему свёкру
  rationale: Идиоматически передаёт отправку сообщения адресату, не добавляя не названного в тексте посланника.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: Я беременна от того, кому принадлежат эти вещи
  rationale: Естественная русская конструкция ясно передаёт принадлежность предметов и подразумеваемое отцовство.
- source_word: הַכֶּר נָא
  choice: Прошу, распознай
  rationale: «Распознай» сохраняет основное значение נכר и намеренную словесную перекличку с Быт. 37:32; «прошу» передаёт смягчающую частицу נָא.
- source_word: חֹתֶמֶת
  choice: печать
  rationale: Речь идёт о личной печати для удостоверения владельца; еврейское слово само по себе не требует уточнения «перстень».
- source_word: פְּתִילִים
  choice: шнуры
  rationale: Передаёт форму множественного числа и вероятные шнуры, связанные с печатью.
- source_word: מַטֶּה
  choice: посох
  rationale: Обычное и контекстуально уместное обозначение личного посоха в патриархальном повествовании.
