translation_notes:
  register: Современный литературный русский язык с повествовательной сдержанностью. «Свёкор» точно обозначает отца мужа. Повторное וַתֹּאמֶר передано как «И добавила», чтобы естественно связать две части одного сообщения, не устраняя их формального разделения. Маркер сноски поставлен при הַכֶּר נָא, к которому относится лексическая альтернатива.
