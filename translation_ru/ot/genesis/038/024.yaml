  source_fidelity: Перевод точно передаёт временную приблизительность כְּמִשְׁלֹשׁ («примерно через три месяца»), сообщение Иуде, обвинительный характер זָנְתָה и лексическую связь с לִזְנוּנִים. «Выведите её, и пусть её сожгут» верно сохраняет множественное повеление и пассивный смысл нифаля, не добавляя исполнителя или процедуру казни.
  naturalness: Текст звучит естественно на современном литературном русском. «Предавалась блуду» и «беременна от блуда» имеют умеренно возвышенный библейский регистр, но остаются понятными и уместны в прямой обвинительной речи.
  terminology: «Блуд» удачно сохраняет связь двух однокоренных еврейских выражений и не сужает обвинение до утверждения о профессиональной проституции. Имя «Фамарь» и родственный термин «невестка» употреблены корректно. Сноски расположены при соответствующих выражениях и содержательно отражают допустимые лексические варианты.
