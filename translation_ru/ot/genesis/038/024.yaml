  text: וַ/יְהִ֣י כְּ/מִ/שְׁלֹ֣שׁ חֳדָשִׁ֗ים וַ/יֻּגַּ֨ד לִֽ/יהוּדָ֤ה לֵֽ/אמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔/ךָ וְ/גַ֛ם הִנֵּ֥ה הָרָ֖ה לִ/זְנוּנִ֑ים וַ/יֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּ/הָ וְ/תִשָּׂרֵֽף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: ru
  text: 'Примерно через три месяца Иуде сообщили: «Фамарь, твоя невестка, предавалась блуду[a], и вот, она ещё и беременна от блуда[b]». Иуда сказал: «Выведите её, и пусть её сожгут».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вела себя как блудница»; шире: «совершила половое прегрешение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «забеременела вследствие блуда» или «через блуд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Примерно через три месяца
  rationale: Передаёт приблизительность, выраженную כְּ, и естественно вводит новое событие повествования без архаичного оборота.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: Иуде сообщили
  rationale: Кратко и естественно передаёт пассивную форму глагола נגד и вводит содержание сообщения прямой речью.
- source_word: זָנְתָה
  choice: предавалась блуду
  rationale: Сохраняет образный ряд проституции или недозволенной половой связи, присущий корню זנה, но не утверждает непременно профессиональную проституцию.
- source_word: וְגַם הִנֵּה
  choice: и вот, она ещё и
  rationale: «И вот» передаёт акцент и неожиданность הִנֵּה, а «ещё и» — добавочное усиление וְגַם.
- source_word: הָרָה לִזְנוּנִים
  choice: беременна от блуда
  rationale: Передаёт беременность как результат названной недозволенной половой связи и сохраняет лексическую связь между זָנְתָה и זְנוּנִים.
- source_word: הוֹצִיאוּהָ
  choice: Выведите её
  rationale: Точно передаёт повелительную форму множественного числа с местоименным суффиксом женского рода.
- source_word: וְתִשָּׂרֵף
  choice: и пусть её сожгут
  rationale: Сохраняет пассивный смысл нифаля и силу приказа, не уточняя исполнителей.
theological_decisions:
- issue: Передача терминов, обозначающих половое прегрешение в обвинении
  choice: Использовать однокоренные выражения «предавалась блуду» и «беременна от блуда».
  alternative: «Занималась проституцией»; «совершила половую безнравственность».
  rationale: Формы זנה и זְנוּנִים вызывают образ проституции, но в данном обвинительном контексте могут обозначать недозволенную половую связь шире профессиональной проституции. «Блуд» сохраняет эту смысловую напряжённость.
- issue: Характер приказа Иуды
  choice: «Выведите её, и пусть её сожгут».
  alternative: «Выведите её, чтобы сжечь»; «выведите и сожгите её».
  rationale: Фраза передаёт суровый приказ о сожжении и сохраняет грамматически пассивную форму еврейского текста, не добавляя отсутствующих в нём подробностей о порядке казни.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Оборот «предавалась блуду» понятен современному читателю, сохраняет достоинство повествования и не сужает значение до коммерческой проституции.
