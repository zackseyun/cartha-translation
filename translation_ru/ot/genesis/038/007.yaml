base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: ru
  text: Ир, первенец Иуды, был злым в глазах Яхве, и Яхве умертвил его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Яхве сделал так, что он умер».'
    reason: Лексическая альтернатива, раскрывающая каузативную форму еврейского глагола.
lexical_decisions:
- source_word: וַיְהִי
  choice: был
  rationale: Форма продолжает повествование и выполняет связочную функцию; отдельное вводное «теперь» в русском тексте не требуется.
- source_word: עֵר
  choice: Ир
  rationale: Использована устоявшаяся русская передача личного имени.
- source_word: בְּכוֹר יְהוּדָה
  choice: первенец Иуды
  rationale: Сочетание сохраняет родственную связь и указание на порядок рождения, оставаясь естественным для современного русского языка.
- source_word: רַע
  choice: зол
  rationale: Слово выражает нравственную оценку, а не несчастье или низкое качество; «зол» сохраняет тяжесть этой оценки и не добавляет конкретных поступков, не названных в тексте.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образ исходной идиомы, ясно передающий оценку с точки зрения Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: וַיְמִתֵהוּ
  choice: умертвил его
  rationale: Каузативная форма глагола מות прямо приписывает смерть Ира действию Яхве; «умертвил» передаёт это кратко и торжественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя; транслитерация сохраняет его и не подменяет титулом.
- issue: Степень выраженности действия Яхве в смерти Ира
  choice: Яхве умертвил его
  alternative: Яхве сделал так, что он умер
  rationale: Каузативный еврейский глагол прямо указывает на действие Яхве. Основной текст не смягчает эту причинность и не уточняет не названный в стихе способ смерти.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Образ «в глазах Яхве» сохранён как понятная библейская идиома; вводный дискурсивный маркер не добавлен.
