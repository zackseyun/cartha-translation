  text: Она снова зачала и родила сына, и назвала его Онаном.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: Она зачала
  rationale: Глагол הרה обозначает зачатие или наступление беременности; «зачала» кратко и естественно передаёт повествовательный стиль оригинала.
- source_word: עוֹד
  choice: снова
  rationale: В последовательности рождений слово указывает на повторение действия.
- source_word: וַתֵּלֶד בֵּן
  choice: и родила сына
  rationale: Обычная русская формула естественно и точно передаёт еврейское выражение о рождении сына.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: и назвала его
  rationale: Еврейская идиома буквально означает «назвала его имя»; по-русски тот же смысл естественно выражается словами «назвала его».
- source_word: אוֹנָן
  choice: Онаном
  rationale: Имя передано в принятой русской библейской форме; творительный падеж обусловлен управлением глагола «назвала».
