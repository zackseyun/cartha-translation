base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: ru
  text: Она встала и ушла, сняла с себя покрывало и надела свои вдовьи одежды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: встала
  rationale: Обычное повествовательное значение формы от קום; естественно передаёт начало следующего действия.
- source_word: וַתֵּלֶךְ
  choice: ушла
  rationale: В последовательности после «встала» глагол הלך обозначает удаление с этого места; «ушла» ясно и естественно передаёт смысл.
- source_word: וַתָּסַר ... צְעִיפָהּ מֵעָלֶיהָ
  choice: сняла с себя покрывало
  rationale: Форма от סור с מֵעָלֶיהָ указывает, что она убрала находившееся на ней покрывало; русское «сняла с себя» полно и идиоматично передаёт образ.
- source_word: צְעִיפָהּ
  choice: покрывало
  rationale: צָעִיף обозначает покрытие головы или лица; «покрывало» подходит контексту переодевания Фамари и не сужает значение до современного типа вуали.
- source_word: וַתִּלְבַּשׁ
  choice: надела
  rationale: Глагол לבש здесь прямо обозначает надевание одежды.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: свои вдовьи одежды
  rationale: Сочетание обозначает одежду, связанную с её положением вдовы. «Вдовьи одежды» сохраняет культурно значимую характеристику, а «свои» передаёт местоименный суффикс.
