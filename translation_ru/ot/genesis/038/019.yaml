translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского: последовательность действий передана однородными сказуемыми без избыточного повторения союза. Формальное «одежды своего вдовства» отвергнуто как неестественное; смысл сохранён в выражении «свои вдовьи одежды».'
