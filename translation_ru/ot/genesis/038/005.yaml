  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: ru
  text: Она снова родила сына и нарекла ему имя Шела. Он был в Кезиве, когда она родила его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно некоторым древним свидетельствам и толкованиям: «Она была в Кезиве, когда родила его». В еврейском тексте стоит форма мужского рода: «он был», однако вопрос о субъекте остаётся спорным.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Она снова родила сына
  rationale: Оборот יסף + עוד указывает на повторное действие; в русском естественно соединить его с прямо названным рождением, не добавляя отсутствующего в еврейском тексте глагола «зачала».
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: и нарекла ему имя Шела
  rationale: Сохранена формула «назвала его имя» в естественной для возвышенного повествовательного регистра русской форме; имя передано транслитерацией.
- source_word: וְהָיָה
  choice: А он находился
  rationale: Масоретский текст содержит форму мужского рода, поэтому в основном тексте сохранено «он»; конкретный мужской референт не уточняется, чтобы не снимать неоднозначность.
- source_word: בִכְזִיב
  choice: в Кезиве
  rationale: Название места כזיב передано как «Кезив»; предлог ב выражен обычным русским обозначением местонахождения «в».
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: когда она родила его
  rationale: Инфинитивная конструкция с ב имеет временное значение; перевод сохраняет женский субъект и мужское дополнение.
theological_decisions:
- issue: Субъект формы וְהָיָה
  choice: В основном тексте сохранено «он» согласно масоретской форме 3-го лица мужского рода.
  alternative: «Она находилась в Кезиве, когда родила его».
  rationale: Референт мужского местоимения не вполне ясен, а ряд древних свидетельств и толкователей понимает субъект как женщину. Вариант отмечен в сноске без устранения текстовой напряжённости.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «нарекла ему имя». Неоднозначность мужского субъекта сохранена; географическое название последовательно передано как «Кезив».
