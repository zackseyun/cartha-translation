base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: ru
  text: Спустя много дней[a] умерла дочь Шуи[b], жена Иуды. После того как Иуда утешился[c], он вместе со своим другом Хирой, адулламитянином, поднялся в Тимну к стригущим его овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и умножились дни»; возможно также: «спустя долгое время».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение: «дочь Шуи»; некоторые понимают его как личное имя «Бат-Шуа».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «Когда Иуда был утешен» или «И Иуда был утешен». Еврейский глагол означает, что он обрёл утешение после скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Спустя много дней
  rationale: Естественно передаёт еврейскую идиому «дни умножились», сохраняя указание на продолжительный промежуток времени.
- source_word: בַּת שׁוּעַ
  choice: дочь Шуи
  rationale: Еврейское выражение прозрачно обозначает родство; понимание его как имени «Бат-Шуа» возможно, но менее непосредственно.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Когда Иуда утешился после её смерти
  rationale: Нифаль глагола נחם здесь означает утешение после скорби, а не раскаяние; добавление «после её смерти» естественно проясняет подразумеваемый контекст.
- source_word: וַיַּעַל
  choice: отправился
  rationale: В данном русском контексте естественное обозначение пути; буквальное «поднялся» могло бы ошибочно восприниматься как вставание, хотя направление вверх остаётся возможным нюансом.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: к тем, кто стриг его овец
  rationale: Передаёт направленность к работникам, занятым стрижкой стада, не превращая Иуду в непосредственного исполнителя стрижки.
- source_word: הוּא וְחִירָה רֵעֵהוּ הָעֲדֻלָּמִי
  choice: он вместе со своим другом Хирой, адулламитянином
  rationale: Естественно воспроизводит совместное действие, личное имя, отношение между спутниками и происхождение Хиры.
- source_word: תִּמְנָתָה
  choice: в Тимну
  rationale: Направительное окончание при топониме выражает движение к Тимне; по-русски это естественно передаётся конструкцией «в Тимну».
theological_decisions:
- issue: Значение וַיִּנָּחֶם в контексте смерти жены
  choice: Иуда утешился после её смерти
  alternative: Иуда раскаялся / передумал
  rationale: Контекст утраты указывает на завершение или ослабление траура; значение раскаяния здесь не поддерживается контекстом.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно торжественным библейским звучанием. Родственное выражение «дочь Шуи» сохранено, а синтаксис адаптирован для естественного русского чтения.
