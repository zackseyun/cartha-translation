    issue: Безличная конструкция «ему дали имя» заменяет активный глагол единственного числа.
    rationale: В оригинале וַיִּקְרָא — активная форма 3-го лица мужского рода единственного числа. Личность субъекта остаётся невыраженной в тексте, но это не даёт оснований превращать действие в безлично-пассивное; «он назвал его» сохраняет и грамматику, и неопределённость референта.
