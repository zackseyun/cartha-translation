lexical_decisions:
- source_word: וְאַחַר
  choice: Потом
  rationale: Передаёт временную последовательность действий естественным современным русским языком.
- source_word: יָצָא אָחִיו
  choice: вышел его брат
  rationale: В контексте родов глагол יָצָא естественно означает появление ребёнка на свет; формулировка сохраняет прямую структуру исходного текста.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: тот, у которого на руке была алая нить
  rationale: Относительное придаточное опознаёт второго близнеца по алой нити. Слово «нить» восстановлено из непосредственного контекста Быт. 38:28.
- source_word: הַשָּׁנִי
  choice: алая нить
  rationale: Буквально это «алое» или «алая материя»; существительное «нить» подразумевается и прямо названо в предыдущем стихе.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: и ему дали имя
  rationale: Естественно передаёт древнееврейскую формулу «и он назвал его имя», не приписывая действие конкретному лицу, которое в контексте прямо не названо.
- source_word: זָרַח
  choice: Зерах
  rationale: Имя транслитерировано с древнееврейского, сохраняя конечный согласный ח.
theological_decisions:
- issue: Неуказанный субъект при וַיִּקְרָא
  choice: Безлично-пассивная формулировка «ему дали имя»
  alternative: «он назвал его имя» или «он назвал его Зерахом»
  rationale: Глагол имеет форму 3-го лица мужского рода единственного числа, однако лицо, давшее имя, не названо. Русская формулировка не отождествляет его без достаточных оснований ни с отцом, ни с повитухой, ни с братом.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Тире выделяет пояснительное определение близнеца, не нарушая последовательности исходного текста.
