base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: ru
  text: 'Когда она рожала, один из младенцев высунул руку[a]. Повитуха взяла и повязала ему на руку алую нить[b], сказав: «Этот вышел первым».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он дал руку»; это еврейский оборот, описывающий появление руки младенца. Возможный перевод: «показалась рука».'
    reason: lexical_alternative
  - marker: b
    text: Алую нить повязали как заметный знак, чтобы определить, кто из близнецов показался первым.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: когда она рожала
  rationale: Предлог בְּ с инфинитивом и суффиксом 3-го лица женского рода задаёт временное обстоятельство. Такой перевод естественно передаёт продолжающиеся роды.
- source_word: וַיִּתֶּן יָד
  choice: один из младенцев высунул руку
  rationale: Буквально оборот означает «он дал руку», но в контексте родов идиоматически описывает появление руки младенца. Добавление «один из младенцев» ясно обозначает грамматически мужской, но ещё не установленный субъект и не определяет, который это близнец.
- source_word: הַמְיַלֶּדֶת
  choice: повитуха
  rationale: Причастная форма от ילד обозначает женщину, помогающую при родах. «Повитуха» — точное и понятное обозначение в древнем повествовательном контексте без современных медицинских коннотаций слова «акушерка».
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: повязала ему на руку алую нить
  rationale: שָׁנִי обозначает алый материал или пряжу; существительное «нить» восполняется по контексту. Дательный оборот «ему на руку» естественен по-русски и сохраняет принадлежность руки младенцу.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: Этот вышел первым
  rationale: Указательное местоимение относится к ребёнку, а רִאשֹׁנָה употреблено наречно. Перевод не вводит отсутствующее в еврейском тексте статусное слово «первенец».
theological_decisions:
- issue: Определение первенства близнецов
  choice: Этот вышел первым
  alternative: Этот — первенец
  rationale: Текст сообщает наблюдаемую последовательность появления, но не употребляет термин, прямо обозначающий юридический или родовой статус первенца; поэтому такой статус не добавляется.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Слово «повитуха» сохранено как точное обозначение помощницы при родах в древнем контексте; синтаксис сделан ясным и естественным для обычного современного читателя.
