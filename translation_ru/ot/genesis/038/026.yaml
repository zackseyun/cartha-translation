base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: ru
  text: 'Иуда узнал их и сказал: «Она поступила справедливее, чем я[a], потому что я не выдал её замуж за Шелу, моего сына». И больше он не вступал с ней в близость[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Она более праведна, чем я».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не познавал её» — древнееврейский эвфемизм половых отношений.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: узнал эти вещи
  rationale: Глагол נכר означает, что Иуда узнал залоговые вещи, показанные ему в предыдущем стихе. Дополнение «эти вещи» восполняется из непосредственного контекста и звучит по-русски яснее, чем местоимение без явного антецедента.
- source_word: צָדְקָה מִמֶּנִּי
  choice: она правее меня
  rationale: Сравнительная конструкция с מִן показывает, что в данном деле Фамарь поступила справедливее Иуды. «Правее меня» сохраняет нравственную силу корня צדק, не превращая ситуативную оценку в утверждение о полной безгрешности.
- source_word: כִּי עַל כֵּן
  choice: потому что
  rationale: В данном контексте сочетание вводит объяснение признания Иуды; естественный русский причинный союз точно передаёт эту функцию.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: я не отдал её моему сыну Шеле
  rationale: Сохранена форма исходного текста «отдал её», тогда как брачный смысл понятен из повествования. Имя Шела поставлено в требуемую русской конструкцией дательную форму.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: и больше он не вступал с ней в близость
  rationale: ידע здесь является эвфемизмом половых отношений. Русское выражение передаёт смысл естественно и достойно; буквальный образ отмечен в сноске. «Больше не» передаёт сочетание יָסַף עוֹד.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: שֵׁלָה
  choice: Шела
  rationale: Устоявшаяся русская передача личного имени; в основном тексте употреблена падежная форма «Шеле».
theological_decisions:
- issue: Нравственная оценка в признании Иуды
  choice: Иуда признаёт, что в данном деле Фамарь правее его.
  alternative: «Она более праведна, чем я» либо понимание слов как объявления Фамари совершенно невиновной.
  rationale: Сравнительная формулировка относится к конкретной ситуации. Перевод сохраняет нравственную оценку, но не расширяет её до абсолютного богословского суждения о Фамари.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан естественным для широкого круга читателей; исходный эвфемизм разъяснён в сноске, а сравнительная нравственная оценка сохранена без догматического усиления.
