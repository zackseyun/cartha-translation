  - severity: medium
    issue: «Она правее меня»
    rationale: Хотя формально возможно и традиционно известно, в современном русском «правее» часто имеет политический оттенок и хуже передаёт нравственно-ситуативную оценку. «Она поступила справедливее, чем я» сохраняет сравнительную конструкцию и контекст.
