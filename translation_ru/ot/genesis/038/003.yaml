    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: Она зачала
  rationale: Глагол הרה означает зачатие или наступление беременности. «Зачала» кратко, естественно и соответствует достоинству повествовательного стиля.
- source_word: וַתֵּלֶד
  choice: и родила
  rationale: Глагол ילד в породе qal здесь означает «родить». Выбор передаёт последовательность событий и естественно сочетается со словом «сына».
- source_word: בֵּן
  choice: сына
  rationale: Слово בֵּן обозначает сына, то есть ребёнка мужского пола, и сохраняет семейный смысл исходного текста.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: и он назвал его
  rationale: Мужской род глагола сохранён местоимением «он». Идиоматическое русское «назвал его» точно передаёт еврейскую конструкцию «назвал его имя», не создавая ненужной буквальности.
- source_word: עֵר
  choice: Эром
  rationale: Имя עֵר передано принятой русской библейской формой «Эр»; творительный падеж обусловлен конструкцией «назвал его Эром».
theological_decisions:
- issue: Субъект глагола וַיִּקְרָא («назвал»)
  choice: 'Сохранён мужской субъект: «он назвал», наиболее естественно относящийся к Иуде.'
  alternative: «Она назвала» либо безличное «его назвали».
  rationale: В еврейском тексте глагол имеет форму мужского рода единственного числа, в отличие от предшествующих глаголов женского рода. Перевод сохраняет этот грамматический переход, не устраняя его ради стилистического сглаживания.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Формулировка понятна обычному читателю и сохраняет грамматическую неоднозначность в отношении явно не названного субъекта.
