  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: ru
  text: 'Он вернулся к Иуде и сказал: «Я не нашёл её, а местные жители сказали: „Здесь не было культовой блудницы[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. кедеша, букв. «посвящённая женщина». В данном контексте слово традиционно понимают как обозначение женщины, связанной с культовой сексуальной практикой; возможный перевод: «храмовая блудница».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Он вернулся
  rationale: Нарративная форма wayyiqtol продолжает последовательность событий; простое прошедшее время естественно передаёт её в современном русском.
- source_word: אֶל־יְהוּדָה
  choice: к Иуде
  rationale: Предлог אֶל выражает направленность, а имя יְהוּדָה передано в принятой русской библейской форме.
- source_word: לֹא מְצָאתִיהָ
  choice: Я не нашёл её
  rationale: Отрицательная перфектная форма сообщает о завершившемся безрезультатном поиске, не добавляя значения невозможности.
- source_word: וְגַם אַנְשֵׁי הַמָּקוֹם
  choice: И люди того места тоже
  rationale: Сохранено добавочное значение וְגַם. Сочетание אַנְשֵׁי הַמָּקוֹם буквально обозначает людей или мужчин данного места; «люди того места» звучит естественно и не исключает того, что речь идёт о местных мужчинах.
- source_word: לֹא הָיְתָה בָזֶה
  choice: Здесь не было
  rationale: Русская безличная конструкция естественно передаёт отрицание наличия женщины в этом месте; בָזֶה идиоматически передано словом «здесь».
- source_word: קְדֵשָׁה
  choice: культовая блудница
  rationale: Термин обозначает женщину, связанную с культовой сексуальной практикой, и в контексте отличается от обычного обозначения блудницы זֹנָה. «Культовая» сохраняет эту связь, не предполагая непременно формального храмового учреждения.
theological_decisions:
- issue: Характер обозначения קְדֵשָׁה
  choice: культовая блудница
  alternative: храмовая блудница; посвящённая женщина
  rationale: Выбранный вариант сохраняет культовый оттенок слова и отличие от זֹנָה, но не утверждает более узкую и спорную реконструкцию конкретной храмовой должности.
translation_notes:
  register: Современный литературный русский язык с простым повествовательным синтаксисом. Прямая речь оформлена естественно; лексически значимое различие между קְדֵשָׁה и обычным обозначением блудницы сохранено.
