  register: Современный литературный русский с достоинством библейского повествования. Выражение «принял её за» естественнее буквального «счёл её блудницей» и точно передаёт ошибочный вывод Иуды. Маркеры сносок не добавлены, поскольку существенной смысловой альтернативы, требующей публикационной сноски, здесь нет.
