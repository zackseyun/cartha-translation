  text: Увидев её, Иуда принял её за проститутку, потому что она закрыла своё лицо.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Увидев её, Иуда
  rationale: 'Деепричастный оборот естественно передаёт последовательность и временную связь двух повествовательных действий: Иуда увидел её и сделал вывод.'
- source_word: וַיַּחְשְׁבֶהָ לְזוֹנָה
  choice: принял её за блудницу
  rationale: Конструкция חשב с ל выражает суждение о том, кем является человек. Русское «принял её за» ясно передаёт ошибочное распознавание и сохраняет объектное местоимение.
- source_word: זוֹנָה
  choice: блудницу
  rationale: «Блудница» — традиционное, но по-прежнему понятное литературное обозначение женщины, занимающейся проституцией; оно не вносит современной социологической окраски выражения «секс-работница».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Иуда сделал такой вывод.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: она закрыла лицо
  rationale: Форма перфекта обозначает уже совершённое действие, послужившее основанием для вывода. В русском прошедшее время при ясной причинной связи естественно передаёт эту предшествующую ситуацию без громоздкой конструкции.
