base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: ru
  text: Но Онан знал, что потомство будет не его[a]. Поэтому всякий раз, когда он входил к жене своего брата, он проливал семя на землю[b], чтобы не дать потомства своему брату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя». Здесь имеется в виду потомство, то есть наследник в контексте брака с вдовой умершего брата.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейский текст говорит: «губил (уничтожал) [это] на землю»; объект прямо не назван. В контексте речь идёт о действии Онана, которым он предотвращал зачатие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: знал
  rationale: Прямое и естественное соответствие глаголу ידע в повествовательном контексте.
- source_word: הַזָּרַע / זֶרַע
  choice: потомство
  rationale: В первой и последней частях стиха זרע обозначает ребёнка или наследника, который по обычаю продолжил бы род умершего брата; «потомство» ясно передаёт этот семейно-правовой смысл.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: потомство будет не его
  rationale: 'Сохраняет формулировку и смысл исходного текста: родившийся наследник считался бы потомством умершего брата, а не Онана.'
- source_word: וְהָיָה אִם־בָּא
  choice: всякий раз, когда он входил
  rationale: Конструкция описывает повторявшееся действие; «всякий раз» естественно выражает итеративность.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: входил к жене своего брата
  rationale: Сохранён понятный библейский эвфемизм половой близости без грубости и без устранения образности оригинала.
- source_word: וְשִׁחֵת אַרְצָה
  choice: изливал семя на землю
  rationale: Глагол שחת буквально означает «губить, уничтожать, портить», а объект в еврейском тексте не назван. Контекст показывает действие, которым Онан предотвращал зачатие; русская формулировка передаёт его ясно, а буквальная особенность отмечена в сноске.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: чтобы не дать потомства своему брату
  rationale: Точно передаёт целевую конструкцию и сохраняет семейно-правовой смысл זרע.
theological_decisions:
- issue: Соотношение физического «семени» и потомства в стихе
  choice: В семейно-правовых частях перевести זרע как «потомство», а действие Онана передать как излитие семени на землю.
  alternative: Везде употребить «семя» либо буквально перевести действие как «губил [его] на землю».
  rationale: 'Стих связывает два уровня: наследника, который считался бы потомством умершего брата, и физическое действие, посредством которого Онан препятствовал зачатию. Выбранный перевод делает оба уровня понятными, не добавляя оценки мотивов или учения, которого сам стих прямо не формулирует.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Эвфемизм «входил к жене» сохраняет достоинство и образность оригинала; сноски поясняют буквальную лексику и не снимают существующую в еврейском тексте грамматическую недосказанность.
