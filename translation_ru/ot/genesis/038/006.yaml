  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: ru
  text: Иуда взял жену для Ира, своего первенца; её звали Фамарь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Основное значение глагола — «брать». В сочетании «взял жену для» он описывает действие Иуды по выбору или получению жены для сына, не добавляя прямо отсутствующего в тексте указания на формальную организацию брака.
- source_word: אִשָּׁה
  choice: жену
  rationale: В брачном контексте существительное означает именно «жену», а не просто «женщину».
- source_word: לְעֵר
  choice: для Ира
  rationale: Предлог לְ указывает здесь на того, для кого Иуда взял жену; «для Ира» естественно передаёт эту связь по-русски.
- source_word: בְּכוֹרוֹ
  choice: своего первенца
  rationale: Слово обозначает перворождённого сына. «Первенец» сохраняет семейный статус, выраженный в еврейском тексте.
- source_word: וּשְׁמָהּ
  choice: её звали
  rationale: Естественная современная русская передача еврейской именной формулы «и имя её».
- source_word: תָּמָר
  choice: Фамарь
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, узнаваемая современным читателем.
