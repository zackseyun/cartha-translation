base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: ru
  text: 'И он свернул к ней у дороги и сказал: «Позволь мне войти к тебе[a]», потому что не знал, что она его невестка. И она сказала: «Что ты дашь мне[b] за то, что войдёшь ко мне?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «войти к тебе»; это эвфемистическое выражение, означающее половую близость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Что ты заплатишь мне?» Буквально: «Что ты дашь мне?»'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: он свернул к ней с дороги
  rationale: Глагол נטה обозначает отклонение от пути в сторону Фамари; по-русски сочетание «свернул к ней с дороги» естественно передаёт и движение к ней, и дорожную обстановку.
- source_word: הָבָה נָּא
  choice: позволь мне
  rationale: Побудительно-просительная конструкция передана естественной современной просьбой без архаического оттенка.
- source_word: אָבוֹא אֵלַיִךְ
  choice: войти к тебе
  rationale: Сохранён еврейский эвфемизм בוא אל, который в данном контексте обозначает половую близость, но не выражает её прямо.
- source_word: כִּי לֹא יָדַע
  choice: потому что не знал
  rationale: כִּי вводит авторское объяснение поступка Иуды; причинный союз естественен в современном русском повествовании.
- source_word: כִּי כַלָּתוֹ הִוא
  choice: что она его невестка
  rationale: כַלָּה здесь означает жену сына, то есть невестку.
- source_word: מַה תִּתֶּן לִּי
  choice: что ты дашь мне
  rationale: Сохранено общее значение נתן «дать»; подразумеваемая плата поясняется в сноске, а не подставляется в основной текст.
- source_word: כִּי תָבוֹא אֵלָי
  choice: если войдёшь ко мне
  rationale: В вопросе כִּי естественно передать условно-обстоятельственным «если»; повторно сохранён эвфемизм «войти к».
