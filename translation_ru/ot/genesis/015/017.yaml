source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: ru
  text: Когда солнце зашло и наступила тьма, и вот, дымящаяся жаровня[a] и пылающий факел прошли между этими рассечёнными частями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «дымящаяся печь» или «дымящаяся огненная чаша». Еврейское слово обозначает печь или вместилище для огня.'
    reason: lexical_alternative
  - marker: b
    text: То есть между частями рассечённых животных, приготовленными ранее для заключения завета (см. Быт. 15:10).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда
  rationale: Повествовательная формула вместе со следующими обстоятельствами образует временной переход; «когда» естественно передаёт его по-русски без архаического «и было».
- source_word: הַשֶּׁמֶשׁ בָּאָה
  choice: солнце зашло
  rationale: Глагол בוא при слове «солнце» обозначает заход солнца; выбран обычный современный русский оборот.
- source_word: וַעֲלָטָה הָיָה
  choice: настала тьма
  rationale: עֲלָטָה означает тьму или мрак; динамический оборот сохраняет последовательность событий и не добавляет отсутствующего в тексте усиления.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Частица привлекает внимание к внезапно представшей картине и сохраняет торжественную наглядность рассказа.
- source_word: תַנּוּר עָשָׁן
  choice: дымящаяся печь
  rationale: תַנּוּר обозначает печь или вместилище для огня; «печь» — прямой и понятный эквивалент, а עָשָׁן передано естественным прилагательным.
- source_word: לַפִּיד אֵשׁ
  choice: пылающий факел
  rationale: לַפִּיד — факел; сочетание с אֵשׁ подчёркивает огонь, что естественно выражено словом «пылающий».
- source_word: אֲשֶׁר עָבַר
  choice: прошли
  rationale: Русское множественное число согласуется с составным подлежащим «печь и факел». Еврейская форма единственного числа при постпозитивном или составном субъекте не требует буквального нарушения русского согласования.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: между этими рассечёнными частями
  rationale: גְּזָרִים обозначает отделённые разрезанием части животных; явное «рассечёнными» связывает фразу с приготовлением жертв в Быт 15:10.
theological_decisions:
- issue: Природа огненных образов при заключении завета
  choice: Описать видимые образы, не называя их прямо явлением Бога.
  alternative: Истолковать дымящуюся печь и пылающий факел непосредственно как явление присутствия Господа.
  rationale: Контекст указывает на божественное действие при заключении завета, однако сам стих называет только видимые образы; описательный перевод сохраняет богословскую напряжённость текста.
- issue: К чему относится действие «прошёл»
  choice: 'Передать печь и факел как совместно движущиеся образы: «прошли».'
  alternative: 'Отнести относительное предложение только к ближайшему существительному — факелу: «факел, который прошёл».'
  rationale: Единственное число еврейского עָבַר допускается при таком построении, тогда как контекст ритуала и составная картина естественно указывают на совместное прохождение двух образов; примечание не требуется, поскольку буквальное единственное число в русском создало бы искусственную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вот» сохраняет наглядную силу еврейского הִנֵּה; двоеточие помогает представить последующий образ. Архаизмы и конфессионально окрашенные толкования исключены.
