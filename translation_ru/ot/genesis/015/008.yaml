  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: ru
  text: 'И он сказал: «Господи Яхве, как мне узнать, что я буду владеть ею?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По какому признаку мне узнать, что я унаследую её?»'
    reason: Передаёт возможное более конкретное значение בַּמָּה как вопроса об основании или признаке удостоверения и сохраняет лексический вариант «унаследую» для ירשׁ.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И он сказал
  rationale: Стандартная повествовательная форма от אמר продолжает рассказ; союз «и» сохраняет еврейское повествовательное течение, не придавая связи излишне сильного временного или противительного оттенка.
- source_word: אֲדֹנָי יֱהוִה
  choice: Владыка Яхве
  rationale: Сочетание титула אֲדֹנָי с личным именем Бога יהוה передано двумя различимыми элементами. «Владыка» естественно выражает обращение אֲדֹנָי и позволяет избежать неуклюжего повторения «Господь Господь».
- source_word: בַּמָּה אֵדַע
  choice: как мне узнать
  rationale: בַּמָּה буквально означает «по чему? / посредством чего?», а אֵדַע — «я узнаю / буду знать». Русское «как мне узнать» естественно передаёт просьбу указать основание или средство удостоверения, не превращая вопрос в выражение невозможности.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание знания, которого ищет Аврам; русское «что» является прямым и естественным соответствием.
- source_word: אִירָשֶׁנָּה
  choice: я буду владеть ею
  rationale: Глагол ירשׁ здесь относится к обещанной земле и допускает значения «овладеть», «владеть» и «унаследовать». «Буду владеть ею» ясно передаёт фактическое обладание землёй, а заветный оттенок «унаследую» сохранён в сноске.
theological_decisions:
- issue: Передача составного обращения אֲדֹנָי יֱהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Такой перевод сохраняет и титул, и личное имя Бога, не сливая их и не создавая неестественного повтора; при этом он не добавляет конфессионального толкования.
- issue: Характер вопроса Аврама
  choice: как мне узнать
  alternative: по чему я узнаю; как я могу узнать
  rationale: Формулировка сохраняет просьбу об удостоверяющем знаке и не решает сверх текста, выражает ли вопрос сомнение, просьбу о подтверждении или и то и другое.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обращения. Местоимение «ею» согласовано с землёй из предыдущего стиха. Архаизмы и искусственное калькирование синтаксиса избегаются.
