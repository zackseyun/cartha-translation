source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: ru
  text: 'И сказал Он Авраму: «Твёрдо знай: твои потомки будут пришельцами[a] в земле, которая им не принадлежит; их поработят[b] и будут угнетать четыреста лет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземцами», «поселенцами-иноземцами». Еврейское слово обозначает людей, живущих в земле, которая им не принадлежит.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заставят служить». Еврейский глагол может обозначать принудительную службу; в данном контексте речь идёт о порабощении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: И сказал Он Авраму
  rationale: Последовательная форма глагола продолжает повествование. Местоимение «Он» естественно указывает на говорящего из контекста и сохраняет торжественный повествовательный строй.
- source_word: יָדֹעַ תֵּדַע
  choice: Твёрдо знай
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает значение. «Твёрдо знай» естественно передаёт настойчивое заверение без архаической тяжеловесности.
- source_word: גֵר
  choice: пришельцами
  rationale: Слово обозначает людей, живущих не в своей земле среди другого населения. «Пришельцы» сохраняет идею чужеземного проживания и соответствует достоинству библейского регистра.
- source_word: זַרְעֲךָ
  choice: твои потомки
  rationale: Собирательное существительное זֶרַע здесь означает будущих потомков Аврама. Русское множественное число естественно согласуется с последующими местоименными формами.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: в земле, которая им не принадлежит
  rationale: Формулировка ясно и близко к еврейскому выражает отсутствие у потомков права владения этой землёй.
- source_word: וַעֲבָדוּם
  choice: их поработят
  rationale: Форма имеет неопределённый в самом предложении субъект во множественном числе и объект «их». Русская неопределённо-личная конструкция сохраняет это различие, не создавая двусмысленности относительно того, кто кого поработит.
- source_word: וְעִנּוּ אֹתָם
  choice: и будут угнетать
  rationale: Порода пиэль глагола ענה здесь выражает причинение страданий, притеснение или угнетение. «Угнетать» естественно передаёт продолжительное жестокое обращение.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: четыреста лет
  rationale: Длительность стоит в конце всего сочетания и в русском языке естественно воспринимается как период описанного порабощения и угнетения.
theological_decisions:
- issue: Кто подразумевается как субъект глаголов «поработят» и «будут угнетать»
  choice: Субъект оставлен невыраженным, как неопределённая группа людей в чужой земле
  alternative: Прямо назвать жителей чужой земли
  rationale: В еврейском тексте стоят глаголы третьего лица множественного числа с объектом «их», но сами угнетатели в этом стихе не названы. Неопределённо-личная русская конструкция сохраняет смысл и не добавляет к тексту излишней конкретизации.
- issue: К чему относится период в четыреста лет
  choice: Временное определение оставлено в конце объединённой фразы о порабощении и угнетении
  alternative: Связать четыреста лет только с угнетением либо со всем пребыванием в чужой земле
  rationale: Еврейский синтаксис допускает некоторое напряжение в области действия временного выражения. Позиция в конце фразы сохраняет эту особенность, не разрешая её искусственно.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены невыраженный субъект угнетения и возможная широта связи выражения «четыреста лет».
