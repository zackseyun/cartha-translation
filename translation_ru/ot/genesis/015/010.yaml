  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: ru
  text: И он привёл к Нему всех этих животных[a], рассёк их пополам и разложил половины каждого животного одну напротив другой[b], но птиц рассекать не стал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взял себе всех этих животных». Еврейское выражение допускает такой перевод, однако в контексте, вероятнее всего, речь идёт о том, что Аврам привёл животных к Богу, исполняя повеление предыдущего стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «положил каждую его рассечённую часть напротив соответствующей ей части».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: И он привёл к Нему всех этих животных
  rationale: Глагол буквально означает «взял», однако в контексте исполнения повеления из ст. 9 естественно передать действие как «привёл». Местоимение לוֹ контекстуально отнесено к Богу; «животных» проясняет референт выражения «всех этих».
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: рассёк их пополам
  rationale: בתר обозначает рассечение на части, а בַּתָּוֶךְ — разделение посередине. «Рассёк пополам» точно и естественно передаёт конкретное ритуальное действие.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: положил каждую половину напротив другой
  rationale: Распределительная конструкция אִישׁ ... רֵעֵהוּ означает «каждый/каждая ... напротив другого/другой»; בִּתְרוֹ здесь обозначает отсечённую часть, в данном контексте половину.
- source_word: וְאֶת הַצִּפֹּר לֹא בָתָר
  choice: но птиц рассекать не стал
  rationale: Единственное собирательное הַצִּפֹּר относится к двум птицам из предыдущего стиха, поэтому по-русски уместно множественное число. Формулировка сохраняет противопоставление предыдущему действию.
theological_decisions:
- issue: Обряд заключения завета
  choice: Описать рассечение и расположение половин конкретно, без богословского пояснения в основном тексте
  alternative: Добавить прямое указание, что это был обряд заключения завета
  rationale: Еврейский текст изображает подготовку обряда, но в самом стихе не объясняет его смысла; перевод сохраняет образ и не вносит толкование.
- issue: Референт местоимения לוֹ
  choice: «к Нему», то есть к Богу
  alternative: «для себя»
  rationale: Хотя дательный оттенок допускает более буквальное «для него/себя», ближайший контекст повеления Бога «возьми Мне» в ст. 9 поддерживает значение «к Нему». Альтернатива отмечена в сноске для сохранения грамматической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавная буква в «Нему» проясняет принятую контекстуальную отнесённость местоимения к Богу; синтаксис остаётся простым и доступным.
