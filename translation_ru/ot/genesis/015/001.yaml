  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: ru
  text: 'После этих событий слово Яхве пришло к Авраму в видении: «Не бойся, Аврам. Я — щит для тебя; награда твоя будет очень велика»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я — твой щит; награда твоя чрезвычайно велика». Традиционное альтернативное членение: «Я — твой щит и твоя чрезвычайно великая награда».'
    reason: Еврейская безглагольная конструкция допускает передачу второй части в настоящем времени; также существует традиционное альтернативное членение, при котором «награда» относится к Яхве.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: דְּבָרִים может означать слова, дела или события; в данном повествовательном контексте естественное русское «событий» указывает на предшествующие происшествия, не добавляя лишних подробностей.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохранена узнаваемая формула откровения и личное имя Бога, представленное в еврейском тексте тетраграмматоном.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: было к Авраму
  rationale: Формальная библейская конструкция передаёт направленность откровения и остаётся понятной в современном литературном русском; она также сохраняет «слово Яхве» как грамматический субъект.
- source_word: בַּמַּחֲזֶה
  choice: в видении
  rationale: Существительное обозначает зрительное откровение; неопределённость естественно передаётся по-русски без артикля.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Прямой запрет передан естественной современной русской формой без архаизации.
- source_word: מָגֵן לָךְ
  choice: щит для тебя
  rationale: В еврейском у слова «щит» нет притяжательного суффикса; формулировка сохраняет конструкцию с לָךְ и не превращает её без необходимости в «твой щит».
- source_word: שְׂכָרְךָ
  choice: награда твоя
  rationale: В данном контексте «награда» лучше, чем узкие «плата» или «заработок», передаёт обещание, а порядок слов поддерживает достоинство речи.
- source_word: הַרְבֵּה מְאֹד
  choice: будет очень велика
  rationale: Еврейская безглагольная конструкция требует по-русски связки; будущее время соответствует обещанию, но альтернативное настоящее отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Синтаксис выражения אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: Я — щит для тебя; награда твоя будет очень велика
  alternative: Я — твой щит и твоя чрезвычайно великая награда
  rationale: 'Масоретский текст наиболее естественно допускает два высказывания: Бог служит Авраму щитом, а награда Аврама будет велика. Однако краткость безглагольной еврейской конструкции породила чтение, при котором сам Бог назван наградой; эта богословски значимая неоднозначность сохранена в сноске.'
- issue: Временное значение безглагольной фразы שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: награда твоя будет очень велика
  alternative: награда твоя чрезвычайно велика
  rationale: Будущее время естественно в контексте обещания, хотя в еврейском тексте время явно не выражено; альтернативная передача без будущей связки дана в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Формула «слово Яхве было к Авраму» намеренно близка к структуре оригинала, но остаётся ясной; прямая речь проста и естественна.
