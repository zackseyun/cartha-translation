  source_fidelity: Перевод точно передаёт противопоставительно-тематическое «а ты», образное движение «к своим отцам», обстоятельство «с миром», пассивное «будешь погребён» и указание на благополучную преклонную старость. Формула не превращается ни в простое «умрёшь», ни в утверждение о конкретном посмертном состоянии.
