  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: ru
  text: А ты отойдёшь к своим отцам[a] с миром и будешь погребён в доброй старости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к своим предкам». Буквально: «к своим отцам» — образное выражение, обозначающее смерть и присоединение к прежним поколениям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Союз с самостоятельным местоимением отмечает переход от судьбы потомков Аврама к нему самому; «А ты» естественно передаёт это тематическое противопоставление.
- source_word: תָּבוֹא
  choice: отойдёшь
  rationale: Буквально глагол означает «придёшь», но в сочетании «к своим отцам» речь идёт о смерти. «Отойдёшь» сохраняет образ движения и звучит в русском как сдержанная формула смерти.
- source_word: אֶל־אֲבֹתֶיךָ
  choice: к своим отцам
  rationale: Передаёт буквальный семейный образ еврейского выражения, не заменяя его истолкованием «к предкам».
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Сохраняет ёмкость שָׁלוֹם — мир, благополучие и целостность — и естественно сочетается с глаголом «отойдёшь».
- source_word: תִּקָּבֵר
  choice: будешь погребён
  rationale: Точно передаёт пассивную форму глагола קבר; «погребён» соответствует достоинству библейского повествования и понятно современному читателю.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: в доброй старости
  rationale: Сохраняет как указание на преклонный возраст, так и положительную оценку, выраженную прилагательным טוֹבָה.
theological_decisions:
- issue: Значение выражения «отойдёшь к своим отцам»
  choice: Сохранена традиционная образная формула смерти и присоединения к прежним поколениям без уточнения состояния после смерти.
  alternative: Передать как «умрёшь» или истолковать как сознательное общение с предками после смерти.
  rationale: Аврам не будет погребён вместе со своими ближайшими предками, поэтому выражение шире физического захоронения; однако сам стих не раскрывает подробного учения о посмертном состоянии.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Формула «отойдёшь к своим отцам» сохраняет исходный образ; синтаксис сделан плавным и естественным.
