  text: И поверил Аврам Господу[a], и Он вменил ему это в праведность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положился на Господа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально подлежащее при слове «вменил» не названо. Обычно смысл понимают так: Господь вменил веру Аврама ему в праведность. Менее вероятное толкование считает подлежащим Аврама; при таком понимании точный смысл дополнения остаётся спорным.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: И поверил Аврам
  rationale: Hiphil глагола אמן с предлогом ב обозначает доверие или веру в кого-либо. «Поверил» прямо и естественно передаёт смысл и сохраняет связь с последующим библейским употреблением. Имя «Аврам» восстановлено из контекста для ясности по-русски.
- source_word: בַּיהוָה
  choice: Господу
  rationale: Предлог ב при אמן указывает на того, кому верят или доверяют. В русском языке управление глагола «поверить» требует дательного падежа. Имя יהוה передано традиционным библейским соответствием «Господь».
- source_word: וַיַּחְשְׁבֶהָ
  choice: и Он вменил … это
  rationale: חשב здесь означает считать, засчитывать или вменять. «Вменил» сохраняет образ отнесения на чей-либо счёт, оставаясь понятным в данном устойчивом библейском выражении. Местоимение женского рода в еврейском тексте относится к предшествующему акту веры или доверию; нейтральное русское «это» не добавляет отсутствующего в тексте существительного «вера».
- source_word: לּוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом обозначает лицо, которому нечто засчитывается; русский дательный «ему» естественно выражает это отношение.
- source_word: צְדָקָה
  choice: в праведность
  rationale: צְדָקָה здесь означает праведность. Сочетание «вменил в праведность» точно сохраняет учётно-оценочный смысл конструкции и её узнаваемую межтекстовую связь.
theological_decisions:
- issue: Подлежащее при «вменил»
  choice: Подлежащее — Господь; для ясности оно выражено местоимением «Он».
  alternative: 'Аврам — подлежащее: он счёл Его или это праведностью.'
  rationale: Контекст и преобладающее синтаксическое понимание указывают на Господа как субъекта действия. Однако древнееврейский текст не повторяет подлежащее явно, поэтому менее вероятная альтернатива отмечена в сноске.
- issue: Референт суффикса в וַיַּחְשְׁבֶהָ
  choice: «это» относится к вере или доверию Аврама как к предшествующему действию.
  alternative: Суффикс может шире указывать на весь отклик Аврама; возможен менее определённый перевод без называния «веры».
  rationale: В древнееврейском местоименный суффикс женского рода способен указывать на абстрактное действие или событие. «Это» сохраняет такую широту и не вводит в основной текст существительное, которого в оригинале нет.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. «Поверил Господу» естественно передаёт управление оригинала; «вменил в праведность» сохраняет точность и каноническую узнаваемость, а местоимение «Он» предотвращает неясность основного чтения. Все маркеры сносок размещены в основном тексте.
