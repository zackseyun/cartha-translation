    text: 'Буквально: «до сюда»; оборот употреблён во временном смысле: беззаконие ещё не достигло полноты до этого времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: А в четвёртом поколении
  rationale: דּוֹר означает «поколение», а רְבִיעִי — «четвёртое». Предлог «в» естественно передаёт временное значение оборота в русском контексте; союз וְ передан как «А» для связи с предшествующим пророчеством.
- source_word: יָשׁוּבוּ
  choice: они возвратятся
  rationale: Форма от שׁוּב обозначает возвращение. «Возвратятся» сохраняет значение движения обратно в обещанную землю, не добавляя не выраженных в тексте подробностей.
- source_word: הֵנָּה
  choice: сюда
  rationale: Указательное наречие обозначает направленность к месту, где находится Аврам; русское «сюда» точно и естественно передаёт это значение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит прямо названную причину отсрочки возвращения. «Потому что» ясно выражает причинную связь в современном русском языке.
- source_word: לֹא שָׁלֵם
  choice: ещё не достигло полноты
  rationale: שָׁלֵם здесь указывает на полноту или завершённость. Русский оборот передаёт смысл без чрезмерно буквального и неестественного «не полно»; «ещё» выражает временную незавершённость.
- source_word: עֲוֹן
  choice: беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину или последствие вины. В данном контексте речь идёт о нравственном зле, поэтому «беззаконие» сохраняет необходимую смысловую широту.
- source_word: הָאֱמֹרִי
  choice: амореев
  rationale: Единственное число с определённым артиклем употреблено собирательно о народе. В русском языке естественно назвать народ формой множественного числа; буквальная форма отмечена в сноске.
- source_word: עַד הֵנָּה
  choice: до сих пор
  rationale: Буквально пространственный указательный оборот «до сюда» идиоматически выражает временной предел — «доныне, до сих пор». Сочетание с «ещё не» передаёт мысль о том, что полнота пока не достигнута.
theological_decisions:
- issue: Причина отсрочки возвращения потомков Аврама
  choice: Срок возвращения связан с тем, что беззаконие амореев пока не достигло полноты.
  alternative: Объяснить отсрочку прежде всего Божьим долготерпением к амореям либо формированием Израиля в Египте.
  rationale: Стих непосредственно связывает время возвращения с незавершённостью беззакония амореев. Перевод сохраняет это утверждение и не вводит более широкого богословского объяснения, которого в самом стихе нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; причинная связь и временная незавершённость выражены прямо, без добавления конфессионального толкования.
