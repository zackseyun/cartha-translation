  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: ru
  text: А в четвёртом поколении они возвратятся сюда, потому что беззаконие амореев[a] ещё не достигло полноты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «аморея»; единственное число здесь может собирательно обозначать весь народ.'
