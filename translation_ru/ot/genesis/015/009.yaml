    text: 'Буквально: «возьми для Меня». По смыслу здесь требуется принести или доставить животных для обряда заключения завета.'
    reason: lexical_alternative
  - marker: b
    text: Повторённое еврейское слово традиционно понимается здесь как указание на то, что каждому из трёх животных было по три года.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: И Он сказал ему
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; местоименное дополнение передано прямо, без добавления имени Аврама, которого определяет контекст.
- source_word: קְחָה לִי
  choice: Приведи Мне
  rationale: Буквально выражение означает «возьми для Меня», но в данном контексте речь идёт о том, чтобы доставить перечисленных животных для обряда; «приведи» естественно передаёт этот смысл.
- source_word: עֶגְלָה
  choice: тёлку
  rationale: Существительное обозначает молодое животное крупного рогатого скота женского пола; «тёлка» — точный и общеупотребительный русский эквивалент.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: трёхлетнюю / трёхлетнего
  rationale: В перечне животных повторённая форма традиционно понимается как указание на возраст — три года; согласование в русском передаёт род каждого существительного.
- source_word: עֵז
  choice: козу
  rationale: Еврейское существительное женского рода обозначает козу; русское слово ясно передаёт и вид, и пол животного.
- source_word: אַיִל
  choice: барана
  rationale: Обычное обозначение взрослого самца овцы, в том числе в обрядовом контексте.
- source_word: תֹר
  choice: горлицу
  rationale: Это видовое обозначение горлицы, а не общее слово для любого голубя.
- source_word: גוֹזָל
  choice: молодого голубя
  rationale: Само слово может обозначать птенца или молодую птицу, но в устойчивом обрядовом сочетании с горлицей контекстуально указывает на молодого голубя.
