base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: ru
  text: 'И Он сказал ему: «Я — Яхве[a], Который вывел тебя из Ура Халдейского, чтобы дать тебе эту землю во владение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционная передача: «Господь». В еврейском тексте стоит личное имя Бога — יהוה (Яхве).'
    reason: divine_name
  - marker: b
    text: 'Возможные переводы: «чтобы ты унаследовал её» или «чтобы ты овладел ею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: И Он сказал ему
  rationale: Повествовательная форма продолжает рассказ; местоименное дополнение אֵלָיו прямо передано как «ему».
- source_word: אֲנִי יְהוָה
  choice: Я — Яхве
  rationale: Безглагольное именное предложение естественно передано по-русски с тире; личное имя יהוה транслитерировано как «Яхве».
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: Который вывел тебя
  rationale: Форма породы hифиль от יצא означает, что говорящий сделал так, чтобы Аврам вышел; «вывел» кратко и точно передаёт это значение.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: из Ура Халдейского
  rationale: Это закрепившаяся и понятная русская передача названия «Ур халдеев»; она сохраняет географическое обозначение без лишнего пояснения в тексте.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: чтобы дать тебе эту землю
  rationale: Инфинитив с ל выражает цель; русская конструкция с «чтобы» ясно передаёт целевое отношение.
- source_word: לְרִשְׁתָּהּ
  choice: чтобы ты получил её во владение
  rationale: ירשׁ допускает значения получения наследства, овладения и вступления во владение. Выбранная формулировка сохраняет идею фактического обладания, не сводя её только к наследованию или завоеванию; местоименный суффикс передан словом «её».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит собственное имя יהוה. Транслитерация сохраняет различие между именем Бога и титулом «Господь»; традиционная замена указана в сноске.
- issue: Смысл לְרִשְׁתָּהּ применительно к обещанной земле
  choice: чтобы ты получил её во владение
  alternative: чтобы ты унаследовал её; чтобы ты овладел ею
  rationale: Контекст соединяет Божий дар и будущее обладание землёй. Перевод не ограничивает смысл ни наследованием в узком семейно-правовом смысле, ни завоеванием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные местоимения «Он» и «Который» относятся к Богу и соответствуют принятой русской издательской традиции; синтаксис остаётся понятным обычному читателю.
