  yaml_path: translation/ot/genesis/015/021.yaml
  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: ru
  text: и амореев, и хананеев, и гиргашеев, и иевусеев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: и
  rationale: וְ продолжает перечисление, а אֶת обозначает определённое прямое дополнение и отдельно на русский не переводится. Повтор союза «и» сохраняет структуру еврейского перечня.
- source_word: הָאֱמֹרִי
  choice: амореев
  rationale: Еврейское собирательное название народа стоит в единственном числе, но в данном перечне по-русски естественно передаётся формой множественного числа; винительный падеж обусловлен продолжающимся из предыдущего стиха управлением.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Собирательный этноним передан общепринятой русской формой множественного числа в винительном падеже.
- source_word: הַגִּרְגָּשִׁי
  choice: гергесеев
  rationale: Выбрана закрепившаяся в русской библейской традиции форма этнонима, понятная современному читателю; множественное число передаёт собирательное значение.
- source_word: הַיְבוּסִי
  choice: иевусеев
  rationale: Этноним передан общепринятой русской библейской формой во множественном числе и винительном падеже.
