  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: ru
  text: и хеттеев, и ферезеев, и рефаимов[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполинов». Еврейское слово «рефаим» в некоторых контекстах может пониматься как описательное обозначение, однако здесь оно, скорее всего, является названием народа, жившего в этой земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: и
  rationale: Союз וְ продолжает перечень народов, а показатель прямого дополнения אֵת отдельно не переводится. В русском повторение «и» сохраняет структуру и ритм еврейского списка.
- source_word: הַחִתִּי
  choice: хеттеев
  rationale: Форма единственного числа с артиклем употреблена собирательно и обозначает народ; в данном синтаксическом окружении естественна форма множественного числа в винительном падеже.
- source_word: הַפְּרִזִּי
  choice: ферезеев
  rationale: Этноним в единственном числе имеет собирательное значение. Традиционная русская форма «ферезеи» передана во множественном числе и в падеже, требуемом продолжающимся перечнем.
- source_word: הָרְפָאִים
  choice: рефаимов
  rationale: В перечне народов земли слово естественнее понимать как этноним. Транслитерация сохраняет его характер как названия народа и не вносит толкование «исполины» непосредственно в текст.
theological_decisions:
- issue: Следует ли передавать רְפָאִים как название народа или как описательное обозначение
  choice: Название народа «рефаимы»
  alternative: «исполины»
  rationale: В Бытии 15:19–21 перечисляются народы, населявшие обещанную Авраму землю, поэтому этническое понимание здесь вероятнее. Традиционное толкование «исполины» сохранено в примечании, чтобы не устранять смысловую возможность.
translation_notes:
  register: Современный литературный русский язык с традиционными и узнаваемыми библейскими этнонимами. Повторяющийся союз «и» передаёт структуру продолжающегося древнееврейского перечня; конечная запятая показывает, что список продолжается в следующем стихе.
