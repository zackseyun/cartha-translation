    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «великий ужас тьмы» или «великий ужас и тьма». Еврейская фраза ярко и сжато соединяет представления об ужасе и мраке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Когда солнце клонилось к закату
  rationale: Оборот вводит временной фон сцены; инфинитив בוא при слове «солнце» указывает на приближение заката. Русское выражение естественно передаёт процесс, не добавляя отдельного «теперь».
- source_word: תַרְדֵּמָה
  choice: глубокий сон
  rationale: Слово обозначает тяжёлый, необычайно глубокий сон, который в библейском контексте может быть наведён Богом; «сон» остаётся наиболее прямым переводом, не предрешающим, был ли это транс.
- source_word: נָפְלָה עַל אַבְרָם
  choice: на Аврама напал
  rationale: Сохранена образность идиомы «пасть на кого-либо», но использовано естественное русское сочетание «напал сон».
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт внезапное, яркое привлечение внимания и сохраняет торжественную повествовательную интонацию.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: великий мрачный ужас
  rationale: Компактное сочетание сохраняет тесную связь ужаса и тьмы в еврейской фразе. «Мрачный» позволяет передать חֲשֵׁכָה без искусственной для русского языка цепочки существительных.
- source_word: נֹפֶלֶת עָלָיו
  choice: на него опустился
  rationale: Глагол сохраняет пространственный образ того, что нисходит на Аврама; совершенный вид звучит естественно в русском повествовании, тогда как причастная форма оригинала придаёт сцене наглядность.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Использована традиционная русская библейская форма имени, соответствующая данному этапу повествования до переименования в Авраама.
theological_decisions:
- issue: Характер תַרְדֵּמָה в контексте откровения
  choice: глубокий сон
  alternative: транс
  rationale: Контекст связан с видением и заключением завета, однако само существительное прежде всего означает глубокий сон. Перевод «транс» сильнее истолковывал бы состояние Аврама, поэтому он оставлен в примечании.
- issue: Соотношение ужаса и тьмы в אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: великий мрачный ужас
  alternative: великий ужас и тьма; великий ужас тьмы
  rationale: Еврейская конструкция сжато соединяет ужас и тьму и допускает несколько синтаксических осмыслений. Основной текст сохраняет их единство, а альтернативы указаны в примечании без догматического уточнения природы переживания.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественной библейской интонацией. Архаическое «и было» не воспроизводится механически; «И вот» сохранено как значимый маркер внезапного восприятия. Повтор образа нисхождения передан разными естественными русскими глаголами: «напал» и «опустился».'
