  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: ru
  text: Когда солнце клонилось к закату, на Аврама пал глубокий сон[a]. И вот, на него опускался великий мрачный ужас[b].
  philosophy: optimal-equivalence
  footnotes:
