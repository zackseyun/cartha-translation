lexical_decisions:
- source_word: וַיֵּרֶד
  choice: слетелись
  rationale: Глагол ירד обозначает движение вниз. В сочетании с собирательным обозначением птиц русское «слетелись» естественно передаёт их спуск к тушам, хотя добавляет оттенок множественного прибытия, подразумеваемый контекстом.
- source_word: הָעַיִט
  choice: хищные птицы
  rationale: עַיִט — формально единственное число, способное иметь собирательное значение. «Хищные птицы» сохраняет широкое значение и не сужает его до стервятников.
- source_word: הַפְּגָרִים
  choice: тушам
  rationale: פֶּגֶר означает мёртвое тело или тушу. Здесь речь идёт о заколотых животных, поэтому «туши» точнее и естественнее, чем «трупы» или нейтральные «части».
- source_word: וַיַּשֵּׁב אֹתָם
  choice: отгонял их
  rationale: Порода хифиль глагола שוב выражает побуждение повернуть назад. «Отгонял» естественно передаёт активное действие Аврама; несовершенный вид уместно описывает повторяющееся или продолжавшееся действие.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Сохранена традиционная русская библейская форма имени до его переименования в Авраама.
