  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: ru
  text: 'Но Аврам сказал: «Владыка Яхве, что Ты дашь мне, ведь я остаюсь бездетным, а наследник моего дома[a] — Элиэзер из Дамаска?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «сын мешека моего дома»: выражение необычно, а значение слова «мешек» неясно; возможно: «управляющий моего дома» или «владелец (наследник) моего дома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Аврам сказал
  rationale: Последовательная форма продолжает повествование, а союз «но» естественно передаёт переход от Божьего обещания к обеспокоенному ответу Аврама.
- source_word: אֲדֹנָי יֱהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» сохраняет личное Божье имя יֱהוִה; сочетание звучит ясно и достойно по-русски.
- source_word: מַה תִּתֶּן לִי
  choice: что ты дашь мне?
  rationale: Имперфект в данном контексте естественно выражает будущее действие.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: Ведь я так и остаюсь бездетным
  rationale: Фраза описывает продолжающуюся жизнь Аврама без потомства и подразумеваемое приближение смерти. Русское выражение передаёт смысл естественно, не превращая намёк на смерть в прямое утверждение.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: наследник моего дома
  rationale: Редкое и неясное выражение буквально связано с «сыном» и «владением/распоряжением». Контекст следующего стиха указывает на наследование имущества; неоднозначность сохранена в сноске.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: Элиэзер из Дамаска
  rationale: Так естественно передаётся связь Элиэзера с Дамаском без уточнения, идёт ли речь строго о месте рождения или о другой принадлежности.
theological_decisions:
- issue: Передача сочетания אֲדֹנָי יֱהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь Яхве
  rationale: Выбранный вариант различает титул и личное Божье имя, не заменяя тетраграмматон общим обозначением «Бог».
- issue: Статус Элиэзера в доме Аврама
  choice: наследник моего дома
  alternative: управляющий моего дома; владелец моего дома; сын владения моего дома
  rationale: Контекст поддерживает значение наследника, однако необычность еврейского выражения и возможные иные оттенки открыто отмечены в сноске.
