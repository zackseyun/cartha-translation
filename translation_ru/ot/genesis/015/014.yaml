id: GEN.15.14
reference: Genesis 15:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: ru
  text: Но Я также буду судить народ, которому они будут служить[a]; после этого они выйдут с большим имуществом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у которого они будут в рабстве». Еврейский глагол буквально означает «служить», но в данном контексте речь идёт о подневольном служении чужому народу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с большим богатством»; «с обильными пожитками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Но Я также
  rationale: Сочетание продолжает речь и одновременно противопоставляет грядущий суд прежнему сообщению об угнетении потомков Аврама; «также» сохраняет добавочное значение גַם.
- source_word: הַגּוֹי
  choice: народ
  rationale: גּוֹי обозначает народ или нацию; в данном контексте естественное русское «народ» указывает на чужую общность, которой будут служить потомки Аврама.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: которому они будут служить
  rationale: Глагол עבד в породе qal буквально означает «служить, работать». Дательный оборот естественен по-русски и не делает подразумеваемое рабство частью основного текста.
- source_word: דָּן אָנֹכִי
  choice: Я также буду судить
  rationale: Причастие דָּן с явным אָנֹכִי подчёркивает действующее лицо и в данном пророческом контексте имеет будущее значение. «Судить» сохраняет судебный оттенок и не сужает смысл до одного наказания.
- source_word: וְאַחֲרֵי כֵן
  choice: после этого
  rationale: Фраза ясно обозначает последующую временную ступень; по-русски союз перед точкой с запятой не обязателен, а последовательность сохраняется.
- source_word: יֵצְאוּ
  choice: они выйдут
  rationale: Прямое и естественное соответствие יצא, обозначающее выход из страны и подневольного положения.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: с большим имуществом
  rationale: רְכוּשׁ — имущество, собственность, нажитое добро; «большое имущество» сохраняет конкретность выражения лучше, чем отвлечённое «богатство».
theological_decisions:
- issue: Характер Божьего действия по отношению к угнетающему народу
  choice: буду судить
  alternative: накажу
  rationale: Еврейское דָּן имеет судебное значение. «Буду судить» сохраняет юридико-нравственную формулировку и не предрешает в переводе конкретный исход суда.
- issue: Характер служения потомков Аврама чужому народу
  choice: которому они будут служить
  alternative: у которого они будут в рабстве
  rationale: Основной текст сохраняет буквальное значение עבד, тогда как контекстуальное указание на принудительный труд и рабство вынесено в примечание, чтобы не устранить лексическую широту глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным и естественным; прописная «Я» отражает принятую русскую традицию при передаче Божьей речи. Смысловые альтернативы сохранены в примечаниях.
