base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: ru
  text: 'В тот день Яхве заключил завет с Аврамом[a], сказав: «Твоему потомству Я отдал эту землю — от реки Египта[b] до великой реки — Евфрата».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «разрезал завет» — устойчивое выражение со значением «заключил завет», вероятно связанное с описанным в этом отрывке обрядом рассечения животных.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «от Египетского потока» или «от Египетского вади». В еврейском тексте стоит «река Египта», однако точное географическое место остаётся предметом споров.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественное русское обозначение конкретного времени, близкое к форме еврейского выражения.
- source_word: כָּרַת ... בְּרִית
  choice: заключил завет
  rationale: Нормативный русский эквивалент еврейской идиомы «разрезал завет»; буквальный образ отмечен в сноске ввиду его связи с ритуалом в контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: לְזַרְעֲךָ
  choice: твоему потомству
  rationale: Сохраняет собирательное значение единственного числа זֶרַע и естественно звучит по-русски.
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Прошедшее совершенного вида передаёт перфект как торжественное объявление дара уже установленным и несомненным, не превращая форму в простое будущее обещание.
- source_word: הָאָרֶץ הַזֹּאת
  choice: эту землю
  rationale: В контексте территориального обещания «земля» является прямым и естественным соответствием.
- source_word: מִנְּהַר מִצְרַיִם
  choice: от реки Египетской
  rationale: נָהָר обычно означает «река»; традиционный русский порядок слов обеспечивает ясное географическое наименование. Спорная идентификация отмечена в сноске.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: до великой реки, реки Евфрат
  rationale: Сохраняет и определение «великая», и пояснительное наименование Евфрата, присутствующие в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Временной аспект заветного дара נָתַתִּי
  choice: Я отдал
  alternative: Я отдаю; Я дал
  rationale: Еврейский перфект представляет дар как совершившийся и несомненный в заветном провозглашении. Совершенный вид сохраняет эту силу, тогда как контекст не требует превращать высказывание в будущее время.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет структуру заветного провозглашения; архаизмы и конфессионально окрашенные замены избегаются.
