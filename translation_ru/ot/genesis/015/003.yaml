  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: ru
  text: 'И сказал Аврам: «Вот, Ты не дал мне потомства, и вот, человек из моего дома[a] будет моим наследником».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын моего дома наследует меня»; то есть: «человек из моего дома будет моим наследником».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Ваййиктоль с וַ продвигает повествование; традиционное и естественное русское «И сказал» сохраняет связь с предыдущей речью.
- source_word: הֵן ... וְהִנֵּה
  choice: Вот ... и вот
  rationale: Повтор «вот» передаёт два эмфатических указательных оборота и сохраняет их риторический параллелизм.
- source_word: לִי לֹא נָתַתָּה זָרַע
  choice: Ты не дал мне потомства
  rationale: זֶרַע буквально означает «семя», но здесь обозначает потомство; русское собирательное существительное естественно передаёт смысл.
- source_word: בֶן בֵּיתִי
  choice: человек из моего дома
  rationale: Буквально «сын моего дома». В данном контексте это член домохозяйства; перевод не уточняет его социальный статус как раба, поскольку в стихе это прямо не сказано.
- source_word: יוֹרֵשׁ אֹתִי
  choice: наследником моим становится
  rationale: Причастная конструкция буквально описывает того, кто «наследует меня». Идиоматический русский перевод передаёт смысл, не превращая фразу лишь в отвлечённое будущее утверждение.
theological_decisions:
- issue: Статус будущего наследника Аврама
  choice: человек из моего дома
  alternative: раб, родившийся в моём доме
  rationale: Текст говорит «сын моего дома», не употребляя здесь отдельного слова «раб»; поэтому более узкий социальный статус не вносится в перевод.
- issue: Объект наследования в выражении יוֹרֵשׁ אֹתִי
  choice: наследником моим становится
  alternative: унаследует меня; унаследует моё имущество
  rationale: Буквальное «наследует меня» необычно для современного русского и может быть непонятно, тогда как «наследником моим становится» сохраняет личную направленность выражения и не сводит наследование только к имуществу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Обращение к Богу отмечено прописным «Ты» по принятой русской издательской традиции. Повтор «вот» намеренно сохранён.
