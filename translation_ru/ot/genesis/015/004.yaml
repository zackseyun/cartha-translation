  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: ru
  text: 'И вот, было к нему слово ГОСПОДА: «Не он будет твоим наследником, но тот, кто произойдёт из тебя, — он будет твоим наследником».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет вводную формулу, отмечающую неожиданное божественное обращение, и естественно звучит в русском повествовании.
- source_word: דְבַר יְהוָה
  choice: слово ГОСПОДА
  rationale: Передаёт устойчивую пророческую формулу; тетраграмматон представлен традиционным титулом прописными буквами.
- source_word: זֶה
  choice: он
  rationale: Указательное местоимение относится к ранее названному человеку; русский вариант без добавления слова «человек» остаётся ясным в контексте.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: тот, кто произойдёт из тебя
  rationale: Еврейская идиома буквально говорит о выходящем «из твоих внутренностей»; выбран естественный русский способ обозначить собственного потомка, не уточняя пол сверх контекста.
- source_word: יִירָשְׁךָ
  choice: будет твоим наследником
  rationale: В данном контексте глагол ירש означает наследование Авраму; именная русская конструкция естественна и сохраняет повтор.
theological_decisions:
- issue: Характер обещанного родства
  choice: «тот, кто произойдёт из тебя»
  alternative: «твой родной сын»
  rationale: Источник прямо подчёркивает происхождение от Аврама, но в этом стихе не употребляет слово «сын»; перевод не вносит более узкого уточнения преждевременно.
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционное русское библейское обозначение сохраняет отличие тетраграмматона посредством прописных букв, не навязывая спорную реконструкцию произношения.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Синтаксис упрощён до естественного русского, при этом сохранены вводное «И вот», формула божественного слова, противопоставление и повтор утверждения о наследнике.
