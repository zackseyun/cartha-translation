lexical_decisions:
- source_word: אֶת / וְאֶת / וְאֵת
  choice: '[отдельно не переводится; союзы переданы как «и»]'
  rationale: אֵת служит показателем прямого дополнения и не имеет самостоятельного русского соответствия; וְ связывает названия народов в перечне. Объектная функция выражена винительным падежом.
- source_word: הַקֵּינִי
  choice: кенеев
  rationale: Этноним с артиклем употреблён собирательно и обозначает народ; в русском контексте прямого дополнения передан формой множественного числа винительного падежа.
- source_word: הַקְּנִזִּי
  choice: кенезеев
  rationale: Собирательный этноним в перечне народов; форма множественного числа ясно передаёт название народа, а винительный падеж обусловлен синтаксисом более широкого предложения.
- source_word: הַקַּדְמֹנִי
  choice: кадмонеев
  rationale: Хотя слово связано с понятием востока, параллелизм с другими этнонимами показывает, что здесь это название народа. Транслитерация сохраняет характер собственного наименования; винительный падеж отражает функцию прямого дополнения.
