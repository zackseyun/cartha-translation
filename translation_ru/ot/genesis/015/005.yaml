  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: ru
  text: 'И Он вывел его наружу и сказал: «Посмотри, пожалуйста, на небо и сосчитай звёзды, если сможешь их сосчитать». И сказал ему: «Таким будет твоё потомство[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семя». Еврейское существительное стоит в единственном числе, но имеет собирательное значение и может обозначать потомство в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: И Он вывел его наружу
  rationale: Порода hифиль глагола יצא выражает побуждение к выходу; «вывел» естественно передаёт каузативность, а «наружу» — направительную форму הַחוּצָה.
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: Посмотри, пожалуйста, на небо
  rationale: Императив הַבֶּט передан обычным русским «посмотри», частица נָא — смягчающим «пожалуйста», а направительная форма слова «небо» естественно выражена предлогом «на».
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: и сосчитай звёзды
  rationale: В данном контексте ספר означает перечислить, определить число; «сосчитай» ясно и естественно передаёт завершённую попытку счёта.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: если сможешь их сосчитать
  rationale: Условная конструкция выражает способность; русский будущий вид «сможешь» идиоматично передаёт эту мысль.
- source_word: כֹּה יִהְיֶה זַרְעֶךָ
  choice: Таким будет твоё потомство
  rationale: «Таким будет» передаёт сравнительно-результативное כֹּה יִהְיֶה, а «потомство» сохраняет собирательный смысл существительного זֶרַע и не делает множественность столь явной, как «потомки».
theological_decisions:
- issue: Передача זַרְעֶךָ в тексте обетования при его грамматически единственном, но собирательном значении
  choice: твоё потомство
  alternative: твоё семя; твои потомки
  rationale: «Потомство» — естественное современное русское собирательное существительное в единственном числе. Оно сохраняет смысловую широту еврейского זֶרַע и не снимает возможное богословское напряжение между единичной формой и коллективным референтом.
- issue: Неявный субъект глаголов в повествовании
  choice: Он — с прописной буквы
  alternative: он — со строчной буквы; Господь
  rationale: Контекст указывает на Бога, однако имя в самом стихе не повторено. Местоимение сохраняет форму исходного текста, не добавляя «Господь»; прописная буква соответствует принятому в русском библейском регистре почтительному обозначению Бога.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет повтор «И сказал», присутствующий в еврейском тексте. Формулировка избегает архаизмов вроде «воззри» и «исчисли».
