base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: ru
  text: «Возьми, пожалуйста, мой дар, который принесли тебе, ведь Бог оказал мне милость, и у меня есть всё». Он настойчиво упрашивал его, и тот взял.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: мой дар
  rationale: Буквально «моё благословение», но в данном контексте слово обозначает дар, выражающий благожелательность; «дар» естественно передаёт предметный смысл и не создаёт ложного впечатления, будто Иаков передаёт Исаву само благословение.
- source_word: חַנַּנִי
  choice: был милостив ко мне
  rationale: Форма от חנן указывает на проявленную Богом милость; такая передача сохраняет богословский оттенок благодатного расположения.
- source_word: יֶשׁ לִי כֹל
  choice: у меня есть всё
  rationale: Сохраняет сильную и намеренно широкую формулировку оригинала, не ослабляя её до «у меня всего достаточно».
- source_word: וַיִּפְצַר בּוֹ
  choice: настойчиво уговаривал его
  rationale: Глагол выражает настойчивое понуждение или уговоры, а не простую просьбу.
- source_word: וַיִּקָּח
  choice: пока тот не взял
  rationale: В русском языке конструкция естественно показывает результат настойчивых уговоров; «тот» однозначно относится к Исаву в контексте.
theological_decisions:
- issue: Значение בִּרְכָתִי в связи с ранее полученным Иаковом благословением
  choice: мой дар
  alternative: моё благословение
  rationale: Хотя исходное слово буквально означает «благословение», здесь оно метонимически обозначает подношение. Перевод «дар» не навязывает богословского вывода о передаче патриаршего благословения Исаву.
- issue: Полнота утверждения יֶשׁ לִי כֹל
  choice: у меня есть всё
  alternative: у меня всего достаточно
  rationale: Более буквальная формулировка сохраняет контраст с речью Исава в предыдущем стихе и не устраняет возможную богословскую насыщенность признания Иакова.
translation_notes:
  register: Современный литературный русский язык; вежливая настойчивость передана через «пожалуйста», а итог уговоров — естественной конструкцией «пока тот не взял». Прямая речь закрывается перед повествовательным заключением.
