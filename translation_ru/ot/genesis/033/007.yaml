  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: ru
  text: Подошла также Лия со своими детьми, и они поклонились. После этого подошли Иосиф и Рахиль, и они поклонились.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрлись ниц»; еврейский глагол может обозначать глубокий почтительный поклон.'
