lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: подошла / подошли
  rationale: Глагол נגשׁ обозначает приближение. «Подошла/подошли» естественно передаёт движение к Исаву, не уточняя его характер сверх исходного текста.
- source_word: גַּם
  choice: также
  rationale: Частица отмечает добавление к последовательности тех, кто подходил к Исаву.
- source_word: וִילָדֶיהָ
  choice: со своими детьми
  rationale: יְלָדִים — общее обозначение детей, не ограниченное мужским полом; предлог «с» естественно выражает совместное приближение Лии и детей.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: они поклонились
  rationale: Форма глагола שׁחה обозначает почтительный поклон; русский глагол сохраняет смысл, не утверждая однозначно полного простирания ниц.
- source_word: וְאַחַר
  choice: после них
  rationale: В контексте шествия выражение указывает на последующее место Иосифа и Рахили после Лии и её детей; «после них» естественно и ясно передаёт последовательность.
- source_word: יוֹסֵף וְרָחֵל
  choice: Иосиф и Рахиль
  rationale: Сохранён порядок имён в еврейском тексте.
