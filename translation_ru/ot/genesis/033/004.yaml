base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: ru
  text: Исав побежал ему навстречу, обнял его, бросился ему на шею, поцеловал его[a], и они заплакали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Масоретском тексте слово, переведённое как «поцеловал его», необычно отмечено точками над буквами. Некоторые толкователи видят в этом указание на сомнение или особое ударение, однако прямое значение еврейского текста здесь — «поцеловал его».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: побежал
  rationale: Глагол רוץ прямо обозначает бег; форма «побежал» естественно передаёт стремительное начало действия.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: לִקְרָאתוֹ
  choice: ему навстречу
  rationale: Обычное значение оборота לקראת — двигаться навстречу кому-либо; русский оборот сохраняет и направление, и личный характер встречи.
- source_word: וַיְחַבְּקֵהוּ
  choice: обнял его
  rationale: חבק означает «обнимать»; это ясный и естественный современный русский эквивалент.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: бросился ему на шею
  rationale: Буквально оборот означает «пал ему на шею», но по-русски «бросился ему на шею» естественно сохраняет его яркий образ и эмоциональную силу.
- source_word: וַיִּשָּׁקֵהוּ
  choice: поцеловал его
  rationale: Глагол נשק в данной форме означает «целовать». Необычные надстрочные точки масоретской традиции отмечены в сноске, но не меняют прямого смысла основного текста.
- source_word: וַיִּבְכּוּ
  choice: они заплакали
  rationale: Форма множественного числа указывает на обоих мужчин. «Заплакали» естественно передаёт наступление совместного плача в последовательности событий.
theological_decisions:
- issue: Характер действий Исава по отношению к Иакову
  choice: Последовательность передана прямо как проявление примирения и привязанности, без добавления подозрения.
  alternative: Истолковать поцелуй как неискренний или иронический на основании позднейших толкований.
  rationale: На уровне повествования еврейский текст даёт быструю последовательность действий, выражающих сильное чувство. Перевод не должен вносить в основной текст отсутствующую в нём оценку.
- issue: Необычная масоретская пунктуация над וַיִּשָּׁקֵהוּ
  choice: Сохранить обычное значение «поцеловал его», а графическую особенность объяснить в сноске.
  alternative: Изменить или ослабить перевод глагола из-за надстрочных точек.
  rationale: Надстрочные точки являются значимой особенностью масоретской передачи текста, однако сами по себе не дают иного однозначного лексического значения.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Выражение «бросился ему на шею» сохраняет образ еврейского оборота и звучит естественнее буквального «пал на его шею».
