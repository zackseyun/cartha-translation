  text: וְ/ה֖וּא עָבַ֣ר לִ/פְנֵי/הֶ֑ם וַ/יִּשְׁתַּ֤חוּ אַ֨רְצָ/ה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד גִּשְׁתּ֖/וֹ עַד אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: ru
  text: А сам он пошёл впереди них и семь раз поклонился до земли[a], пока не приблизился к своему брату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся ниц»; еврейский глагол может обозначать полный земной поклон в знак почтения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: А сам он
  rationale: Самостоятельное местоимение подчёркивает, что Иаков лично вышел вперёд; «сам он» естественно передаёт это выделение по-русски.
- source_word: עָבַר לִפְנֵיהֶם
  choice: пошёл впереди них
  rationale: В контексте Иаков выходит перед своей семьёй навстречу Исаву. Выражение передаёт движение во главе группы, а не просто пересечение пространства.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: поклонился до земли
  rationale: Глагол обозначает глубокий поклон или простирание ниц, а направительная форма אַרְצָה указывает движение к земле. Эта формулировка сохраняет телесный образ и не приписывает действию значение поклонения Богу.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямое и естественное воспроизведение числового выражения.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: пока не приблизился к своему брату
  rationale: 'Конструкция обозначает предел повторяющегося действия: Иаков кланялся по мере приближения к брату. «Приблизился» точно и естественно передаёт גִּשְׁתּוֹ.'
