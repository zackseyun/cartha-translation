  text: Затем подошли служанки со своими детьми и поклонились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: подошли
  rationale: Форма глагола נגשׁ обозначает следующее действие в повествовании — приближение к Исаву; «подошли» естественно и точно передаёт это движение.
- source_word: הַשְּׁפָחוֹת
  choice: служанки
  rationale: שִׁפְחָה обозначает женщину-служанку, нередко несвободного положения. «Служанки» сохраняет указание на пол и подходит современному литературному русскому без архаизма.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: со своими детьми
  rationale: Буквальная структура — «они и их дети» — подчёркивает совместное приближение. Русское «со своими детьми» естественно передаёт состав группы, хотя слегка перестраивает координацию.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: поклонились
  rationale: Глагол обозначает глубокий поклон или простирание в знак почтения. «Поклонились» естественно в данном повествовательном контексте и не уточняет степень телесного движения сверх необходимого.
theological_decisions: []
translation_notes:
  register: Современный литературный русский; краткая повествовательная фраза. Сохранена последовательность двух действий и совместное действие служанок с детьми; архаичные «рабыни» и «простёрлись ниц» не использованы, поскольку контекст не требует такого усиления.
