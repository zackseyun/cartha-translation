base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: ru
  text: 'Но Иаков ответил ему: «Мой господин знает, что дети слабы, а мелкий и крупный скот кормит детёнышей и находится на моём попечении.[a] Если их слишком подгонять один день, погибнет весь мелкий скот».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а мелкий и крупный скот с кормящими детёнышей самками — на моём попечении». Еврейское выражение идиоматично: оно, вероятно, объединяет указание на животных, кормящих детёнышей, и мысль о лежащей на Иакове заботе о них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Почтительное обращение Иакова к Исаву; это титул человека, а не Божье имя. Формулировка сохраняет социальную почтительность повествования.
- source_word: הַיְלָדִים רַכִּים
  choice: дети слабы
  rationale: רַכִּים обозначает нежность, хрупкость и уязвимость; в контексте пути «слабы» естественно передаёт ограниченные силы детей без излишнего уточнения их возраста.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: овцы и коровы
  rationale: Конкретные названия ясно передают мелкий и крупный домашний скот; «коровы» здесь употреблено как обычное собирательное обозначение крупного рогатого скота.
- source_word: עָלוֹת עָלָי
  choice: на мне — забота ... с подсосным молодняком
  rationale: Трудная идиома сочетает указание на кормящих животных или животных с сосущим молодняком и лежащую на Иакове ответственность. Перевод сохраняет оба смысловых компонента.
- source_word: וּדְפָקוּם יוֹם אֶחָד
  choice: если гнать их слишком быстро хотя бы один день
  rationale: דפק здесь означает чрезмерно подгонять скот. «Хотя бы один день» естественно выражает, что даже однодневный форсированный переход окажется губительным.
- source_word: וָמֵתוּ כָּל הַצֹּאן
  choice: погибнет весь скот
  rationale: Хотя הַצֹּאן обычно обозначает мелкий скот, после упоминания обеих групп животных оно здесь может обобщённо охватывать стадо целиком; русский «весь скот» передаёт этот контекстуальный охват.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Имя «Иаков» добавлено вместо местоимения для ясности в отдельно цитируемом стихе. Тире в выражении «на мне — забота» сохраняет естественный русский порядок и подчёркивает ответственность.
