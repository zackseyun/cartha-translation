  text: יַעֲבָר נָ֥א אֲדֹנִ֖/י לִ/פְנֵ֣י עַבְדּ֑/וֹ וַ/אֲנִ֞י אֶֽתְנָהֲלָ֣ה לְ/אִטִּ֗/י לְ/רֶ֨גֶל הַ/מְּלָאכָ֤ה אֲשֶׁר לְ/פָנַ/י֙ וּ/לְ/רֶ֣גֶל הַ/יְלָדִ֔ים עַ֛ד אֲשֶׁר אָבֹ֥א אֶל אֲדֹנִ֖/י שֵׂעִֽירָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: ru
  text: Пусть мой господин пройдёт впереди своего слуги, а я буду продвигаться не спеша, со скоростью, которую позволяют скот, идущий передо мной, и дети, пока не приду к моему господину в Сеир.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: Пусть ... пройдёт
  rationale: Юссив с частицей נָא выражает учтивую просьбу; русская конструкция с «пусть» естественно передаёт её в контексте почтительной речи.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение Иакова к Исаву; такой перевод сохраняет социальную дистанцию и повторяемость формулы, не придавая ей божественного смысла.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: вперёд своего слуги
  rationale: Буквально «перед своим слугой»; в контексте речь идёт о движении впереди, а третье лицо сохраняет самоуничижительную придворную форму речи Иакова.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: я буду двигаться не спеша
  rationale: Форма глагола נהל здесь обозначает осторожное, размеренное продвижение; перевод не навязывает спорный переходный смысл «вести» и естественно звучит по-русски.
- source_word: לְרֶגֶל
  choice: сообразуясь с шагом
  rationale: Буквально «по ноге» — идиома движения в соответствии с темпом кого-либо; формулировка сохраняет образ шага и передаёт регулирование скорости.
- source_word: הַמְּלָאכָה
  choice: скота
  rationale: Хотя существительное обычно означает «работа», «дело» или «имущество», в данном пастушеском контексте оно, вероятнее всего, указывает на перегоняемых животных.
- source_word: אֲשֶׁר לְפָנַי
  choice: который передо мной
  rationale: Сохранено прямое пространственное значение относительного оборота без добавления идеи владения или попечения.
- source_word: הַיְלָדִים
  choice: детей
  rationale: Обычное и точное современное обозначение детей Иакова; контекст сам указывает на необходимость учитывать их темп.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: пока не приду к господину моему в Сеир
  rationale: 'Передаёт временной предел и направление движения. Конечное ה в שֵׂעִירָה имеет направительное значение: «в Сеир».'
theological_decisions:
- issue: Был ли приход Иакова в Сеир твёрдым обещанием или вежливой формулой
  choice: Сохранено прямое «пока не приду», без пояснения намерения Иакова
  alternative: Истолковать слова как уклончивое обещание либо как указание на будущий приход
  rationale: Сам стих формулирует намерение, но не раскрывает, как оно соотносится с последующим маршрутом Иакова; перевод не должен разрешать повествовательное напряжение.
translation_notes:
  register: Современный литературный русский с достоинством патриархального повествования. Порядок «господин мой» и самоназвание «своего слуги» намеренно сохраняют подчёркнуто почтительную речь Иакова; архаизмы и канцелярская тяжеловесность избегаются.
