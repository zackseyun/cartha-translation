  naturalness: После перестановки обстоятельства происхождения фраза звучит естественно в современном литературном русском и избегает ненужного повтора «пришёл ... когда пришёл». «В земле Ханаанской» допустимо, но «в земле Ханаан» современнее и не меняет смысла.
  terminology: Передача имён «Иаков», «Сихем» и «Паддан-Арам» последовательна. Сноска корректно сохраняет спорную возможность прочитать שָׁלֵם как топоним; альтернативное «Салим, город Сихем» передаёт соответствующее разбиение еврейского текста.
