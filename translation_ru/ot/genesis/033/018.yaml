base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: ru
  text: Иаков благополучно пришёл из Паддан-Арама в город Сихем[a], что в земле Ханаан, и расположился станом перед городом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иаков пришёл в Салим, город Сихем». Еврейское слово שָׁלֵם (шалем) можно понять либо как «благополучно, целым и невредимым», либо как название места — «Салим».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычная повествовательная форма глагола בוא со значением прибытия; «пришёл» естественно звучит в современном русском повествовании.
- source_word: שָׁלֵם
  choice: благополучно
  rationale: 'Слово наиболее естественно понимать как характеристику состояния Иакова при прибытии: он добрался целым и невредимым. Возможное прочтение как топонима сохранено в сноске.'
- source_word: עִיר שְׁכֶם
  choice: к городу Сихему
  rationale: Сочетание עִיר с именем собственным обозначает город Сихем; дательный падеж после «к» соответствует русской норме.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: что в земле Ханаанской
  rationale: Краткая и естественная относительная конструкция, географически уточняющая местонахождение Сихема.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: возвратившись из Паддан-Арама
  rationale: Передаёт временное обстоятельство прибытия из Паддан-Арама, избегая в русском тяжеловесного повтора «пришёл… когда пришёл»; контекст возвращения Иакова допускает «возвратившись».
- source_word: פַּדַּן אֲרָם
  choice: Паддан-Арам
  rationale: Традиционная и прозрачная русская транслитерация составного географического названия.
- source_word: וַיִּחַן
  choice: расположился станом
  rationale: Точно передаёт устройство лагеря и сохраняет достойный повествовательный регистр без архаичного «стал станом».
- source_word: אֶת־פְּנֵי הָעִיר
  choice: перед городом
  rationale: Естественный русский эквивалент пространственной идиомы «перед лицом города», то есть напротив или у города.
