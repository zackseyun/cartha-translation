  source_fidelity: 'В целом смысл передан точно: Иаков замечает приближение Исава с четырьмястами людьми и размещает детей при трёх женщинах. Однако וַיַּחַץ означает именно «разделил», а не просто «распределил»; кроме того, שְׁפָחוֹת обозначает женщин в зависимом, несвободном положении, что «служанки» в современном русском может недостаточно передавать.'
