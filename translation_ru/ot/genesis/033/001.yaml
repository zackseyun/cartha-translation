  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: ru
  text: 'Иаков поднял глаза и увидел: вот, Исав идёт, а с ним — четыреста человек. Он разделил детей между Лией, Рахилью и двумя рабынями[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו וַיַּרְא
  choice: поднял глаза и увидел
  rationale: Сохраняет образность еврейского выражения «поднять глаза» и естественно передаёт последующее зрительное восприятие; по-русски сочетание звучит ясно и достойно.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Передаёт указательную и оживляющую повествование функцию частицы, привлекая внимание к внезапно открывшейся картине.
- source_word: בָּא
  choice: идёт
  rationale: Причастная форма изображает Исава в процессе приближения, поэтому настоящее повествовательное «идёт» точнее совершенного «пришёл».
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: а с ним четыреста человек
  rationale: Естественно передаёт сопровождение Исава большой группой, сохраняя контраст и нарастающее напряжение сцены.
- source_word: וַיַּחַץ אֶת הַיְלָדִים עַל
  choice: распределил детей между
  rationale: В данном контексте глагол и повторяющийся предлог описывают распределение детей по группам при соответствующих женщинах; формулировка передаёт это без лишних уточнений.
- source_word: שְׁתֵּי הַשְּׁפָחוֹת
  choice: двумя служанками
  rationale: «Служанки» — понятное современному читателю обозначение женщин зависимого положения в доме; возможность более явно передать их несвободный статус отмечена в сноске.
