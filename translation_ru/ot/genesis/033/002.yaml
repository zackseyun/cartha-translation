lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: поставил
  rationale: Глагол שׂוּם означает «ставить, помещать, располагать»; «поставил» естественно передаёт намеренное пространственное расположение людей.
- source_word: הַשְּׁפָחוֹת
  choice: служанок
  rationale: שִׁפְחָה обозначает зависимую женщину-служанку и может подразумевать рабский статус; «служанки» — ясный современный вариант, а социальная неоднозначность отражена в сноске.
- source_word: יַלְדֵיהֶן
  choice: их детей
  rationale: יֶלֶד здесь имеет общее значение «ребёнок, дети» и не требует сужения до сыновей.
- source_word: רִאשֹׁנָה
  choice: впереди
  rationale: Наречное употребление формы указывает на первую, переднюю позицию в выстроенном порядке; «впереди» естественно выражает пространственный смысл.
- source_word: וְאֶת לֵאָה וִילָדֶיהָ אַחֲרֹנִים
  choice: Лию и её детей — за ними
  rationale: В средней части трёхчленного порядка אַחֲרֹנִים означает расположение позади первой группы, а не абсолютное «последними».
- source_word: וְאֶת רָחֵל וְאֶת יוֹסֵף אַחֲרֹנִים
  choice: а Рахиль и Иосифа — последними
  rationale: Для заключительной группы אַחֲרֹנִים непосредственно указывает на последнее место в порядке.
- source_word: לֵאָה / רָחֵל / יוֹסֵף
  choice: Лия / Рахиль / Иосиф
  rationale: Использованы укоренившиеся в русском библейском употреблении формы личных имён.
