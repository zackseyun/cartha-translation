  text: וַ/יֹּ֖אמֶר נִסְעָ֣ה וְ/נֵלֵ֑כָה וְ/אֵלְכָ֖ה לְ/נֶגְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: ru
  text: 'Тогда он сказал: «Отправимся в путь и пойдём, а я пойду рядом с тобой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «впереди тебя»; или: «перед тобой».'
    reason: Еврейское לְנֶגְדֶּךָ допускает как значение сопутствующего движения рядом, так и пространственное положение впереди или перед человеком.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда он сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: נִסְעָה
  choice: Отправимся в путь
  rationale: Когортатив первого лица множественного числа выражает предложение совместно выступить в путь; формулировка естественна в современном русском.
- source_word: וְנֵלֵכָה
  choice: и пойдём
  rationale: הלך здесь обозначает дальнейшее совместное движение; сохранено простое сочетание двух близких по смыслу глаголов исходного текста.
- source_word: וְאֵלְכָה
  choice: а я пойду
  rationale: Форма первого лица единственного числа описывает предложенное Исавом собственное участие в пути; союз «а» ясно передаёт переход от совместного действия к его личному действию.
- source_word: לְנֶגְדֶּךָ
  choice: рядом с тобой
  rationale: В данном дорожном контексте выражение может указывать на движение вместе с Иаковом, в его присутствии. Пространственное значение «перед тобой» также возможно и сохранено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным тоном. Смысловая близость двух глаголов движения сохранена, а неоднозначность заключительного пространственного выражения отмечена сноской.
