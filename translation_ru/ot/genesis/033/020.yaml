translation:
  language: ru
  text: Там он воздвиг жертвенник и назвал его «Эль-Элохей-Исраэль»[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Там он воздвиг жертвенник и обратился к Богу со словами: “Бог, Бог Израиля”»; возможно также: «и провозгласил над ним: “Бог — Бог Израиля”». Еврейский текст можно понимать и как называние жертвенника, и как призывание Бога или провозглашение о Нём.'
