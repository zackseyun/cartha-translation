    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: воздвиг
  rationale: Порода хифиль глагола נצב здесь означает «установить, воздвигнуть». «Воздвиг» естественно сочетается с «жертвенник» и сохраняет достоинство повествовательного стиля.
- source_word: שָׁם
  choice: там
  rationale: Прямое и естественное соответствие наречию места.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшееся русское обозначение сооружения для жертвоприношений; понятно современному читателю и уместно в библейском контексте.
- source_word: וַיִּקְרָא לוֹ
  choice: назвал его
  rationale: Конструкция קרא + ל допускает значение называния, и после упоминания жертвенника наиболее естественно понимать местоимение как относящееся к нему. Возможное понимание как призывания Бога или провозглашения над жертвенником сохранено в примечании.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: Эль-Элохе-Исраэль
  rationale: В основном тексте выражение передано транслитерацией как имя жертвенника. Его смысл приведён в примечании, поскольку еврейское выражение также непосредственно читается как «Бог — Бог Израиля» или «Эль, Бог Израиля».
theological_decisions:
- issue: Является ли заключительная фраза именем жертвенника или призыванием/провозглашением о Боге
  choice: Понять её как имя, данное жертвеннику Иаковом
  alternative: 'Иаков призвал Бога словами «Бог, Бог Израиля» либо провозгласил над жертвенником: «Бог — Бог Израиля»'
  rationale: После слов об установлении жертвенника синтаксис естественно допускает его называние, что согласуется с формулами именования в Бытии. Однако краткая еврейская конструкция не исключает призывания или провозглашения, поэтому эта неоднозначность явно сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с традиционным, но общеупотребительным словом «жертвенник». Транслитерированное имя заключено в кавычки для ясности; богословская и синтаксическая неоднозначность исходного текста сохранена в примечаниях.
