base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: ru
  text: А Иаков отправился в Суккот[a]. Там он построил себе дом, а для своего скота сделал укрытия. Поэтому он назвал это место Суккот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Суккот» связано с еврейским словом, означающим «укрытия» или «шалаши».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע
  choice: отправился
  rationale: Глагол обозначает выступление в путь и перемещение с одного места на другое; «отправился» естественно передаёт движение повествования.
- source_word: סֻכֹּתָה
  choice: в Суккот
  rationale: Направительное окончание указывает на движение к названному месту; по-русски это естественно выражается сочетанием «в Суккот».
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: построил себе дом
  rationale: Сохраняет значение дательного לוֹ и кратко, естественно передаёт еврейскую конструкцию.
- source_word: מִקְנֵהוּ
  choice: своего скота
  rationale: Существительное обозначает принадлежащих человеку домашних стадных животных; «скот» здесь точнее широкого «имущество» и не сужает смысл до крупного рогатого скота.
- source_word: עָשָׂה סֻכֹּת
  choice: сделал укрытия
  rationale: Слово סֻכּוֹת означает временные навесы, шалаши или укрытия. В отношении животных «укрытия» звучит естественно и сохраняет смысловую связь с названием места.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Кратко и ясно передаёт причинную формулу, объясняющую название места.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: назвал это место
  rationale: Это естественный современный русский эквивалент буквального еврейского оборота «назвал имя места».
- source_word: סֻכּוֹת
  choice: Суккот
  rationale: Название места передано транслитерацией; связь с нарицательным словом объяснена в сноске.
