translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к оригиналу, но буквальное «из рук» заменено естественным для русского языка обозначением продавца. Маркер сноски поставлен непосредственно после термина «кесит», к которому относится пояснение.
