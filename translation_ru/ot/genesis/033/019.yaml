base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: ru
  text: И купил он участок поля, где раскинул свой шатёр, у сыновей Хамора, отца Сихема, за сто кесит[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кесита — древняя единица или предмет платежа; её точная стоимость неизвестна. Традиционно это слово переводили, например, как «денежная единица» или «монета».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: купил
  rationale: В контексте сделки с землёй глагол קנה означает покупку; «купил» — естественный и точный современный русский эквивалент.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: участок поля
  rationale: Слово חֶלְקָה обозначает выделенную часть или участок земли; такой перевод сохраняет конкретность, не добавляя лишних деталей.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: где раскинул свой шатёр
  rationale: Сочетание נטה с אֹהֶל — обычное выражение для установки шатра. «Раскинул шатёр» естественно звучит по-русски и сохраняет образ исходного текста.
- source_word: מִיַּד
  choice: у
  rationale: Буквально «из руки», то есть из владения или распоряжения. В русском описании покупки предлог «у» естественно передаёт продавца и не создаёт неуместной буквальности.
- source_word: בְּנֵי חֲמוֹר
  choice: сыновей Хамора
  rationale: Прямо передаёт конструкцию принадлежности; имя חֲמוֹר транслитерировано как «Хамор» с сохранением начального согласного.
- source_word: אֲבִי שְׁכֶם
  choice: отца Сихема
  rationale: Приложение определяет Хамора как отца Сихема; формулировка сохраняет синтаксис и смысл еврейского текста.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: за сто кесит
  rationale: Предлог «за» естественно обозначает цену. Название древнего платёжного средства транслитерировано, поскольку его точный вид и стоимость неизвестны; после числительного «сто» употреблена форма родительного множественного числа.
