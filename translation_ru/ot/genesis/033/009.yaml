  source_fidelity: В основной строке «и так» вносит не выраженное в еврейском тексте значение («и без того/в любом случае»), а «останется» конкретизирует יְהִי («пусть будет») как сохранение прежнего состояния. Контекст отказа допускает такую конкретизацию, но для оптимально-эквивалентного перевода она излишня. «У меня много» точно передаёт יֶשׁ־לִי רָב, а «пусть твоё будет твоим» сохраняет форму пожелания/позволения и намеренную тавтологическую выразительность оригинала.
  naturalness: «У меня много, брат мой; пусть твоё будет твоим» — понятная современному читателю литературная реплика с умеренно библейской риторической окраской. Обращение «брат мой» естественно в данном торжественно-примирительном контексте.
  terminology: «Исав» — нормативная русская библейская передача имени. Специальных богословских терминов нет. Сноска должна содержать альтернативу, а не повторять весь стих с добавленным «И Исав сказал».
