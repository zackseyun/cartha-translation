  text: 'Но Исав сказал[a]: «У меня много, брат мой; пусть твоё будет твоим».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У меня достаточно, брат мой; пусть то, что принадлежит тебе, будет твоим».'
    reason: В данном контексте רָב может передавать не только обилие («много»), но и достаточность; заключительную фразу можно передать более развёрнуто.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: 'Последовательный вав продолжает повествование, а «но» естественно передаёт мягкое противопоставление: Исав отказывается от предложенного Иаковом дара.'
- source_word: עֵשָׂו
  choice: Исав
  rationale: Традиционная русская форма библейского имени.
- source_word: יֶשׁ לִי רָב
  choice: У меня и так много
  rationale: Оборот выражает обладание изобилием. «Много» прямо передаёт רָב, а «и так» естественно отражает контекст отказа, не сводя смысл лишь к достаточности.
- source_word: אָחִי
  choice: брат мой
  rationale: Сохраняет притяжательный суффикс и тёплое обращение Исава к Иакову; такой порядок слов соответствует dignified literary Russian.
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  choice: пусть твоё останется у тебя
  rationale: 'Юссив имеет значение вежливого позволения или пожелания: Исав предлагает Иакову сохранить принадлежащее ему. Русская формулировка ясно передаёт смысл контекста.'
