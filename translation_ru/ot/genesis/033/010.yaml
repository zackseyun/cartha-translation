base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: ru
  text: 'Иаков сказал: «Нет, прошу тебя! Если я обрёл благосклонность в твоих глазах, прими мой дар из моей руки, ведь я увидел твоё лицо, словно увидел лицо Бога[a], и ты принял меня благосклонно[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «лицо божества». Однако в контексте лучше подходит «лицо Бога», особенно в связи с недавней встречей Иакова с Богом в Пенуэле (Быт. 32:30).'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ты благоволил ко мне»; «ты принял меня». Еврейский глагол выражает благосклонное принятие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: благосклонность в твоих глазах
  rationale: Сохраняет еврейский образ и передаёт межличностный смысл расположения и принятия без излишне богословски нагруженного слова «благодать».
- source_word: מִנְחָתִי
  choice: мой дар
  rationale: В контексте речь о примирительном даре Иакова Исаву; «приношение» могло бы ошибочно создать культовую ассоциацию.
- source_word: מִיָּדִי
  choice: из моих рук
  rationale: Конкретный образ личного вручения сохранён; множественное «из рук» естественнее в современном русском в сочетании с глаголом «прими».
- source_word: כִּי עַל־כֵּן
  choice: ведь
  rationale: Передаёт обосновывающую функцию сочетания в контексте и звучит естественно по-русски.
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: словно увидел лицо Бога
  rationale: Сохраняет сравнение и выражение «лицо Бога»; контекст Пенуэла указывает на Бога, а не на неопределённое божество.
- source_word: וַתִּרְצֵנִי
  choice: ты принял меня благосклонно
  rationale: Передаёт благоприятное принятие Иакова Исавом и создаёт уместную лексическую перекличку с ранее упомянутой благосклонностью.
- source_word: אַל נָא אִם נָא
  choice: Нет, прошу тебя! Если
  rationale: Передаёт настойчивую, но вежливую просьбу Иакова и естественно оформляет переход к условному придаточному.
theological_decisions:
- issue: Значение אֱלֹהִים в сравнении «как увидеть лицо Бога»
  choice: Бога
  alternative: божества / бога
  rationale: Хотя אֱלֹהִים допускает более широкий диапазон значений, непосредственный повествовательный контекст после встречи Иакова с Богом в Пенуэле (Быт. 32:30) убедительно поддерживает личное имя-нарицательное «Бог». Сильное сравнение Иакова сохранено без смягчения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранены образы «в твоих глазах» и «лицо Бога», а синтаксис сделан понятным для обычного читателя. Маркеры сносок расположены непосредственно после соответствующих выражений.
