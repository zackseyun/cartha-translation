lexical_decisions:
- source_word: וַיָּשָׁב
  choice: отправился обратно
  rationale: Глагол שׁוב обозначает возвращение или движение назад. В данном дорожном контексте сочетание «отправился обратно» естественно передаёт возобновление обратного пути Исава.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое и естественное соответствие еврейскому временному обороту.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Использована традиционная русская форма библейского имени.
- source_word: לְדַרְכּוֹ
  choice: своей дорогой
  rationale: Сохраняет явное упоминание пути в еврейском тексте и при этом остаётся понятным по-русски.
- source_word: שֵׂעִירָה
  choice: в Сеир
  rationale: Направительное окончание -ה указывает на движение к Сеиру; по-русски это естественно выражается предлогом «в» с винительным падежом.
