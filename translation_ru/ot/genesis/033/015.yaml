  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: ru
  text: 'Исав сказал: «Позволь мне оставить с тобой несколько человек из тех, кто со мной». Иаков ответил: «Зачем это? Да обрету я благосклонность в глазах господина моего».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: Позволь мне оставить
  rationale: Когортатив с частицей просьбы передаёт вежливое предложение Исава оставить людей при Иакове.
- source_word: מִן הָעָם
  choice: несколько человек
  rationale: Буквально «из народа/людей»; в контексте речь о некоторой части сопровождающих Исава.
- source_word: אֶמְצָא חֵן בְּעֵינֵי
  choice: мне обрести благосклонность в глазах
  rationale: Сохранена древнееврейская идиома, естественная и понятная в возвышенном современном русском.
- source_word: אֲדֹנִי
  choice: господина моего
  rationale: Уважительное обращение Иакова к Исаву; строчная буква не допускает ошибочного отнесения к Богу.
theological_decisions:
- issue: Смысл ответа Иакова после отказа от охраны
  choice: «Лишь бы мне обрести благосклонность…»
  alternative: «Да обрету я благосклонность…»
  rationale: Частица отсутствует в еврейском тексте, но по контексту фраза выражает, что расположения Исава для Иакова достаточно; формулировка сохраняет связь с предыдущим вопросом, не превращая слова в просьбу о новой услуге.
- issue: Явное называние второго говорящего
  choice: «Но Иаков ответил»
  alternative: «Но он сказал»
  rationale: Еврейский текст использует местоименно подразумеваемого говорящего, однако имя устраняет неясность в русском без изменения референта, установленного контекстом.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сделан ясным для обычного читателя; образ «в глазах» сохранён как значимая исходная идиома.
