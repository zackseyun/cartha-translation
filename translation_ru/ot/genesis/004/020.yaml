  rationale: Заменены «стал» на более точное «был» и «разводит скот» на более широкое «держит скот». Сноска переработана, чтобы естественно объяснить коллективное единственное число и идиоматическую связь шатров со скотом, сохраняя альтернативу «кочевники-скотоводы».
