  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: ru
  text: Ада родила Иавала[a]. Он был родоначальником тех, кто живёт в шатрах и держит скот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родоначальником кочевников-скотоводов». Буквально еврейское выражение говорит об «отце живущих в шатрах и [имеющих] скот»; единственное число имеет собирательное значение. «Отец» здесь может означать предка, основателя или первого представителя определённого образа жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Qal wayyiqtol от ילד в родословном повествовании естественно передаётся русским «родила».
- source_word: עָדָה
  choice: Ада
  rationale: Традиционная русская передача личного имени עָדָה.
- source_word: אֶת
  choice: '[показатель прямого дополнения, не переводится]'
  rationale: Служебная частица отмечает יָבָל как прямое дополнение и отдельного соответствия в русском не требует.
- source_word: יָבָל
  choice: Иавал
  rationale: Традиционная русская библейская передача личного имени יָבָל.
- source_word: הוּא הָיָה
  choice: он стал
  rationale: В данном сообщении конструкция характеризует Иавала как начало определённого образа жизни; «стал» звучит естественно по-русски, хотя буквально возможно «он был».
- source_word: אֲבִי
  choice: родоначальником
  rationale: Здесь אָב обозначает не только буквального отца, но также предка или основателя группы и образа жизни. «Родоначальник» ясно передаёт этот расширенный смысл.
- source_word: יֹשֵׁב אֹהֶל
  choice: тех, кто живёт в шатрах
  rationale: Причастие в единственном числе имеет собирательное значение; русская конструкция явно и естественно обозначает соответствующую группу людей.
- source_word: וּמִקְנֶה
  choice: и разводит скот
  rationale: מִקְנֶה означает скот, стада. В сочетании с образом кочевой жизни по-русски требуется восполнить подразумеваемую связь; «разводит скот» передаёт занятие животноводством, не ограничивая значение крупным рогатым скотом.
