    issue: «Он стал родоначальником» вместо «Он был родоначальником».
    rationale: הוּא הָיָה — констатирующая конструкция «он был». Хотя контекст допускает представление об Иавале как основателе, «стал» вносит невыраженный аспект изменения состояния.
  - severity: low
    issue: «Разводит скот» сужает значение מִקְנֶה.
    rationale: מִקְנֶה обозначает скот/стада; в сочетании подразумевается образ жизни людей, имеющих или содержащих скот. «Разводит» может специально означать разведение животных.
  - severity: medium
    issue: Формулировка сноски о буквальном чтении неясна и структурно вводит в заблуждение.
    rationale: Еврейское единственное число имеет собирательную функцию, а связь «шатра и скота» требует в русском пояснения подразумеваемого отношения, а не буквального соположения «живущего ... и скота».
