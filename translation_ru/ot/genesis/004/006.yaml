  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: ru
  text: 'Тогда Яхве сказал Каину: «Почему ты разгневался и почему поникло твоё лицо?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почему упало твоё лицо?» Возможный смысл: «почему у тебя мрачный вид?»'
    reason: Сноска сохраняет буквальный образ еврейской идиомы и поясняет её смысл, не устраняя образность из основного текста.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с повествовательным וַ последовательно развивает рассказ; «тогда» естественно передаёт переход к следующему событию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־קָיִן
  choice: Каину
  rationale: Русский дательный падеж естественно передаёт адресата речи; имя קָיִן дано в общепринятой русской форме.
- source_word: לָמָּה חָרָה לָךְ
  choice: Почему ты разгневался
  rationale: Еврейская идиома буквально описывает разгорание гнева; выбранная формулировка ясно и естественно передаёт её значение, сохраняя совершенный вид исходной формы.
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: и почему поникло твоё лицо
  rationale: «Поникло лицо» сохраняет образ исходного текста — буквально «упало лицо» — и при этом понятно современному русскому читателю.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом. Форма «Яхве» лучше соответствует принятой научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественно-сдержанная. Метафора «поникло лицо» оставлена в тексте, а буквальная форма и смысловой вариант вынесены в сноску.
