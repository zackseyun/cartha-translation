  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: ru
  text: Ибо за Каина отомстят[a] семикратно, а за Ламеха — в семьдесят семь раз[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мстят»; еврейская форма может выражать общее утверждение или несомненное будущее возмездие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семьдесят и семь», то есть семьдесят семь раз. Перевод «семьдесят раз по семь» менее вероятен.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание для хвастливого утверждения Ламеха в предыдущем стихе; «ведь» естественно передаёт эту связующую и пояснительную функцию.
- source_word: שִׁבְעָתַיִם
  choice: всемеро
  rationale: Наречная форма обозначает семикратную меру возмездия; «всемеро» сохраняет краткость и поэтический параллелизм.
- source_word: יֻקַּם
  choice: отомстят
  rationale: Пассивная форма глагола נקם означает, что за Каина будет совершено возмездие. Русская неопределённо-личная конструкция естественно передаёт пассивный смысл, а будущее время — оттенок несомненного будущего возмездия.
- source_word: קָיִן
  choice: Каин
  rationale: Общепринятая русская форма личного имени.
- source_word: וְלֶמֶךְ
  choice: а за Ламеха
  rationale: В данном поэтическом сопоставлении союз естественно передаётся противительно-сопоставительным «а»; имя дано в общепринятой русской форме.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: в семьдесят семь раз
  rationale: Буквально «семьдесят и семь»; выражение означает семьдесят семь и усиливает параллель с семикратным возмездием за Каина.
theological_decisions:
- issue: Числовая формула возмездия за Ламеха
  choice: в семьдесят семь раз
  alternative: в семьдесят раз по семь
  rationale: Еврейское שִׁבְעִים וְשִׁבְעָה естественнее всего означает «семьдесят семь», а не произведение семидесяти на семь. Такой перевод сохраняет поэтическое нарастание и не переносит в Бытие формулировку из Мф. 18:22.
- issue: Временной оттенок יֻקַּם
  choice: отомстят
  alternative: мстят
  rationale: Имперфект допускает как общеутвердительный, так и уверенно-будущий смысл. Будущее время хорошо передаёт хвастливую уверенность Ламеха, а альтернативный общеутвердительный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным звучанием поэтического изречения. «Ведь» сохраняет связь с предыдущей строкой, «всемеро» — её афористичность, а тире обозначает пропуск повторяющегося сказуемого.
