  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: ru
  text: И ушёл Каин от лица Яхве и поселился в земле Нод[a], к востоку от Эдема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Нод» созвучно еврейскому слову, означающему «скитание», и перекликается с вынесенным Каину ранее приговором.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ушёл
  rationale: Глагол יצא обозначает выход или удаление. «Ушёл» естественно звучит по-русски и передаёт движение прочь, не уточняя его причины или характера.
- source_word: מִלִּפְנֵי
  choice: от лица
  rationale: Буквально выражение означает «от лица / от того, что перед лицом». Формулировка «от лица» сохраняет пространственно-личностный образ еврейского текста и не снимает напряжения между буквальным удалением и отчуждением от Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: В данном повествовательном контексте ישב означает обосноваться и жить в определённом месте; «поселился» естественно передаёт это значение.
- source_word: בְּאֶרֶץ נוֹד
  choice: в земле Нод
  rationale: Нод выступает как географическое название, поэтому оно транслитерировано. Связанная с ним игра слов передана в примечании.
- source_word: קִדְמַת עֵדֶן
  choice: к востоку от Эдема
  rationale: Выражение указывает на расположение с восточной стороны относительно Эдема; выбранная формулировка ясна и естественна для современного русского языка.
- source_word: עֵדֶן
  choice: Эдем
  rationale: Устоявшаяся русская передача названия места.
theological_decisions:
- issue: Как передать удаление Каина по отношению к Богу
  choice: ушёл Каин от лица Яхве
  alternative: ушёл Каин из присутствия Яхве
  rationale: '«От лица» ближе к еврейскому образу и сохраняет повествовательно-богословское напряжение: текст говорит об удалении Каина, не объясняя, в каком смысле человек может уйти от Божьего присутствия.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и понятен; выражение «от лица» намеренно сохраняет исходный образ, а имя «Яхве» передаёт тетраграмматон как личное имя.
