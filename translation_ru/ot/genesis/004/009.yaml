lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога в принятой современной русской транслитерации, не заменяя его титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: И сказал / Он ответил
  rationale: В первой реплике сохранено повествовательное продвижение посредством «И сказал»; во второй глагол естественно передан как «ответил», поскольку речь Каина непосредственно отвечает на вопрос.
- source_word: אֵי
  choice: Где
  rationale: Прямое и естественное русское соответствие вопросительному слову места.
- source_word: הֶבֶל אָחִיךָ
  choice: Авель, брат твой
  rationale: Сохраняет личное имя, явное обозначение родства и несколько приподнятый, но понятный порядок слов исходного вопроса.
- source_word: לֹא יָדַעְתִּי
  choice: Не знаю
  rationale: Хотя перфект допускает прошедшее время, в контексте это естественно звучащая в настоящем времени декларация незнания; временная неоднозначность отмечена в сноске.
- source_word: הֲשֹׁמֵר
  choice: Разве я сторож
  rationale: «Сторож» передаёт значение того, кто охраняет или присматривает; частица «разве» сохраняет риторический характер вопроса без добавочного толкования.
- source_word: אָחִי אָנֹכִי
  choice: своему брату
  rationale: Русская конструкция «сторож кому» идиоматична; личное местоимение выражено ранее словом «я», а его исходное ударное значение поддерживается риторической формой всего вопроса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом. Вариант «Иегова» отражает более позднюю смешанную форму произношения.
- issue: Характер ответа Каина о брате
  choice: Разве я сторож своему брату?
  alternative: Разве я должен присматривать за своим братом?
  rationale: Выбрана формулировка, сохраняющая образ «сторожа» и не превращающая риторический вопрос в явное утверждение об обязанности, которой исходный текст прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным строем. Реплики кратки и естественны; сохранены повтор слова «брат» и напряжённая риторическая неоднозначность последнего вопроса.
