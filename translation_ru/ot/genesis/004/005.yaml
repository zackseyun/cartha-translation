base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: ru
  text: Но к Каину и к его приношению Он не отнёсся благосклонно[a]. Каин очень разгневался, и лицо его поникло[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не взглянул благосклонно».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его лицо упало»; это выражение описывает подавленный, мрачный вид.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: на
  rationale: При глаголе שָׁעָה предлог вводит того и то, на кого или на что обращён взгляд и благосклонное внимание; русское «на» естественно сочетается с «взглянул».
- source_word: מִנְחָה
  choice: приношение
  rationale: В данном контексте слово обозначает дар, принесённый Богу. «Приношение» передаёт культовый контекст, не уточняя вид жертвы сверх текста.
- source_word: לֹא שָׁעָה
  choice: не взглянул
  rationale: Сохраняет образ взгляда и сдержанность еврейского выражения. В контексте подразумевается отсутствие благосклонного внимания, что пояснено в сноске без превращения перевода в более определённое «не принял».
- source_word: וַיִּחַר ... מְאֹד
  choice: очень разгневался
  rationale: Естественно передаёт еврейскую идиому, буквально связанную с разгоранием гнева, и сохраняет усиление מְאֹד.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: лицо его поникло
  rationale: Сохраняет телесный образ оригинала и передаёт видимое уныние или мрачное состояние Каина, не сводя его к одной строго определённой эмоции.
theological_decisions:
- issue: Характер Божьего отношения к приношению Каина
  choice: Передать отсутствие благосклонного внимания словами «не взглянул», не указывая причину.
  alternative: «не принял» или «не взглянул благосклонно»
  rationale: Сам стих не объясняет, почему Бог так отнёсся к Каину и его приношению. Формулировка не вносит в текст доктринального объяснения и сохраняет некоторую неоднозначность глагола.
translation_notes:
  register: Современный литературный русский язык с умеренным сохранением образности оригинала. Повтор «на Каина и на его приношение» воспроизводит параллельную конструкцию еврейского текста; «лицо его поникло» звучит возвышенно, но остаётся понятным современному читателю.
