base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: ru
  text: У Ханоха родился Ирад; Ирад стал отцом Мехуяэля[a], Мехуяэль — отцом Метушаэля, а Метушаэль — отцом Ламеха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте этого стиха имя написано в двух формах: Мехуяэль и Мехияэль.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: родился
  rationale: Нифаль глагола ילד передаёт пассивное рождение; конструкция «у Ханоха родился» естественно выражает еврейское לַחֲנוֹךְ и сохраняет отличие от последующих активных форм.
- source_word: לַחֲנוֹךְ
  choice: у Ханоха
  rationale: Предлог ל обозначает родителя, у которого родился ребёнок; русская конструкция «у Ханоха» естественна и точна.
- source_word: עִירָד
  choice: Ирад
  rationale: Имя транслитерировано непосредственно с древнееврейского.
- source_word: יָלַד
  choice: стал отцом
  rationale: В генеалогическом контексте активная порода Qal обозначает произведение потомка; «стал отцом» звучит современно и достойно, в отличие от архаического «родил» о мужчине или «породил».
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Мехуяэль
  rationale: В основном тексте использована единая форма имени для ясности, а различие двух еврейских написаний сохранено в сноске.
- source_word: מְתוּשָׁאֵל
  choice: Метушаэль
  rationale: Имя передано прямой транслитерацией с древнееврейского.
- source_word: לָמֶךְ
  choice: Ламех
  rationale: Имя передано в укоренившейся русской форме, близкой к древнееврейскому звучанию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; генеалогическая последовательность передана кратко, без архаизмов. Точка с запятой отделяет первую пассивную конструкцию от цепочки активного родительства, а тире устраняют тяжеловесное повторение «стал отцом» без потери смысла.
