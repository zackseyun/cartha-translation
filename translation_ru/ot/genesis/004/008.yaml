  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: ru
  text: И сказал Каин своему брату Авелю.[a] Когда они были в поле, Каин напал на своего брата Авеля и убил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском масоретском тексте после слов «И сказал Каин своему брату Авелю» содержание речи не приводится. В ряде древних свидетелей, включая Септуагинту, Самаритянское Пятикнижие и Вульгату, читается: «Пойдём в поле».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал Каин
  rationale: Глагол אמר обычно означает «сказать». Перевод сохраняет незавершённость фразы в масоретском тексте и не добавляет отсутствующую в нём прямую речь.
- source_word: אֶל הֶבֶל אָחִיו
  choice: своему брату Авелю
  rationale: Предлог אֶל передаёт направленность речи к Авелю, а אָחִיו подчёркивает, что Авель — брат Каина. Такой порядок слов естественен для современного русского языка.
- source_word: וַיְהִי בִּהְיוֹתָם בַּשָּׂדֶה
  choice: Когда они были в поле
  rationale: Еврейская конструкция задаёт временную рамку дальнейшего события. Краткая русская формулировка точно передаёт её функцию без тяжеловесного «и случилось».
- source_word: וַיָּקָם ... אֶל
  choice: восстал против
  rationale: Сочетание описывает враждебное выступление против другого человека. «Восстал против» сохраняет образ еврейского выражения и не сводит его заранее к более конкретному «напал».
- source_word: וַיַּהַרְגֵהוּ
  choice: убил его
  rationale: Глагол הרג означает «убить». Этот перевод лексически прям и не добавляет юридической квалификации, подразумеваемой словом «убил преднамеренно» или «совершил убийство».
theological_decisions:
- issue: Следует ли включать слова Каина, отсутствующие в масоретском тексте
  choice: В основном тексте сохранено более краткое чтение WLC без добавленной реплики; вариант древних свидетелей приведён в сноске.
  alternative: 'Включить в основной текст: «Пойдём в поле».'
  rationale: Предоставленный еврейский масоретский текст не содержит содержания речи Каина, хотя его формулировка выглядит обрывочной. Септуагинта, Самаритянское Пятикнижие и Вульгата свидетельствуют о более длинном чтении. Сохранение чтения WLC в основном тексте и указание варианта в сноске не скрывает ни исходное свидетельство, ни текстологическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным стилем. Повтор слова «брат» сохранён как значимый акцент рассказа; обрывочность первой фразы намеренно не сглажена, поскольку она присутствует в WLC.
