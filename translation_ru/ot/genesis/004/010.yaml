    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал Он
  rationale: Стандартное повествовательное продолжение посредством wayyiqtol; союз «и» сохраняет течение древнееврейского рассказа, а местоимение проясняет подразумеваемого говорящего из контекста.
- source_word: מֶה עָשִׂיתָ
  choice: Что ты сделал?
  rationale: Прямой вопрос-обличение естественно и весомо звучит в современном русском языке.
- source_word: קוֹל
  choice: Голос
  rationale: Сохраняет олицетворение крови, которая обращается к Богу, тогда как «звук» ослабил бы образ.
- source_word: דְּמֵי
  choice: крови
  rationale: Древнееврейская форма множественного числа буквально означает «крови» и часто употребляется в контексте пролития крови; по-русски естественно употребить собирательное единственное число.
- source_word: אָחִיךָ
  choice: брата твоего
  rationale: Постпозиция притяжательного местоимения придаёт фразе достоинство и сохраняет библейскую выразительность, оставаясь понятной современному читателю.
- source_word: צֹעֲקִים
  choice: взывает
  rationale: Причастие передаёт продолжающийся призыв; единственное число согласовано с русским «кровь». «Взывает» сохраняет направленность настойчивого призыва к Богу.
- source_word: אֵלַי
  choice: ко Мне
  rationale: Прямо передаёт направление вопля к говорящему Богу; прописная буква соответствует принятому русскому библейскому оформлению речи о Боге.
- source_word: מִן הָאֲדָמָה
  choice: из земли
  rationale: В контексте повествования о Каине אֲדָמָה обозначает почву, принявшую кровь; «из земли» естественно по-русски и сохраняет связь с землёй в ближайшем контексте.
theological_decisions:
- issue: Олицетворение пролитой крови Авеля
  choice: Сохранить образ крови, которая сама взывает к Богу.
  alternative: 'Передать абстрактно: вина за пролитую кровь требует правосудия.'
  rationale: Древнееврейский текст использует яркое олицетворение. Его сохранение не сводит образ к одному богословскому толкованию и удерживает нравственную и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис краткий и прямой; образность оригинала сохранена без догматического уточнения.
