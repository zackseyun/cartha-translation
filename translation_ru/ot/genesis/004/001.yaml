base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: The man knew Eve his wife[a], and she conceived and bore Cain, and said[b], “I have acquired a man with Yahweh.”
translation:
  language: ru
  text: 'И познал человек Еву, жену свою, и она зачала и родила Каина[b], и сказала: «Я приобрела человека с Яхве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с Яхве». Эти слова можно понимать также как «с помощью Яхве» или «от Яхве»; менее вероятно: «я приобрела человека — Яхве».'
    reason: alternative_reading
  - marker: b
    text: Имя Каин созвучно еврейскому глаголу канити — «я приобрела» или «я получила».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: И человек
  rationale: С определённым артиклем אָדָם обозначает уже представленного мужчину; начальное וְ передано обычным повествовательным союзом «и».
- source_word: יָדַע
  choice: познал
  rationale: Сохранён древнееврейский эвфемизм, который в данном контексте означает супружескую близость; «познал» естественно для литературного русского библейского повествования.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: Еву, жену свою
  rationale: Переданы имя и поясняющее отношение в порядке, близком к исходному тексту.
- source_word: וַתַּהַר וַתֵּלֶד אֶת קַיִן
  choice: и она зачала и родила Каина
  rationale: Компактно и точно передаёт последовательность зачатия и рождения.
- source_word: קַיִן
  choice: Каин
  rationale: Использована укоренившаяся русская форма имени; созвучие с קָנִיתִי разъяснено в сноске.
- source_word: קָנִיתִי
  choice: я приобрела
  rationale: Основное значение קנה — «приобретать, получать»; выбор сохраняет словесную связь с именем Каин настолько, насколько это возможно по-русски.
- source_word: אִישׁ
  choice: человека
  rationale: Сохранено необычное употребление אִישׁ («мужчина, человек») о новорождённом, без замены на более истолковывающие «сына» или «мальчика».
- source_word: אֶת יְהוָה
  choice: с Яхве
  rationale: Формально передаёт трудную конструкцию как сопровождение или участие, не встраивая в основной текст уточнение «с помощью» и не устраняя подлинную неоднозначность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Смысл אֶת יְהוָה в словах Евы
  choice: с Яхве
  alternative: с помощью Яхве; от Яхве; «приобрела человека — Яхве»
  rationale: Еврейская конструкция допускает несколько толкований. Основной текст сохраняет её компактность и напряжение, а сноска сообщает основные варианты, не утверждая спорное отождествление ребёнка с Яхве.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Сохранены эвфемизм «познал», лаконичная повествовательная цепочка и неоднозначность заключительной фразы. Маркер [a] поставлен непосредственно после спорного выражения, а [b] — после всей реплики, к которой относится игра слов.
