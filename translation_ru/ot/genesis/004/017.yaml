base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: ru
  text: Каин познал свою жену[a]; она зачала и родила Еноха. Каин строил город[b] и назвал этот город именем своего сына Еноха[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол «познал» здесь — древнееврейский эвфемизм, обозначающий супружескую близость.
    reason: cultural_note
  - marker: b
    text: 'Древнееврейская конструкция может указывать на продолжающееся действие: Каин «строил город», а не обязательно уже завершил его строительство.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и назвал имя города по имени своего сына — Енох».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: познал
  rationale: Сохраняет обычный для древнееврейского текста эвфемизм со значением супружеской близости и соответствует dignified biblical register in Russian without becoming obscure.
- source_word: אִשְׁתּוֹ
  choice: свою жену
  rationale: В данном контексте אִשָּׁה с притяжательным суффиксом естественно означает «его жена»; русское «свою» корректно соотносит её с подлежащим Каином.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: она зачала и родила
  rationale: Точно и естественно передаёт последовательность зачатия и рождения в повествовании.
- source_word: חֲנוֹךְ
  choice: Енох
  rationale: Использована укоренившаяся русская форма библейского имени.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: Каин строил город
  rationale: Сочетание היה с причастием בֹּנֶה передаёт развёртывающееся или продолжающееся действие. Повтор имени вместо местоимения устраняет возможную в русском тексте ошибочную отсылку к новорождённому Еноху, не меняя смысла исходного синтаксиса.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: назвал этот город именем своего сына
  rationale: Естественно по-русски передаёт древнееврейскую формулу «назвал имя города по имени своего сына», сохраняя связь между именованием города и именем сына.
