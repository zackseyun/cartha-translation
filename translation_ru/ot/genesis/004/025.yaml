base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: ru
  text: 'Адам снова познал свою жену, и она родила сына и назвала его Сифом[a], сказав: «Бог определил мне другое потомство вместо Авеля, потому что Каин убил его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Сиф» созвучно еврейскому глаголу в словах «Бог определил»; буквально этот глагол означает «положил» или «поставил».
    reason: Игра слов между שֵׁת («Сиф») и שָׁת не может быть естественно воспроизведена в основном русском тексте.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: познал
  rationale: Глагол ידע в сочетании с женой служит традиционным эвфемизмом супружеской близости. «Познал» сохраняет образность и достойный литературный регистр исходного текста.
- source_word: אָדָם
  choice: Адам
  rationale: В данном контексте слово употреблено как личное имя.
- source_word: עוֹד
  choice: снова
  rationale: Указывает на повторение супружеской близости; это естественный современный русский эквивалент.
- source_word: וַתֵּלֶד בֵּן
  choice: она родила сына
  rationale: Прямая и естественная передача еврейской конструкции.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: назвала его
  rationale: Современная русская формула наречения имени, точно передающая смысл еврейского выражения «назвала его имя».
- source_word: שֵׁת
  choice: Сиф
  rationale: Устоявшаяся русская форма личного имени.
- source_word: שָׁת
  choice: дал
  rationale: В контексте глагол שית обозначает Божье предоставление или определение другого потомства. «Дал» звучит естественно по-русски; буквальное значение и игра слов пояснены в сноске.
- source_word: זֶרַע
  choice: потомство
  rationale: Сохраняет широкий репродуктивный смысл слова זרע и не сужает его до простого обозначения новорождённого ребёнка.
- source_word: אַחֵר
  choice: другое
  rationale: Передаёт значение замещения в сочетании с «потомством».
- source_word: תַּחַת
  choice: вместо
  rationale: 'Здесь предлог выражает замещение: Сиф дан на место погибшего Авеля.'
- source_word: הֶבֶל
  choice: Авель
  rationale: Устоявшаяся русская форма личного имени.
- source_word: הֲרָגוֹ
  choice: убил его
  rationale: Прямой эквивалент обычного еврейского глагола «убивать»; более узкое «убил преднамеренно» или юридическое «совершил убийство» добавляло бы отсутствующую здесь лексическую спецификацию.
theological_decisions:
- issue: Объяснение Евой имени Сифа
  choice: Бог дал мне другое потомство
  alternative: Бог положил/определил мне другое семя
  rationale: Фраза сохраняет мысль о Боге как подателе потомства после гибели Авеля и звучит естественно на современном русском. Игра между именем שֵׁת и глаголом שָׁת не воспроизводится без неестественной формулировки, поэтому вынесена в сноску.
- issue: Степень явности супружеского эвфемизма
  choice: Адам снова познал свою жену
  alternative: Адам снова сошёлся со своей женой
  rationale: Исходный текст использует устойчивый эвфемизм «познал». Его сохранение передаёт литературную фактуру и не делает выражение более прямым, чем в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного библейского эвфемизма «познал». Синтаксис упрощён до естественных русских предложений; архаизмы вроде «нарекла» и неестественный буквализм «положил мне семя» не использованы.
