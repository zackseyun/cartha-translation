base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: ru
  text: 'Тогда Яхве сказал ему: «Поэтому каждому, кто убьёт Каина, отомстят всемеро».[a] И Яхве дал Каину знак,[b] чтобы никто, встретив его, не поразил его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «За Каина будет отмщено всемеро». Еврейская пассивная форма кратка и допускает такой более буквальный перевод; по смыслу возмездие постигнет того, кто убьёт Каина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «метку». Еврейское слово имеет широкое значение; в тексте не сказано, что именно представлял собой этот знак.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, в соответствии с исходным текстом и проектным решением.
- source_word: לָכֵן
  choice: Поэтому
  rationale: Сохраняет значение следствия в ответе Бога Каину и естественно звучит по-русски.
- source_word: כָּל הֹרֵג קַיִן
  choice: тому, кто убьёт Каина
  rationale: Передаёт обобщённый смысл конструкции и одновременно естественно связывается с безлично-пассивным сказуемым «отомстится».
- source_word: שִׁבְעָתַיִם
  choice: всемеро
  rationale: Кратко и литературно передаёт семикратную меру возмездия.
- source_word: יֻקָּם
  choice: отомстится
  rationale: Сохраняет компактность и пассивность еврейской формы, не называя прямо деятеля возмездия; русская конструкция указывает, что возмездие постигнет убийцу Каина.
- source_word: אוֹת
  choice: знак
  rationale: Широкое значение слова не требует физической метки; «знак» сохраняет неопределённость его вида и характера.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ
  choice: чтобы ... не поразил его
  rationale: Передаёт отрицательную цель и более непосредственно отражает значение נכה, не сужая его до одного лишь убийства.
- source_word: כָּל מֹצְאוֹ
  choice: никто, встретив его
  rationale: В сочетании с отрицательной целевой конструкцией естественно передаёт неопределённо-всеобщий смысл причастного оборота.
theological_decisions:
- issue: Кто подвергается семикратному возмездию
  choice: Возмездие постигает того, кто убьёт Каина.
  alternative: «Каин будет отмщён всемеро» — более буквальная, но потенциально двусмысленная формулировка.
  rationale: Контекст предупреждает против убийства Каина. Формулировка проясняет адресата возмездия, сохраняя пассивность и не называя явно его исполнителя.
- issue: Природа данного Каину знака
  choice: «знак» без уточнения его формы
  alternative: «метка» или «клеймо»
  rationale: Еврейское אוֹת не сообщает, был ли знак телесной меткой или имел иной вид; перевод не вводит позднейших предположений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Всемеро» сохраняет торжественную краткость, не являясь непонятным архаизмом. Местоимения по отношению к Богу набраны со строчной буквы согласно нейтральной современной издательской практике.
