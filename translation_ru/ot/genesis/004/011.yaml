base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: ru
  text: И теперь ты проклят от земли[a], которая раскрыла свои уста, чтобы принять кровь[b] твоего брата из твоей руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение можно понять и как «проклят землёй», и как «проклят вдали от земли»: еврейский предлог допускает оттенки источника и удаления.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «крови»; в еврейском языке это форма, обозначающая пролитую кровь или кровопролитие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный союз и указание на непосредственное следствие совершённого Каином.
- source_word: אָרוּר אָתָּה
  choice: ты проклят
  rationale: Естественно передаёт предикативную конструкцию и состояние Каина под проклятием.
- source_word: מִן הָאֲדָמָה
  choice: от земли
  rationale: Близко передаёт предлог מִן и не сводит неоднозначную связь проклятия с землёй исключительно к источнику проклятия или к удалению от земли.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: которая раскрыла свои уста
  rationale: Сохраняет олицетворение земли и торжественный, но понятный современному читателю образ.
- source_word: לָקַחַת
  choice: чтобы принять
  rationale: В данном контексте естественно описывает землю, вобравшую пролитую кровь, и сохраняет целевое значение инфинитива.
- source_word: דְּמֵי אָחִיךָ
  choice: кровь твоего брата
  rationale: Еврейское множественное число «крови» здесь идиоматически обозначает пролитую кровь или кровопролитие; русский единственный род звучит естественно.
- source_word: מִיָּדֶךָ
  choice: из твоей руки
  rationale: Сохраняет конкретный образ руки Каина как указание на его непосредственную вину, не заменяя его отвлечённым выражением.
theological_decisions:
- issue: Связь проклятия Каина с землёй
  choice: Сохранена формулировка «проклят от земли» с пояснением неоднозначности.
  alternative: «проклят землёй» или «изгнан прочь от земли»
  rationale: Предлог מִן допускает оттенки источника и отделения. Основной текст не определяет однозначно, выступает ли земля источником проклятия или Каин от неё отчуждается.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской образностью. Оборот «раскрыла свои уста» намеренно сохраняет олицетворение земли; необычность сочетания «проклят от земли» удерживает неоднозначность оригинала и разъясняется в сноске.
