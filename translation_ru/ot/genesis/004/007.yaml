  terminology: «Грех», «жертва за грех» и «господствовать» употреблены последовательно и без конфессионального уточнения. Местоимения «его» и «ним» естественно соотносятся с русским словом «грех». Сноски адекватно сохраняют лексические и синтаксические альтернативы, включая связь с Бытие 3:16.
