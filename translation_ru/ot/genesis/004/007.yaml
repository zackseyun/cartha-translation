  source_fidelity: Основной текст точно передаёт условное противопоставление, образ греха у двери и олицетворённое «влечение» греха к Каину. «Будешь принят» — допустимое контекстуальное истолкование שְׂאֵת, при этом буквальное «поднятие» и возможная связь с лицом Каина надлежащим образом сохранены в сноске. «Притаился» удачно передаёт רֹבֵץ как образ затаившегося зверя. Модальность «ты должен господствовать» обоснованно подана как увещание, а иные допустимые оттенки имперфекта отмечены.
