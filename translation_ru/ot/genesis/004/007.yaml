id: GEN.4.7
reference: Genesis 4:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: ru
  text: Если ты поступаешь хорошо, разве не будешь принят?[a] Но если не поступаешь хорошо, у двери притаился грех[b]; его влечение — к тебе[c], но ты должен господствовать над ним[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разве не будет поднятия?» Возможно, имеется в виду, что поникшее лицо Каина поднимется или что он будет принят.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «у двери лежит жертва за грех», хотя ближайший контекст естественнее передаёт образ греха как притаившегося зверя.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «его желание» либо «его стремление». Сравните сходную формулировку в Бытие 3:16.'
    reason: cross_reference
  - marker: d
    text: 'Или: «ты будешь господствовать над ним»; или: «ты можешь господствовать над ним». Еврейскую форму можно понимать как увещание, предсказание или указание на возможность.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: поступаешь хорошо
  rationale: Форма породы hифиль от יטב здесь означает поступать хорошо, правильно; перевод сохраняет краткость условной конструкции и её нравственный смысл.
- source_word: שְׂאֵת
  choice: будешь принят
  rationale: Буквально слово связано с поднятием. В данном контексте оно, вероятнее всего, указывает на принятие Каина или на то, что его поникшее лицо поднимется; неоднозначность отмечена в сноске.
- source_word: לַפֶּתַח
  choice: у двери
  rationale: Прямой и естественный перевод пространственного выражения, сохраняющий образ угрозы у самого входа.
- source_word: חַטָּאת
  choice: грех
  rationale: Хотя слово может означать также жертву за грех, причастие «притаился» и дальнейшее олицетворение естественнее изображают грех как подстерегающего зверя.
- source_word: רֹבֵץ
  choice: притаился
  rationale: Причастие описывает лежащее или припавшее к земле животное. «Притаился» естественно передаёт хищный образ и близкую угрозу.
- source_word: תְּשׁוּקָתוֹ
  choice: его влечение
  rationale: Существительное обозначает желание, стремление или влечение. Выбор сохраняет смысловую связь с Бытие 3:16, не уточняя спорный характер этого желания.
- source_word: תִּמְשָׁל בּוֹ
  choice: ты должен господствовать над ним
  rationale: Имперфект допускает увещательное, предсказательное или модальное прочтение. В контексте Божьего предостережения формулировка с «должен» передаёт призыв, а альтернативы приведены в сноске.
theological_decisions:
- issue: Обещает ли заключительная фраза господство Каина над грехом, повелевает господствовать или говорит о возможности этого
  choice: «ты должен господствовать над ним» — увещание
  alternative: «ты будешь господствовать над ним» или «ты можешь господствовать над ним»
  rationale: Еврейский имперфект допускает несколько оттенков. Контекст предостережения поддерживает увещание, однако грамматика не исключает предсказания или возможности, поэтому напряжение сохранено в сноске.
- issue: Обозначает ли חַטָּאת грех или жертву за грех
  choice: «грех», олицетворённый как притаившийся зверь
  alternative: «жертва за грех лежит у двери»
  rationale: Согласование причастия мужского рода и образ лежащего у входа существа делают фразу необычной, однако весь контекст — влечение греха к Каину и необходимость господствовать над ним — лучше поддерживает олицетворение греха. Иное лексическое значение отмечено без превращения его в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. «Господствовать» сохраняет силу משל и смысловую связь с Бытие 3:16. Местоимение «его» грамматически соотнесено с существительным мужского рода «грех».
