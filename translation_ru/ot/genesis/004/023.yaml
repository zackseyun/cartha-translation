  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: ru
  text: 'И сказал Ламех своим жёнам: «Ада и Цилла, слушайте мой голос! Жёны Ламеха, внимайте моему слову! Ведь я убил[b] мужчину за то, что он ранил меня[a], юношу — за то, что он ударил меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «я убил мужчину за мою рану, юношу — за мой ушиб». В еврейском тексте стоят существительные «рана» и «ушиб», а не глагольные выражения «ранил меня» и «ударил меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Некоторые понимают слова Ламеха как угрозу или общее хвастливое заявление: «я убью мужчину…», а не как сообщение об уже совершённом убийстве.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: своим жёнам
  rationale: Форма אִשָּׁה во множественном числе с суффиксом 3-го лица мужского рода единственного числа в данном контексте означает жён Ламеха, а не женщин вообще.
- source_word: שְׁמַעַן קוֹלִי
  choice: слушайте мой голос
  rationale: Сохраняется конкретный образ «голоса» и прямой характер повеления; форма обращения во множественном числе передана явно.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: внимайте моему слову
  rationale: Глагол אזן выражает внимательное слушание, а אִמְרָה — слово или изречение. «Внимайте» передаёт усиление во второй параллельной строке, не становясь непонятным современному читателю.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит содержание или основание заявления Ламеха. «Ведь» естественно связывает строки и не уточняет смысл сверх еврейского текста.
- source_word: אִישׁ
  choice: мужчину
  rationale: Передаёт обычное значение אִישׁ и сохраняет различие с יֶלֶד во второй половине строки.
- source_word: הָרַגְתִּי
  choice: я убил
  rationale: Перфект наиболее прямо читается как сообщение о совершённом убийстве; возможное модальное понимание отмечено в сноске.
- source_word: לְפִצְעִי
  choice: за то, что он ранил меня
  rationale: Идиоматически передаёт вероятное причинное или возмездное значение предлога לְ с существительным «рана» и суффиксом первого лица; буквальная именная конструкция приведена в сноске.
- source_word: יֶלֶד
  choice: юношу
  rationale: В параллели с אִישׁ слово обозначает более молодого человека; «юноша» не навязывает представление о малолетнем ребёнке.
- source_word: לְחַבֻּרָתִי
  choice: за то, что он ударил меня
  rationale: חַבּוּרָה означает ушиб, след от удара или рану. Глагольная передача естественна по-русски и несколько отличает эту строку от «ранил» в первой.
theological_decisions:
- issue: Слова Ламеха как сообщение об убийстве или как угроза
  choice: 'Текст передан как сообщение о совершённом убийстве: «я убил».'
  alternative: 'Понимать перфект модально или обобщённо: «я убью» или «я бы убил».'
  rationale: Форма הָרַגְתִּי прежде всего обозначает совершённое действие, однако хвастливый и поэтический контекст допускает прочтение как угрозы; альтернативу следует отметить, а не вводить в основной текст.
- issue: Возмездие или самооборона
  choice: 'Причина передана нейтрально: «за то, что он ранил меня… ударил меня».'
  alternative: Добавить указание на самооборону или оправданность поступка.
  rationale: Еврейский текст связывает убийство с нанесённой Ламеху раной или ушибом, но не утверждает прямо, что убийство было необходимой самообороной. Нравственная и богословская напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Повторы «голос», «жёны Ламеха» и параллелизм двух строк сохранены; «внимайте» поддерживает достоинство речи, оставаясь понятным.
