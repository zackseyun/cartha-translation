  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: ru
  text: Спустя некоторое время Каин принёс Яхве приношение из плодов земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из урожая земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים
  choice: Спустя некоторое время
  rationale: Повествовательная конструкция вводит следующее событие, а идиома מִקֵּץ יָמִים обозначает истечение некоторого времени. Такой перевод естественен по-русски и не придаёт выражению эсхатологического смысла.
- source_word: וַיָּבֵא
  choice: принёс
  rationale: Каузативная форма глагола בוא здесь означает «принести»; выбор прямо и естественно передаёт действие Каина.
- source_word: קַיִן
  choice: Каин
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: из плодов земли
  rationale: פְּרִי может обозначать плод или произведение земли, а אֲדָמָה — землю, почву. Формулировка сохраняет земледельческий образ и естественно звучит по-русски.
- source_word: מִנְחָה
  choice: приношение
  rationale: מִנְחָה обозначает дар, подношение или приношение. В контексте обращения к Богу «приношение» ясно передаёт культовый смысл, не уточняя сверх текста его вид.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а предлог ל — русским дательным падежом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст прямо употребляет Тетраграмматон. Транслитерация сохраняет личное имя и отличает его от титула «Господь».
- issue: Смысл מִקֵּץ יָמִים
  choice: 'неэсхатологическое указание на прошедшее время: «спустя некоторое время»'
  alternative: «по прошествии дней» / буквально «с конца дней»
  rationale: В данном повествовательном контексте выражение указывает на истечение неопределённого периода, а не на конец истории или последние дни.
- issue: Характер מִנְחָה
  choice: общее «приношение»
  alternative: «дар» или более узкое культовое обозначение
  rationale: Текст не уточняет установленную позднейшим законом разновидность жертвы; нейтральное слово не привносит такого уточнения.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза с сохранением достоинства библейского стиля. Архаизм «и было» опущен как неестественный, а связь с предыдущим повествованием передана последовательностью событий.
