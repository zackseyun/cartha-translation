  source_fidelity: 'Нужна правка одного существенного образа: «с лица земли» в современном русском обычно означает полное уничтожение/стирание, тогда как מֵעַל פְּנֵי הָאֲדָמָה означает удаление прочь с поверхности почвы. «С поверхности земли» передаёт исходный смысл без ложной коннотации. Парное נָע וָנָד лучше передать как «скиталец и беглец», сохраняя два аспекта: скитание и вынужденное бегство.'
