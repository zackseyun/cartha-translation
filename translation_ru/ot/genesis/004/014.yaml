  variant: modern literary Russian
source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: ru
  text: Вот, сегодня Ты изгнал меня с поверхности земли, и от Твоего лица я буду скрыт[a]. Я стану скитальцем и беглецом на земле[b], и всякий, кто встретит меня, убьёт меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я скроюсь от Твоего присутствия»; возможно также: «я буду скрыт от Твоего присутствия». Буквально: «от Твоего лица».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в стране». Еврейское אֶרֶץ может означать как землю вообще, так и отдельную землю или страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и усиливает последующее высказывание; «вот» естественно и достойно передаёт эту функцию в современном литературном русском.
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: Ты изгнал меня
  rationale: Глагол обозначает изгнание или насильственное удаление; «изгнал» точно и лаконично передаёт совершённое действие.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Сохраняется образное выражение «лицо земли» и связь אֲדָמָה с почвой, которую Каин обрабатывал; русское «с лица земли» здесь допускает требуемый контекстом смысл удаления от возделываемой земли.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: и от Твоего лица я буду скрыт
  rationale: Нифаль допускает пассивное или возвратно-пассивное понимание. Буквальный образ «от Твоего лица» сохраняет тему отчуждения от Божьего присутствия, не снимая грамматической неоднозначности.
- source_word: נָע וָנָד
  choice: скитальцем и изгнанником
  rationale: Парное выражение описывает неустроенное, перемещающееся существование. «Скиталец и изгнанник» сохраняет два компонента и звучит естественно по-русски.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ может обозначать как землю в широком смысле, так и определённую страну или область; в основном тексте выбран широкий смысл, а региональный отмечен в сноске.
- source_word: כָל מֹצְאִי
  choice: всякий, кто встретит меня
  rationale: Конструкция имеет неопределённо-обобщающий смысл. В данном контексте русское «встретит» естественнее буквального «найдёт», обозначая любого, кто повстречает Каина во время его скитаний.
- source_word: יַהַרְגֵנִי
  choice: убьёт меня
  rationale: Прямой современный эквивалент обычного глагола со значением «убивать».
theological_decisions:
- issue: Передача идиомы Божьего лица в וּמִפָּנֶיךָ אֶסָּתֵר
  choice: от Твоего лица я буду скрыт
  alternative: я скроюсь от Твоего присутствия / я буду скрыт от Твоего присутствия
  rationale: Сохранение конкретного образа «лица» передаёт личностную и богословскую тяжесть отчуждения от Бога. Пассивная форма следует наиболее прямому пониманию нифаля, а возможное возвратное прочтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, даны с прописной буквы по принятой русской издательской традиции. Образы «лицо земли» и «Твоё лицо» сохранены ради внутреннего параллелизма и смысловой напряжённости стиха.
