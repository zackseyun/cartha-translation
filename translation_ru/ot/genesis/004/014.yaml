  terminology: Прописные «Ты» и «Твоего» в обращении к Богу соответствуют заявленной издательской традиции. «Лицо» в выражении о Боге сохранено буквально; примечание корректно указывает вариант «присутствие». В сноске к אֶרֶץ не следует вводить «этой», поскольку указательное значение в еврейском тексте не выражено.
