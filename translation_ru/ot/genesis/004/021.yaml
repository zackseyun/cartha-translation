    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: Имя его брата
  rationale: Естественно передаёт еврейскую конструкцию и ясно связывает Иувала с Иавалом из предыдущего стиха; начальный союз в русском перечислении можно не выражать отдельно.
- source_word: יוּבָל
  choice: Иувал
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: הוּא הָיָה
  choice: Он был
  rationale: Прямо передаёт именное сказуемое с подчёркнутым местоимением, не навязывая возможного значения «стал».
- source_word: אֲבִי כָל
  choice: отцом всех
  rationale: Сохраняет образное выражение оригинала; в данном контексте «отец» обозначает родоначальника или основоположника, а не обязательно непосредственного биологического отца.
- source_word: תֹּפֵשׂ
  choice: кто играет
  rationale: Буквально причастие означает «держащий, берущий в руки», но применительно к музыкальным инструментам речь идёт об игре на них.
- source_word: כִּנּוֹר
  choice: лире
  rationale: «Лира» точнее традиционного «гусли» обозначает древний струнный инструмент, хотя его точное устройство неизвестно.
- source_word: עוּגָב
  choice: свирели
  rationale: Обозначение древнего духового инструмента не вполне определённо; «свирель» — понятный и достаточно широкий русский эквивалент без излишней органологической точности.
