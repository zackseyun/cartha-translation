  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: ru
  text: Когда ты будешь возделывать землю[a], она больше не будет отдавать тебе свою силу[b]. Ты будешь скитальцем и изгнанником[c] на земле[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо, когда ты будешь возделывать землю»; возможно также: «Если ты будешь возделывать землю». Еврейский союз допускает причинное, временное или условное понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «она не продолжит отдавать тебе свою силу», то есть свою производительную силу, плодородие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не знающим покоя скитальцем». Два близких по значению еврейских слова усиливают мысль о неустроенности, лишении устойчивого места и постоянных скитаниях.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «в стране»; еврейское слово может означать как землю вообще, так и определённую страну или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: когда
  rationale: 'Союз вводит обстоятельство, при котором проявится проклятие: всякий раз, когда Каин станет возделывать землю. Возможны также причинное «ибо» и условное «если», поэтому неоднозначность отмечена в сноске.'
- source_word: תַעֲבֹד אֶת הָאֲדָמָה
  choice: будешь возделывать землю
  rationale: Глагол עבד с אֲדָמָה означает обработку, возделывание почвы. «Возделывать землю» естественно для современного литературного русского языка и сохраняет связь с земледелием Каина.
- source_word: לֹא תֹסֵף תֵּת
  choice: больше не будет отдавать
  rationale: 'Конструкция יסף с инфинитивом передаёт прекращение действия: земля уже не продолжит давать Каину свою силу.'
- source_word: כֹּחָהּ
  choice: свою силу
  rationale: Буквальное значение — «её сила»; в контексте имеется в виду производительная сила, плодородие земли. Сохранён образ исходного текста.
- source_word: נָע וָנָד
  choice: скитальцем и странником
  rationale: Два близких по смыслу слова усиливают представление о неустроенности и постоянном перемещении. Такая пара не привносит обязательного смысла преступника, скрывающегося от преследования, который в современном русском может подразумевать слово «беглец».
- source_word: בָאָרֶץ
  choice: на земле
  rationale: אֶרֶץ может обозначать как всю землю, так и конкретную страну или территорию. В первобытном контексте Бытия широкий смысл уместен, но альтернатива отмечена в сноске.
theological_decisions:
- issue: Характер суда над Каином
  choice: Конкретное бесплодие его земледельческого труда и неустроенная жизнь без постоянного места
  alternative: Только внутреннее психологическое беспокойство или лишь изгнание с определённой территории
  rationale: Текст соединяет отказ земли отдавать свою силу с положением Каина как נָע וָנָד; перевод сохраняет обе стороны суда и не сводит одну к другой.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис ясен обычному читателю; метафора «земля отдаёт свою силу» сохранена ради образности оригинала. Все сноски обозначены в основном тексте в последовательном порядке.
