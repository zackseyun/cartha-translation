  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: ru
  text: 'И сказал Каин Яхве: «Моя вина слишком велика, чтобы её вынести».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё наказание слишком тяжело, чтобы я мог его вынести»; возможно также: «Моя вина слишком велика, чтобы её простить». Еврейское слово может обозначать беззаконие, вину или наказание за него, а глагол — «нести, выносить» либо, в некоторых контекстах, «прощать».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная форма с последовательным вау; «И сказал» сохраняет связность еврейского рассказа и естественно звучит по-русски.
- source_word: קַיִן
  choice: Каин
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: אֶל־יְהוָה
  choice: Яхве
  rationale: Предлог אֶל обозначает адресата речи и естественно передаётся русским дательным падежом; тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: גָּדוֹל
  choice: слишком велика
  rationale: 'В сочетании с מִן и инфинитивом прилагательное выражает превышение возможной меры: «слишком велика, чтобы…».'
- source_word: עֲוֺנִי
  choice: моя вина
  rationale: עָוֹן может означать беззаконие, вину либо наказание за него. «Вина» непосредственно сохраняет нравственный смысл слова и при этом допускает образ бремени; контекстуальное значение «наказание» отмечено в сноске.
- source_word: מִנְּשֹׂא
  choice: чтобы её вынести
  rationale: Инфинитив от נָשָׂא с сравнительным מִן передаёт смысл превышения способности нести или выдержать. Местоимение добавлено для естественного русского синтаксиса.
theological_decisions:
- issue: Неоднозначность עֲוֺנִי מִנְּשֹׂא
  choice: «Моя вина слишком велика, чтобы её вынести»
  alternative: '«Наказание моё тяжелее, чем я могу вынести»; возможно также: «Моя вина слишком велика, чтобы быть прощённой»'
  rationale: Существительное עָוֹן охватывает беззаконие, вину и наказание за вину, а נָשָׂא может значить «нести/выносить» и в некоторых контекстах «прощать». Основной текст сохраняет нравственный смысл «вины», не устраняя образ бремени; возможное сетование на тяжесть наказания и прочтение о прощении явно сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Краткая инверсия «И сказал Каин» поддерживает повествовательный ритм, а формулировка реплики остаётся понятной обычному читателю. Маркер сноски поставлен после всей реплики, поскольку примечание относится к неоднозначности фразы, а не к имени Яхве.
