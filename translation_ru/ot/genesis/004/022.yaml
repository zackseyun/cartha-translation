  source_fidelity: 'Основное прочтение передаёт допустимое, но не бесспорное понимание трудной группы לֹטֵשׁ כָּל־חֹרֵשׁ: Тувал-Каин представлен изготовителем металлических орудий. Добавление «режущие» возможно в связи с לֹטֵשׁ («точить, ковать»), хотя само выражение остаётся синтаксически и лексически спорным. Альтернатива должна яснее обозначать чтение, при котором речь идёт о мастере-металлисте, а не создавать неестественную конструкцию «для всякого мастера».'
