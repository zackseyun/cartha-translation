  terminology: Имена «Тувал-Каин» и «Наама» переданы последовательно; «бронза» с вариантом «медь» корректна. «Ковавшего» является уместным контекстуальным выбором для לֹטֵשׁ, но трудность сочетания следует точно и естественно объяснить в сноске.
