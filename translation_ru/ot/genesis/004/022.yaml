base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: ru
  text: Цилла также родила Тувал-Каина[a], ковавшего всякие режущие орудия из бронзы[b] и железа. Сестрой Тувал-Каина была Наама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мастера, работавшего с бронзой и железом». Древнееврейское выражение после имени трудно; его также понимают как описание Тувал-Каина — мастера по обработке металла, а не изготовителя металлических орудий.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «меди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: тоже
  rationale: 'Передаёт добавочное значение сочетания: Цилла, как и Ада, родила детей.'
- source_word: יָלְדָה
  choice: родила
  rationale: Естественный и точный русский эквивалент в родословном повествовании.
- source_word: תּוּבַל קַיִן
  choice: Тувал-Каин
  rationale: Имя транслитерировано с древнееврейского и сохранено как сложное имя через дефис.
- source_word: לֹטֵשׁ
  choice: ковавшего
  rationale: Причастие связано с обработкой металла и может обозначать того, кто куёт, вытачивает или заостряет изделия.
- source_word: כָּל חֹרֵשׁ
  choice: всякие режущие орудия
  rationale: Трудная конструкция понята как указание на изготовляемые металлические орудия; слово «режущие» передаёт связь с заострением, но неоднозначность отмечена в сноске.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: Обычный контекстуальный перевод названия древнего металла; возможное значение «медь» отмечено в сноске.
- source_word: בַרְזֶל
  choice: железо
  rationale: Прямой современный эквивалент названия металла.
- source_word: אֲחוֹת
  choice: сестра
  rationale: Прямое обозначение родства.
- source_word: נַעֲמָה
  choice: Наама
  rationale: Имя транслитерировано непосредственно с древнееврейского.
