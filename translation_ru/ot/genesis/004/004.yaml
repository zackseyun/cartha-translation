id: GEN.4.4
reference: Genesis 4:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: ru
  text: И Авель тоже принёс из первенцев своего стада и из их жирных частей[a]. Яхве благосклонно взглянул на Авеля и на его приношение[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из их жира». Вероятно, имеются в виду жирные части принесённых животных.'
    reason: cultural_note
  - marker: b
    text: 'Или: «обратил внимание на Авеля и на его приношение». В данном контексте подразумевается благосклонное внимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: И Авель
  rationale: Обычный повествовательный союз וְ передан союзом «и», сохраняющим последовательность рассказа.
- source_word: הֵבִיא
  choice: принёс
  rationale: В контексте дара или жертвы каузативная форма глагола בוא естественно передаётся как «принёс».
- source_word: גַם הוּא
  choice: тоже
  rationale: 'Передаёт подчёркнутое сопоставление с Каином: Авель, со своей стороны, также принёс приношение.'
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: из первенцев своего стада
  rationale: 'Предлог מִן имеет партитивное значение: Авель принёс не обязательно всех первенцев, а из числа первородных животных своего мелкого скота.'
- source_word: וּמֵחֶלְבֵהֶן
  choice: и из их жирных частей
  rationale: חֵלֶב обозначает жир, а в жертвенном контексте — жирные части животных. Формулировка сохраняет конкретный смысл, не заменяя его толкованием «лучшие части».
- source_word: וַיִּשַׁע
  choice: благосклонно взглянул
  rationale: Глагол выражает обращённый к кому-либо взгляд или внимание; в противопоставлении следующему стиху контекст указывает на благосклонность, но не сообщает, каким образом она была явлена.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: на Авеля и на его приношение
  rationale: Повтор אֶל выделяет и самого Авеля, и принесённый им дар как отдельные объекты благосклонного взгляда.
- source_word: מִנְחָתוֹ
  choice: его приношение
  rationale: מִנְחָה — дар или приношение; здесь слово относится к дару, принесённому Богу, без необходимости уточнять позднейшую классификацию жертв.
theological_decisions:
- issue: Характер реакции Бога, выраженной глаголом וַיִּשַׁע
  choice: «благосклонно взглянул» — положительная реакция обозначена, но способ её проявления не уточняется.
  alternative: «обратил внимание»; «принял»; «призрел»
  rationale: Контраст со стихом 5 показывает благосклонность к Авелю и его приношению. Однако перевод «принял» сильнее обозначает итог, а архаичное «призрел» малопонятно современному читателю. Избранная формулировка сохраняет образ взгляда и не добавляет способа божественного ответа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Первенцы» и «приношение» сохраняют культовую лексику, оставаясь понятными; синтаксис близок к еврейской последовательности. Конечная запятая сохранена, поскольку стих синтаксически продолжается в Быт 4:5.
