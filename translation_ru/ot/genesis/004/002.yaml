  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: ru
  text: И снова она родила его брата, Авеля.[a] Авель был пастухом мелкого скота,[b] а Каин возделывал землю.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она продолжила рожать»; еврейский оборот буквально говорит, что она «добавила родить», то есть родила ещё раз.'
    reason: lexical_alternative
  - marker: b
    text: Под «мелким скотом» подразумеваются прежде всего овцы и козы.
    reason: cultural_note
  - marker: c
    text: 'Или: «был земледельцем», «обрабатывал землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: И снова она родила
  rationale: Оборот יסף с инфинитивом выражает повторение или продолжение действия. «Снова родила» естественно передаёт последовательность рождений, не воспроизводя идиому буквально.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: его брата Авеля
  rationale: Двойной показатель прямого дополнения представляет новорождённого и приложением называет его братом Каина, Авелем. Местоимение «его» сохраняет отсылку к Каину из предыдущего стиха.
- source_word: הֶבֶל
  choice: Авель
  rationale: Использована традиционная русская форма библейского имени.
- source_word: וַיְהִי
  choice: стал
  rationale: Здесь היה вводит занятие Авеля. «Стал» естественно передаёт повествовательное развитие; возможное «был» звучало бы более статично.
- source_word: רֹעֵה צֹאן
  choice: пастухом мелкого скота
  rationale: רעה означает пасти, а צאן — собирательное обозначение мелкого домашнего скота, прежде всего овец и коз. Формулировка точнее более узкого «пастухом овец».
- source_word: קַיִן
  choice: Каин
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: возделывал землю
  rationale: Сочетание עבד с אֲדָמָה означает обрабатывать, возделывать почву. Глагольная формулировка естественна по-русски и сохраняет предмет труда без более общего толкования «земледелец».
- source_word: אֲדָמָה
  choice: землю
  rationale: «Земля» — естественный русский эквивалент в значении почвы и поддерживает тематическую связь с землёй в ближайшем контексте Бытия.
- source_word: וְ
  choice: а
  rationale: Русский союз «а» естественно сопоставляет разные занятия братьев, не придавая этому сопоставлению моральной оценки.
theological_decisions:
- issue: Изображение занятий братьев
  choice: Передать занятия Авеля и Каина как нейтральное сопоставление.
  alternative: Формулировкой намекнуть на превосходство одного занятия над другим.
  rationale: В еврейском тексте занятия братьев в этом стихе просто описаны; нравственная или богословская иерархия между ними не выражена.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. Тире после «родила» делает приложение «его брата Авеля» понятным и сохраняет необычный порядок еврейской фразы. Союз «а» обозначает сопоставление занятий без нравственного противопоставления.
