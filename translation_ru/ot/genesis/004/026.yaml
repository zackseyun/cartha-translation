base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: ru
  text: У Сифа тоже родился сын, и он назвал его Еносом. Тогда начали призывать имя Яхве.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Тогда было начато призывание имени Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Согласно менее распространённому пониманию глагола: «Тогда начали осквернять имя Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: У Сифа тоже родился сын
  rationale: Русская конструкция «у Сифа родился сын» естественно передаёт еврейский оборот с לְ и сохраняет пассивное значение יֻלַּד; גַּם передано словом «тоже».
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: и он назвал его Еносом
  rationale: Естественный современный русский эквивалент буквального оборота «назвал его имя Енос»; форма «Еносом» обусловлена русским управлением.
- source_word: אָז
  choice: Тогда
  rationale: Кратко и точно передаёт временное наречие אָז.
- source_word: הוּחַל
  choice: начали
  rationale: Безлично-неопределённая русская форма естественно передаёт пассивную начинательную конструкцию, не вводя явно названного в еврейском тексте субъекта.
- source_word: לִקְרֹא בְּשֵׁם
  choice: призывать имя
  rationale: В данном контексте устойчивое библейское выражение обозначает обращение к Богу, включая молитвенное и богослужебное призывание; формулировка сохраняет образ исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Значение הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: Тогда начали призывать имя Яхве
  alternative: Тогда начали осквернять имя Яхве
  rationale: Основной перевод понимает הוּחַל как начинательную форму и לִקְרֹא בְּשֵׁם как призывание Бога. Поскольку форму הוּחַל можно связать с другим значением корня חלל — «осквернять», менее распространённое толкование сохранено в примечании, а не исключено молча.
- issue: Неопределённый деятель при הוּחַל
  choice: безлично-неопределённое «начали»
  alternative: люди начали
  rationale: Исходный текст не называет деятеля прямо. Русская безлично-неопределённая конструкция сохраняет эту недосказанность лучше, чем добавление слова «люди».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имена переданы в привычных русских формах «Сиф» и «Енос»; личное имя יהוה — как «Яхве». Формулировка остаётся понятной без устранения грамматической и лексической неоднозначности заключительной фразы.
