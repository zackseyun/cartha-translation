  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: ru
  text: Ламех взял себе двух жён[a]. Одну звали Ада, а другую[b] — Цилла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Ламех женился на двух женщинах».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вторую».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Глагол לקח буквально означает «взял» и в сочетании со словом «жёны» ясно передаёт брачный контекст, сохраняя образ исходного текста.
- source_word: לוֹ
  choice: себе
  rationale: Передаёт значение личной заинтересованности и естественно соответствует еврейской конструкции.
- source_word: שְׁתֵּי נָשִׁים
  choice: двух жён
  rationale: Существительное может означать как «женщины», так и «жёны»; сочетание с לקח в данном контексте указывает на брачные отношения.
- source_word: שֵׁם הָאַחַת
  choice: Одну звали
  rationale: Естественная современная русская передача формулы «имя одной», без изменения смысла.
- source_word: עָדָה
  choice: Ада
  rationale: Традиционная и фонетически уместная русская передача личного имени.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: а другую
  rationale: В контексте пары по-русски естественнее сказать «другую»; буквальное значение «вторую» отмечено в сноске.
- source_word: צִלָּה
  choice: Цилла
  rationale: Устоявшаяся русская транслитерация личного имени, отражающая удвоение согласного.
theological_decisions:
- issue: Следует ли прямо оценивать многожёнство Ламеха
  choice: Сообщить, что у Ламеха было две жены, без нравственного комментария
  alternative: Добавить явное одобрение или осуждение его поступка
  rationale: Стих повествует о брачном устройстве Ламеха, но сам по себе не даёт ему нравственной оценки; перевод не должен вносить её от себя.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской формулировкой «взял себе двух жён». Вторая фраза сделана естественной для русского синтаксиса, при этом буквальное «вторую» сохранено в сноске.
