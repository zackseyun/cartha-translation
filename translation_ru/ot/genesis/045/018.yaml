  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: ru
  text: Возьмите своего отца и свои семьи и приходите ко мне. Я дам вам всё лучшее, что есть в земле Египта, и вы будете пользоваться её изобилием[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будете есть тук земли». «Тук (жир) земли» — образное выражение, обозначающее её отборные и богатые блага.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Возьмите
  rationale: Форма повелительного наклонения во множественном числе от לקח. «Возьмите» прямо передаёт значение глагола; подразумевается, что братья должны взять отца и семьи с собой.
- source_word: אֲבִיכֶם
  choice: своего отца
  rationale: Существительное в единственном числе с суффиксом 2-го лица множественного числа обозначает их общего отца, Иакова. Возвратное местоимение естественно в современном русском контексте.
- source_word: בָּתֵּיכֶם
  choice: свои семьи
  rationale: Буквально «ваши дома», но בַּיִת здесь означает домашних, семью или домочадцев, а не здания. «Семьи» ясно и естественно передаёт подразумеваемую социальную группу.
- source_word: וּבֹאוּ אֵלָי
  choice: и приходите ко мне
  rationale: Повелительная форма בוא с אֶל означает движение к говорящему. «Возвращайтесь» добавило бы прямо не выраженный в еврейском тексте оттенок.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Я дам вам
  rationale: Форма נתן после повелений выражает обещание или заверение; русское будущее время естественно передаёт эту функцию.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: лучшее, что есть в Египетской земле
  rationale: טוּב может обозначать благо, изобилие или всё самое лучшее. Выбранная формулировка ясно передаёт обещание предоставить лучшие ресурсы Египта.
- source_word: וְאִכְלוּ
  choice: и вы будете питаться
  rationale: 'Хотя форма морфологически повелительная, после обещания она естественно выражает его результат: адресаты получат возможность пользоваться изобилием земли.'
- source_word: חֵלֶב הָאָרֶץ
  choice: туком этой земли
  rationale: חֵלֶב буквально означает «жир, тук» и образно — самую богатую, отборную часть. «Тук земли» сохраняет яркий образ оригинала, а сноска разъясняет его современному читателю.
