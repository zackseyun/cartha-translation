  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: ru
  text: Всем им он дал — каждому по комплекту сменной одежды, а Вениамину дал триста единиц серебра[a] и пять комплектов сменной одежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «триста серебра»; конкретная денежная или весовая единица в еврейском тексте не названа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: Всем им ... каждому
  rationale: 'Сохранены оба распределительных элемента еврейского текста: дар получили все, причём каждый в отдельности. Тире делает естественной по-русски конструкцию, которая при буквальном воспроизведении была бы тяжеловесной.'
- source_word: נָתַן
  choice: дал
  rationale: Обычный и точный глагол для передачи נתן в повествовании о дарах.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: комплект сменной одежды / комплекты сменной одежды
  rationale: Выражение обозначает одежду для смены. «Комплект» ясно показывает, что речь идёт не о самом действии переодевания, а о выдаваемой одежде; число согласовано с распределительным смыслом первой части и с пятью комплектами во второй.
- source_word: וּלְבִנְיָמִן
  choice: а Вениамину
  rationale: Союз ו вводит сопоставление с особым, более щедрым даром Вениамину; русское «а» естественно передаёт этот контраст, не усиливая его до резкого противопоставления.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: триста единиц серебра
  rationale: В еврейском тексте буквально сказано «триста серебра», без названия денежной или весовой единицы. Формулировка не подставляет отсутствующие в тексте «сикли» и не предполагает непременно чеканные монеты.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: и пять комплектов сменной одежды
  rationale: Повторено то же обозначение одежды, что и в первой части стиха, с прямым сохранением числа пять.
