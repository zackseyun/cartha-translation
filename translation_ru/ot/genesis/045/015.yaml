lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: поцеловал
  rationale: Порода пиэль глагола נשׁק обозначает поцелуй как выражение привязанности и примирения; простой русский глагол естественно передаёт действие, не навязывая значения многократности.
- source_word: לְכָל אֶחָיו
  choice: всех своих братьев
  rationale: Сочетание כָּל с формой множественного числа охватывает всех братьев Иосифа; местоимение «своих» соответствует русскому литературному узусу.
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: и плакал, обнимая их
  rationale: Буквальное «плакал над/на них» по-русски либо неестественно, либо может ошибочно означать оплакивание умерших. В данном повествовательном контексте עַל передаёт тесный телесный контакт; «обнимая их» естественно выражает эту картину, не меняя эмоционального смысла.
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Временное выражение ясно отмечает следующую стадию повествования и естественно звучит в современном русском языке.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: его братья заговорили с ним
  rationale: Предлог אֵת при דבר допускает значение разговора с кем-либо, а «заговорили» естественно передаёт начало общения после прежнего молчания братьев. Сочетание «с ним» сохраняет возможность взаимной беседы.
