  source_fidelity: 'Перевод верно передаёт поцелуи Иосифа, всех братьев и последующее общение. Однако деепричастие «обнимая их» добавляет действие, которого в еврейском тексте нет: עֲלֵיהֶם означает «над ними / на них» и описывает направленность плача, не называя объятий.'
