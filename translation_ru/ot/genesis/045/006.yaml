  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: ru
  text: Вот уже два года в стране[a] голод, и ещё пять лет не будет ни пахоты, ни жатвы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посреди земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни вспашки, ни сбора урожая».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предыдущих слов Иосифа и естественно передаёт причинно-пояснительную связь.
- source_word: זֶה שְׁנָתַיִם
  choice: уже два года
  rationale: Сочетание указывает на текущий двухлетний период, который к моменту речи уже прошёл; «уже два года» естественно передаёт это по-русски.
- source_word: הָרָעָב
  choice: голод
  rationale: Речь идёт о конкретном, уже известном из контекста голоде; в русском определённость выражается контекстом.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: в этой земле
  rationale: Контекст требует местного значения «земля, страна». Буквальный образ «посреди земли» отмечен в сноске, поскольку в основном тексте он звучал бы неестественно.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: и ещё пять лет
  rationale: Передаёт, что после двух истекших лет остаются ещё пять.
- source_word: אֲשֶׁר אֵין
  choice: не будет
  rationale: Относительное предложение относится к предстоящим пяти годам, поэтому по-русски естественна форма будущего времени.
- source_word: חָרִישׁ
  choice: пахоты
  rationale: Слово обозначает пахоту или вспашку; «пахота» точно и понятно сохраняет сельскохозяйственный смысл.
- source_word: קָצִיר
  choice: жатвы
  rationale: В паре с пахотой обозначает жатву или сбор урожая; «жатва» сохраняет краткость и образ исходного текста.
