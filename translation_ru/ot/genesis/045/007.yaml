lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: послал меня
  rationale: Нарративная форма wayyiqtol естественно передаётся русским прошедшим совершенного вида.
- source_word: לִפְנֵיכֶם
  choice: вперёд вас
  rationale: В данном контексте выражение указывает на то, что Иосиф был послан раньше братьев; этот вариант сохраняет образ исходного оборота и ясно передаёт временное предшествование.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: чтобы сохранить для вас остаток
  rationale: Хотя שׂוּם буквально означает «поместить, установить», в сочетании с שְׁאֵרִית здесь речь идёт об обеспечении сохранения тех, кто останется в живых.
- source_word: שְׁאֵרִית
  choice: остаток
  rationale: Передаёт значение того, что осталось или уцелело, и сохраняет важную лексическую связь с библейским мотивом остатка, не исключая смысла «уцелевшие».
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: Контекст указывает на конкретную страну, Египет; указательное «этой» делает локальный смысл естественным по-русски, не называя место сверх исходного текста.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: и оставить вас в живых
  rationale: Каузатив глагола חיה означает сохранить или оставить в живых; выбран естественный современный русский оборот.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: ради великого избавления
  rationale: Предлог לְ допускает значение цели или результата, а פְּלֵיטָה может обозначать избавление, спасение либо уцелевших. «Ради великого избавления» сохраняет целевую направленность, не превращая оборот в явно инструментальный.
theological_decisions:
- issue: Передавать ли שְׁאֵרִית как «остаток» или как «уцелевших/потомство»
  choice: остаток
  alternative: уцелевшие; потомство
  rationale: «Остаток» лексически близок еврейскому слову и сохраняет его библейский резонанс; примечание раскрывает более непосредственный контекстуальный смысл.
- issue: Обозначает ли לִפְלֵיטָה גְּדֹלָה избавление как событие/результат или множество уцелевших
  choice: ради великого избавления
  alternative: чтобы уцелели многие; ради великого спасения
  rationale: Фраза допускает оба смысловых направления. Основной текст передаёт спасительный результат, а примечание сохраняет альтернативу, связанную с уцелевшими людьми.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому параллелизму, но звучит естественно; неоднозначность заключительной фразы сохранена в примечании.
