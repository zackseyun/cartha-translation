    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартно передаёт повествовательный wayyiqtol, сохраняя последовательное течение еврейского рассказа.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняет имя, прямо употреблённое в еврейском тексте, без замены на «Иаков».
- source_word: רַב
  choice: Довольно!
  rationale: В данном восклицательном контексте слово выражает достаточность; краткое «Довольно!» сохраняет резкость и эмоциональную силу реплики.
- source_word: עוֹד
  choice: ещё
  rationale: В сочетании с חָי указывает, что Иосиф по-прежнему жив.
- source_word: בְּנִי
  choice: мой сын
  rationale: Прямо передаёт притяжательную конструкцию и личный, семейный акцент.
- source_word: חָי
  choice: жив
  rationale: Естественное русское сказуемое для обозначения того, что человек остаётся в живых.
- source_word: אֵלְכָה
  choice: Пойду
  rationale: Когортатив выражает решимость говорящего; форма «Пойду» естественно передаёт твёрдое намерение без добавления значения обязанности.
- source_word: וְאֶרְאֶנּוּ
  choice: и увижу его
  rationale: Прямо и современно передаёт глагол зрения с местоименным суффиксом третьего лица.
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Естественно вводит временное придаточное о событии, которое ещё не наступило.
- source_word: אָמֽוּת
  choice: умру
  rationale: Прямая и идиоматичная передача формы глагола מות в русском временном придаточном.
