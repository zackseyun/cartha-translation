base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: ru
  text: 'Тогда Иосиф уже не мог сдерживаться при всех, кто стоял возле него, и крикнул: «Выведите от меня всех!» И никого не осталось с ним, когда Иосиф открыл братьям, кто он.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: не мог сдерживаться
  rationale: Естественно передаёт сочетание отрицания с глаголом способности и возвратное значение хитпаэля, не уточняя сверх текста, какое именно чувство Иосиф сдерживал.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: при всех, кто стоял возле него
  rationale: «При всех» передаёт значение присутствия, а «стоял возле него» сохраняет образ и не заменяет этих людей более толковательным словом «слуги».
- source_word: וַיִּקְרָא
  choice: громко приказал
  rationale: Глагол указывает на возглас или громкое обращение; последующая форма повеления позволяет естественно выразить это по-русски как громко отданный приказ.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Пусть все выйдут от меня!
  rationale: Передаёт каузативное повеление во множественном числе и идиоматическое значение כָל אִישׁ как «все», сохраняя выражение «от меня».
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: И никого не осталось с ним
  rationale: 'Контекстуально передаёт смысл буквального «никто не стоял с ним»: никто не остался присутствовать.'
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: когда Иосиф открылся своим братьям
  rationale: Естественное русское выражение для возвратной формы со значением «дал узнать себя, явил, кто он»; не добавляет сведений о способе раскрытия.
