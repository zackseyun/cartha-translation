  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: ru
  text: 'Тебе велено: «Сделайте вот что: возьмите себе из земли Египта повозки[a] для ваших малых детей[b] и жён, привезите вашего отца и приходите[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «телеги».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ваших малых»; имеются в виду маленькие дети.'
    reason: lexical_alternative
  - marker: c
    text: 'По смыслу: «придите в Египет» или «возвращайтесь в Египет»; еврейский текст буквально говорит лишь «приходите».'
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: тебе велено
  rationale: Пассивная форма указывает, что Иосиф получил повеление; по контексту оно исходит от фараона. Русское «тебе велено» естественно передаёт результат данного распоряжения.
- source_word: זֹאת עֲשׂוּ
  choice: Сделайте вот что
  rationale: Естественная современная формула, сохраняющая указательное местоимение и повелительную силу выражения.
- source_word: קְחוּ לָכֶם
  choice: возьмите себе
  rationale: «Себе» передаёт значение местоименного дополнения с לְ, не утяжеляя русскую фразу.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из Египетской земли
  rationale: Сохраняет явно присутствующее в еврейском тексте אֶרֶץ и остаётся понятным в литературном русском.
- source_word: עֲגָלוֹת
  choice: повозки
  rationale: Речь идёт о колёсных средствах для перевозки семьи; «повозки» точно и нейтрально для данного исторического контекста.
- source_word: לְטַפְּכֶם
  choice: для ваших малых детей
  rationale: טַף обозначает именно маленьких детей, а не детей вообще; такой перевод яснее, чем субстантивированное «малые».
- source_word: וְלִנְשֵׁיכֶם
  choice: и жён
  rationale: В контексте переселения семей נָשִׁים означает жён.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: привезите вашего отца
  rationale: נשא буквально связано с несением или перевозкой, но здесь речь о доставке отца на повозке; «привезите» естественно передаёт действие и не создаёт впечатления, будто его должны нести на руках.
- source_word: וּבָאתֶם
  choice: и приходите
  rationale: Еврейский глагол означает «приходить». Контекст подразумевает прибытие в Египет, однако значение «вернитесь» не выражено прямо, поэтому оно оставлено для примечания.
