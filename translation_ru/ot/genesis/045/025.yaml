lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: вышли
  rationale: Глагол עלה буквально передаёт движение вверх; в устойчивом описании пути из Египта в Ханаан русское «вышли» естественно сохраняет исходный пункт и не сводит выражение к нейтральному «отправились».
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: Предлог מִן обозначает исходную точку движения; «из Египта» — прямое и естественное соответствие.
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: בוא обычно означает «приходить, входить»; «пришли» естественно продолжает повествовательную последовательность, не уточняя сверх текста способ пересечения границы.
- source_word: אֶרֶץ כְּנַעַן
  choice: в землю Ханаанскую
  rationale: Перевод сохраняет явно выраженное אֶרֶץ «земля» и использует традиционную, понятную современному читателю русскую форму географического названия.
- source_word: אֶל יַעֲקֹב
  choice: к … Иакову
  rationale: Предлог אֶל выражает направление к лицу; имя передано в принятой русской библейской форме.
- source_word: אֲבִיהֶם
  choice: своему отцу
  rationale: Суффикс обозначает «их отца»; русское возвратное притяжательное «своему» однозначно соотносит отца с подлежащим и звучит естественнее буквального «их отцу».
