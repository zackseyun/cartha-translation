  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: ru
  text: 'А теперь не огорчайтесь и не сердитесь на себя[a] за то, что продали меня сюда: ведь Бог послал меня прежде вас, чтобы сохранить жизнь[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и пусть не разгорится в ваших глазах» — еврейский оборот, выражающий гнев или досаду.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для сохранения жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и соединительную силу וְ, и переход к обращению Иосифа в настоящей ситуации.
- source_word: אַל תֵּעָצְבוּ
  choice: не огорчайтесь
  rationale: Передаёт эмоциональную боль и печаль, выраженные глаголом עצב, естественным современным русским языком.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: и не сердитесь на себя
  rationale: Естественно передаёт еврейский идиоматический оборот о гневе или досаде; в контексте речь идёт о реакции братьев на собственный поступок.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: за то, что продали меня сюда
  rationale: Сохраняет прямое указание на поступок братьев и направительное значение הֵנָּה — «сюда».
- source_word: לְמִחְיָה
  choice: чтобы сохранить жизнь
  rationale: Ясно выражает цель и смысл существительного מִחְיָה — сохранение жизни, выживание; не уточняет, чья именно жизнь, поскольку этого не уточняет еврейский текст.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: Бог послал меня
  rationale: Прямо сохраняет активное действие Бога, выраженное еврейским перфектом.
- source_word: לִפְנֵיכֶם
  choice: прежде вас
  rationale: Передаёт то, что Иосиф был послан перед братьями, то есть раньше них; формулировка естественна и сохраняет идею предшествования.
theological_decisions:
- issue: Божественное провидение и человеческая ответственность
  choice: Сохранены рядом как виновное действие братьев («продали меня»), так и целенаправленное действие Бога («Бог послал меня»).
  alternative: Смягчить поступок братьев либо представить действие Бога только как допущение.
  rationale: Еврейский текст намеренно сопоставляет человеческое действие и Божью цель, не устраняя напряжения между ними.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Двоеточие естественно вводит объяснение, выраженное вторым כִּי. Формулировка не снимает напряжения между ответственностью братьев и Божьим замыслом.
