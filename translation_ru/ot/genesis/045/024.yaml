  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: ru
  text: 'Иосиф отпустил братьев, и они отправились в путь. Он сказал им: «Не ссорьтесь по дороге»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не волнуйтесь», «не гневайтесь» или «не бойтесь в пути». Древнееврейский глагол может обозначать разные виды сильного душевного волнения; перевод «не ссорьтесь» соответствует непосредственному контексту совместной дороги братьев после того, как Иосиф открылся им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Иосиф отпустил
  rationale: Порода piel глагола שׁלח здесь передаёт отправление людей от себя; «отпустил» естественно выражает это по-русски. Имя «Иосиф» восстанавливает явного деятеля из контекста, не меняя смысла.
- source_word: אֶת־אֶחָיו
  choice: братьев
  rationale: Прямое обозначение родных братьев Иосифа; обобщение не требуется.
- source_word: וַיֵּלֵכוּ
  choice: они отправились в путь
  rationale: Глагол הלך означает «идти»; после «отпустил» эта формулировка естественно передаёт начало их дороги.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Он сказал им
  rationale: Прозрачная передача обычной древнееврейской формулы введения прямой речи.
- source_word: אַל
  choice: не
  rationale: Стандартная передача запрета с отрицательной частицей אַל.
- source_word: תִּרְגְּזוּ
  choice: ссорьтесь
  rationale: Глагол רגז может обозначать разные виды волнения, дрожи, страха или гнева. В контексте совместного возвращения братьев после признания Иосифа «ссорьтесь» правдоподобно передаёт предостережение от взаимных обвинений, а неоднозначность сохранена в примечании.
- source_word: בַּדָּרֶךְ
  choice: по дороге
  rationale: Естественная современная русская передача пути или путешествия обратно в Ханаан.
