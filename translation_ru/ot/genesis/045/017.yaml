  verdict: revise
  source_fidelity: В целом переданы распоряжение фараона, повеление братьям, погрузка животных и направление в Ханаан. Однако «скот» шире, чем בְּעִירֶךָ в данном дорожном контексте, где подразумеваются животные, используемые для перевозки; более точное «вьючные животные» устраняет эту неточность. Сочетание двух повелений וּלְכוּ בֹאוּ естественно передать одним русским глаголом движения с указанной целью.
  naturalness: «Навьючьте свой скот» звучит несколько шероховато и может вызвать образ погрузки скота как груза. «Навьючьте своих вьючных животных» ясно и литературно. «В землю Ханаанскую» нормативно, но стилистически архаизовано; «в землю Ханаана» современнее и прямо передаёт конструкцию «земля Ханаана».
  terminology: «Фараон», «Иосиф» и «Ханаан» переданы верно. Замена собирательного «скот» на «вьючные животные» лучше соответствует контекстуальному значению бְּעִיר. Богословски нагруженных терминов нет.
