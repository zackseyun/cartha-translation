  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: ru
  text: 'И сказал фараон Иосифу: «Скажи своим братьям: „Сделайте вот что: навьючьте своих вьючных животных и отправляйтесь в землю Ханаана“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное и естественное русское «И сказал» сохраняет связь с предыдущим контекстом.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение египетского правителя.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Скажи своим братьям
  rationale: Прямо передаёт повелительный инфинитив и адресата речи без перехода к косвенной конструкции.
- source_word: זֹאת עֲשׂוּ
  choice: Сделайте вот что
  rationale: Естественный современный русский эквивалент указательного местоимения с повелением.
- source_word: טַעֲנוּ
  choice: навьючьте
  rationale: Глагол означает нагрузить животных для перевозки; «навьючьте» точно и кратко выражает действие в дорожном контексте.
- source_word: בְּעִירְכֶם
  choice: свой скот
  rationale: Слово обозначает домашних животных, здесь используемых для перевозки. «Скот» сохраняет собирательное значение, а «свой» естественно согласуется с обращением во множественном числе.
- source_word: וּלְכוּ בֹאוּ
  choice: отправляйтесь
  rationale: Два последовательных повеления буквально выражают уход и прибытие. В русском контексте единый глагол движения естественно охватывает путешествие к названной цели, не создавая неясного сочетания «идите, придите».
- source_word: אַרְצָה כְּנָעַן
  choice: в землю Ханаанскую
  rationale: Передаёт направительный суффикс и явно сохраняет существительное «земля»; форма соответствует нормативному библейскому географическому наименованию.
