  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ אֲנִ֣י יוֹסֵ֔ף הַ/ע֥וֹד אָבִ֖/י חָ֑י וְ/לֹֽא יָכְל֤וּ אֶחָי/ו֙ לַ/עֲנ֣וֹת אֹת֔/וֹ כִּ֥י נִבְהֲל֖וּ מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: ru
  text: 'Иосиф сказал своим братьям: «Я — Иосиф. Мой отец ещё жив?» Но братья не могли ему ответить, потому что пришли в смятение в его присутствии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испугались его»; буквально: «пришли в смятение перед его лицом».'
    reason: 'Лексическая неоднозначность: נבהל может выражать смятение, потрясение или испуг, а מִפָּנָיו буквально указывает на нахождение перед его лицом, то есть в его присутствии.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; в современном русском отдельное «тогда» здесь необязательно.
- source_word: אֶל אֶחָיו
  choice: своим братьям
  rationale: Естественная русская передача адресата речи; возвратное притяжательное «своим» ясно связывает братьев с Иосифом.
- source_word: אֲנִי יוֹסֵף
  choice: Я — Иосиф
  rationale: Именное предложение служит выразительным самооткрытием; тире соответствует нормам русского письма.
- source_word: הַעוֹד אָבִי חָי
  choice: Мой отец ещё жив?
  rationale: Сохраняет явное «мой отец» и вопрос о продолжающемся состоянии.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: Но братья не могли ему ответить
  rationale: «Но» естественно выражает контраст, а «не могли ответить» близко передаёт יכל с инфинитивом.
- source_word: נִבְהֲלוּ
  choice: пришли в смятение
  rationale: Глагол обозначает сильную растерянность, потрясение или испуг; выбранная формулировка сохраняет широту значения, не сводя его исключительно к ужасу.
- source_word: מִפָּנָיו
  choice: оказавшись перед ним
  rationale: Передаёт буквальный пространственно-присутственный образ «от/перед его лицом» и указывает, что потрясение вызвано непосредственным присутствием Иосифа.
