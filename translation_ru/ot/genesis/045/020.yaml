  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: ru
  text: И не жалейте своего имущества[a], ведь всё лучшее во всей земле Египта — ваше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть ваш глаз не жалеет вашего имущества»; то есть не сожалейте об оставляемых вещах и не беспокойтесь о них.'
    reason: Сохранение образа еврейского идиоматического выражения и пояснение его смысла.
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: И не жалейте
  rationale: Еврейское выражение буквально представляет глаз субъектом глагола «жалеть, щадить». По-русски «пусть ваш глаз не жалеет» звучит неестественно, поэтому в основном тексте передан смысл призыва не сожалеть об оставляемом имуществе, а образ исходного текста сохранён в сноске.
- source_word: עַל כְּלֵיכֶם
  choice: о своём имуществе
  rationale: כְּלִי может обозначать вещи, утварь, снаряжение или имущество. В контексте переселения «имущество» достаточно широко охватывает домашние вещи; возвратное «своём» естественно при обращении к группе.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего повеления; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: טוּב כָּל אֶרֶץ מִצְרַיִם
  choice: всё лучшее во всей земле Египетской
  rationale: טוּב здесь означает лучшие блага и богатства земли, а не отвлечённую доброту. Формулировка сохраняет и значение превосходного качества, и охват всей земли.
- source_word: לָכֶם הוּא
  choice: — ваше
  rationale: Конструкция с לְ и местоимением выражает принадлежность с оттенком уверенного заверения. Именная конструкция в настоящем времени естественна по-русски.
