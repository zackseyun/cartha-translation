source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: ru
  text: Итак, не вы послали меня сюда, а Бог; Он поставил меня отцом фараону[a], господином над всем его домом и правителем всей земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как отец фараону», то есть как главный покровитель, советник или благодетель.'
    reason: 'Лексико-синтаксическая альтернатива: еврейское выражение сохраняет метафору отца и может обозначать роль или положение при фараоне.'
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительное וְ, и временно-дискурсивное значение עַתָּה; выражение вводит вывод Иосифа из предшествующей речи.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: не вы послали меня сюда
  rationale: Ударение на «вы» передано естественным для русского языка порядком слов; הֵנָּה означает «сюда», то есть в Египет.
- source_word: כִּי הָאֱלֹהִים
  choice: а Бог
  rationale: 'После отрицания כִּי вводит резкое противопоставление: «не вы… а Бог».'
- source_word: וַיְשִׂימֵנִי
  choice: Он поставил меня
  rationale: Глагол שׂים здесь обозначает наделение положением или назначение; «поставил» естественно связывает совершённое Божье действие с нынешним положением Иосифа.
- source_word: לְאָב לְפַרְעֹה
  choice: отцом для фараона
  rationale: Сохранён образ «отца», охватывающий роль покровителя, советника и благодетеля; более узкое «советником» неоправданно устранило бы метафору.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: господином над всем его домом
  rationale: «Господин» передаёт власть, выраженную אָדוֹן, а «дом» сохраняет широкое значение дома, двора и хозяйства фараона.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: и правителем всей земли Египетской
  rationale: Причастие מֹשֵׁל обозначает того, кто осуществляет власть; «правитель» не сужает смысл до конкретной административной должности.
theological_decisions:
- issue: Божье владычество и человеческая ответственность в словах Иосифа
  choice: Сохранено сильное противопоставление «не вы… а Бог» без поясняющей богословской парафразы.
  alternative: Смягчить отрицание или прямо разъяснить соотношение человеческого поступка и Божьего промысла.
  rationale: Иосиф подчёркивает решающее Божье намерение, но контекст не отрицает реального поступка братьев. Перевод сохраняет это напряжение и не навязывает ему систематического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис ясен и не перегружен архаизмами; метафора «отец для фараона» сохранена, а её смысл пояснён в сноске.
