  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: ru
  text: И они пересказали ему все слова Иосифа, которые тот сказал им, и он увидел повозки, присланные Иосифом, чтобы перевезти его, и дух их отца Иакова ожил.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иаков воспрянул духом»; еврейское выражение может обозначать возвращение жизненных сил и воодушевления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: И они передали ему
  rationale: Глагол דבר с אֶל обозначает обращённую к нему речь; «передали ему» естественно вводит пересказ братьями слов Иосифа, сохраняя повествовательное וַ как «и».
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: все слова Иосифа, которые он сказал им
  rationale: «Все слова» сохраняет конкретный דִּבְרֵי, а «сказал им» естественно передаёт повтор глагола דבר без тяжеловесности.
- source_word: הָעֲגָלוֹת
  choice: повозки
  rationale: עֲגָלוֹת — колёсные транспортные средства; «повозки» нейтрально и уместно для древнего контекста.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: присланные Иосифом, чтобы перевезти его
  rationale: לָשֵׂאת буквально связано с несением, но применительно к повозкам естественное русское выражение — «перевезти его».
- source_word: וַתְּחִי רוּחַ
  choice: дух ... ожил
  rationale: Сохраняется образ חיה — возвращения к жизни; фраза по-русски выражает восстановление жизненных сил и надежды, не устраняя образную неоднозначность.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Иакова, их отца
  rationale: Традиционная и общеупотребительная русская форма библейского имени — «Иаков»; порядок слов соответствует естественной литературной русской речи.
theological_decisions:
- issue: Смысл выражения וַתְּחִי רוּחַ יַעֲקֹב
  choice: дух Иакова ... ожил
  alternative: Иаков ... воспрянул духом
  rationale: Более буквальная формулировка сохраняет упоминание «духа» и метафору оживания, не сводя выражение исключительно к эмоциям или ободрению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Длинная еврейская цепочка повествовательных союзов разделена на два предложения; связь второго события с последующим оживлением духа естественно передана конструкцией «когда же».
