  rationale: Перевод приведён к единой русской повествовательной цепи, соответствующей трём последовательным еврейским глагольным формам. Сохранены «все слова», образ «дух ... ожил», имена в принятой русской библейской форме и функциональный смысл повозок. Примечание оставлено только при образном выражении, к которому оно относится, и сформулировано как допустимая идиоматическая альтернатива.
