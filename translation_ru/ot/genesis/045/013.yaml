  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: ru
  text: Расскажите моему отцу обо всём моём почёте[a] в Египте и обо всём, что вы видели. Поспешите и привезите моего отца сюда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обо всей моей славе». Еврейское слово כָּבוֹד может означать почёт, славу, достоинство или величие; здесь оно указывает на высокое положение Иосифа в Египте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתֶּם
  choice: Расскажите
  rationale: Hiphil глагола נגד означает «сообщить, рассказать». Русское «расскажите» естественно передаёт прямое повеление Иосифа братьям.
- source_word: כָּל כְּבוֹדִי
  choice: обо всём моём почёте
  rationale: כבוד может обозначать почёт, славу, достоинство и высокое положение. В придворном контексте речь идёт о почёте и статусе Иосифа в Египте; «почёт» сохраняет ключевой образ без излишне религиозного оттенка слова «слава».
- source_word: בְּמִצְרַיִם
  choice: в Египте
  rationale: Прямое обозначение места.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: обо всём, что вы видели
  rationale: Фраза охватывает все увиденные братьями свидетельства положения и власти Иосифа. Повтор предлога «обо» делает два однородных объекта глагола ясными и естественными по-русски.
- source_word: וּמִהַרְתֶּם
  choice: Поспешите
  rationale: Форма выражает настоятельное побуждение; «поспешите» передаёт срочность и соответствует достоинству повествовательной речи.
- source_word: וְהוֹרַדְתֶּם
  choice: привезите
  rationale: Hiphil от ירד буквально означает «заставить спуститься, доставить вниз». В контексте поездки престарелого Иакова в Египет на присланных повозках «привезите» естественно передаёт каузативное перемещение к Иосифу, хотя пространственный образ движения «вниз» в русском явно не выражен.
- source_word: הֵנָּה
  choice: сюда
  rationale: Наречие указывает направление к месту, где находится говорящий; русский эквивалент «сюда» точно и идиоматично передаёт значение.
