translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис близок к еврейскому, но естественен по-русски. «Моему отцу» сохраняет личную формулировку Иосифа; «привезите» учитывает ближайший контекст повозок и избегает неестественного русского «спустите отца сюда».
