base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: ru
  text: 'А отцу своему он послал вот что: десять ослов, навьюченных лучшим из богатств Египта[a], и десять ослиц, навьюченных зерном, хлебом и припасами отцу в дорогу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из лучших благ Египта»; возможно также: «из египетского изобилия».'
    reason: 'лексическая альтернатива: מִטּוּב מִצְרָיִם может обозначать лучшие блага Египта либо его изобилие; предлог מִן передаёт связь «из».'
lexical_decisions:
- source_word: כְּזֹאת
  choice: вот что
  rationale: Оборот вводит последующее перечисление посланного; «вот что» естественно передаёт эту функцию в современном русском языке.
- source_word: חֲמֹרִים
  choice: ослов
  rationale: Нейтральное современное обозначение животных; родовое или мужское наименование здесь противопоставлено явно женской форме далее.
- source_word: נֹשְׂאִים
  choice: навьюченных
  rationale: В контексте вьючных животных причастие означает, что они несли груз; «навьюченных» естественно и точно описывает способ перевозки.
- source_word: מִטּוּב מִצְרָיִם
  choice: лучшими дарами Египта
  rationale: טוּב обозначает лучшее, благо или изобилие страны. «Дары Египта» передаёт содержимое груза без неоправданного сведения его только к плодам или продуктам; альтернативное понимание конструкции отмечено в сноске.
- source_word: אֲתֹנֹת
  choice: ослиц
  rationale: Сохраняется явное указание еврейского текста на животных женского пола и отличие от חֲמֹרִים в первой части стиха.
- source_word: בָּר
  choice: зерном
  rationale: Общее обозначение зерна без необоснованного уточнения конкретной культуры.
- source_word: לֶחֶם
  choice: хлебом
  rationale: Сохранено обычное конкретное значение слова в перечне дорожных припасов.
- source_word: מָזוֹן
  choice: припасами
  rationale: В дорожном контексте слово означает пищевые запасы или провизию; «припасы» отличает общее снабжение от уже названного хлеба.
- source_word: לַדָּרֶךְ
  choice: в дорогу
  rationale: Естественный русский оборот для припасов, предназначенных на время пути.
