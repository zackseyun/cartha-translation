base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: ru
  text: Сыновья Израиля так и сделали. Иосиф дал им повозки по повелению фараона[a] и дал им припасы на дорогу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по устам фараона» — еврейское выражение со значением «по повелению фараона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: так и сделали
  rationale: Естественно передаёт указание на исполнение ранее сказанного; частица «и» подчёркивает, что они поступили именно так.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновья Израиля
  rationale: В непосредственном контексте речь идёт именно о сыновьях Иакова, поэтому сохраняется конкретное мужское обозначение, а не более широкое «дети Израиля».
- source_word: עֲגָלוֹת
  choice: повозки
  rationale: Слово обозначает колёсные транспортные средства для перевозки людей и имущества; «повозки» уместно в повествовании и понятно современному читателю.
- source_word: עַל פִּי פַרְעֹה
  choice: по повелению фараона
  rationale: Еврейская идиома буквально означает «по устам фараона» и указывает на распоряжение правителя; выбранный вариант ясно и достойно передаёт её смысл.
- source_word: צֵדָה
  choice: припасы
  rationale: Обозначает запас необходимого для пути, прежде всего продовольствие; «припасы» не сужает значение до одной конкретной еды.
- source_word: לַדָּרֶךְ
  choice: на дорогу
  rationale: Обычное современное русское выражение для припасов, предназначенных для путешествия.
