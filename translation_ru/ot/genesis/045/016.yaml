source:
  edition: WLC
  text: וְ/הַ/קֹּ֣ל נִשְׁמַ֗ע בֵּ֤ית פַּרְעֹה֙ לֵ/אמֹ֔ר בָּ֖אוּ אֲחֵ֣י יוֹסֵ֑ף וַ/יִּיטַב֙ בְּ/עֵינֵ֣י פַרְעֹ֔ה וּ/בְ/עֵינֵ֖י עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: ru
  text: 'В доме фараона[a] услышали весть: «Пришли братья Иосифа». Это понравилось фараону и его слугам[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «дом фараона» может означать также двор фараона, то есть его придворное окружение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его придворным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: услышали весть
  rationale: 'Буквально: «голос (или молва) был услышан». В данном контексте речь идёт о сообщении, содержание которого далее приводится; безлично-активная русская конструкция естественно передаёт еврейский пассив.'
- source_word: בֵּית פַּרְעֹה
  choice: в доме фараона
  rationale: Прямо передаёт еврейское выражение, не сужая его значения до дворца; в контексте оно может обозначать также двор или царское окружение.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский вводный оборот естественно передаётся по-русски пунктуационным введением содержания вести, без тяжеловесного «говоря».
- source_word: בָּאוּ
  choice: пришли
  rationale: 'Совершенный вид передаёт завершённое прибытие братьев и его актуальный результат: они уже здесь.'
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: это понравилось
  rationale: Естественный современный русский эквивалент идиомы «это было хорошо в глазах», сохраняющий значение одобрения или удовлетворения.
- source_word: עֲבָדָיו
  choice: его слугам
  rationale: Прямое значение слова עֶבֶד; в царском контексте оно может включать придворных и должностных лиц, что отмечено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренным сохранением образности оригинала. Формулировка ясна для широкого читателя; еврейское «говоря» передано двоеточием, а идиома «было хорошо в глазах» — естественным русским «понравилось».
