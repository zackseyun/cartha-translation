lexical_decisions:
- source_word: וַיִּפֹּל
  choice: бросился
  rationale: В контексте встречи נפל על־צוארי описывает порывистое объятие; «бросился на шею» естественно передаёт конкретный образ и эмоциональную силу еврейской идиомы.
- source_word: צַוְּארֵי / צַוָּארָיו
  choice: на шею / у него на шее
  rationale: Формально множественная форма צַוְּארֵי в этой идиоме обозначает шею как место объятия. В русском естественно употребить единственное число; во второй части «у него на шее» ясно указывает на Иосифа.
- source_word: בִנְיָמִן
  choice: Вениамин
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: אָחִיו
  choice: своему брату
  rationale: Возвратное притяжательное местоимение естественно по-русски передаёт отношение к субъекту Иосифу и сохраняет явное указание на братство.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: заплакал / плакал
  rationale: 'Видовое различие естественно отражает формы повествования: первое действие представлено как наступившее событие, второе — как продолжающееся действие; оба глагола передают בכה.'
- source_word: וּבִנְיָמִן
  choice: а Вениамин
  rationale: Русское «а» естественно координирует и сопоставляет ответное действие Вениамина без добавления сильного противопоставления.
