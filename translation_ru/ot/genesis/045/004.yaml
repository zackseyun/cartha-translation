  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: ru
  text: 'Тогда Иосиф сказал братьям: «Подойдите, пожалуйста, ко мне». Они подошли, и он сказал: «Я Иосиф, ваш брат, которого вы продали в Египет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал / и … сказал
  rationale: Форма с последовательным וַ продвигает повествование. Первое употребление естественно передано словом «тогда», второе — союзом «и», чтобы сохранить последовательность без тяжеловесного повтора.
- source_word: אֶל־אֶחָיו
  choice: братьям
  rationale: Существительное אָח во множественном числе с суффиксом 3-го лица единственного числа означает «его братьям»; принадлежность в русском ясна из подлежащего «Иосиф» и контекста.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: Подойдите, пожалуйста, ко мне
  rationale: נגשׁ обозначает приближение, а נָא придаёт просьбе вежливый, побудительный оттенок. «Подойдите» естественно и точно передаёт действие без добавления сравнительного значения «поближе».
- source_word: וַיִּגָּשׁוּ
  choice: Они подошли
  rationale: Повтор глагола «подошли» сохраняет лексическую связь с повелением «подойдите» и показывает непосредственный отклик братьев.
- source_word: אֲנִי יוֹסֵף
  choice: Я Иосиф
  rationale: Именное предложение естественно передаётся по-русски без связки «есть»; используется традиционная русская форма имени.
- source_word: אֲחִיכֶם
  choice: ваш брат
  rationale: Единственное число с суффиксом 2-го лица множественного числа прямо обозначает родство Иосифа со всеми собеседниками.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: которого вы продали
  rationale: Относительное предложение сохраняет прямое и личное указание на поступок братьев, не усиливая обвинение дополнительными словами.
- source_word: מִצְרָיְמָה
  choice: в Египет
  rationale: Направительный суффикс ה указывает на движение к Египту. В современном русском «продали в Египет» естественно выражает назначение и направление.
