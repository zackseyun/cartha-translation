  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: ru
  text: Там я буду обеспечивать тебя, потому что голод продлится ещё пять лет, чтобы ты не обнищал вместе со своим домом и всем, что у тебя есть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: я буду обеспечивать
  rationale: Пиэль от כול означает содержать, снабжать необходимым; длительная форма «буду обеспечивать» естественно передаёт заботу в течение оставшихся лет голода.
- source_word: כִּי עוֹד חָמֵשׁ שָׁנִים רָעָב
  choice: потому что голод продлится ещё пять лет
  rationale: Сжатая именная конструкция буквально указывает, что впереди ещё пять лет голода; глагольная формулировка ясна по-русски и сохраняет причинную связь כִּי.
- source_word: פֶּן תִּוָּרֵשׁ
  choice: чтобы ... не обнищали
  rationale: פֶּן выражает предотвращаемый нежелательный исход, а נורש здесь означает лишиться достатка, впасть в нужду. Множественное согласование охватывает перечисленные далее семью и имущество наряду с адресатом.
- source_word: בֵיתְךָ
  choice: твой дом
  rationale: В контексте речь идёт о домашней общине, семье и домочадцах; традиционное «дом» сохраняет широту еврейского выражения.
- source_word: כָל־אֲשֶׁר־לָךְ
  choice: всё, что у тебя есть
  rationale: Прямое и естественное соответствие, охватывающее всё имущество и достояние адресата.
theological_decisions:
- issue: Связь причины и предотвращаемого результата
  choice: «потому что ... чтобы ... не»
  alternative: «ведь ... иначе ...»
  rationale: 'Так сохраняются обе связи исходного текста: כִּי вводит причину обеспечения, а פֶּן — нежелательный исход, который Иосиф намерен предотвратить.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранено широкое библейское выражение «твой дом»; архаичные «пропитывать» и «оскудеть» не использованы.
