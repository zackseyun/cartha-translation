base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: ru
  text: Ты поселишься в земле Гошен и будешь рядом со мной — ты, твои сыновья и внуки, твой мелкий и крупный скот и всё, что у тебя есть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: ты поселишься
  rationale: ישׁב может означать «жить, обитать, поселиться». В контексте приглашения переселиться в определённую область «поселишься» естественно передаёт начало постоянного проживания.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: в земле Гошен
  rationale: Сохраняется географическая конструкция с אֶרֶץ и традиционная русская передача названия Гошен.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: и будешь рядом со мной
  rationale: Конструкция היה с קָרוֹב выражает близость; «рядом со мной» ясно и естественно передаёт прежде всего пространственный смысл, не исключая личной близости.
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение имеет акцентирующую функцию; тире и последующее перечисление сохраняют это выделение.
- source_word: וּבָנֶיךָ וּבְנֵי בָנֶיךָ
  choice: твои сыновья и внуки
  rationale: בנים здесь обозначает сыновей, а буквально «сыновья твоих сыновей» естественно передаётся словом «внуки»; мужская отнесённость исходного текста сохраняется контекстом.
- source_word: וְצֹאנְךָ וּבְקָרְךָ
  choice: твой мелкий и крупный скот
  rationale: צֹאן обозначает мелкий скот, прежде всего овец и коз, а בָּקָר — крупный рогатый скот. Устойчивая русская пара точно и компактно сохраняет различие.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: и всё, что у тебя есть
  rationale: Широкая идиоматическая формула охватывает всё имущество и естественно звучит по-русски.
