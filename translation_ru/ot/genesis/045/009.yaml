  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: ru
  text: 'Поспешите, поднимитесь к моему отцу и скажите ему: «Так говорит твой сын Иосиф: Бог поставил меня владыкой всего Египта. Спускайся ко мне, не задерживайся[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не медли»; букв.: «не стой».'
    reason: 'Лексическая альтернатива: עמד буквально означает «стоять», но здесь в контексте срочного повеления имеет смысл «задерживаться, медлить».'
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Поспешите
  rationale: Форма повелительного наклонения во множественном числе передаёт настоятельность и звучит естественно в современном литературном русском.
- source_word: וַעֲלוּ
  choice: поднимитесь
  rationale: Сохранено буквальное направление движения из Египта в Ханаан; оно соответствует устойчивому пространственному языку повествования Бытия.
- source_word: אֶל אָבִי
  choice: к моему отцу
  rationale: Прямо передаёт направление без добавления отсутствующих в тексте подробностей.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: и скажите ему
  rationale: Последовательное предписание после повелительных форм естественно передано русским повелительным наклонением.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохранена торжественная формула передачи послания без архаичного синтаксиса.
- source_word: בִּנְךָ יוֹסֵף
  choice: твой сын Иосиф
  rationale: Переданы порядок слов и акцент на родственной связи Иосифа с адресатом.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Бог поставил меня
  rationale: Глагол שׂים здесь обозначает наделение положением или назначение; «поставил» сохраняет этот смысл и не уточняет способ назначения.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: владыкой всего Египта
  rationale: «Владыка» передаёт אָדוֹן как носителя широкой власти, не вводя более узкой официальной должности вроде «правителя».
- source_word: רְדָה אֵלַי
  choice: Спускайся ко мне
  rationale: Сохраняется буквальное движение вниз, в Египет, а «ко мне» естественно обозначает Иосифа как цель движения.
- source_word: אַל תַּעֲמֹד
  choice: не задерживайся
  rationale: В данном запрете עמד идиоматически означает не оставаться и не медлить; выбранная формулировка ясно передаёт срочность.
theological_decisions:
- issue: Передача אֱלֹהִים в утверждении Иосифа
  choice: Бог
  alternative: бог
  rationale: Единственное число сказуемого и контекст речи Иосифа указывают на единого Бога; прописная буква передаёт референцию без дополнительного богословского уточнения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным оттенком прямой речи. Географические глаголы «поднимитесь» и «спускайся» сохранены, а идиома в заключительном запрете передана естественно; буквальное значение отмечено в сноске.
