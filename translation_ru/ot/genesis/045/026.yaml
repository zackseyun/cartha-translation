  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: ru
  text: 'И они сообщили ему: «Иосиф ещё жив и правит всей землёй Египта». Но сердце его оцепенело[a], потому что он им не поверил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сердце его ослабело» или «сердце его замерло». Еврейское выражение описывает потрясённую, ослабевшую внутреннюю реакцию Иакова на эту весть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: И они сообщили ему
  rationale: Глагол в породе hифиль означает «сообщить, рассказать». Формула לֵאמֹר естественно передана двоеточием перед прямой речью, без тяжеловесного «говоря».
- source_word: עוֹד יוֹסֵף חַי
  choice: Иосиф ещё жив
  rationale: עוֹד указывает на продолжающееся состояние; «ещё жив» точно и естественно передаёт смысл.
- source_word: וְכִי הוּא מֹשֵׁל
  choice: и правит
  rationale: Причастие מֹשֵׁל обозначает осуществление власти. Глагольная передача звучит по-русски естественнее, чем «является правителем», и не приписывает Иосифу узкой должности.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: всей землёй Египетской
  rationale: При מֹשֵׁל предлог בְּ обозначает область владычества; русское управление «правит чем» ясно выражает этот смысл.
- source_word: וַיָּפָג לִבּוֹ
  choice: сердце его замерло
  rationale: Редкий глагол פוג передаёт ослабление, оцепенение или замирание. «Сердце его замерло» сохраняет телесно-эмоциональный образ и естественно описывает потрясение, не устраняя лексической неоднозначности, отмеченной в сноске.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: потому что он им не поверил
  rationale: כִּי вводит причину реакции Иакова; «потому что» недвусмысленно сохраняет причинную связь.
