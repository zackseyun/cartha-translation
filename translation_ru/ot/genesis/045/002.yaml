lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: Он зарыдал в голос
  rationale: Еврейская идиома буквально говорит, что он «дал свой голос в плаче», то есть заплакал громко и слышимо. Русское «зарыдал в голос» естественно передаёт силу и слышимость плача.
- source_word: וַיִּשְׁמְעוּ
  choice: услышали
  rationale: Глагол שׁמע здесь обозначает восприятие звука, а не внимательное слушание или повиновение.
- source_word: מִצְרַיִם
  choice: египтяне
  rationale: Хотя слово может означать страну Египет, форма глагола во множественном числе поддерживает собирательное личное значение — жителей или присутствовавших египтян.
- source_word: וַיִּשְׁמַע בֵּית פַּרְעֹה
  choice: услышали в доме фараона
  rationale: 'Единственное число глагола согласуется с собирательным выражением «дом фараона». Безлично-локальная русская конструкция сохраняет широту значения: царский дом, двор или люди при дворце.'
