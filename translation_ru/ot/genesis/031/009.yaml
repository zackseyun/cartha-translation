  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: ru
  text: Так Бог отнял скот у вашего отца и отдал его мне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «вырвал». В других контекстах этот еврейский глагол может также означать «избавить» или «спасти»; здесь речь идёт об изъятии у одной стороны и передаче другой.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: отнял
  rationale: Hiphil глагола נצל здесь обозначает изъятие у одной стороны с передачей другой. «Отнял» естественно передаёт этот переход, не усиливая значение до внезапного «выхватил» и не сводя его к избавлению от опасности.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычное русское соответствие названию Бога в данном контексте.
- source_word: מִקְנֵה
  choice: скот
  rationale: В пастушеском контексте речь идёт о домашних стадных животных; собирательное «скот» точно и естественно.
- source_word: אֲבִיכֶם
  choice: у вашего отца
  rationale: Суффикс второго лица множественного числа обращён к Рахили и Лии, тогда как «отец» стоит в единственном числе и означает их общего отца Лавана.
- source_word: וַיִּתֶּן לִי
  choice: и отдал его мне
  rationale: נתן обозначает передачу; местоимение «его» восстанавливает объект — собирательное существительное «скот». «Отдал» яснее сохраняет контраст с изъятием у Лавана, чем нейтральное «дал».
theological_decisions:
- issue: Божественное действие в благополучии Иакова
  choice: Прямо утверждается, что Бог отнял скот у Лавана и передал его Иакову.
  alternative: Смягчить высказывание до общего указания на Божье благословение Иакова.
  rationale: Еврейские глаголы וַיַּצֵּל и וַיִּתֶּן прямо приписывают Богу изъятие и передачу; перевод не ослабляет эту причинность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. «Скот» употреблено как собирательное существительное, поэтому далее стоит местоимение единственного числа «его».
