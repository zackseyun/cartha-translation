  - marker: b
    text: «Галаад» по-еврейски означает «груда свидетельства».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לּוֹ
  choice: назвал его
  rationale: В контексте наречения глагол קרא с ל и местоименным суффиксом означает «назвать». Мужской род местоимения естественно согласуется по-русски со словом «холм», подразумеваемым из предыдущего стиха.
- source_word: לָבָן
  choice: Лаван
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Иегар-Сагадуфа
  rationale: Арамейское наименование передано транслитерацией, чтобы сохранить различие языков и сам акт наречения; значение раскрыто в сноске.
- source_word: וְיַעֲקֹב
  choice: а Иаков
  rationale: Союз ו здесь сопоставляет два названия одного и того же памятного холма; русское «а» естественно передаёт это противопоставление без усиления.
- source_word: קָרָא ... לּוֹ
  choice: назвал его
  rationale: Повтор той же формулы наречения передан одинаково.
- source_word: גַּלְעֵד
  choice: Галаад
  rationale: Сохранена традиционная русская форма еврейского названия; его смысл указан в сноске.
