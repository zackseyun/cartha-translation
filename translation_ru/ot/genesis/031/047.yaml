  language: ru
  text: Лаван назвал его Иегар-Сагадуфа[a], а Иаков назвал его Галаад[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Иегар-Сагадуфа» по-арамейски означает «груда свидетельства».
