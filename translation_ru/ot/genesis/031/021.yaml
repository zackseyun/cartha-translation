  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: ru
  text: Он убежал со всем, что ему принадлежало; встав, перешёл реку[a] и направился к нагорью Галаада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятно, Евфрат; в еврейском тексте сказано просто: «река».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: убежал
  rationale: Глагол ברח означает «бежать, спасаться бегством». «Убежал» естественно передаёт тайный и поспешный уход Иакова, не добавляя мотива, которого нет в самом глаголе.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: со всем, что у него было
  rationale: Оборот охватывает всё принадлежавшее Иакову — людей, стада и имущество — и не сужает значение до одних вещей.
- source_word: וַיָּקָם
  choice: затем поднялся
  rationale: קום буквально обозначает вставание и в повествовании вводит следующий решительный шаг. «Поднялся» сохраняет образ исходного текста, а «затем» естественно связывает последовательность действий по-русски.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: перешёл Реку
  rationale: עבר означает переход через преграду. Заглавная буква отражает употребление «Реки» как известного географического обозначения, не подставляя в основной текст название Евфрата.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: направился к
  rationale: Буквально «обратил/устремил своё лицо»; русский глагол «направился» естественно передаёт намеренное движение к цели без тяжеловесной кальки.
- source_word: הַר הַגִּלְעָד
  choice: нагорью Галаада
  rationale: הַר может обозначать не одну вершину, а гористую область. В данном географическом контексте «нагорье Галаада» точнее, чем «гора Галаад».
