  yaml_path: translation/ot/genesis/031/004.yaml
  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: ru
  text: Иаков послал за Рахилью и Лией и позвал их в поле[a], к своему стаду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в поле, где находилось его стадо». Последняя фраза, вероятно, уточняет место встречи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к своему мелкому скоту».'
    reason: source_precision
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал за
  rationale: В данном контексте глагол означает, что Иаков отправил кого-то за Рахилью и Лией. Русское «послал за» естественно передаёт цель его действия, не уточняя неназванного посланника.
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: קרא с לְ при обозначении лиц значит «позвать, призвать». «Позвал» сохраняет простой повествовательный стиль и звучит современно.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: за Рахилью и Лией
  rationale: Имена переданы в традиционной русской библейской форме; падеж обусловлен естественной конструкцией «послал за».
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: Существительное שׂדה обозначает поле или открытую местность. Форма с направительным значением естественно передаётся по-русски как «в поле».
- source_word: אֶל צֹאנוֹ
  choice: к своему стаду
  rationale: Фраза буквально указывает направление «к его мелкому скоту» и, вероятно, уточняет место встречи. «К своему стаду» сохраняет пространственную конструкцию и остаётся естественным для современного русского языка.
