  source_fidelity: 'Основной смысл передан точно: ангел Божий обращается к Иакову во сне, и Иаков отвечает. Однако «в том сне» неестественно и излишне приписывает русскому указательному местоимению функцию еврейского определённого артикля. Еврейская определённость не требует такого перевода в русском языке. «Я сказал» ближе к וָאֹמַר, чем интерпретирующее «Я ответил».'
