lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность событий.
- source_word: אֵלַי
  choice: мне
  rationale: Прямое соответствие предлогу с суффиксом первого лица единственного числа.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ангел Божий
  rationale: В данном контексте מַלְאָךְ обозначает небесного посланника; традиционное и естественное русское сочетание «ангел Божий» точно передаёт принадлежность к Богу, не уточняя личность ангела сверх сказанного в тексте.
- source_word: בַּחֲלוֹם
  choice: в том сне[a]
  rationale: Определённая форма существительного отражена указательным местоимением «том»; более обычное русское «во сне» приведено в сноске как возможная передача.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: וָאֹמַר
  choice: Я ответил
  rationale: Хотя буквально глагол означает «я сказал», в этой реплике он вводит непосредственный ответ; «я ответил» естественно передаёт его функцию по-русски.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Естественная русская передача древнееврейской формулы готовности и отклика на обращение.
theological_decisions:
- issue: Передача מַלְאַךְ הָאֱלֹהִים в контексте, где возможен вопрос о связи ангела с самим Богом
  choice: ангел Божий
  alternative: посланник Бога
  rationale: Перевод сохраняет данное в стихе обозначение небесного существа и не разрешает подразумеваемый богословский вопрос о его личности.
translation_notes:
