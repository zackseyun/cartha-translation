  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: ru
  text: Иаков принёс жертву на горе и позвал своих братьев[a] разделить трапезу. Они ели и провели ночь на горе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих родичей», «своих родственников». Еврейское слово «братья» в этом контексте может обозначать также более широкий круг мужчин-родичей или спутников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח יַעֲקֹב זֶבַח
  choice: Иаков принёс жертву
  rationale: Еврейская однокоренная конструкция буквально означает «заколол жертву / совершил жертвоприношение». Русское «принёс жертву» естественно и ясно передаёт культовый смысл без тяжеловесного повтора.
- source_word: בָּהָר
  choice: на горе
  rationale: הַר может обозначать гору, холм или горную местность; определённая форма и повтор в стихе поддерживают прямой перевод «на горе».
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: קרא буквально значит «позвал»; в данном контексте зов одновременно служит приглашением к общей трапезе.
- source_word: לְאֶחָיו
  choice: своих братьев
  rationale: אָח буквально означает «брат», но в контексте может охватывать более широкий круг родичей или спутников. Основной текст сохраняет исходный родственный термин, а неоднозначность отмечена в сноске.
- source_word: לֶאֱכָל לָחֶם ... וַיֹּאכְלוּ לֶחֶם
  choice: разделить трапезу. Они ели
  rationale: Буквально дважды сказано «есть хлеб». Это обычный древнееврейский оборот со значением принятия пищи; «разделить трапезу» естественно передаёт совместный характер еды, а «они ели» избегает неестественного русского повтора, не добавляя конкретного меню.
- source_word: וַיָּלִינוּ
  choice: провели ночь
  rationale: לון означает остаться или расположиться на ночлег; «провели ночь» — точная и современная русская формулировка.
theological_decisions:
- issue: Значение слова «братья» в сцене заключения союза
  choice: В основном тексте сохранено «своих братьев» с пояснением в сноске.
  alternative: «своих родичей» или «своих родственников»
  rationale: Исходное слово сохраняет семейную лексику, но допускает более широкое значение, чем родные братья. Сноска удерживает эту контекстуальную неоднозначность, не закрепляя одну интерпретацию.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Еврейский идиоматический оборот «есть хлеб» передан естественным русским выражением о совместной трапезе; родственный термин «братья» сохранён с поясняющей сноской.
