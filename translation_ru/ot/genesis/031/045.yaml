  text: Иаков взял камень и поставил его как каменный столб[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как стоячий камень»; «как установленный камень». Еврейское מַצֵּבָה обозначает установленный вертикально камень или каменный столб, который мог служить знаком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение Qal от לקח; естественная и точная передача действия.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אֶבֶן
  choice: камень
  rationale: Существительное в единственном числе; в русском языке после глагола «взял» неопределённость передаётся без артикля.
- source_word: וַיְרִימֶהָ
  choice: поставил его
  rationale: Форма со значением поднятия или установления и суффиксом, отсылающим к камню; в данном контексте речь об установке камня вертикально.
- source_word: מַצֵּבָה
  choice: как памятный столб
  rationale: Слово обозначает установленный вертикально камень — столб или знак. «Памятный столб» ясно передаёт предмет в данном повествовательном контексте, а примечание сохраняет более буквальные варианты.
theological_decisions:
- issue: Возможные памятные или культовые ассоциации מַצֵּבָה
  choice: памятный столб
  alternative: вертикально поставленный камень; каменный столб
  rationale: Контекст соглашения указывает на функцию знака, однако стих сам по себе не описывает культового действия. Перевод не приписывает камню культового значения.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Союз «И» сохраняет последовательность еврейского повествования; формулировка остаётся понятной широкому читателю.
