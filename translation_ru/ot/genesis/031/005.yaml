  source_fidelity: 'Текст точно передаёт смысл еврейского оригинала: настоящее восприятие Иакова, изменившееся отношение Лавана, временной контраст «как прежде» и противопоставленное ему Божье присутствие. «Относится ко мне не так» — естественная смысловая передача образа лица, обращённого/не обращённого к говорящему, без излишнего толкования.'
