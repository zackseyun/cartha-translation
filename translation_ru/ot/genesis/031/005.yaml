  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: ru
  text: 'И сказал им: «Я вижу, что ваш отец относится ко мне уже не так, как прежде[a], но Бог моего отца был со мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лицо вашего отца не обращено ко мне, как вчера и позавчера»; это еврейское выражение означает «не так, как прежде».'
    reason: Сноска сохраняет конкретный образ оригинала и поясняет временную идиому, которые в основном тексте переданы естественным русским выражением.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: И сказал им
  rationale: Обычная передача повествовательной формы wayyiqtol. Местоимение относится к Рахили и Лии; в русском множественное «им» не выражает рода.
- source_word: רֹאֶה אָנֹכִי
  choice: Я вижу
  rationale: Причастие с самостоятельным местоимением обозначает непосредственное, настоящее восприятие Иакова; простое настоящее естественно передаёт этот смысл.
- source_word: אֶת פְּנֵי אֲבִיכֶן כִּי אֵינֶנּוּ אֵלַי
  choice: что ваш отец относится ко мне уже не так
  rationale: Буквальный образ лица, не обращённого к Иакову, обозначает изменившееся отношение Лавана. В основном тексте смысл передан естественным современным русским выражением, а конкретный еврейский образ сохранён в сноске.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: как прежде
  rationale: Еврейское выражение буквально упоминает вчера и позавчера, но идиоматически означает прежнее время. «Как прежде» ясно и естественно передаёт его смысл.
- source_word: וֵאלֹהֵי אָבִי
  choice: но Бог моего отца
  rationale: Союз передан противительным «но», поскольку поддержка Бога противопоставлена изменившемуся отношению Лавана. Конструкция «Бог моего отца» близко следует еврейскому сочетанию и сохраняет семейно-заветный оттенок.
- source_word: הָיָה עִמָּדִי
  choice: был со мной
  rationale: Русская форма прошедшего времени естественно выражает Божье продолжающееся до настоящего момента содействие; дополнительные слова вроде «всё это время» не требуются контекстом.
theological_decisions:
- issue: Передача אֱלֹהֵי אָבִי
  choice: Бог моего отца
  alternative: Бог, Которому поклоняется мой отец
  rationale: Выбранный вариант сохраняет краткость и конструкцию оригинала, не уточняя сверх текста характер отношений отца Иакова с Богом.
- issue: Смысл формулы הָיָה עִמָּדִי
  choice: был со мной
  alternative: помогал мне
  rationale: Сохранена богословски ёмкая формула Божьего присутствия; её не следует сужать до одной лишь практической помощи.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Реплика остаётся ясной для обычного читателя; еврейские образы и идиоматическая буквальность вынесены в сноску без устранения смыслового контраста.
