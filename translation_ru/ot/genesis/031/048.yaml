  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: ru
  text: 'И сказал Лаван: «Эта груда — свидетель между мной и тобой сегодня». Поэтому он назвал её Гал-Эд[a].'
  philosophy: optimal-equivalence
  footnotes:
