lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательный вав продолжает повествование; традиционная и естественная русская формула сохраняет ход рассказа.
- source_word: לָבָן
  choice: Лаван
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: הַגַּל הַזֶּה
  choice: эта груда
  rationale: גַּל в данном контексте обозначает сложенную груду камней; «груда» точно и понятно передаёт образ без добавления отсутствующего в стихе определения.
- source_word: עֵד
  choice: свидетель
  rationale: Груда выступает свидетельствующим знаком соглашения между сторонами; существительное сохраняет юридико-заветный оттенок оригинала.
- source_word: בֵּינִי וּבֵינְךָ
  choice: между мной и тобой
  rationale: Сохранено прямое указание на обе стороны в единственном числе.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современный и точный эквивалент временного наречия.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Формула вводит следствие и объяснение названия.
- source_word: קָרָא שְׁמוֹ
  choice: он назвал её
  rationale: Естественная русская формула именования передаёт активную форму глагола; местоимение относится к груде, которая в русском языке женского рода.
- source_word: גַּלְעֵד
  choice: Гал-Эд
  rationale: Название транслитерировано с сохранением двух компонентов еврейского сложного имени; его смысл разъяснён в сноске.
