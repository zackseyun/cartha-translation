lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательным имперфектом продвигает повествование; обычное русское «И сказал» естественно передаёт связь с предыдущими событиями.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: שׁוּב
  choice: Возвратись
  rationale: Императив глагола שׁוב означает возвращение; «возвратись» соответствует возвышенному, но современному регистру прямой Божьей речи.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: в землю отцов твоих
  rationale: Формулировка близко передаёт еврейскую конструкцию и сохраняет прямое упоминание отцов, не обобщая его словом «предки».
- source_word: מוֹלַדְתֶּךָ
  choice: к родне своей
  rationale: В данном контексте слово естественно понимать как обозначение родственного круга Иакова; при этом его возможное географическое значение сохранено в сноске.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: и Я буду с тобой
  rationale: Прямо и естественно передаёт обещание Божьего присутствия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер слов וְאֶהְיֶה עִמָּךְ
  choice: 'обещание: «и Я буду с тобой»'
  alternative: побуждение или условное высказывание
  rationale: Форма естественно выражает данное Иакову обещание Божьего присутствия, связанное с повелением вернуться.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «отцов твоих» сохраняет достоинство речи, оставаясь понятным современному читателю; архаические формы не используются.
