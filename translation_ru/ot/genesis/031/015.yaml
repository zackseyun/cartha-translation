  text: Разве он не считает нас чужими? Ведь он продал нас и полностью истратил наши деньги[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и совсем проел наши деньги». Буквально: «и, поедая, съел наше серебро». В еврейском тексте образ «поедания» усилен особой грамматической конструкцией и выражает полное расходование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Разве ... не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; эта конструкция естественно передаёт его по-русски.
- source_word: נָכְרִיּוֹת
  choice: чужими
  rationale: В контексте дочери жалуются, что отец относится к ним как к посторонним, а не членам семьи; «чужими» точно и естественно передаёт эту мысль.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: он ... считает нас
  rationale: Естественная русская перестройка еврейской пассивной конструкции «мы считаемся у него», сохраняющая смысл отношения отца к дочерям.
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание риторического вопроса; «ведь» ясно передаёт пояснительно-причинную связь.
- source_word: מְכָרָנוּ
  choice: он продал нас
  rationale: Прямо передаёт завершённое действие, остающееся основанием нынешней жалобы.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: и совсем проел
  rationale: Сочетание личной формы с абсолютным инфинитивом усиливает значение полного расходования; «совсем проел» сохраняет образ еды и звучит естественно применительно к деньгам.
- source_word: אֶת כַּסְפֵּנוּ
  choice: наши деньги
  rationale: כֶּסֶף означает «серебро» или «деньги»; здесь экономический контекст делает «деньги» наиболее ясным выбором.
