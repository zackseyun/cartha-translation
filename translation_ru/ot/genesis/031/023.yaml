lexical_decisions:
- source_word: אֶחָיו
  choice: своих родственников
  rationale: Слово אָח может обозначать как родных братьев, так и более широкий круг родичей. В данном контексте речь, вероятно, идёт о членах рода Лавана, поэтому «родственников» передаёт смысл без неоправданного сужения.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: гнался за ним
  rationale: Сочетание רדף אחר означает преследование кого-либо. «Гнался за ним» естественно передаёт и глагол, и направительное значение предлога אַחַר.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: семь дней пути
  rationale: דֶּרֶךְ здесь указывает на протяжённость пути, измеряемую днями перехода. Русское выражение «семь дней пути» сохраняет этот образ и звучит естественно.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: настиг его
  rationale: В контексте погони דבק означает догнать, настичь преследуемого, а не буквально «прилепиться» к нему.
- source_word: בְּהַר הַגִּלְעָד
  choice: в горной области Галаада
  rationale: הַר может обозначать отдельную гору, горы или гористую местность. Контекст допускает региональное значение, которое передано выражением «горная область».
