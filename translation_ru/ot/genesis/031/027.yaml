base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: ru
  text: Почему ты скрылся, чтобы убежать, и тайком ушёл от меня[a], ничего мне не сказав? Я отпустил бы тебя с радостью и песнями, под бубен[b] и лиру[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и украл меня»; это еврейское выражение означает тайно уйти от кого-либо, не поставив его в известность.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает ручной ударный инструмент; традиционный перевод — «тимбрел».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «арфу»; еврейское слово обозначает струнный инструмент лирного типа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נַחְבֵּאתָ לִבְרֹחַ
  choice: Почему ты тайно убежал
  rationale: Форма נַחְבֵּאתָ буквально указывает на то, что Иаков скрылся, а לִבְרֹחַ — на бегство. В современном русском сочетание «тайно убежал» естественно передаёт оба смысловых компонента без тяжеловесного «скрылся, чтобы бежать».
- source_word: וַתִּגְנֹב אֹתִי
  choice: ускользнув от меня
  rationale: Буквально выражение означает «и украл меня», но здесь это идиома тайного ухода без ведома другого лица. «Ускользнув от меня» передаёт контекстуальный смысл, тогда как буквальный русский вариант был бы непонятен.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: и ничего мне не сказал
  rationale: Естественная русская передача отрицательной формы глагола נגד в породе хифиль — «сообщить, сказать»; «ничего» уместно выражает отсутствие уведомления.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: Я проводил бы тебя
  rationale: 'В контексте упрёка форма выражает нереализованное следствие: если бы Иаков сообщил о своём уходе, Лаван устроил бы ему проводы. «Проводил бы» естественнее по-русски, чем буквальное «отпустил бы», и соответствует праздничному прощанию.'
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: с радостью и песнями
  rationale: Прямая и естественная передача существительных; שִׁרִים допускает также значение пения.
- source_word: בְּתֹף
  choice: под звуки бубна
  rationale: תֹף обозначает ручной ударный инструмент. «Бубен» — понятный современному читателю традиционный русский эквивалент; конструкция «под звуки» естественно связывает инструменты с проводами.
- source_word: וּבְכִנּוֹר
  choice: и лиры
  rationale: כִּנּוֹר обозначает древний струнный инструмент лирного типа; «лира» точнее традиционного, но менее конкретного слова «гусли» или слова «арфа».
