base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: ru
  text: И Лаван настиг Иакова[a]. Иаков уже разбил свой шатёр в горах[b], а Лаван разбил лагерь со своими родичами[c] в горах Галаада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «догнал Иакова».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на горе». В данном контексте возможно также: «на горе Галаад» или «в горной местности Галаада».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «со своими братьями»; здесь слово может обозначать родичей или членов рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: настиг
  rationale: В контексте погони глагол означает, что Лаван догнал Иакова; «настиг» естественно передаёт это значение, не подразумевая его захвата.
- source_word: תָּקַע אֶת־אָהֳלוֹ
  choice: раскинул свой шатёр
  rationale: Сочетание תקע с אהל — устойчивое обозначение установки шатра. Русское «раскинул шатёр» сохраняет образ и подходит повествовательному стилю.
- source_word: בָּהָר
  choice: в горах
  rationale: הַר может обозначать отдельную гору или горную местность. Контекст допускает региональное значение, естественно выражаемое по-русски как «в горах».
- source_word: תָּקַע אֶת־אֶחָיו
  choice: со своими родичами расположился
  rationale: 'Еврейская конструкция эллиптична: буквально Лаван «поставил/расположил своих братьев», но в контексте речь об устройстве лагеря всей группы. «Расположился со своими родичами» передаёт смысл без добавления прямо не названных шатров.'
- source_word: אֶחָיו
  choice: свои родичи
  rationale: Буквально «его братья», однако אָח может обозначать более широкий круг родственников или членов рода; спутники Лавана здесь, вероятнее всего, не только родные братья.
- source_word: בְּהַר הַגִּלְעָד
  choice: в горах Галаада
  rationale: Конструкция может обозначать гору Галаад либо горную область Галаада. Множественное «в горах Галаада» естественно передаёт вероятное региональное значение.
