source:
  edition: WLC
  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: ru
  text: 'Если он говорил: «Крапчатые будут тебе платой», — то весь мелкий скот приносил крапчатый приплод; а если говорил: «Полосатые будут тебе платой», — то весь мелкий скот приносил полосатый приплод.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: крапчатые
  rationale: Передаёт животных с пятнышками или крапинами и естественно звучит по-русски в данном контексте.
- source_word: עֲקֻדִּים
  choice: полосатые
  rationale: Обозначает животных с полосами или отметинами в виде полос; выбор сохраняет отличие от крапчатых.
- source_word: שְׂכָרֶךָ
  choice: тебе платой
  rationale: Кратко и естественно передаёт «твоей платой/твоим вознаграждением» в прямой речи.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: то весь мелкий скот приносил … приплод
  rationale: Уточнение «приплод» естественно выражает подразумеваемый объект глагола «рождать», а הַצֹּאן передано собирательным термином «мелкий скот».
