  source_fidelity: 'Перевод точно передаёт обе условные ситуации, противопоставление בין נְקֻדִּים («крапчатые») и עֲקֻדִּים («полосатые»), а также результат: всё стадо приносило приплод соответствующей масти. Собирательное «весь мелкий скот» уместно для הַצֹּאן и не сужает референт только до овец.'
