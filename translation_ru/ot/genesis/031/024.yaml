base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: ru
  text: 'Но Бог пришёл к Лавану-арамею ночью во сне и сказал ему: «Берегись, не говори Иакову ни доброго, ни худого».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от доброго до худого» — выражение, означающее всё без исключения, будь то благоприятное или враждебное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычное повествовательное значение בוא сохранено без истолковывающего добавления «явился».
- source_word: לָבָן הָאֲרַמִּי
  choice: Лавану-арамею
  rationale: אֲרַמִּי — этноним «арамей»; это точнее традиционного, но анахроничного «сириец».
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: ночью во сне
  rationale: 'Естественная русская передача обоих компонентов: явление произошло ночью и во сне.'
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Краткая идиоматическая формула предупреждения перед запретом, соответствующая еврейскому императиву.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: не говори Иакову
  rationale: Передаёт предупреждение с פֶּן и естественное русское управление глагола речи в данном контексте.
- source_word: מִטּוֹב עַד רָע
  choice: ни доброго, ни худого
  rationale: Сохраняет полярное выражение исходного текста и в русском языке подразумевает запрет говорить что бы то ни было.
theological_decisions:
- issue: Кто обозначен словом אֱלֹהִים
  choice: Бог
  alternative: боги / некое божество
  rationale: Единственное число глагола и контекст однозначно указывают на Бога как единственного действующего субъекта.
- issue: Объём запрета Лавану
  choice: сохранено выражение «ни доброго, ни худого»
  alternative: не говори Иакову вообще ничего
  rationale: Исходная идиома охватывает весь диапазон возможной речи; буквальная образность сохранена, а значение разъяснено в сноске без устранения напряжения формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Худого» выбрано ради естественной парности «доброго — худого»; этноним передан точно как «арамей».
