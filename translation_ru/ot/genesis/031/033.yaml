base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: ru
  text: И вошёл Лаван в шатёр Иакова, и в шатёр Лии, и в шатёр двух служанок, но не нашёл[a]. Тогда он вышел из шатра Лии и вошёл в шатёр Рахили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте не сказано, чего именно Лаван не нашёл; из контекста ясно, что речь идёт о домашних богах, которых он искал.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: Глагол בוא с предлогом בְּ обозначает движение внутрь; «вошёл» естественно и точно передаёт действие.
- source_word: אֹהֶל
  choice: шатёр
  rationale: Сохранено конкретное обычное значение слова и патриархальный бытовой контекст.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: двух служанок
  rationale: אָמָה обозначает женщину-служанку или рабыню; «служанок» ясно звучит в современном русском и не устраняет её зависимого положения, не выдвигая его здесь на первый план.
- source_word: וְלֹא מָצָא
  choice: но не нашёл
  rationale: В еврейском тексте дополнение не выражено. Русский позволяет сохранить эту контекстуальную недосказанность; противительный союз естественно передаёт безуспешность поисков.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Тогда он вышел из шатра Лии
  rationale: «Вышел из» точно передаёт исходное движение, а «тогда» естественно обозначает последовательность повествования.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: и вошёл в шатёр Рахили
  rationale: Повтор «вошёл» сохраняет последовательное описание обыска шатров.
