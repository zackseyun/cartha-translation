base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: ru
  text: У кого найдёшь своих богов, тот не останется в живых. Перед нашими братьями[a] определи, что из того, что у меня, принадлежит тебе, и возьми это себе». Иаков не знал, что Рахиль украла их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «братья» здесь может обозначать не только родных братьев, но и других присутствующих родственников или членов родственной группы.
    reason: cultural_note
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: У кого найдёшь
  rationale: 'Прямая и естественная по-русски передача неопределённого относительного оборота; сохраняет активную форму второго лица единственного числа: Лаван должен найти богов у кого-либо.'
- source_word: אֱלֹהֶיךָ
  choice: своих богов
  rationale: Сохраняет буквальное множественное «твоих богов», не подменяя его контекстуальным «домашних идолов».
- source_word: לֹא יִחְיֶה
  choice: тот не останется в живых
  rationale: Передаёт суровую формулу смертного приговора или проклятия, не уточняя сверх текста, является ли она юридической, волевой или предсказательной.
- source_word: נֶגֶד אַחֵינוּ
  choice: Перед нашими братьями
  rationale: Формально сохраняет «перед/в присутствии» и исходное «братьями»; возможный более широкий смысл пояснён в сноске.
- source_word: הַכֶּר לְךָ
  choice: опознай
  rationale: Императив здесь призывает осмотреть имущество и установить, что принадлежит Лавану; «опознай» сохраняет лексическую идею узнавания.
- source_word: מָה עִמָּדִי
  choice: что у меня твоё
  rationale: Естественно восполняет подразумеваемую принадлежность вещи Лавану, которую подтверждает последующее «возьми себе».
- source_word: וְקַח לָךְ
  choice: и возьми себе
  rationale: Передаёт оттенок личной заинтересованности дательного לָךְ и звучит естественно по-русски.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Иаков не знал
  rationale: Прямая передача авторского пояснения; начальный союз сохранён как повествовательная связь.
- source_word: גְּנָבָתַם
  choice: украла их
  rationale: Местоимение во множественном числе отсылает к богам; русское прошедшее время в контексте естественно обозначает предшествующее действие.
theological_decisions:
- issue: Характер слов «не останется в живых»
  choice: Сохранена неоднозначная формула смертного приговора или проклятия.
  alternative: «Пусть умрёт» / «должен умереть».
  rationale: Еврейское לֹא יִחְיֶה не требует однозначно истолковывать высказывание как повеление, правовую санкцию либо предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис близок к еврейскому, но естественен для обычного читателя; контекстуальное пояснение о домашних богах не внесено в основной текст, поскольку здесь источник говорит просто «богов».
