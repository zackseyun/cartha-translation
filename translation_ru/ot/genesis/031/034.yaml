    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: домашних идолов
  rationale: Терафимы были домашними культовыми предметами; «домашние идолы» ясно передаёт вероятный смысл, не прибегая в основном тексте к малопонятной транслитерации.
- source_word: בְּכַר הַגָּמָל
  choice: в верблюжье седельное покрывало
  rationale: כַּר обозначает подушку или мягкую часть снаряжения; выражение, вероятно, относится к мягкой детали верблюжьего седла. «Седельное покрывало» сохраняет предметность образа и допускает укрытие вещей внутри его складок.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: и села на них
  rationale: Простое прошедшее время естественно продолжает последовательность действий и сохраняет физический способ сокрытия предметов.
- source_word: וַיְמַשֵּׁשׁ
  choice: ощупал
  rationale: Глагол מששׁ указывает на поиски посредством осязания, а не просто на общий осмотр.
- source_word: כָּל הָאֹהֶל
  choice: весь шатёр
  rationale: Идиоматично передаёт сочетание כָּל с определённым существительным.
- source_word: וְלֹא מָצָא
  choice: но ничего не нашёл
  rationale: В еврейском объект не назван. Русское «ничего» естественно завершает фразу и не устраняет контекстуальную отсылку к спрятанным предметам.
- source_word: וְרָחֵל
  choice: Рахиль же
  rationale: Частица «же» естественно отмечает переход к поясняющему сообщению о Рахили, не добавляя явного временного значения.
