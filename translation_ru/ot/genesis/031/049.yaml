base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: ru
  text: 'И Мицпа[a], потому что он сказал: «Пусть Яхве будет стражем между мной и тобой, когда мы окажемся вне виду друг у друга[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Название «Мицпа» связано с еврейским словом, означающим «сторожевая башня» или «наблюдательный пункт», и перекликается со словами: «Пусть Яхве будет стражем».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда мы будем скрыты друг от друга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: и Мицпа
  rationale: Слово употреблено как название места; транслитерация сохраняет ономастическую функцию, а примечание раскрывает связь с корнем צפה — «наблюдать, смотреть».
- source_word: אֲשֶׁר אָמַר
  choice: потому что он сказал
  rationale: Оборот вводит объяснение названия; добавлять отсутствующее в еврейском тексте «назвал её» не требуется.
- source_word: יִצֶף
  choice: пусть наблюдает
  rationale: Форма выражает пожелание; «наблюдает» естественно передаёт действие צפה и сохраняет словесную связь с названием Мицпа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном, а не замещающий его титул.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: за мной и тобой
  rationale: При русском глаголе «наблюдать» управление с «за» звучит естественно и передаёт идею надзора над обеими сторонами; исходный порядок лиц сохранён.
- source_word: כִּי
  choice: когда
  rationale: Союз обозначает обстоятельство, при котором требуется Божье наблюдение, а не причину.
- source_word: נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: мы скроемся друг от друга
  rationale: Нифаль от סתר передаёт состояние взаимной невидимости или сокрытости; русская взаимная конструкция естественно отражает идиому אִישׁ מֵרֵעֵהוּ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» передаёт тетраграмматон, не заменяя его титулом.
- issue: Характер Божьего наблюдения
  choice: пусть Яхве наблюдает
  alternative: пусть Яхве будет свидетелем
  rationale: Глагол צפה означает «наблюдать, смотреть»; перевод «быть свидетелем» мог бы сузить или истолковать образ, поэтому сохранена исходная формулировка.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Начальное «и» сохранено как связь с предыдущим контекстом. Формулировка не превращает фразу в благословение близких людей: в контексте это призыв к Божьему надзору над разлучёнными сторонами завета.'
