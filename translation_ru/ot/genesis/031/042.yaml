reference: Genesis 31:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: ru
  text: Если бы Бог моего отца — Бог Авраама и Страх Исаака[a] — не был со мной, ты наверняка к этому времени отпустил бы меня ни с чем. Бог увидел мои страдания и тяжкий труд моих рук и прошлой ночью вынес суд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот, Кого боялся Исаак». Буквально по-еврейски: «Страх Исаака» — необычный титул Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: Если бы ... не
  rationale: Передаёт нереальное условие прошлого естественной русской конструкцией с сослагательным наклонением.
- source_word: אֱלֹהֵי אָבִי
  choice: Бог моего отца
  rationale: Прозрачно передаёт конструкцию сопряжённого состояния и связь с отцом Иакова.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: Бог Авраама
  rationale: Прямой и естественный перевод древнееврейской конструкции.
- source_word: וּפַחַד יִצְחָק
  choice: и Страх Исаака[a]
  rationale: Сохраняет необычный божественный титул и его намеренную смысловую напряжённость; поясняющее прочтение вынесено в сноску.
- source_word: הָיָה לִי
  choice: не был со мной
  rationale: В данном контексте идиома выражает присутствие и поддержку Бога.
- source_word: כִּי עַתָּה
  choice: наверняка ... теперь
  rationale: 'Передаёт усиление и временное значение: к настоящему моменту это уже произошло бы.'
- source_word: רֵיקָם
  choice: ни с чем
  rationale: Естественный русский эквивалент ухода без имущества или вознаграждения.
- source_word: שִׁלַּחְתָּנִי
  choice: ты ... отпустил бы меня
  rationale: Сослагательное наклонение требуется нереальным условием; «отпустил» сохраняет основное значение глагола и подходит ситуации ухода.
- source_word: עָנְיִי
  choice: мои страдания
  rationale: Передаёт бедственное положение и притеснение Иакова, не сужая смысл до материальной бедности.
- source_word: יְגִיעַ כַּפַּי
  choice: тяжкий труд моих рук
  rationale: Сохраняет образ рук и выражает изнурительный характер труда.
- source_word: רָאָה אֱלֹהִים
  choice: Бог увидел
  rationale: Прямо передаёт завершённое повествовательное действие.
- source_word: וַיּוֹכַח
  choice: вынес решение
  rationale: Глагол допускает значения судебного решения, разбора спора и обличения. Нейтральная формулировка сохраняет юридическую многозначность и не добавляет отсутствующий в еврейском тексте объект «тебя».
- source_word: אָמֶשׁ
  choice: прошлой ночью
  rationale: Естественно обозначает ночь, непосредственно предшествовавшую речи.
theological_decisions:
- issue: Передача божественного титула וּפַחַד יִצְחָק
  choice: Страх Исаака
  alternative: Тот, Кого страшился Исаак
  rationale: Буквальный необычный титул сохраняет богословскую и литературную фактуру оригинала, тогда как возможное поясняющее понимание отмечено в сноске.
- issue: Значение וַיּוֹכַח в контексте спора Иакова с Лаваном
  choice: вынес решение
  alternative: обличил; рассудил; разрешил спор
  rationale: Оригинал не называет прямого объекта. Выбранный вариант сохраняет судебный оттенок и связь с Божьим вмешательством, не уточняя сверх текста, кого именно Бог обличил или между кем рассудил.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Тире выделяют составное именование Бога и помогают ясно прочитать условную конструкцию. Союз «Но» перед второй частью естественно выражает противопоставление фактического Божьего вмешательства предполагаемому исходу.
