  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: ru
  text: 'Если ты будешь притеснять моих дочерей или возьмёшь других жён помимо моих дочерей, то, хотя с нами никого нет[a], смотри: Бог — свидетель между мной и тобой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «с нами нет человека»; смысл в том, что нет человеческого свидетеля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: станешь притеснять
  rationale: Порода пиэль здесь означает причинять страдания, дурно обращаться в семейных отношениях. «Притеснять» передаёт серьёзность предупреждения, не привнося более узкого смысла.
- source_word: בְּנֹתַי
  choice: моих дочерей
  rationale: Прямое соответствие форме множественного числа с притяжательным суффиксом; повтор сохранён вслед за еврейским текстом.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: возьмёшь других жён помимо моих дочерей
  rationale: Оборот означает взять дополнительных жён наряду с дочерьми Лавана, а не заменить их. Слово «других» делает этот смысл ясным в современном русском.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: хотя рядом с нами никого нет
  rationale: В контексте речь идёт об отсутствии человеческого свидетеля. Уступительное «хотя» естественно связывает эту оговорку с последующим призывом к Богу как свидетелю.
- source_word: רְאֵה
  choice: смотри
  rationale: Сохранена повелительная форма и непосредственность торжественного предостережения.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В формуле заветного свидетельства слово обозначает единого Бога и требует формы единственного числа.
- source_word: עֵד
  choice: свидетель
  rationale: Именная часть сказуемого в торжественной формуле; русское «Бог — свидетель» естественно передаёт конструкцию без добавления глагола.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: между мной и тобой
  rationale: Точно передаёт взаимную ответственность двух сторон перед призванным свидетелем.
theological_decisions:
- issue: Обобщённое значение אִישׁ при отсутствии человеческих свидетелей
  choice: никого нет
  alternative: нет человека
  rationale: Хотя אִישׁ формально означает «мужчина/человек», здесь смысл относится к отсутствию любого человеческого свидетеля. «Никого нет» естественно звучит по-русски и не сужает значение до отсутствия только мужчин; буквальная форма указана в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем речи. Повтор «моих дочерей» сохранён ради смыслового акцента оригинала; двоеточие после «смотри» передаёт переход к формуле призывания Бога в свидетели.
