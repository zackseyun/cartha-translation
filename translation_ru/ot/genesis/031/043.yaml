base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: ru
  text: 'Лаван ответил и сказал Иакову: «Дочери — мои дочери, сыновья — мои сыновья, мелкий скот — мой скот, и всё, что ты видишь, — моё. Но что я могу сегодня сделать для этих моих дочерей или для их детей[a], которых они родили?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их сыновей». Еврейское בְּנֵיהֶן может обозначать как сыновей, так и детей вообще.'
    reason: 'Лексическая неоднозначность: форма мужского множественного числа допускает как узкое, так и обобщающее значение.'
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил и сказал
  rationale: Сохраняет характерную для еврейского повествования пару глаголов, оставаясь понятным в современном литературном русском.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: Дочери — мои дочери
  rationale: Повтор передаёт настойчивое заявление Лавана о родственной принадлежности и его притязании на дочерей.
- source_word: וְהַבָּנִים בָּנַי
  choice: сыновья — мои сыновья
  rationale: Мужская форма בָּנִים здесь передана буквально и сохраняет параллелизм с предыдущей фразой.
- source_word: וְהַצֹּאן צֹאנִי
  choice: мелкий скот — мой скот
  rationale: צֹאן обозначает собирательно овец и коз; «мелкий скот» точнее, чем только «овцы», и сохраняет повтор исходного текста.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: и всё, что ты видишь, — моё
  rationale: Кратко и прямо передаёт усиленное притязание Лавана на всё видимое имущество.
- source_word: מָה אֶעֱשֶׂה הַיּוֹם
  choice: что я могу сегодня сделать
  rationale: Вопрос имеет риторический оттенок практической возможности; «сегодня» естественно передаёт הַיּוֹם без архаизации.
- source_word: לִבְנֹתַי ... אוֹ לִבְנֵיהֶן
  choice: этим моим дочерям или их детям
  rationale: 'Русский дательный падеж сохраняет возможную смысловую открытость לְ: речь может идти о действии по отношению к ним, не уточняя без необходимости, во благо оно или во вред.'
- source_word: אֲשֶׁר יָלָדוּ
  choice: которых они родили
  rationale: Передаёт материнский субъект глагола ילד и естественно связывает придаточное с детьми дочерей.
