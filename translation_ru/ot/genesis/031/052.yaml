  naturalness: «Груда камней» — ясное современное литературное обозначение пограничной каменной насыпи. Конструкция «ни я не перейду..., ни ты не перейдёшь...» естественно выражает взаимное обязательство. «С недобрыми намерениями» передаёт цель действия без излишне современной психологизации «злого умысла».
  terminology: עֵד/וְעֵדָה последовательно переданы словом «свидетель», מַצֵּבָה — «каменный столб». Для גַּל предпочтительна «груда камней».
