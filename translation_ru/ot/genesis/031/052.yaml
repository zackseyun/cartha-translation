base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: ru
  text: 'Эта груда камней — свидетель, и этот каменный столб — свидетель: ни я не перейду через эту груду к тебе, ни ты не перейдёшь через эту груду и этот столб ко мне с недобрыми намерениями.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во зло». Выражение обозначает переход с намерением причинить вред. В еврейском тексте оно стоит в конце второй части; по смыслу взаимного обязательства его также можно понимать как относящееся к обеим сторонам.'
    reason: lexical_and_syntactic_note
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: свидетель
  rationale: Оба выражения в параллельных частях стиха обозначают функцию памятных пограничных знаков; повтор сохранён.
- source_word: גַּל
  choice: каменный холм
  rationale: В контексте речь идёт о сложенном из камней пограничном знаке; уточнение «каменный» делает образ понятным без потери значения.
- source_word: מַצֵּבָה
  choice: каменный столб
  rationale: Слово обозначает поставленный вертикально камень-памятник; такой перевод естественен и отличает его от каменного холма.
- source_word: אִם
  choice: двоеточие и параллельные утвердительные придаточные
  rationale: В формуле договора אִם вводит содержание засвидетельствованного обязательства, а не обычное условие «если».
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: перейду / перейдёшь за
  rationale: Глагол обозначает пересечение установленной этими знаками границы; «перейти за» естественно передаёт пространственный смысл.
- source_word: אֵלֶיךָ / אֵלַי
  choice: к тебе / ко мне
  rationale: Сохранено прямое значение направления; враждебный характер движения выражен отдельно оборотом לְרָעָה.
- source_word: לְרָעָה
  choice: со злым умыслом
  rationale: Оборот обозначает вредоносную или враждебную цель, а не полный запрет пересекать границу.
theological_decisions:
- issue: Распространяется ли לְרָעָה на обе взаимные части обязательства
  choice: Передать общий для обеих сторон смысл вредоносного намерения в конце всей фразы
  alternative: Связать «со злым умыслом» только со второй частью — переходом Лавана
  rationale: В еврейском оборот стоит в конце второй части, но по смыслу договорной формулы естественно характеризует запрещённое пересечение границы обеими сторонами; примечание сохраняет осведомлённость о синтаксической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Повтор «свидетель» сохранён ради параллелизма оригинала; архаичные «груда» и «истукан» не использованы.
