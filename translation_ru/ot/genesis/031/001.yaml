base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: ru
  text: 'Иаков услышал слова сыновей Лавана: «Иаков забрал всё, что принадлежало нашему отцу, и из того, что принадлежало нашему отцу, нажил всё это богатство[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю эту славу». Еврейское слово может означать славу, почёт, великолепие или материальное богатство; здесь речь идёт о видимом благосостоянии Иакова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: И услышал он
  rationale: Форма wayyiqtol продолжает повествовательную последовательность. Союз «и» естественно передаёт связь с предыдущим рассказом, а местоимение «он» указывает на Иакова, названного в контексте.
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: как сыновья Лавана говорили
  rationale: Естественная русская передача услышанной речи; сохраняет значение דִּבְרֵי и функцию לֵאמֹר как введения прямой цитаты, не воспроизводя тяжеловесное «слова... говоривших».
- source_word: לָקַח
  choice: забрал
  rationale: Передаёт обвинительный тон прямой речи, не усиливая глагол до «похитил» или «отнял», чего еврейский текст сам по себе не требует.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: всё, что принадлежало нашему отцу
  rationale: Конструкция с לְ выражает принадлежность; повтор сохранён и во второй части высказывания ради исходного акцента.
- source_word: עָשָׂה
  choice: нажил
  rationale: В сочетании с материальным достатком глагол буквально означает «сделал», но по-русски «нажил» естественно передаёт приобретение состояния и сохраняет подразумеваемую связь с имуществом Лавана.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: всё это богатство
  rationale: כָּבוֹד может обозначать славу, почёт, великолепие или материальное достояние. В контексте стад и имущества «богатство» наиболее ясно выражает предмет обвинения; более буквальная альтернатива отмечена в сноске.
