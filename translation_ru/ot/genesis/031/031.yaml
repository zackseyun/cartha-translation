  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: ru
  text: 'Иаков ответил Лавану: «Я боялся, потому что думал: как бы ты силой не отнял у меня своих дочерей».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потому что я сказал: как бы ты не отнял силой у меня своих дочерей».'
    reason: Сохраняет для читателя буквальную внутреннюю речь אָמַרְתִּי и порядок элементов исходного текста.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: В еврейской повествовательной формуле два глагола вводят ответную реплику; по-русски естественное «ответил» передаёт оба без тяжеловесного «ответил и сказал».
- source_word: כִּי יָרֵאתִי
  choice: Я боялся
  rationale: Первое כִּי имеет причинное значение, которое в русском ясно выражено последующим «потому что»; ירא означает страх.
- source_word: כִּי אָמַרְתִּי
  choice: потому что думал
  rationale: Буквально «потому что сказал»; здесь אָמַרְתִּי обозначает внутреннюю речь Иакова, поэтому «думал» естественно передаёт смысл в современном русском.
- source_word: פֶּן
  choice: как бы ... не
  rationale: Обычная русская конструкция для опасения перед возможным нежелательным исходом.
- source_word: תִּגְזֹל
  choice: силой не отнял
  rationale: Глагол גזל обозначает неправомерное, насильственное отнятие; «силой отнял» сохраняет эту более сильную окраску.
- source_word: אֶת בְּנוֹתֶיךָ מֵעִמִּי
  choice: у меня своих дочерей
  rationale: «Своих» однозначно относится к Лавану как субъекту придаточной части; «у меня» естественно выражает удаление дочерей от Иакова.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный регистр. Громоздкая семитская формула «ответил и сказал» естественно сокращена; сила глагола גזל сохранена в основном тексте.
