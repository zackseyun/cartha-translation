  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: ru
  text: 'Тогда Иаков разгневался и вступил в спор с Лаваном. Иаков ответил Лавану: «В чём моё преступление? В чём мой грех, что ты преследовал меня[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол связан со значением «гореть» и может передавать оттенок горячего, настойчивого преследования; возможный перевод: «ты неотступно преследовал меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: Тогда Иаков разгневался
  rationale: Еврейская идиома выражает вспыхнувший гнев; «разгневался» естественно и точно передаёт начало этого состояния.
- source_word: וַיָּרֶב בְּלָבָן
  choice: и вступил в спор с Лаваном
  rationale: Глагол ריב обозначает спор или противоборство. «Вступил в спор» сохраняет его активный и состязательный оттенок, не усиливая речь до ссоры или обвинения.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Иаков ответил Лавану
  rationale: Парная повествовательная формула «ответил и сказал» в современном русском естественно передаётся одним глаголом «ответил»; смысл обоих еврейских глаголов в контексте сохраняется.
- source_word: מַה פִּשְׁעִי
  choice: В чём моё преступление?
  rationale: פשע обозначает сознательное нарушение или проступок и здесь имеет нравственно-правовой оттенок; «преступление» сохраняет силу самооправдательного вопроса Иакова.
- source_word: מַה חַטָּאתִי
  choice: В чём мой грех?
  rationale: חטאת прямо обозначает грех или вину. Перевод «грех» сохраняет параллелизм с «преступлением», не сводя оба разных слова к одному понятию.
- source_word: כִּי
  choice: что
  rationale: В данном вопросе כִּי связывает предполагаемую вину Иакова с преследованием Лавана; русская конструкция «что ты…» естественно передаёт эту связь, не решая жёстко, является ли она причинной или следственной.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: ты гнался за мной[a]
  rationale: דלק после кого-либо означает горячо или настойчиво преследовать. «Гнался за мной» естественно передаёт образ погони, а возможная интенсивность отмечена в сноске без добавления явного наречия в основной текст.
