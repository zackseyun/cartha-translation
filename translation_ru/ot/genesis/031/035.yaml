    issue: Добавление «всё» в «Он обыскал всё».
    rationale: Оригинал сообщает, что Лаван искал, но не уточняет, что именно он обыскал целиком. Добавление не меняет основной смысл, но излишне усиливает и конкретизирует действие.
  - severity: low
    issue: 'Неудачная форма термина в примечании: «Евр. „терафимов“».'
    rationale: 'В изолированном примечании корректнее назвать термин в словарной форме: «терафимы»; это также яснее соотносится с русским множественным числом «идолы».'
