base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: ru
  text: 'Она сказала отцу: «Пусть господин мой не гневается на меня за то, что я не могу встать перед тобой, ведь у меня то, что бывает у женщин». Он искал, но домашних идолов[a] не нашёл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «терафимы» — домашние культовые изображения или идолы.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Пусть господин мой не гневается на меня
  rationale: Идиома выражает просьбу не гневаться и не считать поступок предосудительным. Русское «на меня» естественно передаёт подразумеваемую направленность гнева; «господин мой» сохраняет почтительное обращение дочери к отцу и не является божественным титулом.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: я не могу встать перед тобой
  rationale: Сохраняются физический смысл קום и оттенок почтительности в выражении «перед тобой».
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: у меня то, что бывает у женщин
  rationale: Естественная русская эвфемистическая передача менструации, сохраняющая сдержанность и непрямой характер еврейского выражения.
- source_word: וַיְחַפֵּשׂ
  choice: Он обыскал всё
  rationale: Глагол означает тщательный поиск. Добавленное «всё» естественно по-русски обозначает полный обыск окружающего места, не уточняя сверх текста конкретный объект.
- source_word: הַתְּרָפִים
  choice: домашних идолов
  rationale: Терафимы были домашними культовыми предметами или изображениями; перевод сообщает современному читателю их бытовой и религиозный характер, а еврейский термин сохранён в примечании.
theological_decisions:
- issue: Передача תְּרָפִים
  choice: домашних идолов
  alternative: терафимов; домашних богов
  rationale: «Домашние идолы» понятно передаёт культовую функцию предметов, не предполагая действительной божественности и не внося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Почтительное «господин мой» и эвфемизм о менструации сохраняют социальный и стилистический регистр оригинала; синтаксис сделан естественным для обычного современного читателя.
