  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: ru
  text: Задранного зверем животного я тебе не приносил — я сам возмещал убыток.[a] Ты взыскивал с меня и за украденное днём, и за украденное ночью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я сам отвечал за него»; возможно также: «я сам возмещал его стоимость».'
    reason: Еврейский глагол חטא в этой форме здесь означает не «грешить», а нести ответственность за потерю или возмещать её.
lexical_decisions:
- source_word: טְרֵפָה
  choice: задранного зверем животного
  rationale: В пастушеском контексте существительное обозначает домашнее животное, растерзанное хищником. Перевод явно называет подразумеваемое животное и сохраняет конкретный образ.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: я тебе не приносил
  rationale: Глагол בוא с אֶל означает принести кому-либо; объект восстанавливается из предшествующего טְרֵפָה.
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: я сам возмещал убыток
  rationale: Отдельное местоимение אָנֹכִי подчёркивает личную ответственность Иакова, а Piel חטא здесь выражает принятие убытка на себя или его возмещение, а не нравственный проступок.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: ты взыскивал с меня
  rationale: Оборот буквально говорит о требовании «из моей руки» и означает привлечение к личной имущественной ответственности; русский глагол «взыскивал» естественно передаёт этот смысл.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: и за украденное днём, и за украденное ночью
  rationale: Сохраняется добавочное ו («и») и параллелизм двух временных обстоятельств. Формулировка показывает, что Лаван взыскивал с Иакова за пропавший скот независимо от времени кражи.
