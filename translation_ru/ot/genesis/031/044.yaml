base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: ru
  text: Итак, давай заключим завет[a], я и ты, и пусть он будет свидетелем между мной и тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассечём завет». Это еврейский устойчивый оборот со значением «заключим завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к следующему предложению в разговоре; по-русски естественнее, чем буквальное «и теперь».
- source_word: לְכָה
  choice: давай
  rationale: Императив от הלך здесь служит приглашением к совместному действию; «давай» естественно сочетается с последующей формой первого лица множественного числа.
- source_word: נִכְרְתָה בְרִית
  choice: заключим завет
  rationale: Стандартный еврейский оборот буквально означает «разрежем завет», но в современном русском соответствующий устойчивый оборот — «заключить завет».
- source_word: אֲנִי וָאָתָּה
  choice: я и ты
  rationale: Сохраняет явное называние обеих сторон и порядок слов еврейского текста.
- source_word: וְהָיָה לְעֵד
  choice: и пусть он будет свидетелем
  rationale: В контексте приглашения форма естественно передаётся пожеланием или волеизъявлением; местоимение «он» грамматически отсылает к завету.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: между мной и тобой
  rationale: Сохраняет явное личное обозначение обеих сторон и порядок еврейского выражения.
theological_decisions:
- issue: К чему относится подразумеваемое подлежащее в וְהָיָה לְעֵד
  choice: 'К завету: «пусть он будет свидетелем»'
  alternative: К памятному знаку или объекту, который будет установлен далее в повествовании
  rationale: Ближайшее грамматически выраженное существительное — בְרִית («завет»), мужского рода, что поддерживает такую связь. Однако дальнейший контекст вводит камень и холм как свидетелей; поэтому примечание отмечает возможную контекстуальную широту образа.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Давай заключим» передаёт приглашение к совместному действию без архаизации; «завет» сохраняет формальный и библейский вес בְרִית.
