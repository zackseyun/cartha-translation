base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: ru
  text: 'И вот однажды, во время случки у мелкого скота, я поднял глаза и увидел во сне: козлы, покрывавшие стадо, были полосатыми[a], крапчатыми и пёстрыми[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с опоясывающими полосами». Еврейское слово обозначает полосы или похожие на пояса отметины на животных.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с мраморной окраской». Вероятно, три еврейских слова обозначают разные виды окраски шерсти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Сохраняет повествовательную формулу еврейского текста, оставаясь понятной в современном литературном русском.
- source_word: בְּעֵת יַחֵם הַצֹּאן
  choice: когда мелкий скот спаривался
  rationale: צֹאן обозначает мелкий скот, а יחם в данном контексте относится к периоду случки; формулировка естественна и не приписывает глаголу результат зачатия.
- source_word: וָאֶשָּׂא עֵינַי
  choice: я поднял глаза
  rationale: Передаёт распространённый еврейский оборот почти буквально и естественно по-русски.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: увидел во сне
  rationale: Точно передаёт сон как среду видения, не добавляя определённости.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет внезапность и наглядность представления, выраженные הִנֵּה.
- source_word: הָעַתֻּדִים
  choice: козлы
  rationale: Слово обозначает взрослых самцов коз, в данном случае участвующих в случке.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: покрывавшие самок в стаде
  rationale: В племенном контексте עלה על описывает, как самец покрывает самку. Уточнение «самок в стаде» естественно выражает подразумеваемый объект, не меняя смысла.
- source_word: עֲקֻדִּים
  choice: полосатыми
  rationale: Передаёт полосы или опоясывающие отметины на шерсти понятным современным словом.
- source_word: נְקֻדִּים
  choice: крапчатыми
  rationale: Обозначает животных с мелкими пятнами или крапинами и сохраняет отличие от двух соседних типов окраски.
- source_word: וּבְרֻדִּים
  choice: пёстрыми
  rationale: Передаёт неоднородную, смешанную окраску, отличную от полос и крапин; точный характер отметин остаётся не вполне определённым.
