lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: не дал мне
  rationale: Хотя נטשׁ обычно означает «оставлять, покидать», в сочетании с инфинитивом לְנַשֵּׁק здесь передаёт смысл лишения возможности совершить действие. «Не дал мне» естественно выражает жалобу Лавана.
- source_word: לְנַשֵּׁק
  choice: поцеловать
  rationale: Инфинитив прямо означает «целовать, поцеловать». Прощальный характер поцелуя понятен из контекста, поэтому слово «на прощание» в основной текст не добавлено.
- source_word: לְבָנַי וְלִבְנֹתַי
  choice: моих сыновей и дочерей
  rationale: Еврейский текст отдельно называет сыновей и дочерей; перевод сохраняет обе категории, не заменяя их обобщением «детей».
- source_word: עַתָּה
  choice: опущено как отдельное слово
  rationale: Здесь עַתָּה служит переходом к оценке уже совершённого поступка. В современном русском отдельное «теперь» звучало бы менее естественно; завершённость передана глаголом совершенного вида «поступил».
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: Ты поступил глупо
  rationale: Сочетание означает «поступить глупо». Эта формулировка естественна для современного литературного русского языка и близко передаёт смысл оригинала.
