base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: ru
  text: На третий день Лавану сообщили, что Иаков бежал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: сообщили
  rationale: Хофаль от נגד передаёт пассивное сообщение информации. Русская неопределённо-личная конструкция «Лавану сообщили» естественно выражает неназванного сообщающего и не добавляет субъекта.
- source_word: לְלָבָן
  choice: Лавану
  rationale: Предлог לְ обозначает получателя сообщения; в русском это естественно передаётся дательным падежом.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Точное и естественное соответствие временной фразе; слово «после» в еврейском тексте прямо не выражено.
- source_word: כִּי
  choice: что
  rationale: Здесь союз вводит содержание сообщения, а не причину.
- source_word: בָרַח
  choice: бежал
  rationale: Глагол ברח означает «бежать, спасаться бегством». Русское прошедшее время в придаточном изъяснительном естественно обозначает действие, предшествовавшее сообщению, без необходимости добавлять аналитическую форму.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
