lexical_decisions:
- source_word: הָלַךְ
  choice: ушёл
  rationale: 'Форма сообщает фоновое обстоятельство: Лаван покинул дом и отсутствовал во время поступка Рахили. Совершенный вид естественно передаёт это в русском повествовании без обязательного плюсквамперфекта.'
- source_word: לִגְזֹז
  choice: стричь
  rationale: Инфинитив обозначает стрижку животных стада; «стричь» — точный и естественный русский эквивалент.
- source_word: צֹאנוֹ
  choice: своё стадо
  rationale: צֹאן обозначает мелкий домашний скот, прежде всего овец и коз. «Стадо» звучит естественно и не сужает значение только до овец.
- source_word: וַתִּגְנֹב
  choice: украла
  rationale: Глагол прямо означает кражу; перевод сохраняет нравственно-правовую силу исходного слова и не смягчает поступок.
- source_word: הַתְּרָפִים
  choice: домашних идолов
  rationale: Термин обозначает домашние культовые изображения. Этот вариант понятен современному читателю и передаёт как бытовой контекст, так и религиозную функцию предметов; транслитерация сохранена в сноске.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: принадлежавших её отцу
  rationale: Оборот выражает принадлежность; выбранный вариант естественно и однозначно передаёт это отношение.
- source_word: וְ / וַ
  choice: союзная связь без начального «и»; «а» перед действием Рахили
  rationale: Начальный союз в русском повествовании не требует отдельной передачи, а «а» естественно связывает фоновое отсутствие Лавана с главным последующим действием Рахили, не добавляя временного наречия.
theological_decisions:
- issue: Передача תְּרָפִים как домашних культовых предметов
  choice: домашних идолов
  alternative: терафимов; домашних богов
  rationale: «Домашние идолы» ясно передаёт культовый характер предметов, не утверждая реальность названных ими божеств. Более формальная транслитерация приведена в сноске, чтобы сохранить доступ к специфическому еврейскому термину.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и ясное. «Своё стадо» идиоматичнее буквального «свой мелкий скот», а «принадлежавших её отцу» сохраняет явное указание на собственность.
