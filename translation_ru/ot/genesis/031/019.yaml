  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: ru
  text: Лаван ушёл стричь своё стадо, а Рахиль украла домашних идолов[a], принадлежавших её отцу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. терафимы; также переводится: «домашние боги».'
