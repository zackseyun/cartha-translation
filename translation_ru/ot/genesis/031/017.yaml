  text: Тогда Иаков поднялся и посадил своих сыновей и жён на верблюдов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: поднялся
  rationale: Форма от קום продолжает повествовательную последовательность и обозначает, что Иаков встал, чтобы действовать. «Поднялся» сохраняет этот оттенок и звучит естественно в современном русском повествовании.
- source_word: וַיִּשָּׂא
  choice: посадил
  rationale: Глагол נשׂא буквально связан с поднятием или несением, но в сочетании с людьми и верблюдами здесь естественно означает, что Иаков поместил их на верблюдов для поездки. Русское «посадил» точно и идиоматично передаёт действие.
- source_word: בָּנָיו
  choice: своих сыновей
  rationale: Мужской род множественного числа בנים прямо обозначает сыновей; возвратное «своих» естественно указывает на принадлежность подлежащему Иакову.
- source_word: נָשָׁיו
  choice: жён
  rationale: Множественное число от אִשָּׁה с притяжательным суффиксом в данном контексте однозначно обозначает жён Иакова. При общем определении «своих» повтор притяжательного слова в русском не требуется.
- source_word: עַל הַגְּמַלִּים
  choice: на верблюдов
  rationale: Предлог עַל после глагола движения допускает направительное значение. Русская конструкция «посадил ... на верблюдов» естественно выражает перемещение и не нуждается в отдельном варианте перевода.
