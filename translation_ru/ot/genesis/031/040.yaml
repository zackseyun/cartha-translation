  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: ru
  text: 'Вот как было у меня: днём меня изнурял зной, ночью — мороз, и сон бежал от моих глаз.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: передано построением всего предложения
  rationale: 'Глагол «я был» вводит описание состояния Иакова. В современном русском его значение естественно выражается всей конструкцией без буквального и тяжеловесного «я был: днём…».'
- source_word: בַיּוֹם
  choice: днём
  rationale: Кратко и естественно обозначает время и сохраняет параллель с «ночью».
- source_word: אֲכָלַנִי
  choice: меня изнурял
  rationale: Буквально «пожирал меня»; в данном контексте это образ губительного воздействия суровых условий. «Изнурял» естественно передаёт смысл, хотя несколько ослабляет буквальную метафору.
- source_word: חֹרֶב
  choice: зной
  rationale: В противопоставлении ночному морозу слово обозначает иссушающий дневной жар. «Зной» точно и выразительно передаёт это значение.
- source_word: וְקֶרַח
  choice: а … мороз
  rationale: Существительное обозначает лёд или мороз. Здесь речь о ночном холоде; «мороз» наиболее естественен, а союз «а» ясно передаёт противопоставление.
- source_word: בַּלָּיְלָה
  choice: ночью
  rationale: Естественная русская временная форма, параллельная слову «днём».
- source_word: וַתִּדַּד
  choice: бежал
  rationale: Редкий глагол выражает удаление или бегство. «Сон бежал» сохраняет олицетворение и образность еврейского текста.
- source_word: שְׁנָתִי
  choice: сон
  rationale: Обозначает состояние сна; русское «сон» прямо и естественно передаёт смысл.
- source_word: מֵעֵינָי
  choice: от моих глаз
  rationale: Сохранён еврейский образ бессонницы; выражение понятно современному русскому читателю.
