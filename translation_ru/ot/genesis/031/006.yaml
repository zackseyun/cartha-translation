  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: ru
  text: Вы и сами знаете, что я служил вашему отцу изо всех сил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «работал на вашего отца». Еврейский глагол может означать как «служить», так и «работать»; оба значения соответствуют годам труда Иакова у Лавана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: Вы и сами
  rationale: Самостоятельное местоимение второго лица женского рода множественного числа подчёркивает обращение Иакова к Рахили и Лии. Русское «вы и сами» естественно передаёт это усиление; союз וְ здесь не требует отдельного «и» в начале фразы.
- source_word: יְדַעְתֶּן
  choice: знаете
  rationale: Форма qal perfect обозначает приобретённое знание как наличное состояние; в современном русском уместно настоящее время.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что известно Рахили и Лии.
- source_word: בְּכָל־כֹּחִי
  choice: изо всех сил
  rationale: Устойчивое современное русское выражение точно передаёт полную меру усилий, обозначенную словами «всей моей силой».
- source_word: עָבַדְתִּי
  choice: служил
  rationale: Глагол עבד может означать как служение человеку, так и работу на него. «Служил» сохраняет более широкий реляционный смысл и подходит к управлению названием лица.
- source_word: אֶת־אֲבִיכֶן
  choice: вашему отцу
  rationale: При русском глаголе «служить» лицо ставится в дательном падеже; форма множественного числа «вашему» соответствует обращению к обеим дочерям Лавана.
