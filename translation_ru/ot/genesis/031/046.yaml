  source_fidelity: 'Перевод точно передаёт последовательность еврейского текста: Иаков обращается к своим «братьям», велит собрать камни; они берут/набирают камни, устраивают каменную груду и едят там у неё. «Набрали камней» — естественная контекстуальная передача וַיִּקְחוּ אֲבָנִים, не меняющая смысла. «Возле этой груды» отражает вероятное пространственное значение עַל в данном контексте; более буквальное «на этой груде» сохранено в сноске.'
