  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: ru
  text: 'Тогда Иаков сказал своим братьям[a]: «Соберите камни». Они набрали камней, сложили их в груду и ели там, возле этой груды[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «братья» здесь может обозначать не только родных братьев Иакова, но и его родственников или спутников-мужчин.
    reason: cultural_note
  - marker: b
    text: 'Или: «на этой груде». Еврейский предлог буквально может означать «на».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: своим братьям
  rationale: אָח прежде всего означает «брат», но может обозначать также родственника или близкого спутника. Основное, близкое к форме источника значение сохранено, а более широкий смысл отмечен в сноске.
- source_word: לִקְטוּ אֲבָנִים
  choice: Соберите камни
  rationale: Глагол לקט выражает собирание отдельных предметов; «соберите» естественно передаёт повеление, а אֲבָנִים имеет обычное значение «камни».
- source_word: וַיִּקְחוּ אֲבָנִים
  choice: Они набрали камней
  rationale: Буквально — «они взяли камни». В данном контексте «набрали камней» естественно описывает исполнение приказа собрать камни и избегает тяжеловесного повтора.
- source_word: וַיַּעֲשׂוּ גָל
  choice: сложили их в груду
  rationale: גַּל обозначает груду или насыпь, здесь — из камней. Выражение «сложили их в груду» ясно и естественно передаёт действие.
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  choice: ели там, возле этой груды
  rationale: Предлог עַל обычно означает «на», но по контексту может иметь пространственное значение «у, возле». Основной текст передаёт вероятную сцену естественно по-русски, а более буквальное прочтение сохранено в сноске.
