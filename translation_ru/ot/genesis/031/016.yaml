revisions:
- from: Ведь всё богатство, которое Бог отнял[a] у нашего отца, принадлежит нам и нашим детям. Поэтому теперь делай всё, что сказал тебе Бог.
  to: Ведь всё богатство, которое Бог забрал у нашего отца, принадлежит нам и нашим детям. Поэтому теперь делай всё, что сказал тебе Бог.
  rationale: Основной текст осторожно изменён с «отнял» на «забрал», чтобы не вносить в речь сестёр дополнительное представление о неправомерном изъятии. Смысл — Бог лишил их отца этого богатства, которое принадлежит семье Иакова, — сохранён. Примечание оставлено с тем же содержанием и привязкой [a], с небольшой стилистической правкой перечисления альтернатив.
  reviewer_model: gpt-5.6-terra
