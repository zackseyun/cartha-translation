    rationale: Русское «отнять» обычно предполагает лишение вопреки праву или насильственный захват. В еврейском הִצִּיל здесь возможен смысл изъятия/вызволения, однако текст не требует вносить такую оценку в основной перевод. «Забрал у» остаётся точным и нейтральным.
  revised_text: Ведь всё богатство, которое Бог забрал у нашего отца, принадлежит нам и нашим детям. Поэтому теперь делай всё, что сказал тебе Бог.
