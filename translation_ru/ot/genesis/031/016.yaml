  verdict: revise
  source_fidelity: «Отнял» возможно как контекстуальная передача הִצִּיל, но в современном русском обычно сильнее подразумевает неправомерное лишение, чего сам глагол в данном контексте не утверждает. Более нейтральное «забрал у» передаёт изъятие из владения Лавана, сохраняя повествовательную перспективу сестёр и не добавляя оценочного оттенка.
  naturalness: Текст в целом естественен и соответствует современному литературному регистру. Замена «отнял у» на «забрал у» делает первую фразу нейтральнее без потери ясности. «Поэтому теперь» и «делай всё» допустимы и хорошо передают переход к побуждению.
  terminology: «Бог», «богатство», «наш отец», «нам и нашим детям» переданы верно. Примечание сохраняет важную лексическую альтернативу для נצל; формулировка уточнена, чтобы альтернативы не выглядели как неестественные русские эквиваленты при прямом объекте «богатство».
