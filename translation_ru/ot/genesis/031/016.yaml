  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: ru
  text: Ведь всё богатство, которое Бог забрал у нашего отца, принадлежит нам и нашим детям. Поэтому теперь делай всё, что сказал тебе Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование согласия Рахили и Лии с Иаковом; «ведь» естественно передаёт пояснительную функцию в русской прямой речи.
- source_word: כָל הָעֹשֶׁר
  choice: всё богатство
  rationale: עֹשֶׁר означает богатство или материальное достояние; выражение охватывает скот и прочее имущество в контексте повествования.
- source_word: הִצִּיל
  choice: отнял
  rationale: Порода hifil глагола נצל часто означает избавление или спасение, но при объекте «богатство» здесь указывает на изъятие его у Лавана и передачу дому Иакова. «Отнял» кратко передаёт это перемещение, а примечание сохраняет обычный оттенок избавления.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Стандартная передача אֱלֹהִים, обозначающего Бога в данном повествовании.
- source_word: מֵאָבִינוּ
  choice: у нашего отца
  rationale: Предлог מן указывает на источник изъятия; по-русски при глаголе «отнял» естественно управление «у».
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: принадлежит нам и нашим детям
  rationale: Дательный оборот с местоименной связкой выражает принадлежность или законную долю; явное «принадлежит» делает смысл понятным без его расширения.
- source_word: וְעַתָּה
  choice: Поэтому теперь
  rationale: Выражение обозначает переход от приведённого основания к практическому выводу; «поэтому теперь» передаёт как следствие, так и временной переход.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: всё, что сказал тебе Бог
  rationale: Сохраняет полноту כֹּל אֲשֶׁר и естественный для русского порядок слов.
- source_word: עֲשֵׂה
  choice: делай
  rationale: Краткий императив соответствует еврейскому тексту; несовершенный вид естественно охватывает исполнение всего сказанного Богом.
theological_decisions:
- issue: Действие Бога по отношению к богатству Лавана
  choice: «Бог отнял»
  alternative: «Бог избавил / вырвал»
  rationale: Контекст говорит о богатстве, прежде находившемся у Лавана, которое теперь признаётся принадлежащим семье Иакова. Основной текст передаёт контекстуальное изъятие, не характеризуя его как неправомерное, а примечание сохраняет присущий глаголу оттенок избавления и не устраняет лексическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной интонацией. Реплика сестёр звучит естественно и сохраняет логический переход от обоснования к призыву.
