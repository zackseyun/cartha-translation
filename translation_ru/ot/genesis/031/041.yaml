  text: זֶה לִּ֞/י עֶשְׂרִ֣ים שָׁנָה֮ בְּ/בֵיתֶ/ךָ֒ עֲבַדְתִּ֜י/ךָ אַרְבַּֽע עֶשְׂרֵ֤ה שָׁנָה֙ בִּ/שְׁתֵּ֣י בְנֹתֶ֔י/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים בְּ/צֹאנֶ֑/ךָ וַ/תַּחֲלֵ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֥רֶת מֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: ru
  text: Вот уже двадцать лет я у тебя в доме. Четырнадцать лет я служил тебе за двух твоих дочерей и шесть лет — за твой скот, а ты десять раз менял мою плату.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: Вот уже двадцать лет
  rationale: Естественно передаёт указательно-временную идиому, включая длительность и личную отнесённость לִּי, без тяжеловесного буквального «это мне двадцать лет».
- source_word: בְּבֵיתֶךָ
  choice: у тебя в доме
  rationale: Сохраняет конкретное значение «дом» и одновременно по-русски естественно выражает пребывание у Лавана.
- source_word: עֲבַדְתִּיךָ
  choice: я служил тебе
  rationale: Передаёт как труд, так и личное служение, обозначаемое עבד; «работал на тебя» возможно, но несколько сужает оттенок.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: четырнадцать лет я служил тебе за двух твоих дочерей
  rationale: Предлог בְּ обозначает здесь то, ради чего или в обмен на что совершалось брачное служение; краткое «за» естественно в данном контексте.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: и шесть лет — за твой скот
  rationale: צֹאן — собирательное обозначение мелкого домашнего скота, прежде всего овец и коз; «скот» не ограничивает значение только овцами.
- source_word: וַתַּחֲלֵף
  choice: а ты менял
  rationale: חלף в породе хифиль означает менять или заменять. Несовершенный вид по-русски естественно выражает повторяемость, уточнённую словами «десять раз»; союз «а» передаёт контраст жалобы.
- source_word: מַשְׂכֻּרְתִּי
  choice: мою плату
  rationale: В трудовом контексте означает вознаграждение за работу; «плата» естественна и не предполагает современную фиксированную зарплату.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: десять раз
  rationale: Это идиоматическое обозначение многократного изменения; буквальное «десять счётов» по-русски было бы неясно.
