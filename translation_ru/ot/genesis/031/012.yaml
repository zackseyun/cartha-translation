base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: ru
  text: 'И он сказал: «Подними, пожалуйста, глаза и посмотри: все козлы, которые покрывают самок в стаде[a], — полосатые[b], крапчатые и пёстрые, потому что я увидел всё, что Лаван делает с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословно: «восходящие на стадо». Это еврейский оборот, обозначающий покрытие животных.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционные варианты: «кольчато-полосатые» или «с перевязями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Подними, пожалуйста, глаза
  rationale: Сохраняет образ еврейской идиомы «поднять глаза» и передаёт вежливую частицу נָא естественным русским «пожалуйста».
- source_word: וּרְאֵה
  choice: и посмотри
  rationale: Прямо передаёт повелительную форму ראה и естественно продолжает зрительный образ.
- source_word: הָעַתֻּדִים
  choice: козлы
  rationale: עתודים здесь обозначает взрослых самцов коз; «козлы» — точное и общепонятное русское соответствие.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: спаривающиеся с самками в стаде
  rationale: В контексте разведения животных עלה על является эвфемистическим обозначением покрытия. Добавление «с самками» делает выражение естественным по-русски, не меняя подразумеваемого смысла.
- source_word: עֲקֻדִּים
  choice: полосатые
  rationale: Передаёт животных с полосами или перевязями; это яснее для современного читателя, чем традиционное редкое «кольчатые».
- source_word: נְקֻדִּים
  choice: крапчатые
  rationale: Обозначает мелкие пятна или крапины и позволяет отличить этот рисунок от следующего вида пёстрой окраски.
- source_word: וּבְרֻדִּים
  choice: пёстрые
  rationale: Передаёт неоднородную, пятнистую окраску и сохраняет различие с «крапчатыми» настолько, насколько это возможно по-русски.
- source_word: כִּי רָאִיתִי
  choice: потому что я увидел
  rationale: Передаёт причинное значение כִּי и перфектную форму רָאִיתִי; «увидел» здесь означает, что говорящий заметил и принял во внимание происходящее.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: всё, что Лаван делает с тобой
  rationale: Причастие עֹשֶׂה указывает на продолжающееся действие, а לָּךְ в данном контексте обозначает человека, на которого направлено обращение Лавана.
theological_decisions:
- issue: Прописная или строчная буква в местоимении первого лица божественного говорящего
  choice: я
  alternative: Я
  rationale: В еврейском тексте нет графического различия, соответствующего русскому благоговейному написанию с прописной буквы. Строчная буква сохраняет нейтральность исходного текста и не добавляет конфессионального оформления.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной повествовательной интонацией. Синтаксис прямой речи и трёхчастное описание окраски приближены к еврейскому тексту; узкоспециальная и архаическая животноводческая лексика вынесена в примечания.
