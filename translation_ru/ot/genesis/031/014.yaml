  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: ru
  text: 'Тогда Рахиль и Лия ответили ему: «Остались ли у нас ещё доля[a] и наследство в доме нашего отца[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «часть».'
    reason: lexical_alternative
  - marker: b
    text: «Дом нашего отца» может означать не только жилище или семью, но и отцовское хозяйство и родовое имущество.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַרְנָה
  choice: ответили ему
  rationale: Сочетание двух речевых глаголов буквально допускает «ответили и сказали ему», однако в современном русском это тяжеловесно; «ответили ему» естественно передаёт ответную реплику и сохраняет адресата לוֹ.
- source_word: רָחֵל וְלֵאָה
  choice: Рахиль и Лия
  rationale: Использованы традиционные русские формы библейских имён.
- source_word: הַעוֹד לָנוּ
  choice: разве у нас ещё остались
  rationale: Вопрос подразумевает отрицательный ответ; «разве» естественно передаёт риторический оттенок, а «ещё» сохраняет временное значение עוֹד. Множественное «остались» согласовано с двумя однородными существительными.
- source_word: חֵלֶק
  choice: доля
  rationale: В контексте семейного имущества слово обозначает причитающуюся часть собственности; «доля» точно и естественно передаёт этот смысл.
- source_word: וְנַחֲלָה
  choice: и наследство
  rationale: נַחֲלָה обозначает наследственное владение или наследие; «наследство» наиболее ясно соответствует имущественному контексту.
- source_word: בְּבֵית אָבִינוּ
  choice: в доме нашего отца
  rationale: Формально близкий и естественный перевод; «дом» здесь может обозначать не только жилище, но также семью, хозяйство и родовое имущество.
