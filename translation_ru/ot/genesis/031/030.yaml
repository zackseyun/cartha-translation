lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт и соединительную силу ו, и переход к следующему пункту обвинения Лавана.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: раз уж ты всё-таки ушёл
  rationale: Инфинитив абсолютный с личной формой усиливает глагольное значение; «всё-таки ушёл» естественно передаёт подчёркнутый и уже совершившийся уход, а «раз уж» связывает уступку с названной далее причиной.
- source_word: כִּי
  choice: потому что
  rationale: Вводит признаваемую Лаваном причину ухода Иакова.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: так сильно тосковал
  rationale: Инфинитив абсолютный с личной формой выражает интенсивность; «так сильно тосковал» сохраняет эмоциональную силу корня כסף и звучит естественно по-русски.
- source_word: לְבֵית אָבִיךָ
  choice: по дому своего отца
  rationale: Сохраняет буквальный образ «дома отца» и естественно сочетается с русским глаголом «тосковать».
- source_word: לָמָּה
  choice: зачем
  rationale: В данном обвинительном вопросе спрашивается о мотиве совершённого действия; «зачем» звучит естественно и не меняет сути вопроса.
- source_word: גָנַבְתָּ
  choice: ты украл
  rationale: Прошедшее время прямо передаёт обвинение в уже совершённом действии.
- source_word: אֶת אֱלֹהָי
  choice: моих богов
  rationale: Буквально сохраняет форму еврейского текста с суффиксом первого лица; контекстуальное указание на домашних идолов вынесено в сноску.
theological_decisions:
- issue: Передача אֱלֹהָי в речи Лавана
  choice: моих богов
  alternative: моих домашних богов; моих домашних идолов
  rationale: В самом стихе сказано просто «моих богов». Контекст указывает на домашних божеств Лавана, однако добавлять это уточнение в основной текст означало бы сделать явным то, что выражено лишь контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Две еврейские усилительные конструкции переданы естественными русскими средствами — «всё-таки» и «так сильно» — без тяжеловесного буквального повтора.
