base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: ru
  text: Я — Бог Вефиля[a], где ты помазал столб и где дал Мне обет. Теперь встань, уйди из этой земли и возвратись в землю, где ты родился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вефиль» означает «дом Бога»; здесь это название места.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: Бог Вефиля
  rationale: Определённая форма указывает на Бога, явившегося Иакову в Вефиле; Вефиль передан как традиционное русское название места.
- source_word: מָשַׁחְתָּ ... מַצֵּבָה
  choice: ты помазал каменный столб
  rationale: «Помазал» сохраняет конкретное обрядовое действие, а «каменный столб» ясно обозначает поставленный Иаковом памятный камень.
- source_word: נָדַרְתָּ לִּי ... נֶדֶר
  choice: дал Мне обет
  rationale: Естественная русская передача сочетания однокоренных глагола и существительного; адресат обета сохранён местоимением «Мне».
- source_word: קוּם צֵא
  choice: встань, уйди
  rationale: Последовательность повелений передана современно и достойно; «уйди» естественно выражает выход из данной земли.
- source_word: אֶרֶץ מוֹלַדְתֶּךָ
  choice: землю, где ты родился
  rationale: Передаёт значение родной земли или земли рождения, не сужая его до территории родственников.
theological_decisions:
- issue: Самоопределение говорящего как הָאֵל בֵּית אֵל
  choice: Я — Бог Вефиля
  alternative: Я — Бог в Вефиле
  rationale: Выражение связывает говорящего с прежним откровением Иакову в Вефиле; оно не представляет Бога как местное божество и вместе с тем не требует поясняющего добавления в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и доступен; устаревшие формы и неестественное «обещал обет» исключены.
