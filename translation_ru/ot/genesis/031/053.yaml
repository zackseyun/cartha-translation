  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: ru
  text: Бог Авраама и бог Нахора[a], бог их отца[c], да рассудят между нами. И Иаков поклялся Страхом своего отца Исаака[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Бог Авраама и Бог Нахора, Бог их отца, да рассудит между нами». Еврейский текст допускает отнесение всех этих выражений к одному и тому же Богу; основной перевод сохраняет неоднозначность.'
    reason: alternative_reading
  - marker: b
    text: «Страх своего отца Исаака» — необычное обозначение Бога; буквально употреблено существительное «страх» или «ужас».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «— бог их отца —». Эта фраза может пониматься как вставное приложение.'
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: Бог Авраама
  rationale: Форма אֱלֹהֵי морфологически совпадает с множественным сопряжённым числом, но при личном референте обычно означает «Бог». Прописная буква указывает на Бога Авраама.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: и бог Нахора
  rationale: Строчная буква сохраняет напряжение в формуле Лавана и не отождествляет заранее бога Нахора с Богом Авраама; возможное отождествление отмечено в сноске.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: бог их отца
  rationale: Фраза может быть приложением или поясняющим возобновлением предыдущего обращения. Строчная буква и пунктуация не устраняют неоднозначность.
- source_word: יִשְׁפְּטוּ
  choice: да рассудят
  rationale: Имперфект третьего лица множественного числа выражает здесь пожелание или призыв. Русская форма множественного числа также передаёт грамматическое число еврейского глагола и согласуется с составным подлежащим.
- source_word: בֵינֵינוּ
  choice: между нами
  rationale: Прямой и естественный перевод взаимного выражения в контексте договора.
- source_word: וַיִּשָּׁבַע
  choice: И Иаков поклялся
  rationale: Последовательная повествовательная форма передана простым прошедшим временем.
- source_word: בְּפַחַד
  choice: Страхом
  rationale: פַחַד буквально означает «страх, ужас, трепет», но здесь служит необычным обозначением Бога в формуле клятвы. Прописная буква сохраняет функцию титула, не заменяя его толкованием.
- source_word: אָבִיו יִצְחָק
  choice: своего отца Исаака
  rationale: Естественная русская конструкция ясно связывает Исаака с отцом Иакова.
theological_decisions:
- issue: Следует ли единообразно отождествить всех названных Лаваном богов с одним Богом
  choice: «Бог Авраама» написано с прописной буквы, а «бог Нахора, бог их отца» — со строчной; глагол оставлен во множественном числе.
  alternative: «Бог Авраама и Бог Нахора, Бог их отца, да рассудит между нами».
  rationale: Еврейский текст повторяет אֱלֹהֵי и употребляет глагол во множественном числе, тогда как формула Лавана допускает как различение, так и отождествление референтов. Основной текст сохраняет это напряжение, а сноска сообщает об альтернативном прочтении.
- issue: Передача формулы клятвы בְּפַחַד אָבִיו יִצְחָק
  choice: «поклялся Страхом своего отца Исаака»
  alternative: «поклялся Богом, Которого боялся его отец Исаак» или «Грозным Богом своего отца Исаака»
  rationale: Буквальное существительное «Страх» сохраняет необычное божественное обозначение и не подменяет его поясняющим толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Частица «да» естественно передаёт пожелание в формуле призыва; необычный титул «Страх» намеренно не сглажен. Все маркеры сносок помещены в основном тексте.
