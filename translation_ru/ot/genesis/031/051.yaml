source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָבָ֖ן לְ/יַעֲקֹ֑ב הִנֵּ֣ה הַ/גַּ֣ל הַ/זֶּ֗ה וְ/הִנֵּה֙ הַ/מַצֵּבָ֔ה אֲשֶׁ֥ר יָרִ֖יתִי בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: ru
  text: 'Тогда Лаван сказал Иакову: «Вот эта груда камней[a] и вот этот каменный столб[b], который я поставил между мной и тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «каменный холм». Здесь имеется в виду сложенная в свидетельство груда камней.
    reason: lexical_alternative
  - marker: b
    text: Или «поставленный камень».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Лаван сказал
  rationale: Форма с повествовательным וַ передаёт последовательное развитие рассказа; «тогда» естественно выражает эту связь по-русски.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: Вот ... и вот
  rationale: Повтор сохранён, чтобы передать указательное значение и параллельное выделение обоих памятных объектов.
- source_word: הַגַּל הַזֶּה
  choice: эта груда камней
  rationale: В данном контексте גַּל обозначает сложенную в свидетельство груду камней. Эксплицитное «камней» ясно и естественно для современного читателя.
- source_word: הַמַּצֵּבָה
  choice: этот каменный столб
  rationale: מַצֵּבָה — вертикально поставленный камень; «каменный столб» передаёт и материал, и его установленное положение, не придавая слову лишнего культового смысла.
- source_word: יָרִיתִי
  choice: я поставил
  rationale: Хотя основное значение глагола связано с бросанием или набрасыванием, при מַצֵּבָה контекстуально имеется в виду установление камня. Формулировка сохраняет прямое заявление Лавана, не согласуя его искусственно с предыдущим повествованием.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: между мной и тобой
  rationale: Прямое и естественное соответствие еврейской взаимной конструкции.
theological_decisions:
- issue: Заявление Лавана о том, что он поставил столб, при том что ранее столб поставил Иаков (Быт. 31:45)
  choice: Сохранено прямое «который я поставил»
  alternative: Сгладить как «который поставлен» или отнести глагол ко всей группе камней
  rationale: Еврейский текст прямо содержит форму первого лица единственного числа יָרִיתִי. Возможное повествовательное напряжение не следует устранять переводом.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной библейского повествования формулировкой. Повтор «вот ... и вот» сохраняет риторическую структуру оригинала; архаизмы не используются.
