  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: ru
  text: Однако ваш отец обманывал меня[a] и десять раз менял мою плату[b], но Бог не позволил ему причинить мне вред[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насмехался надо мной», «издевался надо мной». Еврейский глагол может обозначать как обманное, так и насмешливое обращение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «десять раз». Это выражение может указывать на многократность и не обязательно означает точное число изменений.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «Бог не дал ему причинить мне вред», то есть не позволил ему сделать это.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: обманывал
  rationale: В породе hифиль глагол обозначает обманное, а иногда и насмешливое обращение с человеком. В данном контексте «обманывал» естественно передаёт нечестное отношение Лавана, конкретно проявившееся в изменении платы.
- source_word: וְהֶחֱלִף
  choice: менял
  rationale: Глагол указывает на изменение ранее установленной платы; несовершенный вид в русском языке уместно передаёт повторяемость действия.
- source_word: מַשְׂכֻּרְתִּי
  choice: мою плату
  rationale: Существительное означает плату или вознаграждение за труд. «Мою плату» ясно и естественно звучит в контексте трудовых отношений.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: десять раз
  rationale: Это традиционное выражение повторности; оно может обозначать множество случаев, а не обязательно точный подсчёт.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: но Бог не позволил ему
  rationale: 'Буквально сказано: «Бог не дал ему». В данном обороте «не позволил ему» естественно выражает отсутствие предоставленной возможности или разрешения.'
- source_word: לְהָרַע עִמָּדִי
  choice: причинить мне вред
  rationale: Инфинитив с предлогом עִם означает дурно поступить с кем-либо или повредить ему. Выбранная формулировка современна и точно передаёт смысл.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В речи Иакова слово обозначает Бога, который воспрепятствовал намерению Лавана.
theological_decisions:
- issue: Божественное воспрепятствование в обороте «Бог не дал ему»
  choice: Бог не позволил Лавану причинить Иакову вред
  alternative: Бог не дал Лавану добиться успеха в причинении вреда Иакову
  rationale: Перевод сохраняет представленную в тексте действенную власть Бога, но не уточняет сверх сказанного, каким именно образом Он воспрепятствовал Лавану.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Однако» передаёт противопоставление, «плата» сохраняет трудовой контекст, а последовательность сносок приведена в соответствие с теми словами, которые они поясняют.
