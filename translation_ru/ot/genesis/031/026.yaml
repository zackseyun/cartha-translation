base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: ru
  text: 'Тогда Лаван сказал Иакову: «Что ты сделал? Ты обманул меня[a] и увёл моих дочерей, словно пленниц, взятых в плен на войне[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «похитил моё сердце», то есть обманул меня или поступил тайно от меня.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «словно пленниц меча»; имеются в виду женщины, взятые в плен на войне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Что ты сделал?
  rationale: Естественная по-русски форма обвинительного вопроса, сохраняющая прямоту речи Лавана.
- source_word: וַתִּגְנֹב אֶת־לְבָבִי
  choice: Ты обманул меня
  rationale: 'Буквально: «ты похитил моё сердце», однако в данном контексте еврейское выражение обозначает обман или тайное действие за спиной. Буквальный русский оборот создавал бы прежде всего неуместную романтическую ассоциацию, поэтому образ сохранён в примечании.'
- source_word: וַתְּנַהֵג
  choice: увёл
  rationale: Глагол נהג может означать «вести» или «гнать». «Увёл» естественно относится к людям и в сочетании с последующим сравнением сохраняет представление о вынужденном удалении, не уподобляя дочерей скоту.
- source_word: בְּנֹתַי
  choice: моих дочерей
  rationale: Прямая передача формы множественного числа с притяжательным значением.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: словно пленниц, захваченных мечом
  rationale: Сохраняется военный образ «меча» и женский род причастия שְׁבֻיוֹת; добавление «захваченных» делает сжатое еврейское выражение понятным современному русскому читателю.
