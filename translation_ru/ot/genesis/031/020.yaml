  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: ru
  text: И Иаков обманул Лавана-арамея, не сказав ему, что убегает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И Иаков украл сердце Лавана-арамея»; это еврейское выражение означает, что он обманул его или застал врасплох.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת־לֵב
  choice: обманул
  rationale: 'Буквально выражение означает «украл сердце», но здесь это еврейская идиома: Иаков скрыл свои действия от Лавана и тем самым ввёл его в заблуждение или застал врасплох. Русское «обманул» естественно передаёт смысл, не создавая ложной ассоциации с любовью.'
- source_word: הָאֲרַמִּי
  choice: Лавана-арамея
  rationale: «Арамей» прямо передаёт этническое обозначение исходного текста и точнее традиционного «сириец».
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: не сказав ему
  rationale: Деепричастная конструкция естественно выражает способ, которым Иаков ввёл Лавана в заблуждение.
- source_word: כִּי בֹרֵחַ הוּא
  choice: что убегает
  rationale: Причастная форма изображает бегство как происходящее действие; настоящее время в придаточном естественно для русского косвенного сообщения и сохраняет эту аспектуальность.
