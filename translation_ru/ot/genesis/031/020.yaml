  register: Современный литературный русский язык. Сохранён повествовательный союз «И» и этноним «арамея»; буквальная идиома вынесена в сноску, поскольку по-русски «украсть сердце» обычно означает завоевать любовь и здесь вводила бы читателя в заблуждение.
