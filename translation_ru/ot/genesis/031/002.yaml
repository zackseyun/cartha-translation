  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: ru
  text: Иаков увидел лицо Лавана — и вот, тот был расположен к нему уже не так, как прежде.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и вот, он не с ним, как вчера и позавчера»; это выражение означает, что прежнее отношение Лавана к Иакову изменилось.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное повествовательное значение глагола ראה; перевод не добавляет значения намеренного разглядывания.
- source_word: פְּנֵי לָבָן
  choice: лицо Лавана
  rationale: Сохранён конкретный древнееврейский образ лица как внешнего выражения отношения и настроя.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт указательно-эмфатическую функцию הִנֵּה и оживляет повествование без излишней архаизации.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: тот был расположен к нему уже не так
  rationale: Буквальное «он не с ним» в данном контексте обозначает изменившееся отношение Лавана к Иакову. Указательное местоимение «тот» устраняет неясность русских местоимений, а «расположен» передаёт relational idiom без добавления конкретной враждебности.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: как прежде
  rationale: Устойчивое выражение буквально говорит о «вчера и позавчера», но означает прежнее время; «как прежде» естественно передаёт этот смысл по-русски.
