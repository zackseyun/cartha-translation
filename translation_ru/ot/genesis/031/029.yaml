base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: ru
  text: 'В моих силах причинить вам вред, но Бог вашего отца прошлой ночью сказал мне: «Смотри, не говори с Иаковом ни хорошего, ни плохого».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорить с Иаковом от доброго до худого»; это выражение охватывает всё возможное — и благоприятное, и неблагоприятное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: В моей власти
  rationale: Еврейский оборот выражает наличие силы или возможности совершить действие. Русское «в моей власти» естественно и точно передаёт смысл.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: причинить вам зло
  rationale: רָע здесь обозначает зло или вред, который Лаван способен причинить адресатам. Формулировка сохраняет этическую окраску исходного слова и при этом звучит естественно по-русски.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: но Бог вашего отца
  rationale: Союз ו в контексте выражает противопоставление между заявленной властью Лавана и Божьим запретом. Форма «вашего» сохраняет множественное число суффикса, поскольку Лаван обращается к группе, тогда как «отца» передаёт единственное число существительного.
- source_word: אֶמֶשׁ
  choice: прошлой ночью
  rationale: В данном повествовательном контексте слово указывает на предшествующую ночь; это ясная современная русская формулировка.
- source_word: הִשָּׁמֶר לְךָ
  choice: Берегись
  rationale: Возвратный императив передаёт строгое предостережение. «Берегись» сохраняет его силу лучше, чем более мягкое «будь осторожен».
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: говорить Иакову что-либо
  rationale: Конструкция הִשָּׁמֶר с מִן имеет запретительный смысл. Добавление «что-либо» проясняет полный охват запрета, выраженный последующей полярной формулой.
- source_word: מִטּוֹב עַד רָע
  choice: ни доброго, ни худого
  rationale: Сохранена еврейская полярная формула «от доброго до худого», которая в контексте означает запрет говорить что бы то ни было; русская парная конструкция естественна и не устраняет образность полностью.
theological_decisions:
- issue: Число в выражении וֵאלֹהֵי אֲבִיכֶם
  choice: Бог вашего отца
  alternative: Бог ваших отцов
  rationale: 'Существительное אָבִיכֶם морфологически означает «вашего отца»: притяжательный суффикс множественного числа относится к адресатам, а «отец» остаётся в единственном числе. Перевод не подменяет эту форму традиционной формулой «Бог отцов».'
- issue: Объём Божьего запрета מִטּוֹב עַד רָע
  choice: говорить Иакову что-либо — ни доброго, ни худого
  alternative: говорить Иакову ни хорошего, ни плохого
  rationale: 'Формулировка сохраняет напряжение буквальной полярной пары, одновременно показывая её идиоматический смысл: Лаван не должен самовольно обращаться к Иакову ни с благоприятными, ни с враждебными словами.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Берегись» передаёт строгость предупреждения; «ни доброго, ни худого» сохраняет исходную полярную формулу. Маркер сноски поставлен после всей прямой речи, к которой относится пояснение.
