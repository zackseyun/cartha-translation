revisions:
- from: И погнал он весь свой скот и понёс всё имущество, которое приобрёл, — скот, который он приобрёл в Паддан-Араме, — чтобы отправиться к своему отцу Исааку в землю Ханаанскую[a].
  to: И увёл он с собой весь свой скот и всё имущество, которое приобрёл, — скот, который он приобрёл в Паддан-Араме, — чтобы отправиться к своему отцу Исааку, в землю Ханаана[a].
  rationale: 'Исправлен смысловой сбой в передаче глагола וַיִּנְהַג: «увёл с собой» естественно передаёт движение скота и имущества под водительством Иакова, не создавая образа физического несения имущества. Сохранены повтор «приобрёл», топоним Паддан-Арам и направленность движения к Ханаану. Сноска уточнена, чтобы отметить допустимую синтаксическую привязку выражения «в земле Ханаана», одновременно поясняя направительное значение еврейской формы.'
