    rationale: Еврейский глагол וַיִּנְהַג означает вести/гнать, перегонять; он не означает нести. Конструкция относится к перечисленному скоту и имуществу как к тому, что Иаков увёл с собой.
  - severity: low
    issue: «в землю Ханаанскую»
    rationale: Направление передано верно, но «в землю Ханаана» более современно и естественно; родительный оборот также яснее связывает землю с топонимом.
