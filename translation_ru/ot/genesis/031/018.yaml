lexical_decisions:
- source_word: וַיִּנְהַג
  choice: погнал
  rationale: Глагол נהג здесь обозначает движение стада под управлением человека; «погнал» естественно передаёт пастушеский контекст.
- source_word: מִקְנֵהוּ
  choice: весь свой скот
  rationale: מִקְנֶה — собирательное обозначение домашнего скота без неоправданного сужения до крупного рогатого скота.
- source_word: רְכֻשׁוֹ
  choice: всё имущество
  rationale: רְכוּשׁ означает приобретённое имущество или собственность; «имущество» ясно и достаточно широко.
- source_word: רָכָשׁ
  choice: приобрёл
  rationale: Сохраняет хозяйственно-имущественный смысл корня и его повтор в стихе.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: скот, который он приобрёл
  rationale: Передаёт несколько избыточную конструкцию оригинала естественным русским оборотом и сохраняет повтор идеи приобретения.
- source_word: בְּפַדַּן אֲרָם
  choice: в Паддан-Араме
  rationale: Название местности передано принятой русской транслитерацией и оформлено через дефис.
- source_word: לָבוֹא
  choice: чтобы отправиться
  rationale: Инфинитив выражает цель движения; «отправиться» естественнее в русском повествовании, чем буквальное «прийти» после описания начала пути.
- source_word: אַרְצָה כְּנָעַן
  choice: в землю Ханаанскую
  rationale: Направительная форма указывает на движение к Ханаану; русское «в землю Ханаанскую» естественно передаёт направление.
