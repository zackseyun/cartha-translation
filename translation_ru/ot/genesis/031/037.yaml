  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: ru
  text: Раз уж ты обыскал всё моё имущество, что ты нашёл из всего имущества твоего дома? Положи это здесь перед моими братьями и твоими братьями, и пусть они рассудят между нами двумя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: обыскал
  rationale: Глагол буквально связан с ощупыванием, но в контексте тщательного поиска среди вещей естественно передаётся как «обыскал».
- source_word: כָּל כֵּלַי
  choice: всё моё имущество
  rationale: כְּלִי здесь обозначает совокупность движимых вещей, а не только сосуды; «имущество» сохраняет широкий смысл и достойный регистр.
- source_word: מִכֹּל כְּלֵי בֵיתֶךָ
  choice: из всего имущества своего дома
  rationale: 'Предлог имеет партитивный смысл: Иаков спрашивает, какую именно вещь из имущества дома Лавана тот нашёл. Повтор слова «имущество» отражает повтор כְּלִי в еврейском тексте.'
- source_word: שִׂים כֹּה
  choice: положи это здесь
  rationale: Повеление требует публично предъявить найденный предмет; местоимение «это» естественно отсылает к предполагаемой находке.
- source_word: נֶגֶד
  choice: перед
  rationale: Слово указывает на предъявление в присутствии свидетелей; «перед» кратко и точно выражает этот смысл.
- source_word: אַחַי וְאַחֶיךָ
  choice: моими братьями и твоими братьями
  rationale: Сохранено обычное значение אַח — «брат», хотя в данном повествовательном контексте оно может охватывать более широкий круг родичей или людей каждой стороны.
- source_word: וְיוֹכִיחוּ
  choice: пусть они рассудят
  rationale: В породе хифиль глагол имеет здесь судебно-арбитражный смысл. «Рассудят» естественно передаёт решение спора без излишне официального оттенка.
- source_word: בֵּין שְׁנֵינוּ
  choice: между нами двумя
  rationale: Формулировка сохраняет и предлог «между», и выраженное в источнике указание на две стороны.
theological_decisions: []
