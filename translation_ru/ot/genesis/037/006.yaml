lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: И сказал он им
  rationale: Последовательная форма глагола продолжает повествование; союз «и» сохраняет ход еврейского рассказа, а «им» прямо передаёт адресата речи.
- source_word: שִׁמְעוּ נָא
  choice: Послушайте, пожалуйста
  rationale: Форма множественного числа повелительного наклонения требует внимать словам, а частица נָא смягчает побуждение; такое сочетание естественно звучит по-русски.
- source_word: הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתִּי
  choice: какой сон мне приснился
  rationale: 'Естественная русская конструкция передаёт указание Иосифа на конкретный увиденный им сон и сохраняет однокоренную связь существительного и глагола: «сон — приснился».'
