- from: 'И встретил его один человек — он блуждал по полю. Человек спросил его: «Что ты ищешь?[a]»'
  to: 'Один человек нашёл его, и вот, он блуждал по полю. Человек спросил его: «Что ты ищешь?»'
  rationale: 'Исправлены два элемента, непосредственно отмеченные в еврейском тексте: מצא передано как «нашёл», а וְהִנֵּה — как «и вот». Сохранены естественный современный литературный синтаксис, неопределённость איש и непредрешённый оттенок תעה («блуждал»). Сноска удалена, поскольку не необходима для передачи текста, а предложенная альтернатива несколько сужает значение глагола.'
