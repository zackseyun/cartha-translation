translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Синтаксис упрощён в пределах нормы русского повествования, при этом сохранены последовательность событий и неоднозначность תֹעֶה между блужданием и состоянием заблудившегося человека. Маркер примечания помещён при выражении מַה תְּבַקֵּשׁ, к которому относится указанная лексическая альтернатива.
