  text: 'Один человек нашёл его, и вот, он блуждал по полю. Человек спросил его: «Что ты ищешь?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: встретил его
  rationale: Глагол מצא в породе каль обычно означает «найти», однако в данном повествовательном контексте человек не разыскивал Иосифа, а обнаружил его в поле; русское «встретил его» естественно передаёт случайную встречу, не создавая впечатления намеренного поиска.
- source_word: אִישׁ
  choice: один человек
  rationale: Сочетание передаёт неопределённое первое упоминание о конкретном мужчине и звучит естественнее буквального «человек» без определителя.
- source_word: וְהִנֵּה
  choice: —
  rationale: Частица הִנֵּה направляет внимание на открывшуюся человеку картину. В современном русском её повествовательную функцию естественно передаёт присоединение поясняющей сцены с помощью тире, без архаизирующего «и вот».
- source_word: תֹעֶה
  choice: блуждал
  rationale: Причастие от תעה обозначает движение без верного направления, странствие или отклонение от пути. «Блуждал» сохраняет этот оттенок, но не утверждает прямо, что Иосиф окончательно заблудился.
- source_word: בַּשָּׂדֶה
  choice: по полю
  rationale: שדה означает поле или открытую местность; с глаголом движения русское «по полю» идиоматично передаёт место его блуждания.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: спросил его
  rationale: Прямое и естественное соответствие глаголу שאל в данном контексте.
- source_word: לֵאמֹר
  choice: 'спросил его:'
  rationale: Еврейская формула введения прямой речи буквально содержит «говоря», но в современном русском её функция естественно выражается двоеточием после глагола речи.
- source_word: מַה תְּבַקֵּשׁ
  choice: Что ты ищешь?
  rationale: בקש означает «искать, разыскивать». Настоящее время и краткая формулировка точно и естественно передают вопрос о текущем поиске.
