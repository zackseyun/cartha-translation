base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: ru
  text: 'Он узнал её и сказал: «Это одежда моего сына! Его съел дикий зверь[a]. Иосиф растерзан, растерзан[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «злой» или «опасный зверь».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст усиливает утверждение повтором: «растерзан, растерзан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Он узнал её
  rationale: Глагол נכר в породе hифиль означает «узнать, опознать»; местоимение женского рода относится к одежде (כְּתֹנֶת).
- source_word: כְּתֹנֶת בְּנִי
  choice: одежда моего сына
  rationale: כְּתֹנֶת обозначает нательную или длинную одежду; «одежда» звучит естественно и не вносит излишне точной реконструкции фасона.
- source_word: חַיָּה רָעָה
  choice: хищный зверь
  rationale: В данном контексте сочетание обозначает опасного дикого зверя; «хищный зверь» естественно передаёт губительный характер животного, не приписывая ему нравственного зла.
- source_word: אֲכָלָתְהוּ
  choice: его растерзал
  rationale: Буквально глагол означает «съел, пожрал», однако в русском рассказе о нападении зверя «растерзал» естественно передаёт подразумеваемую насильственную гибель и подготавливает повтор корня טרף.
- source_word: טָרֹף טֹרַף
  choice: Растерзан, растерзан
  rationale: Инфинитив абсолютный перед личной пассивной формой усиливает утверждение. Повтор сохраняет выразительную еврейскую конструкцию и отчаянную речь отца.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Использована устоявшаяся русская библейская форма имени, понятная современному читателю и соответствующая литературной традиции русского языка.
theological_decisions:
- issue: Степень уверенности Иакова в смерти Иосифа
  choice: 'Сохранено категорическое и эмоционально усиленное заключение: «Растерзан, растерзан Иосиф!»'
  alternative: «Иосифа наверняка растерзал зверь»
  rationale: Еврейская конструкция טָרֹף טֹרַף выражает сильную уверенность, но её повтор также передаёт потрясение; буквальный ритм не сводит реплику к нейтральному логическому выводу.
translation_notes:
  register: Современный литературный русский с сохранением эмоциональной резкости прямой речи. Устоявшееся имя «Иосиф» предпочтено искусственной прямой транслитерации «Йосеф». Маркер сноски помещён после всей реплики, к которой относится пояснение.
