lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он ответил
  rationale: Контекстуально реплика является ответом на вопрос человека; русский глагол «ответил» естественно передаёт функцию стандартной повествовательной формы וַיֹּאמֶר, не требуя буквального начального союза.
- source_word: אֶת אַחַי
  choice: своих братьев
  rationale: אֶת отмечает определённое прямое дополнение, а אַחַי означает «моих братьев». В русском при соотнесённости с подлежащим естественно употребить возвратное притяжательное местоимение «своих».
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Я ищу
  rationale: Самостоятельное местоимение с причастием выражает текущее, продолжающееся действие. Настоящее время русского глагола «искать» передаёт этот смысл естественно.
- source_word: הַגִּידָה נָּא לִי
  choice: Скажи мне, пожалуйста
  rationale: Побудительная форма נגד и частица נָא образуют вежливую просьбу; выбранный порядок слов сохраняет и обращённость просьбы, и её учтивый оттенок.
- source_word: אֵיפֹה הֵם רֹעִים
  choice: где они пасут стада
  rationale: רֹעִים — причастие от רעה, обозначающее выпас или уход за скотом. В русском непереходное «пасутся» ошибочно сделало бы братьев пасущимися, поэтому естественно добавить подразумеваемый объект «стада».
