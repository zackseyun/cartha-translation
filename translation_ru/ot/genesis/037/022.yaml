  verdict: revise
  source_fidelity: 'Основной смысл передан точно: сохранены запрет «проливать кровь», приказ бросить Иосифа в בּוֹר, запрет причинять ему насилие и авторское пояснение о намерении Рувима. Уточнено «вернуть его отцу», чтобы явно передать объект в לַהֲשִׁיבוֹ אֶל־אָבִיו. Удалена сноска, представлявшая как возможное пунктуационное прочтение продолжение прямой речи: в данном контексте לְמַעַן вводит пояснение повествователя о цели Рувима, а не текстовый вариант.'
  naturalness: «Эта яма в пустынной местности» звучит по-русски естественнее, чем разговорно-относительное «эта яма, что в пустыне», и не навязывает значение песчаной пустыни. «Руки на него не поднимайте» — устойчивое современное литературное выражение.
  terminology: «Рувим» соответствует традиционной русской библейской передаче имени. «Яма» — уместное широкое соответствие בּוֹר; в сноске сохранена возможность значения «цистерна». Идиомы «проливайте крови» и «из их рук» сохранены.
