base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: ru
  text: 'И сказал им Рувим: «Не проливайте крови. Бросьте его в эту яму[a] в пустынной местности, но руки на него не поднимайте». Он сказал это, чтобы спасти его из их рук и вернуть его отцу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «цистерну». Еврейское слово может обозначать яму или цистерну для сбора воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Не проливайте крови
  rationale: Сохраняет еврейскую идиому «проливать кровь», подразумевающую убийство и связанную с ним вину, не сводя выражение к более толковательному «не убивайте его».
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Бросьте его
  rationale: Прямо и естественно передаёт повелительную форму глагола со значением «бросить, кинуть».
- source_word: הַבּוֹר
  choice: яма
  rationale: Это наиболее широкое и понятное соответствие; в данном контексте слово может обозначать также высохшую водосборную яму, что отмечено в сноске.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: что в пустыне
  rationale: Передаёт относительную конструкцию אֲשֶׁר и обычное значение מִדְבָּר как безлюдной, необжитой местности; русское «пустыня» не обязательно означает песчаную пустыню.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: но руки на него не поднимайте
  rationale: Естественная русская идиома, сохраняющая образ руки и запрет лично причинять ему насилие.
- source_word: לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם
  choice: Он сказал это, чтобы спасти его из их рук
  rationale: לְמַעַן вводит цель; добавление «Он сказал это» естественно обозначает переход от прямой речи к авторскому пояснению мотива Рувима. Оборот «из их рук» сохраняет еврейский образ власти и контроля.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: и вернуть отцу
  rationale: 'Кратко и естественно передаёт каузативное значение: Рувим намеревался сделать так, чтобы Иосиф вернулся к своему отцу.'
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Традиционная и общепонятная русская форма библейского имени.
theological_decisions:
- issue: Граница прямой речи и авторского пояснения
  choice: Прямая речь заканчивается после «руки на него не поднимайте»; далее следует пояснение рассказчика о намерении Рувима.
  alternative: Считать слова «чтобы спасти его…» продолжением речи Рувима.
  rationale: Синтаксис и масоретская акцентуация поддерживают понимание לְמַעַן как авторского пояснения скрытой цели Рувима; при этом альтернативное пунктуационное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены образные выражения «проливать кровь» и «из их рук»; переход к авторскому пояснению сделан ясным без устранения возможной пунктуационной неоднозначности.
