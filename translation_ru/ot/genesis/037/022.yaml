    rationale: Фраза «чтобы спасти его…» в масоретском тексте является повествовательским пояснением намерения Рувима. Сноска не отражает вариант исходного текста и может создать впечатление текстологической либо синтаксической неопределённости там, где её не требуется сохранять.
  - severity: low
