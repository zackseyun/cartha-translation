base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: ru
  text: И они взяли его и бросили в яму[a]. Яма же была пуста, воды в ней не было.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в водосборную яму»; еврейское слово бор может обозначать яму или цистерну для сбора воды, что согласуется с уточнением, что воды в ней не было.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: И они взяли его
  rationale: Глагол לקח здесь имеет прямое значение «взять», а повествовательная форма с וַ־ последовательно продолжает рассказ; союз «и» естественно сохраняет эту связь, не усиливая действие до «схватили».
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: и бросили
  rationale: השליך означает «бросать, кидать»; «бросили» — современная и точная передача без излишнего усиления.
- source_word: הַבֹּרָה
  choice: в яму
  rationale: בּוֹר может обозначать яму, водосборную яму или цистерну. Общее слово «яма» сохраняет широту значения, а возможная конкретизация вынесена в сноску.
- source_word: וְהַבּוֹר רֵק
  choice: Яма же была пуста
  rationale: Частица «же» естественно передаёт пояснительный характер следующей фразы, а «пуста» точно соответствует רֵק.
- source_word: אֵין בּוֹ מָיִם
  choice: воды в ней не было
  rationale: Фраза прямо уточняет, в каком отношении яма была пуста; русский порядок слов звучит естественно и сохраняет явное упоминание воды.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Сохранены повтор слова «яма» и пояснительное уточнение оригинала; архаизмы и неоправданное усиление насилия исключены.
