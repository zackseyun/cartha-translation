  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: ru
  text: 'Он сказал ему: «Пойди, пожалуйста, проведай, всё ли благополучно у твоих братьев и у стада, и принеси мне весть». И послал он его из долины Хеврона, и тот пришёл в Сихем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Пойди, пожалуйста
  rationale: Императив לֶךְ означает «пойди», а частица נָא смягчает просьбу; «пожалуйста» естественно передаёт этот оттенок в современном русском.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: проведай, всё ли благополучно
  rationale: ראה буквально означает «увидь», но в сочетании со שׁלום выражает поручение узнать о состоянии кого-либо. «Проведай, всё ли благополучно» сохраняет смысл проверки благополучия и звучит естественно.
- source_word: שְׁלוֹם
  choice: благополучно
  rationale: Здесь שׁלום обозначает благополучие, сохранность и нормальное состояние, а не только «мир». Одна и та же формулировка охватывает братьев и стадо, сохраняя повтор исходного понятия по смыслу.
- source_word: אַחֶיךָ
  choice: твоих братьев
  rationale: Мужской род множественного числа буквально обозначает братьев Иосифа и соответствует контексту.
- source_word: הַצֹּאן
  choice: стада
  rationale: צאן — собирательное обозначение мелкого скота, прежде всего овец и коз; «стадо» не вносит неоправданного уточнения вида животных.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: и принеси мне весть
  rationale: Каузатив שוב с דָּבָר образует идиому возвращения с сообщением; «принеси мне весть» кратко и естественно передаёт её.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: из долины Хеврона
  rationale: Передаёт עֵמֶק как «долина» и сохраняет конструктивную связь с географическим названием Хеврон.
- source_word: שְׁכֶמָה
  choice: в Сихем
  rationale: Направительный суффикс -ה указывает движение к Сихему; по-русски это естественно выражается предлогом «в» с винительным падежом.
