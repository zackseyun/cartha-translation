  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: ru
  text: 'И сказали они друг другу: «Смотрите, вон идёт этот сновидец[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «владелец снов» или «господин снов». Здесь братья насмешливо называют так Иосифа из-за его снов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали они
  rationale: Форма wayyiqtol продолжает последовательность повествования; союз «и» сохраняет связь с предыдущим действием, а порядок слов естественен для литературного русского повествования.
- source_word: אִישׁ אֶל־אָחִיו
  choice: друг другу
  rationale: 'Буквально: «каждый своему брату»; здесь это взаимное выражение, которое по-русски естественно передаётся словами «друг другу».'
- source_word: הִנֵּה
  choice: Смотрите, вон
  rationale: Частица привлекает внимание к приближающемуся Иосифу. Сочетание «смотрите, вон» естественно передаёт указательный и восклицательный оттенок.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: сновидец
  rationale: Буквально выражение означает «владелец/господин снов», но в данном контексте характеризует Иосифа через его сны и звучит насмешливо. «Сновидец» сохраняет смысл и допускает этот пренебрежительный оттенок.
- source_word: הַלָּזֶה
  choice: этот
  rationale: Указательное местоимение выделяет Иосифа и в речи братьев может выражать пренебрежение; русское «этот» сохраняет такую возможность.
- source_word: בָּא
  choice: идёт
  rationale: Причастие от בוא обозначает происходящее приближение. В сочетании «вон идёт» это естественно и точно передаётся по-русски.
