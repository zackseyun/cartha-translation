  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: ru
  text: Его братья завидовали ему, а отец хранил всё это в памяти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хранил это слово (или: дело)» — то есть помнил рассказ Иосифа и продолжал обдумывать его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ ב֖וֹ
  choice: завидовали ему
  rationale: В данном контексте קנא с предлогом ב обозначает зависть, вызванную положением Иосифа и его снами. Русское «завидовали ему» естественно и точно передаёт направленность чувства.
- source_word: אֶחָיו
  choice: его братья
  rationale: Форма мужского рода во множественном числе в повествовании прямо указывает на братьев Иосифа.
- source_word: וְאָבִיו
  choice: а отец
  rationale: Союз ו формально может означать «и», однако здесь он противопоставляет реакцию отца реакции братьев; русское «а» естественно выражает этот контраст без его усиления.
- source_word: שָׁמַר
  choice: хранил … в памяти
  rationale: שׁמר буквально означает «хранить, беречь», а здесь — удерживать услышанное в памяти и не оставлять без внимания. Выражение сохраняет образ исходного глагола и звучит естественно по-русски.
- source_word: אֶת־הַדָּבָר
  choice: всё это
  rationale: דבר может означать «слово», «высказывание», «дело» или «обстоятельство». В контексте речь идёт о рассказанном Иосифом сне и его возможном значении; «всё это» естественно сохраняет широту отсылки.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; лаконичная повествовательная фраза. Союз «а» передаёт спокойное противопоставление, а выражение «хранил всё это в памяти» сохраняет образ еврейского текста и остаётся понятным обычному читателю.
