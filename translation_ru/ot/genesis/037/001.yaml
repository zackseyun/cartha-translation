  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: ru
  text: Иаков жил в земле, где его отец жил как пришелец[a], в земле Ханаана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «в земле пребываний его отца».'
    reason: Буквальная именная конструкция передаёт форму מְגוּרֵי אָבִיו; основной текст ясно раскрывает, что речь идёт о проживании отца как пришельца.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Иаков жил
  rationale: Глагол ישׁב здесь обозначает проживание, а форма wayyiqtol продолжает повествование. «Жил» естественно передаёт смысл, не добавляя идеи окончательного или постоянного поселения; союз וַ не требует отдельного «теперь».
- source_word: בְּאֶרֶץ
  choice: в земле
  rationale: В данном географическом контексте אֶרֶץ означает территорию, «землю». Повтор оборота сохранён в соответствии с еврейским текстом.
- source_word: מְגוּרֵי אָבִיו
  choice: где его отец был пришельцем
  rationale: מְגוּרִים обозначает проживание вне своей родной земли, положение пришельца. Придаточная конструкция естественна для современного русского языка и сохраняет важный оттенок непостоянного, пришлого проживания Исаака.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Традиционная и понятная русская географическая форма точно передаёт «в земле Ханаана»; повтор «в земле» сохраняет структуру и акцент оригинала.
theological_decisions:
- issue: Статус отца Иакова в земле
  choice: был пришельцем
  alternative: жил / странствовал
  rationale: Выражение сохраняет заложенное в מְגוּרֵי представление о проживании в чужой земле, не превращая его ни просто в постоянное жительство, ни обязательно в непрерывное кочевание.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён для ясности, но повтор «в земле» и географическое наименование сохранены. Тире отмечает пояснительное приложение «в земле Ханаанской».
