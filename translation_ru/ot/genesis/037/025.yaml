base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: ru
  text: 'Потом они сели есть. Подняв глаза, они увидели: вот из Галаада идёт караван измаильтян. Их верблюды везут ароматическую камедь, бальзам и лабданум[a] в Египет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное определение названных здесь ароматических веществ не вполне ясно. Последнее слово обычно понимают как «лабданум» — смолу ладанника, но его также переводят как «мирра».
    reason: Уточняет наиболее вероятное значение לֹט и сохраняет существенный вариант перевода без ложного отождествления с ладаном (олибанумом).
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: есть
  rationale: Буквально «есть хлеб», но здесь לֶחֶם обозначает пищу вообще; краткое «сели есть» естественно передаёт смысл в современном русском.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: караван измаильтян
  rationale: Сохраняет этническое обозначение и ясно передаёт значение אֹרְחָה как каравана путников или торговцев.
- source_word: נְכֹאת
  choice: ароматическая камедь
  rationale: Речь, вероятно, об ароматическом растительном продукте или смоле; «камедь» достаточно конкретно, а определение «ароматическая» отражает торгово-парфюмерный характер груза.
- source_word: צְרִי
  choice: бальзам
  rationale: Традиционное и лексикографически обоснованное обозначение целебной или ароматической смолы.
- source_word: לֹט
  choice: ладан
  rationale: Вероятно, имеется в виду лабданум — ароматическая смола ладанника; общеупотребительное «ладан» понятно читателю, а неопределённость отмечена в сноске.
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: везут … в Египет
  rationale: Еврейское выражение буквально означает «спустить/доставить вниз, в Египет»; русское «везут в Египет» естественно выражает направление и цель каравана.
