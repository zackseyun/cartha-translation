- source_word: וַיְהִי כַּאֲשֶׁר
  choice: И когда
  rationale: Естественно передаёт временную повествовательную формулу, не воспроизводя буквально идиому «и было».
- source_word: בָּא יוֹסֵף אֶל אֶחָיו
  choice: Иосиф пришёл к своим братьям
  rationale: Точно передаёт простое движение к братьям; мужской род множественного числа соответствует контексту.
- source_word: וַיַּפְשִׁיטוּ אֶת יוֹסֵף
  choice: они сняли с него одежду
  rationale: Глагол обозначает снятие одежды с человека, в данном контексте — против его воли. Русская конструкция передаёт действие естественно, не усиливая его до «сорвали».
- source_word: כֻּתָּנְתּוֹ
  choice: одежду
  rationale: Общеупотребительное слово яснее современному читателю, чем исторически окрашенное «хитон», и подходит для обозначения носимой поверх тела древней одежды.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: особую одежду[a]
  rationale: 'Значение сочетания неясно: оно может указывать на длину, рукава, богатую отделку или разноцветность. Нейтральное «особую» передаёт выделенный статус одежды, а варианты раскрыты в примечании.'
- source_word: אֲשֶׁר עָלָיו
  choice: что была на нём
  rationale: Близко и естественно передаёт уточнение о том, что Иосиф был одет в эту одежду.
