lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שוב в повествовательной форме обозначает возвращение Рувима к прежнему месту; «вернулся» естественно и точно передаёт это движение.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: ров / во рву
  rationale: Слово בּוֹר может обозначать яму, ров или водосборную цистерну. В данном контексте «ров» понятно современному читателю и согласуется с местом, куда бросили Иосифа; возможное значение «водосборная яма» сохранено в сноске.
- source_word: וְהִנֵּה
  choice: то увидел, что
  rationale: Частица הִנֵּה привлекает внимание к внезапно обнаруженному обстоятельству. В современном русском сочетание «то увидел, что» естественно передаёт эффект неожиданного обнаружения без архаического «вот».
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: Иосифа во рву нет
  rationale: Конструкция с אֵין выражает отсутствие. Настоящее время в придаточном сохраняет непосредственность восприятия Рувима и не добавляет предположения о том, что произошло с Иосифом.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: разорвал на себе одежду
  rationale: Это устойчивое библейское действие, выражающее сильное потрясение или горе. Формулировка «на себе одежду» ясна и естественна по-русски и не создаёт впечатления, будто он разорвал одежду, сняв её.
