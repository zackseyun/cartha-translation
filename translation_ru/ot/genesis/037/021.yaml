lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал это
  rationale: Глагол שׁמע означает «слышать»; местоимение «это» естественно отсылает к замыслу братьев из предыдущего стиха.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Традиционная русская библейская форма личного имени.
- source_word: וַיַּצִּלֵהוּ
  choice: спас его
  rationale: Порода hифиль глагола נצל означает избавить или спасти от непосредственной опасности; «спас» ясно и естественно в данном контексте.
- source_word: מִיָּדָם
  choice: из их рук
  rationale: Сохранён еврейский образ руки как власти и контроля; русское выражение «спасти из рук» естественно.
- source_word: וַיֹּאמֶר
  choice: сказав
  rationale: Деепричастная конструкция естественно связывает последовательные действия Рувима, не меняя их повествовательного порядка.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Не станем лишать его жизни
  rationale: Еврейское выражение буквально связано с нанесением удара по жизни и идиоматически означает смертельный удар; перевод передаёт результат, сохраняя коллективную форму первого лица.
