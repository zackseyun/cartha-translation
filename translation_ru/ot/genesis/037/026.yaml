  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: ru
  text: 'Тогда Иуда сказал своим братьям: «Что нам пользы, если мы убьём нашего брата и скроем его кровь[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «покроем его кровь». Это еврейское выражение означает скрыть совершённое кровопролитие или свою вину в нём.'
    reason: Пояснение еврейской идиомы при сохранении её образа в основном тексте.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: אֶל אֶחָיו
  choice: своим братьям
  rationale: Мужской род множественного числа в данном контексте обозначает присутствующих братьев Иосифа; возвратное «своим» естественно по-русски.
- source_word: מַה בֶּצַע
  choice: Что нам пользы
  rationale: בֶּצַע означает выгоду, прибыль или пользу, нередко с оттенком своекорыстного расчёта. Формулировка сохраняет прагматический характер вопроса Иуды.
- source_word: כִּי נַהֲרֹג
  choice: если мы убьём
  rationale: כִּי здесь естественно понимать как вводящее условие риторического вопроса, а форма первого лица множественного числа передана русским будущим совершенного вида.
- source_word: אָחִינוּ
  choice: нашего брата
  rationale: Прямой перевод сохраняет нравственно значимое указание на родство.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: и скроем его кровь
  rationale: Сохранён образный еврейский оборот «скрыть/покрыть его кровь», подразумевающий сокрытие кровопролития или вины; значение поясняется в сноске.
