    text: 'Или, более буквально: «Мальчика нет, а я — куда я приду?» Еврейское выражение передаёт отчаянный вопрос: «Куда мне идти?»; по смыслу также возможно: «Что же мне делать?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Он вернулся
  rationale: Глагол שׁוב в повествовательной форме обозначает возвращение и естественно передаёт последовательность событий.
- source_word: אֶל אֶחָיו
  choice: к своим братьям
  rationale: Предлог אֶל выражает направление, а אֶחָיו означает «его братья»; возвратное «своим» естественно для русского повествования.
- source_word: הַיֶּלֶד
  choice: мальчика
  rationale: יֶלֶד означает мальчика или ребёнка; в данном контексте речь идёт об Иосифе, и «мальчик» сохраняет эмоциональную окраску без архаизма.
- source_word: אֵינֶנּוּ
  choice: нет
  rationale: 'Форма выражает отсутствие: буквально «его нет». Перевод не подразумевает смерть и сохраняет непосредственный смысл.'
- source_word: וַאֲנִי
  choice: а я
  rationale: Местоимение подчёркивает резкий переход к личному положению Рувима; «а я» естественно передаёт это противопоставление.
- source_word: אָנָה אֲנִי בָא
  choice: куда мне теперь деваться?
  rationale: Буквально сочетание связано с направлением движения — «куда я иду/приду?», но в контексте это отчаянный вопрос о том, куда ему идти или что делать. Русская идиома передаёт смысл и эмоциональную силу; «теперь» эксплицирует подразумеваемое сложившееся положение.
