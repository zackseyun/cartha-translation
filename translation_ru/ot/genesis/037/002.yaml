  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: ru
  text: Вот повествование о потомках Иакова.[a] Иосифу было семнадцать лет, и он пас стадо вместе со своими братьями. Он был юношей и находился с сыновьями Валлы и Зелфы — жён его отца. Иосиф передал их отцу неблагоприятное известие о них.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вот порождения Иакова». Еврейское слово «толедот» часто открывает новый раздел книги Бытия и может означать потомство, родословие или дальнейшую историю того, что произошло от названного человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «передал их отцу дурной отзыв о них». Еврейское выражение может обозначать неблагоприятное сообщение или молву; само по себе оно не уточняет, было ли сообщение ложным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: повествование о потомках
  rationale: В Бытии слово служит заголовком нового раздела и обозначает историю того, что произошло от названного лица; сочетание сохраняет и повествовательный, и родословный оттенки.
- source_word: הָיָה רֹעֶה
  choice: пас
  rationale: Русский глагол естественно передаёт продолжительное занятие Иосифа пастушеским трудом в данном контексте.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: пас стадо вместе со своими братьями
  rationale: 'Передаёт наиболее вероятный смысл: Иосиф занимался стадом совместно с братьями, а не пас самих братьев.'
- source_word: נַעַר
  choice: юношей
  rationale: Соответствует прямо указанному возрасту — семнадцати годам — и сохраняет широкое значение еврейского слова без оттенка малолетства.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: находился с сыновьями Валлы и сыновьями Зелфы
  rationale: Синтаксис оригинала труден; нейтральное «находился с» сохраняет связь Иосифа с этими братьями, не вводя недоказанного служебного подчинения.
- source_word: נְשֵׁי אָבִיו
  choice: жён своего отца
  rationale: Прямо и естественно определяет Валлу и Зелфу по их отношению к Иакову.
- source_word: דִּבָּתָם רָעָה
  choice: недобрую молву о них
  rationale: «Молва» сохраняет возможный оттенок неблагоприятного сообщения или слуха и не решает без необходимости, было ли донесение истинным или клеветническим.
- source_word: אֶל אֲבִיהֶם
  choice: их отцу
  rationale: 'Сохраняет множественный суффикс оригинала: Иаков является отцом и Иосифа, и его братьев.'
theological_decisions:
- issue: Нравственная оценка сообщения Иосифа
  choice: недобрую молву
  alternative: злой донос / дурной отзыв
  rationale: Еврейский текст называет сообщение неблагоприятным, но не устанавливает однозначно, было ли оно ложным или нравственно предосудительным; перевод не должен заранее осуждать или оправдывать Иосифа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Традиционные русские формы имён «Валла» и «Зелфа» сохранены. Трудная конструкция о сыновьях Валлы и Зелфы передана нейтрально, без добавления отношений служения или подчинения.
