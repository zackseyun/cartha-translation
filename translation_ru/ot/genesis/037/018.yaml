  text: וַ/יִּרְא֥וּ אֹת֖/וֹ מֵ/רָחֹ֑ק וּ/בְ/טֶ֨רֶם֙ יִקְרַ֣ב אֲלֵי/הֶ֔ם וַ/יִּֽתְנַכְּל֥וּ אֹת֖/וֹ לַ/הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: ru
  text: Они увидели его издалека, и ещё прежде, чем он приблизился к ним, составили против него заговор[a], чтобы убить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замыслили против него злое». Еврейский глагол может означать коварный замысел или вероломные действия; здесь последующие слова прямо указывают на намерение убить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: Они увидели его издалека
  rationale: Глагол ראה в повествовательной форме обозначает простое завершённое действие; מֵרָחֹק естественно передано современным русским «издалека».
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: и ещё прежде, чем он приблизился к ним
  rationale: בְּטֶרֶם вводит временное придаточное со значением «прежде чем / пока ещё не»; частица «ещё» передаёт оттенок заблаговременности, а «приблизился» точно выражает пространственное значение קרב.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: составили против него заговор
  rationale: Форма Hitpael глагола נכל указывает на злонамеренное, коварное замышление. В данном контексте «составили против него заговор» ясно передаёт согласованный умысел братьев, не сводя значение лишь к обману.
- source_word: לַהֲמִיתוֹ
  choice: чтобы убить его
  rationale: 'Инфинитив Hiphil от מות с местоименным суффиксом выражает цель: они намеревались причинить ему смерть. «Чтобы убить его» — точная и естественная русская формулировка.'
