base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: ru
  text: 'Он рассказал этот сон отцу и братьям. Отец укорил его и сказал ему: «Что это за сон тебе приснился? Неужели мы — я, твоя мать и твои братья — придём поклониться тебе до земли[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасть перед тобой ниц». Еврейский глагол обозначает глубокий поклон в знак почтения или подчинения; здесь речь не обязательно идёт о религиозном поклонении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: рассказал этот сон
  rationale: Пиэль глагола ספר означает «рассказывать, пересказывать». Подразумеваемое по контексту дополнение — сон — выражено явно ради естественности русского текста.
- source_word: וַיִּגְעַר בּוֹ
  choice: укорил его
  rationale: Глагол גער передаёт сильное словесное порицание. «Укорил» звучит естественно и достаточно весомо, не привнося оттенка грубой брани.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Что это за сон тебе приснился?
  rationale: Естественная русская вопросительная конструкция сохраняет риторическое недоумение исходного текста; буквальное повторение «сон, который ты увидел во сне» по-русски было бы тяжеловесным.
- source_word: הֲבוֹא נָבוֹא
  choice: Неужели ... придём
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагол. В данном риторическом вопросе «неужели» естественно передаёт это усиление и недоверие говорящего.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: мы — я, твоя мать и твои братья —
  rationale: Сохраняется полный перечень действующих лиц, а вводное «мы» естественно согласует перечисление с русской формой глагола первого лица множественного числа.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: поклониться тебе до земли
  rationale: השתחוה в этом семейном контексте обозначает глубокий поклон и признание подчинённого положения, а אָרְצָה указывает направление к земле. Русское выражение «поклониться до земли» передаёт оба элемента без культового оттенка.
theological_decisions:
- issue: Значение השתחוה вне культового контекста
  choice: поклониться тебе до земли
  alternative: пасть перед тобой ниц; поклониться тебе как божеству
  rationale: Здесь речь идёт о почтении и подчинении членов семьи Иосифу в образе сна. Перевод не должен превращать этот жест в религиозное поклонение, хотя сохраняет его подчёркнуто глубокий характер.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Риторический вопрос передан естественно, а эмфатическая еврейская конструкция — частицей «неужели». Местоименное перечисление выделено тире для ясности.
