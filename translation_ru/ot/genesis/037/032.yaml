  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: ru
  text: 'Затем они послали одежду с длинными рукавами[a] и доставили её своему отцу. Они сказали: «Вот что мы нашли. Определи, пожалуйста,[b] одежда ли это твоего сына или нет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «богато украшенная одежда», «нарядная туника»; традиционно — «разноцветная одежда». Значение еврейского выражения неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Узнай»; «Распознай». Эта формулировка значима для повествования в целом, где неоднократно повторяется тема узнавания и ошибочного опознания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Затем они послали
  rationale: Порода пиэль глагола שלח здесь имеет обычное значение «послать, отправить»; «затем» естественно передаёт последовательность повествования, выраженную союзом וַ.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: одежду с длинными рукавами
  rationale: כְּתֹנֶת обозначает нательную одежду типа туники или длинной рубахи, а значение הַפַּסִּים спорно; вероятно, речь идёт об одежде, доходящей до кистей рук и, возможно, до ступней. Перевод не вводит традиционное, но лексически не доказанное указание на разноцветность; неопределённость отмечена в сноске.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: и доставили её своему отцу
  rationale: Местоимение «её» естественно восстанавливает прямое дополнение — упомянутую одежду. «Своему отцу» точно передаёт אֲבִיהֶם без добавления имени Иакова.
- source_word: זֹאת מָצָאנוּ
  choice: Вот что мы нашли
  rationale: Фраза звучит естественно по-русски и сохраняет нарочито простое, уклончивое заявление братьев.
- source_word: הַכֶּר נָא
  choice: Определи, пожалуйста
  rationale: В породе хифиль נכר означает «распознать, опознать, определить». «Определи» естественно вводит последующий косвенный вопрос; лексическое значение и повествовательный повтор корня пояснены в сноске.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: одежда ли это твоего сына или нет
  rationale: Сохраняется косвенный вопрос с אִם לֹא («ли… или нет») и отчуждённое выражение братьев «твоего сына», а не имя Иосифа.
