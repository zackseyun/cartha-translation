  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: ru
  text: 'Тот человек сказал: «Они ушли отсюда, потому что я слышал, как они говорили[a]: „Пойдём в Дофан[b]“». Иосиф пошёл вслед за своими братьями и нашёл их в Дофане.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слышал, как говорили». В еврейском тексте тот, кто говорил, прямо не назван, но из контекста ясно, что речь идёт о братьях Иосифа.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма названия снабжена окончанием направления — буквально: «по направлению к Дофану».'
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: ушли отсюда
  rationale: Глагол נסע может обозначать снятие с места и дальнейший путь. В данном контексте естественное русское «ушли отсюда» передаёт перемещение братьев, не добавляя прямо не названных подробностей о сворачивании лагеря.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание, по которому человек знает, куда направились братья.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: я слышал, как они говорили
  rationale: Причастная конструкция буквально не выражает местоименного дополнения, однако по контексту говорящие — братья Иосифа. Русская формулировка естественна и сохраняет оттенок услышанной речи; формальная альтернатива отмечена в сноске.
- source_word: נֵלְכָה
  choice: пойдём
  rationale: Когортатив первого лица множественного числа передаёт совместное побуждение или решение; «пойдём» естественно выражает его по-русски.
- source_word: דֹּתָיְנָה
  choice: в Дофан
  rationale: Направительный суффикс обозначает движение к месту. В основном тексте это естественно передано русским предлогом «в», а морфологическая особенность отмечена в сноске.
- source_word: אַחַר אֶחָיו
  choice: вслед за своими братьями
  rationale: Оборот обозначает следование за кем-либо; «вслед за» ясно передаёт пространственно-целевое значение без усиления до «преследовал».
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: нашёл их в Дофане
  rationale: מצא в повествовании имеет обычное значение «найти», а предлог ב у названия города естественно передаётся русским «в».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Тот человек» поддерживает связь с ранее упомянутым человеком; «Дофан» соответствует закрепившейся русской библейской форме имени. Кавычки оформлены по нормам русского языка.
