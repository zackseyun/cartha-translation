  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: ru
  text: А маданитяне[a] продали его в Египет Потифару, сановнику фараона[b], начальнику стражи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «маданитяне». По контексту рассказа и согласно древним переводам здесь их нередко понимают как мадианитян.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «евнуху фараона»; также возможно: «придворному фараона». Еврейское слово может обозначать как евнуха, так и царского чиновника.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «начальник над забойщиками». В царском окружении, вероятно, имеется в виду начальник стражи или телохранителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: А маданитяне
  rationale: Союз ו передан естественным для повествования «А». Этноним מְדָנִים формально означает «маданитяне»; отождествление с мадианитянами отмечено в сноске, поскольку контекст допускает, но не требует такого прочтения.
- source_word: מָכְרוּ אֹתוֹ
  choice: продали его
  rationale: Простое прошедшее время точно передаёт повествовательную форму глагола и прямое дополнение, относящееся к Иосифу.
- source_word: אֶל מִצְרָיִם
  choice: в Египет
  rationale: Предлог אֶל имеет направительное значение; русский оборот сохраняет представление о продаже Иосифа в Египет, хотя покупатель назван далее.
- source_word: לְפוֹטִיפַר
  choice: Потифару
  rationale: Дательный падеж естественно обозначает покупателя; имя передано традиционной русской формой.
- source_word: סְרִיס פַּרְעֹה
  choice: сановнику фараона
  rationale: Слово סָרִיס может обозначать как евнуха, так и высокопоставленного придворного. «Сановник» естественно передаёт должностной смысл, не утверждая без необходимости физическое состояние человека.
- source_word: שַׂר הַטַּבָּחִים
  choice: начальнику стражи
  rationale: В царском контексте выражение обозначает начальника служителей, исполнявших охранные и карательные функции; буквальный образ и возможное значение «телохранители» сохранены в сноске.
