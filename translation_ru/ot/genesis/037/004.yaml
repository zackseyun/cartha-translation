  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: ru
  text: Когда братья увидели, что отец любит его больше всех братьев, они возненавидели его и не могли говорить с ним мирно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не могли говорить с ним в мире», то есть не могли говорить с ним дружелюбно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Когда ... увидели
  rationale: Последовательная повествовательная форма продвигает рассказ, а придаточное с «когда» естественно передаёт временную связь между увиденным и последовавшей ненавистью.
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит содержание восприятия: братья увидели, что отец любит Иосифа больше.'
- source_word: אָהַב
  choice: любит
  rationale: Сохранено прямое значение обычного еврейского глагола «любить»; оттенок предпочтения выражен сравнительной конструкцией.
- source_word: אֲבִיהֶם
  choice: отец
  rationale: В русском контексте принадлежность ясна без местоимения «их»; речь идёт об общем отце братьев и Иосифа.
- source_word: מִכָּל אֶחָיו
  choice: больше, чем всех его братьев
  rationale: Формально сохраняет еврейское сравнение с כָּל и не добавляет отсутствующее в оригинале слово «остальных», хотя по смыслу оно подразумевается.
- source_word: וַיִּשְׂנְאוּ
  choice: они возненавидели
  rationale: Глагол прямо обозначает ненависть; совершенный вид по-русски естественно передаёт наступившую реакцию в повествовании.
- source_word: וְלֹא יָכְלוּ
  choice: и не могли
  rationale: Кратко и естественно передаёт выраженную в тексте неспособность.
- source_word: דַּבְּרוֹ
  choice: говорить с ним
  rationale: Русское «говорить с ним» естественно передаёт обращённую к Иосифу речь и межличностный характер выражения.
- source_word: לְשָׁלֹם
  choice: по-доброму
  rationale: В данном контексте שָׁלוֹם обозначает мирное, дружелюбное отношение; «по-доброму» звучит современно и понятно, не сводя смысл к отсутствию разговора.
