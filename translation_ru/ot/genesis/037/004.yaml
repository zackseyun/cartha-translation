  source_fidelity: 'Смысл передан в целом верно: братья видят предпочтительную любовь отца к Иосифу, ненавидят его и не способны говорить с ним мирно. Однако оборот «любит его больше, чем всех его братьев» в русском языке грамматически и семантически неудачен: его можно понять как сравнение с совокупностью всех братьев, а не как предпочтение Иосифа каждому из них.'
  naturalness: '«Больше всех братьев» — естественный литературный способ передать сравнительную конструкцию в данном контексте. «Не могли говорить с ним мирно» ближе к лексике שלום и сохраняет намеренную широту выражения: речь о невозможности дружелюбного, мирного общения, а не только о тоне отдельных слов.'
