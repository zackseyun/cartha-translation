base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: ru
  text: И прошли мимо мадианитяне — торговцы. Они вытянули Иосифа и подняли его из ямы, а затем продали Иосифа измаильтянам за двадцать серебряных монет[a]. И они привели Иосифа в Египет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за двадцать серебра»; единица веса или денежная единица в еврейском тексте не названа.'
    reason: lexical_alternative
  - marker: b
    text: После упоминания мадианитян и измаильтян еврейский текст употребляет глаголы во множественном числе («вытянули», «подняли», «продали», «привели»), не уточняя каждый раз, какая именно группа совершает действие.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: проходили мимо
  rationale: Глагол עבר в данной повествовательной форме обозначает движение мимо названного места; перевод не превращает это действие в простое прибытие.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: мадианитяне — торговцы
  rationale: Так естественно по-русски переданы и этническое обозначение, и характеристика людей как торговцев, без тяжеловесного буквального выражения «мадианитянские мужчины».
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ ... מִן הַבּוֹר
  choice: вытянули Иосифа и подняли его из ямы
  rationale: 'Сохранены два последовательных глагола еврейского текста: משך — «тянуть, вытягивать» и עלה в каузативном значении — «поднимать, выводить наверх».'
- source_word: הַבּוֹר
  choice: яма
  rationale: בור может означать яму или водосборную цистерну; «яма» соответствует непосредственному контексту и не сужает значение до специально устроенного резервуара.
- source_word: וַיִּמְכְּרוּ
  choice: продали
  rationale: Прямое и контекстуально однозначное значение глагола מכר.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: измаильтянам
  rationale: Сохранено явное указание еврейского текста на получателей при продаже.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: за двадцать серебряных монет
  rationale: Буквально сказано «за двадцать серебра», без названия единицы. В основном тексте выбрано понятное русское выражение, а отсутствие названной единицы отмечено в сноске.
- source_word: וַיָּבִיאוּ ... מִצְרָיְמָה
  choice: привели ... в Египет
  rationale: ביא выражает доставление человека к месту назначения, а направительный суффикс в מִצְרָיְמָה — движение в Египет; «привели» не предполагает не названного в тексте способа перевозки.
theological_decisions:
- issue: К кому относятся глаголы во множественном числе после упоминания мадианитян и измаильтян
  choice: Сохранить местоименное «они» и не уточнять группу действующих лиц
  alternative: Отнести все действия к мадианитянам либо продажу и доставление в Египет — к измаильтянам
  rationale: Еврейский текст употребляет формы множественного числа, но не повторяет названия группы при каждом действии. Перевод сохраняет эту референциальную неоднозначность и не вводит согласование повествования, которого нет в самом стихе.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Этнонимы переданы в общепринятой библейской форме; синтаксис сохраняет последовательность действий и исходную неоднозначность субъектов.
