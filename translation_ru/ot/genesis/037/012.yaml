lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Форма wayyiqtol от הלך продолжает последовательность событий повествования. «Пошли» естественно передаёт действие без добавления отсутствующего в еврейском тексте явного наречия времени.
- source_word: אֶחָיו
  choice: его братья
  rationale: Существительное с местоименным суффиксом означает «его братья»; в контексте речь идёт о братьях Иосифа.
- source_word: לִרְעוֹת
  choice: пасти
  rationale: Инфинитив от רעה выражает цель движения и обозначает выпас и присмотр за стадом. Русское «пасти» кратко и естественно передаёт это значение.
- source_word: אֶת
  choice: '[показатель прямого дополнения не переводится]'
  rationale: אֵת отмечает определённое прямое дополнение и самостоятельного соответствия в русском языке обычно не имеет.
- source_word: צֹאן
  choice: стадо
  rationale: צֹאן — собирательное обозначение мелкого домашнего скота, прежде всего овец и коз. «Стадо» сохраняет общее значение, не уточняя вид животных сверх источника.
- source_word: אֲבִיהֶם
  choice: своего отца
  rationale: Конструктивная форма с местоименным суффиксом выражает принадлежность. Возвратное «своего» естественно по-русски соотносит отца с подлежащим «братья».
- source_word: בִּשְׁכֶם
  choice: у Сихема
  rationale: Предлог ב может обозначать нахождение внутри места либо при нём, в его окрестностях. Для пастушеской обстановки естественно «у Сихема», при сохранении альтернативы в сноске.
