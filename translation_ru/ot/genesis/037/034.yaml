  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: ru
  text: Тогда Иаков разорвал свои одежды, опоясался вретищем[a] и много дней оплакивал своего сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вретище — грубая ткань, которую носили в знак скорби.
