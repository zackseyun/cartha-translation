lexical_decisions:
- source_word: וַיִּקְרַע
  choice: разорвал
  rationale: В контексте скорби глагол קרע обозначает ритуальное разрывание одежды; «разорвал» точно и естественно передаёт конкретное действие.
- source_word: שִׂמְלֹתָיו
  choice: на себе одежду
  rationale: שִׂמְלָה — общее обозначение одежды. Оборот «разорвал на себе одежду» естественен по-русски и ясно описывает знак скорби, не уточняя вид одежды.
- source_word: שַׂק
  choice: вретищем
  rationale: «Вретище» — устойчивое русское библейское обозначение грубой ткани, которую носили в знак скорби; оно сохраняет культурный и литературный оттенок исходного слова.
- source_word: בְּמָתְנָיו
  choice: обвязал бёдра
  rationale: מָתְנַיִם обозначает область чресел, бёдер или поясницы. «Обвязал бёдра» понятно современному читателю и передаёт способ ношения ткани без архаического «чресла».
- source_word: וַיִּתְאַבֵּל
  choice: оплакивал
  rationale: Форма Hitpael глагола אבל обозначает пребывание в трауре и совершение действий скорби. «Оплакивал» естественно выражает длительную скорбь по предполагаемо умершему сыну.
- source_word: עַל־בְּנוֹ
  choice: своего сына
  rationale: Предлог עַל при глаголе скорби по-русски естественно передаётся беспредложным дополнением при «оплакивал»; возвратное «своего» однозначно связывает сына с Иаковом.
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Буквальное и идиоматичное обозначение длительности, сохраняющее неопределённость исходного выражения.
