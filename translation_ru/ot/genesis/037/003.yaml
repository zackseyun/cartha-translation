  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: ru
  text: Израиль любил Иосифа больше всех своих сыновей, потому что тот был сыном его старости; и он сделал ему богато украшенную одежду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции, «разноцветную одежду». Значение еврейского выражения неясно: возможно, речь идёт о богато украшенной одежде или об одежде, доходившей до запястий и щиколоток, а не именно о её расцветке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя; начальный союз не выражен отдельно, поскольку в современном русском повествовании связь с контекстом ясна без «и».
- source_word: אָהַב
  choice: любил
  rationale: Передано обычное значение глагола «любить», без замены на истолковывающее «выделял» или «предпочитал».
- source_word: מִכָּל בָּנָיו
  choice: больше всех своих сыновей
  rationale: Конструкция с מִן имеет сравнительное значение; «сыновей» точно передаёт мужской род множественного числа.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину особой любви Израиля к Иосифу.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: тот был сыном его старости
  rationale: Сохранён образный еврейский оборот, связывающий Иосифа со старостью отца; местоимение «тот» устраняет возможную неясность русского «он».
- source_word: וְעָשָׂה לוֹ
  choice: и он сделал ему
  rationale: Прямо переданы действие Израиля и значение адресата в לוֹ.
- source_word: כְּתֹנֶת פַּסִּים
  choice: богато украшенную одежду
  rationale: Значение פַּסִּים спорно. Основной текст не сводит выражение ни к цветам, ни к длине рукавов; более конкретные традиционные и вероятные толкования вынесены в примечание.
