  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: ru
  text: Тогда они взяли одеяние Иосифа[a], закололи козла и обмакнули одеяние в кровь.
  philosophy: optimal-equivalence
  footnotes:
