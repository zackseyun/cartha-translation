lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Тогда они взяли
  rationale: Форма wayyiqtol продолжает последовательность событий; «тогда» естественно передаёт развитие повествования по-русски.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: одежду Иосифа
  rationale: כְּתֹנֶת обозначает длинную одежду типа рубахи или хитона. «Одежда» понятно современному читателю и не создаёт ложного образа современного пальто; более точные варианты отмечены в сноске.
- source_word: וַיִּשְׁחֲטוּ
  choice: закололи
  rationale: Глагол обозначает убой животного; «закололи» точно и естественно передаёт конкретный способ умерщвления в данном контексте.
- source_word: שְׂעִיר עִזִּים
  choice: козла
  rationale: Сочетание обозначает самца козы; русское «козёл» сохраняет указание на пол без избыточного пояснения.
- source_word: וַיִּטְבְּלוּ
  choice: обмакнули
  rationale: Глагол означает окунуть или погрузить в жидкость. «Обмакнули» естественно описывает действие с одеждой и не требует предполагать полное погружение.
- source_word: הַכֻּתֹּנֶת
  choice: одежду
  rationale: Повторено то же обозначение предмета, что и ранее, в соответствии с повтором в еврейском тексте.
- source_word: בַּדָּם
  choice: в кровь
  rationale: Предлог с определённым артиклем указывает на кровь только что заколотого козла; по-русски после «обмакнули» естественна конструкция «в кровь».
