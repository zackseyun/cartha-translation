lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Потом ему приснился ещё один сон
  rationale: Повествовательная форма продвигает рассказ, а сочетание עוֹד и אַחֵר подчёркивает повторение. Русское «ещё один сон» естественно передаёт этот смысл.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: Он рассказал его своим братьям
  rationale: Глагол סִפֵּר означает «рассказывать, пересказывать»; выбран ясный современный русский оборот.
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к сообщению и естественно передаётся в прямой речи словом «вот».
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: мне приснился ещё один сон
  rationale: Русская безличная конструкция идиоматична и сохраняет повтор ключевого слова «сон», не воспроизводя неестественно внутреннюю форму еврейского оборота.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: Второе הִנֵּה вводит картину сна; двоеточие естественно выполняет эту функцию по-русски, не утяжеляя фразу повторным «вот».
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: солнце, луна и одиннадцать звёзд
  rationale: Прямой и естественный перевод названий небесных светил и числа.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: поклонились мне
  rationale: В данном контексте глагол обозначает глубокий почтительный поклон и признание превосходства, а не богослужебное поклонение. Русский совершенный вид естественно описывает увиденное во сне событие; сноска сохраняет более буквальную альтернативу длительного действия.
theological_decisions:
- issue: Значение מִשְׁתַּחֲוִים в сне Иосифа
  choice: почтительный поклон («поклонились мне»)
  alternative: «простирались передо мной»; в иных контекстах — «поклонялись мне»
  rationale: Ближайший контекст говорит о семейном подчинении и почестях, позднее выраженных поклонами перед Иосифом, а не о богослужебном поклонении. Перевод не привносит отсутствующего в тексте утверждения о божественном статусе.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным ритмом. Повтор «ещё один сон» сохранён как значимый элемент еврейского текста; архаическое «се» не используется.
