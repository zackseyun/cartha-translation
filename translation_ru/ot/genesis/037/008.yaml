  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: ru
  text: 'Братья сказали ему: «Неужели ты будешь царствовать над нами? Неужели ты будешь властвовать над нами?» И они возненавидели его ещё сильнее за его сны и за его слова.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: Неужели ты будешь царствовать
  rationale: Сочетание вопросительной частицы с абсолютным инфинитивом и личной формой глагола передаёт резкий, недоверчивый вопрос с усилением; «неужели» естественно выражает это по-русски, а «царствовать» сохраняет царскую семантику מלך.
- source_word: אִם מָשׁוֹל תִּמְשֹׁל
  choice: Неужели ты будешь властвовать
  rationale: В данном параллельном вопросе אִם вводит усиливающую альтернативную формулировку, а конструкция с абсолютным инфинитивом подчёркивает глагол. «Властвовать» сохраняет отличие משל от предшествующего «царствовать».
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: И они возненавидели его ещё сильнее
  rationale: Идиома буквально означает, что они прибавили ещё ненависти к нему; выбранная формулировка естественно и точно передаёт усиление уже существующей ненависти.
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: за его сны и за его слова
  rationale: Предлог עַל здесь выражает причину. Повтор «за его» сохраняет параллелизм и относит «слова» к тому, что Иосиф говорил, не сужая значение до одного конкретного рассказа.
theological_decisions:
- issue: Характер вопросов братьев о будущем господстве Иосифа
  choice: Сохранены два риторических вопроса с оттенком возмущённого неверия
  alternative: Передать как нейтральное уточнение или как категорическое утверждение, что Иосиф не будет править
  rationale: Еврейский текст выражает насмешливое и возмущённое недоверие, однако грамматически остаётся вопросом; перевод не превращает его в богословски предрешённое отрицание.
- issue: Различие между מלך и משל
  choice: «царствовать» и «властвовать»
  alternative: Дважды «править»
  rationale: Различие лексем сохранено без попытки приписать им две строго разграниченные формы власти, которых контекст явно не определяет.
translation_notes:
  register: Современный литературный русский язык; речь братьев звучит резко и естественно, при этом сохранены повтор, параллелизм и различие двух еврейских глаголов власти.
