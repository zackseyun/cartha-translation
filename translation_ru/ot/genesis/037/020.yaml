  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: ru
  text: 'Итак, пойдём, убьём его и бросим в одну из ям[a], а потом скажем: «Его съел дикий зверь[b]». Тогда и увидим, что станет с его снами!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одну из водосборных ям». Еврейское слово может обозначать яму или высеченную цистерну для сбора воды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «злой (или опасный) зверь съел его»; также возможно: «хищный зверь пожрал его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт связующую и побудительную функцию сочетания, вводящего немедленное предложение братьев; временное значение раскрывается последующим призывом.
- source_word: לְכוּ
  choice: пойдём
  rationale: Форма служит идиоматическим побуждением к совместному действию. Русское «пойдём» естественно вводит дальнейшие глаголы первого лица множественного числа.
- source_word: וְנַהַרְגֵהוּ
  choice: убьём его
  rationale: Когортатив выражает предложение совместного действия; в сочетании с «пойдём» русская форма будущего времени имеет побудительную силу.
- source_word: וְנַשְׁלִכֵהוּ
  choice: и бросим
  rationale: Сохраняет прямое значение глагола и последовательность задуманного действия.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: в одну из ям
  rationale: בּוֹר обозначает яму или водосборную цистерну. Общее «яма» ясно в ближайшем контексте и не устраняет более конкретную возможность, отмеченную в сноске.
- source_word: וְאָמַרְנוּ
  choice: а потом скажем
  rationale: Передаёт следующий этап замысла; «потом» естественно выражает последовательность, а «а» отмечает переход к вымышленному объяснению.
- source_word: חַיָּה רָעָה
  choice: дикий зверь
  rationale: В данном контексте сочетание обозначает опасного зверя. Русское выражение естественно и не перегружено дополнительной оценочной лексикой.
- source_word: אֲכָלָתְהוּ
  choice: растерзал
  rationale: Хотя буквальное значение — «съел», в русском рассказе о гибели человека от дикого зверя «растерзал» естественно передаёт результат нападения и соответствует контексту.
- source_word: וְנִרְאֶה
  choice: Тогда и увидим
  rationale: Сохраняет возможную оттенённость между будущим и побуждением и передаёт насмешливое ожидание результата.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: что станет с его снами
  rationale: Идиоматично передаёт вопрос о том, осуществятся ли и к чему приведут сны Иосифа, не объясняя их смысл сверх текста.
theological_decisions:
- issue: Насмешливый вызов пророческому значению снов Иосифа
  choice: «Тогда и увидим, что станет с его снами!»
  alternative: «И увидим, какими будут его сны»
  rationale: Выбранный вариант передаёт естественный смысл угрозы и насмешки, сохраняя напряжение между человеческим замыслом братьев и возможным исполнением снов, но не добавляя явного богословского комментария.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Краткие формы будущего времени после «пойдём» естественно передают совместное побуждение; финальное восклицание подчёркивает содержащуюся в речи братьев насмешку.
