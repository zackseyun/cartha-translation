  source_fidelity: 'Основная смысловая последовательность передана верно: совместное предложение убить Иосифа, бросить его в одну из ям, выдать это за нападение зверя и насмешливо «увидеть», что будет со снами. Однако «растерзал» не является значением אֲכָלָתְהוּ («съел, пожрал»): оно добавляет способ смерти, не выраженный глаголом оригинала. Исправление на «съел» сохраняет и лексику, и намеренно сфабрикованное объяснение братьев.'
  naturalness: Исправленный текст сохраняет современный литературный и естественный русский синтаксис. «Итак, пойдём, убьём…» передаёт побудительный характер реплики; «что станет с его снами» — естественный русский эквивалент насмешливого вопроса о будущем снов.
  terminology: «Яма» корректно сохраняет широкое значение בּוֹר; альтернатива «водосборная яма / цистерна» уместна в сноске. «Дикий зверь» — естественное основное соответствие חַיָּה רָעָה, а сноска отмечает оттенок опасности/враждебности. Сноска b перенесена к полному утверждению, поскольку она относится как к словосочетанию о звере, так и к глаголу «съел».
