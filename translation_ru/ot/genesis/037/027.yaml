lexical_decisions:
- source_word: לְכוּ
  choice: Пойдём
  rationale: Форма повелительного наклонения множественного числа употреблена как побуждение к совместному действию; «Пойдём» естественно вводит предложение Иуды.
- source_word: וְנִמְכְּרֶנּוּ
  choice: продадим его
  rationale: Когортативная форма выражает предложение; в сочетании с «Пойдём» русское будущее совершенного вида естественно передаёт значение «давайте продадим».
- source_word: לַיִּשְׁמְעֵאלִים
  choice: измаильтянам
  rationale: Общепринятое русское обозначение потомков Измаила; дательный падеж передаёт направление сделки.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: а сами не поднимем на него руки
  rationale: Еврейское «пусть наша рука не будет на нём» — образное запрещение прямого насилия. Русская идиома сохраняет образ руки и звучит естественно.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предложения; «ведь» естественно передаёт мотивировку в прямой речи.
- source_word: אָחִינוּ
  choice: наш брат
  rationale: Прямо сохраняет конкретное родственное обозначение.
- source_word: בְשָׂרֵנוּ
  choice: наша плоть
  rationale: Сохраняет конкретный еврейский образ кровного родства, не заменяя его истолкованием.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: И братья послушались его
  rationale: שמע здесь означает не только услышать, но и внять предложению; «послушались» передаёт контекстуальный результат, не устраняя возможный оттенок согласия.
