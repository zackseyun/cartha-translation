base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: ru
  text: И вот, мы вязали снопы посреди поля. И вот, мой сноп поднялся и встал прямо. И вот, ваши снопы окружили[a] мой сноп и поклонились[b] ему».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обступили»; еврейский глагол означает движение или поворот вокруг.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «простёрлись ниц перед ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот ... И вот ... И вот
  rationale: Повтор передаёт живость и последовательность рассказа о сне; «вот» естественно для современного литературного русского и сохраняет повтор исходного текста.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: вязали снопы
  rationale: Глагол и однокоренное существительное обозначают связывание хлебных стеблей в снопы; это краткое и естественное русское выражение сохраняет земледельческий образ.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: посреди поля
  rationale: Передаёт пространственное значение בְּתוֹךְ точнее, чем простое «в поле», и звучит естественно.
- source_word: קָמָה
  choice: поднялся
  rationale: Глагол описывает движение снопа вверх и подготавливает последующее указание на его устойчивое вертикальное положение.
- source_word: וְגַם נִצָּבָה
  choice: и встал прямо
  rationale: Передаёт добавочное действие и значение устойчивого, вертикального положения; русское «встал прямо» применительно к снопу ясно и образно.
- source_word: תְסֻבֶּינָה
  choice: окружили его
  rationale: Глагол означает поворот или движение вокруг; в данном контексте «окружили» естественно выражает расположение снопов вокруг снопа Иосифа. Местоимение «его» делает объект окружения явным по-русски, не меняя смысла.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: поклонились
  rationale: Нейтрально передаёт телесный жест склонения перед кем-либо, не навязывая политического или культового толкования.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: мой сноп / ваши снопы
  rationale: Последовательный перевод сохраняет сельскохозяйственный образ и символическое противопоставление.
theological_decisions:
- issue: Значение поклонения снопов
  choice: поклонились
  alternative: простёрлись ниц перед
  rationale: Исходный глагол допускает более сильный образ простирания ниц, но сам стих не требует заранее уточнять характер будущего подчинения братьев; нейтральный перевод сохраняет смысл и напряжение повествования.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Трёхкратное «И вот» и короткие предложения сохраняют наглядность, повтор и ступенчатое развитие сна без архаического «се».
