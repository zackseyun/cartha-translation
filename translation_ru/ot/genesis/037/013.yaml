base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: ru
  text: 'И сказал Израиль Иосифу: «Разве не твои братья пасут скот в Сихеме?[a] Пойди, я пошлю тебя к ним». Он ответил ему: «Вот я».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасут стада» или «ухаживают за стадами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: В еврейском тексте употреблено имя Израиль, а не Иаков; оно сохранено в основном тексте.
- source_word: הֲלוֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: אַחֶיךָ
  choice: твои братья
  rationale: Точно передаёт существительное во множественном числе с суффиксом 2-го лица мужского рода единственного числа.
- source_word: רֹעִים
  choice: пасут стада
  rationale: Причастие от רעה обозначает уход за скотом или выпас; в контексте братьев Иосифа естественное русское выражение — «пасут стада».
- source_word: בִּשְׁכֶם
  choice: в Сихеме
  rationale: Предлог ב обозначает местонахождение; «в Сихеме» — обычное русское оформление названия города.
- source_word: לְכָה
  choice: Пойди
  rationale: В данном контексте отец отправляет Иосифа от себя к находящимся в другом месте братьям, поэтому русское «пойди» естественно передаёт повеление, не усиливая его.
- source_word: וְאֶשְׁלָחֲךָ
  choice: я пошлю тебя
  rationale: Передаёт форму первого лица и последовательность поручения; союз в русском можно не воспроизводить буквально после «пойди».
- source_word: אֲלֵיהֶם
  choice: к ним
  rationale: Сохраняет местоименную отсылку к братьям без ненужного повтора.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Сохраняет краткую древнееврейскую формулу готовности и присутствия; вариант «Я готов» был бы более толковательным.
