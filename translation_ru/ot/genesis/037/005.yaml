lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: Иосифу приснился сон
  rationale: 'Еврейская конструкция буквально повторяет однокоренные глагол и существительное: «Иосиф увидел/снился сон». По-русски естественная конструкция «ему приснился сон» точно передаёт событие, а буквальный повтор был бы неестественным.'
- source_word: וַיַּגֵּד
  choice: рассказал его
  rationale: Глагол נגד в данной повествовательной форме означает «рассказать, сообщить, сделать известным». Местоимение «его» отсылает к только что упомянутому сну.
- source_word: לְאֶחָיו
  choice: своим братьям
  rationale: 'Предлог לְ и существительное с притяжательным суффиксом прямо обозначают адресатов: его братьев. Русское «своим» естественно соотносит их с подлежащим.'
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: После этого они возненавидели его ещё больше
  rationale: 'Сочетание יסף с עוד и инфинитивом выражает усиление уже существующей ненависти: они стали ненавидеть его ещё сильнее. «После этого» естественно передаёт последовательность, выраженную повествовательным וַ, не утверждая, что сон был единственной причиной.'
