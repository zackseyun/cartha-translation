base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: ru
  text: 'Тогда все его сыновья и все его дочери поднялись, чтобы утешить его, но он не хотел принимать утешения и сказал: «Ибо я сойду к сыну моему в шеол[a], скорбя». И отец его плакал о нём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — древнееврейское обозначение мира мёртвых; иногда переводится как «могила».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: пришли
  rationale: В сочетании с инфинитивом цели обычный повествовательный глагол קום обозначает начало действия; по-русски естественно передать приход утешающих без буквального, но здесь тяжеловесного «встали».
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: все его сыновья и все его дочери
  rationale: Сохранено явное различение сыновей и дочерей в еврейском тексте.
- source_word: לְנַחֲמוֹ
  choice: утешать его
  rationale: Порода пиэль глагола נחם здесь означает утешение человека, переживающего утрату.
- source_word: וַיְמָאֵן לְהִתְנַחֵם
  choice: он не хотел утешиться
  rationale: Передаёт упорное нежелание Иакова принять утешение и сохраняет лексическую связь двух форм корня נחם.
- source_word: כִּי
  choice: Нет
  rationale: В прямой речи частица подчёркивает противопоставление отказа последующему решению; русское «Нет» естественно передаёт этот утвердительно-противительный оттенок.
- source_word: אֵרֵד אֶל־בְּנִי אָבֵל
  choice: скорбя, сойду я к сыну моему
  rationale: Сохраняются образ нисхождения, направление «к сыну» и состояние продолжающейся скорби; порядок слов остаётся выразительным и естественным для торжественной русской прозы.
- source_word: שְׁאֹלָה
  choice: в шеол
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не сужает его значение до физической могилы.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: И отец его оплакивал его
  rationale: 'Местоимения намеренно сохранены: отец Иосифа, Иаков, продолжал оплакивать сына. Несовершенный вид естественно выражает длительную скорбь.'
theological_decisions:
- issue: Значение שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация не сводит понятие к месту погребения и не привносит в текст более поздние, подробно разработанные представления о загробной участи.
- issue: Связь выражений «к сыну моему» и «в шеол»
  choice: 'сохранены оба направления: «к сыну моему в шеол»'
  alternative: «сойду в шеол, скорбя о сыне моём»
  rationale: Еврейский אֶל־בְּנִי естественно означает «к моему сыну»; перевод не заменяет эту мысль более однозначным указанием на предмет скорби.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной инверсией внутри прямой речи. Термин «шеол» дан со строчной буквы как обозначение мира мёртвых, а не имя собственное. Формулировка сохраняет сжатость, скорбный тон и смысловую напряжённость оригинала.
