  verdict: revise
  source_fidelity: 'В черновике существенно ослаблен וַיָּקֻמוּ («поднялись/встали») до «пришли», а כִּי ошибочно передано репликой «Нет»: частица вводит объяснение отказа («ибо»). Заключительный глагол וַיֵּבְךְּ — простое повествовательное «плакал/заплакал», не обязательно длительное «оплакивал». Исправленный текст сохраняет оба направления в словах Иакова («к сыну моему» и «в шеол») и не снимает их смыслового напряжения.'
  naturalness: «Поднялись, чтобы утешить его» — естественная литературная передача повествовательного еврейского оборота. «Не хотел принимать утешения» звучит по-современному и точно выражает отказ. Порядок «сойду к сыну моему в шеол, скорбя» ясен и не создаёт тяжёлой цепочки предлогов.
  terminology: '«Шеол» уместно сохранять как транслитерацию со строчной буквы. Сноска корректно даёт «могилу» лишь как возможный вариант, не отождествляя безоговорочно шеол с могилой. В последней фразе «отец его» следует оставить, как в оригинале: речь идёт об отце Иакова, однако русский текст, подобно еврейскому, выражает это местоименной связью.'
