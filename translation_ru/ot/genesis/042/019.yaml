  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: ru
  text: Если вы честные люди[a], пусть один из ваших братьев останется под стражей там, где вас держат[b], а вы ступайте и отнесите зерно своим голодающим домочадцам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если вы правдивы». Еврейское слово может характеризовать людей как честных или говорящих правду.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в доме вашего содержания под стражей».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «зерно для голода ваших домов». Под «домами» здесь подразумеваются домочадцы.'
    reason: source_ambiguity
lexical_decisions:
- source_word: כֵּנִים
  choice: честные люди
  rationale: Прилагательное указывает на правдивость и добросовестность братьев в контексте допроса. «Честные люди» естественно по-русски и сохраняет личностную характеристику, подразумеваемую формой множественного числа.
- source_word: אֲחִיכֶם אֶחָד
  choice: один из ваших братьев
  rationale: Передаёт выделение одного человека из числа братьев и звучит естественно на современном русском языке.
- source_word: יֵאָסֵר
  choice: останется под стражей
  rationale: Форма от אסר допускает значения связывания и заключения. В данном контексте речь прежде всего об удержании под стражей; перевод не утверждает, что брата непременно свяжут физически.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: там, где держали вас
  rationale: Буквально выражение означает «в доме вашего содержания под стражей». Контекстуальная формулировка ясно показывает, что один брат должен остаться в том месте заключения, где до этого находились все они.
- source_word: וְאַתֶּם לְכוּ
  choice: а вы ступайте
  rationale: «А вы» сохраняет подчёркнутое противопоставление одного остающегося брата остальным; «ступайте» передаёт повелительное לְכוּ естественно и достойно.
- source_word: הָבִיאוּ
  choice: отнесите
  rationale: Глагол בוא в породе Hiphil обозначает перенос или доставку. С точки зрения находящегося в Египте Иосифа буквальным соответствием было бы «принесите», однако по-русски при движении братьев домой естественнее «отнесите».
- source_word: שֶׁבֶר
  choice: зерно
  rationale: В повествовании об Иосифе существительное обозначает зерно, приобретаемое во время голода, а не пищу вообще.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: своим голодающим домашним
  rationale: Необычное сочетание буквально говорит о «голоде ваших домов». Перевод естественно выражает назначение зерна и понимает «дома» как живущих в них домочадцев, не ограничивая смысл только ближайшей семьёй.
