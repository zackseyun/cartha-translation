  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: ru
  text: 'На третий день Иосиф сказал им: «Сделайте это — и живите[a], ведь я боюсь Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сделайте это, и останетесь живы»; еврейская конструкция допускает как второе прямое повеление, так и указание на результат исполнения первого.'
    reason: Лексико-синтаксическая неоднозначность формы וִחְיוּ.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: сказал им
  rationale: Обычная повествовательная форма глагола אמר с предложным дополнением; естественно вводит прямую речь по-русски.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Стандартная русская передача еврейского обстоятельства времени.
- source_word: זֹאת עֲשׂוּ
  choice: Сделайте это
  rationale: Точно и естественно передаёт указательное местоимение и повелительную форму множественного числа.
- source_word: וִחְיוּ
  choice: и живите
  rationale: Компактная повелительная конструкция сохраняет возможность понимать вторую форму и как призыв жить, и как следствие исполнения первого повеления.
- source_word: אֶת הָאֱלֹהִים
  choice: Бога
  rationale: В данном контексте определённая форма הָאֱלֹהִים обозначает Бога; русская форма винительного падежа естественна после «боюсь».
- source_word: אֲנִי יָרֵא
  choice: я боюсь
  rationale: Местоимение с причастной формой выражает устойчивое благоговение Иосифа; настоящее время естественно передаёт этот смысл.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
theological_decisions:
- issue: Смысл исповедания אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: Иосиф ссылается на свой страх перед Богом как на основание предлагаемого им справедливого решения.
  alternative: Иосиф говорит лишь об общем почтении к божеству в контексте египетского двора.
  rationale: Контекст Бытия связывает Иосифа с Богом его отцов, но основной текст не добавляет отсутствующего в еврейском оригинале пояснения и тем самым не устраняет возможную контекстуальную напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной библейского повествования прямой речью. Тире помогает передать тесную связь между повелением и его возможным следствием, не устраняя неоднозначности оригинала.
