  - marker: b
    text: 'Возможно также: «мы не занимались шпионажем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: И мы сказали
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» естественно сохраняет связь с предшествующим рассказом.
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог אֶל с местоименным суффиксом 3-го лица мужского рода единственного числа прямо означает адресата речи.
- source_word: כֵּנִים
  choice: честные люди
  rationale: В данном контексте слово характеризует братьев как прямодушных и заслуживающих доверия, в противоположность обвинению в шпионаже. Выражение «честные люди» естественно для современного русского языка.
- source_word: אֲנָחְנוּ
  choice: мы
  rationale: Самостоятельное личное местоимение выделяет говорящих; в русском это адекватно передаётся явным подлежащим «мы».
- source_word: לֹא הָיִינוּ
  choice: мы не были
  rationale: Отрицательная форма היה с причастием описывает отрицаемое состояние или деятельность в прошлом; «мы не были» сохраняет форму самооправдания без добавления временного оттенка, отсутствующего в контексте.
- source_word: מְרַגְּלִים
  choice: шпионами
  rationale: Причастие от רגל здесь обозначает людей, действующих как разведчики или шпионы. «Шпионы» — ясное и современное соответствие в контексте обвинения.
