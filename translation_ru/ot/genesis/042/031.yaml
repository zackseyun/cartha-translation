  yaml_path: translation/ot/genesis/042/031.yaml
  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: ru
  text: 'И мы сказали ему: «Мы честные люди[a], мы не были шпионами[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди прямодушные»; также возможно: «люди правдивые».'
