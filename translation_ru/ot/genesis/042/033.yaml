  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: ru
  text: 'Тогда тот человек, господин страны, сказал нам: «По этому я узнаю, что вы честные люди: оставьте у меня одного из ваших братьев, возьмите зерно на время голода в ваших семьях[a] и идите».'
