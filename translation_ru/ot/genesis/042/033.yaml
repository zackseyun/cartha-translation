lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: тот человек, владыка этой земли
  rationale: הָאִישׁ передано обычным словом «человек», а אֲדֹנֵי הָאָרֶץ — приложением, обозначающим высокую власть над страной. «Владыка» сохраняет достоинство и силу титула, не придавая ему значения личного хозяина.
- source_word: בְּזֹאת אֵדַע
  choice: Вот как я узнаю
  rationale: Сочетание указывает на критерий или способ проверки; русская конструкция естественно передаёт будущий результат, зависящий от последующих действий.
- source_word: כֵנִים
  choice: честные люди
  rationale: В повествовании слово характеризует братьев как людей прямых и правдивых, а не лазутчиков; «честные» естественно передаёт этот общественно-судебный оттенок.
- source_word: אֲחִיכֶם הָאֶחָד הַנִּיחוּ אִתִּי
  choice: оставьте у меня одного из ваших братьев
  rationale: Еврейская фраза выделяет одного брата из группы, а Hiphil הַנִּיחוּ означает позволить ему остаться или оставить его.
- source_word: וְאֶת רַעֲבוֹן בָּתֵּיכֶם קְחוּ
  choice: возьмите зерно для голодающих семей
  rationale: Буквально объектом глагола выступает «голод ваших домов», но выражение эллиптическое. В контексте покупки хлеба подразумевается зерно, необходимое семьям во время голода.
- source_word: וָלֵכוּ
  choice: и ступайте
  rationale: Императив завершает последовательность распоряжений. «Ступайте» звучит естественно и достойно, сохраняя прямую повелительную силу.
