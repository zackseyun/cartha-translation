  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: ru
  text: 'Но они ответили ему: «Нет, господин мой! Твои слуги пришли купить пищу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зерно». В еврейском тексте буквально сказано «пищу», хотя в условиях голода, вероятно, имеется в виду зерно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Но они ответили ему
  rationale: Глагол буквально означает «сказали», однако в контексте непосредственного возражения естественное русское «ответили» точно передаёт функцию реплики; «но» выражает контраст с обвинением Иосифа.
- source_word: לֹא
  choice: Нет
  rationale: Самостоятельное отрицание служит решительным опровержением обвинения и естественно передаётся русским «Нет».
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Уважительное обращение к высокопоставленному египетскому правителю; этот порядок слов сохраняет почтительность и возвышенность речи.
- source_word: וַעֲבָדֶיךָ
  choice: Твои слуги
  rationale: В данном придворном самоназвании עֶבֶד выражает подчинённость и почтительность, а не обязательно рабский статус.
- source_word: בָּאוּ
  choice: пришли
  rationale: Русское прошедшее время естественно обозначает совершённое прибытие, цель которого сообщается далее.
- source_word: לִשְׁבָּר
  choice: купить
  rationale: В контексте египетских запасов во время голода глагол означает приобретение продовольствия за плату.
- source_word: אֹכֶל
  choice: пищу
  rationale: Еврейское слово имеет общее значение «пища, еда»; контекст указывает прежде всего на зерно, но основной текст не должен без необходимости сужать значение.
