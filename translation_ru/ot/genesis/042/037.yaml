base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: ru
  text: 'Тогда Рувим сказал своему отцу: «Предай смерти двух моих сыновей, если я не приведу его обратно к тебе. Доверь его мне[a], и я сам верну его к тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Дай его на мою руку».'
    reason: Сноска сохраняет конкретный еврейский образ, лежащий в основе идиоматического перевода «Доверь его мне».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему речевому действию.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Использована традиционная русская форма библейского имени.
- source_word: אֶל אָבִיו
  choice: своему отцу
  rationale: Возвратное притяжательное местоимение естественно для современного русского языка и однозначно указывает на отца Рувима.
- source_word: לֵאמֹר
  choice: не передано отдельно
  rationale: В русском языке формула введения прямой речи уже выражена глаголом «сказал» и двоеточием.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: Можешь предать смерти двух моих сыновей
  rationale: Каузативная форма глагола מות означает причинить смерть. Модальная конструкция передаёт смысл крайнего залога Рувима, не превращая форму в безусловный приказ.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: если я не приведу его обратно к тебе
  rationale: Сохранено условие с отрицанием; «обратно» проясняет подразумеваемое контекстом возвращение Вениамина к отцу.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: Доверь его мне
  rationale: Еврейский образ «дать на мою руку» идиоматически означает передать под ответственность или попечение; буквальный образ отмечен в сноске.
- source_word: וַאֲנִי
  choice: и я сам
  rationale: Самостоятельное местоимение אֲנִי несёт эмфатическое ударение, переданное словом «сам».
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: возвращу его к тебе
  rationale: Каузатив глагола שוב означает заставить вернуться, то есть вернуть; выбран естественный русский эквивалент.
