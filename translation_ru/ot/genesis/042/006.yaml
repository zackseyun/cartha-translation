  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: ru
  text: Иосиф был правителем страны; именно он продавал зерно всему её народу. Братья Иосифа пришли и пали перед ним ниц[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонились ему до земли». Еврейский глагол может обозначать глубокий поклон или простирание перед кем-либо в знак почтения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: правителем
  rationale: Слово обозначает человека, облечённого властью. «Правитель» естественно передаёт высокий статус Иосифа, не приписывая ему более конкретной должности.
- source_word: עַל הָאָרֶץ
  choice: этой земли
  rationale: В данном повествовательном контексте אֶרֶץ означает страну, находящуюся под властью Иосифа, то есть Египет, а не всю землю или мир.
- source_word: הַמַּשְׁבִּיר
  choice: продавал зерно
  rationale: Причастие породы Hifil от שׁבר в контексте голода означает продажу зерна. Дополнение «зерно» ясно из контекста и необходимо для естественного русского выражения.
- source_word: לְכָל עַם הָאָרֶץ
  choice: всему народу страны
  rationale: Собирательное עַם передано единственным числом «народ», а הָאָרֶץ — словом «страна», чтобы избежать ошибочного глобального смысла.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: поклонились ему
  rationale: Глагол обозначает глубокий поклон или простирание в знак почтения и подчинения. «Поклонились» не привносит отсутствующего здесь значения религиозного поклонения.
- source_word: אַפַּיִם אָרְצָה
  choice: до земли
  rationale: Еврейская идиома буквально описывает положение лицом к земле. Русское «поклонились до земли» естественно передаёт глубину и направленность жеста.
- source_word: וְיוֹסֵף
  choice: Иосиф
  rationale: Начальный союз выполняет обычную связующую повествовательную функцию; отдельное «и» в начале русского предложения не требуется для передачи смысла.
theological_decisions:
- issue: Характер поклона братьев перед Иосифом
  choice: поклонились ему до земли
  alternative: простёрлись перед ним ниц; поклонились ему как правителю
  rationale: Контекст изображает телесный жест почтения и подчинения, связанный с исполнением прежних снов Иосифа, но не называет этот жест богопоклонением. Перевод сохраняет физический и общественный смысл, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Повтор «земли… страны» слегка разграничивает территорию власти Иосифа и население страны, избегая двусмысленного впечатления, будто речь идёт обо всём мире.
