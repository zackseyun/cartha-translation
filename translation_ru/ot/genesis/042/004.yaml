  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: ru
  text: 'Но Вениамина, брата Иосифа, Иаков не послал с его братьями, потому что сказал: «Как бы с ним не случилось несчастья».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как бы его не постигла беда».'
    reason: Лексико-стилистическая альтернатива для פֶּן יִקְרָאֶנּוּ אָסוֹן, сохраняющая оттенок опасения и более сильное значение אָסוֹן.
lexical_decisions:
- source_word: וְ/אֶת
  choice: Но
  rationale: 'Союз ו связывает стих с предыдущим и в контексте выражает контраст: остальные сыновья отправились, а Вениамин — нет; показатель прямого дополнения אֶת отдельно не переводится.'
- source_word: בִּנְיָמִין
  choice: Вениамина
  rationale: Традиционная русская форма личного имени, поставленная в винительном падеже по синтаксису предложения.
- source_word: אֲחִי יוֹסֵף
  choice: брата Иосифа
  rationale: Естественно передаёт определительную конструкцию и особо соотносит Вениамина с Иосифом.
- source_word: לֹא שָׁלַח
  choice: не послал
  rationale: Прямое и естественное соответствие глаголу שׁלח в повествовательном контексте.
- source_word: אֶת אֶחָיו
  choice: с его братьями
  rationale: По смыслу Вениамин не был послан вместе со своими братьями; предлог «с» естественно выражает совместность, подразумеваемую контекстом.
- source_word: כִּי אָמַר
  choice: потому что сказал
  rationale: כִּי вводит причину решения Иакова, а «сказал» сохраняет прямое значение אָמַר, не заменяя его толкованием «подумал».
- source_word: פֶּן
  choice: Как бы не
  rationale: Современная и естественная русская конструкция, выражающая опасение и нежелательную возможность.
- source_word: יִקְרָאֶנּוּ
  choice: не случилось с ним
  rationale: 'Передаёт идиоматическое значение: несчастье может произойти с человеком.'
- source_word: אָסוֹן
  choice: несчастье
  rationale: Сохраняет широкий смысл серьёзной беды или пагубного происшествия, не уточняя его характера.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Реплика Иакова передана естественной конструкцией опасения «как бы не», без архаичного «дабы не» и без конкретизации вида бедствия.
