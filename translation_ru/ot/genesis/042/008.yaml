- source_word: וַיַּכֵּר
  choice: узнал
  rationale: В данном контексте порода хифиль глагола נכר означает распознать ранее знакомого человека. «Узнал» — естественный современный русский эквивалент.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: אֶת־אֶחָיו
  choice: своих братьев
  rationale: Существительное אָח во множественном числе с суффиксом 3-го лица мужского рода указывает здесь именно на братьев Иосифа; «своих» естественно передаёт принадлежность при подлежащем «Иосиф».
- source_word: וְהֵם
  choice: а они
  rationale: Союз ו здесь выражает противопоставление между тем, что Иосиф узнал братьев, и тем, что они его не узнали. «А они» сохраняет контраст без излишнего усиления.
- source_word: לֹא הִכִּרֻהוּ
  choice: его не узнали
  rationale: Повтор глагола נכר передан тем же русским глаголом «узнать», что сохраняет структуру и повествовательную иронию еврейского текста; суффикс объекта передан местоимением «его».
