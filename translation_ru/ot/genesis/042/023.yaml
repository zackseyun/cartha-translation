  text: וְ/הֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַ/מֵּלִ֖יץ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: ru
  text: Но они не знали, что Иосиф понимает их речь[a], потому что между ними был переводчик.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слышит» или «слушает»; по смыслу — понимает то, что они говорят.'
    reason: Сноска сохраняет буквальное значение שֹׁמֵעַ и одновременно поясняет его контекстуальный смысл.
lexical_decisions:
- source_word: וְהֵם
  choice: Но они
  rationale: Союз с явным местоимением создаёт контраст с предшествующим повествованием; «Но они» естественно передаёт его по-русски.
- source_word: לֹא יָדְעוּ
  choice: не знали
  rationale: Прямо и точно передаёт отсутствие знания.
- source_word: כִּי
  choice: что
  rationale: Первое כִּי вводит содержание того, чего братья не знали.
- source_word: שֹׁמֵעַ
  choice: понимает их речь
  rationale: Буквально причастие означает «слышит/слушает», но в данном контексте речь идёт о способности Иосифа понимать сказанное братьями; дополнение «их речь» делает этот смысл естественным и не создаёт ложного впечатления, будто они не замечали самого факта его присутствия.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная русская форма библейского имени.
- source_word: כִּי
  choice: потому что
  rationale: Второе כִּי указывает причину, по которой братья не знали, что Иосиф их понимает.
- source_word: הַמֵּלִיץ
  choice: переводчик
  rationale: В контексте общения на разных языках слово обозначает посредника, переводившего речь между сторонами.
- source_word: בֵּינֹתָם
  choice: между ними
  rationale: Сохраняет образ посредника, находящегося между Иосифом и братьями.
