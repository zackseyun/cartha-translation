  to: 'И они сказали: «Мы, рабы твои, — двенадцать братьев, сыновья одного человека, живущего в земле Ханаанской. Вот, самый младший сегодня с нашим отцом, а одного нет[a]».'
  rationale: Исправления точнее передают превосходное значение «самый младший», прямое временное значение «сегодня» и эвфемистическую открытость заключительного выражения. Сноска сохранена на той же фразе и поясняет, не разрешая, её возможный смысл.
