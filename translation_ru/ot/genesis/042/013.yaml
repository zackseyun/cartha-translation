source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: ru
  text: 'И они сказали: «Мы, рабы твои, — двенадцать братьев, сыновья одного человека, живущего в земле Ханаанской. Вот, самый младший сегодня с нашим отцом, а одного нет[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а одного нет»; это эвфемистическое выражение может означать, что он пропал, или подразумевать его смерть.'
    reason: Сохраняет лексическую неоднозначность еврейского אֵינֶנּוּ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И они сказали
  rationale: Сохраняет обычное повествовательное продолжение wayyiqtol без излишнего уточнения временной последовательности.
- source_word: עֲבָדֶיךָ
  choice: рабов твоих
  rationale: Это почтительное самоуничижение перед египетским правителем, а не утверждение о буквальном рабском положении; традиционная русская формула естественна в данном регистре.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: нас ... двенадцать братьев
  rationale: Естественно передаёт число и родство, выраженные еврейской аппозицией.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: мы сыновья одного человека
  rationale: Сохраняет мужскую родственную лексику и подчёркивает происхождение всех братьев от одного отца.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: живущего в земле Ханаанской
  rationale: Причастие добавлено для естественной русской синтаксической связи; принадлежность предложной группы в еврейском допускает связь с отцом, что соответствует непосредственному порядку слов.
- source_word: וְהִנֵּה
  choice: Вот
  rationale: Современный и достойный русский указательный маркер, сохраняющий презентационную функцию הִנֵּה без архаического «се».
- source_word: הַקָּטֹן
  choice: младший
  rationale: В семейном контексте обозначает младшего брата, а не физически маленького человека.
- source_word: אֶת אָבִינוּ
  choice: с нашим отцом
  rationale: אֶת здесь выражает совместное пребывание, а не маркирует прямое дополнение.
- source_word: הַיּוֹם
  choice: теперь
  rationale: В данном сообщении о нынешнем положении русское «теперь» естественно передаёт контекстуальное значение «сегодня, в настоящее время».
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: а одного не стало
  rationale: Сохраняет эвфемистичность и некоторую неопределённость буквального «одного нет», не превращая слова братьев в прямое утверждение о смерти.
theological_decisions:
- issue: Родовая лексика
  choice: сыновья одного человека
  alternative: дети одного человека
  rationale: Еврейский текст употребляет форму мужского рода и говорит именно о сыновьях Иакова; нейтрализация пола здесь не требуется.
- issue: Неопределённость участи Иосифа
  choice: одного не стало
  alternative: одного уже нет в живых
  rationale: Фраза братьев эвфемистична и не формулирует смерть прямо; перевод сохраняет напряжение между отсутствием и предполагаемой гибелью.
- issue: Связь оборота «в земле Ханаанской»
  choice: одного человека, живущего в земле Ханаанской
  alternative: двенадцать братьев в земле Ханаанской
  rationale: Еврейский порядок слов позволяет отнести предложную группу к «одному человеку»; русский перевод делает эту синтаксическую связь ясной, не добавляя богословского вывода.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис умеренно формальный; архаизм «се» не используется. Маркер [a] поставлен непосредственно после неоднозначной фразы.
