base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: ru
  text: Мы — двенадцать братьев, сыновья нашего отца. Одного нет[a], а младший сегодня с нашим отцом в земле Ханаана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одного нет». Это еврейское выражение может означать, что человек отсутствует, исчез или считается умершим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Мы — двенадцать братьев
  rationale: Безглагольная еврейская фраза передана естественной русской именной конструкцией с сохранением числа и буквального родства.
- source_word: בְּנֵי אָבִינוּ
  choice: сыновья нашего отца
  rationale: Сохранены и прямое значение «сыновья», и местоименное значение «нашего», без замены на менее точное «сыновья одного отца».
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: Одного уже нет
  rationale: Русское выражение естественно передаёт отсутствие человека и возможный смысл его смерти, не утверждая прямо больше, чем допускает еврейская идиома.
- source_word: וְהַקָּטֹן
  choice: а младший
  rationale: В перечне братьев קָטֹן обозначает самого младшего; союз передан как противопоставляющее «а».
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой временной эквивалент сохраняет формулировку и актуальность сообщения.
- source_word: אֶת אָבִינוּ
  choice: с нашим отцом
  rationale: אֶת здесь выражает совместное пребывание, поэтому передано предлогом «с», а не показателем прямого дополнения.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохранено существительное «земля»; традиционная русская форма остаётся понятной и соответствует возвышенному повествовательному регистру.
theological_decisions:
- issue: Степень определённости судьбы отсутствующего брата
  choice: Одного уже нет
  alternative: один умер
  rationale: Текст использует идиому אֵינֶנּוּ, которая может подразумевать смерть, исчезновение или отсутствие; перевод не превращает подразумеваемую смерть в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным тоном. Синтаксис близок к еврейскому оригиналу, но не создаёт неестественной кальки.
