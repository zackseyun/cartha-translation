    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: заключил
  rationale: Глагол אָסַף буквально означает «собирать», но в сочетании с אֶל־מִשְׁמָר идиоматически обозначает помещение людей под стражу. «Заключил» естественно передаёт это действие, не уточняя без необходимости конкретное место заключения.
- source_word: אֹתָם
  choice: их
  rationale: Местоименное дополнение мужского рода во множественном числе относится к братьям Иосифа.
- source_word: אֶל מִשְׁמָר
  choice: под стражу
  rationale: Сочетание предлога направления אֶל и существительного מִשְׁמָר обозначает помещение в состояние или место охраны. Русское выражение «заключить под стражу» точно и естественно передаёт смысл, не усиливая его до «темницы».
- source_word: שְׁלֹשֶׁת יָמִים
  choice: на три дня
  rationale: В данном контексте сочетание обозначает продолжительность заключения; по-русски при глаголе «заключил» естественно употребить «на три дня».
