  text: וַ/יֹּ֖אמֶר אֲלֵ/הֶ֑ם לֹ֕א כִּֽי עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶ֥ם לִ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: ru
  text: 'Но он сказал им: «Нет, вы пришли, чтобы увидеть[a] наготу земли[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высмотреть», «разведать». В еврейском тексте буквально стоит «увидеть», однако в контексте Иосиф обвиняет их в разведке.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть открытые или незащищённые места страны. В еврейском тексте буквально: «наготу земли» — образ уязвимых мест, которыми могли бы воспользоваться враги или соглядатаи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Но он сказал им
  rationale: Последовательная повествовательная форма продолжает рассказ, а союз «но» естественно передаёт противопоставление ответу братьев в предыдущем стихе.
- source_word: לֹא כִּי
  choice: Нет, вы пришли
  rationale: לֹא выражает резкое отрицание сказанного братьями, а כִּי вводит исправляющее их версию обвинение. В современном русском это естественно передаётся конструкцией «Нет, вы…» без тяжеловесного «ибо».
- source_word: לִרְאוֹת
  choice: увидеть
  rationale: Инфинитив от ראה буквально означает «видеть, увидеть». Контекст допускает смысл разведки, но в основном тексте сохранён более общий глагол оригинала.
- source_word: עֶרְוַת הָאָרֶץ
  choice: наготу земли
  rationale: 'Буквальный образ оригинала сохранён: «нагота» метафорически обозначает открытые, слабые или незащищённые места страны. «Земля» соответствует обычному значению אֶרֶץ и уместна в контексте территории Египта.'
- source_word: בָּאתֶם
  choice: вы пришли
  rationale: Перфект обозначает уже совершившееся прибытие, цель которого Иосиф теперь ставит им в вину; русское прошедшее время передаёт это естественно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; реплика краткая и резкая. Буквенная метафора «нагота земли» сохранена ради образности и смысловой напряжённости оригинала, а её контекстуальное значение разъяснено в сноске.
