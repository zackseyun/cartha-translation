  source_fidelity: 'Текст точно передаёт структуру и смысл еврейского оригинала: וַיֹּאמֶר אֲלֵהֶם — «Но он сказал им», резкое לֹא כִּי — «Нет, вы…», בָּאתֶם — «вы пришли», а также цель לִרְאוֹת. Буквальный метафорический образ עֶרְוַת הָאָרֶץ сохранён как «наготу земли», без подмены его более узким истолкованием «разведать».'
  naturalness: Фраза краткая, ясная и соответствует напряжённому обвинительному тону реплики. «Нагота земли» намеренно несколько необычна для современного нейтрального употребления, но это оправданное сохранение образа оригинала; сноска своевременно разъясняет метафору.
  terminology: «Земля» уместно передаёт הָאָרֶץ в данном контексте. «Нагота» корректно сохраняет ключевой образ, а незащищённость территории вынесена в пояснительную сноску. Сноска к «увидеть» правильно отличает буквальное значение глагола от контекстуального обвинения в разведке. Маркеры сносок стоят у соответствующих слов и структурно корректны.
