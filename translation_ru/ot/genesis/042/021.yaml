base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: ru
  text: 'И сказали они друг другу: «Действительно, мы виновны перед нашим братом: мы видели мучение его души, когда он умолял нас, а мы не послушали. Поэтому это бедствие постигло нас[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские слова, переданные здесь как «мучение» и «бедствие», однокоренные. Эта перекличка сопоставляет страдание Иосифа с бедствием, постигшим братьев.
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: И сказали они друг другу
  rationale: Еврейский взаимный оборот естественно передаётся по-русски как «друг другу»; союз «и» сохраняет повествовательную связь.
- source_word: אֲבָל
  choice: Да
  rationale: Здесь слово вводит не противопоставление, а подчёркнутое признание; русское «да» кратко и естественно передаёт эту утвердительную силу.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: мы виновны перед нашим братом
  rationale: «Виновны» точно выражает признание вины, а «перед нашим братом» естественно обозначает человека, по отношению к которому они виноваты, не устраняя возможного оттенка «из-за нашего брата».
- source_word: צָרַת נַפְשׁוֹ
  choice: как страдала его душа
  rationale: Сохраняется образное упоминание души и передаётся глубокое личное страдание Иосифа без тяжеловесной буквальности «бедствие его души».
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: когда он умолял нас
  rationale: Форма глагола выражает настойчивую мольбу; дополнение «о милости» в еврейском тексте прямо не названо.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: но не послушали
  rationale: В контексте שׁמע означает не просто услышать, а внять; «но» естественно выявляет смысловое противопоставление.
- source_word: עַל־כֵּן בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: За это и постигло нас нынешнее бедствие
  rationale: Передаётся причинно-следственная связь и естественный русский оборот «постигло нас»; «нынешнее» раскрывает указательное «это» применительно к переживаемому ими бедствию.
theological_decisions:
- issue: Связь нынешнего бедствия братьев с их виной перед Иосифом
  choice: 'Сохранить их собственное причинное истолкование: «За это и постигло нас»'
  alternative: 'Ослабить связь: «Поэтому нас постигло»'
  rationale: Текст передаёт признание самих братьев, что нынешнее несчастье является следствием их поступка; перевод не добавляет отдельного богословского объяснения о способе воздаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «как страдала его душа» сохраняет древнееврейский образ, но звучит естественнее буквального «бедствие его души». Единственный маркер сноски помещён после «бедствие», где яснее всего видна смысловая перекличка.
