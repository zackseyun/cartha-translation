  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: ru
  text: Этот человек, правитель той страны, говорил с нами сурово и счёл нас лазутчиками, разведывающими землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: говорил с нами сурово
  rationale: Сохраняет конструкцию «говорить с нами» и передаёт наречное значение קָשׁוֹת естественным современным русским выражением.
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: господин той земли
  rationale: אֲדֹנֵי здесь означает человеческого правителя или властителя, а не божественное имя; указательное «той» естественно отсылает к уже известной земле.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: принял нас за лазутчиков
  rationale: Буквально идиома говорит, что он «поставил/счёл нас как лазутчиков»; по-русски её смысл естественно передаётся выражением «принял нас за».
- source_word: מְרַגְּלִים
  choice: лазутчиков
  rationale: Слово обозначает людей, тайно разведывающих местность; «лазутчики» подходит историческому повествованию и остаётся понятным.
- source_word: מְרַגְּלִים אֶת־הָאָרֶץ
  choice: лазутчиков, высматривающих землю
  rationale: Дополнение אֶת־הָאָרֶץ относится к действию разведки; развёрнутая формулировка избегает неестественного русского «лазутчики земли».
