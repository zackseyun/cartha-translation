  text: וַ/יְצַ֣ו יוֹסֵ֗ף וַ/יְמַלְא֣וּ אֶת כְּלֵי/הֶם֮ בָּר֒ וּ/לְ/הָשִׁ֤יב כַּסְפֵּי/הֶם֙ אִ֣ישׁ אֶל שַׂקּ֔/וֹ וְ/לָ/תֵ֥ת לָ/הֶ֛ם צֵדָ֖ה לַ/דָּ֑רֶךְ וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: ru
  text: Иосиф приказал наполнить их сосуды зерном[a], возвратить серебро каждого в его мешок[b] и дать им припасы на дорогу. Так и сделали для них[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их вместилища». Еврейское слово имеет широкое значение; далее в этом же стихе для мешка употреблено другое слово.'
    reason: lexical_alternative
  - marker: b
    text: «Серебро» здесь также означает деньги.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «И он сделал для них так». В еврейском тексте исполнитель действия прямо не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: приказал
  rationale: Глагол צוה означает отдать распоряжение; «приказал» естественно вводит последующую цепочку инфинитивов.
- source_word: כְּלֵיהֶם
  choice: их сосуды
  rationale: כְּלִי — широкое обозначение вместилища или утвари. «Сосуды» сохраняет отличие от שַׂק («мешок») далее в стихе.
- source_word: בָּר
  choice: зерном
  rationale: בָּר в контексте голода обозначает зерно как продовольственный товар, без неоправданного сужения до конкретного злака.
- source_word: כַּסְפֵּיהֶם
  choice: серебро
  rationale: כֶּסֶף буквально означает серебро и в контексте служит деньгами; конкретное «серебро» поддерживает повествовательную связь с его последующим обнаружением.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: серебро каждого в его мешок
  rationale: אִישׁ употреблено распределительно — «каждого», а שַׂק конкретно обозначает мешок. Предлог אֶל при глаголе возвращения естественно передан направлением «в».
- source_word: צֵדָה לַדָּרֶךְ
  choice: припасы на дорогу
  rationale: צֵדָה означает дорожный запас продовольствия или иные припасы; выбранное выражение естественно для современного русского языка.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Так и сделали для них
  rationale: Единственное число глагола при неуказанном исполнителе допускает неопределённо-личную передачу по-русски; она не приписывает действие самому Иосифу и сохраняет смысл исполнения приказа.
