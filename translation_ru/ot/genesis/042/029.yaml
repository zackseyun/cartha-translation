  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Они пришли
  rationale: Форма wayyiqtol от בוא продолжает последовательность повествования; в русском отдельное «тогда» здесь не требуется.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: к своему отцу Иакову
  rationale: Предлог אֶל выражает направление, а אֲבִיהֶם обозначает «их отца»; возвратное «своему» естественно при совпадении обладателя с подлежащим.
- source_word: אַרְצָה כְּנָעַן
  choice: в землю Ханаанскую
  rationale: Направительный суффикс -ה указывает на движение в сторону или внутрь страны; формулировка сохраняет это направление и естественно сочетается с глаголом движения.
- source_word: וַיַּגִּידוּ לוֹ
  choice: и рассказали ему
  rationale: Порода hифиль глагола נגד означает сообщить или рассказать; «рассказали» уместно перед изложением пережитых событий.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: обо всём, что с ними произошло
  rationale: Причастная форма от קרה обозначает случившееся или постигшее их; русский оборот передаёт совокупность событий естественно и точно.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Форма вводит прямую речь следующего стиха; двоеточие ясно обозначает её начало.
