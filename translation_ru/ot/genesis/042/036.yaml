base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: ru
  text: 'Иаков, их отец, сказал им: «Вы лишили меня детей: Иосифа нет, Симеона нет, а Вениамина хотите забрать. Всё это обернулось против меня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все они против меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: вы лишаете меня детей
  rationale: Пиэль глагола שׁכל означает причинить утрату детей, сделать бездетным. Настоящее время по-русски естественно передаёт итог и продолжающееся переживание утраты; дополнение «детей» имплицировано значением глагола.
- source_word: אֵינֶנּוּ
  choice: нет
  rationale: В данном плаче конструкция выражает отсутствие и утрату. Краткое русское «нет» естественно и сохраняет повтор исходного текста.
- source_word: תִּקָּחוּ
  choice: хотите забрать
  rationale: Имперфект описывает предполагаемое ближайшее действие, против которого возражает Иаков; такая передача естественно выражает намерение сыновей, не превращая его в безусловное будущее.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: всё это обрушилось на меня
  rationale: Передача сохраняет совокупность бедствий и неблагоприятную направленность עָלַי; «обрушилось» естественно выражает эмоциональную силу сетования.
- source_word: אֹתִי
  choice: меня
  rationale: Явное «меня» сохраняет вынесенный объект и акцент Иакова на собственной утрате.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: отец их Иаков
  rationale: Сохраняет обозначение родства и имя, следуя исходному порядку настолько, насколько это естественно для литературного русского.
theological_decisions:
- issue: Референт заключительной фразы עָלַי הָיוּ כֻלָּנָה
  choice: Всё это обрушилось на меня
  alternative: Все они против меня
  rationale: Женская множественная форма допускает отнесение к подразумеваемым бедам или обстоятельствам, тогда как перевод «они» может быть воспринят как обвинение сыновей. Основной текст передаёт переживание совокупности несчастий, а буквальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением ритма и эмоциональной напряжённости плача Иакова. Повтор «нет» воспроизводит лаконичный параллелизм еврейского текста; «а теперь и» естественно подчёркивает нарастание утрат.
