lexical_decisions:
- source_word: וַיַּרְא
  choice: Когда Иаков узнал
  rationale: 'Глагол буквально означает «увидел», но с придаточным, вводимым כִּי, здесь передаёт восприятие известия: Иаков узнал о наличии зерна в Египте. «Когда» естественно выражает связь с последующей речью.'
- source_word: כִּי יֶשׁ
  choice: что ... есть
  rationale: Сочетание вводит содержание того, что стало известно Иакову; настоящее «есть» сохраняет форму и актуальность сообщаемого факта.
- source_word: שֶׁבֶר
  choice: зерно
  rationale: В повествовании о голоде слово обозначает зерно, доступное для приобретения; это точнее общего «пища».
- source_word: בְּמִצְרָיִם
  choice: в Египте
  rationale: Обычное местное значение предлога בְּ.
- source_word: לְבָנָיו
  choice: своим сыновьям
  rationale: Речь идёт именно о сыновьях Иакова; возвратное «своим» естественно для русского повествования.
- source_word: לָמָּה
  choice: Что
  rationale: В разговорном вопросе «Что вы всё смотрите…?» естественно передаёт значение «почему» без изменения смысла упрёка.
- source_word: תִּתְרָאוּ
  choice: вы всё смотрите друг на друга
  rationale: Форма хитпаэль наиболее вероятно имеет взаимное значение и описывает нерешительное бездействие братьев. Частица «всё» передаёт продолжающийся характер действия и упрёк.
