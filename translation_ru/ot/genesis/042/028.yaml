  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: ru
  text: 'Он сказал своим братьям: «Мне вернули серебро! Вот оно, в моём мешке!» Сердца у них упали[a], и они затрепетали, говоря друг другу[b]: «Что же это Бог сделал с нами?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их сердце вышло»; то есть мужество оставило их.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый своему брату».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: мне вернули
  rationale: 'Гофаль глагола שוב выражает страдательно-каузативное значение: серебро было возвращено говорящему. Неопределённо-личная русская конструкция естественно передаёт пассив, не называя действующего лица.'
- source_word: כַּסְפִּי
  choice: серебро
  rationale: כסף обозначает серебро и, по расширению значения, деньги. Здесь конкретное «серебро» сохраняет историческую и повествовательную образность.
- source_word: אַמְתַּחַת
  choice: мешок
  rationale: Слово обозначает дорожную суму или мешок для зерна и припасов; «мешок» естественно для контекста перевозки зерна.
- source_word: וְגַם הִנֵּה
  choice: Вот, оно
  rationale: «Вот» передаёт указательную силу הִנֵּה и внезапность обнаружения; наличие серебра непосредственно в мешке по-русски уже несёт усилительный смысл גם без тяжеловесного «да ещё».
- source_word: וַיֵּצֵא לִבָּם
  choice: сердце у них упало
  rationale: 'Буквально: «их сердце вышло». Русская идиома передаёт внезапную утрату мужества и сохраняет образ сердца, а единственное число отражает форму исходного текста.'
- source_word: וַיֶּחֶרְדוּ
  choice: они затрепетали
  rationale: חרד выражает дрожь от страха и тревоги. «Затрепетали» сохраняет одновременно телесный и эмоциональный оттенок.
- source_word: אִישׁ אֶל אָחִיו
  choice: друг другу
  rationale: Это естественный русский способ передать распределительное значение выражения; буквальная мужская и родственная формулировка сохранена в примечании.
- source_word: מַה זֹּאת
  choice: Что же это
  rationale: Сохраняется прямой восклицательный вопрос, а частица «же» естественно передаёт изумление и тревогу, не превращая вопрос «что?» в объяснительное «почему?».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, синтаксис и контекст указывают на единственного Бога.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים в испуганном вопросе братьев
  choice: Бог
  alternative: бог; боги
  rationale: Контекст и синтаксис поддерживают единственное число. Перевод признаёт приписывание случившегося Божьему действию, не добавляя объяснения его цели.
- issue: Передача אִישׁ אֶל אָחִיו
  choice: друг другу с буквальным вариантом в примечании
  alternative: каждый своему брату
  rationale: Основной текст звучит естественно по-русски, а примечание сохраняет мужскую родственную форму оригинала и её распределительный характер.
translation_notes:
  register: Современный литературный русский с ясным повествовательным ритмом. Прямая речь передаёт внезапность находки, а умеренно возвышенное «затрепетали» соответствует напряжённости сцены без архаизации всего стиха.
