  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: ru
  text: Когда они опорожняли свои мешки, оказалось, что у каждого в мешке лежал свёрток с серебром[a]. Увидев свои свёртки с серебром, они и их отец испугались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мешочек с деньгами». Еврейское слово обозначает нечто связанное или завёрнутое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: И когда они опорожняли
  rationale: Сочетание וַיְהִי с причастием задаёт временную рамку нового события. Русская конструкция «И когда…» естественно передаёт эту функцию без архаичного «и было».
- source_word: שַׂקֵּיהֶם
  choice: свои мешки
  rationale: שַׂק обозначает мешок для зерна или других товаров; «мешки» точно и естественно для данного контекста.
- source_word: וְהִנֵּה
  choice: то вот
  rationale: Частица отмечает внезапное обнаружение и удивление; «вот» сохраняет её повествовательную выразительность.
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: у каждого … свёрток с серебром
  rationale: אִישׁ употреблено дистрибутивно — «у каждого», а צְרוֹר означает связанный или завёрнутый свёрток. כֶּסֶף здесь служит средством платежа, но буквальное «серебро» сохраняет конкретность древнего контекста.
- source_word: בְּשַׂקּוֹ
  choice: в мешке
  rationale: Простое обозначение местонахождения; единственное число соответствует дистрибутивному «у каждого».
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם
  choice: увидели свои свёртки с серебром
  rationale: Сохранены глагол зрительного восприятия и повтор конкретного предмета, как в еврейском тексте.
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: они и их отец
  rationale: Передано эмфатическое уточнение участников без добавления отсутствующего в источнике «оба».
- source_word: וַיִּירָאוּ
  choice: и испугались
  rationale: Глагол ירא выражает возникшую в ответ на находку боязнь; совершенный вид естественно передаёт последовательность повествования.
