  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: ru
  text: 'Но он сказал: «Сын мой не пойдёт с вами, потому что его брат умер и он один остался. Если с ним случится несчастье[a] на пути, по которому вы пойдёте, то вы сведёте мою седину в скорби в Шеол[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если его постигнет беда».'
    reason: Лексема אָסוֹן допускает переводы «несчастье», «беда», «бедствие» и подразумевает серьёзный вред.
  - marker: b
    text: 'Шеол — еврейское название мира умерших; возможен перевод: «могила».'
    reason: Поясняет незнакомый читателю еврейский термин, не устраняя его смысловой широты.
lexical_decisions:
- source_word: יֵרֵד
  choice: не пойдёт
  rationale: В еврейском буквально «не сойдёт / не пойдёт вниз»; речь идёт о путешествии из Ханаана в Египет. Однако по-русски «не пойдёт с вами» естественно передаёт движение, тогда как «не спустится с вами» здесь звучало бы неестественно и могло бы создать неверное представление о буквальном спуске.
- source_word: בְּנִי
  choice: сын мой
  rationale: Прямо передаёт существительное «сын» с притяжательным суффиксом первого лица; порядок слов сохраняет достоинство и эмоциональный акцент речи Иакова.
- source_word: אָחִיו מֵת
  choice: его брат умер
  rationale: Передаёт убеждение Иакова о смерти Иосифа. Русское «умер» естественнее, чем «мёртв», и в данном контексте сохраняет результирующий смысл еврейского выражения.
- source_word: וְהוּא לְבַדּוֹ נִשְׁאָר
  choice: и он один остался
  rationale: 'Сохраняет усилительное לְבַדּוֹ: Вениамин, по мысли Иакова, остался единственным из двух сыновей Рахили.'
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: если с ним случится несчастье
  rationale: Буквальная сочинительная конструкция в контексте имеет условный смысл. אָסוֹן обозначает тяжёлое несчастье, беду или пагубный случай, не уточняя его вид.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: на пути, по которому вы пойдёте
  rationale: Сохраняет конкретный образ дороги и относительную конструкцию оригинала, оставаясь естественным современным русским выражением.
- source_word: וְהוֹרַדְתֶּם
  choice: то вы сведёте
  rationale: Каузативная форма от ירד означает «заставить сойти, свести вниз». «То» ясно выражает следствие условного придаточного, не превращая его в безусловное предсказание.
- source_word: שֵׂיבָתִי
  choice: мою седину
  rationale: Сохраняет конкретный еврейский образ седых волос как обозначение престарелого человека, а не заменяет его абстрактным «мою старость».
- source_word: בְּיָגוֹן
  choice: в скорби
  rationale: יגון означает глубокую печаль или скорбь. «В скорби» сохраняет состояние, в котором Иаков сойдёт в Шеол.
- source_word: שְׁאֹלָה
  choice: в Шеол
  rationale: Сохраняет еврейское обозначение мира умерших и не сужает его автоматически до физической могилы.
theological_decisions:
- issue: Передача שְׁאוֹל как «Шеол» или «могила»
  choice: в Шеол
  alternative: в могилу; в мир умерших
  rationale: שְׁאוֹל может обозначать область умерших и не во всех контекстах тождествен физической могиле. Транслитерация сохраняет смысловую широту и богословскую неоднозначность исходного слова.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной речью. Синтаксис близок к еврейскому там, где это не нарушает естественности; конкретные образы «путь», «седина» и «Шеол» сохранены.
