base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: ru
  text: 'Иосиф увидел своих братьев и узнал их, но стал держаться с ними как незнакомец[a] и говорил с ними сурово. Он спросил их: «Откуда вы пришли?» Они ответили: «Из земли Ханаанской, купить еды[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал вид, будто не знает их». Еврейское выражение означает, что он представился им чужим или незнакомым; физическая маскировка не обязательно подразумевается.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «купить зерна». Во время голода употреблённый здесь глагол часто относится именно к покупке зерна, хотя существительное имеет более широкое значение — «еда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Иосиф увидел своих братьев
  rationale: Прямо передаёт повествовательную последовательность и объект действия; союз «и» далее естественно связывает однородные действия в русском повествовании.
- source_word: וַיַּכִּרֵם
  choice: и узнал их
  rationale: Hiphil глагола נכר означает распознать, узнать; «узнал» — естественный русский эквивалент в контексте встречи.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: но перед ними он разыграл незнакомца
  rationale: Hitpael здесь обозначает намеренное представление себя чужим или незнакомым для братьев. Формулировка не предполагает непременно физической маскировки и ясно передаёт притворное поведение.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: и говорил с ними сурово
  rationale: קָשׁוֹת наречно характеризует манеру речи. «Говорил с ними сурово» сохраняет конструкцию אִתָּם и звучит естественно и достойно.
- source_word: מֵאַיִן בָּאתֶם
  choice: Откуда вы пришли?
  rationale: Точно передаёт вопрос о месте, из которого они прибыли, и форму глагола движения.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: Из земли Ханаанской
  rationale: Сохраняет полную географическую формулу исходного текста в принятой литературной русской форме.
- source_word: לִשְׁבָּר אֹכֶל
  choice: купить еды
  rationale: שבר в данном контексте означает покупать припасы, часто зерно, тогда как אֹכֶל имеет более широкое значение «еда, пища». Выбор не сужает смысл существительного.
