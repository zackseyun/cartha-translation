  text: И приведите ко мне вашего самого младшего брата, чтобы подтвердилось сказанное вами[a]; тогда вы не умрёте». И они так и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ваши слова были признаны правдой»; возможно также: «чтобы вашим словам поверили». Еврейский глагол может означать как подтверждение истинности сказанного, так и признание слов заслуживающими доверия; в данном контексте речь идёт о проверке.'
