lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: вашего младшего брата
  rationale: В контексте братьев הַקָּטֹן обозначает младшего по возрасту; русское «младшего брата» естественно указывает здесь на самого младшего, Вениамина.
- source_word: תָּבִיאוּ אֵלַי
  choice: приведите ко мне
  rationale: Побудительная форма породы хифиль от בוא означает «привести»; אֵלַי прямо передано как «ко мне».
- source_word: וְיֵאָמְנוּ
  choice: чтобы подтвердились
  rationale: Нифаль от אמן может означать признание чего-либо истинным, надёжным или заслуживающим доверия. «Подтвердились» соответствует проверке заявлений братьев в данном контексте и сохраняет их слова в роли грамматического субъекта.
- source_word: דִבְרֵיכֶם
  choice: ваши слова
  rationale: Прямой и естественный перевод, сохраняющий связь с тем, что братья заявили ранее.
- source_word: וְלֹא תָמֻתוּ
  choice: и вы не умерли
  rationale: 'Сохранена еврейская сочинительная конструкция и её смысл: исполнение требования позволит братьям избежать смерти.'
- source_word: וַיַּעֲשׂוּ כֵן
  choice: И они так и сделали
  rationale: Современная естественная передача повествовательной формулы, подчёркивающая исполнение сказанного.
