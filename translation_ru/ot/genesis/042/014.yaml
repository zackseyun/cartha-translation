  text: 'Иосиф сказал им: «Вот что я сказал вам: вы — соглядатаи».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная передача повествовательной формы wayyiqtol от אמר; союз ו естественно выражен ходом русского повествования.
- source_word: אֲלֵהֶם
  choice: им
  rationale: 'Точно и естественно передаёт предлог с местоименным суффиксом: Иосиф обращается к братьям.'
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная русская форма библейского имени.
- source_word: הוּא אֲשֶׁר
  choice: Так и есть, как
  rationale: Передаёт эмфатическое подтверждение Иосифом своего прежнего утверждения, не воспроизводя неестественно еврейскую конструкцию буквально.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: я вам говорил
  rationale: Естественное русское выражение для речи, ранее обращённой к собеседникам; несовершенный вид уместно отсылает к уже высказанному обвинению.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание прежней речи; в современном русском эту функцию естественно выполняет двоеточие.
- source_word: מְרַגְּלִים
  choice: соглядатаи
  rationale: Традиционное и понятное в библейском регистре обозначение тайных разведчиков; соответствует контексту обвинения в осмотре уязвимых мест страны.
- source_word: אַתֶּם
  choice: вы
  rationale: Самостоятельное местоимение сохраняет прямое и подчёркнутое обвинение; в русском настоящем времени связка не требуется.
