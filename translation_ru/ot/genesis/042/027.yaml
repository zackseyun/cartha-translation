base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: ru
  text: 'Тогда один из них на месте ночлега[a] открыл свой мешок, чтобы дать корм своему ослу, и увидел своё серебро[b]: вот оно — в горловине его сумки!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на ночной стоянке».'
    reason: lexical_alternative
  - marker: b
    text: «Серебро» здесь означает деньги, которыми он заплатил за зерно.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: открыл
  rationale: Прямое и естественное соответствие глаголу פתח в повествовательном контексте.
- source_word: הָאֶחָד
  choice: один из них
  rationale: Буквально «один»; дополнение «из них» ясно указывает на одного из братьев и не добавляет новой информации.
- source_word: שַׂקּוֹ
  choice: свой мешок
  rationale: שַׂק обозначает мешок; возвратное «свой» естественно по-русски при совпадении владельца с подлежащим.
- source_word: לָתֵת מִסְפּוֹא
  choice: чтобы дать корм
  rationale: מִסְפּוֹא — корм для животных; конструкция с «чтобы» естественно передаёт цель действия.
- source_word: לַחֲמֹרוֹ
  choice: своему ослу
  rationale: Дательный падеж передаёт получателя корма; «своему» соответствует русскому употреблению при общем субъекте.
- source_word: בַּמָּלוֹן
  choice: на месте ночлега
  rationale: מָלוֹן означает место остановки на ночь и не обязательно предполагает постоялый двор как коммерческое заведение.
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: и увидел своё серебро
  rationale: Сохранено конкретное значение כֶּסֶף «серебро»; в данном контексте это серебро служило платёжными деньгами.
- source_word: וְהִנֵּה
  choice: вот оно
  rationale: «Вот» передаёт внезапность обнаружения и повествовательную выразительность частицы הִנֵּה без архаизации.
- source_word: בְּפִי
  choice: в горловине
  rationale: Буквально «во рту»; применительно к вместилищу «горловина» сохраняет образ отверстия и звучит естественно по-русски.
- source_word: אַמְתַּחְתּוֹ
  choice: его сумы
  rationale: «Сума» обозначает дорожную поклажу и позволяет сохранить лексическое различие между אַמְתַּחַת и ранее употреблённым שַׂק «мешок».
