translation_notes:
  register: Современный литературный русский язык с умеренно выразительным библейским повествовательным ритмом. Перестановка обстоятельства места в начало предложения делает синтаксис естественным по-русски. Восклицание после «вот оно» передаёт неожиданность находки; различие между «мешком» и «сумой» сохранено.
