  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: ru
  text: 'Он сказал: «Я слышал, что в Египте есть зерно. Спуститесь туда и купите там зерна для нас, чтобы нам остаться в живых и не умереть».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: опущено как отдельное слово
  rationale: Частица привлекает внимание к сообщению; в современном русском её функция естественно передаётся непосредственным началом фразы «Я слышал», тогда как «вот» здесь звучало бы несколько искусственно.
- source_word: שָׁמַעְתִּי
  choice: Я слышал
  rationale: Русское прошедшее время естественно выражает полученную ранее информацию, сохраняющую актуальность в момент речи.
- source_word: שֶׁבֶר
  choice: зерно
  rationale: В контексте голода слово обозначает зерно, доступное для покупки, а не пищу вообще.
- source_word: רְדוּ
  choice: Спуститесь
  rationale: 'Сохранена пространственная направленность еврейского глагола: путь из Ханаана в Египет осмысляется как движение вниз.'
- source_word: שָׁמָּה
  choice: туда
  rationale: Естественная русская передача наречия направления.
- source_word: וְשִׁבְרוּ
  choice: купите ... зерна
  rationale: В данном контексте глагол специально означает покупку зерна; повтор существительного по-русски ясен и не создаёт существенной тяжеловесности.
- source_word: לָנוּ
  choice: нам
  rationale: 'Кратко и естественно передаёт дательный заинтересованного лица: покупка предназначена для всей семьи.'
- source_word: מִשָּׁם
  choice: не выражено отдельно
  rationale: Исходная точка уже однозначно обозначена сочетанием «спуститесь туда»; буквальное «купите нам оттуда» в русском звучит неестественно, а смысл сохраняется конструкцией в целом.
- source_word: וְנִחְיֶה
  choice: чтобы нам остаться в живых
  rationale: Передаёт целевое или желаемое следствие распоряжения и естественно сочетается с последующим отрицанием.
- source_word: וְלֹא נָמוּת
  choice: и не умереть
  rationale: Сохранены параллелизм и настоятельность еврейской пары «жить — не умереть».
