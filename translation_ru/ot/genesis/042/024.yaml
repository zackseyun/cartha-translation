translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Цепочка древнееврейских форм с וַ передана несколькими короткими предложениями и временными связками, чтобы сохранить последовательность действий без тяжёлого многосоюзия. Английские сноски не перенесены: первая противоречит месту маркера и, вероятно, является редакционной ошибкой, а вторая не сообщает содержательной текстовой альтернативы.'
