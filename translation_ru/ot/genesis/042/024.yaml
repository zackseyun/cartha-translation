revisions:
- from: Он отвернулся от них и заплакал. Потом вернулся к ним и поговорил с ними. Затем он взял Симеона из их числа и связал у них на глазах.
  to: Он отвернулся от них и заплакал. Затем вернулся к ним и обратился к ним. Потом взял Симеона из их числа и связал у них на глазах.
  rationale: Сохранена разбивка на короткие, естественные для русского повествования предложения и последовательность действий оригинала. Изменено только «поговорил с ними» на «обратился к ним», чтобы точнее передать направленность древнееврейского וידבר אליהם, не подразумевая взаимного разговора. Содержательных сносок не требуется; указанные в английском следе сноски не представляют применимой текстовой или лексической альтернативы для русского текста.
