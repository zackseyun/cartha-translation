base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: ru
  text: Он отвернулся от них и заплакал. Затем вернулся к ним и обратился к ним. Потом взял Симеона из их числа и связал у них на глазах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Он отвернулся от них
  rationale: Сочетание обозначает удаление или поворот от присутствующих; «отвернулся от них» естественно передаёт движение Иосифа и не добавляет отсутствующего в тексте указания на дальность ухода.
- source_word: וַיֵּבְךְּ
  choice: заплакал
  rationale: Глагол בכה обозначает плач; совершенный вид уместен для последовательного повествования и звучит естественно по-русски.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: вернулся к ним
  rationale: שׁוב здесь прямо обозначает возвращение к братьям после того, как Иосиф от них отвернулся.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: поговорил с ними
  rationale: Форма דבר допускает общее значение речи. «Поговорил с ними» в данном контексте естественнее, чем формальное «говорил им», и не уточняет не сообщённое содержание разговора.
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: взял Симеона из их числа
  rationale: מֵאִתָּם указывает, что Симеон был выделен из группы братьев; «из их числа» ясно сохраняет эту мысль.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: связал
  rationale: אסר прежде всего означает связать или наложить узы. «Связал» сохраняет конкретное действие, не подменяя его более широким «заключил под стражу».
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Живой современный русский эквивалент буквального «перед их глазами», подчёркивающий, что братья видели происходящее.
