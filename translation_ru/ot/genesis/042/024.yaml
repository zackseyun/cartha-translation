  source_fidelity: 'В целом последовательность действий и смысл древнееврейского текста переданы точно: Иосиф отвернулся, заплакал, вернулся, говорил с братьями, выделил Симеона и связал его у них на глазах. «Отвернулся от них» допустимо передаёт ויסב מעליהם в данном контексте; «связал» точно сохраняет конкретное значение אסר.'
