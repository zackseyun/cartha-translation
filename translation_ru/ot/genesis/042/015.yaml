  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: ru
  text: 'Вот как вы будете испытаны: жизнью фараона клянусь[a], вы не уйдёте отсюда, если только не придёт сюда ваш младший брат.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жив фараон». Это древнееврейская формула клятвы.'
    reason: Сноска сохраняет буквальную форму и поясняет её функцию, тогда как основной текст даёт естественный русский эквивалент.
lexical_decisions:
- source_word: בְּזֹאת
  choice: Вот как
  rationale: Предлог ב с указательным местоимением вводит способ или критерий проверки; «вот как» естественно связывает формулу с последующим условием.
- source_word: תִּבָּחֵנוּ
  choice: вы будете испытаны
  rationale: Нифаль глагола בחן обозначает подвергание проверке; пассивная форма сохраняет структуру и смысл исходного текста.
- source_word: חֵי פַרְעֹה
  choice: жизнью фараона клянусь
  rationale: Это формула клятвы, буквально апеллирующая к жизни фараона. Русская формулировка ясно передаёт её функцию, не превращая её в простое утверждение.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: вы не уйдёте отсюда
  rationale: После клятвенной формулы אִם выражает усиленное отрицательное заверение; «отсюда» естественно передаёт מִזֶּה.
- source_word: כִּי אִם
  choice: если только не
  rationale: Сочетание вводит единственное исключение из отрицательного утверждения; русский оборот сохраняет условно-исключительный смысл.
- source_word: בְּבוֹא
  choice: не придёт
  rationale: Инфинитив с ב обозначает обстоятельство, при котором разрешён уход; после «если только не» естественна личная форма глагола.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ваш младший брат
  rationale: В контексте братьев הַקָּטֹן обозначает младшего по возрасту; «младший брат» естественно и не добавляет сверх текста превосходную степень.
- source_word: הֵנָּה
  choice: сюда
  rationale: Направительное наречие означает движение к месту говорящего; «сюда» точнее простого «здесь».
