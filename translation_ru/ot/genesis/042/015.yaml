  verdict: approve
  source_fidelity: 'Текст точно передаёт структуру и смысл еврейского оригинала: בְּזֹאת — «Вот как», пассивное «вы будете испытаны», клятвенную формулу, усиленное отрицание после אִם («вы не уйдёте») и исключительное условие прибытия младшего брата. Направленное הֵנָּה корректно передано словом «сюда».'
  naturalness: Перевод звучит естественно на современном литературном русском. Оборот «жизнью фараона клянусь» ясен как торжественная клятва и уместен в речи персонажа; «если только не придёт» естественно выражает значение «unless».
  terminology: «Фараон» и «младший брат» употреблены корректно. «Младший», а не «самый младший», не вносит в текст излишней экспликации, хотя контекстуально речь идёт о младшем из братьев.
