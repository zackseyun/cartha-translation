  source_fidelity: 'Текст точно передаёт три утверждения еврейского оригинала: все говорящие являются сыновьями одного человека (то есть общего отца), они характеризуют себя как כֵּנִים, и в почтительном самообозначении отрицают, что были מְרַגְּלִים. «Одного отца» — естественная русская экспликация смысла בְּנֵי אִישׁ אֶחָד в данном контексте и не вносит нового фактического содержания. Прошедшее «не были шпионами» адекватно форме הָיוּ с причастием и не добавляет отсутствующего в оригинале «никогда».'
