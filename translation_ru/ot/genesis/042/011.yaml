  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: ru
  text: Все мы — сыновья одного отца. Мы честные люди[a]; твои слуги не были шпионами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правдивые», «люди порядочные». Еврейское слово описывает их как искренних и заслуживающих доверия, в противоположность обвинению в шпионаже.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод: «твои слуги не шпионы». Еврейская конструкция допускает естественную передачу как через прошедшее, так и через настоящее время.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: все мы
  rationale: Передаёт совокупность всей группы и сохраняет начальное смысловое выделение.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: сыновья одного отца
  rationale: 'Буквально: «сыновья одного человека»; в данном родственном утверждении אִישׁ обозначает их общего отца. Такой перевод естественен по-русски и сохраняет явно мужской референт.'
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: мы
  rationale: Самостоятельные местоимения имеют подчёркнутый характер; повторение «мы» сохранено в двух утверждениях.
- source_word: כֵּנִים
  choice: честные люди
  rationale: Слово характеризует братьев как правдивых, искренних и заслуживающих доверия в противоположность обвинению в шпионаже. Добавление «люди» делает именную конструкцию естественной по-русски.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: Здесь это почтительное самообозначение перед правителем, а не акцент на рабском статусе.
- source_word: מְרַגְּלִים
  choice: шпионы
  rationale: В контексте обвинения речь идёт о тайном сборе сведений, поэтому современное «шпионы» точнее нейтрального «разведчики».
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: не были шпионами
  rationale: Сохраняет форму с היה и причастием, не усиливая отрицание словом «никогда», которого в еврейском тексте нет.
