  source_fidelity: 'Основной смысл передан точно: Рувим напоминает братьям о своём предостережении не грешить против Иосифа, обличает их непослушание и связывает нынешнюю беду с ответственностью за его кровь. Однако «взыскивается за его кровь» в русском языке неудачно меняет синтаксический центр: в еврейском «его кровь» является тем, что взыскивается/требуется. Предлагаемая формулировка сохраняет неназванного субъекта и юридический смысл ответственности.'
