base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: ru
  text: 'Тогда Рувим ответил им: «Разве я не говорил вам: „Не грешите против мальчика“? Но вы не послушали. И вот, теперь за его кровь требуется ответ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и также его кровь — вот, взыскивается (требуется)». То есть за его кровь требуется ответ; тот, кто требует его, в еврейском тексте прямо не назван.'
    reason: Поясняет необычную конструкцию и сохраняет неназванным субъект пассивного глагола.
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Обычное повествовательное значение глагола ענה; естественно передаёт вступление Рувима в разговор.
- source_word: בַיֶּלֶד
  choice: против мальчика
  rationale: Предлог ב при חטא обозначает того, против кого совершается грех; «мальчик» сохраняет лексику и взгляд Рувима на Иосифа.
- source_word: דָּמוֹ
  choice: его кровь
  rationale: Сохраняет конкретный библейский образ крови как свидетельства насильственной смерти и основания ответственности.
- source_word: נִדְרָשׁ
  choice: взыскивается за
  rationale: Пассивная форма сохранена без названного действующего лица; выражение передаёт требование ответа и возмездия за пролитую кровь.
- source_word: הִנֵּה
  choice: и вот, теперь
  rationale: «Вот» передаёт указательно-эмфатическую частицу, а «теперь» естественно выражает наступившее последствие в данном контексте.
theological_decisions:
- issue: Кто взыскивает за кровь Иосифа
  choice: Безлично-пассивное «взыскивается за его кровь»
  alternative: «Бог взыскивает с нас за его кровь»
  rationale: В еврейском тексте субъект не назван. Контекст допускает подразумеваемое Божье воздаяние, но перевод не должен делать это явным сверх оригинала.
- issue: Смысл выражения о крови
  choice: Сохранён образ «взыскивается за его кровь»
  alternative: «Мы несём ответ за его смерть»
  rationale: Более разъясняющий вариант сгладил бы юридико-богословский образ דם и связь с ответственностью за пролитую кровь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формульное לֵאמֹר после «ответил» не воспроизводится отдельным «сказав», поскольку по-русски это избыточно; содержание прямой речи сохранено. Повторное לֵאמֹר перед цитатой также естественно передано двоеточием. Частица הֲלוֹא выражена риторическим «разве не».
