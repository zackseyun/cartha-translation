translation:
  language: ru
  text: Затем они погрузили своё зерно на своих ослов и ушли оттуда[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои припасы»; или: «купленное ими зерно». Еврейское слово может обозначать продовольственные запасы, но в данном контексте, вероятнее всего, речь идёт о зерне, купленном в Египте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: погрузили
  rationale: Глагол נָשָׂא буквально означает «поднять, нести», но в сочетании с грузом, помещаемым на вьючных животных, по-русски естественно передаётся как «погрузили».
- source_word: שִׁבְרָם
  choice: своё зерно
  rationale: В повествовании об Иосифе שֶׁבֶר обычно обозначает зерно, приобретаемое во время голода. Возвратное притяжательное местоимение «своё» естественно передаёт суффикс третьего лица множественного числа.
- source_word: עַל חֲמֹרֵיהֶם
  choice: на ослов
  rationale: При глаголе погрузки предлог עַל обозначает помещение груза на животных. Принадлежность ослов ясна из контекста и уже выражена возвратным «своё»; буквальное повторение «своих» сделало бы русскую фразу тяжелее.
- source_word: וַיֵּלְכוּ מִשָּׁם
  choice: и ушли оттуда
  rationale: Сочетание обычного глагола движения הָלַךְ с מִשָּׁם передаёт удаление из данного места; «ушли оттуда» точно и естественно в современном русском повествовании.
