base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: ru
  text: 'И вспомнил Иосиф сны, которые ему снились о них, и сказал им: «Вы — разведчики! Вы пришли высмотреть незащищённые места страны[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наготу страны» — то есть открытые, уязвимые для нападения места.'
    reason: лексическая альтернатива и пояснение еврейской идиомы
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: вспомнил
  rationale: 'Обычное повествовательное значение глагола זכר: в этот момент Иосиф вспомнил прежние сны.'
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: сны, которые ему снились
  rationale: Естественная русская передача однокоренной еврейской конструкции; она сохраняет повтор корня «сон / снились», не создавая тяжеловесности.
- source_word: לָהֶם
  choice: о них
  rationale: В данном контексте сны касались братьев Иосифа; предложное сочетание с ל передаёт это отношение.
- source_word: מְרַגְּלִים
  choice: разведчики
  rationale: Здесь причастие от רגל обозначает людей, тайно собирающих сведения о стране. «Разведчики» ясно выражает обвинение и естественно звучит в современном русском.
- source_word: לִרְאוֹת
  choice: высмотреть
  rationale: Буквально «увидеть», но в контексте обвинения в разведке русский глагол «высмотреть» естественно передаёт целенаправленный осмотр, не добавляя отдельного действия.
- source_word: עֶרְוַת הָאָרֶץ
  choice: незащищённые места страны
  rationale: Буквально «нагота страны»; это образное обозначение открытых, уязвимых для нападения мест. В основном тексте передан смысл идиомы, а буквальный образ сохранён в сноске.
- source_word: בָּאתֶם
  choice: вы пришли
  rationale: Русская форма прошедшего времени естественно выражает совершившееся прибытие, цель которого Иосиф вменяет братьям.
