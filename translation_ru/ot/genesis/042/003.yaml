  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: ru
  text: И десять братьев Иосифа спустились в Египет купить зерна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «купить зерна из Египта», то есть получить зерно оттуда.'
    reason: 'Лексическая альтернатива: еврейский предлог указывает на источник зерна, тогда как основной перевод естественнее передаёт место покупки по-русски.'
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Глагол ירד буквально означает движение вниз. «Спустились» сохраняет характерное для повествования географическое обозначение пути в Египет и естественно звучит по-русски.
- source_word: אֲחֵי יוֹסֵף
  choice: братьев Иосифа
  rationale: Конструкция прямо означает «братья Иосифа»; русский родительный падеж естественно передаёт принадлежность.
- source_word: עֲשָׂרָה
  choice: десять
  rationale: Числительное указывает, сколько братьев отправилось; перед существительным оно стоит в естественном для русского языка порядке.
- source_word: לִשְׁבֹּר
  choice: купить
  rationale: В рассказе о голоде глагол שׁבר обозначает приобретение зерна. «Купить» ясно и точно передаёт смысл.
- source_word: בָּר
  choice: зерна
  rationale: בָּר здесь означает зерно, то есть хлебные злаки. Родительный падеж после глагола совершенного вида естественен и не меняет предмет покупки.
- source_word: מִמִּצְרָיִם
  choice: в Египет
  rationale: 'Буквально предлог מן указывает на источник: «из Египта». В русском сочетание «спустились купить зерна из Египта» звучит двусмысленно и может подразумевать покупку привозного товара вне Египта. Основной текст естественно выражает место покупки, а буквальная форма и оттенок источника сохранены в сноске.'
