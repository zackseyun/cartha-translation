base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: ru
  text: Приведите ко мне вашего самого младшего брата, и я узнаю, что вы не шпионы, а честные люди. Тогда я отдам вам вашего брата, и вы сможете торговать в этой стране[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и вы сможете передвигаться по этой стране». Еврейский глагол допускает более широкое значение — ходить или ездить по стране, однако в данном контексте наиболее вероятен смысл торговли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Приведите
  rationale: Побудительная форма глагола בוא в породе хифиль означает веление привести кого-либо; русское совершенное повелительное точно передаёт требуемое действие.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: вашего младшего брата
  rationale: В контексте братьев הַקָּטֹן обозначает младшего; русский оборот естественнее буквального «маленького». Хотя по повествованию он самый младший, исходное выражение само по себе допускает «младший».
- source_word: וְאֵדְעָה
  choice: и тогда я узнаю
  rationale: Когортатив после повеления выражает ожидаемый результат; «и тогда» естественно передаёт эту связь, не превращая её строго в цель.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם כִּי כֵנִים אַתֶּם
  choice: что вы не соглядатаи, а честные люди
  rationale: מְרַגְּלִים означает шпионов/лазутчиков; традиционное и понятное в библейском повествовании «соглядатаи» сохраняет достоинство регистра. כֵנִים здесь означает честных, надёжных людей и образует прямое противопоставление.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: Я отдам вам вашего брата
  rationale: По контексту брат удерживается в Египте; «отдам вам» естественно выражает его возвращение, не добавляя отдельного наречия «назад».
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: и вы сможете торговать в этой земле
  rationale: Глагол סחר обычно связан с торговлей; в контексте покупки зерна коммерческий смысл наиболее вероятен. Конструкция также выражает разрешённую возможность.
