  source_fidelity: 'Основной смысл передан верно: один брат должен быть послан за другим, остальные остаются под стражей, а их заявление подлежит проверке; сохранены и клятвенная формула, и обвинение. Однако «правда на вашей стороне» смещает смысл еврейского הָאֱמֶת אִתְּכֶם в сторону правоты/обоснованности позиции, тогда как речь о том, говорят ли братья правду. «Так проверятся» также несколько ослабляет целевой оттенок конструкции.'
