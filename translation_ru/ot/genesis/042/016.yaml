  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: ru
  text: 'Пошлите одного из вас, и пусть он приведёт вашего брата, а вы останьтесь под стражей[a], чтобы проверить ваши слова: говорите ли вы правду[b]. Если же нет, то, клянусь жизнью фараона[c], вы — шпионы!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будьте связаны»; то есть оставайтесь в заключении или под стражей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «истина с вами», то есть говорите ли вы правду.'
    reason: lexical_alternative
  - marker: c
    text: «Клянусь жизнью фараона» — египетская формула клятвы.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: Пошлите одного из вас
  rationale: Повелительная форма и оборот с מן естественно передаются прямым приказом и указанием на выбор одного человека из группы.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: и пусть он приведёт вашего брата
  rationale: Глагол לקח обычно означает «взять», но здесь речь идёт о том, чтобы отправленный человек доставил брата к Иосифу; «приведёт» ясно передаёт направление движения.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: а вы останьтесь под стражей
  rationale: Нифаль от אסר может обозначать связанность или содержание под стражей. Контекстуальное «останетесь под стражей» звучит естественно и не утверждает непременно буквального связывания.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: Так проверятся ваши слова
  rationale: Сохранён образ «слов» и пассивное значение נבחן; «так» естественно выражает цель и результат предписанного испытания.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: действительно ли правда на вашей стороне
  rationale: Передаёт буквально-образное «истина с вами», сохраняя смысл проверки правдивости их утверждений.
- source_word: חֵי פַרְעֹה
  choice: клянусь жизнью фараона
  rationale: Это формула клятвы, буквально связанная с жизнью фараона; русское выражение явно и естественно обозначает её функцию.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: вы — соглядатаи!
  rationale: כי в контексте усиливает вывод обвинения. Тире и восклицательный знак передают эмфатичность без добавочного наречия; «соглядатаи» — понятное литературное обозначение тайных разведчиков в повествовательном библейском контексте.
theological_decisions:
- issue: Статус слов Иосифа как клятвы жизнью фараона
  choice: Сохранить как произнесённую Иосифом египетскую клятвенную формулу
  alternative: Смягчить до «как жив фараон» без прямого обозначения клятвы
  rationale: Текст прямо использует формулу חֵי פַרְעֹה. Перевод не должен ни оправдывать, ни осуждать её богословски, а только ясно передать повествование.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис остаётся ясным для обычного читателя; образное выражение о правде сохранено, а древняя клятвенная формула разъяснена сноской.
