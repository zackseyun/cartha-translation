  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: ru
  text: И сыновья Израиля пришли покупать зерно в числе прибывавших, потому что в земле Ханаанской был голод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли
  rationale: Форма wayyiqtol продолжает последовательное повествование; «пришли» передаёт прибытие в Египет с точки зрения места назначения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновья Израиля
  rationale: В данном контексте речь именно о сыновьях Иакова, поэтому буквальное и точное обозначение предпочтительнее более широкого «дети Израиля».
- source_word: לִשְׁבֹּר
  choice: покупать зерно
  rationale: Глагол означает «покупать», а в контексте голода и повествования об Иосифе подразумевает покупку зерна или продовольствия; явное дополнение естественно по-русски.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: вместе с другими пришедшими
  rationale: Оборот обозначает нахождение среди множества прибывающих; выбранная формулировка естественно передаёт, что сыновья Израиля были частью общего потока пришедших за зерном.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину их прихода.
- source_word: הָיָה הָרָעָב
  choice: голод был
  rationale: Сохраняется определённость уже известного из контекста голода и структура причинного сообщения.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: и в земле Ханаанской
  rationale: Сохраняется конкретное географическое выражение «земля Ханаанская»; частица «и» по-русски уместно подчёркивает, что голод охватил также Ханаан, откуда они пришли.
