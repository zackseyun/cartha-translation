base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: ru
  text: После того как Аврам вернулся, одержав победу над Кедорлаомером и царями, которые были с ним, царь Содома вышел ему навстречу к долине Шаве, то есть к Царской долине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол с повествовательным waw продолжает последовательность событий; по-русски она естественно передаётся порядком предложений без обязательного союза «и» или наречия «тогда».
- source_word: מֶלֶךְ סְדֹם
  choice: царь Содома
  rationale: Сопряжённая конструкция прямо и естественно передаётся родительным падежом.
- source_word: לִקְרָאתוֹ
  choice: ему навстречу
  rationale: Это устойчивый современный русский эквивалент выражения о выходе для встречи с кем-либо.
- source_word: אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת
  choice: когда он возвращался после победы над
  rationale: Фраза сохраняет временную связь и военный смысл נכה; местоимение оставлено без эксплицитного имени, как в еврейском тексте.
- source_word: כְּדָרלָעֹמֶר
  choice: Кедорлаомером
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, достаточно близкая к еврейскому произношению.
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: и царями, бывшими с ним
  rationale: Причастный оборот естественно передаёт относительное придаточное; «с ним» относится к Кедорлаомеру по контексту.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: в долину Шаве
  rationale: Предлог אֶל имеет направительное значение; русское «в» с винительным падежом сохраняет движение к месту встречи.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: то есть в Царскую долину
  rationale: Уточняющее отождествление передано непосредственно и без скобок; повтор предлога делает русскую фразу ясной.
theological_decisions:
- issue: Референт местоимений в אַחֲרֵי שׁוּבוֹ и לִקְרָאתוֹ
  choice: Сохранить местоимение «он/ему», подразумевающее Аврама из контекста
  alternative: Явно назвать Аврама
  rationale: Еврейский стих не повторяет имя; сохранение местоимения не вносит отсутствующей в тексте экспликации и удерживает его связность с предыдущим повествованием.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис перестроен так, чтобы начальное местоимение однозначнее относилось к возвращавшемуся Авраму, а царь Содома оставался подлежащим главной части. Маркеры сносок не добавлены, поскольку для данного перевода нет необходимой текстологической, культурной или смысловой оговорки.
