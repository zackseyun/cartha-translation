source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: ru
  text: 'Тогда царь Содома сказал Авраму: «Дай мне людей[a], а имущество[b] возьми себе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «душу» — единственное число, употреблённое здесь собирательно в значении людей или лиц.
    reason: lexical_alternative
  - marker: b
    text: Или «добро», «собственность».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: מֶלֶךְ סְדֹם
  choice: царь Содома
  rationale: Сопряжённая конструкция прямо обозначает правителя Содома; традиционная русская форма топонима сохранена.
- source_word: אֶל אַבְרָם
  choice: Авраму
  rationale: Предлог אֶל при глаголе речи естественно передаётся русским дательным падежом; использована традиционная форма имени «Аврам».
- source_word: תֶּן לִי
  choice: Дай мне
  rationale: Императив с местоименным показателем адресата передан прямо, без добавления подразумеваемой идеи возвращения собственности.
- source_word: הַנֶּפֶשׁ
  choice: людей
  rationale: Существительное נֶפֶשׁ стоит в единственном числе, но здесь имеет собирательное значение и противопоставлено имуществу; по контексту речь идёт о возвращённых людях.
- source_word: וְהָרְכֻשׁ
  choice: а имущество
  rationale: רְכוּשׁ обозначает имущество, собственность или материальные ценности. Противительный союз «а» естественно выражает контраст между людьми и имуществом.
- source_word: קַח לָךְ
  choice: возьми себе
  rationale: Императив קַח и дательный личной выгоды לָךְ естественно передаются русским оборотом «возьми себе».
