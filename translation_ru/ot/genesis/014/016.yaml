  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: ru
  text: Он вернул всё имущество; вернул также Лота, своего родственника[a], и его имущество, а также женщин[b] и людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своего брата». Здесь слово «брат» употреблено в более широком смысле — «близкий родственник»; согласно повествованию, Лот был племянником Аврама.'
    reason: lexical_alternative
  - marker: b
    text: 'В данном контексте речь может в том числе идти о жёнах, однако еврейское слово имеет более широкое значение: «женщины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: вернул / вернул
  rationale: Обе формы — каузативные формы корня שׁוב со значением «сделать так, чтобы вернулось», то есть «вернуть, привести обратно». Повтор глагола сохранён, как и двухчастное построение еврейского текста.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: всё имущество / его имущество
  rationale: רְכוּשׁ обозначает имущество, пожитки или собственность; «имущество» естественно охватывает возвращённые материальные ценности и позволяет последовательно передать повтор существительного.
- source_word: וְגַם
  choice: также / а также
  rationale: Сохранено присоединительно-усилительное значение частицы, дважды употреблённой в стихе.
- source_word: לוֹט אָחִיו
  choice: Лота, своего родственника
  rationale: Буквально אָחִיו означает «его брата», но אָח может обозначать и более широкое родство. По контексту Лот — племянник Аврама, поэтому «родственник» точно передаёт смысл без ложного указания на родного брата.
- source_word: הַנָּשִׁים
  choice: женщин
  rationale: Существительное означает женщин и само по себе не ограничивает группу жёнами.
- source_word: הָעָם
  choice: остальных людей
  rationale: עָם обозначает народ или совокупность людей. В данном перечислении «остальных людей» звучит по-русски естественно и показывает, что женщины входят в возвращённую группу, не сводя עָם только к мужчинам.
