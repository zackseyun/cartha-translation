  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: ru
  text: И они забрали всё имущество Содома и Гоморры, всю их пищу[a] и ушли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все их продовольственные запасы». Еврейское слово может обозначать пищу вообще или припасы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: забрали
  rationale: Форма повествовательного прошедшего времени от לקח означает «взяли». В контексте захвата добычи «забрали» звучит естественно и передаёт действие без усиления до «разграбили».
- source_word: כָּל
  choice: всё / все
  rationale: Повтор квантификатора сохранён перед «имуществом» и «запасами», чтобы передать полноту захваченной добычи.
- source_word: רְכֻשׁ
  choice: имущество
  rationale: Слово обозначает имущество, собственность или пожитки; «имущество» достаточно широко и уместно в современном литературном русском.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Содома и Гоморры
  rationale: Употреблены традиционные русские формы географических названий в родительном падеже.
- source_word: אָכְלָם
  choice: их запасы
  rationale: Существительное от אכל с местоименным суффиксом может означать пищу или продовольственные запасы. «Запасы» естественно в военном контексте, а более буквальное значение отмечено в сноске.
- source_word: וַיֵּלֵכוּ
  choice: ушли
  rationale: Форма от הלך в данном контексте обозначает уход после захвата добычи; «ушли» кратко и естественно передаёт это значение.
