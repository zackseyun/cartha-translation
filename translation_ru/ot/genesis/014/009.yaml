source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: ru
  text: Кедорлаомер, царь Элама, Тидал, царь Гоима[a], Амрафел, царь Шинара, и Ариох, царь Элласара, — четыре царя против пяти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тидал, царь народов». Еврейское слово גּוֹיִם может означать «народы», но здесь его также можно понимать как географическое название — «Гоим».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: против
  rationale: 'В перечне участников сражения заключительное אֶת выражает противостояние: «четыре царя против пяти». Первое אֵת синтаксически продолжает предыдущий стих; в самостоятельном русском стихе перечень естественно оформлен в именительном падеже.'
- source_word: כְּדָרְלָעֹמֶר
  choice: Кедорлаомер
  rationale: Личное имя передано транслитерацией с еврейского с учетом укоренившейся русской формы.
- source_word: מֶלֶךְ עֵילָם
  choice: царь Элама
  rationale: Прямая передача сопряженной конструкции без историко-географической подмены названия.
- source_word: תִדְעָל
  choice: Тидал
  rationale: Имя транслитерировано непосредственно с еврейского; форма не заменена традиционной передачей через греческий язык.
- source_word: גּוֹיִם
  choice: Гоим
  rationale: В царском титуле слово, вероятно, выступает как географическое название. Основной текст сохраняет это прочтение, а нарицательное значение отмечено в сноске.
- source_word: אַמְרָפֶל
  choice: Амрафел
  rationale: Личное имя передано русской транслитерацией.
- source_word: שִׁנְעָר
  choice: Шинар
  rationale: Сохранено еврейское географическое название без отождествления с Вавилонией.
- source_word: אַרְיוֹךְ
  choice: Ариох
  rationale: Личное имя передано в естественной русской форме, близкой к еврейскому звучанию.
- source_word: אֶלָּסָר
  choice: Элласар
  rationale: Географическое название транслитерировано без предположительного отождествления с иной областью.
- source_word: אַרְבָּעָה מְלָכִים
  choice: четыре царя
  rationale: Прямая передача сочетания числительного с существительным.
- source_word: הַחֲמִשָּׁה
  choice: пяти
  rationale: Еврейский текст буквально говорит «пять», а слово «царей» подразумевается из контекста; русская эллиптическая форма сохраняет эту краткость.
