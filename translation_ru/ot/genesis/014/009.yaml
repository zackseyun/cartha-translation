translation_notes:
  register: Современный литературный русский язык; краткий перечень и итоговое противопоставление сохранены. Имена и топонимы переданы преимущественно непосредственно с еврейского, без внесения предположительных исторических отождествлений. Маркер сноски поставлен после «Гоима», к которому относится вариант прочтения.
