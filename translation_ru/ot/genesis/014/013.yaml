base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: ru
  text: И пришёл беглец и рассказал Авраму-еврею. Аврам жил тогда у дубов Мамре — аморея, брата Эшкола и брата Анера. Они были союзниками Аврама[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Буквально: «владельцами договора с Аврамом», то есть людьми, связанными с ним договором.'
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: один из спасшихся
  rationale: Существительное обозначает человека, избежавшего опасности или уцелевшего в сражении. В данном контексте это естественнее по-русски, чем «беглец», которое может ошибочно предполагать преступника или дезертира.
- source_word: וַיַּגֵּד
  choice: рассказал
  rationale: Передаёт обычное значение глагола «сообщить, рассказать» и сохраняет простой повествовательный стиль.
- source_word: הָעִבְרִי
  choice: еврею
  rationale: Стандартное этническое или социальное обозначение Аврама; форма приложения естественно передаётся сочетанием «Авраму-еврею».
- source_word: שֹׁכֵן
  choice: жил тогда
  rationale: Причастие указывает на продолжительное проживание Аврама в тот период; слово «тогда» ясно выражает временную соотнесённость без тяжеловесного «обитал».
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: у дубов Мамре
  rationale: אֵלוֹן может обозначать крупное дерево, традиционно определяемое как дуб или терпентинное дерево. «У дубов» понятно современному читателю, а неоднозначность сохранена в сноске.
- source_word: הָאֱמֹרִי
  choice: аморея
  rationale: Стандартное этническое обозначение Мамре; родительный падеж соответствует русской конструкции приложения.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: брата Эшкола и брата Анера
  rationale: Сохраняет повтор и прямое значение אָח. Возможность более широкого родства отмечена в сноске.
- source_word: בַּעֲלֵי בְרִית
  choice: союзниками
  rationale: Буквально выражение означает людей, связанных с Аврамом договором. «Союзники» естественно передаёт здесь договорно-политические отношения.
