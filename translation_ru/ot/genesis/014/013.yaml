  to: И пришёл беглец и рассказал Авраму-еврею. Аврам жил тогда у дубов Мамре — аморея, брата Эшкола и брата Анера. Они были союзниками Аврама[c].
  rationale: Начальное обозначение заменено на «беглец», чтобы не добавлять подразумеваемую группу «спасшихся». Для ясности приложения Мамре оформлены тире. Сноски a и b сохранены как лексически обоснованные, однако их якоря должны стоять соответственно после «дубов Мамре» и после «Анера»; в поле текста их отображение не поддержано, тогда как якорь c сохранён после «союзниками».
