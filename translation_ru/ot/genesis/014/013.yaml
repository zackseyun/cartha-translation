translation_notes:
  register: Современный литературный русский язык с простым и достоинственным повествовательным синтаксисом. Начальное «И» сохраняет связь стиха с предшествующим рассказом. Имена переданы в привычных русских библейских формах; неоднозначные ботанический термин и степень родства не устранены, а вынесены в сноски.
