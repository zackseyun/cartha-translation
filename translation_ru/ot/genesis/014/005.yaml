  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: ru
  text: В четырнадцатом году Кедорлаомер пришёл вместе с царями, которые были с ним, и они разбили рефаимов[a] в Аштерот-Карнаиме, зузимов в Хаме и эмимов в Шаве-Кирьятаиме.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рефаимов иногда называют «исполинами», однако здесь еврейское слово сохранено как название народа.
    reason: lexical_alternative
  - marker: b
    text: Шаве-Кирьятаим можно также понять как «равнина Кирьятаима».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: В четырнадцатом году
  rationale: Оборот передаёт временное указание естественным современным русским языком; начальный союз подразумевается ходом повествования и не требует отдельного «и».
- source_word: בָּא
  choice: пришёл
  rationale: Обычное значение глагола בוא сохранено без усиления до более узкого военного «выступил в поход».
- source_word: כְדָרְלָעֹמֶר
  choice: Кедорлаомер
  rationale: Имя передано транслитерацией, близкой к еврейской форме и привычной русской библейской передаче.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: вместе с царями, которые были с ним
  rationale: Фраза ясно обозначает сопровождавших Кедорлаомера союзных правителей и сохраняет относительное придаточное оригинала.
- source_word: וַיַּכּוּ
  choice: они разбили
  rationale: В перечне военных побед נכה означает нанесение поражения; «разбили» естественно передаёт это по-русски, не вводя лишних подробностей.
- source_word: רְפָאִים
  choice: рефаимов
  rationale: Название народа транслитерировано, а не истолковано как «исполинов», поскольку непосредственный контекст не требует такого уточнения.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: в Аштерот-Карнаиме
  rationale: Предлог передан как указание места, а составной топоним транслитерирован.
- source_word: הַזּוּזִים בְּהָם
  choice: зузимов в Хаме
  rationale: Этноним и вероятный топоним сохранены в транслитерации; падежные формы соответствуют русскому синтаксису.
- source_word: הָאֵימִים
  choice: эмимов
  rationale: Название народа сохранено как этноним без интерпретирующей замены.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: в Шаве-Кирьятаиме
  rationale: Сочетание передано как составной топоним, при этом возможное нарицательное значение שָׁוֵה отмечено в сноске.
theological_decisions:
- issue: Значение этнонима רְפָאִים
  choice: Сохранить название народа «рефаимы»
  alternative: Перевести как «исполины»
  rationale: Передача этнонимом сохраняет неоднозначность исходного слова и не навязывает спорную характеристику этого народа.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Имена народов и мест переданы последовательно и без архаизирующих форм; военная лексика точна, но не усилена сверх значения исходного текста.
