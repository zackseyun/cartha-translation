  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: ru
  text: И да будет благословен Бог Всевышний, который отдал твоих врагов в твои руки! И он дал ему[a] десятую часть всего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте субъект глагола «дал» прямо не назван. По контексту наиболее естественно понимать, что Аврам дал Мелхиседеку.
    reason: alternative_reading
  - marker: b
    text: 'Или, в традиционной формулировке: «десятину со всего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: И благословен
  rationale: Сохранены соединительный союз и краткая форма причастия в формуле благословения; выражение звучит естественно и торжественно по-русски.
- source_word: אֵל עֶלְיוֹן
  choice: Бог Всевышний
  rationale: אֵל передано как «Бог», а עֶלְיוֹן — как общепонятный и точный титул «Всевышний», без ненужной транслитерации имени-титула.
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение вводит определительное высказывание о Боге и естественно передаётся русским «который».
- source_word: מִגֵּן
  choice: отдал
  rationale: Здесь глагол означает передачу противников во власть другого, а не защиту или ограждение; «отдал» естественно сочетается с выражением «в твои руки».
- source_word: צָרֶיךָ
  choice: твоих врагов
  rationale: Передаёт множественное число и обращение к одному лицу; «враги» — ясный современный эквивалент.
- source_word: בְּיָדֶךָ
  choice: в твои руки
  rationale: Русская идиома во множественном числе естественно передаёт еврейский образ вручения врагов и подчинения их власти адресата.
- source_word: וַיִּתֶּן
  choice: И он дал
  rationale: Сохранены повествовательная последовательность и невыраженный явно субъект, представленный местоимением без добавления имени Аврама в основной текст.
- source_word: לוֹ
  choice: ему
  rationale: Косвенное дополнение передано буквально; по контексту оно наиболее естественно относится к Мелхиседеку.
- source_word: מַעֲשֵׂר
  choice: десятую часть
  rationale: Прозрачно передаёт буквальное значение слова и не вносит автоматически позднейшие институциональные ассоциации термина «десятина».
- source_word: מִכֹּל
  choice: всего
  rationale: Естественно выражает долю, взятую от всей совокупности имущества или добычи, без неоправданного уточнения её состава.
theological_decisions:
- issue: Кто является подразумеваемым субъектом глагола וַיִּתֶּן («дал»)
  choice: 'Сохранить местоименную формулировку: «И он дал ему», понимая по контексту, что Аврам дал Мелхиседеку.'
  alternative: Считать субъектом Мелхиседека или прямо вставить в основной текст имя «Аврам».
  rationale: В еврейском тексте субъект повторно не назван. Контекст наиболее естественно указывает на Аврама как дающего, однако замена местоимения именем устранила бы формальную неоднозначность оригинала; поэтому она поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся простым и доступным; еврейский образ передачи врагов «в руки» сохранён в естественной для русского форме. Неоднозначность подразумеваемого субъекта не устранена вставкой имени.
