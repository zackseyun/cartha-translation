base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: ru
  text: Затем они повернули назад и пришли к Эн-Мишпату[a] (то есть Кадеш), и поразили всю землю амаликитян[b], а также амореев, живших в Хацацон-Фамаре[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эн-Мишпат означает «источник суда».
    reason: cultural_note
  - marker: b
    text: 'Буквально: «всё поле амаликитянина»; вероятно, имеется в виду область, населённая амаликитянами.'
    reason: lexical_alternative
  - marker: c
    text: Хацацон-Фамар отождествляется с Эн-Геди во 2 Паралипоменон 20:2.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Затем они повернули назад
  rationale: Глагол שוב в последовательном повествовании обозначает возвращение или перемену направления; «повернули назад» естественно передаёт направленность действия.
- source_word: וַיָּבֹאוּ אֶל
  choice: и пришли к
  rationale: Обычное сочетание глагола движения בוא с אֶל; русский оборот ясно передаёт прибытие к названному месту.
- source_word: עֵין מִשְׁפָּט
  choice: Эн-Мишпат
  rationale: Топоним передан транслитерацией, а его буквальное значение вынесено в примечание.
- source_word: הִוא קָדֵשׁ
  choice: (то есть Кадесу)
  rationale: Местоименная конструкция отождествляет Эн-Мишпат с Кадесом; скобки естественно передают пояснительную вставку.
- source_word: וַיַּכּוּ
  choice: и поразили
  rationale: נכה может означать нанесение удара или военное поражение; «поразили» сохраняет широту значения и не утверждает полного завоевания.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: всю землю амаликитян
  rationale: שׂדה буквально означает «поле», но здесь, вероятно, обозначает область, занятую народом; «земля» естественно и достаточно близко передаёт географический смысл.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: а также амореев
  rationale: וְגַם вводит дополнительный объект нападения; этноним в единственном числе имеет собирательное значение и по-русски передаётся множественным числом.
- source_word: הַיֹּשֵׁב
  choice: живших
  rationale: Причастие описывает амореев как постоянных жителей названного места.
- source_word: בְּחַצְצֹן תָּמָר
  choice: в Хацацон-Фамаре
  rationale: Топоним транслитерирован; предлог בְּ естественно передаётся русским «в».
