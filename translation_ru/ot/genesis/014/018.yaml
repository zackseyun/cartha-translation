source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: ru
  text: А Мелхиседек, царь Салима, вынес хлеб и вино. Он был священником Бога Всевышнего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Эль-Эльон — «Бог Всевышний».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Мелхиседек
  rationale: Устоявшаяся русская передача личного имени; имя транслитерируется, а не переводится как «царь праведности».
- source_word: מֶלֶךְ שָׁלֵם
  choice: царь Салима
  rationale: Сохраняет приложение и передаёт שָׁלֵם как традиционное географическое название «Салим».
- source_word: הוֹצִיא
  choice: вынес
  rationale: Форма хифиль от יצא обозначает действие «вывести/вынести»; «вынес» естественно по-русски и сохраняет конкретность исходного глагола.
- source_word: לֶחֶם וָיָיִן
  choice: хлеб и вино
  rationale: Прямой и естественный перевод двух обычных существительных без добавочного толкования.
- source_word: כֹהֵן
  choice: священником
  rationale: Стандартное обозначение культового служителя; творительный падеж требуется русской конструкцией «был священником».
- source_word: אֵל עֶלְיוֹן
  choice: Бога Всевышнего
  rationale: Передаёт אֵל как «Бог», а עֶלְיוֹן как титул «Всевышний»; форма родительного падежа обусловлена управлением слова «священник».
- source_word: וְהוּא
  choice: Он был
  rationale: Местоимение с союзом вводит отдельное сообщение о Мелхиседеке; новое предложение звучит ясно и естественно в современном русском языке.
theological_decisions:
- issue: Следует ли формулировкой о хлебе и вине подчёркивать позднейшие евхаристические ассоциации
  choice: 'Сохранено простое историческое сообщение: «вынес хлеб и вино»'
  alternative: Использовать формулировку, прямо намекающую на таинство или жертвенное действие
  rationale: Сам стих сообщает только о вынесенных хлебе и вине и не объясняет их сакраментально; перевод не должен вносить в основной текст более позднее богословское истолкование.
- issue: Считать ли אֵל עֶלְיוֹן непереводимым собственным именем или переводимым божественным обозначением
  choice: Бог Всевышний
  alternative: Эль-Эльон
  rationale: Перевод раскрывает значение еврейского обозначения для современного читателя, не исключая того, что сочетание может восприниматься как титул или именование Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Пунктуация выделяет приложение «царь Салима». Формулировка лаконична и не привносит в упоминание хлеба и вина позднейшего конфессионального толкования.
