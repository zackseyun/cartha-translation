  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: ru
  text: 'что я не возьму у тебя ни нитки, ни ремешка от сандалии[a] — ничего из того, что принадлежит тебе, чтобы ты не сказал: «Я обогатил Аврама».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблена эллиптическая формула клятвы, буквально: «если от нитки и до ремешка сандалии, и если я возьму что-либо твоё…». По смыслу это клятвенный отказ.'
    reason: Пояснение формально условной, но функционально отрицательной клятвенной конструкции.
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: не возьму ... ничего
  rationale: В контексте клятвы, начатой в ст. 22, это эллиптическая формула клятвенного отказа. По-русски подразумеваемое отрицание необходимо выразить явно.
- source_word: מִחוּט וְעַד שְׂרוֹךְ נַעַל
  choice: ни нитки, ни ремешка от сандалии
  rationale: Сохраняются конкретные образы ничтожных по ценности предметов; конструкция «ни... ни...» естественно передаёт полный отказ в русском языке.
- source_word: אֶקַּח
  choice: я не возьму
  rationale: Будущее совершенного вида естественно выражает твёрдый клятвенный отказ.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: ничего из того, что принадлежит тебе
  rationale: Передаёт всеохватность כָּל и принадлежность царю Содома ясным современным русским языком.
- source_word: וְלֹא תֹאמַר
  choice: чтобы ты не сказал
  rationale: Естественно передаёт отрицательную цель отказа Аврама без архаичного оборота.
- source_word: הֶעֱשַׁרְתִּי
  choice: Я обогатил
  rationale: Точно передаёт каузативное значение Hiphil глагола עשר — «сделать богатым».
- source_word: אַבְרָם
  choice: Аврам
  rationale: Использована традиционная русская библейская форма имени на данном этапе повествования.
theological_decisions:
- issue: Эллиптическая формула клятвы
  choice: 'Передать как прямой клятвенный отказ: «я не возьму».'
  alternative: 'Буквально сохранить условную конструкцию: «если от нитки... и если возьму...».'
  rationale: Стих продолжает клятву ст. 22; буквальная условная форма по-русски была бы неполной и могла бы скрыть смысл, тогда как явное отрицание передаёт прагматическую силу еврейской формулы.
translation_notes:
  register: Современный литературный русский язык; тон торжественный, но понятный. «Сандалия» сохраняет древний предметный контекст, а «ремешок» звучит естественнее, чем архаичное «ремень обуви».
