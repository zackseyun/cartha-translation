  text: שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת כְּדָרְלָעֹ֑מֶר וּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: ru
  text: Двенадцать лет они служили Кедорлаомеру, а на тринадцатый год восстали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Двенадцать лет
  rationale: Еврейское выражение обозначает продолжительность; в русском языке естественно передаётся без предлога «в течение».
- source_word: עָבְדוּ
  choice: служили
  rationale: Глагол עבד буквально означает «служить»; в данном политическом контексте речь идёт о вассальной зависимости. «Служили» сохраняет образ и остаётся понятным.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: Кедорлаомеру
  rationale: Имя передано транслитерацией, а дательный падеж обусловлен управлением русского глагола «служить».
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: а на тринадцатый год
  rationale: Буквально конструкция имеет вид «и тринадцать лет/год», но контекст указывает на событие в тринадцатом году после двенадцати лет службы. Союз «а» естественно выражает контраст.
- source_word: מָרָדוּ
  choice: восстали
  rationale: מרד означает мятеж или отказ от подчинения. «Восстали» естественно передаёт политический бунт против властителя.
