id: GEN.14.22
reference: Genesis 14:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: ru
  text: 'Но Аврам сказал царю Содома: «Я поднял руку[a] к Яхве, Богу Всевышнему, Владыке[b] неба и земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Поднять руку — жест принесения клятвы; Аврам клянётся.
    reason: cultural_note
  - marker: b
    text: 'Или: «Творцу». Еврейское слово может обозначать владельца, владыку или, в данном контексте, творца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но ... сказал
  rationale: Последовательный waw продолжает повествование, однако в данном контексте ответ Аврама противопоставлен предложению царя Содома; русское «но» естественно передаёт эту связь.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Традиционная русская передача имени до его переименования в Авраама.
- source_word: מֶלֶךְ סְדֹם
  choice: царь Содома
  rationale: Естественная русская передача определённой по контексту сопряжённой конструкции.
- source_word: הֲרִימֹתִי יָדִי
  choice: Я поднял руку
  rationale: Сохранён конкретный древнееврейский образ жеста клятвы, а его значение пояснено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, а не замещающий его титул.
- source_word: אֵל עֶלְיוֹן
  choice: Бог Всевышний
  rationale: Точный и укоренившийся в русском библейском языке перевод титула.
- source_word: קֹנֵה
  choice: Владыка
  rationale: В контексте титула выражает принадлежность и верховное обладание небом и землёй, оставаясь естественным и достойным по-русски; возможное значение «Творец» сохранено в сноске.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: неба и земли
  rationale: Устоявшаяся русская формула, обозначающая всю совокупность мироздания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное Божье имя и не заменяет его титулом.
- issue: Смысл קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: Владыка неба и земли
  alternative: Творец неба и земли; Владелец неба и земли
  rationale: Причастие קֹנֵה допускает значения обладания и сотворения. «Владыка» естественно передаёт верховное обладание, а сноска сохраняет значимую альтернативу «Творец», не снимая лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис прост и понятен; архаизмов нет. Конкретный образ клятвенного жеста сохранён, а смысловая неоднозначность קֹנֵה вынесена в сноску.
