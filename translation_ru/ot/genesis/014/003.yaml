translation:
  language: ru
  text: Все они объединились в долине Сиддим (то есть у Солёного моря[a]).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мёртвое море — более позднее, общеупотребительное название.
    reason: Уточняет более позднее и привычное название географического объекта, сохраняя в основном тексте буквальное соответствие еврейскому названию «Солёное море».
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Сочетание כָּל с указательным אֵלֶּה имеет собирательное значение. Местоименное «они» естественно отсылает к перечисленным ранее царям, не добавляя слова «цари» в сам текст.
- source_word: חָבְרוּ
  choice: объединились
  rationale: Глагол חבר в породе каль означает соединиться, собраться вместе. «Объединились» сохраняет основной смысл и уместно в военно-политическом контексте, не усиливая его до явно оформленного союза.
- source_word: אֶל
  choice: в
  rationale: Хотя אֶל часто обозначает направление «к», при глаголе объединения и названии места русский предлог «в» естественно передаёт место сбора.
- source_word: עֵמֶק
  choice: долине
  rationale: עֵמֶק обычно означает долину; это точнее, чем более общее «равнина».
- source_word: הַשִּׂדִּים
  choice: Сиддим
  rationale: Географическое название передано транслитерацией; еврейский артикль естественно не воспроизводится отдельно в русской конструкции «в долине Сиддим».
- source_word: הוּא
  choice: то есть там, где теперь
  rationale: Местоимение вводит пояснительное отождествление места. Добавленное «там, где теперь» естественно выражает подразумеваемое временное различие между древней долиной и известным рассказчику морем, не утверждая, что долина и море существовали одновременно в одном виде.
- source_word: יָם הַמֶּלַח
  choice: Солёное море
  rationale: Буквальное и естественное соответствие еврейскому названию «море соли»; более позднее привычное название «Мёртвое море» вынесено в примечание.
