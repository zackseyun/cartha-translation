- source_word: וְאֶת
  choice: и хорреев
  rationale: Союз продолжает перечень побеждённых народов из предыдущего стиха; показатель прямого дополнения по-русски отдельно не передаётся, а сказуемое подразумевается из контекста.
- source_word: הַחֹרִי
  choice: хорреев
  rationale: Этноним употреблён собирательно; русская форма «хорреи» традиционна и понятна.
- source_word: בְּהַרְרָם
  choice: в их горах
  rationale: Сохранены множественное число и местоименный суффикс исходного текста; это естественная и достаточно буквальная русская передача.
- source_word: שֵׂעִיר
  choice: Сеир
  rationale: 'Название местности поставлено после сочетания «в их горах» как уточняющее наименование: «в их горах Сеир».'
- source_word: עַד
