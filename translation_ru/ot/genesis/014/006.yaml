  rationale: Предлог обозначает географический предел похода.
- source_word: אֵיל פָּארָן
  choice: Эл-Парана
  rationale: Сочетание передано как единое географическое название, без навязывания спорной этимологии первого элемента.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: что у пустыни
  rationale: Кратко и естественно передаёт относительное предложение и широкое пространственное значение עַל.
