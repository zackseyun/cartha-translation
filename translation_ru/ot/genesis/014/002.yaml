base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: ru
  text: они вели войну против Беры, царя Содома, Бирши, царя Гоморры, Шинава, царя Адмы, Шемевера, царя Цевоима, и царя Белы (то есть Цоар).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: пошли войной
  rationale: Еврейская идиома буквально означает «сделали войну». Русское «пошли войной» естественно передаёт начало или ведение военных действий, не утяжеляя фразу буквальным оборотом.
- source_word: אֶת ... וְאֶת
  choice: против
  rationale: В данном обороте показатель прямого дополнения вводит противников, с которыми воевали; «против» ясно распространяется на весь последующий перечень царей.
- source_word: בֶּרַע
  choice: Бера
  rationale: Имя передано транслитерацией с еврейского.
- source_word: בִּרְשַׁע
  choice: Бирша
  rationale: Имя передано транслитерацией с еврейского без попытки переводить возможное значение.
- source_word: שִׁנְאָב
  choice: Шинав
  rationale: Имя передано транслитерацией с еврейского.
- source_word: שֶׁמְאֵבֶר
  choice: Шемевер
  rationale: Имя передано транслитерацией с еврейского.
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים / בֶּלַע / צֹעַר
  choice: Содом / Гоморра / Адма / Цевоим / Бела / Цоар
  rationale: Использованы узнаваемые русские библейские формы географических названий при сохранении близости к еврейскому звучанию.
- source_word: מֶלֶךְ בֶּלַע
  choice: царь Белы
  rationale: В отличие от предыдущих участников, личное имя этого царя не названо; сохранено обозначение только по городу.
- source_word: הִיא צֹעַר
  choice: то есть Цоара
  rationale: Женское местоимение соотносит Белу с Цоаром и служит поясняющим отождествлением; в русском падеж определяется конструкцией «царь [города]».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Повтор приложения «царя…» сохраняет структуру перечня и устраняет неясность относительно того, что все пять правителей входят в число противников. Начальная строчная буква сохранена, поскольку стих синтаксически продолжает перечень из предыдущего стиха.
