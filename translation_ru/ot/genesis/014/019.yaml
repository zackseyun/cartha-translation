  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: ru
  text: 'И он благословил его и сказал: «Благословен Аврам Богом Всевышним, Владыкой неба и земли[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Творцом неба и земли». Еврейское слово может означать того, кто владеет или обладает, а в данном контексте также того, кто творит.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: И он благословил его
  rationale: Последовательная повествовательная форма с местоименным суффиксом 3-го лица мужского рода передана обычным русским прошедшим временем; союз сохраняет ход еврейского повествования.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Сохраняется координация двух последовательных действий, естественная и для русского повествования.
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткое страдательное причастие естественно передаёт торжественную формулу благословения без добавления пожелательного оттенка.
- source_word: אַבְרָם
  choice: Аврам
  rationale: Сохранена форма имени до его изменения на Авраам в Бытии 17.
- source_word: לְאֵל
  choice: Богом
  rationale: Творительный падеж естественно обозначает Бога как источник благословения и соответствует смыслу предлога לְ в данной формуле.
- source_word: אֵל עֶלְיוֹן
  choice: Богом Всевышним
  rationale: Традиционное и понятное русское соответствие божественному титулу, сохраняющее существительное и определяющее его прилагательное.
- source_word: קֹנֵה
  choice: Владыкой
  rationale: Причастие קֹנֵה допускает значения владения, обладания и, в данном контексте, сотворения. «Владыка» естественно звучит как божественный титул и передаёт господство и принадлежность, не сводя смысл только к сотворению; иной возможный смысл отмечен в сноске.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: неба и земли
  rationale: Устойчивая русская формула, обозначающая всю совокупность творения; морфологическая форма еврейского שָׁמַיִם не требует русского множественного числа.
theological_decisions:
- issue: Смысл קֹנֵה в составе божественного титула
  choice: Владыкой неба и земли
  alternative: Творцом неба и земли; Обладателем неба и земли
  rationale: Еврейское слово может указывать на обладание или владение, а в этом контексте также пониматься как указание на сотворение. Основной текст сохраняет идею верховного владения в естественной русской форме, а сноска не скрывает возможного значения «Творец».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, соответствующим формуле благословения. Синтаксис остаётся простым и понятным; неоднозначность ключевого титула сохранена посредством сноски.
