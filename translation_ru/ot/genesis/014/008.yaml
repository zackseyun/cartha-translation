source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: ru
  text: Тогда вышли царь Содома, царь Гоморры, царь Адмы, царь Цевоима и царь Белы (то есть Цоара) и выстроились для битвы с ними[a] в долине Сиддим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выстроились против них для битвы». Буквально по-еврейски: «выстроили с ними битву».'
    reason: Лаконичная еврейская конструкция допускает как более формальное «с ними», так и контекстуально явное «против них».
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: тогда вышли
  rationale: Последовательный вав продвигает повествование; «тогда» естественно передаёт ход событий. Хотя глагол стоит в единственном числе перед составным подлежащим, по-русски требуется множественное число.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Обычное русское обозначение правителя; повтор сохранён в соответствии с торжественным ритмом еврейского текста.
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: Содом / Гоморра / Адма / Цевоим
  rationale: Устойчивые русские библейские формы географических названий.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Бела (то есть Цоар)
  rationale: Пояснительное отождествление двух названий передано скобками, не устраняя его характера вставного пояснения.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: выстроились для битвы
  rationale: В военном контексте ערך означает построение сил в боевой порядок; формулировка естественна для современного русского и конкретнее общего «приготовились».
- source_word: אִתָּם
  choice: с ними
  rationale: Формально сохраняет значение предлога את; в контексте битвы выражение подразумевает противостояние, но не делает его явным сверх формы оригинала.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: в долине Сиддим
  rationale: «Долина» — современный и точный эквивалент עֵמֶק; топоним транслитерирован.
theological_decisions: []
