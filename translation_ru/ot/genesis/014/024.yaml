base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: ru
  text: Ничего не возьму, кроме того, что съели юноши[a], и доли людей, которые пошли со мной, — Анера, Эшкола и Мамре. Пусть они возьмут свою долю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги» или «сопровождающие». Еврейское слово может обозначать как юношей, так и слуг или сопровождающих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они возьмут свою долю». Еврейская форма может выражать простое будущее, хотя в этом контексте вероятнее значение разрешения.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Ничего не возьму себе, кроме
  rationale: Начальная конструкция буквально выражает исключение и зависит от отказа в предыдущем стихе. Для законченной и естественной русской фразы подразумеваемое действие восполнено; «кроме» передаёт ограничение, усиленное רַק.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: того, что съели слуги
  rationale: נְעָרִים может означать как молодых людей, так и слуг или сопровождающих. В военном контексте здесь естественно обозначает людей Аврама, расходовавших припасы; неоднозначность отмечена в сноске.
- source_word: וְחֵלֶק הָאֲנָשִׁים
  choice: и доли людей
  rationale: חֵלֶק означает долю или часть; «доля» естественно подходит к распределению военной добычи.
- source_word: אֲשֶׁר הָלְכוּ אִתִּי
  choice: ходивших со мной
  rationale: Передаёт глагол הלך и обозначает участие союзников Аврама в походе.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: Анера, Эшкола и Мамре
  rationale: Имена переданы принятой русской библейской транслитерацией; падеж показывает, что это те люди, чья доля имеется в виду.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Пусть они возьмут свою долю
  rationale: Имперфект по контексту выражает позволение, а не только сообщение о будущем действии.
theological_decisions:
- issue: Подразумеваемое продолжение отказа Аврама из предыдущего стиха
  choice: 'Восполнить сказуемое: «Ничего не возьму себе»'
  alternative: 'Оставить зависимый фрагмент: «кроме лишь того, что…»'
  rationale: Еврейское начало синтаксически опирается на предыдущий стих. Восполнение делает русское предложение понятным, не меняя смысла отказа Аврама от добычи.
- issue: Модальность הֵם יִקְחוּ
  choice: 'Разрешение: «Пусть они возьмут»'
  alternative: 'Простое будущее: «они возьмут»'
  rationale: В контексте Аврам отказывается от собственной доли, но признаёт право союзников на их долю; при этом грамматическая возможность простого будущего сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан цельным за счёт восполнения подразумеваемого отказа из предыдущего стиха; лексическая и модальная неоднозначность вынесена в сноски.
