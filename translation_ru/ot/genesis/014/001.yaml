lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось
  rationale: Передаёт вводную повествовательную формулу с союзом, сохраняя связь с дальнейшим рассказом и избегая архаичного «и было».
- source_word: בִּימֵי
  choice: во времена
  rationale: Естественный современный русский эквивалент буквального «во дни», вводящий историческую обстановку.
- source_word: אַמְרָפֶל
  choice: Амрафел
  rationale: Транслитерация личного имени в форме, принятой в русской библейской традиции.
- source_word: מֶלֶךְ שִׁנְעָר
  choice: царь Шинара
  rationale: Конструкция со значением титула и области правления; «Шинар» близко передаёт еврейский топоним и остаётся понятным как имя собственное.
- source_word: אַרְיוֹךְ
  choice: Ариох
  rationale: Устоявшаяся русская форма личного имени.
- source_word: מֶלֶךְ אֶלָּסָר
  choice: царь Элласара
  rationale: Прямая передача титула и транслитерированного топонима.
- source_word: כְּדָרְלָעֹמֶר
  choice: Кедорлаомер
  rationale: Форма близко передаёт согласный состав еврейского имени и узнаваема в русском библейском контексте.
- source_word: מֶלֶךְ עֵילָם
  choice: царь Элама
  rationale: Передаёт титул и общепринятую русскую форму древнего топонима.
- source_word: וְתִדְעָל
  choice: и Тидал
  rationale: Союз передан явно; имя транслитерировано непосредственно с еврейского, без опоры на форму из древних переводов.
- source_word: מֶלֶךְ גּוֹיִם
  choice: царь народов
  rationale: Передано обычное нарицательное значение גּוֹיִם; возможное понимание слова как географического названия сохранено в сноске.
