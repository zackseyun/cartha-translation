base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: ru
  text: Долина Сиддим была полна битумных ям[a]. Цари Содома и Гоморры обратились в бегство и упали там[b], а остальные бежали в горы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «смоляных ям» или «асфальтовых ям»; еврейское слово обозначает битум.'
    reason: lexical_alternative
  - marker: b
    text: 'Вероятно, они упали в находившиеся там битумные ямы, однако в еврейском тексте прямо сказано лишь: «упали там».'
    reason: ambiguity
  - marker: c
    text: 'Или: «в гористую местность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: долина Сиддим
  rationale: עֵמֶק означает «долина», а הַשִּׂדִּים — название местности. В русском родовой географический термин пишется со строчной буквы.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: была вся в ямах с битумом
  rationale: Повтор בֶּאֱרֹת передаёт множество ям; חֵמָר обозначает природный битум. Оборот естественно передаёт обилие ям, не превращая повтор в неестественную русскую конструкцию.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: цари Содома и Гоморры
  rationale: Хотя מֶלֶךְ формально стоит в единственном числе, следующие глаголы имеют множественное число, а контекст говорит об отдельных царях двух городов.
- source_word: וַיָּנֻסוּ
  choice: обратились в бегство
  rationale: Нормальное повествовательное значение корня נוס; выражение звучит ясно и достойно и позволяет избежать тесного повтора слова «бежали» в одном предложении.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: упали там
  rationale: Буквально сохраняет значение נפל и наречие «там», не добавляя отсутствующего в еврейском тексте прямого указания на падение именно в ямы.
- source_word: וְהַנִּשְׁאָרִים
  choice: остальные
  rationale: Естественно обозначает тех, кто остался из разбитого войска; перевод «уцелевшие» был бы несколько более истолковывающим.
- source_word: הֶרָה נָסוּ
  choice: бежали в горы
  rationale: Направительная форма הֶרָה указывает движение к гористой местности; «в горы» — краткий и естественный русский эквивалент.
theological_decisions:
- issue: Следует ли понимать וַיִּפְּלוּ как гибель царей, их поражение или буквальное падение в ямы?
  choice: упали там
  alternative: пали там / провалились в ямы
  rationale: Исходный текст употребляет общий глагол «падать» и не называет объект или исход падения. Основной текст сохраняет эту неоднозначность, а вероятная связь с ямами отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранена лаконичность древнееврейского текста и его неопределённость относительно того, куда именно упали цари. Начальный союз וְ передан связью с контекстом без добавления временного слова «теперь».
