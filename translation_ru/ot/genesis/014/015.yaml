  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: ru
  text: Ночью он и его слуги разделились на отряды, напали на них, разбили их и преследовали до Ховы, что к северу от Дамаска.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слева от Дамаска»; то есть к северу от города.'
    reason: Сохраняет доступ к древнееврейскому способу обозначения стороны света, тогда как основной текст передаёт его современным географическим выражением.
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: разделились на отряды, напали на них
  rationale: Форма единственного числа при составном пояснении «он и его слуги» описывает тактическое разделение сил; «напали» естественно передаёт направленность עֲלֵיהֶם, не оставляя неясного русского «разделились против них».
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: Обычное значение עֶבֶד в контексте домочадцев Аврама; «рабы» здесь могло бы чрезмерно сузить социальный смысл.
- source_word: וַיַּכֵּם
  choice: разбили их
  rationale: Идиоматическая форма נכה допускает «поразил»; в военном контексте «разбили» ясно выражает нанесённое войску поражение без обязательного смысла поголовного уничтожения.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: к северу от Дамаска
  rationale: Буквально «слева от Дамаска»; при ориентировании лицом на восток левая сторона соответствует северу.
