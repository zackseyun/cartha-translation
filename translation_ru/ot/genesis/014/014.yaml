base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: ru
  text: Когда Аврам услышал, что его брат[a] взят в плен, он собрал[b] триста восемнадцать своих обученных людей, родившихся в его доме, и преследовал их до Дана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, буквально означающее «брат», может также обозначать близкого родственника, например племянника.
    reason: lexical_alternative
  - marker: b
    text: Глагол, переведённый как «собрал», также можно понимать как «вывел», «вывел для похода» или, возможно, «вооружил».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: взят в плен
  rationale: Нифаль глагола שׁבה обозначает пленение, особенно в военном контексте; выражение естественно для современного русского языка.
- source_word: אָחִיו
  choice: его брат
  rationale: Сохранено прямое значение еврейского אָחִיו; при этом в данном контексте словом «брат» назван близкий родственник — племянник Лот, что поясняется в сноске.
- source_word: וַיָּרֶק
  choice: собрал
  rationale: Редкий и спорный глагол в контексте означает подготовку или выведение людей для военного преследования. «Собрал» естественно передаёт мобилизацию, не сводя значение однозначно к вооружению или выведению.
- source_word: חֲנִיכָיו
  choice: своих обученных людей
  rationale: Передаёт значение людей, подготовленных под властью Аврама, не добавляя прямо не выраженного существительного «слуги».
- source_word: יְלִידֵי בֵיתוֹ
  choice: рождённых в его доме
  rationale: Формально и понятно передаёт принадлежность этих людей к домочадцам Аврама от рождения.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: триста восемнадцать
  rationale: Сохраняет полное числительное исходного текста в принятой русской библейской манере.
- source_word: וַיִּרְדֹּף
  choice: преследовал врагов
  rationale: Глагол רדף имеет здесь военное значение. Дополнение «врагов» восстановлено из контекста, поскольку в еврейском тексте объект прямо не назван.
- source_word: עַד דָּן
  choice: до Дана
  rationale: Кратко и точно передаёт предел преследования, выраженный עַד.
theological_decisions:
- issue: Обозначение родства Лота с Аврамом
  choice: Сохранить «его брат» в основном тексте
  alternative: его родственник / его сродник
  rationale: Еврейское אָחִיו буквально означает «его брат», но может обозначать и близкого родственника. Сохранение исходной формы не устраняет присущую тексту широту значения; конкретное родство пояснено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского регистра. Сохранено буквальное «брат» как значимая особенность оригинала; спорный глагол וַיָּרֶק передан нейтральным «собрал», а основные варианты отмечены в сноске.
