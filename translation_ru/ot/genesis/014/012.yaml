lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Они взяли
  rationale: Обычное повествовательное значение לקח — «взять». Контекст допускает оттенок захвата, однако глагол сам по себе не требует усиленного «схватили» или «пленили».
- source_word: רְכֻשׁוֹ
  choice: всё его имущество
  rationale: רְכוּשׁ обозначает имущество, прежде всего движимое. «Имущество» естественно и точно в контексте военной добычи; «всё» идиоматично передаёт совокупное значение и не меняет смысла.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: племянника Аврама
  rationale: 'Буквально: «сына брата Аврама». Русское «племянник» ясно и естественно передаёт указанное родство, а буквальная форма сохранена в примечании.'
- source_word: וַיֵּלֵכוּ
  choice: и ушли
  rationale: הלך означает «идти»; после взятия людей и имущества русское «ушли» естественно выражает удаление с места, не усиливая значение до «бежали» или «увели».
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Лот тогда жил в Содоме
  rationale: Причастная конструкция сообщает фоновое обстоятельство. Повтор имени устраняет возможную неясность местоимения, а «тогда жил» передаёт длительное проживание и пояснительный характер фразы.
