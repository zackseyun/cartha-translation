  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: ru
  text: Они взяли Лота[a], племянника Аврама, и его имущество и ушли. Лот жил в Содоме.
  philosophy: optimal-equivalence
  footnotes:
