lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: В генеалогической формуле глагол חיה обозначает число лет жизни до следующего названного события; «прожил» естественно передаёт эту конструкцию по-русски.
- source_word: לֶמֶךְ
  choice: Ламех
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: сто восемьдесят два года
  rationale: Еврейская числовая конструкция перестроена согласно обычному порядку числительных в современном русском языке; форма «года» согласуется с последней цифрой составного числительного.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Каузативная форма ילד с мужчиной в роли подлежащего означает «породить, стать отцом». Выражение «стал отцом» современно, ясно и уместно в родословии.
- source_word: בֵּן
  choice: сына
  rationale: Существительное означает «сын»; винительный падеж обусловлен русской конструкцией «стал отцом сына». Неопределённость сохраняется отсутствием уточнения имени в данном стихе.
