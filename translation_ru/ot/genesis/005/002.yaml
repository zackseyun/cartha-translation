  variant: modern literary Russian
source:
  edition: WLC
  text: זָכָ֥ר וּ/נְקֵבָ֖ה בְּרָאָ֑/ם וַ/יְבָ֣רֶךְ אֹתָ֗/ם וַ/יִּקְרָ֤א אֶת שְׁמָ/ם֙ אָדָ֔ם בְּ/י֖וֹם הִבָּֽרְאָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: ru
  text: Он сотворил их — мужчину и женщину, благословил их и дал им имя «человек»[a] в день, когда они были сотворены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово адам может означать «человек» или собирательно «человечество»; оно также является личным именем Адам.
    reason: Сохраняет лексическую неоднозначность еврейского אָדָם между общим обозначением человека и личным именем.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: мужчину и женщину
  rationale: Передаёт парные обозначения мужского и женского пола естественно для современного русского языка; конструкция после «их» поясняет состав человеческой пары.
- source_word: בְּרָאָם
  choice: Он сотворил их
  rationale: Форма глагола указывает на завершённое действие Бога и содержит местоименный суффикс множественного числа.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: благословил их
  rationale: Прямой и традиционно понятный эквивалент, сохраняющий действие Бога над обоими людьми.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: дал им имя
  rationale: Естественно по-русски передаёт еврейскую формулу «нарёк их имя», сохраняя важную мысль об одном общем имени для двоих.
- source_word: אָדָם
  choice: человек
  rationale: В данном контексте слово охватывает мужчину и женщину вместе и обозначает человека или человеческий род; примечание сохраняет совпадение с личным именем Адам.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: в день, когда они были сотворены
  rationale: Сохраняет временную формулу и страдательное значение еврейской конструкции, оставаясь естественным современным русским выражением.
theological_decisions:
- issue: Значение אָדָם как общего имени мужчины и женщины
  choice: человек
  alternative: Адам
  rationale: Ближайший контекст прямо включает обоих — мужчину и женщину — поэтому в основном тексте передано собирательное значение. В то же время еврейская форма совпадает с личным именем Адам, что отмечено в сноске без устранения смысловой неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире делает пояснительное сочетание «мужчину и женщину» ясным, а формула «дал им имя» естественно сохраняет единственное общее имя.
