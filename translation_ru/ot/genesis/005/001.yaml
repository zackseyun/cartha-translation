  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: ru
  text: Вот книга родословия Адама. В день[a], когда Бог сотворил человека[b], он сделал его по подобию Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение «в день» здесь может иметь более общее временное значение: «когда».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «адам» здесь может означать как «человека», так и «человечество».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Вот книга
  rationale: Указательное זֶה вводит заголовок, а סֵפֶר обозначает письменную книгу или запись. «Вот книга» сохраняет лаконичную форму еврейского именного предложения.
- source_word: תּוֹלְדֹת
  choice: родословия
  rationale: В данном контексте слово вводит последующую генеалогию и обозначает родовую линию или запись о поколениях. «Родословие» естественно и точно передаёт функцию заголовка.
- source_word: אָדָם
  choice: Адама
  rationale: Первое употребление относится к названному предку, от которого далее ведётся родословие, поэтому передано как личное имя.
- source_word: בְּיוֹם בְּרֹא
  choice: В день, когда … сотворил
  rationale: Формулировка сохраняет образ «дня» и отсылку к повествованию о творении, а придаточное с «когда» делает еврейскую конструкцию естественной по-русски.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте слово согласуется с глаголами в единственном числе и обозначает Бога.
- source_word: אָדָם
  choice: человека
  rationale: Второе употребление имеет обобщённое значение и отсылает к человеку как представителю человечества; единственное число сохраняет форму исходного текста.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: по подобию Божьему
  rationale: דְּמוּת означает подобие или сходство. Перевод не смешивает его со словом «образ», соответствующим другому еврейскому термину.
- source_word: עָשָׂה אֹתוֹ
  choice: он создал его
  rationale: Глагол עשה имеет широкое значение «делать, создавать», а местоименный объект стоит в мужском роде единственного числа. «Создал его» сохраняет отличие от предшествующего ברא «сотворил».
theological_decisions:
- issue: Два значения אָדָם в одном стихе
  choice: «Адам» в заголовке и «человек» в рассказе о сотворении
  alternative: «Адам» в обоих случаях или «человечество» во втором случае
  rationale: Заголовок открывает родословие конкретного предка, тогда как формула о сотворении перекликается с общим рассказом о создании человека. Разные переводы отражают контекстуальное различие, не устраняя возможного собирательного оттенка второго употребления.
- issue: Связь выражения דְּמוּת אֱלֹהִים с языком рассказа о творении
  choice: «по подобию Божьему»
  alternative: «по образу Божьему»
  rationale: В стихе употреблено דְּמוּת «подобие», а не צֶלֶם «образ»; сохранение различия не гармонизирует формулировку с соседними текстами.
- issue: Временной смысл בְּיוֹם
  choice: Сохранить «в день» в основном тексте
  alternative: Передать только союзом «когда»
  rationale: Еврейское выражение способно функционировать как общее временное указание «когда», однако буквальный компонент «день» создаёт значимую перекличку с повествованием о творении; примечание сохраняет обе возможности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Сохранена формула заголовка «Вот книга…», но синтаксис временной конструкции сделан естественным для современного читателя. Местоимение «он» применительно к Богу написано со строчной буквы в соответствии с нейтральной современной издательской нормой.
