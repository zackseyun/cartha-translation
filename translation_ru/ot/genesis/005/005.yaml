lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: было
  rationale: В итоговой генеалогической формуле глагол היה естественно передаёт общую продолжительность жизни; форма единственного числа согласуется в русском с количественным сочетанием «девятьсот тридцать лет».
- source_word: כָּל יְמֵי
  choice: всех дней жизни
  rationale: Сохраняется повторяющийся образ подсчёта жизни в днях, но добавление «жизни» делает формулу ясной и естественной по-русски.
- source_word: אָדָם
  choice: Адама
  rationale: В контексте родословия это личное имя конкретного человека, а не обобщённое обозначение человека или человечества.
- source_word: אֲשֶׁר חַי
  choice: жизни
  rationale: Относительное выражение буквально означает «которые он прожил»; в русском оно естественно и без потери смысла свёрнуто в сочетание «дни жизни».
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: девятьсот тридцать лет
  rationale: Число передано словами в соответствии с литературным регистром родословия.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Сохраняется краткая, суровая и повторяющаяся в главе формула смерти без добавочного временного оттенка.
theological_decisions:
- issue: Значение אָדָם
  choice: Адам как личное имя
  alternative: человек / человечество
  rationale: В Бытии 5:5 родословный контекст однозначно указывает на названного ранее Адама, хотя в других контекстах слово может иметь нарицательное значение.
- issue: Формула смертности
  choice: «и он умер»
  alternative: «затем он умер»
  rationale: Прямой перевод сохраняет повторяющийся рефрен главы и его богословскую весомость, не добавляя отсутствующего в еврейском тексте усиленного временного перехода.
translation_notes:
  register: Современный литературный русский язык; сохранена торжественная лаконичность родословной формулы и её заключительный рефрен. Конструкция слегка приближена к еврейскому образу «всех дней», но остаётся понятной обычному читателю.
