- source_word: וַיְחִי
  choice: прожил
  rationale: В родословной формуле глагол חיה обозначает возраст, которого человек достиг до следующего упомянутого события; «прожил» естественно передаёт эту последовательность.
- source_word: שֵׁת
  choice: Сиф
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 лет
  rationale: Еврейское выражение буквально располагает пять лет перед ста годами, но означает 105 лет; запись цифрами ясна современному читателю.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: В мужской родословной форме ילד означает, что названный человек породил сына, то есть стал его отцом. Эта формулировка точна и естественна в современном русском языке.
- source_word: אֶת אֱנוֹשׁ
  choice: Еноса
  rationale: Служебный показатель прямого дополнения אֶת отдельно не переводится; «Енос» — устоявшаяся русская форма имени.
