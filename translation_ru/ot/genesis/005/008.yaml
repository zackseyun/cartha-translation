  text: So all the days of Seth were nine hundred and twelve years, and he died.
translation:
  language: ru
  text: Всех дней жизни Сифа было девятьсот двенадцать лет, и он умер.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: было
  rationale: Форма глагола היה здесь подводит итог продолжительности жизни в родословной формуле. «Было» естественно сочетается с выражением «всех дней жизни» и не добавляет отсутствующих в источнике смысловых оттенков.
- source_word: כָּל יְמֵי
  choice: всех дней жизни
  rationale: Буквальное «всех дней» в современном русском требует уточнения «жизни» для ясности; оно передаёт устойчивое еврейское обозначение полной продолжительности жизни и сохраняет структуру повторяющейся формулы.
- source_word: שֵׁת
  choice: Сифа
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени; родительный падеж обусловлен синтаксисом предложения.
- source_word: שְׁתֵּים עֶשְׂרֵה ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: девятьсот двенадцать лет
  rationale: Еврейский текст называет сначала двенадцать, затем девять сотен; в русском числительное естественно передаётся в обычном порядке без изменения итогового значения — 912 лет.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Простой союз и глагол сохраняют лаконичную и торжественную заключительную формулу родословия, не усиливая временную или причинную связь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены лаконичность, торжественность и повторяющаяся родословная формула исходного текста. Архаические обороты исключены, но структура «всех дней жизни… было» удержана ради близости к еврейскому выражению.
