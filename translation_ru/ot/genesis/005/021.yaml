  text: Енох жил шестьдесят пять лет и стал отцом Мафусала.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле глагол חיה обозначает прожитый возраст до рождения названного потомка; «жил» естественно и точно передаёт эту конструкцию.
- source_word: חֲנוֹךְ
  choice: Енох
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: шестьдесят пять лет
  rationale: Числительное передано в естественном для современного русского языка порядке.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: При подлежащем мужского рода ילד в родословии означает рождение ребёнка от данного мужчины. «Стал отцом» звучит современно и сохраняет смысл, не прибегая к архаичному «родил» или книжному «породил».
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения не имеет отдельного соответствия в русском языке.
- source_word: מְתוּשָׁלַח
  choice: Мафусала
  rationale: Использована устоявшаяся русская форма имени; родительный падеж обусловлен конструкцией «стал отцом».
