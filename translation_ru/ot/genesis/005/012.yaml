  text: Кенан жил семьдесят лет и стал отцом Махалалела[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Кенан жил семьдесят лет и породил Махалалела».'
    reason: 'Лексическая альтернатива: буквальное «породил» точнее отражает каузативную форму ילד, но в современном русском звучит более книжно и архаично.'
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле форма глагола חיה естественно передаётся русским «жил»; начальный повествовательный союз отдельно воспроизводить не требуется.
- source_word: קֵינָן
  choice: Кенан
  rationale: Имя передано непосредственно с еврейской формы, а не через греческую традицию «Каинан».
- source_word: שִׁבְעִים שָׁנָה
  choice: семьдесят лет
  rationale: Оборот указывает возраст Кенана при рождении названного потомка; краткая формулировка естественна по-русски.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: В генеалогическом контексте ילד обозначает мужское порождение потомка. «Стал отцом» ясно и современно, тогда как «родил» в современном русском обычно относится к матери, а «породил» звучит архаично.
- source_word: אֶת
  choice: отдельно не переведено
  rationale: Еврейский показатель определённого прямого дополнения не имеет самостоятельного русского соответствия и выражен синтаксисом.
- source_word: מַהֲלַלְאֵל
  choice: Махалалел
  rationale: Имя транслитерировано непосредственно с еврейского מַהֲלַלְאֵל; форма сохраняет состав и звучание исходного имени.
