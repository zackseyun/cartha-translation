lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: Обычное и естественное соответствие глаголу חיה в родословной формуле; речь идёт о продолжительности жизни после рождения названного сына.
- source_word: אֱנוֹשׁ
  choice: Энош
  rationale: Передача непосредственно еврейской формы имени; традиционная русская форма «Енос» отмечена в сноске.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: после того как … стал отцом
  rationale: Естественно передаёт временное отношение и каузативную форму ילד в мужской родословной, избегая архаичного «родил» в значении «произвёл на свет».
- source_word: קֵינָן
  choice: Кенан
  rationale: Транслитерация еврейской формы имени; традиционное «Каинан» восходит к форме, закрепившейся через греческую традицию.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: восемьсот пятнадцать лет
  rationale: Современный русский порядок числительного естественно передаёт еврейскую сумму «пятнадцать и восемьсот».
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: и у него родились сыновья и дочери
  rationale: Естественная современная русская формулировка сохраняет значение появления у него потомства и явное упоминание обоих полов.
