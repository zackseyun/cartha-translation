  naturalness: Текст в целом естественен для современного литературного русского. «После того как ... стал отцом» и «прожил ещё ... лет» звучат гладко и ясно. Повтор «стал отцом» в данном жанре оправдан точностью и не выглядит тяжеловесным.
  terminology: «Энош» и «Кенан» корректно передают еврейские формы; сноски уместно фиксируют традиционные русские/гречески обусловленные варианты «Енос» и «Каинан». Формулировка «стал отцом» — современное, неархаичное соответствие родословному употреблению ילד.
