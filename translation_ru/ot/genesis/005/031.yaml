- source_word: שָׁנָה
  choice: лет
  rationale: После числительного 777 современная русская норма требует родительного множественного числа «лет».
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Прямая передача повторяющейся заключительной формулы Бытия 5 сохраняет её ритм и вес.
