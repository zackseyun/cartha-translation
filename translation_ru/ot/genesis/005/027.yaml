lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: было
  rationale: В этой итоговой родословной формуле глагол היה служит простой связкой; русское «было» естественно передаёт её без излишнего буквализма.
- source_word: כָּל יְמֵי
  choice: всех дней
  rationale: Сохранён буквальный и повторяющийся в Бытии 5 оборот «все дни», а не смысловая замена «вся жизнь».
- source_word: מְתוּשֶׁלַח
  choice: Мафусаила
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; родительный падеж обусловлен конструкцией «дни Мафусаила».
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת
  choice: девятьсот шестьдесят девять
  rationale: Число передано в естественном для современного русского языка порядке.
- source_word: שָׁנָה ... שָׁנָה
  choice: лет
  rationale: Повтор существительного в еврейском числовом выражении по-русски естественно сводится к одному слову «лет» после полного числительного.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Прямо сохранена стандартная заключительная формула главы; местоимение делает русское предложение ясным и естественным.
