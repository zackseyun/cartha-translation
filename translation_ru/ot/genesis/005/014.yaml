lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: И было
  rationale: Последовательная форма с וַ продолжает родословную формулу; русское «И было» сохраняет её размеренный библейский ритм.
- source_word: כָּל יְמֵי
  choice: всех дней
  rationale: Буквально передаёт устойчивую формулу о полной продолжительности жизни, не заменяя её толкованием «вся жизнь».
- source_word: קֵינָן
  choice: Кенан
  rationale: Передаёт непосредственно еврейскую форму имени; традиционное «Каинан» связано преимущественно с греческой формой.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: девятьсот десять лет
  rationale: Число переставлено в естественный для русского языка порядок; форма «лет» соответствует русскому согласованию числительных.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Прямо и просто сохраняет повторяющееся завершение родословной записи.
