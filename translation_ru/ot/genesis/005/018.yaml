  yaml_path: translation/ot/genesis/005/018.yaml
  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: ru
  text: Иаред жил сто шестьдесят два года и стал отцом Еноха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле форма глагола חיה естественно передаётся русским «жил» и вводит указание возраста.
- source_word: יֶרֶד
  choice: Иаред
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, остающаяся узнаваемой для современного читателя.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: сто шестьдесят два года
  rationale: Еврейская последовательность числительных буквально строится иначе, но по-русски естественно выражается как «сто шестьдесят два года».
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: В родословном контексте ילד обозначает рождение потомка со стороны отца; «стал отцом» точно и современно передаёт смысл без архаического «родил» или «породил».
- source_word: אֶת חֲנוֹךְ
  choice: Еноха
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; имя передано в закрепившейся русской библейской форме и поставлено в винительном падеже.
