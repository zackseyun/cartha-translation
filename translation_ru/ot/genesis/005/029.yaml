  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: ru
  text: 'И он дал ему имя Ной[a], сказав: «Этот утешит нас от нашей работы и от тягостного труда наших рук, от земли, которую проклял Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Ной созвучно еврейскому слову, связанному с покоем и облегчением; глагол здесь буквально означает «утешит нас».
    reason: Сохраняет звуковую игру имени с глаголом и различие между их точными лексическими значениями.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: И он назвал его
  rationale: Русское «назвал его» естественно передаёт еврейскую формулу наречения имени; буквальное «назвал его имя» в современном русском звучит неестественно.
- source_word: נֹחַ
  choice: Ноем
  rationale: Использована традиционная русская форма имени Ной в требуемом творительном падеже.
- source_word: זֶה
  choice: Он
  rationale: В прямой речи отец указывает на ребёнка; русское местоимение передаёт смысл естественнее буквального «этот» или «этот самый».
- source_word: יְנַחֲמֵנוּ
  choice: утешит нас
  rationale: Глагол נחם означает «утешать, приносить утешение». Такой перевод сохраняет основное лексическое значение, а созвучие с именем Ной поясняется в сноске.
- source_word: מִמַּעֲשֵׂנוּ וּמֵעִצְּבוֹן יָדֵינוּ
  choice: в нашей работе и в мучительном труде наших рук
  rationale: Повтор предлога מִן здесь выражает избавление или облегчение от тяготы. Русская конструкция «утешит ... в» идиоматична и не создаёт ошибочного впечатления, будто труд является источником утешения.
- source_word: מִן־הָאֲדָמָה
  choice: на земле
  rationale: Фраза относится к работе и мучительному труду, вызванным проклятой почвой. «На земле» естественно связывает труд с возделываемой землёй, хотя еврейский предлог допускает более буквальное «от земли».
- source_word: אֲשֶׁר אֵרְרָהּ יְהוָה
  choice: которую проклял Яхве
  rationale: Относительное предложение прямо определяет землю; личное имя יהוה передано транслитерацией «Яхве».
theological_decisions:
- issue: Игра слов между именем נֹחַ и глаголом יְנַחֲמֵנוּ
  choice: В основном тексте «утешит нас», а созвучие с покоем и облегчением пояснено в сноске.
  alternative: «даст нам покой» или «принесёт нам облегчение»
  rationale: Форма יְנַחֲמֵנוּ происходит от נחם, «утешать», тогда как имя Ной созвучно слову, связанному с покоем. Текст использует звуковую, а не строгую этимологическую связь; перевод не должен подменять лексическое значение глагола предполагаемой этимологией.
- issue: Связь выражения מִן־הָאֲדָמָה с предшествующей фразой
  choice: 'Передано как обстоятельство труда: «в ... труде ... на земле».'
  alternative: «из-за земли» или «от земли»
  rationale: Еврейский синтаксис допускает оттенок источника тяготы или избавления от неё. Выбранный вариант сохраняет ясную связь с проклятием земли в Бытии 3, не утверждая, что Ной полностью отменит проклятие.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён до естественной русской формулы наречения имени; сохранены образ «труда наших рук», связь с проклятой землёй и личное имя Яхве.
