  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: ru
  text: Когда Эношу было девяносто лет, он стал отцом Кенана[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и породил»; в родословии это значит, что Энош стал отцом Кенана.'
    reason: lexical_alternative
  - marker: b
    text: Имена Энош и Кенан передают еврейские формы; в традиционных русских переводах — Енос и Каинан.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: Когда Эношу было
  rationale: В родословной формуле глагол חיה вместе с указанием числа лет обозначает возраст человека к моменту следующего события. Такая перестройка естественно передаёт смысл по-русски и не создаёт ошибочного впечатления, будто вся жизнь Эноша длилась девяносто лет.
- source_word: אֱנוֹשׁ
  choice: Энош
  rationale: Транслитерация непосредственно отражает еврейскую форму имени אֱנוֹשׁ; традиционный русский вариант «Енос» восходит к греческой передаче.
- source_word: תִּשְׁעִים שָׁנָה
  choice: девяносто лет
  rationale: Обычная современная русская форма обозначения возраста.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד при мужчине как подлежащем в родословиях означает, что он произвёл потомка. «Стал отцом» точно и естественно для современного русского языка; буквальное «родил» здесь звучало бы неверно, а «породил» — архаично.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного лексического соответствия в русском языке.
- source_word: קֵינָן
  choice: Кенан
  rationale: Транслитерация непосредственно отражает еврейскую форму קֵינָן; традиционный вариант «Каинан» связан с греческой формой имени.
