lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: В родословной формуле wayyiqtol от חיה обозначает число лет жизни до следующего названного события; «прожил» естественно передаёт эту конструкцию по-русски.
- source_word: מַהֲלַלְאֵל
  choice: Малелеил
  rationale: Имя передано в укоренившейся русской библейской форме, восходящей через традицию к еврейскому имени.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: шестьдесят пять лет
  rationale: Еврейское «пять лет и шестьдесят лет» переставлено в обычный для современного русского языка порядок без изменения числового значения.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: В мужской родословной ילד означает рождение ребёнка по отношению к отцу; выражение «стал отцом» ясно и естественно в современном русском языке и не привносит дополнительных деталей.
- source_word: אֶת יָרֶד
  choice: Иареда
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; имя передано в укоренившейся русской библейской форме и поставлено в родительный падеж после оборота «стал отцом».
