  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Ламех стал отцом Ноя, он жил ещё пятьсот девяносто пять лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле глагол חיה обозначает продолжительность жизни после названного события; «жил ещё» естественно передаёт последующий период.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: После рождения Ноя
  rationale: Конструкция с Hiphil ילד буквально указывает на то, что Ламех стал отцом Ноя. По-русски «после рождения Ноя» звучит естественнее, не меняя временного смысла.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: пятьсот девяносто пять лет
  rationale: Еврейский текст выражает число как 95 + 500; русский порядок числительных требует формы «пятьсот девяносто пять».
- source_word: וַיּוֹלֶד
  choice: у него родились
  rationale: В данной родословной формуле Hiphil ילד означает, что Ламех стал отцом других детей. Русское «у него родились» современно и естественно, сохраняя родительский смысл.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Перевод сохраняет прямо названные в еврейском тексте мужское и женское потомство.
