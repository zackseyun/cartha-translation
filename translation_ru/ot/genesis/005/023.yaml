lexical_decisions:
- source_word: וַיְהִי
  choice: было
  rationale: Глагольная форма вводит итоговую формулу родословия; по-русски связка естественно согласуется с выражением «триста шестьдесят пять лет» в единственном числе.
- source_word: כָּל יְמֵי
  choice: всех дней жизни
  rationale: Буквально — «всех дней»; добавление «жизни» ясно передаёт смысл полной продолжительности жизни и сохраняет образ дней.
- source_word: חֲנוֹךְ
  choice: Еноха
  rationale: Традиционная и общепринятая русская передача личного имени; родительный падеж обусловлен конструкцией «дней жизни».
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: триста шестьдесят пять
  rationale: Порядок числительных приведён к естественной современной русской норме без изменения значения.
- source_word: שָׁנָה ... שָׁנָה
  choice: лет
  rationale: Два употребления слова «год» в еврейской числовой конструкции естественно объединяются в русском в одно «лет» после полного числительного.
