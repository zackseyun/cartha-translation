lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле форма глагола חיה естественно передаётся русским «жил» и вводит возраст до рождения названного потомка.
- source_word: מְתוּשֶׁלַח
  choice: Мафусал
  rationale: Использована устоявшаяся в русской библейской традиции форма личного имени.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: сто восемьдесят семь лет
  rationale: Еврейская последовательность числительных буквально располагает единицы, десятки и сотню иначе; современный русский порядок — «сто восемьдесят семь».
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Hифиль глагола ילד в родословиях обозначает отцовство. «Стал отцом» звучит естественно и точно, не прибегая к архаичному «родил» или «породил».
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его функция передана синтаксисом.
- source_word: לָמֶךְ
  choice: Ламеха
  rationale: Использована устоявшаяся русская форма имени; винительный падеж обусловлен конструкцией «стал отцом кого» в принятой формулировке с подразумеваемым родительным отношением к имени.
