  yaml_path: translation/ot/genesis/005/025.yaml
  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: ru
  text: Мафусал жил сто восемьдесят семь лет и стал отцом Ламеха[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и породил Ламеха».'
