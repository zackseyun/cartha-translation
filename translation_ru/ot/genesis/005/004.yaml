  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: ru
  text: После того как Адам стал отцом Сифа, он прожил ещё восемьсот лет[a] и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Дни Адама после того, как он стал отцом Сифа, были восемьсот лет».'
    reason: Сноска показывает формальную конструкцию еврейского текста («дни Адама ... были»), переданную в основном тексте естественным русским выражением «он прожил».
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: Адам жил
  rationale: 'Буквально: «дни Адама были». В контексте продолжительности жизни современный русский естественно передаёт эту еврейскую идиому глаголом «жил».'
- source_word: אָדָם
  choice: Адам
  rationale: В родословии это личное имя конкретного человека, а не общее обозначение человека или человечества.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֵׁת
  choice: После рождения Сифа
  rationale: Хифиль глагола ילד означает «породить, стать отцом». Номинальная конструкция естественна по-русски и сохраняет временную связь; смысл отцовства однозначен благодаря подлежащему «Адам».
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: восемьсот лет
  rationale: Прямое обозначение продолжительности времени.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: и у него родились сыновья и дочери
  rationale: Естественная русская формулировка передаёт, что Адам стал отцом других детей; «сыновья и дочери» сохраняет явное указание на потомков обоих полов.
theological_decisions:
- issue: Значение אָדָם
  choice: личное имя «Адам»
  alternative: «человек»
  rationale: В данном родословном контексте речь идёт о названном по имени предке, а не о человечестве вообще.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Архаическое «родил» применительно к отцу оставлено только в буквальной сноске, тогда как основной текст использует естественные русские выражения.
