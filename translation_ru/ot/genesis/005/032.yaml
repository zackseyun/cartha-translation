source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: ru
  text: Когда Ною было пятьсот лет, он стал отцом Сима, Хама и Иафета.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Порядок «Сим, Хам и Иафет» соответствует еврейскому тексту; он не обязательно указывает порядок рождения и не означает, что все трое родились в один год.
    reason: cross_reference
  - marker: b
    text: 'В еврейском тексте имя повторено: «Ной стал отцом».'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда ... было
  rationale: Эта повествовательная форма здесь вводит временное обстоятельство; современная русская конструкция естественно передаёт её функцию без архаического «и было».
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: было пятьсот лет
  rationale: Еврейская идиома «сын стольких-то лет» обозначает возраст; выбран обычный русский способ его выражения.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד при подлежащем-мужчине означает «произвести на свет, стать отцом». Этот вариант точен и звучит современно; «родил» в русском языке здесь было бы неестественно, а «породил» — архаично.
- source_word: נֹחַ
  choice: Ной
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: שֵׁם
  choice: Сим
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: חָם
  choice: Хам
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: יָפֶת
  choice: Иафет
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Сима, Хама и Иафета
  rationale: Показатели прямого дополнения отдельно не переводятся; список передан по нормам современного русского синтаксиса с сохранением еврейской последовательности имён.
theological_decisions:
- issue: Подразумевает ли последовательность «Сим, Хам и Иафет» порядок рождения и рождение всех троих в один год
  choice: Сохранить порядок имён в еврейском тексте, не уточняя порядок рождения и не утверждая, что все трое родились в пятисотый год жизни Ноя.
  alternative: Переставить имена по предполагаемому старшинству или сформулировать стих так, будто все три сына родились в одном году.
  rationale: Сам стих перечисляет сыновей после указания возраста Ноя, но не требует понимать список как строгий порядок рождения или как сообщение об одновременном рождении. Основной текст не должен вводить гармонизирующее уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Устранён неестественный для русского повтор имени посредством местоимения, а традиционные русские формы имён сохранены.
