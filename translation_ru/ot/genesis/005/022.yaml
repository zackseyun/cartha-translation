base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: ru
  text: После того как Енох стал отцом Мафусала, он ходил с Богом[a] триста лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жил в общении с Богом». Буквально: «ходил с Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: ходил с
  rationale: Возвратная порода глагола הלך в сочетании с אֶת הָאֱלֹהִים описывает образ жизни Еноха в отношении к Богу. Русское «ходил с Богом» сохраняет исходную метафору и её смысловую ёмкость.
- source_word: אֶת הָאֱלֹהִים
  choice: с Богом
  rationale: В данном устойчивом сочетании אֶת имеет сопроводительно-реляционное значение; по-русски естественно «с Богом», без артиклевой определённости.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: После рождения Мафусала
  rationale: Оборот буквально означает «после того, как он породил Мафусала». Номинальная русская конструкция ясна, естественна и сохраняет временное отношение.
- source_word: מְתוּשֶׁלַח
  choice: Мафусал
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: триста лет
  rationale: Прямое соответствие числовому выражению. Положение после сказуемого ясно указывает на продолжительность хождения Еноха с Богом.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: и у него рождались сыновья и дочери
  rationale: Каузатив ילד буквально указывает на отцовство, но повторное «он родил» в современном русском применительно к мужчине неестественно, а «породил» стилистически грубо. Эта конструкция естественно передаёт многократное появление у него сыновей и дочерей и сохраняет их явное различение.
theological_decisions:
- issue: Характер отношений Еноха с Богом в выражении «ходил с Богом»
  choice: Сохранить в основном тексте метафору «ходил с Богом»
  alternative: «жил в общении с Богом» или «жил верно перед Богом»
  rationale: Исходная метафора имеет самостоятельную богословскую и повествовательную значимость. Развёрнутое истолкование сузило бы её значение и устранило бы присущую ей смысловую ёмкость.
translation_notes:
  register: 'Современный литературный русский язык с сохранением традиционной библейской метафоры и формы имени «Мафусал». Порядок частей предложения устраняет возможную синтаксическую двусмысленность: триста лет относятся к хождению Еноха с Богом, а не к рождению Мафусала.'
