  source_fidelity: Временная последовательность и срок («после рождения/отцовства Ханоха», «ещё восемьсот лет») переданы верно. Однако оборот «у него родились сыновья и дочери» описывает рождения как события, происходящие у него, и недостаточно передаёт активный древнееврейский глагол וַיּוֹלֶד («он стал отцом / произвёл потомство»).
