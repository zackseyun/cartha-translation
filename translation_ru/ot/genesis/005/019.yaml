lexical_decisions:
- source_word: וַיְחִי
  choice: жил ещё
  rationale: В родословной формуле глагол חיה обозначает продолжительность последующей жизни; «жил ещё» естественно передаёт период после рождения Ханоха.
- source_word: יֶרֶד
  choice: Йеред
  rationale: Передача имени непосредственно с древнееврейского сохраняет его звучание точнее, чем традиционная русская форма «Иаред».
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת חֲנוֹךְ
  choice: после рождения Ханоха
  rationale: Естественная русская временная конструкция передаёт период после того, как Йеред стал отцом Ханоха, без тяжеловесного буквального оборота.
- source_word: חֲנוֹךְ
  choice: Ханох
  rationale: Транслитерация отражает древнееврейскую форму имени; традиционная русская форма «Енох» указана в сноске.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: восемьсот лет
  rationale: Нормальная русская форма обозначения длительности.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: и у него родились сыновья и дочери
  rationale: Этот естественный русский оборот сохраняет указание как на сыновей, так и на дочерей и в данном родословном контексте передаёт отцовство Йереда.
