  text: После того как Йеред стал отцом Ханоха[a], он жил ещё восемьсот лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционные русские формы имён — «Иаред» и «Енох».
