lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: было
  rationale: Форма וַיִּהְיוּ вводит итоговое сообщение о продолжительности жизни; по-русски естественно передаётся конструкцией «всех дней… было».
- source_word: כָּל יְמֵי
  choice: всех дней
  rationale: Сохранён характерный для родословия оборот, обозначающий полную продолжительность жизни.
- source_word: יֶרֶד
  choice: Иеред
  rationale: Форма «Иеред» близко передаёт еврейское имя и соответствует принятой русской библейской традиции.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: девятьсот шестьдесят два года
  rationale: Число передано в обычном для современного русского языка порядке; повтор слова «год» в еврейском выражении свёрнут в одно естественное словосочетание.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Сохранена простая заключительная формула родословия; местоимение делает русскую фразу естественной и ясной.
