lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословных Бытия глагол חיה вводит сообщение о продолжительности жизни; «жил» естественно и точно передаёт формулу.
- source_word: קֵינָן
  choice: Кенан
  rationale: Передача имени непосредственно с еврейской формы קֵינָן; вариант «Каинан» отражает греко-латинскую традицию.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מַהֲלַלְאֵל
  choice: После рождения Махалалела
  rationale: Естественная русская передача временной конструкции; существительное «рождение» позволяет избежать тяжеловесного «после того, как он родил» при сохранении смысла мужской генеалогии.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: восемьсот сорок лет
  rationale: Русский порядок разрядов естественно передаёт суммарное число, выраженное в еврейском тексте как сорок и восемь сотен.
- source_word: וַיּוֹלֶד
  choice: и родил
  rationale: В контексте родословия русское «родил» с мужским субъектом означает «произвёл на свет, стал отцом» и сохраняет повтор корня ילד без архаичного «породил».
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей и дочерей
  rationale: Сохраняет явное указание еврейского текста на потомков обоих полов.
