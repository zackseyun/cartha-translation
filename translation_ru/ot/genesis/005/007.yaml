  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: ru
  text: После того как Сиф стал отцом Еноса, он жил восемьсот семь лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: Глагол חיה в этой родословной сообщает, сколько Сиф прожил после названного события; «жил» естественно передаёт формулу оригинала.
- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: после рождения Еноса
  rationale: Еврейская конструкция буквально указывает на время после того, как Сиф породил Еноса. Русская номинальная конструкция естественна, а субъект остаётся однозначным благодаря предыдущему контексту родословной.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: восемьсот семь лет
  rationale: Порядок числовых разрядов приведён к норме современного русского языка без изменения суммы.
- source_word: וַיּוֹלֶד
  choice: и родил
  rationale: В родословном контексте «родил» кратко и понятно передаёт каузативную форму ילד применительно к отцу; более буквальное «породил» в современном русском звучит неестественно, а «стал отцом» несколько расширяет формулировку.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей и дочерей
  rationale: Сохранено явное обозначение потомков обоих полов, а не обобщающее «детей».
