  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: ru
  text: Енох ходил с Богом, и не стало его, потому что Бог взял его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и его нет». Древнееврейское выражение указывает на то, что Еноха больше не было.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: ходил
  rationale: Форма глагола передаёт продолжительный, привычный образ жизни и поведения. «Ходил» сохраняет древнееврейский образ и естественно сочетается с выражением «с Богом».
- source_word: אֶת הָאֱלֹהִים
  choice: с Богом
  rationale: При глаголе הלך частица אֶת обозначает совместность; перевод «с Богом» сохраняет прямой смысл и relationalную силу выражения.
- source_word: וְאֵינֶנּוּ
  choice: и не стало его
  rationale: Древнееврейское выражение буквально означает «и его нет». Русское «не стало его» передаёт отсутствие Еноха, не уточняя способ его ухода и не добавляя прямого утверждения о смерти.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отсутствия Еноха; «потому что» ясно передаёт причинную связь.
- source_word: לָקַח אֹתוֹ
  choice: взял его
  rationale: לקח обычно означает «брать, взять». Такой перевод сохраняет сдержанность оригинала и не уточняет, куда или каким образом Бог взял Еноха.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном повествовательном контексте существительное обозначает единого Бога.
theological_decisions:
- issue: Следует ли прямо сказать, что Енох не умер или был взят на небо
  choice: 'Сохранить сдержанную формулировку: «не стало его, потому что Бог взял его»'
  alternative: «он не умер»; «Бог взял его на небо»; «Бог переселил его»
  rationale: Хотя стих подразумевает необычайное Божье вмешательство, древнееврейский текст здесь прямо не говорит ни «на небо», ни «не умер». Сдержанный перевод сохраняет богословское напряжение и не вносит в стих уточнений из позднейшего толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и достоинства оригинала. Выражение «ходил с Богом» намеренно сохраняет библейскую метафору образа жизни; инверсия «не стало его» поддерживает торжественный повествовательный ритм без излишней архаизации.
