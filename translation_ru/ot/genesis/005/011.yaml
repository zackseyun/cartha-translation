lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: Всех дней жизни … было
  rationale: Генеалогическая формула обозначает полную продолжительность жизни. Перевод сохраняет образ «дней», но добавляет «жизни» для естественности и ясности по-русски.
- source_word: אֱנוֹשׁ
  choice: Енос
  rationale: Традиционная русская библейская форма имени узнаваема и соответствует сложившейся передаче древнееврейского אֱנוֹשׁ.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: девятьсот пять лет
  rationale: Древнееврейское выражение буквально располагает пять лет перед девятьюстами; русский порядок числительного естественно передаёт общую продолжительность в 905 лет.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Прямо передаёт повторяющуюся заключительную формулу родословия; местоимение необходимо для естественного русского синтаксиса.
