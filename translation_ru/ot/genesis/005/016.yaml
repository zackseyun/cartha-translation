  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: ru
  text: После того как Малелеил стал отцом Иареда, он жил восемьсот тридцать лет и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В генеалогической формуле глагол חיה обозначает продолжительность жизни после рождения названного сына; «жил» естественно и точно передаёт смысл.
- source_word: מַהֲלַלְאֵל
  choice: Малелеил
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: После рождения Иареда
  rationale: Конструкция естественно передаёт временное значение «после того, как он породил Иареда», не перегружая русский текст повторением подлежащего.
- source_word: יֶרֶד
  choice: Иаред
  rationale: Использована традиционная русская библейская форма имени.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: восемьсот тридцать лет
  rationale: Порядок компонентов числа приведён в соответствие с естественной русской речью при полном сохранении числового значения.
- source_word: וַיּוֹלֶד
  choice: родил
  rationale: В данном патриархальном генеалогическом контексте глагол означает, что Малелеил стал отцом других детей; традиционное «родил» лаконично, но в современном русском может восприниматься как обозначение материнского действия.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей и дочерей
  rationale: Сохранено прямое указание еврейского текста на потомков обоих полов.
theological_decisions:
- issue: Передача мужского каузативного הוֹלִידוֹ и וַיּוֹלֶד
  choice: «После рождения Иареда… и родил сыновей и дочерей»
  alternative: «После того как Малелеил стал отцом Иареда… у него родились сыновья и дочери»
  rationale: Выбранная формулировка сохраняет краткость и повторяемую структуру генеалогии; при этом первое употребление передано естественной именной конструкцией. Богословского уточнения сверх исходного текста не внесено.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и ритма генеалогической формулы. Имена даны в традиционных русских библейских формах. Текст намеренно лаконичен, как и еврейский оригинал.
