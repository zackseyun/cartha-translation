  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: ru
  text: После того как Мафусал стал отцом Ламеха, он прожил семьсот восемьдесят два года и стал отцом сыновей и дочерей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле глагол חיה обозначает продолжительность жизни после рождения названного сына; русское «жил» естественно и точно передаёт смысл.
- source_word: מְתוּשֶׁלַח
  choice: Мафусал
  rationale: Использована устоявшаяся в русской библейской традиции форма личного имени.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: после рождения Ламеха
  rationale: Конструкция буквально относится к тому, что Мафусал породил Ламеха. По-русски оборот «после рождения Ламеха» выражает это естественно, а субъект однозначно восстанавливается из контекста родословной.
- source_word: לֶמֶךְ
  choice: Ламех
  rationale: Использована устоявшаяся русская форма личного имени.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: семьсот восемьдесят два года
  rationale: Еврейская последовательность буквально строится как «два и восемьдесят лет и семьсот лет»; число передано в обычном русском порядке без потери содержания.
- source_word: וַיּוֹלֶד
  choice: и родил
  rationale: Каузативная форма ילד в родословной говорит о порождении потомства мужчиной. «Родил» сохраняет повтор ключевого глагола и соответствует традиционному высокому регистру, хотя в современном русском применительно к мужчине звучит книжно.
- source_word: בָּנִים וּבָנוֹת
  choice: сыновей и дочерей
  rationale: Сохранено явное указание еврейского текста на потомков обоих полов, а не обобщённое «детей».
