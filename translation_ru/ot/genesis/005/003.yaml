  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: ru
  text: Адам жил сто тридцать лет и произвёл на свет сына по своему подобию, по своему образу и назвал его Сифом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и нарёк его имя Сиф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: жил
  rationale: В родословной формуле глагол חיה обозначает прожитый к моменту рождения потомка срок; «жил» прямо и естественно передаёт эту формулу.
- source_word: אָדָם
  choice: Адам
  rationale: Здесь слово употреблено как личное имя прародителя в родословии, а не как общее обозначение человека.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: сто тридцать лет
  rationale: Обычная современная русская передача еврейского числительного с явно названной единицей времени.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד при подлежащем-мужчине означает «породил, стал отцом». Выбранная формулировка естественна в современном русском и сохраняет отцовскую роль Адама.
- source_word: בִּדְמוּתוֹ
  choice: подобного ему
  rationale: דמות обозначает подобие или сходство. Такая передача ясно выражает сходство сына с Адамом и сохраняет отличие от следующего слова «образ».
- source_word: כְּצַלְמוֹ
  choice: по его образу
  rationale: צלם последовательно передано словом «образ», а предлог כ — конструкцией «по… образу»; тем самым сохраняется словесная перекличка с Быт 1:26–27.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: и назвал его Сифом
  rationale: Это естественная русская передача еврейского оборота «нарёк его имя Сиф», без ненужной архаизации.
- source_word: שֵׁת
  choice: Сиф
  rationale: Использована устоявшаяся русская библейская форма личного имени.
theological_decisions:
- issue: Соотношение подобия и образа сына Адама с подобием и образом в Быт 1:26–27
  choice: Сохранить оба разных существительных и прямо отнести сходство к Адаму, не выводя из этого дополнительных догматических заключений.
  alternative: Истолковать выражение как указание на утрату или умаление Божьего образа после грехопадения либо свести оба слова к одному понятию.
  rationale: Текст намеренно перекликается с Быт 1:26–27, но сам стих не разъясняет богословские последствия этой переклички. Перевод сохраняет её и не разрешает заложенное в тексте напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. Избегнуты как архаическое «родил сына» о мужчине, так и разговорное «у него родился сын»; повтор «подобие — образ» сохранён, поскольку он значим в исходном тексте.
