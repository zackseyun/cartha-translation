lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Первая частица כִּי вводит довод Иуды и связывает его слова с предшествующим контекстом; «ведь» естественно передаёт эту пояснительную функцию.
- source_word: לוּלֵא
  choice: если бы не
  rationale: לוּלֵא вводит нереальное условие в прошлом; русская конструкция «если бы не» сохраняет контрфактический смысл.
- source_word: הִתְמַהְמָהְנוּ
  choice: мы не медлили
  rationale: Глагол обозначает промедление, задержку или нерешительность. «Не медлили» ясно и естественно указывает на отложенный отъезд.
- source_word: כִּי עַתָּה
  choice: то к этому времени уже
  rationale: В контрфактической конструкции сочетание указывает на результат, который успел бы осуществиться к настоящему моменту; «к этому времени уже» естественно выражает данный временной оттенок.
- source_word: שַׁבְנוּ
  choice: вернулись бы
  rationale: Форма перфекта в данном нереальном условном периоде обозначает результат, который уже наступил бы; условное наклонение передаёт это по-русски.
- source_word: זֶה פַעֲמָיִם
  choice: дважды
  rationale: Идиоматическое выражение означает «два раза»; в контексте речь о том, что две поездки уже могли быть завершены.
