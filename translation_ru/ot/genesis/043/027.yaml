  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: ru
  text: 'Он спросил их, как они поживают, и сказал: «Здоров ли ваш престарелый отец, о котором вы говорили? Жив ли он ещё?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: Он спросил их, как они поживают
  rationale: Еврейская идиома буквально говорит о расспросе относительно שָׁלוֹם — общего благополучия. Русское «как они поживают» естественно передаёт этот смысл, не сужая его до одного лишь здоровья.
- source_word: הֲשָׁלוֹם
  choice: Здоров ли
  rationale: В вопросе о престарелом отце שָׁלוֹם обозначает, всё ли с ним благополучно. В данном контексте русское «здоров ли» звучит естественно, хотя несколько конкретнее еврейского выражения.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: ваш престарелый отец
  rationale: Прилагательное זָקֵן прямо указывает на преклонный возраст. «Престарелый» сохраняет это указание и соответствует dignified literary register.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: о котором вы говорили
  rationale: Естественная русская передача относительного оборота, отсылающего к прежнему рассказу братьев об отце.
- source_word: הַעוֹדֶנּוּ חָי
  choice: Жив ли он ещё?
  rationale: Точно и идиоматично передаёт сочетание עוֹד «ещё, всё ещё» и חַי «жив».
