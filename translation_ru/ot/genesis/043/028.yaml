  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: ru
  text: 'Они ответили: «С твоим слугой, нашим отцом, всё благополучно; он ещё жив». И они поклонились и пали ниц.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלוֹם
  choice: здоров
  rationale: В ответе на вопрос о состоянии отца слово обозначает благополучие, а не мир в узком смысле. «Здоров» естественно передаёт смысл в данном контексте.
- source_word: לְעַבְדְּךָ
  choice: твой слуга
  rationale: Это почтительное обозначение себя при обращении к вышестоящему; «слуга» сохраняет придворную учтивость, не приписывая человеку положение раба.
- source_word: לְאָבִינוּ
  choice: наш отец
  rationale: Прямо передаёт притяжательную конструкцию и выступает приложением к словам «твой слуга».
- source_word: עוֹדֶנּוּ חָי
  choice: он ещё жив
  rationale: Сохраняет значение продолжающейся жизни и звучит естественно в современном русском языке.
- source_word: וַיִּקְּדוּ
  choice: они склонились
  rationale: Глагол описывает наклон тела в знак почтения; выбранный вариант передаёт физическое движение и отличает его от следующего, более полного земного поклона.
- source_word: וישתחו
  choice: пали ниц
  rationale: Передаёт телесное простирание перед правителем как знак почтения, не внося неуместного здесь значения религиозного поклонения.
theological_decisions:
- issue: Значение жеста וישתחו
  choice: пали ниц
  alternative: поклонились; поклонились как Богу
  rationale: Контекст описывает почтение перед Иосифом, а не богослужение. Перевод сохраняет физический жест, не добавляя отсутствующего в повествовании богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с сохранением почтительной формы обращения. Два последовательных глагола жеста переданы различно — «склонились» и «пали ниц», чтобы отразить усиление движения и избежать религиозной трактовки второго глагола.
