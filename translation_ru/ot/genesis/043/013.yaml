lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם
  choice: также вашего брата
  rationale: 'Союз перед показателем прямого дополнения имеет здесь добавочное значение: братья должны взять ещё и брата. Имя Вениамина не вставлено в основной текст, поскольку в еврейском сказано буквально «вашего брата».'
- source_word: קָחוּ
  choice: возьмите с собой
  rationale: Императив множественного числа от לקח означает «возьмите». Оборот «с собой» естественно передаёт подразумеваемое совместное путешествие, не меняя направления действия.
- source_word: וְ/ק֖וּמוּ
  choice: встаньте
  rationale: Императив от קום сохранён отдельным глаголом, передающим побуждение подняться и действовать; более свободное «отправляйтесь» устранило бы один из двух еврейских императивов.
- source_word: שׁ֥וּבוּ
  choice: возвращайтесь
  rationale: Императив от שוב в контексте поездки означает возвращение к человеку, у которого братья уже были.
- source_word: אֶל הָ/אִישׁ
  choice: к тому человеку
  rationale: Предлог אֶל обозначает направление «к», а определённое הָאִישׁ указывает на уже известного из контекста человека. Русское «тому человеку» звучит естественно и не добавляет его имени или должности.
