base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: ru
  text: 'Он поднял глаза и увидел Вениамина, своего брата, сына той же матери, и спросил: «Это ваш самый младший брат, о котором вы мне говорили?» Потом он сказал: «Да будет Бог милостив к тебе, сын мой!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Он поднял глаза
  rationale: Еврейский образ передан близко к форме оригинала; выражение естественно для русского повествования и сохраняет наглядность исходной идиомы.
- source_word: וַיַּרְא
  choice: и увидел
  rationale: Прямое значение глагола ראה точно и естественно передаётся глаголом «увидел».
- source_word: אֶת בִּנְיָמִין
  choice: Вениамина
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: своего брата, сына своей матери
  rationale: Сохранена приложительная конструкция оригинала, подчёркивающая, что Вениамин был братом Иосифа по одной матери; интерпретирующее сокращение «родного брата» не вводится.
- source_word: הֲזֶה
  choice: Это
  rationale: Вопросительная частица и указательное местоимение естественно выражены русской вопросительной конструкцией «Это…?».
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ваш младший брат
  rationale: В контексте הַקָּטֹן обозначает младшего среди братьев. Русское «младший брат» естественно и не добавляет идеи малого роста.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: о котором вы мне говорили
  rationale: Передаёт смысл буквально близко и при этом естественно для современного литературного русского языка.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычное обозначение Бога в благословении передано стандартным русским соответствием без добавления заветного имени.
- source_word: יָחְנְךָ
  choice: Да будет Бог милостив к тебе
  rationale: Пожелательно-благословительная сила еврейской формы передана конструкцией с «да будет»; «милостив» сохраняет значение благосклонности и милости корня חנן.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохранено мужское, ласковое и покровительственное обращение оригинала; порядок слов соответствует достойному библейскому регистру русского языка.
theological_decisions:
- issue: Передача благословительной формы с אֱלֹהִים
  choice: Да будет Бог милостив к тебе, сын мой!
  alternative: Бог да помилует тебя, сын мой!
  rationale: Выбранный вариант ясно выражает пожелание-благословение, не превращая его в утверждение и не добавляя богословского содержания. «Милостив к тебе» точнее передаёт благосклонность חנן, чем возможное «помилует», которое может подразумевать избавление от наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксис сохраняет последовательность и выразительность еврейского текста, оставаясь понятным обычному читателю.
