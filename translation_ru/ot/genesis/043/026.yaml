base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: ru
  text: Когда Иосиф вошёл в дом, они принесли ему в дом[b] подарок[a], который держали в руках, и поклонились ему до земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подношение»; в зависимости от контекста еврейское слово может также означать дань.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте выражение «в дом» повторено: сначала об Иосифе, затем о принесённом подарке.'
    reason: source_structure
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: В сочетании с направительным הַבַּיְתָה глагол בוא здесь естественно передаётся как движение внутрь дома.
- source_word: הַבַּיְתָה
  choice: в дом
  rationale: Направительное окончание выражает движение к дому или внутрь него; по контексту выбрано «в дом».
- source_word: וַיָּבִיאוּ לוֹ
  choice: принесли ему
  rationale: Каузативная форма בוא означает «принести»; местоименное дополнение לוֹ указывает на Иосифа как получателя.
- source_word: הַמִּנְחָה
  choice: подарок
  rationale: מִנְחָה может означать дар, подношение или дань. Здесь речь идёт о подарке, привезённом братьями для расположения египетского правителя, а не о культовой жертве.
- source_word: אֲשֶׁר בְּיָדָם
  choice: который держали в руках
  rationale: Передаёт конкретный образ еврейского выражения «который был в их руках» естественным современным русским языком.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: поклонились ему
  rationale: Форма глагола שׁחה обозначает глубокий поклон как выражение почтения или подчинения.
- source_word: אָרְצָה
  choice: до земли
  rationale: Направительная форма от אֶרֶץ указывает на движение к земле; русское «поклонились до земли» точно и естественно описывает жест.
