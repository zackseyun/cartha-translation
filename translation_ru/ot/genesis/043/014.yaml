  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: ru
  text: А Бог Всемогущий пусть дарует вам милость в глазах того человека[a], чтобы он отпустил вашего другого брата[b] и Вениамина. А я — если лишусь детей, то лишусь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть дарует вам сострадание перед тем человеком». Еврейское слово может означать милость, сострадание или глубокую жалость.'
    reason: lexical_alternative
  - marker: b
    text: «Ваш другой брат» — Симеон, которого оставили под стражей в Египте.
    reason: cross_reference
  - marker: c
    text: 'Или: «когда лишусь детей, то лишусь». Еврейский текст повторяет один и тот же глагол для усиления, выражая готовность Иакова принять возможную утрату.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Бог Всемогущий
  rationale: Божественный титул передан по смыслу, а не транслитерирован; это традиционное и понятное соответствие, сохраняющее обращение к Божьему могуществу.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: пусть даст вам милость у того человека
  rationale: רַחֲמִים обозначает милость, сострадание или жалость; русское выражение «дать милость у кого-либо» передаёт молитвенное пожелание, чтобы человек отнёсся к ним милостиво. לִפְנֵי передано естественным контекстуальным «у».
- source_word: וְשִׁלַּח לָכֶם
  choice: чтобы он отпустил с вами
  rationale: Продолжение пожелания относится к египетскому правителю. «Отпустил с вами» естественно выражает освобождение задержанного брата и его возвращение вместе с братьями.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: другого вашего брата
  rationale: אַחֵר различает этого брата и Вениамина; в контексте речь идёт о задержанном Симеоне, но имя не внесено в основной текст.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: если суждено мне лишиться детей, пусть лишусь
  rationale: Повтор корня שׁכל выражает смирение перед возможной утратой. Формулировка сохраняет повтор идеи и эмоциональную решимость, тогда как буквальное «как я лишился, я лишился» по-русски неясно.
theological_decisions:
- issue: Передача титула אֵל שַׁדַּי
  choice: Бог Всемогущий
  alternative: Эль-Шаддай
  rationale: Перевод титула делает его смысл доступным читателю и не навязывает частной богословской трактовки.
- issue: Характер заключительных слов Иакова
  choice: условное смирение перед возможной утратой
  alternative: утверждение уже совершившейся или неизбежной утраты
  rationale: Еврейская конструкция допускает трудность в точной временно-модальной передаче; контекст показывает согласие Иакова принять возможный исход, не утверждая, что утрата непременно предопределена.
translation_notes:
  register: Современный литературный русский язык с достоинством патриархальной речи. Молитвенное пожелание передано конструкцией «пусть», а заключение — естественной русской формулой смирения; подлинная неоднозначность еврейской фразы отмечена в сноске.
