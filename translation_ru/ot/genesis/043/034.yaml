source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: ru
  text: Он распорядился подать им порции со своего стола[a], но порция Вениамина была в пять раз больше порции каждого из них[b]. Они пили вместе с ним и опьянели[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от того, что было перед ним» или «от его лица»; вероятно, имеются в виду порции, поданные с места Иосифа за столом.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «на пять рук» — древнееврейское выражение со значением «в пять раз больше».'
    reason: lexical_alternative
  - marker: c
    text: 'Иногда переводят мягче: «развеселились», однако древнееврейский глагол непосредственно означает, что они опьянели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: распорядился подать … порции
  rationale: В контексте пира сочетание означает не буквальное «поднял», а передачу или подачу участникам трапезы порций еды.
- source_word: מֵאֵת פָּנָיו
  choice: со своего стола
  rationale: Буквальный образ «от своего лица / от того, что перед ним» указывает на порции, поданные от места Иосифа за столом; выбран естественный русский эквивалент, а буквальная форма отмечена в сноске.
- source_word: מִמַּשְׂאֹת כֻּלָּם
  choice: порции каждого из них
  rationale: Сравнение относится к порции каждого из остальных братьев, а не к общей сумме всех их порций.
- source_word: חָמֵשׁ יָדוֹת
  choice: в пять раз больше
  rationale: Буквально «пять рук»; это древнееврейский способ выразить пятикратную величину.
- source_word: וַיִּשְׁתּוּ
  choice: они пили
  rationale: Прямой и естественный перевод повествовательной формы глагола.
- source_word: וַיִּשְׁכְּרוּ
  choice: опьянели
  rationale: Глагол прямо обозначает состояние опьянения; более мягкое «развеселились» неоправданно ослабило бы исходный текст.
- source_word: עִמּוֹ
  choice: вместе с ним
  rationale: Местоимение относится к Иосифу; сохранена местоименная форма оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной синтаксической структурой. Формулировка «со своего стола» естественно передаёт культурный смысл выражения, тогда как сноска сохраняет его буквальный образ. Прямое «опьянели» не сглаживает значение исходного глагола.
