base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: ru
  text: 'Тогда Израиль, их отец, сказал им: «Если уж так, то сделайте вот что: возьмите с собой в сосудах немного лучшего, что даёт эта земля[a], и отнесите тому человеку в дар: немного бальзама, немного мёда[b], благовонной смолы и лабданума[c], фисташек и миндаля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из отборного [произведения] земли». Еврейское выражение означает лучшие произведения земли вообще, а не только фрукты.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «мёд», в некоторых контекстах может обозначать сладкий плодовый сироп.
    reason: lexical_alternative
  - marker: c
    text: Точно определить вещества, названные здесь еврейскими словами נְכֹאת и לֹט, невозможно. Возможно, речь идёт о других ароматических смолах, например трагаканте и лабдануме.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: Израиль, их отец
  rationale: Сохранено имя «Израиль», употреблённое повествователем, и пояснительное приложение; порядок слов естественен для современного русского языка.
- source_word: אִם כֵּן אֵפוֹא
  choice: Если уж так, то
  rationale: Оборот передаёт не простое условие, а вынужденное, неохотное согласие с обстоятельствами.
- source_word: זֹאת עֲשׂוּ
  choice: сделайте вот что
  rationale: Естественная русская форма повеления, точно вводящая последующие указания.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: немного лучшего, что даёт эта земля
  rationale: Передаёт отборность и широкий смысл земных произведений, не ограничивая выражение только фруктами.
- source_word: בִּכְלֵיכֶם
  choice: с собой в сосудах
  rationale: כְּלִי — общее обозначение сосуда или вместилища; «сосуды» сохраняет предметную неопределённость исходного текста.
- source_word: וְהוֹרִידוּ
  choice: отнесите
  rationale: В контексте путешествия в Египет глагол обозначает доставку туда дара; буквальное «снесите вниз» в современном русском создавало бы ложное впечатление перемещения вниз по лестнице или склону.
- source_word: לָאִישׁ
  choice: тому человеку
  rationale: Речь идёт об уже известном братьям египетском правителе; указательное «тому» естественно выражает эту определённость.
- source_word: מִנְחָה
  choice: в дар
  rationale: В данном дипломатическом контексте это подарок, а не культовое приношение; форма «в дар» естественно связывает существительное со сказуемым.
- source_word: מְעַט צֳרִי
  choice: немного бальзама
  rationale: «Бальзам» — понятное и традиционное обозначение целебной ароматической смолы, соответствующее обычному значению צֳרִי.
- source_word: וּמְעַט דְּבַשׁ
  choice: немного мёда
  rationale: «Мёд» является основным значением слова; возможность обозначения сладкого сиропа сохранена в примечании.
- source_word: נְכֹאת
  choice: благовонная смола
  rationale: Точное растение не установлено; общее обозначение передаёт вид вещества, не создавая ложной ботанической точности.
- source_word: לֹט
  choice: ладан
  rationale: Выбрано знакомое русскому читателю название ароматической смолы; неопределённость идентификации исходного термина явно отмечена в сноске.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: фисташек и миндаля
  rationale: Точные и общеупотребительные современные названия плодов.
