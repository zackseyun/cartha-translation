base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: ru
  text: 'Когда мы пришли на место ночлега и открыли свои мешки, то вот: серебро каждого оказалось в отверстии его мешка[a] — всё наше серебро, точно по весу[b]. И мы принесли его обратно с собой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во рту его мешка».'
    reason: lexical_alternative
  - marker: b
    text: То есть было возвращено точно то количество серебра, которое прежде отвесили.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: место ночлега
  rationale: Слово обозначает место остановки на ночь во время пути и не обязательно подразумевает постоялый двор.
- source_word: וַנִּפְתְּחָה
  choice: открыли
  rationale: Форма первого лица множественного числа передаёт следующее действие рассказчиков; по-русски местоимение естественно подразумевается.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: мешки / его мешка
  rationale: Речь идёт о дорожных мешках для зерна; «мешок» точно соответствует контексту повествования.
- source_word: וְהִנֵּה
  choice: то увидели
  rationale: Частица вводит внезапно обнаружившееся обстоятельство. Эта передача естественно выражает неожиданность в современной русской повествовательной речи.
- source_word: כֶּסֶף אִישׁ
  choice: серебро каждого
  rationale: Сохраняется distributивный смысл אִישׁ и прямое значение כֶּסֶף — серебро, служившее средством платежа.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: у отверстия его мешка
  rationale: Буквально «у рта его мешка»; функциональная передача «у отверстия» понятна современному читателю, а буквальный образ отмечен в сноске.
- source_word: כַּסְפֵּנוּ בְּמִשְׁקָלוֹ
  choice: всё наше серебро, точно по весу
  rationale: Фраза указывает, что возвращено именно то количество серебра, которое было отвешено, без недостачи.
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: мы принесли его обратно с собой
  rationale: Глагол выражает возвращение серебра, а идиома «в нашей руке» указывает, что братья принесли его лично, при себе. Русская формулировка сохраняет смысл без неестественной кальки.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис прямой речи сделан естественным; неожиданность открытия передана словами «то увидели». Буквальный еврейский образ «рот мешка» вынесен в сноску, а идиома «в нашей руке» передана по смыслу как «с собой».
