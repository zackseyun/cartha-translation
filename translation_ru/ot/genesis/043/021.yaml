    issue: «У отверстия его мешка»
    rationale: Предлог «у» в русском обычно обозначает расположение возле отверстия. В оригинале בְּ («в») с «ртом» мешка указывает на его отверстие как место, где находилось серебро.
  - severity: low
    issue: 'Сноска a: «у рта его мешка»'
    rationale: 'Буквальная еврейская конструкция содержит предлог «в»: «во рту его мешка». Сноска должна точно отражать буквальную форму.'
