source:
  edition: WLC
  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: ru
  text: И они приготовили подарок к приходу Иосифа в полдень, потому что услышали, что там будут есть хлеб[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть хлеб»; это древнееврейское выражение может означать совместную трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: приготовили
  rationale: Порода hифиль глагола כון здесь означает «подготовить, привести в готовность»; «приготовили» естественно передаёт действие над подарком.
- source_word: הַמִּנְחָה
  choice: подарок
  rationale: В данном повествовательном контексте מִנְחָה — дар братьев Иосифу, а не культовое приношение; «подарок» ясно и не создаёт ненужного жертвенного оттенка.
- source_word: עַד בּוֹא יוֹסֵף
  choice: к приходу Иосифа
  rationale: Оборот с עַד и инфинитивом בּוֹא обозначает срок, к которому подарок был подготовлен. Русское «к приходу» естественно выражает этот временной предел, не создавая впечатления, будто приготовление непрерывно продолжалось до самого появления Иосифа.
- source_word: בַּצָּהֳרָיִם
  choice: в полдень
  rationale: Существительное обозначает полдень; это краткий и обычный русский эквивалент.
- source_word: כִּי שָׁמְעוּ
  choice: потому что услышали
  rationale: Первое כִּי имеет причинное значение и объясняет, почему братья подготовили подарок.
- source_word: כִּי שָׁם
  choice: что там
  rationale: Второе כִּי вводит содержание услышанного, а שָׁם указывает место; в русском естественен порядок «что там будут…».
- source_word: יֹאכְלוּ לָחֶם
  choice: будут есть хлеб
  rationale: Сохранён буквальный образ «есть хлеб», который в древнееврейском может означать совместную трапезу; сноска поясняет идиому, не устраняя её из текста.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Использована укоренившаяся в современном русском литературном и библейском употреблении форма имени, соответствующая древнееврейскому יוֹסֵף.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с простой повествовательной синтаксической структурой. Начальное «И» сохраняет древнееврейскую повествовательную связь. Местоименное подлежащее при «будут есть» не добавлено: русский язык допускает его опущение, сохраняя контекстуальную отнесённость к братьям.'
