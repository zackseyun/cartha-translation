  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: повествовательное «и», приготовление дара, временную связь с приходом Иосифа в полдень, причинное «потому что» и содержание услышанного. «К приходу Иосифа в полдень» естественно выражает, что приход Иосифа ожидался в полдень. «Будут есть хлеб» сохраняет буквальную лексику לָחֶם, а сноска надлежащим образом поясняет идиоматический смысл.'
