  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: ru
  text: 'Они сказали: «Прошу вас, господин[b], мы в первый раз действительно спустились[a], чтобы купить еды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст усиливает утверждение сочетанием абсолютного инфинитива с личной формой глагола: «мы действительно спустились».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «господин» — почтительное обращение к человеку, стоящему выше по положению, а не Божий титул.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Они сказали
  rationale: Обычная повествовательная форма с последовательным וַ; в русском продолжение рассказа естественно передаётся без обязательного начального союза.
- source_word: בִּי
  choice: Просим
  rationale: В данном обращении это вежливое и почтительное ходатайство, а не буквальное предложное выражение.
- source_word: אֲדֹנִי
  choice: господин наш
  rationale: Почтительное обращение к человеку, стоящему выше по положению. Множественное «наш» естественно соотносит обращение со всей говорящей группой, хотя еврейская форма буквально означает «мой господин».
- source_word: יָרֹד יָרַדְנוּ
  choice: мы действительно спустились сюда
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает утверждение. «Действительно» сохраняет этот акцент, а «спустились» передаёт пространственный образ исходного глагола.
- source_word: בַּתְּחִלָּה
  choice: в первый раз
  rationale: В контексте речь идёт о предыдущем посещении Египта, а не об отвлечённом начале.
- source_word: לִשְׁבָּר
  choice: чтобы купить
  rationale: Глагол обозначает приобретение продовольствия, обычно зерна, за плату; при общем дополнении «еда» уместен широкий глагол «купить».
- source_word: אֹכֶל
  choice: еды
  rationale: Существительное имеет общее значение «пища, еда»; перевод не сужает его до зерна, хотя в контексте речь прежде всего о зерне.
theological_decisions:
- issue: Значение אֲדֹנִי в обращении
  choice: господин наш
  alternative: Господь наш
  rationale: Здесь это светское почтительное обращение к человеческому начальнику, а не Божий титул.
translation_notes:
  register: Современный литературный русский язык с почтительным, но понятным обращением. Эмфатическая конструкция передана явно, а пространственный оттенок глагола сохранён словом «спустились».
