base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: ru
  text: 'Они ответили: «Тот человек подробно расспрашивал о нас и о нашей родне: „Жив ли ещё ваш отец? Есть ли у вас брат?“ Мы и рассказали ему то, о чём он спрашивал. Разве могли мы знать, что он скажет: „Приведите сюда вашего брата“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: подробно расспрашивал
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагол; по-русски естественно передать это наречием «подробно».
- source_word: מוֹלַדְתֵּנוּ
  choice: нашей родне
  rationale: В данном контексте слово обозначает семейное происхождение и круг родственников; «родня» ясно и естественно связывает вопрос с отцом и братом.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: о том, о чём он спрашивал
  rationale: Буквально «согласно этим словам/обстоятельствам»; контекстуальная передача показывает, что братья отвечали в соответствии с заданными вопросами, не добавляя нового содержания.
- source_word: הֲיָדוֹעַ נֵדַע
  choice: Разве могли мы знать
  rationale: Инфинитив абсолютный усиливает риторический вопрос и выражает невозможность предвидеть последующее требование.
- source_word: הוֹרִידוּ
  choice: приведите сюда
  rationale: Буквально «спустите/приведите вниз» — движение в Египет. Дейктическое «сюда» естественно передаёт приказ египетского правителя без неестественного русского «спустите».
