  source_fidelity: Смысл порядка рассадки по возрасту/порядку рождения передан верно, как и взаимное изумление. Однако «по своему первородству» в современном русском прежде всего означает статус или право первородства, а не место в последовательности рождения; «по своей младости» звучит неестественно и может означать лишь юность. «Расселись» также несколько сильнее, чем простое «сели».
