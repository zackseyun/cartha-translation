lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: И расселись они
  rationale: Активная повествовательная форма глагола ישׁב передана естественным русским «расселись»; контекст упорядоченного размещения отражён без превращения формы в пассив.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Прямое пространственное значение выражения с פני; сохраняется отношение к Иосифу.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: первенец — по своему первородству
  rationale: Сохранены общий корень и смысл статуса первенца; в данном контексте выражение указывает также на место по порядку рождения.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: а самый младший — по своей младости
  rationale: Контраст с первенцем и полный ряд братьев требуют превосходного смысла «самый младший»; «по своей младости» сохраняет необычный параллелизм еврейского текста.
- source_word: וַיִּתְמְהוּ
  choice: изумлённо смотрели
  rationale: Глагол выражает сильное удивление; сочетание с взаимным оборотом естественно передано как взаимные взгляды в изумлении.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: друг на друга
  rationale: Обычный русский эквивалент еврейского взаимного оборота «каждый к своему ближнему/товарищу».
