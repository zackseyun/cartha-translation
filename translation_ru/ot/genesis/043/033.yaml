  terminology: «Первенец» сохранён в пояснительной сноске как соответствие еврейскому הַבְּכֹר. В основном тексте «по порядку рождения» точно передаёт контекстуальное значение парных выражений כִּבְכֹרָתוֹ / כִּצְעִרָתוֹ, не вводя юридически окрашенное «первородство».
