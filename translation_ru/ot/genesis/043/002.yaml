lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: В повествовательной связи формула вводит следующее событие; по-русски придаточное времени естественно передаёт последовательность без тяжеловесного «и было».
- source_word: כִּלּוּ לֶאֱכֹל
  choice: они съели всё
  rationale: Сочетание глагола завершения с инфинитивом означает, что принесённые запасы были полностью съедены; такая формулировка естественна и ясна по-русски.
- source_word: הַשֶּׁבֶר
  choice: зерно
  rationale: В рассказе об Иосифе слово обозначает зерно, приобретаемое во время голода, а не пищу вообще.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: которое привезли из Египта
  rationale: Относительное придаточное сохраняет синтаксическую связь и ясно указывает на ранее совершённое действие.
- source_word: אֲבִיהֶם
  choice: отец
  rationale: Русская форма без притяжательного местоимения естественна при ясном отношении и точно передаёт названную в еврейском тексте родственную роль.
- source_word: שֻׁבוּ
  choice: Снова пойдите
  rationale: Императив שׁוב требует повторного похода или возвращения; в данной точке повествования «снова пойдите» естественно отражает направление от говорящего в Египет.
- source_word: שִׁבְרוּ
  choice: купите
  rationale: В данном контексте глагол означает покупать зерно или припасы; общий объект далее прямо назван словом «еда».
- source_word: לָנוּ
  choice: нам
  rationale: Дательный падеж естественно передаёт значение приобретения для семьи.
- source_word: מְעַט אֹכֶל
  choice: немного еды
  rationale: Сохраняется общее значение אֹכֶל «пища, еда», в отличие от более конкретного הַשֶּׁבֶר в первой части стиха.
