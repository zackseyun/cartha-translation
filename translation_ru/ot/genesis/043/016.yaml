base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: ru
  text: 'Когда Иосиф увидел, что с ними Вениамин, он сказал управляющему его домом[a]: «Введи этих людей в дом, заколи животное[b] и приготовь его, потому что в полдень[c] эти люди будут есть со мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тому, кто над его домом»; то есть человеку, ведавшему домом Иосифа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «заколи заклание» — еврейский оборот, означающий заколоть животное для трапезы.'
    reason: cultural_note
  - marker: c
    text: 'Или: «среди дня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... אִתָּם אֶת־בִּנְיָמִין
  choice: увидел, что с ними Вениамин
  rationale: Такая конструкция естественно передаёт зрительное восприятие и присутствие Вениамина вместе с братьями, не добавляя оттенка пристального разглядывания.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: управляющему своим домом
  rationale: Передаёт должностную функцию человека, поставленного над домом Иосифа, современным и понятным русским языком; буквальная структура отмечена в сноске.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: Введи этих людей в дом
  rationale: Направительный суффикс у слова «дом» указывает на движение внутрь; «введи» естественно выражает повеление привести их в дом.
- source_word: וּטְבֹחַ טֶבַח
  choice: заколи животное
  rationale: Внутренний объект образует еврейский оборот со значением заколоть животное для еды; вид животного в тексте не уточняется.
- source_word: וְהָכֵן
  choice: и приготовь его
  rationale: Повелительная форма означает «приготовь, сделай готовым»; местоимение естественно связывает действие с только что упомянутым животным, то есть с пищей из него.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: потому что ... эти люди будут есть со мной
  rationale: כִּי вводит основание для приказаний, а אִתִּי прямо означает совместную трапезу с Иосифом.
- source_word: בַּצָּהֳרָיִם
  choice: в полдень
  rationale: Обычный современный русский эквивалент обозначения середины дня.
theological_decisions: []
