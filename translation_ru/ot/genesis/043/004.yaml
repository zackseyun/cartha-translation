lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Передаёт обычное условие без добавочного усиления.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: ты пошлёшь
  rationale: Естественно выражает по-русски условие, сохраняя волю и действие отца; оборот также допускает оттенок готовности, отмеченный в сноске.
- source_word: אֶת אָחִינוּ
  choice: нашего брата
  rationale: Прямо передаёт существительное с суффиксом первого лица множественного числа и сохраняет семейный акцент.
- source_word: אִתָּנוּ
  choice: с нами
  rationale: Точно передаёт значение совместного следования.
- source_word: נֵרְדָה
  choice: мы пойдём
  rationale: Когортатив здесь выражает намерение как следствие поставленного условия; в русском контексте направление движения не требует буквального «спустимся».
- source_word: וְנִשְׁבְּרָה
  choice: и купим
  rationale: В повествовательном контексте глагол שבר означает покупку продовольствия.
- source_word: לְךָ
  choice: тебе
  rationale: Естественно передаёт значение пользы или назначения действия.
- source_word: אֹכֶל
  choice: еды
  rationale: Сохраняет общее значение «пища, продовольствие», не сужая его до зерна.
