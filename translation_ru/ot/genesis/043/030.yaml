  text: וַ/יְמַהֵ֣ר יוֹסֵ֗ף כִּֽי נִכְמְר֤וּ רַחֲמָי/ו֙ אֶל אָחִ֔י/ו וַ/יְבַקֵּ֖שׁ לִ/בְכּ֑וֹת וַ/יָּבֹ֥א הַ/חַ֖דְרָ/ה וַ/יֵּ֥בְךְּ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: ru
  text: Иосиф поспешил, потому что в нём всколыхнулось сострадание к брату, и он стал искать, где бы поплакать[a]. Он вошёл в комнату и там заплакал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он стремился заплакать». Буквально: «он искал плакать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: поспешил удалиться
  rationale: Глагол означает «поспешил»; удаление из общего помещения следует из контекста, но не выражено отдельным словом, поэтому передаётся сдержанно.
- source_word: נִכְמְרוּ רַחֲמָיו אֶל אָחִיו
  choice: при виде брата его охватила жалость
  rationale: Естественно передаёт еврейскую идиому о сильном пробуждении сострадания; «при виде» отражает направленность чувства к брату в данном контексте.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: Ему хотелось плакать
  rationale: בקשׁ с инфинитивом буквально допускает «искал/стремился плакать»; по-русски сочетание «искал плакать» невозможно, а контекстуальное «искал место» является добавлением, поэтому выбран естественный перевод желания с примечанием об альтернативе.
- source_word: הַחַדְרָה
  choice: во внутреннюю комнату
  rationale: חדר обозначает отдельную, внутреннюю или частную комнату; форма с направительным ה передана конструкцией «вошёл во…».
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: и там заплакал
  rationale: Сохраняет значение глагола «плакать» и явное указание места שמה.
