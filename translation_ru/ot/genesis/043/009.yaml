base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: ru
  text: Я сам поручусь за него. С меня ты и спросишь за него. Если я не приведу его к тебе и не представлю его перед тобой, то буду виновен перед тобой[a] до конца моих дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквальнее: «тогда согрешу против тебя до конца моих дней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Я сам
  rationale: 'Самостоятельное местоимение имеет эмфатическую силу: Иуда лично принимает на себя ответственность.'
- source_word: אֶֽעֶרְבֶ֔נּוּ
  choice: поручусь за него
  rationale: Глагол ערב обозначает принятие на себя роли поручителя; это естественная современная русская передача правовой ответственности.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: С меня ты и спросишь за него
  rationale: Русский оборот «спросить с кого-либо за кого-либо» естественно передаёт образ личной подотчётности, выраженный буквально словами «из моей руки потребуешь его».
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: приведу его к тебе
  rationale: Каузативная форма בוא означает «привести». Значение возвращения ясно из контекста, но отдельно в еврейском тексте не выражено.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: и не поставлю перед тобой
  rationale: Сохраняется конкретный образ личного представления Вениамина отцу.
- source_word: וְחָטָאתִי לְךָ
  choice: то буду виновен перед тобой
  rationale: В контексте обязательства חטא выражает вину Иуды перед отцом; перевод сохраняет нравственную серьёзность, не превращая фразу в отвлечённое богословское утверждение.
- source_word: כָּל הַיָּמִים
  choice: во все мои дни
  rationale: Передаёт пожизненную продолжительность и сохраняет образность исходного выражения.
theological_decisions:
- issue: Значение וְחָטָאתִי לְךָ в межличностном обязательстве
  choice: то буду виновен перед тобой
  alternative: то согрешу против тебя
  rationale: Обычное значение חטא связано с грехом, однако здесь Иуда принимает пожизненную ответственность перед отцом. Основной перевод естественно выражает виновность, а более буквальная возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Выражение «С меня ты и спросишь» делает древний образ ответственности понятным, а «поставлю перед тобой» сохраняет конкретность еврейского текста.
