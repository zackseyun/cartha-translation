  text: וְ/כֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְ/יֶדְ/כֶ֑ם וְ/אֶת הַ/כֶּ֜סֶף הַ/מּוּשָׁ֨ב בְּ/פִ֤י אַמְתְּחֹֽתֵי/כֶם֙ תָּשִׁ֣יבוּ בְ/יֶדְ/כֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: ru
  text: Возьмите с собой двойную сумму денег[a], а деньги, которые были положены обратно у отверстий ваших мешков, возвратите. Возможно, это ошибка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё такую же сумму денег».'
    reason: 'лексическая неоднозначность: מִשְׁנֶה может обозначать удвоенное количество в целом или дополнительную равную сумму'
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: двойную сумму денег
  rationale: Сочетание обозначает удвоенное количество серебра как платёжного средства. «Двойную сумму денег» ясно передаёт количественное значение, не вводя лишних уточнений.
- source_word: קְחוּ בְיֶדְכֶם
  choice: возьмите с собой
  rationale: Буквально «возьмите в вашей руке»; в данном контексте это еврейский способ выразить ношение при себе. Русское «с собой» естественно передаёт смысл.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: деньги, которые были положены обратно
  rationale: Страдательная форма от שוב указывает, что деньги были возвращены на прежнее место или положены обратно; перевод не создаёт впечатления, будто братья уже сами их возвратили.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: в горловины ваших мешков
  rationale: Буквально «в устье ваших мешков». «Горловины» сохраняет образ отверстия ёмкости и звучит естественно по-русски.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: отнесите обратно с собой
  rationale: Каузативная форма שוב означает «вернуть, доставить обратно», а בְיֶדְכֶם — нести при себе. Формулировка передаёт и направление действия, и способ доставки.
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: Возможно, это произошло по ошибке
  rationale: מִשְׁגֶּה обозначает ошибку или недосмотр, без обязательного оттенка нравственной вины; «возможно» сохраняет выраженную в אוּלַי неуверенность.
