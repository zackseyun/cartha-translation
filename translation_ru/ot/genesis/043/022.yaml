  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: ru
  text: Мы принесли с собой ещё серебро[a][c], чтобы купить пищу[b]. Мы не знаем, кто положил наше серебро в наши мешки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деньги». Еврейское слово כֶּסֶף может означать как серебро, так и деньги.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы купить зерно»; в данном контексте выражение может обозначать именно покупку зерна, хотя существительное אֹכֶל имеет более широкое значение — «пища».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в нашей руке».'
    reason: source_idiom
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: И ещё серебро
  rationale: כֶּסֶף буквально означает «серебро» и в данном контексте служит платёжным средством; אַחֵר указывает на дополнительное серебро сверх возвращённого.
- source_word: הוֹרַדְנוּ
  choice: мы принесли
  rationale: Каузативная форма от ירד буквально означает «спустили, принесли вниз»; по-русски направление движения в Египет естественно не выражать глаголом «спустить», поскольку здесь важнее факт доставки серебра.
- source_word: בְ/יָדֵ/נוּ
  choice: с собой
  rationale: Буквально «в нашей руке»; русское «с собой» естественно передаёт значение обладания и переноски, не создавая неуместного образа одной общей руки.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: чтобы купить пищу
  rationale: В этом контексте שׁבר означает покупку продовольствия, часто зерна, а אֹכֶל — более широкое «пища, еда»; выбранный вариант сохраняет широту существительного.
- source_word: לֹא יָדַעְנוּ
  choice: Мы не знаем
  rationale: Перфект выражает сохраняющееся состояние незнания; настоящее время естественно передаёт заявление братьев в прямой речи.
- source_word: מִי שָׂם
  choice: кто положил
  rationale: Прямая и естественная передача косвенного вопроса и обычного значения שׂים «класть, помещать».
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: в наши мешки
  rationale: אַמְתַּחַת обозначает дорожный мешок или вьючную суму для припасов; «мешки» соответствует предметному контексту рассказа.
