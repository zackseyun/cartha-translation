base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: ru
  text: 'И подали ему отдельно, им отдельно и египтянам, которые ели с ним, отдельно, потому что египтяне не могли есть хлеб вместе с евреями[a]: для египтян это было мерзостью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть хлеб с евреями»; это выражение означает разделять с ними трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: подали
  rationale: Буквально глагол означает «положили, поставили», но в контексте трапезы речь идёт о подаче пищи; «подали» естественно передаёт действие по-русски.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: отдельно
  rationale: Повтор слова «отдельно» сохраняет подчёркнутое в еврейском тексте разделение трёх групп за трапезой.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: которые ели с ним
  rationale: Причастный оборот передан естественным русским определительным придаточным без уточнения вида действия, которого источник не требует.
- source_word: לֹא יוּכְלוּן
  choice: не могли
  rationale: Форма выражает невозможность, в данном контексте обусловленную общественным и культурным запретом; русский оборот сохраняет эту смысловую широту.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: есть хлеб вместе с евреями
  rationale: Сохранён образ «есть хлеб», обозначающий совместную трапезу; «вместе с» ясно выражает застольное общение.
- source_word: תוֹעֵבָה
  choice: мерзость
  rationale: Сильное слово передаёт культурно-религиозное отвращение или запрет, не уточняя сверх текста его точную природу.
- source_word: מִצְרִים / הָעִבְרִים
  choice: египтяне / евреи
  rationale: Современные русские этнонимы естественно и ясно сохраняют противопоставление народов.
theological_decisions:
- issue: Природа египетского запрета на совместную трапезу
  choice: Не уточнять причину и передать её общим словом «мерзость»
  alternative: Объяснить запрет как ритуальную нечистоту или этническое предубеждение
  rationale: Еврейский текст утверждает наличие табу, но не объясняет его природу; конкретизация разрешила бы сохранённую источником неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический повтор «отдельно» намеренно сохранён для передачи композиции и социального разделения в исходном тексте.
