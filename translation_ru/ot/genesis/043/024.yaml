base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: ru
  text: Человек ввёл людей в дом Иосифа, дал им воды, и они омыли ноги; затем он дал корм их ослам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сказано просто «человек» и «люди»; в самом стихе не уточняется, что это распорядитель дома Иосифа и братья Иосифа, хотя это ясно из контекста.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ввёл
  rationale: Хифиль от בוא выражает причинение движения внутрь; «ввёл» естественно передаёт и каузативность, и направленность в дом.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Еврейский текст называет его просто «человеком», не обозначая здесь прямо его должность; указательное «тот» естественно связывает его с предыдущим контекстом.
- source_word: הָאֲנָשִׁים
  choice: этих людей
  rationale: Сохранено общее обозначение «люди», а не контекстуально более конкретное «братья»; «этих» обеспечивает естественную русскую референцию.
- source_word: בֵּיתָה יוֹסֵף
  choice: в дом Иосифа
  rationale: Направительное окончание в בֵּיתָה указывает на движение внутрь, что точно передаётся конструкцией «в дом».
- source_word: וַיִּתֶּן מַיִם
  choice: дал им воды
  rationale: Местоимение «им» восполнено из контекста ради естественного русского выражения; партитивный родительный «воды» идиоматичен после «дал».
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: они омыли ноги свои
  rationale: 'Сохранена активная форма множественного числа: люди сами омыли ноги; перевод не вводит слуг и не превращает действие в пассивное.'
- source_word: מִסְפּוֹא
  choice: корм
  rationale: Современное и понятное обозначение корма для животных без архаического оттенка.
- source_word: לַחֲמֹרֵיהֶם
  choice: ослам их
  rationale: 'Дательный падеж передаёт косвенный объект: корм был дан их ослам.'
