lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычный глагол עשה здесь обозначает исполнение данного указания; сочетание «сделал, как сказал» естественно передаёт эту мысль.
- source_word: הָאִישׁ
  choice: человек
  rationale: В еврейском тексте в обоих случаях сказано просто «человек». Хотя из контекста ясно, что это распорядитель дома Иосифа, его должность в данном стихе не названа.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: как сказал Иосиф
  rationale: Кратко и естественно выражает соответствие распоряжению Иосифа, сохраняя формулировку исходного текста.
- source_word: וַיָּבֵא
  choice: привёл
  rationale: Каузативная форма глагола בוא означает «привести/доставить». В отношении людей русское «привёл» естественнее, чем «ввёл» или «доставил», и совместимо с направлением внутрь дома.
- source_word: הָאֲנָשִׁים
  choice: этих людей
  rationale: Исходный текст называет братьев общим словом «люди», не уточняя их родство с Иосифом. Указательное «этих» естественно передаёт определённость в русском повествовании.
- source_word: בֵּיתָה יוֹסֵף
  choice: в дом Иосифа
  rationale: Направительный суффикс -ה указывает на движение к дому, а в данном контексте — внутрь него; русский предлог «в» с винительным падежом передаёт это движение.
