base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: ru
  text: 'Он сказал: «Мир вам! Не бойтесь. Ваш Бог и Бог вашего отца дал вам сокровище[a] в ваших мешках. Ваше серебро[b] дошло до меня». Затем он вывел к ним Симеона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрытое сокровище».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ваши деньги дошли до меня». Еврейское слово «серебро» часто означает деньги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Мир вам!
  rationale: В данном контексте שָׁלוֹם служит кратким заверением и пожеланием благополучия. Формулировка сохраняет ключевой образ мира и естественно звучит как успокоительное обращение.
- source_word: אַל תִּירָאוּ
  choice: Не бойтесь
  rationale: Прямой и естественный перевод отрицательного повеления с ירא.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: Ваш Бог и Бог вашего отца
  rationale: Несмотря на морфологическую форму אֱלֹהִים, здесь имеется в виду единый Бог братьев и их отца. Единственное число «отца» сохранено.
- source_word: נָתַן לָכֶם
  choice: дал вам
  rationale: Еврейский перфект передан прошедшим временем, естественным для объяснения уже обнаруженного сокровища.
- source_word: מַטְמוֹן
  choice: сокровище
  rationale: Слово обозначает спрятанную или хранимую ценность. «Сокровище» кратко передаёт основной смысл, а оттенок сокрытости отмечен в сноске.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: в ваших мешках
  rationale: Речь идёт о мешках для перевозки зерна; «мешки» точнее вписывается в повествовательный контекст, чем общее «сумки».
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: Ваше серебро пришло ко мне
  rationale: Сохранены конкретное «серебро» и буквальная конструкция «пришло ко мне»; возможное значение «деньги» пояснено в сноске.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Затем он вывел к ним Симеона
  rationale: Каузативная форма יצא означает «вывести». «Затем» естественно передаёт последовательность повествования.
theological_decisions:
- issue: Упоминание Бога в речи распорядителя дома
  choice: Передать слова прямо как указание на Бога братьев и Бога их отца, не определяя личную веру говорящего.
  alternative: Истолковать речь либо только как дипломатическое приспособление, либо как явное исповедание личной веры.
  rationale: Еврейский текст приводит слова распорядителя, но не раскрывает его внутренние убеждения; перевод не должен устранять эту неопределённость.
- issue: Число сказуемого при выражении «ваш Бог и Бог вашего отца»
  choice: дал
  alternative: дали
  rationale: Обе именные группы обозначают одного и того же Бога, поэтому единственное число сохраняет богословский и грамматический смысл исходного высказывания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Краткие фразы распорядителя сохранены; местоимения, относящиеся к людям, написаны со строчной буквы по современной норме. Все сноски поставлены непосредственно после слов, к которым относятся.
