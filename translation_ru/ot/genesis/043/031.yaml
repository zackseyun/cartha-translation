  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: ru
  text: 'Он умыл лицо, вышел и, овладев собой, сказал: «Подавайте еду[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб»; здесь это слово, вероятно, означает еду или трапезу в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: умыл
  rationale: Глагол רחץ означает «мыть, омывать»; применительно к лицу естественное русское соответствие — «умыл».
- source_word: פָּנָיו
  choice: лицо
  rationale: Еврейское פָּנִים имеет форму множественного числа, но при обозначении лица одного человека по-русски передаётся единственным числом.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: יצא означает выход наружу; здесь Иосиф выходит из комнаты, где плакал, и возвращается к присутствующим.
- source_word: וַיִּתְאַפַּק
  choice: овладев собой
  rationale: Форма хитпаэль от אפק передаёт сдерживание сильных чувств. Деепричастный оборот естественно связывает это действие с последующей речью и сохраняет смысл эмоционального самообладания.
- source_word: שִׂימוּ
  choice: Подавайте
  rationale: Буквально «положите, поставьте»; в контексте трапезы речь идёт о подаче приготовленной еды. «Подавайте» естественно передаёт повеление слугам начать подачу.
- source_word: לָחֶם
  choice: еду
  rationale: Основное значение — «хлеб», однако слово часто метонимически обозначает пищу или трапезу в целом. В сцене пира «еду» точнее передаёт контекстуальный смысл.
