  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: ru
  text: Они подошли к человеку, управлявшему домом Иосифа, и заговорили с ним у входа в дом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
