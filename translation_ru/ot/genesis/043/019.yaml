lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: подошли
  rationale: Глагол נגשׁ обозначает приближение к кому-либо; «подошли» естественно передаёт это движение в современном русском повествовании.
- source_word: הָאִישׁ
  choice: к человеку
  rationale: В еврейском тексте стоит общее обозначение «человек», а не должностной термин вроде «управляющий» или «слуга»; его роль раскрывается следующим оборотом.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: управлявшему домом Иосифа
  rationale: Конструкция с עַל выражает руководство и ответственность. «Управлявшему домом» естественно обозначает заведование всем домашним хозяйством, не вводя отдельного титула.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: и заговорили с ним
  rationale: דבר אֶל означает обращённую к кому-либо речь. «Заговорили с ним» служит естественным переходом к содержанию речи в следующем стихе.
- source_word: פֶּתַח הַבָּיִת
  choice: у входа в дом
  rationale: פֶּתַח может обозначать вход, проём или дверь. «У входа в дом» ясно и естественно передаёт место разговора.
