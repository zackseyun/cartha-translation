base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: ru
  text: 'Люди испугались, потому что их привели в дом Иосифа. Они сказали: «Нас привели сюда из-за серебра, возвращённого в наши мешки в прошлый раз, чтобы найти повод против нас[a], напасть на нас, обратить нас в рабство и забрать наших ослов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы воспользоваться случаем против нас». Еврейское выражение идиоматично и буквально связано с образом «катиться, наваливаться» на кого-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הָאֲנָשִׁים
  choice: Люди испугались
  rationale: Глагол ירא передаёт возникшую в этой ситуации боязнь; «испугались» естественно выражает последовательное повествовательное действие. הָאֲנָשִׁים обозначает мужчин, но по-русски «люди» здесь звучит естественнее и в контексте однозначно указывает на братьев Иосифа.
- source_word: כִּי הוּבְאוּ בֵּית יוֹסֵף
  choice: когда их привели в дом Иосифа
  rationale: כִּי допускает причинное понимание («потому что»), однако в данном контексте страх возникает при осознании того, куда их ведут; «когда» естественно передаёт обстоятельство, не устраняя причинной связи. Хофаль הוּבְאוּ сохранён пассивной конструкцией.
- source_word: עַל דְּבַר הַכֶּסֶף הַשָּׁב בְּאַמְתְּחֹתֵינוּ בַּתְּחִלָּה
  choice: из-за серебра, которое в прошлый раз вернулось в наши мешки
  rationale: עַל דְּבַר имеет причинное значение. כֶּסֶף в рассказе означает платёжное серебро; «серебро» сохраняет реалии текста точнее, чем обобщённое «деньги». בַּתְּחִלָּה контекстуально относится к предыдущей поездке.
- source_word: אֲנַחְנוּ מוּבָאִים
  choice: Нас привели сюда
  rationale: Пассивное причастие указывает на совершаемое над ними действие. Русское прошедшее время естественно в прямой речи после уже состоявшегося входа; «сюда» проясняет подразумеваемое направление внутрь дома.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: чтобы найти повод против нас
  rationale: Редкое идиоматическое сочетание גלל в хитпаэле с עַל обозначает враждебное использование случая или предлога против кого-либо. Перевод сохраняет вероятный смысл, а сноска отмечает трудность выражения.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: напасть на нас
  rationale: Сочетание נפל в хитпаэле с עַל выражает враждебное нападение; «напасть» современно и ясно, без неестественного буквального «обрушиться».
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים וְאֶת חֲמֹרֵינוּ
  choice: и забрать в рабство вместе с нашими ослами
  rationale: לַעֲבָדִים означает обращение в рабов, а не просто наёмное служение. Синтаксис последней фразы естественно передан как захват и людей, и ослов.
