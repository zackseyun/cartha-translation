  register: 'Современный литературный русский язык с ясным повествовательным ритмом. Сохранено «серебро» как историко-культурная реалия и «рабство» как точное обозначение угрожавшего статуса. Трудная идиома не сведена безоговорочно к обвинению: основной текст передаёт вероятный смысл, а сноска сохраняет образную альтернативу.'
