  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: ru
  text: 'И сказал Иуда Израилю, своему отцу: «Отпусти юношу[a] со мной; давай встанем и пойдём, чтобы мы жили и не умерли — и мы, и ты, и наши дети».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать мальчика, юношу или молодого мужчину.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное и естественное русское «И сказал» сохраняет связность рассказа.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: Израилю, своему отцу
  rationale: Сохраняется употреблённое в еврейском тексте имя «Израиль», а приложение ясно передаёт, что речь идёт об отце Иуды.
- source_word: שִׁלְחָה
  choice: Отпусти
  rationale: Императив שלח здесь означает позволить Вениамину отправиться вместе с Иудой; «отпусти» естественно передаёт просьбу в данном семейном контексте.
- source_word: הַנַּעַר
  choice: юношу
  rationale: נער обозначает юношу или молодого мужчину и не обязательно маленького ребёнка. «Юношу» сохраняет семейно-покровительственный оттенок без ошибочного указания на детский возраст.
- source_word: אִתִּי
  choice: со мной
  rationale: Прямо передаёт сопровождение Вениамина Иудой и личную ответственность Иуды.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: и мы встанем и пойдём
  rationale: Две побудительные формы выражают предлагаемое совместное и безотлагательное действие; сохранена последовательность двух глаголов.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: чтобы нам жить и не умереть
  rationale: Оборот передаёт цель и предполагаемый результат пути, сохраняя выраженное в оригинале противопоставление жизни и смерти.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: и нам, и тебе, и нашим детям
  rationale: Повтор «и» естественно воспроизводит трёхчастное включительное усиление גם.
- source_word: טַפֵּנוּ
  choice: нашим детям
  rationale: טף обозначает малых детей и зависимых членов семьи; в современном русском «детям» ясно и естественно передаёт названную уязвимую часть домашних.
