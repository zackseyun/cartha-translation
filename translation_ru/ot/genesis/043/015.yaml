  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: ru
  text: Итак, эти люди взяли этот дар и взяли с собой вдвое больше денег[a], а также Вениамина. Они отправились в путь, спустились в Египет[b] и предстали перед Иосифом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двойное серебро». Здесь «серебро» означает деньги.'
    reason: lexical_alternative
  - marker: b
    text: «Спустились в Египет» — обычное древнееврейское географическое выражение о пути из Ханаана в Египет.
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: дар
  rationale: В контексте повествования это не культовое приношение, а примирительный подарок высокопоставленному лицу; «дар» естественно и достойно передаёт смысл.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: вдвое больше денег
  rationale: Выражение обозначает удвоенную по сравнению с прежней сумму; такой перевод ясно передаёт количественный смысл.
- source_word: בְיָדָם
  choice: с собой
  rationale: Буквально «в их руке» — еврейская идиома обладания или переноски. По-русски «с собой» естественнее и не создаёт ложного образа денег, буквально зажатых в руках.
- source_word: וְאֶת־בִּנְיָמִן
  choice: а также Вениамина
  rationale: Присоединяет Вениамина к перечню того, что и кого они взяли с собой; эта формулировка позволяет избежать неестественного русского «взяли Вениамина» без изменения смысла.
- source_word: וַיָּקֻמוּ
  choice: отправились в путь
  rationale: В повествовании о путешествии глагол «встали» идиоматически указывает на начало пути; русский эквивалент передаёт функцию выражения.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: спустились в Египет
  rationale: Сохранена обычная библейская географическая формула движения из Ханаана в Египет.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: предстали перед Иосифом
  rationale: Фраза означает появиться и стоять в присутствии правителя; «предстали» естественно передаёт официальный оттенок.
