  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: ru
  text: 'Но если ты не пошлёшь его, мы не спустимся, потому что тот человек сказал нам: «Вы не увидите моего лица[a], если вашего брата не будет с вами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский оборот «увидеть лицо» означает предстать перед кем-либо, явиться в его присутствие.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит противопоставление условию предыдущего стиха; «но если» естественно передаёт контраст в современном русском языке.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: ты не пошлёшь его
  rationale: Отрицательная конструкция с причастием выражает предполагаемый отказ; местоимение «его» восполняет подразумеваемое из контекста дополнение — Вениамина.
- source_word: לֹא נֵרֵד
  choice: мы не пойдём туда
  rationale: Глагол буквально означает «спускаться» и регулярно описывает путь из Ханаана в Египет. В русском «пойдём туда» звучит естественно и сохраняет направление, ясное из контекста.
- source_word: כִּי
  choice: потому что
  rationale: Союз указывает причину отказа братьев идти без Вениамина.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Иосиф назван с точки зрения братьев, ещё не знающих, кто он; перевод не вносит в речь знание, которого у них нет.
- source_word: אָמַר אֵלֵינוּ
  choice: сказал нам
  rationale: Прямо и естественно передаёт формулу введения прямой речи.
- source_word: לֹא תִרְאוּ פָנַי
  choice: вы не увидите моего лица
  rationale: Сохранён образный еврейский оборот со значением «не предстанете передо мной»; он понятен по контексту, а примечание поясняет идиому.
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: если вашего брата не будет с вами
  rationale: 'Условная русская конструкция естественно передаёт необходимое условие: братья смогут предстать перед правителем лишь вместе со своим братом. Имя Вениамина не добавлено, поскольку в еврейском тексте его здесь нет.'
