base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: ru
  text: 'Иуда сказал ему: «Тот человек строго предупредил нас[a]: „Вы не увидите моего лица[b], если с вами не будет вашего брата“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настойчиво предупредил нас», «недвусмысленно предупредил нас». В еврейском тексте однокоренные формы глагола употреблены вместе для усиления.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «увидеть лицо» здесь может означать «явиться к кому-либо» или «предстать перед кем-либо».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: Иуда сказал ему
  rationale: Последовательная форма глагола продолжает повествование; в русском языке порядок событий естественно передаётся без обязательного отдельного слова «тогда». Местоимение «ему» по контексту относится к Иакову.
- source_word: הָעֵד הֵעִד בָּנוּ
  choice: строго предупредил нас
  rationale: Инфинитив абсолютный при личной форме глагола усиливает действие. В данном контексте речь идёт не о судебном свидетельстве, а о настойчивом и серьёзном предупреждении.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Так Иуда обозначает египетского правителя, с которым братья уже встречались; указательное «тот» естественно связывает упоминание с предыдущими событиями.
- source_word: לֹא תִרְאוּ פָנַי
  choice: вы не увидите моего лица
  rationale: Сохранён буквальный и выразительный еврейский оборот, который по смыслу также означает «не явитесь предо мной».
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: если с вами не будет вашего брата
  rationale: Условное значение בִּלְתִּי естественно передано отрицательной конструкцией с «если». Единственное число «брата» относится к Вениамину, а глагол «будет» восполняет подразумеваемую связку.
