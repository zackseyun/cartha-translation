  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: ru
  text: 'Тогда Израиль сказал: «Почему вы навлекли на меня беду, рассказав человеку, что у вас есть ещё один брат?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя, без замены на «Иаков».
- source_word: לָמָה
  choice: зачем
  rationale: В упрёке вопрос относится к поступку и его пагубному результату; русское «зачем» звучит естественно, не устраняя значения «почему».
- source_word: הֲרֵעֹתֶם לִי
  choice: вы навлекли на меня эту беду
  rationale: Каузативная форма от רעע обозначает причинение зла или вреда. В контексте речь о беде, которую, по мнению Израиля, вызвало сообщение братьев; такой перевод передаёт смысл идиоматично и не приписывает им нравственного зла как отдельного утверждения.
- source_word: לְהַגִּיד
  choice: рассказав
  rationale: Инфинитив указывает, каким действием была причинена беда; деепричастие естественно выражает эту связь по-русски.
- source_word: לָאִישׁ
  choice: тому человеку
  rationale: Речь об уже известном из повествования египетском правителе; указательное «тому» ясно передаёт определённость референта.
- source_word: הַעוֹד לָכֶם אָח
  choice: что у вас есть ещё один брат
  rationale: עוֹד указывает на продолжающееся наличие, а в контексте вопрос касается брата помимо уже присутствующих. «Один» подразумевается контекстом, но не выражен отдельным словом, поэтому более формальный вариант дан в примечании.
