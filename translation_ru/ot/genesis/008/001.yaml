base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: ru
  text: Но Бог вспомнил о Ное[a], обо всех диких животных и обо всём скоте, которые были с ним в ковчеге. Бог послал над землёй ветер[b], и воды стали убывать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог был внимателен к Ною». Еврейское «вспомнил» часто подразумевает верность, проявляющуюся в действии, а не просто мысленное припоминание.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское רוּחַ может означать «ветер», «дыхание» или «дух». Здесь контекст лучше всего поддерживает значение «ветер», хотя возможен отголосок образа Духа или ветра над водами в Бытии 1:2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: вспомнил о
  rationale: Сохраняет еврейский антропоморфный оборот; в повествовательном контексте он подразумевает не простое припоминание, а верное и действенное внимание к Ною.
- source_word: כָּל הַחַיָּה
  choice: всех диких животных
  rationale: При сопоставлении с בְּהֵמָה слово חַיָּה естественно понимать как обозначение диких животных, сохраняя различие двух категорий.
- source_word: כָּל הַבְּהֵמָה
  choice: всём скоте
  rationale: В данной паре בְּהֵמָה обозначает домашних наземных животных; «скот» — краткое и естественное русское соответствие.
- source_word: בַּתֵּבָה
  choice: в ковчеге
  rationale: Традиционное и однозначно понятное в данном контексте обозначение Ноева судна.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: провёл ветер
  rationale: רוּחַ допускает значения «ветер», «дыхание» и «дух», но непосредственный контекст убывания вод указывает на ветер. Глагол в породе хифиль передаёт побуждение к движению и буквально близок к «провёл».
- source_word: עַל הָאָרֶץ
  choice: над землёй
  rationale: В контексте всемирного потопа הָאָרֶץ естественно передать как «земля», а предлог עַל — как «над».
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: воды стали убывать
  rationale: Глагол передаёт ослабление и спад; эта формулировка ясна современному читателю и естественна применительно к водам потопа.
- source_word: וַ
  choice: Но
  rationale: Начальный союз отмечает поворот повествования от суда к избавлению; русское «но» естественно выражает эту дискурсивную функцию.
theological_decisions:
- issue: Антропоморфное выражение «Бог вспомнил о Ное»
  choice: Сохранить выражение «Бог вспомнил о Ное»
  alternative: «Бог обратил внимание на Ноя» или «Бог не забывал о Ное»
  rationale: Буквальный оборот сохраняет литературную и богословскую силу оригинала. В контексте речь идёт о верности Бога, проявляющейся в действии, а не о том, что прежде Он забыл Ноя.
- issue: Значение רוּחַ в повествовании о потопе
  choice: Передать как «ветер» в основном тексте
  alternative: «дух»
  rationale: 'Непосредственная функция רוּחַ здесь метеорологическая: благодаря ему воды начинают убывать. Возможный отголосок Бытия 1:2 сохранён в примечании без навязывания этого прочтения.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; повтор слова «Бог» сохранён по еврейскому тексту. Формы «всех диких животных» и «всём скоте» сохраняют исходное различие категорий.
