  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: ru
  text: 'Выведи с собой всех живых существ, которые с тобой, из всякой плоти: птиц, скот и всех пресмыкающихся, ползающих по земле, — чтобы они кишели[a] на земле, плодились и размножались на земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во множестве заселяли землю». Древнееврейский глагол означает обильное кишение, размножение или распространение живых существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: всех живых существ
  rationale: Передаёт собирательный и широкий смысл חַיָּה в контексте последующего перечисления, не сужая его до диких животных.
- source_word: אֲשֶׁר אִתְּךָ
  choice: которые с тобой
  rationale: Естественное современное выражение относительного придаточного, определяющего живых существ в ковчеге.
- source_word: מִכָּל בָּשָׂר
  choice: всякую плоть
  rationale: Сохраняет характерную для повествования о потопе древнееврейскую собирательную метафору בָּשָׂר, обозначающую живые телесные существа.
- source_word: בָּעוֹף
  choice: птиц
  rationale: В данном перечне это естественное русское обозначение летающих существ.
- source_word: וּבַבְּהֵמָה
  choice: скот
  rationale: בְּהֵמָה здесь обозначает крупных наземных животных, особенно домашних; «скот» точно и кратко передаёт эту категорию.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: и всех пресмыкающихся, ползающих по земле
  rationale: Сочетание «пресмыкающихся, ползающих» сохраняет смысловую связь существительного רֶמֶשׂ с однокоренным причастием רֹמֵשׂ.
- source_word: הוֹצֵא אִתָּךְ
  choice: Выведи с собой
  rationale: Каузативная форма глагола יצא требует значения «сделать так, чтобы вышли»; «выведи» естественно передаёт приказ Ною.
- source_word: וְשָׁרְצוּ
  choice: чтобы они кишели
  rationale: Глагол שׁרץ выражает обильное распространение и сохраняет лексику повествования о сотворении; целевой оборот естественно связывает это с повелением вывести животных.
- source_word: וּפָרוּ וְרָבוּ
  choice: плодились и размножались
  rationale: Сохраняет устойчивую лексику благословения плодородия в Бытии и её связь с повествованием о сотворении.
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: на земле / по земле
  rationale: «Земля» соответствует широкому послепотопному контексту; разные русские предлоги естественно передают местонахождение и движение по поверхности.
theological_decisions:
- issue: Отзвук благословения при сотворении после потопа
  choice: Сохранить выражения «кишели», «плодились и размножались».
  alternative: 'Передать обобщённо: «широко расселились и стали многочисленными».'
  rationale: Древнееврейский текст намеренно повторяет лексику Бытия 1, изображая возобновление жизни после суда; буквенно-смысловая перекличка сохраняется без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Слово «плоть» сохранено как значимый древнееврейский образ, а более необычное «кишели» пояснено сноской. Пара «плодились и размножались» поддерживает узнаваемую связь с рассказом о сотворении.
