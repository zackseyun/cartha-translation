  text: «Выйди из ковчега вместе с твоей женой, твоими сыновьями и жёнами твоих сыновей».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: Выйди
  rationale: Повелительная форма мужского рода единственного числа от יצא выражает прямое повеление покинуть замкнутое пространство; «выйди» естественно и точно передаёт движение из ковчега.
- source_word: מִן הַתֵּבָה
  choice: из ковчега
  rationale: Предлог מן обозначает движение изнутри наружу, а תֵּבָה в повествовании о Ное традиционно и точно передаётся словом «ковчег».
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение явно включает Ноя в последующее перечисление и может нести лёгкое смысловое выделение; тире естественно вводит это перечисление по-русски.
- source_word: וְאִשְׁתְּךָ
  choice: твоя жена
  rationale: В притяжательном контексте אִשָּׁה означает именно жену.
- source_word: וּבָנֶיךָ
  choice: твои сыновья
  rationale: בָּנִים здесь обозначает сыновей, что подтверждается следующим упоминанием их жён.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: жёны твоих сыновей
  rationale: Это близкая к форме еврейского выражения и естественная русская передача; она точнее отражает оригинал, чем родственное обозначение «невестки».
- source_word: אִתָּךְ
  choice: вместе с тобой
  rationale: Предлог אֵת с местоименным суффиксом обозначает сопровождение; «вместе с тобой» ясно связывает всю семью с Ноем.
