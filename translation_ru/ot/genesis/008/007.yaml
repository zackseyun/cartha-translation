  text: И он выпустил ворона, и тот летал туда и обратно, пока воды не высохли на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: И выпустил он
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; «выпустил» естественно передаёт отправление птицы из ковчега.
- source_word: הָעֹרֵב
  choice: ворона
  rationale: Определённое существительное обозначает ворона; в русском винительном падеже — «ворона».
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: и тот вылетал и возвращался
  rationale: Сочетание личной формы с абсолютными инфинитивами описывает повторяющееся движение. «Вылетал и возвращался» ясно и естественно передаёт повторность, при этом «вылетал» контекстуально конкретизирует движение птицы наружу.
- source_word: עַד יְבֹשֶׁת
  choice: пока … не высохли
  rationale: עַד с инфинитивом обозначает временной предел продолжавшегося действия; русская конструкция «пока не» передаёт его идиоматично.
- source_word: הַמַּיִם
  choice: воды
  rationale: Множественное число сохраняет форму и потопный контекст еврейского מַיִם.
- source_word: מֵעַל הָאָרֶץ
  choice: на земле
  rationale: В контексте высыхания выражение означает исчезновение вод, находившихся над землёй. Русское «воды высохли на земле» звучит естественно, не вводя более узкого понятия «поверхность».
