  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: ru
  text: Он подождал ещё семь дней, затем выпустил голубя, и тот больше к нему не вернулся[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и тот не вернулся к нему снова». Еврейскую отрицательную конструкцию с יָסְפָה, שׁוּב и עוֹד можно понять и как «больше не вернулся», и как «не вернулся снова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Он подождал
  rationale: Глагол יחל в данном повествовательном контексте означает «ждать, выжидать». Простое «подождал» естественно передаёт последовательность событий.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: ещё семь дней
  rationale: Сочетание עוֹד с שִׁבְעַת יָמִים אֲחֵרִים указывает на дополнительный семидневный срок; по-русски это естественно выражается словами «ещё семь дней» без буквального удвоения значения дополнительности.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: затем выпустил голубя
  rationale: שׁלח означает «послать, отпустить». В ситуации, когда Ной отправляет птицу из ковчега, «выпустил» звучит естественно и не добавляет цели, не указанной в тексте. «Затем» передаёт повествовательную последовательность формы с וַ.
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: и тот больше к нему не вернулся
  rationale: 'Отрицательная конструкция יסף + שׁוב с עוֹד может обозначать прекращение повторного действия: голубь уже больше не возвращался. Русское «больше не вернулся» сохраняет этот смысл; возможное событийное прочтение «не вернулся снова» отмечено в сноске.'
