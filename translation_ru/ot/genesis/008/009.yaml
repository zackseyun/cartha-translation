base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: ru
  text: Но голубка не нашла места, где могла бы поставить лапку[a], и вернулась к нему, к ковчегу, потому что воды были на поверхности всей земли. Тогда он протянул руку, взял её и внёс к себе в ковчег.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не нашла места покоя для подошвы своей ноги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: места, куда могла бы опустить лапку
  rationale: 'מָנוֹחַ обозначает место покоя, а выражение с כַּף רֶגֶל буквально указывает на подошву ноги. В контексте птицы естественная русская формулировка передаёт конкретный смысл: голубке негде было сесть.'
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: и вернулась к нему, к ковчегу
  rationale: Сохранены и направление к Ною, и возвращение к ковчегу; повтор предлога естественно передаёт два еврейских дополнения.
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: вода была на поверхности всей земли
  rationale: Формулировка сохраняет образ פְּנֵי — «лицо, поверхность» — и не заменяет его более истолковывающим глаголом «покрывала».
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: он протянул руку
  rationale: Это естественный русский эквивалент еврейской идиомы с глаголом שׁלח и словом «рука».
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: внёс к себе в ковчег
  rationale: 'Переданы оба элемента движения: к самому Ною и внутрь ковчега; русский порядок слов остаётся естественным.'
