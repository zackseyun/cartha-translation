  source_fidelity: 'Основной смысл передан верно: голубка не смогла найти место для посадки, вернулась к Ною и ковчегу из-за воды на поверхности всей земли; Ной протянул руку, взял её и внёс в ковчег. Однако «опустить лапку» несколько неточно передаёт образ места, где птица могла бы обрести опору/покой; глагол «поставить» точнее для еврейского выражения «для подошвы ноги».'
