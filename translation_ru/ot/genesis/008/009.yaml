  terminology: «Ковчег», «голубка», «протянул руку» и «внёс к себе в ковчег» удачны. «Вода была» возможна как собирательное обозначение, но «воды были» ближе к еврейскому множественному числу и сохраняет торжественно-повествовательный регистр без изменения смысла.
