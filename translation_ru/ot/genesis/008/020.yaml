base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: ru
  text: Затем Ной построил жертвенник Яхве[a], взял из всех чистых животных и из всех чистых птиц[b] и принёс всесожжения на жертвеннике.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ) — личное имя Бога; традиционно также передаётся как «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Букв.: «взял из всех чистых животных и из всех чистых птиц»; то есть взял животных и птиц из каждой чистой категории, а не всех особей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Обычное и естественное соответствие глаголу בנה в повествовательном контексте.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Устоявшееся русское обозначение места принесения жертв.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: מִכֹּל
  choice: из всех
  rationale: 'Сохраняет буквальную партитивную конструкцию: Ной взял из каждой названной категории, не утверждая явно, сколько именно особей он взял.'
- source_word: הַבְּהֵמָה הַטְּהוֹרָה
  choice: чистых животных
  rationale: «Животные» понятно современному читателю, а «чистые» сохраняет культовую категорию без избыточного пояснения в тексте.
- source_word: הָעוֹף הַטָּהֹר
  choice: чистых птиц
  rationale: В данном контексте «птицы» естественно передаёт עוף, а «чистые» сохраняет ритуальное различие.
- source_word: וַיַּעַל עֹלֹת
  choice: принёс всесожжения
  rationale: В жертвенном контексте Hiphil עלה означает принесение жертвы, а עֹלֹת — жертвы, полностью сжигаемые на жертвеннике.
- source_word: בַּמִּזְבֵּחַ
  choice: на жертвеннике
  rationale: Точно и естественно передаёт еврейскую локативную конструкцию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное божественное имя; «Яхве» сохраняет его как имя, тогда как «Господь» представляет традиционную замену титулом.
- issue: Партитивный смысл מִכֹּל
  choice: из всех чистых животных и из всех чистых птиц
  alternative: по нескольку из всех чистых животных и из всех чистых птиц
  rationale: Основной текст сохраняет формальную неопределённость еврейского выражения. Контекст подразумевает выбор представителей, но исходная конструкция не уточняет их число, поэтому пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «затем» передаёт последовательность событий. Сохранена лаконичность оригинала; культовые термины «жертвенник», «чистые» и «всесожжения» употреблены в их устоявшемся русском значении.
