  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: ru
  text: Вода продолжала убывать до десятого месяца. В десятом месяце, в первый день месяца, показались[a] вершины гор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали видны»; возможно также: «были видны».'
    reason: Еврейский глагол נִרְאוּ допускает как пассивное, так и результативно-инхоативное понимание; основной текст естественно передаёт появление вершин в поле зрения.
lexical_decisions:
- source_word: הַמַּיִם
  choice: вода
  rationale: В русском языке «вода» естественно употребляется как собирательное существительное в единственном числе; это точно передаёт еврейское מַיִם в данном контексте.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: продолжала убывать
  rationale: Сочетание היה с абсолютными инфинитивами выражает длительное, поступательное действие; формулировка передаёт постепенное понижение уровня воды.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: до десятого месяца
  rationale: חֹדֶשׁ в повествовательной хронологии обычно означает «месяц»; предлог «до» естественно передаёт עַד.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: В десятом месяце, в первый день месяца
  rationale: Эллиптическая еврейская датировка раскрыта в соответствии с нормами современного русского языка без добавления новой информации.
- source_word: נִרְאוּ
  choice: показались
  rationale: Нифаль глагола ראה допускает значения «стали видны», «были видны», «показались»; выбранный вариант естественно описывает появление вершин из-под убывающей воды и не называет наблюдателя.
- source_word: רָאשֵׁי הֶהָרִים
  choice: вершины гор
  rationale: Буквально רָאשֵׁי означает «головы», но применительно к горам современным и точным русским соответствием служит «вершины».
