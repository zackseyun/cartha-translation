  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: ru
  text: Воды всё отступали с поверхности земли[a], и к концу ста пятидесяти дней воды убыли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отступали с земли, идя и возвращаясь»; это еврейское сочетание выражает продолжительное, постепенное отступление вод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: отступали
  rationale: Глагол שׁוב буквально означает «возвращаться, идти назад», но применительно к покрывающим землю водам естественно передаётся как «отступать».
- source_word: מֵעַל הָאָרֶץ
  choice: с поверхности земли
  rationale: Предлог מֵעַל обозначает движение «с, от того, что находится над чем-либо»; перевод сохраняет образ воды, покрывавшей поверхность земли.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: постепенно
  rationale: Сочетание инфинитивов передаёт продолжительное, развивающееся действие. «Постепенно» естественно выражает неуклонное отступление вод, не создавая впечатления колебания туда и обратно.
- source_word: וַיַּחְסְרוּ
  choice: убыли
  rationale: Глагол חסר указывает на уменьшение количества или уровня; «убыли» хорошо сочетается с водой и сохраняет отличие от предшествующего «отступали».
- source_word: מִקְצֵה
  choice: к концу
  rationale: В данном временном обороте слово означает достижение конца указанного срока.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: ста пятидесяти дней
  rationale: Прямое и нормативное современное русское выражение числительного в составе оборота «к концу».
