  text: Во втором месяце, в двадцать седьмой день месяца, земля была сухой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суша была сухой». Еврейское אֶרֶץ может означать «земля», «суша» или «страна»; здесь выбрано слово «земля», поскольку повествование о потопе описывает высыхание в широком масштабе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ
  choice: Во втором месяце
  rationale: 'Сочетание союза ו с предлогом ב вводит следующую временную отметку. В современном русском начальное «И» здесь необязательно: последовательность повествования естественно передаётся без него.'
- source_word: הַשֵּׁנִי
  choice: втором
  rationale: Порядковое числительное согласуется со словом «месяц» и естественно входит в русскую формулу даты.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: в двадцать седьмой день месяца
  rationale: Это стандартная древнееврейская формула даты; выбран её ясный и литературный русский эквивалент.
- source_word: יָבְשָׁה
  choice: высохла
  rationale: Qal perfect, 3-е лицо женского рода единственного числа, обозначает достигнутое к этому моменту состояние. «Высохла» естественно передаёт и завершившийся процесс, и его результат.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Слово אֶרֶץ допускает значения «земля», «суша», «страна». В повествовании о потопе русское «земля» сохраняет требуемую широту и не сужает смысл до отдельной территории.
