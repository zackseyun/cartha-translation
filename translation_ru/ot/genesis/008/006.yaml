  text: וַֽ/יְהִ֕י מִ/קֵּ֖ץ אַרְבָּעִ֣ים י֑וֹם וַ/יִּפְתַּ֣ח נֹ֔חַ אֶת חַלּ֥וֹן הַ/תֵּבָ֖ה אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: ru
  text: По прошествии сорока дней[a][b] Ной открыл окно ковчега, который он соорудил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через сорок дней». Еврейское выражение מִקֵּץ может обозначать как наступление конца указанного срока, так и время после его истечения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее начало фразы можно передать: «И было по прошествии сорока дней: Ной открыл…» Формула וַיְהִי вводит очередное событие повествования.'
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי
  choice: не передано отдельной формулой; повествование начинается обстоятельством времени
  rationale: Форма вводит следующее событие в повествовательной последовательности. В современном русском её значение естественно выражается конструкцией «По прошествии…», без тяжеловесного «И было».
- source_word: מִקֵּץ
  choice: по прошествии
  rationale: Сочетание обозначает момент, наступивший по окончании указанного срока. «По прошествии» точно и естественно передаёт это временное значение; возможен также перевод «через».
- source_word: אַרְבָּעִים יוֹם
  choice: сорока дней
  rationale: Обычная и точная передача количественного сочетания.
- source_word: וַיִּפְתַּח
  choice: открыл
  rationale: Глагол פתח в данном контексте означает открытие окна или проёма.
- source_word: חַלּוֹן
  choice: окно
  rationale: Обычное значение существительного — окно или оконный проём; «окно» соответствует контексту ковчега и остаётся понятным современному читателю.
- source_word: הַתֵּבָה
  choice: ковчега
  rationale: В повествовании о Ное תֵּבָה традиционно и точно передаётся словом «ковчег».
- source_word: אֲשֶׁר עָשָׂה
  choice: который он соорудил
  rationale: Относительное придаточное отнесено к ковчегу, как в древнем греческом свидетельстве и в наиболее вероятном контекстуальном прочтении. «Соорудил» естественнее русского «сделал» применительно к ковчегу и передаёт עשה без добавления специального способа строительства.
