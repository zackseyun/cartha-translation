source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: ru
  text: 'И было так: в шестьсот первый год[a], в первый месяц, в первый день месяца воды высохли на земле. Ной снял покрытие[b] ковчега, посмотрел — и вот: поверхность земли высохла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятно, по контексту, речь идет о шестьсот первом годе жизни Ноя; буквально: «в одном и шестисотом году».'
    reason: Указывает на контекстуально вероятную точку отсчёта, не внося её в основной текст, и отмечает необычный еврейский порядок числительного.
  - marker: b
    text: 'Или: «крышу». Еврейское слово означает покрытие и не уточняет его устройство.'
    reason: Сохраняет возможное архитектурное понимание термина, не делая его обязательным.
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Передаёт еврейскую повествовательную формулу кратко и в dignified библейском регистре, не прибегая к архаичному «и случилось так».
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: в шестьсот первый год
  rationale: Естественная русская форма порядкового числительного; принадлежность отсчёта Ною понятна из контекста, но в самом стихе прямо не выражена.
- source_word: בָּרִאשׁוֹן
  choice: в первый месяц
  rationale: Слово «месяц» эллиптически подразумевается еврейским текстом и восстановлено по ближайшему календарному контексту.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: в первый день месяца
  rationale: Ясно и естественно передаёт еврейское обозначение календарной даты.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: вода сошла с земли
  rationale: В контексте выражение означает, что вода исчезла с поверхности земли вследствие высыхания; «сошла» естественно передаёт результат, не создавая ненормативного русского сочетания «вода высохла».
- source_word: וַיָּסַר
  choice: снял
  rationale: Точно и естественно передаёт каузативное значение «удалил, убрал» применительно к покрытию.
- source_word: מִכְסֵה הַתֵּבָה
  choice: покрытие ковчега
  rationale: Сохраняет общее лексическое значение существительного и не уточняет без достаточных оснований, было ли это крышей.
- source_word: וַיַּרְא
  choice: посмотрел
  rationale: В последовательности действий после снятия покрытия глагол обозначает направленное наблюдение.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную и привлекающую внимание силу частицы, оставаясь естественным для современного русского повествования.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: поверхность земли высохла
  rationale: «Поверхность» естественно передаёт образ «лица», а «высохла» сохраняет значение חרב и отличает состояние грунта от исчезновения воды в предыдущей части стиха.
theological_decisions:
- issue: К чему относится «шестьсот первый год»
  choice: Не уточнять в основном тексте
  alternative: «На шестьсот первом году жизни Ноя»
  rationale: Ближайший контекст указывает на возраст Ноя, однако данный стих не называет точку отсчёта прямо; сохранена формальная неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным ритмом. Формула «И было» и частица «и вот» сохраняют библейскую торжественность без избыточной архаизации; тире естественно связывает взгляд Ноя с увиденным результатом.
