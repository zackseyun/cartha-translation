  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: ru
  text: И голубка прилетела к нему под вечер[a], и вот, в клюве у неё был свежесорванный оливковый лист[b]. Тогда Ной понял, что вода спала с поверхности земли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернулась к нему под вечер». Еврейский глагол сам по себе означает прибытие, хотя из контекста ясно, что голубка возвращалась.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «свежесорванный», означает «сорванный, оторванный» и указывает, что лист был недавно взят с живого оливкового дерева.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «воды убыли с поверхности земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: прилетела
  rationale: Форма глагола בוא буквально обозначает прибытие («пришла»), а применительно к птице естественно передаётся как «прилетела». Возвращение подразумевается контекстом, но не выражено самим глаголом; это отмечено в сноске.
- source_word: לְעֵת עֶרֶב
  choice: под вечер
  rationale: Естественное современное русское обозначение времени прибытия, соответствующее еврейскому «ко времени вечера».
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет функцию указательной частицы, которая живо привлекает внимание к неожиданно принесённому листу.
- source_word: עֲלֵה זַיִת
  choice: оливковый лист
  rationale: Прямой и естественный эквивалент сочетания «лист оливы»; текст говорит именно о листе, а не о ветви.
- source_word: טָרָף
  choice: свежесорванный
  rationale: 'Передаёт значение чего-то сорванного или оторванного и повествовательный смысл: лист недавно взят с живого дерева.'
- source_word: בְּפִיהָ
  choice: в клюве у неё
  rationale: Буквально еврейский текст говорит «во рту у неё», однако для птицы современное русское «в клюве» естественно и точно описывает образ; местоимение женского рода согласуется с «голубка».
- source_word: וַיֵּדַע
  choice: Тогда Ной понял
  rationale: «Понял» естественно выражает вывод Ноя по принесённому листу, а «тогда» продолжает последовательность повествования.
- source_word: קַלּוּ הַמַּיִם
  choice: вода сошла
  rationale: Глагол קלל здесь означает, что паводковые воды уменьшились, спали. Единственное число «вода» идиоматично в русском повествовании о потопе.
- source_word: מֵעַל הָאָרֶץ
  choice: с земли
  rationale: Кратко и естественно передаёт пространственное значение «с поверхности земли».
