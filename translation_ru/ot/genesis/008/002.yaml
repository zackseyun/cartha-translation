lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: закрылись
  rationale: Нифаль глагола סכר означает «быть закрытым, перекрытым». Русская возвратная форма естественно передаёт непереходное пассивное значение и подходит к обоим однородным подлежащим.
- source_word: מַעְיְנֹת
  choice: источники
  rationale: מַעְיָן обозначает источник выходящей воды. «Источники» — естественное современное соответствие, сохраняющее связь с водами бездны.
- source_word: תְּהוֹם
  choice: бездна
  rationale: В Бытии это космическая водная бездна; выбор сохраняет образ и межтекстовую связь с Быт. 1:2.
- source_word: אֲרֻבֹּת
  choice: окна
  rationale: Слово буквально обозначает окна или отверстия. «Окна небес» сохраняет образность оригинала, тогда как «шлюзы» сильнее истолковывает функцию этих отверстий.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: В космологическом контексте «небеса» сохраняет возвышенную лексику и повтор исходного еврейского выражения.
- source_word: וַיִּכָּלֵא
  choice: был удержан
  rationale: Форма глагола כלה здесь передаёт сдерживание или удержание дождя. Такое соответствие сохраняет образ намеренного прекращения потока, не сводя значение только к результату «перестал».
- source_word: הַגֶּשֶׁם
  choice: дождь
  rationale: Прямое и естественное соответствие в данном повествовательном контексте.
- source_word: מִן הַשָּׁמָיִם
  choice: с небес
  rationale: Сохраняет повтор слова «небеса» в еврейском тексте и естественно звучит по-русски.
