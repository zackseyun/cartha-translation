  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: ru
  text: Пока существует земля,[a] сев и жатва, холод и жара, лето и зима, день и ночь не прекратятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «впредь, во все дни земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Пока существует земля
  rationale: Передаёт временную протяжённость выражения естественным современным русским языком, не превращая обещание в безусловное утверждение о вечности.
- source_word: זֶרַע
  choice: сев
  rationale: В паре с «жатвой» обозначает сельскохозяйственное действие и пору сева, а не семя как предмет.
- source_word: קָצִיר
  choice: жатва
  rationale: Точный и привычный русский эквивалент в устойчивой сельскохозяйственной паре «сев и жатва».
- source_word: קֹר וָחֹם
  choice: холод и зной
  rationale: Сохраняет контраст климатических состояний; «зной» естественно и выразительно передаёт חֹם в данном ряду.
- source_word: קַיִץ וָחֹרֶף
  choice: лето и зима
  rationale: Прямо передаёт сезонную пару, не подменяя её климатически обусловленными пояснениями «сухой сезон» и «сезон дождей».
- source_word: יוֹם וָלַיְלָה
  choice: день и ночь
  rationale: Сохраняет обычную парную формулу непрерывного суточного чередования.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: не прекратятся
  rationale: В контексте перечисленных повторяющихся циклов глагол שׁבת означает, что они не перестанут и не прекратятся; буквальное «не будут покоиться» здесь вводило бы неверный оттенок.
theological_decisions:
- issue: Продолжительность обещанной устойчивости природных циклов
  choice: Обещание относится ко всему времени существования земли.
  alternative: Безусловное утверждение, что эти циклы будут продолжаться вечно.
  rationale: Фраза כָּל יְמֵי הָאָרֶץ задаёт временную границу — «все дни земли»; перевод сохраняет её и не усиливает высказывание до метафизической вечности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом. Перечень пар сохранён без лишних союзов, что воспроизводит лаконичную структуру еврейского стиха.
