lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Тогда … сказал
  rationale: Форма с повествовательным вававом продвигает рассказ; «тогда» естественно передаёт последовательность событий. В данном вводе прямой речи русское «сказал» идиоматичнее буквального «говорил».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово обозначает единого Бога и естественно передаётся как «Бог».
- source_word: אֶל
  choice: Ною
  rationale: Предлог обозначает адресата речи; в русском языке это естественно выражается дательным падежом без отдельного предлога.
- source_word: נֹחַ
  choice: Ной / Ною
  rationale: Имя передано в традиционной русской форме «Ной», здесь — в дательном падеже «Ною».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский инфинитив вводит содержание последующей речи. В современном русском перед прямой речью эту функцию естественно выполняет двоеточие; оборот «говоря» был бы избыточным и менее естественным.
