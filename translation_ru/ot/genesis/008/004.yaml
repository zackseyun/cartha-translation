  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: ru
  text: В седьмом месяце, в семнадцатый день месяца, ковчег остановился на горах Арарата.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на горах Арарата»; речь идёт о горной области, а не обязательно об одной конкретной вершине, известной как гора Арарат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: остановился
  rationale: Глагол נוח в форме wayyiqtol обозначает, что ковчег пришёл в состояние покоя, перестав двигаться. «Остановился» естественно передаёт это событие по-русски.
- source_word: הַתֵּבָה
  choice: ковчег
  rationale: Устоявшийся и контекстуально точный русский эквивалент для תֵּבָה в повествовании о Ное.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: в седьмом месяце
  rationale: Естественная русская передача еврейского временного оборота.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: в семнадцатый день месяца
  rationale: Точная и идиоматичная передача стандартной еврейской формулы даты.
- source_word: עַל
  choice: на
  rationale: Прямое локативное значение предлога в данном контексте.
- source_word: הָרֵי אֲרָרָט
  choice: на горах Арарата
  rationale: הָרֵי — форма множественного числа в сопряжённом состоянии; перевод сохраняет указание на горную область Арарата и не сводит его к одной вершине.
theological_decisions:
- issue: Географическое выражение הָרֵי אֲרָרָט
  choice: горы Арарата
  alternative: гора Арарат
  rationale: В еврейском тексте стоит множественное число «горы». Поэтому перевод не уточняет место до единственной вершины и сохраняет географическую широту исходного текста.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет последовательность еврейской формулы даты, оставаясь ясным и естественным. Лексика нейтральная и достойная, без конфессиональных уточнений.
