lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Затем он выпустил
  rationale: Форма wayyiqtol продолжает последовательное повествование; «затем» естественно передаёт смену действия, а «выпустил» соответствует отправлению птицы из ковчега.
- source_word: הַיּוֹנָה
  choice: голубя
  rationale: יוֹנָה обозначает голубя; это обычный и контекстуально уместный русский эквивалент в рассказе о потопе.
- source_word: מֵאִתּוֹ
  choice: от себя
  rationale: Сохраняет выраженное в еврейском тексте удаление от Ноя и не подменяет его отсутствующим в оригинале уточнением «из ковчега».
- source_word: לִרְאוֹת
  choice: чтобы увидеть
  rationale: Инфинитив ראה выражает цель; прямой перевод сохраняет образ наблюдения, не усиливая его до «узнать».
- source_word: הֲקַלּוּ
  choice: сошла ли
  rationale: В данном контексте קלל означает уменьшение уровня воды. О воде по-русски естественно сказать «сошла», что передаёт её убывание с затопленной поверхности.
- source_word: הַמַּיִם
  choice: вода
  rationale: Хотя еврейское слово имеет форму множественного числа, в современном русском массовое существительное «вода» здесь звучит естественно и точно.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с поверхности земли
  rationale: Передаёт пространственный смысл идиомы буквально и понятно; אֲדָמָה здесь означает землю, сушу или почву, а не земной шар.
