    rationale: הֲקַלּוּ от קלל описывает уменьшение, ослабление или спад вод. «Убыла ли вода» передаёт этот аспект без излишнего утверждения полного исчезновения воды.
  - severity: low
    issue: 'Сноска сформулирована как «Буквально: „с лица земли“».'
    rationale: Она допустима как русская идиоматическая калька, но менее точно показывает пространственное «с/с поверхности лица земли» и не поясняет, что это буквальный образ оригинала.
  revised_text: Затем он выпустил от себя голубя, чтобы увидеть, убыла ли вода с поверхности земли[a].
