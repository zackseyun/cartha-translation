base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: ru
  text: И вышел Ной, и его сыновья, и его жена, и жёны его сыновей вместе с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: И вышел
  rationale: Форма с וַ־ продолжает и продвигает повествование; простой союз «и» естественно сохраняет еврейскую повествовательную связь. Глагол יָצָא здесь означает выход из ковчега.
- source_word: נֹחַ
  choice: Ной
  rationale: Устоявшаяся русская форма личного имени.
- source_word: וּבָנָיו
  choice: и его сыновья
  rationale: בָּנִים обозначает именно сыновей; притяжательное местоимение передаёт суффикс третьего лица мужского рода единственного числа.
- source_word: וְאִשְׁתּוֹ
  choice: и его жена
  rationale: Точно передаёт существительное в единственном числе с притяжательным суффиксом.
- source_word: וּנְשֵׁי בָנָיו
  choice: и жёны его сыновей
  rationale: Сохраняет буквальную структуру еврейского выражения и звучит естественно по-русски; вариант «невестки» был бы менее формально точным.
- source_word: אִתּוֹ
  choice: вместе с ним
  rationale: Передаёт совместность; «вместе» делает заключительную связь со всем перечислением ясной и естественной по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; простой и достойный повествовательный стиль. Повторение союза «и» сохранено как характерная черта еврейского перечисления, не нарушающая русской естественности.
