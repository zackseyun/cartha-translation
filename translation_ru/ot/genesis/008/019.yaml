base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: ru
  text: Все звери, все ползающие существа и все птицы — всё, что движется по земле, — вышли из ковчега по своим семействам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждое со своей родственной группой». Еврейское выражение указывает на объединение животных по семействам, но не обязательно означает «биологические виды» в современном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: все звери
  rationale: В данном перечислении חַיָּה обозначает наземных животных как отдельную категорию наряду с ползающими существами и птицами. «Звери» сохраняет это разграничение, не уточняя, дикие они или домашние.
- source_word: כָּל הָרֶמֶשׂ
  choice: все ползающие существа
  rationale: רֶמֶשׂ относится к небольшим существам, передвигающимся у земли. Такой перевод понятен современному читателю и, в отличие от «пресмыкающиеся», не ограничивает значение современной зоологической категорией рептилий.
- source_word: וְכָל הָעוֹף
  choice: и все птицы
  rationale: В контексте трёхчастного перечисления עוֹף естественно передаётся словом «птицы», хотя само еврейское слово может иметь более широкое значение летающих существ.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: всё, что движется по земле
  rationale: Причастие רוֹמֵשׂ родственно רֶמֶשׂ, но здесь выражение имеет широкий охват. «Движется» избегает тяжёлого повтора и сохраняет общий смысл передвижения по земле.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: по своим семействам
  rationale: מִשְׁפָּחָה обычно означает семью или родственную группу. «По своим семействам» сохраняет представление о выходе упорядоченными родственными группами и не подменяет это слово термином «вид».
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: вышли из ковчега
  rationale: Прямой и естественный перевод простого глагола יצא с указанием исходной точки; «ковчег» — укоренившееся русское обозначение תֵּבָה в рассказе о Ное.
theological_decisions:
- issue: Значение לְמִשְׁפְּחֹתֵיהֶם применительно к животным
  choice: по своим семействам
  alternative: по своим родам / по своим видам
  rationale: Текст говорит о מִשְׁפָּחוֹת, то есть семьях или родственных группах, а не употребляет מִין («вид, род»). Перевод не превращает эту фразу в утверждение современной биологической классификации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция с тире сохраняет пояснительный характер фразы «всё, что движется по земле». Слово «существа» помогает избежать ошибочно узкого зоологического понимания «пресмыкающихся».
