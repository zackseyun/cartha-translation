  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: ru
  text: 'И Господь почувствовал приятное благоухание, и Господь сказал в сердце Своём: «Не стану больше проклинать землю из-за человека, потому что склонность сердца человека ко злу — с его юности; и не стану больше поражать всё живое, как сделал Я».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона, соответствующая принятому библейскому регистру.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: благоуханный запах
  rationale: Передаёт и конкретное значение «запах», и оттенок приятности/умиротворения; не утверждает, будто жертва магически воздействует на Бога.
- source_word: אֶל־לִבּוֹ
  choice: в сердце Своём
  rationale: Сохраняет телесно-антропологический образ оригинала и естественно означает внутреннюю речь.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: помышление человеческого сердца
  rationale: יֵצֶר обозначает сформированную направленность, замысел или склонность; «помышление» сохраняет широту выражения без сведения его лишь к отдельному намерению.
- source_word: מִנְּעֻרָיו
  choice: с юности его
  rationale: Буквально сохраняет временную формулировку источника и не заменяет её более доктринально нагруженными выражениями.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: поражать всё живое
  rationale: «Поражать» точно передаёт широкий смысл נכה и не сужает его до одного способа гибели.
theological_decisions:
- issue: Связь человеческого зла с обещанием не проклинать землю вновь
  choice: Сохранено причинное «потому что» без поясняющего разрешения напряжения
  alternative: 'Передать כִּי уступительно: «хотя помышление…»'
  rationale: Обычное значение כִּי здесь причинное; богословское напряжение текста не следует устранять переводческой вставкой.
- issue: Степень всеобщности обещания
  choice: «не стану больше… всё живое, как Я сделал»
  alternative: «никогда больше не уничтожу всех живых существ»
  rationale: Сохранены повтор עוֹד, глагол «поражать» и сравнение с совершённым; не добавлено абсолютное «никогда», хотя в контексте обещание имеет окончательный характер.
- issue: Антропоморфный язык о Боге
  choice: «вдохнул… запах» и «сказал… в сердце Своём»
  alternative: 'Сгладить: «принял жертву» и «решил»'
  rationale: Образы оригинала сохранены как часть повествования, без рационализирующего пересказа.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Синтаксический параллелизм двух обещаний сохранён; архаизмы сведены к умеренному «Своём», необходимому для ясной референции.
