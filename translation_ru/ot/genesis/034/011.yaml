revisions:
- from: 'Тогда Сихем сказал её отцу и её братьям: «Если я найду благосклонность в ваших глазах, то дам всё, что вы мне скажете.[a]»'
  to: 'Тогда Сихем сказал её отцу и её братьям: «Да обрету я благосклонность в ваших глазах, и всё, что вы скажете мне, я дам».[a]'
  rationale: Убрана невыраженная в еврейском тексте условная зависимость. Пожелательная конструкция «Да обрету я» передаёт אֶמְצָא, а союз «и» сохраняет координацию וַאֲשֶׁר. Сноска уточнена, чтобы различать основной лексический смысл и контекстуально возможное прочтение.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:50:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы адресаты, идиома «найти благосклонность в ваших глазах» и обещание дать то, что будет сказано. Однако «если я найду ... то» превращает еврейское пожелание/просьбу אֶמְצָא חֵן в условие, от которого зависит обещание. В оригинале: «Да обрету я благосклонность...; и всё, что вы скажете мне, я дам».'
  naturalness: Фраза литературна, но условная конструкция «Если ... то» вносит не содержащуюся в тексте логическую связь. «Да обрету я благосклонность в ваших глазах» сохраняет смысл и естественна в умеренно возвышенном библейском регистре.
  terminology: «Сихем» — традиционная русская форма имени. «Благосклонность в ваших глазах» удачно передаёт חֵן בְּעֵינֵיכֶם. «Скажете мне» верно сохраняет широкое значение תֹּאמְרוּ אֵלַי; альтернативу «попросите» следует оставить только в сноске.
  issues:
  - severity: medium
    issue: Условное «Если ... то»
    rationale: אֶמְצָא חֵן — форма первого лица, выражающая пожелание («да обрету я» / «пусть я обрету»), а не условное придаточное. Условная переработка меняет прагматику реплики и связывает обещание дать с получением благосклонности.
  - severity: low
    issue: Сноска расширяет реплику словами «чего угодно»
    rationale: 'Это допустимое смысловое пояснение открытого «всё, что», но точнее дать альтернативу ближе к тексту: «Всё, что вы попросите у меня, я дам», не выдавая её за буквальное значение глагола «сказать».'
  revised_text: 'Тогда Сихем сказал её отцу и её братьям: «Да обрету я благосклонность в ваших глазах, и всё, что вы скажете мне, я дам».[a]'
  revised_footnotes:
