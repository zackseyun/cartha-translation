base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: ru
  text: 'Тогда Сихем сказал её отцу и её братьям: «Да обрету я благосклонность в ваших глазах, и всё, что вы скажете мне, я дам».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё, что вы попросите у меня, я дам».'
    reason: В данном контексте «скажете мне» может подразумевать просьбу или требование, однако основной текст сохраняет обычное значение древнееврейского глагола «сказать».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с вау продвигает повествование; «тогда» естественно передаёт переход к следующему речевому действию.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Использована традиционная русская форма библейского имени.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: её отцу и её братьям
  rationale: Повтор предлога אֶל не обязательно воспроизводить по-русски; притяжательное местоимение повторено ради ясности. אַחֶיהָ означает «её братьям».
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Если я найду благосклонность в ваших глазах
  rationale: Устойчивое древнееврейское выражение передаёт просьбу о благосклонном принятии. Условная русская конструкция естественно связывает её с обещанием в следующей части, сохраняя буквальный образ «в ваших глазах».
- source_word: וַאֲשֶׁר תֹּאמְרוּ אֵלַי
  choice: то … всё, что вы мне скажете
  rationale: Сохранено широкое значение глагола «сказать», не сведённое однозначно к просьбе или назначению платы; וַאֲשֶׁר выражено естественной связью условного предложения.
- source_word: אֶתֵּן
  choice: дам
  rationale: Передано основное значение נתן «дать» без контекстуального сужения до «заплатить».
