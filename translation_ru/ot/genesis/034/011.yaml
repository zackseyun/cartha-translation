  revision_rationale: Убрана невыраженная в еврейском тексте условная зависимость. Пожелательная конструкция «Да обрету я» передаёт אֶמְצָא, а союз «и» сохраняет координацию וַאֲשֶׁר. Сноска уточнена, чтобы различать основной лексический смысл и контекстуально возможное прочтение.
