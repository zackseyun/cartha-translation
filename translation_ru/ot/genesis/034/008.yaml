  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: ru
  text: 'И Еммор сказал им: «Сихем, мой сын, всей душой привязан к вашей дочери.[a] Прошу, выдайте её ему в жёны».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он сильно желает вашу дочь»; буквально: «душа его привязалась к вашей дочери».'
    reason: Выражение חָשְׁקָה נַפְשׁוֹ обозначает сильную привязанность или желание; сноска сохраняет буквальный образ и допустимый смысловой оттенок.
lexical_decisions:
- source_word: וַיְדַבֵּר ... אִתָּם לֵאמֹר
  choice: говорил с ними, сказав
  rationale: Сохраняет значение предлога «с ними» и различие между личной формой דבר и последующим לֵאמֹר, оставаясь приемлемым для литературного повествования.
- source_word: שְׁכֶם בְּנִי
  choice: Сихем, сын мой
  rationale: Передаёт еврейское приложение и естественно звучит как обращённая к семье речь отца.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: всей душой привязался
  rationale: Передаёт и נֶפֶשׁ («душа»), и сильную эмоциональную привязанность, выраженную глаголом חשׁק, не сводя её лишь к отвлечённому желанию.
- source_word: בְּבִתְּכֶם
  choice: к вашей дочери
  rationale: Существительное стоит в единственном числе и относится к Дине, тогда как местоименный суффикс множественного числа обращён к её семье.
- source_word: תְּנוּ נָא
  choice: Прошу, отдайте
  rationale: Множественное повелительное наклонение сохранено, а נָא передано вежливым и настойчивым «прошу»; «отдайте» естественно обозначает выдачу замуж в данном контексте.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Устойчивое современное русское выражение точно передаёт цель брачного союза.
