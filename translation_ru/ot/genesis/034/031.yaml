  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: ru
  text: 'Но они сказали[a]: «Разве он мог обращаться с нашей сестрой как с проституткой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве он должен был обращаться с нашей сестрой как с проституткой?» Еврейский глагол буквально означает «делать, совершать», но в этом контексте, вероятно, имеет смысл «обращаться, поступать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Но они сказали
  rationale: Форма с повествовательным וַ вводит ответ братьев на упрёк Иакова; союз «но» естественно передаёт контраст и резкость возражения.
- source_word: הַכְזוֹנָה
  choice: как с блудницей
  rationale: Сочетание вопросительной частицы הֲ, предлога כְּ «как» и существительного זוֹנָה означает «как с блудницей?». Слово «блудница» сохраняет достоинство библейского регистра и понятно современному читателю.
- source_word: יַעֲשֶׂה
  choice: мог обойтись
  rationale: Глагол עשה буквально имеет широкое значение «делать, поступать», но при личном прямом дополнении здесь естественно означает «обойтись с кем-либо, поступить с кем-либо». Модальная форма риторического вопроса передаёт возмущённое отрицание допустимости поступка.
- source_word: אֶת אֲחוֹתֵנוּ
  choice: с нашей сестрой
  rationale: אֵת служит показателем прямого дополнения, а אֲחוֹתֵנוּ означает «наша сестра». В русском управлении при «обойтись» требуется предлог «с».
theological_decisions:
- issue: Оценка поступка Симеона и Левия
  choice: Сохранён только их риторический ответ без авторского одобрения или осуждения.
  alternative: Передать реплику так, будто повествователь прямо оправдывает месть братьев.
  rationale: Еврейский текст передаёт слова братьев и сохраняет нравственное напряжение контекста, не добавляя здесь явной авторской оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Формулировка сохраняет краткость, резкость риторического вопроса и неоднозначность широкого еврейского глагола עשה.
