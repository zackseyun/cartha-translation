  source_fidelity: 'Смысл передан в целом верно: приглашение жить среди местных жителей, доступность земли, поселение, торговля и приобретение имущественного/земельного владения. Однако буквальное «земля будет перед вами» в русском основном тексте звучит неестественно и способно быть понято пространственно, тогда как еврейский оборот в данном контексте означает предоставленность, доступность.'
