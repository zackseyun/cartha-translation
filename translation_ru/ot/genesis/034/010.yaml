  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: ru
  text: Вы можете жить с нами, и земля будет в вашем распоряжении.[a] Поселяйтесь на ней, ведите на ней торговлю и приобретайте на ней собственность.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «земля будет перед вами». Это выражение может означать, что земля будет доступна вам или предоставлена в ваше распоряжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приобретайте на ней владения» или «обретайте на ней имущественные права». Еврейское выражение, вероятно, относится к приобретению земельных владений или имущественных прав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Вы можете жить с нами
  rationale: Глагол יָשַׁב означает «жить, обитать, поселяться». В контексте приглашения форма передаёт разрешение и возможность, поэтому «можете жить» естественнее строгого будущего «будете жить».
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: и земля будет перед вами
  rationale: Сохранён конкретный образ еврейского выражения «быть перед кем-либо», которое здесь подразумевает доступность земли; смысл разъяснён в сноске без устранения образной неоднозначности.
- source_word: שְׁבוּ
  choice: Поселяйтесь на ней
  rationale: Повелительная форма יָשַׁב в данном контексте призывает обосноваться на земле. Русское «на ней» естественно употребляется применительно к земле.
- source_word: וּסְחָרוּהָ
  choice: торгуйте на ней
  rationale: Корень סחר обозначает торговую деятельность. Суффикс женского рода отсылает к земле; «торгуйте на ней» кратко и ясно передаёт смысл.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: и приобретайте на ней владения
  rationale: Форма от אָחַז здесь, вероятно, означает получение земельного владения или имущественных прав, а не буквальное физическое удерживание. «Приобретайте владения» сохраняет земельно-правовой оттенок.
