  terminology: «Собственность» адекватно передаёт вероятный смысл נֶאֱחָזוּ как приобретения владения/имущественных прав, не утверждая чрезмерно конкретно, что речь исключительно о земельных участках. Сноска сохраняет буквальный образ и указывает на вероятный правовой оттенок.
