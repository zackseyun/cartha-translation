  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: ru
  text: И Хамора, и его сына Сихема они убили мечом[a], и забрали Дину из дома Сихема, и вышли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами меча» — еврейское выражение со значением «мечом».'
