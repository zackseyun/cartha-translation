lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: И Хамора, и его сына Сихема
  rationale: Повторение וְאֶת отмечает оба дополнительных прямых объекта и связывает действие с предыдущим стихом. Формулировка сохраняет явное указание на родство и естественна для современного русского повествования.
- source_word: הָרְגוּ
  choice: они убили
  rationale: Прямое и нейтральное соответствие глаголу הרג в повествовательном контексте; местоимение делает подлежащее ясным в русском предложении.
- source_word: לְפִי חָרֶב
  choice: мечом
  rationale: Еврейское выражение буквально означает «устами меча», но функционирует как идиома, обозначающая убийство мечом. В основном тексте передан естественный русский смысл, а буквальный образ вынесен в сноску.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: и забрали Дину
  rationale: לקח имеет широкое значение «брать»; в данном контексте «забрали» естественно передаёт перемещение Дины из дома, не усиливая значение до «схватили» или «похитили».
- source_word: מִבֵּית שְׁכֶם
  choice: из дома Сихема
  rationale: בַּיִת здесь естественнее всего понимать как конкретный дом или жилище; родительная конструкция сохраняет принадлежность дома Сихему.
- source_word: וַיֵּצֵאוּ
  choice: и вышли
  rationale: יצא обозначает выход наружу. «Вышли» сохраняет пространственное движение, не уточняя сверх текста, ушли ли они затем из города.
