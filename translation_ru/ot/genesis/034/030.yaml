translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной библейской прозы. Метафора буквального «зловония» передана её контекстуальным значением, поскольку калька «сделали меня смердящим» в современном русском звучит искусственно и способна заслонить смысл. Финальное «я и дом мой» естественно сведено к «меня вместе с моим домом» без изменения объёма угрозы.
