  source_fidelity: 'Основной смысл передан верно: Иаков обвиняет Симеона и Левия в том, что они навлекли на него беду, сделали его ненавистным среди местного населения, и опасается объединённого нападения и гибели своего дома. Однако заключительная активная конструкция «истребят меня вместе с моим домом» несколько сглаживает синтаксическое развитие еврейского текста: «они поразят меня, и погибну я и мой дом».'
