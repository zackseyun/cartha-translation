base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: ru
  text: 'И сказал Иаков Симеону и Левию: «Вы навлекли на меня беду, сделав меня ненавистным[a] среди жителей этой земли — хананеев и ферезеев. У меня мало людей; они соберутся против меня, поразят меня, и мы погибнем — я и мой дом[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделав меня зловонным»; то есть отвратительным, ненавистным.'
    reason: lexical_alternative
  - marker: b
    text: То есть мои домочадцы, семья и всё домашнее сообщество Иакова.
    reason: semantic_clarification
lexical_decisions:
- source_word: עֲכַרְתֶּם אֹתִי
  choice: вы навлекли на меня беду
  rationale: Глагол עכר означает причинить беду или навлечь несчастье; выбранная формулировка естественна по-русски и сохраняет обвинительный тон.
- source_word: לְהַבְאִישֵׁנִי
  choice: сделав меня ненавистным
  rationale: Буквально форма означает «сделав так, что я смердю», но метафорически указывает на то, что Иаков стал отвратителен и ненавистен местным жителям. В основном тексте передан смысл образа без неестественной русской кальки.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: жителям этой земли
  rationale: Собирательное причастие обозначает население земли; дательный падеж обусловлен русской конструкцией «ненавистным кому».
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: хананеям и ферезеям
  rationale: Названия народов конкретизируют жителей земли и естественно оформлены как приложение.
- source_word: מְתֵי מִסְפָּר
  choice: людей у меня мало
  rationale: Еврейская идиома указывает на численную малочисленность людей Иакова; русская формулировка ясна и естественна.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: они соберутся против меня
  rationale: Передано враждебное объединение окружающих народов без избыточного возвратного местоимения.
- source_word: וְהִכּוּנִי
  choice: нападут на меня
  rationale: В данном контексте נכה обозначает вооружённое поражение или удар. «Нападут» естественно связывает действие с последующим истреблением, не вводя обязательного оттенка немедленного убийства.
- source_word: וְנִשְׁמַדְתִּי
  choice: истребят меня
  rationale: Глагол שׁמד выражает уничтожение или истребление; активная русская конструкция естественно продолжает субъект «они».
- source_word: בֵּיתִי
  choice: мой дом
  rationale: Здесь «дом» обозначает весь дом Иакова — семью и зависимых от него людей; это ёмкий библейский и при этом понятный русский эквивалент.
