  terminology: Имена «Иаков», «Симеон», «Левий», а также этнонимы «хананеи» и «ферезеи» переданы корректно. «Дом мой» в данном контексте означает домочадцев/семью и зависимых людей; сохранение слова «дом» допустимо, но поясняющая сноска делает этот объём ясным. Для לְהַבְאִישֵׁנִי уместна сноска, отмечающая буквальный образ «сделать зловонным».
