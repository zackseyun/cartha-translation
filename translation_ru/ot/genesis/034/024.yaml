base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: ru
  text: Все, выходившие из ворот его города[a], послушались Хамора и его сына Шехема, и все мужчины — все, выходившие из ворот его города, — были обрезаны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все выходившие из ворот его города». Городские ворота были местом общественных собраний и принятия решений; здесь выражение обозначает мужчин-горожан, участвовавших в общественной жизни.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: послушались
  rationale: Оборот שׁמע אל означает не просто услышать, а благосклонно выслушать и последовать предложению. «Послушались» естественно передаёт фактическое согласие горожан, не усиливая смысл до формального повиновения.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: все, кто выходил к воротам его города
  rationale: Сохранены конкретный образ городских ворот и повтор выражения. В данном контексте это идиома, обозначающая мужчин-горожан, участвовавших в общественной жизни; значение пояснено сноской.
- source_word: בְּנוֹ
  choice: его сына
  rationale: Обычное обозначение родства; в русском предложении притяжательное местоимение естественно поставлено перед сочетанием «сына Шехема».
- source_word: וַיִּמֹּלוּ
  choice: обрезаны были
  rationale: Форма нифаля передаёт пассивное либо допускающее возвратный оттенок действие. Пассивная конструкция сохраняет формальную неопределённость относительно того, кто непосредственно совершал обрезание.
- source_word: כָּל זָכָר
  choice: все мужчины
  rationale: В контексте жителей города זָכָר обозначает лиц мужского пола. Русское множественное число согласуется с множественным глаголом וַיִּמֹּלוּ и звучит естественнее, чем буквальное собирательное «каждый мужчина».
- source_word: שַׁעַר עִירוֹ
  choice: к воротам его города
  rationale: Сохранён конкретный культурный образ ворот как места общественной жизни. Глагольное выражение «выходил к воротам» естественнее по-русски, чем «выходил из ворот», и соответствует идиоматическому употреблению фразы в данном контексте.
