translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Как видите» передаёт дискурсивную функцию הִנֵּה без архаичного «вот» или «се»; «мирно настроены» сохраняет относительную неоднозначность שְׁלֵמִים.
