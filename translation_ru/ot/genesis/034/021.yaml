  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: ru
  text: Эти люди в мире с нами[a]. Пусть они поселятся в этой земле и ведут в ней торговлю[c], ведь земля, как видите, достаточно просторна для них[b]. Мы возьмём их дочерей себе в жёны, а своих дочерей отдадим им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живут с нами в мире», «в добрых отношениях с нами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «земля — вот — широка руками перед ними»; это выражение означает, что земля просторна и места для них достаточно.'
    reason: cultural_note
  - marker: c
    text: 'Или: «торгуют по ней» либо «проходят через неё с торговлей». Еврейское выражение может обозначать торговлю внутри страны или передвижение по её территории ради торговли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: мирно настроены к нам
  rationale: Передаёт состояние мирных, доброжелательных отношений, не усиливая значение до личной дружбы.
- source_word: וְיֵשְׁבוּ
  choice: пусть они поселятся
  rationale: Имперфект в речи имеет побудительно-разрешительный оттенок; «поселятся» естественно выражает разрешение жить на этой земле.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: и торгуют в ней
  rationale: סחר обозначает торговую деятельность, а местоимение относится к земле; возможное значение движения или торговли по её территории отмечено в сноске.
- source_word: הִנֵּה רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: ведь земля, как видите, достаточно просторна для них
  rationale: 'Естественно передаёт указательную силу הִנֵּה и смысл идиомы «широка руками перед ними»: земли достаточно и она открыта для них.'
- source_word: אֶת בְּנֹתָם נִקַּח לָנוּ לְנָשִׁים
  choice: мы будем брать их дочерей себе в жёны
  rationale: Сохраняет намерение/предложение, брачную формулу «брать в жёны» и значение לָנוּ «себе».
- source_word: וְאֶת בְּנֹתֵינוּ נִתֵּן לָהֶם
  choice: а своих дочерей отдавать им
  rationale: Передаёт параллельное взаимное брачное соглашение; несовершенный вид согласован с обобщённым будущим действием первой части.
