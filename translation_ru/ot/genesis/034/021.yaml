  to: Эти люди в мире с нами[a]. Пусть они поселятся в этой земле и ведут в ней торговлю[c], ведь земля, как видите, достаточно просторна для них[b]. Мы возьмём их дочерей себе в жёны, а своих дочерей отдадим им.
