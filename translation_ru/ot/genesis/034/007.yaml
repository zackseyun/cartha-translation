revisions:
- from: Сыновья Иакова вернулись с поля, услышав о случившемся. Они были глубоко оскорблены и очень разгневаны, потому что он совершил бесчестный поступок в Израиле, переспав с дочерью Иакова, — так поступать нельзя.
  to: Сыновья Иакова пришли с поля, когда услышали об этом. Они были потрясены и сильно разгневаны, потому что он совершил в Израиле возмутительное дело, вступив в связь с дочерью Иакова; так поступать нельзя.
  rationale: Исправлены добавленный смысл «вернулись», неточный эмоциональный оттенок «оскорблены» и сниженное по регистру «переспав». Сохранены «в Израиле», причинная связь и нормативная заключительная формула; квалификация деяния из предшествующего контекста не внесена в лексическую форму данного стиха.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:50:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: сыновья Иакова узнают о происшедшем, испытывают сильное огорчение и гнев, а деяние названо нравственно недопустимым. Однако «вернулись» добавляет оттенок возвращения, которого в בָּאוּ מִן־הַשָּׂדֶה нет, а «глубоко оскорблены» сужает וַיִּתְעַצְּבוּ до чувства личной обиды вместо сильного огорчения/потрясения. «Переспав» разговорно и в данном контексте может неуместно смягчать формулировку.'
  naturalness: Текст читается естественно, но «переспав с дочерью Иакова» снижает регистр в сравнении с остальным повествованием. «Потрясены» и «вступив в связь» дают современный литературный, сдержанный тон.
  terminology: «Возмутительное дело» удачно передаёт נְבָלָה как морально позорное, недопустимое деяние без навязывания специальной юридической квалификации. Буквальное «в Израиле» следует сохранить. Нейтральное «вступив в связь с дочерью Иакова» передаёт לִשְׁכַּב אֶת, не повторяя в этом стихе контекстуальную квалификацию изнасилования из 34:2.
  issues:
  - severity: medium
    issue: «Вернулись с поля»
    rationale: Глагол בָּאוּ означает «пришли», «прибыли»; указание на возвращение в исходную точку отсутствует.
  - severity: medium
    issue: «Были глубоко оскорблены»
    rationale: וַיִּתְעַצְּבוּ выражает скорбь, огорчение или потрясение. Русское «оскорблены» прежде всего говорит о нанесённой обиде и частично дублирует иной эмоциональный оттенок.
  - severity: low
    issue: «Переспав с»
    rationale: Это разговорное выражение не вполне соответствует сдержанному повествовательному регистру и способно звучать как взаимная интимная связь; исходная формула сама по себе нейтрально обозначает половую связь.
  revised_text: Сыновья Иакова пришли с поля, когда услышали об этом. Они были потрясены и сильно разгневаны, потому что он совершил в Израиле возмутительное дело, вступив в связь с дочерью Иакова; так поступать нельзя.
