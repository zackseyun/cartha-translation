base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: ru
  text: Сыновья Иакова пришли с поля, когда услышали об этом. Они были потрясены и сильно разгневаны, потому что он совершил в Израиле возмутительное дело, вступив в связь с дочерью Иакова; так поступать нельзя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: были глубоко оскорблены
  rationale: Глагол передаёт сильную душевную боль и огорчение; в контексте насилия над сестрой русское «оскорблены» естественно выражает и личную задетость, не смешивая это чувство с отдельно названным гневом.
- source_word: נְבָלָה
  choice: бесчестный поступок
  rationale: Слово обозначает нравственно позорное, возмутительное деяние, а не просто неразумность. Формулировка сохраняет моральную тяжесть без привнесения специальной юридической категории.
- source_word: לִשְׁכַּב אֶת
  choice: переспав с
  rationale: Здесь оборот обозначает половую связь. Современное русское выражение ясно передаёт смысл и не уточняет грамматически не выраженные в этой фразе обстоятельства, хотя контекст предыдущих стихов описывает насилие.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: так поступать нельзя
  rationale: Безличная нормативная формула выражает решительное нравственное запрещение; «нельзя» звучит естественно и сохраняет категоричность.
theological_decisions:
- issue: Выражение «в Израиле» до появления народа Израиля
  choice: 'сохранено буквально: «в Израиле»'
  alternative: «в семье Израиля» или «среди потомков Израиля»
  rationale: Масоретский текст использует בְיִשְׂרָאֵל. Возможный повествовательный взгляд из более позднего времени не следует устранять поясняющим переводом.
- issue: Характер полового деяния в данном стихе
  choice: 'переведено нейтрально по форме данного стиха: «переспав с»'
  alternative: «изнасиловав»
  rationale: Контекст Быт. 34:2 прямо сообщает о насилии, однако выражение לִשְׁכַּב אֶת здесь само по себе означает половую связь. Перевод не должен переносить контекстуальное уточнение внутрь этой отдельной фразы.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Синтаксис разделён на два предложения ради естественного чтения; причинная и итоговая связь исходного текста сохранена. Архаизмы и конфессионально окрашенная лексика не использованы.
