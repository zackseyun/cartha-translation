  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: ru
  text: 'Только при таком условии мы согласимся с вами: если вы станете такими, как мы, то есть если у вас будет обрезан каждый мужчина.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Только в этом мы согласимся с вами: если вы станете такими, как мы, — когда у вас будет обрезан каждый мужчина».'
    reason: Сохраняет более близкую к еврейскому выражению בְּזֹאת передачу и передаёт пояснительно-инструментальную связь инфинитива לְהִמֹּל с выражением «станете такими, как мы».
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Только при таком условии
  rationale: Сочетание ограничительной частицы אַךְ с בְּזֹאת вводит единственное условие согласия; это естественная и точная русская передача.
- source_word: נֵאוֹת לָכֶם
  choice: мы согласимся с вами
  rationale: Нифаль от אוה выражает готовность или согласие; русский глагол «согласиться» в данном контексте естественно сочетается с «с вами».
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: если вы станете такими, как мы
  rationale: Условная конструкция подразумевает переход в новое состояние, поэтому «станете» точнее контекстуального «будете».
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: и у вас будет обрезан каждый мужчина
  rationale: Пассивный инфинитив Нифаля сохраняется через пассивную конструкцию; לָכֶם передаёт принадлежность мужчин к группе адресатов, а כָּל זָכָר имеет распределительное значение.
