  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: ru
  text: 'И пришли Хамор и его сын Шехем к воротам своего города и сказали мужчинам-горожанам своего города[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчинам своего города». Вероятно, имеются в виду мужчины-горожане, собравшиеся у ворот для обсуждения общественных дел.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришли
  rationale: Глагол стоит в единственном числе перед составным подлежащим, но по-русски требуется множественное число; «пришли» естественно передаёт движение к указанному месту.
- source_word: חֲמוֹר וּשְׁכֶם בְּנוֹ
  choice: Хамор и его сын Шехем
  rationale: Сохраняет оба имени и явно выраженное родство, используя естественный русский порядок слов.
- source_word: אֶל שַׁעַר עִירָם
  choice: к воротам своего города
  rationale: Буквально передаёт городские ворота как место прибытия; возвратное «своего» естественно соотносит город с подлежащими.
- source_word: וַיְדַבְּרוּ אֶל
  choice: сказали
  rationale: В сочетании с последующей прямой речью русское «сказали» звучит естественнее буквального «говорили к» и точно передаёт обращение.
- source_word: אַנְשֵׁי עִירָם
  choice: жителям своего города
  rationale: В данном общественном контексте אַנְשֵׁי обозначает горожан, к которым обращаются; «жители» естественно по-русски и не утверждает сверх текста официальный статус «граждан».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Функция еврейского вводного оборота перед прямой речью в современном русском естественно передаётся пунктуацией, без тяжеловесного «говоря».
