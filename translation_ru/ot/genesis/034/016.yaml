base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: ru
  text: тогда мы отдадим вам наших дочерей, а ваших дочерей возьмём себе; поселимся с вами и станем одним народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и будем одним народом». Буквально по-еврейски: «и будем для одного народа»; выражение может обозначать как переход в новое состояние («станем одним народом»), так и само состояние («будем одним народом»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: тогда мы будем отдавать
  rationale: В условном предложении перфект с ו выражает последующее действие; «тогда» естественно передаёт связь с условием предыдущего стиха. Несовершенный вид уместен для взаимной практики браков.
- source_word: אֶת־בְּנֹתֵינוּ לָכֶם
  choice: вам наших дочерей
  rationale: Сохранены прямое значение «наших дочерей» и дательный смысл לָכֶם.
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: а ваших дочерей будем брать себе
  rationale: לקח буквально значит «брать»; брачный смысл понятен из контекста и не требует добавления «в жёны». לָנוּ естественно передано словом «себе».
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: мы поселимся с вами
  rationale: ישב может означать «жить, обитать, поселиться»; здесь «поселимся» ясно передаёт предполагаемое совместное проживание.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: и станем одним народом
  rationale: «Станем» естественно выражает результирующее состояние, а עַם обозначает народ как общность, не современное государство.
theological_decisions:
- issue: Результативное или статическое значение וְהָיִינוּ לְעַם אֶחָד
  choice: станем одним народом
  alternative: будем одним народом
  rationale: Контекст брачного и общественного объединения поддерживает результирующее «станем», однако еврейская конструкция допускает и более формальное «будем», поэтому альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный, с сохранением взаимности брачного соглашения и неоднозначности заключительной конструкции.
