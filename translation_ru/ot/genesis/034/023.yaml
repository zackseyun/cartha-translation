base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: ru
  text: Разве не станут нашими их стада, их имущество и все их животные? Только согласимся с ними, и они будут жить с нами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: их стада
  rationale: מִקְנֶה обозначает домашний скот как хозяйственное достояние; «стада» естественно передаёт собирательный смысл и позволяет отличить слово от последующего בְּהֵמָה.
- source_word: קִנְיָנָם
  choice: их имущество
  rationale: קִנְיָן означает приобретённую собственность или имущество; русский вариант сохраняет широкий материально-экономический смысл.
- source_word: כָל בְּהֶמְתָּם
  choice: весь их скот
  rationale: בְּהֵמָה здесь охватывает домашних животных; «весь их скот» естественно передаёт обобщение с כָל и не ограничивает выражение одним видом животных.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: Разве не станут нашими…?
  rationale: הֲלוֹא вводит риторический вопрос, предполагающий утвердительный ответ; будущее «станут» передаёт ожидаемый результат согласия.
- source_word: אַךְ
  choice: Только
  rationale: 'אַךְ вводит ограничивающее условие: для достижения желаемого требуется лишь согласиться.'
- source_word: נֵאֹותָה
  choice: согласимся с ними
  rationale: Форма от אוה в нифале выражает готовность или согласие; «согласимся с ними» современно и соответствует контексту переговоров.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: и они поселятся среди нас
  rationale: יָשַׁב может означать жить или поселиться; в контексте принятия другой группы «поселятся среди нас» ясно передаёт совместное проживание и интеграцию.
