base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: ru
  text: На третий день, когда они страдали от боли, двое сыновей Иакова — Симеон и Левий, братья Дины, — каждый взяли свой меч, напали на город, не ожидавший опасности[a], и убили всех мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уверенно напали на город» или «напали на город без опасений». Еврейское слово בֶּטַח может описывать либо действия нападавших, либо беспечное, не ожидающее опасности состояние города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Естественно передаёт временную рамку и последовательность повествования без архаичного вводного оборота «И было».
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: когда они испытывали боль
  rationale: Передаёт одновременное обстоятельство и состояние боли, не добавляя прямо её причину, понятную из контекста.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: двое сыновей Иакова
  rationale: 'Сохраняет значение части группы: речь идёт о двух из сыновей Иакова.'
- source_word: שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה
  choice: Симеон и Левий, братья Дины
  rationale: Современная русская форма имён и ясная передача приложения.
- source_word: אִישׁ חַרְבּוֹ
  choice: взяли каждый свой меч
  rationale: Передаёт распределительное значение אִישׁ и принадлежность меча каждому из братьев.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: напали на город
  rationale: В данном контексте בוא על обозначает враждебное выступление против города; «напали» естественно и ясно передаёт действие по-русски.
- source_word: בֶּטַח
  choice: не ожидавший опасности
  rationale: 'В основном тексте слово отнесено к состоянию города: он находился в безопасности и не был настороже. Грамматическая неоднозначность сохранена в сноске.'
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: и убили всех мужчин
  rationale: В контексте обрезанных жителей города זָכָר обозначает лиц мужского пола; «всех мужчин» звучит естественно в современном русском повествовании.
