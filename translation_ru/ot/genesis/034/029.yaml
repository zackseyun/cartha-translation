    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: всё их имущество
  rationale: В данном контексте חַיִל обозначает богатство, средства или собственность жителей; «имущество» естественно охватывает их материальные ценности, не сужая смысл до скота или военной силы.
- source_word: טַפָּם
  choice: всех их малых детей
  rationale: טַף обычно обозначает маленьких детей, а иногда шире — зависимых членов семьи. «Малые дети» сохраняет акцент на возрасте и уязвимости.
- source_word: נְשֵׁיהֶם
  choice: жён
  rationale: אִשָּׁה может означать как «женщина», так и «жена»; притяжательный суффикс и перечисление членов семей делают значение «жёны» наиболее естественным.
- source_word: שָׁבוּ
  choice: захватили
  rationale: Глагол означает взятие в плен. Русское «захватили» позволяет сохранить необычный общий объектный ряд, включающий и имущество, и людей, не создавая выражения «пленили имущество».
- source_word: וַיָּבֹזּוּ
  choice: разграбили
  rationale: בזז означает грабить, брать добычу; «разграбили» сохраняет насильственный характер действия и естественно сочетается с последующим указанием на содержимое дома.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: всё, что было в доме
  rationale: Перевод близко следует единственному числу בַּבַּיִת и сохраняет возможность понимать «дом» как строение либо, шире, домашнее хозяйство.
