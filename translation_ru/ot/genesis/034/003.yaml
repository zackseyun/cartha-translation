base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: ru
  text: И душа его прилепилась к Дине, дочери Иакова, и он полюбил девушку и говорил ей ласковые слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил к сердцу девушки»; это выражение означает говорить ласково, доброжелательно, утешая или ободряя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: душа его прилепилась
  rationale: 'Сохраняет образность еврейского выражения: דבק означает тесно прилепиться или привязаться, а נפשׁ — душу, внутреннее «я» или самого человека.'
- source_word: בְּדִינָה בַּת יַעֲקֹב
  choice: к Дине, дочери Иакова
  rationale: Предлог при דבק естественно передаётся русским «к», а приложение сохраняет структуру оригинала и звучит литературно.
- source_word: וַיֶּאֱהַב
  choice: он полюбил
  rationale: Прямо передаёт обычное значение אהב, не заменяя сообщаемую текстом любовь ни желанием, ни более романтизирующим толкованием.
- source_word: הַנַּעֲרָ
  choice: девушку / ей
  rationale: נַעֲרָה здесь обозначает девушку или молодую женщину. В первом случае существительное передано явно, а во втором местоимение устраняет тяжеловесный повтор без потери референта.
- source_word: וַיְדַבֵּר עַל לֵב
  choice: говорил ей по сердцу
  rationale: Сохраняет сердечную образность идиомы и допускает заложенные в ней оттенки ласковой, утешительной или ободряющей речи, не сводя её к одному из них.
theological_decisions:
- issue: Описание чувств Сихема после насилия, рассказанного в контексте
  choice: Сохранить прямые слова текста о привязанности и любви без оправдания или усиления моральной оценки внутри стиха.
  alternative: Передать чувства заведомо отрицательной лексикой либо романтизировать повествование.
  rationale: Стих сообщает о внутренней привязанности, любви и обращённой к девушке речи. Перевод не должен ни смягчать предшествующее насилие, ни вкладывать в данный стих оценку, которой нет в его формулировке.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Душа его прилепилась» намеренно сохраняет форму и эмоциональную силу оригинала; «говорил ей по сердцу» передаёт идиому без излишней конфессиональной или психологизирующей интерпретации.
