  text: Тогда Хамор, отец Шехема, вышел к Иакову, чтобы поговорить с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Тогда … вышел
  rationale: Форма wayyiqtol продолжает последовательное повествование, а глагол יצא сохраняет значение выхода; «тогда» естественно передаёт развитие событий.
- source_word: חֲמוֹר
  choice: Хамор
  rationale: Имя передано транслитерацией, близкой к еврейскому произношению и принятой в русской библейской традиции.
- source_word: אֲבִי שְׁכֶם
  choice: отец Шехема
  rationale: Прямо и естественно передаёт еврейскую сопряжённую конструкцию.
- source_word: אֶל יַעֲקֹב
  choice: к Иакову
  rationale: Предлог אֶל обозначает направленное движение к человеку; русское «к» точно передаёт эту пространственную связь.
- source_word: לְדַבֵּר אִתּוֹ
  choice: чтобы поговорить с ним
  rationale: Инфинитив с לְ выражает цель, а сочетание דבר с אֵת указывает на разговор с собеседником. «Поговорить» звучит естественно и передаёт предполагаемое взаимодействие; местоимение относится к ближайшему референту — Иакову.
