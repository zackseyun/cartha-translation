  text: Они забрали их мелкий и крупный скот, их ослов, а также всё, что было в городе, и всё, что было в поле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: их мелкий скот
  rationale: צֹאן — собирательное обозначение мелкого домашнего скота, прежде всего овец и коз. «Мелкий скот» точно передаёт объём значения, не ограничивая его одним видом животных.
- source_word: בְּקָרָם
  choice: их крупный скот
  rationale: בָּקָר обозначает крупный рогатый скот как собирательную категорию. В сочетании с «мелким скотом» это естественная и точная русская пара.
- source_word: חֲמֹרֵיהֶם
  choice: их ослов
  rationale: Прямое современное соответствие еврейскому существительному во множественном числе.
- source_word: אֲשֶׁר בָּעִיר
  choice: всё, что было в городе
  rationale: Субстантивированная относительная конструкция обозначает совокупность находившегося в городе имущества; «всё, что» естественно передаёт широкий охват.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: всё, что было в поле
  rationale: שָׂדֶה здесь может обозначать поле или открытую сельскую местность. «В поле» сохраняет наиболее прямое значение и допускает собирательное понимание.
- source_word: לָקָחוּ
  choice: Они забрали
  rationale: לָקַח буквально значит «брать, взять». В контексте разграбления «забрали» звучит по-русски естественно и передаёт присвоение добычи без излишнего усиления.
