base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: ru
  text: Потребуйте с меня очень большой брачный выкуп и дар, и я дам всё, что вы мне скажете; только отдайте мне девушку в жёны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Назначьте мне какое угодно большое
  rationale: Императив во множественном числе с предлогом выражает требование назначить говорящему очень высокую сумму; оборот «какое угодно большое» также подготавливает обещание исполнить названные условия.
- source_word: מֹהַר
  choice: вено
  rationale: В контексте брачных договорённостей это плата жениха или его семьи семье невесты. Русское «вено» передаёт этот специальный смысл точнее, чем «приданое», которое обычно относится к имуществу со стороны невесты.
- source_word: וּמַתָּן
  choice: и дар
  rationale: Существительное обозначает дар или подношение сверх брачной платы; сохранено единственное число исходного текста.
- source_word: וְאֶתְּנָה
  choice: и я дам
  rationale: Когортатив выражает решительную готовность говорящего; естественно передан будущим временем.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: всё, что вы мне скажете
  rationale: Оборот указывает на готовность исполнить любые названные требования, не ограничивая их только суммой.
- source_word: וּתְנוּ לִי
  choice: только отдайте мне
  rationale: Союз вводит кульминационную просьбу; «только» естественно передаёт её настойчивую условную направленность, а «отдайте» соответствует брачному контексту.
- source_word: הַנַּעֲרָ
  choice: эту молодую женщину
  rationale: Слово обозначает молодую женщину брачного возраста; указательное «эту» в русском естественно отражает определённость и конкретного участника повествования.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Устойчивый современный русский эквивалент древнееврейского выражения о вступлении в брак.
