    rationale: Термин точен исторически, но устарел и требует пояснения; ясный термин «брачный выкуп» сноской лучше отвечает современному литературному русскому.
  - severity: low
    issue: Необязательное указательное «эту»
    rationale: Определённый артикль в древнееврейском не требует русского указательного местоимения; оно может добавить невыраженный оттенок указания.
  revised_text: Потребуйте с меня очень большой брачный выкуп и дар, и я дам всё, что вы мне скажете; только отдайте мне девушку в жёны.
