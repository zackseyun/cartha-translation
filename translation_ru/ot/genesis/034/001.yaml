lexical_decisions:
- source_word: וַתֵּצֵא
  choice: вышла
  rationale: Форма глагола יצא передаёт последовательное повествовательное действие — выход или отправление; «вышла» естественно звучит по-русски и не добавляет не названного в тексте места.
- source_word: דִינָה
  choice: Дина
  rationale: Традиционная и общепринятая русская передача личного имени.
- source_word: בַּת לֵאָה
  choice: дочь Лии
  rationale: Конструкция прямо указывает на происхождение Дины по матери; краткая русская форма сохраняет ясность приложения.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: которую та родила Иакову
  rationale: Относительное местоимение относится к Дине, а подлежащее глагола — Лия. Указательное «та» устраняет возможную русскую двусмысленность, не повторяя имени; дательный «Иакову» сохраняет способ выражения отцовства в еврейском тексте.
- source_word: לִרְאוֹת
  choice: посмотреть
  rationale: Инфинитив ראה буквально связан со зрительным восприятием. «Посмотреть» сохраняет прямой смысл и при этом естественно передаёт цель движения; возможное значение общения не вносится в основной текст.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: на дочерей той земли
  rationale: Сохранён образный еврейский оборот «дочери земли», обозначающий местных девушек или женщин. Предлог «на» естественно сочетается по-русски с «посмотреть», а «той» указывает на уже подразумеваемую местность.
