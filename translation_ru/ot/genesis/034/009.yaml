  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: ru
  text: 'Породнитесь с нами: выдавайте ваших дочерей за нас[a], а наших дочерей берите себе в жёны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваших дочерей давайте нам». Здесь речь идёт о выдаче дочерей замуж; тот же брачный смысл подразумевается и в словах «берите наших дочерей».'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: Породнитесь с нами через браки
  rationale: Форма хитпаэль от חתן выражает взаимное вступление в брачные связи между группами. Такой перевод естественно передаёт взаимность и не сводит предложение к одному отдельному браку.
- source_word: בְּנֹתֵיכֶם תִּתְּנוּ לָנוּ
  choice: отдавайте своих дочерей за нас
  rationale: В данном брачном контексте נתן означает выдавать дочерей замуж. Русское «отдавать за кого-либо» ясно выражает этот смысл и соответствует направлению действия.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: и берите наших дочерей себе в жёны
  rationale: לקח в сочетании с дочерьми здесь означает брать их в брак. Добавление «в жёны» делает подразумеваемый в еврейском тексте брачный смысл ясным для современного русского читателя.
