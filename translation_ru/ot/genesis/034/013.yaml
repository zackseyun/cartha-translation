  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: ru
  text: 'Сыновья Иакова ответили Сихему и его отцу Еммору коварно[a] и сказали, потому что он осквернил их сестру Дину[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с коварством» или «с обманом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надругался над их сестрой Диной». В еврейском тексте сказано «осквернил», что сохраняет нравственный и ритуальный оттенок выражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ответили
  rationale: В данном повествовательном контексте глагол ענה вводит ответ на предшествующее предложение; «ответили» естественно и точно передаёт эту функцию.
- source_word: בְנֵי יַעֲקֹב
  choice: сыновья Иакова
  rationale: Прямое и естественное для современного русского языка соответствие еврейской конструкции принадлежности.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: Сихему и его отцу Еммору
  rationale: Передаёт два прямых дополнения и ясно относит обозначение «его отец» к Еммору, сохраняя смысл исходного текста.
- source_word: בְּמִרְמָה
  choice: коварно
  rationale: Существительное מִרְמָה обозначает обман или коварство и в сочетании с предлогом употреблено обстоятельственно; наречие «коварно» звучит естественно.
- source_word: וַיְדַבֵּרוּ
  choice: и сказали так
  rationale: Глагол דבר буквально означает «говорить»; перед последующей прямой речью русская формула «сказали так» естественно связывает этот стих со следующим, не меняя содержания.
- source_word: אֲשֶׁר
  choice: потому что
  rationale: В контексте частица вводит основание коварного ответа братьев; причинное «потому что» лучше всего передаёт связь.
- source_word: טִמֵּא
  choice: осквернил
  rationale: Пиэль глагола טמא означает «сделать нечистым, осквернить». «Осквернил» сохраняет морально-ритуальную лексику оригинала и не смягчает тяжесть поступка.
- source_word: אֲחֹתָם
  choice: их сестру
  rationale: Точно передаёт притяжательную форму и родственную связь, мотивирующую поступок братьев.
theological_decisions:
- issue: Характер поступка Сихема и значение טִמֵּא
  choice: осквернил
  alternative: надругался над
  rationale: Выбрано лексически близкое «осквернил», чтобы сохранить морально-ритуальную напряжённость еврейского слова. Более явное «надругался над» подходит контексту, но сужает и истолковывает исходную лексику.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двоеточие показывает, что речь продолжается в следующем стихе. Местоимение «он» сохраняет невыраженный в еврейском глаголе субъект, который по контексту относится к Сихему.
