  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: ru
  text: Иаков услышал, что Сихем осквернил[a] его дочь Дину. Но сыновья Иакова были со скотом в поле, поэтому Иаков молчал, пока они не пришли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обесчестил его дочь Дину». Еврейский глагол буквально означает «осквернил» или «сделал нечистой»; в данном контексте он относится к сексуальному обесчещению Дины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: услышал
  rationale: Прямо передаёт получение известия в повествовательном контексте, не добавляя отсутствующего в еврейском тексте значения «узнал».
- source_word: כִּי
  choice: что
  rationale: Вводит содержание того, что услышал Иаков.
- source_word: טִמֵּא
  choice: осквернил
  rationale: Порода пиэль глагола טמא означает «осквернить, сделать нечистым». В данном контексте слово указывает на сексуальное поругание Дины, но само по себе не является обычным еврейским глаголом со значением «изнасиловать».
- source_word: בִתּוֹ
  choice: его дочь
  rationale: Естественная русская передача существительного с местоименным суффиксом; местоимение относится к Иакову.
- source_word: וּבָנָיו
  choice: Сыновья Иакова
  rationale: 'Повтор имени устраняет возможную для русского читателя неясность: местоимение «его» могло бы ошибочно восприниматься как относящееся к осквернившему Дину мужчине. Союз далее передан при соединении обстоятельства и результата.'
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: были со скотом в поле
  rationale: Сохраняет указание на местонахождение сыновей вместе со скотом и не добавляет прямо не выраженного действия «пасли».
- source_word: מִקְנֵהוּ
  choice: скотом
  rationale: מִקְנֶה здесь обозначает совокупность домашних стад; русское «скот» естественно и достаточно широко.
- source_word: וְהֶחֱרִשׁ
  choice: и Иаков молчал
  rationale: Глагол выражает воздержание от речи или реакции. Повтор имени соответствует еврейскому тексту и подчёркивает выдержанную паузу.
- source_word: עַד בֹּאָם
  choice: пока они не пришли
  rationale: Идиоматично передаёт «до их прихода», не добавляя отсутствующего в тексте значения «вернулись».
theological_decisions:
- issue: Характер поступка, обозначенного טִמֵּא
  choice: осквернил
  alternative: обесчестил / надругался над
  rationale: Выбор сохраняет буквальную образность нечистоты и нравственно-социальную тяжесть выражения, не подменяя исходный глагол более узким юридическим термином. Контекстуальный смысл пояснён в сноске.
- issue: Неявный субъект глагола טִמֵּא
  choice: тот
  alternative: он
  rationale: Еврейский глагол имеет невыраженный субъект, понятный из предыдущего контекста. Русское «тот» сохраняет контекстуальную отсылку и одновременно не допускает ошибочного отнесения действия к Иакову; имя не добавлено.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; исключены архаизмы и добавочные толкования. Имя Иакова повторено ради ясности местоименных связей.
