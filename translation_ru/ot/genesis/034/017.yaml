  text: וְ/אִם לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖י/נוּ לְ/הִמּ֑וֹל וְ/לָקַ֥חְנוּ אֶת בִּתֵּ֖/נוּ וְ/הָלָֽכְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: ru
  text: Если же вы не послушаете нас и не обрежетесь[a], мы возьмём нашу дочь и уйдём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не послушаете нас — обрезаться». Еврейский инфинитив указывает, в чём должно выразиться послушание: в принятии обрезания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Если же
  rationale: Частица «же» естественно передаёт противопоставление предыдущему предложению, а «если» вводит условие.
- source_word: לֹא תִשְׁמְעוּ אֵלֵינוּ
  choice: вы не послушаете нас
  rationale: שׁמע с אֶל означает «слушать, внимать, послушаться». Формулировка «не послушаете нас» сохраняет прямой образ слушания и в контексте ясно выражает отказ исполнить требование.
- source_word: לְ/הִמּוֹל
  choice: и не обрежетесь
  rationale: 'Инфинитив уточняет содержание требуемого послушания. Сочинительная конструкция по-русски естественно передаёт смысл: послушать их означает подвергнуться обрезанию; возвратная форма сохраняет пассивно-рефлексивный оттенок.'
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: мы возьмём нашу дочь
  rationale: Форма с вау в следствии условной конструкции имеет будущее значение. «Возьмём» прямо передаёт לקח, а «нашу дочь» — существительное с суффиксом первого лица множественного числа.
- source_word: וְ/הָלָכְנוּ
  choice: и уйдём
  rationale: В данном контексте הלך означает не просто движение, а уход из этого места; «уйдём» естественно выражает это по-русски.
