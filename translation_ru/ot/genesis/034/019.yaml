  text: וְ/לֹֽא אֵחַ֤ר הַ/נַּ֨עַר֙ לַ/עֲשׂ֣וֹת הַ/דָּבָ֔ר כִּ֥י חָפֵ֖ץ בְּ/בַֽת יַעֲקֹ֑ב וְ/ה֣וּא נִכְבָּ֔ד מִ/כֹּ֖ל בֵּ֥ית אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: ru
  text: И юноша не замедлил сделать это[a], потому что желал дочери Иакова[b]; а в доме своего отца он был почитаем более всех[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не стал медлить, чтобы сделать это».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «был пленён дочерью Иакова»; возможны также значения «находил удовольствие в дочери Иакова» и «благоволил к дочери Иакова».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «он был самым почитаемым во всём доме своего отца».'
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: не замедлил
  rationale: Глагол означает «медлить, задерживаться» и здесь подчёркивает быстроту действия, а не отсутствие внутренних колебаний.
- source_word: הַנַּעַר
  choice: юноша
  rationale: Речь идёт о Сихеме; «юноша» естественно для повествования и соответствует возрастному обозначению исходного текста.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: сделать это
  rationale: Выражение отсылает к требованию предыдущих стихов. По-русски «сделать это» естественнее буквального «сделать это дело».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину того, почему Сихем действовал без промедления.
- source_word: חָפֵץ
  choice: желал
  rationale: В данном контексте глагол выражает сильное расположение и желание. «Желал» сохраняет эту силу, не уточняя без достаточных оснований, было ли чувство только сексуальным.
- source_word: בְּבַת יַעֲקֹב
  choice: дочери Иакова
  rationale: При русском глаголе «желать» управление без предлога естественно передаёт еврейское сочетание חפץ ב־.
- source_word: נִכְבָּד
  choice: почитаем
  rationale: Причастие от כבד обозначает человека, пользующегося почётом, уважением и весом в обществе.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: в доме своего отца ... более всех
  rationale: Конструкция с מִן допускает сравнительное и превосходное понимание; сравнительная формулировка близко отражает её форму и по-русски ясно обозначает остальных членов отцовского дома.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. Союз «а» отделяет дополнительную характеристику Сихема от причины его поспешности, не устраняя возможной смысловой связи. Термин «дом отца» сохранён как понятное библейское обозначение семьи и домочадцев.
