base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: ru
  text: 'Только при этом условии эти люди согласятся с нами[a] жить с нами и стать с нами одним народом: если каждый из лиц мужского пола среди нас будет обрезан, как обрезаны они.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дадут нам согласие», «будут готовы согласиться с нами»; еврейский глагол выражает согласие или готовность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Только при этом условии
  rationale: Сочетание ограничительной частицы и предложной конструкции вводит единственное условие согласия; такая передача естественна по-русски.
- source_word: יֵאֹתוּ לָנוּ
  choice: согласятся с нами
  rationale: Форма глагола выражает согласие или готовность принять предложение; контекст переговоров поддерживает «согласятся».
- source_word: הָאֲנָשִׁים
  choice: эти люди
  rationale: Речь идёт о конкретной уже упомянутой группе; «люди» в русском естественно обозначает здесь мужчин Иакова без искусственного сужения до взрослых.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: жить среди нас
  rationale: ישׁב обозначает проживание или поселение, а אִתָּנוּ — совместность; «жить среди нас» естественно в данном общественном контексте.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: стать с нами одним народом
  rationale: Инфинитив היה допускает результативное понимание «стать»; добавленное по смыслу «с нами» ясно выражает объединение двух групп и не меняет содержания.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: если у нас будет обрезан каждый мужчина
  rationale: Предлог בְּ при инфинитиве обозначает условие. זָכָר буквально означает лицо мужского пола; в русском контексте обряда естественнее «каждый мужчина», при этом охват всей мужской части сообщества сохраняется.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: как обрезаны они
  rationale: Сохранены сравнительное значение, эмфатическое местоимение и состояние другой группы без уточнения времени совершения обряда.
