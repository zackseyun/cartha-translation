  text: וַ/יִּֽיטְב֥וּ דִבְרֵי/הֶ֖ם בְּ/עֵינֵ֣י חֲמ֑וֹר וּ/בְ/עֵינֵ֖י שְׁכֶ֥ם בֶּן חֲמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/018.yaml
  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: ru
  text: И понравились их слова Хамору и Сихему, сыну Хамора.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И показались их слова хорошими Хамору и Сихему, сыну Хамора».'
    reason: Лексическая альтернатива, более буквально сохраняющая еврейскую идиому со значением положительной оценки.
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: понравились
  rationale: В сочетании с בְּעֵינֵי глагол выражает положительную оценку и одобрение. «Понравились» естественно передаёт этот смысл по-русски, не добавляя идеи объективной нравственной правильности.
- source_word: דִבְרֵיהֶם
  choice: их слова
  rationale: Сохраняет множественное число и широкое значение דָּבָר; вариант «их предложение» был бы более узким и интерпретирующим.
- source_word: בְּעֵינֵי
  choice: Хамору и Сихему
  rationale: Еврейская идиома буквально означает «в глазах». Русская дательная конструкция при «понравились» естественно передаёт оценочное значение.
- source_word: חֲמוֹר
  choice: Хамор
  rationale: Традиционно и узнаваемо передаёт еврейское личное имя חֲמוֹר в русском библейском тексте.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Традиционная русская форма имени שְׁכֶם, понятная читателям и согласованная с русской библейской ономастикой.
- source_word: בֶּן חֲמוֹר
  choice: сыну Хамора
  rationale: Прямо сохраняет родственное обозначение и порядок еврейского выражения, с падежным согласованием в русском предложении.
