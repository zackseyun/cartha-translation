  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: ru
  text: Сыновья Иакова пришли к убитым[a] и разграбили город, где была осквернена их сестра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришли на убитых»; еврейское сочетание может обозначать движение к ним или против них.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейская фраза сжата: «город, который они осквернили их сестру». По смыслу речь идёт о городе, жители которого осквернили их сестру; перевод передаёт эту связь, не называя подразумеваемого деятеля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: Сыновья Иакова
  rationale: Сохраняет явную конструкцию принадлежности и повествовательный акцент на сыновьях Иакова как группе.
- source_word: בָּאוּ עַל הַחֲלָלִים
  choice: пришли к убитым
  rationale: Передаёт движение к месту, где лежали убитые, не добавляя нового нападения на уже погибших; сочетание с עַל допускает также оттенок движения «на/против».
- source_word: וַיָּבֹזּוּ הָעִיר
  choice: и разграбили город
  rationale: Глагол בזז обозначает захват добычи; «разграбили» — точный, современный и стилистически уместный русский эквивалент.
- source_word: אֲשֶׁר
  choice: где
  rationale: Относительная частица вводит сжатую связь между городом и осквернением сестры. Локативное «где» естественно связывает событие с городом и не создаёт ложного впечатления, будто сестру осквернили сами сыновья Иакова.
- source_word: טִמְּאוּ
  choice: была осквернена
  rationale: «Осквернена» сохраняет нравственный и социально-религиозный диапазон piel от טמא. Пассивная конструкция позволяет не приписывать грамматически не названного деятеля неверному субъекту.
- source_word: אֲחוֹתָם
  choice: их сестра
  rationale: Прямо передаёт родственную связь, существенную для мотивации поступка.
theological_decisions:
- issue: Оценка разграбления города
  choice: Не добавлять одобрения или осуждения
  alternative: Представить разграбление как прямо оправданное возмездие
  rationale: Стих сообщает поступок и связывает город с осквернением сестры, но сам по себе не даёт явной богословской оценки действий сыновей Иакова.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным, при этом сжатость и неоднозначность еврейской относительной конструкции отмечены в сноске.
