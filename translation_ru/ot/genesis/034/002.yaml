base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: ru
  text: Сихем, сын Еммора, хиввеянина, правителя этой земли, увидел её, взял её, лёг с ней и надругался над ней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унизил её». Еврейский глагол может означать причинять страдание, унижать или оскорблять; здесь, в сочетании с предшествующими словами, он обозначает сексуальное насилие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: увидел её
  rationale: Передаёт обычное повествовательное значение ראה без добавочного оттенка пристального взгляда или внезапного обнаружения.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: Сихем, сын Еммора-хиввеянина
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён и этнонима; дефис ясно связывает определение «хиввеянин» с Еммором, к которому оно непосредственно примыкает в еврейском тексте.
- source_word: נְשִׂיא הָאָרֶץ
  choice: правителя той земли
  rationale: נָשִׂיא обозначает вождя, начальника или правителя. «Правитель» естественнее в современном русском и не приписывает персонажу царского титула; «той земли» передаёт определённость הָאָרֶץ в повествовательном контексте.
- source_word: וַיִּקַּח אֹתָהּ
  choice: взял её
  rationale: Сохраняет основное значение לקח и последовательность еврейского повествования, не перенося всю идею принуждения в этот глагол прежде заключительной оценки поступка.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: лёг с ней
  rationale: Близко передаёт еврейское обозначение полового акта и сохраняет серьёзный, неразговорный регистр.
- source_word: וַיְעַנֶּהָ
  choice: надругался над ней
  rationale: Пиэль глагола ענה может выражать унижение, причинение страдания или насильственное попрание. В данном сексуальном контексте «надругался над ней» ясно передаёт насилие и бесчестье, не сводя многозначный глагол к узкому словарному соответствию.
theological_decisions:
- issue: Как прямо передать сексуальное насилие, не смягчая и не переопределяя еврейский текст
  choice: «взял её, лёг с ней и надругался над ней»
  alternative: «схватил её и изнасиловал»; «взял её, лёг с ней и унизил её»
  rationale: Выбранная формулировка сохраняет трёхчастную последовательность оригинала и ясно показывает насильственный, унизительный характер поступка. «Изнасиловал» непосредственно выражает общий смысл эпизода, но объединяет и конкретизирует значения нескольких еврейских глаголов; одно лишь «унизил» в современном русском может чрезмерно смягчить сексуальное насилие.
- issue: К кому относятся обозначения «хиввеянин» и «правитель земли»
  choice: к Еммору
  alternative: к Сихему
  rationale: В еврейской цепочке определений הַחִוִּי נְשִׂיא הָאָרֶץ непосредственно следует за именем Еммора, поэтому русская синтаксическая связь оформлена с Еммором. Контекст главы также представляет Еммора как общественного представителя при переговорах, хотя сама сжатая конструкция допускает некоторое синтаксическое напряжение.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейского повествования. Формулировка не прибегает к эвфемизму, но и не заменяет последовательность еврейских глаголов одним более узким юридическим термином.
