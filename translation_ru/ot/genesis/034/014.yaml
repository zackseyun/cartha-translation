lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: И сказали им
  rationale: Обычная повествовательная передача глагола אמר с сохранением косвенного дополнения во множественном числе.
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: Мы не можем сделать этого
  rationale: Естественная современная русская передача значения способности; родительное «этого» после отрицания идиоматично выражает еврейское «сделать это дело».
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: отдать нашу сестру
  rationale: В брачном контексте «отдать» естественно передаёт נתן и не требует внесения отсутствующих в тексте слов «замуж» или «в жёны».
- source_word: לְאִישׁ אֲשֶׁר לוֹ עָרְלָה
  choice: мужчине, у которого есть крайняя плоть
  rationale: Сохраняет конкретную и намеренно описательную форму еврейского выражения; более привычный смысл «необрезанному мужчине» дан в сноске.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: потому что для нас это позор
  rationale: «Позор» ясно передаёт חרפה как бесчестье и общественное унижение; конструкция сохраняет оценку говорящих, не превращая её в объективное утверждение повествователя.
