- source_word: הַיַּלְדָּה הַזֹּאת
  choice: «эту девушку»
  rationale: В данном брачном контексте יַלְדָּה естественно означает молодую женщину, а не маленького ребёнка.
- source_word: לְאִשָּׁה
  choice: «в жёны»
  rationale: Устойчивое современное русское выражение, точно передающее намерение взять её женой.
