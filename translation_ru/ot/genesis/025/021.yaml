base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: ru
  text: Исаак молился Яхве за свою жену[a], потому что она была бесплодна. Яхве внял ему[b], и Ревекка, его жена, зачала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно перевести более буквально: «напротив своей жены»; здесь оно, вероятно, означает молитву о ней или ради неё.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь повторён тот же корень, что и в словах об Исааке: Исаак обращался с мольбой, и Яхве дал Себя умолить.'
    reason: wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: молился / внял ему
  rationale: 'Обе формы восходят к одному корню עתר и создают намеренный переклик: Исаак обращается с мольбой, а Яхве принимает её. Разные, но соотнесённые русские выражения передают смысл естественно; буквальное повторение одного корня по-русски было бы тяжеловесным.'
- source_word: לַיהוָה / יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет его функцию в еврейском тексте.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: за свою жену
  rationale: В данном молитвенном контексте выражение естественно понимается как указание на того, ради кого совершается молитва. Более буквальный пространственный смысл отмечен в сноске.
- source_word: עֲקָרָה
  choice: бесплодна
  rationale: Точно обозначает неспособность зачать и соответствует сдержанному повествовательному стилю.
- source_word: וַתַּהַר
  choice: зачала
  rationale: Краткая и литературно естественная передача наступления беременности, согласующаяся с библейским повествовательным регистром.
- source_word: רִבְקָה
  choice: Ревекка
  rationale: Устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Повтор корня עתר и характер Божьего ответа
  choice: «Исаак молился… Яхве внял ему»
  alternative: «Исаак умолял… Яхве дал Себя умолить»
  rationale: Выбранная передача сохраняет взаимосвязь молитвы и ответа, не создавая впечатления механического воздействия на Бога; формальная связь корней разъясняется в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; его транслитерация делает это явным и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Сохранены повтор «его жена» и прямое употребление имени Яхве; синтаксис слегка сглажен ради естественности без устранения смысловой неоднозначности לְנֹכַח.
