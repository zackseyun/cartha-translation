base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: ru
  text: Исааку было сорок лет, когда он взял себе в жёны Ревекку[a], дочь Вафуила, арамея из Паддан-Арама, сестру Лавана, арамея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «когда он женился на Ревекке». Буквально по-еврейски: «когда он взял Ревекку себе в жёны».'
    reason: lexical_alternative
  - marker: b
    text: «Арамей» точнее передаёт древнееврейское обозначение народа, чем традиционное «сириянин».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Исааку было сорок лет
  rationale: Естественная современная русская передача древнееврейского возрастного оборота; повествовательная форма וַיְהִי здесь вводит указание возраста.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: когда он взял себе в жёны
  rationale: Сохраняет образ глагола לקח («взять») и одновременно ясно передаёт брачное значение всего оборота.
- source_word: רִבְקָה
  choice: Ревекку
  rationale: Устоявшаяся русская библейская форма имени, употреблённая в требуемом винительном падеже.
- source_word: בַּת בְּתוּאֵל הָאֲרַמִּי
  choice: дочь Вафуила-арамея
  rationale: Сохраняет родословное указание и точно передаёт этноним אֲרַמִּי как «арамея», а не традиционное, но менее точное «сириянина».
- source_word: מִפַּדַּן אֲרָם
  choice: из Паддан-Арама
  rationale: Передаёт географическое название транслитерацией и естественно оформляет его по-русски через дефис.
- source_word: אֲחוֹת לָבָן הָאֲרַמִּי
  choice: сестру Лавана-арамея
  rationale: Сохраняет параллельное родственное и этническое обозначение исходного текста.
