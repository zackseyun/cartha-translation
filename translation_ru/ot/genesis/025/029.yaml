base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: ru
  text: Иаков варил похлёбку, а Исав пришёл с поля, утомлённый[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изнемогший»; еврейское слово может обозначать сильную усталость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: варил
  rationale: Глагол זיד в этой форме и контексте обозначает приготовление пищи посредством варки; «варил» прямо и естественно передаёт конкретное действие.
- source_word: נָזִיד
  choice: похлёбку
  rationale: נָזִיד — варёное кушанье, густая жидкая пища; «похлёбка» понятно современному читателю и уместно в повествовательном контексте.
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: בוא означает «приходить, входить»; направление и исходная точка уже выражены сочетанием «с поля», поэтому добавлять «в дом» не следует.
- source_word: מִן הַשָּׂדֶה
  choice: с поля
  rationale: Так естественно по-русски передаётся буквальное «из/с поля» без ненужного уточнения места.
- source_word: וְהוּא עָיֵף
  choice: утомлённый
  rationale: עָיֵף обозначает усталость, изнеможение. Причастный оборот естественно передаёт сопутствующее состояние Исава, сохраняя связь с предшествующим подлежащим.
