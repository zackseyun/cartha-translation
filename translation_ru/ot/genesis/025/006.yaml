base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: ru
  text: А сыновьям своих наложниц Авраам дал подарки и ещё при жизни отослал их прочь от своего сына Исаака — на восток, в восточную страну.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: А сыновьям своих наложниц
  rationale: Союз передаёт контраст с Исааком в предыдущем стихе; «наложницы» точно и кратко обозначает женщин признанного, но более низкого брачного статуса. Притяжательное «своих» естественно связывает их с Авраамом.
- source_word: נָתַן אַבְרָהָם מַתָּנֹת
  choice: Авраам дал подарки
  rationale: Прямой и естественный перевод сочетания глагола «дать» с существительным «подарки» в контексте распределения имущества.
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  choice: отослал их прочь от своего сына Исаака
  rationale: «Отослал … прочь» передаёт не только отправление, но и подчёркнутое отделение от Исаака, выраженное וַיְשַׁלְּחֵם и מֵעַל.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: ещё при жизни
  rationale: Естественное современное выражение, ясно указывающее, что Авраам сделал это до своей смерти.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: на восток, в восточную страну
  rationale: «На восток» сохраняет направительное значение קֵדְמָה, а «в восточную страну» передаёт אֶרֶץ קֶדֶם без неоправданной конкретизации географического названия.
