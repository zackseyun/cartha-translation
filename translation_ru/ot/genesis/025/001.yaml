translation:
  language: ru
  text: Авраам взял ещё одну жену, по имени Хеттура[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Авраам снова взял себе жену». Буквально в еврейском тексте: «Авраам добавил и взял жену».'
    reason: 'Лексическая альтернатива: оборот с יסף может подчёркивать как добавление ещё одной жены, так и повторность действия.'
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: снова
  rationale: Глагол יסף в сочетании с последующим וַיִּקַּח выражает добавление или повторность действия. «Снова взял» естественно передаёт это значение и сохраняет присущую еврейскому обороту возможность понимать его как «взял ещё одну жену».
- source_word: וַיִּקַּח
  choice: взял себе
  rationale: В сочетании с אִשָּׁה глагол לקח обозначает взятие женщины в жёны. «Взял себе жену» сохраняет образ исходного текста и ясно выражает брачный смысл.
- source_word: אִשָּׁה
  choice: жену
  rationale: Хотя слово может означать «женщина» или «жена», в сочетании с לקח здесь оно имеет брачное значение.
- source_word: וּשְׁמָהּ
  choice: и звали её
  rationale: Естественная современная русская передача простой еврейской формулы называния без изменения смысла.
- source_word: קְטוּרָה
  choice: Хеттура
  rationale: Использована устоявшаяся русская библейская форма личного имени.
theological_decisions:
- issue: Как передать добавочное или повторное значение וַיֹּסֶף при сообщении о женитьбе Авраама
  choice: Авраам снова взял себе жену
  alternative: Авраам взял себе ещё одну жену
  rationale: «Снова» передаёт повторность действия, не вынуждая текст утверждать больше, чем выражает еврейский оборот. В сноске дана равно возможная передача с акцентом на ещё одной жене.
translation_notes:
  register: Современный литературный русский язык; изложение простое и dignified. Оборот «взял себе жену» сохраняет библейский образ, оставаясь понятным современному читателю. Подлинная смысловая вариативность וַיֹּסֶף отражена сноской.
