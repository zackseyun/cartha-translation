translation_notes:
  register: Современный литературный русский язык с кратким, dignified генеалогическим синтаксисом. Союз ו в начале стиха не передан отдельным «и», поскольку по-русски при самостоятельном чтении стиха естественнее начать с подлежащего; последовательность повествования сохраняется контекстом.
