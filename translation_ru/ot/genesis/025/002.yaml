  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: ru
  text: И она родила ему Зимрана, Иокшана, Медана, Мадиана, Ишбака и Шуаха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Она родила
  rationale: Форма Qal wayyiqtol, 3-е лицо женского рода единственного числа, повествует о завершённом событии. «Она родила» естественно и точно передаёт материнское действие без добавления отсутствующего в еврейском тексте слова «сыновей».
- source_word: לוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом после ילד указывает на отца детей; русское «родила ему» сохраняет эту связь и соответствует генеалогическому стилю.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения повторяется перед каждым именем и передаётся обычным русским синтаксисом.
- source_word: זִמְרָן
  choice: Зимран
  rationale: Личное имя передано принятой русской библейской формой, близкой к еврейскому звучанию.
- source_word: יָקְשָׁן
  choice: Иокшан
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: מְדָן
  choice: Медан
  rationale: Личное имя передано принятой русской библейской формой.
- source_word: מִדְיָן
  choice: Мадиан
  rationale: Сохранена устоявшаяся русская библейская форма имени, также связанного с названием народа и земли.
- source_word: יִשְׁבָּק
  choice: Ишбак
  rationale: Личное имя транслитерировано с учётом еврейского произношения и русской библейской традиции.
- source_word: שׁוּחַ
  choice: Шуах
  rationale: Личное имя передано близко к еврейскому звучанию; конечная согласная ח отражена буквой «х».
