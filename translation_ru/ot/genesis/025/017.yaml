base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: ru
  text: 'Таковы были годы жизни Измаила: сто тридцать семь лет. Он испустил дух[a] и умер, и был собран к своему народу[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол, переданный словами «испустил дух», отличается от следующего «умер»; оба глагола сохранены в переводе.
    reason: lexical_alternative
  - marker: b
    text: «Был собран к своему народу» — древнееврейская формула в сообщениях о смерти. Она может подразумевать погребение среди родных, воссоединение с предками после смерти или оба смысла.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: Вот сколько лет прожил Измаил
  rationale: Естественно передаёт итоговую формулу о продолжительности жизни, сохраняя её функцию в повествовании без тяжеловесного буквального оборота «вот годы жизни».
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: сто тридцать семь лет
  rationale: Передаёт точную сумму в обычной современной русской форме.
- source_word: וַיִּגְוַע
  choice: испустил дух
  rationale: Передаёт отдельный глагол גוע как формулу последнего вздоха и не сливает его со следующим וַיָּמָת.
- source_word: וַיָּמָת
  choice: и умер
  rationale: Сохраняет второй, отдельный глагол смерти в последовательности еврейского текста.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: и приобщился к своему народу
  rationale: Русский библейский по достоинству оборот сохраняет образ присоединения к своему народу и не сводит выражение исключительно к погребению или исключительно к посмертному воссоединению.
theological_decisions:
- issue: Значение формулы וַיֵּאָסֶף אֶל־עַמָּיו
  choice: Сохранить образное выражение «приобщился к своему народу»
  alternative: «был погребён со своими родными» или «воссоединился со своими предками»
  rationale: Еврейская формула допускает связь с родовым погребением, посмертным воссоединением с предками или обоими смыслами; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной библейской прозы. Формулировка доступна широкому читателю; два глагола смерти и неоднозначность заключительной идиомы сохранены.
