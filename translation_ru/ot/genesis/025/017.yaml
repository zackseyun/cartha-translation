  source_fidelity: Число лет передано точно, а два последовательных еврейских глагола смерти (וַיִּגְוַע и וַיָּמָת) сохранены раздельно. Однако «приобщился к своему народу» в современном русском обычно связано с приобщением к вере, таинству или практике и неудачно передаёт формулу וַיֵּאָסֶף אֶל־עַמָּיו.
  naturalness: «Вот сколько лет прожил Измаил» понятно, но «Таковы были годы жизни Измаила» ближе к формуле оригинала и естественно для современного литературного библейского повествования. «Был собран к своему народу» намеренно сохраняет образ и пассивную форму исходного текста; с пояснением это предпочтительнее семантически постороннего «приобщился».
  terminology: Имя «Измаил» и формула «испустил дух и умер» уместны. Заключительную смерть-формулу следует передать без конфессионального уточнения и без значения религиозного «приобщения».
