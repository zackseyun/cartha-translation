  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶֽל יַעֲקֹ֗ב הַלְעִיטֵ֤/נִי נָא֙ מִן הָ/אָדֹ֤ם הָ/אָדֹם֙ הַ/זֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: ru
  text: 'И сказал Исав Иакову: «Дай мне, пожалуйста, проглотить немного этого красного, этого красного вон там, потому что я изнемог». Поэтому его назвали Едомом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Едом» созвучно еврейскому слову «красный»; так в стихе обыгрывается повтор «красного, красного». В еврейском тексте пища прямо не названа.
    reason: cross_reference
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: Дай мне… проглотить
  rationale: Побудительная форма с суффиксом первого лица передаёт просьбу дать говорящему жадно проглотить пищу. «Проглотить» сохраняет грубоватую поспешность речи Исава, не добавляя отсутствующего в еврейском тексте названия блюда.
- source_word: נָא
  choice: пожалуйста
  rationale: Частица смягчает настойчивую просьбу; в современном русском естественно передаётся словом «пожалуйста».
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: того красного, красного, что там
  rationale: Сохранены субстантивированное прилагательное без названия пищи, необычный повтор «красного, красного» и указательное значение הַזֶּה. Формулировка намеренно отражает порывистую речь Исава.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: потому что я изнемог
  rationale: עָיֵף обозначает крайнюю усталость. «Изнемог» естественно выражает состояние, не утверждая прямо, что Исав умирал или терял сознание.
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Кратко и точно передаёт вывод и вводит объяснение имени.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: его назвали Едомом
  rationale: Неопределённо-личная русская конструкция естественно передаёт еврейскую форму с невыраженным деятелем. Творительный падеж соответствует русской норме при глаголе «назвать».
- source_word: אֱדוֹם
  choice: Едом
  rationale: Собственное имя передано принятой русской библейской формой; связь со словом «красный» разъяснена в примечании.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением достоинства повествования и намеренно порывистой, несколько грубоватой прямой речи Исава. Эллипсис оригинала не устранён добавлением слов «похлёбка» или «чечевица»; повтор «красного, красного» сохранён.
