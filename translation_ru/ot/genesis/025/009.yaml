lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: И похоронили его
  rationale: Форма wayyiqtol продолжает последовательное повествование; начальное «И» естественно сохраняет связь с предыдущим событием. Местоимение относится к Аврааму.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: сыновья, Исаак и Измаил
  rationale: Постпозитивное בָּנָיו передано как поясняющее обозначение названных лиц; русский порядок слов позволяет сохранить еврейскую последовательность имён и затем ясно обозначить их как сыновей Авраама.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: в пещере Махпела
  rationale: Хотя אֶל обычно обозначает направление, при глаголе погребения по-русски естественно назвать место предлогом «в». Махпела передано как собственное имя без попытки истолковать его значение.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: на поле Ефрона
  rationale: Второе אֶל уточняет место погребения; русское «на поле» идиоматично и показывает, что пещера находилась на принадлежавшем Ефрону поле.
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: сына Цохара-хетта
  rationale: Сочетание передаёт родство Ефрона и этническое обозначение Цохара; дефисное приложение «Цохара-хетта» естественно для современного русского текста.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: напротив Мамре
  rationale: Географическое выражение עַל־פְּנֵי допускает значения «перед», «лицом к» и «напротив»; основной вариант не добавляет не выраженного в тексте направления.
