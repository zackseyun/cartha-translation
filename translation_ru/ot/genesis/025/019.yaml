  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: ru
  text: 'Вот родословие Исаака[a], сына Авраама: Авраам стал отцом Исаака.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повествование»; «история рода». Еврейское слово толедо́т — повторяющийся в книге Бытия заголовочный термин, который может обозначать родословие или повествование о продолжении рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Вводит новый раздел и естественно передаёт указательно-связующую функцию еврейской формулы без добавления временного значения «теперь».
- source_word: תּוֹלְדֹת
  choice: родословие
  rationale: Сохраняет повторяющийся структурный термин книги Бытия и его связь с происхождением и продолжением рода; возможная широта значения отмечена в сноске.
- source_word: יִצְחָק
  choice: Исаак
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: בֶּן אַבְרָהָם
  choice: сына Авраама
  rationale: Прямо и естественно передаёт родственное определение в форме приложения.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Естественное современное выражение, передающее здесь значение порождения потомка; оно избегает архаического «породил» и неестественного для современного русского употребления «родил» о мужчине.
- source_word: אֶת יִצְחָק
  choice: Исаака
  rationale: Показатель прямого дополнения отдельно не переводится; имя оформлено как прямое дополнение.
theological_decisions:
- issue: Передача формулы תּוֹלְדֹת в заголовках книги Бытия
  choice: родословие
  alternative: повествование; история рода; потомки
  rationale: «Родословие» сохраняет связь формулы с происхождением и родовой линией, не сводя заголовок исключительно к перечню потомков. Более широкие контекстуальные значения указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского заголовка. Формула краткая и ясная; двоеточие сохраняет тесную пояснительную связь двух частей стиха.
