base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: ru
  text: 'Вот сыновья Измаила, и вот их имена по их селениям и станам: двенадцать вождей своих народов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Вот
  rationale: Естественная русская формула предъявления и подведения итога после перечня; передаёт указательную конструкцию без ненужной связки.
- source_word: בְּנֵי יִשְׁמָעֵאל
  choice: сыновья Измаила
  rationale: В непосредственном контексте названы родные сыновья Измаила, поэтому буквальное и конкретное значение предпочтительнее более широкого «потомки».
- source_word: שְׁמֹתָם
  choice: их имена
  rationale: Прямой эквивалент существительного с местоименным суффиксом третьего лица множественного числа.
- source_word: בְּחַצְרֵיהֶם
  choice: по их селениям
  rationale: חָצֵר здесь обозначает селение или поселение. «По» естественно связывает названия с местами расселения и сохраняет возможное распределительное значение предлога בְּ.
- source_word: וּבְטִירֹתָם
  choice: и станам
  rationale: טִירָה может обозначать стан, лагерь или укреплённое поселение. «Станы» кратко передают полукочевой контекст и образуют естественную пару с «селениями».
- source_word: נְשִׂיאִם
  choice: вождей
  rationale: נָשִׂיא обозначает главу или предводителя группы. «Вождь» в родоплеменном контексте точнее современного русского «князь» и не привносит монархического оттенка.
- source_word: לְאֻמֹּתָם
  choice: своих народов
  rationale: אֻמָּה обозначает народ или этническую общность. Конструкция понимается как указание на народы, возглавляемые двенадцатью вождями; возвратное «своих» естественно выражает принадлежность в русском.
theological_decisions:
- issue: Связь לְאֻמֹּתָם с двенадцатью вождями
  choice: двенадцать вождей своих народов
  alternative: двенадцать вождей по их народам
  rationale: Русская формулировка передаёт соотнесённость каждого вождя с соответствующим народом, не уточняя сверх текста характер политической или родовой организации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён итоговый, перечислительный характер стиха. Устаревшие «князья» и канцелярское «согласно их народам» не использованы.
