  text: Когда ей пришло время рожать, и вот, в её утробе были близнецы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: Когда настало ей время рожать
  rationale: Еврейская идиома буквально говорит, что «исполнились её дни для родов». Русское «настало ей время рожать» естественно передаёт завершение срока беременности, не создавая архаичной или неясной конструкции.
- source_word: וְהִנֵּה
  choice: оказалось, что
  rationale: В данном повествовательном контексте частица вводит обнаружившийся при родах примечательный факт. «Оказалось, что» передаёт оттенок неожиданного выявления естественнее для современного русского языка, чем буквальное «вот».
- source_word: תוֹמִם
  choice: близнецы
  rationale: Форма обозначает близнецов; краткий русский эквивалент точен и понятен.
- source_word: בְּבִטְנָהּ
  choice: в её утробе
  rationale: Хотя בטן может означать живот или внутренность, контекст беременности требует естественного русского «утроба».
