  rationale: Личное имя в родословном перечне передано транслитерацией. Форма «Мишма» естественна для русской библейской традиции и достаточно точно отражает еврейское произношение.
- source_word: דוּמָה
  choice: Дума
  rationale: Личное имя передано принятой русской транслитерацией; конечная ה здесь обозначает гласный и не требует отдельной передачи буквой «х».
- source_word: מַשָּׂא
  choice: Масса
  rationale: В данном родословном контексте это личное или родовое имя, поэтому оно транслитерировано, а не переведено как нарицательное существительное «ноша» или «пророчество».
