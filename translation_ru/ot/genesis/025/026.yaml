  to: После этого вышел его брат, и его рука держалась за пяту Исава; поэтому его назвали Иаковом[a]. Исааку было шестьдесят лет, когда они родились.
  rationale: Правка делает явным, что за пяту держалась рука новорождённого, а не просто брат «держался рукой», и сохраняет связь между этим образом и наречением. «Поэтому» отражает повествовательную связь, выраженную союзом в оригинале и английском аудите, без добавления богословского вывода. Сноска приведена в соответствие с русской передачей имени и сохранена как осторожное лексическое пояснение.
