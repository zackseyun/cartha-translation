base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: ru
  text: После этого вышел его брат, и его рука держалась за пяту Исава; поэтому его назвали Иаковом[a]. Исааку было шестьдесят лет, когда они родились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Русское «Иаков» передаёт еврейское имя Яаков, созвучное слову «пята»; позднее в повествовании это имя также обыгрывается в связи с глаголом «обойти, вытеснить».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Передаёт последовательность событий непосредственно после рождения Исава и естественно звучит в современном русском повествовании.
- source_word: יָצָא אָחִיו
  choice: вышел его брат
  rationale: Сохраняет конкретный образ выхода из утробы; слово «брат» переведено без добавления подразумеваемого из контекста слова «близнец».
- source_word: וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו
  choice: державшийся рукой за пяту Исава
  rationale: Причастный оборот естественно передаёт сопутствующее действие и сохраняет ключевой образ пяты, связанный с последующим именованием.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: ему дали имя
  rationale: Естественная русская формула именования позволяет не уточнять действующее лицо, которое в данном контексте не названо явно.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Употреблена устоявшаяся русская библейская форма имени; связь еврейского имени со словом «пята» поясняется в сноске.
- source_word: וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה
  choice: Исааку было шестьдесят лет
  rationale: Идиоматически передаёт обычную древнееврейскую конструкцию обозначения возраста.
- source_word: בְּלֶדֶת אֹתָם
  choice: когда они родились
  rationale: Передаёт временное значение инфинитивной конструкции, не добавляя прямо не названного в этой фразе субъекта рождения.
theological_decisions:
- issue: Кто дал Иакову имя
  choice: Безличное «ему дали имя»
  alternative: «Он назвал его Иаковом» с подразумеваемым Исааком
  rationale: Глагол в еврейском тексте стоит в мужском роде единственного числа, но субъект непосредственно не назван. Безличная русская формула сохраняет эту неопределённость и не закрепляет толкование сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён наглядный образ выхода и держания за пяту; синтаксис упрощён без устранения смысловой связи между этим действием и именем.
