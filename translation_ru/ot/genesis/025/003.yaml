  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: ru
  text: Иокшан стал отцом Шевы и Дедана. Сыновьями Дедана были Ассурим[a], Летушим и Леуммим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, это названия родов или племён: Ассурим, Летушим и Леуммим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: Иокшан
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: יָלַד
  choice: стал отцом
  rationale: В родословном контексте естественно и точно передаёт мужское родительство, не используя архаичное «родил» или «породил».
- source_word: שְׁבָא
  choice: Шева
  rationale: Собственное имя передано принятой русской библейской формой.
- source_word: דְּדָן
  choice: Дедан
  rationale: Собственное имя передано принятой русской библейской формой.
- source_word: בְנֵי
  choice: сыновьями
  rationale: Сохраняет прямое значение древнееврейского мужского множественного числа, хотя в данном контексте названия могут обозначать роды или племена.
- source_word: הָיוּ
  choice: были
  rationale: Простая связка, вводящая перечень сыновей либо родовых групп.
- source_word: אַשּׁוּרִם
  choice: ашшуримы
  rationale: Вероятное название рода или племени; транслитерация сохраняет его как этноним и отражает удвоенный согласный еврейской формы.
- source_word: לְטוּשִׁים
  choice: летушимы
  rationale: Название рода или племени транслитерировано, поскольку его этимология недостаточно ясна для смыслового перевода.
- source_word: לְאֻמִּים
  choice: леуммимы
  rationale: В контексте это собственное название рода или народа; транслитерация не смешивает его с похожим нарицательным словом «народы».
theological_decisions:
- issue: Личные сыновья или названия родов
  choice: В основном тексте сохранено буквальное «сыновьями», а имена оформлены как этнонимы.
  alternative: «Потомками Дедана были роды ашшуримов, летушимов и леуммимов».
  rationale: Древнееврейское בְנֵי буквально означает «сыновья», но формы перечисленных названий допускают понимание как родовых или племенных имён. Сноска сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «стал отцом» ясна обычному читателю; этнонимы во множественном числе переданы со строчной буквы как названия народов или родовых групп.
