base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: ru
  text: Когда мальчики выросли, Исав стал искусным охотником, человеком поля[a], а Иаков — спокойным человеком[b], живущим в шатрах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человеком поля»; то есть человеком, чья жизнь проходила на открытой местности.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «цельный», «непорочный», «простодушный» или «безупречный» — в зависимости от контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: Когда мальчики выросли
  rationale: В данном контексте глагол обозначает взросление сыновей; «мальчики выросли» естественно передаёт переход к зрелости.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: искусным охотником
  rationale: Буквально сочетание говорит о человеке, знающем охоту; по-русски «искусный охотник» ясно передаёт опытность и умение.
- source_word: אִישׁ שָׂדֶה
  choice: человеком полей
  rationale: Формулировка сохраняет образ поля и противопоставление жизни Иакова в шатрах, не сужая значение до земледелия.
- source_word: אִישׁ תָּם
  choice: спокойным человеком
  rationale: В данном противопоставлении выражение может характеризовать тихий, не связанный с охотой образ жизни Иакова. Смысловая широта תָּם сохранена в примечании.
- source_word: יֹשֵׁב אֹהָלִים
  choice: живущим в шатрах
  rationale: Причастная конструкция обозначает характерный образ жизни; русский оборот звучит естественно и сохраняет множественное число «шатры».
theological_decisions:
- issue: Значение תָּם в характеристике Иакова
  choice: спокойный — как характеристика образа жизни, с примечанием о неоднозначности
  alternative: цельный; непорочный; простодушный; безупречный
  rationale: Контекст непосредственно сопоставляет охотника и человека полей с живущим в шатрах. Основной текст не превращает это слово в однозначную нравственную оценку, а примечание сохраняет возможные моральные и характерологические оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской выразительностью. Параллелизм характеристик братьев сохранён; неоднозначность תָּם не сведена к безусловной нравственной похвале.
