  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: ru
  text: Первый вышел красноватым[a], весь покрытый волосами, словно плащом[b], и назвали его Исавом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рыжеватый», «красный». Еврейское прилагательное описывает красноватую внешность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «весь он — словно плащ из волос». Еврейский текст сравнивает всё его тело с плащом или накидкой из волос.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и нарекли ему имя Исав» — обычная еврейская формула наречения имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Обычный глагол со значением «выходить» здесь описывает рождение; «вышел» сохраняет конкретный образ и естественно звучит по-русски.
- source_word: הָרִאשׁוֹן
  choice: первый
  rationale: Указывает на порядок рождения близнецов; краткое «первый» точно передаёт еврейский текст.
- source_word: אַדְמוֹנִי
  choice: красноватый
  rationale: Прилагательное обозначает красноватый оттенок внешности. «Красноватый» сохраняет оттеночное значение и не уточняет без основания, шла ли речь именно о коже или волосах.
- source_word: כֻּלּוֹ
  choice: весь
  rationale: Подчёркивает, что описание относится ко всему телу младенца.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: словно в плаще из волос
  rationale: Передаёт яркое сравнение с плащом или накидкой из волос, оставаясь понятным в современном русском. Добавление «в» делает образ естественным по-русски, не сводя его к простому пояснению «покрыт волосами».
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: назвали его
  rationale: Естественный русский эквивалент стандартной еврейской формулы наречения имени; буквальная структура отмечена в сноске.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Использована устоявшаяся русская библейская форма личного имени.
