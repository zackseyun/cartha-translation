revisions:
- from: 'И сказал ей Яхве: «Два народа — в твоём чреве, и два племени разделятся, выйдя из тебя. Один народ будет сильнее другого, и старший будет служить младшему[a]».'
  to: 'И сказал ей Яхве: «Два народа — в твоём чреве, и два народа произойдут от тебя и разделятся. Один народ будет сильнее другого, и старший будет служить младшему[a]».'
  rationale: Исправление заменяет сужающее «племени» на «народа» и устраняет возможное временно-причинное прочтение деепричастного оборота, сохраняя смысл происхождения двух народов от Ревекки и их последующего обособления. Финальная двусмысленность сохранена в сноске с правильной привязкой к «младшему».
