    issue: «Два племени» для שְׁנֵי לְאֻמִּים
    rationale: «Племя» в современном русском обычно обозначает более узкую родовую или этническую группу. לְאֻמִּים в параллели с גּוֹיִם означает народы/народности; «два народа» точнее передаёт масштаб референта.
  - severity: low
    issue: «Разделятся, выйдя из тебя»
    rationale: Деепричастный оборот может привязать разделение непосредственно к выходу из чрева. В еврейской фразе происхождение «из внутренностей твоих» и последующее разделение народов сообщаются как взаимосвязанные, но не обязательно одновременные предсказания.
