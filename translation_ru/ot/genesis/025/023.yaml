  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: ru
  text: 'И сказал ей Яхве: «Два народа — в твоём чреве, и два народа произойдут от тебя и разделятся. Один народ будет сильнее другого, и старший будет служить младшему[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «больший будет служить меньшему».'
    reason: Еврейские слова רַב и צָעִיר могут обозначать не только старшего и младшего по возрасту, но также большего и меньшего по положению или значимости.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: שְׁנֵי גיים
  choice: два народа
  rationale: גוי здесь обозначает этнополитические общности, которые произойдут от двух сыновей.
- source_word: בְּבִטְנֵךְ
  choice: в твоём чреве
  rationale: В контексте беременности בטן означает материнское чрево; это точное и уместное по стилю русское соответствие.
- source_word: שְׁנֵי לְאֻמִּים
  choice: два племени
  rationale: Так сохраняются и смысл параллельного обозначения двух этнических общностей, и лексическое отличие от גיים.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: разделятся, выйдя из тебя
  rationale: Передаёт исходное значение «из твоих внутренностей» естественно для современного русского и сохраняет мысль о последующем расхождении двух общностей.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: один народ будет сильнее другого
  rationale: Сравнительная русская конструкция естественно передаёт противопоставление двух народов и значение усиления или превосходства в силе.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: старший будет служить младшему
  rationale: В контексте близнецов רַב и צָעִיר естественно относятся к старшему и младшему, однако более буквальная статусная трактовка сохранена в сноске.
theological_decisions:
- issue: Значение רַב и צָעִיר в заключительной строке
  choice: старший будет служить младшему
  alternative: больший будет служить меньшему
  rationale: Контекст рождения близнецов поддерживает возрастное понимание, но еврейские прилагательные допускают также противопоставление по величию или положению; альтернативу не следует устранять.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Чрево» сохранено как понятное и стилистически уместное слово; синтаксис сделан ясным без устранения поэтического параллелизма.
