  source_fidelity: 'Первая часть точно передаёт два последовательных еврейских глагола смерти: גוע («испустить последний вздох») и מות («умер»). «В доброй старости» соответствует בְּשֵׂיבָה טוֹבָה; намеренный повтор характеристики возраста отражает זָקֵן. «Насыщенный жизнью» является допустимой русской идиоматической экспликацией שָׂבֵעַ, хотя существительное «жизнью» в оригинале не выражено и потому должно быть отмечено сноской. Формулу וַיֵּאָסֶף אֶל־עַמָּיו следует передавать без богословского уточнения.'
