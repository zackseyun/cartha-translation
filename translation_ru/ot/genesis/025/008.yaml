  text: И испустил Авраам последний вздох, и умер в доброй старости — старый и насыщенный жизнью[a], — и был собран к своему народу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «старый и насыщенный»; еврейский текст не называет прямо, чем именно он был насыщен — днями, жизнью или благами жизни.'
    reason: lexical_alternative
  - marker: b
    text: «Был собран к своему народу» — древнееврейская формула смерти. Она может подразумевать соединение с умершими родичами, однако сама по себе не уточняет, каким образом это происходит.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: испустил последний вздох
  rationale: Передаёт особый смысл глагола גוע в сообщениях о смерти и не сливает его со следующим וַיָּמָת.
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямой и общеупотребительный эквивалент стандартного еврейского глагола מות.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: в доброй старости
  rationale: Сохраняет и указание на преклонный возраст, и положительную оценку этой поры жизни.
- source_word: זָקֵן וְשָׂבֵעַ
  choice: старый и насыщенный жизнью
  rationale: Сохраняет нанизывание двух определений; добавление «жизнью» делает שָׂבֵעַ естественным и понятным по-русски, не сводя его однозначно к довольству или долголетию.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: и был приобщён к своему народу
  rationale: Пассивная конструкция и формульный характер выражения сохранены; перевод не уточняет, идёт ли речь о погребении, посмертном соединении с предками или о более общем образе смерти.
- source_word: עַמָּיו
  choice: своему народу
  rationale: Буквально сохраняет корпоративно-родственный смысл עַם и не сужает его до одних только предков или родственников.
theological_decisions:
- issue: Смысл формулы «был приобщён к своему народу»
  choice: Сохранить традиционную по смыслу формулу смерти, не уточняя её точного механизма.
  alternative: Передать как погребение в родовой гробнице либо как явное посмертное воссоединение с умершими предками.
  rationale: Само еврейское выражение допускает культурный и богословский подтекст, но данный стих не определяет его однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксический повтор «испустил… и умер» намеренно сохранён вслед за еврейским текстом; архаизм «приложился к народу своему» заменён более понятной, но всё ещё формульной пассивной конструкцией.
