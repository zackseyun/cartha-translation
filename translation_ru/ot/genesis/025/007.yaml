- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: сто семьдесят пять лет
  rationale: Аддитивное еврейское исчисление 100 + 70 + 5 естественно передаётся стандартной русской формой точного числа.
