    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: любил
  rationale: Форма повествовательного прошедшего времени от אָהַב означает любовь или устойчивую привязанность; русское «любил» естественно в данном контексте.
- source_word: אֶת עֵשָׂו
  choice: Исава
  rationale: Показатель прямого дополнения не переводится; имя передано в принятой русской библейской форме и поставлено в винительный падеж.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину особой привязанности Исаака.
- source_word: צַיִד בְּפִיו
  choice: дичь была ему по вкусу
  rationale: 'Буквально: «дичь была в его устах». Русское выражение «была ему по вкусу» сохраняет образ вкушения и естественно передаёт вероятный смысл: Исааку нравилась добытая Исавом дичь.'
- source_word: וְרִבְקָה
  choice: а Ревекка
  rationale: וְ формально соединяет части предложения, но здесь подчёркивает противопоставление родительских предпочтений; русское «а» передаёт его естественно.
- source_word: אֹהֶבֶת
  choice: любила
  rationale: Причастие выражает продолжающееся или характерное отношение; прошедшее несовершенного вида естественно передаёт это в повествовании.
- source_word: אֶת יַעֲקֹב
  choice: Иакова
  rationale: Показатель прямого дополнения не переводится; имя передано в принятой русской библейской форме и поставлено в винительный падеж.
