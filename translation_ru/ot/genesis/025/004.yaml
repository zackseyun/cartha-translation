  source_fidelity: 'Текст точно передаёт еврейскую родословную формулу: перечислены пять сыновей Мадиана и затем все они отнесены к сыновьям Хеттуры. «Сыновья» корректно сохраняет мужской и генеалогический смысл בְּנֵי. Опущение начального «и» допустимо в самостоятельном русском стихе, продолжающем перечень. Передачи имён Ефа, Ефер, Ханох, Авида, Елдага и Хеттура соответствуют еврейскому тексту и принятой русской библейской традиции; «Ханох» обоснованно отражает форму חֲנֹךְ.'
