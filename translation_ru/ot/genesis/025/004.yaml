base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: ru
  text: 'Сыновья Мадиана: Ефа, Ефер, Ханох[a], Авида и Елдага. Все они — сыновья Хеттуры.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Ханох»; то же еврейское имя в отношении других людей традиционно передаётся как «Енох».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Сыновья Мадиана
  rationale: Форма בְנֵי — сопряжённое множественное число от «сын»; в родословии точное «сыновья» предпочтительнее более общего «дети». Начальный союз естественно не выражен по-русски при продолжении перечня.
- source_word: עֵיפָה
  choice: Ефа
  rationale: Устоявшаяся русская библейская форма личного имени, соответствующая еврейскому עֵיפָה.
- source_word: וָעֵפֶר
  choice: Ефер
  rationale: Устоявшаяся русская передача личного имени עֵפֶר; присоединительный союз передан структурой перечисления.
- source_word: וַחֲנֹךְ
  choice: Ханох
  rationale: Передаёт еврейскую форму חֲנֹךְ и отличает этого человека от других носителей того же имени, традиционно называемых по-русски Енохом.
- source_word: וַאֲבִידָע
  choice: Авида
  rationale: Устоявшаяся русская форма имени אֲבִידָע.
- source_word: וְאֶלְדָּעָה
  choice: Елдага
  rationale: Устоявшаяся русская библейская форма имени אֶלְדָּעָה; союз перед последним элементом передан русским «и».
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественно подводит итог только что приведённому перечню, сохраняя собирательное значение еврейской фразы.
- source_word: בְּנֵי קְטוּרָה
  choice: сыновья Хеттуры
  rationale: Повтор слова «сыновья» сохраняет родословную формулу и прямое значение конструкции принадлежности.
