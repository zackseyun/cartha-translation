base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: ru
  text: И Иаков дал Исаву хлеб и чечевичную похлёбку[a]. Он поел, попил, встал и ушёл. Так Исав презрел право первородства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «похлёбку из чечевицы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отнёсся с презрением к праву первородства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: дал
  rationale: Обычное значение глагола точно передаёт простое повествование об обмене, не добавляя отсутствующих в еврейском тексте оттенков.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Хотя слово может обозначать пищу вообще, сочетание с похлёбкой указывает здесь на конкретное значение «хлеб».
- source_word: נְזִיד עֲדָשִׁים
  choice: чечевичную похлёбку
  rationale: Сочетание обозначает приготовленное блюдо из чечевицы; этот вариант естественен по-русски и сохраняет конкретность оригинала.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: поел, попил, встал и ушёл
  rationale: Краткая последовательность завершённых действий сохраняет быстрый повествовательный ритм еврейского текста; повтор союза перед каждым глаголом по-русски звучал бы тяжеловесно.
- source_word: וַיִּבֶז
  choice: презрел
  rationale: Глагол выражает сильное пренебрежение и презрение; «презрел» кратко и точно сохраняет нравственную оценку повествователя.
- source_word: הַבְּכֹרָה
  choice: право первородства
  rationale: Речь идёт не просто о старшинстве, а о семейно-правовом положении и связанных с ним преимуществах первенца.
theological_decisions:
- issue: Оценка отношения Исава к положению первенца
  choice: Так Исав презрел право первородства
  alternative: И Исав пренебрёг правом первородства
  rationale: Заключительная фраза подводит итог поступкам Исава. «Так» передаёт итогово-выводную связь, а «презрел» сохраняет сильную оценку וַיִּבֶז, не объясняя её сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным повествовательным ритмом. «Презрел» имеет несколько приподнятый, но понятный оттенок и соответствует силе еврейского глагола.
