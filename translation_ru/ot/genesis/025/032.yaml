lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартная повествовательная форма wayyiqtol от אמר; в естественном русском повествовании начальный союз обычно не передаётся.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию междометия и естественно звучит по-русски.
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение имеет оттенок акцента, который в русском достаточно выражен явным подлежащим и контекстом.
- source_word: הוֹלֵךְ לָמוּת
  choice: вот-вот умру
  rationale: Сочетание הלך с инфинитивом здесь указывает на приближение исхода, а не обязательно на буквальное движение; русский оборот передаёт заявленную близость смерти естественно и ясно.
- source_word: וְלָמָּה זֶּה לִי
  choice: к чему мне это
  rationale: Риторический вопрос выражает практическую бесполезность первородства для говорящего; формулировка сохраняет личный датив לִי и не утяжеляет русский текст.
- source_word: בְּכֹרָה
  choice: первородство
  rationale: Устоявшийся русский термин для статуса, прав и преимуществ первенца.
theological_decisions:
- issue: Характер слов Исава о близкой смерти
  choice: Передать его слова как утверждение о непосредственно грозящей смерти, не уточняя, буквально ли он умирал или преувеличивал.
  alternative: Понять слова либо как буквальное описание смертельного состояния, либо как гиперболическую жалобу из-за сильного голода.
  rationale: Древнееврейский текст сообщает лишь собственные слова Исава и не разрешает здесь вопрос об их буквальности; перевод сохраняет эту повествовательную и нравственную напряжённость.
translation_notes:
  register: Современный литературный русский язык; речь краткая и эмоциональная, без архаического «се». Формулировка «вот-вот умру» понятна широкому читателю и сохраняет ощущение близости смерти, а сноска показывает более буквальный образ исходного выражения.
