  text: 'Исав сказал: «Я ведь вот-вот умру[a]. К чему мне это первородство?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я умираю»; дословно: «я иду, чтобы умереть».'
