  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: ru
  text: Вот родословие Измаила[a], сына Авраама, которого родила Аврааму Агарь, египтянка, рабыня Сарры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вот родословие Измаила»; также возможно: «Вот потомки Измаила». Древнееврейское תּוֹלְדוֹת (толедо́т) — повторяющийся в книге Бытие заголовок, который может обозначать родословие, потомков или историю рода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служанка Сарры». Древнееврейское שִׁפְחָה означает зависимую женщину — рабыню или служанку; перевод «рабыня» яснее передаёт её несвободный статус.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: В формуле заголовка «вот» естественно вводит новый раздел и передаёт указательность אֵלֶּה; соединительная сила וְ в русском не требует отдельного «и».
- source_word: תֹּלְדֹת
  choice: родословие
  rationale: Сохраняет функцию повторяющегося в Бытии заголовка и охватывает как происхождение, так и линию потомков, не сужая значение только до списка потомков.
- source_word: יִשְׁמָעֵאל
  choice: Измаил
  rationale: Традиционная и общеупотребительная русская форма личного имени.
- source_word: בֶּן אַבְרָהָם
  choice: сына Авраама
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции в приложении.
- source_word: אֲשֶׁר יָלְדָה
  choice: которого родила
  rationale: Сохраняет Агарь как грамматический субъект женского рода и прямо обозначает материнство.
- source_word: הָגָר הַמִּצְרִית
  choice: Агарь, египтянка
  rationale: Передаёт имя в принятой русской форме и сохраняет указание на египетское происхождение Агари.
- source_word: שִׁפְחַת שָׂרָה
  choice: рабыня Сарры
  rationale: Слово שִׁפְחָה обозначает зависимую женщину-рабыню; «рабыня» яснее сохраняет её несвободный статус, чем смягчённое «служанка».
- source_word: לְאַבְרָהָם
  choice: Аврааму
  rationale: 'Дательный падеж естественно передаёт לְ в сочетании с глаголом рождения: Агарь родила ребёнка Аврааму.'
theological_decisions:
- issue: Социальный статус Агари в выражении שִׁפְחַת שָׂרָה
  choice: рабыня Сарры
  alternative: служанка Сарры
  rationale: Выбрано обозначение, сохраняющее реальную зависимость и несвободный статус Агари, без смягчения социального смысла исходного слова.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой генеалогического заголовка. Порядок приложений сохранён близко к древнееврейскому тексту, но оформлен естественно для русского синтаксиса.
