  text: Хадад, Тема, Иетур, Нафиш и Кедма.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַד
  choice: Хадад
  rationale: Личное имя передано транслитерацией непосредственно с еврейской согласной формы; вариант «Хадар» в данном тексте не принят.
- source_word: תֵימָא
  choice: Тема
  rationale: Имя передано по еврейскому произношению; конечный алеф не требует отдельной передачи в русском написании.
- source_word: יְטוּר
  choice: Иетур
  rationale: Транслитерация личного имени сохраняет начальный йод и форму, узнаваемую в русской библейской традиции.
- source_word: נָפִישׁ
  choice: Нафиш
  rationale: Имя транслитерировано с передачей פ как «ф» и שׁ как «ш».
- source_word: קֵדְמָה
  choice: Кедма
  rationale: Имя передано естественной русской транслитерацией; безударная гласная после ד не добавляется, поскольку шва здесь не требует самостоятельного русского гласного.
- source_word: וְ / וָ
  choice: и
  rationale: Союз в перечислении естественно передан по-русски запятыми и одним «и» перед последним именем.
