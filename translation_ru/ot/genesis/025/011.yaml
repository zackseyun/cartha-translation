  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: ru
  text: После смерти Авраама Бог благословил его сына Исаака, и Исаак жил у Беэр-Лахай-Рои[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Беэр-Лахай-Рои — название колодца; это древнееврейское название впервые встречается в Бытии 16:14.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: После смерти Авраама
  rationale: В русском повествовании отдельная передача формулы «и было» здесь звучала бы тяжеловесно; последовательность повествования естественно выражена начальным обстоятельством времени.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: после смерти Авраама
  rationale: Точно и естественно передаёт временную конструкцию.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: Бог благословил
  rationale: Прямое соответствие глаголу ברך и обычная передача אֱלֹהִים в данном повествовательном контексте.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: его сына Исаака
  rationale: Местоимение относится к Аврааму; русский порядок слов ясно обозначает Исаака как его сына, хотя ради естественности не воспроизводит еврейский порядок буквально.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: Глагол ישב здесь описывает проживание в определённом месте; «поселился» естественно передаёт переход к месту жительства в повествовательной последовательности.
- source_word: עִם
  choice: у
  rationale: Перед названием места предлог выражает близость; русское «у» естественно означает проживание возле названного колодца или местности.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Беэр-Лахай-Рои
  rationale: Устоявшаяся транслитерация составного древнееврейского топонима сохраняет связь с его первым упоминанием в Бытии 16:14.
theological_decisions:
- issue: Передача אֱלֹהִים в повествовательном утверждении о благословении Исаака
  choice: Бог
  alternative: Божество
  rationale: Контекст говорит о Боге Авраама без полемической или неоднозначной окраски; «Бог» — точная и нейтральная передача.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Начальная древнееврейская повествовательная формула передана естественной русской временной конструкцией; маркер сноски поставлен непосредственно после относящегося к ней топонима.
