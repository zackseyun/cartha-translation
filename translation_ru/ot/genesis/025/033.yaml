  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: ru
  text: 'Иаков сказал: «Поклянись мне сегодня[a]». Он поклялся ему и продал Иакову своё право первородства[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этот самый день»; возможно также: «с сегодняшнего дня».'
    reason: lexical_alternative
  - marker: b
    text: Право первородства — статус и права, принадлежавшие первородному сыну.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: Поклянись мне
  rationale: Повелительная форма глагола שבע выражает требование принести клятву, а לִּי указывает на того, кому её дают. Краткая формулировка естественна по-русски и сохраняет прямоту требования.
- source_word: כַּיּוֹם
  choice: сегодня
  rationale: Выражение имеет временное значение «сегодня, в этот день» и может подчёркивать немедленность или действие, вступающее в силу с этого дня; основной текст передаёт наиболее прямое значение, а примечание сохраняет возможные оттенки.
- source_word: וַיִּשָּׁבַע לֹו
  choice: Он поклялся ему
  rationale: Сохраняется глагольная связь с требованием Иакова и местоименная форма еврейского повествования без добавления имени, отсутствующего в стихе.
- source_word: וַיִּמְכֹּר
  choice: продал
  rationale: Глагол מכר прямо обозначает продажу и сохраняет характер сделки.
- source_word: בְּכֹרָתוֹ
  choice: своё право первородства
  rationale: בכרה обозначает принадлежавшие первенцу семейно-правовой статус и преимущества. «Право первородства» — ясный и устойчивый русский эквивалент; «своё» естественно передаёт притяжательный суффикс.
- source_word: לְיַעֲקֹב
  choice: Иакову
  rationale: Предлог ל отмечает получателя того, что было продано; русский дательный падеж передаёт это естественно.
theological_decisions:
- issue: Характер передачи בכרה Исавом
  choice: продал Иакову своё право первородства
  alternative: продал Иакову свои права первенца
  rationale: Формулировка передаёт конкретную сделку и отказ от положения и прав первенца, не добавляя позднейших богословских оценок поступка.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и достойное по тону. Прямая речь сохраняет настойчивость Иакова, а примечание к «сегодня» не устраняет смысловую неоднозначность временного выражения.
