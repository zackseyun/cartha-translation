  edition: WLC
  text: הַ/שָּׂדֶ֛ה אֲשֶׁר קָנָ֥ה אַבְרָהָ֖ם מֵ/אֵ֣ת בְּנֵי חֵ֑ת שָׁ֛מָּ/ה קֻבַּ֥ר אַבְרָהָ֖ם וְ/שָׂרָ֥ה אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/010.yaml
  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: ru
  text: поле, которое Авраам купил у сынов Хета[a], — там были похоронены Авраам и его жена Сарра[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у хеттов». Буквально по-еврейски: «у сынов Хета»; это родовое или этническое обозначение может относиться к хеттскому народу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «там был похоронен Авраам и Сарра, его жена». В еврейском тексте глагол стоит в единственном числе перед составным подлежащим.'
    reason: source_form
  - marker: c
    text: 'Или с иным членением: «поле, которое Авраам купил у сынов Хета. Там…»'
    reason: punctuation_alternative
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Определённое существительное обозначает ранее упомянутое поле, приобретённое как место погребения.
- source_word: אֲשֶׁר
  choice: которое
  rationale: Естественно вводит в русском языке определительное придаточное к слову «поле».
- source_word: קָנָה
  choice: купил
  rationale: В контексте сделки с землёй передаёт конкретное коммерческое значение глагола.
- source_word: מֵאֵת
  choice: у
  rationale: При глаголе «купил» русский предлог «у» естественно обозначает продавца и точно передаёт источник приобретения.
- source_word: בְּנֵי חֵת
  choice: сынов Хета
  rationale: Сохраняет буквальную родовую или этническую форму еврейского выражения и связь с личным именем Хет.
- source_word: שָׁמָּה
  choice: там
  rationale: Указывает на названное поле как место погребения.
- source_word: קֻבַּר
  choice: были похоронены
  rationale: Еврейская пассивная форма стоит в единственном числе перед составным подлежащим, что обычно для библейского иврита; русское множественное число ясно и естественно относит погребение к обоим лицам.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: и его жена Сарра
  rationale: Естественный современный русский порядок слов, точно сохраняющий указание на Сарру как жену Авраама.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной, dignified подачей. Тире перед «там» передаёт тематическую конструкцию исходного текста и не оставляет первую именную группу фрагментом. Буквальное «сынов Хета» сохранено в основном тексте, а общеупотребительное этническое обозначение вынесено в примечание.
