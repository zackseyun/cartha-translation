  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: ru
  text: 'Дети толкались внутри неё, и она сказала: «Если так, то почему я такая?»[a] И она пошла вопросить Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Почему я?» Еврейское выражение эллиптично; его также можно понять как: «Почему это со мной?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: толкались
  rationale: Возвратная порода передаёт взаимное и напряжённое движение детей. «Толкались» естественно по-русски выражает столкновение, не усиливая его до буквального «сокрушали друг друга».
- source_word: הַבָּנִים
  choice: дети
  rationale: Хотя слово может означать «сыновья», на данном этапе повествования речь идёт о ещё не родившихся детях; этот вариант естественен и не опережает уточнение следующего стиха.
- source_word: בְּקִרְבָּהּ
  choice: внутри неё
  rationale: Буквально — «в её внутренности / среди неё». Перевод сохраняет телесный смысл, не добавляя отсутствующего в самом выражении слова «утроба».
- source_word: אִם כֵּן
  choice: если так
  rationale: Краткая условная формула вводит мучительный вопрос Ревекки и естественно звучит в современной русской речи.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: зачем я такая?
  rationale: Еврейское выражение эллиптично и допускает несколько пониманий. Эта формулировка сохраняет связь с тяжёлым состоянием Ревекки, не превращая вопрос однозначно в философское сомнение о существовании.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: вопросить Яхве
  rationale: В данном контексте глагол означает обратиться к Богу за ответом или откровением. «Вопросить» точно и достойно передаёт это специальное значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл вопроса לָמָּה זֶּה אָנֹכִי
  choice: зачем я такая?
  alternative: зачем я живу?; почему это со мной?; зачем я?
  rationale: Синтаксис намеренно краток и неясен. Основной текст связывает вопрос с состоянием Ревекки, а сноска сохраняет более буквальную и экзистенциальную возможность, не утверждая её как единственную.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Вопросить» сохранено как точный глагол обращения за Божьим ответом; остальная фраза построена просто и понятно. Сноска отмечена в основном тексте.
