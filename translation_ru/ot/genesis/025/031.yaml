lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Форма wayyiqtol с союзом вав продолжает повествование; в естественном современном русском достаточно простого прошедшего времени.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מִכְרָה
  choice: продай
  rationale: Прямое соответствие повелительной форме глагола מכר; конечная ה здесь не требует отдельной передачи.
- source_word: כַיּוֹם
  choice: сегодня
  rationale: Контекстуально передаёт требование немедленной сделки; возможный оттенок юридически значимого «с этого дня» отмечен в сноске.
- source_word: אֶת
  choice: '[не переведено]'
  rationale: Показатель определённого прямого дополнения не имеет самостоятельного русского эквивалента.
- source_word: בְּכֹרָתְךָ
  choice: своё право первенца
  rationale: Слово обозначает статус и связанные с ним права первородного сына. Эта формулировка яснее для современного читателя, чем менее прозрачное «первородство».
- source_word: לִי
  choice: мне
  rationale: Дательный падеж естественно передаёт адресата сделки при русском глаголе «продать».
