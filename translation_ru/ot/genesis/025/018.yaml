  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: ru
  text: Они расселились от Хавилы до Шура, который находится напротив Египта, по дороге в Ашшур[a]. Он поселился напротив всех своих братьев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ашшур можно также передать как «Ассирия».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он пал перед лицом всех своих братьев». Выражение может указывать на место его расселения или подразумевать противостояние с братьями.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: они расселились
  rationale: Форма множественного числа от שׁכן обозначает проживание или поселение. «Расселились» естественно передаёт размещение потомков Измаила на указанной территории.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: от Хавилы до Шура
  rationale: Сохранена обычная формула, обозначающая протяжённость территории между двумя географическими пунктами.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: который находится напротив Египта
  rationale: עַל־פְּנֵי буквально означает положение «перед лицом» чего-либо; в географическом контексте «напротив» передаёт смысл, не уточняя без достаточных оснований сторону света.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: по дороге в Ашшур
  rationale: Конструкция обозначает движение по направлению к Ашшуру. Формулировка «по дороге в» естественна по-русски и сохраняет географическую направленность.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו
  choice: напротив всех своих братьев
  rationale: Выбрано пространственно нейтральное значение идиомы, чтобы не вводить в основной текст прямо не выраженную враждебность. Возможный оттенок противостояния отмечен в сноске.
- source_word: נָפָל
  choice: поселился
  rationale: Хотя обычное значение נפל — «падать», здесь в сочетании с географическим описанием глагол, вероятно, идиоматически указывает на расположение или поселение. Единственное число вновь представляет Измаила как родоначальника названных потомков.
theological_decisions:
- issue: Смысл выражения עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Он поселился напротив всех своих братьев
  alternative: 'Он жил в противостоянии со всеми своими братьями; буквально: он пал перед лицом всех своих братьев'
  rationale: Выражение допускает пространственное и враждебно-противительное понимание. Основной текст сохраняет менее интерпретирующее пространственное прочтение, а сноска сообщает о буквальной форме и возможном оттенке противостояния, созвучном Быт. 16:12.
translation_notes:
  register: 'Современный литературный русский язык, ясный и сдержанно возвышенный. Географические имена переданы традиционными библейскими формами. Необычная заключительная идиома не истолкована однозначно: естественный основной текст сопровождается сноской, сохраняющей буквальную форму и смысловую напряжённость.'
