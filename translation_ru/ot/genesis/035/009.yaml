  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: ru
  text: Бог снова явился Иакову[a], когда Иаков пришёл из Паддан-Арама, и благословил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог снова открыл Себя Иакову». Еврейский глагол может означать «явиться» или «стать видимым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה здесь обозначает явление, при котором Бог делает Себя видимым или явно обнаруживает Своё присутствие. «Явился» естественно и точно передаёт смысл, не уточняя способ явления.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Единственное число сказуемого и контекст показывают, что речь идёт об одном Боге.
- source_word: עוֹד
  choice: снова
  rationale: Наречие указывает на повторение прежнего Божьего явления Иакову.
- source_word: בְּבֹאוֹ
  choice: когда тот пришёл
  rationale: Предлог ב с инфинитивом и местоименным суффиксом имеет временное значение. Указательное местоимение «тот» естественно устраняет возможную двусмысленность между Богом и Иаковом.
- source_word: מִפַּדַּן אֲרָם
  choice: из Паддан-Арама
  rationale: Географическое название передано транслитерацией, а מִן — русским предлогом «из».
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: и благословил его
  rationale: Пиэль глагола ברך означает «благословлять». В русском языке подлежащее естественно остаётся невыраженным и однозначно относится к Богу.
theological_decisions:
- issue: Характер Божьего явления
  choice: «Бог снова явился Иакову»
  alternative: «Бог снова открыл Себя Иакову» или «Бог снова был видим Иакову»
  rationale: Формулировка сообщает о действительном Божьем явлении, но не определяет его способ и не сводит событие ни к внутреннему видению, ни к конкретной телесной форме.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Форма «Паддан-Арам» сохраняет традиционную узнаваемость топонима. Маркер сноски поставлен после всего стиха, поскольку примечание относится к сказуемому первой части.
