  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: ru
  text: Иаков поставил каменный столб над её могилой[a]. Это столб над могилой Рахили; он стоит по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «памятный камень»; или: «камень, отмечающий могилу Рахили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: поставил
  rationale: Каузативная форма глагола נצב означает «поставить, воздвигнуть». «Поставил» естественно сочетается с каменным столбом и не придаёт действию излишней торжественности.
- source_word: מַצֵּבָה
  choice: каменный столб
  rationale: Существительное обозначает поставленный вертикально камень или столб. Уточнение «каменный» передаёт конкретный образ и помогает избежать современного понимания обычной архитектурной колонны.
- source_word: עַל קְבֻרָתָהּ
  choice: над её могилой
  rationale: Предлог עַל выражает положение относительно места погребения; «над её могилой» естественно описывает установленный на месте захоронения знак.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: столб на могиле Рахили
  rationale: Цепочка сопряжённых существительных указывает на столб, связанный с могилой Рахили. Русское «на могиле» ясно передаёт эту связь, не превращая камень в более сложный монумент.
- source_word: עַד הַיּוֹם
  choice: и по сей день
  rationale: Устойчивое русское выражение естественно передаёт продолжение существования до времени рассказчика.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «По сей день» сохраняет традиционную формулу, оставаясь понятным современному читателю; конкретный образ стоящего камня передан без археологических или конфессиональных уточнений.
