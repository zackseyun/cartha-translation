  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: ru
  text: Иаков поставил на том месте, где Бог говорил с ним, столб — каменный столб; и возлил на него возлияние[a], и полил его маслом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть совершил на нём ритуальное излияние напитка.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: поставил
  rationale: Порода hифиль глагола נצב означает привести предмет в вертикальное положение; «поставил» естественно и конкретно передаёт действие.
- source_word: מַצֵּבָה
  choice: памятный камень
  rationale: В данном повествовательном контексте речь об установленном каменном знаке или монументе. «Памятный камень» понятно современному читателю и не создаёт образ архитектурной колонны; последующее «каменный столб» сохраняет форму уточняющего оборота.
- source_word: בַּמָּקוֹם
  choice: на том месте
  rationale: Русское «на том месте» естественно передаёт локативное בְּ и определённость существительного.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: где Бог говорил с ним
  rationale: Подлежащее в еврейской относительной конструкции подразумевается и из ближайшего контекста ясно, что это Бог. Его экспликация устраняет неестественную для русского языка местоименную двусмысленность, не меняя референта.
- source_word: מַצֶּבֶת אָבֶן
  choice: каменный столб
  rationale: Сопряжённое сочетание уточняет материал и характер поставленного предмета; «каменный столб» кратко и естественно передаёт это приложение.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: возлил ... возлияние
  rationale: Однокоренная русская ритуальная формула сохраняет figura etymologica оригинала и отличает культовое возлияние от последующего поливания маслом.
- source_word: וַיִּצֹק
  choice: полил
  rationale: Глагол описывает выливание масла на камень. «Полил» естественно передаёт конкретное действие и позволяет сохранить отличие от предыдущего ритуального глагола.
- source_word: שָׁמֶן
  choice: маслом
  rationale: Еврейский текст говорит просто о масле; уточнение «оливковым» было бы вероятным культурно, но не выраженным в стихе.
theological_decisions:
- issue: Значение действий Иакова с камнем, возлиянием и маслом
  choice: Передать действия описательно, не называя их освящением или посвящением.
  alternative: Истолковать их прямо как освящение памятного камня либо как установление мемориала в честь богоявления.
  rationale: Стих сообщает о ритуальных действиях, но не объясняет их богословский смысл; перевод не должен добавлять отсутствующую оценку.
- issue: Подлежащее глагола דִּבֶּר
  choice: Эксплицировать подразумеваемое подлежащее как «Бог».
  alternative: Сохранить буквальное местоименное выражение «где Он говорил с ним».
  rationale: Предшествующий контекст однозначно называет Бога, а два неуточнённых местоимения по-русски звучали бы неясно. Экспликация проясняет синтаксис, не разрешая реальной богословской неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Возлил» и «возлияние» сохранены как точные культовые термины, а остальная фраза построена просто и понятно. Маркер [a] помещён непосредственно после термина, требующего пояснения.
