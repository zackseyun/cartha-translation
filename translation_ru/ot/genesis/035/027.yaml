base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: ru
  text: И пришёл Иаков к своему отцу Исааку в Мамре, в Кириаф-Арбе (то есть Хевроне), где Авраам и Исаак жили как пришельцы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где Авраам и Исаак жили как чужеземцы». Еврейский глагол обозначает проживание в качестве пришельца, то есть не коренного жителя, а не просто жизнь в каком-либо месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычный повествовательный глагол от בוא; здесь естественно передаёт прибытие Иакова к месту пребывания Исаака.
- source_word: אָבִיו
  choice: к своему отцу
  rationale: Суффикс прямо указывает, что Исаак — отец Иакова; возвратное притяжательное местоимение естественно в современном русском.
- source_word: מַמְרֵא
  choice: Мамре
  rationale: Название места передано принятой русской библейской транслитерацией.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Кириаф-Арбу
  rationale: Топоним сохранён, а не переведён; форма поставлена в винительный падеж после подразумеваемого направления движения.
- source_word: הִוא חֶבְרוֹן
  choice: то есть Хеврон
  rationale: Естественно передаёт пояснительное отождествление Кириаф-Арбы с Хевроном.
- source_word: אֲשֶׁר
  choice: где
  rationale: Относительная частица вводит придаточное, относящееся к месту; «где» звучит естественно и точно.
- source_word: גָּר
  choice: жили как пришельцы
  rationale: Глагол גור обозначает проживание в качестве временного жителя или чужеземца, поэтому простое «жили» недостаточно передаёт его оттенок.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Авраам и Исаак
  rationale: Имена переданы в традиционной русской библейской форме.
