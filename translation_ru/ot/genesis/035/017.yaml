translation:
  language: ru
  text: 'Когда роды у неё стали тяжёлыми, повитуха сказала ей: «Не бойся, ведь у тебя будет ещё один сын».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: Когда роды у неё стали тяжёлыми
  rationale: Сочетание описывает наступившее осложнение или тяжесть родов. Русская формулировка естественно передаёт временную связь и трудность процесса, не вводя дополнительных медицинских подробностей.
- source_word: הַמְיַלֶּדֶת
  choice: повитуха
  rationale: Причастная форма обозначает женщину, помогающую при родах. «Повитуха» кратко и уместно для древнего повествования; более современное «акушерка» могло бы вызвать нежелательные ассоциации с профессиональной медициной.
- source_word: אַל תִּירְאִי
  choice: Не бойся
  rationale: Прямой и естественный русский запрет, точно передающий форму и утешительный характер обращения.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание для утешения. «Ведь» естественно связывает слова повитухи с предшествующим призывом не бояться.
- source_word: גַּם זֶה לָךְ בֵּן
  choice: и этот — твой сын
  rationale: «И этот» сохраняет добавочное значение גַּם и указание на рождающегося ребёнка; «твой сын» естественно передаёт дательную конструкцию לָךְ בֵּן без неидиоматичного буквализма.
