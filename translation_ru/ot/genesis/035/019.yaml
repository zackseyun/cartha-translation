lexical_decisions:
- source_word: וַתָּמָת
  choice: умерла
  rationale: Прямо передаёт физическую смерть, выраженную глаголом מות, без эвфемизма.
- source_word: רָחֵל
  choice: Рахиль
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: וַתִּקָּבֵר
  choice: была похоронена
  rationale: Передаёт страдательное значение нифаля от קבר; слово «там» в еврейском тексте отсутствует.
- source_word: בְּדֶרֶךְ
  choice: по дороге
  rationale: Естественно обозначает место на пути следования и хорошо соответствует повествовательному контексту.
- source_word: אֶפְרָתָה
  choice: в Ефрафу
  rationale: Форма с направительным ה указывает направление к Ефрафе; русская конструкция «по дороге в Ефрафу» естественно передаёт это значение.
- source_word: הִוא
  choice: ныне
  rationale: В данном отождествлении топонимов естественно по-русски поясняет, что Ефрафа известна как Вифлеем; само по себе местоимение буквально допускает «это» или «она».
- source_word: בֵּית לָחֶם
  choice: Вифлеем
  rationale: Устоявшаяся русская библейская форма географического названия.
