  - severity: medium
    issue: Некорректная формулировка сноски
    rationale: Сноска называет «Ефрафу» возможной передачей «Ефрафу», то есть дублирует форму и не сообщает содержательной лексической альтернативы. Альтернативой является «Ефрата».
