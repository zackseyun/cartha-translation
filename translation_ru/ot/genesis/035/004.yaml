base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: ru
  text: Тогда они отдали Иакову всех чужих богов, которые были у них в руках, и кольца, которые были у них в ушах[a]. Иаков спрятал всё это под теревинфом[b], который был близ Сихема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать кольца, которые носили как в ушах, так и в носу; здесь прямо сказано, что они были в ушах.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «под дубом». Еврейское слово, вероятнее всего, обозначает теревинф.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: Тогда они отдали Иакову
  rationale: Повествовательная форма продвигает действие; «тогда» естественно передаёт последовательность, а «отдали Иакову» точно выражает косвенный объект.
- source_word: כָּל־אֱלֹהֵי הַנֵּכָר
  choice: всех чужих богов
  rationale: Устойчивое и понятное обозначение божеств, чуждых поклонению Богу семьи Иакова; перевод не уточняет сверх текста, были ли это домашние идолы или иные культовые изображения.
- source_word: אֲשֶׁר בְּיָדָם
  choice: которые были у них в руках
  rationale: Сохранён конкретный еврейский образ, который здесь естественно понимается и как фактическое обладание предметами.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: кольца, которые были у них в ушах
  rationale: נְזָמִים может обозначать кольца, носимые в разных местах; последующая фраза прямо указывает на уши. Формулировка сохраняет локативный смысл и не добавляет отсутствующего в тексте «сняли».
- source_word: וַיִּטְמֹן אֹתָם
  choice: Иаков спрятал всё это
  rationale: טמן означает «прятать, скрывать», а в некоторых контекстах — «закапывать». Более широкое «спрятал» не навязывает способ сокрытия; «всё это» естественно объединяет перечисленные предметы.
- source_word: תַּחַת הָאֵלָה
  choice: под терпентинным деревом
  rationale: אֵלָה, вероятнее всего, обозначает терпентинное дерево (теревинф), а не дуб. Современное русское название понятнее формы «теревинф».
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: что близ Сихема
  rationale: При географическом названии עִם указывает на близость; «близ Сихема» кратко и естественно передаёт местоположение.
theological_decisions:
- issue: Характер отданных и спрятанных предметов
  choice: «Чужие боги» названы культовыми объектами, а кольца упомянуты отдельно без объяснения их религиозного значения.
  alternative: Считать кольца обычными украшениями либо прямо назвать их идолопоклонническими амулетами.
  rationale: Текст не сообщает, были ли кольца сами по себе амулетами или иными культовыми предметами. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Что близ Сихема» сохраняет достоинство повествования без архаизации; специальное название дерева пояснено сноской.
