  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: ru
  text: И пришёл Иаков в Луз (то есть Вефиль)[a], который находится в земле Ханаанской, вместе со всеми людьми, которые были с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст сохраняет как прежнее название места — «Луз», так и его более известное название — «Вефиль».
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Форма глагола בוא обозначает прибытие или приход к месту назначения; «пришёл» естественно передаёт последовательность повествования.
- source_word: לוּזָה
  choice: в Луз
  rationale: Направительное окончание при названии города выражает движение к нему; по-русски это передано предлогом «в» с винительным падежом.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: который находится в земле Ханаанской
  rationale: Относительное придаточное сохраняет географическое уточнение исходного текста; традиционная форма «земля Ханаанская» остаётся понятной современному читателю.
- source_word: הִוא בֵּית אֵל
  choice: то есть Вефиль
  rationale: Местоимение с названием места служит пояснительным отождествлением Луза с Вефилем; скобки ясно передают его вставной характер.
- source_word: הוּא וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: вместе со всеми людьми, бывшими с ним
  rationale: Еврейская конструкция буквально выделяет Иакова и всю сопровождавшую его группу. Русское «вместе со» естественно выражает совместное прибытие, а «людьми» не создаёт ненужного представления об отдельном народе или нации.
