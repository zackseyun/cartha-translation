  text: וַ/תָּ֤מָת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַ/תִּקָּבֵ֛ר מִ/תַּ֥חַת לְ/בֵֽית אֵ֖ל תַּ֣חַת הָֽ/אַלּ֑וֹן וַ/יִּקְרָ֥א שְׁמ֖/וֹ אַלּ֥וֹן בָּכֽוּת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: ru
  text: И умерла Девора, кормилица Ревекки, и была похоронена ниже Вефиля, под дубом[a]. И он назвал его Аллон-Бахут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אַלּוֹן может обозначать дуб или теревинф; точный вид дерева неизвестен.
    reason: lexical_alternative
  - marker: b
    text: Аллон-Бахут, вероятно, означает «Дуб плача»; если אַלּוֹן обозначает теревинф — «Теревинф плача».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: кормилица
  rationale: Слово обозначает женщину, которая вскормила ребёнка и заботилась о нём; «кормилица» точно и естественно передаёт эту роль по-русски.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: ниже Вефиля
  rationale: Сочетание указывает на место, расположенное ниже Вефиля; перевод сохраняет пространственный смысл, не превращая его без достаточных оснований в указание стороны света.
- source_word: תַּחַת הָאַלּוֹן
  choice: под дубом
  rationale: תַּחַת означает «под», а אַלּוֹן традиционно передаётся как «дуб», хотя точный вид дерева неясен; альтернатива отмечена в сноске.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: И он назвал его
  rationale: Глагол имеет форму 3-го лица мужского рода единственного числа, но подлежащее прямо не названо. Местоимение «его» естественно соотносится с упомянутым деревом либо местом, сохраняя некоторую референциальную неоднозначность.
- source_word: אַלּוֹן בָּכוּת
  choice: Аллон-Бахут
  rationale: Название транслитерировано в основном тексте; его прозрачное значение приведено в сноске.
- source_word: וַתִּקָּבֵר
  choice: была похоронена
  rationale: Нифаль передаёт страдательное значение и не называет тех, кто совершил погребение.
- source_word: וַתָּמָת
  choice: умерла
  rationale: Прямой эквивалент исходного глагола без эвфемистического смягчения.
theological_decisions:
- issue: Неуказанное подлежащее при וַיִּקְרָא
  choice: сохранить грамматически выраженное «он», не называя конкретного человека
  alternative: безличное «это место назвали»
  rationale: Исходный текст содержит глагол в 3-м лице мужского рода, однако не уточняет деятеля; перевод не отождествляет его с Иаковом без прямого основания.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской повествовательной простоты. Топоним בֵּית־אֵל передан в принятой русской форме «Вефиль», а название אַלּוֹן בָּכוּת — транслитерацией с пояснением значения в сноске.
