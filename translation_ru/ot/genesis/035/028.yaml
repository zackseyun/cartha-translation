  text: Дни жизни Исаака составили сто восемьдесят лет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с древнееврейского: «дни Исаака были сто восемьдесят лет»; слово «дни» здесь означает продолжительность жизни.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: составили
  rationale: В данном повествовательном контексте форма глагола היה вводит итоговую продолжительность жизни; «составили» естественно передаёт значение общего числа лет.
- source_word: יְמֵי
  choice: дни жизни
  rationale: Сочетание «дни Исаака» — древнееврейская идиома, обозначающая продолжительность жизни. «Дни жизни» сохраняет образ исходного текста и ясно передаёт его смысл по-русски.
- source_word: יִצְחָק
  choice: Исаака
  rationale: Использована традиционная русская форма библейского имени; родительный падеж обусловлен конструкцией «дни жизни Исаака».
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: сто восемьдесят лет
  rationale: Древнееврейская конструкция буквально сочетает «сто лет» и «восемьдесят лет» с существительным в единственном числе после числительных; по нормам современного русского языка итог передан как «сто восемьдесят лет».
- source_word: שָׁנָה
  choice: лет
  rationale: Форма родительного множественного числа требуется в русском языке после числительного «сто восемьдесят».
