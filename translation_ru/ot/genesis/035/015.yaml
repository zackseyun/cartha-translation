  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: ru
  text: И дал Иаков месту, где Бог говорил с ним, имя Вефиль[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вефиль означает «дом Бога».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: дал ... имя
  rationale: Еврейская конструкция буквально означает «назвал имя»; по-русски «дал имя» естественно передаёт акт наречения и сохраняет явное שֵׁם («имя»).
- source_word: הַמָּקוֹם
  choice: месту
  rationale: Форма дательного падежа обусловлена естественной русской конструкцией «дать месту имя» и точно передаёт значение «место».
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: где Бог говорил с ним
  rationale: Относительное сочетание אֲשֶׁר ... שָׁם естественно передаётся русским «где»; отдельное «там» не воспроизводится, поскольку по-русски создало бы ненужную тавтологию. אִתּוֹ передано как «с ним», а не «ему».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте форма обозначает единого Бога и синтаксически связана с глаголом в единственном числе.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Употреблена традиционная и узнаваемая русская форма библейского топонима; его смысл пояснён в сноске.
theological_decisions:
- issue: Число и значение אֱלֹהִים
  choice: Бог
  alternative: боги
  rationale: Глагол דִּבֶּר стоит в единственном числе, а повествовательный контекст указывает на Бога, явившегося Иакову; множественное прочтение здесь не соответствует синтаксису.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Еврейский идиоматический оборот перестроен в естественную русскую конструкцию без утраты слова «имя»; плеонастическое שָׁם не выделено отдельным «там».
