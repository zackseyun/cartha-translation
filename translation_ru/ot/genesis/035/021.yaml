lexical_decisions:
- source_word: וַיִּסַּע
  choice: отправился дальше
  rationale: Глагол נסע в последовательном повествовании обозначает снятие с места и продолжение пути; этот вариант естественно передаёт и движение, и его продолжение.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя, без замены на «Иаков».
- source_word: וַיֵּט
  choice: поставил
  rationale: В сочетании с «шатёр» глагол נטה означает разбить или поставить шатёр; «поставил» — ясный современный эквивалент.
- source_word: אָהֳלֹה
  choice: свой шатёр
  rationale: Существительное אֹהֶל с суффиксом третьего лица мужского рода единственного числа означает «его шатёр»; возвратное «свой» естественно по-русски при совпадении владельца с подлежащим.
- source_word: מֵהָלְאָה
  choice: за
  rationale: Наречие указывает на место дальше данного ориентира; перед названием ориентира русский предлог «за» кратко и естественно передаёт пространственное значение.
- source_word: לְמִגְדַּל עֵדֶר
  choice: Мигдал-Эдером
  rationale: Выражение здесь функционирует как географическое название, поэтому оно передано транслитерацией; буквальное значение сохранено в сноске.
