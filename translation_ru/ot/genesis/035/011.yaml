base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: ru
  text: 'И сказал ему Бог: «Я — Бог Всемогущий[a]. Плодись и размножайся. От тебя произойдут народ и собрание народов[b], и цари произойдут от тебя[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский титул: «Эль-Шаддай»; традиционно переводится «Бог Всемогущий», хотя точное значение слова «Шаддай» не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сообщество народов» или «множество народов». Еврейское выражение קְהַל גּוֹיִם может обозначать собравшуюся группу, сообщество или собрание народов.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «цари выйдут из твоих чресел», то есть будут твоими телесными потомками.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма употреблена с глаголом в единственном числе и в данном повествовательном контексте обозначает единого Бога Израиля.
- source_word: אֵל שַׁדַּי
  choice: Бог Всемогущий
  rationale: Традиционный смысловой перевод божественного титула; транслитерация сохранена в примечании из-за не вполне ясной этимологии שַׁדַּי.
- source_word: פְּרֵה וּרְבֵה
  choice: Плодись и размножайся
  rationale: Точно передаёт два повелительных глагола в единственном числе и сохраняет узнаваемую формулу благословения.
- source_word: גּוֹי
  choice: народ
  rationale: В контексте патриархального обетования слово обозначает народ как большую родственную и общественную общность; русское «народ» здесь естественнее современного политического термина «нация».
- source_word: קְהַל גּוֹיִם
  choice: множество народов
  rationale: Естественная русская передача группы или совокупности народов; более буквальный вариант «собрание народов» указан в примечании, чтобы сохранить диапазон значения קָהָל.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: от тебя произойдут
  rationale: Передаёт буквальное «будет от тебя» как обещание происхождения потомков и согласуется с нормами русского языка при составном подлежащем.
- source_word: מְלָכִים
  choice: цари
  rationale: Прямой и стилистически уместный эквивалент существительного.
- source_word: מֵחֲלָצֶיךָ יֵצֵאוּ
  choice: произойдут от тебя
  rationale: Естественно передаёт указание на телесное потомство; конкретный еврейский образ «выйдут из твоих чресел» сохранён в примечании.
theological_decisions:
- issue: Передача божественного титула אֵל שַׁדַּי
  choice: Бог Всемогущий
  alternative: Эль-Шаддай
  rationale: Смысловой перевод сохраняет торжественное самоименование и понятен современному читателю, а примечание указывает еврейскую форму и неопределённость точного значения титула.
- issue: Телесно-родовой образ в обещании о царях
  choice: цари произойдут от тебя
  alternative: цари выйдут из твоих чресел
  rationale: Основной текст ясно выражает физическое происхождение без архаичной русской анатомической идиомы; буквальный образ приведён в примечании и не устранён.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Устоявшаяся формула «плодись и размножайся» сохранена; архаизм «чресла» вынесен в пояснительное примечание.
