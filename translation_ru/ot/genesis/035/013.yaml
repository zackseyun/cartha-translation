  text: И Бог поднялся от него там, где говорил с ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознёсся от него». Еврейский текст сохраняет образ движения вверх при уходе Бога после этой встречи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: И поднялся
  rationale: Глагол עלה в породе каль обозначает движение вверх — «подняться, взойти». Перевод сохраняет конкретный пространственный образ ухода Бога и не сводит его к более общему «удалился».
- source_word: מֵעָלָיו
  choice: от него
  rationale: Сочетание буквально передаёт удаление «с него / от места над ним», однако по-русски такая буквальная конструкция здесь была бы неестественна. «От него» ясно обозначает уход Бога от Иакова.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, слово согласовано с глаголом в единственном числе и в данном контексте обозначает Бога.
- source_word: בַּמָּקוֹם
  choice: на том месте
  rationale: Предлог בְּ обозначает местонахождение; применительно к месту встречи естественное русское соответствие — «на том месте». Указательное «том» делает относительную конструкцию идиоматичной, не добавляя нового референта.
- source_word: אֲשֶׁר
  choice: где
  rationale: Относительная частица относится к слову «место», поэтому естественно передаётся наречием «где».
- source_word: דִּבֶּר אִתּוֹ
  choice: говорил с ним
  rationale: Пиэль דִּבֶּר с אֵת означает «говорить с кем-либо». Русский несовершенный вид естественно описывает состоявшийся разговор без необходимости вводить отсутствующую в древнееврейском плюсквамперфектную форму.
theological_decisions:
- issue: Пространственное, антропоморфное описание ухода Бога
  choice: 'Сохранено восходящее движение: «поднялся Бог от него»'
  alternative: «Бог удалился от него»
  rationale: Древнееврейский текст прямо использует обычный глагол восхождения. Пространственный образ сохраняет характер богоявления и не навязывает философского истолкования Божьего присутствия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов «поднялся Бог» сохраняет повествовательный акцент и остаётся естественным; местоимения не капитализированы, поскольку этого не требует исходный текст.
