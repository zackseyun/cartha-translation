source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: ru
  text: 'Тогда Иаков сказал своим домашним и всем, кто был с ним: «Уберите чужих богов[a], которые находятся среди вас, очиститесь[b] и смените одежду».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иноземных богов»; буквально также возможно: «богов чужеземца».'
    reason: lexical_alternative
  - marker: b
    text: Повеление «очиститесь» может подразумевать обрядовое очищение перед приближением к Богу.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: своим домашним
  rationale: Слово буквально означает «его дом», но здесь обозначает людей, составлявших домашнее сообщество Иакова; «домашним» естественно передаёт этот социальный смысл.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: всем, кто был с ним
  rationale: Оборот относится ко всем людям, сопровождавшим Иакова, и передан близко к структуре и смыслу еврейского текста.
- source_word: הָסִרוּ
  choice: уберите
  rationale: Повелительная форма требует удалить предметы чужого культа; «уберите» сохраняет прямоту приказа, не уточняя способ удаления.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: чужих богов
  rationale: Сочетание допускает значения «чужие боги», «боги чужеземца» или «иноземные боги». В данном контексте «чужих богов» естественно обозначает божеств, чуждых поклонению Богу Иакова, сохраняя исходную многозначность.
- source_word: בְּתֹכְכֶם
  choice: которые находятся среди вас
  rationale: 'Передача «среди вас» сохраняет широту выражения: речь может идти как о присутствии идолов в общине, так и об их нахождении во владении её членов.'
- source_word: וְהִטַּהֲרוּ
  choice: очиститесь
  rationale: Возвратная форма передаёт призыв к очищению; русское «очиститесь» сохраняет возможный ритуальный смысл, не делая его единственно возможным.
- source_word: וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם
  choice: смените одежду
  rationale: Глагол означает сменить или заменить, а существительное — одежду, вероятно верхнее платье; выбранная формулировка современна и точна.
theological_decisions:
- issue: Характер повеления об очищении
  choice: «очиститесь» — формулировка, сохраняющая возможное ритуальное и заветное значение
  alternative: «вымойтесь» или общее «приведите себя в чистоту»
  rationale: Контекст удаления идолов и подготовки к встрече с Богом позволяет видеть ритуальное очищение, однако сам стих не описывает конкретного обряда; перевод не уточняет сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Домашним» выбрано вместо буквального «дому», а «одежду» — вместо более книжного «одежды» или архаичного «ризы». Все повеления переданы прямо и последовательно.
