base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: ru
  text: И испустил Исаак дух, и умер, и был собран к своему народу[a], будучи стар и насыщен днями. И похоронили его сыновья его, Исав и Иаков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к своим предкам» / «к своим родичам». Это традиционная еврейская формула смерти; она может подразумевать больше, чем физическое погребение.'
    reason: Передаёт возможные лексические оттенки עַמָּיו и поясняет, не разрешая, смысловую неоднозначность формулы.
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: испустил дух
  rationale: Передаёт отдельный глагол גוע как естественную русскую формулу смерти и сохраняет его отличие от следующего וַיָּמָת («умер»).
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямой и обычный эквивалент מות, сохраняющий последовательность двух глаголов в еврейском тексте.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: приобщился к своему народу
  rationale: Сохраняет образ традиционной еврейской формулы и её неоднозначность, не сводя её только к погребению или к определённому представлению о посмертном состоянии.
- source_word: זָקֵן
  choice: стар
  rationale: Прямое прилагательное, естественное в возвышенном повествовательном контексте.
- source_word: וּשְׂבַע יָמִים
  choice: насыщен днями
  rationale: Сохраняет устойчивый патриархальный образ полноты прожитых дней, не упрощая его до указания лишь на преклонный возраст.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: похоронили его
  rationale: Ясный современный эквивалент глагола קבר.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: сыновья его, Исав и Иаков
  rationale: Сохраняет приложение и порядок имён исходного текста; постпозиция местоимения поддерживает достоинство библейского регистра.
theological_decisions:
- issue: Значение формулы וַיֵּאָסֶף אֶל־עַמָּיו
  choice: Образно передать как «приобщился к своему народу», не уточняя природу приобщения.
  alternative: «Был погребён с предками» или «соединился после смерти со своими предками».
  rationale: Формула может иметь семейный и посмертный смысл, причём она не тождественна последующему упоминанию погребения. Перевод не должен устранять эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Повторы союза «и» сохраняют последовательный ритм еврейского повествования; выражения «испустил дух» и «насыщен днями» понятны современному читателю, но сохраняют образность оригинала.
