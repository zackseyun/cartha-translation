base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: ru
  text: Там он построил жертвенник и назвал это место Эл-Бет-Эл[a], потому что там Бог открылся ему, когда он бежал от своего брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эл-Бет-Эл», вероятно, означает «Бог Бет-Эла».
    reason: Лексическое пояснение значения транслитерированного названия.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Там он построил жертвенник
  rationale: Обычная повествовательная форма глагола בנה и стандартное значение מִזְבֵּחַ переданы прямо и естественно; начальное «там» сохраняет порядок и пространственный акцент еврейского текста.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: и назвал это место
  rationale: В контексте наречения места קרא + לְ естественно передаётся русским «назвал»; указательное «это» соответствует нормам современного русского повествования.
- source_word: אֵל בֵּית אֵל
  choice: Эль-Бейт-Эль
  rationale: Выражение функционирует как данное месту имя, поэтому в основном тексте сохранено в транслитерации; вероятный смысл пояснён в сноске.
- source_word: כִּי שָׁם
  choice: потому что там
  rationale: כִּי вводит основание для такого названия; повтор שָׁם сохранён, как в оригинале.
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: Бог открылся ему
  rationale: Нифаль גלה обозначает явление или самооткровение. Русское «открылся» сохраняет оттенок божественного самообнаружения, а единственное число соответствует единому референту в контексте, несмотря на морфологическое множественное число глагола и אֱלֹהִים.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: когда он бежал от своего брата
  rationale: Инфинитивная конструкция с בְ передана естественным временным придаточным; מִפְּנֵי в контексте бегства означает удаление от брата.
theological_decisions:
- issue: Форма множественного числа אֱלֹהִים с глаголом נִגְלוּ при обозначении Бога Израиля
  choice: Бог открылся ему
  alternative: боги явились ему; Бог явился ему
  rationale: Контекст отсылает к встрече Иакова с единым Богом в Бейт-Эле, поэтому русское множественное число создало бы ложное впечатление политеизма. «Открылся» передаёт возможный оттенок самораскрытия, не превращая грамматическую особенность в отдельное богословское утверждение.
- issue: Перевод или транслитерация אֵל בֵּית אֵל
  choice: Эль-Бейт-Эль в основном тексте
  alternative: Бог Бейт-Эля
  rationale: Поскольку это имя, которое Иаков даёт месту, транслитерация сохраняет функцию собственного названия. Его вероятное значение сообщается в сноске без устранения некоторой синтаксической неоднозначности еврейской формы.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-торжественный. Синтаксис близок к еврейскому повествованию, но не калькирован; повтор «там» намеренно сохранён.
