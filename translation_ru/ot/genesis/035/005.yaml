base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: ru
  text: Они отправились в путь, и на окрестные города пал ужас от Бога[a], так что их жители не стали преследовать сыновей Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ужас Божий». Возможно также: «великий ужас».'
    reason: Сохраняет формальную конструкцию еврейского текста и менее вероятное усилительное понимание слова אֱלֹהִים.
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Они отправились в путь
  rationale: Глагол נסע в повествовательном контексте означает выступить в путь; формулировка естественна для современного русского языка и сохраняет значение начала движения.
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל
  choice: ужас от Бога охватил
  rationale: Сочетание היה с עַל передаёт наступившее состояние, а русское «охватил» естественно сочетается с «ужас». Конструкция «от Бога» передаёт наиболее вероятное указание на источник ужаса, не скрывая более буквального варианта в сноске.
- source_word: הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: окрестные города
  rationale: Кратко и естественно передаёт города, находившиеся вокруг путников; под городами по обычной метонимии подразумеваются их жители.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: так что никто не погнался за
  rationale: «Так что» ясно передаёт подразумеваемое следствие охватившего города ужаса. «Никто» естественно выражает отсутствие преследователей среди жителей упомянутых городов.
- source_word: בְּנֵי יַעֲקֹב
  choice: сыновьями Иакова
  rationale: Сохраняется прямо выраженное в еврейском тексте обозначение мужских потомков Иакова.
theological_decisions:
- issue: Значение конструкции חִתַּת אֱלֹהִים
  choice: ужас от Бога
  alternative: ужас Божий; великий ужас
  rationale: Контекст поддерживает понимание Бога как источника ужаса, защищающего семью Иакова. Вместе с тем конструкция допускает более формальное «ужас Божий», поэтому этот вариант указан в сноске. Значение אֱלֹהִים как усилителя («великий») возможно, но здесь менее вероятно.
- issue: Референт בְּנֵי יַעֲקֹב
  choice: сыновья Иакова
  alternative: дети Иакова
  rationale: Еврейское выражение имеет мужскую форму и в данном повествовательном контексте относится к сыновьям Иакова; нейтрализация рода была бы неоправданной.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повествовательная связность сохранена; тяжеловесное буквальное «города, которые вокруг них» передано естественным выражением «окрестные города».
