base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: ru
  text: 'И Бог сказал ему: «Имя твоё — Иаков. Тебя больше не будут называть Иаковом, а имя твоё будет Израиль». И он назвал его Израилем.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. буквально: «И назвал имя его Израиль»; то есть «И назвал его Израилем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму существительного, согласование и контекст ясно указывают на единого Бога.
- source_word: שִׁמְךָ
  choice: имя твоё
  rationale: Прямо передаёт существительное с суффиксом 2-го лица мужского рода; повтор сохранён там, где он естественен по-русски.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: тебя больше не будут называть
  rationale: Естественная русская передача страдательной формы глагола קרא в значении наречения именем и сочетания отрицания с עוֹד — «больше не».
- source_word: כִּי אִם
  choice: а
  rationale: 'Передаёт противопоставление и замену прежнего имени новым: не Иаков, а Израиль.'
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: имя твоё будет Израиль
  rationale: Сохраняет акцент исходного текста на новом имени и возвышенную, но понятную русскую формулировку.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: И Он назвал его Израилем
  rationale: Естественно передаёт еврейскую формулу наречения именем; прописная буква помогает ясно соотнести подлежащее с Богом в русском контексте.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
theological_decisions:
- issue: Не означает ли формула переименования полного исчезновения имени Иаков из дальнейшего повествования
  choice: Тебя больше не будут называть Иаковом, а имя твоё будет Израиль
  alternative: Отныне твоё имя не Иаков, а Израиль
  rationale: Перевод сохраняет категорическую силу Божьего объявления, не пытаясь согласовать её с тем, что далее повествование продолжает употреблять имя Иаков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизмы вроде «нарёк» оставлены только в примечании; основной текст остаётся ясным для обычного современного читателя.
