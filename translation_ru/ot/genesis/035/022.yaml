base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: ru
  text: Когда Израиль жил в той стране, Рувим пошёл и лёг с Валлой, наложницей своего отца, и Израиль услышал об этом.[a] У Иакова было двенадцать сыновей.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и Израиль услышал». Дополнение «об этом» прямо не выражено, но по смыслу относится к поступку Рувима.'
    reason: lexical_alternative
  - marker: b
    text: 'Ближе к порядку слов еврейского текста: «И сыновей Иакова было двенадцать». Эта фраза служит переходом к перечню сыновей в следующих стихах.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И случилось
  rationale: Обычная древнееврейская формула вводит новое событие. Такой перевод сохраняет повествовательную функцию, не прибегая к архаичному «и было».
- source_word: בִּשְׁכֹּן יִשְׂרָאֵל
  choice: когда Израиль жил
  rationale: Инфинитив с предлогом בְּ обозначает временное обстоятельство и фоновое, продолжающееся действие. «Когда … жил» естественно передаёт это по-русски.
- source_word: בָּאָרֶץ הַהִוא
  choice: в той земле
  rationale: В контексте אֶרֶץ означает местность или край, а не всю землю как мир.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Отдельный глагол сохранён, поскольку еврейский текст последовательно сообщает, что Рувим пошёл и лёг с Валлой.
- source_word: וַיִּשְׁכַּב אֶת
  choice: лёг с
  rationale: Это обычное древнееврейское обозначение половой связи. Русское «лёг с» прямо и сдержанно сохраняет образ исходного выражения.
- source_word: בִּלְהָה
  choice: Валла
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная русскоязычному читателю.
- source_word: פִּילֶגֶשׁ
  choice: наложница
  rationale: Точный и общеупотребительный термин для женщины, имевшей признанный, но более низкий семейный статус, чем жена.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: и Израиль услышал об этом
  rationale: В еврейском тексте объект глагола не назван, однако очевидно подразумевается поступок Рувима. «Об этом» делает русскую фразу естественной, не добавляя нового содержания.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Сыновей же у Иакова было двенадцать
  rationale: Фраза служит переходом к последующему перечню. Частица «же» естественно отмечает смену темы, а конструкция «у Иакова было» передаёт древнееврейское выражение принадлежности и числа.
theological_decisions:
- issue: Передача обозначения половой связи без смягчения или излишней конкретизации
  choice: лёг с
  alternative: спал с; вступил в половую связь с
  rationale: Выбранный оборот сохраняет прямоту и серьёзность древнееврейского выражения, не превращая его ни в разговорный эвфемизм, ни в клиническое пояснение.
- issue: Реакция Израиля на поступок Рувима
  choice: Сообщить только, что Израиль услышал об этом
  alternative: Добавить осуждение, гнев или последующие действия Израиля
  rationale: Исходный текст не сообщает здесь ни о чувствах Израиля, ни о его немедленной реакции, поэтому перевод не должен восполнять это молчание богословскими выводами.
- issue: Функция заключительного сообщения о двенадцати сыновьях
  choice: Передать его как переход к следующему перечню
  alternative: Связать число сыновей с нравственной оценкой поступка Рувима
  rationale: Формулировка текста даёт простое числовое сообщение и вводит перечень в следующих стихах; скрытое богословское объяснение не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для обычного читателя; сохранены повествовательная последовательность, прямота сообщения и переходный характер последней фразы. Все сноски отмечены в основном тексте.
