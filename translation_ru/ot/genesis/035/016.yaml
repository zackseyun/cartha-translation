base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: ru
  text: Затем они отправились из Вефиля. Когда до Ефрафы[a] оставалось ещё некоторое расстояние, Рахиль родила, и роды у неё проходили тяжело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также: «Ефрата».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: они отправились
  rationale: Глагол נסע в повествовательной последовательности обозначает снятие с места и продолжение пути; «отправились» естественно передаёт это значение по-русски.
- source_word: מִבֵּית אֵל
  choice: из Вефиля
  rationale: Использована укоренившаяся в русской библейской традиции форма названия места с нормативным склонением.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: оставалось ещё некоторое расстояние
  rationale: Редкое выражение указывает на остававшийся отрезок пути, но не позволяет установить точную меру; перевод сохраняет эту неопределённость.
- source_word: לָבוֹא אֶפְרָתָה
  choice: до Ефрафы
  rationale: Инфинитив с ל и направительная форма топонима обозначают ещё не достигнутую цель пути; русская конструкция естественно соединяется с указанием оставшегося расстояния.
- source_word: אֶפְרָתָה
  choice: Ефрафа
  rationale: Выбрана традиционная русская передача топонима; вариант «Ефрата» отмечен в сноске как возможная транслитерация.
- source_word: וַתֵּלֶד רָחֵל
  choice: Рахиль стала рожать
  rationale: Хотя ילד может обозначать рождение ребёнка как завершённое событие, ближайший контекст описывает продолжающиеся тяжёлые роды и слова повивальной бабки; «стала рожать» естественно передаёт начало процесса, не опережая дальнейшее повествование.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: роды у неё были тяжёлыми
  rationale: Фраза описывает тяжесть и осложнённость процесса родов без добавления не названных в тексте медицинских подробностей.
