base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: ru
  text: И землю, которую Я дал[a] Аврааму и Исааку, Я дам тебе; и твоему потомству[b] после тебя дам землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую Я уже даровал Аврааму и Исааку».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоему семени»; еврейское слово имеет собирательное значение и может обозначать потомство или потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте обетования патриархам אֶרֶץ обозначает конкретную обещанную землю; русское «землю» естественно и сохраняет определённость контекста.
- source_word: אֲשֶׁר
  choice: которую
  rationale: Русское относительное местоимение согласуется со словом «землю» и естественно вводит определительное придаточное.
- source_word: נָתַתִּי
  choice: Я дал
  rationale: Форма qatal указывает на предшествующее дарование Аврааму и Исааку. Простое прошедшее время сохраняет противопоставление последующим формам будущего времени.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: Аврааму и Исааку
  rationale: Дательный падеж точно передаёт повторённый еврейский предлог לְ; повтор предлога в русском грамматически не требуется.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: Я дам тебе
  rationale: Местоименный суффикс при глаголе относится к «земле», уже вынесенной в начало предложения; русская конструкция естественно сохраняет объект без лишнего местоименного повтора.
- source_word: זַרְעֲךָ
  choice: твоему потомству
  rationale: זֶרַע — собирательное существительное в единственном числе. «Потомство» сохраняет эту собирательность и звучит естественнее современного буквального «семени».
- source_word: אַחֲרֶיךָ
  choice: после тебя
  rationale: Буквальная временная формулировка естественна по-русски и указывает на последующие поколения.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: дам эту землю
  rationale: Повтор глагола «дать» и слова «земля» сохранён. Указательное «эту» естественно отсылает к уже названной земле, не меняя референции определённого артикля.
theological_decisions:
- issue: Соотношение прошлого и будущего дарования земли в обетовании патриархам
  choice: «Я дал» для נָתַתִּי и «Я дам… дам» для последующих глаголов
  alternative: Передать נָתַתִּי как «Я уже даровал», сильнее подчеркнув сохраняющуюся силу прежнего обетования
  rationale: Так сохраняется напряжение между уже совершённым Божьим дарованием Аврааму и Исааку и будущим осуществлением обетования для Иакова и его потомства; перевод не сводит эти временные планы в один.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «И землю… Я дам тебе» сохраняет вынесение объекта и акцент исходного текста; повтор «дам… землю» намеренно не устранён.
