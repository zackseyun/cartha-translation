base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: ru
  text: Встанем и поднимемся в Вефиль; там я устрою жертвенник Богу, который ответил мне[a] в день моей беды и был со мной на пути, по которому я шёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который отвечает мне» — еврейское причастие может описывать постоянное или повторяющееся действие Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: Встанем
  rationale: Когортатив первого лица множественного числа передаёт побуждение к совместному действию; «встанем» сохраняет образ подъёма и естественно звучит по-русски.
- source_word: וְנַעֲלֶה
  choice: и пойдём
  rationale: Глагол עלה буквально обозначает движение вверх, однако в данном сочетании естественное русское «пойдём в Вефиль» передаёт движение к месту назначения без неясного пространственного акцента.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Устоявшаяся русская форма географического названия; название не переводится как «Дом Бога».
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: и там я устрою жертвенник
  rationale: עשה имеет широкое значение «делать»; в сочетании с «жертвенник» глагол «устрою» близок к исходному смыслу и звучит естественнее буквального «сделаю».
- source_word: לָאֵל
  choice: Богу
  rationale: Предлог ל указывает на посвящение или адресата. Русская форма без отдельного определённого артикля естественно вводит уточняющее придаточное предложение.
- source_word: הָעֹנֶה אֹתִי
  choice: который ответил мне
  rationale: Причастие допускает характеристическое настоящее время, но контекст воспоминания о пережитой беде поддерживает прошедшее время; альтернативный оттенок сохранён в сноске.
- source_word: בְּיוֹם צָרָתִי
  choice: в день моей беды
  rationale: Сохраняется еврейская конструкция «в день» и личный характер постигшего Иакова бедствия.
- source_word: וַיְהִי עִמָּדִי
  choice: и был со мной
  rationale: Простое прошедшее время прямо передаёт повествовательную форму היה и утверждение о Божьем присутствии.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: в пути, которым я шёл
  rationale: Переданы конкретные образы דרך и הלך, при этом русская фраза остаётся ясной и литературной.
theological_decisions:
- issue: Определённость אֵל в речи Иакова
  choice: Богу, который…
  alternative: тому Богу, который…
  rationale: В русском языке определённость выражается уточняющим придаточным предложением. Вариант «тому Богу» сильнее подчёркивал бы противопоставление, которого контекст прямо не требует.
- issue: Временное значение причастия הָעֹנֶה
  choice: который ответил мне
  alternative: который отвечает мне
  rationale: Прошедшее время соответствует воспоминанию о конкретной помощи в беде, но еврейское причастие может также характеризовать Бога как того, кто отвечает; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис в основном сохраняет последовательность еврейского текста, но избегает неестественных калек.
