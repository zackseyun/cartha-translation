  terminology: «Вефиль», «жертвенник» и «Богу» уместны. «Богу, который…» достаточно передаёт определённость еврейского לָאֵל без неестественного для русского артиклевого калькирования. Сноска корректно отмечает возможное обобщённо-настоящее значение еврейского причастия.
