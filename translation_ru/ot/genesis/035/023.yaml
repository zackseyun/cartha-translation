  yaml_path: translation/ot/genesis/035/023.yaml
  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ru
  text: 'Сыновья Лии: первенец Иакова[a] — Рувим, Симеон, Левий, Иуда, Иссахар и Завулон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «первенец Иакова, Рувим».'
    reason: Поясняет приложение и сохраняет исходный порядок слов, тогда как тире в основном тексте делает связь с именем ясной по-русски.
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: Сыновья Лии
  rationale: Форма сопряжённого состояния вводит перечень шести сыновей Лии; «сыновья» здесь точнее общего «дети».
- source_word: בְּכֹר יַעֲקֹב
  choice: первенец Иакова
  rationale: Сохранено прямое значение «первенец», а не более толковательное «старший сын»; выражение относится к Рувиму.
- source_word: רְאוּבֵן וְשִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וּזְבוּלֻן
  choice: Рувим, Симеон, Левий, Иуда, Иссахар и Завулон
  rationale: Использованы традиционные и общеупотребительные русские формы библейских имён. Повторяющийся еврейский союз передан естественным для современного русского перечислением с союзом перед последним именем.
