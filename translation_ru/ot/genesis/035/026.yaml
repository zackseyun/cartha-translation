base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: ru
  text: 'А сыновья Зелфы[a], служанки Лии: Гад и Асир[b]. Это сыновья Иакова, которые родились ему в Паддан-Араме.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово можно также передать как «рабыня»; оно обозначает служанку, положение которой могло быть несвободным.
    reason: lexical_alternative
  - marker: b
    text: Хотя здесь сказано, что сыновья Иакова родились ему в Паддан-Араме, Вениамин, согласно ст. 16–18, родился позднее в Ханаане. Текст не поясняет это расхождение.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: А сыновья
  rationale: Существительное בֵּן здесь употреблено во множественном числе в родословном перечне и прямо означает «сыновья»; союз естественно продолжает предыдущий список.
- source_word: זִלְפָּה
  choice: Зелфа
  rationale: Использована укоренившаяся в русской библейской традиции форма личного имени.
- source_word: שִׁפְחַת
  choice: служанки
  rationale: Слово обозначает женщину-служанку, чьё положение могло быть несвободным. «Служанка» естественно звучит по-русски, а примечание сохраняет более резкую социальную окраску возможного перевода.
- source_word: לֵאָה
  choice: Лии
  rationale: Родительный падеж естественно передаёт древнееврейскую сопряжённую конструкцию «служанка Лии».
- source_word: גָּד וְאָשֵׁר
  choice: Гад и Асир
  rationale: Использованы традиционные русские формы личных имён.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: Это сыновья Иакова
  rationale: Прямая и естественная передача указательного местоимения и именной конструкции; «сыновья» сохраняет мужской род исходного слова.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: которые родились у него
  rationale: Пассивная форма с местоименным дополнением передана без добавления не названной в исходном тексте матери.
- source_word: בְּפַדַּן אֲרָם
  choice: в Паддан-Араме
  rationale: Топоним передан транслитерацией и оформлен в соответствии с нормами русского склонения.
theological_decisions:
- issue: Утверждение, что перечисленные сыновья родились в Паддан-Араме, при рождении Вениамина в Ханаане
  choice: Сохранить буквальное обобщение стиха и отметить напряжение в сноске
  alternative: Переформулировать географическое указание так, чтобы явно исключить Вениамина
  rationale: Исходный текст формально относит высказывание ко всему перечню сыновей Иакова, хотя ближайший контекст сообщает о рождении Вениамина в Ханаане. Перевод не должен молча устранять это текстовое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционные русские формы имён; синтаксис сделан ясным и естественным без устранения неоднозначности исходного обобщения.
