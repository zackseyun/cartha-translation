id: GEN.35.1
reference: Genesis 35:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: ru
  text: 'Тогда Бог сказал Иакову: «Встань, поднимись в Вефиль, поселись там и устрой там жертвенник Богу, который явился тебе, когда ты бежал от своего брата Исава[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица Исава, твоего брата»; то есть спасаясь от Исава.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, единственное число сказуемого и контекст указывают на единого Бога.
- source_word: קוּם
  choice: Встань
  rationale: Прямой и естественный русский эквивалент повелительной формы со значением подняться и приступить к действию.
- source_word: עֲלֵה
  choice: поднимись
  rationale: Сохраняет направительное и высотное значение глагола, указывающего на движение в Вефиль.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Устоявшаяся русская библейская передача географического названия; его значение «дом Бога» не подменяет топоним в основном тексте.
- source_word: וְשֶׁב שָׁם
  choice: и поселись там
  rationale: В данном повелении ישב обозначает пребывание или жительство; «поселись» звучит современно и точнее, чем буквальное «сиди».
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: Устрой там жертвенник
  rationale: עשה буквально значит «сделать», но в сочетании с жертвенником русское «устроить» естественно передаёт сооружение жертвенника, не сужая глагол до конкретной техники строительства.
- source_word: לָאֵל
  choice: Богу
  rationale: Дательный падеж естественно передаёт посвящение и адресат жертвенника; определённость раскрывается последующим придаточным.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: Который явился тебе
  rationale: Нифаль глагола ראה в контексте богоявления естественно означает «явился».
- source_word: בְּבָרְחֲךָ
  choice: когда ты бежал
  rationale: Инфинитивная конструкция с ב выражает временное обстоятельство.
- source_word: מִפְּנֵי
  choice: от
  rationale: Хотя выражение буквально связано с «лицом/присутствием», здесь это обычная еврейская идиома удаления и бегства от человека; русское «от» точно и естественно передаёт смысл.
- source_word: עֵשָׂו אָחִיךָ
  choice: от своего брата Исава
  rationale: Русский порядок слов и возвратное притяжательное местоимение ясно показывают родство Исава с Иаковом.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים
  choice: Единого Бога, говорящего с Иаковом
  alternative: «боги»
  rationale: Единственное число глагола и повествовательный контекст однозначно указывают на Бога Израиля.
- issue: Передача לָאֵל с определяющим причастным оборотом
  choice: «Богу, Который явился тебе»
  alternative: «тому Богу, Который явился тебе»
  rationale: Русское «Богу, Который...» сохраняет определённую референцию без неуместного оттенка выбора одного бога среди нескольких.
- issue: Передача названия בֵּית אֵל
  choice: Вефиль
  alternative: Дом Бога
  rationale: В стихе это географическое название; перевод его значения вместо транслитерации мог бы ошибочно превратить топоним в нарицательное обозначение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формы «встань», «поднимись», «поселись» сохраняют последовательность повелений; фраза разделена на два предложения внутри прямой речи ради естественного русского ритма. Буквальное «от лица Исава» не использовано, поскольку по-русски оно не передаёт здесь обычного смысла еврейской идиомы.
