base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: ru
  text: 'И сыновья Валлы[a], служанки Рахили: Дан и Неффалим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «рабыни Рахили». Древнееврейское слово обозначает женщину-служанку низшего социального положения и в некоторых контекстах может подразумевать рабский статус.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Сочетание сохраняет присоединительный союз и структуру генеалогического перечня; בְנֵי здесь обозначает именно сыновей.
- source_word: בִלְהָה
  choice: Валлы
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; родительный падеж обусловлен конструкцией «сыновья Валлы».
- source_word: שִׁפְחַת
  choice: служанки
  rationale: Современное и ясное обозначение женщины зависимого, низшего социального положения; возможный оттенок рабского статуса отмечен в сноске.
- source_word: רָחֵל
  choice: Рахили
  rationale: Традиционная русская форма имени в родительном падеже естественно передаёт древнееврейское сопряжённое сочетание.
- source_word: דָּן
  choice: Дан
  rationale: Закрепившаяся русская библейская форма личного имени.
- source_word: וְ/נַפְתָּלִי
  choice: и Неффалим
  rationale: Союз передан явно; использована закрепившаяся русская библейская форма имени.
