source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: ru
  text: И когда жизнь покидала её — потому что она умирала, — она нарекла ему имя Бен-Они[a], но отец назвал его Вениамин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бен-Они, вероятно, означает «сын моей скорби» или «сын моего страдания».
    reason: lexical_alternative
  - marker: b
    text: Вениамин, вероятно, означает «сын правой руки»; возможно также понимание «сын юга».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: когда жизнь покидала её
  rationale: נֶפֶשׁ здесь естественно означает жизнь, покидающую умирающую Рахиль; такой перевод не вносит в текст более узкого антропологического смысла слова «душа». Конструкция с בְּ и инфинитивом передана как одновременное действие.
- source_word: כִּי מֵתָה
  choice: потому что она умирала
  rationale: Пояснительная частица כִּי и форма מֵתָה в контексте описывают происходящее в момент наречения имени; несовершенный по виду русский глагол естественно передаёт одновременность.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: она нарекла ему имя
  rationale: Сохраняется еврейская формула наречения имени, но в понятном современном русском литературном выражении.
- source_word: בֶּן אוֹנִי
  choice: Бен-Они
  rationale: Имя передано транслитерацией, а его вероятное смысловое значение вынесено в примечание, поскольку оно существенно для повествования.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: но отец назвал его
  rationale: Союз וְ передан противительным «но», поскольку имя, данное отцом, противопоставлено имени, данному матерью.
- source_word: בִנְיָמִין
  choice: Вениамин
  rationale: Использована укоренившаяся русская форма библейского имени; возможные значения еврейского имени приведены в примечании.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ при описании смерти
  choice: В основном тексте переведено как «жизнь»
  alternative: «душа»
  rationale: В данном контексте נֶפֶשׁ может обозначать жизнь или живое существо, и текст не требует узкого утверждения о нематериальной душе, отделяющейся от тела. «Жизнь» сохраняет повествовательный смысл и богословскую открытость выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Нарекла ему имя» сохраняет формальность еврейской формулы, тогда как «назвал его» во второй части звучит естественно и ясно. Тире выделяют пояснение о её смерти.
