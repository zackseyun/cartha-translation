translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов слегка перестроен ради ясности: имя поставлено непосредственно после глагола называния, при этом обе определительные части исходного текста сохранены без устранения их смыслового повтора.'
