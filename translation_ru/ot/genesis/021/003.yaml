  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: ru
  text: Авраам назвал Исааком своего сына, который родился у него и которого родила ему Сарра.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם
  choice: назвал
  rationale: Сочетание קרא со словом שֵׁם означает «дать имя, назвать». Русское «назвал» естественно передаёт весь оборот, тогда как буквальное «назвал имя» здесь звучало бы неестественно.
- source_word: בְּנוֹ
  choice: своего сына
  rationale: Суффикс указывает на сына Авраама; возвратное притяжательное местоимение «своего» соответствует нормам русского языка при подлежащем «Авраам».
- source_word: הַנּוֹלַד לוֹ
  choice: который родился у него
  rationale: Сохранены и пассивно-результативное значение причастия, и дательный компонент לוֹ, выражающий отношение ребёнка к Аврааму.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: которого родила ему Сарра
  rationale: Относительное придаточное прямо называет Сарру матерью и сохраняет повторное לוֹ — «ему», подчёркивающее, что сына родила Аврааму Сарра.
- source_word: יִצְחָק
  choice: Исааком
  rationale: Использована традиционная русская форма имени «Исаак»; творительный падеж требуется русской конструкцией «назвал кого кем».
