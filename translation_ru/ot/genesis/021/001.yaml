base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: ru
  text: И Яхве позаботился о Сарре[a], как сказал, и Яхве сделал для Сарры, как говорил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посетил Сарру». Еврейский глагол может означать, что Бог обращает на человека внимание, чтобы действовать ему во благо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, соответствующее тетраграмматону יהוה; повтор имени в обеих частях стиха сохранён.
- source_word: פָּקַד
  choice: позаботился о
  rationale: В данном контексте глагол обозначает, что Бог обратил на Сарру действенное внимание и исполнил обещанное ей. Такой перевод естественен по-русски и не создаёт впечатления обычного пространственного посещения; более буквальная альтернатива отмечена в сноске.
- source_word: כַּאֲשֶׁר אָמָר
  choice: как сказал
  rationale: Формулировка отсылает к ранее данному слову Бога и сохраняет простой глагол אָמַר без поясняющего добавления «обещал».
- source_word: וַיַּעַשׂ יְהוָה לְשָׂרָה
  choice: и Яхве сделал для Сарры
  rationale: Сохранены общий смысл глагола עשה, благотворное значение предлога ל и повтор божественного имени; слово «так» добавлено далее для естественного русского синтаксиса.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: так, как говорил
  rationale: Сохранено стилистическое различие между אָמַר («сказал») и דִּבֵּר («говорил»), без сужения значения до «обещал».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер действия, выраженного פקד
  choice: действенная забота Бога о Сарре
  alternative: простое посещение Сарры
  rationale: В контексте исполнения обещания и последующего зачатия речь идёт не просто о прибытии, а о внимании Бога, которое приводит к действию на благо Сарры; при этом образная буквальная возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «И» передаёт повествовательную связь וַ־; повтор имени «Яхве» и параллелизм двух частей сохранены, а формулировка не уточняет заранее результат Божьего действия, раскрываемый в следующем стихе.
