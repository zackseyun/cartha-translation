  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: ru
  text: 'И сказала она: «Кто бы сказал Аврааму, что Сарра будет кормить детей грудью?[a] Ведь я родила сына в его старости».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновей». Здесь множественное число употреблено в обобщённом выражении о кормлении детей; в следующей фразе конкретный ребёнок назван сыном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала она
  rationale: Передаёт обычное повествовательное продвижение формы wayyiqtol и сохраняет естественную связь с предыдущим контекстом.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Кто бы сказал Аврааму
  rationale: Условное «кто бы сказал» естественно выражает риторическое изумление Сарры перед неожиданным исходом, не превращая фразу в простой вопрос о прошлом сообщении.
- source_word: הֵינִיקָה
  choice: будет кормить грудью
  rationale: Hiphil глагола ינק означает давать грудь, кормить грудью; выбран современный и ясный русский оборот.
- source_word: בָנִים
  choice: детей
  rationale: Формально это множественное «сыновей», однако при глаголе кормления форма имеет обобщённый идиоматический смысл; «детей» естественно по-русски, а пол конкретного ребёнка прямо указан далее словом «сына».
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего изумлённого высказывания; «ведь» сохраняет объяснительно-эмфатическую связь, не внося противопоставления.
- source_word: יָלַדְתִּי בֵן
  choice: я родила сына
  rationale: Прямой, естественный и точный русский эквивалент совершенного действия и существительного בן.
- source_word: לִזְקֻנָיו
  choice: в его старости
  rationale: Идиоматично передаёт отношение события к преклонному возрасту Авраама.
