lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Аврааму
  rationale: Союз וְ здесь продолжает повествование и в русском может естественно не передаваться отдельно; дательная конструкция «Аврааму было» идиоматично выражает возраст.
- source_word: בֶּן מְאַת שָׁנָה
  choice: было сто лет
  rationale: Буквальное «сын ста лет» является древнееврейским обозначением возраста; современный русский эквивалент — «было сто лет».
- source_word: בְּ/הִוָּלֶד
  choice: когда ... родился
  rationale: 'Предлог בְּ с инфинитивом породы нифаль выражает время и сохраняет значение рождения: «когда ... родился».'
- source_word: ל֔/וֹ
  choice: у него
  rationale: В русском выражение «у него родился» естественно передаёт значение того, кому был рождён сын.
- source_word: אֵת יִצְחָק
  choice: Исаак
  rationale: אֵת является показателем прямого дополнения и отдельно не переводится; имя передано в принятой русской библейской форме.
- source_word: בְּנֽ/וֹ
  choice: его сын
  rationale: Местоименный суффикс указывает на родство Исаака с Авраамом; сохранено приложение «его сын» без добавочного усиления.
