  text: And Abraham said[a], “I swear it.”
translation:
  language: ru
  text: 'И Авраам сказал: «Я поклянусь»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я клянусь»; или: «Я дам клятву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И … сказал
  rationale: Форма с повествовательным וַ последовательно продвигает рассказ; «И … сказал» естественно сохраняет простую связь с предыдущей репликой.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Использована традиционная русская форма библейского имени.
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение явно называет и несколько выделяет говорящего; в русском «я» перед личной формой глагола достаточно передаёт эту явность без неуместного усиления «я сам».
- source_word: אִשָּׁבֵעַ
  choice: клянусь
  rationale: Нифаль глагола שבע означает «клясться, давать клятву». В ответе на требование Авимелеха настоящее «клянусь» естественно звучит как непосредственное принятие клятвы; возможна также передача будущим временем или описательным оборотом.
