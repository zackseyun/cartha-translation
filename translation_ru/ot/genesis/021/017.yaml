base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: ru
  text: 'И услышал Бог голос мальчика[a], и ангел Божий воззвал с небес к Агари и сказал ей: «Что с тобой, Агарь? Не бойся, потому что Бог услышал голос мальчика там, где он находится».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плач мальчика»; еврейское слово, переведённое как «голос», может обозначать слышимый крик или плач бедствующего человека. То же относится ко второму употреблению этого слова в стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: И услышал Бог
  rationale: Глагол שׁמע в qal обычно означает «слышать». Формулировка сохраняет повествовательную последовательность и не добавляет смысла «ответил».
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: голос мальчика
  rationale: קוֹל буквально означает «голос, звук» и здесь может обозначать плач или крик бедствия. «Голос» сохраняет лексическую точность и повтор в стихе; контекстуальная альтернатива дана в сноске.
- source_word: הַנַּעַר
  choice: мальчика
  rationale: נַעַר обозначает здесь юного Измаила. «Мальчик» естественно для современного русского языка и не архаизирует текст.
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: И Ангел Божий воззвал
  rationale: «Ангел Божий» прямо передаёт конструкцию מַלְאַךְ אֱלֹהִים. «Воззвал» уместно для обращения с небес и сохраняет возвышенный, но понятный библейский регистр.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: שׁמים имеет форму множественного числа; русское «с небес» естественно и точно передаёт исходную локативную конструкцию.
- source_word: מַה לָּךְ
  choice: Что с тобой
  rationale: Идиома спрашивает, что случилось или что тревожит человека. «Что с тобой?» — естественный и сострадательный русский эквивалент без излишнего толкования.
- source_word: אַל תִּירְאִי
  choice: Не бойся
  rationale: Прямая и естественная передача отрицательного повеления в женском роде.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: потому что Бог услышал
  rationale: כִּי вводит основание для ободрения. Прошедшее «услышал» естественно в русском и сохраняет повтор глагола из начала стиха.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: там, где он находится
  rationale: Формулировка сохраняет выраженное в еврейском тексте указание на место и нынешнее положение мальчика, оставаясь понятной по-русски.
theological_decisions:
- issue: Личность מַלְאַךְ אֱלֹהִים и степень его отождествления с Богом
  choice: Ангел Божий
  alternative: ангел Бога; Божий посланник
  rationale: Перевод сохраняет исходное обозначение небесного посланника и не разрешает за текстом богословский вопрос о его точной личности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены повтор слов «услышал» и «голос мальчика», а также богословская неопределённость выражения «Ангел Божий».
