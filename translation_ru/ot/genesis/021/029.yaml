  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: спросил
  rationale: В контексте прямая речь представляет собой вопрос; «спросил» естественно передаёт функцию глагола речи, а повествовательная связь выражена последовательностью текста.
- source_word: אֲבִימֶלֶךְ אֶל אַבְרָהָם
  choice: Авимелех спросил Авраама
  rationale: Имена переданы в традиционной русской библейской форме; адресат речи оформлен прямым дополнением при глаголе «спросил».
- source_word: מָה הֵנָּה
  choice: Что означают
  rationale: Буквально сочетание значит «что они/что это», но здесь вопрос касается назначения или значения отдельно поставленных животных. «Что означают» ясно и естественно передаёт этот смысл, не превращая вопрос в прямое «зачем».
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: эти семь ягниц
  rationale: כְּבָשֹׂת — форма женского рода и обозначает молодых овец; «ягницы» сохраняет пол животных и остаётся понятным литературным словом.
- source_word: אֲשֶׁר הִצַּבְתָּ לְבַדָּנָה
  choice: которых ты поставил отдельно
  rationale: הִצַּבְתָּ означает «поставил, расположил», а לְבַדָּנָה прямо выражает обособленность. Такой перевод сохраняет оба элемента без избыточного толкования.
