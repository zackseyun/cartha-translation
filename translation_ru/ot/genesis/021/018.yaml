  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: ru
  text: Встань, подними мальчика и крепко поддержи его рукой[a], потому что Я сделаю его великим народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «укрепи свою руку на нём»; выражение означает крепко взяться за него и надёжно поддержать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: Встань
  rationale: Повелительная форма женского рода единственного числа, обращённая к Агари. «Встань» естественно и точно передаёт побуждение.
- source_word: שְׂאִ֣י
  choice: подними
  rationale: Глагол נשׂא здесь означает поднять мальчика из беспомощного положения; перевод сохраняет конкретный образ, не добавляя идеи длительного несения.
- source_word: הַנַּ֔עַר
  choice: мальчика
  rationale: נַעַר может обозначать мальчика или юношу; в данном повествовательном контексте «мальчик» звучит наиболее естественно.
- source_word: וְהַחֲזִ֥יקִי אֶת יָדֵ֖ךְ בּ֑וֹ
  choice: и крепко поддержи его рукой
  rationale: Конструкция с חזק выражает сильную, надёжную опору или хватку. «Крепко поддержи» передаёт и усилие, и заботливую поддержку, не сводя смысл к простому держанию за руку.
- source_word: כִּֽי
  choice: потому что
  rationale: Союз вводит основание для предшествующих повелений; «потому что» ясно выражает причинную связь.
- source_word: לְג֥וֹי גָּד֖וֹל
  choice: великим народом
  rationale: 'Предлог לְ при שׂים указывает на результат: мальчик станет родоначальником великого народа. Формулировка сохраняет сжатую метафору исходного текста.'
- source_word: אֲשִׂימֶֽנּוּ
  choice: Я сделаю его
  rationale: Глагол שׂים имеет значения «положить», «поставить», «сделать». В сочетании с «великим народом» русское «сделаю» наиболее непосредственно сохраняет конструкцию оригинала.
theological_decisions:
- issue: Божественное обещание о будущем Измаила
  choice: «Я сделаю его великим народом»
  alternative: «Я произведу от него великий народ»
  rationale: Выбранный вариант прямо воспроизводит образ исходного текста, где местоимение «его» является объектом глагола «сделаю». Он передаёт обещание национального будущего, не уточняя богословский статус этого обещания и не вводя отсутствующих в стихе разграничений.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. Повеления переданы кратко и прямо; необычная еврейская конструкция о руке раскрыта естественной русской формулировкой и пояснена в сноске.
