  yaml_path: translation/ot/genesis/021/034.yaml
  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: ru
  text: И жил Авраам в земле филистимлян долгое время[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жил как пришелец в земле филистимлян много дней». Еврейский глагол может подчёркивать проживание на чужой земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: жил
  rationale: Глагол גור обозначает проживание, нередко в положении пришельца. В современном русском «жил» естественно передаёт повествовательный смысл, а оттенок чужеземного проживания отмечен в сноске.
- source_word: בְּאֶרֶץ
  choice: в земле
  rationale: אֶרֶץ здесь обозначает территорию народа; «земля» — естественный и традиционный русский эквивалент в данном контексте.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Общепринятое русское наименование этого народа; сочетание передано как «земля филистимлян».
- source_word: יָמִים רַבִּים
  choice: долгое время
  rationale: Буквально «многие дни»; в данном контексте это еврейский способ обозначить продолжительный срок, поэтому «долгое время» звучит естественнее по-русски и сохраняет смысл.
- source_word: וַ
  choice: И
  rationale: Союз продолжает последовательность повествования; русское «И» сохраняет эту связь без добавления более определённого временного оттенка.
