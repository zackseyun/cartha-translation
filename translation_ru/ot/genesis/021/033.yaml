  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: ru
  text: Он посадил тамариск в Беэр-Шеве и там призвал имя Яхве[a], вечного Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провозгласил имя Яхве» или «воззвал к Яхве». Еврейский оборот в контексте поклонения может обозначать и провозглашение, и призывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бога вечности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: посадил
  rationale: Глагол נטע в породе qal обычно означает посадку растения; «посадил» естественно и точно передаёт действие.
- source_word: אֶשֶׁל
  choice: тамариск
  rationale: Существительное, вероятнее всего, обозначает тамариск. Конкретное название растения предпочтительнее обобщённых «дерево» или «роща»; единственное число также не поддерживает «рощу».
- source_word: בִּבְאֵר שָׁבַע
  choice: в Беэр-Шеве
  rationale: Предлог ב обозначает местонахождение; «в» естественно по-русски. Форма «Беэр-Шева» близко передаёт еврейское название בְּאֵר שֶׁבַע.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: и там призвал имя
  rationale: Оборот קרא בשם в контексте поклонения может означать призывание имени и вместе с тем допускать оттенок его провозглашения. Формулировка сохраняет библейский образ, а сноска отмечает диапазон значения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул; «Яхве» — современная русская транслитерация тетраграмматона.
- source_word: אֵל עוֹלָם
  choice: вечного Бога
  rationale: עוֹלָם при אֵל выражает непреходящую, вечную длительность. Русское сочетание «вечного Бога» естественно присоединяется как пояснительное наименование к имени Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יְהוָה. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вводит традиционную замену «Господь».
- issue: Значение формулы קרא בשם יהוה
  choice: призвал имя Яхве
  alternative: провозгласил имя Яхве; воззвал к Яхве
  rationale: Формула способна охватывать как обращение к Богу в поклонении, так и провозглашение его имени. Основной текст сохраняет традиционный образ «призывать имя», а сноска не позволяет свести его только к молитвенному обращению.
- issue: Смысл אֵל עוֹלָם
  choice: вечного Бога
  alternative: Бога вечности
  rationale: Прилагательное «вечный» ясно передаёт непреходящее бытие Бога, не превращая выражение в более абстрактное «Бог вечности» и не добавляя догматических уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» сохраняет явную структуру исходного стиха и не подставляет имя действующего лица из контекста. Все сноски поставлены непосредственно после выражений, которые они поясняют.
