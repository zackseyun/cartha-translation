base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: ru
  text: Бог был с мальчиком, а мальчик рос. Он жил в пустыне и стал лучником[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал стрелком из лука». Еврейское выражение буквально описывает его как человека, стреляющего из лука.'
    reason: Лексическая альтернатива; поясняет образное еврейское выражение естественным русским языком.
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Бог был с мальчиком
  rationale: Оборот היה את выражает присутствие, расположение и поддержку. Перевод сохраняет прямое утверждение Божьего присутствия, не конкретизируя его как помощь или защиту.
- source_word: וַיִּגְדָּל
  choice: и тот рос
  rationale: Глагол גדל в данном контексте обозначает взросление и физическое развитие. Местоимение «тот» естественно устраняет возможную двусмысленность после упоминания Бога.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: Он жил в пустыне
  rationale: ישב здесь означает постоянное или продолжительное проживание, а מִדְבָּר — пустынную, малонаселённую местность. «Жил в пустыне» звучит естественно в современном русском языке.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: стал лучником
  rationale: Сочетание описывает человека, стреляющего из лука. «Лучник» кратко и естественно передаёт смысл, тогда как буквальное «стреляющим из лука» по-русски тяжеловесно.
theological_decisions:
- issue: Формула Божьего присутствия применительно к Измаилу
  choice: Бог был с мальчиком
  alternative: Бог помогал мальчику; Бог был на стороне мальчика
  rationale: Перевод сохраняет утверждение текста о Божьем присутствии и благоволении к Измаилу, не расширяя его до более определённых богословских выводов.
translation_notes:
  register: Современный литературный русский язык; простой, ясный и достойный повествовательный стиль. Повтор местоимения разделяет два предложения и сохраняет плавность библейского повествования.
