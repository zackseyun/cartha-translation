  text: 'И сказала Сарра: «Бог подарил мне смех; всякий, кто услышит, будет смеяться со мной».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет смеяться надо мной»; возможно также: «будет смеяться из-за меня» или «ради меня». Еврейское выражение допускает несколько оттенков, но в этом контексте наиболее вероятен смысл общей с Саррой радости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала
  rationale: Вав с последовательной формой продвигает повествование; обычное русское «И сказала» сохраняет его связность без избыточного уточнения времени.
- source_word: שָׂרָה
  choice: Сарра
  rationale: Передача традиционной русской формы личного имени.
- source_word: צְחֹק
  choice: смех
  rationale: Существительное прямо означает «смех»; эта передача сохраняет повтор корня со словом יִצְחַק и созвучие с именем Исаак.
- source_word: עָשָׂה לִי
  choice: даровал мне
  rationale: Буквально «сделал для меня». В современном литературном русском «даровал мне смех» естественно выражает благой дар Бога, сохраняя образ и не превращая смех в отвлечённую радость.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово обозначает единого Бога и согласуется с глаголом в единственном числе.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: каждый, кто услышит об этом
  rationale: Единственное число имеет распределительное значение. Добавленное «об этом» естественно передаёт подразумеваемое содержание услышанного в русском языке.
- source_word: יִצְחַק
  choice: будет смеяться
  rationale: Сохраняется основное значение глагола и словесная игра с צְחֹק и именем Исаак.
- source_word: לִי
  choice: вместе со мной
  rationale: В контексте рождения Исаака наиболее вероятен смысл участия в радостном смехе Сарры; предлог при этом допускает и другие оттенки, отмеченные в сноске.
theological_decisions:
- issue: Смысл выражения יִצְחַק לִי
  choice: 'совместный радостный смех: «будет смеяться вместе со мной»'
  alternative: «будет смеяться надо мной» или «будет смеяться из-за меня / ради меня»
  rationale: Контекст исполнения Божьего обещания и рождения Исаака поддерживает положительный смысл общего смеха. Однако еврейский предлог לְ не устраняет иных возможных оттенков, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «смех — смеяться» намеренно сохранён ради словесной игры; «даровал» звучит естественнее буквального «сделал для меня», не снимая смысла Божьего действия.
