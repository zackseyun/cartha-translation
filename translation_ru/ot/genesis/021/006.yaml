  to: 'И сказала Сарра: «Бог подарил мне смех; всякий, кто услышит, будет смеяться со мной».[a]'
  rationale: Убрано невыраженное в оригинале «об этом», чтобы сохранить краткость и не конкретизировать объект глагола «услышит». «Подарил мне смех» сохраняет существительное «смех», повтор с «смеяться» и благожелательный контекст, при этом звучит современно и литературно. Сноска удерживает альтернативные оттенки לִי.
