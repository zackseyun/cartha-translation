    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственное выражение, вводящее объяснение названия места.
- source_word: קָרָא
  choice: назвал
  rationale: В данном контексте глагол означает дать месту имя; «назвал» ясно и естественно передаёт это значение.
- source_word: לַמָּקוֹם הַהוּא
  choice: то место
  rationale: Сохраняет определённость и указательное значение еврейского выражения.
- source_word: בְּאֵר שָׁבַע
  choice: Беэр-Шевой
  rationale: Передаёт географическое имя принятой русской библейской транслитерацией и позволяет пояснить еврейскую игру слов в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину, по которой место получило это название.
- source_word: שָׁם
  choice: там
  rationale: Прямое и естественное соответствие еврейскому наречию места.
- source_word: נִשְׁבְּעוּ
  choice: поклялись
  rationale: Передаёт значение нифаля глагола שבע — «поклясться, принести клятву» — и сохраняет связь с объяснением названия.
- source_word: שְׁנֵיהֶם
  choice: они оба
  rationale: Естественно по-русски подчёркивает, что клятву принесли обе участвующие стороны.
