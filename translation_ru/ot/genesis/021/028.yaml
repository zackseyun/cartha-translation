lexical_decisions:
- source_word: וַיַּצֵּב
  choice: поставил отдельно
  rationale: Каузативная форма глагола נצב означает «поставить, расположить». В сочетании с לְבַדְּהֶן естественный русский оборот «поставил отдельно» передаёт и конкретное действие, и отделение животных, не уточняя сверх текста его цель.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: אֶת
  choice: '[показатель прямого дополнения, отдельно не переводится]'
  rationale: В русском языке значение выражается падежом и порядком слов.
- source_word: שֶׁבַע
  choice: семь
  rationale: Прямое соответствие еврейскому количественному числительному.
- source_word: כִּבְשֹׂת
  choice: молодых овечек
  rationale: Существительное обозначает ягнят женского пола. «Молодые овечки» естественно для современного русского языка и сохраняет указание как на пол, так и на молодой возраст; «ягниц» было бы менее понятно современному читателю.
- source_word: הַצֹּאן
  choice: из стада
  rationale: צֹאן — собирательное обозначение мелкого скота. Русское «из стада» естественно указывает, что семь овечек были выделены из общей группы, не сужая значение до строго определённого вида животных.
- source_word: לְבַדְּהֶן
  choice: отдельно
  rationale: Выражение указывает, что семь животных были размещены обособленно от остальных; наречие «отдельно» ясно и естественно передаёт этот смысл.
