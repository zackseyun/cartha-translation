  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: ru
  text: И Сарра зачала и родила Аврааму сына в старости Авраама, в назначенное время, о котором Бог говорил ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: зачала
  rationale: Глагол הרה обозначает зачатие или наступление беременности; «зачала» кратко и точно передаёт последовательность повествования.
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Глагол ילד в данной форме сообщает о рождении ребёнка; «родила» естественно сочетается с предшествующим «зачала».
- source_word: בֵּן
  choice: сына
  rationale: Существительное в единственном числе прямо указывает на ребёнка мужского пола; русская форма определяется управлением глагола «родила».
- source_word: לִזְקֻנָיו
  choice: в его старости
  rationale: Выражение указывает на преклонный возраст Авраама как обстоятельство времени, а не на цель рождения сына.
- source_word: לַמּוֹעֵד
  choice: в назначенное время
  rationale: מוֹעֵד обозначает установленное, назначенное время; перевод сохраняет связь с ранее данным Божьим обещанием.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: о котором говорил ему Бог
  rationale: Относительное предложение относится к назначенному времени и ясно передаёт, что Бог ранее говорил Аврааму об этом времени.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычное и прямое соответствие еврейскому обозначению Бога в данном контексте.
- source_word: וַ
  choice: И
  rationale: Начальный союз продолжает повествовательную цепь; «И» сохраняет её без добавления причинно-следственного оттенка.
theological_decisions:
- issue: Передача исполнения Божьего обещания без добавочного истолкования
  choice: в назначенное время, о котором говорил ему Бог
  alternative: в установленный срок, который Бог назвал ему
  rationale: Выбранный вариант сохраняет акцент на заранее определённом времени и прежнем Божьем слове, не уточняя сверх текста форму или содержание обещания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся прозрачным для широкого читателя; повтор предлога «в» допустим и помогает раздельно обозначить преклонный возраст Авраама и назначенное Богом время.
