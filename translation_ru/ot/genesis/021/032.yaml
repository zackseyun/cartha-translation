  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: ru
  text: И заключили они союз в Беэр-Шеве[a]. Затем Авимелех встал, и Авимелех и Фихол, начальник его войска, возвратились в землю филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрезали союз» — еврейская идиома, означающая заключение союза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: заключили они союз
  rationale: Еврейское выражение буквально означает «разрезали союз», но это идиома со значением «заключили союз». Русское «заключили союз» естественно и точно передаёт смысл.
- source_word: בִּבְאֵר שָׁבַע
  choice: в Беэр-Шеве
  rationale: Предлог ב обозначает место действия; форма «в Беэр-Шеве» естественна по-русски. Транслитерация сохраняет составное звучание еврейского топонима.
- source_word: וַיָּקָם
  choice: встали
  rationale: Глагол קום значит «встать, подняться». Множественное число в русском согласует действие с Авимелехом и Фихолом и подготавливает последующее «возвратились».
- source_word: שַׂר צְבָאוֹ
  choice: начальник его войска
  rationale: שַׂר обозначает начальника или военачальника, а צָבָא здесь — войско. Выражение ясно и сохраняет слегка возвышенный повествовательный регистр.
- source_word: וַיָּשֻׁבוּ
  choice: возвратились
  rationale: Форма от שׁוב в данном контексте означает возвращение к прежнему месту; «возвратились» соответствует литературному регистру.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: в землю филистимлян
  rationale: Передаёт буквальную этногеографическую конструкцию «в землю филистимлян», не заменяя её позднейшим названием территории.
- source_word: וּפִיכֹל
  choice: и Фихол
  rationale: Союз ו передан прямо как «и». Русский синтаксис позволяет назвать обоих деятелей перед сказуемыми во множественном числе без добавления «с».
