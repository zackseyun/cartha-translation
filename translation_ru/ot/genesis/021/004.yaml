lexical_decisions:
- source_word: וַיָּמָל
  choice: обрезал
  rationale: Глагол מול обозначает совершение обрезания; «обрезал» — точный и естественный русский эквивалент.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: Исаака, сына своего
  rationale: Сохраняется имя прямого дополнения и присутствующий в еврейском тексте акцент на родстве; постпозиция «сына своего» соответствует достоинству библейского повествовательного регистра.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: когда тому было восемь дней
  rationale: Естественно передаёт еврейское возрастное выражение буквально «сын восьми дней»; местоимение «тому» однозначно относится к Исааку и избегает возможной двусмысленности русского «ему».
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Сравнительно-модальный союз выражает соответствие поступка Авраама Божьему повелению; «как» передаёт это без избыточного усиления.
- source_word: צִוָּה אֹתוֹ אֱלֹהִים
  choice: повелел ему Бог
  rationale: «Повелел» естественно и точно передаёт צוה в торжественном повествовательном контексте; местоимение относится к Аврааму, а единственное число указывает на Бога.
theological_decisions:
- issue: Временное соотношение Божьего повеления и обрезания
  choice: как повелел ему Бог
  alternative: как Бог прежде повелел ему
  rationale: В русском языке совершенный вид «повелел» в контексте естественно обозначает предшествующее повеление; добавление «прежде» сделало бы явным то, что в еврейском тексте передано контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь; синтаксис остаётся ясным для современного читателя.
