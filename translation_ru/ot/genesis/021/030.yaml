base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: ru
  text: 'Он сказал: «Прими из моей руки эти семь ягниц, чтобы это служило свидетельством в мою пользу, что я выкопал этот колодец».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они служили свидетельством в мою пользу». В еврейском тексте глагол стоит в единственном числе, хотя ближайший возможный референт — семь ягниц; единственное число может рассматривать их как единое целое либо относиться к самому факту передачи.'
    reason: Сохранена грамматическая неоднозначность еврейского текста между семью ягницами как коллективным свидетельством и самой передачей как свидетельством.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Обычное продолжение древнееврейского повествования; русское «Он сказал» передаёт реплику без избыточного уточнения временной последовательности.
- source_word: כִּי ... תִּקַּח
  choice: Возьми
  rationale: כִּי вводит содержание ответа, а форма תִּקַּח в данном контексте выражает требуемое действие. Русский императив передаёт это естественно и ясно.
- source_word: אֶת שֶׁבַע כְּבָשֹׂת
  choice: этих семь ягниц
  rationale: כְּבָשֹׂת обозначает овец женского пола; «ягниц» точно передаёт пол и возраст животных. Указательное «этих» естественно обусловлено тем, что ягницы находятся перед собеседниками и только что были выделены.
- source_word: מִיָּדִי
  choice: из моих рук
  rationale: Сохранён конкретный образ передачи «из руки», но употреблено естественное для современного русского языка множественное число в устойчивом выражении «из моих рук».
- source_word: בַּעֲבוּר
  choice: чтобы
  rationale: Предлог выражает цель; «чтобы» ясно и естественно передаёт целевую связь.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: это было для меня свидетельством
  rationale: Глагол стоит в женском роде единственного числа, хотя ближайшее возможное соотнесение — семь ягниц. Нейтральное «это» позволяет понимать свидетелем весь акт передачи или установленное соглашение и не превращает форму оригинала в явное множественное число.
- source_word: כִּי חָפַרְתִּי
  choice: что я выкопал
  rationale: 'כִּי здесь вводит содержание свидетельства: Авраам утверждает, что именно он выкопал колодец. Русское придаточное с «что» сохраняет этот смысл без добавочного толкования.'
- source_word: הַבְּאֵר הַזֹּאת
  choice: этот колодец
  rationale: Прямая и естественная передача определённого существительного с указательным местоимением.
