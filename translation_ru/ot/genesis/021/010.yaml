base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: ru
  text: 'И сказала она Аврааму: «Прогони эту рабыню и её сына, потому что сын этой рабыни не будет наследовать вместе с моим сыном — с Исааком».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: И сказала она Аврааму
  rationale: Нарративный וַ передаёт последовательность повествования; русское «И сказала» естественно сохраняет связь с предшествующим контекстом. Местоимение отражает форму глагола, не добавляя имени, отсутствующего в стихе.
- source_word: גָּרֵשׁ
  choice: Прогони
  rationale: Императив обозначает решительное изгнание. «Прогони» передаёт силу действия точнее, чем более мягкое «отошли».
- source_word: הָאָמָה הַזֹּאת
  choice: эту рабыню
  rationale: אָמָה обозначает женщину в зависимом, рабском положении; «рабыня» ясно передаёт социально-правовой статус и сохраняет указательное, дистанцирующее «эту».
- source_word: בְּנָהּ
  choice: её сына
  rationale: Прямо передаёт притяжательный суффикс третьего лица женского рода.
- source_word: כִּי לֹא יִירַשׁ
  choice: потому что ... не будет наследовать
  rationale: כִּי вводит основание требования, а יִירַשׁ здесь относится к получению наследства; будущая форма по-русски передаёт модально-временную силу несовершенного вида.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: сын этой рабыни
  rationale: Сохраняется повтор полного обозначения с указательным местоимением, подчёркивающий дистанцирование говорящей.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: вместе с моим сыном, с Исааком
  rationale: Повтор עִם сохранён как «с ... с», а второе сочетание прочитано как emphатическое уточнение имени; запятая удерживает эту структуру, не превращая её в неестественную кальку.
theological_decisions:
- issue: Характер утверждения о наследовании
  choice: «не будет наследовать»
  alternative: «не должен наследовать»
  rationale: Еврейский текст формально выражает отрицательное утверждение в несовершенном виде, а не явную формулу долженствования. Перевод не усиливает слова Сарры до юридического запрета, хотя контекст её требования сохраняется.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Резкость речи Сарры и повтор «этой рабыни» сохранены; зависимый статус אָמָה передан прямо словом «рабыня». Структура «с моим сыном, с Исааком» намеренно сохраняет повтор и акцент исходного текста.
