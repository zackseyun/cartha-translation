  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: ru
  text: 'Авимелех сказал: «Я не знал, кто это сделал[a]. Ты тоже не сообщил мне об этом, да и сам я до сегодняшнего дня об этом не слышал».'
  philosophy: optimal-equivalence
  footnotes:
