    text: 'Буквально: «кто сделал это дело». Еврейское слово давар может означать «дело», «случай», «событие» или «поступок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Последовательная форма с וַ продвигает повествование; в русском связность естественно передаётся без обязательного союза «и».
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Имя передано в принятой русской библейской форме.
- source_word: לֹא יָדַעְתִּי
  choice: Я не знал
  rationale: Перфект обозначает отсутствие знания до момента речи; русское прошедшее время естественно передаёт этот смысл.
- source_word: מִי עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: кто это сделал
  rationale: Естественная русская формулировка сохраняет вопрос о виновнике поступка; многозначность דָּבָר отмечена в сноске.
- source_word: וְגַם אַתָּה לֹא הִגַּדְתָּ לִּי
  choice: Ты тоже не сообщил мне об этом
  rationale: «Тоже» передаёт включительно-усилительное значение גַּם, а «сообщил» естественно выражает значение הגיד в контексте получения сведений.
- source_word: וְגַם אָנֹכִי לֹא שָׁמַעְתִּי
  choice: да и сам я ... об этом не слышал
  rationale: Оборот «да и сам я» сохраняет повторное גַּם и подчёркнутое местоимение אָנֹכִי; подразумеваемый предмет слуха выражен по-русски явно.
- source_word: בִּלְתִּי הַיּוֹם
  choice: до сегодняшнего дня
  rationale: В данном контексте оборот указывает, что Авимелех не слышал об этом прежде нынешнего дня.
