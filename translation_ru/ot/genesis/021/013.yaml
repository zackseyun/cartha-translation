  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: ru
  text: И от сына рабыни[a] Я тоже произведу народ, потому что он — твой потомок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанки»; еврейское слово обозначает женщину несвободного, зависимого положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: тоже
  rationale: Сочетание וְ и גַם продолжает предыдущую мысль и подчёркивает, что обещание распространяется также на сына Агари; в современном русском это естественно передаётся словом «тоже».
- source_word: אֶת בֶּן הָאָמָה
  choice: от сына рабыни
  rationale: אָמה обозначает женщину несвободного, зависимого положения, поэтому «рабыня» не смягчает существенную для повествования социальную реальность. Предлог «от» связан с естественной русской конструкцией «произведу народ».
- source_word: לְגוֹי אֲשִׂימֶנּוּ
  choice: от … произведу народ
  rationale: 'Буквальная конструкция «сделаю его народом» по-русски звучит неестественно, поскольку один человек не является народом в прямом смысле. Выбранная формулировка передаёт результат: от сына рабыни произойдёт народ, не добавляя идеи назначения или особого статуса.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного обещания и здесь имеет ясное причинное значение.
- source_word: זַרְעֲךָ הוּא
  choice: он — твоё потомство
  rationale: זֶרַע здесь указывает на происхождение от Авраама. «Потомство» сохраняет широкое значение слова, а выраженное местоимение הוּא передано словом «он» без усиления, которого нет необходимости добавлять.
theological_decisions:
- issue: Передача социального положения Агари в слове אָמָה
  choice: рабыня
  alternative: служанка / рабыня-служанка
  rationale: «Рабыня» прямо отражает несвободное положение Агари и не сглаживает социальное напряжение рассказа; при этом перевод не вводит дополнительных представлений о конкретной правовой форме рабства.
- issue: Образование народа от одного человека
  choice: от сына рабыни Я … произведу народ
  alternative: сына рабыни Я … сделаю народом
  rationale: Еврейский текст представляет сына исходной фигурой будущего народа. Русская формулировка передаёт этот смысл естественно, не уточняя сверх текста ни численность, ни политическое устройство народа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов сохраняет акцент на сыне рабыни, а прописное «Я» уместно для прямой речи Бога в принятой русской издательской традиции.
