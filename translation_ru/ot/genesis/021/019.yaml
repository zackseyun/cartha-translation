base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: ru
  text: Тогда Бог открыл ей глаза, и она увидела колодец с водой. Она пошла, наполнила мех[a] водой и напоила мальчика.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бурдюк». Еврейское слово обозначает кожаную ёмкость для переноски жидкости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: открыл
  rationale: Глагол פקח обычно означает «открывать», особенно глаза. Перевод сохраняет конкретный еврейский образ, не поясняя механизм Божьего действия.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном повествовании слово обозначает единого Бога и согласовано с глаголом в единственном числе.
- source_word: עֵינֶיהָ
  choice: ей глаза
  rationale: Естественная русская передача буквального выражения «её глаза» при глаголе «открыл».
- source_word: וַתֵּרֶא
  choice: она увидела
  rationale: Прямая передача глагола ראה, естественно продолжающая повествование после слов об открытых глазах.
- source_word: בְּאֵר מָיִם
  choice: колодец с водой
  rationale: Фраза буквально обозначает «колодец воды»; русское «колодец с водой» сохраняет упоминание воды и звучит естественно.
- source_word: וַתֵּלֶךְ
  choice: она пошла
  rationale: Простая повествовательная форма, передающая последовательность действий.
- source_word: וַתְּמַלֵּא
  choice: наполнила
  rationale: Стандартная и естественная передача глагола מלא без добавочного толкования.
- source_word: הַחֵמֶת
  choice: мех
  rationale: חֵמֶת — ёмкость из кожи для переноски жидкости. «Мех» — краткий традиционный русский эквивалент; более явное «бурдюк» вынесено в примечание.
- source_word: מַיִם
  choice: водой
  rationale: Творительный падеж естественно сочетается по-русски с глаголом «наполнить».
- source_word: וַתַּשְׁקְ
  choice: напоила
  rationale: Каузативная форма глагола שׁקה означает «дать пить»; «напоила» точно и естественно выражает это значение.
- source_word: הַנַּעַר
  choice: мальчика
  rationale: В контексте речь идёт о сыне Агари, Измаиле; «мальчик» — понятное современное обозначение без архаического оттенка.
theological_decisions:
- issue: Следует ли понимать слова «Бог открыл ей глаза» как прямое Божье действие или объяснить их лишь тем, что Агарь заметила уже находившийся рядом колодец
  choice: 'Сохранено прямое утверждение: «Бог открыл ей глаза»'
  alternative: «Бог помог ей заметить колодец» или «Бог дал ей увидеть»
  rationale: Еврейский текст прямо называет Бога действующим лицом и использует образ открытия глаз. Перевод сохраняет это утверждение и присущую ему богословскую напряжённость, не объясняя способ действия.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Сохранён еврейский образ «открыл ей глаза»; архаические слова избегаются, а малоупотребительное значение слова «мех» пояснено в сноске.
