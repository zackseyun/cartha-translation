lexical_decisions:
- source_word: וַיֵּרַע
  choice: очень огорчило
  rationale: Глагол רעע в сочетании с בְּעֵינֵי выражает отрицательную оценку или тягостное восприятие. В данном контексте «очень огорчило» естественно передаёт сильную личную реакцию Авраама, не приписывая самому делу однозначной нравственной оценки.
- source_word: הַדָּבָר
  choice: это дело
  rationale: דָּבָר может означать слово, дело, обстоятельство или вопрос. «Это дело» сохраняет широту слова и связывает стих с требованием Сарры в предыдущем контексте без излишнего уточнения.
- source_word: מְאֹד
  choice: очень
  rationale: Обычный усилитель, естественно и точно переданный современным русским «очень».
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: огорчило Авраама
  rationale: Буквальная идиома «было плохо в глазах Авраама» по-русски звучит неестественно и может ошибочно подразумевать нравственное осуждение. Передача через переживание Авраама сохраняет функцию еврейского оборота.
- source_word: עַל אֹדוֹת
  choice: ведь речь шла о
  rationale: Оборот допускает причинный смысл «из-за» и тематический «относительно, по поводу». Формулировка «ведь речь шла о» естественно показывает причину огорчения и избегает впечатления, будто сын сам был его причиной.
- source_word: בְּנוֹ
  choice: его сыне
  rationale: בֵּן обозначает именно сына; перевод сохраняет родственную и гендерную определённость оригинала.
