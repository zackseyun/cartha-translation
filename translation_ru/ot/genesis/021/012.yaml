base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: ru
  text: 'Но Бог сказал Аврааму: «Пусть это не будет тяжело для тебя[a] из-за мальчика и из-за твоей рабыни[b]. Во всём, что скажет тебе Сарра, послушай её[c], ибо через Исаака будет названо тебе потомство[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть не будет дурно (или тяжело) в твоих глазах»; то есть пусть это не будет для тебя тягостным или неприятным.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «невольницы»; еврейское слово указывает на женщину несвободного статуса.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «слушай её голос», то есть внемли тому, что говорит Сарра.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально возможно: «в Исааке будет названо тебе потомство». Эта формула говорит о том, что линия потомства, признаваемая потомством Авраама, будет обозначена через Исаака.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: не огорчайся
  rationale: Еврейская идиома буквально описывает нечто как дурное или тяжёлое в глазах человека; в данном контексте она выражает огорчение и тягостное переживание. Русское «не огорчайся» естественно передаёт смысл, а образ исходного текста отмечен в сноске.
- source_word: הַנַּעַר
  choice: мальчик
  rationale: נַעַר обозначает мальчика или юношу; здесь речь об Измаиле. «Мальчик» естественно для современного русского языка и соответствует ближайшему контексту.
- source_word: אֲמָתֶךָ
  choice: твоя рабыня
  rationale: אָמָה обозначает женщину несвободного, подчинённого статуса. «Рабыня» не смягчает обозначенную текстом социальную реальность.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: послушай её
  rationale: 'Буквально: «слушай её голос»; это еврейская идиома со значением «внемли ей, поступи по её словам». Выбран естественный русский эквивалент без усиления до безусловного «повинуйся».'
- source_word: בְּיִצְחָק
  choice: через Исаака
  rationale: Предлог ב указывает здесь на Исаака как на линию или средство, через которое будет определяться потомство Авраама.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: твоё потомство будет названо твоим
  rationale: Формулировка сохраняет значение глагола «называть» и дательного לְךָ, передавая обозначение потомства как принадлежащего Аврааму, не сводя фразу к более узкому толкованию о биологическом происхождении.
- source_word: זָרַע
  choice: потомство
  rationale: Собирательное существительное זֶרַע естественно передаётся русским собирательным «потомство», которое сохраняет и единство линии, и множественность потомков.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Но Бог сказал
  rationale: Союз «но» отражает контраст с огорчением Авраама в предыдущем стихе и естественно продолжает повествование.
theological_decisions:
- issue: Социальный статус Агари
  choice: твоя рабыня
  alternative: твоя служанка
  rationale: Исходный термин указывает на несвободный статус Агари. Перевод не смягчает эту характеристику и не добавляет оценки сверх текста.
- issue: Смысл обещания о потомстве через Исаака
  choice: через Исаака твоё потомство будет названо твоим
  alternative: через Исаака будет продолжен твой род; в Исааке наречётся тебе семя
  rationale: Выбранная формулировка сохраняет язык называния и неоднозначность того, относится ли выражение к обозначению, признанию или счёту за потомство. Она указывает на особую линию через Исаака, не отрицая биологического родства Авраама с Измаилом.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаической интонацией. Еврейские идиомы переданы естественно в основном тексте, а их образная буквальная форма сохранена в сносках. Слово «рабыня» сознательно сохраняет социальную остроту исходного обозначения.
