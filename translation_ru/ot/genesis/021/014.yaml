revisions:
- from: Авраам встал рано утром, взял хлеб и бурдюк с водой, отдал их Агари и положил ей на плечо. Он передал ей и мальчика[a], а затем отпустил её. Она пошла и стала блуждать по пустыне Вирсавии.
  to: Авраам встал рано утром, взял хлеб и бурдюк с водой, дал их Агари, положив ей на плечо, и передал ей мальчика[a], после чего отпустил её. Она пошла и блуждала по пустыне Вирсавии.
  rationale: Исправлена русская грамматическая связь между припасами и действием «положив ... на плечо». Формулировка о мальчике сохраняет наиболее вероятное понимание сжатого еврейского синтаксиса, а примечание честно отмечает его формальную неоднозначность, не представляя ребёнка как непременно помещённого на плечо Агари.
