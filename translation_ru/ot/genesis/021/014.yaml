base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: ru
  text: Авраам встал рано утром, взял хлеб и бурдюк с водой, дал их Агари, положив ей на плечо, и передал ей мальчика[a], после чего отпустил её. Она пошла и блуждала по пустыне Вирсавии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «положив [это/их] ей на плечо, и мальчика». Синтаксис здесь сжат. Эти слова можно понимать как сообщение о том, что Авраам положил припасы Агари на плечо и передал ей мальчика; формально возможна и связь слов «и мальчика» с предшествующей фразой.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: встал рано утром
  rationale: Передаёт обычное значение породы hифиль глагола שׁכם и временное уточнение без архаизации.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохраняет прямое значение существительного; расширять его до «еды» в данном контексте нет необходимости.
- source_word: חֵמַת מַיִם
  choice: бурдюк с водой
  rationale: חֵמֶת обозначает кожаный сосуд для жидкости; «бурдюк» точно и естественно передаёт предмет древнего быта.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: положил ей на плечо
  rationale: Близко передаёт действие и сохраняет конкретную деталь исходного текста; местоимение «их» связывает эту фразу с хлебом и бурдюком.
- source_word: וְאֶת הַיֶּלֶד
  choice: Он передал ей и мальчика
  rationale: Естественно выражает наиболее вероятную синтаксическую связь и не создаёт ошибочного впечатления, будто Авраам положил мальчика Агари на плечо.
- source_word: וַיְשַׁלְּחֶהָ
  choice: отпустил её
  rationale: Передаёт значение отправления прочь в сдержанном повествовательном регистре.
- source_word: וַתֵּתַע
  choice: стала блуждать
  rationale: Сохраняет диапазон значения «бродить, сбиться с пути», не утверждая прямо, намеренным или случайным было её движение.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: по пустыне Вирсавии
  rationale: «Пустыня» здесь обозначает необжитую засушливую местность, а «Вирсавия» является укоренившейся русской формой топонима.
theological_decisions:
- issue: Синтаксическая связь слов «и мальчика» с фразой «положил ей на плечо»
  choice: На плечо Агари были положены припасы, а мальчик был передан ей отдельно.
  alternative: Слова можно формально понять так, будто на плечо ей были положены и припасы, и мальчик; либо как сжатое сообщение о передаче Агари припасов и мальчика.
  rationale: Еврейский синтаксис сжат и допускает внешнюю неоднозначность. С учётом возраста Измаила в более широком повествовательном контексте буквальное представление о мальчике на плече, вероятнее всего, ввело бы современного читателя в заблуждение; примечание сохраняет сведения о форме исходного текста.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный повествовательный стиль. Сохранены конкретные реалии текста и его синтаксическая напряжённость отмечена в примечании без конфессионального истолкования.
