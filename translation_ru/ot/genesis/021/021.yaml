  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: ru
  text: Он жил в пустыне Паран[a], и его мать взяла ему жену из земли Египта[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитал в пустыне Паран»; возможен также смысл «поселился».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «женщину»; контекст указывает на устройство брака, поэтому в основном тексте: «жену».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Он жил
  rationale: Глагол יָשַׁב может означать «сидеть», «жить», «обитать» или «поселиться». В данном повествовательном резюме «жил» естественно передаёт продолжительное пребывание, не усиливая оттенок постоянного поселения.
- source_word: בְּמִדְבַּר פָּארָן
  choice: в пустыне Паран
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность; «пустыня» — естественный русский эквивалент. Название פָּארָן передано традиционной формой «Паран».
- source_word: וַתִּקַּח
  choice: взяла
  rationale: לָקַח имеет широкое значение «брать». Здесь контекст показывает, что мать нашла или выбрала сыну брачную пару; буквальное «взяла» сохраняет образ исходного текста и понятно в сочетании «взяла ему жену».
- source_word: לוֹ
  choice: ему
  rationale: 'Предлог לְ с местоименным суффиксом указывает, в чью пользу совершается действие: мать взяла жену для него.'
- source_word: אִמּוֹ
  choice: мать
  rationale: Подлежащее прямо названо в еврейском тексте. Русское местоимение «его» можно естественно опустить, поскольку «ему» уже однозначно указывает на сына.
- source_word: אִשָּׁה
  choice: жену
  rationale: אִשָּׁה может означать и «женщина», и «жена». В контексте устройства брака требуется значение «жена».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Перевод сохраняет явно выраженное אֶרֶץ («земля, страна») и использует традиционное, но понятное современному читателю русское географическое сочетание.
