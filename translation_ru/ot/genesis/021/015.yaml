  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: ru
  text: Когда вода в бурдюке[a] закончилась, она бросила[b] мальчика под один из кустов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Бурдюк — сосуд для воды, сделанный из шкуры животного. Иной перевод: «кожаный сосуд».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кинула». Еврейский глагол сильнее, чем простое «положила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: закончилась
  rationale: Глагол כלה здесь означает, что запас воды подошёл к концу. «Закончилась» естественно передаёт это по-русски, не добавляя предположения о том, была ли вода выпита или вытекла.
- source_word: הַמַּיִם
  choice: вода
  rationale: Хотя еврейское слово имеет форму множественного числа, оно обычно обозначает воду как вещество; в русском языке естественно единственное число.
- source_word: מִן הַחֵמֶת
  choice: в бурдюке
  rationale: חֵמֶת — сосуд из шкуры животного для хранения жидкости. Русское «бурдюк» кратко и точно передаёт предмет; конструкция с «в» естественно описывает исчерпание содержавшейся в нём воды.
- source_word: וַתַּשְׁלֵךְ
  choice: она бросила
  rationale: שלך — сильный глагол со значением «бросить». Перевод сохраняет резкость действия и тяжесть сцены, не смягчая его до нейтрального «положила».
- source_word: אֶת הַיֶּלֶד
  choice: мальчика
  rationale: יֶלֶד обозначает ребёнка, здесь мужского пола. «Мальчика» звучит современно и соответствует повествовательному контексту.
- source_word: תַּחַת
  choice: под
  rationale: Прямой и естественный русский эквивалент пространственного предлога «под, ниже».
- source_word: אַחַד הַשִּׂיחִם
  choice: один из кустов
  rationale: Конструкция буквально указывает на один куст среди нескольких; שִׂיחַ означает куст или кустарник.
