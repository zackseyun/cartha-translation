  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: ru
  text: И Авраам взял мелкий и крупный скот, дал его Авимелеху, и оба они заключили завет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассекли завет» — устойчивое еврейское выражение со значением «заключили завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное значение לקח; форма с וַ передаёт последовательное действие повествования, выраженное начальным «И».
- source_word: צֹאן
  choice: мелкий скот
  rationale: צֹאן обозначает мелкий домашний скот, включая овец и коз; этот вариант точнее, чем только «овцы», и естественно противопоставлен крупному скоту.
- source_word: וּבָקָר
  choice: и крупный скот
  rationale: בָּקָר обозначает преимущественно крупный рогатый скот; в паре с צֹאן естественно русское сочетание «мелкий и крупный скот».
- source_word: וַיִּתֵּן
  choice: и отдал
  rationale: נתן означает «дать»; «отдал» естественно описывает передачу животных Авимелеху, не добавляя церемониального оттенка.
- source_word: לַאֲבִימֶלֶךְ
  choice: Авимелеху
  rationale: Предлог ל передан русским дательным падежом; имя транслитерировано в принятой библейской форме.
- source_word: שְׁנֵיהֶם
  choice: они оба
  rationale: Явно сохраняет указание еврейского текста на двух участников соглашения.
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: заключили завет
  rationale: כרת ברית — устойчивое еврейское выражение, буквально «рассекать завет»; по-русски его значение естественно передаётся как «заключить завет», а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Передача заветной формулы כרת ברית
  choice: заключили завет
  alternative: 'буквально: «рассекли завет»'
  rationale: Основной текст использует ясную современную русскую формулу, сохраняя ключевой термин «завет». Буквальный древнееврейский образ отмечен в сноске без навязывания конкретного толкования обряда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь стиха с контекстом; терминология остаётся понятной обычному читателю.
