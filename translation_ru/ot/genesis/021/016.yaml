base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: ru
  text: 'Она отошла и села напротив него, поодаль, примерно на выстрел из лука, потому что сказала: «Не видеть мне смерти мальчика[a]». И села она напротив него, подняла голос и заплакала.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не видеть мне, как мальчик умрёт».'
    reason: Древнееврейское выражение буквально говорит о видении «при смерти мальчика» и допускает более естественную глагольную передачу.
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: напротив него
  rationale: Передаёт пространственное значение положения напротив или в стороне от объекта; дополнение «него» восстанавливается из контекста. Повтор сохранён в обеих частях стиха.
- source_word: הַרְחֵק
  choice: поодаль
  rationale: Наречное употребление формы от רחק подчёркивает удалённость; «поодаль» естественно и литературно в современном русском.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: на расстоянии примерно одного выстрела из лука
  rationale: Сохраняет приблизительность и образ расстояния, измеряемого дальностью выстрела из лука.
- source_word: הַיָּלֶד
  choice: мальчика
  rationale: В данном контексте ילד обозначает мальчика или юношу; «мальчик» понятно современному читателю и сохраняет эмоциональную окраску сцены.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Не видеть мне смерти мальчика
  rationale: Конструкция с אַל и формой первого лица передана русским волитивным оборотом; номинальная формулировка «смерти мальчика» сохраняется без превращения в придаточное предложение.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: возвысила свой голос
  rationale: Сохраняет образ распространённой древнееврейской идиомы; следующее «заплакала» уточняет, что речь идёт о громком плаче.
- source_word: וַתֵּבְךְּ
  choice: заплакала
  rationale: Точно обозначает начало плача и не смешивает его с предшествующим выражением о голосе.
- source_word: לָהּ
  choice: села
  rationale: Этический или возвратный датив не требует отдельного словесного соответствия в естественном русском; значение отдельного расположения уже выражено словами «напротив него, поодаль».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным строем. Повтор «напротив него» и последовательность союзов сохранены ради структуры и эмоционального ритма древнееврейского текста; архаичные формы вроде «отрок» и «да не увижу» не использованы.
