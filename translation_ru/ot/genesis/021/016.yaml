  source_fidelity: 'Смысл в целом передан точно: сохранены удалённое положение Агари относительно мальчика, образ дальности выстрела из лука, её нежелание видеть его смерть и последующий плач. Однако в заключительном повествовательном глаголе следует сохранить действие «села», а не состояние «сидела»; также привязку сноски нужно поставить к словам, для которых она предлагает вариант.'
