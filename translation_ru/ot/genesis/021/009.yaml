base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: ru
  text: И увидела Сарра, как сын египтянки Агари, которого та родила Аврааму, смеётся[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «играет»; возможно: «насмехается». Еврейское слово может обозначать смех, игру или насмешливое поведение; точный оттенок здесь не указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: И увидела Сарра
  rationale: Последовательная глагольная форма вводит очередное событие повествования; союз «и» передаёт его без добавления невыраженного противопоставления.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: сын египтянки Агари
  rationale: Сочетание называет сына через его мать и указывает её происхождение. Такой порядок слов естественен для современного русского языка и сохраняет оба элемента исходного текста.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: которого та родила Аврааму
  rationale: Относительное предложение напоминает, что Агарь родила этого сына Аврааму. Местоимение «та» ясно указывает на Агарь и не смешивает её с Саррой.
- source_word: מְצַחֵק
  choice: смеётся
  rationale: Причастие от צחק может обозначать смех, игру либо, в данном контексте, насмешливое поведение. Нейтральное «смеётся» сохраняет широту значения, а контекстуальные варианты приведены в сноске.
theological_decisions:
- issue: Характер поступка сына Агари в слове מְצַחֵק
  choice: 'В основном тексте передать нейтрально: «смеётся»'
  alternative: «играет» или «насмехается»
  rationale: В еврейском тексте нет ни прямого дополнения, ни отдельного указания на враждебность. Отрицательный оттенок возможен по контексту и позднейшему каноническому осмыслению, но само слово его однозначно не устанавливает; поэтому смысловая напряжённость сохраняется.
translation_notes:
  register: Современный литературный русский язык; повествовательный тон остаётся простым и торжественным. Конструкция «увидела, как…» естественно передаёт восприятие продолжающегося действия.
