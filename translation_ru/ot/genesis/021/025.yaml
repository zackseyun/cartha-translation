lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: предъявил претензию
  rationale: В данном контексте глагол обозначает упрёк или предъявление обвинения в споре; сочетание естественно передаёт официальный характер разбирательства.
- source_word: עַל אֹדוֹת
  choice: из-за
  rationale: Передаёт основание претензии — спор о колодце — кратко и естественно по-русски.
- source_word: בְּאֵר הַמַּיִם
  choice: колодца
  rationale: Буквально «колодец воды»; в русском слово «колодец» уже предполагает воду, поэтому дополнение было бы избыточным.
- source_word: גָּזְלוּ
  choice: захватили
  rationale: Передаёт насильственное или неправомерное присвоение колодца, не сужая смысл до обычной кражи.
