    rationale: Глагол גוּר стоит в перфекте и относится к уже имевшему место проживанию Авраама в этой земле. «Где ты жил как пришелец» передаёт это точнее, не исключая продолжения его пребывания.
  - severity: low
    issue: «Поступай» в ответной части
    rationale: תַּעֲשֶׂה после клятвенного требования выражает ожидаемое обязательство. «Окажи» делает связь с «добротой» ясной и сохраняет направленность будущего действия.
  - severity: low
    issue: «Милость» для חֶסֶד
    rationale: В договорной просьбе речь о ранее проявленной доброте, которую следует ответно оказать. «Доброта» более идиоматична и не привносит оттенок иерархического помилования.
