review_pass:
  verdict: revise
  source_fidelity: В целом переданы клятвенное обязательство, запрет на неверное обращение, два обозначения потомства, взаимность חֶסֶד и статус Авраама как пришельца. Однако настоящее «живёшь» сглаживает завершённо-накопительный оттенок גַּרְתָּה («где ты жил/поживал как пришелец»), а «поступай» менее точно передаёт требуемое в клятве обязательство, направленное в будущее.
  naturalness: Текст литературен и понятен. «Поступить вероломно» возможно, но в современном русском несколько книжно и сильнее, чем широкий смысл שקר в данном контексте; «поступить нечестно» естественнее и сохраняет несводимость глагола к одной лишь лжи.
  terminology: «Богом» точно передаёт בֵּאלֹהִים в формуле клятвы. Для חֶסֶד в контексте взаимного благожелательного отношения предпочтительнее «доброта», чем «милость», поскольку последняя в русском легче предполагает одностороннее снисхождение. «Дети» и «потомки» сохраняют два члена נִין/נֶכֶד, не навязывая спорную узкую схему родства.
  issues:
