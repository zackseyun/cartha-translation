base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: ru
  text: Итак, поклянись мне здесь Богом, что не поступишь нечестно ни со мной, ни с моими детьми, ни с моими потомками. Как я проявил к тебе доброту, так и ты окажи её мне и земле, в которой ты жил как пришелец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Сочетание вводит требование как вывод из предшествующих слов; «итак» естественно передаёт дискурсивную связь без избыточного временного акцента.
- source_word: אִם תִּשְׁקֹר לִי
  choice: что не поступишь вероломно ... со мной
  rationale: В формуле клятвы אִם вводит содержание отрицательного обязательства, а שׁקר означает ложное или неверное, вероломное поведение, не только словесную ложь.
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: моими детьми ... моими потомками
  rationale: Парные термины обозначают продолжение рода; выбранное выражение сохраняет два звена и соответствует контексту договора, не навязывая чрезмерно узкой генеалогической схемы.
- source_word: כַּחֶסֶד
  choice: Как ... милость, так
  rationale: חֶסֶד здесь означает благожелательное, верное отношение, выраженное делом; «милость» сохраняет вес библейского понятия, а конструкция передаёт сравнительную норму взаимности.
- source_word: גַּרְתָּה בָּהּ
  choice: живёшь как пришелец
  rationale: Глагол גור описывает проживание чужеземца без полного статуса коренного жителя; настоящее время уместно для продолжающегося пребывания Авраама.
theological_decisions:
- issue: Смысл חֶסֶד в договорной речи
  choice: милость
  alternative: доброта / верность
  rationale: «Милость» сохраняет нравственную и отношенческую насыщенность слова, но текст не уточняет его как специальный богословский термин или формальный завет.
- issue: Формула אִם после повеления поклясться
  choice: 'передать как отрицательное содержание клятвы: «что не поступишь»'
  alternative: 'буквально: «если поступишь вероломно»'
  rationale: В клятвенной формуле подразумевается самоосуждение при нарушении; русское «что не...» ясно передаёт обязательство, не добавляя отсутствующего в тексте проклятия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным, при этом сохранены клятвенная формула, три адресата обязательства и статус Авраама как пришельца.
