translation:
  language: ru
  text: Ребёнок вырос и был отнят от груди, и Авраам устроил большой пир в день, когда Исаака отняли от груди.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: рос
  rationale: В контексте развития ребёнка глагол גדל естественно означает физический рост; «рос» точно и по-русски естественно передаёт продолжительное взросление.
- source_word: הַיֶּלֶד
  choice: ребёнок
  rationale: יֶלֶד может обозначать ребёнка или мальчика. Здесь нейтральное «ребёнок» естественно для повествования о возрасте отнятия от груди и не добавляет лишней возрастной конкретизации.
- source_word: וַיִּגָּמַל
  choice: был отнят от груди
  rationale: Нифаль глагола גמל здесь обозначает прекращение грудного вскармливания. Пассивная формулировка сохраняет грамматический ракурс еврейского текста.
- source_word: וַיַּעַשׂ
  choice: устроил
  rationale: Хотя עשה буквально имеет широкое значение «сделал», в сочетании с «пир» современное русское «устроил» является естественным соответствием.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: большой пир
  rationale: מִשְׁתֶּה обозначает праздничное пиршество, нередко с напитками; «большой пир» сохраняет и существительное, и характеристику גָדוֹל без излишней архаичности.
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: В русском языке эта временная конструкция естественно передаёт конкретный день события и связывает его с последующим инфинитивным оборотом.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: когда Исаака отняли от груди
  rationale: Инфинитивная конструкция с אֶת и именем Исаака обозначает событие его отнятия от груди. Русская неопределённо-личная пассивная по смыслу конструкция ясна и естественна.
