base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: ru
  text: 'В то время Авимелех и Фихол, военачальник войска Авимелеха, сказали Аврааму: «Бог с тобой во всём, что ты делаешь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «Бог», в некоторых контекстах может означать «бог» или «божество», однако здесь оно, скорее всего, относится к Богу, благословляющему Авраама.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: В то время
  rationale: Естественно вводит новую сцену и передаёт временное выражение без тяжеловесного буквального «И было в то время».
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: Авимелех и Фихол
  rationale: Имена переданы в традиционной русской библейской форме.
- source_word: שַׂר צְבָאוֹ
  choice: военачальник его войска
  rationale: Передаёт военную должность שַׂר и собирательное значение צָבָא; формулировка ясна в современном русском.
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: сказали Аврааму
  rationale: Единственное число еврейского сказуемого при последующем составном подлежащем естественно передаётся русским множественным числом; формульное לֵאמֹר не воспроизводится отдельно как избыточное перед прямой речью.
- source_word: אֱלֹהִים עִמְּךָ
  choice: Бог с тобой
  rationale: В контексте אֱלֹהִים естественнее обозначает Бога, чьё благоволение к Аврааму признаёт Авимелех; именная конструкция естественна по-русски.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: во всём, что ты делаешь
  rationale: Точно и естественно передаёт всеохватность выражения и значение причастия как обычного, продолжающегося действия.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים в речи Авимелеха
  choice: Бог
  alternative: бог / божество
  rationale: Хотя форма אֱלֹהִים допускает иные значения в других контекстах, здесь повествование говорит о Божьем благословении Авраама; прописная буква лучше всего передаёт наиболее вероятный смысл, не приписывая Авимелеху дополнительных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаизма «и было» и без избыточного «сказали… говоря». Местоимение «ты» сохраняет прямой и обычный для библейского повествования характер обращения.
