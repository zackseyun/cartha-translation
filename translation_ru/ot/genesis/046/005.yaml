  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: ru
  text: И отправился Иаков из Вирсавии. Сыновья Израиля повезли своего отца Иакова, своих малых детей и своих жён в повозках, которые прислал фараон, чтобы перевезти его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: отправился
  rationale: Буквально глагол означает «встал», но в сочетании с исходным пунктом пути обозначает начало движения; «отправился» естественно передаёт этот смысл по-русски.
- source_word: מִבְּאֵר שָׁבַע
  choice: из Вирсавии
  rationale: Использовано традиционное русское библейское название топонима; предлог «из» прямо передаёт מִן.
- source_word: וַיִּשְׂאוּ
  choice: повезли
  rationale: נשׂא означает «нести, перевозить»; поскольку далее прямо названы повозки, «повезли» точно и естественно выражает способ перемещения.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыновья Израиля
  rationale: В данном контексте речь именно о сыновьях Иакова, названного Израилем, а не обо всём народе.
- source_word: אֶת יַעֲקֹב אֲבִיהֶם
  choice: своего отца Иакова
  rationale: Такой порядок слов естественен для современного русского языка и сохраняет как родство, так и имя.
- source_word: טַפָּם
  choice: своих малых детей
  rationale: טַף обозначает прежде всего маленьких детей; вариант сохраняет возрастной оттенок и звучит яснее, чем субстантивированное «малых».
- source_word: נְשֵׁיהֶם
  choice: жён
  rationale: В семейном контексте נָשִׁים означает жён.
- source_word: בָּעֲגָלוֹת
  choice: в повозках
  rationale: עֲגָלוֹת — колёсные повозки для перевозки людей и имущества; «повозки» соответствует древнему контексту.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: которые прислал фараон
  rationale: Русский совершенный вид передаёт предшествующее действие без необходимости в дополнительной временной конструкции.
- source_word: לָשֵׂאת אֹתוֹ
  choice: чтобы перевезти его
  rationale: Инфинитив выражает цель; местоимение единственного числа естественнее всего относится к Иакову.
theological_decisions: []
