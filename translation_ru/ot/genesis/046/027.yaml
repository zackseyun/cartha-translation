  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: ru
  text: А сыновей Иосифа, родившихся в Египте, было двое[a]. Всего людей дома Иакова, пришедших в Египет, было семьдесят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «две души». Здесь еврейское נֶפֶשׁ означает отдельного человека при подсчёте членов семьи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: А сыновей Иосифа
  rationale: בֵּן во множественном числе здесь обозначает именно сыновей Иосифа, уже названных в контексте; союз ו передан естественным русским «а», связывающим итоговую фразу с предыдущим перечислением.
- source_word: אֲשֶׁר יֻלַּד לוֹ בְמִצְרַיִם
  choice: родившихся у него в Египте
  rationale: Пассивная форма ילד с לוֹ естественно передаётся по-русски оборотом «родившихся у него»; местное значение בְמִצְרַיִם сохранено.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: было двое
  rationale: נֶפֶשׁ в родословном подсчёте означает отдельного человека. После существительного мужского рода «сыновей» русское собирательное числительное «двое» естественно выражает число, не создавая неуклюжего сочетания «две личности» или богословски нагруженного «две души».
- source_word: כָּל הַנֶּפֶשׁ לְבֵית יַעֲקֹב
  choice: Всего тех, кто принадлежал к дому Иакова
  rationale: Единственное נֶפֶשׁ при כָּל имеет собирательно-счётное значение. Конструкция לְבֵית обозначает принадлежность к семье или дому Иакова; развёрнутый русский оборот сохраняет этот смысл и звучит естественно.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: и пришёл в Египет
  rationale: Причастие согласовано в еврейском с собирательным הַנֶּפֶשׁ; в русском относительном обороте «тех, кто» нормативно употреблено единственное число. Направительный суффикс в מִצְרַיְמָה передан предлогом «в» при глаголе движения.
- source_word: שִׁבְעִים
  choice: было семьдесят
  rationale: Безглагольное еврейское предложение сообщает итоговое число; русская конструкция с «было» ясно и кратко передаёт подсчёт.
theological_decisions:
- issue: Значение נֶפֶשׁ в родословном подсчёте
  choice: 'человек как единица счёта, передано контекстуально: «двое» и «тех»'
  alternative: «душ» / «души»
  rationale: Здесь נֶפֶשׁ служит обозначением отдельных членов семьи и не формулирует учения о составе человека. Контекстуальная передача избегает постороннего антропологического оттенка, сохраняя смысл подсчёта.
- issue: Общий итог «семьдесят» и различающиеся древние текстовые традиции
  choice: сохранено масоретское чтение «семьдесят»
  alternative: «семьдесят пять» в Септуагинте и Деяниях 7:14
  rationale: Перевод следует указанному источнику WLC, где стоит שִׁבְעִים, не пытаясь согласовать его с иной древней счётной традицией.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «сыновей… было двое» сохраняет счётную структуру исходного текста, оставаясь естественной по-русски; «дом Иакова» сохраняет семейно-корпоративный образ.
