base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: ru
  text: Вот[a] имена сыновей Израиля, пришедших в Египет, — Иакова и его сыновей. Первенец Иакова — Рувим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «И вот имена…»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Вводит новый родословный перечень естественным для современного русского языка образом. Соединительное וְ не обязательно передавать отдельным союзом; более буквальный вариант отмечен в сноске.
- source_word: שְׁמוֹת
  choice: имена
  rationale: Обычное значение формы множественного числа в сопряжённом сочетании; здесь слово вводит перечень потомков.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыновей Израиля
  rationale: Сохраняет мужской род исходного выражения и личное имя Израиль; ближайший контекст перечисляет мужчин по именам.
- source_word: הַבָּאִים
  choice: пришедших
  rationale: Определённое причастие описывает тех, кто пришёл; русское действительное причастие прошедшего времени кратко и точно передаёт ретроспективный характер заголовка.
- source_word: מִצְרַיְמָה
  choice: в Египет
  rationale: Направительное окончание выражает движение к Египту; «в Египет» — естественный русский эквивалент.
- source_word: יַעֲקֹב וּבָנָיו
  choice: Иаков и его сыновья
  rationale: Сохраняет пояснительное приложение еврейского текста. Двоеточие ясно вводит названную группу, не устраняя некоторой синтаксической напряжённости оригинала.
- source_word: בְּכֹר יַעֲקֹב
  choice: Первенец Иакова
  rationale: Точно передаёт конструкцию принадлежности и подчёркивает порядок рождения.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Соотношение выражений «сыновья Израиля» и «Иаков и его сыновья»
  choice: Сохранить оба выражения без пояснительного перефразирования
  alternative: Передать первое выражение как «потомки Израиля» или перестроить фразу так, чтобы Иаков не воспринимался как часть последующего приложения
  rationale: Еврейский текст непосредственно ставит рядом оба обозначения. Расширительное «потомки» сгладило бы реальную синтаксическую напряжённость и ослабило бы конкретное значение בְּנֵי в начале родословного перечня.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. «Вот» естественно открывает перечень; традиционные формы имён «Иаков» и «Рувим» сохранены. Пунктуация помогает прочитать пояснительное приложение, не добавляя отсутствующих в источнике связок.
