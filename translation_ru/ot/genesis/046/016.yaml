  text: וּ/בְנֵ֣י גָ֔ד צִפְי֥וֹן וְ/חַגִּ֖י שׁוּנִ֣י וְ/אֶצְבֹּ֑ן עֵרִ֥י וַֽ/אֲרוֹדִ֖י וְ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: ru
  text: 'Сыновья Гада: Цифион[a], Хагги, Шуни, Эцбон, Эри, Ароди и Арели.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя צִפְיוֹן здесь передано как «Цифион»; в Числах 26:15 встречается форма «Цефон».
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: Сыновья Гада
  rationale: בְנֵי — форма сопряжённого состояния множественного числа от «сын»; в родословном перечне естественно передаётся как «сыновья». Начальный союз וּ продолжает структуру списка, но по-русски его можно не выражать отдельно без потери связи с контекстом.
- source_word: צִפְיוֹן
  choice: Цифион
  rationale: Имя передано по огласованной форме масоретского текста данного стиха; написание сохраняет сочетание -фион, отличающее эту форму от Цефон в Числах 26:15.
- source_word: וְחַגִּי
  choice: Хагги
  rationale: Имя транслитерировано с передачей начального ח через «х» и удвоенного גּ через «гг».
- source_word: שׁוּנִי
  choice: Шуни
  rationale: Прямая передача еврейского имени современными русскими буквами.
- source_word: וְאֶצְבֹּן
  choice: Эцбон
  rationale: 'Транслитерация отражает огласовку и согласные масоретского текста: אֶ как «э», צ как «ц», בּ как «б».'
- source_word: עֵרִי
  choice: Эри
  rationale: Прямая русская передача еврейского имени с начальным «э».
- source_word: וַאֲרוֹדִי
  choice: Ароди
  rationale: Прямая передача огласованной формы имени; союз выражен синтаксисом русского перечисления.
- source_word: וְאַרְאֵלִי
  choice: Арели
  rationale: Имя транслитерировано по масоретской огласовке; предшествующий союз передан русским «и» перед последним членом списка.
