  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: ru
  text: 'А сыновья Вениамина: Бела, Бехер[a], Ашбел, Гера, Нааман, Эхи[b], Рош, Муппим[c], Хуппим и Ард[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя בֶּכֶר передано как «Бехер»; возможна также передача «Бекер».
    reason: lexical_alternative
  - marker: b
    text: В параллельной родословной Вениамина в Числах 26:38 вместо Эхи назван Ахирам.
    reason: cross_reference
  - marker: c
    text: 'В некоторых параллельных родословных встречается вариант имени «Шуппим»; здесь перевод следует масоретскому тексту: «Муппим».'
    reason: textual_variant
  - marker: d
    text: В родословной Вениамина в 1 Паралипоменон 8:3 встречается родственная форма имени «Аддар»; в этом стихе стоит «Ард».
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: А сыновья
  rationale: Форма множественного числа в сопряжённом состоянии от בֵּן с союзом וְ. «А сыновья» естественно продолжает перечень и сохраняет присоединительный характер еврейского текста.
- source_word: בִנְיָמִן
  choice: Вениамина
  rationale: Устоявшаяся русская форма библейского личного имени; родительный падеж обусловлен конструкцией «сыновья Вениамина».
- source_word: בֶּלַע
  choice: Бела
  rationale: Транслитерация личного имени с учётом его устоявшейся русской формы.
- source_word: בֶּכֶר
  choice: Бекер
  rationale: Транслитерация непосредственно передаёт согласные еврейской формы; традиционный русский вариант «Бехер» отмечен в сноске.
- source_word: אַשְׁבֵּל
  choice: Ашбел
  rationale: Прямая и понятная русская транслитерация личного имени.
- source_word: גֵּרָא
  choice: Гера
  rationale: Транслитерация личного имени в соответствии с еврейской формой и русской библейской традицией.
- source_word: נַעֲמָן
  choice: Нааман
  rationale: Передаёт еврейское נַעֲמָן и сохраняет различимые гласные имени.
- source_word: אֵחִי
  choice: Эхи
  rationale: Транслитерация формы масоретского текста; начальное «Э» ясно передаёт начальный гласный. Отличающееся имя в параллельной родословной отмечено в сноске.
- source_word: רֹאשׁ
  choice: Рош
  rationale: В перечне это личное имя, поэтому оно транслитерируется, а не переводится как нарицательное «голова» или «глава».
- source_word: מֻפִּים
  choice: Муппим
  rationale: Передаёт форму масоретского текста; вариант из параллельных родословных вынесен в сноску.
- source_word: חֻפִּים
  choice: Хуппим
  rationale: Прямая транслитерация имени в масоретском тексте.
- source_word: אָרְדְּ
  choice: Ард
  rationale: Следует форме данного стиха; родственная форма из параллельной родословной отмечена в сноске.
