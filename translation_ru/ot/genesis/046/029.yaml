base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: ru
  text: Иосиф запряг свою колесницу и отправился в Гошен навстречу своему отцу Израилю. Он предстал перед ним[a], бросился ему на шею и долго[b] плакал у него на шее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «показался ему» или «явился ему». Еврейский глагол может означать, что Иосиф дал отцу увидеть себя при встрече.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ещё» или «всё ещё»; в данном контексте слово подчёркивает, что Иосиф продолжал плакать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר יוֹסֵף מֶרְכַּבְתּוֹ
  choice: Иосиф запряг свою колесницу
  rationale: Глагол אָסַר буквально означает «связывать, привязывать», а с колесницей обозначает её подготовку к поездке, то есть запряжку. Русское «запряг колесницу» естественно передаёт этот образ.
- source_word: וַיַּעַל
  choice: отправился
  rationale: Хотя עָלָה буквально часто означает «подниматься, идти вверх», здесь оно вводит поездку Иосифа к месту встречи. «Отправился» естественно для современного русского повествования и не навязывает неясную читателю топографию.
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: навстречу своему отцу Израилю
  rationale: Сохранено имя «Израиль», употреблённое в еврейском тексте, а синтаксис перестроен в соответствии с естественным русским порядком слов.
- source_word: גֹּשְׁנָה
  choice: в Гошен
  rationale: Направительный суффикс -ָה обозначает движение к Гошену; поэтому русское «в Гошен» точнее передаёт форму источника.
- source_word: וַיֵּרָא אֵלָיו
  choice: предстал перед ним
  rationale: Нифаль глагола ראה может означать «показался, явился, дал себя увидеть». «Предстал перед ним» естественно описывает личную встречу, сохраняя основную образность глагола.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: бросился ему на шею
  rationale: Буквально выражение означает «пал ему на шею» и описывает эмоциональное объятие. Русский оборот «бросился на шею» сохраняет и движение, и эмоциональную силу сцены.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו
  choice: плакал, обнимая его
  rationale: Повторное «на его шее» в современном русском звучало бы тяжеловесно. Деепричастный оборот ясно сохраняет физическую близость и продолжение объятия во время плача.
- source_word: עוֹד
  choice: долго
  rationale: В данном контексте עוֹד указывает на продолжительность плача. «Долго» естественно выражает этот смысл, хотя более формально слово можно передать как «ещё».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Идиоматические обороты «предстал перед ним» и «бросился ему на шею» сохраняют образность еврейского текста, не создавая неестественной русской фразы. Добавление «Когда Иосиф» устраняет возможную неясность местоименного субъекта, не меняя смысла сцены.
