  text: בָּנָ֞י/ו וּ/בְנֵ֤י בָנָי/ו֙ אִתּ֔/וֹ בְּנֹתָ֛י/ו וּ/בְנ֥וֹת בָּנָ֖י/ו וְ/כָל זַרְע֑/וֹ הֵבִ֥יא אִתּ֖/וֹ מִצְרָֽיְמָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: ru
  text: Своих сыновей и внуков, бывших с ним, своих дочерей и внучек[a] — всё своё потомство[b] — он привёл с собой в Египет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновей своих сыновей» и «дочерей своих сыновей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всех своих потомков»; буквально: «всё своё семя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: своих сыновей
  rationale: Слово обозначает сыновей и противопоставлено далее дочерям, поэтому более широкое «детей» здесь неточно.
- source_word: וּבְנֵי בָנָיו
  choice: и внуков
  rationale: Буквально «сыновей своих сыновей»; русское «внуков» естественно передаёт родственную связь.
- source_word: אִתּוֹ
  choice: бывших с ним / с собой
  rationale: Предлог с местоименным суффиксом выражает совместное пребывание и сопровождение; первое употребление передано при перечислении, второе — при глаголе движения.
- source_word: בְּנֹתָיו
  choice: своих дочерей
  rationale: Точное обозначение потомков женского пола, соответствующее противопоставлению сыновьям.
- source_word: וּבְנוֹת בָּנָיו
  choice: и внучек
  rationale: Буквально «дочерей своих сыновей»; естественный русский эквивалент — «внучек».
- source_word: וְכָל זַרְעוֹ
  choice: всё своё потомство
  rationale: זֶרַע буквально означает «семя», а в данном семейно-генеалогическом контексте собирательно обозначает всех потомков.
- source_word: הֵבִיא
  choice: привёл
  rationale: Каузативная форма глагола בוא означает «привести/принести». Поскольку речь идёт о людях, «привёл» по-русски точнее и естественнее.
- source_word: מִצְרָיְמָה
  choice: в Египет
  rationale: Направительный суффикс указывает на движение к Египту; контекст подразумевает прибытие внутрь страны, что естественно передаётся как «в Египет».
