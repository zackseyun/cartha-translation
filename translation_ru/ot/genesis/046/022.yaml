- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит итог о перечисленных ранее потомках; русское «вот» естественно связывает его с предшествующим списком, не требуя выражать отсутствующую в еврейском именном предложении временную связку.
- source_word: בְּנֵי רָחֵל
  choice: сыновья Рахили
  rationale: Сохраняет буквальное гендерное обозначение בְּנֵי и родительную конструкцию; в данном контексте речь идёт о линии потомков Рахили.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: которые родились у Иакова
  rationale: Передаёт пассив ילד и отношение родительства, выраженное לְ; «родились у Иакова» — естественная современная русская генеалогическая формулировка.
- source_word: כָּל נֶפֶשׁ
  choice: всего … человек
  rationale: В генеалогическом подсчёте נֶפֶשׁ обозначает отдельного человека; русская счётная конструкция «всего четырнадцать человек» ясно передаёт идиоматический смысл.
- source_word: אַרְבָּעָה עָשָׂר
  choice: четырнадцать
  rationale: Прямое соответствие количественному числительному.
