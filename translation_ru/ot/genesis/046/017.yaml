base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: ru
  text: 'Сыновья Ашера: Имна, Ишва, Ишви и Берия; их сестра — Серах. Сыновья Берии: Хевер и Малкиэл.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Сыновья Ашера
  rationale: Конструктивная форма множественного числа בְּנֵי в родословии естественно передаётся как «сыновья». Начальный союз не выражен отдельно, поскольку стих представляет собой продолжение перечня, а по-русски союз здесь не обязателен.
- source_word: יִמְנָה
  choice: Имна
  rationale: Передача еврейского личного имени в форме, естественной для русской библейской традиции; начальный йод перед гласным отдельно не обозначается.
- source_word: וְיִשְׁוָה
  choice: Ишва
  rationale: Прямая русская транслитерация личного имени; союз включён в структуру перечисления.
- source_word: וְיִשְׁוִי
  choice: Ишви
  rationale: Прямая русская транслитерация личного имени с сохранением различия между Ишвой и Ишви.
- source_word: וּבְרִיעָה
  choice: и Берия
  rationale: Имя передано транслитерацией, а союз сохранён перед последним членом русского перечисления.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: их сестра — Серах
  rationale: Еврейское именное приложение буквально сообщает «и Серах, их сестра». Русский порядок слов и тире ясно передают родственную связь без добавления отсутствующего в источнике глагола «была».
- source_word: וּבְנֵי בְרִיעָה
  choice: Сыновья Берии
  rationale: Начало вложенного родословного перечня передано отдельным предложением; начальный союз опущен как необязательный в современном русском перечислении.
- source_word: חֶבֶר
  choice: Хевер
  rationale: Транслитерация сохраняет начальный еврейский согласный ח как «х» и внутренний ב без дагеша как «в».
- source_word: וּמַלְכִּיאֵל
  choice: и Малкиэл
  rationale: 'Транслитерация непосредственно отражает מַלְכִּיאֵל: каф с дагешем передаётся как «к», а компонент אֵל — как «эл»; союз естественно связывает два имени.'
