lexical_decisions:
- source_word: וּבְנֵי נַפְתָּלִי
  choice: И сыновья Нафтали
  rationale: Сохраняется присоединительный союз ו, характерный для продолжающегося перечня, а בְּנֵי передаётся прямым генеалогическим обозначением «сыновья». Имя נַפְתָּלִי транслитерировано близко к еврейской форме как «Нафтали».
- source_word: יַחְצְאֵל
  choice: Яхцеэл
  rationale: Транслитерация передаёт начальный йод как «Я», ח как «х», צ как «ц» и раздельное звучание гласных в конечной части имени.
- source_word: וְגוּנִי
  choice: Гуни
  rationale: Имя передано русской транслитерацией; союз выражен структурой перечисления.
- source_word: וְיֵצֶר
  choice: Ецер
  rationale: Начальный י перед гласной передан как «Е», а צ — как «ц»; форма близка к масоретскому чтению.
- source_word: וְשִׁלֵּם
  choice: Шиллем
  rationale: Удвоенное «л» отражает дагеш в ל и позволяет точнее передать еврейскую форму имени.
