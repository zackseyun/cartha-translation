  yaml_path: translation/ot/genesis/046/013.yaml
  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: ru
  text: 'И сыновья Иссахара: Фола, Фува[a], Иов[b] и Шимрон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Фува также передают как Фуа.
    reason: lexical_alternative
  - marker: b
    text: В 1 Пар. 7:1 вместо Иова назван Иашув.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Сочетание передаёт конструктивную форму множественного числа בְּנֵי и сохраняет соединительный союз וּ, характерный для продолжающегося родословного перечня.
- source_word: יִשָׂשכָר
  choice: Иссахара
  rationale: Традиционная и общепонятная русская форма личного имени; родительный падеж обусловлен сочетанием «сыновья Иссахара».
- source_word: תּוֹלָע
  choice: Фола
  rationale: Традиционная русская форма имени в библейской генеалогии.
- source_word: וּ/פֻוָּה
  choice: Фува
  rationale: Форма передаёт еврейское פֻוָּה и соответствует укоренившейся русской библейской традиции; вариант «Фуа» отмечен в сноске.
- source_word: וְ/יוֹב
  choice: Иов
  rationale: Перевод следует масоретскому тексту данного стиха, где стоит יוֹב; отличающееся чтение 1 Пар. 7:1 сохранено в сноске.
- source_word: וְ/שִׁמְרוֹן
  choice: и Шимрон
  rationale: Имя передано современной русской транслитерацией, а присоединённый союз сохранён перед последним элементом перечня.
theological_decisions:
- issue: Различие между Быт. 46:13 и 1 Пар. 7:1 в имени третьего сына Иссахара
  choice: В основном тексте — «Иов»
  alternative: «Иашув» по 1 Пар. 7:1
  rationale: Основной текст должен отражать чтение WLC в Быт. 46:13, не устраняя текстовое различие; параллельное чтение указано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой структуры родословного перечня. Для известных имён использованы традиционные русские формы; менее укоренившееся имя שִׁמְרוֹן передано как «Шимрон».
