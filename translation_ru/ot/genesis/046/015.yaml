base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: ru
  text: Вот сыновья Лии, которых она родила Иакову в Паддан-Араме, а также его дочь Дина. Всего сыновья и дочери Иакова составляли тридцать три человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: сыновья Лии
  rationale: Сохранено прямое значение мужского множественного числа в заголовке родословного перечня; более широкое «дети» устранило бы различие между сыновьями и отдельно упомянутой Диной.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: которых она родила Иакову
  rationale: При подлежащем женского рода глагол יָלַד означает «родить»; русская конструкция сохраняет и материнский смысл, и отношение к Иакову.
- source_word: בְּפַדַּן אֲרָם
  choice: в Паддан-Араме
  rationale: Географическое название передано транслитерацией и оформлено согласно нормам современного русского языка.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: а также его дочь Дина
  rationale: «А также» естественно передаёт добавление Дины после заголовка «сыновья Лии»; местоимение «его» относится к Иакову, как в еврейском тексте.
- source_word: כָּל נֶפֶשׁ
  choice: всего … тридцать три человека
  rationale: В генеалогическом подсчёте נֶפֶשׁ обозначает человека как единицу счёта, а не отдельно понимаемую «душу».
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: его сыновей и дочерей
  rationale: Сохранено явное различение сыновей и дочерей и множественное число обоих существительных.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: тридцать три
  rationale: Прямое соответствие еврейскому количественному числительному.
theological_decisions:
- issue: Значение נֶפֶשׁ при подсчёте членов семьи
  choice: человека
  alternative: души
  rationale: Контекст перечисления требует антропологически нейтрального значения «человек, лицо» и не вводит учения о составе человека.
- issue: Множественное число «дочерей» при явном упоминании Дины
  choice: сохранено «дочерей»
  alternative: заменить на единственное число или обобщающее «детей»
  rationale: Перевод сохраняет грамматическую форму и напряжение исходного текста, не исправляя перечень и не предлагая скрытого объяснения счёта.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и естественный, при этом сохранены генеалогическая формула, различение сыновей и дочерей и буквальное итоговое число.
