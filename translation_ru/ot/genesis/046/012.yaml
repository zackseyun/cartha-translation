base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: ru
  text: 'Сыновья Иуды: Ир, Онан, Шела, Перец и Зерах. Но Ир и Онан умерли в стране Ханаан. Сыновьями Переца были Хецрон и Хамул.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: Сыновья Иуды
  rationale: Сопряжённая конструкция передана естественно для русской родословной; начальный союз не выражен отдельно, поскольку стих продолжает перечень и по-русски связь ясна без него.
- source_word: עֵר
  choice: Ир
  rationale: Традиционная русская библейская передача личного имени.
- source_word: אוֹנָן
  choice: Онан
  rationale: Устоявшаяся русская форма личного имени.
- source_word: שֵׁלָה
  choice: Шела
  rationale: Транслитерация, близкая к еврейскому звучанию и понятная современному читателю.
- source_word: פֶרֶץ
  choice: Перец
  rationale: Транслитерация еврейского имени без перевода его возможного лексического значения.
- source_word: זָרַח
  choice: Зерах
  rationale: Транслитерация личного имени, близкая к форме оригинала.
- source_word: וַיָּמָת
  choice: умерли
  rationale: Хотя глагол в еврейском тексте стоит в единственном числе перед составным подлежащим, по смыслу он относится к Иру и Онану; русская грамматика требует множественного числа.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: в земле Ханаанской
  rationale: Сохранено явно выраженное слово «земля»; традиционная форма остаётся ясной и литературной.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: Сыновьями Переца были
  rationale: В генеалогическом контексте היה обозначает отождествление перечисляемых сыновей, а не становление.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Хецрон и Хамул
  rationale: Имена переданы транслитерацией, близкой к еврейскому тексту.
