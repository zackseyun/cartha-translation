  text: וְ/הָיָ֕ה כִּֽי יִקְרָ֥א לָ/כֶ֖ם פַּרְעֹ֑ה וְ/אָמַ֖ר מַה מַּעֲשֵׂי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/033.yaml
  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: ru
  text: 'И когда фараон позовёт вас и спросит: «Какое у вас занятие?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Оборот вводит ожидаемое будущее обстоятельство; современное русское «И когда» естественно передаёт временное значение без буквального и тяжеловесного «и будет, когда».
- source_word: יִקְרָא לָכֶם
  choice: позовёт вас
  rationale: קרא с ל здесь означает позвать или вызвать к себе. «Позовёт вас» естественно для ситуации приглашения к фараону и не усиливает официальность до «призовёт».
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Традиционная русская передача египетского царского титула; со строчной буквы как обозначение правителя.
- source_word: וְאָמַר
  choice: и спросит
  rationale: Буквально «и скажет», но непосредственно следующая прямая речь является вопросом. «Спросит» естественно передаёт речевое действие в русском языке, не меняя содержания.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Какое у вас занятие?
  rationale: מַעֲשֵׂיכֶם буквально связано с делом или работой, а в контексте обозначает род деятельности. «Какое у вас занятие?» ясно и достойно передаёт вопрос о профессии или промысле.
theological_decisions: []
