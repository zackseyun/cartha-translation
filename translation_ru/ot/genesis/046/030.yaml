lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено прямо употреблённое в еврейском тексте имя, без замены на «Иаков».
- source_word: אָמ֣וּתָה הַפָּעַם
  choice: Теперь я могу умереть
  rationale: Когортатив здесь выражает личную готовность умереть после исполнения заветного желания, а не просьбу о разрешении; הַפָּעַם указывает на наступивший момент.
- source_word: אַחֲרֵי רְאוֹתִי אֶת פָּנֶיךָ
  choice: я увидел твоё лицо
  rationale: Сохранён конкретный образ «лица»; временно-обстоятельственная конструкция естественно передана личной формой русского глагола.
- source_word: כִּי עוֹדְךָ חָי
  choice: и знаю, что ты ещё жив
  rationale: כִּי связывает увиденное лицо Иосифа с удостоверением того, что он жив. «Знаю» делает подразумеваемую логическую связь ясной по-русски, не меняя смысла; «ещё жив» передаёт продолженность עוֹד.
