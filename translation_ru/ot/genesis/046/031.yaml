  to: 'Тогда Иосиф сказал своим братьям и семье своего отца[a]: «Я поднимусь к фараону и доложу ему, а затем скажу: „Мои братья и семья моего отца, жившие в земле Ханаанской, пришли ко мне“».'
  rationale: Исправление сохраняет значение направленного глагола אֶעֱלֶה («поднимусь») и делает последовательность «доложу ... скажу» плавной в современном литературном русском. Содержание и объём семейного обозначения не изменены; сноска уточнена грамматически.
