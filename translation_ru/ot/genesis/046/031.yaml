base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: ru
  text: 'Тогда Иосиф сказал своим братьям и семье своего отца[a]: «Я поднимусь к фараону и доложу ему, а затем скажу: „Мои братья и семья моего отца, жившие в земле Ханаанской, пришли ко мне“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом отца»; здесь слово «дом» означает семью, домочадцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Иосиф сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: אֶל אֶחָיו
  choice: своим братьям
  rationale: В данном контексте речь идёт именно о братьях Иосифа; притяжательное «своим» соответствует русской норме при соотнесённости с подлежащим.
- source_word: וְאֶל בֵּית אָבִיו
  choice: и семье своего отца
  rationale: בֵּית אָב обозначает здесь семейно-родовую группу, а не здание; «семья» понятно и естественно выражает этот смысл.
- source_word: אֶעֱלֶה
  choice: Я пойду
  rationale: Буквально глагол означает «поднимусь», однако по-русски при движении к фараону без обозначения высоты естественнее «пойду»; направленность движения сохраняется контекстом.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: и доложу фараону
  rationale: Hiphil от נגד означает сообщить или довести до сведения; «доложу» уместно в контексте обращения к правителю.
- source_word: וְאֹמְרָה אֵלָיו
  choice: Я скажу ему
  rationale: Сохраняет явное намерение Иосифа и естественно начинает отдельное предложение после сообщения о докладе.
- source_word: אַחַי וּבֵית אָבִי
  choice: Мои братья и семья моего отца
  rationale: Передаёт мужских родственников и семейно-родовую группу без сведения בַּיִת к физическому дому.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: жившие в земле Ханаанской
  rationale: В еврейском относительном обороте нет выраженной связки; причастный оборот по-русски естественно обозначает их прежнее место жительства.
- source_word: בָּאוּ אֵלַי
  choice: пришли ко мне
  rationale: Перфект обозначает завершённое прибытие; русское прошедшее совершенного вида естественно передаёт результативность.
