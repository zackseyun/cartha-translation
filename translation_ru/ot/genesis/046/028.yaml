  - severity: medium
    issue: Неясные местоименные референции в «чтобы он указал ему дорогу».
    rationale: В русском предложении «он» и «ему» могут быть соотнесены с Иудой, Иосифом или Иаковом. Еврейский текст также труден, но русская формулировка должна быть синтаксически ясной, а текстовую неопределённость следует отражать в примечании.
