lexical_decisions:
- source_word: שָׁלַח
  choice: послал
  rationale: Обычное и естественное соответствие глаголу «посылать» в повествовательном контексте.
- source_word: לְפָנָיו
  choice: вперёд
  rationale: При глаголе «послал» выражает отправку заранее, перед прибытием Иакова; по-русски «вперёд» звучит естественнее буквального «перед собой».
- source_word: לְהוֹרֹת
  choice: указал дорогу
  rationale: Каузативная форма от ירה может означать «направлять, указывать, наставлять». В контексте путешествия речь, вероятнее всего, идёт о практическом указании пути; добавленное «дорогу» делает сжатое еврейское выражение понятным по-русски.
- source_word: גֹּשְׁנָה
  choice: в Гошен
  rationale: Направительное окончание обозначает движение к Гошену; русское «в Гошен» естественно передаёт направление.
- source_word: וַיָּבֹאוּ
  choice: и они пришли
  rationale: Сохраняет обычное повествовательное значение בוא и последовательность событий.
- source_word: אַרְצָה גֹּשֶׁן
  choice: в землю Гошен
  rationale: Сохраняет обозначение Гошена как территории и направительное значение формы אַרְצָה.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Иуда / Иосиф / Гошен
  rationale: Имена переданы в привычной русской библейской форме; для топонима использована транслитерация «Гошен», близкая к еврейскому звучанию.
