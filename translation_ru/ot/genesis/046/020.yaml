base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ru
  text: У Иосифа в земле Египта родились Манассия и Ефрем, которых родила ему Асенат, дочь Потиферы, жреца города Она[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Он — египетский город, позднее известный под греческим названием Гелиополь.
    reason: Культурно-историческое пояснение древнего географического названия.
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: у Иосифа родились
  rationale: Нифаль глагола ילד обозначает рождение, а לְיוֹסֵף — отношение к отцу. Хотя еврейская глагольная форма стоит в единственном числе, далее названы два сына, поэтому по-русски естественно множественное число.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в Египетской земле
  rationale: Передаёт существительное אֶרֶץ и сохраняет несколько торжественный, но понятный современному читателю строй.
- source_word: אֲשֶׁר יָלְדָה לּוֹ אָסְנַת
  choice: которых родила ему Асенат
  rationale: Сохраняет относительное предложение и прямо передаёт материнское действие; местоимение относится к обоим сыновьям.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: дочь Поти-Фера
  rationale: Имя передано транслитерацией с разделением двух компонентов, что также помогает отличить его от имени Потифар.
- source_word: כֹּהֵן אֹן
  choice: жреца города Он
  rationale: 'В египетском контексте כֹּהֵן означает языческого жреца. Слово «города» добавлено для ясности: Он — географическое название, а не местоимение.'
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Манассия и Ефрем
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён; показатели прямого дополнения אֶת отдельно не переводятся.
