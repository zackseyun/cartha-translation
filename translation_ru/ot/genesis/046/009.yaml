  yaml_path: translation/ot/genesis/046/009.yaml
  text: 'And the sons of Reuben: Hanoch[a], Pallu, Hezron, and Carmi.'
translation:
  language: ru
  text: 'И сыновья Рувима: Ханох[a], Паллу, Хецрон и Карми.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Ханох; в русской библейской традиции это имя также передаётся как Енох.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «и», поскольку стих продолжает родословный перечень; בְנֵי — форма сопряжённого множественного числа от «сын».
- source_word: רְאוּבֵן
  choice: Рувима
  rationale: Использована устоявшаяся русская библейская форма имени; родительный падеж обусловлен конструкцией «сыновья Рувима».
- source_word: חֲנוֹךְ
  choice: Ханох
  rationale: Форма непосредственно передаёт еврейское имя и позволяет отличить её от традиционного варианта «Енох», употребляемого в русских переводах для того же еврейского имени.
- source_word: וּ/פַלּוּא
  choice: Паллу
  rationale: Имя передано близкой к еврейскому звучанию транслитерацией; союз выражен структурой русского перечисления.
- source_word: וְ/חֶצְרוֹן
  choice: Хецрон
  rationale: Транслитерация сохраняет начальный еврейский согласный ח как «х» и сочетание צר как «цр»; союз выражен структурой перечисления.
- source_word: וְ/כַרְמִי
  choice: Карми
  rationale: Имя передано прямой и естественной русской транслитерацией; заключительный союз ו передан как «и».
theological_decisions: []
