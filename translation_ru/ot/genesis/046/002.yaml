  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: ru
  text: 'И Бог обратился к Израилю в ночных видениях и сказал: «Иаков! Иаков!» Он ответил: «Вот я».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: обратился / сказал / ответил
  rationale: Глагол אָמַר означает «сказать». В первом случае «обратился» естественно вводит обращённую к Израилю речь, второй глагол передан как «сказал», а ответ Иакова — как «ответил»; это сохраняет все три речевых глагола и избегает неестественного повтора в русском языке.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте форма обозначает единого Бога и согласуется с глаголом в единственном числе.
- source_word: לְיִשְׂרָאֵל
  choice: к Израилю
  rationale: Повествователь прямо называет патриарха Израилем; это имя сохранено и не заменено именем Иаков.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: в ночных видениях
  rationale: Передаёт множественное число מַרְאֹת и связь видений с ночью естественным современным русским выражением.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Иаков! Иаков!
  rationale: Повтор имени сохранён; восклицательные знаки естественно передают настойчивый личный зов, не добавляя нового содержания.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Устойчивый русский эквивалент формулы отклика, выражающей присутствие и готовность отвечающего.
theological_decisions:
- issue: Чередование имён Израиль и Иаков
  choice: Сохранить «Израиль» в повествовательной части и «Иаков» в прямом обращении
  alternative: Унифицировать оба употребления как «Иаков» или как «Израиль»
  rationale: Такое чередование присутствует в еврейском тексте и может иметь литературное или богословское значение; перевод не должен его сглаживать.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет последовательность исходного текста, но речевые глаголы варьируются по нормам русского языка.
