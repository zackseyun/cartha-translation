  text: 'And the sons of Dan: Hushim[a].'
translation:
  language: ru
  text: 'И сыновья Дана: Хушим[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст предельно краток, буквально: «И сыновья Дана: Хушим». Хотя слово «сыновья» стоит во множественном числе, Хушим — личное имя, и в этой родословной он назван единственным потомком Дана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Союз וּ продолжает перечисление и естественно передаётся как «И». Существительное בְנֵי — форма множественного числа в сопряжённом состоянии от «сын»; сохранение множественного числа передаёт необычную форму еврейского текста.
- source_word: דָן
  choice: Дана
  rationale: Личное имя «Дан» поставлено в родительном падеже согласно нормам русского синтаксиса.
- source_word: חֻשִׁים
  choice: Хушим
  rationale: Личное имя передано транслитерацией. Хотя по форме оно похоже на множественное число, здесь это имя одного потомка; краткая безглагольная конструкция оригинала сохранена.
