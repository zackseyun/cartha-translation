base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: ru
  text: Я Сам сойду с тобой в Египет, и Я Сам также непременно выведу тебя; а Иосиф положит руку на твои глаза[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Иосиф закроет тебе глаза после смерти; это означает, что он будет рядом с Иаковом в смертный час.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Я Сам
  rationale: Самостоятельное местоимение употреблено дважды и несёт явное смысловое ударение; «Я Сам» естественно передаёт этот акцент по-русски.
- source_word: אֵרֵד
  choice: сойду
  rationale: Глагол ירד обозначает движение вниз; «сойду» сохраняет традиционную пространственную образность пути в Египет и звучит естественно.
- source_word: עִמְּךָ
  choice: с тобой
  rationale: Прямое соответствие сочетательному предлогу с суффиксом второго лица единственного числа.
- source_word: מִצְרַיְמָה
  choice: в Египет
  rationale: Направительный суффикс указывает на движение к Египту; по-русски это естественно передаётся конструкцией «в Египет».
- source_word: אַעַלְךָ גַם עָלֹה
  choice: непременно выведу тебя оттуда
  rationale: Каузативная форма עלה означает «поднять, вывести наверх», а инфинитив абсолютный усиливает обещание. «Непременно» передаёт усиление; «выведу… оттуда» естественно выражает обратное движение из Египта, не уточняя, относится ли обещание лично к Иакову, к перенесению его тела или также к его потомкам.
- source_word: וְיוֹסֵף
  choice: а Иосиф
  rationale: В русском контексте союз «а» естественно вводит заключительное обещание об Иосифе, не меняя смысл еврейского וְ.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: положит руку на твои глаза
  rationale: Перевод сохраняет конкретный еврейский образ и значение предлога עַל «на»; подразумеваемое закрытие глаз умершему разъяснено в сноске.
theological_decisions:
- issue: Смысл обещания «выведу тебя»
  choice: Сохранено обращённое лично к Иакову широкое обещание без уточнения способа его исполнения.
  alternative: Уточнить, что речь идёт либо о возвращении Иакова живым, либо о перенесении его тела для погребения, либо об исходе его потомков.
  rationale: Краткая еврейская формулировка допускает несколько взаимосвязанных уровней исполнения. Перевод не должен устранять эту богословскую многозначность.
- issue: Рука Иосифа на глазах Иакова
  choice: В основном тексте сохранён буквальный образ, а его обычный смысл указан в сноске.
  alternative: 'Передать только идиоматически: «Иосиф закроет тебе глаза».'
  rationale: Буквальный образ одновременно близок к оригиналу и понятен по-русски; сноска предотвращает неясность и указывает на присутствие Иосифа при смерти Иакова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, библейски уместным звучанием. Повтор «Я Сам» сохранён ради акцента оригинала; архаизмы и конфессионально окрашенные уточнения исключены.
