  yaml_path: translation/ot/genesis/046/019.yaml
  text: 'The sons of Rachel, Jacob’s wife: Joseph and Benjamin.'
translation:
  language: ru
  text: 'Сыновья Рахили, жены Иакова: Иосиф и Вениамин.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן («сын»). В родословном перечне речь идёт о непосредственных сыновьях Рахили, поэтому это точнее, чем «дети» или «потомки».
- source_word: רָחֵל
  choice: Рахили
  rationale: Личное имя передано в традиционной русской библейской форме и поставлено в родительном падеже согласно русскому синтаксису.
- source_word: אֵשֶׁת יַעֲקֹב
  choice: жены Иакова
  rationale: Сопряжённая конструкция означает «жена Иакова». Приложение естественно сохраняет структуру и смысл еврейского текста.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Личное имя передано в устойчивой русской библейской форме.
- source_word: וּבִנְיָמִן
  choice: и Вениамин
  rationale: Союз וּ передан как «и», а личное имя — в устойчивой русской библейской форме.
