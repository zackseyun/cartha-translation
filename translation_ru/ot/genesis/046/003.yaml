base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: ru
  text: 'И Он сказал: «Я — Бог, Бог твоего отца. Не бойся спускаться в Египет[a], потому что там Я сделаю тебя великим народом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не бойся сойти в Египет»; в еврейском выражении глагол «бояться» употреблён с инфинитивом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Бог
  rationale: В сочетании с артиклем слово подчёркнуто отождествляет Говорящего с Богом. В русском прямое «Я — Бог» естественно и точно; передача «Эль» была бы транслитерацией, а не переводом.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Бог твоего отца
  rationale: Сохраняется единственное число «отца» и прямая структура еврейского сочетания, указывающая на связь Божьего обещания с отцом Иакова.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Отрицательная конструкция выражает запрет поддаваться страху; «не бойся» — естественная и точная современная русская формулировка.
- source_word: מֵרְדָה
  choice: спускаться
  rationale: Инфинитив с предлогом после глагола страха означает «бояться сделать что-либо». Глагол движения вниз сохранён, поскольку в еврейском тексте путь в Египет представлен как спуск.
- source_word: מִצְרַיְמָה
  choice: в Египет
  rationale: Направительный суффикс обозначает движение к Египту; русское «в Египет» естественно передаёт место назначения.
- source_word: לְגוֹי גָּדוֹל
  choice: великим народом
  rationale: 'Предлог לְ при שׂים выражает результат: Иаков станет великим народом. Творительный падеж после «сделаю» ясно передаёт это значение.'
- source_word: אֲשִׂימְךָ
  choice: Я сделаю тебя
  rationale: Хотя שׂים часто означает «помещать» или «ставить», в данной результативной конструкции оно означает «сделать, превратить в».
- source_word: שָׁם
  choice: там
  rationale: Наречие указывает на Египет как на место исполнения обещания.
theological_decisions:
- issue: Обозначение предка в Божьем самооткровении
  choice: Бог твоего отца
  alternative: Бог твоих отцов
  rationale: Сохранено стоящее в еврейском тексте единственное число. Оно непосредственно связывает Божье ободрение Иакова с его отцом и не расширяется толковательно до множественного числа.
- issue: Образование великого народа
  choice: там Я сделаю тебя великим народом
  alternative: там Я произведу от тебя великий народ
  rationale: Основной перевод сохраняет грамматическую направленность обещания на самого Иакова («тебя») и результативный смысл конструкции, не заменяя её пояснением о потомках, хотя именно потомство подразумевается контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу, использованы как принятая русская издательская конвенция, не меняющая смысла оригинала. Образ движения «вниз» сохранён глаголом «спускаться».
