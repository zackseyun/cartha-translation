  yaml_path: translation/ot/genesis/046/011.yaml
  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: ru
  text: 'И сыновья Левия: Гирсон, Кааф и Мерари.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «И», чтобы сохранить последовательность родословного перечня; בְנֵי — форма сопряжённого состояния множественного числа со значением «сыновья».
- source_word: לֵוִי
  choice: Левия
  rationale: Имя поставлено в родительном падеже после слова «сыновья»; использована укоренившаяся русская библейская форма.
- source_word: גֵּרְשׁוֹן
  choice: Гирсон
  rationale: Использована традиционная русская библейская передача имени; еврейская форма здесь — Гершон, а не сходное имя Гершом.
- source_word: קְהָת
  choice: Кааф
  rationale: Использована укоренившаяся русская библейская форма имени, обеспечивающая узнаваемость в родословиях.
- source_word: וּ/מְרָרִי
  choice: и Мерари
  rationale: Префиксальный союз перед последним именем передан словом «и»; имя дано в традиционной русской форме.
