base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: ru
  text: Израиль отправился в путь со всем, что ему принадлежало[a], и пришёл в Вирсавию, и принёс жертвы Богу своего отца Исаака.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со всем, что у него было». Еврейское выражение имеет широкий смысл и может включать весь его дом — людей и имущество.'
    reason: Лексическая альтернатива и пояснение объёма выражения.
lexical_decisions:
- source_word: וַיִּסַּע
  choice: отправился в путь
  rationale: Глагол נסע в повествовании обозначает снятие с места и начало пути; это естественная современная передача без архаического оттенка.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя «Израиль»; оно не заменено на «Иаков».
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: со всем, что ему принадлежало
  rationale: Выражение имеет широкий смысл и может охватывать как имущество, так и людей его дома; перевод не сужает его до одних материальных вещей.
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычная передача בוא при указании места назначения; она сохраняет простую последовательность повествования.
- source_word: בְּאֵרָה שָּׁבַע
  choice: в Вирсавию
  rationale: Использовано традиционное русское библейское название места; направительный элемент еврейской формы передан предлогом «в» с винительным падежом.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: принёс жертвы
  rationale: Естественная русская передача однокоренной глагольно-именной конструкции; смысл жертвоприношения сохранён без неестественного повтора.
- source_word: לֵאלֹהֵי
  choice: Богу
  rationale: Предлог ל обозначает адресата жертвоприношения; русский дательный падеж передаёт это естественно.
- source_word: אָבִיו יִצְחָק
  choice: своего отца Исаака
  rationale: Фраза прямо называет Исаака отцом Израиля; возвратное местоимение естественно соотносит отца с подлежащим предложения.
theological_decisions:
- issue: Бог назван «Богом его отца Исаака», а не более общей патриархальной формулой
  choice: Богу своего отца Исаака
  alternative: Богу своих отцов; Богу, Богу своего отца Исаака
  rationale: Еврейский текст конкретно называет Исаака, подчёркивая преемственность с ним и связь Вирсавии с его историей; формулировка не обобщена и не расширена толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Цепочка действий сохранена посредством повторяющегося союза «и», но лексика остаётся понятной современному читателю.
