source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: ru
  text: Они взяли свой скот и имущество, которое приобрели в земле Ханаанской, и пришли в Египет — Иаков и всё его потомство[a] с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все его потомки». Еврейское слово может означать семя, потомство или потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Они взяли
  rationale: Форма повествовательного прошедшего времени от לקח передаёт последовательное действие; начальный союз в русском можно не выражать без утраты связи с контекстом.
- source_word: מִקְנֵיהֶם
  choice: свой скот
  rationale: מִקְנֶה обозначает совокупность домашних животных; «скот» — естественный и достаточно широкий русский эквивалент.
- source_word: רְכוּשָׁם
  choice: имущество
  rationale: רְכוּשׁ означает нажитое или движимое имущество и здесь отличается от отдельно упомянутого скота.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: которое приобрели
  rationale: Относительное придаточное указывает, что имущество было нажито ранее, в Ханаане; русский совершенный вид естественно передаёт эту предшествующую завершённость.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: в земле Ханаанской
  rationale: Сохраняется полная географическая формула еврейского текста, а не сокращённое «в Ханаане».
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: и пришли в Египет
  rationale: Глагол בוא с направительным окончанием указывает на движение в Египет; «пришли» не добавляет отсутствующей в тексте конкретизации о пересечении границы.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: Иаков и всё его потомство с ним
  rationale: זֶרַע буквально связано с семенем, но применительно к семье означает потомство или потомков. Собирательное «потомство» сохраняет форму и широту выражения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Тире сохраняет присоединительную конструкцию оригинала, в которой после глагола уточняется состав пришедших. Местоимение «свой» естественно соотносит скот с действующими лицами.
