  source_fidelity: 'Основной смысл передан верно: מדובר о занятии братьев животноводством и о доставленных ими стадах и прочем имуществе. Однако сноска неточно характеризует еврейскую форму как допускающую «прежнее» занятие, хотя в данном контексте характеристика их как пастухов делает такое понимание неуместным. Она также не отражает второй перфект («привели»), отмеченный в английском аудите.'
  naturalness: Текст в целом современный и естественный. «Эти люди» допустимо в контексте указания на братьев Иосифа; «мелкий и крупный скот» — точное и литературное сочетание.
  terminology: «Пастухи», «скотоводство», «мелкий и крупный скот» удачно передают רֹעֵי צֹאן, אַנְשֵׁי מִקְנֶה, צֹאן и בָּקָר. Для сохранения грамматической формы и устранения вводящей в заблуждение сноски предпочтительно передать перфекты простым прошедшим временем.
