  to: Эти люди — пастухи, потому что они были скотоводами; они привели свой мелкий и крупный скот и всё, что у них есть.
  rationale: Простые прошедшие «были» и «привели» прямо передают еврейские перфекты и согласуются с допустимой альтернативой, зафиксированной в английском аудите. Удаление сноски устраняет неудачное предположение о прекращённом занятии, не добавляя толкования. Остальные лексические решения сохранены.
