    rationale: 'Еврейское הָיוּ — перфект; формально он может быть переведён прошедшим временем, но противопоставление прежнего и продолжающегося занятия здесь не является сохраняемой контекстом двусмысленностью: в той же фразе мужчины названы пастухами.'
  - severity: low
    issue: Сноска освещает только הָיוּ.
    rationale: Английский аудиторский след отмечает возможность простого прошедшего также для הֵבִיאוּ. Если оставить грамматическую сноску, она должна была бы учитывать оба перфекта; безопаснее не создавать сноску и передать оба глагола прошедшим временем.
  revised_text: Эти люди — пастухи, потому что они были скотоводами; они привели свой мелкий и крупный скот и всё, что у них есть.
