  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: ru
  text: Эти люди — пастухи, потому что они были скотоводами; они привели свой мелкий и крупный скот и всё, что у них есть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Эти люди
  rationale: Определённое «люди» указывает на уже названных братьев Иосифа; указательное «эти» естественно передаёт этот референциальный смысл в русской речи.
- source_word: רֹעֵי צֹאן
  choice: пастухи
  rationale: Устойчивое и понятное соответствие выражению «пасущие мелкий скот»; в данном контексте обозначает род занятий.
- source_word: כִּי
  choice: ведь
  rationale: 'Передаёт пояснительное значение союза: последующая фраза обосновывает характеристику этих людей как пастухов.'
- source_word: אַנְשֵׁי מִקְנֶה הָיוּ
  choice: они занимаются скотоводством
  rationale: Идиоматично передаёт буквальное «были людьми скота» как их устойчивое занятие, актуальное и в момент речи.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: мелкий и крупный скот
  rationale: Сохраняет различие между צֹאן — овцами и козами как мелким скотом — и בָּקָר — крупным рогатым скотом.
- source_word: הֵבִיאוּ
  choice: привели с собой
  rationale: Для перемещения живого скота русское «привели» естественнее общего «принесли»; «с собой» ясно выражает прибытие вместе с имуществом.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: и всё, что у них есть
  rationale: Близко к еврейской конструкции и естественно обозначает всю совокупность принадлежащего им.
