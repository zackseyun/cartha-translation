base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: ru
  text: 'Сыновья Симеона: Иемуил, Иамин, Охад, Иахин, Цохар и Шаул, сын хананеянки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Сыновья Симеона
  rationale: Конструкция продолжает генеалогический перечень. В русском начале стиха союз «и» можно естественно опустить без утраты связи со списком.
- source_word: יְמוּאֵל
  choice: Иемуил
  rationale: Традиционная русская библейская форма имени, достаточно близкая еврейскому יְמוּאֵל.
- source_word: וְיָמִין
  choice: Иамин
  rationale: Традиционная русская передача имени יָמִין.
- source_word: וְאֹהַד
  choice: Огад
  rationale: Русская библейская передача имени אֹהַד с обычным озвончением/фрикативной передачей ה через «г» в традиции имен.
- source_word: וְיָכִין
  choice: Иахин
  rationale: Традиционная русская форма, отражающая начальный йод и согласный כ.
- source_word: וְצֹחַר
  choice: Цохар
  rationale: Транслитерация сохраняет начальное צ как «ц» и отличает это имя от иных традиционных вариантов.
- source_word: וְשָׁאוּל
  choice: Шаул
  rationale: Форма непосредственно передает еврейское שָׁאוּל и не смешивает носителя имени с более известным Саулом из позднейшего повествования.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: сын хананеянки
  rationale: Форма הַכְּנַעֲנִית — определенное существительное/прилагательное женского рода и обозначает женщину-хананеянку; краткая русская форма естественна и точна.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с лаконичным синтаксисом генеалогического списка. Имена переданы преимущественно в узнаваемых русских библейских формах, но «Шаул» и «Цохар» ближе к еврейскому звучанию. Определенный артикль при «хананеянке» не воспроизведен отдельным словом, поскольку русский язык обычно выражает такую определенность контекстом.
