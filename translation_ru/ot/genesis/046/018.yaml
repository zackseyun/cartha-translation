    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: Вот сыновья Зелфы
  rationale: Указательное אֵלֶּה естественно передано словом «вот» при подведении итога перечню. בְּנֵי буквально означает «сыновья» и сохраняет форму исходного текста, хотя в данном родословном контексте обозначает представленную потомственную линию Зелфы.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: которую Лаван дал своей дочери Лии
  rationale: Относительное местоимение относится к Зелфе. Притяжательное «своей» ясно и естественно выражает отношение בִתּוֹ к Лавану.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: их она родила Иакову
  rationale: Сохранена обычная для родословий формула рождения; местоимение «их» отсылает ко всей только что перечисленной группе, как אֶת אֵלֶּה.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: всего шестнадцать человек
  rationale: נֶפֶשׁ при исчислении людей идиоматически означает отдельного человека. «Человек» ясно передаёт смысл современному читателю, а «всего» естественно вводит итоговое число.
