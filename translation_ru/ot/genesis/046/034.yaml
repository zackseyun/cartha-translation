  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: ru
  text: 'тогда скажите: «Твои слуги были скотоводами с нашей юности и доныне — и мы, и наши отцы», — чтобы вам поселиться в земле Гесем, ибо всякий пастух мелкого скота — мерзость для египтян.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: тогда скажите
  rationale: Вав с перфектом продолжает предшествующее наставление; русское «тогда скажите» естественно передаёт последовательность и побудительную силу.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: занимаются скотоводством
  rationale: Конструкция обозначает людей, чьё постоянное занятие связано с домашним скотом. Этот вариант естественен по-русски и не сужает значение до ухода лишь за одним видом животных.
- source_word: עֲבָדֶיךָ
  choice: Твои рабы
  rationale: Перед фараоном это формула почтительного самоназвания; «рабы» сохраняет обычный библейский придворный оборот и семантическую силу עבד, не утверждая здесь юридического рабства.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: с юности и доныне
  rationale: Передаёт непрерывность занятия от ранних лет до настоящего времени в кратком литературном русском выражении.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: и мы, и наши отцы
  rationale: Повтор «и... и...» воспроизводит симметричное גַּם...גַּם и подчёркивает преемственность поколений.
- source_word: בַּעֲבוּר
  choice: чтобы
  rationale: В контексте вводит цель речи, которой Иосиф учит братьев.
- source_word: תֵּשְׁבוּ
  choice: поселиться
  rationale: Глагол ישב здесь относится не просто к проживанию, а к размещению семьи в определённой области; «поселиться» ясно передаёт контекст.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: в земле Гесем
  rationale: Сохранено явное слово «земля» и традиционная русская форма топонима Гесем.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: отвратителен для египтян
  rationale: Предикативная конструкция естественно передаёт сильную отрицательную оценку תועבה, а «египтян» выражает собирательное «Египет» в исходном тексте.
- source_word: כָּל רֹעֵה צֹאן
  choice: всякий пастух овец
  rationale: Сохранён явный объект צֹאן — мелкий скот, прежде всего овцы и козы; «пастух овец» понятно и близко к форме оригинала.
theological_decisions:
- issue: Характер египетского неприятия пастухов
  choice: отвратителен для египтян
  alternative: мерзость для египтян
  rationale: Выбран современный предикативный оборот, сохраняющий сильную оценку, но не добавляющий конкретной культовой или ритуальной причины, которой стих прямо не называет.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Прямая речь звучит как наставление о формуле обращения к фараону. Синтаксис слегка приподнят («доныне», «наши отцы»), но остаётся понятным обычному читателю.
