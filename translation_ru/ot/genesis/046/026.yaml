base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: ru
  text: Все принадлежавшие Иакову, пришедшие в Египет, — его потомки[a], не считая жён сыновей Иакова, — всего шестьдесят шесть человек[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышедшие из его бедра» — древнееврейское выражение, обозначающее потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всего душ шестьдесят шесть». В подобных перечислениях еврейское слово «душа» означает отдельного человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Все, кто
  rationale: В родословном подсчёте נֶפֶשׁ обозначает отдельного человека. Русское «все, кто» естественно вводит группу лиц и позволяет избежать архаичного «все души».
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: кто пришёл с Иаковом в Египет
  rationale: По контексту речь идёт о людях Иакова, отправившихся вместе с ним в Египет. Предлог לְ допускает более буквальное «к Иакову», однако здесь такое выражение по-русски создало бы неверное пространственное впечатление.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: произошёл от него
  rationale: Буквальный образ «вышедшие из его бедра» является древнееврейской идиомой кровного происхождения. Основной текст передаёт её смысл современным русским языком, а буквальный образ сохранён в сноске.
- source_word: מִלְּבַד
  choice: не считая
  rationale: Предлог исключает жён сыновей Иакова из названного итога; «не считая» ясно выражает функцию этой оговорки.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: жён сыновей Иакова
  rationale: Прямо и естественно сохраняет отношения между существительными исходного текста.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: всего шестьдесят шесть человек
  rationale: Передаёт итоговый подсчёт и контекстуальное значение נֶפֶשׁ как «человек», не внося представления о счёте нематериальных душ.
