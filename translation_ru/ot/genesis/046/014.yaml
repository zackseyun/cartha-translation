  yaml_path: translation/ot/genesis/046/014.yaml
  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: ru
  text: 'И сыновья Завулона: Серед, Елон и Иахлеил[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Иахлеил» можно также передать как «Яхлеэл».
