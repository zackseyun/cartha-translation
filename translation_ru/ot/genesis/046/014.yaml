lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Форма בְנֵי — сопряжённое множественное число слова «сын»; в родословном перечне естественно передаётся как «сыновья». Союз ו сохранён как «и», чтобы передать связность списка.
- source_word: זְבוּלֻן
  choice: Завулона
  rationale: Личное имя передано в принятой русской библейской форме; родительный падеж обусловлен сочетанием «сыновья Завулона».
- source_word: סֶרֶד
  choice: Серед
  rationale: Личное имя транслитерировано в соответствии с устоявшейся русской библейской формой.
- source_word: וְ/אֵלוֹן
  choice: Елон
  rationale: Здесь слово является личным именем, поэтому не переводится как нарицательное «дуб»; соединительный союз передан перед последним членом перечисления по нормам русского языка.
- source_word: וְ/יַחְלְאֵל
  choice: Иахлеил
  rationale: Личное имя передано в традиционной русской библейской форме; союз ו выражен русским «и» перед последним именем.
