  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: ru
  text: Вот сыновья Валлы, которую Лаван отдал Рахили, своей дочери. Она родила их Иакову — всего семь человек[a].
  philosophy: optimal-equivalence
  footnotes:
