lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Вот сыновья Валлы
  rationale: Указательное אֵלֶּה вводит итог перечисления; «вот» естественно передаёт эту функцию. בְּנֵי в данном родословном контексте обозначает сыновей. Имя передано в принятой русской библейской форме «Валла».
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: которую Лаван отдал своей дочери Рахили
  rationale: Относительное местоимение относится к Валле. לְ при נתן обозначает адресата передачи; «своей дочери Рахили» ясно передаёт суффикс בִּתּוֹ и связь приложения.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: и которая родила их Иакову
  rationale: Повтор относительного местоимения устраняет возможную двусмысленность русского сложного предложения и сохраняет Валлу как подлежащее. «Их» естественно отсылает к перечисленным сыновьям, а дательный «Иакову» передаёт לְ в формуле рождения.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: всего семь человек
  rationale: Буквально оборот говорит «всякая/вся душа — семь»; в контексте подсчёта נֶפֶשׁ означает отдельного человека. Русское «всего семь человек» точно и естественно выражает итоговое число.
