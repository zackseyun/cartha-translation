  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: ru
  text: Иосиф возвратился в Египет — он, его братья и все, кто поднялся[a] вместе с ним, чтобы похоронить его отца, — после того как он похоронил своего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В библейском повествовании путь из Египта в Ханаан обычно описывается как движение «вверх».
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: возвратился
  rationale: Глагол שוב с последовательным ו обозначает завершённое действие в повествовании; «возвратился» естественно передаёт возвращение Иосифа к месту, откуда он прежде вышел.
- source_word: מִצְרַיְמָה
  choice: в Египет
  rationale: Направительное окончание указывает на движение к Египту; после «возвратился» это естественная русская конструкция.
- source_word: הוּא וְאֶחָיו
  choice: он, его братья
  rationale: Местоимение הוּא особо выделяет Иосифа и вводит присоединённое перечисление сопровождавших его лиц.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: и все, кто поднялся вместе с ним
  rationale: Причастие עֹלִים буквально передаёт движение вверх и здесь обозначает предшествующий путь из Египта в Ханаан; русское прошедшее время ясно выражает временное соотношение.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: чтобы похоронить его отца
  rationale: Инфинитив с ל выражает цель пути. Притяжательное «его» сохраняет отнесённость к Иосифу.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: после того как он похоронил своего отца
  rationale: אַחֲרֵי вводит последующее время, а суффикс при инфинитиве естественно относится к Иосифу. Повтор слова «отец» сохранён вслед за еврейским текстом.
