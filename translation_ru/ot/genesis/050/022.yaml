  text: Иосиф остался в Египте — он и дом его отца. Иосиф прожил сто десять лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: Глагол יָשַׁב может означать «сидеть», «жить», «оставаться». В данном повествовательном итоге «остался» естественно передаёт продолжение пребывания Иосифа в Египте после смерти Иакова и не смешивается с последующим וַיְחִי.
- source_word: בְּמִצְרַיִם
  choice: в Египте
  rationale: Прямое обозначение места проживания.
- source_word: הוּא וּבֵית אָבִיו
  choice: вместе со всем домом своего отца
  rationale: Слово בַּיִת в сочетании «дом отца» обозначает не только жилище, но семью и более широкий круг домочадцев. Традиционное русское «дом» сохраняет образ и охват исходного выражения; «всем» естественно передаёт совокупное значение этой группы.
- source_word: וַיְחִי
  choice: прожил
  rationale: В сообщении о продолжительности жизни «прожил» является естественным русским соответствием и ясно вводит возраст Иосифа.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: сто десять лет
  rationale: Точно передаёт древнееврейское обозначение возраста; числительное записано словами в соответствии с достоинством и плавностью библейского повествования.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Устоявшаяся русская библейская форма личного имени.
