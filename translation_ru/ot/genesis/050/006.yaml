  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: ru
  text: 'И фараон сказал: «Иди и похорони своего отца, как он обязал тебя клятвой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как он велел тебе поклясться».'
    reason: Лексическая альтернатива для каузативной формы הִשְׁבִּיעֶךָ; передаёт побуждение адресата принести клятву.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И ... сказал
  rationale: Вав-последовательный продвигает повествование; союз «и» естественно сохраняет связность еврейского рассказа без излишнего уточнения временной последовательности.
- source_word: פַּרְעֹה
  choice: фараон
  rationale: Общепринятое русское обозначение титула египетского правителя.
- source_word: עֲלֵה
  choice: иди
  rationale: Глагол עלה буквально означает «поднимись/взойди», но при отправлении из Египта в Ханаан в современном русском естественнее «иди»; направление определяется контекстом и не требует неестественного буквального воспроизведения.
- source_word: וּקְבֹר
  choice: и похорони
  rationale: Кָבַר прямо означает «хоронить»; выбран обычный современный глагол без излишне высокого оттенка.
- source_word: אֶת אָבִיךָ
  choice: своего отца
  rationale: Форма содержит прямое дополнение «твоего отца»; русское возвратное притяжательное местоимение «своего» естественно соотносит отца с адресатом.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз выражает соответствие тому, каким образом отец связал Иосифа клятвой.
- source_word: הִשְׁבִּיעֶךָ
  choice: он велел тебе поклясться
  rationale: 'Порода hифиль глагола שׁבע имеет каузативное значение: отец побудил или обязал Иосифа дать клятву. «Велел тебе поклясться» ясно и естественно передаёт эту силу.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранён повествовательный союз «и»; буквальное «поднимись» заменено естественным в данном контексте «иди», а каузативное значение клятвы сохранено.
