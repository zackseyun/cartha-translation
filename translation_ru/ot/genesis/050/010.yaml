  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: ru
  text: Когда они дошли до гумна Атад[a], что по ту сторону Иордана[b], то предались там великому и чрезвычайно тяжкому плачу[c]. И он семь дней соблюдал траур по своему отцу[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Атад» может означать «колючий куст» или «терновник», но здесь оно входит в название места.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за Иорданом», «на другой стороне Иордана». Еврейское выражение само по себе не уточняет географическую точку отсчёта.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «великим и чрезвычайно тяжёлым плачем»; это выражение подчёркивает силу погребальной скорби.'
    reason: cultural_note
  - marker: d
    text: 'В еврейском тексте здесь стоит глагол в единственном числе: «он соблюдал траур». Вероятнее всего, речь об Иосифе; возможна также передача по смыслу во множественном числе: «они соблюдали траур».'
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: гумно
  rationale: Обозначает площадку для молотьбы; «гумно» — точный, традиционный и понятный русский эквивалент.
- source_word: הָאָטָד
  choice: Атад
  rationale: В сочетании גֹּרֶן הָאָטָד слово функционирует как часть названия места. Транслитерация сохраняет это имя, а возможное нарицательное значение вынесено в сноску.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: по ту сторону Иордана
  rationale: Передаёт пространственное значение «на другой стороне» и не уточняет точку отсчёта, которая в еврейском выражении остаётся зависимой от перспективы рассказчика.
- source_word: וַיִּסְפְּדוּ ... מִסְפֵּד
  choice: предались ... плачу
  rationale: Глагол и однокоренное существительное относятся к публичному погребальному оплакиванию. Русская конструкция естественно передаёт событие, не воспроизводя тяжеловесную этимологическую фигуру буквально.
- source_word: גָּדוֹל וְכָבֵד מְאֹד
  choice: великому и чрезвычайно тяжкому
  rationale: Сохраняет оба определения и образ тяжести, выражающий силу и мучительность скорби; מְאֹד передано усилителем «чрезвычайно».
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: соблюдал траур
  rationale: Сочетание עשה с אֵבֶל означает совершать или соблюдать установленное оплакивание. «Соблюдал траур» естественно обозначает формальный период скорби.
- source_word: לְאָבִיו
  choice: по своему отцу
  rationale: Сохраняет единственное число притяжательного суффикса и естественно сочетается с русским выражением «траур по кому-либо».
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Точно передаёт продолжительность траура.
theological_decisions:
- issue: Субъект единственного числа וַיַּעַשׂ после глаголов во множественном числе
  choice: «он семь дней соблюдал траур» — субъект передан в единственном числе, вероятнее всего как Иосиф
  alternative: «они семь дней соблюдали траур» — коллективное понимание или контекстуальное сглаживание
  rationale: Масоретский текст явно переходит от множественного числа («они дошли», «предались плачу») к единственному («он соблюдал»). Сохранение этого перехода отражает форму источника и, вероятно, особо выделяет Иосифа, не превращая вероятностное отождествление в прямо названное имя.
translation_notes:
  register: Современный литературный русский с торжественным повествовательным тоном. «Гумно» и «траур» сохраняют историко-культурную конкретность, оставаясь понятными; буквальная семитская конструкция «оплакивали плачем» заменена естественным русским оборотом без утраты интенсивности.
