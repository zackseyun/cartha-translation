  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: ru
  text: и весь дом Иосифа[a], и его братья, и дом его отца; в земле Гесем они оставили только малых детей[b], мелкий и крупный скот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом Иосифа» и «дом его отца» здесь означают семью или домашних, а не здание.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их малых»; то есть маленьких детей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: и весь дом Иосифа
  rationale: כֹּל выражает полноту, а בַּיִת с именем лица здесь обозначает не здание, а семью или домашнее сообщество. Традиционное русское «дом Иосифа» сохраняет образ исходного текста и понятно в контексте; смысл пояснён в сноске.
- source_word: וְאֶחָיו
  choice: и его братья
  rationale: Форма множественного числа אָח в данном контексте обозначает братьев Иосифа.
- source_word: וּבֵית אָבִיו
  choice: и дом его отца
  rationale: «Дом» здесь означает семью и домашних, связанных с отцом Иосифа; параллельная формулировка сохраняет повтор בֵּית.
- source_word: רַק
  choice: только
  rationale: 'Частица вводит ограничение: перечисленные далее дети и скот были исключением среди отправившихся в путь.'
- source_word: טַפָּם
  choice: малых детей
  rationale: טַף обозначает маленьких детей, а не всех потомков или иждивенцев вообще.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: мелкий и крупный скот
  rationale: צֹאן — коллективное обозначение овец и коз, בָּקָר — крупного рогатого скота. Русская парная формула точно и естественно передаёт различие.
- source_word: עָזְבוּ
  choice: они оставили
  rationale: Глагол означает «оставить, оставить позади»; «покинули» или «бросили» вносило бы неуместный оттенок оставления без попечения.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: в земле Гесем
  rationale: Передаёт явное אֶרֶץ и сохраняет принятое русское библейское название местности.
