  source_fidelity: 'Смысл передан в целом точно: перечислены весь дом Иосифа, его братья и дом отца; в Гесеме оставлены малые дети и оба вида скота. Однако «дом его отца» без уточнения несколько менее ясно, чем «дом его отца / семья его отца», а порядок «только малых детей ... они оставили» тяжеловесен для современного литературного русского.'
  naturalness: 'Начальная строчная «и» оправдана как продолжение предыдущего стиха, но сочетание «и весь дом Иосифа, и его братья, и дом его отца» — перечень без сказуемого, который в русском сохраняет библейскую незавершённость оригинала. Во второй части естественнее: «они оставили там только…».'
