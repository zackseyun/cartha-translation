base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: ru
  text: 'Иосиф сказал своим братьям: «Я умираю, но Бог непременно позаботится о вас[a] и возведёт вас из этой земли в землю, которую Он клятвенно обещал Аврааму, Исааку и Иакову».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «непременно посетит вас». Еврейское выражение означает, что Бог решительно обратит внимание на Свой народ и вступится за него.'
    reason: 'Лексическая альтернатива: сохранение образа и смысловой широты глагола פקד.'
lexical_decisions:
- source_word: אֶחָיו
  choice: своим братьям
  rationale: Мужской род множественного числа и контекст книги Бытия указывают именно на братьев Иосифа; притяжательное местоимение передано естественным для русского языка словом «своим».
- source_word: אָנֹכִי מֵת
  choice: Я умираю
  rationale: Причастная конструкция сообщает о приближающейся смерти Иосифа; «Я умираю» естественно и точно передаёт эту непосредственную перспективу.
- source_word: וֵאלֹהִים
  choice: но Бог
  rationale: 'Хотя союз буквально может значить «и», здесь он выражает смысловое противопоставление: Иосиф умирает, но действие Бога продолжит исполнение обещания.'
- source_word: פָּקֹד יִפְקֹד
  choice: непременно позаботится о вас
  rationale: Инфинитив абсолютный с личной формой усиливает уверенность действия. פקד здесь означает решительное благосклонное внимание Бога и последующее вмешательство; «позаботится» естественно передаёт это в современном русском, а примечание сохраняет образную альтернативу «посетит».
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: и возведёт вас
  rationale: Порода хифиль глагола עלה означает «поднять, привести наверх». «Возведёт» сохраняет направленность движения из Египта в обещанную землю и соответствует достоинству контекста.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: из этой земли
  rationale: Прямо передаёт предлог, существительное и указательное местоимение; речь идёт о земле Египта.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: в землю, которую Он поклялся дать
  rationale: Глагол означает «поклялся»; дополнение «дать» подразумевается конструкцией и контекстом обещания земли и необходимо для ясной, естественной русской фразы.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Аврааму, Исааку и Иакову
  rationale: Русские падежные окончания передают повторённый еврейский предлог; перечисление сохраняет торжественную формулу имён патриархов.
theological_decisions:
- issue: Характер обещанного действия Бога в פָּקֹד יִפְקֹד
  choice: Уверение в том, что Бог непременно позаботится о потомках Иосифа и решительно вступится за них.
  alternative: «Бог непременно посетит вас» или «Бог непременно обратит на вас внимание».
  rationale: Еврейская конструкция выражает категорическую уверенность, а контекст — благосклонное действие Бога ради Его народа. Основной текст избегает современного бытового понимания слова «посетит», но примечание сохраняет буквальный образ и широту идиомы.
- issue: Неявное содержание клятвы о земле
  choice: «землю, которую Он поклялся дать»
  alternative: «землю, о которой Он поклялся»
  rationale: Глагол «дать» не выражен отдельным словом в стихе, однако однозначно подразумевается синтаксисом и предшествующими обещаниями патриархам. Его добавление проясняет русскую фразу, не вводя нового богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимение «Он» написано с прописной буквы по устойчивой русской издательской традиции; архаизмы сведены к минимуму, а «возведёт» сохранено ради направительного образа исходного глагола.
