  source_fidelity: 'В черновике опущено שָׁמָּה («там»), которое в еврейском тексте прямо указывает на названное место погребения. Кроме того, «высек» излишне конкретизирует כָּרִיתִי: глагол обозначает выкапывание/вырубание, но не требует скальной гробницы.'
  naturalness: Текст в целом литературный и естественный. Перестановка «похорони меня там» сохраняет еврейское указание и звучит по-русски более плавно, чем буквальное «там похорони меня».
  terminology: «Взял с меня клятву» точно передаёт каузативное הִשְׁבִּיעַנִי. «Земля Ханаанская» уместна в библейском регистре. «Могила» соответствует קֶבֶר и не предполагает материал или тип сооружения.
