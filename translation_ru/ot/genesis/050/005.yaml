base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: ru
  text: '«Отец мой взял с меня клятву, сказав: „Вот, я умираю. В моей могиле, которую я вырыл себе в земле Ханаанской, похорони меня там“. Поэтому прошу, позволь мне теперь отправиться и похоронить отца моего, а потом я вернусь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: взял с меня клятву
  rationale: Каузативная форма от корня שׁבע означает «заставил поклясться»; выбран естественный и точный русский оборот.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет вводное указательное слово и его функцию привлечения внимания без архаизации.
- source_word: כָּרִיתִי
  choice: высек
  rationale: Буквально глагол означает «вырезал, высек»; применительно к гробнице естественно указывает на её устройство в скале. Не заменено на более общее «приготовил».
- source_word: אֶעֱלֶה נָּא
  choice: позволь мне теперь пойти
  rationale: Частица נָא передаёт вежливую просьбу, а «пойти» естественно выражает контекстуальное значение «подняться/отправиться», не навязывая русскому читателю географически неясное направление вверх.
- source_word: וְאָשׁוּבָה
  choice: а потом я вернусь
  rationale: Сохраняет ясное обещание Иосифа вернуться после погребения.
