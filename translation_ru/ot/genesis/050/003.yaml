  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: ru
  text: Для него завершились сорок дней, ибо так завершаются дни бальзамирования[a]. И Египет[b] оплакивал его семьдесят дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская форма может также пониматься как «дни бальзамируемых»; в данном контексте речь идёт о сроке бальзамирования.
    reason: alternative_reading
  - marker: b
    text: Название «Египет» здесь употреблено собирательно — о египтянах.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: На это ушло сорок дней
  rationale: Глагол מלא обозначает завершение установленного периода. Русское выражение естественно передаёт истечение сорока дней и по контексту связывает их с бальзамированием, упомянутым в предыдущем стихе.
- source_word: כִּי כֵּן
  choice: потому что таков
  rationale: 'Сохраняет пояснительную связь: сорокадневный период объясняется обычной продолжительностью бальзамирования.'
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: срок бальзамирования
  rationale: Контекст указывает на процесс бальзамирования Иакова. Такая передача естественна по-русски и выражает завершение положенного числа дней, не превращая неясную еврейскую форму в обозначение конкретной группы людей.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: оплакивал его
  rationale: Передаёт плач по умершему естественным русским выражением, не добавляя более узкого смысла официального траура.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Сохраняет еврейское географическое название, употреблённое собирательно о жителях страны; это пояснено в сноске.
- source_word: שִׁבְעִים יוֹם
  choice: семьдесят дней
  rationale: Прямая передача числительного и обозначения времени.
