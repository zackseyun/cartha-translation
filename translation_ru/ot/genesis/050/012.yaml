  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: ru
  text: И его сыновья сделали для него так, как он им повелел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: сделали
  rationale: Глагол עשה имеет широкое значение «делать, совершать»; здесь речь об исполнении указаний Иакова. «Сделали» естественно передаёт действие без излишнего уточнения.
- source_word: בָנָיו
  choice: его сыновья
  rationale: Еврейское слово בנים в данной форме прямо обозначает сыновей Иакова; конкретное родовое значение сохранено.
- source_word: לוֹ
  choice: для него
  rationale: Предлог ל здесь указывает, что сыновья исполнили порученное ради него и в отношении его погребения.
- source_word: כֵּן
  choice: всё так
  rationale: כֵּן обозначает соответствие образцу или указанию. В русском оборот «всё так, как» естественно подчёркивает полное исполнение, не добавляя нового действия.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Союз вводит сравнение и указывает на соответствие действий сыновей повелению отца.
- source_word: צִוָּם
  choice: он им повелел
  rationale: צוה означает «повелевать, заповедовать». «Повелел» сохраняет силу распоряжения и подходит к dignified narrative register; предшествование повеления ясно из смысла и не требует отдельной грамматической маркировки.
