  source_fidelity: 'В черновике верно переданы субъект, действие, направленность действия «для него» и соответствие повелению. Однако слово «всё» не имеет прямого соответствия в еврейском тексте: וַיַּעֲשׂוּ לוֹ כֵּן означает «они сделали для него так / поступили так», не эксплицируя полноту объектом «всё».'
  naturalness: Оборот «сделали для него так, как он им повелел» краток, понятен и приемлем в современном литературном повествовательном регистре. Он сохраняет намеренную эллиптичность оригинала без искусственного уточнения.
  terminology: «Сыновья», «повелел» и местоименная отсылка переданы уместно. Специальных богословских терминов и имён в стихе нет.
