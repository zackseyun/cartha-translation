lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: они передали
  rationale: Хотя צוה обычно означает «приказывать», сочетание с אֶל־יוֹסֵף и последующей речью здесь, вероятнее всего, описывает передачу Иосифу сообщения. «Передали» естественно выражает этот смысл по-русски.
- source_word: אֶל־יוֹסֵף
  choice: Иосифу
  rationale: Русский дательный падеж естественно обозначает адресата сообщения, выраженного в еврейском тексте предлогом אֶל.
- source_word: לֵאמֹר
  choice: двоеточие после «передали Иосифу»
  rationale: Первое לֵאמֹר вводит прямую речь; в современном русском его функцию естественно передаёт пунктуация без отдельного слова «говоря».
- source_word: אָבִיךָ
  choice: твой отец
  rationale: Сохранены прямое обращение к Иосифу и притяжательное значение суффикса второго лица.
- source_word: צִוָּה
  choice: повелел
  rationale: Здесь глагол сохраняет обычное значение распоряжения или приказания и вводит содержание повеления в следующем стихе.
- source_word: לִפְנֵי מוֹתוֹ
  choice: перед смертью
  rationale: Передаёт временное значение оборота естественным и точным русским выражением.
- source_word: לֵאמֹר
  choice: двоеточие после «повелел»
  rationale: Второе לֵאמֹר вводит последующую цитату; двоеточие сохраняет структуру речи без неестественного повтора «говоря».
