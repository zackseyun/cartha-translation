lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт связующий и итоговый смысл сочетания союза с наречием в естественной современной русской речи.
- source_word: אַל תִּירָאוּ
  choice: не бойтесь
  rationale: Обычная русская форма ободряющего запрета, точно передающая отрицательную волитивную конструкцию.
- source_word: אָנֹכִי
  choice: Я сам
  rationale: Самостоятельное местоимение имеет эмфатическую силу и подчёркивает личное обязательство Иосифа.
- source_word: אֲכַלְכֵּל
  choice: буду заботиться о
  rationale: В данном контексте глагол означает материально обеспечивать и содержать; выбранная формулировка естественна и охватывает продолжительную заботу.
- source_word: טַפְּכֶם
  choice: ваших детях
  rationale: Слово обозначает малых детей; «детях» звучит естественнее в современном русском, а семейный контекст сохраняет нужный смысл.
- source_word: וַיְנַחֵם אֹתָם
  choice: Так он утешил их
  rationale: Передаёт итоговое повествовательное действие и обычное контекстуальное значение глагола נחם в породе пиэль.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: говорил им по сердцу
  rationale: Сохраняет образность еврейской идиомы — нежную, ободряющую речь, обращённую к сердцу, — не сводя её к единственному толкованию.
