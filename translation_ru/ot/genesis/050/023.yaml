  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: ru
  text: И увидел Иосиф потомков Ефрема до третьего поколения[a]. Также дети Махира, сына Манассии, родились на коленях Иосифа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иосиф дожил до того, что увидел потомков Ефрема до третьего поколения». Буквально по-еврейски: «Иосиф увидел».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «родились на коленях Иосифа» может подразумевать семейное признание, принятие ребёнка или особое расположение к нему.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Сохраняет буквальное значение еврейского глагола и естественно передаёт мысль о том, что Иосиф дожил до появления этих потомков, не подменяя формулировку толкованием.
- source_word: לְאֶפְרַיִם בְּנֵי שִׁלֵּשִׁים
  choice: потомков Ефрема до третьего поколения
  rationale: В генеалогическом контексте «потомки» естественнее широкого «дети», а «до третьего поколения» сохраняет объём еврейского выражения, не уточняя степень родства сверх текста.
- source_word: גַּם
  choice: также
  rationale: Передаёт присоединение параллельного сообщения просто и нейтрально.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: дети Махира, сына Манассии
  rationale: «Дети» сохраняет возможное широкое значение בְּנֵי, а приложение однозначно относит слова «сына Манассии» к Махиру.
- source_word: יֻלְּדוּ
  choice: родились
  rationale: Прямое и естественное соответствие страдательной форме глагола ילד.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: на коленях Иосифа
  rationale: Сохраняет конкретный еврейский образ и присущую ему неоднозначность, не сводя его в основном тексте к одному обряду или юридическому действию.
theological_decisions:
- issue: Смысл рождения «на коленях Иосифа»
  choice: Сохранить образ буквально и пояснить диапазон значений в примечании.
  alternative: Передать как усыновление, признание своими или особое принятие.
  rationale: Еврейская формула допускает семейное признание, принятие или особое расположение, но сам стих не устанавливает однозначно конкретный юридический либо обрядовый смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прост и понятен; буквальный культурный образ сохранён, а его возможный смысл вынесен в примечание.
