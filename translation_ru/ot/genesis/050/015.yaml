    rationale: 'Совершенный вид и глагол «затаить» добавляют представление о прежде совершившемся и скрываемом чувстве. В исходном тексте тревожное предположение относится к враждебности Иосифа; нейтральнее и ближе: «питает к нам ненависть».'
  - severity: low
    issue: «теперь»
    rationale: В еврейском тексте нет отдельного наречия «теперь». Связь со смертью отца уже выражена повествовательным контекстом, поэтому его лучше не добавлять.
