  source_fidelity: 'В целом смысл передан верно: братья тревожно предполагают враждебность Иосифа и полное воздаяние за зло, причинённое ему. Однако «затаил ... ненависть» с совершенным видом излишне представляет ненависть как уже совершившееся, скрытое действие, тогда как יִשְׂטְמֵנוּ в конструкции с לוּ выражает опасение относительно его враждебности. Слово «теперь» отсутствует в еврейском тексте.'
  naturalness: Фраза естественна для современного литературного русского, но «питает к нам ненависть» точнее передаёт продолжающуюся враждебность и не вводит лишний временной акцент.
