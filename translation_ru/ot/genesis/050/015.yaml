base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: ru
  text: 'Братья Иосифа увидели, что их отец умер, и сказали: «Что, если Иосиф питает к нам ненависть и сполна отплатит нам за всё зло, которое мы ему причинили?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: Что, если Иосиф затаил на нас ненависть
  rationale: Частица לוּ здесь вводит тревожное предположение, а שׂטם обозначает устойчивую вражду или ненависть. Такая передача естественна по-русски и сохраняет опасение братьев.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: и теперь сполна отплатит нам
  rationale: 'Сочетание абсолютного инфинитива с личной формой усиливает глагол: Иосиф непременно или в полной мере воздаст им. «Сполна отплатит» передаёт эмфазу без тяжеловесного буквального повтора.'
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: за всё зло, которое мы ему причинили
  rationale: Глагол גמל в данном контексте означает обойтись с кем-либо определённым образом, здесь — причинить зло. Русское «причинили» ясно выражает смысл и сохраняет нравственную оценку поступков братьев.
theological_decisions:
- issue: Предполагаемое отношение Иосифа после смерти отца
  choice: сохранено как тревожное предположение братьев
  alternative: утвердительное «Иосиф ненавидит нас и непременно отплатит»
  rationale: Еврейская частица לוּ в контексте передаёт опасение, а не утверждение факта; текст не сообщает, что Иосиф действительно ненавидел братьев.
- issue: Степень возмездия
  choice: «сполна отплатит»
  alternative: «непременно отплатит»
  rationale: Эмфатическая конструкция допускает оттенки как несомненности, так и полноты воздаяния. В контексте «за всё зло» уместно передать полноту, не добавляя учения о возмездии от имени повествователя.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и тревожно, сохраняя достоинство библейского повествования. «Затаил ненависть» передаёт длительную враждебность, а «теперь» естественно связывает страх братьев со смертью отца.
