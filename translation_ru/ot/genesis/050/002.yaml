base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: ru
  text: Иосиф приказал своим слугам[a] — врачам — бальзамировать его отца, и врачи бальзамировали Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабам»; еврейское слово в зависимости от контекста может означать слуг или рабов.'
    reason: lexical_alternative
  - marker: b
    text: То есть Иакова.
    reason: identity_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: приказал
  rationale: Глагол צוה обозначает властное распоряжение; «приказал» естественно и точно передаёт его силу.
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: עבד может обозначать слугу или раба. Здесь речь идёт о состоявших при Иосифе людях, далее названных врачами; их подневольный статус не вынесен на первый план.
- source_word: הָרֹפְאִים
  choice: врачам / врачи
  rationale: Причастная форма от רפא обозначает людей, занимающихся врачеванием; современное литературное «врачи» подходит контексту египетского двора.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: набальзамировать / набальзамировали
  rationale: В египетском погребальном контексте חנט означает бальзамирование тела. Повтор корня сохранён.
- source_word: אָבִיו
  choice: его отца
  rationale: Прямое соответствие еврейской форме с притяжательным суффиксом.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Сохранено употреблённое в еврейском тексте имя «Израиль», без замены на «Иаков».
theological_decisions:
- issue: Передача עבד в контексте домашнего персонала
  choice: слуги
  alternative: рабы
  rationale: Слово допускает оба значения, но в данном стихе акцент сделан на функции этих людей как врачей при Иосифе, а не на их правовом статусе; альтернативное значение отмечено в сноске.
- issue: Имя патриарха в заключительной части стиха
  choice: Израиль
  alternative: Иаков
  rationale: Перевод сохраняет намеренную смену обозначения в исходном тексте и не гармонизирует её; пояснение личности дано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире перед «врачам» ясно показывает, что врачи входят в число упомянутых слуг. Глагол «набальзамировать» точно передаёт египетскую погребальную практику и позволяет сохранить повтор исходного глагола.
