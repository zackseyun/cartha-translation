  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «земли Египетской» слегка приподнята стилистически, но понятна и точно сохраняет אֶרֶץ מִצְרַיִם. Маркер [a] помещён непосредственно после относящейся к нему фразы.
