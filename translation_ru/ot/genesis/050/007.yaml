  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: ru
  text: Иосиф отправился хоронить своего отца[a]. Вместе с ним отправились все слуги фараона, старейшины дома фараона и все старейшины земли Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялся хоронить своего отца». В еврейском тексте так обычно обозначается путь из Египта в Ханаан.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: отправился
  rationale: עָלָה буквально означает «подниматься, идти вверх» и здесь обозначает путь из Египта в Ханаан. В основном тексте естественное русское «отправился» передаёт начало пути, а географический оттенок еврейского оборота отмечен в сноске.
- source_word: לִקְבֹּר
  choice: хоронить
  rationale: Инфинитив קָבַר означает «хоронить, погребать». «Хоронить» ясно и естественно для современного русского повествования.
- source_word: אָבִיו
  choice: своего отца
  rationale: Возвратное притяжательное местоимение «своего» естественно соотносит отца с подлежащим «Иосиф» и не добавляет отсутствующего в еврейском тексте смыслового акцента.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: Вместе с ним отправились
  rationale: Сохраняется повтор глагола движения из еврейского текста, но порядок слов приспособлен к естественному русскому синтаксису.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: все слуги фараона
  rationale: עֶבֶד имеет широкий диапазон значений — «раб, слуга, служитель». При царском дворе «слуги» сохраняет широту термина и не уточняет без основания должностной статус.
- source_word: זִקְנֵי בֵיתוֹ
  choice: старейшины его дома
  rationale: Перевод сохраняет обычные соответствия זָקֵן — «старейшина» и בַּיִת — «дом»; в контексте речь идёт о старших представителях дома или двора фараона.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: и все старейшины земли Египетской
  rationale: Формулировка сохраняет как זִקְנֵי («старейшины»), так и אֶרֶץ («земля»), передавая более широкий круг руководителей Египта.
