translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Синтаксис упрощён там, где буквальное повторение לֵאמֹר звучало бы неестественно, но незавершённость речи, продолжающейся в следующем стихе, сохранена двоеточием.
