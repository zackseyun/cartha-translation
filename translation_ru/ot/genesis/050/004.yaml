  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: ru
  text: 'Когда миновали дни плача по нему[a], Иосиф обратился к придворным фараона: «Если я нашёл благоволение в ваших глазах, прошу, скажите фараону[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дни его оплакивания».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «скажите в уши фараона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: миновали
  rationale: Глагол עבר здесь описывает истечение установленного времени; «миновали» естественно передаёт завершение периода и сохраняет повествовательный регистр.
- source_word: יְמֵי בְכִיתוֹ
  choice: дни плача по нему
  rationale: בכי буквально обозначает плач; в погребальном контексте речь идёт об оплакивании умершего. Формулировка сохраняет образ плача и временное выражение «дни».
- source_word: וַיְדַבֵּר יוֹסֵף אֶל בֵּית פַּרְעֹה
  choice: Иосиф обратился к придворным фараона
  rationale: בית פרעה здесь обозначает людей царского дома, через которых Иосиф передаёт просьбу, а не здание. «Придворные» ясно передаёт социальный смысл в современном русском языке.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Если я нашёл благоволение в ваших глазах
  rationale: Сохранён прозрачный древнееврейский образ «найти благоволение в глазах»; частица נָא выражает учтивую просьбу, которая по-русски естественно передана далее словом «прошу».
- source_word: דַּבְּרוּ נָא
  choice: прошу, скажите
  rationale: Императив множественного числа и частица вежливой просьбы переданы естественной русской формулой почтительного обращения.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: скажите фараону
  rationale: Буквально «в уши фараона» — идиома, означающая довести слова до его слуха. В основном тексте употреблена естественная русская передача, а буквальный образ отмечен в сноске.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью и передаваемыми словами
  rationale: Оба употребления инфинитива речи функционально вводят цитату; русская пунктуация передаёт эту функцию без тяжеловесного повторения «говоря».
