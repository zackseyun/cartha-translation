  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: ru
  text: 'Иосиф взял с сынов Израиля клятву, сказав: «Бог непременно позаботится о вас, и вынесите мои кости отсюда».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: взял клятву с
  rationale: Каузативная форма означает, что Иосиф обязал сынов Израиля поклясться; это передано естественным русским оборотом.
- source_word: פָּקֹד יִפְקֹד
  choice: непременно позаботится
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает уверенность действия. В данном контексте פקד обозначает Божье благосклонное вмешательство и заботу, а не буквальное посещение.
- source_word: וְהַעֲלִתֶם
  choice: и тогда вынесите
  rationale: Каузативное «поднимете/выведете» в контексте костей естественно передаётся как «вынесите»; союз допускает временно-следственную связь с будущим Божьим вмешательством.
- source_word: עַצְמֹתַי
  choice: мои кости
  rationale: Прямое и точное соответствие исходному выражению.
theological_decisions:
- issue: Характер Божьего действия в выражении פָּקֹד יִפְקֹד
  choice: Бог непременно позаботится о вас
  alternative: Бог непременно посетит вас
  rationale: «Позаботится» ясно передаёт благоприятный смысл Божьего вмешательства в данном контексте, не уточняя сверх текста способ исполнения.
- issue: Сила повеления וְהַעֲלִתֶם
  choice: и тогда вынесите
  alternative: и вы должны вынести
  rationale: Императивная сила вытекает из взятой клятвы; русская форма повелительного наклонения передаёт обязательность без добавления модального выражения, отсутствующего в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык; торжественность сцены сохранена без архаизмов. Формулировка краткая и пригодная для публичного чтения.
