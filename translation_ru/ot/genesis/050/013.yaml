base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: ru
  text: Его сыновья отнесли его в землю Ханаан и похоронили в пещере, находившейся на поле Махпелы напротив Мамре, — поле это Авраам купил у Ефрона-хетта во владение для погребения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: отнесли его
  rationale: В данном повествовательном контексте נשׂא означает физически перенести тело; «отнесли» естественно передаёт направленное движение в землю Ханаанскую.
- source_word: בָנָיו
  choice: его сыновья
  rationale: Еврейский текст прямо называет сыновей, а не детей вообще.
- source_word: אַרְצָה כְּנַעַן
  choice: в землю Ханаанскую
  rationale: Передаёт существительное «земля» и направительный суффикс; форма соответствует современному литературному библейскому регистру.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: в пещере на поле Махпела
  rationale: Естественно по-русски передаёт конструктивную цепочку «пещера поля Махпела», не превращая Махпелу однозначно в название самой пещеры.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: поле, которое Авраам купил
  rationale: Еврейская возобновительная конструкция явно называет поле прямым дополнением глагола «купил»; русская формулировка устраняет двусмысленность и остаётся естественной.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: во владение для погребения
  rationale: אֲחֻזָּה обозначает закреплённое владение, а קֶבֶר указывает его назначение; перевод сохраняет оба смысловых компонента.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: у Ефрона-хетта
  rationale: При глаголе «купил» русский оборот «купил у» естественно передаёт источник приобретения; этноним сохранён.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: напротив Мамре
  rationale: Фраза обозначает пространственное положение перед или напротив ориентира; «напротив» кратко сохраняет эту связь.
