revisions:
- from: Его сыновья отнесли его в землю Ханаанскую и похоронили в пещере на поле Махпела — поле, которое Авраам купил у Ефрона-хетта напротив Мамре во владение для погребения.
  to: Его сыновья отнесли его в землю Ханаан и похоронили в пещере, находившейся на поле Махпелы напротив Мамре, — поле это Авраам купил у Ефрона-хетта во владение для погребения.
  rationale: 'Перевод сохраняет возобновительную конструкцию оригинала: относительное «которое» соотносится с пещерой/местом, тогда как прямо названный объект покупки — поле. Русское «поле это» воспроизводит данный эффект без двусмысленного оборота «купил вместе с полем». Обстоятельство «напротив Мамре» поставлено при поле Махпелы, к которому оно относится.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:21:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Нужно точнее передать связь «пещера поля Махпелы»: исходный текст говорит о пещере, принадлежащей/находящейся в поле, а не просто о пещере «на поле». Также «напротив Мамре» следует синтаксически отнести к месту поля, а не к Ефрону.'
  naturalness: Исходная фраза в целом понятна, однако тире с повтором «поле» и конечное «напротив Мамре» создают тяжёлую конструкцию и допускают неверное присоединение обстоятельства к Ефрону. Перестройка делает фразу естественнее для современного литературного русского.
  terminology: «Ханаан», «Махпела», «Ефрон-хетт» и «владение для погребения» уместны и сохраняют терминологические и исторические элементы еврейского текста. «Земля Ханаанская» допустима, но нейтральное «земля Ханаан» современнее.
  issues:
  - severity: medium
    issue: Неточная передача בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה.
    rationale: Оборот «в пещере на поле Махпела» может обозначать лишь расположение пещеры на поверхности поля. Конструктивная цепочка уточняет, что это пещера поля Махпелы; русское «в пещере, находившейся на поле Махпелы» передаёт это ясно и естественно.
  - severity: medium
    issue: Неясная область действия «напротив Мамре».
    rationale: В текущем порядке слов финальное обстоятельство может быть прочитано как характеристика Ефрона-хетта. В еврейском тексте оно локализует поле/пещеру; его следует поставить рядом с обозначением места.
  revised_text: Его сыновья отнесли его в землю Ханаан и похоронили в пещере, находившейся на поле Махпелы напротив Мамре, — поле это Авраам купил у Ефрона-хетта во владение для погребения.
