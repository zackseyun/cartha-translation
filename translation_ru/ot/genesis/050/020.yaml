  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: ru
  text: Вы замыслили против меня зло, но Бог замыслил его во благо, чтобы, как ныне[a], сохранить жизнь множеству людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделать, как в этот день». Еврейский оборот указывает на нынешнее, видимое положение дел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: замыслили / замыслил
  rationale: 'Одинаковый русский корень сохраняет намеренный параллелизм еврейского текста: братья сознательно замышляли зло, а Бог имел благую цель в отношении того же события.'
- source_word: עָלַי רָעָה
  choice: против меня зло
  rationale: Предлог עַל при חָשַׁב здесь имеет враждебную направленность, а רָעָה несёт не только значение вреда, но и нравственную оценку.
- source_word: לְטֹבָה
  choice: во благо
  rationale: Естественно передаёт резкое противопоставление злу и сохраняет целевую направленность Божьего замысла.
- source_word: לְמַעַן עֲשֹׂה
  choice: чтобы осуществить
  rationale: לְמַעַן вводит цель, а широкое по значению עשה в данном контексте обозначает осуществление исторического результата.
- source_word: כַּיּוֹם הַזֶּה
  choice: то, что ныне стало явью
  rationale: Еврейское указательное выражение отсылает к видимому в настоящий момент результату; перевод делает этот смысл ясным, не превращая его просто в календарное указание.
- source_word: לְהַחֲיֹת עַם רָב
  choice: сохранить жизнь множеству людей
  rationale: Каузативная форма חיה означает сохранение жизни, а собирательное עַם רָב здесь естественно передаётся как большое число людей без обязательного указания на один этнос.
theological_decisions:
- issue: Божественное провидение и человеческое зло в параллельном употреблении חָשַׁב
  choice: Для действий братьев и Бога сохранён один глагол «замыслить»
  alternative: Передать действия разными глаголами, например «вы замышляли», а «Бог обратил во благо»
  rationale: Еврейский текст намеренно ставит рядом человеческий злой замысел и Божий благой замысел относительно того же события. Одинаковый глагол сохраняет эту напряжённость и не утверждает, будто Бог совершал нравственное зло так же, как братья.
- issue: Нравственное или только событийное значение רָעָה
  choice: зло
  alternative: вред
  rationale: Поступок братьев нравственно виновен; слово «зло» сохраняет эту оценку и точное противопоставление благу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллелизм «замыслили — замыслил» сохранён; фраза о «ныне» передана понятно, а более буквальная форма вынесена в сноску.
