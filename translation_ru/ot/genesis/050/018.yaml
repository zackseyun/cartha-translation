  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: ru
  text: 'Тогда пришли и его братья, пали перед ним и сказали: «Вот мы — твои рабы».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои слуги». Еврейское עֲבָדִים может означать как рабов, так и слуг; здесь слово «рабы» передаёт особенно сильное выражение покорности братьев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: пришли
  rationale: Хотя הלך буквально означает «идти», движение направлено к Иосифу, поэтому по-русски естественно «пришли».
- source_word: גַּם אֶחָיו
  choice: и его братья
  rationale: 'גַּם отмечает добавление: после ранее посланного сообщения братья пришли сами; русское «и» естественно передаёт эту связь.'
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: пали перед ним
  rationale: Оборот обозначает физическое падение ниц как выражение подчинения; «пали перед ним» сохраняет образ и звучит достойно.
- source_word: וַיֹּאמְרוּ
  choice: и сказали
  rationale: Стандартное повествовательное введение прямой речи.
- source_word: הִנֶּנּוּ
  choice: вот мы
  rationale: Формула самопредставления и готовности; «вот мы» кратко и естественно передаёт её силу.
- source_word: לְךָ לַעֲבָדִים
  choice: твои рабы
  rationale: Конструкция выражает предлагаемое состояние полного подчинения Иосифу; притяжательная форма естественна по-русски.
theological_decisions:
- issue: Значение עֲבָדִים в заявлении о самоподчинении
  choice: рабы
  alternative: слуги
  rationale: עֶבֶד допускает значения «раб» и «слуга». Здесь падение братьев перед Иосифом и их предложение себя в полное подчинение поддерживают более сильное «рабы», однако лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-повествовательным звучанием. «Пали» сохраняет достоинство библейского рассказа без излишней архаизации; неоднозначность עֲבָדִים вынесена в сноску.
