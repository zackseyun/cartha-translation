base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: ru
  text: 'Когда хананеи, жители той земли, увидели траур на гумне Атада, они сказали: «Великий траур у египтян». Поэтому то место назвали Авел-Мицраим[a]. Оно находится за Иорданом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Авел-Мицраим» созвучно еврейскому выражению «траур Египта».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по ту сторону Иордана»; выражение зависит от географической точки наблюдения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: жители той земли, хананеи
  rationale: Причастие в единственном числе имеет собирательное значение, а «хананеи» сохраняет пояснительное приложение еврейского текста. Указательное «той» естественно передаёт определённость уже известной земли.
- source_word: הָאֵבֶל
  choice: плач
  rationale: В данном погребальном контексте слово обозначает траурный плач и скорбь; «плач» также позволяет отразить в примечании созвучие с названием Авел-Мицраим.
- source_word: בְּגֹרֶן הָאָטָד
  choice: у гумна Атада
  rationale: «Гумно» — точное и понятное русское обозначение места молотьбы; предлог ב здесь указывает на местонахождение и естественно передаётся как «у».
- source_word: אֵבֶל כָּבֵד
  choice: велик этот плач
  rationale: כָּבֵד буквально связано с тяжестью, но здесь выражает силу и значительность траура. «Велик плач» звучит естественно и сохраняет возвышенный регистр.
- source_word: לְמִצְרָיִם
  choice: у египтян
  rationale: Форма буквально называет Египет, однако по контексту речь о египетской группе. Русское «у египтян» естественно обозначает принадлежность плача им, не превращая его в плач по египтянам.
- source_word: עַל כֵּן קָרָא שְׁמָהּ
  choice: Поэтому то место назвали
  rationale: Безлично-неопределённая русская конструкция не добавляет названного субъекта и естественно передаёт еврейскую формулу наречения имени. «То место» проясняет женский суффикс и его географический референт.
- source_word: אָבֵל מִצְרַיִם
  choice: Авел-Мицраим
  rationale: Название транслитерировано с еврейского, а его смысл и игра слов объяснены в примечании.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Обычное русское географическое выражение, сохраняющее зависимость обозначения от точки наблюдения; возможный вариант пояснён в примечании.
