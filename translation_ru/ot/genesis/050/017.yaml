  terminology: Сохранено различие между פֶּשַׁע и חַטָּאת через «проступок» и «грех». «Слуги Бога твоего отца» точно передаёт עַבְדֵי אֱלֹהֵי אָבִיךָ и не вносит конфессионального толкования. «Иосиф» соответствует принятой русской библейской передаче имени.
