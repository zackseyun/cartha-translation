  source_fidelity: 'В заключительной фразе добавлено отсутствующее в еврейском тексте «это»: בְּדַבְּרָם אֵלָיו означает «когда они говорили с ним / обращались к нему». Кроме того, גְמָלוּךָ выражает воздаяние/отплату; «причинили тебе зло» передаёт результат, но утрачивает этот существенный оттенок. Английский POB верно сохраняет его: «they repaid you with evil».'
