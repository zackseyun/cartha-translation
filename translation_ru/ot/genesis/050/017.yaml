base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: ru
  text: 'Так скажите Иосифу: «Прошу, прости проступок твоих братьев и их грех, ибо они отплатили тебе злом. И теперь, прошу, прости проступок слуг Бога твоего отца». Иосиф заплакал, когда они говорили с ним.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: «прошу, прости»
  rationale: Буквально глагол означает «подними, понеси», но в сочетании с «преступлением/грехом» это устойчивое выражение о прощении; частица נָא передаёт настойчивую вежливую просьбу.
- source_word: פֶּשַׁע
  choice: «преступление»
  rationale: Сохраняет смысл сознательного нарушения или проступка и отличает это слово от следующего חַטָּאת, «грех».
- source_word: רָעָה גְמָלוּךָ
  choice: «они причинили тебе зло»
  rationale: Передаёт совершённое братьями зло естественным современным русским языком, не сужая смысл до обязательного воздаяния или отплаты.
- source_word: עַבְדֵי
  choice: «слуг»
  rationale: В данном религиозном самообозначении «слуги» звучит современно и достойно; «рабы» было бы формальнее, но могло бы вызвать излишне социально-правовые ассоциации.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: «когда они говорили ему это»
  rationale: Сохраняет неопределённое множественное подлежащее еврейского текста и не решает без необходимости, говорили ли братья лично или через посланников.
theological_decisions:
- issue: 'Основание просьбы о прощении: «слуги Бога твоего отца»'
  choice: Сохранено дословно как «слуг Бога твоего отца»
  alternative: «нас, служителей Бога твоего отца»
  rationale: Исходный текст говорит в третьем лице и связывает просьбу с общей верностью Богу отца Иосифа; перевод не должен превращать эту формулировку в прямое самообозначение или добавлять богословское толкование.
- issue: Соотношение «преступления» и «греха»
  choice: Сохранены оба существительных
  alternative: Обобщить как «вину» или «зло»
  rationale: Два термина исходного текста усиливают признание вины и не должны сливаться в одно понятие.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повтор «прошу, прости» сохранён в обеих просьбах; синтаксис сделан ясным без устранения неопределённости местоимения «они» в заключительной фразе.
