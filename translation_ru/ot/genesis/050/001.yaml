lexical_decisions:
- source_word: וַיִּפֹּל
  choice: припал
  rationale: Глагол נפל буквально означает «пасть». В данном контексте «припал» естественно передаёт резкое телесное движение Иосифа к умершему отцу, не добавляя идеи случайного падения или потери сознания.
- source_word: עַל פְּנֵי אָבִיו
  choice: к лицу своего отца
  rationale: Сохраняется конкретный образ лица отца, а предлог «к» в сочетании с «припал» делает фразу естественной по-русски. Более буквальное «на лицо своего отца» допускается в примечании, поскольку еврейский предлог עַל буквально указывает на положение «на/над».
- source_word: וַיֵּבְךְּ עָלָיו
  choice: плакал над ним
  rationale: בכה означает «плакать, рыдать»; «плакал» звучит естественно и достойно. Сочетание עַל с местоименным суффиксом здесь выражает плач над умершим.
- source_word: וַיִּשַּׁק לוֹ
  choice: целовал его
  rationale: נשק в породе qal означает «целовать». Русская конструкция с прямым дополнением естественно передаёт еврейский оборот с לְ.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
