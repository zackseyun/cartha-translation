  text: וַ/יַּ֣עַל עִמּ֔/וֹ גַּם רֶ֖כֶב גַּם פָּרָשִׁ֑ים וַ/יְהִ֥י הַֽ/מַּחֲנֶ֖ה כָּבֵ֥ד מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: ru
  text: Вместе с ним отправились и колесницы[b], и всадники, и всё шествие было очень большим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стан был очень тяжёлым», то есть весьма многочисленным, значительным или внушительным.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте «колесница» стоит в единственном числе, но употреблено собирательно — об отряде колесниц.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: отправились
  rationale: В рассказе о пути глагол עלה обозначает движение из Египта в Ханаан. Русское «отправились» естественно передаёт начало и продолжение пути, не навязывая буквального восхождения.
- source_word: עִמּוֹ
  choice: вместе с ним
  rationale: Прямо передаёт сопровождение Иосифа; «вместе» естественно для современного русского повествования.
- source_word: גַּם ... גַּם
  choice: и ... и
  rationale: Парная конструкция подчёркивает, что к сопровождавшим присоединились обе группы; русское «и ... и» точно и плавно воспроизводит эту связь.
- source_word: רֶכֶב
  choice: колесницы
  rationale: Единственное число употреблено собирательно и обозначает отряд колесниц; в русском естественнее множественное число.
- source_word: פָּרָשִׁים
  choice: всадники
  rationale: Точное, ясное и стилистически достойное обозначение конных воинов или сопровождающих верхом без излишне современной военной терминологии.
- source_word: הַמַּחֲנֶה
  choice: всё шествие
  rationale: В данном погребальном путешествии слово означает всю сопровождающую группу, а не обязательно стоянку или укреплённый лагерь. «Шествие» ясно передаёт движущуюся процессию.
- source_word: כָּבֵד מְאֹד
  choice: было очень большим
  rationale: Буквально выражение означает «было очень тяжёлым», но применительно к группе указывает на её значительность, многочисленность или внушительность. Основной текст передаёт наиболее доступный контекстуальный смысл, а образность сохранена в примечании.
