  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: ru
  text: 'Но Иосиф сказал им: «Не бойтесь, ведь разве я на месте Бога?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве я под Богом?» Еврейский оборот допускает буквальное понимание «под Богом», однако здесь, вероятнее всего, означает «на месте Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Но Иосиф сказал им
  rationale: Глагол אמר в повествовательной форме естественно передаётся как «сказал». Союз ו здесь связывает ответ Иосифа с предыдущей речью братьев и по контексту имеет лёгкий противительный оттенок, поэтому выбран союз «но».
- source_word: אַל תִּירָאוּ
  choice: Не бойтесь
  rationale: Отрицательная конструкция с ירא выражает прямое увещевание, обращённое к братьям; «не бойтесь» точно и естественно передаёт её в современном русском языке.
- source_word: כִּי
  choice: передано связью между фразами без отдельного слова
  rationale: כִּי вводит основание для успокоения братьев. В русском языке пояснительная сила естественно выражается непосредственно следующим риторическим вопросом; добавление «ведь» возможно, но сделало бы фразу несколько тяжелее.
- source_word: הֲתַחַת אֱלֹהִים אָנִי
  choice: Разве я на месте Бога?
  rationale: В данном контексте תַּחַת אֱלֹהִים наиболее естественно обозначает занятие Божьего места или присвоение Божьей роли. Частица הֲ передаётся риторическим «разве», а самостоятельное אָנִי сохраняет смысловое ударение на «я».
theological_decisions:
- issue: Смысл риторического вопроса Иосифа о Божьей прерогативе
  choice: Иосиф отрицает, что занимает место Бога и вправе присваивать себе Его роль судьи или мстителя.
  alternative: Иосиф спрашивает, не находится ли он «под Богом», то есть под Божьей властью.
  rationale: В ситуации, когда братья боятся возмездия, оборот תַּחַת אֱלֹהִים наиболее вероятно означает «на месте Бога». Перевод сохраняет различие между Божьей и человеческой ролью, не добавляя более узкого доктринального истолкования.
translation_notes:
  register: Современный литературный русский язык с краткой, ясной и достойной повествовательной формой. Риторический вопрос сохранён; архаизмы и конфессионально окрашенные формулировки не используются.
