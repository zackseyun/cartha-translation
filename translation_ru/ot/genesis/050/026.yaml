lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямо передаёт значение глагола מות без эвфемизма; начальное ו естественно выражено союзом «И», продолжающим повествование.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: в возрасте ста десяти лет
  rationale: Естественно передаёт еврейскую возрастную конструкцию с буквальным значением «сын ста десяти лет».
- source_word: וַיַּחַנְטוּ אֹתוֹ
  choice: Его набальзамировали
  rationale: Глагол חנט обозначает бальзамирование; пассивная русская конструкция естественна при неопределённом множественном субъекте «они».
- source_word: וַיִּישֶׂם
  choice: положили
  rationale: В данном контексте обычный русский глагол «положили» точно и естественно передаёт שׂים.
- source_word: בָּאָרוֹן
  choice: в гроб
  rationale: Существительное אָרוֹן может означать ящик, ковчег или гроб; погребальный контекст определяет здесь значение «гроб». Русский язык естественно допускает форму без отдельной передачи артикля.
- source_word: בְּמִצְרָיִם
  choice: в Египте
  rationale: Стандартная передача географического названия.
