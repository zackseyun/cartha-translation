lexical_decisions:
- source_word: וְשָׂרַי
  choice: Сара
  rationale: Союз ו вводит очередное сообщение повествования и не требует отдельного русского «и» в начале стиха. Имя передано в принятой русской библейской форме «Сара», отличной от последующего имени שָׂרָה — «Сарра».
- source_word: אֵשֶׁת אַבְרָם
  choice: жена Аврама
  rationale: Естественно передаёт конструкцию сопряжённого состояния и прямо сохраняет указание на брачные отношения.
- source_word: לֹא יָלְדָה לוֹ
  choice: не рожала ему детей
  rationale: Глагол означает рождение потомства; «детей» эксплицирует подразумеваемый объект, необходимый для естественного русского выражения. Несовершенный вид передаёт фоновое положение дел к этому моменту повествования.
- source_word: וְלָהּ
  choice: у неё была
  rationale: Еврейская конструкция обладания буквально «и у неё [была]» естественно сохраняется в русском.
- source_word: שִׁפְחָה מִצְרִית
  choice: рабыня-египтянка
  rationale: שִׁפְחָה обозначает зависимую женщину домашнего хозяйства, находившуюся в рабском статусе; «рабыня» не смягчает эту социальную реальность. «Египтянка» естественно передаёт этническое происхождение.
- source_word: וּשְׁמָהּ הָגָר
  choice: по имени Агарь
  rationale: Кратко и естественно передаёт прямое еврейское указание «и имя её — Агарь»; имя дано в принятой русской библейской форме.
