  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: указательное «вот», подневольный статус Агари («рабыня»), идиому власти («в твоей власти»), разрешение Аврама поступить с нею по усмотрению Сары, последующее притеснение и бегство Агари от Сары. «Стала притеснять» адекватно передаёт וַתְּעַנֶּהָ, не конкретизируя неуказанный вид жестокого обращения.'
  naturalness: Перевод звучит естественно на современном литературном русском. «Та убежала от неё» ясно разграничивает Сару и Агарь и уместно в повествовательном регистре. Формула «так, как считаешь хорошим» несколько ближе к исходной оценочной формуле, но остаётся понятной и гладкой.
  terminology: «Рабыня» верно сохраняет социальный статус שפחה и не смягчает его до «служанки». «Притеснять» и варианты в сноске передают семантический диапазон ענה в piel без конфессиональной или чрезмерно конкретной интерпретации. Имена Аврам и Сара соответствуют русской библейской традиции для данного этапа повествования.
