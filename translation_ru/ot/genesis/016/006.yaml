  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: ru
  text: 'Аврам сказал Саре: «Вот, твоя рабыня в твоей власти; поступай с ней так, как считаешь хорошим». Сара стала притеснять её[a], и та убежала от неё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стала жестоко обращаться с ней»; возможно также: «стала унижать её». Еврейский глагол может обозначать притеснение, унижение или причинение страдания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Естественный современный указательный маркер, сохраняющий дейктическую силу еврейского слова без архаизации.
- source_word: שִׁפְחָתֵךְ
  choice: твоя рабыня
  rationale: Слово обозначает женщину в подневольном положении; «рабыня» прямо передаёт её несвободный статус и не смягчает властную иерархию.
- source_word: בְּיָדֵךְ
  choice: в твоей власти
  rationale: Передаёт смысл еврейской идиомы «в твоей руке» естественным русским выражением, ясно указывающим на власть Сары над Агарью.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: поступай с ней так, как считаешь хорошим
  rationale: Сохраняет оценочный компонент «хорошее в твоих глазах», но выражает его понятным современным русским языком.
- source_word: וַתְּעַנֶּהָ
  choice: стала притеснять её
  rationale: Порода piel глагола ענה указывает на причинение страдания, унижение или жестокое обращение. «Притеснять» передаёт реальность угнетения, не уточняя не названную в тексте форму обращения.
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: и та убежала от неё
  rationale: «Убежала» естественно передаёт бегство, а местоимение «та» устраняет возможную неясность относительно того, кто бежал; «от неё» идиоматично выражает מִפָּנֶיהָ.
theological_decisions:
- issue: Социальный статус Агари
  choice: рабыня
  alternative: служанка
  rationale: Контекст строится на неравенстве власти, поэтому обозначение подневольного статуса не следует смягчать общим словом «служанка».
- issue: Степень жестокости в וַתְּעַנֶּהָ
  choice: притесняла её
  alternative: жестоко обращалась с ней / унижала её
  rationale: Еврейский глагол обозначает действительное угнетение или причинение страдания, но не уточняет его конкретную форму. Основной текст сохраняет эту смысловую широту, а варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным строем. Сохранена серьёзность сцены и властная асимметрия; буквальные еврейские идиомы переданы естественно, без устранения смысловой напряжённости.
