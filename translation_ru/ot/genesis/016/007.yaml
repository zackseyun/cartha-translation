  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: ru
  text: И ангел Яхве[a] нашёл её у источника воды в пустыне — у источника на дороге в Шур.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник Яхве». Еврейское слово может означать и «ангел», и «посланник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: И нашёл её
  rationale: Глагол מצא в повествовательной форме естественно означает «нашёл»; суффикс женского рода указывает на Агарь.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве[a]
  rationale: מַלְאַךְ может означать как «ангел», так и «посланник». В данном контексте традиционное «ангел» уместно, а сноска сохраняет лексическую альтернативу. Имя יהוה передано транслитерацией «Яхве».
- source_word: עַל עֵין הַמַּיִם
  choice: у источника воды
  rationale: עַיִן здесь обозначает источник, что ясно из сочетания с «водой» и контекста пустыни; עַל в данном местном употреблении естественно передаётся предлогом «у».
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает необжитую пустынную местность; современное русское «пустыня» здесь естественно и не обязательно подразумевает пески.
- source_word: עַל הָעַיִן
  choice: у того источника
  rationale: Повтор существительного локализует место; указательное «того» естественно показывает, что речь идёт о только что названном источнике.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: по дороге в Шур
  rationale: דֶּרֶךְ означает «дорога, путь»; конструкция указывает на дорогу, ведущую к Шуру.
theological_decisions:
- issue: Передача выражения מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Выбор «ангел» соответствует контексту явления божественного посланника, но сноска сохраняет реальную двузначность מַלְאַךְ и не предрешает природу персонажа.
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация передаёт личное имя, непосредственно присутствующее в еврейском тексте, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «источник» сохранён, но сделан естественным посредством «того». Божественное имя передано как «Яхве».
