  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: ru
  text: Агарь родила Авраму сына, и Аврам назвал своего сына, которого родила Агарь, Измаилом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Глагол ילד в породе qal при подлежащем женского рода означает «родить»; это прямой и естественный русский эквивалент.
- source_word: לְאַבְרָם
  choice: Авраму
  rationale: 'Предлог ל обозначает здесь отношение к отцу: Агарь родила сына Авраму. Русский дательный падеж точно и естественно передаёт эту связь.'
- source_word: בֵּן
  choice: сына
  rationale: После переходного глагола «родила» русская форма винительного падежа естественно передаёт еврейское существительное без артикля.
- source_word: וַיִּקְרָא ... שֶׁם
  choice: назвал
  rationale: Еврейская конструкция буквально означает «нарёк имя», но в современном русском повествовании «назвал» естественно передаёт действие именования без потери смысла.
- source_word: בְּנוֹ
  choice: своего сына
  rationale: Возвратное притяжательное местоимение ясно указывает, что речь идёт о сыне Аврама, и соответствует нормам современного русского языка.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: которого родила Агарь
  rationale: Относительное придаточное сохранено, включая повторное упоминание Агари, как в еврейском тексте.
- source_word: יִשְׁמָעֵאל
  choice: Измаилом
  rationale: Использована устоявшаяся русская библейская форма имени; творительный падеж требуется современной конструкцией «назвал ... Измаилом».
