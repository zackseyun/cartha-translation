base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: ru
  text: 'Тогда Сара сказала Авраму: «За причинённую мне несправедливость отвечаешь ты.[a] Я сама отдала свою рабыню в твои объятия,[b] а она, увидев, что зачала, стала считать меня презренной. Пусть Яхве рассудит между мной и тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Моя обида/несправедливость — на тебе». Речь может идти о несправедливости, которую претерпела Сара и ответственность за которую она возлагает на Аврама.'
    reason: Сохраняется более буквальная форма неоднозначного выражения חֲמָסִי עָלֶיךָ.
  - marker: b
    text: 'Буквально: «в твоё лоно»; это сдержанный образ интимной близости.'
    reason: Поясняется телесная метафора еврейского выражения בְּחֵיקֶךָ.
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: За обиду, нанесённую мне, отвечаешь ты
  rationale: חָמָס обозначает насилие, несправедливость или причинённую обиду, а עַל указывает здесь на ответственность. Формулировка передаёт обвинение Сары, не представляя её виновницей проступка.
- source_word: שִׁפְחָתִי
  choice: свою рабыню
  rationale: שִׁפְחָה обозначает женщину в подневольном положении; «рабыня» ясно передаёт её общественный статус и естественно звучит по-русски.
- source_word: בְּחֵיקֶךָ
  choice: в твои объятия
  rationale: Буквально «на твою грудь/в твоё лоно»; в данном контексте это сдержанный образ интимного союза. «В твои объятия» сохраняет образность без архаичности и чрезмерной конкретизации.
- source_word: הָרָתָה
  choice: зачала
  rationale: Форма глагола указывает на состоявшееся зачатие. «Увидев, что зачала» близко передаёт последовательность еврейского текста.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: стала смотреть на меня с презрением
  rationale: Буквально Сара «стала малозначительной/презренной в её глазах». Естественная русская формулировка передаёт утрату уважения в оценке Агари, хотя грамматическая перспектива выражена динамически.
- source_word: יִשְׁפֹּט
  choice: Пусть … рассудит
  rationale: Юссив выражает призыв к божественному суду, а не простое предсказание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не замещающий титул.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: между мной и тобой
  rationale: Сохранена прямая формула обращения к Богу как к судье между двумя сторонами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация отличает его от титула אֲדֹנָי.
- issue: Характер обращения к божественному суду
  choice: Пусть Яхве рассудит между мной и тобой
  alternative: Яхве рассудит между мной и тобой
  rationale: Глагольная форма допускает оттенок волеизъявления; контекст жалобы поддерживает призыв к суду, а не нейтральное предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Имена переданы в привычной русской форме «Сара» и «Аврам». Архаизмы сведены к минимуму; социальный статус Агари обозначен прямо словом «рабыня».
