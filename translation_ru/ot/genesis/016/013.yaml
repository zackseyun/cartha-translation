  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: ru
  text: 'И она дала Яхве, говорившему с нею, имя: «Ты — Бог, видящий меня»[a], потому что сказала: «Неужели и здесь я увидела вслед за Тем, кто видит меня?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Ты — Бог, Который видит» или «Ты — Бог видения».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза на еврейском трудна для понимания. Возможно: «Неужели я и здесь увидела Того, кто видел меня, и осталась жива?»'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: И она назвала Яхве
  rationale: Еврейская конструкция буквально говорит о «призывании/наречении имени», но по-русски «назвала Яхве» естественно передаёт то, что Агарь даёт говорившему с ней Богу описательное именование, не создавая впечатления, будто она лишь произнесла уже известное имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: говорившего с ней
  rationale: Причастная конструкция определяет Яхве как Того, кто обращался к Агари; русский оборот сохраняет эту связь.
- source_word: אַתָּה אֵל רֳאִי
  choice: Ты — Бог, видящий меня
  rationale: Неясная форма רֳאִי допускает значения, связанные с видением и с Тем, кто видит. Основной вариант естественно выражает контекстуальную мысль о Боге, который видит Агарь, не делая выражение чрезмерно определённым.
- source_word: כִּי אָֽמְרָה
  choice: потому что сказала
  rationale: Союз вводит объяснение данного Богу именования.
- source_word: הֲגַם הֲלֹם
  choice: Неужели и здесь
  rationale: Сочетание вопросительных и усилительных частиц передаёт изумление Агари и подчёркивает место встречи.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: я увидела вслед за Тем, кто видит меня
  rationale: Формулировка намеренно удерживает трудную последовательность «увидела — вслед/после — видящий меня», не добавляя в основной текст отсутствующую прямо в еврейском мысль о сохранении жизни.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит тетраграмматон как личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл именования אֵל רֳאִי
  choice: Бог, видящий меня
  alternative: Бог видения; Бог, Который видит
  rationale: Выбранный вариант соответствует непосредственному переживанию Агари, но иные возможные оттенки отмечены в сноске.
- issue: Смысл заключительной фразы רָאִיתִי אַחֲרֵי רֹאִי
  choice: Неужели и здесь я увидела вслед за Тем, кто видит меня?
  alternative: Неужели я и здесь увидела Того, кто видел меня, и осталась жива?
  rationale: Еврейская фраза синтаксически сжата и допускает разные толкования. Основной текст сохраняет её напряжённость, а распространённое толкование о выживании после богоявления вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис первой части сделан естественным для русского; трудность заключительной фразы сохранена, но выражена грамматически связно. Все сноски отмечены в основном тексте.
