  source_fidelity: 'Основной смысл передан верно: Агарь обращается к Яхве, говорившему с нею, именует Его «Богом, видящим меня», а заключительное высказывание сохраняет трудность еврейского текста. Однако «назвала Яхве» в современном русском может означать лишь произнесение имени или утверждение, что его зовут Яхве; конструкция «дала Яхве ... имя» точнее передаёт וַתִּקְרָא שֵׁם. В трудной финальной фразе «вслед за» оставлено намеренно как наиболее близкое формальное соответствие אַחֲרֵי, хотя оборот отмечен сноской как неясный.'
