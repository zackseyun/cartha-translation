base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: ru
  text: 'Тогда Сарай сказала Авраму: «Вот, Яхве не даёт мне рожать. Войди же к моей рабыне; может быть, через неё я обрету детей[a]». И Аврам послушался голоса Сарай.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «может быть, я буду построена через неё». Это выражение может означать обретение детей или устроение семьи и продолжение рода.'
    reason: Сноска сохраняет строительную метафору еврейского глагола בנה и не сводит её возможный смысл только к одному толкованию.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда … сказала
  rationale: Вав с последовательной формой продвигает повествование; «тогда» естественно передаёт развитие событий.
- source_word: שָׂרַי
  choice: Сара
  rationale: Употреблена укоренившаяся в русской библейской традиции форма имени; контекст отличает её от последующего наречения нового имени.
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: «Вот» сохраняет функцию привлечения внимания; оттенок частицы נָא передан естественным русским построением без тяжеловесного «вот, пожалуйста».
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: Яхве не даёт мне рожать
  rationale: Естественная русская формулировка сохраняет прямое приписывание бездетности действию Яхве и не добавляет богословского объяснения.
- source_word: בֹּא נָא אֶל
  choice: Войди же к
  rationale: Сохранён принятый в исходном тексте эвфемизм половой близости; «же» передаёт побудительный оттенок נָא.
- source_word: שִׁפְחָתִי
  choice: моей рабыне
  rationale: «Рабыня» ясно передаёт несвободное положение женщины и не смягчает социальный смысл слова.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: может быть, через неё я обрету детей
  rationale: Идиоматический русский перевод передаёт смысл надежды обрести потомство через рабыню; буквальный образ созидания сохранён в примечании.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: И … послушался голоса
  rationale: Сохранены и значение согласия/повиновения, и образ «голоса», важный для возможных межтекстовых связей.
theological_decisions:
- issue: Роль Яхве в бездетности Сары
  choice: Яхве не даёт мне рожать
  alternative: Яхве удержал меня от рождения детей
  rationale: Высказывание Сары прямо связывает её неспособность родить с действием Яхве; перевод не смягчает и не развивает это утверждение.
- issue: Степень явности обозначения половой близости
  choice: Войди же к моей рабыне
  alternative: Ляг с моей рабыней
  rationale: Исходный текст использует эвфемизм, поэтому перевод сохраняет его регистр, не делая выражение более прямым.
- issue: Метафора אִבָּנֶה и её семейный смысл
  choice: через неё я обрету детей
  alternative: через неё я буду устроена / созиждусь
  rationale: В основном тексте выбран понятный современному читателю семейно-династический смысл, а необычная строительная метафора и её смысловая широта отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены эвфемизм половой близости, несвободный статус рабыни и выражение «послушался голоса»; избегнуты архаизмы вроде «се» и «созиждусь».
