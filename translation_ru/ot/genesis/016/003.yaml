  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: ru
  text: И Сара, жена Аврама, взяла свою рабыню Агарь, египтянку, после того как Аврам прожил десять лет в земле Ханаанской,[a] и отдала её своему мужу Авраму в жёны.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по окончании десяти лет пребывания Аврама в земле Ханаанской».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст называет Агарь и рабыней Сары, и женой Аврама; отдельное слово «наложница» здесь не употреблено.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: взяла
  rationale: Обычное повествовательное значение לקח; русское «взяла» естественно передаёт действие без лишнего уточнения.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Сара, жена Аврама
  rationale: Приложение прямо указывает на родственную связь; запятые естественно оформляют его по-русски. Имя «Сара» соответствует принятой русской передаче имени שָׂרַי и сохраняет отличие от последующего имени «Сарра».
- source_word: הָגָר הַמִּצְרִית
  choice: Агарь, египтянку
  rationale: Принятая русская форма имени сочетается с приложением, обозначающим происхождение Агарь.
- source_word: שִׁפְחָתָהּ
  choice: свою рабыню
  rationale: שִׁפְחָה обозначает женщину в подневольном положении; «рабыня» точнее нейтрально-смягчающего «служанка» и ясно передаёт её социальный статус.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: после того как Аврам прожил десять лет в земле Ханаанской
  rationale: Оборот указывает на завершение десятилетнего пребывания Аврама в Ханаане; придаточное предложение ясно и естественно передаёт временное отношение.
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: и отдала её своему мужу Авраму
  rationale: «Отдала» естественно продолжает повествование, а «своему мужу Авраму» точно передаёт אִישָׁהּ и устраняет возможную неясность принадлежности.
- source_word: לוֹ לְאִשָּׁה
  choice: в жёны
  rationale: Устойчивый русский оборот передаёт предоставление Агарь Авраму в статусе жены и не подменяет исходное אִשָּׁה словом «наложница».
theological_decisions:
- issue: Статус Агарь по отношению к Саре и Авраму
  choice: 'Сохранить оба обозначения: Агарь — рабыня Сары, которую отдают Авраму «в жёны».'
  alternative: Назвать Агарь наложницей или смягчить «рабыню» до «служанки».
  rationale: Еврейский текст одновременно употребляет שִׁפְחָה («рабыня») и אִשָּׁה («жена/женщина»). Перевод сохраняет это социальное и богословское напряжение, не сводя одно обозначение к другому.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён для ясности, но порядок событий, подневольный статус Агарь и её обозначение как жены сохранены.
