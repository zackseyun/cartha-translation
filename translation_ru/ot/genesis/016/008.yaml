source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: ru
  text: 'И он сказал: «Агарь, рабыня[a] Сары, откуда ты пришла и куда идёшь?» Она ответила: «Я бегу от Сары, моей госпожи[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанка»; еврейское слово обозначает женщину в подневольном положении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица Сары, моей госпожи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: рабыня
  rationale: Существительное שִׁפְחָה обозначает женщину в подневольном положении. «Рабыня» ясно передаёт её социальный статус и не смягчает его более общим словом «служанка».
- source_word: אֵי מִזֶּה בָאת
  choice: откуда ты пришла
  rationale: Естественно передаёт вопрос о месте, откуда пришла Агарь, и сохраняет значение еврейского оборота.
- source_word: וְאָנָה תֵלֵכִי
  choice: и куда идёшь
  rationale: Вопрос направлен на место назначения; форма «идёшь» естественно передаёт незавершённое действие в данной прямой речи.
- source_word: מִפְּנֵי
  choice: от
  rationale: Буквально выражение значит «от лица/присутствия», но здесь идиоматически указывает на бегство от человека. Русское «от» звучит естественно, а буквальная образность отмечена в сноске.
- source_word: גְּבִרְתִּי
  choice: моей госпожи
  rationale: Форма женского рода обозначает женщину, обладающую властью над Агарью; «госпожа» сохраняет социальную иерархию.
- source_word: בֹּרַחַת
  choice: я бегу
  rationale: Причастие выражает продолжающееся действие. В контексте «бегу от» ясно означает продолжающееся бегство и звучит естественно по-русски.
- source_word: וַיֹּאמַר
  choice: И он сказал
  rationale: Еврейский текст этого стиха не повторяет наименование говорящего, а использует форму мужского рода с подразумеваемым субъектом из предыдущего стиха.
- source_word: שָׂרַי
  choice: Сара
  rationale: Принята традиционная русская форма имени до его переименования в Сарру.
- source_word: הָגָר
  choice: Агарь
  rationale: Принята традиционная русская форма библейского имени.
theological_decisions:
- issue: Передача социального положения Агари
  choice: рабыня
  alternative: служанка; рабыня-служанка
  rationale: Текст прямо характеризует Агарь как подневольную женщину Сары. Выбор не смягчает обозначенный в оригинале зависимый статус.
- issue: Называть ли говорящего Ангелом Господним непосредственно в стихе
  choice: И он сказал
  alternative: И Ангел Господень сказал
  rationale: Из предыдущего стиха ясно, кто говорит, однако в данном стихе титул не повторён. Перевод сохраняет эту особенность и не добавляет пояснение в основной текст.
- issue: Передача מִפְּנֵי
  choice: от Сары
  alternative: от лица Сары; от присутствия Сары
  rationale: Контекстуальный смысл — бегство от Сары. Буквальное выражение по-русски было бы неестественным; его форма сохранена в примечании без навязывания дополнительного богословского смысла.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified прямой речью. Синтаксис близок к еврейскому, но естественен по-русски; социальная зависимость Агари передана без эвфемизма, а буквальный образ מִפְּנֵי вынесен в сноску.
