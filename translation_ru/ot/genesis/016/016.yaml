lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Авраму
  rationale: Имя передано в принятой русской библейской форме; дательный падеж обусловлен естественной русской конструкцией обозначения возраста.
- source_word: בֶּן שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: было восемьдесят шесть лет
  rationale: Еврейская идиома возраста с בֶּן естественно передаётся по-русски без буквального «сын».
- source_word: בְּ/לֶדֶת
  choice: когда ... родила
  rationale: Предлог בְּ с инфинитивом ילד вводит временное придаточное; такая передача ясна и естественна в современном русском языке.
- source_word: הָגָר
  choice: Агарь
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֶת יִשְׁמָעֵאל
  choice: Измаила
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; имя дано в принятой русской библейской форме и поставлено в винительный падеж.
- source_word: לְ/אַבְרָם
  choice: ему
  rationale: В контексте рождения ребёнка לְ естественно обозначает отца, которому женщина родила сына; русское «родила ему» сохраняет эту связь без неясного повторения имени.
