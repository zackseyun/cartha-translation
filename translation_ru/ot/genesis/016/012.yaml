base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: ru
  text: 'Он будет человеком, подобным дикому ослу[a]: его рука будет против всех, и рука всех — против него. Он будет жить напротив всех своих братьев[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дикий осёл среди людей». Буквально: «дикий осёл человека»; это образная характеристика человека, подобного дикому ослу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед» либо «в присутствии». Еврейское выражение может указывать на жизнь напротив, перед лицом или в противостоянии.'
    reason: lexical_alternative
  - marker: c
    text: Слово «братья» может обозначать не только родных братьев, но также родичей или родственные народы.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: человеком, подобным дикому ослу
  rationale: פֶּרֶא обозначает дикого осла, то есть онагра, а не просто «дикого» человека. Сочетание с אָדָם даёт яркую характеристику человека через образ животного; формулировка с «подобным» естественна по-русски и сохраняет сам образ.
- source_word: אָדָם
  choice: человеком
  rationale: Здесь слово относится к конкретному мужчине, Измаилу, а не к человечеству вообще.
- source_word: יָדוֹ בַכֹּל
  choice: его рука будет против всех
  rationale: «Рука» метонимически выражает действие и противостояние. Сохранение образа руки и предлога «против» передаёт враждебный контекст, не устраняя еврейскую образность.
- source_word: וְיַד כֹּל בּוֹ
  choice: и рука всех — против него
  rationale: Формулировка сохраняет зеркальный параллелизм предыдущей части и взаимность противостояния.
- source_word: וְעַל־פְּנֵי
  choice: напротив
  rationale: В данном пространственно-отношенческом контексте выражение может означать «перед», «напротив» или «в присутствии». «Напротив» сохраняет пространственный смысл и возможный оттенок противостояния, не делая его обязательным.
- source_word: כָּל־אֶחָיו
  choice: всех своих братьев
  rationale: Основное значение אָח — «брат», хотя слово может охватывать более широкий круг родичей или родственных народов. Прямое значение оставлено в тексте, а расширенное отмечено в сноске.
- source_word: יִשְׁכֹּן
  choice: будет жить
  rationale: שׁכן означает «жить, обитать, поселяться». «Будет жить» ясно и естественно для современного русского читателя и соответствует предсказательному контексту.
theological_decisions:
- issue: Характеристика Измаила в метафоре פֶּרֶא אָדָם
  choice: 'Сохранить прямой образ дикого осла: «человеком, подобным дикому ослу»'
  alternative: «диким человеком»
  rationale: Еврейский текст использует конкретный образ дикого осла, связанный с необузданностью и свободной жизнью; сведение его к общему слову «дикий» утратило бы образ и могло бы навязать однозначно нравственную оценку.
- issue: Смысл וְעַל־פְּנֵי в отношении к братьям
  choice: «напротив» с указанием смыслового диапазона в сноске
  alternative: «в присутствии», «перед лицом», «вопреки»
  rationale: Фраза допускает пространственное и конфронтационное понимание. Основной текст не должен окончательно разрешать эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified предсказательным тоном. Сохранены метафора руки, параллелизм двух средних частей и конкретный образ дикого осла; спорное выражение וְעַל־פְּנֵי не сведено к одному бесспорному толкованию.
