source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: ru
  text: 'И сказал ей ангел Яхве[a]: «Я умножу твоё потомство во много раз, так что сосчитать его будет невозможно из-за его многочисленности».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник Яхве».'
    reason: Лексема מַלְאָךְ может обозначать как сверхъестественного ангела, так и вестника или посланника.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав-последовательный продвигает повествование; традиционное и естественное для русского библейского повествования «И сказал» сохраняет связь с предшествующим контекстом.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать как ангела, так и вестника; в устойчивом повествовательном выражении книги Бытия выбрано «ангел», а личное имя יהוה передано как «Яхве». Лексическая альтернатива отмечена в сноске.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Я весьма умножу
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает степень действия. «Весьма умножу» передаёт интенсивность, не превращая её в заверение или клятвенную формулу.
- source_word: זַרְעֵךְ
  choice: твоё потомство
  rationale: זֶרַע здесь является собирательным существительным; «потомство» естественно сохраняет собирательное значение и не архаизирует текст словом «семя».
- source_word: וְלֹא יִסָּפֵר
  choice: так что его невозможно будет сосчитать
  rationale: Нифаль глагола ספר выражает невозможность исчислить потомство; «так что» ясно передаёт подразумеваемое отношение результата.
- source_word: מֵרֹב
  choice: из-за его многочисленности
  rationale: 'Предлог מִן при רֹב указывает причину: потомство нельзя будет сосчитать вследствие его огромного количества. Местоимение сохраняет отсылку к собирательному существительному среднего рода «потомство».'
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом и не используя менее обоснованную форму «Иегова».
- issue: Смысл выражения מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Перевод «ангел Яхве» соответствует устойчивому контекстуальному употреблению, но сноска сохраняет лексическую многозначность מַלְאַךְ и не разрешает вопрос о личности этого посланника сверх сказанного в тексте.
- issue: Характер усиления в הַרְבָּה אַרְבֶּה
  choice: весьма умножу
  alternative: непременно умножу
  rationale: Контекст и глагольный корень поддерживают усиление масштаба умножения. Перевод «непременно» мог бы сместить акцент к достоверности обещания или к клятвенному оттенку, которого конструкция сама по себе не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет собирательный характер слова «потомство», интенсивность обещанного умножения и личное имя Яхве; архаизмы и конфессионально специфические толкования не вводятся.
