  source_fidelity: «Ангел Яхве» точно передаёт מַלְאַךְ יְהוָה, а «Вернись к своей госпоже» соответствует двум повелениям и форме женского рода в адрес Агари. «Покорись её власти» естественно передаёт הִתְעַנִּי תַּחַת יָדֶיהָ как требование принять подчинённое положение; примечание надлежащим образом сохраняет буквальный образ «под её рукой» и возможный оттенок претерпеваемого унижения/притеснения.
