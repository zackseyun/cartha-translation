  terminology: «Яхве» последовательно сохраняет тетраграмматон как личное имя; «ангел» — естественный контекстуальный выбор без дополнительных утверждений о личности ангела. Формулировка не сглаживает трудный характер повеления, поскольку смысловой диапазон ענה отмечен в сноске.
