source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: ru
  text: 'И ангел Яхве сказал ей: «Вернись к своей госпоже и покорись её власти».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смирись под её рукой»; возможно также: «терпи притеснение под её властью».'
    reason: Лексико-культурное примечание сохраняет образ «под рукой» и смысловой диапазон Hitpael от ענה.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел»; в повествовании о божественной встрече естественно «ангел». Личное имя יהוה передано как «Яхве», без подмены титулом.
- source_word: שׁוּבִי
  choice: вернись
  rationale: Прямо передаёт повелительную форму женского рода единственного числа от שוב.
- source_word: גְּבִרְתֵּךְ
  choice: к своей госпоже
  rationale: Слово обозначает женщину, занимающую положение госпожи по отношению к служанке; «госпожа» точно и естественно передаёт социальное отношение в контексте Агари и Сары.
- source_word: וְהִתְעַנִּי
  choice: покорись
  rationale: Hitpael от ענה здесь выражает принятие подчинённого, униженного положения; «покорись» естественно передаёт возвратность и властное отношение, не сводя смысл только к внутреннему смирению.
- source_word: תַּחַת יָדֶיהָ
  choice: её власти
  rationale: Буквально «под её рукой»; в данном контексте это устойчивый образ пребывания под чьей-либо властью. Смысл передан естественным современным русским выражением, а буквальный образ сохранён в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Передача מַלְאַךְ
  choice: ангел
  alternative: вестник
  rationale: Лексема допускает оба значения, но контекст божественной встречи поддерживает традиционное и наиболее вероятное «ангел», не определяя дополнительно его природу или тождество.
- issue: Характер повеления וְהִתְעַנִּי
  choice: покорись её власти
  alternative: смирись под её рукой; терпи притеснение под её властью
  rationale: Форма связана с корнем ענה, который может выражать унижение или притеснение. В возвратной повелительной форме здесь наиболее вероятно принятие подчинённого положения, однако более тяжёлый оттенок страдания не следует полностью скрывать; он отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Союз «И» сохраняет последовательность еврейского повествования. «Госпожа» предпочтительнее устаревающего и двусмысленного «господыня» или социально неточного «хозяйка».
