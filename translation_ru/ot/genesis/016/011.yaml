  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: ru
  text: 'И сказал ей ангел Яхве[a]: «Вот, ты беременна и родишь сына; и назовёшь его Измаилом, потому что Яхве услышал о твоём страдании».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел»; в данном повествовании речь идёт о небесном посланнике. Сочетание сохранено без дополнительного богословского отождествления.
- source_word: הִנָּךְ הָרָה
  choice: вот, ты беременна
  rationale: הִנֵּה привлекает внимание к торжественному объявлению, а הָרָה прямо обозначает беременность; перевод естественен для современного русского языка.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: и родишь сына
  rationale: Кратко и точно передаёт объявление о будущем рождении.
- source_word: וְקָרָאת שְׁמוֹ
  choice: назови его
  rationale: Русская формула именования естественно передаёт буквальное «назовёшь его имя» и здесь допускает повелительное значение.
- source_word: יִשְׁמָעֵאל
  choice: Измаил
  rationale: Использована устоявшаяся русская библейская форма имени; его смысл раскрывается последующей причинной фразой.
- source_word: כִּי שָׁמַע יְהוָה
  choice: потому что Яхве услышал
  rationale: כִּי вводит основание для имени, а перфект שָׁמַע обозначает совершившееся Божье внимание к бедствию Агари.
- source_word: אֶל עָנְיֵךְ
  choice: о твоём страдании
  rationale: עֳנִי обозначает бедствие, угнетённое и мучительное положение. Оборот «услышал о» передаёт необычное еврейское управление אֶל, не создавая в русском впечатления, будто само страдание издавало голос.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет Тетраграмматон; форма «Яхве» сохраняет личное имя Бога.
- issue: Личность מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Перевод сохраняет еврейское выражение и не отождествляет этого ангела с Богом, Христом или какой-либо иной личностью сверх того, что прямо сказано в стихе.
- issue: Модальность וְקָרָאת
  choice: Назови его
  alternative: и назовёшь его
  rationale: В пророческой формуле именования форма может звучать как предписание или объявление будущего. Основной текст передаёт естественное предписание, не добавляя богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное «И» сохраняет повествовательную связь с предыдущим стихом; «вот» передаёт формулу привлечения внимания. Устоявшаяся форма имени «Измаил» предпочтена искусственной прямой транслитерации.
