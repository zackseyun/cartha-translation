  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: ru
  text: Он вошёл к Агари, и она зачала. Когда она увидела, что зачала, её госпожа стала презренной в глазах Агари.[a]
  philosophy: optimal-equivalence
  footnotes:
