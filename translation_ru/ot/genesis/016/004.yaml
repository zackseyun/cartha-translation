lexical_decisions:
- source_word: וַיָּבֹא אֶל
  choice: вошёл к
  rationale: В данном контексте это устойчивый древнееврейский эвфемизм, обозначающий половую связь. Русское «вошёл к» сохраняет образ и повествовательную сдержанность оригинала.
- source_word: הָגָר
  choice: Агарь
  rationale: Передача личного имени в соответствии с утвердившейся русской библейской традицией.
- source_word: וַתַּהַר / הָרָתָה
  choice: зачала / зачала
  rationale: Повтор глагола «зачать» отражает лексический повтор корня הרה и последовательность событий; в современном русском это ясно и уместно для возвышенного повествования.
- source_word: וַתֵּרֶא כִּי
  choice: увидев, что
  rationale: Деепричастная конструкция естественно передаёт восприятие Агарью своего состояния и временную связь с последующей переменой отношения.
- source_word: וַתֵּקַל
  choice: стала презирать
  rationale: Форма qal допускает понимание госпожи как ставшей малозначимой в глазах Агарь; по-русски активная конструкция ясно выражает изменение оценки, не утверждая объективного изменения в Саре.
- source_word: גְּבִרְתָּהּ
  choice: свою госпожу
  rationale: «Госпожа» непосредственно передаёт обозначение женщины, стоящей выше по домашнему и общественному положению; возвратное «свою» устраняет неясность принадлежности.
- source_word: בְּעֵינֶיהָ
  choice: смысл включён в «стала презирать»
  rationale: Буквальное «в её глазах» по-русски здесь утяжеляет фразу; значение личной оценки естественно выражено активным глаголом «презирать».
theological_decisions:
- issue: Направленность וַתֵּקַל и значение בְּעֵינֶיהָ
  choice: она стала презирать свою госпожу
  alternative: её госпожа стала презренной в её глазах
  rationale: Грамматически подлежащим еврейского глагола является «её госпожа», однако идиома описывает оценку со стороны Агарь. Активная русская формулировка передаёт этот смысл естественно, а сноска сохраняет формальную перспективу и неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский с сохранением сдержанного библейского эвфемизма. Синтаксис сделан естественным для обычного читателя; формальная перспектива заключительной еврейской фразы отражена в сноске.
