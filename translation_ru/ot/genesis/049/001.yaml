  source_fidelity: 'Русский текст точно передаёт еврейский оригинал: וַיִּקְרָא — «призвал», בָּנָיו — «своих сыновей», הֵאָסְפוּ — «соберитесь», וְאַגִּידָה לָכֶם — «я возвещу вам», а идиома אֲשֶׁר יִקְרָא אֶתְכֶם естественно передана как «что произойдёт с вами». «В грядущие дни» адекватно сохраняет общий будущий горизонт בְּאַחֲרִית הַיָּמִים, не навязывая узко эсхатологическое прочтение.'
