  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: ru
  text: 'Иаков призвал своих сыновей и сказал: «Соберитесь, и я возвещу вам, что произойдёт с вами в грядущие дни[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в последние дни». Еврейское выражение в некоторых контекстах может иметь эсхатологический смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: В данном повествовательном контексте קרא означает позвать или созвать; «призвал» естественно передаёт торжественный характер обращения Иакова.
- source_word: בָּנָיו
  choice: своих сыновей
  rationale: Здесь речь именно о сыновьях Иакова, от которых происходят названные далее племена.
- source_word: הֵאָסְפוּ
  choice: соберитесь
  rationale: 'Возвратная форма повеления естественно и точно передаёт нифаль глагола אסף: сыновья должны собраться вместе.'
- source_word: וְאַגִּידָה לָכֶם
  choice: и я возвещу вам
  rationale: Когортатив выражает намерение Иакова; «возвещу» сохраняет торжественный пророческий регистр, не делая фразу неестественно архаичной.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: что произойдёт с вами
  rationale: Оборот с קרה означает то, что случится или постигнет адресатов; выбранный вариант ясен и современен.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в грядущие дни
  rationale: Фраза указывает на последующее время и допускает более сильный эсхатологический оттенок. Основной вариант сохраняет направленность в будущее, не предрешая степень этого оттенка.
theological_decisions:
- issue: Следует ли передавать בְּאַחֲרִית הַיָּמִים как однозначно эсхатологический термин
  choice: в грядущие дни
  alternative: в последние дни
  rationale: В непосредственном контексте Иаков говорит о будущем своих сыновей и происходящих от них племён. При этом еврейское выражение в других контекстах может иметь эсхатологический смысл, поэтому более сильный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной торжественностью. Синтаксис остаётся ясным для обычного читателя; потенциальный эсхатологический оттенок исходной фразы сохранён посредством сноски.
