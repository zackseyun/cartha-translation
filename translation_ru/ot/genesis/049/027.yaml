lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Вениамин
  rationale: Традиционная русская форма библейского имени, соответствующая еврейскому בִּנְיָמִין.
- source_word: זְאֵב יִטְרָף
  choice: хищный волк
  rationale: Существительное означает «волк», а глагол טרף описывает разрывание или терзание добычи. Сочетание «хищный волк» естественно и сжато передаёт цельный поэтический образ без тяжеловесного придаточного оборота.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Естественная русская передача обстоятельства времени с сохранением параллели «утром — вечером».
- source_word: יֹאכַל
  choice: пожирает
  rationale: Основное значение глагола — «есть», но в образе волка экспрессивное «пожирает» точно передаёт контекстуальный смысл.
- source_word: עַד
  choice: добычу
  rationale: Редкое существительное допускает значения добычи, трофея или награбленного; в первой половине образа волка «добыча» наиболее естественно сохраняет звериную метафору.
- source_word: וְלָעֶרֶב
  choice: а вечером
  rationale: Союз «а» ясно оформляет временной и образный параллелизм, не придавая ему чрезмерно сильного противопоставления.
- source_word: יְחַלֵּק שָׁלָל
  choice: делит награбленное
  rationale: Глагол означает разделять или распределять, а שָׁלָל — захваченную добычу. «Награбленное» ясно передаёт переход к военному образу и отличается от добычи зверя в предыдущей строке.
theological_decisions:
- issue: Смысл метафоры благословения Вениамина
  choice: Сохранён образ хищной силы и последующего раздела захваченной добычи без указания на конкретное историческое исполнение.
  alternative: Истолковать стих непосредственно как предсказание воинственной истории колена Вениамина.
  rationale: Еврейский текст даёт поэтическую характеристику, но не называет конкретного события или исторического лица; перевод не должен вносить такое отождествление в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным поэтическим ритмом. Параллель «утром — вечером» сохранена; звериная и военная стороны метафоры различены словами «добыча» и «награбленное».
