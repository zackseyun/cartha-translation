  terminology: «Завулон» и «Сидон» — устоявшиеся русские библейские формы. «Край его» корректно передаёт географически употреблённое, семантически широкое יַרְכָתוֹ; сноска надлежащим образом сохраняет альтернативы. «Будет обращён к Сидону» осторожно передаёт пространственную направленность עַל, не превращая её в однозначное указание на границу.
