  source_fidelity: 'Текст точно передаёт основные элементы еврейского стиха: Завулон, проживание у морского берега (יַמִּים во множественном числе), параллельный образ берега кораблей и направленность его края к Сидону. Русское опущение явно выраженного в еврейском местоимения во второй строке допустимо: субъект и сказуемое естественно восстанавливаются из первой части параллелизма.'
