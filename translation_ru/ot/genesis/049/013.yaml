base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: ru
  text: Завулон будет жить у берега морей[a], у берега кораблей; и край его будет обращён к Сидону[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «морей»; в русском это также можно передать как «моря».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его бок», «его граница» либо «его дальний край будет в сторону Сидона». Еврейское слово может обозначать бок, край или отдалённую оконечность территории.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Завулон
  rationale: Традиционная и узнаваемая русская передача личного имени, соответствующая еврейскому זְבוּלֻן.
- source_word: לְחוֹף יַמִּים
  choice: у берега морей
  rationale: Сохраняет пространственное значение לְחוֹף и грамматическое множественное число יַמִּים, не сводя его без необходимости к единственному числу.
- source_word: יִשְׁכֹּן
  choice: будет жить
  rationale: Естественно передаёт значение глагола שכן — жить, обитать, поселяться — и подходит к пророческому контексту благословения.
- source_word: וְהוּא לְחוֹף אֳנִיּוֹת
  choice: у берега кораблей
  rationale: Передаёт буквальный образ еврейского текста и не вводит более истолковывающее понятие «пристань» или «гавань».
- source_word: וְיַרְכָתוֹ
  choice: и край его
  rationale: В географическом контексте יַרְכָה может обозначать бок, край или отдалённую оконечность; «край» естественно применим к территории и сохраняет некоторую широту значения.
- source_word: עַל צִידֹן
  choice: будет обращён к Сидону
  rationale: Передаёт вероятную направленность или территориальную ориентацию עַל в сочетании с названием места, не утверждая точного достижения границы Сидона.
- source_word: צִידֹן
  choice: Сидон
  rationale: Устоявшаяся русская форма географического названия.
