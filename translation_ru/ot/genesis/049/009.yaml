base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: ru
  text: Иуда — львёнок; от добычи поднялся ты, сын мой. Он пригнулся, лёг, как лев и как львица[a], — кто поднимет его?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как могучий лев». Употреблённое здесь еврейское слово отличается от предшествующего слова «лев» и может обозначать львицу либо зрелого, сильного льва.'
    reason: lexical_alternative
  - marker: b
    text: Образ льва применительно к Иуде нередко понимают типологически, связывая его с последующей царской и мессианской надеждой; однако непосредственно этот стих говорит об Иуде в благословении Иакова.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: львёнок
  rationale: Сочетание буквально обозначает детёныша льва. «Львёнок» естественно звучит по-русски и сохраняет силу образа.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная русская форма личного и племенного имени.
- source_word: מִטֶּרֶף
  choice: от добычи
  rationale: טֶרֶף — добыча хищника. Краткий перевод сохраняет картину льва, отходящего от добычи, не добавляя прямо не выраженных подробностей.
- source_word: בְּנִי
  choice: сын мой
  rationale: Прямое обращение Иакова к Иуде; порядок слов соответствует возвышенной, но понятной русской речи.
- source_word: עָלִיתָ
  choice: поднялся ты
  rationale: Сохранено значение движения вверх и форма второго лица. Инверсия поддерживает поэтический ритм и подчёркивает обращение.
- source_word: כָּרַע
  choice: пригнулся
  rationale: В образе льва глагол описывает опускание тела, а не поклонение. «Пригнулся» передаёт позу животного без излишнего истолкования.
- source_word: רָבַץ
  choice: лёг
  rationale: Обычный глагол о животном, которое ложится или покоится; краткая форма естественна в русском поэтическом параллелизме.
- source_word: כְּאַרְיֵה
  choice: как лев
  rationale: Прямое сравнительное значение.
- source_word: וּכְלָבִיא
  choice: и как львица
  rationale: לָבִיא может обозначать львицу либо зрелого, могучего льва. «Львица» сохраняет отличие от אַרְיֵה, а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: מִי יְקִימֶנּוּ
  choice: кто потревожит его?
  rationale: Буквально каузативная форма означает «кто заставит его встать / поднимет его». В контексте отдыхающего льва «потревожит» естественно передаёт смысл пробуждения и побуждения подняться, не добавляя слова «осмелится».
theological_decisions:
- issue: Относится ли образ льва прямо к Мессии или прежде всего к Иуде
  choice: Основной текст говорит непосредственно об Иуде в благословении Иакова и не вводит явного мессианского утверждения.
  alternative: Образ можно типологически связывать с последующей царской и мессианской надеждой.
  rationale: В самом стихе адресатом является Иуда, которому приписываются львиная сила и внушающее страх спокойствие. Позднейшее богословское развитие образа допустимо отметить, но не следует вносить его непосредственно в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Смена второго лица («поднялся ты») на третье («он пригнулся») сохранена вслед за еврейским текстом. Архаизмы и конфессионально окрашенные добавления исключены.
