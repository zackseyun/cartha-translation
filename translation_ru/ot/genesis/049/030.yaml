  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: ru
  text: в пещере, которая находится на поле Махпела, напротив Мамре[a], в земле Ханаана, — это поле Авраам купил у Ефрона, хетта, во владение для погребения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Мамре» или «лицом к Мамре»; древнееврейский оборот указывает на расположение относительно Мамре.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как погребальное владение». В древнееврейском тексте подчёркнуто, что это была собственность, предназначенная для погребения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: в пещере
  rationale: Предлог ב с определённым существительным обозначает место; «пещера» — точный и естественный современный эквивалент.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: на поле Махпела
  rationale: Относительная конструкция указывает, что пещера находилась на этом поле. В русском «на поле» естественнее буквального «в поле», а название מַכְפֵּלָה передано транслитерацией.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: напротив Мамре
  rationale: Пространственный оборот обозначает положение по отношению к Мамре; «напротив» сохраняет основной смысл, не сводя его к простой близости.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Традиционная и понятная русская форма географического обозначения, точно передающая конструкцию оригинала.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: на поле, которое Авраам купил
  rationale: Повтор слова «поле» отражает явный прямой объект הַשָּׂדֶה и естественно проясняет по-русски длинную древнееврейскую относительную конструкцию, не превращая прямое дополнение в оборот «вместе с полем».
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: у Ефрона-хетта
  rationale: מֵאֵת указывает на продавца, у которого было куплено поле; этноним передан приложением через дефис.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: во владение для погребения
  rationale: אֲחֻזָּה подчёркивает законно приобретённое владение, а קֶבֶר — его назначение для погребения; формулировка сохраняет оба компонента.
