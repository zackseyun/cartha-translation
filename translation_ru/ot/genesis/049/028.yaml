base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: ru
  text: 'Все они — двенадцать колен Израиля. Вот что сказал им их отец, и он благословил их: каждого — согласно его благословению — он благословил.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Каждого согласно его благословению он благословил их».'
    reason: Сноска передаёт повтор глагола «благословил», дистрибутивное «каждого» и итоговое множественное «их» в еврейском тексте.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественно передаёт итоговое указание на перечисленных ранее сыновей, сохраняя собирательное значение.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: двенадцать колен Израиля
  rationale: Прямая и устоявшаяся передача конструктивной цепи и числительного в современном литературном русском.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Вот что сказал им их отец
  rationale: «Сказал им» естественнее по-русски, чем буквальное «говорил им», и точно передаёт содержание глагола דִּבֶּר в данном контексте.
- source_word: וַיְבָרֶךְ אוֹתָם
  choice: благословляя их
  rationale: Деепричастная конструкция выражает пояснительную связь между речью отца и благословением, не превращая их в два явно раздельных события.
- source_word: אִישׁ
  choice: каждого
  rationale: Мужское существительное употреблено дистрибутивно; русское «каждого» ясно и естественно передаёт этот смысл.
- source_word: כְּבִרְכָתוֹ
  choice: подобающим ему благословением
  rationale: Передаёт смысл «согласно его благословению» как благословение, соответствующее каждому, избегая неестественного русского оборота.
- source_word: בֵּרַךְ אֹתָם
  choice: он благословил
  rationale: Сохраняет повтор корня ברך в итоговой части стиха.
theological_decisions:
- issue: Характер индивидуального благословения
  choice: подобающим ему благословением
  alternative: согласно его благословению
  rationale: Формулировка передаёт контекстуальную соотнесённость благословения с каждым сыном, не уточняя, было ли оно определено его характером, судьбой или пророческой ролью.
translation_notes:
  register: Современный литературный русский с торжественной, но доступной интонацией. Тире подчёркивает итоговое отождествление сыновей с двенадцатью коленами; двоеточие вводит поясняющий итог благословений.
