id: GEN.49.10
reference: Genesis 49:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: ru
  text: Не отойдёт скипетр от Иуды и жезл правителя — между его ногами[a], пока не придёт Шило[b]; и ему покорятся народы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между его ногами». Образ может указывать на восседающего правителя и, возможно, на его потомство.'
    reason: literal_expression
  - marker: b
    text: 'Еврейское שילה неясно. Возможно также: «пока не придёт тот, кому это принадлежит»; форму понимали и как имя или название места, а также связывали с принесением дани.'
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «и к нему соберутся народы» или «и ему будет повиновение народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: скипетр
  rationale: В царственно-поэтическом контексте и в параллели с מְחֹקֵק слово обозначает знак власти; «скипетр» сохраняет династический и правительственный оттенок.
- source_word: מִיהוּדָה
  choice: от Иуды
  rationale: 'Предлог выражает удаление или отделение: скипетр не отойдёт от Иуды.'
- source_word: מְחֹקֵק
  choice: жезл правителя
  rationale: Слово может обозначать издающего постановления правителя либо связанный с властью жезл. Параллелизм со «скипетром» и пространственное выражение далее поддерживают значение царской регалии.
- source_word: מִבֵּין רַגְלָיו
  choice: от ног его
  rationale: Так сохраняется конкретный образ еврейского текста, но избегается неестественное для современного русского буквальное «из меж его ног». Образ может намекать на восседающего правителя и/или потомство, однако это не раскрывается в основном тексте.
- source_word: עַד כִּי
  choice: пока не
  rationale: Естественно передаёт временной предел предшествующего утверждения.
- source_word: שילה
  choice: Шило
  rationale: Трудную и спорную еврейскую форму основной текст сохраняет как имя, не предрешая её точного значения; основные альтернативы вынесены в примечание.
- source_word: וְלוֹ
  choice: ему
  rationale: При чтении שילה как личного имени местоимение естественно понимается как относящееся к личности.
- source_word: יִקְּהַת
  choice: покорятся
  rationale: Редкое и спорное слово в контексте царской власти передано как подчинение народов; возможное значение «соберутся» отмечено в примечании.
- source_word: עַמִּים
  choice: народы
  rationale: Прямо передаёт множественное число и сохраняет широкий этнический охват.
theological_decisions:
- issue: Значение и референт שילה в тексте с давней мессианской интерпретацией
  choice: Сохранить «Шило» как транслитерированное имя, не отождествляя его прямо с Мессией в переводе.
  alternative: «пока не придёт тот, кому это принадлежит»; «пока ему не принесут дань»; «пока он не придёт в Шило»
  rationale: Так сохраняется подлинная неясность еврейского текста и возможность мессианского прочтения без внесения в основной текст более определённого богословского толкования.
- issue: Царский и возможный мессианский смысл стиха
  choice: Сохранить царскую образность посредством слов «скипетр», «жезл правителя» и «покорятся народы».
  alternative: Чисто династическо-политический перевод либо прямо мессианский пересказ.
  rationale: Еврейский текст явно связывает царскую власть с Иудой, но сам стих не называет грядущего правителя Мессией; перевод не должен ни устранять, ни догматически уточнять эту перспективу.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического благословения. Инверсия «от ног его» сохраняет возвышенный ритм, оставаясь понятной; спорные места не сглажены и снабжены примечаниями.
