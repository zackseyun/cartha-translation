  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: ru
  text: Он увидел, что место покоя хорошо[a] и что земля приятна; он склонил плечо под ношу и стал подневольным работником[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покой хорош». Еврейское מְנֻחָה может означать и покой, и место покоя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стал нести трудовую повинность»; возможно также: «стал слугой, платящим дань». Еврейское выражение может обозначать принудительные работы, трудовую повинность или данническую зависимость.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: место покоя
  rationale: Существительное может означать как «покой», так и «место покоя». Конкретное значение хорошо сочетается с параллельным упоминанием земли, то есть желанной территории Иссахара.
- source_word: טוֹב
  choice: хорошо
  rationale: Сохраняет простоту и широкое значение еврейского прилагательного; краткая форма естественна после оборота «место покоя».
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте благословения колен речь естественно понимать как территорию, а не землю вообще.
- source_word: נָעֵמָה
  choice: приятна
  rationale: Передаёт привлекательность и желанность земли сдержанным, естественным русским словом.
- source_word: וַיֵּט שִׁכְמוֹ לִסְבֹּל
  choice: склонил плечо под ношу
  rationale: Сохраняет телесный поэтический образ готовности нести бремя; слово «ноша» делает подразумеваемый объект глагола естественным по-русски.
- source_word: לְמַס עֹבֵד
  choice: стал подневольным работником
  rationale: מַס часто обозначает принудительную трудовую повинность, а עֹבֵד — работающего или служащего. Формулировка передаёт принуждение без чрезмерно узкого указания на рабство как правовой статус.
theological_decisions:
- issue: Характер подчинения Иссахара в заключительной строке
  choice: стал подневольным работником
  alternative: стал нести трудовую повинность; стал слугой, платящим дань
  rationale: Поэтическая фраза допускает оттенки принудительного труда, повинности или даннической зависимости. Основной текст отражает наиболее вероятное значение מַס как трудовой повинности, а другие социальные оттенки сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и образности древнееврейской поэзии. Синтаксис сделан ясным для обычного читателя; подлинная неоднозначность слов מְנֻחָה и לְמַס עֹבֵד вынесена в примечания.
