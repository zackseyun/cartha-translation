base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: ru
  text: от Бога твоего отца, Который поможет тебе, и от Всемогущего, Который благословит тебя благословениями небес свыше, благословениями бездны, лежащей внизу[b], благословениями грудей и утробы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «бездны, притаившейся внизу». Еврейский глагол может означать как «лежать», так и «притаиться, припасть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: от Бога твоего отца
  rationale: Предлог מִן буквально указывает на источник; русский оборот «от Бога» естественно вводит источник помощи и сохраняет синтаксическую сжатость еврейской поэзии.
- source_word: וְיַעְזְרֶךָ
  choice: Он поможет тебе
  rationale: Форма обозначает действие Бога по отношению к Иосифу. Самостоятельная фраза с явным местоимением обеспечивает ясность, не превращая исходное сочинение в относительное придаточное.
- source_word: וְאֵת שַׁדַּי
  choice: и от Всемогущего
  rationale: Необычная частица אֵת допускает разные синтаксические объяснения. Повторение «от» передаёт параллелизм и понимание Бога как источника благословения; неоднозначность отмечена в сноске.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Божественный титул переведён, а не транслитерирован; «Всемогущий» — понятный и устойчивый русский эквивалент.
- source_word: וִיבָרְכֶךָ
  choice: Он благословит тебя
  rationale: Глагольная форма имеет Бога своим подразумеваемым подлежащим; отдельная фраза естественна по-русски и сохраняет обещательный характер благословения.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: благословениями небес свыше
  rationale: Сохранены образ вертикального пространства и поэтическая параллель с тем, что находится внизу.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: бездны, лежащей внизу
  rationale: תְּהוֹם обозначает глубинные воды, а причастие רֹבֶצֶת — лежание или пребывание внизу. «Бездна» сохраняет библейский космологический образ; вариант «притаившейся» отмечен в сноске.
- source_word: שָׁדַיִם וָרָחַם
  choice: грудей и утробы
  rationale: Буквально переданы телесные образы вскармливания, плодородия и рождения без пояснительного расширения текста.
theological_decisions:
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Перевод титула передаёт его традиционно понимаемый смысл обычному читателю, не вводя дополнительных богословских уточнений.
- issue: Связь Бога отца и Всемогущего с глаголами помощи и благословения
  choice: 'Две параллельные исходные формулы: «от Бога…» и «от Всемогущего…»'
  alternative: «Бог твоего отца… и Всемогущий…» как тесное приложение либо конструкция со значением средства
  rationale: Еврейские предлоги и частица перед שַׁדַּי синтаксически сжаты. Основной текст сохраняет представление об источнике помощи и благословения, а сноска удерживает реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного поэтического параллелизма. «Свыше / внизу» воспроизводит пространственное противопоставление; телесные образы «грудей и утробы» оставлены прямыми и конкретными.
