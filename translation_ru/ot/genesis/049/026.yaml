  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: ru
  text: Благословения твоего отца превзошли благословения моих родителей и достигли дальних пределов вековых холмов[a]. Да пребудут они на голове Иосифа и на темени того, кто отделён от своих братьев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечных холмов». Еврейский поэтический оборот допускает также понимание «до пределов вековых холмов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посвящённого среди своих братьев»; возможно также: «князя среди своих братьев».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: благословения твоего отца
  rationale: Сохранены множественное число и прямое обращение Иакова к Иосифу.
- source_word: גָּבְרוּ עַל
  choice: превзошли
  rationale: Глагол с предлогом выражает превосходство по силе или мере; «превзошли» естественно передаёт сравнительный смысл.
- source_word: הוֹרַי
  choice: моих родителей
  rationale: Форма буквально указывает на тех, кто родил Иакова; в данном контексте современное «родителей» точнее и яснее, чем более широкое «предков».
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: и достигли дальних пределов вековых холмов
  rationale: Трудный поэтический оборот передан как указание на предельную протяжённость благословений. «Вековые» сохраняет временной оттенок עוֹלָם, не утверждая буквальную вечность холмов.
- source_word: תִּהְיֶיןָ
  choice: да пребудут они
  rationale: В контексте патриаршего благословения имперфект имеет пожелательно-провозгласительную силу.
- source_word: לְרֹאשׁ ... וּלְקָדְקֹד
  choice: на голове ... на темени
  rationale: Передан образ благословений, покоящихся на человеке, и сохранён поэтический параллелизм двух обозначений головы.
- source_word: נְזִיר אֶחָיו
  choice: того, кто выделен среди своих братьев
  rationale: Так сохраняется основной смысл особого, отделённого положения Иосифа без преждевременного сведения слова к позднейшему институту назорейства или исключительно к княжескому титулу.
theological_decisions:
- issue: Значение эпитета נְזִיר אֶחָיו применительно к Иосифу
  choice: того, кто выделен среди своих братьев
  alternative: посвящённого среди своих братьев; князя среди своих братьев; отделённого от своих братьев
  rationale: Основной текст сохраняет смысл особого положения и отделённости Иосифа, но не приписывает ему формального назорейского статуса и не превращает неоднозначный эпитет в однозначный политический титул.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Формулы «да пребудут» и «на темени» поддерживают достоинство патриаршего благословения, оставаясь понятными современному читателю.
