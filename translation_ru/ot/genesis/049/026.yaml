revisions:
- from: Благословения твоего отца превзошли благословения моих родителей[a] и достигли дальних пределов вековых холмов. Да пребудут они на голове Иосифа, на темени того, кто выделен среди своих братьев[b].
  to: Благословения твоего отца превзошли благословения моих родителей и достигли дальних пределов вековых холмов[a]. Да пребудут они на голове Иосифа и на темени того, кто отделён от своих братьев[b].
  rationale: Исправлена привязка и содержание сноски о גִּבְעֹת עוֹלָם, чтобы она отмечала реальную лексико-поэтическую альтернативу без введения иной реконструкции текста. Эпитет Иосифа уточнён как «отделённый от своих братьев», что ближе к базовому значению נְזִיר и не навязывает ни позднейший институт назорейства, ни политическое значение «князь». Остальная образность и современный литературный регистр сохранены.
