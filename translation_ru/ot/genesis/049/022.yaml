lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: плодовитый сын
  rationale: Передаёт обычное значение בֵּן («сын») и связь פֹּרָת с корнем פרה («плодиться, быть плодовитым»), не превращая сжатый поэтический образ непосредственно в «ветвь».
- source_word: עֲלֵי עָיִן
  choice: у источника
  rationale: עַיִן может означать как «глаз», так и «источник»; в контексте плодородия естественнее значение «источник», а עֲלֵי здесь передано как указание на местонахождение.
- source_word: בָּנוֹת
  choice: дочери
  rationale: Сохранено прямое лексическое значение слова и намеренная поэтическая сжатость; понимание его как ветвей или побегов вынесено в примечание.
- source_word: צָעֲדָה
  choice: шагают
  rationale: Глагол выражает движение шагом или поступью. Настоящее время естественно для русского поэтического описания; множественное число согласовано с «дочери», хотя в еврейском стоит форма женского рода единственного числа при коллективно понимаемом существительном.
- source_word: עֲלֵי שׁוּר
  choice: через стену
  rationale: שׁוּר здесь означает «стена»; сочетание с глаголом движения допускает образ перехода поверх преграды. «Через стену» по-русски естественно передаёт это направление, не устраняя образ.
