  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: ru
  text: Там похоронили Авраама и его жену Сарру; там похоронили Исаака и его жену Ревекку; и там я похоронил Лию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: там
  rationale: Наречие указывает на ранее названное место погребения; «там» естественно и точно передаёт этот отсылочный смысл.
- source_word: קָבְרוּ
  choice: похоронили
  rationale: Форма qal перфекта 3-го лица множественного числа имеет неопределённый субъект. Активная конструкция сохраняет форму еврейского текста и естественно звучит по-русски.
- source_word: אִשְׁתּוֹ
  choice: его жену
  rationale: Существительное с местоименным суффиксом 3-го лица мужского рода передано естественной русской конструкцией; винительный падеж обусловлен глаголом «похоронили».
- source_word: קָבַרְתִּי
  choice: я похоронил
  rationale: Форма qal перфекта 1-го лица единственного числа обозначает совершённое Иаковом действие.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: похоронили ... похоронили ... похоронил
  rationale: Повтор одного корня קבר сохранён, чтобы воспроизвести ритм и смысловую связность исходного перечисления.
- source_word: לֵאָה
  choice: Лию
  rationale: Имя передано в принятой русской библейской форме «Лия» и поставлено в винительный падеж.
