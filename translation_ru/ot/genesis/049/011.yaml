  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: ru
  text: Он привязывает своего ослёнка к виноградной лозе[a], а ослёнка своей ослицы — к отборной лозе[b]; стирает в вине свою одежду, а в крови винограда[c] — своё одеяние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское עַיִר означает молодого осла, ослёнка.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к благородной лозе»; еврейское שֹׂרֵקָה обозначает отборную виноградную лозу.'
    reason: lexical_alternative
  - marker: c
    text: «Кровь винограда» — древнееврейский поэтический образ виноградного сока или вина.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Он привязывает
  rationale: Причастная форма изображает характерное действие в поэтической картине. Русское настоящее время передаёт эту наглядность естественнее, чем буквальное деепричастие без опорного сказуемого.
- source_word: לַגֶּפֶן
  choice: к виноградной лозе
  rationale: גֶּפֶן означает виноградную лозу; определённость формы не обязательно указывает на одну конкретную лозу, поэтому по-русски сохранено естественное родовое выражение.
- source_word: עירֹה
  choice: своего ослёнка
  rationale: עַיִר обозначает молодого осла, ослёнка. Притяжательный суффикс передан словом «своего».
- source_word: וְלַשֹּׂרֵקָה
  choice: к отборной лозе
  rationale: שֹׂרֵקָה — отборная, высококачественная виноградная лоза. «Отборная» понятно передаёт качественный оттенок, не превращая его в отдельное толкование.
- source_word: בְּנִי אֲתֹנוֹ
  choice: сына своей ослицы
  rationale: Сохранён конкретный образ буквального выражения «сын его ослицы» и поэтический параллелизм с «ослёнком».
- source_word: כִּבֵּס
  choice: стирает
  rationale: Глагол означает мыть или стирать одежду. Настоящее время представляет действие как живую поэтическую сцену; временная отнесённость древнееврейского перфекта в этом благословении допускает также завершённое или будущее прочтение.
- source_word: בַּיַּיִן
  choice: в вине
  rationale: 'Предлог ב передан пространственным «в», что сохраняет гиперболический образ изобилия: одежды стирают прямо в вине.'
- source_word: לְבֻשׁוֹ
  choice: свою одежду
  rationale: לְבוּשׁ — одежда или предмет одежды. Единственное число сохранено в естественной русской форме.
- source_word: וּבְדַם עֲנָבִים
  choice: а в крови винограда
  rationale: Метафора «кровь винограда» сохранена ради силы и конкретности древнееврейского поэтического образа; она обозначает виноградный сок или вино.
- source_word: סותֹה
  choice: своё одеяние
  rationale: Редкое название одежды стоит в параллели к לְבֻשׁוֹ. Обобщённое «одеяние» сохраняет возвышенный поэтический регистр и не приписывает предмету одежды неоправданно точный вид.
theological_decisions:
- issue: Мессианское или племенное значение образов в благословении Иуды
  choice: Сохранить поэтическую картину необычайного виноградного изобилия и достоинства без явного мессианского уточнения в основном тексте.
  alternative: Перевести стих как прямое мессианское пророчество либо ограничить его исключительно историческим благополучием колена Иуды.
  rationale: Сам стих выражается через образы лозы, вина и одежды. Более широкое благословение Иуды допускает разные богословские прочтения, но ни одно из них не следует вносить в перевод этого стиха как прямо высказанное.
- issue: Временная отнесённость כִּבֵּס в пророческом благословении
  choice: Передать настоящим временем «стирает», согласовав с живой описательной картиной.
  alternative: «стирал» или «будет стирать».
  rationale: Древнееврейский перфект в поэзии и пророческом благословении может представлять действие как завершённое, наглядно увиденное или ожидаемое. Настоящее время по-русски сохраняет образный характер, не делая будущность единственно возможным толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух полустиший сохранён; синтаксис сделан плавным и понятным без устранения образной гиперболы и временной неоднозначности оригинала.
