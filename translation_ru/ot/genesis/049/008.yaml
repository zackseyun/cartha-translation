base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: ru
  text: Иуда[a], тебя восхвалят твои братья; твоя рука будет на шее твоих врагов; сыновья твоего отца склонятся перед тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Иуда» созвучно еврейскому глаголу, переведённому здесь как «восхвалят»; его можно также передать как «воздадут тебе хвалу» или «признают тебя».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная и устоявшаяся русская передача имени; сохраняет связь со словесной игрой, основанной на корне ידה.
- source_word: יוֹדוּךָ
  choice: тебя восхвалят
  rationale: Форма от ידה здесь означает хвалить или с почтением признавать; «восхвалят» естественно передаёт благословение и словесную игру с именем Иуды.
- source_word: אַחֶיךָ
  choice: твои братья
  rationale: Мужское множественное число с суффиксом второго лица; в непосредственном контексте речь идёт о сыновьях Иакова.
- source_word: יָדְךָ
  choice: твоя рука
  rationale: Сохранён конкретный образ руки как выражение силы и господства.
- source_word: בְּעֹרֶף אֹיְבֶיךָ
  choice: на шее твоих врагов
  rationale: עֹרֶף обозначает шею или затылок; оборот передаёт образ победы и подчинения врагов.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: склонятся перед тобой
  rationale: Глагол обозначает поклон как знак почтения или подчинения; эта передача сохраняет смысл человеческого признания власти, не придавая выражению обязательного культового значения.
- source_word: בְּנֵי אָבִיךָ
  choice: сыновья твоего отца
  rationale: Буквальная и понятная передача еврейского выражения, подчёркивающего подчинение Иуде со стороны его братьев.
theological_decisions:
- issue: Характер поклона в יִשְׁתַּחֲווּ לְךָ
  choice: человеческое почтение и подчинение — «склонятся перед тобой»
  alternative: «поклонятся тебе», что может быть понято и как культовое поклонение
  rationale: Адресат — Иуда в благословении Иакова; контекст указывает на признание власти внутри человеческих отношений. При этом образ царственного подчинения сохранён.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным звучанием. Параллельная структура еврейской поэзии и конкретные образы руки, шеи и поклона сохранены.
