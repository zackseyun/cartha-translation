  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: ru
  text: Дан будет судить свой народ как одно из колен Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дан будет защищать права своего народа». Еврейский глагол может означать не только вынесение суда, но и защиту прав или восстановление справедливости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Дан
  rationale: Имя сына Иакова и названного по нему колена передано в принятой русской библейской форме. Соседство с глаголом יָדִין создаёт игру слов, которую по-русски полностью воспроизвести невозможно.
- source_word: יָדִין
  choice: будет судить
  rationale: Форма qal imperfect 3-го лица единственного числа от דין в контексте благословения естественно выражает будущее. «Судить» сохраняет основное значение глагола; возможный оттенок защиты и восстановления справедливости вынесен в сноску.
- source_word: עַמּוֹ
  choice: свой народ
  rationale: Существительное עם с суффиксом 3-го лица мужского рода означает «его народ». Возвратное притяжательное местоимение «свой» естественно для русского языка при подлежащем «Дан».
- source_word: כְּאַחַד
  choice: как одно
  rationale: Сочетание сравнительного כְּ и אַחַד передаёт значение «как одно»; форма среднего рода согласована с русским словом «колено».
- source_word: שִׁבְטֵי
  choice: из колен
  rationale: Множественное число в сопряжённой форме от שֵׁבֶט здесь обозначает колена Израиля. Конструкция «одно из колен» естественно передаёт принадлежность Дана к их числу.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Имя народа передано в нормативной русской библейской форме и поставлено в родительный падеж по требованиям русского синтаксиса.
theological_decisions:
- issue: Характер роли Дана в благословении
  choice: Дан представлен как судящий свой народ наравне с одним из колен Израиля.
  alternative: Дан оправдает или защитит свой народ, добившись для него справедливости.
  rationale: Глагол דין допускает оттенки суда, управления, защиты и восстановления справедливости. Основной текст сохраняет прямое значение «судить», не исключая более широкого оттенка, отмеченного в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексемой «колено». Формулировка краткая и торжественная; подлинная многозначность глагола דין сохранена посредством сноски.
