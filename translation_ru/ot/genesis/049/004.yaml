base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: ru
  text: Необузданный, как вода, ты не будешь иметь превосходства, потому что взошёл на ложе твоего отца; тогда ты осквернил моё ложе — он взошёл на него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более плавно: «тогда ты осквернил моё ложе — ты взошёл на него». В еврейском тексте последняя фраза неожиданно переходит к третьему лицу: «он взошёл»; возможно, это восклицательное повторение о Рувиме.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: бурный
  rationale: Слово выражает необузданность, порывистость и неустойчивость. «Бурный» естественно сочетается со сравнением с водой и сохраняет нравственную характеристику Рувима.
- source_word: כַּמַּיִם
  choice: как вода
  rationale: Прямо передаёт образ воды как неуправляемой и не удерживаемой в границах стихии.
- source_word: אַל תּוֹתַר
  choice: ты не будешь первым
  rationale: В контексте утраченного первородного превосходства глагол указывает на лишение первенства. Такой перевод понятен по-русски и не сводит смысл к личной успешности.
- source_word: כִּי עָלִיתָ
  choice: потому что взошёл
  rationale: Сохраняет причинное значение כִּי и эвфемистический глагол עלה без поясняющего расширения.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: на ложе отца своего
  rationale: Еврейская форма множественного числа обозначает постель или брачное ложе; русский язык в данном контексте требует естественного единственного числа.
- source_word: חִלַּלְתָּ
  choice: ты осквернил
  rationale: Передаёт тяжесть нравственного нарушения и хорошо сочетается с образом брачного ложа.
- source_word: יְצוּעִי
  choice: моё ложе
  rationale: Сохраняет переход к первому лицу и лексическую связь с предшествующим упоминанием ложа.
- source_word: עָלָה
  choice: он взошёл на него
  rationale: Сохраняет неожиданную форму третьего лица мужского рода в масоретском тексте. Добавленное «на него» делает русскую фразу грамматически ясной, не устраняя смены лица.
theological_decisions:
- issue: Эвфемистическое описание поступка Рувима
  choice: Сохранить образ восхождения на отцовское ложе и оценку «осквернил».
  alternative: 'Раскрыть эвфемизм: «лёг с наложницей своего отца».'
  rationale: Исходный стих говорит эвфемистически, но понятно; конкретизация по Быт 35:22 внесла бы в эту строку сведения, не выраженные здесь непосредственно.
- issue: Неожиданная смена лица в עָלָה
  choice: 'Оставить в основном тексте третье лицо: «он взошёл».'
  alternative: Сгладить как «ты взошёл на моё ложе».
  rationale: Масоретский текст резко переходит от второго лица к третьему. Сохранение этой формы удерживает подлинную синтаксическую и риторическую неоднозначность, а примечание сообщает более плавное понимание.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской образностью. «Ложе» сохраняет достоинство и эвфемистический характер исходника; архаические формы и излишняя эксплицитность исключены.
