  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: ru
  text: Да будет Дан змеёй у дороги, ядовитой змеёй[a] у тропы, кусающей коня за пятки, так что его всадник падает назад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «гадюка»; редкое еврейское слово שְׁפִיפֹן обозначает опасную змею, но точный вид неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Да будет
  rationale: Юссив от היה передаёт пожелание-провозглашение в благословении Иакова; «да будет» сохраняет волитивный оттенок и возвышенный поэтический строй.
- source_word: דָן
  choice: Дан
  rationale: Традиционная русская форма имени сына Иакова и названия колена.
- source_word: נָחָשׁ
  choice: змея
  rationale: Общее обозначение змеи; современное и понятное слово, уместное в поэтическом образе.
- source_word: עֲלֵי דֶרֶךְ
  choice: у дороги
  rationale: Передаёт местонахождение змеи возле дороги и образ засады, не навязывая значение движения вдоль неё.
- source_word: שְׁפִיפֹן
  choice: гадюка
  rationale: Редкое название опасной змеи, точный биологический вид которой неясен. «Гадюка» ясно передаёт опасность, не претендуя на строгую зоологическую идентификацию.
- source_word: עֲלֵי אֹרַח
  choice: у тропы
  rationale: Сохраняет поэтический параллелизм с «у дороги» и различие между דֶרֶךְ и אֹרַח.
- source_word: הַנֹּשֵׁךְ
  choice: кусающей
  rationale: Причастие описывает змею через её действие; женская форма естественно согласуется с ближайшим русским словом «гадюка».
- source_word: עִקְּבֵי סוּס
  choice: коня за пятки
  rationale: Передаёт заднюю часть ног коня и сохраняет яркий образ оригинала; единственное число имеет обобщающее значение.
- source_word: וַיִּפֹּל
  choice: так что ... падает
  rationale: Связь событий естественно понимается как результат укуса; «так что» ясно выражает эту связь, не изменяя последовательности образов.
- source_word: רֹכְבוֹ
  choice: всадник его
  rationale: Местоименный суффикс относится к коню. Такой порядок слов сохраняет местоимение оригинала и остаётся понятным по ближайшему контексту.
- source_word: אָחוֹר
  choice: назад
  rationale: Точно передаёт направление падения, не усиливая образ до обязательного падения навзничь.
