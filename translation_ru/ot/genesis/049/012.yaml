- source_word: חַכְלִילִי
  choice: красны
  rationale: Редкое прилагательное, вероятно, обозначает красноту или покраснение глаз; такой смысл поддерживается родственным выражением о покраснении глаз от вина в Притчах 23:29 и образом изобилия в ближайшем контексте.
- source_word: עֵינַיִם
  choice: глаза
  rationale: Прямое соответствие еврейскому двойственному существительному.
- source_word: מִיָּיִן
  choice: от вина
  rationale: 'Предлог מִן понят как обозначение причины: глаза красны от вина. Это согласуется с упоминанием изобилия вина в предыдущем стихе, хотя грамматически возможен и сравнительный смысл.'
- source_word: וּלְבֶן
  choice: и белы
  rationale: Прилагательное передано предикативно и параллельно первой строке; сравнительная степень не выражена явно, если מִן понимать как указание на причину.
- source_word: שִׁנַּיִם
  choice: зубы
  rationale: Прямое соответствие еврейскому двойственному существительному.
- source_word: מֵחָלָב
  choice: от молока
  rationale: Предлог מִן передан как указание на причину или источник белизны, в поэтическом параллелизме с «от вина».
