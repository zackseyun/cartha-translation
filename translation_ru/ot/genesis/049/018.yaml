lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: на спасение Твоё
  rationale: Существительное יְשׁוּעָה обозначает спасение или избавление. «Спасение» сохраняет широкий смысл, а предлог «на» естественно сочетается в русском языке с глаголом «уповать».
- source_word: קִוִּיתִי
  choice: я уповаю
  rationale: Глагол קוה выражает исполненное надежды ожидание. Настоящее время по-русски естественно передаёт сохраняющееся упование, тогда как форма еврейского перфекта допускает и перевод прошедшим временем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет различие между личным именем и титулом, не внося конфессиональной интерпретации.
- issue: Временной оттенок קִוִּיתִי
  choice: я уповаю
  alternative: я уповал; я ждал
  rationale: Еврейский перфект в поэтическом восклицании может выражать сложившееся и сохраняющееся состояние. Основной текст передаёт продолжающееся упование, а сноска сохраняет возможное ретроспективное прочтение.
translation_notes:
  register: Краткая поэтическая строка с вынесенным вперёд объектом сохраняет смысловое ударение оригинала. «Уповаю» — современное литературное слово возвышенного, но понятного регистра; местоимение написано с прописной буквы как уважительная русская традиция.
