  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: ru
  text: 'Он дал им повеление и сказал им: «Скоро я присоединюсь к своему народу[a]. Похороните меня с моими отцами в пещере на поле хеттеянина Ефрона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я присоединяюсь к своему народу». Это еврейское выражение говорит о близкой смерти и соединении со своим народом или предками после смерти.'
    reason: Лексическая альтернатива и пояснение идиомы.
lexical_decisions:
- source_word: וַיְצַו אֹותָם וַיֹּאמֶר אֲלֵהֶם
  choice: Он дал им повеление и сказал
  rationale: Передаёт и силу глагола צוה («повелевать, давать распоряжение»), и последующую формулу речи, сохраняя торжественный повествовательный ритм без архаичного русского «наказал».
- source_word: אֲנִי נֶאֱסָף אֶל־עַמִּי
  choice: Скоро я буду приобщён к своему народу
  rationale: Пассивная конструкция сохраняет метафору еврейского нифаля и контекстуальную близость смерти; «приобщён» естественнее по-русски, чем буквальное «собран», и не сводит выражение просто к «я умру».
- source_word: עַמִּי
  choice: моему народу
  rationale: Сохраняет буквальный и богословски значимый образ принадлежности к своему народу, не сужая его до одних родственников или предков.
- source_word: קִבְרוּ אֹתִי
  choice: Похороните меня
  rationale: Точно передаёт повелительное наклонение множественного числа и звучит естественно в современном русском языке.
- source_word: אֶל־אֲבֹתָי
  choice: с моими отцами
  rationale: В контексте погребения предлог אֶל естественно передаётся русским «с»; «отцы» сохраняет библейский семейно-родовой образ, не подменяя его пояснением «предки».
- source_word: אֶל־הַמְּעָרָה אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן הַחִתִּי
  choice: в пещере на поле Ефрона-хеттеянина
  rationale: Передаёт место погребения ясно и естественно; определение «хеттеянин» относится к Ефрону, а не к полю.
theological_decisions:
- issue: Смысл выражения «приобщён к своему народу»
  choice: Сохранить образное выражение о приближающейся смерти и посмертном приобщении к своему народу
  alternative: «Я скоро умру»
  rationale: Прямая замена на сообщение о смерти устранила бы семейно-родовой и возможный посмертный смысл идиомы. Перевод сохраняет напряжение текста, не выстраивая на его основе подробного учения о загробной жизни.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены «народ» и «отцы» как значимые образы исходного текста; синтаксис упрощён лишь настолько, чтобы фраза оставалась естественной и понятной.
