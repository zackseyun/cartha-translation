  text: Неффалим — лань, выпущенная на волю[a]; он произносит прекрасные слова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «отпущенная лань»; еврейский образ — самка оленя, отпущенная на волю, чтобы свободно бежать.'
    reason: lexical_alternative
  - marker: b
    text: Заключительную часть строки толкуют по-разному. Масоретский текст допускает перевод «он произносит прекрасные слова» или «дающий прекрасные изречения»; при ином понимании последних слов предлагался также перевод «рождающая прекрасных оленят».
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Неффалим
  rationale: Традиционная русская форма личного и племенного имени, понятная читателю и уместная в библейском тексте.
- source_word: אַיָּלָה
  choice: лань
  rationale: Существительное обозначает самку оленя. «Лань» кратко и естественно сохраняет женский род и поэтический образ.
- source_word: שְׁלֻחָה
  choice: выпущенная на волю
  rationale: Страдательная форма от שלח в данном образе указывает на животное, которое отпустили свободно бежать. Выражение естественно по-русски и сохраняет образ освобождения.
- source_word: הַנֹּתֵן
  choice: он произносит
  rationale: Мужской причастный оборот, вероятнее всего, вновь относится к Неффалиму, а не согласуется с «ланью». Личная конструкция передаёт это различие естественным русским языком.
- source_word: אִמְרֵי
  choice: слова
  rationale: Форма множественного числа в сопряжённом состоянии обозначает слова или изречения; «слова» — самое широкое и естественное соответствие.
- source_word: שָׁפֶר
  choice: прекрасные
  rationale: Слово выражает красоту или приятность; «прекрасные» сохраняет положительную поэтическую характеристику.
theological_decisions:
- issue: К кому относится заключительная причастная конструкция
  choice: 'Она передана как характеристика Неффалима: «он произносит прекрасные слова».'
  alternative: Её можно связывать с образом лани либо понимать последние слова как указание на прекрасных детёнышей.
  rationale: Еврейская строка предельно сжата. Мужской род הַנֹּתֵן позволяет отнести оборот к Неффалиму, тогда как масоретская огласовка אִמְרֵי שָׁפֶר поддерживает значение «прекрасные слова». Другие толкования отмечены в сноске, чтобы не скрывать подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим звучанием. Тире и точка с запятой сохраняют сжатость благословения, а местоимение «он» естественно передаёт смену грамматического рода в еврейской строке.
