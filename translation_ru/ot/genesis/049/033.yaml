base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: ru
  text: Когда Иаков закончил давать повеления своим сыновьям, он подтянул ноги на постель[a], испустил последний вздох и был собран к своему народу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «собрал свои ноги на постель».'
    reason: lexical_alternative
  - marker: b
    text: «Был собран к своему народу» — еврейское выражение, связанное со смертью и воссоединением человека со своим народом или предками; оно означает не просто погребение.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: закончил
  rationale: Глагол כלה обозначает завершение действия и естественно вводит последующую цепь событий.
- source_word: לְצַוֹּת
  choice: давать повеления
  rationale: צוה означает «повелевать, давать указания». Такое выражение сохраняет силу исходного слова и естественно звучит в контексте последних распоряжений Иакова.
- source_word: בָּנָיו
  choice: своим сыновьям
  rationale: В еврейском тексте прямо сказано «его сыновьям»; возвратное местоимение естественно для русского языка при подлежащем «Иаков».
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: подтянул ноги на постель
  rationale: 'Буквально употреблён глагол «собирать», но речь идёт о телесном движении: Иаков подтянул ноги обратно на постель. Перевод передаёт действие ясно и без неестественной кальки.'
- source_word: הַמִּטָּה
  choice: постель
  rationale: מִטָּה может означать кровать или ложе; «постель» естественно и достойно звучит в сцене смерти Иакова.
- source_word: וַיִּגְוַע
  choice: испустил последний вздох
  rationale: גוע обозначает угасание жизни, кончину. Этот перевод сохраняет отдельный оттенок глагола и не сливает его со следующим идиоматическим выражением.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: был собран к своему народу
  rationale: Сохранён образ и пассивная форма устойчивого еврейского выражения. Хотя оборот несколько непривычен по-русски, он передаёт литературно-богословскую насыщенность оригинала и поясняется сноской.
theological_decisions:
- issue: Значение выражения «был собран к своему народу»
  choice: Сохранить идиому, не сводя её к погребению.
  alternative: «присоединился к своим предкам» или «был похоронен рядом со своими предками»
  rationale: Погребение Иакова происходит позднее, поэтому выражение здесь не является простым сообщением о похоронах. Буквально-образный перевод сохраняет открытым смысл связи умершего со своим народом после смерти.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Необычный образ «был собран к своему народу» намеренно сохранён ради смысловой и богословской открытости оригинала; сноска обеспечивает понятность.
