lexical_decisions:
- source_word: מִקְנֵה
  choice: были куплены
  rationale: Существительное מִקְנֵה обозначает приобретение или приобретённую собственность. В данном эллиптическом именном предложении русская глагольная формулировка естественно передаёт смысл совершённой покупки, не меняя предмета сделки.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Обычное и точное соответствие в контексте владения землёй.
- source_word: וְהַמְּעָרָה
  choice: и пещера
  rationale: Прямой перевод с сохранением соединительного союза и второго предмета приобретения.
- source_word: אֲשֶׁר בּוֹ
  choice: которая в нём
  rationale: 'Относительное местоимение относится к пещере, а местоимение мужского рода — к полю: пещера находится в поле. Настоящее время в русском естественно для этого итогового утверждения.'
- source_word: מֵאֵת
  choice: у
  rationale: В сочетании с глаголом покупки русский предлог «у» естественно обозначает прежних владельцев, от которых имущество было приобретено.
- source_word: בְּנֵי חֵת
  choice: сынов Хета
  rationale: Формально прозрачный перевод сохраняет родовое наименование еврейского текста; контекстуальный этноним «хеттеи» дан в примечании.
