  source_fidelity: Первый глагол в пиэле от מרר прежде всего означает «огорчать/делать горьким; жестоко обходиться», а не прямо «ожесточённо нападать». В сочетании с последующими «стреляли» и «ненавидели» исходный вариант неоправданно дублирует мотив нападения. Средний глагол וָרֹבּוּ текстологически и лексически труден; «стреляли в него» допустимо в контексте заключительного обозначения «лучники», если альтернатива отмечена в сноске. Финальное בַּעֲלֵי חִצִּים естественно передано как «лучники», при сохранении его вынесенной в конец позиции.
