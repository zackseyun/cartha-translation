  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: ru
  text: Они жестоко досаждали ему[a], стреляли в него и ненавидели его — лучники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они огорчали его, враждовали с ним и ненавидели его — лучники». Значение среднего еврейского глагола неясно; его также понимают как «состязались с ним» или «нападали на него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: они ожесточённо нападали на него
  rationale: Пиэль от מרר с объектным суффиксом допускает значения «делать горьким», «огорчать», «обходиться жестоко». В данном ряду враждебных действий естественное русское «ожесточённо нападали» передаёт и оттенок горечи/жестокости, и направленное против Иосифа действие.
- source_word: וָרֹבּוּ
  choice: стреляли в него
  rationale: Форма трудна и может пониматься как «враждовали», «нападали» или, в связи с последующим «лучники», как указание на стрельбу. Выбрано «стреляли в него», поскольку оно сохраняет образ стрелков, но неоднозначность отмечена в сноске.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: ненавидели его
  rationale: Глагол שטם выражает ненависть, вражду или затаённую неприязнь; «ненавидели» — ясный и точный эквивалент в поэтическом перечислении.
- source_word: בַּעֲלֵי חִצִּים
  choice: лучники
  rationale: Буквально «владельцы/обладатели стрел»; это идиоматическое обозначение лучников. Прямой русский эквивалент звучит естественно и сохраняет образ.
