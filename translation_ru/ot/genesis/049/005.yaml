  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: ru
  text: Симеон и Левий — братья; орудия насилия — их мечи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «орудия насилия — их принадлежности». Значение редкого еврейского слова, переведённого как «мечи», неясно; в некоторых древних и старых переводах — «их жилища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: Симеон
  rationale: Традиционная русская форма библейского имени, соответствующая еврейскому שִׁמְעוֹן.
- source_word: וְלֵוִי
  choice: и Левий
  rationale: Союз וְ передан как «и», а имя — в его устойчивой русской библейской форме «Левий».
- source_word: אַחִים
  choice: братья
  rationale: Слово прямо означает «братья»; именная конструкция естественно передана по-русски с тире, без добавления связки.
- source_word: כְּלֵי חָמָס
  choice: орудия насилия
  rationale: כְּלֵי может обозначать орудия, принадлежности или оружие, а חָמָס — насилие и насильственное зло. «Орудия насилия» сохраняет широту выражения и его осуждающий смысл.
- source_word: מְכֵרֹתֵיהֶם
  choice: их мечи
  rationale: Редкое и неясное слово. Значение «мечи» уместно в контексте насилия и поэтического обличения, однако лексическая неопределённость отмечена в сноске.
