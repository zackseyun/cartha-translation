base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: ru
  text: Проклят их гнев, ибо он свиреп; проклята их ярость, ибо она жестока! Разделю их среди потомков Иакова и рассею их среди Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Проклят
  rationale: Страдательное причастие употреблено как сказуемое в формуле проклятия. «Проклят» сохраняет краткость и силу поэтического провозглашения, не перенося проклятие с гнева на самих братьев.
- source_word: אַפָּם
  choice: их гнев
  rationale: Хотя אַף буквально связано с носом или ноздрями, здесь это устойчивое обозначение гнева; перевод передаёт смысл идиомы.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание проклятия. «Ибо» естественно для возвышенной поэтической речи и сохраняет причинную связь.
- source_word: עָז
  choice: свиреп
  rationale: Прилагательное означает силу или интенсивность; применительно к гневу «свиреп» передаёт его необузданную, разрушительную силу.
- source_word: וְעֶבְרָתָם
  choice: и ярость их
  rationale: עֶבְרָה обозначает переполняющую ярость или неистовый гнев. «Ярость» сохраняет усиление относительно «гнева» и подходит поэтическому контексту.
- source_word: קָשָׁתָה
  choice: она жестока
  rationale: Форма выражает жёсткость или суровость. В отношении ярости «жестока» естественно передаёт её беспощадный характер, не ослабляя нравственной оценки насилия.
- source_word: אֲחַלְּקֵם
  choice: Разделю их
  rationale: Пиэль, 1-е лицо единственного числа с местоименным суффиксом 3-го лица множественного числа. «Разделю» сохраняет отличие этого глагола от следующего «рассею».
- source_word: בְּיַעֲקֹב
  choice: в Иакове
  rationale: Иаков здесь означает совокупность его потомков. Буквальный оборот сохраняет образ и параллелизм с «в Израиле».
- source_word: וַאֲפִיצֵם
  choice: и рассею их
  rationale: Гифиль выражает причинение рассеяния. «Рассею» естественно передаёт образ суда и распределения среди народа.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Сохраняется параллель с «в Иакове» и поэтическое употребление обоих имён для народа.
theological_decisions:
- issue: Объект проклятия
  choice: Проклятие обращено на гнев и ярость Симеона и Левия, а не прямо на них самих.
  alternative: Прокляты сами братья.
  rationale: В еврейском тексте подлежащими прямо названы «их гнев» и «их ярость». Перевод сохраняет это различие и не усиливает высказывание сверх источника.
- issue: Характер первой фразы
  choice: «Проклят» допускает прочтение как торжественного объявления проклятия.
  alternative: «Да будет проклят» подчёркивает пожелательный характер формулы.
  rationale: Причастная конструкция без выраженной связки может восприниматься и как объявление состояния, и как формула проклятия; основной текст и сноска сохраняют эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Сохранены параллелизм «в Иакове / в Израиле», различие между «разделю» и «рассею», а также направленность проклятия на гнев и ярость. Восклицательный знак передаёт силу пророческого осуждения без добавления нового содержания.
