source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: ru
  text: Да не войдёт душа моя в их совет[a], да не присоединится честь моя[b] к их собранию! Ведь в гневе своём они убили человека, а по своей воле перерезали сухожилия быку[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в их тайный совет». Слово סוֹד может обозначать доверительный или тайный круг совещающихся.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да не соединится с их собранием слава моя».'
    reason: lexical_alternative
  - marker: c
    text: 'По масоретской огласовке — «быку». При ином понимании еврейских согласных эту строку переводят: «они разрушили стену».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: в их совет
  rationale: Сוֹד обозначает доверительный круг, совет или совещание. «Совет» сохраняет параллелизм с קָהָל («собрание»), не делая оттенок тайности обязательным.
- source_word: תָּבֹא נַפְשִׁי
  choice: да не войдёт душа моя
  rationale: Конструкция с אַל выражает пожелание-запрет. Сохранение слова «душа» передаёт еврейский поэтический образ и не сводит его к простому «я».
- source_word: בִּקְהָלָם
  choice: к их собранию
  rationale: קָהָל — собравшееся сообщество или собрание; выбран современный и естественный русский эквивалент.
- source_word: תֵּחַד כְּבֹדִי
  choice: да не присоединится честь моя
  rationale: Глагол выражает соединение или приобщение, а כָּבוֹד здесь может означать честь, славу или достоинство говорящего. «Честь моя» естественно передаёт отмежевание Иакова от насилия, не устраняя возможного значения «слава».
- source_word: בְאַפָּם
  choice: в гневе своём
  rationale: Обычное идиоматическое значение אַף в данном контексте — гнев.
- source_word: הָרְגוּ אִישׁ
  choice: они убили человека
  rationale: Сохранено единственное число אִישׁ; оно не обобщено до множественного, несмотря на вероятную связь с событиями в Сихеме.
- source_word: וּבִרְצֹנָם
  choice: по своей воле
  rationale: רָצוֹן может обозначать волю, желание или удовольствие. Нейтральное «по своей воле» сохраняет смысл сознательного поступка, не усиливая его до однозначного «произвола».
- source_word: עִקְּרוּ
  choice: перерезали сухожилия
  rationale: В сочетании с названием животного עקר означает лишить животное способности двигаться, повредив сухожилия. Развёрнутый русский оборот точнее и понятнее специального глагола.
- source_word: שׁוֹר
  choice: быку
  rationale: Масоретская огласовка указывает на быка или вола. В контексте увечья животного «бык» звучит естественно и не предполагает обязательной кастрации, которую в современном русском может подразумевать «вол».
theological_decisions:
- issue: Значение כְּבֹדִי в поэтической формуле самоотмежевания
  choice: честь моя
  alternative: слава моя
  rationale: В контексте Иаков отказывается связывать своё достоинство с насилием Симеона и Левия. «Честь» ясно передаёт этот смысл, а буквальная и поэтически значимая возможность «слава» сохранена в сноске.
- issue: Толкование שׁוֹר в заключительной строке
  choice: бык
  alternative: стена
  rationale: Масоретская огласовка даёт значение «бык», а сочетание с עקר поддерживает смысл нанесения увечья животному. Известное альтернативное прочтение «разрушили стену» сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного поэтического строя. Два пожелания-запрета переданы симметричными конструкциями с «да не»; лексика ясная, без архаизмов и конфессионально окрашенных уточнений.
