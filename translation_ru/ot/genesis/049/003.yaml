  source_fidelity: 'В целом смысл передан точно: Рувим назван первенцем, силой отца и первым проявлением его жизненной/детородной силы; заключительные параллельные определения выражают превосходство в достоинстве и могуществе. «Начало моей мощи» слишком буквально воспроизводит רֵאשִׁית אֹנִי и в современном русском может означать происхождение или исходную точку мощи, а не её первое порождение/проявление.'
