base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: ru
  text: 'Рувим, ты — мой первенец,

    моя сила и первое проявление моей жизненной силы[a],

    превосходящий в достоинстве

    и превосходящий в могуществе[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начало моей мощи». Еврейское выражение указывает на первое проявление детородной силы отца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «превыше других по достоинству и могуществу». Еврейское выражение может обозначать превосходство или особую выдающуюся степень.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: мой первенец
  rationale: «Первенец» передаёт не только порядок рождения, но и связанный с ним семейный статус.
- source_word: כֹּחִי
  choice: моя сила
  rationale: Прямое и естественное соответствие, уместное в поэтическом обращении отца к сыну.
- source_word: רֵאשִׁית אוֹנִי
  choice: начало моей мощи
  rationale: Сохраняет образ первого проявления отцовской жизненной и детородной силы, не делая выражение излишне физиологичным.
- source_word: יֶתֶר שְׂאֵת
  choice: превосходящий достоинством
  rationale: Передаёт значение превосходства в положении, возвышенности и достоинстве; причастная конструкция естественно продолжает обращение к Рувиму.
- source_word: יֶתֶר עָז
  choice: превосходящий могуществом
  rationale: Сохраняет параллелизм с предыдущей строкой и отличает עָז от уже употреблённого כֹּחַ.
- source_word: אַתָּה
  choice: ты
  rationale: Сохраняет подчёркнутое прямое обращение; связка «есть» в современном русском не требуется.
theological_decisions:
- issue: Характер высказывания о первородном превосходстве Рувима
  choice: Сохранено утвердительное описание ожидаемого достоинства и могущества первенца без уточнения, сохраняются ли они после проступка.
  alternative: Передать строки как уже утраченное или условное превосходство.
  rationale: В данном стихе формы сами по себе не выражают утраты; последующее ограничение появляется в Быт. 49:4, поэтому его смысл не следует преждевременно вносить сюда.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Параллелизм еврейского текста сохранён повтором «превосходящий»; архаизмы и конфессионально окрашенные формулы не использованы.
