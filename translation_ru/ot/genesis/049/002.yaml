  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: ru
  text: Соберитесь и слушайте, сыновья Иакова; слушайте Израиля, вашего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Соберитесь
  rationale: Форма нифаль, повелительное наклонение, множественное число, призывает сыновей сойтись вместе; возвратная форма естественно передаёт этот оттенок по-русски.
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Повеление подразумевает внимательное восприятие слов, а не просто способность услышать; «слушайте» естественно и сохраняет повтор глагола.
- source_word: בְּנֵי יַעֲקֹב
  choice: сыновья Иакова
  rationale: Древнееврейское выражение прямо обозначает сыновей мужского пола, собравшихся для отцовского благословения.
- source_word: שִׁמְעוּ אֶל
  choice: слушайте Израиля
  rationale: Сочетание с אֶל обозначает направленность внимания на говорящего; беспредложное управление глагола «слушать» нормативно и естественно в русском языке.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Сохранено имя Израиль, стоящее в поэтическом параллелизме с именем Иаков.
- source_word: אֲבִיכֶם
  choice: отца вашего
  rationale: Постпозиция определения придаёт фразе dignified poetic cadence and сохраняет приложение к имени «Израиль».
theological_decisions:
- issue: Передача параллельных имён Иаков / Израиль
  choice: 'Сохранить оба имени: «сыновья Иакова… Израиля, отца вашего»'
  alternative: Для гладкости заменить оба упоминания одним именем
  rationale: В еврейском тексте намеренно употреблены оба имени в поэтическом параллелизме; перевод сохраняет их смысловое и заветное звучание, не сглаживая различие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, поэтическим ритмом. Повтор «слушайте» сохранён как риторическое усиление оригинала; инверсия «отца вашего» уместна в торжественной отцовской речи.
