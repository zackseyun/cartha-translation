  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: ru
  text: Гад — отряд налётчиков нападёт на него, но он нападёт на них по пятам.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте игра однокоренных слов: Гад — гедуд («отряд») — йегуденну («нападёт на него») — йагуд («нападёт»).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «но он нападёт [на них] у пяты». Это может означать преследование по пятам или нападение сзади.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: Гад
  rationale: Общепринятая русская передача имени сына Иакова и названия племени.
- source_word: גְּדוּד
  choice: шайка налётчиков
  rationale: Существительное обозначает вооружённый отряд, совершающий набеги. Эта передача яснее общего слова «отряд» и соответствует контексту взаимных нападений.
- source_word: יְגוּדֶנּוּ
  choice: нападёт на него
  rationale: Форма глагола גדד с местоименным суффиксом 3-го лица мужского рода единственного числа; в сочетании с גְּדוּד обозначает вражеский набег или нападение.
- source_word: וְהוּא
  choice: но он
  rationale: 'Союз допускает простое «и», однако здесь естественно выражает противопоставление: Гад сначала подвергается нападению, а затем отвечает тем же.'
- source_word: יָגֻד
  choice: нападёт
  rationale: Тот же глагольный корень, что и ранее; одинаковая передача сохраняет взаимность действия, хотя полную еврейскую игру слов по-русски воспроизвести невозможно.
- source_word: עָקֵב
  choice: с тыла
  rationale: Буквально «пята»; в данном контексте может указывать на нападение вслед уходящим врагам или сзади. «С тыла» даёт естественный русский текст, а буквальный образ и неоднозначность отмечены в сноске.
