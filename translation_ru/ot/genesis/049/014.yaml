  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: ru
  text: Иссахар — осёл с крепким костяком, лежащий между овечьими загонами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между вьючными сумами». Редкое еврейское слово имеет спорное значение; «овечьи загоны» — традиционное и вероятное по контексту понимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Иссахар
  rationale: Имя передано в принятой русской библейской форме.
- source_word: חֲמֹר
  choice: осёл
  rationale: Основное и естественное современное соответствие; указание на самца в данном поэтическом контексте излишне.
- source_word: גָּרֶם
  choice: с крепким костяком
  rationale: Буквально слово связано с костью; в сочетании с образом осла оно, вероятнее всего, описывает крепкое телосложение. Формулировка сохраняет конкретный образ и естественно звучит по-русски.
- source_word: רֹבֵץ
  choice: лежащий
  rationale: Причастие изображает животное, которое лежит или улеглось; нейтральное «лежащий» сохраняет длительный характер еврейской формы.
- source_word: בֵּין
  choice: между
  rationale: Прямое соответствие предлогу; подходит к парной или множественной реалии следующего слова.
- source_word: הַמִּשְׁפְּתָיִם
  choice: овечьими загонами
  rationale: Редкое слово имеет спорное значение. Традиционное понимание как загонов для скота хорошо согласуется с пастушеским образом стиха; неопределённость отражена в сноске.
