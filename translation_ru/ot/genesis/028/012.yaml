  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: ru
  text: 'И приснился ему сон: вот, лестница[a] установлена на земле, а её вершина достигает неба; и вот, ангелы Божьи поднимаются и спускаются по ней[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает средство или конструкцию для подъёма; точный вид лестницы не уточняется.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «на нём», то есть на Иакове; однако в данном контексте наиболее естественно отнести местоимение к лестнице.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: И приснился ему сон
  rationale: Естественно передаёт повествовательную форму и начало описания сна, не добавляя нового содержания.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет повторяющийся в еврейском тексте указательный оборот, который делает видение живым и непосредственным.
- source_word: סֻלָּם
  choice: лестница
  rationale: Русское слово естественно обозначает средство подъёма, не вынуждая выбирать между узкой приставной лестницей и более широкой лестничной конструкцией; неопределённость исходного слова отмечена в сноске.
- source_word: מֻצָּב אַרְצָה
  choice: поставлена на земле
  rationale: Передаёт состояние конструкции, установленной с опорой на землю, и сохраняет противопоставление земли и неба.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: а её вершина достигает неба
  rationale: «Вершина» естественно передаёт переносное значение «головы» предмета, а настоящее время сохраняет зримую сцену сна.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: ангелы Божьи
  rationale: В контексте видения имеются в виду небесные посланники; традиционное и понятное выражение сохраняет связь с Богом.
- source_word: עֹלִים וְיֹרְדִים
  choice: поднимаются и спускаются
  rationale: Настоящее время передаёт длительное, наблюдаемое во сне движение.
- source_word: בּוֹ
  choice: по ней
  rationale: Наиболее естественный ближайший референт — лестница; предлог «по» идиоматично описывает движение вдоль неё. Возможное отнесение местоимения к Иакову сохранено в сноске.
theological_decisions:
- issue: Образ, обозначенный словом סֻלָּם
  choice: лестница
  alternative: лестничный подъём; приставная лестница
  rationale: Еврейское слово встречается редко и не уточняет устройство конструкции. Нейтральное русское «лестница» сохраняет образ средства подъёма без чрезмерной конкретизации.
- issue: Референт местоимения בּוֹ
  choice: по ней, то есть по лестнице
  alternative: по нему, то есть по Иакову
  rationale: Ближайшим и наиболее естественным референтом в контексте является лестница, однако грамматика еврейского текста допускает отнесение местоимения к лицу мужского рода; эта неоднозначность отмечена, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «и вот» сохранён ради композиции и выразительности оригинала; устаревшие формы и конфессионально окрашенные уточнения не вводятся.
