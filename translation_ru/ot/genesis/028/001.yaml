base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ru
  text: 'Тогда Исаак позвал Иакова, благословил его и повелел ему: «Не бери себе жену из дочерей Ханаана[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть из хананеянок; буквально: «из дочерей Ханаана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: Глагол קרא с אֶל при обозначении лица означает «позвать, призвать». «Позвал» естественно звучит в современной повествовательной речи и не придаёт сцене излишней официальности.
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: ברך — обычный древнееврейский глагол со значением «благословлять»; контекст не требует поясняющего расширения.
- source_word: וַיְצַוֵּהוּ
  choice: повелел ему
  rationale: צוה выражает властное распоряжение. «Повелел» сохраняет силу отцовского предписания и при этом уместно в литературном библейском повествовании.
- source_word: וַיֹּאמֶר לוֹ
  choice: двоеточие перед прямой речью
  rationale: Буквальное «и сказал ему» после «повелел ему» в русском звучало бы тяжеловесно. Двоеточие естественно вводит содержание повеления, не утрачивая функции древнееврейской формулы.
- source_word: לֹא תִקַּח
  choice: не бери
  rationale: Отрицание לֹא с данной глагольной формой в контексте повеления передаёт прямой запрет. Русский императив «не бери» ясно и естественно сохраняет эту силу.
- source_word: אִשָּׁה
  choice: себе жену
  rationale: В брачном контексте אִשָּׁה означает «жена». Добавление возвратного местоимения «себе» естественно передаёт русское выражение «брать себе жену».
- source_word: מִבְּנוֹת כְּנָעַן
  choice: из дочерей Ханаана
  rationale: Сохранён образный древнееврейский оборот «дочери Ханаана», обозначающий женщин из ханаанского населения; его смысл пояснён в сноске.
- source_word: וַ
  choice: тогда
  rationale: Начальный повествовательный союз передаёт последовательность событий; «тогда» естественно связывает стих с предшествующим рассказом.
