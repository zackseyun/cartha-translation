  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: ru
  text: И увидел Исав, что дочери Ханаана неугодны Исааку, его отцу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «плохи (или: злы) в глазах Исаака, его отца». Здесь, вероятно, имеется в виду, что Исаак считал ханаанских женщин неподходящими жёнами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: И увидел
  rationale: Обычное значение глагола ראה сохранено; форма с וַ продвигает повествование. Контекст позволяет понять это также как осознание, но перевод не подменяет восприятие истолкованием.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что увидел и понял Исав, а не причину.
- source_word: רָעוֹת
  choice: неугодны
  rationale: Прилагательное буквально означает «плохи/злы», однако в сочетании с בְּעֵינֵי здесь выражает отрицательную оценку ханаанских женщин как брачных партнёров. «Неугодны» естественно передаёт этот смысл, не приписывая самим женщинам однозначную нравственную порочность.
- source_word: בְּנוֹת כְּנָעַן
  choice: дочери Ханаана
  rationale: Сохраняется образное этногеографическое выражение еврейского текста; в контексте речь идёт о ханаанских женщинах.
- source_word: בְּעֵינֵי
  choice: неугодны
  rationale: Еврейская идиома «плохи в глазах» передана естественным русским оценочным выражением. Буквальная образность отражена в сноске как допустимая альтернатива.
- source_word: יִצְחָק אָבִיו
  choice: Исааку, его отцу
  rationale: Сохранён порядок исходного текста, а приложение оформлено по нормам современного русского языка.
theological_decisions:
- issue: Характер отрицательной оценки дочерей Ханаана
  choice: неугодны Исааку
  alternative: плохи/злы в глазах Исаака
  rationale: Текст прямо сообщает оценку Исаака, но не уточняет, является ли она исчерпывающим нравственным суждением о женщинах. Перевод сохраняет отрицательность, не усиливая её до недвусмысленного обвинения в зле.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Основной текст передаёт еврейскую идиому естественно, а буквальная форма и лексическая неоднозначность רָעוֹת сохранены в сноске.
