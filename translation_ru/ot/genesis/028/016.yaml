  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: ru
  text: 'Иаков пробудился ото сна и сказал: «Воистину, Яхве в этом месте, а я не знал этого!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: пробудился
  rationale: Глагол означает пробуждение ото сна; «пробудился» естественно звучит в современном литературном повествовании.
- source_word: מִשְּׁנָתוֹ
  choice: ото сна
  rationale: Прямое и идиоматичное соответствие еврейскому выражению «от своего сна».
- source_word: אָכֵן
  choice: воистину
  rationale: Частица передаёт внезапное, уверенное осознание; «воистину» сохраняет эмфатическую силу и достоинство речи.
- source_word: יֵשׁ
  choice: пребывает
  rationale: Экзистенциальная частица здесь утверждает присутствие Яхве. «Пребывает» естественно выражает присутствие в данном месте, не сводя смысл к простому глаголу-связке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: на этом месте
  rationale: Нормальная русская формулировка для конкретного места, где находился Иаков.
- source_word: וְאָנֹכִי
  choice: а я
  rationale: Самостоятельное местоимение подчёркивает противопоставление присутствия Яхве прежнему неведению Иакова; союз «а» естественно передаёт этот контраст.
- source_word: לֹא יָדָעְתִּי
  choice: и не знал
  rationale: Совершенный вид указывает на прежнее незнание; частица «и» идиоматично усиливает признание неожиданности в русском языке.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя, поэтому транслитерация сохраняет прямое именование и не подменяет его титулом.
- issue: Характер присутствия Яхве в данном месте
  choice: пребывает на этом месте
  alternative: есть на этом месте
  rationale: Перевод утверждает осознанное Иаковом присутствие Бога, но не поясняет его природу и тем самым не привносит дополнительной богословской схемы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Восклицательный знак передаёт внезапность и силу осознания, выраженные частицей אָכֵן и контекстом пробуждения.
