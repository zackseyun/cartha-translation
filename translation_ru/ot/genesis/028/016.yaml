  source_fidelity: 'В целом смысл передан верно: Иаков пробуждается, признаёт присутствие Яхве и своё прежнее незнание. Однако «пребывает» добавляет оттенок продолжительного/особого пребывания, которого экзистенциальная частица יֵשׁ сама по себе не требует. «На этом месте» несколько легче вызывает значение конкретной площадки или святыни, тогда как בַּמָּקוֹם הַזֶּה означает «в этом месте».'
