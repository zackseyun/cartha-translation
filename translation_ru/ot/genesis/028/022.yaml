base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: ru
  text: И этот камень, который я поставил как столб, будет домом Бога; и из всего, что Ты дашь мне, я непременно отдам Тебе десятую часть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצֵּבָה
  choice: памятный столб
  rationale: Слово обозначает вертикально установленный камень-монумент или священный знак. «Памятный столб» естественно по-русски передаёт конкретный образ, не называя его позднейшим культовым сооружением.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: будет домом Бога
  rationale: Конструкция буквально означает «будет домом Бога». Творительный падеж после «будет» звучит естественно и сохраняет утверждение текста без уточнения, каким именно образом камень связан с Божьим домом.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В контексте обета Иакова речь идёт о Боге, явившемся ему ранее, а не о неопределённом божестве.
- source_word: תִּתֶּן לִי
  choice: Ты дашь мне
  rationale: Прямо передаёт обращение Иакова к Богу и значение имперфекта в контексте обета.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: я непременно отдам ... десятую часть
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает обещание. «Непременно отдам десятую часть» ясно передаёт и усиление, и содержание действия без привнесения поздней институциональной терминологии.
- source_word: לָךְ
  choice: Тебе
  rationale: Дательный падеж прямо обозначает Бога как получателя обещанной десятой части.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: этот камень, который я поставил
  rationale: Сохраняет указание на конкретный камень и естественно описывает его установку в вертикальном положении.
theological_decisions:
- issue: Значение слов о камне как доме Бога
  choice: Сохранено прямое выражение «будет домом Бога» без дальнейшего толкования.
  alternative: «станет святилищем» или прямое указание на будущий храм
  rationale: Еврейский текст связывает поставленный камень с «домом Бога», но не разъясняет точную природу этой связи. Перевод сохраняет эту напряжённость и не вносит позднейшую храмовую концепцию.
- issue: Обещание десятой части
  choice: Передано как личный обет непременно отдать Богу десятую часть всего полученного.
  alternative: Использовать институционально окрашенное слово «десятина» или представить это как установленное предписание
  rationale: Текст описывает обет Иакова, а не формулирует здесь общий закон. Выражение «десятая часть» сохраняет содержание обещания без наложения более поздних установлений.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для библейского обета. Местоимения «Ты» и «Тебе» написаны с прописной буквы как уважительное прямое обращение к Богу. Формулировка остаётся понятной обычному читателю и близкой к структуре древнееврейского текста.
