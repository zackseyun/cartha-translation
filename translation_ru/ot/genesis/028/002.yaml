  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: ru
  text: Встань, пойди в Паддан-Арам, в дом Вафуила, отца твоей матери, и возьми себе оттуда жену из числа дочерей Лавана, брата твоей матери.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «твоего деда по матери» и «твоего дяди». В основном тексте еврейские обозначения родства переданы более буквально.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Встань
  rationale: Императив קום передаёт прямое повеление подняться и отправиться; «встань» естественно и сохраняет последовательность двух повелений.
- source_word: לֵךְ֙
  choice: пойди
  rationale: Обычное значение императива הלך — «иди/пойди»; совершенный вид уместен в русском повелении, обозначающем предстоящее отправление.
- source_word: פַּדֶּנָֽה אֲרָם
  choice: в Паддан-Арам
  rationale: Географическое название передано традиционной транслитерацией; направительный суффикс выражен предлогом «в».
- source_word: בֵּיתָה בְתוּאֵל
  choice: в дом Вафуила
  rationale: Сохраняется образ дома как места назначения и семейного дома; направительное значение выражено конструкцией «в дом».
- source_word: אֲבִי אִמֶּךָ
  choice: отца твоей матери
  rationale: Буквально передаёт еврейское обозначение родства, не заменяя его более кратким словом «дед».
- source_word: וְקַח לְךָ
  choice: и возьми себе
  rationale: «Возьми» передаёт לקח, а «себе» сохраняет значение личной заинтересованности, выраженное לְךָ.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Явно сохраняет исходное значение предлога מִן и указательного наречия.
- source_word: אִשָּׁה
  choice: жену
  rationale: В контексте выбора брачной пары אִשָּׁה означает именно жену, а не женщину вообще.
- source_word: מִבְּנוֹת לָבָן
  choice: из дочерей Лавана
  rationale: 'Сохраняет разделительное значение מִן: жена должна быть выбрана из числа дочерей Лавана.'
- source_word: אֲחִי אִמֶּךָ
  choice: брата твоей матери
  rationale: Буквально сохраняет еврейское выражение родства вместо более привычного русского «твоего дяди».
