base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: ru
  text: Исаак отпустил Иакова, и тот отправился в Паддан-Арам к Лавану, сыну Вафуила, арамеянина, брату Ревекки, матери Иакова и Исава.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: отпустил
  rationale: В данном контексте שׁלח означает послать или отпустить человека в путь; «отпустил» естественно передаёт отправление Иакова и не добавляет идеи изгнания.
- source_word: וַיֵּלֶךְ
  choice: и тот отправился
  rationale: הלך — обычный глагол движения «идти»; «отправился» естественно звучит в рассказе о дальнем пути, а «тот» ясно обозначает Иакова.
- source_word: פַּדֶּנָה אֲרָם
  choice: в Паддан-Арам
  rationale: Географическое название передано транслитерацией; направительный суффикс выражен предлогом «в».
- source_word: בֶּן בְּתוּאֵל
  choice: сыну Вафуила
  rationale: Стандартная передача древнееврейской конструкции родства с учётом падежа после «к».
- source_word: הָאֲרַמִּי
  choice: арамейца
  rationale: Слово точно обозначает арамейца; это исторически и этнически точнее традиционного «сирийца».
- source_word: אֲחִי רִבְקָה
  choice: брату Ревекки
  rationale: Естественная русская передача конструкции принадлежности, сохраняющая приложение к Лавану.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: матери Иакова и Исава
  rationale: Сохраняет данное в еврейском тексте пояснение о Ревекке без сокращения.
