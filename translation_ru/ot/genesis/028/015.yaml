base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: ru
  text: И вот, Я с тобой; Я буду хранить тебя[a], куда бы ты ни пошёл, и возвращу тебя в эту землю. Я не оставлю тебя[b], пока не сделаю всё, что Я сказал тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду оберегать тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не покину тебя».'
    reason: lexical_alternative
  - marker: c
    text: 'Или, по смыслу: «пока не исполню обещанного тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет функцию указательной частицы, придающей Божьим словам живость и особую выразительность, но звучит естественно в современном литературном русском.
- source_word: אָנֹכִי עִמָּךְ
  choice: Я с тобой
  rationale: Прямо передаёт обещание личного присутствия; отдельное местоимение אָנֹכִי естественно выражено русским «Я».
- source_word: וּשְׁמַרְתִּיךָ
  choice: Я буду хранить тебя
  rationale: Глагол שׁמר охватывает значения «хранить», «охранять», «оберегать». Выбрано ёмкое библейское выражение, понятное современному читателю.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: куда бы ты ни пошёл
  rationale: Естественно передаёт распространение Божьей охраны на всякое место, куда направится Иаков.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: возвращу тебя
  rationale: Каузативная форма глагола שוב означает, что Бог возвратит Иакова; русское выражение точно и не требует тяжеловесного «сделаю так, что ты вернёшься».
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: в эту землю
  rationale: В данном контексте אֲדָמָה обозначает не просто почву, а конкретную землю, на которой находится Иаков и с которой связано обещание.
- source_word: כִּי
  choice: Я не оставлю тебя
  rationale: В русском разделение на предложения позволяет естественно передать заверяющую связь כִּי без обязательного отдельного союза; второе предложение обосновывает предшествующие обещания.
- source_word: לֹא אֶעֱזָבְךָ
  choice: не оставлю тебя
  rationale: Передаёт широкое значение עזב без стилистически более архаичного «не покину» и без усиления до «не брошу».
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: пока не исполню
  rationale: Еврейское сочетание указывает на завершение обещанного действия в будущем. «Исполню» естественно связывает действие Бога с Его предшествующими словами.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: сказанного тебе
  rationale: Сохраняет прямое значение דבר «говорить», не заменяя его в основном тексте более узким «обещать»; глагол «исполню» делает русскую фразу естественной.
theological_decisions:
- issue: Божье присутствие, охрана и верность слову
  choice: Передать обещания прямо, не усиливая их позднейшей богословской терминологией.
  alternative: Использовать «не покину», «буду оберегать» или прямо назвать сказанное «обещанием».
  rationale: Текст соединяет личное присутствие Бога, охрану Иакова, его возвращение и исполнение сказанного. Перевод сохраняет эти аспекты, не сужая их конфессиональным толкованием.
- issue: Значение временного оборота «пока не»
  choice: Сохранить форму «пока не исполню», как в исходном тексте.
  alternative: Перефразировать так, чтобы явно исключить возможность оставления Иакова после исполнения сказанного.
  rationale: Исходная формулировка обозначает гарантированный срок исполнения, но сама по себе не утверждает последующего оставления. Перевод сохраняет эту языковую напряжённость и не добавляет отсутствующего пояснения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, достойным повествования регистром. Короткие предложения сохраняют торжественность Божьей речи и делают её понятной. Заглавное «Я» употреблено по принятой русской библейской традиции при прямой речи Бога.
