  yaml_path: translation/ot/genesis/028/007.yaml
  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: ru
  text: и что Иаков послушал своего отца и свою мать[a] и пошёл в Паддан-Арам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повиновался своему отцу и своей матери». Еврейский глагол в этом контексте может означать как слушание, так и следование услышанному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: послушал
  rationale: Глагол שׁמע с предлогом אֶל здесь означает не просто услышать, а прислушаться и последовать наставлению. Русское «послушал» естественно сохраняет оттенки слушания и повиновения.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: своего отца и свою мать
  rationale: Повтор предлога и притяжательных суффиксов передан естественной русской конструкцией; местоимение «свой» ясно соотносит обоих родителей с Иаковом.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное и прямое соответствие глаголу הלך в повествовательном контексте.
- source_word: פַּדֶּנָה אֲרָם
  choice: в Паддан-Арам
  rationale: Топоним транслитерирован, а направительный суффикс ה передан предлогом «в» при глаголе движения.
- source_word: וַ
  choice: и
  rationale: Союз сохраняет связь этого синтаксически зависимого стиха с предшествующим контекстом.
