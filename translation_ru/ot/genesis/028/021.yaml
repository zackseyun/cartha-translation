source:
  edition: WLC
  text: וְ/שַׁבְתִּ֥י בְ/שָׁל֖וֹם אֶל בֵּ֣ית אָבִ֑/י וְ/הָיָ֧ה יְהוָ֛ה לִ֖/י לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: ru
  text: и я вернусь с миром в дом моего отца[a], и Яхве будет моим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я благополучно вернусь в дом моего отца». Выражение «с миром» может подчёркивать безопасное возвращение и благополучие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: и я вернусь
  rationale: Форма от שׁוב означает возвращение; в продолжающемся условном высказывании Иакова русское будущее время естественно передаёт направленное в будущее условие.
- source_word: בְשָׁלוֹם
  choice: с миром
  rationale: 'Сохраняет широкий смысл שָׁלוֹם: мир, благополучие, целость и безопасность; более узкое «благополучно» вынесено в примечание как возможная передача.'
- source_word: אֶל בֵּית אָבִי
  choice: в дом моего отца
  rationale: Естественно передаёт конструкцию со значением отцовского дома и семейного очага, не сужая её до более отвлечённого «родного дома».
- source_word: וְהָיָה
  choice: и ... будет
  rationale: Прямо передаёт союз וְ и форму глагола היה, сохраняя связь с условной последовательностью предыдущих стихов без добавления отсутствующего отдельного слова «тогда».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לִי לֵאלֹהִים
  choice: моим Богом
  rationale: Идиоматически передаёт буквальное «будет мне Богом», сохраняя смысл личных отношений и верности.
theological_decisions:
- issue: Следует ли понимать слова Иакова как условное принятие Яхве своим Богом или как безусловное исповедание
  choice: Сохранена форма «и Яхве будет моим Богом» внутри продолжающейся условной последовательности обета.
  alternative: «тогда Яхве будет моим Богом» либо безусловное исповедание, отделённое от условия
  rationale: Еврейский текст допускает результативное понимание в составе условия, но употребляет обычный союз «и». Перевод сохраняет эту богословскую напряжённость, не усиливая и не ослабляя условность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «с миром» сохранён ради смысловой полноты еврейского שָׁלוֹם; возможное значение безопасности разъяснено в сноске.
