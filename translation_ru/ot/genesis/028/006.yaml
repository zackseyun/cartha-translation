  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ru
  text: 'Исав увидел, что Исаак благословил Иакова и послал его в Паддан-Арам взять себе оттуда жену и что, когда Исаак благословлял его, он повелел ему: «Не бери жену из дочерей Ханаана[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из хананеянок». Буквально: «из дочерей Ханаана».'
    reason: Лексическая альтернатива поясняет, что выражение относится к женщинам хананейского народа или земли, не устраняя образность еврейского текста.
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: Исав увидел
  rationale: Форма wayyiqtol продолжает повествование; в современном русском последовательность естественно передаётся без обязательного начального союза «и».
- source_word: כִּי בֵרַךְ יִצְחָק אֶת יַעֲקֹב
  choice: что Исаак благословил Иакова
  rationale: Перфект обозначает действие, уже совершившееся к тому времени, когда Исав это увидел; русская форма прошедшего времени передаёт соотношение времён без дополнительной конструкции.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: и послал его в Паддан-Арам
  rationale: Сохранена координация действий Исаака и направление движения, выраженное локативным окончанием.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: взять себе оттуда жену
  rationale: Сохранены цель посылки, возвратный оттенок לוֹ и указание на место, откуда следовало взять жену.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: благословляя его
  rationale: Деепричастная конструкция естественно передаёт обстоятельственное значение בְּ и одновременность повеления с благословением.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: повелел ему
  rationale: צוה имеет значение властного предписания. Отдельное «сказав» опущено как неестественное для русского перед прямой речью; двоеточие выполняет функцию еврейской формулы введения речи.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Не бери жену
  rationale: Отрицание с имперфектом здесь выражает запрет; русский отрицательный императив ясно и естественно передаёт его силу.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: из дочерей Ханаана
  rationale: Сохранён буквальный и понятный семитский оборот; более разъясняющий вариант вынесен в сноску.
