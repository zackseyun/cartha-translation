  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: ru
  text: И будет твоё потомство как прах земли, и ты распространишься к западу и к востоку, к северу и к югу; и в тебе и в твоём потомстве благословятся все роды земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тебе и в твоём потомстве все роды земли будут благословлять себя». Еврейский глагол можно понимать также в возвратном или среднем значении.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: и будет
  rationale: Перфект с союзом в контексте обещания имеет будущее значение; формула «и будет» естественна для возвышенного повествования.
- source_word: זַרְעֲךָ / וּבְזַרְעֶךָ
  choice: твоё потомство / в твоём потомстве
  rationale: «Потомство» сохраняет собирательное единственное число זֶרַע и не сужает значение до отдельных потомков.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: как прах земли
  rationale: «Прах» передаёт עָפָר в традиционно понятной и достоинственной форме; образ указывает на неисчислимое множество.
- source_word: וּפָרַצְתָּ
  choice: и распространишься ты
  rationale: Глагол обозначает прорыв и расширение; «распространишься» естественно передаёт географическое разрастание, сохраняя энергичность образа.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: к западу и к востоку, к северу и к югу
  rationale: Направительные формы переданы оборотами с «к»; נֶגְבָּה в ряду сторон света означает «к югу».
- source_word: וְנִבְרֲכוּ
  choice: благословятся
  rationale: 'Русская возвратная форма позволяет сохранить формальную неоднозначность нифаля: она может восприниматься как пассивная («получат благословение») и допускает рефлексивное понимание, уточнённое в сноске.'
- source_word: בְךָ / וּבְזַרְעֶךָ
  choice: в тебе / в твоём потомстве
  rationale: Предлог ב передан буквально как «в», чтобы сохранить формулу обещания и не навязывать более истолковывающее «через».
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: все племена земли
  rationale: מִשְׁפָּחוֹת обозначает родовые и семейные группы; «племена» в данном универсальном контексте звучит естественнее, чем буквальное «семьи», а «земли» передаёт всеобщий охват.
theological_decisions:
- issue: Значение нифаля ברך в формуле патриархального обещания
  choice: '«благословятся» — преимущественно пассивное понимание: получат благословение'
  alternative: '«будут благословлять себя»: станут призывать благословение, ссылаясь на Иакова и его потомство'
  rationale: Нифаль допускает пассивное и рефлексивно-среднее понимание. Основной текст сохраняет традиционное пассивное прочтение, а сноска удерживает реальную грамматическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок сторон света и повтор предлога «в» сохранены. Маркер сноски поставлен при предложении о благословении, к которому относится вариант прочтения.
