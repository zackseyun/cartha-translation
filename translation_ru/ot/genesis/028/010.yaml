lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא обозначает выход или уход из места; «вышел из» прямо передаёт еврейскую конструкцию и естественно звучит по-русски.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: מִבְּאֵר שָׁבַע
  choice: из Вирсавии
  rationale: Предлог מִן указывает на исходный пункт, а «Вирсавия» — устоявшаяся русская форма топонима בְּאֵר שֶׁבַע.
- source_word: וַיֵּלֶךְ
  choice: направился
  rationale: הלך — обычный глагол движения. В данном сочетании «направился» естественно передаёт движение к названному месту, не добавляя способа передвижения.
- source_word: חָרָנָה
  choice: в Харран
  rationale: Направительное окончание -ָה указывает на движение к Харрану; по-русски это естественно выражается конструкцией «направился в Харран».
