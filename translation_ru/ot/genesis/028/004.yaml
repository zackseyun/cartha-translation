base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: ru
  text: Пусть он даст тебе благословение Авраама — тебе и твоему потомству вместе с тобой[a] —, чтобы ты овладел землёй, где живёшь как пришелец[b] и которую Бог дал Аврааму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тебе и семени твоему вместе с тобой»; еврейское слово стоит в единственном числе, но имеет собирательное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «чтобы ты унаследовал землю, где живёшь как пришелец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Пусть он даст
  rationale: Юссив в контексте благословения передан как пожелание. Начальное וְ продолжает предшествующую речь, но отдельный русский стих естественнее начинается без формального «и».
- source_word: בִּרְכַּת אַבְרָהָם
  choice: благословение Авраама
  rationale: Прозрачно передаёт конструкцию сопряжённого состояния и сохраняет прямую связь с обетованием Аврааму.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: тебе и твоему потомству вместе с тобой
  rationale: Сохраняет повтор «тебе», собирательное значение זֶרַע и необычное, но значимое אִתָּךְ «с тобой», не сглаживая его.
- source_word: לְרִשְׁתְּךָ
  choice: чтобы ты овладел
  rationale: Инфинитив с לְ выражает цель или результат; глагол ירש здесь естественно означает вступить во владение землёй. Возможный оттенок наследования отмечен в примечании.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: землёй, где живёшь как пришелец
  rationale: Естественная современная формулировка сохраняет смысл проживания человека, не имеющего постоянного права на землю; она точнее, чем «земля странствий», которое может подразумевать постоянное передвижение.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: которую Бог дал Аврааму
  rationale: Прямо передаёт относительное придаточное и сохраняет употреблённое здесь обозначение Бога — אֱלֹהִים.
theological_decisions:
- issue: Связь благословения Иакова с обетованием Аврааму
  choice: Сохранить буквальное выражение «благословение Авраама» и речь об овладении землёй.
  alternative: «Благословение, обещанное Аврааму»; «чтобы ты унаследовал землю».
  rationale: Исходная формулировка непосредственно связывает благословение Иакова с Авраамом, не сводя его к общему благополучию. «Овладел» передаёт основной смысл ירש, а возможный оттенок наследования не исключается и указан в примечании.
- issue: Собирательное и формально единственное זֶרַע
  choice: Перевести как «потомство», сохранив собирательность.
  alternative: «Семя» или «потомки».
  rationale: «Потомство» понятно современному читателю, остаётся собирательным существительным и не заставляет решать сверх текста вопрос о числе отдельных потомков.
translation_notes:
  register: 'Современный литературный русский язык с достоинством благословительной речи, но без архаизмов вроде «да даст» и «семя твоё». Местоимение «он» не капитализировано: такая капитализация является конфессионально-типографической нормой, а не требованием еврейского текста. Парные тире помогают читателю увидеть присоединительное уточнение «тебе и твоему потомству вместе с тобой».'
