  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: ru
  text: И назвал он то место Вефилем[a], а прежде город назывался Луз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вефиль означает «дом Бога».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: назвал
  rationale: Еврейское сочетание буквально означает «назвал имя», но в современном русском естественно передаётся одним глаголом «назвал».
- source_word: הַמָּקוֹם הַהוּא
  choice: то место
  rationale: Передаёт существительное «место» и указательное значение определения.
- source_word: בֵּית אֵל
  choice: Вефилем
  rationale: Употреблена традиционная русская форма географического названия; творительный падеж обусловлен русской конструкцией «назвал ... Вефилем». Значение имени пояснено в сноске.
- source_word: וְאוּלָם
  choice: а
  rationale: Частица вводит контрастирующее уточнение; союз «а» естественно выражает его по-русски без излишнего усиления.
- source_word: לוּז
  choice: Луз
  rationale: Географическое имя передано принятой русской транслитерацией.
- source_word: שֵׁם הָעִיר לָרִאשֹׁנָה
  choice: прежде город назывался
  rationale: Естественная русская передача буквального «прежде имя города [было]» с сохранением временного значения לָרִאשֹׁנָה.
