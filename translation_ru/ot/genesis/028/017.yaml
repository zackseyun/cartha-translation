base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: ru
  text: 'Он испугался и сказал: «Как внушает трепет это место![a] Это не что иное, как дом Бога, и это — врата небес[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как страшно это место!» Еврейское слово может выражать страх, ужас или благоговейный трепет.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское: «врата небес». Слово, переданное как «небес», имеет форму множественного числа и здесь обозначает небесную, Божью сферу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: охватил его страх
  rationale: Передаёт повествовательную форму от ירא как непосредственную реакцию Иакова и звучит естественно и торжественно по-русски.
- source_word: מַה נּוֹרָא
  choice: Как страшно
  rationale: Сохраняет общий корень и смысловую связь с предшествующим страхом, а также напряжение между ужасом и благоговейным трепетом; возможная двусмысленность пояснена в сноске.
- source_word: הַמָּקוֹם הַזֶּה
  choice: это место
  rationale: Прямой и естественный перевод указательной конструкции.
- source_word: אֵין זֶה כִּי אִם
  choice: Это не что иное, как
  rationale: Передаёт усиленное ограничительное отождествление в торжественном, но современном русском регистре.
- source_word: בֵּית אֱלֹהִים
  choice: дом Бога
  rationale: Прозрачно передаёт сопряжённую конструкцию, не предполагая, что здесь уже существовало святилище.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: врата небес
  rationale: Сохраняет множественное число еврейского שָׁמַיִם и возвышенный образ входа в небесную сферу.
theological_decisions:
- issue: Значение אֱלֹהִים при единственном референте
  choice: Бога
  alternative: богов
  rationale: В контексте видения и заветного обещания слово обозначает единого Бога Иакова, несмотря на морфологическую форму множественного числа.
- issue: Оттенок נוֹרָא в контексте Божьего присутствия
  choice: страшно
  alternative: внушает благоговейный трепет
  rationale: Русское «страшно» сохраняет связь со страхом Иакова и не устраняет напряжение между ужасом и благоговением; сноска раскрывает более широкий диапазон значения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Повтор «страх — страшно» намеренно отражает однокоренные еврейские формы ירא и נורא; «врата» поддерживает торжественный образ, не делая синтаксис архаичным.
