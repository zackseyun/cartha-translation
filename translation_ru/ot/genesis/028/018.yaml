base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: ru
  text: Иаков встал рано утром, взял камень, который положил у изголовья, воздвиг его как каменный столб[a] и возлил масло на его вершину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздвиг его как вертикально поставленный камень».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на его голову».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יַעֲקֹב בַּבֹּקֶר
  choice: Иаков встал рано утром
  rationale: Глагол обозначает ранний подъём; сочетание «встал рано утром» естественно для современного русского языка и сохраняет временной акцент.
- source_word: הָאֶבֶן
  choice: камень
  rationale: Определённое существительное в единственном числе; контекст однозначно отсылает к камню предыдущего стиха.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: который положил у изголовья
  rationale: «У изголовья» передаёт пространственное значение מְרַאֲשֹׁתָיו, не уточняя вопреки тексту, что камень непременно находился прямо под головой.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: поставил его как каменный столб
  rationale: Передаёт и действие установки, и превращение камня в стоящий памятный/культовый объект; слово «каменный» помогает избежать образа архитектурной колонны.
- source_word: מַצֵּבָה
  choice: каменный столб
  rationale: מַצֵּבָה обозначает вертикально поставленный камень или столб. Основной вариант понятен современному читателю, а более буквальная предметная формулировка дана в сноске.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: возлил масло
  rationale: Текст прямо говорит о выливании масла. «Возлил» сохраняет торжественный библейский регистр, не заменяя действие истолковывающим «помазал».
- source_word: עַל רֹאשָׁהּ
  choice: на его вершину
  rationale: Буквально «на его голову»; применительно к поставленному камню естественное русское соответствие — «на его вершину».
theological_decisions:
- issue: Возможное культовое значение מַצֵּבָה и возлияния масла
  choice: Описать действия Иакова без дополнительной положительной или отрицательной оценки
  alternative: Передать как «памятный камень» или истолковать действие словом «помазал»
  rationale: Повествование сообщает об установке камня и возлиянии масла, но само по себе не формулирует здесь ни позднейшей полемики против подобных столбов, ни специального богословского объяснения обряда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Цепочка действий передана без повторяющихся союзов, чтобы сохранить быстрый ход еврейского повествования. Все маркеры сносок размещены непосредственно после соответствующих выражений.
