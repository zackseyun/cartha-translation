base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: ru
  text: Он пришёл к одному месту[a] и остался там на ночь, потому что солнце зашло. Он взял один из камней того места[b], положил его себе под голову[c] и лёг на том месте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к месту» или «на месте». При первом упоминании по-русски естественнее «к одному месту», однако определённая форма в еврейском тексте может подчёркивать особое значение этого места в дальнейшем повествовании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «взял несколько камней того места». Еврейское выражение допускает как партитивное понимание «один из камней», так и указание на неопределённое число камней; дальнейшее повествование обычно понимают как речь об одном камне.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «положил у своего изголовья». Еврейское слово обозначает место у головы или изголовье и не обязательно уточняет, находился ли камень непосредственно под головой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: пришёл на одно место
  rationale: В контексте пути פגע с предлогом ב обозначает достижение места. «Пришёл» естественно передаёт движение, не добавляя оттенка случайности, а «одно место» сохраняет первое упоминание при повествовательной значимости места.
- source_word: וַיָּלֶן שָׁם
  choice: остался там на ночь
  rationale: Глагол לון означает провести ночь или остановиться на ночлег; выбранное выражение естественно для современного русского повествования.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: потому что солнце уже зашло
  rationale: Сочетание בוא с «солнцем» идиоматически означает закат; «уже» ясно передаёт предшествование заката решению заночевать.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: взял один из камней, лежавших на том месте
  rationale: Предлог מִן при множественном числе допускает партитивное понимание «один из камней». Добавленное «лежавших» естественно связывает камни с местом и не меняет предметного смысла.
- source_word: מְרַאֲשֹׁתָיו
  choice: себе под голову
  rationale: Слово обозначает место у головы или изголовье. По контексту камень служит опорой для головы; русский оборот естественен, а более буквальная возможность отмечена в сноске.
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  choice: лёг на том месте
  rationale: «Лёг» передаёт действие שכб, не заменяя его последующим сном. Повтор слова «место» сохраняет акцент еврейского повествования на значимости места.
