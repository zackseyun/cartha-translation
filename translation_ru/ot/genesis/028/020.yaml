  naturalness: «Хлеб для еды» и «одежду, чтобы одеться» понятны, но тяжеловесны и неестественны для современного литературного русского. «Хлеб для пропитания и одежду, чтобы одеваться» сохраняет целевое значение инфинитивов и звучит лучше.
