  text: וַ/יִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵ/אמֹ֑ר אִם יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗/י וּ/שְׁמָרַ֨/נִי֙ בַּ/דֶּ֤רֶךְ הַ/זֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְ/נָֽתַן לִ֥/י לֶ֛חֶם לֶ/אֱכֹ֖ל וּ/בֶ֥גֶד לִ/לְבֹּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: ru
  text: 'Иаков дал обет, сказав: «Если Бог будет со мной, будет хранить меня на этом пути, по которому я иду,[a] и даст мне хлеб для пропитания и одежду, чтобы одеваться…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет оберегать меня на этом пути, по которому я иду»; «путь» в данном контексте может означать путешествие.'
    reason: Передаёт возможный оттенок защиты у שׁמר и контекстуальное значение דֶּרֶךְ, не заменяя относительное предложение оригинала утверждением о уже совершившемся отправлении.
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: И дал Иаков обет
  rationale: Сочетание глагола נדר с однокоренным существительным נֶדֶר обозначает торжественное принесение обета. Русское «дал обет» естественно передаёт идиому и сохраняет явное существительное.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Деепричастие естественно вводит содержание обета в современном литературном русском.
- source_word: אִם
  choice: если
  rationale: Прямо сохраняет условную форму еврейского текста, не превращая её ни в уверенное «когда», ни в выражение недоверия.
- source_word: אֱלֹהִים עִמָּדִי
  choice: Бог будет со мной
  rationale: Передаёт обещанную Божью близость без добавочного истолкования.
- source_word: וּשְׁמָרַנִי
  choice: сохранит меня
  rationale: Глагол שׁמר здесь выражает охрану и попечение. «Сохранит меня» уместно в торжественном контексте; возможный оттенок постоянного надзора отмечен в сноске.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: в этом пути, которым я иду
  rationale: Сохраняет конкретное «этот путь» и относительное предложение оригинала, оставаясь понятным по-русски; в контексте речь также может идти о путешествии в целом.
- source_word: וְנָתַן לִי לֶחֶם לֶאֱכֹל
  choice: даст мне хлеб для еды
  rationale: Сохраняет буквальный образ хлеба и назначение, выраженное инфинитивом; «хлеб» может шире означать пищу.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: и одежду, чтобы одеться
  rationale: Передаёт существительное в собирательном значении и инфинитив назначения без ненужного расширения.
theological_decisions:
- issue: Условный характер обета Иакова
  choice: «Если Бог будет со мной»
  alternative: «Когда Бог будет со мной» или «Поскольку Бог будет со мной»
  rationale: Частица אִם обычно означает «если». Перевод сохраняет напряжение текста и не решает за читателя, выражает ли Иаков сомнение, условие обета или уверенное ожидание.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сохраняет незавершённое условное предложение, продолжающееся в следующем стихе. Маркер сноски поставлен непосредственно после соответствующего оборота.
