  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: ru
  text: 'И вот, Яхве стоял над ней[a] и сказал: «Я — Яхве, Бог Авраама, твоего отца, и Бог Исаака. Землю, на которой ты лежишь, Я дам тебе и твоему потомству[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом с ним» либо «над ним», если местоимение относится к Иакову, а не к лестнице.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «семени». Еврейское слово имеет собирательное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт функцию внезапного привлечения внимания и живость повествования, оставаясь естественным для современного литературного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: נִצָּב
  choice: стоял
  rationale: Русское прошедшее несовершенного вида естественно передаёт длительное состояние, выраженное еврейским причастием.
- source_word: עָלָיו
  choice: над ней
  rationale: Местоимение отнесено к лестнице из предыдущего стиха; русский род согласован со словом «лестница». Возможная отсылка к Иакову сохранена в сноске.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Бог Авраама, твоего отца
  rationale: Близко передаёт еврейское сочетание и сохраняет патриархальное употребление слова «отец» в отношении предка.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте обещания речь идёт об обещанной земле, а не только о почве непосредственно под Иаковом.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: на которой ты лежишь
  rationale: Естественно передаёт пространственное значение предлога и продолжающееся действие причастия.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: Я дам тебе
  rationale: Имперфект в контексте божественного обещания передан будущим временем.
- source_word: וּלְזַרְעֶךָ
  choice: и твоему потомству
  rationale: «Потомство» естественно по-русски сохраняет собирательное значение единственного числа זֶרַע.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: К чему относится עָלָיו в сцене видения
  choice: над ней — над лестницей
  alternative: рядом с ним или над ним — с Иаковом
  rationale: Ближайший возможный антецедент в контексте — лестница, однако грамматика допускает отнесение местоимения к Иакову, поэтому неоднозначность отмечена в сноске.
- issue: Собирательное значение זֶרַע
  choice: потомство
  alternative: семя; потомки
  rationale: «Потомство» сохраняет собирательное единственное число и не навязывает ни исключительно единичного, ни явно множественного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «Землю… Я дам» сохраняет акцент исходного текста на земле; местоимение «Я» написано с прописной буквы как начало прямой речи, без введения особого конфессионального правила.
