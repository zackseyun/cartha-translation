source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: ru
  text: И пусть Бог Всемогущий[a] благословит тебя, сделает тебя плодовитым и умножит тебя, и ты станешь собранием народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Эль-Шаддай»; традиционный перевод — «Бог Всемогущий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Бог Всемогущий
  rationale: Устоявшийся русский перевод божественного титула; сохраняет оба его элемента и естественно звучит в контексте благословения.
- source_word: יְבָרֵךְ
  choice: пусть благословит
  rationale: 'Имперфект имеет здесь желательное значение: Исаак произносит благословение, а не просто предсказывает будущее.'
- source_word: וְיַפְרְךָ
  choice: сделает тебя плодовитым
  rationale: Передаёт каузативное значение породы hифиль глагола פרה и подразумеваемое умножение потомства.
- source_word: וְיַרְבֶּךָ
  choice: умножит тебя
  rationale: Сохраняет каузативный смысл и характерный для патриархальных благословений образ численного умножения потомков.
- source_word: וְהָיִיתָ
  choice: и ты станешь
  rationale: Сохраняет последовательность благословения и результирующее значение, не превращая его однозначно в формальную цель.
- source_word: לִקְהַל עַמִּים
  choice: собранием народов
  rationale: «Собрание» прямо передаёт קהל, а множественное «народов» сохраняет עמים и мысль о множестве народов, происходящих от адресата.
theological_decisions:
- issue: Передача божественного титула אֵל שַׁדַּי
  choice: Бог Всемогущий
  alternative: Эль-Шаддай
  rationale: Титул переведён, а его еврейская форма сохранена в примечании; это не навязывает спорную этимологию שַׁדַּי.
- issue: Связь וְהָיִיתָ с предшествующими пожеланиями
  choice: и ты станешь
  alternative: чтобы ты стал
  rationale: Союз допускает результирующий оттенок, однако буквальная последовательность «и ты станешь» сохраняет возможную неоднозначность между следствием и целью.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной формой благословения. Повторение «тебя» сохраняет ясность параллельных каузативных глаголов; выражение «собрание народов» удерживает образ оригинала.
