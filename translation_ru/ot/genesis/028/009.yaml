base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: ru
  text: И пошёл Исав к Измаилу и взял себе в жёны Махалафу, дочь Измаила, сына Авраама, сестру Наваиофа, — в дополнение к своим жёнам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помимо своих жён». Еврейское выражение означает, что Махалафа стала ещё одной женой Исава, а не заменила тех, которые у него уже были.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Последовательная повествовательная форма от הלך обозначает следующее действие; простое «пошёл» естественно передаёт ход рассказа.
- source_word: אֶל יִשְׁמָעֵאל
  choice: к Измаилу
  rationale: Предлог אֶל при глаголе движения указывает на движение к лицу; форма «к Измаилу» естественна по-русски.
- source_word: וַיִּקַּח ... לוֹ לְאִשָּׁה
  choice: взял себе в жёны
  rationale: Сохраняет образ еврейского לקח («взял»), а выражение לוֹ לְאִשָּׁה ясно указывает на заключение брака; русская идиома звучит естественно и передаёт значение לוֹ.
- source_word: מָחֲלַת
  choice: Махалафу
  rationale: Использована укоренившаяся русская форма имени «Махалафа» с необходимым винительным падежом.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: дочь Измаила, сына Авраама
  rationale: Точно передаёт родословную цепочку и при помощи приложения ясно показывает, что сыном Авраама назван Измаил.
- source_word: אֲחוֹת נְבָיוֹת
  choice: сестру Наваиофа
  rationale: Прямо передаёт дополнительное определение Махалафы; использована традиционная русская форма имени.
- source_word: עַל נָשָׁיו
  choice: в дополнение к своим жёнам
  rationale: 'В данном контексте עַל выражает присоединение: Махалафа стала ещё одной женой Исава, а не заменила прежних.'
