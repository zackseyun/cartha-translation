  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: ru
  text: Они поспешили, и каждый опустил свой мешок на землю, а затем каждый открыл свой мешок.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте слова «каждый… свой мешок» повторены перед обоими действиями, подчёркивая, что каждый из братьев сам опустил и открыл свой мешок.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: они поспешили
  rationale: Форма множественного числа от מהר передаёт быстрое, безотлагательное действие; «поспешили» естественно для современного литературного повествования.
- source_word: וַיּוֹרִדוּ
  choice: опустил
  rationale: Порода хифиль от ירד имеет каузативное значение «заставить спуститься, опустить»; в сочетании с мешком и направлением к земле точнее всего «опустил».
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: каждый ... свой мешок
  rationale: אִישׁ употреблено дистрибутивно и дважды выделяет индивидуальное действие каждого; русское возвратное притяжательное «свой» ясно соотносит мешок с действующим лицом.
- source_word: אַמְתַּחַת
  choice: мешок
  rationale: Слово обозначает мешок или суму для припасов; «мешок» естественно в контексте перевозки зерна и согласуется с повествованием об Иосифе.
- source_word: אָרְצָה
  choice: на землю
  rationale: Направительный суффикс выражает движение к земле; по-русски при глаголе «опустить» естественно сказать «на землю».
- source_word: וַיִּפְתְּחוּ
  choice: открыл
  rationale: פתח прямо означает «открывать»; дополнительная конкретизация вроде «развязал» источником не обусловлена.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением повествовательной краткости. Начальное множественное «они поспешили» следует грамматике еврейского текста, а повтор «каждый» сохраняет его дистрибутивный акцент; «а затем» естественно обозначает последовательность действий.
