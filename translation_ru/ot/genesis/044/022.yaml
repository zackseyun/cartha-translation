base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: ru
  text: 'И мы сказали моему господину: «Юноша не может оставить своего отца; если он оставит отца, тот умрёт».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и он оставит своего отца, и умрёт». В еврейском тексте субъект глагола «умрёт» прямо не назван: грамматически им может быть юноша, однако контекст, особенно стих 31, указывает на отца.'
    reason: Сохранение синтаксической неоднозначности исходного текста и пояснение контекстуального выбора.
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: И мы сказали
  rationale: Последовательная форма глагола אמר продолжает повествование; союз «и» сохраняет связь с предыдущей речью без лишнего истолкования.
- source_word: אֶל אֲדֹנִי
  choice: моему господину
  rationale: Уважительное обращение Иуды к Иосифу. «Господин» естественно передаёт придворную почтительность, не придавая обращению излишне рабского оттенка.
- source_word: לֹא יוּכַל
  choice: не может
  rationale: Глагол יכל выражает способность или возможность; краткое «не может» точно и естественно передаёт смысл.
- source_word: הַנַּעַר
  choice: юноша
  rationale: נער может обозначать мальчика, юношу или молодого мужчину. «Юноша» подходит возрасту Вениамина и сохраняет семейную перспективу речи Иуды без архаичного «отрок».
- source_word: לַעֲזֹב
  choice: оставить
  rationale: В данном контексте עזב означает уйти от кого-либо, оставив его; нейтральное «оставить» не вносит нравственного оттенка слова «бросить».
- source_word: אָבִיו
  choice: своего отца / отца
  rationale: Возвратное «своего» естественно по-русски при первом упоминании; повтор слова «отец» сохранён вслед за еврейским текстом.
- source_word: וְעָזַב
  choice: ведь если он оставит
  rationale: Формально сочетание допускает буквальное «и он оставит», но в контексте выражает условное следствие невозможности разлуки. «Ведь если» одновременно передаёт условие и объяснительную связь.
- source_word: וָמֵת
  choice: тот умрёт
  rationale: Форма означает «и [он] умрёт». Контекст речи, особенно Быт. 44:31, указывает на отца; указательное местоимение «тот» ясно обозначает его по-русски, а формальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Не названный прямо субъект формы וָמֵת
  choice: 'В основном тексте субъектом назван отец: «тот умрёт»'
  alternative: «и он умрёт», что можно отнести к юноше
  rationale: Еврейская форма третьего лица не называет субъект существительным, и ближайшим грамматическим субъектом перед ней является юноша. Однако развитие речи Иуды прямо говорит о смерти отца при возвращении без Вениамина (Быт. 44:31). Перевод следует контексту, а реальную синтаксическую неоднозначность сохраняет в сноске.
translation_notes:
  register: Современный литературный русский язык с почтительным, но не архаичным тоном. Прямая речь оформлена естественно; повтор «отца» сохраняет акцент еврейского текста. Слово «юноша» предпочтено разговорному «парень» и архаичному «отрок».
