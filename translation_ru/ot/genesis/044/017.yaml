  text: וַ/יֹּ֕אמֶר חָלִ֣ילָ/ה לִּ֔/י מֵ/עֲשׂ֖וֹת זֹ֑את הָ/אִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַ/גָּבִ֜יעַ בְּ/יָד֗/וֹ ה֚וּא יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֕ם עֲל֥וּ לְ/שָׁל֖וֹם אֶל אֲבִי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: ru
  text: 'Но он сказал: «Да не будет того, чтобы я так поступил! Тот, в чьей руке была найдена чаша,[a] станет моим рабом,[b] а вы с миром отправляйтесь к своему отцу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в чьей руке была найдена чаша»; выражение может означать: «у кого была найдена чаша».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слугой». Еврейское עֶבֶד может означать и слугу, и раба; здесь контекст указывает на принудительное порабощение в наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵעֲשׂוֹת זֹאת
  choice: Да не будет того, чтобы я так поступил!
  rationale: Устойчивое еврейское выражение передаёт решительный отказ и отвращение к предполагаемому поступку. Русская формулировка сохраняет торжественную силу оригинала и остаётся понятной современному читателю.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: Тот, в чьей руке была найдена чаша
  rationale: Сохранён конкретный еврейский образ «в его руке», который в данном контексте означает владение или обладание. הָאִישׁ естественно передано местоименным «тот», поскольку лицо уже выделено условием.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: станет моим рабом
  rationale: עֶבֶד может обозначать как слугу, так и раба. Здесь речь идёт о принудительном порабощении в наказание, поэтому «раб» точнее передаёт характер положения.
- source_word: וְאַתֶּם עֲלוּ
  choice: а вы с миром отправляйтесь
  rationale: Императив множественного числа противопоставляет судьбу найденного виновным освобождению остальных. Глагол «отправляйтесь» естественнее в русском повествовании, чем буквальное «поднимайтесь», при этом направление обозначено следующими словами.
- source_word: לְשָׁלוֹם אֶל אֲבִיכֶם
  choice: с миром отправляйтесь к своему отцу
  rationale: לְשָׁלוֹם означает безопасное, беспрепятственное возвращение. «С миром» сохраняет библейскую образность, а «к своему отцу» естественно передаёт адресованное братьям אֲבִיכֶם.
theological_decisions:
- issue: Степень несвободы, выраженная словом עָבֶד
  choice: раб
  alternative: слуга
  rationale: Контекст описывает не добровольное служение, а наказание в виде личной зависимости. Выбор «раб» не вводит дополнительной богословской трактовки, а сохраняет социально-правовую остроту эпизода.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «Да не будет того...» передаёт силу отказа без архаической затемнённости; «с миром» сохраняет узнаваемую образность оригинала.
