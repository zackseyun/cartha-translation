source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: ru
  text: Если вы заберёте у меня и этого и с ним случится несчастье, то сведёте мою седину в скорби в шеол[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу»; или: «в мир мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת־זֶה
  choice: если вы заберёте у меня и этого
  rationale: Перфект с союзом продолжает условную мысль в речи Иакова; «если» естественно передаёт условие, а «и этого» подчёркивает новую утрату после прежней.
- source_word: מֵעִם פָּנַי
  choice: у меня
  rationale: Буквально выражение связано с лицом или присутствием говорящего, но в данном контексте естественное русское «заберёте у меня» точно передаёт разлуку с Иаковом.
- source_word: וְקָרָהוּ אָסוֹן
  choice: и с ним случится несчастье
  rationale: Сочетание глагола «случиться, постигнуть» с אָסוֹן обозначает серьёзную беду; «случится несчастье» сохраняет неопределённость относительно её характера.
- source_word: וְהוֹרַדְתֶּם
  choice: то сведёте
  rationale: Каузативная форма ירד означает «заставить сойти, свести»; русский глагол сохраняет образ нисхождения.
- source_word: שֵׂיבָתִי
  choice: мою седину
  rationale: Буквально «моя седина»; образ метонимически обозначает Иакова в старости и сохраняется без замены на абстрактное «старость».
- source_word: בְּרָעָה
  choice: в скорби
  rationale: Здесь רָעָה обозначает бедственное, скорбное состояние, а не нравственное зло. «В скорби» естественно сочетается с образом смерти от горя.
- source_word: שְׁאֹלָה
  choice: в шеол
  rationale: Направительная форма означает движение в шеол. Транслитерация сохраняет древнееврейское представление и не сужает его до физической могилы.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет широту древнееврейского понятия и не придаёт ему более поздней конфессиональной определённости; пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский с сохранением библейских образов «моя седина» и нисхождения в шеол. Синтаксис сделан естественным для прямой речи, без устранения неопределённости слова אָסוֹן.
