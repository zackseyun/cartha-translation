  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Он догнал их
  rationale: Глагол נשׂג в хифиле с суффиксом 3-го лица множественного числа обозначает, что управляющий настиг братьев в пути. «Догнал» естественно передаёт движение и результат погони.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: и сказал им
  rationale: Буквально конструкция означает «и говорил/произнёс к ним». В русском перед прямой речью сочетание «сказал им» звучит естественнее, чем «говорил им», и сохраняет направленность речи, выраженную אֶל.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: такие слова
  rationale: Выражение буквально означает «эти слова». Перед следующей далее прямой речью русское «такие слова» естественно выполняет вводную функцию и сохраняет лексему «слова».
