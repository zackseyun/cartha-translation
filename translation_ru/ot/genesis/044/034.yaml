source:
  edition: WLC
  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: ru
  text: Ведь как я вернусь к отцу, если юноши не будет со мной? Не увидеть бы мне беды, которая постигнет моего отца!»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: вернусь
  rationale: Буквально «поднимусь», но здесь глагол обозначает возвращение из Египта к отцу в Ханаан; «вернусь» естественно передаёт смысл движения в контексте.
- source_word: הַנַּעַר
  choice: юноша
  rationale: Слово может обозначать мальчика, юношу или молодого человека; о взрослом Вениамине уместно нейтральное «юноша», сохраняющее повествовательное обозначение.
- source_word: פֶּן אֶרְאֶה
  choice: Не увидеть бы мне
  rationale: פֶּן выражает опасение и нежелательный исход («как бы не», «чтобы не»); такая конструкция сохраняет эмоциональную силу речи Иуды и не превращает опасение в необходимость.
- source_word: בָרָע אֲשֶׁר יִמְצָא
  choice: беды, которая постигнет
  rationale: רָע здесь означает несчастье или беду, а מצא — то, что настигнет или постигнет человека; русская формулировка естественна и близка исходному образу.
theological_decisions:
- issue: Степень определённости беды, ожидающей отца
  choice: «Не увидеть бы мне беды, которая постигнет моего отца»
  alternative: «Иначе мне придётся увидеть бедствие, которое обрушится на моего отца»
  rationale: 'Еврейское פֶּן передаёт опасение или предотвращаемый нежелательный исход, а не прямую модальную необходимость. Перевод сохраняет напряжение: Иуда страшится стать свидетелем беды отца, не уточняя её как неизбежную смерть.'
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. «Ведь как» передаёт כִּי אֵיךְ как эмоционально-мотивирующий вопрос; финальная конструкция намеренно сохраняет оттенок опасения исходного текста.
