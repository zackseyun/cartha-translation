source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: ru
  text: 'И сказал Иуда: «Что нам сказать моему господину? Что нам говорить? И как нам оправдаться?[a] Бог обнаружил вину рабов твоих.[b][c] Вот мы — рабы моего господина: и мы, и тот, в чьей руке была найдена чаша».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И как нам доказать свою правоту?» Еврейский глагол может означать «показать себя правым» или «оправдаться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог выявил беззаконие рабов твоих».'
    reason: lexical_alternative
  - marker: c
    text: Первое слово «рабы» — почтительное самоназвание перед вышестоящим; далее тем же словом названа настоящая зависимость, на которую братья соглашаются.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: моему господину / моего господина
  rationale: Речь идёт об Иосифе как о властителе, а не о Боге. «Господин» сохраняет почтительное обращение Иуды; строчная буква исключает смешение с божественным титулом.
- source_word: מַה נֹּאמַר / מַה נְּדַבֵּר
  choice: Что нам сказать? Что говорить?
  rationale: Различение «сказать» и «говорить» сохраняет параллельные еврейские глаголы и передаёт нарастающее ощущение, что братьям нечего сказать в свою защиту.
- source_word: וּמַה נִּצְטַדָּק
  choice: И как нам оправдаться?
  rationale: Возвратная форма глагола צדק означает показать себя правым, оправдаться. «Как» естественно передаёт инструментальное מַה в русском риторическом вопросе.
- source_word: מָצָא אֶת־עֲוֹן
  choice: обнаружил вину
  rationale: Оборот говорит не только о наличии вины, но и о том, что Бог выявил скрытое преступление. «Обнаружил вину» ясно передаёт оба оттенка.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: рабы твои / рабы
  rationale: Русское «раб» может обозначать как почтительное самоназвание перед властителем, так и реальное состояние несвободы. Повторение одного слова сохраняет лексическую связь оригинала, а сдвиг смысла разъяснён в примечании.
- source_word: הִנֶּנּוּ
  choice: Вот мы
  rationale: Краткая формула представляет братьев как отдающих себя во власть Иосифа и естественно звучит в современном литературном русском.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: и мы, и тот, в чьей руке была найдена чаша
  rationale: Парная конструкция «и… и…» передаёт двойное גַּם, включая как всех братьев, так и отдельно того, у кого нашли чашу; «в чьей руке» сохраняет образ оригинала.
theological_decisions:
- issue: Кого обозначает הָאֱלֹהִים в признании Иуды
  choice: Бог, который выявил вину братьев
  alternative: неопределённое божество или божественная сила
  rationale: Контекст книги Бытия и определённая форма существительного указывают на единого Бога. При этом перевод не уточняет, какую именно вину имеет в виду Иуда, сохраняя повествовательное напряжение.
- issue: Значение עָוֹן
  choice: вина
  alternative: беззаконие / наказание за вину
  rationale: Слово допускает значения проступка, виновности и её последствий. Здесь «вина» сохраняет эту смысловую широту и не сводит признание Иуды только к обвинению в краже чаши.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, повествовательным звучанием. Формула «мой господин» сохранена как почтительная придворная речь; синтаксический параллелизм трёх вопросов и повтор слова «рабы» следуют еврейскому тексту.
