lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Хорошо
  rationale: В данном ответе сочетание вводит непосредственное принятие сказанного; русское «Хорошо» естественно передаёт утвердительную реакцию, не создавая неясного временного смысла «даже теперь».
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: пусть будет по вашим словам
  rationale: Передаёт буквальную связь со словами братьев, тогда как последующее отдельное предложение показывает, что распорядитель смягчает предложенное ими наказание, а не повторяет его целиком.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: Тот, у кого найдётся чаша
  rationale: Местоименная отсылка в еврейском тексте обозначает разыскиваемую чашу; явное существительное обеспечивает естественность и ясность по-русски.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: станет моим рабом
  rationale: יִהְיֶה выражает наступающий статус, а עֶבֶד здесь означает принудительное подневольное положение как наказание, поэтому «раб» точнее, чем «слуга».
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: а вы будете невиновны
  rationale: נְקִיִּם означает свободу от вины и ответственности; противительный союз «а» естественно подчёркивает отличие участи остальных.
