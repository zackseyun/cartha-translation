  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: ru
  text: 'Тогда ты сказал своим слугам: «Приведите его ко мне, чтобы я мог посмотреть на него[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы я обратил на него свой глаз». Это еврейское выражение может означать увидеть, осмотреть или уделить особое внимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда ты сказал
  rationale: Форма wayyiqtol продолжает последовательность повествования; «тогда» естественно передаёт это значение и сохраняет прямое обращение Иуды к Иосифу.
- source_word: עֲבָדֶיךָ
  choice: своим слугам
  rationale: В придворном обращении עבד обозначает подчинённых или слуг; перевод «рабам» здесь неоправданно выдвигал бы на первый план юридический статус.
- source_word: הוֹרִדֻהוּ
  choice: приведите его
  rationale: Hiphil от ירד буквально указывает на перемещение вниз, в Египет. В русском «приведите» естественно передаёт каузативное движение к говорящему, тогда как «спустите его» могло бы ошибочно восприниматься как физический спуск с высоты.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог выражает направленность движения непосредственно к Иосифу.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: чтобы я увидел его
  rationale: 'Буквально: «чтобы я положил/обратил на него свой глаз». Русское «увидел его» естественно передаёт идиому, не сужая её до обещания заботы; возможный оттенок особого внимания отмечен в сноске.'
theological_decisions:
- issue: Значение выражения וְאָשִׂימָה עֵינִי עָלָיו
  choice: Не истолковывать его как прямое обещание заботиться о Вениамине
  alternative: «и я позабочусь о нём»
  rationale: В данном контексте идиома может означать увидеть, осмотреть или уделить особое внимание. Перевод «позабочусь» устранил бы присущую оригиналу смысловую широту.
translation_notes:
  register: Современный литературный русский язык с уважительным, но доступным повествовательным тоном. В прямой речи сохранено обращение на «ты», соответствующее форме единственного числа в еврейском тексте. Буквальная пространственная деталь «вниз» не вынесена в основной текст ради естественности русского выражения.
