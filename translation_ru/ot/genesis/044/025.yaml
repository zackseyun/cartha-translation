  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: ru
  text: 'Тогда наш отец сказал: «Вернитесь и купите нам немного еды».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вернитесь и купите нам немного зерна». В еврейском тексте употреблено общее слово «еда», хотя в более широком контексте речь идёт о зерне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: אָבִינוּ
  choice: наш отец
  rationale: В контексте речь идёт непосредственно об отце братьев, Иакове.
- source_word: שֻׁבוּ
  choice: Вернитесь
  rationale: Повелительная форма שוב призывает снова отправиться туда, где братья уже были; «вернитесь» сохраняет значение возвращения.
- source_word: שִׁבְרוּ
  choice: купите
  rationale: В повествовании об Иосифе глагол означает покупку съестных припасов, прежде всего зерна; следующее אֹכֶל уже называет предмет покупки.
- source_word: לָנוּ
  choice: нам
  rationale: 'Дательный падеж естественно передаёт бенефактивное значение: купить для нас.'
- source_word: מְעַט
  choice: немного
  rationale: Передаёт небольшое количество без лишнего уточнения.
- source_word: אֹכֶל
  choice: еда
  rationale: Это общее слово для пищи; хотя контекст связан с зерном, основной текст не следует неоправданно сужать.
