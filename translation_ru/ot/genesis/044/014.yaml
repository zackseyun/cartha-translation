  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: ru
  text: Иуда и его братья вошли в дом Иосифа. Он всё ещё был там, и они пали перед ним на землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошли
  rationale: Форма wayyiqtol продвигает повествование; с направительным בֵּיתָה контекст указывает на движение внутрь дома. Множественное число естественно согласует сказуемое с составным подлежащим «Иуда и его братья».
- source_word: יְהוּדָה וְאֶחָיו
  choice: Иуда и его братья
  rationale: Сохраняется отдельное упоминание Иуды как ведущей фигуры и родственное обозначение остальных.
- source_word: בֵּיתָה יוֹסֵף
  choice: в дом Иосифа
  rationale: Направительное окончание -ה обозначает движение к дому, а в данном контексте — внутрь него.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Он всё ещё был там
  rationale: עוֹדֶנּוּ выражает продолжающееся пребывание. Отдельное предложение естественно передаёт обстоятельственный характер этой фразы.
- source_word: וַיִּפְּלוּ
  choice: они пали
  rationale: Сохранено основное значение глагола «падать»; последующие слова ясно показывают, что это жест почтения.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Естественный русский эквивалент устойчивого еврейского выражения со значением нахождения или действия в чьём-либо присутствии.
- source_word: אָרְצָה
  choice: на землю
  rationale: Направительная форма обозначает движение вниз, к земле; сочетание «пали ... на землю» естественно в русском повествовании.
