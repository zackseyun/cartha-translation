base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: ru
  text: 'И приказал он тому, кто заведовал его домом: «Наполни мешки людей пищей — столько, сколько они смогут унести, — и положи серебро каждого из них в горловину его мешка[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в уста его мешка», то есть в его отверстие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: И приказал он
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» сохраняет связь с предыдущим событием, а глагол точно передаёт значение повеления.
- source_word: אֲשֶׁר עַל־בֵּיתוֹ
  choice: тому, кто заведовал его домом
  rationale: 'Буквально: «тому, кто был над его домом». Выбран естественный русский оборот, передающий служебную ответственность без введения более специального титула «управляющий».'
- source_word: מַלֵּא
  choice: Наполни
  rationale: Прямое соответствие повелительной форме глагола מלא.
- source_word: אַמְתְּחֹת הָאֲנָשִׁים
  choice: мешки этих людей
  rationale: אַמְתַּחַת обозначает дорожный мешок для припасов; «этих людей» естественно передаёт определённое הָאֲנָשִׁים, не подменяя его контекстуальным «братьев».
- source_word: אֹכֶל
  choice: пищей
  rationale: Сохранено общее значение «пища, еда»; более узкое «зерно» не навязывается, хотя оно подразумевается контекстом.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: сколько они смогут унести
  rationale: Естественный русский эквивалент сочетания способности с несением груза; сохраняется указание на предельную вместимость и грузоподъёмность.
- source_word: כֶּסֶף אִישׁ
  choice: серебро каждого
  rationale: כֶּסֶף буквально означает «серебро» и в контексте служит платой; распределительное אִישׁ передано словом «каждого» без уточняющей вставки «деньги».
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: в горловину его мешка
  rationale: «Горловина» естественно обозначает верхнее отверстие мешка и сохраняет образность еврейского פֶּה («рот, устье»), не создавая в русском неуместной буквальности.
