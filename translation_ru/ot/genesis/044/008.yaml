base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: ru
  text: Вот, серебро, которое мы нашли в горловинах наших мешков[a], мы принесли тебе обратно из земли Ханаанской. Как же мы могли украсть из дома твоего господина серебро или золото?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в устах наших мешков», то есть в их верхних отверстиях, или горловинах.'
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: Ведь
  rationale: Частица привлекает внимание к факту, на котором строится довод. В данном контексте русское «ведь» естественно передаёт не только эмфазу, но и доказательную связь с последующим риторическим вопросом.
- source_word: כֶּסֶף
  choice: серебро
  rationale: Сохранено буквальное значение, поскольку далее оно образует конкретную пару с золотом; в контексте серебро служит деньгами.
- source_word: מָצָאנוּ
  choice: мы нашли
  rationale: Прямой и естественный эквивалент формы совершенного действия.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: у отверстий наших мешков
  rationale: Идиома буквально говорит «в устах наших мешков». Перевод передаёт реальное пространственное значение без неестественного для русского олицетворения; образ оригинала отмечен в сноске.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: мы принесли тебе обратно
  rationale: Каузативная форма שוב обозначает возвращение предмета адресату; эта формулировка естественна по-русски и ясно описывает действие братьев.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: из земли Ханаанской
  rationale: Традиционная, литературная и понятная русская форма географического обозначения.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Как же мы могли украсть
  rationale: «Как же» передаёт вывод из предыдущего факта, а «могли» естественно выражает модальный смысл риторического вопроса.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: из дома твоего господина
  rationale: אדון здесь обозначает хозяина или начальника слуги, а не божественный титул. «Господин» уместно для обращения в данном социальном контексте; «дом» сохраняет метонимическую широту оригинала.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: серебро или золото
  rationale: Сохранена конкретная пара металлов и повтор слова «серебро», усиливающий аргумент говорящих.
