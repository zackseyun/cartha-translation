base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: ru
  text: 'Они вышли из города и ещё не успели далеко отойти, когда Иосиф сказал тому, кто управлял его домом[a]: «Встань, гонись за этими людьми и, когда догонишь их, скажи им: „Почему вы отплатили злом за добро?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тому, кто был над его домом»; то есть управляющему домом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: вышли из города, но ещё не успели далеко отойти
  rationale: Форма повествования описывает братьев уже покинувшими город, но ещё не удалившимися далеко. Русская конструкция естественно передаёт тесную временную последовательность.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: тому, кто управлял его домом
  rationale: 'Буквально: «тому, кто над его домом». Речь идёт о распорядителе домашнего хозяйства; описательный перевод сохраняет образ еврейского выражения и остаётся понятным современному читателю.'
- source_word: קוּם
  choice: Встань
  rationale: Императив קום буквально призывает подняться и приступить к действию; «Встань» сохраняет форму и настойчивость приказа.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: гонись за этими людьми
  rationale: Глагол с предлогом означает преследовать, гнаться вслед. Указательное «этими» естественно в прямом приказе и относится к только что уехавшим братьям.
- source_word: וְהִשַּׂגְתָּם
  choice: когда догонишь их
  rationale: 'Hiphil от נשׂג здесь означает настичь, догнать. Союзное «когда» естественно выражает последовательность: слова обвинения следует произнести после того, как они будут настигнуты.'
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: вы отплатили злом за добро
  rationale: Piel от שלם означает воздать или отплатить, а сочетание רָעָה תַּחַת טוֹבָה противопоставляет зло добру. Русская формула точно сохраняет нравственную силу обвинения.
