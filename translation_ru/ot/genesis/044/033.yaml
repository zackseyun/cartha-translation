source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: ru
  text: 'И теперь прошу: пусть твой слуга останется вместо юноши рабом у моего господина, а юноша пусть пойдёт[a] со своими братьями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «поднимется». Так обычно описывали путь из Египта в Ханаан.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный и временно-дискурсивный смысл выражения, вводящего кульминационную просьбу Иуды.
- source_word: יֵשֶׁב נָא
  choice: 'прошу: пусть ... останется'
  rationale: Форма с נָא выражает вежливую настойчивую просьбу; «останется» естественно передаёт намерение Иуды остаться у Иосифа.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Здесь это почтительное самообозначение Иуды при обращении к высокопоставленному лицу, а не указание на его нынешний рабский статус.
- source_word: תַּחַת הַנַּעַר
  choice: вместо юноши
  rationale: Предлог תַּחַת имеет здесь ясный заместительный смысл.
- source_word: הַנַּעַר
  choice: юноша
  rationale: Слово נַעַר допускает широкий возрастной диапазон. «Юноша» сохраняет защитный тон речи Иуды, не представляя взрослого Вениамина маленьким ребёнком.
- source_word: עֶבֶד
  choice: рабом
  rationale: В отличие от почтительного самообозначения «твой слуга», здесь речь идёт о реальном несвободном положении в доме Иосифа.
- source_word: לַאדֹנִי
  choice: у моего господина
  rationale: Передаёт принадлежность к дому и власти Иосифа; «господин» сохраняет уважительный человеческий титул без божественного оттенка.
- source_word: וְהַנַּעַר יַעַל
  choice: а юноша пусть пойдёт
  rationale: Продолжает побудительный смысл просьбы. В основном тексте употреблён естественный русский глагол, а образное «поднимется» сохранено в примечании.
- source_word: עִם אֶחָיו
  choice: со своими братьями
  rationale: Точно и естественно передаёт семейное отношение; местоимение «своими» устраняет возможную неясность по-русски.
theological_decisions: []
