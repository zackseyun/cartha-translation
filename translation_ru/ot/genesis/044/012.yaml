lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: обыскал их
  rationale: Глагол обозначает тщательный поиск среди вещей братьев. Местоимение «их» подразумевается контекстом и необходимо для естественной русской фразы.
- source_word: בַּגָּדוֹל
  choice: со старшего
  rationale: В контексте речь идёт о порядке братьев по возрасту, а не о росте или положении.
- source_word: הֵחֵל
  choice: начав
  rationale: Передаёт исходную точку последовательного обыска и естественно сочетается с «закончив».
- source_word: וּבַקָּטֹן
  choice: младшим
  rationale: В семейном контексте слово противопоставлено «старшему» и указывает на младшего по возрасту.
- source_word: כִּלָּה
  choice: закончив
  rationale: Обозначает конечную точку обыска и сохраняет параллелизм с «начав».
- source_word: וַיִּמָּצֵא
  choice: нашлась
  rationale: Возвратная форма естественно передаёт еврейскую пассивную конструкцию, не заменяя её активным «он нашёл».
- source_word: הַגָּבִיעַ
  choice: чаша
  rationale: Слово обозначает сосуд для питья; «чаша» — ясный и уместный в повествовании вариант, тогда как «кубок» сохраняется в примечании как возможный перевод.
- source_word: בְּאַמְתַּחַת
  choice: в мешке
  rationale: Речь идёт о дорожном мешке для зерна или припасов; «мешок» точнее общего слова «сумка».
- source_word: בִּנְיָמִן
  choice: Вениамина
  rationale: Использована традиционная русская форма библейского имени.
