  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: ru
  text: Он обыскал поклажу братьев, начав со старшего и закончив младшим, и чаша[a] была найдена в мешке Вениамина.
  philosophy: optimal-equivalence
