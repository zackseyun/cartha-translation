base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: ru
  text: У кого из твоих слуг найдётся чаша[a], тот пусть умрёт, а мы также станем рабами моего господина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у кого из твоих слуг найдётся». Речь идёт о чаше, упомянутой в предыдущем стихе. Одно и то же еврейское слово передано здесь как «слуги» — почтительное самообозначение — и далее как «рабы», поскольку речь идёт о порабощении.'
    reason: Контекстуальное восполнение подразумеваемого предмета и различная передача двух употреблений одного еврейского слова.
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: У кого из твоих слуг найдётся чаша
  rationale: Неопределённая относительная конструкция передана естественным по-русски оборотом «у кого из...». Подлежащее «чаша» восстановлено из ближайшего контекста, чтобы избежать неясного безличного «найдётся».
- source_word: וָמֵת
  choice: тот пусть умрёт
  rationale: Форма выражает предложенное следствие с волитивным оттенком; «пусть умрёт» сохраняет категоричность речи братьев.
- source_word: וְגַם אֲנַחְנוּ
  choice: а мы остальные
  rationale: גם добавляет наказание для всей группы. «Мы остальные» ясно отличает прочих братьев от того, у кого будет найдена чаша.
- source_word: נִהְיֶה
  choice: станем
  rationale: Передаёт вступление в новое состояние как результат предложенного наказания.
- source_word: לַאדֹנִי
  choice: господина нашего
  rationale: В еврейском стоит буквально «моего господина», поскольку говорит один представитель группы; в естественной русской коллективной речи «нашего» согласуется с «мы» и ясно обозначает человеческого властителя.
- source_word: עבד
  choice: слуг ... рабами
  rationale: Первое употребление — почтительное самообозначение перед сановником, поэтому «слуг»; второе означает реальное принудительное порабощение как наказание, поэтому «рабами».
theological_decisions:
- issue: Различная передача двух употреблений עבד
  choice: «слуг» в почтительном самообозначении и «рабами» при угрозе порабощения
  alternative: «рабов» или «слуг» в обоих случаях
  rationale: Различие определяется функцией слова в каждом контексте и не сглаживает реальный характер предлагаемой кабалы.
- issue: Число в выражении לַאדֹנִי
  choice: «господина нашего»
  alternative: «моего господина»
  rationale: Буквальная форма единственного числа отражает речь одного представителя, однако содержание обещания относится ко всей группе. Русское «нашего» естественно связывает господина с коллективным «мы»; исходная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис прямой и устный, подходящий для самоуверенного ответа братьев; архаизмы устранены. «Господина нашего» сохраняет придворную почтительность, не создавая божественного титула.
