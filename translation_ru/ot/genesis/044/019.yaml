  text: 'Господин мой спросил своих слуг: «Есть ли у вас отец или брат?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Мой господин
  rationale: Уважительное обращение Иуды к египетскому правителю; передаёт придворную почтительность и сохраняет форму первого лица единственного числа.
- source_word: שָׁאַל
  choice: спрашивал
  rationale: Глагол означает «спрашивать, расспрашивать». Несовершенный вид естественно представляет упоминаемый прежний разговор.
- source_word: עֲבָדָיו
  choice: своих рабов
  rationale: עֶבֶד может означать раба или слугу; здесь братья почтительно называют себя зависимыми от правителя. «Рабов» сохраняет устойчивую библейскую формулу придворного самоуничижения, не утверждая отдельно их юридический статус.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Инфинитив вводит содержание сказанного; в современном русском его естественно передать пунктуационно, без тяжеловесного «говоря».
- source_word: הֲיֵשׁ לָכֶם
  choice: Есть ли у вас
  rationale: Вопросительная конструкция יֵשׁ с ל выражает наличие; русский экзистенциально-посессивный оборот близок и по форме, и по смыслу.
- source_word: אָב
  choice: отец
  rationale: Русский язык в таком вопросе не требует неопределённого артикля; единственное число сохранено.
- source_word: אָח
  choice: брат
  rationale: Сохранены параллелизм с «отец» и единственное число исходного текста.
