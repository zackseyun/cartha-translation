  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: ru
  text: 'Но мы сказали: «Мы не можем спуститься. Если наш самый младший брат будет с нами, мы спустимся, ведь мы не можем предстать перед этим человеком[a], если нашего самого младшего брата не будет с нами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидеть лицо этого человека» — то есть предстать перед ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Но мы сказали
  rationale: Последовательный waw продолжает рассказ, а «но» естественно передаёт контраст между требованием правителя и ответом братьев.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Мы не можем отправиться туда
  rationale: יכל обозначает возможность, а ירד буквально значит «спуститься». В данном контексте речь о поездке в Египет; по-русски «отправиться туда» звучит естественно и не создаёт неуместного пространственного акцента.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ וְיָרַדְנוּ
  choice: Если с нами будет наш младший брат, мы отправимся
  rationale: Сохранена явная условно-следственная структура еврейского текста. הַקָּטֹן в семейном контексте означает младшего из братьев.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание отказа; «потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: предстать перед этим человеком
  rationale: Буквально «увидеть лицо человека»; это идиома допуска к человеку и появления перед ним. Идиоматический русский эквивалент передаёт смысл без неестественной кальки.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: если нашего младшего брата не будет с нами
  rationale: Хотя еврейский текст формально присоединяет фразу союзом waw, по смыслу она обозначает обстоятельство, при котором братья не могут предстать перед правителем.
