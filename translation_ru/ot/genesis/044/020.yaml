base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: ru
  text: 'Мы сказали моему господину: «У нас есть старый отец и маленький сын, родившийся у него в старости. Его брат умер, и он — единственный оставшийся сын своей матери, а отец любит его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: моему господину
  rationale: Почтительное обращение к вышестоящему; сохраняет социальную иерархию и повторяющуюся лексику повествования.
- source_word: זָקֵן
  choice: престарелый
  rationale: Передаёт преклонный возраст отца естественно и с достоинством.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: младший сын, родившийся у него в старости
  rationale: Выражение זְקֻנִים указывает на рождение в преклонном возрасте отца, а קָטָן в семейном контексте естественно передаётся как «младший». Слово «сын» проясняет родственную связь, подразумеваемую контекстом.
- source_word: וְאָחִיו מֵת
  choice: Его брат умер
  rationale: Естественная русская формулировка, передающая смерть брата как состоявшийся факт с сохраняющимся результатом.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: он один остался у своей матери
  rationale: Близко сохраняет неоднозначную еврейскую конструкцию с לְאִמּוֹ; по контексту речь идёт о единственном оставшемся сыне этой матери, что поясняется в сноске.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: и отец любит его
  rationale: Прямо и прозрачно передаёт особую отцовскую любовь к Вениамину.
