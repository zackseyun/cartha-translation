revisions:
- from: 'Мы сказали моему господину: «У нас есть престарелый отец и младший сын, родившийся у него в старости. Его брат умер, и он один остался у своей матери[a], и отец любит его».'
  to: 'Мы сказали моему господину: «У нас есть старый отец и маленький сын, родившийся у него в старости. Его брат умер, и он — единственный оставшийся сын своей матери, а отец любит его».'
  rationale: Перевод уточнён только там, где русский текст либо добавлял значение «младший», либо создавал ложный смысл пребывания у матери. Формулировка «единственный оставшийся сын своей матери» передаёт смысл еврейского выражения без сохранения неработающей в русском языке синтаксической двусмысленности; поэтому пояснительная сноска больше не нужна.
