base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: ru
  text: 'Ведь твой слуга поручился за юношу перед моим отцом[a], сказав: «Если я не приведу его к тебе, то останусь виноват перед моим отцом до конца своих дней[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взял на себя ответственность за юношу»; еврейский глагол означает, что человек выступил поручителем и лично отвечает за другого.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «согрешу перед/против моего отца во все дни»; по смыслу — всю жизнь буду нести перед ним вину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит объяснение Иуды и естественно связывает его с предшествующей просьбой.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Передаёт почтительное самонаименование в речи перед правителем, не усиливая без необходимости оттенок рабского статуса.
- source_word: עָרַב אֶת־הַנַּעַר מֵעִם אָבִי
  choice: поручился перед отцом за этого юношу
  rationale: Глагол обозначает принятие на себя ответственности как поручителем; сочетание «поручился перед отцом за» естественно выражает и адресата обещания, и объект ответственности.
- source_word: הַנַּעַר
  choice: этого юношу
  rationale: В контексте речь о Вениамине; «юноша» сохраняет семейно-возрастное обозначение, не создавая впечатления, будто он малолетний ребёнок.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Если я не приведу его к тебе
  rationale: Прямо и ясно передаёт условие данного Иудой обещания.
- source_word: וְחָטָאתִי לְאָבִי
  choice: то останусь виноват перед отцом
  rationale: В данном контексте глагол חטא выражает навлечённую на себя вину за неисполнение поручительства; перевод сохраняет личную ответственность перед отцом.
- source_word: כָּל־הַיָּמִים
  choice: до конца своих дней
  rationale: Естественная русская формулировка, передающая пожизненную продолжительность вины.
