base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: ru
  text: 'И сказал им Иосиф: «Что это за поступок вы совершили? Разве вы не знали, что такой человек, как я, действительно гадает[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «несомненно занимается гаданием», «непременно узнает посредством гадания» или «непременно обнаружит подобное». В еврейском тексте значение глагола «гадать» усилено сочетанием инфинитива с личной формой того же корня.'
    reason: Лексическая альтернатива и пояснение усилительной еврейской конструкции.
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: Что это за поступок
  rationale: Слово מַעֲשֶׂה обозначает дело, действие или поступок. «Поступок» естественно звучит в упрёке и сохраняет нравственную весомость выражения.
- source_word: עֲשִׂיתֶם
  choice: вы совершили
  rationale: Перфект указывает на уже совершённое действие, последствия которого актуальны в момент обвинения.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Разве вы не знали
  rationale: Отрицательный риторический вопрос предполагает утвердительный ответ; эта форма точно и естественно передаёт его силу по-русски.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: непременно гадает
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает утверждение. Наречие «непременно» передаёт эмфазу, а «гадает» прямо сохраняет значение корня נחש, не решая, было ли заявление буквальным или частью египетского образа Иосифа.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: такой человек, как я
  rationale: Передаёт единичное אִישׁ и сравнительную конструкцию естественным современным русским языком.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная русская библейская форма имени.
theological_decisions:
- issue: Следует ли смягчать слова Иосифа о гадании, представляя их лишь притворством или способностью раскрыть кражу
  choice: 'Передать прямое утверждение: «такой человек, как я, непременно гадает»'
  alternative: «такой человек, как я, непременно узнает всё посредством гадания» или «непременно обнаружит подобное»
  rationale: Еврейский текст дважды использует корень נחש, связанный с гаданием. Прямой перевод сохраняет богословское и повествовательное напряжение, не утверждая и не отрицая, что Иосиф действительно занимался гаданием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «И сказал им Иосиф» сохраняет достоинство повествования; реплика сформулирована ясно и естественно. Маркер [a] помещён непосредственно после спорного выражения.
