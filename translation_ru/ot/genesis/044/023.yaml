  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: ru
  text: 'И ты сказал своим слугам: «Если ваш самый младший брат не придёт с вами, вы больше не увидите моего лица[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «вы больше не предстанете передо мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И ты сказал
  rationale: Повествовательный wayyiqtol от אמר передан прошедшим временем; союз «и» сохраняет связь с предшествующим рассказом.
- source_word: עֲבָדֶיךָ
  choice: своим слугам
  rationale: В придворном контексте это почтительное самоназвание братьев перед правителем; «слугам» естественно передаёт отношение подчинённости, не подчёркивая юридический статус рабов.
- source_word: אִם לֹא
  choice: Если ... не
  rationale: Отрицательное условие передано прямо, с сохранением структуры еврейской фразы.
- source_word: יֵרֵד
  choice: не придёт
  rationale: Буквально глагол означает движение вниз, однако речь ведётся с точки зрения находящегося в Египте Иосифа; по-русски здесь естественно «придёт». Направительный оттенок не выражен явно ради современного литературного звучания.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: ваш младший брат
  rationale: В контексте речь идёт о самом младшем из братьев. Русское устойчивое выражение «младший брат» естественно обозначает его семейное положение; значение уточняется контекстом.
- source_word: אִתְּכֶם
  choice: с вами
  rationale: Прямо и естественно передаёт значение совместного движения.
- source_word: לֹא תֹסִפוּן
  choice: вы больше не
  rationale: Конструкция с יסף запрещает повторение действия; русское «больше не» точно и идиоматично передаёт это значение.
- source_word: לִרְאוֹת פָּנָי
  choice: увидите моего лица
  rationale: Основной текст сохраняет буквальный и выразительный еврейский оборот «видеть лицо», а его придворно-идиоматическое значение поясняется в сноске.
