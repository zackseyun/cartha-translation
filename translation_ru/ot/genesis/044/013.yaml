  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: ru
  text: Тогда они разорвали на себе одежду[a], каждый навьючил своего осла, и они вернулись в город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верхнюю одежду». Еврейское слово может обозначать одежду вообще, но нередко относится к верхней одежде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ שִׂמְלֹתָם
  choice: они разорвали на себе одежду
  rationale: Глагол קרע обозначает буквальное разрывание одежды как знак потрясения, скорби или отчаяния. Оборот «на себе» естественно передаёт по-русски действие над собственной одеждой, не добавляя причины жеста.
- source_word: שִׂמְלֹתָם
  choice: одежду
  rationale: שִׂמְלָה — общее обозначение одежды, нередко верхней. Собирательное единственное число «одежду» в современном русском естественнее буквального «одежды» и сохраняет общий смысл.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: каждый навьючил своего осла
  rationale: עמס значит нагружать, навьючивать; אִישׁ имеет распределительное значение «каждый». «Навьючил осла» — точное и естественное обозначение помещения поклажи на вьючное животное.
- source_word: חֲמֹרוֹ
  choice: своего осла
  rationale: חֲמוֹר — обычное слово «осёл». Возвратное притяжательное местоимение «своего» нормативно соотносит животное с каждым из братьев.
- source_word: וַיָּשֻׁבוּ הָעִירָה
  choice: они вернулись в город
  rationale: שׁוב передаёт возвращение, а направительный суффикс -ה указывает движение к городу. Русское «вернулись в город» ясно выражает оба элемента.
