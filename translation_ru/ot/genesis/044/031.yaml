  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: ru
  text: Когда он увидит, что юноши нет, он умрёт, и твои слуги с горем сведут седину твоего слуги, нашего отца, в Шеол[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу»; или: «в мир мёртвых». Евр. «шеол».'
    reason: Лексические варианты широкого по значению древнееврейского термина שְׁאוֹל.
lexical_decisions:
- source_word: וְהָיָה
  choice: то
  rationale: Оборот вводит следствие предшествующего условия; русское «то» естественно оформляет придаточную конструкцию без буквального «и будет».
- source_word: כִּרְאוֹתוֹ
  choice: увидев
  rationale: Инфинитивная конструкция с כ выражает временное обстоятельство; деепричастие естественно передаёт значение «когда он увидит».
- source_word: כִּי אֵין הַנַּעַר
  choice: что юноши нет
  rationale: אֵין в контексте указывает на отсутствие Вениамина, не утверждая его смерти; «нет» сохраняет эту смысловую границу.
- source_word: הַנַּעַר
  choice: юноша
  rationale: נַעַר обозначает мальчика или молодого мужчину; «юноша» звучит современно и достойно, не преувеличивая детский возраст Вениамина.
- source_word: וָמֵת
  choice: он умрёт
  rationale: Форма продолжает последовательность предполагаемых событий и в данном контексте имеет будущее значение.
- source_word: וְהוֹרִידוּ
  choice: сведут
  rationale: Каузатив глагола ירד буквально выражает причинение спуска; «сведут ... в шеол» сохраняет пространственный образ оригинала.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: Это почтительное самообозначение братьев перед правителем, поэтому «слуги» уместнее, чем социально более узкое «рабы».
- source_word: שֵׂיבַת
  choice: седину
  rationale: Существительное буквально означает седину и метонимически старость; конкретный образ оригинала сохранён.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: твоего слуги, нашего отца
  rationale: Сохранены оба определения Иакова — почтительное по отношению к адресату и родственное по отношению к говорящим.
- source_word: בְּיָגוֹן
  choice: в скорби
  rationale: יָגוֹן означает скорбь или горе; «в скорби» близко передаёт предложную конструкцию и высокий эмоциональный регистр.
- source_word: שְׁאֹלָה
  choice: в шеол
  rationale: Транслитерация сохраняет широкий смысл древнееврейского понятия и не сводит его исключительно к могиле; направительный суффикс передан предлогом «в» при глаголе движения.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация не навязывает более узкого представления о месте погребения или детально определённой загробной космологии и сохраняет напряжение исходного понятия.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественности прямой речи Иуды и конкретного древнееврейского образа «свести седину ... в шеол». Структура фразы согласована с условием предыдущего стиха, поэтому в начале употреблено соотносительное «то».
