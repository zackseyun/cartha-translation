lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Когда … то
  rationale: Еврейская повествовательная формула вводит следующее событие; русская конструкция «когда … то» естественно передаёт временную и последовательную связь без тяжеловесного «и случилось».
- source_word: עָלִינוּ
  choice: мы пришли
  rationale: Буквально глагол означает «поднялись», поскольку речь идёт о пути из Египта в Ханаан. В современном русском «пришли» естественнее в сочетании с указанием лица, к которому направились; географическая деталь здесь не является смысловым центром.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: к твоему слуге, моему отцу
  rationale: Сохранены порядок еврейского текста и почтительное самоумаление Иуды перед Иосифом. Запятая показывает, что «моему отцу» поясняет выражение «твоему слуге».
- source_word: וַנַּגֶּד לוֹ
  choice: передали ему
  rationale: Hифиль נגד означает «сообщить, рассказать, передать». «Передали ему» естественно сочетается со «словами» и сохраняет смысл сообщения.
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: слова моего господина
  rationale: Формально сохранено דִּבְרֵי «слова», а אֲדֹנִי передано как почтительный титул человека, без отождествления с божественным именем.
