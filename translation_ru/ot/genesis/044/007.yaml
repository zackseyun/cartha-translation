  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: ru
  text: 'Они сказали ему: «Почему господин мой говорит такие слова? Да не будет того, чтобы слуги твои сделали такое!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Они сказали ему
  rationale: Простая повествовательная формула передаёт последовательность событий и сохраняет местоименную отсылку к управляющему Иосифа.
- source_word: לָמָּה יְדַבֵּר
  choice: Почему ... говорит
  rationale: Прямой вопрос естественно звучит по-русски в настоящем времени и сохраняет недоумение говорящих.
- source_word: אֲדֹנִי
  choice: господин наш
  rationale: Здесь это почтительное обращение к человеку, а не божественный титул. Хотя еврейская форма буквально означает «мой господин», братья говорят как группа, поэтому русское «наш» естественно передаёт коллективную речь.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: такие слова
  rationale: Сохраняет явную отсылку к сказанному и естественно передаёт значение «слова, подобные этим».
- source_word: חָלִילָה
  choice: Немыслимо
  rationale: Сильное восклицание решительного отвержения передано современно и торжественно, без добавления отсутствующей в тексте ссылки на Бога или небо.
- source_word: לַעֲבָדֶיךָ
  choice: рабы твои
  rationale: В контексте это почтительное самоназвание подчинённых. «Рабы твои» сохраняет социальную и риторическую силу עֲבָדֶיךָ лучше, чем более мягкое «слуги».
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: чтобы ... сделали такое
  rationale: Естественная русская конструкция после «немыслимо» точно передаёт категорическое отрицание возможности такого поступка.
