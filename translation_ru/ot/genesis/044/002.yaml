base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: ru
  text: «А мою чашу, серебряную чашу, положи в отверстие[a] мешка младшего вместе с серебром за купленное им зерно[b]». И он сделал так, как сказал Иосиф.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в уста мешка», то есть в его отверстие.'
    reason: cultural_note
  - marker: b
    text: 'Или: «вместе с деньгами за купленное им зерно». Еврейское выражение говорит о серебре как плате за купленное зерно или провизию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: мою чашу, серебряную чашу
  rationale: גְּבִיעַ обозначает чашу или кубок. «Чаша» естественна в современном русском, а приложение сохраняет подчёркнутый повтор еврейского текста.
- source_word: תָּשִׂים
  choice: положи
  rationale: Обычное значение שׂים — «класть, помещать»; повелительная форма передана прямо и естественно.
- source_word: בְּפִי אַמְתַּחַת
  choice: в горловину мешка
  rationale: Буквально сказано «в уста мешка». «Горловина» сохраняет телесный образ и при этом ясно обозначает отверстие мешка.
- source_word: הַקָּטֹן
  choice: младшего
  rationale: Буквально «малого/младшего»; в контексте речь идёт о младшем из братьев. Существительное не добавлено, поскольку адресат однозначен.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: серебром, отданным им за зерно
  rationale: כֶּסֶף может означать как серебро, так и деньги, а שִׁבְרוֹ в рассказе о голоде относится к купленному зерну или продовольствию. Формулировка сохраняет материальный образ серебра и торговый смысл.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: И он сделал так, как сказал Иосиф
  rationale: Естественная русская передача еврейской формулы «сделал по слову Иосифа, которое он сказал» без истолковывающего усиления «велел».
