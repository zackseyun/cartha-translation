lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: когда рассвело
  rationale: Естественно передаёт временную конструкцию и глагольное значение появления дневного света, не меняя последовательности событий.
- source_word: וְהָאֲנָשִׁים
  choice: мужчин
  rationale: Определённая группа уже известных из контекста людей; винительный падеж обусловлен русской пассивно-безличной конструкцией «мужчин отпустили».
- source_word: שֻׁלְּחוּ
  choice: отпустили
  rationale: Передаёт смысл отправления прочь. Русская неопределённо-личная форма звучит естественнее буквального пассива «были отпущены» и не называет деятеля, как и еврейский пассив.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: их и их ослов
  rationale: Сохраняет присоединённое перечисление самих мужчин и принадлежавших им ослов; тире естественно оформляет пояснение по-русски.
