  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: ru
  text: 'Тогда Иуда подошёл к нему и сказал: «Прошу, господин мой, позволь рабу твоему сказать слово так, чтобы господин мой услышал[a], и пусть не воспылает твой гнев на раба твоего[b], ведь ты — как фараон».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сказать слово в уши господина моего» — еврейское выражение со значением «сказать так, чтобы господин услышал».'
    reason: cultural_note
  - marker: b
    text: 'Или: «и не гневайся на раба твоего». Буквально: «и пусть не разгорится твой гнев на раба твоего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  choice: подошёл к нему
  rationale: Передаёт конкретное приближение Иуды к Иосифу и естественно звучит в современном русском повествовании.
- source_word: בִּי אֲדֹנִי
  choice: Прошу, господин мой
  rationale: בִּי здесь служит почтительной формулой просьбы; «прошу» сохраняет уважительный тон без архаизации.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: позволь рабу твоему сказать слово
  rationale: Сохраняет вежливую просьбу, самоуничижительное обозначение говорящего как раба и единственное число דָבָר.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: так, чтобы господин мой услышал
  rationale: Естественно передаёт еврейскую идиому «в уши господина моего», не воспроизводя её в неясной для современного русского читателя форме.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: и пусть не воспылает твой гнев на раба твоего
  rationale: Сохраняет образ горящего гнева и направление гнева против говорящего; «воспылает» поддерживает достоинство и торжественность речи.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: ведь ты — как фараон
  rationale: Прямо сохраняет сравнение и не усиливает его до утверждения полного равенства Иосифа фараону.
theological_decisions:
- issue: Смысл сравнения Иосифа с фараоном
  choice: ведь ты — как фараон
  alternative: ведь ты равен фараону
  rationale: Исходный текст выражает сравнение статуса или власти; перевод не должен уточнять его как абсолютное равенство.
translation_notes:
  register: Современный литературный русский с сохранением торжественной придворной учтивости. Формы «господин мой» и «раб твой» передают повторяющуюся почтительную самоидентификацию Иуды; образ горящего гнева сохранён без чрезмерной архаики.
