  source_fidelity: 'В первой части черновик существенно искажает синтаксис: הֲלֹא זֶה требует конструкции «Разве это не та чаша...», а не вопроса «Разве не из этой чаши...». Кроме того, союз וְהוּא не содержит отрицания, поэтому «и не по ней» неверно. Исправленный текст сохраняет риторический вопрос, инструментальное значение בּוֹ и усиление инфинитива абсолютного.'
  naturalness: «Та чаша, из которой пьёт мой господин и с помощью которой он действительно гадает» — естественная современная литературная русская фраза. «Вы сделали зло, поступив так» также идиоматично и уместно передаёт заключительную оценку поступка.
  terminology: «Мой господин» адекватно передаёт социальное אֲדֹנִי в речи слуги. «Гадает» прямо передаёт נחש в утверждении персонажа, не разрешая вопрос о том, действительно ли Иосиф занимался гаданием.
