base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: ru
  text: Разве это не та чаша, из которой пьёт мой господин и с помощью которой он действительно гадает?[a] Вы сделали зло, поступив так.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и с её помощью он наверняка гадает». В еврейском тексте абсолютный инфинитив соединён с личной формой глагола для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «Вы сделали зло в том, что сделали».'
    reason: literal_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: Разве не из этой чаши
  rationale: הֲלֹא вводит риторический вопрос, предполагающий утвердительный ответ. Указательное זֶה относится к чаше из предыдущего стиха; явное существительное делает русскую фразу естественной и однозначной.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: из этой чаши пьёт мой господин
  rationale: Предлог ב при глаголе «пить» здесь по-русски естественно передаётся как «из». אֲדֹנִי — обращение к хозяину в социальной, а не богословской сфере, поэтому выбрано «мой господин».
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: и не по ней он непременно гадает
  rationale: «По ней гадать» естественно передаёт использование чаши как средства гадания. Сочетание абсолютного инфинитива с личной формой усиливает глагольное действие; это отражено словом «непременно». Местоимение וְהוּא сохранено как «он».
- source_word: הֲרֵעֹתֶם
  choice: Вы сделали зло
  rationale: Форма породы hифиль от רעע выражает совершение дурного или злого поступка. «Сделали зло» сохраняет нравственную весомость исходного выражения.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: поступив так
  rationale: Относительное придаточное уточняет только что совершённое действие. «Поступив так» передаёт смысл естественно по-русски и избегает тяжеловесного повтора «сделали зло в том, что сделали».
theological_decisions:
- issue: Следует ли представлять Иосифа действительно занимавшимся гаданием или понимать слова как часть его испытания братьев
  choice: 'Утверждение слуги в прямой речи передано прямо: «он непременно гадает».'
  alternative: Смягчить формулировку так, чтобы она обозначала лишь репутацию Иосифа или разыгрываемую им роль.
  rationale: Древнееврейский текст прямо вкладывает утверждение о гадании в уста слуги. Перевод сохраняет это утверждение как элемент речи персонажа, не решая за читателя, описывает ли оно действительную практику Иосифа.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Риторический вопрос сохранён; «мой господин» соответствует социальной речи управляющего. Формулировка о гадании не смягчена и не истолкована конфессионально.
