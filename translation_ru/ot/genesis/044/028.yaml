  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: ru
  text: 'Один ушёл от меня, и я сказал: «Верно, его растерзали». С тех пор я его не видел.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: Один ушёл от меня
  rationale: Передаёт буквальное движение прочь от говорящего и естественно звучит по-русски; определённый артикль при אֶחָד указывает на одного из двух ранее названных сыновей, но по контексту достаточно «один».
- source_word: אַךְ טָרֹף טֹרָף
  choice: Верно, его растерзал зверь
  rationale: אַךְ выражает уверенность, а инфинитив абсолютный с личной формой усиливает утверждение. Пассивная конструкция подразумевает растерзание диким животным; слово «зверь» добавлено для естественного русского выражения смысла.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: С тех пор я его не видел
  rationale: Идиоматически передаёт «я не видел его доныне» и ясно связывает отсутствие встреч с предполагаемой гибелью.
