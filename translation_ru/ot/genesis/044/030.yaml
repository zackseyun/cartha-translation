base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: ru
  text: И теперь, когда я приду к твоему слуге, моему отцу, и юноши не будет с нами, а жизнь отца связана с жизнью юноши[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его душа связана с его душой». Еврейское נֶפֶשׁ может означать «душа», «жизнь» или самого человека; первое местоимение относится к отцу, второе — по контексту к юноше, Вениамину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительное וְ, так и переход к следующему этапу просьбы Иуды.
- source_word: כְּבֹאִי
  choice: когда я приду
  rationale: Предлог כְּ с инфинитивом и суффиксом первого лица выражает будущее временное обстоятельство.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: к твоему слуге, моему отцу
  rationale: Передаёт почтительное обозначение Иаковом себя как слуги Иосифа и ясно оформляет приложение.
- source_word: הַנַּעַר
  choice: юноша
  rationale: נַעַר здесь обозначает Вениамина как младшего сына, но не обязательно ребёнка; «юноша» естественнее и точнее современного русского «мальчик».
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: не будет с нами
  rationale: В составе будущей ситуации по-русски требуется будущее время, хотя еврейская именная конструкция буквально означает «его нет с нами».
- source_word: נַפְשׁוֹ
  choice: жизнь отца
  rationale: נֶפֶשׁ в данном контексте означает жизнь, само существование и глубокую личную привязанность; явное «отца» устраняет неестественную для русского двусмысленность местоимения.
- source_word: קְשׁוּרָה בְנַפְשׁוֹ
  choice: связана с жизнью юноши
  rationale: Сохраняет образ прочной связи и контекстуально раскрывает, что второе местоимение относится к Вениамину.
theological_decisions:
- issue: Характер связи между отсутствием Вениамина и состоянием Иакова
  choice: Обстоятельственная фраза, выделенная тире, без явного причинного союза
  alternative: «поскольку жизнь отца связана с жизнью юноши» или «ведь жизнь отца связана…»
  rationale: Еврейское וְ с причастной конструкцией допускает пояснительный или причинный оттенок, но не выражает причинность однозначно; пунктуация сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский с сохранением почтительной придворной формулы «твой слуга». Стих оставлен синтаксически незавершённым, поскольку условная конструкция продолжается в Бытии 44:31.
