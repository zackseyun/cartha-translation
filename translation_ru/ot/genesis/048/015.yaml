  source_fidelity: 'Смысловые компоненты еврейского текста переданы верно: Иосиф назван прямо; сохранены оба параллельных определения Бога, идиома «ходить перед» и пастушеский образ. Однако «пасущий меня» в современном русском обычно воспринимается как действие, происходящее сейчас, и по отношению к человеку может звучать неестественно или двусмысленно («кормящий/пасущий»). Еврейское причастие описывает Божье длительное попечение на протяжении жизни Иакова; русский прошедший действительный оборот «пасший меня» лучше выражает этот охват до настоящего дня, не устраняя образ пастыря.'
