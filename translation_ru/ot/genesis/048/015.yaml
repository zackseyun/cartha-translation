  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: ru
  text: 'И он благословил Иосифа и сказал: «Бог, перед Которым ходили мои отцы Авраам и Исаак, Бог, пасший меня[a] от начала моей жизни[b] до нынешнего дня,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бывший моим Пастырем»; возможно также: «питавший меня». Еврейский глагол изображает постоянную заботу пастуха о стаде, включая попечение и обеспечение пищей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всю мою жизнь». Еврейское выражение указывает на самое начало жизни Иакова и подчёркивает, что Бог заботился о нём с первых дней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת־יוֹסֵף
  choice: И он благословил Иосифа
  rationale: Сохранено прямое указание еврейского текста на Иосифа, хотя из контекста видно, что благословение относится и к его сыновьям; контекстуальная трудность не сглаживается.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В русском языке определённость еврейской формы естественно передаётся контекстом и двумя параллельными определительными оборотами; вариант «тот Бог» внёс бы излишнее противопоставление.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: перед Которым ходили мои отцы
  rationale: Сохранена библейская метафора жизненного пути перед Богом — жизни в Его присутствии, а не только более узкое значение послушания или следования.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Авраам и Исаак
  rationale: Употреблены традиционные и общеупотребительные русские формы имён.
- source_word: הָרֹעֶה אֹתִי
  choice: пасущий меня
  rationale: Активное причастие сохраняет пастушеский образ и длительный характер Божьей заботы, не сводя выражение лишь к обеспечению пищей.
- source_word: מֵעוֹדִי
  choice: с самого начала моей жизни
  rationale: Фраза естественно передаёт заботу Бога с начала существования Иакова и не сужает смысл до юности или одного момента рождения.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и до этого дня
  rationale: Передана непрерывность Божьей заботы от начала жизни до настоящего момента.
theological_decisions:
- issue: Образ хождения перед Богом
  choice: перед Которым ходили мои отцы Авраам и Исаак
  alternative: в присутствии Которого жили мои отцы Авраам и Исаак
  rationale: Сохранён ёмкий библейский образ отношений с Богом и жизненного пути перед Ним, без сведения его только к повиновению.
- issue: Образ Бога как пастыря
  choice: Бог, пасущий меня
  alternative: Бог, бывший моим Пастырем; Бог, питавший меня
  rationale: Выбранный вариант сохраняет активную силу еврейского причастия и пастырскую метафору продолжающейся заботы, не превращая её исключительно в титул и не ограничивая кормлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм обращения сохранён. Заглавная буква в относительном местоимении «Которым» поддерживает принятую в русском религиозном письме почтительную норму. Конечная запятая отражает незавершённость благословения, которое продолжается в следующем стихе.
