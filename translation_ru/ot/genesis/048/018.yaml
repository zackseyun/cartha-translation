  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: ru
  text: 'Иосиф сказал своему отцу: «Не так, отец мой! Ведь этот — первенец. Положи правую руку ему на голову».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Последовательная форма продвигает повествование; в современном русском отдельный союз «и» здесь необязателен.
- source_word: אֶל אָבִיו
  choice: отцу
  rationale: Естественно передаёт направление речи и принадлежность, очевидную из контекста.
- source_word: לֹא כֵן
  choice: Не так
  rationale: Кратко и прямо выражает почтительное возражение Иосифа без излишнего усиления.
- source_word: אָבִי
  choice: отец мой
  rationale: Сохраняет суффикс первого лица и уважительное обращение; порядок слов придаёт речи сдержанно-торжественный оттенок.
- source_word: כִּי זֶה הַבְּכֹר
  choice: Этот — первенец
  rationale: כִּי вводит основание возражения, которое в естественной русской прямой речи можно выразить без отдельного «ведь»; указательное «этот» сохраняет жестовую конкретность, а «первенец» — статус рождения.
- source_word: שִׂים יְמִינְךָ
  choice: Положи правую руку
  rationale: Естественно передаёт повеление и явно называет руку, подразумеваемую словом יָמִין.
- source_word: עַל רֹאשׁוֹ
  choice: ему на голову
  rationale: Идиоматический современный русский способ обозначить возложение руки на голову.
theological_decisions:
- issue: Статусный термин в контексте благословения
  choice: первенец
  alternative: старший
  rationale: «Первенец» сохраняет не только порядок рождения, но и семейно-правовой смысл בכור, существенный для сцены благословения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь краткая и почтительная; архаизмы и конфессионально окрашенные добавления отсутствуют.
