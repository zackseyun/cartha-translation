revisions:
- from: А дети, которые родятся у тебя после них, будут твоими[a]; при получении своего наследия они будут называться именем своих братьев.[b]
  to: А дети, которых ты родил после них, будут твоими[a]; в своём наследственном уделе они будут называться именем своих братьев.[b]
  rationale: Исправлены время и значение двух выражений в соответствии с еврейским текстом. «Которых ты родил» передаёт обращённый к Иосифу хифиль ילד без неестественного в русском «которых ты произвёл на свет». «В своём наследственном уделе» сохраняет связь именования с уделом; сноска, не подменяя перевод, поясняет предполагаемый племенной смысл.
