base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: ru
  text: А дети, которых ты родил после них, будут твоими[a]; в своём наследственном уделе они будут называться именем своих братьев.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, в отличие от Ефрема и Манассии, которых Иаков признал своими сыновьями (ст. 5), эти дети остаются детьми Иосифа.
    reason: cross_reference
  - marker: b
    text: То есть они не получат отдельных племенных уделов, а будут причислены к племенам Ефрема и Манассии.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: А дети
  rationale: В данном контексте существительное обозначает потомство Иосифа, родившееся после Ефрема и Манассии. «Дети» естественно для современного русского языка и не расширяет значение до отдалённых потомков.
- source_word: אֲשֶׁר הוֹלַדְתָּ אַחֲרֵיהֶם
  choice: которые родятся у тебя после них
  rationale: Еврейский хифиль от ילד описывает отцовство Иосифа; русское «родятся у тебя» естественно передаёт эту перспективу без неуместного архаизма «родишь». Будущая форма соответствует тому, что речь идёт о последующих детях.
- source_word: לְךָ יִהְיוּ
  choice: будут твоими
  rationale: Кратко и непосредственно передаёт семейно-правовую принадлежность Иосифу в противопоставлении Ефрему и Манассии, которых Иаков только что признал своими.
- source_word: עַל שֵׁם אֲחֵיהֶם יִקָּרְאוּ
  choice: они будут называться именем своих братьев
  rationale: Сохраняется буквальный образ именования и слово «братья», тогда как контекстуальный смысл учёта в составе племён поясняется в сноске.
- source_word: בְּנַחֲלָתָם
  choice: при получении своего наследия
  rationale: Формулировка естественно связывает именование с распределением наследственного удела. Местоимение «своего» сохраняет возможную соотнесённость множественного суффикса с названными потомками, не подменяя текст толкованием.
theological_decisions:
- issue: Статус позднейших детей Иосифа при разделе земли
  choice: Основной текст сохраняет формулу «будут твоими» и образ именования именем братьев; практический смысл вынесен в сноску.
  alternative: 'Прямо перевести: «они будут причислены к Ефрему и Манассии и получат наследие вместе с ними».'
  rationale: Еврейский текст подразумевает племенной и наследственный статус, но не называет Ефрема и Манассию повторно и не формулирует вывод столь явно. Сноска разъясняет контекст, не превращая толкование в перевод.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достоинственный. Синтаксис слегка перестроен ради естественности: обстоятельство наследования поставлено перед сказуемым. Буквальные родственные обозначения сохранены, а подразумеваемое устройство племенных уделов пояснено в сносках.'
