  yaml_path: translation/ot/genesis/048/008.yaml
  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: ru
  text: 'Увидев сыновей Иосифа, Израиль спросил: «Кто это?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Увидев
  rationale: 'Деепричастная конструкция естественно передаёт последовательность повествования: увидев сыновей, Израиль задал вопрос.'
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя патриарха; замена на «Иаков» устранила бы значимую особенность оригинала.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке.
- source_word: בְּנֵי יוֹסֵף
  choice: сыновей Иосифа
  rationale: Естественная русская передача еврейской сопряжённой конструкции «сыновья Иосифа» с учётом требуемого падежа.
- source_word: וַיֹּאמֶר
  choice: спросил
  rationale: Буквально «сказал», но следующая прямая речь является вопросом; «спросил» естественно и точно передаёт речевое действие.
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение запрашивает личность находящихся перед Израилем людей.
- source_word: אֵלֶּה
  choice: это
  rationale: В русском вопрос «Кто это?» идиоматичен при указании на нескольких лиц; форма «эти» без существительного здесь неестественна.
theological_decisions: []
