base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: ru
  text: Израиль протянул правую руку и возложил её на голову Ефрема, хотя тот был младшим, а левую — на голову Манассии, скрестив руки[a], так как Манассия был первенцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «намеренно расположив руки». Еврейское выражение может подчёркивать осознанное, умелое расположение рук; из контекста следует, что при этом руки были скрещены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: протянул
  rationale: В сочетании с рукой глагол обозначает физическое протягивание; этот вариант естественен в современном русском языке.
- source_word: וַיָּשֶׁת
  choice: возложил
  rationale: Глагол означает «положил, поместил». «Возложил» точно и уместно передаёт осознанный жест благословения, сохраняя достоинство повествования.
- source_word: יְמִינוֹ
  choice: правую руку
  rationale: Явное обозначение руки передаёт еврейскую форму и проясняет жест.
- source_word: עַל רֹאשׁ
  choice: на голову
  rationale: Естественное русское обозначение возложения руки на голову.
- source_word: וְהוּא הַצָּעִיר
  choice: хотя тот был младшим
  rationale: 'Союз «хотя» передаёт обусловленный контекстом уступительный смысл: правая рука возлагается на младшего.'
- source_word: שְׂמֹאלוֹ
  choice: левую
  rationale: Слово «руку» ясно восстанавливается из параллельной конструкции; эллипсис звучит естественно по-русски.
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: скрестив руки
  rationale: В непосредственном контексте правая рука оказывается на стоящем напротив младшем, а левая — на первенце, поэтому выражение наиболее естественно описывает намеренное перекрещивание рук; возможная более общая семантика намеренного или умелого расположения сохранена в сноске.
- source_word: כִּי
  choice: так как
  rationale: Вводит объяснение необычного расположения рук.
- source_word: הַבְּכֹר
  choice: первенцем
  rationale: «Первенец» сохраняет культурно и повествовательно значимое указание на порядок рождения.
theological_decisions:
- issue: Толкование שִׂכֵּל אֶת יָדָיו
  choice: Израиль намеренно скрестил руки, благословляя Ефрема и Манассию.
  alternative: Израиль намеренно или умело расположил руки, без прямого утверждения об их перекрещивании.
  rationale: Контекст прямо указывает, что младший Ефрем получил правую руку, а первенец Манассия — левую. Это поддерживает перевод «скрестив руки», при этом лексическая неоднозначность отмечена в сноске без добавления позднейших доктринальных выводов.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Возложил» сохраняет достоинство сцены, оставаясь понятным современному читателю; имена переданы в принятой русской библейской форме: Ефрем и Манассия.'
