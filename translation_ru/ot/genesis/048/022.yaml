  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: ru
  text: Я же даю тебе один удел сверх того, что получают твои братья[a], — удел, который я взял из рук аморея своим мечом и своим луком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово שְׁכֶם (шехем) может означать «плечо», «склон, горный кряж» или «удел»; оно также совпадает с названием города Сихем. Здесь, возможно, намеренно подразумеваются и дополнительная доля Иосифа, и местность, позднее связанная с ним.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Я же
  rationale: Самостоятельное местоимение подчёркивает говорящего; частица «же» естественно передаёт это выделение в современном русском языке без тяжеловесного «я сам».
- source_word: נָתַתִּי
  choice: даю
  rationale: Перфект в контексте завещательного благословения может обозначать совершаемое самим высказыванием дарование; настоящее время ясно и естественно передаёт этот перформативный смысл.
- source_word: שְׁכֶם אַחַד
  choice: на один удел
  rationale: В данном контексте выражение указывает на дополнительную наследственную долю. Слово שְׁכֶם допускает также значения «плечо», «склон, горный кряж» и созвучно названию Сихем; эта намеренная многозначность сохранена в примечании.
- source_word: עַל אַחֶיךָ
  choice: больше, чем твоим братьям
  rationale: 'Предлог עַל выражает преимущество или добавление: Иосиф получает одну долю сверх долей братьев. Такая русская конструкция передаёт сравнительный смысл естественнее буквального «над твоими братьями».'
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: тот, который я взял
  rationale: Местоимение «тот» однозначно связывает относительное предложение с уделом и сохраняет прямое значение глагола לקח.
- source_word: מִיַּד הָאֱמֹרִי
  choice: из рук аморея
  rationale: Еврейская идиома «из руки» означает из чьей-либо власти или владения. Русское множественное «из рук» идиоматично, а единственное число «аморея» сохраняет собирательную или представительскую форму оригинала.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: своим мечом и своим луком
  rationale: Оба оружия переданы буквально; повтор притяжательного местоимения сохраняет подчёркнутую параллельность еврейского выражения.
theological_decisions:
- issue: Многозначность שְׁכֶם и связь дополнительного удела Иосифа с местностью Сихем
  choice: В основном тексте передать наследственный смысл словом «удел», а игру значений и возможную отсылку к Сихему указать в сноске.
  alternative: «один склон» или «Сихем — один удел»
  rationale: Контекст поддерживает значение дополнительной наследственной доли, однако еврейское слово одновременно может обозначать плечо или склон и совпадает с названием Сихема. Сноска не позволяет переводу молча устранить эту многозначность и связь с землёй, позднее связанной с Иосифом.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Формулировка «Я же даю» сохраняет эмфазу без архаизации; «из рук аморея» удерживает образ оригинала, оставаясь понятной русской идиомой.
