  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: ru
  text: А что до меня, то, когда я пришёл из Паддана[a], Рахиль умерла при мне[b] в земле Ханаанской, в пути, когда до Ефрафы оставалось ещё некоторое расстояние[c]. Я похоронил её там, по дороге в Ефрафу, то есть в Вифлеем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит краткое название «Паддан», а не «Паддан-Арам».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «умерла на мне». Еврейское выражение может подчёркивать как то, что Рахиль умерла рядом с Иаковом, так и личную тяжесть её смерти для него.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское выражение обозначает остававшийся отрезок пути; его точная протяжённость неизвестна.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: А что до меня, то
  rationale: Самостоятельное местоимение с союзом вводит личное воспоминание Иакова и имеет тематически-выделительную силу.
- source_word: בְּבֹאִי מִפַּדָּן
  choice: когда я возвращался из Паддана
  rationale: Инфинитивная конструкция имеет временное значение; глагол «возвращался» естественно передаёт движение Иакова обратно в Ханаан, тогда как топоним воспроизведён ровно в краткой форме исходного текста.
- source_word: מֵתָה עָלַי
  choice: умерла при мне
  rationale: Буквально выражение допускает смысл «умерла на/при мне» и соединяет близость события к Иакову с его личной вовлечённостью, не сводя смысл исключительно к скорби.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: в земле Ханаанской
  rationale: Сохранена полная географическая формула исходного текста в естественном русском библейском регистре.
- source_word: בְּעוֹד כִּבְרַת־אֶרֶץ לָבֹא אֶפְרָתָה
  choice: когда до Ефрафы оставалось ещё некоторое расстояние
  rationale: Идиома обозначает остававшийся отрезок пути, точная протяжённость которого неизвестна; перевод не создаёт ложной точности.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: Я похоронил её там
  rationale: Прямо и естественно передаёт последовательное повествовательное действие и указание места.
- source_word: בְּדֶרֶךְ אֶפְרָת הִוא בֵּית לָחֶם
  choice: по дороге в Ефрафу, то есть в Вифлеем
  rationale: Переданы и обозначение пути, и поясняющее отождествление Ефрафы с Вифлеемом.
theological_decisions:
- issue: Значение выражения מֵתָה עָלַי
  choice: умерла при мне
  alternative: умерла, причинив мне скорбь
  rationale: Исходная идиома неоднозначна и может указывать как на смерть рядом с Иаковом, так и на её тяжесть для него. Основной текст сохраняет пространственно-личный смысл, а эмоциональная трактовка отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис разделён на два предложения для ясности; имена переданы в привычной русской библейской форме. Неоднозначность идиомы о смерти Рахили сохранена и пояснена сноской.
