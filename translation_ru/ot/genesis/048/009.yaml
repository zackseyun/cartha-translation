base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: ru
  text: 'Иосиф сказал своему отцу: «Это мои сыновья, которых Бог дал мне здесь[a]». Отец сказал: «Подведи их, пожалуйста, ко мне, и я благословлю их[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этом месте». Еврейское выражение может более определённо указывать на место, где тогда находился Иосиф.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Подведи их, пожалуйста, ко мне, чтобы я благословил их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל אָבִיו
  choice: Иосиф сказал своему отцу
  rationale: Простая повествовательная формула естественно передаёт еврейскую конструкцию с последовательным וַ; «отцу» сохраняет достойный литературный регистр.
- source_word: בָּנַי הֵם
  choice: Это мои сыновья
  rationale: Именное предложение отождествляет находящихся перед Иаковом юношей с сыновьями Иосифа; «сыновья» точно передаёт мужской род и множественное число.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: которых Бог дал мне
  rationale: Формулировка сохраняет образ детей как Божьего дара и ясно относит местоимение к сыновьям.
- source_word: בָּזֶה
  choice: здесь
  rationale: Указательное наречное выражение наиболее естественно понимается как ссылка на нынешнее место жизни Иосифа, то есть Египет; более буквальная пространственная формулировка вынесена в примечание.
- source_word: קָחֶם נָא אֵלַי
  choice: Подведи их, пожалуйста, ко мне
  rationale: Хотя לקח обычно означает «брать», направление אֵלַי и ситуация благословения требуют движения сыновей к Иакову; «подведи» естественно передаёт это в русском, а «пожалуйста» отражает вежливую частицу נָא.
- source_word: וַאֲבָרֲכֵם
  choice: и я благословлю их
  rationale: Форма выражает намерение, следующее за просьбой; сочинительная конструкция близка еврейскому тексту и естественна по-русски.
theological_decisions:
- issue: Значение אֱלֹהִים в словах Иосифа
  choice: Бог — единый Бог, которому Иосиф приписывает дар сыновей
  alternative: бог или боги в общем смысле
  rationale: Контекст повествования об Иосифе и патриархах однозначно указывает на Бога Израиля; перевод не добавляет дальнейшей конфессиональной интерпретации.
- issue: Связь благословения с просьбой подвести сыновей
  choice: «и я благословлю их» как выражение намерения
  alternative: «чтобы мне благословить их»
  rationale: Обе конструкции возможны; выбранная сохраняет последовательность еврейских форм и прямоту речи, не меняя богословского содержания.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. Местоимение «Тот» во второй реплике устраняет неестественное повторение и по контексту ясно указывает на отца Иосифа. Маркер [a] поставлен при слове «здесь», к которому относится примечание.
