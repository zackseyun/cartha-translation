    issue: Неоднозначность выражения «родившиеся у тебя».
    rationale: В современном русском оборот может восприниматься локально («родившиеся у тебя, в твоём доме»), а не как указание, что это сыновья Иосифа. Нужна более ясная конструкция.
  - severity: low
    issue: Неестественная форма «в Египетской земле».
    rationale: Это калькирующее и стилистически тяжеловесное сочетание. «В земле Египта» сохраняет лексему אֶרֶץ и лучше соответствует целевому современному литературному регистру.
