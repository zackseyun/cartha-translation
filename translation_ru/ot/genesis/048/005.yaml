  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: ru
  text: И теперь два твоих сына, которые родились у тебя в земле Египта до того, как я пришёл к тебе в Египет[a], — мои; Ефрем и Манассия будут моими, как Рувим и Симеон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до моего прихода к тебе в Египет». В данном контексте имеются в виду сыновья, родившиеся прежде прибытия Иакова.'
    reason: lexical_alternative
  - marker: b
    text: То есть Ефрем и Манассия будут считаться собственными сыновьями Иакова и получат положение, сопоставимое с положением Рувима и Симеона.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет связь с предшествующей речью и вводит новое торжественное заявление Иакова.
- source_word: שְׁנֵי בָנֶיךָ
  choice: два твоих сына
  rationale: Прямо передаёт число и принадлежность естественным русским порядком слов.
- source_word: הַנּוֹלָדִים לְךָ
  choice: родившиеся у тебя
  rationale: Причастный оборот передаёт атрибутивное значение еврейского пассивного причастия и естественно указывает на сыновнее отношение к Иосифу.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в Египетской земле
  rationale: Сохраняет явно присутствующее в еврейском тексте слово «земля», не сводя выражение просто к «в Египте».
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרַיְמָה
  choice: до того, как я пришёл к тебе в Египет
  rationale: В контексте выражение очерчивает круг сыновей, родившихся прежде прибытия Иакова; примечание сохраняет более формальную передачу временного оборота.
- source_word: לִי הֵם
  choice: мои
  rationale: Кратко и выразительно передаёт заявление Иакова об их принадлежности к числу его собственных сыновей.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Ефрем и Манассия
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: как Рувим и Симеон
  rationale: Предлог כְּ выражает сопоставление их статуса со статусом родных сыновей Иакова.
- source_word: יִהְיוּ לִי
  choice: будут моими
  rationale: Сохраняет будущее время, торжественный характер заявления и повтор формулы принадлежности.
theological_decisions:
- issue: Характер притязания Иакова на Ефрема и Манассию
  choice: Передать буквально как «мои» и «будут моими», пояснив подразумеваемый статус в примечании.
  alternative: «Я усыновляю их» или «они считаются моими сыновьями».
  rationale: Смысл включения Ефрема и Манассии в число сыновей Иакова ясен из сравнения с Рувимом и Симеоном, однако еврейский текст не употребляет технического термина усыновления; поэтому механизм не уточняется сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксический повтор «мои… будут моими» сохранён как значимый элемент оригинала; имена даны в общеупотребительных русских библейских формах.
