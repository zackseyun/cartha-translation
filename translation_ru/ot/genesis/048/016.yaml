base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: ru
  text: Ангел, избавлявший меня от всякого зла[a], да благословит этих юношей. Да будут они носить моё имя и имя моих отцов — Авраама и Исаака[b], и да умножатся они необычайно[c] на земле[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всякой беды», «от всякого несчастья». Еврейское слово может обозначать и нравственное зло, и бедствие или вред.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «да будут названы на них моё имя и имя моих отцов — Авраама и Исаака». Речь может идти о принадлежности к роду и наследовании его имени.'
    reason: lexical_alternative
  - marker: c
    text: Редкий еврейский глагол означает обильное умножение и, вероятно, заключает в себе образ множества рыб.
    reason: lexical_alternative
  - marker: d
    text: 'Или: «в стране». Буквально: «среди (внутри) земли». Еврейское слово может означать как землю вообще, так и определённую страну.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: Ангел
  rationale: מַלְאָךְ может означать «вестник» или «ангел»; в данном повествовательном и богословском контексте «Ангел» естественно передаёт традиционный смысл, не уточняя его природу.
- source_word: הַגֹּאֵל אֹתִי
  choice: избавлявший меня
  rationale: Причастие גאל обозначает действующего избавителя или искупителя. Несовершенный вид по-русски передаёт продолжительное действие, охватывающее прожитую Иаковом жизнь, а «избавлявший» здесь естественнее, чем терминологически более узкое «искупавший».
- source_word: מִכָּל רָע
  choice: от всякого зла
  rationale: רָע охватывает как зло, так и беду, вред или несчастье. «От всякого зла» сохраняет широту исходного выражения; контекстуальные оттенки отмечены в сноске.
- source_word: יְבָרֵךְ
  choice: да благословит
  rationale: Форма yiqtol имеет здесь пожелательно-юссивное значение; конструкция с «да» уместна для торжественного благословения и понятна современному читателю.
- source_word: הַנְּעָרִים
  choice: этих юношей
  rationale: Слово относится к Ефрему и Манассии. «Юношей» звучит достойно и естественно; указательное «этих» передаёт определённость и непосредственную ситуацию благословения.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: да будут они носить моё имя и имя моих отцов
  rationale: Буквально имя должно быть «названо на них». Русский идиоматический оборот «носить имя» передаёт принадлежность к роду и наследование имени, не перегружая основной текст калькой; буквальная форма приведена в сноске.
- source_word: וְיִדְגּוּ לָרֹב
  choice: да умножатся они необычайно
  rationale: Редкий глагол דגה выражает обильное размножение и, вероятно, вызывает образ множества рыб. Основной текст передаёт результат естественно, а образная этимология поясняется в сноске.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: посреди земли
  rationale: אָרֶץ может обозначать как конкретную землю, так и землю вообще. Формулировка «посреди земли» сохраняет эту возможную широту лучше, чем уточняющее название определённой страны.
theological_decisions:
- issue: Кем является «Ангел» в благословении Иакова
  choice: Сохранить обозначение «Ангел», не уточняя его природу и тождество.
  alternative: Истолковать его либо как явление самого Бога, либо как сотворённого небесного посланника, действующего от имени Бога.
  rationale: Текст тесно связывает Ангела с Божьим хранением и допускает обращённое к нему благословение, но прямо не определяет его онтологическую природу. Перевод сохраняет эту богословскую напряжённость.
- issue: Значение גאל применительно к Ангелу
  choice: Передать как «избавлявший», сохраняя действие спасения от бед.
  alternative: «Искупавший меня» или «мой Искупитель».
  rationale: Корень גאל имеет насыщенный смысл избавления и родственного заступничества, однако в сочетании «от всякого зла» на первом плане находится пережитое Иаковом избавление от бед. Выбор не исключает более глубоких ассоциаций корня, но и не навязывает позднейшую терминологию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом благословения. Конструкция «да благословит / да будут / да умножатся» сохраняет молитвенно-пожелательный характер, оставаясь понятной. Архаизмы и конфессионально маркированные уточнения исключены.
