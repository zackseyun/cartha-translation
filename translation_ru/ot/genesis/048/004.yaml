base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: ru
  text: 'И Он сказал мне: «Вот, Я сделаю тебя плодовитым и многочисленным, сделаю тебя сообществом народов и дам эту землю твоим потомкам после тебя в вечное владение».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: «Вот, Я»
  rationale: Передаёт указательно-эмфатическую функцию оборота и естественно вводит прямую речь Бога.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: «сделаю тебя плодовитым и многочисленным»
  rationale: Сохраняет два параллельных обещания — плодородия и умножения — в ясной современной формулировке.
- source_word: וּנְתַתִּיךָ לִקְהַל עַמִּים
  choice: «произведу от тебя собрание народов»
  rationale: Еврейская конструкция буквально означает назначение или превращение адресата в собрание народов; формулировка «произведу от тебя» естественно выражает потомственный смысл, не сводя множественное עַמִּים к одному народу.
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: «твоим потомкам после тебя»
  rationale: Коллективное זֶרַע в данном контексте обозначает потомство; множественное «потомкам» звучит естественно и согласуется с адресатом обещания земли.
- source_word: אֲחֻזַּת עוֹלָם
  choice: «в вечное владение»
  rationale: Сохраняет традиционный и контекстуально уместный смысл длительного, непреходящего наследственного обладания.
theological_decisions:
- issue: Смысл обещания о «собрании народов»
  choice: Сохранено множественное число «народов» без уточнения их идентичности.
  alternative: Истолковать выражение как конкретные племена Израиля или как народы вообще.
  rationale: Сам стих не раскрывает состав собрания, поэтому перевод не должен заранее разрешать эту богословско-историческую неоднозначность.
- issue: Продолжительность владения землёй
  choice: «вечное владение»
  alternative: «владение навеки» или «непреходящее владение»
  rationale: Так сохраняется сила עוֹלָם без добавления условий или богословских оговорок, отсутствующих в тексте.
translation_notes:
  register: Современный литературный русский язык с торжественностью, соответствующей патриархальному обещанию. Синтаксис прямой речи ясен для широкого читателя; архаизмы и конфессионально маркированная терминология не используются.
