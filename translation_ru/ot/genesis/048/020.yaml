  text: וַ/יְבָ֨רֲכֵ֜/ם בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמוֹר֒ בְּ/ךָ֗ יְבָרֵ֤ךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יְשִֽׂמְ/ךָ֣ אֱלֹהִ֔ים כְּ/אֶפְרַ֖יִם וְ/כִ/מְנַשֶּׁ֑ה וַ/יָּ֥שֶׂם אֶת אֶפְרַ֖יִם לִ/פְנֵ֥י מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: ru
  text: 'И благословил их в тот день, сказав: «Тобой[a] Израиль будет благословлять, говоря: „Да сделает тебя Бог таким, как Ефрем и Манассия“». И поставил Ефрема перед Манассией.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «В тебе Израиль будет благословлять». То есть при благословении будут произносить: «Да сделает тебя Бог таким, как Ефрем и Манассия».'
    reason: Лексическая неоднозначность предлога בְּ и непривычность буквального оборота в русском языке.
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: И благословил он их
  rationale: Пиэль глагола ברך означает «благословлять»; местоименный суффикс множественного числа относится к Ефрему и Манассии.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача определённого обстоятельства времени.
- source_word: לֵאמֹר
  choice: такими словами / говоря
  rationale: Два вхождения еврейской формулы введения речи переданы без тяжеловесного повтора «сказав… сказав», при этом сохранена структура цитаты и формулы благословения.
- source_word: בְּךָ
  choice: Тобою
  rationale: 'Сохранены предлог ב и единственное число суффикса; форма допускает инструментально-референциальный смысл: Израиль будет благословлять, обращаясь к этому образцу.'
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: будет благословлять Израиль
  rationale: Имперфект передаёт будущее или обычное действие; «Израиль» оставлен без уточняющего перифраза.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Да сделает тебя Бог таким
  rationale: В контексте благословения форма выражает пожелание; שׂים здесь естественно передаётся как «сделать таким».
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: как Ефрем и Манассия
  rationale: Сравнение передано ясно и естественно для современного русского языка; оба имени сохранены в заданном порядке.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: И поставил он Ефрема перед Манассией
  rationale: Буквальный пространственный образ «поставить перед» сохраняет подразумеваемое первенство Ефрема, не сводя смысл только к рангу.
theological_decisions:
- issue: Кого обозначает «Израиль» в формуле благословения
  choice: Сохранено имя «Израиль» без поясняющего дополнения.
  alternative: «народ Израиля» или «Иаков»
  rationale: Еврейский текст допускает отзвук личного имени Иакова и одновременно указывает на будущий обычай Израиля как народа; перевод не устраняет эту смысловую напряжённость.
- issue: Единственное число в בְּךָ и יְשִׂמְךָ после благословения двух сыновей
  choice: 'Сохранено единственное число: «Тобою… тебя».'
  alternative: Множественное число «вами… вас» ради согласования с Ефремом и Манассией
  rationale: В масоретском тексте стоят формы единственного числа, вероятно относящие формулу к типичному человеку, которого будут благословлять; перевод сохраняет грамматическую особенность источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Инверсия «благословил он», «поставил он» поддерживает повествовательную связность и достоинство стиля, не вводя архаизмов.
