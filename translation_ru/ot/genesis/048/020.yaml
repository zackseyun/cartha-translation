  source_fidelity: 'Смысл и грамматические особенности еврейского текста в целом переданы точно: множественное «их», временное «в тот день», оставленное без расшифровки «Израиль», единственное число в «тобой/тебя» и предшествование Ефрема Манассии сохранены. Однако порядок слов «Тобою будет благословлять Израиль» в русском языке неоправданно затрудняет распознавание подлежащего. Перестановка «Тобой Израиль будет благословлять» точнее и яснее передаёт формулу, не снимая её синтаксической и референциальной неоднозначности.'
