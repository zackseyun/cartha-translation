base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: ru
  text: 'Но его отец отказался и сказал: «Знаю, сын мой, знаю. Он тоже станет народом, и он тоже станет великим. Однако его младший брат будет больше его, и его потомство станет полнотой народов[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «множеством народов». Буквально в еврейском тексте: «полнотой народов».'
    reason: Лексическая альтернатива поясняет необычное выражение מְלֹא הַגּוֹיִם, не устраняя его неоднозначности в основном тексте.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: отказался
  rationale: Глагол מאן обозначает сознательный отказ; в контексте Иаков отвергает попытку Иосифа переложить его руки.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Знаю, сын мой, знаю
  rationale: Сохранён эмфатический повтор; по-русски подразумеваемое дополнение не требуется.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Он тоже станет народом
  rationale: עָם передано основным коллективным значением «народ», а конструкция היה ל־ — естественным русским «станет».
- source_word: וְגַם הוּא יִגְדָּל
  choice: и он тоже станет великим
  rationale: גדל здесь указывает на возрастание в значимости и величии; «станет великим» передаёт будущую динамику.
- source_word: וְאוּלָם
  choice: Однако
  rationale: Союз выражает сильное противопоставление, не отменяя сказанного о Манассии.
- source_word: אָחִיו הַקָּטֹן
  choice: его младший брат
  rationale: קטן в семейном сопоставлении обозначает младшего по возрасту.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: станет больше него
  rationale: Сравнительная конструкция מן указывает на превосходство Ефрема над Манассией; формулировка сохраняет лексическую связь с גדל, не уточняя вид этого превосходства.
- source_word: וְזַרְעוֹ
  choice: и его потомство
  rationale: «Потомство» естественно передаёт собирательное единственное число זרע.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: станет полнотой народов
  rationale: Буквальное значение מְלֹא — «полнота, полное количество»; необычный образ сохранён, а более истолковывающее «множеством народов» вынесено в сноску.
theological_decisions:
- issue: Передача выражения מְלֹא הַגּוֹיִם
  choice: полнотой народов
  alternative: множеством народов
  rationale: Формулировка сохраняет неоднозначный еврейский образ и возможное межтекстовое звучание, не сводя его заранее только к численности потомков.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Эмфатический повтор сохранён; синтаксис сделан ясным для обычного читателя. Местоимения, относящиеся к людям, даны со строчной буквы по современной русской норме.
