  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: ru
  text: Иосиф отвёл их от колен Израиля[a] и поклонился до земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из пространства между его коленями»; возможно также: «от места рядом с его коленями». Еврейское выражение описывает близкое положение мальчиков у Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: отвёл
  rationale: 'Порода хифиль глагола יצא имеет каузативное значение: Иосиф вывел сыновей с места у Израиля. «Отвёл» естественно передаёт направленное перемещение в данной сцене.'
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к Ефрему и Манассии.
- source_word: מֵעִם בִּרְכָּיו
  choice: от колен Израиля
  rationale: Предлог מֵעִם буквально указывает на удаление от места рядом с кем-либо или чем-либо. Выражение описывает близкое положение сыновей Иосифа у колен Израиля; имя проясняет наиболее вероятный контекстуальный референт местоименного суффикса, не утверждая более узко, находились ли они между коленями или рядом с ними.
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонился
  rationale: Форма глагола שׁחה обозначает почтительное склонение или простирание; последующее «до земли» передаёт глубину поклона.
- source_word: לְאַפָּיו אָרְצָה
  choice: до земли
  rationale: Буквально лицо направлено к земле. Устойчивое русское выражение «поклонился до земли» естественно и точно передаёт жест глубокого почтения.
theological_decisions:
- issue: К кому относится суффикс в בִּרְכָּיו («его колен»)?
  choice: к Израилю (Иакову)
  alternative: к Иосифу
  rationale: По ходу повествования Иосиф отводит сыновей от Израиля после того, как тот приблизил их к себе. Поэтому наиболее естественный референт — Израиль; это контекстуальное, а не доктринальное решение.
- issue: Точная позиция сыновей у колен Израиля
  choice: сохранить общее значение «от колен»
  alternative: «из пространства между его коленями» или «от места рядом с его коленями»
  rationale: מֵעִם выражает исходное положение при ком-либо или возле чего-либо, но само по себе не требует значения «между». Основной текст сохраняет пространственную неопределённость, а сноска сообщает возможные конкретизации.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный регистр. Имя «Израиль» употреблено для ясности референта и согласуется с ближайшим контекстом главы. Формула «поклонился до земли» сохраняет достоинство и естественность библейского повествования.
