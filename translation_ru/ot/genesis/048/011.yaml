  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: ru
  text: 'И сказал Израиль Иосифу: «Я не ожидал увидеть твоё лицо[a], и вот, Бог дал мне увидеть даже твоих потомков».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не ожидал увидеть тебя». Буквально: «увидеть твоё лицо»; эта еврейская идиома означает увидеть человека лично.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Передаёт обычное повествовательное продвижение wayyiqtol и сохраняет связность еврейского рассказа.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя, без замены на «Иаков».
- source_word: רְאֹה פָנֶיךָ
  choice: увидеть твоё лицо
  rationale: Сохраняет конкретность и эмоциональную выразительность еврейской идиомы; по смыслу речь идёт о личной встрече.
- source_word: לֹא פִלָּלְתִּי
  choice: Я не надеялся
  rationale: В данном контексте глагол выражает не молитву, а ожидание или надежду на то, что событие произойдёт.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт поворот к неожиданному и подчёркивает удивление Израиля.
- source_word: הֶרְאָה אֹתִי
  choice: дал мне увидеть
  rationale: 'Естественно передаёт каузативную форму глагола ראה: Бог сделал эту встречу возможной.'
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Прямой перевод общего обозначения Бога, употреблённого в исходном тексте.
- source_word: גַּם
  choice: и
  rationale: В сочетании «и твоих потомков» частица выражает неожиданное добавление к уже полученному благу; этот оттенок поддерживается контекстом и конструкцией фразы.
- source_word: זַרְעֶךָ
  choice: твоих потомков
  rationale: Передаёт собирательное значение זרע естественным современным русским словом; в непосредственном контексте имеются в виду сыновья Иосифа.
theological_decisions:
- issue: Передача אֱלֹהִים в повествовании о патриархах
  choice: Бог
  alternative: Всевышний
  rationale: Исходный текст употребляет обычное обозначение Бога и не даёт основания вводить более специальный титул; фраза приписывает Богу дар неожиданной встречи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конкретный образ «увидеть твоё лицо» сохранён, а синтаксис сделан естественным для русского читателя.
