  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: ru
  text: 'И сказал Израиль Иосифу: «Вот, я умираю, но[a] Бог будет с вами и вернёт вас в землю ваших отцов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский союз формально можно передать словом «и»: «и Бог будет с вами». Однако здесь он может выражать контраст: Израиль умирает, но Бог останется с адресатами. Местоимения «вами» и «вас» в еврейском тексте стоят во множественном числе; обещание относится не только к Иосифу, но и к его семье или потомкам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательный вау продвигает повествование; традиционная и естественная для библейского повествования русская конструкция сохраняет связь с предыдущим контекстом.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено употреблённое в еврейском тексте имя, без замены на «Иаков».
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и достойный русский указательный маркер, привлекающий внимание без архаического оттенка.
- source_word: אָנֹכִי מֵת
  choice: я умираю
  rationale: Причастная форма обозначает наступающую, близкую смерть; русский презенс передаёт это естественно и не создаёт смысла уже совершившейся смерти.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: но Бог будет с вами
  rationale: 'Хотя וְ формально является союзом «и», контекст выражает противопоставление: Израиль умирает, но Божье присутствие продолжится.'
- source_word: עִמָּכֶם
  choice: с вами
  rationale: Форма местоименного суффикса множественного числа сохранена явно и распространяет обещание за пределы одного Иосифа.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: и возвратит вас
  rationale: Каузатив породы hифиль передаёт действие Бога, который приведёт адресатов обратно; «возвратит» точно и естественно выражает это по-русски.
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: в землю ваших отцов
  rationale: Сохранён конкретный образ земли отцов и множественное обращение исходного текста.
theological_decisions:
- issue: Число местоимений в обещании
  choice: 'Сохранить множественное число: «с вами», «вас», «ваших».'
  alternative: 'Передать обращение как относящееся только к Иосифу: «с тобой», «тебя», «твоих».'
  rationale: Еврейские суффиксы имеют форму множественного числа; перевод не сужает обещание до одного Иосифа и сохраняет его более широкий семейный или потомственный горизонт.
- issue: Смысл союза перед обещанием Божьего присутствия
  choice: Передать контраст союзом «но».
  alternative: Сохранить формальное соединение союзом «и».
  rationale: 'Простой еврейский союз допускает контрастное употребление: Израиль умрёт, тогда как Бог останется с адресатами. В сноске отмечена формальная альтернатива, чтобы не скрывать неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вот» сохраняет дискурсивную силу הִנֵּה без архаизации; множественное число местоимений сделано явным. Контрастное «но» сопровождено сноской, сохраняющей формально возможное «и».
