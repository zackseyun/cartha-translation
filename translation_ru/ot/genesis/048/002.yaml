base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: ru
  text: 'Иакову сообщили: «Вот, твой сын Иосиф пришёл к тебе». Тогда Израиль собрался с силами и сел на постели.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: Иакову сообщили
  rationale: Оба глагола вводят переданное Иакову сообщение, а действующее лицо в еврейском тексте не названо. В современном русском безлично-пассивная формулировка естественно передаёт этот смысл; отдельное «и сказали» было бы тяжеловесным повтором.
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица привлекает внимание к сообщаемому факту; «вот» сохраняет её функцию без архаизации.
- source_word: בִּנְךָ יוֹסֵף
  choice: твой сын Иосиф
  rationale: Прямое и естественное соответствие еврейскому именной словосочетанию.
- source_word: בָּא אֵלֶיךָ
  choice: пришёл к тебе
  rationale: Перфект בוא обозначает состоявшееся прибытие, актуальное в момент сообщения.
- source_word: וַיִּתְחַזֵּק
  choice: собрался с силами
  rationale: Форма хитпаэль передаёт усилие больного Иакова укрепиться; русское выражение естественно сохраняет возвратный смысл действия.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: сел на постели
  rationale: Глагол означает «сел», а контекст болезни подразумевает, что Израиль приподнялся и принял сидячее положение на постели.
theological_decisions:
- issue: Смена имени «Иаков» на «Израиль» в пределах одного стиха
  choice: Сохранить оба имени в той же последовательности
  alternative: Для стилистического единообразия употребить в обоих случаях «Иаков»
  rationale: Смена имени присутствует в еврейском тексте и может иметь литературное или богословское значение; её не следует сглаживать или истолковывать за читателя.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Синтаксис начальной формулы слегка упрощён ради естественности, без утраты содержания сообщения; архаизмы не используются.
