  source_fidelity: 'Русский текст точно передаёт содержание еврейского стиха: сообщение адресовано Иакову, в прямой речи сохранены частица «вот», родство и прибытие Иосифа; затем сохранена смена имени на «Израиль», его усилие укрепиться и действие на постели. Сжатие еврейской формулы «сообщил ... и сказал» до естественного русского «Иакову сообщили: ...» не меняет смысла и не добавляет названного субъекта.'
