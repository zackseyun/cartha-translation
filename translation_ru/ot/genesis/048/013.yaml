  text: וַ/יִּקַּ֣ח יוֹסֵף֮ אֶת שְׁנֵי/הֶם֒ אֶת אֶפְרַ֤יִם בִּֽ/ימִינ/וֹ֙ מִ/שְּׂמֹ֣אל יִשְׂרָאֵ֔ל וְ/אֶת מְנַשֶּׁ֥ה בִ/שְׂמֹאל֖/וֹ מִ/ימִ֣ין יִשְׂרָאֵ֑ל וַ/יַּגֵּ֖שׁ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: ru
  text: 'И взял Иосиф обоих: Ефрема — правой рукой, слева от Израиля, а Манассию — левой рукой, справа от Израиля, и подвёл их к нему.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: слева от Израиля / справа от Израиля
  rationale: Предлог מִן здесь выражает положение относительно Израиля, а не движение «слева/справа»; формулировка ясно передаёт расстановку сыновей перед благословением.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: и подвёл их к нему
  rationale: Глагол נגשׁ в каузативной форме означает приблизить или подвести; местоимение относится к Израилю.
- source_word: אֶת־שְׁנֵיהֶם
  choice: обоих
  rationale: Естественный русский эквивалент, однозначно указывающий на двух сыновей.
theological_decisions:
- issue: Расположение Ефрема и Манассии относительно Израиля перед благословением
  choice: 'Сохранена точная зеркальная расстановка: Ефрем справа от Иосифа и слева от Израиля, Манассия слева от Иосифа и справа от Израиля.'
  alternative: Передать предлог буквально как «со стороны левой/правой руки Израиля».
  rationale: Выбранная формулировка сохраняет повествовательную деталь, необходимую для последующего перекрещивания рук Израилем, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но простой. Имена переданы в традиционной русской библейской форме. Тире выделяют поясняющую расстановку сыновей.
