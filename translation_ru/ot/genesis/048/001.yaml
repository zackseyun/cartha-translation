base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: ru
  text: 'После этих событий кто-то сказал Иосифу: «Вот, твой отец болен». Тогда он взял с собой двух своих сыновей — Манассию и Ефрема.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: После этих событий
  rationale: Формула вводит следующий эпизод и связывает его с предшествующим повествованием. «Событий» естественно передаёт широкое значение דְּבָרִים в данном повествовательном контексте без архаичного «и было».
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: Иосифу сказали
  rationale: В еврейском тексте стоит безымянный субъект в форме третьего лица единственного числа. Русская неопределённо-личная конструкция сохраняет неопределённость говорящего, не вводя нового персонажа.
- source_word: הִנֵּה אָבִיךָ חֹלֶה
  choice: Твой отец болен
  rationale: הִנֵּה привлекает внимание к сообщению, но в современном русском контексте его функция естественно выражается непосредственностью реплики; буквальное «вот» здесь звучало бы менее естественно. חֹלֶה обозначает текущее болезненное состояние.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Тогда он взял с собой двух своих сыновей
  rationale: «Тогда» передаёт продвижение повествования, а «с собой» точно и естественно соответствует עִמּוֹ. Местоимение «он» по ближайшему названному участнику относится к Иосифу.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Манассию и Ефрема
  rationale: Использованы укоренившиеся в русской библейской традиции и литературном языке формы имён; винительный падеж обусловлен синтаксисом предложения.
