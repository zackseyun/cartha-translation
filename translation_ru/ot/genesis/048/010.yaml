  source_fidelity: 'Текст точно передаёт еврейский оригинал. «Глаза Израиля от старости ослабели» адекватно выражает идиому כָּבְדוּ מִזֹּקֶן и последующую невозможность видеть. Смена действующих лиц передана верно по непосредственному контексту: Иосиф подвёл сыновей к Израилю, затем Израиль поцеловал и обнял их. Явное называние лиц в русском тексте устраняет ложную референцию местоимений и не добавляет нового смыслового содержания.'
