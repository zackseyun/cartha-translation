source:
  edition: WLC
  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: ru
  text: Глаза Израиля от старости ослабели[a], и он уже не мог видеть. Иосиф подвёл их к нему[b], а Израиль поцеловал и обнял их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаза Израиля отяжелели от старости»; это выражение означает, что его зрение ослабело.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте подлежащее не названо буквально: «он подвёл их к нему». Из контекста предыдущего стиха следует, что сыновей подвёл Иосиф.'
    reason: source_ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: Глаза Израиля
  rationale: Естественно передаёт еврейскую сопряжённую конструкцию и сохраняет имя «Израиль», прямо употреблённое в исходном тексте.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: от старости ослабели
  rationale: Буквально глаза «отяжелели от старости»; в данном контексте это идиоматическое описание ослабевшего зрения. Русская формулировка передаёт смысл и причинную связь.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: он уже не мог видеть
  rationale: Естественная передача неспособности видеть; «уже» уместно выражает достигнутое к старости состояние, не вводя отдельного временного события.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Иосиф подвёл их к нему
  rationale: Форма глагола означает «подвёл, приблизил». В еврейском подлежащее не названо, но контекст стиха 9 указывает на Иосифа; имя названо по-русски, чтобы местоимение не было ошибочно отнесено к Израилю.
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: а Израиль поцеловал и обнял их
  rationale: Передаёт обе формы с местоименным дополнением во множественном числе. Имя «Израиль» проясняет смену действующего лица после Иосифа; союз «а» естественно обозначает эту смену.
theological_decisions:
- issue: Не выраженные существительными подлежащие последовательных еврейских глаголов
  choice: Назвать Иосифа при подведении сыновей и Израиля при поцелуе и объятии
  alternative: Сохранить в обоих случаях местоимение «он»
  rationale: В еврейском глагольные формы допускают восстановление действующих лиц из контекста. Буквальное повторение «он» по-русски создало бы ложное впечатление, будто Израиль сам подвёл юношей к себе. Экспликация не решает богословского вопроса, а лишь ясно передаёт повествовательные роли, установленные ближайшим контекстом.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранено имя «Израиль» и достоинство библейского регистра; буквальная идиома пояснена в сноске. Действующие лица названы явно там, где русские местоимения породили бы смысловую путаницу.
