  terminology: Имя «Израиль» сохранено в соответствии с оригиналом. Лексика нейтральна, литературна и не вносит конфессиональной интерпретации. Сноска a корректно объясняет образ «отяжелели»; сноска b корректно отмечает невыраженное в еврейской глагольной форме подлежащее и его контекстуальное разрешение.
