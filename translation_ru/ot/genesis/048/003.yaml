    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным waw продолжает последовательность событий; русский союз «и» сохраняет ход еврейского повествования, не усиливая временной оттенок.
- source_word: אֶל יוֹסֵף
  choice: Иосифу
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: אֵל שַׁדַּי
  choice: Бог Всемогущий
  rationale: Традиционный и понятный перевод божественного титула; при этом точное значение שַׁדַּי остаётся спорным и отмечено в сноске.
- source_word: נִרְאָה אֵלַי
  choice: явился мне
  rationale: Нифаль глагола ראה в данном контексте обозначает явление; перевод не добавляет отсутствующего в тексте уточнения о способе явления.
- source_word: בְּלוּז
  choice: в Лузе
  rationale: Нормальная русская форма для обозначения места события с корректным склонением топонима.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: в земле Ханаанской
  rationale: Сохраняется явно выраженное слово «земля» и употребляется укоренившееся в русском библейском стиле географическое наименование.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: и благословил меня
  rationale: Субъектом остаётся Бог; по-русски его не требуется повторять, а союз сохраняет связь действий.
theological_decisions:
- issue: Передача божественного титула אֵל שַׁדַּי
  choice: Бог Всемогущий
  alternative: Эль-Шаддай; Бог Всесильный
  rationale: 'Основной текст переводит титул понятным и традиционным русским соответствием, но не скрывает спорность точного оттенка слова שַׁדַּי: транслитерация дана в сноске.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «И сказал Иаков» сохраняет повествовательный ритм оригинала и остаётся понятной современному читателю.
