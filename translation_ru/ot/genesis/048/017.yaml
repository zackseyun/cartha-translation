source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: ru
  text: Иосиф увидел, что отец положил правую руку на голову Ефрема, и это ему не понравилось[a]. Тогда он взял отца за руку, чтобы перенести её с головы Ефрема на голову Манассии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и это было плохо в его глазах».'
    reason: Сноска сохраняет образность еврейской идиомы, тогда как основной текст передаёт её естественным современным русским выражением.
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: Иосиф увидел, что
  rationale: כִּי вводит содержание увиденного, а повествовательная форма וַיַּרְא продолжает последовательность событий. Русская конструкция естественна и точно передаёт синтаксическую связь.
- source_word: יָשִׁית
  choice: положил
  rationale: Глагол означает «класть, помещать». В русском завершённое действие ясно из контекста и не требует аналитического плюсквамперфекта.
- source_word: יַד יְמִינוֹ
  choice: правую руку
  rationale: Обычный русский эквивалент конструкции «рука его правой стороны», сохраняющий значимость жеста благословения.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: это ему не понравилось
  rationale: Естественно передаёт контекстуальный смысл еврейской идиомы «это было плохо в его глазах», не приписывая поступку нравственного зла.
- source_word: וַיִּתְמֹךְ יַד אָבִיו
  choice: он взял отца за руку
  rationale: תמך здесь обозначает физическое удерживание руки с целью направить её иначе. Формулировка передаёт действие без излишнего оттенка насилия.
- source_word: לְהָסִיר אֹתָהּ
  choice: чтобы перенести её
  rationale: הסיר может означать «убрать, отвести». С учётом указанного направления русское «перенести» кратко выражает снятие руки с одной головы и помещение на другую.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: с головы Ефрема на голову Манассии
  rationale: Сохраняет исходную и конечную точки направленного движения и звучит естественно по-русски.
