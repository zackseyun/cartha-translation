  source_fidelity: Основное чтение обоснованно передаёт разделительное значение обоих случаев מִן и сохраняет их параллелизм. Однако «вдали от плодородной земли» может означать пребывание вне самой земли, тогда как еврейское מִשְׁמַנֵּי הָאָרֶץ говорит о её плодородных, тучных местах/плодородии. Повествовательное וַיַּעַן требует совершенного прошедшего «ответил», а не «отвечал».
  naturalness: «Ответил ему его отец Исаак» — естественная современная литературная повествовательная формула. «Вдали от плодородных мест земли» точно и ясно выражает лишение плодородного удела; параллельное «от небесной росы свыше» сохраняет строй исходного изречения.
  terminology: «Плодородные места земли», «жилище» и «небесная роса» уместны в умеренно торжественном библейском регистре. Примечание сохраняет допустимое положительное прочтение, не выдавая его за несомненное.
