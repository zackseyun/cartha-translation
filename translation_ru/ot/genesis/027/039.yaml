base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: ru
  text: 'И ответил ему его отец Исаак[a]: «Вот, твоё жилище будет вдали от плодородных мест земли и от небесной росы свыше».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот, твоё жилище будет среди плодородных мест земли и с небесной росой свыше». Еврейский предлог может указывать как на удалённость («вдали от»), так и на источник или причастность («от, из»).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן יִצְחָק אָבִיו וַיֹּאמֶר אֵלָיו
  choice: И отвечал ему отец его Исаак
  rationale: Сохраняется повествовательная формула ответа и подчёркивается родственная связь; два еврейских глагола речи естественно сведены в русском к одному, без потери смысла.
- source_word: הִנֵּה
  choice: Вот
  rationale: Современный и торжественный маркер, привлекающий внимание к последующему изречению.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: вдали от плодородной земли
  rationale: שְׁמַנִּים обозначает богатство и плодородие; предлог מִן в основном тексте понят как указывающий на удалённость или лишение. Такой русский оборот естественнее буквального «вдали от плодородия земли».
- source_word: מוֹשָׁבֶךָ
  choice: твоё жилище
  rationale: Передаёт место проживания и сохраняет достоинство библейского речевого регистра.
- source_word: וּמִטַּל הַשָּׁמַיִם מֵעָל
  choice: и вдали от небесной росы свыше
  rationale: Второй предлог מִן истолкован параллельно первому; «свыше» сохраняет пространственный компонент מֵעָל.
theological_decisions:
- issue: Значение предлога מִן в словах Исаака Исаву
  choice: 'Разделительное значение: жилище будет вдали от плодородной земли и небесной росы'
  alternative: 'Положительное значение источника или причастности: жилище будет на плодородной земле, орошаемой небесной росой'
  rationale: Контекст ограниченного удела Исава и контраст с благословением Иакова в стихе 28 поддерживают разделительное прочтение. Однако еврейская конструкция допускает и традиционное положительное понимание, поэтому оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской интонацией. Неестественное для русского удвоение «отвечал и сказал» устранено; смысловая неоднозначность предлога вынесена в примечание.
