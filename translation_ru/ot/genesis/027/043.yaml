  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: ru
  text: А теперь[a], сын мой, послушай меня; встань и беги к моему брату Лавану в Харран.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И теперь».'
    reason: 'Лексическая альтернатива: союз וְ может быть передан как «и», тогда как «а» естественно обозначает переход к немедленному наставлению.'
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Сочетание вводит непосредственное распоряжение как вывод из сказанного ранее; «итак» естественно передаёт эту дискурсивную функцию, не требуя отдельного «и».
- source_word: בְנִי
  choice: сын мой
  rationale: Сохраняет родственную и гендерную определённость обращения; порядок слов уместен для dignified modern Russian.
- source_word: שְׁמַע בְּקֹלִי
  choice: послушайся меня
  rationale: Еврейская идиома буквально говорит «слушай моего голоса», но в данном контексте означает внимать распоряжению и исполнить его; «послушайся меня» естественно передаёт это значение по-русски.
- source_word: וְקוּם
  choice: встань
  rationale: Прямое и современное соответствие императиву קום в последовательности срочных повелений.
- source_word: בְּרַח לְךָ
  choice: беги
  rationale: ברח означает бегство от опасности. Дательный לְךָ здесь идиоматичен и не нуждается в отдельном воспроизведении; контекст ясно выражает спасительное бегство.
- source_word: אֶל לָבָן אָחִי
  choice: к моему брату Лавану
  rationale: Естественно сохраняет направление движения и приложение, обозначающее родство Лавана с говорящей.
- source_word: חָרָנָה
  choice: в Харран
  rationale: Направительное окончание -ה указывает на движение к Харрану; после «беги к ... Лавану» русское «в Харран» естественно обозначает место назначения.
