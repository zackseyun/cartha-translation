base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: ru
  text: 'Когда Исаак был уже стар и глаза его померкли, так что он уже не мог видеть, он позвал Исава, своего старшего сына[a], и сказал ему: «Сын мой!» Тот ответил: «Вот я».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Исава, своего старшего из сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Когда
  rationale: Сочетание вводит временное обстоятельство нового эпизода. В современном русском простое «Когда» естественно передаёт его функцию без архаичного «И было».
- source_word: זָקֵן
  choice: состарился
  rationale: Глагольная форма по-русски естественно описывает достигнутую Исааком старость и хорошо связывается с последующим ухудшением зрения.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: глаза его померкли, так что он уже не мог видеть
  rationale: כהה применительно к глазам означает утрату остроты зрения, а מֵרְאֹת указывает на неспособность видеть. Развёрнутая формулировка ясно передаёт результат, не утверждая сверх текста полную слепоту как медицинский диагноз.
- source_word: וַיִּקְרָא
  choice: он позвал
  rationale: В данном контексте קרא означает позвать к себе; «позвал» звучит естественно и не придаёт действию излишней официальности.
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: Исава, своего старшего сына
  rationale: הַגָּדֹל здесь противопоставляет Исава младшему Иакову и потому означает старшего сына, а не «великого» или физически большого.
- source_word: בְּנִי
  choice: Сын мой!
  rationale: Сохранено притяжательное значение суффикса и тёплая форма семейного обращения.
- source_word: הִנֵּנִי
  choice: Вот я
  rationale: Обычная древнееврейская формула ответа, выражающая присутствие и готовность слушать; краткое «Вот я» точно и естественно по-русски.
