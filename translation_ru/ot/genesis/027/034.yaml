base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: ru
  text: 'Когда Исав услышал слова своего отца, он издал чрезвычайно сильный и горький крик[a] и сказал своему отцу: «Благослови и меня, отец мой!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «закричал криком великим и горьким чрезвычайно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Когда … услышал
  rationale: Сочетание כִּי с инфинитивом вводит временное обстоятельство; «когда» естественно передаёт последовательность событий, не усиливая значение до «как только».
- source_word: דִּבְרֵי אָבִיו
  choice: слова своего отца
  rationale: Сохраняет прямое значение דָּבָר («слово, слова») и по-русски ясно указывает на отца Исава.
- source_word: וַיִּצְעַק צְעָקָה
  choice: издал … крик
  rationale: Еврейская конструкция с однокоренными глаголом и существительным усиливает действие. Русское выражение сохраняет существительное «крик», избегая неестественного «закричал криком» в основном тексте.
- source_word: גְּדֹלָה וּמָרָה עַד מְאֹד
  choice: чрезвычайно громкий и горький
  rationale: «Громкий» естественно передаёт силу крика, выраженную גְּדֹלָה, а «горький» сохраняет образ эмоциональной муки в מָרָה. Наречие «чрезвычайно» передаёт усиление עַד מְאֹד.
- source_word: בָּרֲכֵנִי גַם אָנִי
  choice: Благослови и меня
  rationale: Прямой императив сохраняет краткость и настойчивость просьбы; «и меня» естественно передаёт включительное и эмфатическое גַם אָנִי.
- source_word: אָבִי
  choice: отец мой
  rationale: Сохраняет явное притяжательное значение суффикса и передаёт торжественную, полную боли форму обращения.
