  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: ru
  text: Он пошёл, взял козлят и принёс их своей матери, и его мать приготовила вкусные блюда, которые любил его отец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Он пошёл
  rationale: Последовательная форма с וַ передаёт развитие повествования; в русском связь с предыдущим повелением ясна и без отдельного союза.
- source_word: וַיִּקַּח
  choice: взял козлят
  rationale: В еврейском объект не назван, но однозначно восстанавливается из непосредственного контекста предыдущего стиха; явное «козлят» естественно для русского языка.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: и принёс их матери
  rationale: Глагол בוא в каузативной форме с ל означает «принести кому-либо»; местоимение «их» указывает на козлят из контекста.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: а мать приготовила
  rationale: עשה буквально имеет широкое значение «сделать», но применительно к пище естественно переводится «приготовить». Союз «а» плавно отмечает смену действующего лица.
- source_word: מַטְעַמִּים
  choice: кушанье
  rationale: Слово обозначает вкусно приготовленную, лакомую пищу. «Кушанье» сохраняет предметное значение и достоинство стиля без излишней разговорности.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: какое любил его отец
  rationale: Сохраняется прямое значение אהב «любить» и смысл известного предпочтения Исаака; относительная конструкция звучит естественно по-русски.
