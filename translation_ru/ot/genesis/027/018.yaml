  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: ru
  text: 'И пришёл он к отцу и сказал: «Отец мой!» Тот ответил: «Вот я. Кто ты, сын мой?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришёл
  rationale: Глагол בוא в форме последовательного повествования продвигает рассказ; русское «пришёл к отцу» естественно передаёт движение к нему и соответствует исходной точке зрения.
- source_word: אֶל אָבִיו
  choice: к отцу
  rationale: Предлог אֶל выражает направление, а суффикс у אָבִיו означает «его отец»; в русском принадлежность ясна из контекста и местоимения «он».
- source_word: וַיֹּאמֶר
  choice: и сказал / Тот ответил
  rationale: Первое введение речи передано близко к форме оригинала; второе естественно оформлено как «Тот ответил», поскольку смена говорящего однозначна.
- source_word: אָבִי
  choice: Отец мой
  rationale: Форма с суффиксом первого лица буквально означает «мой отец» и здесь служит обращением; постпозиция местоимения придаёт речи достойное, но понятное звучание.
- source_word: הִנְנִי
  choice: Вот я
  rationale: Устойчивая еврейская формула отклика обозначает присутствие и готовность ответить; «Вот я» сохраняет её краткость и узнаваемую форму.
- source_word: מִי אַתָּה
  choice: Кто ты
  rationale: Прямой вопрос о личности собеседника без добавочного истолкования.
- source_word: בְּנִי
  choice: сын мой
  rationale: Существительное с суффиксом первого лица употреблено как личное обращение; перевод сохраняет притяжательное значение.
