  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: ru
  text: И вот, едва Исаак закончил благословлять Иакова, как Иаков только что вышел от лица своего отца Исаака[a], а его брат Исав пришёл с охоты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте повторена форма глагола: буквально «выйти — вышел». Этот повтор усиливает мысль о том, что Иаков ушёл непосредственно перед приходом Исава.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И вот
  rationale: Естественно передаёт повествовательную формулу, вводящую следующее событие, без архаичного «и было».
- source_word: כַּאֲשֶׁר כִּלָּה
  choice: едва ... закончил
  rationale: Передаёт завершённость благословения и тесную временную связь с последующими событиями.
- source_word: לְבָרֵךְ
  choice: благословлять
  rationale: С глаголом «закончил» естественно передаёт еврейскую конструкцию со значением завершения действия.
- source_word: אַךְ יָצֹא יָצָא
  choice: только что вышел
  rationale: Инфинитив абсолютный при личной форме усиливает глагол, а אַךְ подчёркивает, что уход произошёл непосредственно перед приходом Исава.
- source_word: מֵאֵת פְּנֵי
  choice: от ... Исаака
  rationale: В данном контексте означает уход от присутствия Исаака; краткое русское «вышел от» естественно передаёт движение из помещения или места, где находился отец.
- source_word: בָּא
  choice: вернулся
  rationale: Контекст показывает приход Исава назад после охоты; русское «вернулся с охоты» естественно выражает подразумеваемое направление.
- source_word: מִצֵּידוֹ
  choice: с охоты
  rationale: ציד здесь наиболее естественно понимать как занятие охотой, с которой возвращается Исав; возможное значение «добыча» контекстом прямо не утверждается.
