base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: ru
  text: 'Исаак ответил Исаву: «Вот, я поставил его господином над тобой и отдал ему всех его братьев в слуги[a]; зерном и молодым вином я обеспечил его[b]. Что же мне тогда сделать для тебя, сын мой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в рабы». Еврейское слово может означать как слуг, так и рабов — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подкрепил его зерном и молодым вином». Еврейский глагол означает поддержку или обеспечение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ответил
  rationale: Обычная повествовательная формула, вводящая ответ в диалоге; по-русски естественно передаётся одним глаголом.
- source_word: הֵן
  choice: вот
  rationale: Сохраняет указательно-эмфатическую силу междометия без архаизации.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: я поставил его господином над тобой
  rationale: Передаёт назначение на положение власти и сохраняет семейно-властное значение גְּבִיר.
- source_word: כָּל אֶחָיו
  choice: всех его братьев
  rationale: Прямое значение родственного термина; расширять его до «родичей» здесь нет необходимости.
- source_word: לַעֲבָדִים
  choice: в слуги
  rationale: Передаёт подчинённое положение, не устраняя возможности более сильного значения «рабы», указанного в сноске.
- source_word: דָגָן
  choice: хлеб
  rationale: В данном аграрном контексте традиционное и понятное русское обозначение зернового урожая; буквально речь идёт о зерне.
- source_word: תִּירֹשׁ
  choice: молодое вино
  rationale: Передаёт сельскохозяйственное значение свежего вина, а не вина вообще.
- source_word: סְמַכְתִּיו
  choice: я обеспечил его
  rationale: В сочетании с зерном и молодым вином глагол означает поддержку посредством снабжения; вариант сохраняет контекстуальный смысл.
- source_word: וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה
  choice: Что же я теперь могу сделать для тебя
  rationale: Естественно передаёт переход к следствию и риторический вопрос о том, что ещё остаётся возможным.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохраняет прямое и эмоционально окрашенное обращение.
theological_decisions:
- issue: Неотменимость уже данного благословения подразумевается вопросом Исаака, но прямо не формулируется.
  choice: 'Сохранён риторический вопрос: «Что же я теперь могу сделать для тебя?»'
  alternative: 'Разъяснить: «Я уже ничего не могу сделать для тебя».'
  rationale: Исходный текст выражает ограниченность Исаака косвенно; перевод не должен превращать подразумеваемое богословское и повествовательное напряжение в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён естественным для русского языка свёртыванием формулы «ответил и сказал» до «ответил»; смысловые повторы и неоднозначности источника сохранены там, где они существенны.
