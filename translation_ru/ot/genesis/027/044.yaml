  text: וְ/יָשַׁבְתָּ֥ עִמּ֖/וֹ יָמִ֣ים אֲחָדִ֑ים עַ֥ד אֲשֶׁר תָּשׁ֖וּב חֲמַ֥ת אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: ru
  text: И поживи у него несколько дней, пока не отступит ярость[a] твоего брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока не утихнет ярость твоего брата». Еврейский глагол буквально означает «вернуться, повернуть назад» и здесь образно говорит о прекращении ярости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: И поживи
  rationale: Глагол ישׁב может означать «сидеть», «жить», «оставаться». Здесь Ревекка велит Иакову временно жить у Лавана; «поживи» естественно передаёт и проживание, и предполагаемую временность.
- source_word: עִמּוֹ
  choice: у него
  rationale: Буквально «с ним». В русском контексте временного проживания у Лавана выражение «у него» звучит естественнее и точно передаёт смысл.
- source_word: יָמִים אֲחָדִים
  choice: несколько дней
  rationale: Буквально «дни немногие». «Несколько дней» сохраняет скромную оценку длительности, данную самой Ревеккой, хотя впоследствии разлука затянулась.
- source_word: עַד אֲשֶׁר
  choice: пока не
  rationale: Оборот вводит временной предел пребывания; по-русски перед условием прекращения действия естественно «пока не».
- source_word: תָּשׁוּב
  choice: не отступит
  rationale: שׁוב буквально означает «вернуться, повернуть назад». При подлежащем «ярость» выражение описывает прекращение гнева; «отступит» сохраняет образ движения и остаётся естественным по-русски.
- source_word: חֲמַת
  choice: ярость
  rationale: חֵמָה обозначает сильный, пылающий гнев. «Ярость» передаёт интенсивность точнее, чем более нейтральное «гнев».
- source_word: אָחִיךָ
  choice: твоего брата
  rationale: Форма с суффиксом второго лица в сопряжённой конструкции означает «ярость твоего брата».
