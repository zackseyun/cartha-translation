base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: ru
  text: Пусть Бог даст тебе от росы небесной и от плодородия земли[a], изобилие зерна и молодого вина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от росы небесной и от тука земли». Это образ плодородия и обильного урожая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Пусть … даст
  rationale: Форма глагола с союзом в контексте благословения выражает пожелание; эта конструкция естественно передаёт по-русски благословляющую, а не просто предсказывающую речь.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Форма с артиклем здесь служит определённым обозначением единого Бога и не требует буквального «этот Бог».
- source_word: מִטַּל הַשָּׁמַיִם
  choice: от росы небесной
  rationale: 'Предлог מִן сохранён в партитивном значении: Бог даёт долю от небесной росы. Порядок слов поддерживает возвышенный, но понятный стиль благословения.'
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: и от плодородия земли
  rationale: Буквальный образ «тука земли» обозначает плодородие и щедрость почвы. «Плодородие» ясно передаёт земледельческий смысл без архаичной неясности.
- source_word: וְרֹב
  choice: изобилие
  rationale: רֹב означает множество, обилие; существительное «изобилие» естественно сочетается с двумя последующими видами урожая.
- source_word: דָּגָן
  choice: зерна
  rationale: Общее обозначение зерновых культур и их урожая; «зерно» точнее и современнее, чем неоднозначный «хлеб».
- source_word: וְתִירֹשׁ
  choice: и молодого вина
  rationale: תִּירוֹשׁ обозначает свежее, новое вино как плод урожая и отличается от общего слова «вино».
theological_decisions:
- issue: Характер высказывания
  choice: 'Благословляющее пожелание: «Пусть Бог даст тебе»'
  alternative: 'Предсказание: «Бог даст тебе»'
  rationale: Глагольная форма и контекст благословения Исаака указывают на волитивное пожелание. Перевод сохраняет действенный характер произносимого благословения, не превращая его в простое сообщение о будущем.
- issue: Значение повторённого предлога מִן
  choice: Партитивная формулировка «от росы… и от плодородия…»
  alternative: 'Прямые дополнения: «росу… и плодородие…»'
  rationale: Повторение מִן допускает смысл дарования некоторой доли или источника благ; русская конструкция с «от» сохраняет эту особенность и исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным строем благословения. Архаичный образ «тук земли» вынесен в сноску; в основном тексте употреблено понятное «плодородие земли».
