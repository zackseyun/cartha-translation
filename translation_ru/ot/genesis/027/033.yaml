  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: ru
  text: 'Исаак задрожал — его охватила чрезвычайно сильная дрожь — и сказал: «Кто же тогда это был — тот, кто добыл дичь, принёс её мне, и я поел от всего этого, прежде чем ты пришёл, и благословил его? Да, он будет благословен».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воистину, он будет благословен».'
    reason: Возможная передача подтверждающего оттенка גַּם в заключительном заявлении.
lexical_decisions:
- source_word: וַיֶּחֱרַד יִצְחָק חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: Исаак задрожал сильной дрожью
  rationale: Однокоренная конструкция усиливает переживание Исаака. Выражение «задрожал сильной дрожью» сохраняет заметный повтор и телесно-эмоциональную силу еврейского текста; «чрезвычайно сильной» по-русски здесь звучало бы перегруженно.
- source_word: מִי אֵפוֹא הוּא
  choice: Кто же тогда тот
  rationale: Частица אֵפוֹא выражает вывод и усиление в свете внезапно открывшихся обстоятельств; сочетание «же тогда» передаёт оба оттенка, не превращая вопрос в простое выяснение личности.
- source_word: הַצָּד צַיִד
  choice: кто добыл дичь
  rationale: צַיִד обозначает дичь, а не обязательно оленину. «Добыл дичь» естественно по-русски и охватывает как охоту, так и её результат.
- source_word: וַיָּבֵא לִי
  choice: и принёс мне
  rationale: Объект легко восстанавливается из непосредственно предшествующего слова «дичь»; русский язык допускает его не повторять.
- source_word: וָאֹכַל מִכֹּל
  choice: Я поел от всего
  rationale: 'Сохраняется разделительное значение מִן в מִכֹּל: Исаак ел от всего принесённого, а не обязательно съел всё без остатка.'
- source_word: בְּטֶרֶם תָּבוֹא
  choice: прежде, чем ты пришёл
  rationale: Прямая и ясная передача временного отношения и обычного значения בוא.
- source_word: וָאֲבָרֲכֵהוּ
  choice: и благословил его
  rationale: Первое лицо однозначно задаётся предшествующим «Я поел»; общий субъект двух однородных сказуемых естественно сохраняется без повторения местоимения.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: И он будет благословен
  rationale: גַּם здесь подтверждает, что уже произнесённое благословение остаётся в силе. Простая русская формула сохраняет твёрдость утверждения и будущую форму יִהְיֶה.
theological_decisions:
- issue: Сила заключительного заявления Исаака после данного благословения
  choice: 'Твёрдое подтверждение: получивший благословение останется благословенным'
  alternative: Лишь покорное признание случившегося без особого акцента
  rationale: Сочетание גַּם с בָּרוּךְ יִהְיֶה имеет подтверждающую силу. Перевод сохраняет повествовательное и богословское напряжение неотменяемого патриархального благословения, но не объясняет его посредством позднейших доктринальных построений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся понятным широкому читателю; намеренный однокоренной повтор «задрожал сильной дрожью» передаёт усилительную форму оригинала. Маркер сноски поставлен непосредственно после относящегося к ней заключительного утверждения.
