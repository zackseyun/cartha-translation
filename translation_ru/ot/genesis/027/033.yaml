revisions:
- from: 'Исаак задрожал сильной дрожью и сказал: «Кто же тогда тот, кто добыл дичь и принёс мне? Я поел от всего прежде, чем ты пришёл, и благословил его. И он будет благословен».[a]'
  to: 'Исаак задрожал — его охватила чрезвычайно сильная дрожь — и сказал: «Кто же тогда это был — тот, кто добыл дичь, принёс её мне, и я поел от всего этого, прежде чем ты пришёл, и благословил его? Да, он будет благословен».[a]'
  rationale: Исправление восстанавливает единый вопрос оригинала, ясно связывает подразумеваемый объект «принёс» с «дичью», сохраняет частичное значение מִכֹּל через «от всего этого» и передаёт подтверждающую силу גַּם словом «Да». Повторная конструкция о дрожи передаёт усиление חֲרָדָה גְּדֹלָה עַד מְאֹד без неестественного буквального словосочетания.
