lexical_decisions:
- source_word: עֹרֹת
  choice: кожи
  rationale: Форма множественного числа обозначает снятые козьи кожи, использованные как покрытие; «кожи» естественно и точно передаёт смысл.
- source_word: גְּדָיֵי הָעִזִּים
  choice: козлят
  rationale: Сочетание обозначает молодых коз; по-русски это естественно передаётся одним словом «козлята».
- source_word: הִלְבִּישָׁה
  choice: надела ему
  rationale: Каузативная форма глагола לבש означает «одела, надела на него»; в данном контексте «надела ему» естественно сочетается с указанием частей тела.
- source_word: עַל יָדָיו
  choice: на руки
  rationale: Предлог עַל здесь указывает на поверхность, покрытую кожами; русское «на руки» передаёт это прямо и естественно.
- source_word: חֶלְקַת צַוָּארָיו
  choice: гладкую часть шеи
  rationale: חֶלְקַת обозначает гладкий участок или гладкость; конкретное «гладкую часть шеи» сохраняет образ и не добавляет отсутствующего в тексте уточнения.
