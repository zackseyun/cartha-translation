lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он спросил
  rationale: Хотя אמר обычно означает «сказать», форма следующей реплики является вопросом, поэтому в современном русском контексте естественно передать глагол как «спросил».
- source_word: אַתָּה זֶה
  choice: Ты ли в самом деле
  rationale: Сочетание личного местоимения с указательным словом выражает усиленный вопрос об идентичности; формулировка сохраняет эмфазу без буквального и неестественного «ты этот».
- source_word: בְּנִי
  choice: мой сын
  rationale: Сохранены существительное и притяжательный суффикс первого лица единственного числа.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: וַיֹּאמֶר
  choice: Тот ответил
  rationale: Повторное אמר в данном диалоге функционально вводит ответ; местоимение «тот» естественно различает собеседников, не добавляя нового участника.
- source_word: אָֽנִי
  choice: Я
  rationale: Самостоятельное местоимение служит кратким подтверждением личности; русское «Я» точно сохраняет лаконичность еврейского ответа.
