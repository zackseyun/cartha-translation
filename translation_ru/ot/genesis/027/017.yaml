lexical_decisions:
- source_word: וַתִּתֵּן
  choice: И она передала
  rationale: Форма с последовательным waw продолжает повествование; глагол נתן с выражением בְּיַד обозначает непосредственную передачу предметов в чьи-либо руки.
- source_word: הַמַּטְעַמִּים
  choice: кушанья
  rationale: Слово обозначает особенно вкусно приготовленную пищу; «кушанья» естественно в данном контексте и не уточняет состав блюда сверх еврейского текста.
- source_word: הַלֶּחֶם
  choice: хлеб
  rationale: Прямое и естественное соответствие существительному לֶחֶם.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: которые приготовила
  rationale: В контексте пищи עשה естественно передаётся глаголом «приготовила»; русский вид ясно показывает, что приготовление предшествовало передаче.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет конкретный телесный образ еврейского выражения и одновременно звучит по-русски естественнее буквального единственного числа «в руку».
- source_word: יַעֲקֹב בְּנָהּ
  choice: своему сыну Иакову
  rationale: Естественный русский порядок слов точно передаёт отношение Иакова к действующему лицу; возвратное «своему» устраняет ненужную двусмысленность.
