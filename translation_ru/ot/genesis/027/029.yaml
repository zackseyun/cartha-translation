reference: Genesis 27:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: ru
  text: Пусть народы служат тебе и племена склоняются перед тобой. Будь господином над своими братьями, и пусть сыновья твоей матери склоняются перед тобой. Кто проклинает тебя, да будет проклят, и кто благословляет тебя, да будет благословен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: Пусть народы служат тебе
  rationale: Глагол עבד в породе qal с объектным суффиксом здесь означает служение и подчинение адресату благословения; «служат тебе» сохраняет широту значения.
- source_word: עַמִּים ... לְאֻמִּים
  choice: народы ... племена
  rationale: Оба слова обозначают группы людей и образуют поэтический параллелизм. Вариативная передача сохраняет различие близких терминов без чрезмерно политического оттенка.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: склоняются перед тобой
  rationale: Форма от חוה/שׁחה обозначает поклон, простирание или выражение почтения как перед Богом, так и перед человеком. В контексте человеческого превосходства выражение «склоняются перед тобой» передаёт почтительное подчинение, не добавляя смысла богопоклонения.
- source_word: הֱוֵה גְבִיר
  choice: Будь господином
  rationale: הוה с именным сказуемым выражает пожелание-повеление, а גְּבִיר — человека, обладающего властью и старшинством. «Господином» естественно передаёт власть в семейном контексте; строчная буква отличает это слово от божественного титула.
- source_word: לְאַחֶיךָ
  choice: над своими братьями
  rationale: При גְּבִיר предлог ל выражает отношение господства; по-русски оно естественно передаётся конструкцией «господином над».
- source_word: בְּנֵי אִמֶּךָ
  choice: сыновья твоей матери
  rationale: Буквальная родственная формула сохранена, поскольку она конкретнее общего слова «братья» и важна для поэтического параллелизма.
- source_word: אֹרְרֶיךָ אָרוּר
  choice: Кто проклинает тебя, да будет проклят
  rationale: Еврейская конструкция сочетает причастие во множественном значении с предикатом в единственном числе. Русская обобщённо-личная формула с «кто» сохраняет и коллективную применимость, и грамматическое число оригинала.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: и кто благословляет тебя, да будет благословен
  rationale: Передача симметрична предыдущей формуле и сохраняет мужской род и единственное число еврейского предиката בָּרוּךְ.
theological_decisions:
- issue: Характер поклонения человеческому адресату
  choice: склоняются перед тобой
  alternative: поклоняются тебе; простираются перед тобой
  rationale: Еврейский глагол может описывать поклонение Богу или почтительный поклон человеку. Контекст благословения говорит о семейном и общественном превосходстве, однако нейтральное описание жеста не устраняет присущую слову смысловую широту.
- issue: Передача титула גְבִיר
  choice: господином
  alternative: владыкой; повелителем
  rationale: Речь идёт о власти над братьями, а не о прямом употреблении божественного титула. Строчная буква и контекст позволяют сохранить обычное человеческое значение слова.
translation_notes:
  register: Современный литературный русский с торжественным ритмом патриархального благословения. Синтаксический параллелизм оригинала сохранён; архаизирующие формы ограничены конструкцией «да будет», которая остаётся понятной и уместной в благословении.
