lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт и соединительную силу וְ, и переход к непосредственному наставлению; по-русски звучит естественно.
- source_word: שָׂא נָא
  choice: возьми, пожалуйста
  rationale: В данном контексте שָׂא означает взять с собой предметы, а נָא смягчает просьбу или придаёт ей настойчивость.
- source_word: כֵלֶיךָ
  choice: своё снаряжение
  rationale: Широкое обозначение принадлежностей, далее конкретизированное словами «колчан и лук»; «снаряжение» не сужает значение до одного лишь оружия.
- source_word: תֶּלְיְךָ
  choice: колчан
  rationale: Наиболее вероятное значение редкого существительного в контексте охоты с луком — футляр для стрел, то есть колчан.
- source_word: וְקַשְׁתֶּךָ
  choice: и лук
  rationale: Прямое и обычное соответствие еврейскому קֶשֶׁת.
- source_word: וְצֵא הַשָּׂדֶה
  choice: выйди в поле
  rationale: Сохраняет конкретный образ открытой местности, куда Исав отправляется охотиться.
- source_word: וְצוּדָה לִּי צידה
  choice: и добудь для меня дичь
  rationale: Естественно передаёт охоту и её предполагаемый результат; «дичь» обозначает добываемую на охоте пищу без неоправданного уточнения вида животного.
