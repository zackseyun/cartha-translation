base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: ru
  text: 'Но Иаков сказал Ревекке, своей матери: «Вот, Исав, мой брат, волосат, а я — гладкокожий[a]».


    [a] То есть с гладкой кожей, без волос, в противопоставление волосатости Исава.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть с гладкой кожей, без волос, в противопоставление волосатости Исава.
    reason: Поясняется телесный смысл слова «гладкокожий» в контексте противопоставления Иакову волосатого Исава.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но Иаков сказал
  rationale: Последовательная форма продвигает повествование, а союз «но» естественно передаёт возражение Иакова в данном контексте.
- source_word: אִמּוֹ
  choice: своей матери
  rationale: Сохранены и имя Ревекки, и указание на её родство с Иаковом; возвратное «своей» естественно для современного русского языка.
- source_word: הֵן
  choice: Ведь
  rationale: Частица привлекает внимание к очевидному обстоятельству, на котором строится возражение Иакова. В русском диалоге «ведь» естественно передаёт эту обосновывающую силу.
- source_word: אִישׁ שָׂעִר
  choice: человек волосатый
  rationale: Сохраняет конструкцию с אִישׁ и прямое описание телесной волосатости, одновременно образуя параллель со следующим выражением.
- source_word: וְאָנֹכִי
  choice: а я
  rationale: Независимое местоимение подчёркивает противопоставление Иакова Исаву; русское «а» ясно и без избыточного толкования выражает контраст.
- source_word: אִישׁ חָלָק
  choice: человек гладкий
  rationale: Близко воспроизводит намеренно параллельное противопоставление «человек волосатый — человек гладкий», не заменяя исходный образ более истолковывающим «безволосый».
