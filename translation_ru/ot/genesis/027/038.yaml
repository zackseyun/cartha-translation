base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: ru
  text: 'Исав сказал отцу: «Разве у тебя только одно благословение, отец мой?»[a] «Благослови и меня, отец мой!» Тогда Исав поднял голос и заплакал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Одно ли у тебя благословение, отец мой?» Еврейская фраза выражает отчаяние Исава при мысли, что Исаак может дать лишь одно благословение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: Неужели у тебя только одно благословение
  rationale: 'Еврейская безглагольная конструкция буквально означает: «Благословение одно ли оно у тебя?» В контексте это риторический вопрос, выражающий потрясение и отчаяние Исава; «неужели» естественно передаёт эту силу в современном русском языке.'
- source_word: אָבִי
  choice: отец мой
  rationale: Суффикс первого лица единственного числа прямо выражает принадлежность. Повтор сохранён как важная часть эмоциональной мольбы Исава.
- source_word: בָּרֲכֵנִי
  choice: Благослови меня
  rationale: Прямое повелительное наклонение глагола ברך с объектным суффиксом первого лица; перевод сохраняет форму и смысл оригинала.
- source_word: גַּם אָֽנִי
  choice: и меня
  rationale: Частица גַּם подчёркивает просьбу включить Исава наряду с уже благословлённым сыном. В русском «и меня» естественно передаёт это значение.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: возвысил ... голос свой
  rationale: Еврейская идиома буквально означает «поднял свой голос» и здесь описывает громкое рыдание. Выбранная формулировка сохраняет библейский образ и остаётся понятной современному читателю.
- source_word: וַיֵּבְךְּ
  choice: заплакал
  rationale: Глагол обозначает плач. «Заплакал» ясно передаёт начало открытого плача и естественно сочетается с предшествующей идиомой.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Использована традиционная и общепринятая русская форма библейского имени.
