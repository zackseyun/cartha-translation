  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: ru
  text: Он не узнал его, потому что руки у него были волосатые, как руки Исава, его брата; и он благословил его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «поэтому он благословил его». Еврейская повествовательная форма может обозначать простую последовательность, но здесь может подразумеваться и результат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: не узнал его
  rationale: Глагол נכר в породе hифиль здесь означает «узнать, распознать». Исаак не распознал Иакова на ощупь.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Исаак не узнал Иакова.
- source_word: יָדָיו
  choice: руки у него
  rationale: Естественная русская передача существительного во множественном числе с местоименным суффиксом 3-го лица мужского рода.
- source_word: כִּידֵי
  choice: как руки
  rationale: Префикс כְּ выражает сравнение; оборот сохраняет прямое сопоставление.
- source_word: אָחִיו
  choice: его брата
  rationale: Буквальная передача термина родства с местоименным суффиксом; по контексту речь идёт о брате Иакова.
- source_word: שְׂעִרֹת
  choice: волосатые
  rationale: Прилагательное описывает руки, на ощупь похожие на руки Исава; «волосатые» кратко и естественно передаёт признак.
- source_word: וַיְבָרְכֵהוּ
  choice: и он благословил его
  rationale: Форма с повествовательным waw продолжает последовательность событий. Русское «и» сохраняет формальную неоднозначность между простым следованием и оттенком результата.
theological_decisions:
- issue: Связь благословения с тем, что Исаак не узнал Иакова
  choice: и он благословил его
  alternative: поэтому он благословил его
  rationale: Еврейская повествовательная форма прямо обозначает последовательность, хотя контекст допускает результативный оттенок. Основной текст не должен однозначно усиливать причинно-следственную связь.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет достоинство библейского повествования и остаётся понятным обычному читателю. Местоимения оставлены без поясняющих имён, чтобы не устранять присущую оригиналу референциальную структуру.
