  variant: modern literary Russian
source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: ru
  text: Пойди, пожалуйста, к стаду и возьми там для меня двух хороших козлят. Я приготовлю из них для твоего отца лакомые блюда[a], какие он любит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вкусные кушанья»; также возможно: «изысканные блюда».'
    reason: Лексема מַטְעַמִּים обозначает особенно вкусные, желанные блюда; русские соответствия различаются оттенками качества и изысканности.
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Пойди, пожалуйста
  rationale: Императив לֶךְ передан прямо, а частица נָא — вежливым, но настойчивым «пожалуйста».
- source_word: הַצֹּאן
  choice: к стаду
  rationale: צֹאן обозначает мелкий домашний скот — овец и коз; «стадо» естественно сохраняет широкий смысл, тогда как далее уточняются козлята.
- source_word: וְקַח לִי מִשָּׁם
  choice: и возьми там для меня
  rationale: Передаёт обычное значение לקח «взять» и сохраняет לִי «для меня», не добавляя отсутствующего в исходном тексте значения движения «принеси».
- source_word: שְׁנֵי גְּדָיֵי עִזִּים טֹבִים
  choice: двух хороших козлят
  rationale: Конструкция буквально означает «двух хороших козьих детёнышей»; «козлят» — точный и естественный русский эквивалент.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: Я приготовлю из них для твоего отца лакомые блюда
  rationale: Глагольная конструкция означает приготовление животных в виде пищи, а מַטְעַמִּים — вкусные, особо желанные блюда. «Лакомые блюда» сохраняет кулинарный смысл и связь с предпочтением Исаака.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: какие он любит
  rationale: Естественно передаёт сравнение с привычным предпочтением отца, сохраняя сильный глагол אָהֵב «любить».
theological_decisions: []
