  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Вежливо-побудительный оттенок נָא сохранён; архаизмы вроде «яства» не использованы. Маркер сноски помещён при словах «лакомые блюда», к которым относится лексическая альтернатива.
