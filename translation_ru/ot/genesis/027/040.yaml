  text: וְ/עַל חַרְבְּ/ךָ֣ תִֽחְיֶ֔ה וְ/אֶת אָחִ֖י/ךָ תַּעֲבֹ֑ד וְ/הָיָה֙ כַּ/אֲשֶׁ֣ר תָּרִ֔יד וּ/פָרַקְתָּ֥ עֻלּ֖/וֹ מֵ/עַ֥ל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: ru
  text: Ты будешь жить своим мечом и будешь служить своему брату; но когда вырвешься на свободу[a], сорвёшь его ярмо со своей шеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда станешь беспокойным». Значение еврейского глагола תָּרִיד не вполне ясно; контекст снятия ярма допускает смысл решительного освобождения, но возможен и смысл внутреннего беспокойства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: Ты будешь жить своим мечом
  rationale: Предлог עַל в сочетании с «мечом» указывает на средство или образ жизни. «Жить своим мечом» естественно по-русски и сохраняет конкретный образ.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: и будешь служить своему брату
  rationale: Глагол עבד прямо означает «служить»; такая передача не уточняет сверх текста политическую форму подчинения.
- source_word: וְהָיָה כַּאֲשֶׁר תָּרִיד
  choice: но когда вырвешься на свободу[a]
  rationale: Точный смысл редкого תָּרִיד спорен. В контексте последующего снятия ярма выражение передаёт решительное освобождение от власти, а иной возможный смысл сохранён в сноске.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: сорвёшь его ярмо
  rationale: פרק выражает насильственное снятие или разрыв, а עֹל буквально означает «ярмо». Глагол «сорвёшь» сохраняет силу и наглядность образа.
- source_word: מֵעַל צַוָּארֶךָ
  choice: со своей шеи
  rationale: Естественная русская передача пространственного выражения מֵעַל при сохранении физического образа ярма на шее.
theological_decisions:
- issue: Будущие отношения Исава с Иаковом
  choice: Передать подчинение брату и последующее освобождение от его власти без дальнейших историко-богословских уточнений.
  alternative: Истолковать служение как вечное подчинение либо ослабить его до простого семейного почтения.
  rationale: В стихе одновременно говорится о служении брату и о снятии его ярма. Перевод сохраняет это напряжение и не привносит выводов об Эдоме, прямо не выраженных здесь.
translation_notes:
  register: Современный литературный русский язык; пророческая речь передана просто и торжественно. Конкретные образы меча, ярма и шеи сохранены.
