  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: ru
  text: 'Его мать сказала ему: «Пусть твоё проклятие падёт на меня, сын мой. Только послушайся меня, пойди и принеси мне их[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть козлят, упомянутых в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: Мать сказала ему
  rationale: Обычная повествовательная формула; принадлежность естественно передана из контекста без тяжеловесного «его мать».
- source_word: עָלַי קִלְלָתְךָ
  choice: Пусть твоё проклятие падёт на меня
  rationale: Передаёт принятие на себя возможного проклятия и сохраняет прямую связь суффикса «твоё»; глагол «падёт» естественно выражает по-русски образ возлагаемого последствия.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохраняет обращение и эмоциональную окраску; порядок слов соответствует dignified literary Russian.
- source_word: אַךְ
  choice: Только
  rationale: Передаёт ограничительно-побудительное значение частицы в данном контексте.
- source_word: שְׁמַע בְּקֹלִי
  choice: послушайся меня
  rationale: Еврейская идиома буквально означает «слушай мой голос», но в повелительном контексте выражает подчинение указанию; русский эквивалент звучит естественно.
- source_word: וְלֵךְ קַח לִי
  choice: и пойди принеси мне их
  rationale: Последовательность повелений сохранена; «принеси» контекстуально передаёт לקח с дательным לִי, а подразумеваемое дополнение восстановлено для ясности.
theological_decisions:
- issue: Характер слов Ревекки о проклятии
  choice: Сохранено как принятие возможного проклятия на себя
  alternative: Истолковать как обещание снять или отменить проклятие
  rationale: Текст говорит о том, на ком будет проклятие, но не объясняет механизм и не утверждает, что Ревекка способна его отменить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Идиома שׁמע בקול передана естественным «послушайся меня», а синтаксис прямой речи сохранён кратким и настойчивым.
