base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: ru
  text: 'Исаак сказал: «Подай мне, и я поем дичи моего сына, чтобы моя душа благословила тебя[a]». Иаков подал ему, и Исаак поел; Иаков принёс ему вина, и Исаак выпил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно по-русски: «чтобы я благословил тебя». Буквально с древнееврейского: «чтобы моя душа благословила тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישָׁה לִּי
  choice: Подай мне
  rationale: Каузативный императив от נגשׁ означает «поднести, подать». «Подай мне» естественно передаёт движение пищи к Исааку и подразумеваемое из контекста дополнение.
- source_word: וְאֹכְלָה
  choice: и я поем
  rationale: Когортатив выражает намерение или желание говорящего; «я поем» естественно передаёт завершённое вкушение некоторого количества пищи.
- source_word: מִצֵּיד בְּנִי
  choice: дичи моего сына
  rationale: צַיִד обозначает добытую на охоте дичь, а предлог מִן здесь имеет партитивный смысл. Родительный падеж сохраняет компактность и притяжательную конструкцию оригинала.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз ясно передаёт целевое значение древнееврейского выражения.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: чтобы моя душа благословила тебя
  rationale: Сохранён прямой субъект נַפְשִׁי, «моя душа», вместе с его торжественной личной выразительностью; более идиоматический русский вариант дан в сноске.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: И он подал ему
  rationale: Глагол повторяет корень повеления Исаака; «подал» сохраняет эту связь и звучит естественно по-русски.
- source_word: יַיִן
  choice: вина
  rationale: Обычное соответствие слову יַיִן; родительный падеж обусловлен русским управлением при «принёс» в значении некоторого количества.
- source_word: וַיֵּשְׁתְּ
  choice: и тот выпил
  rationale: Простое повествовательное действие передано прямо; указательное местоимение помогает различить двух участников без изменения смысла.
theological_decisions:
- issue: Выражение «моя душа благословила тебя»
  choice: Сохранить «моя душа» в основном тексте
  alternative: «чтобы я благословил тебя»
  rationale: В древнееврейском тексте נַפְשִׁי прямо выступает субъектом. Сохранение этого оборота не сводит его заранее к простому местоимению и удерживает торжественное напряжение оригинала.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Необычный оборот «моя душа благословила» намеренно сохранён как значимая особенность оригинала и пояснён сноской. Имя Исаака добавлено во второй части лишь для устранения неизбежной в русском местоименной двусмысленности между двумя мужчинами.
