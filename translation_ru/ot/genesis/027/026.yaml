lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Форма wayyiqtol продвигает повествование; «тогда» естественно передаёт последовательность событий по-русски.
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог с местоименным суффиксом обозначает адресата речи.
- source_word: יִצְחָק אָבִיו
  choice: отец его Исаак
  rationale: Сохранены родственное обозначение и имя в аппозитивном сочетании; такой порядок звучит несколько возвышенно, но ясно и соответствует библейскому повествовательному регистру.
- source_word: גְּשָׁה
  choice: Подойди
  rationale: Императив выражает физическое приближение; «подойди» естественно и точно в данном контексте.
- source_word: נָא
  choice: пожалуйста
  rationale: Частица смягчает просьбу; «пожалуйста» естественно передаёт её прагматическую функцию.
- source_word: וּשְׁקָה לִּי
  choice: и поцелуй меня
  rationale: Русский прямой объект естественно передаёт идиоматическое сочетание глагола с לִי без буквализма «поцелуй для меня».
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохранено обращение и его семейно-эмоциональное звучание; постпозиция местоимения соответствует dignified литературному регистру.
