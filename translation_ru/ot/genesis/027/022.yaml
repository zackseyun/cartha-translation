  text: וַ/יִּגַּ֧שׁ יַעֲקֹ֛ב אֶל יִצְחָ֥ק אָבִ֖י/ו וַ/יְמֻשֵּׁ֑/הוּ וַ/יֹּ֗אמֶר הַ/קֹּל֙ ק֣וֹל יַעֲקֹ֔ב וְ/הַ/יָּדַ֖יִם יְדֵ֥י עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: ru
  text: 'Иаков подошёл к своему отцу Исааку, и тот ощупал его и сказал: «Голос — голос Иакова, а руки — руки Исава».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с менее выраженным противопоставлением: «Голос — голос Иакова, и руки — руки Исава».'
    reason: Союз וְ буквально означает «и», но в данном сопоставлении может иметь противительный оттенок.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Глагол נגשׁ в породе каль обозначает приближение; «подошёл» естественно передаёт движение в последовательном повествовании.
- source_word: וַיְמֻשֵּׁהוּ
  choice: ощупал его
  rationale: В контексте Исаак не просто касается Иакова, а намеренно проверяет его на ощупь; «ощупал» точно и естественно выражает это действие.
- source_word: הַקֹּל
  choice: голос
  rationale: Здесь קוֹל относится к узнаваемому голосу говорящего, противопоставленному осязательному свидетельству.
- source_word: קוֹל יַעֲקֹב
  choice: голос Иакова
  rationale: 'Сочетание передано с сохранением характерного для еврейского текста именного повтора: «Голос — голос Иакова».'
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: а руки — руки Исава
  rationale: Союз «а» естественно выражает контраст, заложенный в сопоставлении двух бессоюзно-именных утверждений, а повтор «руки — руки» сохраняет риторическую форму оригинала.
- source_word: אָבִיו
  choice: своему отцу
  rationale: Возвратное местоимение по-русски однозначно связывает отца с подлежащим Иаковом и сохраняет явно указанное родство.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены достоинство повествования, лаконизм и параллельная структура еврейской реплики. Местоимение «тот» устраняет возможную неясность относительно того, кто ощупал Иакова.
