  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: ru
  text: 'А Ревекка сказала своему сыну Иакову: «Вот, я слышала, как твой отец говорил твоему брату Исаву:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרִבְקָה אָמְרָה
  choice: А Ревекка сказала
  rationale: Союз וְ передаёт продолжение повествования; «а» естественно вводит смену действующего лица, не приписывая союзу строгого временного значения. אָמְרָה стандартно передано глаголом «сказала».
- source_word: אֶל־יַעֲקֹב בְּנָהּ
  choice: своему сыну Иакову
  rationale: Сохранено приложение «сыну Иакову» и естественное для русского языка возвратное притяжательное местоимение при подлежащем «Ревекка».
- source_word: לֵאמֹר
  choice: ': «'
  rationale: Первое לֵאמֹר служит введением прямой речи и естественно выражается двоеточием и открывающей кавычкой.
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» передаёт функцию привлечения внимания без архаического оттенка слова «се» и без сужения значения до призыва слушать.
- source_word: שָׁמַעְתִּי אֶת־אָבִיךָ מְדַבֵּר
  choice: я слышала, как твой отец говорил
  rationale: Конструкция «слышала, как… говорил» естественна по-русски и сохраняет восприятие продолжавшейся речи, выраженное причастием מְדַבֵּר.
- source_word: אֶל־עֵשָׂו אָחִיךָ
  choice: твоему брату Исаву
  rationale: Предлог אֶל передаёт направленность речи, а אָחִיךָ сохранено как приложение, прямо указывающее на родство Исава с Иаковом.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Заключительное לֵאמֹר вводит слова Исаака, которые следуют в следующем стихе; двоеточие ясно и естественно обозначает начало вложенной цитаты, избегая тяжеловесного «говоря».
