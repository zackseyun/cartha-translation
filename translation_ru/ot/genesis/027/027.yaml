base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: ru
  text: 'Он подошёл и поцеловал его. Исаак почувствовал запах его одежды, благословил его и сказал: «Вот, запах моего сына — как запах поля, которое благословил Яхве».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст повторяет слово «запах» (רֵיחַ), подчёркивая связь между запахом одежды и образом благословлённого поля.
    reason: literary_feature
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Он подошёл
  rationale: Глагол נגשׁ обозначает приближение; форма продолжает последовательность повествования. Простое «подошёл» естественно передаёт действие по-русски.
- source_word: וַיִּשַּׁק לוֹ
  choice: и поцеловал его
  rationale: Передано без добавления эмоциональной характеристики, которой нет в исходном тексте.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: Исаак почувствовал запах его одежды
  rationale: Русское «почувствовал запах» естественно передаёт еврейское сочетание глагола ריח с существительным רֵיחַ. Имя «Исаак» проясняет смену деятеля, очевидную из контекста, и устраняет неестественную местоименную двусмысленность в русском.
- source_word: בְּגָדָיו
  choice: его одежды
  rationale: Собирательное единственное «одежда» является обычным современным русским соответствием еврейскому множественному числу בְּגָדִים.
- source_word: וַיְבָרֲכֵהוּ
  choice: благословил его
  rationale: Прямое соответствие глаголу ברך с объектным суффиксом.
- source_word: רְאֵה
  choice: Вот
  rationale: Буквально это повелительная форма «смотри», но здесь она служит междометием, привлекающим внимание к последующему восклицанию о запахе. «Вот» звучит естественно и не смешивает зрительное восприятие с обонянием.
- source_word: רֵיחַ בְּנִי ... כְּרֵיחַ שָׂדֶה
  choice: запах моего сына — как запах поля
  rationale: Повтор слова «запах» сохраняет лексический повтор רֵיחַ и выраженную частицей כְּ конструкцию сравнения.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: которое благословил Яхве
  rationale: Относительное предложение относится к полю; совершенное действие передано русским прошедшим видом, а личное имя יְהוָה — транслитерацией «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Образ благословлённого поля
  choice: поле, которое благословил Яхве
  alternative: плодородное поле
  rationale: Сохранена прямая богословская формулировка об источнике благословения; следствие благословения не подменяет самого действия Бога.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаичным звучанием. Повествовательная фраза разделена после поцелуя, чтобы ясно обозначить смену действующего лица. Лексический повтор «запах» сохранён в речи Исаака.
