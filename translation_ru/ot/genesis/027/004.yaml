  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: ru
  text: приготовь мне вкусное кушанье[a], какое я люблю, и принеси мне, и я поем, чтобы душа моя благословила тебя прежде, чем я умру.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лакомое блюдо»; «вкусную еду».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы душа моя благословила тебя»; это выражение означает: «чтобы я благословил тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: приготовь мне вкусное кушанье
  rationale: В кулинарном контексте עשה естественно передаётся как «приготовь», а מַטְעַמִּים обозначает вкусную, особо приготовленную пищу. Единственное собирательное «кушанье» сохраняет естественность русского языка.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: какое я люблю
  rationale: Передаёт личное предпочтение Исаака близко к форме еврейского текста и без разговорного оттенка выражения «как я люблю».
- source_word: וְהָבִיאָה לִּי
  choice: и принеси мне
  rationale: Прямое и естественное соответствие повелению принести пищу говорящему.
- source_word: וְאֹכֵלָה
  choice: я поем
  rationale: Когортатив выражает намеренное последующее действие Исаака. В русском последовательность «принеси мне; я поем» звучит естественнее, чем цепочка двух придаточных цели, и не превращает еду в конечную цель.
- source_word: בַּעֲבוּר תְּבָרֶכְךָ נַפְשִׁי
  choice: чтобы душа моя благословила тебя
  rationale: בַּעֲבוּר вводит цель, а сохранение נַפְשִׁי как «душа моя» удерживает явный образ и торжественное личное звучание оригинала.
- source_word: בְּטֶרֶם אָמוּת
  choice: прежде, чем я умру
  rationale: Естественная русская передача временного придаточного с сохранением прямоты исходного выражения.
theological_decisions:
- issue: Значение выражения «душа моя благословила тебя»
  choice: Сохранить буквальный субъект «душа моя» в основном тексте.
  alternative: «чтобы я благословил тебя»
  rationale: נַפְשִׁי может идиоматически обозначать самого Исаака во всей полноте его личности, однако явное слово «душа» значимо для формы и торжественности высказывания. Сноска поясняет идиому, не навязывая отдельного антропологического учения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «душа моя» сохраняет акцент и достоинство оригинала; архаические формы и излишне разговорная лексика исключены.
