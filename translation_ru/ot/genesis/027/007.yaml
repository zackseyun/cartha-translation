  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: ru
  text: «Принеси мне дичь и приготовь для меня вкусные блюда[a], чтобы я поел и благословил тебя перед Яхве[b], прежде чем умру».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лакомые кушанья». Еврейское слово обозначает особо приготовленные вкусные блюда.'
    reason: lexical_alternative
  - marker: b
    text: Евр. יהוה (ЙХВХ); это имя также традиционно передают словом «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: הָבִיאָה לִי צַיִד
  choice: принеси мне дичь
  rationale: Глагол в каузативной форме означает принести что-либо говорящему, а צַיִד — добытую на охоте дичь, не обязательно оленину.
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: приготовь для меня вкусные блюда
  rationale: Хотя עשה буквально имеет широкое значение «сделать», в контексте еды естественно «приготовить». Множественное מַטְעַמִּים обозначает вкусно или особо приготовленные кушанья; множественное число сохранено.
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: чтобы я поел и благословил тебя
  rationale: Когортативные формы передают намерение и цель действий после повелений; конструкция с «чтобы» естественно выражает эту связь по-русски.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי буквально означает «перед, в присутствии», а יהוה передано как личное имя Яхве.
- source_word: לִפְנֵי מוֹתִי
  choice: прежде чем умру
  rationale: Так естественно по-русски передаётся временное значение «до моей смерти / перед тем, как я умру».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога, а не титул. Передача «Яхве» сохраняет это различие; традиционное чтение «Господь» отмечено в сноске.
- issue: Смысл выражения לִפְנֵי יְהוָה
  choice: перед Яхве
  alternative: в присутствии Яхве
  rationale: Формулировка сохраняет прямой пространственно-реляционный образ еврейского текста и не уточняет, каким именно образом благословение совершается перед Богом.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским регистром. Реплика оформлена как прямая речь внутри пересказа Ревекки; заключительная кавычка сохранена. Порядок действий и целевая связь переданы без добавочного богословского истолкования.
