  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: ru
  text: 'Исаак сказал Иакову: «Подойди, пожалуйста, чтобы я ощупал тебя, сын мой: ты ли это, мой сын Исав, или нет?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Исаак сказал
  rationale: Последовательная форма с וַ продвигает повествование; в русском отдельное «тогда» здесь необязательно и утяжеляло бы фразу.
- source_word: גְּשָׁה נָּא
  choice: Подойди, пожалуйста, поближе
  rationale: Императив передаёт приближение, а נָא — смягчённую просьбу; «поближе» естественно в ситуации, когда Исаак хочет ощупать Иакова.
- source_word: וַאֲמֻשְׁךָ
  choice: чтобы я ощупал тебя
  rationale: Глагол מושׁ означает ощупывать или осязать; в контексте речь идёт не о случайном прикосновении, а о проверке личности на ощупь. Союз «чтобы» естественно передаёт цель после повеления.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохранено прямое обращение с суффиксом первого лица и его тёплый, родственный оттенок.
- source_word: הַאַתָּה זֶה
  choice: действительно ли ты
  rationale: Вопросительная конструкция выражает сомнение Исаака и проверку личности; такой перевод естественен по-русски и сохраняет неопределённость.
- source_word: בְּנִי עֵשָׂו
  choice: мой сын Исав
  rationale: Естественно передаёт сочетание родственного обозначения и имени человека, чью личность проверяет Исаак.
- source_word: אִם לֹא
  choice: или нет
  rationale: 'Завершает косвенный альтернативный вопрос: «ли… или нет».'
