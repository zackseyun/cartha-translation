lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Стандартная передача повествовательной формы wayyiqtol от אמר; русское местоимение естественно обозначает Исаака, а союз не требуется для плавности современного повествования.
- source_word: בָּא
  choice: пришёл
  rationale: Qal perfect от בוא обозначает завершённое действие в прошлом; простой прошедший вид естественен по-русски.
- source_word: אָחִיךָ
  choice: твой брат
  rationale: Прямая передача существительного с суффиксом 2-го лица мужского рода единственного числа; родственное обозначение сохраняет риторическую выразительность оригинала.
- source_word: בְּמִרְמָה
  choice: обманом
  rationale: Сочетание предлога ב с существительным מִרְמָה выражает образ действия или средство. Творительный падеж «обманом» естественно передаёт оба оттенка, сохраняя существительное.
- source_word: וַיִּקַּח
  choice: и забрал
  rationale: Wayyiqtol от לקח продолжает последовательность действий. «Забрал» в данном контексте естественнее простого «взял» и передаёт получение предназначавшегося адресату благословения, не усиливая действие до насильственного захвата.
- source_word: בִּרְכָתֶךָ
  choice: твоё благословение
  rationale: Прямая передача существительного с притяжательным суффиксом; сохраняет как буквальный смысл, так и контекст отцовского благословения, предназначенного Исаву.
