base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: ru
  text: 'Тогда Ревекка сказала Исааку: «Мне опостылела жизнь из-за дочерей Хета[a]. Если Иаков возьмёт себе жену из дочерей Хета — такую, как эти, из дочерей земли, — то к чему мне жизнь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хеттеянок»; «дочерей хеттеев».'
    reason: Лексическая альтернатива для буквального родо-этнического выражения «дочери Хета».
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Мне опостылела жизнь
  rationale: Сочетание выражает тяжёлое отвращение и пресыщение собственной жизнью; «опостылела» естественно и ёмко передаёт эту силу, не превращая слова Ревекки в прямое желание умереть.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: Предлог здесь указывает на причину; «из-за» естественно передаёт причинное значение.
- source_word: בְּנוֹת חֵת
  choice: дочери Хета
  rationale: Сохраняется буквальное родо-этническое обозначение еврейского текста и имя חֵת; понятный этнический эквивалент вынесен в сноску.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Если Иаков возьмёт себе жену
  rationale: Передаёт обычную для еврейского языка брачную конструкцию и звучит естественно по-русски.
- source_word: כָּאֵלֶּה
  choice: такую, как эти
  rationale: Указательное слово сопоставляет возможную жену Иакова с уже упомянутыми женщинами, вероятнее всего жёнами Исава.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: из дочерей этой земли
  rationale: Сохраняет параллель с «дочерьми Хета» и социально-родовой способ выражения оригинала; указательное «этой» естественно обозначает местную землю в русском контексте.
- source_word: לָמָּה לִּי חַיִּים
  choice: к чему мне жизнь?
  rationale: Кратко и естественно сохраняет риторический вопрос о смысле или ценности жизни, не разворачивая его в более определённое «зачем мне жить?».
theological_decisions:
- issue: Этническое обозначение חֵת
  choice: Сохранить в основном тексте буквальное «дочери Хета»
  alternative: хеттеянки; дочери хеттеев
  rationale: Буквальная передача сохраняет родовую форму и имя Хет, а этническое пояснение помогает современному читателю без подмены формулировки оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Эмоциональная сила реплики сохранена словом «опостылела», а заключительный вопрос оставлен риторическим и без лишнего истолкования.
