  source_fidelity: 'В целом перевод точно передаёт синтаксис и эмоциональную силу еврейского текста. «Мне опостылела жизнь», «из-за», «дочери Хета», «возьмёт себе жену» и «к чему мне жизнь?» хорошо соответствуют исходнику. Однако «этой земли» вводит указательное значение, которого в הָאָרֶץ нет: определённость выражена артиклем и лучше передаётся как «земли» либо «этой страны» лишь при более свободном переводе; здесь предпочтительнее сохранить буквальную форму без добавления.'
