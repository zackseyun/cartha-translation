  terminology: Имена «Ревекка», «Исаак», «Иаков» и «Хет» переданы последовательно. Сноска корректно даёт этнический эквивалент «хеттеянки» и альтернативное родо-этническое выражение. Богословски нагруженных терминов в стихе нет.
