  to: 'Тогда Ревекка сказала Исааку: «Мне опостылела жизнь из-за дочерей Хета[a]. Если Иаков возьмёт себе жену из дочерей Хета — такую, как эти, из дочерей земли, — то к чему мне жизнь?»'
