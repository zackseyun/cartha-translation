  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: ru
  text: 'Иаков сказал своему отцу: «Я Исав, твой первенец. Я сделал, как ты велел мне. Встань, пожалуйста, сядь и поешь моей дичи, чтобы ты благословил меня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы твоя душа благословила меня»; еврейское слово נֶפֶשׁ («душа», «сам человек») здесь обозначает самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל אָבִיו
  choice: Иаков сказал своему отцу
  rationale: Повествовательная форма продолжает последовательность событий; русский порядок слов естественно передаёт адресата речи.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Я Исав, твой первенец
  rationale: Сохранено прямое самоотождествление Иакова с Исавом и приложение «твой первенец», без смягчения обманного заявления.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: Я сделал, как ты велел мне
  rationale: «Велел» естественно передаёт здесь речь Исаака как данное ранее поручение, не добавляя к ней нового содержания.
- source_word: קוּם נָא שְׁבָה
  choice: Встань, пожалуйста, сядь
  rationale: Сохранена необычная последовательность двух повелений; נָא передано вежливым «пожалуйста».
- source_word: וְאָכְלָה מִצֵּידִי
  choice: и поешь моей дичи
  rationale: צַיִד в данном контексте обозначает добытую на охоте дичь; конструкция с מִן естественно передана русским родительным падежом после «поешь».
- source_word: בַּעֲבוּר
  choice: чтобы
  rationale: Союз ясно и естественно вводит цель просьбы.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: чтобы ты благословил меня
  rationale: נֶפֶשׁ здесь служит идиоматическим обозначением самого человека; русская формулировка передаёт смысл, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Передача נַפְשֶׁךָ в выражении תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: чтобы ты благословил меня
  alternative: чтобы твоя душа благословила меня; чтобы ты сам благословил меня
  rationale: В данном обороте «душа» обозначает человека как личность, а не формулирует отдельное антропологическое утверждение. Идиоматический перевод не навязывает тексту такого утверждения, при этом буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Необычное сочетание «встань… сядь» сохранено как особенность исходного текста; архаизмы «восстань» и «вкуси» не использованы.
