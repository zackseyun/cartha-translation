lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: הִנֵּה привлекает внимание к последующему утверждению; частица נָא здесь смягчает или усиливает обращение и естественно передаётся без отдельного слова.
- source_word: זָקַנְתִּי
  choice: я состарился
  rationale: Форма совершенного вида обозначает достигнутое состояние старости; «состарился» сохраняет образ и звучит естественно.
- source_word: לֹא יָדַעְתִּי יֹום מוֹתִי
  choice: не знаю дня своей смерти
  rationale: 'Сохраняется прямое значение еврейской конструкции: Исаак не знает, в какой день умрёт, без добавления отсутствующих в тексте уточнений.'
theological_decisions:
- issue: Степень определённости близости смерти
  choice: не знаю дня своей смерти
  alternative: не знаю, когда умру
  rationale: Более буквальная формулировка сохраняет торжественность и не утверждает, что смерть непременно близка.
