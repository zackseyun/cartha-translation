source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: ru
  text: пока гнев твоего брата не отступит от тебя[a] и он не забудет, что ты ему сделал. Тогда я пошлю за тобой и заберу тебя оттуда[b]. Зачем мне лишаться вас обоих в один день?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «пока гнев твоего брата не повернётся (или не отвратится) от тебя». Еврейский глагол «повернуться, возвратиться» употреблён здесь в сочетании со словом «гнев».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пошлю и возьму тебя оттуда». По контексту Ревекка намерена послать за Иаковом и забрать его из места его пребывания.'
    reason: lexical_alternative
  - marker: c
    text: Слова «лишаться вас обоих в один день» выражают страх Ревекки потерять обоих сыновей из-за последствий их конфликта, но текст не уточняет, что их участь будет одинаковой.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: пока гнев твоего брата не отступит от тебя
  rationale: Конструкция עַד с инфинитивом задаёт временной предел, а сочетание שוב с אַף идиоматически описывает прекращение гнева. «Не отступит от тебя» естественно передаёт образ поворота или удаления гнева, не устраняя его образность полностью.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: и он не забудет, что ты ему сделал
  rationale: Современная и ясная передача прозрачной еврейской конструкции; совершённое Иаковом действие сохраняется как предшествующее.
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  choice: Тогда я пошлю за тобой и заберу тебя оттуда
  rationale: «Тогда» передаёт последовательность, выраженную формами с וְ. Глагол לקח буквально значит «взять»; в данном направлении движения естественное русское «заберу тебя оттуда» сохраняет смысл без добавления явного «назад», которого в тексте нет.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: Зачем мне лишаться вас обоих в один день?
  rationale: שכל обозначает утрату детей, а «лишаться вас обоих» сохраняет материнскую перспективу и звучит естественнее буквального, но неидиоматичного русского соответствия. «В один день» прямо передаёт יוֹם אֶחָד.
theological_decisions:
- issue: Смысл утраты обоих сыновей
  choice: Не уточнять, каким именно образом Ревекка может лишиться каждого из сыновей
  alternative: Пояснить в основном тексте, что один погибнет, а другой понесёт наказание или будет утрачен для семьи
  rationale: Еврейский текст говорит лишь об утрате обоих в один день и оставляет конкретные последствия конфликта невыраженными; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис остаётся простым и доступным; идиома о гневе передана естественно, а неоднозначность последней фразы сохранена и пояснена в сноске.
