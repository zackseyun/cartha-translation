base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: ru
  text: Может быть, отец ощупает меня[a], и я покажусь ему обманщиком[b]; тогда я навлеку на себя проклятие, а не благословение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прикоснётся ко мне». Еврейский глагол означает ощупывать, исследуя прикосновением; это соответствует намерению Исаака проверить личность Иакова на ощупь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «насмешником»; возможно также: «плутом». Еврейское слово может обозначать того, кто вводит другого в заблуждение, разыгрывает его или выставляет на посмешище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Вдруг
  rationale: В контексте опасения Иакова передаёт не просто возможность, а тревожное ожидание возможного исхода; это естественно звучит по-русски.
- source_word: יְמֻשֵּׁנִי
  choice: ощупает меня
  rationale: Глагол משש обозначает исследование посредством прикосновения; «ощупает» точно соответствует последующей физической проверке личности Иакова.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: я покажусь ему
  rationale: Естественно передаёт еврейскую идиому «буду в его глазах», то есть то, каким Исаак сочтёт Иакова.
- source_word: כִּמְתַעְתֵּעַ
  choice: обманщиком
  rationale: В данном контексте причастная форма обозначает того, кто вводит другого в заблуждение или разыгрывает его; «обманщик» ясно выражает основной контекстуальный смысл.
- source_word: וְהֵבֵאתִי עָלַי
  choice: тогда я навлеку на себя
  rationale: Каузативная конструкция буквально означает «принесу на себя»; русский глагол «навлеку» является естественным сочетанием с «проклятием».
- source_word: קְלָלָה וְלֹא בְרָכָה
  choice: проклятие, а не благословение
  rationale: Сохраняет прямое противопоставление двух ключевых понятий и естественно звучит в современном русском языке.
