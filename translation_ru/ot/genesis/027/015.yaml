source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: ru
  text: Тогда Ревекка взяла лучшие одежды своего старшего сына Исава, которые были у неё в доме[a], и надела их на своего младшего сына Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые она держала у себя в доме»; буквально: «которые были с нею в доме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Тогда ... взяла
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт последовательность действий по-русски.
- source_word: בִּגְדֵי ... הַחֲמֻדֹת
  choice: лучшие одежды
  rationale: בִּגְדֵי означает предметы одежды, а הַחֲמֻדֹת — желанные, ценные или отборные. В данном контексте «лучшие одежды» звучит естественно и сохраняет оценочный смысл.
- source_word: בְּנָהּ הַגָּדֹל
  choice: своего старшего сына
  rationale: В семейном контексте גָּדוֹל обозначает старшего по возрасту и противопоставлен קָטָן — младшему.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: которые были у неё в доме
  rationale: Перевод близко сохраняет еврейскую конструкцию, допускающую оттенки нахождения при ней и принадлежности, не добавляя смысла намеренного хранения.
- source_word: וַתַּלְבֵּשׁ
  choice: надела их на
  rationale: Глагол означает «одеть, облачить». С выраженным предметом одежды русская конструкция «надела их на Иакова» ясна и естественна.
- source_word: בְּנָהּ הַקָּטָן
  choice: своего младшего сына
  rationale: קָטָן здесь указывает на младшего из братьев, а не на малый рост или возраст ребёнка вообще.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Одежды» сохраняет достоинство повествования, а порядок слов остаётся естественным для современного читателя.
