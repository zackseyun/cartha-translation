  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: ru
  text: Ревекка слушала, как Исаак говорил своему сыну Исаву[a], а Исав пошёл в поле, чтобы добыть дичь и принести её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ревекка слышала, когда Исаак говорил своему сыну Исаву». Еврейское причастие обозначает продолжающееся, фоновое восприятие речи; оно допускает как «слушала», так и «слышала».'
    reason: lexical_alternative
  - marker: b
    text: 'Более формально: «пойти в поле, чтобы добыть дичь и принести её». В еврейском тексте стоят два инфинитива, оба связанные с целью действия.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Ревекка
  rationale: Начальный союз וְ связывает стих с предыдущим повествованием, но в русском его можно не выражать отдельным союзом без потери связи.
- source_word: שֹׁמַעַת
  choice: слышала
  rationale: Причастие передаёт фоновое, продолжающееся восприятие речи Исаака. «Слышала» естественно по-русски и, в отличие от «подслушивала», не приписывает Ревекке прямо не названного намерения.
- source_word: בְּ/דַבֵּר
  choice: как Исаак говорил
  rationale: Предлог ב при инфинитиве-сопряжении обозначает одновременность; конструкция «слышала, как… говорил» естественно передаёт совпадающие во времени действия.
- source_word: אֶל עֵשָׂו בְּנ֑/וֹ
  choice: своему сыну Исаву
  rationale: אֶל обозначает адресата речи, а местоименный суффикс у בֵּן указывает, что Исав — сын Исаака.
- source_word: וַ/יֵּלֶךְ
  choice: а Исав пошёл
  rationale: Глагол הלך в повествовательной форме означает простое движение; союз «а» естественно переводит переход к действию Исава.
- source_word: הַ/שָּׂדֶה
  choice: в поле
  rationale: שׂדה может обозначать поле или открытую местность; «в поле» — прямой и уместный в сцене охоты русский эквивалент.
- source_word: לָ/צ֥וּד צַ֖יִד
  choice: чтобы добыть дичь
  rationale: צוד с существительным ציד описывает охоту на дичь. «Добыть дичь» по-русски естественнее буквального повтора «охотиться на добычу» и не сужает вид животного.
- source_word: לְ/הָבִיא
  choice: и принести её
  rationale: Второй инфинитив выражает цель; местоимение «её» восстанавливает понятный объект — дичь — без изменения смысла.
