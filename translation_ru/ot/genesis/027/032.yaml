  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: ru
  text: 'Его отец Исаак сказал ему: «Кто ты?» И тот сказал: «Я — твой сын, твой первенец Исав».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: сказал ему
  rationale: Глагол אמר — обычный глагол речи; вопросительное содержание передаётся самой прямой речью, поэтому нет необходимости заменять его на «спросил».
- source_word: יִצְחָק אָבִיו
  choice: Исаак, его отец
  rationale: Сохраняет порядок и смысл еврейского выражения «Исаак, его отец» и при этом естественно звучит по-русски.
- source_word: מִי אָתָּה
  choice: Кто ты?
  rationale: Прямой и естественный русский эквивалент вопросительного местоимения מִי с личным местоимением אַתָּה.
- source_word: אֲנִי בִּנְךָ
  choice: Я — твой сын
  rationale: В еврейском именном предложении связка отсутствует; в русском настоящем времени естественно использовать тире.
- source_word: בְכֹרְךָ
  choice: твой первенец
  rationale: «Первенец» точно передаёт порядок рождения и сохраняет важный для повествования смысл, связанный с правом первородства.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; прямая, сдержанная повествовательная речь. Формулировка «Исаак, его отец» сохраняет структуру исходного текста без неестественности, а «первенец» удерживает значимый контекст первородства.
