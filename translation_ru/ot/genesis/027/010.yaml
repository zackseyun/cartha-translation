lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: И отнеси
  rationale: Форма с союзом продолжает последовательность наставлений Ревекки; русский императив естественно передаёт предписывающую силу высказывания.
- source_word: לְאָבִיךָ
  choice: своему отцу
  rationale: Возвратное притяжательное местоимение естественно для русского языка при совпадении обладателя с адресатом; «отцу» сохраняет достойный повествовательный регистр.
- source_word: וְאָכָל
  choice: чтобы он поел
  rationale: В сочетании с последующей целевой конструкцией передаёт предполагаемое действие Исаака как часть замысла; совершенный вид «поел» указывает на завершение трапезы перед благословением.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: чтобы
  rationale: 'Сочетание вводит цель: пищу следует принести ради того, чтобы отец благословил Иакова. В русском единая конструкция «чтобы… и…» естественно охватывает последовательные действия внутри замысла.'
- source_word: יְבָרֶכְךָ
  choice: благословил тебя
  rationale: Прямой и устойчивый эквивалент Piel глагола ברך в контексте патриархального благословения.
- source_word: לִפְנֵי מוֹתוֹ
  choice: перед своей смертью
  rationale: Сохраняет именную конструкцию оригинала и её торжественную серьёзность; «своей» недвусмысленно относит смерть к отцу.
