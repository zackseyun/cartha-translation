base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: ru
  text: 'И возненавидел Исав Иакова из-за благословения, которым отец благословил Иакова[a]. Исав сказал про себя[b]: «Приближаются дни траура по моему отцу[c]; тогда я убью Иакова, моего брата».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал враждовать с Иаковом». Еврейский глагол означает устойчивую вражду или ненависть, а не только мимолётное чувство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сказал в своём сердце».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Приближаются дни траура моего отца». Еврейское выражение может означать как траур по Исааку после его смерти, так и период скорби самого Исаака.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: возненавидел
  rationale: Глагол שׂטם выражает стойкую вражду и ненависть, а не мимолётное чувство. «Возненавидел» точно и естественно передаёт эту враждебность в данном повествовательном контексте.
- source_word: עַל הַבְּרָכָה
  choice: за благословение
  rationale: Предлог עַל здесь указывает на причину вражды. Русское «за благословение» кратко и естественно передаёт причинный смысл.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: которым благословил его отец
  rationale: Сохранён явный повтор корня ברך и указано, что благословение, данное Иакову отцом, стало причиной ненависти Исава.
- source_word: בְּלִבּוֹ
  choice: в сердце своём
  rationale: Сохранён буквальный и понятный библейский образ внутренней речи; сноска поясняет его идиоматический смысл.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Приближаются дни плача по моему отцу
  rationale: Передана наиболее вероятная мысль о скорой смерти Исаака и последующем плаче по нему, при этом грамматическая неоднозначность сочетания отмечена в сноске.
- source_word: וְאַהַרְגָה
  choice: тогда я убью
  rationale: Форма выражает решительное намерение; «тогда» естественно передаёт подразумеваемую временную последовательность.
- source_word: אָחִי
  choice: брата моего
  rationale: Сохранено явное притяжательное определение, подчёркивающее трагизм намерения убить собственного брата.
theological_decisions:
- issue: К кому относится плач в выражении יְמֵי אֵבֶל אָבִי
  choice: плач по отцу после его смерти
  alternative: период скорби самого отца
  rationale: Контекст намерения Исава дождаться смерти Исаака поддерживает основной перевод, однако конструкция допускает и иное понимание, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Инверсия «брата моего» сохраняет торжественность и подчёркивает родство, оставаясь понятной современному читателю.
