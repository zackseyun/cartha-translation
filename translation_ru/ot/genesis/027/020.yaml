base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: ru
  text: 'Исаак сказал своему сыну: «Как же ты так быстро нашёл добычу, сын мой?» Тот ответил: «Потому что Яхве, твой Бог, послал мне её навстречу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроил это передо мной»; возможно также: «даровал мне успех».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה זֶּה
  choice: Как это
  rationale: Передаёт удивление Исаака и естественно вводит вопрос в современном русском языке.
- source_word: מִהַרְתָּ לִמְצֹא
  choice: ты так быстро нашёл
  rationale: Сочетание буквально означает «поспешил найти»; результативная русская конструкция естественно выражает неожиданную быстроту находки.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохраняет обращение и притяжательный суффикс; порядок слов соответствует достоинству библейской прямой речи, не звуча архаично.
- source_word: הִקְרָה ... לְפָנָי
  choice: даровал мне удачу
  rationale: В данном контексте каузатив глагола קרה с לְפָנַי обозначает устроенную Богом благоприятную встречу или находку. Русская идиома передаёт смысл естественнее, а буквальный образ сохранён в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: 'Сохранено значимое второе лицо: Иаков говорит «твой Бог», а не «мой Бог».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон, поэтому личное имя передано непосредственно.
- issue: Божественное содействие в הִקְרָה ... לְפָנָי
  choice: даровал мне удачу
  alternative: устроил это передо мной / послал мне навстречу
  rationale: Фраза приписывает благоприятный исход действию Бога, но не уточняет механизм. Выбранная формулировка сохраняет это утверждение, не усиливая его до более определённого учения о провидении.
- issue: Форма «твой Бог»
  choice: твой Бог
  alternative: наш Бог / Бог
  rationale: 'Сохранена повествовательная напряжённость: Иаков в обманной речи намеренно или по меньшей мере фактически называет Яхве Богом Исаака.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Диалог передан естественно; архаизмы устранены, личное имя Яхве и напряжённое «твой Бог» сохранены.
