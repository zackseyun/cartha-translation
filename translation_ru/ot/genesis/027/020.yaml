- from: 'Исаак сказал сыну: «Как это ты так быстро нашёл, сын мой?» Тот ответил: «Потому что Яхве, твой Бог, даровал мне удачу[a]».'
  to: 'Исаак сказал своему сыну: «Как же ты так быстро нашёл добычу, сын мой?» Тот ответил: «Потому что Яхве, твой Бог, послал мне её навстречу[a]».'
  rationale: Заменено интерпретирующее «даровал мне удачу» на «послал мне её навстречу», которое естественно по-русски и ближе передаёт каузативный смысл הִקְרָה с לְפָנַי. Добавлено контекстуально подразумеваемое «добычу» в вопросе и согласованное «её» в ответе для ясности русского текста. Сноска сохраняет более буквальную альтернативу и вариант с «успехом».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:48:45Z'
review_pass:
  verdict: revise
  source_fidelity: «Даровал мне удачу» допустимо как контекстуальное истолкование, но заметно сужает הִקְרָה ... לְפָנַי до результата («успеха»). Каузативная конструкция описывает то, что Яхве устроил/послал обстоятельства так, что добыча встретилась Иакову. «Послал мне навстречу» точнее сохраняет образ и причинность. Сохранены личное имя «Яхве» и значимое «твой Бог».
  naturalness: Предлагаемая редакция естественна для современного литературного русского. «Как же ты так быстро нашёл добычу?» ясно передаёт удивлённый вопрос; «добычу» восполняет подразумеваемый из контекста объект и избегает неестественного абсолютного употребления «нашёл».
  terminology: «Яхве» последовательно передаёт יהוה, а «твой Бог» — אֱלֹהֶיךָ. Формулировка не вносит конфессиональной интерпретации и не превращает выражение в более сильное утверждение о «удаче» как абстрактном даре.
