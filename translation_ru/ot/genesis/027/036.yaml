base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: ru
  text: 'Он сказал: «Не потому ли его назвали Иаковом? Ведь он дважды обошёл меня: забрал моё первородство, и вот теперь забрал моё благословение». И сказал: «Разве ты не оставил для меня благословения?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: Не потому ли его назвали Иаковом?
  rationale: Риторический вопрос передаёт горькое восклицание Исава и вводит игру слов с именем Иаков; формулировка остаётся естественной для современного русского языка.
- source_word: וַיַּעְקְבֵנִי
  choice: он уже дважды обошёл меня
  rationale: Глагол означает добиться преимущества над кем-либо, потеснить или перехитрить. «Обошёл меня» естественно выражает двойной смысл — взять верх и поступить не вполне прямо, — хотя звуковую игру с именем Иаков по-русски воспроизвести невозможно.
- source_word: זֶה פַעֲמַיִם
  choice: уже дважды
  rationale: Кратко и идиоматично передаёт указание на два случая, которые Исав тут же перечисляет.
- source_word: אֶת בְּכֹרָתִי לָקָח
  choice: забрал моё первородство
  rationale: «Первородство» обозначает права и положение первенца; простой глагол «забрал» сохраняет обвинительный тон, не усиливая нейтральное לָקַח до «похитил».
- source_word: וְהִנֵּה עַתָּה
  choice: а теперь, смотри
  rationale: «Смотри» передаёт эмоциональную и указательную силу הִנֵּה современным русским языком.
- source_word: לָקַח בִּרְכָתִי
  choice: забрал и моё благословение
  rationale: Повтор «забрал» отражает повторение לָקַח, а частица «и» подчёркивает вторую утрату.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: Неужели ты не оставил благословения и для меня?
  rationale: «Оставил… для меня» естественно передаёт идею сохранённого или удержанного благословения; «неужели» выражает вопрос с ожиданием желательного ответа.
