base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: ru
  text: 'Он тоже приготовил вкусное кушанье и принёс его отцу. И сказал он отцу: «Пусть мой отец встанет и поест дичи своего сына, чтобы душа твоя[a] благословила меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы благословила меня душа твоя»; здесь «душа твоя» может означать «ты сам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטְעַמִּים
  choice: вкусное кушанье
  rationale: Слово обозначает особо приготовленную вкусную пищу; единственное число по-русски естественно передаёт собирательное значение еврейской формы.
- source_word: גַּם הוּא
  choice: Он тоже
  rationale: Сохраняет добавочное ударение и параллель с предшествующим поступком Иакова.
- source_word: יָקֻם אָבִי
  choice: Пусть мой отец встанет
  rationale: Юссив выражает почтительную просьбу; обращение в третьем лице сохранено как черта речи Исава.
- source_word: מִצֵּיד בְּנוֹ
  choice: дичи своего сына
  rationale: צַיִד здесь означает добытую на охоте дичь; возвратное «своего» естественно при обращении «мой отец» и сохраняет родственное обозначение.
- source_word: בַּעֲבוּר
  choice: чтобы
  rationale: Ясно и естественно передаёт целевое значение конструкции.
- source_word: נַפְשֶׁךָ תְּבָרֲכַנִּי
  choice: твоя душа благословила меня
  rationale: Сохранено явное נֶפֶשׁ и торжественная формулировка, хотя по-русски это менее идиоматично, чем простое «ты благословил меня».
theological_decisions:
- issue: Значение выражения נַפְשֶׁךָ в просьбе о благословении
  choice: твоя душа благословила меня
  alternative: ты благословил меня
  rationale: Буквальная формулировка сохраняет антропологический язык и торжественность еврейского текста, не навязывая особого учения о составе человека; идиоматическое значение пояснено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Повтор «сказал он отцу» и обращение в третьем лице сохранены близко к еврейскому повествованию. Маркер сноски поставлен после всей реплики, к которой относится пояснение.
