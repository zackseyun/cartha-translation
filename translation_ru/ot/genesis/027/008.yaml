  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительное וְ, так и переход к немедленному наставлению, оставаясь естественным по-русски.
- source_word: בְּנִי
  choice: сын мой
  rationale: Естественное и достойное обращение с суффиксом первого лица; порядок слов уместен для материнской речи.
- source_word: שְׁמַע בְּקֹלִי
  choice: послушайся меня
  rationale: Еврейская идиома означает не просто услышать голос, а внять сказанному и поступить соответственно. Русское «послушайся меня» естественно передаёт это значение, не усиливая его до отвлечённого «повинуйся».
- source_word: לַאֲשֶׁר
  choice: и сделай то, что
  rationale: В данном контексте связывает призыв послушаться с содержанием непосредственно следующего повеления. Добавление «сделай» раскрывает подразумеваемое действие в естественной русской форме.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: я велю тебе
  rationale: Причастие выражает настоящее, непосредственное распоряжение. «Велю» передаёт силу צוה и звучит естественнее, чем тяжеловесное «приказываю тебе» в семейном обращении.
