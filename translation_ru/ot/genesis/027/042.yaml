  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: ru
  text: 'Ревекке передали слова Исава, её старшего сына. Тогда она послала за Иаковом, своим младшим сыном, и, позвав его, сказала ему: «Вот, твой брат Исав утешает себя мыслью о том, что убьёт тебя.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утешает себя, намереваясь убить тебя»; еврейская фраза необычно связывает самоутешение Исава с убийством Иакова и допускает оттенок цели или намерения.'
    reason: Сохраняет неоднозначную связь מִתְנַחֵם с לְהָרְגֶךָ, не сводя её к одному толкованию.
lexical_decisions:
- source_word: דִּבְרֵי
  choice: слова
  rationale: Прямое и естественное соответствие в контексте сообщённого намерения Исава.
- source_word: מִתְנַחֵם
  choice: утешает себя мыслью
  rationale: Возвратная форма передаёт то, что Исав находит для себя утешение; добавление «мыслью» делает русскую фразу естественной, не устраняя мрачной иронии оригинала.
- source_word: לְהָרְגֶךָ
  choice: о том, что убьёт тебя
  rationale: Инфинитив выражает содержание или основание этого самоутешения; перевод ясно связывает утешение с намерением убить Иакова.
theological_decisions:
- issue: Характер намерения Исава
  choice: утешает себя мыслью о том, что убьёт тебя
  alternative: утешится, убив тебя / замышляет убить тебя
  rationale: Выбранный вариант сохраняет буквальный образ самоутешения и одновременно передаёт убийственное намерение, не сводя необычную формулировку лишь к нейтральному «замышляет».
translation_notes:
  register: Современный литературный русский язык; повествование сдержанное и ясное. «Старший» и «младший» естественно передают семейное противопоставление; частица «вот» сохраняет הִנֵּה и придаёт предупреждению непосредственность.
