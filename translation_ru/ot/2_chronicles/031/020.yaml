    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: Так поступал
  rationale: Сочетание עשה с כָּזֹאת подводит итог описанным ранее преобразованиям. «Так поступал» естественно передаёт обобщающий смысл и допускает длительное, последовательное действие.
- source_word: בְּכָל יְהוּדָה
  choice: по всей Иудее
  rationale: Предлог בְּ с כָּל и названием области указывает на полный географический охват; это естественно передаётся оборотом «по всей Иудее».
- source_word: הַטּוֹב
  choice: доброе
  rationale: Прилагательное с артиклем употреблено субстантивированно и обозначает то, что является добрым.
- source_word: הַיָּשָׁר
  choice: справедливое
  rationale: В нравственном контексте יָשָׁר означает правильное, правое или справедливое. «Справедливое» сохраняет этическое значение и образует естественный ряд с «доброе» и «верное».
- source_word: הָאֱמֶת
  choice: верное
  rationale: אֱמֶת может обозначать истину, надёжность и верность. В данном описании поступков «верное» передаёт качество честного и надёжного поведения, не исключая оттенка истинности.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי выражает действие в присутствии Бога и под его оценкой; «пред» сохраняет эту библейскую формулу в понятном литературном регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהָיו
  choice: своим Богом
  rationale: Притяжательное местоимение относится к подлежащему Езекии; русское «своим» однозначно и естественно выражает эту связь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» сохраняет его функцию и соответствует современной научной транслитерации.
- issue: Значение הָאֱמֶת в нравственной триаде
  choice: верное
  alternative: истинное; правдивое
  rationale: Контекст характеризует деятельность Езекии, поэтому оттенок верности и надёжности поведения здесь уместен. Сноска сохраняет реальную лексическую неоднозначность слова.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Троекратная конструкция «доброе, справедливое и верное» сохраняет нравственную триаду оригинала; архаизирующее «пред» оставлено как краткая и узнаваемая формула.
