  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: ru
  text: Когда это известие распространилось, сыны Израиля[a] принесли в большом количестве начатки зерна, молодого вина, масла, мёда[b] и всякого урожая с полей; и десятину от всего они принесли в изобилии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтяне», «народ Израиля». В еврейском тексте буквально: «сыны Израиля» — обычное собирательное обозначение народа Израиля.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых контекстах еврейское слово может означать не только пчелиный мёд, но и сладкий плодовый сироп, например финиковый.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: Когда это стало широко известно
  rationale: Оборот с инфинитивом פְרֹץ имеет временное значение «когда» и передаёт быстрое распространение вести или распоряжения. Нейтральное «это» сохраняет широту значения דָּבָר и не решает однозначно, имеется ли в виду само повеление или весть о нём.
- source_word: הִרְבּוּ
  choice: во множестве принесли
  rationale: Каузативная форма רבה указывает на большое количество принесённых начатков. Глагол «принесли» естественно восполняется из следующей части еврейского предложения.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено формальное корпоративное выражение исходного текста; в данном контексте оно обозначает израильский народ в целом.
- source_word: רֵאשִׁית
  choice: начатки
  rationale: В контексте приношений слово обозначает первую, посвящаемую Богу часть урожая; «начатки» — краткий и укоренившийся русский эквивалент.
- source_word: דָּגָן
  choice: зерно
  rationale: Общее обозначение зерновых культур передано современным и понятным словом.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Слово обычно обозначает свежее вино или виноградный продукт нового урожая; перевод сохраняет сельскохозяйственный оттенок, не сводя значение к неперебродившему соку.
- source_word: יִצְהָר
  choice: масло
  rationale: Обычно имеется в виду оливковое масло, однако в основном тексте сохранено более общее обозначение исходного слова.
- source_word: דְבַשׁ
  choice: мёд
  rationale: Основной традиционный эквивалент сохранён, а возможное значение сладкого плодового сиропа отмечено в сноске.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: и всякого урожая с полей
  rationale: Передаёт совокупность сельскохозяйственных плодов; множественное «с полей» естественно для современного русского языка.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: десятину от всего
  rationale: מַעֲשֵׂר — специальное обозначение десятины, а הַכֹּל подчёркивает полноту облагаемых ею продуктов.
- source_word: לָ/רֹב
  choice: в изобилии
  rationale: Передаёт повторный акцент стиха на чрезвычайно большом количестве принесённого.
theological_decisions:
- issue: Корпоративное выражение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формальное мужское выражение сохранено, но сноска поясняет, что оно употреблено корпоративно и не ограничивает участников только взрослыми мужчинами.
- issue: Значение דְבַשׁ в перечне земледельческих продуктов
  choice: мёд
  alternative: сладкий сироп, например финиковый
  rationale: Контекст не позволяет уверенно выбрать между пчелиным мёдом и плодовым сиропом, поэтому традиционное значение оставлено в тексте, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Сыны Израиля» и «начатки» сохраняют ключевую лексику исходного текста; синтаксис сделан понятным для обычного современного читателя. Повтор указания на изобилие сохранён, поскольку он присутствует и в еврейском стихе.
