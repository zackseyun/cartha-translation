base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: ru
  text: Когда Езекия и сановники пришли и увидели груды[a], они благословили Яхве и Его народ — Израиль[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кучи». Речь идёт о скопившихся приношениях, прежде всего о принесённых продуктах.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «его народ, Израиль», если слово «его» относится к Езекии, а не к Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Глагол בוא в последовательном повествовании естественно передаётся простым прошедшим временем «пришли».
- source_word: יְחִזְקִיָּהוּ
  choice: Езекия
  rationale: Использована традиционная русская форма библейского имени.
- source_word: וְהַשָּׂרִים
  choice: и сановники
  rationale: שׂרים обозначает высокопоставленных руководителей или должностных лиц; «сановники» точно и естественно для царского административного контекста.
- source_word: וַיִּרְאוּ
  choice: и увидели
  rationale: Прямое значение ראה в данном контексте — зрительное восприятие.
- source_word: הָעֲרֵמוֹת
  choice: груды
  rationale: Существительное обозначает скопления или кучи сложенных приношений; «груды» сохраняет конкретный образ исходного текста.
- source_word: וַיְבָרֲכוּ
  choice: они благословили
  rationale: ברך с Богом в роли объекта значит благословлять, то есть воздавать хвалу; тот же глагол относится и к народу, поэтому единое «благословили» сохраняет структуру и смысловую напряжённость еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: Его народ — Израиль
  rationale: Местоименный суффикс наиболее естественно относится к Яхве, а имя «Израиль» поясняет, о каком народе идёт речь.
theological_decisions:
- issue: К кому относится местоименный суффикс в עַמּוֹ («его народ»)?
  choice: 'В основном тексте «Его» относится к Яхве: «Его народ — Израиль».'
  alternative: 'Суффикс может относиться к Езекии: «его народ, Израиль», то есть народ царя.'
  rationale: Непосредственная связь с именем Яхве и обычное библейское представление об Израиле как Его народе поддерживают основной вариант, однако грамматика допускает отнесение суффикса к Езекии, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксический параллелизм еврейского повествования сохранён без архаизации; буквальное «благословили» оставлено и при Яхве, и при Израиле.
