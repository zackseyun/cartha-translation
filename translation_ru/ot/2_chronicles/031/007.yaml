base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: ru
  text: В третьем месяце они начали складывать груды[a] с основания[b], и в седьмом месяце закончили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кучи». Имеются в виду скопившиеся груды принесённых продуктов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «начали основывать груды». Необычное выражение описывает начало складывания груд с нижнего, основного слоя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: В третьем месяце
  rationale: חֹדֶשׁ в хронологическом указании означает «месяц»; сочетание предлога с определённой формой естественно передаётся как «в третьем месяце».
- source_word: הֵחֵלּוּ
  choice: они начали
  rationale: Глагольная форма в данной конструкции обозначает начало действия; «начали» — точный и естественный русский эквивалент.
- source_word: הָעֲרֵמוֹת
  choice: груды
  rationale: עֲרֵמוֹת обозначает груды или кучи, здесь — скопления принесённых продуктов. «Груды» сохраняет конкретный образ и соответствует достойному литературному регистру.
- source_word: לְיִסּוֹד
  choice: закладывая их основание
  rationale: Инфинитив от יסד выражает основание или закладку основания. Деепричастный оборот естественно передаёт способ, каким начали устраивать груды, и сохраняет образ основания.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: а в седьмом месяце
  rationale: Союз связывает два сопоставленных временных указания; русское «а» яснее передаёт переход от начала работ к их завершению.
- source_word: כִּלּוּ
  choice: закончили
  rationale: Форма от כלה означает «закончить, завершить». В еврейском объект не выражен, поэтому русский перевод также оставляет его подразумеваемым из контекста.
