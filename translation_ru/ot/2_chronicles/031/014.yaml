base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: ru
  text: Корей, сын Имны, левит и привратник на восточной стороне, заведовал добровольными приношениями Богу, чтобы раздавать[a] приношение Яхве и святыни высшей святости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «давать». Еврейский неопределённый глагол буквально означает «давать», а здесь, вероятно, — раздавать посвящённое.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «самые святые приношения». Еврейское выражение обозначает святыни особой, высшей степени святости, а не обязательно храмовое помещение — Святое святых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן־יִמְנָה
  choice: Корей, сын Имны
  rationale: Имена переданы в привычной русской библейской форме; начальный союз не воспроизведён, поскольку в русском продолжение повествования не требует «и» перед подлежащим.
- source_word: הַלֵּוִי הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: левит и привратник с восточной стороны
  rationale: Сохранены определённые характеристики Корея; «с восточной стороны» передаёт местоположение, не добавляя отсутствующего в еврейском тексте слова «ворота».
- source_word: עַל
  choice: заведовал
  rationale: В административном контексте предлог обозначает ответственность и надзор; русский глагол естественно выражает подразумеваемую функцию.
- source_word: נִדְבוֹת הָאֱלֹהִים
  choice: добровольными приношениями Богу
  rationale: נִדְבוֹת — добровольные дары или приношения; дательный «Богу» естественно показывает адресата посвящения в данном культовом контексте.
- source_word: לָתֵת
  choice: чтобы раздавать
  rationale: Буквально «давать»; по контексту храмового распределения речь идёт о выдаче посвящённых даров получателям.
- source_word: תְּרוּמַת יְהוָה
  choice: приношение Яхве
  rationale: «Приношение» понятно современному читателю и передаёт отделённую долю; конструкция с именем Яхве сохраняет краткость и возможный оттенок принадлежности или посвящения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: и святыни высшей святости
  rationale: Еврейская конструкция выражает наивысшую степень святости. Формулировка не смешивает эти посвящённые предметы или дары со Святым святых как помещением.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя Бога.
- issue: Значение קָדְשֵׁי הַקֳּדָשִׁים
  choice: святыни высшей святости
  alternative: самые святые приношения; Святое святых
  rationale: В контексте распределения речь идёт о святынях или приношениях высшей степени святости, а не о внутреннем помещении храма.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Административная функция выражена естественным глаголом «заведовал»; культовые термины сохранены без архаичного «возношение» и без пояснительных добавлений в основном тексте.
