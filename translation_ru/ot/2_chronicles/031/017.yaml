base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: ru
  text: И родословную запись священников — по их отеческим домам[a], и левитов от двадцати лет и старше — по их обязанностям, по их подразделениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священников, записанных по родословию, — по их отеческим домам, и левитов…». Еврейская фраза сжата и эллиптична.'
    reason: lexical_alternative
  - marker: b
    text: «Подразделения» — организованные группы, по которым распределялась служба.
    reason: cultural_note
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: родословную запись
  rationale: Глагол обозначает внесение в родословные списки или регистрацию по происхождению. В сжатой эллиптической конструкции после וְאֵת русское именное выражение передаёт административный смысл, не добавляя отсутствующего в еврейском тексте личного глагола.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: по их отеческим домам
  rationale: Речь идёт о родовых объединениях по отцовской линии, служивших единицами официального учёта и организации.
- source_word: וְהַלְוִיִּם
  choice: а левитов
  rationale: Эллиптически продолжает мысль о родословной записи; русская конструкция позволяет не повторять существительное, сохраняя параллелизм.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная передача стандартной формулы возрастного порога.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: по их обязанностям
  rationale: מִשְׁמֶרֶת здесь обозначает порученную службу, обязанность или служебное назначение, а не обязательно караульную смену.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: по их подразделениям
  rationale: Слово обозначает организованные служебные группы или разряды. Повтор предлога «по» отражает одинаковое בְּ при обоих существительных.
