base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: ru
  text: И во всяком деле, которое он начинал, — в служении при Доме Бога, в Законе[a] и заповеди, ища своего Бога[b], — он действовал всем сердцем и преуспевал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в наставлении». Еврейское слово тора может означать как закон, так и наставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вопрошая своего Бога». Еврейский глагол может означать и искать Бога, и обращаться к Нему за ответом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «добивался успеха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה
  choice: И во всяком деле
  rationale: מַעֲשֶׂה обозначает дело, труд или деятельность; «дело» естественно охватывает все начинания Езекии и сохраняет обобщающий характер выражения.
- source_word: אֲשֶׁר הֵחֵל
  choice: которое он начинал
  rationale: Форма הֵחֵל означает «начинать». Несовершенный вид по-русски естественно описывает всякое предпринимавшееся им дело.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: в служении при доме Бога
  rationale: עֲבוֹדָה может обозначать труд и культовое служение. Предлог «при» показывает связь служения с храмом, не ограничивая смысл только действиями внутри здания.
- source_word: וּבַתּוֹרָה
  choice: в Законе
  rationale: В контексте реформ Езекии תּוֹרָה прежде всего указывает на данный Богом Закон; написание с прописной буквы передаёт эту конкретную отсылку. Более широкое значение «наставление» отмечено в сноске.
- source_word: וּבַמִּצְוָה
  choice: и заповеди
  rationale: Сохранено единственное число еврейского מִצְוָה, которое здесь может иметь собирательный смысл.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: чтобы искать своего Бога
  rationale: דרשׁ применительно к Богу сочетает значения искания, обращения и вопрошания. «Искать своего Бога» сохраняет ключевой для Паралипоменон мотив преданного обращения к Богу.
- source_word: בְּכָל לְבָבוֹ עָשָׂה
  choice: он действовал от всего сердца
  rationale: Масоретическое членение позволяет непосредственно связывать «от всего сердца» с עָשָׂה. «Действовал» естественно передаёт широкий глагол «делать», не вводя отсутствующего в тексте объекта.
- source_word: וְהִצְלִיחַ
  choice: и преуспевал
  rationale: Hiphil глагола צלח здесь имеет непереходное значение «иметь успех, преуспевать». Выбранная форма согласуется с повторяющимся характером описываемых начинаний.
theological_decisions:
- issue: Значение תּוֹרָה в контексте храмовой реформы
  choice: Закон
  alternative: наставление
  rationale: Контекст связывает деятельность Езекии с установленным Богом порядком, поэтому «Закон» уместен в основном тексте; более широкая лексическая возможность не устранена и дана в сноске.
- issue: Значение выражения לִדְרֹשׁ לֵאלֹהָיו
  choice: искать своего Бога
  alternative: вопрошать своего Бога
  rationale: В Паралипоменонах это выражение часто обозначает всецелое обращение к Богу, но может включать и обращение за ответом; основной перевод сохраняет широкий богословский мотив, а более узкий оттенок отмечен в сноске.
- issue: Связь выражения בְּכָל לְבָבוֹ
  choice: 'с действием Езекии: «он действовал от всего сердца»'
  alternative: 'с исканием Бога: «искать своего Бога всем сердцем»'
  rationale: Положение слов и масоретическое членение поддерживают связь с עָשָׂה, хотя смысловая связь с ближайшим мотивом искания также возможна. Основной текст следует формальной структуре, не отрицая естественного смыслового перекрытия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире разграничивают длинное перечисление и основное сказуемое. Синтаксис по возможности сохраняет структуру еврейского текста, а неоднозначные значения вынесены в краткие сноски.
