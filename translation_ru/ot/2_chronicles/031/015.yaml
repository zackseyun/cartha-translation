base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: ru
  text: Под его началом[a] были Эден, Миниамин, Иешуа, Шемаия, Амария и Шехания. В городах священников они добросовестно раздавали своим братьям[b] по подразделениям[c] — и большим, и малым[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом с ним», «под его надзором». Еврейский оборот может указывать на содействие, подчинение или полномочия.'
    reason: lexical_alternative
  - marker: b
    text: То есть своим собратьям из священнического сообщества.
    reason: cultural_note
  - marker: c
    text: 'Или: «по чередам». Речь идёт об установленных группах (подразделениях) священников.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «как большому, так и малому». Выражение может относиться к возрасту, положению или обозначать всех без различия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: Под его началом
  rationale: Еврейский оборот может указывать на подчинение, надзор или содействие. В административном контексте естественное русское выражение «под его началом» передаёт отношения с ранее названным распорядителем, не сводя неоднозначный оборот к буквальному «при его руке».
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: Еден, Миниамин, Иешуа, Шемаия, Амария и Шехания
  rationale: Имена переданы принятой русской библейской транслитерацией, с различением Иешуа от русского имени Иисус.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: в городах священников
  rationale: Прямая и ясная передача генитивной конструкции; речь идёт о населённых пунктах, отведённых священникам.
- source_word: בֶּאֱמוּנָה
  choice: добросовестно
  rationale: В административном контексте слово характеризует надёжное, верное исполнение поручения; «добросовестно» естественно выражает это значение по-русски.
- source_word: לָתֵת
  choice: распределяли положенное
  rationale: Буквально глагол означает «давать», но контекст организованной выдачи долей позволяет передать его как «распределяли». Слово «положенное» обозначает подразумеваемые доли из предыдущего контекста, не уточняя их состав.
- source_word: לַאֲחֵיהֶם
  choice: между своими братьями
  rationale: Сохранено буквальное родственное обозначение; по контексту имеются в виду собратья по священническому сообществу, что пояснено в сноске.
- source_word: בְּמַחְלְקוֹת
  choice: по чередам
  rationale: מַחְלְקוֹת обозначает установленные служебные подразделения или череды. «По чередам» соответствует историко-культовому контексту и остаётся понятно с пояснением.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: как между старшими, так и между младшими
  rationale: Буквально «как большому, так и малому». В контексте распределения внутри священнических родов вероятно возрастное значение; формулировка сохраняет парность и равный охват, а альтернативное понимание по положению отмечено в сноске.
theological_decisions:
- issue: Значение כַּגָּדוֹל כַּקָּטָן
  choice: как между старшими, так и между младшими
  alternative: как между знатными, так и между незнатными / большим и малым
  rationale: Контекст параллельного перечня получателей по родословиям и возрасту в стихах 16–18 склоняет к возрастному смыслу, однако сама идиома допускает различие по положению или обобщённое «всем без исключения», поэтому неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис разделён на два предложения ради ясности длинной административной формулы. Термин «череды» сохранён как точный контекстуальный эквивалент и снабжён кратким пояснением.
