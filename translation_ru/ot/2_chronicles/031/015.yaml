revisions:
- from: Под его началом[a] были Еден, Миниамин, Иешуа, Шемаия, Амария и Шехания. В городах священников они добросовестно распределяли положенное между своими братьями[b] по чередам[c] — как между старшими, так и между младшими[d].
  to: Под его началом[a] были Эден, Миниамин, Иешуа, Шемаия, Амария и Шехания. В городах священников они добросовестно раздавали своим братьям[b] по подразделениям[c] — и большим, и малым[d].
  rationale: Исправление сохраняет смысл оригинала и административный регистр, но устраняет добавленное «положенное», заменяет потенциально временное «по чередам» более нейтральным «по подразделениям», нормализует имя «Эден» и, главное, сохраняет неоднозначность идиомы «большому и малому» в основном тексте и сноске.
