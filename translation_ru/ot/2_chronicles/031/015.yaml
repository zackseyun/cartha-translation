  verdict: revise
  source_fidelity: 'В целом переданы административное подчинение названных лиц, место служения, надёжность исполнения, распределение среди священнических «братьев» и охват «больших и малых». Однако «как между старшими, так и между младшими» неоправданно сужает כַּגָּדוֹל כַּקָּטָן до возраста: в данном выражении возможны возраст, статус либо общий смысл всеохватности. «Положенное» также прямо не выражено в стихе, хотя и подразумевается ближайшим контекстом.'
  naturalness: Текст в основном естественен, но «распределяли положенное между своими братьями по чередам» несколько тяжеловесен и может создавать впечатление распределения по времени. Формулировка «раздавали своим братьям по подразделениям» яснее передаёт направленность выдачи и установленное деление получателей.
  terminology: Имена следует привести к более обычной русской библейской форме «Эден». «Череды» допустимо в культовом контексте, но «подразделения» точнее передаёт מַחְלְקוֹת без добавления временного оттенка. «Братья» сохранено в тексте; пояснение о священническом сообществе уместно в сноске.
