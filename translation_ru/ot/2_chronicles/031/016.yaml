base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: ru
  text: Помимо внесённых в родословные списки мужчин от трёх лет и старше[a], [доли выдавали] всем, кто входил в дом Яхве, для исполнения положенного на каждый день служения[b] — в соответствии со своими обязанностями[c] и согласно своим подразделениям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помимо зарегистрированных по родословиям мужчин».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для дела дня в его день», то есть для того, что требовалось в каждый день.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в своих дежурствах»; еврейское слово может обозначать обязанности, дежурства или установленную очередь служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: помимо
  rationale: Передаёт отделительно-добавочное значение, не сводя его ни к строгому исключению, ни к простому присоединению.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: внесённых в родословные списки мужчин
  rationale: Глагольная форма указывает на официальную регистрацию по происхождению, а זְכָרִים прямо обозначает лиц мужского пола.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: от трёх лет и старше
  rationale: Естественная современная русская передача установленного возрастного порога.
- source_word: לְכָל הַבָּא
  choice: всех, кто приходил
  rationale: Коллективное причастие передано обобщающей конструкцией; несовершенный вид выражает регулярное посещение, а не однократный вход.
- source_word: לְבֵית יְהוָה
  choice: в дом Яхве
  rationale: Сохраняет библейское выражение «дом» и передаёт тетраграмматон личным именем «Яхве».
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: исполняя ежедневные обязанности
  rationale: Идиоматически передаёт требование или положенное дело каждого дня; буквальная форма пояснена в сноске.
- source_word: לַעֲבוֹדָתָם
  choice: неся свою службу
  rationale: В храмовом контексте עֲבוֹדָה обозначает назначенное служение, без привнесения поздней церковной терминологии.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: по своим сменам
  rationale: Передаёт организованные дежурства или очереди служения ясным современным выражением.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: согласно своим подразделениям
  rationale: Обозначает установленные организационные группы священников и левитов.
theological_decisions:
- issue: Указание пола храмовых служителей
  choice: мужчин
  alternative: людей; тех, кто был внесён в списки
  rationale: Еврейское זְכָרִים явно обозначает лиц мужского пола, поэтому гендерное указание сохранено.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Синтаксическая связь начального оборота
  choice: сохранена фрагментарная конструкция «помимо… — всех…»
  alternative: перестроить фразу так, чтобы однозначно определить отношение между зарегистрированными и приходившими
  rationale: Стих синтаксически зависит от предшествующего контекста, а точное отношение начального מִלְּבַד к последующему לְכָל допускает напряжённое прочтение; перевод не устраняет эту особенность искусственным истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового контекста. Административные термины переданы понятно, без архаизмов «чреда» и «стража» в основном тексте. Тире отмечает трудную, зависимую от предыдущего стиха синтаксическую конструкцию и не снимает её неоднозначности.
