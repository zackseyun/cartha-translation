base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: ru
  text: А для сыновей Аарона[a], священников, — на полях вокруг их городов[b] — в каждом городе[c] были поимённо назначены[d] люди, чтобы выдавать доли каждому мужчине из священников и каждому, внесённому в родословные списки среди левитов[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомков Аарона». В еврейском тексте буквально: «сыновей Аарона»; в родословном употреблении это выражение может обозначать и более поздних потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на общинных угодьях» или «на открытых землях вокруг их городов». Речь идёт о землях вокруг городов, часто использовавшихся как пастбища.'
    reason: cultural_note
  - marker: c
    text: 'В еврейском тексте буквально: «в каждом городе и городе» — распределительное выражение со значением «в каждом без исключения городе».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «указанные поимённо» или «внесённые в список поимённо». Еврейское выражение означает, что эти люди были официально определены по именам.'
    reason: lexical_alternative
  - marker: e
    text: То есть каждому левиту, внесённому в родословные записи.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: А для сыновей Аарона, священников
  rationale: «Сыновья Аарона» сохраняет форму еврейского родословного обозначения, которое может включать позднейших потомков; приложение «священников» передаёт הַכֹּהֲנִים.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: живших на пастбищных землях при своих городах
  rationale: מִגְרָשׁ обозначает открытые угодья вокруг левитских городов, обычно служившие пастбищами. Добавление «живших» естественно связывает предложный оборот с названной группой и соответствует контексту распределения вне городских центров.
- source_word: בְּכָל עִיר וָעִיר
  choice: в каждом городе
  rationale: Буквальное повторение «в каждом городе и городе» является распределительной идиомой; по-русски её смысл естественно передаётся выражением «в каждом городе».
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: были люди, назначенные поимённо
  rationale: Оборот указывает на людей, официально определённых или названных по именам. «Назначенные поимённо» сохраняет административный оттенок, не сводя выражение лишь к наличию списка.
- source_word: לָתֵת מָנוֹת
  choice: выдавать доли
  rationale: מָנוֹת — положенные части или доли припасов; «выдавать доли» естественно для контекста организованного распределения.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: каждому мужчине из священников
  rationale: זָכָר прямо обозначает лицо мужского пола; «мужчине» сохраняет это ограничение и звучит естественнее буквального «каждому мужского пола».
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: каждому внесённому в родословные списки левитов
  rationale: Форма от יחס относится к родословной регистрации. Русская формулировка ясно передаёт как документальную запись, так и принадлежность к левитам.
