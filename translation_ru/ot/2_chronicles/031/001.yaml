  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: ru
  text: Когда всё это было завершено, все израильтяне, находившиеся там, разошлись по городам Иудеи и разбили культовые столбы, срубили ашеры[a], разрушили высоты и жертвенники по всей Иудее и Вениамине, а также в Ефреме и Манассии, пока не уничтожили их полностью. После этого все сыны Израиля возвратились, каждый в своё владение, в свои города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «срубили столбы Ашеры» или «срубили священные деревья Ашеры». Еврейское אֲשֵׁרִים обозначает культовые предметы, связанные с Ашерой; их точная форма не определена, хотя часто их понимают как деревянные столбы или деревья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: Когда всё это было завершено
  rationale: Временная конструкция с инфинитивом передана естественным русским придаточным; страдательная форма не вводит отсутствующего в еврейском тексте явного субъекта.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: все израильтяне, находившиеся там
  rationale: Причастие הנמצאים означает находившихся или присутствовавших; добавление «там» естественно указывает на участников описанного выше собрания.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: разбили священные камни
  rationale: מַצֵּבוֹת обозначает культовые стоячие камни или столбы. «Священные камни» ясно передаёт их культовую функцию, а «разбили» — действие שׁבר.
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: срубили столбы Ашеры
  rationale: אֲשֵׁרִים — множественное обозначение культовых предметов, связанных с Ашерой, вероятно деревянных столбов или деревьев; «срубили» соответствует глаголу גדע.
- source_word: וַיְנַתְּצוּ אֶת הַבָּמוֹת וְאֶת הַמִּזְבְּחֹת
  choice: разрушили высоты и жертвенники
  rationale: «Высоты» — традиционное и достаточно понятное обозначение культовых мест בָּמוֹת; נָתַץ выражает разрушение сооружений.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: по всей Иудее и земле Вениамина, а также в землях Ефрема и Манассии
  rationale: 'Формулировка естественно передаёт территориальный охват и сохраняет различие предлогов: מִן при Иудее и Вениамине и ב при Ефреме и Манассии.'
- source_word: עַד לְכַלֵּה
  choice: пока не уничтожили их полностью
  rationale: Оборот указывает на доведение разрушения перечисленных культовых объектов до конца; местоимение «их» восполняет очевидный объект по-русски.
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם
  choice: все сыны Израиля возвратились в свои города, каждый в своё владение
  rationale: «Сыны Израиля» сохраняет явно мужскую форму этнонима; distributive אִישׁ передано как «каждый», а אֲחֻזָּה — как земельное «владение». Порядок слегка перестроен для ясного современного русского синтаксиса.
theological_decisions:
- issue: Мужская форма этнонима и распределительное אִישׁ
  choice: все сыны Израиля возвратились… каждый в своё владение
  alternative: все израильтяне возвратились… каждый в своё владение
  rationale: В заключительной фразе сохранена выраженная в источнике мужская форма בְּנֵי יִשְׂרָאֵל и распределительное значение אִישׁ без вывода о том, что женщины исключены из сообщества.
- issue: Характер объектов אֲשֵׁרִים
  choice: столбы Ашеры
  alternative: Ашеры; священные деревья
  rationale: Текст связывает объекты с Ашерой, но не определяет их материальную форму совершенно однозначно. Основной текст использует наиболее распространённое понимание, а примечание сохраняет неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Термины «сыны Израиля», «высоты» и «жертвенники» сохранены как укоренённая библейская лексика; менее прозрачные культовые реалии уточнены контекстом и сноской.
