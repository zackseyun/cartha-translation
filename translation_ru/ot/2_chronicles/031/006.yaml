  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: ru
  text: Израильтяне и иудеи, жившие в городах Иудеи, также принесли десятину крупного и мелкого скота[a] и десятину святынь, посвящённых Яхве, их Богу, и сложили их в груды, груду за грудой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «крупного скота и мелкого скота»; под мелким скотом подразумеваются овцы и козы.'
    reason: Уточнение объёма значения צֹאן.
  - marker: b
    text: 'Буквально: «груды, груды»; повторение подчёркивает множество груд.'
    reason: Передача повторения עֲרֵמוֹת עֲרֵמוֹת.
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: сыны Израиля и Иуды
  rationale: בני — традиционное собирательное обозначение членов народа, включающее не только мужчин; формулировка сохраняет историко-библейский строй и остаётся понятной по-русски.
- source_word: הַיֹּשְׁבִים בְּעָרֵי יְהוּדָה
  choice: жившие в городах Иудеи
  rationale: Причастие ישב обозначает постоянное проживание; «города Иудеи» естественно передаёт географический смысл.
- source_word: גַּם הֵם
  choice: также
  rationale: 'Передаёт присоединительное ударение: эти жители тоже участвовали в приношении.'
- source_word: מַעְשַׂר בָּקָר וָצֹאן
  choice: десятину крупного и мелкого скота
  rationale: בקר — крупный рогатый скот, а צאן — собирательно мелкий скот, прежде всего овцы и козы; такая пара точнее, чем сужение до одних овец.
- source_word: וּמַעְשַׂר קָדָשִׁים הַמְקֻדָּשִׁים
  choice: и десятину святынь, посвящённых
  rationale: קדשים обозначает священные, отделённые для Бога предметы или дары; пассивное причастие подчёркивает их посвящение.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: Яхве, их Богу
  rationale: Личное имя יהוה передано как «Яхве»; ל при מקדשים указывает, кому эти святыни посвящены.
- source_word: הֵבִיאוּ
  choice: принесли
  rationale: Каузативная форма בוא имеет здесь обычное значение «принести».
- source_word: וַיִּתְּנוּ
  choice: сложили всё
  rationale: נתן буквально означает «положили/поместили»; в сочетании с грудами естественное русское «сложили» выражает физическое размещение. «Всё» эксплицирует подразумеваемый объект без изменения смысла.
- source_word: עֲרֵמוֹת עֲרֵמוֹת
  choice: груда за грудой
  rationale: Повтор существительного выражает множество последовательно сложенных груд; русская конструкция сохраняет интенсивность без стилистической тяжеловесности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и соответствует предоставленному редакционному решению.
- issue: Значение קָדָשִׁים
  choice: святыни
  alternative: священные дары
  rationale: Контекст не позволяет уверенно сузить обозначение до конкретного вида даров; «святыни» сохраняет широту и культовый оттенок исходного слова.
