  source_fidelity: 'Основной смысл передан точно: названы жители городов Иудеи, десятины от крупного и мелкого скота, десятина святынь, посвящённых Яхве, и складывание приношений в многочисленные груды. Однако «всё» не выражено в еврейском тексте, а основное выражение о грудах лучше передать с явным указанием размещения «в груды».'
