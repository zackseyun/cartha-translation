revisions:
- from: А сыны Израиля и Иуды, жившие в городах Иудеи, также принесли десятину крупного и мелкого скота[a] и десятину святынь, посвящённых Яхве, их Богу, и сложили всё груда за грудой[b].
  to: Израильтяне и иудеи, жившие в городах Иудеи, также принесли десятину крупного и мелкого скота[a] и десятину святынь, посвящённых Яхве, их Богу, и сложили их в груды, груду за грудой[b].
  rationale: Правка делает текст более современным и устраняет невыраженное «всё», сохраняя значение всех элементов еврейского текста. Формула «в груды, груду за грудой» передаёт как физическое размещение, так и усилительный повтор существительного; сноска объясняет его буквально.
