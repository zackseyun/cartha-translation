  terminology: «Яхве» соответствует предоставленному редакционному решению. «Святыни, посвящённые Яхве» адекватно сохраняет и קָדָשִׁים, и הַמְקֻדָּשִׁים, не навязывая конкретный вид приношений. «Мелкий скот» правильно не сужает צֹאן до овец.
