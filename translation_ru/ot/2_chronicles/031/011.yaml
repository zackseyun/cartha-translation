base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: ru
  text: Тогда Езекия велел[a] подготовить помещения[b] в доме Яхве, и их подготовили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказал подготовить». Еврейский глагол буквально означает «сказал», но здесь вводит царское распоряжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «комнаты»; по контексту это могли быть кладовые.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: велел
  rationale: Глагол буквально означает «сказал», однако сочетание с инфинитивом здесь передаёт царское распоряжение. «Велел» естественно выражает эту силу, не добавляя лишней категоричности.
- source_word: יְחִזְקִיָּהוּ
  choice: Езекия
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: לְהָכִין
  choice: приготовить
  rationale: Порода хифиль глагола כון здесь означает «сделать готовым, приготовить»; по контексту речь идёт о подготовке помещений.
- source_word: לְשָׁכוֹת
  choice: помещения
  rationale: Слово обозначает отдельные комнаты или помещения храмового комплекса. «Помещения» сохраняет архитектурный смысл, не делая их назначение исключительно складским.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Передаёт буквально храмовое обозначение «дом Яхве», сохраняя исходный образ, а не заменяя его словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: וַיָּכִינוּ
  choice: и их приготовили
  rationale: Форма множественного числа имеет подразумеваемое дополнение, восстанавливаемое из слова «помещения»; местоимение делает русскую фразу полной и ясной.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Форма «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Сохранено традиционное выражение «дом Яхве» и неопределённый субъект последнего глагола.
