base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: ru
  text: Они добросовестно внесли пожертвования, десятину и посвящённые предметы[a]. Начальником над ними был левит Конания, а его брат Шимей — вторым после него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священные предметы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его брат Шимей был его заместителем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: приносили туда
  rationale: Каузативная форма глагола בוא означает «приносить, доставлять». «Туда» естественно указывает на упомянутые в контексте храмовые кладовые, не добавляя излишней конкретики.
- source_word: הַתְּרוּמָה
  choice: пожертвования
  rationale: תְּרוּמָה обозначает долю, отделённую для священного употребления. «Пожертвования» понятно современному читателю и не вводит узкого ритуального смысла.
- source_word: הַמַּעֲשֵׂר
  choice: десятину
  rationale: מַעֲשֵׂר — обычное обозначение десятой части, отдаваемой Богу; «десятина» является точным и устоявшимся русским соответствием.
- source_word: הַקֳּדָשִׁים
  choice: святыни
  rationale: Множественное קֳדָשִׁים здесь обозначает предметы или дары, посвящённые для священного употребления. «Святыни» кратко передаёт буквальный смысл, а более разъясняющий вариант дан в сноске.
- source_word: בֶּאֱמוּנָה
  choice: добросовестно
  rationale: В административном контексте אֱמוּנָה выражает верность, надёжность и честность исполнения обязанности. «Добросовестно» естественно передаёт этот оттенок по-русски.
- source_word: וַעֲלֵיהֶם
  choice: над всем этим
  rationale: Местоименный суффикс может относиться к перечисленным поступлениям и связанному с ними хранению. «Над всем этим» сохраняет предметную отсылку и хорошо сочетается с указанием начальника.
- source_word: נָגִיד
  choice: начальником
  rationale: נָגִיד обозначает поставленного руководителя. В данном храмово-хозяйственном контексте «начальник» передаёт административную власть без царского оттенка.
- source_word: כונניהו
  choice: Конания
  rationale: Имя передано в форме, традиционной и естественной для русского библейского именословия.
- source_word: הַלֵּוִי
  choice: левит
  rationale: Определённый артикль характеризует известного служителя; в русском языке это естественно передаётся приложением без отдельного показателя определённости.
- source_word: אָחִיהוּ
  choice: его брат
  rationale: Обычное значение אָח — родной брат; контекст не требует расширять его до «родственник».
- source_word: מִשְׁנֶה
  choice: вторым после него
  rationale: מִשְׁנֶה обозначает второе по рангу лицо или заместителя. Формулировка сохраняет указание на иерархию, не уточняя сверх текста официальную должность.
