  terminology: «Десятина», «левит», «Конания» и «Шимей» уместны. «Начальником над ними» адекватно передаёт נָגִיד עֲלֵיהֶם. Для קֳדָשִׁים предпочтительно «посвящённые предметы»; вариант «священные предметы» можно дать в сноске.
