source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: ru
  text: 'Азария, главный священник из дома Садока, сказал ему: «С тех пор как в дом Яхве начали приносить священные пожертвования[a], мы едим досыта, и ещё многое остаётся, потому что Яхве благословил свой народ. А то, что осталось, — это великое изобилие».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приношение». Еврейское слово обозначает пожертвование, отделённое для священного употребления.'
    reason: Лексическая альтернатива для הַתְּרוּמָה.
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: главный священник
  rationale: Передаёт руководящее положение Азарии, не превращая выражение в более поздний специальный титул «первосвященник», которого еврейский текст здесь прямо не употребляет.
- source_word: לְבֵית צָדוֹק
  choice: из дома Садока
  rationale: Естественно передаёт принадлежность к священническому роду Садока.
- source_word: מֵהָחֵל
  choice: с тех пор как начали
  rationale: Предлог מן с инфинитивом указывает на начальную точку продолжающегося положения.
- source_word: הַתְּרוּמָה
  choice: священные пожертвования
  rationale: Термин обозначает долю или приношение, отделённое для священного употребления. Множественное число естественно в контексте регулярно приносимых запасов, а определение «священные» сохраняет культовую специфику слова.
- source_word: לָבִיא בֵית יְהוָה
  choice: приносить в дом Яхве
  rationale: Передаёт направленность действия внутрь храмового комплекса и сохраняет обычное русское управление глагола «приносить».
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: мы едим досыта
  rationale: Кратко и естественно выражает как принятие пищи, так и полное насыщение; настоящее время по-русски хорошо описывает положение, продолжающееся с указанного момента.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: и ещё многое остаётся
  rationale: Передаёт обильный излишек без неестественного буквального воспроизведения еврейской конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени сохраняет отличие тетраграмматона от титула «Господь».
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: благословил Свой народ
  rationale: Совершенный вид передаёт состоявшееся Божье действие, результатом которого стало нынешнее изобилие.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: А оставшегося — вот какое великое множество
  rationale: Сохраняет указательное «вот» и количественный смысл הָמוֹן в отношении оставшихся припасов, не переосмысливая его как толпу людей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Статус Азарии в выражении הַכֹּהֵן הָרֹאשׁ
  choice: главный священник
  alternative: первосвященник
  rationale: Выбранный вариант сохраняет буквальный смысл руководящего положения, не навязывая возможную техническую титулатуру.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён ради ясности, но причинная связь, временная точка отсчёта и указание на видимый избыток сохранены.
