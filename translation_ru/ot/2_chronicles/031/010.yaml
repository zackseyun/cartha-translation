    issue: Заключительная реплика сформулирована неграмматично и неясно.
    rationale: 'Форма «оставшегося» в выражении «А оставшегося — вот какое великое множество» не имеет названного существительного и создаёт неясный смысл. Еврейское וְהַנּוֹתָר следует передать субстантивно: «то, что осталось» / «остаток»; הֶהָמוֹן הַזֶּה в данном контексте обозначает великое изобилие оставшихся припасов, а не людей.'
  - severity: low
