  - severity: medium
    issue: Неестественная конструкция «каждого — ... как священников, так и левитов»
    rationale: Русское «как ..., так и ...» должно непосредственно координировать сопоставляемые группы; после обособленного «каждого» оно затрудняет понимание. «Каждого из них» ясно относит распределительное выражение к обеим названным группам.
