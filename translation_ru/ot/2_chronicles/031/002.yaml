revisions:
- from: 'Езекия установил череды священников и левитов по их подразделениям[a], каждого — сообразно его служению, как священников, так и левитов: для всесожжений и мирных жертв[b], для служения, благодарения и прославления у ворот станов Яхве[c].'
  to: 'Езекия распределил священников и левитов по чередам, каждого из них — согласно его служению: и священников, и левитов — для всесожжений и мирных жертв, чтобы служить, благодарить и прославлять у ворот станов Яхве[c].'
  rationale: 'Исправлена неясная русская синтаксическая структура: священники и левиты прямо названы объектом распределения, а «каждого из них» однозначно относится к обеим группам. Термин «череды» употреблён последовательно. Союзная цепочка инфинитивов передана придаточной цели «чтобы служить, благодарить и прославлять», что естественно по-русски и сохраняет три храмовые функции. Маркер сноски c сохранён у необычного выражения «станов Яхве»; сноски a и b сохранены в наборе как документированные лексические альтернативы, хотя выбранные варианты в пересмотренном тексте не нуждаются в обязательной привязке.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:44:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы все основные элементы стиха: назначение храмовых групп, распределение по служению, всесожжения, мирные жертвы, служение, благодарение, прославление и необычное множественное «станы Яхве». Однако «установил череды ... по их подразделениям» смешивает два русских обозначения одного еврейского термина в одной конструкции и звучит как административное распределение уже существующих «черед» по иным подразделениям. Кроме того, оборот «каждого — ... как священников, так и левитов» синтаксически затруднён. Безопаснее передать действие как распределение самих священников и левитов по чередам, не утрачивая смысла еврейского повторения.'
  naturalness: Текст выдержан в подходящем современном литературном, умеренно торжественном регистре, а «всесожжения», «мирные жертвы» и «станы Яхве» уместны. Тем не менее сочетание «по их подразделениям» после «череды» и конструкция с «как священников, так и левитов» заметно тяжеловесны и не вполне естественны по-русски.
  terminology: «Езекия», «левиты», «всесожжения», «мирные жертвы» и «Яхве» переданы последовательно. «Череды» — удачный термин для מחלקות; его следует сохранить и во втором употреблении. Сноска о возможном понимании «станов» как храмовых дворов корректно маркирует интерпретацию, не подменяя ею основной текст.
