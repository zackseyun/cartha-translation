  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: ru
  text: 'Езекия распределил священников и левитов по чередам, каждого из них — согласно его служению: и священников, и левитов — для всесожжений и мирных жертв, чтобы служить, благодарить и прославлять у ворот станов Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Буквально: «станов Яхве». Некоторые понимают это выражение как указание на дворы храма Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: установил
  rationale: В административно-храмовом контексте глагол означает упорядочить и поставить на назначенное служение; «установил» сохраняет официальный характер действия.
- source_word: מַחְלְקוֹת
  choice: череды / подразделения
  rationale: Слово обозначает организованные группы священников и левитов. Традиционное «череды» естественно для храмового контекста, а повтор передан словом «подразделениям», чтобы сохранить смысл без тяжёлой тавтологии.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: каждого — сообразно его служению
  rationale: Сохранены распределительное значение единственного числа и указание на конкретное назначенное храмовое служение.
- source_word: לְעֹלָה
  choice: для всесожжений
  rationale: Единственное число в еврейском обозначает категорию регулярно приносимых жертв; русский множественный передаёт это естественно.
- source_word: וְלִשְׁלָמִים
  choice: и мирных жертв
  rationale: «Мирная жертва» — прямое и устоявшееся название данной жертвенной категории; оно менее истолковательно, чем «жертва общения».
- source_word: לְשָׁרֵת וּלְהוֹדוֹת וּלְהַלֵּל
  choice: для служения, благодарения и прославления
  rationale: Цепочка однородных отглагольных существительных звучит по-русски плавно и сохраняет три различные богослужебные функции.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: у ворот станов Яхве
  rationale: Сохранены множественное число «станов» и необычный образ исходного текста; предлог «у» естественно обозначает служение при воротах.
theological_decisions:
- issue: Распределительное мужское единственное число אִישׁ
  choice: каждого — сообразно его служению
  alternative: каждого человека — сообразно его служению
  rationale: Форма «каждого» точно передаёт распределительный смысл и относится к названным священникам и левитам; добавление «человека» в современном русском было бы избыточным.
- issue: Передача שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения
  rationale: Выбран прямой термин для жертвенной категории без закрепления только за одним из возможных богословских оттенков.
- issue: Необычное выражение מַחֲנוֹת יְהוָה
  choice: станы Яхве
  alternative: дворы Яхве
  rationale: Еврейское слово стоит во множественном числе и буквально означает «станы». Замена на «дворы» сделала бы перевод более истолковательным и устранила бы необычный образ оригинала.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано распространённой русской транслитерацией, что отличает его от титула «Господь» и соответствует исходному тексту.
translation_notes:
  register: Современный литературный русский с умеренно торжественным храмовым регистром. Традиционные термины «череды», «всесожжения» и «мирные жертвы» сохранены как понятные библейские обозначения; синтаксис упрощён там, где буквальное повторение было бы тяжеловесным.
