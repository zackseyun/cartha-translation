base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: ru
  text: а также для внесения в родословные списки всех их малых детей[a], жён, сыновей и дочерей — всего собрания; ибо в своей верности[b] они освящали себя в святости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех их детей». Еврейское слово обычно указывает на малых детей, а глагол — на внесение в родовые или родословные списки.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «верность» означает, вероятнее всего, надёжность и добросовестность в исполнении священных обязанностей, а не прежде всего внутреннюю веру.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «посвящали себя в святости»; возможно также: «сохраняли себя святыми». В еврейском тексте мысль о святости выражена и глаголом, и существительным — для усиления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: а также внесённых в родословные списки
  rationale: Форма от יחס в книгах Паралипоменон обозначает внесение в родовые или родословные списки. Русская формулировка сохраняет административно-генеалогический смысл и согласуется с продолжением предыдущего стиха.
- source_word: בְּכָל טַפָּם
  choice: вместе со всеми их малыми детьми
  rationale: טַף обозначает прежде всего малых детей; слово «малыми» сохраняет эту возрастную конкретность.
- source_word: נְשֵׁיהֶם
  choice: жёнами
  rationale: В перечне членов семей контекстуально точное значение — жёны, а не женщины вообще.
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: сыновьями и дочерьми
  rationale: Сохранено явное различение сыновей и дочерей в еврейском тексте.
- source_word: לְכָל קָהָל
  choice: всем собранием
  rationale: קָהָל здесь обозначает всю общину, охваченную родословным учётом и распределением; «собрание» формально сохраняет основной образ слова.
- source_word: בֶאֱמוּנָתָם
  choice: храня верность
  rationale: В данном культово-административном контексте אֱמוּנָה выражает верность и надёжность при исполнении обязанностей, а не преимущественно внутреннюю веру. Деепричастная конструкция естественна по-русски.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: они посвящали себя святыне
  rationale: Сочетание «посвящали себя святыне» передаёт возвратное значение глагола קדש и сохраняет повтор корня святости посредством слов «посвящали» и «святыне», не устраняя необычную смысловую напряжённость оригинала.
theological_decisions:
- issue: Значение אֱמוּנָה в контексте храмового служения и учёта
  choice: верность и надёжность в исполнении священных обязанностей
  alternative: вера как внутреннее религиозное убеждение
  rationale: Контекст распределения долей среди священников, левитов и их семей указывает на добросовестность и верность в священном служении; перевод не вносит в текст более позднее догматическое противопоставление веры и дел.
- issue: Смысл усилительной конструкции יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: посвящали себя святыне
  alternative: освящали себя в святости; сохраняли себя святыми
  rationale: Еврейский текст сочетает возвратный глагол «освящаться/посвящать себя» с существительным «святость/святыня». Основной перевод сохраняет оба элемента, а примечание отмечает грамматически возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Начальная конструкция намеренно продолжает синтаксис предыдущего стиха, как и еврейский оригинал. Избегнуты архаизмы «исчисленные по родословиям» и конфессионально нагруженные толкования слова אֱמוּנָה.
