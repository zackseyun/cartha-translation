  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: ru
  text: И велел он народу — жителям Иерусалима — давать причитающуюся долю священникам и левитам, чтобы они укреплялись в Законе Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они твёрдо держались Закона Яхве»; возможно также: «чтобы они посвящали себя Закону Яхве».'
    reason: 'Лексическая неоднозначность глагола חזק с предлогом ב: выражение может означать укрепление в Законе, твёрдую приверженность ему или сосредоточенное посвящение ему.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И повелел он
  rationale: Хотя אמר обычно означает «сказать», обращение царя к народу с последующим предписанием в данном контексте имеет силу повеления. Начальное «И» передаёт повествовательную последовательность waw-consecutive.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: народу — жителям Иерусалима
  rationale: 'Вторая группа слов уточняет первую: речь идёт о той части народа, которая жила в Иерусалиме. Тире естественно передаёт это приложение по-русски.'
- source_word: לָתֵת מְנָת
  choice: отдавать положенную долю
  rationale: מְנָה обозначает назначенную долю или часть. «Положенную» кратко передаёт, что священникам и левитам причиталось установленное содержание; несовершенный вид «отдавать» подходит для общего предписания.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священникам и левитам
  rationale: Обе названные в еврейском тексте группы сохранены как отдельные категории.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз вводит цель повеления; «чтобы» естественно и точно передаёт эту связь.
- source_word: יֶחֶזְקוּ בְּתוֹרַת
  choice: могли всецело посвятить себя Закону
  rationale: חזק буквально связано с силой, укреплением или твёрдым держанием. В контексте материального обеспечения служителей выражение указывает на возможность стойко и сосредоточенно исполнять предписанное Законом; избранная формулировка передаёт контекстуальный смысл, а буквальные варианты сохранены в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Значение יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: чтобы те могли всецело посвятить себя Закону Яхве
  alternative: чтобы они укреплялись в Законе Яхве; чтобы они твёрдо держались Закона Яхве
  rationale: Материальная поддержка позволяла священникам и левитам сосредоточиться на обязанностях, установленных Законом. Однако еврейский глагол допускает также более буквальное понимание «укрепляться» или «твёрдо держаться», поэтому неоднозначность отмечена в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя в распространённой научной транслитерации без подмены его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён для ясности, но приложение «жителям Иерусалима», целевая связь и смысловая неоднозначность заключительной фразы сохранены.
