  - severity: medium
    issue: «Всёцело посвятить себя» добавляет степень и выбирает узкую интерпретацию יחזקו בתורת יהוה.
    rationale: «Всёцело» отсутствует в оригинале, а «посвятить себя» передаёт лишь одну контекстуальную интерпретацию. Основной текст может сохранить буквальное «укрепляться в Законе», а иной смысл — в примечании.
