source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: ru
  text: 'Доля царя из его имущества предназначалась на всесожжения: на утренние и вечерние всесожжения, а также на всесожжения по субботам, в новомесячия и в установленные праздники, как написано в Законе Яхве[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: e
    text: 'Буквально: «в Торе Яхве»; возможно также: «в наставлении Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: Царь выделил… долю
  rationale: מְנָה обозначает назначенную или выделенную долю. Глагольная конструкция естественна для современного русского языка и в данном контексте ясно передаёт распоряжение царя, не меняя смысла еврейской именной конструкции.
- source_word: מִן רְכוּשׁוֹ
  choice: из своего имущества
  rationale: רְכוּשׁ — имущество, собственность, материальные владения. Возвратное местоимение ясно показывает, что средства поступали из личного имущества царя.
- source_word: לָעֹלוֹת
  choice: на всесожжения
  rationale: עֹלָה — жертва, целиком сжигаемая на жертвеннике. Традиционный и точный русский термин «всесожжение» уместен в храмовом контексте; предлог «на» передаёт назначение выделенной доли.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: на утренние и вечерние всесожжения
  rationale: Передаёт оба ежедневных приношения естественным русским порядком слов, сохраняя явное упоминание всесожжений.
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: а также на всесожжения по субботам, в новомесячия и в установленные праздники
  rationale: שַׁבָּתוֹת означает субботы; חֳדָשִׁים в богослужебном календаре — празднования начала месяца; מוֹעֲדִים — установленные времена или праздники. Формулировка сохраняет календарную последовательность и культовый смысл.
- source_word: כַּכָּתוּב
  choice: как написано
  rationale: Устойчивая формула ссылки на письменное предписание, естественная и точная по-русски.
- source_word: בְּתוֹרַת יְהוָה
  choice: в Законе Яхве
  rationale: В данном контексте תּוֹרָה обозначает записанное священное наставление, регулирующее жертвоприношения; «Закон» понятно современному читателю. Имя יהוה передано как «Яхве», то есть как личное заветное имя, а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя יהוה. «Яхве» сохраняет различие между личным именем Бога и титулом «Господь» и соответствует наиболее принятой научной передаче произношения.
- issue: Значение תּוֹרָה в выражении בְּתוֹרַת יְהוָה
  choice: Закон Яхве
  alternative: Тора Яхве; наставление Яхве
  rationale: Ссылка относится к записанным предписаниям о календарных жертвах. «Закон» точно передаёт функцию текста, тогда как примечание сохраняет более буквальную возможность «Тора» или более широкое «наставление».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Глагольное начало устраняет тяжеловесность буквальной именной конструкции. Термины «всесожжение», «новомесячие» и «Закон» сохранены как понятные и укоренённые обозначения реалий храмового богослужения.
