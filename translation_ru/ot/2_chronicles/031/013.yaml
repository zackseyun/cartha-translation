base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: ru
  text: Иехиил, Азазия, Нахат, Асаил, Иеримоф, Иозавад, Елиил, Исмахия, Махат и Беная были должностными лицами под руководством[a] Хонании и его брата Шимея, по распоряжению[b] царя Езекии и Азарии, начальника дома Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки Хонании и его брата Шимея»; то есть под их руководством или надзором.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по назначению»; возможно также: «по поручению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: назначенные служители
  rationale: Слово обозначает поставленных лиц с административной ответственностью. Этот вариант естественен по-русски и не приписывает им более высокого ранга, чем следует из контекста.
- source_word: מִיַּד
  choice: под началом
  rationale: Буквально «из-под руки / рукой»; здесь идиома выражает подчинение и руководство. «Под началом» ясно передаёт административную зависимость.
- source_word: אָחִיו
  choice: его брата
  rationale: Прямое указание на родственную связь Шимея с Хонанией сохранено без обобщения.
- source_word: בְּמִפְקַד
  choice: по распоряжению
  rationale: Существительное допускает значения поручения, повеления, назначения или надзора. «По распоряжению» естественно передаёт официальную санкцию, не устраняя полностью смысловую широту, отмеченную в сноске.
- source_word: נְגִיד
  choice: управляющего
  rationale: В данном административном контексте слово обозначает руководителя или главного должностного лица. «Управляющий» не создаёт неуместной ассоциации с княжеским титулом.
- source_word: בֵּית הָאֱלֹהִים
  choice: домом Божьим
  rationale: Сохранён буквальный и традиционно понятный образ «дома Божьего», обозначающий храм.
- source_word: יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ
  choice: Иехиил, Азазия, Нахат, Асаил, Иеримоф, Иозавад, Елиил, Исмахия, Махат, Ванея, Хонания, Шимей, Езекия, Азария
  rationale: Использованы узнаваемые русские библейские формы имён с ориентацией на еврейский текст.
theological_decisions:
- issue: Характер храмовых административных должностей
  choice: Передать термины как обычные обозначения административного служения и руководства.
  alternative: 'Использовать более высокие титулы: «начальники», «правители» или «князь».'
  rationale: Стих описывает распределение административной ответственности. Более высокие титулы могли бы привнести не заявленную текстом иерархию.
- issue: Смысл בְּמִפְקַד
  choice: «по распоряжению» с указанием альтернатив в сноске
  alternative: «по назначению» или «под надзором»
  rationale: Еврейское выражение допускает несколько близких административных смыслов; основной текст должен читаться естественно, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Перечень имён сохранён без стилистического усложнения; административные термины переданы нейтрально, без архаических или конфессионально окрашенных титулов.
