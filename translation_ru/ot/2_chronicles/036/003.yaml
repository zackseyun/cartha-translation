  text: וַ/יְסִירֵ֥/הוּ מֶֽלֶךְ מִצְרַ֖יִם בִּֽ/ירוּשָׁלִָ֑ם וַֽ/יַּעֲנֹשׁ֙ אֶת הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: ru
  text: Царь Египта отстранил его от власти[a] в Иерусалиме и наложил на страну денежное взыскание[b] — сто талантов серебра и один талант золота[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать как отстранение от должности, так и физическое удаление человека.
    reason: alternative_reading
  - marker: b
    text: 'Или: «оштрафовал страну»; глагол указывает на наложение денежной пени или наказания.'
    reason: lexical_alternative
  - marker: c
    text: Талант — древняя крупная мера веса; здесь она сохранена без пересчёта в современные единицы.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: отстранил его от власти
  rationale: Каузативная форма от סוּר означает «удалить, устранить». В царском контексте естественное русское выражение «отстранил от власти» передаёт низложение царя, тогда как более буквальное «удалил его» может также подразумевать физическое перемещение; эта неоднозначность отмечена в сноске.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: царь Египта
  rationale: Прямо передаёт еврейское сопряжённое сочетание, не добавляя имени фараона, которого в данном стихе нет.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Предлог ב здесь естественно понимать как указание места.
- source_word: וַיַּעֲנֹשׁ
  choice: наложил ... денежное взыскание
  rationale: Глагол ענשׁ обозначает назначение наказания или денежной пени. «Денежное взыскание» ясно передаёт карательно-финансовый оттенок и не превращает его без необходимости в обычную дань.
- source_word: הָאָרֶץ
  choice: страну
  rationale: Здесь אָרֶץ относится к территории и населению Иудейского царства; в современном русском историческом повествовании «страна» звучит естественнее, чем «земля».
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: сто талантов серебра
  rationale: Сохранена древняя единица веса כִּכָּר без приблизительного пересчёта, который создал бы ложную точность.
- source_word: וְכִכַּר זָהָב
  choice: и один талант золота
  rationale: Явно передано единственное число меры веса, параллельной предыдущему выражению.
theological_decisions:
- issue: Характер устранения царя
  choice: отстранил его от власти
  alternative: удалил (увёл) его
  rationale: Контекст царской власти поддерживает значение низложения, но сам глагол способен обозначать и физическое удаление; альтернативный смысл сохранён в сноске, а не исключён догматически.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Формулировка краткая и ясная; древняя мера сохранена, а подлинная смысловая широта ключевых глаголов отражена в сносках.
