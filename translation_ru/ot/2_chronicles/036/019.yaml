  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: ru
  text: Они сожгли дом Божий[a], разрушили стену Иерусалима, предали огню все его дворцы и уничтожили все его драгоценные предметы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм Божий». Буквально по-древнееврейски: «дом Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все его драгоценные сосуды»; также возможно: «все его ценные вещи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: Они сожгли
  rationale: Форма Qal wayyiqtol от שׂרף обозначает последовательное повествовательное действие — «сожгли»; местоимение «они» передаёт лицо и число глагола.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Сохраняет буквальный древнееврейский образ «дом Бога»; в контексте речь идёт о храме.
- source_word: וַיְנַתְּצוּ אֵת חוֹמַת יְרוּשָׁלִָם
  choice: разрушили стену Иерусалима
  rationale: נתץ означает разрушать или сносить сооружение; единственное число «стену» соответствует древнееврейскому тексту.
- source_word: אַרְמְנוֹתֶיהָ
  choice: все его дворцы
  rationale: אַרְמוֹן может обозначать дворец, цитадель или укреплённое здание; «дворцы» — естественное и достаточно точное соответствие в описании города. Местоимение относится к Иерусалиму.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: предали огню
  rationale: Передаёт явно названный огонь и избегает тяжеловесного русского оборота «сожгли огнём», сохраняя повтор мотива сожжения.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: все его драгоценные предметы
  rationale: כְּלִי — широкое обозначение предметов, сосудов или принадлежностей, а מַחֲמַד — желанное, ценное, драгоценное. «Предметы» не сужает значение до храмовых сосудов.
- source_word: לְהַשְׁחִית
  choice: уничтожили
  rationale: Инфинитив выражает цель или результат разрушительных действий; в естественном русском повествовании передан однородным личным глаголом.
