id: 2CH.36.14
reference: 2 Chronicles 36:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: ru
  text: Также все предводители священников и народа умножали свою неверность, следуя всем мерзостным обычаям народов[a], и осквернили дом Яхве[b], который Он освятил в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобно всем мерзостям народов».'
    reason: Сочетание כְּכֹל может выражать как следование образцу, так и сравнение; תֹּעֲבוֹת буквально означает «мерзости».
  - marker: b
    text: «Яхве» передаёт еврейское имя יהוה (YHWH); традиционно его заменяют словом «Господь».
    reason: Поясняет передачу Божественного имени и традиционный вариант чтения.
lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Передаёт продолжение и усиление мысли в связи с предыдущим контекстом.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: все предводители священников и народ
  rationale: שָׂרֵי обозначает руководителей или начальников священников; формулировка сохраняет еврейскую синтаксическую структуру и не смешивает её с позднейшим термином «первосвященники».
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: умножали свою неверность
  rationale: Сочетание глагола со сродным существительным усиливает значение многократного и всё более тяжкого нарушения верности; по-русски эта конструкция звучит торжественно, но понятно.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: следуя всем мерзостным обычаям других народов
  rationale: כְּכֹל выражает соответствие или уподобление, а תֹּעֲבוֹת здесь обозначает религиозно и нравственно отвратительные обычаи. «Других народов» естественно передаёт контекстуальное противопоставление Израилю.
- source_word: וַיְטַמְּאוּ
  choice: и осквернили
  rationale: В храмовом контексте глагол означает ритуальное и нравственное осквернение.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется буквальный библейский образ «дома», а личное имя יהוה передаётся транслитерацией «Яхве».
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: который Он освятил в Иерусалиме
  rationale: Относительное предложение относится к дому; «освятил» ясно выражает отделение храма как святыни.
theological_decisions:
- issue: Значение covenantal/cultic מָעַל
  choice: неверность
  alternative: вероломство; преступление
  rationale: «Неверность» сохраняет идею нарушения преданности Богу и не сужает смысл до юридического проступка; храмовый оттенок поддерживается дальнейшим упоминанием осквернения.
- issue: Передача יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Связь כְּכֹל с последующей фразой
  choice: следуя всем мерзостным обычаям других народов
  alternative: подобно всем мерзостям других народов
  rationale: Предлог допускает оттенки соответствия и сравнения. Основной текст выражает подражание обычаям, а примечание сохраняет более буквальную сравнительную возможность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Предводители» отличает руководителей священства от самих священников как совокупности; «умножали свою неверность» намеренно сохраняет интенсивность еврейского сочетания; местоимение «Он» прописано с заглавной буквы по принятой русской религиозной норме.
