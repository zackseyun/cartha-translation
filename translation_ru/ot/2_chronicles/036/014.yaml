    rationale: 'Русская форма «народ» стоит в именительном падеже и читается как второй субъект наряду с предводителями. В еврейском הָעָם — второй член зависимой группы при שָׂרֵי: предводители священников и народа.'
  - severity: low
    issue: Примечание a неточно оформляет сравнительный вариант.
    rationale: 'Вариант «поступая подобно другим народам во всех их мерзостях» смещает сравнение с «мерзостей народов» на сами народы. Более прямой вариант сохраняет неоднозначность כְּכֹל: «подобно всем мерзостям народов».'
  revised_text: Также все предводители священников и народа умножали свою неверность, следуя всем мерзостным обычаям народов[a], и осквернили дом Яхве[b], который Он освятил в Иерусалиме.
