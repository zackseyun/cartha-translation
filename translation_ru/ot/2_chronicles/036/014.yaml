revisions:
- from: Также все предводители священников и народ умножали свою неверность, следуя всем мерзостным обычаям других народов[a], и осквернили дом Яхве[b], который Он освятил в Иерусалиме.
  to: Также все предводители священников и народа умножали свою неверность, следуя всем мерзостным обычаям народов[a], и осквернили дом Яхве[b], который Он освятил в Иерусалиме.
  rationale: Исправлено падежное оформление «народа», чтобы сохранить структуру исходной группы «предводители священников и народа». Примечание a уточнено, чтобы альтернативное чтение непосредственно соответствовало сравнительной возможности כְּכֹל. Остальные решения сохранены как точные и естественные.
