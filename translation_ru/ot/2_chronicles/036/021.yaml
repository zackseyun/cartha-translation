- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: בְּפִי יִרְמְיָהוּ
  choice: сказанное устами Иеремии
  rationale: Сохраняется образ еврейского выражения «устами Иеремии», а добавление «сказанное» делает русскую синтаксическую связь ясной.
- source_word: עַד רָצְתָה הָאָרֶץ אֶת שַׁבְּתוֹתֶיהָ
  choice: пока земля не насладилась своими субботами
  rationale: רצה в данном контексте описывает получение землёй положенного ей субботнего покоя. «Насладилась» сохраняет выразительность и перекличку с Лев 26:34–35, не сводя смысл к простому отдыху.
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: во все дни своего запустения
  rationale: Передаёт весь период, когда земля оставалась опустошённой; притяжательное местоимение ясно указывает на землю.
- source_word: שָׁבָתָה
  choice: покоилась в субботнем покое
  rationale: Формулировка сохраняет связь глагола שבת с существительным «субботы» и одновременно звучит понятнее по-русски, чем буквальное «соблюдала субботу» применительно к земле.
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: пока не исполнилось семьдесят лет
  rationale: Вторая форма לְמַלֹּאות передаёт достижение полноты указанного срока. Русская конструкция естественна и сохраняет повтор глагола «исполниться» из начала стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет это, не подменяя имя титулом.
- issue: Субботняя образность в שַׁבְּתוֹתֶיהָ / שָׁבָתָה
  choice: своими субботами… покоилась в субботнем покое
  alternative: своим покоем… отдыхала
  rationale: Сохраняется намеренная словесная связь и богословская перекличка с предостережением о покое земли во время изгнания, без чрезмерно буквального и неестественного выражения.
- issue: Отношение последней фразы к семидесяти годам
  choice: пока не исполнилось семьдесят лет
  alternative: чтобы исполнилось семьдесят лет
  rationale: Конструкция может выражать цель, результат или завершение срока. «Пока не исполнилось» естественно показывает временной предел, не уточняя сверх текста, каким именно образом исчислялись эти годы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Образ «устами Иеремии» и субботняя игра слов по возможности сохранены; синтаксис адаптирован для естественного русского чтения.
