  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: ru
  text: чтобы исполнилось слово Яхве, сказанное устами Иеремии[a], — пока земля не получила возмещения за свои субботы. Во все дни своего запустения она соблюдала субботний покой[b][c], чтобы исполнились семьдесят лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами Иеремии»; возможно также: «через Иеремию».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «она покоилась»; буквально употреблён глагол, связанный со словом «субботы». Выражение подчёркивает, что земля получила прежде не предоставленный ей субботний отдых.'
    reason: lexical_alternative
  - marker: c
    text: Эти слова перекликаются с предупреждением завета о том, что во время изгнания земля получит возмещение за свои субботы (см. Лев 26:34–35).
    reason: cross_reference
lexical_decisions:
- source_word: לְמַלֹּאות דְּבַר יְהוָה
  choice: чтобы исполнилось слово Яхве
