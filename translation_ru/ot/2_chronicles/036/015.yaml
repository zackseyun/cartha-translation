source:
  edition: WLC
  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: ru
  text: И Господь[a], Бог их отцов, снова и снова посылал к ним весть через Своих посланников[b], потому что Ему было жаль Своего народа и Своей обители[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Яхве — личное имя Бога.
    reason: Передача и пояснение божественного имени.
  - marker: b
    text: Букв. «через Своих посланников, вставая рано и посылая» — еврейское выражение настойчивого и многократного действия.
    reason: Сохранение исходной идиомы и образности, смысл которых передан словами «снова и снова».
  - marker: c
    text: То есть храм в Иерусалиме как место Божьего пребывания среди Его народа.
    reason: Пояснение культурно-богословского референта слова «обитель».
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и естественная для русского библейского текста передача тетраграмматона; сноска сохраняет сведения о личном имени.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бог их отцов
  rationale: Формально близкая и ясная передача, сохраняющая историческую и заветную связь с предками.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: посылал к ним весть
  rationale: Прямое дополнение в еврейском тексте не выражено, но контекст посланников подразумевает передаваемую весть; по-русски такая формулировка звучит естественно.
- source_word: בְּיַד מַלְאָכָיו
  choice: через Своих посланников
  rationale: Еврейское «рукой» обозначает посредство или действие через кого-либо. Буквальное «рукой Своих посланников» в современном русском здесь неестественно.
- source_word: מַלְאָכָיו
  choice: посланников
  rationale: В контексте имеются в виду люди, несущие Божью весть, прежде всего пророки; слово «ангелы» неоправданно сузило бы смысл до небесных существ.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: снова и снова посылал
  rationale: Еврейская идиома, буквально связанная с ранним вставанием и посыланием, выражает настойчивое, многократное действие. Смысл передан в основном тексте, а образ сохранён в сноске.
- source_word: כִּי חָמַל
  choice: потому что жалел
  rationale: Глагол выражает сострадание или жалость, побуждающую пощадить. «Жалел» естественно сочетается и с народом, и с обителью, не сводя значение только к эмоциональному сочувствию.
- source_word: עַל עַמּוֹ
  choice: Свой народ
  rationale: При русском глаголе «жалеть» предлог не требуется; винительный падеж естественно передаёт еврейскую конструкцию.
- source_word: מְעוֹנוֹ
  choice: Свою обитель
  rationale: Сохраняет значение места пребывания Бога и возвышенный регистр, не заменяя его толкованием «храм» непосредственно в тексте.
theological_decisions:
- issue: Кто такие «Его посланники»
  choice: люди — Божьи вестники, прежде всего пророки
  alternative: небесные ангелы
  rationale: Ближайший контекст говорит о предупреждениях, которые Бог направлял народу перед судом; нейтральное «посланники» сохраняет лексическое значение и не вводит ангелологического уточнения.
- issue: Характер Божьего отношения к народу и обители
  choice: сохранить выражение о том, что Бог жалел Свой народ и Свою обитель
  alternative: передать как намерение пощадить народ и храм
  rationale: Глагол חמל включает сострадание и побуждение пощадить. Передача «жалел» сохраняет мотив Божьего действия и не устраняет напряжение между состраданием и последующим судом.
- issue: Референт «обители»
  choice: оставить «обитель» в основном тексте и пояснить храм в сноске
  alternative: сразу перевести «храм»
  rationale: Еврейское слово обозначает жилище или место пребывания; буквальный образ важен для темы Божьего присутствия, тогда как конкретный исторический референт можно пояснить.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис упрощён для ясности, а еврейская идиома передана по смыслу; её буквальная форма вынесена в сноску. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской издательской практикой.
