  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: ru
  text: Тогда народ страны[a] взял Иоахаза, сына Иосии, и поставил его царём в Иерусалиме вместо его отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «население страны», возможно, «простонародье». Еврейское выражение «народ земли» может обозначать всё население страны, а в некоторых контекстах — определённую общественную группу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взял
  rationale: Глагол לקח здесь означает, что народ взял или избрал Иоахаза для последующего возведения на престол. Перевод «взял» сохраняет образ исходного текста и не привносит подразумеваемого насилия, как могло бы слово «схватил».
- source_word: עַם הָאָרֶץ
  choice: народ этой земли
  rationale: Так передаётся устойчивое еврейское выражение без преждевременного сужения его значения до простонародья или определённого сословия. Указательное слово «этой» делает выражение естественнее по-русски и соотносит его с землёй Иудеи в данном контексте.
- source_word: יְהוֹאָחָז
  choice: Иоахаз
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: сына Иосии
  rationale: Прямой и естественный по-русски способ передать родственную связь; имя дано в устоявшейся русской библейской форме.
- source_word: וַיַּמְלִיכֻהוּ
  choice: поставил его царём
  rationale: Каузативная форма глагола מלך означает сделать кого-либо царём, то есть возвести на царство. «Поставил царём» ясно передаёт этот смысл и не добавляет не упомянутого в тексте обряда коронации.
- source_word: תַחַת אָבִיו
  choice: вместо его отца
  rationale: Предлог תַּחַת обозначает здесь замещение и престолонаследие, а не пространственное положение или подчинение.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог בְּ при названии места естественно передаётся русским «в»; Иерусалим — устоявшаяся русская форма названия.
