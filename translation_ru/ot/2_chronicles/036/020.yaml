  text: וַ/יֶּ֛גֶל הַ/שְּׁאֵרִ֥ית מִן הַ/חֶ֖רֶב אֶל בָּבֶ֑ל וַֽ/יִּהְיוּ ל֤/וֹ וּ/לְ/בָנָי/ו֙ לַ/עֲבָדִ֔ים עַד מְלֹ֖ךְ מַלְכ֥וּת פָּרָֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: ru
  text: А уцелевших от меча он увёл в изгнание, в Вавилон, и они стали рабами[a] его и его сыновей — до начала правления Персидского царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: увёл в плен
  rationale: Каузативная форма глагола גלה означает принудительное переселение в изгнание; русское «увёл в плен» естественно передаёт и депортацию, и подневольное положение.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: уцелевших от меча
  rationale: הַשְּׁאֵרִית — оставшаяся часть, а сочетание מִן הַחֶרֶב указывает на тех, кто пережил истребление мечом. Субстантивированное «уцелевших» ясно и естественно по-русски.
- source_word: אֶל־בָּבֶל
  choice: в Вавилон
  rationale: Направительное אֶל естественно передаётся русским «в» с винительным падежом.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: они стали рабами его и его сыновей
  rationale: עֲבָדִים допускает значения «слуги» и «рабы», но контекст завоевания, насильственного переселения и подчинения царской династии подчёркивает несвободный статус; «рабы» точнее передаёт эту сторону значения.
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: до воцарения Персидского царства
  rationale: Инфинитив מְלֹךְ обозначает наступление правления; «до воцарения» передаёт начальную временную границу. מַלְכוּת פָּרָס понимается как Персидское царство, то есть персидская имперская власть.
theological_decisions:
- issue: Статус насильственно переселённых иудеев при вавилонском царе
  choice: рабы
  alternative: слуги
  rationale: Еврейское עבד охватывает оба значения. Здесь военный разгром, депортация и подчинение победителю делают «рабы» контекстуально предпочтительным, без утверждения более узкой правовой категории рабства, которой сам текст не уточняет.
- issue: Временная граница в выражении עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: до воцарения Персидского царства
  alternative: до времени правления Персидского царства
  rationale: Форма מְלֹךְ может описывать наступление или осуществление царствования. В контексте итоговой границы вавилонского господства русский вариант с «воцарением» наиболее ясно передаёт начало персидской власти, не называя конкретного царя.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Инверсия «рабами его и его сыновей» сохраняет достоинство исторического повествования, оставаясь понятной. Союз «А» связывает стих с предшествующим описанием гибели остальных; тире подчёркивает временный предел подчинения.
