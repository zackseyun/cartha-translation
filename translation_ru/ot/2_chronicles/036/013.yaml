base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: ru
  text: Он восстал и против царя Навуходоносора, который заставил его поклясться Богом[a]. Он проявил упрямство[b] и ожесточил своё сердце, не желая обратиться к Яхве, Богу Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «который связал его клятвой перед Богом». Древнееврейское выражение может означать либо то, что Навуходоносор заставил его поклясться Богом, либо то, что он связал его торжественной клятвой перед Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделал свою шею жёсткой» — образ упрямого сопротивления и непокорности.'
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: и
  rationale: Сохраняет присоединительное значение и естественно связывает стих с предыдущим повествованием.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: восстал ... против царя Навуходоносора
  rationale: Глагол מָרַד с предлогом ב обозначает политический мятеж или неповиновение правителю; «восстал против» естественно передаёт это по-русски.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵאלֹהִים
  choice: который заставил его поклясться Богом
  rationale: Порода хифиль глагола שׁבע означает понуждение к клятве; בֵאלֹהִים допускает понимание Бога как Того, Кем клянутся, при сохранении альтернативного оттенка торжественного обязательства перед Богом в сноске.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: Он проявил упрямство
  rationale: Буквально «сделал свою шею жёсткой» — древнееврейская метафора упорного сопротивления. Смысл передан ясно, а образ сохранён в сноске.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: ожесточил своё сердце
  rationale: Хотя אמץ буквально связано с укреплением, в контексте отказа обратиться оно выражает сознательную внутреннюю непреклонность; традиционный русский оборот сохраняет образ сердца.
- source_word: מִשּׁוּב אֶל
  choice: не желая обратиться к
  rationale: Конструкция מן с инфинитивом здесь выражает удержание или отказ от действия. Русская формулировка передаёт препятствующий смысл без неестественного буквального оборота.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, представленное тетраграмматоном, без замены титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Естественная передача древнееврейской сопряжённой конструкции, сохраняющая идентификацию Яхве как Бога Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» наиболее прямо и общепринято в современной научной передаче отражает тетраграмматон.
- issue: Характер отказа от обращения
  choice: не желая обратиться
  alternative: так что не обратился; удерживая себя от обращения
  rationale: Фраза связывает ожесточение сердца с отказом обратиться к Богу, но не требует догматического вывода о природе воли или покаяния.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Политический смысл мятежа сохранён; не вполне естественная для современного русского метафора жёсткой шеи раскрыта в сноске. Указательные местоимения и синтаксис подобраны так, чтобы субъектом относительного предложения однозначно оставался Навуходоносор.
