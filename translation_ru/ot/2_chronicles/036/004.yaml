  text: וַ/יַּמְלֵ֨ךְ מֶֽלֶךְ מִצְרַ֜יִם אֶת אֶלְיָקִ֣ים אָחִ֗י/ו עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יוֹאָחָ֤ז אָחִי/ו֙ לָקַ֣ח נְכ֔וֹ וַ/יְבִיאֵ֖/הוּ מִצְרָֽיְמָ/ה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: ru
  text: Царь Египта поставил Елиакима, его брата[a], царём над Иудеей и Иерусалимом и изменил его имя на Иоакима. Иоахаза же, брата Иоакима, Нехо[b] взял и увёл в Египет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть брата Иоахаза.
    reason: В еврейском тексте стоит местоимение «его»; его отсылка определяется предшествующим контекстом.
  - marker: b
    text: Египетский царь Нехо.
    reason: В начале стиха правитель назван по титулу, а здесь — по имени.
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: поставил … царём
  rationale: Каузативная порода глагола מלך указывает, что египетский царь возвёл Елиакима на престол; выражение естественно для современного русского языка.
- source_word: אֶלְיָקִים אָחִיו
  choice: Елиакима, его брата
  rationale: Сохранена местоименная форма еврейского текста и связь Елиакима с Иоахазом из ближайшего контекста; возможная неясность отсылки отмечена сноской.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: над Иудеей и Иерусалимом
  rationale: Предлог עַל при поставлении царя обозначает область его власти; сохранены и царство, и столица.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים
  choice: изменил его имя на Иоакима
  rationale: Передаёт навязанное переименование без добавления мотивов или толкований.
- source_word: וְאֶת יוֹאָחָז אָחִיו לָקַח נְכוֹ
  choice: Иоахаза же, брата Иоакима, Нехо взял
  rationale: Начальная позиция Иоахаза и частица «же» передают смену темы и сопоставление судеб братьев. Повтор имени Иоакима по-русски устраняет искусственную местоименную двусмысленность; в контексте именно Иоахаз является братом только что переименованного Елиакима.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: и увёл в Египет
  rationale: Направительная форма обозначает движение в Египет; «увёл» естественно выражает перемещение Иоахаза Нехо, не усиливая глагол до «схватил» или «пленил».
- source_word: נְכוֹ
  choice: Нехо
  rationale: Прямая и устоявшаяся в русской библейской традиции передача еврейского личного имени.
