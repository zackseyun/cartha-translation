  source_fidelity: 'Русский текст точно передаёт каузативное значение וַיַּמְלֵךְ («поставил ... царём»), область правления («над Иудеей и Иерусалимом»), переименование Елиакима и последующее перемещение Иоахаза в Египет. «Увёл в Египет» естественно передаёт направленное действие וַיְבִיאֵהוּ מִצְרָיְמָה в данном контексте и не добавляет конкретного способа принуждения. Во второй части явное «брата Иоакима» корректно раскрывает отсылку еврейского местоимения: Иоаким — новое имя Елиакима.'
