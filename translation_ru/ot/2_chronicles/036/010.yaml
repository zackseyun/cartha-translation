base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: ru
  text: По прошествии года[a] царь Навуходоносор послал за ним и велел доставить его в Вавилон вместе с драгоценными сосудами дома Яхве[b] и поставил Седекию, его брата[c], царём над Иудеей и Иерусалимом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при возвращении года», то есть когда годовой круг совершился.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вместе с ценными предметами дома Яхве».'
    reason: lexical_alternative
  - marker: c
    text: 'В древнееврейском тексте: «его брат». Здесь это слово обозначает близкого родственника; Седекия был дядей Иехонии.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: На рубеже года
  rationale: Передаёт образ возвращения, или поворота, года естественным русским выражением, не конкретизируя время как весну, чего сама формулировка не требует.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: послал за ним и велел доставить его
  rationale: В данном контексте царь действует через посланных им людей. Такая формулировка естественно передаёт последовательность и каузативный смысл формы глагола בוא.
- source_word: בָבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс обозначает движение к Вавилону; по-русски это естественно выражается предлогом «в».
- source_word: כְּלֵי חֶמְדַּת
  choice: драгоценными сосудами
  rationale: Сохраняет значение ценных, желанных предметов и уместное для храмовой утвари слово «сосуды».
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт личное имя יהוה как «Яхве».
- source_word: וַיַּמְלֵךְ
  choice: поставил царём
  rationale: 'Естественно передаёт каузативное значение: сделал так, чтобы Седекия царствовал.'
- source_word: אָחִיו
  choice: его брата
  rationale: Формально сохраняет широкое древнееврейское обозначение родства, не устраняя возникающее генеалогическое напряжение; уточнение вынесено в примечание.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: над Иудеей и Иерусалимом
  rationale: Предлог עַל обозначает область царского правления.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Родство Седекии с Иехонией
  choice: его брата
  alternative: его родственника / его дядю
  rationale: Основной текст сохраняет אָחִיו — «его брат», употреблённое здесь в широком родственном смысле; историко-генеалогическое уточнение дано в сноске, а не подменяет исходную формулировку.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Синтаксис разделён на два предложения для естественного чтения; сохранены образ «рубежа года», храмовый термин «сосуды» и формальная неоднозначность родственного обозначения.
