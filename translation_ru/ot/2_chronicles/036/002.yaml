lexical_decisions:
- source_word: בֶּן שָׁלֹושׁ וְעֶשְׂרִים שָׁנָה
  choice: было двадцать три года
  rationale: Стандартный еврейский оборот для обозначения возраста естественно передаётся по-русски конструкцией «было двадцать три года».
- source_word: יוֹאָחָז
  choice: Иоахаз
  rationale: Передача имени соответствует принятой русской библейской традиции и еврейской форме.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Оборот указывает на возраст при вступлении на престол; эта формулировка ясна и естественна в современном русском языке.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: три месяца
  rationale: Прямое соответствие числительного и существительного; союз передан связью однородных частей предложения.
- source_word: מָלַךְ
  choice: царствовал
  rationale: В формуле сведений о царе глагол означает осуществление царской власти; «царствовал» — точный и традиционный русский эквивалент.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог בְּ обозначает место; выбрана прямая и естественная русская передача.
