base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: ru
  text: Иоакиму было двадцать пять лет, когда он стал царём, и он царствовал в Иерусалиме одиннадцать лет. Он делал зло в глазах Яхве, его Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: был двадцати пяти лет
  rationale: Стандартный древнееврейский оборот для указания возраста передан естественной и литературной русской формой.
- source_word: יְהוֹיָקִים
  choice: Иоаким
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בְּמָלְכוֹ
  choice: когда стал царём
  rationale: Предлог ב при инфинитивной форме обозначает время вступления на престол; перевод естественно передаёт значение оборота.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: и царствовал ... одиннадцать лет
  rationale: Глагол מָלַךְ означает «царствовать, быть царём»; выбран обычный русский термин для царской формулы.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Передаёт устойчивую оценочную формулу буквально по смыслу и естественно по-русски.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён прозрачный древнееврейский образ, выражающий оценку с точки зрения названного лица.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Возвратное местоимение естественно по-русски соотносит Бога с подлежащим Иоакимом и точно передаёт суффикс третьего лица мужского рода.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства летописной царской формулы. Устоявшееся имя «Иоаким» предпочтено прямой транслитерации; архаизмы и конфессионально окрашенные добавления исключены.
