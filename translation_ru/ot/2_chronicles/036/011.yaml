  text: Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.
translation:
  language: ru
  text: Седекии был двадцать один год, когда он стал царём, и он царствовал в Иерусалиме одиннадцать лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: был двадцать один год
  rationale: Еврейская возрастная формула передана естественным для современного русского языка способом, без буквального «сын двадцати одного года».
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Использована устоявшаяся русская библейская форма личного имени; в контексте дательный падеж — «Седекии».
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция с בְּ указывает на время вступления на престол; такой перевод ясно и естественно передаёт временное значение.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: одиннадцать лет
  rationale: Прямое обозначение продолжительности царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти; «царствовал» — точный и традиционный, но понятный современному читателю эквивалент.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог передаёт местное значение, а топоним дан в устоявшейся русской форме.
