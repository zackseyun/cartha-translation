base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: ru
  text: Иехонии было восемь лет, когда он воцарился[a], и он царствовал в Иерусалиме три месяца и десять дней. Он делал зло в глазах Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В 4 Царств 24:8 сказано: «восемнадцать лет», а не «восемь лет».'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: было восемь лет
  rationale: Естественная русская передача древнееврейского возрастного оборота, буквально означающего «сын восьми лет».
- source_word: יְהוֹיָכִין
  choice: Иехония
  rationale: Устоявшаяся в русской библейской традиции форма имени царя.
- source_word: בְּמָלְכוֹ
  choice: когда он воцарился
  rationale: Передаёт временное значение конструкции и момент вступления на царство, сохраняя краткость формулы.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: три месяца и десять дней
  rationale: Прямая и естественная передача продолжительности царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Стандартный русский эквивалент глагола מלך в царских хронологических формулах.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Прямая передача местного значения предлога.
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Кратко и близко передаёт устойчивую древнееврейскую формулу нравственной оценки.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет телесную метафору исходного выражения и обозначает Божью оценку поступков.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не его замена титулом.
theological_decisions:
- issue: Хронологическое расхождение с 4 Царств 24:8, где возраст Иехонии при воцарении указан как восемнадцать лет
  choice: Сохранить в основном тексте чтение масоретского текста «восемь лет»
  alternative: «восемнадцать лет»
  rationale: Предоставленный древнееврейский источник ясно содержит «восемь». Расхождение с параллельным местом не следует устранять гармонизацией; альтернативное свидетельство отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «воцарился» уместна для краткого сообщения о вступлении на престол; «в глазах Яхве» намеренно сохраняет метафору оригинала.
