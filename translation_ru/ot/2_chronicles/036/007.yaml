base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: ru
  text: Также Навуходоносор принёс в Вавилон часть сосудов из дома Яхве и поместил их в своём храме[a] в Вавилоне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во дворце» — еврейское слово может означать как храм, так и дворец, в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/כְּלֵי
  choice: Также часть сосудов
  rationale: 'Предлог מִן имеет здесь партитивное значение: Навуходоносор унёс не все, а часть сосудов; союз וּ связывает это сообщение с предыдущим повествованием.'
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Буквальное выражение «дом Яхве» сохраняет образ еврейского текста и ясно обозначает храм в данном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: הֵבִיא
  choice: принёс
  rationale: Порода хифиль глагола בוא означает «принести, доставить»; форма мужского рода соответствует названному далее Навуходоносору.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Использована устоявшаяся русская форма имени.
- source_word: לְ/בָבֶל
  choice: в Вавилон
  rationale: Предлог לְ обозначает направление и конечный пункт перемещения.
- source_word: וַ/יִּתְּנֵם
  choice: и поместил их
  rationale: נתן в данном контексте означает размещение или помещение предметов в определённое место.
- source_word: בְּ/הֵיכָל/וֹ
  choice: в своём храме
  rationale: הֵיכָל может обозначать храм или дворец. В контексте священных сосудов вероятнее значение «храм»; возвратное «своём» естественно связывает суффикс третьего лица с Навуходоносором.
- source_word: בְּ/בָבֶל
  choice: в Вавилоне
  rationale: Предлог בְּ имеет местное значение и указывает, где были помещены сосуды.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение הֵיכָל применительно к зданию Навуходоносора
  choice: храм
  alternative: дворец
  rationale: Связь с сосудами из дома Яхве делает культовое значение наиболее вероятным, однако лексическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Порядок слов слегка выровнен ради естественности; партитивное значение выражено словом «часть». Маркер примечания поставлен непосредственно после неоднозначного слова «храме».
