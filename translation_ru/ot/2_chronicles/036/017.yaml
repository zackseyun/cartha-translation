  naturalness: Текст выдержан в современном литературном библейском регистре. «Глубокого старца» звучит несколько искусственно; «престарелого» естественнее и сохраняет отличие от «старого». «В их святилище» — естественное русское обозначение места, хотя менее пословно воспроизводит «дом».
  terminology: «Халдеи» и сноска о вавилонянах уместны. «Девственница» необходима как основной эквивалент בְּתוּלָה; пояснительная сноска может сохранить уточнение о молодой незамужней женщине. Метафора «отдал в его руку» сохранена.
