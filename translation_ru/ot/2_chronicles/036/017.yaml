  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: ru
  text: И Он навёл на них царя халдеев[a], который убил их юношей мечом в их святилище и не пощадил[b] ни юноши, ни девственницы[c], ни старого, ни престарелого. Всех Он отдал в его руку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царя вавилонян»; буквально: «царя халдеев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не проявил сострадания».'
    reason: lexical_alternative
  - marker: c
    text: То есть молодой незамужней женщины.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: И Он навёл на них
  rationale: Каузативная форма глагола עלה в военном контексте означает «привести/навести против». Местоимение «Он» восстанавливает подразумеваемого из предыдущего стиха Бога и сохраняет причинный оттенок.
- source_word: מֶלֶךְ כשדיים
  choice: царя халдеев
  rationale: Буквальное обозначение народа — «халдеи»; в данном контексте это вавилоняне. Прямое соответствие сохранено в тексте, а понятный исторический эквивалент дан в сноске.
- source_word: וַיַּהֲרֹג
  choice: который убил
  rationale: Относительное придаточное естественно связывает действие с царём халдеев; глагол передаёт прямое значение «убил» без дополнительного усиления.
- source_word: בַּחוּרֵיהֶם
  choice: их юношей
  rationale: Слово обозначает молодых мужчин в расцвете сил; «юношей» здесь естественно и достаточно точно.
- source_word: בַּחֶרֶב
  choice: мечом
  rationale: Русский творительный падеж естественно передаёт инструментальное значение еврейского оборота.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: в доме их святилища
  rationale: Сохранён образ «дома святилища», подчёркивающий место святотатственного убийства; более гладкое «в их храме» возможно, но менее буквально.
- source_word: וְלֹא חָמַל
  choice: не пощадил
  rationale: Глагол выражает отказ пощадить из жалости. «Не пощадил» естественно передаёт результат и подразумеваемое отсутствие сострадания.
- source_word: בָּחוּר וּבְתוּלָה
  choice: ни юноши, ни девушки
  rationale: בְּתוּלָה буквально указывает на девственницу, обычно молодую незамужнюю женщину. В основном тексте «девушка» звучит естественно, а точный оттенок отмечен в сноске.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: ни старика, ни глубокого старца
  rationale: 'Различение двух обозначений пожилого возраста сохраняет риторическую полноту исходного текста: второе слово указывает на человека весьма преклонных лет.'
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: Всех Он отдал в его руку
  rationale: «Всех» по ближайшему контексту относится к людям, а образ передачи «в руку» сохраняет еврейскую идиому власти и подчинения.
theological_decisions:
- issue: Подразумеваемое подлежащее первого и последнего глаголов
  choice: Бог обозначен местоимением «Он», тогда как «его» относится к царю халдеев.
  alternative: Оставить подлежащее менее явным или повторить «Господь».
  rationale: В предыдущем контексте подлежащим является Господь; прописная буква проясняет референцию без внесения в стих отсутствующего здесь имени. Последняя фраза тем самым сохраняет мысль о Божьем суде через халдейского царя.
- issue: Объём выражения הַכֹּל
  choice: «Всех» — всех перечисленных людей.
  alternative: «Всё» — люди и имущество либо вся совокупность без уточнения.
  rationale: Непосредственно перед фразой перечислены категории людей, поэтому личная форма естественна; при этом исходное собирательное выражение допускает более широкий оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя, но сохранены значимые исходные образы «дом святилища» и «отдал в руку».
