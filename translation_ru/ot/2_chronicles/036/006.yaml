  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
translation:
  language: ru
  text: На него выступил Навуходоносор, царь Вавилона, и заковал его в бронзовые оковы[a], чтобы отвести в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзовыми цепями», «бронзовыми кандалами». Еврейское слово обозначает бронзовые средства удержания пленника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: на него выступил
  rationale: Военный оборот עָלָה עַל означает движение против противника. «Выступил на него» передаёт враждебное наступление, не усиливая смысл до прямого «напал».
- source_word: נְבוּכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Использована устоявшаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Конструктивное сочетание обозначает царский титул Навуходоносора; русское приложение естественно отделяется запятыми.
- source_word: וַיַּאַסְרֵהוּ
  choice: заковал его
  rationale: Глагол אָסַר означает «связать, заключить в узы»; вместе с последующим упоминанием металлических оков естественно переводится «заковал».
- source_word: בַּנְחֻשְׁתַּיִם
  choice: в бронзовые оковы
  rationale: Форма указывает на бронзовые средства удержания, вероятно парные. «Оковы» сохраняет родовое значение, не уточняя без достаточных оснований, были ли это цепи, ножные путы или иные кандалы.
- source_word: לְהֹלִיכוֹ
  choice: чтобы отвести
  rationale: Каузативная форма הלך буквально выражает побуждение или принуждение идти; в контексте пленника «отвести» естественно передаёт принудительное перемещение.
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс обозначает движение к месту назначения; по-русски это естественно передаётся сочетанием «в Вавилон».
