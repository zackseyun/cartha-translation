source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: ru
  text: Но они продолжали глумиться над посланниками Бога[a], презирать его слова и насмехаться над его пророками, пока гнев Яхве не возгорелся против его народа, так что исцеления уже не было[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ангелами Бога». Слово может иметь оба значения, однако здесь контекст — особенно последующее упоминание пророков — указывает на человеческих посланников Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не было лекарства»; по смыслу также: «исцеление стало невозможным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ ... מַלְעִבִים ... וּבוֹזִים ... וּמִתַּעְתְּעִים
  choice: продолжали глумиться ... презирать ... и насмехаться
  rationale: Связка וַיִּהְיוּ с причастиями выражает продолжительное или повторявшееся действие в прошлом. «Продолжали» естественно передаёт эту длительность, а три разных глагола сохраняют нарастающий ряд проявлений презрения.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: над посланниками Бога
  rationale: מַלְאָךְ может обозначать как человеческого посланника, так и ангела. Параллельное упоминание «его пророков» указывает здесь на людей, которых Бог посылал к народу.
- source_word: דְּבָרָיו
  choice: его слова
  rationale: Сохранено множественное число исходного текста; речь идёт о словах Бога, передаваемых через его посланников.
- source_word: חֲמַת יְהוָה
  choice: ярость Яхве
  rationale: חֵמָה обозначает сильный, пылающий гнев; «ярость» сохраняет тяжесть наступившего суда. Имя יהוה передано как «Яхве».
- source_word: בְּעַמּוֹ
  choice: на его народ
  rationale: При обозначении направленного гнева предлог ב указывает на объект суда. Русское выражение «ярость поднялась на» сохраняет образ исходного текста и остаётся понятным.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: пока уже не осталось никакого средства исцеления
  rationale: מַרְפֵּא допускает значения «исцеление» и «средство исцеления». Выбранный оборот передаёт окончательность положения, не превращая образ исцеления в отвлечённое «нет выхода».
theological_decisions:
- issue: Кого обозначают «посланники Бога»
  choice: человеческие посланники-пророки
  alternative: ангелы Бога
  rationale: Непосредственный параллелизм с «его пророками» и исторический контекст отвержения Божьих предупреждений говорят о человеческих посланниках. Лексическая возможность значения «ангелы» отмечена в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл отсутствия מַרְפֵּא
  choice: для народа уже не осталось средства исцеления
  alternative: исцеления не было; положение стало неисправимым
  rationale: Фраза выражает окончательность Божьего суда после длительного отвержения предупреждений, но перевод сохраняет метафору исцеления и не уточняет сверх текста, в чём именно могло бы состоять «средство».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем. Строчные местоимения при упоминании Бога соответствуют обычной современной издательской норме и не меняют референцию. Повтор עַד передан повтором «пока», а тире подчёркивает кульминацию и окончательность суда.
