    rationale: Русское «поднялась на» в этом контексте звучит неидиоматично и размывает значение гнева, направленного против народа. «Гнев Яхве возгорелся против его народа» естественно передаёт עלות חמת יהוה בעמו.
  - severity: low
    issue: «Средство исцеления» чрезмерно конкретизирует מַרְפֵּא.
    rationale: Слово допускает «исцеление», «лечение», «исцеление/помощь»; в контексте окончательности суда лучше оставить более широкий образ отсутствующего исцеления.
  - severity: low
    issue: Повтор «пока» после тире синтаксически тяжеловесен.
    rationale: Вторая часть выражает итог наступившего гнева; «так что» делает связь ясной без изменения смысла.
