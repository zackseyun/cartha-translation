  verdict: revise
  source_fidelity: 'Основной смысл передан верно: длительное пренебрежение Божьими посланниками, словами и пророками приводит к гневу Яхве и отсутствию возможности исцеления. Однако «ярость Яхве не поднялась на его народ» не является естественным русским выражением и неточно передаёт направленность гнева; «возгорелся против» точнее и литературно естественнее. «Средство исцеления» излишне конкретизирует מַרְפֵּא, которое здесь может означать собственно исцеление/возможность исцеления.'
  naturalness: «Глумиться», «презирать» и «насмехаться» образуют естественный ряд с торжественным библейским регистром. Конструкция с повторным «пока» после тире звучит синтаксически неудачно; причинно-следственное «так что» ясно передаёт кульминационный итог.
  terminology: «Посланники Бога» уместно сохраняет контекстуально предпочтительное значение מַלְאָכִים, а сноска корректно отмечает вариант «ангелы Бога». «Яхве» последовательно передаёт тетраграмматон. «Исцеления уже не было» сохраняет образ оригинала, не навязывая значение конкретного средства или медицинского лечения.
