  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: ru
  text: 'В первый год Кира, царя Персии, чтобы исполнилось слово Яхве, прозвучавшее из уст Иеремии[a], Яхве пробудил дух Кира, царя Персии, и тот провозгласил по всему своему царству, а также письменно, следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переданное через Иеремию»; буквально: «из уст Иеремии».'
    reason: Указан смысловой вариант еврейской идиомы при сохранении её буквального образа в основном тексте.
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: В первый год
  rationale: Естественная русская формула датировки; начальный союз ו не требует отдельного слова вне более широкого контекста.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Кира, царя Персии
  rationale: Имя передано в принятой русской форме, царский титул оформлен как приложение.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: чтобы исполнилось слово Яхве
  rationale: Инфинитив выражает цель или результат; «исполнилось» естественно передаёт завершённое осуществление пророческого слова.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: сказанное устами Иеремии
  rationale: Сохранён образ пророческой речи, исходящей из уст посредника; добавленное «сказанное» делает оборот ясным по-русски.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּורֶשׁ
  choice: Яхве пробудил дух Кира
  rationale: «Пробудил» передаёт побуждение к действию, а «дух» сохраняет лексическую форму и не сводит выражение только к мысли или настроению.
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: и тот повелел объявить по всему своему царству
  rationale: Еврейская идиома буквально описывает распространение голоса; русский оборот передаёт публичное провозглашение по всей державе. Местоимение «тот» устраняет двусмысленность после упоминания Яхве.
- source_word: וְגַם בְּמִכְתָּב
  choice: в том числе письменно
  rationale: Передаёт, что указ не только провозгласили, но и распространили в письменной форме.
- source_word: לֵאמֹר
  choice: 'следующее:'
  rationale: Естественно вводит прямую речь, начинающуюся в следующем стихе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное имя, прямо присутствующее в еврейском тексте, без замены титулом.
- issue: Значение רוּחַ применительно к Киру
  choice: дух Кира
  alternative: намерение Кира
  rationale: 'Сохранена широта исходного слова: речь может идти о внутреннем расположении, побуждении или духе, без сведения смысла к одной психологической категории.'
- issue: Связь пророчества с Иеремией
  choice: сказанное устами Иеремии
  alternative: переданное через Иеремию
  rationale: Основной текст сохраняет телесный образ еврейской идиомы, а сноска указывает более свободный смысловой вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-пророческого повествования. Синтаксис сделан ясным для обычного читателя; архаизмы и конфессионально маркированные формулы не использованы.
