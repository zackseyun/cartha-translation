source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, своего Бога, и не смирился перед пророком Иеремией, говорившим по слову Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из уст Яхве».'
    reason: Сноска сохраняет конкретный древнееврейский образ, который в основном тексте передан естественным русским выражением «по слову Яхве».
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Устойчивая древнееврейская оценочная формула естественно передаётся по-русски как «делать зло»; начальный waw продолжает повествование и не требует отдельного «и» в начале русского предложения.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохраняет прозрачный древнееврейский образ оценки с точки зрения Яхве; выражение понятно в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Возвратное местоимение естественно соотносится в русском с подлежащим «он» и сохраняет значимое указание на Яхве как на его Бога.
- source_word: לֹא נִכְנַע
  choice: не смирился
  rationale: Нифаль глагола כנע здесь имеет возвратно-медиальное значение и описывает отказ Седекии проявить смирение или покорность.
- source_word: מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא
  choice: перед пророком Иеремией
  rationale: Естественно передаёт отношение к Иеремии как к пророку, перед которым Седекия не смирился.
- source_word: מִפִּי יְהוָה
  choice: говорившим по слову Яхве
  rationale: Контекстуально раскрывает формулу пророческого посредничества, буквально означающую «из уст Яхве», и ясно связывает её с речью Иеремии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя Бога.
- issue: Характер пророческой речи Иеремии
  choice: говорившим по слову Яхве
  alternative: говорившим из уст Яхве; говорившим по повелению Яхве
  rationale: Выбранный вариант сохраняет представление об Иеремии как посреднике Божьей речи, не превращая идиому в утверждение только о приказе и не создавая неестественного русского оборота.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «в глазах Яхве» намеренно сохраняет образность оригинала; более буквальное «из уст Яхве» вынесено в сноску. Маркер сноски поставлен после относящейся к ней фразы.
