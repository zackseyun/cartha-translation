base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: ru
  text: И всю утварь храма Бога — большую и малую, и сокровища[a] храма Яхве, и сокровища царя и его сановников[b] — всё это он доставил в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровищницы» или «кладовые». Еврейское слово может обозначать как место хранения, так и хранящиеся там ценности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князей» или «вельмож».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי
  choice: И все принадлежности
  rationale: כְּלִי обозначает различные предметы и утварь; «принадлежности» достаточно широко охватывает храмовые сосуды, орудия и иные предметы, не сужая значение.
- source_word: בֵּית הָאֱלֹהִים
  choice: храма Бога
  rationale: Буквально «дома Бога», но в данном контексте речь однозначно идёт о храме; современное русское «храм Бога» ясно и естественно.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: большие и малые
  rationale: Сохраняет парную формулу оригинала и может относиться как к размеру, так и к значимости предметов.
- source_word: אֹצְרוֹת
  choice: сокровища
  rationale: Слово может означать также сокровищницы или кладовые, однако в перечне вывезенного имущества естественнее понимать содержимое, то есть ценности.
- source_word: בֵּית יְהוָה
  choice: храма Яхве
  rationale: «Храм» ясно передаёт контекстуальное значение «дома», а личное имя Яхве воспроизводит тетраграмматон, присутствующий в еврейском тексте.
- source_word: שָׂרָיו
  choice: его сановников
  rationale: שַׂר обозначает высокопоставленного правителя, начальника или придворного; «сановники» естественно для монархического контекста и не предполагает обязательного царского происхождения.
- source_word: הַכֹּל
  choice: всё это
  rationale: Возобновляющее обобщение подводит итог всему предшествующему перечню.
- source_word: הֵבִיא בָבֶל
  choice: он доставил в Вавилон
  rationale: Передаёт направленное перемещение в Вавилон и сохраняет единственное число глагола с подразумеваемым из контекста субъектом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале употреблено собственное имя Бога, а не титул; транслитерация сохраняет различие между יהוה и אֱלֹהִים в том же стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Повтор «и» сохраняет перечислительную структуру еврейского текста; тире выделяет итоговое «всё это». Термины выбраны без конфессионально специфической окраски.
