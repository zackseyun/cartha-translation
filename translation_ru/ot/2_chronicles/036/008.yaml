  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהֽוֹיָקִ֜ים וְ/תֹֽעֲבֹתָ֤י/ו אֲשֶׁר עָשָׂה֙ וְ/הַ/נִּמְצָ֣א עָלָ֔י/ו הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר מַלְכֵ֥י יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: ru
  text: Остальные деяния Иоакима, мерзости, которые он совершил, и то, что было обнаружено против него[a], — всё это записано в Книге царей Израиля и Иудеи. Вместо него воцарился его сын Иехония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что было обнаружено о нём». Еврейское выражение может обозначать в целом сведения, обнаруженные об Иоакиме, хотя отрицательный контекст поддерживает перевод «против него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: Остальные деяния Иоакима
  rationale: В царской итоговой формуле דִּבְרֵי обозначает события и деяния царствования, а не только «слова»; וְיֶתֶר указывает на прочие, не изложенные здесь сведения.
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: мерзости, которые он совершил
  rationale: «Мерзости» сохраняет сильную нравственную и, возможно, культовую оценку תֹעֲבוֹת; глагол «совершил» естественно сочетается с этим существительным.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: и то, что было обнаружено против него
  rationale: Дословно передаёт пассивную конструкцию и вероятный неблагоприятный оттенок עָלָיו, не превращая неопределённые сведения в конкретные юридические обвинения.
- source_word: הִנָּם כְּתוּבִים
  choice: всё это записано
  rationale: Русское «всё это» естественно передаёт указательно-усилительную функцию הִנָּם; «записано» идиоматично для ссылки на письменный источник.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Книга царей Израиля и Иудеи
  rationale: Оформлено как название упоминаемого летописного источника с сохранением его еврейской структуры.
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: Вместо него воцарился его сын Иехония
  rationale: «Воцарился» кратко и естественно передаёт формулу вступления на престол; תַּחְתָּיו означает преемство — «вместо него».
theological_decisions:
- issue: Характер найденного у Иоакима или относящегося к нему
  choice: что было обнаружено против него
  alternative: что было обнаружено о нём
  rationale: Отрицательный контекст мерзостей поддерживает неблагоприятное значение «против него», однако еврейское выражение допускает более общее понимание, поэтому альтернатива сохранена в примечании.
translation_notes:
  register: 'Современный литературный русский язык с достоинством историко-библейского повествования. Архаическое «вот» при הִנָּם не воспроизведено буквально: его указательное ударение естественно выражено словами «всё это». Имена переданы в традиционной русской библейской форме.'
