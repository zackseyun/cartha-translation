revisions:
- from: 'Так говорит Кир, царь Персии: «Яхве, Бог небес, отдал мне все царства земли и поручил мне построить Ему дом в Иерусалиме, что в Иудее. Кто бы ни был среди вас из всего Его народа — да будет с ним Яхве, его Бог,[a] и пусть он поднимется туда».[b]'
  to: 'Так говорит Кир, царь Персии: «Яхве, Бог небес, отдал мне все царства земли и поручил мне построить Ему дом в Иерусалиме, что в Иудее. Если среди вас есть кто-либо из всего Его народа, пусть Яхве, его Бог, будет с ним, и пусть он поднимется».[b]'
  rationale: 'Исправлена только неясная русская передача партитивной еврейской конструкции и убрано невыраженное в оригинале «туда». Благопожелательный смысл заключительной фразы сохранён, а её альтернативное изъявительное понимание остаётся в сноске. Маркер [a] в основном тексте не нужен: сноска фиксирует альтернативное чтение всей заключительной безглагольной фразы, тогда как [b] относится к «поднимется».'
