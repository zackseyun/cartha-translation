  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: ru
  text: 'Так говорит Кир, царь Персии: «Яхве, Бог небес, отдал мне все царства земли и поручил мне построить Ему дом в Иерусалиме, что в Иудее. Если среди вас есть кто-либо из всего Его народа, пусть Яхве, его Бог, будет с ним, и пусть он поднимется».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: То есть пусть поднимется в Иерусалим. «Подниматься» — обычное библейское выражение для пути в святой город.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная русская передача вестнической и царской формулы; настоящее время уместно при цитировании указа.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Кир, царь Персии
  rationale: Использовано традиционное русское имя; приложение отделено запятой.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: все царства земли
  rationale: Сохраняет широкий геополитический смысл אֶרֶץ и близость к форме оригинала.
- source_word: נָתַן לִי
  choice: отдал мне
  rationale: Передаёт совершившееся дарование власти с сохраняющимся результатом; в данном контексте по-русски звучит естественнее, чем буквальное «дал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Бог небес
  rationale: Точно отражает форму множественного числа שָׁמַיִם и сохраняет возвышенную, но понятную русскую формулу.
- source_word: וְהוּא פָקַד עָלַי
  choice: и поручил мне
  rationale: В контексте פקד обозначает возложение поручения или назначение к задаче; «поручил» не усиливает смысл до прямого приказа.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: построить Ему дом
  rationale: Сохранено буквальное «дом», имеющее здесь храмовый смысл, без его неявной замены словом «храм».
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: в Иерусалиме, что в Иудее
  rationale: Явно сохранено относительное придаточное оригинала.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Кто бы ни был среди вас из всего Его народа
  rationale: 'Передаёт сжатую еврейскую конструкцию и партитивное значение מִן: приглашение относится к любому присутствующему представителю Божьего народа.'
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: да будет с ним Яхве, его Бог
  rationale: В контексте прощального призыва фраза естественно читается как благословение, при этом альтернативное изъявительное понимание отмечено в сноске.
- source_word: וְיָעַל
  choice: и пусть он поднимется туда
  rationale: Передаёт побудительный оттенок и традиционное восхождение в Иерусалим; «туда» делает подразумеваемое направление ясным и отмечено сноской.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не превращает его в титул.
- issue: Значение בַיִת
  choice: дом
  alternative: храм
  rationale: Оригинал употребляет «дом». Контекст указывает на храм, но перевод сохраняет исходный образ Божьего дома.
- issue: Модальность יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 'благопожелание: «да будет с ним Яхве, его Бог»'
  alternative: 'утверждение: «Яхве, его Бог, с ним»'
  rationale: Контекст указа и приглашения благоприятствует благословению, однако в безглагольной еврейской фразе грамматически возможно и изъявительное прочтение; оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством царского указа. Синтаксис сделан понятным для обычного читателя, но сохранены формула провозглашения, «дом» как храмовый образ, глагол восхождения и подлинная неоднозначность заключительного благословения.
