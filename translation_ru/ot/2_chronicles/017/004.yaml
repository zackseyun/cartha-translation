  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: ru
  text: Но[a] он искал Бога своего отца и жил по Его заповедям, а не поступал так, как Израиль[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо он искал Бога своего отца». Древнееврейский союз может также означать «ибо» или «потому что»; в основном тексте «но» подчёркивает противопоставление предыдущему стиху.'
    reason: lexical_alternative
  - marker: b
    text: Здесь под «Израилем», вероятно, подразумевается северное царство, противопоставленное Иудее.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В данном контексте союз подчёркивает противопоставление поведению, упомянутому в предыдущем стихе. Возможное причинное значение сохранено в примечании.
- source_word: לֵאלֹהֵי אָבִיו
  choice: Бога своего отца
  rationale: Предлог ל при דָּרַשׁ обозначает объект поисков и по-русски отдельно не передаётся. Единственное число «отца» сохранено.
- source_word: דָּרָשׁ
  choice: искал
  rationale: Здесь глагол означает устремляться к Богу, искать Его и Его воли, а не только обращаться с вопросом.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: жил по Его заповедям
  rationale: Естественная современная русская передача древнееврейской метафоры «ходить в заповедях», обозначающей образ жизни и поведение.
- source_word: כְּמַעֲשֵׂה יִשְׂרָאֵל
  choice: так, как Израиль
  rationale: Передаёт сравнение с образом действий Израиля без тяжеловесного буквального выражения «по делам Израиля» и без уточнения референта в основном тексте.
theological_decisions:
- issue: Кого обозначает «Израиль»
  choice: Сохранить «Израиль» без поясняющего расширения в основном тексте.
  alternative: Северное царство Израиля; дом Ахава.
  rationale: Древнееврейский текст называет только Израиль. Вероятный исторический референт поясняется в сноске, чтобы не превращать толкование в перевод.
- issue: Значение союза כִּי
  choice: Передать как противительный союз «но».
  alternative: «Ибо» или «потому что».
  rationale: Контекст создаёт явное противопоставление предыдущему стиху, однако причинное прочтение грамматически возможно и потому отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Выражение «жил по Его заповедям» передаёт смысл древнееврейской метафоры естественнее, чем буквальное «ходил в Его заповедях»; местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции.
