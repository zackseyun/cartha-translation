  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: ru
  text: Рядом с ним[a] был Иегозавад, а с ним — 180 000 воинов, снаряжённых для войны.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при его руке»; выражение может также означать «под его началом» или «рядом с ним».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «180 000 воинов, готовых к бою».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Рядом с ним
  rationale: Еврейское выражение буквально означает «при его руке» и может указывать как на нахождение рядом, так и на подчинённое положение. В перечне военачальников «рядом с ним» естественно передаёт связь, не превращая возможный оттенок подчинения в однозначное утверждение.
- source_word: יְהוֹזָבָד
  choice: Иегозавад
  rationale: Имя передано в принятой русской библейской форме.
- source_word: וְעִמּוֹ
  choice: а с ним
  rationale: Предлог עִם выражает совместное пребывание или принадлежность к сопровождающей группе; русская конструкция с подразумеваемым сказуемым естественна в военном перечне.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 180 000
  rationale: Число передано цифрами в соответствии с современной русской практикой; разряд отделён пробелом.
- source_word: חֲלוּצֵי צָבָא
  choice: воинов, снаряжённых для войны
  rationale: חֲלוּצֵי обозначает вооружённых или снаряжённых, готовых выступить, а צָבָא — войну или военную службу. Формулировка сохраняет оба смысловых компонента и звучит естественно по-русски.
