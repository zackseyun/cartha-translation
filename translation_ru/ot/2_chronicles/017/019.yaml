base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/019.yaml
  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: ru
  text: Это были те, кто служил царю, помимо тех, кого царь разместил в укреплённых городах по всей Иудее.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Это те
  rationale: Указательное местоимение подводит итог предшествующему перечню; «Это те» естественно передаёт его возобновляющую функцию.
- source_word: הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: кто служил царю
  rationale: Причастие от שׁרת обозначает служение или исполнение обязанностей при царе. Придаточная конструкция звучит по-русски естественно и сохраняет общий характер выражения.
- source_word: מִלְּבַד
  choice: не считая
  rationale: Выражение отделяет перечисленных воинов от дополнительной группы; «не считая» ясно передаёт значение добавления к уже названным.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: кого царь разместил
  rationale: נתן буквально означает «дал, поместил», но здесь речь идёт о распределении людей по оборонительным городам. «Разместил» передаёт контекстуальный смысл без чрезмерного уточнения военной функции.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: в укреплённых городах
  rationale: Сочетание обозначает города, укреплённые для обороны; это принятое и ясное русское соответствие.
- source_word: בְּכָל יְהוּדָה
  choice: по всей Иудее
  rationale: Так передаётся распределённость по территории всей Иудеи, причём כל относится к Иудее, а не обязательно утверждает, что были заняты абсолютно все укреплённые города.
