base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: ru
  text: На третий год своего царствования он послал своих сановников[a] — Бен-Хаила, Авдию, Захарию, Нафанаила и Михея — учить в городах Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князей» или «начальников»; еврейское слово может обозначать высокопоставленных царских или административных служащих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ
  choice: На третий год
  rationale: Естественная для русского повествования передача временного оборота; начальный союз не требует отдельного «и».
- source_word: לְמָלְכוֹ
  choice: своего царствования
  rationale: Передаёт период его правления именно как царя и естественно согласуется с русским подлежащим.
- source_word: שָׁלַח
  choice: он послал
  rationale: Прямое и нейтральное соответствие обычному значению глагола.
- source_word: לְשָׂרָיו
  choice: своих сановников[a]
  rationale: שַׂר может обозначать князя, начальника или царского должностного лица. В данном административном контексте «сановники» ясно указывает на высокопоставленных представителей царя, не подразумевая их родства с царской семьёй.
- source_word: לְבֶן חַיִל
  choice: Бен-Хаила
  rationale: Личное имя передано транслитерацией и поставлено в винительный падеж как дополнение при глаголе «послал».
- source_word: וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: Авдию, Захарию, Нафанаила и Михея
  rationale: Использованы укоренившиеся в русской библейской традиции формы личных имён, грамматически поставленные в винительный падеж.
- source_word: לְלַמֵּד
  choice: учить
  rationale: Прямая передача значения породы пиэль глагола למד — «учить, наставлять».
- source_word: בְּעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Точно сохраняет выраженное предлогом ב значение места, не добавляя прямо не обозначенной распределительности «по всем городам».
theological_decisions: []
