  register: Современный литературный русский язык с нейтрально-достоинственным библейским звучанием. Синтаксис упрощён без потери содержания; имена даны в привычных русских библейских формах. Маркер примечания поставлен непосредственно после слова «сановников», к которому относится лексическая альтернатива.
