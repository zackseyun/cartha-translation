  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: ru
  text: А из Вениамина — Елиада, доблестный воин, и с ним двести тысяч человек, вооружённых луками и щитами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן בִּנְיָמִן
  choice: А из Вениамина
  rationale: Союз и предлог продолжают перечень и вводят воинский отряд из колена Вениамина. «А из Вениамина» естественно передаёт переход к следующей группе.
- source_word: אֶלְיָדָע
  choice: Елиада
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: גִּבּוֹר חַיִל
  choice: доблестный воин
  rationale: Устойчивое сочетание обозначает сильного и храброго воина; этот вариант сохраняет военный смысл и звучит естественно в современном литературном русском языке.
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Сохранён союз, связывающий названного военачальника с находившимся при нём отрядом.
- source_word: נֹשְׁקֵי קֶשֶׁת וּמָגֵן
  choice: вооружённых луками и щитами
  rationale: Причастие נשק в данном военном контексте указывает на людей, снабжённых названным оружием. Русское множественное число естественно согласуется с многочисленным отрядом.
- source_word: מָאתַיִם אָלֶף
  choice: двести тысяч человек
  rationale: Числительное передано прямо; слово «человек» добавлено для ясного и естественного обозначения численности воинов.
theological_decisions: []
