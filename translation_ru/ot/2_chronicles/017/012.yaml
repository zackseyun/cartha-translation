  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: ru
  text: Иосафат возвышался всё больше и больше. Он построил в Иудее крепости[a] и города для хранения припасов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «цитадели»; еврейское слово обозначает укреплённые опорные пункты.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «города-хранилища» или «города снабжения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: становился всё могущественнее и могущественнее
  rationale: Сочетание וַיְהִי с причастиями הֹלֵךְ וְגָדֵל выражает непрерывное усиление, а עַד לְמָעְלָה усиливает эту мысль. Русская конструкция передаёт нарастание естественно и не сводит его только к богатству или политическому статусу.
- source_word: וַיִּבֶן
  choice: Он построил
  rationale: Прямой и естественный перевод глагола בנה в повествовательном контексте.
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Обычная передача обстоятельства места.
- source_word: בִּירָנִיּוֹת
  choice: крепости
  rationale: Слово обозначает укреплённые опорные пункты; «крепости» точно, понятно и не вызывает средневековых ассоциаций, возможных у слова «замки».
- source_word: עָרֵי מִסְכְּנוֹת
  choice: города для хранения припасов
  rationale: Описательная передача ясно выражает назначение этих административно-хозяйственных городов и звучит по-русски естественнее, чем буквальное «города-хранилища».
