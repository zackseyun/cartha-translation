lexical_decisions:
- source_word: וַיָּכֶן
  choice: утвердил
  rationale: Порода hифиль глагола כון означает «утвердить, сделать прочным». «Утвердил» естественно передаёт упрочение царской власти.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: הַמַּמְלָכָה בְּיָדוֹ
  choice: царство в его руке
  rationale: Сохранён конкретный древнееврейский образ власти и обладания; по-русски он понятен, хотя несколько возвышен.
- source_word: וַיִּתְּנוּ כָל יְהוּדָה
  choice: и весь Иуда давал
  rationale: «Иуда» выступает собирательным обозначением народа царства; несовершенный вид «давал» естественно допускает как совокупное, так и продолжающееся принесение дани.
- source_word: מִנְחָה
  choice: дань
  rationale: Слово может обозначать дар, приношение или дань; политико-царский контекст делает «дань» наиболее вероятным выбором.
- source_word: לִיהוֹשָׁפָט
  choice: Иосафату
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: עֹשֶׁר וְכָבוֹד לָרֹב
  choice: великое богатство и почёт
  rationale: לָרֹב выражает изобилие или большую меру и относится к сочетанию богатства и почёта; формулировка сохраняет придворно-политический смысл כָבוֹד.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; «Яхве» сохраняет его как имя и отражает наиболее распространённую научную реконструкцию произношения.
- issue: Значение מִנְחָה
  choice: дань
  alternative: дар; приношение
  rationale: Контекст утверждения царства и подношений царю поддерживает политическое значение, но многозначность слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён исходный образ «царство в его руке», не заменённый толкованием «под его властью». Маркер сноски помещён непосредственно после слова «дань», к которому относится примечание.
