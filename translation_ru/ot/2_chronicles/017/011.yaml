base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: ru
  text: 'И некоторые из филистимлян[a] приносили Иосафату дань и груз серебра[b]. Аравитяне также пригоняли ему мелкий скот: семь тысяч семьсот баранов и семь тысяч семьсот козлов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от филистимлян»; еврейское выражение может указывать на источник, а не на часть народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «серебро — груз», то есть груз серебра, доставлявшийся как дань.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: И некоторые из филистимлян
  rationale: Предлог מִן при названии народа допускает как значение источника («от филистимлян»), так и партитивное значение («некоторые из филистимлян»). Последнее естественно в русском тексте, а подлинная неоднозначность отмечена в сноске.
- source_word: מְבִיאִים
  choice: приносили / пригоняли
  rationale: Причастная форма обозначает продолжавшееся или повторявшееся действие. Русский несовершенный вид передаёт эту обычность; для скота естественно употреблено «пригоняли».
- source_word: מִנְחָה
  choice: дань
  rationale: В политическом контексте отношений чужих народов с царём слово означает дань, а не культовое приношение или просто добровольный подарок.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: и серебро — целый груз
  rationale: כֶסֶף передано буквально как «серебро», а מַשָּׂא — как конкретный груз. Добавление «целый» делает необычное еврейское сочетание понятным по-русски, не сводя его просто к денежной дани.
- source_word: גַּם הָ/עַרְבִיאִים
  choice: Аравитяне также
  rationale: «Аравитяне» — уместное историко-библейское обозначение этой группы; «также» сохраняет добавочное значение גַּם.
- source_word: ל/וֹ צֹאן
  choice: ему мелкий скот
  rationale: צֹאן — собирательное название овец и коз; «мелкий скот» точно подводит к последующему перечислению баранов и козлов.
- source_word: אֵילִים
  choice: баранов
  rationale: Стандартное и естественное русское обозначение взрослых самцов овец.
- source_word: שִׁבְעַת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: семь тысяч семьсот
  rationale: Число передано словами в соответствии с достоинством библейского прозаического регистра.
- source_word: וּ/תְיָשִׁים
  choice: козлов
  rationale: Слово обозначает именно самцов коз; «козлов» — точный и современный русский эквивалент.
