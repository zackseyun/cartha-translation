base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: ru
  text: Они учили в Иудее, и с ними была книга[a] Закона Яхве. Они обошли все города Иудеи и учили народ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свиток». Еврейское слово обозначает письменный документ, который в ту эпоху обычно имел форму свитка.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «учили среди народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: они учили
  rationale: Пиэль глагола למד означает «учить, наставлять»; «учили» естественно и позволяет одинаково передать повтор глагола в стихе.
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Предлог ב здесь обозначает место; охват территории далее раскрывается словами о всех городах Иудеи.
- source_word: וְעִמָּהֶם
  choice: и при них была
  rationale: Еврейская безглагольная конструкция буквально указывает, что книга находилась с ними; такая формулировка естественна по-русски и сохраняет сочинительную связь.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: книга закона Яхве
  rationale: סֵפֶר обозначает письменный документ, обычно свиток; «книга» — ясное родовое обозначение. В данном сочетании תּוֹרָה указывает на данный Богом закон, а не просто на наставление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וַיָּסֹבּוּ
  choice: они обошли
  rationale: Глагол סבב в данном повествовательном контексте описывает последовательное передвижение по разным местам; «обошли» кратко и естественно выражает этот смысл.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: все города Иудеи
  rationale: При глаголе движения русская конструкция «обошли все города» естественно передаёт маршрут по всей совокупности городов.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: и учили народ
  rationale: Буквально предлог ב даёт смысл «учили среди народа», однако по-русски контекст допускает естественную объектную формулировку «учили народ»; буквальная конструкция отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение תּוֹרָה
  choice: закон
  alternative: наставление
  rationale: Хотя слово может означать «наставление», сочетание «книга закона Яхве» в данном контексте указывает на авторитетный письменный свод Божьего закона.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность еврейских повествовательных предложений, но избегает неестественной буквальности.
