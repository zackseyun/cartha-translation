  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: ru
  text: А под его началом[a] был военачальник Иегоханан, и с ним — двести восемьдесят тысяч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при нём был военачальник Иегоханан»; еврейское выражение буквально означает «на его руке» и может указывать как на положение рядом с ним, так и на подчинение его власти.'
    reason: Сохранена смысловая широта еврейской идиомы וְעַל יָדוֹ.
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: А под его началом
  rationale: Еврейская идиома буквально означает «при его руке», но в данном перечне военных подразделений выражает подчинение и руководство. «Под его началом» естественно передаёт этот смысл по-русски.
- source_word: יְהוֹחָנָן
  choice: Иегоханан
  rationale: Имя транслитерировано с сохранением полной еврейской формы Йехоханан; написание «Иегоханан» соответствует принятой русской библейской передаче начального теофорного элемента.
- source_word: הַשַּׂר
  choice: военачальник
  rationale: Слово שַׂר может означать начальника, сановника или военачальника. Военный контекст перечня делает «военачальник» наиболее точным и понятным вариантом.
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Фраза указывает на воинов, состоявших при Иегоханане; эллиптическая конструкция с тире естественна для русского перечня.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: двести восемьдесят тысяч
  rationale: Прямая передача указанного в еврейском тексте количества.
