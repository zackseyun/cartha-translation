base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: ru
  text: 'Вот их воинские подразделения по отцовским родам[a]. У Иуды — начальники тысяч: Адна, военачальник, и с ним — триста тысяч доблестных воинов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их численность», «их учёт» или «их смотр». Еврейское слово может обозначать как военный учёт, так и состав или организацию войска по его итогам.'
    reason: Сохраняет лексическую неоднозначность פְקֻדָּתָם, не меняя основного контекстуального перевода.
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: их воинские подразделения
  rationale: В данном военном контексте слово обозначает учтённых при смотре людей либо сформированные из них подразделения. Перевод передаёт итог воинского учёта и естественно вводит перечень начальников и численности войск.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: по домам их предков
  rationale: Устойчивое родословно-административное выражение, обозначающее объединения по отцовским родам. Такая формулировка близка к еврейскому тексту и понятна современному читателю.
- source_word: לִיהוּדָה
  choice: у Иуды
  rationale: Слово вводит часть перечня, относящуюся к Иуде; формулировка звучит как естественный русский заголовок перед перечислением начальников.
- source_word: שָׂרֵי אֲלָפִים
  choice: начальниками тысяч
  rationale: Военно-административный титул руководителей подразделений, исчислявшихся тысячами. «Начальники» не приписывает им более узкого современного воинского звания.
- source_word: עַדְנָה הַשָּׂר
  choice: начальник Адна
  rationale: Сохраняется титул שׂר и его связь с именем; порядок слов выбран в соответствии с естественной русской речью.
- source_word: גִּבּוֹרֵי חַיִל
  choice: доблестных воинов
  rationale: Идиоматическое военное выражение описывает сильных, испытанных и храбрых бойцов. «Доблестные воины» передаёт его смысл естественно и без архаической тяжеловесности.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: триста тысяч
  rationale: Прямое соответствие количественному выражению исходного текста.
