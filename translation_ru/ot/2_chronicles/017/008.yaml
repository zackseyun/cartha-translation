base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: ru
  text: 'С ними были левиты: Шемаия, Нетания, Зевадия, Асаил, Шемирамоф, Иехонатан[a], Адония, Товия[b] и Тов-Адония[c]; а с ними — священники Елишама и Иегорам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древнееврейском тексте стоит полная форма имени — «Иехонатан»; в некоторых переводах употребляется сокращённая форма «Ионафан».
    reason: lexical_alternative
  - marker: b
    text: Древнееврейская форма имени имеет полное теофорное окончание -ягу; по-русски имя традиционно передаётся как «Товия».
    reason: lexical_alternative
  - marker: c
    text: В древнееврейском тексте «Тов Адония» написано двумя словами, но, вероятно, представляет собой одно составное личное имя; возможна также передача без дефиса.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: С ними были
  rationale: Предложное сочетание вводит сопровождающих лиц; глагол «были» естественно восполняет именное древнееврейское предложение.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Термин обозначает представителей установленной левитской группы; определённость передана контекстом и конструкцией списка.
- source_word: שְׁמַעְיָהוּ
  choice: Шемаия
  rationale: Транслитерация личного имени в форме, понятной русскому читателю и близкой древнееврейскому звучанию.
- source_word: נְתַנְיָהוּ
  choice: Нетания
  rationale: Передаёт согласный состав и теофорное окончание имени без перевода его значения.
- source_word: זְבַדְיָהוּ
  choice: Зевадия
  rationale: Русская транслитерация личного имени с сохранением теофорного элемента.
- source_word: עֲשָׂהאֵל
  choice: Асаил
  rationale: Устоявшаяся и узнаваемая русская форма имени.
- source_word: שמרימות
  choice: Шемирамоф
  rationale: Передаёт масоретскую форму имени с обычной для русского библейского употребления передачей конечного taw через «ф».
- source_word: יְהוֹנָתָן
  choice: Иехонатан
  rationale: Сохраняет полную форму имени יהונתן и отличает её от сокращённой формы, традиционно передаваемой как «Ионафан».
- source_word: אֲדֹנִיָּהוּ
  choice: Адония
  rationale: Узнаваемая русская форма имени, соответствующая древнееврейской теофорной форме.
- source_word: טוֹבִיָּהוּ
  choice: Товия
  rationale: Устоявшаяся русская форма имени; полное древнееврейское написание с окончанием -יהו отмечено в сноске.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: Тов-Адония
  rationale: Дефис показывает вероятную функцию двух написанных раздельно элементов как одного составного личного имени, не скрывая его строения.
- source_word: אֱלִישָׁמָע וִיהוֹרָם הַכֹּהֲנִים
  choice: священники Елишама и Иорам
  rationale: Естественный русский порядок слов ясно относит обозначение «священники» к двум последним именам.
theological_decisions:
- issue: Различение левитов и священников
  choice: 'Две группы названы отдельно: сначала левиты, затем священники Елишама и Иорам.'
  alternative: Отнести все перечисленные имена к левитам, не выделяя последних двоих как священников.
  rationale: Повтор выражения וְעִמָּהֶם вводит дополнительную группу, а הַכֹּהֲנִים прямо определяет Елишаму и Иорама как священников; институциональное различие исходного текста сохранено.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Синтаксис списка упрощён без изменения состава и распределения лиц; имена транслитерированы, а не переведены. Все сноски поставлены непосредственно после соответствующих имён.
