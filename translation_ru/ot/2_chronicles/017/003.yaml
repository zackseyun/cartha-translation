base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: ru
  text: Яхве был с Иосафатом, потому что тот ходил путями, которыми прежде ходил Давид, его отец, и не искал Ваалов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первыми путями Давида, его отца». Речь идёт о более раннем образе жизни Давида, вероятно в противопоставление его позднейшим падениям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיְהִי ... עִם
  choice: был ... с
  rationale: Естественно передаёт еврейскую формулу Божьего присутствия и содействия, не добавляя отсутствующих в тексте пояснений.
- source_word: כִּי
  choice: потому что
  rationale: В данном контексте союз естественно выражает основание предшествующего утверждения.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: ходил ... путями
  rationale: Сохраняет этическую метафору образа жизни, характерную для еврейского текста и понятную в современном русском библейском стиле.
- source_word: דָּוִיד אָבִיו
  choice: Давида, своего отца
  rationale: Сохраняет династическое обозначение Давида как отца Иосафата, не заменяя его толкующим словом «предок».
- source_word: הָרִאשֹׁנִים
  choice: прежними
  rationale: Согласованное с «путями» определение указывает на более раннее поведение Давида и звучит естественнее буквального «первыми».
- source_word: דָרַשׁ
  choice: искал
  rationale: 'Сохраняет широту религиозного значения глагола: искать божество, обращаться к нему или вопрошать его, не сводя смысл только к поклонению.'
- source_word: לַבְּעָלִים
  choice: Ваалов
  rationale: Передаёт явно выраженное в еврейском тексте множественное число и не превращает его в единственное «Ваал».
theological_decisions:
- issue: Давид как образец при наличии его позднейших падений
  choice: прежними путями Давида
  alternative: первыми путями Давида
  rationale: Форма הָרִאשֹׁנִים грамматически относится к «путям» и ограничивает сопоставление более ранним образом жизни Давида, не утверждая, что всё его поведение было образцом.
translation_notes:
  register: Современный литературный русский язык с сохранением понятных библейских метафор «быть с», «ходить путями» и «искать» божество. Местоимение «тот» устраняет возможную синтаксическую тяжеловесность, не добавляя нового участника.
