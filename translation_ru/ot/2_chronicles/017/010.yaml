base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: ru
  text: И страх перед Яхве объял все царства стран, окружавших Иудею[a], и они не воевали с Иосафатом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ужас от Яхве», «ужас, наведённый Яхве». Еврейское выражение может означать страх перед Яхве или страх, посланный им; здесь, вероятно, имеется в виду наведённый Богом ужас, охвативший соседние царства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И объял
  rationale: Сочетание ויהי с отвлечённым существительным обозначает наступление состояния. Русское «объял» естественно передаёт охвативший царства страх.
- source_word: פַּחַד יְהוָה
  choice: страх перед Яхве
  rationale: פחד означает страх, ужас или трепет. Конструкция допускает как страх перед Яхве, так и ужас, посланный им; основной текст сохраняет прямую связь страха с Яхве, а примечание отмечает неоднозначность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: עַל
  choice: объял ... все царства
  rationale: Предлог указывает на тех, кого охватил страх; по-русски это естественно выражено объектом при глаголе «объял».
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: все царства земель
  rationale: Сохранены оба существительных еврейского выражения — «царства» и «земли», без сведения их к одному понятию.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: окружавших Иудею
  rationale: Причастный оборот кратко и естественно передаёт относительное придаточное с пространственным значением.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: и они не воевали с
  rationale: נלחם עם в данном военно-политическом контексте означает вести войну или воевать с кем-либо.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Использована укоренившаяся русская библейская форма имени.
theological_decisions:
- issue: Смысл выражения פַּחַד יְהוָה в данном контексте
  choice: «страх перед Яхве» с сохранением в примечании возможности понимать его как ужас, наведённый Яхве
  alternative: «ужас от Яхве» или «ужас, посланный Яхве»
  rationale: Военно-политический контекст указывает на сверхъестественно наведённый страх, который удержал соседние царства от войны. Однако конструкция допускает более одного генитивного отношения, поэтому перевод не устраняет эту напряжённость без пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. «Объял страх» сохраняет достоинство хроникального стиля, оставаясь понятным современному читателю.
