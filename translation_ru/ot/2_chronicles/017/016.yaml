  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: ru
  text: Под его началом был Амасия, сын Зихри, добровольно посвятивший себя Яхве[a]; с ним было двести тысяч доблестных воинов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добровольно вызвавшийся служить Яхве». Еврейское выражение может подчёркивать добровольное посвящение себя Яхве или добровольное служение Ему.'
    reason: Лексическая неоднозначность причастия הַמִּתְנַדֵּב и предлога ל.
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Под его началом был
  rationale: Оборот עַל יָד с местоименным суффиксом в перечне военачальников указывает на подчинённое положение или место в структуре командования. Русское «под его началом» ясно и естественно передаёт этот смысл.
- source_word: עֲמַסְיָה
  choice: Амасия
  rationale: Традиционно узнаваемая русская передача древнееврейского личного имени.
- source_word: בֶן זִכְרִי
  choice: сын Зихри
  rationale: Сохраняет прямое указание на родство, выраженное словом בֶן.
- source_word: הַמִּתְנַדֵּב
  choice: добровольно посвятивший себя
  rationale: Причастие породы хитпаэль от נדב обозначает добровольное действие и здесь может подразумевать личное самоотдающее посвящение; причастный оборот естественно характеризует Амасию.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל выражает направленность или предназначение посвящения, а личное имя יהוה передано как «Яхве».
- source_word: וְעִמּוֹ
  choice: с ним было
  rationale: Выражение вводит войско, находившееся при Амасии; связка добавлена для естественного русского синтаксиса.
- source_word: מָאתַיִם אֶלֶף
  choice: двести тысяч
  rationale: Прямая передача числительного.
- source_word: גִּבּוֹר חָיִל
  choice: доблестных воинов
  rationale: Устойчивое военное выражение обозначает сильных, способных и храбрых бойцов. «Доблестные воины» сохраняет возвышенный регистр и передаёт смысл естественным современным русским языком.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога — тетраграмматон יהוה. Форма «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Характер добровольного действия Амасии
  choice: добровольно посвятивший себя Яхве
  alternative: добровольно вызвавшийся служить Яхве; добровольно предложивший себя для служения Яхве
  rationale: Форма הַמִּתְנַדֵּב допускает оттенки добровольного посвящения и добровольного вступления в служение. Основной текст передаёт рефлексивную самоотдачу, а примечание сохраняет возможную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным летописно-военным регистром. Синтаксис сделан ясным для обычного читателя; военная и богословская лексика не привязана к конфессиональным формулировкам.
