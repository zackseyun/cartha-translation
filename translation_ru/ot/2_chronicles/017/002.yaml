base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: ru
  text: Он разместил войска во всех укреплённых городах Иудеи и поставил гарнизоны[a] в земле Иудеи и в городах Ефрема, которые захватил его отец Аса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наместников», «управляющих» или «военные посты». Еврейское נְצִיבִים может обозначать как назначенных должностных лиц, так и военные гарнизоны; здесь военный контекст говорит в пользу значения «гарнизоны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: разместил войска
  rationale: Глагол נָתַן буквально означает «дать, поместить», но в сочетании с חַיִל и указанием укреплённых городов естественно передаётся как размещение военных сил. חַיִל здесь имеет военное значение.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: во всех укреплённых городах Иудеи
  rationale: Передаёт множественное число и обычное военное значение причастия בְּצֻרוֹת — «укреплённые».
- source_word: נְצִיבִים
  choice: гарнизоны
  rationale: Слово может обозначать поставленных должностных лиц, наместников или военные посты. Военный контекст укреплённых и захваченных городов делает «гарнизоны» наиболее вероятным здесь, при этом неоднозначность отмечена в сноске.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иудеи
  rationale: Сохраняет территориальное значение אֶרֶץ и не усиливает предлог до «по всей земле», чего в еврейском тексте прямо нет.
- source_word: אֲשֶׁר לָכַד
  choice: которые захватил
  rationale: לָכַד обычно обозначает захват городов или территории; «захватил» точно передаёт военный контекст.
- source_word: אָסָא אָבִיו
  choice: его отец Аса
  rationale: Естественный современный русский порядок слов ясно указывает, что Аса был отцом Иосафата.
