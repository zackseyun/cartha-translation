  text: У него было много дел в городах Иудеи, а в Иерусалиме — воины, могучие и доблестные.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: много дел
  rationale: מְלָאכָה означает работу, дело или занятие; в данном контексте точный характер деятельности не назван. Перевод сохраняет эту неопределённость и не сужает смысл до «имущества» или «строительных работ».
- source_word: הָיָה לוֹ
  choice: велось у него
  rationale: Естественная русская передача еврейской конструкции обладания применительно к многочисленным делам; сохраняет связь деятельности с Иосафатом.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: воины
  rationale: Краткая и естественная передача буквального «люди войны».
- source_word: גִּבּוֹרֵי חַיִל
  choice: могучие и доблестные
  rationale: Сочетание обозначает сильных, испытанных и доблестных воинов; два согласованных определения передают обе смысловые стороны выражения без тяжеловесного повтора слова «воины».
