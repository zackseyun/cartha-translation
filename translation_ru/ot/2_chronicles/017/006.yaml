base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: ru
  text: Его сердце возвысилось на путях Яхве[a]; кроме того, он удалил из Иудеи высоты и ашеры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его сердце ободрилось (воспрянуло) на путях Яхве». Еврейское выражение может обозначать возвышенное или осмелевшее сердце; в данном контексте речь идёт не о высокомерии.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть культовые объекты, связанные с почитанием Ашеры; возможный перевод: «столбы Ашеры» или «священные столбы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: возвысилось его сердце
  rationale: Сохраняет еврейскую метафору возвышенного сердца и её положительный в данном контексте смысл — внутреннюю решимость и воодушевление, не сводя выражение ни к гордости, ни только к смелости.
- source_word: בְּדַרְכֵי יְהוָה
  choice: на путях Яхве
  rationale: Передаёт метафору образа жизни и поведения; предлог «на» естественен в русском библейском выражении «пути Господни», а личное имя יהוה транслитерировано как «Яхве».
- source_word: וְעוֹד
  choice: кроме того
  rationale: Ясно выражает добавление следующего деяния к уже сказанному.
- source_word: הֵסִיר
  choice: удалил
  rationale: 'Прямо передаёт каузативное значение: он устранил эти культовые объекты из Иудеи.'
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Традиционный и краткий русский термин для возвышенных культовых мест; буквальная образность исходного слова сохранена.
- source_word: הָאֲשֵׁרִים
  choice: ашеры
  rationale: Транслитерация множественного обозначения культовых объектов, связанных с почитанием Ашеры, сохраняет неопределённость их точного внешнего вида.
- source_word: מִיהוּדָה
  choice: из Иудеи
  rationale: Естественно передаёт удаление объектов с территории Иудеи.
theological_decisions:
- issue: Имеет ли возвышение сердца отрицательный смысл гордости или положительный смысл решимости
  choice: Сохранена метафора «возвысилось его сердце» с положительным контекстуальным оттенком.
  alternative: «Он ободрился / воспрянул духом на путях Яхве» либо отрицательное «его сердце возгордилось».
  rationale: Определение «на путях Яхве» и последующее устранение запрещённых культов представляют действие как похвальное, однако буквальная метафора оставлена, чтобы не устранять присущую идиоме смысловую напряжённость.
- issue: Насколько конкретно определять אֲשֵׁרִים
  choice: ашеры
  alternative: «столбы Ашеры», «священные столбы» или «священные деревья».
  rationale: Исходное слово обозначает культовые объекты, связанные с Ашерой, но не уточняет здесь их точную форму; транслитерация не навязывает спорную конкретизацию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому, но остаётся естественным; редкие культовые термины пояснены в сносках.
