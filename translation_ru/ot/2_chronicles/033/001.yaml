lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: было двенадцать лет
  rationale: Стандартная древнееврейская формула указания возраста естественно передаётся по-русски конструкцией «было двенадцать лет».
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Имя передано в принятой русской библейской форме; в данном предложении употреблён дательный падеж «Манассии».
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция указывает на возраст при вступлении на престол; этот вариант точен и естественен в современном русском языке.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: пятьдесят пять лет
  rationale: Сочинительное древнееврейское числительное передано обычной современной русской формой.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает пребывание у царской власти; «царствовал» кратко и точно соответствует контексту царской хроники.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог обозначает место, поэтому использована прямая и естественная передача.
