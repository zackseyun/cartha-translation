base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: ru
  text: 'Он построил жертвенники в доме Яхве[a], о котором Яхве сказал: «В Иерусалиме Моё имя будет вовеки»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме Яхве». Буквально: «в доме Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-еврейски: «Моё имя будет вовеки»; сравните распространённое библейское выражение: «Моё имя будет там вовеки».'
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: Он построил
  rationale: Форма Qal перфекта 3-го лица мужского рода единственного числа от בנה означает «построил». Союз וּ в русском повествовании можно не передавать отдельным «и», не утрачивая последовательности событий.
- source_word: מִזְבְּחוֹת
  choice: жертвенники
  rationale: Множественное число от מִזְבֵּחַ; прямое и общепонятное обозначение жертвенных алтарей.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: בַּיִת буквально означает «дом», а в данном контексте относится к храму. Формулировка сохраняет исходный библейский образ; значение поясняется в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: о котором Яхве сказал
  rationale: Относительное местоимение связывает последующее высказывание с «домом Яхве». Простое прошедшее время естественно по-русски и не добавляет к еврейской форме отдельного значения предпрошедшего времени.
- source_word: בִּירוּשָׁלִַם
  choice: В Иерусалиме
  rationale: Прямая передача предлога и топонима с сохранением вынесения обстоятельства в начало цитаты.
- source_word: יִהְיֶה שְּׁמִי
  choice: Моё имя будет
  rationale: Буквально передаёт формулировку масоретского текста, не добавляя отсутствующего здесь наречия «там».
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт идею непрекращающейся длительности и соответствует достоинству библейской речи, оставаясь понятным современному читателю.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон, поэтому личное имя передано транслитерацией «Яхве», а не заменено титулом.
- issue: Нужно ли дополнять выражение «Моё имя будет» словом «там»
  choice: Не добавлять «там» в основной текст
  alternative: «Моё имя будет там вовеки»
  rationale: В данном еврейском тексте слова שָׁם («там») нет. Сохранена необычная, но осмысленная формулировка источника; распространённая параллельная формула отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Дом Яхве» сохраняет образ оригинала, а «вовеки» придаёт фразе естественную торжественность. Все маркеры сносок присутствуют в основном тексте.
