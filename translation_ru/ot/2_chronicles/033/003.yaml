base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: ru
  text: Он восстановил высоты, которые разрушил его отец Езекия[a], поставил жертвенники Ваалам[b], сделал ашеры[c], поклонялся всему воинству небесному[d] и служил ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вернулся и построил»; сочетание двух еврейских глаголов означает, что он вновь устроил то, что прежде было разрушено.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит множественное число — «Ваалам»; вероятно, имеются в виду различные местные проявления, наименования или изображения Ваала.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «священные столбы Ашеры». Еврейское слово может обозначать культовые предметы или символы, связанные с богиней Ашерой.'
    reason: lexical_alternative
  - marker: d
    text: Здесь «воинство небесное» означает небесные светила, которым поклонялись; ср. 4 Царств 21:3.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: снова устроил
  rationale: Сочетание שׁוב + בנה выражает повторное сооружение или восстановление. «Снова устроил» естественно передаёт это значение и подходит к культовым местам.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Устоявшийся русский библейский термин для возвышенных культовых мест; сохраняет конкретный историко-религиозный смысл.
- source_word: נִתַּץ
  choice: разрушил
  rationale: Глагол означает сломать, снести или разрушить сооружение; выбран нейтральный и точный современный эквивалент.
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: его отец Езекия
  rationale: Естественный русский порядок слов, точно передающий родственную связь и имя.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: поставил жертвенники Ваалам
  rationale: Сохранено множественное число בְּעָלִים, которое может указывать на местные проявления, титулы или изображения Ваала; הקים передано глаголом «поставил».
- source_word: אֲשֵׁרוֹת
  choice: ашеры
  rationale: 'Транслитерация сохраняет неоднозначность: слово может обозначать культовые предметы или символы, связанные с богиней Ашерой, а не обязательно только деревянные столбы.'
- source_word: וַיִּשְׁתַּחוּ
  choice: поклонялся
  rationale: Глагол обозначает преклонение или простирание ниц; в культовом контексте «поклонялся» естественно передаёт и физическое действие, и его религиозный смысл.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: всему воинству небесному
  rationale: Сохранён традиционный образный оборот. В данном контексте он обозначает небесные светила как предметы поклонения, а не обязательно ангелов.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: служил ему
  rationale: עבד в культовом контексте означает религиозное служение. Местоимение единственного числа в русском согласовано с собирательным существительным «воинство», при том что в еврейском употреблено местоимение множественного числа.
theological_decisions:
- issue: Передача конкретных терминов языческого культа
  choice: Сохранить «высоты», «Ваалы» и «ашеры»
  alternative: Обобщить как «идольские святилища», «идолы» или «ложные боги»
  rationale: Еврейский текст перечисляет конкретные формы культа. Их сохранение не подменяет исторические детали богословским обобщением.
- issue: Значение выражения «воинство небесное»
  choice: Сохранить выражение и пояснить, что в контексте речь о небесных светилах
  alternative: Перевести как «звёзды» либо понять как ангельских существ
  rationale: Контекст запретного культа указывает на почитание небесных тел, однако образное выражение оригинала следует сохранить в основном тексте.
- issue: Соотношение глаголов поклонения и служения
  choice: 'Передать раздельно: «поклонялся… и служил»'
  alternative: Объединить в одно выражение «поклонялся»
  rationale: Раздельная передача сохраняет парность еврейских глаголов השתחוה и עבד и не сглаживает их смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с сохранением общеупотребительных библейских культовых терминов. Синтаксис сделан ясным и последовательным; редкое слово «ашеры» оставлено ради точности и снабжено пояснением.
