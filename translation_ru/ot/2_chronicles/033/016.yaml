source:
  edition: WLC
  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: ru
  text: Затем он восстановил жертвенник Яхве и принёс на нём мирные[a] и благодарственные жертвы. Он велел Иудее служить Яхве, Богу Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: восстановил
  rationale: В контексте очищения от идолопоклонства форма глагола כון означает приведение жертвенника в надлежащее состояние; «восстановил» передаёт это яснее, чем буквальные варианты «приготовил» или «утвердил».
- source_word: מִזְבַּח יְהוָה
  choice: жертвенник Яхве
  rationale: Естественная передача сопряжённой конструкции с сохранением личного имени Бога.
- source_word: וַיִּזְבַּח עָלָיו
  choice: и принёс на нём … жертвы
  rationale: Глагол זבח обозначает принесение жертвы; местоимение относится к жертвеннику.
- source_word: זִבְחֵי שְׁלָמִים
  choice: мирные жертвы
  rationale: Устоявшееся и достаточно прозрачное русское обозначение данной категории жертв; отдельное воспроизведение זִבְחֵי сделало бы выражение тяжеловесным.
- source_word: וְתוֹדָה
  choice: и благодарственные жертвы
  rationale: В данном жертвенном контексте תוֹדָה обозначает благодарение, выраженное жертвоприношением; явное слово «жертвы» устраняет возможное ложное понимание как одной лишь словесной благодарности.
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Он велел Иудее
  rationale: Хотя буквально сказано «сказал Иудее», последующий инфинитив выражает побуждение. «Велел» естественно передаёт его силу, а «Иудея» сохраняет собирательное обозначение народа исходного текста.
- source_word: לַעֲבוֹד
  choice: служить
  rationale: עבד применительно к Богу охватывает поклонение и верное служение; «служить» сохраняет более широкий смысл, не сводя его только к обрядовому поклонению.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции, сохраняющая заветное наименование.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя Бога. «Яхве» сохраняет различие между именем и титулом, не подменяя его словом «Господь».
- issue: Значение עבד применительно к Богу
  choice: служить
  alternative: поклоняться
  rationale: «Служить» сохраняет одновременно культовый и более широкий заветный смысл глагола, тогда как «поклоняться» может неоправданно сузить его.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексикой («жертвенник», «жертвы»). Синтаксис упрощён без потери содержания; собирательное «Иудея» сохранено как в еврейском тексте.
