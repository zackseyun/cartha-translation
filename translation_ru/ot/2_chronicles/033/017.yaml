  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: ru
  text: Однако народ всё ещё приносил жертвы на высотах, но только Яхве, своему Богу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: Однако
  rationale: Передаёт противительный и уступительный переход к сохранявшемуся недостатку после описанных преобразований.
- source_word: עוֹד
  choice: всё ещё
  rationale: Выражает продолжение прежней практики вопреки проведённым преобразованиям.
- source_word: הָעָם
  choice: народ
  rationale: Естественное собирательное обозначение народа в повествовательном контексте.
- source_word: זֹבְחִים
  choice: приносил жертвы
  rationale: Причастная форма описывает продолжавшуюся практику; по-русски сочетание «народ приносил» естественно передаёт её длительный характер.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: Традиционный и точный библейский термин для местных культовых мест; предлог «на» соответствует русскому употреблению.
- source_word: רַק
  choice: но только
  rationale: Ограничение относится к тому, кому приносились жертвы, а не к месту; «но» подчёркивает корректирующий оттенок.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה; форма дательного падежа обозначает получателя жертв.
- source_word: אֱלֹהֵיהֶם
  choice: своему Богу
  rationale: Возвратное притяжательное местоимение естественно соотносит Бога с подлежащим «народ» и передаёт еврейский суффикс третьего лица множественного числа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: Текст прямо содержит тетраграмматон; транслитерация сохраняет личное заветное имя без подмены титулом.
- issue: Смысл ограничения רַק в высказывании о высотах
  choice: Народ продолжал приносить жертвы на высотах, но адресовал их только Яхве
  alternative: Народ приносил жертвы только на высотах, посвящённых Яхве
  rationale: 'По синтаксису ограничительная частица относится к дополнению «Яхве, своему Богу», а не к месту. Тем самым сохраняется напряжение текста: использование высот продолжалось, хотя жертвы не предназначались иным богам.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка ясна широкому читателю; богословское напряжение между продолжением культа на высотах и исключительной обращённостью жертв к Яхве сохранено.
