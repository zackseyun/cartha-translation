  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, как и его отец Манассия. Амон приносил жертвы всем резным изображениям[a], которые сделал его отец Манассия, и служил им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идолам». Еврейское слово конкретно обозначает вырезанные или высеченные изображения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклонялся им». Еврейский глагол буквально означает «служить» и часто употребляется применительно к религиозному служению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Еврейское сочетание עשה + הרע означает «делать зло». Несовершенный вид естественно передаёт характеристику поведения Амона в данном повествовательном контексте.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образный еврейский оборот, выражающий оценку поступков Богом; в современном русском он понятен и уместен в библейском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией тетраграмматона, а не заменено титулом.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: как делал и
  rationale: Формулировка передаёт прямое сопоставление поведения Амона с поведением его отца; частица «и» естественно подчёркивает повторение его примера.
- source_word: מְנַשֶּׁה אָבִיו
  choice: его отец Манассия
  rationale: Такой порядок слов естественен для современного русского и точно обозначает родство.
- source_word: הַפְּסִילִים
  choice: изваяниям
  rationale: Слово обозначает изготовленные посредством резьбы или высекания культовые изображения. «Изваяния» сохраняет конкретный образ, не сводя значение к более общему слову «идолы».
- source_word: אֲשֶׁר עָשָׂה
  choice: которые сделал
  rationale: 'Простая форма прошедшего времени ясна в русском: из контекста однозначно следует, что Манассия изготовил изображения раньше действий Амона.'
- source_word: זִבַּח
  choice: приносил жертвы
  rationale: В культовом контексте глагол означает совершение жертвоприношений; русский оборот ясно и естественно передаёт это значение.
- source_word: וַיַּעַבְדֵם
  choice: и служил им
  rationale: Сохранено основное значение глагола עבד. В контексте культовых изображений служение подразумевает поклонение, но перевод не устраняет более широкую смысловую окраску.
- source_word: אָמֹון
  choice: Амон
  rationale: Имя передано в традиционной русской библейской форме.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Значение עבד в контексте идолопоклонства
  choice: служил им
  alternative: поклонялся им
  rationale: «Служил» непосредственно передаёт основное значение еврейского глагола, тогда как религиозный характер служения ясно определяется контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся простым и доступным; конкретная культовая лексика и различие между служением и поклонением сохранены.
