base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: ru
  text: И почил Манассия с отцами своими, и похоронили его в его доме[a]. Вместо него воцарился его сын Амон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своём дворце»; еврейское слово буквально означает «в его доме», но применительно к царю может обозначать дворец или дворцовый комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил с отцами своими
  rationale: Устойчивая русская библейская формула сохраняет древнееврейский образ сна как обозначение смерти и не сводит выражение к простому «умер».
- source_word: וַיִּקְבְּרֻהוּ
  choice: похоронили его
  rationale: Активная форма множественного числа с объектным суффиксом передана прямо, без замены страдательной конструкцией.
- source_word: בֵּיתוֹ
  choice: в его доме
  rationale: Сохраняется основное значение בַּיִת; в царском контексте слово может обозначать дворец или дворцовый комплекс, что отмечено в сноске.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол обозначает вступление следующего царя на престол; «воцарился» естественно и лаконично передаёт это значение.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Точно передаёт значение преемства — занятие места предшественника — и сохраняет порядок смысловых элементов исходного текста.
