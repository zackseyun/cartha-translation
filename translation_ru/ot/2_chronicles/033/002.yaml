  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, следуя мерзостным обычаям народов, которых Яхве изгнал перед израильтянами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Сочетание עשה с субстантивированным הָרַע означает «делать зло». Несовершенный вид по-русски естественно передаёт характеристику продолжительного образа действий в данном повествовательном контексте.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образный древнееврейский оборот со значением оценки с точки зрения Яхве; по-русски он понятен и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: כְּתוֹעֲבוֹת הַגּוֹיִם
  choice: следуя мерзостным обычаям народов
  rationale: כְּ выражает уподобление или соответствие. תּוֹעֵבוֹת обозначает отвратительные для Бога практики, здесь прежде всего религиозные; «мерзостные обычаи» сохраняет сильную оценку и яснее раскрывает, что Манассия подражал действиям народов, а не абстрактным «мерзостям».
- source_word: הוֹרִישׁ
  choice: изгнал
  rationale: В породе hифиль ירשׁ здесь означает лишить владения и удалить прежних жителей земли; «изгнал» кратко и точно передаёт контекст.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: перед израильтянами
  rationale: מִפְּנֵי после глагола изгнания указывает, что народы были удалены с пути или из присутствия Израиля. «Израильтяне» естественно передаёт коллективное значение буквального «сыновья Израиля» в современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте дважды стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл כְּתוֹעֲבוֹת
  choice: следуя мерзостным обычаям
  alternative: подобно мерзостям
  rationale: Контекст говорит о подражании осуждаемым религиозным и нравственным практикам народов. Выбранная формулировка передаёт это без конкретизации отдельных обрядов, не названных в стихе.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: израильтянами
  alternative: сынами Израиля
  rationale: Выражение является обычным коллективным обозначением народа Израиля и включает весь народ, а не только мужчин; современный этноним точно передаёт референт и избегает неестественной буквальности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён метафорический оборот «в глазах Яхве», но буквальное «мерзости народов» раскрыто как «мерзостные обычаи народов» ради ясности. Синтаксис краткий и пригодный для публичного чтения.
