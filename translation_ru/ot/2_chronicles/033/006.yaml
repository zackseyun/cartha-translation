  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: ru
  text: Он провёл своих сыновей через огонь в долине сына Еннома[a], занимался предсказаниями, гаданием и колдовством и имел дело с медиумами и вызывателями духов[b]. Он творил много зла в глазах Яхве, вызывая Его гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с явным раскрытием смысла обряда: «принёс своих сыновей в жертву в огне». Буквально по-древнееврейски: «провёл своих сыновей через огонь».'
    reason: lexical_alternative
  - marker: b
    text: Так переданы древнееврейские обозначения людей или практик, связанных с обращением к умершим и духам.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: провёл своих сыновей через огонь
  rationale: Сохранена буквальная форма устойчивого древнееврейского выражения, подразумевающего обряд принесения детей в жертву, без устранения присущей исходному тексту косвенности.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: в долине сына Еннома
  rationale: Передано значение топонима при сохранении имени Енном в принятой русской форме.
- source_word: וְעוֹנֵן וְנִחֵשׁ וְכִשֵּׁף
  choice: занимался предсказаниями, гаданием и колдовством
  rationale: Три координированных глагола переданы различными русскими обозначениями оккультных практик; различие сохранено без чрезмерно узкой конкретизации спорных способов гадания.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: имел дело с вызывателями мёртвых и заклинателями духов
  rationale: Широкая формулировка отражает вовлечённость в некромантические практики, не решая неопределённость между обращением к таким людям, их содержанием при дворе или личным совершением практик.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: творил много зла
  rationale: Естественная русская конструкция передаёт усилительное значение רבה с инфинитивом и сохраняет торжественный повествовательный регистр.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена древнееврейская оценочная идиома и личное имя Бога.
- source_word: לְהַכְעִיסוֹ
  choice: вызывая Его гнев
  rationale: Деепричастная конструкция естественно передаёт целевое или результативное значение инфинитива, не сводя его только к одному из них.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Явно ли называть проведение сыновей через огонь жертвоприношением
  choice: Сохранить в основном тексте выражение «провёл своих сыновей через огонь»
  alternative: принёс своих сыновей в огненную жертву
  rationale: Контекст и устойчивая формула убедительно указывают на жертвенный обряд, однако сам древнееврейский текст выражает это идиоматически; буквальная образность сохраняет его форму и напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным, но сохранены ключевые древнееврейские образы «через огонь» и «в глазах Яхве». Термины оккультных практик различены настолько, насколько это позволяет русский язык, без навязывания узкой классификации.
