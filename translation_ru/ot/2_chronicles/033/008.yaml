  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: ru
  text: 'И Я больше не удалю Израиль[a] с земли, которую Я предназначил вашим отцам, — если только они будут тщательно исполнять всё, что Я повелел им: весь Закон, постановления и судебные решения, переданные через Моисея[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стопу Израиля»; это образное выражение означает пребывание Израиля на земле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Моисея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: больше не удалю
  rationale: Отрицание глагола יסף с инфинитивом выражает прекращение или неповторение действия; этот вариант естественно передаёт смысл «не стану впредь удалять».
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: стопу Израиля
  rationale: Сохранён конкретный образ еврейского текста; в данном контексте он обозначает присутствие Израиля на земле. Значение пояснено в сноске.
- source_word: מֵעַל הָאֲדָמָה
  choice: с земли
  rationale: Русское сочетание естественно передаёт удаление с поверхности или территории; «земля» соответствует контексту пребывания Израиля в обещанной земле.
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: которую Я предназначил вашим отцам
  rationale: Каузативная форма עמד здесь указывает на установленное Богом место или назначение земли предкам. «Предназначил» сохраняет идею Божьего определения без неестественного буквализма.
- source_word: רַק אִם
  choice: если только
  rationale: Передаёт ограничительное условие, от которого в стихе прямо зависит дальнейшее пребывание Израиля на земле.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: будут тщательно исполнять
  rationale: Конструкция означает внимательное соблюдение на деле, а не просто хранение или знание заповеди.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: всё, что Я повелел им
  rationale: Сохраняет полноту требования и местоименный суффикс «им».
- source_word: לְכָל הַתּוֹרָה
  choice: согласно всему Закону
  rationale: В сочетании с постановлениями и судебными установлениями תורה имеет юридико-заветный смысл; предлог ל передан как соответствие норме.
- source_word: הַחֻקִּים
  choice: постановлениям
  rationale: Общеупотребительный современный эквивалент для установленных предписаний, отличимый от соседнего юридического термина.
- source_word: הַמִּשְׁפָּטִים
  choice: судебным установлениям
  rationale: Передаёт правовой и судебный оттенок מִשְׁפָּטִים яснее, чем многозначное русское «суды».
- source_word: בְּיַד מֹשֶׁה
  choice: данным через Моисея
  rationale: Еврейская идиома буквально говорит «рукой Моисея» и обозначает его посредничество; в основном тексте смысл выражен естественно, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Условность дальнейшего пребывания Израиля на земле
  choice: Обещание не удалять Израиль с земли прямо связано с условием тщательного исполнения Божьих повелений.
  alternative: Безусловная гарантия вечного владения землёй либо лишь риторическое, нереальное условие.
  rationale: רַק אִם вводит подлинное ограничительное условие. Перевод сохраняет эту обусловленность, не делая более широких догматических выводов о завете.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Конкретный образ «стопа Израиля» сохранён, а непрозрачная для современного читателя идиома «рукой Моисея» раскрыта как посредничество. Перечень правовых терминов передан раздельно, без их смыслового слияния.
