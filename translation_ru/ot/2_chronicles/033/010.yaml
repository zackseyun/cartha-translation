  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. Имя «Манассия» и дательный падеж «Манассии» нормативны. «Не внимали» удачно выражает хифиль קשב — внимательное слушание, подразумевающее отклик, не превращая глагол в более сильное «не повиновались».
