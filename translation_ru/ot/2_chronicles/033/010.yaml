  source_fidelity: 'Текст точно передаёт еврейский оригинал: וַיְדַבֵּר уместно передано формой «говорил», адресаты сохранены как «Манассии и его народу», а множественное «они» обоснованно оставляет открытым, относятся ли не внявшие к обоим адресатам вместе или прежде всего к народу. Противительный союз «но» естественно передаёт контекстуальный контраст в וְלֹא.'
