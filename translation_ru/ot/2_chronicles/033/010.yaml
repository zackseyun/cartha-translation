  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: ru
  text: И говорил Яхве Манассии и его народу, но они не внимали[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не слушали», «не обращали внимания». Еврейский глагол означает внимательное слушание, предполагающее соответствующий отклик.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Форма wayyiqtol от דבר в пиэле означает «говорить, обращаться». Несовершенный вид по-русски естественно передаёт подразумеваемые из контекста увещевания, не добавляя их содержания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־מְנַשֶּׁה וְאֶל־עַמּוֹ
  choice: Манассии и его народу
  rationale: Предлог אֶל при глаголе речи обозначает адресатов. עַמּוֹ буквально означает «его народ» и, вероятнее всего, указывает на народ, которым правил Манассия.
- source_word: וְלֹא
  choice: но не
  rationale: 'Хотя וְ формально может передаваться союзом «и», здесь связь противопоставительная: Яхве обращался к ним, однако должного отклика не последовало.'
- source_word: הִקְשִׁיבוּ
  choice: они не внимали
  rationale: קשב в хифиле означает внимательное слушание с подразумеваемым откликом. «Не внимали» сохраняет этот смысл лучше, чем нейтральное «не слушали», и остаётся понятным в литературном русском.
theological_decisions:
- issue: К кому относится множественное число הִקְשִׁיבוּ
  choice: 'К Манассии и его народу вместе: «они не внимали»'
  alternative: Только к народу, тогда как Манассия назван отдельно лишь как адресат
  rationale: Два соединённых адресата — Манассия и его народ — непосредственно предшествуют глаголу во множественном числе. Русское местоимение «они» сохраняет наиболее прямое прочтение, не вводя лишнего уточнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Внимали» выбрано ради смысловой точности; архаические синтаксические обороты исключены.
