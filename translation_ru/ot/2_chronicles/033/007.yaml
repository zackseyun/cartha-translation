base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: ru
  text: 'Он поставил в доме Бога изваяние идола[a], которое он сделал. Об этом доме Бог сказал Давиду и его сыну Соломону: «В этом доме и в Иерусалиме, который Я избрал из всех колен Израиля, Я положу Своё имя навеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изваяние, идола»; в еврейском тексте употреблены два близких по смыслу обозначения идольской статуи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Он поставил
  rationale: Глагол שׂים обозначает помещение или установку предмета; «поставил» естественно передаёт установку культового изваяния.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: изваяние, идола
  rationale: 'Аппозитивная конструкция сохраняет оба близких еврейских существительных: פֶּסֶל указывает на изготовленное изваяние, а סֶמֶל в данном контексте — на идола. Возможная генитивная связь отмечена в сноске.'
- source_word: אֲשֶׁר עָשָׂה
  choice: которого сделал
  rationale: Относительное придаточное прямо передаёт еврейскую конструкцию; согласование с ближайшим приложением «идола» естественно по-русски.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: в доме Бога
  rationale: Сохранён образ «дома», а не заменён толкованием «храм», поскольку тот же образ повторяется в Божьих словах.
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: о котором Бог сказал
  rationale: Относительное местоимение соотнесено с домом Бога и вводит последующее высказывание.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: Давиду и его сыну Соломону
  rationale: Сохранены оба адресата и указание на родство; русский порядок слов делает связь «его сыну» с Давидом ясной.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלַם
  choice: В этом доме и в Иерусалиме
  rationale: Сохранены повтор слова «дом» и параллельное обозначение дома и города.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: который Я избрал из всех колен Израиля
  rationale: Мужской род относительного местоимения соотносит придаточное с Иерусалимом; מן естественно передано предлогом «из».
- source_word: אָשִׂים אֶת שְׁמִי
  choice: Я помещу Моё имя
  rationale: Сохранена конкретная библейская идиома помещения Божьего имени без разъясняющей богословской парафразы.
- source_word: לְעֵילֹום
  choice: навеки
  rationale: Краткий, современный и торжественный эквивалент временного выражения לעולם.
theological_decisions:
- issue: Божественное именование
  choice: Бог
  alternative: Господь
  rationale: В масоретском тексте стоит אֱלֹהִים, а не יהוה, поэтому заветное имя не вводится.
- issue: Идиома храмового богословия
  choice: Я помещу Моё имя навеки
  alternative: Я утвержу там Моё имя навеки / Я сделаю так, чтобы Моё имя обитало там навеки
  rationale: Перевод сохраняет формулировку о помещении имени и не разрешает заложенное в ней богословское содержание посредством толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Дом Бога» и «помещу Моё имя» намеренно сохраняют ключевые образы оригинала; прописные местоимения в прямой речи следуют принятой русской библейской издательской традиции.
