base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: ru
  text: Его молитва и то, как он был услышан, все его грехи и его неверность, а также места, где он соорудил святилища на высотах, поставил ашеры[a] и резные изображения, прежде чем смирился, — всё это записано в записях прозорливцев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столбы Ашеры». Еврейское слово может обозначать культовые предметы, связанные с богиней Ашерой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в записях Хозая». Последнее еврейское слово можно понимать как имя собственное, а не как обозначение прозорливцев.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: его молитва
  rationale: Прямой и естественный перевод существительного תְּפִלָּה; контекст не требует сужать значение до «мольбы».
- source_word: הֵעָתֶר לוֹ
  choice: то, как он был услышан
  rationale: Форма от עתר обозначает благоприятный ответ на молитву. Пассивная конструкция сохраняет невыраженность действующего лица и ясно передаёт смысл по-русски.
- source_word: כָל חַטָּאתוֹ
  choice: все его грехи
  rationale: Еврейское единственное число имеет собирательное значение; русский множественный вариант естественнее после «все» и передаёт совокупность проступков.
- source_word: מַעְלוֹ
  choice: его неверность
  rationale: מעל выражает вероломство или нарушение верности, часто с религиозно-заветным оттенком; «неверность» сохраняет этот смысл без излишней терминологичности.
- source_word: בָּמוֹת
  choice: святилища на высотах
  rationale: Так передаётся культовый характер במות; одно слово «высоты» для современного читателя было бы менее понятно.
- source_word: הֶעֱמִיד
  choice: поставил
  rationale: Естественно передаёт установку культовых предметов и сохраняет конкретный пространственный смысл глагола.
- source_word: הָאֲשֵׁרִים
  choice: ашеры
  rationale: Транслитерация не предрешает точный вид культовых предметов, связанных с Ашерой; возможное толкование вынесено в сноску.
- source_word: הַפְּסִלִים
  choice: резные изображения
  rationale: Передаёт конкретное значение פסילים как вырезанных культовых изображений, не заменяя его более функциональным словом «идолы».
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: прежде чем смирился
  rationale: Сохраняет временное отношение и естественное возвратно-непереходное значение формы, не превращая её в страдательное «был смирён».
- source_word: הִנָּם כְּתוּבִים
  choice: всё это записано
  rationale: Русская конструкция естественно передаёт указательно-представительное הִנָּם и значение כְּתוּבִים; отдельное «вот» здесь утяжеляло бы длинное предложение.
- source_word: עַל דִּבְרֵי חוֹזָי
  choice: в записях прозорливцев
  rationale: Передаёт основное контекстуальное понимание заключительной фразы как ссылки на письменный источник; неоднозначность формы חוֹזָי отмечена в сноске.
theological_decisions:
- issue: Характер смирения Манассии в הִכָּנְעוֹ
  choice: прежде чем смирился
  alternative: прежде чем был смирён
  rationale: Еврейская форма естественно допускает возвратно-непереходное понимание и согласуется с повествовательным акцентом на поступке Манассии, не добавляя к тексту развёрнутого учения о покаянии.
- issue: Неявный субъект ответа на молитву в הֵעָתֶר לוֹ
  choice: он был услышан
  alternative: Бог ответил ему
  rationale: По контексту ответ исходит от Бога, однако в данной фразе субъект прямо не назван; пассивная формулировка сохраняет эту особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Длинное перечисление исходного текста сохранено, но организовано союзами и тире для ясности. Термин «ашеры» оставлен без конкретизации в основном тексте, а культовое значение במות раскрыто как «святилища на высотах».
