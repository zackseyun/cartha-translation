source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֣י מְנַשֶּׁה֮ וּ/תְפִלָּת֣/וֹ אֶל אֱלֹהָי/ו֒ וְ/דִבְרֵי֙ הַֽ/חֹזִ֔ים הַֽ/מְדַבְּרִ֣ים אֵלָ֔י/ו בְּ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל הִנָּ֕/ם עַל דִּבְרֵ֖י מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: ru
  text: Остальные деяния Манассии, его молитва к своему Богу и слова провидцев, говоривших ему от имени Яхве, Бога Израиля, — вот, они записаны в летописи царей Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «в книге царей Израиля» или «в записях о царях Израиля». Еврейская формула указывает на письменный царский источник.'
    reason: Лексическая альтернатива в передаче названия или описания цитируемого источника.
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: остальные деяния Манассии
  rationale: В царской итоговой формуле דִּבְרֵי обозначает не только слова, но дела и события правления; «остальные деяния» естественно передаёт этот историографический смысл.
- source_word: וּתְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: его молитва к своему Богу
  rationale: Сохранены принадлежность молитвы Манассии, направление молитвы, выраженное אֶל, и местоименная связь в «его Богу»; по-русски «к своему Богу» яснее соотносит Бога с Манассией.
- source_word: הַחֹזִים
  choice: провидцев
  rationale: חֹזִים — особое обозначение людей, получающих видения; «провидцы» сохраняет отличие от более общего «пророки» и звучит достойно в современном русском тексте.
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: говоривших ему
  rationale: Причастный оборот прямо передаёт определительное причастие и его адресата.
- source_word: בְּשֵׁם יְהוָה
  choice: от имени Яхве
  rationale: Оборот передаёт как прямое значение формулы, так и полномочие, с которым выступали провидцы; личное имя יְהוָה транслитерировано как «Яхве».
- source_word: הִנָּם
  choice: вот, они
  rationale: Сохранена указательная и привлекающая внимание сила частицы; местоимение во множественном числе соотнесено с перечисленными сведениями.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: записаны в летописи царей Израиля
  rationale: Цитатная формула указывает на письменный царский источник. «Летопись» естественно передаёт характер документа, а «записаны» эксплицирует подразумеваемую письменную фиксацию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Название источника как «летопись царей Израиля»
  choice: сохранить «Израиля»
  alternative: царей Иудеи
  rationale: Хотя Манассия был царём Иудеи, масоретский текст прямо говорит о царях Израиля; перевод не гармонизирует это чтение.
- issue: Отношение Манассии к Богу в אֱלֹהָיו
  choice: к своему Богу
  alternative: к Богу
  rationale: Местоименный суффикс сохранён без дальнейшего богословского уточнения характера этого отношения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис следует перечислению оригинала, но остаётся понятным; слово «вот» намеренно сохраняет акцент הִנָּם. Маркер сноски поставлен непосредственно после спорного обозначения письменного источника.
