  text: Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.
translation:
  language: ru
  text: Амону было двадцать два года, когда он стал царём, и он царствовал в Иерусалиме два года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: Амону было двадцать два года
  rationale: Еврейская идиома возраста буквально означает «сын двадцати двух лет»; по-русски возраст естественно выражается конструкцией «было двадцать два года».
- source_word: אָמ֣וֹן
  choice: Амон
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Предлог ב с инфинитивом от מלך обозначает время вступления на царство; эта формулировка естественно и точно передаёт смысл.
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: два года
  rationale: Сочетание числительного с существительным указывает на продолжительность царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: В данном контексте глагол מלך означает осуществление царской власти в течение указанного срока.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог с географическим названием указывает на место и столицу царствования.
