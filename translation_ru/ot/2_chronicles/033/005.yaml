  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: ru
  text: Он построил жертвенники всему воинству небесному[a] в обоих дворах дома Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть небесным светилам или силам, которым поклонялись в астральных культах.
    reason: Поясняет культовое значение многозначного еврейского выражения צבא השמים, не сужая его в основном тексте.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он построил
  rationale: Форма wayyiqtol от בנה продолжает повествование о прошлом действии Манассии. В современном русском естественно употребить простое прошедшее время, не передавая союз ו механически.
- source_word: מִזְבְּחוֹת
  choice: жертвенники
  rationale: Множественное число от מזבח — обычного обозначения жертвенника для жертвоприношений или воскурений.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: всему воинству небесному
  rationale: Выражение צבא השמים может обозначать небесные светила или небесные силы как объекты астрального культа. Традиционное библейское выражение «воинство небесное» сохраняет образность и смысловую широту оригинала; дательный падеж естественно передаёт посвящение жертвенников этим объектам почитания.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: в обоих дворах
  rationale: Числительное указывает именно на два храмовых двора. «В обоих дворах» естественно по-русски и сохраняет определённость выражения.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: בית буквально значит «дом», а в данном контексте обозначает храм. Сохранено исходное выражение «дом Яхве» без поясняющей замены словом «храм»; имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон יהוה. Форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Значение צְבָא הַשָּׁמַיִם
  choice: воинство небесное
  alternative: небесные светила
  rationale: Более конкретное «небесные светила» ясно указывало бы на астральный культ, но сузило бы выражение, которое способно охватывать небесные тела и мыслимые небесные силы. Основной текст сохраняет эту неоднозначность, а примечание поясняет контекст.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Формулировка лаконична и пригодна для публичного чтения; синтаксис естественный, а выражения «воинство небесное» и «дом Яхве» сохраняют образность оригинала.
