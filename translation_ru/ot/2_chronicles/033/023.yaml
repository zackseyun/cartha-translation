source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: ru
  text: Но он не смирился перед Яхве, как смирился его отец Манассия[a], ибо он, Амон, умножил свою вину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как его отец Манассия смирился перед Яхве».'
    reason: Сочетание «перед Яхве», поставленное при первом глаголе, по смыслу может также относиться ко второму глаголу в сравнении.
lexical_decisions:
- source_word: נִכְנַע
  choice: не смирился
  rationale: Форма нифаль от כנע здесь передаёт добровольное смирение или покорность перед Богом. «Не смирился» естественно звучит по-русски и сохраняет связь с покаянием Манассии.
- source_word: מִלִּפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Предложное сочетание означает «перед, в присутствии». Личное имя יְהוָה передано как «Яхве».
- source_word: כְּהִכָּנַע
  choice: как смирился
  rationale: Сравнительная частица с инфинитивом образует прямое сопоставление поведения Амона со смирением Манассии; повтор глагола сохраняет риторический контраст.
- source_word: מְנַשֶּׁה אָבִיו
  choice: его отец Манассия
  rationale: Такой порядок слов естественен для современного русского языка и ясно указывает на родство.
- source_word: כִּי
  choice: напротив
  rationale: 'В данном контексте частица вводит противопоставленную характеристику Амона: вместо смирения он увеличивал свою вину. «Напротив» ясно выражает контекстуальную связь, не превращая её в причинное утверждение.'
- source_word: הוּא אָמוֹן
  choice: он, Амон
  rationale: Сочетание местоимения с именем имеет подчёркивающую силу; приложение в русском сохраняет акцент на самом Амоне.
- source_word: הִרְבָּה אַשְׁמָה
  choice: умножал свою вину
  rationale: Глагол רבה в хифиле означает увеличение или умножение, а אַשְׁמָה здесь обозначает виновность, не жертву за вину. Притяжательное «свою» естественно по-русски и делает смысл сочетания ясным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное covenantное имя Бога; транслитерация «Яхве» передаёт его как имя и не заменяет титулом.
- issue: Подразумевается ли «перед Яхве» при смирении Манассии
  choice: В основном тексте не повторять, но отметить возможное подразумеваемое дополнение
  alternative: «как его отец Манассия смирился перед Яхве»
  rationale: Еврейский текст прямо ставит מִלִּפְנֵי יְהוָה при первом глаголе, однако по смыслу эта фраза может распространяться и на вторую часть сравнения. Сноска сохраняет синтаксическую неоднозначность.
- issue: Связь, выраженная כִּי
  choice: напротив
  alternative: ибо; ведь
  rationale: Частица может иметь объяснительный оттенок, но содержание следующей фразы прежде всего контрастирует смирение Манассии с ростом вины Амона. Перевод «напротив» естественно передаёт этот дискурсивный поворот.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Сохранены повтор «смирился», эмфатическое «он, Амон» и образ умножения вины; архаизмы и конфессионально окрашенные формулы исключены.
