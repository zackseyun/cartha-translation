base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: ru
  text: Когда он оказался в беде, то искал благоволения Яхве, своего Бога[a], и глубоко смирился перед Богом своих отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умолял Яхве, своего Бога» или «упрашивал Яхве, своего Бога». Древнееврейский оборот означает искать чьего-либо благоволения, обращаясь с настойчивой просьбой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед Богом своих предков». В древнееврейском тексте буквально: «своих отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: Когда он оказался в беде
  rationale: 'Оборот описывает обстоятельство и время: Манассия оказался в тяжёлом, стеснённом положении. «В беде» естественно передаёт смысл, не уточняя сверх текста характер его страданий.'
- source_word: חִלָּה אֶת־פְּנֵי
  choice: стал искать благоволения
  rationale: Устойчивый древнееврейский оборот означает настойчиво просить, умолять или добиваться благосклонности. Выбранный вариант сохраняет образ благоволения и при этом понятен современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Местоименный суффикс выражает принадлежность; возвратное «своего» естественно по-русски соотносится с подлежащим.
- source_word: וַיִּכָּנַע מְאֹד
  choice: и глубоко смирился
  rationale: 'Форма глагола в данном контексте допускает возвратное понимание: Манассия сам смирился. Наречие «глубоко» естественно передаёт сильную степень, выраженную מְאֹד.'
- source_word: מִלִּפְנֵי
  choice: перед
  rationale: Идиоматическое значение выражения — «перед, в присутствии»; буквальное воспроизведение слова «лицо» здесь было бы неестественным.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Богом своих отцов
  rationale: Сохранена обычная для Писания историко-родовая формула и мужская форма исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» непосредственно передаёт это имя, не подменяя его титулом.
- issue: Значение חִלָּה אֶת־פְּנֵי
  choice: стал искать благоволения
  alternative: стал умолять; стал упрашивать
  rationale: Основной текст сохраняет идею обращения за благосклонностью, а примечание отмечает более эмоционально выраженные допустимые варианты, не решая за читателя степень интенсивности.
- issue: Родовая формула אֱלֹהֵי אֲבֹתָיו
  choice: Богом своих отцов
  alternative: Богом своих предков
  rationale: «Отцов» точнее сохраняет грамматическую форму и традиционную формулу оригинала; «предков» возможно как более широкая передача.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и естественным; личное имя «Яхве» и формула «Бог своих отцов» сохранены. Подлинная смысловая широта идиомы חִלָּה אֶת־פְּנֵי отражена в примечании.
