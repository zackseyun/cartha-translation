  text: Его слуги устроили заговор против него и убили его в его доме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: составили против него заговор
  rationale: Сочетание קשר על обозначает заговор против человека, особенно в повествованиях о цареубийстве. Русское выражение передаёт политический и враждебный характер действия.
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: В придворном контексте עבד может обозначать царских слуг или должностных лиц. «Слуги» прямо передаёт исходное слово, не уточняя без достаточных оснований их ранг или правовой статус.
- source_word: וַיְמִיתֻהוּ
  choice: умертвили его
  rationale: Форма хифиль от מות имеет каузативное значение — «причинить смерть». «Умертвили» сохраняет эту силу и торжественно-повествовательный регистр.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: 'Предлог בְּ указывает на место действия, а местоименный суффикс — на принадлежность дома ему. Добавление «собственном» не требуется: оно усилило бы оттенок, который в еврейском тексте выражен лишь обычным притяжательным суффиксом.'
