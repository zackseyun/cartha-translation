  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: ru
  text: Он удалил из дома Яхве чужих богов и идола[a], а также все жертвенники, которые он построил на горе дома Яхве[b] и в Иерусалиме, и выбросил их за город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изображение». Еврейское слово סֶמֶל может обозначать идола или культовое изображение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на горе дома Яхве»; возможно: «на холме дома Яхве». Речь идёт о Храмовой горе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Он удалил
  rationale: Порода хифиль глагола סור означает устранить или убрать что-либо; «удалил» точно и естественно передаёт действие в контексте религиозной реформы.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: чужих богов
  rationale: Сочетание обозначает иноземных, не принадлежащих к почитанию Яхве богов; «чужие боги» — устойчивое и понятное русское соответствие.
- source_word: הַסֶּמֶל
  choice: идола
  rationale: Слово סֶמֶל обозначает культовое изображение или идола; контекст требует явно религиозного смысла, при этом вариант «изображение» отмечен в сноске.
- source_word: מִבֵּית יְהוָה
  choice: из дома Яхве
  rationale: Сохранён образный и традиционный для еврейского текста оборот «дом Яхве», обозначающий храм, без замены его интерпретирующим словом «храм».
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: а также все жертвенники
  rationale: «Жертвенники» прямо соответствует форме множественного числа; «а также» естественно связывает перечисляемые объекты удаления.
- source_word: אֲשֶׁר בָּנָה
  choice: которые построил
  rationale: Относительное предложение передано без добавления явно названного подлежащего, поскольку по контексту строителем был Манассия.
- source_word: בְּהַר בֵּית יְהוָה
  choice: на горе дома Яхве
  rationale: Буквально сохраняет הַר «гора» и конструкцию «дом Яхве»; более интерпретирующее «на Храмовой горе» приведено в сноске.
- source_word: וּבִירוּשָׁלָם
  choice: и в Иерусалиме
  rationale: Прямо передаёт дополнительное место расположения жертвенников, распространяющее описание за пределы храмовой горы на город.
- source_word: וַיַּשְׁלֵךְ
  choice: и выбросил их
  rationale: Глагол שׁלך выражает энергичное удаление; «выбросил» естественно передаёт не просто бросок, а избавление от культовых предметов. Местоимение «их» восполняет подразумеваемое дополнение.
- source_word: חוּצָה לָעִיר
  choice: за город
  rationale: Направительная форма חוּצָה указывает на перемещение наружу; в сочетании с לָעִיר естественное русское выражение — «за город».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит тетраграмматон; форма «Яхве» сохраняет личное имя и отличает его от титула.
- issue: Характер предмета הַסֶּמֶל
  choice: идол
  alternative: изображение
  rationale: Контекст очищения храма поддерживает культовый и неодобрительный смысл «идол», однако более нейтральное лексическое значение «изображение» остаётся возможным и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского повествования регистром. Синтаксис сохраняет последовательность исходного перечисления, но остаётся естественным для русского читателя.
