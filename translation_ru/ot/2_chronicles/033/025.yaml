base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: ru
  text: Но народ страны[a] убил всех, кто составил заговор против царя Амона, и народ страны сделал его сына Иосию царём вместо него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «народ страны» может обозначать население страны и, возможно, имеет общественно-политический оттенок.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: перебил
  rationale: Форма от נכה обозначает нанесение удара, нередко со смертельным исходом; контекст говорит о расправе над всеми заговорщиками. «Перебил» естественно передаёт множественность объекта и смертельный характер действия.
- source_word: עַם הָאָרֶץ
  choice: народ страны
  rationale: Буквально и прозрачно передаёт устойчивое древнееврейское выражение, не сводя его без достаточных оснований к «простому народу» и сохраняя возможный общественно-политический оттенок.
- source_word: כָּל הַקֹּשְׁרִים
  choice: всех, кто составил заговор
  rationale: Причастие от קשר обозначает участников заговора. Развёрнутая конструкция звучит естественно по-русски и передаёт совершённый ими заговор.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: против царя Амона
  rationale: При קשר предлог עַל указывает на того, против кого направлен заговор.
- source_word: וַיַּמְלִיכוּ
  choice: поставил царём
  rationale: Каузативная форма от מלך означает сделать кого-либо царём, возвести на царство; перевод не добавляет прямо не названной церемонии коронации.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: его сына Иосию
  rationale: Приложение указывает, что Иосия — сын Амона; русский порядок слов ясно и естественно выражает эту связь.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: 'Выражение обозначает замещение и престолонаследие: Иосия стал царём на месте Амона.'
- source_word: וַ
  choice: Но
  rationale: 'Хотя союз может просто продолжать повествование, здесь он уместно передаёт контраст с предыдущим стихом: после убийства Амона его слугами народ расправился с заговорщиками.'
