base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: ru
  text: Тогда Яхве навёл на них военачальников войска ассирийского царя. Они захватили Манассию крюками[a], заковали его в бронзовые оковы и увели в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крюком». Еврейское слово может обозначать крюки или колючки; некоторые понимают его шире — как приспособление, которым удерживали пленника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: навёл на них
  rationale: Каузативная форма глагола בוא прямо выражает действие Яхве; сочетание «навёл на них» естественно передаёт враждебное военное выступление и не ослабляет его до простого дозволения.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: военачальников ассирийского царя
  rationale: Краткая и естественная формулировка передаёт военное руководство и принадлежность царю Ассирии.
- source_word: וַיִּלְכְּדוּ אֶת מְנַשֶּׁה
  choice: они схватили Манассию
  rationale: В военном контексте לכד означает захватить или пленить; «схватили» хорошо сочетается с последующим описанием обращения с пленником.
- source_word: בַּחֹחִים
  choice: крюками
  rationale: Конкретный образ крюков соответствует основному лексическому значению חֹחִים и известному обращению с пленниками; неоднозначность слова отмечена в сноске.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: заковали его в бронзовые оковы
  rationale: Глагол означает связывание, а נְחֻשְׁתַּיִם — металлические, буквально бронзовые или медные, средства удержания. «Заковали в бронзовые оковы» ясно и естественно по-русски.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: увели в Вавилон
  rationale: Каузатив הלך передаёт конвоирование пленника, а направительное окончание в בָּבֶלָה указывает движение в Вавилон.
theological_decisions:
- issue: Действие Бога в нападении Ассирии
  choice: Яхве непосредственно «навёл» военачальников на них.
  alternative: Яхве лишь «позволил» им напасть.
  rationale: Каузативный глагол прямо приписывает это действие Яхве. Перевод сохраняет утверждение о Божьем суде и не заменяет его более мягкой идеей простого дозволения.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным стилем. «Тогда» естественно связывает стих с предшествующим контекстом; короткое второе предложение сохраняет последовательность действий исходного текста.
