base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: ru
  text: Он молился Ему, и Бог внял его мольбе, услышал его прошение и возвратил его в Иерусалим, к царской власти[a]. Тогда Манассия узнал, что Яхве — Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к его царству»; здесь речь может идти о возвращении к царствованию, то есть к царской власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: Он молился Ему
  rationale: Глагол התפלל в породе хитпаэль обычно означает «молиться»; косвенное дополнение אֵלָיו передано личным местоимением, относящимся к Богу.
- source_word: וַיֵּעָתֶר לוֹ
  choice: Бог внял его мольбе
  rationale: Нифаль глагола עתר обозначает благосклонный ответ на мольбу. «Внял его мольбе» естественно передаёт результативный смысл, не приписывая тексту явно не выраженной эмоциональной реакции.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: услышал его прошение
  rationale: Существительное תחנה означает настойчивую просьбу о милости или благоволении; «прошение» сохраняет молитвенный и возвышенный регистр.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: возвратил его в Иерусалим, к его царской власти
  rationale: Каузативная форма שוב означает «возвратить». מלכותו здесь может обозначать не только территорию царства, но царствование или царскую власть; выбранная формулировка ясно передаёт восстановление Манассии как царя.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: Тогда Манассия узнал
  rationale: ידע передано как «узнал» в смысле пришёл к признанию; «тогда» естественно отражает повествовательное следствие.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: что Яхве — Бог
  rationale: Имя יהוה передано как «Яхве». Местоимение הוּא придаёт утверждению выразительность; русская именная конструкция с тире сохраняет её без тяжеловесного «Он есть». Слово «единственный» не добавлено, поскольку его нет в тексте.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и согласуется с предоставленным консультационным слоем.
- issue: Смысл исповедания כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: что Яхве — Бог
  alternative: что Яхве — единственный Бог
  rationale: Фраза утверждает, что Яхве есть Бог, с усилением посредством הוּא. Добавление «единственный» сделало бы исключительность более явной, чем она выражена грамматически, поэтому напряжение исходного текста сохранено.
- issue: Субъект Божьего ответа
  choice: Бог внял его мольбе
  alternative: Он позволил умолить Себя
  rationale: В еврейском субъект продолжается из контекста и относится к Богу. Явное «Бог» устраняет возможную русскую двусмысленность между молящимся Манассией и Тем, Кому он молился, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Параллельная последовательность Божьих действий сохранена. Местоимение «Ему» написано с прописной буквы по принятой русской религиозно-литературной норме; затем субъект назван явно ради ясности.
