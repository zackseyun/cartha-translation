base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: ru
  text: После этого он построил внешнюю стену для города Давида — к западу от Гихона, в долине, до входа в Рыбные ворота[a]. Он провёл её вокруг Офела[b][c] и сделал очень высокой. Он также поставил военачальников во всех укреплённых городах Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и до входа в Рыбные ворота». Еврейское выражение может обозначать направление и протяжённость стены к этим воротам.'
    reason: lexical_alternative
  - marker: b
    text: Офел — название возвышенной части Иерусалима, вероятно расположенной к югу от Храмовой горы.
    reason: cultural_note
  - marker: c
    text: 'Еврейскую фразу можно также перевести: «и обошёл Офел» или «и окружил Офел»; не вполне ясно, подчёркивается ли маршрут строителя или линия стены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временную последовательность повествования.
- source_word: בָּנָה
  choice: построил
  rationale: Основное значение глагола — «строить»; контекст не требует уточнения «восстановил».
- source_word: חוֹמָה חִיצוֹנָה
  choice: внешнюю стену
  rationale: Точно и естественно обозначает наружную оборонительную стену.
- source_word: לְעִיר דָּוִיד
  choice: для Города Давида
  rationale: Предлог לְ указывает, что стена сооружена для города, вероятно для его защиты; название передано в принятой русской форме.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: к западу от Гихона, в долине
  rationale: Сохраняет направление и топографическое указание; נחל здесь уместно передать доступным словом «долина».
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: вплоть до входа в Рыбные ворота
  rationale: Инфинитивная конструкция пространственно обозначает предел или подход к воротам.
- source_word: וְסָבַב לָעֹפֶל
  choice: Он провёл её вокруг Офела
  rationale: Передаёт сооружение стены вокруг названной местности и сохраняет Манассию как грамматический субъект цепочки действий; местоимение «её» явно соотносит действие со стеной.
- source_word: הָעֹפֶל
  choice: Офел
  rationale: Иерусалимский топоним передан транслитерацией без истолкования в основном тексте.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: сделал очень высокой
  rationale: Женский суффикс прямо относится к стене, а מְאֹד сохраняется усилителем «очень».
- source_word: שָׂרֵי חַיִל
  choice: военачальников
  rationale: Современное и ясное обозначение военных командиров.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת בִּיהוּדָה
  choice: во всех укреплённых городах Иудеи
  rationale: Точно передаёт распределение военачальников по укреплённым городам области.
