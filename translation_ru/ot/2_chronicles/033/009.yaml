source:
  edition: WLC
  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: ru
  text: Так Манассия совратил Иудею и жителей Иерусалима, и они стали творить больше зла, чем народы, которых Яхве истребил перед сынами Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянами»; «народом Израиля». Буквально: «сынами Израиля».'
    reason: Лексическая альтернатива поясняет собирательное значение буквального древнееврейского выражения.
lexical_decisions:
- source_word: וַיֶּתַע
  choice: совратил
  rationale: Порода хифиль от תעה выражает причинение уклонения с верного пути. «Совратил» естественно передаёт каузативный и нравственный смысл в данном контексте.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Иудею и жителей Иерусалима
  rationale: 'Сохранены оба совокупных объекта: Иудея как народ/царство и особо названные жители Иерусалима.'
- source_word: לַעֲשׂוֹת רָע
  choice: стали творить больше зла
  rationale: Оборот передаёт последствие совращения и сохраняет библейскую, но понятную современному читателю формулу «творить зло»; сравнительное מִן требует формы «больше».
- source_word: מִן הַגּוֹיִם
  choice: больше зла, чем народы
  rationale: Предлог מִן имеет сравнительное значение; по-русски оно естественно выражено конструкцией «больше… чем».
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В историческом контексте речь идёт о народах Ханаана, а не о позднейшем религиозном противопоставлении «язычников» Израилю.
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: которых Яхве истребил
  rationale: Глагол השמיד имеет сильное значение уничтожения; «истребил» точно и естественно передаёт его, а относительное местоимение относится к народам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул; форма «Яхве» общепринята в современной научной транслитерации.
- source_word: מִפְּנֵי
  choice: перед
  rationale: 'Сохранён пространственно-исторический образ: народы были истреблены перед наступавшими сынами Израиля, без добавления отсутствующих в тексте деталей.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Сохранена буквальная родовая формула еврейского текста; более идиоматические собирательные варианты указаны в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя сохранено в тексте, что отличает его от титула и не вводит конфессионально обусловленной замены.
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Буквальная мужская родовая формула сохранена как представительское обозначение народа; её собирательный смысл разъяснён в сноске.
- issue: Степень зла Иудеи по сравнению с хананейскими народами
  choice: больше зла, чем народы
  alternative: хуже, чем народы
  rationale: Сохранено резкое сравнительное утверждение текста без смягчения нравственно-богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Совратил» и «творить зло» сохраняют нравственную силу оригинала без архаической тяжеловесности; синтаксис сделан прозрачным для обычного читателя.
