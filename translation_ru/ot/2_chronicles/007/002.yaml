  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: ru
  text: И священники не могли войти в дом Яхве[a], потому что слава Яхве наполнила дом Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом Яхве»; то есть храм. Перевод сохраняет слово «дом», соответствующее еврейскому тексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: И ... не могли
  rationale: Продолжает повествование и естественно передаёт выраженную глаголом יכל невозможность совершить действие, не уточняя природу препятствия.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Стандартное и контекстуально точное обозначение храмовых служителей.
- source_word: לָבוֹא אֶל
  choice: войти в
  rationale: В данном пространственном контексте בוא с אֶל означает вхождение внутрь; «войти в» естественно по-русски.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» в еврейском тексте и его повторение; в контексте речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно выражает причинную связь: священники не могли войти вследствие наполнившей дом славы.'
- source_word: מָלֵא
  choice: наполнила
  rationale: Форма согласована с русским существительным «слава» и передаёт завершённое повествовательное событие без излишнего аспектуального уточнения.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: Прямо и привычно передаёт еврейское сочетание, сохраняя его богословскую ёмкость.
- source_word: אֶת בֵּית יְהוָה
  choice: дом Яхве
  rationale: Повтор исходного выражения сохранён, а не заменён стилистическим синонимом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как имя. «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Передача בֵּית как «дом» или «храм»
  choice: дом
  alternative: храм
  rationale: «Дом» сохраняет формулировку и образность еврейского текста; примечание разъясняет, что здесь имеется в виду храм.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и понятен; еврейское повторение «дом Яхве» сохранено намеренно.
