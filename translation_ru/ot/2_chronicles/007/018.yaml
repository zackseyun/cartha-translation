- from: 'то Я утвержу престол твоего царства, как заключил завет с Давидом, твоим отцом, сказав: «Не пресечётся у тебя муж, правящий Израилем».[a]'
  to: 'то Я утвержу престол твоего царства, как заключил завет с Давидом, твоим отцом, сказав: «Не будет у тебя недостатка в человеке, правящем Израилем».[a]'
  rationale: Замена «муж» на «человек» устраняет ложную современную ассоциацию со значением «супруг». Идиоматическая конструкция «не будет недостатка» естественно передаёт смысл נִכְרַת в контексте династического обещания, а примечание сохраняет образ «отсечения» исходного текста.
