base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: ru
  text: 'то Я утвержу престол твоего царства, как заключил завет с Давидом, твоим отцом, сказав: «Не будет у тебя недостатка в человеке, правящем Израилем».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Не будет отсечён от тебя человек, правящий Израилем».'
    reason: Еврейский оборот «не будет отсечён от тебя» означает, что у адресата не прекратится линия правителя.
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: то Я утвержу
  rationale: 'Порода hифиль от קום означает «поставить, утвердить». Союз ו в продолжении условия предыдущего стиха естественно передан как вводящий следствие: «то».'
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: престол твоего царства
  rationale: 'Сохранены оба существительных еврейской сопряжённой конструкции: «престол» и «царство».'
- source_word: כָּרַתִּי לְדָוִיד
  choice: заключил завет с Давидом
  rationale: Хотя слово «завет» здесь подразумевается, сочетание כרת в данном контексте является устойчивой формулой заключения завета.
- source_word: לְדָוִיד אָבִיךָ
  choice: с Давидом, твоим отцом
  rationale: «Отец» сохранено буквально; здесь оно обозначает предка и династического предшественника Соломона.
- source_word: לֹא יִכָּרֵת לְךָ
  choice: не пресечётся у тебя
  rationale: Нифаль глагола כרת сохраняет образ прекращения или пресечения династической линии. Русская формула близка источнику и остаётся понятной.
- source_word: אִישׁ מוֹשֵׁל
  choice: муж, правящий
  rationale: אִישׁ имеет мужской род и относится к династическому преемнику; причастие מוֹשֵׁל передано причастным оборотом без сведения обещания к одному лишь настоящему времени.
- source_word: בְּיִשְׂרָאֵל
  choice: Израилем
  rationale: При глаголе משל предлог ב выражает область господства; русское управление творительным падежом естественно передаёт смысл «править Израилем».
theological_decisions:
- issue: Формулировка династического обещания
  choice: «Не пресечётся у тебя муж, правящий Израилем»
  alternative: «У тебя всегда будет муж, который станет править Израилем»
  rationale: Основной текст сохраняет образ «пресечения» из еврейского оригинала и тем самым не снимает напряжение в формулировке династического обещания. Более ясный идиоматический смысл указан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Престол», «завет» и «пресечётся» уместны в торжественном контексте; синтаксис остаётся доступным современному читателю.
