base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: ru
  text: А в двадцать третий день седьмого месяца он отпустил народ к своим шатрам[a], радостных и с весёлыми сердцами за то добро, которое Яхве сделал для Давида, Соломона и Израиля, Своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по домам»; буквально: «к своим шатрам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: А в двадцать третий день седьмого месяца
  rationale: Сохраняется повествовательная связь, выраженная союзом וּ, а дата передаётся естественной современной русской конструкцией.
- source_word: שִׁלַּח
  choice: отпустил
  rationale: В данном контексте форма пиэль означает, что царь распустил собравшийся народ и позволил ему разойтись; «отпустил» естественнее русского буквального «послал».
- source_word: לְאָהֳלֵיהֶם
  choice: по своим шатрам
  rationale: Сохранён конкретный образ еврейского текста; выражение означает возвращение людей к месту проживания.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: Люди радовались, и сердца их были веселы
  rationale: Передаёт как деятельную радость, так и буквальный образ сердца, оставаясь понятным и благозвучным по-русски.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: от всего того доброго, что ... сделал
  rationale: Сохраняет обычное значение עָשָׂה «делать» и передаёт הַטּוֹבָה как благодеяния, послужившие причиной радости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: для Давида, Соломона и своего народа Израиля
  rationale: Предлог «для» естественно обозначает получателей благодеяний при русском глаголе «сделал»; «своего народа Израиля» ясно передаёт приложенное עַמּוֹ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация сохраняет его отличие от титула.
- issue: К кому относится «его/свой» в עַמּוֹ
  choice: 'к Яхве: «своего народа Израиля»'
  alternative: формально возможная неясная связь с ближайшим мужским референтом
  rationale: Синтаксис и устойчивое библейское обозначение Израиля как народа Яхве поддерживают отнесение местоименного суффикса к Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности; образ шатров и сердца сохранён.
