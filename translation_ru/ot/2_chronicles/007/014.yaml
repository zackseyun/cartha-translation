  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: ru
  text: Если Мой народ, названный Моим именем[a], смирится, помолится, будет искать Моего лица и отвернётся от своих злых путей, то Я услышу с небес, прощу его грех и исцелю его землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на котором (или над которым) призвано Моё имя» — еврейское выражение, обозначающее принадлежность Богу и ношение Его имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: смирится
  rationale: Нифаль глагола כנע здесь передаёт добровольное смирение народа в условной последовательности. Возвратное «смирится» естественно по-русски и не сводит действие к чисто пассивному состоянию.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямое обозначение народа, принадлежащего Богу. Еврейское собирательное существительное естественно передано русским единственным числом.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: названный Моим именем
  rationale: Передаёт еврейскую формулу принадлежности и отождествления с Богом естественным современным русским языком; буквальный образ отмечен в сноске.
- source_word: וְיִתְפַּלְלוּ
  choice: будет молиться
  rationale: Глагол פלל в хитпаэле обычно означает «молиться». Адресат понятен из контекста, поэтому дополнение не добавлено.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: искать Моего лица
  rationale: Сохранена метафора лица Бога, выражающая стремление к Его присутствию и благоволению, без сведения её к более общему «искать Меня».
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: отвернётся от своих злых путей
  rationale: שׁוב обозначает поворот, в данном контексте — нравственный отказ от прежнего поведения. «Пути» сохраняет метафору устойчивого образа жизни.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: то Я услышу с небес
  rationale: «То» ясно обозначает следствие условия, выраженного цепью еврейских форм с союзом. «С небес» непосредственно отражает מן השמים.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: прощу его грех
  rationale: Еврейское «грех» стоит в единственном числе и имеет собирательное значение. Местоимение согласовано с русским собирательным существительным «народ».
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: исцелю его землю
  rationale: «Исцелю» сохраняет буквальную метафору רפא, представляющую землю поражённой и нуждающейся в восстановительном действии Бога.
theological_decisions:
- issue: Условная структура ответа Бога
  choice: Начать стих с «Если» и в главной части употребить «то Я услышу».
  alternative: Соединить все части простым союзом «и».
  rationale: Хотя в еврейском тексте повторяются союзы, контекст и синтаксис образуют условие и следствие. Русская конструкция «если… то…» делает эту связь явной, не меняя её смысла.
- issue: Формула Божьего имени над народом
  choice: «названный Моим именем» как обозначение принадлежности Богу.
  alternative: Буквальное «над которым призвано Моё имя».
  rationale: Формула выражает принадлежность народа Богу и его отождествление с Ним, а не только произнесение имени. Буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойной библейской интонацией. Сохранены ключевые метафоры «искать лица» и «исцелить землю»; архаические инверсии и устаревшие формы устранены. Единственное число местоимений согласовано с собирательным существительным «народ».
