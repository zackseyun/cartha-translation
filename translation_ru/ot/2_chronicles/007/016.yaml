  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: ru
  text: И ныне Я избрал и освятил этот дом[a], чтобы Моё имя пребывало там вовеки[b]; и Мои очи и Моё сердце будут там во все дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм в Иерусалиме; еврейский текст буквально называет его «этим домом».
    reason: cultural_note
  - marker: b
    text: 'Еврейское выражение передаёт неограниченную длительность; здесь: «вовеки».'
    reason: lexical_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: И ныне
  rationale: Сохраняет и связь с предшествующей речью, и торжественный переход, оставаясь понятным в современном литературном русском.
- source_word: בָּחַרְתִּי וְהִקְדַּשְׁתִּי
  choice: Я избрал и освятил
  rationale: Обе формы обозначают совершённые действия Бога с сохраняющимся результатом; «освятил» передаёт значение отделения для святого назначения.
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: Перевод сохраняет конкретное слово «дом»; в контексте речь идёт о храме.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: чтобы Моё имя пребывало там
  rationale: Инфинитивная конструкция передана как цель. Добавленное по смыслу «пребывало» естественно выражает устойчивое присутствие имени, не подменяя «имя» словом «присутствие».
- source_word: עַד עוֹלָם
  choice: вовеки
  rationale: Торжественное, но понятное русское соответствие длительности, выраженной עוֹלָם.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: и Мои очи и Моё сердце будут там
  rationale: Антропоморфные образы сохранены; «очи» соответствует возвышенному храмовому контексту и сочетается с формулой «сердце».
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Сохраняет буквальный еврейский образ непрерывности и его библейское звучание, не сводя выражение к нейтральному «всегда».
theological_decisions:
- issue: 'Антропоморфное описание Бога: «Мои очи и Моё сердце»'
  choice: Сохранить оба образа буквально
  alternative: 'Передать толковательно: «Моё внимание и попечение»'
  rationale: Исходный текст намеренно говорит об очах и сердце Бога, выражая Его внимательное попечение и расположение; парафраз устранил бы богословскую образность.
- issue: Храмовая формула «Моё имя»
  choice: Сохранить выражение «Моё имя»
  alternative: Перевести как «Моё присутствие» или «Я Сам»
  rationale: «Имя» связано с Божьим откровением и заветным присутствием, но текст не отождествляет эту формулу прямо ни с абстрактной репутацией, ни с исчерпывающим утверждением о локализации Бога.
- issue: Временное соотношение «вовеки» и «во все дни»
  choice: Сохранить обе формулы без согласующего перефразирования
  alternative: Объединить их общим словом «всегда»
  rationale: Повтор и различие формулировок присутствуют в еврейском тексте и поддерживают его торжественную напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «ныне», «очи», «вовеки» и «во все дни» сохраняют торжественность и образность оригинала, не создавая чрезмерно архаичного синтаксиса.
