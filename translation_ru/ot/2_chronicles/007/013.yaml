base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: ru
  text: Если Я затворю небо и не будет дождя[a], или повелю саранче опустошить землю, или пошлю мор среди Моего народа[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Когда Я затворю небо и не будет дождя». Еврейскую начальную частицу можно также передать: «Вот, если».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моровую язву среди Моего народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Если
  rationale: Частица вводит возможное условие, которое получает продолжение в следующем стихе. Русское «если» естественно передаёт условную конструкцию, не превращая возможность в неизбежное событие.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: Я затворю небо
  rationale: Сохранён конкретный библейский образ закрытого неба; единственное число «небо» естественно для современного русского языка в связи с отсутствием дождя.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: и не будет дождя
  rationale: Формально и ясно передаёт следствие затворённого неба без добавления отсутствующего в тексте глагола «идти».
- source_word: אֲצַוֶּה עַל חָגָב
  choice: повелю саранче
  rationale: חָגָב употреблено как собирательное существительное. «Повелю саранче» сохраняет единственное собирательное значение и прямое действие Бога.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: пожрать землю
  rationale: Глагол буквально означает «есть», но в контексте нашествия саранчи «пожрать» естественно передаёт разрушительное истребление растительности. «Земля» здесь обозначает землю народа, а не весь мир.
- source_word: דֶּבֶר
  choice: мор
  rationale: Краткое и весомое русское слово для массовой заразной болезни, соответствующее контексту заветного суда; оно точнее «болезни» и менее многозначно, чем «бедствие».
- source_word: בְּעַמִּי
  choice: на Мой народ
  rationale: В сочетании с глаголом «пошлю» русский предлог «на» естественно выражает направленность бедствия, сохраняя прямую божественную субъектность.
theological_decisions:
- issue: Условный характер перечисленных Божьих судов
  choice: «Если Я затворю… или повелю… или пошлю…»
  alternative: «Когда Я затворю…» или «Вот, если Я затворю…»
  rationale: Еврейское הֵן допускает оттенок «вот, если» и вводит возможные обстоятельства, связанные с ответным условием в следующем стихе. «Если» сохраняет эту условность и не ослабляет утверждение, что перечисленные суды совершает Сам Бог.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Затворю небо» и «мор» сохраняют достоинство и лаконизм оригинала; запятая в конце показывает, что условная конструкция продолжается в 7:14.
