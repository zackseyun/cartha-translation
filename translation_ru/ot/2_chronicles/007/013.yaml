  source_fidelity: Начальное «Если» хорошо передаёт условный характер הֵן и сохраняет связь с последующим стихом. «Затворю небо», «повелю саранче» и «мор» в целом точны. Однако בְּעַמִּי обозначает бедствие внутри народа («среди Моего народа»), а не направленное на него; это различие следует отразить в основном тексте. «Пожрать землю» по-русски создаёт буквальный образ поедания почвы, тогда как еврейский оборот обозначает опустошение земли нашествием саранчи.
