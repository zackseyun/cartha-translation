base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: ru
  text: Священники стояли на своих местах, а левиты — с инструментами для песнопений в честь Яхве[a], которые изготовил царь Давид, чтобы благодарить Яхве, ибо Его неизменная любовь — навеки[b], когда Давид возносил хвалу через них[c]. Священники трубили напротив них, а весь Израиль стоял.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с музыкальными инструментами Яхве». Еврейское выражение может обозначать как посвящённые Яхве инструменты, так и инструменты, которыми сопровождали песнопение Ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Ибо Его неизменная любовь — навеки». Это обычная еврейская формула, которую также можно передать: «Ибо Его неизменная любовь длится вечно».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «когда Давид возносил хвалу их рукой». Сжатая еврейская конструкция, вероятно, означает, что левиты исполняли Давидову хвалу как его представители; возможно также: «когда через них звучала хвала Давида».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: на своих местах
  rationale: Слово обозначает назначенные места или череды служения. В данном церемониальном контексте выражение естественно передаёт упорядоченное расположение священников, не сводя смысл лишь к обязанностям.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: с инструментами для песнопения Яхве
  rationale: Формулировка сохраняет связь инструментов, песнопения и имени Яхве, при этом по-русски естественно указывает на их богослужебное назначение. Возможная генитивная неоднозначность отмечена в сноске.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: чтобы благодарить Яхве
  rationale: В породе hifil глагол ידה означает благодарить или прославлять; следующая формула о неизменной любви делает значение благодарения особенно уместным.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: Ибо Его неизменная любовь — навеки
  rationale: חֶסֶד охватывает верную, стойкую любовь, милость и преданность. «Неизменная любовь» передаёт устойчивость этого отношения, а именная конструкция с тире близко отражает отсутствие явного глагола в еврейском тексте.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: когда Давид возносил хвалу через них
  rationale: Сжатая еврейская конструкция представляет Давида субъектом восхваления, а левитов — его посредниками или исполнителями. Русское «через них» естественно передаёт идиому «их рукой», не уточняя сверх текста, исполняли ли они составленное Давидом произведение.
- source_word: מחצצרים
  choice: трубили
  rationale: Глагол конкретно обозначает звучание труб; «трубили» кратко и естественно передаёт продолжающееся действие.
- source_word: נֶגְדָּם
  choice: напротив них
  rationale: Передаёт пространственное значение нахождения перед кем-либо или напротив кого-либо, не добавляя особого церемониального смысла.
- source_word: עֹמְדִים
  choice: стояли
  rationale: Русская форма несовершенного вида сохраняет длительный, описательный характер еврейского причастия.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Значение חֶסֶד
  choice: неизменная любовь
  alternative: милость; верная любовь; милосердие
  rationale: Выбранное выражение удерживает одновременно личностный характер любви и её постоянство, не ограничивая широкое значение חֶסֶד только состраданием или только формальной заветной верностью.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным богослужебным звучанием. Синтаксис упрощён до двух предложений ради ясности, при этом последовательность участников и действий сохранена. Кавычки выделяют устойчивую формулу благодарения, а тире передаёт безглагольность еврейской фразы.
