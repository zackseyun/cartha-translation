  text: וַ/יְכַ֧ל שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל הַ/בָּ֜א עַל לֵ֣ב שְׁלֹמֹ֗ה לַ/עֲשׂ֧וֹת בְּ/בֵית יְהוָ֛ה וּ/בְ/בֵית֖/וֹ הִצְלִֽיחַ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: ru
  text: Так Соломон завершил дом Яхве и дом царя[a]. Всё, что Соломон задумал сделать[b] в доме Яхве и в собственном доме, он успешно осуществил[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царский дворец». Буквально: «дом царя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всё, что пришло на сердце Соломона сделать» — еврейский оборот о намерениях и желаниях человека.'
    reason: cultural_note
  - marker: c
    text: 'Или: «ему удалось», «он преуспел»; еврейский глагол может означать как достижение успеха, так и успешное доведение чего-либо до результата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: завершил
  rationale: Глагол כלה в повествовательной форме обозначает доведение дела до конца; «завершил» естественно сочетается с названиями обеих построек.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальное значение בֵּית («дом») и передаёт тетраграмматон יְהוָה личным именем «Яхве».
- source_word: בֵּית הַמֶּלֶךְ
  choice: дом царя
  rationale: Сохраняет повтор слова «дом» и форму еврейского словосочетания; по смыслу речь идёт о царском дворце.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: всё, что Соломон задумал сделать
  rationale: Еврейский оборот буквально говорит о том, что «пришло на сердце», то есть о намерениях и замыслах; в основном тексте выбран естественный современный русский эквивалент, а образность оригинала отмечена в сноске.
- source_word: וּבְבֵיתוֹ
  choice: в собственном доме
  rationale: Притяжательный суффикс относится к Соломону; «собственном» ясно отличает его дом от дома Яхве.
- source_word: הִצְלִיחַ
  choice: успешно осуществил
  rationale: Форма Hiphil глагола צלח может обозначать как достижение успеха, так и успешное доведение дела до результата; выбранная формулировка подходит к перечисленным строительным замыслам, не скрывая лексической неоднозначности, отмеченной в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя, а не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Повтор слова «дом» сохранён вслед за еврейским текстом; идиома о сердце передана естественно, но её буквальный образ приведён в сноске.
