  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: ru
  text: 'И скажут: «Потому что они оставили Яхве, Бога их отцов, который вывел их из земли Египта, стали держаться других богов[a], поклонялись им и служили им, поэтому он навёл на них всё это бедствие[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ухватились за других богов»; «крепко привязались к другим богам». Еврейский глагол буквально означает «схватиться», «крепко держаться» и выражает сознательную привязанность к чужим богам.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «бедствие» означает несчастье или кару, а не нравственное зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: И скажут
  rationale: Форма продолжает предсказание предыдущего стиха; будущее время естественно передаёт её значение по-русски.
- source_word: עַל אֲשֶׁר
  choice: За то, что
  rationale: Оборот вводит причину постигшего народ бедствия и естественно сочетается с последующим «Он навёл».
- source_word: עָזְבוּ
  choice: оставили
  rationale: Передаёт сознательное отступление от Бога без излишней архаичности; контекст сохраняет за словом заветную серьёзность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Естественная для русского библейского регистра формулировка, сохраняющая идею преемственности поколений.
- source_word: אֲשֶׁר הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: который вывел их из земли Египетской
  rationale: Точно передаёт исходную формулу о выходе из Египта и сохраняет связь относительного местоимения с Богом.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: и прилепились к другим богам
  rationale: Глагол с предлогом выражает намеренную и стойкую привязанность; «прилепились» сохраняет конкретность образа и его религиозную силу.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: поклонялись им
  rationale: Передаёт телесный жест преклонения и его очевидный в данном контексте культовый смысл.
- source_word: וַיַּעַבְדוּם
  choice: и служили им
  rationale: Сохраняет отличие עבד от предшествующего глагола поклонения.
- source_word: עַל כֵּן
  choice: Он
  rationale: В русском причинно-следственная связь уже выражена начальным оборотом «За то, что», поэтому отдельное «поэтому» было бы тяжеловесным; подлежащее восстанавливается из контекста.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: навёл на них
  rationale: 'Идиоматично передаёт каузативное значение: Бог сделал так, что бедствие постигло их.'
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: всё это бедствие
  rationale: В контексте суда רָעָה означает пагубное несчастье или бедствие, а не нравственное зло.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер связи с другими богами
  choice: прилепились к другим богам
  alternative: ухватились за других богов; стали держаться других богов
  rationale: Выбор сохраняет образ намеренной привязанности, не сводя выражение только к умственному признанию или обрядовому поклонению.
- issue: Значение רָעָה в Божьем суде
  choice: бедствие
  alternative: зло; несчастье
  rationale: Здесь речь идёт о постигшей людей катастрофе как последствии суда, а не о нравственном зле, совершённом Богом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллельные действия «поклонялись» и «служили», а также причинно-следственная структура стиха; избегнуты как разговорные обороты, так и чрезмерная архаика.
