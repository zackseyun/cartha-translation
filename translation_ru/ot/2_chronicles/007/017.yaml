source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: ru
  text: А ты, если будешь ходить передо Мной, как ходил твой отец Давид, исполняя всё, что Я повелел тебе, и будешь соблюдать Мои уставы и постановления[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суды».'
    reason: Лексическая альтернатива для מִשְׁפָּטַי, сохраняющая его судебно-правовой оттенок.
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Вынесенное местоимение передаёт прямое и подчёркнутое обращение к Соломону; «А ты» естественно обозначает переход к нему в русском контексте.
- source_word: אִם
  choice: если
  rationale: Сохраняет явно выраженное условие, вводящее придаточную часть, продолжение которой следует в следующем стихе.
- source_word: תֵּלֵךְ לְפָנַי
  choice: будешь ходить передо Мной
  rationale: Сохраняет библейский образ хождения перед Богом как образ жизни в Его присутствии, оставаясь понятным современному читателю.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: как ходил твой отец Давид
  rationale: Повтор глагола «ходить» сохраняет образ исходного текста, а порядок слов естественен для современного русского языка.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: исполняя всё, что Я повелел тебе
  rationale: Деепричастная конструкция передаёт еврейский инфинитив как сопутствующее содержание хождения, не превращая его в отдельный финитный глагол; «всё» сохраняет полноту כְּכֹל.
- source_word: חֻקַּי
  choice: Мои уставы
  rationale: «Уставы» — устойчивое обозначение установленных Богом предписаний и позволяет отличить термин от следующего מִשְׁפָּטַי.
- source_word: וּמִשְׁפָּטַי
  choice: и постановления
  rationale: «Постановления» естественно передаёт правовой и нормативный смысл מִשְׁפָּטִים; более буквальное «суды» отмечено в сноске.
- source_word: תִּשְׁמֹר
  choice: будешь соблюдать
  rationale: В контексте заповедей «соблюдать» естественно выражает заветное значение хранения и исполнения предписаний.
theological_decisions:
- issue: Условный характер обещания и язык заветного послушания
  choice: 'Сохранить прямую условную конструкцию: «если будешь ходить… исполняя… и будешь соблюдать…»'
  alternative: Обобщить условие как верность Богу или ослабить условность формулировки
  rationale: Текст предъявляет Соломону реальное условие заветного послушания. Перевод не должен ни смягчать его, ни истолковывать в рамках какой-либо системы учения о заслугах.
translation_notes:
  register: Современный литературный русский с умеренно библейским оборотом «ходить передо Мной». Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Конечная запятая показывает, что условная конструкция продолжается в 7:18.
