  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: ru
  text: то Я исторгну их из Моей земли, которую Я дал им, а этот дом, который Я освятил для Моего имени, отброшу от Себя[a] и сделаю его притчей и посмешищем среди всех народов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «брошу прочь от Моего лица».'
    reason: Сохраняет доступ к конкретному еврейскому образу, стоящему за русской идиоматической передачей.
  - marker: b
    text: 'Или: «притчей и язвительной поговоркой»; смысл второго слова включает насмешку и поношение.'
    reason: Отмечает смысловой диапазон редкого слова שְׁנִינָה и неоднозначность сочетания.
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: то Я исторгну их
  rationale: Глагол נתשׁ передаёт образ вырывания с корнем; «исторгну» сохраняет силу образа и звучит естественно в торжественном библейском контексте. Союз передан как «то», поскольку стих продолжает условную конструкцию предыдущего стиха.
- source_word: מֵעַל אַדְמָתִי
  choice: из Моей земли
  rationale: אֲדָמָה здесь обозначает данную народу землю; русский предлог «из» естественно сочетается с глаголом «исторгну».
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: Сохранено буквальное «дом», обычное библейское обозначение храма, без подмены исходного образа пояснительным словом «храм».
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: Я освятил для Моего имени
  rationale: «Освятил» передаёт каузативное значение — отделил как святое; «для Моего имени» сохраняет значимый исходный оборот.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: отвергну от Себя
  rationale: Выражение буквально означает бросить прочь от лица Бога. «Отвергну от Себя» естественно передаёт действие и мотив Божьего отвержения, не сводя образ к физическому зрению.
- source_word: וְאֶתְּנֶנּוּ
  choice: и сделаю его
  rationale: נתן с последующими именными определениями означает привести объект в названное состояние, то есть «сделать» его чем-либо.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: притчей и посмешищем
  rationale: מָשָׁל допускает значение ставшего нарицательным поучительного примера, а שְׁנִינָה — предмета насмешки или язвительных речей. Сочетание сохраняет два взаимодополняющих понятия.
- source_word: בְּכָל הָעַמִּים
  choice: среди всех народов
  rationale: Передаёт множественное עַמִּים и естественное русское значение распространения позора среди народов.
theological_decisions:
- issue: Обозначение храма
  choice: этот дом
  alternative: этот храм
  rationale: Еврейский текст говорит «дом». Такой перевод сохраняет библейский образ Божьего дома и остаётся понятным из контекста.
- issue: Образ Божьего лица и отвержения
  choice: отвергну от Себя
  alternative: брошу прочь от Моего лица
  rationale: Выбранный вариант ясно выражает Божье отвержение и не превращает идиому в неестественную русскую фразу; буквальный образ отмечен в сноске.
- issue: Характер будущего публичного позора
  choice: притчей и посмешищем
  alternative: притчей и язвительной поговоркой
  rationale: 'Перевод не ограничивает многозначные слова одним узким видом речения: дом станет и нарицательным примером, и предметом публичной насмешки.'
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формы «исторгну» и «освятил» несколько возвышенны, но понятны; синтаксис прямой и не архаизированный. Все сноски обозначены в основном тексте.
