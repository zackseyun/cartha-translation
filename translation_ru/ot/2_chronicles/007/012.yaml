base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: ru
  text: 'И явился Яхве Соломону ночью и сказал ему: «Я услышал твою молитву и избрал для Себя это место домом для жертвоприношений[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для дома жертвы»; то есть для места, предназначенного для жертвенного поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה здесь обозначает явление Яхве Соломону; «явился» естественно передаёт теофанический смысл, не уточняя способ явления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בַּלָּיְלָה
  choice: ночью
  rationale: Современный и точный русский эквивалент обстоятельства времени; вариант «в ночи» был бы неестественно архаичным.
- source_word: שָׁמַעְתִּי
  choice: Я услышал
  rationale: Еврейский перфект сообщает о завершённом действии, значимом для настоящего ответа Бога; русское прошедшее время естественно передаёт это в контексте.
- source_word: תְּפִלָּתֶךָ
  choice: твою молитву
  rationale: Прямое и контекстуально точное соответствие существительному תְּפִלָּה.
- source_word: וּבָחַרְתִּי
  choice: и избрал
  rationale: Сохраняет параллель с «услышал» и устойчивый библейский оттенок осознанного Божьего выбора.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: это место
  rationale: Естественно указывает на только что посвящённое место храма.
- source_word: לִי
  choice: для Себя
  rationale: Передаёт дательный личной принадлежности или назначения с выраженным отнесением места к Богу.
- source_word: לְבֵית זָבַח
  choice: как дом жертвоприношений
  rationale: Сохраняет образ «дома» и значение זֶבַח как жертвы/жертвоприношения, не подменяя выражение толкованием «храм».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Назначение избранного места
  choice: как дом жертвоприношений
  alternative: для дома жертвоприношений; как храм для жертвоприношений
  rationale: Формулировка сохраняет буквальный образ בֵּית זָבַח и допускаемую конструкцией смысловую связь назначения, не вводя отсутствующее в тексте слово «храм».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «И» сохраняет повествовательную связь וַ־. Местоимение «Себя» написано с прописной буквы согласно распространённой русской религиозной издательской норме; синтаксис остаётся ясным для широкого читателя.
