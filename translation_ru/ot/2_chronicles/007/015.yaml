  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: ru
  text: Теперь Мои глаза будут открыты, и Мои уши внимательны к молитве, возносимой в этом месте[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к молитве в этом месте»; возможно также: «к молитве с этого места». Буквально по-еврейски: «к молитве этого места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временное наречие как нынешний результат предшествующего освящения; вариант «отныне» возможен, но сильнее подчёркивает длительность.
- source_word: עֵינַי
  choice: глаза Мои
  rationale: Сохраняет конкретный антропоморфный образ и первое лицо, не сводя его к абстрактному «Я буду видеть».
- source_word: יִהְיוּ פְתֻחוֹת
  choice: будут открыты
  rationale: Естественно передаёт будущую/продолжающуюся стативную конструкцию היה с причастием «открыты».
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: и уши Мои внимательны
  rationale: Сохраняет параллелизм и образ внимательного слушания; подразумеваемая связка «будут» восстанавливается из первой части и по-русски может не повторяться.
- source_word: לִתְפִלַּת הַמָּקוֹם הַזֶּה
  choice: к молитве, возносимой на этом месте
  rationale: Передаёт направленность לִ־ и естественно раскрывает не вполне обычное сочетание «молитва этого места» как молитву, связанную с данным местом, не исключая иных синтаксических оттенков, отмеченных в сноске.
theological_decisions:
- issue: Антропоморфный язык о восприятии Бога
  choice: Сохранить буквально «глаза Мои» и «уши Мои»
  alternative: «Я буду видеть и внимательно слушать»
  rationale: В еврейском тексте телесные образы выражают Божье внимание. Их сохранение не сглаживает образность и заветно-реляционный характер высказывания.
- issue: Связь молитвы с храмовым местом
  choice: «к молитве, возносимой на этом месте»
  alternative: «к молитве этого места» или «к молитве с этого места»
  rationale: Конструкция допускает молитву, связанную с этим местом, без утверждения, что место само молится. Основной текст даёт естественное контекстуальное прочтение, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Постпозиция притяжательного местоимения («глаза Мои», «уши Мои») поддерживает достоинство речи, оставаясь понятной современному читателю.
