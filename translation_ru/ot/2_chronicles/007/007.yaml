source:
  edition: WLC
  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: ru
  text: 'Соломон освятил середину двора перед домом Яхве, потому что там он принёс всесожжения и жирные части мирных жертв[a]: медный жертвенник, который сделал Соломон, не мог вместить всесожжение, хлебное приношение и жирные части.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тук мирных жертв».'
    reason: «Жирные части» передаёт жертвенное значение еврейского חֶלֶב; «тук» — традиционный русский библейский технический термин.
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: освятил
  rationale: В породе хифиль глагол означает отделить место для священного употребления; «освятил» естественно передаёт культовый смысл.
- source_word: תּוֹךְ הֶחָצֵר
  choice: середину двора
  rationale: תּוֹךְ здесь указывает на внутреннюю, срединную часть двора, выделенную из-за недостаточной вместимости жертвенника.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: перед домом Яхве
  rationale: Выражение имеет пространственное значение; «дом Яхве» сохраняет храмовую лексику оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עָשָׂה שָׁם
  choice: там он принёс ... и сжёг
  rationale: עָשָׂה в жертвенном контексте означает совершение приношений; по-русски действие уточнено согласно различию между целиком сжигаемыми жертвами и сжигаемым туком.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: всесожжения / всесожжение
  rationale: Традиционный и точный русский культовый термин; сохранено различие множественного и собирательного единственного числа.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: тук мирных жертв
  rationale: חֵלֶב обозначает предназначенные для сожжения жировые части, а שְׁלָמִים — мирные жертвы; термин «тук» точен и укоренён в русской библейской лексике.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: медный жертвенник
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; традиционное «медный» сохраняет присущую исходному слову материальную неопределённость.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: не мог вместить
  rationale: Точно выражает недостаточную вместимость жертвенника.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте מִנְחָה обозначает приношение из продуктов земледелия; этот русский термин понятен и точнее узкого «зерновое».
- source_word: הַחֲלָבִים
  choice: тук
  rationale: Формально множественное число обозначает совокупность жертвенных жировых частей; русское собирательное «тук» звучит естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет его статус и не подменяет титулом.
- issue: Значение שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; благодарственные жертвы
  rationale: «Мирные жертвы» — устойчивый общий культовый термин, не сводящий этот вид жертв к одной возможной функции.
- issue: Характер действия עָשָׂה с жертвами
  choice: принёс всесожжения и сжёг тук
  alternative: совершил там всесожжения и [приношение] тука
  rationale: Контекст требует жертвенного смысла глагола; раздельная русская формулировка ясно передаёт, что тук мирных жертв сжигался на жертвеннике, не утверждая, будто вся мирная жертва была всесожжением.
translation_notes:
  register: Современный литературный русский с сохранением необходимой храмово-жертвенной терминологии. Синтаксис упрощён без устранения причинной связи оригинала; второе כִּי передано двоеточием. Все маркеры сносок присутствуют в основном тексте.
