revisions:
- from: 'Соломон освятил середину двора, находившегося перед домом Яхве, потому что там он принёс всесожжения и сжёг тук мирных жертв[a]: медный жертвенник, который сделал Соломон, не мог вместить всесожжение, хлебное приношение и тук.'
  to: 'Соломон освятил середину двора перед домом Яхве, потому что там он принёс всесожжения и жирные части мирных жертв[a]: медный жертвенник, который сделал Соломон, не мог вместить всесожжение, хлебное приношение и жирные части.'
