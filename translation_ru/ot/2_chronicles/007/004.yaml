lexical_decisions:
- source_word: וְהַמֶּלֶךְ וְכָל הָעָם
  choice: И царь, и весь народ
  rationale: Союз וְ продолжает повествование; повтор «и» естественно объединяет царя и весь народ как общий субъект. עָם здесь обозначает собравшийся народ, а не особую группу или собрание.
- source_word: זֹבְחִים זֶבַח
  choice: приносили жертвы
  rationale: Причастие זֹבְחִים передаёт продолжающееся действие, поэтому выбрана форма несовершенного вида «приносили». Однокоренная конструкция буквально означает «закалывали жертву»; по-русски её естественно передать как «приносили жертвы», не создавая неуклюжего повтора.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог означает действие перед лицом или в присутствии кого-либо. «Перед» кратко и естественно сохраняет этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер действия זֹבְחִים
  choice: приносили жертвы
  alternative: принесли жертвы
  rationale: Причастная форма представляет жертвоприношение как происходящее действие; русский несовершенный вид сохраняет этот оттенок, не уточняя сверх текста продолжительность или повторяемость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка понятна широкому читателю; несовершенный вид сохраняет аспект исходного причастия, а сноска поясняет сглаженную однокоренную конструкцию.
