base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: ru
  text: 'И все сыны Израиля[a], видя сходящий огонь и славу Яхве над Домом[b], преклонились лицом до земли на вымощенном полу, поклонились и благодарили Яхве: «Ибо Он благ, ибо вовек милость[c] Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть весь народ Израиля; выражение «сыны Израиля» здесь имеет собирательное значение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Дом»; имеется в виду храм.'
    reason: cultural_note
  - marker: c
    text: Еврейское слово חֶסֶד может также означать неизменную любовь, милосердие и верность завету.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: И все сыны Израиля
  rationale: Сохранено буквальное «сыны Израиля» как традиционное собирательное обозначение всего народа; сноска поясняет значение.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: видя, как сошёл огонь
  rationale: Причастие передаёт одновременное наблюдение, а конструкция с инфинитивом — схождение огня; по-русски естественно «видя, как сошёл».
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: и слава Яхве явилась над храмом
  rationale: В еврейском именная конструкция без выраженного глагола; «явилась» ясно передаёт присутствие славы в данном контексте. הַבַּיִת здесь обозначает храм.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: пали лицом на землю, на мощёный пол
  rationale: Передана поза глубокого преклонения; רִצְפָה означает вымощенную поверхность или пол храмового двора.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонились
  rationale: Глагол обозначает телесное преклонение в поклонении; после описания позы «поклонились» сохраняет религиозный смысл без тяжеловесного повтора.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: и благодарили Яхве
  rationale: Форма необычна для ожидаемого последовательного глагола, но смысл яда в этой литургической формуле — благодарить или славить; выбрано «благодарили».
- source_word: כִּי טוֹב
  choice: Ибо Он благ
  rationale: Сохранена краткая литургическая формула и объяснительная сила כִּי.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ибо милость Его вечна
  rationale: חֶסֶד сочетает милость, преданную любовь и верность отношениям; «милость» естественно звучит в русской формуле, а сноска сохраняет широту значения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, а не замещающий титул; форма «Яхве» наиболее непосредственно отражает принятую реконструкцию произношения.
- issue: Передача חַסְדּוֹ
  choice: милость Его
  alternative: Его неизменная любовь; Его заветная верность
  rationale: «Милость» сохраняет привычную русскую литургическую выразительность, но не исчерпывает смысл слова, поэтому его оттенки отмечены в сноске.
- issue: Эллипсис при וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: слава Яхве явилась над храмом
  alternative: слава Яхве была над храмом; слава Яхве на храме
  rationale: В исходном тексте нет отдельного глагола при «славе»; добавление «явилась» требуется для естественного русского синтаксиса и соответствует видимому проявлению славы, не отождествляя её с огнём.
translation_notes:
  register: Современный литературный русский с dignified литургическим звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены «сыны Израиля», имя «Яхве» и краткий рефрен. Все сноски отмечены в основном тексте.
