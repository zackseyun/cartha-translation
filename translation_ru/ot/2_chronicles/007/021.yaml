  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: ru
  text: 'И этот дом[a], который был возвышен, — всякий, проходящий мимо него, ужаснётся[b] и скажет: «Почему Яхве так поступил с этой землёй и с этим домом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм.
    reason: lexical_clarification
  - marker: b
    text: 'Или: «придёт в оцепенение»; еврейский глагол может выражать потрясение и ужас при виде разорения, а в других контекстах — запустение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: И этот дом
  rationale: Сохранено буквальное «дом», поскольку в контексте речь идёт о храме, а исходное слово также несёт смысл дома Яхве.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: который был возвышен
  rationale: עֶלְיוֹן означает «высокий, возвышенный» и здесь указывает на прежнее величие и выдающееся положение храма.
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: всякий, проходящий мимо него, ужаснётся
  rationale: Ближайшим субъектом глагола в единственном числе естественно считать distributive «всякого проходящего»; שמם передаёт потрясение и ужас при виде разорения. Неоднозначность относительно связи глагола с домом отражена в сноске.
- source_word: וְאָמַר
  choice: и скажет
  rationale: Единственное число согласовано с собирательно-дистрибутивным «всякий» и сохраняет форму еврейского текста.
- source_word: בַּמֶּה
  choice: Почему
  rationale: Буквально «из-за чего?»; в русском вопросе о причине Божьего суда естественно «Почему?».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: כָּכָה
  choice: так
  rationale: Естественный современный русский эквивалент указательного наречия «таким образом».
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: с этой землёй и с этим домом
  rationale: Конструкция עשה ... ל передана естественным русским «поступить с»; «земля» и повторное «дом» сохраняют лексику и заветный контекст оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Кто испытывает ужас в לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: Ужаснётся всякий прохожий
  alternative: Дом станет запустением или предметом ужаса
  rationale: Синтаксически «всякий, проходящий мимо» является ближайшим и естественным субъектом глагола единственного числа. Однако корень שמם допускает оттенки опустошения и ужаса, поэтому альтернативная связь с судьбой дома не исключена и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Именительный оборот «И этот дом… —» сохраняет выдвижение храма в начало еврейской фразы, а единственное число «всякий… ужаснётся и скажет» воспроизводит дистрибутивную конструкцию оригинала.
