base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: ru
  text: В то время Соломон праздновал этот праздник семь дней, и вместе с ним — весь Израиль, чрезвычайно многочисленное собрание, от Лево-Хамата[a] до Египетского потока[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от входа в Хамат». Еврейское выражение можно понимать и как название места («Лево-Хамат»), и как обозначение границы.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «до Египетского вади». Еврейское слово может обозначать сезонный водоток или его русло, а не крупную реку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת־הֶחָג
  choice: праздновал праздник
  rationale: Буквально глагол означает «делал», но в сочетании с חָג идиоматически обозначает совершение или празднование праздника.
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Прямой и естественный перевод временного оборота.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Передаёт продолжительность празднования без избыточного уточнения.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: и вместе с ним — весь Израиль
  rationale: Сохраняет собирательное национальное значение «весь Израиль» и выраженную предлогом идею совместного участия.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: великое множество народа
  rationale: Передаёт приложение, характеризующее весь собравшийся Израиль; формулировка естественна по-русски и не придаёт слову קָהָל узкоцерковного оттенка.
- source_word: מִלְּבוֹא חֲמָת
  choice: от Лево-Хамата
  rationale: Оборот может быть устойчивым географическим названием северной границы; транслитерация сохраняет это понимание, а альтернативное описательное прочтение вынесено в сноску.
- source_word: עַד נַחַל מִצְרָיִם
  choice: до Египетского потока
  rationale: נַחַל может обозначать поток, русло или вади, а не крупную реку; «Египетский поток» звучит естественно и сохраняет географическое наименование.
