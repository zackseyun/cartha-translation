source:
  edition: WLC
  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: ru
  text: Но если вы отвернётесь, оставите Мои установления и заповеди, которые Я дал вам, и пойдёте служить другим богам и поклоняться им,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְשׁוּבוּן
  choice: отвернётесь
  rationale: В данном условном предостережении глагол שׁוב обозначает отход от Бога; «отвернётесь» естественно передаёт направление прочь без добавления отсутствующих в тексте уточнений.
- source_word: וַעֲזַבְתֶּם
  choice: оставите
  rationale: Передаёт עזב как сознательное оставление Божьих установлений и заповедей; современно и без излишнего усиления.
- source_word: חֻקּוֹתַי
  choice: Мои установления
  rationale: «Установления» сохраняет нормативно-правовой смысл חֻקּוֹת и естественно отличается от следующего «заповеди».
- source_word: מִצְוֺתַי
  choice: заповеди
  rationale: Обычный и точный русский эквивалент для מִצְוֹת.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: Я дал вам
  rationale: Идиома буквально означает «дал/положил перед вами»; в современном русском «дал вам» ясно передаёт предъявление народу законов без неестественного буквализма.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: служить другим богам
  rationale: Сохраняет культовый смысл עבד и стандартное обозначение чужих божеств.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: поклоняться им
  rationale: Точно передаёт религиозное преклонение перед другими богами.
theological_decisions:
- issue: Характер отхода, выраженного глаголом שׁוב
  choice: «отвернётесь» без поясняющего дополнения
  alternative: «отвернётесь от Меня» или «отступите»
  rationale: Контекст подразумевает отход от Бога, однако дополнение «от Меня» отсутствует в еврейском тексте; выбранный вариант сохраняет и смысл, и формальную недосказанность.
- issue: Различение חֻקּוֹת и מִצְוֹת
  choice: «установления и заповеди»
  alternative: обобщённое «законы и заповеди»
  rationale: Два разных термина сохранены раздельно, без навязывания конфессиональной классификации видов закона.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Заглавные буквы в местоимениях «Мои», «Я» обозначают говорящего Бога по принятой русской издательской традиции. Конечная запятая сохранена, поскольку условное предложение продолжается в следующем стихе.
