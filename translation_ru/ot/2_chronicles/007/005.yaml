base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: ru
  text: Царь Соломон принёс в жертву двадцать две тысячи голов крупного скота и сто двадцать тысяч голов мелкого скота[a], и царь и весь народ посвятили дом Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское собирательное слово может обозначать овец и коз вместе.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: принёс в жертву
  rationale: В жертвенном контексте זבח означает заколоть или принести как жертву. Русское выражение ясно передаёт культовый смысл и звучит естественнее буквального «заколол».
- source_word: זֶבַח הַבָּקָר
  choice: двадцать две тысячи голов крупного скота
  rationale: בקר обозначает крупный рогатый скот, то есть животных из стада. Счётное слово «голов» естественно при столь большом количестве и не добавляет вида животных, отсутствующего в исходном тексте.
- source_word: וְצֹאן
  choice: овец и коз
  rationale: צאן — собирательное обозначение мелкого скота, которое может охватывать как овец, так и коз. Эта передача понятна современному читателю и не сужает значение до одних овец.
- source_word: וַיַּחְנְכוּ
  choice: посвятили
  rationale: Здесь חנך означает торжественно предназначить и ввести в священное употребление. «Посвятили» передаёт это значение без излишнего уточнения обряда.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Бога
  rationale: Передача сохраняет исходный образ «дома Бога» и остаётся понятной в контексте храма; вариант «храм Бога» был бы более истолковывающим.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: царь и весь народ
  rationale: После упоминания Соломона исходный текст вновь называет его «царём» и соединяет с ним весь народ; это повторение сохранено.
theological_decisions:
- issue: Значение посвящения храма
  choice: посвятили дом Бога
  alternative: освятили храм Бога
  rationale: «Посвятили» ближе к значению חנך — торжественно ввести в назначенное употребление — и не привносит более узкого представления о ритуальном освящении.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Сохранены единая протяжённая структура стиха, повтор слова «царь» и буквальный образ «дома Бога».
