revisions:
- from: Царь Соломон принёс в жертву двадцать две тысячи голов крупного скота и сто двадцать тысяч овец и коз[a], и царь и весь народ посвятили дом Бога.
  to: Царь Соломон принёс в жертву двадцать две тысячи голов крупного скота и сто двадцать тысяч голов мелкого скота[a], и царь и весь народ посвятили дом Божий.
  rationale: Заменено конкретизирующее «овец и коз» на «мелкого скота», чтобы не утверждать состав животных, не определённый еврейским צֹאן. Сноска сохраняет полезное уточнение. «Дом Бога» заменён на более естественное «дом Божий»; остальные элементы сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:39:22Z'
review_pass:
  verdict: revise
  source_fidelity: Смысл жертвенного действия, числа, повторное обозначение Соломона как «царя» и посвящение святилища переданы верно. Однако צֹאן — собирательное обозначение мелкого скота и не утверждает, что в данном перечне были непременно и овцы, и козы; такую неоднозначность следует сохранить в основном тексте. Для בֵּית הָאֱלֹהִים естественное русское библейское соответствие — «дом Божий».
  naturalness: «Голов крупного скота» приемлемо, но параллельное «голов мелкого скота» делает перечень ясным и естественным. «Дом Бога» грамматически возможно, однако «дом Божий» существенно более идиоматично в современном литературном и библейском русском регистре.
  terminology: «Принёс в жертву» и «посвятили» удачно передают זבח и חנך. «Крупный скот» / «мелкий скот» точно сохраняют родовые категории исходного текста. «Дом Божий» — устоявшееся и естественное соответствие выражению «дом Бога».
  issues:
  - severity: medium
    issue: «Овец и коз» снимает лексическую неоднозначность צֹאן.
    rationale: Цֹאן может охватывать овец и коз как мелкий скот, но сам термин не требует наличия обоих видов. Основной текст должен сохранить эту широту; пояснение уместно в сноске.
  - severity: low
    issue: «Дом Бога» менее естественно, чем «дом Божий».
    rationale: Оба варианта передают исходный генитив, но «дом Божий» — нормальная русская библейская коллокация и не меняет смысла.
