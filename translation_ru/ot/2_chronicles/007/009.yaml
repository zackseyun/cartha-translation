base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: ru
  text: В восьмой день они провели торжественное собрание[a], ибо семь дней они совершали[b] посвящение жертвенника, и праздник — семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «особое собрание» или «заключительное собрание». Еврейское слово עֲצָרֶת обозначает особое собрание, которым завершался священный праздник.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «праздновали»; букв.: «делали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָרֶת
  choice: торжественное собрание
  rationale: Существительное обозначает особое собрание в завершение священного праздника. Этот перевод передаёт его празднично-религиозный характер, не добавляя отсутствующего в тексте определения «священное».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему собрание состоялось в восьмой день.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: посвящение жертвенника
  rationale: Сочетание обозначает обрядовое посвящение, или введение в употребление, жертвенника; «посвящение» естественно и точно в данном контексте.
- source_word: עָשׂוּ
  choice: совершали
  rationale: Буквальное «делали» по-русски неестественно при слове «посвящение»; «совершали» сохраняет событийно-обрядовый смысл, а сноска отмечает возможные варианты.
- source_word: וְהֶחָג
  choice: и праздник
  rationale: Определённая форма указывает на известный из контекста праздник. Сам стих не называет его, поэтому конкретное название не добавлено.
- source_word: שִׁבְעַת יָמִים
  choice: семь дней
  rationale: Русская конструкция естественно выражает длительность без обязательного предлога.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: В восьмой день
  rationale: Перевод следует краткой форме еврейского текста и не добавляет пояснения «праздника», хотя оно подразумевается контекстом.
