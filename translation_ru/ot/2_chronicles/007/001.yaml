  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: ru
  text: Когда Соломон закончил молиться, огонь сошёл с небес и поглотил всесожжение и жертвы, и слава Яхве наполнила храм[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом». Здесь имеется в виду храм.'
    reason: Лексико-культурное пояснение значения הַבָּיִת в данном контексте.
lexical_decisions:
- source_word: וּכְכַלּוֹת
  choice: Когда … закончил
  rationale: Сочетание союза, כְּ и инфинитива образует придаточное времени; такой перевод естественно передаёт последовательность событий, не добавляя значения немедленности.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: לְהִתְפַּלֵּל
  choice: молиться
  rationale: При глаголе «закончил» русский инфинитив естественно передаёт еврейскую конструкцию и сохраняет её смысл.
- source_word: וְהָאֵשׁ
  choice: огонь
  rationale: Определённость еврейского существительного в русском контексте выражается без обязательного отдельного показателя; речь идёт о ниспосланном Богом огне.
- source_word: יָרְדָה מֵהַשָּׁמַיִם
  choice: сошёл с небес
  rationale: «Сошёл» точно передаёт движение вниз, а «с небес» — обычное русское соответствие еврейскому שׁמים в данной формуле.
- source_word: וַתֹּאכַל
  choice: поглотил
  rationale: Глагол буквально связан с поеданием, но при подлежащем «огонь» слово «поглотил» звучит естественно и сохраняет образ полного уничтожения огнём.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: וְהַזְּבָחִים
  choice: и жертвы
  rationale: Общее обозначение жертв сохраняет отличие от отдельно названного всесожжения.
- source_word: וּכְבוֹד יְהוָה
  choice: а слава Яхве
  rationale: Союз естественно передан как «а», отмечая следующий результат; כבוד обозначает явленную славу Бога, а личное имя передано транслитерацией «Яхве».
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: наполнила храм
  rationale: Буквально הַבַּיִת означает «дом», однако в непосредственном контексте речь о храме. «Храм» ясно передаёт предмет речи современному читателю, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение הַבָּיִת
  choice: храм
  alternative: дом
  rationale: Слово буквально означает «дом», но здесь однозначно указывает на освящаемый Иерусалимский храм. Основной текст передаёт контекстуальный смысл, а сноска сохраняет буквальную форму.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис простой и ясный; культовый термин «всесожжение» сохранён ради точности.
