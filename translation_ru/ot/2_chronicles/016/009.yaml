language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: ru
  text: Ведь очи ГОСПОДА обозревают всю землю, чтобы укреплять тех, чьё сердце всецело предано Ему[a]. В этом ты поступил неразумно, и потому отныне у тебя будут войны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы являть Свою силу ради тех, чьё сердце безраздельно обращено к Нему».'
    reason: Лְהִתְחַזֵּק может означать не только укрепление других, но и проявление собственной силы; שָׁלֵם допускает передачу через цельность и безраздельность сердца.
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции формой, выделенной прописными буквами.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: очи ГОСПОДА обозревают
  rationale: Сохраняет антропоморфный образ и выражает постоянный, деятельный охват взглядом; «очи» поддерживает достойный библейский регистр.
- source_word: בְּכָל הָאָרֶץ
  choice: всю землю
  rationale: Универсальный характер высказывания лучше передаётся словом «земля», а не более узким «страна».
- source_word: לְהִתְחַזֵּק עִם
  choice: чтобы укреплять
  rationale: В контексте форма выражает благотворное проявление силы ГОСПОДА ради верных Ему; возможный возвратный оттенок отражён в сноске.
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: тех, чьё сердце всецело предано Ему
  rationale: Передаёт цельность и неразделённость верности, не подразумевая безгрешного совершенства.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: В этом ты поступил неразумно
  rationale: Естественно и прямо передаёт пророческий укор, не смягчая его смысла.
- source_word: כִּי מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: и потому отныне у тебя будут войны
  rationale: «Потому» передаёт причинную связь с предыдущим поступком, а русская конструкция ясно выражает будущие военные столкновения.
theological_decisions:
- issue: Значение שָׁלֵם применительно к сердцу
  choice: всецелая, неразделённая преданность
  alternative: непорочность или совершенство
  rationale: Контекст противопоставляет упование на ГОСПОДА политической опоре; речь идёт о цельной верности, а не о безгрешности.
- issue: Смысл לְהִתְחַזֵּק עִם
  choice: укреплять верных
  alternative: являть Свою силу ради верных
  rationale: Основной текст естественно выражает поддержку людей Богом, а сноска сохраняет возможный рефлексивный оттенок еврейской формы.
- issue: Объём значения הָאָרֶץ
  choice: вся земля
  alternative: вся страна
  rationale: Изречение имеет обобщённый, универсальный характер и говорит о всепроникающем надзоре ГОСПОДА.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Слово «очи» сохраняет образность оригинала; остальная фраза построена ясно и естественно для современного читателя.
