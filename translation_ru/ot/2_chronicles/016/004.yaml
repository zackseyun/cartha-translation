  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ אֶל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכּוּ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל מָ֑יִם וְ/אֵ֥ת כָּֽל מִסְכְּנ֖וֹת עָרֵ֥י נַפְתָּלִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: ru
  text: Бен-Хадад послушал царя Асу и послал военачальников своих войск против городов Израиля. Они поразили Ийон, Дан, Авел-Маим[a] и все города-хранилища Неффалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит «Авел-Маим»; некоторые отождествляют этот город с Авел-Бет-Маахой, известной по параллельным местам.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: послушал
  rationale: В данном контексте глагол означает не просто услышать, а благосклонно откликнуться на просьбу Асы; «послушал» сохраняет оба оттенка, не усиливая значение до «повиновался».
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: военачальников своих войск
  rationale: שָׂרֵי обозначает военных начальников, הַחֲיָלִים — военные силы или войска, а אֲשֶׁר לוֹ выражает принадлежность Бен-Хададу. Такая формулировка естественна для современного русского языка.
- source_word: עָרֵי יִשְׂרָאֵל
  choice: городов Израиля
  rationale: Прямая географическая и политическая отсылка к городам северного Израильского царства.
- source_word: וַיַּכּוּ
  choice: поразили
  rationale: В военном повествовании נכה может означать ударить, напасть или разгромить. «Поразили» сохраняет широту значения и не уточняет результат нападения сверх сказанного в тексте.
- source_word: עִיּוֹן
  choice: Ийон
  rationale: Транслитерация еврейского географического названия עִיּוֹן с сохранением согласного йод.
- source_word: אָבֵל מָיִם
  choice: Авел-Маим
  rationale: Перевод следует непосредственно масоретскому чтению אָבֵל מָיִם и не гармонизирует его с названием Авел-Бет-Мааха из параллельных мест.
- source_word: מִסְכְּנוֹת
  choice: города-хранилища
  rationale: Термин обозначает места или города, предназначенные для хранения припасов и запасов. «Города-хранилища» ясно передаёт эту функцию в современном русском языке.
- source_word: עָרֵי נַפְתָּלִי
  choice: Неффалима
  rationale: Сочетание указывает на города, относящиеся к племенной области Неффалима; краткая форма естественно включается в выражение «города-хранилища Неффалима».
theological_decisions: []
