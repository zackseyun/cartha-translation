  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: ru
  text: На тридцать шестом году царствования Асы[a] Вааса, царь Израиля, выступил против Иудеи и построил Раму, чтобы никто не мог ни выйти, ни войти к Асе, царю Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «на тридцать шестом году царствования Асы». Это создаёт хронологическое расхождение с данными 3 Царств о правлении Ваасы. Некоторые отсчитывают этот год от разделения царства; другие предлагают согласующую текстовую поправку.'
    reason: Сохранение хронологической трудности и указание основных вариантов её объяснения без молчаливого исправления текста.
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֵׁשׁ לְמַלְכוּת אָסָא
  choice: На тридцать шестом году царствования Асы
  rationale: Временная конструкция с ב и מַלְכוּת прямо указывает на тридцать шестой год царствования Асы; формулировка естественна для современного литературного русского языка.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: выступил против Иудеи
  rationale: В военном контексте сочетание עלה с עַל обозначает поход или выступление против кого-либо; перевод передаёт военный смысл, не добавляя лишних подробностей.
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: и отстроил Раму
  rationale: בנה означает «строить»; в отношении уже существующего города здесь естественно русское «отстроил», передающее строительные работы без прямого внесения более узкого значения «укрепил».
- source_word: לְבִלְתִּי תֵּת
  choice: чтобы никто не мог
  rationale: Оборот выражает цель и предотвращение. Русская конструкция ясно передаёт намерение воспрепятствовать передвижению.
- source_word: יוֹצֵא וָבָא
  choice: ни выйти, ни войти
  rationale: Сохранена парная еврейская формула движения, естественно оформленная по-русски с повторяющимся отрицательным союзом «ни».
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: к Асе, царю Иудеи
  rationale: Предлог ל передаёт направленность или отношение к Асе; русский дательный падеж после «к» сохраняет буквальный ракурс текста, тогда как контекст допускает более широкое ограничение сообщения с ним.
theological_decisions:
- issue: Хронологическое расхождение со временем царствования Ваасы по 3 Царств
  choice: Сохранить в основном тексте масоретское чтение «на тридцать шестом году царствования Асы»
  alternative: Отсчитывать тридцать шестой год от разделения царства либо принять конъектуру «на двадцать шестом году царствования Асы»
  rationale: Масоретский текст недвусмысленно содержит число тридцать шесть и связывает его с царствованием Асы. Перевод не должен без текстового основания устранять историко-хронологическую трудность; основные объяснения следует обозначить в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Имена переданы в привычной русской библейской форме: Аса, Вааса, Рама. Синтаксис сделан ясным для широкого читателя, при этом сохранены повтор титула «царь Иудеи» и напряжение исходного текста.'
