reference: 2 Chronicles 16:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: ru
  text: 'В то время провидец Ханани пришёл к Асе, царю Иудеи, и сказал ему: «Поскольку ты положился на царя Арама[a] и не положился на Яхве, Бога твоего, поэтому войско царя Арама ускользнуло из твоих рук».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сирии». В еврейском тексте — «Арам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: В то время
  rationale: Естественная русская формула временного перехода; начальный союз не выражен отдельно, поскольку в русском повествовании он здесь избыточен.
- source_word: הָרֹאֶה
  choice: провидец
  rationale: Сохраняет особый древнееврейский титул רֹאֶה и не отождествляет его без необходимости с более общим словом «пророк».
- source_word: אָסָא מֶלֶךְ יְהוּדָה
  choice: Асе, царю Иудеи
  rationale: Имя и царский титул переданы естественной русской конструкцией с приложением.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: За то, что ты положился ... а не ...
  rationale: «Положиться на» естественно передаёт политическое и богословское упование; единая конструкция сохраняет противопоставление двух объектов доверия.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Сохраняет историческое название Арам, непосредственно стоящее в еврейском тексте.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Яхве, Бога твоего
  rationale: Передаёт тетраграмматон личным именем «Яхве» и сохраняет торжественный библейский порядок в обращении.
- source_word: עַל כֵּן
  choice: за то ... войско ... ускользнуло
  rationale: Причинно-следственная связь выражена единой естественной русской конструкцией «за то, что», без отдельного тяжеловесного «поэтому».
- source_word: נִמְלַט
  choice: ускользнуло
  rationale: Передаёт завершившееся избавление неприятельского войска от власти Асы; форма согласована с собирательным существительным «войско».
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: войско царя Арама
  rationale: В военном контексте חֵיל означает вооружённую силу или войско; «войско» звучит естественно и достойно.
- source_word: מִיָּדֶךָ
  choice: из твоих рук
  rationale: Сохраняет понятный русский библейский образ утраченного контроля, передавая единственное число древнееврейского идиома естественным русским множественным числом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Смысл противопоставления упования
  choice: положился на царя Арама, а не на Яхве
  alternative: опёрся на царя Арама и не опёрся на Яхве
  rationale: Глагольный повтор передан общей русской конструкцией, ясно сохраняющей напряжение между политической опорой и доверием Богу.
- issue: Субъект, который избежал власти Асы
  choice: войско царя Арама
  alternative: сила царя Арама; царь Арама со своим войском
  rationale: Грамматическим подлежащим является חֵיל, то есть войско или военная сила; перевод не расширяет его до самого царя.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; историческое название «Арам» сохранено, а более привычный вариант дан в сноске.
