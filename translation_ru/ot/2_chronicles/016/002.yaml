source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: ru
  text: 'Тогда Аса вынес серебро и золото из сокровищниц дома Яхве и дома царя и послал их Бен-Хададу, царю Арама[a], жившему в Дамаске, сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царю Сирии».'
    reason: 'Лексическая альтернатива: еврейское אֲרָם — «Арам»; в традиционных переводах это название нередко передаётся как «Сирия».'
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: вынес
  rationale: Порода hифиль глагола יצא обозначает действие, при котором нечто выносят наружу; «вынес» естественно передаёт изъятие ценностей из сокровищниц.
- source_word: כֶּסֶף וְזָהָב
  choice: серебро и золото
  rationale: Сохранено прямое обозначение двух драгоценных металлов без обобщения до «богатств» или «денег».
- source_word: מֵאֹצְרוֹת
  choice: из сокровищниц
  rationale: Передано множественное число еврейского существительного; по контексту речь идёт о местах хранения храмовых и царских ценностей.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохранён буквальный образ «дома» и передано собственное имя יְהוָה, а не его традиционная замена титулом.
- source_word: וּבֵית הַמֶּלֶךְ
  choice: и дома царя
  rationale: Формулировка сохраняет параллелизм двух «домов»; в данном контексте дом царя означает царский дворец.
- source_word: וַיִּשְׁלַח
  choice: и послал их
  rationale: Местоимение «их» естественно для русского языка и ясно отсылает к упомянутым серебру и золоту, хотя в еврейском объект подразумевается.
- source_word: אֶל בֶּן הֲדַד
  choice: Бен-Хададу
  rationale: Имя передано транслитерацией и поставлено в дательный падеж согласно русскому управлению глагола «послал».
- source_word: מֶלֶךְ אֲרָם
  choice: царю Арама
  rationale: Арам передан как собственное географическое имя исходного текста, без замены исторически традиционным названием «Сирия».
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: жившему в Дамаске
  rationale: Причастный оборот естественно передаёт постоянное пребывание Бен-Хадада в Дамаске и согласован с формой дательного падежа.
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Сохранена обычная повествовательная формула, вводящая прямую речь в следующем стихе.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» передаёт его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, повествовательным звучанием. Повтор «дома Яхве и дома царя» намеренно сохраняет структуру и параллелизм еврейского текста; двоеточие подготавливает прямую речь следующего стиха.
