  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: ru
  text: Его похоронили в гробнице, которую он высек для себя в Городе Давида. Его положили на ложе[a], наполненное благовониями и различными ароматическими составами, искусно приготовленными мастером, и устроили в его честь весьма великое сожжение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на постель» или «на погребальные носилки». Еврейское слово обозначает место, где лежат; здесь, вероятно, имеется в виду погребальное ложе.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, речь идёт о почётном сожжении благовоний или других ароматических веществ во время погребения, а не о кремации тела; еврейский текст не называет, что именно сжигали.
    reason: cultural_note
lexical_decisions:
- source_word: בְקִבְרֹתָיו
  choice: в гробнице
  rationale: Форма во множественном числе может обозначать принадлежавший Асе погребальный комплекс; в данном контексте естественное русское единственное число передаёт место его погребения без представления о нескольких отдельных могилах.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: которую он высек для себя
  rationale: כּרה означает выкапывать или вырубать; применительно к царской гробнице «высек» естественно передаёт вероятную работу в скале.
- source_word: בַּמִּשְׁכָּב
  choice: на ложе
  rationale: 'מִשְׁכָּב — место, где лежат: постель, ложе или погребальные носилки. «Ложе» сохраняет широту значения и подходит к погребальному контексту.'
- source_word: בְּשָׂמִים וּזְנִים
  choice: благовониями и разными ароматическими составами
  rationale: בְּשָׂמִים обозначает ароматические вещества, а редкое וּזְנִים, вероятно, их виды или разновидности. Перевод передаёт ароматический и составной характер веществ, не утверждая более точного значения редкого слова.
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: приготовленными искусством составителя благовоний
  rationale: Корень רקח связан с профессиональным смешиванием благовоний и мазей; оборот подчёркивает искусную работу мастера.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: и совершили в его честь чрезвычайно великое сожжение
  rationale: Сохранена внутренняя конструкция «сожгли сожжение» и значение לוֹ как действия в его честь. Формулировка не добавляет отсутствующий в тексте объект сожжения и не отождествляет обряд с кремацией.
theological_decisions:
- issue: Что было сожжено при погребении Асы
  choice: Основной текст сохраняет неопределённость и говорит о великом сожжении в его честь.
  alternative: Прямо указать, что сожгли тело, либо прямо вставить в текст благовония как объект сожжения.
  rationale: Сначала стих недвусмысленно сообщает о погребении тела, а затем упоминает совершённое «для него» сожжение. Контекст допускает почётное сожжение ароматических веществ, но сам еврейский текст не называет объекта, поэтому уточнение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис разделён на два предложения для ясности; редкие ремесленные и погребальные термины переданы понятно, а подлинная неопределённость обряда сохранена.
