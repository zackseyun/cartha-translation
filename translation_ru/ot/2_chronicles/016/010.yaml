  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: ru
  text: Тогда Аса разгневался на провидца и заключил его в темницу[a], потому что Аса был в ярости на него из-за этого. В то время Аса также жестоко притеснял[b] некоторых из народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дом колодок»; еврейское выражение, вероятно, обозначает место заключения, где узников удерживали с помощью колодок или иных средств.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол буквально означает «сокрушать», «разбивать» и здесь передаёт суровое, насильственное обращение с людьми.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: разгневался
  rationale: Глагол כעס обозначает гнев или раздражение; «разгневался» естественно передаёт наступившую реакцию Асы в повествовании.
- source_word: הָרֹאֶה
  choice: прозорливца
  rationale: רֹאֶה — старинное обозначение пророческого лица, буквально «видящий». «Прозорливец» сохраняет отличие от более общего слова «пророк» и подходит возвышенному повествовательному регистру.
- source_word: וַיִּתְּנֵהוּ בֵּית הַמַּהְפֶּכֶת
  choice: заключил его в темницу
  rationale: נתן с указанием места означает помещение человека туда; трудное выражение בֵּית הַמַּהְפֶּכֶת указывает на место заключения, вероятно связанное с колодками или иным удержанием.
- source_word: בְזַעַף עִמּוֹ עַל זֹאת
  choice: из-за этого был в ярости на него
  rationale: זַעַף выражает сильное негодование или ярость; оборот сохраняет направленность гнева на прозорливца и его причину.
- source_word: וַיְרַצֵּץ
  choice: жестоко притеснял
  rationale: Пиэль глагола רצץ несёт сильный образ сокрушения и в отношении людей обозначает суровое, насильственное обращение. «Жестоко притеснял» передаёт как общественное угнетение, так и интенсивность действия, не утверждая буквального физического сокрушения.
- source_word: מִן הָעָם
  choice: некоторых из народа
  rationale: 'Предлог מן имеет здесь партитивное значение: речь идёт не обо всём народе, а о части людей.'
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Обычная и естественная русская передача временного оборота.
