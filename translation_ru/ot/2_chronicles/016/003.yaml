base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: ru
  text: Между мной и тобой есть договор[a], и между моим отцом и твоим отцом. Вот, я послал тебе серебро и золото. Пойди, расторгни свой договор с Ваасой, царём Израиля, чтобы он отступил от меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «союз»; еврейское слово בְּרִית может также означать «завет», но здесь речь идёт о политическом соглашении между царями.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и пусть он поднимется от меня»; вероятно, имеется в виду, что Вааса прекратит военные действия или давление на Асу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: договор
  rationale: В данном дипломатическом контексте речь идёт о политическом соглашении между царями; «договор» естественно передаёт смысл и сохраняет повтор одного еврейского слова.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: между мной и тобой, как был он между моим отцом и твоим отцом
  rationale: Русская конструкция передаёт параллельную дипломатическую формулу; связка «как был он» естественно выражает подразумеваемое продолжение фразы без изменения её смысла.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» современно и естественно привлекает внимание к посылаемым ценностям.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: я посылаю тебе серебро и золото
  rationale: В дипломатическом послании еврейский перфект может обозначать действие, совершаемое вместе с отправкой письма; настоящее время в русском звучит естественно.
- source_word: לֵךְ
  choice: пойди
  rationale: Прямое повеление, вводящее требуемое действие; «пойди» лучше сочетается с последующим императивом в русском.
- source_word: הָפֵר
  choice: расторгни
  rationale: В породе hифиль глагол означает нарушить или аннулировать соглашение; «расторгни договор» — точное и естественное дипломатическое выражение.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: свой договор с Ваасой
  rationale: Отношение договора с названным лицом естественно выражается в русском предлогом «с».
- source_word: וְיַעֲלֶה מֵעָלַי
  choice: чтобы он отступил от меня
  rationale: Буквально оборот говорит о том, чтобы Вааса «поднялся/ушёл от» Асы; в контексте имеется в виду прекращение военного давления или отход.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Стандартный библейский царский титул, переданный непосредственно.
