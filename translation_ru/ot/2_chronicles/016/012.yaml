base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: ru
  text: На тридцать девятом году своего царствования Аса заболел ногами, и болезнь его стала чрезвычайно тяжёлой. Но даже во время болезни он не обращался к Яхве, а к врачам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не искал Яхве, а врачей». Еврейская заключительная фраза эллиптична: она противопоставляет поиск Яхве обращению к врачам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: заболел
  rationale: Глагол חלה означает «заболеть, стать немощным»; естественное русское «заболел» точно передаёт наступление болезни.
- source_word: בְּרַגְלָיו
  choice: ногами
  rationale: רֶגֶל может обозначать стопу или ногу; при заболевании по-русски естественнее сказать «заболел ногами», не уточняя локализацию сверх еврейского текста.
- source_word: עַד לְמַעְלָה
  choice: чрезвычайно тяжёлой
  rationale: В данном контексте оборот выражает крайнюю степень тяжести болезни, а не пространственное направление.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: болезнь его / во время болезни
  rationale: «Болезнь» сохраняет повтор ключевого понятия; во втором случае конструкция передана естественным современным русским оборотом.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: искал помощи у Яхве
  rationale: דרש здесь означает обращаться к Богу, искать Его или вопрошать Его. Добавление «помощи» делает эллиптическое противопоставление понятным по-русски, не сводя смысл лишь к получению сведений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: כִּי בָּרֹפְאִים
  choice: а у врачей
  rationale: Еврейская фраза эллиптична, буквально близка к «но/ибо во врачах»; русский вариант восполняет подразумеваемое обращение за помощью и сохраняет резкий контраст.
theological_decisions:
- issue: Осуждает ли стих врачебную помощь как таковую или то, что Аса не обратился к Богу?
  choice: 'Сохранён контраст: Аса искал помощи не у Яхве, а у врачей, без общего осуждения медицины.'
  alternative: Понять стих как безусловный запрет обращаться к врачам.
  rationale: Текст порицает прежде всего отсутствие обращения к Яхве и противопоставляет ему обращение к врачам; он не формулирует универсального запрета на лечение.
- issue: Следует ли понимать דרש только как просьбу об исцелении?
  choice: «искал помощи» передаёт контекстуальное направление обращения, сохраняя широкий смысл упования и поиска Бога.
  alternative: «вопрошал Яхве» или просто «искал Яхве».
  rationale: В контексте тяжёлой болезни речь естественно идёт о помощи, однако еврейский глагол шире формальной молитвы об исцелении; примечание сохраняет возможную передачу через «обращался».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; эллипсис заключительной фразы раскрыт минимально, а его неоднозначность отмечена в сноске.
