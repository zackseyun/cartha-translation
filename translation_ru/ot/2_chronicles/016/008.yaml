revisions:
- from: Разве кушиты и лувимы не были огромным войском, с бесчисленным множеством колесниц и всадников? Но когда ты положился на Яхве, Он отдал их в твои руки.
  to: Разве кушиты и лубимы не были огромным войском, с очень многими колесницами и всадниками? Но когда ты положился на Яхве, Он отдал их в твои руки.
  rationale: Убрана не поддерживаемая оригиналом идея неисчислимости, при этом сохранено эмфатическое указание на большое число колесниц и всадников. Уточнено написание этнонима. Остальные решения соответствуют еврейскому тексту и английской аудиторской основе.
