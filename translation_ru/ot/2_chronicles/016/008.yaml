  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: ru
  text: Разве кушиты и лубимы не были огромным войском, с очень многими колесницами и всадниками? Но когда ты положился на Яхве, Он отдал их в твои руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: הַכּוּשִׁים
  choice: кушиты
  rationale: Транслитерация древнего этнонима сохраняет близость к еврейскому тексту и не отождествляет его безоговорочно с более поздней Эфиопией.
- source_word: וְהַלּוּבִים
  choice: и лувимы
  rationale: Форма «лувимы» близко передаёт еврейский этноним и не навязывает спорного отождествления с ливийцами.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: были огромным войском
  rationale: חַיִל в контексте означает войско, а לָרֹב подчёркивает его многочисленность.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: с бесчисленным множеством колесниц и всадников
  rationale: Естественно по-русски передаёт усиленное указание на чрезвычайно большое число колесниц и всадников.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: Но когда ты положился на
  rationale: «Положился на» передаёт метафору опоры как доверия; «когда» сохраняет обстоятельственное значение конструкции, а «но» выражает контраст аргумента.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: Он отдал их в твои руки
  rationale: Сохраняет понятный в русском языке библейский образ передачи врагов во власть победителя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Связь упования с победой
  choice: «когда ты положился ... Он отдал»
  alternative: «поскольку ты положился ... Он отдал»
  rationale: Конструкция בְּ + инфинитив прежде всего обозначает обстоятельство времени; причинный оттенок следует из контекста, но не делается грамматически более однозначным, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены риторический вопрос, этнонимы, контраст и идиома «в твои руки»; местоимение «Он» написано с прописной буквы по принятой русской традиции благоговейного обозначения Бога.
