revisions:
- from: Тогда царь Аса созвал всю Иудею[a], и они унесли камни и брёвна из Рамы, которыми Вааса укреплял её[b]. Из них Аса построил Геву и Мицпу.
  to: Тогда царь Аса созвал всю Иудею[a], и они унесли камни Рамы и её строевой лес, которыми строил Вааса[b]. Из них Аса построил Геву и Мицпу.
