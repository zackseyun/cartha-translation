base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: ru
  text: Тогда царь Аса созвал всю Иудею[a], и они унесли камни Рамы и её строевой лес, которыми строил Вааса[b]. Из них Аса построил Геву и Мицпу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взял всю Иудею»; то есть собрал или мобилизовал жителей Иудеи для работ.'
    reason: lexical_alternative
  - marker: b
    text: То есть камни и строевой лес, которые Вааса использовал при строительстве Рамы.
    reason: clarification
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: созвал всю Иудею
  rationale: 'Буквально: «взял всю Иудею». В данном контексте выражение означает, что Аса собрал или мобилизовал жителей Иудеи для работ; буквальная калька по-русски была бы неестественной и могла бы ввести в заблуждение.'
- source_word: וַיִּשְׂאוּ
  choice: они унесли
  rationale: Глагол נשׂא здесь обозначает поднятие и перенос строительных материалов из Рамы.
- source_word: אַבְנֵי הָרָמָה וְאֶת עֵצֶיהָ
  choice: камни и брёвна из Рамы
  rationale: Форма עֵצֶיהָ буквально означает «её древесину/деревья»; в строительном контексте естественно передать её как «брёвна». Предлог «из» ясно выражает удаление материалов из Рамы.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: которыми Вааса укреплял её
  rationale: Относительное предложение относится к камням и древесине как материалам, использованным Ваасой при строительстве Рамы. «Укреплял» передаёт контекст фортификационных работ, а местоимение «её» делает подразумеваемый объект ясным.
- source_word: וַיִּבֶן בָּהֶם
  choice: из них Аса построил
  rationale: Единственное число глагола указывает на Асу как действующее лицо, а местоимение — на вывезенные материалы. Имя повторено для ясности при смене числа сказуемого.
- source_word: גֶּבַע וְאֶת הַמִּצְפָּה
  choice: Геву и Мицпу
  rationale: Использованы традиционные русские библейские формы топонимов; падежные окончания соответствуют синтаксису русского предложения.
