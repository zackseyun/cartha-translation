  - severity: low
    issue: «брёвна»
    rationale: עֵצֶיהָ обозначает её древесину/лесоматериалы. «Брёвна» не невозможно, но конкретизирует вид материала. «Строевой лес» естественнее в данном строительном контексте и менее узко.
