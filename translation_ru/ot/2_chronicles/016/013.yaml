  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: ru
  text: И почил Аса с отцами своими[a], и умер на сорок первом году своего царствования.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лёг с отцами своими» — принятое древнееврейское выражение, обозначающее смерть и приобщение к умершим предкам.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Передаёт традиционную формулу о смерти, сохраняя её образность и не дублируя буквально следующее «умер» русским «уснул».
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохраняет семейно-династический смысл и традиционную форму еврейского выражения; значение предков поясняется в сноске.
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямо передаёт מות и сохраняет намеренное сочетание образной формулы с явным сообщением о смерти.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: на сорок первом году
  rationale: Естественная русская передача порядкового значения древнееврейской формулы датировки.
- source_word: לְמָלְכוֹ
  choice: своего царствования
  rationale: В контексте хронологии правления царя это точный и естественный русский эквивалент.
- source_word: אָסָא
  choice: Аса
  rationale: Устоявшаяся русская библейская форма личного имени.
