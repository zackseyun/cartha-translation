lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда … услышал об этом
  rationale: Оборот вводит придаточное времени. В русском естественно опустить буквальное «и было»; «об этом» восполняет подразумеваемое из предыдущего контекста содержание услышанного.
- source_word: בַּעְשָׁא
  choice: Вааса
  rationale: Традиционная русская библейская передача имени; форма именительного падежа сохраняется как у несклоняемого имени.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: перестал укреплять
  rationale: חדל с מן и инфинитивом означает прекращение действия. בנה буквально значит «строить», но применительно к городу в данном военном контексте обозначает его обустройство или укрепление.
- source_word: אֶת הָרָמָה
  choice: Раму
  rationale: Название города передано в принятой русской форме и поставлено в винительный падеж как прямое дополнение.
- source_word: וַיַּשְׁבֵּת אֶת מְלַאכְתּוֹ
  choice: и прекратил работы
  rationale: Каузативная форма שבת означает «остановить, прекратить»; собирательное מלאכה здесь естественно передать множественным «работы», относящимся к строительному проекту.
