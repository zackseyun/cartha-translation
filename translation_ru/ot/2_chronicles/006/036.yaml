  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: ru
  text: Когда они согрешат против тебя — ведь нет человека, который не грешил бы, — и ты разгневаешься на них, отдашь их врагу, и их пленители уведут их в далёкую или близкую землю,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Когда они согрешат против тебя
  rationale: Начальное כִּי вводит предполагаемое обстоятельство в молитве Соломона. «Когда» естественно передаёт контекст, где грех рассматривается как неизбежная человеческая реальность; לָךְ при חטא обозначает направленность проступка против Бога.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: ведь нет человека, который не грешил бы
  rationale: Второе כִּי имеет пояснительное значение «ведь/ибо». אָדָם употреблено обобщённо; русское «человек» сохраняет единственное число и охватывает человечество в целом. Сослагательная форма после отрицательной конструкции звучит естественно по-русски.
- source_word: וְאָנַפְתָּ בָם
  choice: и ты разгневаешься на них
  rationale: Глагол אנף выражает гнев. «Разгневаешься» сохраняет последовательность будущих форм и dignified prayer register, не усиливая значение до ярости.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: отдашь их врагу
  rationale: Сочетание נתן לפני אויב означает отдать людей во власть врага. Русское «отдашь их врагу» передаёт этот смысл без буквального и неестественного «перед лицом врага»; единственное число אוֹיֵב сохранено.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: а пленившие их уведут их
  rationale: Еврейский текст использует однокоренные формы глагола שׁבה и причастия «их пленители». Перевод сохраняет субъект и смысл насильственного увода, избегая тяжеловесного повтора «пленят в плен».
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: в далёкую или близкую землю
  rationale: Сохранено краткое противопоставление רְחוֹקָה / קְרוֹבָה без добавления не указанной в тексте точки отсчёта.
theological_decisions:
- issue: Обобщённое אָדָם в утверждении о всеобщности человеческого греха
  choice: нет человека, который не грешил бы
  alternative: нет никого, кто не грешил бы
  rationale: «Человек» прямо соответствует обобщённому אָדָם, естественно звучит по-русски и сохраняет представительное единственное число, не сужая и не расширяя богословское утверждение.
- issue: Условный или временной оттенок начального כִּי
  choice: Когда они согрешат
  alternative: Если они согрешат
  rationale: Грамматически возможен условный оттенок, однако пояснение о том, что нет не согрешающего человека, делает «когда» наиболее уместным в данном контексте. Перевод не утверждает конкретного момента греха, а описывает ожидаемую ситуацию.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Местоимения, относящиеся к Богу, даны со строчной буквы согласно обычной современной издательской практике. Конечная запятая сохранена, поскольку стих является придаточной частью продолжающегося предложения.
