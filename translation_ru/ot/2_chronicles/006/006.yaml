source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: ru
  text: Но Я избрал Иерусалим, чтобы там было Моё имя, и избрал Давида, чтобы он был над Моим народом Израилем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: Я избрал
  rationale: Глагол בחר означает «выбирать, избирать». Русский совершенный вид естественно передаёт состоявшийся выбор, сохраняющий силу в данном контексте; одна и та же форма употреблена для Иерусалима и Давида.
- source_word: בִּירוּשָׁלִַם
  choice: Иерусалим
  rationale: Общепринятая русская форма библейского топонима.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: чтобы там пребывало Моё имя
  rationale: Инфинитив היה выражает цель или результат. «Пребывало» естественно по-русски передаёт устойчивое нахождение имени в избранном месте, не заменяя богословски значимое «имя» словом «присутствие».
- source_word: שְׁמִי
  choice: Моё имя
  rationale: Сохранён буквальный и богословски значимый образ Божьего имени; местоимение и связанное с Богом существительное оформлены с традиционной прописной буквы.
- source_word: שָׁם
  choice: там
  rationale: Локативное наречие передано явно и поставлено в естественной для русского языка позиции.
- source_word: בְּדָוִיד
  choice: Давида
  rationale: После בחר предлог ב отмечает избранный объект; по-русски требуется прямое дополнение без предлога.
- source_word: לִהְיוֹת עַל
  choice: чтобы он был над
  rationale: Формулировка близко сохраняет общий смысл власти и положения над народом, не добавляя отсутствующих в еврейском тексте слов «царь» или «править».
- source_word: עַמִּי יִשְׂרָאֵל
  choice: Моим народом Израилем
  rationale: Сохранены заветное выражение «Мой народ» и поясняющее имя «Израиль»; творительный падеж обусловлен русским управлением предлога «над».
- source_word: וָ
  choice: Но ... и
  rationale: Первый союз передан как «Но», поскольку стих противопоставлен предшествующему отрицанию; второй — как естественное соединительное «и».
theological_decisions:
- issue: Храмовое богословие в выражении «там пребывало Моё имя»
  choice: Сохранить образ Божьего имени, пребывающего в Иерусалиме.
  alternative: «Чтобы там пребывало Моё присутствие» или «как место поклонения Мне».
  rationale: Еврейский текст говорит именно об имени Бога. Сохранение этой формулировки удерживает её заветный и храмовый смысл, не сводя его к одному толкованию.
- issue: Роль Давида в выражении «быть над Моим народом»
  choice: Не уточнять титул или конкретную форму власти.
  alternative: «Чтобы он был царём над Моим народом» или «чтобы он правил Моим народом».
  rationale: Контекст подразумевает царскую власть, однако непосредственно в стихе сказано лишь «быть над»; добавление «царём» устранило бы сдержанность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок слов сделан естественным для русского, при этом сохранены повтор «избрал», образ Божьего имени и общее обозначение власти Давида. Прописные буквы в «Я», «Моё», «Моим» следуют устойчивой русской библейской традиции.
