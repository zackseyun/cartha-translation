  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: ru
  text: 'Тогда Соломон сказал: «Яхве сказал, что будет обитать в густом мраке[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тёмном облаке». Еврейское слово может обозначать густую мглу, мрак или плотное тёмное облако, особенно в рассказах о явлении Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временной указатель связывает слова Соломона с предшествующими событиями и естественно передаёт последовательность повествования.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: Соломон сказал
  rationale: Нейтральная и прямая передача обычной повествовательной формулы с глаголом אמר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: אָמַר
  choice: сказал
  rationale: Еврейская форма qatal обозначает совершённое речевое действие; в русском контексте простой глагол прошедшего времени естественнее всего, а значение сохраняющейся актуальности высказывания определяется контекстом.
- source_word: לִשְׁכּוֹן
  choice: что будет обитать
  rationale: Инфинитив с ל передаёт содержание сказанного; русская конструкция с придаточным предложением звучит естественно и сохраняет смысл пребывания или обитания.
- source_word: בָּעֲרָפֶל
  choice: в густом мраке
  rationale: עֲרָפֶל может обозначать густой мрак, мглу или тёмное облако, особенно при явлении Бога. Выбранное выражение сохраняет образ сокрытой, но реальной близости Бога.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Образ Божьего присутствия в עֲרָפֶל
  choice: будет обитать в густом мраке
  alternative: будет обитать в тёмном облаке
  rationale: Формулировка сохраняет напряжение между Божьей близостью и сокрытостью, не сводя многозначный образ только к метеорологическому облаку.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным звучанием. Двоеточие и кавычки оформляют прямую речь по нормам русского языка.
