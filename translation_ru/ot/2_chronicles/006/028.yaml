revisions:
- from: Если в стране наступит голод, если начнётся мор, если посевы поразят зной или желтизна, если нагрянут саранча или гусеницы[a], если враги осадят его в стране, в его городах[b], какое бы ни постигло бедствие, какая бы ни пришла болезнь —
  to: Если в стране будет голод, если будет мор, палящий зной или пожелтение посевов, если будет саранча или гусеницы[a], если враги осадят его в одном из городов его страны[b], какое бы ни было бедствие и какая бы ни была болезнь —
  rationale: Исправлены неестественная передача сельскохозяйственных бедствий и двусмысленная конструкция об осаде. Список сохранён в исходной последовательности, всеобъемлющее «всякое бедствие и всякая болезнь» передано без смешения с ранее упомянутым мором, а тире сохраняет связь со следующим стихом.
