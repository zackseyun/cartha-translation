source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: ru
  text: Если в стране будет голод, если будет мор, палящий зной или пожелтение посевов, если будет саранча или гусеницы[a], если враги осадят его в одном из городов его страны[b], какое бы ни было бедствие и какая бы ни была болезнь —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово חָסִיל обозначает насекомое, пожирающее посевы; точный его вид неизвестен. Возможный перевод: «пожирающая саранча».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в стране его ворот»; «ворота» здесь обозначают города или селения страны.'
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: голод
  rationale: В перечне общенародных бедствий слово обозначает не обычное чувство голода, а голод как масштабное бедствие; в русском это значение естественно передаётся словом «голод».
- source_word: דֶּבֶר
  choice: мор
  rationale: Еврейское слово обозначает тяжёлую эпидемию. «Мор» — ёмкий и узнаваемый библейский термин, сохраняющий суровый характер бедствия.
- source_word: שִׁדָּפוֹן
  choice: зной
  rationale: Термин обозначает губительное воздействие на растения, вероятно иссушение или ожог от палящего ветра. «Зной» сохраняет вероятную природную причину, не сводя значение к конкретной болезни растений.
- source_word: יֵרָקוֹן
  choice: желтизна
  rationale: Слово указывает на пожелтение или побледнение растений. «Желтизна» передаёт наблюдаемый признак поражения и сохраняет отличие от שִׁדָּפוֹן.
- source_word: אַרְבֶּה
  choice: саранча
  rationale: В контексте уничтожения урожая имеется в виду саранча как массовое бедствие, а не обычный кузнечик.
- source_word: חָסִיל
  choice: гусеницы
  rationale: Точное насекомое не установлено; традиционное «гусеницы» понятно русскому читателю и обозначает вредителя, пожирающего посевы. Неопределённость отмечена в сноске.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: если враги осадят его
  rationale: Порода глагола здесь выражает военное стеснение, окружение или осаду. «Осадят» естественно соответствует контексту городских ворот.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: в стране, в его городах
  rationale: Буквально говорится о «стране его ворот»; ворота метонимически обозначают укреплённые города. Основной текст передаёт смысл естественно, а буквальный образ сохранён в сноске.
- source_word: כָּל נֶגַע
  choice: какое бы ни постигло бедствие
  rationale: נֶגַע широко обозначает удар, поражение или бедствие. Здесь более широкое «бедствие» позволяет не смешивать его с уже названным мором.
- source_word: וְכָל מַחֲלָה
  choice: какая бы ни пришла болезнь
  rationale: מַחֲלָה означает болезнь или заболевание; параллельная конструкция сохраняет всеохватность исходного выражения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией молитвенного перечня. Повтор «если» и незавершённость фразы с тире сохранены, поскольку стих синтаксически продолжается далее. Сельскохозяйственные термины переданы понятно, без чрезмерной технической конкретизации.
