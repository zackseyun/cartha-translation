base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: ru
  text: У Давида, моего отца, было на сердце построить дом для имени Яхве[a], Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом для имени Яхве» — обычное библейское выражение о храме как месте, связанном с Божьим именем.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: было на сердце
  rationale: Еврейская конструкция выражает внутреннее намерение. Русское «было на сердце» естественно передаёт образ сердца и не сводит его к более узкому «решил».
- source_word: דָּוִיד אָבִי
  choice: у Давида, отца моего
  rationale: Сохранено следование имени и указания на родство; предложное оформление требуется русской конструкцией «было на сердце».
- source_word: לִבְנוֹת בַּיִת
  choice: построить дом
  rationale: «Дом» буквально передаёт בַּיִת и сохраняет характерный библейский образ, хотя по контексту речь идёт о храме.
- source_word: לְשֵׁם יְהוָה
  choice: имени Яхве
  rationale: Сохранена богословски значимая формула «дом имени», связывающая святилище с именем Бога, без пояснительной подмены словом «храм» или выражением «в честь».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Естественная русская передача еврейской сопряжённой конструкции и традиционного заветного наименования.
theological_decisions:
- issue: Передача храмовой формулы בַּיִת לְשֵׁם יְהוָה
  choice: дом имени Яхве
  alternative: храм Яхве; дом в честь Яхве
  rationale: Буквальная формула сохраняет присущее тексту различение между Самим Богом, Его именем и построенным домом, не разрешая скрытое в ней богословское напряжение посредством упрощающего толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Идиома «было на сердце» понятна современному читателю и сохраняет образность оригинала.
