source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: ru
  text: С того дня, когда Я вывел Мой народ из земли Египта[a], Я не избирал ни одного города ни в одном из колен Израиля, чтобы построить дом[b], чтобы имя Моё было там; и не избирал мужчину, чтобы он был правителем Моего народа Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «С тех пор как Я вывел Мой народ из земли Египта, Я не избирал…»'
    reason: Временная конструкция и древнееврейские перфекты допускают передачу с подчёркнутой продолжительностью от исхода до момента речи.
  - marker: b
    text: «Дом» здесь означает храм; в еврейском тексте употреблено именно слово «дом».
    reason: Сохраняет буквальную лексику исходного текста, не заменяя её толковательным словом «храм» в основном тексте.
  - marker: c
    text: 'Или: «вождём»; возможна также передача «князем».'
    reason: Слово נָגִיד обозначает поставленного над народом предводителя или правителя.
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: С того дня, когда
  rationale: Точно передаёт исходную временную точку и естественно звучит по-русски.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: Я вывел Мой народ из земли Египетской
  rationale: Каузативная форма יצא обозначает выведение из Египта; «Мой народ» сохраняет заветное наименование.
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: Я не избрал ни одного города среди всех колен Израиля
  rationale: При отрицании «ни одного» ясно передаёт распределительное значение; объектная функция ב при בחר выражена прямым дополнением.
- source_word: לִבְנוֹת בַּיִת
  choice: чтобы построить дом
  rationale: Сохранено буквальное «дом», а не толковательное «храм», поскольку это важно для образности и богословия текста.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: где пребывало бы Моё имя
  rationale: Естественная русская передача цели и присутствия имени; она не отождествляет имя с Самим Богом и сохраняет богословское напряжение выражения.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: и не избрал человека
  rationale: אִישׁ обозначает отдельного мужчину, однако в русском «человека» в сочетании с мужским предикативным «правителем» естественно и недвусмысленно указывает на конкретного носителя власти.
- source_word: נָגִיד
  choice: правителем
  rationale: Передаёт поставленное властное лицо без возможного династического оттенка слова «князь» и без ослабления до общего «руководитель».
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: Моего народа Израиля
  rationale: Родительная конструкция после «правителем» естественно передаёт власть над народом и сохраняет выражение «Мой народ Израиль».
theological_decisions:
- issue: Терминология святилища и присутствие Божьего имени
  choice: «построить дом, где пребывало бы Моё имя»
  alternative: «построить храм, чтобы там обитало Моё присутствие»
  rationale: Исходный текст говорит о «доме» и о том, чтобы там было Божье имя. Перевод сохраняет эти категории и не подменяет их толкованием о присутствии.
- issue: Передача אִישׁ
  choice: «человека, который был бы правителем»
  alternative: «мужчину» / «кого-либо»
  rationale: Контекст указывает на мужчину-правителя; выбранная русская формулировка естественна, сохраняет единственное число и не превращает выражение в неопределённое «кого-либо».
- issue: Временная сила перфекта בחרתי после מִן הַיּוֹם
  choice: «С того дня… Я не избрал»
  alternative: «С того дня… Я не избирал»
  rationale: Русский совершенный вид сохраняет конкретность Божьего выбора; временное выражение «с того дня» само обозначает период до момента речи, не требуя искусственного аналога английского present perfect.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Прописные местоимения в прямой речи Бога соответствуют принятой русской религиозно-издательской норме. Синтаксис сохраняет параллелизм двух отрицательных утверждений, оставаясь понятным современному читателю.
