  text: וַֽ/אֲנִ֛י בָּנִ֥יתִי בֵית זְבֻ֖ל לָ֑/ךְ וּ/מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: ru
  text: Я же построил для Тебя величественный дом, место Твоего пребывания вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית זְבֻל
  choice: величественный дом
  rationale: Редкое сочетание обозначает возвышенное, славное или величественное жилище. Такой перевод естественен по-русски и не сводит смысл лишь к физической высоте здания.
- source_word: מָכוֹן
  choice: место
  rationale: Здесь слово означает устроенное, определённое место пребывания; в русском контексте простое «место» ясно передаёт функцию храма.
- source_word: לְשִׁבְתְּךָ עוֹלָמִים
  choice: где Ты будешь обитать вовеки
  rationale: Инфинитив с суффиксом передаёт предназначение места для Божьего пребывания, а עוֹלָמִים — непреходящую длительность; «вовеки» сохраняет торжественный библейский регистр.
theological_decisions:
- issue: Храм как место вечного обитания Бога
  choice: где Ты будешь обитать вовеки
  alternative: место Твоего вечного пребывания
  rationale: Сохранено прямое утверждение исходного текста без попытки согласовать его с учением о Божьей вездесущности или заранее ограничить его значение символическим присутствием.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Заглавные местоимения «Тебе», «Ты» указывают на обращение к Богу. Союз «же» передаёт контраст וַאֲנִי с предыдущим стихом.
