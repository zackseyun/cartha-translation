base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: ru
  text: Когда небо затворится и не будет дождя за то, что они согрешили против Тебя, и будут молиться, обратившись к этому месту, исповедуют Твоё имя и отвернутся от своего греха, потому что Ты ответишь им[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что Ты смиришь их»; возможно также: «потому что Ты поразишь их». Еврейский согласный текст допускает такое понимание глагола, тогда как масоретская вокализация поддерживает перевод «ответишь им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: когда небо затворится
  rationale: Конструкция с בְּ и инфинитивом задаёт временное придаточное. Единственное число «небо» естественно в современном русском и сохраняет образ неба, закрытого для дождя.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: и не будет дождя
  rationale: Прямо передаёт экзистенциальную конструкцию היה + существительное и естественно сочетается с условно-временным контекстом молитвы.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: за то, что они согрешили против Тебя
  rationale: כִּי выражает причину засухи, а לָךְ при глаголе греха — направленность проступка против Бога. «За то, что» ясно передаёт причинно-следственный, карающий оттенок контекста.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: и когда они станут молиться, обратившись к этому месту
  rationale: אֶל здесь указывает направление молитвы к храму, а не адресата молитвы. Добавленное «обратившись» устраняет возможное впечатление, будто молятся самому месту.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: исповедуют Твоё имя
  rationale: Hiphil глагола ידה может обозначать признание, исповедание, хвалу или благодарение. В последовательности молитвы и обращения от греха «исповедуют» естественно сохраняет оттенок открытого признания Божьего имени, не сводя выражение только к благодарности.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: и отвернутся от своего греха
  rationale: שׁוב с מִן буквально выражает поворот прочь от греха. Формулировка сохраняет образ обращения и не заменяет его более доктринально нагруженным термином.
- source_word: כִּי תַעֲנֵם
  choice: потому что Ты ответишь им
  rationale: Масоретская вокализация поддерживает значение «отвечать», соответствующее ближайшему контексту молитвы. Возможное понимание согласного текста как «смирять/поражать» сохранено в примечании.
theological_decisions:
- issue: Значение ענה в заключительной части стиха
  choice: потому что Ты ответишь им
  alternative: потому что Ты смиришь их; потому что Ты поразишь их
  rationale: Чтение «ответишь» согласуется с масоретской вокализацией и логикой молитвы, на которую Бог отвечает. Иное истолкование связывает обращение народа с Божьим наказанием или смирением; оно не внесено в основной текст, но сохранено в сноске как реальная смысловая возможность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Прописные местоимения при обращении к Богу сохранены как издательская норма русского проекта. Конечная запятая оставлена, поскольку синтаксическое продолжение молитвы следует в следующем стихе.
