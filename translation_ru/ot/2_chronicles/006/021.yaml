source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: ru
  text: Услышь моления Твоего раба и Твоего народа Израиля, когда они будут молиться, обращаясь к этому месту. Услышь с места Твоего пребывания — с небес; услышь и прости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: услышь / услышь / услышь
  rationale: Троекратное повторение корня שׁמע организует стих и усиливает мольбу. Повелительная форма «услышь» естественно передаёт молитвенно-просительный смысл древнееврейских форм в данном контексте.
- source_word: תַּחֲנוּנֵי
  choice: моления
  rationale: Слово обозначает настойчивые просьбы о милости. «Моления» сохраняет молитвенный и эмоциональный оттенок, оставаясь понятным в современном литературном русском языке.
- source_word: עַבְדְּךָ
  choice: Твоего раба
  rationale: В обращении Соломона к Богу слово עבד выражает подчинённость и принадлежность Богу. Традиционное библейское «раб» здесь точнее сохраняет силу исходного образа, чем более служебное «слуга».
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: и Твоего народа Израиля
  rationale: Повторение родительного отношения ясно показывает, что речь идёт о молениях как самого Соломона, так и народа Израиля.
- source_word: יִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: будут молиться, обращаясь к этому месту
  rationale: Глагол означает «молиться», а предлог אֶל задаёт направление к храму. Оборот «обращаясь к этому месту» естественно выражает направленность молитвы и не создаёт впечатления, будто молятся самому месту.
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: с места Твоего пребывания
  rationale: Формулировка близко передаёт составное выражение «место Твоего обитания/пребывания» и позволяет следующей фразе «с небес» явно уточнить его.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Русское множественное «небеса» естественно соответствует древнееврейской форме и сохраняет возвышенный, но понятный регистр.
- source_word: וְסָלָחְתָּ
  choice: и прости
  rationale: В молитвенном контексте форма выражает просьбу. «Прости» прямо и ясно передаёт прощение греха или вины.
theological_decisions:
- issue: Соотношение храма и небесного пребывания Бога
  choice: Сохранено направление молитвы к храму при ясном указании, что Бог слышит с небес.
  alternative: Представить храм непосредственным местом пребывания Бога либо свести упоминание храма к чисто символическому образу.
  rationale: 'Древнееврейский текст удерживает оба положения вместе: народ обращается в молитве к этому месту, но место пребывания Бога уточняется как небеса. Перевод не устраняет это богословское напряжение.'
- issue: Самообозначение Соломона перед Богом
  choice: «Твой раб»
  alternative: «Твой слуга»
  rationale: В контексте царской молитвы выражение одновременно передаёт смирение, подчинённость и принадлежность Богу; оно не является утверждением о социальном статусе Соломона.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Синтаксис сделан ясным для чтения вслух; повтор «услышь» намеренно сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым русским библейским регистром.
