  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הָשִׁ֣יב לְ/רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: ru
  text: 'тогда услышь с небес, действуй и рассуди рабов Твоих: нечестивому воздай, обратив его путь на его же голову[b], а праведного признай правым[a], воздав ему по его праведности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправдав праведного». Древнееврейский глагол здесь имеет судебный смысл: признать человека правым или поступить с ним как с правым.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дав его путь на его голову». «Путь» здесь означает образ жизни или поступки; это древнееврейский образ того, как поступки человека возвращаются к нему при вынесении суда.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: услышь с небес
  rationale: 'Сохраняет обычную для молитвы формулу: речь идёт не просто о восприятии звука, а о внимательном ответе Бога.'
- source_word: וְעָשִׂיתָ
  choice: и действуй
  rationale: Широкий глагол «делать, совершать» здесь означает решительное действие Бога в ответ на молитву; «действуй» естественно и не уточняет сверх исходного текста, каким именно будет это действие.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: рассуди рабов Твоих
  rationale: Контекст имеет судебный характер. «Рассуди» по-русски естественно передаёт вынесение решения относительно тяжущихся, тогда как «суди» может звучать шире.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: воздав нечестивому
  rationale: 'Конструкция выражает возмездие: совершённое нечестивым возвращается к нему в виде судебного воздаяния.'
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: обратив его путь на его же голову
  rationale: Сохранён конкретный древнееврейский образ возвращения человеку последствий его собственного образа жизни; пояснение дано в сноске.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: а праведного признав правым
  rationale: Формулировка передаёт судебное признание правоты и отчасти сохраняет однокоренное сочетание оригинала, не привнося более поздние богословские ассоциации слова «оправдать».
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: воздав ему по его праведности
  rationale: Передаёт соразмерное воздаяние в соответствии с праведностью человека, не заменяя его более узким понятием награды.
theological_decisions:
- issue: Судебный характер Божьего решения
  choice: Передать שׁפט как «рассуди», а הצדיק как «признав правым».
  alternative: 'Передать более общо: «суди» и «оправдай».'
  rationale: Противопоставление нечестивого и праведного, а также сочетание судебных глаголов указывают на разбирательство и вынесение решения. Выбранные слова сохраняют этот смысл без наложения позднейших доктринальных категорий.
- issue: Значение הצדיק
  choice: «признав правым»
  alternative: «оправдав»
  rationale: Оба варианта лексически возможны, но основной вариант яснее выражает судебное признание правоты в данном повествовательном контексте и меньше подвержен неоднозначным богословским прочтениям.
translation_notes:
  register: Современный литературный русский язык с торжественной молитвенной интонацией. Синтаксис сохраняет параллелизм воздаяния нечестивому и признания правоты праведного. Местоимение «Твоих» написано с прописной буквы согласно распространённой русской традиции благоговейного обращения к Богу.
