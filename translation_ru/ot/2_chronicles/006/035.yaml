lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: тогда услышь
  rationale: Форма перфекта 2-го лица мужского рода ед. числа в контексте молитвы выражает просьбу к Богу; «тогда» естественно передаёт связь с предшествующим условием.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Еврейское выражение буквально имеет форму множественного числа; русское «с небес» естественно и сохраняет традиционный пространственный образ.
- source_word: תְּפִלָּתָם וְאֶת תְּחִנָּתָם
  choice: их молитву и мольбу
  rationale: תְּפִלָּה обозначает молитву вообще, а תְּחִנָּה — настойчивую просьбу о милости; «мольба» кратко и естественно передаёт второй оттенок.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: и защити их правое дело
  rationale: 'Буквально: «соверши их суд/правосудие». В данном контексте оборот означает судебное действие Бога в их пользу; перевод сохраняет юридический смысл и не сводит его лишь к эмоциональной поддержке.'
theological_decisions:
- issue: Судебный смысл Божьего ответа на молитву
  choice: защити их правое дело
  alternative: соверши над ними суд; даруй им правосудие; поддержи их дело
  rationale: מִשְׁפָּט допускает значения «суд», «правосудие», «право» и «судебное дело». Контекст просит Бога вступиться за молящихся, однако буквальная конструкция остаётся неоднозначной, поэтому альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным регистром. Сохранён параллелизм «молитву и мольбу» и судебная образность заключительной фразы.
