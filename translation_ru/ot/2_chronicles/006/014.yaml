id: 2CH.6.14
reference: 2 Chronicles 6:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: ru
  text: 'И сказал: «Яхве, Бог Израиля! Нет Бога, подобного Тебе, ни на небесах, ни на земле. Ты хранишь завет и неизменную любовь[a] к Твоим рабам, которые ходят пред Тобой всем сердцем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность завету».'
    reason: Лексема חֶסֶד в контексте завета может подчёркивать неизменную любовь, преданность и верность обязательствам завета.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И сказал
  rationale: Стандартная передача повествовательного wayyiqtol; сохраняет связь с предшествующим контекстом, не уточняя названного там говорящего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Естественная русская передача сопряжённой конструкции, обозначающей Яхве как Бога Израиля.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: Нет Бога, подобного Тебе
  rationale: Выражает несравненность Яхве и сохраняет формальную двусмысленность אֱלֹהִים между качественным и сравнительным прочтением без введения «среди богов».
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: ни на небесах, ни на земле
  rationale: В отрицательной сравнительной конструкции парное «ни… ни…» естественно передаёт всеохватный меризм.
- source_word: שֹׁמֵר
  choice: Ты хранишь
  rationale: Причастие описывает постоянное свойство и действие Бога; личная форма делает русскую фразу ясной, сохраняя длительный смысл.
- source_word: הַבְּרִית
  choice: завет
  rationale: Устоявшийся русский эквивалент для обязательства, установленного в отношениях Бога с Его народом.
- source_word: וְהַחֶסֶד
  choice: и неизменную любовь
  rationale: Передаёт как благоволение и любовь, так и постоянство חֶסֶד в контексте завета.
- source_word: לַעֲבָדֶיךָ
  choice: к Твоим рабам
  rationale: «Рабы» сохраняет обычную библейскую метафору принадлежности и служения Богу; предлог «к» естественно сочетается с «любовью» и охватывает направленность обеих связанных реалий.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: которые ходят пред Тобой
  rationale: Сохраняет древнееврейскую метафору образа жизни в Божьем присутствии; «пред Тобой» соответствует возвышенному молитвенному регистру.
- source_word: בְּכָל לִבָּם
  choice: всем сердцем
  rationale: Идиоматически передаёт коллективно-дистрибутивное выражение и смысл цельной, неразделённой преданности.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Смысл חֶסֶד в сочетании с «заветом»
  choice: неизменная любовь
  alternative: милость; верность завету; неизменная верность
  rationale: Выбранная формулировка сохраняет одновременно личностную любовь и постоянную, верную направленность отношения, не сводя многозначный термин к одной богословской категории.
- issue: Смысл אֵין כָּמוֹךָ אֱלֹהִים
  choice: Нет Бога, подобного Тебе
  alternative: Нет подобного Тебе среди богов
  rationale: Так передаётся утверждение несравненности Яхве, но текст не превращается в более явное высказывание о статусе иных богов, чем допускает древнееврейская конструкция.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы по традиционной русской практике. Сохранены библейские выражения «рабы» и «ходят пред Тобой», поскольку они понятны и несут важную образность оригинала.
