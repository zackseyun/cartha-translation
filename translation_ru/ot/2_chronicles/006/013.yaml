source:
  edition: WLC
  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: ru
  text: Ибо Соломон сделал бронзовый помост[a] и поставил его посреди двора. Он был пять локтей в длину, пять локтей в ширину и три локтя в высоту. Соломон встал на него, затем преклонил колени перед всем собранием Израиля и простёр руки к небу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово כִּיּוֹר обычно означает «чаша» или «умывальник», но здесь контекст указывает на возвышение, на котором мог стоять Соломон; поэтому оно передано как «помост».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к описываемой сцене и естественно передаёт объяснительный оттенок.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: медный помост
  rationale: Обычно כִּיּוֹר обозначает чашу или умывальник, однако размеры предмета и указание, что Соломон стоял на нём, требуют здесь значения возвышенной площадки. «Медный» — традиционное и понятное обозначение библейского материала נְחֹשֶׁת, который также можно передать как «бронзовый».
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: посреди двора
  rationale: Кратко и естественно передаёт расположение внутри храмового двора.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: пять локтей в длину, пять локтей в ширину и три локтя в высоту
  rationale: Сохранена древняя мера длины, а размеры выражены современным литературным русским языком.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: Соломон встал на него
  rationale: Повтор имени устраняет возможную неясность после отдельного предложения с описанием помоста.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: затем преклонил колени
  rationale: В данном контексте глагол означает «становиться на колени», а не «благословлять»; русское выражение естественно передаёт молитвенную позу.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: перед всем собранием Израиля
  rationale: «Собрание» точно и нейтрально передаёт קָהָל в контексте общего богослужения.
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: и простёр руки к небу
  rationale: Переданы и молитвенный жест, и направительное значение формы הַשָּׁמָיְמָה.
theological_decisions:
- issue: Значение כִּיּוֹר в данном контексте
  choice: «помост»
  alternative: «чаша», «умывальник» или «подставка»
  rationale: Хотя обычное значение слова связано с сосудом для омовения, Соломон стоит на этом предмете, а его размеры соответствуют возвышению. Контекстуальное «помост» не создаёт ошибочного образа сосуда, при этом необычность исходной лексемы отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формы «преклонил» и «простёр» уместны для торжественной молитвенной сцены, но остаются понятными современному читателю.
