revisions:
- from: Пусть глаза Твои будут открыты к этому дому днём и ночью[a], к тому месту, о котором Ты сказал, что положишь там имя Своё[b], чтобы услышать молитву, которой раб Твой молится, обращаясь к этому месту.
  to: Пусть глаза Твои будут открыты к этому дому днём и ночью[a], к месту, о котором Ты сказал, что положишь там имя Своё[b], чтобы услышать молитву, с которой раб Твой обращается в сторону этого места.
  rationale: Правка устраняет неестественное русское управление и точнее передаёт последующее еврейское «к этому месту» как указание на направление молитвы. Буквальный антропоморфный образ и храмовая формула сохранены; смысл и степень исходной образности не расширены.
