  text: לִ/הְיוֹת֩ עֵינֶ֨י/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ לָ/שׂ֥וּם שִׁמְ/ךָ֖ שָׁ֑ם לִ/שְׁמ֨וֹעַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: ru
  text: Пусть глаза Твои будут открыты к этому дому днём и ночью[a], к месту, о котором Ты сказал, что положишь там имя Своё[b], чтобы услышать молитву, с которой раб Твой обращается в сторону этого места.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь внимателен к этому дому». Буквально в еврейском тексте: «глаза Твои будут открыты» — образ неусыпного внимания.'
    reason: lexical_alternative
  - marker: b
    text: «Положить имя» — храмовое выражение, обозначающее, что Бог избрал это место и особым образом связал его со Своим именем; оно не означает, что Бог буквально заключён в храме.
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: Пусть глаза Твои будут открыты
  rationale: Просительная конструкция естественно передана через «пусть», а конкретный антропоморфный образ открытых глаз сохранён.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: к этому дому
  rationale: Предлог אֶל обозначает направленность; «к этому дому» сохраняет пространственный образ оригинала.
- source_word: יוֹמָם וָלַיְלָה
  choice: днём и ночью
  rationale: Естественное русское соответствие меризму, выражающему постоянное внимание.
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: о котором Ты сказал, что положишь там имя Своё
  rationale: Сохранена храмовая формула «положить имя», а будущее время передаёт смысл данного прежде Божьего обещания.
- source_word: לִשְׁמֹעַ
  choice: чтобы услышать
  rationale: Инфинитив цели передан ясной русской целевой конструкцией.
- source_word: הַתְּפִלָּה אֲשֶׁר יִתְפַּלֵּל
  choice: молитву, которой ... молится
  rationale: Сохранён однокоренной повтор еврейского текста, насколько это допускает естественный русский синтаксис.
- source_word: עַבְדְּךָ
  choice: раб Твой
  rationale: В молитвенном обращении традиционное и понятное русское «раб» точно выражает смиренное служение Богу.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: обращаясь к этому месту
  rationale: В заключительной фразе направленность молитвы выражена естественно по-русски, без предположения, что молитва адресована самому месту.
theological_decisions:
- issue: Антропоморфное выражение «глаза Твои будут открыты»
  choice: Сохранить телесный образ буквально
  alternative: 'Передать толковательно: «будь внимателен к этому дому»'
  rationale: Оригинал говорит о Божьем внимании посредством конкретного образа; его сохранение не устраняет риторическую и богословскую выразительность текста.
- issue: Храмовая формула «положить там имя Своё»
  choice: Сохранить идиому без раскрывающего парафраза
  alternative: Передать как «явить там Своё присутствие» или «поселиться там»
  rationale: Формула обозначает избранную Богом связь с храмом, но не утверждает, что Бог пространственно ограничен им; буквальная передача сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как регистровое решение. Сохранены ключевые образы оригинала, но заключительное направление молитвы выражено естественным русским оборотом.
