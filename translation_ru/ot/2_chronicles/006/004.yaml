  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: ru
  text: 'И сказал он: «Благословен Яхве, Бог Израиля, который Своими устами сказал Давиду, моему отцу, и Своей рукой исполнил сказанное[a]:»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Своими устами сказал Давиду, моему отцу, и Своей рукой исполнил». В еврейском тексте подчёркнут параллелизм между Божьим словом и действием.'
    reason: Буквальная альтернатива и пояснение риторического параллелизма.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Обычная передача повествовательной формы wayyiqtol; сохраняет связь с предыдущим контекстом и вводит речь Соломона.
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткая и естественная для русского библейского регистра формула благословения Бога; причастная форма допускает оттенок и утверждения, и славословия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сопряжённой конструкции и традиционного наименования Бога в Его отношении к Израилю.
- source_word: דִּבֶּר בְּפִיו
  choice: Своими устами говорил
  rationale: Сохраняет явный антропоморфный образ и намеренный параллелизм между устами, которыми Бог говорит, и рукой, которой Он исполняет.
- source_word: אֵת דָּוִיד אָבִי
  choice: Давиду, отцу моему
  rationale: В данном контексте Давид выступает адресатом Божьего обещания; дательный падеж естественно передаёт это по-русски.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: и Своей рукой исполнил сказанное
  rationale: Сохраняет образ Божьей руки как действия; добавленное «сказанное» естественно выражает подразумеваемый объект глагола и связывает исполнение с предшествующей речью.
- source_word: לֵאמֹר
  choice: дальнейшее содержание вводится двоеточием
  rationale: Еврейский инфинитив вводит цитату, продолжающуюся в следующем стихе; в современном русском эту функцию естественно выполняет двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Антропоморфный параллелизм «устами — рукой»
  choice: Сохранить оба образа
  alternative: 'Передать смысл обобщённо: «обещал… и исполнил»'
  rationale: Формулировка подчёркивает соответствие Божьего слова Божьему действию; устранение образов ослабило бы риторическую структуру исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные буквы в местоимениях «Своими», «Своей» обозначают Бога согласно принятой русской религиозной орфографической традиции. Двоеточие показывает, что цитата Божьей речи продолжается в следующем стихе.
