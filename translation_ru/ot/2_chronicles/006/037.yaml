source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: ru
  text: 'и если в земле, куда они были уведены в плен, они одумаются[a], обратятся и станут умолять Тебя в земле своего плена, говоря: «Мы согрешили, поступали неправедно и творили зло»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвратят к своему сердцу»; еврейская идиома означает глубоко осмыслить случившееся, принять его к сердцу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: они одумаются
  rationale: Еврейская идиома буквально говорит о возвращении к сердцу и обозначает внутреннее осмысление и признание. «Одумаются» естественно передаёт её смысл в данном контексте покаяния, а буквальный образ сохранён в примечании.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: в земле, куда они были уведены в плен
  rationale: Нифаль глагола שׁבה означает, что людей взяли или увели в плен. Такая формулировка ясна, современна и сохраняет конкретный образ пленения.
- source_word: וְשָׁבוּ
  choice: обратятся
  rationale: Глагол שׁוּב может обозначать как возвращение, так и духовное обращение. В сочетании с мольбой и исповеданием «обратятся» сохраняет оба смысловых оттенка и не заменяет образ более узким термином «покаются».
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: станут умолять Тебя
  rationale: Форма глагола חנן выражает настойчивую просьбу о милости. «Станут умолять Тебя» естественно передаёт направленность к Богу и напряжённость просьбы.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: в земле своего плена
  rationale: Существительное שְׁבִי обозначает плен или состояние пленников. Выражение близко к форме оригинала и понятно современному читателю.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Стандартная формула, вводящая прямую речь и содержание исповедания.
- source_word: חָטָאנוּ
  choice: Мы согрешили
  rationale: Прямой и общепонятный перевод традиционной формулы признания греха.
- source_word: הֶעֱוִינוּ
  choice: поступали неправедно
  rationale: Глагол от עוה передаёт нравственную кривизну и неправоту поведения. Формулировка сохраняет моральный смысл и звучит естественно по-русски.
- source_word: וְרָשָׁעְנוּ
  choice: творили зло
  rationale: Глагол רשע обозначает нечестивое, преступное поведение. «Творили зло» сохраняет деятельный характер признания и завершает трёхчастное исповедание.
theological_decisions:
- issue: Язык покаяния в условиях плена
  choice: Передать שׁוּב словом «обратятся».
  alternative: «вернутся» или «покаются»
  rationale: В стихе соединены внутреннее осознание, обращение к Богу, мольба и исповедание. «Обратятся» сохраняет напряжение между основным образом возвращения и духовным покаянием, не сводя значение к одному догматическому термину.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавная буква в «Тебя» соответствует обращению к Богу. Синтаксис сохранён как продолжение условного периода соседних стихов; финальная запятая указывает на продолжение предложения.
