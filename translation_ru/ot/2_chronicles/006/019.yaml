  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: ru
  text: И всё же, Яхве, Бог мой, обратись к молитве Твоего слуги и к его мольбе о милости[a], чтобы услышать вопль[b] и молитву, которую Твой слуга возносит перед Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к его молению». Еврейское слово обозначает настойчивую просьбу о милости или благосклонности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «громкий крик». Еврейское слово может означать звучный крик; здесь, вероятно, крик о помощи в молитве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Но обратись к
  rationale: Глагол פנה сохраняет образ поворота к кому-либо или чему-либо, а в контексте молитвы означает благосклонно обратить внимание. Союз передан как «но», поскольку просьба противопоставлена сказанному ранее.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: к молитве Твоего слуги
  rationale: תפלה обычно означает «молитва»; עבד в обращении царя к Богу естественно передаётся как «слуга», а не «раб».
- source_word: תְּחִנָּתוֹ
  choice: к его мольбе о милости
  rationale: תחנה обозначает настойчивую просьбу о благосклонности или милости; «мольба о милости» ясно выражает этот оттенок и отличается от תפלה.
- source_word: יְהוָה אֱלֹהָי
  choice: Яхве, Бог мой
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהָי — прямым обращением «Бог мой».
- source_word: לִשְׁמֹעַ
  choice: услышь
  rationale: Инфинитив выражает цель обращения Бога к молитве. В русском императив «услышь» естественно продолжает прямую просьбу и не меняет её смысла.
- source_word: הָרִנָּה
  choice: вопль
  rationale: רנה может обозначать громкий, звучный крик; в молитвенном контексте здесь имеется в виду крик о помощи. «Вопль» сохраняет интенсивность слова.
- source_word: הַתְּפִלָּה
  choice: молитву
  rationale: Повтор существительного תפלה сохранён ради лексической последовательности и еврейского параллелизма.
- source_word: מִתְפַּלֵּל לְפָנֶיךָ
  choice: обращается к Тебе
  rationale: Причастие מתפלל указывает на совершаемую молитву, а לפני־ в данном контексте означает пребывание перед Богом. Естественная русская формулировка передаёт молитвенное обращение, хотя формальный образ «перед Тобой» отмечен как возможный вариант.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно сохранено транслитерацией, а не заменено титулом.
- issue: Просьба Бога «услышать» молитву
  choice: услышь
  alternative: чтобы услышать
  rationale: Императив в русском естественно передаёт цель и просьбу, заложенные в конструкции וּפָנִיתָ ... לִשְׁמֹעַ, не подразумевая недостатка Божьего знания, но сохраняя библейский язык молитвенного прошения.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический знак почтения. Синтаксис сделан естественным для русского языка, при этом сохранены различие между «молитвой» и «мольбой», интенсивность слова «вопль» и личное имя Яхве.
