base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: ru
  text: Господи Боже, не отверни лица помазанника Твоего[a]; вспомни о милостях, явленных Давиду, рабу Твоему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть: «не отвергни Твоего помазанника». В данном контексте помазанник — царь; то же еврейское слово лежит в основе слова «Мессия».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «вспомни о Твоей верной любви к Давиду, рабу Твоему» или, более буквально, «вспомни о милостях Давида». Последняя формулировка сохраняет сжатость и неоднозначность еврейского выражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Господи Боже
  rationale: В обращении сочетание личного имени Бога YHWH с титулом אֱלֹהִים естественно и торжественно передаётся по-русски традиционной формой «Господи Боже».
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: не отверни лица
  rationale: Сохранён конкретный образ еврейской идиомы. По смыслу выражение означает отказать или отвергнуть, однако буквальный образ понятен в русском языке и соответствует молитвенному стилю.
- source_word: מְשִׁיחֶךָ
  choice: помазанника Твоего
  rationale: Слово обозначает того, кто помазан Богом, и в непосредственном контексте относится к царю из дома Давида. Такой перевод сохраняет возможное мессианское звучание, не превращая слово без достаточного основания в однозначный титул «Мессия».
- source_word: זָכְרָה
  choice: вспомни
  rationale: Обычное значение повелительной формы זכר; в молитвенном контексте это призыв принять во внимание прежнюю милость и действовать в соответствии с ней.
- source_word: לְחַסְדֵי דָּוִיד
  choice: о милостях к Давиду
  rationale: Множественная форма חֶסֶד может обозначать проявления верной, заветной любви. Формулировка указывает на Давида как получателя милостей, но сноска сохраняет синтаксическую и смысловую неоднозначность сжатого еврейского выражения.
- source_word: דָּוִיד עַבְדֶּךָ
  choice: Давиду, рабу Твоему
  rationale: Аппозиция передана естественно для русского языка; «раб» сохраняет традиционный библейский смысл человека, принадлежащего Богу и служащего Ему.
theological_decisions:
- issue: Значение מְשִׁיחֶךָ в царской молитве
  choice: помазанника Твоего
  alternative: Мессию Твоего; царя Твоего
  rationale: «Помазанник» точно передаёт лексическое значение и непосредственный царский контекст, оставляя открытым более широкий мессианский смысл, но не навязывая его.
- issue: Отношение милостей חַסְדֵי к Давиду
  choice: о милостях к Давиду
  alternative: о верной любви, обещанной Давиду; о милостях Давида
  rationale: Контекст молитвы лучше всего поддерживает обращение к Божьей заветной милости по отношению к Давиду. Вместе с тем конструкция сжата и допускает иное понимание, поэтому альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранены традиционные обращения «Господи Боже», «помазанник» и «раб Твой», а синтаксис сделан ясным без устранения смысловой неоднозначности последней части стиха.
