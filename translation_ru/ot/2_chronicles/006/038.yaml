  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: ru
  text: и обратятся к Тебе всем сердцем и всей душой в земле своего плена[b], куда их увели в плен, и будут молиться в сторону своей земли, которую Ты дал их отцам, в сторону города, который Ты избрал, и дома, который я построил для Твоего имени,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «в земле, где они находятся в плену».'
    reason: Фраза בְּאֶרֶץ שִׁבְיָם буквально связывает землю с их пленом и допускает как компактную именную передачу, так и пояснительную конструкцию.
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: и обратятся к Тебе
  rationale: Глагол שׁוּב с אֶל означает возвращение или обращение к кому-либо. «Обратятся к Тебе» естественно звучит по-русски и сохраняет как буквальный смысл поворота к Богу, так и подразумеваемое покаяние, не делая последнее единственным толкованием.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: всем сердцем и всей душой
  rationale: Устойчивое русское сочетание передаёт еврейскую формулу полной внутренней преданности и искренности.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: в земле своего плена
  rationale: Близко передаёт конструкцию «земля их плена», сохраняя связь с состоянием пленения, а не заменяя её более узким понятием изгнания.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: куда их увели в плен
  rationale: Активное еврейское выражение с неопределённым субъектом естественно передаётся по-русски неопределённо-личной конструкцией; она яснее буквального «где их пленили» в связи с землёй назначения.
- source_word: וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם
  choice: и будут молиться, обратившись к своей земле
  rationale: דֶּרֶךְ обозначает направление. Русская формулировка ясно выражает телесную ориентацию во время молитвы и избегает неестественного «молиться в сторону земли».
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: которую Ты дал их отцам
  rationale: «Отцам» сохраняет библейскую заветную лексику и остаётся понятным современному читателю как указание на предков.
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: к городу, который Ты избрал
  rationale: Совершенный вид передаёт совершённый выбор с сохраняющимся значением; «избрал» поддерживает достойный библейский регистр.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: и к дому, который я построил для Твоего имени
  rationale: «Дом» сохраняет исходный образ храма, а «для Твоего имени» — заветную формулу посвящения, не сводя её к пояснительному пересказу.
theological_decisions:
- issue: Покаянный оттенок שׁוּב אֵלֶיךָ
  choice: «обратятся к Тебе»
  alternative: «покаются перед Тобой» или «вернутся к Тебе»
  rationale: Исходный глагол прежде всего обозначает возвращение или поворот. В данном контексте он несёт покаянный и заветный оттенок, однако прямое «покаются» устранило бы подлинную смысловую многослойность, а «вернутся» могло бы быть ошибочно понято прежде всего как физическое возвращение из плена.
- issue: Значение «дома» и Божьего имени
  choice: сохранить «дом» и «для Твоего имени»
  alternative: «храм, построенный мной в Твою честь»
  rationale: Исходные образы связывают храм с Божьим именем, не утверждая, что Бог пространственно ограничен зданием. Формальный образ сохраняет богословское напряжение контекста молитвы Соломона.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской издательской практике. Синтаксис сохраняет продолжение условного периода предыдущих стихов; поэтому стих оканчивается запятой.
