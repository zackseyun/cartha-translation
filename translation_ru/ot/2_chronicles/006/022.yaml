  text: אִם יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: ru
  text: Если человек согрешит против своего ближнего и на него возложат клятву[a], чтобы он поклялся, и он придёт принести клятву перед Твоим жертвенником в этом доме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клятву с проклятием». Еврейское слово может обозначать клятву, навлекающую проклятие на того, кто нарушит её или поклянётся ложно.'
    reason: 'Сохраняет лексическую неоднозначность אָלָה в судебном контексте: это клятва, связанная с проклятием за нарушение или ложную клятву.'
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ לְרֵעֵהוּ
  choice: Если человек согрешит против своего ближнего
  rationale: Условная конструкция и нравственно-религиозная сила חטא переданы прямо; אִישׁ в современном русском естественно передаётся как «человек», а רֵעַ — как «ближний».
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: и на него возложат клятву
  rationale: Сохранён образ возложения обязательства на человека и отдельность этой конструкции от следующего каузативного инфинитива.
- source_word: לְהַאֲלֹתוֹ
  choice: чтобы он поклялся
  rationale: 'Передано каузативное значение: человека приводят к принесению клятвы; формулировка намеренно не слита с предшествующей конструкцией.'
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: и эта клятва будет произнесена перед Твоим жертвенником
  rationale: Буквальное «клятва придёт» в русском неестественно; по контексту речь о принесении или произнесении клятвы перед жертвенником. Пассивная формулировка сохраняет фокус еврейского текста на самой клятве и не добавляет явно названного действующего лица.
- source_word: בַּבַּיִת הַזֶּה
  choice: в этом доме
  rationale: Сохранено буквальное и богословски значимое «дом», а не интерпретирующее «храм».
theological_decisions:
- issue: Судебное значение אָלָה
  choice: В основном тексте — «клятва», с пояснением оттенка самообязывающего проклятия в сноске.
  alternative: «проклятие» или «клятва с проклятием»
  rationale: В судебном контексте אָלָה обозначает клятву, предполагающую проклятие за её нарушение или ложность. Одно слово «проклятие» затушевало бы процедуру принесения клятвы, а одно слово «клятва» без примечания могло бы скрыть санкционный оттенок.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Местоимение «Твоим» написано с прописной буквы как традиционное уважительное обращение к Богу. Стих синтаксически остаётся незавершённым и заканчивается запятой, поскольку условная конструкция продолжается в следующем стихе.
