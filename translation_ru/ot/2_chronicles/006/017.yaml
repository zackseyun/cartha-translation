id: 2CH.6.17
reference: 2 Chronicles 6:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: ru
  text: И ныне, Яхве, Бог Израиля, пусть исполнится[a] слово, которое Ты сказал Твоему слуге Давиду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да утвердится»; или: «пусть окажется истинным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И ныне
  rationale: Сохраняет соединительный וְ и передаёт עַתָּה как переход к следующему прошению; «ныне» уместно в возвышенной, но понятной молитвенной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон личным именем, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и естественно передаёт конструкцию принадлежности.
- source_word: יֵאָמֵן
  choice: пусть исполнится
  rationale: Нифаль глагола אמן выражает просьбу о том, чтобы сказанное Богом утвердилось и оказалось верным через исполнение. Русское «исполнится» естественно в контексте данного Давиду обещания; иные оттенки сохранены в примечании.
- source_word: דְּבָרְךָ
  choice: слово
  rationale: Сохраняет буквальное значение דָּבָר и не заменяет его более истолковывающим словом «обещание».
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: которое Ты сказал
  rationale: Сохраняет лексическую связь между «словом» и глаголом «сказать».
- source_word: לְעַבְדְּךָ לְדָוִיד
  choice: Твоему слуге Давиду
  rationale: לְ обозначает адресата речи; «слуга» естественно передаёт עֶבֶד в отношении царя Давида к Богу, не привнося излишней социальной окраски слова «раб».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Передача דְּבָרְךָ в контексте обещания Давиду
  choice: слово
  alternative: обещание
  rationale: «Обещание» точно описывает контекст, однако «слово» ближе к форме еврейского текста и сохраняет связь с последующим «сказал».
- issue: Смысл יֵאָמֵן
  choice: пусть исполнится
  alternative: да утвердится; пусть окажется истинным
  rationale: В молитве Соломона речь идёт о подтверждении Божьего слова его осуществлением. Основной вариант передаёт контекстуальный смысл, а примечание сохраняет возможные оттенки твёрдости и истинности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным оттенком. Форма «И ныне» поддерживает связь с контекстом; обращение и местоимения, относящиеся к Богу, оформлены с традиционной прописной буквы.
