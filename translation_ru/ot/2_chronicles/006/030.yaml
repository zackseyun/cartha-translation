  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: ru
  text: то услышь с небес, с места Твоего обитания, и прости, и воздай каждому по всем его путям, чьё сердце Ты знаешь, — ибо Ты один знаешь сердца сынов человеческих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов человека»; то есть всех людей, всего человечества.'
    reason: Пояснение буквального антропологического выражения и его обобщающего значения.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: услышь
  rationale: Имперфект в контексте молитвы Соломона передаёт просьбу; русский императив естественно выражает молитвенное прошение.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Сохраняет грамматическое множественное число еврейского слова и звучит естественно в возвышенной русской речи.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: с места Твоего обитания
  rationale: מָכוֹן обозначает установленное место; формулировка близка к источнику и ясно указывает на небесное обитание Бога.
- source_word: וְסָלַחְתָּ
  choice: и прости
  rationale: Продолжает последовательность молитвенных просьб.
- source_word: וְנָתַתָּה
  choice: и воздай
  rationale: В судебном контексте נתן означает дать человеку соответствующее его путям; «воздай» естественно передаёт этот смысл, не уточняя характер воздаяния.
- source_word: לָאִישׁ
  choice: каждому
  rationale: Передаёт дистрибутивное значение единственного числа и по-русски естественно охватывает всякого человека.
- source_word: כְּכָל דְּרָכָיו
  choice: по всем его путям
  rationale: Сохраняет еврейскую метафору путей как образа поведения и образа жизни.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: ведь Ты знаешь его сердце
  rationale: Передаёт основание для справедливого воздаяния; «сердце» сохраняет библейское обозначение внутреннего человека.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: ибо Ты один знаешь
  rationale: Сохраняет причинную связь и исключительность Божьего знания.
- source_word: בְּנֵי הָאָדָם
  choice: сынов человеческих
  rationale: Традиционно понятное и близкое к форме источника выражение; в данном контексте обозначает всех людей, что пояснено в сноске.
theological_decisions:
- issue: Объём значения בְּנֵי הָאָדָם
  choice: сынов человеческих
  alternative: всех людей / человеческого рода
  rationale: Основной текст сохраняет образное выражение источника, а сноска указывает на его обобщающее значение без ограничения только мужчинами.
- issue: Характер воздаяния в וְנָתַתָּה לָאִישׁ כְּכָל דְּרָכָיו
  choice: воздай каждому по всем его путям
  alternative: дай каждому по всем его путям
  rationale: Контекст суда поддерживает «воздай», однако перевод не добавляет, будет ли результат наградой или наказанием.
translation_notes:
  register: Современный литературный русский с молитвенно-библейской торжественностью. Местоимения, обращённые к Богу, написаны с прописной буквы. Параллельная цепочка просьб и метафора «путей» сохранены.
