source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: ru
  text: Однако не ты построишь этот дом[a]; твой сын, который произойдёт от тебя[b], — он построит дом для Моего имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм; в еврейском тексте буквально «дом» — обычное обозначение храма.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выйдет из твоих чресл» — идиома, обозначающая прямого телесного потомка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: однако
  rationale: Частица вводит ограничение к сказанному прежде и имеет здесь противительный оттенок; «однако» естественно передаёт его по-русски.
- source_word: תִבְנֶה הַבָּיִת
  choice: построишь этот дом
  rationale: Существительное определённое и в контексте обозначает храм; указательное «этот» делает русскую фразу естественной, а «дом» сохраняет образ исходного текста.
- source_word: כִּי
  choice: точка с запятой; последующее противопоставление
  rationale: После отрицания частица вводит не причину, а противопоставленное положительное утверждение. В русском это естественно выражается синтаксически, без отдельного союза.
- source_word: בִנְךָ
  choice: твой сын
  rationale: Прямое соответствие существительному с суффиксом второго лица единственного числа.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: который произойдёт от тебя
  rationale: Выражение буквально говорит о выходящем из чресл и означает прямого телесного потомка; выбранная формулировка передаёт смысл без архаизма.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение имеет подчёркивающую функцию; конструкция с тире и явным «он» сохраняет это выделение и приемлема в русском.
- source_word: יִבְנֶה הַבַּיִת
  choice: построит дом
  rationale: Форма обозначает будущее действие; повтор слова «дом» сохраняет лексическую связь внутри стиха.
- source_word: לִשְׁמִי
  choice: для Моего имени
  rationale: Формулировка сохраняет буквальную связь храма с Божьим именем и не сводит выражение только к значению «во имя» как указанию на полномочие.
theological_decisions:
- issue: Обозначение храма
  choice: дом
  alternative: храм
  rationale: Еврейский текст употребляет «дом», обычное библейское обозначение храма. Сохранение этого слова поддерживает образ и межтекстовые связи; значение поясняется в сноске.
- issue: Телесное происхождение сына
  choice: произойдёт от тебя
  alternative: выйдет из твоих чресл
  rationale: Передаётся прямое биологическое происхождение без архаичной анатомической идиомы и без добавочных богословских утверждений.
- issue: Эмфатическое местоимение הוּא
  choice: — он построит
  alternative: построит
  rationale: Явное местоимение сохраняет противопоставление между Давидом и его сыном, не усиливая его до «он сам».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавная буква в «Моего» следует принятому в русском религиозном письме оформлению местоимения, относящегося к Богу. Сноски расставлены по тем словам, которые они поясняют.
