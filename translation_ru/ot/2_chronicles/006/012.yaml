  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: ru
  text: Затем он встал перед жертвенником Яхве, перед всем собранием Израиля, и простёр руки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «простёр свои ладони»; этот оборот обозначает молитвенный жест.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Затем он встал
  rationale: Форма wayyiqtol продвигает повествование; «затем» естественно передаёт последовательность, а «встал» сохраняет основное значение глагола עמד.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог обозначает пространственное положение перед жертвенником.
- source_word: מִזְבַּח יְהוָה
  choice: жертвенником Яхве
  rationale: Сочетание передано прозрачно и естественно; личное имя יהוה транслитерировано как «Яхве».
- source_word: נֶגֶד
  choice: напротив
  rationale: Слово указывает на положение лицом к собранию и позволяет отличить его от ранее употреблённого לִפְנֵי «перед».
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: всего собрания Израиля
  rationale: קהל означает собравшуюся общину; «собрание» — современный и нейтральный русский эквивалент, а конструкция с כָּל естественно передаётся как «всё собрание».
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: и простёр руки
  rationale: Буквально речь идёт о раскрытии или простирании ладоней; «простёр руки» естественно выражает молитвенный жест в достойном русском стиле.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как личное имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Простёр» сохраняет достоинство и образность выражения, оставаясь понятным современному читателю.
