  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: ru
  text: какая бы ни была молитва, какое бы ни было моление от кого-либо из людей или от всего Твоего народа Израиля, — если каждый знает своё бедствие и свою боль и простирает руки к этому дому, —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: какая бы молитва, какое бы моление ни
  rationale: Повтор כָּל сохранён параллельной конструкцией; «моление» передаёт настойчивую просьбу о милости и сохраняет отличие от общего слова «молитва».
- source_word: אֲשֶׁר יִהְיֶה לְכָל הָאָדָם וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: ни исходили от кого-либо из людей или от всего Твоего народа Израиля
  rationale: «Исходили» естественно выражает принадлежность молитвы молящемуся, не делая из היה специального глагола «возносить». Различены отдельный человек и народ как целое.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: когда каждый осознает
  rationale: אִישׁ имеет распределительное значение «каждый», а ידע здесь означает личное осознание собственного бедствия; временное «когда» естественно связывает условие с молитвой.
- source_word: נִגְעוֹ וּמַכְאֹבוֹ
  choice: своё бедствие и свою боль
  rationale: «Бедствие» сохраняет широкий смысл נֶגַע — поражение, несчастье или тяжёлое страдание, не сужая его до эпидемии; «боль» передаёт מַכְאוֹב и не сливает два понятия.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: и прострёт руки
  rationale: Традиционно понятное, но не архаически тяжёлое обозначение молитвенного жеста; «руки» естественнее буквального «ладони».
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: к этому храму
  rationale: אֶל указывает на направление молитвенного жеста. В данном контексте הַבַּיִת — храм, поэтому функциональное обозначение яснее русского «дом».
theological_decisions:
- issue: Родовое значение הָאָדָם
  choice: кого-либо из людей
  alternative: любого человека; любого мужчины
  rationale: В контексте אָדָם обозначает отдельного представителя человеческого сообщества без ограничения по полу. Русское выражение «кого-либо из людей» сохраняет индивидуальность и родовой охват, не внося конфессионального толкования.
- issue: Соотношение отдельного молящегося и всего Израиля
  choice: от кого-либо из людей или от всего Твоего народа Израиля
  alternative: от любого человека и от всего Твоего народа Израиля
  rationale: Русское «или» ясно передаёт охват как индивидуальной, так и общей молитвы; оно не утверждает взаимоисключение, а раскрывает два возможных масштаба прошения.
- issue: Значение נֶגַע
  choice: бедствие
  alternative: поражение; язва
  rationale: Широкий перевод сохраняет возможность телесного, общественного или иного личного несчастья и не ограничивает текст конкретной болезнью.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным синтаксисом. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Конечное тире показывает, что синтаксическое продолжение и ответ на молитву следуют в стихе 30.
