  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: ru
  text: 'Но Яхве сказал Давиду, отцу моему: «Так как ты задумал в сердце своём построить дом[a] для Моего имени, ты хорошо сделал, что задумал это в сердце своём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «построить храм для Моего имени». Буквально: «построить дом для Моего имени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; «сказал» естественно передаёт прямую речь.
- source_word: דָּוִד אָבִי
  choice: Давиду, отцу моему
  rationale: Сохранено прямое указание Соломона на своего отца; приложение отделено запятой по нормам русского языка.
- source_word: יַעַן אֲשֶׁר
  choice: так как
  rationale: Сочетание вводит придаточное причины; «так как» звучит естественно и сохраняет причинную связь.
- source_word: הָיָה עִם לְבָבְךָ
  choice: у тебя было на сердце
  rationale: Сохранён образ сердца как средоточия намерения; выражение понятно и естественно по-русски.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: построить дом для Моего имени
  rationale: Слово בַּיִת буквально означает «дом»; формулировка сохраняет богословски значимое выражение «для Моего имени», не подменяя его более узким толкованием.
- source_word: הֱטִיבוֹתָ
  choice: ты хорошо сделал
  rationale: Форма породы хифиль от יטב выражает одобрение; это устойчивое и ясное русское выражение.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: что это было у тебя на сердце
  rationale: Сохранён намеренный повтор исходного текста. Союз «что» естественно связывает заключительную фразу с выражением «хорошо сделал».
theological_decisions:
- issue: Передача выражения בַּיִת לִשְׁמִי
  choice: дом для Моего имени
  alternative: храм для Моего имени
  rationale: Основной текст сохраняет буквальное «дом» и значимую формулу связи святилища с Божьим именем, не создавая впечатления, будто Бог ограничен зданием. Контекстуальное значение «храм» дано в примечании.
- issue: Повтор выражения «было у тебя на сердце»
  choice: сохранить повтор
  alternative: ты хорошо сделал, задумав это
  rationale: Повтор присутствует в еврейском тексте и подчёркивает, что одобрено само намерение Давида. Более гладкая перефразировка ослабила бы эту смысловую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся понятным для широкого читателя; образ сердца и повтор оригинала сохранены. Местоимение «Моего» написано с прописной буквы как элемент принятого благоговейного библейского регистра.
