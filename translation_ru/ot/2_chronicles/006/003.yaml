lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: И повернулся царь
  rationale: Буквально оборот означает «царь повернул своё лицо», но в данном контексте это еврейская идиома физического поворота. Русское «повернулся» естественно передаёт действие, не создавая впечатления, будто царь лишь повернул голову.
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Обычное и точное соответствие глаголу ברך; в контексте царь обращается с благословением к собравшемуся народу.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: всё собрание Израиля
  rationale: קהל обозначает собранное вместе общество Израиля. «Собрание» современно и нейтрально, тогда как «общество» возможно, но менее явно выражает ситуацию общего сбора.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: а всё собрание Израиля стояло
  rationale: Причастие עוֹמֵד описывает продолжающееся положение собравшихся. Союз «а» естественно вводит сопутствующее обстоятельство и сохраняет повтор исходного текста.
