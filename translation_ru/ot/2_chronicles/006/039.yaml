base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: ru
  text: тогда услышь с небес, с места Твоего обитания, их молитву и мольбы, рассуди их дело[a] и прости Твой народ, согрешивший против Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даруй им правосудие»; буквально: «соверши их суд (дело)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: тогда услышь
  rationale: Форма перфекта 2-го лица ед. числа в контексте молитвы выражает просьбу; «тогда» передаёт продолжение условной конструкции предыдущего контекста.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Естественное русское соответствие устойчивому еврейскому выражению; множественное число уместно в библейском русском регистре и не звучит архаично.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: с места Твоего обитания
  rationale: Передаёт מָכוֹן как определённое, установленное место и сохраняет явное указание на Божье пребывание.
- source_word: תְּפִלָּתָם
  choice: их молитву
  rationale: Сохраняет единственное число собирательного еврейского существительного и его обычное значение.
- source_word: תְּחִנֹּתֵיהֶם
  choice: мольбы
  rationale: Передаёт настойчивые просьбы о милости и отличает их от общего слова «молитва».
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: защити их дело
  rationale: Еврейская судебная идиома буквально означает «соверши их суд/дело»; выбранная формулировка естественно передаёт действие Бога в поддержку их правого дела, не устраняя юридического оттенка.
- source_word: וְסָלַחְתָּ לְעַמְּךָ
  choice: и прости Твой народ
  rationale: Прямо и естественно передаёт просьбу о Божьем прощении народа.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: согрешивший против Тебя
  rationale: Причастный оборот естественен по-русски, а «против Тебя» передаёт направленность проступка, выраженную предлогом לְ.
theological_decisions:
- issue: Судебный смысл выражения וְעָשִׂיתָ מִשְׁפָּטָם
  choice: защити их дело
  alternative: даруй им правосудие; соверши для них суд
  rationale: Перевод сохраняет образ Бога как Судьи, рассматривающего дело молящихся и действующего ради справедливости, но не предполагает заранее ни осуждения, ни безусловного оправдания.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, даны с прописной буквы в соответствии с распространённой русской библейской традицией; синтаксис остаётся ясным и не архаизированным.
