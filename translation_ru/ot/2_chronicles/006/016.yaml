  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: ru
  text: 'И ныне, Господи, Боже Израиля, исполни для раба Твоего Давида, отца моего, то, что Ты сказал ему: «У тебя не переведётся человек, который будет сидеть на престоле Израиля предо Мною, — только если сыновья твои будут хранить свой путь, ходя по Моему Закону, как ты ходил предо Мною».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении традиционная русская передача тетраграмматона словом «Господь» принимает звательную форму «Господи»; она естественна для молитвенного контекста.
- source_word: שְׁמֹר
  choice: исполни
  rationale: Буквально «сохрани/соблюди», но применительно к обещанию современное русское «исполни» ясно передаёт просьбу сдержать данное слово.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: не пресечётся у тебя … тот
  rationale: Сохранён образ глагола «быть отсечённым, пресечься» и личное обозначение, без добавления отсутствующего в тексте слова «потомок».
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: сыновья твои будут хранить свой путь
  rationale: Переданы и глагол «хранить», и объект «свой путь», без сведения выражения лишь к общему послушанию.
- source_word: בְּתוֹרָתִי
  choice: по Моему Закону
  rationale: В данном контексте תּוֹרָה обозначает данное Богом наставление/Закон; оборот «ходить по Закону» естественен в русском библейском регистре.
theological_decisions:
- issue: Условный характер династического обещания
  choice: «только если сыновья твои будут…»
  alternative: «при условии, что сыновья твои будут…»
  rationale: רַק אִם выражает явное ограничительное условие. Формулировка сохраняет напряжение между обещанием Давиду и требованием верности его сыновей, не устраняя его богословским толкованием.
- issue: Образ продолжения царской линии
  choice: «не пресечётся у тебя предо Мною тот, кто будет сидеть на престоле»
  alternative: «у тебя всегда будет предо Мною потомок, сидящий на престоле»
  rationale: Выбранный вариант ближе к отрицательной и образной форме еврейского текста и не вводит слово «потомок», хотя династический смысл следует из контекста.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы; сохранены библейские образы «хранить путь» и «ходить пред Богом», но синтаксис сделан понятным современному читателю.
