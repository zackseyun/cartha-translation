revisions:
- from: 'И ныне, Господи, Боже Израиля, исполни для раба Твоего Давида, отца моего, то, что Ты сказал ему: «Не пресечётся у тебя предо Мною тот, кто будет сидеть на престоле Израиля, — только если сыновья твои будут хранить свой путь, ходя по Моему Закону, как ты ходил предо Мною».'
  to: 'И ныне, Господи, Боже Израиля, исполни для раба Твоего Давида, отца моего, то, что Ты сказал ему: «У тебя не переведётся человек, который будет сидеть на престоле Израиля предо Мною, — только если сыновья твои будут хранить свой путь, ходя по Моему Закону, как ты ходил предо Мною».'
  rationale: Исправлена только передача идиомы «не будет отсечён у тебя человек». Формулировка «у тебя не переведётся человек» передаёт отрицательное обещание о непрерывности царской линии без добавления слова «потомок» и без снятия условия, относящегося к сыновьям Давида.
