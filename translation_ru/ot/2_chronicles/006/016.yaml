    issue: Неудачное построение «Не пресечётся у тебя предо Мною тот, кто будет сидеть...»
    rationale: Еврейское выражение означает, что у Давида не будет недостатка в человеке, сидящем на престоле Израиля перед Богом. Указательное «тот» в русском создаёт впечатление о конкретном ранее упомянутом лице и делает фразу синтаксически неестественной.
