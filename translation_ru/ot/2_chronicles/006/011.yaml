source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: ru
  text: И там я поставил ковчег, в котором находится завет Яхве, заключённый Им с сынами Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с народом Израиля». Буквально: «с сынами Израиля» — это обычное заветное наименование всего народа Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: я поставил
  rationale: Глагол שׂוּם означает «положить, поместить, поставить». В русском повествовании совершенный вид естественно передаёт завершённое действие.
- source_word: שָׁם
  choice: там
  rationale: Наречие прямо указывает на ранее названное место — храм.
- source_word: הָאָרוֹן
  choice: ковчег
  rationale: В данном культовом контексте אָרוֹן обозначает ковчег завета; «ковчег» — точный и устоявшийся русский эквивалент.
- source_word: אֲשֶׁר שָׁם
  choice: в котором находится
  rationale: Относительная конструкция указывает, что завет находится в ковчеге. Настоящее время сохраняет состояние, актуальное в момент речи.
- source_word: בְּרִית יְהוָה
  choice: завет Яхве
  rationale: בְּרִית передано как «завет», а личное имя יהוה — транслитерацией «Яхве».
- source_word: אֲשֶׁר כָּרַת
  choice: заключённый Им
  rationale: Буквальное древнееврейское выражение «рассекать завет» по-русски естественно передаётся устойчивым сочетанием «заключать завет»; страдательная конструкция ясно связывает действие с Яхве.
- source_word: עִם
  choice: с
  rationale: Предлог выражает участников заключения завета.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Передаёт форму еврейского выражения и сохраняет его традиционное коллективное значение; более явно собирательный вариант дан в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное Божье имя, присутствующее в древнееврейском тексте, не заменяя его титулом.
- issue: Коллективное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: народ Израиля
  rationale: Основной текст сохраняет грамматическую форму и заветное наименование Израиля, а примечание поясняет его собирательный смысл.
- issue: Завет, находящийся в ковчеге
  choice: в котором находится завет
  alternative: где находится завет
  rationale: 'Сохранена метонимия исходного текста: «завет» может обозначать материальное свидетельство завета, находившееся в ковчеге, но перевод не устраняет эту смысловую напряжённость поясняющей вставкой.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис близок к древнееврейскому, при этом идиома заключения завета передана естественно по-русски.
