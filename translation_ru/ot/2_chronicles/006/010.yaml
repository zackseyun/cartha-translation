source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: ru
  text: И исполнил Яхве слово Своё, которое изрёк[a], и я занял место Давида, отца моего, и сижу на престоле Израиля, как говорил Яхве, и построил дом для имени Яхве[b], Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставил слово Своё», то есть утвердил или осуществил сказанное.'
    reason: lexical_alternative
  - marker: b
    text: «Дом» — храм. Еврейский текст сохраняет выражение «дом для имени Яхве».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: исполнил
  rationale: В породе hифиль глагол קום с объектом «слово» означает сделать сказанное действительным, то есть исполнить его; русский глагол «исполнил» естественно сочетается со «словом» и передаёт результат.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: слово Своё, которое изрёк
  rationale: «Слово Своё» сохраняет еврейское דְּבָרוֹ, а «изрёк» естественно передаёт торжественную речь о Божьем обещании и избегает тяжёлого повтора «слово… говорил».
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: я занял место Давида, отца моего
  rationale: В контексте престолонаследия תַּחַת означает «вместо, на месте»; цельное русское выражение «занял место» естественно передаёт вступление Соломона в положение Давида, хотя ослабляет словесный повтор קום.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: сижу на престоле Израиля
  rationale: Форма описывает достигнутое и продолжающееся положение Соломона; настоящее время по-русски естественно выражает этот результат.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: построил дом
  rationale: «Дом» формально сохраняет הַבַּיִת и библейское обозначение храма; завершённость действия естественно передана прошедшим временем.
- source_word: לְשֵׁם יְהוָה
  choice: во имя Яхве
  rationale: Русское «во имя» сохраняет прямую связь святилища с именем Яхве и звучит естественнее буквального «для имени», не сводя выражение лишь к общему «в честь».
theological_decisions:
- issue: Обозначение святилища
  choice: дом
  alternative: храм
  rationale: Еврейский текст говорит הַבַּיִת, «дом». Сохранение этого слова поддерживает канонический образ Божьего дома; пояснение уточняет, что здесь имеется в виду храм.
- issue: Выражение לְשֵׁם יְהוָה
  choice: во имя Яхве
  alternative: для имени Яхве
  rationale: Выбранная формулировка сохраняет богословски значимую связь дома с Божьим именем, не создавая впечатления, будто само имя является адресатом постройки.
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст употребляет собственное covenantное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Инверсия «слово Своё» и выражение «отца моего» сохраняют достоинство речи, не делая её архаичной. Союзная цепочка исходного текста сохранена, но двоеточие проясняет переход от исполнения Божьего слова к перечислению совершившихся событий.
