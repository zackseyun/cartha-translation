base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: ru
  text: А теперь восстань, Яхве, Боже, к месту Твоего покоя — Ты и ковчег Твоей силы[a]. Пусть Твои священники, Яхве, Боже, облекутся в спасение, и пусть верные Тебе[b] радуются благу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ковчег Твоего могущества» или «ковчег Твоей мощи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твои благочестивые» или «Твои святые».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «радуются тому, что хорошо»; возможно также: «радуются Твоей благости». Буквально в еврейском: «радуются в благе (добре)», без явного притяжательного местоимения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה קוּמָה
  choice: А теперь восстань
  rationale: Сохраняет соединительно-временное вступление и повелительную молитвенную формулу; «восстань» звучит возвышенно и естественно в данном контексте.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Боже
  rationale: Передаёт личное имя יהוה как «Яхве», а אֱלֹהִים — формой звательного обращения «Боже».
- source_word: לְנוּחֶךָ
  choice: и приди к месту Твоего покоя
  rationale: Предлог ל обозначает направленность к месту покоя. Добавление «приди» естественно выражает по-русски подразумеваемое движение после «восстань», не меняя адресата или цели прошения.
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: Ты и ковчег Твоей силы
  rationale: Сохраняет параллельное называние Бога и ковчега, а также буквальный образ עֹז — «сила, могущество».
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: облекутся в спасение
  rationale: 'Сохраняет метафору одежды и широкий смысл תְּשׁוּעָה: спасение, избавление, победа.'
- source_word: חֲסִידֶיךָ
  choice: верные Тебе
  rationale: Передаёт заложенную в חָסִיד идею преданности и благочестия в отношениях с Богом, не привнося позднейших специальных значений слова «святые».
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: радуются благу
  rationale: Сжато и естественно передаёт «радуются в благе/добре», сохраняя отсутствие явного притяжательного местоимения в еврейском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит Тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и согласуется с предоставленным доктринальным решением.
- issue: Следует ли уточнять בַטּוֹב как «Твоей благости»
  choice: благу
  alternative: Твоей благости; тому, что хорошо
  rationale: В еврейском нет притяжательного суффикса. Основной текст поэтому не делает подразумеваемую связь с Божьей благостью грамматически явной, а возможное толкование отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-храмового контекста. Синтаксис слегка возвышенный, но понятный; местоимения, обращённые к Богу, написаны с прописной буквы. Подлинная неоднозначность заключительной фразы сохранена.
