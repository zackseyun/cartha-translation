  - marker: b
    text: 'Буквально: «во все дни, пока они живут на лице земли».'
    reason: literal_rendering
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно передаёт целевое значение союза в контексте молитвы.
- source_word: יִירָאוּךָ
  choice: они боялись Тебя
  rationale: 'Сохраняет широкое библейское значение ירא: страх перед Богом, включающий благоговение и послушание; возможное уточнение дано в сноске.'
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: и ходили Твоими путями
  rationale: Русский сочинительный оборот естественно выражает тесно связанную с богобоязненностью жизнь в послушании; образ хождения путями сохранён.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: во все дни своей жизни
  rationale: Передаёт всю продолжительность жизни без неестественного буквального синтаксиса.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: на земле
  rationale: В русском буквальное «на лице земли» здесь неестественно; «земле» сохраняет локальное значение, а последующее определение указывает на дарованную предкам землю.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: которую Ты дал нашим отцам
  rationale: Точно передаёт совершившийся дар и заветную связь с предками Израиля.
theological_decisions:
- issue: Смысл богобоязненности
  choice: боялись Тебя
  alternative: почитали Тебя; благоговели перед Тобой
  rationale: «Бояться» сохраняет богословскую весомость ירא и не сводит выражение ни к одному лишь ужасу, ни к ослабленному уважению; связь с послушанием раскрывает следующая фраза.
- issue: Значение הָאֲדָמָה
  choice: земля, которую Бог дал отцам
  alternative: вся земля; почва
  rationale: Определительное предложение связывает слово с землёй, дарованной предкам, а не обязательно со всем миром.
- issue: Связь לָלֶכֶת с יִירָאוּךָ
  choice: и ходили
  alternative: ходя; тем, что ходили
  rationale: Инфинитив указывает на тесную связь хождения Божьими путями с богобоязненностью. Сочинение естественно по-русски и не исключает смыслового оттенка проявления страха в послушании.
translation_notes:
  register: Современный литературный русский язык с сохранением достойного молитвенного регистра и традиционного библейского образа «ходить путями». Местоимения, обращённые к Богу, написаны с прописной буквы.
