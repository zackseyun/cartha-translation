  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: ru
  text: чтобы они боялись Тебя и ходили Твоими путями во все дни своей жизни на земле, которую Ты дал нашим отцам[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговели перед Тобой». Еврейское «бояться» в этом контексте включает почтение и послушание.'
