  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: ru
  text: тогда услышь[a] с небес, прости грех Твоего народа Израиля и верни их на землю, которую Ты дал им и их отцам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тогда Ты услышишь».'
    reason: Еврейская глагольная форма в этом молитвенном контексте может быть понята как прошение или как выражение уверенного ожидания.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: услышь
  rationale: В контексте молитвенного прошения форма передана естественным русским повелительным наклонением; значение внимательного слышания и последующего ответа остаётся подразумеваемым.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Русское «с небес» естественно передаёт форму множественного числа и обозначение места Божьего пребывания.
- source_word: וְסָלַחְתָּ
  choice: прости
  rationale: Глагол סלח обычно обозначает Божье прощение; форма согласована с рядом молитвенных прошений.
- source_word: לְחַטַּאת
  choice: грех
  rationale: Существительное в единственном числе сохранено и может собирательно обозначать проступок народа.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: Твоего народа Израиля
  rationale: Переданы и заветное обозначение народа, и имя Израиль в естественном русском порядке слов.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: возврати их
  rationale: Каузативная форма שוב означает, что Бог приводит народ обратно; «возврати их» кратко и точно сохраняет этот смысл.
- source_word: אֶל הָאֲדָמָה
  choice: в землю
  rationale: В данном заветно-национальном контексте אֲדָמָה обозначает дарованную Израилю землю, а не просто почву.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: которую Ты дал им и их отцам
  rationale: Сохранены оба адресата дара и прямое значение אבות — «отцы».
theological_decisions:
- issue: Модальность ряда глаголов в молитве
  choice: «услышь… прости… возврати» как прошения
  alternative: «Ты услышишь… простишь… возвратишь» как предсказание или уверенное ожидание
  rationale: Контекст молитвы Соломона благоприятствует передаче еврейских форм как обращённых к Богу прошений, однако формы допускают и оттенок ожидаемого будущего; альтернатива отмечена в сноске.
- issue: Передача אֲבֹתֵיהֶם
  choice: «их отцам»
  alternative: «их предкам»
  rationale: Еврейский текст буквально говорит об «отцах»; такая формулировка сохраняет связь поколений и не требует конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис краток и следует последовательности еврейского текста.
