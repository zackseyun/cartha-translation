base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: ru
  text: Но в самом ли деле Бог будет обитать с человеком[a] на земле? Вот, небо и небеса небес не могут вместить Тебя, тем более этот дом, который я построил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с людьми», «с человечеством». Еврейское слово אָדָם («человек») употреблено здесь собирательно — о человеческом роде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: в самом ли деле
  rationale: Передаёт риторический вопрос с оттенком изумления и сохраняет торжественный, но современный русский регистр.
- source_word: יֵשֵׁב
  choice: будет обитать
  rationale: В контексте Божьего присутствия речь идёт об обитании, а не о буквальном сидении.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма обозначает здесь единого Бога Израиля.
- source_word: אֶת הָאָדָם
  choice: с человеком
  rationale: Сохраняет собирательное единственное число אָדָם; в современном русском «человек» естественно может обозначать человечество в целом.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: Прямое и естественное обозначение места.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию привлечения внимания без архаического «се».
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: небо и небеса небес
  rationale: Сохраняет образную древнееврейскую превосходную конструкцию и её космологическое нарастание.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: не могут вместить Тебя
  rationale: Глагол выражает неспособность пространства охватить или вместить Бога.
- source_word: אַף כִּי
  choice: тем более
  rationale: 'Передаёт довод от большего к меньшему: если даже небеса не вмещают Бога, то построенный дом — и подавно.'
- source_word: הַבַּיִת הַזֶּה
  choice: этот дом
  rationale: Сохраняет буквальный храмовый образ «дома», не заменяя его поясняющим словом «храм».
- source_word: אֲשֶׁר בָּנִיתִי
  choice: который я построил
  rationale: Естественно передаёт завершённое Соломоном строительство дома.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: с человеком
  alternative: с людьми; с человечеством
  rationale: Единственное число сохраняет представительный образ человека, тогда как сноска ясно указывает на включённость всего человечества.
- issue: Соотношение Божьего присутствия и храма
  choice: не могут вместить Тебя
  alternative: не могут удержать Тебя
  rationale: Перевод сохраняет напряжение между реальным Божьим обитанием с людьми и Его непространственной безграничностью, не сводя присутствие Бога к локальному заключению в храме.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. «Вот» предпочтено архаическому «се»; «дом» сохраняет исходную храмовую метафору. Местоимение «Тебя» написано с прописной буквы в соответствии с традиционным русским благоговейным обращением к Богу.
