  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: ru
  text: Если Твой народ, Израиль, будет разбит врагом за то, что согрешил против Тебя, а затем вернётся[a], исповедует Твоё имя[b], будет молиться и умолять о милости перед Тобой[c] в этом доме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратится к Тебе»; в контексте отношений завета этот глагол может также подразумевать покаяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прославит Твоё имя» или «воздаст хвалу Твоему имени».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «станет просить у Тебя милости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִנָּגֵף
  choice: будет разбит
  rationale: Нифаль передаёт поражение в военном столкновении; пассивная форма «будет разбит» естественна по-русски и сохраняет результативный оттенок.
- source_word: לִפְנֵי אוֹיֵב
  choice: врагом
  rationale: Буквально — «перед врагом»; в данном военном контексте это еврейская идиома поражения от руки врага. Русское «будет разбит врагом» ясно и естественно передаёт смысл.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: за то, что согрешил против Тебя
  rationale: כִּי указывает причину поражения, а לָךְ при глаголе греха естественно передаётся как «против Тебя». Единственное число согласовано с собирательным существительным «народ».
- source_word: וְשָׁבוּ
  choice: обратится к Тебе
  rationale: שׁוב означает возвращение или поворот назад и в контексте завета может подразумевать покаяние. «Обратится к Тебе» сохраняет образ возвращения, не превращая его в узкий технический термин.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: исповедует Твоё имя
  rationale: Hифиль ידה допускает значения признания, исповедания и хвалы. В контексте возвращения после греха «исповедует Твоё имя» передаёт открытое признание Бога, а сноска сохраняет возможный оттенок хвалы.
- source_word: וְהִתְפַּלְלוּ
  choice: будет молиться
  rationale: Обычное значение хитпаэля от פלל; направление молитвы раскрывается последующим «пред Тобой».
- source_word: וְהִתְחַנְּנוּ
  choice: молить о милости
  rationale: Хитпаэль от חנן обозначает настойчивую просьбу о благосклонности или милости. Выражение понятно современному читателю и сохраняет связь с милостью.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Сохраняет пространственно-религиозную идиому непосредственного обращения в Божьем присутствии; форма «пред» уместна в возвышенной молитвенной речи.
- source_word: בַּבַּיִת הַזֶּה
  choice: в этом доме
  rationale: Предлог בְּ означает «в», а בַּיִת буквально — «дом». Такое соответствие сохраняет лексику молитвы освящения храма без поясняющей подмены словом «храм».
theological_decisions:
- issue: Покаянный оттенок וְשָׁבוּ
  choice: обратится к Тебе
  alternative: вернётся; покается
  rationale: Контекст заветного восстановления предполагает покаяние, однако сам глагол шире специального термина «покаяться». Выбранный вариант сохраняет и направление к Богу, и образ возвращения.
- issue: Значение וְהוֹדוּ אֶת שְׁמֶךָ
  choice: исповедует Твоё имя
  alternative: прославит Твоё имя; воздаст хвалу Твоему имени
  rationale: Форма ידה может выражать признание, исповедание либо хвалу. Контекст греха и возвращения поддерживает «исповедует», но неоднозначность сохранена в сноске, а не разрешена догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Собирательное «народ» последовательно согласовано в единственном числе. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
