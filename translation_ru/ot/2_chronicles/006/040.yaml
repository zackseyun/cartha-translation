  text: עַתָּ֣ה אֱלֹהַ֗/י יִֽהְיוּ נָ֤א עֵינֶ֨י/ךָ֙ פְּתֻח֔וֹת וְ/אָזְנֶ֖י/ךָ קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: ru
  text: И ныне, Боже мой, пусть же глаза Твои будут открыты и уши Твои внимательны к молитве этого места[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к молитве, совершаемой на этом месте»; или: «к молитве, воссылаемой с этого места». Буквально: «к молитве этого места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: И ныне
  rationale: Маркер перехода вводит заключительное прошение Соломона; «и ныне» естественно передаёт как связь с предыдущей речью, так и торжественный молитвенный регистр.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица употреблена как прямое обращение; русский звательный оборот «Боже мой» точно и естественно передаёт его.
- source_word: יִהְיוּ נָא
  choice: пусть же ... будут
  rationale: Юссив с частицей נָא выражает почтительную просьбу. Частица «же» поддерживает просительный оттенок, не делая фразу разговорной.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: глаза Твои будут открыты
  rationale: Сохранён конкретный антропоморфный образ Божьего внимания без истолковывающей замены вроде «наблюдай».
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: и уши Твои внимательны
  rationale: קַשֻּׁבוֹת обозначает внимательность и готовность слышать; русское сочетание сохраняет исходный образ и молитвенный стиль.
- source_word: לִתְפִלַּת
  choice: к молитве
  rationale: Предлог ל обозначает направленность внимания к молитве; «к молитве» непосредственно передаёт эту связь.
- source_word: הַמָּקוֹם הַזֶּה
  choice: этого места
  rationale: Сохранена буквальная генитивная связь «молитва этого места», поскольку еврейский текст не уточняет явно, совершается ли молитва в этом месте или исходит оттуда.
theological_decisions:
- issue: Антропоморфное описание Божьих глаз и ушей
  choice: 'Сохранить конкретные образы: «глаза Твои будут открыты и уши Твои внимательны»'
  alternative: 'Передать толкованием: «наблюдай и услышь»'
  rationale: Исходный текст говорит о Божьем внимании посредством телесных образов. Их сохранение передаёт литературное и богословское напряжение текста, не утверждая грубой телесности Бога.
- issue: Связь молитвы с храмовым местом
  choice: «к молитве этого места» с пояснительной сноской
  alternative: «к молитве, совершаемой на этом месте» или «к молитве, воссылаемой с этого места»
  rationale: Еврейская генитивная конструкция допускает более одного понимания; основной текст не должен молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. «Ныне» и постпозиция местоимения в сочетаниях «Боже мой», «глаза Твои», «уши Твои» поддерживают торжественный регистр, оставаясь понятными современному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно устойчивой русской библейской издательской практике.
