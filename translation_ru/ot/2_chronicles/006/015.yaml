  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: ru
  text: 'Ты исполнил то, что сказал рабу Твоему Давиду, моему отцу[a]: устами Твоими Ты сказал и рукой Твоей исполнил — как видно сегодня[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что обещал ему». Буквально: «то, что сказал ему»; значение обещания следует из контекста исполнения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «устами Твоими … и рукой Твоей» — еврейское сопоставление произнесённого Богом слова с Его действенным осуществлением. «Как видно сегодня» передаёт обычную библейскую формулу, указывающую на нынешнее подтверждение сказанного.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: исполнил
  rationale: В контексте данного обещания и последующего осуществления שׁמר означает верно сдержать и исполнить сказанное; по-русски «исполнил» естественно связывает обе части стиха.
- source_word: לְעַבְדְּךָ
  choice: для раба Твоего
  rationale: Предлог ל при שׁמר указывает на того, для кого было сохранено и исполнено обещанное; «раб» соответствует молитвенному обращению в царском контексте.
- source_word: דָּוִיד אָבִי
  choice: Давида, отца моего
  rationale: Сохраняется еврейский порядок слов, а приложение оформлено естественно для современного литературного русского языка.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: то, что сказал ему
  rationale: Передаёт буквальное значение «то, что Ты говорил ему», не подменяя его словом «обещал»; значение обещания ясно из контекста исполнения.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: устами Твоими Ты сказал
  rationale: Сохраняет конкретный образ и параллелизм между Божьими устами и рукой.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: и рукой Твоей исполнил это
  rationale: מלא здесь означает довести сказанное до осуществления; «рукой Твоей» сохраняет образ действенного поступка.
- source_word: כַּיּוֹם הַזֶּה
  choice: как и есть сегодня
  rationale: Передаёт указание на нынешнее, видимое осуществление сказанного без излишне архаичного оборота «как в сей день».
theological_decisions:
- issue: Антропоморфные выражения об устах и руке Бога
  choice: Сохранить образы «устами Твоими» и «рукой Твоей»
  alternative: 'Передать динамически: «Ты сказал и совершил»'
  rationale: Еврейский текст намеренно сопоставляет Божье слово и действенное осуществление. Сохранение образов передаёт риторику текста, не добавляя утверждения о телесности Бога.
- issue: Промислительный смысл глагола דִּבַּרְתָּ
  choice: В основном тексте перевести «сказал»
  alternative: Перевести «обещал»
  rationale: Контекст несомненно придаёт сказанному характер обещания, однако сам глагол означает «говорить»; примечание сохраняет смысловую альтернативу, не устраняя лексическую конкретность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксический параллелизм и антропоморфные образы оригинала сохранены; архаизмы по возможности устранены.
