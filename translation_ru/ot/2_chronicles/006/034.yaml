  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: ru
  text: Если Твой народ выступит на войну против своих врагов по пути, которым Ты его пошлёшь, и помолится Тебе, обратившись в сторону этого города[a], который Ты избрал, и дома[b], который я построил для Твоего имени,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по направлению к этому городу»; речь идёт о молитве, обращённой в сторону Иерусалима.'
    reason: lexical_alternative
  - marker: b
    text: «Дом» — храм, который Соломон построил для имени Господа.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В молитве Соломона союз вводит условный случай, за которым следует просьба; «если» ясно передаёт условную конструкцию.
- source_word: יֵצֵא ... לַמִּלְחָמָה
  choice: выступит на войну
  rationale: Военный оборот буквально обозначает выход на войну; выбран естественный современный русский эквивалент.
- source_word: עַל אֹיְבָיו
  choice: против своих врагов
  rationale: Местоименный суффикс согласован с собирательным «народ»; русское «своих» естественно сохраняет эту связь.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: по пути, которым Ты его пошлёшь
  rationale: Сохраняется конкретный образ пути и мысль о том, что направление похода задаёт Бог; множественный объект еврейского глагола передан русским собирательным единственным «народ».
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: и помолится Тебе
  rationale: Стандартная и ясная передача направленной к Богу молитвы; единственное число согласовано с собирательным существительным «народ».
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: обратившись к этому городу
  rationale: В данном контексте דֶּרֶךְ выражает пространственную ориентацию молитвы. Русский оборот передаёт направление без неестественного буквального повторения слова «путь».
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: который Ты избрал
  rationale: Глагол сохраняет библейски значимую идею Божьего избрания города, не добавляя толкования.
- source_word: וְהַבַּיִת
  choice: и к дому
  rationale: Слово «дом» сохраняет исходную храмовую метафору; конкретная отсылка к храму пояснена в сноске.
- source_word: אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: который я построил для Твоего имени
  rationale: Прямая передача храмовой формулы; «для Твоего имени» сохраняет её богословскую насыщенность и не заменяет имя понятием присутствия.
theological_decisions:
- issue: Пространственная направленность молитвы к Иерусалиму и храму
  choice: 'Сохранена конкретная направленность: «обратившись к этому городу ... и к дому».'
  alternative: 'Передать отвлечённо: «молясь в связи с этим городом и храмом» или конкретизировать позу словами «повернувшись лицом».'
  rationale: Еврейский текст говорит о направлении молитвы, но прямо не упоминает лицо или телесную позу. Формулировка сохраняет историко-храмовый смысл и не привносит позднейших доктринальных выводов.
- issue: «Дом» и Божье имя
  choice: Сохранены выражения «дом» и «для Твоего имени».
  alternative: Заменить их толкованием «храм, в котором Ты пребываешь».
  rationale: Исходный текст связывает храм именно с Божьим именем. Перевод не отождествляет эту формулу без оговорок с локализацией Божьего существа или присутствия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Обращение к Богу передано традиционными прописными местоимениями. Собирательное «народ» последовательно согласовано в единственном числе. Конечная запятая сохранена, поскольку стих представляет придаточную условную часть молитвы, продолженную в следующем стихе.
