  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: ru
  text: тогда услышь с небес, из Твоего жилища, и поступи согласно всему, о чём попросит Тебя чужеземец, чтобы все народы земли узнали Твоё имя, боялись Тебя, как боится Тебя Твой народ Израиль, и узнали, что этот дом, который я построил, назван Твоим именем[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на этом доме наречено Твоё имя». Это еврейская идиома, означающая, что дом связан с именем Бога и носит его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: услышь
  rationale: В контексте молитвы глагол означает не просто восприятие звука, а внимательное слушание с предполагаемым ответным действием; «услышь» естественно передаёт это в русском молитвенном контексте.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Форма множественного числа сохранена привычным русским библейским выражением «с небес».
- source_word: מִמְּכוֹן שִׁבְתֶּךָ
  choice: с места Твоего обитания
  rationale: מָכוֹן обозначает установленное, определённое место; перевод сохраняет локативный смысл и звучит современно и достойно.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: и исполни всё, о чём воззовёт к Тебе
  rationale: В данном просительном контексте עשה с последующей конструкцией естественно передаётся как исполнение просьбы. «Воззовёт» сохраняет смысл обращения к Богу, хотя несколько возвышеннее нейтрального «обратится».
- source_word: הַנָּכְרִי
  choice: иноплеменник
  rationale: Слово обозначает человека из другого народа, не из Израиля. «Иноплеменник» точно передаёт этническую принадлежность и избегает возможного смысла временно проживающего чужеземца.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: все народы земли
  rationale: Универсальный контекст требует значения «земля» как весь мир, а множественное עַמֵּי передано словом «народы».
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: и боялись Тебя
  rationale: Сохранён прямой язык страха Божьего, включающий благоговение; более мягкое «почитали» сузило бы силу исходного слова.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: что этот дом ... назван Твоим именем
  rationale: Это естественный русский эквивалент еврейской идиомы «Твоё имя призвано над этим домом»; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Соотношение небес как места Божьего обитания и земного храма
  choice: Сохранить «с небес, с места Твоего обитания» и отдельно назвать храм домом, но не местом Божьего обитания
  alternative: Передать как «из Твоего небесного присутствия», устраняя пространственный язык
  rationale: Исходный текст сам различает небесное обитание Бога и дом на земле, связанный с Его именем. Перевод сохраняет это напряжение и не вносит дополнительных систематических пояснений.
- issue: Значение богобоязненности народов
  choice: «боялись Тебя»
  alternative: «благоговели перед Тобой»
  rationale: Прямой перевод сохраняет как благоговейную, так и собственно устрашающую сторону ירא, не ослабляя богословскую насыщенность выражения.
- issue: Идиома о Божьем имени над храмом
  choice: В тексте дать естественное «дом назван Твоим именем», а буквальную форму сохранить в сноске
  alternative: Оставить в основном тексте «Твоё имя призвано над этим домом»
  rationale: Идиома означает принадлежность дома Богу и его связь с Божьим именем. Естественный перевод сообщает смысл, а сноска сохраняет исходный образ и возможную богословскую значимость формулировки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской религиозно-издательской норме. Синтаксис сохраняет развернутое целевое построение оригинала, оставаясь понятным современному читателю.
