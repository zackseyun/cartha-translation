  source_fidelity: В целом структура молитвы, цели ответа на молитву чужеземца, «все народы земли», страх перед Богом и идиома об имени, связанном с домом, переданы верно. Однако «исполни всё» несколько чрезмерно конкретизирует широкий глагол עָשָׂה («сделай/поступи»), а «иноплеменник» не отвечает требованию современного литературного русского.
