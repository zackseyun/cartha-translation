base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: ru
  text: тогда услышь с небес[a], прости грех Твоих слуг и Твоего народа Израиля, когда Ты наставишь их на добрый путь, которым им следует идти, и даруй дождь Твоей земле, которую Ты дал Своему народу в наследие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышь на небесах». Буквально в еврейском тексте: «услышь небеса»; в этой молитвенной формуле имеется в виду, что Бог слышит из Своей небесной обители.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: услышь на небесах
  rationale: В еврейском тексте буквально стоит «услышь небеса», однако в молитвенной формуле подразумевается, что Бог слышит, пребывая в Своей небесной обители. Русское «на небесах» сохраняет образ и не требует вставлять отсутствующий предлог «с».
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: прости грех
  rationale: חַטָּאת здесь означает грех или вину; единственное число и прямое управление сохранены.
- source_word: עֲבָדֶיךָ
  choice: Твоих слуг
  rationale: В молитвенном контексте עֶבֶד обозначает подчинённых и служащих Богу людей, а не подчёркивает их положение рабов.
- source_word: כִּי תוֹרֵם
  choice: когда Ты наставишь их
  rationale: כִּי допускает причинное и обстоятельственно-временное понимание. В данном ходе прошения «когда» естественно связывает прощение и восстановление с Божьим наставлением, не делая связь жёстко причинной.
- source_word: אֶל הַדֶּרֶךְ הַטּוֹבָה
  choice: на добрый путь
  rationale: Предлог אֶל передаёт направленность наставления, а «добрый путь» сохраняет нравственную характеристику הַטּוֹבָה без замены её толкованием «правильный».
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: которым им следует идти
  rationale: Сохранены метафора хождения как образ жизни и подразумеваемая нормативность пути.
- source_word: וְנָתַתָּ מָטָר
  choice: и даруй дождь
  rationale: Глагол נָתַן буквально означает «дать». «Даруй дождь» естественно звучит в русской молитвенной речи и не заменяет этот глагол более свободным «пошли».
- source_word: עַל אַרְצְךָ
  choice: Твоей земле
  rationale: Русский дательный при «даруй дождь» естественно передаёт направленность עַל и сохраняет явное указание на принадлежность земли Богу.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: которую Ты дал Своему народу в наследие
  rationale: נַחֲלָה передаёт землю как дарованное народу наследственное владение; «в наследие» сохраняет этот заветный образ.
theological_decisions:
- issue: Связь Божьего прощения, наставления и ниспослания дождя
  choice: כִּי передано как «когда», а стих оформлен как единое прошение об услышании, прощении, наставлении и дожде.
  alternative: «ибо Ты наставишь их» или «потому что Ты наставляешь их»
  rationale: Еврейский союз допускает причинный оттенок, но контекст молитвы позволяет обстоятельственно-временное прочтение. Выбор «когда» сохраняет последовательность прошения и не утверждает более строгой причинной схемы, чем требует текст.
- issue: Принадлежность земли
  choice: Сохранено «Твоей земле», после чего сказано, что Бог дал её народу в наследие.
  alternative: «земле, данной Тобой народу» без указания «Твоей»
  rationale: 'Так сохраняется напряжение самого текста: земля принадлежит Богу и одновременно дарована Израилю как наследие.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис остаётся ясным для обычного читателя, при этом сохранены библейские образы доброго пути и земли как наследия.
