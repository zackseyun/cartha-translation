source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: ru
  text: А также чужеземца, который не из Твоего народа Израиля, но придёт из далёкой страны ради Твоего великого имени, Твоей крепкой руки и Твоей простёртой мышцы, — когда они придут и будут молиться[a], обратившись к этому дому[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте происходит переход от единственного числа («чужеземец… придёт») к множественному («они придут и будут молиться»); вероятно, один чужеземец представлен как типичный случай.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «к этому дому»; в контексте молитвы имеется в виду молитва, совершаемая по направлению к храму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: чужеземца
  rationale: «Чужеземец» обозначает человека из другого народа и сохраняет противопоставление Израилю; при этом слово уместно в современном литературном и библейском регистре.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: который не из Твоего народа Израиля
  rationale: Формулировка прямо сохраняет принадлежность Израиля Богу и определяет чужеземца как не принадлежащего к этому народу.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: но придёт из далёкой страны
  rationale: Союз «но» естественно передаёт смысловое противопоставление после отрицательной характеристики; будущее время соответствует контексту молитвы о возможном случае.
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: ради Твоего великого имени
  rationale: «Ради» сохраняет широкий смысл לְמַעַן — побуждение и основание прихода — и не добавляет отсутствующего здесь глагола «услышит».
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: Твоей крепкой руки
  rationale: Сохранён конкретный антропоморфный образ Божьей действенной силы; «крепкая рука» точно передаёт חֲזָקָה и звучит естественно в данном высоком регистре.
- source_word: וּזְרוֹעֲךָ הַנְּטוּיָה
  choice: Твоей простёртой мышцы
  rationale: «Мышца» различает זְרוֹעַ и предшествующее יָד и сохраняет традиционный, но понятный библейский образ могучей руки, простёртой для действия.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: когда они придут и будут молиться
  rationale: Перевод сохраняет заметный переход еврейского текста от единственного числа («чужеземец… придёт») к множественному («они придут и будут молиться»), не устраняя его толкованием.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: обратившись к этому дому
  rationale: В контексте храмовой молитвы אֶל обозначает направление молитвы. Добавление «обратившись» ясно передаёт направление и не создаёт ложного впечатления, будто молитва обращена к самому дому.
theological_decisions:
- issue: Переход от единственного числа к множественному
  choice: 'Сохранить: «чужеземца… придёт… когда они придут и будут молиться»'
  alternative: 'Согласовать всё в единственном числе: «когда он придёт и будет молиться»'
  rationale: Сам еврейский текст меняет число, вероятно переходя от одного типичного чужеземца к общей группе. Сохранение перехода удерживает подлинную особенность текста, а сноска объясняет её читателю.
- issue: Антропоморфные образы Божьей силы
  choice: «Твоей крепкой руки и Твоей простёртой мышцы»
  alternative: «Твоего великого могущества»
  rationale: Конкретные образы руки и мышцы связаны с библейским языком Божьих могущественных деяний; сведение их к абстрактному «могуществу» обеднило бы текст.
- issue: Направление молитвы по отношению к храму
  choice: «обратившись к этому дому»
  alternative: «этому дому» или «к этому дому» без поясняющего глагола
  rationale: Молитва направлена к Богу при обращении в сторону храма, а не адресована храму. Выбранная формулировка передаёт контекстуальный смысл предлога, не превращая дом в объект поклонения.
translation_notes:
  register: Современный литературный русский язык с достоинством храмовой молитвы. Синтаксическая незавершённость и конечная запятая сохранены, поскольку просьба продолжается в следующем стихе. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру.
