  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: ru
  text: 'Соломон перевёл дочь фараона из города Давида в дом, который построил для неё, потому что сказал: «Моя жена не должна жить в доме Давида, царя Израиля, ведь святы те места[a], куда пришёл ковчег Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «ведь святы они, к которым пришёл ковчег Яхве»; слово «места» подразумевается формами множественного числа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: перевёл
  rationale: Порода hифиль глагола עלה означает «поднять, привести наверх». В данном контексте речь идёт о переселении в другую резиденцию; русское «перевёл» естественно передаёт это действие, хотя пространственный оттенок движения вверх остаётся невыраженным.
- source_word: מֵעִיר דָּוִיד
  choice: из города Давида
  rationale: Прямое и общепонятное обозначение места исхода.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: в дом, который построил для неё
  rationale: בַּיִת непосредственно означает «дом», а контекст позволяет понять его как царскую резиденцию без добавления слова «дворец».
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: Моя жена не должна жить
  rationale: אִשָּׁה может значить «женщина» или «жена»; упоминание дочери фараона и форма לִי указывают здесь на жену Соломона. «Жить» естественно передаёт значение постоянного пребывания глагола ישׁב.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: в доме Давида, царя Израиля
  rationale: Сохраняется лексема «дом» и пояснительное приложение к имени Давида.
- source_word: קֹדֶשׁ הֵמָּה
  choice: святы те места
  rationale: Множественное местоимение הֵמָּה требует множественного подразумеваемого референта; «места» делает эллипсис понятным и сохраняет категорию святости.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: куда входил ковчег Яхве
  rationale: Русское «куда» соотносится с добавленным «те места». Прошедшее «входил» сохраняет факт пребывания ковчега в этих местах, не навязывая точного числа его перемещений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Подразумеваемый референт множественного числа в обосновании святости
  choice: Местоимение относится к местам в доме Давида, куда входил ковчег.
  alternative: Высказывание в общем относится ко всему дому Давида; либо эллипсис оставляется без пояснения.
  rationale: В еврейском тексте הֵמָּה и אֲלֵיהֶם стоят во множественном числе. Добавление «места» объясняет грамматику, не уточняя сверх текста, какие именно части резиденции имеются в виду.
- issue: Значение אִשָּׁה в словах Соломона
  choice: жена
  alternative: женщина
  rationale: Контекст прямо говорит о дочери фараона как жене Соломона; перевод «женщина» мог бы ошибочно создать впечатление общего запрета для всех женщин.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён до естественной русской формы; богословская мотивировка и грамматическая неоднозначность подразумеваемого множественного референта сохранены в примечании.
