  text: מִן בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נוֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֥ר לֹֽא כִלּ֖וּ/ם בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַ֔ס עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: ru
  text: Из их потомков, оставшихся после них в земле, — тех, кого сыны Израиля не истребили[a], — Соломон привлёк к принудительным работам[b]; так продолжается до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кого израильтяне не уничтожили полностью». «Сыны Израиля» — обычное библейское обозначение израильского народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обложил их трудовой повинностью». Еврейское слово обозначает обязательные работы в пользу государства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: из их потомков
  rationale: В данном родовом и народном контексте בנים обозначает не только непосредственных сыновей, но и потомков.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: оставшихся после них
  rationale: Передаёт значение оставшегося остатка и временное отношение, выраженное אַחֲרֵיהֶם.
- source_word: בָּאָרֶץ
  choice: в этой земле
  rationale: Определённая форма указывает на уже известную землю; указательное «этой» естественно передаёт это в русском контексте.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: тех, кого сыны Израиля не истребили
  rationale: Пиэль כלה здесь означает полное уничтожение; «сыны Израиля» сохраняет традиционное национальное обозначение исходного текста.
- source_word: וַיַּעֲלֵם ... לְמַס
  choice: Соломон набрал людей на принудительные работы
  rationale: Сочетание каузативной формы עלה с מַס описывает возложение государственной трудовой повинности; русский оборот передаёт административно-принудительный смысл без технического жаргона.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и так остаётся до сего дня
  rationale: Формула сообщает о продолжении описанного положения до времени повествователя; добавление «и так остаётся» делает эллиптическую связь ясной по-русски, не определяя точнее, какой именно аспект сохранялся.
