  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: ru
  text: 'и возносил приношения по установленному на каждый день порядку[a], как повелел Моисей: по субботам, в новомесячия и в назначенные праздники — три раза в год: в Праздник Опресноков[b], в Праздник Недель[c] и в Праздник Шалашей[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по делу каждого дня в его день»; возможный перевод: «по правилу на каждый день».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Праздник Пресных хлебов»; опресноки — хлеб без закваски.'
    reason: lexical_alternative
  - marker: c
    text: Праздник Недель в позднейшем греческом употреблении называется Пятидесятницей.
    reason: cross_reference
  - marker: d
    text: Традиционное название — «праздник Кущей»; еврейское слово буквально означает «шалаши».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: по установленному на каждый день порядку
  rationale: Еврейская идиома буквально означает «по делу/установлению дня в его день» и указывает на предписанный для каждого дня порядок. Перевод передаёт её административно-богослужебный смысл естественным современным русским языком.
- source_word: לְהַעֲלוֹת
  choice: возносил приношения
  rationale: В жертвенном контексте Hiphil от עלה означает возносить жертву на жертвеннике. «Приношения» сохраняет культовый смысл, не сужая его без необходимости только до одного русского термина для жертвы.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: как повелел Моисей
  rationale: Естественно передаёт значение «согласно повелению Моисея» и сохраняет Моисея как источник данного предписания.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים
  choice: по субботам, в новомесячия
  rationale: Предлоги обозначают календарные случаи совершения приношений. חֳדָשִׁים в богослужебном календаре означает дни новолуния, то есть новомесячия, а не месяцы вообще.
- source_word: וְלַמּוֹעֲדוֹת
  choice: в назначенные праздники
  rationale: מוֹעֲדִים обозначает назначенные времена собраний и праздников; последующий перечень трёх праздников уточняет здесь именно праздничный смысл.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: три раза в год
  rationale: Прямой и идиоматичный перевод временного выражения.
- source_word: בְּחַג הַמַּצּוֹת
  choice: в праздник Пресных хлебов
  rationale: Прозрачно передаёт еврейское название паломнического праздника без замены его другим связанным названием.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: в праздник Недель
  rationale: Сохраняет данное в еврейском тексте название; позднейшее греческое наименование «Пятидесятница» вынесено в примечание.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: в праздник Шалашей
  rationale: סֻכּוֹת буквально означает временные шалаши или укрытия. Прозрачное название сохраняет конкретный образ еврейского слова; традиционное русское «Кущей» указано в примечании.
theological_decisions:
- issue: Передача названий трёх паломнических праздников
  choice: праздник Пресных хлебов / праздник Недель / праздник Шалашей
  alternative: Пасха / Пятидесятница / праздник Кущей
  rationale: Основной текст следует непосредственно еврейским названиям и не заменяет их более поздними или связанными наименованиями. Устоявшиеся названия, полезные для узнавания праздников, сохранены в примечаниях там, где это необходимо.
- issue: Неявный объект глагола לְהַעֲלוֹת
  choice: возносил приношения
  alternative: возносил всесожжения
  rationale: Контекст предыдущего стиха говорит о всесожжениях, однако в самом стихе 13 объект глагола не выражен. Более широкое «приношения» сохраняет жертвенный смысл, не делая контекстуальное уточнение частью явного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «и» и форма прошедшего времени связывают стих с действием Соломона в предыдущем контексте. Названия праздников переданы прозрачно, без архаизмов в основном тексте; традиционные соответствия вынесены в примечания.
