  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: ru
  text: и Баалат, и все принадлежавшие Соломону города для хранения припасов[a], и все города для колесниц, и города для всадников[b], и всё, что Соломон желал построить[c] в Иерусалиме, в Ливане и по всей земле, находившейся под его властью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «складские города», «города снабжения» или, возможно, «города-сокровищницы».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «города для коней»; однако древнееврейское слово обычно означает всадников или конницу.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «всё желание Соломона, которое он желал построить»; однокоренной повтор подчёркивает его желание или удовольствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: Баалат
  rationale: Географическое название передано транслитерацией непосредственно с древнееврейского, с сохранением конечного согласного ת.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: города для хранения припасов
  rationale: Выражение обозначает города, служившие для складирования запасов или снабжения; перевод ясен современному читателю и не сужает значение до сокровищ.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: принадлежавшие Соломону
  rationale: Естественно передаёт древнееврейскую конструкцию обладания и сохраняет её административный смысл.
- source_word: עָרֵי הָרֶכֶב
  choice: города для колесниц
  rationale: Передаёт назначение городов, связанных с размещением колесниц и обеспечением колесничных сил.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: города для всадников
  rationale: פָּרָשִׁים обычно означает всадников или конницу, а не самих коней; формулировка сохраняет отличие от городов для колесниц.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: всё, что Соломон желал построить
  rationale: Естественно передаёт однокоренную конструкцию «желание… желал», подчёркивающую волю или удовольствие Соломона, без тяжеловесного повтора в основном тексте.
- source_word: לִבְנוֹת
  choice: построить
  rationale: Инфинитив означает строительство; непосредственный контекст не требует значения «перестроить».
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Использовано общепринятое русское наименование города.
- source_word: וּבַלְּבָנוֹן
  choice: на Ливане
  rationale: Предлог «на» естественен по-русски при обозначении Ливана как горной области и сохраняет географический смысл.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: по всей земле, находившейся под его властью
  rationale: Передаёт одновременно территориальный смысл אֶרֶץ и значение власти или господства в מֶמְשָׁלָה естественным современным русским языком.
