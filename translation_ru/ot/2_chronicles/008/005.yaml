source:
  edition: WLC
  text: וַ/יִּ֜בֶן אֶת בֵּ֤ית חוֹרוֹן֙ הָֽ/עֶלְי֔וֹן וְ/אֶת בֵּ֥ית חוֹר֖וֹן הַ/תַּחְתּ֑וֹן עָרֵ֣י מָצ֔וֹר חוֹמ֖וֹת דְּלָתַ֥יִם וּ/בְרִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: ru
  text: Он построил Верхний Беф-Орон и Нижний Беф-Орон — укреплённые города со стенами, воротными створками[a] и засовами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двойными дверями»; вероятно, имеются в виду створки городских ворот.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «запорными брусьями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он построил
  rationale: Глагол בנה обозначает строительство; сам по себе он не требует значения «перестроил». Местоимение сохраняет связь с Соломоном из контекста.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: Верхний Беф-Орон
  rationale: Название города передано в принятой русской библейской форме, а определение — естественным обозначением высоты местности.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Нижний Беф-Орон
  rationale: Параллельное географическое название передано согласованно с «Верхний Беф-Орон».
- source_word: עָרֵי מָצוֹר
  choice: укреплённые города
  rationale: Сочетание обозначает города, оснащённые оборонительными сооружениями; это ясно и естественно по-русски.
- source_word: חוֹמוֹת
  choice: со стенами
  rationale: Существительное описывает оборонительные стены городов и естественно включается в перечисление их укреплений.
- source_word: דְּלָתַיִם
  choice: воротными створками
  rationale: Двойственное число буквально указывает на две двери или створки. В контексте городских укреплений речь, вероятнее всего, о створках ворот, однако они не заменены общим словом «ворота».
- source_word: וּבְרִיחַ
  choice: и засовами
  rationale: בְּרִיחַ обозначает поперечный запорный брус или засов, которым закрепляли двери либо створки ворот.
