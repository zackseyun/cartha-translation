    rationale: В оригинале מִן после הַנּוֹתָר вводит группы, среди которых остались люди; русское «от хеттов» может быть понято как источник действия или как остаток, оставшийся после хеттов. «Среди хеттов...» устраняет неуместную двусмысленность.
  - severity: low
    issue: «Не принадлежал к Израилю» менее близко к формулировке оригинала.
    rationale: Выражение אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה буквально характеризует их как не происходящих/не являющихся из Израиля. «Не были израильтянами» в данном перечислении народов ясно и естественно; буквальный вариант следует вынести в сноску.
