base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: ru
  text: Все люди, оставшиеся среди хеттов, амореев, ферезеев, евеев и иевусеев, — тех, кто не были израильтянами[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто не был из Израиля».'
    reason: Сохраняет буквальную форму еврейского выражения מִיִּשְׂרָאֵל, тогда как основной текст передаёт его естественным русским обозначением.
lexical_decisions:
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Сочетание обозначает всю совокупность оставшегося не-израильского населения; «весь народ» естественно и сохраняет собирательный характер еврейского выражения.
- source_word: הַנּוֹתָר
  choice: оставшийся
  rationale: Причастие нифаля выражает значение остатка — тех, кто уцелел или остался; согласованное определение «оставшийся» кратко и точно передаёт форму оригинала.
- source_word: מִן
  choice: от
  rationale: Предлог указывает на происхождение от перечисленных народов; русское «от» сохраняет эту связь без добавочного толкования.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: хеттов, амореев, ферезеев, евеев и иевусеев
  rationale: Еврейские формы стоят в собирательном единственном числе, но в современном русском названия народов естественно передаются множественным числом; выбраны устоявшиеся русские библейские этнонимы.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: тех, кто не принадлежал к Израилю
  rationale: Формулировка передаёт принадлежность или происхождение, выраженные מִן, и звучит естественнее буквального «не был из Израиля», не сводя выражение исключительно к современному понятию национальности.
