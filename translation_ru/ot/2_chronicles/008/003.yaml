lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл к
  rationale: Глагол הלך в повествовательной форме прежде всего означает движение — «пошёл». Предлог «к» естественно связывает его с названием места, не добавляя прямо не выраженного в самом глаголе значения нападения.
- source_word: חֲמָת צוֹבָה
  choice: Хамат-Цова
  rationale: Два географических названия переданы как составной топоним. Форма «Цова» соответствует принятой русской передаче еврейского названия צובה и сохраняет структуру исходного текста.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: овладел ею
  rationale: Оборот חזק על буквально описывает проявление силы или превосходства над чем-либо, а в контексте царского похода указывает на установление контроля. «Овладел ею» естественно передаёт военно-политический результат, не уточняя способ захвата.
