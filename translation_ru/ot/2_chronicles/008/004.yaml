  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: ru
  text: Он построил Тадмор в пустыне[a] и все города для хранения припасов, которые он построил в Хамате.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тадмор традиционно отождествляют с Пальмирой.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он построил
  rationale: Форма wayyiqtol от בנה обозначает последовательное действие в прошлом. В русском повествовании естественно передать её простым прошедшим временем, не добавляя обязательного «и» или «затем».
- source_word: תַּדְמֹר
  choice: Тадмор
  rationale: Собственное географическое название передано транслитерацией с еврейского; более позднее название «Пальмира» вынесено в примечание.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, безлюдную местность. «В пустыне» здесь естественно и географически уместно.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: все города для хранения припасов
  rationale: Сочетание указывает на города, служившие для хранения запасов. Развёрнутая формулировка яснее современному читателю, чем менее естественное «города-хранилища».
- source_word: אֲשֶׁר בָּנָה
  choice: которые построил
  rationale: Относительное придаточное прямо относится к городам; повтор глагола сохранён в соответствии с еврейским текстом.
- source_word: בַּחֲמָת
  choice: в Хамате
  rationale: Предлог ב передан как «в». Формулировка сохраняет открытым вопрос, имеется ли в виду сам город Хамат или подвластная ему область.
