base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: ru
  text: Хурам через своих слуг[a] послал ему корабли и слуг, сведущих в морском деле[b]. Эти слуги вместе со слугами Соломона прибыли в Офир, взяли оттуда четыреста пятьдесят талантов золота[c] и доставили его царю Соломону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой своих слуг»; это еврейская идиома, обозначающая действие через посредников.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «слуг, знающих море»; то есть опытных мореходов.'
    reason: lexical_alternative
  - marker: c
    text: Талант — древняя мера веса; её точная величина могла различаться.
    reason: historical_measure
lexical_decisions:
- source_word: חוּרָם
  choice: Хурам
  rationale: Передаёт еврейскую форму имени в данном стихе, не заменяя её более привычным вариантом «Хирам».
- source_word: בְּיַד עֲבָדָיו
  choice: через своих слуг
  rationale: Естественно передаёт еврейскую идиому посредничества, буквально содержащую выражение «рукой своих слуг».
- source_word: אוניות
  choice: корабли
  rationale: Контекст морского путешествия в Офир указывает на морские суда; «корабли» — ясное и стилистически уместное соответствие.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: и слуг, сведущих в морском деле
  rationale: Сохраняет прямое обозначение этих людей как слуг и естественно выражает буквальную характеристику «знающих море».
- source_word: וַיָּבֹאוּ ... אוֹפִירָה
  choice: они прибыли в Офир
  rationale: Глагол בוא выражает прибытие, а направительное окончание в названии места указывает на движение в Офир.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: взяли оттуда
  rationale: Прямо передаёт обычное повествовательное значение לקח, не уточняя не названный в тексте способ получения золота.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: четыреста пятьдесят талантов золота
  rationale: Сохраняет древнюю меру веса и историческую конкретность исходного текста без спорного пересчёта в современные единицы.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: и доставили его царю Соломону
  rationale: Местоимение «его» естественно соотносится в русском языке с собирательным существительным «золото»; множественное подлежащее глагола относится к участникам похода.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Идиома בְּיַד передана естественно, а её буквальная форма вынесена в примечание. Выражение «сведущих в морском деле» сохраняет статус людей как слуг и передаёт их морской опыт без архаичной неясности.
