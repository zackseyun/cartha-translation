source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: ru
  text: А города, которые Хурам[a] отдал Соломону, Соломон отстроил[b] и поселил там израильтян[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. Хурам; традиционно: Хирам.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «построил». Еврейский глагол может означать как строительство, так и, в данном контексте, восстановление или обустройство.'
    reason: lexical_alternative
  - marker: c
    text: Букв. «сынов Израиля».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: А города
  rationale: Союз וְ с определённым существительным продолжает повествование и вводит следующий предмет рассказа; русское «А города» естественно передаёт этот переход.
- source_word: אֲשֶׁר נָתַן חוּרָם לִשְׁלֹמֹה
  choice: которые Хурам отдал Соломону
  rationale: Относительное придаточное передаёт предшествовавшую передачу городов; в русском порядок событий понятен и без особой формы давнопрошедшего времени. «Отдал» здесь естественнее, чем нейтральное «дал», для передачи городов во владение.
- source_word: חוּרָם
  choice: Хурам
  rationale: Передана непосредственно еврейская форма имени חוּרָם; традиционная форма «Хирам» указана в примечании.
- source_word: בָּנָה
  choice: отстроил
  rationale: Основное значение — «строить», но речь идёт об уже существующих и переданных городах. «Отстроил» естественно допускает восстановление или обустройство, не утверждая непременно, что они были полностью разрушены.
- source_word: וַיּוֹשֶׁב שָׁם
  choice: и поселил там
  rationale: 'Порода hифиль глагола ישׁב имеет каузативный смысл: Соломон сделал так, чтобы люди жили там; «поселил» кратко и точно выражает его.'
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: израильтян
  rationale: Буквально «сынов Израиля», но в данном контексте выражение обозначает представителей народа Израиля в целом; «израильтян» естественно передаёт корпоративный смысл.
