  text: וְ/לֹ֣א סָרוּ֩ מִצְוַ֨ת הַ/מֶּ֜לֶךְ עַל הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם לְ/כָל דָּבָ֖ר וְ/לָ/אֹצָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: ru
  text: И ни в чём не отступали они от повеления царя о священниках и левитах, а также о сокровищницах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранилищах». Еврейское слово אֹצָרוֹת может обозначать сокровищницы или хранилища; в данном храмово-административном контексте подходит значение «сокровищницы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: не отступали
  rationale: Глагол סור означает «отступать, уклоняться, отходить». В отрицательной конструкции «не отступали» естественно передаёт соблюдение повеления и сохраняет образность еврейского выражения.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: от повеления царя
  rationale: מִצְוָה здесь обозначает конкретное царское предписание. «Повеление» соответствует административному контексту и звучит достойно, не будучи архаичным.
- source_word: עַל
  choice: о
  rationale: Предлог עַל вводит предмет царского повеления — священников и левитов, — а не указывает здесь на власть над ними.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священниках и левитах
  rationale: Сохранены две явно разграниченные группы храмовых служителей; русские формы с определённым значением естественно употреблены без артиклей.
- source_word: לְכָל דָּבָר
  choice: ни в чём
  rationale: В сочетании с отрицанием выражение означает отсутствие какого-либо уклонения во всяком деле; «ни в чём не отступали» естественно передаёт еврейскую конструкцию.
- source_word: וְלָאֹצָרוֹת
  choice: а также о сокровищницах
  rationale: Союз וְ присоединяет ещё одну сферу исполнения повеления. אֹצָרוֹת может означать сокровищницы или хранилища; храмово-административный контекст поддерживает основной вариант «сокровищницы».
