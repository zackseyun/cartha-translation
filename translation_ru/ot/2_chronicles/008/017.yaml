  text: אָז֩ הָלַ֨ךְ שְׁלֹמֹ֜ה לְ/עֶצְיֽוֹן גֶּ֧בֶר וְ/אֶל אֵיל֛וֹת עַל שְׂפַ֥ת הַ/יָּ֖ם בְּ/אֶ֥רֶץ אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: ru
  text: Тогда Соломон отправился в Эцион-Гевер и в Эйлот[a], на берегу моря, в земле Эдома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название Эйлот также передают как «Элат» или «Элаф».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временной указатель продолжает последовательность повествования; «тогда» естественно и точно передаёт эту функцию.
- source_word: הָלַךְ
  choice: отправился
  rationale: В данном контексте глагол означает движение к названным местам; «отправился» звучит естественнее, чем буквальное «пошёл», и не уточняет способ передвижения.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: в Эцион-Гевер
  rationale: Название места передано транслитерацией; дефис сохраняет составной характер топонима, а предлог «в» естественен с названием пункта назначения.
- source_word: וְאֶל אֵילוֹת
  choice: и в Эйлот
  rationale: Союз и предлог переданы явно. Форма «Эйлот» близко отражает масоретское אֵילוֹת; вариант названия отмечен в сноске.
- source_word: עַל שְׂפַת הַיָּם
  choice: на берегу моря
  rationale: Идиоматично и точно передаёт пространственное значение — у края, или берега, моря.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: в земле Эдома
  rationale: Сохраняется явно выраженное в еврейском тексте слово «земля», а имя Эдом оформлено естественным русским родительным падежом.
