base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: ru
  text: Тогда Соломон принёс Яхве всесожжения на жертвеннике Яхве, который он построил перед притвором[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «портик» или «крыльцо». Еврейское слово обозначает входную часть храма.'
    reason: Лексически допустимые варианты перевода архитектурного термина הָאוּלָם.
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной повествовательный маркер и естественно связывает действие с предшествующими событиями.
- source_word: הֶעֱלָה
  choice: принёс
  rationale: В сочетании с названием жертвы каузативная форма глагола עלה обозначает принесение жертвы; по-русски «принёс всесожжения» звучит естественно и сохраняет культовый смысл.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Устоявшаяся русская форма имени.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Устоявшийся и точный русский термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому посвящены жертвы; русское управление глагола «принести» позволяет передать это без отдельного предлога. Имя יהוה передано как «Яхве».
- source_word: עַל מִזְבַּח יְהוָה
  choice: на жертвеннике Яхве
  rationale: Прямо передаёт пространственное отношение и конструкцию принадлежности.
- source_word: אֲשֶׁר בָּנָה
  choice: который он построил
  rationale: Относительное придаточное относится к жертвеннику; местоимение сохраняет подразумеваемого в еврейском тексте Соломона как подлежащее.
- source_word: לִפְנֵי הָאוּלָם
  choice: перед притвором
  rationale: לִפְנֵי имеет пространственное значение «перед», а אוּלָם обозначает входное помещение или портик храма; «притвор» — точный и привычный русский архитектурный термин.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст дважды употребляет собственное имя יהוה. Форма «Яхве» непосредственно передаёт имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Термины «всесожжения», «жертвенник» и «притвор» сохраняют точность храмового контекста и остаются понятными читателю.
