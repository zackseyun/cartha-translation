  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: ru
  text: Но из сынов Израиля Соломон никого не обращал в рабов для его работы[a], потому что они были воинами, его военачальниками[b], начальниками его колесниц и всадников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отдавал в рабство для его работы»; речь идёт о назначении на подневольный труд.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает военных служащих или приближённых; возможны переводы «офицеры», «адъютанты» или «начальники».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  choice: Но из сынов Израиля
  rationale: Сочетание союза с предлогом выражает противопоставление предыдущему стиху; «сыны Израиля» сохраняет образность и этнонациональный оттенок еврейского выражения.
- source_word: לֹא נָתַן שְׁלֹמֹה לַעֲבָדִים
  choice: Соломон никого не обращал в рабов
  rationale: Конструкция означает назначение людей на положение рабов или на подневольный труд. «Никого» естественно передаёт партитивное «из сынов Израиля», не добавляя новой группы лиц.
- source_word: לִמְלַאכְתּוֹ
  choice: для своих работ
  rationale: מְלָאכָה обозначает поручаемую Соломоном работу; множественное «работ» по-русски естественно указывает на государственные строительные и иные повинности.
- source_word: כִּי הֵמָּה
  choice: потому что они были
  rationale: Передаёт причинное объяснение, вводимое כִּי, в ясной современной форме.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: воинами
  rationale: Естественный и ёмкий русский эквивалент идиомы «мужи войны» без ненужной архаизации.
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: его военачальниками
  rationale: Трудный термин שָׁלִישׁ обозначает высокопоставленных военных служащих или приближённых; широкий перевод избегает чрезмерной конкретизации, а примечание сохраняет неопределённость.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: начальниками над его колесницами
  rationale: Передаёт значение руководства колесничным корпусом и сохраняет отличие этой должности от предыдущей категории.
- source_word: וּפָרָשָׁיו
  choice: и всадниками
  rationale: פָרָשִׁים обозначает конных воинов; «всадники» — стандартный и понятный русский эквивалент.
theological_decisions:
- issue: Статус израильтян по отношению к принудительному труду
  choice: «не обращал в рабов»
  alternative: «не назначал работниками» / «не делал слугами»
  rationale: Контекст противопоставляет израильтян подневольным работникам из покорённых народов. Сильное социальное значение עֲבָדִים не следует смягчать, однако формулировка не утверждает больше, чем сказано в данном стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранено выражение «сыны Израиля», но более буквальное «мужи войны» естественно передано словом «воины». Неясность военного термина שָׁלִישׁ отмечена в сноске.
