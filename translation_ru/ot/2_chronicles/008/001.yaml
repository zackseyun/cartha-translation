  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: ru
  text: Когда минуло двадцать лет, в течение которых Соломон построил дом Яхве и свой дом[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой дворец». Буквально: «свой дом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Сохраняет повествовательный переход и незавершённость синтаксической конструкции, продолжающейся в следующем стихе, без излишне архаического оборота «и случилось».
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  choice: по прошествии двадцати лет
  rationale: Естественно передаёт достижение конца указанного периода времени.
- source_word: אֲשֶׁר בָּנָה
  choice: за которые… построил
  rationale: Передаёт временную связь относительного местоимения с двадцатилетним периодом и завершённость строительства к его концу.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт личное имя יהוה как «Яхве».
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: Возвратное притяжательное местоимение естественно указывает на Соломона; «дом» сохраняет лексику оригинала, тогда как «дворец» является контекстуальным уточнением.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале прямо употреблён тетраграмматон; личное имя сохранено, а не заменено титулом.
- issue: Значение בֵּיתוֹ применительно к Соломону
  choice: свой дом
  alternative: свой дворец
  rationale: Основной текст сохраняет буквальное и потенциально более широкое значение «дом», а вероятное контекстуальное значение «дворец» приведено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Двоеточие после «И было» помогает естественно оформить еврейский повествовательный оборот; конечная запятая сохраняет связь с продолжением предложения в следующем стихе.
