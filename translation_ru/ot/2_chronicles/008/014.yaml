revisions:
- from: 'Согласно установлению своего отца Давида[a], он назначил череды священников для их служения, а левитов — для исполнения их обязанностей: возносить хвалу и служить перед священниками, изо дня в день исполняя всё положенное[b]. Он также распределил привратников по чередам у каждых ворот, потому что так повелел Давид, человек Божий.'
  to: 'Согласно установлению Давида, своего отца[a], он назначил череды священников для их служения, а левитов — для исполнения их обязанностей: возносить хвалу и служить перед священниками, исполняя предписанное для каждого дня[b]; привратников же — по их чередам, у каждых ворот. Ибо таково было повеление Давида, человека Божьего.'
