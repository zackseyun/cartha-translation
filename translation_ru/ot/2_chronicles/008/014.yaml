  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: ru
  text: 'Согласно установлению Давида, своего отца[a], он назначил череды священников для их служения, а левитов — для исполнения их обязанностей: возносить хвалу и служить перед священниками, исполняя предписанное для каждого дня[b]; привратников же — по их чередам, у каждых ворот. Ибо таково было повеление Давида, человека Божьего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Давида, своего отца». В древнееврейском языке слово «отец» может также обозначать предка или царственного предшественника.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по делу каждого дня в его день», то есть исполняя предписанное на каждый день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: назначил
  rationale: Каузативная форма глагола עמד здесь означает поставить людей на определённое служение или закрепить за ними обязанности; «назначил» естественно передаёт административный контекст.
- source_word: כְּמִשְׁפַּט
  choice: согласно установлению
  rationale: מִשְׁפָּט обозначает установленный порядок или предписание; «установление» сохраняет официальный характер Давидова распоряжения.
- source_word: דָּוִיד אָבִיו
  choice: своего отца Давида
  rationale: Сохранено буквальное родственно-династическое выражение; в древнееврейском «отец» может также обозначать предка или царственного предшественника.
- source_word: מַחְלְקוֹת
  choice: череды
  rationale: Речь об организованных группах храмовых служителей, которые несли служение по очереди; «череды» точно и кратко передаёт этот специальный смысл.
- source_word: עַל עֲבֹדָתָם
  choice: для их служения
  rationale: Выражение указывает на закреплённую сферу храмового служения священников.
- source_word: מִשְׁמְרוֹתָם
  choice: исполнения их обязанностей
  rationale: מִשְׁמֶרֶת может означать поручение, дежурство или круг обязанностей; контекст далее раскрывает конкретные функции левитов.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: возносить хвалу и служить
  rationale: Формулировка сохраняет оба действия и культовый оттенок служения, не добавляя отсутствующего в исходном тексте прямого дополнения к «возносить хвалу».
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: перед священниками
  rationale: נֶגֶד буквально указывает на положение перед кем-либо или в чьём-либо присутствии; более конкретное «вместе со священниками» сняло бы пространственно-функциональную неоднозначность.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: изо дня в день исполняя всё положенное
  rationale: Идиома буквально говорит о «деле дня в его день» и обозначает выполнение предписанного для каждого дня.
- source_word: הַשּׁוֹעֲרִים
  choice: привратников
  rationale: Традиционное и понятное современному читателю обозначение служителей, отвечавших за храмовые ворота.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: у каждых ворот
  rationale: 'Повтор существительного выражает распределительное значение: у каждых отдельных ворот.'
- source_word: מִצְוַת
  choice: повелел
  rationale: Существительное «повеление» передано естественной русской глагольной конструкцией, сохраняющей авторитетный характер распоряжения.
theological_decisions:
- issue: Родственно-династическое обозначение Давида как отца Соломона
  choice: Сохранить «своего отца Давида»
  alternative: «своего предка Давида»
  rationale: Здесь Давид действительно является непосредственным отцом Соломона, а буквальная формулировка также сохраняет характерный для древнееврейского текста династический язык без ненужного истолкования.
- issue: Отношение служения левитов к священникам
  choice: «служить перед священниками»
  alternative: «служить вместе со священниками»
  rationale: Предлог נֶגֶד не требует значения совместности; буквальное «перед» сохраняет возможный пространственный и служебный оттенок выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Термин «череды» сохранён как точное и достаточно понятное обозначение организованных смен храмовых служителей; синтаксис упрощён для ясного чтения без устранения неоднозначности выражения נֶגֶד הַכֹּהֲנִים.
