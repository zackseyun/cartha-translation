lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит перечень или итог в историческом повествовании и передаёт указательное значение оборота.
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: начальники наместников
  rationale: Сочетание указывает на руководителей поставленных царём должностных лиц; «начальники» передаёт ранг, не придавая выражению узко военного смысла.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: царя Соломона
  rationale: Кратко и естественно выражает принадлежность или служебную связь с царём.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: двести пятьдесят человек
  rationale: Стандартная передача числа; слово «человек» по-русски естественно поясняет, что речь идёт о числе должностных лиц.
- source_word: הָרֹדִים בָּעָם
  choice: управлявших народом
  rationale: Передаёт осуществление власти в административном контексте, не усиливая значение до жестокого господства; «народом» сохраняет явное значение עָם и не сужает его до работников.
