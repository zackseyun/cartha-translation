  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: ru
  text: Так все работы Соломона были налажены[b] со дня закладки основания дома Яхве и до его завершения.[a] Дом Яхве был завершён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от дня закладки основания дома Яхве и до его окончания». Сжатая еврейская конструкция охватывает весь период строительства.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол может также означать: «были подготовлены», «были утверждены» или «были устроены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: была приведена в порядок
  rationale: 'Форма от כון имеет пассивно-результативный смысл: работа была устроена, подготовлена или приведена в надлежащее состояние. Выбранный вариант естественен по-русски и сохраняет идею упорядоченного доведения работ до готовности.'
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: вся работа Соломона
  rationale: מְלָאכָה обозначает работу, труд или предприятие; широкий русский эквивалент охватывает весь строительный замысел Соломона.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: со дня основания дома Яхве и до его завершения
  rationale: Хотя עַד обычно означает «до», вся конструкция обозначает временной промежуток от закладки основания до окончания строительства. Номинальная форма מוּסַד передана естественным русским оборотом «со дня основания».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквально «дом Яхве»; слово «дом» сохраняет образ исходного текста, а личное имя Яхве передаёт тетраграмматон.
- source_word: שָׁלֵם
  choice: был полностью завершён
  rationale: Предикативное прилагательное указывает на законченное, целостное состояние храма. Наречие «полностью» передаёт оттенок полноты, заложенный в שָׁלֵם.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В исходном тексте стоит личное имя Бога, тетраграмматон; транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Отнесение местоименного суффикса в כְּלֹתוֹ
  choice: до завершения дома Яхве
  alternative: пока Соломон не завершил свою работу
  rationale: Мужской суффикс допускает связь с ближайшим выражением «дом Яхве»; контекст строительства поддерживает эту связь, но синтаксическая сжатость исходного текста отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены буквальное «дом Яхве», итоговое повторение мысли о завершении храма и смысловая напряжённость редкой сжатой конструкции; неоднозначность כון вынесена в примечание.
