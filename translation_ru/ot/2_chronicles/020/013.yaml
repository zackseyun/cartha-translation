  text: וְ/כָ֨ל יְהוּדָ֔ה עֹמְדִ֖ים לִ/פְנֵ֣י יְהוָ֑ה גַּם טַפָּ֖/ם נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: ru
  text: И весь народ Иудеи стоял пред Яхве — даже их малые дети, жёны и сыновья.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети». Еврейское слово может обозначать именно сыновей или, шире, детей — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: И весь народ Иудеи
  rationale: Союз וְ связывает стих с предыдущим повествованием, כָל выражает полноту собрания, а собирательное יְהוּדָה здесь естественно передаётся как «народ Иудеи».
- source_word: עֹמְדִים
  choice: стоял
  rationale: Причастие описывает продолжающееся положение; русское прошедшее несовершенного вида сохраняет длительность и согласуется с собирательным «народ».
- source_word: לִ/פְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי означает нахождение перед кем-либо, в его присутствии; «пред» сохраняет торжественный библейский регистр, а יהוה передано личным именем «Яхве».
- source_word: גַּם טַפָּם
  choice: даже их малые дети
  rationale: גַּם подчёркивает включённость этой группы, а טַף обозначает малолетних, зависимых детей; «малые дети» ясно отличает их от следующего בנים.
- source_word: נְשֵׁיהֶם
  choice: жёны
  rationale: В перечне членов домохозяйств форма с притяжательным суффиксом естественно обозначает жён; русское «их» не повторено, поскольку принадлежность ясна из первого элемента списка.
- source_word: וּ/בְנֵיהֶם
  choice: и сыновья
  rationale: בנים в данном явном противопоставлении малым детям и жёнам целесообразно передать прямым значением «сыновья», не устраняя возможную более широкую референцию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это, не заменяя имя титулом.
- issue: Значение בְנֵיהֶם в перечне домочадцев
  choice: сыновья
  alternative: дети
  rationale: Прямое значение בנים — «сыновья»; поскольку טַף уже обозначает малых детей, перевод сохраняет различие категорий. Возможность более широкого значения «дети» отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. «Пред Яхве» выбрано вместо более разговорного «перед Яхве»; перечень сделан естественным по-русски без многократного повторения притяжательного местоимения.
