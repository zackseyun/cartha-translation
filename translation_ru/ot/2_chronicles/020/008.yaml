  yaml_path: translation/ot/2_chronicles/020/008.yaml
  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: ru
  text: 'И они поселились в ней[a] и построили в ней для Тебя святилище для имени Твоего[b] со словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жили в ней», «обитали в ней».'
    reason: lexical_alternative
  - marker: b
    text: «Святилище для имени Твоего» — святое место, посвящённое Божьему имени, то есть связанное с Его явленным присутствием и честью.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: поселились
  rationale: Глагол יָשַׁב здесь говорит о том, что народ обосновался в земле. «Поселились» естественно передаёт вступление во владение и проживание, не исключая более общего смысла «жили».
- source_word: בָהּ
  choice: в ней
  rationale: Местоименный суффикс женского рода относится к земле; русский язык естественно сохраняет женский род слова «земля».
- source_word: וַיִּבְנוּ
  choice: построили
  rationale: Прямой и общеупотребительный эквивалент глагола בנה.
- source_word: לְךָ
  choice: для Тебя
  rationale: 'Предлог לְ выражает предназначение и посвящение: святилище построено для Бога.'
- source_word: מִקְדָּשׁ
  choice: святилище
  rationale: Слово обозначает святое, посвящённое место. «Святилище» точнее сохраняет лексическое значение, чем более конкретное «храм».
- source_word: לְשִׁמְךָ
  choice: имени Твоему
  rationale: Формулировка сохраняет библейское представление о святилище, посвящённом Божьему имени, и не сводит выражение лишь к славе или почёту.
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Причастная форма естественно вводит по-русски содержание последующего высказывания; двоеточие показывает, что речь продолжается в следующем стихе.
theological_decisions:
- issue: Смысл выражения «святилище имени Твоему»
  choice: Святилище, посвящённое Божьему имени и связанное с Его явленным присутствием и честью
  alternative: Храм в Твою честь; святое место, носящее Твоё имя
  rationale: 'Перевод сохраняет ветхозаветное богословское напряжение: храм связан с Божьим именем и присутствием, но Бог не представлен как пространственно заключённый в нём.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Повтор «в ней» сохранён вслед за еврейским текстом; синтаксис связан со следующим стихом.
