  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: ru
  text: И на Яхазиила, сына Захарии, сына Бенаи, сына Иеиила, сына Маттании, левита из потомков Асафа, сошёл Дух Яхве посреди собрания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: И на Яхази́ила
  rationale: Союз וְ передан обычной повествовательной связкой «И». Имя транслитерировано с еврейского; постановка имени после предлога обусловлена естественным русским порядком слов в выражении «на ... сошёл Дух».
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: сына Захарии, сына Бенаи, сына Иеила, сына Маттании
  rationale: Все четыре звена родословной сохранены; повторение «сына» отражает повторение בֶּן и не сводит точную цепочку к общему указанию на происхождение.
- source_word: הַלֵּוִי
  choice: левита
  rationale: Определённая форма имеет приложительное значение и отождествляет названного человека как левита; в русском контексте отдельный определённый артикль не требуется.
- source_word: מִן בְּנֵי אָסָף
  choice: из потомков Асафа
  rationale: בְּנֵי в данном родовом обозначении естественно передаётся как «потомки»; это яснее современному читателю, чем буквальное «из сынов Асафа», и сохраняет указание на принадлежность к его роду.
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: на ... сошёл Дух Яхве
  rationale: Буквально конструкция допускает «Дух Яхве был на нём», но в данном повествовательном событии русское «сошёл» естественно выражает наступление пророческого воздействия. «Дух» написан с прописной буквы как обозначение Божьего Духа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: בְּתוֹךְ הַקָּהָל
  choice: посреди собрания
  rationale: Передано пространственное значение בְּתוֹךְ и публичная обстановка собравшейся общины; «собрание» здесь современно и достаточно широко по смыслу.
theological_decisions:
- issue: Значение выражения רוּחַ יְהוָה
  choice: Дух Яхве
  alternative: дух Яхве
  rationale: Контекст последующей пророческой речи указывает на Божье действующее присутствие, а не просто на внутренний порыв; прописная буква обозначает референт, не добавляя к тексту отдельного догматического определения.
- issue: Видовой оттенок הָיְתָה עָלָיו
  choice: сошёл ... на него
  alternative: был на нём
  rationale: Глагольная форма в последовательности событий естественно воспринимается как наступившее событие. При этом перевод не уточняет способ действия Духа и сохраняет основную образность «на нём».
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Родословная намеренно сохранена полностью; синтаксис перестроен лишь настолько, чтобы длинное предложение читалось естественно по-русски.
