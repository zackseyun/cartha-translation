revisions:
- from: 'Когда иудеи пришли на наблюдательный пункт, обращённый к пустыне, они повернулись к полчищу — и вот: на земле лежали трупы[a], и никто не спасся.'
  to: 'Когда люди Иуды пришли к наблюдательному пункту, обращённому к пустыне, и повернулись в сторону множества, то вот: на земле лежали трупы[a], и не было ни одного уцелевшего.'
  rationale: Правка устраняет неоправданную экспрессию в обозначении множества, уточняет собирательное «Иуда» как людей Иуды и ближе передаёт формулу об отсутствии уцелевшего. Образ тел, лежащих на земле, и допустимая буквальная альтернатива сохранены.
