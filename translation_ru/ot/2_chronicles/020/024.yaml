  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: ru
  text: 'Когда люди Иуды пришли к наблюдательному пункту, обращённому к пустыне, и повернулись в сторону множества, то вот: на земле лежали трупы[a], и не было ни одного уцелевшего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трупы, павшие наземь».'
    reason: Сохраняет более буквальный вариант причастного оборота נֹפְלִים אַרְצָה.
lexical_decisions:
- source_word: וִיהוּדָה
  choice: иудеи
  rationale: Название «Иуда» употреблено собирательно о людях Иудеи; русское «иудеи» естественно согласуется с последующим глаголом во множественном числе.
- source_word: בָּא עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: пришли на наблюдательный пункт, обращённый к пустыне
  rationale: מִצְפֶּה обозначает место наблюдения или дозорный пункт, а לַמִּדְבָּר указывает на его ориентацию в сторону пустыни.
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  choice: они повернулись к полчищу
  rationale: פנה передаёт поворот в сторону объекта, а הָמוֹן здесь по контексту означает многочисленное вражеское войско; «полчище» сохраняет собирательность и военный оттенок.
- source_word: וְהִנָּם
  choice: и вот
  rationale: Сохраняет дейктическую внезапность еврейского оборота и момент открывшегося взору зрелища.
- source_word: פְּגָרִים נֹפְלִים אַרְצָה
  choice: на земле лежали трупы
  rationale: Естественно по-русски передаёт результат состояния, буквально описанного как «трупы, павшие наземь».
- source_word: וְאֵין פְּלֵיטָה
  choice: и никто не спасся
  rationale: Передаёт контекстуальный смысл отсутствия уцелевшего или сумевшего спастись, не ограничивая выражение только физическим бегством.
