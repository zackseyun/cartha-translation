source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: ru
  text: 'и сказал: «Яхве, Боже наших отцов[a]! Разве не Ты — Бог на небесах? Разве не Ты правишь над всеми царствами народов? В Твоей руке — сила и могущество, и никто не может противостоять Тебе[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших предков». Буквально: «наших отцов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и нет никого, кто мог бы устоять перед Тобой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Боже наших отцов
  rationale: Сохраняет форму обращения, мужской род и традиционное заветное выражение исходного текста.
- source_word: הֲלֹא
  choice: Разве не
  rationale: Естественно передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: Ты — Бог на небесах
  rationale: Сохраняет эмфатическое местоименное построение и указание на небесную сферу.
- source_word: מוֹשֵׁל
  choice: владычествуешь
  rationale: Причастие обозначает постоянное верховное правление; глагол «владычествуешь» естественно выражает царственную власть Бога.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: царствами народов
  rationale: Буквально и ясно передаёт сочетание «царства народов», не сужая значение до отдельных политических государств.
- source_word: וּבְיָדְךָ
  choice: В Твоей руке
  rationale: Сохраняет конкретный древнееврейский образ руки как носителя действенной власти.
- source_word: כֹּחַ וּגְבוּרָה
  choice: сила и могущество
  rationale: Передаёт парное выражение способности и непреодолимой мощи с уместной для молитвы торжественностью.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: никто не может противостоять Тебе
  rationale: Передаёт контекстуальный смысл глагола — занять позицию против кого-либо и выдержать столкновение с ним.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Сохраняет повествовательную связь с предыдущим стихом; подлежащее понятно из контекста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие и наиболее вероятное произношение, не подменяя имя титулом.
- issue: Родовое выражение אֲבֹתֵינוּ
  choice: наших отцов
  alternative: наших предков
  rationale: Еврейский текст прямо употребляет существительное мужского рода во множественном числе; основной текст сохраняет эту форму, а более широкая лексическая возможность отмечена в сноске.
- issue: Объём риторического вопроса
  choice: Вопросом передано первое утверждение; следующее оформлено как утверждение
  alternative: Разве Ты не владычествуешь над всеми царствами народов?
  rationale: Частица הֲלֹא непосредственно вводит первую именную клаузу, тогда как следующая начинается союзом וְ и эмфатическим אַתָּה; пунктуация исходного текста допускает продолжение мысли, но формально вопросительная частица не повторяется. Выбранный вариант сохраняет эту синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Обращение «Боже» и глагол «владычествуешь» поддерживают торжественный регистр без архаической перегруженности. Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
