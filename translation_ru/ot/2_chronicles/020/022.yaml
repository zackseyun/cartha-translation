  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: ru
  text: И когда они начали петь и возносить хвалу, Яхве устроил засады[a] против аммонитян, моавитян и жителей горы Сеир, шедших против Иудеи[b], и они были поражены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставил засадные отряды» / «поставил людей в засаде». Еврейское причастие может обозначать как людей, находящихся в засаде, так и засаду в более общем смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «шедших к Иудее». В данном контексте речь идёт о вражеском походе, поэтому в основном тексте сказано «против Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: И когда они начали
  rationale: Передаёт временную связь и начало действия естественной современной русской конструкцией; союз ו сохранён как «и».
- source_word: בְרִנָּה וּתְהִלָּה
  choice: петь и возносить хвалу
  rationale: רִנָּה допускает значения радостного пения или возгласа; в богослужебном контексте рядом с תְּהִלָּה естественно передать его глаголом «петь», не устраняя полностью смысловой оттенок торжественного прославления.
- source_word: נָתַן יְהוָה מְאָרְבִים
  choice: Яхве устроил засады
  rationale: Идиоматически передаёт буквальное «дал/поставил находящихся в засаде», сохраняя неопределённость относительно того, были ли это засадные отряды или устроенное Богом нападение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: аммонитян, моавитян и жителей горы Сеир
  rationale: Названия народов и территории переданы понятными русскими этнонимами; «жители» раскрывает обычное метонимическое обозначение людей через «гору Сеир».
- source_word: הַבָּאִים לִיהוּדָה
  choice: шедших против Иудеи
  rationale: Предлог לִ формально может обозначать направление «к Иудее», но контекст военного вторжения поддерживает значение враждебного движения «против Иудеи».
- source_word: וַיִּנָּגֵפוּ
  choice: и они были поражены
  rationale: Сохраняет пассивную форму нифаля и не уточняет сверх текста ни степень разгрома, ни непосредственного исполнителя поражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; форма «Яхве» непосредственно обозначает тетраграмматон и не подменяет его титулом.
- issue: Характер устроенных Богом засад
  choice: не уточнять личность или природу участников засады
  alternative: засадные отряды; люди, сидевшие в засаде; сверхъестественное поражение
  rationale: Причастие מְאָרְבִים может обозначать людей в засаде, тогда как вся конструкция допускает более общее понимание устроенных Богом засад. Перевод не вводит отсутствующего в стихе объяснения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сделан плавным без архаизмов; сохранены пассивность заключительного глагола и лексическая неоднозначность слова о засадах.
