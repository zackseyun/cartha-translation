lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: Жители Иудеи собрались
  rationale: Иудея выступает как собирательное обозначение народа; множественное число еврейского глагола поддерживает передачу через «жители Иудеи». Глагол в нифале означает собрание людей вместе.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: искать помощи у Яхве
  rationale: Буквальная конструкция «искать от Яхве» оставляет искомое невыраженным. В контексте угрозы подразумеваются помощь и избавление; добавление «помощи» делает фразу естественной по-русски, а примечание сохраняет формальную неоднозначность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, обозначенное тетраграмматоном, передано принятой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: גַּם מִכָּל עָרֵי יְהוּדָה
  choice: Со всех городов Иудеи тоже
  rationale: «Тоже» передаёт добавочное значение גַּם, а «со всех городов» подчёркивает всеобщий охват территории.
- source_word: בָּאוּ
  choice: пришли люди
  rationale: Простой глагол движения передан как «пришли»; слово «люди» добавлено для естественного русского синтаксиса и явно выражает подразумеваемых жителей.
- source_word: לְבַקֵּשׁ אֶת יְהוָה
  choice: искать Яхве
  rationale: Прямое дополнение с אֶת передано буквально, чтобы сохранить отличие от первой конструкции и её более непосредственную направленность на самого Яхве.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет в основном тексте личное имя, не подменяя его титулом и не привнося конфессионально обусловленный вариант.
- issue: Следует ли одинаково передавать две конструкции с בקש
  choice: 'Сохранить различие: «искать помощи у Яхве» и «искать Яхве»'
  alternative: 'Обе фразы передать одинаково: «искать Яхве»'
  rationale: В первой части употреблено בקש с מן, причём искомое подразумевается, а во второй — בקש с אֶת и прямым дополнением. Различная передача сохраняет лексико-синтаксическое напряжение еврейского текста.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Формулировка сохраняет достоинство библейской речи, коллективный смысл названия «Иудея» и различие двух еврейских конструкций.
