  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: ru
  text: Не Ты ли, Боже наш, изгнал жителей этой земли перед лицом народа Твоего, Израиля, и отдал её навеки потомству Авраама, любившего Тебя?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Авраама, друга Твоего». Буквально: «Авраама, любившего Тебя».'
    reason: 'Лексическая альтернатива: причастие אֹהַבְךָ буквально характеризует Авраама как любящего Бога, но в данном библейском употреблении может пониматься как титул «друг Твой».'
lexical_decisions:
- source_word: הֲלֹא
  choice: Не Ты ли
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; русская конструкция «не Ты ли» естественно передаёт этот смысл.
- source_word: אֱלֹהֵינוּ
  choice: Боже наш
  rationale: Это прямое обращение в молитве; звательная форма «Боже» соответствует современному литературному и возвышенному русскому употреблению.
- source_word: הוֹרַשְׁתָּ
  choice: изгнал
  rationale: Каузативная форма от ירשׁ означает лишить прежних жителей владения, вытеснить или изгнать; «изгнал» ясно сохраняет смысл удаления жителей с земли.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: жителей этой земли
  rationale: Естественная русская передача буквального выражения «живущие на этой земле».
- source_word: מִלִּפְנֵי
  choice: перед
  rationale: Сохраняет пространственный образ удаления жителей перед наступлением или присутствием Израиля, не добавляя отсутствующего в тексте пояснения.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: народом Твоим, Израилем
  rationale: Передаёт принадлежность народа Богу и сохраняет приложение «Израиль» в естественном русском порядке.
- source_word: וַתִּתְּנָהּ
  choice: и отдал её
  rationale: Последовательное прошедшее действие внутри риторического вопроса; местоимение женского рода относится к земле.
- source_word: לְזֶרַע אַבְרָהָם
  choice: потомкам Авраама
  rationale: זֶרַע — собирательное обозначение потомства; «потомкам» понятно современному читателю и естественно в данном контексте.
- source_word: אֹהַבְךָ
  choice: любившего Тебя
  rationale: Причастие от אהב буквально обозначает того, кто любит или любил Бога. Такая передача сохраняет направление любви в еврейском тексте и не заменяет его интерпретирующим титулом «друг».
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Краткая и естественная передача неограниченно долгой продолжительности в контексте обетования.
theological_decisions:
- issue: Передача определения Авраама אֹהַבְךָ
  choice: любившего Тебя
  alternative: друга Твоего
  rationale: Еврейское причастие прямо описывает Авраама как любившего Бога. Хотя в других библейских контекстах он назван другом Бога, здесь буквальное направление отношения следует сохранить; традиционное титульное понимание отмечено в сноске.
- issue: Продолжительность дара земли לְעוֹלָם
  choice: навеки
  alternative: навсегда
  rationale: Обе передачи возможны; «навеки» уместно в молитвенном регистре и сохраняет утверждение текста о непреходящей длительности, не уточняя богословский механизм исполнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Инверсия «Боже наш» и форма «навеки» сохраняют достоинство речи без архаизации; прописные буквы в местоимениях обращения к Богу соответствуют принятой русской библейской практике.
