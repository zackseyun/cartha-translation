source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: ru
  text: Если нас постигнет бедствие — меч, суд[a], мор или голод, — мы встанем перед этим домом и перед Тобой, ибо имя Твоё — в этом доме[b]. Мы воззовём к Тебе из нашей беды, и Ты услышишь и спасёшь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «карающий меч» — если понимать еврейское сочетание חֶרֶב שְׁפוֹט как единое выражение.'
    reason: Синтаксическая неоднозначность сочетания חֶרֶב שְׁפוֹט.
  - marker: b
    text: 'Или: «имя Твоё — на этом доме», то есть этот дом носит Твоё имя.'
    reason: Лексико-богословская альтернатива для храмовой формулы.
lexical_decisions:
- source_word: רָעָה
  choice: бедствие
  rationale: В данном контексте обозначает постигшее народ несчастье, а не нравственное зло; далее перечислены его конкретные виды.
- source_word: חֶרֶב שְׁפוֹט
  choice: карающий меч
  rationale: Сочетание допускает понимание «меч суда/кары»; такая передача естественна по-русски и учитывает отсутствие союза между словами. Возможность видеть здесь два отдельных пункта списка сохранена в сноске.
- source_word: דֶבֶר
  choice: мор
  rationale: Краткое и устоявшееся библейское обозначение губительной эпидемии; соответствует высокому, но понятному регистру.
- source_word: רָעָב
  choice: голод
  rationale: Обозначает массовую нехватку пищи, а не только личное чувство голода.
- source_word: נַעַמְדָה
  choice: мы встанем
  rationale: Когортатив в условном контексте передаёт решимость народа поступить так при наступлении бедствия.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה וּלְפָנֶיךָ
  choice: перед этим домом и перед Тобой
  rationale: Сохраняет параллелизм оригинала и слово «дом», важное для храмовой образности.
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: ибо имя Твоё — в этом доме
  rationale: Близко воспроизводит еврейскую формулу, не сводя её смысл исключительно к присутствию, владению или посвящению.
- source_word: וְנִזְעַק אֵלֶיךָ מִצָּרָתֵנוּ
  choice: мы воззовём к Тебе из нашей беды
  rationale: «Воззовём» выражает настойчивое обращение за помощью, а «из нашей беды» сохраняет исходное значение предлога מִן.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: и Ты услышишь и спасёшь
  rationale: Оба глагола переданы отдельно и прямо, без уточнения способа избавления.
theological_decisions:
- issue: Значение формулы об имени Бога в доме
  choice: Сохранить в основном тексте формулу «имя Твоё — в этом доме».
  alternative: «этот дом носит Твоё имя» / «имя Твоё наречено на этот дом»
  rationale: Буквальная образность охватывает связь Божьего имени с храмом, не разрешая однозначно напряжение между присутствием, принадлежностью и посвящением.
- issue: Связь слов חֶרֶב и שְׁפוֹט
  choice: Понимать как единое сочетание «карающий меч».
  alternative: «меч, суд» как два отдельных бедствия
  rationale: В еврейском тексте между словами нет союза, поэтому единое сочетание синтаксически убедительно; древняя традиция и часть переводов, однако, различают два пункта, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Слова «дом», «мор» и «воззовём» сохраняют библейскую окраску, оставаясь понятными современному читателю.
