  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: ru
  text: Тогда левиты из потомков Каафа и потомков Корея встали, чтобы славить Яхве, Бога Израиля, очень громким голосом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «громким голосом ввысь». Здесь это древнееврейское выражение, вероятно, подчёркивает исключительную громкость хвалы.'
    reason: Сохраняет буквальный пространственный образ לְמָעְלָה и отмечает его вероятную усилительную функцию, не скрывая оттенок исходной формулировки.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: встали
  rationale: 'Форма глагола קום обозначает конкретное действие: левиты поднялись и встали для публичного прославления.'
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое русское обозначение членов колена Левия, исполнявших культовое служение.
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  choice: из потомков Каафа и потомков Корея
  rationale: Современная и ясная передача древнееврейского родового выражения «из сынов…»; традиционные русские формы имён Кааф и Корей сохранены.
- source_word: לְהַלֵּל
  choice: чтобы славить
  rationale: Инфинитив выражает цель действия. «Славить» естественно передаёт הלל и не добавляет отсутствующего в тексте прямого указания на пение.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача сопряжённой конструкции; выражение служит приложением к имени Яхве.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: очень громким голосом
  rationale: В контексте לְמָעְלָה усиливает выражение בְּקוֹל גָּדוֹל. Русская формулировка естественно передаёт исключительную громкость, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер прославления
  choice: славить
  alternative: петь хвалу
  rationale: Глагол הלל указывает на прославление, но сам по себе не требует понимать действие именно как пение; перевод не уточняет способ сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Родовые обозначения переданы словом «потомки», а не архаичным «сыны»; структура стиха и приложение «Бога Израиля» сохранены.
