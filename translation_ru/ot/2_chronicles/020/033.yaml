  revision_rationale: Исправлены число существительного «сердце», естественность русской идиомы и стилистически менее удачный выбор глагола для устранения высот. Сохранены исторический термин «высоты», направленность сердца к Богу и лексическая альтернатива, не навязывающая более узкое богословское истолкование.
