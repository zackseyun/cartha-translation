  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: ru
  text: Однако высоты не были устранены, и народ всё ещё не обратил своего сердца к Богу своих отцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: Передаёт уступительно-противительный переход от положительной оценки Иосафата к сохранявшемуся недостатку.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Сохраняет традиционный историко-религиозный термин для культовых мест, не уточняя сверх текста их устройство или правомерность.
- source_word: לֹא סָרוּ
  choice: не были упразднены
  rationale: Хотя еврейская форма буквально означает «не отошли / не исчезли», в данном контексте речь о том, что культовые высоты не устранили; пассивная русская конструкция передаёт этот смысл естественно.
- source_word: וְעוֹד
  choice: всё ещё
  rationale: Выражает продолжение неустранённого состояния.
- source_word: הָעָם
  choice: народ
  rationale: Прямое соответствие собирательному обозначению населения.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: не направил своих сердец
  rationale: Порода хифиль глагола כון с существительным «сердце» может обозначать подготовку, утверждение или сознательное направление. Выбранная формулировка сохраняет волевой смысл и связь с последующим указанием на Бога.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: к Богу своих отцов
  rationale: Предлог ל передаёт направленность сердца, а выражение «Бог своих отцов» сохраняет историко-заветную отсылку.
theological_decisions:
- issue: Характер недостатка народа
  choice: Стих соединяет незавершённость внешних культовых преобразований с отсутствием внутренней направленности народа к Богу своих отцов.
  alternative: Народ лишь эмоционально не подготовился к богослужению или ещё не утвердился исключительно в поклонении Богу.
  rationale: Еврейский текст говорит и о неустранённых высотах, и о состоянии сердца. Перевод не сводит вторую часть ни к эмоциям, ни к более узкой конфессиональной формуле.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Термин «высоты» сохранён как историко-культовое обозначение; синтаксис сделан понятным без устранения смысловой многозначности выражения о сердце.
