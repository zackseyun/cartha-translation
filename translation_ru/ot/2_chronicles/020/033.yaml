- from: Однако высоты не были упразднены, и народ всё ещё не направил своих сердец[a] к Богу своих отцов.
  to: Однако высоты не были устранены, и народ всё ещё не обратил своего сердца к Богу своих отцов.
  rationale: Исправлены число существительного «сердце», естественность русской идиомы и стилистически менее удачный выбор глагола для устранения высот. Сохранены исторический термин «высоты», направленность сердца к Богу и лексическая альтернатива, не навязывающая более узкое богословское истолкование.
