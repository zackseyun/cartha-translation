  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: ru
  text: 'Посоветовавшись с народом, он назначил певцов для Яхве, чтобы они прославляли великолепие святости[a], идя впереди передового отряда[b], и возглашали: «Благодарите Яхве, ибо Его верная любовь — навеки[c]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красоту святости», «священное великолепие»; возможно также: «прославляли в священном великолепии» или «в священных одеждах». Еврейское выражение допускает несколько толкований.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «впереди вооружённых воинов», «впереди передовой линии».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ибо Его милость — навеки». Еврейское חֶסֶד означает милость, неизменную любовь и верность обязательствам завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל הָעָם
  choice: Посоветовавшись с народом
  rationale: Передаёт значение нифаля от יעץ как совещание с народом и естественно выражает предшествование следующему действию.
- source_word: וַיַּעֲמֵד מְשֹׁרֲרִים
  choice: он поставил певцов
  rationale: Каузативная форма עמד допускает значения «поставить», «назначить» и «расположить»; «поставил» сохраняет и назначение, и возможный пространственный оттенок.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а предлог ל в данном контексте указывает, Кому предназначено пение.
- source_word: וּמְהַלְלִים לְהַדְרַת קֹדֶשׁ
  choice: чтобы они прославляли великолепие святости
  rationale: Естественная русская конструкция связывает причастие с певцами, а близкая к форме оригинала фраза «великолепие святости» не устраняет смысловую неоднозначность сочетания.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: Они шли впереди передового отряда
  rationale: Инфинитив с ב обозначает одновременное действие, а הֶחָלוּץ — выдвинутые вперёд вооружённые силы, не всё войско.
- source_word: הוֹדוּ לַיהוָה
  choice: Благодарите Яхве
  rationale: В богослужебном контексте форма от ידה означает благодарить или воздавать хвалу; последующая причина особенно поддерживает значение благодарения.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ибо Его верная любовь — навеки
  rationale: חֶסֶד сочетает значения любви, верности и милости; «верная любовь» сохраняет этот смысловой объём. Тире естественно передаёт безглагольную еврейскую фразу без добавления спорного глагола.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблено личное имя יהוה; транслитерация сохраняет его как заветное имя, не подменяя титулом.
- issue: Смысл חֶסֶד
  choice: верная любовь
  alternative: милость
  rationale: Выбранный вариант удерживает одновременно любовь и постоянную верность, не сводя многозначное слово только к милосердию.
- issue: Отнесение לְהַדְרַת קֹדֶשׁ
  choice: прославляли великолепие святости
  alternative: в священном великолепии / в священных одеждах
  rationale: Грамматика допускает понимание фразы как предмета хвалы либо как характеристики облика поклоняющихся. Основной текст следует ближайшей синтаксической связи, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Стих разделён на два предложения ради ясности длинной еврейской конструкции; прямая речь сохранена как возглас певцов.
