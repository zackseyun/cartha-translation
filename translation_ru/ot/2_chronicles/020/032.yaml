source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: ru
  text: Он шёл путём своего отца Асы и не уклонялся от него, делая то, что было правильным в глазах Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: шёл путём
  rationale: Сочетание глагола הלך с существительным דֶּרֶךְ метафорически описывает образ жизни и поведение. Русское «шёл путём» сохраняет образ пути и естественно звучит в контексте царской оценки.
- source_word: אָבִיו אָסָא
  choice: своего отца Асы
  rationale: Конструктивное сочетание называет Асу отцом Иосафата; такой порядок слов ясен и естественен для современного русского языка.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: и не уклонялся от него
  rationale: Глагол סור с предлогом מן означает уклонение или отступление. Перевод продолжает метафору пути; русское местоимение согласовано со словом «путь».
- source_word: לַעֲשׂוֹת
  choice: делая
  rationale: Инфинитив с ל здесь раскрывает сопровождающее поведение или результат следования избранному пути. Деепричастие естественно связывает эту мысль с предыдущей частью стиха.
- source_word: הַיָּשָׁר
  choice: то, что было правильным
  rationale: Субстантивированное יָשָׁר обозначает нравственно правильное и угодное Богу. Формулировка сохраняет значение «правильного», не подменяя его более узким толкованием.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Буквальное сохранение устойчивого еврейского образа передаёт смысл оценки с точки зрения Яхве и понятно современному русскому читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом, поскольку в еврейском тексте непосредственно стоит тетраграмматон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Форма «Яхве» передаёт личное заветное имя, присутствующее в исходном тексте, и не смешивает его с титулом אֲדֹנָי.
- issue: Характер нравственной оценки הַיָּשָׁר
  choice: то, что было правильным в глазах Яхве
  alternative: то, что было угодно Яхве
  rationale: Выбранный вариант сохраняет прямое значение יָשָׁר и образ «в глазах», не сводя фразу лишь к субъективному удовольствию или одобрению.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры пути и идиомы «в глазах». Синтаксис прост и достоин по тону; архаизмы и конфессионально маркированная лексика не используются.
