  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: ru
  text: Тогда аммонитяне и моавитяне выступили против жителей горы Сеир, чтобы предать их заклятию[a] и истребить. А покончив с жителями Сеира, они помогали друг другу уничтожать друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть обречь на полное уничтожение; буквально — «подвергнуть заклятию».
    reason: Пояснение особого значения еврейского חרם, сочетающего идею заклятия с полным уничтожением.
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... עַל
  choice: выступили против
  rationale: В военном контексте сочетание עמד с עַל обозначает враждебное выступление против кого-либо; перевод естественен по-русски и сохраняет образ решительного противостояния.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: аммонитяне и моавитяне
  rationale: Этнонимы передают собирательное значение выражения «сыны Аммона и Моав» естественным современным русским языком.
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: жители горы Сеир
  rationale: Субстантивированное причастие יֹשְׁבֵי означает жителей, а הַר שֵׂעִיר — географическое название «гора Сеир».
- source_word: לְהַחֲרִים
  choice: предать их заклятию
  rationale: Глагол חרם в породе хифиль означает посвятить заклятию, обычно с последующим полным уничтожением. Формулировка сохраняет особый культово-военный оттенок слова, а сноска поясняет его современному читателю.
- source_word: וּלְהַשְׁמִיד
  choice: и истребить
  rationale: Глагол שׁמד выражает полное уничтожение; «истребить» сохраняет суровую силу исходного текста и не дублирует буквально предшествующий термин חרם.
- source_word: וּכְכַלּוֹתָם
  choice: а покончив
  rationale: Предлог כ с инфинитивом образует временную конструкцию «когда они закончили»; деепричастная форма ясно и сжато передаёт последовательность событий.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ לְמַשְׁחִית
  choice: они стали помогать друг другу уничтожать друг друга
  rationale: 'Взаимно-распределительная конструкция буквально говорит, что каждый помогал своему ближнему в уничтожении. Повтор «друг другу» намеренно сохраняет парадоксальную взаимность: бывшие союзники содействовали взаимному истреблению.'
theological_decisions:
- issue: Передача חרם в контексте войны
  choice: предать их заклятию
  alternative: обречь их на полное уничтожение
  rationale: Выбранный вариант сохраняет не только факт уничтожения, но и культово-религиозный смысл посвящения под заклятие. Поскольку термин может быть непонятен без пояснения, его значение раскрыто в сноске без добавления конфессионального толкования.
- issue: Взаимность в заключительной части стиха
  choice: помогать друг другу уничтожать друг друга
  alternative: каждый помогал уничтожать другого
  rationale: Исходная идиома допускает формально парадоксальное звучание и описывает взаимное истребление союзников. Перевод не уточняет способ или участников сверх того, что выражено контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. «Предать заклятию» сохранено как значимый библейский термин и разъяснено в сноске; остальная формулировка рассчитана на обычного современного читателя.
