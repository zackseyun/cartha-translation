base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: ru
  text: 'Тогда пришли к Иосафату и донесли: «На тебя идёт великое множество из-за моря[a], из Арама[b]. И вот, они в Хацацон-Тамаре, то есть в Эн-Геди».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с другой стороны моря».'
    reason: lexical_alternative
  - marker: b
    text: Арам — еврейское географическое название, которое часто передают как «Сирия».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: пришли и донесли
  rationale: Последовательные повествовательные формы передают следующее событие рассказа; «донесли» естественно описывает срочное официальное сообщение царю.
- source_word: בָּא
  choice: идёт
  rationale: Форма совершенного вида в прямой речи сообщает о приближающейся угрозе; русское настоящее время естественно выражает движение, уже происходящее в момент сообщения.
- source_word: הָמוֹן רָב
  choice: огромное множество людей
  rationale: Сочетание обозначает большую массу или множество. Контекст подразумевает вражеское войско, однако перевод не сужает значение до строго организованной армии.
- source_word: עָלֶיךָ
  choice: на тебя
  rationale: В контексте враждебного наступления предлог выражает направленность против Иосафата; по-русски естественно сказать «идёт на тебя».
- source_word: מֵעֵבֶר לַיָּם
  choice: из-за моря
  rationale: Кратко и естественно передаёт пространственное значение «с той стороны моря» без уточнения, которого нет в еврейском тексте.
- source_word: מֵאֲרָם
  choice: из Арама
  rationale: Сохранено древнееврейское географическое название, а не заменено более поздним традиционным соответствием «Сирия».
- source_word: וְהִנָּם
  choice: И вот, они уже
  rationale: «И вот» сохраняет указательную выразительность и срочность сообщения; «уже» естественно передаёт подразумеваемую непосредственность их местонахождения.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: в Хацацон-Тамаре
  rationale: Название места передано транслитерацией; предлог выражает местонахождение.
- source_word: הִיא עֵין גֶּדִי
  choice: то есть в Эн-Геди
  rationale: Фраза отождествляет Хацацон-Тамар с Эн-Геди; «то есть» ясно передаёт пояснительную функцию.
