base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: ru
  text: Они пришли в Иерусалим с арфами[a], лирами и трубами, к дому Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с лютнями»; точный вид древнего инструмента, обозначенного словом נְבָלִים, неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к храму Яхве»; буквально: «к дому Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли они
  rationale: Глагол בוא с повествовательной формой продолжает последовательность событий; «пришли» естественно передаёт движение к Иерусалиму, не добавляя более узкого смысла «вошли».
- source_word: יְרוּשָׁלִַם
  choice: в Иерусалим
  rationale: Устоявшаяся русская форма названия; направление движения естественно выражено винительным падежом с предлогом «в».
- source_word: בִּנְבָלִים
  choice: с арфами
  rationale: נבל обозначает древний щипковый струнный инструмент, обычно передаваемый как «арфа»; точный вид инструмента неизвестен, поэтому неопределённость отмечена в сноске.
- source_word: וּבְכִנֹּרוֹת
  choice: лирами
  rationale: כִּנּוֹר передано как «лира», чтобы сохранить отличие от נבל и не сводить два еврейских названия инструментов к одному.
- source_word: וּבַחֲצֹצְרוֹת
  choice: и трубами
  rationale: חֲצֹצְרָה — труба, в частности церемониальный инструмент. Определение «серебряные» здесь прямо не выражено и потому не добавлено.
- source_word: אֶל בֵּית יְהוָה
  choice: к дому Яхве
  rationale: Буквально сохранён образ «дома Яхве» и направительное значение אֶל. В данном контексте речь идёт о храме, что указано как естественная смысловая альтернатива в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон. «Яхве» сохраняет личное имя и является современной научно обоснованной русской передачей, тогда как «Господь» заменяет его титулом, а «Иегова» отражает более позднюю гибридную форму.
- issue: Передача выражения בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Основной текст сохраняет буквальный образ еврейского выражения, не устраняя его метафорическую и культовую окраску; контекстуально ясная передача «храм» дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Инструменты названы различными терминами в соответствии с еврейским текстом; архаические синтаксические формы не используются. Тире перед обстоятельством направления помогает ясно показать, что шествие направилось к дому Яхве.
