  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: ru
  text: Тогда Иосафат пал лицом к земле, и вся Иудея и жители Иерусалима пали перед Яхве, чтобы поклониться Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: склонился
  rationale: Глагол קָדַד обозначает почтительное склонение или низкий поклон; «склонился» естественно передаёт жест, не добавляя прямо не указанного коленопреклонения.
- source_word: אַפַּיִם אָרְצָה
  choice: лицом до земли
  rationale: Еврейская идиома описывает глубокое склонение лицом к земле. Русское выражение «лицом до земли» сохраняет образ и сочетается с глаголом «склонился».
- source_word: וְכָל יְהוּדָה
  choice: все иудеи
  rationale: Название Иудеи метонимически обозначает её народ. «Все иудеи» ясно и естественно передаёт коллективный смысл в современном русском языке.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: жители Иерусалима
  rationale: Причастная конструкция буквально означает живущих в Иерусалиме; «жители Иерусалима» — точный и современный эквивалент.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: пали перед Яхве
  rationale: Перевод сохраняет конкретный глагол «пали» и пространственно-реляционное «перед», не подменяя действие уже истолкованной формулировкой «простёрлись ниц».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, обозначенное тетраграмматоном, передано транслитерацией «Яхве», а не заменено титулом «Господь».
- source_word: לְהִשְׁתַּחֲוֺת
  choice: чтобы поклониться
  rationale: Инфинитив породы гитпаэль выражает целенаправленный акт почитания, включающий поклон. «Чтобы поклониться» сохраняет как цель, так и телесно-культовый оттенок.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Повтор божественного имени сохранён, как в еврейском тексте, без замены местоимением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет тетраграмматон как личное имя. «Яхве» прямо сохраняет имя и наиболее вероятную научную реконструкцию произношения.
- issue: Значение לְהִשְׁתַּחֲוֺת
  choice: чтобы поклониться
  alternative: чтобы совершить поклонение; чтобы простереться ниц
  rationale: Форма допускает как акцент на телесном поклоне, так и на религиозном почитании. «Поклониться» сохраняет оба оттенка, не устраняя их напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к еврейской последовательности действий, но естественен по-русски. Архаизмы и конфессионально маркированные замены личного имени исключены.
