base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: ru
  text: Прочие деяния Иосафата — ранние и поздние — записаны в повествовании Ииуя, сына Анании,[a] которое было включено[b] в Книгу царей Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в словах Ииуя, сына Анании»; возможно также: «в записях» или «в повествовании».'
    reason: lexical_alternative
  - marker: b
    text: Еврейская фраза буквально содержит образ «было поднято на Книгу царей Израиля». Смысл конструкции не вполне ясен; вероятно, имеется в виду, что повествование Ииуя было внесено в состав этого более обширного письменного источника.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Прочие деяния Иосафата
  rationale: В царской итоговой формуле דִּבְרֵי обозначает дела и события царствования, а וְיֶתֶר — оставшуюся часть сведений. «Прочие деяния» естественно передаёт формулу по-русски.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: ранние и поздние
  rationale: Пара охватывает весь период деятельности Иосафата. Такая формулировка сохраняет буквальное противопоставление и звучит естественнее, чем «первые и последние».
- source_word: הִנָּם כְּתוּבִים
  choice: записаны
  rationale: הִנָּם придаёт указательно-эмфатический оттенок, который в современном русском достаточно выражен самой итоговой формулой; отдельное «вот» здесь звучало бы тяжеловесно. כְּתוּבִים передано прямо как «записаны».
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: в повествовании Ииуя, сына Анании
  rationale: В данном контексте דִּבְרֵי называет письменный труд Ииуя. «Повествование» не приписывает ему узкий жанр летописи и понятнее буквального «слова».
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: которое было включено в Книгу царей Израиля
  rationale: Буквальная конструкция «которое он поднял/возвёл на книгу» неясна. В контексте ссылки на источник она, вероятно, указывает на включение труда Ииуя в более обширную царскую книгу; пассивная формулировка не навязывает субъект единственного глагола.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: Книгу царей Израиля
  rationale: סֵפֶר означает книгу или письменный документ; название сохранено близко к форме еврейского текста и оформлено как заглавие источника.
