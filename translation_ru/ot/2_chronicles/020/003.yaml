base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: ru
  text: Иосафат испугался[a] и твёрдо решил искать Яхве[b]. Он объявил пост по всей Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал бояться». Еврейская глагольная форма в повествовательной последовательности может подчёркивать наступление страха.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поставил своё лицо, чтобы искать Яхве» — еврейская идиома, выражающая твёрдое, осознанное намерение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: испугался
  rationale: Глагол ירא обозначает страх; совершенный вид естественно передаёт наступление страха в последовательности повествования.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: твёрдо решил
  rationale: Буквально «направил своё лицо»; это идиома осознанной и решительной устремлённости. В современном русском буквальная калька была бы неясна.
- source_word: לִדְרוֹשׁ
  choice: обратиться к
  rationale: דרש по отношению к Богу означает искать Его, обращаться к Нему за помощью или наставлением; в данном контексте «обратиться к» звучит естественно и не сужает смысл до одного лишь вопроса.
- source_word: לַיהוָה
  choice: к Яхве
  rationale: Передаёт личное заветное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: וַיִּקְרָא צוֹם
  choice: объявил пост
  rationale: Сочетание означает публично провозгласить соблюдение поста; «объявил пост» естественно для царского распоряжения.
- source_word: עַל כָּל יְהוּדָה
  choice: по всей Иудее
  rationale: Предлог עַל здесь обозначает область распространения объявления — всю Иудею.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» непосредственно сохраняет имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер обращения Иосафата к Богу
  choice: обратиться к Яхве
  alternative: вопросить Яхве; искать Яхве
  rationale: Выбранная формулировка сохраняет широкий смысл поиска Божьей помощи и руководства, не сводя действие только к получению ответа и не добавляя конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified по тону. Еврейская идиома раскрыта в основном тексте ради естественности, а её образная форма сохранена в сноске. Короткие предложения делают последовательность действий прозрачной.
