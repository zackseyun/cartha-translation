  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: ru
  text: 'И вот как они отплачивают нам: идут, чтобы изгнать нас из Твоего владения[a], которое Ты дал нам в наследие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Твоего наследия, которое Ты дал нам унаследовать».'
    reason: 'Лексическая альтернатива: יְרֻשָּׁה может обозначать как владение, так и наследие, а каузативная форма ירשׁ — передачу во владение или наследование.'
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт усиленное указание на происходящее и естественно звучит в современной литературной русской речи.
- source_word: הֵם
  choice: они
  rationale: Самостоятельное местоимение сохранено для смыслового ударения на тех, кто так поступает.
- source_word: גֹּמְלִים עָלֵינוּ
  choice: как они отплачивают нам
  rationale: 'Передаёт значение воздаяния за прежнее действие и горькую иронию контекста: пощада оборачивается враждой.'
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: идут, чтобы изгнать нас
  rationale: Инфинитивы выражают действие и его цель; формулировка ясна и уместна для военного контекста.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: из Твоего владения
  rationale: Слово допускает значения владения и наследия; «владение» подчёркивает принадлежность земли Богу и избегает неестественного повтора.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: которое Ты дал нам в наследие
  rationale: 'Передаёт каузативное значение: Бог сделал народ обладателем земли, даровав её как наследие.'
theological_decisions:
- issue: Божья собственность и полученное Израилем наследие
  choice: из Твоего владения, которое Ты дал нам в наследие
  alternative: из Твоего наследия, которое Ты дал нам унаследовать
  rationale: Выбранная формулировка сохраняет напряжение между верховной принадлежностью земли Богу и её дарованием Израилю, не сводя оба понятия к одному русскому слову.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. «И вот» сохраняет выразительность הִנֵּה без архаичного «се».
