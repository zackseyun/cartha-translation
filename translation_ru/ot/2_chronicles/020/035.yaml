  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: ru
  text: После этого Иосафат, царь Иудеи, вступил в союз с Охозией, царём Израиля, который поступил нечестиво[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он поступил нечестиво, делая». Краткая еврейская фраза, вероятнее всего, относится к Охозии; возможно также понимание как оценки союза или совместного дела.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временной переход и последовательность событий.
- source_word: אֶתְחַבַּר
  choice: вступил в союз
  rationale: Возвратная порода глагола חבר здесь обозначает присоединение или вступление в совместное предприятие; в царском контексте выражение «вступил в союз» передаёт политический оттенок.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Иосафат, царь Иудеи
  rationale: Имя и царский титул переданы в принятой русской библейской форме и естественной аппозиции.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: с Охозией, царём Израиля
  rationale: Прямо передаёт предложное сочетание и царский титул; имя дано в принятой русской библейской форме.
- source_word: הוּא הִרְשִׁיעַ לַעֲשׂוֹת
  choice: Тот поступал нечестиво
  rationale: Самостоятельное местоимение передано словом «тот», чтобы естественно отнести характеристику к ближайшему названному лицу, Охозии. Глагол выражает нравственно предосудительное поведение; инфинитивная конструкция идиоматически свёрнута без добавления не названного в еврейском тексте объекта.
theological_decisions:
- issue: К кому относится местоимение הוּא
  choice: 'К Охозии: «Тот поступал нечестиво»'
  alternative: Отнести оценку к Иосафату, его вступлению в союз или совместному предприятию
  rationale: Ближайший грамматический предшественник — Охозия, и контекст характеризует его отрицательно. Однако краткость еврейской конструкции допускает некоторую неоднозначность, которая отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным, но неоднозначность заключительной еврейской фразы не устранена молча и отражена в сноске.
