base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: ru
  text: Иосафат встал в собрании Иуды и Иерусалима, в доме Яхве, перед новым двором.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Форма повествует о завершённом действии; «встал» естественно передаёт действие без добавочного оттенка решительного выступления.
- source_word: בִּקְהַל יְהוּדָה וִירוּשָׁלַם
  choice: среди собравшихся из Иудеи и Иерусалима
  rationale: קהל обозначает собранное сообщество. Эта формулировка естественно передаёт еврейское בְּ как нахождение внутри собрания и не создаёт неясного русского оборота «в собрании Иудеи и Иерусалима».
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохранён буквальный и понятный библейский образ «дом Яхве»; контекст указывает на храм, но слово «храм» в исходном тексте не употреблено.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменено титулом.
- source_word: לִפְנֵי
  choice: перед
  rationale: Здесь предлог естественно обозначает пространственное положение.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: новым двором
  rationale: חָצֵר обозначает двор храмового комплекса; «двор» — краткий и уместный русский эквивалент, а определение «новый» сохранено прямо.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «среди собравшихся» выбрана ради ясности и естественности; синтаксическая связь пространственных обстоятельств исходного текста сохранена.
