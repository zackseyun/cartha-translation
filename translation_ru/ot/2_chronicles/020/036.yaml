  text: וַ/יְחַבְּרֵ֣/הוּ עִמּ֔/וֹ לַ/עֲשׂ֥וֹת אֳנִיּ֖וֹת לָ/לֶ֣כֶת תַּרְשִׁ֑ישׁ וַ/יַּעֲשׂ֥וּ אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: ru
  text: Он вступил с ним в союз[a], чтобы построить корабли для плавания в Фарсис[b], и они построили корабли в Эцион-Гевере.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «объединился с ним», «стал его партнёром». Еврейский глагол означает вступление в союз или объединение для совместного дела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы отправиться в Фарсис». В контекстах мореплавания выражения с названием Фарсиса иногда понимают как указание на тип дальних торговых кораблей, однако здесь еврейская конструкция естественнее всего указывает на место назначения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: вступил с ним в союз
  rationale: Форма глагола חבר в этой конструкции обозначает установление совместных, союзнических или деловых отношений, а не простое физическое соединение.
- source_word: לַעֲשׂוֹת אֳנִיּוֹת
  choice: построить корабли
  rationale: Хотя עשה буквально имеет широкое значение «делать», применительно к кораблям естественный русский глагол — «строить»; אֳנִיּוֹת обозначает морские корабли.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: для плавания в Фарсис
  rationale: Инфинитив הלך здесь наиболее естественно указывает на движение к месту назначения. Выражение передано идиоматично по-русски с учётом того, что речь идёт о кораблях.
- source_word: וַיַּעֲשׂוּ אֳנִיּוֹת
  choice: они построили корабли
  rationale: Множественное число указывает на совместное действие обоих участников; повтор существительного сохраняет структуру и акцент еврейского текста.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: в Эцион-Гевере
  rationale: Предлог ב обозначает место строительства. Географическое название передано транслитерацией, близкой к еврейскому звучанию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Построить корабли» выбрано вместо буквального, но неестественного «сделать корабли». Имена переданы в форме «Фарсис» и близкой к еврейскому звучанию форме «Эцион-Гевер».
