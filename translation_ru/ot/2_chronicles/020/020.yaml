  rationale: Предлог с инфинитивом и местоименным суффиксом образует временную конструкцию; несовершенный вид сохраняет одновременность речи Иосафата с выходом войска.
- source_word: שְׁמָעוּנִי
  choice: Слушайте меня
  rationale: Императив שמע с объектным суффиксом передаёт прямой призыв обратить внимание; это естественнее в современном русском, чем архаическое «услышьте меня».
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: Иудея и жители Иерусалима
  rationale: 'Сохранено различие исходного текста: Иудея названа собирательно, тогда как в отношении Иерусалима прямо упомянуты жители.'
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: Верьте Яхве, вашему Богу
  rationale: Hифиль אמן с предлогом ב выражает веру и доверие. «Верьте» позволяет повторить тот же русский глагол во второй части увещания.
- source_word: וְתֵאָמֵנוּ
  choice: и устоите
  rationale: Nифаль אמן выражает твёрдость, устойчивость и надёжное положение. «Устоите» естественно по-русски передаёт обещанный результат, хотя еврейскую игру однокоренных слов требуется пояснить в сноске.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: верьте Его пророкам
  rationale: Повтор «верьте» сохраняет риторическую анафору исходного текста; дательный падеж естественно передаёт объект доверия в русском языке.
- source_word: וְהַצְלִיחוּ
  choice: и добьётесь успеха
  rationale: Hифиль צלח здесь означает иметь успех или преуспеть. Выбранный оборот понятен современному читателю и не сводит смысл к материальному процветанию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В исходном тексте стоит личное Божье имя, а не титул. Транслитерация сохраняет это различие; сноска сообщает читателю о традиционной замене.
- issue: Смысл אמן в увещании и результате
  choice: верьте … устоите
  alternative: доверьтесь … будете тверды
  rationale: Выбранный вариант сохраняет призыв к вере и одновременно передаёт заложенный в результирующей форме образ устойчивости, не превращая выражение в позднейшую богословскую формулу.
- issue: Отношение к пророкам
  choice: верьте Его пророкам
  alternative: доверяйте Его пророкам
  rationale: Повтор того же глагола отражает риторику еврейского текста. Формулировка относится к признанию переданного ими Божьего слова и не приписывает пророкам независимый источник власти.
translation_notes:
  register: Современный литературный русский язык с достоинством публичного царского обращения. Синтаксический параллелизм двух призывов сохранён; архаизмы и конфессионально маркированные формулы избегаются. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
