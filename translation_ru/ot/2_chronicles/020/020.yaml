  choice: в пустыню Фекои
  rationale: מִדְבָּר здесь означает малонаселённую пустынную местность или степь, а не обязательно песчаную пустыню. Традиционное «пустыня Фекои» кратко и географически уместно.
- source_word: וּבְצֵאתָם
