base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: ru
  text: 'Они встали рано утром и вышли в пустыню Фекои. Когда они отправлялись, Иосафат встал и сказал: «Слушайте меня, народ Иудеи и жители Иерусалима! Верьте в Яхве[a], вашего Бога, — и устоите[b]; верьте его пророкам[c] — и добьётесь успеха».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского имени יהוה; традиционно его заменяют словом «ГОСПОДЬ».
    reason: alternative_reading
  - marker: b
    text: 'Или: «доверьтесь Яхве, вашему Богу, — и будете твёрды». В еврейском тексте «верьте» и «устоите» — формы одного корня אמן, создающие игру слов.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «доверяйте его пророкам». В еврейском тексте повторён тот же глагол, что и в призыве верить в Бога.'
    reason: lexical_alternative
