  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֡ן בָּ֣אוּ בְנֵי מוֹאָב֩ וּ/בְנֵ֨י עַמּ֜וֹן וְ/עִמָּ/הֶ֧ם מֵֽ/הָ/עַמּוֹנִ֛ים עַל יְהוֹשָׁפָ֖ט לַ/מִּלְחָמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: ru
  text: После этого моавитяне и аммонитяне, а с ними некоторые из меунитян[a], пошли войной на Иосафата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «некоторые из аммонитян». Судя по контексту и древним переводам, многие понимают это как указание на меунитян или на сходную союзную группу, а не как повторное упоминание аммонитян.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временной переход в повествовании, не воспроизводя буквально вводную формулу «и было».
- source_word: בְנֵי מוֹאָב
  choice: моавитяне
  rationale: Обычное русское этническое обозначение естественнее буквального «сыны Моава».
- source_word: בְנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Передаёт этноним современным и понятным русским эквивалентом.
- source_word: וְעִמָּהֶם
  choice: а с ними
  rationale: Сохраняет значение сопровождающей союзной группы; союз «а» помогает ясно отделить её от двух уже названных народов.
- source_word: מֵהָעַמּוֹנִים
  choice: некоторые из меунитян[a]
  rationale: Контекст и древние переводы дают основание видеть здесь название другой союзной группы, вероятно меунитян; чтение масоретского текста отмечено в сноске.
- source_word: בָּאוּ ... עַל יְהוֹשָׁפָט לַמִּלְחָמָה
  choice: пошли войной на Иосафата
  rationale: Естественная русская формулировка, совместно передающая враждебное движение и цель — войну, без излишнего уточнения характера военных действий.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение сдержанное и повествовательное. Имена народов переданы привычными этнонимами, а военная конструкция — естественным выражением «пошли войной на».
