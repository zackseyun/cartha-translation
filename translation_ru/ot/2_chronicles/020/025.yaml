  text: וַ/יָּבֹ֨א יְהוֹשָׁפָ֣ט וְ/עַמּ/וֹ֮ לָ/בֹ֣ז אֶת שְׁלָלָ/ם֒ וַ/יִּמְצְאוּ֩ בָ/הֶ֨ם לָ/רֹ֜ב וּ/רְכ֤וּשׁ וּ/פְגָרִים֙ וּ/כְלֵ֣י חֲמֻד֔וֹת וַ/יְנַצְּל֥וּ לָ/הֶ֖ם לְ/אֵ֣ין מַשָּׂ֑א וַ/יִּֽהְי֞וּ יָמִ֧ים שְׁלוֹשָׁ֛ה בֹּזְזִ֥ים אֶת הַ/שָּׁלָ֖ל כִּ֥י רַב הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: ru
  text: Иосафат и его народ пришли забирать добычу и нашли среди них множество имущества, трупов[a] и драгоценных вещей. Они набрали себе столько, что не могли унести. Три дня они собирали добычу — так много её было.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В масоретском еврейском тексте — «трупов». Некоторые древние свидетели текста и переводы отражают чтение вроде «одежд» либо опускают это слово, что делает перечень более гладким.
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת־שְׁלָלָם
  choice: забирать добычу
  rationale: Инфинитив выражает цель прихода, а сочетание сохраняет военный контекст, не придавая русскому тексту излишне резкой разговорной окраски слова «грабить».
- source_word: בָהֶם
  choice: среди них
  rationale: Местоимение естественно относится к павшим вражеским силам; формулировка допускает нахождение предметов как среди тел, так и при них.
- source_word: לָרֹב וּרְכוּשׁ
  choice: множество имущества
  rationale: רְכוּשׁ обозначает движимое имущество или пожитки, а לָרֹב подчёркивает его большое количество.
- source_word: פְגָרִים
  choice: трупов
  rationale: Масоретский текст прямо содержит обычное слово со значением «трупы, мёртвые тела»; это чтение сохранено в основном тексте, несмотря на трудность перечня.
- source_word: כְלֵי חֲמֻדוֹת
  choice: драгоценных вещей
  rationale: Выражение широко обозначает ценные, желанные предметы и не требует ограничивать значение сосудами.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: они набрали себе
  rationale: Порода пиэль передаёт изъятие или снятие добычи, а дательный оборот указывает, что её брали себе. Русская формулировка естественна и согласуется с последующим указанием на объём.
- source_word: לְאֵין מַשָּׂא
  choice: столько, что не могли унести
  rationale: 'Идиоматически передаёт буквальное «до невозможности нести»: добычи оказалось больше, чем они могли унести.'
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: Три дня они собирали добычу
  rationale: Передаёт длительное действие в течение трёх дней и звучит естественно в современном литературном русском.
- source_word: כִּי רַב הוּא
  choice: так много её было
  rationale: Сохраняет причинное объяснение продолжительности сбора и согласует местоимение с русским словом «добыча».
