base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: ru
  text: 'Вам не придётся сражаться в этой битве. Займите свои места, стойте и увидьте спасение, которое Яхве совершит, Иуда и Иерусалим: Он с вами. Не бойтесь и не падайте духом. Завтра выступите навстречу им, и Яхве с вами[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «и Яхве будет с вами». В еврейской фразе нет выраженного глагола, поэтому это уверение можно понимать как относящееся к настоящему или к предстоящему событию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: Вам не придётся сражаться в этой битве
  rationale: Еврейская конструкция буквально означает «не вам сражаться в этой», а в контексте сообщает, что жителям Иудеи не потребуется вступать в бой. Русская формулировка передаёт этот смысл естественно и без лишнего усиления.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: Займите свои места, стойте
  rationale: Первый императив призывает занять твёрдую позицию, второй — оставаться на месте. Последовательность двух повелений сохранена.
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה עִמָּכֶם
  choice: смотрите, как Яхве, Который с вами, спасёт вас
  rationale: Именная еврейская конструкция «увидьте спасение Яхве с вами» в буквальном русском виде неестественна. Глагольная передача ясно выражает совершаемое Яхве избавление и связывает עִמָּכֶם с Его присутствием, не меняя участников действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: Иуда и Иерусалим
  rationale: Названия сохранены как прямое обращение к народу Иудеи и жителям Иерусалима; в современном русском отдельная частица звательного обращения не требуется.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Не бойтесь и не падайте духом
  rationale: Первый запрет относится к страху, второй — к состоянию подавленности и утрате мужества. Формулировка естественна для современного литературного русского.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: Завтра выступите навстречу им
  rationale: В военном контексте לִפְנֵיהֶם означает выйти перед противником, чтобы встретить его. «Навстречу им» передаёт пространственный и контекстуальный смысл без утверждения, что иудеям велено атаковать.
- source_word: וַיהוָה עִמָּכֶם
  choice: и Яхве с вами
  rationale: Безглагольная еврейская фраза сохранена столь же лаконичной русской именной конструкцией, допускающей уверение как в нынешнем, так и в предстоящем присутствии Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение יְשׁוּעַת יְהוָה
  choice: Яхве… спасёт вас
  alternative: избавление Яхве; победа Яхве
  rationale: В непосредственном контексте речь идёт о спасении от вражеского войска, однако глагол «спасёт» сохраняет более широкий смысл корня ישׁע и не сужает его до одной лишь военной победы.
- issue: Временная отнесённость וַיהוָה עִמָּכֶם
  choice: Яхве с вами
  alternative: Яхве будет с вами
  rationale: В еврейской фразе нет выраженного глагола. Безглагольная русская конструкция сохраняет напряжение между утверждением нынешнего присутствия и обещанием присутствия в завтрашнем противостоянии.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Военные повеления переданы кратко и энергично; архаические формы обращения и конфессионально маркированная замена Божьего имени не используются.
