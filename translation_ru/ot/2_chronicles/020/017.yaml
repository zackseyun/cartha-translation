- from: Вам не придётся сражаться в этой битве. Займите свои места, стойте и смотрите, как Яхве, Который с вами, спасёт вас[a], Иуда и Иерусалим! Не бойтесь и не падайте духом. Завтра выступите навстречу им, и Яхве с вами[b].
  to: 'Вам не придётся сражаться в этой битве. Займите свои места, стойте и увидьте спасение, которое Яхве совершит, Иуда и Иерусалим: Он с вами. Не бойтесь и не падайте духом. Завтра выступите навстречу им, и Яхве с вами[b].'
  rationale: Заменена глагольная конкретизация «спасёт вас» на «спасение, которое Яхве совершит», чтобы сохранить исходное существительное «спасение» и не вводить прямое дополнение, отсутствующее в еврейском тексте. «Он с вами» передаёт отдельное עִמָּכֶם и делает обращение к Иуде и Иерусалиму синтаксически ясным. Сноска a удалена, поскольку после исправления её вариант не даёт существенной альтернативы к основному чтению; сноска b сохранена у последней безглагольной фразы.
