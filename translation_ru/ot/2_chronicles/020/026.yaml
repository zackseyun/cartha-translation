source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: ru
  text: В четвёртый день они собрались в долине Бераха[a], потому что там благословили Яхве. Поэтому то место назвали долиной Бераха — так оно называется и по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бераха» означает «благословение».
    reason: Сноска раскрывает значение названия и корневую игру слов между בְּרָכָה («благословение») и בֵּרֲכוּ («благословили»).
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: они собрались
  rationale: Нифаль глагола קהל здесь имеет непереходное значение совместного собирания; «собрались» естественно и точно передаёт действие.
- source_word: עֵמֶק בְּרָכָה
  choice: долина Бераха
  rationale: עֵמֶק передано обычным русским словом «долина», а בְּרָכָה в составе географического названия транслитерировано; его значение раскрыто в сноске и поддерживает игру слов с глаголом «благословили».
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: потому что там благословили Яхве
  rationale: כִּי выражает причину наименования, а «благословили» сохраняет корневую связь ב־ר־ך с названием Бераха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: то место назвали
  rationale: Еврейская формула буквально говорит «назвали имя того места»; по-русски её смысл естественно передаётся как «то место назвали».
- source_word: עַד הַיּוֹם
  choice: так оно называется и по сей день
  rationale: Контекстуально развёрнутая передача устойчивого оборота ясно указывает на сохранение названия до времени повествователя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя; «Яхве» сохраняет это различие и соответствует современной научно принятой передаче.
translation_notes:
  register: Современный литературный русский язык; синтаксис слегка сглажен ради естественности, при этом причинная связь, формула наименования и игра слов сохранены.
