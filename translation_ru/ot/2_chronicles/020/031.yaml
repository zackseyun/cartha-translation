  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: ru
  text: Иосафат царствовал над Иудеей. Ему было тридцать пять лет, когда он воцарился, и двадцать пять лет он царствовал в Иерусалиме. Его мать звали Азува, дочь Шилхи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: Глагол מלך в повествовательной форме вводит стандартное сообщение о правлении царя; «царствовал» точно и естественно передаёт эту формулу.
- source_word: עַל יְהוּדָה
  choice: над Иудеей
  rationale: При глаголе מלך предлог עַל обозначает область или народ, которыми правят; «над Иудеей» сохраняет этот смысл.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: ему было тридцать пять лет
  rationale: Стандартная древнееврейская формула возраста передана естественной современной русской конструкцией.
- source_word: בְּמָלְכוֹ
  choice: когда он воцарился
  rationale: Предлог ב с инфинитивом и местоименным суффиксом указывает на время вступления на престол; «воцарился» ясно выражает начало правления.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: и двадцать пять лет он царствовал
  rationale: Сохранены длительность правления и формульный глагол מלך в естественном русском порядке слов.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная современная русская передача древнееврейской именной формулы без изменения смысла.
- source_word: עֲזוּבָה
  choice: Азува
  rationale: Имя передано русской библейской транслитерацией с отражением еврейского עֲזוּבָה.
- source_word: בַּת שִׁלְחִי
  choice: дочь Шилхи
  rationale: Слово בַּת прямо обозначает родство; имя שִׁלְחִי передано транслитерацией «Шилхи».
