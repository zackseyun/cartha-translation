base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: ru
  text: И царство Иосафата пребывало в мире[a], и его Бог даровал ему покой со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царство Иосафата было спокойно».'
    reason: 'Лексическая альтернатива: שׁקט может обозначать как мир и отсутствие вражды, так и спокойствие, отсутствие потрясений.'
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: пребывало в мире
  rationale: Глагол שׁקט обозначает спокойствие, отсутствие тревог и вражеских потрясений. При подлежащем «царство» выражение «пребывало в мире» естественно передаёт смысл в современном литературном русском.
- source_word: מַלְכוּת
  choice: царство
  rationale: Существительное означает царство или владение Иосафата; «царство» — стандартный и ясный вариант в историческом контексте.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Использована традиционная русская библейская форма имени.
- source_word: וַיָּנַח
  choice: даровал ему покой
  rationale: Каузативная порода глагола נוח означает, что Бог дал Иосафату возможность жить спокойно. «Даровал ему покой» сохраняет божественное действие и соответствует достоинству повествования.
- source_word: אֱלֹהָיו
  choice: Бог его
  rationale: Форма буквально означает «его Бог». Постпозиция местоимения естественна для возвышенного, но понятного русского библейского повествования.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Выражение указывает на безопасность от окружающих угроз во всех направлениях; русский оборот «со всех сторон» передаёт пространственную полноту.
- source_word: וַ
  choice: и
  rationale: Сохранена еврейская сочинительная связь между предложениями без внесения явно причинного союза; причинная связь может подразумеваться контекстом.
theological_decisions:
- issue: Божественное действие как источник мира и безопасности
  choice: Сохранено прямое утверждение, что Бог даровал Иосафату покой со всех сторон.
  alternative: 'Передать вторую связь причинно: «потому что Бог его даровал ему покой».'
  rationale: Еврейский текст соединяет две части союзом וַ־, не маркируя причинность явно. Координация сохраняет как божественную инициативу, так и допустимую смысловую неоднозначность связи между частями.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формулировка остаётся ясной для обычного читателя; союз «и» сохраняет структуру и неоднозначность древнееврейского текста.
