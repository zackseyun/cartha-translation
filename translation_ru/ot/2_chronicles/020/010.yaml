base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: ru
  text: 'А теперь — вот аммонитяне, моавитяне и жители горы Сеир[a], против которых Ты не позволил Израилю выступить[b], когда он шёл из земли Египетской: Израиль уклонился от них и не истребил их, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Аммона, Моава и горы Сеир».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которым Ты не дал Израилю войти в них». В контексте речь идёт о том, что Бог не позволил Израилю выступить против них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: А теперь — вот
  rationale: Сохраняет связь с предшествующей молитвой и указательно-эмфатическую силу הִנֵּה; тире делает сочетание естественным в современном русском.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: сыновья Аммона, Моав и гора Сеир
  rationale: Сохраняет необычную грамматическую координацию еврейского текста и его переход от этнического обозначения к названиям территории/народа, не сводя всё безоговорочно к этнонимам.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: в земли которых Ты не позволил Израилю вступить
  rationale: Передаёт идиому נתן + инфинитив как позволение, а בָהֶם — пространственно и без более сильного толкования «напасть» или «вторгнуться»; добавленное «земли» делает фразу понятной по-русски.
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: когда он шёл из земли Египетской
  rationale: Местоимение «он» согласовано с собирательным «Израиль»; несовершенный вид естественно передаёт движение во время исхода.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: Израиль уклонился от них
  rationale: Явное повторение субъекта устраняет возможную русскую двусмысленность, не меняя референта; «уклонился» передаёт изменение маршрута и отказ от столкновения.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: и не истребил их
  rationale: «Истребил» передаёт сильное военное значение Hiphil глагола שׁמד точнее, чем более общее «уничтожил».
theological_decisions:
- issue: Прямое обращение к Богу во втором лице
  choice: Ты не позволил
  alternative: Господь не позволил
  rationale: Стих является частью непосредственной молитвы; второе лицо исходного текста сохранено без добавления отсутствующего здесь божественного имени.
- issue: Характер запрещённого Израилю действия
  choice: в земли которых Ты не позволил Израилю вступить
  alternative: на которых Ты не позволил Израилю напасть
  rationale: Контекст подразумевает военное продвижение, однако сама конструкция буквально говорит о вступлении/вхождении. Основной текст сохраняет эту широту, а примечание поясняет контекст.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Прописное «Ты» соответствует традиционному русскому оформлению прямого обращения к Богу, не добавляя богословского содержания. Финальное тире сохраняет незавершённость синтаксиса, поскольку мысль продолжается в следующем стихе.
