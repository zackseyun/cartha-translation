base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: ru
  text: Тогда все мужчины Иудеи и Иерусалима, во главе с Иосафатом, повернули назад, чтобы с радостью вернуться в Иерусалим, потому что Яхве обрадовал их из-за их врагов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: отправились обратно
  rationale: Две формы корня שׁוב описывают возвращение и его направленность. В русском буквальное повторение «возвратились, чтобы возвратиться» звучит неестественно, поэтому смысл передан одним естественным оборотом.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלַם
  choice: все жители Иудеи и Иерусалима
  rationale: Буквально «каждый мужчина Иудеи и Иерусалима»; это дистрибутивное выражение с собирательным значением. В данном контексте «жители» естественно обозначает выступившую группу, не превращая единичную форму אִישׁ в неуклюжую русскую конструкцию.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: во главе с Иосафатом
  rationale: Естественный русский оборот, точно сохраняющий образ руководителя, стоящего во главе группы.
- source_word: בְּשִׂמְחָה
  choice: с радостью
  rationale: Прямой и естественный эквивалент существительного שִׂמְחָה.
- source_word: שִׂמְּחָם יְהוָה מֵאוֹיְבֵיהֶם
  choice: Яхве дал им радость победы над врагами
  rationale: 'Порода piel глагола שׂמח имеет каузативный смысл: Яхве сделал их радостными. Предлог מן допускает связь радости с врагами как поводом или объектом торжества; контекст поддерживает смысл победы над ними.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Связь радости с врагами в מֵאוֹיְבֵיהֶם
  choice: радость победы над врагами
  alternative: обрадовал их из-за их врагов
  rationale: Конструкция допускает некоторую смысловую широту, однако ближайший контекст чудесного поражения неприятелей указывает на радость от одержанной над ними победы.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль с умеренной торжественностью. Синтаксическое повторение корня שׁוב сглажено ради естественности, без утраты смысла возвращения.
