  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: ru
  text: Боже наш, не Ты ли осудишь их? Ведь у нас нет сил против этого многочисленного множества, идущего на нас. Мы не знаем, что делать, но наши глаза обращены к Тебе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо к Тебе — наши глаза».'
    reason: Сноска сохраняет более формальную передачу כִּי и еврейского порядка слов, позволяя увидеть как причинную связь, так и образ устремлённого к Богу взгляда.
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: Боже наш
  rationale: Форма звательного обращения естественна для русской молитвенной речи и точно передаёт обращение к «нашему Богу».
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: не Ты ли осудишь их?
  rationale: Сохранены риторический вопрос и судебное значение глагола שׁפט; перевод не сужает смысл до одного лишь наказания.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание мольбы; «ведь» естественно связывает вопрос с признанием бессилия.
- source_word: אֵין בָּנוּ כֹּחַ
  choice: у нас нет сил
  rationale: Идиоматичный современный русский оборот, передающий отсутствие силы и способности противостоять угрозе.
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: против этого огромного полчища
  rationale: В военном контексте «полчище» естественно обозначает огромную массу вражеских людей, не требуя добавления отсутствующего в тексте глагола «устоять».
- source_word: הַבָּא עָלֵינוּ
  choice: идущего на нас
  rationale: Передаёт причастную форму, приближающуюся угрозу и враждебную направленность действия.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: Мы не знаем, что делать
  rationale: Прямой, краткий и естественный перевод признания полной беспомощности.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: но наши глаза обращены к Тебе
  rationale: Сохранён образ глаз, направленных к Богу в ожидании помощи; «но» передаёт смысловой контраст с незнанием, а формальное значение כִּי отмечено в сноске.
theological_decisions:
- issue: Связь заключительной фразы כִּי עָלֶיךָ עֵינֵינוּ с предшествующим признанием незнания
  choice: 'Передать смысловой контраст: «но наши глаза обращены к Тебе»'
  alternative: «ибо к Тебе — наши глаза» / «потому что наши глаза обращены к Тебе»
  rationale: כִּי обычно вводит основание, однако здесь заключительная фраза образует кульминационный переход от человеческого бессилия к упованию на Бога. Основной текст передаёт этот контраст естественно по-русски, а формальная связь сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Синтаксис краток и понятен; сохранены судебный образ, признание военного бессилия и метафора устремлённых к Богу глаз. Прописные формы «Ты/Тебе» поддерживают традиционный русский молитвенный регистр без архаизации.
