source:
  edition: WLC
  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: ru
  text: И страх Божий объял все царства тех земель, когда они услышали, что Яхве сражался с врагами Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ужас от Бога». Еврейское выражение может обозначать страх, связанный с присутствием или действием Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: объял
  rationale: Форма вводит наступившее вследствие описанных событий состояние. «Объял» естественно передаёт распространение страха на царства, сохраняя повествовательную силу выражения.
- source_word: פַּחַד אֱלֹהִים
  choice: страх Божий
  rationale: 'Конструкция буквально допускает связь страха с Богом без однозначного уточнения: это может быть страх перед Богом либо ужас, вызванный Его действием. Основной текст сохраняет эту смысловую ёмкость, а примечание указывает альтернативу.'
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: все царства тех земель
  rationale: Множественное число הָאֲרָצוֹת обозначает земли или страны; указательное «тех» помогает по-русски естественно отнести выражение к окружающим землям, не расширяя его до всего мира.
- source_word: בְּשָׁמְעָם כִּי
  choice: когда они услышали, что
  rationale: Сочетание предлога с инфинитивом выражает время, а כִּי после глагола слухового восприятия вводит содержание услышанного.
- source_word: נִלְחַם
  choice: сражался
  rationale: Глагол обозначает участие в сражении. Русское прошедшее время естественно выражает уже совершившееся действие, о котором стало известно царствам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяется титулом.
- source_word: עִם אוֹיְבֵי יִשְׂרָאֵל
  choice: с врагами Израиля
  rationale: При глаголе «сражаться» עִם указывает противоборствующую сторону; русская конструкция «сражаться с» ясно передаёт этот смысл.
theological_decisions:
- issue: Смысл выражения פַּחַד אֱלֹהִים
  choice: страх Божий
  alternative: ужас от Бога
  rationale: 'Основной вариант сохраняет формальную и богословскую неоднозначность еврейской конструкции: страх связан с явным действием Бога, но грамматика не требует выбирать только между страхом перед Ним и ужасом, посланным Им.'
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: В тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет образ наступившего страха и не превращает окружающие земли во «всю землю».
