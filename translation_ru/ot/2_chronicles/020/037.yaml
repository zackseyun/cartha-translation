base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: ru
  text: 'Тогда Елиезер, сын Додаваху, из Мареши, пророчествовал против Иосафата: «За то, что ты объединился с Охозией, Яхве разрушил твоё предприятие[a]». И корабли разбились и не смогли отправиться[b] в Таршиш.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрушил твои дела». Здесь имеются в виду предпринятые Иосафатом строительство и отправка кораблей.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «не могли отправиться» или «им не удалось отправиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: пророчествовал
  rationale: Форма хитпаэль глагола נבא обозначает пророческую речь; «пророчествовал» прямо и естественно передаёт это значение.
- source_word: עַל
  choice: против
  rationale: В контексте обличительного пророчества предлог указывает на направленность обвинительного слова против Иосафата, а не просто на речь о нём.
- source_word: מִמָּרֵשָׁה
  choice: из Мареши
  rationale: Предлог מִן указывает на происхождение Елиезера из города Мареша.
- source_word: כְּהִתְחַבֶּרְךָ
  choice: за то, что ты объединился с
  rationale: Хитпаэль от חבר выражает присоединение к другому человеку или объединение с ним. Формулировка сохраняет возвратный оттенок и не делает формальный договор более явным, чем в еврейском тексте.
- source_word: פָּרַץ
  choice: разрушил
  rationale: Хотя основное значение корня связано с прорывом или проломом, при прямом дополнении «твои дела» здесь речь идёт о разрушении и срыве предпринятого дела.
- source_word: מַעֲשֶׂיךָ
  choice: твоё предприятие
  rationale: Буквально множественное число означает «твои дела», но в данном контексте указывает на конкретное предприятие Иосафата — строительство и отправку кораблей. Выбор делает референт понятным, а буквальная форма отмечена в сноске.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: и корабли разбились
  rationale: Форма нифаль указывает, что корабли были разрушены; русское «разбились» естественно описывает кораблекрушение, сохраняя связь с глаголом «ломать, разбивать».
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: и не смогли отправиться
  rationale: В этой конструкции עצר передаёт невозможность продолжить или совершить путь. Перевод сохраняет практический результат крушения, не уточняя сверх текста, были ли корабли лишены возможности или удержаны от плавания.
- source_word: תַּרְשִׁישׁ
  choice: Таршиш
  rationale: Географическое название передано транслитерацией, близкой к еврейской форме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Характер связи Иосафата с Охозией
  choice: объединился с
  alternative: вступил в союз с
  rationale: Контекст подразумевает совместное предприятие и, возможно, союз, однако глагол חבר сам по себе шире формального политического договора. Выбранная формулировка сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохранён близким к еврейскому повествованию; имена переданы единообразно, а неоднозначность глагола חבר и конструкции с עצר не сведена к излишне узкому толкованию.
