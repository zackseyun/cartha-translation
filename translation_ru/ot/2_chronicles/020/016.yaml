base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: ru
  text: Завтра спуститесь против них. Вот, они поднимаются по подъёму Циц, и вы встретите их у конца ущелья[a], перед пустыней Иеруэл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долины», «сухого русла» либо «потока». Еврейское נחל может обозначать долину, ущелье или сезонный водоток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: Завтра
  rationale: Прямо передаёт временное наречие, не добавляя отсутствующего в еврейском уточнения «утром».
- source_word: רְדוּ עֲלֵיהֶם
  choice: спуститесь против них
  rationale: Сохраняет направительное значение императива ירד и в военном контексте передаёт враждебное значение על.
- source_word: הִנָּם
  choice: Вот
  rationale: Естественная для современного литературного русского указательная частица, привлекающая внимание к последующему сообщению.
- source_word: עֹלִים
  choice: они поднимаются
  rationale: Причастие описывает происходящее или предстоящее движение вверх; русский глагол настоящего времени сохраняет эту аспектуальную открытость.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: по подъёму Циц
  rationale: Передаёт топографический смысл מַעֲלֶה как пути, ведущего вверх; ציץ понимается как географическое название и транслитерируется.
- source_word: וּמְצָאתֶם אֹתָם
  choice: и вы встретите их
  rationale: В данном военном и маршрутном контексте «встретите» звучит естественнее буквального «найдёте», сохраняя смысл обнаружения противника в указанном месте.
- source_word: בְּסוֹף הַנַּחַל
  choice: у конца ущелья
  rationale: סוֹף обозначает конец или крайнюю точку, а נחל здесь вероятнее всего обозначает сухое русло в долине или ущелье; «ущелье» естественно в топографическом описании, а неоднозначность отмечена в сноске.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: перед пустыней Иеруэл
  rationale: Пространственное פני передано как «перед», а מִדְבָּר — как «пустыня» в значении безлюдной засушливой местности; название транслитерировано.
