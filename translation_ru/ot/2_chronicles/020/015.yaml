  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: ru
  text: 'И он сказал: «Слушайте, все иудеи, жители Иерусалима и царь Иосафат! Так говорит вам Яхве: „Не бойтесь и не падайте духом перед этим великим множеством, потому что не ваша эта битва, а Божья“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе призывает внимательно выслушать; «слушайте» естественно и точно передаёт этот призыв.
- source_word: כָל יְהוּדָה
  choice: все иудеи
  rationale: Коллективное обозначение Иудеи в прямом обращении естественно передаётся как обращение ко всему народу, а не к территории.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жители Иерусалима
  rationale: Причастная конструкция обозначает людей, живущих в Иерусалиме; современный и ясный русский эквивалент — «жители».
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: и царь Иосафат
  rationale: Сохраняется отдельное прямое обращение к царю наряду с народом.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит вам Яхве
  rationale: Сохранена торжественная пророческая формула в естественном русском порядке слов и прямо передано לָכֶם — «вам».
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Не бойтесь и не падайте духом
  rationale: Два самостоятельных запрета сохранены и соединены союзом «и»; חתת здесь означает быть сломленным страхом, лишиться мужества.
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: перед этим великим множеством
  rationale: «Перед» сохраняет образное значение מִפְּנֵי и подходит к военному контексту; «великое множество» не уточняет характер войска сверх сказанного в оригинале.
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: потому что не ваша эта битва, а Божья
  rationale: Предикативная конструкция принадлежности передана кратким противопоставлением; второе כִּי по контексту имеет контрастную силу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: В тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Принадлежность битвы Богу
  choice: не ваша эта битва, а Божья
  alternative: эта битва не вам принадлежит, а Богу
  rationale: Краткая притяжательная формулировка сохраняет непосредственное противопоставление לָכֶם и לֵאלֹהִים, не расширяя утверждение за пределы данного конфликта.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис прямого обращения и два отдельных запрета сохранены; архаизмы и конфессионально маркированные обороты не использованы.
