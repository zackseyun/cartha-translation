  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: ru
  text: Вслед за ним вошёл священник Азария, а с ним — восемьдесят доблестных священников Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильных людей»; также возможно: «мужей доблести». Еврейское выражение может обозначать людей, отличающихся силой, мужеством или доблестью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: вслед за ним вошёл
  rationale: בוא допускает значения «приходить», «идти», «входить»; контекст описывает вход Азарии следом за царём. Оборот «вслед за ним» естественно передаёт אַחֲרָיו.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: священник Азария
  rationale: Определённое обозначение служения передано обычным русским сочетанием с традиционной формой имени.
- source_word: וְעִמּוֹ
  choice: а с ним
  rationale: Союз передан как «а» для естественного присоединения сопровождающей группы; подразумеваемая связка в русском не требуется.
- source_word: כֹּהֲנִים לַיהוָה
  choice: священников Яхве
  rationale: 'Предлог ל обозначает принадлежность или служение: это священники, служащие Яхве.'
- source_word: שְׁמוֹנִים
  choice: восемьдесят
  rationale: Прямая передача количественного числительного.
- source_word: בְּנֵי חָיִל
  choice: людей отважных
  rationale: Идиома характеризует священников как людей силы, мужества или доблести. В данном контексте их решительного противостояния царю «людей отважных» передаёт основной смысл, не сводя выражение к физической силе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон; форма «Яхве» передаёт личное имя и не заменяет его титулом.
- issue: Смысл выражения בְּנֵי חָיִל
  choice: людей отважных
  alternative: сильных людей; доблестных мужей; способных людей
  rationale: Контекст поддерживает оттенок мужества, но диапазон значения חַיִל включает силу и доблесть; поэтому альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Постпозиция «людей отважных» сохраняет характеристику отдельным приложением и не перегружает предложение.
