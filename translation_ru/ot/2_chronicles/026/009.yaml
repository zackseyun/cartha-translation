  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: ru
  text: Озия построил башни в Иерусалиме у Угловых ворот, у ворот Долины и у угла[a] и укрепил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у поворота». Еврейское слово может обозначать угол, изгиб или место поворота укрепления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Обычное значение глагола בנה; естественно передаёт возведение башен.
- source_word: עֻזִּיָּהוּ
  choice: Озия
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: מִגְדָּלִים
  choice: башни
  rationale: Точно передаёт существительное во множественном числе без добавления отсутствующего определения «укреплённые».
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямое и естественное выражение места.
- source_word: עַל
  choice: у
  rationale: В перечислении городских ворот и участка стены предлог обозначает расположение башен; «у» естественно по-русски и не утверждает, что башни стояли буквально поверх ворот.
- source_word: שַׁעַר הַפִּנָּה
  choice: Угловые ворота
  rationale: Название городских ворот, образованное от слова «угол»; форма соответствует русской традиции передачи топонимических названий.
- source_word: שַׁעַר הַגַּיְא
  choice: ворота Долины
  rationale: Сохраняет конструкцию названия и значение גיא — «долина».
- source_word: הַמִּקְצוֹעַ
  choice: поворот стены
  rationale: Слово обозначает угол, изгиб или место поворота сооружения. Уточнение «стены» естественно выражает фортификационный контекст и отличает этот участок от уже названных Угловых ворот.
- source_word: וַיְחַזְּקֵם
  choice: и укрепил их
  rationale: В фортификационном контексте интенсивная форма חזק означает укрепление; местоименное окончание мужского рода множественного числа естественнее всего относится к башням.
