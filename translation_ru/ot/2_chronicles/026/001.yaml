  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֻזִּיָּ֔הוּ וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣יכוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: ru
  text: И весь народ Иудеи взял[a] Озию — ему было шестнадцать лет — и поставил его царём вместо его отца Амасии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избрал». Буквально: «взял»; здесь речь идёт о возведении Озии на престол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взял
  rationale: Буквальное значение לקח — «брать, взять». Форма единственного числа по-русски согласуется с собирательным существительным «народ». В данном контексте слово описывает действие народа при возведении Озии на престол, не уточняя самой процедуры.
- source_word: כָּל עַם יְהוּדָה
  choice: весь народ Иудеи
  rationale: Передаёт все элементы еврейского выражения и сохраняет акцент на народе как совокупности жителей Иудеи.
- source_word: עֻזִּיָּהוּ
  choice: Озия
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; это имя, стоящее в данном еврейском тексте, а не встречающийся в параллельных местах вариант Азария.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: ему было шестнадцать лет
  rationale: Естественная русская передача буквального оборота «он был сыном шестнадцати лет». Тире сохраняют присоединительный характер фразы, не приписывая союзу неявно выраженное уступительное значение «хотя».
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: поставил его царём
  rationale: Каузативная форма глагола מלך означает «сделать царём, поставить царём». Такой перевод ясен и не добавляет прямо не упомянутого обряда коронации.
- source_word: תַּחַת אָבִיו אֲמַצְיָהוּ
  choice: вместо его отца Амасии
  rationale: В контексте престолонаследия תַּחַת обозначает занятие места предшественника. Имена и родственная связь переданы прямо.
