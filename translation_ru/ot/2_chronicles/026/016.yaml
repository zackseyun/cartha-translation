source:
  edition: WLC
  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: ru
  text: Но когда он укрепился, сердце его возгордилось — к его погибели. Он нарушил верность против Яхве, своего Бога, и вошёл в храм Яхве, чтобы воскурить благовония на жертвеннике благовоний.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: Но когда он укрепился
  rationale: 'כְּ при существительном «его сила» имеет здесь временное значение: «когда он стал силён». «Укрепился» естественно продолжает повествование и сохраняет связь между достигнутой силой и последующей гордыней.'
- source_word: גָּבַהּ לִבּוֹ
  choice: сердце его вознеслось
  rationale: Сохранён образный древнееврейский оборот «его сердце стало высоким». В русском библейском регистре он понятен как указание на гордость, но не сводит образ к прямому толкованию «возгордился».
- source_word: עַד לְהַשְׁחִית
  choice: на погибель ему
  rationale: Оборот выражает губительный результат вознесения сердца. Формулировка сохраняет возможный смысл саморазрушения и звучит естественнее буквального «до погубления».
- source_word: וַיִּמְעַל
  choice: Он проявил неверность
  rationale: מעל обозначает вероломное нарушение верности, особенно по отношению к Богу и святыне. «Проявил неверность» передаёт этот смысл без архаичного или узко юридического оттенка.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: Яхве, своему Богу
  rationale: Предлог ב при מעל указывает на того, против кого направлено нарушение верности; по-русски это отношение естественно выражено конструкцией «проявил неверность кому». Имя יהוה передано как «Яхве».
- source_word: הֵיכַל יְהוָה
  choice: храм Яхве
  rationale: הֵיכָל в данном повествовательном и культовом контексте обозначает храмовое здание; «храм» — точный и общепонятный русский эквивалент.
- source_word: לְהַקְטִיר
  choice: чтобы воскурить благовония
  rationale: В культовом контексте каузативная форма קטר означает сжигать или приносить курение. «Воскурить благовония» ясно передаёт ритуальное действие и сохраняет возвышенный, но современно понятный регистр.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: жертвеннике для воскурений
  rationale: Выражение обозначает специально предназначенный для курения жертвенник. Такая формулировка точна и избегает тяжеловесного повтора «благовония на жертвеннике благовоний».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер проступка Озии в וַיִּמְעַל
  choice: нарушение верности Богу
  alternative: безличное «согрешил» или юридическое «совершил преступление»
  rationale: Глагол מעל подчёркивает вероломство и нарушение обязательства перед Богом; перевод сохраняет этот заветный и культовый оттенок, не добавляя конкретной конфессиональной интерпретации.
- issue: Смысл עַד לְהַשְׁחִית
  choice: 'губительный результат гордости: «на погибель ему»'
  alternative: «пока не развратился» / «до того, что поступил пагубно»
  rationale: Форма допускает оттенок разрушения или порчи. В ближайшем контексте естественно понимать её как указание на гибельные последствия вознесения сердца, однако перевод не уточняет, была ли это окончательная гибель, наказание или нравственное разложение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Образ «сердце его вознеслось» сохранён ради близости к древнееврейскому тексту; архаизмы сведены к понятному культовому слову «воскурить».
