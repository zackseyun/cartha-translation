  - severity: low
    issue: «Жертвенник для воскурений» менее идиоматичен и менее близок к наименованию алтаря.
    rationale: מִזְבַּח הַקְּטֹרֶת — устойчиво «жертвенник благовоний»; это не просто жертвенник, используемый для некоторого действия, а его культовое название.
