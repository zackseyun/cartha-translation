base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: ru
  text: И повернулся к нему главный священник Азария вместе со всеми священниками — и вот, на лбу у него была проказа.[a] Они поспешно вывели его оттуда,[b] и он сам поспешил выйти,[c] потому что Яхве поразил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, традиционно переводимое как «проказа», обозначает серьёзное кожное поражение, рассматриваемое в законах о ритуальной нечистоте; оно не обязательно соответствует современной болезни Хансена.
    reason: cultural_note
  - marker: b
    text: 'Или: «Они выгнали его оттуда». Еврейский глагол выражает срочное удаление и может подразумевать более решительное понуждение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «он был вынужден выйти». Еврейская форма может подчёркивать, что его вытесняли или побуждали наружу, хотя в контексте вероятен смысл, что он и сам поспешил уйти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: И повернулся к нему
  rationale: Глагол פנה с אֶל естественно передаёт физический поворот к человеку. Единственное число согласуется с ближайшим подлежащим — Азарией; остальные священники присоединены далее.
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: главный священник Азария
  rationale: כֹהֵן הָרֹאשׁ буквально означает «главный/стоящий во главе священник». Такой перевод сохраняет формулировку текста и не подменяет её более техническим титулом «первосвященник».
- source_word: וְכָל הַכֹּהֲנִים
  choice: вместе со всеми священниками
  rationale: По смыслу остальные священники участвуют в повороте и последующем обнаружении поражения. «Вместе со» естественно выражает их присоединение по-русски.
- source_word: וְהִנֵּה
  choice: — и вот
  rationale: הִנֵּה вводит внезапно обнаружившееся обстоятельство; «и вот» сохраняет живость повествования.
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: на лбу у него была проказа
  rationale: Русская именная конструкция звучит естественно и передаёт видимое поражение на лбу. Термин пояснён с учётом его древнего ритуально-правового употребления.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: Они поспешно вывели его оттуда
  rationale: Каузативная форма בהל выражает срочное удаление или понуждение к поспешному движению. Формулировка передаёт активное действие священников, не усиливая его до однозначного физического изгнания.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: да и он сам поспешил выйти
  rationale: וְגַם הוּא подчёркивает участие самого Озии. Нифаль נִדְחַף допускает оттенок понуждения или устремлённости; основной текст даёт естественный контекстуальный смысл, а более буквальная пассивная возможность отмечена в сноске.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: потому что Яхве поразил его
  rationale: В данном карательном контексте נגע означает нанесение поражения, а не нейтральное прикосновение. «Поразил» точно и идиоматично передаёт смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, а не заменяет её титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» передаёт тетраграмматон и не заменяет его титулом.
- issue: Статус כֹהֵן הָרֹאשׁ
  choice: главный священник
  alternative: первосвященник; глава священников
  rationale: Исходное выражение буквально обозначает священника, стоящего во главе. Перевод избегает внесения более узкого технического титула, которого эта формулировка сама по себе не требует.
- issue: Характер кожного поражения מְצֹרָע
  choice: проказа с поясняющей сноской
  alternative: тяжёлая кожная болезнь; ритуально нечистое кожное поражение
  rationale: Традиционный термин сохраняет связь с установлениями о ритуальной нечистоте, а сноска предотвращает ошибочное отождествление исключительно с современной болезнью Хансена.
- issue: Добровольность выхода Озии
  choice: он сам поспешил выйти
  alternative: его понудило выйти; он был вытолкнут наружу
  rationale: Контекст подчёркивает, что сам царь стремился удалиться после Божьего поражения, однако пассивная форма נִדְחַף допускает оттенок внешнего понуждения; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохраняет внезапность обнаружения («и вот») и двойную срочность удаления, оставаясь понятным широкому читателю. Все сноски обозначены в основном тексте.
