  text: וַ/יִּתְּנ֧וּ הָֽ/עַמּוֹנִ֛ים מִנְחָ֖ה לְ/עֻזִּיָּ֑הוּ וַ/יֵּ֤לֶךְ שְׁמ/וֹ֙ עַד לְ/ב֣וֹא מִצְרַ֔יִם כִּ֥י הֶחֱזִ֖יק עַד לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: ru
  text: Аммонитяне принесли Озии дань, и слава о нём[a] распространилась до входа в Египет[b], потому что он стал необычайно могущественным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его имя распространилось». В данном случае «имя» означает известность или славу.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «вход в Египет» может означать подступы к Египту или его пограничную область.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: аммонитяне
  rationale: Общепринятое в русском библейском употреблении обозначение народа Аммона.
- source_word: מִנְחָה
  choice: дань
  rationale: В политическом контексте дар чужеземного народа царю означает дань, а не культовое приношение или обычный подарок.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: слава о нём распространилась
  rationale: Естественно передаёт древнееврейскую идиому, буквально говорящую о том, что его «имя пошло», то есть широко распространилась его известность.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: до входа в Египет
  rationale: Сохраняет образ исходного текста и не сводит неоднозначное выражение без пояснения к самому Египту или строго определённой границе.
- source_word: הֶחֱזִיק
  choice: стал могущественным
  rationale: В данной причинной фразе форма глагола חזק указывает на обретение или проявление большой силы.
- source_word: עַד לְמַעְלָה
  choice: необычайно
  rationale: Идиоматический усилитель, обозначающий чрезвычайно высокую степень могущества.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; образ «входа в Египет» сохранён, а его неоднозначность пояснена в сноске.
