lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: помог ему
  rationale: Форма глагола עזר с местоименным суффиксом прямо означает «помог ему». Совершенный вид естественно передаёт последовательное повествовательное действие.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В данном повествовательном контексте слово обозначает Бога Израиля; артикль не требует отдельной передачи по-русски.
- source_word: עַל
  choice: в борьбе с
  rationale: При глаголе «помог» и перечислении враждебных народов предлог выражает направленность помощи против противников. Оборот «в борьбе с» ясен и естественен по-русски.
- source_word: פְּלִשְׁתִּים
  choice: филистимлянами
  rationale: Общепринятое русское название этого народа; творительный падеж обусловлен оборотом «в борьбе с».
- source_word: הערביים
  choice: аравитянами
  rationale: Традиционное русское библейско-историческое обозначение жителей Аравии, позволяющее избежать прямого отождествления с современными этнополитическими категориями.
- source_word: הַיֹּשְׁבִים
  choice: жившими
  rationale: Причастие ישב обозначает постоянное или обычное проживание; форма «жившими» естественно согласуется с «аравитянами».
- source_word: בְּגוּר בָּעַל
  choice: в Гур-Баале
  rationale: Название места передано транслитерацией, а предлог ב — естественным русским «в».
- source_word: הַמְּעוּנִים
  choice: меунянами
  rationale: Транслитерация сохраняет согласный состав этнонима מעונים и не утверждает спорное отождествление этой группы.
