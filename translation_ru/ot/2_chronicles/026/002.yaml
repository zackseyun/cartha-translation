    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: построил
  rationale: Обычное значение глагола — «строить». Возможное восстановление ранее существовавшего города подразумевается контекстом, но не выражено самим глаголом.
- source_word: אֵילוֹת
  choice: Эйлат
  rationale: Передача библейского топонима в форме, понятной современному русскому читателю; грамматически название оформлено как мужской род, что естественно для русского названия города.
- source_word: וַיְשִׁיבֶהָ
  choice: вернул его
  rationale: 'Порода hифиль глагола שוב выражает причинное значение: царь возвратил город под власть Иудеи. Местоимение согласовано в русском с топонимом «Эйлат».'
- source_word: לִיהוּדָה
  choice: Иудее
  rationale: Предлог ל обозначает цель или получателя возвращения; русский дательный падеж естественно передаёт это направление.
- source_word: אַחֲרֵי שְׁכַב
  choice: после того, как … почил
  rationale: Сохранён эвфемистический характер царской некрологической формулы, при этом «почил» яснее современному русскому читателю, чем буквальное «уснул».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранено нарицательное обозначение исходного текста; имя Амасии не подставляется из контекста.
- source_word: עִם אֲבֹתָיו
  choice: со своими отцами
  rationale: Близко передана устойчивая древнееврейская формула смерти и приобщения к предкам без её замены толкованием.
