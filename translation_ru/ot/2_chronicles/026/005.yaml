base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: ru
  text: Он продолжал искать Бога во дни Захарии[a], сведущего в Божьих видениях; и пока он искал Яхве[b], Бог даровал ему успех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставлявшего в страхе Божьем». Еврейское выражение трудно для понимания; масоретский текст более буквально: «сведущего в Божьих видениях».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и во дни, когда он искал Яхве».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: Он постоянно искал Бога
  rationale: Перифрастическая конструкция היה с инфинитивом обозначает продолжительное состояние или устойчивую практику; «постоянно искал» естественно передаёт это по-русски и сохраняет религиозный смысл обращения к Богу и упования на Него.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: во дни Захарии
  rationale: Темпоральное выражение передано близко к еврейской форме; оборот понятен и соответствует возвышенному повествовательному регистру.
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  choice: понимавшего видения Божьи
  rationale: Причастие בין передаёт понимание или проницательность, а масоретская огласовка רְאֹת связывает трудное выражение с видением. Формулировка сохраняет буквальный образ, не превращая Захарию без достаточных оснований в наставника.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: и пока он искал Яхве
  rationale: «Пока» естественно выражает продолжительность периода и контекстуальную связь между поиском Яхве и успехом, не делая причинно-условный оттенок более жёстким, чем в еврейском тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: Бог даровал ему успех
  rationale: Каузативная форма צלח указывает, что успех был дан Богом; русская формулировка естественна, ясна и сохраняет божественную причинность.
theological_decisions:
- issue: Значение трудного выражения בִּרְאֹת הָאֱלֹהִים
  choice: Захария понимал Божьи видения
  alternative: Захария наставлял в страхе Божьем / был сведущ в страхе Божьем
  rationale: Масоретская огласовка поддерживает значение, связанное с видением, тогда как чтение «страх» предполагает иную текстовую интерпретацию. Основной текст следует сохранившемуся еврейскому свидетельству, а распространённый вариант отмечен в сноске.
- issue: Связь между поиском Яхве и успехом Озии
  choice: пока он искал Яхве, Бог даровал ему успех
  alternative: во дни, когда он искал Яхве, Бог даровал ему успех
  rationale: «Пока» передаёт длительную временную соотнесённость и возможный условный оттенок, но не превращает стих в отвлечённую формулу гарантированного материального благополучия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Во дни» сохраняет торжественный повествовательный тон, тогда как синтаксис остальной фразы остаётся доступным современному читателю.
