base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: ru
  text: Тогда Озия разгневался. В руке у него была кадильница, чтобы воскурить благовоние. И пока он гневался на священников, у него на лбу внезапно выступила проказа[a] — на глазах у священников, в доме Яхве, у кадильного жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тяжёлая кожная болезнь». Еврейское слово צָרַעַת обозначает различные серьёзные или ритуально оскверняющие поражения кожи и не обязательно соответствует современной болезни Хансена.'
    reason: 'Лексическая альтернатива: объём значения древнееврейского термина шире традиционного русского слова «проказа».'
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: разгневался
  rationale: Передаёт начало состояния гнева, выраженное повествовательной формой глагола, естественно и без неоправданного усиления.
- source_word: עֻזִּיָּהוּ
  choice: Озия
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: מִקְטֶרֶת
  choice: кадильница
  rationale: Обозначает сосуд, предназначенный для ритуального воскурения благовоний.
- source_word: לְהַקְטִיר
  choice: чтобы воскурить благовоние
  rationale: Инфинитив выражает цель; глагол «воскурить» сохраняет культовый контекст и понятен современному читателю.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: и пока он гневался на священников
  rationale: 'Передаёт обстоятельственно-временную связь: поражение проявилось в то время, когда Озия гневался на священников.'
- source_word: הַצָּרַעַת
  choice: проказа
  rationale: Сохраняет традиционное и контекстуально весомое обозначение ритуально оскверняющего поражения кожи; сноска предупреждает, что древнееврейский термин шире современного медицинского диагноза.
- source_word: זָרְחָה
  choice: внезапно выступила
  rationale: Буквально глагол значит «воссияла, появилась», а здесь образно описывает резкое видимое проявление болезни на лбу.
- source_word: בְמִצְחוֹ
  choice: у него на лбу
  rationale: Естественно передаёт место видимого поражения.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: на глазах у священников
  rationale: Ясно передаёт, что событие произошло в присутствии священников и было ими непосредственно замечено.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет еврейское выражение «дом Яхве», относящееся к храму, и передаёт тетраграмматон личным именем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: у кадильного жертвенника
  rationale: Передаёт несколько сжатое пространственное указание как нахождение возле жертвенника, на котором воскуряли благовония.
theological_decisions:
- issue: Значение צָרַעַת
  choice: проказа со сноской
  alternative: тяжёлая кожная болезнь; оскверняющее поражение кожи
  rationale: «Проказа» сохраняет узнаваемый библейский термин и серьёзность суда в повествовании, тогда как сноска не позволяет ошибочно отождествить его исключительно с современной болезнью Хансена.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; форма «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Характер появления поражения
  choice: внезапно выступила
  alternative: появилась; воссияла
  rationale: Выбор сохраняет образ резкого видимого проявления, не превращая образный глагол זרח в буквальное свечение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной храмовой лексикой. Короткие предложения облегчают чтение; «дом Яхве» сохраняет образ исходного текста, а «кадильный жертвенник» естественно обозначает культовый предмет. Маркер сноски поставлен непосредственно после слова, которое он поясняет.
