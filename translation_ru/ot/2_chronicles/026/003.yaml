base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: ru
  text: Озии было шестнадцать лет, когда он стал царём[a], и он царствовал в Иерусалиме пятьдесят два года. Его мать звали Иехолия[b]; она была из Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда он начал царствовать» или «при его воцарении».'
    reason: lexical_alternative
  - marker: b
    text: Имя Иехолия можно также передать как «Иехилия».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Озии было шестнадцать лет
  rationale: Еврейская идиома возраста естественно передаётся по-русски конструкцией «было шестнадцать лет».
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Оборот обозначает время вступления на царство; выбран естественный современный русский эквивалент, а более буквальная формулировка дана в примечании.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти в течение указанного периода; «царствовал» соответствует русской библейской исторической лексике и остаётся понятным.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: пятьдесят два года
  rationale: Нормальная современная русская передача еврейского составного числительного.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямая передача обстоятельства места.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная русская передача именной формулы «имя его матери» без изменения смысла.
- source_word: יכיליה
  choice: Иехолия
  rationale: Транслитерация имени, отражающая согласные еврейской формы; вариант чтения «Иехилия» отмечен в примечании из-за особенностей написания и традиции передачи.
- source_word: מִן יְרוּשָׁלִָם
  choice: она была из Иерусалима
  rationale: Предлог מִן указывает на происхождение; добавление местоимения и связки делает отнесение определения к матери ясным и естественным по-русски.
