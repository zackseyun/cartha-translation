  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: ru
  text: Прочие деяния Озии[a], от первых до последних, записал пророк Исаия, сын Амоса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прочие слова Озии, первые и последние». В еврейской летописной формуле «слова» означают события и деяния его царствования.'
    reason: Сноска исправлена, чтобы включить значение וְיֶתֶר («прочие») и точно отражать еврейское выражение целиком.
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Прочие
  rationale: יֶתֶר обозначает оставшуюся часть. В русской формуле подведения итогов царствования «прочие» звучит естественно и передаёт смысл «остальные»; начальный союз не требует отдельного громоздкого соответствия.
- source_word: דִּבְרֵי
  choice: деяния
  rationale: Буквально существительное означает «слова», но в летописной формуле о царе оно охватывает события и поступки его царствования. «Деяния» точно передаёт этот историографический смысл.
- source_word: עֻזִּיָּהוּ
  choice: Озии
  rationale: Использована укоренившаяся русская форма имени עֻזִּיָּהוּ в требуемом родительном падеже.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: от первых до последних
  rationale: Парное выражение буквально говорит о «первых и последних» и охватывает весь временной промежуток; русская конструкция сохраняет эту протяжённость и звучит естественно.
- source_word: כָּתַב
  choice: записал
  rationale: Глагол означает «писал/написал». В контексте исторической фиксации «записал» передаёт письменное действие, не добавляя идеи устного сообщения.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: пророк Исаия, сын Амоса
  rationale: Сохранены традиционные русские формы имён, патроним и определённый титул пророка; порядок слов сделан естественным для современного русского языка.
theological_decisions:
- issue: Значение דִּבְרֵי в царской летописной формуле
  choice: деяния
  alternative: слова; сведения; события
  rationale: Здесь речь идёт не только о высказываниях царя, а о письменном изложении его царствования. Сноска сохраняет для читателя буквальный образ еврейского выражения.
- issue: Объём выражения הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: от первых до последних
  alternative: первые и последние; прежние и последующие
  rationale: Выбранный вариант естественно обозначает весь ход царствования, при этом не уточняет содержания записанного и не снимает присущую формуле обобщённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского исторического повествования. Формулировка краткая и доступная; традиционные русские формы имён сохранены. Инверсия с глаголом перед подлежащим удерживает акцент исходного предложения, не делая синтаксис неестественным.
