lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: глав родов
  rationale: Устойчиво и естественно передаёт руководителей родовых объединений; буквальное «глав отцов» в современном русском было бы неясно.
- source_word: לְגִבּוֹרֵי חָיִל
  choice: возглавлявших доблестных воинов
  rationale: Предлог לְ выражает связь глав родов с воинами; в данном контексте естественнее всего передать её как руководство, не превращая самих глав родов в «доблестных воинов».
- source_word: גִבּוֹרֵי חָיִל
  choice: доблестных воинов
  rationale: Передаёт военное значение сочетания и его оттенок силы, мужества и боевой состоятельности.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: две тысячи шестьсот
  rationale: Прямое и естественное воспроизведение числительного.
