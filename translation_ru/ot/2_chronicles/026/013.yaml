lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Под их началом
  rationale: Идиома עַל יָדָם в данном военно-административном контексте указывает на подчинение и руководство, а не на буквальное действие «их рукой».
- source_word: חֵיל צָבָא
  choice: войско
  rationale: Сочетание обозначает военную силу, то есть войско; единое русское существительное естественно передаёт смысл без буквального дублирования.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 307 500 человек
  rationale: Число точно соответствует сумме еврейских числительных; слово «человек» ясно показывает, что речь идёт о численности войска.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: готовых сражаться
  rationale: Буквально «делающие войну»; в контексте военного учёта оборот характеризует воинов как способных и готовых к бою, не обязательно уже участвующих в сражении.
- source_word: בְּכֹחַ חָיִל
  choice: с великой силой
  rationale: Передаёт усиленное указание на силу и военную доблесть, сохраняя естественное современное русское выражение.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: помогать царю
  rationale: Прямо и естественно передаёт обычное значение глагола עזר — «помогать».
- source_word: עַל הָאוֹיֵב
  choice: против врага
  rationale: В военном контексте предлог עַל указывает на противостояние врагу.
