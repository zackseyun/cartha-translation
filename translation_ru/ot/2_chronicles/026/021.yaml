  to: Царь Озия был прокажённым до дня своей смерти. Он жил в отдельном доме[a], будучи прокажённым, потому что был отсечён от дома Яхве[b]. Его сын Иофам управлял царским домом и судил народ страны.
  rationale: 'Исправлена формулировка исключения Озии, чтобы точнее передать образ отсечения в еврейском тексте без намёка на формальную церковную процедуру. Уточнена передача царского дома и сглажен порядок слов при сохранении повторного упоминания о его состоянии. Сноски привязаны к соответствующим трудным выражениям: [a] — к «отдельному дому», [b] — к «отсечён от дома Яхве».'
  reviewer_model: gpt-5.6-terra
