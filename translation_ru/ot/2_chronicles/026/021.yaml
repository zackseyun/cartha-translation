  source_fidelity: 'Основной смысл передан верно: Озия остаётся поражённым צרעת до смерти, живёт обособленно вследствие исключения из дома Яхве; Иофам осуществляет надзор над царским домом и судит народ страны. Однако «отлучён» в современном русском обычно вызывает представление о формальной церковной санкции и потому излишне конкретизирует נִגְזַר («отсечён/отделён»).'
  naturalness: Фраза «Он жил прокажённым в отдельном доме» понятна, но порядок слов несколько тяжеловесен. «Жил в отдельном доме, будучи прокажённым» звучит естественнее и сохраняет повтор эпитета из еврейского текста. «Управлял царским домом» точнее и шире, чем «ведал царским дворцом», поскольку בֵּית הַמֶּלֶךְ может означать не только здание дворца, но и царское хозяйство/дом.
