source:
  edition: WLC
  text: וַ/יְהִי֩ עֻזִּיָּ֨הוּ הַ/מֶּ֜לֶךְ מְצֹרָ֣ע עַד י֣וֹם מוֹת֗/וֹ וַ/יֵּ֜שֶׁב בֵּ֤ית ה/חפשות מְצֹרָ֔ע כִּ֥י נִגְזַ֖ר מִ/בֵּ֣ית יְהוָ֑ה וְ/יוֹתָ֤ם בְּנ/וֹ֙ עַל בֵּ֣ית הַ/מֶּ֔לֶךְ שׁוֹפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: ru
  text: Царь Озия был прокажённым до дня своей смерти. Он жил в отдельном доме[a], будучи прокажённым, потому что был отсечён от дома Яхве[b]. Его сын Иофам управлял царским домом и судил народ страны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «в доме свободы». Вероятно, имеется в виду отдельное жилище, где Озия жил изолированно из-за своего состояния.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «был отделён от дома Яхве»; то есть был лишён доступа к храму.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְצֹרָע
  choice: прокажённым
  rationale: Традиционный и узнаваемый эквивалент для человека, поражённого цараат; он не отождествляет библейское заболевание с точным современным диагнозом. Повтор слова сохранён вслед за еврейским текстом.
- source_word: בֵּית הַחפשות
  choice: в отдельном доме
  rationale: Трудное выражение, буквально допускающее понимание «дом свободы», по контексту обозначает обособленное жилище Озии. Перевод передаёт вероятный практический смысл, а буквальная возможность отмечена в сноске.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: был отлучён от дома Яхве
  rationale: Форма от גזר выражает отсечение или отделение. «Отлучён» естественно передаёт вынужденное исключение Озии из доступа к святилищу, не уточняя сверх текста, кем именно было наложено это ограничение.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранён образ «дома», хотя по контексту речь идёт о храме; это поддерживает словесную связь с оригиналом.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: ведал царским дворцом
  rationale: Идиома указывает на руководство царским домом или дворцовым хозяйством. Формулировка естественна по-русски и не превращает эту обязанность в более конкретную должность, не названную в тексте.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: судил народ страны
  rationale: «Судил» сохраняет основной смысл שׁפט и одновременно допускает более широкую функцию управления, свойственную судье-правителю.
- source_word: עַם הָאָרֶץ
  choice: народ страны
  rationale: Прямой перевод не сужает выражение до «простонародья» и не навязывает ему специального социально-политического значения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יהוה; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Характер исключения Озии из дома Яхве
  choice: был отлучён
  alternative: был отсечён
  rationale: Перевод сохраняет серьёзность принудительного отделения, но не уточняет сверх текста ни действующее лицо, ни формальный механизм отлучения.
- issue: Отождествление צרעת с современной лепрой
  choice: прокажённым
  alternative: поражённым кожной болезнью
  rationale: Традиционное слово сохраняет библейскую и культовую окраску, не утверждая, что состояние Озии точно соответствовало современной болезни Хансена.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Избегаются архаизмы «пребывал» и «обитал», но сохранены повтор «прокажённым» и юридико-управленческое «судил», чтобы не сглаживать структуру и смысл еврейского текста.
