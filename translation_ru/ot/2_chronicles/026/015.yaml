source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: ru
  text: В Иерусалиме он сделал устройства[a], изобретённые искусным мастером, чтобы они находились на башнях и на углах стен, для стрельбы стрелами и метания больших камней. Слава о нём разнеслась далеко[b], ибо ему оказывали необычайную помощь[c], пока он не стал силён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приспособления», «машины» — военные механизмы, предназначенные для размещения на укреплениях.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его имя вышло далеко».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте не сказано прямо, кто помогал ему, хотя контекст указывает на Божью помощь.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: устройства
  rationale: Слово обозначает изобретённые приспособления или механизмы; «устройства» естественно звучит по-русски и не навязывает представления о конкретной древней технологии.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: искусно придуманные
  rationale: Сочетание однокоренных слов указывает на продуманный замысел умелого мастера; формулировка передаёт и изобретательность, и искусность без добавления не обозначенного в тексте множества мастеров.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: на башнях и на углах стен
  rationale: «Башни» передаёт מגדלים буквально, а «углы стен» делает понятным фортификационный смысл פנות, сохраняя образ углов, а не заменяя его более узким толкованием.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: метать стрелы и большие камни
  rationale: Один глагол ירה управляет обоими видами снарядов. «Метать» допускает выпуск стрел и бросание камней с помощью устройств, не уточняя их конструкцию.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: слава о нём разнеслась далеко
  rationale: Это естественная русская передача идиомы «его имя вышло далеко», обозначающей широкую известность.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: ему была оказана необычайная помощь
  rationale: Передаёт усилительный смысл פלא и пассивную конструкцию עזר, оставляя того, кто помогал, не названным, как в еврейском тексте.
- source_word: עַד כִּי חָזָק
  choice: и он стал силён
  rationale: Передаёт достигнутое состояние как результат предшествующей помощи; русский союз естественно связывает итог с причиной.
theological_decisions:
- issue: Кто оказал царю помощь
  choice: 'В основном тексте субъект помощи оставлен не названным: «ему была оказана необычайная помощь».'
  alternative: «Господь оказал ему необычайную помощь».
  rationale: Контекст указывает на Божью помощь, однако в самом предложении еврейского текста действующее лицо не названо. Пассивная конструкция сохраняет эту особенность и не делает подразумеваемое явным утверждением.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Синтаксис сделан естественным для обычного читателя; техническая природа устройств обозначена без анахроничной конкретизации. Все маркеры сносок представлены в основном тексте.
