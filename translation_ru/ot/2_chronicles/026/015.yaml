revisions:
- from: В Иерусалиме он сделал искусно придуманные устройства[a], чтобы установить их на башнях и на углах стен и метать стрелы и большие камни. Слава о нём разнеслась далеко[b], потому что ему была оказана необычайная помощь[c], и он стал силён.
  to: В Иерусалиме он сделал устройства[a], изобретённые искусным мастером, чтобы они находились на башнях и на углах стен, для стрельбы стрелами и метания больших камней. Слава о нём разнеслась далеко[b], ибо ему оказывали необычайную помощь[c], пока он не стал силён.
  rationale: Исправление устраняет добавленное действие «установить», восстанавливает временно-предельное значение עַד כִּי и делает описание применения устройств естественным по-русски. Неопределённость относительно того, кто помогал царю, сохранена как в еврейском тексте.
