  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: ru
  text: Он делал то, что правильно в глазах Яхве[a], поступая во всём так, как поступал его отец Амасия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пред Яхве»; в традиционных переводах имя Яхве часто передаётся как «Господь».'
    reason: Передаёт возможный русский вариант древнееврейской идиомы בְּעֵינֵי и отдельно поясняет традиционную титульную замену личного имени יהוה.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Он делал то, что было правильным
  rationale: Сочетание עשה с субстантивированным יָשָׁר означает поступать правильно. Несовершенный вид «делал» естественно передаёт общую характеристику правления, а не единичный поступок.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранена прозрачная древнееврейская метафора оценки с чьей-либо точки зрения; оборот понятен и естественен в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: во всём поступая так, как поступал
  rationale: Формулировка передаёт и соответствие образцу, выраженное כְּ, и полноту כֹּל, оставаясь естественной по-русски.
- source_word: אֲמַצְיָהוּ
  choice: Амасия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אָבִיו
  choice: его отец
  rationale: В данном историческом контексте אָב обозначает непосредственного отца Озии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога. Транслитерация сохраняет отличие имени от титула; традиционный вариант дан в примечании.
- issue: Характер нравственной оценки царя
  choice: то, что было правильным в глазах Яхве
  alternative: угодное Яхве
  rationale: Более буквальная формулировка сохраняет критерий правильности и образ «в глазах», не сводя оценку лишь к идее угождения.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис перестроен для естественности: полнота подражания отцу передана деепричастным оборотом, без утраты смысла исходной конструкции.'
