base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: ru
  text: Он построил башни в пустынной местности и высек множество водосборных цистерн[a], потому что у него было много скота в Шефеле[b] и на равнине; а в горах и на плодородных землях[c] у него были земледельцы и виноградари, потому что он любил землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водоёмы». Речь идёт о высеченных в грунте или скале ямах для сбора и хранения воды, а не обязательно о колодцах, питаемых подземным источником.'
    reason: lexical_alternative
  - marker: b
    text: Шефела — холмистая предгорная область Иудеи; название можно также перевести как «низменность».
    reason: cultural_note
  - marker: c
    text: 'Или: «на Кармеле», если понимать это слово как название местности, а не как обозначение плодородной земли.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: башни
  rationale: Нейтрально передаёт значение существительного, не уточняя без достаточного основания, что это были именно сторожевые башни.
- source_word: בַּמִּדְבָּר
  choice: в пустынной местности
  rationale: Передаёт незаселённую или степную местность и не создаёт обязательного образа безводной песчаной пустыни.
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: высек множество водосборных ям
  rationale: Глагол указывает на высекание или вырубание, а существительное — на ямы для сбора и хранения воды; выражение точнее, чем «выкопал колодцы».
- source_word: מִקְנֶה רַב
  choice: много скота
  rationale: Сохраняет собирательное значение и не сужает его до крупного рогатого скота.
- source_word: שְׁפֵלָה
  choice: Шефела
  rationale: В данном перечне географических областей слово естественно понимать как название Иудейского предгорья; пояснение дано в сноске.
- source_word: מִישׁוֹר
  choice: равнина
  rationale: Естественно передаёт обозначение ровной местности, сохраняя отличие от Шефелы и холмов.
- source_word: אִכָּרִים
  choice: земледельцы
  rationale: Современное и точное обозначение людей, обрабатывающих почву.
- source_word: כֹרְמִים
  choice: виноградари
  rationale: Точно обозначает работников, выращивающих виноград и ухаживающих за виноградниками.
- source_word: בֶּהָרִים
  choice: на холмах
  rationale: В сельскохозяйственном контексте естественнее русского «в горах» и не преувеличивает высоту местности.
- source_word: בַּכַּרְמֶל
  choice: на плодородных землях
  rationale: כַּרְמֶל здесь можно понимать как нарицательное обозначение плодородной, возделываемой земли; возможность топонима сохранена в сноске.
- source_word: אֹהֵב אֲדָמָה
  choice: любил землю
  rationale: Сохраняет конкретный образ привязанности к почве и земледелию, не превращая его в пояснительный пересказ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Географическое название «Шефела» оставлено в тексте и разъяснено; редкое «водосборные ямы» выбрано ради точности и также пояснено. Синтаксис сохраняет перечисление сельскохозяйственных владений, не добавляя отсутствующих в еврейском тексте местоименных конструкций.
