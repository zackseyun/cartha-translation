base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: ru
  text: 'И почил Озия со своими предками, и похоронили его вместе с ними на погребальном поле, принадлежавшем царям, ибо сказали: «Он — прокажённый[a]». И воцарился вместо него его сын Иоафам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он поражён кожной болезнью». Еврейское слово обозначает человека, поражённого цараат — состоянием, которое могло охватывать более широкий круг заболеваний, чем современная лепра.'
    reason: Лексическая альтернатива необходима, чтобы традиционное слово «прокажённый» не воспринималось как точный современный медицинский диагноз.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил со своими предками
  rationale: Глагол שׁכב в царской посмертной формуле означает смерть, но перевод «почил» сохраняет образный и формульный характер выражения. «Предки» естественнее в современном русском и передаёт династический смысл אֲבֹתָיו.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: похоронили его
  rationale: Сохранена активная форма множественного числа с неопределённым субъектом, как в еврейском тексте.
- source_word: עִם אֲבֹתָיו
  choice: вместе с ними
  rationale: Местоимение избегает тяжеловесного повтора «со своими предками», сохраняя связь погребения с предками; формулировка не утверждает, что он был положен в ту же гробницу.
- source_word: בִּשְׂדֵה הַקְּבוּרָה אֲשֶׁר לַמְּלָכִים
  choice: на погребальном поле, принадлежавшем царям
  rationale: «Поле» сохраняет конкретный образ שָׂדֶה, а «принадлежавшем царям» естественно передаёт отношение, выраженное לַמְּלָכִים, не уточняя, шла ли речь о собственности или предназначении.
- source_word: כִּי אָמְרוּ
  choice: потому что говорили
  rationale: כִּי вводит названную в тексте причину места погребения; несовершенный вид «говорили» естественно передаёт неопределённое множественное число.
- source_word: מְצוֹרָע
  choice: прокажённый
  rationale: Традиционное и краткое обозначение человека, поражённого צָרַעַת. Сноска предупреждает, что древняя категория не обязательно совпадает с современной болезнью Хансена.
- source_word: וַיִּמְלֹךְ יוֹתָם בְּנוֹ תַּחְתָּיו
  choice: воцарился вместо него его сын Иофам
  rationale: «Воцарился» естественно передаёт формулу престолонаследия, а «вместо него» сохраняет значение תַּחְתָּיו как замещения.
theological_decisions:
- issue: Передача מְצוֹרָע как ритуально-медицинского обозначения
  choice: Он прокажённый
  alternative: Он поражён кожной болезнью
  rationale: Основной текст сохраняет узнаваемое традиционное обозначение, но сноска не позволяет отождествить צָרַעַת исключительно с современной лепрой и сохраняет более широкий смысл древнееврейской категории.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской формульностью. «Почил» и «воцарился» уместны для царской хроники, при этом синтаксис остаётся ясным для современного читателя. Маркер сноски помещён непосредственно после спорного термина, к которому относится примечание.
