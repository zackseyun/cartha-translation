  text: וַ/יַּעַמְד֞וּ עַל עֻזִּיָּ֣הוּ הַ/מֶּ֗לֶךְ וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹא לְ/ךָ֣ עֻזִּיָּ֗הוּ לְ/הַקְטִיר֙ לַֽ/יהוָ֔ה כִּ֣י לַ/כֹּהֲנִ֧ים בְּנֵי אַהֲרֹ֛ן הַ/מְקֻדָּשִׁ֖ים לְ/הַקְטִ֑יר צֵ֤א מִן הַ/מִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְ/לֹֽא לְ/ךָ֥ לְ/כָב֖וֹד מֵ/יְהוָ֥ה אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: ru
  text: 'Они выступили против царя Озии[a] и сказали ему: «Не тебе, Озия, воскурять благовония Господу. Это дело священников, сыновей Аарона, посвящённых для воскурения. Выйди из святилища, потому что ты проявил неверность[b], и это не принесёт тебе чести от Господа Бога»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преградили путь царю Озии», «противостали царю Озии».'
    reason: Еврейское выражение обозначает решительное противостояние и допускает несколько близких способов передачи.
  - marker: b
    text: 'Или: «ты совершил святотатственное нарушение». Еврейский глагол означает нарушение верности, особенно в заветной или священной сфере.'
    reason: Примечание сохраняет культовую тяжесть многозначного еврейского глагола.
  - marker: c
    text: 'Буквально: «и не тебе — для чести от Господа Бога». Еврейская фраза эллиптична; по смыслу поступок Озии не принесёт ему чести от Бога.'
    reason: Примечание показывает буквальную структуру и объясняет необходимое для естественного русского языка восполнение.
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: выступили против
  rationale: Идиома выражает решительное противостояние, а не просто положение рядом; русский оборот естественно передаёт и действие, и направленность против царя.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: не тебе ... воскурять благовония
  rationale: Конструкция отрицает право или подобающую роль Озии. «Не тебе» сохраняет лаконичность и силу еврейского выражения без административного оттенка слова «уполномочен».
- source_word: לְהַקְטִיר
  choice: воскурять благовония
  rationale: В данном храмовом контексте глагол обозначает совершение каждения; традиционно-культовое «воскурять благовония» точно и понятно.
- source_word: לַיהוָה
  choice: Господу
  rationale: Тетраграмматон передан принятой в русской библейской речи формой «Господь».
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: Это дело священников, сыновей Аарона
  rationale: Еврейская конструкция противопоставляет Озии тех, кому принадлежит это служение. Добавление «это дело» естественно восполняет подразумеваемую связку, не расширяя смысла.
- source_word: הַמְקֻדָּשִׁים
  choice: посвящённых
  rationale: Пассивное причастие указывает на отделение священников для священного служения; «посвящённых» сохраняет культовый смысл.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: Выйди из святилища
  rationale: Императив и обозначение священного пространства переданы прямо; «святилище» не сужает значение до конкретного внутреннего помещения.
- source_word: מָעַלְתָּ
  choice: ты проявил неверность
  rationale: Глагол обозначает серьёзное нарушение верности, особенно в священной сфере. Формулировка сохраняет тяжесть проступка, не сводя его к процедурной ошибке.
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: это не принесёт тебе чести от Господа Бога
  rationale: Еврейская фраза эллиптична. Русская формулировка ясно передаёт, что поступок Озии не приведёт к чести, исходящей от Бога, не уточняя сверх текста, будет ли итогом именно бесчестье.
theological_decisions:
- issue: Исключительное право священников на воскурение
  choice: Воскурение Господу представлено как служение посвящённых сыновей Аарона, а не царя.
  alternative: Общее противопоставление религиозной и царской власти без указания на конкретное священнодействие.
  rationale: Текст прямо говорит о воскурении и о посвящённых для него священниках из сыновей Аарона, поэтому конкретное культовое ограничение следует сохранить.
- issue: Характер проступка Озии в מָעַלְתָּ
  choice: Серьёзная неверность в священной сфере.
  alternative: Лишь нарушение порядка или процедурная ошибка.
  rationale: Употреблённый глагол несёт значение нарушения верности и сакрального обязательства; перевод не ослабляет его до нейтральной ошибки.
- issue: Неоднозначность заключительной фразы о чести
  choice: Поступок не принесёт Озии чести от Господа Бога.
  alternative: Господь непременно подвергнет Озию бесчестью.
  rationale: Эллиптический оригинал отрицает честь от Бога, но не формулирует прямо положительное утверждение о бесчестье; перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Формы «воскурять», «святилище» и «посвящённые» уместны для храмового контекста и остаются понятными широкому читателю. Прямая речь передана решительно и лаконично; имя עֻזִּיָּהוּ дано в закрепившейся русской библейской форме «Озия».
