base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: ru
  text: Он вышел, сразился с филистимлянами и проломил стену Гата, стену Явне и стену Ашдода[a], а затем построил города в области Ашдода[b] и среди филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разрушил стену Гата, стену Явне и стену Ашдода».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в Ашдоде»; название может обозначать сам город или подвластную ему область.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Он вышел
  rationale: Буквально передаёт יצא и сохраняет последовательность повествования, не добавляя подразумеваемого военного значения «выступил в поход».
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: сразился с филистимлянами
  rationale: Глагол לחם в нифале означает «сражаться, вести войну»; конструкция «сразился с» естественна в современном русском и сохраняет указание на народ, а не на территорию.
- source_word: וַיִּפְרֹץ
  choice: разрушил
  rationale: В сочетании со стеной פרץ обозначает её пролом или разрушение. «Разрушил» понятно широкому читателю; более узкое «проломил» сохранено в примечании как возможный вариант.
- source_word: חוֹמַת
  choice: стену
  rationale: Еврейское существительное стоит в единственном числе и повторяется перед названием каждого из трёх городов; это повторение сохранено.
- source_word: גַּת / יַבְנֶה / אַשְׁדּוֹד
  choice: Гат / Явне / Ашдод
  rationale: Употреблены принятые русские формы древнееврейских географических названий.
- source_word: וַיִּבְנֶה עָרִים
  choice: построил города
  rationale: בנה прямо означает «строить»; оснований уточнять «восстановил» в тексте стиха нет. עָרִים передано обычным соответствием «города».
- source_word: בְּאַשְׁדּוֹד
  choice: в области Ашдода
  rationale: Если понимать Ашдод только как город, выражение о строительстве нескольких городов внутри него звучит неестественно. «В области Ашдода» передаёт вероятное территориальное значение, а буквальная неоднозначность отмечена в сноске.
- source_word: וּבַפְּלִשְׁתִּים
  choice: среди филистимлян
  rationale: Еврейский текст называет народ, а не страну; перевод сохраняет это различие и одновременно выражает местное значение предлога.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены повтор существительного «стена» и различие между названиями городов и народом филистимлян; неоднозначность территориального употребления «Ашдод» вынесена в примечание.
