base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: ru
  text: И Озия приготовил для них, для всего войска, щиты, копья, шлемы, панцири, луки и камни для пращей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «камни пращей».'
    reason: Уточняется буквальная конструкция אַבְנֵי קְלָעִים; основной текст передаёт её естественным по-русски выражением.
lexical_decisions:
- source_word: וַיָּכֶן
  choice: приготовил
  rationale: Порода hифиль глагола כון здесь означает, что Озия обеспечил готовность и наличие военного снаряжения; «приготовил» передаёт это без утверждения, что он сам его изготовил.
- source_word: לָהֶם
  choice: для них
  rationale: Сохранено местоимение еврейского текста; последующее «для всего войска» ясно указывает, к кому оно относится.
- source_word: לְכָל הַצָּבָא
  choice: для всего войска
  rationale: צָבָא в данном контексте обозначает военную силу; «войско» естественно и точно для современного русского языка.
- source_word: מָגִנִּים
  choice: щиты
  rationale: Обычное обозначение щитов в перечне военного снаряжения.
- source_word: רְמָחִים
  choice: копья
  rationale: Речь идёт о древковом оружии; «копья» — наиболее понятный и нейтральный русский эквивалент.
- source_word: כּוֹבָעִים
  choice: шлемы
  rationale: В военном контексте слово обозначает защитные головные уборы.
- source_word: שִׁרְיֹנוֹת
  choice: панцири
  rationale: Слово обозначает защитное снаряжение для туловища. «Панцири» сохраняет исторический военный колорит, не уточняя без основания, что это именно кольчуги.
- source_word: קְשָׁתוֹת
  choice: луки
  rationale: Прямой русский эквивалент названия оружия.
- source_word: אַבְנֵי קְלָעִים
  choice: камни для пращей
  rationale: Буквально «камни пращей»; выбранная формулировка ясно показывает, что это метательные камни, предназначенные для использования с пращами.
