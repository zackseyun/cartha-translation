base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: ru
  text: У Озии было боеспособное войско, выступавшее на войну по отрядам, в соответствии с числом состоявших на учёте[a], под руководством писца Иеиела[b] и распорядителя Маасеи, под началом Ханании, одного из царских военачальников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в соответствии с числом прошедших воинский смотр». Еврейское слово обозначает официальный подсчёт или постановку воинов на учёт.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское написание имени здесь — יעואל; его также передают как Иеил или Иеуэл.
    reason: textual_name_rendering
lexical_decisions:
- source_word: חַיִל עֹשֵׂה מִלְחָמָה
  choice: боеспособное войско
  rationale: В данном военном контексте חַיִל означает войско, а причастный оборот עֹשֵׂה מִלְחָמָה характеризует его как способное вести войну.
- source_word: יוֹצְאֵי צָבָא
  choice: выступало на войну
  rationale: Выражение обозначает выход войска для военной службы или сражения; выбран естественный русский военный оборот.
- source_word: לִגְדוּד
  choice: по отрядам
  rationale: Здесь речь об организованных воинских подразделениях, а не обязательно о набеговых отрядах.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: согласно числу внесённых в воинский список
  rationale: פְּקֻדָּה указывает на официальный подсчёт, смотр или постановку воинов на учёт.
- source_word: בְּיַד
  choice: учёт вели
  rationale: Буквально «рукой»; в контексте выражение указывает на непосредственное административное ведение дела Иеиелом и Маасеей.
- source_word: הַסּוֹפֵר
  choice: писец
  rationale: Слово обозначает писца-секретаря, исполнявшего официальные административные обязанности.
- source_word: הַשּׁוֹטֵר
  choice: распорядитель
  rationale: שֹׁטֵר обозначает должностное лицо, ведавшее организацией и исполнением распоряжений; «распорядитель» передаёт функцию без излишней конкретизации.
- source_word: עַל יַד
  choice: под руководством
  rationale: Идиома указывает на надзор или вышестоящее руководство Ханании.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: одного из военачальников царя
  rationale: שַׂר может означать начальника, сановника или военачальника; военный контекст поддерживает последнее значение.
