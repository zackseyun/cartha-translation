  text: וַ/יָּבֹ֨א יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִשִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: ru
  text: 'Иеровоам и весь народ пришли к Ровоаму на третий день, как и сказал царь: «Вернитесь[a] ко мне на третий день».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Снова придите ко мне на третий день».'
    reason: Лексема שׁוּב может быть передана как «вернуться» либо, в данном повествовательном контексте, как «снова прийти».
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришли
  rationale: בוא обозначает прибытие или движение к кому-либо; при אֶל רְחַבְעָם естественно русское «пришли». Множественное число согласовано с составным подлежащим по нормам современного русского языка.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: עָם здесь обозначает людей, пришедших вместе с Иеровоамом, без указания на формально созванное собрание.
- source_word: אֶל רְחַבְעָם
  choice: к Ровоаму
  rationale: Предлог אֶל выражает направление к лицу; «к Ровоаму» прямо и естественно передаёт эту конструкцию. Имя дано в устоявшейся русской библейской форме.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Обычный русский эквивалент древнееврейского временного выражения; уточнение «после этого» в оригинале отсутствует.
- source_word: כַּאֲשֶׁר
  choice: как и
  rationale: Передаёт точное соответствие поступка ранее сказанному царём.
- source_word: דִּבֶּר הַמֶּלֶךְ לֵאמֹר
  choice: 'сказал царь:'
  rationale: דבר здесь означает «сказать», а לֵאמֹר вводит прямую речь. В русском двоеточие естественно выполняет функцию вводной формулы, не усиливая её до значения «приказал».
- source_word: שׁוּבוּ אֵלַי
  choice: Вернитесь ко мне
  rationale: שׁוב выражает возвращение; «вернитесь ко мне» точно и естественно передаёт распоряжение снова явиться к царю.
theological_decisions: []
