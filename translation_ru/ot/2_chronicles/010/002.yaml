  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֨עַ יָרָבְעָ֤ם בֶּן נְבָט֙ וְ/ה֣וּא בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י שְׁלֹמֹ֣ה הַ/מֶּ֑לֶךְ וַ/יָּ֥שָׁב יָרָבְעָ֖ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: ru
  text: Когда Иеровоам, сын Навата, услышал об этом[a] — он находился в Египте, куда бежал от царя Соломона[b], — Иеровоам возвратился из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «услышал»; что именно он услышал, в еврейском тексте этого стиха прямо не сказано — это определяется из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «убежал от лица царя Соломона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда ... услышал
  rationale: Оборот с וַיְהִי и инфинитивом вводит временное придаточное; в современном русском естественно передать его союзом «когда», не сохраняя формальное «и было».
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоам, сын Навата
  rationale: Использованы традиционные русские формы библейских имён; патроним передан прямо и выделен как приложение.
- source_word: שְׁמֹעַ
  choice: услышал об этом
  rationale: В еврейском тексте объект не выражен, но подразумевается контекстом. Русское «об этом» естественно восполняет смысл, а примечание сохраняет исходную неуточнённость.
- source_word: וְהוּא בְמִצְרַיִם
  choice: он находился в Египте
  rationale: Фоновое пояснение передано вводной конструкцией между тире; «находился» звучит естественно и не добавляет причинной связи, которой еврейский союз прямо не выражает.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: куда бежал от царя Соломона
  rationale: Относительное אֲשֶׁר соотнесено с Египтом как местом бегства; מִפְּנֵי в данном контексте идиоматично передано «от», а более буквальная пространственная образность отмечена в сноске.
- source_word: וַיָּשָׁב
  choice: возвратился
  rationale: Здесь שוב обозначает физическое возвращение, без богословского оттенка покаяния или восстановления.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: Предлог מן указывает на исходный пункт движения; по-русски при возвращении из страны требуется «из».
