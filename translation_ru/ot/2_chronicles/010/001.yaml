  text: Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: ru
  text: Ровоам отправился в Сихем, потому что весь Израиль пришёл в Сихем, чтобы воцарить его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: отправился
  rationale: Передаёт целенаправленное движение естественным современным русским языком.
- source_word: שְׁכֶמָה
  choice: в Сихем
  rationale: Направительный суффикс -ה выражает движение к месту.
- source_word: בָּאוּ
  choice: собрался туда
  rationale: Буквально «пришли»; в данном контексте речь о прибытии всего Израиля в Сихем как собрания, а «туда» естественно передаёт повторно названный в еврейском тексте Сихем.
- source_word: כָל־יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное обозначение народа в единственном числе, обычное для библейского русского регистра.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: чтобы провозгласить его царём
  rationale: Каузатив глагола מלך означает поставить или сделать царём; «провозгласить царём» естественно выражает публичное признание царской власти в данном контексте.
theological_decisions:
- issue: Характер воцарения Ровоама
  choice: провозгласить его царём
  alternative: сделать его царём
  rationale: Формулировка не решает сверх текста вопрос об источнике царской власти, но ясно передаёт действие собрания Израиля по признанию Ровоама царём.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием; синтаксис простой и доступный, без архаизмов.
