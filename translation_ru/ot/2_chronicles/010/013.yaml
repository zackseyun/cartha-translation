  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: ru
  text: И царь ответил им сурово, и царь Ровоам отверг совет старейшин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: ответил им
  rationale: Глагол ענה означает ответ; местоименный суффикс 3-го лица множественного числа явно передаёт дополнение «им».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Прямое соответствие существительному מלך с определённым артиклем; в русском повествовании определённость передаётся контекстом.
- source_word: קָשָׁה
  choice: сурово
  rationale: Формально это прилагательное «тяжёлый, жёсткий, суровый», но при глаголе ответа оно употреблено обстоятельственно; «сурово» естественно передаёт резкость ответа.
- source_word: וַיַּעֲזֹב
  choice: отверг
  rationale: עזב буквально означает «оставить, покинуть»; применительно к совету контекстуальное «отверг» ясно передаёт намеренный отказ следовать ему.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: царь Ровоам
  rationale: Приложение называет царя по имени; конструкция «царь Ровоам» естественна для русского библейского повествования.
- source_word: עֲצַת
  choice: совет
  rationale: עֵצָה здесь обозначает рекомендацию, данную советниками; русское «совет» сохраняет и содержание, и официальный оттенок.
- source_word: הַזְּקֵנִים
  choice: старейшин
  rationale: В контексте זקנים — не просто пожилые мужчины, а признанные старшие советники; «старейшины» передаёт их общественную роль.
