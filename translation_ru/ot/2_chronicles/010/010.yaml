base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: ru
  text: 'Молодые люди, выросшие вместе с ним, сказали ему: «Вот что ты скажешь народу, который говорил тебе: „Твой отец сделал наше ярмо тяжёлым, а ты облегчи его“. Вот что ты им скажешь: „Мой мизинец[a] толще поясницы[b] моего отца“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моя малость». Здесь выражение понимается как обозначение мизинца; ср. параллельное место в 3 Царств 12:10.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чресл»; еврейское слово обозначает область поясницы и чресл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: молодые люди
  rationale: В придворном контексте и при уточнении «выросшие вместе с ним» речь идёт не о детях, а о молодых сверстниках и советниках Ровоама.
- source_word: גָּדְלוּ אִתּוֹ
  choice: выросшие вместе с ним
  rationale: Оборот обозначает совместное взросление; такой перевод точен и естествен в современном русском языке.
- source_word: כֹּה תֹאמַר
  choice: вот что ты скажешь
  rationale: Передаёт обычную формулу введения предписанной речи, сохраняя направляющую силу будущего времени.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: твой отец наложил на нас тяжёлое ярмо
  rationale: Сохраняется конкретная метафора ярма, а значение тяжести передаётся естественным русским оборотом, без буквального синтаксического калькирования.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: а ты облегчи его
  rationale: Императив передаёт просьбу народа снять часть лежащей на нём тяжести; местоимение восстанавливает явно подразумеваемое ярмо.
- source_word: קָטָנִּי
  choice: мой мизинец
  rationale: Буквально форма означает «моя малость», но в данном сравнении это эллиптическое идиоматическое обозначение мизинца; буквальная форма отмечена в сноске.
- source_word: עָבָה
  choice: толще
  rationale: Точно передаёт значение толщины и сравнительную конструкцию с מִן.
- source_word: מִמָּתְנֵי אָבִי
  choice: поясницы моего отца
  rationale: מָתְנַיִם обозначает область поясницы или бёдер; «поясница» сохраняет телесный образ и звучит достойно в современном литературном русском.
