  text: וְ/כָל יִשְׂרָאֵ֗ל כִּ֠י לֹא שָׁמַ֣ע הַ/מֶּלֶךְ֮ לָ/הֶם֒ וַ/יָּשִׁ֣יבוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜יד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י אִ֤ישׁ לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑יד וַ/יֵּ֥לֶךְ כָּל יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: ru
  text: 'И поскольку царь не послушал их, весь Израиль ответил царю: «Какая у нас доля в Давиде? Нет у нас наследия в сыне Иессея! Каждый — к своим шатрам[a], Израиль! Теперь заботься о своём доме[b], Давид!» И весь Израиль разошёлся по своим шатрам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «К шатрам» — призыв разойтись по своим местам, по домам; буквально сохранён образ шатров.
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь может означать не только жилище или семью Давида, но и его царскую династию.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: послушал
  rationale: В данном контексте глагол означает не просто услышать, а внять просьбе народа; русское «послушал» естественно передаёт этот смысл.
- source_word: וַיָּשִׁיבוּ
  choice: ответил
  rationale: Глагольная форма входит в идиоматическое выражение со значением «дать ответ». Единственное число согласовано с собирательным выражением «весь Израиль».
- source_word: חֵלֶק
  choice: доля
  rationale: Сохраняет образ участия или причастности в формуле политического отречения от дома Давида.
- source_word: נַחֲלָה
  choice: наследие
  rationale: Передаёт семейно-династический и заветный оттенок удела, связанного с потомством Давида.
- source_word: בְּבֶן יִשַׁי
  choice: в сыне Иессея
  rationale: Сохраняет еврейскую конструкцию, обозначающую отсутствие доли или наследия в Давиде и его линии.
- source_word: אִישׁ
  choice: каждый
  rationale: Единственное число употреблено дистрибутивно. «Каждый» естественно передаёт призыв всем по отдельности, не усиливая мужскую маркированность сверх коммуникативного значения формы.
- source_word: לְאֹהָלֶיךָ
  choice: к своим шатрам
  rationale: Сохраняет буквальный исторический образ; местоимение «своим» естественно по-русски передаёт обращение к собирательному Израилю.
- source_word: רְאֵה בֵיתְךָ
  choice: заботься о своём доме
  rationale: Передаёт идиоматический повелительный смысл — Давиду следует самому ведать своим домом, — сохраняя многозначность слова «дом».
- source_word: לְאֹהָלָיו
  choice: по своим шатрам
  rationale: В еврейском после собирательного «весь Израиль» стоит морфологическое единственное число («к его шатрам»); русское множественное распределительное выражение передаёт тот же смысл естественно.
theological_decisions:
- issue: Политическая формула отречения от Давида
  choice: «Какая у нас доля в Давиде? Нет у нас наследия в сыне Иессея!»
  alternative: «Нам нет дела до Давида, и с сыном Иессея нас ничто не связывает»
  rationale: Сохранены метафоры доли и наследия, несущие политический, семейный и заветный оттенки, без сведения высказывания к современному политическому лозунгу.
- issue: Многозначность בַּיִת в обращении к Давиду
  choice: «заботься о своём доме»
  alternative: «сам заботься о своей династии»
  rationale: «Дом» может обозначать семью, хозяйство или династию; перевод не устраняет намеренно эту значимую многозначность.
- issue: Дистрибутивное אִישׁ
  choice: «Каждый — к своим шатрам»
  alternative: «Каждый мужчина — к своим шатрам»
  rationale: В контексте אִישׁ имеет дистрибутивную силу в обращении ко всему Израилю. «Каждый» передаёт её без необоснованного утверждения, будто призыв относился исключительно к мужчинам.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного ритма прямой речи. Исторические образы «доля», «наследие», «шатры» и «дом» сохранены; синтаксис упрощён лишь настолько, чтобы стих звучал естественно и ясно.
