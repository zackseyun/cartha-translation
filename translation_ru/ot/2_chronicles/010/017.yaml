lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: А над сынами Израиля
  rationale: Сочетание בְּנֵי יִשְׂרָאֵל передано близко к форме исходного текста как «сыны Израиля»; союз ו в данном контексте обозначает переход к контрастирующей группе и естественно передаётся как «А».
- source_word: הַיֹּשְׁבִים
  choice: жившими
  rationale: Причастие от ישב обозначает постоянное или продолжительное проживание; «жившими» естественно передаёт этот смысл по-русски.
- source_word: בְּעָרֵי יְהוּדָה
  choice: в городах Иудеи
  rationale: Прямое обозначение места с сохранением географического родительного отношения.
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: Глагол מלך здесь обозначает осуществление царской власти; «царствовал» соответствует повествовательному контексту.
- source_word: עֲלֵיהֶם
  choice: над
  rationale: Предлог על с местоименным суффиксом выражает власть над названной группой; в русском предложении значение суффикса естественно включено в сочетание «над сынами Израиля».
- source_word: רְחַבְעָם
  choice: Ровоам
  rationale: Использована устоявшаяся русская библейская форма личного имени.
