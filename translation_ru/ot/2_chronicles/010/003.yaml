base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: ru
  text: 'И послали за ним и позвали его. И пришёл Иеровоам со всем Израилем, и они сказали Ровоаму:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: послали за ним
  rationale: В контексте подразумевается отправка людей или вести с целью вызвать Иеровоама; русское «послали за ним» естественно передаёт эллиптическую конструкцию, не уточняя, кто именно был послан.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: призвали его
  rationale: קרא + ל здесь означает вызов или приглашение явиться. «Призвали его» сохраняет отдельное действие после «послали за ним».
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Единственное число еврейского глагола согласовано с ведущим субъектом, Иеровоамом; оборот «со всем Израилем» естественно сохраняет эту синтаксическую особенность.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Иеровоам со всем Израилем
  rationale: «Весь Израиль» сохранено как национально-общинное обозначение; предлог «со» позволяет по-русски естественно передать единственное число сказуемого.
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  choice: они сказали Ровоаму
  rationale: Множественное число относится к Иеровоаму и всему Израилю. Перед непосредственно следующей речью русское «сказали» звучит естественнее буквального «говорили».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейский вводный инфинитив перед прямой речью естественно передаётся в современном русском двоеточием, без тяжеловесного «говоря».
