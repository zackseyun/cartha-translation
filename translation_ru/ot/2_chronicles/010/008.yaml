base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: ru
  text: Но он отверг совет старейшин, который они ему дали, и посоветовался с молодыми людьми, выросшими вместе с ним и стоявшими перед ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служившими ему»; выражение «стоять перед кем-либо» может обозначать придворную службу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: отверг
  rationale: В данном контексте עזב означает не просто оставить без внимания, а отказаться от совета в пользу другого; «отверг» ясно передаёт это решение.
- source_word: עֲצַת הַזְּקֵנִים
  choice: совет старейшин
  rationale: «Совет» естественно передаёт עֵצָה, а «старейшины» сохраняет как возрастной, так и общественно-совещательный оттенок זְקֵנִים.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: который они ему дали
  rationale: Такая формулировка избегает ненужного повтора корня «совет» и точно передаёт смысл придаточного.
- source_word: וַיִּוָּעַץ
  choice: стал советоваться с
  rationale: Нифаль здесь обозначает вступление в совещание; «стал советоваться с» естественно передаёт развитие повествования.
- source_word: הַיְלָדִים
  choice: молодыми людьми
  rationale: Речь идёт о ровесниках царя при дворе, а не о детях; перевод сохраняет указание на сравнительную молодость без ложного возрастного впечатления.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: выросшими вместе с ним
  rationale: Передаёт совместное взросление и естественно связывает определение с «молодыми людьми».
- source_word: הָעֹמְדִים לְפָנָיו
  choice: стоявшими перед ним
  rationale: Сохранён буквальный образ древнееврейского придворного выражения; возможный служебный смысл пояснён в сноске.
