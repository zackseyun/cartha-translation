    issue: «который обратился ко мне с просьбой» интерпретирует формулу введения прямой речи.
    rationale: Дִבְּרוּ אֵלַי לֵאמֹר буквально сообщает, что народ говорил/сказал царю, и вводит его слова. Указание именно на «просьбу» выводимо из цитаты, но не выражено формулой оригинала; нейтральное «сказал мне» точнее.
