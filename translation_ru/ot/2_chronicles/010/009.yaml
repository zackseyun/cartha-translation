base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: ru
  text: 'И сказал он им: «Что вы посоветуете ответить этому народу, который сказал мне: „Облегчи ярмо, которое возложил на нас твой отец“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֽוֹעָצִים
  choice: посоветуете
  rationale: Форма от יעץ обозначает дачу совета; будущее время естественно для русского вопроса о предлагаемом решении.
- source_word: וְנָשִׁיב דָּבָר
  choice: ответить
  rationale: Сочетание означает дать или возвратить ответ; русский инфинитив естественно передаёт цель совещания, тогда как множественное «мы» подразумевается контекстом.
- source_word: הָעָם הַזֶּה
  choice: этому народу
  rationale: Сохранено собирательное существительное в единственном числе, как в еврейском тексте.
- source_word: דִּבְּרוּ אֵלַי לֵאמֹר
  choice: обратился ко мне с просьбой
  rationale: В данном контексте речь народа представляет собой просьбу; формулировка естественно вводит прямую цитату, не меняя её содержания.
- source_word: הָקֵל
  choice: Облегчи
  rationale: Повелительная форма означает сделать легче; глагол хорошо сочетается в русском с образом ярма.
- source_word: מִן הָעֹל
  choice: ярмо
  rationale: Сохранён буквальный образ עֹל как метафоры тяжёлой повинности или власти.
- source_word: נָתַן ... עָלֵינוּ
  choice: возложил на нас
  rationale: Дигнифицированная и естественная русская формулировка передаёт навязывание ярма.
- source_word: אָבִיךָ
  choice: твой отец
  rationale: Прямое соответствие обращению к Ровоаму.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: И сказал он им
  rationale: Сохранена повествовательная связь wayyiqtol и торжественный библейский регистр без архаической грамматики.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Метафора ярма сохранена; синтаксис упрощён ради ясности без устранения коллективного смысла «народа».
