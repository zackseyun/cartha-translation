base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: ru
  text: 'И он сказал им по совету молодых людей: «Я сделаю ваше ярмо тяжелее и ещё увеличу его. Мой отец наказывал вас бичами, а я — скорпионами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, здесь имеются в виду «бичи-скорпионы» — особенно жестокие плети с острыми выступами или шипами; буквально в еврейском тексте: «скорпионами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: И он сказал им
  rationale: דבר — обычный глагол речи. В данном контексте русское «сказал им» естественно вводит ответ Ровоама и не добавляет лишнего толкования.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: по совету молодых людей
  rationale: עֵצָה означает «совет», а כ передаёт соответствие этому совету. הַיְלָדִים здесь обозначает молодых советников, а не малолетних детей.
- source_word: אַכְבִּיד אֶת־עֻלְּכֶם
  choice: Я сделаю ваше ярмо тяжелее
  rationale: Порода hифиль глагола כבד имеет каузативное значение. Сравнительная форма «тяжелее» ясно передаёт усиление уже существующего ярма, сохраняя исходную метафору.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: и ещё прибавлю к нему
  rationale: Глагол יסף с עַל означает прибавление или увеличение; местоимение относится к ярму. «Ещё» естественно выражает наращивание бремени, не заменяя образ пояснением.
- source_word: יִסַּר אֶתְכֶם
  choice: наказывал вас
  rationale: יסר охватывает значения наставления, дисциплинирования и наказания. В угрозе царя речь идёт о принудительном карательном воздействии, поэтому «наказывал» точнее и естественнее русского «дисциплинировал».
- source_word: בַּשּׁוֹטִים
  choice: бичами
  rationale: שׁוֹט — бич или плеть. «Бичами» сохраняет выразительный образ и соответствует возвышенному, но понятному библейскому регистру.
- source_word: בָּעֲקְרַבִּים
  choice: скорпионами
  rationale: Буквальное значение עַקְרָב — «скорпион». Основной текст сохраняет яркий и намеренно резкий образ, а вероятное обозначение особого вида бичей поясняется в сноске.
