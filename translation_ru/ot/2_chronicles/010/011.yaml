base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: ru
  text: Итак, отец мой возложил на вас тяжёлое ярмо, а я увеличу ваше ярмо. Отец мой наказывал вас плетьми, а я — скорпионами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «плетьми-скорпионами», то есть плетьми с острыми наконечниками или зазубринами; буквально по-еврейски: «скорпионами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Связка вводит продолжение речи и её вывод; «итак» естественно передаёт переход в современном русском.
- source_word: הֶעְמִיס ... עֹל כָּבֵד
  choice: сделал ваше ярмо тяжёлым
  rationale: Передаёт каузативный смысл глагола и сохраняет буквальный образ тяжёлого ярма.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: прибавлю к вашему ярму
  rationale: Сохраняет буквальную конструкцию и параллелизм еврейского текста, не заменяя образ толкованием «усилю бремя».
- source_word: יִסַּר
  choice: наказывал
  rationale: В данном контексте речь идёт о суровом карательном воздействии; «наказывал» естественно и понятно, сохраняя смысл дисциплинарного наказания.
- source_word: בַּשּׁוֹטִים
  choice: плетьми
  rationale: «Плеть» — ясное современное обозначение орудия бичевания и подходит для противопоставления «скорпионам».
- source_word: בָּעֲקְרַבִּים
  choice: скорпионами
  rationale: Основной текст сохраняет буквальное значение еврейского слова и его резкий образ; возможное обозначение особых бичей вынесено в примечание.
