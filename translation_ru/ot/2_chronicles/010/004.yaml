base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: ru
  text: Твой отец сделал наше ярмо тяжёлым[a]. Теперь облегчи тяжёлую повинность[b], наложенную твоим отцом, и его тяжёлое ярмо, которое он возложил на нас, — и мы будем служить тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал наше ярмо суровым» или «жестоким».'
    reason: lexical_alternative
  - marker: b
    text: '«Повинность» здесь означает обязательный труд или иные обязанности, возложенные царской властью; возможно также: «работу» или «службу».'
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה
  choice: сделал ... тяжёлым
  rationale: Каузативная форма передана глаголом «сделал». В сочетании с ярмом «тяжёлым» естественно для современного русского языка и поддерживает образ тяжёлого ярма далее в стихе; возможный оттенок суровости отмечен в сноске.
- source_word: עֻלֵּנוּ
  choice: наше ярмо
  rationale: Сохранён конкретный образ ярма, метафорически обозначающего обременительное подчинение.
- source_word: הָקֵל
  choice: облегчи
  rationale: Повелительная форма означает требование уменьшить бремя; «облегчи» кратко и естественно продолжает образ тяжести.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: тяжёлую повинность, наложенную твоим отцом
  rationale: עֲבֹדָה здесь обозначает не просто обычную работу, а обязательную службу или труд под царской властью. «Повинность» ясно передаёт этот контекст, а причастный оборот естественно выражает еврейскую родительную конструкцию.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: и его тяжёлое ярмо
  rationale: Сохранены параллелизм и повтор метафоры ярма; כָּבֵד прямо передано словом «тяжёлое».
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: которое он возложил на нас
  rationale: «Возложил на нас» сохраняет образ реально надеваемого ярма и одновременно естественно звучит применительно к бремени.
- source_word: וְנַעַבְדֶךָּ
  choice: и мы будем служить тебе
  rationale: Передано обещание народа подчиниться Ровоаму при условии облегчения бремени.
- source_word: אָבִיךָ
  choice: твой отец / твоим отцом
  rationale: Прямая отсылка к Соломону сохранена; падежная форма обусловлена естественным русским синтаксисом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства речи и центральной метафоры ярма. Архаичное «иго» не использовано, поскольку «ярмо» точнее сохраняет предметный образ и понятно современному читателю; «повинность» уточняет политико-трудовой контекст עֲבֹדָה без привнесения конфессиональной терминологии.
