  text: וַ/יְדַבְּר֨וּ אֵלָ֜י/ו לֵ/אמֹ֗ר אִם תִּֽהְיֶ֨ה לְ/ט֜וֹב לְ/הָ/עָ֤ם הַ/זֶּה֙ וּ/רְצִיתָ֔/ם וְ/דִבַּרְתָּ֥ אֲלֵ/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: ru
  text: 'Они сказали ему: «Если ты будешь добр к этому народу, угодишь им[a] и скажешь им добрые слова, то они будут твоими слугами во все дни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проявишь к ним благоволение». Еврейский глагол может означать как доставить кому-либо удовольствие, так и благосклонно отнестись к нему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут служить тебе всегда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: будешь добр к этому народу
  rationale: Передаёт идиому היה + לְ + טוֹב как благотворное и доброе отношение правителя к народу, не сужая смысл до одной лишь мягкости или любезности.
- source_word: וּרְצִיתָם
  choice: угодишь им
  rationale: 'Передаёт наиболее вероятный в данном контексте смысл: добиться расположения народа, поступив так, чтобы он остался доволен. Возможное значение благосклонного отношения со стороны царя сохранено в сноске.'
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: и скажешь им добрые слова
  rationale: Сохраняет однокоренную конструкцию דבר / דברים и повтор слова טוֹב, оставаясь естественной и понятной по-русски.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: то они будут твоими слугами
  rationale: 'Существительное עֲבָדִים сохранено как «слуги»: здесь речь идёт о политической верности и служении царю, а не обязательно о рабском статусе.'
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Формально передаёт еврейскую идиому длительности, не уточняя без достаточного основания, имеются ли в виду дни жизни царя или непрерывное будущее служение.
