translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Семантическое согласование местоимения «им» с собирательным существительным «народ» сохраняет множественные суффиксы еврейского текста и естественно воспринимается в прямой речи.
