  text: Так Израиль восстал против дома Давида и остаётся в мятеже до сего дня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так Израиль восстал против дома Давида до сего дня». Еврейский глагол можно передать как простое прошедшее действие («восстал») или, с учётом слов «до сего дня», подчеркнуть продолжающееся состояние.'
