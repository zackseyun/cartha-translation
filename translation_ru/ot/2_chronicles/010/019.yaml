lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: остаётся в мятеже
  rationale: Глагол פשע в данном политическом контексте означает восстать против законной власти, поднять мятеж. Настоящее время вместе с «до сего дня» естественно передаёт состояние, начавшееся в прошлом и продолжающееся в повествовательной перспективе автора.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Название сохранено без поясняющего расширения; здесь оно обозначает северные племена в противопоставлении династии Давида.
- source_word: בְּבֵית דָּוִיד
  choice: против дома Давида
  rationale: При פשע предлог בְּ указывает на сторону, против которой восстали; «дом Давида» сохраняет династический смысл исходного выражения.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и dignified русское выражение, обозначающее продолжение положения вплоть до времени автора.
