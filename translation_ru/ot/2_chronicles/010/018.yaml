base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: ru
  text: Тогда царь Ровоам послал Хадорама[a], начальника над трудовой повинностью, а израильтяне забросали его камнями, и он умер. Царь Ровоам, собравшись с силами[b], чтобы взойти на колесницу и бежать в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь: «Хадорам»; в параллельном рассказе, 3 Царств 12:18, — «Адорам».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «укрепил себя, чтобы взойти на колесницу и бежать в Иерусалим»; по смыслу возможно также: «приложил усилие» или «поспешил взойти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שלח; естественно и точно передаёт действие царя.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: царь Ровоам
  rationale: Соответствует естественному порядку титула и имени в современном русском языке.
- source_word: הֲדֹרָם
  choice: Адорам
  rationale: Русская библейская передача имени; отличие еврейской формы в Паралипоменоне от формы параллельного места отмечено в сноске.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: начальника над трудовой повинностью
  rationale: מַס обозначает принудительную трудовую службу, а конструкция אֲשֶׁר עַל — лицо, поставленное над ней; формулировка ясна и сохраняет административный смысл.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: забросали его камнями
  rationale: Передаёт и глагол побивания камнями, и явно названное орудие אֶבֶן, оставаясь естественным по-русски.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: В данном контексте выражение «сыны Израиля» является национальным обозначением; современный русский эквивалент передаёт его смысл без ненужной буквальности.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Прямо передаёт последовательность повествования, не уточняя причинную связь сверх сказанного в еврейском тексте.
- source_word: הִתְאַמֵּץ
  choice: собравшись с силами
  rationale: Возвратная форма глагола אמץ выражает внутреннее усилие, укрепление себя или решимость; русский оборот сохраняет этот оттенок и не подменяет его идеей одной лишь поспешности.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: взошёл на колесницу
  rationale: עלה с колесницей означает подняться или взойти на неё; формулировка естественна для повествовательного регистра.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: бежал в Иерусалим
  rationale: נוס обозначает бегство от опасности; русский глагол «бежал» кратко и непосредственно передаёт это значение.
