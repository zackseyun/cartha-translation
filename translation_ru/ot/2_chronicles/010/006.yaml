base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: ru
  text: 'Тогда царь Ровоам посоветовался со старейшинами, которые служили при его отце Соломоне, пока тот был жив[a]. Он спросил: «Как вы советуете мне ответить этому народу?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стояли перед Соломоном». Этот еврейский оборот может означать, что они состояли при нём или служили ему в официальном качестве.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возвратить этому народу слово», то есть дать ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: посоветовался
  rationale: Форма нифаль от יעץ здесь означает обратиться к другим за советом; русский возвратный глагол естественно передаёт это значение.
- source_word: הַזְּקֵנִים
  choice: со старейшинами
  rationale: В данном контексте речь идёт не просто о пожилых мужчинах, а о старших советниках или влиятельных сановниках; «старейшины» сохраняет традиционное и контекстуально уместное обозначение.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: которые служили при
  rationale: Буквально «стояли перед»; оборот обозначает пребывание при правителе и служение ему, вероятно в официальном качестве. Перевод передаёт смысл идиомы без неясного буквализма.
- source_word: שְׁלֹמֹה אָבִיו
  choice: при его отце Соломоне
  rationale: Такой порядок слов естественен для современного русского языка и сохраняет указание на родство.
- source_word: בִּהְיוֹתוֹ חַי
  choice: пока тот был жив
  rationale: Оборот обозначает время жизни Соломона; местоимение «тот» устраняет возможную двусмысленность относительно Ровоама.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Как вы советуете мне
  rationale: Сохраняется вопросительное «как», а подразумеваемый адресат совета выражен местоимением «мне» ради естественности русского синтаксиса.
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: ответить этому народу
  rationale: Буквально конструкция говорит о том, чтобы «возвратить слово» народу; по-русски её естественное значение передаётся глаголом «ответить».
