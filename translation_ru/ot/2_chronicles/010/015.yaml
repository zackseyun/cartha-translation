base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: ru
  text: Итак, царь не внял народу, ибо этот поворот событий был от Бога[a], чтобы Яхве утвердил Своё слово, которое Он сказал через Ахию из Силома Иеровоаму, сыну Навата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо это обстоятельство (или причина) было от Бога». Еврейское слово может означать поворот, обстоятельство или причинное развитие событий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: послушал
  rationale: В данном контексте сочетание означает не просто услышать, а внять просьбе народа; «послушал» естественно передаёт этот смысл, не усиливая его до полного повиновения.
- source_word: נְסִבָּה
  choice: поворот событий
  rationale: Существительное обозначает поворот, обстоятельство или причинно обусловленное развитие. «Поворот событий» сохраняет повествовательный смысл и допускаемую еврейским словом смысловую широту.
- source_word: מֵעִם הָאֱלֹהִים
  choice: от Бога
  rationale: Фраза прямо указывает на божественный источник происходящего; это краткий и естественный русский эквивалент.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз передаёт цель последующего действия.
- source_word: הָקִים
  choice: утвердил
  rationale: Порода хифиль глагола קום здесь имеет значение «сделать стоящим, утвердить, подтвердить». Выбор сохраняет образ исходного выражения и не сужает его до одного лишь исполнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: דְּבָרוֹ
  choice: Своё слово
  rationale: Широкий и прямой эквивалент, позволяющий понимать речь как ранее данное пророческое слово без сужения до «обещания».
- source_word: בְּיַד
  choice: через
  rationale: Еврейская идиома обозначает посредника или орудие передачи речи; по-русски естественно «через».
- source_word: הַשִּׁלוֹנִי
  choice: из Силома
  rationale: Гентилий указывает на происхождение или связь Ахии с Силомом; описательная форма яснее обычному современному читателю, чем редкое «силомлянин».
- source_word: בֶּן נְבָט
  choice: сыну Навата
  rationale: Стандартная передача древнееврейского патронима с падежным согласованием в русском предложении.
theological_decisions:
- issue: Божественная причинность и человеческое действие
  choice: царь не послушал народ, потому что такой поворот событий был от Бога
  alternative: царь не послушал народ, потому что причина этого была от Бога
  rationale: Текст одновременно представляет отказ царя как его реальное действие и относит развитие событий к Богу. Перевод сохраняет это напряжение, не делая Бога непосредственным субъектом отказа сверх сказанного в оригинале.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; форма «Ахию из Силома» избегает малоупотребительного этнохоронима. Прописные местоимения при отсылке к Богу применены последовательно в пределах фразы.
