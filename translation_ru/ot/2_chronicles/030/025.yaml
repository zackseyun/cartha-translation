  terminology: «Иудея», «священники», «левиты» и «пришельцы» употреблены точно. «Пришельцы» сохраняет традиционное обозначение גֵּרִים; сноска корректно разъясняет термин. В сноске исправлено неудачное «не коренных» на нормативное «некоренных».
