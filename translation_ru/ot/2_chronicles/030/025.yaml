base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: ru
  text: Радовались всё собрание Иудеи, священники и левиты, всё собрание тех, кто пришёл из Израиля, пришельцы[a], пришедшие из земли Израиля, и проживавшие в Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть чужеземцы, постоянно жившие среди израильтян. Еврейское גֵּרִים обозначает некоренных жителей, поселившихся среди народа.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: радовались
  rationale: Глагол שׂמח означает радоваться, испытывать радость. «Радовались» естественно звучит по-русски и не уточняет без основания форму выражения этой радости.
- source_word: כָּל קְהַל יְהוּדָה
  choice: всё собрание Иудеи
  rationale: קהל обозначает собравшееся сообщество. «Собрание» передаёт смысл без более поздних церковных ассоциаций слова «община» и близко следует еврейской конструкции.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычный и контекстуально точный перевод כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Обычное обозначение левитов как группы, отличной здесь от священников.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: всё собрание пришедших из Израиля
  rationale: Причастие הַבָּאִים характеризует участников собрания, прибывших из Израиля. Субстантивированная конструкция «пришедших» естественна в русском повествовании.
- source_word: הַגֵּרִים
  choice: пришельцы
  rationale: גֵּרִים обозначает не коренных жителей, постоянно проживающих среди израильского общества. Традиционное русское «пришельцы» сохраняет особую общественно-правовую категорию; современное пояснение дано в сноске.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: пришедшие из земли Израиля
  rationale: Фраза указывает на географическое происхождение и отличает землю Израиля от Иудеи; «земля Израиля» непосредственно передаёт אֶרֶץ יִשְׂרָאֵל.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: жившие в Иудее
  rationale: Причастие от ישׁב означает проживание или пребывание. «Жившие в Иудее» — ясная современная формулировка, сохраняющая причастный характер выражения.
