- from: И радовались всё собрание Иудеи, священники и левиты, всё собрание пришедших из Израиля, пришельцы[a], пришедшие из земли Израиля, и жившие в Иудее.
  to: Радовались всё собрание Иудеи, священники и левиты, всё собрание тех, кто пришёл из Израиля, пришельцы[a], пришедшие из земли Израиля, и проживавшие в Иудее.
  rationale: Уточнена только синтаксическая связь определения «пришедших из Израиля» со вторым «собранием», чтобы перечисление читалось однозначно. Заключительное «проживавшие» сохраняет значение еврейского причастия в рамках повествования. Сноска стилистически отредактирована; её смысл и привязка к «пришельцам» сохранены.
