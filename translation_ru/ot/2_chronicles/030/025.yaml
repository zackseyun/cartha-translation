    rationale: Русское сочетание допускает нежелательную синтаксическую неоднозначность. Добавление «тех, кто» ясно показывает, что речь идёт обо всём собрании людей, прибывших из Израиля, и не меняет смысла оригинала.
  - severity: low
    issue: Сноска содержит стилистически и орфографически неудачное «не коренных жителей».
    rationale: Нормативная форма — «некоренных жителей»; также формулировка может быть немного сглажена без изменения лексического пояснения.
