  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: ru
  text: Это дело показалось правильным царю и всему собранию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «И это дело было правильным в глазах царя и в глазах всего собрания».'
    reason: Сноска сохраняет буквальную образность идиомы בְּעֵינֵי и возможный более объективный оттенок וַיִּישַׁר.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: показалось правильным
  rationale: 'Форма от ישר в сочетании с בְּעֵינֵי выражает положительную оценку: решение сочли правильным. Перевод сохраняет оттенок восприятия, не утверждая отдельно его объективную правильность.'
- source_word: הַדָּבָר
  choice: это решение
  rationale: דבר имеет широкое значение «дело, вопрос, слово». В данном контексте речь идёт о принятом решении относительно времени празднования Пасхи; «это решение» ясно передаёт референт и естественно звучит по-русски.
- source_word: בְּעֵינֵי
  choice: царю
  rationale: Буквально «в глазах». Русский дательный естественно передаёт идиому оценки; буквальное «в глазах царя» здесь звучало бы менее современно.
- source_word: הַמֶּלֶךְ
  choice: царю
  rationale: Существительное с артиклем передано определённым обозначением «царь» в дательном падеже согласно русской конструкции.
- source_word: וּבְעֵינֵי
  choice: и всему собранию
  rationale: Повтор еврейской идиомы передан параллельным дательным дополнением; союз сохранён.
- source_word: כָּל
  choice: всему
  rationale: Передаёт полноту состава собрания.
- source_word: הַקָּהָל
  choice: собранию
  rationale: קהל обозначает собравшееся сообщество; «собрание» — ясный, современный и нейтральный вариант без излишне церковного оттенка.
