base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: ru
  text: И сыны Израиля, находившиеся в Иерусалиме, семь дней праздновали праздник Опресноков с великой радостью, и левиты и священники изо дня в день прославляли Яхве инструментами силы для Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «инструментами силы для Яхве». Значение выражения «инструменты силы» не вполне ясно; возможно: «мощными» или «громко звучащими инструментами».'
    reason: Еврейское выражение בִּכְלֵי עֹז необычно. Сноска поясняет буквальную форму и возможные контекстуальные понимания, не закрепляя одно из них в основном тексте.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... אֶת חַג הַמַּצּוֹת
  choice: праздновали праздник Опресноков
  rationale: Сочетание עשה с חַג означает совершать или отмечать праздник. «Праздновали» естественно передаёт идиому; «праздник Опресноков» — традиционно узнаваемое название.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально сохраняет еврейское выражение и его историко-библейский оттенок; в данном контексте обозначает израильтян, собравшихся в Иерусалиме.
- source_word: הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: находившиеся в Иерусалиме
  rationale: Причастие מצא в нифале буквально связано с «быть найденным», но здесь идиоматически обозначает присутствовавших или находившихся в городе.
- source_word: בְשִׂמְחָה גְדוֹלָה
  choice: с великой радостью
  rationale: Прямой, естественный и торжественный русский эквивалент.
- source_word: וּמְהַלְלִים
  choice: прославляли
  rationale: Причастие выражает продолжавшееся сопутствующее действие. Русская личная форма сохраняет этот смысл без синтаксической тяжеловесности.
- source_word: יוֹם בְּיוֹם
  choice: изо дня в день
  rationale: Передаёт распределительно-продолжительное значение еврейской идиомы.
- source_word: בִּכְלֵי עֹז
  choice: на мощно звучащих инструментах
  rationale: Буквально выражение означает «орудиями/инструментами силы». В контексте храмового прославления речь, вероятнее всего, о музыкальных инструментах и их сильном звучании; сноска сохраняет буквальную форму и альтернативу «громко звучащих».
- source_word: לַיהוָה
  choice: для Яхве
  rationale: После обозначения музыкальных инструментов לְ естественно понимать как указание адресата или цели исполнения; формулировка избегает неестественного русского «инструментами к Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. «Яхве» сохраняет личное имя Бога и наиболее вероятную научную реконструкцию его произношения.
- issue: Связь выражения בִּכְלֵי עֹז לַיהוָה
  choice: прославляли Яхве, играя для Яхве на мощно звучащих инструментах
  alternative: прославляли Яхве инструментами силы; мощно прославляли Яхве инструментами
  rationale: Синтаксис и значение редкого выражения допускают разные понимания. Основной текст даёт наиболее естественное контекстуальное прочтение, а сноска сохраняет буквальную образность и подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранено выражение «сыны Израиля», тогда как трудная инструментальная фраза передана естественно и снабжена сноской.
