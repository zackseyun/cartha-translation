  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: ru
  text: Они встали и удалили жертвенники, находившиеся в Иерусалиме; удалили также все места для воскурений[a] и бросили их в долину Кедрон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все жертвенники для воскурений» или «все подставки для благовоний». Еврейское слово обозначает культовые установки или приспособления, связанные с воскурением.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово может означать долину, овраг, русло сезонного потока или сам поток: «в поток Кедрон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Они встали
  rationale: Глагол קום в повествовательной форме вводит решительное действие; «встали» естественно и близко передаёт еврейскую конструкцию.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: убрали
  rationale: Каузативная форма от סור означает «удалить, убрать». «Убрали» звучит естественно по-русски и сохраняет единообразие двух употреблений.
- source_word: הַמִּזְבְּחוֹת
  choice: жертвенники
  rationale: Обычное значение множественного числа от מִזְבֵּחַ; контекст показывает, что речь идёт о культовых сооружениях в Иерусалиме.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: находившиеся в Иерусалиме
  rationale: Причастный оборот естественно передаёт определительное придаточное еврейского текста, не теряя указания на местонахождение.
- source_word: הַמְקַטְּרוֹת
  choice: курильницы
  rationale: Слово от корня קטר обозначает культовые приспособления или места для воскурения. «Курильницы» — краткий и понятный русский эквивалент, но более широкая возможность отражена в сноске.
- source_word: וַיַּשְׁלִיכוּ
  choice: бросили
  rationale: שׁלך означает «бросать, кидать»; «бросили» передаёт энергичный характер удаления и соответствует современному литературному русскому.
- source_word: לְנַחַל קִדְרוֹן
  choice: в долину Кедрон
  rationale: נחל может обозначать долину, русло сезонного потока или поток. «Долина Кедрон» географически понятно широкому читателю, а неоднозначность термина отмечена в сноске.
