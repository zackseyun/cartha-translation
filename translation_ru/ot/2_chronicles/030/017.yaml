  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: ru
  text: Ибо многие в собрании не освятили себя[a], и левиты отвечали за заклание пасхальных жертв[b] для всех, кто не был чист[c], чтобы посвятить их Яхве[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не посвятили себя». В еврейском тексте употреблена лексика освящения, хотя непосредственно речь идёт о ритуальной готовности и чистоте.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Пасхи», то есть пасхальные жертвенные животные.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для всех нечистых»; имеется в виду ритуальная нечистота.'
    reason: lexical_alternative
  - marker: d
    text: В еврейском тексте объект глагола не назван. Вероятнее всего, речь идёт о посвящении Яхве пасхальных жертв; возможно также понимание, относящее действие к участникам.
    reason: ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: многие в собрании
  rationale: Передаёт большое число людей внутри собравшейся общины; «собрание» естественно и сохраняет культовый контекст קָהָל.
- source_word: הִתְקַדָּשׁוּ
  choice: не освятили себя
  rationale: Сохраняет лексику святости корня קדשׁ и возвратное значение хитпаэля, не сводя выражение только к ритуальному очищению.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Устоявшееся русское наименование храмовой группы.
- source_word: עַל שְׁחִיטַת
  choice: совершали заклание
  rationale: В данном контексте עַל обозначает возложенную на левитов ответственность за ритуальный убой; выражение передано естественно по-русски как непосредственное исполнение поручения.
- source_word: הַפְּסָחִים
  choice: пасхальных жертв
  rationale: Форма множественного числа буквально означает «Пасхи», но здесь называет пасхальных жертвенных животных; «жертвы» не сужает референт исключительно до ягнят.
- source_word: לְכֹל לֹא טָהוֹר
  choice: для всех, кто не был чист
  rationale: Сохраняет отрицательную формулировку еврейского текста и культовое понятие чистоты без излишне технической экспликации в основном тексте.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: чтобы посвятить их Яхве
  rationale: Передаёт целевое значение инфинитива и лексику посвящения; местоимение «их» восполняет отсутствующий в еврейском тексте объект по ближайшему смысловому референту — пасхальным жертвам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Культовое значение קדשׁ на фоне ритуальной нечистоты
  choice: Сохранить лексику освящения и посвящения
  alternative: Передать первое выражение как «не очистились»
  rationale: Непосредственный вопрос связан с ритуальной чистотой, однако קדשׁ обозначает освящение или посвящение. Перевод сохраняет различие между святостью и чистотой.
- issue: Неуказанный объект инфинитива לְהַקְדִּישׁ
  choice: Отнести местоимение «их» к пасхальным жертвам
  alternative: Отнести действие к нечистым участникам
  rationale: 'В еврейском тексте прямой объект не выражен. Жертвенные животные являются естественным смысловым референтом: левиты закалывали их от имени тех, кто не мог сделать это сам. Сноска сохраняет синтаксическую неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Термины «освятили», «заклание», «пасхальные жертвы» сохраняют культовую специфику, оставаясь понятными из контекста.
