source:
  edition: WLC
  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: ru
  text: И закололи пасхальную жертву[a] в четырнадцатый день второго месяца. Священники и левиты устыдились, освятили себя и принесли всесожжения в дом Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пасху»; здесь имеется в виду пасхальное жертвенное животное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: закололи
  rationale: Глагол שׁחט обозначает заклание животного и здесь употреблён в жертвенном контексте; «закололи» точно и естественно передаёт ритуальное действие.
- source_word: הַפֶּסַח
  choice: пасхальную жертву
  rationale: В данном контексте слово обозначает не праздник вообще, а пасхальное жертвенное животное. Формулировка не сужает значение исключительно до ягнёнка, поскольку пасхальная жертва могла быть взята из мелкого скота.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: в четырнадцатый день второго месяца
  rationale: Естественная русская передача древнееврейского календарного выражения; слово «день» эксплицировано грамматически и по смыслу.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священники и левиты
  rationale: Устоявшиеся обозначения двух различных групп храмовых служителей.
- source_word: נִכְלְמוּ
  choice: устыдились
  rationale: Форма глагола כלם выражает переживание стыда или позора; «устыдились» непосредственно передаёт внутреннюю реакцию, за которой последовало исправление.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: освятили себя
  rationale: Возвратная форма קדשׁ обозначает ритуальное освящение или приготовление себя к священному служению. Выражение сохраняет культовый смысл без избыточного пояснения в основном тексте.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: принесли всесожжения
  rationale: עֹלוֹת — жертвы, целиком сжигаемые на жертвеннике; «всесожжения» является точным и принятым русским библейским термином.
- source_word: בֵּית יְהוָה
  choice: в дом Яхве
  rationale: Буквально «дом Яхве»; предлог передаёт направление движения, а личное имя Яхве сохраняет прямое употребление тетраграмматона в источнике.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон — личное имя Бога. «Яхве» передаёт наиболее широко принятую научную реконструкцию произношения, не заменяя имя титулом.
- issue: Значение וַיִּתְקַדְּשׁוּ
  choice: освятили себя
  alternative: очистились; посвятили себя
  rationale: Контекст указывает на ритуальную подготовку храмовых служителей. «Освятили себя» сохраняет как культовый смысл, так и богословскую лексику источника, не сводя действие лишь к очищению или внутреннему посвящению.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства храмового повествования. Использованы понятные традиционные термины «левиты» и «всесожжения»; синтаксис сделан плавным, без архаических союзных повторов, не необходимых в русском.
