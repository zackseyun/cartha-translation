- source_word: וַיִּוָּעֲצוּ
  choice: решило
  rationale: Форма от יעץ обозначает совместное совещание, приведшее к общему решению; «решило» естественно передаёт результат коллективного обсуждения.
- source_word: כָּל הַקָּהָל
  choice: всё собрание
