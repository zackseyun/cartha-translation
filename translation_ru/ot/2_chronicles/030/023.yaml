- source_word: לַעֲשׂוֹת
  choice: праздновать
  rationale: Буквально «делать», но в данном контексте глагол идиоматически означает соблюдение или празднование установленного праздника; прямое дополнение в еврейском тексте не выражено.
- source_word: שִׁבְעַת יָמִים אֲחֵרִים
  choice: ещё семь дней
  rationale: Естественно и точно обозначает дополнительный семидневный период.
- source_word: וַיַּעֲשׂוּ
  choice: они праздновали
  rationale: Повтор עשה сохранён смысловым повтором того же русского глагола; в праздничном контексте он означает «праздновать», а не буквально «делать».
- source_word: שִׂמְחָה
  choice: с радостью
  rationale: 'Передаёт обстоятельственное значение существительного: празднование проходило в радости.'
