base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: ru
  text: Не уподобляйтесь вашим отцам и братьям, которые были неверны Яхве, Богу своих отцов; Он превратил их в запустение[a], как вы видите.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал их ужасным зрелищем» или «предметом изумления»; еврейское слово может обозначать как запустение, так и ужасающее впечатление, которое оно производит.'
    reason: Лексема שַׁמָּה обозначает запустение и, в зависимости от контекста, объект ужаса или изумления; сноска сохраняет эти значения естественным русским языком.
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: Не будьте
  rationale: אַל с имперфектом выражает запрет; по-русски естественно передаётся формой «не будьте».
- source_word: כַאֲבוֹתֵיכֶם
  choice: подобны вашим отцам
  rationale: «Отцы» сохраняет семейно-историческую лексику и перекликается с последующим «своих отцов».
- source_word: וְכַאֲחֵיכֶם
  choice: и вашим братьям
  rationale: «Братья» сохраняет образ родства и солидарности; в контексте слово может обозначать также соплеменников.
- source_word: מָעֲלוּ בַּיהוָה
  choice: были неверны Яхве
  rationale: מעל обозначает нарушение верности, особенно в отношениях завета; русское «были неверны» ясно передаёт эту направленность.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Богу своих отцов
  rationale: Сохраняется формула, указывающая на Бога предков; возвратное «своих» естественно связывает отцов с подлежащим придаточного предложения.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: и Он предал их запустению
  rationale: נתן с לְשַׁמָּה выражает передачу или приведение в состояние опустошения; «предал их запустению» сохраняет действие Бога и результирующее состояние.
- source_word: כַאֲשֶׁר אַתֶּם רֹאִים
  choice: как вы сами видите
  rationale: Фраза указывает на очевидное для адресатов последствие; «сами» естественно подчёркивает явно выраженное местоимение אַתֶּם.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя «Яхве», что сохраняет его функцию в исходном тексте и соответствует заданному решению консультационного слоя.
- issue: Характер проступка מעל
  choice: были неверны Яхве
  alternative: поступили вероломно против Яхве; согрешили против Яхве
  rationale: Выбранная формулировка сохраняет смысл нарушения верности Богу, не сводя его к общему понятию греха и не усиливая без необходимости оттенок предательства.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся близким к еврейской последовательности, но звучит естественно; местоимение «Он» написано с прописной буквы для ясного указания на Бога.
