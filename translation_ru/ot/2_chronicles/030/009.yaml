base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: ru
  text: Если вы возвратитесь к Яхве[a], ваши братья и сыновья обретут милость у своих пленителей[b] и вернутся в эту землю. Ведь Яхве, ваш Бог, милостив и сострадателен; Он не отвернёт от вас Своего лица[c], если вы возвратитесь к Нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Яхве — личное имя Бога; в еврейском тексте: יהוה (ЙХВХ).'
    reason: divine_name
  - marker: b
    text: 'Буквально: «ваши братья и сыновья будут для милости перед своими пленителями».'
    reason: literal_rendering
  - marker: c
    text: 'Или: «не удалит от вас Своего лица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְשׁוּבְכֶם עַל יְהוָה
  choice: если вы возвратитесь к Яхве
  rationale: Глагол שׁוב передаёт возвращение к заветной верности Богу; «возвратитесь» также сохраняет повтор ключевого корня в конце стиха. По контексту оборот имеет условный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: ваших братьев и сыновей
  rationale: Сохранены конкретные формы мужского рода исходного текста без расширения до более общего «детей».
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: те, кто увёл в плен …, смилостивятся над ними
  rationale: Естественная русская передача конструкции, согласно которой пленённые станут объектами сострадания со стороны пленителей.
- source_word: שׁוֹבֵיהֶם
  choice: те, кто увёл в плен
  rationale: Причастная форма обозначает людей, захвативших и уведших их в плен; развёрнутая передача по-русски яснее слова «пленители».
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: и они возвратятся в эту землю
  rationale: Сохранён возвратный смысл שׁוב и не добавлена прямо не названная божественная или человеческая действующая сила.
- source_word: חַנּוּן וְרַחוּם
  choice: милостив и сострадателен
  rationale: 'Два определения различены: первое указывает на благоволение и милость, второе — на глубокое сострадание.'
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: не отвернёт от вас Своего лица
  rationale: Сохранён образ лица как выражение благосклонного присутствия и отношения.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: если вы возвратитесь к Нему
  rationale: Повтор «возвратитесь» воспроизводит риторическое повторение корня שׁוב в исходном тексте.
theological_decisions:
- issue: Смысл שׁוב как покаянного возвращения
  choice: возвратитесь к Яхве / возвратитесь к Нему
  alternative: обратитесь к Яхве / обратитесь к Нему
  rationale: «Возвратитесь» сохраняет мотив восстановления прежних отношений завета и повтор одного еврейского корня, не вводя дополнительной богословской терминологии.
- issue: Условность первого оборота
  choice: если вы возвратитесь
  alternative: когда вы возвратитесь
  rationale: Контекст увещевания представляет последующую милость как результат возвращения; «если» ясно выражает эту связь, хотя сама предложная конструкция допускает и временную передачу.
- issue: Родственные обозначения
  choice: братьев и сыновей
  alternative: братьев и детей
  rationale: Основной текст сохраняет формы мужского рода אֲחֵיכֶם וּבְנֵיכֶם и не расширяет их референцию без прямого основания.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Синтаксис первой половины слегка перестроен ради ясности: пленители сделаны грамматическим субъектом, однако участники и смысл исходной конструкции сохранены. Заглавные местоимения при указании на Бога использованы последовательно в рамках принятого русского библейского регистра.'
