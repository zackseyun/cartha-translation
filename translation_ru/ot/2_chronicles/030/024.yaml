base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: ru
  text: Ведь Езекия, царь Иудеи, предоставил для собрания[a] тысячу быков и семь тысяч голов мелкого скота[b], а сановники предоставили для собрания тысячу быков и десять тысяч голов мелкого скота; и многие священники освятились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «собранию»; еврейский предлог в этом контексте может указывать как на получателя, так и на тех, для кого предназначались животные.'
    reason: lexical_alternative
  - marker: b
    text: Буквально — собирательное обозначение мелкого стадного скота, то есть овец и коз.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к предшествующему рассказу; «ведь» естественно передаёт пояснительно-причинную связь, не делая её чрезмерно жёсткой.
- source_word: הֵרִים / הֵרִימוּ
  choice: предоставил / предоставили
  rationale: В породе hифиль глагол здесь означает внесение или предоставление животных для общего богослужения, а не буквальное «поднятие». Русское «предоставили» сохраняет широту значения и не уточняет без необходимости вид ритуального дара.
- source_word: לַקָּהָל
  choice: для собрания
  rationale: קהל обозначает собравшуюся общину. Предлог ל допускает значение адресата или назначения; в контексте животных для общего празднования естественно «для собрания».
- source_word: אֶלֶף פָּרִים
  choice: тысячу быков
  rationale: פָּרִים обозначает крупный рогатый скот мужского пола, используемый для жертвоприношений; «быки» — прямой и понятный эквивалент.
- source_word: צֹאן
  choice: голов мелкого скота
  rationale: צֹאן — собирательное обозначение стадных мелких животных, включающее овец и коз. Перевод сохраняет эту широту и подходит для счёта животных по головам.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: שׂרים — высокопоставленные руководители или должностные лица. «Сановники» ясно передаёт их высокий общественно-политический статус, не называя их наследственными князьями.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: и освятилось множество священников
  rationale: Возвратная форма קדשׁ означает, что священники ритуально приготовили и отделили себя для служения. «Освятились» сохраняет возвратность и культовый смысл.
- source_word: לָרֹב
  choice: множество
  rationale: Выражение подчёркивает большое число священников; русская конструкция «освятилось множество» передаёт это кратко и естественно.
theological_decisions:
- issue: Характер освящения священников
  choice: освятились
  alternative: очистились
  rationale: Исходный קדשׁ прямо выражает освящение или отделение для святого служения. В контексте оно могло включать ритуальное очищение, но перевод «очистились» неоправданно сузил бы значение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность исходного стиха, но остаётся понятным; архаизмы и конфессионально окрашенные уточнения не используются.
