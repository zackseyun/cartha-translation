  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: ru
  text: И собралось в Иерусалиме множество людей, чтобы праздновать Праздник опресноков во втором месяце, — чрезвычайно многочисленное собрание.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: собралось
  rationale: Нифаль от אסף обозначает собирание людей вместе; русское «собралось» естественно передаёт событие и согласуется с собирательным «множество».
- source_word: יְרוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Устоявшаяся русская форма названия с предлогом, соответствующим обстоятельству места.
- source_word: עַם רָב
  choice: множество народа
  rationale: Передаёт количественный акцент выражения «многочисленный народ», сохраняя достоинство стиля и не сужая значение до случайной толпы.
- source_word: לַעֲשׂוֹת
  choice: чтобы праздновать
  rationale: Буквально «делать/совершать»; при названии праздника это идиома его соблюдения или празднования. «Праздновать» наиболее естественно в современном русском.
- source_word: חַג הַמַּצּוֹת
  choice: Праздник опресноков
  rationale: Устоявшееся русское библейское название; חַג обозначает религиозный, в данном случае паломнический, праздник, а מַצּוֹת — пресные хлебы.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: во втором месяце
  rationale: Прямая передача хронологически значимого обстоятельства времени.
- source_word: קָהָל
  choice: собрание
  rationale: Нейтрально передаёт собравшуюся общину и не вносит более поздних церковных оттенков слова «конгрегация».
- source_word: לָרֹב מְאֹד
  choice: чрезвычайно многочисленное
  rationale: Передаёт усиленную характеристику численности собрания естественным русским выражением.
theological_decisions: []
