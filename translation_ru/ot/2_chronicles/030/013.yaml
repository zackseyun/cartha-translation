  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён повтор мысли оригинала: сначала «множество народа», затем итоговое усиление «чрезвычайно многочисленное собрание». Тире показывает пояснительное приложение, не устраняя синтаксическую шероховатость и эмфазу еврейского текста.'
