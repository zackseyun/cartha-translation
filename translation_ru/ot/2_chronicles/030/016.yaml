  text: וַ/יַּֽעַמְד֤וּ עַל עָמְדָ/ם֙ כְּ/מִשְׁפָּטָ֔/ם כְּ/תוֹרַ֖ת מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֑ים הַ/כֹּֽהֲנִים֙ זֹרְקִ֣ים אֶת הַ/דָּ֔ם מִ/יַּ֖ד הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: ru
  text: И они заняли свои места, как им было предписано, согласно Закону Моисея, человека Божьего. Священники кропили кровью, принимая её из рук левитов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Священники кропили кровью из руки левитов».'
    reason: Указана буквальная форма эллиптического еврейского выражения מִיַּד הַלְוִיִּם, которое в основном тексте передано естественнее по-русски.
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל־עָמְדָם
  choice: И они заняли свои места
  rationale: Сочетание глагола עמד с עַל עָמְדָם обозначает, что участники встали на отведённые им места; «заняли свои места» естественно передаёт ритуально-позиционный смысл.
- source_word: כְּמִשְׁפָּטָם
  choice: как им было предписано
  rationale: В храмовом контексте מִשְׁפָּט указывает не просто на обычай, а на установленный порядок служения. Формулировка сохраняет нормативный оттенок без тяжеловесного «согласно их установлению».
- source_word: כְּתוֹרַת מֹשֶׁה אִישׁ־הָאֱלֹהִים
  choice: согласно Закону Моисея, человека Божьего
  rationale: «Закон Моисея» — ясное и традиционно узнаваемое соответствие תּוֹרַת מֹשֶׁה; «человек Божий» сохраняет библейский титул.
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת־הַדָּם
  choice: Священники кропили кровью
  rationale: В жертвенном контексте זרק обозначает ритуальное нанесение крови на жертвенник. Русское «кропили кровью» передаёт культовое действие естественнее, чем буквальное «бросали кровь».
- source_word: מִיַּד הַלְוִיִּם
  choice: принимая её из рук левитов
  rationale: 'Буквально: «из руки левитов». Деепричастие проясняет подразумеваемую передачу крови священникам, а множественное «из рук» естественно по-русски при множественном субъекте.'
theological_decisions:
- issue: Обозначение установленного порядка служения
  choice: как им было предписано
  alternative: по своему обычаю
  rationale: Контекст Закона Моисея и храмового ритуала поддерживает смысл предписанного порядка, а не лишь сложившегося обычая.
- issue: Ритуальное применение крови
  choice: кропили кровью
  alternative: бросали кровь
  rationale: Выбор отражает жертвенное употребление זרק и не добавляет к тексту последующего богословского толкования.
- issue: Эллиптическое выражение «из руки левитов»
  choice: принимая её из рук левитов
  alternative: из рук левитов
  rationale: Глагол «принимая» эксплицирует очевидную в контексте передачу, но буквальная структура и возможная сжатость оригинала отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для широкого читателя; культовые термины сохранены без архаической перегруженности.
