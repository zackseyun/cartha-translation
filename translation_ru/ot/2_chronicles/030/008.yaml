  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: ru
  text: Теперь не упрямьтесь, как ваши отцы. Дайте руку Господу[a], придите в Его святилище, которое Он освятил навеки, и служите Господу, вашему Богу, чтобы Его пылающий гнев отвратился от вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покоритесь Господу» или «обяжитесь быть Ему верными». Буквально: «дайте руку Господу»; это идиома подчинения или обязательства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Его пылающий гнев отвратится от вас».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: В еврейском тексте явно присутствует временно-дискурсивное слово עַתָּה. «Теперь» естественно передаёт переход к непосредственному призыву.
- source_word: אַל תַּקְשׁוּ עָרְפְּכֶם
  choice: не упрямьтесь
  rationale: Буквально выражение говорит «не делайте жёсткой свою шею» и обозначает упорное сопротивление. Русское «не упрямьтесь» ясно и современно передаёт смысл, не прибегая к архаичному «не будьте жестоковыйны».
- source_word: כַּאֲבוֹתֵיכֶם
  choice: как ваши отцы
  rationale: «Отцы» непосредственно передаёт אָבוֹת и в данном историко-родовом контексте означает прежние поколения.
- source_word: תְּנוּ יָד לַיהוָה
  choice: Покоритесь Господу
  rationale: 'Буквально: «дайте руку Господу». В контексте это идиома покорности или обязательства верности. Русское «протяните руку» могло бы ошибочно восприниматься как просьба о помощи, поэтому смысл дан в основном тексте, а образ сохранён в сноске.'
- source_word: מִקְדָּשׁוֹ
  choice: Его святилище
  rationale: «Святилище» передаёт культовое значение מִקְדָּשׁ, не сводя слово только к зданию храма.
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: Он освятил навеки
  rationale: «Освятил» передаёт отделение места как святого, а «навеки» — прямое значение לְעוֹלָם в данном контексте.
- source_word: וְעִבְדוּ
  choice: служите
  rationale: Глагол עבד применительно к Богу включает поклонение и верное служение; «служите» сохраняет эту смысловую широту.
- source_word: וְיָשֹׁב מִכֶּם חֲרוֹן אַפּוֹ
  choice: чтобы Его пылающий гнев отвратился от вас
  rationale: Форма следует за рядом повелений и естественно выражает предполагаемый или желаемый результат. «Пылающий гнев» сохраняет образ жара в еврейской идиоме.
theological_decisions:
- issue: Значение идиомы תְּנוּ יָד לַיהוָה
  choice: Покоритесь Господу
  alternative: 'Буквально: «дайте руку Господу»; возможно также «предайте себя Господу» или «обяжитесь быть верными Господу»'
  rationale: Идиома, вероятно, обозначает покорность и признание власти, возможно с оттенком обещания верности. Перевод не сужает её до отдельной конфессиональной практики.
- issue: Сила формы וְיָשֹׁב после повелений
  choice: чтобы Его пылающий гнев отвратился от вас
  alternative: «и Его пылающий гнев отвратится от вас»
  rationale: Целевая конструкция сохраняет оттенок ожидаемого результата призыва, не превращая фразу в безусловную механическую гарантию.
- issue: Утверждение о вечном освящении святилища
  choice: которое Он освятил навеки
  alternative: «которое Он навсегда отделил как святое»
  rationale: Формулировка прямо сохраняет напряжение текста и не пытается заранее согласовать «навеки» с последующей историей храма.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Избегается архаичное «жестоковыйны»; местоимения, относящиеся к Богу, пишутся с прописной буквы. Имя יהוה передано традиционным русским «Господь».
