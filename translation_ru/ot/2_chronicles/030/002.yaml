  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: ru
  text: И царь, и его приближённые, и всё собрание в Иерусалиме, посоветовавшись, решили совершить Пасху во втором месяце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: посоветовавшись, решили
  rationale: Форма нифаль от יעץ выражает совместное совещание, приведшее к решению. Такое сочетание естественно по-русски и передаёт как процесс обсуждения, так и его результат; множественность участников раскрыта последующими однородными подлежащими.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Прямое соответствие определённому существительному; хотя из контекста известен Езекия, в самом стихе употреблён титул.
- source_word: וְשָׂרָיו
  choice: и его приближённые
  rationale: שָׂרִים здесь обозначает высокопоставленных людей при царе. «Приближённые» естественно для повествования о царском совете и не создаёт ложного впечатления, будто речь обязательно идёт о царских сыновьях.
- source_word: וְכָל הַקָּהָל
  choice: и всё собрание
  rationale: קָהָל обозначает собравшееся сообщество. «Собрание» сохраняет корпоративный смысл и не привносит более поздних конфессиональных оттенков.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Стандартная передача обстоятельства места и топонима.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: совершить Пасху
  rationale: Буквально «сделать Пасху» — устойчивое обозначение исполнения пасхального обряда. «Совершить Пасху» звучит естественно и достойно в современном русском языке, сохраняя обрядовый смысл без пояснительной вставки.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: во втором месяце
  rationale: Прямая передача временного оборота. Значимость необычного срока раскрывается контекстом и не требует добавления в текст стиха.
theological_decisions:
- issue: Передача идиомы о соблюдении Пасхи без внесения толкования
  choice: совершить Пасху
  alternative: отпраздновать Пасху; соблюсти Пасху; совершить пасхальный обряд
  rationale: Еврейская идиома обозначает исполнение пасхального установления. Выбранная формулировка сохраняет культово-обрядовый смысл и не сводит действие лишь к празднованию или эмоциональному торжеству.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «посоветовавшись, решили» проясняет совместный характер решения, не устраняя смыслового компонента совета в еврейском глаголе.
