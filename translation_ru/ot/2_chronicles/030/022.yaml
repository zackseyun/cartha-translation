- from: Езекия ободрял всех левитов[a], которые проявляли доброе разумение в служении Яхве[b]. Они семь дней вкушали праздничную трапезу[c], приносили мирные жертвы[d] и благодарили Яхве[e], Бога своих отцов.
  to: Езекия ободрял всех левитов[a], хорошо понимавших служение Яхве[b]. Семь дней они ели праздничную пищу[c], приносили мирные жертвы[d] и возносили благодарение Яхве[e], Богу своих отцов.
