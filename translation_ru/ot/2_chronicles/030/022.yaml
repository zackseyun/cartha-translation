base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: ru
  text: Езекия ободрял всех левитов[a], хорошо понимавших служение Яхве[b]. Семь дней они ели праздничную пищу[c], приносили мирные жертвы[d] и возносили благодарение Яхве[e], Богу своих отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил к сердцу всех левитов».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «обладавших хорошим пониманием в отношении Яхве» или «искусных в том, что относится к Яхве».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ели праздник». Речь идёт о вкушении пищи во время установленного праздника.'
    reason: translation_clarity
  - marker: d
    text: 'Или: «жертвы общения», «жертвы благополучия». Еврейское выражение обозначает особую категорию жертв.'
    reason: lexical_alternative
  - marker: e
    text: Этот глагол может также означать «исповедовали» или «прославляли»; здесь контекст, вероятно, указывает на благодарение в богослужении.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: ободрял
  rationale: Еврейская идиома буквально означает «говорил к сердцу» и обозначает речь, которая поддерживает, утешает или ободряет. Русское «ободрял» естественно передаёт её смысл.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Общепринятое русское обозначение левитов сохранено без поясняющей перифразы.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב
  choice: которые проявляли доброе разумение
  rationale: Сочетание причастия от שׂכל с однокоренным существительным подчёркивает проявляемые разумение, рассудительность или умелость; активная формулировка не превращает его в простое обозначение состояния.
- source_word: לַיהוָה
  choice: в служении Яхве
  rationale: Предлог ל выражает отношение или направленность. В контексте служения левитов вероятен смысл разумного и умелого служения Яхве, однако буквальная конструкция шире, поэтому неоднозначность отмечена в сноске.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד
  choice: вкушали праздничную трапезу
  rationale: Буквальное «ели праздник» неестественно по-русски. Формулировка сохраняет значение глагола «есть» и передаёт праздник как праздничную трапезу, не подменяя конструкцию простым «праздновали».
- source_word: שִׁבְעַת הַיָּמִים
  choice: семь дней
  rationale: Естественное русское обозначение продолжительности.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: приносили мирные жертвы
  rationale: «Мирные жертвы» — узнаваемый традиционный термин для данной категории жертв, связанной с миром, благополучием и общением.
- source_word: וּמִתְוַדִּים
  choice: благодарили
  rationale: Возвратная порода глагола ידה может означать исповедание, благодарение или хвалу. В празднично-богослужебном контексте вероятнее положительный смысл благодарения, при сохранении альтернатив в сноске.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Сохранена традиционная заветная формула и мужской род исходного обозначения предков.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон — личное заветное имя Бога. Форма «Яхве» сохраняет имя и соответствует принятой для проекта передаче.
- issue: Значение וּמִתְוַדִּים в богослужебном контексте
  choice: благодарили
  alternative: исповедовались; прославляли
  rationale: Контекст праздника и жертв поддерживает значение благодарения, но семантическая широта глагола не позволяет исключить оттенок исповедания или хвалы; это отражено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан доступным для обычного читателя; традиционные культовые термины сохранены там, где они узнаваемы. Подлинные лексические неоднозначности вынесены в сноски.
