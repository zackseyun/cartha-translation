  terminology: '«Левиты», «Яхве», «мирные жертвы» и формула «Бог своих отцов» уместны и сохраняют библейский регистр. Для וּמִתְוַדִּים лучше «возносили благодарение»: это естественная богослужебная формулировка, при сохранении в сноске возможных оттенков исповедания и хвалы.'
