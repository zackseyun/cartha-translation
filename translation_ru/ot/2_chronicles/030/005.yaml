revisions:
- from: И они постановили разослать весть по всему Израилю, от Вирсавии до Дана, чтобы люди пришли в Иерусалим отпраздновать Пасху в честь Яхве, Бога Израиля, — ведь не многие совершали её так, как предписано.[a]
  to: Они постановили провозгласить по всему Израилю — от Вирсавии до Дана, — чтобы пришли в Иерусалим праздновать Пасху в честь Яхве, Бога Израиля, ибо Пасху соблюдали не в большом числе, как предписано.[a]
  rationale: Правка сохраняет официальный характер решения и публичного объявления, устраняет ненужное добавление «люди» и более осторожно передаёт спорную заключительную фразу. Количественное значение לָרֹב остаётся в основном тексте, а допустимая неоднозначность его связи с כַּכָּתוּב явно отмечена в сноске.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:44:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Начальные члены переданы в целом верно: официальное решение, всенародное объявление, географический охват и призыв прийти в Иерусалим сохранены. Однако «не многие совершали её так, как предписано» чрезмерно закрепляет один синтаксический разбор заключительной сжатой фразы. לָרֹב естественно может относиться к многочисленности/широте совершения, а כַּכָּתוּב — к соответствию предписанию; это следует оставить прозрачным и не превращать в утверждение именно о «немногих» как субъекте.'
  naturalness: «Провозгласить по всему Израилю» точнее и естественнее в контексте публичного распоряжения, чем «разослать весть». Формулировка «соблюдали не в большом числе» современна, понятна и не добавляет отсутствующее в еврейском тексте слово «люди».
  terminology: «Пасха», «Яхве», «Бог Израиля», «Иерусалим», «Вирсавия» и «Дан» уместны. «В честь Яхве» приемлемо как естественная русская передача направленности לַיהוָה. «Соблюдать Пасху» точнее отражает ритуально-праздничное действие, чем повторное «совершать».
  issues:
  - severity: medium
    issue: Заключительная фраза слишком однозначно истолкована
    rationale: «Не многие совершали её так, как предписано» делает «немногие» явно выраженным субъектом и связывает «так» непосредственно с предписанием. Еврейское כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב сжато; безопаснее передать количественный компонент как обстоятельство («не в большом числе») и пояснить варианты в сноске.
  - severity: low
    issue: «Разослать весть» слегка сужает способ объявления
    rationale: לְהַעֲבִיר קוֹל обозначает распространить публичное объявление по стране; «провозгласить» лучше передаёт его официальный публичный характер.
  - severity: low
    issue: Текст сноски неточно формулирует второй вариант
    rationale: «Не соблюдали повсеместно установленным образом» вносит идею повсеместности, которой данная фраза прямо не выражает. Сноска должна описывать реальную неопределённость связи количественного выражения и соблюдения письменного предписания.
