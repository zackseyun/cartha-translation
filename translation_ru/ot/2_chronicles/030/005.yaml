  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: ru
  text: Они постановили провозгласить по всему Израилю — от Вирсавии до Дана, — чтобы пришли в Иерусалим праздновать Пасху в честь Яхве, Бога Израиля, ибо Пасху соблюдали не в большом числе, как предписано.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза сжата. Буквально: «ибо не во множестве совершали, как написано». Она может указывать на малое число участников либо подчёркивать, что Пасху не соблюдали в соответствии с письменным предписанием.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: они постановили
  rationale: Идиома буквально означает «утвердили дело/слово» и в контексте обозначает официально принятое решение. «Постановили» естественно и кратко передаёт этот административный смысл.
- source_word: לְהַעֲבִיר קוֹל
  choice: разослать весть
  rationale: 'Буквально: «провести голос/возглас»; здесь имеется в виду распространение публичного объявления. «Разослать весть» сохраняет идею широкого оповещения и звучит естественно по-русски.'
- source_word: בְּכָל יִשְׂרָאֵל
  choice: по всему Израилю
  rationale: Предлог и контекст указывают на распространение вести по всей стране, а не просто на её местонахождение.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: от Вирсавии до Дана
  rationale: Сохранена традиционная географическая формула, охватывающая страну с юга до севера; топоним Беэр-Шева передан привычной русской библейской формой «Вирсавия».
- source_word: לָבוֹא
  choice: чтобы люди пришли
  rationale: Инфинитив выражает содержание и цель объявления. Слово «люди» естественно обозначает адресатов всенародного призыва, не добавляя требования, будто пришёл буквально каждый.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: отпраздновать Пасху
  rationale: Буквально «совершить/сделать Пасху». В современном русском «отпраздновать Пасху» ясно передаёт соблюдение установленного праздника и звучит естественнее буквального оборота.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог обозначает направленность празднования Богу. Оборот «в честь» естественно выражает посвящённость Пасхи Яхве, не превращая её лишь в человеческое торжество.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямой и естественный перевод сопряжённой конструкции.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалим
  rationale: При глаголе движения русский винительный падеж ясно обозначает Иерусалим как место назначения; дальнейший инфинитив выражает цель прихода.
- source_word: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב
  choice: ведь не многие совершали её так, как предписано
  rationale: 'Сжатая еврейская фраза связывает количественное לָרֹב с соблюдением записанного предписания. Основной текст передаёт наиболее вероятный смысл: установленным образом Пасху соблюдало немного людей, не вводя лексически сомнительное значение «давно».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблено собственное заветное имя יהוה. Транслитерация «Яхве» сохраняет различие между этим именем и титулом «Господь».
- issue: Характер Пасхи как празднования, посвящённого Богу
  choice: отпраздновать Пасху в честь Яхве
  alternative: совершить Пасху Яхве; отпраздновать Пасху для Яхве
  rationale: Выбранный оборот сохраняет направленность действия Яхве и при этом не уточняет сверх текста жертвенный или иной отдельный аспект обряда.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Административные выражения переданы ясно, без архаической тяжеловесности. Топонимы даны в привычных русских библейских формах; подлинная неоднозначность заключительной фразы сохранена в примечании.
