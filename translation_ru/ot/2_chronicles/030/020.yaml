  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: ru
  text: И Яхве внял Езекии и исцелил народ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышал Езекию». В таком сочетании еврейский глагол может означать как «услышать», так и «выслушать и благосклонно откликнуться».'
    reason: lexical_alternative
  - marker: b
    text: «Исцелил» может означать, что Яхве устранил бедствие или наказание, связанное с ненадлежащим обрядовым состоянием народа, а не обязательно только физическую болезнь.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: внял
  rationale: Глагол שׁמע с אֶל здесь означает не просто услышать, а благосклонно выслушать и откликнуться на молитву Езекии. «Внял» кратко и естественно передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом.
- source_word: יְחִזְקִיָּהוּ
  choice: Езекии
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: וַיִּרְפָּא
  choice: исцелил
  rationale: Глагол רפא обычно означает «исцелять». Выбор сохраняет образ исходного текста и не сводит его заранее только к прощению, избавлению от суда или физическому выздоровлению.
- source_word: הָעָם
  choice: народ
  rationale: В контексте עַם обозначает собравшийся народ Израиля; «народ» является кратким и естественным русским соответствием.
theological_decisions:
- issue: Характер исцеления народа
  choice: Сохранить формулировку «исцелил народ», не ограничивая её физическим выздоровлением.
  alternative: «простил народ», «пощадил народ» или «восстановил народ»
  rationale: Контекст говорит о вкушавших Пасху без должного очищения и о молитве Езекии за них, однако сам еврейский текст употребляет רפא («исцелять»). Буквенный образ сохраняет смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Внял» несколько возвышенно, но общеупотребительно и точно передаёт благосклонный ответ на молитву; синтаксис краток и соответствует лаконичности еврейского текста.
