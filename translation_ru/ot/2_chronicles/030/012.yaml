base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: ru
  text: И в Иудее рука Бога была над ними, чтобы дать им одно сердце[a], чтобы они исполнили повеление царя и начальников по слову Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «единое сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: И в Иудее
  rationale: Передаёт добавочное значение גַּם и естественное локативное значение בִּיהוּדָה в современном русском.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: рука Бога действовала
  rationale: Сохраняет древнееврейский образ «руки Бога», но по-русски ясно выражает активное Божье воздействие; отсутствующее в масоретском тексте дополнение «на них» не вводится.
- source_word: לָתֵת לָהֶם
  choice: чтобы дать им
  rationale: Передаёт инфинитив цели и прямо связывает единство народа с Божьим действием.
- source_word: לֵב אֶחָד
  choice: одно сердце
  rationale: Сохраняет буквальный образ и его смысл — общую внутреннюю решимость; поясняющий вариант вынесен в сноску.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: исполнить повеление
  rationale: Естественно передаёт осуществление данного распоряжения; «повеление» уместно и для царского, и для обусловленного словом Яхве контекста.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: царя и начальников
  rationale: «Начальники» понятно и достаточно широко передаёт שָׂרִים как представителей власти, не ограничивая их современным бюрократическим статусом.
- source_word: בִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняет возможный оттенок основания, соответствия или посредства слова Яхве, не делая связь излишне однозначной.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Характер Божьего действия, выраженного образом «руки Бога»
  choice: Передать как активное Божье действие, дарующее народу единую решимость.
  alternative: Ослабить до «Бог помог им» либо усилить до утверждения о непреодолимом принуждении.
  rationale: Текст прямо приписывает единство Божьему воздействию, но не раскрывает его механизм и не устраняет напряжение между Божьим действием и человеческим исполнением.
- issue: Связь царского повеления со словом Яхве
  choice: Сохранить сжатую формулировку «по слову Яхве».
  alternative: Развернуть как «в соответствии со словом Яхве» или «данное через слово Яхве».
  rationale: Предлог בְּ допускает оттенки соответствия, основания или средства; краткая русская формулировка сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены ключевые образы «рука Бога» и «одно сердце»; синтаксис сделан понятным без конфессиональных уточнений.
