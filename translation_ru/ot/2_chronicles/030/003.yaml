lexical_decisions:
- source_word: יָכְלוּ
  choice: могли
  rationale: Глагол выражает способность или возможность; сочетание «не могли» естественно передаёт эту мысль по-русски.
- source_word: לַעֲשֹׂתוֹ
  choice: совершить её
  rationale: Местоимение отсылает к Пасхе в предшествующем контексте. «Совершить» сохраняет общее значение עשׂה и уместно для праздничного обряда, не сужая его до одного отдельного действия.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Фраза указывает на установленное ранее время празднования; буквальное и естественное русское соответствие не требует добавления слова «назначенное».
- source_word: הִתְקַדְּשׁוּ
  choice: освятили себя
  rationale: В данном культовом контексте форма породы hitpael обозначает ритуальную подготовку священников. «Освятили себя» сохраняет религиозный смысл и возвратность еврейской формы.
- source_word: לְמַדַּי
  choice: в достаточной мере
  rationale: Наречное выражение означает достаточность степени или количества. Основной вариант близко воспроизводит компактность оригинала, а возможное числовое понимание отмечено в сноске.
- source_word: נֶאֶסְפוּ
  choice: собрался
  rationale: Форма niphal здесь естественно описывает собирание народа как единого целого; русское единственное число согласуется с собирательным существительным «народ».
- source_word: לִירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: 'Хотя предлог לְ обычно выражает направление, при глаголе собирания по-русски естественнее назвать место состоявшегося собрания: «собраться в Иерусалиме».'
theological_decisions:
- issue: Значение לְמַדַּי применительно к священникам
  choice: священники не освятили себя в достаточной мере
  alternative: освятилось недостаточное число священников
  rationale: Еврейская фраза допускает понимание достаточности как степени подготовки либо как количества подготовившихся священников. Основной текст следует ближайшей наречной связи, а сноска сохраняет числовую возможность, не разрешая неоднозначность догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «ведь» передаёт объяснительное כִּי; добавленное «ещё» естественно для контекста незавершённой подготовки и не устраняет смысловой неоднозначности. Синтаксис сохранён близким к еврейскому, но направление לְ при глаголе собирания передано идиоматическим русским обозначением места.
