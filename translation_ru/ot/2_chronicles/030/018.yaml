source:
  edition: WLC
  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: ru
  text: 'Ведь очень многие из народа — многие из Ефрема, Манассии, Иссахара и Завулона — не очистились, но всё же ели пасху не так, как написано[a]. Однако Езекия помолился за них: «Пусть благой Яхве совершит искупление за…[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не согласно написанному».'
    reason: lexical_alternative
  - marker: b
    text: Молитва продолжается в стихе 19; еврейское предложение в конце этого стиха намеренно остаётся незавершённым.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: очень многие из народа — многие
  rationale: Передаёт и значение большой части народа, и повторное усиление רַבַּת, не превращая его без достаточных оснований в абсолютное большинство.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: из Ефрема, Манассии, Иссахара и Завулона
  rationale: Названия колен переданы в принятых русских формах; перечисление оформлено естественно для современного русского языка.
- source_word: לֹא הִטֶּהָרוּ
  choice: не очистились
  rationale: Возвратная форма сохраняет значение совершения требуемого обрядового очищения, понятное из контекста Пасхи.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: ели пасху
  rationale: Сохранена ёмкость слова פֶּסַח, которое здесь может указывать на пасхальную жертву или трапезу; слова «агнец» в еврейском тексте нет.
- source_word: בְּלֹא כַכָּתוּב
  choice: не так, как написано
  rationale: Близко передаёт прямую отсылку к письменному предписанию, не уточняя сверх текста, о каком именно установлении идёт речь.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: помолился за них
  rationale: Прямо и естественно передаёт молитву Езекии за тех, кто не очистился.
- source_word: יְהוָה הַטּוֹב
  choice: благой Яхве
  rationale: Сохраняет личное имя יְהוָה и субстантивно-определительное значение הַטּוֹב без добавления отсутствующего в тексте слова «Бог».
- source_word: יְכַפֵּר
  choice: совершит искупление
  rationale: Сохраняет культовую лексику корня כפר в контексте Пасхи и ритуального очищения; перевод «простит» был бы более узким толкованием.
- source_word: בְּעַד־
  choice: за…
  rationale: Предлог в конце стиха оставлен без названного объекта, как в еврейском тексте; многоточие показывает, что объект и молитва продолжаются в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное covenantное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Значение יְכַפֵּר
  choice: совершит искупление
  alternative: простит
  rationale: Пасхальный и очистительный контекст поддерживает культовый смысл; более общее «простит» сгладило бы образ искупления.
- issue: Незавершённый объект при בְּעַד־
  choice: не восполнять объект в стихе 18
  alternative: за них
  rationale: Еврейский стих оканчивается предлогом с маккефом, а объект появляется в стихе 19. Восполнение «за них» сделало бы синтаксис завершённым вопреки форме источника и могло бы сузить последующее определение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Конструкция с тире сохраняет еврейское повторное указание на многочисленность, а многоточие перед сноской подчёркивает переход молитвы в следующий стих.
