  text: וַ/יָּקֻ֜מוּ הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ וַ/יְבָרֲכ֣וּ אֶת הָ/עָ֔ם וַ/יִּשָּׁמַ֖ע בְּ/קוֹלָ֑/ם וַ/תָּב֧וֹא תְפִלָּתָ֛/ם לִ/מְע֥וֹן קָדְשׁ֖/וֹ לַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: ru
  text: Тогда священники, левиты[a], встали и благословили народ. Их голос был услышан[b], и их молитва достигла его святой обители — небес[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священники-левиты». Еврейское сочетание, вероятно, поясняет, что названные священники были левитами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к их голосу прислушались»; пассивная форма подразумевает, что их услышал Бог.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «в его святую обитель, на небеса». Еврейское слово, обозначающее небо, имеет форму множественного числа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: встали
  rationale: Глагол קום здесь обозначает вставание; «встали» естественно передаёт конкретное действие перед благословением.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священники, левиты
  rationale: 'Сочетание передано как приложение: второе существительное уточняет, что священники принадлежат к левитам, не вводя две отдельные группы.'
- source_word: וַיְבָרֲכוּ אֶת־הָעָם
  choice: благословили народ
  rationale: Стандартно и кратко передаёт произнесение благословения над собравшимся народом.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: их голос был услышан
  rationale: Сохраняет пассивную форму еврейского текста и не добавляет прямо не названного деятеля, хотя контекст подразумевает Бога.
- source_word: תְפִלָּתָם
  choice: их молитва
  rationale: Единственное число с местоименным суффиксом естественно передаётся как общая молитва священников.
- source_word: לִמְעוֹן קָדְשׁוֹ לַשָּׁמָיִם
  choice: достигла его святой обители — небес
  rationale: Передаёт оба обозначения цели движения; тире показывает, что «небеса» поясняют местонахождение святой обители.
theological_decisions:
- issue: Следует ли прямо назвать Бога тем, кто услышал голос
  choice: Сохранить пассивное выражение «их голос был услышан».
  alternative: «Бог услышал их голос» или «Господь услышал их голос».
  rationale: В еврейском предложении Бог подразумевается контекстом, но прямо не назван; пассив сохраняет формулировку и её богословскую сдержанность.
- issue: Соотношение слов «священники» и «левиты»
  choice: 'Передать их как приложение: «священники, левиты».'
  alternative: «священники-левиты» или «священники и левиты».
  rationale: Аппозиционное прочтение наиболее вероятно в языке Паралипоменон и не создаёт впечатления двух отдельных групп, оставаясь при этом видимым для читателя.
- issue: Соотношение святой обители и небес
  choice: Передать «небеса» как пояснение к «святой обители».
  alternative: «в его святую обитель, на небеса» или «в его святую обитель на небесах».
  rationale: Еврейский текст называет одну и ту же цель двумя последовательными выражениями; перевод сохраняет оба, не превращая их в два разных места.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Строчная буква в местоимении «его» следует обычной современной орфографии и не ослабляет указание на Бога. Тире делает пояснительную связь финальных выражений ясной, сохраняя оба элемента оригинала.
