base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: ru
  text: И гонцы[a] переходили из города в город по земле Ефрема и Манассии, вплоть до Завулона; но над ними смеялись и глумились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «бегуны», «вестники». Еврейское слово обозначает официальных посланников, вероятно быстро доставлявших весть.
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте употреблены два глагола презрительной насмешки: над гонцами «смеялись» и «глумились».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: гонцы
  rationale: Причастная форма от רוץ («бежать») обозначает быстро передвигавшихся официальных посланников. «Гонцы» естественно передаёт и доставку вести, и быстроту передвижения.
- source_word: עֹבְרִים
  choice: переходили
  rationale: Причастие выражает движение через местность; в сочетании с «из города в город» несовершенный вид передаёт повторявшееся продвижение гонцов.
- source_word: מֵעִיר לָעִיר
  choice: из города в город
  rationale: Сохраняет распределительный смысл еврейского оборота и естественно звучит по-русски.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: по земле Ефрема и Манассии, вплоть до Завулона
  rationale: «По земле» соответствует маршруту движения внутри названной области, а «вплоть до» ясно передаёт וְעַד и дальнюю границу пути.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: над ними смеялись
  rationale: Hiphil от שׂחק здесь означает насмешку, а не нейтральный смех. Несовершенный вид сохраняет длительный характер конструкции היה с причастием.
- source_word: וּמַלְעִגִים בָּם
  choice: и издевались
  rationale: לעג выражает презрительную насмешку. «Издевались» сохраняет усиление после «смеялись» и не сводит два еврейских глагола к одному.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: И ... но ...
  rationale: Первый союз продолжает повествование, а «но» естественно обозначает смысловое противопоставление между исполнением поручения гонцами и враждебным откликом жителей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Несовершенные формы «переходили», «смеялись», «издевались» передают протяжённость и повторяемость действий. Неопределённо-личная конструкция «над ними смеялись» не вводит названного субъекта там, где еврейский текст оставляет его подразумеваемым.
