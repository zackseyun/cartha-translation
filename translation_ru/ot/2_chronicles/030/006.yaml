base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: ru
  text: 'И пошли гонцы с письмами от царя и его сановников по всему Израилю и Иудее, по повелению царя, возвещая: «Сыны Израиля! Возвратитесь к Яхве, Богу Авраама, Исаака и Израиля[a], и Он возвратится к уцелевшему остатку, спасшемуся из-под власти царей Ассирии и оставшемуся у вас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь «Израиля», а не более привычное в этой формуле «Иакова».
    reason: Сохраняется необычная форма патриархальной формулы исходного текста.
  - marker: b
    text: 'Дословно: «к спасшемуся остатку, оставшемуся у вас от руки царей Ассирии». «Рука» здесь — образ власти.'
    reason: Примечание показывает еврейский порядок определений и объясняет идиому «от руки», не навязывая более конкретного исторического смысла.
lexical_decisions:
- source_word: הָרָצִים
  choice: гонцы
  rationale: Буквально это «бегущие»; в контексте доставки царских писем слово обозначает официальных гонцов.
- source_word: בָּאִגְּרוֹת
  choice: с письмами
  rationale: אִגְּרוֹת — письменные послания; предлог ב здесь естественно передаётся как сопутствие или средство.
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: от царя и его сановников
  rationale: Оборот «из руки» выражает источник и полномочие; по-русски «от» передаёт это естественно. שָׂרָיו в административном контексте — царские сановники.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: по всему Израилю и Иудее
  rationale: Предлог «по» ясно выражает движение гонцов по всей территории.
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: по повелению царя
  rationale: מִצְוָה здесь означает царское распоряжение, а не религиозную заповедь.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохраняет мужскую форму и торжественное обращение исходного текста; в современном литературном русском понятно как обращение к израильтянам.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: возвратитесь к Яхве
  rationale: Глагол שׁוב передаёт как обращение, так и возвращение; повтор «возвратитесь — возвратится» сохраняет взаимную структуру еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Богу Авраама, Исаака и Израиля
  rationale: Исходный текст прямо называет патриарха Израилем, а не Иаковом.
- source_word: וְיָשֹׁב
  choice: и Он возвратится
  rationale: 'Сохраняется подлинная неоднозначность связи после повелительного наклонения: это может звучать как обещанный результат или как цель/ожидание.'
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: к уцелевшему остатку, который сохранился у вас
  rationale: «Уцелевший остаток» передаёт оба корня — избавление от гибели и сохранение; לָכֶם естественно понято как остаток, сохранившийся у адресатов.
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: избавившись от власти ассирийских царей
  rationale: Метафора «руки» означает власть и господство; деепричастный оборот связывает избавление с уцелевшим остатком и избегает двусмысленного русского присоединения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Имя третьего патриарха
  choice: Израиль
  alternative: Иаков
  rationale: Несмотря на привычную формулу «Авраам, Исаак и Иаков», в данном еврейском тексте стоит יִשְׂרָאֵל, поэтому гармонизация не производится.
- issue: Модальность וְיָשֹׁב после призыва
  choice: и Он возвратится
  alternative: чтобы Он возвратился; и тогда Он возвратится
  rationale: Простое сочинение сохраняет напряжение между целью, следствием и обещанием, не добавляя отсутствующего в тексте явного условного союза.
- issue: Адресат Божьего возвращения
  choice: к уцелевшему остатку
  alternative: к вам, уцелевшему остатку
  rationale: Грамматически אֶל непосредственно относится к הַפְּלֵיטָה; перевод сохраняет этот объект, не отождествляя его полностью со всеми адресатами.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Архаизмы ограничены уместными словами «гонцы», «сановники», «сыны» и «повеление». Пара «возвратитесь — возвратится» намеренно воспроизводит риторический повтор שׁוב.
