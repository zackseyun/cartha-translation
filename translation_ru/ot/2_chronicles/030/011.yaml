source:
  edition: WLC
  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: ru
  text: Но некоторые мужчины из колен Асира, Манассии и Завулона смирились и пришли в Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: В данном контексте частица выражает противопоставление насмешкам и отказу, описанным в предыдущем стихе; естественный русский союз «но» ясно передаёт этот контраст.
- source_word: אֲנָשִׁים
  choice: некоторые мужчины
  rationale: Существительное мужского рода во множественном числе обозначает неопределённую часть людей из названных колен; перевод сохраняет и частичность, и грамматически выраженный пол.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: из колен Асира, Манассии и Завулона
  rationale: Предлоги указывают на происхождение, а добавление «колен» естественно для русского языка и поясняет, что речь идёт о представителях трёх израильских колен.
- source_word: נִכְנְעוּ
  choice: смирились
  rationale: Нифаль глагола כנע здесь передаёт добровольное смирение в ответ на призыв; русское возвратное «смирились» сохраняет этот оттенок, не представляя их лишь пассивно униженными.
- source_word: וַיָּבֹאוּ
  choice: и пришли
  rationale: Последовательная повествовательная форма описывает их прибытие к месту назначения; «пришли» — прямой и естественный русский эквивалент.
- source_word: לִירוּשָׁלִָם
  choice: в Иерусалим
  rationale: При глаголе движения русский язык нормативно обозначает направление конструкцией «в Иерусалим».
theological_decisions:
- issue: Характер смирения, выраженного נִכְנְעוּ
  choice: смирились
  alternative: были смирены / покорились
  rationale: Контекст связывает смирение с последующим добровольным приходом в Иерусалим. Перевод «смирились» сохраняет возможный средне-возвратный смысл нифаля, не уточняя сверх текста, перед кем именно они смирились.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный стиль. Названия колен переданы в традиционной русской библейской форме. Формулировка сохраняет контраст с предыдущим стихом и добровольный характер отклика.
