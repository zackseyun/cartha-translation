base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: ru
  text: И была великая радость в Иерусалиме, потому что со времён Соломона, сына Давида и царя Израиля, ничего подобного не было в Иерусалиме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: И была
  rationale: Последовательная форма с וַ продолжает повествование; «И была» естественно и сдержанно передаёт ход рассказа, не усиливая причинно-следственную связь.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: великая радость
  rationale: Прямо передаёт сочетание существительного и прилагательного, сохраняя как силу переживания, так и возвышенный регистр.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Обычное локативное значение предлога ב; повтор в конце стиха сохранён ради обрамления и акцента исходного текста.
- source_word: כִּי
  choice: потому что
  rationale: В данном контексте союз вводит объяснение масштаба радости; современное русское «потому что» ясно выражает эту связь.
- source_word: מִימֵי
  choice: со времён
  rationale: Передаёт временной промежуток от эпохи Соломона до описываемого события и естественно звучит по-русски.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Соломона, сына Давида
  rationale: Родительный падеж обусловлен оборотом «со времён»; приложение выделено запятыми согласно нормам русского языка.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Сохранено приложение, относящееся к Соломону; форма соответствует синтаксису русского предложения.
- source_word: לֹא כָזֹאת
  choice: ничего подобного не было
  rationale: Буквально конструкция означает «не [было] подобного этому»; восполнение подразумеваемого глагола необходимо для естественного русского синтаксиса без уточнения характера события.
