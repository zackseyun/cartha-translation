  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: ru
  text: Иезекия послал весть всему Израилю и Иудее[a]. Он также написал письма Ефрему и Манассии с призывом прийти в дом Яхве в Иерусалиме и совершить Пасху в честь Яхве[b], Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «по всему Израилю и Иудее»; еврейский предлог может указывать как на адресатов вести, так и на широкий охват страны.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «совершить Пасху для Яхве». Древнееврейское выражение «сделать Пасху» означает соблюсти или отпраздновать её.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал весть
  rationale: Глагол буквально означает «послал», но в сочетании с названиями народа здесь подразумевает передачу вести или призыва. Такой перевод естественен по-русски и не уточняет без основания, что были посланы именно гонцы.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: всему Израилю и Иудее
  rationale: Предлог עַל в данном контексте обозначает адресата или охват рассылки. Формулировка сохраняет собирательное обозначение народа и страны.
- source_word: אִגְּרוֹת כָּתַב עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: написал письма Ефрему и Манассии
  rationale: אִגְּרוֹת — обычное обозначение письменных посланий, а עַל после כָּתַב здесь естественно понимать как указание адресатов — северных племён Ефрема и Манассии.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: прийти в дом Яхве
  rationale: Сохраняется буквальный библейский образ «дом Яхве», не заменяемый более толковательным словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом «Господь».
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: совершить Пасху
  rationale: Буквально «сделать Пасху» — устойчивое древнееврейское выражение об исполнении пасхального установления. «Совершить Пасху» сохраняет обрядовый смысл и звучит достойно в современном русском тексте.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог לְ указывает, для кого или в чью честь совершается Пасха. Основной текст передаёт это естественной русской формой, а более буквальная возможность отмечена в сноске.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача сочетания в форме сопряжённого состояния, сохраняющая заветное именование Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Значение посвящения в выражении לַעֲשׂוֹת פֶּסַח לַיהוָה
  choice: совершить Пасху в честь Яхве
  alternative: совершить Пасху Яхве / совершить Пасху для Яхве
  rationale: Перевод выражает направленность празднования к Яхве, не превращая оборот в утверждение о принадлежности Пасхи и не устраняя возможный оттенок посвящения.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксически длинное еврейское предложение разделено на два для ясности; причинно-целевая связь сохранена словом «призывая». Имена переданы в привычных русских библейских формах: Иезекия, Ефрем, Манассия; тетраграмматон — как «Яхве».'
