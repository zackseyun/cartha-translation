  text: כָּל לְבָב֣/וֹ הֵכִ֔ין לִ/דְר֛וֹשׁ הָ/אֱלֹהִ֥ים יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתָ֑י/ו וְ/לֹ֖א כְּ/טָהֳרַ֥ת הַ/קֹּֽדֶשׁ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: ru
  text: всякого, кто настроил своё сердце[a] искать Бога — Яхве, Бога своих отцов, — хотя и не очистился так, как предписано для святилища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приготовил (или утвердил) своё сердце».'
    reason: Сноска сохраняет образ и диапазон значения הֵכִין לֵב, тогда как основной текст передаёт его естественным русским выражением.
  - marker: b
    text: 'Или: «святого места». Еврейское слово קֹדֶשׁ может здесь обозначать святилище или сакральную сферу.'
    reason: Указывает на подлинную лексическую неоднозначность культового термина.
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: всякого, кто всем сердцем
  rationale: כָּל при существительном в единственном числе с местоименным суффиксом имеет распределительное значение. Русское «всякого, кто всем сердцем» естественно продолжает синтаксис молитвы из предыдущего стиха и сохраняет индивидуализирующую силу выражения.
- source_word: הֵכִין
  choice: решил
  rationale: Hiphil глагола כון здесь описывает сознательную направленность сердца. В сочетании «всем сердцем решил» передаётся устойчивое внутреннее намерение, а не просто предварительная подготовка.
- source_word: לִדְרוֹשׁ
  choice: искать
  rationale: דרש с Богом в качестве объекта охватывает обращение к Нему, стремление к Нему и почитание; «искать» сохраняет эту смысловую широту.
- source_word: הָאֱלֹהִים יְהוָה
  choice: Бога — Яхве
  rationale: Приложение отождествляет искомого Бога с Яхве. Тире естественно оформляет это пояснение по-русски, а личное имя передаёт יהוה непосредственно.
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: Бога своих отцов
  rationale: Единственное число суффикса соответствует распределительному «всякого»; «своих отцов» сохраняет родовую и заветную отсылку.
- source_word: וְלֹא כְּטָהֳרַת
  choice: хотя и не очистился, как положено
  rationale: וְלֹא в контексте имеет уступительный оттенок, а כְּ обозначает соответствие установленной норме. Глагольная формулировка по-русски ясно выражает отсутствие требуемого обрядового очищения.
- source_word: הַקֹּדֶשׁ
  choice: святилища
  rationale: В культовом контексте קֹדֶשׁ, вероятнее всего, обозначает святилище или сакральную сферу. «Святилище» кратко и естественно передаёт основной смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Искреннее обращение к Богу при ритуальной нечистоте
  choice: Сохранено противопоставление сердечного стремления и несоблюдения нормы очищения
  alternative: Сгладить нарушение обряда либо представить его как отменяющее искренность
  rationale: Еврейский текст ставит оба обстоятельства рядом и не устраняет напряжения между ними; перевод также не даёт дополнительного богословского разрешения.
- issue: Референт הַקֹּדֶשׁ
  choice: святилище
  alternative: святое место; святыня; священный обряд
  rationale: Контекст Пасхи и ритуального очищения поддерживает культовое понимание, но конкретный референт слова не вполне однозначен; это отмечено сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-исторического контекста. Формулировка рассчитана на включение в синтаксически продолжающуюся молитву Езекии из 2 Пар 30:18; употреблены ясные современные слова без конфессионально окрашенной терминологии.
