base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: ru
  text: Соломон собрал колесницы и всадников[a]; у него было 1 400 колесниц и 12 000 всадников. Он разместил их в колесничных городах[b] и вместе с царём в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конницу». Еврейское слово обозначает всадников, или верховых воинов; «всадники» — более буквальный перевод.'
    reason: lexical_alternative
  - marker: b
    text: То есть в особых городах, где содержали или размещали колесницы.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Глагол אסף означает «собирать, накапливать»; «собрал» естественно передаёт приобретение и сосредоточение военных сил.
- source_word: רֶכֶב
  choice: колесницы
  rationale: Хотя слово может обозначать колесничное войско как совокупность, указанное число 1 400 делает конкретное множественное «колесницы» наиболее ясным.
- source_word: פָּרָשִׁים
  choice: всадники
  rationale: Существительное обозначает верховых воинов или ездоков, а не просто лошадей; «всадники» близко к еврейскому и естественно по-русски.
- source_word: וַיְהִי לוֹ
  choice: у него было
  rationale: Еврейская конструкция существования с ל выражает обладание; русское «у него было» сохраняет её смысл и звучит естественно.
- source_word: וַיַּנִּיחֵם
  choice: разместил их
  rationale: Каузативная форма передаёт помещение или оставление в определённых местах; «разместил» подходит к распределению военных сил и не уточняет сверх текста характер гарнизона.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: в колесничных городах
  rationale: Сочетание обозначает города, предназначенные для содержания или размещения колесниц; краткое «колесничные города» сохраняет форму исходного выражения.
- source_word: וְעִם הַמֶּלֶךְ
  choice: и при царе
  rationale: Предлог עִם буквально означает «с»; в данном контексте русское «при царе» естественно выражает нахождение части сил в распоряжении царя, не добавляя в основной текст слова «часть».
