source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: ru
  text: 'И сказал Соломон Богу: «Ты оказал великую милость[a] Давиду, отцу моему, и поставил меня царём вместо него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חֶסֶד может также означать «неизменная любовь» или «верность завету»; здесь речь идёт о деятельной, преданной милости Бога к Давиду.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; русское «И сказал» естественно передаёт связь с предыдущим контекстом.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: В данном обращении אֱלֹהִים обозначает единого Бога; дательный падеж естественно передаёт адресата речи.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: оказал великую милость
  rationale: Оборот עשה עם + חֶסֶד означает проявить к кому-либо деятельную, верную любовь или милость. «Оказал великую милость» звучит естественно и достойно по-русски, а более широкий смысл חֶסֶד сохранён в сноске.
- source_word: דָּוִיד אָבִי
  choice: Давиду, отцу моему
  rationale: Такой порядок сохраняет последовательность еврейского текста; приложение «отцу моему» ясно и литературно.
- source_word: וְהִמְלַכְתַּנִי
  choice: и поставил меня царём
  rationale: Каузативная форма глагола מלך означает сделать кого-либо царём, дать ему царствовать. «Поставил меня царём» естественно выражает Божье действие.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте царского преемства תַּחַת означает занять место предшественника; выражение не подразумевает насильственного смещения.
theological_decisions:
- issue: Передача חֶסֶד в контексте Божьих отношений с Давидом
  choice: милость с пояснительной сноской
  alternative: верность завету; неизменная любовь
  rationale: Контекст допускает заветный оттенок, однако само слово חֶסֶד объединяет значения милости, преданной любви и верности. Основной текст не сужает эту смысловую широту до одной богословской формулы, а сноска сохраняет важный оттенок постоянства и верности.
- issue: Божье действие при воцарении Соломона
  choice: поставил меня царём вместо него
  alternative: дал мне царствовать после него
  rationale: Выбранная формулировка сохраняет каузативность еврейского глагола и прямо передаёт Божью роль в воцарении Соломона, не добавляя дальнейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировки понятны широкому кругу читателей; инверсия «Давиду, отцу моему» сохранена как естественная и слегка возвышенная.
