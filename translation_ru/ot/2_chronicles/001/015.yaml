base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: ru
  text: Царь сделал так, что серебра и золота в Иерусалиме было как камней[a], а кедров — так же много, как сикомор, растущих в Шефеле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро и золото… как камни». Сравнение выражает их необычайное изобилие.'
    reason: lexical_alternative
  - marker: b
    text: Шефела — холмистая предгорная область Иудеи между горной страной и прибрежной равниной. Сикомора — распространённое там дерево, также называемое сикоморовой смоковницей.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: сделал так, что … было / так же много
  rationale: 'В сочетании с прямыми дополнениями и сравнительными оборотами глагол נתן имеет результативно-каузативный смысл: царь обеспечил необычайное изобилие серебра, золота и кедров. Буквальное «дал» по-русски требовало бы не названного в тексте получателя и затемняло бы идиому.'
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: серебра и золота
  rationale: Родительный падеж естественен в русской конструкции количества «было как…» и передаёт названия драгоценных металлов как вещества.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямое обозначение места.
- source_word: כָּאֲבָנִים
  choice: как камней
  rationale: Сохранён образный сравнительный оборот еврейского текста; русская конструкция «было как камней» естественно выражает чрезвычайное изобилие.
- source_word: הָאֲרָזִים
  choice: кедров
  rationale: Сохраняется форма названия деревьев, не сужая значение до «кедровой древесины», хотя в контексте царского богатства и строительства может подразумеваться запас лесоматериалов.
- source_word: כַּשִּׁקְמִים
  choice: как сикомор
  rationale: שׁקמה обозначает сикомору, или сикоморовую смоковницу; традиционное русское название «сикомора» достаточно точно и лаконично.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: растущих в Шефеле
  rationale: Шефела — название конкретной географической области. Причастие «растущих» естественно передаёт подразумеваемую связь деревьев с этой местностью.
- source_word: לָרֹב
  choice: так же много
  rationale: Значение изобилия выражено внутри сравнительной конструкции, без неестественного буквального окончания «во множестве».
