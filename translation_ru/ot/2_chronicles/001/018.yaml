source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה לִ/בְנ֥וֹת בַּ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: ru
  text: И решил Соломон построить дом для имени Яхве[a] и дом для своего царства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сказал построить»; по смыслу возможно также: «велел построить» или «намерился построить».'
    reason: Сохраняет диапазон значений וַיֹּאמֶר перед инфинитивом и не представляет выбранное «решил» как единственно возможное.
  - marker: b
    text: 'По смыслу: «храм для имени Яхве и дворец для своего царства». В еврейском тексте в обеих частях употреблено слово «дом».'
    reason: Разъясняет назначение двух строений, одновременно отмечая намеренно сохранённый лексический повтор.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: решил
  rationale: Обычное значение глагола — «сказал», однако сочетание с инфинитивом לִבְנוֹת в данном контексте выражает намерение или принятое решение. «Решил» естественно звучит по-русски, а буквальное значение и возможность повеления отмечены в сноске.
- source_word: לִבְנוֹת
  choice: построить
  rationale: Инфинитив בנה прямо обозначает строительство; русский совершенный вид естественно передаёт намеченный результат.
- source_word: בַּיִת ... וּבַיִת
  choice: дом ... и дом
  rationale: Повтор одного и того же слова сохранён, хотя по контексту речь идёт соответственно о храме и царском дворце.
- source_word: לְשֵׁם יְהוָה
  choice: для имени Яхве
  rationale: 'Сохранена значимая храмовая формула: дом связывается с именем Бога, а не представляется местом, вмещающим Его. Предлог «для» передаёт לְ без сведения выражения лишь к значению «в честь».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: לְמַלְכוּתוֹ
  choice: для своего царства
  rationale: מַלְכוּת может означать «царство» или «царскую власть»; «для своего царства» сохраняет широкое значение и соотносит второй дом с царствованием Соломона.
theological_decisions:
- issue: Храмовая формула с именем Бога
  choice: дом для имени Яхве
  alternative: храм во имя Господа
  rationale: Основной текст сохраняет и личное имя Яхве, и богословски значимое упоминание Его имени, не превращая формулу лишь в указание на посвящение или почитание.
- issue: Повтор בַּיִת в двух частях стиха
  choice: дом ... и дом
  alternative: храм ... и дворец
  rationale: 'Повтор отражает композицию еврейского текста и не устраняет различие функций: они ясны из выражений «для имени Яхве» и «для своего царства».'
- issue: Характер решения Соломона
  choice: решил
  alternative: сказал / велел
  rationale: Конструкция допускает оттенок намерения или распоряжения. Основной вариант естественно передаёт намерение, а сноска сохраняет лексическую и контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка остаётся понятной без архаизмов; необычные сочетания «дом для имени» и «дом для царства» сохранены ради богословской формулы и повтора оригинала, а их смысл пояснён сносками.
