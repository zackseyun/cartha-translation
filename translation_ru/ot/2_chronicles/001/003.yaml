  terminology: Имя יהוה последовательно передано как «Яхве». «Божий шатёр встречи» приемлемо передаёт אֹהֶל מוֹעֵד הָאֱלֹהִים без традиционализма «скиния» и без лишнего истолкования. «Высота» сохраняет библейский термин בָּמָה и не навязывает оценку законности или незаконности этого святилища.
