  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: ru
  text: И Соломон, и всё собрание с ним пошли к высоте в Гаваоне[a], потому что там находился Божий шатёр встречи, который Моисей, слуга Яхве, сделал в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь там находился Божий шатёр встречи».'
    reason: Союз כִּי может иметь пояснительное значение «ведь» наряду с причинным «потому что».
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Простая форма прошедшего времени естественно передаёт основное повествовательное действие, не добавляя отсутствующего в глаголе направления.
- source_word: הַקָּהָל
  choice: всё собрание
  rationale: Слово обозначает собравшуюся общину; «собрание» сохраняет коллективный смысл и понятно современному читателю.
- source_word: לַבָּמָה
  choice: к месту поклонения на высоте
  rationale: במה обозначает расположенное на возвышенности культовое место. Развёрнутый перевод понятнее буквального «к высоте» и не приписывает этому месту отрицательной оценки.
- source_word: בְּגִבְעוֹן
  choice: в Гаваоне
  rationale: Использована устоявшаяся русская форма географического названия; предлог естественно передаёт местонахождение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Соломон и собрание направились в Гаваон.
- source_word: אֹהֶל מוֹעֵד הָאֱלֹהִים
  choice: Божий шатёр встречи
  rationale: «Шатёр встречи» прозрачно передаёт название святилища, а определение «Божий» сохраняет конструктивную связь с אֱלֹהִים без более традиционного, но менее понятного слова «скиния».
- source_word: עָשָׂה
  choice: сделал
  rationale: Обычное значение глагола достаточно точно; временная предшествованность ясна из придаточного и контекста.
- source_word: עֶבֶד יְהוָה
  choice: раб Яхве
  rationale: «Раб» сохраняет традиционный почётный титул Моисея и более прямо передаёт עֶבֶד, не устраняя оттенок полной принадлежности и служения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: Это естественный русский эквивалент в повествовании о странствиях Израиля.
theological_decisions:
- issue: Значение במה в контексте богослужения до постройки храма
  choice: место поклонения на высоте
  alternative: высота; святилище на возвышенности
  rationale: 'Перевод обозначает культовую функцию места, но не вносит отрицательной богословской оценки: в данном контексте там находился шатёр встречи.'
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Статус Моисея в выражении עֶבֶד יְהוָה
  choice: раб Яхве
  alternative: слуга Яхве
  rationale: «Раб Яхве» сохраняет силу и почётно-титульный характер древнееврейского выражения, не сводя его к более слабому обозначению служебной роли.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Выражение «место поклонения на высоте» выбрано ради понятности; традиционное «скиния собрания» заменено прозрачным «шатёр встречи».
