base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: ru
  text: Кони Соломона поступали из Египта и из Куэ[a], а царские купцы приобретали их из Куэ[b] за плату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и из места сбора». Еврейское слово מִקְוֵא допускает разные толкования: его понимают либо как название области Куэ, вероятно в Киликии, либо как нарицательное обозначение места сбора.'
    reason: alternative_reading
  - marker: b
    text: 'При ином понимании спорного слова возможен перевод: «а царские купцы приобретали их из места сбора за плату».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: Кони для Соломона поступали
  rationale: Существительное מוֹצָא указывает на источник или происхождение. В контексте торговли естественная русская конструкция «поступали из» передаёт источник поставок, не сводя значение исключительно к формальному импорту.
- source_word: מִמִּצְרָיִם
  choice: из Египта
  rationale: Стандартное русское название страны с явно выраженным исходным значением предлога מִן.
- source_word: וּמִקְוֵא
  choice: и из Куэ
  rationale: Трудную форму מִקְוֵא здесь вероятнее всего следует понимать как название области Куэ, параллельное Египту; альтернативное понимание как нарицательного существительного сохранено в сноске.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: царские купцы
  rationale: Причастная форма употреблена субстантивированно и обозначает торговцев, действующих при царе или от его имени.
- source_word: יִקְחוּ
  choice: приобретали
  rationale: Глагол לקח буквально означает «брать», но сочетание с указанием цены описывает торговое приобретение. Несовершенный вид передаёт повторяющееся действие.
- source_word: בִּמְחִיר
  choice: за плату
  rationale: Передаёт коммерческий смысл выражения, не добавляя отсутствующей в тексте характеристики цены.
