source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: ru
  text: И ныне, Яхве, Боже, да утвердится Твоё слово, данное Давиду, моему отцу[a], потому что Ты поставил меня царём над народом, многочисленным, как прах земной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да утвердится Твоё обещание Давиду, моему отцу».'
    reason: 'Лексическая альтернатива: דָּבָר буквально означает «слово», но в данном контексте может обозначать обещание; יֵאָמֵן передаёт просьбу об утверждении или подтверждении этого слова.'
lexical_decisions:
- source_word: עַתָּה
  choice: И ныне
  rationale: Передаёт временной и дискурсивный переход к просьбе Соломона; союз «и» естественно связывает её с предшествующей речью.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Боже
  rationale: Личное имя יהוה передано как «Яхве», а אֱלֹהִים — звательной формой «Боже», естественной для русской молитвенной речи.
- source_word: יֵאָמֵן
  choice: да утвердится
  rationale: Желательная конструкция с нифалем אמן выражает просьбу о подтверждении и прочном осуществлении сказанного Богом; «да утвердится» сохраняет пассивный оттенок и торжественный регистр.
- source_word: דְּבָרְךָ
  choice: Твоё слово
  rationale: Сохраняет буквальное «слово», не заменяя его в основном тексте более узким контекстуальным значением «обещание».
- source_word: עִם דָּוִיד אָבִי
  choice: данное Давиду, моему отцу
  rationale: В сочетании со «словом» предлог עִם обозначает того, кому слово было сообщено; такой перевод естественен по-русски и не воспроизводит неидиоматичное «с Давидом».
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание просьбы Соломона и ясно передаёт причинную связь.
- source_word: הִמְלַכְתַּנִי
  choice: Ты поставил меня царём
  rationale: 'Передаёт каузативное значение хифиля от מלך: Бог сделал Соломона царём.'
- source_word: עַל עַם רַב
  choice: над народом, многочисленным
  rationale: רַב здесь относится к численности, что уточняется последующим сравнением с земным прахом.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: как прах земной
  rationale: Сохраняет традиционный образ неисчислимого множества и звучит естественно в возвышенной русской прозе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Следует ли конкретизировать דְּבָרְךָ как «обещание»
  choice: Твоё слово
  alternative: Твоё обещание
  rationale: В контексте речь идёт об обещании Давиду, однако еврейский текст говорит шире — «Твоё слово». Основной текст сохраняет эту формулировку, а контекстуальное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Сохранены образ «праха земного», личное имя Яхве и формальная неопределённость слова דָּבָר. Местоимения, обращённые к Богу, написаны с прописной буквы как элемент принятого русского религиозного регистра.
