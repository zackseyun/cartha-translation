    text: 'Буквальнее: «к тому, что Давид приготовил для него». Еврейское выражение сжато; по смыслу речь идёт о месте, приготовленном Давидом для ковчега.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Но
  rationale: 'Передаёт противопоставление предыдущему стиху: жертвенник находился в Гаваоне, а ковчег — в другом месте.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Естественная для русского библейского регистра передача конструкции принадлежности без добавочного толкования.
- source_word: הֶעֱלָה
  choice: перенёс
  rationale: В данном контексте каузативная форма עלה обозначает перемещение ковчега к подготовленному месту; русский глагол естественно передаёт результат, не требуя буквального «поднял».
- source_word: מִקִּרְיַת יְעָרִים
  choice: из Кириаф-Иарима
  rationale: Употреблена укоренившаяся русская библейская форма географического названия.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: туда, куда приготовил для него место
  rationale: Еврейское выражение сжато и эллиптично; добавление слова «место» ясно выражает подразумеваемый пункт назначения, а сноска сохраняет сведения о форме оригинала.
- source_word: כִּי
  choice: потому что
  rationale: Вводит объяснение того, каким образом место было подготовлено для ковчега.
- source_word: נָטָה לוֹ אֹהֶל
  choice: поставил для него шатёр
  rationale: נטה в сочетании с אֹהֶל означает поставить или раскинуть шатёр; «поставил шатёр» естественно в современном русском языке.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямая передача обстоятельства места с традиционной русской формой топонима.
