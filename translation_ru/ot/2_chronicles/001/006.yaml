base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: ru
  text: Там Соломон взошёл к бронзовому жертвеннику перед Яхве, который был при шатре встречи, и принёс на нём тысячу всесожжений.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם עַל מִזְבַּח
  choice: взошёл ... там к ... жертвеннику
  rationale: Первое וַיַּעַל передаёт направленное движение вверх или приближение; «взошёл ... к» сохраняет этот оттенок и естественно звучит в повествовании.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: бронзовый жертвенник
  rationale: נְחֹשֶׁת может обозначать медь или бронзу; в контексте скинии традиционное и понятное обозначение — «бронзовый жертвенник».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Кратко и точно передаёт положение или действие в присутствии Бога, сохраняя личное имя из еврейского текста.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: который был при шатре встречи
  rationale: Предлог לְ допускает локативно-ассоциативное понимание. «При шатре» сохраняет связь жертвенника с шатром, не уточняя сверх текста, находился ли он непосредственно перед ним или принадлежал ему.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: принёс на нём ... всесожжений
  rationale: 'Второе וַיַּעַל употреблено как жертвенный термин: жертвы возносятся на алтаре. Русское «принёс ... всесожжения» естественно выражает совершение жертвоприношения.'
- source_word: עֹלוֹת
  choice: всесожжений
  rationale: Устоявшийся русский эквивалент עֹלָה — жертвы, полностью сжигаемой на жертвеннике.
- source_word: אָלֶף
  choice: тысячу
  rationale: Прямое количественное значение еврейского числительного.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В исходном тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены лаконичность повествования и повторная связь действия с жертвенником; «шатёр встречи» выбрано как прозрачная передача אֹהֶל מוֹעֵד.
