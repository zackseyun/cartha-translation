base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: ru
  text: Теперь дай мне мудрость и знание, чтобы я выходил и входил перед этим народом[a], ведь кто способен судить этот Твой великий народ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выходил и входил перед этим народом» — древнееврейское выражение, обозначающее публичное руководство народом.'
    reason: cultural_note
  - marker: b
    text: 'Или: «этот Твой многочисленный народ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Итак
  rationale: В данном контексте слово не только указывает на настоящий момент, но и вводит просьбу Соломона как вывод из предшествующих слов Бога; «итак» естественно передаёт эту связь.
- source_word: חָכְמָה וּמַדָּע
  choice: мудрость и знание
  rationale: 'Сохранены два различных еврейских понятия: способность мудро действовать и знание/понимание, необходимые правителю.'
- source_word: תֶּן לִי
  choice: дай мне
  rationale: Прямое и естественное соответствие повелительной форме; не требует более возвышенного, но менее точного «даруй».
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: чтобы я выходил и входил
  rationale: Целевые формы переданы придаточным цели. Сохранён древнееврейский образ публичного руководства, а не заменён толкованием «управлял».
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: перед этим народом
  rationale: «Перед» сохраняет пространственный образ исходного выражения, который в контексте обозначает положение предводителя.
- source_word: מִי יִשְׁפֹּט
  choice: кто способен судить
  rationale: Глагол буквально означает «судить», а риторический вопрос подразумевает способность исполнить эту задачу; в царском контексте суд включает отправление правосудия и управление.
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: этот Твой великий народ
  rationale: Переданы местоименный суффикс обращения к Богу, указательное слово и определение «великий»; русский порядок слов остаётся естественным и сохраняет торжественный тон.
theological_decisions:
- issue: Образ царского руководства в выражении «выходить и входить перед народом»
  choice: Сохранить исходный образ и пояснить его в сноске.
  alternative: «руководить этим народом» или «управлять этим народом»
  rationale: Буквальный образ в русском языке допускает понимание при кратком пояснении и не сводит царское служение только к административному управлению.
- issue: Значение יִשְׁפֹּט в царском контексте
  choice: «судить»
  alternative: «управлять»
  rationale: «Судить» сохраняет непосредственное значение глагола и связь царской власти с правосудием, тогда как «управлять» шире и устраняет эту значимую грань.
- issue: Значение הַגָּדוֹל применительно к народу
  choice: «великий»
  alternative: «многочисленный»
  rationale: Еврейское слово допускает значение размера или многочисленности, но также выражает величие и значимость; основной текст сохраняет более широкий смысл, а конкретная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Синтаксис просьбы ясен для обычного читателя; исходный образ руководства сохранён и пояснён. Написание «Твой» с прописной буквы следует принятой русской практике почтительного обращения к Богу, не меняя смысла оригинала.
