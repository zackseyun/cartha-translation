  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: ru
  text: А медный жертвенник, который сделал Веселеил, сын Урия, сына Ора, был поставлен перед скинией Яхве; Соломон и собрание искали его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его» может относиться либо к Яхве, либо к медному жертвеннику; еврейский текст допускает оба понимания.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: А медный жертвенник
  rationale: מִזְבַּח означает «жертвенник», а נְחֹשֶׁת в контексте храмовой утвари — медь или бронзу; традиционное и естественное русское сочетание «медный жертвенник» сохраняет понятную библейскую терминологию. Союз ו передан как «А», связывая стих с предыдущим повествованием.
- source_word: אֲשֶׁר עָשָׂה בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: который сделал Веселеил, сын Урия, сына Ора
  rationale: Относительная конструкция передана прямо. Имена даны в укоренившейся русской библейской форме, а последовательность родства сохранена.
- source_word: שָׂם לִפְנֵי מִשְׁכַּן יְהוָה
  choice: был поставлен перед скинией Яхве
  rationale: В WLC שָׂם — форма глагола שׂים «ставить, помещать», а не наречие שָׁם «там». Пассивная русская конструкция естественно передаёт результат действия, не вводя явно названного деятеля. לִפְנֵי имеет пространственный смысл «перед», מִשְׁכָּן передано установленным культовым термином «скиния», а тетраграмматон — как «Яхве».
- source_word: וַיִּדְרְשֵׁהוּ
  choice: искали его[a]
  rationale: 'דרשׁ означает «искать, обращаться, вопрошать»; форма содержит местоименный суффикс мужского рода. Русское «его» сохраняет неясность референта: им может быть Яхве или жертвенник, оба существительных мужского рода.'
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: Соломон и собрание
  rationale: קָהָל обозначает собравшуюся общину; современное «собрание» точно и не привносит поздней конфессиональной окраски.
theological_decisions:
- issue: К кому или чему относится суффикс в וַיִּדְרְשֵׁהוּ
  choice: 'Сохранить местоимение без явного указания референта: «искали его».'
  alternative: «Искали Яхве», «искали жертвенник» или «обратились туда».
  rationale: Глагол דרשׁ часто употребляется о поиске Бога или обращении к Нему, однако ближайшим возможным референтом остаётся жертвенник, а дальнейший контекст говорит о приближении Соломона к жертвеннику. Русское местоимение позволяет не устранять подлинную неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены традиционные русские формы личных имён и культовый термин «скиния»; синтаксис упрощён лишь настолько, чтобы стих был понятен обычному читателю. Маркер сноски поставлен непосредственно при неоднозначном местоимении.
