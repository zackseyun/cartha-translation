base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: ru
  text: Затем Соломон пришёл[a] в Иерусалим с высоты в Гаваоне[c], из-перед шатра встречи[b], и царствовал над Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отправился»; еврейский глагол допускает передачу движения с разных точек зрения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-перед шатра встречи» — пространственное выражение, означающее уход от святилища.'
    reason: cultural_note
  - marker: c
    text: Имеется в виду культовая высота в Гаваоне, где находился шатёр встречи.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Глагол בוא может передавать движение как «приходить», так и «идти» в зависимости от точки отсчёта. Здесь естественно описать прибытие Соломона в Иерусалим.
- source_word: לַבָּמָה
  choice: с высоты
  rationale: במה обозначает культовую высоту. Сохранён традиционный и достаточно прозрачный термин без привнесения отрицательной оценки, которой в данном контексте нет.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: в Гаваоне
  rationale: Кратко и естественно передаёт местонахождение высоты; относительное אֲשֶׁר по-русски не требует отдельного местоимения.
- source_word: יְרוּשָׁלִַם
  choice: в Иерусалим
  rationale: Контекст и сжатый еврейский синтаксис указывают на Иерусалим как цель возвращения Соломона.
- source_word: מִלִּפְנֵי
  choice: от места перед
  rationale: Буквальное пространственное выражение «из-перед» передано понятной русской конструкцией, обозначающей уход от священного места перед шатром.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт оба элемента еврейского выражения и остаётся понятнее современному читателю, чем архаичное «скиния собрания».
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: В контексте Соломон уже является царём, поэтому форма означает продолжение его царствования, а не восшествие на престол.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Естественное русское управление при глаголе «царствовать».
theological_decisions:
- issue: Синтаксическая связь слова «Иерусалим» в сжатой последовательности еврейского текста
  choice: Соломон пришёл в Иерусалим с высоты в Гаваоне, от места перед шатром встречи
  alternative: Соломон пришёл к высоте в Гаваоне, Иерусалиме, от места перед шатром встречи
  rationale: Предшествующий контекст сообщает, что Соломон отправился в Гаваон; теперь он возвращается в Иерусалим. Перестановка компонентов делает направление ясным по-русски, не добавляя нового содержания.
- issue: Характер высоты в Гаваоне
  choice: высота
  alternative: святилище на высоте
  rationale: Лексический перевод сохраняет формулировку текста и не навязывает ни осуждения высоты, ни более конкретного понимания устройства святилища.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Сохранены библейские термины «высота» и «шатёр встречи», при этом архаичные формы и искусственное копирование еврейского порядка слов избегаются.
