base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: ru
  text: Мудрость и знание даны тебе, а Я дам тебе богатство, имущество и почёт, каких не было ни у одного царя до тебя и не будет ни у кого после тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чего не было у царей, которые были до тебя, и после тебя не будет такого».'
    reason: Буквальная форма еврейского сравнения менее определённо называет тех, кто будет после Соломона; основной текст естественно передаёт подразумеваемое сравнение с царями.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: мудрость
  rationale: Обычное соответствие абстрактному существительному חָכְמָה; артикль в русском естественно не передаётся.
- source_word: הַמַּדָּע
  choice: знание
  rationale: מַדָּע означает знание или понимание; «знание» точно и естественно сочетается с «мудростью».
- source_word: נָתוּן לָךְ
  choice: даны тебе
  rationale: Страдательное причастие выражает уже дарованное состояние; форма множественного числа согласована с двумя однородными подлежащими.
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Передаёт материальное благосостояние и позволяет отличить его от следующего слова נְכָסִים.
- source_word: נְכָסִים
  choice: имущество
  rationale: Ясное современное обозначение владений или собственности без излишне делового оттенка слова «активы».
- source_word: כָבוֹד
  choice: почёт
  rationale: В контексте царских даров слово обозначает оказываемую царю честь и почёт; этот выбор не смешивает человеческий почёт с божественной славой.
- source_word: אֶתֶּן לָךְ
  choice: Я дам тебе
  rationale: Имперфект נתן в данном обещании естественно имеет будущее значение; местоимение подчёркивает смену от уже дарованных мудрости и знания к дополнительным дарам.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים
  choice: каких не было ни у одного царя
  rationale: Идиоматично передаёт сравнительную конструкцию и связывает её с перечисленными дарами, не превращая утверждение в безусловное превосходство Соломона во всех отношениях.
- source_word: לְפָנֶיךָ
  choice: до тебя
  rationale: Передаёт временное значение в контексте последовательности царей.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: и не будет ни у кого после тебя
  rationale: Естественно восполняет подразумеваемое сравнение с последующими царями, сохраняя его связь с названными дарами.
theological_decisions:
- issue: Объём утверждения об уникальности Соломона
  choice: Сравнение относится к перечисленным дарам — богатству, имуществу и почёту — у прежних и последующих царей.
  alternative: Понимать стих как утверждение, что сам Соломон во всех отношениях превзойдёт всех царей.
  rationale: Относительное предложение непосредственно следует за перечнем даров. Перевод не расширяет его до абсолютной оценки личности, правления или нравственного состояния Соломона.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим речи Бога к царю. Синтаксис сделан плавным, но различие между уже данными мудростью и знанием и обещанными материальными и общественными дарами сохранено.
