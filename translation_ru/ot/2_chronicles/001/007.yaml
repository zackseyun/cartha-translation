base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: ru
  text: 'В ту ночь Бог явился Соломону и сказал ему: «Проси, что Мне дать тебе».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Проси, что Я дам тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: В ту ночь
  rationale: Естественная современная русская передача обстоятельства времени «в/той ночью».
- source_word: נִרְאָה
  choice: явился
  rationale: Нифаль глагола ראה в контексте богоявления означает «явился»; вариант «был виден» был бы неестественно буквальным.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на форму множественного числа, сказуемое стоит в единственном числе, и контекст однозначно указывает на Бога Израиля.
- source_word: לִשְׁלֹמֹה
  choice: Соломону
  rationale: Предлог ל обозначает лицо, которому явился Бог; русский дательный падеж передаёт это естественно.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал ему
  rationale: Прямая и стилистически нейтральная передача אמר с местоименным дополнением.
- source_word: שְׁאַל
  choice: Проси
  rationale: Императив выражает открытое приглашение обратиться с просьбой; «проси» в русском контексте естественнее, чем буквальное «спроси».
- source_word: מָה אֶתֶּן לָךְ
  choice: что Мне дать тебе
  rationale: Конструкция сохраняет открытость вопроса и неоднозначность формы אֶתֶּן, которую можно понять как «Мне дать» или более буквально «Я дам».
theological_decisions:
- issue: Передача אֱלֹהִים в контексте богоявления
  choice: Бог
  alternative: боги
  rationale: Единственное число глагола и повествовательный контекст уверенно указывают на единственного Бога; перевод не добавляет более узких догматических уточнений.
- issue: Модальная сила אֶתֶּן после повелительного שְׁאַל
  choice: что Мне дать тебе
  alternative: что Я дам тебе
  rationale: Основной текст использует естественную русскую конструкцию с инфинитивом, не превращая приглашение в безусловное обещание; сноска сохраняет более формальное чтение.
translation_notes:
  register: Современный литературный русский язык; краткий, dignified повествовательный стиль. Местоимение «Мне» написано с прописной буквы по принятой русской библейской традиции обращения к Богу; двоеточие естественно вводит прямую речь.
