base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: ru
  text: Соломон, сын Давида, утвердился в своём царстве[a]. Яхве[b], его Бог, был с ним и чрезвычайно возвеличил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал сильным в своём царстве»; букв.: «укрепился над своим царством».'
    reason: lexical_alternative
  - marker: b
    text: Евр. יהוה (ЙХВХ) — личное имя Бога; традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: утвердился
  rationale: Возвратная форма передаёт становление Соломона сильным и прочным в своём царском положении, не превращая действие ни в чистый пассив, ни в явно переходное «укрепил».
- source_word: עַל מַלְכוּתוֹ
  choice: в своём царстве
  rationale: В данном сочетании עַל указывает на положение Соломона по отношению к царству и его власти над ним. По-русски «утвердился в своём царстве» естественнее буквального «утвердился над своим царством»; возможные оттенки власти и царствования сохранены в примечании.
- source_word: בֶן דָּוִיד
  choice: сын Давида
  rationale: Прямо сохраняет родственное и династическое обозначение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, обозначенное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: אֱלֹהָיו
  choice: его Бог
  rationale: Сохраняет простую притяжательную конструкцию и личный характер отношения.
- source_word: עִמּוֹ
  choice: был с ним
  rationale: Естественная русская передача устойчивого выражения о Божьем присутствии и благоволении.
- source_word: וַיְגַדְּלֵהוּ
  choice: возвеличил его
  rationale: 'Порода пиэль с объектным суффиксом выражает причинное действие: Яхве сделал Соломона великим. «Возвеличил» ясно и достойно передаёт этот смысл.'
- source_word: לְמָעְלָה
  choice: чрезвычайно
  rationale: Здесь выражение употреблено наречно и усиливает степень возвеличивания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом.
- issue: Соотношение действий Соломона и Бога
  choice: Сохранить и самостоятельное утверждение Соломона, и последующее действие Бога
  alternative: «Соломон был утверждён», что относило бы первое действие к неуказанному внешнему деятелю
  rationale: Еврейский текст сначала использует возвратную/непереходную форму о Соломоне, а затем прямо говорит, что Яхве был с ним и возвеличил его. Перевод не устраняет это смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным повествовательным тоном. «Утвердился в своём царстве» выбрано ради естественности, тогда как более буквальные и интерпретирующие варианты вынесены в примечание.
