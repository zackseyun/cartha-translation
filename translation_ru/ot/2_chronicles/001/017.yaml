base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: ru
  text: Из Египта они ввозили колесницу за шестьсот шекелей серебра[a], а коня — за сто пятьдесят шекелей. Таким же образом через них поставляли колесницы и коней всем царям хеттеев и царям Арама[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимали и выводили из Египта». В торговом контексте эти глаголы передают ввоз товара.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их рукой», то есть при их посредничестве или через их торговых представителей.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст: «Арам»; традиционный вариант — «Сирия».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: Из Египта они ввозили
  rationale: Два обычных глагола движения буквально означают «поднимали и выводили», но здесь, в контексте торговли и указания цены, описывают ввоз товаров из Египта. Русское «ввозили» естественно передаёт коммерческий смысл, а буквальная форма отмечена в сноске.
- source_word: מֶרְכָּבָה
  choice: колесницу
  rationale: Единственное число выражает цену одной товарной единицы; «колесница» прямо соответствует значению еврейского слова.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: за шестьсот шекелей серебра
  rationale: В еврейском тексте буквально названо «шестьсот серебра»; шекель как подразумеваемая весовая единица добавлен для понятности.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: а коня — за сто пятьдесят шекелей
  rationale: Обычное значение סוּס — «конь» или «лошадь». Единица цены эллиптически подразумевается из предыдущей части и повторена по-русски для ясности.
- source_word: וְכֵן
  choice: Так же
  rationale: Связка указывает на продолжение того же порядка торговли.
- source_word: בְּיָדָם יוֹצִיאוּ
  choice: через них их вывозили
  rationale: Оборот «их рукой» обозначает посредничество или агентность. «Через них» естественно передаёт идиому, а «вывозили» сохраняет торговое направление второй половины стиха. Безлично-неопределённая русская конструкция не навязывает сверх текста конкретного субъекта.
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: для всех царей хеттеев и царей Арама
  rationale: Предлог לְ здесь обозначает получателей или заказчиков. Название אֲרָם передано как «Арам», а не традиционным географическим соответствием «Сирия».
