    rationale: Еврейское בְּיָדָם обозначает посредничество/агентность, а конечный объект глагола подразумевается из контекста. В русском два «их» подряд создают ненужную двусмысленность. Явное «колесницы и коней» безопасно раскрывает эллипсис, не меняя смысла.
  - severity: low
    issue: Связка «Так же» стилистически неудачна.
    rationale: «Таким же образом» естественнее вводит продолжение описанного торгового порядка.
