review_pass:
  verdict: revise
  source_fidelity: 'Начальная торговая формулировка («ввозили ... из Египта») удачно передаёт в данном контексте сочетание «поднимали и выводили». Цены и исторические названия переданы точно. Однако «через них их вывозили» делает агентность и подразумеваемый объект неясными: два местоимения в непосредственном соседстве могут быть отнесены к царям, а не к колесницам и коням. В конце стиха уместнее явно назвать подразумеваемые товары, сохранив идиому посредничества.'
  naturalness: «Так же» в этой позиции менее естественно, чем «Таким же образом», а сочетание «через них их вывозили» тяжеловесно и двусмысленно для современного литературного русского. «Поставляли ... всем царям» естественно выражает коммерческий контекст и направление לְ.
  terminology: «Колесница», «шекели серебра», «хеттеи» и «Арам» приемлемы и соответствуют исходному тексту. «Конь» также допустим. Сноску об Араме следует сохранить; она не навязывает традиционное отождествление «Сирия» как основной перевод.
  issues:
