base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: ru
  text: И обратился[a] Соломон ко всему Израилю — к начальникам тысяч и сотен, к судьям и ко всем предводителям во всём Израиле — главам родов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сказал».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение означает «главы отцовских домов», то есть главы родов или родовых объединений.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: обратился
  rationale: Основное значение глагола — «сказал», однако здесь далее перечислены адресаты и не приводится содержание речи. Русское «обратился к» естественно передаёт публичное обращение, не добавляя его содержания.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ко всему Израилю
  rationale: Сохранено собирательное обозначение народа и повторяющаяся в Писании формула «весь Израиль».
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: к начальникам тысяч и сотен
  rationale: שָׂרֵי обозначает начальников или правителей; «тысячи и сотни» сохранены как названия военных либо административных подразделений без чрезмерного уточнения их характера.
- source_word: וְלַשֹּׁפְטִים
  choice: к судьям
  rationale: Прямое и устоявшееся обозначение носителей судебно-управленческой должности.
- source_word: וּלְכֹל נָשִׂיא לְכָל יִשְׂרָאֵל
  choice: и ко всем предводителям во всём Израиле
  rationale: נָשִׂיא может означать вождя, начальника или предводителя. «Предводитель» передаёт руководящее положение без современного монархического оттенка слова «князь»; еврейское единственное число с כֹּל естественно передано русским множественным числом.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главам родов
  rationale: Фраза обозначает глав патрилинейных родовых или отцовских объединений. «Главы родов» понятно современному читателю и сохраняет историческую социальную структуру; буквальная идиома пояснена в сноске.
theological_decisions:
- issue: Передача родственно-административного выражения רָאשֵׁי הָאָבוֹת
  choice: главам родов
  alternative: главам отцовских домов
  rationale: Выражение относится не просто к отдельным семьям, а к руководителям родовых объединений. Основной текст передаёт функцию естественным русским языком, а сноска сохраняет патрилинейную форму еврейской идиомы.
- issue: Соотношение «предводителей» и «глав родов»
  choice: тире, указывающее на пояснительное приложение
  alternative: перечисление как двух самостоятельных групп
  rationale: Рָאשֵׁי הָאָבוֹת наиболее естественно понимать как приложение, поясняющее, кто именно назван предводителями. При этом перевод не вводит дополнительного союза, который сделал бы их отдельной группой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис перечисления сохранён, но оформлен тире для ясности; архаизмы и конфессионально окрашенные термины избегаются.
