  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: ru
  text: 'И сказал Бог Соломону: «Так как это было в твоём сердце и ты не просил ни богатства, ни имущества, ни почёта, ни жизни тех, кто тебя ненавидит[a], не просил и долгих лет[b], а попросил себе мудрости и знания, чтобы судить Мой народ, над которым Я поставил тебя царём, —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жизни твоих врагов»; буквально: «жизни ненавидящих тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «многих дней»; то есть долгой жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Так как
  rationale: Передаёт причинную связь естественным современным русским языком.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: это было у тебя на сердце
  rationale: Сохраняет образ сердца как средоточия внутреннего намерения, не сводя выражение только к желанию.
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  choice: богатства, имущества, почёта
  rationale: Различает материальное богатство, конкретные владения и общественное уважение.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: жизни ненавидящих тебя
  rationale: Близко следует единственному числу נֶפֶשׁ и причастной форме שֹׂנְאֶיךָ; смысл лишения жизни сохраняется без замены на более широкое «враги».
- source_word: יָמִים רַבִּים
  choice: долгих лет
  rationale: Естественно передаёт идиоматический смысл продолжительной жизни; буквальное «много дней» отмечено в сноске.
- source_word: חָכְמָה וּמַדָּע
  choice: мудрости и знания
  rationale: Сохраняет различие между мудростью и знанием.
- source_word: לְךָ
  choice: себе
  rationale: Кратко и естественно передаёт дательный оттенок получателя дара.
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: чтобы судить
  rationale: Передаёт целевое значение и сохраняет судебно-правительственный смысл глагола שׁפט.
- source_word: הִמְלַכְתִּיךָ עָלָיו
  choice: над которым Я поставил тебя царём
  rationale: 'Ясно передаёт каузативную форму: Бог сделал Соломона царём над народом.'
theological_decisions:
- issue: Передача אֱלֹהִים
  choice: Бог
  alternative: Господь
  rationale: В еврейском тексте употреблено אֱלֹהִים, а не имя YHWH; поэтому выбран прямой эквивалент «Бог».
- issue: Значение תִּשְׁפּוֹט в царском контексте
  choice: судить
  alternative: управлять
  rationale: «Судить» сохраняет основное значение еврейского глагола и не устраняет присущую контексту связь суда с царским управлением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повторы глагола «просить» и образ сердца сохранены. Стих синтаксически продолжается в следующем стихе, поэтому финальное тире перед закрывающей кавычкой оставляет высказывание незавершённым.
