base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: ru
  text: 'И пришёл он к царю, и царь спросил его: «Михей, идти ли нам войной на Рамот-Галаад или мне воздержаться?» Он ответил: «Идите и преуспейте — они будут отданы в ваши руки»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ответ Михея, вероятно, ироничен или саркастичен, как показывает дальнейший контекст; однако в самом еврейском тексте ирония прямо не обозначена.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришёл он
  rationale: Последовательная форма повествования обозначает очередное событие; русский союз «и» естественно сохраняет связь с предшествующим рассказом.
- source_word: מִיכָה
  choice: Михей
  rationale: Традиционная и узнаваемая русская передача имени пророка Михея, сына Имлы.
- source_word: הֲנֵלֵךְ
  choice: идти ли нам
  rationale: Сохраняет совещательный вопрос первого лица множественного числа без излишнего усиления модальности.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот Галаадский
  rationale: Устоявшаяся русская библейская форма географического названия, при этом понятная современному читателю.
- source_word: לַמִּלְחָמָה
  choice: войной
  rationale: 'Естественно по-русски передаёт целевое значение: отправиться к городу для военного похода.'
- source_word: אִם אֶחְדָּל
  choice: или мне воздержаться
  rationale: Сохраняет заметный в еврейском переход от «нам» к первому лицу единственного числа — личному решению царя.
- source_word: עֲלוּ
  choice: Идите
  rationale: В данном военном контексте עלה означает выступить или направиться к месту; буквальное «поднимитесь» по-русски могло бы ошибочно восприниматься как указание встать.
- source_word: וְהַצְלִיחוּ
  choice: и добейтесь успеха
  rationale: Передаёт значение породы hифиль глагола צלח — иметь успех, преуспеть — естественным современным русским выражением.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: они будут отданы в ваши руки
  rationale: Сохраняет страдательную форму, грамматическое множественное число подразумеваемого субъекта и древнееврейский образ передачи во власть победителя.
theological_decisions:
- issue: Ироничен ли первоначальный ответ Михея
  choice: Сохранить внешне утвердительную формулировку ответа, не обозначая иронию прямо в основном тексте
  alternative: Добавить «насмешливо», «иронически» либо кавычками и интонационными средствами явно представить ответ как сарказм
  rationale: Контекст показывает, что ответ, вероятнее всего, ироничен, однако сама еврейская формулировка не содержит явного лексического указателя иронии. Основной текст поэтому сохраняет напряжение, а пояснение вынесено в сноску.
- issue: Неопределённый субъект множественного числа וְיִנָּתְנוּ
  choice: Передать местоимением «они», не уточняя референт
  alternative: Уточнить как «враги» или изменить число и передать «город будет отдан»
  rationale: Еврейский текст употребляет форму множественного числа, но не называет её субъект. Уточнение могло бы необоснованно устранить подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; сохранены переход «нам» — «мне», неопределённый субъект «они» и не обозначенная явно ирония. Маркер сноски поставлен после всей реплики Михея, к которой относится пояснение.
