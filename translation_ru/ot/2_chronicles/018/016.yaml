  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: ru
  text: 'И он сказал: «Я видел: весь Израиль рассеян по горам, как овцы, у которых нет пастуха. И Яхве сказал: „У них нет господ[a]; пусть каждый возвратится в свой дом с миром“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово стоит во множественном числе; также возможно: «владыки» или «правители».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: рассеянный
  rationale: Страдательное причастие изображает Израиль разрозненным и рассеянным после поражения; единственное число согласовано с собирательным «Израиль».
- source_word: עַל הֶהָרִים
  choice: по горам
  rationale: Естественно передаёт местное значение предлога и картину народа, рассеянного по горной местности.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: словно овец, у которых нет пастуха
  rationale: Сохраняет сравнение и относительную конструкцию оригинала; винительный падеж обусловлен синтаксисом русского предложения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: у них нет господина
  rationale: Русское единственное число естественно выражает собирательный смысл отсутствия правителя; формальный множественный показатель еврейского текста отмечен в сноске.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: пусть каждый возвратится в свой дом
  rationale: «Пусть» передаёт юссивное значение, а «каждый» — распределительное אִישׁ без ненужного гендерного утяжеления.
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Устойчивая библейская формула, сохраняющая широкий смысл благополучного и невредимого возвращения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале прямо употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Число и смысл אֲדֹנִים
  choice: господина
  alternative: господ
  rationale: По форме еврейское слово стоит во множественном числе, но в контексте гибели царя выражает отсутствие правителя у народа. Естественное русское единственное число оставляет политико-военный смысл ясным, а формальная особенность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис близок к оригиналу, но не калькирован; неоднозначность числа אֲדֹנִים сохранена посредством сноски.
