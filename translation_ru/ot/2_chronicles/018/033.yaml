base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: ru
  text: 'Но один человек натянул лук наугад[a] и поразил царя Израиля между сочленениями доспеха и нагрудником[b]. Тогда царь сказал вознице: «Разворачивай колесницу[c] и вывези меня из стана, потому что я ранен».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный буквальный оттенок: «по простоте своей» или «не имея злого умысла». Здесь, вероятнее всего, имеется в виду выстрел без прицеливания в определённого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Точные названия частей доспеха неясны. Возможный перевод: «между прилегающими частями доспеха и панцирем»; в любом случае стрела попала в промежуток между защитными элементами.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «поверни руку». Вероятно, это команда развернуть колесницу или направить её прочь от места боя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Но один человек
  rationale: Сочетание сохраняет неопределённость אִישׁ и передаёт повествовательный поворот; стрелявший не назван и не представлен как намеренно целившийся в царя.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: натянул лук
  rationale: Естественно передаёт древнееврейское выражение о подготовке и произведении выстрела из лука, не добавляя отдельного глагола «выстрелил».
- source_word: לְתֻמּוֹ
  choice: наугад
  rationale: В контексте сражения выражение указывает на отсутствие определённой цели, хотя буквально может иметь оттенок простоты или невиновности.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Передаёт действие נכה как попадание и нанесение удара; состояние царя затем отдельно выражено словами «я ранен».
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: между чешуйчатым доспехом и нагрудником
  rationale: Передаёт попадание в уязвимый промежуток между частями защитного вооружения; точное значение названий элементов доспеха остаётся не вполне ясным и отмечено в сноске.
- source_word: לָרַכָּב
  choice: вознице
  rationale: Здесь слово обозначает управлявшего боевой колесницей человека.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: Разворачивай колесницу
  rationale: Русская формулировка естественно передаёт смысл команды вознице; буквальный древнееврейский образ «поверни руку» сохранён в сноске.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: и вывези меня из стана
  rationale: Сохраняет военное значение מַחֲנֶה — стан, войско или расположение воинов — и учитывает передвижение царя на колеснице.
- source_word: כִּי הָחֳלֵיתִי
  choice: потому что я ранен
  rationale: В непосредственном контексте попадания стрелы глагол означает, что царь ранен или ослаблен ранением; наречие степени в исходном тексте прямо не выражено.
