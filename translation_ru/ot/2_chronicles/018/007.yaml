source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: ru
  text: 'Тогда царь Израиля сказал Иосафату: «Есть ещё один человек, через которого можно вопросить Яхве[a], но я ненавижу его, потому что он никогда не пророчествует обо мне ничего доброго, а всегда только дурное. Это Михей, сын Имлы». Иосафат сказал: «Пусть царь так не говорит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством которого можно вопросить Яхве».'
    reason: Еврейское מֵאֹתוֹ буквально означает «от него»; в данном контексте оно указывает на пророка как на посредника при обращении к Яхве.
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: Есть ещё один человек
  rationale: Сочетание עוֹד с אִישׁ אֶחָד указывает на одного остающегося доступным человека; эта формулировка естественно передаёт смысл по-русски.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: через которого можно вопросить Яхве
  rationale: В пророческом контексте דרשׁ означает обращаться к Богу за ответом, а מֵאֹתוֹ указывает на посредническую роль пророка. Глагол «вопросить» сохраняет достоинство и библейский оттенок, оставаясь понятным.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: но я ненавижу его
  rationale: Перфект выражает устойчивое отношение царя; русское настоящее время точно передаёт продолжающееся состояние. Противительный союз естественно следует из контекста.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: потому что он никогда не пророчествует обо мне ничего доброго
  rationale: Отрицание с причастием описывает характерное, повторяющееся действие. «Никогда» передаёт этот обычный характер, а «ничего доброго» естественно воспроизводит לְטוֹבָה.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: а всегда только дурное
  rationale: Буквальное «все его дни — к дурному» означает постоянно неблагоприятное пророчество. Слово «дурное» сохраняет противопоставление «доброму», не уточняя, идёт ли речь о нравственном зле, беде или неблагоприятном исходе.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: Михей, сын Имлы
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; родственная связь передана прямо.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Пусть царь так не говорит
  rationale: Запретительная конструкция אַל с имперфектом выражает почтительное косвенное предостережение, обращённое к царю; русский оборот сохраняет и смысл, и уважительный тон.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение לְרָעָה в словах Ахава
  choice: дурное
  alternative: зло; беду; несчастье
  rationale: Контекст допускает как неблагоприятное содержание пророчества, так и предсказание беды. Более широкое «дурное» сохраняет эту смысловую напряжённость и параллель с «добрым».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Реплики переданы естественно, при этом сохранены почтительность Иосафата, резкость слов царя и неоднозначность выражения о «дурном».
