id: 2CH.18.13
reference: 2 Chronicles 18:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: ru
  text: 'Но Михей сказал: «Жив Яхве! Что скажет мой Бог, то я и буду говорить».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но ... сказал
  rationale: Последовательная форма продолжает повествование, однако в контексте ответ Михея противопоставлен уговорам посланника в предыдущем стихе; союз «но» естественно передаёт этот контраст.
- source_word: מִיכָיְהוּ
  choice: Михей
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: Краткая формула клятвы буквально и естественно передаётся по-русски как «Жив Яхве!»; восклицательная пунктуация помогает выразить её клятвенную силу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, без замены титулом.
- source_word: כִּי אֶת אֲשֶׁר
  choice: Что
  rationale: В составе клятвенной формулы כִּי вводит обязательство, а אֶת אֲשֶׁר обозначает содержание речи; русская конструкция «что скажет... то...» точно и естественно передаёт связь частей.
- source_word: יֹאמַר
  choice: скажет
  rationale: Имперфект указывает на то, что Бог сообщит в данной ситуации; будущее время наиболее естественно в русском контексте.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Сохранён явно выраженный суффикс первого лица единственного числа.
- source_word: אֹתוֹ
  choice: то
  rationale: Возобновляющее объектное местоимение передано соотносительным «то», которое отсылает к сказанному Богом.
- source_word: אֲדַבֵּר
  choice: я и буду говорить
  rationale: Будущее время сохраняет решимость пророка, а частица «и» естественно подчёркивает, что он произнесёт именно данное Богом слово.
theological_decisions:
- issue: Передача имени יְהוָה в формуле клятвы
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация сохраняет это имя и не заменяет его титулом.
- issue: Характер начальных слов как клятвы
  choice: «Жив Яхве!» как самостоятельная клятвенная формула
  alternative: «Как жив Яхве, ...»
  rationale: Обе передачи возможны, но самостоятельное восклицание сохраняет буквальную форму древнееврейского выражения и его торжественную силу, не меняя смысла обязательства.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой речью. Синтаксис «что... то...» сохраняет семитскую соотносительную структуру без неестественной буквальности.
