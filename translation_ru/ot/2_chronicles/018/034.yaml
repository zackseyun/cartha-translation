base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: ru
  text: В тот день битва становилась всё ожесточённее. Царь Израиля до вечера держался прямо в колеснице лицом к арамеям, а во время захода солнца[a] умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда зашло солнце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: битва становилась всё ожесточённее
  rationale: Буквально битва «поднималась»; при таком подлежащем глагол עלה передаёт нарастание напряжённости и силы боя. Русское выражение сохраняет образ постепенного усиления без неестественного буквализма.
- source_word: הָיָה מַעֲמִיד
  choice: держался прямо
  rationale: Сочетание היה с причастием обозначает продолжительное состояние или действие, а каузативная форма עמד допускает смысл «удерживать в стоячем положении». В контексте раненый царь продолжал сохранять вертикальное положение в колеснице; формулировка не уточняет сверх текста, поддерживали ли его другие.
- source_word: בַּמֶּרְכָּבָה
  choice: в колеснице
  rationale: Определённая форма существительного естественно передаётся по-русски без добавления притяжательного местоимения «своей», хотя принадлежность ясна из контекста.
- source_word: נֹכַח אֲרָם
  choice: лицом к арамеям
  rationale: נֹכַח означает положение напротив или лицом к кому-либо. Название אֲרָם здесь метонимически обозначает арамейское войско; «к арамеям» ясно и естественно в контексте боя.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: во время захода солнца
  rationale: Еврейское выражение буквально говорит о времени «прихода» солнца, то есть его захода. Выбранный вариант сохраняет развёрнутую временную формулу и звучит естественно по-русски.
