  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: ru
  text: 'И вот, когда военачальники колесничного войска увидели Иосафата, они сказали: «Это царь Израиля»[a]. Они развернулись против него, чтобы сразиться с ним. Но Иосафат вскричал, и Яхве помог ему, а Бог отвёл их от него[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он — царь Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог направил их прочь от него». Еврейский глагол может означать, что кого-либо отвели или направили в сторону от намеченной цели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: И вот, когда … увидели
  rationale: Оборот вводит очередное событие повествования. «И вот, когда» передаёт его функцию естественно для современного русского языка, не утяжеляя фразу буквальным «и случилось, когда».
- source_word: שָׂרֵי הָרֶכֶב
  choice: начальники колесничих отрядов
  rationale: שָׂרֵי обозначает военачальников, а הָרֶכֶב — колесничее войско. Такой перевод яснее показывает, что речь идёт не о начальниках отдельных колесниц, а о командирах соответствующих воинских подразделений.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: Это царь Израиля
  rationale: Именное предложение выражает опознание предполагаемой цели. Русское «Это царь Израиля» естественно в данной ситуации; грамматически возможное «Он — царь Израиля» отмечено в сноске.
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: они повернули к нему
  rationale: סבב может описывать поворот, движение к цели или окружение. Контекст указывает на перенаправление атаки к Иосафату, но не требует утверждать, что его уже окружили.
- source_word: לְהִלָּחֵם
  choice: чтобы сразиться с ним
  rationale: Инфинитив выражает цель враждебного движения. Добавленное по-русски «с ним» лишь естественно обозначает уже названный объект действия.
- source_word: וַיִּזְעַק
  choice: вскричал
  rationale: זעק обозначает сильный крик, нередко в бедствии. «Вскричал» сохраняет интенсивность, но не добавляет прямо не названного адресата или содержания крика.
- source_word: וַיהוָה עֲזָרוֹ
  choice: Яхве помог ему
  rationale: עזר прямо означает «помогать». Личное имя יְהוָה передано как «Яхве», в отличие от следующего אֱלֹהִים — «Бог».
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: Бог отвёл их от него
  rationale: В этой конструкции каузативная форма סות означает, что Бог направил нападавших прочь от Иосафата. «Отвёл» естественно передаёт результат и сохраняет прямое указание на Божье действие, не придавая глаголу ненужного нравственного оттенка «соблазнил».
theological_decisions:
- issue: Различение יְהוָה и אֱלֹהִים в одном стихе
  choice: Яхве … Бог
  alternative: Господь … Бог
  rationale: Исходный текст последовательно употребляет личное имя יְהוָה, а затем общее обозначение אֱלֹהִים. Перевод сохраняет это различие.
- issue: Следует ли прямо назвать крик Иосафата молитвой или просьбой о помощи
  choice: Иосафат вскричал
  alternative: Иосафат воззвал к Яхве / закричал о помощи
  rationale: Хотя дальнейшая помощь Яхве позволяет видеть связь между криком и Божьим вмешательством, в самом глагольном обороте адресат и содержание крика не названы. Перевод не делает подразумеваемое явным.
- issue: Характер Божьего воздействия на нападавших
  choice: Бог отвёл их от него
  alternative: Бог заставил их отступить от него
  rationale: Текст ясно сохраняет Божью инициативу, но редкий глагол допускает оттенки «отвести», «направить прочь», «отвлечь». Основной перевод не уточняет способ воздействия сверх сказанного.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка сглажен: длинная еврейская цепочка действий разделена на предложения ради ясности. «Колесничьи отряды» понятно обозначают воинские подразделения; архаизмы и конфессионально окрашенные добавления исключены. Все сноски отмечены в основном тексте.'
