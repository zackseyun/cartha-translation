  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: ru
  text: 'Тогда царь сказал ему: «Сколько раз мне ещё требовать от тебя клятвы говорить мне только правду во имя Яхве?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное передано титулом без добавления имени, которого нет в еврейском тексте.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Сколько раз ... ещё
  rationale: Русская идиома естественно передаёт буквальное «до скольких раз» и раздражённо-настойчивый тон вопроса.
- source_word: מַשְׁבִּיעֶךָ
  choice: брать с тебя клятву
  rationale: Порода hифиль глагола שבע означает побуждать кого-либо поклясться, то есть связывать его клятвой; выбранная формулировка ясна и современна.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: чтобы ты говорил мне только истину
  rationale: После глагола заклятия отрицание с ограничительной частицей רַק естественно передаётся по-русски положительной конструкцией «только истину», без изменения содержания.
- source_word: בְּשֵׁם יְהוָה
  choice: во имя Яхве
  rationale: Формула обозначает речь, произносимую с опорой на имя и авторитет Бога; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет различие между личным именем и титулом, не привнося конфессионального толкования.
- issue: Смысл формулы בְּשֵׁם יְהוָה
  choice: во имя Яхве
  alternative: именем Яхве
  rationale: Сохранена возможная связь как с торжественной клятвой, так и с пророческой речью от Божьего имени; перевод не сужает формулу до одного из этих оттенков.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Формулировка сохраняет настойчивость вопроса и юридико-религиозный оттенок клятвы, избегая архаичного «заклинаю тебя».
