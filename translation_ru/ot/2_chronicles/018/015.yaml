revisions:
- from: 'Тогда царь сказал ему: «Сколько раз мне ещё брать с тебя клятву, чтобы ты говорил мне только истину во имя Яхве?»'
  to: 'Тогда царь сказал ему: «Сколько раз мне ещё требовать от тебя клятвы говорить мне только правду во имя Яхве?»'
  rationale: Заменён оборот «брать с тебя клятву» на более точное «требовать от тебя клятвы», а «истину» — на идиоматическое в русской прямой речи «правду». Сохранены повествовательная последовательность, титул «царь», настойчивое «ещё», исключительность רַק, божественное имя и исходная широта формулы «во имя Яхве».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:41:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: царь с раздражённой настойчивостью требует, чтобы пророк говорил ему исключительно истину, и сохраняется формула «во имя Яхве». Однако «брать с тебя клятву» несколько смещает глагол הִשְׁבִּיעַ к получению уже данной клятвы, тогда как исходный текст обозначает побуждение/приведение адресата к клятве.'
  naturalness: «Брать с тебя клятву, чтобы ты говорил» звучит тяжеловесно и допускает не вполне ясную связь между клятвой и последующим придаточным. «Требовать от тебя клятвы говорить» точнее связывает клятву с её содержанием и остаётся современным литературным русским.
  terminology: «Яхве» последовательно передаёт יהוה. «Правду» в сочетании «говорить правду» — естественный русский эквивалент אֱמֶת в данном контексте; он не ослабляет требование «только». Формула «во имя Яхве» сохранена без догматического сужения её возможного отношения к клятве или пророческой речи.
  issues:
