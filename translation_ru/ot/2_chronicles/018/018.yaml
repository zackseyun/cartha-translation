  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: ru
  text: 'И сказал он: «Итак, выслушайте слово Яхве: я видел Яхве, сидящего на Своём престоле, и всё небесное воинство[a], стоявшее по правую и по левую руку от Него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё воинство небес»; возможные переводы: «весь небесный сонм» или «всё небесное войско».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: итак
  rationale: Передаёт выводный переход от предшествующего разговора и естественно вводит торжественное пророческое возвещение.
- source_word: שִׁמְעוּ
  choice: выслушайте
  rationale: Форма повелительного наклонения во множественном числе призывает присутствующих внимательно принять последующее пророческое слово.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт тетраграмматон как личное имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного имени Бога сохраняет прямое употребление тетраграмматона в еврейском тексте.
- source_word: רָאִיתִי
  choice: я видел
  rationale: Простая форма прошедшего времени естественно передаёт сообщение Михея о видении.
- source_word: יוֹשֵׁב
  choice: сидящего
  rationale: Причастие прямо описывает Яхве восседающим на престоле, без дополнительного истолкования образа.
- source_word: כִּסְאוֹ
  choice: Своём престоле
  rationale: Возвратное местоимение естественно для русского языка при соотнесении престола с субъектом оборота; прописная буква поддерживает принятый уважительный регистр.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: всё небесное воинство
  rationale: Передаёт собирательный смысл צָבָא и небесную сферу; сохраняет возможность понимания как организованного небесного сонма или войска.
- source_word: עֹמְדִים
  choice: стоявшее
  rationale: Передаёт позу небесного воинства в сцене небесного совета; согласование с русским собирательным существительным требует единственного числа.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: по правую и по левую руку от Него
  rationale: Естественный и торжественный русский оборот, точно сохраняющий симметричное расположение по обе стороны престола.
theological_decisions:
- issue: Передача имени יְהוָה в пророческой формуле и описании видения
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В обоих случаях исходный текст прямо употребляет тетраграмматон; передача «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Идентичность «небесного воинства»
  choice: Сохранено обобщённое обозначение без уточнения состава
  alternative: ангелы; небесный совет
  rationale: Еврейское выражение не называет участников видения исключительно ангелами и допускает более широкий образ небесного сонма или войска; перевод не должен сужать его богословский смысл.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным пророческим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис видения сохранён как единая прямая речь.
