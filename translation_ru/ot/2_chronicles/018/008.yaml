source:
  edition: WLC
  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֵ֖ר מיכהו בֶן יִמְלָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: ru
  text: 'Тогда царь Израиля позвал одного придворного[a] и сказал: «Поскорее приведи Михея, сына Имлы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «одного евнуха», или «одного царского служителя»; еврейское слово может обозначать как евнуха в буквальном смысле, так и придворного должностного лица.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В данном повествовательном контексте глагол вводит обращение царя к находящемуся при нём служителю; «позвал» естественно и точно передаёт действие.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямое соответствие еврейскому сочетанию; определённость ясна из контекста.
- source_word: אֶל סָרִיס אֶחָד
  choice: одного придворного
  rationale: סָרִיס может обозначать как евнуха, так и придворного или царского служителя. Здесь подчёркнута его служебная роль, а физический статус текст не уточняет; неоднозначность сохранена в сноске.
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычный повествовательный глагол речи, естественно переданный по-русски.
- source_word: מַהֵר
  choice: поскорее приведи
  rationale: Императив выражает срочность поручения. «Поскорее» сохраняет повелительную настойчивость и звучит естественно в прямой речи.
- source_word: מיכהו
  choice: Михея
  rationale: Использована традиционная русская форма библейского имени Михей в требуемом винительном падеже.
- source_word: בֶן יִמְלָא
  choice: сына Имлы
  rationale: Прямая и естественная передача патронимического оборота с русским склонением.
