base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: ru
  text: 'Царь Израиля сказал Иосафату: «Я переоденусь[a] и вступлю в бой, а ты надень свои одежды». Царь Израиля переоделся, и они вступили в бой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую форму можно также понять как повеление: «Переоденься». Однако продолжение фразы и следующее предложение показывают, что речь идёт о намерении самого царя Израиля переодеться.'
    reason: Сохранение грамматической неоднозначности краткой еврейской формы.
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: я переоденусь
  rationale: Форма кратка и грамматически допускает повелительное прочтение, однако параллельное וָבוֹא и последующее сообщение о том, что переоделся именно царь Израиля, указывают на первое лицо. «Переоденусь» естественно передаёт намерение изменить внешний вид ради неузнаваемости.
- source_word: וָבֹא
  choice: и вступлю
  rationale: В сочетании с בַמִּלְחָמָה глагол בוא означает вхождение в сражение; «вступлю в бой» естественно и точно передаёт движение и первое лицо в данной реплике.
- source_word: בַמִּלְחָמָה
  choice: в бой
  rationale: Сочетание с глаголом движения по-русски идиоматично передаётся как «вступить в бой».
- source_word: וְאַתָּה
  choice: а ты
  rationale: Местоимение выражает контраст между переодеванием царя Израиля и одеждой Иосафата.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: надень свои одежды
  rationale: Сохранено общее значение בְּגָדִים — «одежды»; уточнение «царские» не внесено в основной текст, поскольку его нет в еврейском оригинале.
- source_word: וַיָּבֹאוּ
  choice: они вступили
  rationale: Множественное число относится к обоим царям; повтор «вступили в бой» сохраняет связь с их предварительным разговором.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямое и традиционное русское соответствие титулу.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Устоявшаяся русская библейская форма имени.
