  terminology: «Иосафат», «пророк Яхве» и «Яхве» уместны. Родительный оборот «пророка Яхве» естественно передаёт отношение пророка к Яхве; не следует добавлять в основной текст «вопросить Яхве через него», поскольку это эксплицирует подразумеваемое.
