source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: ru
  text: 'Но Иосафат сказал: «Нет ли здесь ещё пророка Яхве, чтобы мы спросили у него?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: Форма продолжает повествование, однако по контексту слова Иосафата противопоставлены единодушному ответу уже собранных пророков; союз «но» естественно передаёт этот поворот.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Традиционная и общепонятная русская форма библейского имени.
- source_word: הַאֵין
  choice: Нет ли
  rationale: Отрицательный вопрос выражает поиск подтверждения и естественно передаётся по-русски конструкцией «нет ли».
- source_word: פֹּה
  choice: здесь
  rationale: Прямой современный эквивалент наречия места.
- source_word: נָבִיא לַיהוָה
  choice: пророка Яхве
  rationale: 'Ламед обозначает принадлежность или отношение: речь идёт о пророке, принадлежащем Яхве и говорящем от Его имени. Родительный оборот краток и сохраняет эту связь.'
- source_word: עוֹד
  choice: ещё
  rationale: Слово указывает на наличие дополнительного пророка помимо уже выслушанных; «ещё» сохраняет и значение продолжения, и контекстуальный смысл дополнительности.
- source_word: וְנִדְרְשָׁה
  choice: чтобы спросить
  rationale: Когортатив первого лица множественного числа выражает предлагаемое совместное действие. В данном контексте דרשׁ означает обратиться за пророческим ответом; простое «спросить» звучит естественно по-русски.
- source_word: מֵאֹתוֹ
  choice: у него
  rationale: Предлог מן с местоименным суффиксом обозначает лицо, у которого хотят получить ответ; русская конструкция «спросить у него» передаёт это непосредственно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное covenantное имя Бога, прямо стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя יהוה. Форма «Яхве» сохраняет имя, тогда как «Господь» передаёт традиционную замену титулом.
- issue: У кого предполагается получить ответ
  choice: спросить у пророка
  alternative: через него вопросить Яхве
  rationale: Форма מֵאֹתוֹ буквально указывает на пророка как на того, у кого спрашивают. Вариант «через него вопросить Яхве» верно раскрывает посреднический контекст, но добавляет не выраженное здесь прямо дополнение «Яхве».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис вопроса сохранён без архаизмов; имя «Яхве» передано прямо.
