  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: ru
  text: 'Тогда царь Израиля сказал Иосафату: «Разве я не говорил тебе, что он не будет пророчествовать обо мне ничего доброго, а только беду?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующей реплике.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямой и привычный русский эквивалент еврейской сопряжённой конструкции.
- source_word: אֶל יְהוֹשָׁפָט
  choice: Иосафату
  rationale: Дательный падеж естественно обозначает адресата речи; титул не добавлен, поскольку его нет в исходном тексте.
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: Разве я не говорил тебе
  rationale: «Разве не» передаёт риторический вопрос, ожидающий согласия, а несовершенный вид «говорил» естественен при напоминании о прежнем высказывании.
- source_word: לֹא יִתְנַבֵּא
  choice: он не будет пророчествовать
  rationale: Имперфект передаёт ожидаемое или характерное будущее действие в составе ранее высказанного суждения.
- source_word: עָלַי
  choice: обо мне
  rationale: Предлог указывает на предмет пророчества; «обо мне» звучит естественно и не вносит значения пользы.
- source_word: טוֹב
  choice: добро
  rationale: Субстантивированное прилагательное сохранено как краткий антонимический член противопоставления.
- source_word: כִּי אִם
  choice: а только
  rationale: Оборот выражает сильное ограничительное противопоставление.
- source_word: לְרָע
  choice: беду
  rationale: В данном контексте רַע обозначает не нравственное зло, а неблагоприятный, бедственный исход; «беду» ясно передаёт этот смысл.
theological_decisions:
- issue: Характер предсказываемого сообщения
  choice: «добро, а только беду»
  alternative: «добро, а только зло»
  rationale: «Беда» отражает контекст неблагоприятного пророчества и не создаёт впечатления, будто пророк возвещает нравственное зло. При этом противопоставление положительного и губительного исходов сохранено.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис прост и доступен; имя передано в традиционной русской библейской форме «Иосафат».
