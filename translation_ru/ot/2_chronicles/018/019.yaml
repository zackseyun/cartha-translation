base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: ru
  text: 'И сказал Яхве: «Кто склонит[a] Ахава, царя Израиля, чтобы он пошёл и пал в Рамофе-Галааде?» И один говорил одно, другой — другое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уговорит», «увлечёт» или «обманет».'
    reason: Лексическая многозначность еврейского יְפַתֶּה.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано транслитерацией личного имени Бога, а не заменено титулом.
- source_word: יְפַתֶּה
  choice: увлечёт
  rationale: Порода пиэль глагола פתה допускает значения побуждения, склонения и обмана. «Увлечёт» сохраняет намеренное побуждение к роковому поступку, не сводя смысл в основном тексте только к прямому обману.
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: Ахава, царя Израиля
  rationale: Естественная русская аппозитивная конструкция, точно передающая имя и царский титул.
- source_word: וְיַעַל וְיִפֹּל
  choice: чтобы он пошёл и пал
  rationale: Сочетание союзов с имперфектами передаёт намеченную цель или результат; «пал» сохраняет военную идиому и подразумеваемую гибель.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: при Рамофе Галаадском
  rationale: Предлог «при» естественен для места сражения; топоним дан в принятой русской библейской форме.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: И один говорил так, а другой — иначе
  rationale: Естественно передаёт параллельную еврейскую конструкцию и различие предложений участников совета.
theological_decisions:
- issue: Участие Яхве в падении Ахава
  choice: Сохранить прямую постановку вопроса Яхве о том, кто увлечёт Ахава к походу и гибели.
  alternative: Ослабить причинность формулировками «повлияет» или «допустит, чтобы его увлекли».
  rationale: Еврейский текст изображает Яхве инициатором небесного совещания; перевод сохраняет эту богословскую напряжённость, не смягчая её толкованием.
- issue: Нравственный оттенок פתה
  choice: В основном тексте употребить «увлечёт».
  alternative: «уговорит», «склонит» или «обманет».
  rationale: Контекст далее связан с вводящим в заблуждение советом, однако сам глагол допускает более широкий диапазон. Сноска сохраняет значимые варианты.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис ясный и естественный; сохранены краткость небесного диалога, военная идиома «пал» и неоднозначность ключевого глагола.
