  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: ru
  text: 'И он сказал: «Я выйду и стану духом лжи[a] в устах всех его пророков». И он сказал: «Ты склонишь его[b], и тебе это удастся. Выйди и сделай так».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лживым духом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обманешь его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Я выйду
  rationale: Форма 1-го лица от יצא выражает намерение говорящего; «выйду» естественно передаёт направленность действия и сохраняет повтор с последующим повелением «выйди».
- source_word: וְהָיִיתִי
  choice: и стану
  rationale: Хотя буквально возможно «и буду», в предикативной конструкции היה обозначает принятие новой роли; «стану» ясно передаёт этот переход.
- source_word: לְרוּחַ שֶׁקֶר
  choice: духом лжи
  rationale: Сочетание характеризует дух как несущий ложь. «Дух лжи» близко к форме еврейского выражения и естественно звучит по-русски; вариант «лживым духом» указан в сноске.
- source_word: בְּפִי
  choice: в устах
  rationale: Сохранён образ речи, исходящей из уст пророков. «В устах» в данном возвышенном повествовательном контексте естественнее буквального «во рту».
- source_word: כָּל נְבִיאָיו
  choice: всех его пророков
  rationale: Передана полнота כָּל и местоименный суффикс 3-го лица; в контексте речь идёт о пророках Ахава.
- source_word: תְּפַתֶּה
  choice: Ты склонишь его
  rationale: Пиэль פתה может означать склонение или побуждение с оттенком обмана. «Склонишь» сохраняет широту значения, а более явное «обманешь» приведено в сноске.
- source_word: וְגַם תּוּכָל
  choice: и тебе это удастся
  rationale: יכל здесь обозначает не просто способность, а успешное осуществление замысла; естественная русская конструкция передаёт результативность и усилительное וגם.
- source_word: צֵא
  choice: Выйди
  rationale: Повелительная форма повторяет глагол יצא из начала речи; повтор сохранён.
- source_word: וַעֲשֵׂה כֵן
  choice: и сделай так
  rationale: Естественно и прямо передаёт идиоматическое повеление עשה כן.
theological_decisions:
- issue: Божественное дозволение или поручение обманной миссии в видении
  choice: Ответ передан как прямое одобрение и повеление осуществить предложенный замысел, без смягчения.
  alternative: Ослабить формулировку так, чтобы исключить причастность Бога к обману.
  rationale: Еврейский текст прямо сообщает о предложении духа и последующем повелении выйти и сделать именно так. Перевод сохраняет богословское напряжение повествования и не разрешает его поясняющей перефразировкой.
- issue: Различение двух говорящих в стихе
  choice: Во второй реплике употреблено «тот сказал», чтобы по-русски ясно показать смену говорящего, не вводя отсутствующего в стихе имени.
  alternative: Повторить «он сказал» или назвать второго говорящего Господом по контексту.
  rationale: Контекст определяет второго говорящего, но сам стих использует местоименное повествование. «Тот» устраняет неестественную русскую двусмысленность, оставаясь сдержанным и не добавляя имени.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Сохранены «в устах» и повтор «выйду — выйди», но устранены архаизмы. Строчные местоимения не вводят в текст отсутствующую в еврейском оригинале типографскую маркировку божественного лица.
