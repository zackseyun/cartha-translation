base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: ru
  text: Иосафат обладал большим богатством и пользовался большим почётом, а также породнился с Ахавом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключил с Ахавом брачный союз».'
    reason: Лексическая альтернатива для וַיִּתְחַתֵּן, подчёркивающая династический характер связи.
lexical_decisions:
- source_word: וַיְהִי לִיהוֹשָׁפָט
  choice: У Иосафата было
  rationale: Естественная русская конструкция обладания передаёт еврейское сочетание היה с ל; начальное וַ вводит дальнейшее повествование и не требует отдельного слова «теперь».
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Слово обозначает материальное изобилие; «богатство» ясно и естественно в современном русском языке.
- source_word: וְכָבוֹד
  choice: и почёт
  rationale: В царском и общественном контексте речь идёт о высоком положении и уважении, а не о видимой славе.
- source_word: לָרֹב
  choice: великое
  rationale: Выражает большую степень или изобилие и по смыслу относится к богатству и почёту; согласование в единственном числе делает русскую фразу естественной, не исключая распространения характеристики на оба понятия.
- source_word: וַיִּתְחַתֵּן
  choice: породнился через брак
  rationale: Порода hitpael от חתן означает вступление в брачное родство; формулировка не утверждает, что Иосафат лично женился.
- source_word: לְאַחְאָב
  choice: с Ахавом
  rationale: Русское управление с глаголом «породниться» естественно требует предлога «с» и передаёт взаимную родственную связь.
theological_decisions:
- issue: Характер связи Иосафата с Ахавом в וַיִּתְחַתֵּן לְאַחְאָב
  choice: он породнился с Ахавом через брак
  alternative: он заключил с Ахавом брачный союз
  rationale: Основной текст сохраняет династический семейный смысл и не создаёт впечатления, будто Иосафат сам вступил в брак с Ахавом; точная семейная схема в данном стихе не уточняется.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаического «и было». Имя «Иосафат» дано в принятой русской библейской форме.
