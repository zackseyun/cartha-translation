  source_fidelity: 'В целом смысл передан верно: עֹשֶׁר — материальное богатство, כָּבוֹד — высокий общественный почёт/статус, а וַיִּתְחַתֵּן לְאַחְאָב описывает установление брачного родства с Ахавом, не личный брак Иосафата. Однако «великое» в исходной русской фразе грамматически относится только к «богатство», тогда как לָרֹב характеризует оба предшествующих понятия.'
