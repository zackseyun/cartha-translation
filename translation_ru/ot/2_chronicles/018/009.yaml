  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: ru
  text: Царь Израиля и Иосафат, царь Иудеи, сидели — каждый на своём престоле, облачённые в одежды, — на гумне у входа в ворота Самарии, а все пророки пророчествовали перед ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Царь Израиля
  rationale: Начальный ו — обычный повествовательный союз; в русском связном повествовании его можно не выражать отдельным «и», не добавляя отсутствующего в оригинале временного наречия.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: и Иосафат, царь Иудеи
  rationale: Сохранено соединение двух царей и пояснительное приложение к имени Иосафата.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: сидели ... на гумне
  rationale: 'Дважды употреблённое ישׁב описывает одну сцену: цари сидят каждый на престоле, находясь на гумне. В русском повтор «сидели ... и сидели» неестественен и может ошибочно обозначить два действия, поэтому второй оборот передан как обстоятельство места.'
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: каждый на своём престоле
  rationale: אִישׁ имеет распределительное значение «каждый», а כִּסֵּא в царском контексте означает «престол»; «своём» естественно передаёт единственное местоименное окончание при распределительной конструкции.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: облачённые в одежды
  rationale: Сохранено буквальное значение пассивного причастия и существительного без добавления не названных прямо «царских» или «торжественных» одеяний. «Облачённые» соответствует официальной сцене.
- source_word: בְּגֹרֶן
  choice: на гумне
  rationale: גֹּרֶן — площадка для молотьбы; традиционное и точное русское «гумно» уместно в библейском историческом контексте.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: у входа в ворота Самарии
  rationale: 'Естественно передана пространственная конструкция: гумно находилось у входа в городские ворота Самарии.'
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם
  choice: а все пророки пророчествовали перед ними
  rationale: Причастная форма изображает продолжающееся пророческое выступление в присутствии царей. Союз «а» естественно переводит внимание от царей к пророкам, не вводя смыслового противопоставления.
