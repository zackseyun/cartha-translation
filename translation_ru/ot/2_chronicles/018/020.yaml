  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: ru
  text: 'Тогда выступил дух, стал перед Яхве и сказал: «Я склоню его[a]». Яхве спросил его: «Каким образом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я увлеку его», «Я уговорю его» или «Я обману его». Еврейский глагол может означать склонить, увлечь, убедить или обмануть — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: дух
  rationale: 'В сцене небесного совета названный словом רוּחַ действует как личное существо: выступает, становится перед Яхве и говорит. Поэтому контексту соответствует «дух», а не «ветер» или «дыхание».'
- source_word: וַיֵּצֵא
  choice: выступил
  rationale: Буквально глагол означает «вышел», но в обстановке совета речь идёт о выходе вперёд для обращения к Яхве; «выступил» естественно передаёт это движение и сохраняет торжественный характер сцены.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: стал перед
  rationale: Передаёт обычное значение оборота — занять место перед кем-либо, находясь в его присутствии, — без излишней архаизации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֲפַתֶּנּוּ
  choice: Я обольщу его
  rationale: Форма глагола פתה может обозначать склонение, увлечение или обман. «Обольщу» сохраняет оттенок заманивания и не раскрывает заранее способ действия, который поясняется в следующем стихе.
- source_word: בַּמָּה
  choice: Каким образом?
  rationale: Вопрос относится к способу, которым дух намерен осуществить предложенное; эта формулировка естественна в современном русском языке и сохраняет смысл «посредством чего?».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя «Яхве», без подмены титулом.
- issue: Нравственно-богословский оттенок глагола פתה в сцене небесного совета
  choice: Я обольщу его
  alternative: Я обману его; Я уговорю его; Я склоню его
  rationale: Выбранный вариант сохраняет напряжённую неоднозначность глагола и не вносит в этот стих объяснение конкретного обманного средства, которое появляется далее.
- issue: Форма реплики Яхве
  choice: Яхве спросил его
  alternative: И сказал ему Яхве
  rationale: Глагол וַיֹּאמֶר буквально означает «и сказал», однако прямая речь является вопросом; «спросил» естественно передаёт речевое действие, не меняя его содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. «Выступил» передаёт обстановку небесного совета, а «стал перед» избегает архаического «предстал пред». Неоднозначность פתה сохранена в основном тексте и раскрыта в сноске.
