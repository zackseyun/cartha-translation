  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ru
  text: 'И все пророки пророчествовали одинаково, говоря: «Иди на Рамот-Галаад и добейся успеха; Яхве предаст[a] его в руки царя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую форму в пророческом контексте можно также передать как уже совершившееся действие: «Яхве уже предал его в руки царя».'
    reason: Сохраняется аспектуальная неоднозначность формы וְנָתַן в пророческом контексте.
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: И все пророки
  rationale: Сохраняет соединительный союз, значение совокупности и определённый круг придворных пророков.
- source_word: נִבְּאִים כֵּן
  choice: пророчествовали так
  rationale: Причастная форма передаёт продолжающееся одновременное действие, а כֵּן указывает на одинаковый характер их речей.
- source_word: עֲלֵה
  choice: Поднимись
  rationale: Сохраняет основное значение עלה; в данном военном контексте речь идёт о выступлении к городу, но значение «напади» в сам глагол не добавляется.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот-Галаад
  rationale: Передача составного географического названия в форме, понятной русскому читателю и близкой еврейскому звучанию.
- source_word: וְהַצְלַח
  choice: и добейся успеха
  rationale: Императив глагола צלח означает преуспеть, добиться успеха; формулировка сохраняет повелительную форму и не сужает её до одного лишь военного термина «победи».
- source_word: וְנָתַן יְהוָה
  choice: Яхве предаст
  rationale: В последовательности после повелительных форм וְנָתַן естественно выражает уверенно предсказываемый результат. Личное имя יהוה передано как «Яхве».
- source_word: בְּיַד הַמֶּלֶךְ
  choice: в руки царя
  rationale: Естественный русский эквивалент еврейской идиомы «в руку», означающей передачу под власть или контроль.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Временное и видовое значение וְנָתַן
  choice: предаст
  alternative: уже предал
  rationale: После повелительных форм конструкция естественно обозначает последующий, уверенно ожидаемый результат. При этом возможное понимание формы как изображения победы уже совершившейся в пророческой уверенности отмечено в сноске.
- issue: Неявное дополнение при וְנָתַן
  choice: его
  alternative: Рамот-Галаад
  rationale: Местоимение естественно восполняет подразумеваемый объект — город Рамот-Галаад — без избыточного повторения названия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прямой речи сохранён ясным; архаизмы вроде «дабы» и искусственно буквальное «в руку царя» не используются.
