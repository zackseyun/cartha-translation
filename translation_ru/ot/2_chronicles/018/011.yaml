    rationale: «Пророчествовали так, говоря» формально возможно, но в современном русском звучит избыточно. «Пророчествовали одинаково, говоря» яснее выражает, что все говорили одно и то же.
  - severity: low
    issue: «Поднимись на Рамот-Галаад» несколько менее естественно по-русски.
    rationale: Буквальное «поднимись» передаёт עלה, но в военном призыве без пояснения звучит менее плавно. «Иди на Рамот-Галаад» сохраняет повеление выступить к месту, не добавляя значения нападения.
  - severity: low
    issue: Сноска неточно описывает альтернативу.
    rationale: Альтернативное «уже предал» связано с возможной передачей глагольной формы как пророчески совершённого действия; это следует назвать прямо.
