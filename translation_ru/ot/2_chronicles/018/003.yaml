base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: ru
  text: 'Ахав, царь Израиля, сказал Иосафату, царю Иудеи: «Пойдёшь ли ты со мной на Рамот-Галаад?» Иосафат ответил ему: «Я — как ты, и мой народ — как твой народ[a], и я с тобой в войне[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и как твой народ — мой народ». Это сравнительная конструкция, выражающая единство и солидарность.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза эллиптическая, буквально: «и с тобой в войне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: Пойдёшь ли ты со мной
  rationale: Вопросительная частица הֲ и глагол הלך с עִם образуют прямой вопрос о том, согласится ли Иосафат сопровождать Ахава. Формулировка естественна по-русски и сохраняет значение движения.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот-Галаад
  rationale: Название места передано близко к еврейской форме; дефис показывает, что это единый топоним.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Я — как ты
  rationale: Краткая сравнительная конструкция передаёт заявленное Иосафатом единство с Ахавом, не усиливая её до полного отождествления.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: и мой народ — как твой народ
  rationale: Сохранены сравнительный смысл, бессоюзная именная структура и порядок смысловых членов еврейской фразы в естественной русской форме.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: и я с тобой в этой войне
  rationale: В еврейском тексте фраза эллиптическая, без выраженного подлежащего и глагола. Добавление «я» делает обещание поддержки ясным по-русски, а настоящее время не вносит лишнего будущего оттенка.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: сказал ... ответил
  rationale: Первое אמר передано нейтральным «сказал», а второе — контекстуальным «ответил», поскольку оно вводит непосредственный ответ Иосафата; это естественно для русского повествования.
