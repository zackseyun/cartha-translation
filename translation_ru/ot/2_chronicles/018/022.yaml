base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: ru
  text: 'И вот теперь: Господь вложил в уста этих твоих пророков дух лжи, и Господь изрёк против тебя беду.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: И теперь знай
  rationale: Сочетание вводит торжественное указание на настоящий вывод; «знай» естественно передаёт дейктическую силу הִנֵּה в обращении к царю, не сводя её к буквальному зрительному «вот».
- source_word: נָתַן
  choice: вложил
  rationale: В сочетании с «в уста» русский глагол «вложил» естественно сохраняет образ помещения духа в речь пророков.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; написание с прописной буквы отличает имя Бога в литературном русском тексте.
- source_word: רוּחַ שֶׁקֶר
  choice: дух лжи
  rationale: Формальная и естественная передача, сохраняющая возможность понимать רוּחַ как личностный дух, а не просто склонность или ложное настроение.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: в уста этих твоих пророков
  rationale: Сохранены образ «уст», указательное «этих» и притяжательный суффикс «твоих», подчёркивающий отношение пророков к адресату.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: предрёк тебе беду
  rationale: В данном пророческом контексте דִּבֶּר עַל означает объявить или изречь против кого-либо; «предрёк тебе беду» звучит естественно и сохраняет направленность неблагоприятного Божьего слова.
theological_decisions:
- issue: Бог как субъект действия с духом лжи
  choice: 'Сохранить прямое утверждение: «Господь вложил дух лжи»'
  alternative: 'Смягчить причинность: «Господь допустил духу лжи войти»'
  rationale: Еврейский текст прямо ставит יהוה субъектом נָתַן. Смягчение до простого дозволения импортировало бы богословское разрешение напряжения, отсутствующее в стихе.
- issue: Характер Божьего слова о царе
  choice: «Господь предрёк тебе беду»
  alternative: «Господь замыслил против тебя зло»
  rationale: Глагол דִּבֶּר обозначает речь, а не замысел; רָעָה здесь обозначает пагубное событие или бедствие, а не моральное зло со стороны Бога.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис краткий и прямой; подлинное богословское напряжение исходного текста не смягчено.
