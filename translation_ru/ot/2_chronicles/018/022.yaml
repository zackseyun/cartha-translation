    rationale: «Знай» добавляет обращённое к адресату повеление, которого в тексте нет; הִנֵּה служит дейктическим указанием. «И вот теперь» передаёт эту функцию без добавления смысла.
  - severity: low
    issue: «Предрёк тебе беду» сглаживает конструкцию «сказал/изрёк против тебя беду»
    rationale: Пророческий контекст позволяет «предрёк», но исходный глагол обозначает произнесённое Божье слово, а עָלֶיךָ имеет неблагоприятную направленность «против тебя». Более близкая формулировка сохраняет оба элемента.
  revised_text: 'И вот теперь: Господь вложил в уста этих твоих пророков дух лжи, и Господь изрёк против тебя беду.'
