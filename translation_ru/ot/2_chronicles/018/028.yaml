  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: ru
  text: И царь Израиля и Иосафат, царь Иудеи, поднялись к Рамофу Галаадскому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: И пошли
  rationale: Глагол עלה буквально означает «подниматься, восходить», но при повествовательном обозначении движения к месту по-русски естественно передаётся как «пойти». Форма множественного числа согласуется с составным подлежащим; военного оттенка, которого сам глагол не выражает, не добавлено.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Обычное и прозрачное соответствие еврейскому царскому титулу в контексте уже известного правителя.
- source_word: וִיהוֹשָׁפָט
  choice: и Иосафат
  rationale: Союз передан прямо, а личное имя — в закрепившейся русской библейской форме.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Приложение после имени сохранено; запятые соответствуют естественному русскому оформлению пояснительного титула.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленное движение к месту назначения; русское «к» естественно сочетается с названием города.
- source_word: רָמֹת גִּלְעָד
  choice: Рамофу Галаадскому
  rationale: Использована традиционная русская форма составного топонима «Рамоф Галаадский»; падеж обусловлен предлогом «к».
