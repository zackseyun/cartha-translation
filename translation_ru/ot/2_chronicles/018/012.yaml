base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: ru
  text: 'Посланник, который пошёл позвать Михея, сказал ему: «Вот, пророки в один голос[a] говорят в пользу царя. Пусть же и твоё слово будет как слово одного из них: скажи и ты то, что благоприятно для царя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одними устами» — то есть полностью согласно, единодушно.'
    reason: Сноска сохраняет буквальный образ еврейской идиомы פֶּה אֶחָד, тогда как основной текст передаёт её естественным русским соответствием.
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: посланник
  rationale: В данном повествовательном контексте речь идёт о человеке, посланном позвать Михея, а не об ангеле.
- source_word: לִקְרֹא
  choice: позвать
  rationale: Передаёт вызов пророка к царю естественным современным русским языком.
- source_word: לְמִיכָיְהוּ
  choice: Михея
  rationale: Использована традиционная русская форма библейского имени в требуемом падеже.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-привлекающую внимание функцию частицы без архаизации.
- source_word: פֶּה אֶחָד
  choice: в один голос
  rationale: Естественная русская идиома, сохраняющая образ согласного совместного высказывания; буквальный образ отмечен в сноске.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: в пользу царя
  rationale: Передаёт не отвлечённую нравственную доброту, а благоприятное для царя содержание пророчеств.
- source_word: וִיהִי נָא דְבָרְךָ
  choice: Пусть же и твоё слово будет
  rationale: Сохраняет побудительно-просительный оттенок конструкции и единственное число слова דָּבָר.
- source_word: כְּאַחַד מֵהֶם
  choice: как слово одного из них
  rationale: Ясно связывает сравнение со словом каждого из ранее упомянутых пророков.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: скажи и ты то, что будет в пользу царя
  rationale: Естественно передаёт призыв произнести благоприятное для царя пророчество и сохраняет повтор мысли первой части.
theological_decisions:
- issue: Характер требуемого от Михея высказывания
  choice: «в пользу царя»
  alternative: «доброе» или «благоприятное»
  rationale: Формулировка показывает прагматический смысл просьбы — присоединиться к поддерживающему царя общему пророческому мнению, не утверждая, что такое слово было бы истинным или нравственно добрым.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования, без архаизмов. Повтор выражения «в пользу царя» намеренно сохраняет смысловой повтор исходного текста; двоеточие естественно вводит разъяснение ожидаемого слова.
