  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: ru
  text: Когда начальники колесничного войска увидели, что он не царь Израиля, они перестали его преследовать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернули назад, перестав идти за ним»; то есть прекратили погоню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Когда ... увидели
  rationale: Сочетание повествовательной формы וַיְהִי с инфинитивом и כִּ естественно передаёт временной переход; по-русски отдельное «и было» здесь избыточно.
- source_word: שָׂרֵי הָרֶכֶב
  choice: начальники колесниц
  rationale: שָׂרֵי обозначает военачальников, а הָרֶכֶב — колесницы или колесничное войско. Выбранный вариант сохраняет структуру еврейского выражения и звучит понятно.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: что это не царь Израиля
  rationale: В еврейском тексте явное подлежащее отсутствует. Указательное «это» естественно соотносит вывод военачальников с человеком, которого они приняли за царя, не вводя лишней конкретизации.
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: они перестали его преследовать
  rationale: Буквально оборот означает «они повернули назад от/из-за него» или «перестали идти за ним»; в военном контексте речь идёт о прекращении погони. Динамическая формулировка ясно передаёт смысл идиомы.
