  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֵּרֶד֩ לְ/קֵ֨ץ שָׁנִ֤ים אֶל אַחְאָב֙ לְ/שֹׁ֣מְר֔וֹן וַ/יִּֽזְבַּֽח ל֨/וֹ אַחְאָ֜ב צֹ֤אן וּ/בָקָר֙ לָ/רֹ֔ב וְ/לָ/עָ֖ם אֲשֶׁ֣ר עִמּ֑/וֹ וַ/יְסִיתֵ֕/הוּ לַ/עֲל֖וֹת אֶל רָמ֥וֹת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: ru
  text: Через несколько лет он спустился к Ахаву в Самарию. Ахав заколол для него и для людей, которые были с ним, множество овец и крупного скота, а затем склонил его[a] выступить против Рамофа Галаадского[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подстрекнул его»; также возможно: «уговорил его».'
    reason: Еврейский глагол סות допускает оттенки склонения, соблазнения или подстрекательства, и контекст не требует полностью устранять этот диапазон.
  - marker: b
    text: 'Буквально: «подняться к Рамофу Галаадскому»; в данном контексте имеется в виду военный поход против города.'
    reason: Предлог אֶל буквально указывает направление, тогда как в повествовательном контексте движение имеет военную цель.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Сохраняет направительное и топографическое значение глагола ירד и естественно звучит по-русски.
- source_word: לְקֵץ שָׁנִים
  choice: через несколько лет
  rationale: Передаёт идиоматический смысл истечения некоторого числа лет, не уточняя неизвестную продолжительность.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: к Ахаву в Самарию
  rationale: Ясно передаёт как лицо, к которому направился Иосафат, так и место его пребывания.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: Ахав заколол для него
  rationale: В данном контексте царского угощения זבח обозначает заклание животных; культовое значение «принёс в жертву» контекстом прямо не выражено.
- source_word: צֹאן וּבָקָר לָרֹב
  choice: множество овец и крупного скота
  rationale: Передаёт обе категории животных и значение изобилия, сохраняя конкретность еврейского текста.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: для людей, которые были с ним
  rationale: Не сужает широкое עָם до войска или свиты, хотя в контексте это могли быть сопровождавшие царя люди.
- source_word: וַיְסִיתֵהוּ
  choice: склонил его
  rationale: Передаёт сильное побуждение к действию, не делая отрицательный оттенок столь однозначным, как «подстрекнул»; диапазон значения отмечен в сноске.
- source_word: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד
  choice: выступить против Рамофа Галаадского
  rationale: Военный контекст показывает, что речь идёт не просто о поездке в город, а о походе против него; русское «выступить» сохраняет образ начала военного движения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; сохранены топографическое «спустился» и неопределённость временного выражения. Традиционная русская форма топонима — «Рамоф Галаадский».
