  terminology: «Ахав», «Самария» и «Рамоф Галаадский» оформлены последовательно. «Заколол» оправдано контекстом пира и не вносит невыраженного культового смысла. Сноска a корректно отмечает более сильные оттенки סות, а сноска b — буквальное направление движения и контекстуальный военный смысл.
