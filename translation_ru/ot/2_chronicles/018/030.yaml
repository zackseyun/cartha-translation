  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת שָׂרֵ֨י הָ/רֶ֤כֶב אֲשֶׁר ל/וֹ֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת הַ/קָּטֹ֖ן אֶת הַ/גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: ru
  text: 'Царь Арама приказал начальникам своих колесниц: «Не сражайтесь ни с малым, ни с великим[a], а только с царём Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более свободно: «Не сражайтесь ни с кем — ни с простым, ни со знатным, — а только с царём Израиля».'
    reason: 'Лексическая альтернатива: выражение «малый и великий» означает людей любого положения.'
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Царь Арама
  rationale: Начальный ו связывает фразу с повествованием, но в современном русском не требует отдельного союза. אֲרָם передано традиционной транслитерацией «Арам».
- source_word: צִוָּה
  choice: приказал
  rationale: Глагол означает «приказать, повелеть». Простое прошедшее время естественно в русском повествовании; предшествование приказа последующим событиям ясно из контекста.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: начальникам своих колесниц
  rationale: שָׂרֵי — военные начальники, а הָרֶכֶב может обозначать колесницы или колесничное войско. Притяжательное «своих» естественно передаёт אֲשֶׁר לוֹ («которые были у него») без тяжеловесной относительной конструкции.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Формула «говоря» в данном месте функционально вводит прямую речь; в современном русском это естественно выражается пунктуацией.
- source_word: לֹא תִּלָּחֲמוּ
  choice: Не сражайтесь
  rationale: Форма употреблена как запрет, обращённый к нескольким военачальникам. «Сражаться с» сохраняет военный смысл и управление последующих дополнений.
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: ни с малым, ни с великим
  rationale: Сохранена меристическая идиома, охватывающая людей любого положения; парная конструкция «ни… ни…» звучит естественно по-русски.
- source_word: כִּי אִם
  choice: а только
  rationale: Сочетание выражает исключение и ограничение единственной целью.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: с царём Израиля
  rationale: Предлог «с» определяется русским управлением глагола «сражаться». Исключительность לְבַדּוֹ передана словом «только» в предыдущей части, без неестественного повтора «одного/единственного».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Военная терминология ясна без архаизмов; исходная идиома «малый и великий» сохранена в основном тексте, а её смысл пояснён в сноске.
