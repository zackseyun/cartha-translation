base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: ru
  text: 'и скажите: «Так говорит царь: посадите этого человека в темницу и давайте ему хлеб и воду лишений[a], пока я не вернусь с миром».


    [a] Или: «скудный хлеб и скудную воду»; вероятно, имеются в виду урезанные тюремные порции, связанные с лишениями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скудный хлеб и скудную воду»; вероятно, имеются в виду урезанные тюремные порции, связанные с лишениями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: и скажите
  rationale: Форма 2-го лица множественного числа продолжает повеление царя; русское повелительное «скажите» естественно передаёт эту функцию.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Так говорит царь
  rationale: Сохранена обычная древнееврейская формула передачи официального повеления.
- source_word: שִׂימוּ זֶה בֵּית הַכֶּלֶא
  choice: посадите этого человека в темницу
  rationale: Буквально речь идёт о помещении «этого» в дом заключения; «посадите… в темницу» — естественное русское выражение, а «этого человека» ясно обозначает референта.
- source_word: וְהַאֲכִלֻהוּ
  choice: и давайте ему
  rationale: Каузативное повеление «кормите его» в сочетании с хлебом и водой естественно передаётся общей конструкцией «давайте ему».
- source_word: לֶחֶם לַחַץ וּמַיִם לַחַץ
  choice: хлеб нужды и воду нужды
  rationale: Сохранён образный параллелизм оригинала. לַחַץ обозначает стеснение, бедствие или лишения и в контексте, вероятно, указывает на скудный тюремный паёк.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: пока я не вернусь с миром
  rationale: Передаёт безопасное возвращение из похода и сохраняет контекстуальную иронию заявления царя.
