  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּב֛וֹא חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/024.yaml
  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: ru
  text: 'Михей сказал: «Вот, ты увидишь в тот день, когда будешь переходить из комнаты в комнату[a], чтобы спрятаться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «комната в комнате»; возможно также: «во внутреннюю комнату».'
    reason: Сочетание חֶדֶר בְּחֶדֶר допускает понимание как движения из одной комнаты в другую либо как ухода в более внутреннее помещение.
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Михей
  rationale: Традиционная и общепонятная русская форма библейского имени.
- source_word: הִנְּךָ רֹאֶה
  choice: Вот, ты увидишь это
  rationale: Конструкция с указательной частицей и причастием в данном контексте выражает emphатическое предсказание; «вот» сохраняет указательную силу, а будущее время естественно передаёт смысл.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача стандартного древнееврейского временного оборота.
- source_word: אֲשֶׁר תָּבוֹא
  choice: когда станешь переходить
  rationale: Относительная конструкция обозначает обстоятельство исполнения предсказания; глагол движения согласован с последующим повтором חֶדֶר בְּחֶדֶר.
- source_word: חֶדֶר בְּחֶדֶר
  choice: из комнаты в комнату
  rationale: Передаёт возможное значение последовательного перемещения между помещениями, не скрывая в сноске альтернативное понимание как ухода во внутреннюю комнату.
- source_word: לְהֵחָבֵא
  choice: чтобы спрятаться
  rationale: Естественно передаёт целевое значение инфинитива и возвратный смысл нифаля.
