source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: ru
  text: 'Михей сказал: «Если ты и в самом деле вернёшься невредимым, значит, Яхве не говорил через меня». И добавил: «Слушайте, все народы!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Михей
  rationale: Устоявшаяся русская библейская форма имени пророка; она естественнее буквальной транслитерации «Михаяху» и обеспечивает узнаваемость персонажа.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Если ты и в самом деле вернёшься
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает условие; оборот «и в самом деле» естественно передаёт это усиление по-русски.
- source_word: בְּשָׁלוֹם
  choice: невредимым
  rationale: В данном контексте שָׁלוֹם означает благополучное, безопасное возвращение с войны. «Невредимым» ясно передаёт смысл, не предполагая заключения мира.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Яхве не говорил через меня
  rationale: 'Предлог ב здесь имеет инструментальный смысл: пророк выступает посредником Божьей речи. «Через меня» естественно и точно передаёт эту функцию.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между Божьим именем и титулом «Господь».
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Повелительная форма множественного числа призывает свидетелей обратить внимание; «слушайте» звучит естественно в современной литературной русской речи.
- source_word: עַמִּים כֻּלָּם
  choice: все народы
  rationale: Сохраняется множественное число עַמִּים и широкий пророческий характер обращения, не сводящий его лишь к присутствующим людям.
- source_word: וַיֹּאמֶר
  choice: И добавил
  rationale: Повторение «сказал» в русском было бы тяжеловесным; «добавил» естественно обозначает следующую реплику того же говорящего, не меняя её содержания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Смысл проверки истинности пророчества
  choice: «значит, Яхве не говорил через меня»
  alternative: «Яхве не говорил через меня» без связующего слова
  rationale: 'Слово «значит» делает явной условную логику фразы: безопасное возвращение Ахава означало бы ложность заявления Михея. Оно не устраняет напряжения, а естественно выражает подразумеваемое следствие условия.'
- issue: Адресаты заключительного призыва
  choice: «все народы»
  alternative: «весь народ»
  rationale: Еврейское עַמִּים имеет форму множественного числа и создаёт широкий пророческий призыв. Его не следует сужать до непосредственной аудитории.
- issue: Говорящий в последней части стиха
  choice: Михей продолжает говорить
  alternative: Неуказанный новый говорящий
  rationale: Ближайший названный субъект — Михей; в тексте нет сигнала о смене говорящего, хотя повторное וַיֹּאמֶר вводит отдельный торжественный призыв.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; сохранены усиленное условие, личное имя Яхве и множественное «народы». Маркеры сносок не используются, поскольку все необходимые смысловые решения можно прямо и естественно выразить в основном тексте.
