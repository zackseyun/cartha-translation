base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: ru
  text: 'Тогда Седекия, сын Ханааны, подошёл, ударил Михея по щеке и сказал: «Каким путём Дух Яхве перешёл от меня, чтобы говорить с тобой?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По какому пути Дух Яхве прошёл от меня, чтобы говорить с тобой?»'
    reason: Еврейское אֵי זֶה הַדֶּרֶךְ буквально ставит вопрос о пути; глагол עָבַר допускает передачу «прошёл» наряду с «перешёл».
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Глагол נגשׁ обозначает приближение; «подошёл» естественно передаёт физическое движение в сцене столкновения.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Седекия, сын Хенааны
  rationale: Имена переданы в традиционной русской библейской форме, а родственная связь сохранена буквально.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: ударил Михея по щеке
  rationale: נכה — широкий по значению глагол «ударить», а לֶחִי может обозначать щёку или челюсть; в данном контексте «по щеке» естественно передаёт оскорбительный жест, не уточняя его силу.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Каким путём
  rationale: Выражение буквально сохраняет образ пути и вводит насмешливый вопрос о том, как именно Дух якобы перешёл от одного пророка к другому.
- source_word: עָבַר
  choice: перешёл
  rationale: עבר выражает прохождение или переход; «перешёл» сохраняет пространственный образ движения Духа от Седекии к Михею.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В пророческом контексте речь идёт о Божьем Духе; прописная буква обозначает личный божественный референт, а имя יהוה передано как «Яхве».
- source_word: מֵאִתִּי
  choice: от меня
  rationale: Предлог указывает на исходную точку; формулировка сохраняет насмешливое утверждение Седекии, будто прежде Дух говорил через него.
- source_word: לְדַבֵּר אֹתָךְ
  choice: чтобы говорить с тобой
  rationale: Конструкция с אֵת после דבר допускает передачу «говорить с тобой»; русский инфинитив с «чтобы» естественно выражает цель перехода.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное заветное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- issue: Референт רוּחַ в выражении רוּחַ יְהוָה
  choice: Дух с прописной буквы
  alternative: дух со строчной буквы
  rationale: Пророческий контекст указывает на Божьего Духа, хотя реплика Седекии носит насмешливый характер; прописная буква отражает референт, не подтверждая притязаний говорящего.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Реплика сохраняет пространственный образ перехода Духа и насмешливый вызов Седекии. Маркер сноски помещён при вопросе, к которому относится лексическая альтернатива; его позиция после слова «щеке» в английском консультационном слое, по-видимому, технически не соответствует содержанию сноски.
