    rationale: Для русской библейской традиции и русской передачи основы Ханаан предпочтительна форма «Ханааны»; она также точнее соотносится с כְּנַעַן.
  - severity: medium
    issue: Сноска «Куда это Дух Яхве ушёл от меня...» неточно представляет альтернативу.
    rationale: אֵי זֶה הַדֶּרֶךְ относится к пути или способу, которым Дух «прошёл/перешёл» от говорящего; «куда ... ушёл» смещает вопрос к пункту назначения и ослабляет образ пути. Разговорное «это» также снижает регистр.
