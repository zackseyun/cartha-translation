base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: ru
  text: 'Тогда Седекия, сын Ханааны, сделал себе железные рога и сказал: «Так говорит Яхве: этими рогами ты будешь бодать Арам[a], пока они не будут уничтожены».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арамеев»; позднее эту страну стали называть Сирией.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: сделал себе
  rationale: Конструкция с לֹו в данном контексте естественно передаёт действие в собственных интересах субъекта; по-русски краткое «сделал себе» звучит ясно и естественно.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Седекия, сын Ханааны
  rationale: Сохранены традиционно узнаваемые русские формы библейских имён и еврейская патронимическая конструкция.
- source_word: קַרְנֵי בַרְזֶל
  choice: железные рога
  rationale: Естественная русская конструкция сохраняет предметный образ рогов как знака силы и оружия.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула и личное имя Бога.
- source_word: בְּאֵלֶּה
  choice: этими рогами
  rationale: Местоимение раскрыто ближайшим референтом ради ясности на русском; творительный падеж передаёт инструментальное значение ב.
- source_word: תְּנַגַּח
  choice: будешь бодать
  rationale: Глагол נגח обозначает действие рогатого животного — бодание или поражение рогами; выбор сохраняет образ разыгранного пророческого знамения.
- source_word: אֶת אֲרָם
  choice: Арам
  rationale: Сохранено древнее историческое название, без замены более поздним и менее точным названием «Сирия».
- source_word: עַד כַּלּוֹתָם
  choice: пока не истребишь его
  rationale: Форма выражает доведение множественного по смыслу противника до полного конца. В русском согласование с названием страны «Арам» требует единственного числа; активная конструкция естественно передаёт подразумеваемый результат действия адресата.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Статус слов Седекии как пророческого заявления
  choice: Сохранена прямая формула «Так говорит Яхве» без редакционного подтверждения её истинности
  alternative: Добавить указание, что это ложное пророчество
  rationale: Стих сообщает заявление персонажа; его оценка определяется контекстом главы, поэтому перевод не должен заранее разрешать богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Бодать» конкретно и понятно передаёт образ рогов; «истребишь» сохраняет серьёзный регистр и значение полного уничтожения. Маркер сноски поставлен непосредственно после слова «Арам».
