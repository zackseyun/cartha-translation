base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: ru
  text: 'Тогда царь Израиля сказал: «Возьмите Михея и отведите его обратно к Амону, начальнику города[a], и к Иоасу, сыну царя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военачальнику города». Еврейский титул может обозначать гражданского или военного начальника.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сын царя» может быть как указанием на родство, так и придворным титулом.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт смену действия.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямо передаёт еврейское сочетание и сохраняет титул вместо подстановки имени Ахава.
- source_word: קְחוּ
  choice: Возьмите
  rationale: Обычное значение повелительной формы לקח; «схватите» излишне усилило бы оттенок враждебности.
- source_word: מִיכָיְהוּ
  choice: Михея
  rationale: Традиционная и узнаваемая русская форма имени; падеж обусловлен синтаксисом.
- source_word: וַהֲשִׁיבֻהוּ
  choice: отведите его обратно
  rationale: Каузативная форма שוב означает заставить или дать кому-либо вернуться; выбран естественный русский эквивалент без предположения, что его нужно нести или сопровождать особым образом.
- source_word: אָמ֣וֹן
  choice: Амону
  rationale: Общепринятая русская передача личного имени, поставленная в дательном падеже.
- source_word: שַׂר הָעִיר
  choice: начальнику города
  rationale: שַׂר может обозначать начальника, правителя или военачальника. «Начальник города» сохраняет широту титула и не определяет должность как исключительно гражданскую или военную.
- source_word: וְאֶל יוֹאָשׁ
  choice: и к Иоасу
  rationale: Повтор предлога אֶל отражён, поскольку обозначает второго адресата.
- source_word: בֶּן הַמֶּלֶךְ
  choice: сыну царя
  rationale: Буквально и естественно передаёт родственное обозначение, не заменяя его более толковательным словом «царевич».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис близок к оригиналу, но формулировка «отведите его обратно» выбрана ради естественности. Неопределённость титулов שַׂר הָעִיר и בֶּן הַמֶּלֶךְ сохранена в примечаниях.
