  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: ru
  text: 'И Иосафат сказал царю Израиля: «Пожалуйста, обратись сегодня за словом Яхве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнай сегодня, каково слово Яхве».'
    reason: Передаёт тот же смысл запроса пророческого слова другим естественным русским синтаксисом, не уточняя способ получения этого слова.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная повествовательная форма с последовательным ו; союз «и» сохраняет ход еврейского рассказа без излишнего уточнения временной связи.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: царю Израиля
  rationale: Естественная русская передача направления речи при глаголе «сказал»; сохраняет царский титул.
- source_word: דְּרָשׁ נָא
  choice: Прошу тебя, обратись
  rationale: В данном контексте דרש означает обратиться к Богу ради получения пророческого ответа, а частица נָא смягчает повеление и передаёт вежливую просьбу.
- source_word: כַיּוֹם
  choice: сегодня
  rationale: Наречное употребление указывает на необходимость обращения именно в этот день, то есть без промедления.
- source_word: אֶת דְּבַר יְהוָה
  choice: к Яхве за словом
  rationale: Естественная русская конструкция передаёт поиск пророческого слова от Бога, сохраняя смысл сочетания דרש с прямым дополнением; иной синтаксический способ передачи отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер искомого откровения в דְּבַר יְהוָה
  choice: за словом
  alternative: узнать, что скажет Яхве
  rationale: Формулировка «за словом» сохраняет традиционное понятие Божьего слова и не сводит его заранее к конкретному устному ответу, хотя контекст предполагает пророческое обращение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Прошу тебя» естественно передаёт вежливую частицу נָא, а «обратись… за словом» понятно современному читателю и сохраняет пророческий контекст.
