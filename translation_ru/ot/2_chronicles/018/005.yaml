  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: ru
  text: 'И собрал царь Израиля пророков — четыреста человек — и спросил их: «Выступить ли нам на Рамот-Галаад на войну или мне воздержаться?» Они ответили: «Иди, и Бог отдаст его в руки царя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даст в руку царя». Это еврейское выражение означает «отдаст под власть царя»; при этом в тексте сказано просто «царя», без уточнения, какого именно.'
    reason: Сохраняет идиому и подлинную неопределённость референта.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Обычное значение קבץ — «собирать»; форма естественна для современного русского повествования.
- source_word: הַנְּבִאִים אַרְבַּע מֵאוֹת אִישׁ
  choice: пророков — четыреста человек
  rationale: Сохраняет прямое обозначение пророков и явно выраженное в еврейском тексте אִישׁ («человек»).
- source_word: הֲנֵלֵךְ ... אִם אֶחְדָּל
  choice: идти ли нам ... или мне воздержаться
  rationale: 'Сохранена намеренная смена числа: сначала первое лицо множественного числа, затем первое лицо единственного числа.'
- source_word: רָמֹת גִּלְעָד
  choice: Рамот Галаадский
  rationale: Традиционная и понятная русская передача составного топонима Рамот-Гилеад.
- source_word: לַמִּלְחָמָה
  choice: войной
  rationale: Естественно передаёт целевое значение выражения — выступить для военных действий.
- source_word: עֲלֵה
  choice: иди
  rationale: Передаёт императив עלה без добавления отсутствующего в тексте значения «нападай»; направление движения понятно из контекста.
- source_word: וְיִתֵּן
  choice: и ... отдаст его
  rationale: Глагол נתן передан обычным русским «отдаст»; местоимение «его» восполняет подразумеваемый объект, то есть город.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Единственное число глагола יִתֵּן указывает здесь на единственного референта.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: в руки царя
  rationale: Естественная русская форма семитского идиоматического выражения о передаче во власть или под контроль.
theological_decisions:
- issue: Кого обозначает «царь» в ответе пророков
  choice: сохранить неопределённое выражение «царя»
  alternative: уточнить «царя Израиля» или передать «в твои руки»
  rationale: В еврейском тексте сказано именно הַמֶּלֶךְ, «царь», без местоимения «твой» и без уточнения; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным, но смена «нам» на «мне» и неопределённость слова «царь» сохранены.
