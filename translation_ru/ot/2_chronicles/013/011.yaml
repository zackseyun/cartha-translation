source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: ru
  text: Мы возносим Яхве всесожжения каждое утро и каждый вечер, воскуряем благовонный фимиам, раскладываем хлебы на чистом столе[a] и каждый вечер зажигаем лампы на золотом светильнике. Ибо мы верно исполняем порученное служение Яхве, нашего Бога, а вы оставили Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлебы предложения»; «хлебы Присутствия». Буквально: «расположение хлеба на чистом столе».'
    reason: Сохраняет буквальный образ и традиционные варианты названия храмовых хлебов.
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: возносим / воскуряем
  rationale: В породе хифиль глагол обозначает действие, при котором жертва или фимиам поднимаются в дыму. С всесожжениями естественно «возносим», а с фимиамом — традиционное и точное «воскуряем».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя יהוה, а не заменяет его титулом.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Устоявшийся и точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: בַּבֹּקֶר בַּבֹּקֶר וּבָעֶרֶב בָּעֶרֶב
  choice: каждое утро и каждый вечер
  rationale: Повтор существительных имеет распределительное значение и указывает на регулярность; современная русская формулировка передаёт этот смысл без неестественной кальки.
- source_word: וּקְטֹרֶת סַמִּים
  choice: благовонный фимиам
  rationale: סַמִּים обозначает ароматические вещества; сочетание передаёт специально приготовленное ароматное курение.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: раскладываем хлебы
  rationale: מַעֲרֶכֶת указывает на упорядоченное размещение хлеба. Глагольная передача естественна по-русски и сохраняет конкретное культовое действие.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: на чистом столе
  rationale: טָהוֹר здесь имеет культовый смысл чистоты; «чистый» — обычный библейский русский эквивалент, не сводящий значение к бытовой гигиене.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: зажигаем светильники на золотом светильнике
  rationale: Передаёт назначение ламп — гореть, — избегая тяжеловесного буквального оборота. Повтор «светильники / светильник» отражает различие между отдельными лампами и менорой.
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: мы соблюдаем установления Яхве
  rationale: Идиома שׁמר משׁמרת означает верно исполнять вверенные требования или служебные обязанности. «Установления» естественно охватывает храмовые предписания данного контекста.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: а вы оставили Его
  rationale: Сохраняет прямое обвинение и контраст с верным соблюдением служения.
theological_decisions:
- issue: Название храмового хлеба
  choice: хлебы, раскладываемые на чистом столе
  alternative: хлебы предложения; хлебы Присутствия; букв. расположение хлеба
  rationale: Основной текст сохраняет акцент еврейского выражения на упорядоченном размещении хлеба, не вводя традиционное название как единственно возможное. Альтернативы отмечены в сноске.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и отличает его от титула.
- issue: Значение משמרת в храмовом контексте
  choice: установления Яхве
  alternative: служение Яхве; поручение Яхве; предписания Яхве
  rationale: Контекст перечисляет регулярные священнические обязанности. «Установления» передаёт обязательность предписанного Богом порядка, не ограничивая фразу одной отдельной обязанностью.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сделан ясным для обычного читателя; регулярность повторяющихся действий передана выражениями «каждое утро» и «каждый вечер». Культовые термины «всесожжение» и «фимиам» сохранены как точные и широко узнаваемые.
