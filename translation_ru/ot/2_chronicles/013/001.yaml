lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: На восемнадцатом году царствования
  rationale: Еврейская формула датировки по годам правления естественно передаётся по-русски как «на восемнадцатом году царствования».
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: Иеровоама
  rationale: Предлог ל в формуле указывает, чьё правление служит основанием датировки; слово «царствования» уже выражает этот смысл, поэтому отдельное «царя» не требуется. Имя передано в принятой русской библейской форме.
- source_word: וַ/יִּמְלֹךְ
  choice: стал царём
  rationale: Форма глагола מלך здесь обозначает вступление на престол, а не просто продолжение правления.
- source_word: אֲבִיָּה
  choice: Авия
  rationale: Передана именно форма имени из текста Паралипоменон; это принятая русская библейская форма.
- source_word: עַל יְהוּדָה
  choice: над Иудеей
  rationale: С глаголом מלך предлог עַל обозначает объект власти; «над Иудеей» сохраняет структуру и смысл оригинала.
