  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: ru
  text: Сыны Израиля обратились в бегство перед Иудой, и Бог отдал их в руки Иуды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их руку» — то есть во власть Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: побежали
  rationale: Глагол נוּס в военном контексте означает бегство или отступление перед противником; «побежали» естественно передаёт начало бегства в повествовательной последовательности.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет формальное выражение древнееврейского текста и при этом понятно в русском библейском повествовании; исторически речь идёт о войске северного царства.
- source_word: מִפְּנֵי יְהוּדָה
  choice: от Иуды
  rationale: Конструкция מִפְּנֵי при глаголе бегства обозначает отступление перед лицом противника. «От Иуды» звучит естественно и не добавляет отсутствующего в тексте слова «войско» или «мужи».
- source_word: וַיִּתְּנֵם
  choice: предал их
  rationale: В военном контексте נתן с последующим בְּיָד выражает передачу противника во власть победителя; «предал» естественнее по-русски, чем буквальное «дал», и сохраняет прямое действие Бога.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В исходном тексте употреблено אֱלֹהִים, а не имя יהוה, поэтому перевод «Бог» точно отражает лексическую форму.
- source_word: בְּיָדָם
  choice: в руки иудеев
  rationale: 'Буквально «в их руку» — древнееврейская идиома власти и контроля. Явное обозначение иудеев устраняет неясность русского местоимения «их»: суффикс отсылает к коллективному «Иуда», то есть к людям Иуды.'
theological_decisions:
- issue: Божественное действие в исходе битвы
  choice: Бог предал их
  alternative: Бог допустил, чтобы они оказались во власти Иуды
  rationale: Текст прямо называет Бога субъектом глагола נתן. Перевод сохраняет непосредственную божественную причинность и не смягчает её до простого дозволения.
- issue: Обозначение противоборствующих общностей
  choice: сыны Израиля ... иудеи
  alternative: израильтяне ... Иуда
  rationale: Первое выражение формально сохраняет בְנֵי יִשְׂרָאֵל. Во второй части «иудеи» раскрывает референт местоименного суффикса при коллективном названии «Иуда», не меняя исторического смысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Сыны Израиля» сознательно сохраняет форму оригинала; «в руки иудеев» делает древнееврейскую идиому и её референт ясными для современного читателя.
