base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: ru
  text: И собрались вокруг него никчёмные люди[a], негодяи, и оказались сильнее Ровоама, сына Соломона. Ровоам же был молод и робок сердцем и не проявил перед ними твёрдости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди пустые, сыны негодности». «Сыны негодности» — древнееврейское выражение, означающее негодных или бесчестных людей.'
    reason: Сноска сохраняет буквальную форму выражения אֲנָשִׁים רֵקִים בְּנֵי בְלִיַּעַל и поясняет идиоматический смысл, не предрешая, является ли «Велиал» личным именем.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: собрались вокруг него
  rationale: Предлог עַל при קבץ допускает значение собрания вокруг кого-либо или против него. Здесь речь идёт о сторонниках Иеровоама, сплотившихся вокруг него; враждебность Ровоаму ясна из дальнейшего контекста.
- source_word: אֲנָשִׁים רֵקִים בְּנֵי בְלִיַּעַל
  choice: люди пустые, негодные
  rationale: רֵקִים буквально означает «пустые» и здесь выражает нравственную ничтожность. Идиома בְּנֵי בְלִיַּעַל в данном древнееврейском контексте естественно передаётся как «негодные», не превращая בְלִיַּעַל без необходимости в имя собственное. Сочетание сохраняет оба параллельных определения.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: одолели
  rationale: Форма породы хитпаэль от אמץ с עַל описывает проявление силы против Ровоама; «одолели» кратко и естественно передаёт результативно-сравнительный смысл, не утверждая обязательно окончательной военной победы.
- source_word: נַעַר
  choice: молод
  rationale: В устах Авии это характеристика относительной молодости и незрелости Ровоама, а не указание на детский возраст.
- source_word: רַךְ לֵבָב
  choice: робок сердцем
  rationale: Буквально «мягок/слаб сердцем»; в политическом контексте выражение указывает на недостаток решимости, а не на добросердечие.
- source_word: וְלֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: не укрепился против них
  rationale: 'Передача сохраняет повтор корня со значением силы и форму утверждения исходного текста: Ровоам не собрался с силами и не оказал им твёрдого сопротивления.'
theological_decisions:
- issue: Значение בְּנֵי בְלִיַּעַל
  choice: негодные
  alternative: сыны Велиала
  rationale: В еврейской Библии это устойчивое идиоматическое обозначение негодных или нечестивых людей. Транслитерация «Велиал» могла бы преждевременно представить слово как бесспорное личное имя; смысловая передача сохраняет моральную оценку без такого догматического уточнения.
- issue: Характер превосходства в וַיִּתְאַמְּצוּ עַל
  choice: одолели
  alternative: укрепились против
  rationale: Глагол допускает буквальную передачу через «укрепились», однако в конструкции с עַל выражает превосходство над Ровоамом. «Одолели» сохраняет эту силу, не добавляя причин или богословской оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. «Робок сердцем» сохраняет образность оригинала, а синтаксис разделён на два предложения ради ясности. Маркер [a] помещён непосредственно после выражения, которое поясняет сноска.
