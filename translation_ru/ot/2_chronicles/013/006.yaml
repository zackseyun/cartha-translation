  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: ru
  text: Иеровоам, сын Навата, слуга Соломона, сына Давида, поднялся и восстал против своего господина[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: восстал
  rationale: Форма глагола קום вводит выступление Иеровоама против установленной власти. «Восстал» сохраняет повествовательную силу и связь с последующим мятежом, не сводя действие исключительно к военному выступлению.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоам, сын Навата
  rationale: Имена переданы в традиционной русской библейской форме, а патроним — буквально.
- source_word: עֶבֶד
  choice: слуга
  rationale: В данном царском и административном контексте עֶבֶד обозначает человека, состоявшего на службе у Соломона. «Слуга» передаёт отношение подчинённости, не навязывая значение рабства как собственности.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Соломона, сына Давида
  rationale: Традиционные русские формы имён и буквальная передача родства сохраняют династический акцент исходного текста.
- source_word: וַיִּמְרֹד
  choice: поднял мятеж
  rationale: Глагол מרד обозначает открытое неповиновение законной власти. Выражение «поднял мятеж» естественно в современном русском и ясно передаёт политический характер действия.
- source_word: עַל אֲדֹנָיו
  choice: против своего господина
  rationale: Слово אָדוֹן с местоименным суффиксом указывает на Соломона как на повелителя Иеровоама. «Господин» сохраняет иерархический смысл; строчная буква ясно показывает, что речь идёт о человеке.
theological_decisions:
- issue: Передача относящегося к человеку אֲדֹנָיו
  choice: своего господина
  alternative: своего хозяина
  rationale: Здесь назван человеческий властитель, а не Бог. «Господин» точнее сохраняет политическое и иерархическое отношение, тогда как «хозяин» может звучать преимущественно бытово или подразумевать собственность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Традиционные формы библейских имён сохранены. Синтаксис следует еврейской последовательности действий, но остаётся естественным по-русски.
