  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: ru
  text: А у нас Яхве — наш Бог, и мы не оставили Его; священники, служащие Яхве, — сыны Аарона, а левиты заняты своим служением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а левиты — при работе», то есть исполняют порученное им служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: А у нас
  rationale: Самостоятельное местоимение с союзом в контексте противопоставляет Иуде северному царству; русское «А у нас» естественно передаёт этот контраст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией тетраграмматона, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: При единственном референте Яхве форма אֱלֹהִים имеет значение единственного числа; притяжательный суффикс передан буквально.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: и мы не оставили Его
  rationale: Глагол עזב означает «оставить, покинуть» и здесь выражает сохраняющую значение верность Яхве; русское прошедшее совершенного вида естественно передаёт еврейский перфект, не исключая нынешнего результата.
- source_word: מְשָׁרְתִים לַיהוָה
  choice: служащие Яхве
  rationale: Причастие обозначает продолжающееся храмовое служение, а ל указывает, кому оно совершается.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыны Аарона
  rationale: Формально сохраняет наследственную священническую линию, выраженную буквально как «сыны Аарона».
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: а левиты заняты своим служением
  rationale: Эллиптическое еврейское выражение буквально говорит, что левиты «при работе»; контекст уточняет, что речь об их храмовых обязанностях.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Временной и аспектуальный смысл עֲזַבְנֻהוּ
  choice: мы не оставили Его
  alternative: мы не оставляем Его; мы Его не покинули
  rationale: Еврейский перфект обозначает совершившееся действие с актуальным результатом в риторическом утверждении о продолжающейся верности; русский вариант сохраняет это, не превращая форму в настоящее время.
- issue: Характер מְלָאכָה у левитов
  choice: служение
  alternative: работа; обязанности
  rationale: В храмовом контексте речь идёт о назначенной левитам работе, однако текст не перечисляет конкретные обязанности; «служение» передаёт контекст без излишнего уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Сыны Аарона» намеренно сохраняет формальную родовую формулу; «заняты своим служением» естественно восполняет эллипсис исходного текста. Единственная сноска поясняет буквальную конструкцию последней фразы.
