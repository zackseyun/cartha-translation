  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: ru
  text: Он царствовал в Иерусалиме три года. Его мать звали Михая, дочь Уриила из Гивы.[a] Между Авией и Иеровоамом шла война.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте, 3 Царств 15:2, мать Авии названа Маахой. Еврейское слово «дочь» может употребляться и в более широком смысле — о потомке женского пола, поэтому два сообщения могут отражать разные варианты имени или разные способы обозначения родства.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: царствовал
  rationale: Обычная и естественная передача глагола в формуле о продолжительности правления царя.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Современная идиоматичная русская передача генеалогической формулы без изменения смысла.
- source_word: מִיכָיָהוּ
  choice: Михая
  rationale: Передаёт данную в масоретском тексте форму еврейского личного имени и не заменяет её формой из параллельного места.
- source_word: בַת אוּרִיאֵל
  choice: дочь Уриила
  rationale: Прямо передаёт конструкцию родства; возможное более широкое значение слова «дочь» не вносится в основной текст.
- source_word: מִן גִּבְעָה
  choice: из Гивы
  rationale: Предлог מִן явно указывает на происхождение из названного места; русское «из Гивы» сохраняет это значение.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: шла война
  rationale: Естественная русская передача экзистенциальной конструкции «была война», не добавляющая идеи начала или завершения войны.
- source_word: בֵּין ... וּבֵין
  choice: между ... и ...
  rationale: Стандартная передача взаимного противостояния двух сторон.
- source_word: אֲבִיָּה
  choice: Авия
  rationale: Передаёт форму имени, употреблённую в книге Паралипоменон, без подмены вариантом из книги Царств.
theological_decisions:
- issue: Различие между именем матери Авии здесь и в 3 Царств 15:2
  choice: 'В основном тексте сохранено чтение Паралипоменона: «Михая, дочь Уриила из Гивы».'
  alternative: Согласовать текст с именем Мааха в 3 Царств 15:2 либо прямо истолковать «дочь» как «внучка/потомок».
  rationale: Перевод следует данному еврейскому тексту и не устраняет генеалогическое напряжение путём гармонизации. Возможные объяснения отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Союз в начале второго еврейского предложения не воспроизведён механически, а связь сохранена последовательностью фраз. Маркер сноски поставлен непосредственно после спорного генеалогического сообщения.
