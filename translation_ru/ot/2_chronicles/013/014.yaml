base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: ru
  text: 'Иудеи обернулись — и вот: бой был перед ними и позади них. Они воззвали к Яхве, и священники трубили в трубы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ יְהוּדָה
  choice: Иудеи обернулись
  rationale: Глагол פנה в данном контексте передаёт поворот к внезапно обнаруженному нападению с тыла. Собирательное «Иуда» естественно передано как «иудеи», то есть войско Иудеи.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет резкий указательный и повествовательно-оживляющий оттенок еврейского выражения, оставаясь естественным в современном русском языке.
- source_word: לָהֶם הַמִּלְחָמָה פָּנִים וְאָחוֹר
  choice: им предстояло сражаться и спереди, и сзади
  rationale: Передаёт ситуацию боя на двух направлениях без неестественной русской кальки «битва была им спереди и сзади». Формулировка не уточняет сверх текста, кто именно наступал.
- source_word: וַיִּצְעֲקוּ
  choice: воззвали
  rationale: Передаёт настойчивый крик, обращённый к Богу, и сохраняет уместный для повествования возвышенный регистр.
- source_word: לַיהוָה
  choice: к Яхве
  rationale: Передаёт личное имя Бога יהוה транслитерацией, в соответствии с принятой проектом практикой.
- source_word: מְחַצְצְרִים בַּחֲצֹצְרוֹת
  choice: трубили в трубы
  rationale: Причастная форма обозначает продолжающееся или сопутствующее действие. Однокоренная русская конструкция естественно передаёт еврейскую фигуру и не добавляет отсутствующее здесь уточнение о серебре.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте и соответствует указанной для проекта установке, не подменяя его титулом.
- issue: Характер обращения к Богу
  choice: воззвали к Яхве
  alternative: закричали Яхве
  rationale: «Воззвали» сохраняет одновременно силу крика и направленность мольбы, не уточняя содержание молитвы, которого стих не сообщает.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сохраняет внезапность сцены и последовательность еврейского повествования; архаизмы и конфессионально окрашенные добавления исключены.
