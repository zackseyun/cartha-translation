  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: ru
  text: Разве вы не знаете, что Яхве, Бог Израиля, навеки даровал Давиду царскую власть над Израилем — ему и его сыновьям[a] — по завету соли[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Его сыновья» — здесь преемники Давида в его царском роде, то есть в династии Давида.
    reason: cultural_note
  - marker: b
    text: 'Или: «посредством завета соли». Это выражение, вероятно, обозначает нерушимый и непреходящий завет; ср. Числа 18:19.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве … не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет обличительную силу обращения.
- source_word: לָכֶם לָדַעַת
  choice: вы не знаете
  rationale: Естественно передаёт обращённое ко множеству слушателей указание на то, что им надлежит знать.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и естественно передаёт еврейскую сопряжённую конструкцию.
- source_word: נָתַן
  choice: даровал
  rationale: Выражает совершённое предоставление царской власти; в русском библейском контексте звучит естественно и достойно.
- source_word: מַמְלָכָה
  choice: царскую власть
  rationale: В данном контексте слово обозначает не только территорию царства, но прежде всего данное Давиду право царствовать над Израилем.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при обозначении царской власти указывает на объект правления.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Сохраняет утверждение о непреходящем характере дарованной Давиду царской власти.
- source_word: לוֹ וּלְבָנָיו
  choice: ему и его сыновьям
  rationale: Сохраняет буквальное «сыновьям», тогда как династический смысл поясняется в сноске.
- source_word: בְּרִית מֶלַח
  choice: по завету соли
  rationale: Сохраняет конкретный древнееврейский образ и связь дарования с заветом, не подменяя образ толкованием.
theological_decisions:
- issue: Непреходящий характер дарования Давиду
  choice: 'Сохранены оба выражения: «навеки» и «завет соли».'
  alternative: Передать «завет соли» толковательно как «непреложный» или «вечный завет».
  rationale: Еврейский текст подчёркивает постоянство и наречием לְעוֹלָם, и образным выражением בְּרִית מֶלַח. Буквальная передача сохраняет богословскую насыщенность и не предрешает её дальнейшее истолкование.
- issue: Значение «сыновей» Давида
  choice: В основном тексте сохранено «его сыновьям», а династический смысл отмечен в сноске.
  alternative: Перевести сразу как «его потомкам» или «его династии».
  rationale: Так сохраняется конкретная родственная лексика оригинала без утраты очевидного в контексте смысла царской преемственности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Риторический вопрос сохранён; конструкция с тире передаёт уточняющее «ему и его сыновьям» без тяжеловесности. Образ «завета соли» оставлен в основном тексте и кратко пояснён в сноске.
