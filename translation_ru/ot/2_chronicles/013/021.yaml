  text: וַ/יִּתְחַזֵּ֣ק אֲבִיָּ֔הוּ וַ/יִּ֨שָּׂא ל֔/וֹ נָשִׁ֖ים אַרְבַּ֣ע עֶשְׂרֵ֑ה וַ/יּ֗וֹלֶד עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ בָּנִ֔ים וְ/שֵׁ֥שׁ עֶשְׂרֵ֖ה בָּנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: ru
  text: Авия укрепился[a], взял себе четырнадцать жён[b] и стал отцом двадцати двух сыновей и шестнадцати дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал сильным», «обрёл могущество» или «укрепил своё положение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «взял себе четырнадцать жён»; это выражение означает вступление в брак.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: укрепился
  rationale: Форма хитпаэль от חזק может обозначать, что человек стал сильнее, утвердился или укрепил своё положение. «Укрепился» кратко и естественно сохраняет эту смысловую широту.
- source_word: אֲבִיָּהוּ
  choice: Авия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: взял себе четырнадцать жён
  rationale: Сохранена близкая к еврейскому тексту брачная идиома с оттенком לוֹ «себе»; по-русски её смысл понятен без добавления оценки.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד при подлежащем-мужчине означает «породил, стал отцом». Современное «стал отцом» точно передаёт смысл без архаичного «родил» или «породил».
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: двадцати двух сыновей
  rationale: Точно сохранены число и указание на сыновей.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: и шестнадцати дочерей
  rationale: Точно сохранены число и указание на дочерей.
theological_decisions:
- issue: Описание многожёнства
  choice: 'Передать повествовательное сообщение без нравственной оценки: «взял себе четырнадцать жён».'
  alternative: 'Перевести более истолковательно: «женился на четырнадцати женщинах», либо добавить подразумеваемую оценку этого обычая.'
  rationale: Стих сообщает о поступке Авии и его детях, но прямо не одобряет и не осуждает многожёнство; перевод не должен вносить отсутствующий в тексте богословский или нравственный вывод.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сжатый и ясный; сохранены последовательность действий, точные числа и различение сыновей и дочерей. Маркеры сносок поставлены непосредственно при соответствующих выражениях.
