  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: ru
  text: Авия вступил в сражение с войском из четырёхсот тысяч отборных воинов — доблестных бойцов; а Иеровоам выстроил против него для битвы восемьсот тысяч отборных воинов — могучих воинов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: вступил в сражение
  rationale: Буквально сочетание означает «связал сражение», но это военная идиома со значением «вступить в бой»; выбран естественный современный русский эквивалент.
- source_word: בְּחַיִל
  choice: с войском
  rationale: В контексте подсчёта воинов חַיִל обозначает военную силу, то есть войско.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: сильных в бою
  rationale: Выражение характеризует людей как могучих, испытанных воинов; формулировка сохраняет оба смысловых компонента и избегает тяжеловесного повтора.
- source_word: בָּחוּר
  choice: отборных
  rationale: Здесь слово обозначает избранных, отборных людей, пригодных для военной службы, а не просто молодых мужчин.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: выстроил против него на битву
  rationale: Военное употребление ערך указывает на построение сил в боевой порядок; контекст ясно выражает противостояние.
- source_word: גִּבּוֹר חָיִל
  choice: храбрых и опытных бойцов
  rationale: Устойчивое военное выражение обозначает доблестных, способных воинов; перевод передаёт функциональный смысл на современном русском языке.
