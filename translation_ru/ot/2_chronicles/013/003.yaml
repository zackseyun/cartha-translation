translation_notes:
  register: 'Современный литературный русский язык, торжественный, но общепонятный. Различены близкие еврейские военные выражения: גִּבּוֹרֵי מִלְחָמָה передано как «сильные в бою», а גִּבּוֹר חָיִל — как «храбрые и опытные бойцы». Маркер сноски помещён непосредственно после относящегося к ней выражения.'
