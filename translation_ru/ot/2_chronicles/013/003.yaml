revisions:
- from: Авия вступил в сражение с войском из четырёхсот тысяч отборных воинов, сильных в бою; а Иеровоам выстроил против него на битву восемьсот тысяч отборных воинов — храбрых и опытных бойцов.[a]
  to: Авия вступил в сражение с войском из четырёхсот тысяч отборных воинов — доблестных бойцов; а Иеровоам выстроил против него для битвы восемьсот тысяч отборных воинов — могучих воинов.
  rationale: Исправлены добавочный смысл «опытных», неестественная конструкция с «на битву» и неудачная привязка сноски. «Вступил в сражение» передаёт еврейскую военную идиому, «войско из» — חַיִל в контексте численности, а числительные и указание на отборность воинов сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:40:24Z'
review_pass:
  verdict: revise
  source_fidelity: Смысл военных идиом и численность войск в целом переданы верно. Однако «опытных» в характеристике גִּבּוֹר חָיִל добавляет признак, прямо не выраженный в еврейском тексте; его следует убрать. Первое גִּבּוֹרֵי מִלְחָמָה точнее передать как характеристику доблестных/могучих воинов, а не описательно «сильных в бою».
  naturalness: «Выстроил против него на битву» звучит неестественно по-русски; нормативнее «выстроил против него для битвы» или «выстроил против него войско». Предлагаемая редакция сохраняет современный литературный и повествовательный регистр.
  terminology: '«Отборные воины» удачно передаёт בָּחוּר. Для обоих близких военных обозначений предпочтительны «доблестные воины» и «могучие воины»: они естественны, не вносят дополнительного смысла и сохраняют различие между выражениями.'
  issues:
  - severity: medium
    issue: Добавлен признак «опытных» во втором описании войска.
    rationale: גִּבּוֹר חָיִל характеризует воинов как сильных, доблестных, способных к бою; «опыт» возможен как вывод из контекста, но не выражен лексически и не должен вноситься в перевод.
  - severity: low
    issue: Формулировка «выстроил против него на битву» неестественна.
    rationale: Военное עָרַךְ обозначает построение войска для сражения. «Выстроил против него для битвы» передаёт это значение нормативно и ясно.
  - severity: low
    issue: Сноска поставлена после всего предложения, хотя относится лишь к заключительному выражению.
    rationale: Если сноска сохраняется, её маркер должен стоять непосредственно после «могучих воинов». В исправленном варианте дополнительная сноска не требуется, поскольку перевод прозрачен и не содержит существенной неотражённой неоднозначности.
  revised_text: Авия вступил в сражение с войском из четырёхсот тысяч отборных воинов — доблестных бойцов; а Иеровоам выстроил против него для битвы восемьсот тысяч отборных воинов — могучих воинов.
