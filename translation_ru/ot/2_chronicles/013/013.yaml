revisions:
- from: Но Иеровоам послал отряд в засаду, чтобы тот обошёл их и зашёл им в тыл. Поэтому основные силы оказались перед иудеями, а засада — позади них.
  to: Но Иеровоам направил засаду в обход, чтобы она зашла им в тыл; и вот, они оказались перед Иудеей, а засада — позади них.
  rationale: 'Исправление сохраняет пространственный параллелизм оригинала и его намеренную местоименную краткость: «они» перед Иудеей и «засада» позади «них». Устранены добавления, превращавшие манёвр засады в отправку особого отряда и прямо называвшие основные силы.'
