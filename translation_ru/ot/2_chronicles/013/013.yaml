  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: ru
  text: Но Иеровоам направил засаду в обход, чтобы она зашла им в тыл; и вот, они оказались перед Иудеей, а засада — позади них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Устоявшаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: הֵסֵב אֶת הַמַּאְרָב
  choice: послал отряд в засаду, чтобы тот обошёл
  rationale: Глагол выражает обходной манёвр; «отряд в засаду» естественно передаёт собирательное הַמַּאְרָב как военное подразделение, направленное в тыл противнику.
- source_word: לָבוֹא מֵאַחֲרֵיהֶם
  choice: зашёл им в тыл
  rationale: Современная русская военная формулировка точно передаёт цель манёвра — оказаться позади войска Иудеи.
- source_word: לִפְנֵי יְהוּדָה
  choice: перед иудеями
  rationale: Здесь יְהוּדָה обозначает войско или народ Иудеи, а не только территорию; форма «иудеями» устраняет географическую двусмысленность.
- source_word: וְהַמַּאְרָב מֵאַחֲרֵיהֶם
  choice: а засада — позади них
  rationale: 'Сохраняет лаконичный параллелизм оригинала: противник впереди, засада сзади.'
