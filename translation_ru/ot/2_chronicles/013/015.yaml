base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: ru
  text: И воины Иуды издали боевой клич. Когда воины Иуды закричали, Бог поразил Иеровоама и весь Израиль перед Авией и Иудой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: издали боевой клич / закричали
  rationale: Глагол רוע в данном военном контексте обозначает громкий боевой возглас. В первом употреблении естественная русская формулировка уточняет характер крика, а во втором сохраняет повтор исходного текста без тяжеловесности.
- source_word: אִישׁ יְהוּדָה
  choice: воины Иуды
  rationale: Буквально «мужи Иуды»; контекст сражения показывает, что речь идёт о воинах. Современное русское «воины Иуды» яснее, чем архаичное «мужи Иудеи».
- source_word: נָגַף
  choice: поразил
  rationale: Глагол означает нанесение поражения или сокрушительного удара. «Поразил» сохраняет прямое действие Бога, не уточняя без основания, что все названные были убиты.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Сохранён пространственно-военный образ исходного выражения: Бог нанёс поражение противнику перед Авией и Иудой.'
theological_decisions:
- issue: Божественное действие в исходе сражения
  choice: Бог поразил Иеровоама и весь Израиль
  alternative: Иеровоам и весь Израиль потерпели поражение
  rationale: Исходный текст прямо называет Бога действующим субъектом; пассивная формулировка ослабила бы это утверждение.
- issue: Смысл נָגַף
  choice: поразил
  alternative: убил / сразил насмерть
  rationale: Контекст говорит о военном поражении, но стих сам по себе не утверждает гибель каждого из названных и тем более Иеровоама; поэтому более узкое значение не навязывается.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным тоном. Военный контекст передан ясно, без архаизмов и без добавления отсутствующих в тексте деталей.
