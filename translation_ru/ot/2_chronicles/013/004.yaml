source:
  edition: WLC
  text: וַ/יָּ֣קָם אֲבִיָּ֗ה מֵ/עַל֙ לְ/הַ֣ר צְמָרַ֔יִם אֲשֶׁ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי יָרָבְעָ֥ם וְ/כָל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: ru
  text: 'Тогда Авия встал на горе Цемараим[a], что в горной области Ефрема, и сказал: «Послушайте меня, Иеровоам и весь Израиль!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что в горах Ефрема». Еврейское выражение может обозначать горную область или гористую местность Ефрема.'
    reason: Лексическая и географическая неоднозначность слова הַר.
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: В повествовательном контексте קום обычно означает «встать» или «подняться». «Встал» естественно вводит последующую речь и не приписывает глаголу излишне специального военного значения.
- source_word: מֵעַל לְהַר
  choice: на горе
  rationale: Необычное сочетание предлогов передаёт положение Авии на возвышенности. По-русски простой местный оборот «на горе» ясно и естественно выражает этот смысл.
- source_word: צְמָרַיִם
  choice: Цемараим
  rationale: Географическое название передано традиционной русской библейской транслитерацией.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: что в горной области Ефрема
  rationale: Слово הַר здесь может обозначать не одну гору, а гористую местность. «Горная область Ефрема» сохраняет региональный смысл и звучит естественно в современном русском языке.
- source_word: וַיֹּאמֶר
  choice: и сказал
  rationale: Обычная повествовательная формула введения прямой речи.
- source_word: שְׁמָעוּנִי
  choice: Послушайте меня
  rationale: Форма представляет собой повелительное наклонение множественного числа от שמע с местоименным суффиксом первого лица. «Послушайте меня» непосредственно и естественно передаёт призыв обратить внимание на речь.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Иеровоам и весь Израиль
  rationale: Сохранено прямое обращение к царю и ко всему собравшемуся северному Израилю; национальное имя не заменено этническим обозначением.
theological_decisions:
- issue: Передача יִשְׂרָאֵל в контексте разделённого царства
  choice: весь Израиль
  alternative: все израильтяне
  rationale: Еврейский текст употребляет непосредственно национально-заветное имя. Формулировка «весь Израиль» сохраняет риторику Летописца и напряжение, связанное с тем, что так названо северное царство в эпоху разделённой монархии.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Имена переданы в узнаваемой русской библейской форме. Прямая речь сформулирована ясно и энергично без архаизации.
