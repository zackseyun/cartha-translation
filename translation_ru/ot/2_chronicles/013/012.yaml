  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: ru
  text: 'И вот: Бог с нами, Он во главе нас; с нами и Его священники с трубами для боевого сигнала, чтобы трубить против вас. Сыны Израиля[a], не воюйте против Яхве, Бога ваших отцов, ведь вы не добьётесь успеха.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израильтяне». Буквально: «сыны Израиля»; здесь это прямое обращение к израильскому народу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт эмфатический указательный маркер, привлекающий внимание к следующему утверждению, и естественно звучит в современной русской повествовательной речи.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: с нами во главе — Бог
  rationale: Сохраняет буквальный образ Бога, находящегося «во главе», то есть предводительствующего и выступающего впереди народа.
- source_word: וְכֹהֲנָיו
  choice: и с нами Его священники
  rationale: Местоименный суффикс относится к Богу. Повтор «с нами» добавлен для ясности русской синтаксической связи, не меняя смысла.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: с трубами для боевого сигнала
  rationale: חֲצֹצְרוֹת обозначает трубы, а תְּרוּעָה — громкий сигнал, клич или тревогу. В военном контексте «боевой сигнал» передаёт назначение труб без излишнего уточнения.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: чтобы трубить против вас
  rationale: Сохраняет отдельную целевую конструкцию с инфинитивом и враждебную направленность עֲלֵיכֶם, не сливая её с предшествующим словосочетанием о трубах.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Формально передаёт еврейское обращение в мужском множественном числе и сохраняет его заветно-родовой оттенок; более нейтральное понимание пояснено в сноске.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: не воюйте против Яхве
  rationale: После глагола לחם предлог עִם выражает противника. Запрет передан прямой и естественной формой русского повелительного наклонения.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Бога ваших отцов
  rationale: Сохраняет традиционную заветную формулу и ясно связывает Яхве с Богом предков адресатов.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: ведь вы не добьётесь успеха
  rationale: Глагол צלח в породе hифиль означает преуспеть или добиться успеха. Формулировка сохраняет более широкий смысл, не сводя его исключительно к победе в сражении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное заветное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не привносит конфессионального истолкования.
- issue: Обращение בְּנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  alternative: Израильтяне; народ Израиля
  rationale: Выбранная форма сохраняет буквальный родовой образ исходного выражения. Сноска поясняет, что обращение относится к израильтянам как народу, а не только к мужчинам.
- issue: Бог «во главе» войска Иуды
  choice: с нами во главе — Бог
  alternative: Бог с нами как наш предводитель
  rationale: Сохранён пространственно-лидерский образ בָרֹאשׁ без разъяснения того, каким именно образом осуществляется Божье предводительство.
translation_notes:
  register: Современный литературный русский язык с торжественностью публичной военной речи. Синтаксис остаётся ясным для обычного читателя; традиционные формулы «сыны Израиля» и «Бог ваших отцов» сохранены там, где они несут важный образный и заветный оттенок.
