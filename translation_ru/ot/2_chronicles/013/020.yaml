base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: ru
  text: Иеровоам больше не имел силы во дни Авии, и Яхве поразил его[a], и он умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нанёс ему удар», «поразил бедствием». Еврейский текст не уточняет, каким именно образом Яхве поразил Иеровоама.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: не мог удерживать свою силу
  rationale: Сочетание буквально передаёт способность сохранять или удерживать силу. В контексте отрицания оно указывает, что Иеровоам более не сохранял прежней мощи, не сводя смысл исключительно к военной победе.
- source_word: עוֹד
  choice: уже не
  rationale: При отрицании עוֹד естественно означает «больше не, уже не».
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: во дни Авии
  rationale: Устойчивое временное выражение со значением «во время жизни или правления Авии»; формулировка сохраняет библейское достоинство и остаётся понятной.
- source_word: וַיִּגְּפֵהוּ
  choice: поразил его
  rationale: Глагол נגף обозначает нанесение удара, поражение или бедствие. «Поразил» сохраняет неопределённость относительно конкретного средства божественного действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Простая последовательность повествовательных форм передана без добавления прямо не выраженной причинной связи.
theological_decisions:
- issue: Характер действия Яхве в וַיִּגְּפֵהוּ יְהוָה
  choice: Яхве «поразил» Иеровоама, после чего тот умер; средство поражения не уточняется.
  alternative: Яхве наслал на него болезнь или немедленно умертвил его особым ударом суда.
  rationale: Еврейский текст прямо приписывает действие Яхве, но не сообщает, было ли оно болезнью, военным поражением или иным бедствием. Перевод сохраняет эту неопределённость и не делает последовательное «и он умер» более узкой причинной формулой.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Выражение «во дни Авии» сохраняет традиционную временную формулу; синтаксис с повтором «и» отражает последовательность еврейского повествования. Маркер [a] стоит непосредственно после слова, к которому относится примечание.
