  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: ru
  text: Так в то время сыны Израиля были побеждены, а сыны Иуды одержали верх, потому что сыны Иуды опирались на Яхве[a], Бога своих отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה (ЙХВХ); в традиционных переводах обычно заменяется словом «Господь».
    reason: Поясняет непривычную для части русскоязычных читателей передачу тетраграмматона и исправляет смешанное латинско-кириллическое написание согласных.
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: были покорены
  rationale: Нифаль глагола כנע выражает приведение в подчинение или унижение. В военном контексте «были покорены» передаёт результат поражения, не усиливая его до полного разгрома.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет форму еврейского выражения и параллель с «сынами Иуды»; в данном контексте обозначает войско северного царства.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Естественный русский эквивалент временного оборота.
- source_word: וַיֶּאֶמְצוּ
  choice: укрепились
  rationale: Передаёт основное значение אמץ — стать сильными, укрепиться. Контекст указывает на военный перевес, но перевод не сводит значение исключительно к победе.
- source_word: בְנֵי יְהוּדָה
  choice: сыны Иуды
  rationale: Сохраняет параллелизм исходного текста и ясно обозначает представителей Иудейского царства.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит причину, по которой сыны Иуды укрепились.
- source_word: נִשְׁעֲנוּ עַל
  choice: опирались на
  rationale: Сохраняет образ глагола שען — «опираться», который здесь метафорически означает полагаться на кого-либо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Естественно передаёт конструкцию принадлежности и сохраняет библейское указание на отцов народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Связь успеха Иуды с упованием на Бога
  choice: «укрепились, потому что опирались на Яхве»
  alternative: «победили, потому что верили в Яхве»
  rationale: Выбранная формулировка сохраняет как значение силы в אמץ, так и образ опоры в שען, не сводя их к более узким толкованиям «победить» и «верить».
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Оборот «сыны Израиля / сыны Иуды» сохранён ради параллелизма и историко-библейского колорита; синтаксис сделан естественным для современного читателя.
