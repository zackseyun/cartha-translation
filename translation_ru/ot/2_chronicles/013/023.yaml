  text: וַ/יִּשְׁכַּ֨ב אֲבִיָּ֜ה עִם אֲבֹתָ֗י/ו וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בְּ/עִ֣יר דָּוִ֔יד וַ/יִּמְלֹ֛ךְ אָסָ֥א בְנ֖/וֹ תַּחְתָּ֑י/ו בְּ/יָמָ֛י/ו שָׁקְטָ֥ה הָ/אָ֖רֶץ עֶ֥שֶׂר שָׁנִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: ru
  text: Авия почил со своими предками, и его похоронили в Городе Давида. Вместо него воцарился его сын Аса. В его дни земля пребывала в покое[a] десять лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля была спокойна десять лет».'
    reason: 'Лексическая альтернатива: שׁקט может описывать как покой от внешних потрясений, так и спокойное, ничем не нарушаемое состояние.'
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил со своими предками
  rationale: Устойчивая древнееврейская формула сообщает о смерти царя. «Почил» сохраняет образ сна, но в современном русском ясно воспринимается как достойное обозначение смерти; «предки» естественнее и точнее по охвату, чем буквальное «отцы».
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: его похоронили
  rationale: Сохранена активная форма с неопределённым множественным субъектом, а русский порядок слов делает повествование естественным.
- source_word: בְּעִיר דָּוִיד
  choice: в Городе Давида
  rationale: Это традиционное название конкретного места; прописная буква передаёт его характер как топонима.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В контексте династической преемственности глагол означает вступление на царство. «Воцарился» естественно передаёт наступившее вслед за смертью отца правление.
- source_word: אָסָא בְנוֹ
  choice: его сын Аса
  rationale: Русский порядок слов ясно связывает Асу с Авией и сохраняет все элементы исходной фразы.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Фраза обозначает преемство и буквально выражает занятие места предшественника; вариант не добавляет хронологического оттенка сверх текста.
- source_word: בְּיָמָיו
  choice: в его дни
  rationale: Сохранена образность еврейского выражения без сужения смысла до формального периода царствования.
- source_word: שָׁקְטָה
  choice: пребывала в покое
  rationale: Глагол обозначает спокойствие и отсутствие потрясений. Формулировка передаёт продолжительное состояние и соответствует возвышенному повествовательному регистру.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Прямой эквивалент сохраняет возможный смысл территории или страны и не уточняет его до более интерпретирующего «царство».
- source_word: עֶשֶׂר שָׁנִים
  choice: десять лет
  rationale: Русская форма длительности не требует дополнительного предлога и точно передаёт указанный срок.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Царская формула смерти передана без архаичного «почил с отцами своими»; синтаксис остаётся ясным для обычного читателя. Сноска поставлена при словах, к которым относится лексическая альтернатива.
