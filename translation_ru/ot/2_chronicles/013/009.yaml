source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: ru
  text: Разве не вы изгнали священников Яхве — сыновей Аарона и левитов — и не поставили себе священников, как народы других земель? Всякий, кто приходит для посвящения в священники[a] с молодым быком и семью баранами, становится священником не-богов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы наполнить свою руку» — устойчивое выражение, обозначающее посвящение или поставление на священническое служение.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «для не-богов» или «ложных богов». Еврейский текст прямо отрицает, что эти объекты поклонения являются настоящими богами.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не вы...
  rationale: Риторический вопрос ожидает согласия и выражает обличение; конструкция «разве не» естественно передаёт эту силу по-русски.
- source_word: הִדַּחְתֶּם
  choice: изгнали
  rationale: Порода hифиль от נדח обозначает принудительное удаление; «изгнали» точно и естественно передаёт действие.
- source_word: כֹּהֲנֵי יְהוָה
  choice: священников Яхве
  rationale: Сопряжённая конструкция передана прямо, а тетраграмматон — личным именем «Яхве».
- source_word: בְּנֵי אַהֲרֹן וְהַלְוִיִּם
  choice: сыновей Аарона и левитов
  rationale: Сохраняет формальное обозначение законной священнической линии и отдельное упоминание левитов.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: поставили себе священников
  rationale: В данном контексте עשה означает назначение или учреждение; «поставили» звучит естественнее буквального «сделали», сохраняя оттенок самовольного действия.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: как народы других земель
  rationale: Передаёт сравнение с окружающими народами без внесения оценочного слова «язычники»; «других» делает русскую фразу понятной.
- source_word: כָּל הַבָּא
  choice: Всякий, кто приходит
  rationale: Точно передаёт обобщающую конструкцию и подчёркивает открытость порочной практики для любого желающего.
- source_word: לְמַלֵּא יָדוֹ
  choice: для посвящения
  rationale: Это устойчивое культовое выражение, буквально «наполнить его руку», обозначающее введение в священническое служение; смысл вынесен в текст, буквальная форма — в сноску.
- source_word: בְּפַר בֶּן בָּקָר וְאֵילִם שִׁבְעָה
  choice: с молодым быком и семью баранами
  rationale: Естественно и точно передаёт перечисленные приношения; творительный падеж сохраняет инструментальный оттенок ב.
- source_word: וְהָיָה כֹהֵן לְלֹא אֱלֹהִים
  choice: становится священником тех, кто не боги
  rationale: Сохраняет результирующее значение וְהָיָה и резкое отрицание подлинной божественности объектов поклонения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл לְלֹא אֱלֹהִים
  choice: тех, кто не боги
  alternative: ложных богов; не-богов; для тех, кто не боги
  rationale: Еврейское выражение полемически отрицает божественность объектов культа. Выбранная формулировка сохраняет это отрицание, не сглаживая его до классификационного ярлыка «ложные боги».
- issue: Передача идиомы לְמַלֵּא יָדוֹ
  choice: для посвящения
  alternative: чтобы наполнить свою руку; чтобы посвятить себя
  rationale: Идиома обозначает обряд поставления в священники. «Для посвящения» сообщает смысл без спорного уточнения, кто именно совершает посвящение; буквальный образ сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Риторическое обличение сохранено без архаизмов; культовая идиома раскрыта в основном тексте и документирована в сноске. Тире выделяют пояснение к слову «священников» и облегчают восприятие длинной первой части стиха.
