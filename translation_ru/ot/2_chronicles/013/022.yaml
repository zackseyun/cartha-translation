  source_fidelity: 'Русский текст точно передаёт еврейскую формулу: «остальные деяния» уместно отражает וְיֶתֶר דִּבְרֵי в историографическом контексте; «его пути и его слова» сохраняет различие между וּדְרָכָיו и וּדְבָרָיו; «записаны» верно передаёт כְּתוּבִים. Связка «в мидраше пророка Иддо» соответствует בְּמִדְרַשׁ הַנָּבִיא עִדּוֹ.'
