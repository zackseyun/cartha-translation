source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲבִיָּ֔ה וּ/דְרָכָ֖י/ו וּ/דְבָרָ֑י/ו כְּתוּבִ֕ים בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: ru
  text: Остальные деяния Авии, его пути и его слова записаны в мидраше[a] пророка Иддо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «толковании», «исследовании»; возможно, в более общем смысле — «записи». Еврейское слово «мидраш» здесь обозначает письменный труд, основанный на исследовании или истолковании, и не обязательно относится к позднее сложившемуся раввинистическому жанру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Остальные
  rationale: Передаёт оставшуюся часть сведений без добавления отсутствующего в еврейском тексте временного маркера «теперь».
- source_word: דִּבְרֵי אֲבִיָּה
  choice: деяния Авии
  rationale: В формуле царской историографии דִּבְרֵי обозначает не только слова, но дела и события царствования; «деяния» естественно передаёт этот смысл.
- source_word: וּדְרָכָיו
  choice: его пути
  rationale: Сохраняет образ еврейского דֶּרֶךְ, которое здесь может обозначать образ жизни, поведение или жизненный путь.
- source_word: וּדְבָרָיו
  choice: его слова
  rationale: В отличие от первого דִּבְרֵי, уже переданного как «деяния» в историографической формуле, здесь выражение может относиться к словам или речам Авии; буквальное «слова» сохраняет широту значения.
- source_word: כְּתוּבִים
  choice: записаны
  rationale: Естественно передаёт значение письменной фиксации, выраженное страдательным причастием от כתב.
- source_word: בְּמִדְרַשׁ
  choice: в мидраше[a]
  rationale: Транслитерация сохраняет особый еврейский термин и не сводит его без достаточных оснований к одному виду произведения; сноска поясняет его значение в данном раннем контексте.
- source_word: הַנָּבִיא עִדּוֹ
  choice: пророка Иддо
  rationale: Естественная русская конструкция после названия письменного труда; имя передано традиционной транслитерацией.
theological_decisions:
- issue: Характер названного письменного источника
  choice: Сохранить термин «мидраш» с пояснением
  alternative: «толкование», «исследование» или «летопись»
  rationale: Точное жанровое значение מִדְרָשׁ здесь не вполне определённо. Транслитерация не отождествляет этот труд автоматически ни с позднейшим раввинистическим жанром, ни с обычной летописью.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Формулировка краткая и ясная; образ «пути» сохранён, а малознакомый термин «мидраш» объяснён в сноске.
