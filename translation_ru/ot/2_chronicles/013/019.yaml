base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: ru
  text: 'Авия погнался за Иеровоамом и захватил у него города: Вефиль с зависимыми от него селениями, Иешану с зависимыми от неё селениями и Ефрон с зависимыми от него селениями.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: погнался за
  rationale: Передаёт преследование после сражения естественным современным русским выражением.
- source_word: וַיִּלְכֹּד מִמֶּנּוּ עָרִים
  choice: отнял у него города
  rationale: לכד здесь означает захват городов, а מִמֶּנּוּ указывает, что они были отняты у Иеровоама; формулировка сохраняет синтаксическое выделение слова «города».
- source_word: בְּנוֹתֶיהָ / בְנֹתֶיהָ
  choice: зависимые от него/неё селения
  rationale: Буквально «её дочери» — устойчивое обозначение подчинённых малых поселений; функциональный перевод понятнее современному читателю и сохраняет отношение зависимости.
- source_word: עפרון
  choice: Ефрон
  rationale: Масоретское написание допускает чтение «Ефрон»; оно соответствует консультационному английскому тексту, хотя существует вариант «Ефраин».
