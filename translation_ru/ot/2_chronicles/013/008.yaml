  source_fidelity: В черновике верно переданы «царство Яхве», династическая формула «в руках сыновей Давида», многочисленность войска, золотые тельцы и множественное число в «как богов». Однако «вы думаете» заменяет прямо выраженное אֹמְרִים («вы говорите / заявляете») внутренним состоянием. Формулировка «сможете устоять» также несколько ослабляет активный оттенок הִתְחַזֵּק — попытку показать себя сильными в противостоянии.
  naturalness: «Царством Яхве, находящимся в руках сыновей Давида» грамматически возможно, но тяжеловесно и на мгновение допускает неверное прочтение, будто «в руках» находятся только сыновья Давида. Относительное придаточное после «царством» делает связь яснее. «Ведь вас великое множество» естественно связывает последующие обстоятельства с хвастливым заявлением.
  terminology: «Яхве», «царство», «сыновья Давида», «золотые тельцы» и «боги» уместны и сохраняют терминологические и полемические особенности текста. Не следует заменять множественное «боги» единственным числом.
