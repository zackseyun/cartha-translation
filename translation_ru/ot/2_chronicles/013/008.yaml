  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: ru
  text: И теперь вы заявляете, что способны противостоять царству Яхве, которое находится в руках сыновей Давида.[a] Ведь вас великое множество, и с вами золотые тельцы, которых Иеровоам сделал вам как богов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «укрепиться перед царством Яхве, которое находится в руках сыновей Давида». Выражение «в руках сыновей Давида» означает власть или управление через династию Давида.'
    reason: lexical_and_cultural_note
  - marker: b
    text: 'Или: «в качестве богов». В еврейском тексте стоит множественное число; оно полемически относится к тельцам-идолам Иеровоама.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: вы думаете
  rationale: Причастие буквально означает «говорите», но в данном контексте может выражать намерение или уверенный замысел. «Думаете» естественно передаёт риторическое обвинение, не превращая его в простую цитату.
- source_word: לְהִתְחַזֵּק לִפְנֵי
  choice: что сможете устоять перед
  rationale: Порода hitpael глагола חזק выражает стремление укрепиться или показать себя сильным; לִפְנֵי буквально означает «перед». В военном контексте сочетание передано как попытка выдержать противостояние, при этом образ «перед» сохранён.
- source_word: מַמְלֶכֶת יְהוָה
  choice: царством Яхве
  rationale: Передаёт прямое утверждение текста, что царство принадлежит Яхве, и сохраняет личное имя, представленное тетраграмматоном.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: находящимся в руках сыновей Давида
  rationale: Сохранён древнееврейский образ «в руке», обозначающий власть или управление; множественное «сыновей» указывает на династическую линию Давида.
- source_word: הָמוֹן רָב
  choice: вас великое множество
  rationale: Естественное и торжественное русское выражение, подчёркивающее численное превосходство противников.
- source_word: עֶגְלֵי זָהָב
  choice: золотые тельцы
  rationale: Прямое и традиционно понятное обозначение культовых изображений Иеровоама.
- source_word: לֵאלֹהִים
  choice: как богов
  rationale: 'Сохраняет грамматическое множественное число и полемический смысл: тельцы были сделаны в качестве божеств.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Соотношение царства Яхве и династии Давида
  choice: царством Яхве, находящимся в руках сыновей Давида
  alternative: царством Яхве под властью сыновей Давида
  rationale: 'Формулировка сохраняет напряжение исходного текста: царство принадлежит Яхве, но находится в управлении Давидовой династии, не отождествляя полностью Божье царство с человеческими правителями.'
- issue: Статус золотых тельцов
  choice: как богов
  alternative: для богов
  rationale: Так сохраняются множественное число и полемическое представление идолов в роли божеств, без смягчения оценки текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием публичной речи. Синтаксис сделан ясным для обычного читателя; ключевые древнееврейские образы и богословская напряжённость сохранены.
