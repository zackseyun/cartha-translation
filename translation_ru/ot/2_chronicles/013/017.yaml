base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: ru
  text: Авия и его народ нанесли им сокрушительный удар[a], и из Израиля пали убитыми пятьсот тысяч отборных воинов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великий удар»; возможно также: «сильный удар» или «великое избиение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пятьсот тысяч отборных мужчин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: нанесли им
  rationale: Глагол נכה с предлогом ב в военном контексте обозначает нанесение удара противнику; сочетание естественно передаётся по-русски вместе с последующим מַכָּה как «нанесли им ... поражение».
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: Авия и его народ
  rationale: Сохраняется широкое значение עַם — «народ, люди»; хотя контекст военный, слово не сужается до «войска».
- source_word: מַכָּה רַבָּה
  choice: тяжёлое поражение
  rationale: Буквально выражение означает «великий/сильный удар». В современном русском описании сражения «тяжёлое поражение» естественно передаёт масштаб удара, не дублируя следующую фразу о погибших.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: пали убитыми
  rationale: 'Сохраняются оба элемента исходного выражения: נפל — «пасть» и חָלָל — «убитый, павший в бою».'
- source_word: מִיִּשְׂרָאֵל
  choice: из израильтян
  rationale: Предлог מן указывает на группу, из числа которой были погибшие; по-русски это ясно и естественно выражено как «из израильтян».
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: пятьсот тысяч
  rationale: Число передано непосредственно, без исторической или символической переинтерпретации.
- source_word: אִישׁ בָּחוּר
  choice: отборных воинов
  rationale: בָּחוּר здесь характеризует отобранных, лучших мужчин боеспособного возраста; военный контекст позволяет естественное русское «отборные воины».
theological_decisions:
- issue: Большое число погибших в повествовании о битве
  choice: Сохранить указанное в еврейском тексте число — пятьсот тысяч.
  alternative: Истолковать число как гиперболу либо понимать אֶלֶף как обозначение воинских подразделений или родовых групп.
  rationale: Масоретский текст прямо приводит это число и в самом стихе не даёт сигнала к его уменьшению или символическому толкованию; перевод не должен скрыто разрешать историко-критический вопрос.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Формула «пали убитыми» сохраняет библейскую военную образность, а «нанесли ... тяжёлое поражение» звучит естественно для современного читателя. Все сноски отмечены в основном тексте.
