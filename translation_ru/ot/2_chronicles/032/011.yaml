  text: הֲ/לֹ֤א יְחִזְקִיָּ֨הוּ֙ מַסִּ֣ית אֶתְ/כֶ֔ם לָ/תֵ֣ת אֶתְ/כֶ֔ם לָ/מ֛וּת בְּ/רָעָ֥ב וּ/בְ/צָמָ֖א לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵ֔י/נוּ יַצִּילֵ֕/נוּ מִ/כַּ֖ף מֶ֥לֶךְ אַשּֽׁוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: ru
  text: 'Разве Езекия не вводит вас в заблуждение[a], отдавая вас на смерть от голода и жажды и говоря: «Яхве, наш Бог, избавит нас от руки ассирийского царя»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обманывает вас» или «склоняет вас». Древнееврейский глагол может означать, что кого-либо уводят с верного пути или ошибочно убеждают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве ... не
  rationale: Передаёт риторический вопрос, предполагающий согласие слушателей, и сохраняет обвинительный тон.
- source_word: מַסִּית
  choice: вводит вас в заблуждение
  rationale: Каузативная форма глагола סות обозначает побуждение пойти неверным путём или ошибочно поддаться убеждению; выбранный оборот не сужает смысл до намеренного обмана или подстрекательства.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: отдавая вас на смерть
  rationale: Сохраняет образ передачи людей во власть смертельной участи и естественно звучит по-русски.
- source_word: בְּרָעָב וּבְצָמָא
  choice: от голода и жажды
  rationale: Передаёт средства или причины смерти в условиях осады; русское «от голода и жажды» естественнее буквального повторения предлога.
- source_word: לֵאמֹר
  choice: и говоря
  rationale: Сохраняет ввод прямой речи и координацию с предшествующим оборотом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Прямо передаёт форму с местоименным суффиксом и утверждение говорящего о принадлежности Богу.
- source_word: יַצִּילֵנוּ
  choice: избавит нас
  rationale: Соответствует военному контексту избавления от вражеской власти и сохраняет также богословскую окраску глагола, не усиливая её.
- source_word: מִכַּף
  choice: от руки
  rationale: Сохраняет прозрачный и привычный в русском библейском стиле древнееврейский образ руки как власти или контроля.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ассирийского царя
  rationale: Естественно передаёт древнееврейскую сопряжённую конструкцию «царь Ассирии» без изменения смысла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Форма «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер обвинения Езекии
  choice: вводит вас в заблуждение
  alternative: обманывает вас; склоняет вас
  rationale: Формулировка сохраняет возможный диапазон значения מַסִּית и не утверждает сверх текста ни сознательной лжи Езекии, ни конкретного вида подстрекательства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторическая резкость речи сохранена; обороты «на смерть» и «от руки» понятны в контексте и поддерживают образность оригинала.
