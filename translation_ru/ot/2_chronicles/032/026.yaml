  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: ru
  text: Тогда Езекия смирился из-за надменности своего сердца[a], и вместе с ним — жители Иерусалима, поэтому гнев Яхве не постиг их во дни Езекии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смирился в своей сердечной надменности». Буквально: «в/из-за высоты своего сердца»; это выражение означает внутреннюю гордость или высокомерие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: смирился
  rationale: 'Нифаль глагола כנע в данном контексте имеет возвратно-медиальное значение: Езекия сам смирился в покаянии.'
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: из-за надменности своего сердца
  rationale: Буквально «из-за/в высоте его сердца»; сочетание обозначает внутреннее превозношение. «Надменность» естественно передаёт нравственный смысл, а причинное «из-за» соответствует контексту, хотя предлог допускает иной оттенок, отмеченный в сноске.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלָם
  choice: и вместе с ним — жители Иерусалима
  rationale: Эмфатическое הוּא включает самого Езекию наряду с жителями города. Такая русская конструкция ясно показывает, что смирились и царь, и жители.
- source_word: קֶצֶף יְהוָה
  choice: гнев Яхве
  rationale: קֶצֶף обозначает сильный гнев, особенно как выражение Божьего суда; личное имя יהוה передано как «Яхве».
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: не постиг их
  rationale: Еврейское выражение буквально говорит, что гнев «не пришёл на них». Русское «не постиг их» естественно передаёт наступление суда.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: во дни Езекии
  rationale: Традиционная и понятная формула, обозначающая время его жизни или царствования без лишнего уточнения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному богословскому решению.
- issue: Связь смирения с гордостью сердца
  choice: смирился из-за надменности своего сердца
  alternative: смирил надменность своего сердца
  rationale: Грамматика естественнее указывает на причину или предмет смирения, а не утверждает прямо, что сама гордость была смирена; неоднозначность предлога отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Во дни» сохранено как прозрачная традиционная формула; остальная фраза построена естественно для современного читателя.
