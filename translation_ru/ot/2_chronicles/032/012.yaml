  source_fidelity: Перевод точно передаёт риторический вопрос, эмфатическое «сам», глагол устранения культовых мест, притяжательные суффиксы в полемической речи, а также пространственное «перед одним жертвенником». «Поклоняйтесь» адекватно передаёт תִּשְׁתַּחֲווּ, а «на нём воскуряйте» сохраняет культовый характер הִקְטִיר и не навязывает более узкое истолкование.
  naturalness: Фраза звучит естественно для современного литературного русского с уместно возвышенным библейским регистром. Опущение формального «говоря» после «сказал» оправдано русским синтаксисом и не меняет содержания. «Воскуряйте» несколько книжное, но уместно в культовом контексте.
  terminology: «Высоты» и «жертвенники» — устойчивые и точные библейские термины. Притяжательные «Его» воспроизводят форму речи ассирийского оратора, не превращая его оценку в авторское утверждение. Сноска корректно поясняет техническое значение «высот»; её маркер поставлен на релевантном слове.
