  variant: modern literary Russian
source:
  edition: WLC
  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: ru
  text: 'Не сам ли Езекия упразднил Его высоты и Его жертвенники[a] и сказал Иудее и Иерусалиму: «Перед одним жертвенником поклоняйтесь и на нём воскуряйте»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его святилища на высотах и Его жертвенники».'
    reason: Лексическая альтернатива поясняет, что «высоты» здесь означают местные культовые места, а не просто возвышенности.
lexical_decisions:
- source_word: הֲלֹא הוּא יְחִזְקִיָּהוּ
  choice: Не сам ли Езекия
  rationale: Риторический вопрос ожидает согласия, а сочетание местоимения с именем несёт эмфатический смысл; «сам» естественно передаёт это ударение по-русски.
- source_word: הֵסִיר
  choice: упразднил
  rationale: В контексте религиозной реформы глагол означает не простое физическое перемещение, а устранение культовых мест; «упразднил» ясно передаёт это действие.
- source_word: בָּמֹתָיו
  choice: Его высоты
  rationale: «Высоты» — традиционный и точный термин для мест местного культа. Прописная буква в местоимении показывает, что ассирийский оратор полемически представляет их принадлежащими Богу, не утверждая правоту такой оценки.
- source_word: מִזְבְּחֹתָיו
  choice: Его жертвенники
  rationale: Притяжательный суффикс сохранён, чтобы не сглаживать полемическую характеристику говорящего.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: и сказал Иудее и Иерусалиму
  rationale: Русский глагол «сказал» уже вводит прямую речь, поэтому отдельная передача לֵאמֹר была бы тяжеловесным семитизмом.
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: Перед одним жертвенником
  rationale: «Перед» прямо передаёт пространственное לִפְנֵי, а «одним» сохраняет числовое ударение обвинения в централизации богослужения.
- source_word: תִּשְׁתַּחֲווּ
  choice: поклоняйтесь
  rationale: Форма обозначает поклонение с преклонением и в данном культовом контексте естественно передаётся русским «поклоняйтесь».
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: и на нём воскуряйте
  rationale: Глагол קטר в породе Hiphil может относиться к воскурению благовоний либо к превращению приношения в дым. «Воскуряйте» сохраняет культовый оттенок и часть исходной неоднозначности лучше, чем узкое «сжигайте благовония».
theological_decisions:
- issue: Точка зрения говорящего в притяжательных суффиксах при «высотах» и «жертвенниках»
  choice: Сохранить «Его высоты и Его жертвенники» как характеристику ассирийского оратора
  alternative: 'Опустить притяжательные местоимения: «высоты и жертвенники»'
  rationale: Суффиксы явно присутствуют в еврейском тексте. Их сохранение передаёт полемику говорящего, который выставляет реформу Езекии оскорблением Бога; перевод не должен исправлять его богословское непонимание.
- issue: Централизация культа
  choice: Передать повеление буквально через «один жертвенник», не объясняя реформу в основном тексте
  alternative: Разъяснить как исключительное поклонение у храмового жертвенника
  rationale: Стих передаёт обвинение, а не авторское объяснение реформы. Лаконичная формулировка сохраняет историко-богословское напряжение контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Синтаксис упрощён там, где буквальное воспроизведение еврейской формулы речи звучало бы неестественно, но эмфаза, притяжательные суффиксы и культовая терминология сохранены.
