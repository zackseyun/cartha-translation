base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: ru
  text: 'Он поставил над народом военачальников, собрал их к себе на площади у городских ворот и обратился к их сердцам[a], говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил к их сердцам» — то есть говорил так, чтобы ободрить и укрепить их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: поставил
  rationale: В сочетании с עַל הָעָם глагол обозначает назначение людей на руководящую должность; «поставил над» естественно передаёт и назначение, и власть.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: военачальников
  rationale: Буквально «начальников войн»; в данном контексте речь идёт о руководителях войска. «Военачальники» — ясное и достойное современное обозначение.
- source_word: עַל הָעָם
  choice: над народом
  rationale: Предлог עַל при глаголе назначения указывает на руководство и власть над народом.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: собрал их к себе
  rationale: Формулировка сохраняет אֵלָיו и подчёркивает, что Езекия лично созвал назначенных военачальников.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: на площади у городских ворот
  rationale: רְחוֹב обозначает открытое общественное пространство, площадь; сочетание естественно передаёт место возле городских ворот.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: обратился к их сердцам
  rationale: Сохраняет образ еврейской идиомы — речь, направленную к внутреннему человеку и призванную ободрить или укрепить слушателей.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Стандартная формула введения прямой речи; двоеточие естественно связывает стих с последующими словами.
