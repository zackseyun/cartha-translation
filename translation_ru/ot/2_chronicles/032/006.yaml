  source_fidelity: 'Текст точно передаёт последовательность еврейского оригинала: назначение военачальников над народом, их созыв к Езекии на открытую площадь у городских ворот и обращённую к ним ободряющую речь. «Поставил над народом» адекватно передаёт וַיִּתֵּן ... עַל; «военачальников» — естественный эквивалент שָׂרֵי מִלְחָמוֹת. «На площади у городских ворот» корректно выражает אֶל רְחוֹב שַׁעַר הָעִיר.'
