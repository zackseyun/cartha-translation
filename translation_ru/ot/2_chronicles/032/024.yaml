source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: ru
  text: В те дни Езекия заболел так тяжело, что был при смерти. Он помолился Яхве, и Тот ответил ему[a] и дал ему знамение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сказал ему». В данном контексте эти слова передают ответ Яхве на молитву Езекии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чудо»; возможно также: «предзнаменование».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественная русская передача обычного еврейского временного оборота с сохранением его формы.
- source_word: חָלָה ... עַד לָמוּת
  choice: заболел так тяжело, что был при смерти
  rationale: Передаёт наступление болезни и выраженную оборотом עַד לָמוּת крайнюю степень её тяжести, не утверждая, что смерть уже наступила.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: помолился Яхве
  rationale: Глагол обозначает молитву, а личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: וַיֹּאמֶר לוֹ
  choice: Тот ответил ему
  rationale: Буквально глагол означает «сказал», однако после упоминания молитвы контекстуальное значение — ответ Яхве Езекии. Местоимение «Тот» ясно указывает на Яхве и избегает двусмысленной смены субъекта.
- source_word: מוֹפֵת
  choice: знамение
  rationale: Слово может обозначать знамение, чудо или предзнаменование; здесь речь о чудесном подтверждающем знаке, данном Езекии.
- source_word: נָתַן לוֹ
  choice: дал ему
  rationale: Прямая и естественная передача глагола נתן с местоименным дополнением.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблено собственное имя Бога; «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Кто отвечает Езекии в וַיֹּאמֶר לוֹ
  choice: Яхве, обозначенный местоимением «Тот»
  alternative: 'Оставить субъект формально невыраженным: «и сказал ему»'
  rationale: Еврейский глагол не называет субъект заново, но синтаксис и параллельные повествования указывают на ответ Яхве. Сноска сохраняет буквальную форму и тем самым подлинную языковую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаизмов. Два коротких предложения улучшают читаемость, сохраняя последовательность еврейского повествования.
