lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное повествовательное значение ראה; в данном контексте глагол также подразумевает осознание увиденного положения дел.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что увидел и понял Езекия.
- source_word: בָא
  choice: пришёл
  rationale: Перфект сообщает о наступившем факте прибытия Сеннахирима; русское прошедшее время естественно передаёт эту последовательность без необходимости в особой форме предпрошедшего времени.
- source_word: סַנְחֵרִיב
  choice: Сеннахирим
  rationale: Устоявшаяся русская библейская форма имени ассирийского царя.
- source_word: וּפָנָיו
  choice: намерен
  rationale: Буквально «и лицо его», но сочетание описывает направленность и твёрдое намерение; глагольная передача естественна для современного русского языка.
- source_word: לַמִּלְחָמָה
  choice: воевать
  rationale: Существительное «война, сражение» в составе идиомы передаёт намерение начать военные действия.
- source_word: עַל
  choice: против
  rationale: Предлог обозначает враждебную направленность действий на город.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалима
  rationale: Устоявшаяся русская форма географического названия в родительном падеже после «против».
