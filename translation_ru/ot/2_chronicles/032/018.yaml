  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: ru
  text: Они громко кричали по-иудейски, обращаясь к жителям Иерусалима, находившимся на стене, чтобы устрашить и привести их в смятение, чтобы захватить город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: по-иудейски
  rationale: Наречная передача обозначает язык жителей Иудеи; она естественна по-русски и не уточняет сверх текста, был ли это древнееврейский язык или его иудейская разновидность.
- source_word: עַל עַם יְרוּשָׁלִַם
  choice: обращаясь к жителям Иерусалима
  rationale: Предлог עַל при глаголе громкого возглашения указывает на адресатов; «жители» естественно передаёт собирательное עַם в данном контексте.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: чтобы устрашить и запугать их
  rationale: 'Сохранены два близких, но не тождественных глагола: первый выражает внушение страха, второй — приведение в смятение или ужас.'
- source_word: לְמַעַן יִלְכְּדוּ
  choice: и таким образом захватить
  rationale: 'Передаёт целевую связь: психологическое давление должно было содействовать взятию города.'
