source:
  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: ru
  text: Так Яхве спас Езекию и жителей Иерусалима от руки Сеннахирима, царя Ассирии, и от руки всех прочих[a] и всюду направлял их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и от руки всех». В еврейском тексте после слова «всех» не названо, кого именно оно обозначает; вероятно, имеются в виду все остальные враги или враждебные силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и вёл их кругом». Еврейский глагол означает «вести, направлять»; выражение также понимают в более широком смысле как указание на безопасность или покой со всех сторон.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: спас
  rationale: Глагол ישׁע обозначает спасение, избавление от опасности. «Спас» естественно звучит по-русски и сохраняет богословскую значимость действия, не сводя его только к военной победе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жителей Иерусалима
  rationale: Причастная конструкция буквально обозначает живущих в Иерусалиме; «жители Иерусалима» — точная и естественная современная русская формулировка.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён еврейский образ руки как власти или силы. В данном повествовательном контексте русское выражение понятно, хотя более разъясняющим вариантом было бы «из-под власти».
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Сеннахирима, царя Ассирии
  rationale: Использована устоявшаяся русская форма имени; приложение оформлено в соответствии с нормами современного русского языка.
- source_word: וּמִיַּד כֹּל
  choice: и от руки всех прочих
  rationale: כֹּל употреблено эллиптически, без названного существительного. «Всех прочих» сохраняет неопределённость, но по контексту указывает на другие враждебные силы; альтернатива отмечена в сноске.
- source_word: וַיְנַהֲלֵם
  choice: и заботливо вёл их
  rationale: נהל прежде всего означает вести, направлять, а в некоторых контекстах подразумевает заботливое водительство. Добавление «заботливо» делает выражение с «со всех сторон» понятнее по-русски, не заменяя глагол истолкованием «дал покой».
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Наречие выражает окружающее пространство или всесторонность. Эта формулировка сохраняет образ всеобъемлющего водительства и допускает оттенок защиты.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл וַיְנַהֲלֵם מִסָּבִיב
  choice: и заботливо вёл их со всех сторон
  alternative: и водил их повсюду; и дал им покой со всех сторон; и оберегал их со всех сторон
  rationale: Масоретский текст с глаголом נהל непосредственно говорит о ведении или руководстве. Контекст допускает понимание как всесторонней защиты и покоя, однако основной текст не подменяет лексическое значение более определённым богословско-историческим истолкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому повествованию, но пунктуация и формы имён приведены к русской норме. Неясность эллиптического כֹּל и смысловая напряжённость последней фразы сохранены с помощью сносок.
