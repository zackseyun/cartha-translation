source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: ru
  text: И теперь пусть Езекия не обманывает вас и не склоняет вас к этому[a]. Не верьте ему, ведь ни один бог ни одного народа или царства не смог избавить свой народ от моей руки и от руки моих предков[b]. Тем более ваш Бог не избавит вас от моей руки![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «не подстрекает вас к этому» или «не соблазняет вас этим».'
    reason: lexical_alternative
  - marker: b
    text: «Рука» здесь означает силу или власть; под «предками» могут подразумеваться также прежние ассирийские цари.
    reason: cultural_note
  - marker: c
    text: 'Или: «Уж конечно, ваш Бог не избавит вас от моей руки!» Еврейское выражение усиливает отрицательный вывод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет присоединительный переход к непосредственному призыву говорящего и естественно звучит по-русски.
- source_word: יַשִּׁיא
  choice: обманывает
  rationale: Передаёт значение введения в заблуждение и ясно выражает обвинение, выдвигаемое против Езекии.
- source_word: יַסִּית ... כָּזֹאת
  choice: склоняет вас к этому
  rationale: Передаёт попытку побудить слушателей принять позицию Езекии, не сливая этот глагол по смыслу с предшествующим «обманывает» и не привнося обязательного оттенка мятежа.
- source_word: תַּאֲמִינוּ לוֹ
  choice: не верьте ему
  rationale: В контексте речь идёт о том, принимать ли утверждения Езекии за истинные; «верить ему» — естественная русская передача.
- source_word: לֹא יוּכַל
  choice: не смог
  rationale: 'Прошедшее совершенного вида естественно передаёт ссылку говорящего на прежний исторический опыт: до сих пор ни один бог не оказался способен избавить свой народ.'
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: ни один бог ни одного народа или царства
  rationale: Сохраняет всеобщность отрицательного утверждения и связь богов с народами и царствами.
- source_word: לְהַצִּיל
  choice: избавить
  rationale: Подходит к военно-политическому контексту освобождения из-под власти врага и сохраняет привычную библейскую семантику без архаизации.
- source_word: עַמּוֹ
  choice: свой народ
  rationale: Возвратное местоимение естественно соотносит народ с упомянутым богом и передаёт еврейский суффикс третьего лица единственного числа.
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: от моей руки и от руки моих предков
  rationale: Повтор слова «рука» сохранён как значимый образ власти и силы; אֲבוֹתָי в царской речи относится к предкам или предшественникам говорящего.
- source_word: אַף כִּי
  choice: тем более ... не
  rationale: 'Передаёт усиленный отрицательный вывод насмешливого рассуждения: если, по словам говорящего, другие боги не избавили свои народы, то Бог Иудеи тем более не избавит.'
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Несмотря на морфологически множественную форму, контекст указывает на единственного Бога Иудеи; прописная буква ясно отражает эту референцию.
theological_decisions:
- issue: Число и референция אֱלֹהֵיכֶם
  choice: «ваш Бог» — единственный Бог Иудеи и Израиля
  alternative: Формально множественное «ваши боги»
  rationale: Форма אֱלֹהִים обычно употребляется в Ветхом Завете по отношению к Богу Израиля как к единственному Богу. Здесь ассирийский говорящий противопоставляет его богам других народов, поэтому множественное число исказило бы объект его насмешки.
- issue: Риторическая сила אַף כִּי
  choice: 'Сравнительно усиленный отрицательный вывод: «Тем более ... не»'
  alternative: Категорическое «уж конечно ... не»
  rationale: Обе передачи возможны, но «тем более» лучше сохраняет логическую связь с предшествующим доводом, не превращая идиому лишь в эмоциональное отрицание. Утверждение остаётся речью ассирийского противника, а не оценкой рассказчика.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксис разделён на три предложения ради ясности и сохранения нарастающей угрозы. Образ «руки» оставлен в основном тексте как важная библейская метафора власти; его смысл пояснён в сноске. Речь передаёт хвастливую логику ассирийского посланника, не подтверждая её от лица повествователя.
