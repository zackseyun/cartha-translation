revisions:
- from: И многие приносили дар Яхве в Иерусалим[a], а драгоценные дары — Езекии, царю Иудеи[b]. После этого он возвысился в глазах всех народов.
  to: Многие приносили Яхве в Иерусалим приношения[a] и Езекии, царю Иудеи, драгоценные дары[b]. После этого он стал пользоваться высоким почётом у всех народов.
  rationale: 'Исправлена передача адресата приношений Яхве: дательный падеж устраняет ошибочную родительную связь в «дар Яхве». Сохранены направление «в Иерусалим» и сноска о возможном местном понимании. Простое соединение двух видов даров передано союзом «и». Результативный пассивный смысл еврейского нифаля передан современной естественной формулировкой о высоком почёте, без оттенка самовозвышения.'
