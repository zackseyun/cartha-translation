source:
  edition: WLC
  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: ru
  text: Многие приносили Яхве в Иерусалим приношения[a] и Езекии, царю Иудеи, драгоценные дары[b]. После этого он стал пользоваться высоким почётом у всех народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Иерусалиме». Еврейский предлог здесь может указывать как направление, так и место.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отборные дары».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: многие
  rationale: Прилагательное употреблено субстантивно и обозначает множество людей; русское «многие» естественно передаёт это без добавления слова «люди».
- source_word: מְבִיאִים
  choice: приносили
  rationale: Причастие в повествовательном контексте выражает продолжавшееся или повторявшееся действие; несовершенный вид передаёт эту длительность.
- source_word: מִנְחָה
  choice: дар
  rationale: Слово может означать дар, приношение или дань. При Яхве как получателе «дар» сохраняет религиозный смысл, не уточняя без основания вид приношения, и позволяет передать различие с מִגְדָּנוֹת.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном; предлог указывает адресата дара.
- source_word: לִירוּשָׁלִַם
  choice: в Иерусалим
  rationale: Предлог לְ буквально допускает направление «в Иерусалим»; в данном контексте возможно также понимание места действия, поэтому неоднозначность отмечена в сноске.
- source_word: מִגְדָּנוֹת
  choice: драгоценные дары
  rationale: Существительное обозначает ценные, отборные вещи, преподносимые в дар; перевод не сужает значение до лакомств или пищи.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Езекии, царю Иудеи
  rationale: Езекия прямо обозначен как получатель даров, а титул передан приложением в естественной русской форме.
- source_word: וַיִּנַּשֵּׂא
  choice: он возвысился
  rationale: Нифаль выражает возвышение в положении и почёте. Возвратная русская форма сохраняет значение изменения статуса, не подменяя его лишь субъективной высокой оценкой.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: в глазах всех народов
  rationale: Близко передаёт еврейскую идиому публичного признания и почёта среди народов.
- source_word: מֵאַחֲרֵי כֵן
  choice: после этого
  rationale: Оборот обозначает последующее время по отношению к описанным событиям.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя יהוה. Форма «Яхве» передаёт его как имя и не заменяет титулом.
- issue: Характер возвышения Езекии
  choice: возвысился в глазах всех народов
  alternative: стал пользоваться большим почётом у всех народов
  rationale: Сохранён образный и формально пассивно-результативный смысл еврейского выражения без сведения возвышения исключительно к человеческой репутации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до двух предложений для ясности; противопоставление адресатов даров передано конструкцией «а ... —». Все смысловые неоднозначности, существенные для перевода, сохранены в тексте или отмечены сносками.
