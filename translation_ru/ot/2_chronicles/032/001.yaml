source:
  edition: WLC
  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: ru
  text: После этих дел и проявленной верности[a] Сеннахирим, царь Ассирии, пришёл в Иудею, расположился лагерем против укреплённых городов и решил пробиться в них и овладеть ими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и этих верных дел». Еврейское אֱמֶת может означать «истина» или «верность»; здесь оно, вероятно, относится к верным поступкам Езекии, описанным выше.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «и задумал проломить их для себя». Еврейский оборот передаёт намерение Сеннахирима силой проникнуть в города и взять их.'
    reason: idiom_clarification
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: После этих дел
  rationale: Оборот обозначает последовательность событий; «дел» естественно связывает стих с предшествующими действиями Езекии и сохраняет широкий смысл דְּבָרִים.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: и проявленной верности
  rationale: אֱמֶת может означать «истину», «надёжность» или «верность». В данном контексте речь, вероятнее всего, идёт о верных делах Езекии; добавление «проявленной» делает по-русски ясной связь с предшествующим повествованием, не превращая выражение в перечень отдельных поступков.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Сеннахирим, царь Ассирии
  rationale: Использована укоренившаяся русская форма имени и прямой перевод царского титула.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: пришёл в Иудею
  rationale: Глагол движения с предлогом ב указывает на вступление в пределы страны; такой перевод естественен в русском повествовании.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: расположился лагерем против укреплённых городов
  rationale: Сохраняется буквальный военный образ постановки лагеря против городов без более узкого истолкования как уже начавшейся осады.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: и решил пробиться в них и овладеть ими
  rationale: Конструкция с וַיֹּאמֶר и инфинитивом выражает замысел; בקע передаёт идею пролома или насильственного проникновения. אֵלָיו указывает на действие в свою пользу, что естественно выражено словами «овладеть ими».
