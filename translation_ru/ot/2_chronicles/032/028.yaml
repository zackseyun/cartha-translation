lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: кладовые
  rationale: В данном контексте речь идёт о помещениях для хранения перечисленной сельскохозяйственной продукции; «кладовые» естественно передаёт смысл, не исключая более крупных хранилищ.
- source_word: תְבוּאַת דָּגָן
  choice: урожая зерна
  rationale: Сочетание обозначает собранную зерновую продукцию; «урожай зерна» ясно и естественно звучит по-русски.
- source_word: תִירוֹשׁ
  choice: молодого вина
  rationale: Термин входит в традиционную сельскохозяйственную триаду и обозначает вино нового урожая, отличаясь от более общего названия вина.
- source_word: יִצְהָר
  choice: масла
  rationale: В этой сельскохозяйственной триаде имеется в виду масло, обычно оливковое; краткое «масло» сохраняет обычную формулировку перечня.
- source_word: אֻרָוֹת
  choice: стойла
  rationale: Слово обозначает места для содержания или кормления домашних животных; «стойла» подходит к широкому обозначению скота.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: для всякого рода скота
  rationale: Повтор существительного имеет распределительное значение; перевод передаёт разнообразие домашних животных без сужения до крупного рогатого скота.
- source_word: עֲדָרִים
  choice: стад
  rationale: Слово обозначает стада или отары, особенно мелкого скота; нейтральное «стада» сохраняет широкий смысл.
- source_word: אֲוֵרוֹת
  choice: загоны
  rationale: Редкое слово по контексту обозначает огороженные места для стад; «загоны» понятно современному читателю и сохраняет параллелизм со «стойлами».
