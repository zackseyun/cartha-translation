base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: ru
  text: Будьте сильны и мужественны. Не бойтесь и не падайте духом перед царём Ассирии и перед всем множеством, которое с ним[a], ведь с нами больше, чем с ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед всем войском, которое с ним». Еврейское слово может обозначать множество людей или массу войск.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с нами больше, чем с ним». Еврейская фраза не уточняет, кто или что именно больше; смысл раскрывается в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Будьте тверды и мужественны
  rationale: Два повелительных глагола образуют устойчивое увещевание. «Будьте тверды» передаёт חזק без неестественного «будьте сильны», а «мужественны» естественно выражает אמץ и сохраняет параллелизм.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Не бойтесь и не падайте духом
  rationale: ירא прямо обозначает страх; Niphal от חתת в военном увещевании передаёт состояние сломленности, ужаса или подавленности. Современное «не падайте духом» естественно выражает эмоциональный смысл, не усиливая его до «не ужасайтесь».
- source_word: מִפְּנֵי ... וּמִלִּפְנֵי
  choice: перед ... и перед
  rationale: Предлог буквально связан с лицом или присутствием, а здесь обозначает угрозу, перед которой не следует страшиться. Повтор сохранён ради риторического строя.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Прямое и привычное соответствие еврейской сопряжённой конструкции.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: всё множество, которое с ним
  rationale: הָמוֹן может обозначать многочисленное скопление людей или массу войска. «Множество» сохраняет широту слова; военный смысл пояснён в сноске.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для предшествующего призыва. «Ведь» естественно связывает ободрение с его причиной.
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: с нами — больше, чем с ним
  rationale: Еврейская фраза эллиптична и не называет прямо того, кто или что «больше». Тире делает краткую конструкцию понятной по-русски, не превращая её ни в однозначный подсчёт людей, ни в явное указание на одну Личность до пояснения следующего стиха.
theological_decisions:
- issue: Эллиптическое сравнение в заключительной части стиха
  choice: «с нами — больше, чем с ним»
  alternative: «тех, кто с нами, больше, чем тех, кто с ним»; «Тот, Кто с нами, больше того, кто с ним»
  rationale: Первая альтернатива однозначно превращает выражение в количественное сравнение сторон, а вторая — в сравнение личностей. Еврейский текст оставляет предмет сравнения невыраженным; следующий стих раскрывает контраст между человеческой силой ассирийского царя и помощью Господа. Перевод сохраняет эту напряжённую недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством военного увещевания. Повтор «перед» сохраняет риторику оригинала, а краткая финальная формула намеренно удерживает его смысловую недосказанность. Все маркеры сносок размещены при соответствующих выражениях.
