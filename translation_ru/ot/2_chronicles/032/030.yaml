base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: ru
  text: Именно Езекия перекрыл верхний выход вод Гихона[a] и направил их[b] вниз, на запад, к городу Давида. И Езекия преуспел во всех своих делах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верхний источник Гихона». Еврейское слово может обозначать место выхода воды либо, шире, сам источник или сток воды из него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «провёл их по прямому руслу». Еврейский глагол подразумевает, что водам придали направленное, выпрямленное течение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: Именно Езекия
  rationale: Сочетание местоимения с именем выделяет действующее лицо; частица «именно» естественно передаёт это эмфатическое построение по-русски.
- source_word: סָתַם
  choice: перекрыл
  rationale: Глагол означает закрыть или заградить отверстие; «перекрыл» ясно и естественно описывает гидротехническое действие.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: верхний выход вод Гихона
  rationale: Перевод сохраняет конструкцию с «водами Гихона» и не отождествляет однозначно מוֹצָא ни с истоком, ни только с отдельным отверстием.
- source_word: וַיַּישְּׁרֵם
  choice: направил их
  rationale: Каузативная форма от ישר указывает на придание водам определённого, выпрямленного направления; «направил» передаёт смысл без излишней конкретизации инженерного способа.
- source_word: לְמַטָּה מַעְרָבָה לְעִיר דָּוִיד
  choice: вниз, на запад, к городу Давида
  rationale: Последовательно переданы направление вниз, движение на запад и отношение к городу Давида; такое чтение близко к форме еврейского текста и сохраняет его топографическую последовательность.
- source_word: וַיַּצְלַח
  choice: преуспевал
  rationale: Глагол обозначает успех в деятельности и может включать оттенок благополучия; «преуспевал» сохраняет эту широту.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: во всех своих делах
  rationale: Хотя существительное имеет единственное число, оно здесь собирательно охватывает деятельность Езекии; русское множественное «делах» звучит естественно и точно передаёт общий смысл.
