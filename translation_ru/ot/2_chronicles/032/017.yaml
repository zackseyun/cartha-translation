base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: ru
  text: 'Он также написал письма, чтобы поносить Яхве[a], Бога Израиля, и выступать против Него, говоря: «Как боги народов разных стран не избавили свои народы от моей руки, так и Бог Езекии не избавит свой народ от моей руки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оскорблять», «бросать вызов». Еврейский глагол означает злословить, поносить или вызывающе оскорблять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: Он также написал письма
  rationale: סְפָרִים в данном повествовательном контексте означает письменные послания; союз ו продолжает рассказ и естественно передаётся словом «также».
- source_word: לְחָרֵף
  choice: чтобы поносить
  rationale: Глагол חרף выражает злословие, оскорбление и вызывающее поругание. «Поносить» сохраняет силу враждебного действия и dignified biblical register.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, прямо стоящее в еврейском тексте; форма «Яхве» понятна современному русскому читателю.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача сопряжённой конструкции, отождествляющей Яхве с Богом Израиля.
- source_word: וְלֵאמֹר עָלָיו
  choice: и говорить против Него
  rationale: 'В контексте עַל имеет враждебную направленность: речь обращена против Бога, а не просто сказана о Нём.'
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: Как боги народов других земель
  rationale: כֵּ вводит сравнение. Добавление «других» естественно обозначает окружающие страны и не меняет противопоставления в исходном тексте.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: не избавили свои народы
  rationale: Hiphil נצל означает избавить или спасти из чужой власти; множественное «народы» согласуется с богами и народами разных земель.
- source_word: מִיָּדִי
  choice: от моей руки
  rationale: Сохранена еврейская метафора руки как власти и военной силы.
- source_word: כֵּן לֹא יַצִּיל
  choice: так и ... не избавит
  rationale: Сохранены сравнительная конструкция и повтор глагола, на которых строится насмешливый довод говорящего.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: Бог Езекии
  rationale: Буквальная и естественная передача конструкции; формулировка сохраняет пренебрежительный способ, которым противник представляет Яхве лишь как Бога Езекии.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Местоименный суффикс относится к Богу Езекии; прописная буква ясно обозначает божественного референта в русском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя. «Яхве» сохраняет это различие и является современной научно принятой русской передачей.
- issue: Риторическое приравнивание Бога Израиля к богам народов
  choice: Сохранить слова хулителя без богословского исправления
  alternative: Явно отметить в самой цитате, что это ложное приравнивание
  rationale: Стих передаёт утверждение противника, а не оценку повествователя. Сохранение его формулировки удерживает драматическую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм угрозы и метафора «от моей руки» сохранены; архаичные формы и излишне церковнославянская лексика избегаются.
