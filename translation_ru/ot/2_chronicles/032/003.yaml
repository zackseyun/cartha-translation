base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: ru
  text: Он посоветовался со своими сановниками и воинами о том, чтобы перекрыть воды источников, находившихся вне города[a], и они помогли ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он посоветовался со своими сановниками и воинами, чтобы перекрыть воды источников вне города».'
    reason: Инфинитив לִסְתּוֹם может выражать цель совета, а не только его содержание; в основном тексте относительное определение «находившихся» делает связь «вне города» с источниками однозначной.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: посоветовался
  rationale: Нифаль глагола יעץ обозначает совещание с другими; возвратная форма «посоветовался» естественна в современном русском языке и сохраняет совместный характер решения.
- source_word: שָׂרָיו
  choice: со своими сановниками
  rationale: שַׂר может обозначать правителя, начальника или высокопоставленного должностного человека. «Сановники» передаёт широкий административный статус, не называя их царевичами.
- source_word: גִבֹּרָיו
  choice: и воинами
  rationale: גִּבּוֹר нередко обозначает сильного, доблестного человека или воина. В военно-оборонительном контексте естественное русское «воины» передаёт наиболее вероятный смысл.
- source_word: לִסְתּוֹם
  choice: о том, чтобы перекрыть
  rationale: Инфинитив выражает содержание или цель совета. «Перекрыть» ясно описывает прекращение доступа к воде и звучит естественнее буквального «заткнуть».
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: источники воды
  rationale: Буквально выражение означает «воды источников». Русское «источники воды» естественно передаёт речь о водных источниках как объектах перекрытия.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: за городом
  rationale: Оборот указывает на расположение вне городской черты. «За городом» кратко и естественно передаёт пространственный смысл.
- source_word: וַיַּעְזְרֻהוּ
  choice: и они помогли ему
  rationale: Глагол עזר с местоименным суффиксом прямо означает, что упомянутые сановники и воины оказали ему помощь.
