  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: ru
  text: Кто из всех богов тех народов, которые мои предки предали уничтожению[a], смог избавить свой народ от моей руки? Так неужели ваш Бог сможет избавить вас от моей руки?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предали заклятию». Еврейский глагол означает предание уничтожению, связанное с заклятием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: Кто из всех богов этих народов
  rationale: Вопросительное מִי и сочетание בְּכָל переданы естественной русской партитивной конструкцией «кто из всех». Слово אֱלֹהֵי сохранено как «богов» без поясняющего слова «идолов».
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: которых мои предки обрекли на полное уничтожение
  rationale: Относительное местоимение естественнее всего соотнести с ближайшим существительным «народы». Глагол חרם обозначает не просто победу, а предание полному уничтожению; эта смысловая сила сохранена, а традиционная формулировка вынесена в примечание.
- source_word: אֲבוֹתַי
  choice: мои предки
  rationale: Буквально «мои отцы», но в царской речи речь идёт о предшественниках и предках; современное «предки» яснее и естественнее.
- source_word: יָכוֹל לְהַצִּיל
  choice: смог избавить
  rationale: Передаёт способность совершить избавление в прошлом и сохраняет военный контекст освобождения из чужой власти.
- source_word: אֶת עַמּוֹ
  choice: свой народ
  rationale: Возвратное притяжательное местоимение естественно связывает народ с подразумеваемым отдельным богом, о котором спрашивает говорящий.
- source_word: מִיָּדִי
  choice: от моей руки
  rationale: Сохранён прозрачный древнееврейский образ руки как власти и контроля; повтор этой формулы воспроизводит риторический нажим исходного текста.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: Так неужели ваш Бог сможет
  rationale: כִּי связывает вторую часть с выводом из предыдущего риторического вопроса. «Неужели» передаёт насмешливое недоверие, а форма будущего времени — подразумеваемую возможность предстоящего избавления.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: избавить вас
  rationale: Повтор глагола נצל передан тем же русским глаголом, чтобы сохранить параллелизм стиха.
theological_decisions:
- issue: Значение חרם в ассирийской царской насмешке
  choice: обрекли на полное уничтожение
  alternative: предали заклятию; уничтожили
  rationale: Выбранная формулировка сохраняет значение окончательного предания уничтожению, но не вводит дополнительных богословских утверждений о том, кем именно было санкционировано такое действие. Техническая традиционная передача отмечена в сноске.
- issue: Упоминание богов других народов
  choice: богов
  alternative: так называемых богов; идолов
  rationale: Перевод следует прямой речи персонажа и не добавляет редакционного суждения, отсутствующего в еврейском тексте.
- issue: Антецедент относительного אֲשֶׁר
  choice: народы, которых предки обрекли на уничтожение
  alternative: боги, которых предки обрекли на уничтожение
  rationale: В еврейском порядке слов אֲשֶׁר непосредственно следует за «этих народов», а объектом חרם в данном историко-военном контексте естественно выступают народы. Возможная синтаксическая широта не используется для внесения богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Образ «от моей руки» сохранён ради исходной метафоры и повторения. Один длинный еврейский риторический вопрос разделён на два русских вопросительных предложения для ясности; логическая связь выражена словами «Так неужели».
