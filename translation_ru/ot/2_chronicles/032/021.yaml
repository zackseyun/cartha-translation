  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ מַלְאָ֔ךְ וַ/יַּכְחֵ֞ד כָּל גִּבּ֥וֹר חַ֨יִל֙ וְ/נָגִ֣יד וְ/שָׂ֔ר בְּ/מַחֲנֵ֖ה מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּשָׁב֩ בְּ/בֹ֨שֶׁת פָּנִ֜ים לְ/אַרְצ֗/וֹ וַ/יָּבֹא֙ בֵּ֣ית אֱלֹהָ֔י/ו ו/מ/יציא/ו מֵעָ֔י/ו שָׁ֖ם הִפִּילֻ֥/הוּ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: ru
  text: И послал ГОСПОДЬ ангела, и тот истребил всех могучих воинов, предводителей и военачальников в стане царя Ассирии. И возвратился царь в свою землю с посрамлённым лицом. Когда он вошёл в храм своего бога, там некоторые из его потомков[a] сразили его мечом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из вышедших из его внутренностей»; то есть происходившие от него самого.'
    reason: Сохраняет образность и генеалогический смысл еврейского выражения, не уточняя в основном тексте степень родства как «сыновья».
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона, ясно отличимая типографически и соответствующая литературному библейскому регистру.
- source_word: מַלְאָךְ
  choice: ангела
  rationale: В данном контексте речь идёт о посланнике Бога; русское «ангел» естественно и точно передаёт смысл.
- source_word: וַיַּכְחֵד
  choice: истребил
  rationale: Глагол выражает полное уничтожение; «истребил» сохраняет силу исходного текста.
- source_word: גִּבּוֹר חַיִל
  choice: могучих воинов
  rationale: Сочетание обозначает сильных, доблестных воинов; выбран естественный русский военный эквивалент.
- source_word: נָגִיד וְשָׂר
  choice: военачальников и начальников
  rationale: Сохраняются две разные руководящие категории, хотя точное разграничение их должностей в данном контексте не вполне определённо.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: с посрамлённым лицом
  rationale: 'Передаёт образное выражение буквально и понятно: он вернулся публично опозоренным.'
- source_word: בֵּית אֱלֹהָיו
  choice: храм своего бога
  rationale: Буквально «дом своего бога»; в контексте культового места естественное русское обозначение — «храм».
- source_word: מֵעָיו
  choice: его родных сыновей
  rationale: Буквально выражение указывает на вышедших из его внутренностей, то есть на его собственных потомков; контекст и параллель 4 Цар 19:37 уточняют, что это сыновья.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: сразили его мечом
  rationale: Устойчиво и точно передаёт насильственное умерщвление мечом.
theological_decisions:
- issue: Идентификация посланника
  choice: ангела
  alternative: посланника
  rationale: Контекст описывает сверхъестественного посланника ГОСПОДА; «ангел» является обычным и ненагруженным русским эквивалентом здесь.
- issue: Обозначение ассирийского божества
  choice: своего бога
  alternative: своего Бога
  rationale: Строчная буква сохраняет различие между ГОСПОДОМ и божеством ассирийского царя без добавления имени, которого в стихе нет.
- issue: Действующее лицо во второй фразе
  choice: царь
  alternative: он
  rationale: Еврейский текст использует местоименно подразумеваемый субъект; «царь» добавлено только для ясности референции и не меняет смысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Слова «стан», «посрамлённым» и «сразили мечом» сохраняют достоинство повествования, оставаясь понятными современному читателю.
