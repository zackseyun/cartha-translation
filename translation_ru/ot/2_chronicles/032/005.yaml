  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: ru
  text: Он укрепился и восстановил всю разрушенную стену, и поднял её до башен; снаружи он возвёл ещё одну стену. Он укрепил Милло[a] в Городе Давида и изготовил в большом количестве оружие[b] и щиты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «насыпь», «терраса» либо «укрепляющая засыпка»; вероятно, этим термином обозначалось укреплённое земляное или опорное сооружение в Иерусалиме.
    reason: lexical_alternative
  - marker: b
    text: Или «метательные снаряды», «дротики» либо «копья»; еврейское слово не обязательно обозначает какой-то один вид оружия.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: Он укрепился
  rationale: Возвратная форма глагола חזק передаёт решительное укрепление сил и готовность Езекии к обороне; буквальная возвратность сохранена без уточнения, идёт ли речь прежде всего о мужестве или практических мерах.
- source_word: וַיִּבֶן אֶת כָּל הַחוֹמָה הַפְּרוּצָה
  choice: восстановил всю разрушенную стену
  rationale: В данном контексте בנה означает восстановительные строительные работы, а הַפְּרוּצָה указывает на стену с разрушенными участками или проломами.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: подняв её до башен
  rationale: Еврейская фраза сжата и допускает разные синтаксические толкования. Перевод сохраняет стену как подразумеваемое дополнение и не заменяет эту неясную конструкцию более уверенным утверждением о возведении башен на стене.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: снаружи он возвёл ещё одну стену
  rationale: לַחוּצָה указывает на внешнюю сторону; глагол строительства естественно восполнен из предыдущего контекста.
- source_word: הַמִּלּוֹא
  choice: Милло
  rationale: Это исторический термин или название сооружения в Иерусалиме, точное устройство которого остаётся спорным. Транслитерация не создаёт ложной определённости.
- source_word: שֶׁלַח
  choice: оружия
  rationale: Слово может обозначать оружие, особенно метательное, но контекст не требует выбора конкретного вида; обобщённый русский термин сохраняет широту значения.
- source_word: לָרֹב וּמָגִנִּים
  choice: множество оружия и щитов
  rationale: לָרֹב выражает большое количество, а מָגִנִּים — обычное обозначение щитов; формулировка современна и ясна.
