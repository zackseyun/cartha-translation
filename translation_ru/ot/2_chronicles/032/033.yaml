  terminology: Имена «Езекия», «Манассия», «Иудея» и «Иерусалим» употреблены последовательно. «Сыновья Давида» обоснованно сохранено как буквальное династическое выражение, с поясняющей сноской. «Воздали ему почести» адекватно передаёт וְכָבוֹד עָשׂוּ לוֹ.
