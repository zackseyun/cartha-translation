  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: ru
  text: Езекия почил со своими отцами, и его похоронили в верхней части гробниц сыновей Давида[a]. Вся Иудея и жители Иерусалима воздали ему почести при его кончине, а вместо него стал царствовать его сын Манассия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гробниц потомков Давида»; выражение «сыновья Давида» здесь относится к царской династии Давида.'
    reason: Лексическое пояснение широкого династического значения выражения בְנֵי דָוִיד.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил со своими отцами
  rationale: Сохранена традиционная древнееврейская формула смерти царя. Глагол «почил» в современном литературном русском понятен, достоин по регистру и передаёт эвфемизм, не сводя его просто к «умер».
- source_word: וַיִּקְבְּרֻהוּ
  choice: его похоронили
  rationale: Сохранено активное множественное число с неопределённым действующим лицом, естественное для русского языка.
- source_word: בְּמַעֲלֵה
  choice: на возвышении
  rationale: מַעֲלֵה может обозначать подъём или возвышенное место. Выбранный вариант передаёт топографический смысл, не вводя неподтверждённой архитектурной конкретики.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: гробниц сыновей Давида
  rationale: Буквальное выражение сохранено в основном тексте, а его более широкий династический смысл пояснён в сноске.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: воздали ему почести
  rationale: Естественная русская передача древнееврейского оборота «сделали ему честь», сохраняющая публичный и торжественный характер действия.
- source_word: בְמוֹתוֹ
  choice: после его смерти
  rationale: В контексте посмертного чествования этот вариант естественно передаёт временное значение выражения.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: вся Иудея и жители Иерусалима
  rationale: Формальная и понятная передача, сохраняющая всеобщий общественный масштаб оказанных почестей.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: вместо него стал царствовать
  rationale: Передана стандартная формула престолонаследия без добавления деталей, отсутствующих в оригинале.
theological_decisions:
- issue: Эвфемизм смерти в царской формуле
  choice: Сохранить выражение «почил со своими отцами».
  alternative: «умер»; «скончался»
  rationale: Формула подчёркивает преемственность с предками и является устойчивой частью библейских царских некрологов; её не следует устранять пояснительным пересказом.
- issue: Значение выражения «сыновья Давида»
  choice: Оставить буквальное выражение в тексте и пояснить его династический смысл в сноске.
  alternative: «потомки Давида»
  rationale: Так сохраняется образность исходного текста и одновременно устраняется возможное ошибочное понимание как указания только на непосредственных сыновей Давида.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Архаизирующая формула «почил со своими отцами» сохранена как прозрачный и узнаваемый эвфемизм; прочие конструкции сделаны естественными для современного читателя.
