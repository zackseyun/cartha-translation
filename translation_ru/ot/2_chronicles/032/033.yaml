  source_fidelity: 'Фраза «на возвышении среди гробниц» неточно передаёт конструкцию בְּמַעֲלֵה קִבְרֵי: מַעֲלֵה относится к верхней части (или возвышенному уровню) комплекса гробниц, а не просто к возвышению, расположенному среди них. «После его смерти» несколько сужает בְּמוֹתוֹ до последующего времени; «при его кончине» точнее сохраняет нейтральную временную связь. Остальное содержание верно передаёт еврейский текст и согласуется с английским audit trail.'
