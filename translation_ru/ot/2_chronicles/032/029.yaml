source:
  edition: WLC
  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: ru
  text: Он также построил себе города и приобрёл множество мелкого и крупного скота, потому что Бог дал ему огромное имущество[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огромное богатство» или «весьма обширные владения».'
    reason: Лексема רְכוּשׁ допускает значения «имущество», «богатство» и «владения».
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: Он также построил себе города
  rationale: Союз וְ имеет добавочное значение в связи с предыдущим контекстом. Глагол עָשָׂה буквально означает «сделал», но применительно к городам по-русски естественно «построил»; לוֹ передано возвратным «себе».
- source_word: וּמִקְנֵה צֹאן וּבָקָר לָרֹב
  choice: и приобрёл множество мелкого и крупного скота
  rationale: מִקְנֶה обозначает скот как приобретённое имущество; צֹאן — мелкий скот, прежде всего овцы и козы, а בָּקָר — крупный рогатый скот. לָרֹב указывает на многочисленность. Глагольная формулировка естественно передаёт сжатую еврейскую именную конструкцию.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит прямое объяснение благосостояния Езекии.
- source_word: נָתַן לוֹ אֱלֹהִים
  choice: Бог дал ему
  rationale: Сохранены явное указание на Бога как действующее лицо и простой завершённый характер действия без ненужного временного усложнения.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: огромное имущество
  rationale: רְכוּשׁ означает материальное имущество или владения, а רַב מְאֹד подчёркивает его исключительную величину. «Огромное имущество» звучит современно и сохраняет интенсивность выражения.
theological_decisions:
- issue: Источник благосостояния Езекии
  choice: Стих прямо связывает огромное имущество Езекии с Божьим даром.
  alternative: Обобщить это утверждение до учения о том, что материальное богатство всегда является знаком Божьего благоволения.
  rationale: Фраза כִּי נָתַן לוֹ אֱלֹהִים утверждает Божье действие именно в данном случае; перевод не расширяет это частное утверждение до общей богословской доктрины.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаизмов. Различие между צֹאן и בָּקָר передано традиционными понятными выражениями «мелкий и крупный скот».
