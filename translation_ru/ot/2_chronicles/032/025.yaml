base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: ru
  text: Но Езекия не воздал соответственно благодеянию, оказанному ему[a], потому что возгордилось его сердце; и гнев обрушился на него, на Иудею и Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ответил сообразно оказанной ему милости». Еврейское выражение в широком смысле означает подобающий ответ на полученное добро.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: соответственно оказанному ему благодеянию
  rationale: גְּמוּל в данном контексте обозначает полученное благо или благодеяние, а כ задаёт соразмерность ответного поступка. Формулировка сохраняет широту выражения и не сводит его только к благодарности.
- source_word: הֵשִׁיב
  choice: не воздал
  rationale: Hiphil от שוב в сочетании с גמול означает дать ответное воздаяние, сделать подобающий ответ. «Не воздал» естественно сочетается с «благодеянием» и сохраняет нравственный смысл текста.
- source_word: גָבַהּ לִבּוֹ
  choice: возгордилось его сердце
  rationale: Буквально речь идёт о том, что сердце стало высоким; это устойчивый образ гордости. «Возгордилось его сердце» сохраняет образ сердца и ясно передаёт смысл.
- source_word: קֶצֶף
  choice: гнев
  rationale: קֶצֶף обозначает сильный гнев, в контексте — суд Божий. Русское «гнев» достаточно весомо и не вводит прямо названного действующего лица там, где еврейский текст его не называет.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: и был гнев на нём
  rationale: Экзистенциальная конструкция передана близко к форме оригинала. Она сохраняет неявность источника гнева и его направленность на Езекию.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Иудея и Иерусалим
  rationale: Употреблены традиционные и общепонятные русские формы библейских географических названий.
theological_decisions:
- issue: Характер проступка Езекии в ответ на полученное благо
  choice: Езекия не воздал соответственно оказанному ему благодеянию, без уточнения конкретной формы должного ответа.
  alternative: Езекия не возблагодарил за оказанное ему благодеяние.
  rationale: Еврейское выражение шире словесной благодарности и может охватывать весь подобающий ответ на полученное добро. Перевод не сужает смысл до одного религиозного действия.
- issue: Источник гнева
  choice: Источник гнева оставлен невыраженным, как и в данной еврейской фразе.
  alternative: И был на нём гнев Господа.
  rationale: Из контекста понятно, что речь идёт о Божьем гневе, однако непосредственно в стихе Господь как субъект не назван. Неявность сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. «Воздал» и «благодеяние» сохраняют смысловую точность и достоинство стиля, оставаясь понятными читателю; синтаксис следует ходу еврейского текста без излишней буквальности.
