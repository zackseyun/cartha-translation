  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: ru
  text: С ним — рука плоти[a], а с нами — Яхве, наш Бог, чтобы помогать нам и вести наши войны. И народ положился на слова Езекии, царя Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческая сила». Буквально: «рука плоти» — образ всего лишь человеческой мощи, противопоставленной помощи Яхве.'
    reason: Лексическая альтернатива поясняет сохранённую еврейскую метафору.
lexical_decisions:
- source_word: עִמּוֹ
  choice: с ним
  rationale: Прямо передаёт значение совместности и сохраняет параллелизм с וְעִמָּנוּ — «с нами».
- source_word: זְרוֹעַ בָּשָׂר
  choice: рука плоти
  rationale: Сохраняет выразительную еврейскую метафору бренной, лишь человеческой силы; смысловая альтернатива дана в примечании.
- source_word: וְעִמָּנוּ
  choice: а с нами
  rationale: Союз «а» естественно выражает резкое противопоставление человеческой силы помощи Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Естественная передача формы с местоименным суффиксом первого лица множественного числа.
- source_word: לְעָזְרֵנוּ
  choice: чтобы помогать нам
  rationale: Инфинитив с לְ выражает цель; несовершенный вид уместен в сочетании с последующим длительным военным действием.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: и сражаться в наших битвах
  rationale: Передаёт инфинитив и родственный ему объект без искусственной русской тавтологии; суффикс сохраняется как «наших».
- source_word: וַיִּסָּמְכוּ
  choice: положился
  rationale: Глагол буквально связан с опорой и в данном контексте означает доверие; единственное число согласуется с собирательным «народ».
- source_word: עַל דִּבְרֵי
  choice: на слова
  rationale: Сочетание «положиться на слова» естественно передаёт управление еврейского глагола с עַל.
- source_word: יְחִזְקִיָּהוּ
  choice: Езекия
  rationale: Употреблена устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Традиционная и понятная русская передача царского титула и названия страны.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула и не подменяет его.
- issue: Противопоставление человеческой и Божьей помощи
  choice: «а с нами» как явное противопоставление
  alternative: «и с нами» как формально-сочинительная передача
  rationale: Контекст и параллельное построение явно противопоставляют «руку плоти» присутствию Яхве; русский союз «а» передаёт эту риторическую силу без добавления нового смысла.
- issue: Метафора זְרוֹעַ בָּשָׂר
  choice: сохранить как «рука плоти»
  alternative: передать смыслом как «человеческая сила»
  rationale: Образ подчёркивает ограниченность человеческой мощи в сравнении с Божьей помощью; его сохранение удерживает богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены параллелизм и метафора оригинала; устаревшие синтаксические обороты избегаются. Маркер [a] помещён непосредственно после поясняемого выражения.
