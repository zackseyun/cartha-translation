  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: ru
  text: И также, в случае с посланниками правителей Вавилона, посланными к нему разузнать о знамении[a], которое произошло в стране, Бог оставил его, чтобы испытать его и узнать всё, что было у него на сердце.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чуде» либо «предзнаменовании».'
    reason: lexical_alternative
  - marker: b
    text: Формулировка «узнать всё, что было у него на сердце» сохранена, чтобы передать напряжение исходного текста. Некоторые понимают её в смысле «обнаружить» или «сделать явным» то, что было у него на сердце.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: И также
  rationale: Связывает этот эпизод с предыдущим повествованием и сохраняет добавочное значение еврейского оборота.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: когда к нему прибыли посланники правителей Вавилона
  rationale: מְלִיצֵי здесь обозначает посредников или посланников, а שָׂרֵי — высокопоставленных правителей либо сановников. Временная конструкция естественно передаёт обстоятельственное בְּ, не меняя сути фразы.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: отправленные
  rationale: Морфологически активная форма в контексте идиоматически характеризует посланников как направленных к Езекии; русское страдательное причастие передаёт это естественно.
- source_word: לִדְרֹשׁ
  choice: разузнать о
  rationale: Глагол выражает целенаправленное расспрашивание или исследование; «разузнать» уместно в дипломатическом контексте.
- source_word: הַמּוֹפֵת
  choice: знамении
  rationale: מוֹפֵת может означать знамение, чудо или предзнаменование. «Знамение» сохраняет широкий смысл и необычный характер события.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: которое произошло в стране
  rationale: Глагольная конструкция здесь имеет событийный смысл; «произошло» звучит естественно и точно.
- source_word: עֲזָבוֹ הָאֱלֹהִים
  choice: Бог оставил его
  rationale: «Оставил» прямо передаёт עזב, не усиливая его до «покинул» или «отверг» и сохраняя богословское напряжение.
- source_word: לְנַסּוֹתוֹ
  choice: чтобы испытать его
  rationale: נסה означает подвергнуть испытанию или проверке; «испытать» — ясный и традиционно понятный русский эквивалент.
- source_word: לָדַעַת כָּל בִּלְבָבוֹ
  choice: и узнать всё, что было у него на сердце
  rationale: Дословное значение «узнать» сохранено, а идиома сердца естественно передаёт внутренние мысли, намерения и побуждения человека.
theological_decisions:
- issue: Божественное испытание и язык знания
  choice: Бог оставил его, чтобы испытать его и узнать всё, что было у него на сердце
  alternative: Бог оставил его, чтобы испытанием открыть/обнаружить всё, что было у него на сердце
  rationale: Еврейский текст прямо употребляет לָדַעַת, «узнать». Основной текст сохраняет эту формулировку и возникающее богословское напряжение, не подменяя её толкованием о выявлении или обнародовании состояния сердца.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; при этом сохранены смысловая неоднозначность מוֹפֵת и богословски напряжённое «узнать».
