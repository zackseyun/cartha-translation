  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: ru
  text: Прочие деяния Езекии и проявления его верности — вот[a], они записаны в видении пророка Исаии, сына Амоса, в Книге царей Иудеи и Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действительно». Еврейское слово привлекает внимание к следующему сообщению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְחִזְקִיָּהוּ
  choice: Прочие деяния Езекии
  rationale: В итоговой царской формуле דִּבְרֵי обозначает не только слова, но дела и события царствования; «прочие деяния» естественно передаёт смысл остатка повествовательного материала.
- source_word: וַחֲסָדָיו
  choice: и его дела верности
  rationale: חֶסֶד здесь относится к поступкам царя и выражает верность, преданность и деятельную лояльность. Формулировка сохраняет этический и реляционный оттенок, не превращая слово в узкий технический термин.
- source_word: הִנָּם
  choice: вот, они
  rationale: Частица привлекает внимание к последующему утверждению; «вот» сохраняет её указательно-презентативную силу и уместно в возвышенном историческом стиле.
- source_word: כְּתוּבִים
  choice: записаны
  rationale: В формуле ссылки на письменный источник «записаны» по-русски естественнее буквального «написаны».
- source_word: בַּחֲזוֹן
  choice: в видении
  rationale: Сохранено основное значение חָזוֹן — «видение», без замены на более истолковывающее «запись» или «пророчество».
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: пророка Исаии, сына Амоса
  rationale: Естественный русский порядок слов сохраняет имя, происхождение и пророческое служение Исаии.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: в Книге царей Иудеи и Израиля
  rationale: В библиографической формуле עַל связывает упомянутое видение с более широким письменным источником; русское «в» естественно выражает включение в книгу, не навязывая значение «о».
theological_decisions:
- issue: Оттенок חֶסֶד применительно к поступкам Езекии
  choice: дела верности
  alternative: дела заветной верности; верные поступки; добрые дела
  rationale: «Дела верности» сохраняет смысл деятельной преданности и лояльности, но не утверждает более узкую заветную трактовку, чем позволяет контекст.
- issue: Соотношение «видения Исаии» и «Книги царей Иудеи и Израиля»
  choice: видение представлено как записанное в книге
  alternative: видение и книга как два отдельных источника
  rationale: Синтаксис с עַל допускает дискуссию, но наиболее естественно связывает пророческое видение с названной книгой. Перевод не добавляет союза, который однозначно превратил бы их в два источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром исторической хроники. Сохранены риторическое «вот» и буквальный образ «видения», при этом библиографическая формула передана естественно по-русски.
