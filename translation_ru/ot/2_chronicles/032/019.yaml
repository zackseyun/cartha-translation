  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: ru
  text: И говорили они против Бога Иерусалима так же, как против богов народов земли, созданных человеческими руками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорили к Богу Иерусалима». Еврейский предлог обычно означает «к», но в данном контексте речь носит враждебный характер. Буквально в конце: «дело рук человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: И говорили они
  rationale: Глагол דבר в пиэле означает «говорить»; враждебный характер речи передаётся следующим оборотом «против Бога», а не добавляется к самому глаголу.
- source_word: אֶל אֱלֹהֵי יְרוּשָׁלָם
  choice: против Бога Иерусалима
  rationale: Хотя אֶל обычно означает направление «к», контекст насмешки и хулы допускает и здесь требует естественного русского «против». Форма אֱלֹהֵי в данном контексте имеет единственное значение и обозначает Бога Иерусалима.
- source_word: כְּעַל אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: так же, как против богов народов земли
  rationale: 'Оборот выражает сравнение: о Боге Иерусалима говорили в той же враждебной манере, что и о богах земных народов. «Народы земли» близко передаёт широкое значение עַמֵּי הָאָרֶץ.'
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: творений человеческих рук
  rationale: Сочетание обозначает изготовленные людьми предметы; множественное «творений» грамматически соотнесено в русском с «богов», тогда как еврейское единственное число имеет собирательно-характеризующую силу.
theological_decisions:
- issue: Передавать ли речь как обращённую «к» Богу или направленную «против» Бога
  choice: против Бога
  alternative: к Богу
  rationale: Предшествующий контекст описывает хулу и насмешку посланников Сеннахирима. «Против» естественно выражает прагматическую силу речи, при этом более буквальная возможность отмечена в сноске.
- issue: Понимать ли אֱלֹהֵי יְרוּשָׁלָם как единственное или множественное число
  choice: Бога Иерусалима
  alternative: богов Иерусалима
  rationale: Форма אֱלֹהִים и её конструктивная форма могут обозначать единого Бога Израиля. Контраст с рукотворными богами народов ясно требует здесь единственного числа.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Инверсия «говорили они» сохраняет повествовательную возвышенность без архаизации. Тире ясно связывает характеристику «творений человеческих рук» с богами народов, а не с Богом Иерусалима.
