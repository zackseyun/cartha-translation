base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: ru
  text: Разве вы не знаете, что я и мои отцы[a] сделали со всеми народами разных земель? Разве боги народов тех земель смогли спасти свою землю от моей руки?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предки». Еврейское выражение употребляет семейно-династическое обозначение царских предшественников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: Разве вы не знаете
  rationale: Риторический вопрос предполагает утвердительный ответ; эта русская конструкция естественно передаёт его силу.
- source_word: מֶה עָשִׂיתִי אֲנִי וַאֲבוֹתַי
  choice: что сделали я и мои отцы
  rationale: Совершенный вид передаёт завершённые завоевания; «отцы» сохраняет семейно-династический образ исходного текста.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: со всеми народами разных земель
  rationale: После глагола «сделать» русское «с» идиоматично передаёт враждебное действие, а «разных земель» сохраняет множественное число и географический смысл.
- source_word: הֲיָכוֹל יָכְלוּ
  choice: Разве ... смогли
  rationale: Сочетание риторической частицы и совершенного вида передаёт подчёркнутое отрицание реальной способности; отдельный усилитель сделал бы фразу тяжелее.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: боги народов тех земель
  rationale: Сохраняется цепочка принадлежности и языческая терминология речи Сеннахирима без поясняющей богословской квалификации.
- source_word: לְהַצִּיל אֶת אַרְצָם
  choice: спасти свои земли
  rationale: «Спасти» естественно для избавления от военного захвата. Русское множественное «земли» ясно соотносит отдельную землю с каждым из упомянутых народов, тогда как еврейский текст употребляет собирательное единственное число.
- source_word: מִיָדִי
  choice: от моей руки
  rationale: Сохранена прозрачная библейская метафора руки как власти и силы.
theological_decisions:
- issue: Упоминание «богов» в хвастливой речи языческого царя
  choice: Передать אֱלֹהֵי прямо как «боги», без оговорок.
  alternative: «так называемые боги»
  rationale: Перевод должен передавать слова Сеннахирима и не добавлять в основной текст богословскую оценку его утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской насмешки. Повтор риторического «Разве» сохраняет напор речи; метафора «от моей руки» намеренно оставлена.
