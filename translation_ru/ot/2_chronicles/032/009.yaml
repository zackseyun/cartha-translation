base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: ru
  text: 'После этого Сеннахирим, царь Ассирии, послал своих слуг в Иерусалим — к Езекии, царю Иудеи, и ко всем иудеям, находившимся в Иерусалиме, — сказать: сам он стоял против Лахиса[a], и вся его сила была с ним[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «был против Лахиса». Это военное выражение может означать, что Сеннахирим стоял перед городом или осаждал его.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё его владычество (держава) было с ним». Еврейское слово обычно относится к власти, господству или державе; в данном военном контексте оно может подразумевать все силы, находившиеся под его началом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: После этого
  rationale: Естественный временной переход, точно передающий последовательность событий.
- source_word: שָׁלַח
  choice: послал
  rationale: Основное и контекстуально достаточное значение глагола.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: Сохраняет буквальное значение слова; в царском контексте речь может идти о служителях или должностных лицах.
- source_word: יְרוּשָׁלַיְמָה
  choice: в Иерусалим
  rationale: Направительный суффикс обозначает движение к городу; по-русски естественно «в Иерусалим».
- source_word: וְהוּא עַל לָכִישׁ
  choice: а сам ... находился под Лахисом
  rationale: Русское «под Лахисом» естественно передаёт военное расположение у города и враждебную направленность עַל, не уточняя без необходимости, шла ли уже осада.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: со всей своей военной мощью
  rationale: מֶמְשָׁלָה буквально связано с властью и господством, но в военном контексте обозначает совокупную силу, находившуюся в распоряжении царя; перевод избегает неестественного «со всем своим владычеством».
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: к Езекии ... и ко всем иудеям
  rationale: При глаголе «послал» русское «к» ясно обозначает адресатов враждебного послания; буквальное «против» здесь создавало бы синтаксическую шероховатость.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: находившимся в Иерусалиме
  rationale: Уточняет, что речь идёт об иудеях, находившихся в городе.
- source_word: לֵאמֹר
  choice: 'сказать:'
  rationale: Естественное русское введение прямой речи, которая следует в следующем стихе.
