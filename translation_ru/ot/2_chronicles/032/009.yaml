revisions:
- from: 'После этого Сеннахирим, царь Ассирии, послал своих слуг в Иерусалим, а сам со всей своей военной мощью находился под Лахисом[a], — к Езекии, царю Иудеи, и ко всем иудеям, находившимся в Иерусалиме, сказать:'
  to: 'После этого Сеннахирим, царь Ассирии, послал своих слуг в Иерусалим — к Езекии, царю Иудеи, и ко всем иудеям, находившимся в Иерусалиме, — сказать: сам он стоял против Лахиса[a], и вся его сила была с ним[b].'
