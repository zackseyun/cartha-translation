  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: ru
  text: Тогда царь Езекия и пророк Исаия, сын Амоса, помолились об этом и воззвали к небесам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: помолились
  rationale: Hitpael глагола פלל обычно означает «молиться». Хотя первый глагол в еврейском стоит в единственном числе перед составным подлежащим, последующий וַיִּזְעֲקוּ имеет множественное число; по-русски естественно согласовать оба сказуемых с двумя названными лицами.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: царь Езекия
  rationale: Сохраняется имя и явно названный царский титул; порядок слов соответствует естественному современному русскому употреблению.
- source_word: וִישַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא
  choice: пророк Исаия, сын Амоса
  rationale: Сохранены имя, родословное указание и титул; обособление приложения делает фразу ясной и литературной.
- source_word: עַל־זֹאת
  choice: об этом
  rationale: Сочетание указывает на дело, ставшее предметом или поводом молитвы. «Об этом» передаёт прямое значение, не исключая причинного оттенка контекста.
- source_word: וַיִּזְעֲקוּ
  choice: воззвали
  rationale: זעק обозначает настойчивый, исполненный бедствия или мольбы крик. «Воззвали» сохраняет интенсивность и уместно в dignified biblical register, оставаясь понятным современному читателю.
- source_word: הַשָּׁמָיִם
  choice: к небесам
  rationale: Еврейское существительное имеет форму множественного числа; русское «небеса» естественно употребляется для обозначения небесной сферы и сохраняет число исходного выражения.
theological_decisions:
- issue: Направленность воззвания в выражении הַשָּׁמָיִם
  choice: к небесам
  alternative: к небу
  rationale: Текст описывает направление молитвенного воззвания, не формулируя отдельного космологического учения. Множественное «небеса» близко форме еврейского слова и естественно по-русски.
- issue: Значение עַל־זֹאת как предмета или причины молитвы
  choice: об этом
  alternative: из-за этого
  rationale: '«Об этом» сохраняет более широкую смысловую возможность: речь может идти как о предмете молитвы, так и о положении, которое её вызвало. Причинное «из-за этого» несколько сильнее разрешает неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Воззвали» выбрано вместо разговорного «закричали», поскольку речь идёт о настойчивом молитвенном обращении. Имена переданы в традиционной русской библейской форме.
