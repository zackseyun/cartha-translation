translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» и последовательность сочинённых действий сохраняют повествовательное движение еврейского текста. Необычное множественное число «цари Ассирии» оставлено в основном тексте как подлинная особенность источника и пояснено в сноске.
