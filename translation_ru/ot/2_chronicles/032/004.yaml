base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: ru
  text: 'И собралось множество людей, и они перекрыли все источники и поток, протекавший по земле[a], говоря: «Зачем царям Ассирии[b] приходить и находить много воды?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ручей (вади), протекавший по этой местности».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «цари Ассирии». Множественное число может обозначать ассирийскую царскую власть или династию; с учётом непосредственного исторического контекста некоторые переводы употребляют единственное число: «царь Ассирии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: собралось множество людей
  rationale: Нифаль передаёт совместное собирание, а עַם רָב здесь обозначает многочисленную массу людей. Формулировка естественна для современного русского языка и сохраняет собирательный смысл.
- source_word: וַיִּסְתְּמוּ
  choice: перекрыли
  rationale: Глагол означает заградить или сделать недоступным. «Перекрыли» подходит и к источникам, и к водному потоку, не уточняя без основания конкретный способ — засыпали их, заложили камнями или иначе преградили воду.
- source_word: כָּל הַמַּעְיָנוֹת
  choice: все источники
  rationale: מַעְיָן обозначает природный источник воды; «источники» — ясный и обычный русский эквивалент.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: поток, протекавший
  rationale: נַחַל допускает значения «поток», «ручей» или сезонное русло, а причастие שׁוֹטֵף указывает на текущую воду. Основной текст сохраняет образ действующего водотока, не вводя региональный термин «вади».
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: по земле
  rationale: Оборот указывает, что водоток проходил внутри данной местности. «По земле» естественно описывает его течение, не сужая значение הָאָרֶץ до строго определённой территории.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Сохранён обычный древнееврейский показатель прямой речи и логического основания предпринятого действия.
- source_word: לָמָּה יָבֹאוּ
  choice: зачем … приходить
  rationale: 'Инфинитивная конструкция по-русски естественно передаёт риторически-совещательный смысл вопроса: нет причины позволять противнику получить выгоду.'
- source_word: מַלְכֵי אַשּׁוּר
  choice: царям Ассирии
  rationale: Сохранено грамматическое множественное число исходного текста, хотя непосредственный исторический контекст может побуждать переводчиков употреблять единственное число.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: и находить много воды
  rationale: Буквально сохранены сочинительная связь и смысл обильного запаса воды; «много воды» звучит естественнее по-русски, чем более отвлечённое «обильную воду».
