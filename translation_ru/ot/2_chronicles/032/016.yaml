lexical_decisions:
- source_word: וְעוֹד
  choice: И ещё
  rationale: 'Передаёт продолжение и усиление: к прежним враждебным словам добавились новые.'
- source_word: דִּבְּרוּ
  choice: говорили
  rationale: Прямое и естественное соответствие глаголу דבר в пиэле; форма обозначает продолжавшуюся или повторявшуюся речь.
- source_word: עֲבָדָיו
  choice: слуги его
  rationale: В контексте это представители ассирийского царя. «Слуги» сохраняет широту עבד, не сужая значения до конкретной должности и не подчёркивая рабский статус.
- source_word: עַל
  choice: против
  rationale: Сочетание דבר על допускает нейтральное «о», однако общий контекст хулы и противостояния поддерживает враждебное значение «против».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: הָאֱלֹהִים
  choice: Бога
  rationale: 'В сочетании «Яхве Бог» существительное имеет приложительное значение; по-русски после предлога требуется родительный падеж: «против Яхве Бога».'
- source_word: וְעַל
  choice: и против
  rationale: Повтор предлога сохраняет синтаксический параллелизм двух объектов враждебной речи.
- source_word: יְחִזְקִיָּהוּ
  choice: Езекии
  rationale: Устоявшаяся русская библейская форма имени; падеж определяется предлогом «против».
- source_word: עַבְדּוֹ
  choice: Его слуги
  rationale: Здесь עבד обозначает Езекию как служителя Яхве, а не подчёркивает социальный статус раба; прописная буква в местоимении делает отнесение к Богу прозрачным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Значение עבד применительно к Езекии
  choice: Его слуги
  alternative: Его раба
  rationale: Контекст представляет Езекию как царя, служащего Яхве. «Слуга» сохраняет богословско-царское отношение верности, не привнося неуместного акцента на подневольном положении.
- issue: Враждебная или нейтральная сила עַל
  choice: против
  alternative: о
  rationale: Предлог сам по себе допускает более нейтральное понимание, но ближайший контекст ассирийских поношений явно склоняет к враждебному смыслу; альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок «слуги его» слегка возвышенный, но естественный и помогает ясно отнести местоимение к ассирийскому царю из контекста. Божественное имя передано как «Яхве».
