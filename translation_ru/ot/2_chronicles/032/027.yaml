base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: ru
  text: У Езекии было огромное богатство и великий почёт, и он устроил себе хранилища[a] для серебра, золота, драгоценных камней, благовоний, щитов и всяких ценных предметов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровищницы». Древнееврейское слово может обозначать как хранилища вообще, так и помещения для царских сокровищ.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всякой драгоценной утвари». Древнееврейское выражение имеет широкое значение и может охватывать различные ценные вещи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: У Езекии было
  rationale: Естественно передаёт еврейскую конструкцию обладания ויהי ל, сохраняя повествовательный характер фразы.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: огромное богатство, и он пользовался великим почётом
  rationale: Формулировка передаёт сильное усиление הַרְבֵּה מְאֹד и различает материальное богатство и общественное положение; разное синтаксическое оформление требуется естественным русским узусом.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: Он устроил себе хранилища
  rationale: «Устроил» не сужает עשה до строительства, «себе» передаёт לוֹ, а «хранилища» соответствует широкому значению אֹצָרוֹת.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: для серебра, золота
  rationale: Общее «для» перед перечнем естественно по-русски передаёт назначение хранилищ и повторяемый еврейский предлог.
- source_word: וּלְאֶבֶן יְקָרָה
  choice: драгоценных камней
  rationale: Единственное число в древнееврейском имеет собирательный смысл; русский множественный эквивалент естественен в перечне запасов.
- source_word: וְלִבְשָׂמִים
  choice: благовоний
  rationale: בְּשָׂמִים обозначает ароматические вещества; «благовония» шире, чем духи, и уместно в перечне ценностей.
- source_word: וּלְמָגִנִּים
  choice: щитов
  rationale: Точно передаёт конкретное значение מָגִנִּים, не расширяя его до вооружения вообще.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: и всяких ценных предметов
  rationale: כְּלֵי может обозначать предметы, вещи или утварь, а חֶמְדָּה — то, что желанно и ценно; перевод сохраняет широту выражения.
