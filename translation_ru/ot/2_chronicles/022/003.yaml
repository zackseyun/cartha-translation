  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: ru
  text: Он также шёл путями дома Ахава, потому что его мать советовала ему поступать нечестиво.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם הוּא
  choice: Он также
  rationale: 'Передаёт добавочное и подчёркивающее значение גַּם при самостоятельном местоимении: этот царь следовал тому же образцу.'
- source_word: הָלַךְ בְּדַרְכֵי
  choice: шёл путями
  rationale: Сохраняет еврейскую нравственную метафору образа жизни и при этом естественно звучит в современном литературном русском.
- source_word: בֵּית אַחְאָב
  choice: дома Ахава
  rationale: Слово בֵּית здесь обозначает род и династию; традиционное выражение «дом Ахава» сохраняет эту смысловую широту без поясняющей конкретизации.
- source_word: כִּי
  choice: потому что
  rationale: В данном контексте союз вводит причину поведения царя.
- source_word: אִמּוֹ
  choice: его мать
  rationale: Прямая передача существительного с притяжательным суффиксом.
- source_word: הָיְתָה יֹעַצְתּוֹ
  choice: советовала ему
  rationale: Хотя еврейская конструкция буквально имеет именной характер («была его советницей»), русский глагол естественно передаёт продолжительное влияние матери и избегает тяжеловесности.
- source_word: לְהַרְשִׁיעַ
  choice: поступать нечестиво
  rationale: Передаёт нравственную оценку каузативного инфинитива רשע и его связь с содержанием или целью совета, не добавляя психологических мотивов.
theological_decisions:
- issue: Нравственная характеристика поведения царя под влиянием матери
  choice: Сохранено прямое утверждение, что мать советовала ему поступать нечестиво.
  alternative: «Мать склоняла его ко злу» или «была его советницей в нечестии».
  rationale: Текст прямо оценивает направление её совета посредством לְהַרְשִׁיעַ; перевод не смягчает эту оценку и не усиливает её дополнительными представлениями о принуждении.
translation_notes:
  register: Современный литературный русский с сохранением библейской метафоры «шёл путями» и династического выражения «дом Ахава». Синтаксис сделан естественным для обычного читателя; архаизмы и конфессионально окрашенная терминология не используются.
