base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: ru
  text: И когда Ииуй вершил суд над домом Ахава, он нашёл сановников Иудеи и сыновей братьев Охозии[a], служивших Охозии, и убил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть племянников Охозии.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: когда… совершал суд
  rationale: Конструкция с כְּ имеет временное значение, а שׁפט сохраняет судебный оттенок; выражение передаёт карательное действие, не добавляя явного утверждения о Божьем одобрении.
- source_word: עִם בֵּית אַחְאָב
  choice: над домом Ахава
  rationale: При выражении «совершать суд» русский предлог «над» естественно обозначает объект суда; «дом Ахава» сохраняет семейно-династический библейский образ.
- source_word: שָׂרֵי יְהוּדָה
  choice: правителей Иудеи
  rationale: שׂרים обозначает высокопоставленных руководителей или должностных лиц. «Правители» здесь естественно и не ограничивает их круг царскими сыновьями.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: сыновей братьев Охозии
  rationale: Буквальная родственная формула сохранена в основном тексте; её значение «племянники Охозии» разъяснено в сноске.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: служивших Охозии
  rationale: Причастие обозначает продолжающееся служение или придворное исполнение обязанностей без обязательного культового смысла.
- source_word: וַיַּהַרְגֵם
  choice: и убил их
  rationale: Прямая и нейтральная передача обычного значения הרג без эвфемизма или стилистического усиления.
- source_word: וַיְהִי
  choice: И когда
  rationale: В данном русском предложении повествовательная формула естественно объединена со следующей временной конструкцией; отдельное «и случилось» было бы тяжеловесным.
theological_decisions:
- issue: Характер действий Ииуя и судебная лексика
  choice: «совершал суд» — с сохранением судебного значения
  alternative: «судил» или более интерпретирующее «наказывал»
  rationale: Текст описывает действия Ииуя судебным языком, но в этом стихе не даёт прямой богословской оценки каждого убийства. Перевод сохраняет это напряжение и не добавляет явного Божьего одобрения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан плавным для чтения вслух; повтор имени Охозии сохранён ради ясности и соответствия исходному тексту.
