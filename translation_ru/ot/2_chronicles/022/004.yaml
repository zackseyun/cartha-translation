  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, подобно дому Ахава, потому что после смерти его отца они были его советниками — ему на погибель.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к его разорению»; возможно также: «чтобы погубить его». Древнееврейское выражение может обозначать как гибельный результат их советов, так и их разрушительную цель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Устойчивая древнееврейская формула нравственной оценки передана естественно по-русски; несовершенный вид уместен для характеристики поведения.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранены как древнееврейская метафора божественной оценки, так и личное имя יהוה.
- source_word: כְּבֵית אַחְאָב
  choice: подобно дому Ахава
  rationale: בֵּית здесь обозначает дом, то есть семью или династию Ахава; сравнительная частица כְּ передана словом «подобно».
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: они были его советниками
  rationale: Сохранена именная конструкция оригинала; местоимение отсылает к дому Ахава.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: после смерти его отца
  rationale: Формальная конструкция оригинала точно и естественно воспроизведена в современном русском языке.
- source_word: לְמַשְׁחִית לוֹ
  choice: ему на погибель
  rationale: Краткая русская формула сохраняет возможное значение результата, не утверждая однозначно, что советники сознательно намеревались его уничтожить.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале непосредственно употреблён тетраграмматон; форма «Яхве» передаёт личное имя и соответствует предоставленному консультационному решению.
- issue: Цель или результат советов дома Ахава
  choice: ему на погибель
  alternative: чтобы погубить его
  rationale: Конструкция לְמַשְׁחִית לוֹ допускает оттенок как разрушительного результата, так и намеренной цели. Основной текст не делает намерение советников более определённым, чем оно выражено в оригинале.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Сохранены династическое выражение «дом Ахава», образ «в глазах Яхве» и смысловая неоднозначность заключительной конструкции.
