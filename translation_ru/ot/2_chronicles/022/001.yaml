base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: ru
  text: Жители Иерусалима поставили Ахазию, его самого младшего сына, царём вместо него, потому что отряд, пришедший с арабами в стан[a], убил всех старших сыновей. Так Ахазия, сын Иорама, царя Иудеи, стал царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отряд, пришедший среди арабов в стан». Значение предлога при слове «арабы» допускает разные толкования.'
    reason: Лексико-синтаксическая неоднозначность еврейского выражения בָּעַרְבִים.
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: поставили царём
  rationale: Порода hифиль глагола מלך выражает возведение на царство; эта формулировка естественно передаёт каузативный смысл.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: жители Иерусалима
  rationale: Естественный современный эквивалент буквального «живущие в Иерусалиме».
- source_word: בְנוֹ הַקָּטֹן
  choice: его младшего сына
  rationale: В противопоставлении старшим сыновьям קָטֹן обозначает самого младшего из сыновей.
- source_word: כָל הָרִאשֹׁנִים
  choice: всех старших сыновей
  rationale: Буквально «всех первых/прежних»; ближайший контекст указывает на сыновей Иорама, которые были старше Ахазии.
- source_word: הַגְּדוּד
  choice: отряд
  rationale: גדוד обозначает вооружённый отряд, нередко совершающий набеги; нейтральное «отряд» сохраняет военный смысл без излишнего уточнения.
- source_word: הַבָּא בָעַרְבִים לַמַּחֲנֶה
  choice: пришедший с арабами в стан
  rationale: Предлог ב при «арабах» вероятнее всего имеет сопроводительное значение, а ל указывает направление движения; неоднозначность первого предлога отмечена в сноске.
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В формуле вступления на престол глагол имеет начинательное значение; «стал царём» передаёт именно воцарение, а не продолжительность правления.
