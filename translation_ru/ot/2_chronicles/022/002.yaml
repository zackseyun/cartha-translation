base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: ru
  text: Ахазии было сорок два года, когда он стал царём[a], и он царствовал в Иерусалиме один год. Имя его матери — Гофолия[b], дочь Амврия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «сорок два года». В параллельном месте, 4 Царств 8:26, сказано: «двадцать два года», поэтому некоторые считают это место текстологически проблемным или предлагают иначе понимать способ исчисления.'
    reason: textual_variant
  - marker: b
    text: 'Или: «потомкой Амврия». Еврейское слово «дочь» иногда может обозначать и более отдалённую родственницу по нисходящей линии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: было сорок два года
  rationale: Обычная древнееврейская конструкция для обозначения возраста. По-русски естественно передаётся оборотом «было сорок два года».
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Предлог ב при инфинитивной конструкции обозначает время вступления на царство; выбран естественный современный русский оборот.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: и он царствовал ... один год
  rationale: Перевод сохраняет числительное и прямо передаёт продолжительность царствования.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Стандартная передача местного значения предлога ב при названии города.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная русская передача формулы «имя его матери было» без потери смысла.
- source_word: עֲתַלְיָהוּ
  choice: Гофолия
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: בַּת עָמְרִי
  choice: она была дочерью Амврия
  rationale: В основном тексте сохранено прямое значение слова בַּת — «дочь»; возможное более широкое значение родства вынесено в сноску.
theological_decisions:
- issue: Хронологическое расхождение в возрасте Ахазии при воцарении
  choice: В основном тексте сохранено масоретское чтение «сорок два года»
  alternative: «Двадцать два года», как в 4 Царств 8:26; либо иное исчисление, связанное с династией Амврия
  rationale: Предоставленный еврейский текст прямо содержит число «сорок два». Перевод не должен молча исправлять или согласовывать его с параллельным местом; расхождение отмечено в сноске.
- issue: Объём родственного значения выражения «дочь Амврия»
  choice: 'Переведено буквально: «дочерью Амврия»'
  alternative: «потомком Амврия» или «внучкой Амврия»
  rationale: Еврейский текст употребляет обычное слово «дочь», однако термины родства могут обозначать и более отдалённое происхождение. Основной текст сохраняет формулировку источника, а более широкое понимание указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством царской летописной формулы. Синтаксис сделан естественным для обычного читателя; масоретское числовое чтение и генеалогическая неоднозначность сохранены, а не сглажены.
