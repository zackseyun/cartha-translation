  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: ru
  text: Аталия, мать Охозии, увидела, что её сын умер, и поднялась, и истребила[a] всё царское потомство дома Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит трудная глагольная форма, буквально связанная со значением «говорить»; однако контекст и параллельное место в 4 Царств 11:1 указывают на смысл «истребила» или «умертвила».
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: Аталия
  rationale: Имя передано в принятой русской библейской форме; начальный וַ־ не требует отдельного союза в начале русского стиха.
- source_word: אֵם אֲחַזְיָהוּ
  choice: мать Охозии
  rationale: Конструктивное сочетание естественно и ясно передано родительным падежом.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: увидела, что её сын умер
  rationale: Оборот с כִּי вводит воспринятый факт; глагол «умер» естественно передаёт завершившееся событие.
- source_word: וַתָּקָם
  choice: поднялась
  rationale: Глагол קום в повествовании обозначает переход к решительному действию; «поднялась» сохраняет этот оттенок и достоинство регистра.
- source_word: וַתְּדַבֵּר
  choice: истребила
  rationale: Масоретская форма буквально связана с «говорить», однако прямое дополнение и параллель в 4 Царств 11:1 указывают на уничтожение царского потомства. «Истребила» передаёт результат, не уточняя способ.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: всё царское потомство
  rationale: זֶרַע буквально означает «семя, потомство»; в династическом контексте «царское потомство» точно и понятно.
- source_word: לְבֵית יְהוּדָה
  choice: дома Иуды
  rationale: Фраза указывает на принадлежность потомства династическому дому Иуды; русский родительный оборот передаёт это естественно.
theological_decisions:
- issue: Передача трудной формы וַתְּדַבֵּר
  choice: истребила
  alternative: говорила против; распорядилась умертвить
  rationale: Буквальное «говорила» не сочетается по смыслу с прямым дополнением «всё царское потомство». Контекст и параллельное повествование в 4 Царств 11:1 поддерживают значение уничтожения. Текстовая трудность не скрыта, а отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Сохранена последовательность двух решительных действий посредством «и поднялась, и истребила»; неоднозначность трудной еврейской формы документирована в сноске.
