  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: ru
  text: 'И он стал разыскивать Охозию[a]. Его схватили, когда он скрывался в Самарии, привели к Ииую и предали смерти. Затем его похоронили, потому что говорили: «Он сын Иосафата, который искал Яхве всем сердцем». А у дома Охозии не было сил удержать царство[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И он стал искать Охозию». Под «он» может подразумеваться Ииуй, действующий через своих людей; далее в еврейском тексте стоят глаголы во множественном числе.'
    reason: Неявный субъект и смена числа в еврейском повествовании.
  - marker: b
    text: 'Или: «У дома Охозии не было силы удержать царство».'
    reason: Еврейская конструкция говорит об отсутствии у династии силы или способности сохранить царскую власть; она не называет прямо конкретного человека.
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: И стали искать
  rationale: Единственное число допускает коллективного или властного субъекта — Ииуя и действующих по его приказу людей; безлично-множественная русская конструкция естественно согласуется с последующими формами множественного числа и не устраняет эту неопределённость.
- source_word: וַיִּלְכְּדֻהוּ
  choice: Его схватили
  rationale: לכד обозначает захват человека; «схватили» ясно и естественно передаёт действие воинов.
- source_word: מִתְחַבֵּא בְשֹׁמְרוֹן
  choice: когда он скрывался в Самарии
  rationale: Причастие породы hitpael описывает продолжающееся укрывательство; местное ב передано предлогом «в».
- source_word: וַיְבִאֻהוּ אֶל־יֵהוּא
  choice: привели к Ииую
  rationale: Каузативная форма בוא означает доставить или привести; в отношении пленника «привели» по-русски естественнее.
- source_word: וַיְמִתֻהוּ
  choice: предали смерти
  rationale: Каузатив от מות буквально выражает причинение смерти; формулировка сохраняет эту силу, не уточняя сверх текста форму казни.
- source_word: וַיִּקְבְּרֻהוּ
  choice: его похоронили
  rationale: Прямое и современное соответствие глаголу קבר.
- source_word: אֲשֶׁר דָּרַשׁ אֶת־יְהוָה
  choice: который искал Яхве
  rationale: דרש по отношению к Богу означает обращаться к Нему и искать Его в преданности; «искал» сохраняет ключевую лексику исходного текста.
- source_word: בְּכָל־לְבָבוֹ
  choice: всем сердцем
  rationale: Естественная русская передача устойчивого библейского выражения о всецелой преданности.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: в доме Охозии не осталось никого, кто был бы в силах удержать царскую власть
  rationale: Идиоматически передаёт отсутствие у династии силы или способного представителя для сохранения власти; образ «удержать силу для царства» в буквальном русском был бы неясен.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл заключительной фразы о доме Охозии
  choice: отсутствие способного представителя, который мог бы удержать царскую власть
  alternative: у дома Охозии не было силы удержать царство
  rationale: Конструкция допускает как акцент на династической силе, так и на человеке, способном править. Основной текст выражает естественный для контекста личный смысл, а примечание сохраняет более буквальную альтернативу.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Имена переданы в привычной русской библейской форме: Охозия, Ииуй, Иосафат; личное имя יהוה — «Яхве». Синтаксис упрощён лишь там, где буквальное воспроизведение было бы неясно, а значимая неоднозначность отмечена в сносках.'
