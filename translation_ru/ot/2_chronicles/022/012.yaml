source:
  edition: WLC
  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: ru
  text: И он оставался с ними в доме Божьем[a], скрываясь[b] шесть лет, а Гофолия в это время царствовала над страной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в храме Божьем; буквально: «в доме Бога».'
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «будучи скрыт». Древнееврейское причастие может описывать как то, что он скрывался, так и его пребывание в укрытии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: оставался
  rationale: В данном повествовательном контексте форма глагола היה указывает на продолжавшееся пребывание Иоаса; «оставался» естественно передаёт это по-русски.
- source_word: אִתָּם
  choice: с ними
  rationale: Предлог с местоименным суффиксом прямо обозначает пребывание Иоаса вместе с укрывавшими его людьми.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: в доме Божьем
  rationale: Сохраняет буквальный древнееврейский образ «дом Бога»; в данном контексте имеется в виду храм.
- source_word: מִתְחַבֵּא
  choice: скрываясь
  rationale: 'Возвратно-средняя форма причастия естественно передаётся деепричастием «скрываясь», но контекст допускает понимание состояния: «будучи скрыт».'
- source_word: שֵׁשׁ שָׁנִים
  choice: шесть лет
  rationale: Русский винительный времени естественно выражает продолжительность без дополнительного предлога.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: а Гофолия в это время царствовала
  rationale: Причастие описывает продолжающееся и одновременное действие; слова «в это время» ясно передают временное соотношение, а союз «а» — контраст.
- source_word: עַל הָאָרֶץ
  choice: над страной
  rationale: Здесь הָאָרֶץ обозначает землю или страну Иудеи; «страна» не сужает значение до государственного аппарата или царства.
theological_decisions:
- issue: Деятельное или страдательное понимание מִתְחַבֵּא
  choice: скрываясь
  alternative: будучи скрыт
  rationale: Порода хитпаэль допускает возвратно-среднее понимание, тогда как контекст подчёркивает, что ребёнка укрывали другие. Основной текст сохраняет естественное возвратное чтение, а примечание — реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Имя עֲתַלְיָה передано в традиционной русской библейской форме «Гофолия». Формулировка остаётся ясной для современного читателя и сохраняет образ «дома Божьего».
