source:
  edition: WLC
  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: ru
  text: Но Иосавеф, дочь царя, взяла Иоаса, сына Охозии, и тайно унесла его из среды царских сыновей, которых убивали[a]. Она поместила его и его кормилицу в спальню[b]. Так Иосавеф, дочь царя Иорама, жена священника Иодая, спрятала его от Гофолии — ведь она была сестрой Охозии, — и она не убила его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «которых должны были убить».'
    reason: Причастие הַמּוּמָתִים может описывать как совершаемую казнь, так и тех, кто был предназначен к смерти.
  - marker: b
    text: 'Буквально: «в комнате кроватей».'
    reason: Сноска сохраняет конкретную форму еврейского выражения, переданного в тексте естественным русским словом «спальня».
  - marker: c
    text: 'По смыслу «она», скорее всего, относится к Гофолии: Иосавеф спрятала Иоаса, и потому Гофолия его не убила. Однако грамматически возможно отнести это местоимение к Иосавеф.'
    reason: Еврейская глагольная форма отмечает женский род субъекта, но не называет его, вследствие чего остаётся референциальная неоднозначность.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: взяла
  rationale: Основное значение לקח — «взять». Контекст подразумевает спасение ребёнка, но добавлять это значение непосредственно в глагол не следует.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: тайно унесла его
  rationale: Глагол גנב буквально связан с кражей, но здесь обозначает скрытое изъятие ребёнка из обречённой группы. Русское «украла его» могло бы ошибочно представить поступок как похищение со злым умыслом; «тайно унесла» передаёт скрытность действия и естественно звучит в данном контексте.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: из среды царских сыновей, которых убивали
  rationale: Причастие הַמּוּמָתִים допускает понимание происходящей казни или предназначенности к смерти. Основной текст передаёт непосредственный процесс, а альтернативу сохраняет сноска.
- source_word: מֵינִקְתּוֹ
  choice: его кормилицу
  rationale: Существительное обозначает женщину, кормившую ребёнка грудью. «Кормилица» — точное и понятное русское соответствие.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: в спальне
  rationale: Буквально выражение означает «в комнате кроватей». «В спальне» естественно передаёт назначение помещения; буквальная форма указана в сноске.
- source_word: וַתַּסְתִּירֵהוּ
  choice: спрятала его
  rationale: Прямое и естественное соответствие глаголу סתר в данной повествовательной сцене.
- source_word: אֵשֶׁת יְהוֹיָדָע הַכֹּהֵן
  choice: жена священника Иодая
  rationale: Сохраняется полное пояснение личности Иосавеф и естественный для русского порядок слов.
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: ведь она была сестрой Охозии
  rationale: כִּי вводит объяснение её поступка. Частица «ведь» сохраняет причинно-пояснительную связь, не делая её чрезмерно жёсткой.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: от Гофолии
  rationale: מִפְּנֵי буквально может означать «от лица/присутствия», но в контексте речь о сокрытии ребёнка от Гофолии и вне её досягаемости.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: и она не убила его
  rationale: Форма глагола указывает на субъект женского рода, но не называет его. Неоднозначное местоимение сохранено в основном тексте, а наиболее вероятный референт разъяснён в сноске.
theological_decisions:
- issue: Кто является субъектом заключительного וְלֹא הֱמִיתָתְהוּ
  choice: В основном тексте сохранено неоднозначное «она»; по контексту наиболее вероятна Гофолия.
  alternative: 'Субъектом может быть Иосавеф: «и она не умертвила его».'
  rationale: 'В еврейском тексте субъект выражен только формой женского рода. Ближайшая логическая связь «спрятала его от Гофолии» указывает на результат: Гофолия его не убила. Однако грамматика сама по себе не исключает Иосавеф, поэтому перевод не подменяет неоднозначность явным именем.'
translation_notes:
  register: 'Современный литературный русский язык с традиционными русскими формами библейских имён: Иосавеф, Иоас, Охозия, Иорам, Иодай, Гофолия. Повествование выдержано в ясном и достойном регистре; буквальные семитские обороты смягчены там, где они были бы неестественны, а значимые альтернативы и неоднозначность вынесены в сноски.'
