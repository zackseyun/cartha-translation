  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: ru
  text: Он также поступал по их совету[a] и пошёл с Иегорамом, сыном Ахава, царём Израиля, на войну против Хазаила, царя Арама[b], в Рамот-Галаад. И арамеи ранили Иорама[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходил по их совету»; то есть руководствовался их советом в своих поступках.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Сирии». Арам — название страны в еврейском тексте; соответственно, «арамеи» традиционно переводится как «сирийцы».'
    reason: alternative_reading
  - marker: c
    text: 'В еврейском тексте употреблены две родственные формы имени: «Иегорам» в начале стиха и «Иорам» в конце.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: также
  rationale: Передаёт продолжение мысли предыдущего контекста без излишнего усиления.
- source_word: בַּעֲצָתָם הָלַךְ
  choice: поступал по их совету
  rationale: Естественно передаёт еврейскую метафору хождения как образ поведения; буквальное «ходил по их совету» в современном русском звучало бы неясно.
- source_word: וַיֵּלֶךְ אֶת
  choice: пошёл с
  rationale: Точно и естественно выражает сопровождение Иегорама.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: Иегорам ... Иорам
  rationale: Сохраняет две родственные формы имени, различённые в еврейском тексте.
- source_word: לַמִּלְחָמָה עַל
  choice: на войну против
  rationale: Передаёт цель похода и враждебную направленность עַל в военном контексте.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохраняет историческое название еврейского оригинала, не заменяя его более поздним традиционным названием «Сирия».
- source_word: בְּרָמוֹת גִּלְעָד
  choice: в Рамот-Галаад
  rationale: Употребляет принятую русскую форму географического названия и естественный предлог для места военных действий.
- source_word: וַיַּכּוּ
  choice: ранили
  rationale: Контекст следующего стиха показывает, что речь идёт о нанесённом Иораму ранении, а не обязательно о его поражении в битве.
- source_word: הָרַמִּים
  choice: арамеи
  rationale: Последовательно передаёт этноним, образованный от названия Арам.
theological_decisions:
- issue: Передача исторического названия אֲרָם и этнонима הָרַמִּים
  choice: Арам / арамеи
  alternative: Сирия / сирийцы
  rationale: Выбор следует историческому обозначению в еврейском тексте и не подменяет его более поздним географическим названием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Еврейская идиома раскрыта естественным русским оборотом, а исторические имена и различие форм имени сохранены.
