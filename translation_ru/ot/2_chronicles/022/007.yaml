  terminology: Формы «Охозия», «Иорам», «Иегу», «Нимши», «Яхве» и выражение «дом Ахава» употреблены последовательно и уместно. «Помазал» и «истребить» адекватно передают ключевые термины, не добавляя конфессионального истолкования.
