base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: ru
  text: Падение Охозии, связанное с тем, что он пришёл к Иораму, было от Бога. Когда Охозия пришёл, он вместе с Иорамом вышел к Иегу[a], сыну Нимши, которого Яхве помазал, чтобы истребить дом Ахава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вышел вместе с Иорамом против Иегу»; возможно также: «вышел навстречу Иегу». Буквально по-еврейски: «к Иегу», хотя контекст может подразумевать враждебную встречу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: была от Бога
  rationale: Предлог מִן указывает на источник. Формулировка сохраняет прямое отнесение гибели Охозии к Богу, не уточняя сверх текста способ божественного действия.
- source_word: תְּבוּסַת
  choice: гибель
  rationale: Существительное обозначает поражение, попрание или крушение; в данном контексте речь идёт о гибельном исходе для Охозии. «Гибель» естественно передаёт итог, не ограничивая смысл военным поражением.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: из-за его прихода к Иораму
  rationale: Инфинитив с ל связывает гибель Охозии с его приходом к Иораму как с обстоятельством и причиной гибельного исхода. Русская конструкция делает эту связь ясной, не приписывая тексту подробного объяснения механизма причинности.
- source_word: וּבְבֹאוֹ
  choice: Когда Охозия пришёл
  rationale: ב с инфинитивом и местоименным суффиксом имеет временное значение. Повтор имени устраняет возможную для русского читателя неясность субъекта.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: он вместе с Иорамом выступил к Иегу
  rationale: יָצָא в повествовании, особенно при возможном военном столкновении, может означать «выступить». Предлог אֶל буквально означает «к», поэтому в основном тексте не вводится однозначное «против»; возможный враждебный оттенок отмечен в сноске.
- source_word: יְהוֹרָם / יוֹרָם
  choice: Иорам
  rationale: Обе еврейские формы относятся здесь к одному царю. В русском употреблена традиционная единая форма имени, поскольку различие краткого и полного вариантов не выражается устойчиво и могло бы ошибочно создать впечатление двух лиц.
- source_word: מְשָׁחוֹ
  choice: помазал
  rationale: Глагол обозначает совершённое ранее помазание Иегу. Последовательность событий ясна из относительного придаточного и контекста, поэтому простое прошедшее время звучит естественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: чтобы истребить дом Ахава
  rationale: Hифиль от כרת означает отсечь, устранить или истребить. «Истребить дом» сохраняет смысл суда над династией и естественно звучит в современном литературном русском.
theological_decisions:
- issue: Божественная причинность гибели Охозии
  choice: «была от Бога»
  alternative: «была предопределена Богом» / «была допущена Богом»
  rationale: Еврейский текст прямо называет Бога источником гибельного исхода, но не определяет, следует ли понимать это как непосредственное установление, провиденциальный суд или допущение. Перевод сохраняет это напряжение.
- issue: Характер выхода к Иегу
  choice: «выступил к Иегу»
  alternative: «выступил против Иегу» / «вышел навстречу Иегу»
  rationale: Контекст допускает враждебную встречу, однако אֶל само по себе означает направление «к» и не выражает однозначно «против». Основной текст сохраняет формальную неоднозначность, а варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский с традиционными русскими формами библейских имён. Синтаксис сделан ясным для обычного читателя; при этом сохранены прямое указание на Бога как источник гибели и неоднозначность предлога אֶל.
