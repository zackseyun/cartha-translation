  naturalness: Текст написан естественным современным литературным русским языком. «Оправиться от ран» несколько точнее передаёт выздоровление после ранений, чем «исцелиться от ран». В данном контексте «увидеть Иорама» сохраняет буквальное значение исходного глагола и вполне естественно; «навестить» следует оставить как содержательную альтернативу в сноске.
