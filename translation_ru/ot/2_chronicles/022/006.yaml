  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: ru
  text: И он возвратился в Изреель, чтобы оправиться от ран, нанесённых ему в Раме, когда он сражался с Азаилом, царём Арама. А Азария[a], сын Иорама, царь Иудеи, спустился в Изреель, чтобы увидеть Иорама, сына Ахава, потому что тот был болен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом стихе книги Паралипоменон написано имя «Азария»; в других местах тот же царь назван Охозией.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב לְהִתְרַפֵּא
  choice: И он возвратился… чтобы исцелиться
  rationale: Глагол שוב передаёт возвращение в последовательности повествования, а Hitpael от רפא — восстановление после полученных ран. «Исцелиться» естественно и сохраняет образ лечения.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: от ран, нанесённых ему
  rationale: Буквально говорится об ударах, которыми его поразили; в данном контексте речь о полученных ранах. Русская конструкция передаёт результативный смысл без ненужной буквальности.
- source_word: בָרָמָה
  choice: в Раме
  rationale: Предлог ב обозначает место, где были нанесены раны. Русское «в Раме» естественно для названия города.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: когда он сражался с Азаилом
  rationale: Инфинитив с ב передаёт временное обстоятельство; при לחם частица אֶת здесь обозначает противника. В русском «сражаться с» однозначно выражает противостояние.
- source_word: וַעֲזַרְיָהוּ
  choice: А Азария
  rationale: Основной текст сохраняет написанное в данном стихе имя Азария и не гармонизирует его с именем Охозия в других местах.
- source_word: יָרַד
  choice: спустился
  rationale: Сохранено направительное значение ירד — «идти вниз, спускаться».
- source_word: לִרְאוֹת
  choice: повидать
  rationale: Буквально «увидеть», но в контексте болезни это посещение человека. «Повидать» естественно по-русски и остаётся близким к исходному глаголу.
- source_word: כִּי חֹלֶה הוּא
  choice: потому что тот был болен
  rationale: Указательное «тот» ясно относит местоимение к Иораму, не меняя причинного значения כִּי.
theological_decisions:
- issue: Вариант царского имени в книге Паралипоменон
  choice: Сохранить в основном тексте имя «Азария»
  alternative: Охозия
  rationale: Масоретский текст данного стиха читает עזריהו. Имя не следует молча согласовывать с параллельными местами; известный читателю вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме; «Арам» сохранён как прямое соответствие אֲרָם. Причинная связь и различие между двумя царями по имени Иорам выражены ясно, без устранения текстового варианта имени Азария.
