base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: ru
  text: И Яхве поразил кушитов[a] перед Асой и Иудой, и кушиты бежали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эфиопов». В еврейском тексте употреблён этноним «кушиты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: поразил
  rationale: В военном контексте глагол נָגַף обозначает нанесение поражения или сокрушительный удар. «Поразил» сохраняет образность и прямое указание на действие Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הַכּוּשִׁים
  choice: кушиты
  rationale: Прямая передача еврейского этнонима; она не отождествляет древний Куш без оговорок с современной Эфиопией.
- source_word: לִפְנֵי
  choice: перед
  rationale: В повествовании о сражении выражение означает «перед лицом», то есть перед Асой и Иудеей, при их наступлении или в их присутствии.
- source_word: אָסָא
  choice: Аса
  rationale: Принятая русская форма личного имени; после предлога употреблён творительный падеж «Асой».
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Здесь название относится к царству или его войску. «Иудея» в данном синтаксисе естественнее по-русски, чем двусмысленное «Иуда».
- source_word: וַיָּנֻסוּ
  choice: обратились в бегство
  rationale: Точно передаёт נוּס «бежать, спасаться бегством» и звучит естественно в военном повествовании.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Субъект победы над кушитами
  choice: Яхве непосредственно назван тем, кто поразил кушитов
  alternative: Аса и войско Иудеи победили кушитов
  rationale: Синтаксис прямо приписывает решающее действие Яхве, тогда как Аса и Иудея указаны после לִפְנֵי. Перевод сохраняет это богословское ударение, не устраняя человеческого участия, подразумеваемого контекстом сражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Порядок частей фразы близок к еврейскому оригиналу, но «обратились в бегство» выбрано ради естественной русской военной речи. Маркер сноски поставлен непосредственно после слова, которое он поясняет.
