  text: וַ/יֵּצֵ֥א אָסָ֖א לְ/פָנָ֑י/ו וַ/יַּֽעַרְכוּ֙ מִלְחָמָ֔ה בְּ/גֵ֥יא צְפַ֖תָה לְ/מָרֵשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: ru
  text: Аса выступил ему навстречу[a], и они выстроились для битвы[b] в долине Цефата у Мареши.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед ним»; возможно также: «против него». В данном контексте речь идёт о выходе навстречу противнику.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «расположили войска в боевом порядке».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: выступил
  rationale: В военном повествовании יצא обозначает выход войска навстречу противнику; «выступил» естественно передаёт это движение, не добавляя излишних подробностей.
- source_word: לְפָנָיו
  choice: ему навстречу
  rationale: Буквально выражение означает «перед ним», однако здесь описывает движение Асы для встречи с наступающим противником. «Ему навстречу» ясно передаёт контекст, а буквальный вариант сохранён в сноске.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: они выстроились для битвы
  rationale: Сочетание ערך с מלחמה означает построение войск к сражению. Такой перевод передаёт образ боевого построения современным и ясным русским языком.
- source_word: בְּגֵיא
  choice: в долине
  rationale: גיא означает долину или ущелье; «долина» — наиболее нейтральное и понятное обозначение данной местности.
- source_word: צְפַתָה
  choice: Цефата
  rationale: Название места передано принятой русской библейской транслитерацией, отражающей еврейскую форму צְפַתָה.
- source_word: לְמָרֵשָׁה
  choice: у Мареши
  rationale: Предлог לְ при географическом названии здесь указывает на расположение долины относительно Мареши; «у Мареши» естественно передаёт значение близости, не отождествляя долину с самим городом.
