  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: ru
  text: Аса делал то, что было добрым и правильным в глазах Яхве, его Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в глазах Яхве»; это выражение означает «с точки зрения Яхве», «по оценке Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: делал
  rationale: В этой оценочной конструкции עשה обозначает поступки и образ действий; несовершенный вид «делал» естественно передаёт характеристику поведения Асы.
- source_word: אָסָא
  choice: Аса
  rationale: Традиционная русская форма библейского личного имени.
- source_word: הַטּוֹב
  choice: доброе
  rationale: Субстантивированное прилагательное с артиклем обозначает то, что является добрым; форма среднего рода естественно сочетается с парным определением.
- source_word: וְהַיָּשָׁר
  choice: и правильное
  rationale: В нравственно-оценочном контексте יָשָׁר означает правильное, правое; «правильное» ясно и естественно в современной русской речи.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохраняет прозрачную еврейскую метафору оценки с чьей-либо точки зрения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Хотя אֱלֹהִים формально имеет окончание множественного числа, здесь оно обозначает единого Бога Израиля; возвратное «своего» однозначно связывает Бога с подлежащим Асой.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер нравственной оценки
  choice: доброе и правильное
  alternative: доброе и праведное; угодное и правое
  rationale: Два еврейских определения сохранены раздельно без усиления до специального богословского термина «праведное».
translation_notes:
  register: Современный литературный русский язык с сохранением образного еврейского оборота. Формулировка краткая и достойная; имя Яхве передано явно.
