base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: ru
  text: 'И воззвал Аса к Яхве, своему Богу, и сказал: «Яхве! Кроме Тебя некому помочь — будь то сильному или бессильному.[a] Помоги нам, Яхве, Боже наш, ведь мы полагаемся на Тебя и во имя Твоё вышли против этого множества. Яхве, Боже наш, Ты не дай смертному человеку устоять против Тебя».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза кратка и допускает иное понимание: «Для Тебя нет различия, помогать ли многочисленным или тем, у кого нет силы». Слово רַב может указывать как на многочисленность, так и на силу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не дай смертному человеку одолеть Тебя»; возможно также: «пусть смертный человек не противостанет Тебе». Значение глагола в этой фразе не вполне однозначно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: воззвал
  rationale: В контексте молитвы קרא אל означает настойчивое обращение к Богу; «воззвал» передаёт срочность и сохраняет достоинство библейского регистра.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, транслитерацией, а не заменяет его титулом.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: кроме Тебя некому помочь
  rationale: Компактная еврейская конструкция трудна; этот перевод естественно выражает исключительность Божьей помощи, не утверждая, будто Богу требуется помощник.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: в противостоянии сильного и бессильного
  rationale: Сохраняет полярность между обладающим большой силой или численностью и лишённым силы, не устраняя лексическую неоднозначность רַב.
- source_word: עָזְרֵנוּ
  choice: помоги нам
  rationale: Прямой и естественный русский императив с объектным суффиксом первого лица множественного числа.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: ведь мы полагаемся на Тебя
  rationale: Естественно передаёт метафорическое «опереться на» в значении доверия и зависимости.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: во имя Твоё вышли
  rationale: «Во имя Твоё» передаёт действие с опорой на Божье имя и власть; «вышли» естественно в военном контексте движения против неприятеля.
- source_word: הֶהָמוֹן הַזֶּה
  choice: это множество
  rationale: Сохраняет широкое значение הָמוֹן — многочисленное скопление людей — и соответствует военному контексту без добавления отсутствующего существительного «войско».
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: не дай смертному человеку устоять против Тебя
  rationale: עצר здесь допускает значения удержаться, противостать или одолеть; «устоять против» хорошо отвечает контексту битвы, а «смертный человек» передаёт оттенок человеческой бренности в אֱנוֹשׁ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет личное Божье имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Смысл אֵין עִמְּךָ לַעְזוֹר
  choice: Кроме Тебя некому помочь
  alternative: Для Тебя нет различия, помогать ли многочисленному или бессильному
  rationale: Выбранное чтение понимает עִמְּךָ в смысле исключительности Божьей способности помочь, но сноска сохраняет реальную синтаксическую неоднозначность и распространённое альтернативное понимание.
- issue: Смысл заключительного אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: не дай смертному человеку устоять против Тебя
  alternative: пусть смертный человек не одолеет Тебя; пусть человек не удержит силы перед Тобой
  rationale: Формулировка сохраняет направленность молитвы на противостояние человека Богу и не подразумевает, что человек фактически способен победить Бога; трудность глагола отмечена в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенным звучанием. Сохранены повторения «Яхве, Боже наш» и напряжённость прямого обращения. Местоимения, относящиеся к Богу, написаны с прописной буквы как устойчивая русская религиозно-литературная норма.
