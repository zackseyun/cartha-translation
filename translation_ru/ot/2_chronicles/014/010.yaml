- from: 'И воззвал Аса к Яхве, своему Богу, и сказал: «Яхве! Кроме Тебя некому помочь в противостоянии сильного и бессильного.[a] Помоги нам, Яхве, Боже наш, ведь мы полагаемся на Тебя и во имя Твоё вышли против этого множества. Яхве, Боже наш, Ты — наш Бог; не дай смертному человеку устоять против Тебя».[b]'
  to: 'И воззвал Аса к Яхве, своему Богу, и сказал: «Яхве! Кроме Тебя некому помочь — будь то сильному или бессильному.[a] Помоги нам, Яхве, Боже наш, ведь мы полагаемся на Тебя и во имя Твоё вышли против этого множества. Яхве, Боже наш, Ты не дай смертному человеку устоять против Тебя».[b]'
  rationale: Устранено добавленное представление о конфликте «сильного и бессильного» и сохранена исходная полярность условий, в которых Бог может помочь. В сноске а отмечены оба жизнеспособных оттенка רַב. Заключительная фраза приведена ближе к эмфатическому «Ты» оригинала, а сноска b отредактирована для ясности, сохраняя текстологическую осторожность.
