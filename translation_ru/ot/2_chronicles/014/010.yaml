    rationale: После «Яхве, Боже наш» еврейский текст содержит эмфатическое «Ты» перед просьбой; предикативное «Ты — наш Бог» возможно как переводческая развёртка, но не необходимо. Более близкое «Ты не дай» сохраняет акцент без добавленной связки.
  - severity: low
