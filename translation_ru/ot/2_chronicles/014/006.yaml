  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: ru
  text: 'И сказал он Иудее: «Построим эти города и окружим их стенами и башнями, воротами и засовами, пока земля ещё перед нами,[a] потому что мы искали Яхве, Бога нашего. Мы искали Его, и Он даровал нам покой со всех сторон». И они построили и преуспели.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь земля ещё перед нами». Эти слова могут означать, что возможность действовать всё ещё открыта или что земле пока ничто не угрожает.'
    reason: Союз и идиоматическое выражение допускают причинное прочтение и несколько близких контекстуальных оттенков, которые основной текст намеренно не конкретизирует.
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: И сказал он Иудее
  rationale: Название Иуда метонимически обозначает народ или царство; перевод сохраняет форму еврейского текста, не добавляя слова «народ».
- source_word: נִבְנֶה
  choice: Построим
  rationale: Когортатив первого лица множественного числа выражает побуждение и совместное намерение; в русском это естественно передаётся формой «Построим».
- source_word: הֶעָרִים הָאֵלֶּה
  choice: эти города
  rationale: Обычное значение עָרִים и контекст городских укреплений требуют слова «города».
- source_word: וְנָסֵב
  choice: и окружим их
  rationale: Каузативная форма глагола סבב означает окружить; местоимение «их» ясно указывает на города и естественно связывает глагол с перечнем укреплений.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: стенами и башнями, воротами и засовами
  rationale: Перечень обозначает оборонительные сооружения. Единственное חוֹמָה имеет собирательное значение, поэтому русское множественное «стенами» естественно; דְּלָתַיִם в данном контексте — городские ворота, а בְּרִיחִים — их запирающие засовы.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: пока земля ещё перед нами
  rationale: Формулировка сохраняет временной оттенок «ещё» и образное выражение «перед нами», не сводя неоднозначный оборот к одному толкованию — доступности, владению или отсутствию угрозы.
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: потому что мы искали Яхве, Бога нашего
  rationale: דרשׁ по отношению к Богу означает искать Его в преданности и уповании, а не только вопрошать. Порядок «Бога нашего» сохраняет достойный библейский регистр.
- source_word: דָרַשְׁנוּ
  choice: Мы искали Его
  rationale: Повтор исходного глагола сохранён как смысловое усиление; дополнение естественно восстанавливается из предыдущего предложения.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: и Он даровал нам покой со всех сторон
  rationale: Глагол выражает дарование покоя или облегчения, а מִסָּבִיב — «кругом, со всех сторон»; упоминание врагов не добавляется, поскольку их нет в этой фразе.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: И они строили и преуспевали
  rationale: Два последовательных глагола сообщают о ходе и успешности дела. Несовершенный вид по-русски хорошо передаёт развёртывавшуюся деятельность и её благополучный результат.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, представленное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя Бога. «Яхве» непосредственно передаёт имя и не подменяет его титулом.
- issue: Смысл выражения «земля ещё перед нами»
  choice: Сохранить образное и неоднозначное выражение в основном тексте
  alternative: земля ещё свободна для нас; земля ещё в нашей власти; в стране ещё спокойно
  rationale: Еврейский оборот может указывать на открытую возможность, беспрепятственное владение или спокойное положение. Конкретизация устранила бы подлинную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повтор «мы искали» сохранены; архаизмы и конфессионально специфическая терминология не используются.
