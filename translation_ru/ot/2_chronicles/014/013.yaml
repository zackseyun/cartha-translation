  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: ru
  text: И они разгромили все города вокруг Герара, ибо ужас перед Яхве охватил их. И они разграбили все города, ибо добыча в них была велика.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: разгромили
  rationale: В военном контексте форма от נכה означает нанесение сокрушительного поражения. «Разгромили» естественно по-русски передаёт действие против городов, не вынуждая уточнять, что речь идёт только об их жителях или защитниках.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: все города вокруг Герара
  rationale: Прямой и естественный перевод пространственного оборота; «города» соответствует עָרִים в повествовании о военном походе.
- source_word: פַחַד יְהוָה
  choice: ужас от Яхве
  rationale: Здесь речь не о благоговейном страхе перед Богом, а о вызванном Яхве ужасе, охватившем города. «От Яхве» естественно выражает происхождение ужаса и сохраняет возможную связь с самим присутствием и действием Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עֲלֵיהֶם
  choice: на них напал
  rationale: Русская идиома «на них напал ужас» передаёт состояние, властно охватившее жителей упомянутых городов; местоименная отсылка в еврейском допускает соотнесение с населением городов.
- source_word: וַיָּבֹזּוּ
  choice: разграбили
  rationale: Глагол בזז в военном контексте обозначает захват имущества как добычи; «разграбили города» звучит естественно и точно.
- source_word: בִּזָּה רַבָּה
  choice: добыча была велика
  rationale: בִּזָּה обозначает военную добычу. Формулировка сохраняет различие между глаголом «разграбили» и существительным «добыча» и передаёт רַבָּה как значительный объём.
- source_word: בָהֶם
  choice: в них
  rationale: Местоимение естественно отнесено к городам, как ближайшему грамматическому антецеденту.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл выражения פַחַד יְהוָה
  choice: ужас от Яхве
  alternative: страх перед Яхве
  rationale: Контекст военного поражения указывает на сверхъестественный ужас, ниспосланный или вызванный Яхве, а не на благоговейное почитание. При этом формулировка не уточняет сверх сказанного, каким именно образом Яхве навёл этот ужас.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Использованы ясные военные термины без архаизмов; синтаксический параллелизм двух еврейских предложений в основном сохранён.
