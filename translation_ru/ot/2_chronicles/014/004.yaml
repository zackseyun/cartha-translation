base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: ru
  text: Он убрал из всех городов Иудеи высоты и жертвенники для воскурений[a], и при нём царство жило спокойно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «солнечные столбы». Еврейское слово обозначает культовые предметы, которые в некоторых контекстах могли быть связаны с почитанием солнца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Он убрал
  rationale: Порода hифиль глагола סור здесь означает устранение или удаление предметов. «Убрал» передаёт конкретное действие естественно и без добавочного оттенка официального упразднения.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: из всех городов Иудеи
  rationale: Предлог מן указывает, откуда были удалены культовые сооружения, а כל задаёт полный географический охват реформы.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: במות обозначает культовые места, часто располагавшиеся на возвышенностях. Традиционный термин «высоты» сохраняет историко-религиозное значение и не сводит их лишь к святилищам вообще.
- source_word: הַחַמָּנִים
  choice: жертвенники для воскурений
  rationale: Точное устройство и назначение חמנים остаётся спорным; термин может обозначать культовые предметы, связанные с воскурениями либо солнечным культом. Основной вариант передаёт правдоподобное культовое назначение, а альтернативное понимание отмечено в сноске.
- source_word: וַתִּשְׁקֹט
  choice: жило спокойно
  rationale: Глагол שקט означает пребывать в покое, не испытывая тревог и войн. В сочетании с «царство» выражение «жило спокойно» звучит по-русски естественно.
- source_word: הַמַּמְלָכָה
  choice: царство
  rationale: Прямое и обычное соответствие существительному ממלכה в данном повествовательном контексте.
- source_word: לְפָנָיו
  choice: при нём
  rationale: Буквально выражение означает «перед ним», но применительно к царю идиоматически указывает на время его правления или положение дел под его властью. «При нём» ясно передаёт этот смысл без лишнего истолкования.
theological_decisions:
- issue: Характер устранённых Асой культовых объектов
  choice: Представить במות и חמנים как конкретные культовые места и сооружения, не уточняя сверх необходимого их богословскую принадлежность.
  alternative: Понять חמנים исключительно как солнечные столбы или изображения, связанные с поклонением солнцу.
  rationale: Стих недвусмысленно сообщает об устранении культовых объектов, однако точная функция חמנים спорна. Основной текст не должен превращать возможную связь с солнечным культом в установленный факт.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. Слово «высоты» сохранено как устоявшийся историко-культовый термин; синтаксис сделан ясным и естественным для широкого читателя.
