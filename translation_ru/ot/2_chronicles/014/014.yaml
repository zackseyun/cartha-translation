base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: ru
  text: Они также разгромили становища скотоводов[a] и захватили множество мелкого скота[b] и верблюдов[c]. Затем они возвратились в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шатры скота»; вероятно, имеются в виду пастушеские стоянки или лагеря скотоводов.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать овец и коз вместе — мелкий домашний скот.
    reason: lexical_alternative
  - marker: c
    text: Еврейский глагол, переведённый как «захватили», обычно означает «взяли в плен»; здесь животные захвачены как добыча.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Они также
  rationale: Передаёт добавочное значение выражения и естественно связывает стих с предшествующим повествованием.
- source_word: אָהֳלֵי מִקְנֶה
  choice: становища скотоводов
  rationale: Буквально сочетание означает «шатры скота», но, вероятно, обозначает пастушеские кочевые стоянки; выбранный вариант естественен по-русски и сохраняет конкретный образ лагеря.
- source_word: הִכּוּ
  choice: разгромили
  rationale: В военном повествовании נכה может означать не только нанесение удара, но и поражение или разгром; здесь речь идёт о нападении на становища.
- source_word: וַיִּשְׁבּוּ
  choice: захватили
  rationale: Глагол שבה обычно означает «взять в плен»; применительно к животным естественно передать его как захват добычи.
- source_word: צֹאן
  choice: мелкого скота
  rationale: Собирательное צֹאן охватывает овец и коз, поэтому «мелкий скот» точнее, чем только «овцы», и остаётся понятным современному читателю.
- source_word: לָרֹב
  choice: множество
  rationale: Передаёт значение большой численности и естественно сочетается с собирательным существительным.
- source_word: וּגְמַלִּים
  choice: и верблюдов
  rationale: Прямое соответствие исходному существительному.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Затем они возвратились в Иерусалим
  rationale: «Затем» ясно передаёт последовательность повествования, выраженную формой wayyiqtol.
