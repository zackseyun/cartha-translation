base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: ru
  text: 'У Асы было войско: из Иудеи — триста тысяч воинов, вооружённых большими щитами и копьями, а из Вениамина — двести восемьдесят тысяч воинов, вооружённых щитами и натягивавших луки. Все они были доблестными воинами.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильными и храбрыми воинами». Еврейское выражение גִּבּוֹרֵי חָיִל — устойчивое обозначение сильных, доблестных бойцов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: войско
  rationale: В контексте военной переписи слово обозначает совокупность войск Асы, а не богатство или отвлечённую силу.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: вооружённых большими щитами и копьями
  rationale: Причастие указывает на оснащение воинов; צִנָּה — большой щит, что позволяет сохранить его отличие от מָגֵן далее в стихе.
- source_word: מִיהוּדָה
  choice: из Иудеи
  rationale: Предлог מִן выражает происхождение и принадлежность к соответствующему колену.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: триста тысяч
  rationale: Прямая передача числительного.
- source_word: נֹשְׂאֵי מָגֵן
  choice: вооружённых щитами
  rationale: מָגֵן обозначает щит, вероятно меньший, чем צִנָּה; отсутствие определения здесь сохраняет выраженное в еврейском тексте различие.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: натягивавших луки
  rationale: Идиома буквально описывает сгибание или натягивание лука и в данном военном контексте указывает на владеющих луком воинов; выбранная формулировка сохраняет образ исходного текста.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: двести восемьдесят тысяч
  rationale: Прямая передача числительного.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественная русская передача итоговой формулы без изменения её охвата.
- source_word: גִּבּוֹרֵי חָיִל
  choice: доблестные воины
  rationale: Устойчивое военное выражение обозначает сильных и храбрых бойцов; этот вариант естественен в современном литературном русском и сохраняет воинскую характеристику.
theological_decisions:
- issue: Мужской военный референт выражения גִּבּוֹרֵי חָיִל
  choice: доблестные воины
  alternative: сильные и храбрые люди
  rationale: Речь идёт о мужчинах-воинах в древней военной переписи. Слово «воины» естественно передаёт как мужской референт, так и военный смысл, не вводя дополнительных богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историко-повествовательным звучанием. Двоеточие и тире делают длинное перечисление ясным; повтор слова «воинов» устраняет возможную двусмысленность числительных.
