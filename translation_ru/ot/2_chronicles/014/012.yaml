  text: וַ/יִּרְדְּפֵ֨/ם אָסָ֜א וְ/הָ/עָ֣ם אֲשֶׁר עִמּ/וֹ֮ עַד לִ/גְרָר֒ וַ/יִּפֹּ֤ל מִ/כּוּשִׁים֙ לְ/אֵ֣ין לָ/הֶ֣ם מִֽחְיָ֔ה כִּֽי נִשְׁבְּר֥וּ לִ/פְנֵֽי יְהוָ֖ה וְ/לִ/פְנֵ֣י מַחֲנֵ֑/הוּ וַ/יִּשְׂא֥וּ שָׁלָ֖ל הַרְבֵּ֥ה מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: ru
  text: Аса и народ, бывший с ним, преследовали их до Герара. Столько кушитов[a] пало, что никого из них не осталось в живых, потому что они были сокрушены перед Яхве и перед его войском[b]. Аса и его люди унесли очень много добычи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть людей из Куша; традиционный вариант — «эфиопов».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед его станом». Еврейское слово может означать «стан» или «войско»; «его» может относиться к Асе, хотя возможно и отнесение к Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: преследовали их
  rationale: Глагол רדף обозначает преследование противника; выбран обычный русский военный оборот.
- source_word: עַד לִגְרָר
  choice: до Герара
  rationale: Предлог עַד указывает на предел преследования; «до Герара» естественно и точно передаёт пространственное значение.
- source_word: מִכּוּשִׁים
  choice: кушитов
  rationale: Этноним כּוּשִׁים прямо обозначает жителей или народ Куша; это точнее традиционного, но потенциально анахроничного «эфиопы».
- source_word: וַיִּפֹּל מִכּוּשִׁים לְאֵין לָהֶם מִחְיָה
  choice: Кушитов пало столько, что никого из них не осталось в живых
  rationale: Сочетание נפל с מן описывает потери среди кушитов, а последующее выражение сообщает об отсутствии уцелевших. Русская конструкция естественно связывает обе части, не ослабляя полноту разгрома.
- source_word: נִשְׁבְּרוּ
  choice: были сокрушены
  rationale: Страдательная форма שבר здесь передаёт полный военный разгром; «сокрушены» сохраняет образ и торжественный повествовательный тон.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: לִפְנֵי буквально означает «перед/пред», а имя יהוה передано как «Яхве», то есть как личное имя Бога, а не как титул.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: и пред его войском
  rationale: מַחֲנֶה может означать как стан, так и действующее войско. В контексте преследования «войско» звучит естественнее; местоимение «его» сохраняет неоднозначность еврейского суффикса.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: унесли очень много добычи
  rationale: נשא со שׁלל означает унести захваченную добычу, а הַרְבֵּה מְאֹד подчёркивает её чрезвычайное изобилие. Русская фраза ясна и не архаична.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» отличает имя от титула и соответствует принятому для данного издания подходу.
- issue: К кому относится суффикс «его» в מַחֲנֵהוּ
  choice: Сохранить в основном тексте неоднозначное «его войском»
  alternative: «войском Асы»; «войском Яхве»; «его станом»
  rationale: Еврейская форма сама по себе не называет обладателя. По ходу повествования вероятно войско Асы, однако ближайшим названным лицом является Яхве, поэтому явное уточнение неоправданно устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «пред» выбрана ради достоинства и ритмического параллелизма, без чрезмерной архаизации. В последнем предложении подлежащее раскрыто как «Аса и его люди», чтобы избежать неясного русского «они» после упоминания погибших кушитов.
