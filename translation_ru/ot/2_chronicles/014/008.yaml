base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: ru
  text: Зерах, кушитянин[b], выступил против них с войском численностью в тысячу тысяч[a] и с тремястами колесницами; он дошёл до Мареши.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один миллион». Буквально в еврейском тексте: «тысяча тысяч».'
    reason: lexical_alternative
  - marker: b
    text: «Кушитянин» — еврейское этногеографическое обозначение; традиционный перевод — «эфиоп».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: выступил против них
  rationale: В военном контексте יצא обозначает выступление в поход или на битву, а אֲלֵיהֶם имеет значение враждебного движения против них.
- source_word: זֶרַח הַכּוּשִׁי
  choice: Зерах, кушитянин
  rationale: Передаёт имя транслитерацией, а этногеографическое כּוּשִׁי — прямым русским соответствием, не отождествляя Куш с современной Эфиопией.
- source_word: בְּחַיִל
  choice: с войском
  rationale: В данном повествовании חַיִל означает военную силу, то есть войско.
- source_word: אֶלֶף אֲלָפִים
  choice: в тысячу тысяч
  rationale: Сохраняет буквальную и необычную форму еврейского выражения, не устраняя возможную неопределённость между точным арифметическим числом и обозначением огромного множества.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: и с тремястами колесницами
  rationale: Естественная русская передача числового оборота; повтор предлога ясно связывает колесницы с составом войска.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: он дошёл до Мареши
  rationale: Глагол движения с עַד указывает на достижение предела у названного места; «дошёл до» естественно сохраняет этот оттенок.
