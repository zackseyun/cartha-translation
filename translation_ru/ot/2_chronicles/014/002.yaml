base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: ru
  text: Он убрал иноземные жертвенники и святилища на высотах, разбил священные каменные столбы и срубил ашеры[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть культовые предметы, связанные с почитанием богини Ашеры; возможно, деревянные столбы или священные деревья.
    reason: Сохраняет неопределённость точного значения древнееврейского אֲשֵׁרִים и одновременно делает термин понятным современному читателю.
lexical_decisions:
- source_word: וַיָּסַר
  choice: Он убрал
  rationale: Каузативная форма глагола סור означает «удалить, убрать». «Убрал» естественно передаёт конкретное действие, не добавляя смысла официального упразднения.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: жертвенники чужих богов
  rationale: Буквально речь идёт о «чужих/иноземных жертвенниках»; в контексте религиозной реформы имеются в виду жертвенники чужого культа. Такой перевод понятен современному читателю и не создаёт ложного впечатления, будто речь лишь о принадлежности жертвенников иностранцам.
- source_word: הַבָּמוֹת
  choice: святилища на высотах
  rationale: במות обозначает культовые места, часто располагавшиеся на возвышенностях. Перевод передаёт и религиозную функцию, и пространственный образ, оставаясь понятнее буквального «высоты».
- source_word: וַיְשַׁבֵּר
  choice: разбил
  rationale: Глагол שׁבר выражает решительное физическое разрушение; «разбил» кратко и естественно передаёт это действие.
- source_word: הַמַּצֵּבוֹת
  choice: священные каменные столбы
  rationale: מַצֵּבוֹת — установленные культовые камни или столбы. Формулировка указывает на их религиозную функцию и отличает их от деревянных культовых предметов, названных далее.
- source_word: וַיְגַדַּע
  choice: срубил
  rationale: גדע означает срезать или срубать; этот русский глагол естественно указывает на разрушение предметов из дерева.
- source_word: הָאֲשֵׁרִים
  choice: ашеры[a]
  rationale: Множественное число אֲשֵׁרִים обозначает культовые предметы, связанные с почитанием Ашеры, но их точный вид неясен. Транслитерация сохраняет историческую специфику и неопределённость, а сноска поясняет значение.
theological_decisions:
- issue: Значение אֲשֵׁרִים в рассказе об уничтожении предметов чужого культа
  choice: ашеры
  alternative: столбы Ашеры; священные деревья Ашеры
  rationale: Неясно, обозначает ли слово деревянные столбы, стилизованные деревья, сами деревья или более широкий класс культовых символов Ашеры. Основной текст не сужает значение без достаточных оснований; возможные референты пояснены в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной, энергичной последовательностью действий. Специальный термин «ашеры» сохранён ради точности и снабжён кратким пояснением; архаичные «капища», «истуканы» и неясное в данном значении «высоты» не используются.
