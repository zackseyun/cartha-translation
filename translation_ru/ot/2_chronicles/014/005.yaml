base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: ru
  text: Он построил укреплённые города в Иудее, потому что в стране было спокойно и в те годы у него не было войны[a], так как Яхве даровал ему покой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ним не было войны». Еврейское выражение может обозначать отсутствие войны, в которую был вовлечён Аса, либо отсутствие войны против него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он построил
  rationale: Форма wayyiqtol от בנה продолжает историческое повествование. Начальный союз в русском можно опустить ради естественного повествовательного стиля.
- source_word: עָרֵי מְצוּרָה
  choice: укреплённые города
  rationale: Сочетание обозначает города, снабжённые оборонительными укреплениями; это естественный и точный русский эквивалент.
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Предлог בְּ имеет здесь местное значение, а יהודה обозначает территорию Иудеи.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: земля была спокойна
  rationale: שׁקט выражает спокойствие и отсутствие потрясений. Формулировка сохраняет образ земли, пребывающей в покое, не сводя его исключительно к политическому миру.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: у него не было войны
  rationale: Еврейская конструкция допускает общее указание на отсутствие войны, в которую был бы вовлечён Аса. Русская формулировка сохраняет эту широту; более направленное понимание отмечено в сноске.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: в те годы
  rationale: В русском историческом повествовании указательное выражение естественно передаёт упомянутый период.
- source_word: הֵנִיחַ ... לוֹ
  choice: даровал ему покой
  rationale: Hiphil от נוח означает дать или обеспечить покой, особенно избавление от военных тревог. «Даровал» естественно передаёт действие Бога, не добавляя иной причины покоя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени, представленного тетраграмматоном, а не замена его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Связь покоя с Божьим действием
  choice: так как Яхве даровал ему покой
  alternative: потому что Господь дал ему мир
  rationale: Сохранена явная причинная связь כִּי и мотив дарованного Богом покоя, при этом הֵנִיחַ не сужается до одного лишь понятия мира.
translation_notes:
  register: Современный литературный русский язык с ясным историко-повествовательным синтаксисом. Сохранены повторяющиеся причинные связи и различие между спокойствием земли и покоем, дарованным Асe.
