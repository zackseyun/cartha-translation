  text: וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/לַ/עֲשׂ֖וֹת הַ/תּוֹרָ֥ה וְ/הַ/מִּצְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: ru
  text: И велел он Иуде искать Господа, Бога их предков, и исполнять закон и заповедь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְרוֹשׁ
  choice: искать
  rationale: Передаёт целенаправленное обращение к Богу и стремление следовать Его воле, сохраняя широкий смысл еврейского глагола.
- source_word: יְהוָה
  choice: Господа
  rationale: Традиционная русская передача тетраграмматона, естественная для библейского регистра.
- source_word: אֲבוֹתֵיהֶם
  choice: их предков
  rationale: В данном контексте речь идёт о предшествующих поколениях народа; «предков» ясно и естественно в современном русском языке.
- source_word: לַעֲשׂוֹת
  choice: исполнять
  rationale: В сочетании с законом и заповедью означает поступать согласно им; «исполнять» является естественным русским соответствием.
- source_word: הַתּוֹרָה וְהַמִּצְוָה
  choice: закон и заповедь
  rationale: Сохраняет единственное число и различие двух еврейских понятий без их преждевременного объединения.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана укоренённая русская библейская традиция; богословский референт остаётся однозначным, а отдельная сноска для этого стиха не требуется.
- issue: Соотношение «закона» и «заповеди»
  choice: Сохранить оба существительных в единственном числе
  alternative: «закон и заповеди» или обобщённое «повеления закона»
  rationale: Формально различённая еврейская пара допускает смысловое перекрытие, поэтому перевод не устраняет присущую тексту напряжённость.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Инверсия «И велел он Иуде» сохраняет связь с предшествующим повествованием, оставаясь понятной современному читателю.
