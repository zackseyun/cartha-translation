base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: ru
  text: Амасия, сын Иоаса, царь Иудеи, жил ещё пятнадцать лет после смерти Иоаса, сына Иоахаза, царя Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: Форма глагола חיה сообщает, что Амасия продолжал жить в течение указанного срока. «Прожил» естественно звучит в русском хронологическом сообщении и не усиливает смысл до более толковательного «пережил».
- source_word: אֲמַצְיָהוּ
  choice: Амасия
  rationale: Традиционная и узнаваемая русская передача библейского имени.
- source_word: בֶן יוֹאָשׁ
  choice: сын Иоаса
  rationale: Естественная русская передача родословного обозначения; имя передано в принятой библейской форме.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Точная и естественная передача сочетания, обозначающего царскую власть над Иудеей.
- source_word: אַחֲרֵי מוֹת
  choice: после смерти
  rationale: Сохраняет именную конструкцию еврейского текста и ясно выражает временную последовательность.
- source_word: יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Иоаса, сына Иоахаза
  rationale: Имена переданы в традиционных русских библейских формах; родословное уточнение отличает этого Иоаса от отца Амасии.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямая и привычная русская передача царского титула.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: ещё пятнадцать лет
  rationale: «Пятнадцать лет» точно передаёт числительное; «ещё» естественно выражает по-русски продолжение жизни после названного события, не меняя хронологии.
