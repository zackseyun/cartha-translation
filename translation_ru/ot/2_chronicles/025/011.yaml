  text: וַ/אֲמַצְיָ֨הוּ֙ הִתְחַזַּ֔ק וַ/יִּנְהַג֙ אֶת עַמּ֔/וֹ וַ/יֵּ֖לֶךְ גֵּ֣יא הַמֶּ֑לַח וַ/יַּ֥ךְ אֶת בְּנֵי שֵׂעִ֖יר עֲשֶׂ֥רֶת אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: ru
  text: Амасия же укрепился, повёл свой народ и пришёл в Соляную долину, где сразил десять тысяч сынов Сеира[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жителей Сеира»; «потомков Сеира». Буквально: «сынов Сеира» — этногенеалогическое обозначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: укрепился
  rationale: 'Возвратная форма передаёт значение хитпаэля: Амасия сделал себя сильным или набрался сил, не сводя смысл только к храбрости.'
- source_word: וַיִּנְהַג אֶת עַמּוֹ
  choice: повёл свой народ
  rationale: В военном контексте נהג означает вести или направлять; русский вариант естественен и не добавляет не выраженных в тексте деталей о построении войска.
- source_word: גֵּיא הַמֶּלַח
  choice: Соляная долина
  rationale: Прямо передаёт составное географическое название; прописная буква обозначает топоним.
- source_word: וַיַּךְ
  choice: сразил
  rationale: נכה может означать поразить, разбить или убить. «Сразил» подходит военному контексту и сохраняет некоторую широту значения.
- source_word: בְּנֵי שֵׂעִיר
  choice: сынов Сеира
  rationale: Сохранено буквальное этногенеалогическое выражение оригинала; его смысл пояснён в сноске.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: десять тысяч
  rationale: Стандартная и точная передача числительного.
- source_word: וַאֲמַצְיָהוּ
  choice: Амасия же
  rationale: Частица «же» естественно продолжает русское повествование, передавая связность, выраженную союзом waw.
