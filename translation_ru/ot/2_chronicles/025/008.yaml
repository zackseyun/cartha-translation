base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: ru
  text: Но если ты всё же пойдёшь, действуй решительно в битве[a] — Бог приведёт тебя к падению перед врагом[b], ведь у Бога есть сила и помочь, и привести к падению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь силён для битвы» или «покажи себя сильным в битве».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте повторён тот же глагол: у Бога есть сила как «помочь», так и «привести к падению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Но если
  rationale: Сочетание частиц вводит условное противопоставление предыдущему наставлению; «но если» естественно передаёт обе функции.
- source_word: בֹּא אַתָּה
  choice: ты всё же пойдёшь
  rationale: Личное местоимение подчёркивает субъект, а «всё же» передаёт настойчивое решение идти вопреки предостережению.
- source_word: עֲשֵׂה חֲזַק
  choice: действуй решительно
  rationale: Буквально необычное сочетание «делай — будь силён» в военном контексте выражает призыв проявить силу и решимость; выбран естественный русский эквивалент без добавочного толкования.
- source_word: לַמִּלְחָמָה
  choice: в битве
  rationale: Предлог может обозначать цель или сферу действия; в данном контексте естественно «в битве».
- source_word: יַכְשִׁילְךָ
  choice: даст тебе пасть
  rationale: Каузатив от כשל означает «заставить споткнуться/пасть». Выражение «даст тебе пасть» сохраняет прямую причинную роль Бога и естественно звучит в описании военного поражения.
- source_word: לִפְנֵי אוֹיֵב
  choice: перед врагом
  rationale: 'Передано близко к форме и смыслу древнееврейского выражения: падение произойдёт перед лицом неприятеля.'
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: у Бога есть сила
  rationale: Естественная русская передача конструкции существования, сохраняющая акцент на Божьей силе.
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: и помочь, и дать пасть
  rationale: Парная конструкция подчёркивает две противоположные возможности; повтор «дать пасть» сохраняет связь с тем же древнееврейским корнем выше.
theological_decisions:
- issue: Прямое участие Бога в военном поражении
  choice: Бог даст тебе пасть
  alternative: Бог допустит твоё поражение
  rationale: Древнееврейский каузатив прямо приписывает Богу действие, приводящее к падению. Перевод не смягчает эту богословскую напряжённость до простого допущения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Даст тебе пасть» сохраняет военную образность, прямую Божью причинность и лексический повтор, не прибегая к менее естественному в данном контексте «заставит споткнуться».
