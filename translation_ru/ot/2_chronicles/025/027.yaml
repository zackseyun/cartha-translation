source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ת אֲשֶׁר סָ֤ר אֲמַצְיָ֨הוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִיתֻ֖/הוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: ru
  text: С того времени, как Амасия перестал следовать за Яхве[a], в Иерусалиме против него составили заговор. Он бежал в Лахиш, но за ним послали в Лахиш и там умертвили его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отступил от следования за Яхве»; еврейская идиома означает, что он перестал следовать за Яхве.'
    reason: Пояснение исходной идиомы и её буквального образа.
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: С того времени, как
  rationale: Естественно передаёт начальную временную точку, с которой начались последующие события; начальный союз וּ отдельно не выражен, поскольку связь ясна из конструкции.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: перестал следовать за Яхве
  rationale: Передаёт еврейскую идиому религиозного отступления без неестественного буквального оборота «отступил от следования за».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: против него составили заговор
  rationale: Естественная русская передача сочетания однокоренных глагола и существительного со значением организации заговора; участники в еврейском тексте не названы.
- source_word: וַיָּנָס לָכִישָׁה
  choice: Он бежал в Лахиш
  rationale: Передаёт бегство от опасности и направительное окончание при названии города.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: но за ним послали в Лахиш
  rationale: Сохраняет неопределённость относительно посланных лиц и передаёт противопоставление между бегством Амасии и последовавшей погоней.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: и там умертвили его
  rationale: Каузативная форма מות указывает на преднамеренное лишение жизни; «умертвили» сохраняет этот оттенок и отсылку שָׁם к Лахишу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер поступка Амасии
  choice: перестал следовать за Яхве
  alternative: отступил от Яхве
  rationale: Выбранный вариант сохраняет образ следования, присутствующий в еврейской идиоме, и ясно показывает религиозное отступление, не уточняя его сверх текста.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и сдержанным достоинством. Неопределённые участники заговора и посланные преследователи не конкретизированы, поскольку исходный текст их не называет; топоним передан как «Лахиш», близко к еврейской форме.
