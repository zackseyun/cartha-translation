revisions:
- from: После того как Амасия вернулся с разгрома эдомитян, он принёс богов сынов Сеира[a], поставил их себе как богов, поклонялся им[b] и воскурял им благовония.
  to: После того как Амасия вернулся, нанеся поражение эдомитянам, он принёс богов сынов Сеира[a], поставил их себе в боги, поклонялся им[b] и воскурял им благовония.
  rationale: Исправлены две неестественные формулировки без изменения последовательности событий или богословского смысла. «Нанеся поражение» точнее передаёт נכה в военном контексте, а «поставил себе в боги» является естественным русским соответствием выражения «установил их себе как богов».
  reviewer_model: gpt-5.6-terra
