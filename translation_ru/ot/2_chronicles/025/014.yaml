base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: ru
  text: После того как Амасия вернулся, нанеся поражение эдомитянам, он принёс богов сынов Сеира[a], поставил их себе в боги, поклонялся им[b] и воскурял им благовония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богов народа Сеира». Буквально: «богов сынов Сеира».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «падал перед ними ниц».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: После того как ... вернулся
  rationale: Естественно передаёт временную последовательность и подразумеваемое возвращение Амасии после похода; отдельное «и было» в современном русском здесь избыточно.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: с разгрома эдомитян
  rationale: Глагол נכה обозначает нанесение удара или поражения; «разгром» сохраняет военный смысл, не утверждая полного истребления.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: богов сынов Сеира
  rationale: Сохраняет множественное число אֱלֹהֵי и формальное родственное выражение בְּנֵי שֵׂעִיר; более идиоматический вариант дан в сноске.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: поставил их себе как богов
  rationale: Передаёт и физическое установление культовых изображений, и принятие их в качестве собственных богов.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: поклонялся им
  rationale: Естественное русское выражение для культового поклонения; буквальный телесный жест указан в сноске.
- source_word: וְלָהֶם יְקַטֵּר
  choice: воскурял им благовония
  rationale: Точно передаёт культовое значение Piel קטר — сжигать благовония или курение перед божеством.
theological_decisions:
- issue: Передача אֱלֹהֵי применительно к языческим божествам
  choice: боги
  alternative: божества
  rationale: Контекст говорит о богах Сеира, которых Амасия принимает как объекты поклонения; «боги» прямо сохраняет смысл и повествовательную иронию.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён без потери последовательности действий; сохранены культовые термины и формальное выражение «сыны Сеира».
