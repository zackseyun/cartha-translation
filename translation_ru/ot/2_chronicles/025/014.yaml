  verdict: revise
  source_fidelity: Временная конструкция и последовательность действий переданы верно; «вернулся» оправдано контекстом похода, хотя בוא буквально означает «пришёл». Однако «разгром» несколько сильнее, чем נכה («поразить, нанести поражение»), а «поставил их себе как богов» неестественно по-русски.
