  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: ru
  text: Когда царская власть прочно утвердилась за ним[a], он убил своих слуг, которые поразили царя, его отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «когда царство прочно утвердилось над ним»; здесь речь об упрочении царской власти.'
    reason: 'Лексическая альтернатива: הַמַּמְלָכָה может означать «царство», «царствование» или «царская власть», а עָלָיו буквально означает «над ним» и в данном контексте выражает закрепление власти за царём.'
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Повествовательная формула вводит следующее событие; в современном русском достаточно естественного временного союза без добавления слова «теперь».
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: царство прочно утвердилось в его руках
  rationale: Оборот описывает упрочение царской власти и контроля. Русская метафора «в его руках» естественно передаёт значение власти, сохраняя образность исходного выражения.
- source_word: וַיַּהֲרֹג
  choice: он убил
  rationale: Прямой, современный и стилистически весомый эквивалент глагола הרג.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: В придворном контексте речь идёт о людях на царской службе; «слуги» сохраняет широту значения, не уточняя без достаточных оснований их должностной или рабской статус.
- source_word: הַמַּכִּים
  choice: которые поразили
  rationale: Причастие обозначает виновников смертельного нападения. «Поразили» сохраняет оттенок נכה и избегает близкого повтора «убил… убили».
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: его отца, царя
  rationale: 'Такой порядок естественен для современного русского и передаёт приложение: убитый отец Амасии был царём.'
