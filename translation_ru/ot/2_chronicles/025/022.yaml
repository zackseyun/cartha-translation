  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: ru
  text: Иудея потерпела поражение от Израиля, и каждый бежал к своему шатру.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
