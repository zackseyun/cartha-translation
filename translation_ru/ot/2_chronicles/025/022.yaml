lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: потерпела поражение
  rationale: Нифаль глагола נָגַף в военном контексте означает быть побеждённым; выражение естественно для современного русского повествования.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Название южного царства передано в принятой русской библейской форме.
- source_word: לִפְנֵי
  choice: от
  rationale: В контексте сражения сочетание указывает, от чьих рук было понесено поражение; русский оборот «потерпеть поражение от» естественно передаёт этот смысл.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Название северного царства передано в принятой русской библейской форме.
- source_word: וַיָּנֻסוּ
  choice: бежал
  rationale: Глагол נוּס означает бегство; единственное число согласовано с распределительным אִישׁ.
- source_word: אִישׁ
  choice: каждый
  rationale: Распределительное употребление существительного передаёт действие каждого отдельного воина; в русском «каждый» звучит естественно и сохраняет индивидуализирующий смысл.
- source_word: לְאֹהָלָיו
  choice: к своему шатру
  rationale: Сохранён буквальный образ шатра и возвратное притяжательное значение; выражение в данном контексте обозначает рассеяние и отступление каждого к своему месту.
