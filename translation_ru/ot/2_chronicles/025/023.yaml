  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: ru
  text: Иоас, царь Израиля, захватил в Беф-Шемеше Амасию, царя Иудеи, сына Иоаса, сына Иоахаза, и привёл его в Иерусалим. Затем он проломил Иерусалимскую стену от Ефремовых ворот до Угловых ворот[a], протяжённостью в четыреста локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до ворот, которые поворачивают (или: обращены)». Перевод «Угловые ворота» основан на вероятном отождествлении с воротами в параллельном повествовании 4 Царств 14:13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: захватил
  rationale: Глагол обозначает овладение человеком и взятие его под стражу; «захватил» естественно передаёт военный контекст, не добавляя прямо отсутствующего в тексте слова «плен».
- source_word: בְּבֵית שָׁמֶשׁ
  choice: в Беф-Шемеше
  rationale: Предлог ב указывает на место захвата. Название передано транслитерацией, близкой к еврейской форме и понятной в современном русском тексте.
- source_word: וַיְבִיאֵהוּ
  choice: и привёл его
  rationale: Каузативная форма בוא означает «привести/доставить». В отношении пленённого человека «привёл» звучит естественно и не уточняет способ передвижения.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: проломил Иерусалимскую стену
  rationale: פרץ применительно к стене означает сделать пролом или разрушить её участок. «Проломил» сохраняет конкретный образ исходного текста и не предполагает разрушения всей стены.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: от Ефремовых ворот до Угловых ворот[a]
  rationale: Первое название естественно передано как «Ефремовы ворота». «Угловые ворота» следует вероятному отождествлению с воротами в параллельном повествовании 4 Царств 14:13; буквальная неоднозначность הַפּוֹנֶה сохранена в сноске.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: на четыреста локтей
  rationale: Исходный текст прямо называет меру без отдельного слова «длиной». Предлог «на» естественно связывает меру с протяжённостью пролома, а «локоть» сохраняет древнюю единицу.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: сына Иоаса, сына Иоахаза
  rationale: Последовательность двух поколений сохранена без сглаживания или отождествления имён.
