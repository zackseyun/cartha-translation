  text: И нанял он из Израиля сто тысяч доблестных воинов[a] за сто талантов серебра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучих воинов». Еврейское выражение обозначает сильных, способных к сражению воинов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: и нанял он
  rationale: Глагол שׂכר в породе каль означает наём за плату. Такой перевод прямо передаёт смысл, не добавляя более узкого понятия «наёмники».
- source_word: מִיִּשְׂרָאֵל
  choice: в Израиле
  rationale: Предлог מן указывает на источник, то есть воинов наняли среди жителей северного царства. По-русски в данном контексте естественно сказать «нанял в Израиле».
- source_word: מֵאָה אֶלֶף
  choice: сто тысяч
  rationale: Прямой перевод количественного числительного.
- source_word: גִּבּוֹר חָיִל
  choice: доблестных воинов
  rationale: Устойчивое еврейское сочетание обозначает сильных, способных и храбрых воинов. Выбор сохраняет военный смысл и звучит естественно в современном литературном русском языке.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: за сто талантов серебра
  rationale: Предлог ב выражает цену найма. Древняя единица веса и стоимости сохранена без приблизительного пересчёта.
