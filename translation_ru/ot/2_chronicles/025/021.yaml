base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: ru
  text: Иоас, царь Израиля, выступил, и он с Амасией, царём Иудеи, встретились лицом к лицу[a] в Бет-Шемеше, принадлежавшем Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидели лица [друг друга]»; также возможно: «предстали друг перед другом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: выступил
  rationale: Глагол עלה буквально обозначает движение вверх, но в данном повествовательном и военном контексте речь идёт о выступлении Иоаса навстречу противнику. «Выступил» естественно передаёт движение войска, не добавляя более конкретных деталей боя.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: сошлись лицом к лицу
  rationale: Взаимная форма глагола ראה с существительным «лица» описывает встречу лицом к лицу; в контексте предстоящего сражения оборот имеет оттенок противостояния. Русское выражение сохраняет и образность, и напряжённость контекста.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: они с Амасией
  rationale: Еврейская конструкция буквально означает «он и Амасия». По-русски «они с Амасией» естественно сохраняет Иоаса как уже названного субъекта и ясно обозначает обе стороны встречи.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: в Бет-Шемеше
  rationale: Предлог ב обозначает место встречи. Название передано современной транслитерацией, отражающей еврейскую форму בית שמש.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: принадлежавшем Иудее
  rationale: Предлог ל выражает территориальную принадлежность. Причастная конструкция по-русски кратко и ясно уточняет, что этот Бет-Шемеш находился на территории Иудеи.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: царь Израиля / царь Иудеи
  rationale: Царские титулы переданы прямо и в традиционной для русского библейского языка форме.
