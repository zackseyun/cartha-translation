  text: וַ/יִּשְׁלַ֞ח יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: ru
  text: 'И послал Иоас, царь Израиля, к Амасии, царю Иудеи, сказать: «Колючий куст[a], что на Ливане, послал к кедру, что на Ливане, сказать: „Отдай свою дочь моему сыну в жёны“. Тогда дикий зверь, который был на Ливане, прошёл мимо и растоптал колючий куст».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чертополох»; еврейское слово означает колючее растение, точный вид которого неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: колючий куст
  rationale: Еврейское слово обозначает колючее растение неустановленного вида. «Колючий куст» естественно по-русски передаёт образ низкого растения и сохраняет контраст с могучим кедром.
- source_word: הָאֶרֶז
  choice: кедр
  rationale: Прямое соответствие еврейскому названию кедра; образ передаёт высоту и силу.
- source_word: בַּלְּבָנוֹן
  choice: на Ливане
  rationale: Традиционное и естественное русское обозначение местности горного Ливана в данном образном рассказе.
- source_word: שָׁלַח ... לֵאמֹר
  choice: послал ... сказать
  rationale: Сохраняет повторяющуюся формулу оригинала и её несколько торжественный повествовательный строй.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Отдай свою дочь моему сыну в жёны
  rationale: Ясно и естественно передаёт формулу предложения брачного союза.
- source_word: חַיַּת הַשָּׂדֶה
  choice: полевой зверь
  rationale: Сохраняет родовую и возвышенную формулировку еврейского сочетания, не уточняя вид животного.
- source_word: וַתַּעֲבֹר
  choice: прошёл мимо
  rationale: Передаёт попутное движение зверя, подчёркивающее незначительность куста.
- source_word: וַתִּרְמֹס
  choice: растоптал
  rationale: Кратко и наглядно передаёт попрание ногами.
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: И послал ... к ... сказать
  rationale: Формально и понятно отражает вводную посыльную формулу; подразумевается отправка вести или посланника.
theological_decisions:
- issue: Связь последнего предложения притчи с предыдущим
  choice: Но прошёл мимо
  alternative: И прошёл мимо / Тогда прошёл мимо
  rationale: Простой еврейский союз допускает последовательное «и», однако по смыслу неожиданный исход противопоставлен притязанию куста; «но» естественно выражает этот поворот, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксический повтор оригинала сохранён, но формы имён и выражение «в жёны» даны естественно для современного читателя.
