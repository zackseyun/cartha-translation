    rationale: Сноска a стоит после «became king», но поясняет буквально возрастной оборот; сноска b стоит после имени Jehoaddan, но поясняет вариант перевода «became king / began to reign». В русском тексте сносок нет, поэтому это не затрагивает его содержание или структуру, но английский след решений нуждается в исправлении отдельно.
  revised_text: Амасии было двадцать пять лет, когда он стал царём, и двадцать девять лет он царствовал в Иерусалиме. Его мать звали Иегоаддан; она была из Иерусалима.
