base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: ru
  text: Амасии было двадцать пять лет, когда он стал царём, и двадцать девять лет он царствовал в Иерусалиме. Его мать звали Иегоаддан; она была из Иерусалима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: было двадцать пять лет
  rationale: Стандартный древнееврейский оборот для указания возраста; по-русски естественно передаётся конструкцией «было двадцать пять лет».
- source_word: מָלַךְ
  choice: стал царём
  rationale: Первое употребление глагола в формуле возраста обозначает восшествие на престол.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: двадцать девять лет он царствовал
  rationale: Фраза указывает продолжительность правления; «царствовал» точно и естественно передаёт значение глагола в данном контексте.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог בְּ имеет здесь обычное локативное значение.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная современная русская передача древнееврейской именной конструкции без потери смысла.
- source_word: יְהוֹעַדָּן
  choice: Иегоаддан
  rationale: Имя передано транслитерацией с учётом формы יהו и удвоения согласного ד.
- source_word: מִירוּשָׁלָיִם
  choice: она была из Иерусалима
  rationale: Предлог מִן обозначает происхождение; добавленное местоимение делает связь с матерью ясной и естественной по-русски.
