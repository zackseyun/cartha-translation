base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: ru
  text: А воины из отряда, которых Амасия отослал назад, не взяв с собой на войну, совершили набег на города Иудеи — от Самарии до Бет-Хорона[a], поразили три тысячи из них и захватили большую добычу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение указывает на географические пределы набега; возможно также понимание: «от Самарии вплоть до Бет-Хорона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: воины из отряда
  rationale: Буквально «сыновья отряда»; это еврейское идиоматическое обозначение членов военного отряда. Выбран естественный для современного русского языка эквивалент.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: которых Амасия отослал назад
  rationale: Порода hифиль глагола שוב означает «заставить вернуться, возвратить». Формулировка передаёт действие Амасии без добавления невыраженного указания «домой».
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: и не позволил им идти с собой на войну
  rationale: Конструкция указывает, что возвращение не дало отряду сопровождать Амасию в походе; развернутая русская формулировка ясно передаёт эту связь.
- source_word: וַיִּפְשְׁטוּ
  choice: совершили набег
  rationale: В военном контексте פשט обозначает нападение или набег, а не только последующее разграбление.
- source_word: בְּעָרֵי יְהוּדָה
  choice: на города Иудеи
  rationale: עָרִים может обозначать города или поселения; «города» сохраняет обычный библейский географический регистр.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: от Самарии до Бет-Хорона
  rationale: Конструкция מן... ועד отмечает географические пределы набега. Топонимы переданы в привычной русской форме.
- source_word: וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים
  choice: убили три тысячи жителей
  rationale: נכה буквально имеет более широкий смысл «поразить», но в сочетании с числом жертв военного нападения здесь естественно и контекстуально означает убийство. «Жителей» проясняет местоименную отсылку к населению названных городов.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: захватили большую добычу
  rationale: Однокоренная конструкция усиливает идею разграбления; естественная русская формулировка сохраняет и действие, и указание на значительный объём добычи.
