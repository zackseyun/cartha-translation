  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: ru
  text: 'Но к нему пришёл человек Божий и сказал: «Царь, пусть войско Израиля не идёт с тобой, ведь Яхве не с Израилем, то есть со всеми сынами Ефрема[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все сыны Ефрема»; или: «все ефремляне».'
    reason: Лексическая альтернатива поясняет родовое древнееврейское выражение современным этнонимом.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое библейское обозначение посланника, уполномоченного Богом; отсутствие артикля естественно передано без указательного оттенка.
- source_word: בָּא אֵלָיו
  choice: к нему пришёл
  rationale: בוא с אֶל обозначает движение к человеку; русский порядок слов сохраняет связку с предшествующим противительным союзом.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Стандартная древнееврейская формула введения прямой речи естественно передана личной глагольной формой.
- source_word: הַמֶּלֶךְ
  choice: Царь
  rationale: Артиклированное существительное употреблено как обращение; в современном русском отдельная частица вроде «о» не требуется.
- source_word: אַל יָבֹא עִמְּךָ
  choice: пусть … не идёт с тобой
  rationale: Запретительная конструкция с אַל передана через «пусть не»; в контексте военного похода русское «идёт с тобой» естественнее буквального «приходит с тобой».
- source_word: צְבָא יִשְׂרָאֵל
  choice: войско Израиля
  rationale: צָבָא здесь означает военную силу; «войско» соответствует историческому контексту и литературному регистру.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: ведь Яхве не с Израилем
  rationale: כִּי вводит основание запрета; конструкция «быть с» сохранена как значимое указание на Божье присутствие и поддержку.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: со всеми сынами Ефрема
  rationale: Эллиптически продолжена конструкция с עִם; родовое обозначение сохранено в тексте, а современный этноним дан в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה; транслитерация «Яхве» отличает его от титула «Господь» и не вводит конфессионально обусловленную замену.
- issue: Значение формулы «Яхве не с Израилем»
  choice: сохранить формулу без поясняющей перифразы
  alternative: «Яхве не поддержит Израиль»
  rationale: Буквальная конструкция может включать присутствие, благоволение и военную поддержку; перевод не сужает её до одного толкования.
- issue: Связь «Израиля» и «сынов Ефрема»
  choice: передать вторую фразу как уточняющее продолжение после тире
  alternative: «то есть со всеми ефремлянами»
  rationale: Так сохраняются и приложение/уточнение, и эллиптическое продолжение предлога, не устраняя полностью синтаксическую напряжённость древнееврейского текста.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Прямая речь звучит естественно; архаизмы вроде «о царь» и «да не идёт» не используются. Тире обозначает уточняющую связь заключительной фразы с «Израилем».
