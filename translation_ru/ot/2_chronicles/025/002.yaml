source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה רַ֕ק לֹ֖א בְּ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: ru
  text: Он делал то, что было правильно в глазах Яхве, однако не от всего сердца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не с полным (или цельным) сердцем»; речь идёт о неполной преданности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он делал
  rationale: Форма с последовательным waw продолжает повествование и здесь обобщает поступки царя; в современном русском начальное «и» необязательно.
- source_word: הַיָּשָׁר
  choice: то, что было правильно
  rationale: Субстантивированное прилагательное обозначает «правильное, правое». Такая передача естественна по-русски и сохраняет нравственную оценку, не усиливая её до безусловной характеристики самого царя как праведника.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён прозрачный древнееврейский образ оценки с точки зрения Бога; личное имя יהוה передано как «Яхве».
- source_word: רַק
  choice: однако
  rationale: Здесь частица ограничивает предшествующую положительную оценку и имеет противительный оттенок.
- source_word: בְּלֵבָב שָׁלֵם
  choice: не от всего сердца
  rationale: Естественное русское выражение передаёт неполноту внутренней преданности. Более буквальное «не с полным/цельным сердцем» сохранено в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Характер преданности Амасии
  choice: не от всего сердца
  alternative: не с совершенным сердцем; не вполне искренне
  rationale: Формулировка сохраняет напряжение между внешне правильными поступками и неполнотой внутренней преданности, не приписывая царю прямо ни лицемерия, ни требования безгрешного совершенства.
translation_notes:
  register: Современный литературный русский язык; сохранён образ «в глазах Яхве», а идиома о сердце передана естественным русским выражением. Маркер примечания поставлен при выражении, которое он поясняет.
