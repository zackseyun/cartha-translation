base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: ru
  text: И Амасия отпустил отряд, пришедший к нему из Ефрема, чтобы они отправились к себе. Они сильно разгневались на Иудею и возвратились к себе в пылу гнева.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: отделил
  rationale: Глагол בדל буквально означает «отделять». В контексте речь идёт об отстранении ефремских наёмников от войска; «отделил» сохраняет образ исходного текста, не добавляя прямо значения «уволил» или «отпустил».
- source_word: לְהַגְּדוּד אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: воинов, пришедших к нему из Ефрема
  rationale: גְּדוּד обозначает военный отряд. В русском предложении естественнее назвать его участников «воинами»; причастный оборот ясно определяет отделённую группу.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: чтобы они пошли к себе
  rationale: Передаёт целевое значение לְ с инфинитивом и сохраняет буквальное «к своему месту», выражая его естественным современным русским оборотом «к себе» без избыточного уточнения «домой».
- source_word: וַיִּחַר אַפָּם מְאֹד בִּיהוּדָה
  choice: они сильно разгневались на Иудею
  rationale: Еврейская идиома буквально описывает сильно разгоревшийся гнев. Русское «сильно разгневались» естественно передаёт её смысл, а «на Иудею» обозначает объект гнева.
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: возвратились к себе
  rationale: שׁוב прямо означает возвращение; «к себе» естественно передаёт לִמְקוֹמָם и перекликается с предыдущей фразой.
- source_word: בָּחֳרִי אָף
  choice: пылая яростью
  rationale: Фраза выражает жар, или пыл, гнева. «Пылая яростью» сохраняет образность и усиление оригинала, оставаясь естественным литературным русским выражением.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно формальной библейской торжественностью. Синтаксис упрощён для ясности, но повтор «к себе» сохранён вслед за повтором לִמְקוֹמָם в еврейском тексте. Имя передано в традиционной русской форме «Амасия», а географическое обозначение — «Ефрем».
