  source_fidelity: «Отделил воинов» слишком буквально передаёт וַיַּבְדִּילֵם и в русском может означать лишь отделение одной группы от другой. В данном военном контексте Амасия отсылает/отпускает пришедший к нему отряд. «Отпустил отряд» передаёт контекстуальную функцию глагола без смыслового добавления. Единственное число «отряд» точнее передаёт גְּדוּד, чем обобщённое «воинов».
  naturalness: Предлагаемый текст сохраняет современный литературный регистр. «Отправились к себе» естественнее, чем «пошли к себе», а «в пылу гнева» — обычное литературное соответствие образу горячего гнева.
  terminology: Традиционные формы «Амасия», «Ефрем» и «Иудея» сохранены. Военный термин «отряд» соответствует גְּדוּד. Богословски нагруженных терминов нет.
