base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: ru
  text: 'Амасия сказал человеку Божьему: «Но что же делать со ста талантами[a], которые я отдал израильскому отряду?» Человек Божий ответил: «Яхве может дать тебе гораздо больше этого[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «сто талантов»; из предыдущего стиха ясно, что речь идёт о талантах серебра.
    reason: cross_reference
  - marker: b
    text: 'Или: «У Яхве есть возможность дать тебе гораздо больше этого». Еврейское выражение подчёркивает, что Яхве может дать и имеет средства дать больше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое еврейское обозначение посланника, уполномоченного Богом. Перевод сохраняет форму исходного выражения и не уточняет его служение словом «пророк».
- source_word: וּמַה לַּעֲשׂוֹת
  choice: Но что же делать
  rationale: В контексте Амасия возражает против данного ему повеления и спрашивает, как поступить с уже выплаченными деньгами. «Но» передаёт противопоставление, а частица «же» делает вопрос естественным по-русски.
- source_word: מְאַת הַכִּכָּר
  choice: сто талантов
  rationale: כִּכָּר обозначает меру веса — талант. Серебро прямо названо в предыдущем стихе, но не повторено здесь, поэтому оно вынесено в примечание, а не добавлено в основной текст.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: израильский отряд
  rationale: גְדוּד может означать военный отряд или подразделение. Такой перевод естественен в контексте нанятых воинов и сохраняет связь с Израилем.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Яхве может дать тебе
  rationale: Еврейская конструкция с יֵשׁ выражает наличие у Яхве возможности или средств дать больше. Русское «может дать» ясно и естественно передаёт этот смысл.
- source_word: הַרְבֵּה מִזֶּה
  choice: гораздо больше этого
  rationale: Сочетание הַרְבֵּה с сравнительным מִן указывает на значительно большее количество; «гораздо больше этого» передаёт сравнительную меру без излишнего уточнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Форма «Яхве» сохраняет имя и соответствует наиболее принятой научной реконструкции его произношения.
- issue: Смысл יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: утверждение способности Яхве возместить потерю
  alternative: утверждение, что у Яхве имеются достаточные средства дать больше
  rationale: Основной текст естественно выражает способность Яхве дать больше, а примечание сохраняет более буквальный оттенок наличия у него средств, не превращая фразу в доктринальное обобщение.
translation_notes:
  register: Современный литературный русский язык с ясным, но dignified библейским регистром. Синтаксис диалога сделан естественным для устной речи; традиционное выражение «человек Божий» и мера веса «талант» сохранены.
