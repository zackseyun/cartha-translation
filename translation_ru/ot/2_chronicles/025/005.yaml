  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: ru
  text: Амасия собрал людей Иудеи и распределил их по родовым домам, поставив над ними тысяченачальников и сотников для всей Иудеи и Вениамина. Он провёл смотр мужчин от двадцати лет и старше и насчитал триста тысяч отборных мужчин[a], выходивших на войну[b] и владевших копьём и большим щитом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодых мужчин». Еврейское בָּחוּר может обозначать молодого мужчину, но в данном военном контексте, вероятно, подчёркивает отборность и боеспособность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выходивших на войну»; это еврейское выражение может обозначать мужчин, пригодных или готовых к военной службе.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское צִנָּה обозначает большой щит, прикрывавший значительную часть тела.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּקְבֹּץ אֲמַצְיָהוּ אֶת־יְהוּדָה
  choice: Амасия собрал людей Иудеи
  rationale: Глагол קבץ означает «собирать». Добавление «людей» делает собирательное обозначение территории и народа естественным по-русски, не меняя военного контекста.
- source_word: וַיַּעֲמִידֵם לְבֵית אָבוֹת
  choice: распределил их по родовым домам
  rationale: Каузативная форма עמד здесь описывает организацию людей, а בֵּית אָבוֹת — родовое, патрилинейное подразделение. «Родовые дома» сохраняет историческую социальную структуру и остаётся понятным.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: поставив над ними тысяченачальников и сотников
  rationale: שׂרים — начальники или командиры. Традиционные русские военные термины «тысяченачальники» и «сотники» кратко передают иерархию подразделений.
- source_word: וַיִּפְקְדֵם
  choice: Он пересчитал мужчин
  rationale: В военном контексте פקד обозначает учёт или смотр. «Пересчитал» ясно выражает действие, результат которого далее назван числом.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: от двадцати лет и старше
  rationale: Естественная современная русская формула возрастного порога, точно соответствующая еврейскому выражению.
- source_word: וַיִּמְצָאֵם שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: насчитал триста тысяч
  rationale: מצא здесь вводит итог проведённого учёта. «Насчитал» естественно объединяет действие и его числовой результат.
- source_word: בָּחוּר
  choice: отборных мужчин
  rationale: Слово может указывать как на молодых мужчин, так и на избранных, полноценных воинов. В контексте военного учёта «отборные мужчины» передаёт вероятный смысл, а иной оттенок отмечен в сноске.
- source_word: יוֹצֵא צָבָא
  choice: способных выступать на войну
  rationale: Буквально выражение означает «выходящий на войско/войну» и служит обозначением готовности или пригодности к военной службе. Перевод сохраняет образ выступления, не сводя его только к физической силе.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: владеть копьём и большим щитом
  rationale: אחז буквально значит «держать, хватать», но в военном перечне подразумевает способность пользоваться оружием. צִנָּה — щит крупного типа, поэтому размер выражен в основном тексте.
