base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: ru
  text: 'Ты сказал: «Вот, ты разбил Эдом, и сердце твоё вознесло тебя, чтобы ты прославился[a]». Теперь оставайся у себя дома. Зачем тебе навлекать на себя беду? Ведь тогда падёшь и ты, и Иуда вместе с тобой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и сердце твоё вознесло тебя к славе»; возможно также: «и сердце твоё возгордилось». Еврейское выражение описывает самовозвышение после победы и допускает оттенки славы, почёта и гордости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Ты сказал
  rationale: Перфект Qal, 2-е лицо мужского рода единственного числа. Простое прошедшее время естественно вводит передаваемое высказывание в повествовательном контексте.
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательно-эмфатическая частица; «вот» сохраняет её выразительность без архаизации.
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: ты разбил Эдом
  rationale: Форма Hiphil глагола נכה в военном контексте означает нанесение поражения; «разбил» передаёт и образ удара, и итог победы.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: сердце твоё вознесло тебя
  rationale: Сохранена еврейская метафора сердца, которое возносит человека после победы, не сводя её сразу к однозначному понятию гордости.
- source_word: לְהַכְבִּיד
  choice: чтобы ты прославился
  rationale: Инфинитив от כבד допускает оттенки славы, почёта и самовозвеличивания. Контекст упрёка придаёт выражению отрицательный оттенок, но сам глагол не следует чрезмерно сужать до одного лишь «хвастаться».
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: Теперь оставайся у себя дома
  rationale: Императив ישב с выражением «в своём доме» означает оставаться на месте и не выступать в поход; современная русская формулировка передаёт идиому естественно.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Зачем тебе навлекать на себя беду?
  rationale: Hitpael от גרה с предлогом ב выражает ввязывание в столкновение с бедой или её провоцирование. Русская фраза естественно передаёт предостережение и возвратный оттенок формы.
- source_word: וְנָפַלְתָּ
  choice: Ведь тогда падёшь
  rationale: Перфект с ו после риторического вопроса указывает на ожидаемое последствие. «Ведь тогда» ясно передаёт логическую связь, не превращая предупреждение в уже свершившийся факт.
- source_word: אַתָּה וִיהוּדָה עִמָּךְ
  choice: и ты, и Иуда вместе с тобой
  rationale: Сохраняется акцент на том, что падение царя повлечёт за собой и Иудею; в библейском употреблении «Иуда» обозначает народ или царство.
