base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: ru
  text: Он забрал всё золото и серебро, всю утварь, находившуюся в доме Бога и бывшую у Овед-Эдома[a], сокровища царского дворца и заложников[b] и вернулся в Самарию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с Овед-Эдомом» или «у Овед-Эдома»; возможно, имеется в виду утварь, находившаяся под его надзором.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновей залогов» — вероятно, людей, удерживаемых как обеспечение, то есть заложников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: всё золото и серебро
  rationale: Сохраняет значение всеохватности כָּל и естественно передаёт оба драгоценных металла по-русски.
- source_word: כָּל הַכֵּלִים
  choice: всю утварь
  rationale: В контексте дома Бога כֵּלִים обозначает храмовые предметы и принадлежности; «утварь» точно и естественно передаёт это собирательное значение.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Бога
  rationale: Формально близко передаёт еврейское выражение и сохраняет его образность, не заменяя его толковательным словом «храм».
- source_word: עִם עֹבֵד אֱדוֹם
  choice: под надзором Овед-Эдома
  rationale: Буквальное «у/с Овед-Эдомом» в данном контексте, вероятнее всего, указывает на хранение или ответственность. Толковательное значение дано в тексте, а буквальная форма сохранена в сноске.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: сокровища царского дворца
  rationale: אֹצְרוֹת здесь естественно понимать как хранившиеся ценности, а «царский дворец» ясно передаёт идиоматическое בֵּית הַמֶּלֶךְ.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: заложников
  rationale: Трудное выражение буквально означает «сыновья залогов» и, вероятнее всего, называет людей, удерживаемых как обеспечение, то есть заложников.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: и вернулся в Самарию
  rationale: Передаёт последовательное повествовательное действие и направление движения; подразумеваемый субъект естественно восстанавливается из контекста.
