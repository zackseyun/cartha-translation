  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: ru
  text: Прочие деяния Амасии, первые и последние, разве не записаны они в Книге царей Иудеи и Израиля?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: В заключительной царской формуле דִּבְרֵי обозначает не только слова, но дела и события царствования; «прочие деяния» естественно передаёт историографический смысл.
- source_word: אֲמַצְיָהוּ
  choice: Амасии
  rationale: Имя передано в принятой русской библейской форме.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: от первых до последних
  rationale: Сохраняется парная формула, охватывающая всё царствование от начала до конца.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: записаны … не так ли?
  rationale: Риторический вопрос, предполагающий утвердительный ответ, передан естественной современной русской конструкцией без избыточного перевода эмфатического הִנָּם.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Буквально предлог означает «на», но по-русски о записи в документе естественно говорить «в книге».
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: царей Иудеи и Израиля
  rationale: Сохранены порядок названий и понимание выражения как заглавия упомянутого источника.
