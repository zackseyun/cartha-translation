  - severity: low
    issue: Риторический вопрос оформлен как утверждение с «не так ли?».
    rationale: Такой вариант возможен, но прямой вопрос «Разве не записаны…?» точнее отражает הֲלֹא и естественнее сохраняет исходную конструкцию без перестройки порядка главных членов.
  revised_text: Прочие деяния Амасии, первые и последние, разве не записаны они в Книге царей Иудеи и Израиля?
