base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: ru
  text: 'Пока пророк говорил с ним, царь сказал ему: «Разве мы поставили тебя советником царя? Перестань! Зачем им бить тебя?[a]» Пророк замолчал и сказал: «Я знаю, что Бог решил погубить тебя[b], потому что ты сделал это и не послушал моего совета».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Зачем они ударят тебя?» Действующее лицо не названо; вероятно, имеются в виду люди, которые исполнят приказ царя о наказании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог замыслил погубить тебя». Еврейский глагол связан с советом, замыслом и принятием решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: Разве мы поставили тебя советником царя?
  rationale: Вопросительная частица и форма נתן с дополнением передают резкий риторический вопрос царя. «Поставили советником» естественно выражает назначение на должность и сохраняет связь с последующим «моего совета».
- source_word: חֲדַל לְךָ
  choice: Перестань!
  rationale: Краткий повелительный окрик, требующий прекратить речь; современная и естественная русская формулировка.
- source_word: לָמָּה יַכּוּךָ
  choice: Зачем им бить тебя?
  rationale: Сохранён неопределённый субъект во множественном числе и основное значение נכה — нанесение удара. Фраза звучит как угроза наказанием, но перевод не уточняет без достаточных оснований, будет ли удар смертельным.
- source_word: וַיֶּחְדַּל הַנָּבִיא
  choice: Пророк замолчал
  rationale: По контексту прекращается именно пророческая речь. «Замолчал» естественнее буквального «перестал» и ясно передаёт действие.
- source_word: יָעַץ אֱלֹהִים
  choice: Бог решил
  rationale: יעץ относится к совету, замыслу или намерению; при Боге как субъекте и последующем инфинитиве выражает принятое решение. Слово «решил» ясно передаёт смысл, а буквальная образность отмечена в сноске.
- source_word: לְהַשְׁחִיתֶךָ
  choice: погубить тебя
  rationale: Форма שחת означает привести к гибели или уничтожению. «Погубить» — прямой, литературный и контекстуально уместный русский эквивалент.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: и не послушал моего совета
  rationale: שמע с предложным дополнением включает смысл услышать и внять. «Не послушал моего совета» сохраняет оба оттенка и лексическую связь עצה с образом советника.
theological_decisions:
- issue: Божественное намерение в יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  choice: Бог решил погубить тебя
  alternative: Бог замыслил погубить тебя
  rationale: Еврейский текст прямо представляет гибель царя как Божье решённое намерение вследствие его поступка и отказа слушать пророческий совет. Перевод сохраняет эту богословскую напряжённость, не смягчая её и не добавляя объяснений о провидении.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой прямой речью. Для ясности субъект «царь» назван по ближайшему контексту, а «пророк» — непосредственно по еврейскому тексту. Сохранены повтор корня, связанного с советом, и неопределённость исполнителей предполагаемого наказания.
