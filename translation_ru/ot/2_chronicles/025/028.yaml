  text: וַ/יִּשָּׂאֻ֖/הוּ עַל הַ/סּוּסִ֑ים וַֽ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/028.yaml
  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: ru
  text: Его повезли на конях[a] и погребли вместе с его отцами в городе Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на конях». В еврейском тексте слово «кони» стоит во множественном числе; колесница или носилки не упомянуты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Его повезли
  rationale: Форма от נשׂא с местоименным суффиксом означает, что его понесли или перевезли. «Повезли» естественно передаёт перевозку тела и сочетается с последующим указанием на коней.
- source_word: עַל הַסּוּסִים
  choice: на конях
  rationale: 'Буквально: «на конях»; сохранены предлог и множественное число, без добавления не упомянутых в еврейском тексте колесницы или носилок.'
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: и погребли
  rationale: Прямой и стилистически достойный перевод глагола קבר; дополнение «его» по-русски естественно не повторять.
- source_word: עִם אֲבֹתָיו
  choice: вместе с его отцами
  rationale: Сохранена традиционная еврейская погребальная формула и её династический оттенок; более свободный вариант — «с его предками».
- source_word: בְּעִיר יְהוּדָה
  choice: в городе Иуды
  rationale: Перевод следует масоретскому чтению «город Иуды» и не заменяет его более привычным выражением «город Давида».
theological_decisions:
- issue: Место погребения
  choice: в городе Иуды
  alternative: в городе Давида; в Иудее
  rationale: Сохранено необычное чтение представленного масоретского текста без гармонизации с параллельными или более привычными формулами.
- issue: Погребальная формула עִם אֲבֹתָיו
  choice: вместе с его отцами
  alternative: вместе с его предками
  rationale: Буквальная формула оставляет семейно-династический смысл текста и не сужает его до общего обозначения предков.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной погребальной лексикой. Необычные выражения исходного текста сохранены, но синтаксис сделан естественным для русского читателя.
