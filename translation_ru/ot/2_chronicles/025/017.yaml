base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: ru
  text: 'Амасия, царь Иудеи, посоветовался и послал к Иоасу, сыну Иоахаза, сына Ииуя, царю Израиля, с такими словами: «Приходи, сойдёмся лицом к лицу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидимся лицом к лицу». В данном контексте это выражение, вероятно, означает вызов на прямое противостояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: посоветовался
  rationale: Форма нифаль от יעץ передаёт обдумывание или совещание перед последующим действием; русский возвратный глагол сохраняет эту смысловую широту, не уточняя прямо, с кем именно советовался Амасия.
- source_word: וַיִּשְׁלַח אֶל
  choice: послал к
  rationale: В еврейском тексте не названы ни посланники, ни послание, поэтому перевод не добавляет их явно.
- source_word: יוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: к Иоасу, сыну Иоахаза, сына Ииуя, царю Израиля
  rationale: Сохранены полная родословная и царский титул; имена переданы в принятой русской библейской форме.
- source_word: לֵאמֹר
  choice: с такими словами
  rationale: Естественно вводит прямую речь в современном русском повествовании, не меняя её функции.
- source_word: לְךָ
  choice: Приходи
  rationale: Императив здесь выражает вызов явиться для непосредственной встречи или столкновения.
- source_word: נִתְרָאֶה פָנִים
  choice: сойдёмся лицом к лицу
  rationale: Передаёт образ лица из еврейской идиомы и её контекстуальный оттенок прямого противостояния, не сводя выражение однозначно к военному сражению.
