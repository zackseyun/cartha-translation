  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: ru
  text: 'И воспылал гнев Яхве на Амасию. Он послал к нему пророка, и тот сказал ему: «Зачем ты обратился[a] к богам этого народа — тем, которые не спасли свой народ от твоей руки?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал искать»; «вопрошал».'
    reason: Древнееврейский глагол может обозначать поиск божества, обращение к нему или вопрошание его.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сохраняет яркую древнееврейскую идиому горящего гнева и при этом естественно звучит в литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: בַּאֲמַצְיָהוּ
  choice: на Амасию
  rationale: При обозначении гнева предлог указывает на лицо, против которого он направлен; это устойчивое русское сочетание.
- source_word: נָבִיא
  choice: пророка
  rationale: Обычное и точное соответствие древнееврейскому обозначению пророческого посланника.
- source_word: לָמָּה
  choice: зачем
  rationale: В упрёке вопрос касается цели и мотива поступка; «зачем» естественно передаёт эту силу без лишнего разъяснения.
- source_word: דָרַשְׁתָּ
  choice: обратился
  rationale: В данном религиозном контексте глагол означает искать помощи, вопрошать или прибегать к богам. «Обратился» естественно сохраняет широту значения, не сводя его только к поклонению или гадательному вопрошанию.
- source_word: אֱלֹהֵי הָעָם
  choice: к богам этого народа
  rationale: Указательное «этого» ясно отсылает к недавно побеждённому народу и естественно передаёт определённость еврейского выражения.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: которые не спасли
  rationale: Передаёт констатацию факта; вариант «не смогли спасти» добавлял бы прямо не выраженное утверждение о неспособности.
- source_word: עַמָּם
  choice: свой народ
  rationale: Возвратное притяжательное местоимение естественно по-русски передаёт принадлежность народа этим богам без смыслового расширения.
- source_word: מִיָּדֶךָ
  choice: от твоей руки
  rationale: Сохраняет конкретный образ руки как власти и военной силы; библейский оборот понятен современному русскому читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Смысл דָּרַשׁ применительно к чужим богам
  choice: обратился
  alternative: искал; вопрошал; поклонялся
  rationale: Источник допускает смысл поиска, обращения за помощью или вопрошания. Выбранное слово сохраняет эту многозначность и не уточняет форму религиозного действия сверх текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис разделён на два предложения ради ясности; образ «воспылал гнев» и выражение «от твоей руки» сохранены как понятные и значимые древнееврейские метафоры.
