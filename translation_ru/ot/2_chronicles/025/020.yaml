base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: ru
  text: Но Амасия не послушал, ибо это было от Бога, чтобы отдать их в чужие руки[a], потому что они обращались к богам Эдома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдать их в руку»; это еврейское выражение означает отдать кого-либо во власть другого. Обладатель «руки» в еврейском тексте прямо не назван.'
    reason: Пояснение идиомы и указание на то, что в еврейском тексте обладатель «руки» прямо не назван.
lexical_decisions:
- source_word: שָׁמַע
  choice: не послушал
  rationale: В контексте речь идёт не о физическом слышании, а об отказе внять предупреждению; «не послушал» естественно передаёт этот смысл по-русски.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: так было от Бога
  rationale: Форма с местоимением женского рода, вероятно, указывает на сложившуюся ситуацию или ход событий. Формулировка сохраняет утверждение о божественном источнике, не уточняя референт сверх текста.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение союза и сохраняет прямую связь между Божьим действием и последующим поражением.
- source_word: תִּתָּם
  choice: предать их
  rationale: В сочетании с выражением «в руку» глагол נתן означает отдачу во власть другой стороны; «предать» естественно передаёт этот смысл.
- source_word: בְּיָד
  choice: в чужие руки
  rationale: Это понятная русская идиома со значением «во власть противника». Слово «чужие» восполняет подразумеваемую в контексте враждебную сторону, не называя её точнее, чем позволяет еврейский текст.
- source_word: דָרְשׁוּ
  choice: обращались к
  rationale: При божестве как объекте глагол обозначает стремление искать у него помощи или руководства. «Обращались к» ясно выражает религиозную зависимость и не сводит действие лишь к поклонению или вопрошанию.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: богам Эдома
  rationale: Прямая и естественная передача сочетания, обозначающего божеств, которым служили в Эдоме.
theological_decisions:
- issue: Божественная причинность в отказе Амасии и последующем поражении
  choice: Сохранено прямое утверждение, что происходящее было от Бога и имело целью предать их во власть противника.
  alternative: Истолковать это лишь как Божье попущение или ослабить целевую связь до простого следствия.
  rationale: Еврейский текст прямо говорит «от Бога» и употребляет целевой союз לְמַעַן. Перевод сохраняет напряжение между человеческим идолопоклонством и Божьим судебным действием, не добавляя богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет причинно-целевую структуру оригинала; архаизмы и конфессионально окрашенные уточнения не используются.
