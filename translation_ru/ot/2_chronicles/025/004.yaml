source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: ru
  text: 'Но сыновей их он не предал смерти, ибо, как написано в Законе, в книге Моисея, где Яхве повелел, сказав: «Отцы не должны быть преданы смерти за сыновей, и сыновья не должны быть преданы смерти за отцов; каждый должен умереть за свой грех».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Отцы не умрут за сыновей, и сыновья не умрут за отцов». В контексте правового предписания выражение передано в основном тексте словами «не должны быть преданы смерти».'
    reason: Лексическая альтернатива и пояснение судебно-правового смысла.
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם לֹא הֵמִית
  choice: Но их сыновей он не предал смерти
  rationale: Союз передаёт контраст с казнью убийц в предыдущем стихе. Каузативная форма הֵמִית имеет судебно-правовой смысл «предать смерти»; בְּנֵיהֶם буквально означает «их сыновей».
- source_word: כִּי כַכָּתוּב
  choice: потому что ... написано
  rationale: Оборот вводит основание поступка царя — ссылку на записанное предписание; такая передача естественна по-русски и сохраняет причинную связь.
- source_word: בַּתּוֹרָה בְּסֵפֶר מֹשֶׁה
  choice: в Законе, в книге Моисея
  rationale: «Закон» доступно передаёт תּוֹרָה в данном контексте письменного установления, а повтор предлогов сохраняет пояснительную структуру еврейского текста.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: как повелел Яхве
  rationale: Формула вводит прямую цитату Божьего повеления. «Как» естественно связывает записанное с повелением, а личное имя יהוה передано как «Яхве».
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים
  choice: Отцы не должны быть преданы смерти за сыновей
  rationale: В правовом контексте יָמוּתוּ выражает судебное предание смерти, а עַל — ответственность за другого; «сыновей» сохраняет конкретное בָּנִים.
- source_word: וּבָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: и сыновья не должны быть преданы смерти за отцов
  rationale: Сохранены параллелизм правовой формулы и взаимная симметрия двух родственных категорий.
- source_word: כִּי אִישׁ בְּחֶטְאוֹ יָמוּתוּ
  choice: каждый должен умереть за свой грех
  rationale: אִישׁ имеет распределительное значение «каждый», а местоименный суффикс требует «свой». Необычное сочетание единственного אִישׁ с глаголом во множественном числе передаётся естественной русской распределительной конструкцией.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер наказания в цитате
  choice: преданы смерти
  alternative: умрут
  rationale: Контекст закона и поступка царя поддерживает судебно-правовой смысл, однако буквальная формулировка с «умрут» остаётся возможной и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксический параллелизм цитируемого закона сохранён; архаизмы и конфессионально маркированная лексика избегаются.
