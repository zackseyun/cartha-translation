base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: ru
  text: Сыны Иуды захватили живыми десять тысяч человек, привели их на вершину утёса[a] и сбросили с вершины утёса; все они разбились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скалы» или «скалистого утёса» (евр. сэла́).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «были рассечены» или «были разбиты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ חַיִּים
  choice: захватили живыми
  rationale: Сочетание глагола пленения с חַיִּים означает, что этих людей взяли в плен живыми; формулировка естественна для современного русского военного повествования.
- source_word: בְּנֵי יְהוּדָה
  choice: сыны Иуды
  rationale: Передаёт коллективное обозначение жителей или воинов Иудеи без добавления отсутствующего в тексте слова «воины»; сохраняет связь с именем Иуда.
- source_word: וַיְבִיאוּם
  choice: привели их
  rationale: В данном контексте каузативная форма בוא обозначает доставление пленных; для людей русское «привели» естественнее буквального «принесли».
- source_word: לְרֹאשׁ הַסָּלַע
  choice: на вершину утёса
  rationale: רֹאשׁ у географического объекта означает вершину, а סֶלַע — скалу или утёс; контекст сбрасывания с высоты поддерживает «утёс».
- source_word: וַיַּשְׁלִיכוּם מֵרֹאשׁ הַסֶּלַע
  choice: сбросили оттуда
  rationale: «Сбросили» точно передаёт направленное вниз бросание, а «оттуда» естественно отсылает к только что названной вершине утёса, не утяжеляя фразу повтором.
- source_word: וְכֻלָּם נִבְקָעוּ
  choice: все они разбились
  rationale: Передаёт гибель от падения естественным русским выражением; более буквальное значение глагола — «раскололись», «были рассечены» — сохранено в примечании.
