source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: ru
  text: Поэтому Яхве, его Бог, отдал его в руки царя Арама[a]. Арамеи разбили его, взяли у него множество пленных[b] и увели их в Дамаск. Он был также отдан в руки царя Израиля, который нанёс ему тяжёлое поражение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царя Сирии»; в еврейском тексте — «Арама».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «взяли у него много пленников».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «поразил его великим ударом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: отдал его в руки
  rationale: Сохраняет образность устойчивого еврейского оборота «дать в руку», то есть отдать под власть противника, и ясно выражает действие Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהָיו
  choice: его Бог
  rationale: Точно сохраняет притяжательную конструкцию и значимую в контексте суда связь Ахаза с Богом.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Сохраняет древнееврейское собственное название; традиционный вариант «Сирии» указан в сноске.
- source_word: וַיַּכּוּ בוֹ
  choice: Арамеи разбили его
  rationale: Множественное число глагола относится к войску царя Арама. В военном контексте «разбили» естественнее буквального «поразили», не выходя за смысл נכה.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: взяли у него множество пленных
  rationale: Передаёт собирательное שִׁבְיָה конкретно и естественно; возможная более событийная формулировка отмечена в сноске.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: увели их в Дамаск
  rationale: Местоимение «их» естественно восполняет подразумеваемый объект — пленных; «увели» соответствует перемещению пленников.
- source_word: וְגַם ... נִתָּן
  choice: Он был также отдан
  rationale: Сохраняет добавочное значение וְגַם и пассивную форму, перекликающуюся с первым предложением.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: нанёс ему тяжёлое поражение
  rationale: В военном контексте идиоматично передаёт выражение «поразил его великим поражением/ударом»; более буквальная образность сохранена в сноске.
theological_decisions:
- issue: Божественная власть и ответственность за поражение
  choice: Яхве прямо представлен как Тот, кто отдал Ахаза во власть вражеских царей.
  alternative: Представить события лишь как политическое или военное поражение.
  rationale: Первое נתן имеет Яхве явным субъектом, а последующее пассивное נִתָּן продолжает ту же рамку божественного суда; перевод не устраняет эту причинность.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и не привносит конфессиональной замены.
- issue: Референт местоимения «его»
  choice: Сохранено единственное число, относящееся к Ахазу как царю и представителю Иудеи.
  alternative: Явно заменить местоимение на «Иудею» или «его войско».
  rationale: В ближайшем контексте субъектом является Ахаз, но военные последствия охватывают его царство. Сохранение местоимения не снимает заложенную в тексте представительскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на ясные предложения; древний образ «в руки» сохранён как понятный русский оборот. Явный субъект множественного числа «Арамеи» добавлен из контекста царя Арама, чтобы избежать неясности. Все маркеры сносок присутствуют в основном тексте.
