base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ru
  text: Он также совершал воскурения в долине Бен-Хинном и сжёг своих сыновей в огне[a], следуя мерзостным обычаям народов, которых Яхве изгнал перед сынами Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провёл своих сыновей через огонь». Буквальнее еврейский текст здесь говорит: «сжёг своих сыновей в огне».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: совершал воскурения
  rationale: Глагол в породе hифиль означает воздымать жертвенный дым и нередко относится к воскурению благовоний или иных приношений. Формулировка сохраняет культовый смысл, не уточняя вид приношения сверх сказанного в еврейском тексте.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: в долине Бен-Хинном
  rationale: Это географическое название. Транслитерация «Бен-Хинном» сохраняет исторический топоним и не привносит более поздних ассоциаций слова «геенна».
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: сжёг своих сыновей в огне
  rationale: Глагол בער в hифиле с выражением «в огне» прямо обозначает сожжение. Существительное בָּנָיו передано как «сыновей», в соответствии с формой исходного текста.
- source_word: כְּתוֹעֲבוֹת
  choice: следуя мерзостным обычаям
  rationale: Буквальное «по мерзостям» в современном русском звучит неестественно. Выражение передаёт нравственную оценку תועבות и ясно показывает, что речь идёт об отвратительных религиозных практиках.
- source_word: הַגּוֹיִם
  choice: народов
  rationale: В данном историческом контексте слово обозначает народы, прежде населявшие землю; «народов» естественно и не несёт лишней конфессиональной окраски.
- source_word: הֹרִישׁ
  choice: изгнал
  rationale: Hифиль глагола ירש здесь означает лишить прежних жителей владения землёй, вытеснив их. «Изгнал» кратко и ясно передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: перед сынами Израиля
  rationale: 'Сохраняется образное выражение исходного текста: народы были удалены из присутствия сынов Израиля. «Сыны Израиля» — укоренившееся в русском библейском стиле обозначение израильского народа.'
theological_decisions:
- issue: Следует ли смягчить описание жертвоприношения детей
  choice: 'Основной текст говорит: «сжёг своих сыновей в огне».'
  alternative: «провёл своих сыновей через огонь»
  rationale: Здесь употреблён глагол בער, а не обычная формула со значением «проводить через огонь». Поэтому основной перевод сохраняет более сильное и прямое выражение, а распространённый альтернативный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для русского языка; нравственная резкость и конкретность исходного текста сохранены.
