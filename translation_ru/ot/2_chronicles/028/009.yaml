  text: וְ֠/שָׁם הָיָ֨ה נָבִ֥יא לַֽ/יהוָה֮ עֹדֵ֣ד שְׁמ/וֹ֒ וַ/יֵּצֵ֗א לִ/פְנֵ֤י הַ/צָּבָא֙ הַ/בָּ֣א לְ/שֹׁמְר֔וֹן וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִ֠נֵּה בַּ/חֲמַ֨ת יְהוָ֧ה אֱלֹהֵֽי אֲבוֹתֵי/כֶ֛ם עַל יְהוּדָ֖ה נְתָנָ֣/ם בְּ/יֶדְ/כֶ֑ם וַ/תַּֽהַרְגוּ בָ֣/ם בְ/זַ֔עַף עַ֥ד לַ/שָּׁמַ֖יִם הִגִּֽיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: ru
  text: 'Там был пророк Господа по имени Одед. Он вышел навстречу войску, шедшему в Самарию, и сказал им: «Вот, Господь, Бог ваших отцов, в Своём гневе на Иудею отдал их в ваши руки, но вы убили их в ярости, достигшей небес».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁם
  choice: Там
  rationale: Передаёт указание на место без добавления отдельного временного маркера.
- source_word: נָבִיא לַיהוָה
  choice: пророк Господа
  rationale: Естественная русская передача принадлежности и служения пророка; тетраграмматон передан традиционным «Господь».
- source_word: וַיֵּצֵא לִפְנֵי
  choice: вышел навстречу
  rationale: В контексте Одед выходит, чтобы встретить возвращающееся войско; это естественнее буквального «вышел перед».
- source_word: הַצָּבָא הַבָּא לְשֹׁמְרוֹן
  choice: войску, возвращавшемуся в Самарию
  rationale: Глагол בוא означает движение к Самарии; «возвращавшемуся» ясно передаёт контекст возвращения из похода, не меняя направления движения.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет вводное слово, привлекающее внимание к объяснению пророка.
- source_word: בַּחֲמַת ... עַל יְהוּדָה
  choice: разгневался на Иудею
  rationale: Передаёт причинную конструкцию по-русски естественным личным оборотом.
- source_word: וַתַּהַרְגוּ בָם
  choice: вы убивали их
  rationale: Местоименный суффикс относится к жителям/людям Иудеи, поэтому русское множественное число сохраняет смысл при собирательном «Иудея» ранее.
- source_word: בְזַעַף עַד לַשָּׁמַיִם הִגִּיעַ
  choice: с такой яростью, что она достигла небес
  rationale: Сохраняет образ ярости, достигающей небес, и ясно связывает подлежащее единственного числа с «яростью».
theological_decisions:
- issue: Причина победы Израиля над Иудеей
  choice: Господь разгневался на Иудею и отдал её в ваши руки
  alternative: Господь позволил вам победить Иудею
  rationale: Исходный текст прямо говорит «отдал их в вашу руку»; более слабое «позволил победить» стирало бы утверждение о Божьем суде.
- issue: Различение Божьего суда и жестокости победителей
  choice: Но вы убивали их с такой яростью
  alternative: И вы убивали их в ярости
  rationale: 'Противительный союз по смыслу выявляет нравственное напряжение: передача Иудеи в их руки не оправдывала чрезмерную жестокость. Еврейский ו допускает контекстуально-противительное прочтение.'
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Сохранены образ «достигла небес» и напряжение между Божьим судом над Иудеей и виной израильского войска.
