  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: ru
  text: Тогда вооружённые воины оставили пленников и добычу перед начальниками и всем собранием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: оставили
  rationale: Глагол עזב здесь означает, что воины отказались от удержания пленников и добычи и оставили их перед руководителями; «оставили» естественно передаёт действие без оттенка полного пок abandonment.
- source_word: הֶחָלוּץ
  choice: вооружённые воины
  rationale: Субстантивированная форма обозначает людей, снаряжённых для сражения. В русском контексте сочетание ясно указывает на участвовавших в походе воинов.
- source_word: הַשִּׁבְיָה
  choice: пленников
  rationale: Хотя существительное может обозначать плен как состояние, здесь оно конкретно относится к захваченным людям.
- source_word: הַבִּזָּה
  choice: добычу
  rationale: Слово обозначает имущество, захваченное на войне; «добыча» — современный и понятный русский эквивалент.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог сохраняет как пространственный смысл, так и оттенок действия в присутствии и под надзором руководителей и собрания.
- source_word: הַשָּׂרִים
  choice: начальниками
  rationale: שׂרים обозначает признанных руководителей или должностных лиц. «Начальники» соответствует контексту, не приписывая им царского происхождения или исключительно военного статуса.
- source_word: כָל הַקָּהָל
  choice: всем собранием
  rationale: קהל — собравшаяся община. «Всё собрание» нейтрально и естественно для повествовательного контекста Паралипоменон.
