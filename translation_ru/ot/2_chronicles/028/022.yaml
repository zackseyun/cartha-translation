base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: ru
  text: И во время своего бедствия он продолжал проявлять неверность Яхве[a] — он, царь Ахаз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прибавил поступать неверно против Яхве»; этот еврейский оборот может означать, что он продолжал проявлять неверность или ещё дальше зашёл в ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  choice: И во время своего бедствия
  rationale: Предложное сочетание задаёт время действия, а הָצֵר לוֹ описывает положение Ахаза, оказавшегося в бедствии или стеснённых обстоятельствах. Русская формулировка сохраняет временную конструкцию и звучит естественно.
- source_word: וַיּוֹסֶף
  choice: стал ещё больше
  rationale: Глагол יסף с инфинитивом буквально выражает добавление к прежнему действию и может означать его продолжение или усиление. В данном контексте формулировка передаёт нарастание неверности, не исключая значения продолжения.
- source_word: לִמְעוֹל
  choice: проявлять неверность
  rationale: מעל обозначает вероломное нарушение обязательств, особенно по отношению к Богу. «Проявлять неверность» передаёт нравственный и заветный оттенок без архаизма.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: 'Предлог при מעל указывает, против кого направлена неверность; в русском языке это естественно выражается дательным управлением: «проявлять неверность Яхве». Имя יהוה передано как «Яхве».'
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: — он, царь Ахаз
  rationale: Самостоятельное местоимение הוּא эмфатически выделяет и с осуждением вновь называет виновника. Конструкция с тире и приложением сохраняет этот акцент.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное заветное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Характер проступка, выраженного מעל
  choice: проявлять неверность Яхве
  alternative: грешить против Яхве
  rationale: Выбранная формулировка сохраняет присущий מעל смысл нарушения верности и не сводит его к более общему понятию греха.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная фраза сохраняет эмфатическое заключение еврейского текста. Имя «Ахаз» дано в принятой русской библейской форме.
