base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: ru
  text: Он приносил жертвы и воскурял благовония на высотах[a], на холмах и под всяким зеленеющим деревом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он приносил жертвы и возносил жертвенный дым на высотах, на холмах и под всяким зеленеющим деревом». «Высоты» — местные культовые святилища.'
    reason: Лексическая альтернатива для וַיְקַטֵּר и пояснение технического культового термина בָּמוֹת.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: приносил жертвы
  rationale: Порода piel глагола זבח обозначает совершение жертвоприношения. Такое выражение естественно по-русски и ясно передаёт культовое действие.
- source_word: וַיְקַטֵּר
  choice: воскурял благовония
  rationale: Порода piel глагола קטר может обозначать воскурение благовоний или вознесение дыма сжигаемой жертвы. В данном контексте «воскурял благовония» — естественное и вероятное прочтение; более широкая возможность отражена в сноске.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: במות — традиционное обозначение местных культовых святилищ. «На высотах» сохраняет технический религиозный смысл и межтекстовые связи библейского выражения.
- source_word: וְעַל הַגְּבָעוֹת
  choice: на холмах
  rationale: גבעות — обычное слово со значением «холмы»; здесь оно расширяет перечень мест, где совершалось незаконное богослужение.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: и под всяким зеленеющим деревом
  rationale: רענן описывает свежую, пышную зелень. «Зеленеющее дерево» сохраняет образ устойчивого древнееврейского выражения и звучит естественнее в современном русском, чем буквальное «зелёное дерево».
theological_decisions:
- issue: Передача культовой формулы, связанной с незаконным или идолопоклонническим поклонением
  choice: Сохранить традиционное «на высотах» и образ «под всяким зеленеющим деревом», не заменяя их прямым толкованием.
  alternative: 'Перевести истолковательно: «в языческих святилищах» или «под каждым густолиственным деревом».'
  rationale: Исходный текст употребляет устойчивую культовую лексику, которая сама связывает этот стих с другими ветхозаветными осуждениями незаконного поклонения. Прямое поясняющее перефразирование сузило бы смысл и ослабило межтекстовые связи.
- issue: Неоднозначность культового действия וַיְקַטֵּר
  choice: В основном тексте передать как «воскурял благовония», а более широкое значение отметить в сноске.
  alternative: Перевести «возносил жертвенный дым» или «сжигал приношения».
  rationale: Глагол допускает как более узкое значение воскурения благовоний, так и более общее обозначение вознесения жертвенного дыма. Сноска сохраняет эту реальную лексическую неоднозначность, не перегружая основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Культовый термин «высоты» сохранён ради точности и межтекстовой последовательности; его значение кратко пояснено в сноске. Формы несовершенного вида естественно передают повторяющиеся действия в нескольких названных местах.
