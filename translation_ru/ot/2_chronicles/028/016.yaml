  text: В то время царь Ахаз послал к царям Ассирии, чтобы они помогли ему[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «к царям Ассирии»; в некоторых переводах: «к царю Ассирии» — в соответствии с исторической ситуацией.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Устойчивое и естественное русское соответствие временному выражению, сохраняющее повествовательную связь.
- source_word: שָׁלַח
  choice: послал
  rationale: Передаёт глагол без добавления прямо не названного дополнения «послов»; цель посылки выражена далее.
- source_word: הַמֶּלֶךְ אָחָז
  choice: царь Ахаз
  rationale: Естественная для русского языка передача титула и имени.
- source_word: עַל
  choice: к
  rationale: В данном сочетании обозначает направленность обращения к властителю, а не действие против него.
- source_word: מַלְכֵי אַשּׁוּר
  choice: к царям Ассирии
  rationale: Сохранено множественное число масоретского текста, несмотря на исторически ожидаемое единственное.
- source_word: לַעְזֹר לוֹ
  choice: просить помощи
  rationale: Контекстуально и естественно передаёт цель обращения Ахаза за помощью; местоименное «ему» в русском избыточно, поскольку просителем является подлежащее.
theological_decisions:
- issue: Согласовывать ли множественное число «цари Ассирии» с исторически ожидаемым единственным числом
  choice: Сохранить в основном тексте масоретское множественное число «цари Ассирии»
  alternative: «царь Ассирии»
  rationale: Еврейский текст имеет форму множественного числа. Неоднозначность не следует устранять посредством исторической гармонизации; распространённый вариант в единственном числе отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Сохранено необычное множественное число исходного текста, а эллиптическое «послал» не расширено словом «послов».
