  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: ru
  text: И сыны Израиля взяли в плен у своих братьев[a] двести тысяч женщин, сыновей и дочерей. Они также захватили у них большую добычу и доставили эту добычу в Самарию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у своих сородичей» либо «у других израильтян». В еврейском тексте буквально сказано: «у своих братьев», что подчёркивает их общее родство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: взяли в плен
  rationale: Глагол שבה обозначает взятие людей в плен на войне; выражение естественно по-русски и сохраняет военный смысл.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формальное выражение сохраняет родственную образность оригинала и усиливает контраст со словами «у своих братьев».
- source_word: מֵאֲחֵיהֶם
  choice: у своих братьев
  rationale: Слово אָח может означать также сородичей или соплеменников, но буквальный вариант сохраняет нравственную остроту междоусобного конфликта.
- source_word: מָאתַיִם אֶלֶף
  choice: двести тысяч
  rationale: Прямая передача количественного числительного.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: женщин, сыновей и дочерей
  rationale: Сохранены все три прямо названные в еврейском тексте группы без сведения сыновей и дочерей к обобщающему «дети».
- source_word: שָׁלָל רָב בָּזְזוּ מֵהֶם
  choice: захватили у них много добычи
  rationale: Передаёт военный грабёж естественным современным русским языком, сохраняя существительное «добыча» для его повтора в следующей части стиха.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: доставили добычу в Самарию
  rationale: Прямая и естественная передача направления и повторного упоминания военной добычи.
theological_decisions:
- issue: Язык родства во внутриызраильском конфликте
  choice: у своих братьев
  alternative: у своих сородичей; у других израильтян
  rationale: Буквальная родственная лексика подчёркивает, что пленниками стали не чужеземцы, а люди общего народа, и сохраняет этическое напряжение текста без добавочного истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формула «сыны Израиля» сохранена ради параллели с «своими братьями»; остальной синтаксис сделан ясным и естественным.
