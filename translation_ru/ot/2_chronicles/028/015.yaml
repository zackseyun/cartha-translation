  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: ru
  text: Тогда встали люди, назначенные поимённо, и взяли пленных под свою опеку. Всех раздетых среди них они одели из добычи. Они одели их, обули, накормили, напоили, умастили маслом, а всех обессилевших повезли на ослах. Они доставили их в Иерихон, город пальм, к их братьям[a], а затем вернулись в Самарию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к их соплеменникам»; то есть к другим израильтянам.'
    reason: Лексема אֲחֵיהֶם буквально означает «их братья», но здесь может шире обозначать родственный народ, к которому принадлежали освобождённые пленники.
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: назначенные поимённо
  rationale: Нифаль глагола נקב с בְשֵׁמוֹת указывает на людей, особо названных или определённых для дела; «назначенные поимённо» естественно передаёт это в русском.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: взяли пленных под свою опеку
  rationale: В данном контексте החזיק ב означает не враждебный захват, а принятие ответственности и заботы о пленных.
- source_word: מַעֲרֻמֵּיהֶם
  choice: всех раздетых среди них
  rationale: Форма обозначает тех из пленных, кто был наг или лишён одежды; «раздетых» особенно уместно после пленения и разграбления.
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: одели из добычи
  rationale: Сохраняется прямое указание на источник одежды — военную добычу.
- source_word: וַיַּלְבִּשׁוּם
  choice: одели их
  rationale: Повтор глагола сохранён вслед за еврейским текстом ради его выразительного перечисления.
- source_word: וַיַּנְעִלוּם
  choice: обули
  rationale: Краткий современный русский эквивалент каузативного значения «снабдили обувью/надели на них обувь» без ненужного уточнения вида обуви.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: накормили, напоили
  rationale: Естественная русская передача двух каузативных глаголов без добавления не названного в тексте напитка.
- source_word: וַיְסֻכוּם
  choice: умастили маслом
  rationale: סוך означает натирать или умащать маслом; добавление «маслом» раскрывает бытовой, восстановительный смысл и не создаёт впечатления церемониального помазания.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: всех обессилевших повезли на ослах
  rationale: כושל буквально описывает спотыкающегося или изнемогающего, а сочетание с ослами означает заботливую перевозку тех, кто не мог нормально идти.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: Иерихон, город пальм
  rationale: Прозрачная и традиционно понятная передача географического эпитета.
theological_decisions:
- issue: Значение אֲחֵיהֶם в контексте родства и принадлежности к народу
  choice: к их братьям
  alternative: к их соплеменникам / к другим израильтянам
  rationale: Буквальное мужское множественное «братья» сохраняет формулировку источника и представление о родстве внутри народа; более широкое контекстуальное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранено ритмичное перечисление действий милосердия и повтор «одели»; устранены архаичные слова вроде «помазали» и «немощные», способные сместить смысл.
