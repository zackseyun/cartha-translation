base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: ru
  text: Тогда Тиглатпаласар, царь Ассирии, выступил против него и притеснил его, но[a] не укрепил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не укрепил его»; в контексте союз имеет противопоставительное значение.'
    reason: Сноска сохраняет возможность более формальной передачи еврейского союза, не устраняя контекстуального контраста.
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: выступил против него
  rationale: Сочетание בוא על в данном военно-политическом контексте выражает враждебное выступление, а не нейтральный приход.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: Тиглатпаласар
  rationale: Современная русская передача имени ассирийского царя; она ближе к принятой исторической форме и понятнее, чем буквальная транслитерация варианта написания в Паралипоменон.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Естественная русская передача сопряжённой конструкции и географического названия в данном контексте.
- source_word: וַיָּצַר לוֹ
  choice: притеснил его
  rationale: Глагол передаёт давление, стеснение или причинение бедствия. «Притеснил» сохраняет широкий смысл и не сужает действие до осады.
- source_word: וְלֹא חֲזָקוֹ
  choice: но не укрепил его
  rationale: «Укрепил» сохраняет основной образ глагола חזק; союз «но» естественно выражает контраст между ожидаемой поддержкой и фактическим притеснением.
