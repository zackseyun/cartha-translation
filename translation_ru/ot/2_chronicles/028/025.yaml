base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: ru
  text: И в каждом городе Иудеи он устроил культовые места — высоты[a], чтобы воскурять другим богам, и разгневал Яхве, Бога своих отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Высоты» — культовые места, связанные с поклонением; это традиционная передача еврейского термина бамот.
    reason: Поясняет технический термин בָּמוֹת, не сужая его до святилищ на физических возвышенностях.
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: И в каждом городе Иудеи
  rationale: Повтор עִיר וָעִיר имеет распределительное значение; естественное русское «в каждом городе» передаёт полноту охвата без неестественного буквального повтора.
- source_word: עָשָׂה בָמוֹת
  choice: устроил святилища на высотах
  rationale: עָשָׂה — широкое «сделал/устроил», а בָּמוֹת обозначает культовые места, традиционно располагавшиеся на высотах. Формулировка яснее для современного читателя, чем одно слово «высоты».
- source_word: לְקַטֵּר
  choice: чтобы воскурять
  rationale: В данном культовом контексте piel קטר означает возносить курение, вероятнее всего благовония; «воскурять» сохраняет библейский оттенок и не перегружает текст уточнением.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямо передаёт значение выражения, не добавляя отсутствующего в тексте оттенка «чужеземные».
- source_word: וַיַּכְעֵס אֶת יְהוָה
  choice: и тем прогневал Яхве
  rationale: Каузативная форма כעס означает вызвать гнев, прогневать. «Тем» естественно связывает гнев Яхве с описанным действием, не меняя причинной логики текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет отличие имени Бога от титула.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Бога своих отцов
  rationale: Сохраняет форму и библейское заветное звучание исходного выражения; «предков» было бы возможно, но менее формально.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» передаёт его без замены титулом.
- issue: Характер других божеств
  choice: другим богам
  alternative: чужим богам; языческим богам
  rationale: Определение אֲחֵרִים означает «другие»; более уточняющие варианты вносили бы интерпретацию, не выраженную прямо.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис плавный и доступный; термин בָּמוֹת раскрыт как «святилища на высотах», чтобы избежать непонятного калькированного «высоты».
