  source_fidelity: Распределительное «в каждом городе Иудеи» точно передаёт повтор עִיר וָעִיר. «Другим богам», «разгневал Яхве» и «Бога своих отцов» верно отражают соответственно לֵאלֹהִים אֲחֵרִים, каузатив וַיַּכְעֵס и אֱלֹהֵי אֲבֹתָיו. Однако «святилища на высотах» несколько излишне конкретизирует בָּמוֹת как святилища, расположенные именно на возвышенностях; в данном употреблении это устойчивое обозначение культовых мест.
  naturalness: Предлагаемый текст сохраняет современный литературный строй и умеренно библейский регистр. «Культовые места (высоты)» прозрачно для современного читателя, а пояснение в сноске удерживает технический характер термина. «Разгневал» естественнее, чем несколько книжное «тем прогневал».
  terminology: Яхве передаёт тетраграмматон последовательно. «Другие боги» не вносит невыраженного значения «чужеземные». Для בָּמוֹת сохранено техническое понятие «высоты» с кратким пояснением, а не однозначное «святилища».
