  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: ru
  text: Ахазу было двадцать лет, когда он стал царём, и шестнадцать лет он царствовал в Иерусалиме. Он не делал того, что было правильно в глазах Яхве, как его предок Давид.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как Давид, его отец». Здесь «отец» означает царственного предка, а не непосредственного родителя.'
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: Ахазу было двадцать лет
  rationale: Стандартная древнееврейская формула возраста передана естественной современной русской конструкцией.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Предложно-инфинитивная форма указывает на время вступления на престол; выбран идиоматичный русский эквивалент.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: и шестнадцать лет он царствовал
  rationale: Глагол מָלַךְ обозначает осуществление царской власти; «царствовал» точно передаёт значение и соответствует жанру царской формулы.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: וְלֹא עָשָׂה הַיָּשָׁר
  choice: Он не делал угодного
  rationale: Субстантивированное הַיָּשָׁר означает «то, что правильно/угодно»; выбранная формулировка естественно сочетается с последующим указанием на оценку Яхве, не устраняя нравственного смысла.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образ древнееврейской идиомы, выражающей Божью оценку поступков.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- source_word: כְּדָוִיד אָבִיו
  choice: как его предок Давид
  rationale: אָב здесь обозначает династического предка, а не непосредственного отца; порядок слов звучит естественно по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет это различие и не подменяет имя титулом.
- issue: Значение אָבִיו применительно к Давиду
  choice: его предок Давид
  alternative: его отец Давид
  rationale: Давид был династическим праотцом Ахаза, но не его непосредственным отцом. Перевод передаёт контекстуальное значение слова без фактической двусмысленности для современного читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Царская формула передана ясно и естественно; образ «в глазах Яхве» сохранён. Маркер сноски относится к пояснению древнееврейского употребления слова «отец».
