lexical_decisions:
- source_word: וְעוֹד
  choice: И ещё
  rationale: Сочетание вводит ещё одно бедствие в ряду вражеских нападений; «И ещё» естественно сохраняет присоединительное значение.
- source_word: אֲדוֹמִים
  choice: эдомитяне
  rationale: Форма во множественном числе обозначает народ Эдома, поэтому передаётся русским этнонимом.
- source_word: בָּאוּ
  choice: пришли
  rationale: Завершённое действие в повествовательной последовательности естественно передаётся русским прошедшим временем без необходимости в плюсквамперфекте.
- source_word: וַיַּכּוּ
  choice: напали
  rationale: Военный смысл глагола נכה здесь обозначает вооружённое поражение или удар; «напали» ясно и не утверждает полного разгрома.
- source_word: בִיהוּדָה
  choice: на Иудею
  rationale: Предлог ב при военном глаголе допускает направительное понимание; по-русски сочетание «напали на Иудею» естественно передаёт смысл.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: увели пленных
  rationale: Глагол שׁבה и однокоренное существительное образуют сочетание со значением взятия людей в плен; «увели пленных» сохраняет результат и избегает неестественного однокоренного повтора.
