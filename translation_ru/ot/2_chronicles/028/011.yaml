  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: ru
  text: Итак, послушайте меня и возвратите пленников, которых вы взяли в плен из числа своих братьев[a], потому что пылающий гнев Яхве — на вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих соплеменников». В еврейском тексте сказано «своих братьев» — так названы представители одного с ними народа завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный союз и передаёт срочный переход к прямому призыву.
- source_word: שְׁמָעוּנִי
  choice: послушайте меня
  rationale: Передаёт повеление внимать говорящему естественным современным русским выражением.
- source_word: וְהָשִׁיבוּ
  choice: возвратите
  rationale: Порода хифиль глагола שוב выражает побуждение к возвращению; «возвратите» кратко и точно сочетается с объектом «пленников».
- source_word: הַשִּׁבְיָה
  choice: пленников
  rationale: Собирательное существительное здесь обозначает захваченных людей, поэтому конкретное множественное число естественно по-русски.
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: которых вы увели
  rationale: В контексте уже названных пленников глагол передаёт их насильственное уведение, избегая тяжеловесного повтора «взяли в плен пленников».
- source_word: מֵאֲחֵיכֶם
  choice: из среды своих братьев
  rationale: Сохраняет родственный образ исходного текста и одновременно ясно показывает, что пленники были уведены из числа соплеменников адресатов.
- source_word: כִּי
  choice: потому что
  rationale: Явно вводит основание для повеления и естественно звучит в современной русской речи.
- source_word: חֲרוֹן אַף
  choice: пылающий гнев
  rationale: Сохраняет метафору жара и высокую степень интенсивности древнееврейской идиомы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: עֲלֵיכֶם
  choice: на вас
  rationale: Близко воспроизводит пространственный образ предлога על, не усиливая его до истолковывающего «против вас».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное заветное имя.
- issue: Кого обозначают «братья»
  choice: Сохранить родственный термин в основном тексте
  alternative: ваши соплеменники / другие израильтяне
  rationale: Буквальный родственный образ важен для нравственной силы упрёка, а его национально-заветный объём поясняется в сноске без сужения основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой пророческой речи. Синтаксис остаётся достаточно близким к еврейскому оригиналу, но избегает неестественного повтора. Тире перед «на вас» подчёркивает грозное заключение без добавления отсутствующего в еврейском тексте глагола.
