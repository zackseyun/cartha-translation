  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: ru
  text: Он ходил путями царей Израиля и к тому же сделал литые изваяния[a] для Ваалов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «литые идолы». Древнееврейское слово обозначает изображения, изготовленные посредством литья.'
    reason: lexical_alternative
  - marker: b
    text: В древнееврейском тексте стоит множественное число — «Ваалы»; возможно, имеются в виду различные местные формы или культовые образы Ваала.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ходил
  rationale: Сохраняет древнееврейскую метафору жизненного поведения и естественно сочетается с выражением «путями царей».
- source_word: בְּדַרְכֵי
  choice: путями
  rationale: Передаёт форму множественного числа и устойчивую библейскую метафору образа жизни и поступков.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Прямо и ясно передаёт конструкцию принадлежности и историческое обозначение правителей Израиля.
- source_word: וְגַם
  choice: и к тому же
  rationale: Выражает присоединение ещё одного обвинения, не придавая частице чрезмерного усиления.
- source_word: מַסֵּכוֹת
  choice: литые изваяния
  rationale: Сохраняет указание на изготовление посредством литья; слово «изваяния» обозначает культовые изображения, не сводя значение лишь к общему понятию идолов.
- source_word: עָשָׂה
  choice: сделал
  rationale: Нейтрально и точно передаёт обычный древнееврейский глагол без лишней стилистической окраски.
- source_word: לַבְּעָלִים
  choice: для Ваалов
  rationale: Сохраняет явно выраженное в древнееврейском тексте множественное число и целевое значение предлога.
theological_decisions:
- issue: Множественное число בְּעָלִים
  choice: для Ваалов
  alternative: для Ваала; для идолов Ваала
  rationale: Множественное число исходного текста может указывать на различные местные формы или культовые проявления почитания Ваала; перевод не устраняет эту значимую особенность.
- issue: Метафора хождения как образ поведения
  choice: ходил путями царей Израиля
  alternative: следовал обычаям царей Израиля
  rationale: Метафора понятна русскому читателю в библейском контексте и позволяет сохранить образность источника, не подменяя её толкованием.
translation_notes:
  register: Современный литературный русский язык с сохранением прозрачной библейской метафоры «ходить путями». Формулировка торжественная, но понятная; архаизмы не используются.
