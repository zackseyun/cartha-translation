  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: ru
  text: Прочие его дела и все его пути, от первых до последних, — всё это записано в Книге царей Иудеи и Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: Прочие его дела
  rationale: В итоговой царской формуле דְּבָרִים обозначает не только слова, но дела и события правления; «дела» естественно передаёт этот историографический смысл, а וְיֶתֶר — оставшуюся часть сведений.
- source_word: וְכָל דְּרָכָיו
  choice: и все его пути
  rationale: Сохранена метафора דֶּרֶךְ, обозначающая образ действий и жизненный путь царя; по-русски «пути» понятно и уместно в библейском повествовании.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: от первых до последних
  rationale: Русская конструкция передаёт хронологический охват всего правления и естественнее буквального «первые и последние», при этом не добавляет нового содержания.
- source_word: הִנָּם כְּתוּבִים
  choice: записаны
  rationale: הִנָּם придаёт указательное ударение, которое в современном русском внутри устойчивой библиографической формулы не требует отдельного «вот»; כְּתוּבִים передано естественным «записаны».
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: в Книге царей Иудеи и Израиля
  rationale: В ссылке на письменный источник עַל идиоматично передаётся предлогом «в», а название источника сохраняет структуру еврейского выражения.
