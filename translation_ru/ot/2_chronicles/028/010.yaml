base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: ru
  text: И теперь вы намерены обратить жителей Иудеи и Иерусалима в своих рабов и рабынь[a]. Но разве вы сами не виновны перед Яхве, вашим Богом?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подчинить сынов Иудеи и Иерусалима себе как рабов и рабынь». Выражение «сыны Иудеи и Иерусалима» обозначает жителей в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза сжата; буквально её можно понять примерно так: «Не у вас ли самих есть проступки перед Яхве, вашим Богом?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительную силу וְ и вводит переход к непосредственному упрёку.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: жителей Иудеи и Иерусалима
  rationale: Буквально «сынов Иудеи и Иерусалима»; здесь мужское множественное обозначает население в целом, что естественно передаётся словом «жители».
- source_word: אַתֶּם אֹמְרִים
  choice: вы намерены
  rationale: Буквально «вы говорите»; в данном контексте выражение передаёт заявленное намерение, поэтому «намерены» естественно связывается с последующим инфинитивом.
- source_word: לִכְבֹּשׁ
  choice: обратить ... в рабов и рабынь
  rationale: Глагол означает «подчинить, покорить»; сочетание с לַעֲבָדִים וְלִשְׁפָחוֹת указывает на принудительное порабощение. Русская конструкция передаёт смысл всего словосочетания без тяжеловесности.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת לָכֶם
  choice: в своих рабов и рабынь
  rationale: Сохраняет различение лиц мужского и женского пола и дательный оттенок обладания/выгоды в לָכֶם.
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: Но разве вы сами не виновны
  rationale: Сжатая и несколько неоднозначная еврейская риторическая конструкция выражает встречный упрёк в собственной виновности адресатов. Частица רַק подчёркивает их самих; по-русски это естественно передано словом «сами».
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: перед Яхве, вашим Богом
  rationale: Предлог לְ здесь выражает отношение виновности и ответственности перед Богом; имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному доктринальному решению.
- issue: Статус עֲבָדִים и שְׁפָחוֹת
  choice: рабы и рабыни
  alternative: слуги и служанки
  rationale: Речь идёт о насильственном подчинении пленённых после войны, поэтому «рабы и рабыни» точнее передаёт принудительный статус.
- issue: Смысл הֲלֹא רַק ... אֲשָׁמוֹת
  choice: риторический вопрос о виновности самих адресатов
  alternative: 'буквально: «Не только ли у вас самих — проступки перед Яхве?»'
  rationale: Фраза синтаксически сжата; перевод сохраняет риторический упрёк, не уточняя природу или меру их вины сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. «Обратить ... в рабов и рабынь» прямо выражает насильственное порабощение; «виновны перед» естественно передаёт богословски значимую ответственность, не устраняя сжатости оригинала, отмеченной в сноске.
