base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: ru
  text: И Факей, сын Ремалии, убил в Иудее сто двадцать тысяч человек в один день[a]; все они были доблестными мужами[b], потому что оставили Яхве, Бога своих отцов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за один день».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыны доблести»; то есть мужественные, боеспособные мужчины.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «когда они оставили Яхве, Бога своих отцов».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: убил
  rationale: Прямо передаёт значение глагола הרג и звучит естественно в современном русском языке.
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Предлог בְּ обозначает место действия; «Иудея» здесь означает царство или территорию Иуды, где произошло избиение.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: сто двадцать тысяч человек
  rationale: Точно передаёт числительное; слово «человек» естественно восполняет подразумеваемое существительное в русском тексте.
- source_word: בְּיוֹם אֶחָד
  choice: за один день
  rationale: Естественно по-русски подчёркивает, что всё произошло в пределах одного дня; буквальная конструкция допускает также «в один день».
- source_word: הַכֹּל
  choice: все они
  rationale: Ясно соотносит обобщение со всеми ранее названными погибшими.
- source_word: בְּנֵי חָיִל
  choice: доблестные воины
  rationale: Передаёт идиому «сыны доблести/силы» как обозначение мужественных, боеспособных мужчин; «воины» соответствует военному контексту.
- source_word: בְּעָזְבָם
  choice: потому что они оставили
  rationale: Инфинитивная конструкция с בְּ может выражать причину или время; контекст Летописей поддерживает причинное понимание, а альтернативная временная связь отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: Бога своих отцов
  rationale: Сохраняет традиционную родовую и заветную формулировку еврейского текста.
theological_decisions:
- issue: Смысл בְּעָזְבָם и его связь с гибелью воинов
  choice: 'причинный: «потому что они оставили»'
  alternative: 'временной: «когда они оставили»'
  rationale: Причинный перевод соответствует богословской логике Летописей, где военное поражение осмысляется как следствие отступления от Бога; грамматически возможное временное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным историческим тоном. Синтаксис сохраняет причинную связь и масштаб события, оставаясь понятным широкому читателю; тире выделяют пояснение о погибших.
