base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: ru
  text: И почил Ахаз со своими предками, и похоронили его в городе, в Иерусалиме, потому что не внесли его в гробницы царей Израиля[a]. И Езекия, его сын, воцарился вместо него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «царей Израиля». Поскольку Ахаз был царём Иуды, некоторые понимают это как указание на царские гробницы потомков Давида или предполагают чтение «царей Иуды».'
    reason: Сноска сохраняет необычное исходное чтение и сообщает о контекстуальной альтернативе, не подменяя ею основной текст.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил со своими предками
  rationale: Это устойчивая формула сообщения о смерти царя. «Почил» сохраняет эвфемистический характер еврейского выражения, а «предками» естественно передаёт אבות в династическом контексте и не создаёт впечатления, будто речь только о непосредственных отцах.
- source_word: וַיִּקְבְּרֻהוּ
  choice: похоронили его
  rationale: Сохранена активная форма третьего лица множественного числа с прямым дополнением.
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: в городе, в Иерусалиме
  rationale: Переданы оба обстоятельства места, как в еврейском тексте; такая конструкция подчёркивает погребение в самом городе, но не в царских гробницах.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину указанного места погребения.
- source_word: לֹא הֱבִיאֻהוּ לְקִבְרֵי
  choice: не внесли его в гробницы
  rationale: Сохранено конкретное значение каузативной формы глагола בוא — «внести, привести», без замены на более истолковывающее «не похоронили».
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Масоретский текст прямо называет Израиль; перевод не исправляет это чтение на ожидаемое по контексту «Иуды».
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: вместо него воцарился
  rationale: Естественная русская формула престолонаследия передаёт как начало царствования, так и значение замещения в תַּחְתָּיו.
theological_decisions:
- issue: Следует ли заменить «царей Израиля» на «царей Иуды» ради исторической ясности
  choice: Сохранить в основном тексте «царей Израиля»
  alternative: царей Иуды; либо понимать выражение как обозначение гробниц царей из дома Давида
  rationale: В еврейском тексте стоит «Израиль». Его возможное широкое употребление в Паралипоменоне и контекстуальное ожидание слова «Иуда» не дают основания молча изменять исходное чтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. Формула «почил со своими предками» сохраняет характер царской некрологической формулы, оставаясь понятной современному читателю.
