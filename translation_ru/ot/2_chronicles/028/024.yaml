base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: ru
  text: Ахаз собрал сосуды дома Божьего, изрубил сосуды дома Божьего, запер двери дома Господня и устроил себе жертвенники на каждом углу Иерусалима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Прямо передаёт значение глагола «собирать, сводить вместе» и сохраняет последовательность действий.
- source_word: כְּלֵי
  choice: сосуды
  rationale: В контексте храма обозначает культовую утварь; традиционное и понятное русское соответствие.
- source_word: וַיְקַצֵּץ
  choice: изрубил
  rationale: Глагол выражает рубку или разрезание на части; «изрубил» естественно передаёт намеренное разрушение храмовой утвари.
- source_word: בְּכָל פִּנָּה
  choice: на каждом углу
  rationale: Сохраняет конкретный пространственный образ еврейского текста, не заменяя его более общим «повсюду».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господня
  alternative: Яхве
  rationale: В русском библейском регистре традиционная передача «Господь» узнаваема и уместна; форма «дома Господня» ясно отличает это выражение от предшествующего «дома Божьего».
- issue: Цель жертвенников
  choice: устроил себе жертвенники
  alternative: построил жертвенники для себя
  rationale: Сохраняется дательный לו, не уточняя сверх текста, означало ли это личное пользование, собственную инициативу или культовую выгоду.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм исходного текста сохранён; архаизмы сведены к устойчивым и понятным формам «дом Господень» и «жертвенники».
