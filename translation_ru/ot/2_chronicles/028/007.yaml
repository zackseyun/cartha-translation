  text: וַֽ/יַּהֲרֹ֞ג זִכְרִ֣י גִּבּ֣וֹר אֶפְרַ֗יִם אֶת מַעֲשֵׂיָ֨הוּ֙ בֶּן הַ/מֶּ֔לֶךְ וְ/אֶת עַזְרִיקָ֖ם נְגִ֣יד הַ/בָּ֑יִת וְ/אֶת אֶלְקָנָ֖ה מִשְׁנֵ֥ה הַ/מֶּֽלֶךְ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: ru
  text: И Зихри, сильный воин из Ефрема[a], убил Маасею, сына царя, Азрикама, управляющего дворцом[b], и Елкану, второго после царя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ефремлянина-воина»; или: «героя Ефрема».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «руководителя дома»; вероятно, имеется в виду царский дворец или царское хозяйство.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «царского наместника»; то есть человека, занимавшего второе место после царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: убил
  rationale: Глагол הרג прямо означает лишение жизни; «убил» ясно, точно и естественно для современного повествования.
- source_word: זִכְרִי
  choice: Зихри
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: сильный воин из Ефрема
  rationale: גִּבּוֹר может обозначать сильного человека, воина или героя; в военном контексте «сильный воин» передаёт оба основных оттенка, а «из Ефрема» ясно указывает принадлежность.
- source_word: מַעֲשֵׂיָהוּ
  choice: Маасея
  rationale: Личное имя транслитерировано в форме, соответствующей русской библейской традиции; падеж выражен окончанием.
- source_word: בֶּן הַמֶּלֶךְ
  choice: сына царя
  rationale: Буквально и естественно передаёт родственное отношение без добавления не выраженного в еврейском тексте притяжательного местоимения.
- source_word: עַזְרִיקָם
  choice: Азрикама
  rationale: Личное имя транслитерировано; винительный падеж выражен окончанием.
- source_word: נְגִיד הַבָּיִת
  choice: управляющего дворцом
  rationale: נְגִיד обозначает руководителя или высокопоставленного служащего, а הַבָּיִת в придворном контексте, вероятнее всего, относится к царскому дворцу или хозяйству. Перевод понятен современному читателю, а неоднозначность отмечена в сноске.
- source_word: אֶלְקָנָה
  choice: Елкану
  rationale: Личное имя передано традиционной русской формой; винительный падеж выражен окончанием.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: второго после царя
  rationale: מִשְׁנֶה указывает на второе место по рангу. Формулировка близка оригиналу и не вводит более позднего специального титула.
