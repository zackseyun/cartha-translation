source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: ru
  text: Ведь Ахаз забрал ценности[a] из дома Яхве, из царского дворца и у сановников[b] и отдал их царю Ассирии, но помощи ему это не принесло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разделил» или «распределил»; по контексту Ахаз изъял ценности из этих мест и у этих людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князей»; имеются в виду знатные правители или высшие должностные лица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предыдущим утверждением и естественно вводит обоснование в русском повествовании.
- source_word: חָלַק
  choice: забрал ценности
  rationale: Основное значение глагола связано с разделением или распределением, но здесь контекст указывает на изъятие имущества ради выплаты ассирийскому царю. Формулировка ясно передаёт действие и одинаково естественно сочетается с храмом, дворцом и сановниками.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет образ и структуру еврейского выражения; в данном контексте речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно стоящее в тексте личное имя Бога, не заменяя его титулом.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дворец
  rationale: Естественный современный русский эквивалент буквального выражения «дом царя» в историческом контексте.
- source_word: הַשָּׂרִים
  choice: сановники
  rationale: Обозначает знатных правителей и высших должностных лиц при царе; «сановники» естественно для данного придворного контекста.
- source_word: וַיִּתֵּן לְמֶלֶךְ אַשּׁוּר
  choice: и отдал их царю Ассирии
  rationale: Местоимение «их» естественно отсылает к изъятым ценностям, которые подразумеваются как предмет передачи.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: но помощи ему это не принесло
  rationale: 'Идиоматично передаёт результат: переданные ценности не обеспечили Ахазу ожидаемой помощи.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер помощи со стороны Ассирии
  choice: Не уточнять вид помощи
  alternative: Но царь Ассирии ему не помог
  rationale: Еврейская фраза утверждает лишь, что передача ценностей не оказалась помощью Ахазу; она не называет прямо действующим субъектом ассирийского царя и сохраняет напряжение между уплатой и её бесполезностью.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Дом Яхве» сохраняет библейский образ, тогда как «царский дворец» и «сановники» обеспечивают ясность для современного читателя. Синтаксис остаётся компактным и передаёт причинно-пояснительную функцию стиха.
