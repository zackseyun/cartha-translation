  text: וַ/יָּקֻ֨מוּ אֲנָשִׁ֜ים מֵ/רָאשֵׁ֣י בְנֵֽי אֶפְרַ֗יִם עֲזַרְיָ֤הוּ בֶן יְהֽוֹחָנָן֙ בֶּרֶכְיָ֣הוּ בֶן מְשִׁלֵּמ֔וֹת וִֽ/יחִזְקִיָּ֨הוּ֙ בֶּן שַׁלֻּ֔ם וַ/עֲמָשָׂ֖א בֶּן חַדְלָ֑י עַל הַ/בָּאִ֖ים מִן הַ/צָּבָֽא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: ru
  text: Тогда некоторые из начальников ефремлян[a] — Азария, сын Иоханана, Берехия, сын Мешиллемофа, Езекия, сын Шаллума, и Амаса, сын Хадлая, — выступили против воинов, возвращавшихся из похода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из глав сынов Ефрема».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: выступили
  rationale: Глагол קום в сочетании с עַל здесь обозначает решительное противодействие. «Выступили против» естественно передаёт этот смысл, не сводя действие лишь к физическому вставанию.
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: некоторые из начальников ефремлян
  rationale: אֲנָשִׁים вводит неопределённую группу, а רָאשֵׁי обозначает признанных руководителей. «Ефремляне» естественно передаёт этническое выражение «сыны Ефрема»; буквальная форма отмечена в сноске.
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: Азария ... Берехия ... Езекия ... Амаса
  rationale: Имена переданы в формах, сложившихся в русской библейской традиции.
- source_word: בֶן
  choice: сын
  rationale: Обычная передача древнееврейской формулы отчества.
- source_word: עַל
  choice: против
  rationale: При קום предлог выражает противостояние или намерение воспрепятствовать кому-либо.
- source_word: הַבָּאִים
  choice: возвращавшихся
  rationale: Субстантивированное причастие буквально означает «приходившие». Контекст возвращения войска позволяет естественное «возвращавшихся», при этом направление движения не переосмысляется.
- source_word: מִן הַצָּבָא
  choice: с войском
  rationale: צָבָא может обозначать войско или военный поход. В контексте речь идёт о людях, возвращавшихся вместе с военной силой; «с войском» звучит естественно и сохраняет военное значение.
