base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: ru
  text: 'И он принёс жертвы богам Дамаска, поражавшим его[a], и говорил: «Боги царей Арама[b] помогают им; стану и я приносить им жертвы, чтобы они помогли мне». Но они стали причиной его падения и падения всего Израиля[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые побеждали его». Еврейское причастие может обозначать продолжающееся или характерное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «боги царей Арама»; в еврейском тексте слово «цари» стоит во множественном числе.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «они были для него причиной преткновения (падения) и для всего Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח לֵאלֹהֵי דַרְמֶשֶׂק
  choice: приносил он жертвы богам Дамаска
  rationale: Глагол זבח обозначает принесение жертвы; русское сочетание «приносить жертвы» естественно передаёт культовое действие. Форма אֱלֹהֵי в данном идолопоклонническом контексте передана множественным числом «богам».
- source_word: הַמַּכִּים בּוֹ
  choice: поражавшим его
  rationale: Субстантивированное причастие описывает этих богов как тех, кому Ахаз приписывал своё поражение. Причастная конструкция сохраняет возможный оттенок продолжающегося или характерного действия.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: боги царей Арама
  rationale: Сохранено множественное число מַלְכֵי («царей»), хотя по-русски его можно было бы сгладить до единственного числа.
- source_word: מַעְזְרִים אוֹתָם
  choice: помогают им
  rationale: Причастие передано настоящим временем, выражающим воспринимаемое Ахазом продолжающееся или характерное действие.
- source_word: לָהֶם אֲזַבֵּחַ וְיַעְזְרוּנִי
  choice: стану и я приносить им жертвы, чтобы они помогли мне
  rationale: Имперфект передаёт намерение Ахаза, а последующая форма естественно понимается как цель этого действия. Частица «и я» ясно воспроизводит логику подражания, не добавляя нового смысла.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  choice: Но именно они стали причиной падения для него и для всего Израиля
  rationale: Противительный союз «но» передаёт явный контекстуальный контраст между ожидаемой помощью и действительным итогом. Каузатив הכשיל выражает причинение преткновения или гибельного падения; формулировка сохраняет общий член для Ахаза и всего Израиля.
theological_decisions:
- issue: Кому приписывается поражение Ахаза в выражении «боги Дамаска, поражавшие его»
  choice: Сохранить формулировку текста как отражение языческого объяснения самого Ахаза, не вводя пояснение непосредственно в стих.
  alternative: Явно добавить, что Ахаз лишь считал этих богов виновниками своего поражения.
  rationale: 'Повествователь сообщает рассуждение Ахаза, но не утверждает истинность его представления. Заключительная фраза создаёт полемический контраст: ожидаемая помощь обернулась падением. Перевод сохраняет эту напряжённость без конфессионального или рационализирующего пояснения.'
- issue: Связь между жертвоприношением и ожидаемой помощью
  choice: Передать וְיַעְזְרוּנִי целевым оборотом «чтобы они помогли мне».
  alternative: 'Передать как простое предсказание: «и они помогут мне».'
  rationale: Целевой оборот естественно выражает намерение Ахаза, однако не превращает его надежду в утверждение рассказчика о результате.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Арам» выбран как близкая к еврейскому тексту форма этно-географического названия; синтаксис прямой речи сделан естественным для современного читателя. Формулировка не объясняет языческую причинность от лица рассказчика и сохраняет иронию заключения.
