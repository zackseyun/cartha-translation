base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: ru
  text: 'И сказали им: «Не приводите сюда пленников, потому что вы намерены навлечь на нас вину перед Яхве[a], прибавив к нашим грехам и нашей вине. Ведь наша вина и без того велика, и пламенный гнев[b] обращён на Израиль».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение сжато и допускает также понимание: «ибо на нас лежит вина перед Яхве» или «навлечь на нас вину и суд от Яхве».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «пылание гнева» — образное выражение, обозначающее сильный гнев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: пленников
  rationale: Существительное может обозначать плен как состояние или совокупность пленённых; глагол «приводить» здесь требует конкретного значения — людей, взятых в плен.
- source_word: הֵנָּה
  choice: сюда
  rationale: Наречие указывает на движение к месту, где находятся говорящие; естественный русский эквивалент — «сюда».
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: навлечь на нас вину перед Яхве
  rationale: Компактная и трудная конструкция связывает поступок с виной, лежащей на народе в его отношении к Яхве и влекущей Его суд. Формулировка сохраняет смысл виновности перед Богом, не сводя выражение только к наказанию.
- source_word: אַתֶּם אֹמְרִים
  choice: вы намерены
  rationale: Буквально «вы говорите», но в контексте оборот выражает замысел или намерение совершить действие.
- source_word: לְהֹסִיף עַל
  choice: прибавить к
  rationale: Передаёт идею увеличения уже существующей совокупности грехов и вины.
- source_word: חַטֹּאתֵינוּ
  choice: нашим грехам
  rationale: Сохранено обычное значение во множественном числе и отличие от следующего слова, обозначающего вину.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: нашей вине / наша вина
  rationale: «Вина» передаёт состояние виновности и ответственность, оставаясь отличным от совершённых «грехов».
- source_word: רַבָּה
  choice: велика
  rationale: Прямой смысл прилагательного; оборот «и без того» естественно выявляет контекстуальную мысль о том, что вина уже существует и не должна возрастать.
- source_word: וַחֲרוֹן אָף
  choice: пламенный гнев
  rationale: Близко передаёт буквальный образ «пылания гнева» и его интенсивность, оставаясь понятным в литературном русском.
- source_word: עַל יִשְׂרָאֵל
  choice: обращён на Израиль
  rationale: Предлог при слове «гнев» обозначает направленность гнева против Израиля; формулировка сохраняет библейский регистр.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Исходный текст содержит тетраграмматон; личное имя передано как «Яхве», а не заменено титулом.
- issue: Смысл לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: вина перед Яхве, которую поступок навлечёт на народ
  alternative: вина от Яхве на нас / вина против Яхве лежит на нас
  rationale: Еврейская фраза допускает акцент либо на виновности по отношению к Яхве, либо на ответственности и суде, исходящем от Него. Основной текст сохраняет оба компонента настолько, насколько позволяет естественный русский, а примечание отмечает неоднозначность.
- issue: Обозначение народа словом יִשְׂרָאֵל
  choice: Израиль
  alternative: Ефрем / северное царство
  rationale: Сохранено каноническое наименование исходного текста без исторического сужения референта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён для ясности, но сохранены различие между «грехами» и «виной», интенсивный образ гнева и неоднозначность трудной фразы о вине перед Яхве.
