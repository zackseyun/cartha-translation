  to: Филистимляне совершили набеги на города Шефелы и Негева, принадлежавшие Иудее, и захватили Бет-Шемеш, Аялон, Гедерот, Сохо[a] с принадлежавшими ему селениями, Тимну с принадлежавшими ей селениями и Гимзо с принадлежавшими ему селениями. Они поселились там.
