translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Географические названия Шефела и Негев сохранены как собственные имена; идиома «дочери» передана понятным выражением «окрестные селения». Маркер сноски поставлен непосредственно после названия Сохо, к которому относится примечание.
