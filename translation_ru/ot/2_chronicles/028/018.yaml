  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: ru
  text: Филистимляне совершили набеги на города Шефелы и Негева, принадлежавшие Иудее, и захватили Бет-Шемеш, Аялон, Гедерот, Сохо[a] с принадлежавшими ему селениями, Тимну с принадлежавшими ей селениями и Гимзо с принадлежавшими ему селениями. Они поселились там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант передачи названия: «Соко».'
    reason: transliteration_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Филистимляне
  rationale: Общепринятое русское название народа; начальный союз не воспроизведён, поскольку по-русски новый стих естественно начинается без «и», а повествовательная связь сохраняется контекстом.
- source_word: פָּשְׁטוּ
  choice: совершили набеги
  rationale: В военном контексте глагол означает набег или вторжение; выбранное выражение передаёт повторный либо широкий характер нападений без излишней конкретизации.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: на города Шефелы и Негева, принадлежавшие Иудее
  rationale: Шефела и Негев сохранены как названия географических областей. Оборот לִיהוּדָה передан как принадлежность городов Иудее, что естественно по-русски и соответствует синтаксису.
- source_word: וַיִּלְכְּדוּ
  choice: и захватили
  rationale: Обычное военное значение глагола — овладеть городами.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Бет-Шемеш
  rationale: Название транслитерировано в форме, близкой к еврейскому оригиналу и понятной русскому читателю.
- source_word: אַיָּלוֹן
  choice: Аялон
  rationale: Транслитерация еврейского географического названия.
- source_word: הַגְּדֵרוֹת
  choice: Гедерот
  rationale: Артикль не считается частью собственного имени; название передано транслитерацией.
- source_word: שׂוֹכוֹ
  choice: Сохо
  rationale: Форма отражает согласную כ как «х»; вариант «Соко» отмечен в сноске ввиду иной традиции передачи названия.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: с окрестными селениями
  rationale: Буквально «её дочери» — древний оборот о зависимых от города небольших поселениях. Функциональный русский эквивалент передаёт смысл без неясного буквализма.
- source_word: תִּמְנָה
  choice: Тимну
  rationale: Географическое название «Тимна» поставлено в винительный падеж согласно русскому синтаксису.
- source_word: גִּמְזוֹ
  choice: Гимзо
  rationale: Транслитерация географического названия; несклоняемая форма сохраняется после глагола «захватили».
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Они поселились там
  rationale: Вслед за захватом городов ישׁב обозначает обоснование и проживание на занятой территории; отдельное предложение звучит естественно и ясно.
