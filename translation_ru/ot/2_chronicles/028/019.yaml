base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: ru
  text: Ибо Яхве смирил Иудею из-за Ахаза, царя Израиля[a], потому что тот допустил распущенность в Иудее[b] и проявил крайнюю неверность по отношению к Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ахаз, царь Израиля». Исторически Ахаз был царём Иудеи; формулировка еврейского текста сохранена без согласующего исправления.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «поступал безрассудно в Иудее»; возможно также: «снял всякие ограничения в Иудее».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: смирил
  rationale: Каузативная форма глагола כנע означает, что Яхве привёл Иудею в униженное, бедственное положение; «смирил» сохраняет как причинный, так и богословский оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בַּעֲבוּר
  choice: из-за
  rationale: В данном контексте оборот выражает причину постигшего Иудею унижения.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Сохраняет прямое чтение масоретского текста и не исправляет его на исторически ожидаемое «царь Иудеи».
- source_word: הִפְרִיעַ
  choice: распустил народ
  rationale: Hiphil от פרע может обозначать снятие ограничений, разнуздание и приведение к беспорядку. С учётом переходного каузативного значения и контекста Иудеи выражение естественно передаёт, что Ахаз дал народу распуститься; неоднозначность отмечена в сноске.
- source_word: וּמָעוֹל מַעַל
  choice: проявил крайнюю неверность
  rationale: Сочетание инфинитива абсолютного с однокоренной формой усиливает идею вероломной, заветной неверности.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: При מעל предлог указывает, против кого направлена неверность; русское «проявил неверность Яхве» естественно выражает этот объект.
theological_decisions:
- issue: Ахаз назван «царём Израиля»
  choice: Сохранить в основном тексте «Ахаз, царь Израиля».
  alternative: Гармонизировать как «Ахаз, царь Иудеи».
  rationale: Еврейский текст прямо говорит «царь Израиля». Хотя исторически Ахаз царствовал в Иудее, возможную риторическую или богословскую напряжённость Летописца не следует устранять переводом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому причинному построению, но избегает неестественной буквальности. Неоднозначность הִפְרִיעַ вынесена в сноску.
