base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: ru
  text: Крылья этих херувимов простирались на двадцать локтей, а сами херувимы стояли на ногах, лицами к храму[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к дому»; так названо здание храма.'
