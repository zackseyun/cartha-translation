lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: Крылья этих херувимов
  rationale: Сохранены конструкция принадлежности, указательное местоимение и традиционный библейский термин «херувимы».
- source_word: פֹּרְשִׂים
  choice: были распростёрты
  rationale: Причастие описывает устойчивое положение крыльев; форма «были распростёрты» естественно передаёт это состояние в русском повествовании.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: на двадцать локтей
  rationale: Мера сохранена буквально; предлог «на» естественно обозначает протяжённость крыльев, не добавляя отсутствующего в еврейском тексте слова «шириной».
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: а сами они стояли на ногах
  rationale: Усилительное «сами» ясно передаёт смену подлежащего от крыльев к херувимам, выраженную местоимением הֵם.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: лицом к храму
  rationale: Русское единственное число «лицом» естественно употребляется при описании общей ориентации нескольких фигур; «храм» ясно передаёт референт слова «дом» в данном контексте.
theological_decisions:
- issue: Передача בַּיִת в контексте строительства святилища
  choice: храму
  alternative: дому
  rationale: Буквально слово означает «дом», однако здесь оно служит обычным обозначением храмового здания. В современном русском «к храму» непосредственно и без конфессионального уточнения передаёт смысл; буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Распростёрты» сохраняет достоинство стиля и точно описывает положение крыльев; синтаксис остаётся ясным для обычного читателя.
