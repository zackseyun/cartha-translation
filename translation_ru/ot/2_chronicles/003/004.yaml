  source_fidelity: 'В целом переданы все элементы масоретского текста: притвор расположен перед храмовым зданием; его протяжённость соотнесена с шириной храма и составляет двадцать локтей; высота передана как сто двадцать локтей; внутренность покрыта чистым золотом. Однако пояснение «— по ширине храма» после тире синтаксически оторвано и несколько неясно; его следует включить в конструкцию, яснее выражающую соотнесённость размера, не добавляя геометрических деталей.'
