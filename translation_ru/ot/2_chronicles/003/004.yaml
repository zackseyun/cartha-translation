base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: ru
  text: Притвор перед храмом был длиной в двадцать локтей, по ширине храма, а высотой — в сто двадцать локтей[a]. Изнутри Соломон обложил его чистым золотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте высота притвора указана как «сто двадцать» локтей. В параллельном описании (3 Царств 6:3) приведены длина и ширина притвора, но не его высота; поэтому некоторые толкователи предполагают здесь текстологическую трудность. Перевод следует сохранившемуся масоретскому тексту.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: притвор
  rationale: Означает входное помещение или крытую пристройку перед основным зданием; «притвор» естественно и точно передаёт храмовый архитектурный термин.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: перед храмом
  rationale: Оборот выражает пространственное положение перед зданием; краткая русская формулировка сохраняет этот смысл.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת אַמּוֹת עֶשְׂרִים
  choice: был длиной в двадцать локтей — по ширине храма
  rationale: Сжатая еврейская конструкция соотносит длину фасада притвора с шириной храма. Тире позволяет естественно передать это пояснение, не уточняя геометрию сверх текста.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: двадцать локтей
  rationale: Сохраняется древняя единица измерения без приблизительного пересчёта в современные меры.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: а высотой — в сто двадцать локтей
  rationale: Следует масоретскому тексту; слово «локтей» восполнено по контексту измерений для ясности русского текста.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: Изнутри Соломон обложил его
  rationale: צפה означает покрывать или облицовывать материалом. Явное имя «Соломон» естественно восстанавливает подлежащее из контекста главы, а «его» сохраняет объектный суффикс, относящийся к притвору.
- source_word: זָהָב טָהוֹר
  choice: чистым золотом
  rationale: Прямое и идиоматичное соответствие названию материала и характеристике его чистоты.
