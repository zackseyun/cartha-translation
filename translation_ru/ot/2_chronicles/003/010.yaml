lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: В Святом святых
  rationale: Еврейское сочетание обозначает внутреннее, наиболее святое помещение храма. Устоявшееся русское выражение передаёт превосходную степень святости естественно и кратко.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: двух херувимов
  rationale: «Херувим» — традиционное и понятное русское соответствие еврейскому כְּרוּב; числительное точно передаёт שְׁנַיִם.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: скульптурную работу[a]
  rationale: Редкое слово צַעֲצֻעִים, вероятнее всего, характеризует вид художественной работы или изготовленные изваяния, а не ремесленника. Перевод сохраняет предметный смысл и не повторяет спорное понимание «работа ваятеля» без оговорки.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: и их покрыли золотом
  rationale: Форма глагола во множественном числе указывает на неопределённых исполнителей и отличается от предшествующего единственного числа «он сделал». «Покрыли золотом» естественно передаёт нанесение золотой облицовки.
