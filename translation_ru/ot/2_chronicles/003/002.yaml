lexical_decisions:
- source_word: וַיָּחֶל
  choice: Он начал
  rationale: Хифиль глагола חלל с последовательным вау обозначает начало действия; в современном русском повествовательное «и» здесь можно естественно опустить.
- source_word: לִבְנוֹת
  choice: строить
  rationale: Инфинитив глагола בנה; «строить» — прямой и естественный русский эквивалент.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: во втором месяце
  rationale: Временное обозначение месяца передано близко к форме и смыслу древнееврейского текста.
- source_word: בַּשֵּׁנִי
  choice: во второй день
  rationale: Повторное порядковое числительное эллиптично; по обычному пониманию подразумевается второй день месяца. Слово «день» добавлено для ясности, а буквальная форма отмечена в сноске.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: на четвёртом году
  rationale: Естественная русская формула датировки по году царствования, сохраняющая значение исходного выражения.
- source_word: לְמַלְכוּתוֹ
  choice: своего царствования
  rationale: Местоимение «своего» однозначно связывает царствование с подлежащим, а «царствование» естественно передаёт период царской власти.
