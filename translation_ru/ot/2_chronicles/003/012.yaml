  text: וּ/כְנַ֨ף הַ/כְּר֤וּב הָ/אֶחָד֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֖יעַ לְ/קִ֣יר הַ/בָּ֑יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ דְּבֵקָ֕ה לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: ru
  text: Крыло одного херувима было длиной в пять локтей[a] и доходило до стены храма, а другое крыло, тоже длиной в пять локтей[b], соприкасалось с крылом другого херувима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Около 2,3 метра.
    reason: cultural_note
  - marker: b
    text: Около 2,3 метра.
    reason: cultural_note
lexical_decisions:
- source_word: כְנַף
  choice: крыло
  rationale: В описании храмовых херувимов имеется в виду конкретное крыло, а не переносное значение «край».
- source_word: כְּרוּב
  choice: херувим
  rationale: Еврейское существительное стоит в единственном числе и обозначает одну из двух фигур.
- source_word: אַמּוֹת חָמֵשׁ
  choice: пять локтей
  rationale: Сохранена древняя мера длины для точности и согласованности с архитектурным описанием.
- source_word: מַגִּיעַ
  choice: доходило
  rationale: Естественно передаёт физическую протяжённость крыла вплоть до стены.
- source_word: קִיר הַבָּיִת
  choice: стена храма
  rationale: Буквально בַּיִת означает «дом», но в данном контексте однозначно обозначает здание храма; явное название устраняет неестественность русского «стена дома».
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: другое крыло
  rationale: Естественно передаёт прилагательное אַחֶרֶת и парное устройство крыльев.
- source_word: דְּבֵקָה
  choice: соприкасалось
  rationale: Передаёт тесный физический контакт между крыльями, не добавляя идеи механического скрепления.
- source_word: הַכְּרוּב הָאַחֵר
  choice: другого херувима
  rationale: Сохраняет значение «другой» и связь между двумя отдельными фигурами.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; ясное и достойное изложение. Добавление «длиной» делает русскую мерную конструкцию естественной, а «тоже» подчёркивает одинаковый размер двух крыльев без изменения смысла.
