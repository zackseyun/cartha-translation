  text: וַ/יַּ֨עַשׂ֙ אֶת בֵּֽית קֹ֣דֶשׁ הַ/קֳּדָשִׁ֔ים אָרְכּ֞/וֹ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/רָחְבּ֖/וֹ אַמּ֣וֹת עֶשְׂרִ֑ים וַ/יְחַפֵּ֨/הוּ֙ זָהָ֣ב ט֔וֹב לְ/כִכָּרִ֖ים שֵׁ֥שׁ מֵאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: ru
  text: Он устроил Святое святых[a]. Его длина, соответствовавшая ширине храма, составляла двадцать локтей, и ширина — двадцать локтей. Он обложил его отборным золотом весом в шестьсот талантов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом святости святынь»; также можно перевести: «Святейшее место».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  rationale: Устойчивое и понятное русское обозначение самого внутреннего храмового помещения; передаёт усилительное значение древнееврейского сочетания без тяжеловесного буквализма.
- source_word: אָרְכּוֹ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: Его длина, соответствовавшая ширине храма
  rationale: 'Передаёт пространственное соотношение: длина внутреннего помещения совпадала с шириной храмового здания. «Храм» здесь естественно обозначает упомянутый дом Господень.'
- source_word: אַמּוֹת עֶשְׂרִים
  choice: двадцать локтей
  rationale: Сохранена древняя мера длины без приблизительного пересчёта, чтобы не создавать ложной точности.
- source_word: וַיְחַפֵּהוּ
  choice: Он обложил его
  rationale: В строительном контексте глагол означает покрытие поверхности слоем ценного материала; «обложил золотом» — естественное архитектурное выражение по-русски.
- source_word: זָהָב טוֹב
  choice: отборным золотом
  rationale: Прилагательное характеризует высокое качество золота. «Отборное» звучит естественно и не приписывает тексту точного утверждения о химической чистоте.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: весом в шестьсот талантов
  rationale: Предлог לְ указывает здесь на количество; формулировка ясно представляет таланты как меру общего веса использованного золота.
