  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: ru
  text: Он облицевал храм[a] драгоценными камнями, чтобы придать ему великолепие, а золото было из Парваима[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом»; в Паралипоменон так часто называется храм.'
    reason: lexical_alternative
  - marker: b
    text: Местонахождение Парваима неизвестно; еврейское выражение можно также перевести как «парваимское золото» или «золото Парваима».
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: украсил
  rationale: В сочетании с драгоценными камнями глагол обозначает декоративную отделку поверхности; русское «украсил» естественно передаёт функцию этой отделки, не навязывая технически сомнительного способа крепления камней.
- source_word: הַבַּיִת
  choice: храм
  rationale: Буквально «дом», но в данном контексте Паралипоменон это устойчивое обозначение храма; «храм» ясно и естественно для современного читателя, а буквальный вариант отмечен в сноске.
- source_word: אֶבֶן יְקָרָה
  choice: драгоценными камнями
  rationale: Форма единственного числа имеет собирательное значение; русский множественный вариант естественно обозначает материал декоративной отделки.
- source_word: לְתִפְאָרֶת
  choice: чтобы придать ему великолепие
  rationale: Предлог ל выражает цель, а תִּפְאֶרֶת — красоту, великолепие или пышность. Формулировка передаёт целевое значение и высокий эстетический оттенок.
- source_word: וְהַזָּהָב
  choice: а золото
  rationale: Союз вводит уточнение происхождения использованного золота; русское «а» естественно обозначает переход к следующей детали.
- source_word: זְהַב פַּרְוָיִם
  choice: золото было из Парваима
  rationale: Сопряжённое сочетание, вероятнее всего, указывает на происхождение или связь с местом Парваим, точное местонахождение которого неизвестно.
