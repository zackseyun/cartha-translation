source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: ru
  text: Тогда Соломон начал строить дом Яхве в Иерусалиме, на горе Мориа, где Яхве явился Давиду, отцу Соломона[a], — на месте, которое Давид приготовил, на гумне Орнана-иевусея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которая была показана Давиду, отцу Соломона». Еврейская фраза допускает такое понимание.'
    reason: alternative_reading
  - marker: b
    text: В Паралипоменоне употребляется имя Орнан; в 2 Царств 24:16, 18 тот же человек назван Аравной.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Тогда … начал
  rationale: Форма продолжает повествовательную последовательность, а глагол в сочетании с инфинитивом означает начало действия.
- source_word: לִבְנוֹת
  choice: строить
  rationale: Инфинитив с ל после וַיָּחֶל естественно передаётся русской конструкцией «начал строить».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: «Дом» сохраняет образ исходного текста, тогда как «храм» был бы более истолковывающим переводом; личное имя יהוה передано как «Яхве».
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: на горе Мориа
  rationale: Фраза обозначает конкретную гору; «гора Мориа» — ясная и традиционно узнаваемая передача топонима.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: где Яхве явился его отцу Давиду
  rationale: Нифаль глагола ראה в контексте богоявления естественно означает «явился». Подлежащее в еврейском не названо явно, но из контекста им понимается Яхве; альтернативная пассивная трактовка сохранена в сноске.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: на месте, которое Давид приготовил
  rationale: Еврейская конструкция сжата. Такая передача связывает относительное предложение с местом и ясно выражает подготовку Давидом места для будущего храма.
- source_word: בְּגֹרֶן
  choice: на гумне
  rationale: «Гумно» кратко и точно обозначает открытую площадку для молотьбы и уместно в историческом повествовании.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Орнана, иевусея
  rationale: Сохранена форма имени, употреблённая в Паралипоменоне, и этническое обозначение; вариант имени в книге Царств отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе стоит личное имя Бога — тетраграмматон; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Подлежащее при נִרְאָה
  choice: где Яхве явился его отцу Давиду
  alternative: которая была показана его отцу Давиду
  rationale: Контекст 1 Пар 21 поддерживает понимание богоявления Давиду, однако форма исходного текста допускает пассивную трактовку, поэтому она не устранена, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён образ «дома Яхве»; слово «гумно» выбрано как точное, краткое и всё ещё понятное обозначение исторической реалии.
