  text: וַ/יְחַ֨ף אֶת הַ/בַּ֜יִת הַ/קֹּר֧וֹת הַ/סִּפִּ֛ים וְ/קִֽירוֹתָ֥י/ו וְ/דַלְתוֹתָ֖י/ו זָהָ֑ב וּ/פִתַּ֥ח כְּרוּבִ֖ים עַל הַ/קִּירֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: ru
  text: Он покрыл золотом храм — балки, пороги, стены и двери — и вырезал на стенах херувимов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַף
  choice: покрыл
  rationale: Глагол обозначает покрытие поверхности слоем материала; вместе с זָהָב естественно переводится «покрыл золотом».
- source_word: הַבַּיִת
  choice: храм
  rationale: Буквально «дом», но в данном контексте речь однозначно идёт о здании храма; «храм» ясно передаёт контекстуальное значение в современном русском.
- source_word: הַקֹּרוֹת
  choice: балки
  rationale: Существительное обозначает конструкционные деревянные элементы; «балки» сохраняет требуемую широту значения и не сужает его до стропил.
- source_word: הַסִּפִּים
  choice: пороги
  rationale: Термин может обозначать пороги либо элементы дверного проёма; «пороги» — наиболее вероятное архитектурное значение здесь.
- source_word: קִירוֹתָיו
  choice: стены
  rationale: Прямое и естественное соответствие форме множественного числа; принадлежность храму ясна из перечисления и не требует повторного местоимения.
- source_word: דַלְתוֹתָיו
  choice: двери
  rationale: Общее значение — двери или дверные створки; «двери» наиболее ясно и естественно.
- source_word: זָהָב
  choice: золотом
  rationale: Русский творительный падеж естественно выражает материал покрытия.
- source_word: וּפִתַּח
  choice: и вырезал
  rationale: Глагол означает вырезать или гравировать декоративные изображения; «вырезал» естественно передаёт создание рельефных или резных фигур на поверхности.
- source_word: כְּרוּבִים
  choice: херувимов
  rationale: Традиционный и точный русский библейский термин для храмовых небесных существ.
- source_word: עַל הַקִּירוֹת
  choice: на стенах
  rationale: Предлог עַל здесь естественно указывает поверхность или место расположения изображений.
