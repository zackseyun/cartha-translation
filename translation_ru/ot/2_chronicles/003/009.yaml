lexical_decisions:
- source_word: וּמִשְׁקָל לְמִסְמְרוֹת
  choice: Вес золотых гвоздей
  rationale: מִשְׁקָל обозначает вес, а מִסְמְרוֹת — гвозди или крепёжные штыри. В храмовом строительном контексте «гвозди» — наиболее естественный русский эквивалент; конструкция с ל передана нормативным родительным оборотом.
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  choice: составлял пятьдесят шекелей
  rationale: Оборот сообщает меру веса; «составлял» ясно и естественно выражает подразумеваемую связку. זָהָב отнесено к гвоздям как указание на их материал, что грамматически и контекстуально возможно.
- source_word: וְהָעֲלִיּוֹת
  choice: а верхние помещения[a]
  rationale: עֲלִיּוֹת обычно обозначает верхние комнаты или помещения, однако точный архитектурный референт здесь не вполне определён. Союз ו передан как «а» для естественной связи двух сообщений без усиления противопоставления.
- source_word: חִפָּה זָהָב
  choice: он покрыл золотом
  rationale: חפה в строительном контексте означает покрывать или облицовывать материалом. «Покрыл золотом» — современная и понятная формулировка, сохраняющая смысл позолоты или золотой облицовки.
