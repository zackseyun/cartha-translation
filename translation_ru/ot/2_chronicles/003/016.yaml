  text: וַ/יַּ֤עַשׂ שַׁרְשְׁרוֹת֙ בַּ/דְּבִ֔יר וַ/יִּתֵּ֖ן עַל רֹ֣אשׁ הָ/עַמֻּדִ֑ים וַ/יַּ֤עַשׂ רִמּוֹנִים֙ מֵאָ֔ה וַ/יִּתֵּ֖ן בַּֽ/שַּׁרְשְׁרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: ru
  text: Он сделал цепи[a] во внутреннем святилище[b] и поместил их на верхушках столбов; ещё он сделал сто гранатовых плодов и прикрепил их к цепям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «цепеобразные украшения», «плетения» или «гирлянды».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во внутреннем помещении»; традиционно: «в Святом святых». Еврейское слово обозначает внутреннее святилище храма, хотя некоторые понимают это выражение здесь шире — как относящееся к декоративной отделке.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: цепи
  rationale: Слово обозначает цепи или цепеобразное декоративное плетение. Конкретное «цепи» сохраняет повтор одного и того же еврейского существительного в обеих частях стиха; альтернативный архитектурный смысл указан в сноске.
- source_word: בַּדְּבִיר
  choice: во внутреннем святилище
  rationale: דְּבִיר обычно обозначает внутреннее помещение храма. Такой перевод передаёт архитектурный смысл и не подменяет его традиционным культовым наименованием; возможный вариант отмечен в сноске.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: на верхушках столбов
  rationale: Буквально «на головах столбов»; «на верхушках» естественно передаёт пространственный смысл применительно к архитектурным предметам.
- source_word: רִמּוֹנִים
  choice: гранатовые плоды
  rationale: Речь идёт об украшениях в форме плодов граната. Уточнение «плоды» помогает современному читателю не принять слово «гранаты» за оружие.
- source_word: מֵאָה
  choice: сто
  rationale: Прямая и естественная передача количественного числительного.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: прикрепил их к цепям
  rationale: Предлог ב допускает понимание размещения на цепях или включения в цепеобразный орнамент. «Прикрепил к цепям» естественно описывает декоративное соединение, не утверждая лишних конструктивных подробностей.
