lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: Большой зал
  rationale: В контексте устройства храма בַּיִת может обозначать помещение или основную часть здания; «зал» естественно передаёт архитектурный смысл, а הַגָּדוֹל — «большой».
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: обшил кипарисовым деревом
  rationale: Глагол חפה означает покрывать или облицовывать; при указании древесины русское «обшил» ясно передаёт деревянную облицовку.
- source_word: עֵץ בְּרוֹשִׁים
  choice: кипарисовым деревом
  rationale: Традиционное и широко принятое соответствие для בְּרוֹשׁ, хотя точный вид дерева остаётся спорным.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: покрыл его отборным золотом
  rationale: «Покрыл» передаёт повторный חפה, а «отборное золото» естественно выражает буквально «хорошее золото», то есть золото высокого качества, не утверждая прямо его абсолютную чистоту.
- source_word: וַיַּעַל עָלָיו
  choice: украсил
  rationale: В данном декоративном контексте форма от עלה означает поместить или нанести на поверхность; «украсил» естественно связывает действие с последующими мотивами.
- source_word: תִּמֹרִים וְשַׁרְשְׁרוֹת
  choice: изображениями пальм и цепей
  rationale: Буквально названы «пальмы и цепи», но в архитектурном контексте речь, вероятнее всего, о нанесённых декоративных формах; слово «изображениями» делает это понятным, сохраняя сами мотивы.
