  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: ru
  text: Перед храмом он сделал два столба длиной тридцать пять локтей[a], а венец на вершине каждого из них[b] — размером в пять локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально сказано: «длиной тридцать пять локтей». В 3 Царств 7:15 высота каждого столба составляет восемнадцать локтей. Поэтому некоторые понимают число здесь как общую высоту двух столбов; возможно также, что в тексте имеется расхождение.'
    reason: cross_reference
  - marker: b
    text: 'В еврейском тексте буквально: «на его вершине». Единственное число, вероятно, употреблено распределительно — о каждом из двух столбов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: перед храмом
  rationale: לִפְנֵי обозначает положение «перед», а הַבַּיִת в данном контексте — храм; такой перевод естественен для современного русского читателя.
- source_word: וַיַּעַשׂ ... עַמּוּדִים שְׁנַיִם
  choice: он поставил два столба
  rationale: עַמּוּדִים — архитектурные столбы. Глагол עשה буквально означает «сделал», но применительно к размещённым перед храмом столбам русское «поставил» естественно передаёт результат строительного действия.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: длиной тридцать пять локтей
  rationale: Слово אֹרֶךְ прямо обозначает длину. Древняя мера «локоть» сохранена, а спорное соотношение с параллельным местом не разрешается внутри основного текста.
- source_word: הַצֶּפֶת
  choice: венец
  rationale: В архитектурном контексте слово обозначает верхнюю декоративную часть столба. «Венец» понятно и уместно в литературном русском языке.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: на вершине каждого из них
  rationale: 'רֹאשׁ применительно к столбу естественно передаётся как «вершина». Единственное число местоименного суффикса сохранено по смыслу как распределительное: венец находился на каждом из двух столбов.'
- source_word: אַמּוֹת חָמֵשׁ
  choice: был в пять локтей
  rationale: В еврейском тексте указана мера без повторного обозначения измерения; перевод не добавляет прямо не названное слово «высотой».
