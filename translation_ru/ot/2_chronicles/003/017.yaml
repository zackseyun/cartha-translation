base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: ru
  text: 'Он поставил столбы перед храмовым залом[a]: один справа, другой слева. Столб справа он назвал Иахин, а столб слева — Вооз.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед главным залом храма». Еврейское слово הֵיכָל здесь обозначает главный зал храмового здания, а не обязательно весь храмовый комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: поставил
  rationale: Порода хифиль глагола קום здесь означает, что столбы были установлены в вертикальном положении; «поставил» естественно передаёт это действие в контексте строительства.
- source_word: הָעַמּוּדִים
  choice: столбы
  rationale: עַמּוּדִים обозначает архитектурные столбы или колонны. «Столбы» соответствует привычной русской библейской терминологии для этих двух особо названных сооружений.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: перед храмовым залом[a]
  rationale: עַל־פְּנֵי сохраняет пространственное значение «перед», а הֵיכָל в данном архитектурном контексте указывает на главный зал храмового здания, а не обязательно на весь храмовый комплекс.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: один справа, другой слева
  rationale: Перевод прямо передаёт обычные обозначения правой и левой стороны, не превращая их в стороны света, которых еврейский текст явно не называет.
- source_word: וַיִּקְרָא שֵׁם
  choice: он назвал
  rationale: Еврейская формула буквально означает «нарёк имя», но современное «назвал» ясно и естественно передаёт акт наречения имени.
- source_word: הַיְמִינִי ... הַשְּׂמָאלִי
  choice: столб справа ... столб слева
  rationale: Повтор слова «столб» устраняет возможную неясность и сохраняет параллельное построение фразы.
- source_word: יָכִין
  choice: Иахин
  rationale: Использована укоренившаяся русская библейская форма имени, близкая к древнееврейскому יָכִין.
- source_word: בֹּעַז
  choice: Вооз
  rationale: Использована традиционная и легко узнаваемая русская библейская форма имени בֹּעַז.
