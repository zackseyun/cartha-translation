base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: ru
  text: 'Таковы основания, положенные Соломоном для строительства дома Божьего[a]: длина — шестьдесят локтей по прежней мере[b], а ширина — двадцать локтей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский оборот не вполне ясен. Возможны также переводы: «Вот основание, заложенное Соломоном…» или, в более общем смысле, «Вот размеры, по которым Соломон строил дом Божий».'
    reason: lexical_alternative
  - marker: b
    text: «По прежней мере» может означать, что локти измерялись по более древнему эталону.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה הוּסַד שְׁלֹמֹה
  choice: Вот основание, которое Соломон заложил
  rationale: Форма הוּסַד и вся конструкция трудны для толкования. Перевод передаёт наиболее вероятную связь с закладкой основания, при этом необычность еврейского оборота отмечена в сноске. Единственное число «основание» естественно по-русски и соответствует смыслу последующего описания размеров.
- source_word: לִבְנוֹת
  choice: для строительства
  rationale: Инфинитив с ל выражает цель; выбран естественный русский целевой оборот.
- source_word: בֵּית הָאֱלֹהִים
  choice: дома Божьего
  rationale: Сохранён древнееврейский храмовый образ «дом Бога», без подмены более истолковывающим словом «храм».
- source_word: הָאֹרֶךְ
  choice: длина
  rationale: Обычный архитектурный термин в контексте размеров здания.
- source_word: אַמּוֹת
  choice: локтях / локтей
  rationale: Сохранена древняя единица длины без приблизительного пересчёта в современные единицы; повтор отражает повтор אַמּוֹת в исходном тексте.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: по прежней мере
  rationale: Близко передаёт выражение и не устраняет неясность относительно конкретного исторического эталона локтя.
- source_word: וְרֹחַב אַמּוֹת עֶשְׂרִים
  choice: а ширина — двадцать локтей
  rationale: Естественный русский параллелизм, точно передающий второе измерение.
