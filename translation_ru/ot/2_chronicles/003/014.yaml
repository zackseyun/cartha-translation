base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: ru
  text: Он сделал завесу[a] из голубой, пурпурной и багряной[b] пряжи и тонкого льна и украсил её изображениями херувимов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутреннюю завесу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «алой».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «возвёл (или поместил) на ней херувимов»; вероятно, речь об изображениях херувимов, вытканных или вышитых на завесе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: завесу
  rationale: Слово обозначает внутреннюю храмовую завесу, служившую перегородкой; «завеса» — естественный и устойчивый русский библейский термин.
- source_word: תְּכֵלֶת
  choice: голубой пряжи
  rationale: Термин обозначает материал, окрашенный в голубой или сине-фиолетовый цвет; в перечне храмовых тканей естественно передать его как цвет пряжи.
- source_word: אַרְגָּמָן
  choice: пурпурной пряжи
  rationale: Стандартное обозначение дорогого материала, окрашенного пурпуром.
- source_word: כַרְמִיל
  choice: багряной пряжи
  rationale: Слово обозначает материал насыщенного красного цвета; «багряный» сохраняет торжественный храмовый регистр, не делая оттенок чрезмерно точным.
- source_word: בּוּץ
  choice: тонкого льна
  rationale: Обозначает высококачественный тонкий лён; такой перевод понятен современному читателю и передаёт качество материала.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: украсил её изображениями херувимов
  rationale: Буквально выражение говорит, что он «возвёл/поместил на ней херувимов». В данном ремесленном контексте речь идёт о нанесённых на завесу фигурах, но точный способ исполнения не указан.
- source_word: כְּרוּבִים
  choice: херувимов
  rationale: Сохранён традиционный русский библейский термин, соответствующий храмовой образности.
