translation_notes:
  register: Современный литературный русский язык; архитектурное описание передано ясно и сдержанно. Повтор «было длиной в пять локтей» сохранён ради соответствия параллельной структуре еврейского текста. Слово «локоть» оставлено как традиционное название древней меры длины.
