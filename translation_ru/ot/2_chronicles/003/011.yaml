base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: ru
  text: 'Длина крыльев херувимов составляла двадцать локтей: одно крыло длиной пять локтей доходило до стены храма, а другое крыло длиной пять локтей доходило до крыла другого херувима.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: Крылья херувимов
  rationale: Начальный союз опущен ради естественного русского синтаксиса; традиционное «херувимы» точно обозначает названных в тексте небесных существ.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: были длиной в двадцать локтей
  rationale: Предикативная конструкция естественно передаёт буквальное «их длина — двадцать локтей»; древняя мера сохранена.
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: одно крыло было длиной в пять локтей
  rationale: Эллиптическое обозначение меры развёрнуто для ясности без добавления нового смысла.
- source_word: מַגַּעַת ... מַגִּיעַ
  choice: касалось ... касалось
  rationale: Причастия от נגע в данном описании могут обозначать достижение точки с фактическим соприкосновением; «касалось» естественно и конкретно передаёт расположение крыльев.
- source_word: לְקִיר הַבַּיִת
  choice: стены храма
  rationale: בַּיִת буквально означает «дом», но в непосредственном контексте обозначает здание храма; русское «стена дома» могло бы создать неверную бытовую ассоциацию.
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: крыла другого херувима
  rationale: Сохранены единственное число и значение אַחֵר «другой», без истолковывающей замены на «второй».
