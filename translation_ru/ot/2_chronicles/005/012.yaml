  text: וְ/הַ/לְוִיִּ֣ם הַ/מְשֹׁרֲרִ֣ים לְ/כֻלָּ֡/ם לְ/אָסָ֡ף לְ/הֵימָ֣ן לִֽ֠/ידֻתוּן וְ/לִ/בְנֵי/הֶ֨ם וְ/לַ/אֲחֵי/הֶ֜ם מְלֻבָּשִׁ֣ים בּ֗וּץ בִּ/מְצִלְתַּ֨יִם֙ וּ/בִ/נְבָלִ֣ים וְ/כִנֹּר֔וֹת עֹמְדִ֖ים מִזְרָ֣ח לַ/מִּזְבֵּ֑חַ וְ/עִמָּ/הֶ֤ם כֹּֽהֲנִים֙ לְ/מֵאָ֣ה וְ/עֶשְׂרִ֔ים מחצררים בַּ/חֲצֹֽצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: ru
  text: 'А левиты-певцы — все они: Асаф, Еман, Идифун, их сыновья и братья, — одетые в виссон, с кимвалами, арфами[a] и лирами, стояли к востоку от жертвенника[b]; с ними были сто двадцать священников, трубивших в трубы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «инструментами наподобие арф»; точное различие между названными здесь древними струнными инструментами неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стояли с восточной стороны жертвенника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: левиты-певцы
  rationale: Причастие определяет левитов по их служению; сложное наименование естественно и ясно по-русски.
- source_word: לְכֻלָּם
  choice: все они
  rationale: Сохраняет подчеркнутую полноту названной группы.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: Асаф, Еман, Идифун
  rationale: Устоявшиеся русские библейские формы личных имён.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: их сыновья и братья
  rationale: Прямо сохраняет оба родственных обозначения, не заменяя второе более широким толкованием.
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: одетые в виссон
  rationale: «Виссон» — традиционное и точное русское обозначение высококачественной льняной ткани в храмовом контексте.
- source_word: בִּמְצִלְתַּיִם
  choice: с кимвалами
  rationale: Стандартное русское название древнего ударного инструмента; предлог передаёт инструментальное ב.
- source_word: וּבִנְבָלִים
  choice: арфами
  rationale: Общепринятый эквивалент נבל; точное устройство древнего инструмента остаётся неясным и отмечено в сноске.
- source_word: וְכִנֹּרוֹת
  choice: лирами
  rationale: Позволяет различить два названных в еврейском тексте вида струнных инструментов.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: стояли к востоку от жертвенника
  rationale: Естественно передаёт локативное значение מִזְרָח, не уточняя сверх источника точную границу расположения.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: с ними были сто двадцать священников
  rationale: Добавленная по нормам русского языка связка ясно передаёт еврейскую именную конструкцию.
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: трубивших в трубы
  rationale: Причастие передаёт действие священников, а «трубы» — храмовые металлические трубы חֲצֹצְרוֹת.
