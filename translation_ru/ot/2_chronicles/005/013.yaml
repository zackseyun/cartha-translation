  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: ru
  text: 'И было: трубачи и певцы были как один, чтобы единым голосом славить и благодарить Яхве; и когда они возвысили голос под звуки труб, кимвалов и музыкальных инструментов, славя Яхве: «Ибо Он благ, ибо милость Его вечна», — дом, дом Яхве, наполнился облаком.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И когда… тогда
  rationale: В данном длинном предложении повествовательная формула вводит обстоятельства и итог события; русская соотносительная конструкция естественно передаёт эту связь без архаизма «и было».
- source_word: כְאֶחָד
  choice: словно один
  rationale: Сохраняет образ единства исполнителей и его связь с последующим «единым звучанием».
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  choice: единым звучанием
  rationale: Передаёт конкретную идею одного, согласного звука естественным современным русским выражением.
- source_word: לְהַלֵּל וּלְהֹדוֹת
  choice: восхваляли и благодарили
  rationale: Сохраняет оба различных действия и их направленность к Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: וּכְהָרִים קוֹל
  choice: когда они возвысили голос
  rationale: Естественный русский эквивалент выражения с коллективным единственным числом קוֹל.
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: при звуке труб, кимвалов и музыкальных инструментов
  rationale: Ясно показывает инструментальное сопровождение; «кимвалы» — точное и принятое название парного ударного инструмента.
- source_word: כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ
  choice: Ибо Он благ, ибо милость Его вечна
  rationale: Сохраняет параллелизм литургической формулы; «милость» ёмко передаёт благоволение и верность חֶסֶד, а «вечна» буквально отражает לְעוֹלָם без добавленного глагола.
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: тогда дом, дом Яхве, наполнился облаком
  rationale: Сохранены повтор «дом» и пояснительное приложение; неопределённое «облаком» соответствует еврейскому тексту.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя; транслитерация сохраняет его и не превращает в титул.
- issue: Передача חַסְדּוֹ
  choice: милость Его
  alternative: Его неизменная любовь
  rationale: «Милость» — естественное и традиционно понятное русское обозначение благой, верной расположенности Бога; при этом стих сам подчёркивает её вечность. Более развёрнутый вариант мог бы яснее выразить устойчивость, но сильнее истолковывал бы многозначный термин.
- issue: Связь прямой речи с восхвалением
  choice: двоеточие без добавления «говоря»
  alternative: восхваляли Яхве, говоря
  rationale: Еврейский текст не содержит отдельного глагола речи; пунктуация позволяет естественно ввести содержание хвалы без его добавления.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаическим звучанием. Сохранены длинное движение фразы, повтор «дом, дом Яхве» и литургический параллелизм. Синтаксис слегка упорядочен для ясности на русском.
