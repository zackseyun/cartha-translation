id: 2CH.5.2
reference: 2 Chronicles 5:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: ru
  text: Тогда Соломон собрал в Иерусалиме старейшин Израиля, всех глав колен — вождей отеческих домов сынов Израиля, — чтобы перенести ковчег завета Яхве из города Давида, то есть Сиона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Естественный повествовательный маркер последовательности событий.
- source_word: יַקְהֵיל
  choice: собрал
  rationale: Каузативная форма глагола קהל означает созвать или собрать людей; по-русски «собрал» ясно и естественно.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшин Израиля
  rationale: Устойчивое и точное обозначение признанных руководителей народа.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: всех глав колен
  rationale: В данном общественно-административном контексте מַטּוֹת обозначает колена Израиля, а רָאשֵׁי сохраняет образ главенства.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: вождей отеческих домов
  rationale: נְשִׂיאֵי указывает на руководителей, а הָאָבוֹת — на родовые объединения, организованные по отцовской линии; формулировка сохраняет древнюю общественную структуру.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Буквально сохраняет родословно-заветное наименование народа, важное в контексте коленной организации.
- source_word: אֶל יְרוּשָׁלִָם
  choice: в Иерусалиме
  rationale: При русском глаголе «собрал» место собрания естественно выражается предложным оборотом «в Иерусалиме»; еврейский предлог допускает направительно-локативное понимание.
- source_word: לְהַעֲלוֹת
  choice: чтобы перенести
  rationale: Глагол буквально связан с движением вверх, однако здесь обозначает доставку ковчега из города Давида к храму; «перенести» естественно передаёт действие, не утверждая способ транспортировки.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохраняет прозрачную конструкцию принадлежности и заветное значение выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: מֵעִיר דָּוִיד
  choice: из города Давида
  rationale: Прямое и ясное воспроизведение исходного локативного выражения.
- source_word: הִיא צִיּוֹן
  choice: то есть Сиона
  rationale: Передаёт пояснительное отождествление города Давида с Сионом; падеж согласован с русской синтаксической конструкцией.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное заветное имя; транслитерация «Яхве» сохраняет это различие без замены титулом.
- issue: Передача родоплеменной структуры выражений לִבְנֵי יִשְׂרָאֵל и הָאָבוֹת
  choice: «сынов Израиля» и «отеческих домов»
  alternative: «израильтян» и «родов»
  rationale: Более формальная передача сохраняет выраженную в тексте родословную и патрилинейную организацию, существенную для состава собравшихся.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён для ясности, но сохранены древние общественные термины «старейшины», «колена», «вожди» и «отеческие дома». Тире показывает, что «вожди отеческих домов» поясняют «глав колен», не устраняя возможной синтаксической напряжённости еврейского перечисления.
