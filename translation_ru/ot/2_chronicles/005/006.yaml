base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: ru
  text: И царь Соломон, и всё собрание Израиля, собравшееся при нём перед ковчегом, приносили в жертву мелкий и крупный скот, которого из-за множества нельзя было ни исчислить, ни сосчитать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: всё собрание Израиля
  rationale: «Собрание» естественно передаёт собравшуюся общину как единое целое; определённый артикль при כָל поддерживает «всё собрание».
- source_word: הַנּוֹעָדִים
  choice: собравшееся
  rationale: Причастие нифаля обозначает созванных или сошедшихся людей; согласование по смыслу с собирательным существительным «собрание» даёт естественную русскую фразу.
- source_word: עָלָיו
  choice: к нему
  rationale: Предлог עַל здесь допускает понимание собрания, сошедшегося к Соломону или находившегося при нём; «к нему» сохраняет связь с Соломоном, не смешивая её со следующим לִפְנֵי «перед».
- source_word: לִפְנֵי הָאָרוֹן
  choice: перед ковчегом
  rationale: Прямое пространственное значение выражения; «ковчег» сохраняет принятую библейскую терминологию без добавления отсутствующего в стихе уточнения.
- source_word: מְזַבְּחִים
  choice: приносили в жертву
  rationale: Причастие изображает продолжающееся действие; эта русская конструкция ясно выражает жертвенный смысл глагола זבח.
- source_word: צֹאן וּבָקָר
  choice: мелкий и крупный скот
  rationale: צֹאן охватывает овец и коз, а בָּקָר — крупный рогатый скот; родовые обозначения точнее, чем сужающее «овец и волов».
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  choice: столько, что его невозможно было ни исчислить, ни сосчитать
  rationale: Сохраняются оба близких по смыслу глагола как средство усиления, а מֵרֹב естественно передаётся конструкцией следствия, указывающей на чрезвычайное множество.
