revisions:
- from: А царь Соломон и всё собрание Израиля, собравшееся к нему[a] перед ковчегом, приносили в жертву мелкий и крупный скот — столько, что его невозможно было ни исчислить, ни сосчитать.
  to: И царь Соломон, и всё собрание Израиля, собравшееся при нём перед ковчегом, приносили в жертву мелкий и крупный скот, которого из-за множества нельзя было ни исчислить, ни сосчитать.
  rationale: Скорректировано значение выражения עָלָיו, чтобы не предпочесть без необходимости направленное «к нему»; неоднозначность сохранена в сноске. «Из-за множества» прямо передаёт מֵרֹב, а «которого» ясно относит оба глагола счёта к принесённому в жертву скоту. Смысл и регистр исходного текста сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:38:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Соломон и всё собрание Израиля находятся у ковчега и совершают жертвоприношения многочисленного скота. Однако «собравшееся к нему» придаёт עָלָיו излишне направленное значение; в контексте естественнее «при нём», при сохранении альтернативы в сноске. Конструкция «столько, что...» передаёт результат, но не выражает прямо указанную в מֵרֹב причину; её следует сохранить как «из-за множества».'
  naturalness: «Мелкий и крупный скот» и «приносили в жертву» естественны в современном литературном русском и соответствуют умеренно торжественному библейскому регистру. Переработанная относительная конструкция будет также яснее связывать невозможность счёта именно с животными.
  terminology: «Собрание Израиля», «ковчег», «приносили в жертву», «мелкий и крупный скот» удачны. Родовое обозначение «мелкий скот» обоснованно сохраняет широту צֹאן, включающего не только овец, но и коз.
  issues:
  - severity: medium
    issue: «собравшееся к нему» сужает значение עָלָיו
    rationale: «К нему» прежде всего обозначает движение по направлению к Соломону, тогда как выражение допускает также смысл присутствия при нём или совместного собрания. «При нём» лучше подходит к описанию уже собравшихся участников и не устраняет неоднозначность, отражённую в сноске.
  - severity: low
    issue: Не выражена прямо причинная функция מֵרֹב
    rationale: '«Столько, что его невозможно было...» передаёт близкий смысл, но еврейский текст прямо называет причину невозможности счёта: множество животных. «Из-за множества» сохраняет эту связь.'
  revised_text: И царь Соломон, и всё собрание Израиля, собравшееся при нём перед ковчегом, приносили в жертву мелкий и крупный скот, которого из-за множества нельзя было ни исчислить, ни сосчитать.
  revised_footnotes:
  - marker: a
    text: 'Или: «собравшееся к нему» или «собравшееся вместе с ним». Еврейское выражение может обозначать собрание, находившееся при Соломоне, сошедшееся к нему или собравшееся вместе с ним.'
    reason: lexical_alternative
