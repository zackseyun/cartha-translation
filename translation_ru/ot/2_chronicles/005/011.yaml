  source_fidelity: 'Основной смысл передан верно: священники выходят из святилища, все присутствовавшие совершили требуемое ритуальное освящение, а обычное распределение по чередам не соблюдалось. Однако «порядок своих черед» несколько избыточно конкретизирует исходное «по чередам/разделениям», а «ведь» добавляет разговорно-прагматический оттенок, которого пояснительный כִּי не требует.'
