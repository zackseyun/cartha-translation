  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: ru
  text: Когда священники вышли из святилища — ибо все присутствовавшие священники освятились, не соблюдая черед[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не соблюдая разделения на череды»; речь идёт об обычном распределении священников по служебным чередам.'
    reason: Лексико-контекстуальное пояснение מַחְלְקוֹת и альтернативный способ передать выражение אֵין לִשְׁמֹר לְמַחְלְקוֹת.
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Когда … вышли
  rationale: Конструкция с וַיְהִי и инфинитивом בְּצֵאת вводит временное обстоятельство. Русское «Когда … вышли» естественно передаёт ход повествования без избыточного буквального «и было».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное и точное соответствие храмовому термину.
- source_word: מִן הַקֹּדֶשׁ
  choice: из святилища
  rationale: В данном храмовом контексте הַקֹּדֶשׁ обозначает священное помещение, откуда вышли священники. «Святилище» звучит естественно и сохраняет культовый смысл.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит пояснение к обстоятельствам происходящего; «ведь» естественно передаёт эту пояснительную функцию.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: все находившиеся там священники
  rationale: Причастие מצא здесь указывает на тех, кто присутствовал или оказался на месте. Добавление «там» делает русскую фразу ясной, не меняя смысла.
- source_word: הִתְקַדָּשׁוּ
  choice: освятили себя
  rationale: Форма хитпаэль от קדש обозначает ритуальное приготовление священников к храмовому служению. Формулировка сохраняет культовый смысл и возвратное значение формы.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: не придерживаясь порядка своих черед
  rationale: Выражение буквально указывает на отсутствие соблюдения установленного деления священников на служебные группы. «Череды» точно обозначают смены священнического служения, а слово «порядка» проясняет синтаксическую связь.
theological_decisions:
- issue: Характер освящения священников
  choice: освятили себя
  alternative: очистились; посвятили себя
  rationale: Речь идёт о ритуальном приготовлении к храмовому служению, а не о нравственном освящении в позднейшем богословском смысле. «Очистились» чрезмерно сужает значение до очищения, а «посвятили себя» может подразумевать новое посвящение в сан.
- issue: Соблюдение священнических черед
  choice: не придерживаясь порядка своих черед
  alternative: без соблюдения деления на группы
  rationale: Текст подчёркивает, что в этот особый момент служили все присутствовавшие освящённые священники, а обычный порядок смен не соблюдался. Перевод не объясняет причины и не придаёт этому богословской оценки.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной храмовой лексикой. Сохранена незавершённость стиха: временная конструкция продолжается в следующем стихе. Парные тире выделяют пояснительную вставку, как того требует русский синтаксис.'
