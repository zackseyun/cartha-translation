id: 2CH.5.7
reference: 2 Chronicles 5:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: ru
  text: Тогда священники внесли ковчег завета Яхве на его место — во внутреннее святилище дома, в Святое святых[a], под крылья херувимов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в самое святое место».'
    reason: Лексико-грамматическая альтернатива передачи еврейского выражения קֹדֶשׁ הַקְּדָשִׁים.
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: внесли
  rationale: Порода hифиль глагола בוא означает «принести, ввести»; в контексте перенесения ковчега внутрь святилища русское «внесли» передаёт и движение, и повествовательную последовательность.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямой перевод определённой формы множественного числа; именно священники выступают действующим лицом.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохранена еврейская цепочка сопряжённых форм и явно выраженная связь ковчега с заветом Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: מְקוֹמוֹ
  choice: на его место
  rationale: Местоименный суффикс относится к ковчегу; формулировка естественна по-русски и не добавляет отсутствующего в тексте уточнения «предназначенное».
- source_word: דְּבִיר הַבַּיִת
  choice: во внутреннее святилище дома
  rationale: דְּבִיר обозначает внутреннейшую храмовую палату; «внутреннее святилище» передаёт её назначение, а «дома» сохраняет буквальное значение הַבַּיִת без замены на «храм».
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: в Святое святых
  rationale: Традиционное и понятное русское обозначение высшей степени святости, выраженной еврейской конструкцией; альтернативный прозрачный перевод вынесен в примечание.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: под крылья херувимов
  rationale: Точно передаёт пространственное отношение и форму сопряжённого множественного числа; «херувимы» — укоренившееся русское наименование этих небесных существ.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» передаёт его без замены титулом и без предпочтения поздней огласовки «Иегова».
- issue: Передача выражения קֹדֶשׁ הַקְּדָשִׁים
  choice: Святое святых
  alternative: самое святое место
  rationale: Основной текст сохраняет традиционную форму еврейского усилительного оборота, а примечание показывает его смысл, не устраняя возможную разницу в способе передачи.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным регистром. Слово «дом» сохранено как храмовое наименование из исходного текста; тире естественно вводит поясняющую последовательность местоположений.
