  text: וַ/יִּהְי֤וּ הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם עַל מְק֖וֹם הָ/אָר֑וֹן וַ/יְכַסּ֧וּ הַ/כְּרוּבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: ru
  text: Херувимы простирали крылья над местом ковчега[a], и херувимы покрывали сверху ковчег и его шесты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «держали крылья распростёртыми над местом ковчега».'
    reason: Еврейская конструкция может подчёркивать не разворачивающееся действие, а продолжающееся положение крыльев.
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: простирали
  rationale: Сочетание היה с причастием описывает продолжающееся положение или действие; несовершенный вид естественно передаёт это по-русски.
- source_word: הַכְּרוּבִים
  choice: херувимы
  rationale: Устоявшееся русское библейское название небесных существ-хранителей; оно уместно в храмовом контексте.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: простирали крылья
  rationale: Глагол פרשׂ означает расправлять, простирать или распространять; выбранное выражение точно и сохраняет достоинство стиля.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: над местом ковчега
  rationale: Сохранено прямо выраженное в еврейском тексте слово מָקוֹם («место»), поскольку в следующей части стиха отдельно назван сам ковчег.
- source_word: וַיְכַסּוּ
  choice: покрывали
  rationale: Прямое значение כסה — «покрывать»; более образное «осеняли» внесло бы дополнительный оттенок.
- source_word: בַּדָּיו
  choice: его шесты
  rationale: Речь идёт о шестах для переноски ковчега; «шесты» — ясное современное обозначение.
- source_word: מִלְמָעְלָה
  choice: сверху
  rationale: Наречие указывает, что ковчег и шесты были покрыты крыльями сверху.
