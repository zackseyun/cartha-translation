    rationale: В русском он обычно описывает поднятие предмета, а не его транспортировку к месту назначения. В данном храмовом контексте «внесли» точнее передаёт функцию каузативного עלה и не вносит нового смысла.
  revised_text: И внесли ковчег, шатёр встречи и всю священную утварь, которая была в шатре; внесли их священники-левиты[a].
