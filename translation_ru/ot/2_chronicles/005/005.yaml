base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: ru
  text: И внесли ковчег, шатёр встречи и всю священную утварь, которая была в шатре; внесли их священники-левиты[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «священники, левиты».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: подняли / подняли
  rationale: Каузативная форма глагола עלה передаёт перемещение вверх, к храму. Повтор одного и того же глагола сохраняет заметный повтор еврейского текста.
- source_word: הָאָרוֹן
  choice: ковчег
  rationale: В источнике употреблено краткое обозначение «ковчег», без добавления «завета»; контекст ясно указывает, о каком ковчеге идёт речь.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Перевод сохраняет образ шатра и значение назначенного места встречи, не заменяя выражение более традиционным, но менее прозрачным словом «скиния».
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: всю священную утварь
  rationale: Собирательное «утварь» естественно обозначает принадлежности святилища, а «священную» прямо передаёт הַקֹּדֶשׁ.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: которая была в шатре
  rationale: Относительное придаточное отнесено к священной утвари и сохраняет повтор слова «шатёр».
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священники-левиты
  rationale: Дефисное сочетание естественно по-русски обозначает священников, принадлежавших к левитам, и не создаёт впечатления, будто все левиты были священниками. Более буквальная приложительная конструкция приведена в сноске.
theological_decisions:
- issue: Соотношение «священников» и «левитов» в выражении הַכֹּהֲנִים הַלְוִיִּם
  choice: священники-левиты
  alternative: священники, левиты
  rationale: Основной вариант читается естественно и не стирает различие между священниками и левитами; сноска сохраняет формальную неоднозначность еврейского приложения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксический повтор «подняли… подняли» и точка с запятой сохраняют композицию еврейской фразы; архаизмы по возможности не используются.
