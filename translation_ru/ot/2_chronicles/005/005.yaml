revisions:
- from: И подняли ковчег, шатёр встречи и всю священную утварь, которая была в шатре; подняли их священники-левиты[a].
  to: И внесли ковчег, шатёр встречи и всю священную утварь, которая была в шатре; внесли их священники-левиты[a].
  rationale: Заменён только глагол «подняли» на «внесли» в обоих случаях. Это устраняет русскую смысловую неясность, естественно описывает перенос святынь в храм и сохраняет повтор, присутствующий в еврейском тексте. Сноска и прочая терминология сохранены.
