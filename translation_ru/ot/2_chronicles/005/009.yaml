  rationale: Правка точнее передаёт каузативную форму וַיַּאֲרִיכוּ и пространственную связь מִן־הָאָרוֹן עַל־פְּנֵי הַדְּבִיר, устраняя русскую двусмысленность «из ковчега». Сохранены контраст внутренней видимости и невидимости снаружи, а также авторская формула «по сей день».
