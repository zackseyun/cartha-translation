base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: ru
  text: Шесты сделали длинными, так что их концы выступали от ковчега перед внутренним святилищем[a], но снаружи их не было видно; и остаются там по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Святым святых».'
    reason: דְּבִיר обозначает внутреннее, самое святое помещение храма; вариант передаёт его традиционное культовое название.
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: вытянули так далеко
  rationale: Каузативная форма глагола ארך означает, что шесты сделали длиннее или далеко выдвинули. Формулировка сохраняет действие и естественно передаёт его пространственный результат, не уточняя способ.
- source_word: הַבַּדִּים
  choice: шесты
  rationale: Речь идёт о шестах для переноски ковчега; это ясное и привычное современное обозначение.
- source_word: רָאשֵׁי הַבַּדִּים
  choice: концы шестов
  rationale: Буквально רָאשֵׁי — «головы», но применительно к шестам естественное русское соответствие — «концы».
- source_word: מִן הָאָרוֹן
  choice: из ковчега
  rationale: Предлог מִן указывает исходную пространственную точку. Перевод сохраняет необычную формулировку еврейского текста и не добавляет отсутствующего пояснения.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: перед внутренним святилищем
  rationale: עַל פְּנֵי в данном пространственном контексте передано как «перед», а דְּבִיר — как архитектурно прозрачное «внутреннее святилище».
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: но снаружи их не было видно
  rationale: Формулировка естественно передаёт противопоставление видимости внутри и невидимости снаружи.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: Они остаются там и по сей день
  rationale: Несмотря на единственное число еврейского глагола, по смыслу речь о шестах. Настоящее время передаёт продолжающееся состояние в устойчивом выражении «по сей день».
