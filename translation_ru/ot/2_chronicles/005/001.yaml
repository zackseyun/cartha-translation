revisions:
- from: Так была завершена вся работа, которую Соломон выполнил для дома Яхве. Затем Соломон внёс священные вещи своего отца Давида[a] — серебро, золото и всю утварь — и поместил их в сокровищницы дома Бога.
  to: Так была завершена вся работа, которую Соломон выполнил для дома Яхве. Затем Соломон внёс священные предметы Давида, своего отца[a], а также серебро, золото и всю утварь и поместил их в сокровищницы дома Бога.
  rationale: Перестроено только перечисление после «священных предметов», чтобы не делать его пояснительным приложением. «Вещи» заменено на более точное в данном контексте «предметы»; сноска приведена в соответствие с основной формулировкой и сохраняет лексическую неоднозначность.
