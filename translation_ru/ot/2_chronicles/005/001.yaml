  source_fidelity: В первой части смысл передан точно. Однако тире превращает «серебро, золото и всю утварь» в пояснительное приложение к «священным вещам», тогда как еврейский текст последовательно перечисляет эти предметы как отдельные дополнения. Союзное перечисление точнее сохраняет структуру оригинала.
  naturalness: «Внёс» и «сокровищницы» естественны для современного литературного русского в умеренно торжественном библейском регистре. Замена тире на «а также» устраняет не вполне оправданную пояснительную интонацию и делает фразу яснее.
  terminology: «Дом Яхве» и «дом Бога» удачно сохраняют различие בֵּית־יְהוָה / בֵּית הָאֱלֹהִים. Для קָדְשֵׁי предпочтительно «священные предметы»; примечание указывает возможный оттенок «посвящённые».
