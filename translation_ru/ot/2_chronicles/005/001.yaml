source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: ru
  text: Так была завершена вся работа, которую Соломон выполнил для дома Яхве. Затем Соломон внёс священные предметы Давида, своего отца[a], а также серебро, золото и всю утварь и поместил их в сокровищницы дома Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святыни Давида, его отца»; возможно также: «предметы, посвящённые Давидом, его отцом».'
    reason: Лексема קָדְשֵׁי обозначает священные, посвящённые предметы; генитивная конструкция допускает передачу с акцентом на посвящении Давидом.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: была завершена
  rationale: Глагол от שלם выражает достижение завершённости; пассивная конструкция естественно передаёт результативный смысл.
- source_word: כָּל הַמְּלָאכָה
  choice: вся работа
  rationale: מְלָאכָה обозначает весь комплекс работ по сооружению и оснащению храма.
- source_word: לְבֵית יְהוָה
  choice: для дома Яхве
  rationale: Сохраняются образ «дома», значение целевого לְ и личное имя יְהוָה.
- source_word: וַיָּבֵא
  choice: внёс
  rationale: Hифиль глагола בוא здесь означает внесение предметов внутрь храмового комплекса.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: священные вещи своего отца Давида
  rationale: Форма множественного числа в сопряжённом состоянии обозначает вещи, отделённые для священного назначения; буквальная формулировка сохраняет некоторую лексическую широту.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: серебро, золото
  rationale: Перечисление передано ясно и естественно по-русски, без избыточного повторения артикля, отсутствующего в русском языке.
- source_word: כָּל הַכֵּלִים
  choice: всю утварь
  rationale: כֵּלִים — широкое обозначение предметов и принадлежностей; «утварь» уместно и достойно звучит в храмовом контексте.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: поместил в сокровищницы
  rationale: נתן в данном контексте означает «поместить», а множественное אֹצְרוֹת указывает на несколько хранилищ или кладовых.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Бога
  rationale: Сохранены метафора дома и отличие אֱלֹהִים от употреблённого ранее личного имени Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо содержит тетраграмматон; транслитерация сохраняет личное имя Бога и отличает его от титула.
- issue: Различие между בֵּית יְהוָה и בֵּית הָאֱלֹהִים
  choice: «дом Яхве» и «дом Бога»
  alternative: В обоих случаях «храм»
  rationale: Сохранение двух выражений отражает намеренную лексическую вариативность еврейского текста и не сглаживает её.
- issue: Значение קָדְשֵׁי
  choice: священные вещи
  alternative: вещи, посвящённые Давидом
  rationale: Основной текст сохраняет широкое значение существительного, а возможный акцент на акте посвящения вынесен в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранён образ «дома» вместо пояснительного «храма»; синтаксис перечня сделан естественным для русского языка.
