  text: וַ/יָּבֹ֕אוּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הַ/לְוִיִּ֖ם אֶת הָ/אָרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/004.yaml
  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: ru
  text: И пришли все старейшины Израиля, и левиты понесли ковчег[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ковчег завета, как ясно из контекста.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Форма wayyiqtol от בוא передаёт следующее событие повествования; «пришли» естественно и точно выражает движение к месту действия.
- source_word: כֹּל
  choice: все
  rationale: Слово охватывает всю названную далее группу старейшин и прямо передаёт полноту собрания.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшины Израиля
  rationale: Сочетание обозначает признанных представителей и руководителей Израиля; выбранная формулировка нормативна для современного литературного русского языка.
- source_word: וַיִּשְׂאוּ
  choice: понесли
  rationale: В данном контексте נשׂא означает поднять и нести ковчег. «Понесли» ясно передаёт начало его переноса и сохраняет последовательность повествования.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое и точное русское наименование представителей колена Левия и храмовых служителей.
- source_word: אֶת הָאָרוֹן
  choice: ковчег
  rationale: В храмовом контексте אָרוֹן обозначает ковчег завета, однако в самом стихе сказано только «ковчег», поэтому уточнение не внесено в основной текст.
theological_decisions:
- issue: Наименование ковчега
  choice: В основном тексте оставить «ковчег».
  alternative: «ковчег завета»
  rationale: Еврейский текст содержит только הָאָרוֹן («ковчег»). Контекст однозначно указывает на ковчег завета, но перевод не должен добавлять отсутствующее в стихе определение; оно поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор союза «и» сохраняет последовательную структуру еврейского рассказа, не создавая неестественной архаичности.
