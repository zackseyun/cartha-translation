base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: ru
  text: В ковчеге не было ничего, кроме двух скрижалей, которые Моисей положил туда[a] на Хориве, когда Яхве заключил завет с израильтянами при их выходе из Египта.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые Моисей дал на Хориве»; здесь глагол «дал» означает, что Моисей поместил скрижали в ковчег.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст: «которые Яхве заключил с сынами Израиля…»; слово «завет» в этой части не повторено, но подразумевается в устойчивом выражении «заключить завет». Относительный оборот может передаваться также: «когда Яхве заключил завет…».'
    reason: source_ambiguity
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: В ковчеге не было ничего, кроме
  rationale: Естественная русская конструкция точно передаёт еврейское отрицание существования с ограничительной частицей רַק.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: двух скрижалей
  rationale: «Скрижали» — традиционное и понятное русское обозначение данных Богом табличек; слово «каменных» в этом стихе отсутствует и поэтому не добавлено.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: которые Моисей положил туда
  rationale: Глагол נָתַן буквально означает «дал», но в данном пространственном контексте имеет смысл помещения скрижалей в ковчег; «туда» делает подразумеваемое место ясным.
- source_word: בְּחֹרֵב
  choice: на Хориве
  rationale: Сохранено данное в еврейском тексте название Хорив без гармонизации с названием Синай; предлог «на» соответствует устойчивому русскому употреблению.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: когда Яхве заключил завет с
  rationale: כָּרַת — часть устойчивого выражения «заключить завет»; само слово «завет» здесь подразумевается. «Когда» естественно связывает событие с пребыванием на Хориве, не превращая относительное אֲשֶׁר в указание на отдельное место.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное заветное имя Бога, а не заменено титулом «Господь».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтянами
  rationale: Современный русский коллективный эквивалент буквального выражения «сыны Израиля».
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: при их выходе из Египта
  rationale: Кратко и естественно передаёт временную конструкцию с инфинитивом и сохраняет прямую отсылку к исходу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя без подмены титулом.
- issue: Подразумеваемый завет в выражении אֲשֶׁר כָּרַת
  choice: когда Яхве заключил завет
  alternative: которые Яхве заключил с израильтянами
  rationale: Еврейский текст буквально не повторяет существительное «завет» и допускает тесную связь относительного местоимения со скрижалями. В русском языке требуется восполнить подразумеваемый объект глагола כָּרַת; выбранная формулировка сохраняет связь скрижалей с заключением завета, а формальная особенность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с привычной библейской лексемой «скрижали». Синтаксис сделан ясным для обычного читателя, а необычное относительное построение оригинала и метонимическая связь скрижалей с заветом сохранены в примечании.
