base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: ru
  text: И священники не могли стоять, совершая служение, из-за облака, потому что слава Яхве наполнила дом Божий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм Божий»; букв.: «дом Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: могли
  rationale: Глагол выражает способность или возможность; сочетание «не могли» естественно передаёт отрицание этой способности.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямое соответствие определённому существительному во множественном числе в храмовом контексте.
- source_word: לַעֲמוֹד
  choice: стоять
  rationale: Сохраняет конкретный образ исходного глагола и не уточняет без необходимости, означает ли он просто стоять или оставаться на своём месте.
- source_word: לְשָׁרֵת
  choice: совершать служение
  rationale: В священническом контексте глагол обозначает храмовое служение; эта формулировка точнее общего «служить».
- source_word: מִפְּנֵי
  choice: из-за
  rationale: В данном контексте предлог выражает причину невозможности продолжать служение.
- source_word: הֶעָנָן
  choice: облака
  rationale: Передаёт определённое существительное без добавочного истолкования природы облака.
- source_word: כִּי
  choice: потому что
  rationale: Явно передаёт причинно-пояснительную связь со сказанным ранее.
- source_word: מָלֵא
  choice: наполнила
  rationale: Форма глагола согласована в русском с подлежащим «слава» и естественно передаёт завершённое событие повествования.
- source_word: כְבוֹד יְהוָה
  choice: слава Яхве
  rationale: Сохраняет конструкцию принадлежности и передаёт личное имя יְהוָה транслитерацией.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Сохраняет буквальный образ «дома Бога» в естественной для современного литературного русского форме; контекстуальное «храм Божий» дано как вариант в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие, не подменяя имя титулом.
- issue: Характер славы Яхве и облака
  choice: Не добавлять пояснений к словам «слава» и «облако»
  alternative: Истолковать их как особое видимое присутствие Бога
  rationale: Стих связывает облако с наполнением дома славой Яхве, но не формулирует их точное отношение; перевод сохраняет эту богословскую напряжённость без дополнительных объяснений.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Сочетание «стоять и совершать служение» сохраняет конкретность еврейского текста, хотя в русском оно слегка формально; это предпочтено более истолковывающему «продолжать служение».
