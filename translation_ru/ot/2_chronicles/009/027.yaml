  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: ru
  text: Царь сделал серебро в Иерусалиме столь же обычным, как камни, а кедры — столь же многочисленными, как сикоморы в Шефеле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шефела — область иудейских предгорий к западу от центральной горной страны; название можно перевести как «низменность».
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: сделал
  rationale: 'Буквально глагол означает «дал» или «поместил», но в данном обороте выражает результат действий царя: серебро и кедры стали чрезвычайно распространёнными.'
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: Речь идёт о драгоценном металле, а не обязательно о деньгах или монетах.
- source_word: כָּאֲבָנִים
  choice: столь же обычным, как камни
  rationale: Сравнение указывает на изобилие и повсеместность серебра, а не на внешнее сходство.
- source_word: הָאֲרָזִים
  choice: кедры
  rationale: Форма множественного числа может обозначать как кедровые деревья, так и кедровую древесину; краткое «кедры» сохраняет образ и широту значения.
- source_word: כַּשִּׁקְמִים
  choice: столь же многочисленными, как сикоморы
  rationale: Сикомора — ближневосточная смоковница; сравнительный оборот передаёт количественный смысл еврейского выражения.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: в Шефеле
  rationale: С определённым артиклем слово обозначает известную географическую область — Иудейскую низменность и предгорья; транслитерация сохраняет топонимический характер названия.
- source_word: לָרֹב
  choice: столь же многочисленными
  rationale: Выражение подчёркивает великое множество кедров и естественно включено в сравнительную конструкцию.
