  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: ru
  text: А прочие деяния Соломона, от начала до конца, разве не записаны в повествовании пророка Нафана[a], в пророчестве Ахии из Силома и в видениях прозорливца Йедо[b] о Иеровоаме[c], сыне Навата?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в словах пророка Нафана». Еврейское слово в таких летописных формулах может обозначать слова, дела или письменное повествование.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит имя «Йедо»; его обычно отождествляют с Иддо.
    reason: textual_alternative
  - marker: c
    text: Еврейский предлог можно также перевести «против Иеровоама». В данном перечне источников естественнее значение «о, относительно».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: А прочие деяния Соломона
  rationale: В итоговой царской формуле דִּבְרֵי обозначает не только слова, но дела и события правления; «деяния» естественно передаёт историографический смысл. Союз וּ сохранён как «А».
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: от первых до последних
  rationale: Русская формула сохраняет значение полного временного охвата, буквально отражая противопоставление первых и последних.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: Сохранён риторический вопрос; «записаны» в данном контексте естественнее русского «написаны» и указывает на письменные источники.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: в повествовании пророка Нафана
  rationale: При כתב и перечислении источников עַל естественно передаётся русским «в». דִּבְרֵי здесь, вероятно, обозначает письменное повествование, но его более буквальное значение отмечено в сноске.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: в пророчестве Ахии из Силома
  rationale: נְבוּאָה прямо означает «пророчество»; принадлежность к Силому передана понятным современным оборотом вместо менее прозрачного «силомлянин».
- source_word: וּבַחֲזוֹת יעדי הַחֹזֶה
  choice: и в видениях прозорливца Иддо
  rationale: חֲזוֹת передано как множественное «видения». Для חֹזֶה выбрано «прозорливец», чтобы сохранить различие с נָבִיא «пророк»; имя следует традиционному отождествлению чтения с Иддо, при текстовой форме, отмеченной в сноске.
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: о Иеровоаме, сыне Навата
  rationale: В контексте библиографической ссылки עַל естественнее всего обозначает предмет видений — «о»; возможность значения «против» сохранена в сноске.
