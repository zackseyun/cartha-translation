source:
  edition: WLC
  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ וְ/אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד וְ/שֹׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: ru
  text: Блаженны твои люди[a], и блаженны эти твои слуги, которые постоянно стоят перед тобой[b] и слушают твою мудрость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Счастливы твои люди». Еврейское слово может обозначать как блаженное, так и счастливое, благополучное состояние.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «стоять перед» царём означает находиться при нём и служить ему.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: блаженны
  rationale: Передаёт состояние особого благополучия и достойной восхищения участи, сохраняя возвышенный тон похвалы; возможное значение «счастливы» отмечено в сноске.
- source_word: אֲנָשֶׁיךָ
  choice: твои люди
  rationale: Естественная современная передача обычного обозначения людей, принадлежащих к окружению царя, без более узкого толкования как чиновников или придворных.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
  rationale: В контексте царского двора речь идёт о служащих царю; слово «слуги» не усиливает смысл до рабского состояния и сохраняет отличие от более общего «люди».
- source_word: אֵלֶּה
  choice: эти
  rationale: Сохраняет указательное значение еврейского слова и непосредственно выделяет присутствующих слуг.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: которые стоят перед тобой
  rationale: Сохраняет буквальный образ и придворное выражение, обозначающее постоянное присутствие и служение при царе.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Передаёт регулярный, продолжающийся характер пребывания при царе, не обязательно подразумевая буквально каждое мгновение.
- source_word: וְשֹׁמְעִים
  choice: и слушают
  rationale: В данном контексте глагол подразумевает не только слышание, но и внимательное восприятие царской мудрости; «слушают» естественнее по-русски.
- source_word: חָכְמָתֶךָ
  choice: твою мудрость
  rationale: Прямо передаёт мудрость, которой обладает и которую выражает царь, не добавляя отсутствующего в тексте упоминания его речей.
