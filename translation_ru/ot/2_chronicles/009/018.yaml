base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: ru
  text: К престолу вели шесть ступеней, и к престолу было прикреплено золотое подножие[a]. По обе стороны от сиденья были подлокотники, а рядом с подлокотниками стояли два льва.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «золотой пандус» или «золотая лестница», прикреплённые к престолу. Значение еврейского слова כֶּבֶשׁ здесь не вполне определённо; в контексте престола хорошо подходит «подножие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: ступеней
  rationale: В описании престола слово обозначает ступени, по которым поднимались к нему; это естественный и точный русский эквивалент.
- source_word: כֶּבֶשׁ
  choice: скамейка для ног
  rationale: В контексте царского престола такое понимание хорошо соответствует предмету перед сиденьем, однако возможное значение «пандус» или «лестница» сохранено в примечании.
- source_word: מָאֳחָזִים
  choice: была прикреплена
  rationale: Страдательное причастие передаёт закреплённость золотого предмета на престоле; согласование во множественном числе в еврейском тексте необычно, но смысл связи с престолом ясен.
- source_word: יָדוֹת
  choice: подлокотники
  rationale: Буквально «руки»; в контексте мебели речь идёт о боковых частях престола, на которые кладут руки.
- source_word: מִזֶּה וּמִזֶּה
  choice: по обе стороны
  rationale: Идиоматично передаёт двустороннее расположение, буквально «с этой и с той стороны».
- source_word: מְקוֹם הַשָּׁבֶת
  choice: от сиденья
  rationale: Выражение буквально означает «у места сидения»; в русском описании мебели естественно указать расположение подлокотников по сторонам сиденья.
- source_word: אֲרָיוֹת
  choice: льва
  rationale: Прямое обозначение двух львов; текст не уточняет материал или способ изображения, поэтому перевод этого не добавляет.
- source_word: עֹמְדִים
  choice: стояли
  rationale: Прямо передаёт положение львов рядом с подлокотниками.
- source_word: אֵצֶל
  choice: рядом с
  rationale: Естественно передаёт непосредственную близость к подлокотникам.
