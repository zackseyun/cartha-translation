base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: ru
  text: У Соломона было четыре тысячи[b] стойл[a] для коней и колесниц и двенадцать тысяч всадников; он разместил их в колесничных городах и при царе в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конюшен». Еврейское слово обозначает места или помещения для содержания коней.'
    reason: lexical_alternative
  - marker: b
    text: В параллельном месте — 3 Царств 4:26 (1 Царств 4:26 в иной нумерации книг) — стоит «сорок тысяч стойл», тогда как здесь, в книге Паралипоменон, — «четыре тысячи».
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: У Соломона было
  rationale: Конструкция היה + ל выражает обладание; этот оборот естественно и точно передаёт её по-русски.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: четыре тысячи
  rationale: Прямая передача еврейского числительного.
- source_word: אֻרְיוֹת
  choice: стойл
  rationale: Слово обозначает отдельные места или помещения для содержания коней; «стойла» точнее, чем более широкое «конюшни».
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: для коней и колесниц
  rationale: Формулировка сохраняет оба существительных исходного текста и естественно связывает их с предназначением стойл, не сводя выражение только к колесничным коням.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: и двенадцать тысяч всадников
  rationale: «Всадники» прямо передаёт обозначение людей, ездящих верхом, без более позднего оттенка слова «кавалеристы».
- source_word: וַיַּנִּיחֵם
  choice: он разместил их
  rationale: В военно-административном контексте глагол означает расположить или определить по местам; «разместил» сохраняет широкий охват местоимения.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: в колесничных городах
  rationale: Так передаётся сочетание, обозначающее города, предназначенные для размещения колесничных сил.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלִָם
  choice: и при царе в Иерусалиме
  rationale: «При царе» естественно выражает пребывание части сил там, где находился царь, не добавляя отсутствующего в еврейском тексте уточнения «часть».
