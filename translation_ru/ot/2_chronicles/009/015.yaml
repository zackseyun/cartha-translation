base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: ru
  text: Царь Соломон сделал двести больших щитов из кованого золота; на каждый щит пошло по шестьсот сиклей[a] кованого золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шестьсот кованого золота пошло на один щит». В еврейском тексте подразумевается мера веса; слово «сиклей» добавлено для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: Обычное значение עשה — «делать, изготовлять»; «сделал» естественно звучит в повествовательном перечне.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: царь Соломон
  rationale: Естественная для современного русского передача титула и имени.
- source_word: מָאתַיִם צִנָּה
  choice: двести больших щитов
  rationale: צִנָּה обозначает крупный щит, вероятно прикрывавший значительную часть тела; определение «больших» сохраняет отличие от меньшего щита מָגֵן.
- source_word: זָהָב שָׁחוּט
  choice: кованое золото
  rationale: שָׁחוּט описывает золото, обработанное ударами и, вероятно, раскованное в пластины; «кованое золото» кратко и понятно передаёт способ обработки.
- source_word: שֵׁשׁ מֵאוֹת
  choice: шестьсот
  rationale: Прямая передача числительного.
- source_word: יַעֲלֶה עַל
  choice: пошло на
  rationale: Оборот передаёт количество материала, употреблённого на изделие, и сохраняет образ еврейского выражения без предположения, что золото полностью покрывало щит.
- source_word: הַצִּנָּה הָאֶחָת
  choice: на каждый щит
  rationale: Буквально «на один щит»; в данном числовом контексте выражение имеет распределительное значение, естественно передаваемое словом «каждый».
- source_word: '[подразумеваемая единица веса после שֵׁשׁ מֵאוֹת]'
  choice: сиклей
  rationale: В еврейском тексте единица веса не названа, но конструкция подразумевает меру веса золота. «Сиклей» делает смысл ясным, а примечание обозначает добавление переводчика.
