  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: ru
  text: И Соломон ответил на все её вопросы[a]; от Соломона не было скрыто ничего, чего бы он ей не разъяснил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщил ей обо всех её делах»; буквальнее: «все её слова».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «не было ничего, скрытого от Соломона, о чём он не сообщил бы ей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: ответил
  rationale: Глагол буквально означает «сказал, сообщил», но в контексте царица испытывает Соломона трудными вопросами, поэтому «ответил» естественно передаёт подразумеваемое действие.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: на все её вопросы
  rationale: דבר может означать «слово», «дело» или «вопрос». Контекст трудных вопросов царицы поддерживает такой перевод, а буквальная широта выражения сохранена в сноске.
- source_word: נֶעְלַם
  choice: было бы скрыто
  rationale: Форма нифаль глагола עלם означает «быть скрытым»; перевод сохраняет исходный образ.
- source_word: דָּבָר
  choice: ничего
  rationale: В сочетании с отрицанием единственное число דבר идиоматически означает «ничто, ничего».
- source_word: מִשְּׁלֹמֹה
  choice: от Соломона
  rationale: Предлог מן при נעלם указывает на того, от кого нечто скрыто.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: чего бы он ей не разъяснил
  rationale: Повторный נגד буквально значит «сообщил», однако в контексте ответов на трудные вопросы «разъяснил» звучит естественно; более буквальный вариант дан в сноске.
