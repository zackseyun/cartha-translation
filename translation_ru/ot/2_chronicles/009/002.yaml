  to: И Соломон ответил на все её вопросы[a]; от Соломона не было скрыто ничего, чего бы он ей не разъяснил[b].
  rationale: Заменено «не осталось ничего» на прямое соответствие еврейскому утверждению «от Соломона не было скрыто ничего». Контекстуальные переводы «ответил на вопросы» и «разъяснил» сохранены, поскольку они естественно отражают ситуацию с трудными вопросами царицы и согласуются с английской аудиторской традицией; более буквальные варианты даны в сносках.
