  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: ru
  text: Но я не верила их словам, пока не пришла и не увидела своими глазами. И вот, мне не было сказано и половины величия твоей мудрости[a]. Ты превзошёл весть, которую я слышала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изобилия твоей мудрости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: не верила
  rationale: В породе хифиль глагол означает считать сообщение истинным или достоверным; «не верила» естественно передаёт реакцию царицы на услышанное.
- source_word: לְדִבְרֵיהֶם
  choice: их словам
  rationale: Формально близко к еврейскому выражению и ясно обозначает переданные ей сведения.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: не увидела всё своими глазами
  rationale: Еврейское «увидели мои глаза» естественно передано русским устойчивым выражением, подчёркивающим личное свидетельство; «всё» восполняет подразумеваемый объект по контексту.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет оттенок привлечения внимания и удивления.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: величия твоей мудрости
  rationale: מַרְבִּית может обозначать величие, изобилие или множество; выбранный вариант передаёт масштаб мудрости и звучит естественно.
- source_word: הֻגַּד לִי
  choice: мне не рассказали
  rationale: Естественная русская передача пассивной формы со значением «мне не было сообщено».
- source_word: יָסַפְתָּ עַל
  choice: ты превзошёл
  rationale: В сочетании с עַל глагол выражает превышение или превосходство над тем, о чём сообщалось.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: то, что я слышала
  rationale: Избегает тяжёлого повтора «слух, который я слышала», сохраняя смысл ранее полученного сообщения.
