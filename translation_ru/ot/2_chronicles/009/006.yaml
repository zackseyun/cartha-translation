revisions:
- from: 'Но я не верила их словам, пока не пришла и не увидела всё своими глазами. И вот, мне не рассказали и половины величия твоей мудрости[a]: ты превзошёл то, что я слышала.'
  to: Но я не верила их словам, пока не пришла и не увидела своими глазами. И вот, мне не было сказано и половины величия твоей мудрости[a]. Ты превзошёл весть, которую я слышала.
  rationale: Убрано невыраженное в оригинале «всё». Пассивная конструкция «мне не было сказано» ближе к הֻגַּד לִי. В заключении восстановлено явное значение «вести/сообщения» для הַשְּׁמוּעָה и сравнительное отношение, выраженное יָסַפְתָּ עַל, при сохранении современного литературного русского языка.
