  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: ru
  text: 'И каждый приносил свой дар[a]: серебряные и золотые изделия, одежды[b], оружие[c], пряности, коней и мулов — из года в год.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё подношение»; возможно также: «свою дань».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «одеяния».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «воинское снаряжение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: приносил
  rationale: Причастие в сочетании с распределительным אִישׁ и заключительным «из года в год» выражает регулярно повторявшееся действие; русское несовершенное прошедшее естественно передаёт этот смысл.
- source_word: אִישׁ מִנְחָתוֹ
  choice: каждый из них … свой дар
  rationale: אִישׁ употреблено распределительно, а מִנְחָה обозначает подношение правителю. «Дар» сохраняет широту значения и не утверждает однозначно, что это была обязательная дань.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: серебряные и золотые изделия
  rationale: כְּלִי — широкое обозначение предмета, сосуда или принадлежности; «изделия» естественно для перечня ценных даров и не сужает категорию до сосудов.
- source_word: וּשְׂלָמוֹת
  choice: одежды
  rationale: Слово обозначает предметы одежды, вероятно дорогие верхние одеяния; общее «одежды» не конкретизирует их вид без достаточных оснований.
- source_word: נֵשֶׁק
  choice: оружие
  rationale: Существительное может относиться к оружию или воинскому снаряжению; «оружие» — ясный основной эквивалент, а более широкая возможность отмечена в сноске.
- source_word: וּבְשָׂמִים
  choice: благовония
  rationale: В контексте царских даров слово обозначает ценные ароматические вещества; «благовония» шире, чем «пряности», и уместно в литературном русском.
- source_word: סוּסִים וּפְרָדִים
  choice: коней и мулов
  rationale: Прямые лексические соответствия; «кони» стилистически естественно в dignified historical narrative.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: из года в год
  rationale: Идиома указывает на ежегодную повторяемость; русское выражение сохраняет её итеративный характер.
theological_decisions:
- issue: Статус מִנְחָה как добровольного дара или обязательной дани
  choice: дар
  alternative: дань; подношение
  rationale: Царский контекст допускает значение дани, однако сам термин шире. Основной текст сохраняет эту неоднозначность, а возможное более узкое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией исторического повествования. Синтаксис упрощён без потери распределительного значения «каждый» и ежегодной повторяемости действия; подлинная неоднозначность ключевых существительных сохранена в сносках.
