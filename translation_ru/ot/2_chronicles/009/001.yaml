translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис разделён на три предложения ради ясности длинного еврейского периода; смысловые связи и последовательность сохранены. Начальное וּ передано без отдельного «и/теперь», поскольку стих естественно начинается назывным субъектом, а связность определяется контекстом.
