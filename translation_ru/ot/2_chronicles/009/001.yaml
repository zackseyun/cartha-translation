source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: ru
  text: Царица Савская услышала о славе Соломона[a] и пришла в Иерусалим, чтобы испытать Соломона загадками. Её сопровождала весьма многочисленная свита и верблюды, навьюченные благовониями, огромным количеством золота и драгоценными камнями. Придя к Соломону, она говорила с ним обо всём, что было у неё на сердце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышала молву о Соломоне».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «всё, что было у неё на сердце» означает всё, что занимало её мысли и волновало её.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: слава
  rationale: В сочетании «услышала шема Соломона» существительное означает распространившуюся молву или известность о Соломоне. «Слава» естественно передаёт это значение по-русски; вариант «молва о Соломоне» отмечен в сноске.
- source_word: לְנַסּוֹת
  choice: испытать
  rationale: Инфинитив נסה обозначает намерение подвергнуть мудрость Соломона проверке; «испытать» сохраняет целенаправленный характер действия.
- source_word: בְחִידוֹת
  choice: загадками
  rationale: חִידוֹת — загадки, иносказания или трудные для разрешения вопросы. Конкретное «загадками» сохраняет образ еврейского текста без неоправданного расширения.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалим
  rationale: При глаголе движения русская конструкция естественно выражает направление винительным падежом, хотя еврейский предлог буквально может означать «в/при».
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: её сопровождала весьма многочисленная свита
  rationale: חַיִל может обозначать силу, войско, богатство или сопровождающую группу. Контекст царского путешествия с верблюдами и дарами благоприятствует значению «свита»; перестройка предложения делает связь естественной по-русски.
- source_word: בְּשָׂמִים
  choice: благовониями
  rationale: Множественное число обозначает ароматические вещества и пряности. В контексте дорогих царских даров «благовония» звучит ясно и уместно.
- source_word: לָרֹב
  choice: огромным количеством
  rationale: Выражение указывает на исключительное изобилие золота. Эта формулировка естественно согласуется с перечнем груза.
- source_word: אֶבֶן יְקָרָה
  choice: драгоценными камнями
  rationale: Формально единственное число имеет собирательное значение в перечне товаров; русское множественное число передаёт его естественно.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: она говорила с ним
  rationale: דבר с עִם выражает разговор с собеседником, а не обязательно одностороннее обращение; «говорила с ним» сохраняет этот оттенок.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: обо всём, что было у неё на сердце
  rationale: Сохранён телесно-антропологический образ оригинала, охватывающий мысли, заботы и вопросы царицы; значение поясняется сноской.
