lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Когда ... увидела
  rationale: Вайиктоль с ראה продолжает повествование; в данном незавершённом синтаксическом отрезке «когда» естественно связывает стих с последующим перечислением и основной реакцией царицы.
- source_word: מַלְכַּת שְׁבָא
  choice: царица Савская
  rationale: Конструктивное сочетание обозначает правительницу Шевы; традиционное и естественное русское именование — «царица Савская».
- source_word: אֵת
  choice: отдельно не переводится
  rationale: Показатель определённого прямого дополнения, не имеющий самостоятельного соответствия в русском языке.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: мудрость Соломона
  rationale: Конструктивная цепь передана родительным падежом; «мудрость» сохраняет широкий смысл проницательности и разумения.
- source_word: וְהַבַּיִת
  choice: и дом
  rationale: בַּיִת буквально означает «дом». В царском контексте возможен дворец или дворцовый комплекс, но основной текст не сужает значение; альтернатива вынесена в сноску.
- source_word: אֲשֶׁר בָּנָה
  choice: который он построил
  rationale: Относительное предложение относится к дому; русский вид глагола естественно передаёт завершённое действие, предшествующее осмотру.
