base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: ru
  text: яства на его столе, то, как были рассажены его слуги, расстановку его служителей и их одежду, его виночерпиев и их одежду, а также подъём, по которому он поднимался в дом Яхве[a], — у неё больше не осталось дыхания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно параллельному месту в 3 Царств 10:5: «всесожжение, которое он приносил в доме Яхве». Однако данный еврейский текст естественнее всего означает «подъём (или лестницу), по которому он поднимался».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и не осталось больше в ней дыхания» — еврейская идиома, выражающая ошеломляющее изумление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: еду на его столе
  rationale: מַאֲכַל обозначает пищу, предназначенную для еды; конкретный образ сохранён без расширительного толкования как «содержание стола».
- source_word: מוֹשַׁב עֲבָדָיו
  choice: места его слуг
  rationale: מוֹשָׁב может обозначать сиденье, место или порядок размещения. «Места его слуг» естественно передаёт наблюдаемое придворное устройство, не навязывая значения рабства.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: строй его служителей
  rationale: מַעֲמַד указывает на стояние, установленное место или расположение; «строй» передаёт упорядоченное присутствие служителей и сохраняет отличие מְשָׁרְתָיו от עֲבָדָיו.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: их одежды
  rationale: Прямой и современный эквивалент существительного со значением одежды или облачения.
- source_word: מַשְׁקָיו
  choice: его виночерпиев
  rationale: В царском контексте слово обозначает служителей, подававших напитки; традиционное русское «виночерпии» точно называет придворную должность.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: лестницу, по которой он поднимался в дом Яхве
  rationale: Масоретский текст естественнее всего говорит о подъёме или лестнице, по которой царь входил в храмовый комплекс. Возможное чтение по параллели в 3 Царств 10:5 вынесено в примечание.
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: у неё больше не осталось дыхания
  rationale: רוּחַ может означать дыхание, дух или ветер. Буквальный образ сохраняет яркость еврейской идиомы, выражающей крайнее изумление.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон. «Яхве» передаёт личное заветное имя и соответствует указанному решению консультационного слоя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством придворно-храмового повествования. Синтаксис сохраняет форму перечисления исходного стиха. Термин «виночерпии» несколько традиционен, но остаётся общеупотребительным и точным обозначением царских служителей. Все маркеры примечаний поставлены непосредственно при выражениях, к которым относятся.
