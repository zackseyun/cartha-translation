  terminology: «Яхве» последовательно передаёт יהוה. «Виночерпии» — точное название придворных служителей. «Слуги» и «служители» сохраняют различение עֲבָדָיו и מְשָׁרְתָיו без навязывания современного социального значения. Примечание к «подъёму» должно сохранять альтернативу из параллельного места, не подменяя масоретское чтение в основном тексте.
