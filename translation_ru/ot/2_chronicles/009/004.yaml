  source_fidelity: 'Основной смысл передан верно: перечислены пища, устройство придворного служения, одежды, виночерпии и восхождение к дому Яхве; финальная формула сохранена как идиома изумления. Однако «лестница» слишком однозначно сужает עֲלִיָּתוֹ, которое может означать подъём/восхождение, а «строй его служителей» в современном русском вызывает прежде всего военную ассоциацию и неточно передаёт их расстановку или служебное присутствие.'
