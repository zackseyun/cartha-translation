lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: Повествовательная форма глагола מלך обозначает царское правление в прошлом; «царствовал» точно и естественно передаёт это значение.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: בִירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Предлог ב обозначает место; русская конструкция «в Иерусалиме» естественно передаёт локативное значение.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: עַל при глаголе מלך выражает власть над народом; «весь Израиль» сохраняет собирательный, общенациональный смысл оригинала.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Еврейское сочетание числительного с существительным в единственном числе передаётся нормативным русским выражением продолжительности «сорок лет».
