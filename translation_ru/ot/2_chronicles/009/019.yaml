lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: И двенадцать львов
  rationale: Союз продолжает описание престола, а сочетание числительного с существительным прямо обозначает двенадцать изображений львов.
- source_word: עֹמְדִים שָׁם
  choice: стояли там
  rationale: Причастие имеет описательно-состоя́тельное значение; русское «стояли» естественно передаёт расположение фигур в сцене.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: на шести ступенях
  rationale: מַעֲלוֹת здесь обозначает ступени, ведущие к престолу; предлог עַל наиболее непосредственно передан как «на».
- source_word: מִזֶּה וּמִזֶּה
  choice: по одну и по другую сторону
  rationale: Устойчивое пространственно-распределительное выражение указывает на симметричное размещение с обеих сторон.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Ничего подобного не было сделано
  rationale: Безличная пассивная формулировка сохраняет сравнительный смысл כֵן и подчёркивает уникальность описанного престола.
- source_word: לְכָל מַמְלָכָה
  choice: ни для одного царства
  rationale: 'В сфере действия отрицания לְכָל получает обобщённо-отрицательный смысл: ничего подобного не изготовляли ни для какого царства.'
