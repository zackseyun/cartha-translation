source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: ru
  text: Да будет благословен Господь, твой Бог[a], который благоволил к тебе и посадил тебя на Свой престол царём для Господа, твоего Бога. Так как твой Бог возлюбил Израиль, чтобы утвердить его навеки[b], Он поставил тебя царём над ними, чтобы ты творил суд и справедливость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благословен Господь, твой Бог».'
    reason: Форма יְהִי допускает передачу как пожелания благословения, тогда как русская формула может пониматься и как торжественное провозглашение.
  - marker: b
    text: «Его» — то есть Израиль как единый народ. В следующей части еврейского текста при словах «над ними» употреблено множественное число.
    reason: Исходный текст переходит от единственного местоименного суффикса при коллективном «Израиль» к множественному; русский основной текст сохраняет это различие.
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Да будет благословен
  rationale: Передаёт юссивную формулу благословения естественным и торжественным русским оборотом, не превращая её в простое утверждение.
- source_word: יְהוָה
  choice: Господь
  rationale: В современном русском библейском употреблении традиционно и благоговейно передаёт тетраграмматон; личное имя в исходном тексте при этом обозначено принятой заменой.
- source_word: חָפֵץ בְּךָ
  choice: благоволил к тебе
  rationale: Сохраняет значение удовольствия, расположения и избрания и соответствует достоинству контекста царской речи.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: посадил тебя на Свой престол
  rationale: Естественно передаёт поставление на царство и сохраняет значимое указание на престол Бога.
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: царём для Господа, твоего Бога
  rationale: 'Сохраняет необычное отношение, выраженное предлогом לְ: Соломон царствует для Бога и от Его имени, без устранения смыслового напряжения.'
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: Так как твой Бог возлюбил Израиль
  rationale: Передаёт причинный смысл конструкции и сохраняет глагольную естественность по-русски.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: чтобы утвердить его навеки
  rationale: Сохраняет единственное число местоименного суффикса и коллективное понимание Израиля, не заменяя его множественным числом.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: Он поставил тебя царём над ним
  rationale: В контексте интронизации נתן означает назначение; единственное число русского местоимения согласуется с коллективным названием «Израиль», хотя в еврейском здесь стоит множественный суффикс.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: чтобы ты вершил суд и справедливость
  rationale: «Вершить суд» естественно выражает царскую судебную функцию, а «справедливость» отличает צְדָקָה от предшествующего מִשְׁפָּט и звучит ясно для современного читателя.
theological_decisions:
- issue: Чей престол обозначен словом כִּסְאוֹ («его престол»)
  choice: «Свой престол» — престол Господа
  alternative: Понимать это лишь как династический престол Соломона
  rationale: Ближайший мужской референт — Господь, а богословие Летописца представляет царя из дома Давида правящим на престоле Бога и под Его властью.
- issue: Связь לְהַעֲמִידוֹ לְעוֹלָם с окружающими частями предложения
  choice: 'Сохранена цель: любовь Бога к Израилю направлена на то, чтобы утвердить его навеки'
  alternative: Связать цель исключительно с поставлением Соломона царём или добавить отсутствующий в тексте глагол «желал»
  rationale: Инфинитив цели естественно связан с упоминанием Божьей любви, однако еврейский синтаксис допускает некоторую широту связи; перевод не добавляет нового сказуемого и не делает её жёстче исходного текста.
- issue: Царское сочетание מִשְׁפָּט וּצְדָקָה
  choice: «суд и справедливость»
  alternative: «правосудие и праведность»
  rationale: 'Выбранный вариант сохраняет два взаимосвязанных, но различных понятия: справедливое судебное решение и праведный общественный порядок, не внося конфессионально нагруженного толкования.'
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской интонацией. Синтаксис по возможности следует еврейской логике, но остаётся понятным при чтении вслух; сохранены повтор «твой Бог», образ Божьего престола и целевая конструкция.
