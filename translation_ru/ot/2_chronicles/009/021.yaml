  source_fidelity: 'Первая характеристика кораблей передана как их регулярное плавание в Фарсис, что соответствует глагольной форме в еврейском тексте. Во втором случае еврейское «корабли Фарсиса» не обязательно обозначает корабли, происходящие из Фарсиса: это может быть обозначением торгового направления или типа дальнего плавания. Прилагательное «фарсисские» в русском слишком легко сужает смысл до происхождения/принадлежности, поэтому его следует заменить более нейтральным оборотом. Перечень груза передан точно; неопределённость последнего названия птицы корректно отмечена.'
