base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: ru
  text: Ибо корабли царя ходили в Фарсис вместе со слугами Хурама. Раз в три года приходили корабли, ходившие в Фарсис, привозя золото, серебро, слоновую кость, обезьян и павлинов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «попугаев»; точное значение еврейского названия этой птицы неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущим контекстом, не усиливая её до строго причинного «потому что».
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: корабли царя
  rationale: Естественно выражает принадлежность, обозначенную еврейским оборотом с предлогом ל.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: ходили в Фарсис
  rationale: Причастная конструкция наиболее естественно указывает на регулярное плавание к месту назначения; форма «ходили» соответствует русской морской речи.
- source_word: עִם עַבְדֵי חוּרָם
  choice: вместе со слугами Хурама
  rationale: Сохраняет прямое значение «служащие/слуги», не предполагая рабского статуса.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: Раз в три года
  rationale: Современный и точный русский эквивалент распределительного выражения времени.
- source_word: תָּבֹאנָה
  choice: приходили
  rationale: Несовершенный вид передаёт повторяющееся действие в повествовании о прошлом.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: фарсисские корабли
  rationale: Передаёт именную конструкцию, которая может обозначать корабли фарсисского типа или торгового пути, не повторяя более громоздкое описание.
- source_word: נֹשְׂאוֹת
  choice: привозя
  rationale: По контексту корабли доставляли перечисленные товары; деепричастие естественно связывает груз с их прибытием.
- source_word: זָהָב וָכֶסֶף
  choice: золото, серебро
  rationale: Прямые современные соответствия названиям драгоценных металлов.
- source_word: שֶׁנְהַבִּים
  choice: слоновую кость
  rationale: Обычное русское название товара, традиционно обозначаемого этим словом.
- source_word: וְקוֹפִים
  choice: обезьян
  rationale: Наиболее понятное общее русское обозначение животных; еврейское слово не требует более узкого вида.
- source_word: וְתוּכִּיִּים
  choice: павлинов
  rationale: Традиционное вероятное толкование редкого названия животного; лексическая неуверенность и возможная альтернатива отмечены в сноске.
