  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: ru
  text: Помимо того, что приносили торговцы и купцы, все цари Аравии и наместники страны приносили Соломону золото и серебро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: торговцы
  rationale: Выражение обозначает людей, ведущих разъездную торговлю; современное «торговцы» передаёт смысл естественно и без излишнего уточнения.
- source_word: הַסֹּחֲרִים
  choice: купцы
  rationale: Слово обозначает занимающихся торговлей; «купцы» позволяет сохранить различие между двумя близкими еврейскими обозначениями.
- source_word: מַלְכֵי עֲרַב
  choice: цари Аравии
  rationale: עֲרַב здесь понимается как географическое или этнополитическое название; традиционная и ясная передача — «Аравия».
- source_word: פַחוֹת הָאָרֶץ
  choice: наместники страны
  rationale: פַחוֹת — правители или областные начальники, подчинённые высшей власти; «наместники» соответствует административному контексту. Определённое הָאָרֶץ буквально допускает «страны/земли».
- source_word: מְבִיאִים
  choice: приносили
  rationale: Причастная форма описывает продолжающееся или обычное действие; несовершенный вид в прошедшем времени естественно передаёт этот оттенок.
