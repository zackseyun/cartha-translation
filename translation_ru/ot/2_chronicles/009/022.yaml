  language: ru
  text: Царь Соломон превзошёл всех царей земли богатством и мудростью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: превзошёл
  rationale: В сравнительной конструкции с מִן глагол выражает превосходство над другими. «Превзошёл» естественно передаёт этот смысл по-русски.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: царь Соломон
  rationale: Сочетание титула и имени естественно передаётся по-русски как «царь Соломон».
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: всех царей земли
  rationale: В контексте международного сравнения אָרֶץ имеет широкий смысл «земля, мир»; традиционное и ясное выражение «все цари земли» сохраняет масштаб исходного текста.
- source_word: לְעֹשֶׁר וְחָכְמָה
  choice: богатством и мудростью
  rationale: Префикс לְ указывает, в каком отношении Соломон превосходил других. Русский творительный падеж естественно выражает сферу сравнения.
