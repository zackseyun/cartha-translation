  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: ru
  text: Все сосуды для питья у царя Соломона были золотыми, и все сосуды Дома «Ливанский лес» — из чистого золота[a]. Серебро во дни Соломона ни во что не ставили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально означает «закрытое золото»; обычно его понимают как чистое или очищенное золото.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: сосуды для питья
  rationale: Передаёт широкое значение כְּלֵי и назначение, выраженное מַשְׁקֵה, не сужая смысл до одних чаш.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: дом «Ливанский лес»
  rationale: Сохраняет прямое значение בֵּית и характер названия конкретного царского здания; вариант «дворец» был бы более истолковывающим.
- source_word: זָהָב סָגוּר
  choice: чистое золото
  rationale: Естественно передаёт устойчивое сочетание, обозначающее золото высокого качества; буквальное «закрытое золото» по-русски непонятно.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: серебро ... ни во что не ставили
  rationale: Близко передаёт мысль о том, что серебро не считалось чем-либо значимым, и звучит естественно в современном русском языке.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: во дни Соломона
  rationale: Сохраняет историческую формулу оригинала без уточняющего истолкования «в царствование Соломона».
