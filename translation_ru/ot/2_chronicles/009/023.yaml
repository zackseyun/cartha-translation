base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: ru
  text: И все цари земли искали встречи с Соломоном[a], чтобы услышать его мудрость, которую Бог вложил в его сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «искали лица Соломона» — то есть стремились встретиться с ним и быть принятыми им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: И все цари земли
  rationale: Связка וְ естественно продолжает повествование; הָאָרֶץ в международном контексте передано традиционным выражением «земли», не устраняя присущую слову возможность значения «страны».
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: искали встречи с Соломоном[a]
  rationale: Буквально «искали лица Соломона» — устойчивое выражение о стремлении попасть к человеку и быть принятым им. «Искали встречи» естественно передаёт смысл, а сноска сохраняет образ оригинала; причастная форма указывает на продолжавшееся или повторявшееся действие.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: чтобы услышать его мудрость
  rationale: Инфинитив выражает цель. Прямая передача сохраняет необычное, но понятное сочетание «услышать мудрость», то есть услышать её проявление в словах Соломона.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: которую Бог вложил в его сердце
  rationale: Хотя נָתַן буквально означает «дал», в сочетании с «в сердце» русский глагол «вложил» звучит естественно и сохраняет образ внутреннего дарования; «сердце» передаёт библейское представление о внутреннем человеке.
theological_decisions:
- issue: Божественный источник мудрости Соломона
  choice: которую Бог вложил в его сердце
  alternative: которую Бог дал ему
  rationale: Выбранный вариант прямо сохраняет приписывание мудрости действию Бога и не опускает указание на сердце как внутренний центр человека.
