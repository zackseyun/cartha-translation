base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: ru
  text: Она подарила царю сто двадцать талантов золота[a], огромное количество благовоний и драгоценные камни. Таких благовоний, какие царица Савская подарила царю Соломону, прежде не бывало.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точный вес таланта различался; если считать талант примерно равным 34 килограммам, общий вес составлял около четырёх тонн золота.
    reason: historical_measure
  - marker: b
    text: 'Буквально: «не было, как то благовоние, которое царица Савская дала царю Соломону». Сравнение может подчёркивать необыкновенность этих благовоний; в контексте оно также связано с беспримерностью дара. Возможен и более широкий смысл: подобных благовоний больше не бывало.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן לַמֶּלֶךְ
  choice: Она подарила царю
  rationale: Глагол נתן в повествовательной форме продолжает последовательность событий. «Подарила» естественно передаёт передачу царю перечисленных даров; местоимение женского рода ясно относится к царице Савской из контекста.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: сто двадцать талантов золота
  rationale: כִּכָּר — древняя мера веса, традиционно передаваемая словом «талант». Точный вес древнего таланта не вполне определён, поэтому мера сохранена, а приблизительный современный эквивалент вынесен в примечание.
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  choice: огромное количество благовоний
  rationale: בְּשָׂמִים обозначает душистые вещества, пряности или ароматические составы; в контексте царских даров «благовония» звучит естественно и достаточно широко. לָרֹב מְאֹד особо подчёркивает их количество.
- source_word: וְאֶבֶן יְקָרָה
  choice: и драгоценные камни
  rationale: Хотя אֶבֶן имеет форму единственного числа, здесь оно естественно понимается собирательно; по-русски в перечне даров уместно множественное число.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: Таких благовоний ... прежде не бывало
  rationale: Сравнительная частица כְּ означает «как, подобных». Русская конструкция сохраняет утверждение об их беспримерности к описываемому моменту, не уточняя без основания, шла ли речь прежде всего о качестве, виде или количестве дара.
- source_word: מַלְכַּת שְׁבָא
  choice: царица Савская
  rationale: Это укоренившаяся в русском библейском и литературном употреблении передача титула и названия страны Шева/Сава.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: царю Соломону
  rationale: Естественное русское сочетание титула с личным именем в дательном падеже.
theological_decisions:
- issue: Временной охват утверждения וְלֹא הָיָה
  choice: «прежде не бывало» — до описываемого момента
  alternative: «больше никогда не бывало» — также и после этого события
  rationale: В данном тексте Паралипоменон отсутствует наречие עוֹד («ещё, впредь»), которое могло бы прямо обозначить последующее время. Поэтому перевод не превращает фразу в безусловное утверждение обо всей дальнейшей истории; возможный более широкий смысл отмечен в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Сохранена традиционная мера «талант» и привычное наименование «царица Савская»; архаические обороты сведены к понятной, но достойной формуле «прежде не бывало».
