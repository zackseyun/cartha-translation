  text: И доставляли Соломону коней из Египта и из всех земель[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И выводили коней из Египта для Соломона и из всех земель». В данном контексте еврейский глагол, буквально означающий «выводить», относится к доставке коней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: И доставляли
  rationale: Причастие породы hифиль от יצא буквально означает «выводить / заставлять выходить». В контексте снабжения Соломона конями естественное русское «доставляли» передаёт перемещение из стран происхождения, не уточняя сверх текста коммерческий механизм. Форма множественного числа допускает неопределённо-личную передачу.
- source_word: סוּסִים
  choice: коней
  rationale: Обычное значение существительного во множественном числе — «кони, лошади». Форма «коней» естественна в данном повествовательном контексте.
- source_word: מִ/מִּצְרַיִם
  choice: из Египта
  rationale: Предлог מן обозначает источник или происхождение.
- source_word: לִ/שְׁלֹמֹה
  choice: Соломону
  rationale: Предлог ל может указывать направление или получателя; дательный падеж естественно сохраняет возможные оттенки «Соломону» и «для Соломона».
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: и из всех земель
  rationale: כָּל с формой множественного числа אֶרֶץ обозначает всю совокупность земель или стран. «Из всех земель» сохраняет образ и широкий охват еврейского выражения.
