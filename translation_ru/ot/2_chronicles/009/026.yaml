lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: И он властвовал
  rationale: Сочетание waw-консекутива глагола היה с причастием משל описывает продолжительное состояние правления. Русское «властвовал» естественно передаёт господство Соломона над зависимыми царями.
- source_word: בְּכָל הַמְּלָכִים
  choice: над всеми царями
  rationale: При משל предлог ב обозначает тех, на кого распространяется власть; «над» ясно выражает политическое верховенство.
- source_word: מִן הַנָּהָר
  choice: от Реки
  rationale: Буквально сохранено определённое обозначение «Река», которое в данной географической формуле обычно относится к Евфрату; пояснение вынесено в сноску.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: до земли филистимлян
  rationale: Фраза близко передаёт еврейское выражение и обозначает предел территории или сферы влияния, не заменяя его более интерпретирующим названием «Филистия».
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: и до границы Египта
  rationale: Слово גבול означает границу или рубеж; выбранная формулировка точно и естественно передаёт юго-западный предел.
