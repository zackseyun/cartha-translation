base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: ru
  text: Царь Соломон дал царице Савской всё, чего она желала и о чём просила, сверх того, что она принесла царю.[a] Затем она повернула и отправилась в свою страну[b] вместе со своими слугами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помимо того, что она принесла царю». Еврейский предлог может указывать как на добавление к принесённому, так и на его отделение от даров Соломона.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально говорит: «она повернула и пошла в свою страну»; по смыслу речь идёт о возвращении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: дал
  rationale: Обычное и естественное соответствие глаголу נתן в контексте передачи даров.
- source_word: מַלְכַּת שְׁבָא
  choice: царице Савской
  rationale: Традиционная и понятная русская передача титула и географического наименования; падеж обусловлен синтаксисом.
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: всё, чего она желала и о чём просила
  rationale: Передаёт как её желание (חפץ), так и явно выраженную просьбу (שאל), не сводя два оборота к одному.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: помимо того, что она принесла царю
  rationale: «Помимо» сохраняет допускаемую предлогом מִלְּבַד добавочно-разграничительную силу, не уточняя сверх текста характер сопоставления даров.
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  choice: она повернула и отправилась в свою страну
  rationale: Сохраняет последовательность еврейских глаголов и образ поворота, при этом звучит естественно в русском повествовании.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: вместе со своими слугами
  rationale: В данном контексте עֲבָדֶיהָ обозначает сопровождавших царицу людей; «слуги» не вносит неподтверждённого уточнения их правового статуса.
