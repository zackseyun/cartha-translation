base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/017.yaml
  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: ru
  text: Царь сделал большой престол из слоновой кости[a] и покрыл его чистым золотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «престол из зуба»; имеется в виду слоновая кость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: сделал
  rationale: В повествовательном контексте עשה имеет обычное значение «сделал»; это естественная современная формулировка без добавочного оттенка.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное передано прямо. Хотя из контекста ясно, что речь о Соломоне, исходный текст употребляет титул, а не имя.
- source_word: כִּסֵּא
  choice: престол
  rationale: В контексте царя כִּסֵּא обозначает царское сиденье; «престол» точно передаёт его статус.
- source_word: שֵׁן
  choice: из слоновой кости
  rationale: Буквально существительное означает «зуб», но в сочетании כִּסֵּא שֵׁן обозначает слоновую кость как материал или отделку. Предлог «из» естественно передаёт атрибутивную связь, не уточняя способ изготовления сверх текста.
- source_word: גָּדוֹל
  choice: большой
  rationale: גָּדוֹל здесь может указывать как на величину, так и на внушительность престола. «Большой» сохраняет основное предметное значение и звучит естественно.
- source_word: וַיְצַפֵּהוּ
  choice: покрыл его
  rationale: Пиэль глагола צפה означает покрыть или облицевать предмет материалом. «Покрыл» ясно и естественно передаёт нанесение золотого покрытия.
- source_word: זָהָב טָהוֹר
  choice: чистым золотом
  rationale: Устойчивое и точное русское соответствие выражению «чистое золото»; творительный падеж обозначает материал покрытия.
