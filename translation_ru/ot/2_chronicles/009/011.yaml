base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: ru
  text: Царь сделал из древесины алгум[a] подходы[b] к дому Яхве и к царскому дому, а также лиры и арфы для певцов. Прежде в земле Иуды не видели ничего подобного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте (3 Цар. 10:12) эта древесина названа «алмуг». Точная порода дерева неизвестна.
    reason: cross_reference
  - marker: b
    text: 'Или: «лестницы», «подъёмы» или «проходы»; древнееврейское слово может обозначать сооружённые подходы, и его точный смысл здесь неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: дерево алгум
  rationale: Редкое название ценной привозной древесины передано транслитерацией, поскольку точная порода неизвестна; форма «алгум» соответствует тексту Паралипоменона.
- source_word: מְסִלּוֹת
  choice: лестницы
  rationale: В архитектурном контексте слово обозначает сооружённые подходы или подъёмы. «Лестницы» естественно по-русски и соответствует вероятному смыслу, а более широкая возможность отмечена в сноске.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: для дома Яхве и царского дома
  rationale: Сохраняется повтор ключевого слова בַּיִת, но второе сочетание естественно передано как «царский дом»; «дом Яхве» сохраняет древнееврейский образ без обязательной замены на «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не титулом.
- source_word: כִנֹּרוֹת וּנְבָלִים
  choice: лиры и арфы
  rationale: Так разграничены два вида струнных инструментов; точное устройство древних инструментов установить невозможно.
- source_word: לַשָּׁרִים
  choice: для певцов
  rationale: Форма от שׁיר прямо обозначает поющих, поэтому «певцы» точнее общего «музыканты».
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: Ничего подобного прежде не видели
  rationale: Естественная русская формулировка сохраняет значение невиданности или уникальности предметов.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иуды
  rationale: Сохранено явно выраженное слово «земля» и историко-географическое название Иуда.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя יהוה; его передача как «Яхве» сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но сохранены древнееврейские образы «дом Яхве» и «земля Иуды»; подлинная лексическая неопределённость вынесена в сноски.
