lexical_decisions:
- source_word: וַיְהִי
  choice: составлял
  rationale: Глагольная форма вводит сообщение о величине веса в повествовательной последовательности; русское «составлял» естественно связывает подлежащее с числовой мерой без добавления отдельного временного маркера.
- source_word: מִשְׁקַל הַזָּהָב
  choice: вес золота
  rationale: מִשְׁקַל обозначает именно вес, а не общую стоимость или количество; определённость золота по-русски естественно передаётся контекстом.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: поступавшего Соломону
  rationale: «Поступавшего» сохраняет направленность к Соломону и не называет действующее лицо, которого еврейский текст не уточняет. Несовершенный вид естественно описывает годовой приток.
- source_word: בְּשָׁנָה אֶחָת
  choice: за один год
  rationale: В контексте подсчёта дохода оборот обозначает объём, поступивший в течение одного года; «за один год» естественно и точно выражает этот временной промежуток.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: шестьсот шестьдесят шесть
  rationale: Прямая передача точного количественного числительного без дополнительного толкования.
- source_word: כִּכְּרֵי זָהָב
  choice: талантов золота
  rationale: כִּכָּר — крупная древняя единица веса, традиционно и понятно передаваемая словом «талант».
theological_decisions:
- issue: Возможное символическое значение числа 666
  choice: Передать число как точное историческое количество без интерпретационного выделения.
  alternative: Подчеркнуть возможную символическую связь с другими библейскими упоминаниями числа 666.
  rationale: В данном стихе число обозначает годовой вес золота и самим текстом символически не истолковывается; перевод не должен привносить более поздние ассоциации.
translation_notes:
