base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: ru
  text: И почил Соломон со своими отцами[a], и похоронили его в городе Давида, отца Соломона. Вместо него воцарился его сын Ровоам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лёг со своими отцами»; это обычное древнееврейское выражение, обозначающее смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил со своими отцами
  rationale: Устойчивую древнееврейскую формулу смерти лучше сохранить в узнаваемом библейском виде. «Почил» естественнее и достоинственнее буквального «уснул», а примечание разъясняет смысл выражения.
- source_word: וַיִּקְבְּרֻהוּ
  choice: похоронили его
  rationale: Сохранена активная форма множественного числа с неопределённым субъектом, без необоснованного указания тех, кто совершил погребение.
- source_word: בְּעִיר דָּוִיד
  choice: в городе Давида
  rationale: Традиционное и узнаваемое русское обозначение этого места, близкое к форме оригинала.
- source_word: אָבִיו
  choice: его отца
  rationale: Суффикс относится к Соломону, а Давид назван его отцом; буквальное родственное обозначение уместно в династическом сообщении.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В контексте престолонаследия глагол обозначает вступление Ровоама на царство; «воцарился» кратко и естественно передаёт эту формулу.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт значение замещения и преемства, не сводя выражение лишь к временному значению «после него».
