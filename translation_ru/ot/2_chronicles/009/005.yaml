lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала она
  rationale: Последовательная форма повествования продолжает рассказ; русский союз «и» естественно передаёт связь с предшествующим событием и сохраняет библейское достоинство без архаизации.
- source_word: אֶל־הַמֶּלֶךְ
  choice: царю
  rationale: Дательный падеж естественно передаёт адресата речи в современном русском языке.
- source_word: אֱמֶת הַדָּבָר
  choice: Правда то
  rationale: Еврейская именная конструкция буквально утверждает истинность услышанного слова или сообщения. Формулировка «Правда то, что…» естественна по-русски и не требует преждевременно сужать многозначность דָּבָר.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: что я слышала
  rationale: Прямое и естественное воспроизведение относительного придаточного и женского рода говорящей.
- source_word: בְּאַרְצִי
  choice: в своей земле
  rationale: Возвратное местоимение ясно связывает землю с говорящей; «земля» сохраняет конкретность и библейский регистр исходного אֶרֶץ.
- source_word: עַל־דְּבָרֶיךָ
  choice: о твоих словах
  rationale: Выбор сохраняет наиболее прямое значение דְּבָרִים и его лексическую связь с דָּבָר ранее в стихе, хотя контекст допускает более широкое значение «дела» или «обстоятельства».
- source_word: וְעַל־חָכְמָתֶךָ
  choice: и о твоей мудрости
  rationale: Прямой перевод ключевого для повествования существительного с местоименным суффиксом.
