  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: ru
  text: Он сделал также триста щитов из золота, выкованного в листы; на каждый щит пошло по триста шекелей[a] золота. Царь поместил их в Доме Ливанского леса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «триста золота»; единица веса не указана. «Шекелей» добавлено для ясности на основании параллельного места в 3 Царств 10:17.'
    reason: lexical_alternative
  - marker: b
    text: 'Дом Ливанского леса — название царского здания; возможный перевод: «дворец Ливанского леса».'
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: щитов
  rationale: מָגֵן обозначает щит; современное русское «щит» точно и не вносит неподтверждённого уточнения о его размере или виде.
- source_word: זָהָב שָׁחוּט
  choice: кованого золота
  rationale: שָׁחוּט в данном контексте описывает золото, обработанное ударами и, вероятно, раскованное в листы; «кованое золото» естественно передаёт способ обработки без излишнего пояснения.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: триста шекелей золота
  rationale: 'В еврейском тексте единица веса не названа буквально: «триста золота». «Шекелей» добавлено для понятности на основании параллели в 3 Царств 10:17, где указаны три мины, то есть триста шекелей.'
- source_word: יַעֲלֶה עַל
  choice: пошло на
  rationale: Оборот буквально выражает, что указанное количество золота «поднималось/приходилось на» щит; русское «пошло на» естественно передаёт количество материала, использованного для каждого щита.
- source_word: הַמָּגֵן הָאֶחָת
  choice: каждый щит
  rationale: Формально стоит единственное число «один щит», но в перечислении оно имеет распределительное значение.
- source_word: וַיִּתְּנֵם
  choice: поместил их
  rationale: נתן при указании места означает «положить, поставить, поместить»; «поместил» соответствует достоинству повествовательного регистра.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: в доме «Ливанский лес»
  rationale: Это название царского здания. Кавычки и форма «дом» сохраняют собственное имя и буквальный компонент בֵּית, не превращая его без необходимости в «дворец».
