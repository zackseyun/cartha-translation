  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: ru
  text: И слуги Хирама[a], и слуги Соломона, доставившие золото из Офира, привезли также древесину алгум[b] и драгоценные камни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых традициях это имя в книгах Паралипоменон передаётся как «Хурам»; здесь в еврейском тексте стоит форма «Хирам».
    reason: alternative_reading
  - marker: b
    text: Точная порода дерева, обозначенная еврейским словом, неизвестна; встречается также передача «алмуг».
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте буквально «драгоценный камень» — единственное число, вероятно, употреблено в собирательном значении.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: и … также
  rationale: Раздельная передача соединительного и добавочного значений сохраняет связь с предшествующим рассказом и естественно звучит по-русски.
- source_word: עַבְדֵי
  choice: слуги
  rationale: В контексте царской службы слово обозначает людей, состоявших на службе у царей; «рабы» неоправданно подчёркивало бы правовой статус, а «чиновники» было бы слишком узко.
- source_word: חירם
  choice: Хирам
  rationale: Передаёт данную в стихе еврейскую форму имени и соответствует принятой русской библейской традиции.
- source_word: וְעַבְדֵי שְׁלֹמֹה
  choice: и слуги Соломона
  rationale: Сохраняет параллелизм двух еврейских сопряжённых конструкций.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: доставившие золото из Офира
  rationale: Причастный оборот естественно определяет названных слуг; «доставившие» передаёт каузативное значение глагола без излишне коммерческого оттенка.
- source_word: הֵבִיאוּ
  choice: привезли
  rationale: В контексте перевозки товаров естественно передаёт значение «принесли/доставили», не добавляя идеи торговли.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: древесину алгум
  rationale: Точная порода дерева неизвестна, поэтому сохранено транслитерированное название без спекулятивного отождествления с сандалом.
- source_word: וְאֶבֶן יְקָרָה
  choice: и драгоценные камни
  rationale: Единственное число в еврейском, вероятно, имеет собирательное значение; русский язык в перечне груза естественно требует множественного числа.
theological_decisions: []
