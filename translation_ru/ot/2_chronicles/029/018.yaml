base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: ru
  text: 'И вошли они к царю Езекии и сказали: «Мы очистили весь дом Яхве, жертвенник всесожжения со всеми его принадлежностями и стол для разложенных хлебов[a] со всеми его принадлежностями».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «стол хлебов предложения», то есть стол для хлебов, разложенных перед Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: вошли
  rationale: Наречие указывает на движение внутрь; в русском контексте доклада царю естественно передать его глаголом движения «вошли».
- source_word: טִהַרְנוּ
  choice: мы очистили
  rationale: В храмовом контексте глагол обозначает обрядовое очищение; «очистили» сохраняет этот смысл и звучит естественно.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Передаёт буквальный образ «дом» и сохраняет личное имя Бога, выраженное тетраграмматоном.
- source_word: מִזְבַּח הָעוֹלָה
  choice: жертвенник всесожжения
  rationale: Устоявшееся и точное обозначение жертвенника, предназначенного для жертв, сжигавшихся целиком.
- source_word: כֵּלָיו
  choice: все его принадлежности
  rationale: В храмовом контексте כֵּלִים охватывает сосуды, орудия и прочие предметы служения; «принадлежности» естественно передаёт собирательный смысл.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: стол для разложенных хлебов
  rationale: Сочетание буквально связывает стол с упорядоченным расположением; контекстуально речь идёт о хлебах, раскладываемых перед Яхве. Формулировка ясна современному читателю и не скрывает образ расположения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Значение שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: стол для разложенных хлебов
  alternative: стол хлебов предложения
  rationale: Основной текст поясняет назначение стола современным русским языком, не вводя невыраженного в данной фразе конфессионального толкования; традиционное название дано в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохранён близким к еврейскому перечислению, но лексика сделана понятной обычному читателю.
