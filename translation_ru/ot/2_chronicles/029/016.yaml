base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: ru
  text: Священники вошли во внутреннюю часть дома ГОСПОДА, чтобы очистить его. Всё нечистое, что они нашли в храме ГОСПОДА, они вынесли во двор дома ГОСПОДА, а левиты приняли это, чтобы вынести наружу, к потоку Кедрон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: во внутреннюю часть дома ГОСПОДА
  rationale: Передаёт направительное значение לִפְנִימָה и сохраняет различие между всем домом и его внутренней частью.
- source_word: כָּל הַטֻּמְאָה
  choice: всё нечистое
  rationale: В данном контексте обозначает всё, что оскверняло храм; субстантивированное «нечистое» естественно по-русски и не сужает смысл до мусора или идолов.
- source_word: בְּהֵיכַל יְהוָה
  choice: в храме ГОСПОДА
  rationale: הֵיכָל здесь обозначает храмовое здание или святилище; «храм» сохраняет отличие от более широкого בֵית יְהוָה — «дом ГОСПОДА».
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: за город, к потоку Кедрон
  rationale: חוּצָה указывает на вынос наружу, по контексту — за пределы города; נַחַל может означать поток или долину потока, поэтому основной текст использует традиционное и конкретное «поток Кедрон».
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Использована укоренённая русская библейская передача, графически отличающая тетраграмматон; стих не требует конфессионально специфического толкования.
- issue: Характер храмовой нечистоты
  choice: не уточнять, что именно было нечистым
  alternative: мусор, идолы или предметы осквернения
  rationale: Еврейский текст оставляет понятие общим, поэтому перевод не конкретизирует его сверх источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения для ясности; последовательность действий и различение «дома», «храма» и «двора» сохранены.
