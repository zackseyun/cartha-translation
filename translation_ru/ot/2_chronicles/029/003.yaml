source:
  edition: WLC
  text: ה֣וּא בַ/שָּׁנָה֩ הָ/רִאשׁוֹנָ֨ה לְ/מָלְכ֜/וֹ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן פָּתַ֛ח אֶת דַּלְת֥וֹת בֵּית יְהוָ֖ה וַֽ/יְחַזְּקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: ru
  text: В первый год своего царствования, в первый месяц, он открыл двери дома Яхве и починил их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепил их», то есть вновь сделал двери прочными и исправными.'
    reason: 'Лексическая альтернатива: וַיְחַזְּקֵם буквально указывает на укрепление, а в данном контексте может означать ремонт или восстановление дверей.'
lexical_decisions:
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение возобновляет или слегка подчёркивает подлежащее; в русском повествовании естественно передать его обычным «он».
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: в первый год своего царствования
  rationale: Оборот обозначает первый год правления царя; «своего царствования» точно и естественно передаёт отношение к его правлению.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: в первый месяц
  rationale: Прямое и ясное обозначение времени; название месяца в исходном тексте не уточняется.
- source_word: פָּתַח
  choice: открыл
  rationale: Глагол имеет обычное значение «открыть», подходящее для дверей храма.
- source_word: דַּלְתוֹת
  choice: двери
  rationale: Слово обозначает двери или дверные створки; «двери» — наиболее естественный русский эквивалент.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется исходный образ «дома» как обозначение святилища, а личное имя Бога передаётся транслитерацией «Яхве».
- source_word: וַיְחַזְּקֵם
  choice: починил их
  rationale: Порода пиэль буквально выражает укрепление или приведение в прочное состояние; применительно к ранее закрытым храмовым дверям «починил» естественно передаёт практическое восстановление, а буквальный оттенок сохранён в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано принятой научной транслитерацией «Яхве», а не заменено титулом.
- issue: Степень конкретизации выражения בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: «Дом Яхве» сохраняет исходную метафору и остаётся понятным в контексте; вариант «храм» яснее функционально, но менее формально соответствует еврейскому выражению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и доступен; повтор временных оборотов сохранён. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
