  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: ru
  text: И все принадлежности, которые царь Ахаз во время своего царствования отбросил, проявив неверность[a], мы приготовили и освятили; вот[b], они перед жертвенником Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей неверности» или «поступив вероломно»; еврейское выражение обозначает нарушение верности, в данном контексте — Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и вот они»; слово «вот» обращает внимание на то, что принадлежности теперь находятся перед жертвенником.'
    reason: translation_clarity
lexical_decisions:
- source_word: הַכֵּלִים
  choice: принадлежности
  rationale: В храмовом контексте כֵּלִים обозначает различные предметы и принадлежности служения; это естественнее по-русски, чем узкое «сосуды».
- source_word: הִזְנִיחַ
  choice: отверг
  rationale: Глагол передаёт активное отстранение или отбрасывание предметов, а не только небрежение ими.
- source_word: בְּמַלְכוּתוֹ
  choice: во время своего царствования
  rationale: Предложное сочетание имеет временное значение и естественно передаётся этой русской конструкцией.
- source_word: בְּמַעֲלוֹ
  choice: поступив вероломно
  rationale: מַעַל указывает на нарушение верности, особенно в религиозно-заветном смысле; формулировка сохраняет нравственный акцент и связь действия с Ахазом.
- source_word: הֵכַנּוּ
  choice: мы приготовили
  rationale: Форма hifil от כון означает привести в готовность или подготовить.
- source_word: וְהִקְדָּשְׁנוּ
  choice: и освятили
  rationale: В храмовом контексте קדשׁ означает отделить для святого употребления; «освятили» — понятный и уместный русский термин.
- source_word: וְהִנָּם
  choice: Вот, они
  rationale: «Вот» сохраняет указательную силу частицы הִנֵּה и обращает внимание на нынешнее местонахождение предметов.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: перед жертвенником Яхве
  rationale: לִפְנֵי естественно означает «перед», а личное имя יְהוָה передано как «Яхве».
theological_decisions:
- issue: Передача בְּמַעֲלוֹ
  choice: поступив вероломно
  alternative: из-за своей неверности
  rationale: Выбранный вариант сохраняет значение нарушения верности и не сводит выражение к простой небрежности; при этом обстоятельственная связь в еврейском допускает несколько способов выражения по-русски.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон как личное Божье имя; транслитерация сохраняет это различие и не заменяет имя титулом.
translation_notes:
  register: Современный литературный русский с достоинством храмового повествования. Синтаксис слегка приподнят, но прозрачен; культовые термины переданы общеупотребительно, без конфессионально узкой лексики.
