  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: ru
  text: 'Тогда Езекия сказал: «Теперь вы посвятили себя на служение Яхве[a]. Подойдите и принесите жертвы и благодарственные приношения в дом Яхве». И собрание принесло жертвы и благодарственные приношения, а все, чьё сердце было к тому расположено, — всесожжения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнили свои руки для Яхве» — древнееврейское выражение, означающее посвящение или поставление на священное служение.'
    reason: Пояснение буквального образа и культового значения еврейской идиомы.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Тогда Езекия сказал
  rationale: Сочетание буквально означает «ответил и сказал», но в данном повествовательном контексте вводит речь без явно заданного вопроса; естественное русское «сказал» передаёт функцию формулы без ненужной тяжеловесности.
- source_word: מִלֵּאתֶם יֶדְכֶם לַיהוָה
  choice: вы посвятили себя на служение Яхве[a]
  rationale: Выражение буквально говорит о «наполнении руки» и является устойчивой формулой посвящения или поставления на священное служение. Смысл передан в основном тексте, а образ исходного выражения сохранён в сноске.
- source_word: גֹּשׁוּ
  choice: Подойдите
  rationale: Передаёт призыв приблизиться и приступить к храмовому богослужебному действию; естественно звучит по-русски.
- source_word: זְבָחִים
  choice: жертвы
  rationale: Общее обозначение закалываемых жертв; широкий русский термин соответствует контексту.
- source_word: תוֹדוֹת
  choice: благодарственные приношения
  rationale: Обозначает приношения или жертвы благодарения. Такой перевод ясно передаёт назначение и сохраняет отличие от общего слова «жертвы».
- source_word: לְבֵית יְהוָה
  choice: в дом Яхве
  rationale: Сохраняет буквальный и богословски значимый образ «дома Яхве», при этом предлог «в» естественно выражает направление принесения даров.
- source_word: הַקָּהָל
  choice: собрание
  rationale: Обозначает собравшуюся общину народа; «собрание» понятно современному читателю и не сужает значение до отдельной религиозной организации.
- source_word: כָל נְדִיב לֵב
  choice: все, чьё сердце было к тому расположено
  rationale: Передаёт добровольную внутреннюю готовность, выраженную еврейским оборотом, без архаичного «доброхотный сердцем» и без сведения смысла лишь к материальной щедрости.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Традиционный и точный русский термин для жертв, целиком сжигавшихся на жертвеннике.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Смысл формулы מִלֵּאתֶם יֶדְכֶם
  choice: посвятили себя на служение Яхве
  alternative: наполнили свои руки для Яхве
  rationale: Буквальный образ в современном русском непрозрачен и может быть ошибочно понят как принесение даров. Перевод передаёт признанный культовый смысл формулы, а буквальная форма отмечена в сноске, не устраняя её образность из справочного аппарата.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён там, где буквальное воспроизведение еврейской повествовательной формулы было бы тяжеловесным; специальные жертвенные термины сохранены. Тире перед «всесожжения» восполняет опущенный во второй части сказуемый и делает параллелизм ясным.
