  text: וַ/יַּֽעַמְד֤וּ הַ/לְוִיִּם֙ בִּ/כְלֵ֣י דָוִ֔יד וְ/הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְרֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: ru
  text: И левиты встали с музыкальными инструментами Давида[a], а священники — с трубами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с инструментами, связанными с Давидом». Еврейское выражение может обозначать инструменты, принадлежавшие Давиду, учреждённые им или связанные с ним.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о трубах, на которых при богослужении играли священники. В других местах уточняется, что такие трубы были серебряными, но здесь этого не сказано.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: И ... встали
  rationale: Вав-последовательный продолжает повествование; «и ... встали» естественно передаёт последовательность событий и основное значение עמד.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое обозначение левитов; определённость в русском языке ясна из контекста.
- source_word: בִּכְלֵי דָוִיד
  choice: с музыкальными инструментами Давида
  rationale: כְּלִי имеет широкое значение «сосуд, орудие, предмет, инструмент», но в данном храмовом контексте речь идёт о музыкальных инструментах. Родительный оборот сохраняет неоднозначность связи с Давидом.
- source_word: וְהַכֹּהֲנִים
  choice: а священники
  rationale: Союз «а» естественно выделяет вторую параллельную группу, не вводя смыслового противопоставления.
- source_word: בַּחֲצֹצְרוֹת
  choice: с трубами
  rationale: חֲצֹצְרוֹת — храмовые сигнальные трубы. Уточнение «серебряными» не добавлено, поскольку в этом стихе материал не назван.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной храмово-музыкальной терминологией. Эллипсис во второй части («а священники — с трубами») естественно передаёт параллелизм еврейской фразы.
