base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: ru
  text: Они собрали своих братьев, освятились и пришли, по повелению царя, согласно словам Яхве[a], чтобы очистить дом Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в словах Яхве». Это выражение может пояснять царское повеление как основанное на словах Яхве.'
    reason: Сохранение буквальной формы и осторожное пояснение синтаксической связи бְּדִבְרֵי יְהוָה с царским повелением.
  - marker: b
    text: То есть храм Яхве.
    reason: Пояснение буквального выражения «дом Яхве».
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם
  choice: Они собрали своих братьев
  rationale: Сохраняется прямое значение глагола אסף и мужской термин родства אחים; по контексту речь идёт о других левитах, но это уточнение не подставляется в основной текст.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: освятились
  rationale: Возвратная форма естественно передаёт хитпаэль и обозначает ритуальное приготовление к священному служению.
- source_word: וַיָּבֹאוּ
  choice: и пришли
  rationale: Передано основное значение בוא без добавления прямо не названного объекта входа.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: по повелению царя
  rationale: Краткая и естественная русская передача действия в соответствии с царским распоряжением.
- source_word: בְּדִבְרֵי יְהוָה
  choice: данному в словах Яхве
  rationale: Сохранены предлог ב и множественное число דִבְרֵי; формулировка связывает слова Яхве с царским повелением, не превращая их без пояснения в отдельное повеление.
- source_word: לְטַהֵר
  choice: чтобы очистить
  rationale: В храмовом контексте טהר обозначает очищение от ритуальной нечистоты; целевая конструкция передаёт инфинитив с ל.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется буквальный храмовый оборот «дом Яхве», понятный в контексте и не заменённый толкованием «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Связь выражения בְּדִבְרֵי יְהוָה с царским повелением
  choice: «по повелению царя, данному в словах Яхве»
  alternative: «по повелению царя, согласно словам Яхве»
  rationale: 'Синтаксис допускает несколько оттенков: царское повеление могло быть дано через слова Яхве либо соответствовать им. Основной текст следует наиболее непосредственной связи предлога ב со «словами», а сноска сохраняет другую возможность.'
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон, поэтому личное имя сохранено; традиционная замена титулом не вносится.
- issue: Значение אֲחֵיהֶם
  choice: своих братьев
  alternative: других левитов
  rationale: Сохранён выраженный в еврейском тексте мужской термин родства; контекстуальное отождествление с левитами не превращено в основной перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным, но ключевые храмовые термины и личное имя Яхве сохранены близко к еврейскому тексту.
