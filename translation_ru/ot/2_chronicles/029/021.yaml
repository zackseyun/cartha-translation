source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: ru
  text: И привели семь быков, семь баранов, семь ягнят и семь козлов в жертву за грех — за царство, за святилище и за Иудею. И он велел сынам Аарона, священникам, принести их в жертву на жертвеннике Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: И привели
  rationale: Глагол בוא в этой повествовательной форме обозначает доставление жертвенных животных; «привели» естественно для живых животных и сохраняет последовательность рассказа.
- source_word: פָרִים
  choice: быков
  rationale: В перечне жертвенных животных слово обозначает крупный рогатый скот мужского пола; возраст в стихе прямо не указан.
- source_word: אֵילִים
  choice: баранов
  rationale: Обычное значение термина для взрослых самцов овец в жертвенном контексте.
- source_word: כְבָשִׂים
  choice: ягнят
  rationale: Естественный русский эквивалент жертвенного термина; пол животных здесь не требуется уточнять сверх текста.
- source_word: צְפִירֵי עִזִּים
  choice: козлов
  rationale: Сочетание прямо обозначает самцов коз; «козлов» точно и естественно по-русски.
- source_word: לְחַטָּאת
  choice: в жертву за грех
  rationale: В культовом контексте חַטָּאת обозначает определённый вид жертвы, а не просто абстрактный грех.
- source_word: עַל הַמַּמְלָכָה ... וְעַל הַמִּקְדָּשׁ וְעַל יְהוּדָה
  choice: за царство, за святилище и за Иудею
  rationale: Предлог עַל при жертвоприношении имеет значение «за, ради, от имени»; повтор «за» отражает еврейскую структуру и представительный характер жертвы.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: сынам Аарона, священникам
  rationale: Сохранены родовое обозначение и поясняющее приложение исходного текста.
- source_word: לְהַעֲלוֹת
  choice: вознести их
  rationale: В жертвенном употреблении עלה означает вознесение жертвы на жертвенник; добавленное по контексту местоимение «их» делает русскую фразу ясной, не меняя смысла.
- source_word: מִזְבַּח יְהוָה
  choice: жертвенник Яхве
  rationale: Конструкция передана естественным родительным сочетанием; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как собственное имя. «Яхве» сохраняет различие между именем и титулом и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение חַטָּאת
  choice: жертва за грех
  alternative: жертва очищения; жертва за грехи
  rationale: Традиционное культовое обозначение «жертва за грех» понятно современному читателю и не устраняет возможный очистительный оттенок обряда. Единственное число соответствует собирательному названию вида жертвы.
- issue: Значение לְהַעֲלוֹת при жертвеннике
  choice: вознести их на жертвенник
  alternative: принести их в жертву на жертвеннике
  rationale: «Вознести» сохраняет образ восхождения, заложенный в עלה, не утверждая сверх текста точный этап жертвенного действия.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксический повтор числительного и предлога сохранён ради ритма и точности; архаизмы сведены к общепонятным культовым словам «святилище» и «жертвенник».
