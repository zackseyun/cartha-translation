base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: ru
  text: Затем царь Езекия и начальники велели левитам восхвалять Яхве словами Давида и провидца Асафа[a]. И они восхваляли с радостью[b], и склонились, и пали ниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно словам Давида и провидца Асафа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «до радости» или «к радости»; по смыслу их восхваление сопровождалось ликованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: велели
  rationale: Конструкция «сказал... левитам восхвалять» выражает распоряжение; «велели» естественно передаёт эту функцию, не усиливая её до строгого приказа.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: царь и начальники
  rationale: שָׂרִים обозначает руководителей или должностных лиц; «начальники» — ясное современное обозначение людей, наделённых властью.
- source_word: לְהַלֵּל / וַיְהַלְלוּ
  choice: восхвалять / восхваляли
  rationale: Корень הלל в богослужебном контексте означает хвалить; повтор одного русского корня сохраняет связь двух форм исходного текста.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: словами Давида и прозорливца Асафа
  rationale: Буквальное значение דִבְרֵי — «слова»; предлог בְּ допускает как инструментальное «словами», так и нормативное «согласно словам», поэтому альтернативу отмечает сноска.
- source_word: הַחֹזֶה
  choice: прозорливец
  rationale: Исторически уместный русский термин для носителя пророческого титула חֹזֶה; он отличает этот титул от общего обозначения пророка.
- source_word: עַד לְשִׂמְחָה
  choice: с радостью
  rationale: Необычное еврейское выражение буквально содержит «до/к радости»; в контексте оно естественно понимается как характеристика радостного восхваления, при этом буквальная форма сохранена в сноске.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: преклонились и поклонились
  rationale: 'Сохранены два координированных глагола: первый обозначает склонение тела, второй — поклонение или простирание в почтении.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно употребляет тетраграмматон; «Яхве» передаёт его как личное заветное имя, не заменяя титулом.
- issue: Соотношение двух действий в заключительной фразе
  choice: 'два последовательных действия: «преклонились и поклонились»'
  alternative: 'одно составное действие: «преклонились в поклонении»'
  rationale: В еврейском тексте стоят два разных глагола, поэтому перевод не сводит их к одному и сохраняет телесный и культовый оттенки фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством богослужебно-исторического повествования. «Левиты» и «прозорливец» сохраняют библейскую терминологию; синтаксис остаётся ясным для современного читателя. Частица «а потом» естественно передаёт переход к следующим действиям, не превращая его в жёсткую временную схему.
