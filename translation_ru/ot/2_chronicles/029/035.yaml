source:
  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: ru
  text: Всесожжений было также множество; вместе с ними приносили тук мирных жертв[a] и возлияния при всесожжениях. Так было налажено служение в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертв общения».'
    reason: Лексический вариант передачи שְׁלָמִים, жертвенной категории, связанной с миром, благополучием и общей трапезой.
lexical_decisions:
- source_word: וְגַם עֹלָה לָרֹב
  choice: Всесожжений было также множество
  rationale: Единственное число עֹלָה имеет здесь собирательное значение, а לָרֹב указывает на большое количество; русское множественное число естественно передаёт смысл.
- source_word: בְּחֶלְבֵי הַשְּׁלָמִים
  choice: вместе с ними приносили тук мирных жертв
  rationale: В жертвенном контексте חֵלֶב означает предназначенные для сожжения жировые части. Добавление глагола «приносили» делает эллиптическую еврейскую конструкцию ясной по-русски, не меняя её смысла.
- source_word: הַשְּׁלָמִים
  choice: мирных жертв
  rationale: «Мирная жертва» — узнаваемое русское обозначение данной жертвенной категории; возможное смысловое обозначение «жертва общения» сохранено в сноске.
- source_word: וּבַנְּסָכִים לָעֹלָה
  choice: и возлияния при всесожжениях
  rationale: נְסָכִים обозначает жидкие приношения, которые возливали; לָעֹלָה выражает их связь со всесожжениями.
- source_word: וַתִּכּוֹן
  choice: Так было налажено
  rationale: Форма от כון передаёт приведение в надлежащее, устойчивое состояние. «Было налажено» естественно отражает восстановление храмового служения после перерыва.
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: служение в доме Яхве
  rationale: Сохраняется культовое значение עֲבוֹדָה и прозрачная связь с домом, то есть храмом, Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Значение жертвенного термина שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения
  rationale: Основной текст сохраняет традиционное и понятное название жертвенной категории, а сноска отмечает допустимый смысловой вариант без сведения термина к одной богословской трактовке.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Эллипсис исходного текста умеренно раскрыт словами «вместе с ними приносили», чтобы избежать впечатления, будто тук и возлияния являются разновидностями всесожжений. Маркер сноски поставлен непосредственно после спорного термина.
