base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: ru
  text: Он поставил левитов в доме Яхве с кимвалами, арфами[a] и лирами — по повелению Давида, Гада, царского провидца[b], и пророка Нафана, ибо это повеление исходило от Яхве через Его пророков.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское слово обозначает струнный инструмент; его точное современное соответствие неизвестно. Возможны переводы «псалтири» или «лютни».
    reason: lexical_alternative
  - marker: b
    text: «Провидец» передаёт особый еврейский титул חֹזֶה, близкий по значению к слову «пророк», но не тождественный употреблённому далее נָבִיא.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ибо повеление было рукой Яхве, рукой Его пророков». Повторение слова «рука» выражает источник и посредничество.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Он поставил
  rationale: Каузативная форма глагола עמד означает, что левитам было определено занять свои места для служения; «поставил» естественно передаёт и размещение, и назначение.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет буквальный образ «дома» как обозначения святилища, не заменяя его более истолковывающим словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: בִּמְצִלְתַּיִם
  choice: с кимвалами
  rationale: Кимвалы — общепринятое русское название ударного инструмента; предлог «с» передаёт оснащение левитов инструментами.
- source_word: בִּנְבָלִים וּבְכִנֹּרוֹת
  choice: арфами и лирами
  rationale: Разные русские наименования сохраняют различие между двумя древними струнными инструментами, хотя их точное устройство неизвестно.
- source_word: בְּמִצְוַת דָּוִיד
  choice: по повелению Давида
  rationale: Оборот обозначает установленное распоряжение, в соответствии с которым было организовано служение.
- source_word: גָד חֹזֵה הַמֶּלֶךְ
  choice: царского провидца Гада
  rationale: «Провидец» отличает חֹזֶה от следующего за ним обычного обозначения пророка נָבִיא; конструкция естественно передаёт связь Гада с царём.
- source_word: נָתָן הַנָּבִיא
  choice: пророка Нафана
  rationale: Прямо передаёт имя и титул, сохраняя отличие от титула Гада.
- source_word: כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו
  choice: ведь это повеление исходило от Яхве через Его пророков
  rationale: Передаёт Яхве как источник повеления, а пророков — как посредников; «ведь» сохраняет объяснительную связь с предыдущей частью.
theological_decisions:
- issue: Соотношение распоряжения Давида и власти Яхве
  choice: Музыкальный порядок назван повелением Давида, Гада и Нафана, но его конечным источником представлен Яхве, говоривший через пророков.
  alternative: Считать устройство богослужения лишь царской политикой Давида, позднее получившей религиозное обоснование.
  rationale: Заключительная часть стиха прямо связывает повеление с Яхве и Его пророками, одновременно не устраняя названного ранее участия Давида, Гада и Нафана.
- issue: Кого охватывает выражение «Его пророки»
  choice: Оставлено обобщённое «Его пророки» без уточнения, относится ли оно только к Гаду и Нафану или также характеризует участие Давида.
  alternative: Явно ограничить выражение Гадом и Нафаном либо прямо включить в него Давида.
  rationale: Еврейский текст не перечисляет здесь заново лиц и допускает некоторую неопределённость объёма выражения; перевод не должен её устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; личное имя Яхве и различие титулов Гада и Нафана сохранены. Названия древних инструментов переданы привычными русскими терминами с примечанием о неопределённости.
