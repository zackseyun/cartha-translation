base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: ru
  text: Тогда Езекия велел вознести всесожжение на жертвенник. И когда началось всесожжение, началась и песнь Яхве[a] — под звуки труб и в сопровождении музыкальных инструментов Давида, царя Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «песнь Господу». Буквально: «песнь Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: велел вознести
  rationale: Сочетание обычного глагола «сказать» с инфинитивом и предлогом לְ в данном контексте передаёт косвенное повеление. «Велел вознести» естественно выражает директивную силу конструкции и сохраняет жертвенное, каузативное значение формы לְהַעֲלוֹת.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся и точный русский эквивалент названия жертвы, целиком сжигавшейся на жертвеннике.
- source_word: לַמִּזְבֵּחַ
  choice: на жертвенник
  rationale: Прямое обозначение места принесения жертвы; «жертвенник» сохраняет культовое значение מִזְבֵּחַ.
- source_word: הֵחֵל ... הֵחֵל
  choice: началось ... началась и
  rationale: Повтор глагола сохранён, чтобы передать намеренную синхронизацию начала всесожжения и храмовой песни.
- source_word: שִׁיר יְהוָה
  choice: песнь Яхве
  rationale: Буквально сохранена конструкция принадлежности, не разрешающая однозначно, означает ли она песнь, принадлежащую Яхве, посвящённую Яхве или обращённую к Нему.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: הַחֲצֹצְרוֹת
  choice: трубы
  rationale: Точное обозначение культовых труб; материал в данном стихе не указан, поэтому слово «серебряные» не добавлено.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: в сопровождении музыкальных орудий Давида
  rationale: Идиома עַל יְדֵי здесь выражает средство исполнения, а כְּלֵי в литургическом контексте обозначает музыкальные инструменты. «Орудия» сохраняет достоинство библейского регистра, а уточнение «музыкальные» устраняет ненужную лексическую неясность.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Стандартный царский титул передан непосредственно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה. Его транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл сочетания שִׁיר יְהוָה
  choice: песнь Яхве
  alternative: песнь Яхве / песнь Господу
  rationale: Еврейская конструкция допускает оттенки принадлежности, посвящения и направленности. Основной текст сохраняет её форму, а примечание сообщает наиболее вероятную альтернативу, не устраняя подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным богослужебным регистром. Синтаксис сделан естественным для русского читателя, но повтор «началось… началась» сохранён как значимая особенность еврейского текста.
