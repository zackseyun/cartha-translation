  source_fidelity: 'Основной смысл передан верно: недостаток священников, снятие шкур с жертв всесожжения, помощь левитов до окончания работы и до самоосвящения священников, а также сравнение искренности левитов в этом отношении. Однако «поддерживали» несколько расплывчато для практической помощи при обработке жертв, а расположение сноски b после «священники» не соответствует выражению, которое она поясняет.'
  naturalness: «Были более искренни сердцем» звучит по-русски не вполне естественно. Конструкция «с большей искренностью сердца освящали себя» сохраняет образ сердца и сравнительный смысл, но читается плавнее. «Пока работа не была закончена» можно естественнее передать как «пока не завершилась работа».
  terminology: «Жертвы всесожжения» и «освятили себя» точны и соответствуют умеренно традиционному библейскому регистру. «Сдирать шкуры» точнее описывает לְהַפְשִׁיט в данном жертвенном контексте, чем нейтральное «снять кожу».
