revisions:
- from: Но священников было слишком мало, и они не могли снять кожу со всех жертв всесожжения. Поэтому их братья-левиты поддерживали их[a], пока работа не была закончена и пока священники не освятили себя. Ведь в освящении себя левиты были более искренни сердцем, чем священники[b].
  to: Но священников было слишком мало, и они не могли содрать шкуры со всех жертв всесожжения. Поэтому их братья, левиты, помогали им[a], пока не завершилась работа и пока священники не освятили себя. Ведь левиты с большей искренностью сердца[b] освящали себя, чем священники.
  rationale: Исправлены естественность русской формулировки, конкретность помощи левитов и положение якоря сноски b. Сравнение ограничено искренностью левитов именно в их самоосвящении, как и в еврейском тексте; богословская интерпретация не добавляется.
