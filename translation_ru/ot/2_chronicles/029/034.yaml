source:
  edition: WLC
  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: ru
  text: Но священников было слишком мало, и они не могли содрать шкуры со всех жертв всесожжения. Поэтому их братья, левиты, помогали им[a], пока не завершилась работа и пока священники не освятили себя. Ведь левиты с большей искренностью сердца[b] освящали себя, чем священники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «укрепляли их»; по смыслу — помогали им в работе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были более прямы сердцем»; выражение подчёркивает внутреннюю цельность и искренность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Но
  rationale: Частица вводит ограничение и одновременно противопоставляет эту ситуацию предшествующему повествованию; в русском контексте естественно «Но», тогда как недостаточность числа прямо выражена далее.
- source_word: לִמְעָט
  choice: было слишком мало
  rationale: При היה оборот обозначает не просто малое число, а недостаточность священников для выполнения всей работы.
- source_word: לְהַפְשִׁיט
  choice: снять кожу
  rationale: Глагол обозначает снятие шкуры с жертвенного животного; современное «снять кожу» понятно и точно.
- source_word: הָעֹלוֹת
  choice: жертвы всесожжения
  rationale: Передаёт установленный жертвенный термин עֹלָה и сохраняет представление о жертве, целиком возносимой на жертвенник.
- source_word: וַיְחַזְּקוּם
  choice: поддерживали их
  rationale: Буквально глагол означает «укрепили их», но в данном контексте речь идёт о практической помощи в работе. «Поддерживали» сохраняет образ укрепления и остаётся естественным по-русски.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: их братья-левиты
  rationale: Сохраняет буквальное родственное обозначение и ясно указывает, кто именно оказал помощь.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: пока работа не была закончена
  rationale: Передаёт продолжительность помощи вплоть до полного завершения дела.
- source_word: יִתְקַדְּשׁוּ
  choice: освятили себя
  rationale: Возвратная форма указывает на ритуальное приготовление к священному служению; «освятили себя» сохраняет библейскую культовую лексику и остаётся понятным.
- source_word: יִשְׁרֵי לֵבָב
  choice: были более искренни сердцем
  rationale: Оборот описывает внутреннюю прямоту и искренность. Сравнительная степень обусловлена последующим מִן; формулировка сохраняет сердечную, а не только внешнюю сторону освящения.
- source_word: לְהִתְקַדֵּשׁ מֵהַכֹּהֲנִים
  choice: в освящении себя … чем священники
  rationale: Предлог מִן выражает сравнение. Русская конструкция естественно связывает внутреннюю искренность именно с освящением себя, не расширяя упрёк на всё священство вообще.
theological_decisions:
- issue: Характер сравнения левитов со священниками
  choice: Левиты были более искренни сердцем именно в освящении себя, чем священники.
  alternative: Левиты быстрее, усерднее или охотнее освятили себя, чем священники.
  rationale: יִשְׁרֵי לֵבָב указывает прежде всего на внутреннюю прямоту или искренность, а не только на скорость либо организационную готовность. Сравнение сохранено в пределах данной ситуации без общего осуждения священства.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной храмовой лексикой («жертвы всесожжения», «освятили себя»). Синтаксис разделён на ясные предложения; сохранены сравнительная острота заключения и образ сердца.
