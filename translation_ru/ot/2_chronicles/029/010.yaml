  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: временное «теперь», внутреннее намерение Езекии, заключение завета с Яхве, титул «Бог Израиля», а также желаемое/ожидаемое отвращение Божьего пылающего гнева от народа. «Чтобы ... отвратился» уместно передаёт целевую или желаемую результирующую связь, не превращая её в безусловное предсказание.'
