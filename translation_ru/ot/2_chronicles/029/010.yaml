source:
  edition: WLC
  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: ru
  text: Теперь у меня на сердце — заключить завет с Яхве, Богом Израиля, чтобы Его пылающий гнев отвратился от нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт непосредственность решения Езекии и естественно звучит в современном русском языке.
- source_word: עִם לְבָבִי
  choice: у меня на сердце
  rationale: Сохраняет еврейский образ внутреннего намерения и в данном контексте ясно выражает твёрдое решение.
- source_word: לִכְרֹת בְּרִית
  choice: заключить завет
  rationale: Это естественное русское соответствие устойчивому еврейскому выражению, буквально означающему «разрезать завет».
- source_word: לַיהוָה
  choice: с Яхве
  rationale: Предлог ל после выражения о заключении завета обозначает участника завета; по-русски это естественно передаётся предлогом «с». Личное имя יהוה передано как «Яхве».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Прямо и естественно передаёт титул Бога как Бога народа Израиля.
- source_word: וְיָשֹׁב
  choice: чтобы… отвратился
  rationale: В контексте союз ו может вводить желаемое следствие намерения заключить завет; форма «чтобы… отвратился» сохраняет эту целевую или результативную связь.
- source_word: חֲרוֹן אַפּוֹ
  choice: Его пылающий гнев
  rationale: Сохраняет образ жара и усиленное значение еврейского выражения, оставаясь понятным и литературным по-русски.
- source_word: מִמֶּנּוּ
  choice: от нас
  rationale: Точно передаёт местоименный суффикс первого лица множественного числа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблено тетраграмматон — личное заветное имя Бога. Транслитерация «Яхве» отличает его от титула אֲדֹנָי и сохраняет связь с исходным именем.
- issue: Связь между заключением завета и отвращением гнева
  choice: «чтобы Его пылающий гнев отвратился»
  alternative: «и Его пылающий гнев отвратится»
  rationale: Контекст допускает оттенок желаемого следствия или цели, но не утверждает механическую причинность; конструкция с «чтобы» сохраняет эту смысловую осторожность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Оборот «у меня на сердце» сохраняет исходный образ, а «заключить завет» соответствует естественной русской идиоматике. Слово «Его» написано с прописной буквы как традиционная русская форма почтительного местоименного обозначения Бога.
