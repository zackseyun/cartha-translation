  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: ru
  text: Ведь наши отцы нарушили верность[a] и делали зло в глазах Яхве, нашего Бога. Они оставили Его, отвернулись от обители Яхве[b] и повернулись к Нему спиной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступали вероломно», «изменяли». Еврейский глагол часто обозначает нарушение верности, в том числе верности завету.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от места пребывания Яхве». Возможен перевод «от скинии Яхве», однако здесь имеется в виду храм как место Его пребывания.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «дали шею»; образ обращения затылка. Эта идиома выражает отказ и непокорность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: поступали неверно
  rationale: Глагол מעל обозначает нарушение верности, нередко в заветном или культовом контексте; выражение передаёт этот смысл естественным современным русским языком.
- source_word: הָרַע
  choice: делали зло
  rationale: Сочетание עשה הרע — обычная древнееврейская формула со значением «делать зло».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён прозрачный древнееврейский образ моральной оценки с точки зрения Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיַּעַזְבֻהוּ
  choice: оставили Его
  rationale: В контексте речь идёт о религиозном и заветном оставлении Бога; русский глагол сохраняет как буквальный, так и реляционный смысл.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: отвернулись
  rationale: Естественно передаёт буквальный образ поворота лица прочь и намеренное отвержение.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: от обители Яхве
  rationale: מִשְׁכָּן буквально означает место пребывания или жилище; «обитель» сохраняет этот смысл и в данном храмовом контексте не создаёт ошибочной отсылки только к скинии.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: повернулись к Нему спиной
  rationale: Древнееврейская идиома буквально говорит о подставленной или обращённой шее и выражает упорный отказ; русский образ спины передаёт её естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение מִשְׁכָּן в храмовом контексте
  choice: обитель Яхве
  alternative: скиния Яхве; святилище Яхве
  rationale: Выбор сохраняет идею места пребывания Яхве, не отождествляя упомянутое здесь храмовое здание исключительно с переносной скинией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образы «в глазах» и «повернулись спиной» сохранены; архаические и узкоконфессиональные формулировки исключены.
