  source_fidelity: 'В целом переданы гнев Яхве, направленность суда на Иудею и Иерусалим, а также видимое подтверждение этого суда. Однако сочетание «предметом ужаса, запустения и насмешливого свиста» неудачно: определение «предметом» грамматически распространяется и на «запустение», хотя еврейский ряд называет три результата/характеристики. Более параллельная русская передача точнее сохраняет структуру.'
