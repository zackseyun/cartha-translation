base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: ru
  text: И потому гнев Яхве пал на Иудею и Иерусалим, и Он сделал их ужасом[a], запустением и поводом для насмешливого свиста[b], как вы видите своими глазами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, что вызывает содрогание»; еврейское слово обозначает то, что внушает ужас.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «шипения»; имеется в виду презрительная реакция людей на увиденное разорение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: гнев
  rationale: Передаёт сильный Божий гнев, проявляющийся в суде, не ослабляя суровости исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיְהִי ... עַל
  choice: пал на
  rationale: Естественная русская идиома, выражающая наступление гнева и его направленность против Иудеи и Иерусалима.
- source_word: וַיִּתְּנֵם
  choice: Он сделал их
  rationale: В конструкции с ל глагол указывает на приведённое Богом состояние; эта формулировка ясно передаёт результат суда.
- source_word: לְזוֹעָה
  choice: предметом ужаса
  rationale: Слово обозначает то, что вызывает содрогание или ужас у видящих; формулировка сохраняет публичный характер бедствия.
- source_word: לְשַׁמָּה
  choice: запустения
  rationale: Передаёт состояние разорения и опустошённости как результат суда.
- source_word: וְלִשְׁרֵקָה
  choice: насмешливого свиста
  rationale: Сохраняет конкретный образ свиста или шипения наблюдателей и явно передаёт его презрительно-насмешливый оттенок.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: как вы видите своими глазами
  rationale: Сохраняет эмфатическое обращение к непосредственно наблюдаемому свидетельству.
theological_decisions:
- issue: Передача языка Божьего суда без смягчения
  choice: гнев Яхве пал... и Он сделал их предметом ужаса, запустения и насмешливого свиста
  alternative: Яхве разгневался... и предал их ужасу, разорению и поруганию
  rationale: Выбранный вариант сохраняет прямое приписывание суда Яхве, его суровость и публичный позор, не добавляя богословских объяснений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конкретный образ насмешливого свиста сохранён, а тройное описание последствий суда передано без конфессионального истолкования.
