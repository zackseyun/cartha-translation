  terminology: «Яхве» последовательно передаёт тетраграмматон. Для בֵּית יְהוָה в данном контексте «храм Яхве» естественнее современного русского «дом Яхве» и согласуется с храмовым контекстом. «Притвор» — приемлемый эквивалент אוּלָם; сноска корректно указывает альтернативы.
