  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: ru
  text: Они приступили к освящению в первый день первого месяца, а на восьмой день месяца дошли до притвора Яхве[a]. Затем они освятили храм Яхве за восемь дней и закончили в шестнадцатый день первого месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до портика» или «до преддверия Яхве».'
    reason: Еврейское אוּלָם обозначает входную часть храмового здания; точное русское архитектурное соответствие зависит от принятой терминологии.
lexical_decisions:
- source_word: וַיָּחֵלּוּ לְקַדֵּשׁ
  choice: начали освящать храм
  rationale: Глагольное сочетание означает начало освящения. В еврейском тексте дополнение не выражено, но из непосредственного контекста ясно, что речь идёт о храме; его добавление делает русскую фразу естественной, не меняя смысла.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: в первый день первого месяца
  rationale: Еврейская формула даты передана привычным современным русским оборотом.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: дошли до притвора Яхве
  rationale: בוא с направительным ל допускает значение достижения места. «Дошли до» естественно передаёт этап продвижения работ, а אוּלָם обозначает переднюю пристройку или входную часть храма.
- source_word: וַיְקַדְּשׁוּ אֶת בֵּית יְהוָה
  choice: освящали дом Яхве
  rationale: קדשׁ в данном храмовом контексте включает ритуальное очищение и возвращение к священному употреблению. «Освящали» сохраняет ключевой корень и подходит к процессу длительностью восемь дней.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: восемь дней
  rationale: Оборот обозначает продолжительность работ; русская форма сохраняет связь с указанной далее датой завершения.
- source_word: כִּלּוּ
  choice: закончили
  rationale: Пиэль глагола כלה означает завершение начатого дела; краткое «закончили» естественно замыкает хронологическое сообщение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст дважды употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Значение освящения храма
  choice: освящать
  alternative: очищать
  rationale: Контекст включает очищение, однако קדשׁ шире и указывает на приготовление храма к священному употреблению. Поэтому выбран более ёмкий эквивалент без сведения действия только к очистке.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Хронология передана ясно и последовательно; архаичные формы избегаются. Маркер сноски помещён непосредственно после слова «притвора Яхве», к которому относится лексическая альтернатива.
