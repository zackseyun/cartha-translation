- from: Они начали освящать храм в первый день первого месяца, а на восьмой день месяца дошли до притвора Яхве[a]. Затем они освящали дом Яхве восемь дней и закончили в шестнадцатый день первого месяца.
  to: Они приступили к освящению в первый день первого месяца, а на восьмой день месяца дошли до притвора Яхве[a]. Затем они освятили храм Яхве за восемь дней и закончили в шестнадцатый день первого месяца.
  rationale: Правка уточняет аспект завершённого действия во второй части стиха, делает последовательность работ яснее и заменяет менее естественное в современном русском «дом Яхве» на контекстуально точное «храм Яхве». Альтернатива для אוּלָם и её якорь сохранены.
