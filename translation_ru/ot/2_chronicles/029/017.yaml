  source_fidelity: 'Смысл и хронология переданы в целом верно: начало в первый день, достижение притвора в восьмой, освящение храмового здания в течение восьми дней и завершение в шестнадцатый. Однако русское «освящали ... восемь дней» несколько ослабляет завершённость второго וַיִּקְטֹל и создаёт менее ясную связь с последующим «закончили».'
