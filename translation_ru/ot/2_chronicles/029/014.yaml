  text: וּ/מִן בְּנֵ֥י הֵימָ֖ן יחואל וְ/שִׁמְעִ֑י וּ/מִן בְּנֵ֣י יְדוּת֔וּן שְׁמַֽעְיָ֖ה וְ/עֻזִּיאֵֽל־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: ru
  text: и из сыновей Емана — Иехуил и Шимей; из сыновей Идифуна — Шемаия и Озиил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: и из
  rationale: Союз ו связывает стих с предшествующим перечислением, а מן указывает на принадлежность названных людей к соответствующей родовой или служебной группе.
- source_word: בְּנֵי
  choice: сыновей
  rationale: Прямой и прозрачный эквивалент, который в данном перечне может обозначать также потомков или членов рода.
- source_word: הֵימָן
  choice: Емана
  rationale: Традиционная русская библейская форма личного имени, поставленная в родительном падеже после «из сыновей».
- source_word: יחואל
  choice: Иехуил
  rationale: Передача данного личного имени, отражающая еврейскую согласную форму и согласующаяся с русской библейской ономастической традицией.
- source_word: וְשִׁמְעִי
  choice: и Шимей
  rationale: Союз сохранён как часть структуры перечня; имя передано в принятой русской форме.
- source_word: יְדוּתוּן
  choice: Идифуна
  rationale: Использована устоявшаяся русская библейская форма имени в родительном падеже.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Форма близко передаёт еврейское имя и позволяет отличить его от иных сходных имён.
- source_word: וְעֻזִּיאֵל
  choice: и Озиил
  rationale: Союз сохранён; использована традиционная русская библейская форма имени.
theological_decisions: []
