translation:
  language: ru
  text: Затем он привёл священников и левитов и собрал их на восточной площади[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площади с восточной стороны».'
    reason: Сочетание לִרְחוֹב הַמִּזְרָח можно понимать как обозначение восточной площади либо площади, расположенной с восточной стороны.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Затем он велел прийти
  rationale: Глагол בוא в породе хифиль означает «побудить прийти, привести». В данном контексте царь созывает людей, поэтому «велел прийти» естественно передаёт каузативный смысл, не создавая впечатления, будто он привёл их лично.
- source_word: הַכֹּהֲנִים
  choice: священникам
  rationale: Обычное современное соответствие для כֹּהֲנִים; дательный падеж обусловлен русской конструкцией «велел прийти».
- source_word: הַלְוִיִּם
  choice: левитам
  rationale: Традиционное и точное обозначение левитов как группы храмовых служителей, отличной от священников.
- source_word: וַיַּאַסְפֵם
  choice: собрал их
  rationale: Форма от אסף с местоименным суффиксом означает «собрал их». Выражение естественно для публичного собрания и сохраняет последовательность действий.
- source_word: לִרְחוֹב
  choice: на площади
  rationale: רְחוֹב обозначает широкое открытое пространство, площадь. Предлог לְ допускает направление или место назначения; по-русски при глаголе «собрал» естественно «на площади».
- source_word: הַמִּזְרָח
  choice: восточной
  rationale: מִזְרָח означает «восток, восточный». Сочетание допускает понимание как «восточная площадь» либо «площадь с восточной стороны»; основной текст передаёт первое, а примечание сохраняет второе.
