base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: ru
  text: Сыновья мои, не будьте теперь беспечны, ибо Яхве избрал вас, чтобы стоять перед Ним[a], служить Ему, быть Его служителями и совершать воскурения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Стоять перед Ним» — священническое выражение, означающее служить в Божьем присутствии.
    reason: cultural_note
  - marker: b
    text: 'Или: «быть Его служителями и воскурителями». Еврейское слово может относиться к возжиганию благовоний или к вознесению жертвы в дыме; здесь храмовый контекст указывает прежде всего на воскурение благовоний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: Сыновья мои
  rationale: Буквальное обращение во множественном числе с суффиксом первого лица; мужская форма уместна в обращении к священникам и левитам.
- source_word: עַתָּה אַל תִּשָּׁלוּ
  choice: теперь не будьте нерадивы
  rationale: עַתָּה передаёт непосредственность призыва, а глагол в данном контексте означает проявлять небрежность, медлить или уклоняться от обязанности.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: Яхве избрал вас
  rationale: Фронтированное בָכֶם подчёркивает адресатов избрания; личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: לַעֲמֹד לְפָנָיו
  choice: чтобы вы стояли перед Ним
  rationale: Сохранён еврейский образ, являющийся также священническим выражением служения в Божьем присутствии.
- source_word: לְשָׁרְתוֹ
  choice: служили Ему
  rationale: שרת обозначает служение, особенно храмовое; русское «служили» естественно и сохраняет культовый контекст.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: были Его служителями, воскуряющими благовония
  rationale: Оба причастия описывают назначенную функцию. Причастный оборот естественно передаёт связь служителей с обязанностью совершать воскурения, не превращая её просто в отдельное действие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Связь מְשָׁרְתִים и מַקְטִרִים
  choice: служителями, воскуряющими благовония
  alternative: служителями и совершающими воскурения
  rationale: Еврейский допускает восприятие двух согласованных обозначений роли. Русский причастный оборот сохраняет параллельность функций и избегает неестественного существительного «воскурители».
translation_notes:
  register: Современный литературный русский язык с достоинством храмового обращения. Синтаксис сделан плавным, при этом сохранены личное имя Яхве, образ «стоять перед Ним» и ролевая форма заключительных причастий.
