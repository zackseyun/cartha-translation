  source_fidelity: В целом перевод верно передаёт обращение, запрет на нерадивость, избрание Яхве и храмовые обязанности. Однако оборот «служителями, воскуряющими благовония» делает последнее причастие зависимой характеристикой «служителей», тогда как в еврейском тексте מְשָׁרְתִים и מַקְטִירִים — однородные обозначения назначенного служения. Кроме того, исходное מַקְטִירִים не уточняет предмет воскурения; «благовония» допустимы по контексту, но несколько сужают значение.
  naturalness: Русский текст в целом литературен. «Сыновья мои» уместно в торжественном обращении к мужской храмовой группе. Более естественная и точная финальная координация достигается инфинитивом «совершать воскурения». «Не будьте теперь беспечны» ясно передаёт призыв не проявлять небрежности или беспечности.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Стоять перед Ним» сохранено как важный священнический образ; «служить» естественно для храмового контекста. «Совершать воскурения» сохраняет широту еврейского термина, не предрешая, идёт ли речь исключительно о благовониях.
