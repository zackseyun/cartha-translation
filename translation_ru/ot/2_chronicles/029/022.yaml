  text: וַֽ/יִּשְׁחֲטוּ֙ הַ/בָּקָ֔ר וַ/יְקַבְּל֤וּ הַ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וַֽ/יִּזְרְק֖וּ הַ/מִּזְבֵּ֑חָ/ה וַ/יִּשְׁחֲט֣וּ הָ/אֵלִ֗ים וַ/יִּזְרְק֤וּ הַ/דָּם֙ הַ/מִּזְבֵּ֔חָ/ה וַֽ/יִּשְׁחֲטוּ֙ הַ/כְּבָשִׂ֔ים וַ/יִּזְרְק֥וּ הַ/דָּ֖ם הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: ru
  text: Затем закололи крупный скот[a], а священники приняли кровь и выплеснули её на жертвенник[b]. Потом закололи баранов и выплеснули кровь на жертвенник; закололи ягнят и выплеснули кровь на жертвенник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быков». Древнееврейское слово имеет собирательное значение и обозначает крупный рогатый скот, не уточняя здесь пол животных.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «плеснули кровь на жертвенник», «бросили кровь на жертвенник». Древнееврейский глагол обозначает энергичное обрядовое нанесение крови, а не лёгкое окропление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: закололи
  rationale: В контексте жертвоприношения שׁחט означает ритуальный убой; «закололи» естественно и точно передаёт это значение.
- source_word: הַבָּקָר
  choice: крупный скот
  rationale: בקר — собирательное обозначение крупного рогатого скота; перевод не уточняет пол животных без достаточного основания в самом слове.
- source_word: וַיְקַבְּלוּ
  choice: приняли
  rationale: Кратко и близко к прямому значению קבל; в контексте понятно, что священники приняли кровь для последующего обрядового действия.
- source_word: וַיִּזְרְקוּ
  choice: выплеснули
  rationale: В жертвенном обряде זרק обозначает энергичное нанесение крови на жертвенник. «Выплеснули» лучше сохраняет силу действия, чем обычное «окропили».
- source_word: הַמִּזְבֵּחָה
  choice: на жертвенник
  rationale: Направительная форма выражает движение к жертвеннику с нанесением крови на его поверхность; по-русски естественно «на жертвенник».
- source_word: הָאֵלִים
  choice: баранов
  rationale: Обычное точное соответствие древнееврейскому אֵילִים.
- source_word: הַכְּבָשִׂים
  choice: ягнят
  rationale: В перечне жертвенных животных כְּבָשִׂים естественно обозначает ягнят или молодых овец; «ягнят» соответствует данному обрядовому контексту.
