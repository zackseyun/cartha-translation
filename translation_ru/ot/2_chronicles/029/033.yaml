lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: А посвящённых животных
  rationale: Субстантивированное множественное «посвящённые святыни / посвящённые предметы» в данном контексте обозначает животных, отделённых для священного приношения; добавление «животных» естественно связывает выражение с последующим перечислением.
- source_word: בָּקָר
  choice: крупного скота
  rationale: Собирательное обозначение крупного рогатого скота без уточнения пола или назначения; русский термин сохраняет эту широту.
- source_word: שֵׁשׁ מֵאוֹת
  choice: шестьсот голов
  rationale: Числительное передано прямо; счётное слово «голов» необходимо для естественного русского перечисления скота.
- source_word: וְצֹאן
  choice: и три тысячи голов мелкого скота
  rationale: Собирательное צֹאן может охватывать овец и коз; «мелкий скот» сохраняет более широкий смысл оригинала и не сужает его до одних овец.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: три тысячи голов
  rationale: Числительное передано прямо с естественным русским счётным словом.
