  source_fidelity: Текст точно передаёт повторяющуюся конструкцию וּמִן («и из») и родовое обозначение בְּנֵי («сыновей»), а также все четыре имени. Передача «Иеуэл» оправдана еврейской формой יעואל (Yeʿûʾēl) и не должна заменяться на «Иеиел», соответствующее иной сходной форме имени.
