  terminology: «Сыновья Элицафана/Асафа» корректно сохраняет родовое выражение без неоправданного сужения его значения до непосредственных сыновей. Формы имён последовательны и приемлемы как близкая к еврейскому тексту передача; «Захария» и «Маттания» соответствуют принятому русскому библейскому именослову.
