  text: וּ/מִן בְּנֵי֙ אֱלִ֣יצָפָ֔ן שִׁמְרִ֖י ו/יעואל וּ/מִן בְּנֵ֣י אָסָ֔ף זְכַרְיָ֖הוּ וּ/מַתַּנְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: ru
  text: и из сыновей Элицафана[a] — Шимри и Иеуэл[b]; и из сыновей Асафа — Захария и Маттания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «сыновья Элицафана» может обозначать не только его непосредственных сыновей, но также потомков или членов его рода.
    reason: lexical_alternative
  - marker: b
    text: Еврейская форма имени здесь — Иеуэл; в других местах встречается сходное имя Иеиел.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: и из
  rationale: Союз ו и предлог מן переданы раздельно, чтобы сохранить связь с предшествующим перечнем и параллельное построение стиха.
- source_word: בְּנֵי
  choice: сыновей
  rationale: Буквальное и естественное для родословного перечня соответствие; в данном контексте слово может также обозначать потомков или членов рода.
- source_word: אֱלִיצָפָן
  choice: Элицафан
  rationale: Имя транслитерировано непосредственно с еврейской формы, без замены традиционной формой, восходящей к иной передаче согласных.
- source_word: שִׁמְרִי
  choice: Шимри
  rationale: Прямая современная русская транслитерация еврейского личного имени.
- source_word: ו/יעואל
  choice: и Иеуэл
  rationale: Сохранены союз и согласный состав имени יעואל; такая передача отличает его от сходного имени Иеиел.
- source_word: בְּנֵי אָסָף
  choice: сыновей Асафа
  rationale: Сохранено родовое обозначение, в котором Асаф выступает как предок или глава соответствующего рода.
- source_word: זְכַרְיָהוּ
  choice: Захария
  rationale: Употреблена закрепившаяся в русском библейском именослове форма имени.
- source_word: וּ/מַתַּנְיָהוּ
  choice: и Маттания
  rationale: Союз сохранён, а имя передано близко к еврейской форме מַתַּנְיָהוּ.
