revisions:
- from: Священники закололи их и совершили обряд очищения их кровью у жертвенника[a], чтобы искупить весь Израиль, потому что царь повелел принести всесожжение и жертву за грех[b] за весь Израиль.
  to: Священники закололи их и совершили очистительный обряд, нанеся их кровь на жертвенник[a], чтобы совершить искупление за весь Израиль, потому что царь сказал, что всесожжение и жертва за грех[b] должны быть принесены за весь Израиль.
  rationale: 'Перевод исправлен для более точной передачи ритуального действия с кровью на жертвеннике, направленности искупления «за весь Израиль» и нейтрального значения «царь сказал». Сноска a теперь отражает действительную лексико-синтаксическую альтернативу: очищение жертвенника кровью. Маркеры сносок сохранены и поставлены непосредственно после соответствующих выражений.'
  reviewer_model: gpt-5.6-terra
