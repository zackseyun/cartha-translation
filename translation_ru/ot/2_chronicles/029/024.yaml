base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: ru
  text: Священники закололи их и совершили очистительный обряд, нанеся их кровь на жертвенник[a], чтобы совершить искупление за весь Израиль, потому что царь сказал, что всесожжение и жертва за грех[b] должны быть принесены за весь Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистили жертвенник их кровью»; еврейский глагол может обозначать совершение очистительного обряда или обряда жертвы за грех.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очистительная жертва».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: закололи их
  rationale: Глагол שׁחט в жертвенном контексте означает ритуальное заклание; местоименный суффикс отсылает к козлам из предыдущего стиха.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: совершили обряд очищения их кровью у жертвенника
  rationale: Порода hiphil глагола חטא в культовом контексте обозначает совершение очистительного обряда; формулировка сохраняет ритуальный смысл и не утверждает сверх текста, что сама кровь являлась жертвой.
- source_word: לְכַפֵּר
  choice: чтобы искупить
  rationale: В жертвенном контексте כפר обозначает совершение искупления; русский глагол передаёт цель обряда естественно и ёмко.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: весь Израиль / за весь Израиль
  rationale: Предлог עַל при כפר указывает на тех, ради кого совершается искупление; при обозначении предназначения жертв естественно русское «за весь Израиль».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину того, почему жертвы предназначались для всего Израиля.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: царь повелел принести ... за весь Израиль
  rationale: Буквально стоит «царь сказал»; в данном распорядительном контексте речь царя имеет силу повеления. Русский порядок слов проясняет связь с двумя последующими видами жертв.
- source_word: הָעוֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский библейский термин для жертвы, полностью сжигаемой на жертвеннике.
- source_word: וְהַחַטָּאת
  choice: жертва за грех
  rationale: Традиционный и понятный русский эквивалент культового значения חטאת; очистительный оттенок сохранён в примечании.
theological_decisions:
- issue: Передача культовых терминов חטא и חטאת
  choice: В повествовании об обряде употребить «обряд очищения», а название жертвы передать как «жертва за грех».
  alternative: «очистительная жертва» и более буквальное «нанесли их кровь на жертвенник»
  rationale: Корень חטא здесь сочетает отношение ко греху с очистительной функцией обряда. Основной текст сохраняет оба оттенка в соответствующих местах, а примечания фиксируют допустимые альтернативы, не разрешая богословское напряжение односторонне.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной и понятной жертвенной терминологии. Синтаксис умеренно формальный и пригодный для публичного чтения; подлинная неоднозначность культового корня חטא отмечена в сносках.
