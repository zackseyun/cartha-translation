    reason: lexical_alternative
lexical_decisions:
- source_word: קָּהָל
  choice: собрание
  rationale: Обозначает собравшуюся для богослужения общину; «собрание» передаёт коллективный смысл без более поздних конфессиональных оттенков.
- source_word: מִשְׁתַּחֲוִים
  choice: склонялось ниц
  rationale: Глагол обозначает телесное преклонение или простирание; перевод сохраняет физический характер действия, а не заменяет его более общим «поклонялось».
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: песнь звучала
  rationale: Буквальная конструкция с существительным «песнь» и причастием от глагола «петь» по-русски передана естественно, при сохранении образа звучащей песни.
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: трубы трубили
  rationale: Речь идёт о культовых прямых трубах и их непрерывном звучании; однокоренная русская конструкция естественна и передаёт действие причастной формы.
- source_word: הַכֹּל
  choice: всё это
  rationale: Суммирует все перечисленные действия богослужения.
- source_word: עַד לִכְלוֹת
  choice: до окончания
  rationale: Инфинитивная конструкция указывает на момент, до которого продолжались действия.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский термин для жертвы, целиком сжигавшейся на жертвеннике.
