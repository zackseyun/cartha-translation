base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: ru
  text: Царь Езекия встал рано утром, собрал городских начальников и поднялся к дому Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: встал рано утром
  rationale: Порода hифиль глагола שׁכם обозначает раннее начало действия, обычно вставание рано утром; перевод естественно и явно передаёт временной оттенок.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: царь Езекия
  rationale: В русском языке титул перед именем звучит естественно и сохраняет приложение исходного текста; имя передано в принятой русской библейской форме.
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: В данном контексте אָסַף означает созвать или собрать людей вместе; «собрал» точно и естественно.
- source_word: אֵת שָׂרֵי הָעִיר
  choice: городских начальников
  rationale: שָׂרִים здесь обозначает руководителей или должностных лиц города, а не обязательно наследственных князей; выбранное выражение передаёт их властное положение без лишней сословной окраски.
- source_word: וַיַּעַל
  choice: поднялся
  rationale: עָלָה буквально выражает движение вверх; перевод сохраняет характерный образ восхождения к храму.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквальное словосочетание «дом Яхве» сохраняет храмовое обозначение исходного текста и передаёт тетраграмматон как личное имя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как собственное имя Бога. «Яхве» непосредственно передаёт это имя и не заменяет его титулом; при этом форма «Иегова» менее близка к наиболее вероятному древнееврейскому произношению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены последовательность действий и образ восхождения к дому Яхве; архаизмы и канцеляризмы устранены.
