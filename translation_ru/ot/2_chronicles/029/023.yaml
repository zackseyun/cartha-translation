  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: ru
  text: Затем козлов для жертвы за грех подвели перед царём и собранием[a], и они возложили на них руки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «представили козлов для жертвы за грех перед царём и собранием».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «они возложили свои руки на них». Наиболее естественно «они» относится к царю и собранию, возможно действовавшим через представителей; однако референт этого подлежащего отдельно не уточнён.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: подвели
  rationale: Порода hифиль от נגשׁ означает «приблизить, подвести, представить». «Подвели» передаёт конкретное движение в обрядовой обстановке и естественно звучит по-русски.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: козлов для жертвы за грех
  rationale: שָׂעִיר обозначает козла, а חַטָּאת в данном жертвенном контексте — жертву за грех, а не грех как отвлечённое понятие.
- source_word: לִפְנֵי
  choice: к царю и собранию
  rationale: В сочетании с глаголом приближения לִפְנֵי указывает, перед кем или к кому подвели животных. Русское «к» здесь передаёт ситуацию естественнее буквального «перед».
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: царю и собранию
  rationale: קָהָל означает собравшееся сообщество народа. «Собрание» сохраняет общественный и богослужебный контекст без узкоконфессиональной окраски.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: они возложили … руки
  rationale: סמך с упоминанием рук в жертвенном обряде обозначает ритуальное возложение рук на животное. Местоимение «они» сохраняет формальную неопределённость подлежащего.
- source_word: עֲלֵיהֶם
  choice: на них
  rationale: Местоименный суффикс мужского рода во множественном числе относится к козлам; «на них» — точная и естественная передача.
theological_decisions:
- issue: Значение חַטָּאת в жертвенном контексте
  choice: жертва за грех
  alternative: грех
  rationale: Животных подводят для совершения обряда и возлагают на них руки, поэтому חַטָּאת здесь обозначает вид жертвы, а не грех как отвлечённое понятие.
- issue: Кто возложил руки на козлов
  choice: сохранено местоимение «они», наиболее естественно относящееся к царю и собранию
  alternative: руки возложили священники либо те, кто подвёл козлов
  rationale: Ближайшие названные участники — царь и собрание, а выражение «их руки» естественно указывает на них, возможно на действие через представителей. Однако еврейский текст прямо не называет подлежащее второго глагола, поэтому перевод не устраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Сакральная терминология передана привычным выражением «жертва за грех», а неоднозначность подлежащего во второй части стиха сохранена и пояснена в сноске.
