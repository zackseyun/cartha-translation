  text: וְ/הִנֵּ֛ה נָפְל֥וּ אֲבוֹתֵ֖י/נוּ בֶּ/חָ֑רֶב וּ/בָנֵ֨י/נוּ וּ/בְנוֹתֵ֧י/נוּ וְ/נָשֵׁ֛י/נוּ בַּ/שְּׁבִ֖י עַל זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: ru
  text: И вот[a], наши отцы пали от меча, а наши сыновья, наши дочери и наши жёны из-за этого находятся в плену.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение подчёркнуто привлекает внимание к следующему сообщению; возможно также: «И посмотрите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет соединительный союз и функцию еврейского указательного маркера, emphатически привлекающего внимание к следующему сообщению; выражение естественно для современного литературного русского языка.
- source_word: נָפְלוּ
  choice: пали
  rationale: Передаёт буквальный образ глагола נפל и его обычный в военном контексте смысл — погибнуть; сохраняет торжественно-скорбный тон.
- source_word: אֲבוֹתֵינוּ
  choice: наши отцы
  rationale: Точно сохраняет мужской род и семейно-поколенческий смысл исходного слова; нейтральное «предки» было бы менее конкретным.
- source_word: בֶּחָרֶב
  choice: от меча
  rationale: Естественный русский эквивалент еврейского оборота, обозначающего насильственную смерть от оружия.
- source_word: וּבָנֵינוּ וּבְנוֹתֵינוּ
  choice: наши сыновья, наши дочери
  rationale: Сохраняет намеренное различение сыновей и дочерей, а также повтор притяжательного элемента в еврейском тексте.
- source_word: וְנָשֵׁינוּ
  choice: наши жёны
  rationale: В перечне членов семей контекстуально точнее, чем более широкое «наши женщины».
- source_word: בַּשְּׁבִי
  choice: находятся в плену
  rationale: Передаёт именную конструкцию со значением состояния, не добавляя прямо не выраженного глагола «увели» или «захватили».
- source_word: עַל זֹאת
  choice: из-за этого
  rationale: Ясно выражает причинное значение оборота и его отсылку к описанной ранее неверности Иуды.
theological_decisions:
- issue: Конкретные родственные группы в описании суда
  choice: наши отцы… наши сыновья, наши дочери и наши жёны
  alternative: наши предки… наши дети и наши женщины
  rationale: Исходный текст намеренно называет отдельные семейные группы; перевод сохраняет эти различия и не заменяет их обобщающими обозначениями.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, скорбным звучанием. Повтор «наши» сохранён ради риторической силы и соответствия структуре еврейского текста.
