base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: ru
  text: 'Тогда встали левиты: Махат, сын Амасая, и Иоиль, сын Азарии, — из сыновей Каафа[a]; из сыновей Мерари — Кис, сын Авдия, и Азария, сын Иехаллелела; из гирсонитов[b] — Иоах, сын Зиммы, и Еден, сын Иоаха.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из сыновей Каафа». Эта родословная формула указывает, что названные люди принадлежали к левитскому роду Каафа.'
    reason: cultural_note
  - marker: b
    text: 'Или: «из потомков Гирсона». Здесь в еврейском тексте употреблено родовое обозначение, а не повторена формула «из сыновей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: тогда встали
  rationale: Форма от קום обозначает начало действия в ответ на предшествующее повеление; «встали» естественно и достаточно формально передаёт повествовательный переход.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое русское обозначение членов колена Левия; определённость передаётся контекстом.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: из сыновей Каафа
  rationale: Сохранена древнееврейская родословная формула, связывающая названных людей с левитским родом Каафа.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: из сыновей Мерари
  rationale: Сохранён повтор исходной родословной формулы и её параллелизм с предшествующей частью.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: из потомков Гирсона
  rationale: Субстантивированное родовое обозначение в единственном числе имеет собирательный смысл; «потомки Гирсона» естественно передаёт принадлежность к роду, не имитируя отличающуюся еврейскую форму буквально.
- source_word: בֶּן
  choice: сын
  rationale: Прямое и обычное соответствие в данном перечне ближайших родственных связей.
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: Махат; Амасай; Иоиль; Азария; Кис; Авдий; Иехаллелел; Иоах; Зимма; Еден
  rationale: Имена переданы традиционными или близкими к еврейской форме русскими библейскими соответствиями; יְהַלֶּלְאֵל передано как «Иехаллелел» для различимости согласных и теофорного окончания.
