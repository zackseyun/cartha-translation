source:
  edition: WLC
  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: ru
  text: Они также затворили двери притвора[a], погасили светильники, не воскуряли благовоний и не приносили всесожжений в святилище[b] Богу Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «двери входного зала»; еврейское слово אוּלָם обозначает передний, входной зал храма.
    reason: lexical_alternative
  - marker: b
    text: Или «в святом месте»; еврейское קֹדֶשׁ может обозначать священное пространство храма.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: также
  rationale: Передаёт присоединение этого проступка к перечисленным ранее и сохраняет накопительный характер обвинения.
- source_word: סָגְרוּ
  choice: затворили
  rationale: Точно передаёт закрытие дверей; слово естественно сочетается с храмовым контекстом и сохраняет достойный регистр.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: двери притвора
  rationale: אוּלָם обозначает входной зал храма. «Притвор» — краткий и устоявшийся русский архитектурный термин; возможная более описательная передача вынесена в сноску.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: погасили светильники
  rationale: Сохраняет конкретный образ храмовых светильников, а не обобщённого «света».
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: не воскуряли благовоний
  rationale: Передаёт обрядовое сжигание ароматического вещества; «воскурять благовония» естественно для храмового контекста и не сводит выражение к общему поклонению.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: не приносили всесожжений
  rationale: עֹלָה — специальное обозначение жертвы всесожжения, а форма множественного числа по-русски естественно выражает прекращение регулярного жертвоприношения.
- source_word: בַקֹּדֶשׁ
  choice: в святилище
  rationale: Передаёт священное пространство храма, не уточняя его границы сверх того, что выражено еврейским קֹדֶשׁ.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Дательный падеж естественно передаёт направленность и посвящение жертв Богу Израиля.
theological_decisions:
- issue: Храмовая и жертвенная терминология
  choice: Сохранены конкретные выражения «воскуряли благовония», «всесожжения» и «святилище».
  alternative: 'Передать обобщённо: «не поклонялись» или «не совершали приношений».'
  rationale: Стих перечисляет определённые нарушения храмового служения, а не говорит лишь об отсутствии поклонения вообще; конкретная лексика сохраняет историческую и богословскую направленность текста.
- issue: Значение בַקֹּדֶשׁ
  choice: «в святилище» с указанием варианта в сноске
  alternative: «в святом месте»
  rationale: Еврейское слово допускает обозначение святилища или святого места. Основной вариант естественнее по-русски, а сноска сохраняет лексическую широту без искусственного уточнения конкретной части храма.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной храмовой лексикой. «Затворили» и «воскуряли» уместны в сакрально-историческом контексте, но остаются понятными; синтаксис следует последовательному перечислению еврейского текста.
