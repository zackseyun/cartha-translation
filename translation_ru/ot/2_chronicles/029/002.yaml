  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: ru
  text: Он делал то, что было правильно в глазах Яхве, во всём поступая так же, как делал Давид, его отец[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давид, его предок» или «Давид, его праотец». Слово «отец» здесь указывает на династическое происхождение, а не на непосредственное отцовство.'
    reason: 'Лексическая альтернатива: еврейское אָב может обозначать как отца, так и предка.'
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он делал
  rationale: Форма wayyiqtol от עשה продолжает повествование и описывает поведение царя; в русском связка «и» здесь не обязательна, а несовершенный вид естественно передаёт общую характеристику его правления.
- source_word: הַיָּשָׁר
  choice: то, что было правильным
  rationale: Субстантивированное прилагательное ישר означает «правильное, прямое, угодное с нравственной точки зрения». Такой перевод понятен современному читателю и не сужает значение до одной лишь юридической справедливости.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён еврейский образ оценки с чьей-либо точки зрения; выражение остаётся естественным в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כְּכֹל אֲשֶׁר
  choice: во всём поступая так, как
  rationale: Формулировка сохраняет и значение соответствия примеру Давида, и всеохватность כֹּל, при этом звучит естественно по-русски.
- source_word: עָשָׂה
  choice: поступал
  rationale: В данном сопоставлении עשה обозначает образ действий Давида; «поступал» ясно выражает эту функцию.
- source_word: דָּוִיד
  choice: Давид
  rationale: Традиционная русская форма личного имени.
- source_word: אָבִיו
  choice: его отец
  rationale: Основной текст сохраняет буквальное династическое именование. Здесь אָב обозначает не непосредственного отца Езекии, а его предка по царской линии; это уточняется в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение выражения «Давид, его отец» применительно к Езекии
  choice: Сохранить «его отец» в основном тексте и пояснить династический смысл в сноске
  alternative: Давид, его предок; Давид, его праотец
  rationale: Так сохраняется семейно-династическая формула оригинала без ложного утверждения о непосредственном отцовстве; предполагаемое здесь расширенное значение אָב открыто поясняется.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «в глазах Яхве». Синтаксис сделан плавным и общедоступным; династическая неоднозначность слова «отец» не устранена молча, а раскрыта в сноске.
