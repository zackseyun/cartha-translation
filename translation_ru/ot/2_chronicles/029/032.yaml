  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: ru
  text: 'Число всесожжений, принесённых собранием, было таким: семьдесят голов крупного рогатого скота, сто баранов и двести ягнят. Все они были предназначены для всесожжения Господу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: народ
  rationale: В данном контексте слово обозначает собравшееся общество Израиля; «народ» звучит естественно и ясно, не создавая впечатления формального учреждения.
- source_word: בָּקָר
  choice: голов крупного скота
  rationale: Собирательное существительное обозначает крупный рогатый скот без уточнения пола; такой перевод сохраняет более широкое значение, чем «быки».
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшийся русский библейский термин для жертвы, целиком возносившейся на жертвеннике.
- source_word: לַיהוָה
  choice: Господу
  rationale: Передача тетраграмматона традиционным русским библейским соответствием, естественным для современного литературного текста.
theological_decisions:
- issue: Пол животных, обозначенных словом בָּקָר
  choice: 'Не уточнять пол: «голов крупного скота»'
  alternative: «быков»
  rationale: Еврейское собирательное слово само по себе не требует мужского пола, поэтому более узкий перевод не вводится.
- issue: Передача имени יהוה
  choice: «Господу»
  alternative: «Яхве»
  rationale: Выбрана традиционная русская передача без добавления конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с традиционной жертвенной терминологией. Перечень оформлен двоеточием для ясности; сохранены все числа и итоговое указание назначения жертв.
