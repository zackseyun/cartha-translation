base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: ru
  text: Езекия стал царём в двадцать пять лет и царствовал в Иерусалиме двадцать девять лет. Его мать звали Авия; она была дочерью Захарии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: Езекия
  rationale: Традиционная и узнаваемая русская передача библейского личного имени.
- source_word: מָלַךְ
  choice: стал царём
  rationale: Первое употребление глагола сообщает о вступлении Езекии на престол; такая передача естественно выражает начинательное значение.
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: в двадцать пять лет
  rationale: Естественная русская передача древнееврейского оборота, обозначающего возраст.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: царствовал … двадцать девять лет
  rationale: Второе употребление глагола описывает продолжительность правления.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог указывает на место царствования.
- source_word: וְשֵׁם אִמּוֹ אֲבִיָּה
  choice: Его мать звали Авия
  rationale: Современная и естественная русская передача древнееврейской биографической формулы без потери информации.
- source_word: בַּת זְכַרְיָהוּ
  choice: она была дочерью Захарии
  rationale: Ясно передаёт родственную связь и устраняет возможную в русском языке неясность приложения.
