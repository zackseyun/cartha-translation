  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: ru
  text: 'И сказал он им: «Послушайте меня, левиты! Теперь освятитесь и освятите дом Яхве, Бога ваших отцов, и удалите нечистоту из святилища[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из святого места».'
    reason: Еврейское הַקֹּדֶשׁ может быть передано более буквально как «святое место»; в данном контексте имеется в виду храмовое святилище.
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: Послушайте меня
  rationale: Императив с местоименным суффиксом; естественно передаёт прямой призыв внимательно выслушать говорящего.
- source_word: הִתְקַדְּשׁוּ ... וְקַדְּשׁוּ
  choice: освятите себя и освятите
  rationale: Одинаковый русский корень сохраняет повтор корня קדשׁ; возвратный смысл первой формы передан сочетанием «освятите себя».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт тетраграмматон как личное имя Яхве.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Бога ваших отцов
  rationale: Сохраняет традиционную заветную формулу и прямое значение אבות.
- source_word: וְהוֹצִיאוּ
  choice: вынесите
  rationale: Каузативная форма יצא здесь обозначает физическое удаление оскверняющего содержимого; «вынесите» конкретнее и естественнее в контексте очищения храма.
- source_word: הַנִּדָּה
  choice: нечистоту
  rationale: Передаёт культовое осквернение, не ограничивая смысл обычной грязью или конкретным предметом.
- source_word: מִן הַקֹּדֶשׁ
  choice: из святилища
  rationale: В данном храмовом контексте קֹדֶשׁ обозначает священное место; «святилище» естественно передаёт пространственный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя, присутствующее в еврейском тексте, без замены титулом.
- issue: Характер הַנִּדָּה
  choice: нечистота
  alternative: скверна; мерзость; грязь
  rationale: «Нечистота» сохраняет культовый смысл и не уточняет без достаточного основания, была ли это физическая грязь, предметы или иное осквернение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным храмовым словоупотреблением. Повтор «освятите» намеренно сохраняет корневой повтор оригинала; обращение «левиты» выделено восклицательным знаком для естественной русской интонации.
