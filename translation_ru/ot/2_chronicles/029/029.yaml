  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: ru
  text: Когда закончили приносить жертву[a], царь и все, кто был с ним, преклонили колени и поклонились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возносить». В данном жертвенном контексте речь идёт о завершении приношения всесожжения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пали ниц». Еврейский глагол обозначает благоговейное преклонение, в том числе телесный поклон.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּכְכַלּוֹת
  choice: Когда закончили
  rationale: Сочетание союза, предлога כְּ и инфинитива כלה вводит придаточное времени. Безличная конструкция естественна по-русски и не добавляет явно не названного субъекта.
- source_word: לְהַעֲלוֹת
  choice: приносить жертву
  rationale: Хифиль от עלה буквально означает «возносить», а в данном храмовом контексте — совершать жертвенное приношение. Существительное «жертву» проясняет подразумеваемый объект, не уточняя его сверх текста этого стиха.
- source_word: כָּרְעוּ
  choice: преклонили колени
  rationale: כרע обозначает сгибание колен или вставание на колени. Выражение сохраняет телесное действие и отличает его от следующего глагола.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Прямое соответствие определённому существительному; в русском определённость передаётся контекстом.
- source_word: וְכָל־הַנִּמְצְאִים אִתּוֹ
  choice: и все, кто был с ним
  rationale: Причастие нифаля от מצא здесь идиоматически обозначает присутствующих. Формулировка естественна для современного русского языка.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: и поклонились
  rationale: Форма от שחה может обозначать земной поклон, преклонение или поклонение. «Поклонились» сохраняет одновременно телесный и культовый оттенки, не сводя значение только к внутреннему почитанию.
theological_decisions:
- issue: Передача שחה в храмовом контексте
  choice: поклонились
  alternative: поклонились Богу / совершили поклонение
  rationale: Еврейский глагол сочетает физическое преклонение с религиозным почитанием. Русское «поклонились» сохраняет эту смысловую широту, тогда как добавление объекта «Богу» или отвлечённое «совершили поклонение» уточняло бы то, что здесь прямо не выражено.
- issue: Подразумеваемый вид приношения в לְהַעֲלוֹת
  choice: приносить жертву
  alternative: возносить всесожжение
  rationale: Контекст главы указывает на всесожжение, однако в самом выражении этого стиха объект не назван. Основной текст передаёт культовый смысл, а более точное контекстуальное понимание отмечено в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством храмового повествования. Два последовательных глагола переданы раздельно: «преклонили колени» описывает позу, а «поклонились» — последующее благоговейное действие.'
