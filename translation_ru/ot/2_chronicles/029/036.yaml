  to: Езекия и весь народ радовались тому, что Бог всё подготовил для народа[a], ибо всё это произошло внезапно.
  rationale: Правка устраняет незавершённость русского глагольного управления, сохраняя неопределённость невыраженного дополнения в еврейском тексте. «Всё» не конкретизирует предмет Божьего действия сверх контекста и соответствует широкому референту «дела» в заключительной части стиха. Сноска сохраняет альтернативное понимание без догматической или интерпретационной надстройки.
