base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: ru
  text: Езекия и весь народ радовались тому, что Бог всё подготовил для народа[a], ибо всё это произошло внезапно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог устроил это для народа». Возможно также понимать: «Бог подготовил народ».'
    reason: Еврейский глагол הֵכִין («подготовил», «устроил») употреблён без выраженного дополнения; לָעָם обычно означает «для народа», однако конструкция допускает и иное понимание.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: обрадовались
  rationale: Глагол שׂמח означает радость; множественное число естественно объединяет Езекию и весь народ как составное подлежащее.
- source_word: יְחִזְקִיָּהוּ
  choice: Езекия
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: עָם обозначает здесь собравшийся народ; это обычная и естественная русская передача.
- source_word: עַל
  choice: тому, что
  rationale: После глагола радости предлог вводит основание или повод для радости; по-русски это естественно выражается конструкцией «обрадовались тому, что».
- source_word: הֵכִין
  choice: приготовил
  rationale: Порода хифиль глагола כון может означать «приготовить», «устроить» или «утвердить». «Приготовил» сохраняет широкое значение и соответствует контексту восстановления богослужения.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово обозначает Бога Израиля.
- source_word: לָעָם
  choice: для народа
  rationale: Предлог ל выражает направленность или пользу. Такая передача следует масоретскому тексту и не превращает народ в прямое дополнение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение причины радости.
- source_word: בְּפִתְאֹם
  choice: внезапно
  rationale: Наречие указывает на неожиданность и быстроту события.
- source_word: הָיָה הַדָּבָר
  choice: всё это произошло
  rationale: דָּבָר здесь обобщённо указывает на описанное восстановление богослужения. «Всё это» естественно по-русски и сохраняет широкий референт.
theological_decisions:
- issue: Характер Божьего действия по отношению к народу
  choice: Бог приготовил для народа
  alternative: Бог приготовил народ; Бог устроил это для народа
  rationale: В масоретском тексте לָעָם формально означает «для народа» или «народу», а не однозначное прямое дополнение. Основной текст сохраняет эту конструкцию, а сноска отмечает допустимый диапазон значения הֵכִין.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия древнего оригинала сглажена, а составное подлежащее согласовано по нормам русского языка. Неопределённость оборота הֵכִין ... לָעָם сохранена посредством сноски.
