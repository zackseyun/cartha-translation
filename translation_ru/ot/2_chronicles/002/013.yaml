source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: ru
  text: сына женщины из дочерей Дана[a]; отец его — тирянин. Он умеет работать с золотом и серебром, бронзой и железом, камнем и деревом, пурпурной и синей пряжей, тонким льном и багряной пряжей[b], выполнять всякую резную работу и разрабатывать всякий замысел, который будет ему поручен, вместе с твоими искусными мастерами и искусными мастерами моего господина Давида, твоего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «из дочерей Дана», вероятно, означает, что его мать происходила из колена Дана.
    reason: cultural_note
  - marker: b
    text: 'Или: «алой пряжей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: сына женщины из дочерей Дана
  rationale: Сохранена синтаксическая связь с предыдущим стихом и буквальный образ «дочерей Дана»; его вероятный родоплеменной смысл пояснён в сноске.
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: отец его — тирянин
  rationale: צֹרִי обозначает уроженца или жителя Тира; «тирянин» естественно и точно передаёт географическую принадлежность.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: умеет работать
  rationale: Оборот выражает практическое мастерство ремесленника, а не только знание.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: с золотом и серебром, бронзой и железом, камнем и деревом
  rationale: Предлог ב обозначает материалы работы; русское «работать с» здесь звучит естественно.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: пурпуром, синей пряжей, тонким льном и кармазином
  rationale: Названия передают окрашенные текстильные материалы. «Синяя пряжа» делает предметный смысл תְּכֵלֶת ясным, а «кармазин» сохраняет различие красного красителя; возможный перевод «алая пряжа» отмечен в сноске.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: вырезать всякую резьбу
  rationale: Сохранена выразительная однокоренная конструкция глагола и существительного, обозначающая резную или гравированную работу.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: разрабатывать всякий замысел
  rationale: В ремесленном контексте חשׁב означает проектировать или создавать художественный замысел; перевод не сужает его до одного вида изделия.
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: который будет ему поручен
  rationale: Буквально «который будет дан ему»; в контексте работы естественный русский эквивалент — порученный мастеру замысел или проект.
- source_word: חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  choice: твоими искусными мастерами и искусными мастерами моего господина Давида, твоего отца
  rationale: חכמים в ремесленном контексте — искусные мастера; אֲדֹנִי передаёт почтительное обращение к человеку, а не божественный титул.
theological_decisions:
- issue: Обозначение ремесленников формой חכמים
  choice: искусные мастера
  alternative: умелые работники
  rationale: Контекст говорит о профессиональном мастерстве; мужская форма исходного текста сохранена без искусственной гендерной нейтрализации.
- issue: Придворный титул אֲדֹנִי
  choice: моего господина Давида
  alternative: моего владыки Давида
  rationale: Это почтительный человеческий титул. «Господин» ясно отличает его от божественного именования и естественно звучит по-русски.
- issue: Неясный объект поручения в אֲשֶׁר יִנָּתֶן לוֹ
  choice: который будет ему поручен
  alternative: какой ему ни дадут
  rationale: Относительное местоимение грамматически соотносится с «замыслом», однако формулировка сохраняет широту задания и не уточняет, кто его поручает.
translation_notes:
  register: Современный литературный русский с достоинством придворной переписки. Начальная форма «сына» намеренно сохраняет грамматическую зависимость от предыдущего стиха. Перечень материалов сделан плавным, но его последовательность сохранена. Маркеры сносок размещены у тех слов, к которым фактически относятся примечания; в английском консультационном слое их позиции были переставлены.
