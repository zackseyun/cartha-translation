base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: ru
  text: 'И послал Соломон к Хураму, царю Тира[a], со словами: «Как ты поступил с Давидом, моим отцом, и послал ему кедровую древесину, чтобы построить ему дом, чтобы жить в нём…»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь в еврейском тексте стоит имя Хурам; в параллельном повествовании книг Царств обычно употребляется форма Хирам.
    reason: alternative_reading
  - marker: b
    text: В еврейском тексте стих заканчивается незавершённой сравнительной фразой; речь Соломона продолжается в следующем стихе.
    reason: source_syntax
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Последовательная форма с וַ продвигает повествование; традиционное русское «И послал» естественно связывает стих с предшествующим контекстом.
- source_word: חוּרָם
  choice: Хурам
  rationale: Передаёт именно форму имени חוּרָם, употреблённую в тексте Паралипоменон, а не более привычную по книгам Царств форму «Хирам».
- source_word: מֶלֶךְ צֹר
  choice: царь Тира
  rationale: 'Естественная русская передача еврейской сопряжённой конструкции: титул и название города.'
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив цели в формуле введения прямой речи естественно передаётся по-русски словом «сказать».
- source_word: כַּאֲשֶׁר
  choice: Как
  rationale: Сохраняет сравнительное начало фразы, не добавляя отсутствующую в данном стихе главную часть.
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: ты поступил с Давидом, отцом моим
  rationale: Оборот עשה עם обозначает действие или отношение к кому-либо; «поступил с» сохраняет его широту, а последующая фраза уточняет конкретное действие.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: и послал ему кедровую древесину
  rationale: В строительном контексте множественное אֲרָזִים обозначает кедры как строительный материал. «Кедровая древесина» яснее современному читателю, чем буквальное «кедры», и не уточняет форму материала как брёвна или доски.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: чтобы построить ему дом
  rationale: Передаёт цель действия и бенефактивное לוֹ, не решая сверх текста, строил ли дом сам Давид или строители по его поручению.
- source_word: לָשֶׁבֶת בּוֹ
  choice: для жительства в нём
  rationale: Передаёт значение проживания глагола ישב и сохраняет несколько приподнятый, но понятный современный регистр.
- source_word: ellipsis after לָשֶׁבֶת בּוֹ
  choice: многоточие без добавления аподосиса
  rationale: Масоретский текст данного стиха заканчивается зависимой сравнительной частью. Многоточие показывает незавершённость речи, продолжающейся далее, и не вносит отсутствующее здесь «так поступи и со мной».
