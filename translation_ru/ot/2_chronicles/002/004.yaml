  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: ru
  text: И дом, который я строю, велик[a], потому что наш Бог превыше всех богов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
