source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: ru
  text: Но у кого хватит сил построить Ему дом[a], если небеса, даже небеса небес, не могут вместить Его? И кто я, чтобы строить Ему дом, — разве лишь для того, чтобы совершать перед Ним воскурения[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «небеса и небеса небес»; это возвышенное выражение, обозначающее высочайшие небеса.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возносить перед Ним приношения в дыме»; еврейский глагол может обозначать не только воскурение благовоний, но и вознесение жертвы в дыме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: хватит сил
  rationale: Естественно передаёт идиому о достаточной силе или способности исполнить задачу и сохраняет форму риторического вопроса.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: построить Ему дом
  rationale: Сохраняет буквальное значение בַּיִת «дом»; «храм» было бы контекстуально верно, но более истолковывающе.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: небо и небеса небес
  rationale: Сохраняет двухчастную еврейскую формулу и её возвышенную интенсивность; значение выражения пояснено в сноске.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: не могут вместить Его
  rationale: В контексте Божьей трансцендентности глагол обозначает неспособность охватить или заключить в себе.
- source_word: וּמִי אֲנִי
  choice: И кто я
  rationale: Передаёт простую соединительную связь и смиренный риторический вопрос.
- source_word: אֲשֶׁר אֶבְנֶה לוֹ בַיִת
  choice: чтобы построить Ему дом
  rationale: Русская конструкция естественно выражает недостоинство и несоразмерность говорящего задаче, а не только будущее действие.
- source_word: כִּי אִם
  choice: разве только для того
  rationale: 'Передаёт ограничение: дом строится не как вместилище Бога, а ради определённого богослужебного назначения.'
- source_word: לְהַקְטִיר לְפָנָיו
  choice: воскурять пред Ним
  rationale: Глагол означает возводить жертву или благовоние в дыме; в храмовом контексте «воскурять» сохраняет культовую широту без добавления явно не названного объекта.
theological_decisions:
- issue: Божественная трансцендентность и связь Бога с храмом
  choice: Текст ясно говорит, что дом не может вместить Бога и предназначен для богослужения пред Ним.
  alternative: Понимать дом как жилище, пространственно заключающее Бога в себе.
  rationale: Утверждение, что даже небеса небес не могут вместить Бога, определяет смысл храмовой речи; заключительная оговорка сохраняет связь храма с поклонением, не превращая его во вместилище Бога.
- issue: Предмет воскурения в לְהַקְטִיר
  choice: Не добавлять в основной текст явно не названный предмет; перевести «воскурять».
  alternative: Уточнить «воскурять благовония» или шире «возносить жертвы в дыме».
  rationale: Еврейский глагол допускает культовое возведение в дыме и в данном стихе употреблён без прямого дополнения; более конкретное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Прописные местоимения по отношению к Богу поддерживают традиционную русскую издательскую норму. «Пред Ним» выбрано вместо разговорно-нейтрального «перед Ним» ради литургического контекста; синтаксис остаётся понятным современному читателю.
