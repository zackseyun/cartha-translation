source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: ru
  text: 'Тогда Хурам[a] сказал: «Благословен Яхве, Бог Израиля, сотворивший небеса и землю, давший царю Давиду мудрого сына, обладающего рассудительностью и пониманием[b], который построит дом для Яхве и дом для своего царства[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном рассказе 3 Царств это имя передано формой «Хирам»; здесь, в Паралипоменоне, еврейский текст имеет форму «Хурам».
    reason: alternative_reading
  - marker: b
    text: 'Или: «обладающего здравомыслием и разумением».'
    reason: lexical_alternative
  - marker: c
    text: То есть дом, связанный с его царской властью; возможно, имеется в виду царский дворец или дворцовый комплекс.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: חוּרָם
  choice: Хурам
  rationale: Передаёт форму имени חוּרָם именно в книге Паралипоменон, не гармонизируя её с формой «Хирам» в параллельном рассказе книг Царств.
- source_word: בָּרוּךְ יְהוָה
  choice: Благословен Яхве
  rationale: Естественная русская форма благословения, сохраняющая личное имя Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация тетраграмматона сохраняет личное Божье имя, присутствующее в еврейском тексте, вместо замены титулом.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: сотворивший небеса и землю
  rationale: Сохраняет причастно-относительную связь и множественное число слова «небеса», а глагол «сотворивший» уместен в библейской формуле творения.
- source_word: בֵּן חָכָם
  choice: мудрого сына
  rationale: Прямо и естественно передаёт חָכָם, включая как умственную, так и практическую мудрость.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: наделённого рассудительностью и пониманием
  rationale: Передаёт устойчивое качество сына естественным современным русским языком; два существительных сохраняют различие между практическим здравомыслием и способностью понимать.
- source_word: בַּיִת לַיהוָה
  choice: дом для Яхве
  rationale: Сохраняет буквальный образ «дома», не заменяя его более узким словом «храм».
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: дом для своего царства
  rationale: Сохраняет широкое значение מַמְלָכָה — «царство, царская власть» — и не сводит выражение безоговорочно к дворцу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Значение «дома для своего царства»
  choice: Сохранить формулировку «дом для своего царства» с пояснением
  alternative: дворец
  rationale: Контекст допускает указание на царский дворец или дворцовый комплекс, но еврейское выражение буквально шире; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для широкого читателя; ключевые образы «небеса и земля» и «дом для Яхве» сохранены. Восклицательный знак завершает формулу благословения, после чего следует её основание.
