  source_fidelity: 'Текст точно передаёт еврейскую конструкцию продолжения просьбы: «и заготовить для меня древесину в изобилии». Причинный союз, буквальное «дом», относительное «который я строю» и две самостоятельные характеристики — «велик» и «дивен» — сохранены. Будущее «будет» уместно выражает ожидаемый результат строительства и согласуется с английским аудиторским вариантом.'
