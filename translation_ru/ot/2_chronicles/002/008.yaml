  terminology: «Древесина» точно подходит для строительного материала; «дом» обоснованно сохраняет лексику оригинала, а сноска ясно называет контекстуальную альтернативу «храм». Сноска b корректно предлагает вариант, объединяющий обе характеристики, не меняя основного текста.
