  text: וּ/לְ/הָכִ֥ין לִ֛/י עֵצִ֖ים לָ/רֹ֑ב כִּ֥י הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֥וֹל וְ/הַפְלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/008.yaml
  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: ru
  text: и заготовить для меня древесину в изобилии, потому что дом[a], который я строю, будет велик и дивен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм»; буквально: «дом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «необычайно велик».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: и заготовить
  rationale: Инфинитив с союзом и предлогом продолжает просьбу предыдущего стиха; «заготовить» естественно передаёт подготовку строительного материала.
- source_word: לִי
  choice: для меня
  rationale: Предлог с суффиксом первого лица указывает, в чьих интересах совершается действие.
- source_word: עֵצִים
  choice: древесину
  rationale: В контексте строительства речь идёт о древесине как материале, а не просто о деревьях.
- source_word: לָרֹב
  choice: в изобилии
  rationale: Выражение указывает на большое количество и сохраняет возвышенный, но понятный регистр.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание просьбы и прямо передаёт причинную связь.
- source_word: הַבַּיִת
  choice: дом
  rationale: Сохранено буквальное значение еврейского слова; в данном контексте оно обозначает храм.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: который я строю
  rationale: Причастная конструкция допускает текущий или намеченный процесс; настоящее время естественно сохраняет эту аспектуальную открытость.
- source_word: גָּדוֹל
  choice: велик
  rationale: Слово передаёт не только размер, но и величие сооружения.
- source_word: וְהַפְלֵא
  choice: и дивен
  rationale: Форма от корня פלא характеризует дом как необычайный, вызывающий изумление; «дивен» сохраняет смысл и достойный библейский регистр.
theological_decisions:
- issue: Обозначение строящегося святилища
  choice: дом
  alternative: храм
  rationale: Еврейский текст говорит «дом»; контекстуально это храм, но замена в основном тексте устранила бы значимый библейский образ. Альтернатива указана в сноске.
- issue: Характеристика дома словом וְהַפְלֵא
  choice: дивен
  alternative: необычайно велик
  rationale: Сохранена отдельная характеристика от корня פלא, чтобы не свести её только к размеру и не устранить оттенок изумительности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; буквальный образ «дом» сохранён и пояснён сноской.
