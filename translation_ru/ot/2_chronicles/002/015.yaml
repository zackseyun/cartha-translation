base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: ru
  text: А мы срубим на Ливане столько леса, сколько тебе понадобится, и доставим тебе его в плотах по морю до Иоппии[a]. Оттуда ты поднимешь его в Иерусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иоппия — морской порт, позднее получивший название Яффа.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «поднимешь»; это отражает подъём от побережья к расположенному выше Иерусалиму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: А мы
  rationale: Самостоятельное местоимение подчёркивает исполнителей обещания; «А мы» естественно передаёт и связку, и лёгкое смысловое выделение.
- source_word: נִכְרֹת עֵצִים
  choice: нарубим ... леса
  rationale: כרת применительно к деревьям означает рубить, а עֵצִים в контексте строительных поставок — древесину, лесоматериал. Русское «нарубим леса» ясно и естественно передаёт заготовку древесины.
- source_word: מִן הַלְּבָנוֹן
  choice: на Ливане
  rationale: В данном контексте Ливан — горная, лесная область, где заготавливают деревья; нормативный русский оборот «на Ливане» сохраняет эту географическую картину.
- source_word: כְּכָל צָרְכֶּךָ
  choice: столько ... сколько тебе понадобится
  rationale: Оборот передаёт соответствие всему объёму потребности Соломона и звучит естественно на современном русском языке.
- source_word: רַפְסֹדוֹת
  choice: свяжем его в плоты
  rationale: Существительное обозначает плоты или связанные для сплава брёвна. Добавленный по смыслу глагол «свяжем» ясно показывает способ морской перевозки, не меняя содержания.
- source_word: עַל יָם יָפוֹ
  choice: морем в Иоппию
  rationale: Фраза обозначает перевозку по морю с Иоппией как пунктом назначения. «Иоппия» — традиционная и узнаваемая русская библейская форма названия.
- source_word: תַּעֲלֶה אֹתָם יְרוּשָׁלִָם
  choice: ты поднимешь его в Иерусалим
  rationale: 'עלה сохраняет значение движения вверх: из прибрежной Иоппии груз следовало везти в расположенный значительно выше Иерусалим. Единственное число согласовано с собирательным «лес».'
