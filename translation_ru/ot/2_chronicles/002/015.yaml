  source_fidelity: 'Смысл в целом передан верно: заготовка древесины на Ливане, объём по потребности адресата, морская доставка в Иоппию и последующая перевозка вверх в Иерусалим сохранены. Однако еврейское רַפְסֹדוֹת характеризует древесину как плоты при перевозке; оно не вводит отдельного действия «свяжем».'
