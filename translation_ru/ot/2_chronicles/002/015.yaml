  terminology: «Ливан», «Иоппия» и «Иерусалим» употреблены в нормативных русских библейских формах. «Поднимешь» удачно сохраняет направленный вверх характер עלה. «Лес» допустим как собирательное обозначение строительной древесины; согласование местоимения в единственном числе естественно.
