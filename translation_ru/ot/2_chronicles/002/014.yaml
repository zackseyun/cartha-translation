  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: ru
  text: А теперь пусть мой господин пришлёт слугам пшеницу и ячмень, масло[a] и вино, о которых он говорил[b].
  philosophy: optimal-equivalence
