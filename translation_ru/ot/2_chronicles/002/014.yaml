lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт и связующую силу ו, и переход к практической просьбе, выраженный עתה.
- source_word: הַחִטִּים וְהַשְּׂעֹרִים
  choice: пшеницу и ячмень
  rationale: Естественные русские названия продуктов как вещественных существительных; определённость списка явствует из контекста и не требует отдельного выражения.
- source_word: הַשֶּׁמֶן
  choice: масло
  rationale: Сохраняет более широкое значение еврейского слова; в данном контексте, вероятно, имеется в виду оливковое масло, что отмечено в сноске.
- source_word: וְהַיַּיִן
  choice: и вино
  rationale: Прямой и естественный перевод названия продукта.
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Передаёт почтительное придворное обращение Хирама к Соломону, не смешивая его с божественным титулом.
- source_word: יִשְׁלַח
  choice: пусть ... пришлёт
  rationale: Передаёт контекстуальное побудительное значение формы yiqtol как вежливой просьбы.
- source_word: לַעֲבָדָיו
  choice: своим слугам
  rationale: Возвратное притяжательное местоимение естественно по-русски указывает на слуг адресанта, то есть Хирама; «слугам» прямо передаёт עבדיו.
- source_word: אֲשֶׁר אָמַר
  choice: о которых он говорил
  rationale: Передаёт предшествующее упоминание перечисленных припасов и не усиливает אמר до значения «обещал».
