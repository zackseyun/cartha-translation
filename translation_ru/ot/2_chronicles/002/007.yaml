base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: ru
  text: 'Пришли мне с Ливана кедровую, кипарисовую[a] и алгумовую[b] древесину, потому что я знаю: твои слуги умеют рубить ливанские деревья. И вот, мои слуги будут вместе с твоими слугами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «можжевеловую» или «пихтовую»; точный вид дерева, обозначенного еврейским словом берош, неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: Название «алгум» передаёт еврейское слово, точное значение которого неизвестно; иногда это дерево отождествляют с сандалом.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: Пришли мне
  rationale: Императив передан прямо; начальный союз не требует искусственного добавления «теперь», а по-русски может естественно не выражаться.
- source_word: עֲצֵי אֲרָזִים
  choice: кедровую древесину
  rationale: В контексте заготовки материалов речь идёт о древесине, а не просто о живых деревьях.
- source_word: בְּרוֹשִׁים
  choice: кипарисовую
  rationale: «Кипарис» — распространённое соответствие, однако точный вид дерева неизвестен; неопределённость отмечена в сноске.
- source_word: אַלְגּוּמִּים
  choice: алгумовую
  rationale: Транслитерация сохраняет неизвестное название ценной породы дерева и не навязывает спорное отождествление с сандалом.
- source_word: מֵהַלְּבָנוֹן
  choice: с Ливана
  rationale: Передаёт происхождение древесины из области Ливана; русский предлог «с» также допускает представление о горной местности.
- source_word: יֹדְעִים לִכְרוֹת
  choice: умеют рубить
  rationale: Конструкция означает практическое умение валить или заготавливать деревья; «умеют рубить» звучит ясно и естественно.
- source_word: עֲצֵי לְבָנוֹן
  choice: ливанские деревья
  rationale: Более буквально сохраняет упоминание деревьев Ливана, не сводя выражение заранее к уже обработанной древесине.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательно-акцентирующую функцию частицы и соответствует dignified современному русскому регистру.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: мои слуги будут вместе с твоими слугами
  rationale: В еврейской именной фразе связка отсутствует; будущее время естественно следует из контекста предлагаемой организации предстоящих работ.
