base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: ru
  text: Затем Соломон пересчитал всех чужеземцев, живших в земле Израиля[a], после переписи, проведённой его отцом Давидом, и оказалось, что их было сто пятьдесят три тысячи шестьсот человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришельцев» или «чужеземных жителей». Еврейское слово обозначает людей не из коренного населения Израиля, проживавших на израильской земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: пересчитал
  rationale: Глагол ספר означает подсчёт людей; «пересчитал» естественно указывает на новый подсчёт после прежней переписи Давида.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: всех переселенцев
  rationale: גֵּרִים обозначает живущих среди Израиля людей пришлого, не коренного происхождения, а не временных путников. Слово «переселенцы» понятно современному читателю и передаёт устойчивое проживание.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: в земле Израиля
  rationale: Сохранено территориальное значение אֶרֶץ и близкая к еврейскому выражению формулировка.
- source_word: אַחֲרֵי הַסְּפָר
  choice: после переписи
  rationale: Фраза отсылает к прежнему учёту; «после переписи» естественно передаёт наиболее прямое временное значение, не исключая связи с её результатами.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: проведённой его отцом Давидом
  rationale: Сжатая русская конструкция естественно передаёт перепись, которую Давид провёл в отношении этих людей.
- source_word: וַיִּמָּצְאוּ
  choice: и оказалось, что их
  rationale: 'Передаёт результативно-пассивный смысл нифаля מצא: итог был установлен подсчётом.'
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: сто пятьдесят три тысячи шестьсот человек
  rationale: Точно передан общий итог 153 600; добавление «человек» естественно для русского языка и ясно обозначает единицу счёта.
