base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: ru
  text: Соломон насчитал семьдесят тысяч носильщиков, восемьдесят тысяч каменотёсов в горах[a] и три тысячи шестьсот руководителей, поставленных над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «высекавших в горе».'
    reason: Сохраняет буквальное значение еврейского выражения, не уточняя сверх текста подразумеваемый объект работы.
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: насчитал
  rationale: Глагол ספר в повествовательной форме означает «сосчитал, исчислил». «Насчитал» естественно передаёт произведённый Соломоном подсчёт работников.
- source_word: אִישׁ סַבָּל
  choice: носильщиков
  rationale: Слово סַבָּל обозначает человека, переносящего тяжести. В русском существительное «носильщики» ясно и кратко называет эту категорию работников; отдельная передача אִישׁ перед числительным не требуется.
- source_word: חֹצֵב בָּהָר
  choice: каменотёсов в горах
  rationale: Причастие חֹצֵב означает «высекающий, рубящий»; в контексте строительных работ подразумевается добыча и обработка камня. «В горах» сохраняет указание בָּהָר на место работы, а буквальность выражения отмечена в сноске.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: надсмотрщиков над ними
  rationale: В административном контексте מְנַצְּחִים — руководящие и контролирующие работы лица. «Надсмотрщики» соответствует контексту принудительных или царских работ, а «над ними» сохраняет עֲלֵיהֶם.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: три тысячи шестьсот
  rationale: Прямая и естественная русская передача числительного.
theological_decisions: []
