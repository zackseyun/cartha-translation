base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: ru
  text: И вот, твоим слугам — лесорубам, валящим деревья, — я предоставил двадцать тысяч коров дроблёной пшеницы[a], двадцать тысяч коров ячменя, двадцать тысяч батов вина и двадцать тысяч батов масла.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение необычно; возможен также перевод: «пшеницы на пропитание».'
    reason: lexical_alternative
  - marker: b
    text: Кор — древняя мера сыпучих тел, а бат — древняя мера жидкостей.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет соединительную и указательную функцию еврейского выражения, оставаясь естественным для современного литературного русского языка.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: дровосекам, рубящим деревья
  rationale: Передаёт обе близкие по смыслу причастные конструкции, причём вторая уточняет первую; буквальное «деревья» сохранено.
- source_word: נָתַתִּי
  choice: я дам
  rationale: Хотя формально употреблён перфект, в контексте царского обещания о предстоящем снабжении естественен русский футуральный перевод; он передаёт твёрдость принятого обязательства.
- source_word: חִטִּים מַכּוֹת
  choice: пшеницы на пропитание
  rationale: Редкое и спорное מַכּוֹת допускает понимание пищи или обработанной, толчёной пшеницы. Основной текст выбирает контекстуально естественное «на пропитание», а неоднозначность сохраняется в сноске.
- source_word: לַעֲבָדֶיךָ
  choice: для твоих слуг
  rationale: В данном контексте предлог естественно обозначает получателей или тех, для кого предназначено снабжение; עֲבָדִים передано как «слуги», без сужения до «работников».
- source_word: כֹּרִים
  choice: коров
  rationale: Древняя мера сыпучих тел передана традиционной русской транслитерацией «кор»; форма родительного множественного числа после числительного — «коров».
- source_word: בַּתִּים
  choice: батов
  rationale: Древняя мера жидкостей передана транслитерацией «бат», без ненадёжного пересчёта в современные единицы.
- source_word: יַיִן
  choice: вина
  rationale: Обычное и прямое соответствие еврейскому слову в перечне припасов.
- source_word: שֶׁמֶן
  choice: масла
  rationale: Сохранено общее значение «масло»; вероятное оливковое происхождение не добавлено, поскольку оно прямо не выражено.
- source_word: עֶשְׂרִים אֶלֶף
  choice: двадцать тысяч
  rationale: Число буквально сохранено при каждом виде припасов.
