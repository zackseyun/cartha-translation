  source_fidelity: 'Требуется исправление времени глагола: נָתַתִּי — перфект («я дал / предоставил»), а не будущее «я дам». Дательный לַעֲבָדֶיךָ точнее передать как «твоим слугам», а не «для твоих слуг». Спорное חִטִּים מַכּוֹת безопаснее оставить в основном тексте как обработанную («дроблёную») пшеницу и отметить вариант «пшеница на пропитание» в сноске.'
  naturalness: «Лесорубам, валящим деревья» — современно-литературное и естественное соответствие повторной характеристики работников. Тире обособляет приложение и делает длинный перечень яснее. Формы «коров» и «батов» грамматически корректны как родительный множественного числа после числительного.
  terminology: «Кор» и «бат» последовательно сохранены как древние меры; общая сноска поставлена у первого упоминания обоих терминов. «Масло» не уточняется как оливковое, поскольку в еврейском тексте сказано лишь שֶׁמֶן.
