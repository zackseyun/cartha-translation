  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: ru
  text: Из них он назначил семьдесят тысяч носильщиков, восемьдесят тысяч каменотёсов в горах[a] и три тысячи шестьсот руководителей, чтобы организовывать труд народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «высекающих в горе (или в горной местности)»; что именно они высекали, в еврейском тексте не указано, но из контекста подразумевается камень.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: Из них он назначил
  rationale: Сочетание עשה с מֵהֶם означает назначение людей из состава ранее названной группы; «назначил» естественно передаёт смысл по-русски.
- source_word: סַבָּל
  choice: носильщиков
  rationale: Существительное обозначает тех, кто переносит тяжести; «носильщики» точно и понятно передаёт эту функцию.
- source_word: חֹצֵב בָּהָר
  choice: каменотёсов в горах
  rationale: חצב означает рубить или высекать, а в контексте строительства подразумевается камень. בָּהָר допускает значение горной местности; предмет действия в еврейском тексте не выражен явно, что отмечено в сноске.
- source_word: מְנַצְּחִים
  choice: надсмотрщиков
  rationale: В административном контексте причастие обозначает руководителей, контролирующих труд работников; «надсмотрщики» соответствует принудительному оттенку последующего каузатива.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: чтобы те заставляли народ работать
  rationale: Порода hифиль глагола עבד выражает побуждение или принуждение к труду. Добавленное «те» ясно связывает действие с надсмотрщиками и естественно передаёт синтаксис по-русски.
- source_word: הָעָם
  choice: народ
  rationale: Сохранено широкое значение еврейского слова без контекстуального сужения до «работников» или «рабочей силы».
