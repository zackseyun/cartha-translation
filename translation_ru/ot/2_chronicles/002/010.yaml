source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: ru
  text: 'Тогда Хурам[a], царь Тира, ответил в письме, которое послал Соломону[c]: «Поскольку Яхве любит свой народ[b], он поставил тебя царём над ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Хурам; традиционная форма имени — Хирам.
    reason: alternative_reading
  - marker: b
    text: 'Или: «По любви Яхве к своему народу».'
    reason: lexical_alternative
  - marker: c
    text: 'Букв.: «сказал в письме и послал его Соломону».'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ответил
  rationale: В контексте это ответ Хурама на обращение Соломона; «ответил» естественно передаёт речевой глагол, сохраняя ход повествования.
- source_word: חוּרָם
  choice: Хурам
  rationale: Передаёт форму имени חוּרָם в данном стихе; традиционная форма «Хирам» отмечена в сноске.
- source_word: מֶלֶךְ צֹר
  choice: царь Тира
  rationale: Естественная русская передача конструктивного сочетания, обозначающего титул и владение Хурама.
- source_word: בִּכְתָב
  choice: в письме
  rationale: По контексту речь идёт о письменном послании, отправленном Соломону; «в письме» яснее общего «письменно».
- source_word: וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: которое послал Соломону
  rationale: Относительное придаточное естественно связывает отправку с письмом, не устраняя исходную последовательность двух глаголов.
- source_word: בְּאַהֲבַת
  choice: поскольку ... любит
  rationale: 'Предлог בְּ с отвлечённым существительным здесь допускает причинное понимание: любовь Яхве объясняет поставление Соломона; более буквальная именная конструкция сохранена в сноске.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: עַמּוֹ
  choice: свой народ
  rationale: Возвратное притяжательное местоимение ясно относит народ к Яхве и звучит естественно по-русски.
- source_word: נְתָנְךָ
  choice: поставил тебя
  rationale: Глагол נתן буквально означает «дал», но в сочетании с царским положением выражает назначение или поставление.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: царём над ним
  rationale: Передаёт власть царя над народом; единственное число «ним» согласуется с собирательным существительным «народ».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Причина царского поставления Соломона
  choice: любовь Яхве к своему народу представлена как причина
  alternative: «По любви Яхве к своему народу»
  rationale: Причинная связь грамматически вероятна и естественна, однако именная конструкция оригинала допускает более буквальную передачу, приведённую в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Местоимения, относящиеся к Богу, даны со строчной буквы как обычная современная издательская норма; личное имя Яхве сохранено.
