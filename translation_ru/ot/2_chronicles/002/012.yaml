  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: ru
  text: И теперь я послал мудрого человека, наделённого разумением, — Хурама-Ави.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Хурам-Ави». Последнее слово буквально означает «мой отец», но здесь, вероятно, является почётным титулом или частью обозначения мастера; ср. сходное выражение «Хурам, его отец» в 2 Пар. 4:16.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Союз и наречие продолжают ход ответа и вводят следующий шаг; «И теперь» естественно сохраняет эту связь.
- source_word: שָׁלַחְתִּי
  choice: я послал
  rationale: Еврейский перфект обозначает совершённое действие, актуальное для настоящей ситуации; в русском контексте естественна форма прошедшего времени.
- source_word: אִישׁ חָכָם
  choice: мудрого человека
  rationale: Буквально передаёт существительное мужского рода и прилагательное; последующая характеристика раскрывает практическую сторону его мудрости.
- source_word: יוֹדֵעַ בִּינָה
  choice: наделённого разумением
  rationale: Буквально сочетание означает «знающего разумение». Выбранная формулировка звучит естественно и сохраняет смысл способности понимать и искусно действовать.
- source_word: לְחוּרָם אָבִי
  choice: Хурама-Ави
  rationale: Предлог לְ здесь естественно связывается с глаголом «послал», а חוּרָם אָבִי передано как составное имя или обозначение мастера, чтобы не навязывать буквальное родство.
theological_decisions:
- issue: Значение אָבִי в обозначении חוּרָם אָבִי
  choice: 'Передать как часть имени или титульного обозначения: «Хурам-Ави»'
  alternative: «Хурама, моего отца» или «Хурама, моего главного мастера»
  rationale: אָבִי буквально значит «мой отец», но может употребляться как почётное обозначение наставника, советника или мастера. Транслитерация сохраняет неоднозначность и не утверждает ни буквального родства, ни одного конкретного титула.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя, а неоднозначное имя-титул сохранено посредством транслитерации.
