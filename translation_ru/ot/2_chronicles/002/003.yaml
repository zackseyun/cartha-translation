  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: ru
  text: Вот, я строю дом для имени Яхве, моего Бога, чтобы посвятить его Ему, воскурять перед Ним благовонное курение, постоянно раскладывать хлебы[a] и приносить всесожжения утром и вечером, по субботам, в новомесячия и в установленные праздники Яхве, Бога нашего. Это навеки возложено на Израиль.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «постоянное расположение»; имеются в виду хлебы, регулярно раскладываемые перед Яхве, традиционно называемые хлебами предложения.'
    reason: lexical_alternative
  - marker: b
    text: То есть это установлено как постоянная обязанность Израиля.
    reason: clarification
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую функцию частицы в возвышенной, но понятной современной русской речи.
- source_word: בּוֹנֶה
  choice: я строю
  rationale: Причастная форма выражает начатое либо непосредственно намеченное действие; настоящее время сохраняет эту перспективу без лишнего уточнения.
- source_word: בַּיִת לְשֵׁם
  choice: дом для имени
  rationale: Сохраняет буквальный и богословски значимый оборот; речь идёт о храме, но слово «дом» не устраняет исходный образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: чтобы посвятить его Ему
  rationale: Передаёт каузативное значение «отделить как святыню» естественным русским культовым выражением; местоимение относится к дому.
- source_word: קְטֹרֶת סַמִּים
  choice: благовонное курение
  rationale: Естественно передаёт ароматическое храмовое курение и сохраняет культовый характер выражения.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: постоянно раскладывать хлебы
  rationale: Само выражение буквально обозначает постоянное расположение или разложение; «хлебы» проясняет известный храмовый референт, не вводя архаичного термина в основной текст.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Устоявшийся и точный русский термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וּלְמוֹעֲדֵי
  choice: по субботам, в новомесячия и в установленные праздники
  rationale: Передаёт перечисление регулярных священных времён современно и ясно.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: Это навеки возложено на Израиль
  rationale: Предлог עַל здесь выражает лежащую на Израиле постоянную обязанность; формулировка сохраняет указательное «это» и нормативный смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в еврейском тексте.
- issue: Передача בַּיִת
  choice: дом
  alternative: храм
  rationale: «Дом» сохраняет исходную метафору и значимый оборот «дом для имени»; храмовый референт ясен из содержания стиха.
- issue: Прояснение מַעֲרֶכֶת תָּמִיד
  choice: постоянно раскладывать хлебы
  alternative: постоянное расположение; хлебы предложения
  rationale: Контекст храмового служения указывает на регулярно выставляемые хлебы, однако примечание сохраняет буквальную форму и традиционную терминологию.
- issue: Смысл заключительной формулы לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: Это навеки возложено на Израиль
  alternative: Так будет вовеки в Израиле
  rationale: Выбранная формулировка передаёт значение постоянного установления или обязанности, не превращая её в отвлечённое описание обычая.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранены выражения «дом для имени» и «Яхве»; избегнуты как чрезмерно архаичные конструкции, так и разговорные перефразы.
