revisions:
- from: А теперь пришли мне искусного мастера, умеющего работать с золотом, серебром, бронзой и железом, с пурпурной, багряной[a] и голубой пряжей и вырезать резные узоры[b]. Пусть он работает вместе с мастерами, которые находятся у меня в Иудее и Иерусалиме и которых подготовил[c] мой отец Давид.
  to: А теперь пришли мне искусного мастера, умеющего работать с золотом, серебром, бронзой и железом, а также с материалами пурпурного, багряного[a] и голубого цвета и выполнять резные работы[b] вместе с мастерами, которые находятся у меня в Иудее и Иерусалиме и которых подготовил[c] мой отец Давид.
  rationale: Исправление устраняет необоснованную конкретизацию «пряжа» и сужение «узоры», а также точнее связывает работу посылаемого ремесленника с работой местных мастеров. «А теперь» сохранено, поскольку оно прямо соответствует וְעַתָּה в WLC, независимо от противоречащего этому английского аудита.
