  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: ru
  text: А теперь пришли мне искусного мастера, умеющего работать с золотом, серебром, бронзой и железом, а также с материалами пурпурного, багряного[a] и голубого цвета и выполнять резные работы[b] вместе с мастерами, которые находятся у меня в Иудее и Иерусалиме и которых подготовил[c] мой отец Давид.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «алого цвета». Еврейское слово обозначает красный краситель или окрашенный им материал.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вырезать резьбу»; в еврейском тексте употреблено однокоренное выражение, обозначающее искусную резную или гравированную работу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «назначил», «приготовил». Еврейский глагол допускает эти оттенки в данном контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: В масоретском тексте присутствует явное сочетание союза וְ с наречием עַתָּה («и теперь»). Русское «А теперь» естественно связывает просьбу с предшествующей речью.
- source_word: אִישׁ חָכָם
  choice: искусного мастера
  rationale: В ремесленном контексте חָכָם обозначает не отвлечённую мудрость, а умение и мастерство; «мастер» естественно передаёт род занятий, а «искусный» — квалификацию.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: работать с золотом, серебром, бронзой и железом
  rationale: Предлог בְּ указывает на материалы работы. נְחֹשֶׁת в данном историко-ремесленном контексте передано как «бронза».
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: с пурпурной, багряной и голубой пряжей
  rationale: Три термина обозначают дорогие окрашенные текстильные материалы. Добавление «пряжей» делает ремесленный контекст ясным по-русски, не утверждая, что речь уже идёт о готовой ткани.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: умеющего … вырезать резные узоры
  rationale: Еврейская однокоренная конструкция подчёркивает мастерство резной или гравированной работы. Русское сочетание сохраняет этот оттенок и остаётся понятным.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: вместе с мастерами, которые находятся у меня
  rationale: עִם выражает совместную работу, а חֲכָמִים в контексте — квалифицированных ремесленников. Формулировка не добавляет отсутствующей в тексте идеи административного подчинения.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: которых подготовил мой отец Давид
  rationale: Глагол הֵכִין имеет широкий смысл «подготовить, сделать готовым» и в контексте может также подразумевать назначение; основной текст сохраняет более общий смысл.
theological_decisions:
- issue: К кому относится אֲשֶׁר הֵכִין («которых подготовил»)
  choice: к мастерам в Иудее и Иерусалиме
  alternative: к ремесленным приготовлениям или материалам в более широком смысле
  rationale: Ближайший грамматический антецедент — הַחֲכָמִים («мастера»), поэтому относительное предложение естественно отнесено к ним, без дальнейшего богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на два предложения ради ясности длинной цепочки определений. Терминология ремёсел понятна широкому читателю; традиционные цветообозначения сохранены без архаизации всего стиха.
