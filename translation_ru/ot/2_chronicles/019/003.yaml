  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: ru
  text: 'И всё же у тебя нашлось доброе: ты удалил из страны ашеры[a] и приготовил своё сердце, чтобы искать Бога[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ашеры» — культовые предметы, связанные с поклонением Ашере.'
    reason: cultural_note
  - marker: b
    text: 'Или: «направил своё сердце искать Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: И всё же
  rationale: Передаёт уступительное противопоставление предшествующему обличению естественно и с должной серьёзностью.
- source_word: דְּבָרִים טוֹבִים
  choice: доброе
  rationale: Сохраняет широкое значение выражения, не сводя похвалу исключительно к поступкам или качествам.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: у тебя нашлось
  rationale: Естественно передаёт еврейскую конструкцию со значением обнаруженного в человеке или за ним добра, не делая её искусственно буквальной.
- source_word: בִעַרְתָּ
  choice: уничтожил
  rationale: Глагол обозначает решительное устранение; выбор передаёт полноту искоренения, не утверждая конкретного способа уничтожения.
- source_word: הָאֲשֵׁרוֹת
  choice: культовые столбы Ашеры
  rationale: Поясняющий перевод указывает на культовые предметы, связанные с богиней Ашерой, и понятен современному читателю.
- source_word: מִן הָאָרֶץ
  choice: в стране
  rationale: В сочетании с глаголом «уничтожил» естественно выражает устранение этих предметов с территории страны.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: расположил своё сердце
  rationale: Сохраняет библейский образ сердца и передаёт сознательную внутреннюю направленность; возможное более буквальное значение отмечено в сноске.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: искать Бога
  rationale: Сохраняет характерный для Паралипоменона широкий смысл обращения к Богу и стремления к Нему, не сужая его до запроса ответа.
theological_decisions:
- issue: Значение הָאֲשֵׁרוֹת
  choice: культовые столбы Ашеры
  alternative: ашеры; изображения Ашеры
  rationale: Термин обозначает культовые объекты, связанные с Ашерой. Поясняющий перевод сохраняет имя и раскрывает идолопоклоннический контекст, не уточняя форму объектов сверх необходимого.
- issue: Значение לִדְרֹשׁ הָאֱלֹהִים
  choice: искать Бога
  alternative: вопрошать Бога
  rationale: В Паралипоменоне выражение обычно охватывает направленность человека к Богу и преданность Ему, а не только получение откровения или совета.
- issue: Внутренняя направленность וַהֲכִינוֹתָ לְבָבְךָ
  choice: расположил своё сердце
  alternative: приготовил своё сердце; утвердил своё сердце
  rationale: Формулировка сохраняет волевой и духовный смысл, не превращая его в утверждение о безупречности или завершённости внутреннего состояния.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейской речи. Образ сердца оставлен, поскольку он понятен по-русски и важен для богословской и литературной ткани Паралипоменона; культурно неочевидный термин пояснён непосредственно и в сноске.
