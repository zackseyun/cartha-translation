base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: ru
  text: 'Ииуй, сын Ханани, прозорливец, вышел ему навстречу[a] и сказал царю Иосафату: «Разве тебе следует помогать нечестивому и любить тех, кто ненавидит Яхве? За это гнев Яхве над тобой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышел к его лицу»; это еврейское выражение означает «вышел ему навстречу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «гнев над тобой от лица Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: вышел ему навстречу
  rationale: Еврейское выражение буквально означает движение «к его лицу», но в данном контексте это идиома выхода навстречу человеку. Русский вариант естественно передаёт действие.
- source_word: הַחֹזֶה
  choice: прозорливец
  rationale: חֹזֶה — особое обозначение человека, получающего пророческие видения. «Прозорливец» сохраняет отличие этого титула от более общего «пророк».
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: Разве тебе следует помогать нечестивому
  rationale: Вопросительная конструкция выражает укор. Форма с артиклем допускает обобщённое «нечестивому» и не требует прямо называть Ахава.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: и любить тех, кто ненавидит Яхве
  rationale: Причастие передано глагольной конструкцией «тех, кто ненавидит», что сохраняет смысл точнее, чем более истолковывающее «врагов».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: וּבָזֹאת
  choice: За это
  rationale: Краткая русская причинная формула ясно связывает грядущий гнев с поступком Иосафата.
- source_word: עָלֶיךָ קֶּצֶף
  choice: на тебе гнев
  rationale: Формулировка сохраняет конкретный образ еврейской конструкции с предлогом עַל и её торжественную силу.
- source_word: מִלִּפְנֵי יְהוָה
  choice: от Яхве
  rationale: Еврейская идиома указывает на источник гнева. Естественный русский основной текст передаёт этот смысл, а буквальный образ «от лица Яхве» сохранён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Кого обозначают «нечестивый» и «ненавидящие Яхве»
  choice: Сохранены общие нравственные обозначения исходного текста
  alternative: Прямо назвать Ахава или передать «нечестивец Ахав»
  rationale: В историческом контексте укор относится к союзу с Ахавом, однако еврейский текст намеренно формулирует его шире. Перевод не сужает эту богословскую и нравственную силу.
- issue: Источник гнева в מִלִּפְנֵי יְהוָה
  choice: гнев от Яхве
  alternative: гнев от лица Яхве; гнев из присутствия Яхве
  rationale: Выражение указывает, что гнев исходит от Бога. Основной текст дан естественно по-русски, а пространственный образ оригинала отмечен в сноске без дополнительного истолкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Имена переданы в формах «Ииуй», «Ханани» и «Иосафат»; титул חֹזֶה переведён как «прозорливец», чтобы отличить его от общего слова «пророк».
