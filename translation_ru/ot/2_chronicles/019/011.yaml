revisions:
- from: И вот, священник Амария, стоящий во главе священников[a], будет над вами во всяком деле Яхве, а Зевадия, сын Измаила, правитель дома Иуды, — во всяком деле царя; левиты же будут перед вами распорядителями. Будьте тверды и действуйте, и да будет Яхве с тем, кто добр[b].
  to: И вот, главный священник Амария поставлен над вами по всем делам Яхве, а Зевадия, сын Измаила, правитель дома Иуды, — по всем делам царя; левиты же будут служить при вас должностными лицами. Будьте тверды и действуйте, и да будет Яхве с тем, кто добр[b].
  rationale: 'Исправлена неверная предметная альтернатива в сноске b и устранены неестественные кальки. Выбранное «главный священник» точно передаёт כֹהֵן הָרֹאשׁ без расширения смысла; «поставлен над вами» выражает подразумеваемое назначение и надзор. Сноска a не нужна: «главный священник» уже передаёт основной смысл, а «первосвященник» как возможный, но более технический вариант не требуется для понимания текста.'
