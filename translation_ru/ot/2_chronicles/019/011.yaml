  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: ru
  text: И вот, главный священник Амария поставлен над вами по всем делам Яхве, а Зевадия, сын Измаила, правитель дома Иуды, — по всем делам царя; левиты же будут служить при вас должностными лицами. Будьте тверды и действуйте, и да будет Яхве с тем, кто добр[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «да будет Яхве с добрым»; то есть с тем, кто поступает правильно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохраняет указательно-переходную и эмфатическую функцию оборота, оставаясь естественным для современного литературного русского.
- source_word: כֹהֵן הָרֹאשׁ
  choice: священник, стоящий во главе священников
  rationale: Передаёт буквальный смысл «главный/головной священник», не отождествляя выражение безоговорочно с техническим титулом «первосвященник».
- source_word: עֲלֵיכֶם
  choice: будет над вами
  rationale: Передаёт надзор и полномочия Амарии в данном судебно-административном устройстве; будущее время естественно в контексте назначения обязанностей.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: во всяком деле Яхве
  rationale: דָּבָר здесь означает дело, вопрос или разбирательство; формулировка сохраняет широту смысла и сферу ответственности.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: правитель дома Иуды
  rationale: Сохраняет административный смысл נָגִיד и выраженное в еврейском тексте בֵּית — «дом».
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: во всяком деле царя
  rationale: Сохраняет синтаксический параллелизм с «во всяком деле Яхве» и различие между религиозной и царской сферами.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: левиты же будут перед вами распорядителями
  rationale: שֹׁטְרִים обозначает должностных лиц или распорядителей; «перед вами» сохраняет образ присутствия при судьях и служебной поддержки.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: Будьте тверды и действуйте
  rationale: Кратко и естественно передаёт призыв проявить мужество и исполнить порученное.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: и да будет Яхве с тем, кто добр
  rationale: «Да будет» передаёт юссивное пожелание; субстантивированное הַטּוֹב понято лично, но альтернативная возможность отнести выражение к «доброму делу» отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно стоящее в источнике личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Источник содержит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и соответствует заданной проектной практике.
- issue: Статус כֹהֵן הָרֹאשׁ
  choice: священник, стоящий во главе священников
  alternative: первосвященник; главный священник
  rationale: Описательный перевод сохраняет буквальный смысл «священник-глава» и не навязывает более узкий технический титул, хотя такое понимание возможно.
- issue: Референт הַטּוֹב
  choice: тот, кто добр
  alternative: доброе дело; поступающий хорошо
  rationale: Форма допускает субстантивированное личное понимание, но краткое выражение остаётся неоднозначным; предметное понимание также засвидетельствовано и вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксический параллелизм двух сфер ответственности сохранён; архаизмы сведены к минимуму, а подлинная неоднозначность заключительной формулы отражена в сноске.
