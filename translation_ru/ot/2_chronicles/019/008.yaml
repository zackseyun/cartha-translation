base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: ru
  text: Также в Иерусалиме Иосафат назначил из левитов и священников, а также из глав родов Израиля для суда Яхве[a] и для разбора тяжб. И они возвратились в Иерусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также понимания: «для суда от имени Яхве» или «для рассмотрения дел по закону Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по еврейскому тексту: «и они возвратились в Иерусалим». В данном контексте эти слова звучат несколько неожиданно; некоторые понимают их как «и они находились (или заседали) в Иерусалиме».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Также и
  rationale: Передаёт добавочное значение оборота и естественно связывает этот эпизод с предыдущим повествованием.
- source_word: הֶעֱמִיד
  choice: назначил
  rationale: В данном административно-судебном контексте порода hифиль глагола עמד означает поставление людей на определённое служение или должность.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: некоторых из левитов и священников, а также из глав родов Израиля
  rationale: Предлоги מִן/מֵ выражают выбор представителей из названных групп. «Главы родов» естественно передаёт общественно-родовую функцию выражения רָאשֵׁי הָאָבוֹת, не сводя её просто к главам отдельных семей.
- source_word: לְמִשְׁפַּט יְהוָה
  choice: для суда Яхве
  rationale: 'Близкая к форме оригинала передача сохраняет неоднозначность: речь может идти о суде, принадлежащем Яхве, совершаемом от Его имени или регулируемом Его законом.'
- source_word: וְלָרִיב
  choice: и для разбора тяжб
  rationale: רִיב в судебном контексте обозначает спор, тяжбу или судебное дело. Выражение «разбор тяжб» ясно и естественно обозначает порученную судьям деятельность.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: И они возвратились в Иерусалим
  rationale: Масоретская огласовка прямо указывает на глагол שוב — «возвращаться». Хотя фраза неожиданна после начального упоминания Иерусалима, её буквальный смысл сохранён в основном тексте, а трудность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация передаёт личное имя в исходном тексте и не подменяет его титулом.
- issue: Смысл выражения לְמִשְׁפַּט יְהוָה
  choice: для суда Яхве
  alternative: для суда по закону Яхве / чтобы судить от имени Яхве
  rationale: Выбранная формулировка не ограничивает выражение лишь одной трактовкой и сохраняет его грамматическую и богословскую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому оригиналу, но «для разбора тяжб» делает судебную функцию понятной современному читателю. Все сносочные маркеры размещены непосредственно при спорных выражениях.
