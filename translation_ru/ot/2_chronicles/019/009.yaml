  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: ru
  text: 'И он повелел им: «Так поступайте в страхе перед Яхве[a], верно[b] и от всего сердца[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Страх перед Яхве» здесь означает также благоговение перед Яхве.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с верностью», «добросовестно».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «с цельным сердцем»; также: «с неразделённым сердцем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם
  choice: И он повелел им
  rationale: Глагол צוה с על обозначает обращённое к ним повеление; русское «повелел им» точно и естественно передаёт конструкцию.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский ввод прямой речи естественно передаётся в современном русском пунктуацией, без тяжеловесного «говоря».
- source_word: כֹּה תַעֲשׂוּן
  choice: Так поступайте
  rationale: «Поступайте» передаёт широкое עשה в контексте наставления судьям, а повелительное наклонение естественно выражает директивную силу формы.
- source_word: בְּיִרְאַת יְהוָה
  choice: в страхе перед Яхве
  rationale: Сохраняется весомое библейское понятие благоговейного страха и личное имя יהוה; «перед» делает русское сочетание идиоматичным.
- source_word: בֶּאֱמוּנָה
  choice: верно
  rationale: В судебном контексте אֱמוּנָה означает надёжность и добросовестную верность при исполнении обязанностей, а не прежде всего внутреннюю веру.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: и от всего сердца
  rationale: Выражение естественно сохраняет образ цельного сердца и указывает на искреннюю, неразделённую внутреннюю преданность.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Значение אֱמוּנָה в наставлении судьям
  choice: верно
  alternative: с верой; добросовестно; с верностью
  rationale: Контекст требует характеристики надёжного и честного исполнения судебных обязанностей; перевод не сводит слово к позднейшему догматическому понятию веры.
- issue: Смысл לֵבָב שָׁלֵם
  choice: от всего сердца
  alternative: с неразделённым сердцем; с чистым сердцем
  rationale: Выбранная формулировка сохраняет цельность и полноту внутреннего расположения, не сужая смысл до одной лишь нравственной безупречности.
translation_notes:
  register: Современный литературный русский, сдержанный и достойный библейский стиль. Синтаксис упрощён естественным русским вводом прямой речи; ключевые образы страха перед Богом и цельного сердца сохранены.
