  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: ru
  text: Итак, да будет на вас страх перед Яхве. Будьте осмотрительны и действуйте, потому что у Яхве, Бога нашего, нет ни несправедливости, ни лицеприятия[a], ни принятия взяток.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднятия лица» — еврейская идиома, означающая пристрастное отношение или предпочтение одному человеку перед другим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Сочетание вводит итоговое увещание; «итак» естественно передаёт здесь не только временной, но и выводный оттенок.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: да будет на вас страх перед Яхве
  rationale: Сохранена побудительная форма יְהִי и образное выражение «на вас»; «страх перед Яхве» обозначает благоговейный страх, направляющий поведение судей.
- source_word: שִׁמְרוּ וַעֲשׂוּ
  choice: Будьте осмотрительны и действуйте
  rationale: В судебном контексте שִׁמְרוּ призывает к внимательности и осторожности, а וַעֲשׂוּ — к практическому исполнению порученного дела.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: потому что у Яхве, Бога нашего, нет
  rationale: Русская конструкция с «у» естественно передаёт еврейское עִם и утверждает отсутствие названных пороков в характере и действиях Бога.
- source_word: עַוְלָה
  choice: несправедливости
  rationale: Слово может обозначать неправду или неправедность; в наставлении судьям «несправедливость» точно передаёт его судебно-нравственный смысл.
- source_word: מַשֹּׂא פָנִים
  choice: лицеприятия
  rationale: Устойчивое русское слово точно передаёт идиому о предпочтении человеку из-за его положения или личности; буквальный образ разъяснён в сноске.
- source_word: מִקַּח שֹׁחַד
  choice: принятия взяток
  rationale: Номинальная конструкция обозначает получение взятки; множественное число естественно для общего запрета и характеристики поведения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» передаёт личное Божье имя и не подменяет его титулом.
- issue: Характер выражения פַחַד יְהוָה
  choice: страх перед Яхве
  alternative: ужас перед Яхве; благоговение перед Яхве
  rationale: «Страх» сохраняет силу исходного слова и допускает присущую контексту серьёзность, тогда как «благоговение» могло бы чрезмерно смягчить его, а «ужас» — чрезмерно усилить.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. Синтаксис остаётся близким к еврейскому тексту, но избегает архаизмов; термин «лицеприятие» сохранён как понятный библейско-правовой эквивалент и пояснён сноской.
