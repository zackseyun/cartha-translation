  text: וַ/יַּעֲמֵ֨ד שֹֽׁפְטִ֜ים בָּ/אָ֗רֶץ בְּ/כָל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת לְ/עִ֥יר וָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: ru
  text: И поставил он судей в стране[a], во всех укреплённых городах Иудеи, в каждом городе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всей стране».'
    reason: Лексически предлог בְּ в данном контексте может выражать не только местонахождение, но и распределение по всей территории.
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: поставил
  rationale: Порода хифиль глагола עמד здесь означает назначение людей на должность. «Поставил» естественно передаёт это значение и сохраняет образную близость к еврейскому выражению.
- source_word: שֹׁפְטִים
  choice: судей
  rationale: Существительное обозначает должностных лиц, осуществляющих суд; «судьи» — точный и общепонятный русский эквивалент.
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: Буквально передаёт место действия; распределительный охват далее уточняется словами о всех укреплённых городах. Возможное значение «по всей стране» вынесено в сноску.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: во всех укреплённых городах Иудеи
  rationale: Сохраняет указание на полный охват городов Иудеи и естественный русский порядок слов вместе с последующим определением.
- source_word: הַבְּצֻרוֹת
  choice: укреплённых
  rationale: Причастная форма описывает города как укреплённые и защищённые; это точный и современный русский вариант.
- source_word: לְעִיר וָעִיר
  choice: в каждом городе
  rationale: Еврейская распределительная конструкция подчёркивает отдельное назначение судей по городам. «В каждом городе» передаёт её смысл естественнее, чем буквальное и двусмысленное «из города в город».
