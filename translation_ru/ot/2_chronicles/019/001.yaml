lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שוב в повествовательной форме обозначает возвращение; «вернулся» естественно и точно передаёт действие.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Сочетание в приложении указывает на царское положение Иосафата; традиционное «царь Иудеи» понятно современному читателю.
- source_word: אֶל בֵּיתוֹ
  choice: в свой дом
  rationale: בַּיִת здесь обозначает дом как место возвращения; возвратное «свой» естественно соотносит дом с подлежащим.
- source_word: בְּשָׁלוֹם
  choice: благополучно
  rationale: В данном контексте שָׁלוֹם подчёркивает невредимое, безопасное возвращение после военного похода; «благополучно» естественно выражает этот смысл, а буквальный образ сохранён в примечании.
- source_word: לִירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Хотя לְ обычно выражает направление, синтаксически Иерусалим уточняет местонахождение дома; по-русски естественно «в свой дом в Иерусалиме».
