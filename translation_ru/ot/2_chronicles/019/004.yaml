base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: ru
  text: Иосафат жил в Иерусалиме. Затем он снова[a] отправился к народу — от Вирсавии до горной области Ефрема — и возвратил людей к Яхве[b], Богу их отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вернулся и вышел к народу». Повтор глагола, вероятно, указывает, что после возвращения в Иерусалим Иосафат вновь предпринял это действие.'
    reason: lexical_alternative
  - marker: b
    text: Имя «Яхве» передаёт еврейское יהוה (YHWH); традиционный вариант — «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: Глагол ישׁב с указанием места здесь означает постоянное пребывание; «жил» естественно и точно передаёт смысл.
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: потом он снова вышел
  rationale: Повтор корня שוב перед וַיֵּצֵא указывает на возобновление действий Иосафата после возвращения в Иерусалим; «снова» передаёт это без неестественного повтора.
- source_word: וַיֵּצֵא בָעָם
  choice: вышел к народу и прошёл
  rationale: Предлог ב указывает на движение среди народа или по населённой территории. Добавление «прошёл» естественно связывает выражение с последующим указанием географического диапазона.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: от Вирсавии до горной области Ефрема
  rationale: הַר אֶפְרַיִם обозначает гористую область Ефрема, а не одну гору; традиционная русская форма топонима — «Вирсавия».
- source_word: וַיְשִׁיבֵם
  choice: возвращая людей
  rationale: Каузативная форма глагола שוב означает «побуждать возвратиться, возвращать». Деепричастная конструкция передаёт сопутствующий итог его обхода, не приписывая тексту специальную терминологию обращения или покаяния.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל выражает направленность возвращения к Богу, а тетраграмматон передан личным именем «Яхве».
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Богу их отцов
  rationale: Формулировка сохраняет заветный и исторический оттенок исходного выражения, а также его прямое указание на отцов народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: «Яхве» передаёт присутствующее в еврейском тексте личное имя Бога и отличает его от титула אֲדֹנָי.
- issue: Смысл וַיְשִׁיבֵם אֶל יְהוָה
  choice: возвращая людей к Яхве
  alternative: обратил их к Господу; побудил их покаяться
  rationale: Выбранная формулировка сохраняет буквальный образ возвращения и не сужает его до позднейшей специальной богословской терминологии.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан плавным и доступным; традиционные русские формы имён «Иосафат» и «Вирсавия» сохранены. Подлинная неоднозначность повтора וַיָּשָׁב передана словом «снова», без отдельной сноски, поскольку это естественная контекстуальная интерпретация.
