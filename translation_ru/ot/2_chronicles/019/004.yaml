  source_fidelity: 'В целом смысл передан верно: Иосафат пребывает в Иерусалиме, вновь предпринимает действие среди народа в пределах от Вирсавии до горной области Ефрема и возвращает людей к Яхве. Однако деепричастие «возвращая» ослабляет завершённое повествовательное действие וַיְשִׁיבֵם и может создавать впечатление лишь сопутствующего процесса. Повтор וַיָּשָׁב перед «вышел» допустимо передать словом «снова», но эта интерпретация должна быть отмечена, поскольку буквально возможно «вернулся и вышел».'
