  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: ru
  text: 'И сказал судьям: «Смотрите, что вы делаете, ведь вы судите не для человека[a], а для Яхве, и Он с вами в судебном деле[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не для людей». Еврейское אָדָם («человек») стоит в единственном числе, но имеет обобщённое значение и противопоставлено Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «при совершении суда» или «в деле правосудия». Еврейское выражение может обозначать как сам акт суда, так и судебное дело вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: судьям
  rationale: Субстантивированное причастие от שׁפט обозначает назначенных лиц, осуществляющих судебную власть; «судьи» — естественный и точный русский эквивалент.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: Смотрите, что вы делаете
  rationale: Императив призывает внимательно оценить собственные действия; формулировка сохраняет прямоту и предостерегающую силу еврейского выражения.
- source_word: לְאָדָם
  choice: для человека
  rationale: Единственное число אָדָם употреблено обобщённо и риторически противопоставлено Яхве. Русское «для человека» сохраняет число и при этом естественно допускает родовое значение.
- source_word: תִּשְׁפְּטוּ
  choice: вы судите
  rationale: Глагол שׁפט означает осуществление судебного разбирательства или вынесение решения; настоящее время естественно передаёт постоянный характер поручения.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל указывает, что судьи действуют ради Яхве, от Его имени и под Его ответственностью; личное имя передано как «Яхве».
- source_word: וְעִמָּכֶם
  choice: и Он с вами
  rationale: Именная конструкция выражает присутствие Яхве при судьях. Местоимение «Он» добавлено согласно нормам русского синтаксиса, а его референт ясно задан предыдущей частью.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: когда вы вершите суд
  rationale: Идиоматическая русская формулировка передаёт участие Яхве в судебном деле или процессе, не сводя מִשְׁפָּט исключительно к отвлечённой справедливости.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному консультационному слою.
- issue: Родовое значение אָדָם в единственном числе
  choice: человек
  alternative: люди / человечество
  rationale: «Человек» сохраняет грамматическое единственное число и контраст между человеческой и божественной стороной суда, не ограничивая смысл одним мужчиной.
- issue: Характер присутствия Яхве при суде
  choice: Он с вами, когда вы вершите суд
  alternative: Он с вами в судебном деле
  rationale: Еврейское בִּדְבַר מִשְׁפָּט допускает отнесение как к процессу вынесения решения, так и к судебному делу вообще; основной текст выбран ради естественности, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным наставительным тоном. Сохранены прямое обращение к судьям, родовой контраст «человек — Яхве» и смысловая широта заключительной судебной формулы.
