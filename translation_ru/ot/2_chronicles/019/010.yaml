source:
  edition: WLC
  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: ru
  text: А всякую тяжбу, которая поступит к вам от ваших братьев, живущих в своих городах, — будь то между кровью и кровью[a], между законом и заповедью, постановлениями и судебными решениями, — предупреждайте их, чтобы они не навлекли на себя вину перед Яхве; иначе гнев падёт на вас и на ваших братьев. Поступайте так — и не навлечёте на себя вины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между кровью и кровью»; вероятно, имеются в виду дела о кровопролитии или убийстве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: тяжба
  rationale: Слово обозначает спор или дело, подлежащее судебному разбирательству; «тяжба» естественно передаёт юридический контекст, не сужая значение до конкретного вида иска.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: поступит к вам
  rationale: В судебном контексте речь идёт о деле, переданном на рассмотрение судьям.
- source_word: מֵאֲחֵיכֶם
  choice: от ваших братьев
  rationale: Сохранён буквальный язык родства, обозначающий членов общины завета.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: живущих в своих городах
  rationale: Современная и ясная передача причастного оборота; «своих» по-русски естественно соотносит города с братьями.
- source_word: בֵּין דָּם לְדָם
  choice: между кровью и кровью
  rationale: Сохранено краткое и неоднозначное юридическое выражение оригинала; вероятный смысл пояснён в сноске.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: между законом и заповедью, постановлениями и судебными решениями
  rationale: Переданы различные категории правовых предписаний без сведения их к одному общему понятию.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: вы должны предостеречь их
  rationale: Порода hифиль глагола זהר выражает предупреждение или предостережение, призванное не допустить вины.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: они не навлекли на себя вину перед Яхве
  rationale: Передаёт наступление виновности и ответственность перед Богом; выражение естественно для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: קֶצֶף
  choice: гнев
  rationale: Обозначает суровый Божий гнев как следствие вины; «гнев» звучит естественно и сохраняет серьёзность предупреждения.
- source_word: כֹּה תַעֲשׂוּן
  choice: Поступайте так
  rationale: Кратко и естественно отсылает к предписанному порядку действий.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: не навлечёте на себя вины
  rationale: Сохраняет смысловой и лексический параллелизм с предыдущим употреблением אשׁם.
theological_decisions:
- issue: Обозначение членов общины словом אֲחֵיכֶם
  choice: ваших братьев
  alternative: ваших соплеменников
  rationale: Оригинал использует родственный термин; его сохранение передаёт семейно-заветный характер общины, не исключая более широкого общественного значения.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Сохранено личное имя Бога, непосредственно присутствующее в еврейском тексте.
- issue: Неоднозначность выражения בֵּין דָּם לְדָם
  choice: между кровью и кровью
  alternative: в делах о кровопролитии
  rationale: Буквальная форма сохраняет подлинную краткость и неоднозначность юридического выражения; вероятное истолкование вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-наставительного контекста. Синтаксис упрощён для ясности, но юридические категории и повтор корня אשׁם сохранены. Маркер [a] присутствует в основном тексте.
