    rationale: «Поразил его внутренности неизлечимой болезнью» может быть понято как прямое поражение органов болезнью, тогда как בְּמֵעָיו характеризует место болезни у самого Иорама. Формулировка «болезнью внутренних органов» яснее сохраняет эту связь.
  - severity: low
