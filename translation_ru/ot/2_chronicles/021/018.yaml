  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: ru
  text: И после всего этого Яхве поразил его неизлечимой болезнью внутренних органов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «болезнью, от которой не было исцеления»; буквально: «так что исцеления не было».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל זֹאת
  choice: И после всего этого
  rationale: Сохраняет присоединительный союз, временную последовательность и обобщённую отсылку к предшествующим событиям.
- source_word: נְגָפוֹ
  choice: поразил его
  rationale: Передаёт сильное значение непосредственного поражения, не уточняя сверх текста его способ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּמֵעָיו
  choice: его внутренности
  rationale: מֵעֶה обозначает внутренние органы, особенно кишечник; «внутренности» естественно и достаточно широко сохраняет значение древнееврейского слова.
- source_word: לָחֳלִי
  choice: болезнью
  rationale: В данном контексте указывает на тяжёлое телесное заболевание как результат поражения.
- source_word: לְאֵין מַרְפֵּא
  choice: неизлечимой
  rationale: Кратко и естественно передаёт отсутствие исцеления или средства излечения, сохраняя тяжесть состояния.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное божественное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер болезни как Божьего поражения
  choice: Яхве поразил его… болезнью
  alternative: Яхве допустил, чтобы он заболел
  rationale: Глагол נְגָפוֹ прямо приписывает действие Яхве; смягчение до простого допущения устранило бы богословскую напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Союз «И» сохранён ради связи с предшествующим рассказом; архаичное «чрево» не используется.
