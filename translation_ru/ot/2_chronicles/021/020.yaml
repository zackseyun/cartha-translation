base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: ru
  text: Ему было тридцать два года, когда он стал царём, и восемь лет он царствовал в Иерусалиме. Он ушёл, никем не оплакиваемый[a]. Его похоронили в Городе Давида, но не в царских гробницах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ушёл, никем не желанный». Буквально: «без желания»; выражение может означать отсутствие расположения или сожаления со стороны других.'
    reason: Сохраняет неоднозначность בְּלֹא חֶמְדָּה и не создаёт впечатления, будто отсутствие желания относится к самому царю.
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: ему было тридцать два года
  rationale: Обычная древнееврейская формула указания возраста естественно передаётся современным русским оборотом.
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Форма обозначает время восшествия на престол; этот вариант точен и естествен по-русски.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: восемь лет он царствовал
  rationale: Глагол מָלַךְ означает «царствовать, быть царём»; выбран стандартный русский оборот для формулы правления.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места.
- source_word: וַיֵּלֶךְ
  choice: он ушёл
  rationale: Буквально «и он пошёл/ушёл»; в некрологическом контексте это эвфемизм смерти. «Ушёл» сохраняет образность, не заменяя её прямым «умер».
- source_word: בְּלֹא חֶמְדָּה
  choice: никто о нём не сожалел
  rationale: חֶמְדָּה выражает желание, расположение или то, чем дорожат. Контекстуальная передача показывает, что его уход не вызвал скорби, а сноска сохраняет более буквальную возможность.
- source_word: וַיִּקְבְּרֻהוּ
  choice: его похоронили
  rationale: Неопределённо-личная русская конструкция естественно передаёт глагол во множественном числе с объектным суффиксом.
- source_word: בְּעִיר דָּוִיד
  choice: в Городе Давида
  rationale: Устойчивое географическое наименование; прописная буква подчёркивает функцию названия места.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: но не в царских гробницах
  rationale: «Царские гробницы» естественно и точно обозначает места погребения царей.
theological_decisions:
- issue: Смысл некрологической формулы וַיֵּלֶךְ בְּלֹא חֶמְדָּה
  choice: Он ушёл, и никто о нём не сожалел
  alternative: Он ушёл, никем не желанный / без почёта
  rationale: Перевод сохраняет эвфемизм «ушёл» и передаёт отсутствие скорби или привязанности, не утверждая сверх текста конкретного обряда, посмертной участи или богословской оценки.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Эвфемистическое «ушёл» сохраняет образ оригинала; неоднозначная фраза пояснена в сноске без конфессионального истолкования.
