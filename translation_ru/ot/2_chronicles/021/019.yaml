  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: ru
  text: Спустя некоторое время, когда истекли два года, внутренности его вышли наружу из-за болезни, и он умер от тяжёлых болезней. Народ его не совершил для него сожжения[a], как для его предков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, речь идёт о погребальной почести — например, сожжении благовоний, — а не о кремации тела.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: по прошествии времени
  rationale: Еврейский идиоматический оборот указывает на течение некоторого времени; буквальное «через дни от дней» по-русски неясно.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: к концу второго года
  rationale: Оборот обозначает наступление предела двухлетнего периода болезни; выражение естественно для современного русского языка.
- source_word: יָצְאוּ מֵעָיו
  choice: внутренности его вышли наружу
  rationale: מֵעִים обозначает внутренние органы, в данном контексте прежде всего кишечник, а יצא сохраняет прямой смысл «выйти». Перевод не смягчает тяжёлую телесную подробность и не сужает значение до одного органа.
- source_word: עִם חָלְיוֹ
  choice: из-за болезни
  rationale: Хотя עִם обычно значит «с», здесь сочетание естественно понимается как сопутствующая причина или обстоятельство.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: в тяжких мучениях
  rationale: Сочетание буквально говорит о тяжких, губительных недугах; в контексте смерти русское выражение передаёт тяжесть болезненного состояния без неестественного множественного «болезнях».
- source_word: שְׂרֵפָה
  choice: погребальное сожжение
  rationale: Слово означает «сожжение», но царский погребальный контекст указывает на почётный обряд с огнём, вероятно сожжение благовоний, а не тела; значение уточняется сноской.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: какое устраивали в честь его предков
  rationale: Сравнение относится к погребальной почести, оказанной прежним царям или предкам, а не обязательно к сожжению их тел.
theological_decisions:
- issue: Характер שְׂרֵפָה в контексте царского погребения
  choice: почётное погребальное сожжение, вероятно благовоний, а не кремация тела Иорама
  alternative: кремация либо точно не определённый обряд с огнём
  rationale: В Паралипоменоне речь идёт о царской погребальной почести, которой Иорам не удостоился. Основной текст сохраняет образ сожжения, а сноска не выдаёт вероятное культурное объяснение за несомненный факт.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Графическая телесная деталь сохранена без эвфемизма; архаические «чресла» и двусмысленное «утроба» не использованы. Повтор союза вав передан плавным русским синтаксисом.
