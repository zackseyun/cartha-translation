base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: ru
  text: И возбудил Яхве против Иорама дух филистимлян и арабов, живших рядом с кушитами[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побудил» или «поднял»; еврейский глагол обозначает, что Яхве вызвал их враждебное выступление против Иорама.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «арабов, находившихся возле кушитов». Выражение, вероятнее всего, указывает на географическое соседство; возможно также понимание: «бывших под властью кушитов».'
    reason: ambiguity
lexical_decisions:
- source_word: וַיָּעַר
  choice: возбудил
  rationale: Глагол означает побуждение или возбуждение к действию; здесь Яхве вызывает враждебное выступление народов против Иорама.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: עַל יְהוֹרָם
  choice: против Иорама
  rationale: Предлог עַל при обозначении враждебного действия естественно передаётся как «против».
- source_word: רוּחַ
  choice: враждебный дух
  rationale: Существительное רוּחַ буквально означает «дух» и здесь указывает на побуждение или настрой народов; определение «враждебный» проясняет контекст, не устраняя исходный образ.
- source_word: הַפְּלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское название древнего народа.
- source_word: וְהָעַרְבִים
  choice: и арабов
  rationale: Современное и естественное русское обозначение древней этнической группы; контекст исключает отождествление с современными политическими образованиями.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: живших рядом с кушитами
  rationale: Идиома עַל יַד преимущественно выражает пространственную близость — «рядом, возле». Причастное уточнение «живших» естественно связывает относительное предложение с арабами.
theological_decisions:
- issue: Божественная причинность в выступлении враждебных народов против Иорама
  choice: Яхве активно возбудил их враждебный дух
  alternative: Яхве лишь допустил проявление уже существовавшей вражды
  rationale: Еврейский глагол прямо приписывает действие Яхве. Перевод не смягчает причинность до простого попущения и вместе с тем не добавляет отсутствующего в стихе богословского объяснения.
- issue: Значение רוּחַ применительно к народам
  choice: сохранить образ «духа», уточнив его как враждебный
  alternative: передать только как «вражду» или «настроение»
  rationale: Так сохраняется многозначный образ исходного текста, а контекстуальное определение делает русскую фразу понятной.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет повествовательную связь. Конструкция «враждебный дух» удерживает еврейский образ и остаётся понятной обычному читателю.
