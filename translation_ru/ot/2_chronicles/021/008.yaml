  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥יכוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: ru
  text: В его дни Эдом восстал против власти Иудеи и поставил над собой царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «восстал из-под руки Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: В его дни
  rationale: Сохраняет временную формулу оригинала и естественно обозначает период правления Иорама.
- source_word: פָּשַׁע
  choice: восстал
  rationale: В политическом контексте глагол означает мятеж или отпадение от власти, а не отвлечённое нравственное преступление.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Традиционная русская передача названия народа и страны.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: против власти Иудеи
  rationale: Еврейский оборот буквально означает выход «из-под руки Иудеи», то есть из-под её господства. В основном тексте смысл передан естественным современным русским выражением, а буквальный образ сохранён в сноске.
- source_word: וַיַּמְלִיכוּ
  choice: поставил ... царя
  rationale: Каузативная форма מלך означает возведение или поставление кого-либо царём. Единственное число согласовано с собирательным названием «Эдом».
- source_word: עֲלֵיהֶם
  choice: над собой
  rationale: Передаёт значение власти царя над самими эдомитянами и естественно согласуется с собирательным подлежащим «Эдом».
- source_word: מֶלֶךְ
  choice: царя
  rationale: Неопределённое существительное естественно передаётся по-русски без артикля.
