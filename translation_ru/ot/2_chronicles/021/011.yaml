  source_fidelity: Перевод в целом передаёт добавочное «также», причинное значение глагола וַיֶּזֶן и намеренно не делает явным отсутствующее в еврейском дополнение «от Господа». Однако «ввёл Иудею в заблуждение» обычно означает «обманул», тогда как וַיַּדַּח означает побудил Иудею сбиться с пути / увёл её в сторону. «Святилища на высотах в горах» также создаёт неудачное удвоение топографических образов и несколько чрезмерно конкретизирует בָּמוֹת как святилища.
  naturalness: «Склонил жителей Иерусалима к блуду» уместно в современном литературном русском с библейской окраской. Формулировка о высотах нуждается в более гладкой передаче, а «ввёл в заблуждение» следует заменить на выражение о сбивании с пути.
  terminology: «Блуд» сохраняет намеренную сексуально-религиозную двусмысленность זנה. «Культовые места на горных высотах» ясно передаёт историко-культовое значение бָּמוֹת, не выдавая их непременно за здания. «Сбил Иудею с пути» передаёт каузативное «увёл в сторону, заставил уклониться», не добавляя в основной текст «от Господа».
