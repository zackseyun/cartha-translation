base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: ru
  text: Он также устроил культовые места на горных высотах Иудеи, склонил жителей Иерусалима к блуду[a] и сбил Иудею с пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставил жителей Иерусалима блудодействовать». Здесь язык супружеской неверности может обозначать как половую распущенность, так и религиозное отступничество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совратил Иудею» или «увёл Иудею с пути»; по смыслу — от верности Господу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Он также
  rationale: Передаёт добавочное и подчёркнутое значение сочетания גַּם с самостоятельным местоимением, естественно продолжая рассказ об Иораме.
- source_word: עָשָׂה בָמוֹת
  choice: устроил святилища на высотах
  rationale: Глагол עשה означает «сделал, устроил», а בָמוֹת обозначает культовые места на возвышенностях, обычно связанные здесь с неправомерным поклонением. Одно слово «высоты» в современном русском недостаточно ясно, поэтому родовое обозначение «святилища» добавлено для понятности.
- source_word: בְּהָרֵי יְהוּדָה
  choice: в горах Иудеи
  rationale: הָרִים может обозначать горы, холмы или гористую местность. «В горах Иудеи» близко к форме исходного текста и естественно по-русски.
- source_word: וַיֶּזֶן
  choice: склонил ... к блуду
  rationale: Каузативная форма от זנה означает побудить к блуду или проституции; в контексте культовых высот она одновременно вызывает представление о нравственной распущенности и религиозной неверности. «К блуду» сохраняет эту намеренную двусмысленность и библейскую образность.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: жителей Иерусалима
  rationale: Точная и естественная передача причастной конструкции «живущие, обитатели Иерусалима».
- source_word: וַיַּדַּח אֶת יְהוּדָה
  choice: ввёл Иудею в заблуждение
  rationale: Каузатив от נדח в данном контексте означает заставить уклониться, сбить с верного пути. Формулировка сохраняет причинное значение и не добавляет прямо не названный в еврейском тексте объект удаления.
theological_decisions:
- issue: Означает ли וַיֶּזֶן буквальный разврат или религиозное отступничество
  choice: Сохранить образное и смысловое напряжение выражением «склонил ... к блуду»
  alternative: «заставил ... поклоняться другим богам» или «склонил ... к проституции»
  rationale: Контекст высот указывает на религиозную неверность, но сам глагол сохраняет сексуальную образность и может вызывать оба смысла; перевод не должен сводить его только к одному из них.
- issue: Следует ли явно указать, что Иудея была уведена от Господа
  choice: Не добавлять «от Господа» в основной текст
  alternative: «увёл Иудею от Господа»
  rationale: Контекст подразумевает отступление от Господа, однако дополнение отсутствует в еврейском тексте. Более краткая передача сохраняет исходную недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской тональностью. «Святилища на высотах» обеспечивает понятность историко-культового термина; «блуд» сохраняет традиционную образность, оставаясь понятным современному читателю.
