source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: ru
  text: Но ты пошёл путём царей Израиля и вовлёк Иудею и жителей Иерусалима в блуд[a], как дом Ахава[b] вовлёк их в блуд; к тому же ты убил своих братьев из дома твоего отца, которые были лучше тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «заставил Иудею и жителей Иерусалима блудить». В пророческой речи блуд служит образом неверности завету, часто выражавшейся в идолопоклонстве.'
    reason: Лексическая альтернатива и пояснение метафоры.
  - marker: b
    text: «Дом Ахава» — правящая династия Ахава.
    reason: Историко-культурное пояснение.
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: пошёл путём
  rationale: Сохраняет древнееврейскую метафору образа жизни и поведения, оставаясь естественным и понятным по-русски.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Прямо передаёт конструкцию и сохраняет важное историческое различие между Израилем и Иудеей.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: вовлёк Иудею и жителей Иерусалима в блуд
  rationale: Передаёт каузативный смысл формы от זנה и сохраняет резкую пророческую метафору неверности, не сужая её до одного лишь идолопоклонства или буквальной половой распущенности.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: как дом Ахава вовлекал их в блуд
  rationale: Повторение «вовлекал… в блуд» отражает параллелизм и повтор корня זנה; местоимение «их» естественно отсылает к Иудее и жителям Иерусалима.
- source_word: בֵּית אַחְאָב
  choice: дом Ахава
  rationale: Сохраняет библейское обозначение правящей династии; смысл пояснён в сноске.
- source_word: וְגַם
  choice: к тому же
  rationale: Ясно передаёт усилительное добавление нового обвинения — убийства братьев.
- source_word: אֶת אַחֶיךָ בֵית אָבִיךָ
  choice: своих братьев из дома твоего отца
  rationale: Передаёт принадлежность братьев к отцовскому, то есть царскому, дому без неестественной русской аппозиции.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: которые были лучше тебя
  rationale: Прямо сохраняет сравнительную нравственную оценку, не добавляя отсутствующего в тексте уточнения.
- source_word: הָרָגְתָּ
  choice: ты убил
  rationale: Нейтрально и точно передаёт значение глагола; вариант «убил» не усиливает его до более интерпретирующего «убил вероломно» или «совершил убийство».
theological_decisions:
- issue: Метафорический смысл זנה в контексте царского отступничества
  choice: Сохранить образ блуда и пояснить в сноске его значение как неверности завету, часто проявлявшейся в идолопоклонстве.
  alternative: Передать прямо как «ввёл в идолопоклонство» или буквально как «заставил заниматься проституцией».
  rationale: Еврейский текст использует намеренно резкую метафору, не называя одно только идолопоклонство. Выбранная передача сохраняет богословскую напряжённость и не превращает метафору ни в исключительно буквальное, ни в чрезмерно узкое толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и образности библейского обвинения. Синтаксис сделан естественным для устной и письменной речи; архаизмы вроде «любодействовать» и чрезмерно буквальное «играть блудницу» исключены.
