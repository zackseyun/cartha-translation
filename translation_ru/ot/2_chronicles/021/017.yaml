  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: ru
  text: Они выступили против Иудеи, вторглись в неё, захватили всё имущество, находившееся в царском дворце, и увели сыновей и жён царя. У него не осталось ни одного сына, кроме Иоахаза[a], младшего из его сыновей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, это тот же человек, который в других местах назван Охозией (ср. 4 Царств 8:24–26; 2 Паралипоменон 22:1).
    reason: Альтернативная форма имени и вероятное отождествление по параллельным местам; основной текст сохраняет масоретское чтение «Иоахаз».
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: Они выступили против Иудеи
  rationale: Глагол עלה с предлогом ב обозначает движение в пределы территории, а военный контекст указывает на враждебное наступление. Выражение передаёт оба оттенка естественным современным русским языком.
- source_word: וַיִּבְקָעוּהָ
  choice: вторглись в неё
  rationale: בקע буквально означает «рассекать, проламывать, прорываться». При объекте «Иудея» речь идёт о насильственном проникновении в страну; «вторглись» естественно передаёт военный смысл, хотя несколько ослабляет образ прорыва обороны.
- source_word: וַיִּשְׁבּוּ
  choice: увели
  rationale: שבה обычно означает захват и увод в плен. Поскольку далее перечислены как имущество, так и люди, «увели всё имущество… а также сыновей и жён» передаёт общий смысл захвата и перемещения, хотя применительно к имуществу по-русски также возможно «унесли».
- source_word: כָּל הָרְכוּשׁ
  choice: всё имущество
  rationale: רכוש обозначает имущество, собственность или нажитое добро; «имущество» широко и стилистически уместно.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: найденное в царском доме
  rationale: נמצא передаёт значение «находившееся, найденное», а בית המלך может обозначать царский дом или дворец. Формулировка сохраняет структуру еврейского текста без обязательного уточнения «дворец».
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: а также сыновей и жён царя
  rationale: גם добавляет к имуществу людей. Явное «царя» устраняет возможную русскую двусмысленность местоимения и соответствует референту суффиксов.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: У него не осталось ни одного сына
  rationale: Нифаль שׁאר означает «остаться». Самостоятельное предложение естественно передаёт итог захвата; «ни одного» ясно выражает отрицание.
- source_word: כִּי אִם
  choice: кроме
  rationale: Сочетание вводит единственное исключение.
- source_word: יְהוֹאָחָז
  choice: Иоахаз
  rationale: Основной текст следует масоретскому чтению יְהוֹאָחָז. Связь с именем Охозия в параллельных местах поясняется в сноске.
- source_word: קְטֹן בָּנָיו
  choice: младшего из его сыновей
  rationale: קטן в семейном контексте указывает на младшего по возрасту, а конструкция буквально соотносит его со всеми сыновьями.
theological_decisions:
- issue: Форма имени единственного оставшегося сына Иорама
  choice: В основном тексте сохранено масоретское имя «Иоахаз»
  alternative: «Охозия» на основании 4 Царств 8:24–26 и 2 Паралипоменон 22:1
  rationale: Это текстуально-повествовательный, а не вероучительный вопрос. Приоритет исходного еврейского текста требует сохранить יְהוֹאָחָז, а вероятное отождествление с Охозией следует сделать прозрачным в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения ради ясности; архаизмы устранены. Формулировка сохраняет последовательность военного вторжения, разграбления и пленения.
