  text: וַ/יַּֽעֲבֹ֤ר יְהוֹרָם֙ עִם שָׂרָ֔י/ו וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַ/יְהִי֙ קָ֣ם לַ֔יְלָה וַ/יַּ֗ךְ אֶת אֱדוֹם֙ הַ/סּוֹבֵ֣ב אֵלָ֔י/ו וְ/אֵ֖ת שָׂרֵ֥י הָ/רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: ru
  text: Иорам перешёл со своими военачальниками и со всеми колесницами, которые были с ним. Ночью он поднялся и поразил окружавших его эдомитян и начальников колесниц[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальников колесничного войска».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: перешёл
  rationale: Глагол עבר обозначает переход или движение через нечто; такой перевод сохраняет конкретность действия, не уточняя не названные в тексте направление и цель.
- source_word: שָׂרָיו
  choice: со своими военачальниками
  rationale: В военном контексте שַׂר естественно означает начальника или командира; «военачальники» ясно передаёт роль этих людей.
- source_word: וְכָל־הָרֶכֶב עִמּוֹ
  choice: и со всеми колесницами, бывшими при нём
  rationale: רֶכֶב может коллективно обозначать колесницы или колесничное войско. «Колесницы» близко к форме оригинала, а оборот «бывшими при нём» естественно передаёт עִמּוֹ.
- source_word: וַיְהִי קָם לַיְלָה
  choice: Ночью он поднялся
  rationale: Краткая русская формулировка естественно передаёт древнееврейскую повествовательную конструкцию ויהי с причастием, сохраняя ночное время действия.
- source_word: וַיַּךְ
  choice: разбил
  rationale: В данном военном контексте נכה означает нанести удар или разгромить. «Разбил» звучит естественно по-русски и не требует утверждать полный окончательный разгром.
- source_word: אֶת־אֱדוֹם הַסּוֹבֵב אֵלָיו
  choice: окруживших его эдомитян
  rationale: Название народа אֱדוֹם в позиции прямого дополнения естественно передать обозначением людей — «эдомитян»; причастие סבב описывает окружение Иорама.
- source_word: שָׂרֵי הָרָכֶב
  choice: начальников колесничного войска
  rationale: Сочетание обозначает начальников, связанных с רֶכֶב; «колесничное войско» яснее, чем буквальное «начальники колесниц», и сохраняет военный смысл.
