source:
  edition: WLC
  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: ru
  text: 'У него были братья, сыновья Иосафата: Азария, Иехиил, Захария, Азариягу[b], Михаил и Сафатия. Все они были сыновьями Иосафата, царя Израиля[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «царь Израиля». Обычно Иосафата называют царём Иудеи; здесь слово «Израиль», вероятно, употреблено в более широком смысле — о народе завета.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте имя четвёртого брата написано иначе, чем имя первого: עֲזַרְיָהוּ, с окончанием -יהו. Различие передано формой «Азариягу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֽ/וֹ
  choice: У него были
  rationale: Буквально «и у него»; это обычная еврейская конструкция принадлежности. Русское «у него были» естественно передаёт её смысл и сохраняет повествовательную связь.
- source_word: אַחִים
  choice: братья
  rationale: В данном родословном контексте речь идёт о сыновьях одного отца, поэтому слово обозначает братьев, а не родственников в широком смысле.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: сыновья Иосафата
  rationale: Сохранено прямое родословное обозначение, содержащееся в еврейской конструкции.
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Использована традиционная и узнаваемая русская библейская форма имени.
- source_word: וִֽיחִיאֵל
  choice: Иехиил
  rationale: Имя передано в принятой русской библейской форме.
- source_word: וּ/זְכַרְיָהוּ
  choice: Захария
  rationale: Имя передано в принятой русской библейской форме.
- source_word: וַ/עֲזַרְיָהוּ
  choice: Азариягу
  rationale: Форма отличается от первого имени עֲזַרְיָה наличием окончания -יהו; передача «Азариягу» сохраняет заметное в исходном тексте различие между именами двух братьев.
- source_word: וּ/מִיכָאֵל
  choice: Михаил
  rationale: Использована традиционная русская форма библейского имени.
- source_word: וּ/שְׁפַטְיָהוּ
  choice: Сафатия
  rationale: Использована традиционная русская библейская форма имени.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественная русская возобновляющая формула после перечня; по смыслу соответствует «все эти».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Перевод следует масоретскому тексту, где прямо стоит «царь Израиля», и не заменяет это выражение исторически ожидаемым титулом «царь Иудеи».
theological_decisions:
- issue: Титул Иосафата מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  alternative: царь Иудеи
  rationale: В еврейском тексте недвусмысленно сказано «царь Израиля». Вариант «царь Иудеи» гармонизировал бы стих с обычным историческим обозначением Иосафата, но устранил бы формулировку Летописца и возможное более широкое употребление имени «Израиль» применительно к народу завета.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным родословным звучанием. Синтаксис сделан естественным для русского читателя, при этом повтор «сыновья Иосафата» сохранён вслед за еврейским текстом. Традиционные русские формы имён предпочтены там, где это не скрывает значимого различия исходных форм.
