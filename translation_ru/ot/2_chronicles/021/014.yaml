source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: ru
  text: Вот, Яхве поразит тяжким бедствием[a] твой народ, твоих сыновей, твоих жён и всё твоё имущество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. фразу можно также перевести: «Вот, Яхве поражает… великим мором» или «Вот, Яхве вот-вот поразит… тяжким ударом». Причастие может выражать настоящее или близкое будущее, а מַגֵּפָה — мор, бедствие или губительный удар.'
    reason: Сохраняет существенную временную и лексическую неоднозначность еврейского текста; имя Яхве передано в основном тексте.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт торжественное привлечение внимания и непосредственность пророческого возвещения естественным для современного русского языка способом.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; примечание сохраняет прямое указание на личное имя Бога в еврейском тексте.
- source_word: נֹגֵף
  choice: поразит
  rationale: Причастие после הִנֵּה в пророческом возвещении может обозначать близкое будущее; русский совершенный вид естественно выражает предстоящее решительное действие.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: тяжким бедствием
  rationale: Сочетание может означать как мор, так и тяжёлый ниспосланный удар; «тяжкое бедствие» сохраняет широту значения и хорошо сочетается с глаголом «поразит».
- source_word: בְּעַמֶּךָ
  choice: твой народ
  rationale: Предлог ב при נֹגֵף отмечает поражаемый объект; прямое дополнение естественно по-русски.
- source_word: וּבְבָנֶיךָ
  choice: твоих сыновей
  rationale: Сохраняет явно мужское значение формы בָנִים в данном перечислении.
- source_word: וּבְנָשֶׁיךָ
  choice: твоих жён
  rationale: В притяжательном контексте נָשִׁים означает именно жён.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: и всё твоё имущество
  rationale: רְכוּשׁ обозначает собственность, добро или имущество; выбранная формулировка широка, ясна и современна.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь с примечанием «евр. Яхве»
  alternative: Яхве в основном тексте
  rationale: Так сохраняются достоинство и привычная русская библейская форма, а примечание открыто сообщает, что в оригинале стоит тетраграмматон, не стирая исходное имя.
- issue: Временная сила причастия נֹגֵף
  choice: 'близкое будущее: «поразит»'
  alternative: 'настоящее длительное: «поражает» или подчёркнутое ближайшее будущее: «вот-вот поразит»'
  rationale: Сочетание הִנֵּה с причастием в пророческой речи естественно возвещает надвигающееся действие. Простое будущее по-русски сохраняет срочность контекста без добавочного усиления.
- issue: Значение מַגֵּפָה
  choice: бедствие
  alternative: мор; тяжкий удар
  rationale: Слово допускает как значение эпидемического мора, так и более общее значение губительного божественного поражения. Более широкая передача не разрешает неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Порядок перечисления сохранён; архаизмы вроде «се» и «моровая язва» не используются.
