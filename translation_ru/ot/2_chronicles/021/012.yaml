  source_fidelity: 'В целом переданы все существенные элементы еврейского текста: письмо приходит к Иораму от Илии-пророка, сохранена формула пророческой речи, имя Яхве, династическое «отец», образ «ходить путями» и оба образца поведения. Однако «в котором говорилось» менее прямо передаёт לֵאמֹר и неоправданно переформулирует способ введения цитаты. Многоточие не имеет опоры в исходном тексте: стих действительно синтаксически продолжается, но это лучше обозначать запятой, как в еврейском и английском аудите.'
