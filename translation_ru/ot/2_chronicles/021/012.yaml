base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: ru
  text: 'И пришло к нему письмо от пророка Илии: «Так говорит Яхве, Бог Давида, твоего отца: за то, что ты не ходил путями своего отца Иосафата и путями Асы, царя Иудеи,»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: И пришло к нему письмо
  rationale: Сохраняет синтаксис еврейского текста, где «письмо» — подлежащее, а повествовательный וַ передан естественным русским «и».
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: от пророка Илии
  rationale: Естественный для русского языка порядок слов; имя передано в принятой русской библейской форме.
- source_word: לֵאמֹר
  choice: в котором говорилось
  rationale: По-русски письмо естественно вводить этой формулой; она передаёт функцию еврейского инфинитива, не создавая впечатления устной речи самого письма.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Сохраняет торжественную пророческую формулу в естественной современной форме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: Бог Давида, твоего отца
  rationale: Следует порядку еврейской конструкции; запятая ясно обозначает приложение и сохраняет династическое значение слова «отец».
- source_word: תַּחַת אֲשֶׁר
  choice: за то, что
  rationale: Естественно выражает причинное основание последующего суда и хорошо сочетается с русской пророческой речью.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: ты не ходил путями
  rationale: Сохраняет еврейскую метафору поведения; прошедшее время соответствует завершённой форме и естественно звучит по-русски.
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: своего отца Иосафата
  rationale: Возвратное «своего» устраняет возможную двусмысленность принадлежности; Иосафат здесь является непосредственным отцом адресата.
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: и путями Асы, царя Иудеи
  rationale: Союз וּ передан формально как «и»; в русском отрицание естественно распространяется на оба однородных оборота, поэтому замена на «или» не требуется.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет это различие без замены именем-титулом.
- issue: Значение אָבִיךָ при Давиде
  choice: твоего отца
  alternative: твоего предка
  rationale: Сохранена широкая библейская категория отцовства и династическая связь; контекст позволяет читателю понять Давида как праотца царя, не устраняя исходную формулировку.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим регистром. Метафора «ходить путями» сохранена как понятный библейский образ. Стих синтаксически продолжается далее, поэтому в конце поставлено многоточие внутри цитаты.
