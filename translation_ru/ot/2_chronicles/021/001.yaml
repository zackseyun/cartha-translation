base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: ru
  text: И почил Иосафат с отцами своими[a] и был погребён с отцами своими в Городе Давида. Вместо него воцарился его сын Иорам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть умер; буквально: «лёг с отцами своими». Это древнееврейское выражение означает, что человек умер и присоединился к своим предкам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил с отцами своими
  rationale: Устойчивую древнееврейскую формулу царского некролога передаёт традиционное и понятное по-русски выражение «почил с отцами своими»; оно сохраняет образный и торжественный характер оригинала, а значение смерти поясняется в сноске.
- source_word: וַיִּקָּבֵר
  choice: был погребён
  rationale: Точно передаёт страдательную форму и соответствует достойному регистру повествования.
- source_word: בְּעִיר דָּוִיד
  choice: в Городе Давида
  rationale: Сохраняет библейское географическое наименование; прописная буква показывает, что речь идёт об устойчивом названии места.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия естественно передаёт вступление Иорама на царство, а не только последующее правление.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Близко передаёт значение занятия прежнего положения царя и естественно звучит в сообщении о наследовании престола.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: יְהוֹרָם
  choice: Иорам
  rationale: Использована устоявшаяся русская библейская форма полного еврейского имени יְהוֹרָם.
