source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: ru
  text: Эдом восстал[a] против власти Иудеи[b] и остаётся независимым доныне. В то время Ливна также восстала против власти Иорама, потому что он оставил Яхве, Бога своих отцов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «отложился», «отпал».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в обоих случаях: «из-под руки»; это выражение означает выход из-под власти или господства.'
    reason: cultural_note
  - marker: c
    text: Эти слова могут объяснять непосредственно восстание Ливны или, шире, политические бедствия Иорама в целом.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: вышел / вышла из-под власти
  rationale: В политическом контексте глагол обозначает мятеж или отпадение от власти. В сочетании с מִתַּחַת יַד естественный русский оборот «выйти из-под власти» передаёт и восстание, и достигнутое освобождение от подчинения.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: из-под власти / из-под его власти
  rationale: Буквальный образ «из-под руки» означает выход из-под господства или управления. По-русски «из-под власти» ясно и естественно передаёт эту идиому.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Устоявшееся русское библейское название южного царства в данном политическом контексте.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: доныне
  rationale: Кратко и достойно передаёт формулу о продолжении положения до времени автора.
- source_word: אָז
  choice: в то же время
  rationale: Передаёт временную связь восстания Ливны с описанными событиями, не превращая её в строго последовательную хронологию.
- source_word: לִבְנָה
  choice: Ливна
  rationale: Устоявшаяся русская передача названия города.
- source_word: כִּי
  choice: потому что
  rationale: Ясно выражает причинную связь, присутствующую в еврейском тексте, не уточняя сверх текста, относится ли объяснение только к Ливне или ко всему комплексу бедствий.
- source_word: עָזַב
  choice: оставил
  rationale: Передаёт сознательный отказ Иорама от верности Богу; слово естественно в современном русском и сохраняет серьёзность исходного глагола.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Бога своих отцов
  rationale: Прямо сохраняет родовую и заветную формулировку еврейского текста.
theological_decisions:
- issue: К чему относится объяснение «потому что он оставил Яхве»
  choice: Причинная часть оставлена в той же позиции и без дополнительного уточнения.
  alternative: Можно понимать её узко — как объяснение восстания Ливны, — либо шире, как богословское объяснение политических бедствий Иорама в целом.
  rationale: Синтаксическая близость связывает придаточное с Ливной, однако богословская перспектива Летописца допускает более широкое отношение. Перевод не устраняет эту неоднозначность, а сноска сообщает о ней.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Идиома с «рукой» раскрыта как «власть» ради ясности; формула «доныне» сохраняет лаконичность и достоинство исходного текста.
