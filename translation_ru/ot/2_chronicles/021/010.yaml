  source_fidelity: В черновике верно переданы Иудея, Ливна, Яхве и причинная оговорка, но «вышел из-под власти ... и остаётся вне её» ослабляет политический глагол פשע («восстал», «отложился») и заменяет продолжающееся состояние независимости более расплывчатым описанием.
  naturalness: «Восстал против власти» и «остаётся независимым доныне» естественны для современного литературного русского и точно передают событие и его продолжение. Явное «Иорама» устраняет неудачную русскую двусмысленность местоимения «его».
  terminology: «Яхве, Бога своих отцов» сохранено. «Иудея» и «Ливна» приемлемы как устоявшиеся русские библейские названия. Сноска об идиоме уточнена так, чтобы охватывать оба еврейских оборота «из-под руки/власти».
