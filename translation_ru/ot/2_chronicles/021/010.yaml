revisions:
- from: Эдом вышел[a] из-под власти Иудеи и остаётся вне её доныне. В то же время Ливна также вышла из-под его власти[b], потому что он оставил Яхве, Бога своих отцов[c].
  to: Эдом восстал[a] против власти Иудеи[b] и остаётся независимым доныне. В то время Ливна также восстала против власти Иорама, потому что он оставил Яхве, Бога своих отцов[c].
  rationale: Исправление восстанавливает политическое значение פשע как восстания, сохраняет временную формулу «доныне» и делает результат восстания Эдома явным. Имя Иорама введено во втором предложении только для устранения двусмысленности русского местоимения; оно соответствует несомненному референту еврейского суффикса в контексте. Причинная неоднозначность сохранена в тексте и отмечена сноской.
