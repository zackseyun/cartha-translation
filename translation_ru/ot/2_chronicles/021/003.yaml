  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: ru
  text: 'Их отец дал им множество даров: серебро, золото и ценные вещи[a], а также укреплённые города в Иудее; царство же он отдал Иораму, потому что тот был первенцем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отборные вещи», «ценные дары». Еврейское слово может обозначать различные ценные или особо отобранные предметы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: И дал им отец их
  rationale: Сохраняет повествовательную последовательность wayyiqtol и лёгкую торжественность древнееврейского порядка слов, оставаясь понятным по-русски.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: множество даров
  rationale: Передаёт количественное значение רַבּוֹת и соответствует литературному библейскому регистру современного русского языка.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: серебро, золото
  rationale: Предлог לְ вводит виды или состав даров; перечисление после двоеточия естественно передаёт эту функцию без излишнего уточнения.
- source_word: וּלְמִגְדָּנוֹת
  choice: и драгоценности
  rationale: מִגְדָּנוֹת обозначает ценные или отборные предметы; «драгоценности» уместно в контексте царских даров и не сужает значение до лакомств.
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: а также укреплённые города в Иудее
  rationale: עִם указывает на добавление городов к движимым дарам; «а также» естественно выражает сопровождение в русском перечислении.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: царство же он отдал Иораму
  rationale: Частица «же» передаёт контраст между дарами братьям и царством, предназначенным Иораму, не превращая союз в резкое противопоставление.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: потому что тот был первенцем
  rationale: כִּי выражает причину, а «тот» однозначно соотносит местоимение с Иорамом; «первенец» сохраняет семейно-правовой статус הַבְּכוֹר.
