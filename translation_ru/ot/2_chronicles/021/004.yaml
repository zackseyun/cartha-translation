  text: וַ/יָּ֨קָם יְהוֹרָ֜ם עַל מַמְלֶ֤כַת אָבִי/ו֙ וַ/יִּתְחַזַּ֔ק וַ/יַּהֲרֹ֥ג אֶת כָּל אֶחָ֖י/ו בֶּ/חָ֑רֶב וְ/גַ֖ם מִ/שָּׂרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: ru
  text: Когда Иорам принял власть над царством своего отца и утвердился, он убил мечом всех своих братьев, а также некоторых из начальников[a] Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правителей», «сановников». Еврейское слово может обозначать высокопоставленных руководителей или должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: принял власть над царством своего отца
  rationale: В сочетании с עַל и словом «царство» глагол קום обозначает вступление в правление. Такой перевод естественен по-русски и сохраняет оттенок власти над царством, не подменяя «царство» словом «престол».
- source_word: וַיִּתְחַזַּק
  choice: утвердился
  rationale: Возвратная форма передаёт то, что Иорам укрепил собственное положение; краткое «утвердился» сохраняет возможный политический оттенок, не сводя выражение только к военному усилению.
- source_word: וַיַּהֲרֹג אֶת כָּל אֶחָיו בֶּחָרֶב
  choice: он убил мечом всех своих братьев
  rationale: Современное и прямое выражение; «братьев» точно передаёт мужской род существительного, а «мечом» сохраняет инструментальное значение.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: а также некоторых из начальников Израиля
  rationale: Предлог מִן имеет частичное значение, поэтому явно передано «некоторых из». Слово שָׂרִים может обозначать высокопоставленных начальников, правителей или сановников; «начальники» понятно современному читателю и не предполагает обязательного царского происхождения.
theological_decisions:
- issue: Кого обозначает «Израиль» в выражении מִשָּׂרֵי יִשְׂרָאֵל
  choice: сохранено «Израиля»
  alternative: «Иудеи» или «народа»
  rationale: В Паралипоменон название «Израиль» может иметь более широкое заветное или династическое значение и не обязательно ограничивается северным царством. Перевод сохраняет формулировку источника и не устраняет историко-богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан естественным для обычного читателя; архаизмы «восстал над царством» и «поразил мечом» не использованы.
