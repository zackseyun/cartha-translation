  text: Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: ru
  text: Иораму было тридцать два года, когда он стал царём, и восемь лет он царствовал в Иерусалиме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: Иораму было тридцать два года
  rationale: Еврейская конструкция בֶּן + числительное + שָׁנָה является устойчивым обозначением возраста; по-русски естественно передаётся без буквального «сын тридцати двух лет».
- source_word: יְהוֹרָם
  choice: Иорам
  rationale: Использована традиционная русская библейская форма имени, соответствующая полному еврейскому יְהוֹרָם.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Предлог בְּ с инфинитивом и местоименным суффиксом выражает время вступления на царство; эта формулировка естественна в современном русском языке.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: восемь лет
  rationale: Прямое обозначение продолжительности царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол означает «царствовать, быть царём»; при указании длительности «царствовал» точно и естественно передаёт смысл.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог указывает на место царствования, а название города передано в общепринятой русской форме.
