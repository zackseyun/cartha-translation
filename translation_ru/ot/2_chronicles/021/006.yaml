source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: ru
  text: Он шёл путём царей Израиля, как поступал дом Ахава, потому что дочь Ахава была его женой, и делал зло в глазах Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Он шёл путём
  rationale: Сочетание הלך с בְּדֶרֶךְ метафорически описывает образ жизни и поведение. Русское «шёл путём» сохраняет образ оригинала и ясно выражает следование примеру.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Прямой перевод сочетания, обозначающего правителей северного царства как образец поведения.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: как поступал дом Ахава
  rationale: Глагол во множественном числе согласован по смыслу с собирательным «дом Ахава», но в естественном русском грамматическое согласование требует единственного числа. «Поступал» передаёт поведение, а не отдельное действие.
- source_word: בֵּית אַחְאָב
  choice: дом Ахава
  rationale: «Дом» сохраняет библейское выражение и допускает подразумеваемый династический смысл без его чрезмерного уточнения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение связи Иорама с домом Ахава; причинное значение здесь ясно из контекста.
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ אִשָּׁה
  choice: дочь Ахава была его женой
  rationale: Естественно передаёт существующие брачные отношения и не создаёт впечатления, будто брак был заключён именно в этот момент.
- source_word: וַיַּעַשׂ הָרַע
  choice: и делал зло
  rationale: Краткая и естественная передача устойчивой повествовательной формулы; определённый артикль при הָרַע не требует отдельного выражения в русском.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет распространённую древнееврейскую оценочную метафору, понятную и в современном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер влияния дома Ахава
  choice: Сохранена причинная связь с браком без дополнительных пояснений
  alternative: Явно назвать жену Гофолией или утверждать, что именно она склонила его ко злу
  rationale: Стих объясняет связь Иорама с домом Ахава тем, что дочь Ахава была его женой, но не называет её здесь по имени и не формулирует более точный механизм влияния.
translation_notes:
  register: Современный литературный русский с сохранением ключевых древнееврейских метафор «шёл путём», «дом Ахава» и «в глазах Яхве». Синтаксис сделан плавным и доступным, без конфессиональных добавлений.
