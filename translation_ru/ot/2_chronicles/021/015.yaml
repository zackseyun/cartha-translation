  text: וְ/אַתָּ֛ה בָּ/חֳלָיִ֥ים רַבִּ֖ים בְּ/מַחֲלֵ֣ה מֵעֶ֑י/ךָ עַד יֵצְא֤וּ מֵעֶ֨י/ךָ֙ מִן הַ/חֹ֔לִי יָמִ֖ים עַל יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: ru
  text: А ты будешь страдать от многих болезней и от заболевания твоих внутренних органов, пока из-за этой болезни твои внутренности не выйдут наружу — изо дня в день[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дни за днями»; то есть изо дня в день или на протяжении многих дней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: А ты
  rationale: Самостоятельное местоимение подчёркивает переход непосредственно к Иораму; русское «А ты» естественно передаёт этот контрастный акцент.
- source_word: בָּחֳלָיִם רַבִּים
  choice: будешь страдать от многих недугов
  rationale: Глагол подразумевается из контекста; такая передача естественна по-русски и сохраняет множественное число и значение болезненного состояния.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: в том числе от болезни внутренних органов
  rationale: Второе сочетание с בְּ уточняет общее упоминание многих недугов. «Внутренние органы» сохраняет более широкий диапазон מֵעֶה, не сужая его без необходимости до кишечника.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: пока ... твои внутренности не выйдут наружу
  rationale: Сохранено прямое и тяжёлое описание исхода болезни; «выйдут наружу» ясно передаёт יֵצְאוּ без смягчения.
- source_word: מִן הַחֹלִי
  choice: из-за этой болезни
  rationale: 'Предлог מִן здесь выражает причину: внутренности выходят вследствие болезни.'
- source_word: יָמִים עַל יָמִים
  choice: изо дня в день
  rationale: Естественная русская идиома, передающая продолжительность и последовательность дней, выраженные буквальным «дни на дни».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет достоинство пророческой речи, не смягчая её телесно тяжёлого образа. Уточняющее «в том числе» делает связь двух еврейских предложных сочетаний прозрачной для обычного читателя.
