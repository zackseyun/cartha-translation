  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: ru
  text: Но Яхве не пожелал погубить дом Давида ради завета, который Он заключил с Давидом, — как и сказал, что даст Давиду и его сыновьям светильник[a] на все времена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свет». Здесь светильник, вероятно, служит образом продолжения рода и царской власти Давида.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во все дни»; это выражение также можно перевести «всегда» или, по смыслу, «навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Но ... не пожелал
  rationale: Глагол אָבָה выражает волю или согласие; «не пожелал» передаёт волевой оттенок, а «но» естественно обозначает противопоставление предшествующему рассказу о суде.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לְהַשְׁחִית
  choice: погубить
  rationale: В данном контексте каузативная форма означает довести дом Давида до гибели; «погубить» звучит естественно и уместно в повествовании о династии.
- source_word: בֵּית דָּוִיד
  choice: дом Давида
  rationale: Сохранена библейская династическая идиома без поясняющей замены на «династию».
- source_word: לְמַעַן הַבְּרִית
  choice: ради завета
  rationale: «Ради» передаёт основание и побуждающую причину, выраженные לְמַעַן, и естественно сочетается с «заветом».
- source_word: כָּרַת לְדָוִיד
  choice: заключил с Давидом
  rationale: Еврейская идиома «рассекать завет» в современном русском нормативно передаётся как «заключать завет»; отношение к Давиду естественно выражено предлогом «с».
- source_word: וְכַאֲשֶׁר אָמַר
  choice: и потому, что Он сказал
  rationale: Формулировка сохраняет ссылку на ранее произнесённое Божье слово и связывает её с причиной отказа погубить дом Давида, не заменяя «сказал» более толковательным «обещал».
- source_word: לָתֵת לוֹ נִיר וּלְבָנָיו
  choice: что даст ему и его сыновьям светильник
  rationale: «Светильник» сохраняет династическую метафору נִיר, а «ему и его сыновьям» ясно передаёт обоих названных получателей, не разворачивая образ в толкование о династии.
- source_word: כָּל הַיָּמִים
  choice: на все дни
  rationale: Сохранено буквальное временное выражение, способное обозначать постоянную длительность, без однозначного усиления до «навеки».
theological_decisions:
- issue: Династическая метафора נִיר в контексте завета с Давидом
  choice: светильник
  alternative: свет; продолжение династии
  rationale: Предметный образ сохранён в основном тексте, поскольку он обозначает продолжение рода и царской власти Давида, но не сводится в самом стихе к отвлечённому понятию.
- issue: Длительность выражения כָּל הַיָּמִים
  choice: на все дни
  alternative: навеки; всегда
  rationale: Более буквальная передача сохраняет потенциальную напряжённость между конкретным продолжением династии и более сильным прочтением вечного обещания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены ключевые образы «дом Давида», «завет» и «светильник»; местоимение «Он» написано с прописной буквы по принятой русской религиозной издательской норме.
