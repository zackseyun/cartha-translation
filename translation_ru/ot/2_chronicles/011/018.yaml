base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: ru
  text: Ровоам взял себе в жёны Махалафу, дочь Иеримофа, сына Давида, и дочь Авихаили, дочери Елиава, сына Иессея.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская родословная изложена сжато и синтаксически трудна. Буквально в тексте после имени Махалафы стоит «сын Иеримофа, сына Давида», хотя по смыслу здесь ожидается обозначение дочери; далее: «Авихаиль, дочь Елиава, сына Иессея». Вероятнее всего, Махалафа происходила из обеих названных линий. Некоторые понимают Авихаиль как второе имя в семейной записи или, менее вероятно, как вторую жену Ровоама.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: взял себе в жёны
  rationale: Передаёт еврейскую брачную формулу близко к оригиналу и при этом естественно звучит по-русски; «женился на» было бы несколько более истолковывающим.
- source_word: מָחֲלַת
  choice: Махалафу
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в винительный падеж.
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: дочь Иеримофа, сына Давида
  rationale: Первое בן буквально означает «сын», однако в сжатой и синтаксически трудной родословной связи речь, вероятнее всего, идёт о происхождении Махалафы от Иеримофа; смысловой перевод отражает наиболее связное прочтение, а формальная трудность отмечена в сноске.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: и Авихаили, дочери Елиава, сына Иессея
  rationale: Авихаиль понимается как мать Махалафы и вторая линия её происхождения. Русский родительный падеж связывает имя с существительным «дочь», не устраняя отмеченную в сноске неоднозначность исходной конструкции.
theological_decisions:
- issue: Синтаксическая связь имён в родословии
  choice: Названа одна жена — Махалафа, дочь Иеримофа и Авихаили; приведены отцовская и материнская линии её происхождения.
  alternative: Авихаиль — второе имя в семейной записи либо вторая жена Ровоама.
  rationale: Единственное число אִשָּׁה («жену») и наиболее связное понимание сжатой родословной поддерживают прочтение с одной женой. Поскольку еврейская конструкция необычна, альтернативы не исключаются молча, а указываются в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Традиционные формы библейских имён сохранены; сложная родословная сделана читаемой, а подлинная неоднозначность еврейского текста вынесена в сноску.
