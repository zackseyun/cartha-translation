    rationale: В конструкции «взял ... Махалафу ... и Авихаили» союз «и» соединяет два имени в винительном падеже. Это противоречит принятому в переводе пониманию, что Авихаиль — мать Махалафы, и не сохраняет обозначенную сноской неоднозначность.
