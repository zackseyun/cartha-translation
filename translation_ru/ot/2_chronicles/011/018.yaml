  verdict: revise
  source_fidelity: Основное понимание — одна жена, Махалафа, с отцовской линией от Иеримофа и материнской от Авихаили — является наиболее связным для данного трудного еврейского синтаксиса и согласуется с единственным числом «жену». Однако нынешняя русская пунктуация и падежная связь после «и» читаются как два прямых дополнения («Махалафу ... и Авихаили»), то есть как две жены. Кроме того, сноска должна прямо сообщать, что в еврейском тексте при Иеримофе стоит мужская форма «сын», а не только приводить эту форму в неясной буквальной цитате.
  naturalness: «Взял себе в жёны» естественно для современного литературного библейского регистра. Повтор слова «дочь» в исправленном тексте устраняет ложное впечатление, будто Авихаиль — вторая жена, и делает родословную читаемой.
  terminology: Имена «Ровоам», «Махалафа», «Иеримоф», «Авихаиль», «Елиав» и «Иессей» переданы последовательно в традиционной русской библейской форме. Богословских терминов в стихе нет.
