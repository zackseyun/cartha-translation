base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: ru
  text: После неё он взял в жёны Мааху, дочь Авессалома[a], и она родила ему Авию, Аттая, Зизу и Шеломифь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дочь Авессалома». В родословиях слово «дочь» иногда может обозначать и более отдалённую потомицу; поэтому некоторые понимают здесь: «внучка Авессалома».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: После неё
  rationale: Предлог «после» с суффиксом 3-го лица женского рода отсылает к ранее упомянутой жене; буквальный смысл и референция сохранены.
- source_word: לָקַח
  choice: взял
  rationale: Сохранено основное значение глагола; в данном брачном контексте выражение естественно понимается как «взял в жёны», но перевод не делает подразумеваемое значение явным.
- source_word: מַעֲכָה
  choice: Мааху
  rationale: Личное имя передано традиционной русской библейской формой и поставлено в винительный падеж по синтаксису предложения.
- source_word: בַּת אַבְשָׁלוֹם
  choice: дочь Авессалома
  rationale: Конструкция буквально означает «дочь Авессалома»; в основном тексте сохранено прямое обозначение родства.
- source_word: וַתֵּלֶד לוֹ
  choice: и она родила ему
  rationale: Естественная русская передача глагола ילד с косвенным дополнением, сохраняющая указание на отцовство.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: Авию, Аттая, Зизу и Шеломифь
  rationale: Личные имена переданы принятыми русскими библейскими формами; повторяющийся показатель прямого дополнения отдельно не переводится.
theological_decisions:
- issue: Родственное обозначение Маахи как «дочери Авессалома»
  choice: В основном тексте сохранено буквальное «дочь Авессалома».
  alternative: «внучка Авессалома» или «потомок Авессалома»
  rationale: Еврейский текст прямо употребляет слово «дочь», хотя в родословном употреблении оно иногда может обозначать более отдалённого потомка женского пола. Возможная широта значения отмечена в сноске без устранения неоднозначности в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и понятен; традиционные русские формы личных имён сохранены.
