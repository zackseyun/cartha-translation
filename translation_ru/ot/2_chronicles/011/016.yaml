  source_fidelity: 'Смысл в целом передан верно: последовательность «вслед за ними», охват всех колен, целенаправленное искание Яхве, приход в Иерусалим и жертвоприношение Яхве, Богу их отцов, сохранены. Однако оборот «всем сердцем стремился искать» стилистически тяжеловесен и лишь не вполне удачно передаёт еврейскую идиому «отдавать своё сердце, чтобы искать».'
