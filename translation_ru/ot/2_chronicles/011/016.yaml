base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: ru
  text: А вслед за ними из всех колен Израиля пришли в Иерусалим и те, кто всем сердцем решил искать Яхве[a], Бога Израиля, чтобы принести жертвы Яхве, Богу своих отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто отдавали (или направляли) своё сердце, чтобы искать Яхве»; это выражение означает твёрдо направить к Нему свою волю и желание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отправились в Иерусалим». Еврейский глагол בוא может означать как «прийти», так и «пойти» — в зависимости от точки зрения повествователя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: А вслед за ними
  rationale: Сохраняет соединительный וְ и последовательность по отношению к людям, упомянутым в предыдущем стихе.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: из всех колен Израиля
  rationale: Предлог מִן указывает на происхождение, а כֹּל сохраняет охват всех израильских колен.
- source_word: הַנֹּתְנִים אֶת לְבָבָם לְבַקֵּשׁ
  choice: те, кто всем сердцем стремился искать
  rationale: Еврейская идиома буквально говорит о людях, «отдающих/направляющих своё сердце»; русский оборот передаёт осознанную внутреннюю решимость без неестественной буквальности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: пришли в Иерусалим
  rationale: בוא допускает значения «прийти» и «пойти» в зависимости от точки зрения; «пришли» соответствует повествовательному фокусу на Иерусалиме.
- source_word: לִזְבּוֹחַ
  choice: чтобы принести жертвы
  rationale: Инфинитив с לְ выражает цель; множественное «жертвы» естественно передаёт культовое действие глагола זבח.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Богу своих отцов
  rationale: Сохраняет мужское множественное אֲבוֹתֵיהֶם и традиционную формулу преемственности веры.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Передача אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Богу своих отцов
  alternative: Богу своих предков
  rationale: «Отцов» точнее сохраняет грамматически мужскую и традиционную заветную формулу оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность исходного текста, но избегает буквального и неестественного оборота «дали своё сердце».
