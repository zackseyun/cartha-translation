  rationale: Перестроен порядок слов для естественного русского синтаксиса, а выражение «всем сердцем стремился искать» заменено на более ясное «всем сердцем решил искать». Сохранены последовательность повествования, всеобъемлющий охват колен, имя Яхве, цель прихода и формула «Бог своих отцов». Сноска о варианте «отправились» перенесена к «Иерусалим», поскольку относится к глаголу בָּאוּ («пришли/пошли»), а не к слову «Яхве».
