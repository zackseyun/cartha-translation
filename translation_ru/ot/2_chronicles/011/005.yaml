  text: וַ/יֵּ֥שֶׁב רְחַבְעָ֖ם בִּ/ירוּשָׁלִָ֑ם וַ/יִּ֧בֶן עָרִ֛ים לְ/מָצ֖וֹר בִּ/יהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: ru
  text: Ровоам жил в Иерусалиме и построил в Иудее города для обороны[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укреплённые города»; или: «города-крепости». Буквально: «города для укрепления (обороны)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: жил
  rationale: Глагол יָשַׁב может означать «сидеть, жить, пребывать». В данном повествовательном контексте современное русское «жил» естественно передаёт пребывание Ровоама в Иерусалиме, не добавляя значения нового заселения.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места; название передано в принятой русской библейской форме.
- source_word: וַיִּבֶן
  choice: построил
  rationale: בנה означает «строить». Оборонительное назначение выражено последующим לְמָצוֹר, поэтому не следует заменять сам глагол на «укрепил».
- source_word: עָרִים
  choice: города
  rationale: Обычное соответствие множественному числу עִיר; оно уместно в военно-административном контексте книги Паралипоменон.
- source_word: לְמָצוֹר
  choice: для обороны
  rationale: Предлог לְ указывает здесь на назначение, а מָצוֹר связано с укреплением, крепостью и осадной обороной. Выражение «для обороны» сохраняет целевую конструкцию оригинала и не превращает её без оговорки в прилагательное «укреплённые».
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Прямое обозначение области, где были построены города.
