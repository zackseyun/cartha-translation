  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: ru
  text: И священники и левиты, жившие по всему Израилю, со всех своих земель встали на его сторону[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предстали перед ним» или «явились к нему». Еврейское выражение может обозначать как явление к Ровоаму, так и переход на его сторону; контекст скорее указывает на поддержку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  choice: И священники
  rationale: Союз и определённое существительное во множественном числе переданы с сохранением повествовательной связи; в русском языке определённость выражается контекстом.
- source_word: וְהַלְוִיִּם
  choice: и левиты
  rationale: Стандартное русское обозначение левитского сословия сохраняет координацию двух групп.
- source_word: אֲשֶׁר בְּכָל־יִשְׂרָאֵל
  choice: жившие по всему Израилю
  rationale: Причастный оборот естественно передаёт относительное предложение и указывает на расселение этих священников и левитов по всей территории Израиля.
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: встали на его сторону
  rationale: Сочетание формы хитпаэль глагола יצב с עָלָיו допускает буквальное представление о том, что они предстали или встали перед ним, но контекст прежде всего указывает на сознательное присоединение к Ровоаму.
- source_word: מִכָּל גְּבוּלָם
  choice: из всех своих областей
  rationale: גְּבוּל здесь обозначает не только границу, но территорию или область; множественное число с местоименным суффиксом относится к местам их проживания.
theological_decisions:
- issue: Характер отношения священников и левитов к Ровоаму
  choice: встали на его сторону
  alternative: предстали перед ним; собрались к нему
  rationale: Перевод передаёт вероятный контекстуальный смысл лояльности, но примечание сохраняет неоднозначность еврейского оборота и не превращает её в догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. «По всему Израилю» естественно передаёт географический охват, а «из всех своих областей» сохраняет территориальный смысл גְּבוּלָם. Неоднозначность ключевой идиомы отмечена в сноске.
