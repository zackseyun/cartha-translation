  source_fidelity: Основной перевод верно передаёт группы, их присутствие по всему Израилю, территориальное происхождение и вероятный контекстуальный смысл הִתְיַצְּבוּ עָלָיו — присоединение к Ровоаму. Однако этот еврейский оборот допускает более буквальное значение «предстали/явились к нему», поэтому альтернативу следует формулировать точнее. «Со всех своих земель» яснее передаёт מִכָּל־גְּבוּלָם как территории, а не административные области.
