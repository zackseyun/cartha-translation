base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: ru
  text: Он укрепил крепости, поставил в них начальников и снабдил их запасами[a] продовольствия, масла и вина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранилищами продовольствия, масла и вина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: укрепил
  rationale: Порода пиэль глагола חזק выражает действие по усилению и обеспечению прочности; «укрепил» естественно передаёт это значение.
- source_word: הַמְּצֻרוֹת
  choice: эти крепости
  rationale: Существительное обозначает укреплённые места или опорные пункты; в данном военно-административном контексте краткое «крепости» звучит естественно. Определённый артикль соотносит их с ранее названными укреплёнными городами.
- source_word: וַיִּתֵּן בָּהֶם
  choice: и поставил в них
  rationale: נתן с предлогом ב передаёт размещение или назначение лиц внутри крепостей; «поставил в них» сохраняет как пространственный, так и должностной оттенок.
- source_word: נְגִידִים
  choice: начальников
  rationale: נָגִיד обозначает руководителя, правителя или должностное лицо. «Начальники» подходит военно-административному контексту, не уточняя звание сверх текста.
- source_word: וְאֹצְרוֹת
  choice: а также устроил запасы
  rationale: אֹצָרוֹת допускает значения хранилищ и хранимых запасов. При перечислении продовольствия, масла и вина «устроил запасы» естественно выражает снабжение крепостей, сохраняя смысловую неоднозначность без ненужной буквальности.
- source_word: מַאֲכָל
  choice: продовольствия
  rationale: В контексте снабжения укреплений «продовольствие» точнее передаёт пищевые припасы, чем общее «пища».
- source_word: שֶׁמֶן
  choice: масла
  rationale: Обычное соответствие שֶׁמֶן; вероятно, имеется в виду оливковое масло, но исходный текст этого здесь не уточняет.
- source_word: יָיִן
  choice: вина
  rationale: Прямое и обычное соответствие יָיִן.
