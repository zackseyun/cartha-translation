    rationale: Слово может обозначать как запасённые припасы, так и хранилища/склады; основной перевод может выбрать «запасы», но альтернативу следует вынести в сноску.
  revised_text: Он укрепил крепости, поставил в них начальников и снабдил их запасами[a] продовольствия, масла и вина.
