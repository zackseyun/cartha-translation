source:
  edition: WLC
  text: וְ/אֶת צָרְעָה֙ וְ/אֶת אַיָּל֔וֹן וְ/אֶת חֶבְר֔וֹן אֲשֶׁ֥ר בִּ/יהוּדָ֖ה וּ/בְ/בִנְיָמִ֑ן עָרֵ֖י מְצֻרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/010.yaml
  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: ru
  text: а также Цору, Аялон и Хеврон, что в Иудее и Вениамине, — укреплённые города.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: Цора
  rationale: Название передано в традиционной русской библейской форме, соответствующей еврейскому топониму.
- source_word: אַיָּלוֹן
  choice: Аялон
  rationale: Транслитерация еврейского топонима в естественной для современного русского форме.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Сохранена общепринятая русская библейская форма названия.
- source_word: אֲשֶׁר
  choice: что
  rationale: Относительное слово естественно вводит пояснение о местонахождении перечисленных городов без добавления отсутствующего в еврейском тексте времени глагола.
- source_word: בִּיהוּדָה וּבְבִנְיָמִן
  choice: в Иудее и Вениамине
  rationale: Передано географическое или племенное местонахождение; повтор предлога в русском необязателен и утяжелил бы фразу.
- source_word: עָרֵי מְצֻרוֹת
  choice: укреплённые города
  rationale: Обычное и точное русское обозначение городов, снабжённых оборонительными укреплениями.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: а также …, … и …
  rationale: Конструкция продолжает перечень из предыдущих стихов; по-русски это естественно выражается вводным «а также» и обычным перечислением.
theological_decisions:
- issue: Объём заключительного определения עָרֵי מְצֻרוֹת
  choice: Тире представляет слова «укреплённые города» как итоговое приложение к перечню.
  alternative: Связать определение только с Цорой, Аялоном и Хевроном либо передать простой запятой.
  rationale: Еврейский синтаксис допускает приложение, а контекст стихов 5–10 позволяет понимать выражение как итоговую характеристику перечисленных городов. Тире обозначает итоговый характер, не делая объём определения догматически однозначным.
translation_notes:
  register: Современный литературный русский; фраза сохраняет характер продолжения перечня из предыдущего стиха. Топонимы переданы в привычных русских библейских формах, синтаксис остаётся сжатым и достойным.
