base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Не выступайте и не сражайтесь со своими братьями[a]. Пусть каждый вернётся в свой дом, потому что это произошло от Меня[b]». Они послушались слов Яхве и повернули назад, не пойдя против Иеровоама[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с вашими братьями»; речь идёт о других израильтянах, против которых они собирались воевать.'
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «потому что это дело — от Меня».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не пойдя к Иеровоаму»; военный контекст указывает на поход против него.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет торжественную пророческую формулу в естественной для современного русского языка форме; личное имя יְהוָה передано как «Яхве».
- source_word: לֹא תַעֲלוּ
  choice: Не выступайте
  rationale: Глагол עלה буквально означает «подниматься, идти вверх», но здесь обозначает военное выступление. «Не выступайте» ясно передаёт контекст, не добавляя самого сражения, названного следующим глаголом.
- source_word: וְלֹא תִלָּחֲמוּ עִם אֲחֵיכֶם
  choice: и не сражайтесь со своими братьями
  rationale: Nifal от לחם означает вступать в сражение; עִם в данном контексте указывает на противоборствующую сторону. «Братьями» сохраняет подчёркнутое в еврейском тексте родство между израильтянами.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Пусть каждый вернётся в свой дом
  rationale: Передаёт повеление и распределительное употребление אִישׁ («каждый») естественно и без ненужной гендерной тяжеловесности.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: потому что это произошло от Меня
  rationale: Сохраняет прямое отнесение случившегося к Богу, не уточняя сверх текста, идёт ли речь о причинении, установлении или допущении.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: Они послушались слов Яхве
  rationale: שׁמע допускает значения «услышать» и «послушаться»; последующее возвращение показывает, что здесь имеется в виду действенное повиновение.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: и повернули назад, не пойдя против Иеровоама
  rationale: Передаёт прекращение движения к Иеровоаму; «против» следует из военного контекста, тогда как буквально предлог אֶל означает направление «к».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» показывает, что в исходном тексте стоит личное имя Бога, и не подменяет его титулом.
- issue: Божественная причинность в מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: это произошло от Меня
  alternative: это дело — от Меня; это случилось по Моей воле
  rationale: Выбранная формулировка сохраняет утверждение об исходящей от Бога причине или установлении, но не разрешает шире заложенную в еврейской фразе напряжённость между действием, предопределением и допущением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Военная идиома передана естественно («выступайте», «против»), а образ родства сохранён. Местоимение «Меня» написано с прописной буквы как элемент принятого русского благоговейного регистра.
