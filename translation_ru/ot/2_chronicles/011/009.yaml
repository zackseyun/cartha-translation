lexical_decisions:
- source_word: אֲדוֹרַיִם
  choice: Адораим
  rationale: Географическое название передано принятой русской библейской формой; форма винительного падежа совпадает с именительным.
- source_word: לָכִישׁ
  choice: Лахис
  rationale: Географическое название передано принятой русской библейской формой; оно является однородным дополнением к глаголу «укрепил» из предыдущего стиха.
- source_word: עֲזֵקָה
  choice: Азеку
  rationale: Географическое название передано принятой русской библейской формой «Азека» и поставлено в винительный падеж согласно синтаксической связи с глаголом из предыдущего стиха.
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: Адораим, Лахис и Азеку
  rationale: Непереводимый непосредственно показатель определённого прямого дополнения опущен; повтор союзов перед каждым названием передан естественным для русского перечислением, а его стилистическая особенность отмечена в сноске.
