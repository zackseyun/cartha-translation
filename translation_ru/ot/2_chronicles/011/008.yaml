lexical_decisions:
- source_word: וְאֶת
  choice: не переводится отдельно; передано структурой перечисления и союзом «и»
  rationale: Частица אֵת обозначает определённое прямое дополнение, а וְ связывает элементы ряда. В русском языке отдельный показатель прямого дополнения здесь не требуется; винительный падеж выражен формами названий, а связь — перечислением и союзом «и».
- source_word: גַּת
  choice: Гат
  rationale: Собственное географическое название передано в традиционной русской библейской форме; при управлении подразумеваемого глагола сохраняется неизменяемая форма.
- source_word: מָרֵשָׁה
  choice: Марешу
  rationale: Собственное географическое название «Мареша» поставлено в винительном падеже, поскольку стих продолжает перечень городов, укреплённых Ровоамом.
- source_word: זִיף
  choice: Зиф
  rationale: Собственное географическое название передано в традиционной русской библейской форме; мужское название имеет форму винительного падежа, совпадающую с именительным.
