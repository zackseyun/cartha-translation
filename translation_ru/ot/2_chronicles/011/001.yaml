source:
  edition: WLC
  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: ru
  text: Придя в Иерусалим, Ровоам собрал дом Иуды и Вениамина[a] — сто восемьдесят тысяч отборных воинов[b], — чтобы сразиться с Израилем и вернуть царство Ровоаму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть племенное и политическое сообщество Иуды и Вениамина; буквально: «дом Иуды и Вениамина».'
    reason: Поясняет корпоративное значение еврейского выражения и его необычную для современного русского языка форму.
  - marker: b
    text: 'Или: «избранных мужчин, способных воевать».'
    reason: Сохраняет возможное более буквальное прочтение сочетания בָּחוּר עֹשֵׂה מִלְחָמָה.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: придя
  rationale: Форма глагола בוא обозначает прибытие в Иерусалим; деепричастная конструкция естественно передаёт последовательность связанных действий.
- source_word: וַיַּקְהֵל
  choice: собрал
  rationale: Hифиль от קהל означает собрать или созвать людей; в данном контексте речь идёт о военном сборе.
- source_word: אֶת־בֵּית יְהוּדָה וּבִנְיָמִן
  choice: дом Иуды и Вениамина
  rationale: Сохранён корпоративный смысл слова בֵּית, обозначающего племенное и политическое сообщество южного царства, без сведения выражения лишь к отдельным людям.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: сто восемьдесят тысяч
  rationale: Прямое и естественное воспроизведение еврейского числительного.
- source_word: בָּחוּר
  choice: отборных
  rationale: В военном контексте слово обозначает избранных, отборных людей, а не обязательно только молодых мужчин.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: воинов
  rationale: Буквально «ведущих войну»; слово «воины» кратко и естественно передаёт военную пригодность и функцию этих людей.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: чтобы сразиться с Израилем
  rationale: Контекст ясно указывает на враждебное столкновение; русское «сразиться с» сохраняет значение предлога עִם и не допускает понимания совместного действия.
- source_word: לְהָשִׁיב אֶת־הַמַּמְלָכָה
  choice: вернуть царство
  rationale: Hифиль от שוב выражает возвращение царства прежнему правителю; «вернуть» точно и естественно передаёт причинное значение.
- source_word: לִרְחַבְעָם
  choice: Ровоаму
  rationale: Дательный падеж передаёт получателя, к которому должно было вернуться царство, и сохраняет названное в тексте третье лицо.
theological_decisions:
- issue: Значение названия «Израиль» после разделения царства
  choice: Сохранено «Израиль» без поясняющего дополнения.
  alternative: «северные племена» или «северное царство»
  rationale: В еврейском тексте противостоящая политическая общность прямо названа Израилем; замена истолковывающим обозначением сузила бы терминологию Летописца.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Корпоративное выражение «дом Иуды и Вениамина» сохранено ради точности и снабжено пояснением; военная формула передана естественным словом «воины».
