  source_fidelity: 'Перевод в целом верно передаёт административный смысл стиха, географическое размещение сыновей, снабжение продовольствием и поиск жён. Однако в основном тексте утрачена возможная партитивность מִכָּל בָּנָיו («из всех его сыновей»): формулировка «распределил своих сыновей» может означать, что были распределены все сыновья. Кроме того, «подыскал» несколько сильнее еврейского וַיִּשְׁאַל, который буквально выражает просьбу/поиск и не обязательно сообщает об успешном результате.'
