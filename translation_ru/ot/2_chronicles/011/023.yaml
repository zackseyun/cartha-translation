base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: ru
  text: И он поступил разумно[a] и распределил некоторых из своих сыновей[b] по всем областям Иуды и Вениамина — по всем укреплённым городам. Он снабдил их продовольствием в изобилии и искал для них множество жён[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проявил рассудительность»; буквально также возможно: «понял».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение буквально: «из всех его сыновей». Оно может указывать, что для размещения были выбраны некоторые сыновья из общего числа; также оно описывает их рассредоточение или размещение по укреплённым городам.'
    reason: lexical_alternative
  - marker: c
    text: 'Вероятно, речь идёт об устройстве браков сыновей; буквально: «и искал множество жён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: поступил разумно
  rationale: Форма от בין здесь обозначает проявление понимания или рассудительности в практических действиях. Такой перевод естественно передаёт смысл в контексте царского управления.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: распределил своих сыновей
  rationale: פרץ в данном контексте указывает на рассредоточение по различным местам, а последующее перечисление областей и укреплённых городов показывает целенаправленное размещение, а не беспорядочное рассеяние. Предлог מן допускает понимание «из числа всех его сыновей», но по-русски это без уточнения звучит неестественно.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: по всем областям Иуды и Вениамина
  rationale: Множественное число אֲרָצוֹת здесь обозначает территории или области внутри Иуды и Вениамина, а не отдельные страны.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: по всем укреплённым городам
  rationale: מְצֻרוֹת обозначает укреплённые города или города-крепости; выбранный вариант точен и естествен в современном русском языке.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: снабдил их продовольствием в изобилии
  rationale: מָזוֹן — пища, пропитание или продовольственные запасы; глагол «снабдил» хорошо передаёт административный характер действия, а לָרֹב — изобилие.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: подыскал им множество жён
  rationale: שׁאל буквально означает «просить, искать». В контексте заботы о сыновьях речь, вероятнее всего, идёт об устройстве их браков. Местоимение «им» восстановлено из ближайшего контекста.
