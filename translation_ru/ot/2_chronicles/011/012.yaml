  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: ru
  text: В каждом городе он разместил щиты и копья[a] и чрезвычайно укрепил эти города. Иудея и Вениамин были под его властью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в каждом городе и городе» — еврейское повторение подчёркивает, что речь идёт о каждом городе без исключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר
  choice: В каждом городе
  rationale: Повторение עִיר וָעִיר имеет распределительное значение и подчёркивает каждый отдельный город. В современном русском это естественно передаётся выражением «в каждом городе»; особенность еврейской формы отмечена в сноске.
- source_word: צִנּוֹת
  choice: щиты
  rationale: Слово обозначает щиты, возможно большие щиты; нейтральное «щиты» точно и не вносит невыраженной детализации.
- source_word: וּרְמָחִים
  choice: копья
  rationale: Обычный современный эквивалент названия данного вида древкового оружия.
- source_word: וַיְחַזְּקֵם
  choice: сделал эти города чрезвычайно крепкими
  rationale: Местоименный суффикс мужского рода множественного числа наиболее естественно относится к укреплённым городам из контекста. Передача через «сделал... крепкими» сохраняет значение חזק и по-русски яснее, чем буквальное «укрепил их», при котором референт мог бы быть неясен.
- source_word: לְהַרְבֵּה מְאֹד
  choice: чрезвычайно
  rationale: Передаёт сильное усиление действия, выраженное сочетанием инфинитива с מְאֹד, естественным литературным русским языком.
- source_word: וַיְהִי לוֹ יְהוּדָה וּבִנְיָמִן
  choice: Иудея и Вениамин оставались под его властью
  rationale: Конструкция היה ל выражает принадлежность или подвластность. В контексте царства речь идёт о политической власти Ровоама; «оставались» естественно отражает итоговое состояние, не превращая племена в личную собственность.
theological_decisions:
- issue: Характер принадлежности Иудеи и Вениамина Ровоаму
  choice: оставались под его властью
  alternative: принадлежали ему
  rationale: Политическая формулировка соответствует контексту царского правления и сохраняет смысл еврейской конструкции, избегая ненужного оттенка личной собственности.
