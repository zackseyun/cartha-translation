  yaml_path: translation/ot/2_chronicles/011/019.yaml
  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: ru
  text: 'И она родила ему сыновей: Иеуша, Шемарию и Загама.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: И она родила
  rationale: Последовательная форма глагола ילד продолжает повествование; «родила» естественно и точно передаёт действие и женский субъект.
- source_word: לוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом в формуле рождения указывает на отца; русское «родила ему» сохраняет структуру и звучит естественно.
- source_word: בָּנִים
  choice: сыновей
  rationale: Еврейское слово прямо обозначает сыновей, что подтверждается перечислением трёх мужских имён.
- source_word: יְעוּשׁ
  choice: Иеуша
  rationale: Имя передано в принятой русской библейской форме; винительный падеж обусловлен синтаксисом перечисления после глагола «родила».
- source_word: שְׁמַרְיָה
  choice: Шемарию
  rationale: Форма отражает еврейское שְׁמַרְיָה и передана по-русски с необходимым винительным падежом.
- source_word: זָהַם
  choice: Захама
  rationale: Имя транслитерировано непосредственно и поставлено в винительный падеж.
