  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: ru
  text: Ровоам любил Мааху, дочь Авессалома[a], сильнее, чем любую из своих жён и наложниц, ибо он взял восемнадцать жён и шестьдесят наложниц; у него было двадцать восемь сыновей и шестьдесят дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно, «потомка Авессалома»: еврейское слово «дочь» в родословиях иногда употребляется в более широком смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: любил
  rationale: Глагол אהב прямо обозначает любовь или привязанность; сравнительное значение выражено последующим מִכָּל («больше всех»).
- source_word: בַת אַבְשָׁלוֹם
  choice: дочь Авессалома
  rationale: בַת обычно означает «дочь». Возможное более широкое родословное значение сохранено в сноске, а не внесено в основной текст.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: больше всех своих жён и наложниц
  rationale: מִכָּל выражает сравнение; «жёны» и «наложницы» передают две различные социальные категории исходного текста.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит поясняющие сведения; «ведь» естественно передаёт эту связь в современном русском повествовании.
- source_word: נָשִׁים ... נָשָׂא
  choice: взял восемнадцать жён
  rationale: Сочетание נשא с נשים означает взять женщин в жёны. Формулировка сохраняет образ исходного текста и естественна по-русски.
- source_word: פִּילַגְשִׁים
  choice: наложницы
  rationale: Точный традиционный русский эквивалент, сохраняющий отличие от полноправных жён.
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Причинная форма ילד при подлежащем-мужчине означает «произвёл на свет, стал отцом»; выбран современный и достойный русский оборот без архаизма «родил» или «породил».
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: двадцати восьми сыновей
  rationale: Прямое и естественное воспроизведение числительного и существительного с падежным согласованием после оборота «стал отцом».
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: шестидесяти дочерей
  rationale: Прямой перевод числового сочетания с требуемым русским падежным согласованием.
theological_decisions:
- issue: Родословное обозначение Маахи как «дочери Авессалома»
  choice: В основном тексте сохранено буквальное «дочь Авессалома».
  alternative: «потомок Авессалома» или, конкретнее, «внучка Авессалома»
  rationale: Еврейское בַת прежде всего означает «дочь», но в родословном контексте может употребляться шире. Перевод не разрешает эту неоднозначность без достаточных оснований; возможное широкое понимание отмечено в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Имена переданы в привычной русской библейской форме: Ровоам, Мааха, Авессалом. Синтаксис сделан ясным для широкого читателя без устранения родословной неоднозначности.'
