lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Стандартная русская формула повествовательного перехода, близко передающая וַיְהִי без добавления явно противительного смысла.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и конструктивную связь существительных.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: שְׁמַעְיָהוּ
  choice: Шемаии
  rationale: Имя передано принятой русской библейской формой в дательном падеже после предлога к.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человеку Божьему
  rationale: Естественная и узнаваемая русская передача обозначения пророческого служителя; определённость в контексте выражена приложением к имени.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В русском языке двоеточие естественно вводит следующую прямую речь и функционально передаёт еврейское לֵאמֹר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Статус выражения אִישׁ הָאֱלֹהִים
  choice: человеку Божьему
  alternative: Божьему человеку; мужу Божьему
  rationale: Выбрана современная литературная и традиционно узнаваемая формулировка без внесения дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой библейской пророческой формулы. Архаическое «муж Божий» заменено на понятное современному читателю «человек Божий»; לֵאמֹר передано пунктуационно.
