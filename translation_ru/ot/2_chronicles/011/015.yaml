  text: וַ/יַּֽעֲמֶד ל/וֹ֙ כֹּֽהֲנִ֔ים לַ/בָּמ֖וֹת וְ/לַ/שְּׂעִירִ֑ים וְ/לָ/עֲגָלִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: ru
  text: Он назначил себе священников для святилищ на высотах, для козлоподобных демонов[a] и для тельцов, которых он сделал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «козлов» или «сатиров». Еврейское слово может обозначать козлообразных существ, связанных с недозволенным культом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: назначил
  rationale: В этой каузативной конструкции со священниками в качестве объекта глагол означает поставление или назначение на служение, а не просто физическое действие «поставил».
- source_word: לּוֹ
  choice: себе
  rationale: Дательный элемент указывает, что Иеровоам действовал в собственных интересах; русское возвратное местоимение естественно передаёт этот смысл.
- source_word: כֹּהֲנִים
  choice: священников
  rationale: Обычное русское обозначение служителей культа, соответствующее еврейскому термину.
- source_word: לַבָּמוֹת
  choice: для святилищ на высотах
  rationale: במות обозначает культовые места, часто расположенные на возвышенностях. Формулировка понятнее современному читателю, чем одно лишь «высоты», и сохраняет пространственно-культовый образ.
- source_word: לַשְּׂעִירִים
  choice: для козлоподобных демонов
  rationale: В контексте незаконного культа слово, вероятнее всего, обозначает козлообразных сверхъестественных существ или их изображения, а не обычных козлов. Перевод сохраняет образность еврейского слова, не отождествляя этих существ с каким-либо более узким мифологическим типом.
- source_word: וְלָעֲגָלִים
  choice: и для тельцов
  rationale: Существительное буквально означает тельцов; контекст ясно указывает, что речь идёт о культовых изображениях, поэтому добавлять слово «идолы» в основной текст не требуется.
- source_word: אֲשֶׁר עָשָׂה
  choice: которых он сделал
  rationale: Относительное придаточное естественно относится к непосредственно предшествующим «тельцам» и передаёт личное действие Иеровоама без ненужного временного уточнения.
theological_decisions:
- issue: Значение שְׂעִירִים в контексте незаконного культа
  choice: козлоподобные демоны
  alternative: козлы; сатиры
  rationale: Перечень культовых мест и объектов делает демонический или идольский смысл вероятнее буквального обозначения животных. При этом сноска сохраняет лексическую неоднозначность исходного слова.
- issue: Объём относительного оборота אֲשֶׁר עָשָׂה
  choice: отнести прежде всего к тельцам
  alternative: понимать как относящийся ко всем названным культовым объектам
  rationale: В русском, как и наиболее естественно в еврейском синтаксисе, оборот непосредственно следует за «тельцами». Перевод не расширяет его явно на святилища или демонов.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Выражение «святилища на высотах» разъясняет традиционное культовое понятие без громоздкой сноски; повтор предлога «для» сохраняет структуру перечня и подчёркивает назначение священников для каждого элемента культа.
