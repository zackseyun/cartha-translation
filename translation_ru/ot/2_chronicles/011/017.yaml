  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: ru
  text: Так они упрочили царство Иудеи и в течение трёх лет укрепляли Ровоама, сына Соломона, потому что в течение трёх лет следовали путём Давида и Соломона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: укрепили
  rationale: Пиэль от חזק означает «укреплять, делать прочным»; этот глагол естественно сочетается с «царством» и не сводит смысл к военному укреплению.
- source_word: מַלְכוּת יְהוּדָה
  choice: царство Иудеи
  rationale: В данном контексте מַלְכוּת обозначает политическое царство или царскую власть; «царство Иудеи» ясно и соответствует контексту.
- source_word: וַיְאַמְּצוּ
  choice: поддерживали
  rationale: Пиэль от אמץ означает «делать сильным, укреплять, поддерживать». При личном объекте «Ровоам» слово «поддерживали» естественно передаёт оказанное ему содействие, сохраняя отличие от предшествующего חזק.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Ровоама, сына Соломона
  rationale: Использованы традиционные русские формы имён; приложение обособлено по нормам современного русского языка.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: три года
  rationale: Сочетание с ל выражает продолжительность. Оба повторения сохранены, поскольку повтор присутствует в еврейском тексте и связывает период укрепления с периодом верности.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину описанного укрепления; причинное отношение выражено прямо.
- source_word: הָלְכוּ
  choice: следовали
  rationale: הלך в сочетании с «путём» описывает образ жизни и поведение. «Следовали путём» сохраняет метафору и звучит естественнее буквального «ходили путём».
- source_word: בְּדֶרֶךְ דָּוִיד וּשְׁלֹמֹה
  choice: путём Давида и Соломона
  rationale: Сохранено единственное число דֶּרֶךְ и не добавлено истолкование того, в чём именно состоял этот образ жизни.
theological_decisions:
- issue: Оценка «пути Давида и Соломона»
  choice: Сохранить образное выражение без поясняющего расширения.
  alternative: «были верны Господу, как Давид и Соломон»
  rationale: Текст положительно оценивает лишь указанный трёхлетний период и не утверждает всеобъемлющей или пожизненной праведности Давида и Соломона. Расширенный вариант внёс бы отсутствующее в стихе богословское уточнение.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повтор «три года» намеренно сохранён. Видовая форма «поддерживали» обозначает поддержку Ровоама на протяжении названного срока, тогда как «укрепили» естественно описывает достигнутый результат для царства.
