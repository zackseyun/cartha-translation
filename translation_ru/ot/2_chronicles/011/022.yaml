lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: поставил
  rationale: Порода хифиль глагола עמד означает введение человека в определённое положение или должность. «Поставил» естественно сочетается с выражением «во главе» и сохраняет образ исходного текста.
- source_word: לָרֹאשׁ
  choice: во главе
  rationale: רֹאשׁ буквально означает «голова», а здесь указывает на первенствующее положение. Русское «во главе» сохраняет метафору и ясно передаёт смысл.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: Авию, сына Маахи
  rationale: Имена переданы в принятой русской библейской форме, а конструкция родства — прямо и естественно.
- source_word: לְנָגִיד
  choice: правителем
  rationale: נָגִיד обозначает руководителя или правителя, особо поставленного для власти. «Правителем» передаёт должностной смысл и не смешивает его с простым указанием на царское происхождение.
- source_word: בְּאֶחָיו
  choice: среди его братьев
  rationale: Предлог ב допускает понимание как положения внутри группы, так и первенства по отношению к ней. Основной текст осторожно передаёт первое, а вариант «над своими братьями» отмечен в сноске.
- source_word: כִּי
  choice: потому что
  rationale: כִּי вводит причину, по которой Ровоам возвысил Авию.
- source_word: לְהַמְלִיכוֹ
  choice: намеревался сделать его царём
  rationale: Инфинитив с ל выражает цель или намерение. Такая формулировка ясно передаёт замысел Ровоама и каузативное значение глагола מלך.
