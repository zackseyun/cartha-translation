source:
  edition: WLC
  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: ru
  text: Ведь левиты оставили свои пастбищные земли[a] и владения и ушли в Иудею и Иерусалим, потому что Иеровоам и его сыновья отстранили их от священнического служения Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общинные земли» или «земли вокруг городов». Имеются в виду открытые земли, закреплённые за левитскими городами и, в частности, использовавшиеся как пастбища.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не допустили их служить священниками Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: свои пастбищные земли
  rationale: מִגְרָשׁ обозначает открытые земли при городах, особенно левитских, обычно служившие пастбищами. Такой перевод конкретен и понятен, а примечание сохраняет более широкое значение.
- source_word: אֲחֻזָּתָם
  choice: владения
  rationale: אֲחֻזָּה означает земельное владение или закреплённый надел; «владения» естественно передаёт имущественно-земельный смысл, не уточняя его как наследство.
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: и ушли в Иудею и Иерусалим
  rationale: הלך с ל выражает движение к месту назначения. В данном контексте «ушли» естественно связывает переселение с оставлением прежних земель.
- source_word: הִזְנִיחָם
  choice: отстранили их
  rationale: Порода hифиль глагола זנח выражает отвержение или исключение; с последующим מִכַּהֵן речь конкретно идёт об отстранении от служения.
- source_word: מִכַּהֵן
  choice: от священнического служения
  rationale: מִן с инфинитивом כהן указывает на недопущение или отстранение от исполнения священнических обязанностей.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата служения, а тетраграмматон передан личным именем «Яхве».
- source_word: כִּי ... כִּי
  choice: Ведь ... потому что
  rationale: Первое כִּי поясняет предшествующее утверждение, второе вводит причину переселения; русский вариант ясно передаёт обе логические связи без тяжёлого повтора.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон, поэтому личное имя передано как «Яхве», а не заменено титулом.
- issue: Характер действий Иеровоама и его сыновей
  choice: отстранили их от священнического служения
  alternative: отвергли их, чтобы они не служили священниками
  rationale: Формулировка сохраняет институциональный смысл הִזְנִיחָם מִכַּהֵן и не утверждает сверх текста, что левиты утратили сам священный статус.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Ведь» передаёт пояснительную связь с предыдущим стихом; «ушли» подчёркивает оставление прежнего места без добавления оценочности. Все примечания отмечены в основном тексте.
