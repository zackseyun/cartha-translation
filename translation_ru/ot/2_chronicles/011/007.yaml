lexical_decisions:
- source_word: וְ/אֶת
  choice: и
  rationale: Сочетание союза וְ с показателем прямого дополнения אֶת продолжает перечень укреплённых городов из предыдущего стиха. Показатель אֶת отдельно не переводится; в русском перечислении союз естественно ставится перед последним названием.
- source_word: בֵּית צוּר
  choice: Бет-Цур
  rationale: Географическое название передано принятой русской библейской транслитерацией, без перевода составляющих имени.
- source_word: שׂוֹכוֹ
  choice: Сохо
  rationale: Географическое название транслитерировано в форме «Сохо», соответствующей еврейскому написанию и традиционному русскому библейскому употреблению.
- source_word: עֲדֻלָּם
  choice: Адуллам
  rationale: Название иудейского города передано устойчивой русской библейской формой «Адуллам».
