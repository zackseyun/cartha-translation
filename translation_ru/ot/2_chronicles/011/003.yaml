source:
  edition: WLC
  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: ru
  text: «Скажи Ровоаму, сыну Соломона, царю Иудеи, и всему Израилю в Иудее и Вениамине следующее:»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: Скажи
  rationale: Императив אמר с предлогом אֶל повелевает передать речь указанным адресатам. Русское «скажи» естественно передаёт и действие речи, и направленность к адресатам.
- source_word: רְחַבְעָם
  choice: Ровоаму
  rationale: Традиционная и узнаваемая русская форма имени; дательный падеж обусловлен глаголом «скажи».
- source_word: בֶּן שְׁלֹמֹה
  choice: сыну Соломона
  rationale: Сохраняет обозначение происхождения и согласуется в падеже с именем Ровоама.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царю Иудеи
  rationale: Естественная русская передача царского титула в приложении к имени.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: и всему Израилю
  rationale: Сохраняет собирательное национально-заветное наименование «Израиль», не заменяя его словами «израильтяне».
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: в Иудее и Вениамине
  rationale: Предлог ב здесь указывает на местонахождение адресатов; «в» сохраняет это значение и не сводит выражение только к племенной принадлежности.
- source_word: לֵאמֹר
  choice: 'следующее:'
  rationale: Инфинитив вводит содержание речи в следующем стихе. По-русски «следующее:» естественно обозначает переход к прямой речи и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Обозначение южных жителей как «весь Израиль»
  choice: всему Израилю в Иудее и Вениамине
  alternative: всем израильтянам Иудеи и Вениамина
  rationale: Выбранный вариант сохраняет данное текстом имя «Израиль» и пространственное значение предлога ב, не уточняя сверх источника племенную или политическую идентичность адресатов.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Двоеточие показывает, что содержание повеления следует в следующем стихе; конструкция остаётся ясной без буквального и неестественного «говоря».
