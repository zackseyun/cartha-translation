  yaml_path: translation/ot/2_chronicles/011/006.yaml
  text: And he built Bethlehem[a], Etam, and Tekoa.
translation:
  language: ru
  text: Он построил Вифлеем, Этам и Текоа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Глагол בנה в породе qal означает «строить». Хотя контекст говорит об укреплении городов, в самом стихе не употреблён глагол со значением «укреплять», поэтому перевод сохраняет прямое значение и не добавляет контекстуальную деталь.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в естественном русском синтаксисе.
- source_word: בֵּית לֶחֶם
  choice: Вифлеем
  rationale: Устоявшаяся русская форма названия города Бейт-Лехем.
- source_word: עֵיטָם
  choice: Этам
  rationale: Передача топонима עֵיטָם средствами современной русской транслитерации; начальный ע отдельно не передаётся, а сочетание עֵי отражено через «Э».
- source_word: תְּקוֹעַ
  choice: Текоа
  rationale: Близкая к древнееврейскому звучанию современная русская передача топонима; конечная гортанная ע не получает искусственно добавленного согласного.
- source_word: וְ...וְ
  choice: …, … и …
  rationale: 'Многократный союз waw в перечне естественно передан по нормам современного русского языка: запятой и союзом «и» перед последним элементом.'
theological_decisions: []
translation_notes:
  register: Краткая повествовательная фраза передана современным литературным русским языком. Сохранено буквальное «построил», без замены на контекстуально возможное, но более узкое «укрепил». Для топонимов использованы узнаваемая традиционная форма «Вифлеем» и современные формы «Этам», «Текоа».
