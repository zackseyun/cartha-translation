source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: ru
  text: Иодай поручил надзор за домом Яхве священникам, левитам[a], которых Давид распределил для дома Яхве, чтобы они возносили всесожжения Яхве, как написано в Законе Моисея, с радостью и пением, по распоряжению Давида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно также понять как «священникам-левитам» или «священникам и левитам».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «руками Давида»; то есть, вероятно, согласно установленному Давидом порядку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: поручил надзор
  rationale: Сочетание שׂים с פְּקֻדּוֹת обозначает установление и передачу административной ответственности. «Поручил надзор» естественно передаёт смысл по-русски, не превращая его в перечень отдельных обязанностей.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет образ и формальную структуру еврейского выражения; перевод «храм» был бы более истолковывающим.
- source_word: בְּיַד
  choice: поручил … священникам
  rationale: Буквально «в руку» — идиома передачи в ведение или под ответственность. В русском административный смысл естественно выражен глаголом «поручил».
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: священникам, левитам
  rationale: Сохраняет необычное соположение двух существительных и не решает однозначно, означает ли оно «священникам-левитам» или «священникам и левитам».
- source_word: אֲשֶׁר חָלַק דָּוִיד עַל בֵּית יְהוָה
  choice: которых Давид распределил для служения при доме Яхве
  rationale: חלק означает «разделить, распределить»; контекст указывает на распределение храмовых служителей. Добавление «для служения» проясняет подразумеваемую функцию без уточнения конкретных разрядов.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: чтобы они возносили всесожжения
  rationale: Устойчиво передаёт жертвенное значение Hiphil עלה и технический термин עֹלוֹת.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: как написано в Законе Моисея
  rationale: Сохраняет формулу ссылки на письменное установление Торы Моисея.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: с радостью и пением
  rationale: Передаёт два обстоятельства богослужения ясным современным русским языком, сохраняя торжественный регистр.
- source_word: עַל יְדֵי דָוִיד
  choice: по распоряжению Давида
  rationale: Идиома буквально означает «руками Давида», но здесь, вероятнее всего, указывает на установленный Давидом порядок богослужения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Соотношение священников и левитов в הַכֹּהֲנִים הַלְוִיִּם
  choice: священникам, левитам
  alternative: священникам-левитам; священникам и левитам
  rationale: Еврейская конструкция допускает разные способы понимания. Основной текст сохраняет её неоднозначность, а примечание называет естественные варианты.
- issue: Значение עַל יְדֵי דָוִיד
  choice: по распоряжению Давида
  alternative: через Давида; установленным Давидом порядком
  rationale: В контексте храмового пения фраза, вероятнее всего, обозначает авторитет или установленный Давидом порядок, однако буквальная идиома допускает оттенок посредничества.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены выражение «дом Яхве», культовый термин «всесожжения» и неоднозначность обозначения священников и левитов; неестественная для русского идиома «в руку» передана по смыслу.
