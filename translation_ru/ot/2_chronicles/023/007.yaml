  text: וְ/הִקִּיפוּ֩ הַ/לְוִיִּ֨ם אֶת הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/בַּ֖יִת יוּמָ֑ת וִֽ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֹא֥/וֹ וּ/בְ/צֵאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: ru
  text: Пусть левиты окружат царя со всех сторон, каждый со своим оружием в руке; а всякий, кто войдёт в дом[a], будет предан смерти. Будьте с царём, когда он входит и когда выходит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храм»; буквально: «в дом». В книгах Паралипоменон слово «дом» часто обозначает храм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ
  choice: Пусть … окружат
  rationale: Форма в контексте распоряжений Иодая имеет предписывающую силу; конструкция с «пусть» естественно передаёт её по-русски.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Прямое обозначение левитов, которым поручена охрана царя.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт полноту окружения и естественно сочетается с глаголом «окружить».
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: каждый со своим оружием в руке
  rationale: אִישׁ употреблено дистрибутивно — «каждый»; כֵלָיו в военном контексте обозначает оружие, а русское собирательное единственное число звучит естественно.
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: а всякий, кто войдёт в дом
  rationale: Причастие с артиклем имеет обобщающее значение; придаточное с «всякий, кто» ясно передаёт общее предписание.
- source_word: הַבַּיִת
  choice: дом
  rationale: Сохранено буквальное значение בַּיִת; вероятное указание на храм поясняется в сноске без устранения лексической неоднозначности основного текста.
- source_word: יוּמָת
  choice: будет предан смерти
  rationale: Пассивная форма глагола передаёт не простую смерть, а намеренное умерщвление в силу данного приказа.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Будьте с царём
  rationale: Близко передаёт повеление находиться при царе и сопровождать его, не добавляя в основной текст прямо не названной цели охраны.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: когда он входит и когда выходит
  rationale: Естественно передаёт парное еврейское выражение, относящееся к передвижениям царя.
