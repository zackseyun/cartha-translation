base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: ru
  text: 'Он расставил весь народ: у каждого было оружие в руке — от правой стороны храма до левой, у жертвенника и у храма, вокруг царя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: от южной стороны храма
  rationale: Буквально «от правой стороны дома»; при ориентировании лицом на восток правая сторона соответствует югу. «Южная сторона» естественно передаёт пространственный смысл в данном контексте.
- source_word: עַד כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: до северной стороны храма
  rationale: Буквально «до левой стороны дома»; в принятой древнееврейской ориентации левая сторона соответствует северу.
- source_word: הַבַּיִת
  choice: храм
  rationale: В контексте переворота при храме Господа слово обозначает храмовое здание, а не обычный дом.
- source_word: שִׁלְחוֹ
  choice: оружием
  rationale: Слово может обозначать метательное оружие, однако здесь в устойчивом выражении имеет обобщённое значение «оружие».
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: вокруг царя
  rationale: Предлог עַל в сочетании с סָבִיב выражает расположение вокруг и охрану царя.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; торжественный, но ясный повествовательный стиль. Парная конструкция «от… до…» сохраняет пространственный размах исходного текста, а вставное «каждого с оружием в руке» воспроизводит индивидуальную вооружённость собравшихся.
