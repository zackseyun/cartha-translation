  terminology: '«Начальники сотен» прозрачно передаёт שׂרי המאות. «Союз» допустим для בְּרִית в данном политико-военном контексте, не навязывая специального конфессионального понимания. Имя אֱלִישָׁפָט следует передать как «Элишапат», а не «Элишафат»: в исходном имени стоит שׁ, а не שׂ.'
