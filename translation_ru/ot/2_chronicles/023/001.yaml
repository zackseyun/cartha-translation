base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: ru
  text: 'В седьмой год Иехояда набрался решимости и привлёк начальников сотен к союзу[a] с собой: Азарию, сына Иерохама, Измаила, сына Иехоханана, Азарию, сына Оведа, Маасею, сына Адаи, и Элишапата, сына Зихри.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взял начальников сотен ... с ним в завете». Этот оборот означает, что Иехояда привлёк их к обязывающему соглашению с собой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: На седьмой год
  rationale: Естественно передаёт временное обстоятельство; начальный союз ו не выражен отдельно, поскольку в русском он здесь не нужен для связи повествования.
- source_word: הִתְחַזַּק
  choice: набрался решимости
  rationale: Возвратная форма глагола חזק буквально указывает на то, что Иехояда «укрепил себя»; в данном контексте современное русское выражение передаёт внутреннюю решимость приступить к опасному действию.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: начальниками сотен
  rationale: Воинское звание руководителей подразделений по сто человек; формулировка прозрачна и не вызывает римских ассоциаций, связанных со словом «центурион».
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: заключил союз с
  rationale: Весь оборот буквально сочетает «взял» с выражением «с ним в союзе/завете» и означает вовлечение перечисленных начальников в обязывающее соглашение с Иехоядой. Русское «заключил союз с» естественно передаёт действие, не уточняя сверх текста содержание соглашения.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: Азарией ... Измаилом ... Азарией ... Маасеей ... и Элишафатом
  rationale: Имена переданы принятыми или прозрачными русскими формами; повтор имени Азария сохранён в соответствии с еврейским текстом.
- source_word: בֶן
  choice: сыном
  rationale: Стандартная передача патронимического обозначения; падеж согласован с управлением русского предложения.
theological_decisions:
- issue: Значение בְּרִית в соглашении Иехояды с военачальниками
  choice: союз
  alternative: завет; договор
  rationale: Контекст описывает обязывающее политико-военное соглашение между людьми. «Союз» сохраняет серьёзность и взаимную обязательность בְּרִית, не придавая выражению исключительно богословского смысла и не сводя его к формальному юридическому договору.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён ради ясности, воинское звание передано буквально и понятно. Имена даны в русских библейских формах с умеренным приближением к еврейскому звучанию.
