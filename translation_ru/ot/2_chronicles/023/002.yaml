base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: ru
  text: Они прошли по всей Иудее, собрали левитов из всех городов Иудеи и глав отеческих домов[a] Израиля и пришли в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глав родовых домов»; более свободно: «глав семейств».'
    reason: Лексическая альтернатива для идиомы רָאשֵׁי הָאָבוֹת.
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: обошли
  rationale: В данном повествовательном контексте סבב обозначает передвижение по всей области с определённой целью; «обошли Иудею» естественно передаёт эту мысль.
- source_word: וַיִּקְבְּצוּ
  choice: собрали
  rationale: Глагол קבץ означает собрать вместе; русский вид и время соответствуют последовательности завершённых повествовательных действий.
- source_word: אֶת־הַלְוִיִּם
  choice: левитов
  rationale: Обычное русское обозначение представителей колена Левия и храмовых служителей.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: из всех городов Иудеи
  rationale: Предлог מִן указывает на место, откуда собирали левитов, а כֹּל сохраняет полный охват городов.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: и глав отеческих домов
  rationale: Сочетание относится к руководителям родовых подразделений. «Главы отеческих домов» сохраняет культурно-административную образность оригинала, не сводя её просто к «старейшинам».
- source_word: לְיִשְׂרָאֵל
  choice: Израиля
  rationale: Ламед здесь естественно выражает принадлежность или соотнесённость; форма «Израиля» сохраняет явное наименование народа в еврейском тексте.
- source_word: וַיָּבֹאוּ אֶל יְרוּשָׁלִָם
  choice: и пришли в Иерусалим
  rationale: בוא с אֶל означает прибытие к месту; «пришли в Иерусалим» является естественной русской повествовательной формой.
theological_decisions:
- issue: Значение «Израиль» в повествовании, сосредоточенном на Иудее
  choice: Сохранить «Израиля» без замены на «Иудею» или «народ».
  alternative: Иудеи; народа Израиля
  rationale: В еврейском тексте прямо стоит יִשְׂרָאֵל. Сохранение этого названия не сужает его смысл и удерживает богословскую лексику Летописца.
- issue: Передача родового выражения הָאָבוֹת
  choice: «отеческих домов» в основном тексте с пояснением в сноске.
  alternative: родов; семейств; родовых домов
  rationale: Буквально-культурная формула важна для родовой и административной структуры текста; сноска обеспечивает понятность, не устраняя исходный образ.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка формальный, но понятный; повтор «Иудея — Иудеи» сохранён вслед за оригиналом. Маркер сноски поставлен непосредственно после всего неоднозначного выражения.
