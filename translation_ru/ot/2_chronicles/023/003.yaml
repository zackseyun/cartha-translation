  source_fidelity: 'Смысл еврейского текста в целом передан точно: всё собрание заключает завет с царём в доме Бога; затем говорящий возвещает царствование сына царя в соответствии со сказанным Господом о сыновьях Давида. Множественное число בְּנֵי דָוִד сохранено. Явного имени говорящего текст не добавляет, и местоимение «он» уместно.'
