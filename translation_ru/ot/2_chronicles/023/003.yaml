base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: ru
  text: 'И всё собрание заключило в доме Божьем завет с царём. Он сказал им: «Вот, сын царя будет царствовать, как и говорил Господь о сыновьях Давида».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: заключило ... завет
  rationale: Устойчивый русский эквивалент древнееврейской идиомы «срезать завет»; передаёт её смысл естественно и точно.
- source_word: כָּל־הַקָּהָל
  choice: всё собрание
  rationale: Передаёт как совокупность собравшихся представителей, не сужая значение до позднейшего специального термина.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию частицы в естественной современной русской речи.
- source_word: בֶן־הַמֶּלֶךְ
  choice: царский сын
  rationale: Естественно передаёт конструкцию принадлежности и подчёркивает законного наследника престола.
- source_word: יִמְלֹךְ
  choice: будет царствовать
  rationale: Точно сохраняет значение правления в качестве царя, а не только вступления на престол.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционное литературное русское обозначение тетраграмматона, ясно отличающее Божье имя по контексту.
theological_decisions:
- issue: Основание царствования сына царя
  choice: «как и говорил Господь о сыновьях Давида»
  alternative: «согласно обещанию Господа о потомках Давида»
  rationale: Выбранный вариант сохраняет прямую отсылку к словам Господа и множественное число «сыновья», не превращая её в более истолковывающую формулировку об обещании или потомках.
- issue: Лицо, говорящее собранию
  choice: «Он сказал им»
  alternative: «Иодай сказал им»
  rationale: Сохранено местоимение исходного текста; имя говорящего определяется ближайшим контекстом, но не вставляется в сам стих.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис слегка упрощён делением на два предложения, при этом последовательность и смысл еврейского текста сохранены.
