  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Иодай обращается к военачальникам, приказывает вывести Гофолию, предусматривает казнь для идущего за ней и запрещает казнить её в доме Яхве. Однако «а всякого... предайте смерти» преобразует еврейскую безлично-пассивную формулу о том, кто последует за ней, в прямое обращение к начальникам. Более близкая русская формула «пусть будет предан смерти» сохраняет предписательный, но не прямо адресованный характер יוּמַת. «Велел» в пояснительной фразе несколько сильнее простого אָמַר («сказал»); контекст объясняет приказ, но глагол следует передать без дополнительного оттенка распоряжения.'
