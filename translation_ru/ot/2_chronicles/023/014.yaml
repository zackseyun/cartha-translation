  terminology: «Иодай», «начальники сотен», «войско», «предан смерти», «дом Яхве» и передача יהוה как «Яхве» приемлемы. Трудное מִבֵּית הַשְּׂדֵרוֹת не следует решать категорически; основной вариант и сноска сохраняют необходимую осторожность.
