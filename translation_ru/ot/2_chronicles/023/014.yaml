base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: ru
  text: 'Тогда священник Иодай вывел начальников сотен, поставленных над войском, и сказал им: «Выведите её между рядами[a], а всякий, кто пойдёт за ней, пусть будет предан смерти мечом». Ибо священник сказал: «Не предавайте её смерти в доме Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение неясно. Возможно также: «выведите её за ряды»; вероятно, речь идёт о том, чтобы вывести Гофолию через выстроенные ряды или за их пределы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: вывел
  rationale: Порода хифиль от יצא имеет каузативное значение «вывести»; форма передаёт действие Иодая без лишнего уточнения.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: начальников сотен
  rationale: Буквально и естественно передаёт древнеизраильское военное звание, не вызывая римских ассоциаций слова «центурион».
- source_word: פְּקוּדֵי הַחַיִל
  choice: поставленных над войском
  rationale: Причастная форма от פקד указывает на назначение этих начальников на ответственную военную должность.
- source_word: הוֹצִיאוּהָ
  choice: выведите её
  rationale: Повелительная форма хифиля с суффиксом женского рода прямо относится к Гофолии.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: между рядами
  rationale: Трудное еврейское выражение, вероятно, описывает вывод Гофолии через пространство среди выстроенных рядов; неоднозначность отражена в сноске.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: а всякого, кто последует за ней
  rationale: Причастие с אחריה может обозначать и физическое следование, и присоединение к ней как сторонника; русский оборот сохраняет обе возможности.
- source_word: יוּמַת בֶּחָרֶב
  choice: предайте смерти мечом
  rationale: Пассивная форма в контексте приказа выражает распоряжение о казни; формулировка сохраняет официальный и торжественный регистр.
- source_word: כִּי אָמַר הַכֹּהֵן
  choice: ведь священник велел
  rationale: כִּי вводит объяснение предшествующего распоряжения, а אָמַר здесь по контексту обозначает ранее данный приказ.
- source_word: לֹא תְמִיתוּהָ
  choice: не предавайте её смерти
  rationale: Хифиль от מות означает «умертвить, предать смерти»; выбор сохраняет формальный характер запрета.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Буквально передаёт בית как «дом» и сохраняет личное имя יהוה в форме «Яхве».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Форма «Яхве» передаёт его как личное имя и не заменяет титулом.
- issue: Кого обозначает «последующий за ней»
  choice: 'Формулировка оставлена открытой: это может быть и сопровождающий, и сторонник Гофолии'
  alternative: Однозначно понимать только как её вооружённого сторонника
  rationale: Еврейское וְהַבָּא אַחֲרֶיהָ само по себе не уточняет мотив или статус следующего за ней человека, поэтому перевод не сужает смысл.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным регистром. Военные и судебные формулировки переданы ясно, без архаизмов; синтаксическая и смысловая неоднозначность трудной пространственной фразы отмечена сноской.
