base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: ru
  text: И весь народ пришёл к храму Ваала и разрушил его; жертвенники и изваяния Ваала они разбили, а Маттана, жреца Ваала, убили перед жертвенниками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: храм Ваала
  rationale: Буквально «дом Ваала»; в данном контексте речь идёт о культовом здании, поэтому современное русское «храм» передаёт смысл естественно и точно.
- source_word: וַיִּתְּצֻהוּ
  choice: разрушил его
  rationale: Форма означает разрушение или снос здания; местоимение относится к храму Ваала.
- source_word: מִזְבְּחֹתָיו וְאֶת־צְלָמָיו
  choice: жертвенники и изваяния Ваала
  rationale: Суффикс третьего лица может формально отсылать к Ваалу; явное повторение имени по-русски устраняет неестественную двусмысленность местоимения, не меняя референта. צְלָמִים — культовые изображения или изваяния.
- source_word: שִׁבֵּרוּ
  choice: разбили
  rationale: Интенсивная форма выражает физическое сокрушение культовых предметов; «разбили» звучит ясно и без излишнего усиления.
- source_word: כֹּהֵן הַבַּעַל
  choice: жрец Ваала
  rationale: Для служителя языческого культа в современном русском литературном употреблении естественно слово «жрец», отличающее его от священников Израиля.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: перед жертвенниками
  rationale: Сохраняется пространственное значение предлога לִפְנֵי без уточнений, которых нет в источнике.
theological_decisions:
- issue: Принадлежность жертвенников и изваяний
  choice: «жертвенники и изваяния Ваала»
  alternative: «его жертвенники и его изваяния»
  rationale: Еврейские местоименные суффиксы мужского рода относятся к Ваалу, а не к храму; имя делает эту связь ясной в русском тексте.
- issue: Характер сообщения о насилии
  choice: прямое повествовательное «убили»
  alternative: смягчённые или оправдывающие формулировки
  rationale: Источник кратко сообщает о событии, не добавляя в этом стихе ни оценки, ни богословского объяснения; перевод сохраняет такую сдержанность.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанный повествовательный стиль. Синтаксис сохраняет последовательность действий и коллективный субъект исходного текста.
