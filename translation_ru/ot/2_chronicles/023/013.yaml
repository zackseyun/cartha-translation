base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: ru
  text: 'Она посмотрела — и вот: царь стоит у своего столба при входе, а рядом с царём — начальники и трубы[a]. Весь народ страны радуется и трубит в трубы, а певцы с музыкальными инструментами ведут хвалебное пение[b]. Тогда Аталия разорвала на себе одежды и сказала: «Заговор! Заговор!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начальники и трубы». Возможно, инструменты названы вместо трубачей.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «руководят хвалой» или «подают знак к хвале». Еврейское выражение в этом музыкальном контексте допускает несколько близких толкований.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Она посмотрела — и вот
  rationale: Глагол ראה в повествовательной последовательности перед הִנֵּה естественно передан как «посмотрела»; «и вот» сохраняет живую указательную силу еврейского оборота.
- source_word: הַמֶּלֶךְ עוֹמֵד
  choice: царь стоит
  rationale: Причастие עוֹמֵד рисует продолжающуюся сцену; русское настоящее историческое «стоит» передаёт её наглядно и естественно.
- source_word: עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: у своего столба при входе
  rationale: עַל здесь обозначает положение возле установленного царского места, а מָבוֹא — вход или место входа. Формулировка сохраняет оба пространственных указания.
- source_word: הַשָּׂרִים וְהַחֲצֹצְרוֹת
  choice: начальники и трубы
  rationale: שָׂרִים имеет широкое значение и не обязательно обозначает только военных командиров. Основной текст сохраняет буквальное «трубы», хотя инструменты, вероятно, названы вместо трубачей.
- source_word: כָל עַם הָאָרֶץ
  choice: весь народ страны
  rationale: Передаёт устойчивое обозначение населения страны или царства, а не просто собравшейся поблизости толпы.
- source_word: שָׂמֵחַ וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: радуется и трубит в трубы
  rationale: Единственное число согласуется с собирательным עַם; настоящее время поддерживает живое описание происходящей сцены.
- source_word: הַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: певцы с музыкальными инструментами
  rationale: מְשׁוֹרֲרִים означает именно певцов, а כלי השיר — инструменты, используемые для музыки или пения. Русская формулировка ясна без излишней буквальности.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: ведут хвалебное пение
  rationale: Каузативная форма ידע в этом музыкально-богослужебном контексте указывает на руководство или подачу сигнала к хвале. Перевод сохраняет функцию выражения, не устраняя его оттеночную неоднозначность.
- source_word: עֲתַלְיָהוּ
  choice: Аталия
  rationale: Передача следует еврейской форме имени ближе, чем традиционное русское «Гофолия», и остаётся естественной для современного русского текста.
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: разорвала на себе одежды
  rationale: Русский оборот естественно передаёт древний жест потрясения и отчаяния, сохраняя множественное число исходного текста.
- source_word: וַתֹּאמֶר
  choice: закричала
  rationale: Хотя буквально глагол означает «сказала», содержание повторного возгласа и публичная сцена позволяют естественно передать манеру речи как крик.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Заговор! Заговор!
  rationale: Повтор сохранён как резкий тревожный возглас; קֶשֶׁר здесь означает политический заговор или мятеж.
