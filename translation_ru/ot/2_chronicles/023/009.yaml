base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: ru
  text: И священник Иодай дал начальникам сотен копья, щиты[a] и большие щиты, принадлежавшие царю Давиду и находившиеся в доме Божьем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст различает два вида щитов; точные особенности второго вида не вполне ясны.
    reason: lexical_alternative
  - marker: b
    text: 'То есть в храме; буквально: «в доме Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: дал
  rationale: Обычное повествовательное значение נתן; естественно передаёт передачу предметов.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: священник Иодай
  rationale: Традиционная русская передача имени; порядок слов естественен для современного литературного русского.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: начальникам сотен
  rationale: Сохраняет военное значение и еврейскую структуру, не вызывая римских ассоциаций слова «центурионы».
- source_word: הַחֲנִיתִים
  choice: копья
  rationale: Стандартное и ясное обозначение данного вида древкового оружия.
- source_word: הַמָּגִנּוֹת
  choice: малые щиты
  rationale: Контекстуально отличает מגנות от следующего вида щитов; уточнение размера делает различие понятным, хотя размер прямо не назван.
- source_word: הַשְּׁלָטִים
  choice: большие щиты
  rationale: Вероятное обозначение особого, более крупного типа щита; сохраняет различие между двумя защитными предметами.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: принадлежавшие царю Давиду
  rationale: Прямо и без лишнего временного уточнения передаёт именную конструкцию принадлежности.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Сохраняет буквальный образ и характерную лексику Летописца, хотя речь идёт о храме.
