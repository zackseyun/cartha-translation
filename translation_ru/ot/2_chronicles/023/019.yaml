base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: ru
  text: Он поставил привратников у ворот дома Яхве, чтобы не входил никто, кто был нечист в каком бы то ни было отношении[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не войдёт нечистый ни в каком деле (или: отношении)»; выражение охватывает всякую разновидность нечистоты, не уточняя её вид.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Он поставил
  rationale: Каузативная форма глагола עמד означает, что субъект расставил людей на их постах. «Поставил» естественно передаёт это действие по-русски, не добавляя отсутствующего в стихе имени субъекта.
- source_word: הַשּׁוֹעֲרִים
  choice: привратников
  rationale: Слово обозначает служителей, охранявших входы; «привратники» — точный и привычный термин в храмовом контексте.
- source_word: עַל שַׁעֲרֵי
  choice: у ворот
  rationale: В контексте размещения служителей предлог עַל указывает на их положение при воротах. Русское «у ворот» звучит естественно и ясно.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохранён исходный образ «дом», а не заменён толкованием «храм»; личное имя יְהוָה передано как «Яхве».
- source_word: וְלֹא יָבֹא
  choice: чтобы туда не входил
  rationale: Отрицательная глагольная форма в данном контексте выражает цель или предусмотренный результат расстановки привратников. «Туда» ясно отсылает к дому Яхве, не меняя смысла.
- source_word: טָמֵא
  choice: нечистый
  rationale: Это установленное обозначение ритуальной нечистоты, особенно уместное в контексте допуска в святилище.
- source_word: לְכָל דָּבָר
  choice: по какой-либо причине
  rationale: Буквально широкое выражение «по всякому делу/предмету» здесь охватывает любую причину или разновидность нечистоты. Перевод сохраняет широту, а буквальная форма приведена в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Характер нечистоты, препятствующей входу
  choice: нечистый по какой-либо причине
  alternative: нечистый в чём-либо
  rationale: Контекст храмовых ворот указывает на ритуальную категорию, однако текст не уточняет конкретный вид нечистоты. Перевод не сужает её до отдельного случая.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранён образ «дом Яхве» и специальный термин «нечистый»; синтаксис сделан естественным для современного читателя.
