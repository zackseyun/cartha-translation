base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: ru
  text: И заключил[a] Иодай завет между Иодаем, всем народом и царём, чтобы они были народом Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассёк завет» — древнееврейское устойчивое выражение со значением «заключил завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народом, принадлежащим Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת בְּרִית
  choice: И заключил завет
  rationale: Еврейское выражение буквально означает «рассёк завет», но по-русски установившийся и естественный эквивалент — «заключил завет». Союз וַ передаёт последовательность повествования и естественно переводится как «и».
- source_word: בֵּינוֹ
  choice: между собой
  rationale: Местоименный суффикс относится к Иодаю; русское «между собой» ясно и естественно передаёт его участие в завете.
- source_word: כָּל הָעָם
  choice: всем народом
  rationale: Перевод точно передаёт «весь народ», не добавляя отсутствующего в еврейском тексте уточнения «земли».
- source_word: הַמֶּלֶךְ
  choice: царём
  rationale: Определённое существительное обозначает царя как отдельного участника завета наряду с Иодаем и народом.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: чтобы они были народом Яхве
  rationale: Целевая конструкция передана придаточным с «чтобы». Выражение «народом Яхве» сохраняет краткую заветную формулу принадлежности, не сводя её лишь к политической лояльности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное заветное имя Бога, непосредственно стоящее в исходном тексте.
theological_decisions:
- issue: Участники завета и отношение к Яхве
  choice: Иодай, весь народ и царь названы участниками завета; его цель — чтобы они были народом Яхве
  alternative: Понять Яхве как прямо названную сторону завета
  rationale: В еврейском тексте после конструкции «между» перечислены Иодай, весь народ и царь. Яхве появляется в целевой части как Тот, чьим народом они должны быть; делать Его грамматически одной из перечисленных сторон означало бы добавлять то, чего текст прямо не говорит.
- issue: Оттенок конструкции לְעָם לַיהוָה
  choice: народом Яхве
  alternative: народом, принадлежащим Яхве
  rationale: 'Основной перевод сохраняет ёмкость заветной формулы: она выражает и принадлежность, и особые отношения с Яхве. Более разъяснительный вариант приведён в примечании.'
translation_notes:
  register: Современный литературный русский язык с традиционной библейской торжественностью. Синтаксис сохраняет трёх участников завета и целевую направленность заключительной части; имя Яхве передано непосредственно.
