lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Вот что вы должны сделать
  rationale: Естественная для современного русского языка вводная формула, сохраняющая предписывающую силу еврейского выражения.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: треть из вас
  rationale: Передаёт долю от всей группы и партитивное значение предлога מִן.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: заступающих на служение в субботу
  rationale: Причастная конструкция обозначает тех, кто приходит в субботу для исполнения очередной храмовой службы; русский оборот ясно передаёт контекст смены, не сводя значение к простому физическому входу.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: священников и левитов
  rationale: Приложение поясняет, из кого состоит названная группа; тире естественно оформляют это уточнение по-русски.
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: будет охранять входы
  rationale: 'Идиоматически передаёт сочетание «привратники порогов»: речь идёт о назначении охраны при храмовых входах, а не о самих дверных порогах как объектах охраны.'
