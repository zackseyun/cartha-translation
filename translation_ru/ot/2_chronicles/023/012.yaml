base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: ru
  text: Когда Гофолия услышала шум народа, который бежал и славил царя, она пришла к народу в дом Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֹול
  choice: шум
  rationale: В данном контексте слово обозначает слышимый шум множества людей, а не только голос.
- source_word: הָרָצִים
  choice: который сбегался
  rationale: Причастие от רוץ буквально связано с бегом; «сбегался» естественно передаёт движение людей к месту происходящего, не превращая его в отвлечённый «гул».
- source_word: מְהַלְלִים
  choice: славил
  rationale: Передаёт значение хвалы, обращённой к царю, и сохраняет отличие от более узкого «приветствовал».
- source_word: בֵּית יהוה
  choice: дом Господа
  rationale: Естественный русский библейский эквивалент обозначения храма; имя יהוה передано принятой в русском тексте формой «Господь».
theological_decisions:
- issue: Объект глагола הלל
  choice: славил царя
  alternative: приветствовал царя
  rationale: Еврейский текст прямо связывает причастие מְהַלְלִים с אֶת־הַמֶּלֶךְ; перевод сохраняет прямой объект и не сужает значение до политического приветствия.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Единственное число «народ, который… славил» сохраняет грамматическое согласование в русском, хотя еврейские причастия стоят во множественном числе и относятся к людям, составляющим народ.
