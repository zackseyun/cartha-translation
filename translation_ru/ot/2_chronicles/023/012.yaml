    rationale: Причастие הָרָצִים означает «бегущие». Русское «сбегался» обычно подразумевает, что люди стекались к определённому месту; это смысловое уточнение отсутствует и потому не должно вноситься.
  revised_text: Когда Гофолия услышала шум народа, который бежал и славил царя, она пришла к народу в дом Господа.
