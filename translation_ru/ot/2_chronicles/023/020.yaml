  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: ru
  text: Затем он взял начальников сотен, знатных людей, правителей народа и весь народ страны[a], свёл царя из дома Яхве. Они прошли через верхние ворота царского дома[b] и посадили царя на престол царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «народ страны» в царских повествованиях может обозначать население как общественно-политическую силу, а не только жителей сельской местности.
    reason: cultural_note
  - marker: b
    text: 'Или: «через верхние ворота царского дворца». Буквально: «через верхние ворота дома царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Затем он взял
  rationale: Сохраняет основное значение לקח и естественно передаёт то, что Иодай повёл с собой названные группы.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: начальников сотен
  rationale: Близко передаёт древнееврейское воинское звание, не привнося римской ассоциации слова «центурионы».
- source_word: הָאַדִּירִים
  choice: знатных людей
  rationale: В данном общественно-политическом контексте слово обозначает влиятельных, видных людей; такой перевод не сводит значение к физической силе.
- source_word: הַמּוֹשְׁלִים בָּעָם
  choice: правителей народа
  rationale: Передаёт лиц, обладавших властью среди народа, и остаётся близким к форме исходного выражения.
- source_word: כָּל עַם הָאָרֶץ
  choice: весь народ страны
  rationale: Сохраняет устойчивое выражение царских повествований, где народ выступает как общественно-политическое целое.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: вывел царя
  rationale: Порода hифиль глагола ירד указывает на перемещение вниз; русский глагол «вывел» естественно описывает движение царя из храмового комплекса, хотя направление вниз выражено менее явно.
- source_word: מִבֵּית יְהוָה
  choice: из дома Яхве
  rationale: Сохраняет образ «дома» и передаёт тетраграмматон личным именем «Яхве».
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: через Верхние ворота
  rationale: Идиоматично передаёт движение через вход; прописная буква указывает на название конкретных ворот.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Естественное русское соответствие буквальному «дому царя»; в контексте имеется в виду царская резиденция.
- source_word: וַיּוֹשִׁיבוּ
  choice: посадили
  rationale: Точно передаёт каузативное «усадили» и хорошо соответствует церемонии восшествия на престол.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: престол царства
  rationale: Сохраняет явное существительное מַמְלָכָה и торжественное звучание исходной формулы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; личное имя «Яхве» сохраняет его отличие от титула «Господь».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксис сделан ясным для широкого читателя, при этом сохранены ключевые древнееврейские формулы и общественно-политическая терминология.
