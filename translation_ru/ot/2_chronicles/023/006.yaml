  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: ru
  text: И пусть никто не входит в дом Яхве[a], кроме священников и левитов, совершающих служение. Они могут входить, потому что святы. А весь народ пусть соблюдает предписание Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в храм Яхве; буквально: «в дом Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «пусть несёт стражу для Яхве» или «пусть соблюдает установленный Яхве порядок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: И пусть никто не входит
  rationale: Сочетание אַל с юссивом выражает запрет. Такая формулировка естественно передаёт его предписывающую силу по-русски.
- source_word: בֵית יְהוָה
  choice: дом Яхве
  rationale: Сохранён буквальный и значимый древнееврейский образ «дома»; по контексту речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כִּי אִם
  choice: кроме
  rationale: Оборот вводит исключение из предшествующего запрета.
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: священников и левитов, совершающих служение
  rationale: Причастие מְשָׁרְתִים обозначает тех, кто исполняет храмовое служение; формулировка сохраняет культовый смысл и звучит естественно по-русски.
- source_word: הֵמָּה יָבֹאוּ
  choice: Они могут входить
  rationale: После оговорённого исключения эта фраза выражает разрешение на вход, а не просто будущее действие.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: потому что святы
  rationale: Слово קֹדֶשׁ передаёт священный, посвящённый статус этих служителей; «святы» сохраняет исходную библейскую категорию.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: пусть исполняет порученное Яхве
  rationale: Однокоренная конструкция שׁמר משׁמרת может означать соблюдение вверенной обязанности, несение стражи или исполнение установленного порядка. Основной текст передаёт широкое значение возложенной обязанности, а примечание сохраняет альтернативы.
theological_decisions:
- issue: Святость священников и служащих левитов
  choice: святы
  alternative: посвящены; отделены для священного служения
  rationale: В данном контексте речь идёт о культовом статусе, дающем право входа в храм, а не о нравственном совершенстве.
- issue: Передача Тетраграмматона
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя יהוה и не подменяет его титулом.
- issue: Характер обязанности народа
  choice: исполняет порученное Яхве
  alternative: несёт стражу для Яхве; соблюдает установление Яхве
  rationale: Еврейская конструкция допускает как значение охраны, так и более широкое значение соблюдения вверенной обязанности; основной текст не сужает её до одной лишь караульной службы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис ясен для широкого читателя; сохранены образ «дома Яхве», культовое значение святости и неоднозначность выражения о возложенной на народ обязанности.
