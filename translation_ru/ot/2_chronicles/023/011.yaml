base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: ru
  text: 'Затем вывели сына царя, возложили на него венец и свидетельство[a], сделали его царём; Иодай и его сыновья помазали его и воскликнули: «Да здравствует царь!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон», «документ завета». Вероятно, имеется в виду письменное свидетельство завета, связанное с царским правлением.'
    reason: Лексическая неоднозначность слова הָעֵדוּת и неясность конкретного предмета в обряде воцарения.
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: вывели
  rationale: Порода хифиль глагола יצא означает «вывести» или «привести наружу»; «вывели» естественно описывает торжественное появление наследника.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: царского сына
  rationale: Естественная русская передача сочетания «сын царя», сохраняющая династический акцент.
- source_word: הַנֵּזֶר
  choice: венец
  rationale: В контексте возведения на престол נֵזֶר обозначает царский венец или диадему; «венец» звучит достойно и понятно, не устраняя оттенка посвящения.
- source_word: הָעֵדוּת
  choice: свидетельство
  rationale: Формальная передача многозначного термина, сохраняющая его связь со свидетельством и заветом без преждевременного уточнения, идёт ли речь о законе или особом документе.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: провозгласили его царём
  rationale: Хифиль глагола מלך означает сделать кого-либо царём. «Провозгласили царём» естественно для обряда воцарения и не смешивает это действие с возложением венца.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: помазали его
  rationale: Стандартная и точная передача משׁח в контексте царского поставления.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: Иодай и его сыновья
  rationale: Субъект назван после глагола в еврейском тексте; в русском он поставлен перед сказуемым для ясности и относится как к помазанию, так и к последующему возгласу.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Да здравствует царь!
  rationale: Устойчивый русский эквивалент пожелания-возгласа при воцарении, точно передающий побудительное значение формы יְחִי.
theological_decisions:
- issue: Значение הָעֵדוּת в обряде воцарения
  choice: В основном тексте сохранено «свидетельство».
  alternative: «закон» или «документ завета»
  rationale: Термин может указывать на письменное свидетельство завета, связанное с обязанностями царя, но сам еврейский текст не уточняет его форму и содержание. Формальная передача сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным повествовательным стилем. Традиционная русская форма имени «Иодай» сохранена. Два предложения проясняют, что именно Иодай и его сыновья совершили помазание и произнесли возглас.
