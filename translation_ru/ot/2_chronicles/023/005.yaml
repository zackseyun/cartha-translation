base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: ru
  text: треть — у царского дворца, треть — у ворот Основания[a], а весь народ — во дворах дома Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у ворот основания». Вероятно, это название конкретных ворот, однако точный смысл названия неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: треть
  rationale: Субстантивированное порядковое числительное в контексте распределения людей обозначает одну треть группы; по-русски естественно краткое «треть».
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: у царского дворца
  rationale: Буквально «у/в доме царя»; здесь речь о месте несения службы возле царской резиденции. «Царский дворец» ясно передаёт референт без излишней архаичности.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: у ворот Основания
  rationale: שַׁעַר означает «ворота», а יְסוֹד — «основание, фундамент». Сочетание, вероятно, является названием ворот; перевод сохраняет это название и отмечает неопределённость в сноске.
- source_word: וְכָל הָעָם
  choice: а весь народ
  rationale: עָם — обычное слово «народ»; союз передаёт переход к отдельному распоряжению для всех остальных.
- source_word: בְּחַצְרוֹת
  choice: во дворах
  rationale: Множественное число חָצֵר обозначает ограждённые дворы храмового комплекса; «во дворах» естественно и точно по-русски.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Буквально «дом Яхве»; сохранены образ «дома» и личное имя יְהוָה, а не введено пояснительное «храм».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» прямо передаёт имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с кратким синтаксическим параллелизмом, соответствующим перечислению постов в еврейском тексте. Тире восполняют подразумеваемую связку, не добавляя нового действия. Сноска поставлена после «ворот Основания», к которым она относится по смыслу.
