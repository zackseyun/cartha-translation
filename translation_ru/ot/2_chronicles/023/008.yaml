revisions:
- from: Левиты и весь Иуда исполнили всё, что повелел священник Иодай. Каждый взял своих людей — и тех, кто заступал в субботу, и тех, кто сменялся в субботу, — потому что священник Иодай не отпустил служебные отряды[a].
  to: Левиты и весь Иуда исполнили всё, что повелел священник Иодай. Каждый взял своих людей — тех, кто заступал на службу в субботу, вместе с теми, кто уходил после субботней службы, — потому что священник Иодай не отпустил смены[a].
  rationale: Уточнено направление второй субботней группы («уходил»), а нейтральное «смены» заменяет военизированное «служебные отряды». Причинная связь, распределительное значение «каждый» и одновременное присутствие обеих групп сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:42:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы повиновение распоряжению Иодая, распределительное «каждый», одновременное привлечение входящей и уходящей субботних групп и причина этого. Однако «тех, кто сменялся» не вполне точно передаёт יוֹצְאֵי («уходящих»): по-русски оно может обозначать как уходящую, так и заступающую сторону смены. «Служебные отряды» вносит ненужный военный оттенок в нейтральное «подразделения/смены».'
  naturalness: Текст в основном естественен для современного литературного русского. «Заступал» уместно в контексте дежурств; парное «уходил после субботней службы» ясно обозначает вторую группу. «Смены» в заключении кратко и естественно выражает организованные служебные группы.
  terminology: Имя «Иодай» и титул «священник» приемлемы. «Смены» точнее, чем «служебные отряды», поскольку не навязывает военный смысл и соответствует значению מחלקות как установленно сменяющихся групп. Примечание сохраняет доступные альтернативы без излишнего конфессионального уточнения.
  issues:
  - severity: medium
    issue: «Сменялся в субботу» двусмысленно передаёт «уходящих в субботу».
    rationale: יוֹצְאֵי — активное «уходящие/выходящие», то есть группа, заканчивающая службу; глагол «сменялся» может быть понят и как «заступал на смену».
  - severity: medium
    issue: «Служебные отряды» имеет излишне военную окраску.
    rationale: הַמַּחְלְקוֹת обозначает подразделения, череды или смены. Контекст организованной службы не требует характеризовать их как «отряды».
