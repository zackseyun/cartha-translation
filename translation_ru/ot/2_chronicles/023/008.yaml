base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: ru
  text: Левиты и весь Иуда исполнили всё, что повелел священник Иодай. Каждый взял своих людей — тех, кто заступал на службу в субботу, вместе с теми, кто уходил после субботней службы, — потому что священник Иодай не отпустил смены[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «череды» или «подразделения». Речь идёт об установленных группах, которые несли службу по очереди.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כְּכֹל אֲשֶׁר צִוָּה
  choice: исполнили всё, что повелел
  rationale: Естественно передаёт полное повиновение приказу, выраженное сочетанием עשה с כְּכֹל אֲשֶׁר, без тяжеловесной кальки «сделали согласно всему».
- source_word: הַלְוִיִּם וְכָל יְהוּדָה
  choice: левиты и весь Иуда
  rationale: Сохраняет определённую группу левитов и географически-коллективное обозначение Иуды; форма «весь Иуда» понятна в библейском повествовательном регистре.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: священник Иодай
  rationale: Передаёт имя в принятой русской библейской форме и сохраняет титул; русский порядок слов звучит естественно.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: каждый взял своих людей
  rationale: אִישׁ имеет распределительное значение «каждый», а אֲנָשָׁיו обозначает подчинённых ему людей без навязывания исключительно военного смысла.
- source_word: בָּאֵי הַשַּׁבָּת עִם יוֹצְאֵי הַשַּׁבָּת
  choice: и тех, кто заступал в субботу, и тех, кто сменялся в субботу
  rationale: Передаёт противопоставление входящей и уходящей групп как смену служебных составов. «Заступал» и «сменялся» естественнее по-русски, чем буквальные «входил» и «выходил».
- source_word: כִּי לֹא פָטַר
  choice: потому что ... не отпустил
  rationale: כִּי вводит причину присутствия обеих смен, а פטר здесь означает не отпустить людей после исполнения их обычной службы.
- source_word: הַמַּחְלְקוֹת
  choice: служебные отряды
  rationale: Слово обозначает организованные группы, служившие по установленному порядку. «Служебные» уточняет культово-организационный контекст, а «отряды» сохраняет групповое значение; альтернативы вынесены в примечание.
