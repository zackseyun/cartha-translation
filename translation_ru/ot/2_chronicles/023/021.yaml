  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: ru
  text: И весь народ страны радовался, и в городе царило спокойствие, и Гофолию умертвили мечом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: радовался
  rationale: Глагол שׂמח выражает радость; единственное число согласуется с собирательным существительным «народ» и естественно звучит по-русски.
- source_word: כָל עַם הָאָרֶץ
  choice: весь народ страны
  rationale: Передаёт население страны как целое. В современном русском «народ страны» яснее и естественнее буквального «народ земли», не добавляя указания на Иудею, которого нет в самом стихе.
- source_word: וְהָעִיר שָׁקָטָה
  choice: и город успокоился
  rationale: שׁקט обозначает наступление покоя после смуты. «Успокоился» передаёт изменение обстановки и сохраняет прямое обозначение «город», не подставляя из контекста название Иерусалима.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: а Гофолию умертвили
  rationale: Порода Hiphil глагола מות означает «причинить смерть, умертвить». Союз «а» естественно присоединяет заключительное сообщение и не превращает еврейский וְ в явно причинный союз.
- source_word: בֶחָרֶב
  choice: мечом
  rationale: Творительный падеж естественно передаёт инструментальное значение предлога בְּ и сохраняет конкретный способ умерщвления.
theological_decisions:
- issue: Связь между успокоением города и смертью Гофолии
  choice: 'Сохранено сочинительное присоединение: «а Гофолию умертвили»'
  alternative: 'Причинное прочтение: «потому что Гофолию умертвили»'
  rationale: Еврейский союз וְ допускает контекстуальные оттенки, но сам по себе не требует причинного толкования. Поэтому перевод не делает причинную связь явной, хотя контекст может её подразумевать.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Имя עֲתַלְיָהוּ передано в традиционной русской библейской форме «Гофолия». Порядок трёх еврейских предложений сохранён; архаические обороты по возможности устранены.
