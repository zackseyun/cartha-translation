base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: ru
  text: Тогда её схватили[a], и она дошла до входа Конских ворот у царского дома[b]; там её предали смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наложили на неё руки»; возможно также понимание: «дали ей пройти».'
    reason: Еврейский оборот допускает буквальную передачу и менее вероятное контекстуальное толкование; примечание сохраняет эту лексическую неоднозначность.
  - marker: b
    text: 'Или: «у царского дворца».'
    reason: «Дом царя» может обозначать царскую резиденцию, то есть дворец, однако основной текст сохраняет более буквальное выражение.
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: её схватили
  rationale: Буквально оборот означает «возложили/наложили на неё руки». В контексте задержания и последующего умерщвления естественнее всего передать его как «схватили», не придавая выражению возможных в русском религиозных ассоциаций.
- source_word: וַתָּבוֹא
  choice: она прошла
  rationale: 'Форма буквально сообщает о её движении к указанному месту: «она пришла/вошла». «Прошла» по-русски естественно описывает её движение после задержания, при этом не добавляет прямо отсутствующего в еврейском тексте глагола «повели».'
- source_word: מְבוֹא
  choice: вход
  rationale: Существительное обозначает вход или место входа; «вход» точно и понятно передаёт пространственное значение.
- source_word: שַׁעַר הַסּוּסִים
  choice: Конские ворота
  rationale: Сочетание, вероятно, служит названием ворот. Традиционная русская модель «Конские ворота» звучит естественно и сохраняет образ исходного текста.
- source_word: בֵּית הַמֶּלֶךְ
  choice: при царском доме
  rationale: Буквально «дом царя». Предлог «при» естественно связывает ворота с царским домом и не превращает это обозначение без необходимости в более узкое «дворец».
- source_word: וַיְמִיתוּהָ
  choice: её предали смерти
  rationale: Каузативная форма от מות означает «умертвить, предать смерти». Выбранная формулировка передаёт намеренное официальное умерщвление, не добавляя юридической конкретики слова «казнили».
- source_word: שָׁם
  choice: там
  rationale: Прямое и естественное соответствие еврейскому наречию места.
