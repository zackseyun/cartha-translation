  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: ru
  text: И они вступили в завет[a], чтобы искать Яхве, Бога своих отцов[b], всем сердцем и всей душой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связали себя заветом».'
    reason: lexical_alternative
  - marker: b
    text: То есть Бога, Которому поклонялись их отцы.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: вступили в завет
  rationale: Глагол בוא буквально означает «войти, прийти», а в сочетании с בַבְּרִית передаёт вступление в определённое заветное обязательство. Русское «вступили в завет» сохраняет образ и смысл еврейского выражения.
- source_word: לִדְרוֹשׁ
  choice: искать
  rationale: В религиозном и заветном контексте דרש означает стремиться к Богу, обращаться к Нему и следовать Его воле, а не просто задавать вопросы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Перевод сохраняет грамматически мужское обозначение предков и заветную связь с Богом, Которому поклонялись отцы Израиля.
- source_word: בְּכָל לְבָבָם
  choice: всем сердцем
  rationale: Устойчивое русское выражение точно передаёт целостную внутреннюю решимость, волю и намерение.
- source_word: וּבְכָל נַפְשָׁם
  choice: и всей душой
  rationale: נפשׁ может означать душу, жизнь или самого человека; в данной парной формуле «сердцем и душой» выражена полнота преданности.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Родовое значение אֲבוֹתֵיהֶם
  choice: своих отцов
  alternative: своих предков
  rationale: Еврейское слово имеет форму мужского рода и в контексте указывает на отцов народа как носителей заветной истории; буквальная форма естественна и понятна по-русски.
- issue: Соотношение сердца и души
  choice: всем сердцем и всей душой
  alternative: всей внутренностью и всей жизнью; всем своим существом
  rationale: Сохранена двухчастная заветная формула оригинала без сведения двух понятий к одному и без навязывания строгого философского разделения человеческой природы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис близок к еврейскому оригиналу, при этом естественен для русского читателя; сохранены личное имя Яхве и парная формула «всем сердцем и всей душой».
