  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: ru
  text: И они поклялись Яхве громким голосом, с возгласами, под звуки труб и рогов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово означает шофары — роговые духовые инструменты, часто изготовлявшиеся из бараньих рогов; здесь они отличаются от труб, упомянутых перед ними.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: они поклялись
  rationale: Нифаль глагола שׁבע означает принесение клятвы; «поклялись» кратко и естественно передаёт этот торжественный акт.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог לְ указывает, кому была принесена клятва, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: בְּקוֹל גָּדוֹל
  choice: громким голосом
  rationale: Устойчивое сочетание обозначает громкое произнесение и сохраняет акцент на звучании человеческих голосов.
- source_word: וּבִתְרוּעָה
  choice: с возгласами
  rationale: תְּרוּעָה здесь обозначает громкие коллективные восклицания; перевод не уточняет без достаточных оснований, были ли они радостными или воинственными.
- source_word: וּבַחֲצֹצְרוֹת
  choice: под звуки труб
  rationale: חֲצֹצְרוֹת — прямые металлические трубы, употреблявшиеся при богослужении и собраниях; добавление «под звуки» естественно по-русски выражает инструментальное сопровождение.
- source_word: וּבְשׁוֹפָרוֹת
  choice: и рогов
  rationale: שׁוֹפָרוֹת — духовые инструменты из рога, отличные от ранее названных труб; «рогов» сохраняет это различие и остаётся понятным современному читателю.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя Бога; «Яхве» сохраняет его как имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Повтор предлога ב перед средствами сопровождения передан естественными русскими конструкциями; различие между трубами и рогами сохранено.
