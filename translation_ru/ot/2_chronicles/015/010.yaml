  text: So they gathered at Jerusalem in the third month, in the fifteenth year of Asa's reign.
translation:
  language: ru
  text: И собрались они в Иерусалиме в третьем месяце, в пятнадцатый год царствования Асы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: И собрались они
  rationale: Нифаль формы קבץ здесь имеет возвратно-собирательный смысл и продолжает последовательность повествования. Русское «собрались» естественно передаёт действие группы, а союз «и» сохраняет повествовательную связь.
- source_word: יְרוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Употреблена общепринятая русская форма названия с требуемым по смыслу предложным падежом.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: в третьем месяце
  rationale: Прямое и естественное соответствие древнееврейскому обозначению месяца; название конкретного месяца в исходном тексте не дано.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: в пятнадцатый год
  rationale: В формуле датировки предлог ל перед словом «год» идиоматически передаётся по-русски конструкцией «в ... год».
- source_word: לְמַלְכוּת אָסָא
  choice: царствования Асы
  rationale: מַלְכוּת в данной хронологической формуле обозначает период царской власти; «царствование» точно и естественно передаёт этот смысл.
