source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: ru
  text: Когда Аса услышал эти слова и пророчество пророка Одеда[a], он ободрился, удалил мерзости из всей земли Иуды и Вениамина и из городов, которые захватил в горной области Ефрема, и обновил жертвенник Яхве, стоявший перед притвором храма Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «пророчество пророка Одеда». Некоторые толкователи связывают эти слова с Азарией, сыном Одеда, упомянутым в ближайшем контексте; такое понимание также обсуждается в текстологических исследованиях.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: Когда Аса услышал
  rationale: Сочетание союза и предлога с инфинитивом образует придаточное времени; такая передача естественна по-русски и не добавляет оттенка немедленности.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: В ближайшем контексте речь идёт об услышанной Аса речи, поэтому «слова» точнее контекстуального «дела» или «события».
- source_word: וְהַנְּבוּאָה עֹדֵד הַנָּבִיא
  choice: и пророчество пророка Одеда
  rationale: Передаёт масоретский текст без гармонизации с упоминанием Азарии, сына Одеда, в окружающем контексте.
- source_word: הִתְחַזַּק
  choice: он ободрился
  rationale: Возвратная форма выражает обретение внутренней силы и решимости; «ободрился» естественно передаёт этот смысл.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: удалил мерзости
  rationale: Глагол имеет каузативное значение удаления, а существительное обозначает отвратительные, прежде всего идольские или культовые, предметы; конкретизация не вносится в основной текст.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: из всей земли Иуды и Вениамина
  rationale: Прямая и понятная передача территориального значения אֶרֶץ.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: и из городов, которые захватил в горной области Ефрема
  rationale: לכד означает «захватить», а מֵהַר אֶפְרָיִם здесь передаётся как географическое указание; русский оборот избегает неясного впечатления, будто города физически извлекли из гор.
- source_word: וַיְחַדֵּשׁ
  choice: обновил
  rationale: Сохраняет широкое значение Piel от חדשׁ — сделать новым, обновить, — не сужая его исключительно до физического ремонта.
- source_word: מִזְבַּח יְהוָה
  choice: жертвенник Яхве
  rationale: Сочетание передано прямо, а тетраграмматон — личным именем «Яхве».
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: стоявший перед притвором храма Яхве
  rationale: אוּלָם обозначает храмовый притвор. Слово «храма» добавлено как ясная контекстуальная экспликация принадлежности притвора и не меняет пространственного отношения «перед».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это, не заменяя имя титулом.
- issue: Текстуальное напряжение в выражении «пророчество пророка Одеда»
  choice: 'Следовать масоретскому тексту: «пророчество пророка Одеда»'
  alternative: 'Гармонизировать с контекстом: «пророчество Азарии, сына пророка Одеда»'
  rationale: Предоставленный текст WLC прямо называет Одеда пророком. Контекстуальная трудность отмечается в сноске, но не устраняется молчаливой правкой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Мерзости» сохраняет сильную культово-нравственную оценку исходного слова, а «притвор храма» остаётся понятным без излишне специальной архитектурной лексики.
