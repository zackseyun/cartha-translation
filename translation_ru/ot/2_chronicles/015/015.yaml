  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: ru
  text: И вся Иудея радовалась этой клятве, потому что они поклялись от всего сердца и всем своим желанием искали Его; и Он позволил им найти Себя[a]. И Яхве даровал им покой со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквальнее: «Он был найден ими».'
    reason: Сохраняет формально более буквальное прочтение еврейской пассивной формы и присущую ей неоднозначность.
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל־יְהוּדָה
  choice: И вся Иудея радовалась
  rationale: «Иудея» здесь обозначает народ/царство как единое целое; глагол передаёт общую радость, а не просто удовлетворение.
- source_word: עַל הַשְּׁבוּעָה
  choice: клятве
  rationale: Предлог עַל при глаголе эмоции обозначает предмет или причину радости; русское управление «радоваться чему» передаёт это естественно.
- source_word: בְכָל לְבָבָם נִשְׁבָּעוּ
  choice: они поклялись от всего сердца
  rationale: Сохраняется образ сердца как средоточия искренней и полной преданности.
- source_word: וּבְכָל רְצוֹנָם בִּקְשֻׁהוּ
  choice: искали Его со всем желанием
  rationale: רָצוֹן здесь выражает сильное и добровольное стремление; существительное сохранено, как и параллелизм с «от всего сердца».
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Он дал им найти Себя
  rationale: Формально нифаль допускает «был найден ими», но в контексте поиска Бога оборот также выражает Его благосклонную доступность; выбран естественный русский способ сохранить этот оттенок.
- source_word: וַיָּנַח יְהוָה לָהֶם
  choice: Яхве даровал им покой
  rationale: Каузативная форма נוח означает, что Яхве дал народу покой; «даровал» соответствует возвышенному повествовательному регистру.
- source_word: מִסָּבִיב
  choice: со всех сторон
  rationale: Устойчиво передаёт окружающий покой, подразумевая отсутствие угроз со стороны соседей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное имя, прямо стоящее в еврейском тексте, без замены титулом.
- issue: Смысл וַיִּמָּצֵא לָהֶם применительно к Богу
  choice: Он дал им найти Себя
  alternative: Он был найден ими
  rationale: Основной текст выражает подразумеваемую божественную готовность откликнуться, но примечание сохраняет более формальное и неистолкованное прочтение нифаля.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для чтения вслух; местоимение «Его» указывает на Бога из ближайшего контекста, не подменяя его повтором имени.
