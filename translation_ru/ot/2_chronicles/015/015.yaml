- from: И вся Иудея радовалась клятве, потому что они поклялись от всего сердца и искали Его со всем желанием; и Он дал им найти Себя[a]. И Яхве даровал им покой со всех сторон.
  to: И вся Иудея радовалась этой клятве, потому что они поклялись от всего сердца и всем своим желанием искали Его; и Он позволил им найти Себя[a]. И Яхве даровал им покой со всех сторон.
