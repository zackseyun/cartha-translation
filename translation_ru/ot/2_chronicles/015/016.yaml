  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: ru
  text: Аса лишил даже Мааху, мать царя Асы, статуса царицы-матери, потому что она сделала для Ашеры[b] отвратительное изваяние[a]. Аса срубил её изваяние, раздробил его и сжёг в долине Кедрона[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мерзостное изображение», «ужасный предмет». Редкое еврейское слово обозначает культовый предмет, вызывающий ужас или отвращение.'
    reason: lexical_alternative
  - marker: b
    text: «Ашера» может обозначать ханаанскую богиню либо связанный с ней культовый символ; точная форма предмета здесь не названа.
    reason: cultural_note
  - marker: c
    text: 'Или: «у потока Кедрона», «в русле Кедрона». Еврейское слово может обозначать поток, его русло, вади или долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Даже
  rationale: Союзное сочетание не только добавляет новый факт, но и подчёркивает, что реформа коснулась даже близкой родственницы царя.
- source_word: מַעֲכָה
  choice: Мааха / Мааху
  rationale: Имя передано принятой русской транслитерацией; в данном синтаксическом положении употреблён винительный падеж «Мааху».
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: мать царя Асы
  rationale: Сохраняет прямое обозначение родства и царского статуса Асы без попытки уточнить возможную династическую функцию Маахи.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: лишил положения царицы-матери
  rationale: В царском контексте גְּבִירָה обозначает высокое официальное положение главной женщины двора, обычно царицы-матери; глагол передаёт устранение из этого положения.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: потому что она сделала ... для Ашеры
  rationale: Относительная конструкция здесь естественно выражает причину отстранения. Предлог ל перед אֲשֵׁרָה позволяет понимать предмет как посвящённый Ашере, не отождествляя его безоговорочно с самой Ашерой.
- source_word: מִפְלָצֶת
  choice: отвратительное изваяние
  rationale: 'Редкое существительное обозначает внушающий ужас или отвращение культовый предмет. «Изваяние» добавлено по контексту: предмет был изготовлен, затем срублен, раздроблен и сожжён.'
- source_word: וַיִּכְרֹת
  choice: срубил
  rationale: Глагол означает отсечь или срубить; это естественно соответствует уничтожению, вероятно, деревянного культового предмета.
- source_word: וַיָּדֶק
  choice: раздробил
  rationale: Передаёт разрушение предмета на мелкие части, не преувеличивая степень измельчения словом «истолок в порошок».
- source_word: וַיִּשְׂרֹף
  choice: сжёг
  rationale: Прямое и естественное соответствие еврейскому глаголу сжигания.
- source_word: בְּנַחַל קִדְרוֹן
  choice: в долине Кедрон
  rationale: נַחַל может обозначать поток, русло, вади или долину; «долина Кедрон» понятно современному читателю и соответствует географическому контексту.
theological_decisions:
- issue: Значение אֲשֵׁרָה
  choice: Ашера
  alternative: столб Ашеры; священное дерево; роща
  rationale: Транслитерация сохраняет связь с ханаанским божеством и связанным с ним культовым символом, не навязывая точную форму предмета, которой еврейский текст здесь не определяет.
- issue: Статус גְּבִירָה
  choice: царица-мать
  alternative: госпожа; первая женщина двора
  rationale: В контексте иудейской монархии слово обозначает признанное придворное положение матери или иной старшей женщины царской династии. Перевод передаёт историческую функцию, не добавляя богословского толкования.
- issue: Характер предмета מִפְלָצֶת
  choice: отвратительное изваяние
  alternative: ужасный предмет; мерзостное изображение; непристойный идол
  rationale: Сохранена отрицательная, вызывающая отвращение оценка редкого еврейского слова, но не уточняется, было ли изображение непристойным или какую именно форму оно имело.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет начальное ударение на слове «Даже», а повтор имени Асы устраняет неясность местоимения. Термины древнего культа не заменены конфессионально окрашенными или устаревшими обозначениями.
