source:
  edition: WLC
  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: ru
  text: Народ был сокрушён народом, и город — городом, потому что Бог приводил их в смятение всевозможными бедствиями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повергал их в смятение всякими бедами».'
    reason: 'Лексическая альтернатива: המם допускает более сильную передачу внезапного замешательства или паники, а צָרָה — перевод «беда» наряду с «бедствием».'
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: был сокрушён / был сокрушён (подразумевается во второй части)
  rationale: Пуаль глагола כתת выражает претерпеваемое разрушительное действие — «быть сокрушённым, разбитым». Единственное число в русской фразе сохраняет распределительную форму еврейского текста.
- source_word: גוֹי בְּגוֹי
  choice: народ был сокрушён народом
  rationale: Предлог ב обозначает здесь противодействующую или действующую сторону. Такая конструкция сохраняет и враждебное столкновение, и страдательный залог оригинала.
- source_word: וְעִיר בְּעִיר
  choice: и город — городом
  rationale: 'Эллиптическая конструкция естественна по-русски и передаёт краткий параллелизм оригинала: сказуемое «был сокрушён» подразумевается.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину описанного разорения; «потому что» ясно и естественно выражает причинную связь.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма употреблена с глаголом в единственном числе и в данном контексте обозначает единого Бога.
- source_word: הֲמָמָם
  choice: приводил их в смятение
  rationale: Глагол המם обозначает вызванные потрясение, смятение, панику или замешательство. Выбор сохраняет активное действие Бога и объектный суффикс «их», не сужая значение до одного лишь физического поражения.
- source_word: בְּכָל צָרָה
  choice: всевозможными бедствиями
  rationale: Предлог ב имеет инструментальное значение, а כָּל при существительном передаёт всеохватность. Формулировка естественно выражает средство и многообразие бедствий.
theological_decisions:
- issue: Причинность и участие Бога в бедствиях
  choice: Бог приводил их в смятение всевозможными бедствиями
  alternative: Бог допускал, чтобы они терпели бедствия
  rationale: В еврейском тексте Бог прямо выступает подлежащим активного глагола. Перевод сохраняет заявленное божественное действие, не смягчая его до простого допущения и не добавляя объяснений, отсутствующих в тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом. Эллипсис «и город — городом» избегает тяжеловесного повтора, сохраняя структуру еврейского стиха.
