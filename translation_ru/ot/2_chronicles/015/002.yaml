  - severity: low
    issue: «Пока вы с Ним» может звучать как указание на срок, а не как обстоятельство одновременности.
    rationale: בִּהְיוֹתְכֶם עִמּוֹ буквально означает «когда/в то время как вы с Ним». «Когда» точнее сохраняет временно-условный характер конструкции.
