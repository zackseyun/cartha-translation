  to: 'Он вышел навстречу Асе и сказал ему: «Послушайте меня, Аса и весь народ Иуды и Вениамина! Яхве с вами, когда вы с Ним. Если будете искать Его, Он будет найден вами, а если оставите Его, Он оставит вас».'
  rationale: Устранено невыраженное в оригинале каузативное добавление «даст вам». Пассивный перевод «Он будет найден вами» непосредственно отражает нифаль יִמָּצֵא и не навязывает богословского объяснения. «Когда вы с Ним» точнее передаёт בִּהְיוֹתְכֶם, сохраняя условную взаимность фразы. Поскольку буквальный вариант нифаля теперь находится в основном тексте, прежняя сноска больше не требуется.
