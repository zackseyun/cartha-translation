  text: וַ/יֵּצֵא֮ לִ/פְנֵ֣י אָסָא֒ וַ/יֹּ֣אמֶר ל֔/וֹ שְׁמָע֕וּ/נִי אָסָ֖א וְ/כָל יְהוּדָ֣ה וּ/בִנְיָמִ֑ן יְהוָ֤ה עִמָּ/כֶם֙ בִּֽ/הְיֽוֹתְ/כֶ֣ם עִמּ֔/וֹ וְ/אִֽם תִּדְרְשֻׁ֨/הוּ֙ יִמָּצֵ֣א לָ/כֶ֔ם וְ/אִם תַּעַזְבֻ֖/הוּ יַעֲזֹ֥ב אֶתְ/כֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: ru
  text: 'Он вышел навстречу Асе и сказал ему: «Послушайте меня, Аса и весь народ Иуды и Вениамина! Яхве с вами, когда вы с Ним. Если будете искать Его, Он будет найден вами, а если оставите Его, Он оставит вас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: Он вышел навстречу Асе
  rationale: В сочетании с глаголом движения לִפְנֵי естественно обозначает выход навстречу кому-либо; перевод сохраняет повествовательную последовательность и смысл идиомы.
- source_word: שְׁמָעוּנִי
  choice: Послушайте меня
  rationale: Императив множественного числа с суффиксом первого лица обращён и к Асе, и ко всему народу; современное «послушайте» естественно передаёт настойчивый пророческий призыв.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между Божьим именем и титулом «Господь».
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: с вами ... вы с Ним
  rationale: Повтор предлога «с» сохраняет краткость, симметрию и взаимность еврейской формулировки.
- source_word: בִּהְיוֹתְכֶם
  choice: пока вы
  rationale: Инфинитивная конструкция с ב выражает временно-условное отношение; «пока» ясно передаёт продолжающееся условие.
- source_word: תִּדְרְשֻׁהוּ
  choice: будете искать Его
  rationale: דרש в религиозно-заветном контексте означает стремиться к Богу и искать Его, а не только вопрошать Его.
- source_word: יִמָּצֵא לָכֶם
  choice: Он даст вам найти Себя
  rationale: Нифаль глагола מצא буквально означает «быть найденным». Русская формулировка передаёт допущение со стороны Бога, не устраняя при этом залоговую неоднозначность; буквальный вариант дан в сноске.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: оставите Его ... Он оставит вас
  rationale: Повтор одного русского глагола сохраняет лексическую взаимность оригинала. «Оставить» здесь естественно и достойно передаёт заветный смысл отступничества без архаизма «покинуть/оставить» в разных формах.
theological_decisions:
- issue: Условная взаимность в заветной речи
  choice: «Яхве с вами, пока вы с Ним… если оставите Его, Он оставит вас»
  alternative: Смягчить условные высказывания, представив их лишь как описание человеческого переживания Божьего присутствия
  rationale: Еврейский текст прямо выражает временно-условную связь и взаимность. Перевод сохраняет богословское напряжение, не выводя из одного стиха более широкого учения о стойкости или отпадении.
- issue: Значение нифаля יִמָּצֵא
  choice: «Он даст вам найти Себя» с буквальной альтернативой в сноске
  alternative: «Он будет найден вами»
  rationale: Основной вариант звучит естественно по-русски и допускает оттенок Божьей доступности, тогда как сноска сохраняет формальную пассивность и подлинную неоднозначность исходной формы.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Множественное «послушайте» согласовано с составным обращением. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции; имя Яхве передано прямо.
