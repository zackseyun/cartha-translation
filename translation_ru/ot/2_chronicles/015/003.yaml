  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: ru
  text: Долгое время Израиль оставался без истинного Бога[a], без священника-наставника и без наставления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бога истины»; выражение может подчёркивать как истинность, так и верность Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закона» или «учения». Еврейское слово тора может означать наставление, учение или закон — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: Долгое время
  rationale: Буквально «и многие дни»; русское «долгое время» естественно передаёт длительность, а начальный союз поглощён связным повествованием.
- source_word: לְיִשְׂרָאֵל
  choice: Израиль оставался
  rationale: Предлог לְ обозначает состояние или отношение; в русском необходима глагольная связка. «Оставался» естественно выражает продолжительное состояние, заданное оборотом «долгое время».
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: без истинного Бога
  rationale: Повторяющаяся конструкция לְלֹא передана словом «без». Сочетание אֱלֹהֵי אֱמֶת буквально допускает «Бог истины», но в контексте естественно означает истинного, подлинного Бога.
- source_word: כֹּהֵן מוֹרֶה
  choice: священника-наставника
  rationale: Причастие מוֹרֶה обозначает того, кто учит или наставляет. Сложное наименование кратко и ясно передаёт наставническую функцию священника.
- source_word: תּוֹרָה
  choice: наставления
  rationale: Здесь תּוֹרָה может означать наставление, учение или закон. «Наставление» сохраняет широкое значение слова и связь с обязанностью священника учить, не сводя смысл только к своду законов.
theological_decisions:
- issue: Значение אֱלֹהֵי אֱמֶת
  choice: истинного Бога
  alternative: Бога истины
  rationale: Основной текст передаёт наиболее естественный для контекста смысл, но примечание сохраняет буквальную конструкцию и оттенок верности или истинности.
- issue: Значение תּוֹרָה
  choice: наставления
  alternative: закона
  rationale: Еврейское слово шире юридического понятия закона и в данном окружении связано со священническим учением. Альтернативное традиционное значение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык, умеренно торжественный и понятный широкому читателю. Трёхчастный параллелизм еврейского текста сохранён повтором «без».
