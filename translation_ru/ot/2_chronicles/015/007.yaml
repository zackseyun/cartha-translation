base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: ru
  text: Вы же будьте тверды, и пусть руки ваши не ослабевают[a], потому что за ваш труд есть награда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение означает не терять сил, решимости или мужества.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Вы же
  rationale: Союз с самостоятельным местоимением выражает контрастивное выделение; «вы же» естественно передаёт его по-русски в контексте увещевания.
- source_word: חִזְקוּ
  choice: будьте тверды
  rationale: Императив множественного числа призывает к силе, стойкости и решимости. «Будьте тверды» естественно сочетается с последующим образом ослабевающих рук.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: и пусть руки ваши не ослабевают
  rationale: Сохранён конкретный еврейский образ рук, выражающий утрату сил, решимости или мужества; отрицательная конструкция передана как увещевательное запрещение.
- source_word: כִּי יֵשׁ
  choice: потому что ... есть
  rationale: כִּי вводит основание призыва, а יֵשׁ является экзистенциальной частицей. Перевод не превращает утверждение в явно будущее время.
- source_word: שָׂכָר
  choice: награда
  rationale: Слово может обозначать награду, плату или воздаяние. «Награда» сохраняет широкое значение и не сводит речь к наёмной оплате.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: за ваш труд
  rationale: Существительное обозначает дело, работу или труд. «За ваш труд» звучит естественно и сохраняет связь награды с деятельным усилием.
theological_decisions:
- issue: Характер обещанного воздаяния
  choice: потому что за ваш труд есть награда
  alternative: потому что ваш труд будет вознаграждён
  rationale: Исходный текст утверждает наличие награды, но не уточняет её природу и не формулирует отдельного учения о заслугах. Сохранена исходная напряжённость без добавления богословских категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Порядок «руки ваши» слегка возвышенный, но естественный для библейского увещевания и сохраняет акцент на образе рук.
