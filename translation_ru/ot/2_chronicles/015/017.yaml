  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: ru
  text: Но высоты не были устранены из Израиля; и всё же сердце Асы оставалось цельным во все его дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Устоявшийся библейский термин для культовых мест на возвышенностях или возвышенных площадках; контекст не позволяет уточнить их характер без добавочной интерпретации.
- source_word: לֹא סָרוּ
  choice: не были устранены
  rationale: Передаёт значение удаления или прекращения существования высот, сохраняя безличную форму исходного текста.
- source_word: שָׁלֵם
  choice: цельным
  rationale: Буквально передаёт идею целостности и неразделённости сердца, не сводя её исключительно к нравственному совершенству или полной преданности.
- source_word: כָּל יָמָיו
  choice: во все его дни
  rationale: Сохраняет идиоматический образ оригинала в понятной литературной русской форме.
theological_decisions:
- issue: Соотношение неустранённых высот и оценки сердца Асы
  choice: 'Сохранено противопоставление: «и всё же сердце Асы оставалось цельным»'
  alternative: «но Аса был полностью предан Богу»
  rationale: Оригинал намеренно удерживает напряжение между продолжающимся существованием высот и положительной оценкой сердца Асы; добавление объекта преданности или идеи безусловного совершенства сузило бы смысл.
translation_notes:
  register: Современный литературный русский с сохранением традиционного термина «высоты». Формулировка выдержана в сдержанном повествовательном регистре и сохраняет богословскую неоднозначность слова שָׁלֵם.
