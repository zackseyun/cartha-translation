  source_fidelity: 'Текст точно передаёт оба утверждения еврейского оригинала: высоты «не были устранены из Израиля» (וְהַבָּמוֹת לֹא סָרוּ מִיִּשְׂרָאֵל) и сердце Асы было שָׁלֵם «во все его дни». Противительное «и всё же» обоснованно передаёт רַק, не устраняя намеренное напряжение между этими частями стиха.'
