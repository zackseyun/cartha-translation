base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: ru
  text: В те времена не было мира ни для выходящего, ни для входящего[a], потому что многочисленные волнения охватили всех жителей земель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «выходить и входить» — еврейский оборот, обозначающий обычные передвижения человека, особенно поездки и общественную деятельность.
    reason: cultural_note
  - marker: b
    text: 'Или: «великие смуты». Еврейское слово может означать смуту, замешательство или панику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: В те времена
  rationale: Естественная русская временная формула, сохраняющая множественное число עִתִּים и указательное значение הָהֵם; начальный союз в русском не обязателен для связи внутри данного стиха.
- source_word: אֵין שָׁלוֹם
  choice: не было мира
  rationale: שָׁלוֹם охватывает мир, благополучие и безопасность. «Не было мира» сохраняет широту исходного слова, а последующий контекст указывает и на отсутствие безопасности.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: ни выходящему, ни входящему
  rationale: Субстантивированные причастия передают единично-обобщённую форму еврейского выражения. Конструкция «ни… ни…» естественно сочетается с отрицанием и сохраняет парный образ.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину отсутствия мира; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: מְהוּמֹת רַבּוֹת
  choice: великие смуты
  rationale: מְהוּמָה может обозначать смятение, беспорядок, панику или общественную неурядицу. «Великие смуты» передаёт множественное число и силу רַבּוֹת, не сводя значение только к панике.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: обрушились на всех жителей земель
  rationale: Глагольная формулировка «обрушились на» естественно передаёт образ бедствий, тяготеющих над людьми, заключённый в עַל. «Земель» сохраняет множественное число הָאֲרָצוֹת и не ограничивает речь одной страной.
