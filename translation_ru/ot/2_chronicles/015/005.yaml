  source_fidelity: 'Основной смысл передан точно: временная рамка, отсутствие шалом для выходящих и входящих, причинная связь и множественное число «земель» сохранены. Однако רַבּוֹת прежде всего означает «многочисленные», тогда как «великие» смещает значение к масштабу/силе. Глагол «обрушились» также несколько усиливает образ внезапного бедствия, которого в еврейском тексте нет.'
  naturalness: «Не было мира ни выходящему, ни входящему» понятно, но конструкция с «для» несколько естественнее в современном литературном русском. «Многочисленные волнения охватили» звучит естественно и передаёт общественную нестабильность без излишней конкретизации.
