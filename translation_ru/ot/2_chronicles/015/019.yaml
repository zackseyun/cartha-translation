  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: ru
  text: И не было войны до тридцать пятого года царствования Асы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые толкователи относят это число к более широкой системе летосчисления, а не непосредственно к годам царствования Асы, чтобы согласовать его с другими библейскими хронологическими указаниями.
    reason: Сохраняет прямое чтение еврейского текста и отмечает существующее хронологическое толкование без гармонизации основного текста.
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: И не было войны
  rationale: Сочетание существительного מִלְחָמָה с отрицанием и бытийным глаголом естественно передаётся по-русски безличной конструкцией «не было войны»; союз וּ сохраняет связь с предыдущим повествованием.
- source_word: עַד
  choice: до
  rationale: В данном временном обороте предлог обозначает конечную границу периода без войны; русское «до» точно и естественно передаёт этот смысл.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: тридцать пятого года
  rationale: Конструкция «год» с количественным числительным в еврейском тексте в русской формуле датировки естественно передаётся порядковым числительным.
- source_word: לְ/מַלְכוּת
  choice: царствования
  rationale: מַלְכוּת здесь обозначает период царского правления; «царствование» соответствует контексту формулы лет правления.
- source_word: אָסָא
  choice: Асы
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительный падеж согласно синтаксису фразы.
theological_decisions:
- issue: Хронологическое соотношение с другими повествованиями о царствовании Асы
  choice: Сохранить прямое указание масоретского текста на тридцать пятый год царствования Асы.
  alternative: Понимать число в рамках более широкой системы летосчисления либо исправлять его ради согласования с параллельными местами.
  rationale: Еврейский текст прямо связывает этот год с царствованием Асы. Перевод не должен скрыто устранять хронологическое напряжение; возможное иное исчисление уместно отметить в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная формула сохраняет достоинство и синтаксическую простоту оригинала. Частица «И» передаёт связь стиха с предыдущим контекстом.
