  text: וַ/עֲזַרְיָ֨הוּ֙ בֶּן עוֹדֵ֔ד הָיְתָ֥ה עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: ru
  text: И на Азарию, сына Одеда, сошёл Дух Божий[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух Божий был на Азарии, сыне Одеда».'
    reason: 'Лексико-аспектуальная альтернатива: הָיְתָה עָלָיו буквально может описывать состояние «был на нём», а не наступление действия.'
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: И на Азарию
  rationale: Союз וַ передаёт продолжение повествования. В русском предложении имя поставлено после предлога из оборота «сошёл на», поэтому употреблён винительный падеж.
- source_word: בֶּן עוֹדֵד
  choice: сына Одеда
  rationale: בֶּן здесь естественно обозначает непосредственное сыновство; имена переданы в традиционной русской библейской форме.
- source_word: הָיְתָה עָלָיו
  choice: сошёл ... на
  rationale: Буквально выражение означает «был на нём», однако в контексте пророческого вдохновения допускает событийное значение. «Сошёл на» естественно по-русски передаёт наступление этого состояния, не добавляя цели или результата.
- source_word: רוּחַ אֱלֹהִים
  choice: Дух Божий
  rationale: В данном контексте сочетание обозначает Божьего Духа, вдохновляющего Азарию на последующую пророческую речь. Традиционная и ясная русская передача — «Дух Божий».
theological_decisions:
- issue: Передавать ли רוּחַ אֱלֹהִים как личностное «Дух Божий» или неопределённое «дух от Бога»
  choice: Дух Божий
  alternative: дух от Бога; божественный дух
  rationale: Формула Летописца вводит боговдохновенную речь названного пророка. «Дух Божий» лучше всего соответствует контексту и определённому смыслу конструкции, не развивая богословие дальше сказанного в тексте.
- issue: Передавать ли הָיְתָה עָלָיו событийно или статично
  choice: сошёл ... на
  alternative: был на
  rationale: Контекст начала пророческого действия поддерживает событийное прочтение, однако грамматически возможное статичное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской формой «Дух Божий». Порядок слов естественен для русского повествования; формулировка краткая и торжественная без архаизации.
