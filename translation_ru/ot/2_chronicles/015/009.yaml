base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: ru
  text: И собрал он всю Иудею и Вениамина, а также живших среди них переселенцев из Ефрема, Манассии и Симеона, потому что многие из Израиля перешли на его сторону[a], увидев, что Яхве, его Бог, был с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пали к нему»; то есть присоединились к Асе, перейдя на его сторону.'
    reason: Сохраняет буквальный образ еврейской идиомы и поясняет её смысл в данном контексте.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: И собрал он
  rationale: Форма глагола קבץ обозначает собирание людей; такой перевод сохраняет повествовательную последовательность и естественно звучит по-русски.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: всю Иудею и Вениамина
  rationale: Названия областей и колен метонимически обозначают их население. Сохранена краткая форма исходного текста.
- source_word: וְהַגָּרִים עִמָּהֶם
  choice: а также живших среди них переселенцев
  rationale: גרים обозначает пришлых людей, проживающих не в своей родной среде. «Переселенцы» понятно современному читателю, а «среди них» естественно передаёт их проживание вместе с Иудеей и Вениамином.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: из Ефрема, Манассии и Симеона
  rationale: Предлог מן указывает на происхождение этих переселенцев из названных колен или областей.
- source_word: נָפְלוּ עָלָיו
  choice: перешли на его сторону
  rationale: Буквально «пали к нему»; в данном политическом контексте идиома означает смену принадлежности и присоединение к Асе. Перевод передаёт смысл, не усиливая его до обязательно враждебного «перебежали».
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: многие из Израиля
  rationale: לרב выражает многочисленность; выбран краткий и естественный русский эквивалент.
- source_word: בִּרְאֹתָם
  choice: увидев
  rationale: Инфинитивная конструкция с ב обозначает сопутствующее обстоятельство, здесь одновременно раскрывающее основание их перехода.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: его Бог, с ним
  rationale: Прямо сохраняет утверждение о Божьем присутствии и поддержке, не конкретизируя способ этой поддержки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер присоединения израильтян к Асе
  choice: перешли на его сторону
  alternative: присоединились к нему / перебежали к нему / пали к нему
  rationale: Идиома נפל על указывает на переход к другому правителю или лагерю. Выбранная формулировка сохраняет политическую направленность, но не приписывает людям мотивов, которых стих прямо не называет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка приподнят, но понятен обычному читателю; архаизмы и конфессионально окрашенные уточнения исключены.
