base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: ru
  text: 'В тот день они принесли Яхве в жертву из добычи, которую доставили: семьсот голов крупного скота и семь тысяч голов мелкого скота.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «мелкий скот», может включать овец и коз.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: принесли в жертву
  rationale: В культовом контексте глагол זבח означает заклание и принесение животных в жертву; русское выражение естественно передаёт жертвенный смысл.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата жертвы, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественная передача еврейского обстоятельства времени в современном русском языке.
- source_word: מִן הַשָּׁלָל
  choice: из добычи
  rationale: שָׁלָל обозначает добычу, захваченную в военном столкновении; «добыча» точно и без излишней архаики передаёт значение.
- source_word: הֵבִיאוּ
  choice: которую привели
  rationale: Поскольку речь далее идёт о животных, «привели» контекстуально точнее общего «принесли». Придаточное сохраняет связь добычи с предшествующим действием.
- source_word: בָּקָר
  choice: голов крупного скота
  rationale: בָּקָר — собирательное обозначение крупного рогатого скота; счётное слово «голов» делает сочетание с числительным естественным по-русски.
- source_word: וְצֹאן
  choice: голов мелкого скота
  rationale: צֹאן охватывает мелкий домашний скот, прежде всего овец и коз; такая передача сохраняет широту еврейского слова и не сужает его до одних овец.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому транслитерация сохраняет его отличие от титула «Господь»; форма «Яхве» наиболее вероятно отражает древнее произношение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Термины для двух категорий скота передают собирательный характер еврейских слов; добавление «голов» обеспечивает естественное русское счисление.
