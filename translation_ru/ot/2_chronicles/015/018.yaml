  text: 'Он внёс в Дом Божий посвящённые дары своего отца и свои посвящённые дары: серебро, золото и сосуды.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו וְקָדָשָׁיו
  choice: посвящённые дары своего отца и свои собственные посвящённые дары
  rationale: Форма קָדְשֵׁי / קָדָשָׁיו обозначает посвящённые святыни или предметы; в данном перечне ценностей естественное русское «посвящённые дары» передаёт их культовое назначение, не подразумевая жертвоприношение.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Бога
  rationale: Прямо передаёт древнееврейское выражение и сохраняет принятую в контексте Паралипоменона характеристику храма.
- source_word: כֵלִים
  choice: сосуды
  rationale: В храмовом контексте слово обозначает утварь, предметы или сосуды; «сосуды» является точным традиционным обозначением наряду с серебром и золотом.
theological_decisions:
- issue: Характер посвящённых предметов
  choice: посвящённые дары
  alternative: святыни / священные предметы
  rationale: Выбрано выражение, которое ясно показывает, что имущество было отделено для Бога, но не уточняет сверх текста, каким именно образом оно было посвящено.
translation_notes:
  register: Современный литературный русский язык; краткий, dignified повествовательный стиль. Повтор исходного выражения сохранён ради разграничения даров отца и даров самого царя.
