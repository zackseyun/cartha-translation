- from: Но в бедствии своём он обратился к Яхве[a], Богу Израиля; они стали искать Его, и Он дал им найти Себя[b].
  to: Но в своей беде они вернулись к Яхве[a], Богу Израиля, искали Его, и Он дал им найти Себя[b].
  rationale: Устранены неестественная и референтно неясная смена числа в русском тексте и добавочный начинательный оттенок «стали». Множественное «они» передаёт коллективное значение Израиля в контексте, тогда как буквальная пассивная возможность заключительного глагола сохранена в примечании. Смысл Божьей отзывчивости в основном тексте не выходит за пределы допустимого значения נִמְצָא в данном контексте.
