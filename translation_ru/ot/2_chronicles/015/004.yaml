  source_fidelity: Начальное единственное число в еврейском тексте, вероятно, имеет коллективное значение по отношению к Израилю; дальнейшие формы стоят во множественном числе. В русском варианте «он обратился… они стали искать» без явно названного референта создаёт неоправданно резкий и неясный разрыв. «Стали искать» также добавляет значение начала действия, отсутствующее в וַיְבַקְשֻׁהוּ. Формула «дал им найти Себя» допустимо передаёт контекстуальный смысл נִמְצָא, а примечание сохраняет буквальный пассивный вариант.
  naturalness: Исправленный текст использует естественное современное русское множественное число для коллективного Израиля и не создаёт неясного местоименного перехода. «В своей беде» и «вернулись к Яхве» литературны и соответствуют контексту возобновлённого обращения к Богу.
  terminology: «Яхве, Бог Израиля» точно передаёт имя יהוה и конструкцию אֱלֹהֵי יִשְׂרָאֵל. Прописные местоимения в отношении Бога приемлемы как редакционная норма. Примечание к имени уместно; примечание к заключительной фразе верно фиксирует более буквальное пассивное прочтение.
