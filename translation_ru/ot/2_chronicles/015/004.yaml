base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: ru
  text: Но в своей беде они вернулись к Яхве[a], Богу Израиля, искали Его, и Он дал им найти Себя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога Израиля; традиционно передаётся как «Господь».
    reason: divine_name
  - marker: b
    text: 'Или, более буквально: «и Он был найден ими».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: обратился
  rationale: Глагол שׁוב означает «вернуться, обратиться». При дополнении, обозначающем Бога, русское «обратился к» естественно передаёт возобновлённое обращение к Нему.
- source_word: בַּצַּר לוֹ
  choice: в бедствии своём
  rationale: Форма буквально имеет единственное число («в бедствии его»), вероятно коллективно относящееся к Израилю. Единственное число сохранено, чтобы не устранять грамматическое напряжение оригинала.
- source_word: עַל יְהוָה
  choice: к Яхве
  rationale: В сочетании с שׁוב предлог עַל обозначает направленность обращения. Личное имя יהוה передано как «Яхве», а не заменено титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богу Израиля
  rationale: Прямая передача сочетания, сохраняющая отождествление Яхве с Богом Израиля.
- source_word: וַיְבַקְשֻׁהוּ
  choice: они стали искать Его
  rationale: בקשׁ с личным объектом означает искать кого-либо; применительно к Богу речь идёт об обращении к Нему и стремлении обрести Его. Множественное число оригинала сохранено.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Он дал им найти Себя
  rationale: Нифаль מצא буквально допускает «был найден ими», но в отношении Бога может выражать доступность и ответное действие. Формулировка сохраняет божественную инициативу, не создавая впечатления случайной находки.
theological_decisions:
- issue: Переход от коллективного единственного числа к множественному
  choice: Сохранить «он… своём», затем «они… им»
  alternative: 'Согласовать всё во множественном числе: «они в своём бедствии обратились»'
  rationale: В еврейском тексте וַיָּשָׁב и לוֹ стоят в единственном числе, тогда как последующие формы — во множественном. Сохранение перехода позволяет читателю увидеть коллективный способ говорить об Израиле и не сглаживает исходную неоднозначность.
- issue: Характер Божьего ответа в וַיִּמָּצֵא לָהֶם
  choice: «Он дал им найти Себя»
  alternative: «Он был найден ими»
  rationale: Альтернатива формально ближе к пассивной форме и указана в примечании. Основной вариант естественнее по-русски применительно к Богу и передаёт Его отзывчивость, не утверждая сверх того конкретного механизма действия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён заметный переход от коллективного единственного числа к множественному; прописные местоимения при указании на Бога применены как допустимая русская издательская норма.
