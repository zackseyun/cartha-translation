base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: ru
  text: А всякий, кто не станет искать Господа[a], Бога Израиля, должен был быть казнён — от малого до великого[b], от мужчины до женщины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит личное имя Бога — יהוה (ЙХВХ), традиционно передаваемое словом «Господь».
    reason: divine_name
  - marker: b
    text: 'Или: «от самого незначительного до самого знатного». Это еврейское выражение указывает на всех членов общины без исключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: А всякий, кто
  rationale: Передаёт всеохватность относительной конструкции и естественно звучит в современном русском языке.
- source_word: לֹא יִדְרֹשׁ
  choice: не станет искать
  rationale: Глагол דרשׁ в богословской лексике Летописца означает обращение к Богу и стремление следовать Ему. Будущая форма с «станет» сохраняет волевой и нормативный оттенок условия клятвы.
- source_word: לַיהוָה
  choice: Господа
  rationale: Личное имя יהוה передано принятой в русской библейской традиции формой «Господь»; источник пояснён в сноске.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая передача сопряжённой конструкции, уточняющей, о каком Боге идёт речь.
- source_word: יוּמָת
  choice: должен был быть предан смерти
  rationale: Каузативно-пассивная форма глагола מות обозначает предание смерти. Сочетание «должен был» передаёт юридическую силу условия внутри повествования о заключённой клятве.
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Сохранён еврейский меризм, охватывающий людей любого положения или значимости без неоправданного сведения выражения к возрасту.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: от мужчины до женщины
  rationale: Сохранены единственное число и второй меризм, подчёркивающий всеобщий охват общины.
theological_decisions:
- issue: Передача суровой санкции за нарушение заветной клятвы
  choice: Прямо сохранить предписание о предании смерти.
  alternative: Передать как «умрёт», отлучение от общины или только как образное проклятие.
  rationale: Форма יוּמָת прямо выражает причинение смерти в пассивной конструкции; перевод не должен смягчать или переосмыслять заявленную в повествовании санкцию.
- issue: Значение «искать Господа»
  choice: Сохранить широкое заветное выражение «искать Господа».
  alternative: Сузить смысл до «вопрошать Господа» или развернуть его как «поклоняться Господу и повиноваться Ему».
  rationale: דרשׁ допускает широкий религиозный смысл, характерный для Летописца. Более узкий или развёрнутый перевод снял бы присущую выражению смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Юридический оттенок клятвы сохранён без архаизмов; два еврейских меризма переданы близко к форме источника.
