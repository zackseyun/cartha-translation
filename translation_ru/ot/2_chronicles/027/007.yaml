  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: ru
  text: Остальные дела Иофама[a], все его войны и его пути[b] — вот, всё это записано в Книге царей Израиля и Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остальные сведения об Иофаме»; употреблённое здесь еврейское выражение обозначает дела царя и события его правления.'
    reason: lexical_alternative
  - marker: b
    text: «Его пути» может также означать «его поведение» или «его образ жизни».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Остальные дела Иофама
  rationale: В царской итоговой формуле דִּבְרֵי означает не только «слова», но дела и события правления; «дела» естественно передаёт этот историографический смысл. Начальный ו не требует отдельного русского союза в данном резюмирующем предложении.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: все его войны
  rationale: Прямо передаёт множественное מִלְחָמוֹת, не сужая значение до отдельных сражений или военных походов.
- source_word: וּדְרָכָיו
  choice: и его пути
  rationale: Сохраняет метафору דֶּרֶךְ и допускает заложенный в ней смысл образа жизни и поведения; этот смысл пояснён в сноске.
- source_word: הִנָּם כְּתוּבִים
  choice: вот, они записаны
  rationale: «Вот» сохраняет указательно-усилительную функцию הִנָּם, а «записаны» естественно по-русски передаёт архивный контекст причастия כְּתוּבִים.
- source_word: עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: в Книге царей Израиля и Иудеи
  rationale: Русское «в Книге» идиоматически передаёт еврейское עַל סֵפֶר в формуле ссылки на письменный источник; прописная буква показывает название упоминаемой летописи.
