base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: ru
  text: Он поступал правильно в глазах Яхве, во всём так же, как поступал его отец Озия, только не входил в храм Яхве[a]. Но народ по-прежнему поступал порочно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова, вероятно, противопоставляют Иофама Озии, который самовольно вошёл в храм (см. 2 Пар. 26:16–21). Возможный перевод: «не заходил в храм Яхве».'
    reason: cross_reference
  - marker: b
    text: 'Возможный перевод: «народ по-прежнему развращался» или «народ по-прежнему поступал порочно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Он поступал правильно
  rationale: Сочетание буквально означает «делал правильное». Русское «поступал правильно» естественно передаёт обобщённую нравственную оценку правления.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образ распространённого древнееврейского оценочного оборота; личное имя יהוה передано как «Яхве».
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: во всём так же, как поступал его отец Озия
  rationale: Передана полнота соответствия примеру отца и использован естественный для русского языка порядок слов.
- source_word: רַק
  choice: только
  rationale: Слово вводит ограничение к предыдущему сопоставлению с Озией, не превращая его в самостоятельное резкое противопоставление.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: не входил в храм Яхве
  rationale: בוא с אֶל здесь обозначает вхождение внутрь; הֵיכָל в данном контексте — храм Яхве.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: Но народ по-прежнему жил порочно
  rationale: וְעוֹד выражает продолжение прежнего состояния, а причастие Hiphil от שׁחת описывает продолжающееся порочное поведение. Формулировка не навязывает явно ни возвратное, ни переходное понимание глагола.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога — тетраграмматон יהוה; транслитерация сохраняет различие между именем и титулом.
- issue: Связь поведения Иофама с поступком Озии в храме
  choice: Ограничение передано словами «только не входил в храм Яхве»
  alternative: Истолковать это как прямое указание на незаконное вхождение Озии
  rationale: Контекст 2 Пар 26:16–21 делает противопоставление вероятным, однако сам стих не повторяет обстоятельства поступка Озии; пояснение поэтому вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и повествовательный. Сохранён понятный русский вариант древнееврейского образа «в глазах Яхве», а спорные оттенки последнего причастия вынесены в сноску.
