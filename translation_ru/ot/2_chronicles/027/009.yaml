base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: ru
  text: И почил Иофам с отцами своими[a], и похоронили его в городе Давида. И вместо него воцарился сын его Ахаз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «умер, как и его предки». Буквально в еврейском тексте: «лёг с отцами своими» — это обычная формула сообщения о смерти царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В царской формуле שׁכב означает смерть. Русское «почил» сохраняет образ сна и при этом естественно выражает смерть в dignified biblical register.
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохранена традиционная династическая формула и буквальный образ еврейского текста; вариант «с предками» яснее, но менее формально соответствует оригиналу.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: похоронили его
  rationale: Передан активный глагол во множественном числе с неопределённым субъектом, как в еврейском тексте.
- source_word: בְּעִיר דָּוִיד
  choice: в городе Давида
  rationale: Прямо и естественно передаёт устойчивое наименование места.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В контексте престолонаследия глагол обозначает вступление на царство; «воцарился» кратко и естественно передаёт это значение.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт замещение на престоле и династическую преемственность, не сводя выражение лишь к временной последовательности.
- source_word: יוֹתָם
  choice: Иофам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אָחָז
  choice: Ахаз
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בְּנוֹ
  choice: сын его
  rationale: Родственное обозначение сохранено явно как часть формулы престолонаследия.
