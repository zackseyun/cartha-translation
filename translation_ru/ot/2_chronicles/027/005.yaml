  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: ru
  text: Он воевал с царём аммонитян и одолел их. В тот год аммонитяне дали ему сто талантов серебра, десять тысяч мер — коров — пшеницы и десять тысяч мер ячменя[a]. То же самое аммонитяне выплатили ему и во второй, и в третий год.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кор — древняя мера объёма для сыпучих веществ. В еврейском тексте слово «коры» названо только при пшенице и подразумевается также при ячмене.
    reason: лексический эллипсис и древняя единица измерения
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: воевал с
  rationale: Нифаль глагола לחם с предлогом עִם означает вступать в войну или сражаться с кем-либо; в данном контексте «воевал с» естественно передаёт продолжительное военное противостояние.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: царь аммонитян
  rationale: בְּנֵי עַמּוֹן — обычное обозначение аммонитян как народа; этноним здесь естественнее буквального «сыновья Аммона».
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: и одолел их
  rationale: В военном контексте חזק с עַל указывает на превосходство и победу, а не просто на проявление силы.
- source_word: וַיִּתְּנוּ לוֹ
  choice: дали ему
  rationale: Сохранено основное значение נתן «дать»; характер дара как дани раскрывается контекстом и последующим глаголом «выплатили».
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: сто талантов серебра
  rationale: כִּכָּר — древняя мера веса; традиционный русский эквивалент «талант» сохраняет историческую специфику.
- source_word: עֲשֶׂרֶת אֲלָפִים כֹּרִים חִטִּים
  choice: десять тысяч коров пшеницы
  rationale: כֹּר — древняя мера объёма сыпучих веществ; транслитерация «кор» сохраняет конкретную единицу измерения без ненадёжного пересчёта в современные меры.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: и десять тысяч — ячменя
  rationale: В еврейском тексте единица כֹּרִים при ячмене не повторена, но подразумевается из предыдущей части; русское тире естественно передаёт этот эллипсис.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: то же самое ... выплатили ему
  rationale: Буквально форма от שׁוב означает «вернули/возвратили», однако в контексте повторной дани речь идёт о внесении той же выплаты; «то же самое» сохраняет указательное זֹאת.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: и во второй, и в третий год
  rationale: Формулировка ясно указывает, что одинаковая дань была выплачена в каждом из двух последующих лет.
