translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным историческим звучанием. Синтаксис сделан ясным для широкого читателя; древние меры сохранены без приблизительного пересчёта. Ударение в форме «коров» как множественном числе от «кор» может быть неочевидно, однако контекст меры и сноска устраняют двусмысленность.
