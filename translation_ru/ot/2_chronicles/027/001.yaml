  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: ru
  text: Иофаму было двадцать пять лет, когда он стал царём, и царствовал он в Иерусалиме шестнадцать лет. Его мать звали Иеруша, дочь Садока.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: было двадцать пять лет
  rationale: Естественная русская передача древнееврейской формулы возраста без буквального и неидиоматичного «сын двадцати пяти лет».
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция с ב и инфинитивом указывает на время вступления на престол; выбран ясный и естественный русский эквивалент.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти, а не только обладание титулом.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Прямое местное значение предлога ב.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Современная естественная русская передача формулы именования с сохранением смысла родословного сообщения.
- source_word: יְרוּשָׁה
  choice: Иеруша
  rationale: Транслитерация еврейского личного имени в форме, близкой к источнику и понятной русскому читателю.
- source_word: בַּת צָדוֹק
  choice: дочь Садока
  rationale: Стандартная передача указания на происхождение по отцу.
