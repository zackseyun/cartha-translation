  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: ru
  text: Он построил города в нагорной области Иудеи, а в лесистых местах[a] построил крепости[b] и башни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в лесах»; или: «в зарослях».'
    reason: lexical_alternative
  - marker: b
