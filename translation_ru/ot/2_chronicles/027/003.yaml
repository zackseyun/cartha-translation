source:
  edition: WLC
  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: ru
  text: Он построил верхние ворота дома Яхве и много строил на стене Офела[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провёл большие строительные работы на стене Офела».'
    reason: Выражение לָרֹב допускает как более буквальное «много строил», так и естественную передачу смысла большого объёма работ.
lexical_decisions:
- source_word: בָּנָה
  choice: построил / строил
  rationale: Обычное значение глагола — «строить, сооружать». Повтор глагола в еврейском тексте сохранён; контекст не требует более узкого «перестроил».
- source_word: שַׁעַר
  choice: ворота
  rationale: В архитектурном контексте слово обозначает городские или храмовые ворота; русское множественное «ворота» является естественным соответствием.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» как обозначение храма и передаёт личное имя יהוה транслитерацией.
- source_word: הָעֶלְיוֹן
  choice: верхние
  rationale: Прилагательное определяет расположение ворот; «верхние ворота» естественно и точно передаёт еврейское выражение.
- source_word: וּבְחוֹמַת
  choice: и … на стене
  rationale: Предлог ב при слове «стена» может указывать на место или объект строительных работ. «На стене» сохраняет пространственную формулировку источника, не уточняя характер работ.
- source_word: הָעֹפֶל
  choice: Офела
  rationale: Передано как собственное название укреплённой возвышенности в Иерусалиме; форма родительного падежа соответствует русскому синтаксису.
- source_word: לָרֹב
  choice: много
  rationale: Наречное выражение указывает на большой объём строительных работ. «Много строил» близко к форме источника и сохраняет некоторую неопределённость выражения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским регистром. Сохранены повтор глагола «строить», образ «дома Яхве» и неоднозначность объёма и характера работ на стене Офела.
