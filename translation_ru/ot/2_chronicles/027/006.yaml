  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: ru
  text: Иофам стал сильнее, потому что направлял свои пути пред Господом, своим Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: укрепился
  rationale: Форма хитпаэль от חזק передаёт становление сильным или упрочение положения; «укрепился» сохраняет краткость и возможную широту смысла.
- source_word: הֵכִין דְּרָכָיו
  choice: устроил свои пути
  rationale: הכין означает «утвердить, приготовить, привести в порядок», а «пути» обозначают образ действий и жизненное поведение. «Устроил свои пути» сохраняет образ оригинала и причинную связь.
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  choice: пред Господом, своим Богом
  rationale: «Пред» естественно передаёт идею поведения перед лицом Бога; тетраграмматон по принятой русской библейской традиции передан как «Господь».
theological_decisions:
- issue: Связь силы Иофама с его поведением перед Богом
  choice: сохранена прямая причинная конструкция «потому что»
  alternative: ослабить связь формулировкой «по мере того как» или истолковать её как прямую награду
  rationale: כִּי явно вводит основание сказанного, однако текст не уточняет механизм причинности; перевод не добавляет доктринального объяснения.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранён метафорический оборот «устроил свои пути»; «пред Господом» поддерживает торжественный регистр без архаической перегруженности.
