  - severity: medium
    issue: «устроил свои пути» недостаточно прозрачно для современного литературного русского.
    rationale: Оборот воспроизводит традиционную библейскую лексику, но может пониматься как организационное «устроил». «Направлял свои пути» яснее передаёт הֵכִין как упорядочение и руководство собственным поведением, сохраняя метафору «путей».
