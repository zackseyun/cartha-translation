  source_fidelity: 'Основные элементы переданы верно: דִבְרֵי в царской итоговой формуле — «дела», риторический вопрос сохранён, а титулы «пророк» и «провидец» различены. Однако тире с последующим «в родословных записях» делает трудный оборот לְהִתְיַחֵשׂ неясным и синтаксически выглядит как повторное обозначение самих летописей, тогда как еврейский инфинитив может обозначать назначение, способ организации либо генеалогическую регистрацию, связанную с источником.'
