  terminology: «Ровоам», «Шемая», «Иддо», «Иеровоам», «пророк» и «провидец» приемлемы. «Летописи» уместно передаёт письменные исторические записи. Формулировка «для родословной регистрации» отражает целевое значение инфинитива, а сноска должна прямо сохранять альтернативу, при которой речь идёт об устройстве записей.
