base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: ru
  text: Дела Ровоама[a], первые и последние, не записаны ли в летописях пророка Шемаи и провидца Иддо для родословной регистрации? Между Ровоамом и Иеровоамом шли войны во все их дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в родословных записях»; «для внесения в родословие». Еврейское выражение трудно для понимания; оно может указывать на устройство записей либо на цель их составления и неясно, как именно оно синтаксически связано с упомянутыми источниками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: дела Ровоама
  rationale: В формуле царского заключения דִבְרֵי обозначает дела и события царствования, а не только слова.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: ранние и поздние
  rationale: Передаёт две части царствования и подразумеваемый ими полный его ход, сохраняя парную структуру еврейского текста.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: не записаны ли
  rationale: Сохраняет риторический вопрос и обычную формулу ссылки на письменные источники.
- source_word: בְּדִבְרֵי
  choice: в летописях
  rationale: В данном контексте слово обозначает письменные исторические записи; «летописи» естественно передаёт жанровую функцию источника.
- source_word: הַנָּבִיא
  choice: пророка
  rationale: Обычный русский эквивалент титула נָבִיא.
- source_word: הַחֹזֶה
  choice: провидца
  rationale: Сохраняет отличие титула חֹזֶה от נָבִיא и звучит понятно в современном литературном русском.
- source_word: לְהִתְיַחֵשׂ
  choice: в родословных записях
  rationale: Глагольная форма связана с внесением в родословие; перевод сохраняет вероятную документальную функцию выражения, а его синтаксическая неопределённость отмечена в сноске.
- source_word: וּמִלְחֲמוֹת
  choice: шли войны
  rationale: Именная конструкция естественно развёрнута в русском как сообщение о продолжавшихся войнах.
- source_word: כָּל הַיָּמִים
  choice: во все их дни
  rationale: Сохраняет еврейскую идиому и допускает отнесение к периоду жизни или царствования обоих царей.
