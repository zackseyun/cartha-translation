revisions:
- from: Итак, царь Ровоам укрепился в Иерусалиме и царствовал[a]. Ровоаму был сорок один год, когда он воцарился, и семнадцать лет он царствовал в Иерусалиме — городе, который Яхве избрал из всех колен Израиля, чтобы там пребывало его имя[b]. Его мать звали Наама; она была аммонитянкой.
  to: Царь Ровоам укрепился в Иерусалиме и царствовал[a]. Ровоаму был сорок один год, когда он воцарился, и семнадцать лет он царствовал в Иерусалиме — городе, который Яхве избрал из всех колен Израиля, чтобы поместить там своё имя[b]. Его мать звали Наама; она была аммонитянкой.
  rationale: Убрано не выраженное в оригинале «Итак». Храмовая формула исправлена с «чтобы там пребывало его имя» на «чтобы поместить там своё имя», что точнее передаёт לָשׂוּם и не истолковывает образ. Примечание b заменено на содержательную лексическую альтернативу.
