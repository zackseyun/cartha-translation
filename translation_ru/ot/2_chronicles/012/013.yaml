  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: ru
  text: Царь Ровоам укрепился в Иерусалиме и царствовал[a]. Ровоаму был сорок один год, когда он воцарился, и семнадцать лет он царствовал в Иерусалиме — городе, который Яхве избрал из всех колен Израиля, чтобы поместить там своё имя[b]. Его мать звали Наама; она была аммонитянкой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утвердился в Иерусалиме и царствовал». Еврейский глагол может означать как укрепление, так и прочное утверждение своего положения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы поставить там своё имя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: укрепился
  rationale: Возвратная форма глагола חזק указывает на укрепление положения или обретение прочности; «укрепился» сохраняет эту смысловую широту и уместно передаёт консолидацию власти Ровоама.
- source_word: וַיִּמְלֹךְ
  choice: и царствовал
  rationale: Глагол продолжает повествовательную последовательность и не требует уточнения «начал царствовать»; начало правления отдельно обозначено далее формулой возраста.
- source_word: בְּמָלְכוֹ
  choice: когда он воцарился
  rationale: Инфинитивная конструкция с בְּ имеет временное значение и в царской формуле указывает на момент вступления на престол.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: чтобы там пребывало его имя
  rationale: Русская формулировка естественно передаёт храмовую формулу помещения Божьего имени, не разворачивая её в доктринальное толкование о присутствии или вселении.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: из всех колен Израиля
  rationale: Предлог מִן выражает избрание из всей совокупности израильских колен.
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: Его мать звали Наама
  rationale: Естественная современная русская передача устойчивой царской генеалогической формулы.
- source_word: הָעַמֹּנִית
  choice: она была аммонитянкой
  rationale: Форма женского рода обозначает этническое происхождение Наамы; «аммонитянка» ясно и современно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Формула לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: чтобы там пребывало его имя
  alternative: чтобы поместить там своё имя
  rationale: Выбрана естественная для русского библейского регистра формулировка, сохраняющая конкретный образ имени и не заменяющая его богословским разъяснением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис царской формулы сделан естественным для широкого читателя; имя Яхве передано явно. Все примечания отмечены в основном тексте.
