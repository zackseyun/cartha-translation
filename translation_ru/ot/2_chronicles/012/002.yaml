  terminology: «Ровоам», «Шишак», «Иерусалим» и «Господь» употреблены последовательно и в привычной русской библейской форме. В примечании «совершили преступление против Господа» чрезмерно юридически конкретизирует מעל; лучше дать «вероломно поступили против Господа» и пояснить нарушение верности завету.
