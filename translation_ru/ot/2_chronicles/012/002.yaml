  verdict: revise
  source_fidelity: 'Основной смысл передан верно: датировка относится к пятому году царствования Ровоама; Шишак, царь Египта, двинулся против Иерусалима; כִּי вводит причинное объяснение. «Выступил против» удачно передаёт военный оборот עָלָה עַל, не утверждая уже совершившийся штурм. Однако «нарушили верность Господу» не является естественным русским сочетанием: верность обычно хранят, сохраняют или проявляют, тогда как нарушают обещание, закон либо договор. Следует заменить его на более идиоматичную формулировку, сохраняющую значение מעל как вероломного нарушения верности.'
