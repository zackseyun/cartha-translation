lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: На пятом году царствования Ровоама
  rationale: Русская формула естественно передаёт датировку по году правления; וַיְהִי выполняет повествовательную функцию и не требует отдельного буквального соответствия.
- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  choice: выступил против Иерусалима
  rationale: Военный оборот עלה על обозначает враждебное продвижение против города; «выступил против» сохраняет движение и не уточняет преждевременно, начался ли уже штурм.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: египетский царь Шишак
  rationale: Естественный русский порядок слов для титула и имени при сохранении исторического имени в принятой русской библейской форме.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит прямую причинную связь между вторжением и неверностью.
- source_word: מָעֲלוּ בַּיהוָה
  choice: они нарушили верность Господу
  rationale: Глагол מעל выражает нарушение доверия или заветной верности; формулировка передаёт действие и религиозно-нравственную тяжесть без сведения смысла к общему «согрешили».
- source_word: יהוה
  choice: Господь
  rationale: Тетраграмматон передан традиционным и понятным русским соответствием «Господь».
theological_decisions:
- issue: Богословская причинность нашествия Шишака
  choice: потому что они нарушили верность Господу
  alternative: потому что они были неверны Господу; ибо они совершили преступление против Господа
  rationale: Текст прямо связывает политическое бедствие с нарушением верности Господу. Перевод сохраняет эту причинность и заветно-реляционный смысл глагола מעל, не добавляя объяснений сверх текста.
