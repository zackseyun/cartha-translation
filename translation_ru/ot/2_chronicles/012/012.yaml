base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: ru
  text: Когда он смирился, гнев Яхве отступил от него, так что Яхве не уничтожил его окончательно[a]. И в Иудее также было доброе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально: «и не уничтожить окончательно». Оно передаёт результат или цель отступления гнева; объект уничтожения в тексте прямо не назван.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение имеет широкий смысл и может обозначать достойные одобрения дела, обстоятельства или иные явления в Иудее.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: Когда он смирился
  rationale: Предлог ב при инфинитиве передаёт временное значение, а форма хитпаэль глагола כנע здесь указывает на сознательное смирение Ровоама.
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: гнев Яхве отвратился от него
  rationale: Оборот сохраняет образ гнева, который отступает от человека, не заменяя его более толковательным «Яхве смилостивился».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: и Яхве не предал его полному уничтожению
  rationale: Формулировка передаёт усилительное значение לְכָלָה — уничтожение до конца — и ясно выражает подразумеваемого деятеля; местоимение «его» следует ближайшему контексту, хотя в еврейском объект прямо не назван.
- source_word: הָיָה דְּבָרִים טוֹבִים
  choice: было нечто доброе
  rationale: 'Так сохраняется широкое значение דְּבָרִים: речь может идти о делах, обстоятельствах или иных достойных одобрения явлениях, а не обязательно только о нравственных поступках.'
theological_decisions:
- issue: Соотношение Божьего гнева и смягчения суда
  choice: гнев Яхве отвратился от него, и Яхве не предал его полному уничтожению
  alternative: Яхве смилостивился и не уничтожил его
  rationale: Выбранный вариант сохраняет и реальность гнева, и ограничение суда вследствие смирения, не представляя последствия как полностью отменённые.
- issue: Смысл доброго в Иудее
  choice: в Иудее было нечто доброе
  alternative: в Иудее совершались добрые дела
  rationale: Еврейская формулировка намеренно широка и не позволяет уверенно свести сказанное только к поступкам, духовной реформе или благополучию.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. «Отвратился» сохраняет образность оригинала; «нечто доброе» звучит естественно и не сужает смысл.
