base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: ru
  text: Когда царство Ровоама утвердилось и он окреп, он оставил закон Яхве[a], и весь Израиль — вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление Яхве». Еврейское слово тора может означать «закон» или «наставление» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: И когда… утвердилось
  rationale: Оборот вводит временное обстоятельство, а форма от כון передаёт упрочение и утверждение царства; буквальное «и было, когда» в современном русском излишне тяжеловесно.
- source_word: מַלְכוּת רְחַבְעָם
  choice: царство Ровоама
  rationale: «Царство» естественно передаёт здесь и царскую власть, и подвластное Ровоаму государство, не сужая значение до личного статуса царя.
- source_word: וּכְחֶזְקָתוֹ
  choice: и он окреп
  rationale: Фраза указывает на достигнутую Ровоамом силу и устойчивость; личное местоимение делает подразумеваемый субъект ясным по-русски.
- source_word: עָזַב
  choice: оставил
  rationale: Глагол передаёт сознательный отход от закона; «оставил» звучит естественно и сохраняет контекстуальную силу без архаизма.
- source_word: תּוֹרַת יְהוָה
  choice: закон Яхве
  rationale: В историко-заветном контексте תּוֹרָה уместно передать как «закон», при этом возможное значение «наставление» отмечено в сноске. Личное имя יהוה передано как «Яхве».
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: а с ним — и весь Израиль
  rationale: Сохраняется лаконичность еврейского эллиптического оборота и подчёркивается, что весь Израиль последовал за Ровоамом в этом отступлении.
theological_decisions:
- issue: Объём выражения «весь Израиль» после разделения царства
  choice: Сохранено «весь Израиль» без уточнения состава народа.
  alternative: «вся Иудея» или «весь его народ»
  rationale: Хроники могут называть Израилем заветный народ, связанный в данном контексте с царством Ровоама. Перевод не устраняет историко-богословскую неоднозначность исходного текста.
- issue: Значение תּוֹרָה
  choice: В основном тексте — «закон», в сноске — «наставление».
  alternative: «наставление Яхве» в основном тексте
  rationale: «Закон» узнаваем и уместен в повествовании о заветной неверности, однако семантическая широта תּוֹרָה сохранена посредством сноски.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; тире перед «и весь Израиль» передаёт присоединительный акцент еврейской фразы.
