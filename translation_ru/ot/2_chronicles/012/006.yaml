  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: ru
  text: 'Тогда предводители Израиля[a] и царь смирились и сказали: «Праведен Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предводители Израиля». В данном контексте некоторые понимают эти слова как указание именно на предводителей Иудеи при Ровоаме, однако в самом тексте сказано «Израиль».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: смирились
  rationale: Нифаль глагола כנע здесь передаёт добровольное смирение и подчинение в ответ на пророческое обличение; возвратная форма «смирились» естественна по-русски.
- source_word: שָׂרֵי
  choice: предводители
  rationale: שָׂרִים обозначает высокопоставленных правителей или начальников. «Предводители» сохраняет руководящий статус этих лиц и звучит понятно в современном литературном русском.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Масоретский текст прямо называет Израиль. Несмотря на исторический контекст Иудеи при Ровоаме, перевод не заменяет исходное название толковательным уточнением.
- source_word: וְהַמֶּלֶךְ
  choice: и царь
  rationale: Прямо передаёт сочинённую именную группу и отличает царя от предводителей.
- source_word: וַיֹּאמְרוּ
  choice: и сказали
  rationale: Форма множественного числа относится к предводителям и царю; явное русское сказуемое естественно продолжает повествовательную последовательность.
- source_word: צַדִּיק
  choice: праведен
  rationale: Предикативное прилагательное утверждает нравственную правоту Яхве, в том числе справедливость Его суда. «Праведен» сохраняет богословскую ёмкость слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное Божье имя, стоящее в еврейском тексте, а не замещающий его титул.
theological_decisions:
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Форма «Яхве» передаёт это имя, не подменяя его титулом.
- issue: Сохранять ли «Израиль» или согласовать название с историческим контекстом Иудеи
  choice: Израиль
  alternative: Иуда
  rationale: Еврейский текст недвусмысленно говорит «Израиль». Замена на «Иуду» устранила бы значимое напряжение текста посредством толковательной гармонизации.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Сохранены лаконичная повествовательная структура, личное имя Яхве и исходное обозначение «Израиль»; двоеточие естественно вводит прямую речь.
