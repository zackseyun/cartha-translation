  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: ru
  text: 'с тысячью двумястами колесницами и шестьюдесятью тысячами всадников; народу, пришедшему с ним из Египта, не было числа[a]: ливийцы, суккии[b] и кушиты[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ был неисчислим».'
    reason: lexical_alternative
  - marker: b
    text: «Суккии» — передача названия народа, точная идентификация которого неизвестна; возможна также транслитерация «сукким».
    reason: cultural_note
  - marker: c
    text: 'Или: «эфиопы»; «кушиты» точнее передаёт древнееврейский этногеографический термин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: с тысячью двумястами колесницами
  rationale: Предлог בְּ при перечислении войск передаёт сопровождение или наличие; собирательное רֶכֶב при числительном естественно передано исчисляемым «колесницами».
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: и шестьюдесятью тысячами всадников
  rationale: פָּרָשִׁים обозначает конных воинов; «всадники» — ясный и уместный для исторического повествования русский эквивалент.
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: народу … не было числа
  rationale: Перевод сохраняет образ и синтаксическую силу еврейской идиомы, означающей неисчислимое множество.
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: пришедшему с ним из Египта
  rationale: Причастный оборот естественно передаёт определительное предложение и сохраняет указание на происхождение сопровождавших его людей.
- source_word: לוּבִים
  choice: ливийцы
  rationale: Это общепринятое русское обозначение народа, связанного с Ливией, без ненужной транслитерации формы «лувим».
- source_word: סֻכִּיִּים
  choice: суккии
  rationale: Точная идентификация этнонима неясна, поэтому выбрана прозрачная транслитерация, не приписывающая ему спорной географической конкретики.
- source_word: וְכוּשִׁים
  choice: и кушиты
  rationale: «Кушиты» непосредственно отражает древнееврейский этногеографический термин и избегает возможного анахронизма в слове «эфиопы».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранена образная еврейская формула «не было числа», а малоизвестные этнонимы переданы без искусственной конкретизации. Точка с запятой отделяет перечень военной силы от описания неисчислимого множества сопровождавших людей.
